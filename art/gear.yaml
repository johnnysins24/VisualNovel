# ของสวมใส่: วัสดุหกอย่างและแบบ 36 แบบ (แผน "ทางออกของไอเดียเจ็ดข้อ" ข้อ 2: ของหนึ่งชิ้น = แบบ x วัสดุ x ระดับ)
# ไอคอนของแบบ <id> คือ art/icons/gear_<id>.yaml วาดครั้งเดียว ส่วนที่ทำจากวัสดุของชิ้นนั้นใช้วัสดุชื่อ main
# ตอนสร้างไฟล์ของเกม (npm run draw -- build) main ถูกเปลี่ยนเป็น ramp ของวัสดุทีละอย่าง ได้ public/icons/gear_<id>.png
# ที่มีหกช่องเรียงซ้ายไปขวาตามลำดับ materials ข้างล่าง ค่าพลัง ราคา และป้ายของแต่ละชิ้นเป็นงานของชุด 2 (content/)
