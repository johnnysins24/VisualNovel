# ศัตรูทรงคน: ไม่วาดใหม่ ประกอบจากร่างฐานและชิ้นส่วนที่เกมมีอยู่ (art/pieces) แล้วเปลี่ยนสีด้วย palette
# ตามคัมภีร์โลก หัวข้อสัตว์ประหลาดรุ่นแรก  `npm run draw -- build` สร้าง public/foes/<id>.png สองท่าเหมือนศัตรูตัวอื่น:
# idle = ยืนหน้าเฉย, strike = หน้าโกรธ โน้มตัวเข้าหา
#   npc:  { group, seed, body?, race? }  หยิบคนจากสูตร NPC ใน art/npcs.yaml (คนเดิมทุกครั้งที่ seed เดิม)
#   look: { body, pieces, choices, colors }  กำหนดเองทั้งตัว (colors เปลี่ยน ramp ของวัสดุใดก็ได้ รวมถึง skin, eye)
#   face / strike_face: สีหน้าของสองท่า (ค่าเริ่มต้น neutral กับ angry)
ash_soldier:
  name: ทหารเถ้า
  look:
    body: m
    pieces: [face/basic, under/briefs, body/halfplate, feet/iron_boots, head/helm, weapon/spear, offhand/shield]
    colors: { skin: metal_black, lip: metal_black, blush: metal_black, eye: eye_amber, white: metal_black, lash: metal_black, hair: metal_black, metal: metal_black, chain: metal_black, fitting: metal_demoncoal, cloth: dye_black, trim: dye_wine, leather: leather_black }
