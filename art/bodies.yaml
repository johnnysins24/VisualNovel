# Age stages (thread "Fix newborns showing as children", 2026-11-10): the game picks the body from the
# human-equivalent age (src/sprites/looks.ts stageOf). Every one keeps the adult head of its sex
# (`like`), so the 17 faces, ears and horns fit; only the body under the head changes.
#   baby 0-1 (bm, bf): sits on the floor, legs out, no neck; a newborn (age 0) is swaddled in a basket.
#     Both use the softer female face (blush, small mouth): the male brows read as a frown on a baby
#   toddler 2-4 (tm, tf): stands, 30 px, round belly, short legs; wears the child clothes
#   child 5-11 (cm, cf, above)
#   teen 12-15 (ym, yf): 3 heads, 44-45 px, slimmer than grown-ups; wears the grown-up clothes but
#     never `grown: true` pieces (beards, wrinkles)
#   adult 16+ (m, f)
# `age` names the stage for pieces' `ages`; `wears` = other stages whose clothes fit this body;
# `bare` = slots it never wears (a baby holds no weapon and wears no hat or shoes).
bm:
  like: f
  age: baby
  bare: [weapon, offhand, arm, over, cloak, head, feet, acc]
  marks: { head: 69, brow: 75, mouth: 81, chin: 83, neck: 84, shoulder: 85, chest: 86, waist: 88, hip: 89, crotch: 91, knee: 92, ankle: 93, sole: 93, hand: 90 }
  cols: { hand: -8, ohand: 8 }
  parts:
    skull: { sym: [[69, 2], [70, 4], [71, 5], [72, 6], [79, 6], [80, 5]] }
    face: { sym: [[74, 4], [80, 4], [81, 3], [82, 3], [83, 2]] }
    torso: { sym: [[84, 3], [85, 5], [86, 6], [90, 6], [91, 5]] }
    arm: { mirror: true, span: [[86, -8, -6], [88, -8, -6], [89, -9, -7], [90, -9, -7]] }
    leg: { mirror: true, span: [[91, -7, -1], [92, -9, -1], [93, -9, -3]] }

