# Outfit pieces (Art decisions A21-A23, Phupha 2026-11-07), by slot, with the Thai name the player
# sees. Clothes fit both grown-up bodies unless the piece says `body:`; child outfits are only for
# the child bodies (`ages: [child]`). `feet` under body pieces is what the preview pairs them with.
# Colours: cloth (main dye), trim (second dye), leather, metal, fitting; any ramp of the same kind
# in palette.yaml (dye_*, leather_*, metal_*) can replace a piece's default.
