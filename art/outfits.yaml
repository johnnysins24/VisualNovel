  acc/eyepatch: { name: ผ้าปิดตา }
  acc/glasses: { name: แว่นกลม }
# marks on the skin (A26): drawn under the face so they never cover an expression
mark:
  mark/wrinkles: { name: รอยย่นวัยชรา }
  mark/scar_cheek: { name: แผลเป็นที่แก้ม }
  mark/scar_brow: { name: แผลเป็นที่คิ้ว }
  mark/freckles: { name: กระ }
