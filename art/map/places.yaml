# Every named place on the world map (art/kit/map.mjs), in the year 312 of the Sealed Era.
#   at:       map pixel; for a sprite, the middle of its bottom row
#   sprite:   a small picture from art/map/palette.yaml; extra: more pictures nearby
#   district: a city drawn as packed roofs inside `poly` (wall: the old town's wall)
#   pillar:   a sky pillar (w, h in px; broken: the stump), drawn over everything near it
#   farms:    the fields round a village reach this far (px)
#   lights:   lamps, windows and fires that light up at dusk and night (warm, star, fire, ember)
#   smoke:    chimney smoke (mat: rust for the demon-coal furnaces of Hordun)
#   label:    where the overlay writes the name (default: under the place); minor: small print;
#             false: no name. note: one line of lore for the map's tooltip and the poster.
#   tag:      the game's location tag (src: location_tag) the place stands for, if any
#   pin:      the game's "you are here" pin for this tag (one place per tag)
#   home:     origin flags (content/events/00_birth.yaml) of the children born here; while the
#             player is back in their home tag the pin stands here instead
# Names and notes are from the world bible and the story events; nothing here tells a secret.

