# แผ่นดินเจ็ดเสา: the land and water of the world map (art/kit/map.mjs). Coordinates are map pixels
# on a 640 x 400 picture, north up. One day on foot is about 25 px, so the continent is some twenty
# days across. The layout follows the world bible's sketch map (Isel's pillar in the west of Arvel,
# Belek's at Kardin in the east, Verus's at Ventras on the south coast, Ileth west, Hordun north,
# the Ashland east) and the distances in the story: the temple of Isel three days along the rails
# from Ventras, the market town half a day from บ้านเงาเสา, the railhead two days short of the stump
# and seven from Ventras, Fort Three half a day from บ้านหญ้าเงิน, Ulwen's pillar a day from
# บ้านกิ่งลม and a day from Talis's. Places and their pictures are in places.yaml.
