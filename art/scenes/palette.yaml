# Colours for scene backgrounds (art/kit/scene.mjs). Ramps are 5 steps, dark (0) to light (4), soft
# and a little cooler than the sprites, so the figure in front always reads first. Quote colours.
outline: '2b2840' # the sprites' outline; scenes use it (as `ink`) only round near props
star: 'f4f2ff'

# Times of day. sky: colours from the top of the picture to the horizon. mul and tint change every
# colour that is not a light (a material with `lit` switches to its lit ramp at dusk and night; one
# with `glow: true` is never tinted). body: the sun or moon.
times:
  day: { sky: ['8fb6e0', 'b4d0ec', 'dbe7f3'], mul: [1, 1, 1], tint: ['ffffff', 0], lights: false, body: 'fff8dc' }
  dusk: { sky: ['5b4c7e', 'b77c95', 'f0b57e'], mul: [1, 0.84, 0.8], tint: ['8a5a7a', 0.2], lights: true, body: 'ffcf86' }
  night: { sky: ['161a33', '232c50', '35426b'], mul: [0.4, 0.46, 0.66], tint: ['1c2142', 0.22], lights: true, stars: true, body: 'eceeff' }

# Rooms (`interior: true`): the light inside. Night is lamplight, warm and low, not moonlight; the
# sky shows only through windows (`pane`), in the outdoor colours above.
interior_haze: '6b5a5e'
interior_times:
  day: { sky: ['8c7f78', '8c7f78'], mul: [1, 0.98, 0.95], tint: ['ffffff', 0], lights: false, body: 'ffffff' }
  dusk: { sky: ['8c7f78', '8c7f78'], mul: [0.9, 0.78, 0.72], tint: ['7a4a52', 0.16], lights: true, body: 'ffffff' }
  night: { sky: ['8c7f78', '8c7f78'], mul: [0.62, 0.52, 0.5], tint: ['3a2a3e', 0.2], lights: true, body: 'ffffff' }

