# The Star Counting Tower in Ileth: an observatory room in the crown of the great tree. Walls of
# living wood, the roof open on the sky (stars at night, and their count) with branches across it,
# a brass telescope, the ledger of the count on its desk, star charts, blue lamps. The room is 8 m
# wide; its walls stop at 3.4 m and the sky shows above them.
ceiling: 3.4
width: 8
back: 90
layers:
  - sky: { horizon: 40 }
  - stars: { count: 90, below: 40 }
  - clouds: { count: 2, y: [6, 18], seed: 4 }
  - line: { from: [[-40, 2], [120, 22]], w: 3, mat: wood }
  - line: { from: [[300, 4], [150, 20]], w: 3, mat: wood }
  - wall: { y0: 25, y1: 90, mat: wood, pattern: logs, skirt: plank }
  - floor: { y0: 91, mat: plank, pattern: boards, board: 8 }
  - sides: { mat: wood, pattern: logs, skirt: plank, left: -1.0, right: -0.6 }
  - canopy: { x: [-30, 70], y: 10, count: 9, r: [6, 11], mat: elf_leaf, seed: 1 }
  - canopy: { x: [186, 286], y: 10, count: 9, r: [6, 11], mat: elf_leaf, seed: 2 }
  - canopy: { x: [90, 170], y: 2, count: 3, r: [4, 7], mat: elf_leaf, seed: 3 }
  - furn: { kind: chart, at: [76], on: 1.4, dm: 1.1, mat: slate }
    outline: true
  - furn: { kind: chart, at: [180], on: 1.4, dm: 1.1, mat: slate }
    outline: true
  - furn: { kind: sconce, at: [108], on: 1.7, light: star_dew, glow: { r: 12, colour: 'bad8fa' } }
  - furn: { kind: sconce, at: [148], on: 1.7, light: star_dew, glow: { r: 12, colour: 'bad8fa' } }
  - furn: { kind: telescope, at: [116, 96] }
    outline: true
  - furn: { kind: table, side: right, at: [0.95, 101], wm: 1.5, items: ledger }
    outline: true
  - furn: { kind: candles, side: right, at: [0.45, 101], on: 0.76, hm: 0.3 }
  - furn: { kind: bookcase, side: left, at: [0.3, 94], along: { to: 103, every: 1.1 }, hm: 2.2 }
    outline: true
  - furn: { kind: plant, side: right, at: [0.4, 109], hm: 1.2, mat: plank, leaf: elf_leaf }
    outline: true
  - furn: { kind: rug, at: [128, 111], wm: 3.0, dm: 3.0, mat: elf_leaf, trim: gold }
  - glow: { at: [216, 74], r: 10, colour: 'ffd27a', only: [dusk, night] }
  - vignette: { strength: 0.35 }
