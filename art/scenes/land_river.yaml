# แม่น้ำเฒ่า (the Old River): the water steps of Ventras before the lamps go out. The far bank is the
# city, Verus's sky pillar behind it. In the river lies a back as long as the reach, a brow and two
# whiskers on the water; further out the same back shows again. Boatmen throw the year's first coin
# here and nobody empties slops into the water after dark.
# The fish is a studio drawing (art/props/land_catfish.yaml).
