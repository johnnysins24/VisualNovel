# Ventras street (world bible scene 2): a brick street of tall houses running straight away, sky
# lamps along both pavements, a carriage on the cobbles, roofs with star-dew dishes and the airship
# tower over the river district at the far end, and Verus's pillar behind it all. Best at dusk and
# night, when every window and lamp is lit. The street is 14 m wide between houses 13 m tall. The
# pillar stands right of the middle and the lamps are placed by hand, so none rises behind a head.
ceiling: 13
width: 14
back: 61.5
layers:
  - sky: { horizon: 60 }
  - stars: { count: 70, below: 50 }
  - body: { day: [50, 12, 6], dusk: [206, 40, 9], night: [60, 14, 5] }
  - clouds: { count: 5, y: [4, 24], seed: 7 }
  - pillar: { x: 152, w: 6, base: 59 }
    haze: 0.4
  - prop: { art: airship, at: [80, 10] }
    haze: 0.4
  - furn: { kind: tower, at: [0, 61.6], xm: -24, wm: 8, hm: 56 }
    haze: 0.35
  - skyline: { base: 61, w: [3, 7], h: [3, 9], gap: 0, wall: brick, roof: slate, windows: 0.5, chimneys: 0.4, dishes: 0.3 }
    haze: 0.3
  - floor: { y0: 61, mat: stone, pattern: flags, tile: 10 }
  - road: { y: [61, 111], wm: 8.4, mat: dark_stone }
  - sides: { mat: brick, pattern: brick, left: -0.9, right: -0.4, windows: { every: 4, w: 1.2, h: 1.8, storey: 3.4, sill: 0.9, frame: plaster }, skirt: dark_stone }
