# กวางไม่มีเขา (the Hornless Doe): deep Ileth, where the old trunks stand so far apart that a herd
# could walk between them, and one thing does. She is as tall as the crowns and far enough off to be
# the colour of the mist. Nobody fells a living tree here or hunts a beast with young at foot.
