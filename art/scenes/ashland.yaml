# The Ashland: a grey plain of ash and silver grass under a low sky, ember glowing in the cracks,
# a line of the Seal Wardens' standing stones (human height) running away across the plain, and the
# broken stump of the dead god's pillar on the horizon.
layers:
  - sky: { horizon: 60 }
  - stars: { count: 50, below: 50 }
  - body: { day: [200, 18, 6], dusk: [40, 52, 9], night: [190, 20, 5] }
  - clouds: { count: 9, y: [2, 30], seed: 9, size: 30 }
  - pillar: { x: 74, w: 7, base: 59, top: 16 }
    haze: 0.45
  - ridge: { mat: far, base: 61, amp: 4, scale: 0.02, seed: 21 }
    haze: 0.5
  - ground: { y: 61, mat: ash, tufts: 70, tuft: silver_grass }
  - cracks: { y: [64, 111], count: 16, seed: 2 }
  - furn: { kind: seal_stone, at: [150, 64], along: { to: [12, 104], every: 14 } }
    outline: true
  - furn: { kind: fern, at: [0, 84], xm: 5.5, hm: 0.45, mat: silver_grass }
  - furn: { kind: fern, at: [0, 96], xm: -4.2, hm: 0.4, mat: silver_grass }
  - furn: { kind: fern, at: [0, 109], xm: 3.4, hm: 0.5, mat: silver_grass }
