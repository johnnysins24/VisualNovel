# Ship deck: on the deck of a royal ship or an airship, rail and rigging, the envelope overhead,
# clouds and far land below.
layers:
  - sky: { horizon: 90 }
  - stars: { count: 80, below: 70 }
  - body: { day: [200, 30, 6], dusk: [40, 70, 10], night: [214, 24, 5] }
  - clouds: { count: 6, y: [30, 70], seed: 3, size: 30 }
  - ridge: { mat: far, base: 92, amp: 6, scale: 0.03, seed: 9 }
    haze: 0.55
