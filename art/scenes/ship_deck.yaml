# Ship deck: on the deck of an airship (a royal ship flies the same way). The brass railing at the
# deck's edge, the gas envelope overhead with its rigging, the wheel, cargo lashed down, and the sea
# of clouds with far land below the horizon.
layers:
  - sky: { horizon: 62 }
  - stars: { count: 80, below: 58 }
  - body: { day: [210, 30, 7], dusk: [40, 56, 9], night: [190, 22, 5] }
  - clouds: { count: 6, y: [24, 52], seed: 5, size: 26 }
  - ridge: { mat: far, base: 64, amp: 3, scale: 0.02, seed: 3 }
    haze: 0.55
  - ground: { y: 66, mat: grass, noise: 1.2 }
    haze: 0.6
  - field: { y0: 70, y1: 80, mat: field, x0: -256, x1: 511 }
    haze: 0.55
  - clouds: { count: 9, y: [64, 82], seed: 7, size: 34 }
  - floor: { y0: 86, mat: plank, pattern: boards, board: 9 }
  - furn: { kind: railing, at: [128, 86], wm: 22 }
    outline: true
  - envelope: { base: -6, sag: 28, rx: 150, mat: canvas }
  - line: { from: [[50, 14], [8, 69]], mat: thatch }
  - line: { from: [[74, 18], [44, 69]], mat: thatch }
  - line: { from: [[182, 18], [212, 69]], mat: thatch }
  - line: { from: [[206, 14], [248, 69]], mat: thatch }
  - furn: { kind: helm, at: [190, 97] }
    outline: true
  - furn: { kind: barrel, at: [222, 98] }
    outline: true
  - furn: { kind: crates, at: [40, 100] }
    outline: true
  - furn: { kind: cannon, at: [232, 109], flip: true }
