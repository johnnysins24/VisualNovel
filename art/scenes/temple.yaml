# Temple: a stone hall that serves any of the six gods. A stone altar on its steps under the great
# hanging lamp (Verus's lamp burns in every temple), tall arched windows, columns down both sides,
# candle stands, benches either side of the aisle; weddings and funerals. The hall is 11 m wide and
# its back wall 10 m behind the figures; the vault is above the picture.
interior: true
ceiling: 7
width: 11
back: 82
layers:
  - wall: { y0: 0, y1: 82, mat: stone, pattern: blocks, skirt: dark_stone }
  - floor: { y0: 83, mat: stone, pattern: flags, tile: 14 }
  - sides: { mat: stone, pattern: blocks, skirt: dark_stone }
  - pane: { at: [128], wm: 1.6, hm: 3.4, on: 1.8, arch: true, frame: stone, frame_bg: stone }
  - pane: { at: [84], wm: 1.0, hm: 2.6, on: 2.2, arch: true, frame: stone, frame_bg: stone }
  - pane: { at: [172], wm: 1.0, hm: 2.6, on: 2.2, arch: true, frame: stone, frame_bg: stone }
  - furn: { kind: rug, at: [128, 111], wm: 1.6, dm: 9.6, mat: red_cloth, trim: gold }
  - furn: { kind: step, at: [128, 84], wm: 4.4, hm: 0.25, top: 3.0 }
    outline: true
  - furn: { kind: altar, at: [128, 84], on: 0.5, wm: 1.8 }
    outline: true
  - furn: { kind: candles, at: [104, 85] }
