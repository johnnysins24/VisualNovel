# Temple: a stone hall that serves any of the six gods, a stone altar under the great hanging lamp
# (Verus's lamp burns in every temple), columns, tall arched windows, candles; weddings and funerals.
interior: true
layers:
  - wall: { y0: 0, y1: 92, mat: bone, pattern: blocks }
  - pane: { x: 40, y: 14, w: 16, h: 40, arch: true, frame: stone, frame_bg: bone }
  - pane: { x: 200, y: 14, w: 16, h: 40, arch: true, frame: stone, frame_bg: bone }
    repeat: [-320, -440, 80, 200]
  - furn: { kind: banner, at: [92, 56], w: 12, h: 40, mat: cloth, sign: gold }
  - furn: { kind: banner, at: [152, 56], w: 12, h: 40, mat: cloth, sign: gold }
  - floor: { y0: 93, mat: stone, pattern: flags, tile: 18, depth: 90, carpet: [8, 22], carpet_mat: red_cloth }
  - furn: { kind: column, at: [14, 92], w: 8, h: 92 }
    outline: true
  - furn: { kind: column, at: [74, 92], w: 8, h: 92 }
    outline: true
  - furn: { kind: column, at: [174, 92], w: 8, h: 92 }
    outline: true
