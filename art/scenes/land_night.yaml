# เค้ากลางคืน (the Night Owl): the ash plain on the dark of the moon. The only primordial awake comes
# over the stump of Astel's pillar, and the sky she covers has no stars in it. People sit with their
# heads down and count nothing. By day this is the picture of the night that lasted till noon.
# The owl is a studio drawing (art/props/land_owl.yaml).
layers:
