  - furn: { kind: drawers, at: [4, 92], w: 80, h: 84, cell: 11, cellh: 7 }
    outline: true
  - furn: { kind: drawers, at: [172, 92], w: 80, h: 84, cell: 11, cellh: 7 }
    outline: true
  - furn: { kind: drawers, at: [-172, 92], w: 80, h: 84, cell: 11, cellh: 7 }
    outline: true
    repeat: [512]
  - furn: { kind: column, at: [-84, 92], w: 8, h: 92, mat: dark_stone }
    outline: true
    repeat: [340, 504]
