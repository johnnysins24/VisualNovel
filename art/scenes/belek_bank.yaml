    outline: true
  - prop: { at: [90, 70], ascii: "M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M\nM.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M\nM.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M\nM.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M.M\nMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM" }
