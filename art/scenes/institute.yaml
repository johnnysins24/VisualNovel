    outline: true
  - furn: { kind: table, at: [64, 100], w: 30, h: 14 }
    outline: true
  - prop: { at: [70, 86], ascii: "..yYy..\n.y...y.\ny..Q..y\n.y...y.\n..yyy..\n...y...\n..yyy.." }
