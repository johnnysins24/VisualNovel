      weapon: [weapon/axe, weapon/crossbow, weapon/mace, ~]
      offhand: [offhand/dagger, offhand/dagger, ~]
    chance: { mark/scar_brow: 0.2 }
    colors: { cloth: [dye_black, dye_earth, dye_grey], trim: [dye_black, dye_earth] }
  dockrat:
    name: หนูท่า
    races: [human, human, human, tiefling, tiefling, dwarf]
    wear: [body/farmer, body/overalls]
    slots:
      head: [head/knit_cap, head/kerchief, head/cap, ~]
      offhand: [offhand/dagger, ~, ~]
    chance: { acc/purse: 0.3, acc/eyepatch: 0.1, acc/face_scarf: 0.12, mark/scar_cheek: 0.15 }
    colors: { cloth: [dye_earth, dye_grey, dye_navy, dye_black], trim: [dye_grey, dye_earth, dye_wine] }
  clerk:
    name: เสมียน
    races: [human, human, human, dwarf, elf]
    wear: [body/doublet]
    slots:
      offhand: [offhand/tome, ~]
    chance: { acc/glasses: 0.5 }
    old: 0.2
    colors: { cloth: [dye_grey, dye_black, dye_navy], trim: [dye_white] }
  noble:
    name: ขุนนาง
    races: [human]
    wear: [body/doublet, body/dress]
    slots:
      head: [head/tophat, head/feathered, ~, ~]
      cloak: [cloak/cape, cloak/fur, ~]
    chance: { arm/silver: 0.1, acc/glasses: 0.1 }
