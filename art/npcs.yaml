# NPC recipes (A25, Phupha 2026-11-07): an NPC is never drawn on its own. It is a look put together
# from the shared pieces, picked at random from its group's recipe with a seed, so the same seed always
# gives the same person (art/kit/npc.mjs, npcLook). Groups follow the story thread's list for the
# grown-up years (factions from the world bible). Named characters get a fixed look under `named`.
#
# A group:
#   name     Thai name of the group
#   bodies   bodies to pick from (default [m, f]); a child group uses [cm, cf]
#   races    races to pick from, repeat a race to make it likelier (default [human])
#   wear     one of these body pieces (those that fit the body); its feet come from outfits.yaml
#   always   pieces every member wears
#   slots    for each slot, one option; ~ = nothing (repeat ~ to make "nothing" likelier)
#   chance   piece: probability that it is added on its own
#   colors   material: ramps to pick from (palette.yaml)
#   god      true = a cleric's god is picked (or given) and its colours from `gods` are used
#   old      probability of an old member: old-age lines and, half the time, silver hair
# Every member also gets a random skin, hair colour, eye colour, hairstyle from hair.yaml, the race's
# pieces from races.yaml (a grown dwarf always a beard, other grown men sometimes a moustache) and now and then a scar or
# freckles (`marks` below).
marks: { mark/scar_cheek: 0.05, mark/scar_brow: 0.05, mark/freckles: 0.12 }
facial_hair: { dwarf: 1, other: 0.35 } # chance a grown man wears his race's beard or moustache

# Colours of the six living gods (world bible): robe stole (trim) and holy symbol metal (fitting).
gods:
  verus: { name: เวรัส, colors: { trim: dye_mustard, fitting: metal_brass } }
  isel: { name: อีเซล, colors: { trim: dye_wine, fitting: metal_brass } }
  talis: { name: ทาลิส, colors: { trim: dye_sky, fitting: metal_silver } }
  ossa: { name: ออสซา, colors: { trim: dye_black, fitting: metal_iron } }
  ulwen: { name: อุลเวน, colors: { trim: dye_moss, fitting: metal_brass } }
  belek: { name: เบเลค, colors: { trim: dye_grey, fitting: metal_black } }

groups:
  navy:
    name: ทหารราชนาวี
    races: [human, human, human, dwarf, elf]
    wear: [body/longcoat]
    slots:
      head: [head/cap, head/cap, ~]
      weapon: [weapon/longsword, weapon/musket, ~]
      offhand: [offhand/pistol, ~, ~]
    chance: { acc/gloves: 0.3 }
    colors: { cloth: [dye_navy], trim: [dye_white, dye_mustard], fitting: [metal_brass] }
  warden:
    name: ผู้เฝ้าผนึก
    races: [human, human, dwarf, tiefling, tiefling]
    wear: [body/chainmail, body/leather_armor]
    always: [over/tabard]
    slots:
      head: [head/helm, head/hood, ~]
      weapon: [weapon/spear, weapon/longsword, weapon/mace]
      offhand: [offhand/shield, offhand/lantern, ~]
    old: 0.1
    colors: { cloth: [dye_grey], trim: [dye_wine], metal: [metal_iron, metal_black] }
  mercenary:
    name: ทหารรับจ้าง
    races: [human, human, human, dwarf, tiefling]
    wear: [body/leather_armor, body/chainmail]
    slots:
      head: [head/helm, head/kerchief, ~, ~]
      weapon: [weapon/axe, weapon/longsword, weapon/crossbow, weapon/mace]
      offhand: [offhand/shield, offhand/dagger, ~]
    chance: { mark/scar_cheek: 0.25, mark/scar_brow: 0.2, acc/eyepatch: 0.08, acc/gloves: 0.3 }
    colors: { cloth: [dye_earth, dye_grey, dye_white], trim: [dye_earth, dye_black, dye_moss], metal: [metal_iron, metal_black] }
  bandit:
    name: โจร
    races: [human, human, tiefling, dwarf]
    wear: [body/leather_armor, body/farmer]
    always: [acc/face_scarf]
    slots:
