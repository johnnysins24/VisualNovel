# เรื่องเติมช่องว่าง วัยผู้ใหญ่ชุด 3b (อายุ 25 ถึง 32) และ 3c (อายุ 33 ถึง 40) เกิดซ้ำได้ (once: false) น้ำหนักต่ำ ถิ่นละเรื่อง กับเรื่องกลางอีกหนึ่งเรื่องต่อช่วง
# ห้ามใช้ {father} {mother} ห้ามพูดถึงเรือเหาะ แดนเถ้าไม่มีต้นไม้ ไอเลธมีทั้งเอลฟ์บนกิ่งและหมู่บ้านมนุษย์ชายป่า
# ท้ายไฟล์เป็นฉากปิดอายุสี่สิบ ทุกชีวิตที่อยู่ถึงสี่สิบต้องได้เห็น

# ---------- 3b อายุ 25 ถึง 32 ----------
- id: adult.filler_mid_arvel
  stage: adult
  weight: 1
  once: true
  when:
    age: [25, 32]
    location_tag: arvel_village
  text: |
    วัวของบ้านท้ายทุ่งเบ่งลูกมาตั้งแต่หัวค่ำ ใกล้เที่ยงคืนยังไม่ออก เจ้าของมาเคาะประตูบ้าน{name} ถือตะเกียงมือสั่น บอกว่าเห็นแต่ขาหลังโผล่มาข้างเดียว หมอสัตว์ไปงานศพที่ถิ่นอื่นตั้งแต่เมื่อวาน

    ในคอกวัวนอนตะแคง หายใจแรงจนฟางปลิว ขาเล็กๆ ข้างเดียวโผล่อยู่ กีบยังนิ่มเหมือนเทียนอุ่น
  choices:
    - id: pull
      label: ผูกเชือกที่ขาลูกวัว ดึงตามจังหวะที่แม่วัวเบ่ง
      text: |
        {name}ผูกเชือกเหนือกีบสองรอบ รอแม่วัวเบ่งแล้วดึง หยุดตอนแม่วัวหยุด ดึงอีกตอนเบ่งอีก จนเหงื่อไหลเข้าตา ลูกวัวไหลออกมาทั้งตัวพร้อมน้ำเมือกกองใหญ่ นอนนิ่งอยู่ครู่หนึ่ง แล้วจามใส่หน้า{name}
      effects: { stats: { STR: 1 } }
    - id: turn_inside
      label: ล้างแขนให้สะอาด ล้วงเข้าไปหาขาอีกข้าง
      text: |
        ข้างในร้อนและแคบ {name}คลำไล่ขาหลังขึ้นไปจนเจอขาอีกข้างพับอยู่ใต้ท้องลูกวัว ค่อยๆ ดันกลับแล้วดึงออกมาให้ตรงกัน พอขาออกมาครบคู่ ที่เหลือก็ออกตามมาเอง เจ้าของคอกนั่งลงกับพื้นฟางแล้วหัวเราะทั้งน้ำตา
      effects: { stats: { DEX: 1 } }
    - id: fetch_old_hand
      label: วิ่งไปปลุกคนเลี้ยงวัวแก่ที่สุดในถิ่นมาบอกวิธี
      text: |
        ตาแก่ลุกจากที่นอนมาทั้งเสื้อนอน ไม่ยอมจับวัวเอง เพราะมือไม่มีแรงแล้ว นั่งบนถังคว่ำแล้วบอก{name}ทีละขั้น ดันตรงไหน รอนานเท่าไร ดึงตอนไหน {name}ทำตามทุกคำ ตอนลูกวัวออกมาแกไม่ได้ลุกขึ้นดู บอกแค่ว่าตัวเมีย ฟังจากเสียงร้องก็รู้
      effects: { stats: { INT: 1 } }

- id: adult.filler_mid_ventras
  stage: adult
  weight: 1
  once: true
  when:
    age: [25, 32]
    location_tag: ventras
  text: |
    คนจุดตะเกียงฟ้าประจำถนนของ{name}ล้มป่วยตั้งแต่ต้นสัปดาห์ ถนนทั้งเส้นมืดไปสองคืน คืนที่สามเมียของเขามายืนรอหน้าบ้าน{name} สะพายบันไดไม้ไผ่กับย่ามขวดน้ำค้าง ขอให้ช่วยจุดแทนสักคืน ค่าแรงคืนละหนึ่งเหรียญเท่าที่ผัวได้

    ตะเกียงบนถนนเส้นนี้มีสามสิบสองดวง แต่ละดวงอยู่บนเสาสูงสองช่วงตัวคน
  choices:
    - id: light_them
      label: แบกบันไดขึ้นจุดตะเกียงทีละเสา
      text: |
        {name}ปีนขึ้นลงสามสิบสองรอบ หยดน้ำค้างลงไส้ทีละสองหยดตามที่นางสอน ดวงไหนจุดแล้วถนนข้างล่างก็ฟ้าขึ้นเป็นวง พอถึงเสาสุดท้าย ขาสั่นจนต้องนั่งพักบนขั้นบันได มองย้อนกลับไปเห็นถนนสว่างทั้งเส้น นางนับหนึ่งเหรียญใส่มือ
      effects: { gold: 1, stats: { DEX: 1 } }
    - id: pocket_vial
      label: รับปากจะจุด แล้วแอบเก็บขวดน้ำค้างเต็มขวดไว้ขายเองหนึ่งขวด
      text: |
        ไส้ตะเกียงสามสิบสองดวงใช้น้ำค้างไม่ถึงสองขวด ขวดที่สามเต็มอยู่ก้นย่าม {name}ส่งย่ามคืนโดยไม่มีขวดนั้น นางไม่ได้นับ วันต่อมา{name}ขายให้ร้านหัวตรอกได้สองเหรียญ
      effects: { gold: 2, alignment: { law: -1, moral: -1 } }
    - id: say_no
      label: บอกนางว่าคืนนี้ไม่ไหว พรุ่งนี้ต้องตื่นเช้า
      text: |
        นางไม่ว่าอะไร สะพายบันไดไปเคาะบ้านถัดไป {name}เข้านอนตั้งแต่หัวค่ำ หลับยาวจนเช้า ถนนหน้าบ้านคืนนั้นสว่างแค่ครึ่งเส้น
      effects: { hp: 2 }

- id: adult.filler_mid_hordun
  stage: adult
  weight: 1
  once: false
  when:
    age: [25, 32]
    location_tag: hordun
  text: |
    เด็กคนแคระอายุหกขวบมุดเข้าท่อระบายน้ำร้อนใต้ถนนวนชั้นเก้าตามแมวที่หนีเข้าไป ผ่านไปครึ่งวันยังไม่ออก แม่ของเด็กร้องเรียกจนเสียงแหบ ท่อแคบจนผู้ใหญ่คนแคระเข้าได้แค่หัวกับไหล่ ข้างในมืดสนิท ได้ยินแต่เสียงน้ำไหลกับเสียงแมว
  choices:
    - id: crawl_in
      label: ถอดเสื้อตัวนอก คลานเข้าไปในท่อ
      text: |
        {name}คลานเข้าไปจนไหล่ติดผนังสองข้าง ต้องเบี่ยงตัวทีละนิดถึงจะไปต่อได้ เลี้ยวสองโค้งก็เจอเด็กนั่งกอดแมวอยู่ในช่องกว้างที่ท่อสองเส้นมาบรรจบกัน เด็กไม่ร้องไห้ บอกว่ารอให้แมวหายกลัวก่อน {name}คลานถอยหลังกลับทั้งทางพร้อมเด็กที่จับข้อเท้าไว้ ส่วนแมวเดินนำออกไปก่อน
      effects: { stats: { DEX: 1 } }
    - id: listen_for_echo
      label: แนบหูกับฝาท่อตามถนน ฟังหาว่าเสียงแมวดังที่ไหน
      text: |
        {name}เดินแนบหูฟังฝาท่อทีละฝา เสียงแมวดังที่สุดตรงฝาที่สี่ ห่างจากปากท่อไปสิบห้าก้าว ช่างท่อเปิดฝาตรงนั้น ข้างล่างคือเด็กกับแมวนั่งอยู่บนหินแห้ง เงยหน้าขึ้นมาหยีตากับแสงพร้อมกันทั้งคู่
      effects: { stats: { INT: 1 } }
    - id: hold_the_rope
      label: ผูกเชือกที่เอวคนผอมที่สุดในกลุ่ม แล้วยืนจับปลายเชือกไว้
      text: |
        เด็กหนุ่มผอมจากโรงตีเหล็กอาสาเข้าไป {name}พันเชือกรอบแขนสามรอบ ยืนจับอยู่ปากท่อ เชือกกระตุกสองทีแปลว่าเจอ {name}ดึงช้าๆ จนแขนสั่น สามคนออกมาตามกัน เด็กหนุ่ม เด็ก แล้วก็แมว
      effects: { stats: { STR: 1 } }

- id: adult.filler_mid_ileth
  stage: adult
  weight: 1
  once: false
  when:
    age: [25, 32]
    location_tag: ileth
  text: |
    พ่อค้าไม้จากเมืองมานั่งรออยู่ที่หมู่บ้านชายป่าสามวัน อยากซื้อต้นสนตายสามต้นที่ล้มอยู่ในเขตของบ้านกิ่งลม เอลฟ์ที่ลงมาคุยกับเขาเป็นผู้หญิงแก่ ฟังภาษาเมืองออกแต่ไม่ยอมพูด สองคนนั่งคนละฝั่งโต๊ะ เงียบใส่กันมาครึ่งวัน

    พ่อค้าหันมาถาม{name} ที่อยู่ชายป่ามานานพอจะพูดได้ทั้งสองภาษา ว่าช่วยแปลให้หน่อยได้ไหม
  choices:
    - id: word_for_word
      label: แปลทีละคำ ไม่เติมไม่ตัด
      text: |
        พ่อค้าเสนอราคา เอลฟ์ตอบว่าต้นสนสามต้นนั้นตายมาสี่สิบปี ยังไม่มีใครถามมันว่าอยากไปไหน {name}แปลตามนั้นทุกคำ พ่อค้าเกาหัวไปมา ไม่ได้คำตอบ จนเอลฟ์บอกราคาเองเป็นภาษาเมือง ชัดทุกคำ ต่ำกว่าที่เขาเสนอมาครึ่งหนึ่ง
      effects: { stats: { INT: 1 } }
    - id: soften
      label: แปลให้ทั้งสองฝ่ายฟังสุภาพกว่าที่พูดจริง
      text: |
        คำว่าเอาไปเผาเถอะ {name}แปลเป็นถ้าท่านจะใช้ทำฟืนก็คงไม่เหมาะ คำว่าคนป่าไม่รู้ราคา{name}แปลเป็นอยากให้ท่านตั้งราคาเอง ก่อนค่ำทั้งสองคนจับมือกัน พ่อค้าบอกว่าเอลฟ์ใจดีกว่าที่คนเล่า เอลฟ์มองหน้า{name}แล้วยิ้มที่มุมปาก
      effects: { alignment: { moral: 1 }, flags: [softened_the_words] }
    - id: lean_merchant
      label: รับเหรียญจากพ่อค้าใต้โต๊ะ แล้วแปลให้เขาได้เปรียบ
      text: |
        พ่อค้ายื่นเหรียญหนึ่งเหรียญมาใต้โต๊ะตอนเอลฟ์มองไปทางอื่น {name}รับไว้ แล้วแปลราคาที่เอลฟ์บอกให้ต่ำลงหนึ่งส่วน ตกลงกันได้ก่อนค่ำ ตอนเอลฟ์ลุกจากโต๊ะ นางพูดภาษาเมืองกับ{name}ประโยคเดียว ว่าต้นสนพวกนั้นจำได้ทุกคนที่ขายมัน
      effects: { gold: 1, alignment: { moral: -1 } }

- id: adult.filler_mid_ashland
  stage: adult
  weight: 1
  once: true
  when:
    age: [25, 32]
    location_tag: ashland
  text: |
    ปีนี้หญ้าสีเงินออกดอก คนแก่ในถิ่นบอกว่าเจ็ดปีมีครั้งเดียว ดอกเล็กเท่าเมล็ดงา สีขาวเงินเหมือนต้นหญ้า ทั้งทุ่งเถ้ากลายเป็นสีเดียวกับแสงจันทร์ ลมพัดทีละวูบ ทุ่งทั้งทุ่งก็พลิกตาม

    คนในถิ่นออกไปเกี่ยวหญ้าก่อนดอกร่วง ใยของต้นที่ออกดอกเหนียวพอจะฟั่นเป็นเชือก เมล็ดเก็บไว้ขายให้พ่อค้าที่ผ่านมาทางป้อม
  choices:
    - id: reap
      label: ออกไปเกี่ยวหญ้ากับคนอื่นตั้งแต่เช้ามืด
      text: |
        หญ้าสีเงินคมกว่าที่ตาเห็น เกี่ยวไปครึ่งวันมือมีรอยบาดเล็กๆ จนนับไม่ไหว {name}มัดได้สิบสองฟ่อน แบกกลับมากองไว้หน้าบ้าน เด็กข้างบ้านมานั่งฟั่นเชือกจากฟ่อนของ{name}จนค่ำ
      effects: { stats: { STR: 1 } }
    - id: sell_seed
      label: นั่งเคาะเมล็ดใส่ผ้า เก็บไว้ขายพ่อค้า
      text: |
        เมล็ดหญ้าสีเงินเล็กจนหายใจแรงก็ปลิว {name}เคาะช้าๆ ทีละช่อ ได้สองถุงเล็ก พ่อค้าจากป้อมให้ถุงละเหรียญ บอกว่าในเมืองเอาไปโรยขอบหลังคา กันแมลงหึ่ง {name}ไม่รู้ว่ากันได้จริงหรือเปล่า
      effects: { gold: 2 }
    - id: lie_in_it
      label: เดินออกไปนอนกลางทุ่งตอนกลางคืน
      text: |
        ดอกหญ้าเย็นและนุ่มเหมือนขนนก {name}นอนหงายอยู่กลางทุ่ง เหนือหัวเป็นดาว ใต้ตัวเป็นทุ่งสีเงินที่ลมพัดเป็นคลื่นไปทางตอเสา ตื่นมาตอนสาง ผมมีดอกหญ้าติดเต็มหัว ร่างกายเบาเหมือนนอนมาสามคืน
      effects: { hp: 2 }

- id: adult.filler_mid_any
  stage: adult
  weight: 1
  once: false
  when:
    age: [25, 32]
  text: |
    วันตลาดนัดมีโต๊ะงัดข้อตั้งอยู่หน้าร้านเหล้า คนที่ชนะติดกันมาเจ็ดคนเป็นคนงานแบกของไหล่กว้างเท่าประตู คนที่ท้าเขาคนต่อไปเป็นผู้หญิงตัวเล็กผมสั้น แขนเรียวแต่ข้อมือหนา คนรอบโต๊ะหัวเราะ แล้วเริ่มวางเดิมพันข้างคนไหล่กว้างกันหมด
  choices:
    - id: wrestle
      label: ขึ้นไปงัดข้อด้วยคนหนึ่ง
      text: |
        คนไหล่กว้างกดแขน{name}ลงโต๊ะในเวลาหายใจสามครั้ง แต่ก่อนจะลงสุดมือ{name}ยันไว้ได้ครู่หนึ่ง นานพอให้คนรอบโต๊ะร้องเฮ เขาเขย่ามือ{name}หลังจบ บอกว่าข้อมือดี ไหล่ยังไม่ถึง
      effects: { stats: { STR: 1 } }
    - id: bet_small
      label: วางหนึ่งเหรียญข้างผู้หญิงตัวเล็ก
      requires: { min_gold: 1 }
      text: |
        ผู้หญิงตัวเล็กไม่ออกแรงในตอนแรก ปล่อยให้แขนเอียงลงเกือบถึงโต๊ะ แล้วหมุนข้อมือทีเดียว คนไหล่กว้างร้องเสียงหลง แขนของเขาลงไปนอนบนโต๊ะ คนรับเดิมพันจ่ายให้{name}สามเหรียญ หักเหรียญที่วางไปแล้วได้กำไรสองเหรียญ
      effects: { gold: 2 }
    - id: watch_wrist
      label: ยืนดูใกล้ๆ จับตาที่ข้อมือของผู้หญิงตัวเล็ก
      text: |
        {name}เห็นนางหมุนข้อมือเข้าหาตัวก่อนจะออกแรง ทำให้แขนของคนไหล่กว้างงอผิดทาง เขาเลยกดลงมาไม่ได้แม้จะแรงกว่าสองเท่า ตกเย็น{name}ลองกับเพื่อนที่บ้าน ชนะสองครั้งจากสามครั้ง
      effects: { stats: { DEX: 1 } }

# ---------- 3c อายุ 33 ถึง 40 ----------
- id: adult.filler_late_arvel
  stage: adult
  weight: 1
  once: false
  when:
    age: [33, 40]
    location_tag: arvel_village
  text: |
    วัวนมของบ้านหัวทุ่งหลุดคอกตั้งแต่ก่อนสาง ข้ามคันนาไปกินข้าวที่เพิ่งออกรวงของบ้านอื่นสามแปลง เจ้าของแปลงยืนด่าอยู่บนคันนา เจ้าของวัวไปตลาดในเมืองตั้งแต่เมื่อวาน เด็กๆ ในถิ่นวิ่งไล่วัวกันให้วุ่น ยิ่งไล่ วัวยิ่งวิ่งลึกเข้าไปในนา
  choices:
    - id: chase
      label: ลงนาไปต้อนวัวด้วยตัวเอง
      text: |
        {name}ไม่วิ่ง เดินอ้อมไปดักข้างหน้า กางแขนให้วัวเห็น วัวหยุด หันหัวกลับ เดินกลับขึ้นคันนาเองเหมือนจำได้ว่าบ้านอยู่ทางไหน รองเท้าของ{name}ติดโคลนอยู่ในนาไปข้างหนึ่ง กว่าจะดึงขึ้นมาได้ต้องลงไปอีกรอบ
      effects: { stats: { DEX: 1 } }
    - id: wait_by_gate
      label: เอาฟางกำหนึ่งไปยืนรอที่ประตูคอกเดิม
      text: |
        {name}บอกเด็กๆ ให้เลิกไล่ แล้วไปยืนเขย่าฟางอยู่ที่ประตูคอก ผ่านไปไม่นาน วัวก็เดินกลับมาตามทางเดิม หยุดกินฟางในมือ{name} แล้วเข้าคอกไปเอง เจ้าของแปลงข้าวมาขอฟางที่เหลือไปลองกับควายของตัวเองบ้าง
      effects: { stats: { INT: 1 } }
    - id: let_kids
      label: ปล่อยให้เด็กๆ จัดการ แล้วกลับไปทำงานของตัวเอง
      text: |
        เด็กๆ ไล่วัวจนเที่ยง วัวเหนื่อยก่อนเด็ก นอนลงกลางแปลงข้าวที่สาม เด็กๆ นั่งล้อมไว้จนเจ้าของกลับมาตอนเย็น {name}ทำงานของตัวเองเสร็จเร็วกว่าทุกวัน เพราะไม่มีเด็กมากวน
      effects: { hp: 2 }

- id: adult.filler_late_ventras
  stage: adult
  weight: 1
  once: false
  when:
    age: [33, 40]
    location_tag: ventras
  text: |
    สะพานเหล็กข้ามแม่น้ำปิดซ่อมสิบวัน ราชสำนักติดป้ายไว้ที่หัวสะพานทั้งสองฝั่ง ช่างเหล็กแขวนตัวอยู่ใต้สะพานเป็นแถว เคาะหมุดดังไปทั้งย่าน คนที่ต้องข้ามไปทำงานยืนกันแน่นท่า เรือข้ามฟากคิดคนละหนึ่งเหรียญ แพงกว่าวันปกติห้าเท่า
  choices:
    - id: row_across
      label: ยืมเรือบดของคนรู้จัก พายข้ามไปเอง
      text: |
        น้ำกลางแม่น้ำไหลแรงกว่าที่เห็นจากฝั่ง {name}พายเฉียงขึ้นต้นน้ำไปไกลกว่าครึ่งทางถึงจะเข้าฝั่งตรงท่าที่ต้องการ แขนล้าจนจับถ้วยน้ำชาไม่ตรง แต่ไปถึงงานก่อนคนที่รอเรือข้ามฟาก
      effects: { stats: { STR: 1 } }
    - id: pay_ferry
      label: จ่ายหนึ่งเหรียญขึ้นเรือข้ามฟาก
      requires: { min_gold: 1 }
      text: |
        เรือข้ามฟากแน่นจนขอบเรือเกือบเสมอน้ำ {name}ยืนเบียดกับคนแปลกหน้าสิบกว่าคน ทุกคนบ่นเรื่องเดียวกัน ราคาเรือ ราคาถ่าน ราคาทุกอย่าง จนถึงฝั่งก็กลายเป็นคนรู้จักกันไปครึ่งเรือ
      effects: { gold: -1 }
    - id: walk_around
      label: เดินอ้อมไปข้ามสะพานไม้ที่ต้นน้ำ
      text: |
        สะพานไม้อยู่ไกลออกไปครึ่งเช้าเดิน ผ่านย่านที่{name}ไม่เคยไป ย่านที่บ้านยังมุงจาก ไม่มีจานรับดาวสักใบ {name}ไปถึงงานสาย นายหักค่าแรงครึ่งวัน แต่ขากลับเดินทางเดิมอีก เพราะอยากเห็นย่านนั้นตอนเย็น
      effects: { stats: { CON: 1 } }

- id: adult.filler_late_hordun
  stage: adult
  weight: 1
  once: false
  when:
    age: [33, 40]
    location_tag: hordun
  text: |
    งานประกวดตีเหล็กประจำปีจัดที่ลานใหญ่ชั้นห้า ช่างทุกตระกูลยกทั่งมาตั้งเรียงกันเป็นสองแถว ตีมีดเล่มเดียวจากเหล็กแท่งเดียวกันให้เสร็จก่อนเทียนนาฬิกาไหม้หมดหนึ่งเล่ม ปีนี้ตระกูลหนึ่งขาดคนเป่าเตา อีกตระกูลขาดคนตี
  choices:
    - id: strike
      label: ขึ้นไปจับค้อนให้ตระกูลที่ขาดคนตี
      text: |
        {name}ตีตามจังหวะที่ช่างใหญ่ของตระกูลเคาะบอกด้วยค้อนเล็ก เคาะหนึ่งตีหนึ่ง เคาะสองตีสอง จนเหล็กแดงกลายเป็นมีดก่อนเทียนหมดหนึ่งนิ้ว มีดเล่มนั้นได้ที่สาม ช่างใหญ่บอกว่าถ้าแขนของ{name}ไม่ช้าไปครึ่งจังหวะตอนท้ายจะได้ที่สอง
      effects: { stats: { STR: 1 } }
    - id: bellows
      label: ไปเป่าเตาให้ตระกูลที่ขาดคนเป่า
      text: |
        เป่าเตาง่ายในสิบครั้งแรก ยากในร้อยครั้งถัดไป ตอนเทียนไหม้ไปครึ่งเล่ม{name}หายใจไม่ทันเตา ต้องเป่าด้วยหลังกับขาแทนแขน ช่างที่ตีไม่หันมาสักครั้ง แต่ตอนจบเขาเอามีดที่ยังอุ่นมาวางในมือ{name}ให้ถือก่อนส่งให้กรรมการ
      effects: { stats: { CON: 1 } }
    - id: judge_edges
      label: ยืนดูอยู่หน้าแถว เดาว่ามีดเล่มไหนจะชนะ
      text: |
        {name}ดูจากเสียง เหล็กที่ตีตรงจังหวะจะดังใส ตีพลาดจะดังทึบ คนแก่ข้างๆ ได้ยิน{name}เดาออกเสียงก็เดาตาม พอกรรมการประกาศผล{name}เดาตรงสองในสามอันดับ คนแก่ข้างๆ เดาตรงครบสาม แกบอกว่าแกฟังมาหกสิบปีแล้ว
      effects: { stats: { INT: 1 } }

- id: adult.filler_late_ileth
  stage: adult
  weight: 1
  once: true
  when:
    age: [33, 40]
    location_tag: ileth
  text: |
    หมู่บ้านเอลฟ์บนต้นไม้ฝั่งเหนือลำธารมีเด็กเกิดใหม่หนึ่งคน เด็กคนแรกของหมู่บ้านนั้นในรอบยี่สิบสามปี ข่าวลงมาถึงหมู่บ้านชายป่าก่อนเที่ยง ทั้งป่าเงียบไปครึ่งวัน แล้วเสียงเพลงก็ดังมาจากกิ่งบนสุดลงมาทีละกิ่ง

    ตามธรรมเนียม ต้องปลูกต้นสนหนึ่งต้นในวันที่เด็กเกิด ที่โคนต้นแม่ที่บ้านอยู่ เอลฟ์ลงมาขุดหลุมกันเอง แต่หมู่บ้านชายป่าก็ส่งคนไปช่วยทุกครั้ง
  choices:
    - id: dig
      label: ไปช่วยขุดหลุมปลูกต้นสน
      text: |
        ดินตรงโคนต้นแม่มีรากเก่าสานกันแน่น ขุดได้ทีละคืบ เอลฟ์ที่ขุดอยู่ข้าง{name}บอกว่าห้ามตัดรากสักเส้น ต้องหาช่องลงไปให้ได้ {name}ขุดจนตะวันบ่าย หลุมลึกพอ เอลฟ์วางต้นสนเล็กลงไปแล้วกลบด้วยมือ ไม่ใช้จอบ
      effects: { stats: { STR: 1 } }
    - id: carry_water
      label: แบกน้ำขึ้นบันไดเชือกไปส่งที่กิ่งของบ้านเด็กเกิดใหม่
      text: |
        ถังน้ำสองถังห้อยอยู่ปลายไม้คาน บันไดเชือกแกว่งทุกก้าว {name}ขึ้นไปถึงกิ่งที่สามโดยไม่หกสักหยด เอลฟ์ที่รับถังไปบอกว่าคนชายป่าส่วนใหญ่หกหมดตั้งแต่กิ่งแรก แล้วยื่นใบสนอ่อนกำหนึ่งให้ เก็บไว้ในกระเป๋าเสื้อ
      effects: { stats: { DEX: 1 } }
    - id: listen_village
      label: อยู่ที่หมู่บ้านชายป่า ฟังคนแก่คุยเรื่องเด็กเอลฟ์คนก่อน
      text: |
        คนแก่ในหมู่บ้านชายป่าจำได้ว่าเด็กเอลฟ์คนก่อนเกิดตอนไหน ฝนตกหรือแดดออก ใครลงมาขุดหลุม บางคนจำได้ถึงเด็กคนก่อนหน้านั้นอีก ตอนตัวเองยังเล็กกว่าหลาน {name}นั่งฟังจนรู้ว่าต้นสนแต่ละต้นใต้ต้นแม่เป็นของเด็กคนไหน
      effects: { stats: { INT: 1 } }

- id: adult.filler_late_ashland
  stage: adult
  weight: 1
  once: false
  when:
    age: [33, 40]
    location_tag: ashland
  text: |
    ทางกระดานที่ทอดข้ามเถ้าจากถิ่นไปป้อมผุจนเท้าทะลุไปสองช่วง ไม้ใหม่มากับเกวียนเสบียงจากป้อม ทุกแผ่นซื้อมาจากนอกแดนเถ้า เพราะที่นี่ไม่มีต้นไม้ให้ตัดสักต้น คนในถิ่นต้องเปลี่ยนกันเองให้เสร็จก่อนพายุเถ้าลูกหน้า
  choices:
    - id: carry_planks
      label: แบกกระดานแผ่นใหม่ไปวางทีละช่วง
      text: |
        กระดานแผ่นหนึ่งยาวสามช่วงแขน {name}แบกทีละแผ่นเดินบนกระดานเก่าที่ยังไม่ผุ วางแผ่นใหม่ทับแล้วตอกลงหลักหิน ทั้งวันแบกไปสามสิบกว่าแผ่น ไหล่ขวาเป็นรอยแดงยาวเท่ากระดาน
      effects: { stats: { STR: 1 } }
    - id: set_level
      label: คอยเล็งระดับให้กระดานแต่ละช่วงเสมอกัน
      text: |
        เถ้าใต้กระดานยุบไม่เท่ากัน ช่วงไหนวางตรงเกินไปอีกปีก็จะเอียง {name}ใช้ขวดน้ำครึ่งขวดวางบนกระดานดูน้ำในขวด หนุนหินใต้ช่วงที่ต่ำจนน้ำนิ่งตรงกลาง คนแก่ในถิ่นเดินลองตอนเย็น บอกว่าเดินสบายเท่าทางที่ป้อมทำให้เมื่อยี่สิบปีก่อน
      effects: { stats: { INT: 1 } }
    - id: sell_old
      label: เก็บกระดานเก่าที่ยังไม่ผุทั้งแผ่นไปขายเป็นฟืน
      text: |
        กระดานเก่าที่ผุแค่ปลายยังเป็นฟืนดี ในแดนเถ้าไม้หนึ่งแผ่นมีค่ามากกว่าที่อื่น {name}ตัดปลายผุทิ้ง เอาไปขายบ้านที่มีคนแก่นอนป่วยได้สองเหรียญ เด็กในถิ่นมาเก็บเศษปลายผุไปเผาต่อ
      effects: { gold: 2 }

- id: adult.filler_late_any
  stage: adult
  weight: 1
  once: true
  when:
    age: [33, 40]
    not_flags: [race_elf, race_dwarf]
  text: |
    เช้าวันหนึ่ง{name}ล้างหน้าแล้วเห็นผมหงอกเส้นแรกในน้ำ อยู่ที่ขมับข้างซ้าย สั้นกว่าเส้นอื่น ตั้งตรงกว่าเส้นอื่น ขาวจนแสงเช้าส่องแล้วเป็นประกาย
  choices:
    - id: pluck
      label: ส่องน้ำหาจนเจอ แล้วถอนทิ้ง
      text: |
        เส้นหงอกเล็กจนต้องเอียงหน้าหามุมแสงสามครั้ง {name}ดึงพลาดไปสองเส้นดำ เส้นที่สามเป็นเส้นหงอกพอดี วางไว้บนขอบอ่าง ดูแล้วก็ไม่ได้ต่างจากเส้นด้ายสักเท่าไร สามวันต่อมามีเส้นใหม่ขึ้นที่เดิม
      effects: { stats: { DEX: 1 } }
    - id: leave_it
      label: ปล่อยไว้อย่างนั้น
      text: |
        {name}หวีผมทับไปตามเดิม เส้นหงอกโผล่ขึ้นมาใหม่ตอนสาย ขึ้นตอนเที่ยง ขึ้นตอนเย็น ไม่มีใครเห็นนอกจาก{name}เอง ทั้งวันไม่มีอะไรเปลี่ยน คืนนั้นหลับสนิทกว่าทุกคืน
      effects: { hp: 2 }
    - id: count_them
      label: แหวกผมดูทั้งหัว นับว่ามีกี่เส้น
      text: |
        {name}แหวกผมทีละช่วงหน้ากระจกเงาบานเล็ก นับได้เจ็ดเส้น ห้าเส้นอยู่ขมับซ้าย สองเส้นซ่อนอยู่หลังหู นับเสร็จก็จำได้ว่าแต่ละเส้นอยู่ตรงไหน เดือนต่อมานับใหม่ได้สิบเอ็ด
      effects: { stats: { INT: 1 } }

# ---------- ฉากปิด อายุสี่สิบ ----------
- id: adult.life_at_forty
  stage: adult
  weight: 100000
  must: true
  scene: home
  when:
    age: [40, 40]
  text: |
    วันเกิดปีที่สี่สิบของ{name}ผ่านไปเหมือนวันธรรมดา งานเสร็จตอนเย็น กินข้าวเสร็จตอนค่ำ ไม่มีใครจำได้ว่าเป็นวันอะไรนอกจาก{name}เอง ตอนจะเข้านอน{name}เปลี่ยนใจ ออกมานั่งที่ขั้นบันไดหน้าบ้าน

    ฟ้าคืนนี้เปิด ดาวแน่นจนช่องมืดระหว่างดวงเหลือน้อยกว่าช่องสว่าง ตอนเด็ก{name}เคยนับดาวในวงนิ้วมือได้ครบโดยไม่หลง คืนนี้ยกมือขึ้นวงเท่าเดิม นับได้ไม่ถึงครึ่งวงก็หลง ดาวดวงใหม่ดวงหนึ่งตรงกลางวงสว่างกว่าดวงอื่น ปีก่อนยังไม่มี

    เสียงจากบ้านข้างๆ เงียบลงทีละหลัง ข้างนอกเหลือแต่เสียงลม
  choices:
    - id: with_partner
      label: เรียก{partner}ออกมานั่งด้วยกัน
      requires: { flag: married }
      text: |
        {partner}ออกมาพร้อมถ้วยชาสองใบ ยื่นให้ใบหนึ่ง แล้วนั่งลงชิดกันบนขั้นบันไดขั้นเดียว ขั้นนี้แคบจนต้องนั่งเบียดกันมาตั้งแต่ปีแรกที่อยู่ด้วยกัน {p:เขา|เธอ}ไม่ได้มองดาว บอกว่าหลังคาด้านเหนือต้องเปลี่ยนกระเบื้องก่อนหน้าฝน ตรงที่หยดลงหัวเตียงทุกปี

        {name}บอกว่าปีนี้ต้องเปลี่ยนจริงๆ แล้ว {partner}หัวเราะ เพราะได้ยินประโยคนี้มาทุกปี ชาเย็นหมดถ้วยก่อนทั้งสองคนจะลุกเข้าบ้าน
      effects: { flags: [forty_with_partner] }
    - id: two_cups
      label: รินชาสองถ้วยเหมือนทุกคืน วางอีกถ้วยไว้ข้างตัว
      requires: { flag: partner_died, not_flags: [married, has_partner] }
      text: |
        ถ้วยของ{partner}วางอยู่บนขั้นบันไดข้างๆ ไอน้ำลอยขึ้นจนหมด แล้วก็เย็น {name}เล่าเรื่องวันนี้ให้ถ้วยนั้นฟังทีละเรื่อง ไม่ได้ตั้งใจ เล่าไปเองเหมือนทุกคืน ใครทะเลาะกับใครที่ตลาด ราคาอะไรขึ้น ดาวดวงไหนตรงกลางวงนิ้วที่ปีก่อนไม่มี

        ก่อนเข้าบ้าน{name}ดื่มชาถ้วยนั้นจนหมด รสขมกว่าถ้วยของตัวเอง เพราะ{partner}ชอบชงเข้มกว่า
      effects: { stats: { CON: 1 }, flags: [forty_two_cups] }
    - id: with_child
      label: เรียกลูกออกมานั่งนับดาวด้วย
      requires: { flag: has_child }
      text: |
        ลูกนั่งลงข้างๆ ยกมือขึ้นวงตามแบบที่{name}ทำ นับเสียงดัง หนึ่ง สอง สาม จนถึงสามสิบกว่าก็หลง เริ่มใหม่ หลงอีก ลูกบอกว่าดาวขยับ {name}บอกว่าไม่ได้ขยับ ตาเราขยับ

        ลูกนับรอบที่สี่ได้ไม่ถึงยี่สิบก็หลับพิงไหล่ ตอนอุ้มเข้าบ้าน ลูกพึมพำว่าคืนนี้นับไม่หมดก็นับต่อคืนหน้า แล้วหลับต่อ
      effects: { flags: [forty_counted_with_child] }
    - id: veteran_names
      label: นับชื่อคนในหน่วยแทนดาว ทีละชื่อ
      requires: { flag: war_veteran, not_flags: [has_child] }
      text: |
        {name}ไล่ชื่อตั้งแต่คนที่ยืนหัวแถวไปจนถึงคนที่ยืนท้าย ชื่อไหนจำหน้าไม่ได้แล้วก็ข้ามไปก่อน แล้ววนกลับมาใหม่ จนหน้าค่อยๆ ขึ้นมาเอง รอบนี้นึกออกครบทุกชื่อ ปีก่อนขาดไปสองชื่อ

        ดาวดวงใหม่ตรงกลางวงนิ้วสว่างอยู่อย่างนั้นทั้งคืน {name}ไม่ได้ตั้งชื่อให้มัน
      effects: { flags: [forty_counted_the_unit] }
    - id: horns_cool
      label: เอามือแตะโคนเขา ปล่อยให้ลมกลางคืนพัดผ่าน
      requires: { trait: demon_mark, not_flags: [has_child, war_veteran] }
      text: |
        ลมกลางคืนเย็น โคนเขาเย็นตาม {name}เคยได้ยินคนพูดกันมาทั้งชีวิต ว่าดาวดวงใหม่มองลงมา นั่งดูนานๆ แล้วจะรู้สึกว่ามีอะไรมองกลับ คืนนี้{name}นั่งดูนานกว่าทุกคืน

        {name}ไม่รู้สึกว่ามีอะไรมองกลับมา ดาวดวงใหม่ตรงกลางวงนิ้วก็แค่สว่างอยู่ตรงนั้น {name}นั่งอยู่จนลมเปลี่ยนทิศ แล้วเข้าบ้านไปนอน
      effects: { flags: [forty_nothing_looked_back] }
    - id: count_alone
      label: นั่งนับดาวในวงนิ้วต่อไปจนกว่าจะนับครบ
      text: |
        {name}นับใหม่ช้าลง นับทีละแถบจากซ้ายไปขวา แถบไหนนับแล้วก็ขยับนิ้วกันไว้ จนดาวในวงนิ้วนับได้ครบเป็นครั้งแรกในรอบหลายปี ได้ห้าสิบเก้าดวง ตอนเด็กนับได้สิบเจ็ด

        {name}ลดมือลง นั่งต่ออีกพักหนึ่ง ไม่ได้นับอะไรแล้ว
      effects: { stats: { INT: 1 }, flags: [forty_counted_alone] }
    - id: go_in
      label: ลุกเข้าบ้านไปนอน พรุ่งนี้ยังมีงาน
      text: |
        ขั้นบันไดเย็นจนก้นชา {name}ลุกขึ้นปัดเสื้อ แหงนดูฟ้าอีกครั้งตอนมือจับประตู ดาวดวงใหม่ตรงกลางยังอยู่ที่เดิม

        ข้างในบ้านอุ่นกว่าข้างนอก {name}ดับตะเกียง ล้มตัวลงนอน หลับก่อนจะได้คิดว่าพรุ่งนี้ต้องตื่นกี่โมง
      effects: { hp: 2, flags: [forty_went_to_sleep] }
