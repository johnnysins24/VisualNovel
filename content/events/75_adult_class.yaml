# ชุด 3a วัยผู้ใหญ่ อายุ 19 ถึง 24: เหตุการณ์ประจำสาย สายละ 2 เรื่อง ใช้ได้กับทุกงานในสายนั้น
# เรื่องแรกของแต่ละสายพาคู่แข่งประจำสายเข้ามา ทุกตัวเลือกตั้ง flag rival_<สาย> ให้ช่วง 3b และ 3c เรียกต่อ
# คู่แข่ง: เคดรา (นักรบ) ฟินนิค (นักย่อง) เซเวริน (นักเวท) โลเวน (นักบวช) ฮัสเกน (พราน) ลีราน (กวีเร่)

# ---------- นักรบ ----------
- id: adult.warrior_rival_kedra
  stage: adult
  weight: 30
  when:
    age: [19, 22]
    class: warrior
  text: |
    พ่อค้าผ้าเจ้าของขบวนเกวียนสิบสองเล่มต้องการหัวหน้าคุมขบวนหนึ่งคน ค่าจ้างเท่าคุมขบวนธรรมดาสามคน คนที่มายืนรอในลานโรงเตี๊ยมเหลือสองคนตั้งแต่ก่อนเที่ยง คือ{name}กับผู้หญิงคนหนึ่งชื่อเคดรา

    เคดราสูงกว่า{name}ครึ่งหัว ผมตัดสั้นเหมือนทหาร แขนขวามีรอยแผลไฟไหม้ยาวถึงไหล่ พ่อของนางเป็นทหารผ่านศึกสงครามถ่าน นางบอกเรื่องนี้กับพ่อค้าตั้งแต่ประโยคแรก ประโยคที่สองนางบอกว่า{name}ยังไม่เคยคุมอะไรนอกจากตัวเอง

    พ่อค้าโยนดาบไม้ให้คนละเล่ม บอกว่าใครยังยืนอยู่ตอนเขากินข้าวเที่ยงเสร็จ คนนั้นได้งาน
  choices:
    - id: fight_fair
      label: สู้ตรงๆ ด้วยดาบไม้
      check: { stat: STR, dc: 14 }
      success:
        text: |
          เคดราฟันเร็วและไม่เคยฟันซ้ำที่เดิม {name}รับได้สิบกว่าครั้งก่อนจะเห็นว่านางลงน้ำหนักเท้าซ้ายทุกครั้งก่อนฟันจากขวา ครั้งต่อมา{name}ไม่รับ แต่ก้าวเข้าไปชนไหล่ ดาบไม้ของนางกระเด็นออกไปนอกวง

          พ่อค้ายังกินไม่เสร็จ เขาวางช้อนลงแล้วชี้{name} เคดราเก็บดาบไม้ขึ้นมาส่งคืนให้คนโรงเตี๊ยม แล้วบอก{name}ว่าเท้าซ้ายของนาง นางจะแก้ให้ทันครั้งหน้า
        effects: { stats: { STR: 1 }, gold: 4, flags: [rival_warrior, beat_kedra] }
      failure:
        text: |
          ดาบไม้ของเคดราลงที่ข้อมือ{name}ตั้งแต่ครั้งที่สาม ลงซ้ำที่ซี่โครงก่อน{name}จะยกดาบกลับขึ้นมาทัน ครั้งที่สี่ลงที่ข้อพับเข่า{name}ทรุดลงกับพื้นลาน

          นางไม่ตีซ้ำ นางยื่นมือมาให้จับลุกขึ้น พ่อค้าบอกว่างานเป็นของเคดรา แต่ถ้า{name}อยากได้ค่าจ้างคุมขบวนธรรมดาก็มาด้วยกันได้ เคดราบอกว่าให้มา นางอยากเห็นว่าคนที่กินดาบไม้ไปสี่ทีแล้วยังลุกขึ้นได้จะทำอะไรเมื่อเจอโจรจริง
        effects: { hp: -2, stats: { CON: 1 }, gold: 2, flags: [rival_warrior, lost_to_kedra] }
    - id: fight_dirty
      label: เตะดินใส่หน้านาง แล้วฟันตอนนางหลับตา
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ดินลานโรงเตี๊ยมแห้งและเป็นฝุ่น {name}เขี่ยปลายเท้าทีเดียว ฝุ่นเต็มหน้าเคดรา นางหลับตาไปครึ่งลมหายใจ ดาบไม้ของ{name}ก็แตะคอนางแล้ว

          พ่อค้าหัวเราะจนสำลักข้าว เขาบอกว่าโจรก็สู้แบบนี้ คนคุมขบวนต้องรู้ทางโจร เคดราเช็ดฝุ่นออกจากตา ไม่ยอมจับมือ{name} นางเดินออกจากลานไปโดยไม่เอาดาบไม้คืน
        effects: { stats: { DEX: 1 }, gold: 4, alignment: { law: -1 }, flags: [rival_warrior, beat_kedra, kedra_grudge] }
      failure:
        text: |
          เคดราหลับตาตอนที่ฝุ่นลอยขึ้นมา แต่ดาบไม้ของนางไม่หยุด นางฟันลงมาตรงที่เสียงเท้าของ{name}อยู่ ลงตรงสันจมูก เลือดไหลลงคางก่อนที่{name}จะรู้ตัวว่าดาบไม้ลงมาแล้ว

          นางลืมตาขึ้นมาเห็นเลือด แล้วบอกว่าพ่อของนางสอนว่าคนที่เล่นฝุ่นก่อนมักลืมว่าหูของคู่ต่อสู้ยังใช้ได้ พ่อค้าจ้างนาง
        effects: { hp: -3, alignment: { law: -1 }, flags: [rival_warrior, lost_to_kedra, kedra_grudge] }
    - id: offer_to_split
      label: บอกพ่อค้าว่าขบวนสิบสองเล่มต้องใช้สองคน แบ่งกันคนละครึ่งขบวน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}วางดาบไม้ลงบนพื้น แล้วนับเกวียนให้พ่อค้าฟังทีละเล่ม สิบสองเล่มต่อกันยาวหลายร้อยก้าว โจรตีหัวขบวน หางขบวนก็หายไปก่อนหัวหน้าจะวิ่งไปถึง คนเดียวคุมไม่ได้ ต่อให้เป็นคนเก่งที่สุดในลานนี้

          พ่อค้าคิดอยู่นาน แล้วจ้างทั้งสองคนในราคาคนละสองในสาม เคดราได้หัวขบวน {name}ได้หางขบวน ตลอดทางนางขี่ม้ากลับมาดูหางขบวนวันละสองรอบ ทุกรอบนางบอกว่าแค่มาดูเฉยๆ
        effects: { stats: { CHA: 1 }, gold: 3, alignment: { moral: 1 }, flags: [rival_warrior, kedra_partner] }
      failure:
        text: |
          พ่อค้าฟัง{name}จนจบ แล้วบอกว่าเขาจ้างหัวหน้าหนึ่งคน ไม่ได้จ้างคนนับเกวียน เคดราไม่รอให้{name}หยิบดาบไม้ขึ้นมา นางฟันลงที่ไหล่ทีเดียว พ่อค้าก็ตัดสินแล้ว

          ตอนขบวนออกจากโรงเตี๊ยม เคดราขี่ม้าผ่านหน้า{name} บอกว่าเรื่องนับเกวียนนั้นถูก นางจะจ้างคนมาคุมหางขบวนเอง แต่ไม่ใช่{name}
        effects: { hp: -1, stats: { INT: 1 }, flags: [rival_warrior, lost_to_kedra] }

- id: adult.warrior_first_man
  stage: adult
  weight: 30
  when:
    age: [20, 24]
    class: warrior
  text: |
    โจรบนทางเขาโผล่ออกมาจากหลังหินคนเดียว ถือขวานตัดไม้ แขนซ้ายเป็นแขนเหล็กของทหารเกณฑ์ เก่าจนสนิมขึ้นตามข้อ เขาตะโกนให้วางของทุกอย่างลงบนทาง เสียงของเขาสั่นกว่ามือที่ถือขวาน

    {name}เคยฟันหุ่นฟาง เคยฟันสัตว์ เคยตีคนในโรงเตี๊ยม ยังไม่เคยฆ่าคน เขาเดินเข้ามาทีละก้าว ใกล้พอจะเห็นว่าเขาอายุไม่มากกว่า{name}สักกี่ปี ที่คอห้อยป้ายไม้ของกองทหาร สลักชื่อกองไว้ด้านหนึ่ง
  choices:
    - id: strike_to_kill
      label: ฟันก่อนเขาจะยกขวานขึ้น
      check: { stat: STR, dc: 13, foe: human }
      success:
        text: |
          ดาบของ{name}ลงตรงที่คอกับไหล่ต่อกันทีเดียว ขวานหล่นลงบนหิน เขาล้มลงตามขวาน ไม่ได้ร้อง ลมหายใจสุดท้ายออกมาเป็นเสียงเหมือนคนถอนใจ

          {name}ถอดป้ายไม้ออกจากคอเขา ด้านหนึ่งสลักชื่อกอง อีกด้านมีรอยมีดขูดเป็นชื่อผู้หญิงคนหนึ่ง คืนนั้น{name}นอนไม่หลับ ล้างดาบซ้ำไปห้ารอบทั้งที่มันสะอาดตั้งแต่รอบแรก
        effects: { stats: { STR: 1 }, alignment: { law: 1 }, flags: [first_man_killed, kept_robber_tag] }
      failure:
        text: |
          ดาบของ{name}ลงช้าไปครึ่งจังหวะ ด้ามขวานกระแทกไหล่ก่อน แขนเหล็กของเขาฟาดเข้าที่ข้างหัว{name}เซไปพิงหิน เขายกขวานขึ้นเหนือหัว แล้วหยุดค้างอยู่ตรงนั้น

          เขาวางขวานลงช้าๆ หยิบถุงเสบียงของ{name}ไปถุงเดียว แล้ววิ่งหายเข้าไปหลังหิน {name}นั่งพิงหินอยู่จนหูหายอื้อ ไม่เข้าใจว่าทำไมขวานไม่ลงมา
        effects: { hp: -3, gold: -2, flags: [spared_by_robber] }
    - id: disarm_and_bind
      label: ปัดขวานให้หลุดมือ แล้วมัดพาลงไปส่งยามในเมือง
      check: { stat: DEX, dc: 14, foe: human }
      success:
        text: |
          {name}ปัดด้ามขวานด้วยสันดาบตรงข้อมือที่เป็นเนื้อ ขวานหลุด เขาเอื้อมแขนเหล็กมาคว้าคอ{name}แต่ข้อเหล็กที่สนิมกินหมุนไม่ทัน {name}ล้มเขาลงกับทางแล้วมัดแขนทั้งสองข้างไว้ด้วยเชือกผูกม้า

          ทางลงเขาใช้เวลาครึ่งวัน เขาเล่าเรื่องกองทหารของเขาให้ฟังตลอดทาง {name}ไม่ได้ถาม ยามในเมืองให้ค่าหัวสี่เหรียญ แล้วจับเขาเข้าห้องขังใต้ดิน
        effects: { stats: { DEX: 1 }, gold: 4, alignment: { law: 1 }, flags: [turned_in_robber] }
      failure:
        text: |
          สันดาบของ{name}ปัดไปกระทบแขนเหล็ก ไม่ใช่ข้อมือ ขวานไม่หลุด เขาเหวี่ยงขวานกลับมาด้วยมือข้างเดียว ใบขวานลงที่ต้นขา{name}ลึกครึ่งนิ้ว {name}ล้มลง เขาไม่ตามมาซ้ำ เขาวิ่งหนีขึ้นเขาไปทั้งที่ทิ้งขวานไว้บนทาง

          {name}พันแผลด้วยผ้าคาดเอว เดินกะเผลกลงเขาตอนค่ำ มีแค่ขวานตัดไม้เล่มนั้นติดมือกลับไปด้วย
        effects: { hp: -3, flags: [robber_escaped] }
    - id: lower_the_sword
      label: ลดดาบลง ถามชื่อกองทหารที่สลักบนป้าย
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          เขาหยุดเดินเมื่อได้ยินชื่อกองของตัวเองออกจากปากคนแปลกหน้า {name}บอกว่าในโรงเตี๊ยมตีนเขามีทหารผ่านศึกจากกองนั้นสามคน นั่งที่โต๊ะเดิมทุกค่ำ คนหนึ่งเป็นช่างซ่อมแขนเหล็ก

          เขาวางขวานลงบนหิน นั่งลงตรงนั้น ร้องไห้เหมือนเด็ก {name}แบ่งขนมปังให้ครึ่งก้อน พาลงเขาไปส่งที่โรงเตี๊ยม สามเดือนต่อมาแขนเหล็กของเขาหมุนข้อได้ และเขาได้งานตัดไม้จริง
        effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [spared_the_robber] }
      failure:
        text: |
          เขาไม่ได้ยินอะไรนอกจากเสียงในหัวตัวเอง เขาเหวี่ยงขวานเข้ามาตอนที่{name}ยังพูดไม่จบ {name}ยกดาบรับทัน แต่แรงขวานดันดาบกลับมากระแทกหน้าผากตัวเอง

          {name}ต้องสู้จริงจนเขาหนีไป ทิ้งเลือดไว้บนหินทางหนึ่ง ไม่รู้ว่าเลือดของใครมากกว่าของใคร
        effects: { hp: -2, stats: { CON: 1 }, flags: [robber_escaped] }

# ---------- นักย่อง ----------
- id: adult.rogue_rival_finnick
  stage: adult
  weight: 30
  when:
    age: [19, 22]
    class: rogue
  text: |
    {name}ตามพ่อค้าพรมอ้วนคนนั้นมาตั้งแต่ปากตลาดนัด ถุงเงินของเขาห้อยหลวมอยู่ทางซ้าย เชือกผูกถุงหลุดไปครึ่งปม รออีกแค่ฝูงคนตรงหน้าร้านขนมทอด แล้วถุงก็จะเป็นของ{name}

    ฝูงคนมาถึงก่อนที่{name}จะยื่นมือออกไป ผู้ชายผมแดงคนหนึ่งเดินสวนพ่อค้า ชนไหล่เขาเบาๆ ขอโทษ แล้วเดินมายืนข้าง{name} ถุงเงินของพ่อค้าอยู่ในมือเขาแล้ว เขาแนะนำตัวว่าชื่อฟินนิค แล้วบอกว่าเห็น{name}เดินตามถุงนี้มาสามแผงร้าน ช้าไปหน่อย

    ฟินนิคเสนอว่าจะคืนถุงนี้ให้ ถ้า{name}ชนะพนันกับเขาสักเรื่อง ใครขโมยกุญแจเหล็กของคนเฝ้าประตูเมืองมาได้ก่อนรุ่งสาง คนนั้นได้ถุงไปทั้งถุง
  choices:
    - id: take_the_bet
      label: รับพนัน ไปเอากุญแจของคนเฝ้าประตูเมือง
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          คนเฝ้าประตูเมืองห้อยกุญแจไว้ที่เข็มขัดด้านหลัง ตอนตีสองเขาเดินออกมาปัสสาวะข้างกำแพงทุกคืน {name}รอจนเขาหันหน้าเข้ากำแพง แล้วปลดห่วงกุญแจด้วยปลายเล็บ ห่วงไม่ทันกระทบกันเลยสักครั้ง

          ฟินนิคนั่งรออยู่ที่บันไดน้ำพุกลางเมือง มือเปล่า เขาไปถึงประตูช้ากว่า{name}ครึ่งชั่วโมง เขาโยนถุงเงินให้ แล้วถามว่าคืนพรุ่งนี้ว่างไหม
        effects: { stats: { DEX: 1 }, gold: 5, alignment: { law: -1 }, flags: [rival_rogue, beat_finnick] }
      failure:
        text: |
          ห่วงกุญแจกระทบกันตอนที่{name}ปลดได้ครึ่งห่วง คนเฝ้าประตูหันมา {name}วิ่งหนีไปทางตรอกปลาเค็ม เขาวิ่งตามมาสามตรอกก่อนจะหอบหยุด

          ฟินนิคนั่งรอที่บันไดน้ำพุกลางเมือง หมุนกุญแจเหล็กพวงเดียวกันเล่นอยู่บนนิ้ว เขาบอกว่าตอนคนเฝ้าวิ่งตาม{name}ไปนั้น ประตูเมืองไม่มีใครเฝ้าเลยสักคน ขอบใจมาก
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [rival_rogue, lost_to_finnick] }
    - id: snatch_it_back
      label: ล้วงถุงคืนจากเสื้อเขาเดี๋ยวนี้ ตอนเขากำลังพูด
      check: { stat: DEX, dc: 15 }
      success:
        text: |
          ฟินนิคยังพูดเรื่องพนันไม่จบ ถุงเงินก็กลับมาอยู่ในมือ{name}แล้ว เขาพูดต่ออีกสองประโยคก่อนจะรู้ตัว แล้วหัวเราะออกมาดังจนคนในตลาดหันมามอง

          เขาบอกว่าไม่มีใครล้วงเขาได้มาตั้งแต่อายุสิบสอง แล้วขอให้{name}บอกชื่อ บอกว่าต่อไปถ้าเห็นถุงไหนที่{name}ตามอยู่ เขาจะเว้นให้ อาจจะ
        effects: { stats: { DEX: 1 }, gold: 5, flags: [rival_rogue, beat_finnick] }
      failure:
        text: |
          มือของ{name}ยังไม่ทันถึงถุง ฟินนิคก็จับข้อมือไว้ได้ เขาบีบไม่แรง แต่ไม่ยอมปล่อย บอกว่าคนล้วงตอนอีกฝ่ายกำลังพูดต้องรอให้อีกฝ่ายหายใจเข้าก่อน

          เขาปล่อยมือ{name}พร้อมกับยัดเหรียญหนึ่งเหรียญใส่ฝ่ามือ บอกว่าเป็นค่าเรียน แล้วเดินหายเข้าไปในฝูงคน ถุงเงินของพ่อค้าพรมไปกับเขา
        effects: { gold: 1, stats: { WIS: 1 }, flags: [rival_rogue, lost_to_finnick] }
    - id: point_out_to_merchant
      label: ตะโกนบอกพ่อค้าพรมว่าผู้ชายผมแดงคนนี้ล้วงถุงเขา
      text: |
        พ่อค้าพรมหันมา ฟินนิคยิ้มให้{name}ทีหนึ่ง แล้วโยนถุงเงินคืนให้พ่อค้าข้ามหัวคนสองคน ก่อนจะหายไปในฝูงคนเร็วกว่าที่ใครจะคว้าแขนได้ทัน พ่อค้าพรมนับเงินครบ แล้วให้{name}สองเหรียญเป็นค่าตาดี

        คืนนั้นตอนเดินกลับห้องเช่า{name}เจอฟินนิคนั่งรออยู่บนบันได เขาบอกว่าไม่โกรธ แค่อยากรู้ว่าคนที่ตามถุงมาสามแผงแล้วตะโกนบอกเจ้าของถุงเป็นคนแบบไหน
      effects: { gold: 2, alignment: { law: 1 }, reputation: { dock_rats: -1 }, flags: [rival_rogue, shouted_on_finnick] }

- id: adult.rogue_rats_favor
  stage: adult
  weight: 30
  when:
    age: [20, 24]
    class: rogue
  text: |
    คนของหนูท่ามาหาตอนค่ำ บอกว่าหัวหน้าหนูท่าฝากถามว่า{name}ยังจำได้ไหมว่าใครให้ที่นอนในปีแรก ใครให้กินตอนที่ยังไม่มีงาน คนในเมืองท่าทุกคนรู้ว่าคำถามแบบนี้แปลว่าถึงเวลาใช้หนี้แล้ว

    งานคืนนี้คือยืนเฝ้าปากซอยหน้าร้านรับจำนำของตาโอเรม ระหว่างที่คนอื่นงัดตู้เหล็กหลังร้าน ตาโอเรมเป็นคนเดียวในย่านที่รับจำนำเสื้อขาดๆ ของ{name}ในปีที่ไม่มีอะไรเหลือจะจำนำ แล้วไม่เคยขายมันออกไปจนกว่า{name}จะมาไถ่คืน
  choices:
    - id: stand_watch
      label: ไปยืนเฝ้าปากซอยตามที่สั่ง
      text: |
        {name}ยืนพิงกำแพงปากซอยจนตีสาม ผิวปากบอกพวกข้างในสองครั้งตอนยามเดินผ่าน ตู้เหล็กหลังร้านเปิดได้ตอนตีสองครึ่ง ข้างในมีของจำนำของคนครึ่งย่าน

        ตาโอเรมเปิดร้านตามปกติตอนเช้า นั่งหน้าตู้เหล็กว่างเปล่าอยู่ทั้งวัน ไม่ได้ร้องเรียกยาม เพราะของในตู้ครึ่งหนึ่งเป็นของที่ยามไม่ควรรู้ว่ามีอยู่ หนูท่าส่งเงินมาให้{name}หกเหรียญ บอกว่าหนี้ปีแรกหมดแล้ว
      effects: { gold: 6, alignment: { moral: -1 }, reputation: { dock_rats: 1 }, flags: [robbed_oram] }
    - id: warn_oram
      label: ไปบอกตาโอเรมก่อน ให้เอาของสำคัญออกจากตู้
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ตาโอเรมฟัง{name}จบ แล้วหัวเราะในคอ แกบอกว่าแกรับจำนำในเมืองท่ามาสี่สิบปี หนูท่าจะมาสักวันแกรู้มาตั้งแต่ปีแรก แกยกของในตู้ออกไปซ่อนใต้พื้นร้านด้วยกันกับ{name}จนเกือบเที่ยงคืน เหลือไว้แค่ของที่ไม่มีใครมาไถ่แล้ว

          คืนนั้น{name}ไปยืนเฝ้าปากซอยตามสั่ง พวกที่งัดตู้ได้ของไปครึ่งตู้ ของที่ขายได้แค่ราคาเศษเหล็ก หัวหน้าหนูท่าบ่นว่าตาโอเรมแก่จนไม่มีของดี แต่นับหนี้ปีแรกของ{name}ว่าหมดแล้ว
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, reputation: { dock_rats: 1 }, flags: [saved_orams_goods] }
      failure:
        text: |
          ตาโอเรมฟังได้ครึ่งเรื่อง แล้วเรียกหลานชายให้ไปตามยาม {name}ยังพูดไม่จบ ยามก็มาถึงหน้าร้านแล้ว พวกหนูท่าเห็นยามจากหลังคาร้านตรงข้าม ไม่มีใครลงมา

          เช้าวันต่อมา คนของหนูท่ามาบอกว่าหัวหน้ารู้แล้วว่าใครไปพูดอะไรกับใคร หนี้ปีแรกของ{name}ยังไม่หมด และตอนนี้เพิ่มขึ้นมาอีกหนึ่งปี
        effects: { gold: -3, alignment: { moral: 1 }, reputation: { dock_rats: -2 }, flags: [rats_owe_grudge] }
    - id: pay_it_off
      label: เอาเงินที่เก็บไว้ทั้งหมดไปซื้อหนี้ปีแรกคืนจากหัวหน้าหนูท่า
      requires: { min_gold: 6 }
      text: |
        หัวหน้าหนูท่านับเหรียญของ{name}บนโต๊ะทีละเหรียญ นับสองรอบ แล้วบอกว่าหนี้ปีแรกของทุกคนไม่มีราคา เพราะไม่มีใครเคยเอาเงินมาจ่าย ทุกคนจ่ายด้วยงาน แต่ถ้า{name}อยากเป็นคนแรก เขาก็จะรับไว้

        คืนนั้นหนูท่าส่งคนอื่นไปยืนเฝ้าปากซอย ตู้เหล็กของตาโอเรมเปิดได้ตอนตีสองครึ่งเหมือนที่วางไว้ {name}ไม่ได้อยู่ที่นั่น แต่ก็รู้ทุกอย่างตั้งแต่ก่อนมันจะเกิด
      effects: { gold: -6, alignment: { law: 1 }, flags: [bought_out_rats_debt] }

# ---------- นักเวท ----------
- id: adult.wizard_rival_severin
  stage: adult
  weight: 30
  when:
    age: [19, 22]
    class: wizard
  text: |
    สมาคมโรงกลั่นประกาศจ้างแบบตะเกียงน้ำค้างดาวที่กินน้ำค้างครึ่งเดียวของตะเกียงที่ใช้กันอยู่ ใครทำได้ได้ค่าแบบห้าสิบเหรียญ ช่างเวทในเมืองส่งแบบไปสี่สิบกว่าแบบ สมาคมเรียกมาสาธิตต่อหน้าคณะกรรมการแค่สองแบบ แบบหนึ่งของ{name} อีกแบบของเซเวริน

    เซเวรินแต่งตัวดีกว่าคณะกรรมการทุกคน ลูกชายเจ้าของโรงงานแก้ว เรียนเวทกับครูส่วนตัวมาตั้งแต่เจ็ดขวบ ตะเกียงของเขาสวยเหมือนเครื่องประดับ ระหว่างรอ{name}เห็นว่าแก้วครอบของเขาบางเกินไป ถ้าจุดนานเกินครึ่งชั่วโมงจะร้าว คณะกรรมการจะจุดทดสอบทั้งคืน
  choices:
    - id: show_own
      label: สาธิตตะเกียงของตัวเองให้ดีที่สุด ไม่ยุ่งกับของเขา
      check: { stat: INT, dc: 14 }
      success:
        text: |
          ตะเกียงของ{name}หน้าตาเหมือนกาน้ำบุบ แต่ไฟนิ่ง กินน้ำค้างดาวน้อยกว่าครึ่งของตะเกียงเก่าไปอีกนิด ส่วนตะเกียงของเซเวรินร้าวตอนเที่ยงคืน แสงฟ้ารั่วออกมาเป็นเส้น กรรมการต้องดับด้วยผ้าเปียก

          {name}ได้ค่าแบบห้าสิบเหรียญ สมาคมเก็บไว้สามสิบเป็นค่าทำแม่พิมพ์ เหลือมาถึงมือยี่สิบ ตอนเดินออกจากห้อง เซเวรินขวางประตูไว้ บอกว่าแก้วของเขาบางเพราะตั้งใจให้บาง ปีหน้าเขาจะทำให้บางกว่านี้และไม่ร้าว
        effects: { stats: { INT: 1 }, gold: 8, reputation: { distillers: 1 }, flags: [rival_wizard, beat_severin] }
      failure:
        text: |
          ตะเกียงของ{name}ไฟสั่นตั้งแต่ชั่วโมงที่สอง กินน้ำค้างน้อยลงจริง แต่ไม่ถึงครึ่ง ส่วนตะเกียงของเซเวรินร้าวตอนเที่ยงคืน กรรมการเลยไม่ให้ใครชนะ ปีหน้าค่อยประกาศใหม่

          เซเวรินเก็บเศษแก้วกลับไปทุกชิ้น ตอนผ่านโต๊ะของ{name} เขาก้มดูไส้ตะเกียงของ{name}นานพอจะจำได้ทุกส่วน แล้วบอกว่าไฟที่สั่นแบบนี้แปลว่าลมเข้าทางฐาน
        effects: { stats: { INT: 1 }, flags: [rival_wizard, tied_severin] }
    - id: warn_him
      label: เดินไปบอกเซเวรินเรื่องแก้วครอบก่อนเริ่ม
      text: |
        เซเวรินฟังโดยไม่หันมามอง แล้วถามว่า{name}เป็นใครถึงมาสอนเขาเรื่องแก้ว บ้านเขาทำแก้วมาสามรุ่น {name}ไม่เถียง กลับไปนั่งที่ตัวเอง แก้วครอบของเขาร้าวตอนเที่ยงคืนพอดี

        กรรมการให้รางวัล{name}ครึ่งหนึ่ง อีกครึ่งเก็บไว้ปีหน้า สามวันต่อมามีคนรับใช้ของบ้านเซเวรินมาส่งกล่องไม้ที่ห้องเช่า ข้างในเป็นแก้วครอบตะเกียงหนาสองนิ้ว ทำมืออย่างดี ไม่มีจดหมาย
      effects: { gold: 4, alignment: { moral: 1 }, items: [thick_lamp_glass], flags: [rival_wizard, warned_severin] }
    - id: steal_his_trick
      label: ระหว่างพัก แอบดูไส้ตะเกียงของเขา เอาส่วนที่ดีมาใส่ของตัวเอง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ไส้ตะเกียงของเซเวรินหมุนเป็นเกลียว แบบที่{name}ไม่เคยเห็นในตำราเล่มไหน {name}จำได้ในการมองครั้งเดียว กลับไปบิดไส้ของตัวเองให้เป็นเกลียวด้วยคีมก่อนคณะกรรมการกลับเข้าห้อง

          ตะเกียงของ{name}กินน้ำค้างครึ่งเดียวพอดี ของเซเวรินร้าวตอนเที่ยงคืน {name}ได้ค่าแบบ แล้วเห็นเซเวรินยืนดูไส้ตะเกียงที่เป็นเกลียวของ{name}ผ่านแก้วครอบ เขาไม่ได้ถาม เขารู้แล้ว
        effects: { stats: { DEX: 1 }, gold: 8, alignment: { moral: -1 }, flags: [rival_wizard, stole_from_severin] }
      failure:
        text: |
          {name}ก้มดูไส้ตะเกียงของเซเวรินได้ไม่ถึงลมหายใจ เขาก็กลับเข้ามาในห้อง ยืนอยู่ข้างหลัง{name}พอดี เขาไม่ได้โวยวาย เขาเรียกกรรมการคนหนึ่งมาดูว่าใครยืนอยู่ตรงไหน

          สมาคมไม่ให้{name}สาธิตต่อ ชื่อ{name}อยู่ในบัญชีช่างที่สมาคมไม่รับแบบอีกสามปี เซเวรินชนะทั้งที่แก้วครอบของเขาร้าวตอนเที่ยงคืน เพราะไม่เหลือใครให้แข่งด้วย
        effects: { reputation: { distillers: -1 }, alignment: { moral: -1 }, flags: [rival_wizard, lost_to_severin, guild_banned_designs] }

- id: adult.wizard_over_the_limit
  stage: adult
  weight: 30
  when:
    age: [20, 24]
    class: wizard
  text: |
    ไฟไหม้ตึกเช่าสี่ชั้นท้ายตรอกตั้งแต่หัวค่ำ คนบนสามชั้นล่างวิ่งลงมาทัน ชั้นบนสุดยังมีเด็กชายคนหนึ่งยืนร้องอยู่หลังหน้าต่าง คานไม้ใต้หลังคาลุกเป็นไฟ ทรุดลงมาทีละนิดจนเหลือที่ว่างเหนือหัวเด็กแค่ไม่กี่คืบ

    คนในตรอกยกถังน้ำต่อกันเป็นแถว ยังไม่มีใครขึ้นไปถึงชั้นสี่ {name}รู้คาถาที่ใช้ยกของหนักได้ แต่ที่เคยยกมามากที่สุดคือหีบไม้ใบเดียว คานไม้ใต้หลังคาหนักกว่านั้นหลายสิบเท่า
  choices:
    - id: hold_the_beam
      label: ร่ายคาถาค้ำคานไว้จากข้างล่าง ให้คนขึ้นไปพาเด็กลงมา
      check: { stat: INT, dc: 15 }
      success:
        text: |
          คานไม้หยุดทรุดตอนที่คาถาคำสุดท้ายออกจากปาก {name}ยืนกลางตรอก มือทั้งสองชูขึ้นไปหาหลังคาที่ลุกไหม้ น้ำหนักของมันลงมาที่หลังตา คนในแถวถังน้ำสองคนวิ่งขึ้นบันไดไปพาเด็กลงมาได้ ตอนที่{name}ปล่อยมือ เลือดกำเดาไหลลงมาถึงคางแล้ว

          คืนนั้น{name}หลับไปแล้วฝันถึงบันไดที่เดินลงไปเท่าไรก็ไม่สุด ข้างล่างมีอะไรสักอย่างกำลังฟังเสียงเท้าของ{name}อยู่ ตื่นมาหมอนเปียกเลือดไปครึ่งใบ แม่ของเด็กชายมายืนรออยู่หน้าห้องเช่าตั้งแต่เช้า
        effects: { hp: -2, stats: { INT: 1 }, alignment: { moral: 1 }, world: { star: 1 }, flags: [held_burning_beam, dreamed_endless_stair] }
      failure:
        text: |
          คานไม้หยุดทรุดได้สามลมหายใจ แล้วน้ำหนักทั้งหมดก็ลงมาที่หลังตาของ{name}พร้อมกัน เลือดพุ่งออกจากจมูกทั้งสองข้าง {name}ล้มลงกลางตรอก ไม่รู้ตัวอีกเลย

          ตื่นมาอีกทีตอนสาย คนในตรอกบอกว่าคานถล่มลงมาหลังจาก{name}ล้ม แต่ในสามลมหายใจนั้นมีคนขึ้นไปถึงหน้าต่างชั้นสี่แล้ว เด็กชายรอดออกมาได้พร้อมแผลไหม้ที่แขน ส่วนตา{name}มองเห็นจุดดำลอยอยู่ข้างซ้ายไปทั้งเดือน
        effects: { hp: -4, stats: { INT: 1 }, alignment: { moral: 1 }, flags: [second_nosebleed] }
    - id: carry_the_boy
      label: วิ่งขึ้นบันไดไปพาเด็กลงมาเอง
      check: { stat: CON, dc: 14 }
      success:
        text: |
          บันไดชั้นสามร้อนจนพื้นรองเท้าติด {name}เอาผ้าเปียกคลุมหัวแล้ววิ่งขึ้นไปไม่หยุด เด็กชายกอดคอ{name}แน่นจนหายใจไม่ออก ทั้งสองลงมาถึงชั้นล่างก่อนคานจะถล่มแค่ครู่เดียว

          คนในตรอกถามว่า{name}เป็นนักเวทไม่ใช่เหรอ ทำไมไม่ใช้เวท {name}ตอบไม่ได้ บางเรื่องขาสองขาทำได้แน่กว่าคาถาที่ยังไม่เคยลอง
        effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [carried_boy_from_fire] }
      failure:
        text: |
          ควันที่ชั้นสามหนาจนมองไม่เห็นบันไดขั้นต่อไป {name}คลานขึ้นไปได้ถึงชั้นสี่ แต่ไปหาเด็กไม่เจอ ต้องคลานกลับลงมาก่อนจะหมดลมหายใจ คนที่ขึ้นบันไดลิงด้านนอกพาเด็กลงมาได้ทางหน้าต่าง

          {name}ไอเป็นเลือดอยู่สามวัน ไอทีไรก็ได้กลิ่นไม้ไหม้
        effects: { hp: -3, flags: [smoke_lungs] }
    - id: run_the_line
      label: ไปยืนหัวแถวถังน้ำ สั่งให้สาดน้ำที่คานอย่างเดียว
      text: |
        {name}รู้ว่าน้ำสาดที่ไฟไม่ช่วยอะไร ต้องสาดที่คานที่ยังไม่ติดไฟ คนในแถวทำตามโดยไม่มีใครถามว่า{name}เป็นใคร คานส่วนที่เปียกทรุดช้าลงพอให้บันไดลิงของยามเมืองมาถึง

        เด็กชายลงมาทางบันไดลิง เนื้อตัวดำไปด้วยเขม่า ไม่มีแผลสักแผล ยามเมืองถามชื่อ{name}ไว้ ไม่ได้บอกว่าจะเอาไปทำอะไร
      effects: { stats: { CON: 1 }, alignment: { moral: 1, law: 1 }, flags: [ran_fire_line] }

# ---------- นักบวช ----------
- id: adult.cleric_rival_lowen
  stage: adult
  weight: 30
  when:
    age: [19, 22]
    class: cleric
  text: |
    ทุกปีนักบวชหนุ่มสาวของวิหาร{god}ทั้งแคว้นต้องกลับไปต่อคำปฏิญาณที่วิหารใหญ่ คนที่บวชพร้อมกันยืนเรียงกันหน้าแท่น นักบวชอาวุโสถามคำถามคนละหนึ่งข้อต่อหน้าทุกคน แล้วจดคำตอบลงสมุดของวิหาร สมุดเล่มนั้นตัดสินว่าใครจะได้กลับไปที่เดิม ใครจะได้ย้าย

    คนยืนก่อน{name}คือโลเวน หญิงสาวที่บวชพร้อม{name}ในปีเดียวกัน นางตอบคำถามของตัวเองได้ยาวและสวยจนนักบวชอาวุโสวางปากกาลงฟัง {name}เคยเห็นประโยคเหล่านั้นในหนังสือเล่มหนึ่งในห้องสมุดวิหาร ทุกคำ

    คำถามของ{name}คือ {god}อยู่ที่ไหน ตอนที่คนตายโดยไม่มีใครช่วย
  choices:
    - id: answer_from_life
      label: ตอบจากสิ่งที่เคยเห็นมากับตา
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          {name}เล่าเรื่องคนตายคนแรกที่ได้เห็นหลังจากบวช ไม่ได้ใส่ชื่อ ไม่ได้บอกว่าตายเพราะอะไร เล่าแค่ว่ามือของเขาจับอะไรไว้ตอนตาย แล้วบอกว่า{god}อยู่ตรงนั้น ในมือที่ยังจับอยู่ ไม่ใช่ในคนที่มาช่วยไม่ทัน

          ห้องเงียบไปนาน นักบวชอาวุโสจดคำตอบลงสมุดยาวกว่าของโลเวนสองบรรทัด ตอนออกจากวิหาร โลเวนเดินมาข้างๆ แล้วถามว่าคนนั้นจับอะไรไว้ {name}บอกนาง นางไม่ได้ถามต่อ
        effects: { stats: { WIS: 1 }, flags: [rival_cleric, beat_lowen] }
      failure:
        text: |
          {name}เริ่มเล่าเรื่องคนตายคนแรกที่ได้เห็น แล้วเล่าไม่จบ ภาพในหัวมาถึงก่อนคำ ประโยคค้างอยู่ในคอ นักบวชอาวุโสรอ แล้วรอต่อ แล้วจดอะไรสั้นๆ ลงสมุด เรียกคนถัดไป

          โลเวนได้ย้ายไปวิหารใหญ่ในเมืองหลวง {name}ได้กลับไปที่เดิม คืนนั้นโลเวนมาเคาะประตูห้องพัก บอกว่าคำตอบที่{name}เล่าไม่จบนั้น นางอยากฟังตอนจบ
        effects: { stats: { WIS: 1 }, flags: [rival_cleric, lost_to_lowen] }
    - id: answer_by_book
      label: ตอบตามคัมภีร์ของวิหารให้ครบทุกข้อ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ตอบตามคัมภีร์ บทที่เจ็ด ข้อที่สองถึงข้อที่ห้า ไม่ขาดไม่เกิน นักบวชอาวุโสจดลงสมุด บอกว่าครบ ถูกต้อง ไม่มีที่ติ แล้วเรียกคนถัดไปก่อนที่{name}จะได้ถอยกลับเข้าแถว

          {name}ได้ย้ายไปวิหารที่ใหญ่ขึ้น ส่วนโลเวนได้ไปวิหารใหญ่ในเมืองหลวง ก่อนแยกกัน นางบอกว่าคัมภีร์บทที่เจ็ดเป็นบทที่นางชอบน้อยที่สุด เพราะมันตอบคำถามได้ครบทุกข้อ
        effects: { stats: { INT: 1 }, alignment: { law: 1 }, gold: 2, flags: [rival_cleric] }
      failure:
        text: |
          {name}ตอบคัมภีร์บทที่เจ็ดสลับข้อ ข้อสามมาก่อนข้อสอง นักบวชอาวุโสหยุดปากกาไว้กลางประโยค มองขึ้นมาครู่หนึ่ง แล้วจดต่อ คนในแถวสองคนกลั้นหัวเราะ

          โลเวนได้ย้าย {name}ได้กลับไปที่เดิม พร้อมคัมภีร์เล่มใหม่ที่นักบวชอาวุโสส่งให้ เปิดค้างไว้ที่บทเจ็ด
        effects: { stats: { INT: 1 }, flags: [rival_cleric, lost_to_lowen] }
    - id: expose_her
      label: บอกต่อหน้าทุกคนว่าคำตอบของโลเวนมาจากหนังสือในห้องสมุด
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}บอกชื่อหนังสือ เลขชั้น และหน้าที่ประโยคเหล่านั้นอยู่ นักบวชอาวุโสส่งเด็กวิหารไปเอาหนังสือมา เปิดดูตรงหน้าทุกคน แล้วขีดเส้นในสมุดใต้ชื่อโลเวน

          โลเวนไม่ได้ย้าย {name}ได้ย้ายแทน ตอนออกจากห้อง นางเดินผ่าน{name}ไปโดยไม่หันมา ในมือยังถือหนังสือเล่มนั้นไว้ นางขอยืมกลับไปอ่านอีกรอบ
        effects: { stats: { CHA: 1 }, alignment: { law: 1, moral: -1 }, flags: [rival_cleric, exposed_lowen, lowen_grudge] }
      failure:
        text: |
          โลเวนหันมามอง{name} แล้วบอกนักบวชอาวุโสว่าใช่ นางท่องมาจากหนังสือเล่มนั้น เพราะนางยังไม่เคยเห็นใครตายโดยไม่มีใครช่วย คำตอบที่ดีที่สุดที่นางมีจึงเป็นคำตอบของคนอื่น

          นักบวชอาวุโสจดคำพูดนั้นลงสมุดแทนคำตอบแรก โลเวนได้ย้าย ส่วนคำถามของ{name} นักบวชอาวุโสเลื่อนไปถามปีหน้า เพราะเวลาหมดแล้ว
        effects: { alignment: { moral: -1 }, flags: [rival_cleric, lost_to_lowen, lowen_grudge] }
    - id: say_dont_know
      label: บอกว่าไม่รู้
      text: |
        {name}บอกว่าไม่รู้ ห้องเงียบลงทันที นักบวชอาวุโสถามว่าแน่ใจหรือ {name}บอกว่าแน่ใจ ทุกครั้งที่ไปถึงช้า{name}ก็ถามคำถามเดียวกัน ยังไม่เคยได้คำตอบ

        นักบวชอาวุโสจดลงสมุดสามคำ {name}ได้กลับไปที่เดิม โลเวนได้ย้าย ตอนเย็นนักบวชอาวุโสเรียก{name}ไปหาคนเดียว บอกว่าสามคำนั้นแกก็เคยตอบเมื่อสี่สิบปีก่อน ตอนนั้นแกก็ได้กลับไปที่เดิมเหมือนกัน
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [rival_cleric, lost_to_lowen, said_dont_know] }

- id: adult.cleric_sanctuary
  stage: adult
  weight: 30
  when:
    age: [20, 24]
    class: cleric
  text: |
    ชายคนนั้นวิ่งเข้ามาในวิหารตอนพระอาทิตย์ตก มือจับขอบแท่นของ{god}ไว้แน่น ตามธรรมเนียมเก่าที่ทุกวิหารยังถือ คนที่จับแท่นไว้ได้ ใครก็เอาตัวออกไปไม่ได้จนกว่าจะปล่อยมือเอง ยามเมืองสี่คนตามมาหยุดอยู่ที่ประตู

    หัวหน้ายามบอกว่าชายคนนี้ขโมยเงินเจ้านายไปสามสิบเหรียญ ส่วนชายคนนั้นบอกว่าเงินนั้นเป็นค่าแรงสามปีที่เจ้านายไม่ยอมจ่าย คืนนี้นักบวชที่อยู่เวรในวิหารมีคนเดียว คือ{name}
  choices:
    - id: keep_custom
      label: ยืนขวางประตู บอกยามว่าตามธรรมเนียม ใครก็แตะเขาไม่ได้
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ยืนอยู่ระหว่างยามกับแท่น ไม่ได้ถือไม้เท้า ไม่ได้ยกมือ แค่บอกธรรมเนียมนั้นทีละคำ แล้วบอกชื่อหัวหน้ายามที่เพิ่งได้ยินเมื่อครู่ เพิ่มเข้าไปท้ายประโยค หัวหน้ายามยืนนิ่งอยู่นาน แล้วพาลูกน้องไปนั่งรอข้างนอก

          ชายคนนั้นจับแท่นไว้สามวันสามคืน {name}เอาน้ำกับขนมปังมาให้เขาวางไว้ใกล้มือ วันที่สี่เจ้านายของเขามาเอง ยอมจ่ายค่าแรงหนึ่งปีแลกกับเงินที่เหลือ ชายคนนั้นปล่อยมือจากแท่นแล้วเดินออกจากวิหารได้
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [kept_sanctuary] }
      failure:
        text: |
          หัวหน้ายามฟัง{name}จนจบ แล้วบอกว่าธรรมเนียมนั้นห้ามใครแตะคนที่จับแท่น ไม่ได้ห้ามรอ ยามสี่คนนั่งรออยู่ในวิหารทั้งคืน ไม่ได้แตะใคร

          ตอนตีสี่ชายคนนั้นหลับไป มือหลุดจากแท่นลงมาวางบนตัก ยามเอาตัวเขาไปก่อนที่{name}จะเดินมาถึง ทั้งวิหารได้ยินเสียงเขาร้องเรียกชื่อ{god}ไปจนสุดถนน
        effects: { alignment: { moral: 1 }, stats: { WIS: 1 }, flags: [lost_sanctuary_man] }
    - id: hand_him_over
      label: บอกเขาให้ปล่อยมือ ไปขึ้นศาลให้ถูกต้อง
      text: |
        {name}คุกเข่าลงข้างเขา บอกว่าธรรมเนียมจับแท่นช่วยได้แค่คืนนี้ แต่ศาลช่วยได้ทั้งชีวิต ถ้าค่าแรงสามปีนั้นมีจริง {name}จะไปเป็นพยานเรื่องที่เขาเล่าคืนนี้ให้

        เขาปล่อยมือ ยามพาตัวไป สิบวันต่อมาศาลตัดสินว่าเขาขโมย เพราะไม่มีกระดาษสักแผ่นว่าเจ้านายติดค่าแรง {name}ยืนอยู่หลังห้องตอนศาลอ่านคำตัดสิน เขาไม่ได้หันมาหา
      effects: { alignment: { law: 1, moral: -1 }, flags: [handed_over_sanctuary] }
    - id: get_the_proof
      label: ให้เขาจับแท่นไว้ แล้วออกไปหาคนงานคนอื่นของเจ้านายเขามาเป็นพยาน
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          {name}ไปถึงบ้านเจ้านายเขาตอนสองยาม คนงานในโรงหลังบ้านมีเก้าคน ห้าคนยังไม่ได้ค่าแรงมาสองปี สองคนสามปี ไม่มีใครกล้าพูดจนกระทั่ง{name}ถามว่าใครที่ยังจำได้ว่าเงินเดือนสุดท้ายที่ได้มาเป็นเหรียญตราอะไร

          เช้านั้นคนงานเจ็ดคนเดินตาม{name}เข้าวิหาร ไปยืนข้างแท่น หัวหน้ายามนับคนงานแล้วนับเงินสามสิบเหรียญในมือตัวเอง แล้วกลับไปหาเจ้านายคนนั้นแทน
        effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [proved_sanctuary_case] }
      failure:
        text: |
          คนงานในโรงหลังบ้านไม่มีใครยอมเปิดประตูให้ {name}เคาะอยู่จนเจ้าของบ้านตื่น เขาออกมายืนบนบันได ถามว่านักบวชมาทำอะไรหน้าบ้านคนตอนสองยาม แล้วบอกว่าพรุ่งนี้เขาจะส่งจดหมายไปที่วิหารใหญ่

          {name}กลับไปวิหารตอนเช้า ชายคนนั้นยังจับแท่นอยู่ ยามยังนั่งรออยู่ หนึ่งเดือนต่อมาวิหารใหญ่ส่งจดหมายมาเตือนเรื่องนักบวชที่เข้าไปยุ่งเรื่องเงินของคนในเมือง
        effects: { stats: { WIS: 1 }, alignment: { moral: 1, law: -1 }, flags: [temple_warned_you] }

# ---------- พราน ----------
- id: adult.ranger_rival_hasken
  stage: adult
  weight: 30
  when:
    age: [19, 22]
    class: ranger
  text: |
    กระดานค่าหัวหน้าโรงเตี๊ยมติดกระดาษแผ่นหนึ่งไว้สามสัปดาห์ หมูป่าตัวผู้ขนาดเท่าลูกวัว ขวิดคนตัดฟืนตายไปสองคน ค่าหัวแปดเหรียญ {name}ตามรอยมันมาสองวัน จนรอยกีบใหม่ไปหยุดที่ลำธาร

    ริมลำธารมีผู้ชายคนหนึ่งนั่งอยู่บนก้อนหินแล้ว ธนูวางบนตัก ข้างเท้ามีลูกธนูหักสองดอก เขาบอกว่าชื่อฮัสเกน ตามหมูตัวนี้มาสามวัน ยิงไปสองดอก หนังมันหนาเกินหัวธนู มันอยู่ในพงอ้อตรงหน้านั่น กำลังรอคนที่โง่พอจะเดินเข้าไป
  choices:
    - id: go_in_first
      label: เดินเข้าพงอ้อไปก่อน ล่อให้มันออกมา
      check: { stat: DEX, dc: 14, foe: nature }
      success:
        text: |
          หมูป่าพุ่งออกมาจากพงอ้อตอนที่{name}เดินเข้าไปได้แปดก้าว {name}กระโดดหลบขึ้นตอไม้ หมูวิ่งเลยไปถึงลำธาร หันข้างให้ฮัสเกนพอดี ลูกธนูดอกที่สามของเขาเข้าใต้รักแร้ตรงที่หนังบางที่สุด

          ฮัสเกนบอกว่าค่าหัวแบ่งครึ่ง เพราะคนล่อกับคนยิงสำคัญเท่ากัน แล้วบอกว่าคราวหน้าเขาจะล่อเอง {name}ยิง จะได้รู้ว่าใครยิงดีกว่า
        effects: { stats: { DEX: 1 }, gold: 4, flags: [rival_ranger, hasken_partner] }
      failure:
        text: |
          หมูป่าพุ่งออกมาเร็วกว่าที่{name}คิด {name}กระโดดหลบได้ครึ่งตัว เขี้ยวมันเกี่ยวน่องขวาไปทั้งแถบ ฮัสเกนยิงดอกที่สามเข้าใต้รักแร้ มันวิ่งต่อไปได้อีกสิบก้าวแล้วล้ม

          เขาพันแผลให้{name}อย่างคล่องมือ แล้วบอกว่าค่าหัวเป็นของเขาทั้งหมด เพราะคนที่ยังเดินได้คือคนที่ต้องลากหมูกลับไป แต่เขาจะซื้อข้าวให้{name}มื้อหนึ่ง
        effects: { hp: -3, flags: [rival_ranger, lost_to_hasken] }
    - id: find_another_way
      label: อ่านรอยรอบพงอ้อ หาทางที่มันจะออกมาเอง
      check: { stat: WIS, dc: 13, foe: nature }
      success:
        text: |
          {name}เดินวนรอบพงอ้อห่างๆ หนึ่งรอบ เจอทางเดินของหมูป่าที่มันใช้ไปกินน้ำทุกเช้า โคลนตรงนั้นมีรอยกีบซ้อนกันหลายสิบรอย {name}ปีนขึ้นต้นไม้เหนือทางนั้น รอจนรุ่งสาง

          หมูป่าเดินออกมาเอง ช้าและไม่ระวัง เพราะทางนี้ไม่เคยมีคน ลูกธนูของ{name}ลงตรงต้นคอตรงที่หนังพับ ฮัสเกนเดินมาดูตอนสาย ยืนมองรอยกีบในโคลนแล้วบอกว่าเขานั่งรอผิดที่มาสามวัน
        effects: { stats: { WIS: 1 }, gold: 8, flags: [rival_ranger, beat_hasken] }
      failure:
        text: |
          {name}เดินวนรอบพงอ้อจนมืด ไม่เจอทางที่ใช่ เจอแต่รอยเก่า ตอนกลับมาที่ลำธาร ฮัสเกนไม่อยู่ที่ก้อนหินแล้ว

          เช้าวันต่อมา{name}เดินกลับไปโรงเตี๊ยม เห็นหมูป่าตัวนั้นนอนอยู่บนเกวียนหน้ากระดานค่าหัว ฮัสเกนนั่งนับเหรียญอยู่ข้างๆ เขาบอกว่าระหว่างที่{name}เดินวนนั้น หมูมันออกมาดูว่าใครเดินเสียงดัง
        effects: { stats: { WIS: 1 }, flags: [rival_ranger, lost_to_hasken] }
    - id: leave_it_to_him
      label: ยกค่าหัวให้เขา แล้วไปหางานอื่น
      text: |
        {name}บอกว่าหมูตัวนี้เป็นของคนที่ตามมาก่อน ฮัสเกนหัวเราะ บอกว่าพรานที่ยอมยกค่าหัวให้คนอื่นง่ายๆ แบบนี้จะอดตายก่อนอายุสามสิบ แต่เขาจะจำชื่อไว้

        สองวันต่อมาเขาเอาหมูป่าตัวนั้นกลับมาที่โรงเตี๊ยมได้ ลากมาคนเดียว ตอนรับค่าหัว เขาแบ่งเหรียญมาวางไว้บนโต๊ะของ{name}สองเหรียญ บอกว่าค่าที่ไม่เดินเข้าพงอ้อไปทำให้หมูตื่น
      effects: { gold: 2, alignment: { moral: 1 }, flags: [rival_ranger] }

- id: adult.ranger_far_from_home
  stage: adult
  weight: 30
  when:
    age: [20, 24]
    class: ranger
  text: |
    งานนี้พา{name}มาไกลจากถิ่นเกิดกว่าทุกครั้ง หมาป่าตัวเมียตัวหนึ่งลากเด็กเลี้ยงแกะไปจากทุ่งหญ้าทางใต้ ชาวบ้านรวมเงินได้สิบเหรียญ

    ดินที่นี่สีผิด ลมที่นี่กลิ่นผิด ที่บ้าน{name}รู้ว่าสัตว์เดินผ่านทางไหนเหมือนรู้ว่าพื้นห้องตรงไหนเหยียบแล้วลั่น ที่นี่ความรู้แบบนั้นเงียบลงไป เหมือนหูข้างหนึ่งอื้อ รอยเท้าหมาป่าเป็นแค่รอยเท้า ไม่บอกอะไรมากกว่านั้น
  choices:
    - id: hire_local_kid
      label: จ้างเด็กเลี้ยงแกะในหมู่บ้านให้พาไปดูที่ที่หมาป่าชอบไป
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          เด็กผู้หญิงที่{name}จ้างอายุเก้าขวบ เป็นพี่สาวของเด็กที่หมาป่าลากไป นางรู้ว่าหมาป่าตัวนั้นมีลูกอยู่ในโพรงหินหลังเขา รู้ว่ามันลงมาตอนลมพัดจากเขาลงทุ่ง เพราะแกะได้กลิ่นมันไม่ทัน

          {name}ไปซุ่มรอใต้ลมตามที่นางบอก หมาป่าลงมาตอนพลบ ลูกธนูดอกเดียวจบ เด็กผู้หญิงขอดูหน้ามันใกล้ๆ ยืนดูอยู่นาน แล้วขอให้{name}ไปดูลูกของมันที่โพรงหินด้วยกัน
        effects: { stats: { CHA: 1 }, gold: 5, flags: [killed_the_she_wolf] }
      failure:
        text: |
          ไม่มีเด็กคนไหนยอมพาคนแปลกหน้าเข้าเขา พ่อแม่ห้ามไว้หมด {name}ขึ้นเขาไปคนเดียว ตามรอยผิดไปสองวัน เจอแต่โพรงหินว่างเปล่ากับกระดูกแกะ

          พอกลับลงมาถึงหมู่บ้าน ชาวบ้านจ้างพรานอีกคนที่เกิดในเขาลูกนั้นไปแล้ว เขาเอาหัวหมาป่าลงมาได้ตั้งแต่วันแรก
        effects: { stats: { WIS: 1 }, flags: [lost_far_bounty] }
    - id: track_by_eye
      label: ตามรอยด้วยตาอย่างเดียว เหมือนพรานที่ไม่มีเวทเขาทำกัน
      check: { stat: WIS, dc: 14, foe: nature }
      success:
        text: |
          {name}ตามรอยช้าเหมือนเด็กหัดเดิน ก้มนับรอยเล็บ ดมดินที่เล็บคุ้ยขึ้นมา ดูขนที่ติดหนาม วันที่สามเจอโพรงหินหลังเขา หมาป่าตัวเมียยืนขวางปากโพรงอยู่ ข้างหลังมันมีลูกสามตัว

          ลูกธนูดอกแรกของ{name}ลงที่หัวไหล่ ดอกที่สองลงที่คอ มันล้มลงหน้าปากโพรง ลูกสามตัวไม่ยอมออกมา {name}เรียนรู้ในสามวันนั้นว่าพรานโดยไม่มีเวทก็ยังเป็นพราน แค่ช้ากว่า
        effects: { stats: { WIS: 1 }, gold: 5, flags: [killed_the_she_wolf, tracked_without_magic] }
      failure:
        text: |
          รอยที่{name}ตามเป็นรอยหมาป่าจริง แต่ไม่ใช่ตัวที่ต้องการ เป็นหมาป่าตัวผู้ตัวใหญ่ที่เดินมาตามหลังจนถึงลำธาร {name}รู้ตัวก็ตอนที่มันกระโจนเข้ามาจากข้างหลัง

          {name}ฟันมันออกไปได้ด้วยมีดเดินป่า แขนซ้ายมีรอยเขี้ยวสี่รู ลงเขามามือเปล่า ชาวบ้านจ่ายค่าตามรอยให้หนึ่งเหรียญ
        effects: { hp: -3, gold: 1, flags: [wolf_bite_scar] }
    - id: go_home
      label: บอกชาวบ้านตรงๆ ว่าที่นี่ไม่ใช่ถิ่นของตัวเอง แล้วกลับบ้าน
      text: |
        {name}บอกชาวบ้านว่าพรานที่ไม่รู้จักดินก็เหมือนคนตาบอดถือธนู ควรจ้างคนที่เกิดในเขาลูกนี้ ชาวบ้านบางคนว่า{name}ขี้ขลาด บางคนจ่ายค่าเดินทางให้สองเหรียญ

        ทางกลับบ้านใช้เวลาห้าวัน วันที่ห้าลมเปลี่ยนกลิ่น ดินเปลี่ยนสี ความรู้ที่เงียบไปค่อยๆ กลับมาทีละนิด เหมือนน้ำที่ซึมกลับเข้าบ่อ {name}ไม่เคยรู้มาก่อนว่าคิดถึงมันมากแค่ไหน
      effects: { gold: 2, stats: { WIS: 1 }, flags: [ranger_went_home] }

# ---------- กวีเร่ ----------
- id: adult.bard_rival_liran
  stage: adult
  weight: 30
  when:
    age: [19, 22]
    class: bard
  text: |
    เพลงที่ผู้หญิงคนนั้นร้องในโรงเตี๊ยมเป็นเพลงของ{name} เพลงที่แต่งตอนอายุสิบหก ร้องให้คนในถิ่นฟังไม่กี่ครั้ง ทำนองเดิม ท่อนแรกเดิม แต่ท่อนจบไม่ใช่ของ{name} ท่อนจบที่นางแต่งใหม่ดีกว่าของเดิม และทั้งโรงเตี๊ยมร้องตามได้

    คนในโรงเตี๊ยมเรียกนางว่าลีราน นางร้องเพลงนี้ทุกคืนมาครึ่งปีแล้ว ไม่เคยบอกใครว่าใครแต่ง ไม่มีใครถาม
  choices:
    - id: sing_original
      label: ขึ้นไปร้องเพลงเดียวกันต่อจากนาง ด้วยท่อนจบเดิม
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ร้องท่อนแรกเหมือนนาง แต่ช้ากว่า เบากว่า ท่อนจบเดิมของ{name}ไม่มีใครร้องตามได้ เพราะไม่มีใครเคยได้ยิน โรงเตี๊ยมเงียบฟังจนจบ คนแก่ที่นั่งมุมห้องปรบมือก่อน แล้วคนทั้งห้องปรบตาม

          ลีรานรอจน{name}ลงจากเวทีไม้ แล้วบอกว่านางได้ยินเพลงนี้จากคนเลี้ยงม้าที่ร้องผิดครึ่งเพลง นางเลยแต่งท่อนจบเองเพราะไม่รู้ว่ามีท่อนจบอยู่แล้ว ตอนนี้นางรู้แล้ว และนางว่าท่อนจบของนางดีกว่า
        effects: { stats: { CHA: 1 }, gold: 3, flags: [rival_bard, beat_liran] }
      failure:
        text: |
          {name}ร้องท่อนแรกได้ดี แต่พอถึงท่อนจบเดิม คนในโรงเตี๊ยมร้องท่อนจบของลีรานแทรกขึ้นมาทั้งห้อง ร้องดังกว่า{name}จนเสียงของ{name}จมหายไป

          ลีรานยืนอยู่ข้างเวทีไม้ ไม่ได้ร้องตาม นางรอให้คนในห้องร้องจบ แล้วบอก{name}ว่าเพลงไม่ได้เป็นของคนแต่ง เป็นของคนที่ร้องตามได้
        effects: { stats: { WIS: 1 }, flags: [rival_bard, lost_to_liran] }
    - id: claim_it
      label: บอกเจ้าของโรงเตี๊ยมว่าเพลงนี้เป็นของตัวเอง
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          เจ้าของโรงเตี๊ยมเรียกลีรานมาถามต่อหน้า{name} นางไม่ปฏิเสธ นางบอกว่าได้ยินมาจากคนเลี้ยงม้า ไม่รู้ว่าใครแต่ง ถ้า{name}แต่ง ก็ขอบใจที่แต่ง

          เจ้าของโรงเตี๊ยมจ้าง{name}ร้องสามคืนต่อสัปดาห์ ลีรานสามคืน คืนที่เจ็ดสองคนแบ่งกันร้อง ใครคนดูโยนเหรียญให้มากกว่า คนนั้นได้เลือกเพลงปิดคืน
        effects: { gold: 3, alignment: { law: 1 }, flags: [rival_bard, shares_stage_liran] }
      failure:
        text: |
          เจ้าของโรงเตี๊ยมถามว่ามีใครรู้ว่า{name}แต่งเพลงนี้บ้าง {name}บอกชื่อคนในถิ่นได้สามคน ไม่มีใครอยู่ที่นี่สักคน

          เขาบอกว่าทุกคืนมีคนมาบอกว่าเพลงนั้นเพลงนี้เป็นของตัวเอง แล้วจ้างลีรานต่อตามเดิม คืนนั้นลีรานร้องเพลงนั้นอีกรอบ ร้องดีกว่าทุกคืน
        effects: { stats: { WIS: 1 }, flags: [rival_bard, lost_to_liran] }
    - id: sing_together
      label: รอนางร้องจบ แล้วไปขอร้องท่อนจบเดิมด้วยกันเป็นเพลงสองเสียง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ลีรานฟังท่อนจบเดิมของ{name}จบ แล้วบอกว่าท่อนนี้ร้องตอนเพลงจบไม่ได้ แต่ร้องตรงกลางได้ ทั้งสองนั่งแก้เพลงที่โต๊ะหลังโรงเตี๊ยมจนเที่ยงคืน ได้เพลงที่ยาวขึ้นหนึ่งท่อน มีท่อนที่เสียงหนึ่งร้องอีกเสียงตอบ

          คืนต่อมาคนในโรงเตี๊ยมร้องตามได้ทั้งสองเสียง ผู้ชายร้องท่อนหนึ่ง ผู้หญิงร้องอีกท่อน เจ้าของโรงเตี๊ยมขึ้นค่าจ้างให้ทั้งสองคน
        effects: { stats: { CHA: 1 }, gold: 2, alignment: { moral: 1 }, flags: [rival_bard, liran_duet] }
      failure:
        text: |
          ลีรานฟังท่อนจบเดิมจบ แล้วบอกตรงๆ ว่าไม่เพราะ นางไม่อยากร้องท่อนที่ไม่เพราะ ถ้า{name}อยากร้องก็ร้องคนเดียว

          {name}ไม่ได้ร้อง คืนนั้นนั่งฟังนางร้องเพลงของตัวเองที่มีท่อนจบของคนอื่นอยู่หลังห้อง จนจบแล้วก็ยังนั่งต่อ
        effects: { stats: { WIS: 1 }, flags: [rival_bard, lost_to_liran] }

- id: adult.bard_bride_signal
  stage: adult
  weight: 30
  when:
    age: [20, 24]
    class: bard
  text: |
    งานแต่งงานลูกสาวพ่อค้าเกลือจ้าง{name}มาร้องเพลงทั้งคืน เจ้าบ่าวแก่กว่าเจ้าสาวสามสิบปี เป็นเจ้าของเรือเกลือที่พ่อของเจ้าสาวติดเงินอยู่ ตอนพักร้องเพลงแรก เจ้าสาวเดินผ่านข้างโต๊ะของ{name} ยัดกระดาษพับเล็กใส่มือ

    กระดาษเขียนว่า ตอนร้องเพลงที่สาม ให้ร้องเพลงทาลิสเพลงไหนก็ได้ที่ยาวที่สุด มีคนรอนางอยู่ที่ประตูหลังครัว เพลงยาวเท่าไร นางก็ไปได้ไกลเท่านั้น
  choices:
    - id: sing_longest
      label: ร้องเพลงทาลิสเพลงที่ยาวที่สุดที่รู้ ให้ทุกคนฟังจนลืมดูเจ้าสาว
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          เพลงทาลิสที่ยาวที่สุดที่{name}รู้มีสิบเก้าท่อน เป็นเพลงคนเรือที่ร้องไปพายไป {name}ร้องจนคนในงานลุกขึ้นปรบมือตามจังหวะพาย ร้องจนเจ้าบ่าวที่เมาแล้วลุกขึ้นเต้นกับแขก ไม่มีใครหันไปดูที่นั่งของเจ้าสาว

          เพลงจบท่อนที่สิบเก้า ที่นั่งของเจ้าสาวว่างไปนานแล้ว คนในงานเพิ่งเห็นตอนที่เจ้าบ่าวตะโกนเรียก พ่อของเจ้าสาวไม่จ่ายค่าร้องเพลงให้{name}สักเหรียญ แต่ยามคืนนั้นเล่าทั้งตลาดว่าเพลงคนเรือเพลงนั้นยาวจนเจ้าสาวพายเรือไปถึงอีกฝั่งแม่น้ำได้
        effects: { stats: { CHA: 1 }, alignment: { moral: 1, law: -1 }, flags: [sang_the_bride_away] }
      failure:
        text: |
          {name}ร้องเพลงคนเรือได้เจ็ดท่อน แล้วลืมท่อนที่แปด ต้องร้องท่อนเจ็ดซ้ำ คนในงานหยุดปรบมือ หันมามองกัน เจ้าบ่าวหันไปมองที่นั่งของเจ้าสาวพอดีตอนที่นางลุกขึ้น

          คนรับใช้วิ่งไปทางครัว พาตัวนางกลับมานั่งที่เดิมก่อน{name}จะร้องจบท่อนสิบ นางไม่ได้มองมาทาง{name}อีกตลอดคืน พ่อของนางจ่ายค่าร้องเพลงให้{name}ครบทุกเหรียญ
        effects: { gold: 3, alignment: { moral: -1 }, flags: [failed_the_bride] }
    - id: show_the_father
      label: เอากระดาษไปให้พ่อของเจ้าสาวดู
      text: |
        พ่อค้าเกลืออ่านกระดาษแล้วฉีกเป็นชิ้นเล็ก บอกคนรับใช้ให้ไปปิดประตูหลังครัว แล้วจ่ายค่าร้องเพลงให้{name}สองเท่า คนที่รออยู่หลังครัวหนีไปได้ เพราะคนรับใช้วิ่งช้า

        {name}ร้องเพลงที่สามเป็นเพลงรักของเวรัส เพลงสั้น เจ้าสาวนั่งฟังจนจบ ใบหน้าเรียบจนคนในงานชมว่านางสงบเหมือนผู้ใหญ่
      effects: { gold: 6, alignment: { law: 1, moral: -1 }, flags: [betrayed_the_bride] }
    - id: sing_short
      label: ทำเหมือนไม่ได้อ่าน ร้องเพลงที่สามตามที่เตรียมมา
      text: |
        {name}ร้องเพลงที่สามเป็นเพลงเกี่ยวข้าว ไม่ยาวไม่สั้น เจ้าสาวลุกจากที่นั่งตอนเพลงขึ้นท่อนที่สอง แล้วนั่งกลับลงไปตอนท่อนที่สาม เพราะเพลงเหลือแค่สามท่อน

        กระดาษพับเล็กยังอยู่ในกระเป๋าเสื้อของ{name}จนเช้า {name}เผามันในเตาโรงเตี๊ยม ยืนดูจนหมดทั้งแผ่น
      effects: { gold: 3, stats: { WIS: 1 }, flags: [ignored_the_bride] }

# ---------- ชาวบ้าน ----------
- id: adult.commoner_bounty_board
  stage: adult
  weight: 30
  when:
    age: [19, 23]
    flags: [path_commoner]
  text: |
    กระดานค่าหัวหน้าโรงเตี๊ยมมีกระดาษแผ่นใหม่ ห้าเหรียญสำหรับใครก็ได้ที่ไล่หุ่นยามคลั่งออกจากโกดังขนสินค้าเก่าริมทางเกวียน หุ่นตัวนั้นเฝ้าโกดังตามคำสั่งสุดท้ายมาตั้งแต่เจ้าของโกดังตาย ไล่ทุกคนที่เดินเข้าไปใกล้ รวมทั้งเด็กสองคนที่หายไปในโกดังเมื่อวาน

    ห้าเหรียญเท่ากับค่าแรงของ{name}สามสัปดาห์ พวกนักผจญภัยที่ปกติรับงานจากกระดานนี้ออกไปทางเหนือกันหมดตั้งแต่ต้นเดือน
  choices:
    - id: go_alone
      label: เอาชะแลงกับเชือกไปที่โกดังคนเดียว
      check: { stat: STR, dc: 14, foe: machine }
      success:
        text: |
          หุ่นยามเดินมาหา{name}ตั้งแต่ประตูโกดัง ช้า หนัก ขาซ้ายลากเพราะเฟืองหัวเข่าสึก {name}รอให้มันยกแขนขึ้น แล้วเอาชะแลงสอดเข้าใต้แผ่นอก งัดจนแผ่นอกอ้า เห็นหลอดคำสั่งสีฟ้าข้างใน ดึงหลอดออกมาได้ในครั้งที่สอง

          หุ่นหยุดค้างอยู่ในท่ายกแขน เด็กสองคนคลานออกมาจากหลังกองลังไม้ หิวน้ำจนพูดไม่ออก เจ้าของโรงเตี๊ยมจ่ายห้าเหรียญ แล้วถามว่า{name}อยากให้เขียนชื่อลงกระดานค่าหัวไหม คราวหน้ามีงานจะได้เรียก
        effects: { stats: { STR: 1 }, gold: 5, alignment: { moral: 1 }, flags: [took_a_bounty, saved_warehouse_kids] }
      failure:
        text: |
          แขนเหล็กของหุ่นยามกวาดมาถึงตัว{name}ก่อนชะแลงจะงัดแผ่นอกได้ {name}ลอยไปกระแทกกองลังไม้ ซี่โครงข้างหนึ่งร้าว ต้องคลานหนีออกมาทางประตู หุ่นเดินตามมาหยุดตรงธรณี เพราะคำสั่งของมันจบที่ประตูโกดัง

          สองวันต่อมานักผจญภัยกลุ่มหนึ่งกลับมาจากทางเหนือ ไล่หุ่นยามได้ในครึ่งชั่วโมง เด็กสองคนยังรอดอยู่หลังกองลัง {name}นอนดูหลังคาห้องเช่าอยู่สิบวัน
        effects: { hp: -4, stats: { CON: 1 }, flags: [took_a_bounty, cracked_rib] }
    - id: gather_neighbors
      label: ชวนเพื่อนบ้านสี่คนไปด้วยกัน แบ่งเงินกันคนละเหรียญ
      check: { stat: CHA, dc: 12, foe: machine }
      success:
        text: |
          ห้าคนกับห้าเหรียญ ไม่มีใครเคยสู้กับหุ่นยาม แต่ช่างไม้คนหนึ่งรู้ว่าหุ่นแบบนี้เลี้ยวช้า {name}ให้ทุกคนยืนรอบหุ่นเป็นวง ใครอยู่ข้างหลังมันคนนั้นขว้างเชือกบ่วง มันหมุนตัวตามเชือกจนขาพันกันล้มลงเอง

          ทั้งห้าคนนั่งทับมันไว้ จนช่างไม้งัดแผ่นอกเอาหลอดคำสั่งออกได้ เด็กสองคนออกมาจากหลังกองลัง คืนนั้นทั้งห้าคนเอาเหรียญคนละเหรียญไปซื้อเหล้าที่โรงเตี๊ยมเดียวกัน
        effects: { stats: { CHA: 1 }, gold: 1, alignment: { moral: 1 }, flags: [took_a_bounty, saved_warehouse_kids] }
      failure:
        text: |
          เพื่อนบ้านไปถึงหน้าโกดังได้สามคน อีกคนกลับไปตั้งแต่เห็นหุ่นยามเดินออกมา หุ่นเหวี่ยงแขนทีเดียว ช่างไม้ข้อมือหัก ทุกคนวิ่งหนีออกมาพร้อมกัน

          เด็กสองคนออกมาจากโกดังได้เองตอนกลางคืน ตอนที่หุ่นยามหยุดเดินเพราะน้ำค้างดาวในอกหมด {name}จ่ายค่าหมอให้ช่างไม้สองเหรียญ
        effects: { gold: -2, hp: -1, flags: [took_a_bounty] }
    - id: leave_it
      label: ไม่ใช่งานของตัวเอง รอพวกนักผจญภัยกลับมา
      text: |
        {name}อ่านกระดาษแผ่นนั้นจบ แล้วเดินผ่านไปทำงานตามเดิม ทั้งสัปดาห์เดินผ่านกระดานค่าหัวไปกลับวันละสองรอบ กระดาษแผ่นนั้นยังติดอยู่

        วันที่แปด กระดาษหายไป เจ้าของโรงเตี๊ยมบอกว่านักผจญภัยกลับมาเมื่อวาน ไล่หุ่นยามได้ เด็กสองคนรอดหนึ่งคน
      effects: { stats: { WIS: 1 }, flags: [ignored_the_board] }

- id: adult.commoner_workmate_funeral
  stage: adult
  weight: 30
  when:
    age: [20, 24]
    flags: [path_commoner]
  text: |
    ฮาเบลทำงานข้าง{name}มาสามปี เป็นคนที่เล่าเรื่องตลกเรื่องเดิมทุกเช้าจนทุกคนท่องได้ เขาตายเมื่อวานตอนบ่าย เพราะงานที่ทุกคนทำมาทุกวันพลาดไปครั้งเดียว นายไม่ได้มาดูศพ ส่งคนมาบอกว่าค่าแรงเดือนนี้จะจ่ายให้ภรรยาของเขาครึ่งหนึ่ง เพราะเขาทำงานได้แค่ครึ่งเดือน

    ภรรยาของฮาเบลนั่งอยู่หน้าบ้าน ลูกสองคนนั่งข้างๆ ไม่มีใครในบ้านรู้ว่าจะเอาเงินที่ไหนมาฝังศพ
  choices:
    - id: give_wages
      label: เอาค่าแรงหนึ่งสัปดาห์ของตัวเองไปให้ภรรยาของเขา
      requires: { min_gold: 3 }
      text: |
        {name}วางเหรียญไว้บนตักนาง ไม่ได้นับให้ดู นางไม่ได้นับเหมือนกัน นางกำเหรียญไว้ในมือจนทุกเหรียญอุ่น

        วันฝังศพ คนงานมาครบทุกคน มีคนเล่าเรื่องตลกเรื่องเดิมของฮาเบลข้างหลุมศพ ไม่มีใครหัวเราะ แล้วทุกคนก็หัวเราะพร้อมกัน
      effects: { gold: -3, alignment: { moral: 1 }, flags: [helped_habel_widow] }
    - id: collect_together
      label: เดินถือหมวกไปขอทุกคนในงาน คนละเท่าที่ให้ได้
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ถือหมวกเดินไปหาทุกคน ตั้งแต่คนงานด้วยกัน ไปจนถึงร้านขายข้าวที่ฮาเบลซื้อทุกเช้า ร้านเหล้าที่เขานั่งทุกเย็น หมวกหนักขึ้นเรื่อยๆ จนต้องใช้สองมือถือ

          เงินในหมวกพอฝังศพ พอค่าเช่าบ้านไปอีกครึ่งปี ภรรยาของฮาเบลกอด{name}ไว้นาน แล้วถามว่าเขามีเพื่อนมากขนาดนี้ตั้งแต่เมื่อไร
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [helped_habel_widow, organized_collection] }
      failure:
        text: |
          คนงานด้วยกันใส่หมวกคนละเหรียญ คนอื่นบอกว่าไม่รู้จักฮาเบล หรือบอกว่าเดือนนี้ตัวเองก็ไม่พอ เงินในหมวกพอแค่ค่าโลงไม้ ไม่พอค่าหลุม

          {name}ใส่เงินของตัวเองเพิ่มลงไปจนพอ แล้วเอาหมวกที่ว่างเปล่าใบนั้นกลับบ้าน
        effects: { gold: -2, alignment: { moral: 1 }, flags: [helped_habel_widow] }
    - id: face_the_boss
      label: ไปบ้านนาย บอกว่าคนตายในงานต้องได้ค่าแรงเต็มเดือน
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}ไม่ได้ไปขอ {name}ไปนับให้นายฟังว่าเดือนนี้งานของฮาเบลทำเสร็จไปเท่าไร คนงานที่เหลือต้องทำแทนเขาอีกเท่าไร ถ้าคนงานรู้ว่านายจ่ายคนตายครึ่งเดือน เดือนหน้าจะมีคนลาออกกี่คน

          นายจ่ายเต็มเดือน บวกค่าโลงไม้ ส่งคนเอาไปให้ภรรยาของฮาเบลตั้งแต่บ่ายวันนั้น แต่ตั้งแต่วันนั้น ทุกครั้งที่นายเดินผ่าน{name} เขาจะหยุดดูว่า{name}กำลังทำอะไรอยู่
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [helped_habel_widow, boss_watches_you] }
      failure:
        text: |
          นายฟัง{name}ได้สามประโยค แล้วบอกว่าใครไม่พอใจค่าแรงก็ไปหางานที่อื่นได้ พรุ่งนี้มีคนมายืนรอหน้าประตูเป็นสิบ

          เช้าวันต่อมา{name}ไปทำงานตามเดิม ค่าแรงสัปดาห์นั้นหายไปหนึ่งวัน นายบอกว่าเป็นวันที่{name}ไม่อยู่ทำงานแต่ไปเดินเล่นที่บ้านเขา
        effects: { gold: -1, alignment: { moral: 1 }, flags: [boss_watches_you] }
