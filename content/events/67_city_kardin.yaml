# ชุด ม แพ็ก B: คาร์ดิน แปดเรื่องตามแบบ "แปดเรื่องของหนึ่งเมือง" ในใบงาน
# ย่าน: junction (คนมาใหม่ลงจากรถไฟ) foundries ledger_row · หน้าเดิมของเมือง: เดลมาร์ รูค นายชุมทางของรางสามสาย
# เรื่องตึง: วันครบกำหนดหนี้ ขบวนถ่านที่ไม่มา ช่างหลอมที่หยุดงาน · ไม่มีใครเกิดในคาร์ดิน ทุกคนมากับรถไฟ
# หนี้ของคาร์ดินเป็นของคนอื่น จนกว่าตัวละครจะลงชื่อเอง (กู้ = gold บวกกับ flag หรือ gold ลบกับ debt: true)

- id: adult.city_kardin_hiring_notice
  stage: adult
  scene: market
  weight: 12
  when:
    age: [19, 56]
    location_tag: arvel_village
    city: none
    not_flags: [institute_student, left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter]
  text: |
    ประกาศจ้างงานของโรงหลอมแห่งหนึ่งในคาร์ดินตอกอยู่ที่เสาหน้าโรงเตี๊ยมของหมู่บ้าน กระดาษหนา หมึกพิมพ์ ตัวอักษรโตพอให้คนอ่านไม่คล่องอ่านออกจากอีกฝั่งถนน รับคนทุกฝีมือ ค่าแรงสามเท่าของลานนวดข้าว ห้องเหนือรางมีให้เช่าในวันที่ลงจากรถ

    ใต้ประกาศมีบรรทัดตัวเล็กกว่า ใครไม่มีค่ารถไฟ ลงชื่อรับเงินล่วงหน้าสามเหรียญได้ที่คนติดประกาศ หักคืนจากค่าแรงสามเดือนแรก ลงชื่อต่อหน้าเสมียนของธนาคารเบเลคที่มาด้วยกัน ปากกาของเสมียนวางอยู่บนโต๊ะหน้าโรงเตี๊ยม ข้างหมึกขวดเล็ก

    รถไฟขบวนบ่ายจอดที่ป้ายหน้าหมู่บ้านครึ่งชั่วยาม ปีที่แล้วคนหนุ่มสาวในหมู่บ้านขึ้นขบวนนี้ไปเจ็ดคน กลับมาเยี่ยมบ้านตอนเกี่ยวข้าวสองคน ทั้งสองคนใส่รองเท้าหนังคู่ใหม่ และไอทุกเช้า
  choices:
    - id: take_the_advance
      label: ลงชื่อรับเงินล่วงหน้า แล้วขึ้นขบวนบ่าย
      text: |
        ปากกาของเสมียนเย็นจนนิ้วชา หมึกบนกระดาษแห้งเร็วกว่าหมึกธรรมดา เสมียนเป่าทีเดียวก็พับได้ เขานับเหรียญสามเหรียญใส่มือ{name} แล้วบอกว่าส่วนที่เหลือจะคุยกันที่ถนนสมุดบัญชี

        ขบวนบ่ายออกตรงเวลา ตอนสางรถไฟเข้าย่านชุมทางของคาร์ดิน ควันจากเตาหลอมทำให้ฟ้าเป็นสีเดียวกับรางเหล็ก นิ้วที่จับปากกายังเย็นอยู่ถึงวันที่สาม
      effects:
        gold: 3
        city: { move: kardin }
        mark: ย้ายไปคาร์ดิน
        flags: [moved_to_kardin, took_a_foundry_advance]
    - id: pay_own_fare
      label: จ่ายค่ารถไฟเอง ไม่ลงชื่อกับใคร
      requires: { min_gold: 2 }
      text: |
        {name}นับเหรียญสองเหรียญให้นายสถานีที่ป้าย คนติดประกาศยักไหล่ บอกว่าไปถึงแล้วค่อยมาที่โรงหลอมก็ได้ ไม่มีใครบังคับ เสมียนของธนาคารไม่เงยหน้าจากสมุด

        ตอนสางรถไฟเข้าย่านชุมทาง {name}ลงจากตู้พร้อมเงินที่เหลือในกระเป๋า เท่าไรก็เป็นของตัวเองทั้งหมด ห้องแรกที่ได้อยู่เหนือรางสายเหนือ พื้นสั่นทุกครั้งที่ขบวนผ่าน
      effects:
        gold: -2
        city: { move: kardin, home: room }
        mark: ย้ายไปคาร์ดิน
        flags: [moved_to_kardin, paid_own_fare_to_kardin]
    - id: let_the_train_go
      label: ปล่อยขบวนบ่ายไป
      text: |
        รถไฟจอดครึ่งชั่วยาม มีคนในหมู่บ้านขึ้นไปสามคน คนหนึ่งในนั้นเป็นคนที่{name}รู้จักตั้งแต่เด็ก โบกมือจากหน้าต่างตู้จนลับโค้ง

        ประกาศยังตอกอยู่ที่เสาหน้าโรงเตี๊ยมอีกเดือนหนึ่ง ฝนลงสองครั้ง หมึกพิมพ์จางจนเหลือแต่ตัวเลขสามเท่า ใครเดินผ่านก็ยังอ่านออก
      effects: { flags: [let_the_kardin_train_go] }

- id: adult.city_kardin_pour_night
  stage: adult
  scene: smithy
  weight: 22
  when:
    age: [19, 64]
    city: kardin
  text: |
    คืนเทเหล็กของโรงหลอมใหญ่ฝั่งตะวันออกมาเดือนละครั้ง ทั้งย่านเตาหลอมสว่างจนอ่านหนังสือกลางถนนได้ ประกายไฟลอยข้ามหลังคาแถวห้องเช่าหลังโรงหลอมเป็นสาย คนในแถวนั้นนอนกับถังน้ำข้างเตียงทุกคืนเทเหล็ก

    คืนนี้ลมเปลี่ยนทาง ประกายก้อนหนึ่งตกลงบนหลังคาที่ไม้ระแนงข้างใต้ผุ ควันขึ้นจากชายคา คนในแถวห้องเช่าออกมาตั้งแถวส่งถังน้ำจากบ่อปลายซอยขึ้นบันไดพาด แถวขาดไปสามคน ถังเปล่าต้องวิ่งกลับเอง

    ห่างไปสองช่วงตึกมีประตูน้ำของรางหล่อเย็นโรงหลอม เปิดแล้วน้ำจะไหลลงร่องซอยทั้งสาย คนที่ไม่ได้อยู่ย่านเตาหลอมไม่รู้ว่าวงล้อเปิดอยู่หลังกองเศษเหล็กกองไหน
  choices:
    - id: join_the_bucket_line
      label: เข้าแถวส่งถังน้ำ ตรงช่องที่ขาด
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ยืนตรงโคนบันไดพาด รับถังจากมือคนข้างล่าง ส่งขึ้นให้คนข้างบน ไม่รู้ว่ากี่ถัง แขนชาตั้งแต่ถังที่สี่สิบ แต่มือยังไม่ปล่อย ควันที่ชายคาเปลี่ยนจากดำเป็นขาว แล้วเหลือแต่ไอน้ำ

          ตอนสางคนห้องบนสุดของแถวนั้นลงมาเอาขนมปังกับน้ำมันหมูให้คนในแถวทุกคน เขาจำหน้าทุกคนได้ เพราะยืนดูจากหน้าต่างทั้งคืน
        effects: { stats: { CON: 1 }, city: { merit: 1 }, flags: [held_the_bucket_line_on_pour_night] }
      failure:
        text: |
          ถังที่สามสิบกว่าหลุดจากมือคนบนบันไดพาด ตกลงมากระแทกหัวไหล่ซ้ายของ{name} ขอบเหล็กของถังบาดเป็นแนวยาว {name}ยังยืนอยู่ในแถว ส่งถังด้วยแขนข้างเดียวจนควันหยุด

          ตอนสางคนในแถวพาไปนั่งที่ร้านขายยาหัวซอย คนขายยาไม่คิดเงินค่าน้ำมันทาแผล บอกว่าคืนเทเหล็กเขาไม่คิดเงินคนในแถว
        effects: { hp: -2, city: { merit: 1 }, flags: [scalded_in_the_bucket_line] }
    - id: open_the_quench_sluice
      label: วิ่งไปหมุนวงล้อประตูน้ำของรางหล่อเย็น
      requires: { city: { district: [foundries] } }
      text: |
        วงล้ออยู่หลังกองเศษเหล็กกองที่สาม ฝืดจน{name}ต้องเอาเท้ายันกองเศษเหล็กแล้วดึงทั้งตัว น้ำจากรางหล่อเย็นไหลลงร่องซอยเป็นสาย อุ่นเหมือนน้ำอาบ คนในแถวถังไม่ต้องวิ่งไปบ่อปลายซอยอีก ตักจากร่องตรงหน้าได้เลย

        ไฟดับก่อนเที่ยงคืน ตอนสายหัวหน้าเทของโรงหลอมเดินมาตามหาคนเปิดประตูน้ำ เหล็กแม่พิมพ์หนึ่งแบบร้าวเพราะน้ำหล่อเย็นขาดครู่หนึ่ง เขาด่าไปสามประโยค แล้วถามว่าห้องที่ไหม้เป็นห้องของใคร
      effects: { city: { merit: 1 }, flags: [opened_the_quench_sluice] }
    - id: fetch_the_old_man
      label: ขึ้นไปพาคนแก่ห้องบนสุดลงมาก่อน
      text: |
        ประตูห้องบนสุดลงกลอนจากข้างใน คนแก่ในห้องนั่งอยู่หน้าต่าง บอกว่าเขาอยู่คาร์ดินมาสี่สิบปี เห็นหลังคาไหม้มาสิบกว่าหลัง หลังนี้ยังไม่ไหม้ {name}พาเขาลงบันไดจนได้ ช้า ทีละขั้น

        หลังคาไม่ไหม้ แถวถังน้ำเอาอยู่ คนแก่กลับขึ้นห้องตอนสาง ก่อนขึ้นเขาบอก{name}ว่าคราวหน้าไม่ต้องมา
      effects: { alignment: { moral: 1 }, flags: [brought_down_the_top_floor] }
    - id: watch_from_the_corner
      label: ยืนดูจากปากซอย
      text: |
        จากปากซอยเห็นแถวถังน้ำขาดแล้วต่อ ขาดแล้วต่อ คนที่วิ่งผ่าน{name}ไปเข้าแถวไม่มีใครหันมาดู ควันที่ชายคาค่อยๆ เปลี่ยนสีจนเหลือแต่ไอน้ำ

        ตอนสายคนในแถวห้องเช่านั้นนั่งกินข้าวด้วยกันที่ร้านหัวซอย {name}เดินผ่าน ไม่มีใครเรียกเข้าไปนั่ง
      effects: { flags: [watched_the_pour_night_fire] }

- id: adult.city_kardin_witness_bench
  stage: adult
  scene: belek_bank
  weight: 22
  when:
    age: [19, 64]
    city: kardin
  text: |
    หน้าสำนักงานของธนาคารเบเลคทุกแห่งบนถนนสมุดบัญชีมีม้านั่งยาว บนม้านั่งมีพยานรับจ้างนั่งรอ สัญญาที่ลงชื่อต่อหน้าเบเลคต้องมีพยานสองคน ค่าลงชื่อพยานคนละสองเหรียญทองแดง คนที่นั่งม้านั่งนานที่สุดชื่อโครวิน ลงชื่อเป็นพยานมายี่สิบปี เกินหมื่นฉบับ ไม่เคยอ่านสักฉบับ

    เด็กสาวจากหมู่บ้านในอาร์เวลคนหนึ่งยืนอยู่หน้าม้านั่ง ถือสัญญากู้สามเหรียญ จะเอาไปซื้อเมล็ดพันธุ์ให้พ่อ เธอมีเงินจ่ายพยานได้คนเดียว โครวินลงชื่อไปแล้ว เสมียนในสำนักงานบอกให้หาอีกคนมาให้ครบก่อนตะวันตกดิน ไม่อย่างนั้นพรุ่งนี้มาใหม่ ดอกนับจากวันที่ยื่น

    {name}เดินผ่านมาพอดี เด็กสาวถามด้วยสำเนียงหมู่บ้าน ช้าๆ ชัดทุกคำ ว่าเป็นพยานให้ได้ไหม
  choices:
    - id: witness_for_her
      label: ลงชื่อเป็นพยานคนที่สองให้เธอ ไม่คิดเงิน
      text: |
        ปากกาของสำนักงานเย็นจนนิ้วชา {name}ลงชื่อใต้ชื่อโครวิน ลายมือของโครวินเอียงไปทางขวาจนเกือบนอน เสมียนประทับตราแล้วนับเหรียญสามเหรียญใส่มือเด็กสาว

        เธอเก็บเหรียญใส่ถุงผ้าผูกเอว ขอบใจสามครั้ง แล้ววิ่งไปให้ทันขบวนเย็น ตอนนั้นม้านั่งยาวทั้งถนนรู้แล้วว่ามีคนลงชื่อพยานฟรี ตลอดเดือนนั้นมีคนเดินมาถาม{name}อีกห้าคน
      effects: { alignment: { moral: 1 }, city: { merit: 1 }, flags: [witnessed_a_seed_loan_for_free] }
    - id: read_before_signing
      label: ขออ่านสัญญาก่อนลงชื่อ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          บรรทัดที่สิบเอ็ด ถ้าเมล็ดพันธุ์ไม่งอก ดอกเพิ่มเท่าตัวนับจากฤดูเกี่ยว {name}อ่านให้เด็กสาวฟัง เธอไม่รู้ว่ามีบรรทัดนั้น เสมียนในสำนักงานบอกว่าทุกฉบับมีบรรทัดนี้ ใครไม่อยากได้ก็ไม่ต้องกู้

          เด็กสาวยืนนิ่งอยู่ครู่หนึ่ง แล้วลงชื่อ {name}ลงชื่อเป็นพยาน ก่อนเธอกลับ{name}จดบรรทัดที่สิบเอ็ดลงกระดาษแผ่นเล็กให้เธอเอากลับไปให้พ่ออ่าน เธอพับเก็บไว้ในถุงผ้า แยกจากเหรียญ
        effects: { stats: { INT: 1 }, city: { merit: 1 }, flags: [read_a_seed_loan_aloud] }
      failure:
        text: |
          เสมียนดึงสัญญากลับก่อน{name}อ่านถึงบรรทัดที่สาม บอกว่าพยานลงชื่อว่าเห็นคนกู้ลงชื่อ ไม่ได้ลงชื่อว่าอ่าน ถ้าจะอ่านต้องจ่ายค่าคัดสำเนาก่อน

          ตะวันใกล้ตก เด็กสาวยังขาดพยาน {name}วางเหรียญเต็มหนึ่งเหรียญลงบนม้านั่ง จ้างพยานให้เธอหนึ่งคน คนที่ลุกมาลงชื่อเก็บไปทั้งเหรียญ ไม่ทอน และไม่ได้อ่านเหมือนกัน
        effects: { gold: -1, flags: [stopped_from_reading_a_loan] }
    - id: sit_the_bench
      label: นั่งลงบนม้านั่งข้างโครวิน รับค่าพยานแบบคนถนนนี้
      requires: { city: { district: [ledger_row] } }
      text: |
        โครวินขยับให้ที่ บอกว่าม้านั่งไม่มีเจ้าของ แต่ที่นั่งมี {name}ลงชื่อให้เด็กสาวคนนั้นเป็นฉบับแรก แล้วอีกสิบเอ็ดฉบับก่อนตะวันตกดิน ไม่ได้อ่านสักฉบับ ปากกาของสำนักงานเย็นขึ้นทุกฉบับ

        ค่าพยานบ่ายนั้นแลกเป็นเหรียญเต็มได้สองเหรียญ โครวินบอกว่ามือใหม่ได้แค่นี้ ปีหน้าจะได้มากกว่า คนเดินผ่านจะจำหน้าได้ว่านั่งตรงไหน
      effects: { gold: 2, flags: [sat_the_witness_bench] }
    - id: walk_on_by
      label: ส่ายหน้า แล้วเดินผ่านไป
      text: |
        เด็กสาวขอโทษที่รบกวน แล้วหันไปถามคนถัดไป {name}เดินไปถึงปลายถนนสมุดบัญชี หันกลับมา เธอยังยืนอยู่ที่หน้าม้านั่งเดิม ถามคนที่สี่

        ตอนตะวันตกดิน ประตูสำนักงานปิด เธอนั่งลงบนม้านั่งยาวตรงที่โครวินเพิ่งลุกไป รอพรุ่งนี้
      effects: { flags: [walked_past_the_seed_loan] }

- id: adult.city_kardin_due_day
  stage: adult
  scene: home
  weight: 14
  when:
    age: [19, 64]
    city: { id: kardin, mood: [calm], home: [room, house, shop] }
  text: |
    วันครบกำหนดของคาร์ดินมาเดือนละครั้ง ทุกเดือนวันเดียวกัน คนครึ่งเมืองเดินไปถนนสมุดบัญชี อีกครึ่งรออยู่ที่บ้านให้คนครึ่งแรกเดินมาหา

    เปรดัน เพื่อนบ้านผนังติดกันของ{name} เป็นช่างเตาหลอมกะเช้า ลงชื่อกู้ธนาคารเบเลคไว้ตอนเมียป่วยหนักปีก่อน เมียหายแล้ว หนี้ยังไม่หาย วันนี้เขาขาดอีกสองเหรียญ คนคาร์ดินพูดกันว่าสัญญาของเบเลคยึดความอุ่นก่อนยึดบ้าน ใครผิดนัดจะเริ่มหนาวจากปลายนิ้ว ไล่ขึ้นมาทีละข้อ ถึงอย่างนั้นธนาคารก็ยังส่งคนทวงมาเร่ง

    คนทวงสองคนยืนอยู่หน้าห้องเปรดันตั้งแต่สาย เสื้อเรียบ คนหนึ่งถือสมุด อีกคนไม่ถืออะไร เปรดันนั่งบนขั้นบันได มือซุกรักแร้ทั้งสองข้าง ยังไม่ถึงหน้าหนาว คนในซอยเริ่มเปิดหน้าต่างดู
  choices:
    - id: stand_surety
      label: ลงชื่อรับสองเหรียญของเปรดันมาไว้ที่ตัวเอง
      text: |
        คนถือสมุดพลิกไปหน้าหลัง ยื่นปากกาให้ ปากกาเย็นจนนิ้วชา {name}ลงชื่อใต้ชื่อเปรดัน คนทวงสองคนเดินออกจากซอยโดยไม่หันกลับ หน้าต่างในซอยปิดทีละบาน

        เปรดันดึงมือออกจากรักแร้ เป่าลมใส่ฝ่ามือสองที เย็นนั้นเขาเอาเหล็กเส้นที่เหลือจากโรงหลอมมาตีเป็นขอแขวนเสื้อให้{name}สามอัน ไม่ได้พูดเรื่องเงิน
      effects: { gold: -2, debt: true, city: { merit: 1 }, flags: [stood_surety_for_predan] }
    - id: lend_him_two
      label: ยื่นเหรียญสองเหรียญให้เปรดันเอาไปจ่ายเอง
      requires: { min_gold: 2 }
      text: |
        เปรดันรับเหรียญด้วยมือที่ยังเย็น เดินไปจ่ายคนถือสมุดต่อหน้าทุกหน้าต่างในซอย คนถือสมุดขีดเส้นในช่องของเดือนนี้ แล้วบอกว่าเจอกันเดือนหน้า

        ไม่มีกระดาษ ไม่มีชื่อ เปรดันบอกว่าจะคืนให้ตอนรอบเงินหน้า เขาคืนหนึ่งเหรียญในเดือนต่อมา อีกเหรียญเขายังจำได้ทุกครั้งที่สวนกันในซอย
      effects: { gold: -2, alignment: { moral: 1 }, flags: [lent_predan_two] }
    - id: buy_him_a_week
      label: คุยกับคนถือสมุดให้ยืดให้เปรดันอีกหนึ่งสัปดาห์
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ไม่ขอความเมตตา พูดเรื่องเลขล้วนๆ ค่าแรงของเปรดันออกวันไหน ออกเท่าไร หักอะไรไปแล้ว คนถือสมุดฟังแล้วจดวันใหม่ลงในช่องเดิม ตัวเล็ก บอกว่าธนาคารนับดอกเพิ่มเจ็ดวัน ไม่ใช่ความกรุณา

          เจ็ดวันต่อมาเปรดันจ่ายครบ ค่าแรงสัปดาห์ที่ได้เพิ่มพอดีกับดอก หน้าต่างในซอยเลิกเปิดดูตั้งแต่วันที่คนทวงเดินออกไป
        effects: { stats: { CHA: 1 }, city: { merit: 1 }, flags: [bought_predan_a_week] }
      failure:
        text: |
          คนถือสมุดฟังได้สองประโยค แล้วถามว่า{name}จะลงชื่อแทนหรือเปล่า ถ้าไม่ลงก็ไม่ต้องพูด เสียงของ{name}ดังขึ้นกว่าที่ตั้งใจ คนในซอยออกมายืนหน้าประตูกันครึ่งซอย มีคนตะโกนว่าธนาคารเอาความอุ่นไปพอแล้ว

          คนทวงสองคนเดินออกจากซอยโดยไม่เร่ง บอกว่าจะกลับมาพร้อมทหารรักษาเมือง ตอนค่ำแต่ละประตูในซอยมีไม้ค้ำ เปรดันนั่งอยู่ในห้อง ห่มผ้าห่มสองผืน
        effects: { city: { mood: tense }, flags: [raised_the_alley_on_due_day] }
    - id: shut_the_window
      label: ปิดหน้าต่างของตัวเอง
      text: |
        ผ่านหน้าต่างที่ปิด {name}ได้ยินเสียงคนทวงอ่านเลขในสมุด แล้วเสียงเปรดันขอสองวัน แล้วเสียงคนทวงบอกว่าไม่มีสองวัน แล้วไม่มีเสียงอะไรอีก

        คืนนั้นเปรดันเคาะผนังฝั่ง{name}ถามว่ามีผ้าห่มเหลือไหม ข้างนอกยังไม่หนาว ในซอยคนเริ่มพูดกันว่าเดือนหน้าจะไม่มีใครยอมเปิดประตูให้คนทวง
      effects: { city: { mood: tense }, flags: [shut_the_window_on_due_day] }

- id: adult.city_kardin_cold_train
  stage: adult
  scene: station
  weight: 35
  when:
    age: [19, 64]
    city: { id: kardin, mood: [tense] }
  text: |
    ขบวนถ่านจากตลาดตีนเขาไม่เข้าย่านชุมทางมาสี่วัน เตาหลอมทั้งย่านลดไฟลงเหลือครึ่ง ช่างหลอมได้ค่าแรงตามเหล็กที่เท สามโรงวางค้อนตั้งแต่เมื่อวาน

    เช้านี้ขบวนถ่านเข้ามาจริง แต่คนสับรางสับให้วิ่งเลยลานถ่านของโรงหลอม ไปลานของธนาคารเบเลคที่ปลายย่าน ถ่านทั้งขบวนเป็นของธนาคาร ธนาคารจะขายให้โรงหลอมทีละตู้ ราคาตามที่ธนาคารตั้ง

    ช่างหลอมสองร้อยคนเดินมายืนบนรางก่อนถึงประแจ หัวรถจักรเปิดหวูดยาว ยังไม่ชะลอ คนของธนาคารสิบคนยืนอยู่ข้างราง ถือไม้ตะพด {name}อยู่ที่ชานชาลา ห่างจากรางสิบก้าว
  choices:
    - id: stand_on_the_rail
      label: ลงไปยืนบนรางกับช่างหลอม
      text: |
        หัวรถจักรหยุดห่างแถวหน้าไม่ถึงช่วงแขน ไอน้ำพ่นใส่ขาคนแถวแรก คนของธนาคารลงไม้ตะพดก่อนรถหยุดสนิท ช่างหลอมแถวหลังดันขึ้นมา {name}โดนไม้ตะพดที่ซี่โครง แล้วโดนศอกของใครสักคนที่ปาก

        ก่อนเที่ยงตู้ถ่านสามตู้ท้ายขบวนคว่ำลงข้างราง ถ่านกระจายเต็มลาน คนจากทุกซอยมาโกยใส่ถังใส่กระสอบ ทหารรักษาเมืองมาถึงตอนบ่าย ย่านชุมทางปิดทุกร้านถึงเย็น
      effects: { hp: -2, reputation: { belek_bank: -1 }, city: { mood: riot }, flags: [stood_on_the_coal_rail] }
    - id: clear_the_line
      label: ช่วยคนของธนาคารพาคนลงจากรางก่อนหัวรถจักรถึง
      text: |
        {name}ดึงแขนช่างหลอมแถวหน้าที่อยู่ใกล้ที่สุดลงจากราง คนหนึ่ง สองคน ช่างหลอมคนที่สามสะบัดแขนแล้วเหวี่ยงหมัดมาโดนหน้า{name}เต็มแรง แถวหน้าแยกออกพอให้หัวรถจักรผ่าน คนที่เหลือถอยลงจากรางเพราะไม่อยากเป็นคนสุดท้ายที่ยืนอยู่

        ขบวนถ่านเข้าลานของธนาคาร ช่างหลอมแยกย้ายกลับห้องเงียบๆ ทั้งย่าน คนของธนาคารคนหนึ่งจดชื่อ{name}ลงสมุดในช่องที่ไม่ใช่ช่องหนี้ ตั้งแต่วันนั้นช่างหลอมในซอยหลบตา{name}
      effects: { hp: -1, reputation: { belek_bank: 1 }, city: { mood: calm }, flags: [cleared_the_coal_rail] }
    - id: talk_to_the_switchman
      label: วิ่งไปที่ประแจ ขอให้คนสับรางแบ่งตู้ท้ายห้าตู้เข้าลานโรงหลอม
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          คนสับรางเป็นคนที่มากับรถไฟเหมือนทุกคนในเมือง ลูกชายเขาทำงานโรงหลอมที่สอง {name}ถามว่าลูกชายเขายืนอยู่บนรางแถวไหน เขาดึงคันโยกปลดตู้ท้ายห้าตู้ ก่อนหัวรถจักรจะถึงประแจครึ่งลมหายใจ

          ตู้ห้าตู้ไหลเข้าลานโรงหลอม ช่างหลอมลงจากรางไปเปิดตู้ ขบวนที่เหลือผ่านไปลานของธนาคาร ตกเย็นเตาหลอมสามโรงกลับมาติดไฟเต็มเตา นายชุมทางหักค่าแรงคนสับรางสองเดือน เขาไม่บ่น
        effects: { stats: { CHA: 1 }, city: { mood: calm, merit: 1 }, flags: [split_the_coal_train] }
      failure:
        text: |
          คนสับรางไม่ฟัง มือเขาจับคันโยกอยู่แล้ว หันมาบอกว่าถ้าปลดตู้เอง เขาจะไม่มีงานพรุ่งนี้ {name}คว้าคันโยก เขาผลัก{name}ตกลงจากแท่นประแจ เข่ากระแทกรางเหล็ก

          ขบวนวิ่งผ่านประแจไปหยุดหน้าแถวช่างหลอม คนของธนาคารลงไม้ตะพด ช่างหลอมลงกำปั้น ทหารรักษาเมืองมาถึงตอนบ่าย ย่านชุมทางปิดทุกร้านถึงเย็น
        effects: { hp: -1, city: { mood: riot }, flags: [lost_the_switch_lever] }
    - id: stay_on_the_platform
      label: อยู่บนชานชาลา ห่างจากราง
      text: |
        จากชานชาลา {name}เห็นหัวรถจักรหยุด เห็นไม้ตะพดยกขึ้นก่อนใครจะขยับ แล้วเห็นแถวช่างหลอมพับเข้าหาคนของธนาคารเหมือนคลื่น นายสถานีไล่ทุกคนบนชานชาลาเข้าโถงรอแล้วลงกลอนประตู

        ตลอดบ่ายเสียงข้างนอกไม่หยุด ตอนเย็นประตูโถงเปิด ถ่านยังกองอยู่ทั่วลานราง คนยังโกยไม่หมด
      effects: { city: { mood: riot }, flags: [watched_the_coal_rail_from_the_platform] }

- id: adult.city_kardin_fever_train
  stage: adult
  scene: station
  weight: 6
  when:
    age: [19, 64]
    city: { id: kardin, mood: [calm, tense] }
  text: |
    ขบวนโดยสารจากชายฝั่งใต้เข้าย่านชุมทางตอนพลบ ตู้ท้ายมีคนไอแห้งสี่คน ตัวร้อนจนหน้าต่างตู้เป็นฝ้า นายสถานีสั่งให้ปลดตู้ท้ายไว้ที่รางข้าง ห่างชานชาลาสามช่วงตู้ คนในตู้นั้นสิบเจ็ดคน ไอบ้าง ไม่ไอบ้าง ทุกคนอยากลงไปหาห้องเหนือราง

    คนชุมทางรู้จักไอแบบนี้ ไข้ท่าเรือ ไอแห้ง ตัวร้อนเจ็ดวัน คนแก่กับเด็กตายก่อน นายสถานีมีคนเฝ้ารางข้างสองคน ทั้งสองคนกลัวไข้มากกว่ากลัวนายสถานี

    ประตูตู้ท้ายเปิดออกครึ่งบาน ชายคนหนึ่งในตู้ห้อยขาลงมาแตะหินโรยราง
  choices:
    - id: hold_the_carriage
      label: ไปยืนเฝ้าประตูตู้ท้าย ส่งน้ำกับขนมปังเข้าทางหน้าต่างจนครบเจ็ดวัน
      check: { stat: CON, dc: 14 }
      success:
        text: |
          {name}ยืนห่างประตูตู้สามก้าว บอกชายที่ห้อยขาว่าน้ำกับขนมปังจะมาทุกเช้าและทุกเย็น ห้อยขาได้ แต่อย่าลง คนเฝ้ารางสองคนเห็นว่ามีคนยืนข้างหน้าก็กลับมายืนข้างหลัง{name} เจ็ดวันเจ็ดคืน{name}นอนบนกระสอบข้างราง ผลัดกับคนเฝ้าราง

          วันที่แปดประตูตู้ท้ายเปิดเต็มบาน คนลงมาสิบห้าคน อีกสองคนห่อผ้าใบลงมา ในย่านชุมทางไม่มีใครไอแห้งในฤดูนั้น นายสถานีจดชื่อ{name}ไว้ในสมุดสถานี ช่องคนเฝ้าราง
        effects: { stats: { CON: 1 }, city: { merit: 1 }, flags: [held_the_fever_carriage] }
      failure:
        text: |
          คืนที่สาม{name}ตัวร้อนเอง ไอแห้งตั้งแต่ตีสอง คนเฝ้ารางทั้งสองคนหายไปก่อนสาง ตอนเช้าประตูตู้ท้ายเปิดเต็มบาน คนในตู้เดินลงไปหาห้องเหนือรางทีละคน ทีละสองคน

          {name}นอนไข้อยู่ห้าวัน วันที่หกลุกได้ ซอยข้างล่างมีผ้าขาวผูกที่ประตูสามบาน
        effects: { hp: -2, city: { mood: plague }, flags: [caught_the_fever_at_the_carriage] }
    - id: find_them_rooms
      label: พาคนในตู้ที่ยังไม่ไอไปหาห้องเหนือราง
      text: |
        คนในตู้ท้ายสิบสามคนที่ยังไม่ไอเดินตาม{name}ไปเป็นแถว ห้องเหนือรางเช่าได้ในวันเดียวเหมือนที่คาร์ดินขึ้นชื่อ เจ้าของห้องไม่ถามว่ามาจากตู้ไหน

        สัปดาห์ต่อมาห้องเหนือรางสายใต้ไอแห้งทั้งแถว แล้วแถวถัดไป แล้วย่านเตาหลอม เตาหลอมสองโรงต้องลดไฟเพราะไม่มีคนเฝ้า
      effects: { alignment: { moral: 1 }, city: { mood: plague }, flags: [found_rooms_for_the_fever_carriage] }
    - id: sell_water_to_the_carriage
      label: แบกถังน้ำไปขายที่หน้าต่างตู้ท้าย
      text: |
        คนในตู้จ่ายแพงกว่าราคาน้ำในเมืองสามเท่า ไม่มีใครต่อ {name}ขายไปสองถังก่อนค่ำ ได้สองเหรียญ มือที่รับเหรียญจากหน้าต่างตู้ร้อนผ่าวทุกมือ

        สามวันต่อมาประตูตู้ท้ายเปิดเต็มบาน นายสถานีไม่ห้ามแล้ว ไข้ท่าเรือลงจากตู้ไปพร้อมคนที่ลง
      effects: { gold: 2, city: { mood: plague }, flags: [sold_water_to_the_fever_carriage] }
    - id: keep_away_from_the_siding
      label: เดินอ้อมรางข้าง ข้ามสะพานลอยไปอีกฝั่ง
      text: |
        จากสะพานลอยเห็นตู้ท้ายจอดอยู่โดดๆ บนรางข้าง ชายคนเดิมยังห้อยขาอยู่ที่ประตู มีคนเดินลงมาสองคน แล้วอีกสองคน

        สัปดาห์ต่อมาเสียงไอแห้งดังขึ้นทั่วย่านชุมทาง {name}ซื้อน้ำส้มสายชูมาล้างมือทุกเช้า ราคาน้ำส้มสายชูขึ้นทุกวัน
      effects: { city: { mood: plague }, flags: [kept_away_from_the_fever_carriage] }

- id: adult.city_kardin_wreck_account
  stage: adult
  scene: station
  weight: 30
  when:
    age: [25, 64]
    city: { id: kardin, min_rank: 3 }
  text: |
    สองเดือนก่อนขบวนสินค้าตกรางที่ประแจสามของย่านชุมทาง คนสับรางตายหนึ่ง คนเดินทางเจ็บหก บันทึกของเดลมาร์ รูค นายชุมทางของรางสามสาย เขียนว่าคนสับรางกะดึกคืนนั้นเมา ประแจไม่เกี่ยว บันทึกต้องมีคนมีหน้ามีตาของเมืองลงชื่อรับรองสามคน ก่อนส่งให้สภาเมืองกับธนาคารเบเลคที่ถือหุ้นรางทั้งสามสาย เดลมาร์มีแล้วสองชื่อ

    ใครในย่านชุมทางก็รู้ว่าประแจสามสึกมาสามปี คนสับรางกะดึกคืนนั้นไม่ดื่ม เมียกับลูกสองคนยังอยู่ห้องเหนือราง ถ้าบันทึกว่าเมา ธนาคารไม่ต้องจ่ายค่าศพ และไม่ต้องเปลี่ยนประแจ

    เดลมาร์ไม่มาเอง เขาส่งเสมียนมาพร้อมบันทึกกับปากกา เสมียนบอกว่านายชุมทางจำได้ว่า{name}เป็นคนที่เมืองนี้ฟังเสียง
  choices:
    - id: sign_the_account
      label: ลงชื่อเป็นคนที่สาม
      text: |
        เสมียนเป่าหมึก ม้วนบันทึกใส่กระบอก ขอบใจแทนนายชุมทาง บันทึกถึงสภาเมืองในวันเดียวกัน ถึงธนาคารวันต่อมา

        ฤดูต่อมาเมียของคนสับรางย้ายออกจากห้องเหนือราง ไปขึ้นขบวนเช้าพร้อมลูกสองคน ประแจสามยังเป็นอันเดิม คนสับรางคนใหม่ทาไขวัวที่ลิ้นประแจทุกกะ เดลมาร์ส่งเหล้าดีมาให้{name}หนึ่งไหตอนสิ้นปี
      effects: { reputation: { belek_bank: 1 }, flags: [signed_delmars_wreck_account] }
    - id: speak_at_the_council
      label: ไม่ลงชื่อ แล้วไปพูดที่สภาเมืองว่าประแจสามสึกมาสามปี
      text: |
        สภาเมืองฟังจนจบ คนของธนาคารที่นั่งท้ายห้องจดทุกคำ เดลมาร์ไม่มาประชุมวันนั้น ส่งเสมียนมานั่งแทน สภาเมืองส่งบันทึกกลับไปให้นายชุมทางเขียนใหม่ เดลมาร์หาชื่อที่สามไม่ได้ทั้งเดือน

        เมียของคนสับรางได้ค่าศพครึ่งเดียว ธนาคารว่าครึ่งที่เหลือรอผลบันทึกฉบับใหม่ ประแจสามเปลี่ยนใหม่ในเดือนต่อมา ตั้งแต่นั้นเสมียนของเดลมาร์ไม่เคยเคาะประตูบ้าน{name}อีก
      effects: { reputation: { belek_bank: -1 }, city: { merit: 1 }, flags: [spoke_against_delmars_account] }
    - id: ask_for_the_switch_book
      label: บอกเสมียนว่าจะลงชื่อเมื่อได้ดูสมุดซ่อมประแจของย่านชุมทางก่อน
      check: { stat: INT, dc: 14 }
      success:
        text: |
          สมุดซ่อมประแจมาถึงในสองวัน {name}ไล่ดูทีละหน้า หน้าของประแจสามมีบรรทัดเดียวกันซ้ำสามปี สึก ขอเปลี่ยน ใต้ทุกบรรทัดมีลายมือเดลมาร์ เลื่อนไปปีหน้า {name}พับมุมหน้านั้น แล้วส่งสมุดคืนพร้อมบันทึกที่ยังไม่ได้ลงชื่อ

          สามวันต่อมาเสมียนมาอีกครั้ง พร้อมบันทึกฉบับใหม่ ประแจสามสึก คนสับรางไม่ได้เมา เดลมาร์ลงชื่อไว้แล้วบรรทัดแรก {name}ลงชื่อเป็นคนที่สาม
        effects: { stats: { INT: 1 }, flags: [amended_delmars_account] }
      failure:
        text: |
          เสมียนกลับไปแล้วไม่มาอีก สมุดซ่อมประแจไม่มาถึง สัปดาห์ต่อมา{name}ได้ยินว่าบันทึกถึงสภาเมืองแล้ว มีชื่อรับรองครบสามชื่อ ชื่อที่สามเป็นของเจ้าของโรงหลอมฝั่งตะวันออก

          เดลมาร์ส่งคนมาบอกว่าไม่เป็นไร คนที่ต้องขอดูสมุดก่อนลงชื่อ เขาจะจำไว้
        effects: { flags: [refused_by_delmar_over_the_switch_book] }
    - id: send_it_back_unsigned
      label: ส่งบันทึกคืนโดยไม่ลงชื่อ แล้วไม่ยุ่งต่อ
      text: |
        เสมียนรับคืนโดยไม่แปลกใจ เขาบอกว่าเดลมาร์มีรายชื่อคนมีหน้ามีตาในเมืองยาวกว่าที่{name}คิด

        สัปดาห์ต่อมาบันทึกถึงสภาเมืองครบสามชื่อ {name}ไม่ได้ถามว่าชื่อที่สามเป็นของใคร ประแจสามยังเป็นอันเดิม
      effects: { flags: [kept_out_of_delmars_account] }

- id: adult.city_kardin_roof
  stage: adult
  scene: home
  weight: 10
  once: false
  when:
    age: [22, 62]
    city: { id: kardin, home: [none, room, family], min_years: 2 }
  text: |
    บ้านในคาร์ดินไม่ได้ขายโดยเจ้าของ ขายโดยธนาคาร ป้ายทองเหลืองของธนาคารเบเลคตอกอยู่ที่ประตูบ้านทุกหลังที่เจ้าของเดิมใช้หนี้ไม่หมด ทุกป้ายเขียนราคาด้วยตัวเลขเดียวกันทั้งเมือง บ้านแคบสองชั้นเหนือรางสิบสองเหรียญ ร้านชั้นล่างริมถนนสิบหกเหรียญ จ่ายครบที่สำนักงานบนถนนสมุดบัญชี ได้กุญแจวันนั้น

    เสมียนขายบ้านของธนาคารพา{name}ไปดูหลังที่อยู่ใกล้ที่สุด ประตูยังมีรอยตะปูของป้ายชื่อเจ้าของเดิม ผนังด้านรางมีรอยร้าวเส้นเดียว ทุกครั้งที่ขบวนผ่าน แก้วที่คนก่อนทิ้งไว้ในตู้สั่นตาม

    เจ้าของเดิมไปไหน เสมียนไม่รู้ เขาบอกว่าธนาคารไม่ได้จดเรื่องนั้น
  choices:
    - id: buy_the_house
      label: ซื้อบ้าน สิบสองเหรียญ
      requires: { min_gold: 12 }
      text: |
        เสมียนนับเหรียญ ประทับตราลงใบโอน แล้วไขป้ายทองเหลืองออกจากประตูด้วยไขควงที่พกมาในกระเป๋าเสื้อ ประตูเหลือรอยป้ายเป็นสี่เหลี่ยมสีอ่อนกว่าเนื้อไม้รอบข้าง

        คืนแรกขบวนผ่านสามรอบ แก้วในตู้สั่นทุกรอบ {name}ไม่ได้ย้ายแก้วออก จนเช้าก็ยังไม่ได้ย้าย
      effects: { gold: -12, city: { home: house }, mark: ซื้อบ้านในคาร์ดิน, flags: [owns_a_house_in_kardin] }
    - id: buy_the_shop
      label: ซื้อร้านชั้นล่างริมถนน สิบหกเหรียญ
      requires: { min_gold: 16 }
      text: |
        ร้านชั้นล่างมีประตูเหล็กพับได้ ชั้นวางของติดผนังสามชั้น เจ้าของเดิมขายตะปูกับบานพับ ยังมีตะปูค้างอยู่ในลิ้นชักใต้โต๊ะหนึ่งกำ สนิมจับเป็นก้อน

        เสมียนไขป้ายทองเหลืองออกให้ แล้วบอกว่าถ้าวันหลังร้านไปไม่รอด ธนาคารมีป้ายใหม่ให้ทุกเมื่อ ป้ายเดิมเขาเอากลับไปด้วย
      effects: { gold: -16, city: { home: shop }, mark: เปิดร้านในคาร์ดิน, flags: [owns_a_shop_in_kardin] }
    - id: walk_away
      label: ขอบคุณเสมียน แล้วเดินกลับ
      text: |
        เสมียนไม่ตื๊อ เขาบอกว่าป้ายทองเหลืองบนประตูบ้านในคาร์ดินมีทุกเดือน ราคาไม่เคยเปลี่ยน คนซื้อเปลี่ยน

        ขากลับ{name}นับป้ายทองเหลืองที่เห็นตามทาง ได้เก้าป้ายก่อนพ้นถนนสายนั้น
      effects: { flags: [walked_past_the_bank_signs] }
