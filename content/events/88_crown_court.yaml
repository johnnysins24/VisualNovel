# ชุด อ สายงานของอาณาจักร: ราชสำนัก (crown_court) 16 เรื่อง ทางเข้า 2 งานขั้นต้น 3 งานขั้นสูง 3 โต๊ะเจ็ดเก้าอี้ 1 เลื่อนขั้น 3 คืนถือหน้ากระดาษ 1 ใบลา 1 ตะเกียงของผู้กล้า 2
# คืนถือหน้ากระดาษออกทุกแปดปีที่อยู่ในวังจนกว่าจะขึ้นที่ปรึกษา (must คู่กับ once: false แบบวันครบสัญญา ทุกทางต่อวาระหรือลาออก) ข้อความจึงไม่เอ่ยถึงดาร์เวลหรือยศของตัวละคร
# คนของวัง (มีแต่ในข้อความ ไม่อยู่ในผังคน): ท่านหญิงเอลดริส ผู้ดูแลห้องชั้นใน จดในสมุดเล่มเล็กว่าใครเข้าวังมาด้วยจดหมายของใคร
#   ดาร์เวล มหาดเล็กรุ่นพี่ สอนว่าระเบียงไหนพื้นลั่น · อิลเซน เสมียนของทางเสมียน (มีเฉพาะเรื่องที่กัน year: [318, 410])
#   บาทหลวงของโบสถ์น้อยไม่มีชื่อ เป็นคนเดียวที่ถือกุญแจตู้ตะเกียง
# งานทุกเรื่องไม่ผูกปี จึงเขียนแค่ห้องชั้นใน ข้างบน และท่านหญิงเอลดริส ไม่เอ่ยถึงกษัตริย์ เจ้าชาย เจ้าหญิง สองปีก หรือทางเสมียน
#   เรื่องที่เอ่ยถึงคือโต๊ะเจ็ดเก้าอี้เรื่องเดียว กัน year: [318, 410]
# ใช้คำว่าโถงล่างแทนท้องพระโรงล่าง เลี่ยงคำว่าพระในข้อความทั้งไฟล์
# ตะเกียงของผู้กล้าสองเรื่องไม่ใช่งาน เรื่องที่ตะเกียงติด (น้ำหนัก 4) เป็นที่เดียวในเกมที่ให้ hero_blood ตัวละครรู้แค่ว่าตะเกียงเป็นของจริง และไม่เคยติดเองให้คนบนเนิน
# ขยับค่าอาณาจักร: งานขั้นสูงสองเรื่อง ±1 (ขุนนาง กัน max_rank: 3) · ตะเกียงติดในมือ ±1 · โต๊ะเจ็ดเก้าอี้ ±2 และทางของคนเลือดผู้กล้า ±3
# ผลงานเพิ่มนอกงาน: จดหมายครั่งไม่มีสี 1 · รอบจุดตะเกียงไม่ได้ให้ (งานซ้ำ) · ช่องยื่นเรื่อง 1 · ซื้อตำแหน่งให้คนที่ควรได้ 1 · ใบลาที่เผาในตะเกียง 1 · อยู่ต่อหลังอ่านสมุดของท่านหญิงเอลดริส 1 รวม 5 (ทางเข้า ข เริ่มที่ผลงาน 2)

# ---------- ทางเข้า ----------
- id: adult.court_kitchen_door
  stage: adult
  weight: 8
  when:
    age: [20, 40]
    location_tag: ventras
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    max_hunted: { crown: 0 }
    not_flags: [job_wardens, job_fort_priest, left_the_court]
  text: |
    ครัวของวังหลวงอยู่ชั้นล่างสุดของเนิน ประตูครัวเปิดออกทางตรอกที่ลาดลงไปหาแม่น้ำ เช้านี้ประตูบานนั้นเปิดค้าง แม่ครัวร่างใหญ่ยืนเท้าสะเอวอยู่ที่ธรณี ตะโกนลงไปในตรอกว่าวังต้องการมือสิบคู่ก่อนเที่ยง มือที่ไม่สั่น ไม่ขโมย และถือถาดได้ คืนนี้มีงานเลี้ยงที่โถงล่าง คนถือถาดป่วยไปสี่คน หนีไปสองคน

    คนในตรอกมาต่อแถวเร็วกว่าที่นางตะโกนจบ คนขายปลา คนแบกน้ำ เด็กหนุ่มเท้าเปล่า หญิงคนหนึ่งที่ชุดสะอาดเกินกว่าจะมาจากตรอกนี้ ข้างแม่ครัวมีผู้หญิงอีกคนยืนอยู่ ผอม ผมเกล้าเรียบไม่มีเส้นไหนหลุด ถือสมุดเล่มเล็ก นางคือท่านหญิงเอลดริส ผู้ดูแลห้องชั้นใน ทุกคนที่จะผ่านประตูครัว นางถามคำถามเดียวกัน มาด้วยจดหมายของใคร

    คนหน้า{name}ยื่นจดหมายของพ่อค้าเหล้าองุ่น คนหน้านั้นยื่นจดหมายของนักบวช {name}ไม่มีจดหมายของใคร แม่ครัววางถาดชามแกงร้อนหกใบลงบนโต๊ะข้างประตู แล้วชี้บันไดคนใช้ที่ขึ้นไปสามชั้น
  choices:
    - id: carry_the_test_tray
      label: ยกถาดชามแกงขึ้นบันไดคนใช้ทั้งสามชั้น
      requires: { not_traits: [curse_brand] }
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          บันไดคนใช้แคบจนไหล่ถูผนังทั้งสองข้าง ขั้นที่สิบเจ็ดโยก {name}ก้าวข้ามไปได้เพราะได้ยินเสียงมันก่อนเท้าจะลง ชามแกงหกใบขึ้นไปถึงชั้นสามโดยไม่มีหยดไหนเลอะขอบถาด ข้างบนมีคนรับถาดไปโดยไม่มองหน้า แล้วยื่นถาดเปล่าคืนมา

          ท่านหญิงเอลดริสจดในสมุดบรรทัดหนึ่ง ไม่มีจดหมาย มาทางประตูครัว แล้วปิดสมุด แม่ครัวโยนผ้ากันเปื้อนผืนหนึ่งมาให้ บอกว่าถาดต่อไปหนักกว่านี้
        effects:
          mark: เข้าเป็นข้ารับใช้ในวังหลวง
          org: { id: crown_court, join: true }
          stats: { DEX: 1 }
          flags: [carried_the_kitchen_tray]
      failure:
        text: |
          ขั้นที่สิบเจ็ดโยก ชามใบริมถาดเลื่อน แกงร้อนราดลงข้อมือ{name}ครึ่งชาม ถาดไม่ตก แต่มีแกงหยดตามขั้นบันไดลงมาเป็นทาง แม่ครัวยื่นผ้าขี้ริ้วให้ผืนหนึ่ง บอกให้เช็ดบันไดให้สะอาดก่อนกลับ

          ท่านหญิงเอลดริสไม่ได้จดอะไร {name}เช็ดบันไดคนใช้จนถึงชั้นสาม ข้อมือแดงเป็นปื้นไปอีกหลายวัน
        effects: { hp: -1, flags: [spilled_the_kitchen_tray] }
    - id: say_no_letter
      label: บอกท่านหญิงเอลดริสตรงๆ ว่ามาเพราะได้ยินแม่ครัวตะโกน
      requires: { not_traits: [curse_brand] }
      text: |
        ท่านหญิงเอลดริสเงยหน้าจากสมุดเป็นครั้งแรกของเช้า ดู{name}ตั้งแต่หัวจรดเท้า แล้วก้มลงจด มาด้วยเสียงของแม่ครัว แม่ครัวหัวเราะลั่นครัว บอกว่าเสียงของนางเพิ่งได้เขียนจดหมายรับคนเข้าวังเป็นฉบับแรก

        ตกค่ำ{name}ยืนถือเหยือกน้ำอยู่ข้างเสาในโถงล่างจนงานเลิก ไม่มีใครเรียกใช้สักครั้ง เหยือกเต็มอยู่อย่างนั้นทั้งคืน แขนข้างที่ถือล้าจนสั่น
      effects:
        mark: เข้าเป็นข้ารับใช้ในวังหลวง
        org: { id: crown_court, join: true }
        alignment: { law: 1 }
        flags: [came_in_by_the_cooks_shout]
    - id: tie_the_kitchen_cloth
      label: ขอผ้าโพกผมแบบคนครัว โพกให้แน่นก่อนยื่นมือรับถาด
      requires: { flag: horns_sawn }
      text: |
        คนครัวทุกคนในวังโพกผม กันเส้นผมตกลงชามแกง แม่ครัวโยนผ้าขาวมาให้ผืนหนึ่ง {name}โพกทับตอเขาสองตอแน่นสองรอบ ผูกปมไว้ท้ายทอย ไม่มีใครดูว่าใต้ผ้ามีอะไร ในครัวที่ทุกหัวโพกผ้าขาวเหมือนกัน หัวไหนก็ไม่ต่างจากหัวไหน

        ท่านหญิงเอลดริสจดว่าไม่มีจดหมาย แล้วจดเพิ่มอีกบรรทัดหนึ่ง {name}ไม่เห็นว่าบรรทัดที่สองเขียนว่าอะไร นางปิดสมุดเร็วกว่าตอนจดคนอื่น
      effects:
        mark: เข้าเป็นข้ารับใช้ในวังหลวง
        org: { id: crown_court, join: true }
        flags: [serves_the_crown_with_hidden_horns]
    - id: back_down_the_alley
      label: หลีกทางให้คนข้างหลัง แล้วเดินกลับลงตรอก
      pass: true
      text: |
        หญิงชุดสะอาดที่อยู่ท้ายแถวขยับขึ้นมาแทนที่ ยื่นจดหมายของใครคนหนึ่งที่ท่านหญิงเอลดริสอ่านนานกว่าฉบับอื่น {name}เดินลงตรอกไปถึงริมแม่น้ำ เรือส่งปลาเพิ่งเข้าเทียบ

        คืนนั้นวังบนเนินจุดตะเกียงทุกหน้าต่าง จากริมแม่น้ำนับได้สามร้อยกว่าดวง แล้วนับต่อไม่ไหว
      effects: { flags: [walked_back_from_the_kitchen_door] }

- id: adult.court_feast_memory
  stage: adult
  weight: 18
  time: night
  when:
    age: [20, 40]
    location_tag: ventras
    any_flags: [job_house_singer, job_troupe, job_bank_spy]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    max_hunted: { crown: 0 }
    not_flags: [job_wardens, job_fort_priest, left_the_court]
  text: |
    งานเลี้ยงในโถงล่างต้องการคนเล่น คนร้อง และคนเข้าออกมากกว่าที่วังมี คืนนี้{name}เข้ามาทางประตูข้างพร้อมคนนอกวังอีกหลายสิบคน แต่ละคนมาด้วยงานของตัวเอง และทุกคนได้ผ้าคาดแขนสีน้ำตาลไว้ให้ยามรู้ว่าเป็นคนนอก

    ตอนงานเลยเที่ยงคืน มหาดเล็กร่างผอมคนหนึ่งยืนถือถ้วยเหล้าสองใบอยู่กลางโถง หน้าซีด เขาจำไม่ได้ว่าถ้วยลายนกเป็นของขุนนางคนไหน ส่วน{name}ดูโต๊ะมาทั้งคืนตามนิสัย จำได้ว่าใครถือถ้วยใบไหน ใครเปลี่ยนถ้วยตอนไหน และใครไม่ได้ดื่มเลยทั้งคืนแม้แต่หยดเดียว

    {name}บอกเขาเบาๆ ว่าถ้วยลายนกเป็นของชายผมเทาที่นั่งหันหลังให้หน้าต่าง มหาดเล็กคนนั้นชื่อดาร์เวล เขาส่งถ้วยถึงมือคนที่ใช่ แล้วกลับมาพร้อมผู้หญิงคนหนึ่งที่ผมเกล้าเรียบไม่มีเส้นไหนหลุด ท่านหญิงเอลดริสถามว่า{name}มาด้วยงานของใคร แล้วถามต่อว่าอยากอยู่ต่อหลังงานเลิกไหม
  choices:
    - id: stay_after_the_feast
      label: บอกว่าอยากอยู่ต่อ
      requires: { not_traits: [curse_brand] }
      text: |
        ก่อนเช้ามีคนมาแกะผ้าคาดแขนสีน้ำตาลออกให้ แล้วยื่นผ้ากันเปื้อนสีเทาอ่อนของข้ารับใช้มาแทน ท่านหญิงเอลดริสจดบรรทัดแรกให้ในสมุดเล่มเล็ก มาด้วยถ้วยลายนก แล้วส่งตัวไปให้ดาร์เวล

        ดาร์เวลพาเดินรอบวังชั้นล่างหนึ่งรอบก่อนไก่ขัน ชี้ทางเดินแต่ละทาง บอกว่าใครเดินตอนไหน แล้วบอกว่า{name}จะได้ถือถาดแบบคนอื่น แต่จะได้ยืนในห้องที่คนอื่นไม่ได้ยืน
      effects:
        mark: เข้าเป็นข้ารับใช้ในวังหลวง
        org: { id: crown_court, join: true, merit: 2 }
        flags: [hired_off_the_feast_floor]
    - id: name_the_dry_cup
      label: บอกท่านหญิงเอลดริสด้วยว่าใครในโถงไม่ได้ดื่มเลยทั้งคืน
      requires: { not_traits: [curse_brand] }
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ชี้ชายในเสื้อสีหม่นที่นั่งอยู่ปลายโต๊ะยาว ถ้วยของเขาเต็มตั้งแต่ต้นงาน ตาของเขาดูมือคนถือถาดทุกคนที่ผ่านไป ไม่ได้ดูหน้า ท่านหญิงเอลดริสเหลือบไปทางนั้นแวบเดียว แล้วจดลงสมุดอีกหน้าหนึ่ง ไม่ใช่หน้าของ{name}

          ก่อนงานเลิก ชายคนนั้นไม่อยู่ที่โต๊ะแล้ว ถ้วยเต็มของเขายังวางอยู่ ดาร์เวลยกไปเททิ้งเอง บรรทัดแรกในหน้าของ{name}เขียนว่า มาด้วยตาของตัวเอง
        effects:
          mark: เข้าเป็นข้ารับใช้ในวังหลวง
          org: { id: crown_court, join: true, merit: 2 }
          stats: { WIS: 1 }
          flags: [named_the_dry_cup]
      failure:
        text: |
          ชายที่{name}ชี้ยกถ้วยขึ้นดื่มรวดเดียวหมดพอดีตอนท่านหญิงเอลดริสหันไปดู แล้วเรียกเติมอีกถ้วย นางหันกลับมา ไม่ได้ว่าอะไร

          นางรับ{name}เข้าวังอยู่ดี จดบรรทัดแรกให้ว่า มาด้วยถ้วยลายนก เดือนแรก{name}ได้ล้างถ้วยในครัวล่าง ไม่ได้ขึ้นมาโถงเลยสักคืน
        effects:
          mark: เข้าเป็นข้ารับใช้ในวังหลวง
          org: { id: crown_court, join: true }
          flags: [named_the_dry_cup]
    - id: leave_with_the_outsiders
      label: ขอบคุณ แล้วออกทางประตูข้างพร้อมคนนอกวังคนอื่น
      pass: true
      text: |
        ยามที่ประตูข้างเก็บผ้าคาดแขนสีน้ำตาลคืนทีละผืน นับครบแล้วจึงเปิดประตู ข้างนอกฟ้าเริ่มเป็นสีเทา ตรอกลงเนินมีแต่เสียงรองเท้าของคนที่เพิ่งออกมาด้วยกัน

        หลายวันต่อมามีคนนำกล่องเล็กมาฝากไว้ให้{name} ข้างในเป็นถ้วยกระเบื้องลายนกใบหนึ่ง ไม่มีจดหมาย ไม่มีชื่อคนส่ง
      effects: { flags: [left_the_feast_with_a_bird_cup] }

# ---------- งานขั้นต้น (ข้ารับใช้ มหาดเล็ก) ----------
- id: adult.court_duty_colourless_wax
  stage: adult
  weight: 20
  time: night
  duty: crown_court
  when:
    age: [20, 64]
    org: { id: crown_court, max_rank: 2 }
  text: |
    จดหมายระหว่างห้องในวังไม่เขียนชื่อผู้รับบนซอง มีแต่สีของครั่ง ครั่งแดงไปห้องฝั่งตะวันออก ครั่งดำไปห้องหนังสือ ครั่งไม่มีสีไปห้องที่คนถือต้องรู้เอง คืนนี้ดาร์เวลยื่นซองครั่งไม่มีสีให้{name} บอกทางสามเลี้ยว แล้วบอกว่าไม่ต้องเคาะ ให้สอดใต้ประตู

    ที่เลี้ยวที่สอง มีชายคนหนึ่งยืนพิงเสาอยู่ในเงา เสื้อดี รองเท้าเงียบ ไม่ใช่คนในวัง เขาไม่ได้ขวางทาง เขาแค่ยื่นมือออกมาในแสงตะเกียง บนฝ่ามือมีเหรียญเงินสี่เหรียญ เรียงกันเป็นแถว

    เขาบอกว่าไม่ต้องให้ซอง ไม่ต้องให้อ่าน ขอแค่รู้ว่าประตูบานไหน
  choices:
    - id: slide_it_under
      label: เดินผ่านเขาไป แล้วสอดซองใต้ประตูตามที่ดาร์เวลบอก
      text: |
        ชายในเงาเดินตามมาห่างๆ สองเลี้ยว {name}เลี้ยวผิดทางโดยตั้งใจ พาเขาวนผ่านระเบียงพื้นลั่นสามรอบ จนเขาหยุดตามเพราะเสียงพื้นดังเกินไป กว่าซองจะลอดใต้ประตู ตะเกียงตามระเบียงดับไปครึ่งหนึ่งแล้ว

        ดาร์เวลรออยู่ที่หัวบันได บอกว่าช้าไปเกือบชั่วยาม แล้วถามว่าเจอใครบ้าง {name}เล่า เขาจดอะไรบางอย่างลงหลังมือด้วยปลายถ่าน
      effects: { alignment: { law: 1 }, flags: [delivered_the_colourless_letter] }
    - id: sell_the_door
      label: รับเหรียญ แล้วบอกเขาว่าประตูบานไหน
      text: |
        เขาไม่ได้ขอบคุณ เขาเก็บมือที่ว่างแล้วกลับเข้าเงา {name}สอดซองใต้ประตูบานนั้นตามเดิม เหรียญเงินสี่เหรียญในกระเป๋าอุ่นจากมือของคนอื่น

        สามวันต่อมา คนในห้องบานนั้นย้ายไปห้องอื่น ไม่มีใครบอกว่าห้องไหน ท่านหญิงเอลดริสเรียกมหาดเล็กกับข้ารับใช้ที่เดินระเบียงนั้นมาถามทีละคน ถาม{name}เป็นคนสุดท้าย และถามสั้นที่สุด
      effects: { gold: 4, alignment: { law: -1 }, flags: [sold_the_door_of_the_colourless_letter] }
    - id: warm_the_wax
      label: เลี่ยงเข้าซอกระเบียง อังครั่งกับตะเกียงจนนิ่ม แล้วแกะอ่าน
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ครั่งนิ่มแล้วลอกออกได้ทั้งแผ่น ข้างในเป็นรายชื่อคนในวังสิบกว่าชื่อ ข้างแต่ละชื่อมีบรรทัดสั้นๆ มาด้วยจดหมายของใคร ลายมือเป็นของท่านหญิงเอลดริส ชื่อที่เก้าเป็นชื่อของ{name}เอง

          {name}กดครั่งกลับจนรอยนิ้วหาย สอดใต้ประตู ใครบางคนในห้องนั้นอยากรู้ว่าใครเข้าวังมาทางไหน และท่านหญิงเอลดริสส่งให้เขารู้ทีละสิบชื่อ
        effects: { stats: { DEX: 1 }, org: { id: crown_court, merit: 1 }, flags: [read_the_colourless_letter] }
      failure:
        text: |
          ครั่งร้อนเกิน ไหลเยิ้มเลอะมุมซอง {name}กดกลับได้ แต่ขอบเป็นคลื่นเหมือนเทียนที่หยดลงพื้น คนในห้องจะรู้ตั้งแต่หยิบขึ้นมา

          เช้ามาดาร์เวลเรียกไปพบ ไม่ได้ถามว่าทำไม เขาหักเบี้ยครึ่งเดือนเป็นค่าซองใหม่ แล้วให้กลับไปจุดตะเกียงที่ชั้นล่างอีกหลายคืน
        effects: { gold: -2, flags: [smeared_the_colourless_wax] }
    - id: hand_it_back_to_darvel
      label: ยื่นซองคืนดาร์เวล บอกว่าจำทางสามเลี้ยวไม่ได้
      refuse: true
      text: |
        ดาร์เวลรับซองไปโดยไม่ว่าอะไร แล้วเดินไปเอง เขาเข่าไม่ดีข้างหนึ่ง ทางสามเลี้ยวนั้นมีบันไดขึ้นอีกสองช่วง {name}ได้ยินเสียงเขาหยุดพักที่ชานบันไดสองครั้ง

        ระเบียงที่เลี้ยวที่สองคืนนั้นไม่มีใครยืนอยู่แล้ว หรือมี แต่ดาร์เวลเดินผ่านไปโดยไม่เห็น
      effects: { flags: [handed_back_the_colourless_letter] }

- id: adult.court_duty_lamp_round
  stage: adult
  weight: 20
  once: false
  time: dusk
  duty: crown_court
  when:
    age: [20, 64]
    org: { id: crown_court, max_rank: 2 }
  text: |
    รอบจุดตะเกียงเริ่มเมื่อระฆังเย็นตีครั้งที่สาม คนจุดถือไม้ยาวสองวา ปลายไม้มีถ้วยทองเหลืองใส่ถ่านแดง ขึ้นจากครัวไปทีละชั้น ครัวก่อน บันไดคนใช้ ระเบียงยาว ห้องรับรอง แล้วจึงถึงห้องชั้นใน ตะเกียงในวังมีสามร้อยกว่าดวง ไม่มีคนจุดสองคนไหนนับได้ตรงกัน

    ทุกดวงมีที่ของมัน ดวงที่หัวบันไดชั้นสองต้องหมุนไส้ไว้ต่ำ เพราะควันขึ้นไปเปื้อนภาพเขียนบนเพดาน ดวงหน้าห้องหนังสือต้องเติมน้ำมันครึ่งเดียว ไม่อย่างนั้นจะหยดลงพรม ระหว่างระเบียงยาวมีดวงหนึ่งที่ไม่มีใครจุด ข้างบนสั่งไว้นานจนไม่มีใครจำได้ว่าใครสั่งและสั่งเพราะอะไร ทุกคืนมันห้อยอยู่ในความมืด แก้วใส น้ำมันเต็ม

    คืนนี้ไม้จุดไฟอยู่ในมือ{name}
  choices:
    - id: light_by_the_order
      label: จุดไปตามลำดับจนครบทุกดวงที่ต้องจุด
      text: |
        รอบนี้กินเวลาจนระฆังยามแรก ถ่านในถ้วยทองเหลืองต้องเติมสองครั้ง ตอน{name}ลงมาถึงครัว โต๊ะข้าวของคนใช้เก็บไปแล้ว เหลือข้าวเย็นชืดหนึ่งชามที่แม่ครัวครอบฝาไว้ให้ บนฝามีไข่ต้มหนึ่งฟอง

        ดวงที่ไม่มีใครจุดยังมืดอยู่กลางระเบียงยาว {name}เดินผ่านไปตามปกติ เหมือนคนจุดทุกคนก่อนหน้า
      effects: { gold: 1, alignment: { law: 1 }, flags: [lit_the_full_lamp_round] }
    - id: light_the_dark_one
      label: เอื้อมไม้ไปจุดดวงที่ไม่มีใครจุดด้วย
      requires: { not_flags: [lit_the_left_dark_lamp] }
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ไส้ติดง่ายเหมือนรอมานาน แสงส่องลงระเบียงยาวตรงช่วงที่มืดมาตลอด ตรงนั้นมีประตูบานเล็กบานหนึ่งที่{name}ไม่เคยเห็น ไม่มีลูกบิด มีแต่รูกุญแจ ระหว่างนั้นประตูอีกบานที่สุดระเบียงแง้มออก คนข้างในดูแสงอยู่ครู่หนึ่ง แล้วปิดประตูเบาๆ

          คืนถัดมาดวงนั้นมืดอีก ไส้ตัดสั้นจนจุดไม่ได้ ไม่มีใครเรียก{name}ไปถาม
        effects: { flags: [lit_the_left_dark_lamp] }
      failure:
        text: |
          ไส้ติดแล้วดับ ติดแล้วดับ ถ่านในถ้วยทองเหลืองหกลงพรมไปก้อนหนึ่ง ไหม้เป็นรูเท่าเหรียญ ท่านหญิงเอลดริสเดินมาถึงพอดี นางดูรูบนพรม ดูดวงที่มืด แล้วดู{name}

          นางหักเบี้ยค่าพรม แล้วบอกว่าดวงนั้นไม่ต้องจุด บอกเหมือนบอกว่าเกลืออยู่ในโถไหน
        effects: { gold: -1, flags: [lit_the_left_dark_lamp] }
    - id: give_the_pole_to_the_kitchen_boy
      label: ส่งไม้จุดไฟให้เด็กครัว แล้วไปนั่งพักที่บันไดคนใช้
      refuse: true
      text: |
        เด็กครัวจุดเร็ว จุดข้ามดวงที่หัวบันไดชั้นสองไปทั้งดวงเพราะไม่รู้ว่ามีอยู่ ข้างบนมีคนเดินตกบันไดขั้นสุดท้าย ข้อเท้าพลิก

        เช้ามาท่านหญิงเอลดริสถามว่าใครถือไม้จุดไฟเมื่อคืน เด็กครัวตอบตามจริง
      effects: { flags: [skipped_the_lamp_round] }

- id: adult.court_duty_night_tray
  stage: adult
  weight: 20
  once: false
  time: night
  duty: crown_court
  when:
    age: [20, 64]
    org: { id: crown_court, max_rank: 2 }
  text: |
    ถาดดึกขึ้นห้องชั้นในตอนยามสอง ข้าวต้มหนึ่งชาม ขิงซอยหนึ่งถ้วยเล็ก ชาหนึ่งกา ถ้วยหนึ่งใบ ถาดเงินหนักกว่าที่ตาเห็น เพราะขอบหนาไว้กันชามเลื่อน ใครถือถาดดึกต้องเดินระเบียงชั้นในตอนที่ทั้งวังหลับ และต้องไม่ปลุกใคร

    ระเบียงชั้นในปูไม้ทั้งแนว ดาร์เวลสอนทุกคนที่ถือถาดดึกเหมือนกันหมด แผ่นที่สามจากประตูลั่น แผ่นที่เก้าลั่นถ้าเหยียบขอบซ้าย ช่วงหน้าห้องหนังสือลั่นทั้งช่วงเว้นแต่เดินชิดผนัง แผ่นเกือบสุดท้ายก่อนเลี้ยวไม่ลั่นเลย แต่มีตะปูโผล่หัวเกี่ยวถุงเท้า เขาบอกว่าพื้นไม้ในวังจำคนได้ แค่ไม่ยอมบอกชื่อ

    คืนนี้ข้าวต้มร้อนกว่าทุกคืน ไอขึ้นจนกาชาเป็นฝ้า
  choices:
    - id: walk_the_quiet_boards
      label: เดินตามแผนที่พื้นของดาร์เวลทีละแผ่น
      text: |
        ข้ามแผ่นที่สาม เหยียบขอบขวาของแผ่นที่เก้า ชิดผนังหน้าห้องหนังสือจนไหล่เปื้อนฝุ่นปูน ถาดถึงประตูห้องชั้นในโดยไม่มีเสียงสักครั้ง ข้าวต้มอุ่นพอดีกิน ไม่ร้อนลวกปากแล้ว

        ขากลับ ถุงเท้าของ{name}เกี่ยวตะปูแผ่นเกือบสุดท้ายเป็นรูเท่าเมล็ดถั่ว เหมือนถุงเท้าของทุกคนที่ถือถาดดึก
      effects: { alignment: { law: 1 }, flags: [walked_the_quiet_boards] }
    - id: take_the_short_way
      label: เดินทางตรงให้เร็ว ข้าวต้มจะได้ถึงตอนยังร้อน
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}เดินกลางระเบียงแต่ลงน้ำหนักที่ปลายเท้า พื้นลั่นเบาๆ สองครั้ง เบาจนเหมือนบ้านขยับตัวตอนกลางคืน ถาดถึงประตูตอนข้าวต้มยังมีไอ คนในห้องรับถาดไปแล้วส่งถ้วยเปล่าของเมื่อวานคืนมา

          ในถ้วยเปล่ามีเหรียญทองแดงหนึ่งเหรียญวางอยู่ที่ก้น ไม่มีใครบอกว่าให้ใคร
        effects: { gold: 1, flags: [took_the_short_way_with_the_tray] }
      failure:
        text: |
          แผ่นที่สามลั่นดังจนกาชากระเด้ง ประตูตลอดแนวระเบียงเปิดออกทีละบาน มีคนโผล่หน้าออกมาดู ชาหกลงถาดเป็นแอ่ง {name}ต้องเดินกลับลงครัวไปชงใหม่

          กว่าถาดจะถึงห้องชั้นในอีกรอบก็ยามสาม ข้าวต้มเย็นชืด ดาร์เวลรู้เรื่องก่อนเช้า เขาให้{name}เดินระเบียงชั้นในไปกลับสิบรอบตอนกลางวัน ถือถาดเปล่า
        effects: { hp: -1, flags: [woke_the_inner_hall] }
    - id: pass_the_tray
      label: ฝากถาดให้ข้ารับใช้อีกคนขึ้นไปแทน
      refuse: true
      text: |
        คนที่รับถาดไปแทนยังไม่เคยเดินระเบียงชั้นในตอนกลางคืน เสียงแผ่นที่สามดังลงมาถึงครัว ตามด้วยแผ่นที่เก้า และช่วงหน้าห้องหนังสือทั้งช่วง

        เขากลับลงมาพร้อมถาดเปล่ากับถุงเท้าขาดหนึ่งข้าง ไม่ได้มองหน้า{name}เลยจนถึงเช้า
      effects: { flags: [passed_the_night_tray] }

# ---------- งานขั้นสูง (ขุนนาง ที่ปรึกษา) ----------
- id: adult.court_duty_one_slot
  stage: adult
  scene: noble_hall
  weight: 20
  duty: crown_court
  when:
    age: [25, 64]
    org: { id: crown_court, min_rank: 3, max_rank: 3 }
  text: |
    โถงล่างมีช่องยื่นเรื่องขึ้นโต๊ะที่ปรึกษาเดือนละช่อง ขุนนางผลัดกันถือ เดือนนี้เป็นของ{name} ตั้งแต่ข่าวรั่วออกไปว่าช่องเดือนนี้เป็นของใคร คำร้องมาวางบนโต๊ะของ{name}ในโถงล่างสิบเจ็ดฉบับ บางฉบับมาพร้อมขวดเหล้า บางฉบับมาพร้อมคนถือที่ยืนรอคำตอบอยู่ที่บันได

    คัดจนเหลือสองฉบับ ฉบับหนึ่งจากนายอำเภอริมแม่น้ำ น้ำท่วมนาทั้งแถบ ขอให้คลังยอมให้เปิดยุ้งหลวงตลอดฝั่งแม่น้ำในหน้านี้ อีกฉบับจากสมาคมพ่อค้าท่าเรือเหาะ ขอให้คลังขึ้นค่าท่าอีกหนึ่งส่วน แลกกับที่สมาคมจะออกเงินซ่อมท่าเอง ฉบับนี้ลายมือสวย กระดาษหนา

    เสมียนของโถงล่างรอรับฉบับเดียวไปวางบนโต๊ะที่ปรึกษาก่อนระฆังเที่ยง
  choices:
    - id: send_the_river_petition
      label: ส่งคำร้องของนายอำเภอริมแม่น้ำ
      text: |
        โต๊ะที่ปรึกษาอ่านคำร้องนั้นตอนบ่าย ตราลงก่อนค่ำ ยุ้งหลวงตลอดฝั่งแม่น้ำเปิดภายในเจ็ดวัน คลังต้องส่งคนไปนับว่าข้าวออกไปเท่าไร แล้วเขียนตัวเลขนั้นลงบรรทัดขาดของปีนั้น

        สมาคมพ่อค้าท่าเรือเหาะไม่ได้ส่งคนมาต่อว่า เดือนต่อมาไม่มีขวดเหล้ามาวางบนโต๊ะของ{name}อีกเลย ท่าเทียบเรือหมายเลขสามพังลงไปครึ่งท่าในหน้าฝนนั้น
      effects: { world: { peace: 1, treasury: -1 }, flags: [sent_the_river_petition] }
    - id: send_the_dock_petition
      label: ส่งคำร้องของสมาคมพ่อค้าท่าเรือเหาะ
      text: |
        ค่าท่าขึ้นหนึ่งส่วนตั้งแต่ต้นเดือนถัดมา คลังได้เงินเข้าห้องทุกวันที่เรือเทียบ ท่าเรือเหาะซ่อมเสร็จก่อนสิ้นฝน หลังคาท่าใหม่ทาสีเทาอ่อน

        คนแบกของที่ท่าโดนลดค่าแรงเท่ากับที่ค่าท่าขึ้น วันที่สามพวกเขานั่งลงบนกองสินค้าทั้งท่า ไม่ยอมลุก ทหารต้องมาลากออกทีละคน ส่วนนายอำเภอริมแม่น้ำส่งคำร้องฉบับเดิมมาอีกรอบ คราวนี้ไม่มีใครถือมา
      effects: { world: { treasury: 1, peace: -1 }, flags: [sent_the_dock_petition] }
    - id: stitch_them_together
      label: เชิญคนของสมาคมมากินข้าว ขอให้เงินซ่อมท่ากลายเป็นข้าวให้ฝั่งแม่น้ำ แล้วส่งขึ้นเป็นฉบับเดียว
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ข้าวมื้อนั้น{name}จ่ายเองทั้งโต๊ะ ปลาไหลย่างกับเหล้าที่สมาคมชอบ กว่าจะตกลงกันได้ก็หมดไปสามขวด สมาคมยอมออกเงินซื้อข้าวส่งฝั่งแม่น้ำหนึ่งหน้า แลกกับชื่อของสมาคมเขียนไว้บนประตูยุ้งทุกหลัง

          คำร้องฉบับเดียวขึ้นโต๊ะตอนบ่าย ตราลงก่อนค่ำ ประตูยุ้งหลวงริมแม่น้ำมีป้ายไม้ตอกใหม่ ตัวหนังสือสีเทา ชาวบ้านยืนอ่านชื่อสมาคมก่อนรับข้าว
        effects: { gold: -3, world: { peace: 1 }, org: { id: crown_court, merit: 1 }, flags: [stitched_two_petitions] }
      failure:
        text: |
          คนของสมาคมกินจนอิ่ม ดื่มจนหมดขวดที่สาม แล้วบอกว่าจะเอาเรื่องไปคุยกันก่อน ระฆังเที่ยงตีไปตั้งแต่กลางมื้อ ช่องเดือนนี้ว่าง ไม่มีฉบับไหนขึ้นโต๊ะ

          ค่าข้าวมื้อนั้นเท่ากับเบี้ยของ{name}หนึ่งเดือน ขุนนางคนที่ได้ช่องเดือนถัดไปส่งคำร้องของตัวเองขึ้น เรื่องรั้วบ้านพี่เมีย
        effects: { gold: -3, flags: [stitched_two_petitions] }
    - id: give_the_slot_away
      label: ยกช่องเดือนนี้ให้ขุนนางคนถัดไป
      refuse: true
      text: |
        ขุนนางคนถัดไปรับช่องไปด้วยรอยยิ้มกว้าง ส่งคำร้องเรื่องรั้วบ้านพี่เมียของเขาขึ้นโต๊ะ โต๊ะที่ปรึกษาอ่านจบภายในอึดใจเดียว ตราลงให้

        คำร้องสิบเจ็ดฉบับยังกองอยู่บนโต๊ะของ{name} ขวดเหล้ามีคนมาขอคืนสองขวด
      effects: { flags: [gave_away_the_petition_slot] }

- id: adult.court_duty_screen_voices
  stage: adult
  scene: noble_hall
  weight: 20
  duty: crown_court
  when:
    age: [25, 64]
    org: { id: crown_court, min_rank: 3, max_rank: 3 }
  text: |
    ระเบียงหลังโถงล่างมีฉากไม้ฉลุตั้งกั้นไว้สามบาน ข้างหลังฉากเป็นที่ที่คนมานั่งรอเรียก แสงลอดลายฉลุลงพื้นเป็นจุดๆ คนที่เดินผ่านด้านนี้มองไม่เห็นคนด้านโน้น แต่ได้ยินทุกคำ

    บ่ายนี้{name}เดินผ่านมาเพื่อเลี่ยงคนยื่นเรื่องที่ยืนรออยู่ที่บันไดหน้า แล้วได้ยินเสียงสองเสียงหลังฉาก เสียงหนึ่งพูดเบาแบบคนนับเงินเป็น อีกเสียงพูดเร็วแบบคนกลัวจะไม่ทัน ตำแหน่งนายอำเภอของอำเภอหนึ่งทางตะวันตก ราคาสามสิบเหรียญทอง เงินเข้าคลัง ใบตั้งออกจากห้องเสมียนเหมือนใบตั้งทุกใบ

    เสียงที่พูดเร็วนับเหรียญลงโต๊ะทีละเหรียญ ได้ยินถึงเหรียญที่สิบสอง
  choices:
    - id: raise_it_in_the_lower_hall
      label: ยกเรื่องนี้ขึ้นพูดในโถงล่างพรุ่งนี้เช้า
      text: |
        {name}เล่าทุกคำที่ได้ยิน ไม่บอกว่าเสียงเป็นของใคร โถงล่างเงียบจนได้ยินนกพิราบบนขื่อ ใบตั้งนายอำเภอใบนั้นไม่ได้ออก เงินสามสิบเหรียญทองไม่ได้เข้าคลัง สองวันต่อมาเสมียนห้องคลังคนหนึ่งย้ายไปนับกระสอบที่ยุ้งนอกเมือง

        อำเภอทางตะวันตกได้นายอำเภอที่คลังส่งไปตามลำดับ ชายแก่ที่นั่งรอตำแหน่งมาตั้งแต่ยังผมดำ เขาเขียนจดหมายขอบคุณมาถึงโถงล่าง ไม่รู้ว่าต้องขอบคุณใคร
      effects: { world: { throne: 1, treasury: -1 }, flags: [raised_the_sold_office] }
    - id: sell_your_silence
      label: รอให้เสียงที่พูดเบาเดินออกมา แล้วบอกเขาว่าได้ยินอะไร
      text: |
        เขาไม่ตกใจ เขาถามว่า{name}อยากได้อะไร พูดเบาเท่าเดิม {name}ได้ถุงหนังเล็กๆ มาหนึ่งถุงก่อนตะวันตก ใบตั้งนายอำเภอออกตามกำหนด เงินเข้าคลังครบ

        อีกหนึ่งปีนับเตาต่อมา มีคำร้องจากอำเภอทางตะวันตกมาถึงโถงล่าง เขียนด้วยลายมือของชาวบ้าน ถามว่านายอำเภอคนใหม่ไม่เคยเห็นสมุดเตาเลยหรือ เพราะเขาเอาสมุดไปรองขาโต๊ะ
      effects: { gold: 4, world: { treasury: 1, throne: -1 }, alignment: { moral: -1 }, flags: [sold_silence_behind_the_screen] }
    - id: outbid_for_a_clerk
      label: เอาเงินตัวเองเข้าคลังเท่ากัน ขอตำแหน่งนั้นให้เสมียนใหญ่ที่ทำงานมาทั้งชีวิตในอำเภอนั้น
      requires: { min_gold: 6 }
      text: |
        คนที่พูดเบาฟังข้อเสนอแล้วหัวเราะในคอ บอกว่าเงินก็คือเงิน แต่ขอให้เพิ่มอีกนิดเป็นค่าความลำบากที่ต้องไปบอกเสียงที่พูดเร็ว {name}จ่ายเพิ่ม ถุงเงินของ{name}เบาลงเกือบหมด

        ใบตั้งออกในชื่อของหญิงชราที่นับเตาของอำเภอนั้นมาก่อนใครในศาลาจะเกิด นางเขียนจดหมายมาถึงโถงล่างหนึ่งบรรทัด ถามว่าใครเป็นคนผิดพลาด
      effects: { gold: -6, world: { treasury: 1 }, org: { id: crown_court, merit: 1 }, flags: [bought_the_office_for_a_clerk] }
    - id: walk_on_past_the_screen
      label: เดินต่อไป ทำเป็นไม่ได้ยินเหมือนคนอื่นที่เดินผ่านทางนี้
      refuse: true
      text: |
        เสียงนับเหรียญตามหลังมาจนถึงปลายระเบียง ถึงเหรียญที่ยี่สิบสาม แล้วประตูโถงล่างก็ปิดเสียงทั้งหมดไว้ข้างหลัง

        ใบตั้งนายอำเภอออกตามกำหนด {name}เห็นชื่อในบัญชีใบตั้งประจำเดือน เป็นชื่อที่ไม่เคยได้ยิน
      effects: { flags: [walked_past_the_screen_voices] }

- id: adult.court_duty_stair_petitioners
  stage: adult
  scene: noble_hall
  weight: 20
  once: false
  duty: crown_court
  when:
    age: [25, 64]
    org: { id: crown_court, min_rank: 3 }
  text: |
    วันที่โถงล่างเปิดรับเรื่อง คนที่จะยื่นเรื่องผ่าน{name}มายืนรอที่บันไดประตูข้างตั้งแต่เช้ามืด มือหนึ่งถือกระดาษพับ อีกมือถือของฝาก ไก่ย่างห่อใบตอง ผ้าไหมหนึ่งพับ โถน้ำผึ้ง ขวดน้ำมันใส่ผม บางคนถือแค่กระดาษ บางคนถือแค่ของฝาก

    ธรรมเนียมของวังไม่ได้ห้ามรับของ ไม่ได้บอกให้รับ คนที่อยู่วังมานานจำได้ว่าคนถือไก่ย่างมักมาเรื่องที่ดิน คนถือผ้าไหมมักมาเรื่องลูกชาย คนที่ถือกระดาษอย่างเดียวมักเดินมาไกลที่สุด และยืนรอนานที่สุด

    เช้านี้แถวยาวถึงประตูรั้ว ท้ายแถวมีหญิงคนหนึ่งถือกระดาษแผ่นเดียว รองเท้าขาดทั้งคู่
  choices:
    - id: take_papers_and_gifts
      label: รับทั้งกระดาษและของฝาก ตามลำดับที่ยืน
      text: |
        กว่าจะถึงท้ายแถวตะวันก็เลยหัว ของฝากกองเต็มโต๊ะข้างบันได คนรับใช้ต้องขนเข้าห้องสองเที่ยว กระดาษสิบสี่แผ่นขึ้นไปพร้อม{name} ส่วนไก่ย่างกับน้ำผึ้งไปจบที่โต๊ะข้าวของคนรับใช้ตอนเย็น

        หญิงท้ายแถวยื่นกระดาษแผ่นเดียวของนาง แล้วยืนรออยู่ครู่หนึ่งเหมือนนึกว่าต้องยื่นอะไรอีก ก่อนจะเดินกลับลงบันไดไป
      effects: { gold: 2, alignment: { law: 1 }, flags: [took_the_stair_gifts] }
    - id: take_only_papers
      label: รับแต่กระดาษ ให้คนถือของฝากเอาของกลับไป
      text: |
        คนถือไก่ย่างยืนงงอยู่นาน แล้วเอาไก่ไปยัดใส่มือคนรับใช้ที่ยืนข้างบันไดแทน คนถือผ้าไหมเดินกลับไปพร้อมกระดาษของตัวเองด้วย บอกว่าจะไปหาขุนนางคนที่รับ เรื่องของเขาจะได้ไม่หาย

        หญิงท้ายแถวได้ยื่นกระดาษเป็นคนที่สาม ไม่ต้องรอถึงเที่ยง
      effects: { alignment: { moral: 1 }, reputation: { crown: 1 }, flags: [refused_the_stair_gifts] }
    - id: go_round_by_the_back_stair
      label: ขึ้นบันไดหลังไปโถงล่าง ปล่อยให้เสมียนรับแทน
      refuse: true
      text: |
        เสมียนรับกระดาษแทน รับของฝากแทน และจดว่าใครให้อะไรลงสมุดอีกเล่ม คนที่ยืนรอผ่าน{name}ได้รับแจ้งว่าเรื่องจะขึ้นไปตามลำดับ

        หญิงท้ายแถวไม่มีของฝาก กระดาษแผ่นเดียวของนางไปอยู่ล่างสุดของกอง
      effects: { flags: [took_the_back_stair] }

# ---------- โต๊ะเจ็ดเก้าอี้ (ที่ปรึกษา ยุคสองตรา) ----------
- id: adult.court_duty_seven_chairs
  stage: adult
  scene: noble_hall
  weight: 20
  duty: crown_court
  when:
    age: [25, 64]
    year: [318, 410]
    org: { id: crown_court, min_rank: 4 }
  text: |
    โต๊ะที่ปรึกษามีเจ็ดเก้าอี้แต่มีปากกาด้ามเดียว ปากกาเวียนกันถือเดือนละคน คนถือเป็นคนเขียนคำของโต๊ะลงกระดาษ อีกหกคนลงชื่อตามหรือลุกออกจากห้อง ตั้งแต่บัลลังก์ว่าง ไม่มีเดือนไหนที่คนถือปากกาเขียนเรื่องมงกุฎ

    เดือนนี้ปากกาอยู่กับ{name} เช้านี้อิลเซน เสมียนของทางเสมียน เดินข้ามระเบียงมาเองพร้อมกระดาษสองแผ่น แผ่นหนึ่งตราขาว แผ่นหนึ่งตราเทา เนื้อความเหมือนกันทุกคำ ขอให้โต๊ะที่ปรึกษาเขียนว่าใครควรสวมมงกุฎ ก่อนเดือนเต็มดวง นางบอกว่าโต๊ะกลางทางเสมียนมีกระดาษตราเดียวรออยู่สี่ร้อยกว่าแผ่น แผ่นที่เก่าที่สุดรอมาตั้งแต่ยังไว้ทุกข์

    มงกุฎยังวางอยู่บนเก้าอี้ว่างในโถงใหญ่ มีคนเช็ดฝุ่นให้ทุกเช้า ตะเกียงของผู้กล้ายังแขวนอยู่ในโบสถ์น้อย ไม่ว่าใครจะได้ชื่อลงกระดาษ คนนั้นต้องถือมันเดินจากโบสถ์น้อยไปถึงเก้าอี้ ตะเกียงต้องติดอยู่ในมือตลอดทาง
  choices:
    - id: write_the_prince
      label: เขียนชื่อเจ้าชายฮาลเวริน
      text: |
        ที่ปรึกษาสี่คนลงชื่อตาม สองคนลุกออกจากห้อง กระดาษได้ตราขาวในบ่ายวันเดียว ตราเทาลงหลังจากนั้นเจ็ดวัน ช้ากว่าที่ทุกคนเดา วันราชาภิเษก ตะเกียงติดในมือเจ้าชายตั้งแต่ประตูโบสถ์น้อย คนที่รู้ว่าทำไมมันติดยืนอยู่ในโถงนั้นไม่ถึงห้าคน

        ผ้าเทาหายไปจากแขนคนในเวนทราสภายในเดือนนั้น ธนาคารเบเลคส่งหนังสือมาถึงคลังฉบับหนึ่ง ขอให้จ่ายงวดที่ค้างทุกงวด ภายในฤดูเดียว
      effects: { world: { throne: 2, treasury: -2 }, flags: [throne_white] }
    - id: write_the_princess
      label: เขียนชื่อเจ้าหญิงเซลีมาร์
      text: |
        ที่ปรึกษาสามคนลงชื่อตาม สามคนลุกออกจากห้อง กระดาษได้ตราเทาในบ่ายวันเดียว ตราขาวลงหลังจากนั้นสิบสองวัน ในวันที่หน้าวิหารเวรัสมีคนมายืนกันจนล้นถนน วันราชาภิเษก ตะเกียงติดในมือเจ้าหญิงตั้งแต่ประตูโบสถ์น้อย คนที่รู้ว่าทำไมมันติดยืนอยู่ในโถงนั้นไม่ถึงห้าคน

        นักบวชตะเกียงเทศน์ทุกเช้าว่าเลือดผู้กล้าไหลผ่านลูกชายก่อนลูกสาว กองที่เคยคาดผ้าขาวยืนแถวช้าลงทุกเช้า เบี้ยของกองมาตรงวันเป็นปีแรก แต่ไม่มีใครในค่ายพูดถึง
      effects: { world: { throne: 2, peace: -2 }, flags: [throne_grey] }
    - id: write_the_chair_stays_empty
      label: เขียนว่าโต๊ะที่ปรึกษาเห็นให้เก้าอี้ว่างต่อไป
      refuse: true
      text: |
        ที่ปรึกษาทั้งหกลงชื่อตาม ไม่มีใครลุก อิลเซนรับกระดาษไป เดินข้ามทางเสมียนกลับไปวางบนโต๊ะกลาง แผ่นนี้ไม่ต้องรอตราที่สอง เพราะไม่มีใครขอให้ทำอะไร

        มงกุฎยังวางบนเก้าอี้ว่าง คนเช็ดฝุ่นมาทุกเช้าเหมือนเดิม เดือนต่อมาปากกาไปอยู่กับที่ปรึกษาคนถัดไป เขาเขียนเรื่องค่าซ่อมหลังคาโบสถ์น้อย
      effects: { flags: [throne_kept_empty] }
    - id: carry_the_lamp_and_name_yourself
      label: วางปากกา ไปขอกุญแจตู้ตะเกียงจากบาทหลวง ถือตะเกียงเข้าโถงใหญ่เอง แล้วบอกว่าเลือดของใครทำให้มันติด
      requires: { trait: hero_blood }
      text: |
        ตะเกียงติดตั้งแต่มือของ{name}แตะหูจับ ในโบสถ์น้อยไม่มีใครเห็นนอกจากบาทหลวง แต่จากประตูโบสถ์น้อยถึงโถงใหญ่มีระเบียงยาว ทั้งสองปีกเห็น {name}เดินไปจนถึงหน้าเก้าอี้ว่าง ไม่ได้นั่ง ไม่ได้แตะมงกุฎ บอกคนในโถงว่าตะเกียงติดเพราะเลือดของ{name}เอง ไม่ใช่เลือดของใครบนเนิน แล้ววางตะเกียงลงบนพื้นหน้าเก้าอี้ เปลวยังไม่ดับ

        ก่อนค่ำทั้งเวนทราสรู้ คนกลุ่มหนึ่งไปยืนหน้าวิหารเวรัส อีกกลุ่มไปยืนหน้าธนาคาร ทั้งสองกลุ่มถามคำถามเดียวกัน มงกุฎยังอยู่บนเก้าอี้ว่าง ไม่มีใครกล้ายกขึ้น
      effects: { world: { throne: -3 }, flags: [named_own_blood_in_the_hall, throne_kept_empty] }
    - id: carry_the_lamp_and_say_nothing_of_blood
      label: ถือตะเกียงที่ติดในมือตัวเองเข้าโถงใหญ่ วางไว้ข้างมงกุฎ บอกแค่ว่ามันติดเองในโบสถ์น้อย
      requires: { trait: hero_blood }
      text: |
        {name}ถือตะเกียงที่ติดแล้วเดินผ่านระเบียงยาว ทั้งสองปีกเห็นเปลว ไม่มีใครเห็นว่าใต้ฐานไม่ได้เปิด {name}วางมันข้างมงกุฎบนเก้าอี้ว่าง บอกคนในโถงว่าตะเกียงติดขึ้นเองในโบสถ์น้อยเมื่อเช้า ไม่ได้บอกว่าในมือใคร บาทหลวงยืนอยู่ข้างหลัง ไม่แก้สักคำ

        เปลวนั้นอยู่บนเก้าอี้ว่างไปจนเที่ยงคืนแล้วดับเอง คนในเวนทราสเล่ากันว่าตะเกียงของผู้กล้าเลือกบัลลังก์แล้ว แค่ยังไม่เลือกคน สองปีกลงตราให้กระดาษตราเดียวบนโต๊ะกลางทางเสมียนไปครึ่งกองในเดือนนั้น
      effects: { world: { throne: 3 }, flags: [set_the_lit_lamp_by_the_crown, throne_kept_empty] }

# ---------- เลื่อนขั้น ----------
- id: adult.court_rise_inner_door
  stage: adult
  weight: 60
  must: true
  once: true
  time: night
  mark: ขึ้นเป็นมหาดเล็ก
  when:
    age: [19, 80]
    org: { id: crown_court, min_rank: 1, max_rank: 1, ready: true }
  text: |
    ประตูชั้นในเป็นบานไม้สีเข้ม ไม่มีกลอนด้านนอก ข้ารับใช้ทุกคนเดินผ่านหน้าบานนั้นวันละหลายรอบ ไม่มีใครเคยผลัก คืนนี้ท่านหญิงเอลดริสยืนรออยู่หน้าบาน ถือตะเกียงมือ สมุดเล่มเล็กของนางเปิดค้างไว้ที่หน้าที่มีชื่อ{name}

    นางอ่านบรรทัดแรกในหน้านั้นออกเสียงให้ฟัง บรรทัดที่นางจดไว้วันที่{name}เข้าวัง ลายมือของนางเอง หมึกซีดลงแล้ว แล้วนางก็ปิดสมุด ผลักบานประตูให้เปิด บอกว่าตั้งแต่คืนนี้{name}เป็นมหาดเล็ก ห้องข้างในเข้าได้ จดหมายในห้องพวกนี้ถือได้ และจะมีคนมาขอซื้อทุกอย่างที่{name}รู้

    ดาร์เวลยืนรออยู่อีกฟากประตู ไม่ใส่รองเท้า ถือรองเท้าไว้ในมือ
  choices:
    - id: walk_in_his_steps
      label: ถอดรองเท้า เดินเหยียบรอยเท้าของดาร์เวลทีละก้าว
      text: |
        ดาร์เวลเดินช้า เท้าเปล่าแตะพื้นทีละแผ่นเหมือนคนทดสอบน้ำแข็ง {name}เหยียบตามไปจนสุดระเบียงชั้นใน ไม่มีแผ่นไหนลั่นสักแผ่น ตอนเลี้ยวกลับ เขาชี้ประตูทีละบาน บอกว่าบานไหนเปิดตอนกี่ทุ่ม และบานไหนไม่เคยเปิดเลย

        คืนนั้น{name}นอนไม่หลับ นับแผ่นพื้นในใจจนสาง
      effects: { org: { id: crown_court, promote: true }, flags: [learned_the_quiet_boards] }
    - id: count_the_boards
      label: นับแผ่นพื้นทั้งระเบียงแล้วจดไว้ในหัว
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ระเบียงชั้นในมีแผ่นพื้นสองร้อยสิบสามแผ่น ลั่นสิบเก้าแผ่น {name}จำได้ทุกแผ่นก่อนเดินถึงปลายทาง ดาร์เวลให้เดินกลับคนเดียวในความมืด แล้วฟัง ไม่มีเสียงสักแผ่น

          เขาบอกว่าคนที่จำได้ในคืนแรกมีน้อย คนที่จำได้แล้วไม่ลืมมีน้อยกว่านั้น แล้วยื่นรองเท้าคืนให้
        effects: { org: { id: crown_court, promote: true }, stats: { INT: 1 }, flags: [counted_the_inner_boards] }
      failure:
        text: |
          นับถึงแผ่นที่ร้อยกว่าแล้วหลง ก้าวต่อไปลงแผ่นที่ดังที่สุดของระเบียง เสียงไม้ดังไปถึงชั้นบน มีประตูบานหนึ่งเปิดแล้วปิด ดาร์เวลหยุดยืน รอจนทุกอย่างเงียบสนิทแล้วจึงเดินต่อ

          ทั้งเดือนนั้นดาร์เวลให้{name}เดินระเบียงชั้นในเท้าเปล่าตอนตีสามทุกคืน จนเลิกต้องนับ
        effects: { org: { id: crown_court, promote: true }, flags: [counted_the_inner_boards] }
    - id: ask_whose_letter
      label: ถามท่านหญิงเอลดริสว่าในสมุดหน้านั้นเขียนอะไรไว้อีก
      text: |
        ท่านหญิงเอลดริสบอกว่าหน้าหนึ่งมีที่ให้เขียนแค่สองบรรทัด บรรทัดแรกคือมาด้วยจดหมายของใคร บรรทัดที่สองคือไปเพราะอะไร บรรทัดที่สองของ{name}ยังว่าง

        นางไม่ได้บอกว่าหน้าที่บรรทัดที่สองเต็มแล้วมีกี่หน้า สมุดเล่มเล็กแต่หนา สันเย็บใหม่มาแล้วอย่างน้อยสองครั้ง
      effects: { org: { id: crown_court, promote: true }, flags: [asked_eldris_about_the_second_line] }

- id: adult.court_rise_lower_hall_seat
  stage: adult
  scene: noble_hall
  weight: 60
  must: true
  once: true
  mark: ขึ้นเป็นขุนนาง
  when:
    age: [19, 80]
    org: { id: crown_court, min_rank: 2, max_rank: 2, ready: true }
  text: |
    บรรดาศักดิ์มาในกระดาษแผ่นเดียว หนากว่ากระดาษทั่วไปสองเท่า ขอบปิดทองที่ลอกไปแล้วมุมหนึ่ง ชื่อบรรดาศักดิ์ยาวจนต้องเขียนสองบรรทัด ที่นั่งในโถงล่างมาพร้อมกัน เป็นเบาะตัวที่สามจากเสาแถวซ้าย

    ขุนนางคนก่อนที่นั่งเบาะนี้หลับไปในโถงระหว่างฟังเรื่องที่สิบเอ็ดของวัน แล้วไม่ตื่นอีก คนข้างๆ รู้ตอนระฆังเลิกโถง เบาะยังบุ๋มเป็นรูปเขา ผ้าคลุมเบาะมีรอยไหม้เล็กๆ จากขี้ยาสูบที่เขาเคาะทิ้งทุกครั้งที่มีคนพูดยาว

    เสมียนของโถงล่างวางกล่องไม้ใบหนึ่งไว้ข้างเบาะ ข้างในเป็นคำร้องที่ขุนนางคนก่อนรับไว้แต่ยังไม่ได้ยื่น ยี่สิบสองฉบับ
  choices:
    - id: sit_into_the_dent
      label: นั่งลงบนเบาะที่ยังบุ๋มเป็นรูปคนอื่น
      text: |
        เบาะบุ๋มลึกจนต้องนั่งเอียง ขุนนางเบาะข้างๆ หัวเราะ บอกว่าอีกหนึ่งฤดูเบาะจะกลายเป็นรูปของ{name}เอง แล้วไม่มีใครจำได้ว่าเคยเป็นรูปของใคร

        เรื่องที่สิบเอ็ดของวันนั้นยาวกว่าทุกเรื่อง {name}นั่งฟังจนจบ ไม่ได้หลับ
      effects: { org: { id: crown_court, promote: true }, flags: [sat_in_the_old_dent] }
    - id: read_the_dead_mans_box
      label: เปิดกล่องคำร้องยี่สิบสองฉบับอ่านทีละฉบับตั้งแต่คืนแรก
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ฉบับเก่าที่สุดรอมานานจนคนยื่นเปลี่ยนที่อยู่ไปแล้วสองครั้ง {name}แยกเป็นสามกอง ยังทำได้ ทำไม่ได้แล้ว และไม่ควรมีใครทำ กองแรกมีเจ็ดฉบับ ขึ้นโต๊ะไปทีละเดือนตามช่องของ{name}

          จดหมายขอบคุณฉบับแรกที่{name}ได้รับในวังมาจากหญิงม่ายคนหนึ่งที่ยื่นเรื่องผ่านขุนนางคนก่อน นางเขียนขอบคุณเขา
        effects: { org: { id: crown_court, promote: true }, stats: { INT: 1 }, flags: [read_the_dead_mans_petitions] }
      failure:
        text: |
          อ่านไปได้เก้าฉบับก็สับสนว่าฉบับไหนเรื่องอะไร คนยื่นสองคนชื่อเหมือนกัน เรื่องที่ดินแปลงเดียวกัน แต่ขอคนละอย่าง {name}ยื่นฉบับที่ผิดขึ้นโต๊ะในเดือนแรก

          ขุนนางเบาะข้างๆ บอกว่าเขาก็เคยทำแบบนี้ตอนนั่งใหม่ๆ และคนที่ได้ที่ดินไปก็ยังไม่เคยมาขอบคุณใคร
        effects: { org: { id: crown_court, promote: true }, flags: [read_the_dead_mans_petitions] }
    - id: read_the_title_aloud
      label: อ่านบรรดาศักดิ์สองบรรทัดออกเสียงให้คนในโถงล่างได้ยิน
      text: |
        ชื่อบรรดาศักดิ์ยาวจนต้องหยุดหายใจกลางบรรทัดแรก ขุนนางในโถงฟังจนจบ แล้วคนหนึ่งตะโกนถามว่าย่อว่าอะไร โถงหัวเราะทั้งโถง {name}บอกชื่อเล่นที่ใช้ในครัวตอนถือถาด

        ตั้งแต่นั้นในโถงล่างไม่มีใครเรียก{name}ตามบรรดาศักดิ์สองบรรทัดอีกเลย ยกเว้นเสมียน ที่ต้องเขียนเต็มทุกครั้งในบันทึก
      effects: { org: { id: crown_court, promote: true }, stats: { CHA: 1 }, flags: [read_the_long_title_aloud] }

- id: adult.court_rise_seventh_chair
  stage: adult
  scene: noble_hall
  weight: 60
  must: true
  once: true
  mark: ขึ้นเป็นที่ปรึกษา
  when:
    age: [19, 80]
    org: { id: crown_court, min_rank: 3, max_rank: 3, ready: true }
  text: |
    โต๊ะที่ปรึกษาเป็นไม้ตัวเดียวทั้งแผ่น ไม่มีรอยต่อ เจ็ดเก้าอี้ไม่เหมือนกันสักตัว แต่ละตัวมากับคนที่นั่งคนแรกเมื่อนานมาแล้ว และไม่มีใครเปลี่ยน เก้าอี้ที่ว่างเป็นของที่ปรึกษาชราคนหนึ่งที่ตาฝ้าลงทีละน้อยจนอ่านกระดาษไม่ได้ เขาขอลุกเอง ก่อนลุกเขาทิ้งแว่นขยายไว้บนโต๊ะอันหนึ่ง

    ที่ปรึกษาคือคนที่ได้พูดก่อนตราจะลงบนกระดาษ ไม่มีใครบังคับให้พูด ที่ปรึกษาบางคนไม่ได้พูดเลยตลอดชีวิตที่นั่งเก้าอี้ บางคนพูดครั้งเดียวแล้วคนจำไปจนตาย ปากกาของโต๊ะเวียนกันถือเดือนละคน ยังไม่ถึงเวรของ{name}

    เช้าแรก กระดาษแผ่นแรกที่ผ่านโต๊ะเป็นเรื่องค่าข้าวของทหารยามประตูเมือง ทุกคนอ่านแล้วส่งต่อ ตรารออยู่ปลายโต๊ะ
  choices:
    - id: speak_on_the_first_paper
      label: ขอพูดก่อนตราจะลงบนแผ่นแรก
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ชี้ว่าค่าข้าวในกระดาษคิดจากจำนวนยามของเมื่อหลายปีก่อน ยามประตูเมืองตอนนี้มีมากกว่านั้นครึ่งหนึ่ง แต่ละคนกินข้าวเท่าเดิม ที่ปรึกษาหกคนอ่านกระดาษใหม่อีกรอบ แล้วส่งกลับไปให้คลังคิดใหม่

          เดือนต่อมา ยามประตูเมืองคนหนึ่งทักชื่อ{name}ได้ตอนเดินผ่าน เขาไม่รู้ว่าทำไมข้าวมื้อเที่ยงของยามถึงเต็มชาม แต่มีคนในค่ายเล่าต่อกันมาว่าใครเป็นคนพูด
        effects: { org: { id: crown_court, promote: true }, stats: { CHA: 1 }, flags: [spoke_on_the_first_paper] }
      failure:
        text: |
          {name}พูดถึงค่าข้าวของยามได้สามประโยค ที่ปรึกษาคนที่นั่งตรงข้ามถามกลับเรื่องตัวเลขที่{name}ไม่ได้เตรียม ห้องเงียบอยู่ครู่หนึ่ง แล้วกระดาษก็ไหลต่อไปถึงปลายโต๊ะ ตราลง

          ตกบ่าย ที่ปรึกษาคนเดียวกันส่งตัวเลขที่ใช่มาให้บนกระดาษแผ่นเล็ก ไม่มีคำอื่นนอกจากตัวเลข
        effects: { org: { id: crown_court, promote: true }, flags: [spoke_on_the_first_paper] }
    - id: keep_quiet_a_season
      label: ฟังโต๊ะไปหนึ่งฤดูก่อนพูดอะไร
      text: |
        กระดาษผ่านโต๊ะวันละสิบกว่าแผ่น {name}อ่านทุกแผ่น จำว่าใครพูดเรื่องอะไร พูดยาวแค่ไหน และพูดหลังใคร ที่ปรึกษาคนหนึ่งพูดทุกเรื่องที่มีคำว่าถ่าน อีกคนพูดแค่เรื่องที่มีคำว่าแม่น้ำ คนที่นั่งข้าง{name}ไม่พูดเลย แต่ทุกครั้งที่เขากระแอม ตราจะช้าลงหนึ่งอึดใจ

        ปลายฤดู{name}พูดเป็นครั้งแรก สั้นกว่าทุกคนในโต๊ะ ตรารอ
      effects: { org: { id: crown_court, promote: true }, stats: { WIS: 1 }, flags: [listened_a_season_at_the_table] }
    - id: keep_the_magnifier
      label: เก็บแว่นขยายของที่ปรึกษาคนก่อนไว้ข้างมือ
      text: |
        แว่นขยายขอบเขาสัตว์ เลนส์มีรอยขีดตรงกลางเส้นหนึ่ง ใครส่องผ่านจะเห็นตัวหนังสือมีเส้นพาดเสมอ {name}ใช้มันอ่านตัวเลขเล็กท้ายกระดาษ ตัวเลขที่ที่ปรึกษาคนอื่นอ่านข้าม

        ที่ปรึกษาคนหนึ่งบอกว่าคนก่อนก็อ่านแบบนี้ และเพราะอ่านแบบนี้ ตาถึงฝ้าเร็ว
      effects: { org: { id: crown_court, promote: true }, flags: [kept_the_old_magnifier] }

# ---------- คืนถือหน้ากระดาษ (ทุกแปดปีที่อยู่ในวัง) ----------
- id: adult.court_page_night
  stage: adult
  scene: noble_hall
  must: true
  once: false
  time: night
  when:
    age: [19, 75]
    org: { id: crown_court, max_rank: 3, min_years: 8 }
  text: |
    สมุดเล่มเล็กของท่านหญิงเอลดริสมีธรรมเนียมอยู่ข้อหนึ่งที่ไม่มีใครสอนคนมาใหม่ หน้าไหนอยู่ในเล่มมาครบแปดปี นางเลาะหน้านั้นออกมาให้เจ้าของถือไว้หนึ่งคืน เช้ามาใครเอามาคืน นางเย็บกลับเข้าเล่ม ใครไม่คืน หน้านั้นไม่มีที่ในเล่มอีก

    คืนนี้เป็นคืนของ{name} กระดาษแผ่นเล็กกว่าฝ่ามือ บรรทัดแรกหมึกซีด บรรทัดที่สองยังว่าง นางยื่นให้ที่หน้าประตูห้องของนาง แล้วปิดประตูโดยไม่สั่งอะไร

    ยังไม่ทันถึงหัวบันได คนยกน้ำร้อนของครัวเดินสวนมา เขาไม่มองกระดาษ แต่พูดเบาๆ ตอนเดินผ่านว่า คืนแบบนี้จะมีคนมาเคาะประตูห้อง{name}อย่างน้อยสองคน คนในวังอยากรู้ว่าใครเป็นคนของใครมากกว่าอยากรู้ว่าในซองเขียนอะไร
  choices:
    - id: keep_the_page_under_the_shirt
      label: สอดกระดาษไว้ในอกเสื้อ ไม่เปิดประตูให้ใครจนระฆังเช้า
      text: |
        คนแรกมาเคาะตอนสองยาม เคาะสามครั้งแล้วรอ คนที่สองมาตอนตีสาม ไม่เคาะ สอดเหรียญลอดใต้ประตูเข้ามาทีละเหรียญจนครบห้า แล้วรอ {name}ดันเหรียญกลับออกไปทีละเหรียญด้วยปลายเท้า

        ระฆังเช้า ท่านหญิงเอลดริสรับกระดาษไปส่องกับหน้าต่าง รอยพับมีรอยเดียว นางเย็บหน้านั้นกลับเข้าเล่มด้วยด้ายเส้นใหม่ ฝีเข็มถี่กว่าหน้าอื่น
      effects: { org: { id: crown_court, merit: 1, term: true }, flags: [held_the_page_one_night] }
    - id: hold_the_thread_for_her
      label: เคาะประตูห้องนางอีกรอบ ขอนั่งถือด้ายให้ตอนนางเย็บหน้าอื่น
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          นางมองกระดาษในมือ{name} มองหน้า{name} แล้วเปิดประตูกว้างขึ้นหนึ่งคืบ คืนนั้นมีหน้าที่ต้องเย็บสิบเอ็ดหน้า {name}ถือไจด้ายจนนิ้วชา แปดหน้าแรกนางไม่พูดสักคำ หน้าที่เก้านางบอกชื่อคนที่ควรระวังหนึ่งชื่อ หน้าที่สิบอีกหนึ่งชื่อ หน้าของ{name}นางเย็บเป็นหน้าสุดท้าย

          รุ่งเช้า{name}ยืนเวรข้างประตูทั้งที่ตาแทบปิด คนที่เดินผ่านมองมือของ{name}ที่ยังมีรอยด้ายบาดเป็นเส้นแดง แล้วเดินอ้อมให้ห่างขึ้นอีกครึ่งก้าว
        effects: { org: { id: crown_court, merit: 2, term: true }, stats: { WIS: 1 }, flags: [held_the_page_one_night, held_the_thread_for_eldris] }
      failure:
        text: |
          นางเปิดประตูแค่พอให้เห็นตาข้างเดียว บอกว่าคืนนี้เป็นคืนที่ต้องอยู่กับกระดาษคนเดียว แล้วปิด {name}ยืนอยู่หน้าประตูนานพอที่คนยกน้ำร้อนจะเดินผ่านมาเห็นอีกรอบ

          เช้ามานางรับกระดาษคืน เย็บกลับเข้าเล่มตามปกติ ไม่ได้เอ่ยถึงเรื่องเมื่อคืน ทั้งวันนั้นไม่มีงานจากห้องชั้นในมาถึงมือ{name}สักชิ้น
        effects: { org: { id: crown_court, term: true }, flags: [held_the_page_one_night] }
    - id: sell_a_look_at_the_first_line
      label: เปิดประตูให้คนที่สอดเหรียญลอดเข้ามา ให้อ่านบรรทัดแรกหนึ่งรอบ
      text: |
        ห้าเหรียญสำหรับเวลาเท่ากับอ่านหนึ่งบรรทัด คนที่ยืนอยู่หน้าประตูคลุมหัวด้วยผ้าของครัว อ่านจบ พยักหน้าครั้งเดียว แล้วหายไปทางบันไดคนใช้ ไม่ได้บอกว่าจะเอาไปเล่าให้ใครฟัง

        ระฆังเช้า ท่านหญิงเอลดริสรับกระดาษไปยกขึ้นดม กระดาษที่อยู่ในอกเสื้อทั้งคืนไม่มีกลิ่นน้ำมันตะเกียงของคนอื่น นางเย็บหน้านั้นกลับเข้าเล่ม ก่อนปิดสมุด นางแตะหมึกเป็นจุดเล็กจุดหนึ่งที่มุมหน้า {name}ไม่เคยได้รู้ว่าจุดนั้นแปลว่าอะไร
      effects: { org: { id: crown_court, term: true }, gold: 5, alignment: { law: -1 }, flags: [held_the_page_one_night, sold_a_look_at_the_first_line] }
    - id: ask_for_the_second_line
      label: คืนกระดาษตอนระฆังเช้า แล้วขอให้นางเขียนบรรทัดที่สอง
      text: |
        นางไม่ถามว่าแน่ใจไหม นางจุ่มปากกา เขียนบรรทัดที่สองลงบนกระดาษแผ่นนั้นทั้งที่ยังไม่ได้เย็บกลับ เขียนสั้นกว่าที่{name}คิด แล้ววางแยกไว้อีกปึกหนึ่ง ปึกนั้นหนากว่าตัวสมุด

        {name}ลงเนินทางตรอกครัวก่อนเที่ยง แม่ครัวยื่นห่อข้าวเหนียวให้หนึ่งห่อ ห่อยังอุ่น
      effects: { org: { id: crown_court, leave: true }, mark: ออกจากราชสำนัก, flags: [left_the_court, left_on_the_page_night] }

# ---------- ใบลา ----------
- id: adult.court_second_line
  stage: adult
  weight: 10
  when:
    age: [25, 64]
    org: crown_court
  text: |
    ทุกคนที่จะออกจากวังต้องเดินไปหาท่านหญิงเอลดริส ยื่นใบลาให้นางกับมือ นางจะเปิดสมุดเล่มเล็กไปที่หน้าของคนนั้น แล้วเขียนบรรทัดที่สอง บรรทัดแรกคือมาด้วยจดหมายของใคร บรรทัดที่สองคือไปเพราะอะไร ไม่มีใครเลือกได้ว่านางจะเขียนบรรทัดที่สองว่าอะไร

    ใบลาของ{name}เขียนเสร็จมาสามคืนแล้ว พับเหน็บอยู่ในแขนเสื้อ กระดาษเริ่มนิ่มตามรอยพับ คืนนี้หัวเข่าปวดจากบันได หลังปวดจากการยืนข้างประตู หูอื้อจากเสียงกระซิบที่ไม่ได้ตั้งใจฟัง

    ห้องของท่านหญิงเอลดริสยังมีแสงตะเกียงลอดประตู นางนอนดึกเสมอ
  choices:
    - id: hand_it_to_eldris
      label: เคาะประตูห้องท่านหญิงเอลดริส ยื่นใบลาให้นางกับมือ
      text: |
        นางอ่านใบลาจนจบ เปิดสมุดไปหน้าของ{name} จุ่มปากกา เขียนบรรทัดที่สองโดยไม่ถามอะไร เขียนยาวกว่าที่{name}คิด แล้วเป่าหมึก ปิดสมุด บอกว่าห้องของ{name}ต้องว่างก่อนระฆังเช้าวันที่สาม

        วันที่สาม{name}เดินลงเนินทางตรอกครัว ทางเดียวกับที่คนใช้เดิน แม่ครัวยืนอยู่ที่ประตูครัว ยื่นห่อข้าวเหนียวให้หนึ่งห่อ บอกว่าทางลงเนินยาว
      effects: { org: { id: crown_court, leave: true }, mark: ออกจากราชสำนัก, flags: [left_the_court] }
    - id: ask_to_read_the_second_lines
      label: ขอท่านหญิงเอลดริสดูบรรทัดที่สองของคนอื่นก่อน
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          นางเปิดให้ดูทีละหน้าโดยเอามือปิดบรรทัดแรกไว้ ไปเพราะแต่งงาน ไปเพราะเหนื่อย ไปเพราะเงินของคนข้างนอกมากกว่า ไปเพราะรู้มากเกินไป ไปเพราะตาย ไปเพราะไม่ยอมบอกว่าเพราะอะไร หน้าสุดท้ายที่นางเปิดให้ดู บรรทัดที่สองเขียนว่า ไม่ได้ไป

          {name}เอาใบลาออกจากแขนเสื้อ ยื่นให้นางฉีกเอง นางพับเก็บใส่ลิ้นชักแทน ไม่ฉีก
        effects: { stats: { WIS: 1 }, org: { id: crown_court, merit: 1 }, flags: [read_the_second_lines] }
      failure:
        text: |
          นางไม่ให้ดู นางบอกว่าบรรทัดที่สองของคนอื่นเป็นของคนอื่น แล้วถามว่ามีใบลามาหรือเปล่า {name}บอกว่าไม่มี นางเลิกคิ้ว ไม่ถามต่อ

          ใบลาอยู่ในแขนเสื้อต่ออีกหลายเดือน นิ่มจนรอยพับขาด ไม่มีใครรู้นอกจาก{name}
        effects: { flags: [kept_the_soft_resignation] }
    - id: burn_it_on_the_lamp_round
      label: เผาใบลาในตะเกียงดวงแรกของรอบจุดไฟพรุ่งนี้
      text: |
        กระดาษนิ่มติดไฟช้า ควันขึ้นไปเปื้อนเพดานเหนือหัวบันไดชั้นสอง ตรงที่ทุกคนรู้ว่าต้องหมุนไส้ไว้ต่ำ คืนนั้นตะเกียงดวงนั้นสว่างกว่าทุกคืน

        เช้ามาท่านหญิงเอลดริสยืนดูรอยควันบนเพดานอยู่ครู่หนึ่ง แล้วสั่งให้คนขึ้นไปเช็ด นางไม่ได้ถามว่าใครทำ บรรทัดที่สองในหน้าของ{name}ยังว่าง
      effects: { org: { id: crown_court, merit: 1 }, flags: [burned_the_resignation_in_a_lamp] }

# ---------- ตะเกียงของผู้กล้า (ไม่ใช่งาน) ----------
- id: adult.court_lamp_stays_dark
  stage: adult
  scene: temple
  weight: 25
  when:
    age: [22, 64]
    org: { id: crown_court, min_rank: 2 }
    not_flags: [held_the_hero_lamp]
    not_traits: [hero_blood]
  text: |
    สามวันก่อนวันงานหลวง บาทหลวงของโบสถ์น้อยต้องการมืออีกคู่หนึ่งที่เขาไว้ใจ เขาไขตู้ตะเกียงด้วยกุญแจดอกเดียวที่ห้อยคออยู่ ยกตะเกียงของผู้กล้าลงมาวางบนผ้ากำมะหยี่สีเลือดหมู แล้วยื่นผ้าขัดกับขี้เถ้าละเอียดถ้วยหนึ่งให้{name}

    ตะเกียงดวงนั้นเป็นทองเหลือง ใหญ่ไม่เกินสองฝ่ามือ หูจับสึกเป็นร่องตามนิ้วของคนที่ถือมันมาหลายชั่วคน ตำนานว่ามันติดเองในมือคนที่มีเลือดผู้กล้า และคนที่จะขึ้นนั่งบนเนินต้องถือมันที่ติดแล้วเดินจากโบสถ์น้อยไปจนถึงเก้าอี้ ในมือของ{name} ทองเหลืองเย็นเหมือนทองเหลืองทุกชิ้นในโลก

    ตอนขัดใต้ฐาน ปลายนิ้วไปสะดุดรอยต่อเส้นหนึ่ง บางเท่าเส้นผม แผ่นฐานหมุนได้ครึ่งรอบ ข้างใต้มีหลอดแก้วยาวเท่านิ้วก้อย ข้างในเป็นน้ำใสที่มีแสงจางๆ ของตัวเอง กับไส้เส้นเล็กที่ร้อยขึ้นไปซ่อนอยู่ในไส้จริง บาทหลวงยืนหันหลังเช็ดแท่นอยู่ ยังไม่ได้หันมา
  choices:
    - id: turn_the_base_back
      label: หมุนแผ่นฐานกลับที่เดิม แล้วขัดต่อจนเงา
      text: |
        แผ่นฐานหมุนกลับเข้าที่ด้วยเสียงคลิกเบาๆ {name}ขัดหูจับจนเห็นหน้าตัวเองโค้งอยู่ในทองเหลือง บาทหลวงหันมารับตะเกียงไปแขวนในตู้ ลั่นกุญแจ แล้วขอบใจเหมือนขอบใจคนช่วยยกม้านั่ง

        วันงานหลวง{name}ยืนอยู่ท้ายโบสถ์น้อย ตะเกียงติดตอนบาทหลวงยกขึ้นจากตู้ ไม่มีใครในโบสถ์น้อยมองใต้ฐาน
      effects: { flags: [held_the_hero_lamp, kept_the_dew_tube_quiet] }
    - id: ask_the_chaplain
      label: ยกตะเกียงให้บาทหลวงดู แล้วถามว่าหลอดนี้มีไว้ทำไม
      text: |
        บาทหลวงไม่ตกใจ เขาหมุนแผ่นฐานกลับเข้าที่ด้วยนิ้วเดียว บอกว่าหลอดนี้อยู่ใต้ฐานมาก่อนเขาเกิด ก่อนบาทหลวงคนก่อนเกิด ช่างของวังเป็นคนทำ เขาเติมน้ำค้างดาวลงหลอดก่อนวันงานหลวงทุกครั้ง ตะเกียงจะได้ติดตอนที่ทุกคนต้องเห็นมันติด

        แล้วเขาก็บอกอีกประโยคหนึ่ง เบากว่าประโยคอื่น ตะเกียงดวงนี้ไม่เคยติดเองให้ใครบนเนินนี้เลยสักคนที่มีคนจำได้ ถึงต้องมีหลอด เขาแขวนตะเกียงกลับเข้าตู้ ลั่นกุญแจสองรอบ
      effects: { stats: { WIS: 1 }, flags: [held_the_hero_lamp, asked_the_chaplain_about_the_tube] }
    - id: smell_the_tube
      label: ดึงหลอดแก้วออกมาดูใกล้ๆ ก่อนบาทหลวงจะหันมา
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          หลอดออกมาง่าย ปากหลอดอุดด้วยขี้ผึ้งที่ยังนิ่ม เพิ่งเติมไม่นาน น้ำข้างในเย็นจัด เรืองแสงจางๆ ที่ฝ่ามือ ก้นหลอดมีรอยสลักเล็กๆ รูปมือคนถือตะเกียง กับเลขที่ไม่ใช่เลขปี {name}เสียบหลอดกลับ หมุนแผ่นฐานปิด ก่อนบาทหลวงจะวางผ้าเช็ดแท่นลง

          ตั้งแต่วันนั้น ทุกครั้งที่เห็นตะเกียงของผู้กล้าติดในวันงานหลวง {name}นับในใจว่าเปลวจะอยู่ได้นานเท่าไร มันอยู่ได้นานเท่าน้ำในหลอดเสมอ
        effects: { stats: { DEX: 1 }, flags: [held_the_hero_lamp, saw_the_artificers_mark] }
      failure:
        text: |
          หลอดลื่นมือ หยดน้ำค้างดาวหยดหนึ่งกระเด็นลงหลังมือ เย็นจนแสบเหมือนโดนน้ำแข็งกัด แล้วไหม้เป็นจุดขาวเท่าเมล็ดงา {name}เสียบหลอดกลับได้ทันพอดี

          บาทหลวงหันมาเห็น{name}กุมหลังมืออยู่ เขาไม่ถาม หยิบขี้ผึ้งจากลิ้นชักแท่นมาให้ทาตลับหนึ่ง จุดขาวบนหลังมือไม่หายไปอีกเลย
        effects: { hp: -1, flags: [held_the_hero_lamp, burned_by_the_lamp_dew] }

- id: adult.court_lamp_lights
  stage: adult
  scene: temple
  weight: 4
  when:
    age: [22, 64]
    org: { id: crown_court, min_rank: 2 }
    not_flags: [held_the_hero_lamp, race_elf, race_dwarf]
  text: |
    สามวันก่อนวันงานหลวง บาทหลวงของโบสถ์น้อยต้องการมืออีกคู่หนึ่งที่เขาไว้ใจ เขาไขตู้ตะเกียงด้วยกุญแจดอกเดียวที่ห้อยคออยู่ ยกตะเกียงของผู้กล้าลงมาวางบนผ้ากำมะหยี่สีเลือดหมู แล้วหันไปเช็ดแท่น

    {name}ยกตะเกียงขึ้นด้วยมือเปล่า ทองเหลืองเย็นอยู่แค่อึดใจเดียว แล้วอุ่นขึ้นจากหูจับมาหาฝ่ามือ ไส้ข้างในแดงขึ้นเองเหมือนถ่านที่มีคนเป่า แล้วติด เปลวเล็ก สีขาวอมทอง ไม่มีควัน แผ่นฐานไม่ได้หมุน ไม่มีใครแตะหลอดใต้ฐาน

    บาทหลวงหันมาพอดี ผ้าเช็ดแท่นตกจากมือเขา เขายืนนิ่ง ปากเปิดค้าง ไม่ได้เข้ามาใกล้ ในโบสถ์น้อยมีเสียงเดียวคือเสียงเปลวไฟกินอากาศ
  choices:
    - id: close_your_hand_over_it
      label: ครอบมืออีกข้างลงบนเปลวจนมันดับ แล้ววางตะเกียงลง
      text: |
        เปลวดับในอุ้งมือโดยไม่ไหม้ ไม่ร้อน อุ่นเท่ามือคนอื่น {name}วางตะเกียงคืนบนผ้ากำมะหยี่ บาทหลวงก้มเก็บผ้าเช็ดแท่นขึ้นมา บอกด้วยเสียงสั่นว่าตะเกียงดวงนี้ไม่เคยติดเองให้ใครบนเนินนี้เลยสักคนที่มีคนจำได้ แล้วไม่พูดถึงมันอีก

        เขาแขวนตะเกียงกลับเข้าตู้ ลั่นกุญแจสามรอบ ปกติเขาลั่นแค่สองรอบ ฝ่ามือของ{name}อุ่นอยู่จนเช้า
      effects: { traits: [hero_blood], flags: [held_the_hero_lamp, hid_the_lamps_flame] }
    - id: hold_it_out_to_the_chaplain
      label: ยื่นตะเกียงที่ติดอยู่ให้บาทหลวงดูใกล้ๆ
      text: |
        บาทหลวงก้มลงดูใต้ฐาน แผ่นฐานยังปิดสนิท เขาไม่ได้แตะตะเกียง เขาแตะข้อมือของ{name}แทน แล้วบอกว่าตะเกียงดวงนี้ไม่เคยติดเองให้ใครบนเนินนี้เลยสักคนที่มีคนจำได้ ถึงต้องมีหลอดใต้ฐาน เปลวดับเองตอน{name}วางตะเกียงลง

        วันงานหลวง บาทหลวงเทศน์ว่าตะเกียงของผู้กล้าขยับตัวในโบสถ์น้อยเมื่อสามวันก่อน มันยังรออยู่ คนที่ฟังเล่าต่อกันว่าเป็นลางดีของคนบนเนิน บาทหลวงไม่ได้บอกว่ามันติดในมือใคร
      effects: { traits: [hero_blood], world: { throne: 1 }, flags: [held_the_hero_lamp, showed_the_chaplain_the_flame] }
    - id: walk_out_with_the_flame
      label: ถือตะเกียงที่ติดอยู่เดินออกจากโบสถ์น้อยไปตามระเบียง
      text: |
        บาทหลวงเรียกชื่อ{name}ครั้งเดียว ไม่ได้ตามออกมา ระเบียงยาวหน้าโบสถ์น้อยมีข้ารับใช้สองคนกำลังจุดตะเกียงรอบเย็น คนหนึ่งทำไม้จุดไฟหล่น อีกคนวิ่งไปเรียกคน กว่าจะมีคนมาถึงสิบกว่าคน เปลวก็ดับเองในมือ{name}

        ภายในเจ็ดวัน ทั้งวังเล่าว่าตะเกียงของผู้กล้าติดในมือคนถือถาด คนที่ไม่เคยเห็นตะเกียงเล่าต่อดังกว่าคนที่เห็น ท่านหญิงเอลดริสสั่งไม่ให้ใครพูดถึง ยิ่งสั่ง คนยิ่งกระซิบ
      effects: { traits: [hero_blood], world: { throne: -1 }, flags: [held_the_hero_lamp, walked_the_corridor_with_the_flame] }
