# ชุด 3a วัยผู้ใหญ่: เลือกงานตอนอายุ 18 (แผน: https://claude.ai/artifact/NznnLZKVWkN9knK2tZmwwD)
# สัญญาลูกมือที่รับตอนพิธีอายุ 14 ครบสี่ปีพอดี ทุกชีวิตได้งานผู้ใหญ่ 1 งาน เป็น flag job_* ที่เหตุการณ์ 3a ถึง 3c ใช้ต่อ
# ทางละฉาก (6 class กับชาวบ้าน) must: true ทุกฉากมีงานเปิดอย่างน้อย 2 งาน
# งานของราชสำนัก (ราชนาวี นักร้องบ้านขุนนาง) กับสถาบันเวทหลวงไม่รับคนมีเขา เว้นซ่อนเขาได้ (horns_sawn) ตามคำตอบ L14
# ข้อความก่อนเลือกต้องใช้ได้ทุกถิ่น ห้ามใช้ {father} {mother} เพราะเด็กกำพร้าวิหารก็มาถึงฉากเหล่านี้

- id: adult.job_pick_warrior
  stage: adult
  weight: 1000
  must: true
  mark: เริ่มงานแรก
  when:
    age: [18, 18]
    class: warrior
  text: |
    ฤดูที่{name}อายุครบสิบแปด สัญญาลูกมือสี่ปีก็ครบกำหนดไปพร้อมกัน ครูคืนดาบไม้เล่มที่ใช้ฝึกมาตั้งแต่วันแรกให้ ด้ามสึกเป็นร่องตามนิ้วของ{name}ไปแล้ว แล้วบอกว่าต่อจากนี้ใครจ่ายเงิน คนนั้นคือนาย

    ในเดือนเดียวกันนั้นมีงานมาให้เลือกสามทาง ประกาศรับสมัครของราชนาวีตอกตะปูติดอยู่ที่ประตูตลาด กระดาษหนา ตราครั่งสีน้ำเงิน ใครกำลังดีอายุถึงให้ไปรายงานตัวที่เวนทราสก่อนสิ้นเดือน มีเสื้อนอกกระดุมทองเหลืองกับเบี้ยเลี้ยงรออยู่

    ผู้เฝ้าผนึกคนหนึ่งเดินทางผ่านมาเอง ผมเกรียนชิดหนัง มือซ้ายเหลือสามนิ้ว เขาไม่เอ่ยเรื่องเงินสักคำ บอกแค่ว่าป้อมสามขาดคนเฝ้ากะดึกมาสองฤดูแล้ว

    ส่วนหัวหน้าขบวนถ่านของบริษัทเหมืองนั่งรออยู่ในโรงเตี๊ยม วางเหรียญทองแดงเรียงห้าเหรียญไว้บนโต๊ะ บอกว่าค่าจ้างล่วงหน้า ลงชื่อเสร็จก็กวาดใส่กระเป๋าไปได้เลย
  choices:
    - id: navy_path
      label: ไปรายงานตัวกับราชนาวีที่เวนทราส
      requires: { flag: path_navy }
      text: |
        นายสิบที่ฝึกลูกมือรุ่น{name}มาตั้งแต่สิบสี่ยังนั่งโต๊ะเดิมที่ท่าน้ำ เขาเงยหน้าจากสมุดทะเบียน จำหน้าได้ แล้วเขียนชื่อ{name}ลงช่องทหารประจำการโดยไม่ต้องให้สอบซ้ำ

        เสื้อนอกตัวจริงหนักกว่าตัวที่ใส่ฝึก ผ้าขนสัตว์ย้อมคราม ข้อศอกยังแข็งเพราะไม่เคยมีใครงอ {name}ใส่ไปยืนตรงหน้าแถวครั้งแรก นายสิบเดินมาแกะกระดุมเม็ดบนสุดที่ติดผิดรูออก ติดให้ใหม่ แล้วเดินไปคนถัดไป
      effects: { flags: [job_navy], location_tag: ventras, reputation: { crown: 1 }, gold: 3, alignment: { law: 1 } }
    - id: navy_strong
      label: ไปรายงานตัวกับราชนาวีที่เวนทราส
      requires: { min_stat: { STR: 14 }, not_flags: [path_navy, race_tiefling] }
      text: |
        ที่โต๊ะรับสมัคร นายสิบชี้กระสอบทรายสามใบที่วางเรียงอยู่ข้างเสา ให้แบกขึ้นบ่าทีละใบ เดินไปแตะเสาธงแล้วเดินกลับ คนก่อนหน้า{name}ทำกระสอบใบที่สองหล่นกลางทาง ทรายแตกออกมากองบนหิน

        {name}แบกครบสามใบ วางลงที่เดิม หายใจยังไม่ทันหอบ นายสิบเขียนชื่อลงสมุดโดยไม่เงยหน้า ถามแค่ว่าว่ายน้ำเป็นไหม แล้วบอกว่าถึงเป็นก็เรียนใหม่อยู่ดี
      effects: { flags: [job_navy], location_tag: ventras, reputation: { crown: 1 }, gold: 3, stats: { STR: 1 } }
    - id: navy_hidden
      label: ไปรายงานตัวกับราชนาวีที่เวนทราส
      requires: { flag: horns_sawn, min_stat: { STR: 14 }, not_flags: [path_navy] }
      text: |
        หมวกทหารเรือทรงสูง ขอบหนา ปิดตอเขาที่เลื่อยไว้ตั้งแต่เกิดได้พอดี หมอที่ตรวจร่างกายทหารใหม่ฟังเสียงปอด ดูฟัน จับข้อเท้า ไม่ขอให้ใครถอดหมวกสักคน เพราะคิวยาวไปถึงประตู

        {name}แบกกระสอบทรายครบสามใบ ได้เสื้อนอกตัวหนึ่ง กับหมวกที่ต้องใส่ทุกครั้งที่ออกนอกห้องนอนไปอีกหลายปี คืนแรกในค่าย {name}นอนตะแคงหน้าเข้าผนัง หมวกวางไว้ข้างหมอน มือข้างหนึ่งจับขอบไว้ทั้งคืน
      effects: { flags: [job_navy], location_tag: ventras, reputation: { crown: 1 }, gold: 3, stats: { STR: 1 } }
    - id: navy_turned_away
      label: ไปต่อแถวราชนาวี ทั้งที่รู้ว่าประกาศไม่ได้เขียนถึงคนแบบตัวเอง
      requires: { trait: curse_brand, not_flags: [horns_sawn] }
      text: |
        {name}ต่อแถวอยู่ครึ่งเช้ากว่าจะถึงโต๊ะ นายสิบเงยหน้าขึ้นมา สายตาหยุดอยู่ที่เขาบนหัว{name}นานพอให้คนข้างหลังเงียบลง แล้วเขาก็วางปากกาลง บอกว่าราชนาวีไม่รับคนมีตรา ไม่มีเหตุผลอื่น และไม่มีอะไรต้องคุยต่อ

        ชายมือสามนิ้วยืนอยู่ท้ายแถวมาตั้งแต่ตอนไหน {name}ไม่ทันเห็น เขาเดินมาแตะไหล่{name} บอกว่าป้อมสามไม่ถามเรื่องหัว ถามแค่ว่าตื่นกะดึกไหวไหม {name}ตอบว่าไหว เขาเลยออกเงินค่าเกวียนไปแดนเถ้าให้ก่อน
      effects: { people: [{ id: garven, name: การ์เวน, gender: m, bond: mentor, closeness: 1, age: 45 }], flags: [job_wardens, navy_refused_horns], location_tag: ashland, reputation: { wardens: 1 }, stats: { CON: 1 } }
    - id: wardens
      label: ไปกับผู้เฝ้าผนึก รับกะดึกที่ป้อมสาม
      text: |
        ผู้เฝ้าผนึกมือสามนิ้วชื่อการ์เวน เขาเดินทางไม่หยุดพักเกินครึ่งชั่วยาม กินข้าวบนหลังเกวียน และนอนได้ทุกที่ที่เอนหลังลงไป พอเข้าเขตแดนเถ้า เถ้าสีเทาเริ่มเกาะล้อเกวียนหนาขึ้นทุกวัน วันที่สามมองไม่เห็นสีของดินอีกเลย

        ป้อมสามเป็นหินสีเทาก่อซ้อนกันสามชั้น ตั้งหันหน้าเข้าหาตอเสาของอัสเทลที่ขอบฟ้า การ์เวนชี้ให้ดูเตียงว่างหกเตียงในห้องนอนรวม บอกว่าเลือกเอาเตียงไหนก็ได้ เจ้าของเดิมไม่กลับมาเอาแล้ว
      effects: { people: [{ id: garven, name: การ์เวน, gender: m, bond: mentor, closeness: 1, age: 45 }], flags: [job_wardens], location_tag: ashland, reputation: { wardens: 1 }, stats: { CON: 1 } }
    - id: mercenary
      label: ลงชื่อคุมขบวนถ่าน แล้วกวาดค่าจ้างล่วงหน้าใส่กระเป๋า
      text: |
        หัวหน้าขบวนชื่อโดรัค พุงใหญ่ เสียงแหบ นิ้วชี้ขวาดำเป็นปื้นจากดินดำ เขาให้{name}ลงชื่อในสมุดของบริษัท นับเหรียญห้าเหรียญใส่มือทีละเหรียญ แล้วบอกกติกาข้อเดียวของขบวน ถ่านถึงปลายทางครบ ค่าจ้างก็ครบ ส่วนคนจะถึงครบหรือไม่ บริษัทไม่ได้เขียนไว้ในสัญญา

        สามวันต่อมา{name}นั่งอยู่บนหลังคาตู้ขนถ่านคันที่สี่ ปืนดินดำยาวพาดตัก ไอร้อนจากถ่านมารในตู้ลอยขึ้นมาทะลุแผ่นไม้ใต้ก้น อุ่นทั้งวันทั้งคืน
      effects: { flags: [job_mercenary], location_tag: ashland, gold: 5 }

- id: adult.job_pick_rogue
  stage: adult
  weight: 1000
  must: true
  mark: เริ่มงานแรก
  when:
    age: [18, 18]
    class: rogue
  text: |
    ปีที่{name}อายุสิบแปด คนที่สอนให้เดินเงียบ เปิดกลอนประตูด้วยลวด และรู้ว่ากระเป๋าคนอื่นมีเงินเท่าไหร่จากรอยดึงของเสื้อ บอกว่าสอนหมดแล้ว ที่เหลือต้องไปเรียนเอากับคนที่ไม่ใจดีเท่า

    คนฝีมือใหม่ที่ไม่มีนายเป็นข่าวที่เดินทางเร็ว ข่าวนี้ไปถึงเวนทราสก่อนตัว{name}จะไปถึงเสียอีก หนูท่าส่งเด็กผมแดงคนหนึ่งมาบอกว่ามีงานขนของรออยู่ที่ท่าน้ำ จ่ายเป็นรอบ ไม่ต้องรู้ว่าของในลังคืออะไร และอย่าถาม

    ชายเสื้อเทาเรียบจากวิหารเบเลคนั่งรออยู่ที่โรงเตี๊ยมทั้งบ่าย สั่งชาถ้วยเดียว ดื่มไม่หมด เขาบอกว่าธนาคารอยากได้คนที่อ่านคนออก ไม่ต้องอ่านหนังสือออกก็ได้

    ทางที่สามไม่มีใครมาเสนอ ย่านขุนนางอยู่ห่างท่าเรือไม่ถึงชั่วยามเดิน ทุกบ้านในย่านนั้นมีคนที่พร้อมเชื่อเรื่องที่ตัวเองอยากเชื่อ
  choices:
    - id: smuggler
      label: รับงานขนของกับหนูท่า
      text: |
        งานรอบแรกเป็นลังไม้สี่ใบที่ต้องย้ายจากโกดังหนึ่งไปอีกโกดังหนึ่ง ระยะทางไม่ถึงสามร้อยก้าว แต่ต้องอ้อมด่านภาษีที่ปากท่า ใช้เวลาทั้งคืน ลังใบที่สามหนักผิดใบอื่น และอุ่นกว่ามือ

        เด็กผมแดงมารอรับที่ประตูโกดังตอนสาง นับลังครบแล้วยื่นเหรียญให้สามเหรียญ บอกว่าคนที่ไม่เปิดลังได้ค่าจ้างครบทุกรอบ
      effects: { flags: [job_smuggler], location_tag: ventras, reputation: { dock_rats: 1 }, gold: 3, stats: { DEX: 1 } }
    - id: bank_spy
      label: ไปนั่งร่วมโต๊ะกับชายเสื้อเทา
      requires: { min_stat: { CHA: 13 } }
      text: |
        ชายเสื้อเทาไม่บอกชื่อ บอกแค่ว่าธนาคารให้กู้คนทั้งเมือง และคนที่กู้ไปเกือบทุกคนเริ่มคิดเรื่องหนีตั้งแต่วันที่สองหลังลงชื่อ งานของ{name}คือรู้ก่อนว่าใครจะหนี ก่อนที่คนนั้นจะรู้ตัวเอง

        เขาเลื่อนแผ่นทองเหลืองบางเท่าเล็บมาให้ บนแผ่นตอกรูปตาชั่ง บอกว่าถ้ามีใครถามว่า{name}ทำงานให้ใคร ไม่ต้องตอบ ให้คนนั้นดูแผ่นนี้ แล้วเขาจะเลิกถามเอง
      effects: { flags: [job_bank_spy], location_tag: ventras, reputation: { belek_bank: 1 }, alignment: { law: 1 }, stats: { CHA: 1 } }
    - id: swindler
      label: ไม่ทำงานให้ใคร ไปหากินเองในย่านขุนนาง
      text: |
        {name}ใช้เงินเก็บเกือบทั้งหมดซื้อเสื้อนอกมือสองตัวเดียว ผ้าดี สีหม่น ตัดตามแบบเมื่อสามฤดูก่อน แบบที่คนมีเงินเก่าชอบใส่เพราะไม่อยากให้ใครคิดว่าเพิ่งรวย ส่วนรองเท้าขัดใหม่ทุกเช้าด้วยไขเทียน

        คืนแรกในย่านขุนนาง {name}ยืนอยู่หน้าบ้านหลังหนึ่งที่จุดตะเกียงฟ้าทุกหน้าต่าง ฟังเสียงงานเลี้ยงข้างใน แล้วจำชื่อคนรับใช้ที่ออกมาสูบยาข้างประตูหลังได้สามชื่อ ก่อนจะกลับไปนอนในห้องเช่าใต้หลังคาที่เพดานสูงไม่ถึงหัว
      effects: { flags: [job_swindler], location_tag: ventras, alignment: { law: -1 }, gold: -2, stats: { CHA: 1 } }

- id: adult.job_pick_wizard
  stage: adult
  weight: 1000
  must: true
  mark: เริ่มงานแรก
  when:
    age: [18, 18]
    class: wizard
  text: |
    ปีที่{name}อายุสิบแปด ครูที่สอนเวทวิชามาสี่ปีขอสมุดจดของลูกศิษย์ไปตรวจเป็นครั้งสุดท้าย พลิกดูทุกหน้า เอาดินสอแดงขีดใต้สูตรที่ผิดสองบรรทัด แล้วลงชื่อรับรองที่ปกหลัง นักเวทไม่มีใบผ่านงานอื่น นอกจากสมุดที่มีชื่อครูเขียนกำกับ

    ร้านช่างเวทในถิ่นส่งคนมาถามหาตั้งแต่สมุดยังไม่แห้งหมึก ร้านรับซ่อมแขนกล หุ่นยาม และอะไรก็ตามที่เดินด้วยน้ำค้างดาวแล้วหยุดเดิน ช่างใหญ่ของร้านตาข้างหนึ่งขุ่นเพราะประกายไฟ ขาดลูกมือที่อ่านสูตรออกมาตั้งแต่ต้นปี

    สถาบันเวทหลวงในเวนทราสเปิดรับนักวิจัยรุ่นใหม่ปีละครั้ง สอบสามวัน คนสอบผ่านไม่ถึงหนึ่งในสิบ

    ส่วนทางที่สามไม่มีประกาศ ใครๆ ก็รู้ว่าในย่านโรงกลั่นริมแม่น้ำ คนเจ็บมีมากกว่าหมอที่ยอมเดินเข้าไป และหมอที่ไม่มีใบอนุญาตก็ไม่มีใครมาไล่จับในย่านนั้น
  choices:
    - id: artificer
      label: รับงานที่ร้านช่างเวท ซ่อมแขนกลกับเครื่องจักร
      habit: craft_hands
      text: |
        ช่างใหญ่ชื่อฮาลเดน เขาไม่ถามอะไรสักคำ ยื่นแขนกลที่ขอนิ้วหักมาให้หนึ่งข้าง แล้วไปนั่งกินข้าวเที่ยง พอกินเสร็จ{name}ต่อขอนิ้วได้สองข้อ ข้อที่สามยังงอไม่ลง

        ฮาลเดนหยิบแขนไปงอเองสามครั้ง ฟังเสียงเฟืองข้างใน แล้วบอกว่าพรุ่งนี้มาตอนไก่ขัน เปลวไฟในเตาเผาโลหะต้องจุดก่อนตะวันขึ้น
      effects: { flags: [job_artificer], stats: { INT: 1 }, gold: 2 }
    - id: researcher_path
      label: ขึ้นทะเบียนเป็นนักวิจัยของสถาบันเวทหลวง
      requires: { flag: path_institute }
      text: |
        ลูกมือของสถาบันที่อยู่ครบสี่ปีไม่ต้องสอบเหมือนคนนอก ต้องเขียนเรื่องที่ตัวเองค้นมาส่งหนึ่งเรื่อง แล้วยืนตอบคำถามอาจารย์สามคนจนกว่าอาจารย์จะหมดคำถาม

        {name}ยืนอยู่ตั้งแต่บ่ายจนจุดตะเกียง อาจารย์คนกลางผมขาวทั้งหัว ถามคำถามสุดท้ายเรื่องที่{name}ไม่ได้เขียนไว้ในเรื่องที่ส่งเลย แต่ตอบได้ อาจารย์จดอะไรบางอย่างลงขอบกระดาษ แล้วให้กุญแจห้องทำงานใต้หลังคาตึกตะวันตกมาหนึ่งดอก
      effects: { flags: [job_researcher], location_tag: ventras, reputation: { royal_institute: 1 }, stats: { INT: 1 } }
    - id: researcher_exam
      label: ไปสอบเข้าสถาบันเวทหลวงที่เวนทราส
      requires: { min_stat: { INT: 15 }, not_flags: [path_institute, race_tiefling] }
      text: |
        วันแรกสอบสูตร วันที่สองสอบมือ ให้กลั่นน้ำค้างดาวหนึ่งหยดจากแสงที่เก็บไว้ในโหลแก้ว วันที่สามไม่มีใครบอกล่วงหน้าว่าจะสอบอะไร พอถึงวันจริง คนคุมสอบพาทุกคนเข้าห้องมืด แล้วให้นั่งเฉยๆ จนกว่าจะเล่าได้ว่าได้ยินเสียงอะไร

        {name}ได้ยินเสียงหึ่งต่ำๆ เสียงเดียว ดังมาจากทางเพดาน คนคุมสอบจดคำตอบลงไปโดยไม่บอกว่าถูกหรือผิด สิบวันต่อมามีจดหมายมาบอกว่าสอบผ่าน พร้อมกุญแจห้องทำงานใต้หลังคาหนึ่งดอก
      effects: { flags: [job_researcher], location_tag: ventras, reputation: { royal_institute: 1 }, stats: { INT: 1 } }
    - id: hedge_doctor
      label: ไปเปิดห้องรักษาในย่านโรงกลั่น ไม่ขอใบอนุญาตจากใคร
      text: |
        ห้องที่{name}เช่าได้อยู่ชั้นสองเหนือร้านขายปลาเค็ม มีโต๊ะหนึ่งตัว เตียงหนึ่งหลัง กับหน้าต่างที่เปิดไม่ได้เพราะกรอบบวมน้ำ {name}เขียนป้ายด้วยถ่านติดไว้ที่บันได ว่ารักษาแผล ไข้ และอาการเจ็บจากโรงกลั่น ราคาตามที่จ่ายไหว

        คนไข้คนแรกมาตอนเที่ยงคืนของวันแรก เด็กหญิงอายุราวสิบขวบ ฝ่ามือทั้งสองข้างพองเป็นตุ่มใสจากการเช็ดหม้อกลั่น เธอจ่ายเป็นปลาเค็มสองตัวที่แม่ฝากมา
      effects: { flags: [job_hedge_doctor], location_tag: ventras, alignment: { law: -1, moral: 1 }, stats: { WIS: 1 } }

- id: adult.job_pick_cleric
  stage: adult
  scene: temple
  weight: 1000
  must: true
  mark: เริ่มงานแรก
  when:
    age: [18, 18]
    class: cleric
  text: |
    ปีที่{name}อายุสิบแปด วิหารให้สาบานต่อหน้า{god}อีกครั้ง คราวนี้ไม่ใช่คำสาบานของลูกมือที่สาบานครั้งละปี เป็นคำสาบานตลอดชีวิต นักบวชผู้ใหญ่อ่านให้ว่าตามทีละประโยค เสียงของ{name}สะท้อนกลับมาจากผนังหินช้ากว่าเสียงตัวเองครึ่งจังหวะ

    หลังพิธี นักบวชผู้ใหญ่เปิดสมุดตำแหน่งว่างให้ดู มีสามบรรทัดที่ยังไม่มีชื่อ บรรทัดแรกคือวิหารที่{name}อยู่มาสี่ปี มีคนมาขอพรทุกเช้า และมีหลังคารั่วสามจุด บรรทัดที่สองคือทางเกวียนตะวันออก หมู่บ้านสิบเอ็ดแห่งที่ไม่มีหมอและไม่มีนักบวชประจำ บรรทัดสุดท้ายเขียนด้วยลายมือคนละคน ภาคีผู้เฝ้าผนึกขอนักบวชไปประจำป้อมในแดนเถ้า ขอมาสามปีแล้ว ยังไม่มีใครไป
  choices:
    - id: city_priest
      label: อยู่ประจำวิหารเดิม
      text: |
        {name}ได้ห้องนอนของตัวเองเป็นครั้งแรก เป็นห้องเล็กหลังห้องเก็บเทียน กว้างพอวางเตียงกับหีบหนึ่งใบ ตำแหน่งใหม่มาพร้อมงานใหม่ เช้ารับคนมาขอพร สายนั่งฟังคนที่มีเรื่องจะเล่า บ่ายปีนขึ้นไปอุดหลังคารั่ว

        เดือนแรกผ่านไป {name}รู้จักชื่อคนที่มาวิหารทุกเช้าครบทุกคน และรู้ว่าใครมาขอพรเรื่องเดิมซ้ำทุกวันโดยไม่เคยได้
      effects: { flags: [job_city_priest], stats: { WIS: 1 } }
    - id: road_healer
      label: เดินทางเกวียนตะวันออก รักษาคนในหมู่บ้านที่ไม่มีหมอ
      text: |
        วิหารให้ลาแก่มาตัวหนึ่ง ย่ามยาหนึ่งใบ กับแผนที่ที่วาดด้วยมือ หมู่บ้านทั้งสิบเอ็ดแห่งเป็นจุดหมึกบนเส้นทางเกวียน บางจุดมีคนเขียนกำกับไว้ว่าหมาดุ บางจุดเขียนว่าอย่าดื่มน้ำบ่อ

        หมู่บ้านแรกเห็นลากับคนสวมเสื้อนักบวชมาแต่ไกล คนทั้งหมู่บ้านออกมายืนรอที่ปากทาง ในมือหลายคนถือของที่อยากให้ดู แผลที่เน่า ลูกที่ไอไม่หยุด กระดูกที่ต่อเองแล้วต่อผิด
      effects: { flags: [job_road_healer], stats: { CON: 1 }, items: [healer_satchel] }
    - id: fort_priest
      label: ไปประจำป้อมผู้เฝ้าผนึกในแดนเถ้า
      text: |
        นักบวชผู้ใหญ่เขียนชื่อ{name}ลงบรรทัดสุดท้ายช้ากว่าบรรทัดอื่น หมึกหยดลงเป็นจุดหนึ่งก่อนจะเริ่มตัวอักษรตัวแรก

        ป้อมที่ภาคีส่ง{name}ไปอยู่ไม่มีห้องสวด มีห้องเก็บศพกับห้องเก็บดินปืนติดกัน ผู้เฝ้าผนึกคนที่พาไปดูห้องบอกว่านักบวชคนก่อนอยู่ได้สองฤดู แล้วก็กลับบ้านไปโดยไม่บอกใคร เขาไม่โทษ แค่อยากให้รู้ไว้
      effects: { flags: [job_fort_priest], location_tag: ashland, reputation: { wardens: 1 }, stats: { WIS: 1 } }

- id: adult.job_pick_ranger
  stage: adult
  weight: 1000
  must: true
  mark: เริ่มงานแรก
  when:
    age: [18, 18]
    class: ranger
  text: |
    ปีที่{name}อายุสิบแปด พรานที่สอนมาสี่ปียื่นมีดถลกหนังเล่มเก่าของตัวเองให้ ใบมีดลับจนบางเหลือครึ่งเดียวจากตอนเป็นของใหม่ แล้วบอกว่าจากนี้ไปไม่ต้องเดินตามหลังใครแล้ว

    กระดานไม้ข้างประตูโรงเตี๊ยมที่ใกล้ที่สุดมีประกาศค่าหัวติดซ้อนกันหนาจนตะปูแทบไม่พอ บางแผ่นใหม่ หมึกยังดำ บางแผ่นซีดจนอ่านได้แค่ตัวเลขเงิน

    ที่โต๊ะในโรงเตี๊ยมเดียวกัน คนเดินทางกลุ่มหนึ่งถามหาคนนำทางมาสามวันแล้ว ยังไม่มีใครรับ เพราะปลายทางที่พวกเขาจะไปเป็นทางที่คนแถวนี้ไม่เดินกัน

    อีกทางหนึ่งคือคนที่จ้างพรานไปเดินทำแผนที่ หอนับดาวจ้างคนเดินนับต้นไม้ที่ค่ายตัดไม้โค่นไป บริษัทเหมืองจ้างคนเดินหาชั้นถ่านใหม่ ใครจ้างก็ตาม แผนที่ที่ได้ก็เป็นของคนจ่าย
  choices:
    - id: bounty
      label: ฉีกประกาศค่าหัวแผ่นที่ใหม่ที่สุดลงมา
      text: |
        ประกาศแผ่นนั้นเขียนว่าสัตว์ตัวหนึ่งเข้ามากินแพะในคอกสามคืนติด ค่าหัวแปดเหรียญ ยังไม่มีใครเห็นตัวมันเต็มตา คนเขียนประกาศวาดรอยเท้าไว้ที่มุมกระดาษ รอยเท้าห้านิ้ว ใหญ่กว่าฝ่ามือคน

        เจ้าของโรงเตี๊ยมเห็น{name}ฉีกประกาศ ก็เดินมาบอกว่าถ้ากลับมาได้ จะเลี้ยงเหล้าหนึ่งแก้ว ถ้ากลับมาไม่ได้ ประกาศแผ่นใหม่จะขึ้นค่าหัวเป็นสิบเหรียญ
      effects: { flags: [job_bounty_hunter], stats: { DEX: 1 } }
    - id: guide_pass
      label: รับจ้างนำทางคนเดินทางกลุ่มนั้น
      requires: { flag: path_pass_guide }
      text: |
        {name}เดินช่องเขามาสี่ปีจนรู้ว่าหินก้อนไหนโยก ทางไหนน้ำแข็งละลายก่อน และหน้าผาไหนมีลมพัดลงตอนบ่าย คนเดินทางกลุ่มนั้นยอมจ่ายครึ่งหนึ่งก่อนออกเดิน อีกครึ่งจ่ายตอนถึงปลายทาง

        {name}ตรวจรองเท้าของทุกคนก่อนออกเดิน สั่งให้คนหนึ่งเปลี่ยนคู่ คนนั้นบ่น แต่ก็เปลี่ยน
      effects: { flags: [job_guide], stats: { WIS: 1 }, gold: 3 }
    - id: guide_ash
      label: รับจ้างนำทางคนเดินทางกลุ่มนั้น
      requires: { flag: path_ash_guide }
      text: |
        {name}เดินแดนเถ้ามาสี่ปีจนรู้ว่าเถ้าตรงไหนลึกถึงเข่า ตรงไหนลึกจนกลืนคนได้ทั้งตัว และหญ้าสีเงินขึ้นตรงไหนแปลว่าข้างใต้มีหิน คนเดินทางกลุ่มนั้นยอมจ่ายครึ่งหนึ่งก่อนออกเดิน อีกครึ่งจ่ายตอนถึงปลายทาง

        {name}ให้ทุกคนพันผ้าปิดจมูกสามชั้นก่อนออกเดิน คนหนึ่งถามว่าทำไมต้องสามชั้น {name}ตอบว่าสองชั้นไม่พอ
      effects: { flags: [job_guide], stats: { WIS: 1 }, gold: 3 }
    - id: guide_wise
      label: รับจ้างนำทางคนเดินทางกลุ่มนั้น
      requires: { min_stat: { WIS: 13 }, not_flags: [path_pass_guide, path_ash_guide] }
      text: |
        {name}ไม่เคยเดินทางเส้นที่คนกลุ่มนั้นจะไป แต่ถามคนแก่ในโรงเตี๊ยมจนได้เรื่องครบทุกช่วง ช่วงไหนมีน้ำ ช่วงไหนต้องเดินกลางคืน ช่วงไหนต้องทำเป็นไม่ได้ยินเสียงคนเรียก คนกลุ่มนั้นยอมจ่ายครึ่งหนึ่งก่อนออกเดิน

        คืนก่อนออกเดิน {name}วาดทางทั้งเส้นลงบนผ้าเช็ดหน้าผืนหนึ่ง แล้วพับเก็บไว้ในเสื้อด้านใน
      effects: { flags: [job_guide], stats: { INT: 1 }, gold: 3 }
    - id: scout
      label: รับงานพรานสำรวจ เดินทำแผนที่ให้คนที่จ่าย
      habit: hunter_eye
      text: |
        คนจ้างให้สมุดผูกเชือกมาหนึ่งเล่ม เข็มทิศทองเหลือง กับไม้วัดยาวเท่าตัวคน แล้วชี้ลงบนแผนที่เก่าตรงที่เป็นกระดาษว่าง ไม่มีเส้นอะไรเลย บอกว่าอยากได้ทุกอย่างที่อยู่ตรงนั้น

        {name}ออกเดินตั้งแต่สาง เดินนับก้าว จดทุกลำธาร ทุกเนิน ทุกรอยเท้าสัตว์ ตกค่ำหน้าแรกของสมุดเต็มไปแล้ว กระดาษว่างบนแผนที่ยังว่างอยู่เกือบทั้งแผ่น
      effects: { flags: [job_scout], stats: { DEX: 1 } }

- id: adult.job_pick_bard
  stage: adult
  weight: 1000
  must: true
  mark: เริ่มงานแรก
  when:
    age: [18, 18]
    class: bard
  text: |
    ปีที่{name}อายุสิบแปด ครูที่สอนร้องเพลงมาสี่ปีให้ร้องเพลงที่{name}แต่งเองให้ฟังเป็นครั้งสุดท้าย ฟังจบแล้วไม่ชม ไม่ติ บอกแค่ว่าท่อนที่สองยังโกหกอยู่ แล้วเดินไปเปิดประตูให้

    คณะละครเร่คณะหนึ่งผ่านเข้ามาในถิ่นด้วยเกวียนทาสีสามเล่ม พระเอกของคณะเสียงแตกกลางเรื่องตั้งแต่ถิ่นที่แล้ว หัวหน้าคณะต้องการเสียงใหม่ภายในเจ็ดวัน

    เจ้าของโรงเตี๊ยมหัวมุมตลาดอยากได้คนร้องข่าว คนที่รู้ว่าที่ไหนเกิดอะไรขึ้น แล้วร้องให้คนในร้านฟังได้ก่อนเหล้าจอกที่สอง ค่าจ้างเป็นข้าวเย็นทุกคืนกับเหรียญที่ลูกค้าโยนให้

    ส่วนพ่อบ้านของบ้านขุนนางหลังหนึ่งในเวนทราสกำลังหานักร้องประจำบ้าน เขาส่งคนมาฟังเสียงตามโรงเตี๊ยมทุกถิ่น คนที่เขาเลือกต้องร้องได้ทุกงาน ทั้งงานแต่งและงานศพ
  choices:
    - id: troupe
      label: ไปลองเสียงกับคณะละครเร่
      text: |
        หัวหน้าคณะเป็นหญิงร่างใหญ่ชื่อมาริเดล นางให้{name}ร้องเพลงของพระเอกคนเก่าทั้งเรื่องในคืนเดียว ร้องจบท่อนสุดท้าย นางโยนผ้าคลุมสีแดงที่ยังมีกลิ่นเหงื่อของพระเอกคนเก่ามาให้ บอกว่าพรุ่งนี้เล่นจริง ใครลืมเนื้อให้ร้องเพลงที่จำได้ไปก่อน คนดูไม่รู้หรอก

        คืนแรกบนเวที {name}ลืมเนื้อสองครั้ง คนดูไม่รู้จริงๆ
      effects: { flags: [job_troupe], stats: { CHA: 1 } }
    - id: news
      label: รับร้องข่าวที่โรงเตี๊ยมหัวมุมตลาด
      text: |
        งานของคนร้องข่าวเริ่มตั้งแต่เช้า ไม่ใช่ตอนค่ำ {name}เดินฟังคนขายของในตลาด คนต่อแถวรอตักน้ำ และคนเกวียนที่เพิ่งเข้าถิ่นมา จนได้เรื่องห้าเรื่อง แล้วแต่งเป็นเพลงทั้งห้าเรื่องก่อนตะวันตก

        คืนแรกมีคนโยนเหรียญให้สองเหรียญ กับเปลือกถั่วอีกกำมือหนึ่ง ชายแก่คนหนึ่งเดินมาบอกว่าเรื่องที่สามร้องผิด วัวที่ตายไม่ใช่วัวของเขา เป็นวัวของน้องเขย
      effects: { flags: [job_news_walker], stats: { INT: 1 }, gold: 2 }
    - id: house_singer_path
      label: ไปร้องให้คนของพ่อบ้านฟัง
      requires: { flag: path_theater }
      text: |
        คนของพ่อบ้านจำ{name}ได้จากโรงละครในเวนทราส เขาไม่ให้ร้องเพลงใหม่ ให้ร้องเพลงเดียวกับที่ร้องบนเวทีปีที่แล้ว ทั้งท่อนที่ร้องพลาด

        {name}ร้องท่อนนั้นไม่พลาดแล้ว เขาจดอะไรสั้นๆ แล้วบอกว่าบ้านนี้ไม่ชอบนักร้องที่ร้องเหมือนเดิมทุกครั้ง ขอให้ไปรายงานตัวที่ประตูหลังภายในสามวัน ประตูหน้ามีไว้ให้แขก
      effects: { flags: [job_house_singer], location_tag: ventras, reputation: { crown: 1 }, stats: { CHA: 1 } }
    - id: house_singer_charm
      label: ไปร้องให้คนของพ่อบ้านฟัง
      requires: { min_stat: { CHA: 15 }, not_flags: [path_theater, race_tiefling] }
      text: |
        คนของพ่อบ้านนั่งฟังอยู่หลังร้าน จิบน้ำเปล่า ไม่ยิ้ม ไม่ปรบมือ ฟังคนร้องมาแล้วสิบสองคนตั้งแต่เช้า {name}เป็นคนที่สิบสาม ร้องเพลงงานศพของถิ่นนี้ เพลงที่คนในร้านทุกคนร้องตามได้ แต่ไม่มีใครอยากร้อง

        ร้านเงียบตั้งแต่ท่อนแรกจนท่อนสุดท้าย คนของพ่อบ้านลุกขึ้นวางเหรียญเงินไว้บนโต๊ะสองเหรียญ เป็นค่าเดินทางไปเวนทราส ให้ไปรายงานตัวที่ประตูหลัง ประตูหน้ามีไว้ให้แขก
      effects: { flags: [job_house_singer], location_tag: ventras, reputation: { crown: 1 }, gold: 2 }

- id: adult.job_pick_commoner
  stage: adult
  weight: 1000
  must: true
  mark: เริ่มงานแรก
  when:
    age: [18, 18]
    flags: [path_commoner]
  text: |
    ธรรมเนียมที่ถิ่นไหนก็ทำเหมือนกัน ลูกมือที่อยู่ครบสัญญาสี่ปีต้องเลี้ยงข้าวนายหนึ่งมื้อด้วยเงินที่หามาเอง แล้วนายจะคืนกระดาษสัญญาให้ ฉีกหรือเก็บก็แล้วแต่ลูกมือ

    {name}จ่ายค่าข้าวมื้อนั้นด้วยเงินที่เก็บมาครึ่งปี นายกินช้าๆ จนหมดจาน แล้วยื่นกระดาษสัญญาที่พับจนขาดตามรอยพับมาให้ บอกว่าอยากอยู่ต่อก็อยู่ ค่าแรงขึ้นให้เท่าคนงานเต็มตัว อยากไปทำอย่างอื่นก็ไป ไม่มีใครว่า

    ตลอดสี่ปีที่ผ่านมา{name}เห็นงานของคนในถิ่นมาหมดแล้วทุกอย่าง รู้ว่างานไหนเหนื่อยตรงไหน จ่ายดีแค่ไหน และทำให้มือคนเป็นแผลแบบไหน
  choices:
    - id: farmer
      label: เช่านาทำเอง
      requires: { not_flags: [origin_refinery, origin_dwarf_clan, origin_elf_bough, origin_marked_hidden, origin_ashland] }
      text: |
        เจ้าของที่ให้เช่านาแปลงล่างริมคลอง กว้างพอให้ควายไถสองวันจบ ค่าเช่าเป็นข้าวหนึ่งในสามของที่เกี่ยวได้ จ่ายตอนลานนวดเสร็จ ปีไหนน้ำท่วม ปีไหนแล้ง ส่วนแบ่งก็ไม่ลด

        {name}ไปเดินดูนาแปลงนั้นตอนเย็น ดินดำ ชื้นถึงข้อเท้า ตรงหัวคันนามีตอไม้ที่ใครสักคนพยายามขุดออกแล้วเลิกกลางคัน {name}นั่งลงบนตอนั้น นั่งจนตะวันลับ
      effects: { flags: [job_farmer], stats: { CON: 1 } }
    - id: refinery_hand
      label: เข้าโรงกลั่นเป็นคนงานเต็มตัว
      requires: { not_flags: [origin_farm, origin_dwarf_clan, origin_elf_bough, origin_marked_kept, origin_marked_foundling, origin_ashland] }
      text: |
        หัวหน้ากะรับ{name}ในวันเดียวกับที่ไปถาม เพราะเมื่อวานคนงานในกะเดียวกันหายไปสองคน หัวหน้ากะไม่บอกว่าหายไปไหน {name}ได้ถุงมือหนังหนึ่งคู่ ผ้าปิดจมูกหนึ่งผืน กับเบอร์ประจำหม้อกลั่นที่สลักไว้บนป้ายเหล็ก

        คนงานในกะเรียกกันด้วยเบอร์หม้อ ไม่เรียกชื่อ พอสิ้นเดือนแรก {name}เผลอเรียกตัวเองด้วยเบอร์ในใจครั้งหนึ่ง
      effects: { flags: [job_refinery_hand], reputation: { distillers: 1 }, gold: 3 }
    - id: docker
      label: ไปแบกของที่ท่าเรือ
      requires: { not_flags: [origin_farm, origin_dwarf_clan, origin_elf_bough, origin_marked_kept, origin_marked_foundling, origin_ashland] }
      text: |
        คนแบกของที่ท่าเรือไม่มีสัญญา ใครมายืนที่ลานตอนตีห้า หัวหน้าท่าจะชี้นิ้วเลือกคนทีละคนจนครบจำนวนที่ต้องการ คนที่เหลือก็เดินกลับบ้าน

        เช้าแรกหัวหน้าท่าชี้{name}เป็นคนสุดท้าย เพราะคิดว่าตัวเล็กไป ตกเย็น{name}แบกกระสอบได้มากกว่าคนที่ได้ไปก่อนครึ่งลาน เช้าวันที่สอง หัวหน้าท่าชี้{name}เป็นคนที่สาม
      effects: { flags: [job_docker], stats: { STR: 1 }, gold: 2 }
    - id: miner
      label: ลงเหมืองถ่านมาร
      requires: { not_flags: [origin_farm, origin_refinery, origin_elf_bough, origin_marked_kept, origin_marked_hidden, origin_marked_foundling] }
      text: |
        คนงานเหมืองใหม่ทุกคนต้องลงไปพร้อมคนเก่าหนึ่งคนในสิบวันแรก คนเก่าที่บริษัทจับคู่ให้{name}ไอแห้งๆ ตลอดเวลา ไอจนคนทั้งเหมืองชินหูไปแล้ว เขาสอนสองเรื่อง เรื่องแรกคือเสียงคานไม้ที่ลั่นก่อนเพดานถล่ม เรื่องที่สองคือห้ามหยิบถ่านมารด้วยมือเปล่า ไม่ว่าจะดูมอดแค่ไหน

        วันที่สิบเอ็ด {name}ลงไปคนเดียว ไออุ่นจากผนังเหมืองซึมเข้ามาทางพื้นรองเท้าตั้งแต่บันไดขั้นแรก
      effects: { flags: [job_miner], stats: { CON: 1 }, gold: 3 }
    - id: smith
      label: เป็นช่างตีเหล็กและช่างกลเต็มตัว
      habit: craft_hands
      requires: { not_flags: [origin_elf_bough] }
      text: |
        ช่างคนไหนก็ต้องมีเครื่องมือของตัวเองสักชุด {name}เอาเงินที่เหลือจากค่าข้าวไปซื้อค้อนหนึ่งเล่มกับคีมหนึ่งอัน ค้อนเป็นของมือสอง หัวค้อนบิ่นมุมหนึ่ง ด้ามใหม่ คีมยังมีชื่อเจ้าของเก่าสลักไว้ที่ขา

        งานแรกที่รับเองเป็นงานตอกเกือกม้าให้คนส่งของ ม้าตัวนั้นดิ้นทุกครั้งที่ค้อนลง {name}ตอกจนครบทั้งสี่เท้า แล้วนั่งพักนานกว่าตอนตอก
      effects: { flags: [job_smith], stats: { STR: 1 }, gold: 1 }
    - id: bough_crafter
      label: เป็นช่างไม้และช่างทอบนกิ่ง
      requires: { flag: origin_elf_bough }
      text: |
        ช่างบนกิ่งไม่ตัดกิ่งที่ยังมีชีวิต ต้องรอให้กิ่งหักเอง หรือให้ต้นไม้ทิ้งลงมาเองในฤดูลม ไม้ที่ใช้ทำบ้าน ทำสะพานเชือก และทำกี่ทอผ้าบนกิ่งทุกชิ้นจึงเป็นไม้ที่ป่าให้มา ไม่ใช่ไม้ที่ใครเอาไป

        ช่างแก่ที่{name}เป็นลูกมือมาสี่ปีให้สิ่วมาเล่มหนึ่ง ด้ามทำจากไม้ที่หักลงมาเมื่อร้อยสามสิบปีก่อน แล้วบอกว่าใช้ไปเถอะ ยังอยู่ได้อีกหลายเจ้าของ
      effects: { flags: [job_bough_crafter], stats: { DEX: 1 } }
    - id: merchant
      label: ซื้อของถิ่นนี้ไปขายถิ่นอื่น
      text: |
        {name}เอาเงินที่เหลือทั้งหมดไปซื้อของที่ถิ่นนี้มีเหลือแต่ถิ่นอื่นขาด ได้มาเต็มกระบุงหลังหนึ่ง แล้วถามคนเกวียนทุกคนที่ผ่านมาว่าถิ่นข้างหน้าขาดอะไรบ้าง ได้คำตอบไม่ซ้ำกันสักคน

        ถิ่นแรกที่ไปถึง{name}ขายของได้ครึ่งกระบุงในราคาที่ต่ำกว่าที่ตั้งใจไว้ ถิ่นที่สองขายที่เหลือได้หมดในราคาที่สูงกว่าที่ฝันไว้ เดินกลับบ้านพร้อมกระบุงเปล่ากับเหรียญมากกว่าตอนออกจากบ้านสี่เหรียญ
      effects: { flags: [job_merchant], stats: { CHA: 1 }, gold: 4 }
    - id: clerk
      label: ไปสมัครเป็นเสมียนที่วิหารเบเลค
      requires: { min_stat: { INT: 13 } }
      text: |
        เสมียนใหญ่ของวิหารเบเลคประจำถิ่นให้{name}คัดสัญญาฉบับหนึ่งลงสมุดเล่มใหม่ ห้ามผิดแม้แต่จุดเดียว ห้ามขูด ห้ามขีด ผิดตรงไหนต้องเริ่มหน้าใหม่ {name}คัดจบในหน้าแรก

        เสมียนใหญ่เอาแว่นมาส่องทีละบรรทัด แล้วบอกว่าวิหารจ่ายค่าแรงตรงเวลาทุกต้นเดือน ไม่เคยช้า ไม่เคยขาด และไม่เคยลืมว่าใครติดอะไรใคร
      effects: { flags: [job_clerk], reputation: { belek_bank: 1 }, alignment: { law: 1 }, stats: { INT: 1 } }
