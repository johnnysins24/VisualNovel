# ชุด 5 ค ปีเรือไม่กลับ 9 เรื่อง (ปี 367 ถึง 379) สัปดาห์ธรรมดาหลังกองเรือห้าลำไม่ลงมา
# รอยเห็นได้ตอนเที่ยง ของตกลงมากับฝนเค็มโดยไม่มีศพ กองเรือชุดสองกลับมาสามลำหลังสี่สิบวัน เพดานเรือ
# ของที่ตกจากฟ้าไม่มีใครจับมือเปล่า (ใช้คีม ไม้ ถุงมือ) เพราะจับมือเปล่าแล้วรอยดาวขึ้น ทางเดียวในชุดที่ดันรอยดาวคือแกะจดหมายอ่านเอง
# คนมีตรามีทางของตัวเองใน noon_line, above_the_ceiling และ empty_chairs
# ไม่มีเรื่องไหนบอกว่ารอยคืออะไร คนในเรื่องเดากันเอง ทุกเรื่องจบก่อนคืนฟ้าเก่า

# ---------- รอยตอนเที่ยง ----------
- id: adult.era_fleet_noon_line
  stage: adult
  weight: 24
  when:
    age: [16, 130]
    year: [367, 374]
  text: |
    ตั้งแต่วันที่สิบของปีเรือไม่กลับ ถิ่นของ{name}มีธรรมเนียมตอนเที่ยงเพิ่มขึ้นหลายอย่างโดยไม่มีใครตั้ง หมวกปีกกว้างเท่ากระด้ง แผงตลาดขึงผ้าใบ คนเดินก้มดูปลายเท้า แม่ๆ ตีมือเด็กที่ชี้ขึ้นฟ้า ตีเบาๆ แต่ตีทุกครั้ง เด็กรุ่นนี้เลยชี้อะไรด้วยคางกันทั้งรุ่น

    รอยอยู่ตรงนั้นทุกเที่ยง เป็นเส้นซีดบนฟ้าสีคราม ไม่ขยับ บางเดือนดูหนาขึ้น บางเดือนคนเถียงกันว่าไม่ได้หนาขึ้นเลย

    ออเดนเคยผูกเชือกเรือเหาะที่หอท่าจนฝ่ามือหยาบเป็นเปลือกไม้ วันที่กองเรือออก เขาเป็นคนปลดเชือกลำที่สี่ ทุกเที่ยงเขาปูเสื่อกลางลาน นอนหงาย ถ้วยน้ำวางข้างหัว แล้วจ้องรอยตั้งแต่เงาสั้นที่สุดจนเงาเริ่มยาว ใครถาม เขาบอกว่ารอดูว่ามีจุดไหนออกมาบ้าง คนในถิ่นเดินอ้อมเสื่อของเขาเหมือนเดินอ้อมหลุมบนถนน
  choices:
    - id: lie_down_once
      label: ไปนอนข้างเขาหนึ่งเที่ยง
      habit: curious
      text: |
        เสื่อร้อนจนต้องเอาแขนเสื้อรองหัว ตอนแรก{name}เห็นแค่เส้นซีด พอนานเข้าจึงเห็นว่าขอบข้างหนึ่งของรอยคมกว่าอีกข้าง ออเดนบอกว่าเขาเฝ้าข้างที่คม เฝ้ามาตั้งแต่ปีที่แล้ว นกบินผ่านไปฝูงหนึ่ง ตาของออเดนไม่ตามนก

        พอ{name}ลุกขึ้น คนทั้งลานกำลังตั้งใจไม่ดู ตลอดบ่ายนั้นมีเส้นซีดๆ พาดอยู่บนทุกอย่างที่{name}มอง บนชามข้าว บนหน้าคน บนกระดานราคาหน้าร้าน กินข้าวเย็นเสร็จจึงจางไป
      effects: { stats: { WIS: 1 }, flags: [lay_under_the_noon_line] }
    - id: talk_him_into_the_shade
      label: เอาม้านั่งไปนั่งข้างเสื่อ คุยจนเขายอมลุกเข้าร่ม
      habit: sweet_tongue
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ไม่ได้พูดเรื่องรอยเลย พูดเรื่องเชือก ผูกปมให้ดูปมหนึ่ง ผูกผิดตั้งใจ ออเดนทนได้ไม่ถึงสามลมหายใจก็ลุกขึ้นนั่งแก้ให้ บ่ายนั้นเขานั่งใต้ผ้าใบของแผงผักสอนเด็กผูกปมเรือ เด็กๆ ชี้ปมที่ผูกผิดด้วยคาง

          วันรุ่งขึ้นเขายังปูเสื่อตอนเที่ยงเหมือนเดิม แต่ปูใต้ผ้าใบ เด็กสามคนนั่งรออยู่ก่อนแล้ว ถือเชือกมาคนละเส้น
        effects: { stats: { CHA: 1 }, flags: [talked_auden_into_the_shade] }
      failure:
        text: |
          ออเดนฟังทุกคำ ขอบใจทุกคำ แล้วไม่ขยับ {name}นั่งเถียงอยู่กลางแดดจนหัวหมุน ลุกขึ้นแล้วโลกเอียงไปทางหนึ่ง ต้องเกาะไหล่คนที่เดินผ่าน

          คนที่ยื่นน้ำให้{name}คือออเดน ยื่นถ้วยของเขาเองมาโดยไม่ละตาจากฟ้า
        effects: { hp: -1, flags: [talked_auden_into_the_shade] }
    - id: sell_him_a_hat
      label: เอาหมวกปีกกว้างใบเก่าไปขายให้เขา
      text: |
        ออเดนจ่ายสองเหรียญ เกินราคาไปเหรียญหนึ่ง ไม่ต่อ แล้วเอาหมวกวางปิดหน้าตัวเองทั้งใบ นอนจ้องรอยต่อผ่านรูสานของหมวก

        คนในลานหัวเราะกันทั้งบ่าย วันรุ่งขึ้นเด็กสองคนเอากระจาดมาคว่ำปิดหน้าตัวเอง นอนเรียงข้างเสื่อของออเดน แม่ของเด็กทั้งสองยืนดูอยู่ใต้ชายคา ตัดสินใจไม่ได้ว่าจะตีมือใคร
      effects: { gold: 2, flags: [sold_auden_a_hat] }
    - id: lie_beside_him_whenever_he_asks
      label: ไปนอนข้างเขาทุกเที่ยงที่เขาขอ
      habit: soft_heart
      requires: { trait: curse_brand }
      text: |
        ออเดนมาขอถึงประตู เขาบอกว่าเวลามีคนมีตรานอนอยู่ข้างๆ เขาจ้องได้นานขึ้น ไม่ได้บอกว่ารู้ได้อย่างไร {name}ไปนอนบนเสื่อผืนที่สองที่เขาปูรอไว้ เห็นแต่เส้นซีดบนฟ้า กับนกที่บินผ่าน ไม่มีอะไรมากกว่านั้นสักเที่ยง

        ทุกครั้งที่ลุก ออเดนถามคำเดียวกัน มีอะไรมองกลับมาไหม {name}ตอบคำเดียวกัน เขาจ่ายเป็นยาสูบห่อหนึ่งทุกสัปดาห์ คนในถิ่นเรียกเสื่อสองผืนนั้นว่าที่นอนกลางวันของคนบ้าสองคน
      effects: { gold: 2, flags: [lay_beside_auden_at_noon] }

# ---------- รองเท้าข้างเดียว ----------
- id: adult.era_fleet_boot_in_the_yard
  stage: adult
  weight: 24
  when:
    age: [16, 130]
    year: [367, 376]
  text: |
    ฝนเค็มตกทั้งคืน ทุกบ้านรู้วิธีรับแล้ว ปิดฝาโอ่ง ผูกข้อเท้าคนป่วยไว้กับขาเตียง ไม่ให้เด็กเลียเกลือบนชายคา เช้าขึ้นมาหน้าที่อยู่ของ{name}มีรองเท้าบูตตั้งอยู่ข้างหนึ่ง ผูกเชือกครบทุกรู หนังสีน้ำตาลเข้มมีคราบเกลือขาวเป็นเส้นตามรอยพับ

    {name}ใช้ไม้เขี่ยตามที่ทุกคนรู้ ของที่ตกลงมากับฝนอย่าจับมือเปล่า รองเท้าล้มลงข้าง ข้างในแห้ง แห้งจนมีฝุ่น

    โรงเก็บของหลังศาลาเป็นของกองทุนครอบครัวคนบนเรือห้าลำ ใครเจออะไรก็เอาไปส่งได้ เสมียนอาสาจะติดป้ายว่าเจอที่ไหน วันไหน สภาพเป็นอย่างไร แล้ววางขึ้นชั้น ครอบครัวของคนบนเรือมาเดินดูชั้นได้ทุกวันเบเลค
  choices:
    - id: hand_in_the_boot
      label: ใช้ไม้คีบไปส่งที่โรงของกองทุน
      text: |
        ในโรงมีชั้นไม้สี่ชั้น ชั้นล่างสุดเป็นรองเท้าทั้งชั้น ข้างเดียวทุกคู่ ทุกข้างเป็นข้างซ้าย ของ{name}ก็ข้างซ้าย เสมียนอาสาเป็นหญิงผมขาว เขียนป้ายด้วยลายมือตัวกลม แห้งข้างใน แล้วผูกป้ายไว้ที่เชือกรองเท้า ป้ายแบบเดียวกันห้อยอยู่ทั่วชั้น

        ระหว่างที่{name}ลงชื่อ มีผู้หญิงคนหนึ่งเดินไล่ชั้นล่างทีละข้าง เอาฝ่ามือวัดความยาวของพื้นรองเท้าแต่ละข้างกับเชือกที่ผูกปมไว้ เชือกนั้นยาวเท่าเท้าของใครสักคน
      effects: { alignment: { moral: 1 }, flags: [handed_in_the_dry_boot] }
    - id: keep_it_by_the_door
      label: เก็บไว้ข้างประตู ไม่ให้ใครจับมือเปล่า
      text: |
        รองเท้าตั้งอยู่ข้างประตูตลอดหน้าฝน ฝนเค็มตกอีกสามคืน ทุกเช้า{name}ใช้ไม้เขี่ยดู ข้างนอกเปียกจนหนังดำ ข้างในแห้งมีฝุ่นเท่าเดิม ฝุ่นชั้นเดิม

        ข่าวไปถึงบ่อน้ำ ชายแก่คนหนึ่งจากถิ่นข้างๆ เดินมาถึงประตู ขอดูว่าเป็นของลูกชายเขาหรือเปล่า เขาไม่ได้ก้มลงดู ยืนอยู่ตรงนั้นตั้งแต่สายจนบ่าย แล้วบอกว่าไม่ใช่ ลูกเขาผูกเชือกไม่เคยครบทุกรู
      effects: { stats: { WIS: 1 }, flags: [kept_the_dry_boot] }
    - id: bury_the_boot
      label: ขุดหลุมเปล่าฝังตามธรรมเนียมเก่าของคนที่ไม่มีศพให้ฝัง
      text: |
        หลุมเปล่าของถิ่นต้องลึกแค่เข่า วางของของคนนั้นลงไปหนึ่งชิ้น เทน้ำบ่อลงไปหนึ่งถ้วย แล้วกลบ วางหินแบนไว้ข้างบนโดยไม่สลักอะไร {name}ทำตามนั้นที่ชายทุ่ง เพื่อนบ้านสามคนเดินตามมาเอง หญิงแก่บ้านติดกันท่องคำของคนจมน้ำให้จนจบ ทุกคนรู้ว่ารองเท้าข้างนี้ไม่ใช่ของใครในถิ่น

        สิ้นปีชายทุ่งตรงนั้นมีหินแบนเรียงกันเจ็ดก้อน ไม่มีก้อนไหนสลักชื่อ คนในถิ่นจำได้ว่าก้อนไหนเป็นเชือก ก้อนไหนเป็นระฆัง ก้อนไหนเป็นรองเท้า
      effects: { world: { land: 1 }, flags: [buried_the_dry_boot] }

# ---------- ครึ่งเบี้ย ----------
- id: elder.era_fleet_half_purse
  stage: elder
  weight: 24
  scene: home
  when:
    age: [60, 130]
    year: [367, 372]
  text: |
    ลูกสาวของเคลวิสเป็นคนครัวบนตะเกียงเช้า ทั้งถิ่นรู้เพราะเคลวิสเล่าตั้งแต่วันที่เรือขึ้น เล่าว่าลูกสาวต้มซุปให้นักดาราศาสตร์ของสถาบันกิน เล่าว่าค่าแรงบนเรือหลวงดีกว่าค่าแรงร้านข้าวสามเท่า ตั้งแต่วันที่สิบนางก็เลิกเล่า

    คนของราชนาวีมาที่บ้านนางพร้อมกระดาษแผ่นหนึ่งกับถุงเงินครึ่งถุง ราชนาวีจ่ายครึ่งเบี้ยทุกฤดูให้ครอบครัวคนบนเรือห้าลำจนกว่าจะประกาศกองเรือ กระดาษไม่เขียนว่าตาย ไม่เขียนว่ายังอยู่ เขียนว่ายังไม่ประกาศ ต้องมีลายมือแม่กับลายมือพยานหนึ่งคน

    มือของเคลวิสสั่นจนจับปากกาไม่อยู่มาหลายหน้าหนาวแล้ว คนของราชนาวีว่าแม่กดลายนิ้วมือแทนได้ แต่พยานต้องเขียนชื่อเอง เคลวิสหันมาทาง{name} ที่มานั่งเป็นเพื่อนตั้งแต่เช้า
  choices:
    - id: witness_the_paper
      label: เขียนชื่อลงช่องพยาน
      text: |
        คนของราชนาวีซับหมึกด้วยทรายจากกระปุกที่พกมาเอง ยื่นถุงเงินให้ เคลวิสเอาไปใส่กระป๋องใบชา ปิดฝา แล้วรินชาจากกาให้{name}ด้วยมือที่สั่นจนชาหกครึ่งถ้วย

        ทุกฤดูหลังจากนั้นเขามาอีก ถือกระดาษแบบเดิม คำเดิม {name}เขียนชื่อลงช่องเดิม ในกระป๋องใบชามีใบรับซ้อนกันขึ้นทุกฤดู ทุกใบมีชื่อ{name}อยู่ช่องเดียวกัน
      effects: { alignment: { law: 1 }, flags: [witnessed_the_half_purse] }
    - id: refuse_to_witness
      label: ไม่ยอมเขียนชื่อลงกระดาษที่ใช้คำว่ายังไม่ประกาศ
      habit: stubborn
      text: |
        {name}บอกว่าจะเขียนชื่อในกระดาษที่บอกว่าตาย หรือในกระดาษที่บอกว่ายังอยู่ แผ่นนี้ไม่เขียน คนของราชนาวียักไหล่ เดินไปโรงเตี๊ยม ได้เจ้าของร้านมาเป็นพยานแลกเหล้าแก้วหนึ่ง เคลวิสได้เงินก่อนค่ำวันเดียวกัน

        นางไม่ถือโทษ ฤดูต่อมานางมาขอให้{name}ไปนั่งอยู่ในห้องตอนคนของราชนาวีมา นางบอกว่าอยากให้มีคนในห้องสักคนที่ไม่ยอม หลังจากนั้นทุกฤดู{name}นั่งเก้าอี้ตัวเดิม มือวางบนเข่า ไม่แตะปากกา
      effects: { stats: { WIS: 1 }, flags: [refused_to_witness_the_half_purse] }
    - id: read_it_to_the_lane
      label: ขอกระดาษไปอ่านออกเสียงที่บ่อน้ำให้คนทั้งถิ่นฟัง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}อ่านช้าๆ ทีละบรรทัด ถึงคำว่ายังไม่ประกาศก็อ่านซ้ำ คนที่ยืนรอตักน้ำวางถัง อีกสองบ้านที่มีคนอยู่บนเรือกลับไปเอากระดาษของตัวเองมา แผ่นเดียวกัน คำเดียวกัน ก่อนตะวันตกคนที่บ่อตกลงกันเองว่าครึ่งเบี้ยที่ราชนาวีไม่จ่าย บ่อจะจ่ายให้

          ตั้งแต่ฤดูนั้นมีกระปุกดินใบหนึ่งวางอยู่ที่ขอบบ่อ คนตักน้ำหยอดเหรียญเท่าที่หยอดได้ {name}หยอดเหรียญแรก ปลายฤดูเคลวิสได้เงินสองถุง ถุงหนึ่งมีตราราชนาวี อีกถุงเป็นผ้าเช็ดหน้าผูกมุม
        effects: { stats: { CHA: 1 }, gold: -1, flags: [read_the_half_purse_to_the_lane], city: { merit: 1, here: true } }
      failure:
        text: |
          คนที่บ่อฟังจนจบ แล้วก้มลงตักน้ำต่อ คนหนึ่งบอกว่าอย่างน้อยราชนาวีก็ยังจ่าย อีกคนว่าเรือลูกบ้านเขาไม่ได้ขึ้นไปด้วย ลูกเขาก็ไม่ได้เบี้ยสักแดง คนของราชนาวียืนรอข้างบ่อ ไม่รีบ

          เคลวิสกดลายนิ้วมือ เจ้าของโรงเตี๊ยมเป็นพยาน เย็นนั้น{name}เอาเหรียญสองเหรียญใส่กระป๋องใบชาของนางตอนนางลุกไปเติมน้ำในกา
        effects: { gold: -2, flags: [read_the_half_purse_to_the_lane] }

# ---------- ช้าไปสี่สิบวัน ----------
- id: adult.era_fleet_forty_days_behind
  stage: adult
  weight: 24
  when:
    age: [16, 130]
    year: [368, 376]
  text: |
    เลนดัลลงมากับกองเรือชุดสอง ลงมาพร้อมเบี้ยสามเท่ากับเคราที่ไม่ยาวขึ้นสักเส้น ตั้งแต่วันนั้นเขาอยู่ช้ากว่าคนทั้งถิ่นสี่สิบวัน เขาไม่ได้หลง ใครถามว่าวันนี้วันอะไร เขาตอบวันเดียวกับที่คนถามนับ แต่ปฏิทินที่แขวนข้างประตูบ้านเขาช้าอยู่สี่สิบวัน และเขาอยู่ตามปฏิทินแผ่นนั้น

    เขาหว่านถั่วตอนคนอื่นถอนต้นถั่วไปทำปุ๋ย ซ่อมหลังคาก่อนฝนแรกของปฏิทินเขา ฝนจริงตกใส่ห้องนอนไปแล้วสองหน คนในถิ่นว่าเลนดัลอารมณ์ดีกว่าก่อนขึ้นเรือ บางคนว่าอารมณ์ดีเกินไป

    เย็นนี้เขาถือขนมถาดหนึ่งมาเชิญ{name}ไปกินเลี้ยงเก็บเกี่ยว งานที่ทั้งถิ่นเลี้ยงกันไปแล้วเมื่อสี่สิบวันก่อน
  choices:
    - id: go_to_the_late_feast
      label: ไปกินเลี้ยงเก็บเกี่ยวของเลนดัล
      habit: soft_heart
      text: |
        เขาจัดโต๊ะสำหรับสิบสองคน มาสามคน รวม{name} เขาจุดตะเกียงทุกดวง ยกอาหารออกมาทุกจาน ร้องเพลงเก็บเกี่ยวครบทุกท่อน ท่อนที่คนอื่นลืมไปแล้วเขาก็ยังจำได้

        ตอนกลับ{name}ได้ห่อขนมกลับบ้านมาสามห่อ ขนมยังอุ่น เลนดัลยืนโบกมือที่ประตูจนลับทาง ตะเกียงในบ้านเขายังติดอยู่ทุกดวง
      effects: { stats: { CHA: 1 }, flags: [ate_at_lendals_late_feast] }
    - id: bring_him_an_almanac
      label: ซื้อปฏิทินเล่มใหม่ไปแขวนให้เขาข้างเล่มเก่า
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ไม่ได้ขอให้เขาเปลี่ยน ขอแค่ให้แขวนไว้สองเล่มคู่กัน เลนดัลหัวเราะ บอกว่าคนเราควรมีปฏิทินสำรองไว้เหมือนมีเชือกสำรองบนเรือ แล้วตอกตะปูให้เล่มใหม่เอง

          ตั้งแต่นั้นบัตรเชิญงานเลี้ยงของเลนดัลเขียนวันไว้สองวัน วันของเขาอยู่บน วันของถิ่นอยู่ล่าง ตัวเล็กกว่า คนในถิ่นเริ่มมากินเลี้ยงที่บ้านเขาทีละคนสองคน
        effects: { stats: { WIS: 1 }, flags: [hung_a_second_calendar] }
      failure:
        text: |
          เลนดัลรับไปด้วยสองมือ ขอบใจอย่างจริงใจ แล้วแขวนไว้ในครัว ตรงที่ไม่มีใครเห็น สัปดาห์ต่อมา{name}เห็นหน้าปฏิทินเล่มใหม่ห่อถั่วคั่วอยู่ในตะกร้าที่เขาเอามาแจก

          ถั่วคั่วอร่อย {name}แกะกระดาษห่อออกมาดู หน้าที่ฉีกมาห่อคือหน้าของเดือนที่ผ่านไปแล้ว ของทั้งถิ่น ไม่ใช่ของเขา
        effects: { gold: -1, flags: [hung_a_second_calendar] }
    - id: borrow_on_his_calendar
      label: ยืมเงินเขาสามเหรียญ แล้วนัดคืนตามปฏิทินบ้านเขา
      text: |
        เลนดัลให้ยืมทันที ไม่ถามว่าเอาไปทำอะไร เขาจดวันนัดคืนลงปฏิทินของตัวเองด้วยถ่าน {name}เอาเงินไปจ่ายหนี้ร้านขายของที่ทวงมาสองรอบแล้ว แล้วรอ

        สี่สิบวันหลังวันนัดของทั้งถิ่น {name}เอาเงินไปคืน เลนดัลขอบใจที่มาตรงวัน บอกว่าคนสมัยนี้ไม่ค่อยตรงวันกันแล้ว แล้วชวนอยู่กินข้าวเย็นด้วย
      effects: { gold: 2, alignment: { moral: -1 }, flags: [borrowed_on_lendals_calendar] }
    - id: compare_the_night
      label: ไปนั่งเทียบความจำกับเขาว่าคืนนั้นบนเรือเกิดอะไรตอนไหน
      habit: curious
      requires: { flag: flew_with_the_second_fleet }
      text: |
        เลนดัลอยู่ลำที่สอง {name}อยู่ลำที่สาม ทั้งสองคนจำตรงกันทุกอย่าง แสงมาจากทางไหน รสเค็มในอากาศ หน้าของนายเรือตอนสั่งกลับ ยกเว้นเรื่องเดียว เสียงเคาะท้องเรือจากข้างนอกเริ่มก่อนแสงหรือหลังแสง เลนดัลว่าก่อน {name}ว่าหลัง

        ไม่มีใครยอมใคร ทั้งสองนัดกันมาเถียงเรื่องนี้ทุกเย็นวันอัสเทล วันที่ไม่มีใครทำงาน นับตามปฏิทินของถิ่น เลนดัลยอมข้อนี้ข้อเดียว
      effects: { stats: { INT: 1 }, flags: [compared_the_night_with_lendal] }

# ---------- เพดานเรือ ----------
- id: adult.era_fleet_above_the_ceiling
  stage: adult
  weight: 24
  scene: ship_deck
  when:
    age: [16, 59]
    year: [369, 379]
  text: |
    เซรีนนั่งโต๊ะริมประตูโรงเตี๊ยม ไหล่กว้าง พูดเร็ว ข้อมือทั้งสองข้างมีรอยไหม้จากเชือก นางเป็นนายเรือเหาะขนของลำเล็กที่ลงจอดอยู่ในทุ่งนอกถิ่นตั้งแต่เมื่อวาน ลมตะวันออกพัดแรงจนสู้ไม่ไหว ในท้องเรือเป็นขวดยาของโรงหมอที่ต้องถึงปลายทางก่อนยาจะเสีย ลูกเรือคนหนึ่งของนางลงจากเรือไปเมื่อคืนแล้วไม่กลับ

    นางบอก{name}ตรงๆ ลมใต้ชั้นเมฆจะพาไปช้าสามวัน เหนือชั้นเมฆลมนิ่ง ไปได้ตรงทาง ถึงทันก่อนยาเสีย เพดานเรือห้ามไว้ นางรู้ ทุกคนรู้ คืนพรุ่งนี้นางจะขึ้นไปอยู่ดี ไม่จุดตะเกียง ไม่ให้ใครข้างล่างเห็น คนที่ขึ้นไปด้วยได้ห้าเหรียญ ดึงเชือกเป็นก็พอ
  choices:
    - id: fly_above_the_cloud
      label: ขึ้นเรือไปกับนาง เหนือชั้นเมฆ ไม่จุดตะเกียง
      habit: curious
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          พ้นชั้นเมฆ ฟ้ามีดาวมากจนฟ้าไม่ดำ รอยพาดอยู่เหนือหัวกว้างเท่าถนน ไม่มีใครบนดาดฟ้าพูด เซรีนดูแต่เข็มทิศกับเชือกยก น้ำค้างเกาะราวเรือเป็นเกล็ด {name}เผลอเลียริมฝีปาก รสเค็ม

          ก่อนสางเรือลดลงใต้เมฆ ถึงปลายทางเร็วกว่าทางล่างสามวัน ยายังไม่เสียสักขวด ตอนเรือแตะพื้น เซรีนนับหัวลูกเรือสองหน หนที่สองนางเดินไล่วางมือบนไหล่ทีละคน แล้วจึงจ่ายเงิน
        effects: { stats: { DEX: 1 }, gold: 5, flags: [flew_above_the_ceiling] }
      failure:
        text: |
          เหนือชั้นเมฆดาดฟ้าเย็นจนน้ำค้างกลายเป็นน้ำแข็งบางๆ {name}ลื่นตอนดึงเชือกยก เชือกครูดฝ่ามือทั้งสองข้างไปจนสุดแขน ต้องพันมือด้วยผ้าปูที่นอนของเซรีนไปจนถึงปลายทาง

          ยาถึงทัน เซรีนจ่ายสามเหรียญ อีกสองเหรียญหักเป็นค่าผ้าปูที่นอน นางบอกว่าไม่ได้คิดเล่น ผ้าผืนนั้นนางพกมาจากบ้าน
        effects: { hp: -2, gold: 3, flags: [flew_above_the_ceiling] }
    - id: report_the_pilot
      label: ไปบอกศาลาเรื่องเรือที่จะไต่เกินเพดาน
      text: |
        เย็นนั้นคนของศาลามากับชายอีกสองคน หยดขี้ผึ้งปิดลิ้นยกของเรือเซรีน ประทับตรา แล้วตอกกระดาษไว้ที่เสากระโดง เรือต้องจอดรอลมเปลี่ยน เซรีนไม่เถียง นางนั่งบนลังยาข้างเรือทั้งคืน

        ลมเปลี่ยนในวันที่สาม ก่อนออก นางยกลังยาลงมาลังหนึ่ง เปิดฝา เทขวดที่เสียแล้วลงคูน้ำหน้าศาลาทีละขวด จนหมดลัง แล้วขึ้นเรือไป
      effects: { alignment: { law: 1 }, flags: [reported_the_ceiling_pilot] }
    - id: load_and_stay_down
      label: ช่วยขนลังขึ้นเรือ รับค่าแรง แล้วอยู่ข้างล่าง
      text: |
        {name}ขนลังยาขึ้นเรือจนค่ำ ได้หนึ่งเหรียญ คืนต่อมายืนดูอยู่ที่ชายทุ่ง เรือของเซรีนขึ้นไปช้าๆ ไม่มีแสงสักดวง เป็นเงาดำบังดาวไปทีละดวง แล้วหายเข้าไปในเมฆ ไม่มีใครในถิ่นเห็นนอกจากคนที่ตั้งใจดู

        {name}ไม่ได้ข่าวว่ายาถึงทันหรือเปล่า ฤดูต่อมาเรือลำเดิมลงจอดในทุ่งเดิม เซรีนโบกมือมาแต่ไกล ลูกเรือคนใหม่ยืนข้างนาง เป็นเด็กหนุ่มที่{name}ไม่เคยเห็นหน้า
      effects: { gold: 1, flags: [loaded_the_ceiling_ship] }
    - id: stand_her_bow
      label: บอกนางว่าคนมีตรายืนหัวเรือได้ แล้วขอเบี้ยเท่าที่ราชนาวีให้
      requires: { trait: curse_brand }
      text: |
        เซรีนรู้เรื่องโต๊ะแยกของกองเรือชุดสองเหมือนคนเรือทุกคน นางไม่ต่อ จ่ายเพิ่มให้อีกครึ่ง บอกว่าเงินที่เกินมาซื้อไหล่ของ{name}ที่หัวเรือทั้งคืน ไม่ได้ซื้อมือดึงเชือก

        เหนือชั้นเมฆ{name}ยืนหัวเรือ ดาวเต็มฟ้าจนแทบไม่เหลือที่มืด รอยพาดอยู่เหนือหัว ลูกเรือข้างหลังดูหลังของ{name}ทั้งคืน แบบที่คนบนเรือทะเลดูประภาคาร ไม่มีอะไรเกิดขึ้นเลย ตอนลงจอดเซรีนนับหัวทุกคนหนเดียว ไม่ได้วางมือบนไหล่ใคร
      effects: { gold: 6, flags: [stood_the_bow_above_the_ceiling] }

# ---------- จดหมายมากับฝน ----------
- id: adult.era_fleet_letter_with_the_rain
  stage: adult
  weight: 24
  when:
    age: [16, 130]
    year: [369, 379]
  text: |
    ซองจดหมายอยู่ในรางน้ำหน้าที่อยู่ของ{name} ฝนเค็มเมื่อคืนพัดลงมาไว้ ซองหนังทาน้ำมัน ข้างนอกเปียก ข้างในแห้ง {name}ใช้คีมคีบถ่านคีบขึ้นมาตามที่ทุกคนรู้

    หน้าซองจ่าถึงพิเรล บ้านหลังที่สามจากบ่อน้ำ ลายมือผู้ใหญ่ ตัวกลม ตั้งใจเขียน ในถิ่นมีพิเรลคนเดียว เด็กหญิงที่เพิ่งหัดเขียนชื่อตัวเองได้เมื่อหน้าหนาวที่แล้ว มุมซองลงวันที่ วันธรรมดาวันหนึ่งในปีที่ยังมาไม่ถึง

    ผนึกขี้ผึ้งยังไม่แตก
  choices:
    - id: deliver_it_sealed
      label: เอาไปส่งให้บ้านพิเรลโดยไม่แกะ
      text: |
        แม่ของพิเรลรับซองด้วยผ้าขี้ริ้ว อ่านหน้าซองสองหน แล้ววางไว้บนหิ้งสูงที่มือเด็กเอื้อมไม่ถึง นางบอกว่าจะเปิดในวันที่เขียนไว้ที่มุมซอง ไม่ก่อนหน้านั้น

        หน้าหนาวนั้นพิเรลหัดอ่านเร็วกว่าเด็กทุกคนในถิ่น ทุกคืนก่อนนอนนางให้แม่ยกซองลงมาจากหิ้ง อ่านหน้าซองออกเสียงหนึ่งรอบ ชื่อตัวเอง ชื่อบ้าน ชื่อบ่อ แล้วส่งคืนขึ้นหิ้ง
      effects: { alignment: { law: 1 }, flags: [delivered_the_rain_letter] }
    - id: read_it_first
      label: ถอดถุงมือ แกะอ่านเองก่อน (ของแบบนี้ติดตัวไปนาน)
      habit: curious
      requires: { not_traits: [curse_brand] }
      text: |
        จดหมายเขียนถึงพิเรลที่เป็นผู้ใหญ่แล้ว เรื่องธรรมดาทั้งฉบับ ราคาเกลือ หลังคาที่ซ่อมเสร็จ แมวที่หายไปสามวันแล้วกลับมาเอง ประโยคหนึ่งบอกว่าเธอพูดถูกเรื่องบ่อ ลงท้ายด้วยชื่อที่{name}ไม่รู้จัก {name}อ่านสองรอบ แล้วผนึกซองคืนด้วยขี้ผึ้งเทียน เอาไปส่ง แม่ของพิเรลเห็นว่าขี้ผึ้งใหม่ แต่ไม่ได้ถาม

        ตั้งแต่คืนนั้น{name}จำจดหมายฉบับนั้นได้ทุกคำ ชัดกว่าจำเรื่องของตัวเอง ปลายนิ้วที่จับกระดาษเย็นทุกเช้า อุ่นเท่าไรก็ไม่หาย เช้าวันต่อมาที่บ่อน้ำ แม่ของพิเรลทัก{name}เหมือนทุกเช้า {name}ทักตอบได้โดยนึกชื่อนางไม่ออก
      effects: { marks: { star: 1 }, world: { star: 1 }, flags: [read_the_rain_letter] }
    - id: burn_it_at_the_temple
      label: คีบไปเผาที่วิหารโดยไม่แกะ
      text: |
        นักบวชรับซองด้วยคีมของวิหาร ไม่อ่านหน้าซอง วางลงในอ่างไฟใต้ตะเกียง กระดาษไหม้ช้า เกลือในเนื้อกระดาษแตกเปาะเป็นประกายสีฟ้า หน้าซองไหม้เป็นอย่างสุดท้าย นักบวชเขียนลงสมุดของวิหารบรรทัดหนึ่ง จดหมายที่มากับฝน เผาแล้ว ไม่มีชื่อ

        แม่ของพิเรลรู้เรื่องจากคนที่เห็น{name}เดินคีบซองผ่านบ่อ นางมาหาที่ประตู ถามคำเดียวว่าซองนั้นจ่าถึงใคร {name}ตอบตามจริง ตั้งแต่นั้นนางทักทาย{name}ทุกเช้าเหมือนเดิม แต่ไม่ให้พิเรลเดินผ่านหน้าบ้าน{name}คนเดียวอีก
      effects: { world: { gods: 1 }, flags: [burned_the_rain_letter] }

# ---------- เก้าอี้ว่าง ----------
- id: elder.era_fleet_empty_chairs
  stage: elder
  weight: 24
  scene: observatory
  when:
    age: [60, 130]
    year: [368, 378]
    location_tag: [arvel_village, ventras, kardin]
  text: |
    นักดาราศาสตร์ของสถาบันขึ้นไปกับตะเกียงเช้าเกือบหมดทั้งหอ หอดูดาวหลวงเหลือคนนับรุ่นเก่าไม่กี่คนกับเก้าอี้ว่างหลายสิบตัว หอส่งประกาศมาตามราง จ้างใครก็ได้ที่นับเลขเป็นให้มานั่งเก้าอี้นับตอนกลางคืน ในถิ่นของ{name}เก้าอี้นับตั้งอยู่บนหลังคาศาลา หันไปทางตะวันออกเฉียงเหนือ มีกรอบไม้สี่เหลี่ยมให้มองผ่าน กับกระดานชนวนหนึ่งแผ่น

    คนที่หอส่งมาคุมชื่อเบอร์ทิน คนนับรุ่นเก่าที่ไม่ได้ขึ้นเรือเพราะเข่าไม่ดี เขานั่งเก้าอี้อีกตัว หันหลังให้ฟ้า จดตัวเลขที่คนนับร้องบอก ไม่เงยหน้าเลยสักครั้ง

    ค่าจ้างดีกว่าค่าเฝ้าโกดังสองเท่า คนแก่ในถิ่นหลายคนนับเลขเก่งกว่าคนหนุ่ม และนอนไม่ค่อยหลับอยู่แล้ว
  choices:
    - id: sit_a_season
      label: รับนั่งเก้าอี้นับหนึ่งฤดู
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ทุกคืน{name}นับดาวในกรอบไม้ ร้องบอกเป็นช่วง ทีละสิบ เบอร์ทินจดตามโดยไม่ถามซ้ำ ตัวเลขคืนนี้ไม่เคยตรงกับเมื่อคืน เบอร์ทินจดทุกตัวเหมือนกัน ช่วงกลางฤดู{name}นับได้เร็วจนเบอร์ทินต้องบอกให้รอ

          สิ้นฤดูเบอร์ทินจ่ายเงินครบ ให้ผ้าห่มขนแกะที่หอส่งมาอีกผืน แล้วถามว่าฤดูหน้าจะมาอีกไหม ถามโดยไม่หันหน้าจากสมุด
        effects: { stats: { INT: 1 }, gold: 4, flags: [sat_the_counting_chair] }
      failure:
        text: |
          ลมบนหลังคาศาลาเย็นกว่าลมข้างล่าง คอของ{name}แข็งตั้งแต่สัปดาห์แรก ตัวเลขช่วงหลังเริ่มสับสน นับซ้ำช่องเดิมสองหน เบอร์ทินจดทุกตัวที่ร้องบอก ไม่ทักว่าผิด

          กลางฤดู{name}ไอจนนับไม่ได้ เบอร์ทินจ่ายเงินตามคืนที่นั่ง ไม่หักสักคืน บอกว่าตัวเลขของ{name}ไม่ได้ผิดไปกว่าของใคร
        effects: { hp: -1, gold: 2, flags: [sat_the_counting_chair] }
    - id: refuse_the_chair
      label: ไม่รับ
      text: |
        ลูกชายคนทำขนมปังรับไปก่อน นั่งได้หกคืนก็เลิก บอกว่าตาลาย คนต่อมาเป็นหญิงม่ายจากท้ายถิ่น นั่งได้ครึ่งเดือน แล้วไม่มาอีกโดยไม่บอกเหตุผล

        กลางหน้าหนาว เก้าอี้นับบนหลังคาศาลาว่าง เบอร์ทินยังขึ้นไปนั่งทุกคืน หันหลังให้ฟ้า กระดานชนวนวางบนเข่า รอคนร้องบอกตัวเลข {name}เห็นหลังเขาจากหน้าต่างบ้านทุกคืนก่อนดับตะเกียง
      effects: { flags: [refused_the_counting_chair] }
    - id: write_zero_every_night
      label: รับนั่งเก้าอี้ แต่ร้องบอกศูนย์ทุกคืนโดยไม่เงยหน้า
      habit: faint_heart
      text: |
        {name}นั่งเก้าอี้นับทั้งฤดู ห่มผ้าสองชั้น ดูแต่หลังมือตัวเอง ทุกช่วงที่ต้องร้องบอก ร้องว่าศูนย์ เบอร์ทินจดศูนย์ลงสมุด ไม่ถาม ไม่ทัก ไม่หันมา

        สิ้นฤดูเขาจ่ายเงินครบ แล้วขอบใจ เขาบอกว่าทั้งหอได้ตัวเลขที่ตรงกันทุกคืนจากถิ่นนี้ถิ่นเดียว
      effects: { gold: 3, alignment: { law: -1 }, flags: [called_zero_every_night] }
    - id: look_where_he_will_not
      label: รับนั่งแทนเบอร์ทิน ดูในที่ที่เขาไม่ยอมดู
      habit: curious
      requires: { trait: curse_brand }
      text: |
        เบอร์ทินขอคนมีตราโดยเฉพาะ เขาจ่ายเพิ่มให้อีกเหรียญหนึ่ง ไม่ได้บอกเหตุผล หลังทุกช่วงที่{name}ร้องบอกตัวเลข เขาถามคำถามที่สอง มีอะไรดูกลับมาไหม {name}ตอบว่าไม่มี เขาจดคำว่าไม่มีลงอีกช่องหนึ่ง

        สิ้นฤดูสมุดของเบอร์ทินมีสองช่อง ช่องตัวเลขไม่มีบรรทัดไหนซ้ำกันเลย ช่องไม่มีเหมือนกันทุกบรรทัด ตอนส่งสมุดกลับหอ เบอร์ทินพับมุมไว้ทุกหน้าที่มีช่องนั้น
      effects: { stats: { INT: 1 }, gold: 5, flags: [counted_for_the_old_counter] }

# ---------- หลังคาบ่อ ----------
- id: elder.era_fleet_roof_over_the_well
  stage: elder
  weight: 24
  when:
    age: [60, 130]
    year: [367, 379]
  text: |
    วิหารของถิ่นมุงหลังคาลานกลางที่เคยเปิดรับฟ้าเสร็จตั้งแต่ปีเรือไม่กลับ ใช้ไม้ที่ชาวบ้านช่วยกันออก กับแรงคนที่ไม่อยากเห็นรอยตอนตั้งตะเกียงเที่ยง ทีนี้ถึงคราวบ่อ

    บ่อกลางถิ่นเปิดรับฟ้ามาตั้งแต่ขุด ธรรมเนียมเก่าว่าบ่อต้องเห็นฟ้า น้ำถึงจะหายใจ บ่อที่ปิดน้ำจะเหม็นเหมือนน้ำในโอ่งลืมล้าง ปัญหาคือตอนเที่ยง ใครชะโงกลงไปตักน้ำจะเห็นรอยลอยอยู่บนผิวน้ำในบ่อ เส้นซีดเส้นเดียวกับบนฟ้า ตักน้ำขึ้นมาแล้วเส้นนั้นไม่ได้ติดถังขึ้นมาด้วย แต่ไม่มีใครอยากชะโงกดู

    คนเฒ่าของถิ่นนัดกันที่ม้านั่งข้างบ่อ คนละหนึ่งเสียง เสียงของ{name}ก็มีค่าเท่าเสียงอื่น และคนที่เหลือรอฟังอยู่
  choices:
    - id: vote_for_the_roof
      label: ยกมือให้มุงหลังคาบ่อ
      text: |
        หลังคาขึ้นเสร็จในสิบวัน วิหารออกค่าไม้ครึ่งหนึ่ง น้ำฤดูแรกมีกลิ่นยางสน ใครต้มชาก็ได้ชากลิ่นสน คนเฒ่าที่ยกมือค้านบ่นทุกเช้าว่าน้ำไม่หายใจ แล้วก็ดื่มต่อ

        เด็กที่เกิดหลังจากนั้นไม่รู้ว่าเคยมีอะไรลอยอยู่ในบ่อตอนเที่ยง ตอนตักน้ำ พวกเขาชะโงกหน้าลงไปเห็นแต่หน้าตัวเอง กับคานหลังคาสีน้ำตาลข้างหลังหัว
      effects: { world: { gods: 1 }, flags: [voted_to_roof_the_well] }
    - id: vote_for_the_open_well
      label: ยกมือให้บ่อเห็นฟ้าตามเดิม
      text: |
        บ่อชนะไปหนึ่งเสียง ตั้งแต่นั้นคนเฒ่าของถิ่นตักน้ำก่อนสายหรือหลังบ่าย ช่วงเที่ยงที่บ่อว่าง เด็กๆ ลงมาตักแทน ชะโงกดูรอยในน้ำ แล้วเอากรวดโยนลงไปให้เส้นนั้นแตกเป็นวง

        น้ำในบ่อยังหวานเหมือนเดิม หญิงแก่คนหนึ่งที่ยกมือให้หลังคาตักน้ำหลังบ่ายทุกวัน วันไหนจำเป็นต้องตักตอนเที่ยง นางหลับตาหย่อนถัง
      effects: { world: { land: 1 }, flags: [voted_for_the_open_well] }
    - id: pay_for_an_awning
      label: ออกเงินทำผ้าใบม้วนเก็บได้ ขึงตอนเที่ยง ม้วนเก็บตอนเย็น
      text: |
        ช่างทำรอกให้หนึ่งชุด ผ้าใบหนึ่งผืน เชือกยาวพอให้คนยืนชักจากม้านั่งข้างบ่อ ทุกคนเห็นด้วย ไม่มีใครตกลงว่าใครจะเป็นคนชัก วันแรก{name}ชักเอง วันที่สองก็ชักเอง

        ตั้งแต่นั้นเสียงรอกเอี๊ยดตอนตะวันตรงหัวกลายเป็นเสียงบอกเที่ยงของถิ่น คนในทุ่งได้ยินแล้ววางจอบ วันที่{name}ป่วยนอนอยู่บ้าน ทั้งถิ่นกินข้าวเที่ยงช้าไปครึ่งชั่วยาม
      effects: { gold: -3, flags: [paid_for_the_well_awning], city: { merit: 1, here: true } }

# ---------- ฟ้าเมื่อก่อน ----------
- id: elder.era_fleet_sky_from_before
  stage: elder
  weight: 24
  scene: classroom
  when:
    age: [60, 130]
    year: [371, 379]
  text: |
    ครูของห้องเรียนในถิ่นมาขอให้{name}ไปวาดฟ้าให้เด็กดู ฟ้าของเมื่อก่อน ก่อนมีรอย เด็กทุกคนวาดฟ้าแบบที่เห็น ดาวเต็มกระดาน กับเส้นพาดเฉียงจากมุมหนึ่งไปอีกมุม วาดง่ายๆ เหมือนวาดภูเขาหลังถิ่น ไม่มีเด็กคนไหนคิดว่าเส้นนั้นเคยไม่มี ครูอยากให้รู้

    {name}ยืนหน้ากระดานดำ ถือชอล์ก วาดดาวคันไถที่ชาวนาใช้ดูฤดูไถได้ก่อน แล้วดาวเรือเจ็ดดวงที่ชี้ทางเหนือ แล้วมือก็หยุดอยู่กลางกระดาน

    เส้นนั้นเคยไม่มี {name}รู้แน่ จำได้แน่ แต่จำไม่ได้ว่าตรงที่ตอนนี้มีเส้นพาดอยู่ เมื่อก่อนมีอะไร มีดาวกี่ดวง หรือมืดเปล่า เด็กสามสิบคนนั่งรอ ชอล์กในมือเริ่มอุ่น
  choices:
    - id: leave_a_blank_strip
      label: วาดดาวทุกดวงที่จำได้ แล้วเว้นแถบกลางกระดานไว้ว่าง
      text: |
        {name}วาดจนชอล์กหมดแท่ง เว้นแถบว่างไว้เฉียงจากมุมหนึ่งไปอีกมุม เด็กคนหนึ่งยกมือถามว่าตรงนั้นคืออะไร {name}บอกว่าตรงนั้นคือที่ที่จำไม่ได้

        เด็กๆ ลอกรูปลงกระดานชนวนของตัวเอง ทุกคนเว้นแถบว่างไว้ตรงที่เดียวกัน ตั้งแต่นั้นห้องเรียนนี้วาดฟ้าเมื่อก่อนแบบนั้นทุกปี ดาวเต็มกระดาน กับแถบว่างเส้นหนึ่ง ครูคนใหม่ที่มาสอนทีหลังเข้าใจว่าเป็นธรรมเนียม
      effects: { stats: { WIS: 1 }, flags: [left_the_old_sky_blank] }
    - id: tell_it_instead
      label: วางชอล์ก เล่าแทนว่าคืนหนึ่งเมื่อก่อนมืดแค่ไหน
      text: |
        {name}เล่าเรื่องคืนที่ต้องเดินกลับบ้านโดยไม่มีตะเกียง มืดจนต้องคลำรั้วทีละหลัก ดาวพอให้เห็นว่าข้างบนอยู่ทางไหน ไม่พอให้เห็นปลายเท้า คนเดินทางกลางคืนต้องร้องเพลงให้คนข้างหน้ารู้ว่ามีคนตามมา

        เด็กๆ ฟังจนเลิกเรียน เด็กคนหนึ่งถามว่าทำไมไม่จุดตะเกียง อีกคนถามว่ามืดแบบนั้นไม่กลัวหรือ {name}ตอบคำถามแรกได้ เย็นนั้นเด็กกลุ่มหนึ่งเดินกลับบ้านพร้อมกัน ร้องเพลงเสียงดังมาตั้งแต่ฟ้ายังสว่าง
      effects: { stats: { CHA: 1 }, flags: [told_the_old_sky] }
    - id: draw_the_line_in
      label: บอกครูตามจริงว่าจำไม่ได้ แล้ววาดเส้นนั้นลงไปด้วย
      text: |
        ครูทำหน้าเหมือนคนได้ของขวัญผิดชิ้น แต่ขอบคุณ {name}วาดดาวที่จำได้ครบ แล้วลากเส้นเฉียงพาดลงไปกลางกระดาน เด็กๆ พอใจ รูปนี้ตรงกับที่พวกเขาวาดกันเอง

        เด็กคนหนึ่งบอกว่าฟ้าเมื่อก่อนกับฟ้าตอนนี้เหมือนกันเลย {name}ไม่เถียง เช็ดชอล์กออกจากมือ ตอนเดินกลับบ้านก้มดูปลายเท้าตลอดทาง เหมือนทุกคนตอนเที่ยง
      effects: { flags: [drew_the_line_into_the_old_sky] }
    - id: bring_the_knotted_cords
      label: ไปค้นเชือกผูกปมที่นับดาวจากหลังคาในปีป้ายเปล่า มาให้เด็กดู
      requires: { flag: counted_from_the_roof }
      text: |
        เชือกสองเส้นยังอยู่ในหีบ {name}เอามาวางบนโต๊ะครู อธิบายว่าปมหนึ่งคือดาวสิบดวง ในช่องเดียวระหว่างปล่องไฟกับสันหลังคาบ้านตรงข้าม เส้นหนึ่งสี่สิบเอ็ดปม อีกเส้นสี่สิบสาม ช่องนั้นตอนนี้มีรอยพาดผ่าน

        คืนนั้นเด็กห้าคนขึ้นหลังคาบ้านตรงข้ามไปนับช่องเดียวกัน ผูกปมกันจนเชือกหมดม้วน เช้าวันรุ่งขึ้นเชือกของเด็กพวกนั้นลากยาวจากโต๊ะครูออกไปถึงประตูห้อง ปลายเชือกยังไม่มีปมสุดท้าย
      effects: { stats: { INT: 1 }, flags: [showed_the_roof_count_cords] }
