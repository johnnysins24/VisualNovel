# ชุด 3a วัยผู้ใหญ่ อายุ 19 ถึง 24: เหตุการณ์ร่วมทุกต้นกำเนิด น้ำหนัก 10
# คนรัก (L16): adult.love_meets ตั้ง partner กับ flag has_partner ข้อความหลังจากนั้นใช้ {partner} และ {p:เขา|เธอ}
# ผู้เล่นเลือกเพศของคนรักเอง คนรักเพศเดียวกันได้ ฉากแต่งงานอยู่ในช่วง 3b
# ห้ามใช้ {father} ในไฟล์นี้ เพราะพ่อของหลายต้นกำเนิดหายไปในสงคราม เด็กวิหารไม่เห็น {mother}

- id: adult.first_room
  stage: adult
  weight: 10
  when:
    age: [19, 21]
    not_flags: [job_farmer, job_bough_crafter, job_wardens, job_navy, job_fort_priest]
  text: |
    ห้องแรกที่{name}จ่ายค่าเช่าเองอยู่ชั้นบนสุดของตึกไม้สามชั้น เพดานเอียงตามหลังคา ยืนตรงได้แค่ครึ่งห้อง หน้าต่างบานเดียวมองเห็นปล่องควันของบ้านอื่นสิบกว่าปล่อง แม่เช่าเก็บค่าเช่าทุกวันแรกของเดือน ก่อนไก่ขัน

    คนเช่าคนก่อนทิ้งของไว้ใต้พื้นกระดานที่หลวม กล่องสังกะสีใบหนึ่ง ข้างในเป็นจดหมายสิบเจ็ดฉบับ ปิดผนึกทุกฉบับ จ่าหน้าถึงคนคนเดียวกัน ที่อยู่เดียวกัน ในเมืองเดียวกันนี้ ไม่มีฉบับไหนได้ส่งออกไป แม่เช่าบอกว่าคนเช่าคนนั้นตายในห้องนี้เมื่อหน้าหนาวก่อน ไม่มีญาติมาเอาของ
  choices:
    - id: deliver_them
      label: เอาจดหมายทั้งกล่องไปส่งตามที่อยู่
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ที่อยู่บนซองเป็นร้านซักผ้าในย่านท่าน้ำ คนที่ชื่อตรงกับหน้าซองเป็นหญิงแก่ผมขาวทั้งหัว นางรับกล่องไปแล้วนั่งลงบนขั้นบันไดหน้าร้าน เปิดฉบับแรกอ่านตรงนั้น {name}จะเดินกลับ นางเรียกไว้ ขอให้นั่งอยู่ด้วยจนอ่านจบฉบับที่สาม

          นางบอกว่าคนเขียนเคยเป็นคู่หมั้นนางเมื่อห้าสิบปีก่อน หายไปก่อนวันแต่งงานหนึ่งเดือน นางคิดมาตลอดว่าเขาหนีไปเพราะไม่อยากแต่ง จดหมายฉบับที่สามบอกว่าเขาหนีไปเพราะติดหนี้หนูท่า แล้วกลับมาไม่ได้อีกเลย ทั้งที่อยู่ห่างกันแค่สี่ตรอก
        effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [delivered_old_letters] }
      failure:
        text: |
          ที่อยู่บนซองเป็นร้านซักผ้าในย่านท่าน้ำ ร้านนั้นปิดไปนานแล้ว ประตูตอกไม้กากบาท {name}ถามคนในตรอกสามคน ได้คำตอบสามแบบ คนหนึ่งว่าย้ายไปอยู่กับลูกสาวทางเหนือ คนหนึ่งว่าตายไปตั้งแต่หน้าแล้ง อีกคนไม่เคยได้ยินชื่อนี้

          {name}เอากล่องสังกะสีกลับมาวางไว้ใต้พื้นกระดานที่เดิม หลายคืนต่อมานอนฟังเสียงพื้นกระดานลั่นเวลามีคนเดินบันได แล้วนึกถึงคนที่นอนห้องนี้ก่อน ว่าเขาฟังเสียงเดียวกันนี้แล้วนึกถึงใคร
        effects: { stats: { WIS: 1 }, flags: [kept_old_letters] }
    - id: read_them
      label: แกะอ่านทีละฉบับตอนกลางคืน
      text: |
        {name}อ่านคืนละฉบับ ใช้เวลาสิบเจ็ดคืน ผู้ชายคนนั้นเขียนถึงผู้หญิงคนเดียวมาห้าสิบปี เล่าเรื่องงาน เรื่องอากาศ เรื่องแมวที่มาขออาหารที่หน้าต่าง ฉบับหลังๆ ลายมือสั่นจนอ่านยาก ฉบับสุดท้ายเขียนว่าพรุ่งนี้จะเอาไปส่งเองทั้งหมด

        ทุกคืนที่อ่าน {name}ได้ยินเสียงอะไรสักอย่างมาข่วนที่หน้าต่าง คืนที่สิบแปด{name}เปิดหน้าต่าง แมวลายส้มแก่ตัวหนึ่งเดินเข้ามาในห้อง นอนลงตรงมุมที่เตียงเก่าเคยตั้ง
      effects: { stats: { INT: 1 }, flags: [read_old_letters, has_old_cat] }
    - id: sell_the_tin
      label: เอาจดหมายไปเผา ขายกล่องสังกะสี
      text: |
        กล่องสังกะสีขายได้หนึ่งเหรียญที่ร้านรับซื้อเศษโลหะ จดหมายสิบเจ็ดฉบับไหม้หมดในเตาของแม่เช่าในเวลาไม่ถึงต้มน้ำหนึ่งกา แม่เช่าบอกว่าดีแล้ว ห้องนี้จะได้เป็นของคนที่มีชีวิตอยู่เสียที

        คืนนั้นพื้นกระดานแผ่นที่หลวมเงียบไปทั้งคืน ตอนเช้า{name}ก็ยังตอกตะปูมันให้แน่นอยู่ดี
      effects: { gold: 1, stats: { CON: 1 }, flags: [burned_old_letters] }

- id: adult.love_meets
  stage: adult
  weight: 10
  when:
    age: [19, 24]
    not_flags: [has_partner]
  text: |
    ปีนั้น{name}เริ่มสังเกตว่าตัวเองนับวัน ไม่ได้นับวันจ่ายค่าแรง ไม่ได้นับวันหยุด นับวันที่ได้เจอคนคนหนึ่ง และวันที่ไม่ได้เจอ

    คนแรกขายขนมปังที่ร้านหัวมุมทางไปทำงาน ทุกเช้าทอนเงินเกินให้{name}เศษเหรียญหนึ่ง ผิดไปทางที่{name}ได้เปรียบทุกครั้ง แล้วทำเป็นไม่รู้ อีกคนซ่อมรองเท้าอยู่ใต้ชายคาข้างโรงเตี๊ยม จำได้ว่ารองเท้าทุกคู่ของ{name}สึกตรงไหน ทั้งที่{name}ไปซ่อมแค่สองครั้ง
  choices:
    - id: the_baker
      label: วันหนึ่งคืนเหรียญที่ทอนผิดมาทั้งหมด ที่เก็บไว้ในกระป๋อง
      text: |
        {name}เก็บเศษเหรียญที่ได้เกินมาไว้ในกระป๋องตั้งแต่วันแรก เช้าวันนั้นวางกระป๋องทั้งใบลงบนโต๊ะไม้หน้าร้านขนมปัง หญิงสาวหลังโต๊ะนับเศษเหรียญในกระป๋องได้สี่สิบสามเหรียญ แล้วเงยหน้าขึ้นมา หน้าแดงไปถึงหู

        นางบอกว่าชื่อ{partner} ขนมปังเช้าพรุ่งนี้นางจะไม่ทอนผิดแล้ว นางจะเอามาส่งให้ถึงที่ทำงานเลย
      effects: { partner: { gender: f }, stats: { CHA: 1 }, flags: [has_partner, partner_baker] }
    - id: the_cobbler
      label: เอารองเท้าคู่ที่ยังไม่สึกไปให้เขาซ่อม
      text: |
        ชายหนุ่มใต้ชายคาพลิกรองเท้าคู่นั้นดูทุกด้าน หาตรงที่สึกไม่เจอ เพราะไม่มี เขาวางรองเท้าลงบนตัก ถามว่าคู่นี้จะให้ซ่อมตรงไหน {name}ตอบไม่ได้ เขาหัวเราะออกมาทีหนึ่ง เสียงดังจนคนในโรงเตี๊ยมชะโงกหน้าออกมาดู

        เขาบอกว่าชื่อ{partner} รองเท้าคู่นี้เขาจะตอกพื้นให้หนาขึ้นอีกชั้น ไม่คิดเงิน แต่ต้องมารับเย็นพรุ่งนี้ ตอนเขาปิดร้าน
      effects: { partner: { gender: m }, stats: { CHA: 1 }, flags: [has_partner, partner_cobbler] }
    - id: not_yet
      label: ยังไม่ใช่ปีนี้ เปลี่ยนทางเดินไปทำงาน
      text: |
        {name}เปลี่ยนไปเดินอีกทาง ทางที่ไกลกว่าเดิมสองตรอก ไม่ผ่านร้านขนมปังหัวมุม ไม่ผ่านชายคาข้างโรงเตี๊ยม เงินเดือนนั้นไม่พอค่าเช่าห้อง จะพาใครไปกินข้าวสักมื้อก็ยังไม่ได้

        เดือนแรก{name}ยังนับวันอยู่ เดือนที่สามเลิกนับ ทางที่ไกลกว่าเดิมสองตรอกกลายเป็นทางเดิม
      effects: { gold: 1, stats: { STR: 1 }, flags: [chose_no_love_yet] }

- id: adult.love_family
  stage: adult
  weight: 10
  when:
    age: [20, 24]
    flags: [has_partner]
    not_flags: [race_tiefling]
  text: |
    {partner}พา{name}ไปกินข้าวเย็นที่บ้านครอบครัวของ{p:เขา|เธอ}เป็นครั้งแรก บ้านหลังเล็ก โต๊ะตัวยาว คนนั่งรอบโต๊ะสิบคน ทุกคนรู้ชื่อ{name}ก่อนที่{name}จะเปิดปาก

    ป้าคนโตของ{partner}เป็นคนเลี้ยง{p:เขา|เธอ}มาตั้งแต่เด็ก นางวางช้อนลงตั้งแต่น้ำแกงยังไม่หมดชามแรก ถามว่างานของ{name}เดือนหนึ่งได้กี่เหรียญ ถ้าวันหนึ่งงานนั้นทำให้{name}ไม่กลับบ้าน ใครจะเลี้ยงลูก
  choices:
    - id: answer_straight
      label: บอกตัวเลขจริง แล้วบอกว่าเก็บเงินได้เดือนละเท่าไร
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}บอกตัวเลขที่ได้ ตัวเลขที่จ่ายค่าเช่า ตัวเลขที่เหลือ แล้วบอกว่ากระป๋องเหรียญใต้เตียงมีอยู่เท่าไร ทุกคนรอบโต๊ะเงียบฟัง ป้าคนโตนับนิ้วตามไปด้วยโดยไม่รู้ตัว

          นางไม่ได้บอกว่าพอ นางตักน้ำแกงเติมให้{name}อีกชาม ก่อนกลับ{partner}กระซิบว่าป้าไม่เคยเติมน้ำแกงให้ใครที่มาบ้านครั้งแรก
        effects: { stats: { CHA: 1 }, flags: [partner_family_warm] }
      failure:
        text: |
          ตัวเลขที่{name}บอกน้อยกว่าที่ป้าคนโตคิดไว้ นางไม่ถามต่อ ตักน้ำแกงกินจนหมดชาม แล้วลุกไปล้างชามคนเดียวในครัว คนรอบโต๊ะเปลี่ยนไปคุยเรื่องฝน

          คืนนั้น{partner}เดินมาส่ง{name}ถึงหัวถนน บอกว่าป้าเป็นแบบนี้กับทุกคน อีกสามปีป้าจะเลิกถาม ถ้า{name}ยังมาที่บ้านนี้อยู่
        effects: { stats: { WIS: 1 }, flags: [partner_family_cold] }
    - id: let_partner_speak
      label: หันไปมอง{partner} ให้{p:เขา|เธอ}เป็นคนตอบ
      text: |
        {partner}วางช้อนลงเหมือนป้า แล้วบอกว่าเรื่องใครจะเลี้ยงลูก {p:เขา|เธอ}ตอบได้เอง เพราะ{p:เขา|เธอ}ทำงานเหมือนกัน และไม่เคยคิดว่าจะให้ใครเลี้ยงใคร ป้าคนโตหัวเราะออกมาเป็นครั้งแรกตั้งแต่เริ่มกินข้าว

        นางบอกว่าเด็กคนนี้นางเลี้ยงมากับมือ พูดแบบนี้มาตั้งแต่เจ็ดขวบ ถ้า{name}ทนเด็กคนนี้ได้ ก็มากินข้าวที่บ้านได้ทุกเย็นวันพักงาน
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [partner_family_warm] }
    - id: bring_gift
      label: วางห่อของขวัญที่เตรียมมาบนโต๊ะ แทนคำตอบ
      requires: { min_gold: 3 }
      text: |
        ห่อของขวัญเป็นผ้าคลุมไหล่ขนแกะเนื้อดี ราคาเท่าค่าแรงหนึ่งสัปดาห์ ป้าคนโตแกะออกดูต่อหน้าทุกคน ลูบเนื้อผ้าสองครั้ง แล้วพับเก็บใส่ห่อตามเดิม

        นางบอกว่าผ้าดี แต่นางถามเรื่องเงินเดือน ไม่ได้ถามเรื่องผ้า คนรอบโต๊ะหัวเราะ {partner}หัวเราะด้วย หน้าตาเหมือนโล่งใจที่มีคนหัวเราะ หน้าหนาวปีนั้นป้าคนโตใส่ผ้าคลุมผืนนั้นไปตลาดทุกวัน
      effects: { gold: -3, stats: { CHA: 1 }, flags: [partner_family_warm] }

- id: adult.love_family_horned
  stage: adult
  weight: 10
  when:
    age: [20, 24]
    flags: [has_partner]
    trait: demon_mark
  text: |
    {partner}พา{name}ไปกินข้าวเย็นที่บ้านครอบครัวของ{p:เขา|เธอ}เป็นครั้งแรก {p:เขา|เธอ}บอกทุกคนในบ้านเรื่องเขาบนหัว{name}ไปก่อนแล้วตั้งแต่สามวันก่อน บอกครบทุกอย่าง ไม่ได้ปิดไว้สักเรื่อง

    ที่หน้าประตู แม่ของ{partner}ยืนรอรับอยู่คนเดียว ข้างหลังนางโต๊ะตัวยาวมีจานวางไว้สิบใบ เก้าอี้มีคนนั่งห้าตัว ปู่ของ{partner}นั่งหัวโต๊ะ ตาไม่ละไปจากหัวของ{name}ตั้งแต่ประตูเปิด ในมือกำตะเกียงแขวนรูปเล็กที่ห้อยคออยู่
  choices:
    - id: sit_and_eat
      label: นั่งลงกินข้าวตามปกติ คุยกับคนที่ยังนั่งอยู่
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}นั่งลงที่ว่างข้างแม่ของ{partner} ถามเรื่องผักในแปลงหลังบ้าน เรื่องราคาเกลือ เรื่องหลังคาที่รั่ว ไม่พูดเรื่องเขาสักคำ คนที่ยังนั่งอยู่ค่อยๆ ตอบยาวขึ้นทีละคำ

          ก่อนน้ำแกงชามที่สองหมด น้องชายของ{partner}ที่หายไปตอนแรกกลับมานั่งที่ ปู่ยังนั่งกำตะเกียงอยู่หัวโต๊ะจนจบมื้อ แต่ตอนส่งออกประตู แกเป็นคนยื่นตะเกียงกระดาษให้{name}ถือกลับบ้าน เพราะทางมืด
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [partner_family_warm] }
      failure:
        text: |
          {name}นั่งลงที่ว่างข้างแม่ของ{partner} ชวนคุยเรื่องอะไรก็ได้ ทุกคำตอบสั้นลงทุกครั้ง ตอนน้ำแกงเหลือครึ่งชาม ปู่ลุกจากหัวโต๊ะ เดินออกไปทางประตูหลังบ้าน ไม่กลับมาอีก

          {partner}เดินมาส่ง{name}ถึงหัวถนน ไม่เอ่ยถึงปู่ พูดแต่ว่าแม่ชอบ{name} แม่บอกตอนล้างชาม
        effects: { stats: { WIS: 1 }, flags: [partner_family_cold] }
    - id: speak_to_grandfather
      label: เดินไปหัวโต๊ะ บอกปู่ว่าจะให้จับเขาดูก็ได้
      text: |
        ปู่ของ{partner}ไม่ได้จับ แกเอาตะเกียงแขวนรูปเล็กออกจากคอ ยื่นมันออกมาข้างหน้าจนเกือบแตะหัวของ{name} รอดูว่าจะเกิดอะไรขึ้น ไม่มีอะไรเกิดขึ้น ตะเกียงรูปเล็กก็ยังเป็นตะเกียงรูปเล็ก

        แกสวมตะเกียงกลับเข้าคอ ใช้เวลานาน แล้วชี้เก้าอี้ว่างข้างตัวเอง ทั้งมื้อแกไม่ได้พูดกับ{name}สักคำ แต่ทั้งมื้อ{name}นั่งอยู่ข้างแก
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [partner_family_warm, sat_by_lamp_grandfather] }
    - id: leave_early
      label: บอก{partner}ว่าจะกลับ ไม่อยากให้มื้อนี้พังเพราะตัวเอง
      text: |
        {name}ไม่ได้ก้าวเข้าประตู บอกแม่ของ{partner}ว่าขอบคุณที่ทำอาหารรอ แล้วหันหลังเดินกลับ {partner}วิ่งตามมาทันที่หัวถนน ถามว่าทำไม {name}รู้คำตอบดี แต่พูดมันออกมาไม่ได้

        สองคนนั่งกินขนมปังเก่ากับน้ำในห้องเช่าของ{name}คืนนั้น {partner}ไม่ได้กลับไปกินข้าวเย็นที่บ้านของ{p:เขา|เธอ}อีกตลอดฤดู
      effects: { stats: { WIS: 1 }, flags: [partner_family_cold, partner_left_family_table] }

- id: adult.friend_returns
  stage: adult
  weight: 10
  when:
    age: [19, 23]
    flags: [friend_left]
  text: |
    เพื่อนที่ไปทำงานไกลกลับมาโดยไม่ได้ส่งข่าวก่อน มาเคาะประตูตอนค่ำ ตัวสูงขึ้น ผอมลง ผมสั้นเกรียนแบบคนที่ทำงานใกล้เครื่องจักร มือซ้ายเหลือแค่นิ้วโป้งกับนิ้วชี้ อีกสามนิ้วหายไปตั้งแต่ข้อแรก

    เพื่อนยิ้มเหมือนเดิมทุกอย่าง บอกว่ากลับมาเพราะงานที่โน่นไม่ต้องการคนมือเหลือสองนิ้ว เงินที่เก็บมาทั้งหมดพอซื้อเกวียนมือสองหนึ่งเล่ม แล้วถามว่าที่นี่มีที่ให้นอนสักคืนไหม
  choices:
    - id: rematch
      label: พาเพื่อนไปที่หินหลักปากทาง ไปแก้มือตามที่สัญญาไว้
      requires: { flag: friend_owes_a_race }
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          รอยมีดที่เพื่อนขีดไว้บนหินหลักยังอยู่ ตะไคร่ขึ้นตามรอยเป็นเส้นเขียว สองคนออกวิ่งจากหน้าประตูบ้านพร้อมกันในความมืดเหมือนคืนก่อนเพื่อนจากไป {name}แตะหินหลักก่อนอีกครั้ง ก่อนครึ่งช่วงแขนเท่าเดิม

          เพื่อนนั่งลงพิงหินหอบหายใจ หัวเราะ บอกว่าที่โน่นไม่มีใครวิ่งแข่ง ทุกคนเหนื่อยเกินกว่าจะวิ่ง แล้วขีดเส้นที่สองลงบนหิน ข้างเส้นแรก บอกว่าคราวหน้าไม่ให้แล้ว
        effects: { stats: { DEX: 1 }, flags: [friend_back, friend_owes_two_races] }
      failure:
        text: |
          สองคนออกวิ่งพร้อมกัน แต่ครั้งนี้เพื่อนแตะหินหลักก่อน ก่อนหลายช่วงแขน แล้วยืนรอ{name}อยู่ข้างหินเหมือนเมื่อก่อน หายใจไม่หอบด้วยซ้ำ

          เพื่อนบอกว่าที่โน่นต้องวิ่งขึ้นบันไดเหล็กวันละร้อยรอบ แข้งขาไม่เหมือนเดิมแล้ว แล้วเอามีดขีดทับเส้นเก่าบนหินเป็นกากบาท บอกว่าตอนนี้หายกันแล้ว
        effects: { stats: { CON: 1 }, flags: [friend_back] }
    - id: show_the_stone
      label: เอาหินก้อนกลมที่เพื่อนให้ไว้ออกมาให้ดู
      requires: { flag: friend_stone }
      text: |
        หินก้อนกลมอยู่ในกระเป๋าเสื้อของ{name}มาตั้งแต่วันนั้น ผิวลื่นขึ้นจนส่องแสงตะเกียงได้ เพื่อนรับไปหนีบไว้ระหว่างสองนิ้วที่เหลือ ถือนานจนหินอุ่น

        เพื่อนบอกว่าของที่{name}ให้ไปวันนั้นยังอยู่ ติดตัวไปทุกที่ เชือกที่ร้อยขาดไปสองหน ต้องเปลี่ยนเส้นใหม่ แล้วล้วงมันออกมาจากคอเสื้อให้ดู
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [friend_back] }
    - id: give_a_bed
      label: ให้นอนที่ห้อง จนกว่าจะหางานใหม่ได้
      requires: { min_gold: 1 }
      text: |
        เพื่อนนอนบนเสื่อข้างเตียงของ{name}อยู่สองเดือน ทุกเช้าออกไปถามงานทุกร้านในถิ่น ร้านไหนเห็นมือซ้ายก็บอกว่าไม่มีงาน บางร้านบอกก่อนเพื่อนจะเปิดปาก

        เดือนที่สาม เพื่อนได้งานขับเกวียนส่งของ เพราะขับเกวียนใช้มือขวามากกว่า คืนสุดท้ายก่อนย้ายออก เพื่อนทิ้งเหรียญไว้ใต้หมอนของ{name}สามเหรียญ เช้านั้น{name}แอบยัดคืนใส่ย่ามของเพื่อนก่อนเพื่อนจะออกจากห้อง
      effects: { gold: -1, alignment: { moral: 1 }, stats: { CON: 1 }, flags: [friend_back, friend_owes_a_bed] }
    - id: little_time
      label: ให้นอนคืนเดียว พรุ่งนี้มีงานเช้า
      text: |
        เพื่อนนอนคืนเดียวตามที่ขอ ตื่นก่อน{name}แล้วไปก่อน{name}ตื่น ทิ้งรอยเสื่อพับไว้มุมห้องอย่างเรียบร้อย

        เดือนต่อมา{name}ได้ยินว่าเพื่อนได้งานขับเกวียนส่งของในถิ่นถัดไป ไม่ได้ส่งข่าวมาบอกเอง
      effects: { stats: { WIS: 1 }, flags: [friend_back, friend_drifted] }

- id: adult.home_festival
  stage: adult
  weight: 10
  when:
    age: [19, 24]
    not_flags: [origin_marked_foundling, origin_marked_hidden]
  text: |
    งานประจำปีของถิ่นเกิดตรงกับวันพักงานพอดี {name}เดินทางกลับบ้านเป็นครั้งแรกตั้งแต่ออกมาทำงาน กลับไปถึงตอนบ่าย ทุกอย่างเล็กลงหมด ประตูบ้านเตี้ยลง ทางเดินแคบลง ขั้นบันไดหน้าบ้านที่เคยต้องปีนทีละขั้น ตอนนี้ก้าวเดียวข้ามได้สองขั้น

    {mother}ทำอาหารที่{name}ชอบที่สุดตอนเจ็ดขวบไว้รอเต็มโต๊ะ ทำเผื่อไว้มากเหมือนทุกคนในบ้านยังเป็นเด็กกินจุ แล้วถามคำถามแรก งานที่ทำอยู่ดีไหม กินอิ่มไหม มีใครดูแลไหม
  choices:
    - id: tell_true
      label: เล่าเรื่องงานตามจริงทุกอย่าง ทั้งเรื่องดีและเรื่องไม่ดี
      text: |
        {name}เล่าตามจริง เรื่องค่าแรง เรื่องนาย เรื่องคืนที่นอนไม่หลับ {mother}ฟังโดยไม่ขัดสักคำ มือนวดแป้งค้างไว้บนโต๊ะจน{name}เล่าจบ

        นางไม่ได้ให้คำแนะนำ นางบอกว่า ตอนที่นางอายุเท่า{name} นางก็นอนไม่หลับแบบนั้น หลับได้อีกทีตอนที่มี{name} แล้วตักอาหารเติมลงจานอีกทัพพี
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [told_mother_truth] }
    - id: tell_good_only
      label: เล่าแต่เรื่องดี เรื่องไม่ดีเก็บไว้
      text: |
        {name}เล่าแต่เรื่องที่ได้ค่าแรงเพิ่ม เรื่องที่นายชม เรื่องห้องเช่าที่มีหน้าต่าง {mother}ยิ้มฟังจนจบ แล้วบอกว่าดีแล้ว ดีแล้ว พูดคำนี้ซ้ำสามรอบ

        คืนนั้น{name}ได้ยิน{mother}เดินไปมาในครัวจนดึก เช้าวันต่อมาบนโต๊ะมีห่อเสบียงวางรอไว้ ใหญ่พอกินได้ครึ่งเดือน ข้างในมียาแก้ไข้ห่อกระดาษอยู่สามห่อ
      effects: { stats: { CHA: 1 }, flags: [mother_packed_food] }
    - id: give_money
      label: วางเงินที่เก็บมาครึ่งหนึ่งไว้ใต้ถ้วยชาของ{mother}
      text: |
        {name}วางเหรียญไว้ใต้ถ้วยชาตอนที่{mother}ไปเอาของหวานในครัว เป็นเงินที่เก็บมาสามเดือน ทั้งงานประจำปี{mother}ไม่ได้พูดถึงเงินนั้นเลยสักครั้ง

        ตอนเดินทางกลับ {name}ล้วงกระเป๋าห่อเสบียงเจอเหรียญทั้งหมดอยู่ในนั้น ครบทุกเหรียญ บวกเพิ่มมาอีกหนึ่งเหรียญ
      effects: { gold: 1, alignment: { moral: 1 }, flags: [mother_returned_money] }

- id: adult.belek_account
  stage: adult
  weight: 10
  when:
    age: [19, 24]
  text: |
    เสมียนวิหารเบเลคมาตั้งโต๊ะในตลาดทุกวันแรกของเดือน ปีนี้มีป้ายใหม่ เปิดบัญชีออมกับวิหาร ฝากห้าเหรียญ ห้าปีได้คืนเจ็ดเหรียญ หรือกู้แปดเหรียญวันนี้ จ่ายคืนเดือนละครึ่งเหรียญ สองปีจบ ไม่ต้องมีคนค้ำ ไม่ต้องมีที่ดิน

    คนต่อแถวหน้าโต๊ะยาวไปถึงร้านขายปลา ส่วนใหญ่มาขอกู้ เสมียนยื่นสัญญาให้ทุกคนอ่านก่อนลงชื่อ สัญญาสามหน้า ตัวหนังสือเล็ก ไม่มีใครอ่าน
  choices:
    - id: save
      label: ฝากห้าเหรียญ เปิดบัญชีออม
      requires: { min_gold: 5 }
      text: |
        {name}ฝากห้าเหรียญ เสมียนเขียนชื่อลงสมุดบัญชีเล่มหนาด้วยลายมือที่ไม่มีวันผิด ยื่นแผ่นไม้ประทับตราเบเลคให้หนึ่งแผ่น บอกว่าห้าปีให้นับจากวันนี้ ถ้าแผ่นไม้หาย เงินไม่หาย เพราะเบเลคจำได้ทุกชื่อ

        แผ่นไม้อยู่ในกล่องใต้เตียงของ{name}ข้างกระป๋องเหรียญ หนักกว่าเหรียญห้าเหรียญที่หายไป
      effects: { gold: -5, alignment: { law: 1 }, reputation: { belek_bank: 1 }, flags: [belek_savings] }
    - id: borrow
      label: กู้แปดเหรียญ ไปซื้อของที่ใช้ทำงานได้ดีกว่าเดิม
      text: |
        {name}ลงชื่อในสัญญาโดยไม่ได้อ่านเหมือนคนอื่นในแถว เสมียนนับเหรียญแปดเหรียญวางบนโต๊ะ เรียงเป็นแถวตรงเหมือนทหาร แล้วบอกว่าเดือนแรกเริ่มจ่ายเดือนหน้า วันแรกของเดือน ที่โต๊ะนี้ ตลาดนี้

        ของที่{name}ซื้อด้วยเงินนั้นดีกว่าของเดิมทุกอย่าง ใช้แล้วงานเร็วขึ้นจริง ทุกวันแรกของเดือนต่อจากนั้น{name}ตื่นเช้ากว่าวันอื่น
      effects: { gold: 8, stats: { STR: 1 }, alignment: { law: 1 }, flags: [belek_loan] }
    - id: read_contract
      label: ขอสัญญามาอ่านทั้งสามหน้า ก่อนจะตัดสินใจ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          บรรทัดสุดท้ายของหน้าสามเขียนว่า ถ้าผู้กู้จ่ายช้าเกินสิบวัน ดอกที่ยังไม่ได้จ่ายทั้งหมดจะกลายเป็นเงินต้นใหม่ ส่วนบัญชีออม บรรทัดสุดท้ายเขียนว่าวิหารเอาเงินออมไปให้คนอื่นกู้ต่อได้ ถ้าคนกู้หนี เงินออมก็หายตามสัดส่วน

          {name}คืนสัญญาให้เสมียน เสมียนรับคืนด้วยสีหน้าเดิม บอกว่าทุกบรรทัดเขียนไว้ให้อ่าน คนที่อ่านมีน้อย แต่ไม่ใช่ความผิดของวิหาร {name}เดินกลับโดยไม่ได้ฝากและไม่ได้กู้ คนในแถวสองคนเดินตามมาถามว่าบรรทัดสุดท้ายเขียนว่าอะไร
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [read_belek_account_terms] }
      failure:
        text: |
          ตัวหนังสือในสัญญาเล็กจน{name}ต้องหรี่ตา อ่านได้ครึ่งหน้าแรก คนต่อแถวข้างหลังก็เริ่มดัน เสมียนบอกว่าถ้าจะอ่านให้ไปอ่านข้างๆ แล้วไปต่อแถวใหม่

          {name}ถือสัญญาไปอ่านข้างร้านขายปลาจนตลาดวาย อ่านจบสองหน้าครึ่ง แล้วตัดสินใจว่าไม่เอาอะไรทั้งนั้น ครึ่งหน้าสุดท้ายเขียนว่าอะไร {name}ไม่เคยได้รู้
        effects: { stats: { WIS: 1 }, flags: [half_read_belek_terms] }

- id: adult.airship_ride
  stage: adult
  weight: 10
  when:
    age: [19, 24]
    year: [298, 340]
    not_flags: [job_navy]
  text: |
    เรือเหาะขนผู้โดยสารลำใหม่ของบริษัทเดินเรือรับคนขึ้นที่หอท่าทุกเช้าวันพักงาน ล่องเหนือเมืองหนึ่งรอบแล้วกลับมาลงที่เดิม ค่าตั๋วสิบห้าเหรียญ เท่าค่าแรงสิบวัน คนส่วนใหญ่ในแถวเก็บเงินมาหลายปีเพื่อขึ้นครั้งเดียวในชีวิต แต่แถวก็ยังยาวลงมาถึงถนน

    ถุงลมของเรือเหาะลำนั้นเรืองฟ้าจางๆ ทั้งที่เป็นเวลากลางวัน คนเฝ้าหอท่าบอกว่าถ้าไม่มีเงินค่าตั๋ว ขึ้นไปช่วยลูกเรือดึงเชือกผูกเรือได้ ไม่ได้นั่ง แต่ได้ขึ้น
  choices:
    - id: buy_ticket
      label: จ่ายสิบห้าเหรียญ ขึ้นไปนั่งริมกราบ
      requires: { min_gold: 15 }
      text: |
        ตอนเรือหลุดจากหอท่า ท้องของ{name}หล่นวูบลงไปก่อนตัว แล้วเมืองทั้งเมืองก็อยู่ใต้เท้า หลังคาทุกหลังมีจานรับดาวหงายรับฟ้า เรียงกันเป็นแถว คนเดินถนนตัวเล็กเท่ามด ปล่องโรงกลั่นพ่นควันขึ้นมาไม่ถึงท้องเรือ

        {name}มองหาหลังคาห้องเช่าของตัวเองจนเจอ เล็กกว่าเล็บนิ้วก้อย มองจนเรือหมุนกลับ คืนนั้นฝันว่าตัวเองยังลอยอยู่ ตื่นมาเตียงแข็งกว่าทุกคืน
      effects: { gold: -15, stats: { WIS: 1 }, flags: [rode_airship] }
    - id: work_the_ropes
      label: ขึ้นไปช่วยลูกเรือดึงเชือก แลกกับที่ยืน
      check: { stat: STR, dc: 13 }
      success:
        text: |
          ลูกเรือให้{name}จับเชือกเส้นหัวเรือ ดึงตามจังหวะนกหวีดของนายท้าย เรือลอยขึ้นจากหอท่าช้าๆ เชือกในมือหนักขึ้นจนแขนสั่น แล้วเบาลงทันทีตอนเรือพ้นหลังคาตึกสุดท้าย

          ตลอดรอบ{name}ยืนอยู่ที่หัวเรือ ที่ที่ผู้โดยสารไม่ได้ยืน เห็นเมืองก่อนใคร ลูกเรือแก่คนหนึ่งบอกว่าเรือลำนี้ขาดคนดึงเชือกทุกเช้าวันพักงาน ถ้าอยากมาก็มาได้ ได้ค่าแรงครึ่งเหรียญ
        effects: { stats: { STR: 1 }, gold: 1, flags: [rode_airship, airship_rope_hand] }
      failure:
        text: |
          เชือกเส้นหัวเรือกระชากตอนลมกระโชกครั้งแรก มือ{name}ไหม้ไปทั้งสองฝ่ามือ ลูกเรือแก่ต้องคว้าเชือกต่อแทน แล้วให้{name}ไปนั่งพักบนกองเชือกท้ายเรือ

          {name}ได้ขึ้นเรือเหาะ ได้เห็นเมืองจากข้างบนจากท้ายเรือ ผ่านกองเชือก ฝ่ามือทั้งสองข้างพองจนกำอะไรไม่ได้ไปสามวัน
        effects: { hp: -1, flags: [rode_airship] }
    - id: watch_below
      label: เก็บเงินไว้ ยืนดูเรือลอยขึ้นจากถนน
      text: |
        {name}ยืนดูจากถนนหน้าหอท่า เรือลอยขึ้นช้าๆ เงาของถุงลมคลุมถนนทั้งสายจนมืดไปครู่หนึ่ง เด็กๆ วิ่งตามเงาไปจนสุดถนน

        เงินค่าตั๋วที่ไม่ได้จ่าย ต่อมากลายเป็นรองเท้าใหม่หนึ่งคู่ {name}ใส่คู่นั้นไปอีกสองปี
      effects: { gold: 1, stats: { CON: 1 }, flags: [watched_airship_rise] }

- id: adult.doom_preacher
  stage: adult
  weight: 10
  when:
    age: [19, 24]
  text: |
    นักเทศน์ของศาสนจักรตะเกียงยืนบนลังไม้กลางลานตลาด เสียงดังข้ามหัวคนไปถึงร้านสุดท้าย เขาบอกว่าดาวดวงใหม่ไม่ได้มาเพราะเทพส่งมา มันมาเพราะจอมมารใกล้ตื่น เด็กมีเขาที่เกิดถี่ขึ้นทุกปีคือคนส่งข่าวของมัน ใครเลี้ยงเด็กแบบนั้นไว้ในบ้าน คือคนเปิดประตูรอมัน

    ข้างลังไม้ เด็กหญิงคนหนึ่งยืนขายไข่ไก่ ผ้าโพกหัวผืนเล็กเลื่อนหลุดตอนลมพัด ตอเขาเล็กๆ สองตอโผล่ออกมา คนรอบลังไม้ขยับห่างออกจากนางไปคนละก้าว คนที่ยืนใกล้ที่สุดหยิบไข่ในกระจาดของนางขึ้นมาฟองหนึ่ง
  choices:
    - id: buy_all_eggs
      label: เดินไปซื้อไข่ทั้งกระจาด แล้วพานางออกจากลาน
      requires: { min_gold: 2 }
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}เดินไปยืนระหว่างเด็กหญิงกับคนที่ถือไข่ ถามราคาไข่ทั้งกระจาดเสียงดังพอให้คนรอบๆ ได้ยิน เหมือนถามราคาไข่ธรรมดาในตลาดธรรมดา คนที่ถือไข่ค่อยๆ วางมันกลับลงในกระจาด

          {name}จ่ายเงิน อุ้มกระจาด เดินพาเด็กหญิงออกจากลานไปทางตรอกหลังตลาด นักเทศน์ยังเทศน์ต่อ เสียงดังเท่าเดิม แต่คนครึ่งลานหันกลับไปซื้อของต่อ
        effects: { gold: -2, stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [walked_egg_girl_out] }
      failure:
        text: |
          {name}ถามราคาไข่ทั้งกระจาด คนที่ถือไข่ไม่วางลง เขาขว้างมันใส่หัวเด็กหญิง ฟองที่สองตามมาจากอีกทาง ฟองที่สามแตกบนแขนของ{name}ที่ยกขึ้นบัง

          {name}อุ้มเด็กหญิงวิ่งออกจากลาน ไข่แตกเปื้อนเสื้อทั้งตัว กระจาดกับไข่ที่เหลือทิ้งไว้กลางลาน นักเทศน์ไม่หยุดเทศน์ เขาชี้ตามหลัง{name}ไปจนพ้นมุมตรอก
        effects: { hp: -1, alignment: { moral: 1 }, flags: [walked_egg_girl_out, lamp_preacher_saw_you] }
    - id: heckle
      label: ตะโกนถามนักเทศน์ว่าจอมมารจะตื่นวันไหน จะได้ไปรอรับ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          คนในลานหัวเราะก่อนนักเทศน์จะตอบ {name}ถามต่อว่า ถ้าเด็กมีเขาเป็นคนส่งข่าว ข่าวที่นางส่งคือไข่ไก่ฟองละเหรียญทองแดงหรือ คนหัวเราะดังขึ้นอีก คนที่ถือไข่วางมันกลับลงกระจาดเพื่อหัวเราะได้ถนัด

          นักเทศน์ลงจากลังไม้ไปเทศน์ต่อที่ลานอื่น เด็กหญิงเก็บผ้าโพกหัวพันกลับจนแน่น แล้วหายเข้าไปในฝูงคน
        effects: { stats: { INT: 1 }, alignment: { law: -1, moral: 1 }, reputation: { lamp_church: -1 }, flags: [mocked_doom_preacher] }
      failure:
        text: |
          นักเทศน์ตอบว่าวันที่จอมมารตื่นคือวันที่คนแบบ{name}หัวเราะเยาะผู้รับใช้แสงตะเกียงกลางตลาด ไม่มีใครในลานหัวเราะ คนที่ยืนรอบ{name}ขยับออกห่างไปครึ่งก้าว

          ระหว่างนั้นเด็กหญิงคว้ากระจาดวิ่งหนีไปได้ ไข่ตกแตกไปครึ่งกระจาด นักเทศน์จำหน้า{name}ไว้แล้ว เขามองตามจน{name}เดินออกจากลาน
        effects: { alignment: { law: -1 }, reputation: { lamp_church: -1 }, flags: [lamp_preacher_saw_you] }
    - id: stand_beside_her
      label: ถอดผ้าโพกหัวของตัวเองออก ไปยืนขายไข่ข้างนาง
      requires: { trait: demon_mark }
      text: |
        {name}ปลดผ้าที่คลุมหัวออก แล้วเดินไปยืนข้างกระจาดไข่ ให้ทุกคนในลานเห็นว่าหัวของ{name}เป็นแบบไหน คนที่ถือไข่ยืนนิ่ง มองหัวของ{name} มองหัวของเด็กหญิง แล้วมองไข่ในมือตัวเอง

        เขาวางไข่ลงในกระจาด หยิบเหรียญทองแดงจากกระเป๋าออกมาหนึ่งเหรียญ วางไว้ข้างๆ แล้วเดินไป นักเทศน์ชี้นิ้วมาที่{name} เทศน์เรื่อง{name}ต่ออีกครึ่งชั่วโมง ตลอดครึ่งชั่วโมงนั้นเด็กหญิงขายไข่หมดกระจาด
      effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, reputation: { lamp_church: -1 }, flags: [stood_with_egg_girl, on_lamp_list] }
    - id: look_away
      label: เดินผ่านไป ไม่ใช่เรื่องของตัวเอง
      text: |
        {name}เดินผ่านลานไปทางร้านขายผ้า ได้ยินเสียงไข่แตกตามหลังมาสองฟอง แล้วเสียงคนหัวเราะ แล้วเสียงนักเทศน์ดังขึ้นอีกเหมือนมีคนเติมน้ำมันตะเกียง

        เย็นนั้นตอนเดินกลับผ่านลานเดิม ตรงข้างลังไม้มีเปลือกไข่แตกกองอยู่กองหนึ่ง กับผ้าโพกหัวผืนเล็กเปื้อนไข่แดง ไม่มีใครเก็บ
      effects: { alignment: { moral: -1 }, flags: [walked_past_egg_girl] }
