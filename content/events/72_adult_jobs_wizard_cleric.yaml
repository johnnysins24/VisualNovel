# ชุด 3a วัยผู้ใหญ่ อายุ 19 ถึง 24: เหตุการณ์ประจำงานสายนักเวทและนักบวช งานละ 1 เรื่อง
# ข้อความนักบวชใช้ {god} เพราะนักบวชในเกมรับใช้ได้หลายองค์ อย่าเขียนพิธีที่เป็นของเทพองค์เดียว
# ผิวแก้วกับเสียงหึ่งเป็นผลข้างเคียงของน้ำค้างดาวตามคัมภีร์ ห้ามบอกว่ามาจากอะไร

- id: adult.job_artificer_hand
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_artificer]
  text: |
    ชายแก่คนนั้นมาที่ร้านตอนฮาลเดนไม่อยู่ แขนซ้ายตั้งแต่ศอกลงไปเป็นขอเหล็กกับสายหนัง แบบที่ราชสำนักแจกทหารเกณฑ์ชั้นผู้น้อยหลังสงครามถ่าน ขอเหล็กอันนั้นสึกจนปลายทู่ สายหนังขาดแล้วต่อด้วยเชือกป่าน

    เขาวางเหรียญบนโต๊ะสี่เหรียญ บอกว่ามีเท่านี้ หลานสาวเพิ่งหัดเดิน ชอบเดินจับมือ แต่หลานจับขอไม่ได้ เขาอยากได้มือที่มีนิ้ว นิ้วที่งอได้ แค่สองนิ้วก็พอ

    บนชั้นหลังร้านมีกล่องจดหมายของเจ้าของโรงงานทอผ้าวางรออยู่ สั่งขอเหล็กราคาถูกยี่สิบอัน สำหรับคนงานที่เสียมือในเครื่องทอเดือนนี้ จ่ายดี จ่ายก่อน ค่าขอเหล็กหักจากค่าแรงของคนงานเอง
  choices:
    - id: build_fingers
      label: ทำมือที่มีนิ้วให้เขา คิดแค่ค่าของ
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}ทำอยู่สามคืน ใช้เฟืองทองเหลืองเล็กเท่าเมล็ดถั่วสิบสองตัว กับหลอดน้ำค้างดาวหลอดที่เล็กที่สุดที่ร้านมี นิ้วสองนิ้วงอได้เมื่อเขาเกร็งกล้ามที่ต้นแขน คลายได้เมื่อเขาหายใจออก ค่าเฟืองกับหลอดน้ำค้างดาวรวมแล้วห้าเหรียญ ชายแก่มีสี่ อีกเหรียญ{name}ออกเอง

          วันที่สี่ ชายแก่มารับมือพร้อมหลานสาว เด็กยืนจ้องนิ้วเหล็กสองนิ้วตาไม่กะพริบ แล้วเอื้อมมือไปจับ นิ้วเหล็กงอลงมาโอบมือเด็กไว้เบาๆ ชายแก่หันหน้าหนีไปทางหน้าต่าง ไม่หันกลับมาจนเดินออกจากร้าน
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, gold: -1, flags: [built_veteran_hand] }
      failure:
        text: |
          นิ้วสองนิ้วงอลงได้ แต่ไม่ยอมคลาย {name}แก้สามรอบ เปลี่ยนลวดขดสองรอบ นิ้วก็ยังกำค้างอยู่อย่างนั้นทุกครั้งที่เขาเกร็งแขน ต้องเอามืออีกข้างง้างออก

          ชายแก่รับไปทั้งอย่างนั้น บอกว่าดีกว่าขอ อย่างน้อยหลานก็ได้จับนิ้ว ส่วนเรื่องปล่อย เขาจะปล่อยเอง ค่าเฟืองกับลวดที่{name}ซื้อมาตกห้าเหรียญ แต่{name}คืนเหรียญของเขาให้ทั้งสี่เหรียญ เขาวางกลับไว้บนโต๊ะสามเหรียญก่อนออกไป
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, gold: -2, flags: [built_stuck_hand] }
    - id: factory_order
      label: ทำขอเหล็กยี่สิบอันให้โรงทอผ้าก่อน ให้เขากลับมาเดือนหน้า
      text: |
        ขอเหล็กยี่สิบอันใช้เวลาแค่สองวัน ตัดเหล็กแผ่นเดียวกัน ดัดเข้าแบบเดียวกัน ตอกหมุดเหมือนกันหมด ค่าจ้างที่ได้มากกว่าที่ร้านได้ทั้งเดือนที่แล้ว ฮาลเดนกลับมานับเงินแล้วบอกว่าลูกมือคนนี้ใช้ได้

        เดือนหน้าชายแก่ไม่กลับมา {name}ได้ยินจากคนส่งของว่าเขาไปร้านช่างอีกร้านที่ทำแขนถูกกว่า ส่วนคนงานโรงทอผ้าที่ได้ขอเหล็กของร้าน{name}ไป เดินผ่านหน้าร้านทุกเช้า บางคนยกขอขึ้นทักทาย
      effects: { gold: 8, alignment: { moral: -1 }, flags: [made_factory_hooks] }
    - id: golem_gears
      label: ถอดเฟืองดีๆ จากหุ่นยามเก่าหลังร้านมาทำมือให้เขา
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          หุ่นยามเก่าตัวนั้นนอนอยู่หลังร้านมาตั้งแต่ก่อน{name}จะเข้าเป็นลูกมือ เฟืองข้อมือของมันเป็นเหล็กกล้าคนแคระ ทำดีกว่าที่ร้านจะซื้อไหว {name}ถอดออกมาครบทุกตัวโดยไม่ไปแตะหลอดคำสั่งในอกมัน แล้วต่อเข้ากับมือใหม่

          มือที่ได้มีนิ้วครบห้านิ้ว งอได้ทุกข้อ ชายแก่ลองจับถ้วยน้ำบนโต๊ะร้าน ยกขึ้นดื่มได้โดยไม่หก แล้ววางลงช้าๆ ฮาลเดนกลับมาเห็นหุ่นยามที่ไม่มีข้อมือ บ่นอยู่ครึ่งวัน แล้วถามว่า{name}ต่อเฟืองชุดนั้นยังไงให้นิ้วก้อยงอได้
        effects: { stats: { DEX: 1 }, alignment: { moral: 1 }, flags: [built_veteran_hand] }
      failure:
        text: |
          ตอนถอดเฟืองชิ้นสุดท้าย ไขควงของ{name}ไปโดนหลอดคำสั่งในอกหุ่นยาม คำสั่งสุดท้ายที่ยังค้างอยู่ในหลอดคือห้ามใครแตะของในร้านโดยไม่จ่ายเงิน มันลุกขึ้นทั้งที่ไม่มีข้อมือ แล้วเอาแขนทู่ๆ กวาด{name}ไปชนชั้นวางของ

          ฮาลเดนกลับมาถึงทันเห็น เขาถอดหลอดคำสั่งออกด้วยมือเปล่าในครั้งเดียว ใบหน้าเรียบเหมือนดึงไม้ขีดออกจากกล่อง แล้วนั่งลงพันผ้าให้หัว{name}ที่แตก บอกว่าเรื่องนี้เขาเคยทำมาก่อนตอนอายุเท่า{name} หัวแตกตรงเดียวกัน
        effects: { hp: -2, stats: { CON: 1 }, flags: [woke_the_golem] }

- id: adult.job_researcher_circle
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_researcher]
    # ทีฟลิ่งไม่ได้ยินเสียงหึ่ง (ความลับในคัมภีร์) นักวิจัยที่ซ่อนเขาจึงไม่มาถึงฉากนี้ ฉบับของคนมีเขาไว้ช่วง 3b
    not_flags: [race_tiefling]
  text: |
    นักวิจัยรุ่นพี่ชื่อเซเลน คอร์ดิส หลานของอาจารย์โอเดล คอร์ดิส ผู้ค้นพบน้ำค้างดาว ทำงานอยู่ห้องข้างๆ ห้องของ{name}ใต้หลังคาตึกตะวันตก เธอไม่เคยปิดประตู ไม่เคยกินข้าวเที่ยง และไม่เคยถามใครเรื่องงานที่ทำอยู่

    คืนหนึ่งเธอมายืนที่ประตูห้อง{name} ถือเทียนเล่มเดียว บอกว่ามีคนกลุ่มหนึ่งนั่งอ่านหนังสือกันในห้องเก็บแผนที่ชั้นบนสุดทุกคืนวันว่าง ไม่ได้อ่านออกเสียง นั่งฟังเฉยๆ ฟังเสียงที่ดังลงมาจากจานรับดาวบนหลังคา

    สถาบันแบ่งเป็นสองฝ่ายมาหลายปี ฝ่ายหนึ่งอยากกลั่นน้ำค้างดาวให้ได้มากขึ้น อีกฝ่ายอยากรู้ว่าแสงที่กลั่นนั้นมาจากไหน ฝ่ายแรกมีเงินทุน ฝ่ายหลังมีห้องเก็บแผนที่ชั้นบนสุด
  choices:
    - id: go_listen
      label: ตามเธอขึ้นไปที่ห้องเก็บแผนที่
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ในห้องมีคนนั่งอยู่เจ็ดคน ไม่มีใครทักกัน ทุกคนนั่งพิงผนัง หลับตา {name}นั่งลงข้างเซเลน ฟังเสียงหึ่งต่ำๆ ที่ลงมาตามท่อทองเหลืองจากจานบนหลังคา ฟังจนเสียงนั้นแตกออกเป็นสองเสียง สามเสียง แล้วกลายเป็นจังหวะที่คล้ายคนนับเลขในภาษาที่ไม่มีใครพูดแล้ว

          ตอนสาง เซเลนถามว่าได้ยินอะไร {name}ตอบตามจริง เธอจดลงกระดาษ แล้วยื่นให้ดูว่าเมื่อคืนเธอจดไว้แบบเดียวกันทุกตัวอักษร
        effects: { stats: { WIS: 1 }, world: { star: 1 }, reputation: { star_listeners: 1 }, flags: [joined_listening_circle] }
      failure:
        text: |
          เสียงหึ่งดังขึ้นทุกครั้งที่{name}หายใจเข้า ดังจนกลบเสียงหัวใจตัวเอง แล้วก็มีอะไรอุ่นๆ ไหลลงมาที่ริมฝีปาก เป็นเลือดกำเดา ไหลจากรูจมูกทั้งสองข้าง หยดลงบนพื้นไม้เป็นจุดๆ ตามจังหวะเสียงนั้น

          เซเลนพาลงมาส่งที่ห้อง บอกว่าครั้งแรกของเธอก็เป็นแบบนี้ คืนนั้น{name}ฝันถึงห้องที่ไม่มีมุม ตื่นมาจำได้แค่ว่าในฝันนับเลขได้ถึงเจ็ดพันกว่า แล้วนับต่อไม่ได้เพราะเลขที่เหลือยังไม่มีชื่อ
        effects: { hp: -2, world: { star: 1 }, reputation: { star_listeners: 1 }, flags: [joined_listening_circle, first_nosebleed_adult] }
    - id: report_circle
      label: เอาเรื่องนี้ไปบอกอาจารย์ใหญ่ฝ่ายกลั่น
      text: |
        อาจารย์ใหญ่ฟังจบแล้วขอบใจ ไม่ได้ส่งใครไปจับ ไม่ได้ห้ามใคร สามวันต่อมาห้องเก็บแผนที่ชั้นบนสุดมีกุญแจใหม่ กับป้ายเขียนว่าห้องนี้เก็บแผนที่ ไม่ใช่ห้องนั่งเล่น ช่างของสถาบันมาถอดท่อทองเหลืองจากจานรับดาวออกไปทั้งท่อ

        เซเลนยังไม่ปิดประตูห้อง ยังไม่กินข้าวเที่ยง แต่ตั้งแต่นั้นมาเธอไม่เคยยืนที่ประตูห้อง{name}อีก ส่วนเงินทุนปีหน้าของ{name}ได้เพิ่มขึ้นหนึ่งในสี่ ใบแจ้งเงินทุนไม่เขียนเหตุผลไว้สักบรรทัด
      effects: { alignment: { law: 1 }, reputation: { royal_institute: 1, star_listeners: -1 }, gold: 3, flags: [reported_listening_circle] }
    - id: stay_with_formula
      label: บอกว่าไม่ว่าง แล้วกลับไปทำสูตรกลั่นของตัวเองต่อ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          สูตรที่{name}ทำค้างอยู่เป็นวิธีเก็บแสงดาวในโหลแก้วให้นานขึ้นอีกครึ่งคืน คืนนั้นเซเลนเดินขึ้นบันไดไปคนเดียว {name}นั่งทำงานจนตะเกียงหมดน้ำมัน แล้วทำต่อด้วยแสงจากโหลแก้วที่เก็บไว้เอง

          สิ้นเดือน สูตรนั้นใช้ได้ อาจารย์ฝ่ายกลั่นเอาไปทดลองในโรงกลั่นริมแม่น้ำ แล้วจ่ายรางวัลให้{name}สี่เหรียญ ชื่อของ{name}อยู่บรรทัดที่สามในใบรายงาน ต่อจากชื่ออาจารย์สองคนที่ไม่เคยเห็นโหลแก้วใบนั้น
        effects: { stats: { INT: 1 }, reputation: { royal_institute: 1, distillers: 1 }, gold: 4, flags: [improved_distilling] }
      failure:
        text: |
          สูตรนั้นไม่ได้ผลคืนนั้น ไม่ได้ผลคืนต่อมา และไม่ได้ผลจนสิ้นเดือน แสงในโหลแก้วรั่วออกไปทุกครั้งตอนตีสาม ตรงเวลาเดียวกันทุกคืน ไม่ว่า{name}จะปิดฝาด้วยอะไร

          คืนที่สามสิบ {name}นั่งเฝ้าโหลจนตีสาม เห็นแสงในโหลไหลขึ้นไปตามผนังแก้ว ไปทางเพดาน ไปทางห้องเก็บแผนที่ชั้นบนสุด ตอนเช้าเซเลนเดินผ่านหน้าห้อง เห็นโหลเปล่าบนโต๊ะ เธอไม่ถามอะไร
        effects: { stats: { WIS: 1 }, world: { star: 1 }, flags: [light_leaks_upward] }

- id: adult.job_hedge_doctor_glass
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_hedge_doctor]
  text: |
    คนไข้คืนนั้นเป็นคนงานโรงกลั่นชื่อทาเมส อายุมากกว่า{name}ไม่กี่ปี เขาพันแขนขวามาด้วยผ้าหลายชั้น แกะออกช้าๆ ใต้ผ้าตั้งแต่ข้อมือถึงศอก ผิวหนังใสเป็นแก้ว มองเห็นเส้นเลือดข้างใต้ และมีแสงสีฟ้าจางๆ เต้นอยู่ตามจังหวะชีพจร

    เขาบอกว่าเริ่มจากจุดเท่าเล็บเมื่อต้นปี เดือนนี้ลามเร็วขึ้น หมอของสมาคมโรงกลั่นจ่ายเงินห้าเหรียญให้ทุกคนที่มาแจ้งเรื่องผิวแก้ว แล้วคนที่ไปแจ้งก็ไม่ได้กลับมาทำงานอีก ห้องเช่าของพวกเขามีคนอื่นย้ายเข้ามาภายในเดือนเดียว

    พูดถึงตรงนั้น ทาเมสหยุด เอียงหูฟังอะไรบางอย่าง แล้วบอกว่าพรุ่งนี้ฝนจะตกตอนบ่าย ฟ้าข้างนอกหน้าต่างยังโปร่ง ไม่มีเมฆสักก้อน
  choices:
    - id: cut_it_out
      label: เผามีดให้ร้อน แล้วฝานผิวแก้วออก
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ผิวแก้วหลุดออกมาเป็นแผ่นบางๆ เหมือนน้ำแข็งบนผิวบ่อตอนเช้าหน้าหนาว ใต้นั้นเป็นเนื้อแดงปกติ เลือดออกปกติ {name}ฝานจนหมดทุกแผ่น พันแผลด้วยผ้าต้มสะอาด ทาเมสกัดผ้าขี้ริ้วไว้ในปากทั้งคืน ไม่ร้องสักเสียง

          สิบวันต่อมาเขากลับมาให้ดูแผล แผลปิดเป็นแผลเป็นธรรมดา {name}กดดูทุกนิ้วรอบแผล ยังไม่เจอจุดใสสักจุด ทาเมสบอกว่าจะกลับมาให้ดูอีกตอนสิ้นฤดู แล้วก็ไม่ได้มาอีก ส่วนบ่ายวันที่เขาบอกไว้ ฝนตกจริง ตกตอนบ่ายตรงเวลา
        effects: { stats: { DEX: 1 }, alignment: { moral: 1 }, flags: [cut_glass_out] }
      failure:
        text: |
          ผิวแก้วหลุดออกมาเป็นแผ่น แต่ใต้แผ่นแรกเป็นแก้วอีกชั้น ใต้ชั้นที่สองเป็นแก้วอีกชั้น {name}ฝานลึกลงไปจนถึงกระดูกข้อมือ กระดูกตรงนั้นก็ใสเหมือนกัน ตอนนั้นทาเมสคว้ามือ{name}ไว้ บอกว่าพอแล้ว

          {name}พันแผลให้ ให้ยาแก้ปวดที่มีทั้งหมด ไม่คิดเงิน ทาเมสไม่ได้กลับมาอีก บ่ายวันต่อมาฝนตก ตกตรงเวลาที่เขาบอกไว้
        effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, gold: -2, flags: [glass_went_deep] }
    - id: send_to_guild
      label: พาเขาไปหาหมอของสมาคมโรงกลั่น รับเงินห้าเหรียญ
      text: |
        หมอของสมาคมใส่เสื้อคลุมสีนวลสะอาดผิดย่าน เขารับตัวทาเมสไป ยื่นเหรียญห้าเหรียญให้{name} บอกว่าคนที่พามาได้ส่วนนี้ ส่วนของคนไข้สมาคมจะดูแลเอง ทาเมสหันมามอง{name}ตอนเดินเข้าประตูด้านใน มือข้างที่ยังเป็นผิวหนังยกขึ้นโบกครึ่งหนึ่ง แล้วลดลง

        ฝนตกตอนบ่ายวันต่อมา {name}นั่งฟังเสียงฝนบนหลังคาร้านปลาเค็ม เหรียญห้าเหรียญยังวางอยู่บนโต๊ะตรงที่วางไว้เมื่อคืน
      effects: { gold: 5, alignment: { moral: -1 }, reputation: { distillers: 1 }, flags: [sold_glass_case] }
    - id: listen_to_him
      label: ให้เขานอนพักที่นี่คืนหนึ่ง แล้วนั่งฟังที่เขาพูด
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          ทาเมสพูดในไข้ทั้งคืน เรื่องฝนพรุ่งนี้ เรื่องเรือขนเกลือที่จะล่มในอีกสามวัน เรื่องเด็กชื่อลินที่จะเกิดหลังร้านปลาเค็มในฤดูหน้า {name}จดไว้ทุกเรื่องในกระดาษห่อยา บางประโยคเขาพูดเหมือนกำลังตอบใครบางคนที่{name}ไม่ได้ยิน

          ฝนตกตอนบ่าย สามวันต่อมาเรือขนเกลือล่มที่ปากแม่น้ำ ไม่มีใครตาย ฤดูต่อมา เด็กหญิงชื่อลินเกิดหลังร้านปลาเค็ม {name}เก็บกระดาษห่อยาแผ่นนั้นไว้ในหีบ เหลืออีกสามบรรทัดที่ยังไม่เกิด
        effects: { stats: { WIS: 1 }, world: { star: 1 }, flags: [kept_glass_prophecy] }
      failure:
        text: |
          ทาเมสพูดในไข้ทั้งคืน แต่{name}ฟังไม่ออกสักประโยค เป็นเสียงพูดเร็วๆ ซ้อนกันหลายเสียง ทั้งที่เขามีปากเดียว ตอนตีสาม เสียงนั้นหยุดลงพร้อมกัน ทาเมสลืมตาขึ้น แล้วถามว่า{name}เป็นใคร

          ตอนเช้าเขาจำ{name}ได้แล้ว จำทุกอย่างได้ จ่ายค่ารักษาเป็นเหรียญสองเหรียญ แล้วกลับไปทำงานที่โรงกลั่น ผ้าพันแขนขวาหนาขึ้นอีกชั้น
        effects: { stats: { CON: 1 }, gold: 2, flags: [heard_glass_voices] }

- id: adult.job_city_priest_crossroads
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_city_priest]
  text: |
    หญิงคนนั้นมาที่วิหารก่อนสาง ก่อนคนมาขอพรคนแรกจะมาถึง ห่อผ้าในอ้อมแขนห่อแน่นจนเห็นแค่จมูกเด็ก นางขอให้{name}อวยพรเด็กในนามของ{god} อวยพรให้เดินทางปลอดภัย

    {name}รู้ว่าแปลว่าอะไร ในหมู่บ้านรอบเมืองยังมีคนเชื่อว่าเด็กมีเขาต้องเอาไปวางไว้ที่ทางสามแพร่งก่อนเด็กจะอายุครบเจ็ดวัน ใครผ่านมาเก็บไปก็เป็นของคนนั้น ไม่มีใครผ่านก็เป็นของทาง

    หญิงคนนั้นไม่ได้ร้องไห้ นางบอกว่าสามีไม่รู้ เขาไปทำงานโรงสีเมืองอื่น กลับมาอีกสองวัน ถ้าเขากลับมาเห็นเด็ก ทั้งบ้านจะไม่มีใครได้อยู่ในหมู่บ้านอีก
  choices:
    - id: bless_and_let_go
      label: อวยพรให้ตามที่นางขอ
      text: |
        {name}อวยพรตามธรรมเนียม ให้เดินทางปลอดภัย ให้ทางมีเมตตา ให้คนที่ผ่านมามีใจ หญิงคนนั้นก้มรับพร แล้วเดินออกจากวิหารไปทางประตูตะวันออก ตรงไปทางทางสามแพร่ง ไม่หันกลับมา

        ตอนบ่าย{name}เดินไปที่ทางสามแพร่งนั้น ไม่มีห่อผ้า ไม่มีรอยอะไรบนพื้น ไม่รู้ว่ามีคนผ่านมาเก็บ หรือไม่มีใครผ่านมา คืนนั้นตอนสวดก่อนนอน {name}สวดซ้ำบทเดิมสามรอบ รอบที่สามจำบทสวดไม่ได้ครึ่งหนึ่ง
      effects: { alignment: { law: 1, moral: -1 }, flags: [blessed_crossroads_child] }
    - id: carry_to_isel
      label: รับเด็กไว้เอง แล้วเดินไปส่งที่วิหารอีเซล ที่นั่นรับเด็กกำพร้า
      text: |
        {name}บอกหญิงคนนั้นว่าทางสามแพร่งเดินมาถึงวิหารแล้ว ให้นางวางเด็กลงตรงนี้แทน นางยืนนิ่งจนเปลวตะเกียงบนแท่นวูบไปสามครั้ง แล้ววางห่อผ้าลงบนแท่นหินหน้า{god} หันหลังเดินออกไปเร็วจนเกือบวิ่ง

        เด็กเป็นผู้ชาย เขาสั้นๆ คู่หนึ่งเพิ่งโผล่พ้นผม {name}อุ้มเดินไปวิหารอีเซลที่ใกล้ที่สุดครึ่งวัน แม่ชีที่ประตูรับเด็กไปโดยไม่ถามว่ามาจากไหน ถามแค่ว่าเด็กเกิดวันอะไร {name}ไม่รู้ แม่ชีเลยตั้งชื่อเด็กตามแสงตอนบ่ายวันนั้น
      effects: { alignment: { moral: 1 }, stats: { CON: 1 }, flags: [carried_horned_baby] }
    - id: talk_her_round
      label: ชวนนางนั่งลง แล้วคุยจนกว่านางจะเปลี่ยนใจ
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}รินน้ำร้อนให้นางถ้วยหนึ่ง แล้วนั่งฟัง นางเล่าเรื่องสามี เรื่องแม่สามี เรื่องหมู่บ้าน ตะวันขึ้นจนส่องเข้ามาถึงแท่นหิน {name}เล่าเรื่องเด็กมีเขาที่วิหารเคยรับเลี้ยง โตมาเป็นหมอตำแยบ้าง ช่างไม้บ้าง เป็นคนทำขนมปังที่ทุกคนในเมืองซื้อกินโดยไม่รู้

          นางอุ้มเด็กกลับบ้าน ไม่ได้บอกว่าจะทำอะไรต่อ สองวันต่อมานางกลับมาพร้อมสามี ชายร่างใหญ่มือหยาบ เขายืนดูลูกตัวเองอยู่ที่ประตูวิหารนาน แล้วขอให้{name}อวยพรลูกอีกครั้ง คราวนี้อวยพรให้โต
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [saved_crossroads_family] }
      failure:
        text: |
          นางฟังอยู่ครู่หนึ่ง แล้วลุกขึ้น บอกว่านักบวชไม่มีผัว ไม่มีแม่ผัว ไม่มีหมู่บ้านที่จะไล่ใครออก พูดอะไรก็ง่าย นางเดินออกไปทางประตูตะวันออกก่อน{name}จะหาคำตอบได้

          {name}วิ่งตามไปถึงทางสามแพร่ง ทันเห็นนางวางห่อผ้าลงบนหินหลักตรงกลางทาง แล้วเดินกลับไปอีกทาง {name}อุ้มห่อผ้ากลับวิหาร เด็กร้องจ้าตลอดทาง เสียงดังจนหมาทั้งตลาดเห่ารับ
        effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [carried_horned_baby] }
    - id: show_her_own
      label: ถอดผ้าคลุมหัว ให้นางเห็นว่าเด็กแบบนี้โตมาเป็นอะไรได้
      requires: { trait: demon_mark }
      text: |
        {name}ปลดผ้าคลุมหัวออกช้าๆ ให้นางเห็นเขาบนหัวในแสงเทียน หญิงคนนั้นถอยไปครึ่งก้าว แล้วหยุด มองหัวของ{name} มองเสื้อนักบวช มองแท่นหินของ{god} แล้วกลับมามองห่อผ้าในอ้อมแขนตัวเอง

        นางไม่เอ่ยถึงทางสามแพร่งอีก นางถามว่าตอนเด็ก{name}ร้องไห้บ่อยไหม ถามว่าเขาโตเร็วไหม ถามว่าหนาวหัวไหมเวลาไม่ใส่ผ้าคลุม ตะวันขึ้นแล้วนางก็ยังถามอยู่ ถามจนเด็กในอ้อมแขนหลับ
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [saved_crossroads_family] }

- id: adult.job_road_healer_fever
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_road_healer]
  text: |
    หมู่บ้านที่เจ็ดบนเส้นทางเกวียนปิดประตูรั้วไม่ให้ใครเข้า คนเฝ้าประตูตะโกนข้ามรั้วมาว่าไข้จุดระบาดทั้งหมู่บ้าน ตายไปแล้วหกคน แต่พอเห็นเสื้อนักบวช เขาก็เปิดให้

    ผู้ใหญ่บ้านมีแผนแล้ว บ้านไหนมีคนไข้ ตอกแผ่นไม้ปิดประตูหน้าต่าง ส่งข้าวส่งน้ำทางช่องหลังคา จนกว่าคนข้างในจะหายหรือเลิกเรียก บ้านสามหลังตอกไปแล้ว อีกสองหลังรอ{name}อวยพรก่อนตอก

    จากบ้านหลังหนึ่งที่ตอกแล้ว มีเสียงเด็กเคาะแผ่นไม้ เคาะเป็นจังหวะเดิมซ้ำๆ
  choices:
    - id: go_inside
      label: ให้แกะแผ่นไม้ออก แล้วเข้าไปดูแลคนข้างในเอง
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}อยู่ในบ้านสามหลังนั้นสิบสี่วัน เดินหลังนี้ไปหลังนั้น ต้มน้ำ เช็ดตัว ป้อนน้ำข้าว ต้มผ้าทุกผืนในหมู่บ้าน ไข้จับ{name}วันที่ห้า แต่ไม่หนัก จุดแดงขึ้นตามแขนไม่กี่จุดแล้วจางไป

          คนในบ้านสามหลังรอดเก้าคน ตายสองคน ผู้ใหญ่บ้านไม่ตอกบ้านอีกสองหลังที่รออยู่ ตอนออกจากหมู่บ้าน เด็กที่เคาะแผ่นไม้วิ่งตามลามาจนถึงหลักเขต เคาะจังหวะเดิมบนสีข้างลาสามครั้ง
        effects: { stats: { CON: 1 }, alignment: { moral: 1 }, hp: -1, flags: [broke_the_boards] }
      failure:
        text: |
          ไข้จับ{name}วันที่สาม จับหนักกว่าทุกคนในบ้าน {name}นอนอยู่บนพื้นบ้านหลังเดียวกับคนที่มารักษา ไม่รู้ว่าวันไหนเป็นวันไหน ตื่นมาครั้งหนึ่งเห็นเด็กคนที่เคาะแผ่นไม้นั่งเช็ดหน้าผากให้ด้วยผ้าชุบน้ำ

          {name}ลุกขึ้นได้วันที่สิบเอ็ด เสื้อนักบวชหลวมโพรกจนต้องเอาเชือกคาดเอว ในบ้านสามหลังรอดเจ็ดคน ผู้ใหญ่บ้านไม่ตอกบ้านหลังไหนอีกตั้งแต่วันที่{name}ล้มลง เพราะไม่มีใครกล้าตอกบ้านที่มีนักบวชนอนอยู่
        effects: { hp: -4, stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [broke_the_boards, survived_spot_fever] }
    - id: bless_the_boards
      label: อวยพรบ้านสองหลังตามที่ขอ แล้วตั้งหม้อต้มยาส่งทางช่องหลังคา
      text: |
        {name}อวยพรบ้านสองหลังที่รอตอก ยืนดูคนตอกแผ่นไม้ แล้วไปตั้งหม้อต้มยาใหญ่กลางลาน ส่งยาลงทางช่องหลังคาทุกหลังวันละสามรอบ ร้องเรียกชื่อคนข้างในทีละคนให้ตอบ คนที่ตอบได้ก็ยังอยู่

        ไข้หยุดลามที่บ้านห้าหลังนั้น ไม่มีบ้านที่หกต้องตอก วันที่ยี่สิบผู้ใหญ่บ้านแกะแผ่นไม้ออก คนรอดสิบเอ็ดคน ตายเจ็ด เสียงเคาะแผ่นไม้ในบ้านหลังแรกหยุดไปตั้งแต่วันที่สิบสอง
      effects: { stats: { INT: 1 }, alignment: { law: 1 }, flags: [blessed_the_boards] }
    - id: pray_all_night
      label: คุกเข่าสวดต่อ{god}กลางลานทั้งคืน ขอให้ไข้ผ่านหมู่บ้านไป
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          {name}สวดจนเสียงแหบ จนเข่าชาไปทั้งสองข้าง ใกล้สาง ลมหยุดพัด เสียงเคาะแผ่นไม้หยุด หมาในหมู่บ้านหยุดเห่าพร้อมกัน แล้วความร้อนที่ฝ่ามือของ{name}ก็ไหลออกไปเหมือนน้ำไหลออกจากโอ่งร้าว

          วันนั้นไม่มีใครในหมู่บ้านไข้ขึ้นใหม่ วันต่อมาก็ไม่มี คนไข้ในบ้านที่ตอกแผ่นไม้ไว้ไข้ลดลงทีละคน ผู้ใหญ่บ้านให้คนแกะแผ่นไม้ออกเอง แล้วมาคุกเข่าข้าง{name}กลางลาน ถามว่า{god}ชอบของไหว้แบบไหน
        effects: { stats: { WIS: 1 }, world: { gods: 1 }, flags: [prayer_lifted_fever] }
      failure:
        text: |
          {name}สวดทั้งคืนจนสาง ไม่มีอะไรตอบ ลมยังพัด หมายังเห่า เสียงเคาะแผ่นไม้ยังดังเป็นจังหวะเดิม ตอนตะวันขึ้นเสียงนั้นช้าลง ช้าลง แล้วหยุด

          {name}ลุกขึ้น เข่าแตกทั้งสองข้าง เดินไปบอกผู้ใหญ่บ้านให้แกะแผ่นไม้บ้านหลังนั้นออก แล้วเข้าไปทำสิ่งเดียวที่ยังทำได้ อยู่ในบ้านหลังนั้นอีกเก้าวันจนไข้ผ่านไปเอง
        effects: { hp: -2, stats: { CON: 1 }, flags: [first_prayer_silent_adult] }

- id: adult.job_fort_priest_dying
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_fort_priest]
  text: |
    ผู้เฝ้าผนึกที่เขาหามขึ้นมาจากแนวหินชื่อรอสเวน อายุสิบเก้า เพิ่งมาอยู่ป้อมได้สามเดือน แผลที่ท้องเป็นรอยย่นดำเหมือนกระดาษไหม้ กลิ่นถ่านลอยออกมาจากแผลทุกครั้งที่เขาหายใจ หมอประจำป้อมดูแผลแล้วส่ายหน้า ส่งตัวมาห้องที่อยู่ข้างห้องเก็บศพ

    รอสเวนรู้ เขาไม่ได้ขอให้รักษา เขาล้วงจดหมายพับสี่ทบออกจากเสื้อ เขียนไม่จบ ถึงแม่ที่เวนทราส ขอให้{name}เขียนต่อให้จบ แล้วส่งไปแทนเขา

    ตีหนึ่งคืนนั้นเขายังหายใจ ตีสองเริ่มพูดถึงคนที่ไม่ได้อยู่ในห้อง
  choices:
    - id: pray_for_him
      label: วางมือบนแผล สวดขอให้{god}รักษา
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          {name}สวดจนรู้สึกได้ว่าความร้อนจากแผลไหลขึ้นมาตามแขน ไหลขึ้นมาจนถึงไหล่ ร้อนจนฝ่ามือพอง แล้วก็หยุด กลิ่นถ่านหายไปจากห้อง รอสเวนหลับไปจริงๆ ไม่ใช่หลับแบบที่หมอบอกว่าคนใกล้ตายหลับ

          สามวันต่อมาเขาลุกขึ้นนั่งกินข้าวต้มได้ จดหมายถึงแม่ที่เวนทราส เขาเขียนต่อจนจบเอง เขียนเรื่องนักบวชประจำป้อมไว้ครึ่งหน้า ฝ่ามือของ{name}เป็นรอยไหม้รูปเดียวกับแผลของเขา หายไม่สนิท
        effects: { hp: -1, stats: { WIS: 1 }, world: { gods: 1 }, reputation: { wardens: 1 }, flags: [healed_rosven] }
      failure:
        text: |
          {name}สวดจนฟ้าสาง ความร้อนจากแผลไม่ไหลไปไหน มันอยู่ที่เดิม ใต้ฝ่ามือ{name}เหมือนเตาไฟที่ไม่มีวันดับ รอสเวนจับข้อมือ{name}ไว้ตอนตีสี่ บีบแรงครั้งหนึ่ง แล้วคลายมือ

          {name}เขียนจดหมายต่อให้จบตอนเช้า เขียนว่ารอสเวนตายตอนกำลังพูดถึงขนมปังลูกเกดที่แม่ทำทุกวันออสซา เป็นเรื่องจริง เขาพูดถึงขนมปังนั้นจริงๆ
        effects: { stats: { CON: 1 }, flags: [lost_rosven, wrote_rosven_letter] }
    - id: ease_him
      label: ไม่สวดขอรักษา นั่งจับมือเขาจนถึงตอนสุดท้าย
      text: |
        {name}นั่งข้างเตียง จับมือรอสเวนไว้ ตอบชื่อทุกชื่อที่เขาเรียกเหมือนเป็นคนคนนั้นเอง แม่ น้องสาว เพื่อนบ้านชื่อดาวิค ครูฝึกที่ป้อมสาม เขาคุยกับทุกคนครบ ขอโทษบางคน ขอบใจบางคน แล้วเงียบไปตอนใกล้สาง

        จดหมายถึงแม่ {name}เขียนต่อจนจบในคืนเดียวกัน เขียนทุกคำที่รอสเวนพูดกับแม่ในคืนนั้น ทุกคำ ไม่ตัดออกแม้แต่คำเดียว
      effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [eased_rosven, wrote_rosven_letter] }
    - id: ask_what_he_saw
      label: ถามเขาว่าเห็นอะไรที่แนวหิน ก่อนเขาจะพูดไม่ได้
      check: { stat: INT, dc: 12 }
      success:
        text: |
          รอสเวนตอบเป็นช่วงๆ ระหว่างหายใจ เขาเห็นหินผนึกก้อนที่สามสิบหกร้าว รอยร้าวยาวเท่านิ้วมือ ตรงรอยร้าวมีไออุ่นออกมา หมาเถ้าออกมาจากตรงนั้น ไม่ใช่จากทุ่งเถ้า {name}จดทุกคำ แล้วเขียนจดหมายถึงแม่ของเขาต่อจนจบในคืนเดียวกัน

          เช้าวันต่อมา การ์เวนพาคนไปดูหินก้อนที่สามสิบหก เจอรอยร้าวยาวเท่านิ้วมือจริง แต่หินเย็นเหมือนก้อนอื่น เถ้ารอบโคนหินก็ไม่มีรอยเท้า ไม่มีใครบอกได้ว่ารอยนั้นร้าวมาตั้งแต่เมื่อไร การ์เวนเอาปูนอุดไว้ก่อน แล้วเขียนรายงานถึงภาคี ใส่ชื่อรอสเวนเป็นคนเห็น ใส่ชื่อ{name}เป็นคนจด
        effects: { stats: { INT: 1 }, reputation: { wardens: 1 }, flags: [knows_cracked_stone, wrote_rosven_letter] }
      failure:
        text: |
          รอสเวนพูดได้แค่คำเดียวว่าหิน แล้วไอเป็นเถ้าออกมาเต็มฝ่ามือ จากนั้นเขาพูดแต่ชื่อคนที่บ้าน ไม่พูดเรื่องแนวหินอีก {name}ไม่ถามซ้ำ นั่งฟังชื่อเหล่านั้นจนเขาเงียบไปตอนใกล้สาง

          จดหมายถึงแม่ {name}เขียนต่อจนจบ ส่วนคำว่าหิน {name}เขียนไว้บนกระดาษอีกแผ่น พับเก็บไว้ในหนังสือสวด ไม่รู้ว่าจะเอาไปให้ใครอ่าน
        effects: { stats: { WIS: 1 }, flags: [lost_rosven, wrote_rosven_letter] }
