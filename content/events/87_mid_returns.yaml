# วัยกลางคน: คนและของจากวัยเด็กกับวัยหนุ่มสาวที่กลับมา (batch 4 package A)
# แต่ละเรื่องอ่านจาก flag ของเหตุการณ์เดียวในวัยเด็กหรือวัยหนุ่มสาว เปิดเรื่องด้วยภาพจำหนึ่งภาพ แล้วเล่าว่าเรื่องนั้นกลายเป็นอะไร
# ไม่เฉลยความลับของโลก ไม่ตัดสินว่าทางที่เลือกตอนเด็กถูกหรือผิด ไม่มีใครตาย

# ---------- ไร่ ----------

- id: adult.back_crossroads
  stage: adult
  weight: 30
  when:
    age: [41, 55]
    any_flags: [told_mother_crossroads, left_crossroads_baby]
    location_tag: arvel_village
  text: |
    ผู้หญิงคนนั้นมาถึงโรงสีบ้านเงาเสาตอนสาย เขาสองข้างยาวเท่านิ้วกลาง โค้งไปข้างหลัง ไม่ซ่อน ไม่เลื่อย นางเดินถามคนที่ต่อคิวสีข้าวทีละคน ว่าใครเคยเดินทางสามแพร่งหลังโรงสีตอนเช้ามืด ในหน้าหนาวปีที่มีตะกร้าหวายใบหนึ่งวางอยู่กลางทางแยก ถามเสียงดัง หัวเราะไปถามไป

    {name}ยืนอยู่ท้ายแถว กระสอบข้าวพาดบ่า ตะกร้าใบนั้นยังชัดอยู่ในหัวกว่าหน้าคนในแถว ผ้าข้างในขยับนิดหนึ่งแล้วนิ่ง เสียงเหมือนลูกแมวแต่ไม่ใช่ลูกแมว วัวเล็มหญ้าอยู่ห่างไปไม่กี่ก้าว

    นางบอกคนสีข้าวว่าชื่อแดดแรก แม่ชีวิหารอีเซลตั้งให้ตามเวลาที่มีคนเอานางไปส่งช่องขนมปัง คนที่เอาไปส่งไม่บอกชื่อ บอกแม่ชีไว้อย่างเดียว ว่าข้างตะกร้ามีรอยเท้าเด็กเดินวนอยู่รอบหนึ่ง แล้วเดินตามรอยวัวไป นางไม่ได้มาเอาเรื่องใคร แค่อยากรู้ว่าใครเห็นนางเป็นคนแรก

    คนในแถวส่ายหน้ากันทีละคน คิวเลื่อนมาถึง{name}
  choices:
    - id: it_was_mother
      label: บอกแดดแรกว่าเด็กคนนั้นคือ{name} และวิ่งกลับไปบอกแม่
      requires: { flag: told_mother_crossroads }
      text: |
        แดดแรกถามว่าแม่ของ{name}เป็นคนเอานางไปส่งวิหารใช่ไหม {name}บอกว่าแม่บอกไว้อย่างนั้น เรื่องรองเท้าคู่ที่แห้งสนิทในคืนที่ทางเป็นโคลนตลอดสาย {name}เก็บไว้ ไม่ได้เล่า

        แดดแรกจับมือ{name}เขย่าแรงจนกระสอบข้าวหล่นจากบ่า ฝากคำขอบคุณถึงแม่ของ{name} หัวเราะเสียงดังจนคนสีข้าวต้องหยุดหินโม่ แล้วเดินออกไปทางหลังโรงสี ตรงไปทางสามแพร่ง ตอนสายแบบนี้เด็กในหมู่บ้านเดินทางนั้นกันได้
      effects:
        alignment: { moral: 1 }
        flags: [told_daedraek_about_mother]
        people: [{ id: crossroads_daedraek, name: แดดแรก, gender: f, race: tiefling, bond: friend, closeness: 1, age: 40 }]
    - id: it_was_me_who_walked_on
      label: บอกแดดแรกว่าเด็กคนนั้นคือ{name} และไล่วัวกลับบ้านไปโดยไม่หันมอง
      requires: { flag: left_crossroads_baby }
      text: |
        แดดแรกหยุดหัวเราะครั้งเดียว ครั้งเดียวตลอดเช้านั้น แล้วถามว่าวัวตัวนั้นกลับถึงบ้านไหม {name}บอกว่าถึง นางว่าดีแล้ว อย่างน้อยเช้านั้นก็มีใครสักตัวได้กลับบ้าน

        นางขอให้{name}พาไปที่ทางแยก ให้ยืนตรงที่รอยเท้าเด็กเดินวน {name}ยืน นางนั่งลงบนดินตรงที่ตะกร้าเคยวาง ห่างกันสองก้าว นั่งอยู่อย่างนั้นจนเงาโรงสีทอดมาถึงตัวทั้งสองคน
      effects:
        stats: { WIS: 1 }
        flags: [told_daedraek_i_walked_on]
        people: [{ id: crossroads_daedraek, name: แดดแรก, gender: f, race: tiefling, bond: friend, closeness: 1, age: 40 }]
    - id: too_young_then
      label: บอกว่าตอนนั้น{name}ยังเด็กเกินกว่าจะเดินทางนั้น
      text: |
        แดดแรกขอบคุณ แล้วไปถามคนถัดไป ถามจนครบทั้งโรงสี ถามต่อที่บ่อน้ำ ที่หน้าร้านเกลือ ตกบ่ายขึ้นเกวียนออกไปทางเมืองตลาด ไม่ได้หันกลับมา

        เช้ามืดวันต่อมา{name}เดินทางสามแพร่งหลังโรงสีคนเดียว ไม่มีวัวให้ตาม ไม่มีตะกร้า มีแต่รอยล้อเกวียนเก่าแห้งแข็งอยู่กลางทางแยก
      effects: { flags: [kept_quiet_to_daedraek] }
    - id: show_her_the_spot
      label: พาแดดแรกไปที่ทางแยก ชี้ให้ดูว่าตะกร้าวางตรงไหน โดยไม่บอกว่ารู้ได้อย่างไร
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}เดินนำไปถึงทางแยก หยุดตรงก้อนหินแบนที่โผล่พ้นหญ้า ห่างจากหลักบอกทางสามก้าว ไม่ต้องกะ ไม่ต้องคิด แดดแรกมองก้อนหิน มอง{name} แล้วเลิกถาม

          นางนั่งลงบนก้อนหินนั้น บอกว่าก้อนนี้เล็กกว่าที่คิด ขากลับนางเดินคู่มากับ{name}ถึงโรงสี ไม่ได้ถามอีกสักคำว่า{name}รู้ได้อย่างไร
        effects:
          stats: { WIS: 1 }
          flags: [showed_daedraek_the_spot]
          people: [{ id: crossroads_daedraek, name: แดดแรก, gender: f, race: tiefling, bond: friend, closeness: 1, age: 40 }]
      failure:
        text: |
          ทางสามแพร่งไม่เหมือนที่จำได้ โรงสีต่อเติมไปทางหลัง ทางแยกขยับไปหลายก้าว หลักบอกทางเป็นหลักใหม่ {name}ชี้ไปที่พุ่มหญ้าพุ่มหนึ่ง แล้วไม่แน่ใจ ชี้ใหม่อีกพุ่ม

          แดดแรกหัวเราะ บอกว่าไม่เป็นไร นั่งลงตรงพุ่มแรกที่{name}ชี้ บอกว่าตรงนี้ก็ได้ ตรงไหนก็ได้ ขอแค่มีคนชี้ให้สักที่
        effects: { flags: [showed_daedraek_the_spot] }

- id: adult.back_survey_chain
  stage: adult
  weight: 30
  when:
    age: [41, 58]
    any_flags: [helped_surveyors, pulled_survey_stakes, knows_land_sold]
    location_tag: arvel_village
  text: |
    โซ่เหล็กข้อยาวเท่ากันทุกข้อลากผ่านคันนาของบ้านเงาเสาอีกรอบ หลักไม้ทาสีแดงปักเป็นระยะ สีแดงเดียวกับหลักที่{name}จำได้ตั้งแต่ตัวยังเตี้ยกว่ารั้ว คราวนี้โซ่ไม่ได้ลากผ่านทุ่งฝั่งตะวันออก ทุ่งนั้นขายไปนานแล้ว โซ่ลากข้ามทุ่งผืนที่ติดกัน ผืนที่หลายบ้านยังเช่าทำนาอยู่

    คนลากโซ่ชุดนี้หนุ่มกว่าชุดก่อน รองเท้าหนังหุ้มข้อยังไม่เคยเปื้อนโคลนเหมือนกัน คนถือสมุดบอกคนที่มามุงว่าเจ้าของทุ่งฝั่งตะวันออกจะขยายลานกองของ ต้องการทุ่งเพิ่มอีกผืน ราคายังไม่ตกลง

    ตกเย็นคนในหมู่บ้านไปรวมกันที่โรงสีเหมือนทุกครั้งที่มีเรื่อง คนหนุ่มที่เช่านาผืนนั้นหันมาถาม{name}ก่อนใคร
  choices:
    - id: hold_the_chain_again
      label: ไปช่วยถือปลายโซ่ ให้คนลากโซ่รุ่นใหม่เห็นว่านับข้อโซ่โดยไม่ก้มดูทำอย่างไร
      requires: { flag: helped_surveyors }
      text: |
        คนลากโซ่หนุ่มหัวเราะตอนแรก หยุดหัวเราะตอน{name}บอกระยะได้ตรงก่อนเขาก้มนับ แล้วยอมให้อ่านตัวเลขบนหลักไม้ทุกหลัก ตัวเลขบนหลักชุดนี้มีสองแถว แถวบนเป็นระยะ แถวล่างเป็นราคาต่อหลัก {name}จำแถวล่างไว้ทุกหลัก

        คืนนั้นที่โรงสี{name}บอกราคาทีละหลักให้คนเช่านาฟัง ราคาต่ำกว่าที่ทุ่งฝั่งตะวันออกขายไปเมื่อก่อนครึ่งหนึ่ง คนเช่านาถือราคานั้นไปต่อรองกับคนถือสมุดตั้งแต่เช้า ได้ขึ้นมาอีกหนึ่งในสี่
      effects: { stats: { INT: 1 }, flags: [read_the_new_survey_stakes] }
    - id: pull_the_stakes_again
      label: ออกไปถอนหลักแดงตอนกลางคืนอีกครั้ง
      requires: { flag: pulled_survey_stakes }
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          {name}ออกจากบ้านตอนทุกคนหลับ เหมือนครั้งก่อนทุกอย่างยกเว้นเข่า ถอนได้เก้าหลัก โยนลงคลองทีละหลัก ฟังเสียงน้ำกลืน หลักที่สิบมีคนถอนไปก่อนแล้ว ปลายคันนาฝั่งโน้นมีเงาคนหนุ่มสองคนกำลังถอนหลักที่สิบเอ็ดกับสิบสอง

          เช้าวันรุ่งขึ้นคนลากโซ่ด่าลั่นคันนา ต้องวัดใหม่ทั้งแปลง ทั้งหมู่บ้านความจำไม่ดีพร้อมกัน ขากางเกงเปื้อนโคลนสามตัวตากอยู่บนราวคนละบ้าน
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [pulled_the_stakes_again] }
      failure:
        text: |
          หลักที่สามปักลึก {name}ดึงสุดแรง เข่าทรุด หงายลงคลองทั้งตัว โคลนก้นคลองดูดรองเท้าไปข้างหนึ่ง คนเช่านาหนุ่มได้ยินเสียงน้ำ วิ่งมาดึง{name}ขึ้นจากคลอง ไม่ถามว่ามาทำอะไร

          เช้ามาเขาเอาหลักนั้นไปปักคืนที่เดิมด้วยมือตัวเอง แล้วแวะมาคืนรองเท้าข้างที่งมได้ บอกว่าทีหลังให้เรียกเขามาถอนแทน
        effects: { hp: -2, alignment: { law: -1 }, flags: [pulled_the_stakes_again] }
    - id: read_the_sale_paper
      label: ไปเมืองตลาด จ้างเสมียนโรงชั่งอ่านใบซื้อขายทุ่งฝั่งตะวันออกให้ฟังทั้งฉบับ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          เสมียนคิดค่าอ่านหนึ่งเหรียญ อ่านช้าๆ ทีละข้อ ข้อที่เก้าเขียนว่าเจ้าของใหม่ห้ามซื้อนาที่มีคนเช่าอยู่ จนกว่าจะพ้นฤดูเก็บเกี่ยวที่สามนับจากวันที่แจ้ง {name}ให้อ่านซ้ำสองรอบ แล้วจ้างให้คัดข้อนั้นลงกระดาษอีกหนึ่งเหรียญ

          กระดาษแผ่นนั้นตอกติดไว้ที่ประตูโรงสี คนถือสมุดมายืนอ่านตอนเช้า อ่านจบแล้วเก็บโซ่ ฤดูเก็บเกี่ยวหน้าคนเช่านายังได้เกี่ยวข้าวผืนเดิม และอีกสองฤดูต่อจากนั้น
        effects: { gold: -2, stats: { WIS: 1 }, flags: [found_the_ninth_clause] }
      failure:
        text: |
          เสมียนอ่านเร็ว อ่านด้วยคำที่ฟังแล้วเข้าใจทุกคำแต่ต่อกันไม่รู้เรื่อง {name}ขอให้อ่านช้าลง เสมียนคิดเงินเพิ่ม อ่านช้าลงก็ยังไม่รู้เรื่อง

          {name}กลับหมู่บ้านพร้อมเงินที่หายไปสามเหรียญ กับคำว่าวรรคสองข้อเก้าที่จำมาได้แต่ไม่รู้ว่าแปลว่าอะไร คนเช่านาฟังแล้วพยายามจำตาม
        effects: { gold: -3, flags: [found_the_ninth_clause] }
    - id: ask_what_it_measures
      label: ถามคนถือสมุดตรงๆ ว่าโซ่นี้วัดอะไร
      requires: { flag: knows_land_sold }
      text: |
        คนถือสมุดตอบเป็นตัวเลข ไร่ละเท่าไร หลักละกี่ก้าว ลานกองของจะยาวไปถึงไหน {name}ฟังจนจบ คำถามเดียวกันนี้{name}เคยถามคนคนหนึ่งตอนเด็ก คนนั้นเช็ดเคียวกับขากางเกงก่อนตอบ และตอบไม่ใช่ตัวเลข

        คนถือสมุดถามกลับว่าแล้วถ้าเป็น{name} จะตอบว่าวัดอะไร {name}ไม่ได้ตอบเขา เดินกลับไปที่โรงสี บอกคนเช่านาทุกคนให้ไปนั่งรอคนถือสมุดที่หัวคันนาพรุ่งนี้พร้อมกันทั้งหมด ถือเคียวไปด้วย ไม่ต้องทำอะไรกับมัน
      effects: { alignment: { law: -1 }, reputation: { crown: -1 }, flags: [sat_the_tenants_at_the_field_head] }

- id: adult.back_hetel_bell
  stage: adult
  scene: home
  weight: 30
  when:
    age: [41, 58]
    any_flags: [hetel_bell, saw_birth_death]
    location_tag: arvel_village
  text: |
    คืนที่หิมะลงหนักที่สุดของปี มีคนมาเคาะประตูบ้าน{name} เคาะเร็วแบบเดียวกับคืนหนึ่งเมื่อ{name}เพิ่งพ้นวัยเด็ก คืนที่ห้องอุ่นเพราะเตาถ่านไม้ กระดิ่งทองเหลืองลูกเล็กผูกอยู่หัวเตียง และยายเฮเทลกระซิบว่าเด็กเอาก้นลง

    คนเคาะคือเกรเลน ลูกชายคนเล็กของช่างตีเหล็กท้ายหมู่บ้าน เมียเขาเจ็บท้องตั้งแต่หัวค่ำ หมอตำแยของหมู่บ้านติดหิมะอยู่ที่หมู่บ้านถัดไป ช่างตีเหล็กแก่จนหลังโก่งแล้ว ให้ลูกมาตาม{name}คนเดียว บอกว่าจำได้ว่าคืนนั้นใครถือตะเกียง

    เกรเลนยืนอยู่ในหิมะ ไม่ได้ใส่หมวก หิมะเกาะผมจนขาวทั้งหัว
  choices:
    - id: tie_the_bell
      label: ค้นกระดิ่งทองเหลืองของยายเฮเทลจากก้นหีบ ไปผูกไว้ที่หัวเตียงก่อนทำอย่างอื่น
      requires: { flag: hetel_bell }
      text: |
        {name}ผูกกระดิ่งก่อน ล้างมือ แล้วคลำท้องวนไปรอบหนึ่งอย่างที่เคยเห็น เด็กเอาหัวลง ลงถูกทาง แม่เด็กกำราวเตียงทุกครั้งที่เจ็บ กระดิ่งดังทุกครั้งที่กำ ดังถี่ขึ้นเรื่อยๆ จนไม่เว้นช่วง

        เด็กออกมาตอนกระดิ่งดังเป็นรอบที่เท่าไรไม่มีใครนับ ร้องดังกว่าลมข้างนอก ช่างตีเหล็กที่นั่งเอาหน้าผากพิงประตูอยู่ข้างนอกยกหัวขึ้นจากประตู เคาะประตูสองที แล้วถามว่าเข้าได้หรือยัง
      effects: { stats: { WIS: 1 }, flags: [tied_hetels_bell_again] }
    - id: feel_which_way
      label: คลำท้องให้รู้ก่อนว่าเด็กเอาอะไรลง อย่างที่เคยเห็นยายเฮเทลทำคืนนั้น
      requires: { flag: saw_birth_death }
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          ก้นลง เหมือนคืนนั้น มือ{name}รู้ก่อนหัว {name}สั่งเกรเลนให้ต้มน้ำสองหม้อ หม้อหนึ่งร้อน หม้อหนึ่งเย็น ให้ช่างตีเหล็กเติมถ่านจนห้องร้อนเหงื่อแตก สั่งทีละคำแบบที่จำได้ทุกคำ อย่าเพิ่งดึง จับตรงนี้ไว้

          เด็กคลอดออกมาตอนตีสาม ตัวเขียว ไม่ร้อง {name}เป่าปาก ตบหลัง จุ่มน้ำเย็นสลับน้ำอุ่น ครั้งที่สามเด็กร้อง {name}ส่งเด็กให้แม่ แล้วออกไปนั่งในหิมะหน้าบ้านจนมือหยุดสั่น
        effects: { stats: { WIS: 1 }, flags: [turned_the_breech_night] }
      failure:
        text: |
          มือ{name}คลำแล้วไม่แน่ใจ คลำอีกรอบก็ยังไม่แน่ใจ {name}ส่งเกรเลนลุยหิมะไปตามหมอบริษัทที่โรงกลางทุ่ง ส่วนตัวเองนั่งจับมือแม่เด็กไว้ นับลมหายใจให้

          เด็กเกิดก่อนหมอมาถึง หัวลง ร้องเสียงดังตั้งแต่ยังไม่ออกมาครบตัว หมอมาถึงตอนสาง ตรวจดูแล้วบอกว่าไม่ต้องทำอะไร แล้วขอค่าเดินทางสองเหรียญ {name}เป็นคนจ่าย
        effects: { gold: -2, flags: [turned_the_breech_night] }
    - id: send_for_the_doctor
      label: บอกเกรเลนให้วิ่งไปตามหมอบริษัท ส่วน{name}ไปอยู่กับแม่เด็กก่อน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ลุยหิมะไปบ้านช่างตีเหล็กเอง ถึงก่อนเกรเลนจะพ้นหัวหมู่บ้าน คืนนั้นทั้งคืน{name}ยืนอยู่ข้างเตียง ยกตะเกียง เช็ดเหงื่อ จับมือ หลังแข็งจนหันคอไม่ได้

          หมอบริษัทมาถึงพร้อมกับเสียงเด็กร้องแรก ไม่ต้องเปิดกระเป๋า เขานั่งลงข้างเตาของช่างตีเหล็ก ขอน้ำชาหนึ่งถ้วย บอกว่าคนที่ยืนอยู่ข้างเตียงทั้งคืนทำงานแทนเขาไปแล้ว
        effects: { stats: { CON: 1 }, flags: [stood_by_the_smiths_bed] }
      failure:
        text: |
          ครึ่งทางไปบ้านช่างตีเหล็กหิมะลึกถึงเข่า {name}ลื่นล้มสองครั้ง ไปถึงตัวเปียกถึงเอว นิ้วเท้าไม่มีความรู้สึก ช่างตีเหล็กต้องถูเท้าให้ข้างเตา ก่อน{name}จะเข้าห้องได้

          เด็กเกิดตอนตีสี่ หมอบริษัทมาถึงทัน {name}นั่งดูอยู่ปลายเตียง ห่อผ้าห่มสองผืน นิ้วเท้าแดงกลับมาตอนสาง เจ็บไปอีกครึ่งเดือน
        effects: { hp: -2, flags: [stood_by_the_smiths_bed] }
    - id: hold_the_lamp_again
      label: ไปถือตะเกียงให้ เหมือนคืนนั้น แล้วทำตามที่แม่เด็กสั่ง
      text: |
        แม่เด็กเคยคลอดมาแล้วหนึ่งคน รู้ว่าตัวเองต้องการอะไร สั่ง{name}ทีละคำ ยกตะเกียงสูง ต่ำลงอีก ไม่ใช่ตรงนั้น ตรงนี้ สั่งเกรเลนให้ออกไปนั่งกับพ่อ สั่งทุกคนในบ้านจนเด็กออกมา

        ตอนเก็บของ ช่างตีเหล็กยื่นถุงเกลือให้ถุงหนึ่ง บอกว่าคราวก่อนไม่ได้ให้อะไร คราวนี้ให้ {name}แบกเกลือกลับบ้านในหิมะ หนักกว่าตะเกียง
      effects: { alignment: { moral: 1 }, flags: [held_the_lamp_again] }

# ---------- โรงกลั่น ----------

- id: adult.back_dish_roof
  stage: adult
  scene: refinery
  weight: 30
  when:
    age: [41, 56]
    flags: [roof_worker]
    location_tag: ventras
  text: |
    {name}เดินผ่านโรงกลั่นตอนรุ่งสาง ได้ยินเสียงเด็กร้องมาจากข้างบน บนหลังคามีเด็กคนหนึ่งห้อยตัวอยู่กับขอบจานรับดาวใบริมสุด ผ้าเช็ดจานหลุดมือปลิวลงมาตกตรงหน้า{name} เด็กตัวเท่าที่{name}เคยเป็นวันแรกที่ขึ้นไปยืนตรงนั้น วันที่เห็นเวนทราสทั้งเมือง เห็นจานนับพันใบหงายขึ้นฟ้าเหมือนมือแบขอ

    ผู้จัดการโรงยืนตะโกนอยู่ข้างล่าง ด่าเด็กมากกว่าบอกทาง บันไดที่โรงมีสั้นไปสองช่วงตัว เด็กคนอื่นบนหลังคาไม่กล้าไต่มาใกล้ จานใบนั้นเอียงลงทุกครั้งที่เด็กขยับ

    รางน้ำที่{name}เคยใช้ไต่ขึ้นยังอยู่ เข่าของ{name}ไม่อยู่ในสภาพเดิมแล้ว
  choices:
    - id: climb_the_gutter
      label: ไต่รางน้ำขึ้นไปเองตามทางเดิม
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          รางน้ำยังรับน้ำหนักได้ ที่จับอยู่ตรงที่มือควานหาทุกจุด มือจำได้ก่อนตา {name}ขึ้นไปถึงสันหลังคา คลานไปตามแนวจาน จับข้อมือเด็กไว้ได้ตอนที่จานเอียงลงอีกครั้ง

          ลงมาถึงพื้น ผู้จัดการจะด่าเด็กต่อ {name}ยื่นผ้าเช็ดจานคืนให้เด็กก่อน แล้วยืนขวางระหว่างกลาง เข่าซ้ายสั่นอยู่จนเดินถึงหัวถนน
        effects: { stats: { DEX: 1 }, flags: [climbed_the_dish_roof_again] }
      failure:
        text: |
          รางน้ำรับน้ำหนักได้ เข่าไม่รับ ครึ่งทาง{name}ค้างอยู่กลางผนังโรงกลั่น ขึ้นไม่ได้ ลงไม่ได้ เด็กบนหลังคาร้องเรียก คนบนถนนเรียก{name}แทน

          คนงานท่าเรือเหาะแบกบันไดเชือกยาวสามช่วงตัวมาจากท่า เอาเด็กลงก่อน แล้วค่อยเอา{name}ลง ทั้งย่านรู้เรื่องนี้ภายในเที่ยง เด็กคนนั้นแวะมาหาตอนเย็น ถือผ้าเช็ดจานมาคืน บอกว่ายังไงก็ขอบคุณ
        effects: { hp: -2, flags: [climbed_the_dish_roof_again, stuck_on_the_refinery_wall] }
    - id: call_up_the_holds
      label: ตะโกนบอกเด็กทีละที่จับ จากข้างล่าง
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ตะโกนให้ผู้จัดการเงียบก่อน แล้วบอกเด็กทีละคำ ปล่อยมือซ้าย จับขาจานใบที่สองแทน เท้าขวาหาสันกระเบื้อง ตรงนั้นแข็ง ไม่ต้องดูข้างล่าง ทุกที่ที่บอกเป็นที่ที่มือ{name}เคยจับ

          เด็กลงมาถึงสันหลังคาเอง เดินเลาะสันไปถึงช่องบันไดได้ ผู้จัดการถาม{name}ว่าเคยทำงานที่นี่หรือ {name}บอกว่าเคย ตอนตัวเท่านั้น
        effects: { stats: { WIS: 1 }, flags: [called_the_child_down] }
      failure:
        text: |
          เสียงผู้จัดการดังกว่า เด็กได้ยินแต่คำด่า ไม่ได้ยินที่{name}บอก ขยับผิดทาง จานเอียงจนเด็กหลุดมือข้างหนึ่ง คนงานสองคนขึ้นทางช่องบันไดไปดึงตัวไว้ได้ทัน

          เด็กลงมาถึงพื้น ขาสั่น ผู้จัดการหักค่าแรงสามวันค่าผ้าเช็ดจานที่หล่น {name}จ่ายแทนให้ ผู้จัดการรับเงินโดยไม่ถามว่าเป็นอะไรกับเด็ก
        effects: { gold: -1, flags: [called_the_child_down] }
    - id: throw_a_line
      label: ผูกปลายเชือกกับก้อนหิน เหวี่ยงข้ามสันหลังคาไปให้เด็กจับ
      requires: { class: ranger }
      text: |
        {name}ขอเชือกจากเกวียนขนขวด ผูกก้อนหินถ่วงปลาย เหวี่ยงครั้งเดียวข้ามสันหลังคา เชือกพาดลงมาข้างเด็กพอดี อีกฝั่งหนึ่ง{name}พันเชือกรอบเสาตะเกียงฟ้า ให้คนงานสามคนช่วยดึงตึง

        เด็กพันเชือกรอบเอวตามที่{name}ตะโกนบอก ไต่ลงช้าๆ ตามสันหลังคา ลงถึงพื้นแล้วยังไม่ยอมปล่อยเชือก ผู้จัดการขอเชือกเส้นนั้นไว้ผูกเสาบนหลังคา บอกว่าจะให้เด็กทุกคนผูกเอวก่อนขึ้นจาน
      effects: { stats: { DEX: 1 }, flags: [roped_the_roof_child_down] }
    - id: pay_for_a_ladder
      label: ไปยืนกดดันผู้จัดการให้ซื้อบันไดเชือกยาวพอถึงหลังคา จ่ายเองครึ่งหนึ่งถ้าจำเป็น
      text: |
        คนงานเอาเด็กลงมาได้ด้วยบันไดสองช่วงต่อกัน มัดด้วยเข็มขัดของ{name} ระหว่างนั้น{name}ยืนต่อรองกับผู้จัดการ บันไดเชือกยาวสามช่วงตัวราคาสี่เหรียญ ผู้จัดการยอมจ่ายสองเหรียญ ถ้า{name}จ่ายอีกสอง

        บันไดเส้นนั้นแขวนอยู่ข้างประตูโรงกลั่นตั้งแต่สัปดาห์ต่อมา เด็กบนหลังคาเรียกว่าบันได{name} ผู้จัดการไม่ชอบชื่อนี้
      effects: { gold: -2, alignment: { moral: 1 }, flags: [paid_for_the_roof_ladder] }

- id: adult.back_pot_nine
  stage: adult
  scene: refinery
  weight: 30
  when:
    age: [41, 58]
    any_flags: [knows_the_coils, talis_bridge]
    location_tag: ventras
  text: |
    สมาคมโรงกลั่นเปลี่ยนหม้อรุ่นเก่าออกทั้งแถว คนงานยกหม้อเบอร์เก้ากับเบอร์สิบขึ้นเกวียนไปลานเศษเหล็กริมคลองเป็นคู่สุดท้าย {name}เห็นเกวียนผ่านหน้าร้านขายน้ำชา แผ่นเลขทองเหลืองยังตอกติดฝาหม้อ หม้อเบอร์เก้า หม้อที่หยดเร็วจนเสียงติดกันเป็นสายในคืนหนึ่ง คืนที่มือข้างหนึ่งจับวาล์วน้ำเย็นไม่อยู่

    ที่ลานเศษเหล็ก หญิงชราคนหนึ่งนั่งอยู่บนลังไม้ข้างกองหม้อ แว่นช่างสองชั้นห้อยคอ ชื่อมอร์ลา ช่างเวทประจำโรงในปีนั้น แก่จนต้องมีหลานจูงมา นางมาดูหม้อที่ตัวเองเลี้ยงมาลงเตาหลอม

    เตาหลอมเปิดตอนบ่าย คนคุมลานบอกว่าใครอยากได้อะไรจากหม้อพวกนี้ให้รีบหยิบ ทองเหลืองขายได้ แก้วขายไม่ได้
  choices:
    - id: save_the_coils
      label: ขอให้มอร์ลาชี้ว่าขดแก้วขดไหนยังดี แล้วถอดออกมาด้วยมือตัวเองก่อนหม้อลงเตา
      requires: { flag: knows_the_coils }
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          มอร์ลาจำ{name}ไม่ได้ จนกระทั่ง{name}เรียกขดแก้วถูกชื่อทั้งสามขด ขดล่าง ขดกลาง ขดบน นางยื่นแว่นช่างให้ใส่ ชี้ด้วยไม้เท้า {name}คลายเกลียวทีละรอบ ถอดขดกลางของหม้อเบอร์เก้าออกมาได้ทั้งขด ไม่ร้าวสักเส้น

          มอร์ลาห่อขดแก้วด้วยผ้าพันคอของตัวเอง บอกว่าเอาไปให้ห้องเรียนช่างของสมาคม ให้เด็กรุ่นใหม่ได้เห็นของจริงสักครั้งก่อนจะเห็นแต่ในรูปวาด แล้วให้หลานจูงกลับก่อนเตาเปิด
        effects:
          stats: { DEX: 1 }
          flags: [saved_pot_nines_coil]
          people: [{ id: tech_morla, name: มอร์ลา, gender: f, bond: mentor, closeness: 1, age: 86 }]
      failure:
        text: |
          เกลียวสุดท้ายแน่นกว่าที่คิด {name}บิดแรงเกิน ขดแก้วแตกในมือ เศษแก้วบาดฝ่ามือเป็นแผลยาว น้ำค้างดาวที่ค้างในขดหยดลงบนแผลหยดหนึ่ง แสบเย็นจนชา

          มอร์ลาพันแผลให้ด้วยผ้าพันคอ บอกว่าขดแก้วรุ่นนั้นแตกง่ายอยู่แล้ว ตั้งแต่สมัยนางยังสาว แล้วถาม{name}ว่าจำได้ไหมว่าขดไหนทำหน้าที่อะไร {name}ตอบถูกทั้งสามขด นางบอกว่าแค่นั้นก็พอ
        effects:
          hp: -1
          flags: [saved_pot_nines_coil]
          people: [{ id: tech_morla, name: มอร์ลา, gender: f, bond: mentor, closeness: 1, age: 86 }]
    - id: plate_to_the_bridge
      label: ขอแผ่นเลขทองเหลืองหม้อเบอร์เก้า ไปแขวนที่ศาลทาลิสใต้สะพาน
      requires: { flag: talis_bridge }
      text: |
        คนคุมลานคิดราคาแผ่นเลขเท่าน้ำหนักทองเหลือง หนึ่งเหรียญ {name}ถือไปใต้สะพานตอนเช้ามืด ผนังสะพานยังมีรูปขนนกกับโซ่ขาด ตะเกียงดวงเดียว ม้านั่งไม้เพิ่มจากสามตัวเป็นห้าตัว คนงานกะดึกนั่งกันเต็มเหมือนเดิม ร้องเพลงเรือที่ออกจากท่าแล้วไม่กลับ

        {name}ตอกตะปูลงร่องอิฐข้างรูปขนนก แขวนแผ่นเลขหม้อเบอร์เก้าไว้ คนงานกะดึกคนหนึ่งถามว่าเลขอะไร {name}บอกว่าหม้อที่เคยมีคนนั่งเฝ้า เขาไม่ถามต่อ ร้องเพลงต่อจากท่อนที่ค้าง
      effects: { gold: -1, alignment: { moral: 1 }, flags: [hung_pot_nines_plate_under_the_bridge] }
    - id: buy_the_plate
      label: ซื้อแผ่นเลขหม้อเบอร์เก้ากลับบ้าน
      text: |
        คนคุมลานงัดแผ่นเลขออกจากฝาหม้อให้ด้วยชะแลง หนึ่งเหรียญ แผ่นทองเหลืองบางกว่าที่คิด ด้านหลังมีรอยขีดเล็กๆ เป็นแถว ใครสักคนเคยนับอะไรไว้ตรงนั้น นับไปหลายสิบขีด

        {name}ตอกแผ่นเลขไว้เหนือประตูบ้าน คนที่มาบ้านถามว่าบ้านเลขเก้าหรือ {name}บอกว่าใช่
      effects: { gold: -1, flags: [bought_pot_nines_plate] }
    - id: sit_with_morla
      label: นั่งลงบนลังข้างมอร์ลา ดูหม้อลงเตาหลอมจนหมด
      text: |
        มอร์ลาไม่ได้พูดกับ{name}ทั้งบ่าย นับหม้อที่ลงเตาเบาๆ ทีละใบ บอกชื่อคนที่เคยนั่งเฝ้าแต่ละใบ หม้อเบอร์หกคนนี้ เบอร์เจ็ดคนนี้ นางจำได้ทุกใบ ถึงหม้อเบอร์เก้านางหยุดนับ ไม่บอกชื่อ

        หม้อเบอร์สิบลงเป็นใบสุดท้าย นางลุกขึ้นให้หลานจูงกลับ ผ่าน{name}ไปแล้วหันกลับมาบอกว่าเบอร์สิบ เด็กคนนั้นนั่งตัวตรงดี
      effects: { flags: [watched_the_pots_melt] }

- id: adult.back_moth_lamp
  stage: adult
  weight: 30
  when:
    age: [41, 56]
    flags: [dew_lamp_trick]
    location_tag: ventras
  text: |
    สมาคมโรงกลั่นติดประกาศขายตะเกียงล่อแมลงหึ่งทั่วย่าน ตะเกียงน้ำมันธรรมดาที่หยดน้ำค้างดาวลงไส้ ไฟเปลี่ยนเป็นสีฟ้าซีด ฝูงปีกใสลงจากจานมาวนรอบไฟแทน ดวงละสามเหรียญ ประกาศบอกว่าช่างของสมาคมคิดขึ้นได้เมื่อหน้าร้อนปีกลาย

    ไฟสีฟ้าซีดดวงแรกที่{name}รู้จัก แขวนอยู่ปลายตรอกริมน้ำ ตั้งแต่{name}ยังเป็นเด็กโรงกลั่น

    หน้าร้อนนี้แมลงหึ่งมามากอีกปี ผู้ใหญ่ในตรอกหาวกันตั้งแต่หัวค่ำ ตรอกนี้ไม่มีบ้านไหนมีเงินสามเหรียญซื้อตะเกียง
  choices:
    - id: make_them_again
      label: ขอหยดก้นขวดจากอ่างล้าง ทำตะเกียงให้ทั้งตรอกด้วยมือตัวเอง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          สองหยดต่อไส้หนึ่งไส้ ไม่ใช่สาม สามหยดไส้ไหม้หมดในพริบตา {name}จำได้ ทำไปสิบสองดวง แขวนไว้ทุกหัวมุมของตรอกกับริมน้ำ ฝูงปีกใสลงมาจากจานบนหลังคาโรงกลั่น วนรอบไฟสีฟ้าจนสาง

          ตรอกนั้นหลับเต็มคืนเป็นตรอกแรกของย่าน ช่างของสมาคมเดินมาดูในสัปดาห์ต่อมา นับตะเกียงที่แขวนอยู่ นับสองรอบ แล้วจดอะไรลงสมุด
        effects: { stats: { DEX: 1 }, flags: [lit_the_alley_with_dew_lamps] }
      failure:
        text: |
          ดวงที่สามหยดเกินไปหยดเดียว ไส้ลุกพรึ่บ ควันสีน้ำเงินพุ่งขึ้นไปเกาะเพดานห้องเช่าเป็นคราบฟ้า เจ้าของห้องมาด่าตอนเช้า คิดค่าทาสีใหม่สองเหรียญ

          ตะเกียงที่เหลือเก้าดวงใช้ได้ แขวนไว้ทั่วตรอก ตรอกหลับได้ คราบฟ้าบนเพดานเรืองแสงจางๆ ทุกคืนไปอีกเดือน ใช้แทนตะเกียงได้ตอนลุกไปส้วมกลางดึก
        effects: { gold: -2, flags: [lit_the_alley_with_dew_lamps] }
    - id: claim_it_at_the_guild
      label: ไปที่สำนักงานสมาคม บอกเสมียนว่าตะเกียงแบบนี้ใครแขวนเป็นคนแรก
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          เสมียนไม่เชื่อ จน{name}บอกว่าตะเกียงดวงแรกแขวนไว้ปลายตรอกไหน ริมน้ำตรงไหน และควันของดวงที่ไหม้ทิ้งคราบไว้บนผนังห้องเช่าหลังไหน เสมียนส่งคนไปดู ผนังห้องเช่าหลังนั้นยังมีรอยฟ้าจางๆ อยู่ใต้สีที่ทาทับ

          สมาคมจ่ายค่าบอกสี่เหรียญ ไม่ได้แก้ประกาศ แต่เขียนชื่อ{name}ลงสมุดของสมาคมไว้บรรทัดหนึ่ง ตัวเล็กกว่าชื่อช่าง
        effects: { gold: 4, stats: { CHA: 1 }, flags: [claimed_the_dew_lamp] }
      failure:
        text: |
          เสมียนฟังจบแล้วถามว่ามีพยานไหม {name}นึกหน้าคนที่เห็นตะเกียงดวงนั้นได้ครึ่งตรอก ครึ่งหนึ่งย้ายไปแล้ว อีกครึ่งจำไม่ได้แล้ว เสมียนบอกว่าทุกคนในย่านนี้เคยคิดตะเกียงดวงนั้นได้ก่อนช่างของสมาคมทั้งนั้น

          {name}ออกจากสำนักงานมาตอนเที่ยง ประกาศขายตะเกียงติดอยู่ที่ประตูสำนักงาน ข้างล่างมีคนเขียนด้วยถ่านว่าแพง
        effects: { reputation: { distillers: -1 }, flags: [claimed_the_dew_lamp] }
    - id: buy_one_for_the_alley
      label: ซื้อตะเกียงของสมาคมหนึ่งดวง แขวนไว้กลางตรอก
      text: |
        ตะเกียงของสมาคมทำดีกว่าที่{name}เคยทำ ไส้หนากว่า หยดพอดี แก้วครอบกันลม แขวนไว้กลางตรอกได้ดวงเดียว ฝูงปีกใสลงมาวนรอบดวงเดียวนั้นจนแน่นเป็นก้อน

        บ้านกลางตรอกหลับเต็มคืน บ้านหัวท้ายตรอกยังหาว ผ่านไปสามคืน บ้านหัวตรอกมาขอยืมตะเกียงไปแขวนหน้าบ้านตัวเองบ้าง สลับกันคืนละบ้าน
      effects: { gold: -3, alignment: { moral: 1 }, flags: [bought_a_moth_lamp_for_the_alley] }
    - id: fix_their_design
      label: ไปบอกช่างของสมาคมว่าไส้ของเขาเปลืองน้ำค้างไปหนึ่งหยด
      requires: { class: wizard }
      text: |
        ช่างของสมาคมเป็นชายหนุ่มเพิ่งจบจากสำนักช่าง ฟัง{name}จนจบ แล้วลองตามที่บอกตรงนั้น สองหยดแทนสาม ไส้บางลงครึ่งหนึ่ง ไฟสีฟ้าติดนานกว่าเดิมเกือบเท่าตัว

        สมาคมลดราคาตะเกียงเหลือสองเหรียญในเดือนต่อมา ช่างหนุ่มส่งตะเกียงรุ่นใหม่มาให้{name}หนึ่งดวง ผูกกระดาษติดไว้ บอกว่าดวงนี้ไม่คิดเงิน ดวงหน้าคิด
      effects: { stats: { INT: 1 }, reputation: { distillers: 1 }, flags: [fixed_the_guilds_moth_lamp] }

# ---------- คนแคระ ----------

- id: adult.back_marked_arm
  stage: adult
  weight: 30
  when:
    age: [41, 60]
    flags: [marked_an_arm]
  text: |
    ร้านรับซื้อของเก่าที่{name}แวะไปหาหัวค้อน แขวนแขนกลข้างหนึ่งไว้บนตะขอหลังร้าน แขนขวาของนายทหาร แบบที่ราชนาวีสั่งทำเป็นสิบๆ แขนหลังสงครามถ่าน ข้อนิ้วทองเหลืองหมองหมดทุกข้อ ไม่มีใครขัด

    {name}พลิกข้อนิ้วชี้ขึ้นดู ใต้ข้อมีรอยขูดเล็กจนต้องเอียงหาแสง เครื่องหมายตระกูลของ{name} ลายมือเด็กที่ถือเหล็กแหลมยังไม่ถนัด ป้ายผูกข้อมือเขียนชื่อเจ้าของไว้ว่าฮัลวิค มอร์แลน

    เจ้าของร้านบอกว่ามีคนเอามาจำนำตั้งแต่สามหน้าหนาวก่อน ไม่มาไถ่ ขายหกเหรียญ ถ้าไม่มีใครซื้อ พรุ่งนี้คนรับซื้อทองเหลืองจะมาชั่งน้ำหนักไป
  choices:
    - id: buy_the_arm
      label: จ่ายหกเหรียญ ซื้อแขนข้างนั้นกลับบ้าน
      requires: { min_gold: 6 }
      text: |
        {name}ขัดข้อนิ้วทีละข้อทั้งคืน สามสิบเอ็ดข้อ จนส่องเห็นหน้า ข้อนิ้วชี้ขัดเป็นข้อสุดท้าย ขัดรอบๆ รอยขูด ไม่ขัดทับ

        แขนข้างนั้นแขวนไว้บนผนังห้องทำงาน นิ้วงอเป็นท่ากำหลวมๆ ใครมาเห็นก็ถามว่าของใคร {name}บอกชื่อตามป้าย แล้วบอกว่าเจ้าของยังไม่มาเอาคืน
      effects: { gold: -6, flags: [bought_back_the_marked_arm] }
    - id: trace_the_officer
      label: จดชื่อบนป้ายไว้ แล้วตามหาว่าฮัลวิค มอร์แลนอยู่ที่ไหน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ทะเบียนของราชนาวีบอกแค่ว่าปลดประจำการ สมุดค่าเช่าของโรงพักคนเรือแก่ที่ท่าเรือบอกต่อว่ายังอยู่ ห้องที่สิบสอง ค้างค่าเช่าสองเดือน ฮัลวิคแขนขวาว่างอยู่ในแขนเสื้อที่พับกลัดเข็มไว้ ฟังเรื่องร้านรับซื้อของเก่าแล้วหัวเราะ บอกว่าจำนำไว้จ่ายค่าเช่า กะว่าจะไปไถ่ แล้วก็ไม่ได้ไป

          {name}ไถ่แขนคืนมาสี่เหรียญ ใส่ให้ถึงห้อง ฮัลวิคขยับนิ้วทีละนิ้ว ถึงนิ้วชี้เขาหยุด บอกว่ารู้มาตั้งแต่ปีแรกว่ามีรอยอะไรอยู่ใต้ข้อนี้ ไม่เคยรู้ว่าของใคร
        effects:
          gold: -4
          stats: { INT: 1 }
          flags: [returned_the_marked_arm]
          people: [{ id: officer_halvik, name: ฮัลวิค มอร์แลน, gender: m, bond: friend, closeness: 1, age: 72 }]
      failure:
        text: |
          ทะเบียนของราชนาวีบอกแค่ว่าปลดประจำการ ไม่บอกว่าไปไหน โรงพักคนเรือแก่ไม่มีชื่อนี้ ร้านเหล้าแถวท่าเรือมีคนรู้จักสามคน บอกที่อยู่สามที่ ไม่ตรงกันสักที่

          {name}กลับไปที่ร้านรับซื้อของเก่าในวันที่สาม ตะขอหลังร้านว่าง คนรับซื้อทองเหลืองมาชั่งไปตั้งแต่เมื่อวานซืน เจ้าของร้านคืนป้ายชื่อให้ป้ายเดียว บอกว่าป้ายไม่มีราคา
        effects: { flags: [lost_the_marked_arm_to_the_scales] }
    - id: refit_the_arm
      label: ซื้อมาซ่อมข้อที่ฝืดให้ลื่นทุกข้อ แล้วขายต่อให้คนงานท่าที่แขนขาดในราคาทุน
      requires: { any_flags: [job_smith, job_artificer] }
      text: |
        ข้อนิ้วสามข้อเป็นสนิมข้างใน ลานข้อศอกล้า {name}ถอดออกทั้งแขน ล้าง หยอดน้ำมัน เปลี่ยนลาน ประกอบคืน นิ้วงอลื่นทุกข้อ เหมือนวันแรกที่ออกจากโต๊ะในโรงช่างของตระกูล

        คนงานท่าที่ซื้อไปแขนขวาขาดจากรอกหล่น จ่ายหกเหรียญเท่าที่{name}ซื้อมา ไม่รู้เรื่องรอยใต้ข้อนิ้วชี้ {name}ไม่ได้บอก เดือนต่อมาเขามาบอกว่าแขนดี ยกกระสอบได้ทีละสองใบ
      effects: { stats: { DEX: 1 }, flags: [refitted_the_marked_arm] }
    - id: leave_the_arm
      label: วางข้อนิ้วกลับ แล้วออกจากร้านไปพร้อมหัวค้อนที่ตั้งใจมาซื้อ
      text: |
        {name}จ่ายค่าหัวค้อน ไม่ได้หันไปมองหลังร้าน คืนนั้นนิ้วชี้ขวาของ{name}เองคันอยู่ใต้ข้อ เกาจนแดง

        เช้าวันต่อมาเกวียนของคนรับซื้อทองเหลืองผ่านหน้าบ้าน กระสอบบนเกวียนดังกรุ๊งกริ๊งทุกครั้งที่ล้อตกหลุม
      effects: { flags: [left_the_marked_arm] }

- id: adult.back_nameless
  stage: adult
  scene: clan_hall
  weight: 30
  when:
    age: [41, 60]
    any_flags: [helped_nameless, gave_name_to_nameless]
  text: |
    สภาตระกูลประกาศในวงประชุมว่าชื่อบนฝาห้องศพแนวเก่าในผนังเสาของออสซาสึกจนอ่านยาก สิ่วของคนในทางเดินที่ขึ้นไปลงซ้ำกันปีละชื่อตามไม่ทัน พ้นเดือนที่หนาวที่สุดเมื่อไรจะจ้างช่างสลักมาเซาะใหม่ทั้งแนว ทุกคนในตระกูลที่ยังมีชื่อต้องลงไปอ่านแถวของบ้านตัวเองให้ช่างฟัง ทีละชื่อ ช่างจะได้เซาะไม่ผิดตัว คนที่อยู่ไกลก็ต้องกลับมา

    แนวห้องศพของตระกูล{name}อยู่เลยทางแยกไปทางซ้าย ทางแยกที่{name}เคยหลงขบวนตอนเด็ก ที่มีคนแคระผิวซีดคนหนึ่งเอานิ้วไล่ตามชื่อบนผนังทีละชื่อ นิ้วไม่มีเงา ทั้งที่ตะเกียงอยู่ห่างไปแค่สามก้าว

    ช่างสลักตั้งตะเกียงไว้ตรงทางแยก ห่มผ้าสองผืน บอกว่าทุกแนวในผนังเสาเย็น แต่ตรงนี้เย็นกว่าที่อื่น ช่างทุกคนไม่ชอบทำงานตรงทางแยกนี้
  choices:
    - id: read_every_name_at_the_fork
      label: อ่านทุกชื่อบนผนังตรงทางแยกให้ช่างฟัง ทุกห้อง ทุกบ้าน
      requires: { flag: helped_nameless }
      check: { stat: CON, dc: 14 }
      success:
        text: |
          {name}อ่านจนเสียงแหบ ชื่อตัว ชื่อตระกูล ปีเกิด ปีตาย ทีละห้อง ช่างเซาะตามเสียง ลมหายใจเป็นควันทั้งสองคน ตรงห้องหนึ่งฝามีรอยสกัดเรียบ ไม่มีชื่อ {name}หยุดอ่านตรงนั้นครู่หนึ่ง แล้วอ่านห้องถัดไป

          เสร็จตอนตะเกียงใกล้หมดน้ำมัน ช่างบอกว่าลงมาทำตรงทางแยกนี้กี่หนก็ต้องขึ้นไปผิงไฟกลางคัน หนนี้เพิ่งได้ทำจนจบรวดเดียว ตะเกียงตั้งตรงอยู่ทั้งคืน ไฟไม่ส่ายสักครั้ง
        effects: { stats: { CON: 1 }, flags: [read_the_fork_names_aloud] }
      failure:
        text: |
          อ่านไปได้สองห้อง ปากของ{name}ชาจนออกเสียงชื่อผิด ช่างเซาะตามไปตัวหนึ่งก่อนรู้ตัว ต้องเกลี่ยหินทิ้ง {name}อ่านต่อไปทั้งฟันกระทบกัน จนช่างสั่งให้หยุด ลากขึ้นไปผิงไฟข้างบน

          คืนนั้น{name}ไข้ขึ้น ฝันว่าอ่านชื่อต่อจนจบแนว ตื่นมาจำได้แค่ว่ามีห้องหนึ่งที่ไม่มีชื่อให้อ่าน
        effects: { hp: -2, flags: [read_the_fork_names_aloud] }
    - id: a_door_without_a_name
      label: ขอช่างสลักรูปประตูปิดเล็กๆ ไว้บนฝาห้องที่โดนสกัดชื่อออก
      requires: { flag: gave_name_to_nameless }
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          ช่างไม่ยอมทีแรก บอกว่าผนังของออสซาไม่มีห้องไร้ชื่อ ห้องที่โดนสกัดชื่อคือคนที่ตระกูลไม่นับแล้ว {name}บอกว่าไม่ได้ขอให้สลักชื่อ ขอแค่ประตู ประตูของออสซาเป็นของทุกคนที่ตาย ไม่ว่าตระกูลจะนับหรือไม่

          ช่างสลักประตูปิดขนาดเท่าเล็บมือไว้มุมล่างของฝาห้องนั้น ตอนเซาะเสร็จ{name}ได้ยินเสียงชื่อของตัวเองทวนเบาๆ ช้าๆ ทีละพยางค์ ก้องมาจากที่ไหนสักแห่งในแนวห้องศพ ช่างไม่ได้ยิน หรือทำเป็นไม่ได้ยิน
        effects: { stats: { CHA: 1 }, flags: [carved_a_door_for_the_nameless] }
      failure:
        text: |
          ช่างไม่ยอม บอกว่าถ้าสลักให้ สภาตระกูลจะไม่จ่ายค่าแรงทั้งแนว {name}เสนอจ่ายเอง ช่างก็ยังไม่ยอม บอกว่าไม่ใช่เรื่องเงิน

          ก่อนขึ้นจากผนังเสา{name}เอาปลายนิ้วขีดรูปประตูลงบนฝุ่นของฝาห้องนั้นเอง ขีดเบาๆ ฝุ่นในผนังเสาไม่มีลมพัด รอยนั้นอยู่ได้นาน
        effects: { flags: [carved_a_door_for_the_nameless] }
    - id: read_my_line_only
      label: อ่านแถวของบ้านตัวเองให้ครบ แล้วรีบขึ้นไปข้างบน
      text: |
        แถวของบ้าน{name}มีสิบเอ็ดชื่อ {name}อ่านจนจบ ช่างเซาะตาม ไม่มีชื่อไหนผิด ตะเกียงตรงทางแยกส่ายไปมาตลอดเวลาที่อ่าน ช่างบอกว่าเป็นอย่างนี้ทุกคน

        ขึ้นมาถึงข้างบน{name}ยืนผิงไฟในห้องโถงของตระกูลจนนิ้วกลับมาแดง ญาติที่ลงไปอ่านก่อนหน้ายืนผิงอยู่ข้างๆ ไม่มีใครพูดถึงทางแยกนั้น
      effects: { flags: [read_my_own_line] }
    - id: pay_for_the_unclaimed
      label: จ่ายค่าเซาะชื่อในห้องที่ไม่มีบ้านไหนมาอ่านให้
      text: |
        ห้องศพที่ไม่มีใครในตระกูลมาอ่านมีเจ็ดห้อง ชื่อสึกจนช่างต้องเอานิ้วคลำ {name}จ่ายสามเหรียญ ช่างคลำทีละตัวอักษร เซาะเท่าที่คลำได้ ตัวไหนคลำไม่ได้เว้นไว้

        เจ็ดห้องนั้นได้ชื่อกลับมาครึ่งๆ กลางๆ บางห้องเหลือแต่ชื่อตระกูล บางห้องเหลือแต่ปีเกิด ช่างบอกว่าดีกว่าไม่มี
      effects: { gold: -3, alignment: { moral: 1 }, flags: [paid_for_the_unclaimed_names] }

- id: adult.back_cloth_merchant
  stage: adult
  weight: 30
  when:
    age: [41, 58]
    any_flags: [saved_cloth_merchant, rode_ore_tram]
    location_tag: hordun
  text: |
    พัสดุจากอาร์เวลมากับรถไฟขบวนต้นเดือน ห่อผ้าดิบมัดเชือกป่าน ข้างในเป็นผ้าทอสีแดงเข้มม้วนหนึ่ง เนื้อหนา ลายดอกข้าวทั้งผืน แบบที่พ่อค้าผ้าจากอาร์เวลเคยแบกขึ้นมาขายในทุนดาร์ทุกต้นเดือน ก่อนคืนที่พายุหิมะลงมาตอนบ่ายวันตลาด และม้าตัวหนึ่งเดินกลับขึ้นเขามาตัวเดียว อานยังอยู่บนหลัง

    ในม้วนผ้ามีจดหมายของอัลเดน ลูกชายพ่อค้าผ้า เด็กที่ชอบนั่งห้อยขาบนขอบถนนวนแล้วถามคนแคระทุกคนว่าทำไมชอบขุดลึก ลูกสาวของเขาจะแต่งงานเดือนหน้าที่เมืองตลาดในอาร์เวล เขาเขียนว่าที่นั่งหัวโต๊ะงานแต่งบ้านเขาเป็นของผู้ใหญ่ที่สุดในบ้าน ปีนี้เขาอยากให้{name}นั่ง เพราะถ้าไม่มีคืนนั้น ก็ไม่มีบ้านนี้ ไม่มีงานนี้

    ท้ายจดหมายเขาวาดแผนที่ทางจากสถานีรถไฟไปบ้านไว้ให้ ลายเส้นเหมือนเด็กวาด
  choices:
    - id: sit_at_the_head
      label: ขึ้นรถไฟลงไปอาร์เวล นั่งหัวโต๊ะงานแต่งตามที่ขอ
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          อัลเดนตัวสูงกว่า{name}เกือบสองหัวแล้ว ผมบางจนเห็นหนังหัว ต้องย่อเข่าลงมากอด{name} ตอนยกชามไฟ เจ้าสาวกับเจ้าบ่าวถือชามเดินจากแท่นไปถึงประตู น้ำมันหกหยดหนึ่ง แขกหัวเราะ ป้าคนหนึ่งบอกว่าบ้านนี้จะแย่งผ้าห่มกัน

          ถึงคราว{name}ต้องพูดที่หัวโต๊ะ {name}เล่าเรื่องโค้งที่สามสั้นๆ ไม่เกินห้าประโยค แล้วยกถ้วยให้เจ้าสาว แขกทั้งงานยกถ้วยตาม อัลเดนร้องไห้ตั้งแต่ประโยคที่สองจนจบงาน
        effects:
          stats: { CHA: 1 }
          flags: [sat_at_the_head_of_aldens_table]
          people: [{ id: cloth_alden, name: อัลเดน, gender: m, bond: friend, closeness: 2, age: 49 }]
      failure:
        text: |
          {name}เตรียมคำพูดมาทั้งทางบนรถไฟ ถึงเวลาพูดจริงลืมหมด เหลือแต่คำภาษาคนแคระที่ใช้ตอนถอนหายใจ พูดออกไปสองคำ แขกทั้งงานเงียบรอฟังคำที่สาม

          อัลเดนลุกขึ้นแปลให้ทั้งงานฟัง แปลยาวกว่าที่{name}พูดสิบเท่า เล่าเรื่องโค้งที่สามเองทั้งเรื่อง แขกปรบมือให้{name} {name}นั่งหัวโต๊ะต่อไปจนงานเลิก ไม่ได้พูดอะไรอีกเลย กินจนอิ่มกว่าทุกคน
        effects:
          flags: [sat_at_the_head_of_aldens_table]
          people: [{ id: cloth_alden, name: อัลเดน, gender: m, bond: friend, closeness: 2, age: 49 }]
    - id: send_a_stone
      label: ไม่ไป แต่สลักหินก้อนเล็กเป็นรูปโค้งที่สามส่งไปเป็นของขวัญ
      text: |
        {name}เลือกหินจากทางเกวียนช่วงโค้งที่สามเอง สลักเป็นรูปทางโค้งกับชะง่อนหินเหนือทาง ใต้ชะง่อนสลักคนสองคนนั่งกอดกันตัวเท่าเมล็ดข้าว ส่งลงไปกับรถไฟขบวนเดียวกับที่พัสดุขึ้นมา

        เดือนต่อมามีจดหมายตอบ อัลเดนเขียนว่าวางหินไว้กลางโต๊ะงานแต่ง แขกถามกันทั้งงานว่าเป็นรูปอะไร เขาเล่าจนเสียงแหบ เจ้าสาวขอหินไปตั้งในบ้านใหม่
      effects: { stats: { DEX: 1 }, flags: [sent_alden_a_carved_stone] }
    - id: keep_the_cloth
      label: เขียนตอบว่าไปไม่ได้ เก็บผ้าไว้ตัดเสื้อตัวใหม่
      text: |
        ผ้าทอของอาร์เวลหนาเกินจะใส่ทำงาน เหมาะกับคนที่ยืนรอรถไฟบนชานชาลาตอนหน้าหนาว {name}ให้ช่างตัดเสื้อคลุมได้หนึ่งตัว เหลือเศษพอทำผ้าพันคอ

        วันงานแต่ง{name}ใส่เสื้อคลุมตัวนั้นออกจากบ้าน คนข้างบ้านถามว่าไปงานใครมา {name}บอกว่างานคนที่ไม่เคยเห็นหน้า
      effects: { alignment: { law: 1 }, flags: [kept_aldens_cloth] }

# ---------- เอลฟ์ ----------

- id: adult.back_sapling
  stage: adult
  weight: 30
  when:
    age: [41, 60]
    any_flags: [elf_sapling_edge, elf_sapling_deep, elf_sapling_near_eldest]
    location_tag: ileth
  text: |
    ช่างสำรวจของราชสำนักเดินผ่านป่ามาสองวัน ถือถังสีขาวกับแปรง ทาวงสีขาวรอบลำต้นทุกต้นที่ทางเกวียนสายใหม่จะผ่าน ค่ายตัดไม้จะตามมาหลังหิมะละลาย

    ต้นสนของ{name}มีวงสีขาวคาดอยู่ระดับอก ต้นที่เคยเป็นกล้าห่อรากด้วยมอสชื้น ที่{name}ถือเดินหาที่ปลูกอยู่ทั้งเช้าจนมอสเริ่มแห้ง ตอนนี้สูงพ้นหัวคนปลูกไปหลายช่วงตัว ยังเล็กกว่าต้นรอบข้างทุกต้น สำหรับป่านี้ยังเป็นเด็ก

    คนบ้านกิ่งลมลงมายืนดูวงสีขาวกันทีละต้น ใครเจอต้นของตัวเองก็ยืนอยู่ตรงนั้นนานกว่าต้นอื่น
  choices:
    - id: stand_by_the_tree
      label: ไปยืนพิงต้นสนของตัวเองในวันที่คนตัดไม้มาถึง
      check: { stat: CON, dc: 14 }
      success:
        text: |
          {name}ยืนพิงลำต้นตั้งแต่ก่อนสาง หิมะเม็ดสุดท้ายของปีตกใส่บ่า หัวหน้าคนตัดไม้มาถึงตอนสาย มองคนพิงต้นไม้ มองวงสีขาว แล้วนับต้นในแนวทาง ขาดไปหนึ่งต้นก็ยังพอ

          เขาเอาแปรงจุ่มสีดำ ทาทับวงสีขาวบนต้นของ{name} บอกลูกน้องว่าต้นนี้ตัดแล้วทางเบี้ยว ทางเกวียนสายใหม่โค้งอ้อมไปทางซ้ายสามก้าว
        effects: { stats: { CON: 1 }, taboo: { forest: keep }, flags: [stood_by_my_pine] }
      failure:
        text: |
          {name}ยืนพิงลำต้นได้จนเที่ยง หัวหน้าคนตัดไม้ส่งคนไปตามทหาร ทหารสองนายแบก{name}ออกจากต้นสนไปวางไว้ริมทาง จับแขนไว้จนเลื่อยกินเข้าเนื้อไม้ครึ่งต้น

          ต้นสนล้มช้ากว่าต้นอื่น {name}นับวงปีบนตอได้ไม่ถึงครึ่งของต้นข้างๆ แล้วเก็บกิ่งยอดที่ยังเขียวกลับขึ้นบ้านกิ่งลม ไหล่มีรอยมือทหารเขียวช้ำอยู่ครึ่งเดือน
        effects: { hp: -1, flags: [stood_by_my_pine, my_pine_was_felled] }
    - id: buy_a_licence
      label: ลงไปห้องเสมียนหลวงในเมือง จ่ายค่าใบอนุญาตไม้ยืนต้น
      requires: { min_gold: 5 }
      text: |
        ใบอนุญาตไม้ยืนต้นมีจริง แต่ไม่มีใครในบ้านกิ่งลมเคยซื้อ ไม่มีใครเคยคิดว่าต้องซื้อต้นไม้ที่ตัวเองปลูก เสมียนคิดห้าเหรียญ ตอกป้ายดีบุกมีเลขให้แผ่นหนึ่ง ให้เอาไปตอกไว้ที่ต้น

        {name}ตอกป้ายดีบุกทับวงสีขาวพอดี คนบ้านกิ่งลมมาดูป้าย บางคนลงไปห้องเสมียนหลวงในวันต่อมา บางคนไม่ไป เพราะไม่มีเงินห้าเหรียญหรือเพราะไม่ยอมจ่าย
      effects: { gold: -5, alignment: { law: 1 }, flags: [bought_a_standing_tree_licence] }
    - id: show_a_better_line
      label: พาช่างสำรวจเดินดูทางที่ดินแน่นกว่า น้ำไม่ขัง และไม่ต้องตัดต้นไม้มากเท่า
      requires: { any_flags: [job_guide, job_scout] }
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          {name}พาเดินตามสันเนินที่สัตว์ใช้ข้ามมาหลายร้อยปี ดินแน่น ต้นไม้ห่าง ลำธารข้ามได้ตรงที่ตื้นที่สุด ช่างสำรวจเดินตามด้วยรองเท้าเปียก จดลงสมุด แล้วนับต้นไม้ในแนวใหม่ น้อยกว่าแนวเดิมเกือบครึ่ง

          ทางเกวียนสายใหม่ย้ายไปตามสันเนิน วงสีขาวบนต้นของ{name}กับต้นอีกหลายสิบต้นค่อยๆ ลอกหายไปกับฝนในหน้าฝนนั้น
        effects: { stats: { WIS: 1 }, flags: [moved_the_road_to_the_ridge] }
      failure:
        text: |
          สันเนินที่{name}จำได้มีต้นไม้ล้มขวางอยู่สามต้นตั้งแต่พายุหน้าหนาวที่แล้ว ช่างสำรวจปีนข้ามไปสองต้น ต้นที่สามเขาหันหลังกลับ บอกว่าทางเดิมดีแล้ว ราชสำนักไม่จ่ายค่าปีนต้นไม้

          ทางเกวียนสายใหม่ยังผ่านแนวเดิม {name}เดินกลับมาทางเดิมคนเดียว ผ่านวงสีขาวทีละต้น นับได้สี่สิบเจ็ดต้นก่อนถึงต้นของตัวเอง
        effects: { flags: [moved_the_road_to_the_ridge, the_ridge_was_blocked] }
    - id: gather_the_cones
      label: เก็บลูกสนจากต้นของตัวเองให้หมดก่อนหิมะละลาย แล้วเอาไปฝังลึกเข้าไปในป่า
      text: |
        ลูกสนบนต้นของ{name}มีไม่ถึงสามสิบลูก ต้นยังเด็ก ออกลูกได้น้อย {name}ปีนเก็บทีละลูก แกะเมล็ดใส่ถุง แล้วเดินลึกเข้าไปในป่าครึ่งวัน ฝังเมล็ดทีละเมล็ดตามซอกรากต้นเก่า

        ค่ายตัดไม้มาถึงหลังหิมะละลายตามกำหนด ต้นของ{name}ล้มในวันที่สอง ปลายหน้าฝนปีนั้น{name}กลับเข้าไปในป่าลึก หากล้าที่งอกได้สองต้น สูงไม่ถึงข้อนิ้ว
      effects: { alignment: { moral: 1 }, flags: [buried_my_pines_seeds_deep] }

- id: adult.back_noric
  stage: adult
  weight: 30
  when:
    age: [41, 58]
    any_flags: [noric_healed, noric_carried, threatened_camp]
    location_tag: ileth
  text: |
    ค่ายตัดไม้เปิดใหม่ข้างลำธารฝั่งตะวันออก ค่ายเก่าปิดไปนานจนหญ้าขึ้นคลุมตอ คนงานรุ่นใหม่มาจากบ้านตีนไม้กับเมืองชายป่า ปีนต้นไม้ผูกเชือกแบบที่โนริคเคยปีน

    บ่ายวันหนึ่งผู้หญิงสองคนจากบ้านตีนไม้ปีนบันไดเชือกขึ้นมาถึงบ้านกิ่งลม หอบจนพูดไม่เป็นคำ ลูกชายคนหนึ่งของบ้านตีนไม้ตกจากกิ่งสูง ขาหักผิดรูปใต้เข่า นอนอยู่บนรากไม้ คนแก่บ้านตีนไม้บอกให้ขึ้นมาหา{name} เพราะตอนเด็กๆ มีเอลฟ์คนหนึ่งเคยทำอะไรให้เด็กชื่อโนริค เรื่องนี้เล่ากันในบ้านตีนไม้จนเด็กรุ่นนี้ท่องได้

    {name}ยังเห็นภาพนั้นชัด เด็กหน้าซีดจนปากเป็นสีเดียวกับหน้า นอนบนรากไม้แล้วยังพูดตลก ส่วนโนริคเองไม่ได้อยู่ในถิ่นนี้มาหลายปีแล้ว
  choices:
    - id: carry_him_up
      label: แบกเด็กขึ้นบ้านกิ่งลมไปให้ผู้เฒ่าดู เหมือนคราวนั้น
      requires: { flag: noric_healed }
      check: { stat: STR, dc: 14 }
      success:
        text: |
          {name}ผูกเด็กไว้กับหลังด้วยเชือกของค่าย ปีนบันไดเชือกทีละขั้น หลังไม่เหมือนเดิม แต่ขาจำทางได้ ผู้เฒ่ายืนรออยู่ที่หัวบันไดอีกครั้ง ไม่ต้องถามอะไร หลีกทางให้ตั้งแต่เห็น

          คนบ้านตีนไม้ยืนแหงนหน้าดูอยู่ข้างล่างจนมืด ตอนเช้าเด็กลงบันไดมาบนแคร่ ขาดามด้วยไม้สนตรงทั้งสองข้าง คนแก่บ้านตีนไม้บอกเด็กรุ่นนี้ว่าเรื่องที่ท่องกันมาตอนนี้มีสองเรื่องแล้ว
        effects: { stats: { STR: 1 }, flags: [carried_another_boy_up] }
      failure:
        text: |
          บันไดขั้นที่สิบสอง หลังของ{name}ลั่นดังกึก มือเกาะเชือกไว้ได้แต่ขึ้นต่อไม่ได้ คนบนกิ่งต้องหย่อนเชือกลงมาสามเส้น ดึงทั้ง{name}ทั้งเด็กขึ้นไปด้วยกัน

          ผู้เฒ่าจัดกระดูกให้เด็กก่อน แล้วจัดหลังให้{name}ต่อ {name}นอนคว่ำอยู่บนกิ่งเจ็ดวัน เด็กลงบันไดไปก่อน{name}สามวัน ยังหันมาโบกมือให้จากแคร่
        effects: { hp: -2, flags: [carried_another_boy_up] }
    - id: splint_and_walk
      label: ดามขาเด็กด้วยกิ่งตรงสองกิ่ง แล้วแบกลงไปบ้านตีนไม้ตามทางเดิม
      requires: { flag: noric_carried }
      check: { stat: CON, dc: 14 }
      success:
        text: |
          {name}หักกิ่งตรงสองกิ่ง ฉีกแขนเสื้อมัดเหมือนคราวนั้น ทางลงเนินไปบ้านตีนไม้เปลี่ยนไปบ้าง มีสะพานไม้ข้ามลำธารที่เมื่อก่อนต้องลุย แต่ยาวเท่าเดิม {name}เดินถึงก่อนมืดหนึ่งชั่วยาม

          แม่ของเด็กวิ่งออกมารับที่ปากหมู่บ้าน พูดขอบคุณยาวเหยียด ภาษาคนบ้านตีนไม้ปนคำเอลฟ์สองสามคำ คำที่คนรุ่นก่อนสอนกันมาไว้พูดกับคนบนกิ่ง
        effects: { stats: { CON: 1 }, flags: [carried_another_boy_down] }
      failure:
        text: |
          ครึ่งเนินขาของ{name}สั่น วางเด็กลงแล้วยกใหม่ไม่ขึ้น เหมือนคราวนั้นทุกอย่าง ต่างกันแค่คราวนี้{name}รู้ว่าต้องทำอะไรต่อ ตะโกนเรียกคนในค่ายตามแนวลำธาร

          คนงานสี่คนหามแคร่มาถึงตอนบ่ายแก่ {name}เดินตามแคร่ลงไปถึงบ้านตีนไม้ บอกหมอบ้านตีนไม้ว่ากระดูกหักตรงไหน หักกี่ท่อน หมอบอกว่าบอกมาถูกทุกอย่าง
        effects: { hp: -1, flags: [carried_another_boy_down] }
    - id: walk_into_the_camp
      label: เดินเข้าค่าย บอกหัวหน้าค่ายว่าต้องจ้างหมอเมืองเดี๋ยวนี้
      requires: { flag: threatened_camp }
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          หัวหน้าค่ายคนใหม่ยังหนุ่ม เคยได้ยินเรื่องเอลฟ์ที่เดินเข้ามาในค่ายเก่าแล้วบอกว่าถ้าไม่จ้างหมอ ค่ายจะไหม้ เขาไม่รอให้{name}พูดประโยคนั้น ส่งคนขี่ม้าไปตามหมอเมืองตั้งแต่{name}เดินมาถึงกระโจม

          หมอเมืองมาถึงก่อนค่ำ ดามขาให้ คิดเงินกับค่าย ค่ายจ่ายโดยไม่หักค่าแรงเด็ก หัวหน้าค่ายเดินมาส่ง{name}ถึงชายค่าย ถามว่าเรื่องที่เล่ากันนั้นจริงหรือ {name}บอกว่าครึ่งเดียว
        effects: { stats: { CHA: 1 }, flags: [made_the_new_camp_pay] }
      failure:
        text: |
          หัวหน้าค่ายคนใหม่ไม่เคยได้ยินเรื่องอะไรทั้งนั้น บอกว่าเด็กตกต้นไม้ก็ต้องพาไปหาหมอเอง ค่ายจ่ายค่าแรง ไม่ได้จ่ายค่าตก

          {name}จ่ายค่าหมอเมืองเองสามเหรียญ หมอดามขาให้ตอนค่ำ ตอนกลับ{name}เดินผ่านกระโจมหัวหน้าค่าย จุดไม้ขีดไฟก้านหนึ่ง ยืนถือจนไฟไหม้ถึงนิ้ว แล้วสะบัดดับ หัวหน้าค่ายเห็นจากในกระโจม
        effects: { gold: -3, flags: [made_the_new_camp_pay] }
    - id: pay_the_town_doctor
      label: ลงไปตามหมอเมืองเอง แล้วจ่ายค่าหมอให้
      text: |
        หมอเมืองคิดสามเหรียญ บวกค่าม้าอีกหนึ่ง มาถึงตอนพลบค่ำ ดามขาเด็กด้วยแผ่นไม้กับผ้าลงแป้ง แข็งเหมือนหิน เด็กร้องตอนดึงกระดูกเข้าที่แล้วหยุดร้องทันที ถามหมอว่าเดือนหน้าปีนต้นไม้ได้ไหม

        แม่ของเด็กเอาเงินมาคืน{name}ทีละเหรียญ เดือนละเหรียญ ครบสี่เดือนพอดี เหรียญสุดท้ายห่อมากับขนมแป้งทอดหนึ่งห่อ
      effects: { gold: -4, alignment: { moral: 1 }, flags: [paid_for_the_camp_boy] }
    - id: set_it_with_prayer
      label: ลงไปจัดกระดูกให้เองที่รากไม้ ตรงที่เด็กตก
      requires: { class: cleric }
      text: |
        {name}คุกเข่าลงข้างเด็ก ให้กัดเชือกไว้ ดึงทีเดียว กระดูกเข้าที่ ดามไว้ด้วยกิ่งสนกับเชือกของค่าย คนงานยืนล้อมดูเงียบกันทั้งค่าย บางคนแตะหน้าผากตัวเองตาม

        ขาเด็กหายตรง ไม่กะเผลก ปีนต้นไม้ได้อีกในหน้าฝนถัดมา คนบ้านตีนไม้เพิ่มเรื่องนี้เข้าไปในเรื่องที่เล่ากัน เล่าผิดไปครึ่งหนึ่ง {name}ไม่ได้แก้
      effects: { stats: { WIS: 1 }, flags: [set_the_camp_boys_leg] }

- id: adult.back_orival
  stage: adult
  scene: fort
  weight: 30
  when:
    age: [41, 60]
    any_flags: [orival_lookout, orival_wounded, stopped_orival]
    location_tag: ileth
  text: |
    ประกาศของราชสำนักติดอยู่ที่ประตูค่ายทหารบ้านตีนไม้ ไม่ใช่ประกาศจับ เป็นประกาศว่าผู้พิพากษาจากเมืองหลวงจะมาฟังความเรื่องเอลฟ์ชื่อโอรีวัลในโถงของค่าย ปลายเดือนนี้ ผู้ใดเคยรู้จัก เคยเห็น หรือมีเรื่องจะพูดถึง ให้มาลงชื่อกับเสมียน

    โอรีวัลนั่งอยู่ในห้องขังหลังค่าย ผมยังยาวลงมาถึงกลางหลัง แต่ไม่ได้ถักแล้ว ไม่มีเชือกป่าน {name}จำเขาได้จากคืนที่เขามานั่งห้อยขาอยู่ข้างๆ บนกิ่งนอกบ้าน บอกว่าทหารเฝ้ายามสองคนต่อกะ และเขาต้องการคนหนึ่งคนบนต้นสนต้นที่สามจากลำธาร คดีเผาค่ายตัดไม้ค้างอยู่ในสมุดของราชสำนักมาหลายปี เพิ่งมีผู้พิพากษาว่างขึ้นมาฟัง

    เสมียนนั่งรออยู่ที่โต๊ะหน้าประตูค่าย สมุดลงชื่อยังมีที่ว่างทั้งหน้า
  choices:
    - id: bring_the_cord
      label: ไม่ลงชื่อ แต่ขอเยี่ยมโอรีวัลในห้องขัง เอาเชือกป่านไปให้
      text: |
        ทหารยอมให้เยี่ยมได้ครึ่งชั่วยาม ตรวจเชือกป่านว่าไม่ยาวพอจะทำอะไรได้ โอรีวัลรับเชือกไป ขอให้{name}ถักผมให้ เพราะมือของเขาสั่นตั้งแต่เข้าห้องขัง {name}ถักเปียเดียวยาวลงไปกลางหลัง แบบที่เขาเคยถัก

        เขาไม่ได้พูดเรื่องคืนนั้น ถามแต่เรื่องต้นสนที่ไหนยังอยู่ ต้นไหนล้มแล้ว {name}บอกเท่าที่รู้ ครึ่งชั่วยามหมดตอนเปียเสร็จพอดี
      effects:
        alignment: { moral: 1 }
        flags: [braided_orivals_hair_in_the_lockup]
        people: [{ id: bough_orival, name: โอรีวัล, gender: m, race: elf, bond: friend, closeness: 1, age: 150 }]
    - id: speak_for_him
      label: ลงชื่อกับเสมียน แล้วขึ้นพูดต่อหน้าผู้พิพากษาตามที่เห็นมาจริงทุกอย่าง
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}เล่าตามจริง รวมถึงส่วนที่ตัวเองอยู่ในเรื่อง คืนที่เขามาขอคนขึ้นไปนั่งบนต้นสนต้นที่สาม กับสิ่งที่{name}ทำในคืนนั้น เสมียนจดไม่ทัน ผู้พิพากษาให้หยุดรอ แล้วถามคำถามเดียว ว่าตอนนั้น{name}อายุเท่าไร {name}บอก ผู้พิพากษาวางปากกา

          คำของ{name}ลงสมุดศาลไว้ครึ่งหน้า ท้ายครึ่งหน้านั้นผู้พิพากษาเขียนเพิ่มเองบรรทัดหนึ่ง โอรีวัลนั่งฟังอยู่ท้ายโถง ตอนเดินผ่าน{name}ออกไป เขาผิวปากเบาๆ สองจังหวะ
        effects:
          stats: { CHA: 1 }
          reputation: { crown: -1 }
          flags: [spoke_at_orivals_hearing]
          people: [{ id: bough_orival, name: โอรีวัล, gender: m, race: elf, bond: friend, closeness: 1, age: 150 }]
      failure:
        text: |
          ผู้พิพากษาให้พูดได้ไม่ถึงสามประโยค พอ{name}พูดถึงคืนที่ตัวเองอยู่ในเรื่องด้วย เขาก็สั่งเสมียนให้ขีดฆ่าสิ่งที่จดไว้ บอกว่าศาลนี้ฟังความเรื่องเอลฟ์คนเดียว ไม่ได้ฟังเรื่องเด็กทั้งหมู่บ้าน

          {name}เดินลงจากที่ยืนพูด ผ่านโอรีวัลที่นั่งท้ายโถง เขาไม่มองขึ้นมา แต่มือที่วางบนเข่าเคาะเบาๆ สองที
        effects: { reputation: { crown: -1 }, flags: [spoke_at_orivals_hearing] }
    - id: he_stopped
      label: ขึ้นพูดว่าหลังหน้าหนาวปีหนึ่ง ไม่มีค่ายไหนไหม้อีก
      requires: { flag: orival_stopped_burning }
      text: |
        {name}พูดสั้น ว่ามีอยู่สามคืนที่โอรีวัลมาขอนอนในบ้านของ{name} คืนที่สามเขาลงบันไดไปก่อนสาง หลังจากนั้นไม่มีค่ายไหนไหม้อีก ไม่มีประกาศจับฉบับใหม่ทับฉบับเก่า เสมียนเปิดสมุดของค่ายทหารดู ตรงตามที่{name}บอก

        ผู้พิพากษาถามว่าแล้วคนสองคนในค่ายที่เจ็ดล่ะ {name}บอกว่าเรื่องนั้นเขาแบกเองทุกคืน ไม่ต้องรอให้ศาลไหนสั่ง ผู้พิพากษาไม่ได้ถามต่อ จดบางอย่างลงกระดาษแผ่นแยก พับเก็บเข้าเสื้อ
      effects: { alignment: { law: 1 }, flags: [testified_that_orival_stopped] }
    - id: the_one_who_turned_him_in
      label: ลงชื่อกับเสมียน ทั้งที่{name}เป็นคนลงไปบอกทหารในคืนที่เขาโดนจับ
      requires: { flag: turned_in_orival }
      text: |
        เสมียนเปิดสมุดเก่าดู ชื่อ{name}อยู่ในหน้าที่จ่ายค่าหัว เสมียนเงยหน้าขึ้นมอง แล้วจดชื่อลงสมุดเล่มใหม่อีกครั้ง ไม่ได้ถามอะไร

        วันฟังความโอรีวัลขอให้เรียก{name}ขึ้นพูดเป็นคนแรก เขาถามคำถามเดียวข้ามโถง ว่าเงินยี่สิบเหรียญนั้นซื้ออะไร {name}ตอบตามจริง คนในโถงเงียบ โอรีวัลบอกผู้พิพากษาว่าเขาไม่มีอะไรจะถามพยานคนนี้อีก
      effects: { alignment: { law: 1, moral: 1 }, flags: [faced_orival_at_the_hearing] }
    - id: stay_away
      label: ไม่ลงชื่อ ไม่ไปเยี่ยม เดินผ่านประตูค่ายไปตามธุระ
      text: |
        {name}เดินผ่านประตูค่ายไปตลาดชายป่าทุกเช้าจนปลายเดือน ประกาศยังติดอยู่ที่เดิม สมุดของเสมียนเต็มไปสองหน้า ชื่อคนบ้านกิ่งลมเป็นส่วนมาก

        วันฟังความ{name}อยู่บนกิ่งนอกบ้าน ห้อยขาลงไปในความมืดตอนพลบค่ำ ฟังเสียงป่า ไม่ได้ยินอะไรจากค่ายทหาร
      effects: { flags: [stayed_away_from_orivals_hearing] }

# ---------- เด็กที่บ้านซ่อนไว้และเด็กวิหาร ----------

- id: adult.back_cousin_tail
  stage: adult
  scene: noble_hall
  weight: 30
  when:
    age: [41, 58]
    any_flags: [cousin_knows, cousin_blackmail]
    location_tag: ventras
  text: |
    บ้านหลังใหญ่บนเนินวิหารเปิดประตูให้คนแปลกหน้าเดินเข้าออกเป็นครั้งแรก คนประมูลยืนบนลังไม้กลางห้องโถง อ่านรายการทีละชิ้น โต๊ะ ตู้ พรม เชิงเทียน ทุกชิ้นคลุมผ้าขาวไว้จนกว่าจะถึงคิวขาย บ้านนี้เป็นของเดลซา ลูกพี่ลูกน้องฝั่งแม่ของ{name} สามีของนางกู้เงินธนาคารเบเลคจนหมดตัว

    ผ้าขาวคลุมโต๊ะ ห้องที่ปิดไว้ เด็กสองคนเล่นซ่อนหา ปลายหางขดอยู่บนพรม และเสียงถามว่านั่นอะไร {name}จำได้ทั้งหมดตอนเห็นเดลซายืนอยู่หลังห้องโถง เสื้อคลุมบางเกินหน้าหนาว นับของที่ขายออกไปทีละชิ้นด้วยปลายนิ้ว

    ตลอดหลายปีนั้น ไม่มีใครในตระกูลรู้เรื่องหางของ{name}จากปากนาง
  choices:
    - id: bid_for_the_brooch
      label: ยกมือประมูลเข็มกลัดเงินชิ้นที่สิบสี่ เข็มกลัดของแม่ที่เคยยื่นให้นางใต้โต๊ะคลุมผ้า
      requires: { flag: cousin_blackmail }
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          มีคนแข่งสองคน ร้านรับซื้อเงินคนหนึ่ง หญิงสาวคนหนึ่งที่อยากได้ของเก่า {name}ขึ้นราคาทีละครึ่งเหรียญ ช้าๆ เหมือนไม่อยากได้ ร้านรับซื้อเงินเลิกก่อน หญิงสาวเลิกตาม เข็มกลัดได้มาสามเหรียญ

          ด้านหลังเข็มกลัดมีรอยขีดเพิ่มมาสองรอยที่ไม่เคยมี คนที่ถือไว้หลายปีเคยพลิกดูบ่อย เดลซามองมาจากหลังห้องตอนค้อนไม้ลง แล้วหันไปนับชิ้นต่อไป
        effects: { gold: -3, stats: { CHA: 1 }, flags: [bought_back_mothers_brooch] }
      failure:
        text: |
          หญิงสาวที่อยากได้ของเก่าไม่ยอมเลิก ขึ้นราคาทุกครั้งที่{name}ขึ้น จนเข็มกลัดเงินชิ้นเล็กราคาห้าเหรียญ คนทั้งห้องหันมาดูว่าใครบ้า {name}ได้มาที่ห้าเหรียญ

          เดลซาเดินมาตอนจ่ายเงิน บอกเบาๆ ว่าจะขายคืนให้สองเหรียญก็ได้ ถ้าบอกกันก่อน ตอนนี้เงินเข้าธนาคารไปแล้ว
        effects: { gold: -5, flags: [bought_back_mothers_brooch] }
    - id: talk_to_delsa
      label: เดินไปยืนข้างเดลซาที่หลังห้องโถง
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          เดลซาพูดก่อน ว่าจำได้ ว่าไม่เคยบอกใคร แม้ตอนที่สามีหาเงินมาใช้หนี้ไม่ทัน แม้ตอนที่มีคนจากหนังสือข่าวมาถามเรื่องตระกูลบนเนินวิหาร นางนับไว้ ว่าเรื่องนั้นขายได้กี่เหรียญ แล้วไม่ได้ขาย

          {name}ถามว่าทำไม นางบอกว่าตอนเด็กกลัว ตอนโตชินที่จะไม่พูด พอชินแล้วก็เลิกไม่ได้ แล้วชี้ให้ดูโต๊ะคลุมผ้าตัวที่กำลังจะขาย โต๊ะตัวนั้น
        effects: { stats: { CHA: 1 }, flags: [heard_why_delsa_kept_quiet] }
      failure:
        text: |
          เดลซาเห็น{name}เดินมาแล้วถอยไปหนึ่งก้าว เหมือนตอนเด็ก ตอนที่ตาใต้โต๊ะจับแสงจากช่องประตู นางบอกว่าไม่ต้องมาสงสาร แล้วเดินไปยืนอีกมุมของห้องโถง

          {name}ยืนอยู่ตรงที่นางเคยยืนจนการประมูลจบ นับของที่ขายออกไปทีละชิ้นแทนนาง ได้สี่สิบเอ็ดชิ้น
        effects: { flags: [heard_why_delsa_kept_quiet] }
    - id: buy_the_beds
      label: ประมูลเตียงเด็กสองเตียงที่ไม่มีใครเสนอราคา แล้วส่งคืนให้เดลซา
      text: |
        เตียงเด็กสองเตียงไม่มีคนเสนอราคา คนประมูลจะยกไปรวมกองของเก่า {name}ยกมือเสนอหนึ่งเหรียญต่อเตียง ไม่มีใครแข่ง

        {name}จ้างเกวียนขนเตียงไปส่งที่ห้องเช่าท้ายเนินที่เดลซากับลูกจะย้ายไปอยู่ ไม่ได้เขียนชื่อผู้ส่ง เดลซารู้อยู่ดี วันต่อมามีคนเอากระดุมเงินสองเม็ดมาวางไว้หน้าประตูบ้าน{name}
      effects: { gold: -2, alignment: { moral: 1 }, flags: [sent_delsas_children_their_beds] }
    - id: leave_unseen
      label: ออกทางประตูข้าง ก่อนเดลซาจะหันมาเห็น
      text: |
        {name}เดินเลียบผนังห้องโถงไปทางประตูข้าง ผ่านห้องที่เคยปิดไว้ ประตูเปิดอยู่ ข้างในว่าง พรมผืนนั้นขายไปแล้ว เหลือแต่รอยสี่เหลี่ยมบนพื้นไม้ที่สีอ่อนกว่ารอบๆ

        ข้างนอกหิมะเริ่มตก {name}ดึงชายเสื้อคลุมลงให้มิด ถึงจะไม่มีใครหันมาสักคน
      effects: { flags: [left_delsas_auction_unseen] }

- id: adult.back_tin_button
  stage: adult
  weight: 30
  when:
    age: [41, 60]
    any_flags: [tin_button_woman, second_tin_button]
  text: |
    ห่อผ้าเล็กๆ จากวิหารอีเซลมาถึงมือ{name} มัดเชือกแดงแบบที่แม่ชีใช้มัดของบริจาค ข้างในมีจดหมายของแม่ชีคนหนึ่งที่{name}ไม่รู้จักลายมือ กับกระดุมดีบุกหนึ่งเม็ด ลายเดียวกัน ขนาดเท่ากัน กับเม็ดที่เคยอยู่ในหีบใต้แท่นวิหาร เม็ดที่แม่ชีเอาออกมาให้ดูปีละครั้งในวันที่วิหารถือว่าเป็นวันเกิด

    แม่ชีเขียนว่าหญิงชราคนหนึ่งเดินถือไม้เท้ามาที่ช่องส่งขนมปัง ยื่นกระดุมเม็ดนี้ให้ ขอให้ส่งถึง{name} บอกชื่อ{name}ถูกทุกพยางค์ ไม่ยอมบอกชื่อตัวเอง บอกว่าจะไม่มาอีก แล้วเดินกลับไปทางตลาด เดินช้ามาก แม่ชีมองตามจนลับตา

    ท้ายจดหมาย แม่ชีเขียนว่าช่องส่งขนมปังเปิดทุกเช้าเหมือนเดิม
  choices:
    - id: wait_at_the_hatch
      label: ไปยืนรอที่ช่องส่งขนมปังตอนเช้า ทุกเช้าจนกว่าจะเห็น
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          เช้าที่เก้า{name}เห็นหญิงชราถือไม้เท้ายืนอยู่ปลายแถวคนรอรับขนมปัง ไม่ได้มารับ ยืนดูเฉยๆ นางเห็น{name} ยกมือข้างที่ไม่ได้ถือไม้เท้าขึ้นครั้งเดียว ระดับอก แล้วหันหลังเดินกลับไปทางตลาด

          {name}ไม่ได้เดินตาม เช้าวันต่อมานางไม่มา เช้าวันต่อๆ มาก็ไม่มา {name}ยังไปยืนที่ช่องส่งขนมปังเช้าวันพักงานจนหมดหน้าหนาว รับขนมปังค้างคืนมาก้อนหนึ่งทุกครั้ง
        effects: { stats: { WIS: 1 }, flags: [saw_the_button_woman_once_more] }
      failure:
        text: |
          {name}ยืนรอสิบสองเช้า เห็นหญิงชราถือไม้เท้าเจ็ดคน ไม่มีคนไหนหยุด ไม่มีคนไหนมอง แม่ชีที่เขียนจดหมายออกมายืนรอด้วยสองเช้า แล้วกลับเข้าไปทำงาน

          เช้าที่สิบสามฝนตก{name}ไม่ไป แม่ชีส่งข่าวมาว่าเช้านั้นมีคนยืนอยู่ปลายแถวนานกว่าปกติ ถือไม้เท้า ไม่รับขนมปัง
        effects: { flags: [saw_the_button_woman_once_more, missed_the_button_woman] }
    - id: sew_three_buttons
      label: เย็บกระดุมดีบุกทั้งสามเม็ดเรียงกันบนเสื้อตัวที่ใส่บ่อยที่สุด
      requires: { flag: second_tin_button }
      text: |
        เม็ดแรกจากหีบใต้แท่น เม็ดที่สองที่ตกอยู่บนลานวันที่ผู้หญิงคนนั้นเดินออกประตูไป เม็ดที่สามจากห่อผ้ามัดเชือกแดง {name}เย็บเรียงลงมาตรงอก ห่างกันเท่าความกว้างนิ้วโป้ง ใช้ด้ายสีเดียวกับเสื้อ

        เสื้อตัวนั้นปิดได้สามเม็ด ช่องที่สี่ไม่มีกระดุม {name}ไม่ได้หากระดุมเม็ดอื่นมาเย็บแทน ปล่อยช่องนั้นไว้แบบนั้น ลมเข้าตรงนั้นทุกหน้าหนาว
      effects: { alignment: { moral: 1 }, flags: [sewed_the_three_tin_buttons] }
    - id: write_a_reply
      label: เขียนตอบหนึ่งบรรทัด ฝากแม่ชีไว้ที่ช่องส่งขนมปัง เผื่อนางกลับมา
      text: |
        {name}เขียนหลายบรรทัด ฉีกทิ้ง เขียนใหม่ เหลือบรรทัดเดียว เช้าวันนั้นฟ้าเป็นอย่างไร {name}ไม่รู้ ไม่มีใครเล่าให้ฟัง ขอให้นางเล่า ถ้ามาอีก

        แม่ชีรับกระดาษไปเหน็บไว้ข้างช่องส่งขนมปัง หลายเดือนต่อมาแม่ชีส่งข่าวมาว่ากระดาษหายไปแล้ว ไม่รู้ว่าลมพัดไปหรือมีคนหยิบ
      effects: { flags: [left_a_reply_at_the_hatch] }
    - id: keep_it_in_the_box
      label: ใส่กระดุมเม็ดใหม่ลงกล่อง ปิดฝา ไม่ไปที่วิหาร
      text: |
        {name}ใส่กระดุมเม็ดที่สามลงกล่องไม้ใบเดียวกับของเก่าชิ้นอื่น กระดุมกระทบไม้ดังกริ๊กหนึ่งที ปิดฝา วางกล่องไว้บนหิ้งเดิม

        จดหมายของแม่ชีพับเก็บไว้ใต้กล่อง วันเกิดของวิหารปีนั้น{name}เปิดกล่องออกมาดูครั้งหนึ่ง เหมือนที่เคยมีคนเปิดหีบให้ดูปีละครั้ง
      effects: { flags: [kept_the_third_button] }

# ---------- แดนเถ้า ----------

- id: adult.back_city_boy
  stage: adult
  weight: 30
  when:
    age: [41, 58]
    flags: [smuggled_friend]
    not_location_tag: ashland
  text: |
    ตีสาม เกวียนถ่านเปล่าคันหนึ่งหยุดอยู่หน้าบ้าน{name} มีเสียงผิวปากสามจังหวะ สั้น สั้น ยาว แบบที่คนบ้านหญ้าเงินใช้เรียกให้หย่อนบันไดตอนกลับดึก

    คนขับเกวียนเป็นทีฟลิ่ง ตัวสูง เขาสองข้างยาวพ้นหูไปแล้ว ไม่ซ่อน ตรงโคนเขามีรอยเลื่อยเก่า เป็นวงจางๆ อยู่ใต้เนื้อเขาที่งอกต่อขึ้นมา {name}จำรอยนั้นได้ก่อนจำหน้า เด็กที่ลงจากท้ายเกวียนถ่านตอนตีสามที่ปากทางบ้านหญ้าเงิน รองเท้าหนังไม่เหมาะกับเถ้า ไม่ยอมบอกชื่อ ทุกคนเลยเรียกว่าเจ้าเมือง

    คราวนี้เขาบอกชื่อจริง ฮันเนล ตอนนี้ขับเกวียนให้หนูท่า ขนของที่หนูท่าไม่คิดเงิน ใต้ผ้าใบท้ายเกวียนมีเด็กคนหนึ่ง เขาสองข้างยังสั้นเท่าเม็ดถั่ว สัปดาห์นี้ทหารตั้งด่านตรวจเกวียนที่หัวสะพาน เขาขอฝากเด็กไว้สามคืน
  choices:
    - id: hide_the_child
      label: อุ้มเด็กลงจากเกวียน ซ่อนไว้ในบ้านสามคืน
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          เด็กไม่ร้อง ไม่พูด กินทุกอย่างที่วางให้ นอนใต้บันไดตามที่บอก สองคืนแรกบ้านข้างๆ ไม่รู้อะไรเลย คืนที่สามป้าข้างบ้านถามว่าเสียงไอเมื่อคืนเสียงใคร {name}บอกว่าแมว ป้าบอกว่าแมวไอหนักขนาดนั้นต้องพาไปหาหมอ แล้วไม่ถามอีก

          ตีสามคืนที่สี่ เสียงผิวปากสั้น สั้น ยาว ดังอยู่หน้าบ้าน ฮันเนลอุ้มเด็กขึ้นเกวียน วางเหรียญไว้บนธรณีสองเหรียญ {name}เก็บเหรียญคืนใส่มือเขาก่อนเกวียนออก
        effects:
          alignment: { law: -1, moral: 1 }
          reputation: { dock_rats: 1 }
          flags: [hid_hannels_child]
          people: [{ id: ash_hannel, name: ฮันเนล, gender: m, race: tiefling, bond: friend, closeness: 2, age: 49 }]
      failure:
        text: |
          คืนที่สองเด็กแอบขึ้นไปนั่งบนหลังคาดูดาว ป้าข้างบ้านเห็นเขาสองข้างตัดกับฟ้า เช้ามาทั้งถนนรู้ว่าบ้าน{name}มีเด็กมีเขา คนเดินผ่านหน้าบ้านช้าลง บางคนมองเข้ามาทางหน้าต่าง

          ฮันเนลมารับเด็กเร็วกว่ากำหนดหนึ่งคืน เลือกทางอ้อมไม่ผ่านสะพาน หลังจากนั้นหลายเดือน ยามของราชสำนักเดินผ่านหน้าบ้าน{name}บ่อยกว่าบ้านอื่นในถนน
        effects:
          alignment: { law: -1, moral: 1 }
          reputation: { crown: -1 }
          flags: [hid_hannels_child]
          people: [{ id: ash_hannel, name: ฮันเนล, gender: m, race: tiefling, bond: friend, closeness: 1, age: 49 }]
    - id: drive_the_cart
      label: ขับเกวียนผ่านด่านหัวสะพานเอง ให้ฮันเนลกับเด็กไปทางอื่น
      requires: { flag: job_smuggler }
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          ทหารที่ด่านค้นเกวียนถ่านเปล่าคันที่{name}ขับ เปิดผ้าใบ ส่องตะเกียงทุกซอก เจอแต่ฝุ่นถ่าน {name}คุยเรื่องราคาถ่านกับนายด่านจนเขาเบื่อ โบกมือให้ผ่าน

          ฮันเนลกับเด็กเดินอ้อมไปข้ามท่าเรือข้ามฟาก รอ{name}อยู่อีกฝั่ง ฮันเนลบอกว่าคนขับเกวียนของหนูท่าคนไหนผ่านด่านหัวสะพานได้ เขาเรียกว่าพวกปากเปล่า แล้วผิวปากสั้น สั้น ยาว ให้เป็นคำขอบคุณ
        effects:
          stats: { CHA: 1 }
          reputation: { dock_rats: 1 }
          flags: [drove_hannels_cart_past_the_bridge]
          people: [{ id: ash_hannel, name: ฮันเนล, gender: m, race: tiefling, bond: friend, closeness: 2, age: 49 }]
      failure:
        text: |
          นายด่านจำหน้า{name}ได้ ไม่ใช่จากเรื่องนี้ จากเรื่องอื่นนานมาแล้ว เขาค้นเกวียนนานเป็นพิเศษ ไม่เจออะไร แต่ยึดเกวียนไว้สามวัน ปรับค่าล้อเกวียนผิดขนาดสามเหรียญ

          ฮันเนลกับเด็กข้ามท่าเรือข้ามฟากไปได้ ไม่มีใครเห็น ได้เกวียนคืนในวันที่สี่ ฮันเนลจ่ายค่าปรับคืนให้{name} บอกว่าค่าล้อผิดขนาดเป็นค่าที่หนูท่าจ่ายทุกเดือนอยู่แล้ว
        effects:
          reputation: { crown: -1 }
          flags: [drove_hannels_cart_past_the_bridge]
          people: [{ id: ash_hannel, name: ฮันเนล, gender: m, race: tiefling, bond: friend, closeness: 1, age: 49 }]
    - id: money_not_the_house
      label: ไม่รับเด็กไว้ในบ้าน แต่ให้เงินสามเหรียญไปหาที่ซ่อนที่อื่น
      text: |
        ฮันเนลรับเงิน นับแล้วคืนให้หนึ่งเหรียญ บอกว่าสองเหรียญพอ ที่ซ่อนอีกที่หนึ่งคิดสองเหรียญ เขารู้ราคาทุกที่ในเมือง

        เกวียนออกไปตอนฟ้ายังมืด เด็กใต้ผ้าใบโผล่หัวออกมามองครั้งหนึ่ง เขาสองข้างยังสั้นเท่าเม็ดถั่ว แล้วผ้าใบก็ปิดลง
      effects: { gold: -2, flags: [paid_for_hannels_other_hiding_place] }
    - id: send_him_on
      label: บอกฮันเนลว่าบ้านนี้รับไม่ได้ แล้วยื่นข้าวห่อหนึ่งให้ระหว่างทาง
      text: |
        ฮันเนลรับข้าวห่อไป บอกว่าไม่เป็นไร บ้านที่รับได้มีน้อยกว่าบ้านที่รับไม่ได้อยู่แล้ว เขาเปิดผ้าใบให้เด็กข้างในกินก่อน เด็กกินคำแรกแล้วคายทิ้ง

        ฮันเนลหัวเราะ บอกเด็กว่าทุกคนก็คายครั้งแรก แล้วขับเกวียนออกไป ผิวปากสั้น สั้น ยาว ไปจนสุดถนน ไม่มีใครหย่อนบันไดลงมาให้
      effects: { flags: [sent_hannel_on] }

- id: adult.back_names_stone
  stage: adult
  scene: tavern
  weight: 30
  when:
    age: [41, 60]
    any_flags: [carved_names_stone, read_company_letter, sang_miners_song]
  text: |
    นักบวชออสซาหนุ่มจากป้อมสามนั่งอยู่โต๊ะข้างๆ ในร้านเหล้าที่{name}แวะกินข้าวเย็น เปิดสมุดเล่มเก่าขอบเปื่อยวางไว้ข้างชามซุป ลายมือในสมุดสั่นเป็นคลื่น เขาบอกว่าเป็นสมุดของนักบวชคนก่อน คนที่มือสั่นจนจับปากกาไม่ได้แล้ว ในสมุดมีชื่อ{name}อยู่บรรทัดหนึ่ง ข้างชื่อลุงโอเบนแห่งบ้านหญ้าเงิน

    {name}จำแผ่นหินหน้าลานศพได้ หัวแผ่นสลักรูปประตูปิด ใต้ประตูมีชื่อคนบ้านหญ้าเงินสามแถว ลึกบ้างตื้นบ้าง กับป้าเมลาที่ยืนอยู่ข้างแผ่นหินจนเช้า

    นักบวชบอกว่าแผ่นหินนั้นเต็มแล้ว ไม่มีที่ให้ชื่อใหม่สักบรรทัด หน้าหนาวนี้จะตั้งแผ่นใหม่ข้างแผ่นเก่า เขาเดินทางตามรายชื่อในสมุดมาหลายเมืองแล้ว ขอให้คนในรายชื่อไปช่วยตั้งแผ่นหิน
  choices:
    - id: carve_the_door
      label: ไปบ้านหญ้าเงิน ขอเป็นคนสลักรูปประตูปิดที่หัวแผ่นหินใหม่
      requires: { flag: carved_names_stone }
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          นักบวชขีดเส้นดินสอให้ {name}จับสิ่วเอง ตอกค้อนเอง ประตูปิดสองบาน ลูกบิดกลมหนึ่งลูก เส้นตรงทุกเส้น ลึกเท่ากันทุกเส้น เสร็จตอนพลบค่ำเหมือนคราวนั้น

          ป้าเมลามาดู ตาฝ้าจนต้องเอานิ้วลูบรอยสลักแทนการดู แกลูบประตูจนครบทุกเส้น แล้วเดินไปลูบชื่อลุงโอเบนบนแผ่นเก่าที่ตัวอักษรที่สี่มีหางยาวเกิน
        effects: { stats: { DEX: 1 }, flags: [carved_the_door_on_the_new_slab] }
      failure:
        text: |
          บานประตูด้านซ้ายเอียงไปทางขวาเท่าเส้นผม {name}เห็นก่อนนักบวช จะขอแก้ นักบวชบอกว่าหินเซาะแล้วกลบไม่ได้ ประตูเอียงก็ยังเป็นประตู

          ป้าเมลาลูบรอยสลักด้วยนิ้ว ลูบบานที่เอียงสองรอบ แล้วบอกว่าเหมือนประตูบ้านแกเอง ปิดไม่สนิทมาตั้งแต่ลุงโอเบนยังอยู่
        effects: { hp: -1, flags: [carved_the_door_on_the_new_slab] }
    - id: read_the_contract
      label: ขอนักบวชดูจดหมายของบริษัทเหมืองที่เสนอจ่ายค่าแผ่นหินใหม่
      requires: { flag: read_company_letter }
      check: { stat: INT, dc: 13 }
      success:
        text: |
          บริษัทเหมืองเสนอจ่ายค่าหินและค่าขนทั้งหมด ข้อห้าเขียนว่าแผ่นหินต้องสลักตราบริษัทไว้เหนือรูปประตูปิด ขนาดไม่เล็กกว่ารูปประตู {name}อ่านสองรอบ แล้วเอาถ่านขีดเส้นใต้ข้อห้า เหมือนที่เคยขีดใต้ตัวเลขในจดหมายของป้าเมลา

          คนบ้านหญ้าเงินรวมเงินกันเอง ได้ครึ่งค่าหิน ป้อมสามออกอีกครึ่ง แผ่นหินใหม่ไม่มีตราอะไรอยู่เหนือประตู
        effects: { stats: { INT: 1 }, flags: [kept_the_company_off_the_slab] }
      failure:
        text: |
          ภาษาของบริษัทยาวขึ้นกว่าเมื่อก่อน {name}อ่านทีละข้อ ข้อห้าอ่านผ่านไปโดยไม่สะดุด คนบ้านหญ้าเงินลงชื่อรับเงิน

          แผ่นหินใหม่มาถึงพร้อมตราบริษัทเหมืองสลักไว้เหนือประตูปิด ใหญ่เท่ากัน {name}เห็นตอนไปถึงพิธีตั้ง นักบวชหนุ่มเห็นตรานั้นแล้วชะงักไปครู่หนึ่ง ก่อนเริ่มสวดโดยไม่เอ่ยถึงตราสักคำ
        effects: { flags: [kept_the_company_off_the_slab, the_company_mark_went_up] }
    - id: sing_at_the_raising
      label: ไปร้องเพลงคนขุดถ่านวันตั้งแผ่นหินใหม่
      requires: { flag: sang_miners_song }
      text: |
        เพลงคนขุดถ่านยังมีสี่ท่อนเท่าเดิม {name}ร้องท่อนแรกคนเดียว เสียงไม่แตกแล้ว แต่ต่ำลงกว่าที่จำได้ครึ่งเสียง ท่อนที่สองคนกะเช้าร้องตาม ท่อนที่สามคนทั้งลานร้อง

        ท่อนที่สี่มีเด็กกลุ่มหนึ่งร้องเพี้ยนตามอยู่ท้ายลาน ร้องผิดคำ ร้องเร็วกว่าคนอื่น นักบวชหนุ่มยืนฟังจนจบ แล้วจดบางอย่างลงสมุดเล่มใหม่ของเขาเอง
      effects: { stats: { CHA: 1 }, flags: [sang_at_the_new_slab] }
    - id: pay_for_the_stone
      label: ไม่ไป แต่ฝากเงินสามเหรียญไปกับนักบวชเป็นค่าหิน
      text: |
        นักบวชหนุ่มรับเงิน จดลงสมุดเล่มเก่าใต้ชื่อ{name} ด้วยลายมือของเขาเองที่ไม่สั่น บรรทัดเดียว ค่าหินสามเหรียญ

        ซุปในชามของเขาเย็นไปแล้ว เขากินจนหมด ขอบคุณเจ้าของร้าน แล้วขึ้นม้าออกไปตามชื่อถัดไปในสมุด ชื่อถัดไปอยู่อีกเมืองหนึ่ง
      effects: { gold: -3, alignment: { moral: 1 }, flags: [paid_for_the_new_slab] }

# ---------- ชีวิตทั่วไปและทางผจญภัย ----------

- id: adult.back_music_box
  stage: adult
  weight: 30
  when:
    age: [41, 60]
    any_flags: [music_box_waits, knows_music_box_owner]
  text: |
    ชายหนุ่มคนหนึ่งมาหา{name}ที่ที่ทำงาน ถือห่อผ้าไว้สองมือ วางลงบนโต๊ะ แกะออก กล่องดนตรีไม้ดำขนาดเท่ากำปั้น ฝาบิ่นมุมหนึ่ง กล่องที่เคยวางอยู่บนชั้นกลางของร้านรับจำนำท้ายตลาด ที่{name}จำเพลงในนั้นได้ทั้งที่ไม่เคยฟัง

    เขาเป็นหลานของหญิงแก่แว่นหนาเท่าก้นขวด ร้านรับจำนำปิดแล้ว ยายย้ายไปอยู่กับลูกสาวที่อื่น ของในร้านเขาขายเหมาไปเกือบหมด ยกเว้นชิ้นนี้ ยายสั่งไว้ว่าให้เอาไปให้คนที่ชอบมายืนดูกล่องผ่านหน้าต่าง

    ป้ายราคาที่ห้อยกล่องเป็นกระดานเล็กแผ่นเดิม ห้าเหรียญ ข้างล่างมีคำว่ายังไม่ขาย เขียนด้วยดินสอพอง ขีดทิ้งแล้วเขียนใหม่ เป็นแถวยาวลงไปจนเต็มกระดานทั้งสองหน้า
  choices:
    - id: pay_the_tag
      label: จ่ายห้าเหรียญตามป้ายที่ยายเขียนไว้
      requires: { min_gold: 5 }
      text: |
        หลานยายไม่อยากรับ บอกว่ายายให้เปล่า {name}วางเงินห้าเหรียญไว้บนโต๊ะ บอกว่าให้ส่งไปให้ยาย ตามราคาที่ยายตั้ง หลานยายนับเงิน ห่อผ้ากลับ แล้วรับไป

        {name}หมุนลาน เพลงสะดุดที่เสียงที่เจ็ด แล้วเล่นต่อจนจบ คนในที่ทำงานหยุดมือฟังกันทั้งห้อง ไม่มีใครรู้จักเพลงนี้ ทุกคนฟังจนจบ
      effects: { gold: -5, items: [black_music_box], flags: [paid_the_pawn_womans_price] }
    - id: take_it_as_given
      label: รับไว้ตามที่ยายสั่ง แล้วเขียนตอบหลังป้ายราคาฝากหลานกลับไป
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}พลิกกระดานป้ายราคา หามุมที่ยังว่าง เขียนด้วยดินสอพองบรรทัดเดียว ขายแล้ว แล้วฝากหลานยายเอากระดานกลับไปให้ยายดู

          สองเดือนต่อมาหลานยายส่งกระดานแผ่นเดิมกลับมาอีกรอบ ใต้คำว่าขายแล้ว มีลายมือยายตัวโย้เขียนเพิ่ม เพลงสะดุดตรงเสียงที่เจ็ด ไม่ต้องซ่อม
        effects: { stats: { CHA: 1 }, items: [black_music_box], flags: [wrote_back_to_the_pawn_woman] }
      failure:
        text: |
          {name}เขียนหลังป้ายราคา เขียนยาวเกินที่ว่าง ดินสอพองหักกลางคำ ตัวหนังสือเลอะจนอ่านไม่ออก หลานยายบอกว่าจะเล่าให้ยายฟังเอง

          กระดานแผ่นนั้นไม่ได้กลับมา ข่าวจากยายก็ไม่มี กล่องดนตรีอยู่บนโต๊ะข้างเตียงของ{name} หมุนลานทุกคืน เพลงสะดุดที่เสียงที่เจ็ดทุกคืน
        effects: { items: [black_music_box], flags: [wrote_back_to_the_pawn_woman] }
    - id: the_dead_owners_street
      label: ถือกล่องไปหมุนลานหนึ่งรอบหน้าบ้านเจ้าของเดิม ที่ยายเคยเล่าว่าไม่มีใครมารับของ
      requires: { flag: knows_music_box_owner }
      text: |
        บ้านหลังนั้นตอนนี้เป็นร้านขายเชือก {name}ยืนหน้าร้าน หมุนลานหนึ่งรอบ เพลงสะดุดที่เสียงที่เจ็ด เจ้าของร้านเชือกออกมาดูว่าใครเล่นดนตรีหน้าร้าน

        เขาบอกว่าซื้อบ้านต่อจากคนเก็บของจากบ้านคนตาย ตอนย้ายเข้ามา ห้องหลังบ้านยังมีกรอบรูปว่างกรอบหนึ่งแขวนอยู่ ไม่มีรูป เขาทิ้งไปนานแล้ว {name}ถือกล่องกลับบ้าน
      effects: { items: [black_music_box], alignment: { moral: 1 }, flags: [played_it_at_the_old_house] }
    - id: let_it_go
      label: บอกหลานยายให้ขายไป ให้คนที่ยังไม่เคยฟังได้ฟัง
      text: |
        หลานยายห่อกล่องกลับ บอกว่ายายคงไม่ว่าอะไร ยายเก็บไว้ให้หลายปีก็เพราะไม่อยากให้กล่องไปอยู่กับคนที่ไม่ได้อยากได้ ถ้า{name}ไม่อยากได้ ก็เท่ากับยายเก็บไว้ถูกแล้ว

        สัปดาห์ต่อมา{name}ได้ยินเพลงที่สะดุดที่เสียงที่เจ็ดดังมาจากหน้าต่างบ้านหลังหนึ่งระหว่างทางกลับบ้าน หยุดฟังจนจบ แล้วเดินต่อ
      effects: { flags: [let_the_music_box_go] }

- id: adult.back_beam_boy
  stage: adult
  weight: 30
  when:
    age: [41, 58]
    any_flags: [lifted_the_beam, hurt_back, ran_for_help]
  text: |
    โกดังใหญ่ริมท่าที่{name}มาส่งของมีนายโกดังคนใหม่ ตัวหนา เดินลงน้ำหนักขาซ้ายมากกว่าขวา เขาจำ{name}ได้ก่อน เดินตรงมาคว้ามือ{name}ไปเขย่า กระดาษส่งของยับคามือ บอกชื่อว่ากอเรล

    {name}จำชื่อไม่ได้ แต่จำตาได้ ตาที่เบิกมองมาจากใต้คานไม้ท่อนหนึ่ง กระสอบทับอยู่บนคานอีกสามสี่ใบ เด็กคนนั้นไม่ร้อง ไม่ขยับ มองอยู่ที่{name}คนเดียว

    กอเรลพาเดินดูโกดังทั้งหลัง กระสอบซ้อนสูงเกินหัวสองช่วงตัว คานค้ำรุ่นเก่ายังเป็นท่อนเดิมหลายท่อน เขาบอกว่าเจ้าของโกดังอยากได้คนนั่งนับกระสอบที่ประตู งานเบา ค่าแรงดี เขาอยากให้{name}
  choices:
    - id: take_the_counting_job
      label: รับงานนั่งนับกระสอบที่ประตูโกดัง
      text: |
        งานนับกระสอบนั่งได้ทั้งวัน มีหลังคาบัง ค่าแรงมากกว่าที่{name}เคยได้จากงานไหนในถิ่น กอเรลเดินผ่านประตูวันละสามรอบ ทุกรอบถามว่าหิวไหม

        สิ้นเดือน{name}รับค่าแรงเต็มมือ นับซ้ำสองรอบ ตลอดเดือนนั้นนั่งนับกระสอบที่ซ้อนสูงขึ้นทุกวัน คานค้ำท่อนเก่าอยู่เหนือหัวตลอดเวลา
      effects: { gold: 4, flags: [took_gorels_counting_job] }
    - id: my_back_remembers
      label: บอกกอเรลว่าหลังของ{name}ยังลั่นทุกเช้าตั้งแต่วันนั้น
      requires: { flag: hurt_back }
      text: |
        กอเรลหยุดเดิน บอกว่ารู้ หมอบอกเขาตั้งแต่ตอนเด็กแล้วว่าคนที่ยกคานให้เขาหลังพัง เขาไม่เคยหาตัวเจอ ขาของเขาเองหายแล้ว เดินกะเผลกนิดเดียว หลังของ{name}ไม่หาย

        เขาพา{name}ไปหาหมอดัดกระดูกที่ดีที่สุดในท่า จ่ายเงินเอง หมอดัดหลังให้สามครั้ง ครั้งที่สามเสียงกึกดังตรงกระดูกข้อเดียวกับวันนั้น แล้วหลังก็ลั่นน้อยลง
      effects: { hp: 1, stats: { CON: 1 }, flags: [gorel_paid_for_my_back] }
    - id: you_watched_the_door
      label: ถามกอเรลว่าตอนนั้นนอนรออยู่นานแค่ไหน
      requires: { flag: ran_for_help }
      text: |
        กอเรลบอกว่านับได้สองร้อยสิบเจ็ด เขานับลมหายใจตั้งแต่{name}วิ่งออกประตู จนได้ยินเสียงคนหกคนวิ่งกลับมา ตอนนั้นเขาไม่รู้ว่า{name}จะกลับมาหรือเปล่า นับไว้ให้มีอะไรทำ

        แล้วเขาก็ขอ ถ้า{name}รับงานนับกระสอบที่ประตู ให้คอยฟังเสียงคาน ถ้าได้ยินอะไรให้ตะโกน แล้ววิ่งออกไปเหมือนเดิม เขาจะได้รู้ว่าต้องนับถึงเท่าไร
      effects: { alignment: { moral: 1 }, flags: [gorel_counted_two_hundred_seventeen] }
    - id: check_the_beams
      label: ขอดูคานค้ำทุกท่อนในโกดังก่อนตอบ
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}เคาะคานทีละท่อนด้วยด้ามมีด ฟังเสียง ท่อนที่เจ็ดเสียงทึบ ตรงโคนมีรอยร้าวยาวเท่าฝ่ามือซ่อนอยู่ใต้กระสอบ กอเรลให้คนขนกระสอบออกจากแถวนั้นทันที เปลี่ยนคานใหม่ในวันเดียว

          หลังจากนั้นกอเรลจ้าง{name}มาเคาะคานในโกดังทุกต้นเดือน ค่าแรงเท่างานนับกระสอบทั้งเดือน ทำแค่ครึ่งวัน
        effects: { stats: { WIS: 1 }, gold: 2, flags: [found_the_cracked_beam] }
      failure:
        text: |
          คานทุกท่อนเสียงเหมือนกันหมดในหูของ{name} ท่อนที่เจ็ดก็เหมือนท่อนอื่น {name}บอกกอเรลว่าดูแล้วไม่เห็นอะไร กอเรลขอบคุณ

          สองเดือนต่อมาคานท่อนที่เจ็ดหักตอนกลางคืน ไม่มีใครอยู่ในโกดัง กระสอบพังลงมาทั้งแถว แป้งกระจายเต็มพื้น กอเรลส่งข่าวมาบอก ไม่ได้ว่าอะไร บอกแค่ว่าโชคดีที่เป็นตอนกลางคืน
        effects: { flags: [found_the_cracked_beam, missed_the_seventh_beam] }

- id: adult.back_blame
  stage: adult
  weight: 30
  when:
    age: [41, 60]
    flags: [took_blame_for_friend]
  text: |
    ภรรยาของบาเรลมาหา{name}ถึงที่ทำงาน ถือกระดาษเรียกตัวของศาลประจำถิ่นพับไว้ในมือ บาเรลรับว่าเป็นคนตั้งตาชั่งร้านขายแป้งของนายให้เบาไปหนึ่งขีด ศาลจะสั่งให้ยืนขื่อกลางลานตลาดสามวัน คนในร้านรู้กันทั้งร้านว่าคนตั้งตาชั่งคือนายร้าน บาเรลรับแทนเพราะนายสัญญาว่าจะไม่ไล่ออก

    ครอบแก้วตะเกียงแตกสามชิ้นบนพื้น ชิ้นใหญ่ที่สุดยังกลิ้งไม่หยุด เด็กที่เล็กกว่าปีหนึ่งยืนตัวแข็ง ปากสั่น บาเรลคือเด็กคนนั้น

    ศาลยอมให้คนที่รู้จักผู้ต้องหามาพูดถึงนิสัยได้หนึ่งคน ภรรยาของบาเรลบอกว่าเขาเอ่ยชื่อ{name}ก่อนชื่อแม่ของตัวเองเสียอีก
  choices:
    - id: speak_of_his_nature
      label: ไปศาล ขึ้นพูดถึงนิสัยของบาเรล
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ไม่ได้พูดว่าบาเรลเป็นคนดี พูดว่าบาเรลเป็นคนที่ปล่อยให้คนอื่นรับผิดแทนได้ครั้งเดียวในชีวิต แล้วจ่ายคืนด้วยของหวานครึ่งชิ้นทุกเย็นไปทั้งเดือน คนที่จำหนี้ได้ขนาดนั้นจะไม่โกงแป้งใครหนึ่งขีด ผู้พิพากษาถามว่ารู้ได้อย่างไร {name}เล่าเรื่องครอบแก้วตะเกียง

          ผู้พิพากษาเปลี่ยนโทษจากยืนขื่อเป็นปรับสองเหรียญ แล้วสั่งให้คนไปตรวจตาชั่งร้านแป้งทุกตัว นายร้านไม่ได้มาฟังวันตัดสิน
        effects:
          stats: { CHA: 1 }
          flags: [spoke_for_barel]
          people: [{ id: friend_barel, name: บาเรล, gender: m, bond: friend, closeness: 2, age: 47 }]
      failure:
        text: |
          {name}พูดจบแล้วผู้พิพากษาถามว่าเรื่องตะเกียงเกี่ยวอะไรกับตาชั่ง {name}อธิบายอีกรอบ ผู้พิพากษาบอกว่าศาลตัดสินจากตาชั่ง ไม่ได้ตัดสินจากตะเกียง

          บาเรลยืนขื่อกลางลานตลาดสามวัน {name}ไปยืนข้างๆ ทั้งสามวัน ถือกระบอกน้ำกับหมวกบังแดด คนในตลาดเดินผ่าน บางคนวางขนมไว้ที่เท้าบาเรล ส่วนมากเป็นขนมหวาน
        effects:
          flags: [spoke_for_barel, stood_by_barel_in_the_stocks]
          people: [{ id: friend_barel, name: บาเรล, gender: m, bond: friend, closeness: 2, age: 47 }]
    - id: tell_him_to_tell
      label: ไปหาบาเรลก่อนวันศาล บอกให้พูดความจริงครั้งนี้
      text: |
        บาเรลฟังจนจบ แล้วถามกลับว่าตอนนั้น{name}พูดความจริงหรือเปล่า ตอนครอบแก้วแตก {name}ไม่ได้ตอบ บาเรลบอกว่าคนบางคนรับแทนคนอื่นได้ บางคนรับแทนไม่เป็น เขาเพิ่งรู้ว่าตัวเองเป็นแบบแรก ช้าไปหน่อย

        วันศาลบาเรลรับผิดตามเดิม ยืนขื่อสามวัน นายร้านไม่ไล่เขาออกตามที่สัญญา หน้าหนาวนั้นบาเรลส่งแป้งมาให้บ้าน{name}หนึ่งกระสอบ ชั่งเกินไปหนึ่งขีด
      effects: { alignment: { law: 1 }, flags: [told_barel_to_tell_the_truth] }
    - id: read_the_ledger
      label: ขอดูสมุดบัญชีร้านแป้ง หาว่าใครเป็นคนตั้งตาชั่งจริง
      requires: { flag: job_clerk }
      check: { stat: INT, dc: 13 }
      success:
        text: |
          สมุดบัญชีร้านแป้งเขียนด้วยลายมือสองแบบ แบบหนึ่งของบาเรล แบบหนึ่งของนายร้าน หน้าที่ตัวเลขไม่ตรงกับน้ำหนักจริงทุกหน้าเป็นลายมือนายร้าน {name}คัดหน้าเหล่านั้นใส่กระดาษ ยื่นให้ศาลในเช้าวันตัดสิน

          ศาลยกฟ้องบาเรล นายร้านยืนขื่อแทนสามวัน บาเรลตกงาน {name}หางานเสมียนให้เขาได้ในเดือนต่อมา ลายมือของเขาสวยกว่าที่{name}คิด
        effects:
          stats: { INT: 1 }
          flags: [cleared_barel_with_the_ledger]
          people: [{ id: friend_barel, name: บาเรล, gender: m, bond: friend, closeness: 2, age: 47 }]
      failure:
        text: |
          สมุดบัญชีร้านแป้งเล่มที่มีตัวเลขช่วงนั้นหายไปจากชั้น นายร้านบอกว่าหนูกัด {name}เปิดเล่มอื่นดูทั้งคืน ไม่เจออะไรที่ใช้ได้

          บาเรลยืนขื่อสามวันตามคำตัดสิน {name}ไปยืนข้างๆ วันสุดท้าย บาเรลบอกว่าไม่ต้องเสียใจเรื่องสมุด หนูร้านนั้นกัดทุกเล่มที่นายร้านสั่งให้กัด
        effects: { flags: [cleared_barel_with_the_ledger, the_ledger_went_missing] }
    - id: stand_beside_him
      label: ไม่ขึ้นศาล แต่ไปยืนข้างบาเรลกลางลานตลาดทั้งสามวัน
      text: |
        วันแรก{name}ยืนอยู่ข้างขื่อทั้งวัน คนในตลาดมองบาเรลแล้วมอง{name} ไม่รู้ว่าใครโดนลงโทษ วันที่สองภรรยาบาเรลมายืนด้วย วันที่สามลูกๆ ของบาเรลมาครบทุกคน

        เย็นวันที่สามบาเรลออกจากขื่อ ข้อมือแดงเป็นวง เขาซื้อขนมหวานหนึ่งชิ้นจากแผงข้างลาน ผ่าครึ่ง ยื่นครึ่งหนึ่งให้{name} โดยไม่ต้องอธิบาย
      effects:
        alignment: { moral: 1 }
        flags: [stood_by_barel_in_the_stocks]
        people: [{ id: friend_barel, name: บาเรล, gender: m, bond: friend, closeness: 2, age: 47 }]

- id: adult.back_comrade
  stage: adult
  scene: road
  weight: 30
  when:
    age: [41, 60]
    any_flags: [carried_comrade_home, trusted_on_watch, kept_comrade_token]
  text: |
    เกวียนที่{name}เดินทางไปด้วยหยุดให้ม้ากินน้ำที่หมู่บ้านริมทาง หลักหินบอกชื่อหมู่บ้านไว้ด้วยสีแดงที่ลอกไปครึ่งหนึ่ง {name}อ่านชื่อนั้นแล้วนึกออกก่อนจะอ่านจบ เจ้าตัวโตมาจากหมู่บ้านนี้ เจ้าตัวโตที่ไหล่กว้างกว่าครึ่งช่วงแขน หัวเราะเสียงดังจนหัวหน้าต้องหันมาดุ แบ่งของกินให้โดยไม่ต้องขอ และไม่ตื่นมาเข้าเวรในเช้าวันที่ห้าของไข้

    หญิงชราคนหนึ่งนั่งอยู่บนม้านั่งข้างบ่อน้ำ ไหล่กว้างกว่าผู้หญิงทุกคนในหมู่บ้าน ตัวเล็กลงตามวัยแต่ไหล่ยังกว้าง คนเลี้ยงม้าบอกว่าแกนั่งตรงนั้นทุกบ่าย ดูเกวียนที่ผ่านไปผ่านมา ลูกชายคนหนึ่งของแกเคยไปเป็นทหาร

    คนขับเกวียนบอกว่าพักได้ครึ่งชั่วยาม
  choices:
    - id: she_remembers_the_cart
      label: เดินไปนั่งข้างแก บอกว่าเคยลากเกวียนมือล้อคดมาถึงหมู่บ้านนี้
      requires: { flag: carried_comrade_home }
      text: |
        แกจำเกวียนได้ก่อนจำหน้า ล้อหนึ่งคด ฝนตกตลอดวัน ผ้าคลุมของทหารอีกคนห่มทับผ้าของคลังอีกชั้น แกบอกว่าผ้าผืนนั้นยังอยู่ ซักแล้ว พับเก็บไว้ในหีบ ไม่รู้จะคืนใคร

        ครึ่งชั่วยามหมดตอนแกเล่าเรื่องเจ้าตัวโตตอนเด็กไปได้สามเรื่อง คนขับเกวียนตะโกนเรียก แกบอกให้ไปเถอะ แล้วบอกว่าผ้าผืนนั้นจะเก็บไว้ต่อ ไม่ต้องเอาคืน
      effects: { alignment: { moral: 1 }, flags: [sat_with_the_big_ones_mother] }
    - id: i_stood_his_watch
      label: บอกแกว่าคืนที่ลูกชายแกไป {name}ยืนเวรแทนเขาจนสาง
      requires: { flag: trusted_on_watch }
      text: |
        แกฟังแล้วถามว่าในตารางเวร ชื่อลูกแกมีคนขีดออกตอนไหน {name}บอกว่าบ่ายวันนั้น หลังจาก{name}ยืนเวรของเขาจนสาง แกบอกว่าดี ถ้าอย่างนั้นลูกแกก็ยังอยู่ในเวรอีกคืนหนึ่ง

        คนขับเกวียนตะโกนเรียก แกลุกขึ้นจากม้านั่ง ยืนตัวตรงให้{name}เดินผ่านไปขึ้นเกวียน ยืนแบบที่ทหารยืนตอนคนเปลี่ยนเวรเดินผ่าน
      effects: { stats: { WIS: 1 }, flags: [told_her_i_stood_his_watch] }
    - id: finish_the_dog
      label: หยิบหมาไม้ตัวเท่านิ้วโป้งออกมา แกะขาหลังที่ยังติดกันให้แยกออกก่อนยื่นให้แก
      requires: { flag: kept_comrade_token }
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}นั่งบนขอบบ่อ ใช้มีดพับแกะทีละนิด ขาหลังสองข้างแยกออกจากกัน มีอุ้งเท้า มีหางสั้นๆ ทันก่อนคนขับเกวียนตะโกนเรียก หญิงชราดูมือ{name}อยู่ตลอด ไม่ถามว่าจะทำอะไร

          {name}ยื่นหมาไม้ให้ บอกว่าลูกชายแกแกะค้างไว้ แกถือหมาไม้ไว้ในอุ้งมือ พลิกดูขาหน้าที่ลูกแกะ พลิกดูขาหลังที่คนแปลกหน้าแกะ แล้วบอกว่ามือคนละคน แต่เป็นหมาตัวเดียวกัน
        effects: { stats: { DEX: 1 }, flags: [finished_the_wooden_dog] }
      failure:
        text: |
          มีดพับลื่น ขาหลังข้างหนึ่งหักหลุดไปทั้งขา {name}นั่งมองหมาไม้สามขาในมือ ไม่รู้จะทำอย่างไรต่อ คนขับเกวียนตะโกนเรียก

          หญิงชราเดินมาหยิบหมาไม้จากมือ{name}ไปเอง พลิกดูทั้งตัว บอกว่าลูกแกเคยเลี้ยงหมาสามขาอยู่ตัวหนึ่งตอนเด็ก หมาตัวนั้นวิ่งเร็วกว่าหมาทุกตัวในหมู่บ้าน แล้วเก็บหมาไม้ใส่กระเป๋าเสื้อ
        effects: { hp: -1, flags: [finished_the_wooden_dog] }
    - id: tell_her_one_story
      label: นั่งลงข้างแก เล่าเรื่องเจ้าตัวโตให้ฟังหนึ่งเรื่อง เรื่องที่ทำให้หัวหน้าต้องหันมาดุ
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}เล่าเรื่องคืนที่เจ้าตัวโตแอบเอาเกลือใส่ชาของหัวหน้า แล้วหัวเราะดังจนหัวหน้ารู้ทั้งที่ยังไม่ได้ชิม แกฟังแล้วหัวเราะเสียงเดียวกัน ดังเท่ากัน คนเลี้ยงม้าหันมาดู

          แกบอกว่าลูกแกทำแบบนี้กับพ่อของเขาทุกปีใหม่ ใส่เกลือในชาแล้วหัวเราะก่อน ไม่เคยมีใครดื่มชาถ้วยนั้นจริงสักปี
        effects: { stats: { CHA: 1 }, flags: [told_the_salt_tea_story] }
      failure:
        text: |
          {name}เริ่มเล่าแล้วจำไม่ได้ว่าเรื่องจบอย่างไร เล่าวนกลับไปต้นเรื่องสองรอบ หญิงชรารอฟังอย่างอดทน แล้วถามว่าลูกแกเป็นคนเล่าเรื่องนี้เองใช่ไหม เพราะลูกแกก็เล่าเรื่องไม่เคยจบเหมือนกัน

          คนขับเกวียนตะโกนเรียก แกตบหลังมือ{name}สองที บอกว่าเรื่องไม่จบไม่เป็นไร คนที่เล่าเรื่องจบทุกเรื่องน่าเบื่อ
        effects: { flags: [told_the_salt_tea_story] }
    - id: drive_on
      label: กินน้ำ รดหน้า แล้วขึ้นเกวียนต่อโดยไม่เข้าไปทัก
      text: |
        {name}ล้างหน้าที่บ่อ ห่างจากม้านั่งของแกไปสามก้าว แกมองเกวียนคันที่{name}มาด้วย ไม่ได้มองคน

        เกวียนออกจากหมู่บ้าน ผ่านหลักหินสีแดงลอก {name}หันกลับไปดูครั้งเดียว ม้านั่งข้างบ่อยังมีคนนั่ง หันหน้าไปทางถนนที่เกวียนคันต่อไปจะมา
      effects: { flags: [drove_past_the_big_ones_village] }
