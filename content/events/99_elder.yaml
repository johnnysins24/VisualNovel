# ชุด 1 วัยชรา อายุ 65 ขึ้นไป: วันธรรมดาของคนแก่ เกิดซ้ำได้ (once: false) ทุกถิ่น ทุกอาชีพ
# ช่วงนี้เวลาเดินปีละเหตุการณ์ และทุกปีมีเช็คฤดูหนาว ตัวเลือกจึงเป็นเรื่องเล็กที่มีผลจริง: พลังชีวิต เงิน และความสนิทกับคนที่จะดูแลตอนหน้าหนาว
# เรื่องเกิดซ้ำได้ ข้อความต้องอ่านครั้งที่สองแล้วไม่ขัด ห้ามเขียนว่า "ครั้งแรก" หรือผูกกับเหตุการณ์ครั้งเดียว
# ท้ายไฟล์เป็นเรื่องครั้งเดียวที่ให้พรของเจ้าเดิมกับพรของอีเซล (ทั้งสองอย่างเป็นพรซ่อน ผู้เล่นไม่ได้รับคำบอก)

- id: elder.day_story
  stage: elder
  weight: 6
  once: false
  when:
    age: [65, 150]
  text: |
    เด็กข้างบ้านมานั่งลงข้าง{name}บนม้านั่งหน้าบ้าน ขาแกว่งไม่ถึงพื้น ถามว่าตอน{name}เป็นเด็ก โลกเป็นอย่างไร

    เด็กคนนี้ถามทุกคนที่แก่พอ จำคำตอบได้ทุกคำ แล้วเอาไปเทียบกันด้วย เมื่อวานเพิ่งไปบอกคนขายปลาว่าเรื่องที่เล่าไม่ตรงกับของคนขายผ้า
  choices:
    - id: true_story
      label: เล่าเรื่องจริง เท่าที่จำได้
      text: |
        {name}เล่าเรื่องกลางคืนสมัยที่ยังมืดพอให้คนเดินชนรั้ว เรื่องตะเกียงที่ต้องเติมน้ำมันทุกค่ำ เรื่องข่าวจากเมืองหลวงที่มาถึงช้าไปครึ่งปี เด็กขมวดคิ้ว ถามว่าแล้วตอนกลางคืนมองเห็นได้อย่างไร

        {name}ตอบว่ามองไม่เห็น เด็กพยักหน้าช้าๆ เหมือนเพิ่งได้ฟังเรื่องที่น่ากลัวที่สุดของวัน
      effects: { hp: 1 }
    - id: tall_tale
      label: แต่งให้ใหญ่กว่าที่เกิดจริงสักสามเท่า
      habit: sweet_tongue
      text: |
        ในเรื่องของ{name} หมูป่าตัวนั้นสูงเท่าประตู และ{name}ขี่มันเข้าตลาดโดยจับหูสองข้างต่างบังเหียน เด็กฟังตาโต ไม่ถามสักคำว่าจริงไหม

        วันต่อมาคนขายปลาเดินมาถามเอง ว่าหมูตัวนั้นสีอะไร เพราะเด็กเล่าให้ฟังแล้วไม่ยอมบอก
      effects: { flags: [tells_tall_tales] }
    - id: ask_back
      label: ถามกลับว่าคนอื่นเขาเล่าว่าอย่างไร
      habit: curious
      text: |
        เด็กไล่ให้ฟังทีละคน คนขายปลาว่าเมื่อก่อนปลาตัวใหญ่กว่านี้ คนขายผ้าว่าเมื่อก่อนคนซื่อกว่านี้ สัปเหร่อว่าเมื่อก่อนคนตายช้ากว่านี้

        {name}ถามว่าแล้วเด็กเชื่อใคร เด็กว่ายังไม่เชื่อใคร รอถามให้ครบทั้งถิ่นก่อน
      effects: { flags: [heard_the_tally] }

- id: elder.day_salt
  stage: elder
  scene: home
  weight: 6
  once: false
  when:
    age: [65, 150]
  text: |
    แกงหม้อนี้{name}ต้มแบบเดิมที่ต้มมาทั้งชีวิต ชิมแล้วจืด เติมเกลือ ชิมอีกก็ยังจืด เติมอีก

    เพื่อนบ้านที่แวะมายืมกระบวยขอชิมช้อนหนึ่ง แล้วไอ ถามว่าเกลือที่ตลาดลดราคาหรือ
  choices:
    - id: measure
      label: เลิกเชื่อลิ้น ตวงเกลือด้วยช้อนตั้งแต่นี้ไป
      text: |
        {name}ขีดรอยไว้ที่ด้ามช้อนไม้ หม้อเล็กหนึ่งขีด หม้อใหญ่สองขีด ไม่ชิมอีก แกงออกมารสเดิมทุกหม้อ เพื่อนบ้านยืนยันให้

        สำหรับลิ้นของ{name} แกงทุกหม้อจืดเท่ากันหมด กินเอาอิ่ม ไม่ได้กินเอารส
      effects: { hp: 1, flags: [measures_the_salt] }
    - id: let_neighbor_taste
      label: ชวนเพื่อนบ้านมาเป็นคนชิมให้ แลกกับแกงครึ่งหม้อ
      text: |
        เพื่อนบ้านมาทุกเย็นตอนได้กลิ่น ชิม พยักหน้าหรือส่ายหน้า แล้วถือชามกลับไปครึ่งหม้อ {name}ไม่ต้องกินของเหลือข้ามวันอีก

        บางวันเพื่อนบ้านส่ายหน้าทั้งที่แกงไม่ได้เค็ม {name}รู้ แต่ก็เติมน้ำให้ตามที่บอก
      effects: { hp: 1, flags: [shares_the_pot] }
    - id: eat_it_salty
      label: กินอย่างนั้นแหละ ต้มมาแล้ว
      habit: stubborn
      text: |
        {name}กินจนหมดหม้อในสามวัน ดื่มน้ำตามมากกว่าปกติเท่าตัว ข้อเท้าบวมจนรองเท้าคับ

        หม้อถัดมาก็ใส่เกลือเท่าเดิม ลิ้นบอกว่ากำลังดี
      effects: { flags: [eats_it_salty] }

- id: elder.day_names
  stage: elder
  scene: market
  weight: 6
  once: false
  when:
    age: [65, 150]
  text: |
    มีคนเรียกชื่อ{name}จากอีกฟากของตลาด เดินฝ่าคนเข้ามาจับมือสองมือ ถามว่าสบายดีไหม หลังเป็นอย่างไร ยังนอนไม่หลับอยู่หรือเปล่า รู้ทุกเรื่อง

    {name}จำหน้าได้ จำได้ว่าเคยนั่งกินข้าวด้วยกันหลายครั้ง แต่ชื่อไม่ยอมขึ้นมา มีแต่ตัวอักษรตัวแรก ซึ่งอาจจะผิดด้วย
  choices:
    - id: ask_plainly
      label: ถามตรงๆ ว่าชื่ออะไร ขอโทษด้วยที่ลืม
      text: |
        คนคนนั้นหัวเราะ บอกชื่อ แล้วบอกว่าตัวเองก็ลืมชื่อ{name}ไปเมื่อเดือนก่อน ต้องไปถามคนขายผักมา ถึงได้ตะโกนเรียกถูก

        สองคนยืนคุยกันจนตลาดวาย ต่างคนต่างทวนชื่ออีกฝ่ายในใจตอนแยกกัน
      effects: { hp: 1 }
    - id: talk_around_it
      label: คุยต่อไปโดยไม่เรียกชื่อ รอให้มีใครเรียกเขาก่อน
      habit: sweet_tongue
      text: |
        {name}ถามเรื่องลูก เรื่องหลังคา เรื่องเข่า ตอบถูกทุกเรื่องเพราะคนอายุเท่านี้มีเรื่องอยู่แค่นี้ ไม่มีใครเดินผ่านมาเรียกชื่อให้สักคน

        ตอนลากัน คนคนนั้นบอกว่าดีใจที่{name}ยังจำกันได้ {name}ตอบว่าใครจะลืมลง
      effects: { flags: [talks_around_names] }
    - id: guess
      label: เสี่ยงเรียกชื่อที่ขึ้นต้นด้วยตัวอักษรตัวนั้น
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          ถูก คนคนนั้นไม่รู้เลยว่าเมื่อครู่มีการเดิมพัน {name}รู้สึกเหมือนเพิ่งข้ามร่องน้ำได้โดยเท้าไม่เปียก
        effects: { hp: 1 }
      failure:
        text: |
          ผิด ชื่อนั้นเป็นของพี่ชายเขา ซึ่งตายไปหกปีแล้ว คนคนนั้นนิ่งไปอึดใจหนึ่ง แล้วบอกว่าไม่เป็นไร ใครๆ ก็ว่าหน้าเหมือนกัน

          {name}ซื้อขนมให้เขาห่อหนึ่งก่อนกลับ
        effects: { gold: -1 }

- id: elder.day_child_visit
  stage: elder
  scene: home
  weight: 8
  once: false
  cast:
    kid: { kin: [child], min_age: 16 }
  when:
    age: [65, 150]
  text: |
    {kid}มาเยี่ยมเหมือนทุกต้นเดือน หิ้วของมาเต็มสองมือ วางลงบนโต๊ะแล้วเดินสำรวจบ้าน เปิดตู้กับข้าว ดูถังน้ำ เอานิ้วลูบขอบหน้าต่างหาฝุ่น แบบเดียวกับที่{name}เคยทำกับห้องของ{kid:เขา|เธอ}เมื่อหลายสิบปีก่อน

    "กินข้าวครบมื้อหรือเปล่า" {kid:เขา|เธอ}ถาม มือกำลังนับไข่ในตะกร้า
  choices:
    - id: admit
      label: ตอบตามจริง ว่าบางวันก็ลืม
      text: |
        {kid}ไม่ดุ {kid:เขา|เธอ}ออกไปคุยกับบ้านข้างๆ อยู่พักหนึ่ง กลับมาบอกว่าตกลงกันแล้ว ตั้งแต่พรุ่งนี้จะมีคนเคาะประตูตอนเที่ยงทุกวัน

        คนที่มาเคาะคือเด็กเก้าขวบ ถือชามมาด้วย แล้วยืนดูจนกว่า{name}จะกินหมด ตามที่ถูกสั่งมา
      effects:
        hp: 2
        people: [{ id: "@kid", closeness: 1 }]
    - id: say_fine
      label: บอกว่าครบ แล้วถามเรื่องงานของ{kid}แทน
      habit: stubborn
      text: |
        {kid}เล่าเรื่องงานให้ฟังยาว ระหว่างนั้นมือก็นับไข่จนเสร็จ ไข่เหลือเท่ากับที่เอามาให้เมื่อเดือนก่อน

        {kid:เขา|เธอ}ไม่ได้พูดอะไร ก่อนกลับต้มไข่ไว้ให้หกฟอง ปอกเปลือกแล้วด้วย
      effects: { hp: 1 }
    - id: stay_for_supper
      label: บอกให้อยู่กินข้าวเย็นด้วยกันก่อน
      text: |
        {kid}เป็นคนทำ {name}เป็นคนบอกว่าของอะไรอยู่ตรงไหน บอกผิดไปสองอย่าง หม้อที่ว่าอยู่ใต้เตาไปอยู่บนชั้น ไม่มีใครรู้ว่าใครย้าย

        กินกันจนมืด {kid}เล่าเรื่องที่ไม่เคยเล่าตอนมาแค่วางของ {name}ก็เล่าเรื่องที่ไม่เคยเล่าเหมือนกัน
      effects:
        hp: 1
        people: [{ id: "@kid", closeness: 1 }]

- id: elder.day_prices
  stage: elder
  scene: market
  weight: 6
  once: false
  when:
    age: [65, 150]
  text: |
    เกลือขึ้นราคาอีกแล้ว คนขายบอกราคาใหม่โดยไม่เงยหน้า {name}จำได้ว่าเหรียญเดียวเคยซื้อเกลือได้ทั้งถุง กับขนมปังอีกก้อน แล้วยังได้ทอน

    คนที่ต่อคิวอยู่ข้างหลังอายุไม่ถึงสามสิบ จ่ายราคาใหม่โดยไม่กะพริบตา
  choices:
    - id: pay_and_grumble
      label: จ่าย แล้วบอกคนขายว่าเมื่อก่อนราคาเท่าไร
      requires: { min_gold: 1 }
      text: |
        คนขายฟังจนจบ แล้วบอกว่าเมื่อก่อนค่าเช่าแผงก็ไม่ใช่ราคานี้เหมือนกัน เขาตักเกลือแถมให้อีกครึ่งกำมือ เพราะเป็นคนเดียวในวันนี้ที่ยืนคุยด้วยเกินสองประโยค
      effects: { gold: -1 }
    - id: haggle
      label: ต่อราคา ด้วยเหตุผลว่าซื้อร้านนี้มาตั้งแต่รุ่นพ่อของเขา
      requires: { min_gold: 1 }
      check: { stat: CHA, dc: 11 }
      success:
        text: |
          คนขายถอนใจ บอกว่าพ่อสั่งไว้ก่อนตายว่าถ้า{name}มาต่อ ให้ยอม เพราะจะยืนอยู่ตรงนั้นจนแผงปิด เขาคิดราคาเดิม แล้วขอว่าอย่าไปบอกใคร
        effects: { flags: [old_price_for_salt] }
      failure:
        text: |
          คนขายบอกว่าพ่อของเขาก็ขึ้นราคากับ{name}มาแล้วสามครั้ง แต่ละครั้ง{name}ก็พูดประโยคนี้ {name}จ่ายราคาใหม่
        effects: { gold: -1 }
    - id: half_bag
      label: ซื้อแค่ครึ่งถุง แล้วใช้ให้นานเท่าเดิม
      habit: tight_fist
      text: |
        ครึ่งถุงอยู่ได้ทั้งเดือน ถ้าใส่ทีละหยิบแทนทีละกำ แกงของ{name}จืดลง แต่ลิ้นก็ไม่ค่อยรู้รสอยู่แล้ว

        เหรียญที่เหลือเข้าไหไปรวมกับเหรียญอื่น ไหใบนั้นไม่รู้ว่าจะเก็บไว้ให้ใคร
      effects: { gold: 1 }

- id: elder.day_awake
  stage: elder
  scene: home
  time: night
  weight: 6
  once: false
  when:
    age: [65, 150]
  text: |
    {name}ตื่นกลางดึกโดยไม่มีเหตุ เหมือนเกือบทุกคืนในระยะหลัง ร่างกายที่แก่ต้องการนอนน้อยลง หรือไม่อย่างนั้นก็ลืมวิธีไปแล้ว

    นอกหน้าต่างฟ้าสว่างด้วยดาว สว่างกว่าสมัยที่{name}ยังหนุ่มสาวจนเทียบกันไม่ได้ ถนนว่าง ตะเกียงฟ้าหน้าบ้านตรงข้ามหรี่อยู่ดวงเดียว
  choices:
    - id: walk_out
      label: ออกไปเดินในถนนที่ไม่มีคน
      text: |
        คนเดียวที่ตื่นอยู่คือคนทำขนมปัง กำลังนวดแป้งอยู่หลังร้าน ประตูเปิดแง้มไว้ระบายร้อน เขาเห็น{name}ก็ไม่แปลกใจ บอกว่าคนแก่ถนนนี้มาเดินตอนดึกกันสามคนแล้ว

        {name}ได้ขนมปังก้อนแรกของเตา ร้อนจนต้องสลับมือถือ กินหมดก่อนถึงบ้าน
      effects: { hp: 1 }
    - id: lie_and_count
      label: นอนลืมตารอเช้า ไล่นับของที่ต้องทำพรุ่งนี้
      text: |
        ของที่ต้องทำมีสี่อย่าง นับวนไปได้สิบกว่ารอบก็กลายเป็นหกอย่าง แล้วก็เหลือสาม {name}หลับไปตอนฟ้าเริ่มเทา ตื่นอีกทีสายจนตลาดวาย

        ทำได้อย่างเดียวจากทั้งหมด
      effects: { flags: [counts_at_night] }
    - id: light_the_lamp
      label: จุดตะเกียง หยิบงานที่ค้างมือขึ้นมาทำ
      habit: craft_hands
      text: |
        งานที่ทำตอนดึกเดินช้าแต่เงียบ ไม่มีใครมาเคาะประตู ไม่มีใครตะโกนข้ามรั้ว {name}ทำไปได้มากกว่าที่ทำตอนกลางวันทั้งสัปดาห์

        เช้ามาตาแสบ หลังแข็ง เพื่อนบ้านถามว่าเมื่อคืนเห็นไฟ ไม่สบายหรือเปล่า
      effects: { gold: 1 }

- id: elder.day_cortege
  stage: elder
  scene: road
  weight: 6
  once: false
  when:
    age: [65, 150]
  text: |
    ขบวนศพผ่านหน้าบ้านตอนสาย คนตายอายุน้อยกว่า{name}ยี่สิบปี รู้จักกันแค่ผิวเผิน เคยซื้อของกันสองสามครั้ง

    คนในขบวนบางคนเหลือบมองมาที่ม้านั่งหน้าบ้าน แล้วรีบมองไปทางอื่น {name}รู้ว่าคนพวกนั้นคิดอะไร เพราะเคยคิดแบบเดียวกันตอนที่ยังเดินอยู่ในขบวน
  choices:
    - id: stand
      label: ลุกขึ้นยืน จนกว่าขบวนจะผ่านไปหมด
      text: |
        กว่าจะลุกได้ขบวนก็ผ่านไปครึ่งหนึ่งแล้ว {name}ยืนเกาะพนักม้านั่งจนคนสุดท้ายเลี้ยวพ้นมุมถนน เด็กที่เดินรั้งท้ายหันมาโค้งให้

        เข่าสั่นอยู่พักหนึ่งหลังนั่งลง
      effects: { alignment: { law: 1 } }
    - id: follow
      label: เดินตามไปส่งถึงหลุม
      habit: soft_heart
      text: |
        {name}เดินรั้งท้าย ช้ากว่าขบวนจนทิ้งห่าง ไปถึงตอนที่ดินกำแรกลงไปแล้ว ญาติของคนตายไม่รู้ว่า{name}เป็นใคร แต่ก็ขยับที่ให้ยืน

        ขากลับมีคนในขบวนเดินมาประคองแขนโดยไม่ได้ถูกขอ มาส่งถึงหน้าบ้าน แล้วถามว่าพรุ่งนี้มีอะไรกินหรือยัง
      effects: { alignment: { moral: 1 } }
    - id: nod
      label: นั่งอยู่อย่างเดิม พยักหน้าให้คนที่มองมา
      habit: cold_blood
      text: |
        คนที่ถูกพยักหน้าให้สะดุ้งเหมือนถูกจับได้ แล้วพยักตอบ {name}นับคนในขบวนได้สี่สิบสอง มากกว่างานของคนอายุเท่า{name}ที่ผ่านไปเมื่อเดือนก่อนเกือบเท่าตัว

        คนแก่ตาย คนมางานน้อย เพราะคนที่ควรมาตายไปก่อนแล้ว
      effects: { flags: [counts_corteges] }

- id: elder.day_fence
  stage: elder
  weight: 6
  once: false
  when:
    age: [65, 150]
  text: |
    สองบ้านในถนนทะเลาะกันเรื่องรั้ว ฝ่ายหนึ่งว่ารั้วขยับเข้ามาหนึ่งคืบ อีกฝ่ายว่าอยู่ตรงนี้มาตั้งแต่รุ่นปู่ ไม่มีใครมีกระดาษ ทั้งสองฝ่ายจึงมายืนอยู่หน้าบ้าน{name} เพราะ{name}แก่พอจะเคยเห็นรั้วเดิม

    {name}จำรั้วเดิมได้ รั้วเดิมไม่ได้อยู่ตรงที่ฝ่ายไหนว่าเลย
  choices:
    - id: say_what_was
      label: บอกตามที่จำได้ ทั้งที่ไม่มีฝ่ายไหนอยากฟัง
      text: |
        รั้วเดิมอยู่ลึกเข้าไปในที่ของทั้งสองบ้านอีกฝั่งละศอก ตรงกลางเคยเป็นทางเดินของคนทั้งถนน ปู่ของทั้งสองฝ่ายช่วยกันขยับรั้วมาชนกันในคืนเดียว {name}เห็นกับตา ตอนนั้นยังเด็ก

        สองบ้านกลับไปเงียบๆ ไม่มีใครพูดเรื่องรั้วอีก และไม่มีใครเอาของมาให้{name}ไปพักใหญ่
      effects: { alignment: { law: 1 }, flags: [told_about_the_fence] }
    - id: too_old
      label: บอกว่าจำไม่ได้แล้ว แก่เกินไป
      habit: faint_heart
      text: |
        สองฝ่ายมองหน้ากัน แล้วไปหาคนแก่อีกคนในถนนถัดไป คนนั้นจำได้ และจำเข้าข้างบ้านที่เอาไก่ไปให้

        {name}นั่งอยู่หน้าบ้านต่อ รั้วใหม่ขึ้นภายในสัปดาห์ ผิดที่ไปอีกครึ่งคืบ
      effects: { flags: [played_too_old] }
    - id: split_it
      label: บอกให้ถอยคนละครึ่งคืบ แล้วเลี้ยงเหล้ากันคนละจอก
      habit: sweet_tongue
      text: |
        ไม่มีฝ่ายไหนพอใจ ซึ่ง{name}ถือว่าเป็นสัญญาณดี รั้วขยับไปอยู่กึ่งกลาง เหล้าสองจอกกลายเป็นสองไห สองบ้านเมากันจนลืมว่าทะเลาะเรื่องอะไร

        เช้ามามีไหผักดองวางอยู่หน้าประตูบ้าน{name}สองไห จากคนละบ้าน
      effects: { hp: 1, flags: [split_the_fence] }

- id: elder.day_winter_stock
  stage: elder
  scene: home
  weight: 7
  once: false
  when:
    age: [65, 150]
  text: |
    ลมเริ่มเปลี่ยนทิศ อีกไม่ถึงเดือนน้ำในถังจะเริ่มมีแผ่นน้ำแข็งตอนเช้า คนขายเชื้อไฟเข็นเกวียนมาตามถนนเป็นรอบสุดท้ายของปี ราคาขึ้นจากรอบก่อนตามเคย

    กองเชื้อไฟข้างบ้าน{name}เหลืออยู่ครึ่งกอง พอสำหรับหน้าหนาวที่ไม่ยาว
  choices:
    - id: fill_the_pile
      label: จ่ายสองเหรียญ ซื้อให้เต็มกอง
      requires: { min_gold: 2 }
      text: |
        คนขายขนลงให้ถึงข้างประตู เรียงให้ด้วย เพราะเห็นว่าคนซื้อเรียงเองไม่ไหวแล้ว กองสูงถึงขอบหน้าต่าง

        หน้าหนาวปีนั้นเตาของ{name}ไม่ดับสักคืน เพื่อนบ้านสองบ้านมาขอนั่งผิงตอนที่ของตัวเองหมด
      effects: { gold: -2, hp: 2 }
    - id: half_and_layers
      label: ซื้อเพิ่มเหรียญเดียว ที่เหลือใส่เสื้อสองชั้นเอา
      requires: { min_gold: 1 }
      habit: tight_fist
      text: |
        {name}จุดเตาเฉพาะตอนเช้ากับตอนค่ำ กลางวันห่มผ้านั่งตรงที่แดดลอดหน้าต่าง ย้ายเก้าอี้ตามแดดไปวันละสามที่

        กองเชื้อไฟหมดพอดีกับวันที่น้ำแข็งเริ่มละลาย เหลืออยู่สองท่อน
      effects: { gold: -1 }
    - id: work_for_it
      label: ไม่จ่าย ขอช่วยเขาขนลงทั้งถนนแลกเอา
      check: { stat: CON, dc: 11 }
      success:
        text: |
          {name}ขนไม่ได้เร็ว แต่ขนไม่หยุด คนขายทีแรกจะปฏิเสธ พอเห็นว่าขนถึงบ้านที่สี่แล้วยังเดินตรงอยู่ก็เลิกพูด จบวันเขาเทให้เต็มกองโดยไม่คิดเงิน แล้วถามว่าปีหน้าจะเอาอีกไหม
        effects: { hp: 1, flags: [hauled_for_fuel] }
      failure:
        text: |
          บ้านที่สอง{name}ก็ต้องนั่งลงบนขอบเกวียน มือสั่น หายใจไม่ทัน คนขายเทให้ครึ่งกองเป็นค่าแรงเท่าที่ทำ แล้วไล่ให้กลับบ้าน

          {name}นอนซมไปสองวันก่อนจะได้ใช้เชื้อไฟกองนั้น
        effects: { hp: -2 }

- id: elder.day_tonic
  stage: elder
  scene: market
  weight: 6
  once: false
  when:
    age: [65, 150]
  text: |
    หมอยาเร่กลับมาตั้งแผงที่ตลาดเหมือนทุกปลายหน้าเกี่ยว ยาบำรุงขวดสีเขียวของแกขายดีในหมู่คนอายุเท่า{name} ขวดละสองเหรียญ แกสาบานว่าทำจากรากที่ขึ้นเฉพาะโคนเสาฟ้า

    คนแก่ที่ซื้อเมื่อปีก่อนบางคนเดินมาซื้ออีก บางคนไม่ได้มาแล้ว หมอยาไม่ได้พูดถึงพวกหลัง
  choices:
    - id: buy_a_bottle
      label: จ่ายสองเหรียญ ซื้อหนึ่งขวด
      requires: { min_gold: 2 }
      text: |
        รสเหมือนหญ้าต้มกับสนิม {name}กินวันละช้อนตามที่แกสั่ง ขึ้นบันไดได้โดยไม่ต้องพักไปทั้งเดือน จะเพราะยาหรือเพราะเชื่อว่ายาได้ผล ขาสองข้างไม่ได้ถาม

        ขวดเปล่าเอาไว้ใส่น้ำมันตะเกียง
      effects: { gold: -2, hp: 3 }
    - id: find_the_root
      label: ถามว่ารากอะไร แล้วไปหาขุดเอง
      habit: curious
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          หมอยาไม่บอก แต่กลิ่นในขวดบอก {name}เคยได้กลิ่นนี้จากหญ้าที่ขึ้นริมคูหลังตลาด ไปขุดมาต้มเอง ขมกว่าของแกเพราะไม่ได้ใส่น้ำผึ้ง แต่ขาเบาเหมือนกัน

          ปีถัดมาหมอยาเห็น{name}เดินผ่านแผงโดยไม่ซื้อ ก็หรี่ตามองตามจนสุดถนน
        effects: { hp: 2, flags: [knows_the_root] }
      failure:
        text: |
          รากที่{name}ขุดมาหน้าตาเหมือน กลิ่นก็เหมือน ต้มกินไปสองช้อน ท้องเดินอยู่สามวัน

          หมอยาได้ยินเรื่องเข้าก็ไม่หัวเราะ แกส่งเด็กเอายาแก้มาให้ขวดหนึ่ง ไม่คิดเงิน กับคำฝากว่าครั้งหน้าให้ถาม
        effects: { hp: -2 }
    - id: walk_past
      label: เดินผ่านไป
      requires: { not_traits: [curious] }
      text: |
        หมอยาตะโกนตามหลังว่าปีหน้าราคาขึ้น {name}ตอบโดยไม่หันไปว่าปีหน้าค่อยว่ากัน

        ทั้งสองคนรู้ว่าประโยคนี้สำหรับคนอายุเท่า{name}แปลว่าอะไร แกหัวเราะก่อน
      effects: { flags: [skipped_the_tonic] }

- id: elder.day_old_song
  stage: elder
  scene: tavern
  weight: 6
  once: false
  when:
    age: [65, 150]
  text: |
    มีคนร้องเพลงอยู่ในร้านเหล้า เพลงที่{name}ไม่ได้ยินมาหลายสิบปี คนร้องเป็นนักดนตรีเร่อายุไม่ถึงยี่สิบ ร้องผิดไปหนึ่งที่ เนื้อท่อนที่สามสลับกับท่อนที่สี่

    ไม่มีใครในร้านรู้ว่าผิด คนที่รู้ทยอยตายไปเกือบหมดแล้ว
  choices:
    - id: sing_it_right
      label: ร้องท่อนที่ถูกให้ฟัง
      text: |
        เสียงของ{name}แหบและขึ้นไม่ถึงตัวสูง แต่เนื้อถูกทุกคำ นักดนตรีหยุดดีด ฟังจนจบ แล้วขอให้ร้องซ้ำอีกรอบช้าๆ ปากขมุบขมิบตาม

        รอบถัดมาเขาร้องถูก คนในร้านไม่รู้ว่ามีอะไรเปลี่ยน เพลงเพลงนี้มีคนรู้เนื้อที่ถูกเพิ่มขึ้นอีกหนึ่งคน
      effects: { hp: 1, flags: [passed_on_the_song] }
    - id: let_it_be
      label: ปล่อยให้ร้องไปอย่างนั้น
      text: |
        ท่อนที่สลับกันฟังดูดีกว่าของเดิมด้วยซ้ำ ถ้าไม่เคยได้ยินของเดิม คนในร้านตบโต๊ะตามจังหวะ {name}ตบตามไปด้วย

        เพลงเป็นของคนที่ยังร้องอยู่ {name}ไม่ได้ร้องมานานแล้ว
      effects: { flags: [let_the_song_change] }
    - id: pay_for_again
      label: วางเหรียญหนึ่ง ขอให้ร้องอีกรอบ
      requires: { min_gold: 1 }
      text: |
        นักดนตรีร้องอีกรอบ ผิดที่เดิม {name}หลับตาฟัง ในหัวได้ยินอีกเสียงหนึ่งร้องซ้อนอยู่ เสียงที่ร้องถูก ของคนที่เคยร้องเพลงนี้ให้ฟังเมื่อนานมาแล้ว

        จบเพลงแล้ว{name}ยังนั่งหลับตาอยู่อีกพักหนึ่ง เจ้าของร้านเดินมาดูว่ายังหายใจไหม
      effects: { gold: -1, hp: 1 }

- id: elder.day_leak
  stage: elder
  scene: home
  weight: 6
  once: false
  when:
    age: [65, 150]
  text: |
    ฝนตกทั้งคืน เช้ามามีน้ำหยดลงกลางห้องเป็นจังหวะ หลังคารั่วตรงที่เดิมกับปีก่อน ตรงที่{name}เคยปีนขึ้นไปอุดเองได้ในครึ่งชั่วยาม

    บันไดพาดยังพิงอยู่ข้างบ้าน
  choices:
    - id: climb
      label: ปีนขึ้นไปอุดเอง
      habit: stubborn
      check: { stat: DEX, dc: 11 }
      success:
        text: |
          ขึ้นได้ทีละขั้น พักทุกสามขั้น บนหลังคา{name}คลานไปถึงรอยรั่ว อุดด้วยผ้าชุบยางอย่างที่ทำทุกปี ขาลงยากกว่าขาขึ้น เท้าต้องคลำหาขั้นบันไดอยู่นาน

          เพื่อนบ้านออกมาเห็นตอนถึงพื้นพอดี ด่ายาวกว่าเวลาที่ใช้ซ่อม
        effects: { flags: [fixed_the_leak] }
      failure:
        text: |
          ขั้นที่ห้าเท้าเหยียบพลาด บันไดไถลไปข้างหนึ่ง {name}ตกลงมาบนกองฟางที่มีคนเอามากองไว้ข้างบ้านพอดี ฟางกองนั้นไม่ได้หนาเท่าที่ควร

          เพื่อนบ้านเป็นคนขึ้นไปอุดให้ในวันต่อมา ส่วน{name}นอนคว่ำอยู่สัปดาห์หนึ่ง
        effects: { hp: -3 }
    - id: hire
      label: จ่ายเหรียญหนึ่ง จ้างเด็กหนุ่มข้างบ้านขึ้นไป
      requires: { min_gold: 1 }
      text: |
        เด็กหนุ่มขึ้นไปถึงสันหลังคาในสิบอึดใจ {name}ยืนอยู่ข้างล่าง ตะโกนบอกว่าต้องอุดตรงไหน อย่างไร ใช้ผ้าผืนไหน เด็กหนุ่มตะโกนตอบว่ารู้แล้วทุกครั้ง

        รอยที่เขาอุดไม่รั่วอีกทั้งหน้าฝน แต่ไปรั่วที่ใหม่ ห่างออกไปหนึ่งศอก ตรงที่เขาเหยียบ
      effects: { gold: -1 }
    - id: bucket
      label: เอาถังไปรอง
      habit: tight_fist
      text: |
        ถังเต็มทุกครึ่งคืน {name}ตื่นมาเทเองโดยไม่ต้องมีใครปลุก เสียงหยดเปลี่ยนตอนน้ำใกล้ขอบ หูที่ได้ยินอย่างอื่นไม่ค่อยชัดกลับจับเสียงนี้ได้ทุกครั้ง

        น้ำฝนในถังเอาไว้ล้างชาม ไม่ต้องเดินไปบ่อ
      effects: { flags: [bucket_under_the_leak] }

# ===================== พรที่ไม่มีใครประกาศ =====================

# พรหน้าต่างเปิด (old_wind): เปิดหน้าต่างให้คนตาย และไม่ขังนกป่า ทางที่ขังนกคือทางที่ทำให้พรหลุด
- id: elder.window_for_the_dead
  stage: elder
  scene: home
  time: night
  weight: 8
  cast:
    gone: { kin: [father, mother, spouse], alive: false }
  when:
    age: [36, 95]
  text: |
    คืนนี้ครบรอบปีที่{gone}จากไป คนแก่ในถิ่นสอนต่อกันมาว่าคืนแบบนี้ต้องเปิดหน้าต่างไว้บานหนึ่งจนเช้า ไม่มีใครบอกได้ว่าเปิดให้ใคร หรือเปิดทำไม รู้แต่ว่าแม่ของแม่ก็ทำ

    ลมคืนนี้เย็น {name}เปิดหน้าต่างบานเล็กข้างเตียงไว้ได้ไม่นาน ก็มีนกป่าตัวหนึ่งบินเข้ามาเกาะขอบหน้าต่าง ตัวสีเทา ขนอกเป็นจุด ชนิดที่คนในตลาดรับซื้อตัวละสองเหรียญ เพราะร้องเพราะและเลี้ยงยาก

    นกไม่กลัวคน เอียงคอมอง{name} แล้วก้าวเข้ามาในห้องหนึ่งก้าว
  choices:
    - id: leave_it_open
      label: ปล่อยหน้าต่างไว้อย่างนั้น ห่มผ้าเพิ่มอีกผืน
      text: |
        นกเดินสำรวจขอบโต๊ะ จิกเศษขนมปังที่เหลือจากมื้อเย็น แล้วขึ้นไปเกาะหัวเตียงฝั่งที่ว่าง ซุกหัวเข้าใต้ปีก {name}นอนฟังเสียงลมกับเสียงขนนกขยับจนหลับ

        เช้ามานกไปแล้ว บนขอบหน้าต่างเหลือขนสีเทาอยู่เส้นหนึ่ง ตั้งแต่คืนนั้น{name}รู้ล่วงหน้าว่าลมจะเปลี่ยนทิศเมื่อไร ก่อนที่ธงบนหลังคาวิหารจะรู้
      effects: { mark: "เปิดหน้าต่างไว้ให้{gone}ทั้งคืน", traits: [old_wind], taboo: { wind: keep }, flags: [kept_the_window] }
    - id: shut_it
      label: หนาวเกินไป ปิดหน้าต่างหลังนกบินออก
      text: |
        {name}โบกมือไล่เบาๆ นกบินออกไปเกาะรั้ว มองกลับมาครู่หนึ่ง แล้วบินหายไปในฟ้าที่สว่างด้วยดาว {name}ปิดหน้าต่าง ลงกลอน

        ห้องอุ่นขึ้นทันที และเงียบกว่าทุกคืน
      effects: { lose_traits: [old_wind], taboo: { wind: learn }, flags: [shut_the_window] }
    - id: cage_it
      label: คว้าผ้ามาคลุมจับ สองเหรียญก็คือสองเหรียญ
      habit: tight_fist
      text: |
        นกไม่ได้ดิ้น ปล่อยให้จับใส่ตะกร้าคว่ำไว้ทั้งคืน ไม่ร้องสักเสียง เช้ามา{name}เอาไปขายได้สองเหรียญตามราคา คนรับซื้อบอกว่าตัวนี้เชื่องผิดปกติ

        สามวันต่อมาคนรับซื้อเดินมาบอกว่านกไม่กินอะไรเลย แล้วก็ตาย เขาไม่ได้มาขอเงินคืน แค่อยากให้รู้
      effects: { gold: 2, alignment: { moral: -1 }, lose_traits: [old_wind], taboo: { wind: break }, flags: [caged_the_bird] }

# พรเตาไฟ (boon_hearth): เลี้ยงเด็กที่ไม่ใช่ลูกตัวเองจนโต เด็กที่รับมาเป็นคนจริงในผังครอบครัว
- id: adult.hearth_child
  stage: adult
  scene: temple
  weight: 5
  when:
    age: [42, 60]
    not_flags: [has_ward]
    not_traits: [boon_hearth]
  text: |
    ต้นหน้าหนาว แม่ชีจากวิหารอีเซลเดินเคาะประตูทีละบ้าน ปีนี้เด็กในห้องยาวมีมากกว่าเตียง และมากกว่าผ้าห่ม นางขอให้บ้านที่มีเตาอุ่นรับเด็กไปอยู่ด้วยสักคน แค่จนน้ำแข็งละลาย

    เด็กที่ยืนอยู่ข้างหลังนางอายุราวเจ็ดขวบ ผอม หัวเข่าใหญ่กว่าน่อง ถือห่อผ้าใบเดียว แม่ชีบอกว่าชื่อลมบ่าย ตามเวลาที่มีคนเอามาวางไว้หน้าวิหาร

    เด็กไม่ได้มองหน้า{name} มองข้ามไหล่เข้าไปในบ้าน ไปที่เตา
  choices:
    - id: take_him_in
      label: เปิดประตูให้กว้างขึ้น บอกให้เข้ามา
      habit: soft_heart
      text: |
        ลมบ่ายนั่งหน้าเตาอยู่สามวันโดยแทบไม่พูด วันที่สี่ถามว่าฟืนอยู่ไหน แล้วเป็นคนเติมไฟตั้งแต่นั้น ไม่เคยปล่อยให้ดับสักคืน

        น้ำแข็งละลายแล้วแม่ชีไม่ได้มาตาม {name}ก็ไม่ได้พาไปส่ง หน้าหนาวถัดมาเด็กยังอยู่ และหน้าหนาวหลังจากนั้น เตาของบ้านนี้อุ่นกว่าที่เคยเป็นมาทุกปี จะเพราะฟืนหรือเพราะอย่างอื่น ไม่มีใครบอกได้
      effects:
        traits: [boon_hearth]
        flags: [has_ward, raised_a_ward]
        mark: รับลมบ่ายมาเลี้ยง
        people: [{ id: ward, name: ลมบ่าย, gender: m, kin: child, bond: kin, closeness: 2, age: 7 }]
    - id: one_winter
      label: รับไว้ แต่บอกชัดว่าแค่หน้าหนาวเดียว
      text: |
        ลมบ่ายกินน้อย พูดน้อย ช่วยงานทุกอย่างที่เอื้อมถึง วันที่น้ำแข็งละลาย เด็กพับผ้าห่มวางคืนบนเตียง ผูกห่อผ้าใบเดิม แล้วไปยืนรออยู่ที่ประตูก่อนที่ใครจะบอก

        {name}เดินไปส่งถึงวิหาร แม่ชีรับเด็กคืน ขอบคุณ แล้วบอกว่าเด็กโตขึ้นสองนิ้ว ขากลับบ้านเงียบกว่าที่{name}จำได้
      effects: { alignment: { law: 1 }, flags: [kept_a_ward_one_winter] }
    - id: give_blankets
      label: ไม่รับเด็ก แต่ยกผ้าห่มให้วิหารสองผืน
      text: |
        แม่ชีรับผ้าห่มไป ขอบคุณเท่ากับที่ขอบคุณบ้านที่รับเด็ก เด็กหันไปมองเตาอีกครั้งก่อนเดินตามนางไปบ้านถัดไป

        บ้านถัดไปรับ {name}เห็นเด็กคนนั้นเดินผ่านหน้าบ้านทุกเช้าตลอดหน้าหนาว ตัวสูงขึ้น ใส่เสื้อของคนอื่นที่ใหญ่เกินตัว
      effects: { alignment: { moral: 1 }, flags: [gave_blankets] }
