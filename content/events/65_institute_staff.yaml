# ชุด ม สถาบันเวทหลวง: คนงานในกำแพง (8 เรื่อง)
# สำหรับคนที่ไม่ใช่นักเวทและอยู่เวนทราส งานเย็นกับวันว่างข้างงานประจำ อ่านได้ทั้งคนท่า เสมียน นักร้อง และทหาร
# รับงาน 4 เรื่อง: ทางที่รับตั้ง institute_staff กับ works_at_institute_<role> และให้เงิน ทางที่ไม่รับตั้ง flag ของตัวเอง
# เรื่องต่อมา 4 เรื่อง: เห็นความลับของสำนักหนึ่งจากข้างล่าง โดยไม่มีคำของนักเวทให้เรียก ทุกทางตั้ง
#   staff_kept_<role>_quiet หรือ staff_spoke_about_<role> พร้อมชื่อเสียงที่ตรงกัน
#   เรื่องต่อมาใส่ city: ventras ไว้ด้วย เพราะเกิดในกำแพงสถาบัน คนที่ย้ายเมืองไปแล้วไม่ได้ทำงานนี้ต่อ

# ---------- รับงาน ----------

- id: adult.staff_library_hired
  stage: adult
  scene: library
  weight: 12
  when:
    age: [19, 45]
    city: ventras
    not_flags: [institute_student, institute_graduate, institute_left, institute_staff, job_researcher]
  text: |
    ร้านน้ำชาชั้นบนในย่านสถาบันคิดค่าน้ำชาแพงกว่าร้านข้างล่างครึ่งเหรียญทองแดง เพราะมีโต๊ะริมหน้าต่างให้นั่งเขียนหนังสือ วันว่างวันนั้น{name}นั่งจดรายจ่ายของเดือนลงสมุดเล่มเล็ก หญิงแก่ที่โต๊ะข้างๆ ดูอยู่ตั้งแต่บรรทัดแรก ไม่ได้ดูตัวเลข ดูเส้นที่{name}ขีดใต้ยอดรวม

    นางชื่อเมลิส เป็นเสมียนใหญ่ของห้องสมุดสถาบันเวทหลวงมายี่สิบหกปี นางบอกว่าห้องสมุดหาคนคัดสมุดยืมคืนตอนค่ำกับวันว่าง เก็บหนังสือขึ้นชั้นตามเลข ไม่ต้องอ่านออกทุกภาษา ต้องเขียนตรง และต้องไม่อ่านสิ่งที่ตัวเองเก็บ ค่าแรงเดือนละหนึ่งเหรียญ ถ้าอ่านตัวเลขเก่าบนป้ายหีบม้วนกระดาษได้ด้วย ให้สองเหรียญ

    นางวางบัตรผ่านประตูตะวันตกไว้บนโต๊ะ แผ่นทองเหลืองบางๆ เจาะรูร้อยเชือก แล้วจิบชาต่อ ไม่ได้ดูว่า{name}จะหยิบหรือไม่หยิบ
  choices:
    - id: take_it
      label: หยิบบัตรทองเหลือง รับงานเดือนละเหรียญ
      text: |
        ห้องสมุดตอนค่ำมีตะเกียงฟ้าแขวนทุกสามชั้นหนังสือ ชั้นที่อยู่กลางระหว่างตะเกียงมืดจนต้องคลำหาเลข เมลิสสอนกฎข้อแรกในคืนแรก หนังสือที่อยู่นอกมือเราไม่ใช่เรื่องของเรา แล้วสอนกฎข้อที่สองในคืนเดียวกัน หนังสือที่อยู่ในมือเรา ก็ไม่ใช่เรื่องของเราเหมือนกัน

        ปลายห้องฝั่งสำนักตำรามีชั้นหนึ่งที่ประตูตาข่ายเหล็กลงกุญแจ ข้างประตูมีสมุดเล่มหนึ่งห้อยโซ่ไว้ เมลิสบอกว่าชั้นนั้นไม่ต้องเก็บ ไม่ต้องปัดฝุ่น ไม่ต้องจำเลข
      effects: { gold: 1, flags: [institute_staff, works_at_institute_library] }
    - id: read_the_tags
      label: ขอลองอ่านป้ายหีบเก่าให้นางฟัง เอางานสองเหรียญ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ป้ายทองเหลืองบนหีบใบที่เมลิสหยิบมาให้ดูเขียนเลขแบบเก่า ขีดตั้งกับขีดนอนซ้อนกันเป็นกอง {name}นับกองทีละกอง อ่านออกมาเป็นเลขปีของรัชกาลที่ล่วงไปแล้วสองรัชกาล ถูกทั้งตัวเลขและรัชกาล

          เมลิสจดชื่อ{name}ลงสมุดคนงานด้วยลายมือที่ตรงกว่าของ{name} ค่าแรงสองเหรียญ แล้วบอกว่าคนที่อ่านป้ายพวกนี้ออกจะได้เก็บหีบปลายห้อง ฝั่งที่ตะเกียงไม่ถึง
        effects: { stats: { INT: 1 }, gold: 2, flags: [institute_staff, works_at_institute_library] }
      failure:
        text: |
          ขีดตั้งกับขีดนอนบนป้ายทองเหลืองซ้อนกันจน{name}นับผิดกองหนึ่ง อ่านออกมาเป็นปีที่ยังไม่มาถึง เมลิสหัวเราะเบาๆ บอกว่าห้องสมุดนี้ยังไม่มีหนังสือจากปีนั้น

          นางจดชื่อ{name}ลงสมุดคนงานในช่องหนึ่งเหรียญ แล้วหักค่าบัตรทองเหลืองไปจากค่าแรงเดือนแรก เพราะคนที่ได้สองเหรียญไม่ต้องจ่ายค่าบัตร
        effects: { gold: -1, flags: [institute_staff, works_at_institute_library] }
    - id: clerk_hand
      label: เปิดสมุดบัญชีที่ทำงานประจำให้นางดูลายมือ
      requires: { flag: job_clerk }
      text: |
        เมลิสพลิกดูสามหน้า ยอดที่ยกมา ยอดที่ยกไป เส้นใต้ยอดรวมที่ไม่เอียงสักเส้น แล้วปิดสมุดคืนให้ บอกว่าเสมียนที่นั่งโต๊ะกลางวันมาแล้ว กลางคืนไม่ต้องสอนอะไรอีก

        ค่าแรงสองเหรียญ งานแรกคือคัดสมุดยืมคืนของปีก่อนลงเล่มใหม่ เล่มเก่าเลอะน้ำชาจนอ่านไม่ออกครึ่งเล่ม ชื่อคนยืมครึ่งหนึ่งเป็นชื่อที่{name}เคยเห็นบนป้ายร้านในย่านสถาบัน อีกครึ่งเป็นชื่อที่มีคำว่าท่านนำหน้า
      effects: { gold: 2, alignment: { law: 1 }, flags: [institute_staff, works_at_institute_library] }
    - id: leave_the_tag
      label: ทิ้งบัตรไว้บนโต๊ะ บอกนางว่าค่ำๆ มีงานของตัวเองอยู่แล้ว
      text: |
        เมลิสเก็บบัตรทองเหลืองกลับใส่กระเป๋า ไม่ถามต่อ นางจ่ายค่าน้ำชาของทั้งสองโต๊ะ แล้วลงบันไดไปก่อน

        สัปดาห์ต่อมา{name}เดินผ่านหน้าประตูตะวันตกของสถาบัน เห็นเด็กหนุ่มคนหนึ่งยืนรอยามตรวจบัตรอยู่หน้าประตู เชือกร้อยบัตรทองเหลืองยังใหม่ ยังไม่ทันดำ
      effects: { flags: [turned_down_the_library] }

- id: adult.staff_stillroom_hired
  stage: adult
  scene: laboratory
  weight: 12
  when:
    age: [19, 45]
    city: ventras
    not_flags: [institute_student, institute_graduate, institute_left, institute_staff, job_researcher]
  text: |
    ประตูข้างของห้องกลั่นสถาบันเปิดออกทางตรอกหลังตึกตะวันตก ตอนพลบค่ำมีคนมายืนต่อแถวหน้าประตูนั้นเจ็ดคน {name}เป็นคนที่แปด คนหน้าแถวบอกว่าห้องกลั่นหาคนล้างโหลกับแบกลังตอนกลางคืน งานเย็นถึงเที่ยงคืนกับวันว่างทั้งวัน เดือนละสองเหรียญ จ่ายดีกว่าโรงกลั่นริมแม่น้ำ เพราะกลิ่นแรงกว่า

    เบรนิก หัวหน้าห้องกลั่น ชายร่างเตี้ยที่ไม่มีคิ้วสักเส้น เดินจากหัวแถวลงมาทีละคน จับมือทุกคนพลิกดู มือที่มีแผลเปิดเขาส่งกลับบ้าน บอกว่าน้ำค้างดาวเข้าแผลแล้วผิวจะไม่เหมือนเดิม มาถึงมือของ{name} เขาพลิกดูทั้งสองข้าง แล้วชี้ลังไม้ที่วางอยู่ข้างประตู ลังใส่โหลแก้วปิดฝาสิบสองใบ ต้องแบกขึ้นบันไดหินสามชั้นโดยไม่ให้โหลกระทบกัน

    ข้างประตูมีป้ายไม้แขวนอยู่แผ่นหนึ่ง เขียนว่า ห้ามเปิดฝา
  choices:
    - id: carry_it
      label: ยกลังขึ้นบ่า แบกขึ้นบันไดสามชั้น
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ลังหนักกว่าที่ตาเห็น โหลแต่ละใบเย็นจนไอเย็นซึมผ่านไม้ลังขึ้นมาถึงบ่า {name}ขึ้นบันไดทีละขั้น ไม่เร็ว ไม่หยุด ถึงชั้นสามโหลทั้งสิบสองใบยังไม่มีเสียงกระทบกันสักครั้ง

          เบรนิกนับโหลในลังเอง แล้วโยนผ้ากันเปื้อนหนังให้หนึ่งผืน กับถุงมือคู่หนึ่ง บอกว่าเริ่มคืนนี้เลย ส่วนอีกหกคนในแถวที่ยังรออยู่ เขาบอกให้กลับไปก่อน
        effects: { stats: { CON: 1 }, gold: 2, flags: [institute_staff, works_at_institute_stillroom] }
      failure:
        text: |
          ถึงชานพักชั้นสอง ขาข้างหนึ่งพลาดขั้น ลังเอียง โหลสองใบกระทบกันดังกริ๊ง {name}เอาตัวรับลังไว้ได้ทัน แต่ขอบลังกระแทกซี่โครงจนหายใจไม่ออกไปครู่หนึ่ง

          เบรนิกเดินขึ้นมาดูโหลทั้งสิบสองใบ ใบที่กระทบกันไม่ร้าว เขาบอกว่ารับไว้ก็ได้ คนที่เอาตัวรับลังแทนโหล ดีกว่าคนที่วางลังลงแล้วยืนดู ซี่โครงข้างนั้นเขียวอยู่สองสัปดาห์ ค่าแรงเดือนแรกเขาจ่ายครึ่งเดียว
        effects: { hp: -2, gold: 1, flags: [institute_staff, works_at_institute_stillroom] }
    - id: refinery_hands
      label: หงายมือให้เขาดูด้านในที่ด้านแข็งเพราะงานโรงกลั่น
      requires: { flag: job_refinery_hand }
      text: |
        เบรนิกเอานิ้วโป้งกดรอยด้านบนฝ่ามือของ{name}สองที่ ที่ที่จับด้ามวาล์ว กับที่ที่จับขอบหม้อ แล้วถามว่าโรงไหน {name}บอก เขาบอกว่าโรงนั้นหม้อรั่วตรงข้อต่อที่สามมาตั้งแต่เขายังเด็ก

        ไม่ต้องแบกลัง เขาให้ผ้ากันเปื้อนหนังกับถุงมือ แล้วให้ยืนคุมคนใหม่ที่เพิ่งรับเข้ามาด้วยในคืนแรก เดือนละสองเหรียญ ค่ำวันนั้น{name}ทำงานโรงกลั่นริมแม่น้ำเสร็จตอนตะวันตกดิน แล้วเดินข้ามเมืองมาล้างโหลต่อจนเที่ยงคืน
      effects: { gold: 2, flags: [institute_staff, works_at_institute_stillroom] }
    - id: walk_off
      label: ออกจากแถว กลับบ้าน
      text: |
        คนที่ยืนหลัง{name}ขยับขึ้นมาแทนที่ทันที ยื่นมือให้เบรนิกพลิกดู {name}เดินออกจากตรอกไปทางถนนใหญ่ กลิ่นในห้องกลั่นติดเสื้อมาด้วยถึงบ้าน กลิ่นสนิมกับดอกไม้ที่เน่าในน้ำ

        ผ่านไปหลายเดือน ทุกครั้งที่ลมพัดมาจากทางตึกตะวันตก{name}ยังได้กลิ่นนั้น
      effects: { flags: [turned_down_the_stillroom] }

- id: adult.staff_gate_hired
  stage: adult
  scene: institute
  weight: 12
  when:
    age: [19, 45]
    city: ventras
    not_flags: [institute_student, institute_graduate, institute_left, institute_staff, job_researcher]
  text: |
    ทอร์วัล หัวหน้ายามประตูตะวันตกของสถาบัน ยืนอยู่ใต้ซุ้มประตูตอนที่{name}เดินผ่าน เขาเรียกไว้ด้วยการยื่นไม้กระบองออกมากั้นทาง ไม่แรง ไม่ได้จะตี แค่ให้หยุด เขาจำหน้าได้ เพราะ{name}เดินผ่านประตูนี้ทุกวันในเวลาเดียวกัน

    เขาหาคนเฝ้าประตูคืนวันว่างกับคืนเดือนมืด คืนเดือนมืดไม่มีใครอยากเฝ้า ถนนหน้าประตูมืดกว่าคืนอื่น และยามประจำก็มีบ้านมีลูกต้องกลับไปนอนด้วย งานคือยืนให้ครบคืน ดูบัตรทองเหลืองของคนที่เข้าออก จดชื่อลงสมุดประตู ค่าแรงเดือนละเหรียญ

    ประตูบานใหญ่ของสถาบันลงกลอนด้วยไม้ซุงทั้งท่อน ทอร์วัลบอกว่าคนเฝ้าคืนต้องยกกลอนนั้นเองได้คนเดียว
  choices:
    - id: lift_the_bar
      label: ยกกลอนซุงขึ้นให้เขาดู
      check: { stat: STR, dc: 13 }
      success:
        text: |
          กลอนซุงหนักเท่าคนสองคน {name}สอดบ่าเข้าใต้ซุง ยกปลายข้างหนึ่งขึ้นพ้นตะขอเหล็ก แล้วเลื่อนออกจนประตูบานเล็กเปิดได้ ทอร์วัลเอาไม้กระบองเคาะซุงสองที เสียงทึบ ไม่มีเสียงสั่น

          เขาให้เดือนละสองเหรียญแทนเหรียญเดียว บอกว่ายามที่ยกกลอนเองได้ไม่ต้องปลุกเขาลงมาช่วยตอนตีสาม แล้วยื่นสมุดประตูให้ เล่มหนา ปกเป็นหนังวัวแข็ง หน้าแรกมีชื่อยามรุ่นก่อนเรียงลงมายาวเกินครึ่งหน้า
        effects: { stats: { STR: 1 }, gold: 2, flags: [institute_staff, works_at_institute_gate] }
      failure:
        text: |
          ซุงขยับขึ้นได้แค่คืบเดียว แล้วหล่นกลับลงตะขอ ปลายนิ้วของ{name}อยู่ใต้ซุงพอดี เล็บนิ้วกลางดำในคืนนั้น หลุดออกในสัปดาห์ต่อมา

          ทอร์วัลรับไว้ด้วยค่าแรงเหรียญเดียว บอกว่าคืนไหนต้องยกกลอน ให้ลากโซ่ระฆังเรียกเขาลงมา ระฆังใบนั้นแขวนอยู่ข้างประตู สนิมเขียวเกาะจนเสียงคงไม่ดังถึงชั้นบน
        effects: { hp: -1, gold: 1, flags: [institute_staff, works_at_institute_gate] }
    - id: own_blade
      label: บอกเขาว่าเคยยืนยามมาแล้ว ในงานที่ได้ค่าจ้างดีกว่านี้
      requires: { flag: job_mercenary }
      text: |
        ทอร์วัลถามว่ายามที่ไหน {name}บอก เขาถามต่อว่ายืนกี่คืนติดกันโดยไม่หลับ {name}บอกตัวเลขที่จริง เขาไม่ถามข้อที่สาม ยื่นสมุดประตูให้เลย

        ค่าแรงสองเหรียญ เขาบอกว่าสถาบันไม่ให้ยามพกดาบเข้าเขตกำแพง ให้ถือแค่กระบองกับตะเกียง ดาบของ{name}ต้องฝากไว้ที่ห้องเก็บของข้างซุ้มประตู ห้องนั้นมีดาบของยามคนอื่นฝากไว้แล้วสามเล่ม เล่มหนึ่งฝุ่นจับหนาจนเจ้าของคงไม่ได้กลับมาเอา
      effects: { gold: 2, flags: [institute_staff, works_at_institute_gate] }
    - id: take_the_book
      label: รับสมุดประตูไว้ เฝ้าคืนวันว่างกับคืนเดือนมืด
      text: |
        คืนแรก{name}ยืนอยู่ใต้ซุ้มประตูจนตีสี่ คนเข้าออกทั้งคืนมีสิบเอ็ดคน นักเรียนปีหกสามคนที่กลับดึกจากร้านเหล้า อาจารย์คนหนึ่งที่ลืมแว่นไว้ในห้อง คนส่งนมสองคน แม่ครัวที่มาก่อนไก่ขัน{name}จดชื่อทุกคนลงสมุด

        ตอนส่งเวร ทอร์วัลเปิดสมุดดูหน้าคืนนั้น นับชื่อ แล้วบอกว่าจดครบดี คืนเดือนมืดครั้งหน้า ถ้าไม่ครบก็ไม่เป็นไร
      effects: { gold: 1, flags: [institute_staff, works_at_institute_gate] }
    - id: step_round
      label: ก้าวอ้อมไม้กระบอง บอกเขาว่าไม่ว่าง
      text: |
        ทอร์วัลลดไม้กระบองลง ไม่ได้ถามว่าไม่ว่างวันไหน เขาหันไปยื่นไม้กระบองกั้นทางคนถัดไปที่เดินมา ชายแบกกระสอบแป้ง

        เดือนต่อมา{name}เดินผ่านประตูตะวันตกเวลาเดิม ชายแบกกระสอบแป้งคนนั้นยืนอยู่ใต้ซุ้มประตู ถือไม้กระบองไม่ค่อยถนัดมือ
      effects: { flags: [turned_down_the_gate] }

- id: adult.staff_runner_hired
  stage: adult
  scene: institute
  weight: 12
  when:
    age: [19, 45]
    city: ventras
    not_flags: [institute_student, institute_graduate, institute_left, institute_staff, job_researcher]
  text: |
    เด็กส่งถาดของครัวสถาบันโตจนขาสั้นกว่ากางเกงแล้ว เลยไปทำงานโรงกลั่นที่จ่ายดีกว่า แม่ครัวกอร์ลาต้องหาคนใหม่ภายในสามวัน ก่อนอาจารย์ที่ไม่ลงมากินข้าวในโรงอาหารจะอดตายกันหมดทั้งตึก นางบอกเรื่องนี้กับทุกคนที่มาส่งของหลังครัว คนขายผัก คนส่งถ่าน และ{name}

    งานคือยกถาดจากครัวขึ้นไปส่งตามตึก เย็นถึงค่ำกับวันว่างทั้งวัน ตึกกลาง ตึกตะวันตก หอบนโดม ปีกของสำนักรักษา บันไดรวมกันแล้วนางไม่เคยนับ นับแต่ชามที่กลับมาแตก ค่าแรงเดือนละเหรียญ หักชามละหนึ่งทองแดง

    กอร์ลายกถาดซุปร้อนวางลงบนมือ{name}โดยไม่รอคำตอบ ชามสี่ใบ น้ำซุปเต็มถึงขอบ บอกว่าตึกตะวันตกชั้นสี่ ห้องสุดทางเดิน
  choices:
    - id: up_the_stairs
      label: ยกถาดขึ้นบันไดสี่ชั้นโดยไม่ให้ซุปหก
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ขึ้นบันไดแบบที่คนส่งถาดในร้านเหล้าขึ้น ไหล่นิ่ง เข่างอรับทุกขั้น ซุปในชามกระเพื่อมแต่ไม่ข้ามขอบ ห้องสุดทางเดินชั้นสี่มีนักวิจัยสี่คนนั่งก้มหน้าอยู่กับกระดาษ ไม่มีใครเงยหน้าตอนวางถาด

          ชามสี่ใบกลับลงมาถึงครัวตอนค่ำ ว่างทุกใบ ไม่แตกสักใบ กอร์ลาขีดชอล์กบนกระดานข้างประตูครัวเป็นชื่อแรกในแถวใหม่ แล้วให้ค่าแรงสองเหรียญ เพราะคนก่อนเดือนหนึ่งทำชามแตกเฉลี่ยสิบสองใบ
        effects: { stats: { DEX: 1 }, gold: 2, flags: [institute_staff, works_at_institute_runner] }
      failure:
        text: |
          ชานพักชั้นสาม นักเรียนขอบเทาสองคนวิ่งสวนลงมา ถาดเอียง ซุปร้อนหกข้ามขอบชามลงหลังมือ{name}จนแดงเป็นปื้น ชามไม่แตก แต่ซุปเหลือในชามครึ่งเดียว

          นักวิจัยห้องสุดทางเดินกินซุปครึ่งชามโดยไม่มีใครบ่น กอร์ลาทาน้ำมันหมูที่หลังมือให้ แล้วรับ{name}ไว้ บอกว่าคนที่เจ็บแล้วชามไม่แตก นางรับได้ ค่าแรงเหรียญเดียว หักค่าซุปที่หกไปครึ่งเหรียญ
        effects: { hp: -1, gold: 1, flags: [institute_staff, works_at_institute_runner] }
    - id: brass_badge
      label: ชูป้ายทองเหลืองของคนเดินข่าวให้นางดู บอกว่าวิ่งขึ้นลงบันไดทั้งเมืองอยู่แล้ว
      requires: { flag: job_news_walker }
      text: |
        กอร์ลาดูป้ายทองเหลืองที่สำนักตรวจหนังสือออกให้ แล้วบอกว่าคนเดินข่าวรู้ทุกบันไดในเมือง แต่ในกำแพงนี้ ข่าวที่ได้ยินระหว่างบันไดไม่ใช่ของ{name} ใครขายข่าวจากถาดของนาง นางจะรู้ เพราะนางรู้ว่าถาดไหนขึ้นไปห้องไหน

        นางรับไว้ เดือนละสองเหรียญ ค่ำวันนั้น{name}เดินข่าวในย่านท่าเรือเหาะจนตะวันตกดิน แล้วข้ามเมืองมายกถาดจนถึงสองทุ่ม ป้ายทองเหลืองถอดเก็บไว้ในกระเป๋าตลอดเวลาที่อยู่ในกำแพง
      effects: { gold: 2, flags: [institute_staff, works_at_institute_runner] }
    - id: hand_it_back
      label: วางถาดคืนบนโต๊ะครัว
      text: |
        กอร์ลาไม่ได้โกรธ นางหันไปวางถาดบนมือคนส่งถ่านแทน คนส่งถ่านมือดำทั้งสองข้าง ถือถาดไว้ไกลตัวเหมือนถือของที่ไม่ใช่ของตัวเอง แล้วเดินขึ้นบันไดไป

        ตอน{name}ออกจากหลังครัว ได้ยินเสียงชามแตกดังมาจากทางตึกตะวันตก ไกลๆ หนึ่งใบ กอร์ลาไม่ได้เงยหน้าจากเขียง
      effects: { flags: [turned_down_the_trays] }

# ---------- สิ่งที่เห็นจากข้างล่าง ----------

- id: adult.staff_library_key
  stage: adult
  scene: library
  weight: 30
  when:
    age: [21, 60]
    city: ventras
    flags: [works_at_institute_library]
  text: |
    ทุกต้นฤดู ชายเสื้อคลุมสีกรมท่าของราชสำนักมาที่ห้องสมุดตอนค่ำ เมลิสยื่นสมุดที่ห้อยโซ่ไว้ข้างชั้นตาข่ายให้เขาลงชื่อ เขาลงชื่อ วางถุงเงินบนโต๊ะเสมียน แล้วคาสเซน ดูเวล อาจารย์ที่ปรึกษาของสำนักตำรา เดินมาไขกุญแจ ทั้งสองคนอยู่ข้างในจนตะเกียงหมดไปหนึ่งดวง คนที่เก็บหีบกลับขึ้นชั้นหลังจากนั้นคือ{name}

    หีบม้วนกระดาษบนชั้นนั้นเป็นไม้ดำ ป้ายทองเหลืองทุกใบเขียนคำเดียวกันก่อนเลขปี สายเลือดของราชวงศ์ เลขปีเรียงกันไปทีละปี ปีละหนึ่งหีบ ย้อนไปจนถึงปีที่ราชวงศ์อ้างว่าผู้กล้าคนหนึ่งในหกคนตั้งบัลลังก์ คืนนี้{name}เก็บหีบกลับทีละใบจนถึงกลางชั้น แล้วมือก็หยุด เลขบนป้ายใบหนึ่งกับใบถัดไปห่างกันสี่สิบปี ตรงกลางไม่มีหีบ ไม่มีช่องว่างบนชั้นให้หีบที่หายไปด้วย ไม้ชั้นเรียบเหมือนไม่เคยมีอะไรวางตรงนั้นมาก่อน

    ชายของราชสำนักยังยืนอยู่ที่โต๊ะเสมียน นับเงินทอนกับเมลิส เขาเงยหน้ามาทางชั้นตาข่ายครั้งหนึ่ง ตอนที่มือของ{name}ยังค้างอยู่ระหว่างสองหีบ
  choices:
    - id: shelve_and_go
      label: เก็บหีบใบสุดท้ายขึ้นชั้น ปิดตาข่าย แล้วกลับบ้านตามเวลา
      text: |
        {name}เก็บจนครบ ปิดประตูตาข่าย ส่งกุญแจคืนให้คาสเซน ดูเวล เขารับไว้โดยไม่มองหน้า ตอนเดินผ่านโต๊ะเสมียน ชายของราชสำนักยื่นเหรียญเงินให้หนึ่งเหรียญ บอกว่าค่าเก็บของให้เรียบร้อย

        เมลิสรอจนเขาออกไปแล้วถึงพูด นางบอกว่าคนเก็บชั้นนี้ก่อนหน้า{name}ได้เหรียญแบบเดียวกันทุกฤดูมาสิบเอ็ดปี ไม่เคยเปิดปากสักคำ ปีที่สิบสองเขาเปิด แล้วก็ไม่ได้มาอีก
      effects: { gold: 1, reputation: { crown: 1 }, flags: [staff_kept_library_quiet] }
    - id: count_the_gap
      label: อ่านเลขปีบนป้ายสองใบนั้นให้แน่นอน ก่อนจะวางมือ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ขีดตั้งกับขีดนอนบนป้ายทองเหลืองสองใบ{name}นับทีละกอง ใบซ้ายกับใบขวาห่างกันสี่สิบปี {name}นับซ้ำอีกรอบจากกองแรก ได้สี่สิบเท่าเดิม ชั้นไม้ระหว่างสองใบนั้นไม่มีรอยฝุ่นเป็นรูปก้นหีบสักรอย

          {name}วางหีบลง ปิดตาข่าย แล้วเขียนเลขสองตัวนั้นไว้ในที่เดียวที่ไม่มีใครเปิดดู ใต้ฝ่ามือซ้ายด้วยหมึกที่ล้างออกง่าย ล้างออกก่อนถึงบ้าน แต่จำได้ทั้งสองตัว ไม่ได้เล่าให้ใครฟัง
        effects: { stats: { INT: 1 }, flags: [staff_kept_library_quiet, counted_the_missing_years] }
      failure:
        text: |
          ป้ายทองเหลืองอยู่ในเงาของตะเกียงพอดี {name}ยกหีบขึ้นหาแสง หีบไม้ดำหนักกว่าที่คิด ขอบหีบกระแทกตาข่ายเหล็กดังไปทั้งห้อง ชายของราชสำนักหันมา เมลิสหันมา คาสเซน ดูเวลเดินมาถึงก่อนเสียงจะเงียบ

          เขารับหีบไปจากมือ{name} วางขึ้นชั้นเอง ปิดตาข่ายเอง สัปดาห์ต่อมาค่าแรงเดือนนั้นมาไม่ครบ เมลิสบอกว่าหักค่าซ่อมตาข่าย ตาข่ายเหล็กตรงนั้นไม่มีรอยอะไรเลย
        effects: { gold: -2, flags: [staff_kept_library_quiet, dropped_a_crown_case] }
    - id: news_walker
      label: เล่าให้คนเดินข่าวที่ร้านน้ำชาชั้นบนฟัง
      text: |
        คนเดินข่าวคนนั้นกลัดป้ายทองเหลืองไว้ที่อกเสื้อ จดเลขสองตัวที่{name}บอกลงสมุดเล่มเล็กด้วยดินสอ แล้วถามว่าใครเป็นคนลงชื่อรับกุญแจ {name}บอกสีเสื้อคลุม เขาจ่ายค่าน้ำชาให้ แล้วรีบลงบันไดไป

        ข่าวนั้นไม่ได้ออกในใบข่าวฉบับไหนเลย สองเดือนต่อมาป้ายทองเหลืองของคนเดินข่าวคนนั้นไปแขวนอยู่บนตะปูหน้าสำนักตรวจหนังสือ กับป้ายอื่นอีกหลายแผ่นที่ไม่มีเจ้าของมารับคืน
      effects: { reputation: { crown: -1 }, flags: [staff_spoke_about_library] }
    - id: veras_temple
      label: ไปเล่าให้นักบวชเวรัสบนเนินวิหารฟัง
      text: |
        นักบวชหนุ่มที่รับฟังไม่จดอะไร เขาฟังจนจบ ถามซ้ำแค่เลขสองตัวนั้น แล้วพา{name}ไปพบนักบวชที่แก่กว่า คนที่แก่กว่าถามเลขสองตัวเดิมอีกครั้ง แล้วขอบคุณด้วยเสียงที่อบอุ่นกว่าที่{name}คิด

        ต้นฤดูต่อมา ชายของราชสำนักมาลงชื่อรับกุญแจเหมือนเดิม แต่คราวนี้มากันสองคน คนที่สองยืนอยู่ข้างชั้นตาข่ายตลอดเวลาที่{name}เก็บหีบ แล้วนับหีบตามหลังทีละใบ
      effects: { reputation: { lamp_church: 1, crown: -1 }, flags: [staff_spoke_about_library] }

- id: adult.staff_stillroom_back_door
  stage: adult
  scene: laboratory
  weight: 30
  when:
    age: [21, 60]
    city: ventras
    flags: [works_at_institute_stillroom]
  text: |
    ผังของห้องกลั่นแปะอยู่บนผนังข้างอ่างล้างโหล ห้องกลั่นใหญ่ ห้องเก็บถ่าน ห้องล้าง ประตูหลัง แล้วลานหิน แล้วกำแพง หลังกำแพงไม่มีอะไร {name}ล้างโหลอยู่หน้าผังนั้นมาหลายเดือน จนจำได้ทุกเส้น

    คืนนี้เบรนิกให้แบกลังออกทางประตูหลัง โหลปิดฝาครั่งสิบสองใบ เดินข้ามลานหินไปจนสุด ที่โคนกำแพงมีบันไดหินลงไปใต้ดินเจ็ดขั้น ปลายบันไดเป็นประตูไม้ที่ไม่มีบนผัง ข้างในเป็นห้องยาว ชั้นไม้เรียงจากพื้นถึงเพดาน โหลปิดฝาครั่งเต็มทุกชั้น ไม่มีโหลเปล่า ไม่มีอ่างเททิ้ง ซาเบล เทอร์ริค ใส่ถุงมือยืนจดเลขโหลอยู่ปลายห้อง

    {name}วางลังลง โหลใบบนสุดกระทบไม้ลังเบาๆ หนึ่งที แล้วจากข้างในโหล มีเสียงเคาะตอบกลับมาหนึ่งที เบากว่า ช้ากว่า ตอนเดินกลับขึ้นบันได มีชายเสื้อดีคนหนึ่งยืนรออยู่ข้างประตูหลัง ผมมีกลิ่นควันหม้อกลั่น เขายื่นถุงเงินให้เบรนิก แล้วยื่นเหรียญเงินให้{name}หนึ่งเหรียญ บอกว่าค่าเดินเงียบ
  choices:
    - id: take_the_coin
      label: รับเหรียญ กลับไปล้างโหลหน้าผังต่อ
      text: |
        เหรียญเงินอุ่นจากมือเขา {name}เก็บใส่กระเป๋าผ้ากันเปื้อน กลับไปยืนหน้าอ่างล้างโหล ผังบนผนังยังเหมือนเดิม ลานหิน แล้วกำแพง แล้วไม่มีอะไร

        ตั้งแต่นั้นมา ทุกครั้งที่มีลังต้องลงบันไดเจ็ดขั้น เบรนิกเรียก{name}เป็นคนแรก และทุกครั้งชายเสื้อดีคนนั้นรออยู่ข้างประตูหลังด้วยเหรียญเงินหนึ่งเหรียญ {name}เลิกนับว่าได้มากี่เหรียญแล้ว
      effects: { gold: 2, reputation: { distillers: 1 }, flags: [staff_kept_stillroom_quiet] }
    - id: tap_back
      label: ลงบันไดไปอีกรอบตอนห้องว่าง เคาะโหลใบนั้นอีกครั้ง
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ตอนตีสาม ห้องยาวไม่มีใคร {name}หาโหลใบนั้นเจอจากรอยนิ้วบนฝาครั่ง เคาะเบาๆ สองที แล้วรอ เสียงตอบมาสองที เบากว่า ช้ากว่า {name}เคาะสาม เสียงตอบสาม เคาะสี่ ข้างในเงียบไปนานจน{name}หายใจออกได้ แล้วเสียงตอบก็มาสี่ที เร็วกว่าเดิม

          {name}เดินกลับขึ้นบันไดโดยไม่ได้แตะโหลใบไหนอีก ไม่ได้เล่าให้ใครฟัง ตั้งแต่คืนนั้นเวลาวางลังลงในห้องยาว {name}วางช้ากว่าคนอื่น ไม่ให้ไม้ลังกระทบอะไรเลย
        effects: { stats: { WIS: 1 }, flags: [staff_kept_stillroom_quiet, answered_a_jar] }
      failure:
        text: |
          ห้องยาวตอนตีสามเย็นกว่าตอนหัวค่ำ {name}หาโหลใบนั้นอยู่นานจนนิ้วชา เคาะผิดใบไปสามใบ ใบที่สามมีเสียงตอบ แต่ไม่ใช่เสียงเคาะ เป็นเสียงเหมือนเล็บขูดแก้วจากข้างใน ยาว ไม่หยุด

          {name}ถอยหลังชนชั้นไม้ ไหล่ไปโดนขอบชั้นจนเป็นแผล เดินขึ้นบันไดโดยไม่หันกลับไปดู เช้ามาเบรนิกเห็นผ้าพันไหล่ ไม่ถามว่าเป็นอะไร บอกแค่ว่าคนที่ลงไปข้างล่างคนเดียวตอนห้องว่าง ไม่ใช่คนแรก
        effects: { hp: -2, flags: [staff_kept_stillroom_quiet] }
    - id: tell_the_lamp
      label: ไปเล่าเรื่องเสียงในโหลให้นักบวชเวรัสฟัง
      text: |
        นักบวชเวรัสที่ฟังเป็นหญิงวัยกลางคน นิ้วดำด้วยเขม่าตะเกียง นางฟังเรื่องเสียงเคาะตอบสองรอบ แล้วถามแค่ว่าห้องนั้นอยู่ตรงไหนของกำแพง {name}วาดให้บนเศษกระดาษ บันไดเจ็ดขั้น ประตูไม้ ห้องยาว

        นางเก็บกระดาษใส่แขนเสื้อ ขอบคุณ อวยพรให้ด้วยเปลวตะเกียงใกล้หน้าผาก ร้อนจนขนคิ้วไหม้ไปเส้นหนึ่ง เดือนต่อมาชายเสื้อดีคนนั้นไม่ยื่นเหรียญเงินให้{name}อีก เบรนิกเลิกเรียก{name}เป็นคนแรกเวลามีลังต้องลงไปข้างล่าง
      effects: { reputation: { lamp_church: 1, distillers: -1 }, flags: [staff_spoke_about_stillroom] }
    - id: dock_rats
      label: ขายเรื่องห้องใต้กำแพงให้คนของหนูท่าที่ร้านเหล้าริมท่าเรือ
      text: |
        คนของหนูท่าเป็นเด็กหนุ่มที่นั่งหันหลังให้ผนังเสมอ เขาฟังแค่ส่วนที่เป็นทาง ประตูหลัง ลานหิน บันไดเจ็ดขั้น ยามเปลี่ยนเวรกี่โมง เรื่องเสียงในโหลเขาตัดบทกลางคำ บอกว่าของที่มีเสียงขายยาก

        เขาวางเหรียญสองเหรียญบนโต๊ะ แล้วลุกไปโดยไม่จ่ายค่าเหล้าของตัวเอง สามเดือนต่อมาประตูหลังของห้องกลั่นมีกลอนเหล็กเพิ่มมาอีกตัว เบรนิกถามคนงานทีละคนว่าใครทำกุญแจหาย ไม่มีใครทำหาย
      effects: { gold: 2, reputation: { dock_rats: 1, distillers: -1 }, flags: [staff_spoke_about_stillroom] }

- id: adult.staff_gate_moonless
  stage: adult
  scene: institute
  weight: 30
  when:
    age: [21, 60]
    city: ventras
    flags: [works_at_institute_gate]
  text: |
    คืนเดือนมืดแรกที่{name}เฝ้าประตูตะวันตก ทอร์วัลบอกไว้ก่อนกลับบ้านแค่ประโยคเดียว คนที่มาหลังเที่ยงคืนไม่ต้องจด

    หลังเที่ยงคืนมีคนมาจริง ทีละคนสองคน ห่างกันพอให้ไม่ดูเป็นกลุ่ม เสื้อคลุมเรียบ ไม่มีตราของใคร บางคนยื่นบัตรทองเหลืองของสถาบัน บางคนไม่ยื่นอะไร แค่บอกว่าไปที่โดม หนึ่งในนั้นเป็นหญิงที่{name}เห็นบนทางเดินรอบโดมทุกเย็น วิเรีย ซอลเดน อาจารย์ที่ปรึกษาของสำนักดาราศาสตร์ อีกคนเป็นคนขายหนังสือร้านหัวมุมถนนสถาบัน อีกสองคนแต่งตัวแบบลูกขุนนางที่ไม่อยากให้ใครรู้ว่าเป็นลูกขุนนาง

    ทั้งคืนมีคนเข้าไปสิบเก้าคน ไม่มีใครออกมาจนฟ้าเริ่มสาง สมุดประตูหน้าคืนนั้นของ{name}ว่างทั้งหน้า ปากกาในมือยังเปียกหมึก
  choices:
    - id: blank_page
      label: ปล่อยหน้านั้นว่างไว้ ตามที่ทอร์วัลสั่ง
      text: |
        ทอร์วัลมาส่งเวรตอนไก่ขัน เปิดสมุดดูหน้าคืนนั้น หน้าว่าง เขาพลิกกลับไปหน้าก่อน หน้าคืนวันว่างที่{name}จดครบทุกชื่อ แล้วพลิกกลับมาหน้าว่างอีกที วางเหรียญเงินหนึ่งเหรียญไว้กลางหน้านั้น

        คืนเดือนมืดต่อๆ มา เหรียญเงินวางอยู่บนหน้าว่างทุกครั้ง ไม่มีใครบอกว่าเหรียญมาจากไหน หน้าว่างในสมุดประตูเล่มนั้น นับย้อนไปหน้าก่อนๆ ทุกเดือนมืดก็ว่างเหมือนกันหมด ลายมือยามรุ่นก่อนเว้นไว้เหมือน{name}ทุกคน
      effects: { gold: 2, reputation: { royal_institute: 1 }, flags: [staff_kept_gate_quiet] }
    - id: up_to_the_dome
      label: ลงกลอนประตูแล้วเดินตามขึ้นบันไดโดมไปเงียบๆ
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          บันไดวนขึ้นโดมเป็นหิน ไม่มีเสียงเอี๊ยด {name}ขึ้นไปถึงประตูห้องใต้โดม บานประตูแง้มไว้เท่าความกว้างของมือ ข้างในไม่มีตะเกียง แสงมาจากช่องโดมที่เปิดรับฟ้า ฟ้าคืนเดือนมืดเต็มไปทั้งช่อง คนสิบเก้าคนนั่งเป็นวงบนพื้น หลับตา เงยหน้าขึ้น ไม่มีใครพูด ไม่มีใครขยับ บางคนเอียงหัว แบบคนที่พยายามฟังเสียงจากห้องข้างๆ

          {name}ลงบันไดกลับมาก่อนใครจะลืมตา เปิดกลอนประตู แล้วยืนเฝ้าต่อจนสาง สมุดประตูหน้านั้นว่างทั้งหน้า ไม่มีอะไรเขียนเพิ่ม
        effects: { stats: { DEX: 1 }, flags: [staff_kept_gate_quiet, saw_the_circle_under_the_dome] }
      failure:
        text: |
          บันไดขั้นที่สิบมีถังน้ำวางอยู่ {name}เตะโดน เสียงถังกลิ้งลงบันไดวนดังไปทั้งโดม ข้างบนเงียบลงทันที แบบที่ห้องเงียบลงตอนคนในห้องหยุดหายใจพร้อมกัน

          คนที่เดินลงมาดูคือวิเรีย ซอลเดน เธอยืนอยู่บนขั้นที่สูงกว่า ถามแค่ว่า{name}เป็นยามคืนนี้ใช่ไหม แล้วบอกให้กลับไปที่ประตู เช้ามาทอร์วัลหักค่าแรงเดือนนั้นไปหนึ่งเหรียญ บอกว่ายามที่ทิ้งประตู ไม่ว่าไปไหน หักเท่ากันหมด
        effects: { gold: -1, flags: [staff_kept_gate_quiet] }
    - id: write_and_tell
      label: เขียนชื่อทุกคนที่จำได้ลงกระดาษแยก ส่งไปให้นักบวชเวรัสบนเนินวิหาร
      text: |
        {name}เขียนได้หกชื่อ อีกสิบสามคนบอกได้แค่รูปร่าง นักบวชเวรัสที่รับกระดาษไปอ่านชื่อวิเรีย ซอลเดน ซ้ำสองครั้ง แล้วพับเก็บ ถามว่าคืนเดือนมืดถัดไปตรงกับวันไหน {name}บอก

        คืนเดือนมืดถัดไป มีคนในเสื้อคลุมสีเทาของวิหารยืนอยู่ที่หัวมุมถนนตรงข้ามประตูตะวันตกตลอดคืน คนที่มาที่โดมคืนนั้นมีห้าคน ทอร์วัลมาส่งเวรตอนไก่ขัน มองหน้าว่างในสมุด แล้วมองหน้า{name}
      effects: { reputation: { lamp_church: 1, royal_institute: -1 }, flags: [staff_spoke_about_gate] }
    - id: clan_ears
      label: เล่าให้ช่างคนแคระที่ร้านเหล้าข้างโรงประกอบฟัง
      text: |
        ช่างคนแคระฟังจบแล้วหัวเราะใส่แก้วเบียร์ บอกว่ามนุษย์ขึ้นไปนั่งฟังฟ้าในห้องมืด คนแคระลงไปนั่งฟังหินในห้องมืดมาตั้งแต่ก่อนมีมนุษย์ ฟังอะไรก็แล้วแต่ แต่ถ้าฟังได้ยินอะไรตอบมา ให้รีบปิดห้อง

        เขาเล่าต่อให้คนในร้านฟังอีกสามคน แล้วคนในร้านเล่าต่อไปอีก ปลายเดือนเรื่องคนนั่งเป็นวงในโดมกลายเป็นเรื่องตลกในโรงประกอบทุกโรงแถวนั้น เรื่องตลกที่เล่าจบแล้วไม่มีใครหัวเราะนาน
      effects: { reputation: { dwarf_council: 1, royal_institute: -1 }, flags: [staff_spoke_about_gate] }

- id: adult.staff_runner_no_number
  stage: adult
  scene: healer
  weight: 30
  when:
    age: [21, 60]
    city: ventras
    flags: [works_at_institute_runner]
  text: |
    ถาดใบสุดท้ายของทุกเย็นเป็นถาดที่กอร์ลาจัดเอง ข้าวต้มเหลวจนไหลได้ น้ำผึ้งหนึ่งถ้วย หลอดไม้อ้อหกหลอด ไม่มีเลขห้องติดถาดเหมือนถาดอื่น นางบอกแค่ว่าปีกสำนักรักษา ชั้นบนสุด ห้องที่ไม่มีเลข ส่งที่ประตู ไม่ต้องเคาะ

    ทุกเย็นโรเซล ทาวิค อาจารย์ที่ปรึกษาของสำนักรักษา ยืนรอรับถาดที่ประตูนั้นเอง มือของเธอเปียกน้ำเสมอ ถูขึ้นไปถึงศอก เย็นนี้เธอไม่อยู่ ประตูแง้มไว้เท่าความกว้างของถาด

    ข้างในมีเตียงหกเตียง คนบนเตียงทั้งหกนอนนิ่ง ผิวที่หลังมือ ที่แก้ม ที่ลำคอ ใสเป็นแผ่นเหมือนกระจกฝ้า ข้างใต้มีแสงสีฟ้าเต้นช้าๆ ตามจังหวะหายใจ เตียงริมหน้าต่างมีกระดานชนวนแขวนที่ปลายเตียง ขีดชอล์กเป็นกลุ่ม กลุ่มละห้าขีด ขีดจนเต็มกระดานแล้วต่อด้วยกระดานแผ่นที่สอง คนบนเตียงนั้น{name}จำได้ เขาเคยขายขนมทอดอยู่หัวมุมถนนสถาบัน หลายปีก่อนคนทั้งย่านพูดกันว่าเขาตายแล้ว
  choices:
    - id: set_it_down
      label: วางถาดไว้ที่ประตู ดึงประตูให้แง้มเท่าเดิม แล้วลงบันไดไป
      text: |
        {name}วางถาดลงที่พื้นหน้าประตู จัดหลอดไม้อ้อให้ตรง ดึงประตูกลับให้แง้มเท่าความกว้างของถาด ไม่มากกว่านั้น แล้วลงบันไดไปส่งชามเปล่าของตึกอื่นต่อ

        ถาดเปล่าใบนั้นกลับลงมาถึงครัวตอนค่ำเหมือนทุกวัน หลอดไม้อ้อครบหกหลอด ทุกหลอดเปียก กอร์ลาล้างถาดใบนั้นเองทุกคืน ไม่ให้ใครแตะ คืนนั้นนางให้{name}กินข้าวต้มที่เหลือก้นหม้อ ข้าวต้มเหลวแบบเดียวกัน
      effects: { reputation: { royal_institute: 1 }, flags: [staff_kept_runner_quiet] }
    - id: tell_the_widow
      label: ไปบอกเมียของคนขายขนมทอด ว่าผัวของนางยังหายใจอยู่
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          นางยังขายขนมทอดที่หัวมุมเดิม กระทะใบเดิม {name}รอจนลูกค้าคนสุดท้ายไป แล้วเล่าเท่าที่เห็น เตียงริมหน้าต่าง กระดานชนวนสองแผ่น แสงสีฟ้าใต้ผิว นางฟังจนจบ มือยังพลิกขนมในกระทะไม่หยุด แล้วถามคำเดียว ว่าเขาหายใจเองหรือมีคนช่วย

          เช้าวันต่อมา นางขึ้นไปยืนที่ประตูปีกสำนักรักษาตั้งแต่ก่อนไก่ขัน ยืนจนเที่ยง ไม่มีใครให้เข้า ตอนบ่ายมีแม่ชีอีเซลสองคนจากวิหารริมแม่น้ำมายืนข้างนาง ยืนจนค่ำ โรเซล ทาวิค ลงมาเปิดประตูเอง
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, reputation: { royal_institute: -1 }, flags: [staff_spoke_about_runner] }
      failure:
        text: |
          นางฟังได้ครึ่งเดียวก็คว่ำกระทะลงบนเตา น้ำมันร้อนกระเด็นโดนแขน{name}เป็นจุดๆ นางบอกว่าผัวของนางตายแล้ว นางเผาเสื้อของเขาไปแล้ว และนางไม่อยากได้ยินเรื่องนี้จากคนยกถาด

          สัปดาห์ต่อมา กอร์ลาเปลี่ยนคนยกถาดใบสุดท้ายเป็นคนอื่น นางไม่บอกเหตุผลกับ{name} บอกแค่ว่าถาดนั้นหนักเกินไปสำหรับ{name}แล้ว
        effects: { hp: -1, reputation: { royal_institute: -1 }, flags: [staff_spoke_about_runner] }
    - id: isel_sisters
      label: เดินไปเล่าให้แม่ชีที่บ้านอีเซลริมแม่น้ำฟัง
      text: |
        แม่ชีที่เฝ้าห้องไข้ของบ้านอีเซลฟังเรื่องแสงสีฟ้าใต้ผิว แล้วไปตามแม่ชีที่แก่ที่สุดในบ้านมา คนแก่ถามแค่ว่าใครยืนรับถาดที่ประตู {name}บอกชื่อโรเซล ทาวิค แม่ชีแก่หลับตาไปครู่หนึ่ง แล้วบอกว่าเคยเป็นแม่ชีของบ้านนี้ ชามไฟของเธอยังตั้งอยู่ในห้องสวดแถวที่สาม ไม่มีใครเติมน้ำมันให้มาหลายปีแล้ว

        นางขอบใจ{name} แล้วให้ขนมปังกลับไปสองก้อน ข้างหลังที่{name}ออกมา ประตูห้องสวดปิดลง ได้ยินเสียงแม่ชีหลายคนพูดพร้อมกันเบาๆ ข้างใน
      effects: { alignment: { moral: 1 }, reputation: { royal_institute: -1 }, flags: [staff_spoke_about_runner] }
