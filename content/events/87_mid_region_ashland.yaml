# ชุด 4 วัยกลางคนตามถิ่น: แดนเถ้า (ข้อห้ามของกลางคืน ไม่ชี้ดาว ไม่นับดาวออกเสียง ไม่เงยหน้าในคืนเดือนดับ)
# สี่เรื่อง: #1 กลางคืนกับปากท้อง · #2 คนอื่นพาเด็กไปนับดาว · #3 ขอขมากลางคืน · #4 ธรรมเนียมไม้เวรกับแผ่นสันหลังคา
# คนแดนเถ้ารู้แค่ว่าคืนเดือนดับมีบางอย่างใหญ่มากผ่านเหนือหัว และต้องก้มหน้า ไม่มีใครในเรื่องเหล่านี้เรียกชื่อมัน (ของชุด C)
# คนใหม่: ซากรอธ (ashland_neighbour) ทีฟลิ่งบ้านถัดไป · ในข้อความเท่านั้น: ครูอิสเบล ตาเมอร์ทัน ลุงกาเวน

- id: adult.region_ashland_the_counters_lamps
  stage: adult
  scene: road
  time: dusk
  weight: 22
  when:
    age: [41, 56]
    location_tag: ashland
  text: |
    ตะเกียงของหอดูดาวในเวนทราสไม่เหมือนตะเกียงที่ไหน ไส้เล็กเท่าก้านหญ้า โป๊ะเป็นแก้วสีแดงเข้ม มีฝาทองเหลืองครอบไว้ทุกด้านยกเว้นด้านล่าง แสงตกลงได้แค่หน้ากระดานตรงใต้ตะเกียงพอดี คนนับบอกว่าแสงแดงไม่แย่งตา คนที่มองฟ้าทั้งคืนจะได้ไม่ต้องรอตาชินมืดใหม่ทุกครั้งที่ก้มลงจด

    คนนับสองคนนั้นมาจากเวนทราสกับเกวียนเสบียงของป้อม ขนกล่องไม้ยาวสามกล่องกับขาตั้งทองเหลืองขึ้นไปตั้งกระโจมบนเนินเถ้าท้ายหมู่บ้าน หอดูดาวอยากรู้ว่าฟ้าทางตะวันออกนับได้เท่าฟ้าเหนือเมืองหลวงหรือไม่ และไม่มีที่ไหนในทวีปที่ฟ้ามืดเท่าแดนเถ้าในคืนเดือนดับ

    เจ็ดวันแรก{name}รับจ้างพาเดินดูเนิน หาบน้ำ ปูแผ่นไม้ให้ขาตั้งไม่จมเถ้า ได้ค่าแรงล่วงหน้าไปครึ่งหนึ่ง เงินก้อนนั้นกลายเป็นแผ่นหินมุงหลังคาสี่แผ่นไปแล้ว เย็นวันที่แปด คนนับคนที่อายุมากกว่าไอเป็นเถ้าจนลุกไม่ขึ้น คนที่เหลือเรียก{name}เข้าไปในกระโจม ขอให้คืนพรุ่งนี้มาถือตะเกียงแดงแทน นั่งข้างเขา มองตามนิ้วเขาไปทีละช่องฟ้า แถวไหนเขานับไม่ทัน ให้{name}นับต่อออกเสียงแล้วขีดลงกระดาน ค่าแรงคืนเดียวเท่าค่าแรงทั้งเดือน

    คืนพรุ่งนี้คือคืนเดือนดับ คนนับรู้ดี เขาถามเรื่องข้อห้ามตั้งแต่วันแรก แล้วจดคำตอบของ{name}ลงสมุดเหมือนจดชื่อดาว
  choices:
    - id: give_back_the_advance
      label: คืนค่าแรงล่วงหน้า แล้วบอกว่าคืนพรุ่งนี้จะอยู่ในบ้าน
      text: |
        แผ่นหินสี่แผ่นพิงผนังอยู่หลังบ้าน ขายคืนไม่ได้ {name}แกะห่อเงินค่าเกลือที่เก็บไว้สำหรับหน้าฝนออกมานับให้คนนับครบทุกเหรียญ เขารับไว้โดยไม่บ่น ขีดชื่อ{name}ออกจากสมุด แล้วถามคำถามเดิมอีกครั้ง ว่าก้มหน้าทั้งคืนแล้วได้อะไร {name}ตอบได้แค่ว่าไม่ได้อะไร

        คืนเดือนดับ{name}นั่งในบ้าน ปิดบานเกล็ด ก้มหน้าอย่างที่ทั้งหมู่บ้านทำ ได้ยินเสียงคนนับดังมาจากเนินท้ายหมู่บ้าน เขานับคนเดียว เสียงเบาแต่ชัด ร้อยเอ็ด ร้อยสอง ไปเรื่อยๆ จนเลยดึก แล้วเสียงนั้นหยุดกลางแถว หยุดนานจนลมเปลี่ยนทาง ก่อนจะกลับมานับใหม่ตั้งแต่หนึ่ง ช้ากว่าเดิม

        เช้าวันต่อมาคนนับสองคนขึ้นเกวียนเสบียงกลับป้อม กระดานแผ่นหนึ่งวางทิ้งไว้บนลานกระโจม ตัวเลขแถวสุดท้ายขีดค้างไว้ครึ่งตัว
      effects: { gold: -2, taboo: { night: keep }, flags: [returned_the_counters_advance] }
    - id: hold_the_red_lamp
      label: รับงาน ถือตะเกียงแดงให้เขา แล้วนับแถวที่เขานับไม่ทัน
      text: |
        พอตะวันลับ ฟ้าเหนือแดนเถ้ามืดจนมองไม่เห็นมือตัวเอง แล้วดาวก็ขึ้นมาทีละชั้น ชั้นแล้วชั้นเล่า จนฟ้าไม่มีที่ว่างให้วางปลายนิ้ว คืนเดือนดับคนแดนเถ้าก้มหน้ากันทั้งหมู่บ้าน ฟ้าแบบนี้จึงไม่ค่อยมีใครได้เห็น คนนับชี้ช่องแรก นับเบาๆ เป็นจังหวะเหมือนคนตำข้าว {name}ขีดตามจนมือรู้จังหวะ พอถึงแถวที่ดาวถี่จนเขาตามไม่ทัน {name}ก็นับต่อเอง เสียงของตัวเองฟังแปลกหูในที่โล่งแบบนั้น

        เลยเที่ยงคืนไปไม่นาน มีลมพัดลงมาโดยไม่มีเสียง ดาวทางตะวันออกดับไปทั้งแถบ แล้วกลับมาทีละดวงจากขอบหนึ่งไปอีกขอบหนึ่ง คนนับหลุดแถว ต้องนับฟ้าตะวันออกใหม่หมด ตอนสางเขาจ่ายเงินครบตามที่บอก บอกว่าฟ้าที่นี่นับได้มากกว่าฟ้าเหนือเวนทราส มากจนหอดูดาวคงไม่อยากเชื่อ

        หลายคืนหลังจากนั้น พอ{name}หลับตา ตัวเลขก็นับต่อไปเองในหัว ร้อยเอ็ด ร้อยสอง จนกว่าจะหลับ
      effects: { gold: 4, taboo: { night: break }, flags: [counted_for_the_star_office] }
    - id: taps_on_the_wrist
      label: รับถือตะเกียงแบบก้มหน้า ให้เขาเคาะเลขลงข้อมือ แล้วขีดลงกระดานโดยไม่ออกเสียง
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          คนนับหัวเราะ แต่ยอมลอง {name}คิดวิธีให้ตั้งแต่บ่าย เคาะนิ้วเดียวคือหนึ่ง บีบข้อมือคือสิบ ตบหลังมือคือขึ้นแถวใหม่ ซ้อมกันในกระโจมจนตะวันลับ

          คืนนั้น{name}ก้มหน้าทั้งคืน โลกทั้งโลกเหลือแค่วงแสงแดงบนกระดานกับนิ้วของคนนับบนข้อมือ นิ้วเขาเร็วขึ้นเรื่อยๆ ตามแถวที่ถี่ขึ้น {name}ขีดตามจนรอยดินสอหินเต็มกระดานไปสามแผ่น เลยเที่ยงคืน นิ้วบนข้อมือหยุดนิ่งไปนาน นานจนได้ยินคนนับกลั้นหายใจ อากาศเหนือเนินเอนลงมาช้าๆ แล้วผ่านไป {name}ไม่เงยหน้า ครู่ต่อมานิ้วบนข้อมือก็เคาะต่อจากเลขเดิม

          ตอนสางคนนับจ่ายค่าแรงครึ่งเดียว เพราะนับได้ช้ากว่าที่ตั้งใจ แต่เขาเก็บกระดานสามแผ่นของ{name}ใส่กล่องไปด้วย บอกว่าไม่มีเลขไหนในนั้นที่ใครพูดออกมาสักตัว
        effects: { gold: 2, stats: { WIS: 1 }, taboo: { night: keep }, flags: [counted_by_taps_for_the_star_office] }
      failure:
        text: |
          ตอนซ้อมในกระโจมทุกอย่างง่าย พอฟ้ามืดจริง นิ้วของคนนับเร็วเกินกว่าที่ข้อมือจะแยกออก เคาะหนึ่งกับบีบสิบปนกันไปหมด {name}ขีดผิดแถวแล้วแถวเล่า คนนับเริ่มกระซิบตัวเลขออกมาเองโดยไม่รู้ตัว

          เลยเที่ยงคืน เขาชี้ขึ้นฟ้าแล้วกระซิบว่าตรงนั้น ดวงใหม่ {name}เงยหน้าตามนิ้วก่อนจะห้ามตัวเองทัน ฟ้าคืนเดือนดับเหนือแดนเถ้ามีดาวมากจนไม่เหลือที่มืด {name}ก้มหน้าลงทันที เร็วจนคอเคล็ดไปหลายวัน แต่ก้มช้าไปแล้ว

          ตอนสางคนนับจ่ายค่าแรงครึ่งเดียว กระดานสามแผ่นของ{name}ใช้ได้แค่แผ่นแรก
        effects: { gold: 2, hp: -1, taboo: { night: break }, flags: [counted_by_taps_for_the_star_office] }
    - id: the_night_after
      label: บอกเขาแบบที่คนแดนเถ้าบอกเด็ก ว่าให้รอคืนถัดไป
      requires: { flag: origin_ashland }
      text: |
        {name}พูดแบบที่ผู้ใหญ่ในบ้านเคยพูดตอน{name}ยังเล็ก ช้าๆ ทีละประโยค คืนเดือนดับไม่มีใครในแดนเถ้าเงยหน้า คืนถัดไปเดือนเป็นเส้นบางเท่ารอยเล็บ ตกตามตะวันไปไม่นาน หลังจากนั้นฟ้ามืดเกือบเท่ากัน ดาวก็ยังอยู่ครบทุกดวง

        คนนับฟังจบแล้วเปิดสมุดดูตารางเดือน นั่งคิดจนน้ำมันตะเกียงพร่องไปครึ่ง แล้วเลื่อนวันนับไปหนึ่งคืน คืนนั้น{name}ถือตะเกียงแดงให้เขาจนสาง ตัวเลขทุกตัวเขาเขียนเอง ไม่ปล่อยออกจากปากสักตัว เพราะ{name}ขอไว้ก่อนเริ่มว่าในหมู่บ้านนี้ อย่าให้เด็กได้ยิน

        ในรายงานที่ส่งกลับไปหอดูดาว ช่องวันนับของแดนเถ้าเขียนว่าคืนขึ้นหนึ่งค่ำ ใต้ช่องนั้นมีหมายเหตุตัวเล็กอยู่หนึ่งบรรทัด
      effects: { gold: 1, stats: { CHA: 1 }, taboo: { night: keep }, flags: [moved_the_count_a_night] }

- id: adult.region_ashland_the_new_teacher
  stage: adult
  scene: classroom
  time: dusk
  weight: 22
  when:
    age: [43, 60]
    location_tag: ashland
  text: |
    บ่ายๆ เสียงเด็กท่องสูตรคูณดังจากโรงเก็บเถ้าเก่าไปถึงปากเหมือง สองห้าสิบ สองหกสิบสอง ท่องกันจนคนงานกะบ่ายท่องตามได้ ครูอิสเบลมาจากเวนทราสตั้งแต่ต้นหน้าแล้ง เป็นครูคนแรกที่ยอมมาอยู่ไกลถึงที่นี่ ป้อมจ่ายค่าสอนให้เป็นข้าวสาร เธอกวาดเถ้าออกจากโรงเก็บเถ้าเก่าด้วยมือตัวเอง เอาแผ่นหินมุงหลังคาที่แตกมาทำกระดาน เด็กในหมู่บ้านเดินตามเธอเป็นแถวเหมือนลูกเป็ด

    ครูอิสเบลมีสมุดภาพดาวเล่มหนึ่ง วาดด้วยหมึกขาวบนกระดาษดำ เด็กๆ ขอดูกันจนมุมสมุดเปื่อย เธอบอกพ่อแม่ทุกบ้านว่าคืนเดือนดับนี้จะพาเด็กขึ้นเนินท้ายหมู่บ้านไปนับดาวของจริง ที่ไหนในทวีปก็ไม่มีฟ้ามืดเท่าที่นี่ เด็กแดนเถ้ามีของดีที่สุดอยู่เหนือหัว แต่ไม่เคยมีใครพาดู

    เธอรู้เรื่องข้อห้าม คนแก่ทุกคนบอกเธอแล้ว เธอฟังทุกคนจนจบ แล้วบอกว่าเป็นความกลัวจากสมัยก่อน บทเรียนเดียวก็หาย พ่อแม่ที่ย้ายมาจากถิ่นอื่นส่วนใหญ่ให้ลูกไป บ้านที่อยู่มาหลายรุ่นไม่ให้ แต่เด็กของบ้านพวกนั้นร้องจะไปจนพ่อแม่ใจอ่อนไปครึ่งหนึ่ง

    เย็นนี้ครูอิสเบลมาขอให้{name}ช่วยถือตะเกียงดวงใหญ่ เดินท้ายแถว เผื่อเด็กคนไหนเดินช้า
  choices:
    - id: bring_them_down
      label: เดินตามขึ้นเนินไปตอนมืด แล้วพาเด็กทุกคนกลับลงมา
      text: |
        {name}ไม่ถือตะเกียง ออกจากบ้านตอนแถวเด็กขึ้นเนินไปแล้ว เดินก้มหน้าตามแสงตะเกียงข้างหน้า ทางขึ้นเนินมีหลุมเหมืองทรุดซ่อนอยู่ใต้ผิวเถ้า {name}ตกลงไปหลุมหนึ่ง ลึกถึงเอว หน้าแข้งครูดขอบรางเหล็กเก่าจนเลือดซึมกางเกง ปีนขึ้นมาได้ก็เดินต่อ

        บนเนิน ครูอิสเบลกำลังให้เด็กนั่งเรียงหันหน้าไปทางตะวันออก {name}บอกว่าเด็กต้องกลับบ้าน ครูเถียง เสียงเธอสั่นแต่ไม่ยอม {name}จึงหันไปหาเด็ก พูดคำเดียวด้วยเสียงแบบที่ปู่ย่าตายายของพวกเขาใช้ ก้มหน้า เด็กทุกคนก้มลงพร้อมกัน แม้แต่ลูกของบ้านที่เพิ่งย้ายมา ครูอิสเบลยืนดูเด็กของเธอก้มหน้ากันทั้งแถว แล้วยกตะเกียงนำทุกคนลงเนิน

        หลายวันหลังจากนั้นเธอทัก{name}แค่ตามมารยาท แผลที่หน้าแข้งมีเถ้าเข้าไปฝัง ต้องล้างทุกเช้าอยู่ครึ่งเดือนกว่าจะหาย ปลายเดือนครูอิสเบลมาถามว่าทำไม {name}ตอบได้แค่ว่าทำกันมาตั้งแต่ก่อนมีวิหาร เธอจดคำตอบนั้นไว้ในสมุดภาพดาว หน้าหลังสุด
      effects: { hp: -2, taboo: { night: keep }, flags: [brought_the_children_down] }
    - id: carry_the_big_lamp
      label: ถือตะเกียงดวงใหญ่ เดินท้ายแถวตามที่ครูขอ
      text: |
        บนเนิน ครูอิสเบลให้เด็กนอนหงายบนผืนผ้าใบ {name}หรี่ตะเกียงลงจนเหลือแสงเท่าเมล็ดข้าว แล้วเงยหน้าตามเด็กๆ ฟ้าคืนเดือนดับเหนือแดนเถ้ามีดาวซ้อนกันหลายชั้นจนดูลึกลงไปได้ ครูชี้ช่องฟ้า เด็กนับพร้อมกันเป็นเสียงเดียว หนึ่ง สอง สาม ไปจนถึงร้อย แล้วขึ้นร้อยที่สอง เสียงนับเล็กๆ ลอยไปทั่วเนิน

        ระหว่างร้อยที่สาม ดาวทางตะวันออกดับไปทั้งแถบ ทีละแถว ช้าๆ เหมือนมีอะไรเลื่อนผ่าน ลมเย็นพัดลงมาตรงๆ จากข้างบน เถ้าบนพื้นยกขึ้นหนึ่งนิ้วทั่วทั้งเนินแล้วตกลง เด็กหยุดนับเองโดยไม่มีใครสั่ง คนเล็กที่สุดร้องไห้ ดาวกลับมาครบทุกดวงก่อนที่ใครจะลุกขึ้นได้ ครูอิสเบลบอกเด็กว่าเมฆ เสียงเธอไม่เหมือนเสียงคนพูดเรื่องเมฆ

        สัปดาห์ต่อมาเด็กที่มาโรงเก็บเถ้าเก่าหายไปครึ่งหนึ่ง {name}เดินผ่านทุกบ่าย เสียงท่องสูตรคูณเบาลงทุกวัน เด็กที่ยังมาไม่มีใครท่องเกินแม่สอง
      effects: { taboo: { night: break }, flags: [carried_the_teachers_lamp] }
    - id: stay_in
      label: ปิดบานเกล็ดอยู่ในบ้าน ไม่เข้าข้างครูหรือคนแก่
      text: |
        {name}บอกครูอิสเบลว่าคืนนั้นมีธุระ เธอไปขอคนอื่น ได้ชายหนุ่มจากบ้านที่เพิ่งย้ายมาถือตะเกียงแทน ตกค่ำแถวเด็กเดินผ่านหน้าบ้าน{name}ขึ้นเนิน ตะเกียงไหวไปตามจังหวะเดิน เด็กร้องเพลงกันทั้งแถว

        {name}นั่งในบ้าน ก้มหน้าตามธรรมเนียม ได้ยินเสียงเด็กนับดาวลอยลงมาจากเนิน เสียงเล็กๆ นับพร้อมกันไปถึงหลักร้อย แล้วหยุดพร้อมกันทั้งแถว หลังจากนั้นไม่มีเสียงอะไรลงมาอีก จนเสียงฝีเท้าวิ่งลงเนินดังผ่านหน้าบ้าน ไม่มีเสียงเพลง

        เช้าวันต่อมาเถ้าตกจากฟ้าทางตอเสาหนาที่สุดของหน้าแล้ง หลังคาทุกหลังต้องกวาดสองรอบก่อนเที่ยง {name}กวาดหลังคาบ้านตัวเองจนแขนล้า แล้วเห็นครูอิสเบลกวาดหลังคาโรงเก็บเถ้าเก่าอยู่คนเดียว ไม่มีเด็กมาช่วยสักคน
      effects: { world: { land: 1 }, flags: [stayed_in_on_the_lesson_night] }
    - id: the_head_down_lesson
      label: บอกครูว่าจะพาเด็กขึ้นเนินเอง แต่ให้ดูฟ้าแบบที่คนแดนเถ้าดู
      requires: { taboo: { id: night, keeps: true } }
      text: |
        ครูอิสเบลไม่เข้าใจว่าดูฟ้าโดยไม่เงยหน้าคืออะไร แต่ยอมให้ลองคืนเดียว {name}พาเด็กขึ้นเนินตอนหัวค่ำ ไม่จุดตะเกียง ให้นั่งเรียงกัน ไหล่ชนไหล่ หน้าผากแตะเข่า ครูอิสเบลนั่งท้ายแถว {name}บอกเด็กว่าคืนนี้ไม่ต้องนับอะไร ให้ฟังอย่างเดียว เด็กบางคนหัวเราะคิกคักอยู่พักใหญ่ แล้วก็เงียบไปเอง

        เลยหัวค่ำไปนาน อากาศเหนือเนินเปลี่ยน ลมเย็นพัดลงมาตรงๆ เหมือนฟ้าทั้งผืนหายใจออกครั้งเดียว เถ้ารอบตัวยกขึ้นแล้วตกลงเบาๆ บนหลังมือ บนต้นคอ มีบางอย่างผ่านเหนือหัวไป ใหญ่จนผ่านอยู่นานกว่าคนจะนับถึงร้อย ถ้ามีใครนับ ไม่มีใครนับ เด็กจับมือกันเองทั้งแถว ท้ายแถวมีเสียงครูอิสเบลสูดหายใจ แล้วกลั้นไว้

        ขาลงเนินไม่มีใครพูดถึงเมฆ สัปดาห์ต่อมาครูอิสเบลสอนเรื่องตอเสากับเถ้าแทนเรื่องดาว เธอให้เด็กเล่าว่าแต่ละบ้านก้มหน้ากันแบบไหน แล้วเขียนลงสมุดภาพดาวต่อจากหน้าหลังสุด
      effects: { stats: { WIS: 1 }, taboo: { night: keep }, flags: [taught_the_children_head_down] }

- id: adult.region_ashland_a_night_head_down
  stage: adult
  scene: road
  time: night
  weight: 22
  when:
    age: [42, 60]
    location_tag: ashland
  text: |
    ตาเมอร์ทันเดินกลางคืนโดยไม่ถือตะเกียงมาทั้งชีวิต ตั้งแต่สิ้นตาคัสเวล ในหมู่บ้านก็เหลือคนแบบนี้อยู่คนเดียว ตาเมอร์ทันรู้ว่าเถ้าตรงไหนแน่น ตรงไหนกลวงอยู่ข้างใต้ จากเสียงที่ดังขึ้นมาทางส้นเท้า รู้ว่าเดินมาถึงปากบ่อเก่าแล้วจากกลิ่นสนิมเหล็ก คนแดนเถ้ารุ่นก่อนเรียกคนแบบนี้ว่าคนที่เดินกลางคืนเป็น เด็กทุกคนในหมู่บ้านได้ยินข้อห้ามครั้งแรกจากปากตาเมอร์ทัน ไม่ชี้ดาว ไม่นับดาวออกเสียง คืนเดือนดับไม่เงยหน้า

    หน้าแล้งนี้เถ้าตกจากฟ้าทางตอเสาถี่ขึ้น จากเดือนละครั้งเป็นสัปดาห์ละครั้ง หลังคาต้องกวาดจนแขนไม่มีแรงยก แพะไม่ยอมออกจากคอกหลังตะวันตก หมาของหมู่บ้านนอนหันหัวไปทางตอเสาทุกตัว ตาเมอร์ทันบอกว่าคืนมันหนัก ไม่มีใครถามว่าหนักแบบไหน

    คืนก่อนเดือนดับ ตาเมอร์ทันนั่งที่กองไฟกลางหมู่บ้าน เล่าวิธีเก่าให้คนรอบกองไฟฟัง คนที่เคยฝืน ให้ออกไปนั่งบนเถ้านอกหมู่บ้านหนึ่งคืนเดือนดับ ตั้งแต่ตะวันลับจนไก่ขัน ก้มหน้าทั้งคืน ไม่นับอะไรเลย ไม่นับดาว ไม่นับลมหายใจ ไม่นับเสียงหัวใจ ไม่นับว่าอีกนานแค่ไหนจะเช้า คนที่ไม่มีอะไรต้องล้างนั่งแทนหมู่บ้านได้ ตาเมอร์ทันจะนั่งหน้าแถวเอง

    พูดจบ ตาเมอร์ทันเอาไม้เขี่ยถ่านในกองไฟ ไม่เรียกชื่อใคร
  choices:
    - id: sit_for_your_own
      label: ออกไปนั่งก้มหน้าบนเถ้าหนึ่งคืนเดือนดับ ล้างครั้งที่ตัวเองเคยฝืน
      requires: { taboo: { id: night, unbroken: false } }
      text: |
        คืนเดือนดับมีคนออกไปนั่งเจ็ดคน เถ้านอกหมู่บ้านเย็นกว่าที่คิด เย็นขึ้นมาจากข้างล่าง ผ่านผ้ารองนั่ง ผ่านกางเกง จนถึงกระดูก {name}นั่งแถวที่สอง หน้าผากแตะเข่า มือกอดหน้าแข้ง ตั้งแต่ตะวันลับ

        ที่ยากไม่ใช่ความหนาว หัวของ{name}นับเองโดยไม่ได้สั่ง นับลมหายใจ นับเสียงเถ้าที่ไหลลงจากหลังคนข้างๆ นับว่าขาเป็นเหน็บมากี่หนแล้ว ทุกครั้งที่จับตัวเองได้ {name}กดหน้าผากลงกับเข่าแรงขึ้นจนตัวเลขหลุดไป แล้วไม่นานก็เริ่มนับใหม่ ตาเมอร์ทันบอกไว้แล้วว่าจะเป็นแบบนี้ ไม่มีใครหยุดนับได้ในครั้งแรก ทำได้แค่ไม่ปล่อยให้นับถึงร้อย

        เลยเที่ยงคืน อากาศเหนือแถวกดลงมาเบาๆ เหมือนฝ่ามือใหญ่วางลงบนหลังทุกคนพร้อมกัน เถ้ารอบตัวยกขึ้นโดยไม่มีลม แล้วตกลงช้าๆ เสียงหนึ่งผ่านเหนือหัวไป ทุ้มและยาว เหมือนลมหายใจออกของอะไรที่ใหญ่กว่าหมู่บ้าน ใหญ่กว่าเนิน ตัวเลขในหัวของ{name}หายไปตอนนั้นเอง แล้วไม่กลับมาอีกจนเช้า

        ไก่ขัน ตาเมอร์ทันลุกขึ้นก่อน เดินไปตามแถว แตะไหล่ทีละคน ขาของ{name}ชาจนลุกเองไม่ได้ ต้องให้คนแถวหลังพยุง ไอเป็นเถ้าไปอีกสามวัน
      effects: { hp: -1, taboo: { night: mend }, flags: [sat_the_dark_moon_night] }
    - id: sit_for_the_village
      label: ออกไปนั่งแถวหน้าข้างตาเมอร์ทัน นั่งแทนคนในหมู่บ้านที่เคยฝืน
      requires: { taboo: { id: night, unbroken: true } }
      text: |
        {name}ไม่มีอะไรค้างต้องล้าง แต่ในหมู่บ้านมีคนที่เคยฝืนมากกว่าคนที่ออกมานั่ง ตาเมอร์ทันให้{name}นั่งแถวหน้าข้างตัวเอง ไหล่ชนไหล่ บอกว่าคนนั่งแทนต้องนั่งข้างหน้า เพราะไม่มีอะไรของตัวเองให้ถ่วง

        คืนนั้นยาวกว่าคืนไหนที่{name}จำได้ ตัวเลขในหัวมาแล้วไปหลายสิบหน ทุกหนที่มา ตาเมอร์ทันรู้ ข้อมือที่แตะกันอยู่บอกเขา เขากดข้อมือ{name}เบาๆ ครั้งหนึ่ง แล้วตัวเลขก็หลุดไป เลยเที่ยงคืน มีบางอย่างผ่านเหนือแถวไปช้าๆ อากาศกดลงบนหลัง เถ้ายกขึ้นแล้วตกลง ตาเมอร์ทันหายใจออกยาวพร้อมกับมัน

        เช้านั้นแพะออกจากคอกเองก่อนที่ใครจะไปเปิด เถ้าที่ตกจากฟ้าในสัปดาห์ต่อมาบางกว่าเดิม บางจนกวาดรอบเดียวก็หมด ตาเมอร์ทันบอกว่าไม่ได้หายขาด หมู่บ้านแค่ได้ผ่อน
      effects: { taboo: { night: keep }, world: { land: -1 }, flags: [sat_for_the_village] }
    - id: keep_the_back_row
      label: นั่งท้ายแถว คอยวางมือบนต้นคอคนที่เผลอเงยหน้า แบบที่คนแดนเถ้าทำให้กันมาแต่เด็ก
      requires: { flag: origin_ashland }
      text: |
        คืนเดือนดับแรกที่{name}จำได้ มีมือของผู้ใหญ่ในบ้านวางอยู่บนต้นคอ{name}ทั้งคืน ไม่กด ไม่ดึง วางไว้ให้รู้ว่าคอยังก้มอยู่ คืนนี้{name}นั่งท้ายแถวแบบเดียวกัน ข้างหน้ามีคนเจ็ดคน สามคนในนั้นย้ายมาจากถิ่นอื่น ไม่เคยนั่งแบบนี้มาก่อน

        เลยเที่ยงคืน มีบางอย่างผ่านเหนือแถว ใหญ่จนอากาศทั้งเนินเอนตาม คนที่สามจากซ้ายสะดุ้ง ต้นคอเริ่มยก {name}เอื้อมไปวางมือบนต้นคอคนนั้นก่อนที่คางจะพ้นเข่า ต้นคอใต้มือแข็งค้างอยู่ครู่หนึ่ง แล้วก้มลงตามเดิม หัวของ{name}เองก็ก้มอยู่ตลอด คนท้ายแถวไม่ต้องดู แค่ต้องรู้

        ไก่ขัน คนที่สามจากซ้ายหันมาหา{name} ไม่ได้ขอบคุณ ถามแค่ว่าใครสอนให้ทำแบบนี้ ตาเมอร์ทันตอบแทนว่าคนแดนเถ้าทุกบ้านสอนลูกแบบนี้
      effects: { stats: { CON: 1 }, taboo: { night: keep }, world: { land: -1 }, flags: [kept_the_back_row] }
    - id: not_tonight
      label: บอกตาเมอร์ทันว่าพรุ่งนี้มีงานแต่เช้า นั่งทั้งคืนไม่ไหว
      text: |
        ตาเมอร์ทันรับคำนั้นเหมือนรับคำตอบเรื่องฟืน ไม่ถามต่อ คืนเดือนดับ{name}นอนในบ้าน ปิดบานเกล็ด หลับก่อนเที่ยงคืน ไม่ได้ยินอะไร ไม่ได้ฝันอะไร

        ตอนสาง{name}ออกไปทำงาน เดินสวนกับแถวคนที่นั่งมาทั้งคืน แต่ละคนมีเถ้าเกาะเป็นแผ่นบนหลังกับบนหัว เดินขาแข็งเหมือนคนเพิ่งหัดเดิน ตาเมอร์ทันเดินนำหน้า ไม่ถือตะเกียงเหมือนเคย ผ่าน{name}ไปเหมือนผ่านเสาบ้าน
      effects: { flags: [skipped_the_dark_moon_sitting] }

- id: adult.region_ashland_the_ridge_slate
  stage: adult
  scene: home
  time: day
  weight: 22
  when:
    age: [44, 60]
    location_tag: ashland
  people:
    - { id: ashland_neighbour, name: ซากรอธ, gender: m, race: tiefling, bond: friend, closeness: 1, age: 36 }
  text: |
    ไม้เวรของหมู่บ้านคือด้ามไม้กวาดเก่าด้ามหนึ่ง ยาวเท่าแขน ผ่านมือมาทุกบ้านจนผิวไม้ลื่นเหมือนหินท้องลำธาร มีรอยบากหนึ่งรอยต่อหนึ่งบ้าน เรียงจากบ้านต้นทางไปจนถึงบ้านที่อยู่ใกล้ปากเหมืองที่สุด ไม้เวรแขวนอยู่หน้าประตูบ้านไหน บ้านนั้นเป็นคนเรียกทั้งหมู่บ้านขึ้นกวาดเถ้าครั้งต่อไป กวาดเสร็จก็ส่งต่อไปบ้านถัดไป

    วันสุดท้ายของหน้าแล้ง ไม้เวรแขวนอยู่ที่บ้านไหน หลังคาบ้านนั้นได้รื้อมุงใหม่ คนทั้งหมู่บ้านขึ้นช่วย แผ่นหินที่ร้าวเพราะเถ้าทับมาทั้งปีเปลี่ยนออก แผ่นที่ยังดีกลับขึ้นไปที่เดิม เจ้าของบ้านเลี้ยงข้าวทุกคนที่ขึ้นหลังคา ปีนี้ไม้เวรหยุดที่บ้านของซากรอธ บ้านที่พ่อของซากรอธมุงไว้เอง หลังคาลาดชันที่สุดในหมู่บ้าน

    แผ่นสุดท้ายที่ขึ้นหลังคาคือแผ่นสัน แผ่นหินยาวหนาที่คร่อมสันหลังคา ทับรอยต่อของสองฝั่งไว้ไม่ให้เถ้ากับฝนลงไปได้ คนวางแผ่นสันทุกหลังในหมู่บ้านคือลุงกาเวน มาตั้งแต่ก่อนที่{name}จะรู้ว่าหลังคามีแผ่นสัน ปีนี้หลังของลุงกาเวนงอจนแบกแผ่นสันขึ้นบ่าไม่ไหว ขึ้นบันไดได้แค่สามขั้น ลุงนั่งบนม้านั่งหน้าบ้านซากรอธตั้งแต่เช้า แผ่นสันวางพาดตักอยู่ทั้งวัน ตกบ่าย หลังคาสองฝั่งมุงเสร็จ ลุงกาเวนยื่นแผ่นสันให้{name}
  choices:
    - id: set_the_ridge
      label: รับแผ่นสัน ปีนขึ้นไปวางเองตามที่ลุงบอกจากข้างล่าง
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          แผ่นสันหนักกว่าที่เห็น ต้องแบกบนบ่าข้างเดียวแล้วปีนบันไดด้วยมือข้างเดียว ซากรอธจับบันไดไว้ข้างล่าง ลุงกาเวนตะโกนบอกจากม้านั่ง ให้วางปลายซ้ายก่อน ให้ฟังเสียงตอนหินแตะหิน เสียงทึบคือแนบ เสียงใสคือมีเถ้าค้าง {name}ปัดเถ้าออกจากสันด้วยแขนเสื้อ วางปลายซ้าย แล้วค่อยๆ ลดปลายขวาลงจนได้ยินเสียงทึบ

          คนข้างล่างโห่ขึ้นพร้อมกัน ลุงกาเวนไม่โห่ ลุงยันไม้เท้าลุกขึ้น เดินรอบบ้านซากรอธหนึ่งรอบ ดูสันหลังคาจากทุกด้าน แล้วนั่งลงกินข้าว หน้าฝนปีนั้นหลังคาบ้านซากรอธไม่รั่วสักหยด ฝนตกหนักครั้งไหน ซากรอธเดินมาบอก{name}ทุกครั้ง
        effects: { stats: { DEX: 1 }, people: [{ id: ashland_neighbour, closeness: 1 }], flags: [set_the_ridge_slate] }
      failure:
        text: |
          ครึ่งทางขึ้นบันได แผ่นสันเลื่อนบนบ่า {name}คว้าไว้ทัน แต่ขอบหินบาดฝ่ามือเป็นทางยาว เลือดหยดลงบนหลังคาที่เพิ่งมุง ลุงกาเวนลุกจากม้านั่ง ขึ้นบันไดมาได้สามขั้นแล้วยืนเกาะอยู่ตรงนั้น บอกให้{name}วางตามเสียงลุงทีละคำ

          แผ่นสันลงที่ได้ แต่เบี้ยวไปข้างหนึ่งเท่าความกว้างของนิ้ว ฝนแรกของหน้าฝนหาช่องนั้นเจอ น้ำหยดลงกลางบ้านซากรอธตรงหน้าเตา ซากรอธเอาหม้อรองไว้แล้วหัวเราะ บอกว่าอย่างน้อยทั้งหมู่บ้านก็รู้ว่าใครวาง
        effects: { hp: -1, flags: [tilted_the_ridge_slate] }
    - id: carry_the_slates
      label: บอกลุงว่าแผ่นสันของบ้านนี้ควรเป็นของซากรอธ แล้วแบกแผ่นสันขึ้นไปส่งให้
      text: |
        ลุงกาเวนคิดอยู่ครู่หนึ่ง แล้วบอกว่าก็จริง หลังคานี้พ่อของซากรอธมุง แผ่นสันก็ควรเป็นของลูก {name}แบกแผ่นหินขึ้นบันไดมาตั้งแต่เช้า บ่าระบมจนยกแขนได้ไม่สุด แต่แผ่นสุดท้ายนี้หนักที่สุด {name}แบกขึ้นไปส่งถึงมือซากรอธบนสันหลังคา แล้วลงมายืนจับบันไดให้

        ซากรอธวางแผ่นสันช้ากว่าที่ลุงกาเวนเคยวาง ฟังเสียงหินอยู่นาน ยกขึ้นสองครั้งก่อนจะยอมให้ลง ตามธรรมเนียม น้ำถ้วยแรกหลังวางแผ่นสันเจ้าของบ้านต้องยื่นให้ลุงกาเวน พอลงมาจากบันได ซากรอธยื่นถ้วยแรกให้{name} ลุงกาเวนเห็นแล้วทำเป็นไม่เห็น
      effects: { stats: { STR: 1 }, people: [{ id: ashland_neighbour, closeness: 1 }], flags: [carried_the_ridge_slate_up] }
    - id: keep_the_stick
      label: ขอรับไม้เวรไปดูแลแทนลุง ส่วนแผ่นสันให้คนที่มือนิ่งกว่าวาง
      text: |
        ลุงกาเวนไม่ได้วางแผ่นสันอย่างเดียว ลุงเป็นคนบากไม้เวรด้วย บ้านใหม่สร้างเสร็จ ลุงบากรอยเพิ่ม บ้านไหนย้ายออกไป ลุงตอกลิ่มไม้อุดรอยนั้น {name}รับไม้เวรมาวางบนตัก ส่วนแผ่นสัน ลุงยื่นต่อให้ซากรอธ

        คืนนั้น{name}นั่งไล่นิ้วไปตามรอยบากใต้ตะเกียง รอยเก่าตื้นจนแทบหาย รอยใหม่ยังคม ท้ายด้ามมีรอยอุดลิ่มอยู่หลายรอย บ้านที่เพิ่งย้ายมาจากถิ่นอื่นสองบ้านยังไม่มีรอยของตัวเอง เช้าวันต่อมา{name}เอามีดไปนั่งหน้าบ้านทั้งสองหลัง บากรอยให้ต่อหน้าเจ้าของบ้าน แล้วให้เจ้าของบ้านลูบรอยของตัวเองดูว่าลึกพอหรือยัง
      effects: { stats: { WIS: 1 }, flags: [keeps_the_rota_stick] }
    - id: sing_from_below
      label: ส่งแผ่นสันให้ซากรอธ แล้วยืนร้องเพลงมุงหลังคาจากข้างล่างแทนลุง
      requires: { flag: origin_ashland }
      text: |
        ตอนแผ่นสันขึ้นหลังคา คนแดนเถ้าร้องเพลงจากข้างล่าง ให้คนบนสันหายใจเข้าออกตามจังหวะ ไม่รีบ ไม่สั่น ลุงกาเวนเคยร้องเองจากบนหลังคา ปีนี้ร้องไม่ไหว {name}ร้องเพลงนี้ได้ตั้งแต่ยังตัวเท่าไม้กวาด ร้องตามผู้ใหญ่ที่ยืนเรียงกันอยู่ข้างล่างทุกหน้าแล้ง

        เถ้าลงมา หินรับไว้ หินลงมา เรือนรับไว้ {name}ร้องท่อนแรกคนเดียว ท่อนที่สองคนทั้งลานร้องตาม เด็กที่ไม่รู้คำร้องก็ตบมือตามจังหวะ ซากรอธบนสันหลังคาวางปลายซ้ายลงตรงคำว่าหิน วางปลายขวาลงตรงคำว่าเรือน ได้ยินเสียงทึบทั้งสองข้าง

        ลุงกาเวนร้องตามอยู่บนม้านั่ง เสียงแหบ ตามไม่ทันทุกคำ พอเพลงจบลุงบอกว่า{name}ร้องเร็วกว่าลุงไปครึ่งจังหวะ แล้วบอกว่าเร็วแบบนั้นก็ดี คนรุ่นนี้หายใจเร็วกว่า
      effects: { stats: { CHA: 1 }, people: [{ id: ashland_neighbour, closeness: 1 }], flags: [sang_the_roofing_song] }
