# วัยกลางคน ปีที่เจ้าเดิมพลิกตัว (ชุด 4) จุดยึดของถิ่นแปดปี ปี 320 ถึง 341
# ทุกเรื่อง must: true ช่วงสองปี เรื่องของทั้งถิ่น ข้อความห้ามเดาอายุ งาน หรือคนในบ้านของตัวละคร
# ไม่มีเจ้าเดิมตนไหนโผล่ให้เห็นหรือถูกเอ่ยชื่อ ประกาศของทางการไม่มีฉบับไหนใช้คำว่าเจ้าเดิม คนในถิ่นเรียกปีเหล่านี้ด้วยชื่อที่ตั้งกันเอง
# ข้อเท็จจริงของแต่ละปีตามตาราง "ปีที่เจ้าเดิมพลิกตัว" ในคัมภีร์ ไม่มีใครตายในเรื่องเหล่านี้

# ---------- 320 ฮอร์ดุน หนาวข้ามปี ----------
- id: adult.land_year_long_winter
  stage: adult
  weight: 500
  must: true
  mark: หนาวข้ามปี
  scene: land_stone
  when:
    age: [19, 75]
    year: [320, 321]
    location_tag: hordun
    not_flags: [institute_student]
  text: |
    เดือนที่หนาวที่สุดผ่านไปแล้วตามปฏิทิน หิมะไม่ได้ฟังปฏิทิน ช่องเขาทั้งสามช่องปิดตาย กองคาราวานเกลือที่ควรมาถึงต้นเดือนติดอยู่อีกฝั่งเขา ราคาเกลือในตลาดล่างขึ้นทุกสัปดาห์ ราคาฟืนขึ้นเร็วกว่า

    ที่ปากเหมืองทุกปากน้ำแข็งจับหนาเท่าแขน แต่เตาข้างในยังติดอยู่ทุกเตา คนตักถ่านต้องเอาค้อนทุบทางเข้าทุกเช้า คนกะดึกขึ้นมาเล่าเรื่องเดียวกันทุกกะ จากชั้นล่างสุดมีเสียงหายใจ ช้า ยาว ห่างกันนานพอให้คนนับลมหายใจตัวเองได้สิบครั้ง ไม่มีใครเล่าว่าเป็นเสียงของอะไร

    บริษัทเหมืองติดใบประกาศที่ลานชั่ง เตาหลอมรอแร่ไม่ได้ ใครลงไปทำงานเดือนนี้ได้ค่าแรงสองเท่า ไม่ว่าจะเคยถือพลั่วหรือไม่ คนแก่ของตระกูลยืนอ่านแล้วถ่มน้ำลายลงหิมะ บอกว่าเดือนที่หนาวที่สุดไม่ได้นับตามปฏิทิน นับตามหิน
  choices:
    - id: stay_up_top
      label: ไม่ลง เดือนนี้ยังหนาวอยู่ หินยังนอนอยู่
      text: |
        {name}ไม่ลง ค่าแรงสองเท่าเดินผ่านหน้าไปทุกเช้าพร้อมคนที่ลง ข้าวในบ้านเหลือครึ่งกระสอบตอนหิมะเริ่มละลาย ฟืนหมดก่อนข้าว ต้องผ่าโต๊ะตัวเก่าเผาไปหนึ่งตัว

        กลางปีหิมะในช่องเขาละลายพร้อมกันในสามวัน น้ำแข็งที่ปากเหมืองหลุดลงมาเป็นแผ่นเท่าประตู เสียงหายใจจากชั้นล่างสุดเงียบไปตั้งแต่คืนนั้น ไม่มีใครได้ยินอีก
      effects: { gold: -2, taboo: { stone: keep }, flags: [stayed_up_the_long_winter] }
    - id: go_down_for_double
      label: ลงไปรับค่าแรงสองเท่า
      text: |
        ข้างล่างอุ่นกว่าข้างบนจนต้องถอดเสื้อนอก {name}ตักแร่ใส่รถรางวันละสิบสองชั่วโมง ตอนพักครั้งหนึ่งได้ยินเสียงนั้นเองกับหู ช้า ยาว ลอดขึ้นมาตามรอยแตกของพื้น พื้นใต้ฝ่าเท้าอุ่นขึ้นทุกครั้งที่เสียงนั้นดัง

        ค่าแรงเดือนนั้นได้สามเหรียญ มากที่สุดเท่าที่เคยได้จากเดือนเดียว แต่ช่องเขาเปิดช้ากว่าที่ทุกคนคิดไปอีกสองสัปดาห์ คนแก่ของตระกูลไม่ทักคนที่ลงไปจนหิมะละลายหมด
      effects: { gold: 3, taboo: { stone: break }, flags: [went_down_in_the_long_winter] }
    - id: carry_salt_over_the_pass
      label: เข้าแถวคนแบกเกลือ ลุยหิมะข้ามช่องเขาไปรับของจากคาราวาน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          คนแบกสิบสองคนผูกเชือกเอวต่อกันเป็นแถว ลุยหิมะถึงอกข้ามช่องเขาตะวันตกไปสองวัน กลับมาสามวัน {name}แบกเกลือกลับมาหนึ่งกระสอบเต็ม นิ้วเท้าดำไปหนึ่งนิ้วแล้วค่อยๆ กลับเป็นสีชมพู

          ตลาดล่างขายเกลือราคาเดิมได้หนึ่งสัปดาห์เพราะเกลือกระสอบนั้น คนแก่ของตระกูลส่งเนื้อแห้งมาให้ที่บ้านหนึ่งห่อ ไม่มีจดหมาย
        effects: { stats: { CON: 1 }, reputation: { dwarf_council: 1 }, flags: [carried_salt_through_the_long_winter] }
      failure:
        text: |
          วันที่สองหิมะถล่มลงมาจากไหล่เขาข้างหน้า ไม่ได้โดนแถวคน แต่ปิดทางทั้งช่อง คนแบกสิบสองคนต้องหันกลับ {name}ขาจมหิมะจนเชือกเอวกระชากล้มสองครั้ง

          กลับถึงหมู่บ้านมือเปล่า ไข้ขึ้นอยู่สามวัน ตลาดล่างขึ้นราคาเกลืออีกรอบในสัปดาห์นั้น
        effects: { hp: -2, flags: [turned_back_in_the_long_winter] }

# ---------- 322 ทุ่งอาร์เวล ปีทุ่งยุบ ----------
- id: adult.land_year_sunken_field
  stage: adult
  weight: 500
  must: true
  mark: ปีทุ่งยุบ
  scene: land_field
  when:
    age: [19, 75]
    year: [322, 323]
    location_tag: arvel_village
    not_flags: [institute_student]
  text: |
    เสียงนั้นดังตอนดึก ไม่ใช่เสียงฟ้าร้อง ไม่ใช่เสียงเกวียน เป็นเสียงดินถอนหายใจยาวครั้งเดียว ทั้งหมู่บ้านตื่น หมาไม่เห่า วัวในคอกยืนนิ่งไม่ขยับหาง

    เช้าขึ้นนาแถบหนึ่งยาวครึ่งวันเดินทรุดลงไปหนึ่งช่วงเข่า ขอบแอ่งเรียบเหมือนใครเอามีดตัด ข้าวในแถบนั้นยังยืนต้นอยู่ทุกกอ แค่อยู่ต่ำลงไป บ่อน้ำสามบ่อในแนวนั้นเอียงจนน้ำในบ่อเป็นแนวเฉียง รั้วทุกแนวล้มไปทางเดียวกันหมด ทางตะวันออก

    เนินที่คนไถอ้อมมาทุกรุ่นอยู่กลางแถบนั้นพอดี ดินรอบเนินยุบหมด เนินไม่ขยับสักนิ้ว ยืนสูงขึ้นมาจากแอ่งเหมือนเกาะ
  choices:
    - id: plough_round_the_hollow
      label: ปล่อยแอ่งไว้อย่างนั้น ไถอ้อมขอบแอ่งเหมือนไถอ้อมเนิน
      text: |
        {name}ไม่แตะแอ่ง ข้าวในแอ่งปล่อยให้ยืนจนแห้งคาต้น ร่องไถใหม่วนอ้อมขอบแอ่งเป็นวงกว้าง เสียที่นาไปเท่าข้าวสองกระสอบ ส่วยหลวงยังคิดเต็มแปลง

        ปลายปีหญ้าขึ้นเต็มแอ่ง นกกระจาบทำรังเป็นร้อยรังตามกอข้าวแห้ง ตอนเย็นทั้งแอ่งเสียงดังเหมือนตลาด
      effects: { gold: -2, taboo: { field: keep }, flags: [left_the_sunken_strip] }
    - id: plough_it_level
      label: ขนดินถมแอ่ง แล้วไถให้เรียบเท่าเดิม
      text: |
        เพื่อนบ้านสามบ้านช่วยกันขนดินจากคันคูมาถมแอ่งช่วงที่เป็นของ{name}ทั้งสัปดาห์ ไถทับลงไปจนเรียบเสมอแปลงข้างๆ ทันลงกล้ารอบหลัง ได้ข้าวคืนมาเกือบเต็มยุ้ง

        แต่ทุกเช้าดินที่ถมยุบลงไปอีกนิ้วหนึ่ง พอถึงหน้าเกี่ยว ร่องไถตรงที่ถมเบี้ยวไปทางตะวันออกทุกร่อง เหมือนมีอะไรข้างใต้ค่อยๆ ดึงไว้
      effects: { gold: 2, taboo: { field: break }, flags: [ploughed_the_sunken_strip_level] }
    - id: right_the_fences_and_wells
      label: ช่วยตั้งรั้วที่ล้มกับขุดบ่อที่เอียงใหม่ทั้งแนว
      check: { stat: STR, dc: 13 }
      success:
        text: |
          บ่อที่เอียงต้องขุดใหม่ห่างออกไปสิบก้าว รั้วต้องปักใหม่ทุกต้น {name}ขุด ปัก ตอกอยู่สามสัปดาห์กับคนในหมู่บ้านอีกเจ็ดคน ไม่มีใครจ้างใคร ทุกคนกินข้าวบ้านที่ใกล้ที่สุดตอนเที่ยง

          บ่อใหม่บ่อแรกน้ำใสตั้งแต่วันแรก รั้วใหม่ทุกต้นปักตรง ไม่มีต้นไหนล้มไปทางไหนอีก
        effects: { stats: { STR: 1 }, alignment: { moral: 1 }, flags: [righted_the_wells_in_the_sunken_year] }
      failure:
        text: |
          ผนังบ่อเก่าพังลงมาตอนขุดลึกได้สองช่วงตัว {name}ปีนขึ้นมาทันแค่ครึ่งตัว ดินทับขาไว้จนคนอื่นช่วยกันขุดออก

          ขาเดินกะเผลกอยู่ครึ่งเดือน บ่อเก่าถมกลับไปเฉยๆ คนในหมู่บ้านขุดบ่อใหม่กันเองโดยไม่มี{name}
        effects: { hp: -2, flags: [buried_to_the_knee_in_the_sunken_year] }
    - id: stand_in_the_hollow
      label: เดินลงไปยืนในแอ่ง ข้างเนิน
      requires: { trait: old_field }
      text: |
        ดินในแอ่งอุ่นกว่าดินข้างบน อุ่นเหมือนที่นอนที่เพิ่งมีคนลุก {name}ยืนอยู่ตรงนั้นจนแดดขึ้นสูง รวงข้าวในแอ่งทุกรวงโน้มมาทางที่{name}ยืน ลมไม่มีสักแผ่ว

        ตอนปีนขึ้นจากแอ่ง หลังที่ปวดมาตั้งแต่เช้าหายไปเฉยๆ เหมือนตอนที่รวงสุดท้ายโน้มมาทางบ้านครั้งแรก
      effects: { taboo: { field: keep }, flags: [stood_in_the_sunken_strip] }

# ---------- 326 เวนทราส น้ำขึ้นหน้าแล้ง ----------
- id: adult.land_year_dry_flood
  stage: adult
  weight: 500
  must: true
  mark: น้ำขึ้นหน้าแล้ง
  scene: land_river
  when:
    age: [19, 75]
    year: [326, 327]
    location_tag: ventras
    not_flags: [institute_student]
  text: |
    เดือนที่ฝนไม่ตกเลยสักเม็ด คลองในย่านโรงกลั่นเอ่อขึ้นทีละขั้นบันได วันละขั้น จนถึงวันที่สี่น้ำขึ้นมาเสมอธรณีประตูทุกบ้านริมคลอง ไม่ล้นเข้าบ้านสักหลัง หยุดอยู่ตรงนั้นพอดี

    น้ำใส ใสจนเห็นก้นคลอง คนทั้งย่านไม่เคยเห็นก้นคลองมาก่อนในชีวิต คนแก่ที่สุดก็ไม่เคย ก้นคลองเป็นหินปูเรียบ บนหินมีของที่ย่านนี้ทิ้งลงไปนับร้อยปีกองเรียงกันเป็นแถว เศษหม้อ ล้อเกวียน เหรียญทองแดงเขียวคล้ำเป็นพันๆ เหรียญ

    ท่อระบายน้ำทุกท่อจมอยู่ใต้น้ำ น้ำล้างหม้อของทุกบ้านไม่มีทางไปนอกจากคลอง ใครอยากเทให้ไกลน้ำต้องหาบไปถึงบ่อทิ้งบนเนินหลังย่าน
  choices:
    - id: haul_to_the_pit
      label: หาบน้ำล้างหม้อไปเทที่บ่อบนเนินทุกคืนจนกว่าน้ำจะลด
      text: |
        บ่อทิ้งบนเนินอยู่ไกลครึ่งยาม {name}หาบไปทุกคืน ไหล่แดงเป็นรอยไม้คาน คืนที่ห้ามีคนข้างบ้านหาบตามมาอีกสองคน คืนที่เจ็ดเป็นหกคน ไม่มีใครพูดว่าทำไม

        วันที่เก้าน้ำลดลงเอง วันละขั้นเหมือนตอนขึ้น พอพ้นขั้นล่างสุดก็ขุ่นกลับเป็นสีเดิมในคืนเดียว ก้นคลองหายไปอีกครั้ง
      effects: { hp: -1, taboo: { river: keep }, flags: [hauled_the_slops_in_the_dry_flood] }
    - id: pour_it_at_night
      label: เทลงคลองตอนดึกเหมือนบ้านอื่น น้ำขึ้นมาถึงประตูแล้วจะให้ไปเทที่ไหน
      text: |
        {name}เทน้ำล้างหม้อลงคลองหน้าบ้านตอนดึก น้ำสีขุ่นลอยเป็นแผ่นอยู่บนน้ำใส ไม่ยอมจมลงไปปนกัน ไม่ไหลไปไหน ลอยวนอยู่หน้าธรณีประตูบ้าน{name}จนเช้า

        วันต่อมาคนเดินผ่านมองแผ่นสีขุ่นหน้าบ้าน{name}แล้วมองหน้า{name} วันที่เก้าน้ำลดลง แผ่นนั้นลดลงตามไปด้วยเป็นแผ่นสุดท้าย
      effects: { taboo: { river: break }, flags: [poured_into_the_clear_canal] }
    - id: hold_the_doorsill
      label: กองกระสอบทรายกันน้ำที่ธรณีประตู แล้วเฝ้าไว้ทั้งเก้าวัน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}กรอกทรายใส่กระสอบเองครึ่งวัน กองสามชั้นกั้นธรณีประตู นอนเฝ้าอยู่หลังกระสอบเก้าคืน น้ำไม่ได้ข้ามกระสอบมาแม้แต่หยด ที่จริงก็ไม่ได้ข้ามธรณีประตูบ้านไหนในย่านเลยสักบ้าน

          วันที่น้ำลด คนข้างบ้านมายืมกระสอบไปกองไว้กันปีหน้า {name}ให้ยืมไปทั้งกอง ไหล่กับหลังแข็งขึ้นจากการแบกทรายเก้าวัน
        effects: { stats: { CON: 1 }, flags: [sandbagged_the_dry_flood] }
      failure:
        text: |
          คืนที่สามกระสอบชั้นล่างแตก ทรายไหลออกเป็นทาง {name}ลื่นล้มหลังกระแทกขอบธรณีประตู น้ำยังหยุดอยู่ที่ธรณีเหมือนเดิม ไม่ได้ขึ้นมาสักนิ้ว

          ทรายเปียกเลอะเต็มพื้นบ้าน ต้องกวาดอยู่สามวัน หลังปวดจนก้มผูกเชือกรองเท้าไม่ได้ไปทั้งสัปดาห์
        effects: { hp: -1, flags: [slipped_on_the_sandbags] }
    - id: stand_on_the_clear_bed
      label: เดินลงบันไดท่าน้ำไปยืนในน้ำใส
      requires: { trait: old_river }
      text: |
        น้ำใสรอบข้อเท้าอุ่นเหมือนทุกเช้าที่ขั้นนั้น {name}มองลงไปเห็นก้นคลองตรงหน้าท่า เหรียญทองแดงนับพันเหรียญวางเรียงกันเป็นแนวโค้งยาวตามลำคลองไปจนสุดสายตา ทุกเหรียญหงายหน้าขึ้น ไม่มีเหรียญไหนคว่ำ

        {name}หยิบเหรียญจากกระเป๋าตัวเองโยนลงไปหนึ่งเหรียญ เหรียญนั้นจมลงไปช้าๆ แล้วไปหยุดในแนวพอดี หงายหน้า
      effects: { stats: { WIS: 1 }, taboo: { river: keep }, flags: [stood_in_the_clear_canal] }

# ---------- 328 ทุกบ้านที่มีเตา ปีไฟดื้อ ----------
- id: adult.land_year_stubborn_fire
  stage: adult
  weight: 500
  must: true
  mark: ปีไฟดื้อ
  time: night
  scene: land_fire
  when:
    age: [19, 75]
    year: [328, 329]
    taboo: { id: fire, taught: true }
    not_flags: [institute_student]
  text: |
    ข่าวมากับรถไฟขบวนเช้า คนขนถ่านที่ลงจากตู้เล่าต่อกันจนทั้งสถานีรู้ภายในเที่ยง เตาหลอมเตาหนึ่งในคาร์ดินไม่ยอมดับมาสี่สิบวันแล้ว ราดน้ำลงไปไฟยิ่งลุกแรง บริษัทเลิกราดตั้งแต่วันที่สิบ ล้อมรั้วไว้แล้วรอ คนคาร์ดินเดินอ้อมถนนสายนั้นทั้งเมือง

    ตกดึกคืนนั้น เตาในบ้านที่คลุมขี้เถ้าไว้ตั้งแต่หัวค่ำลุกขึ้นเอง ไม่มีใครเติมฟืน ไม่มีใครเขี่ย เปลวไฟสูงเลยขอบเตาขึ้นมาเลียฝาผนัง ทั้งห้องสว่างเป็นสีส้มเหมือนตอนเย็น

    ข้างนอกได้ยินเสียงคนในละแวกลุกขึ้นมาวุ่น หลายบ้าน บ้านที่เคยดับเตาด้วยน้ำเมื่อหลายปีก่อนเสียงดังที่สุด
  choices:
    - id: bank_it_and_sit
      label: คลุมขี้เถ้าเพิ่ม แล้วนั่งเฝ้าอยู่หน้าเตาจนเช้า
      text: |
        {name}โกยขี้เถ้าคลุมเพิ่มสองชั้น ไฟลอดขึ้นมาตามรอยแตกของขี้เถ้าอยู่ครึ่งคืน แล้วค่อยๆ ลดลงเหลือแค่แสงแดงใต้ผิวเถ้า {name}นั่งเฝ้าจนไก่ขัน ไม่ได้หลับ หน้าร้อนจนแสบ

        เช้าขึ้นเตาเย็นลงเป็นเตาธรรมดา บ้านข้างๆ สองบ้านมาขอขี้เถ้าไปคลุมเตาของตัวเองบ้าง
      effects: { hp: -1, taboo: { fire: keep }, flags: [sat_up_with_the_stubborn_fire] }
    - id: throw_water
      label: สาดน้ำทั้งโอ่งใส่ ก่อนไฟจะลามขึ้นหลังคา
      text: |
        น้ำทั้งโอ่งลงเตา ไอขาวพุ่งขึ้นถึงขื่อ แล้วไฟก็ลุกขึ้นมาใหม่ สูงกว่าเดิมเท่าตัว เปลวไฟเลียผ้าที่ตากไว้เหนือเตาไหม้ไปสองผืน {name}ตบไฟจนมือพอง

        ไฟลดลงเองตอนรุ่ง ช้าๆ ไม่ได้เพราะน้ำ ขี้เถ้าในเตาเปียกเป็นโคลนดำ เตาจุดไม่ติดไปอีกสามวัน
      effects: { hp: -1, taboo: { fire: break }, flags: [threw_water_on_the_stubborn_fire] }
    - id: take_the_fire_out
      label: ตักถ่านใส่หม้อดิน เอาไปให้บ้านที่เตาไม่ยอมติดมาทั้งหนาว
      text: |
        ทุกละแวกมีบ้านหนึ่งที่เตาจุดยากที่สุด {name}ตักถ่านที่ลุกเองใส่หม้อดินสามหม้อ เดินไปเคาะบ้านนั้นกลางดึก คนในบ้านงัวเงียมาเปิด เห็นหม้อไฟแล้วไม่ถามอะไร หลีกทางให้เข้าไป

        ถ่านลงเตาบ้านนั้นแล้วติดทันที ติดดีจนเช้า เตาบ้าน{name}เหลือแค่ถ่านแดงพอดีๆ เหมือนทุกคืน
      effects: { alignment: { moral: 1 }, flags: [gave_the_stubborn_fire_away] }
    - id: hand_in_the_flame
      label: ยื่นมือเข้าไปในเปลว
      requires: { trait: old_fire }
      text: |
        ไฟไม่ลวกมือ อุ่นเหมือนแช่มือในน้ำอุ่น {name}วางมือนิ่งอยู่ในเปลวอย่างคนวางมือบนหลังสัตว์ที่ตื่นตกใจ เปลวไฟค่อยๆ ลดลงรอบข้อมือ จนเหลือสูงแค่ขอบเตา

        ทั้งคืนนั้นเตาบ้าน{name}เป็นเตาเดียวในละแวกที่ไฟนิ่ง ตอนเช้าขนที่หลังมือหายไปหมด ผิวข้างใต้ไม่มีรอยแดงสักรอย
      effects: { stats: { STR: 1 }, taboo: { fire: keep }, flags: [stilled_the_stubborn_fire_by_hand] }

# ---------- 330 ป่าไอเลธ ปีป่าเดิน ----------
- id: adult.land_year_walking_forest
  stage: adult
  weight: 500
  must: true
  mark: ปีป่าเดิน
  scene: land_forest
  when:
    age: [19, 75]
    year: [330, 331]
    location_tag: ileth
    not_flags: [institute_student]
  text: |
    หน้าฝนปีนั้นชายป่าขยับเข้าหาหมู่บ้านชายป่า ช้าจนไม่มีใครเห็นมันเดิน เร็วจนทุกเช้ามีต้นกล้าขึ้นในที่ที่เมื่อวานยังเป็นทางเดิน พอสิ้นฤดูชายป่าเข้ามาใกล้กว่าเดิมหนึ่งช่วงหว่านแห รั้วสวนผักของบ้านแถวหน้าอยู่ใต้ร่มสนแล้ว

    รากสนเส้นเท่าแขนดันพื้นลานตะกร้าจนแตกเป็นแนวยาว แผงขายของแถวกลางเอียง พ่อค้าจากบ้านตีนไม้ขอตัดรากออก ผู้ใหญ่ของกิ่งตอบคำเดียวว่าไม่ ไม่มีใครตัด

    ตลาดย้ายแผงไปตั้งรอบแนวรากเป็นวงโค้ง ส่วนคนที่มีแปลงผักอยู่แถวหน้า แต่ละบ้านต้องคิดเอาเองว่าจะทำอย่างไรกับรากที่ขึ้นมากลางแปลง
  choices:
    - id: let_it_come
      label: ย้ายรั้วกับแปลงผักถอยหลังให้ ปล่อยรากไว้อย่างนั้น
      text: |
        {name}ถอนเสารั้วปักใหม่ถอยหลังไปหนึ่งช่วงหว่านแห ย้ายแปลงผักไปขึ้นตรงที่แดดน้อยกว่า ผักขึ้นช้า ได้ครึ่งเดียวของปีก่อน รากที่ขึ้นขวางทางเดินต้องก้าวข้ามทุกครั้งที่ผ่าน

        ปลายปีมีกวางตัวเมียตัวหนึ่งมานอนใต้ร่มสนตรงที่เคยเป็นแปลงผักทุกบ่าย นอนจนชินที่ ไม่ลุกหนีเวลามีคนเดินผ่าน
      effects: { gold: -2, taboo: { forest: keep }, flags: [gave_ground_to_the_walking_forest] }
    - id: cut_the_roots
      label: ตัดรากที่ขึ้นกลางแปลงทิ้งตอนกลางคืน ไม่ให้ใครเห็น
      text: |
        {name}เอามีดพร้ากับเลื่อยมือออกไปตอนดึก ตัดรากเส้นที่ขึ้นกลางแปลงออกเป็นท่อนๆ ยางไหลออกมาจากรอยตัดเหนียวติดมือ ล้างสามน้ำก็ไม่ออก กลิ่นยางสนติดเสื้ออยู่ทั้งสัปดาห์

        สามวันต่อมาที่รอยตัดแตกรากออกมาใหม่ห้าเส้น เส้นเล็กกว่าเดิม มากกว่าเดิม ชอนเข้าไปใต้เสารั้วแล้ว ผู้ใหญ่ของกิ่งเดินผ่านแปลง ดมอากาศครั้งหนึ่ง แล้วเดินต่อ
      effects: { taboo: { forest: break }, flags: [cut_back_the_walking_forest] }
    - id: mend_the_basket_yard
      label: ไปช่วยปูพื้นลานตะกร้าใหม่ อ้อมแนวรากให้ตลาดเปิดได้
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ไล่ดูแนวรากทั้งลานก่อนลงมือ รากทุกเส้นวิ่งไปทางเดียวกัน ทางหมู่บ้าน ช่องว่างระหว่างรากพอให้ปูหินเป็นทางเดินคดเคี้ยวได้โดยไม่ต้องแตะรากสักเส้น ผู้ใหญ่ของกิ่งเดินมาดูครึ่งวันแล้วให้คนมาช่วยอีกสี่คน

          ตลาดเปิดได้ก่อนหน้าหนาว ทางเดินในลานคดไปมาเหมือนทางน้ำ คนมาจากบ้านตีนไม้บ่นว่าเดินหลง แล้วก็ชินไปเอง
        effects: { stats: { WIS: 1 }, flags: [laid_the_winding_basket_yard] }
      failure:
        text: |
          หินแผ่นที่{name}ปูไว้ทับรากเส้นเล็กเส้นหนึ่งโดยไม่ทันเห็น สองวันต่อมาหินแผ่นนั้นยกขึ้นมาตั้งเอียงกลางทาง แม่ค้าคนหนึ่งสะดุดล้มตะกร้าไข่แตกทั้งตะกร้า

          {name}จ่ายค่าไข่ไปสองเหรียญ ผู้ใหญ่ของกิ่งให้คนอื่นมาปูต่อ
        effects: { gold: -2, flags: [tripped_the_basket_yard] }
    - id: walk_into_the_new_edge
      label: เดินเข้าไปในชายป่าที่เพิ่งมาใหม่
      requires: { trait: old_forest }
      text: |
        ใต้ร่มสนที่เพิ่งมาถึงเย็นกว่าที่ควร ดินยังนุ่มเหมือนเพิ่งพลิก {name}เดินลึกเข้าไปจนถึงแนวที่เคยเป็นชายป่าเดิม ตรงนั้นดินยุบลงเป็นแอ่งกว้างพอให้เกวียนจอดได้คันหนึ่ง ก้นแอ่งเรียบ ขอบแอ่งมีต้นกล้าขึ้นเป็นวงถี่ยิบ

        ขากลับ{name}เดินช้าลง ไม่มีกิ่งไหนเกี่ยวแขนเสื้อสักกิ่ง กระรอกตัวหนึ่งไต่ตามมาบนกิ่งข้างหัวจนถึงชายป่าใหม่ แล้วหยุดตรงนั้น
      effects: { taboo: { forest: keep }, flags: [walked_the_new_forest_edge] }

# ---------- 335 ทุกถิ่น สามวันนกไม่เกาะ ----------
- id: adult.land_year_birds
  stage: adult
  weight: 500
  must: true
  mark: สามวันนกไม่เกาะ
  scene: land_wind
  when:
    age: [19, 75]
    year: [335, 336]
    not_flags: [institute_student]
  text: |
    เช้าวันแรกนกทุกตัวในถิ่นบินขึ้นพร้อมกัน นกกระจอกจากชายคา นกพิราบจากหอ อีกาจากกองขยะ นกในกรงตามแผงตลาดกระพือปีกชนลูกกรงจนขนร่วง ทั้งหมดขึ้นไปบินวนเหนือหลังคาเป็นวงกว้าง ไม่ลงเกาะ

    วันที่สองวงนั้นยังวนอยู่ ไม่ห่าง ไม่ลง เสียงปีกดังทั้งวันทั้งคืนเหมือนฝนตกบนหลังคาสังกะสี ขี้นกตกลงมาเป็นห่า คนออกจากบ้านต้องกางร่ม ข่าวจากถิ่นอื่นที่มากับคนเดินทางบอกตรงกันว่าทุกเมืองเป็นอย่างนี้

    วันที่สามข่าวมาถึงตอนบ่าย เรือเหาะลำหนึ่งตกนอกเวนทราส ลมพัดเข้าใส่จากทางที่ไม่มีลม คนบนเรือรอดเกือบหมด เรือหักกลางลำ
  choices:
    - id: open_a_window
      label: เปิดหน้าต่างทุกบานไว้ทั้งสามคืน
      text: |
        {name}เปิดหน้าต่างทุกบาน ลมหนาวกับเสียงปีกเข้ามาเต็มบ้าน ขี้นกปลิวเข้ามาตามลมต้องกวาดทุกเช้า คืนที่สามมีนกกระจอกตัวหนึ่งบินเข้ามาเกาะขื่อ เป็นนกตัวเดียวในละแวกที่ลงเกาะ มันเกาะอยู่จนเช้า แล้วบินออกไปทางหน้าต่างบานเดิม

        เช้าวันที่สี่นกทั้งหมดลงเกาะพร้อมกันเหมือนตอนบินขึ้น ชายคาบ้าน{name}มีรังนกกระจอกเพิ่มขึ้นสองรัง
      effects: { taboo: { wind: keep }, flags: [opened_the_windows_for_the_birds] }
    - id: free_the_market_birds
      label: ไปที่แผงนกในตลาด ซื้อนกในกรงมาปล่อย
      text: |
        คนขายนกขายถูกกว่าทุกวัน นกในกรงร้องไม่หยุดมาสองวันจนคนขายหูอื้อ {name}ซื้อมาสามกรงในราคาเหรียญเดียว เปิดประตูกรงที่ลานหน้าตลาด นกสามตัวพุ่งขึ้นไปหาวงนกข้างบนทันที ไม่หันกลับมาสักตัว

        คนในตลาดเห็นแล้วทำตามอีกหลายคน ตกเย็นแผงนกเหลือแต่กรงเปล่าวางซ้อนกัน คนขายนกนั่งนับเงินที่ได้มากกว่าทุกวัน หน้าตาไม่รู้จะดีใจหรือไม่
      effects: { gold: -1, taboo: { wind: keep }, flags: [freed_the_caged_birds_in_the_three_days] }
    - id: drive_them_off
      label: ขึ้นหลังคาตีเกราะเคาะไม้ไล่นกกับคนอื่น
      text: |
        คนทั้งละแวกขึ้นหลังคาพร้อมกันตอนเย็นวันที่สอง ตีหม้อ ตีกระทะ ขว้างก้อนหิน โบกผ้า {name}ตีเกราะไม้อยู่จนแขนล้า วงนกข้างบนไม่ห่างออกไปสักวา เสียงปีกกลบเสียงเกราะหมด

        คืนนั้นลมพัดแรงขึ้นทั้งคืน กระเบื้องหลังคาบ้านหลายหลังปลิว หลังคาบ้าน{name}หายไปสามแผ่น
      effects: { world: { land: 1 }, flags: [drove_at_the_circling_birds] }

# ---------- 339 แดนเถ้า คืนที่ยาวถึงเที่ยง ----------
- id: adult.land_year_long_night
  stage: adult
  weight: 500
  must: true
  mark: คืนที่ยาวถึงเที่ยง
  scene: land_night
  time: night
  when:
    age: [19, 75]
    year: [339, 340]
    location_tag: ashland
    not_flags: [institute_student]
  text: |
    คืนเดือนดับผ่านไปตามปกติ ทุกบ้านชักบันไดขึ้น ทุกคนก้มหน้าอยู่ในเรือน แต่พอถึงเวลาที่ฟ้าควรจะสาง ฟ้าไม่สาง ไก่ไม่ขันสักตัว ดาวยังอยู่ครบ เถ้าข้างล่างดำสนิท

    ทั้งหมู่บ้านนั่งรออยู่ในความมืด ไม่มีใครจุดไฟ ไม่มีใครเงยหน้า ทางตอเสา ป้อมทั้งเจ็ดจุดคบเพลิงขึ้นทีละป้อม ตลอดแนวหิน เป็นจุดไฟเรียงกันยาวสุดขอบฟ้าเหมือนสร้อยที่ขาด

    ท้องหิวขึ้นทุกที น้ำในโอ่งเย็นจับฟัน เด็กในเรือนข้างๆ ร้องว่าอยากเห็นดวงตะวัน แล้วมีเสียงผู้ใหญ่กดเสียงเด็กลง
  choices:
    - id: keep_the_head_down
      label: ก้มหน้ารอต่อไป จนกว่าแสงจะมาเอง
      text: |
        {name}ก้มหน้าต่อ นั่งจนขาชา จนท้องหยุดร้อง จนลืมว่ารออะไร ไม่มีใครในเรือนพูดสักคำ ตอนเที่ยงวัน แสงเทาค่อยๆ ซึมขึ้นมาจากขอบฟ้าทุกด้านพร้อมกัน ไม่ได้มาจากทางตะวันออก

        ไก่ตัวแรกขันตอนแดดส่องถึงลานแล้ว ขันเสียงแหบเหมือนเพิ่งตื่นจากไข้ คบเพลิงตามแนวป้อมดับลงทีละดวง
      effects: { taboo: { night: keep }, flags: [kept_head_down_through_the_long_night] }
    - id: look_up_to_see_why
      label: เงยหน้าขึ้นดูว่าทำไมฟ้าไม่สาง
      text: |
        {name}เงยหน้า ฟ้ามีดาวครบ แต่ทุกดวงอยู่ไกลกว่าเมื่อคืน ไกลจนเหมือนมองผ่านน้ำลึก ระหว่างดาวกับหลังคามืดหนาเป็นชั้น หนาจนเหมือนจับได้ ชั้นนั้นขยับเบาๆ ขึ้นลง ขึ้นลง

        แสงมาตอนเที่ยงเหมือนที่ทุกคนเล่ากันทีหลัง {name}ได้เห็นช้ากว่าคนอื่น ตาพร่าเป็นจุดดำอยู่สามวันทุกครั้งที่หันไปทางแดด
      effects: { taboo: { night: break }, flags: [looked_up_in_the_long_night] }
    - id: carry_water_to_the_fort
      label: หย่อนบันได หาบน้ำไปส่งคนจุดคบที่ป้อมใกล้ที่สุด
      text: |
        ทางไปป้อมสามเดินในความมืดไม่ยากสำหรับคนที่เดินกลางคืนเป็น {name}ก้มหน้าเดินตามเสียงฝีเท้าตัวเอง หาบน้ำสองถังไปถึงป้อมตอนคนจุดคบกำลังขาดน้ำ ทหารที่ป้อมไม่ถามว่ามาจากไหน รับน้ำแล้วชี้ให้นั่งพิงกำแพง

        แสงมาตอนเที่ยง ทหารยามคนหนึ่งเอาขนมปังแข็งแบ่งให้ครึ่งก้อน บอกว่าจ่าสั่งให้จดชื่อคนที่มาช่วยไว้ทุกคน
      effects: { reputation: { wardens: 1 }, flags: [carried_water_in_the_long_night] }
    - id: sit_with_what_is_up_there
      label: นั่งก้มหน้า บอกคนในเรือนว่าไม่ต้องกลัว ข้างบนเขาเจ็บ ไม่ได้โกรธ
      requires: { flag: heard_the_sleep_pact }
      text: |
        {name}พูดเสียงต่ำให้คนในเรือนได้ยิน ไม่ได้บอกว่าใคร ไม่ได้บอกว่ารู้มาจากไหน คนในเรือนไม่ได้ถาม เด็กที่ร้องไห้อยู่เรือนข้างๆ เงียบลงเองตอนที่{name}พูดจบ

        ใกล้เที่ยง ลมอุ่นพัดลงมาจากข้างบนครั้งหนึ่ง ยาว ช้า อย่างคนที่เพิ่งหลับไปได้หลังเจ็บมาทั้งคืน แล้วแสงเทาก็เริ่มซึมขึ้นมาจากขอบฟ้า
      effects: { stats: { WIS: 1 }, taboo: { night: keep }, flags: [sat_with_the_long_night] }

# ---------- 341 ทุกถิ่น ประกาศห้ามไหว้ดิน ----------
- id: adult.land_year_edict
  stage: adult
  weight: 500
  must: true
  mark: ประกาศห้ามไหว้ดิน
  when:
    age: [19, 75]
    year: [341, 342]
    not_flags: [institute_student]
  text: |
    นักบวชตะเกียงมาเคาะประตูตอนสาย หนุ่มกว่าที่คิด รองเท้าเปื้อนฝุ่นของทางที่เดินมาทั้งเช้า ในมือมีประกาศม้วนหนึ่งกับสมุดเล่มหนึ่ง เขาอ่านประกาศให้ฟังที่ธรณีประตู เสียงเรียบแบบคนที่อ่านมาแล้วสามสิบบ้าน

    ศาสนจักรตะเกียงประกาศว่าการโยนเหรียญลงน้ำ การเว้นรวงไว้ในนา การเคาะหินก่อนเจาะ และธรรมเนียมอื่นที่คล้ายกัน คือการไหว้สิ่งที่ไม่ใช่เทพ ไม่มีโทษ ศาสนจักรแค่ขอให้เลิก ทุกบ้าน ตั้งแต่ปีนี้

    อ่านจบเขาเปิดสมุด จุ่มปากกา แล้วเงยหน้าขึ้นถามว่าบ้านนี้จะเลิกไหม เขาไม่ได้ถามว่าบ้านนี้ทำอะไรอยู่บ้าง เหมือนรู้อยู่แล้ว
  choices:
    - id: agree_to_stop
      label: ตอบว่าจะเลิก
      text: |
        นักบวชจดชื่อบ้านลงสมุด ขีดเครื่องหมายเล็กๆ ไว้ท้ายบรรทัด ขอบคุณ แล้วเดินไปบ้านถัดไป บ้านถัดไปตอบว่าจะเลิกเหมือนกัน บ้านถัดจากนั้นปิดประตูไม่เปิด

        {name}เลิกจริงทุกข้อที่บ้านเคยทำ ปีนั้นไม่มีอะไรเกิดขึ้น ปีต่อมาก็ไม่มี มีแต่เช้าบางเช้าที่มือยกขึ้นไปทำของที่เคยทำจนชิน แล้วค้างอยู่กลางอากาศ
      effects: { world: { land: 1 }, reputation: { lamp_church: 1 }, flags: [stopped_the_old_rites_for_the_church] }
    - id: keep_on_by_night
      label: ตอบว่าจะเลิก แล้วไปทำต่อตอนกลางคืน
      text: |
        {name}ตอบว่าจะเลิก นักบวชจดลงสมุด ตั้งแต่คืนนั้นของที่บ้านเคยทำตอนกลางวันย้ายไปทำตอนดึก เงียบกว่าเดิม เร็วกว่าเดิม ระวังกว่าเดิม

        ไม่นานก็รู้ว่าไม่ได้ทำอยู่บ้านเดียว คืนเดือนดับคืนหนึ่ง{name}เดินสวนกับคนข้างบ้านกลางทาง ต่างคนต่างถือของที่ไม่ควรถือตอนดึก ทั้งสองไม่ทักกัน แค่ยกคางให้กันนิดเดียวในความมืด
      effects: { world: { land: -1 }, reputation: { lamp_church: -1 }, alignment: { law: -1 }, flags: [kept_the_old_rites_by_night] }
    - id: keep_on_in_the_open
      label: ตอบว่าไม่เลิก แล้วทำต่อกลางวันให้ใครก็เห็น
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}บอกนักบวชว่าธรรมเนียมนี้มีมาก่อนวิหาร ก่อนเวรัสจะมีชื่อในถิ่นนี้ บอกโดยไม่ขึ้นเสียง นักบวชฟังจนจบ แล้วจดลงสมุดยาวกว่าบ้านอื่น ก่อนไปเขาบอกว่าแม่ของเขาก็เคยทำอย่างนี้

          ตั้งแต่นั้น{name}ทำของเดิมตอนกลางวันตามเคย คนผ่านไปผ่านมาเห็น บางคนหยุดดู บางคนทำตาม ไม่มีนักบวชมาเคาะประตูบ้านนี้อีก
        effects: { stats: { CHA: 1 }, flags: [kept_the_old_rites_in_the_open] }
      failure:
        text: |
          {name}ตอบว่าไม่เลิก เสียงดังกว่าที่ตั้งใจ คนในละแวกเปิดหน้าต่างออกมาฟัง นักบวชหนุ่มหน้าแดง จดลงสมุดด้วยลายมือที่หนักขึ้น แล้วเดินจากไปโดยไม่ขอบคุณ

          สัปดาห์ต่อมามีนักบวชสองคนมาแทน คนหนึ่งยืนดูอยู่หน้าบ้านทุกครั้งที่{name}ทำของเดิม ดูนิ่งๆ ไม่ห้าม ไม่พูด จนคนในละแวกเลิกแวะมาคุยหน้าบ้านนี้
        effects: { reputation: { lamp_church: -2 }, flags: [defied_the_edict_in_the_open] }
    - id: show_him_the_land_knows
      label: พานักบวชไปดูของที่แผ่นดินทำกับตัวเองตั้งแต่ถือธรรมเนียมมาทั้งชีวิต
      requires: { flag: land_boon_taken }
      text: |
        {name}ไม่ได้เถียง {name}พานักบวชไปที่ที่ข้อห้ามของบ้านผูกอยู่ แล้วทำของเดิมให้ดูต่อหน้า น้ำ ดิน ไฟ หินหรือป่าตรงนั้นทำอย่างที่ทำกับ{name}มาตลอดตั้งแต่เช้าวันนั้น ไม่มากไม่น้อยกว่าทุกวัน

        นักบวชยืนดูจนไส้ตะเกียงในมือสั้นลงไปข้อหนึ่ง ไม่จดอะไรลงสมุด ขากลับเขาถามเสียงเบาว่าทำอย่างไร {name}ตอบว่าไม่ได้ทำอะไร แค่ไม่เลิก เขาเดินไปบ้านถัดไปช้ากว่าตอนเดินมา
      effects: { world: { land: -1 }, flags: [showed_the_priest_what_the_land_does] }
