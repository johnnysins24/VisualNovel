# วัยรุ่น 12–13 เรื่องที่หลายชาติกำเนิดเจอได้ และเรื่องต่อจากวัยเด็ก
# ทุกตัวเลือกให้ lean_X หนึ่งทาง เรื่องที่เด็กวิหารเจอได้ห้ามใช้ {father} {mother}
# youth.narrow_toll เป็นเรื่องกลาง น้ำหนัก 6 ที่เหลือเป็นเรื่องต่อจาก flag วัยเด็ก น้ำหนัก 12

- id: youth.narrow_toll
  stage: youth
  weight: 6
  when:
    age: [12, 13]
    not_flags: [origin_elf_bough, origin_marked_hidden]
  text: |
    ทางกลับจากงานมีช่วงหนึ่งแคบจนเดินสวนกันไม่ได้ ปีนี้มีคนมายืนขวางช่วงนั้นทุกเย็น เป็นเด็กที่โตกว่า{name}สองปี ไหล่กว้างเกือบเท่าช่องทาง ชื่อจริงไม่มีใครเรียก ทุกคนเรียกว่าไอ้หมี

    เด็กที่ตัวเล็กกว่าต้องจ่ายค่าผ่าน เหรียญทองแดงหนึ่งเหรียญ ขนมปังครึ่งก้อน หรืออะไรก็ได้ที่อยู่ในกระเป๋า ใครไม่จ่ายก็ต้องเดินอ้อม ซึ่งไกลกว่าเดิมครึ่งชั่วยาม

    เย็นนี้ไอ้หมียื่นมือมาตรงหน้า{name} แล้วหันไปยิ้มให้เพื่อนสองคนที่ยืนพิงอยู่ข้างหลัง
  choices:
    - id: shoulder_past
      label: ปัดมือทิ้ง แล้วเดินชนไหล่ผ่านไป
      check: { stat: STR, dc: 13 }
      success:
        text: |
          ไอ้หมีเซถอยไปชนเพื่อนตัวเอง สองคนล้มทับกันอยู่ตรงนั้น {name}เดินผ่านไปโดยไม่หันกลับไปดู หัวใจเต้นดังจนได้ยินในหู มือสั่นไปจนถึงบ้าน

          วันรุ่งขึ้นช่วงทางแคบว่าง ไอ้หมีย้ายไปยืนขวางทางอีกช่วงหนึ่ง ไกลออกไป ช่วงที่{name}ไม่ต้องเดินผ่าน
        effects: { stats: { STR: 1 }, flags: [lean_warrior, faced_toll_bully] }
      failure:
        text: |
          ไหล่ของไอ้หมีแข็งเหมือนเสาบ้าน {name}กระเด็นกลับมาเอง ยังไม่ทันตั้งหลัก หมัดแรกก็มาถึงท้อง หมัดที่สองโดนปาก ไอ้หมีล้วงกระเป๋า{name}เอาของไปตามเคย แล้วหลีกทางให้เดินต่อ

          สามวันต่อมา{name}กลับไปยืนอยู่หน้าช่องทางแคบอีก ปากยังบวม
        effects: { stats: { CON: 1 }, hp: -1, flags: [lean_warrior] }
    - id: pick_pouch
      label: ยื่นเหรียญให้ แล้วล้วงถุงเงินที่เอวมันตอนมันก้มนับ
      habit: light_fingers
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          ไอ้หมีชอบนับเหรียญต่อหน้าคนจ่าย นับทีละเหรียญช้าๆ ให้เพื่อนข้างหลังได้ยินเสียง ระหว่างที่มันนับ ถุงหนังที่เอวมันก็ย้ายมาอยู่ในแขนเสื้อ{name}

          ในถุงมีเหรียญทองแดงเก้าเหรียญ {name}คืนให้เด็กที่จำหน้าได้ไปห้าเหรียญ ทีละคน ไม่บอกว่ามาจากไหน ที่เหลือเก็บไว้เอง
        effects: { stats: { DEX: 1 }, gold: 4, flags: [lean_rogue, picked_toll_bully] }
      failure:
        text: |
          นิ้วยังไม่ทันพ้นปากถุง ข้อมือ{name}ก็อยู่ในกำมือไอ้หมีแล้ว มันบิดจนต้องคุกเข่า แล้วหัวเราะออกมาเสียงดัง

          "มือไวดีนี่" มันว่า "พรุ่งนี้มายืนกับข้า ล้วงคนที่ไม่ยอมจ่าย"

          {name}ไม่ได้ไปยืนกับมัน แต่ข้อมือช้ำอยู่ครึ่งเดือน ทุกครั้งที่หยิบอะไรก็นึกถึงประโยคนั้น
        effects: { stats: { DEX: 1 }, hp: -1, flags: [lean_rogue] }
    - id: price_list
      label: ประกาศเสียงดังให้เด็กที่รอผ่านได้ยิน ว่าแมวต้องจ่ายเท่าไหร่
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          เด็กทุกคนที่ยืนรออยู่รู้เรื่องที่ไอ้หมีโดนแมวข่วนจนร้องไห้กลางตลาดเมื่อสามปีก่อน {name}ถามด้วยเสียงที่ดังพอให้คนท้ายแถวได้ยิน ว่าแมวผ่านไม่ต้องจ่ายหรือเปล่า หรือต้องจ่ายเป็นปลา

          เพื่อนสองคนของไอ้หมีหลุดหัวเราะออกมาก่อนใคร ไอ้หมีหันไปดูเพื่อน แล้วก็ไม่รู้จะหันกลับมาทางไหน เด็กที่รออยู่เดินผ่านไปทีละคนสองคนโดยไม่มีใครจ่าย

          เดือนต่อมาเด็กแถวนั้นเรียกช่องทางแคบว่าทางแมว ไอ้หมีไม่มายืนอีก
        effects: { stats: { CHA: 1 }, flags: [lean_bard, named_cat_path] }
      failure:
        text: |
          ไม่มีใครหัวเราะ มีเด็กคนหนึ่งท้ายแถวหัวเราะออกมาทีหลัง ช้าไปสองอึดใจ แล้วรีบเอามือปิดปาก

          ไอ้หมีคว้าคอเสื้อ{name}ยกขึ้นจนปลายเท้าพ้นพื้น จ้องหน้าอยู่ครู่หนึ่ง แล้วปล่อยลงเฉยๆ ไม่ตี ไม่เอาอะไรไป ตลอดปีนั้น{name}เดินทางอ้อมทุกวัน เดินจนจำได้ทุกหลุมบนทาง
        effects: { stats: { WIS: 1 }, flags: [lean_bard] }

- id: youth.bard_returns
  stage: youth
  weight: 12
  when:
    age: [12, 13]
    flags: [knows_heroes_song]
  text: |
    กวีเร่คนเดิมกลับมา เสื้อคลุมที่เคยแดงซีดตอนนี้กลายเป็นสีชมพูไปทั้งผืน พิณเหลือสี่สาย เขาตั้งเก้าอี้ที่เดิม ร้องเพลงผู้กล้าหกคนเพลงเดิม พอถึงท่อนซ้ำก็หยุดร้อง เหลือแต่เสียงพิณ แล้วหันมาทางคนมุงเหมือนรู้ว่ามีใครบางคนในนั้นร้องต่อได้

    {name}ร้องต่อ ลืมเนื้อไปคำหนึ่ง แต่ร้องจนจบท่อน

    ตกค่ำเขาเรียก{name}ไปนั่งด้วย บอกว่าจะอยู่อีกสามวัน ระหว่างที่พูด เขาไอจนต้องวางพิณ ผ้าเช็ดปากที่เก็บกลับเข้ากระเป๋ามีจุดแดงติดอยู่ เขาพับด้านนั้นเข้าข้างในก่อนใครจะเห็น แต่ช้าไปนิดหนึ่ง
  choices:
    - id: sing_duet
      label: ขอร้องคู่กับเขาทั้งสามวัน แบ่งเงินในหมวกคนละครึ่ง
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          สามวันนั้นหมวกเต็มเร็วกว่าที่เขาเคยเก็บได้คนเดียว เขาสอนให้{name}ร้องท่อนสูงด้วยเสียงต่ำ ในวันที่เสียงยังขึ้นไม่ถึง สอนให้หายใจตรงท้อง ไม่ใช่ตรงคอ สอนว่าเวลาลืมเนื้อ ให้ร้องชื่อคนที่ยืนฟังแทน คนฟังจะไม่ว่า

          คืนสุดท้ายเขาแบ่งเงินครึ่งหนึ่งให้จริงๆ นับให้ดูต่อหน้า แล้วบอกว่าปลายปีหน้าจะผ่านมาอีก ถ้าตอนนั้นยังอยากร้อง ให้มายืนรอที่เดิม
        effects: { stats: { CHA: 1 }, gold: 3, flags: [lean_bard, bard_duet] }
      failure:
        text: |
          คืนแรก{name}ลืมเนื้อกลางท่อนที่คนฟังรอ ยืนอ้าปากค้างอยู่หน้าคนมุง คนมุงหัวเราะกันทั้งวง กวีเร่ไม่หยุดดีด เขาเปลี่ยนจังหวะนิดหนึ่ง แล้วร้องต่อเป็นเพลงเรื่องเด็กลืมเนื้อ จนเสียงหัวเราะกลายเป็นส่วนหนึ่งของเพลง

          อีกสองวันที่เหลือ{name}ถือหมวกให้เขาอย่างเดียว เขาก็ยังแบ่งเงินให้
        effects: { stats: { WIS: 1 }, gold: 1, flags: [lean_bard] }
    - id: read_marks
      label: ขอดูสมุดที่เขาขีดเส้นอะไรไว้ทุกคืน
      habit: curious
      check: { stat: INT, dc: 12 }
      success:
        text: |
          ในสมุดมีแต่เส้นขีดกับจุด เส้นสูงต่ำไม่เท่ากัน บางจุดทึบ บางจุดกลวง {name}ไล่นิ้วตามเส้นแถวหนึ่ง ฮัมตามความสูงของเส้น ยาวตามความยาวของจุด ได้ทำนองที่ไม่เคยได้ยินมาก่อน

          กวีเร่หยุดเคี้ยวขนมปัง เขาบอกว่าเพลงนั้นเขาไม่ได้ร้องมาสิบปีแล้ว เพราะไม่มีใครอยากฟัง เขาเรียนวิธีขีดแบบนี้มาจากหญิงแก่คนหนึ่งที่ศาลทาลิส ใช้เวลาสองหน้าหนาว "ใครอ่านขีดพวกนี้ออกในคืนเดียว" เขาว่า "อ่านอะไรก็ออก"
        effects: { stats: { INT: 1 }, flags: [lean_wizard, reads_song_marks] }
      failure:
        text: |
          เส้นขีดกับจุดไม่ยอมเป็นอะไรสักอย่าง กวีเร่หัวเราะ ฉีกหน้าสุดท้ายของสมุดให้{name}เก็บไว้หน้าหนึ่ง

          {name}พกกระดาษแผ่นนั้นไว้ทั้งหน้าหนาว เอาออกมาดูทุกคืนก่อนนอน คืนหนึ่งปลายหนาว ทำนองก็ออกมาเองในคอ เป็นเพลงกล่อมเด็ก
        effects: { stats: { INT: 1 }, flags: [lean_wizard] }
    - id: nurse_bard
      label: คืนนั้นตามไปดู แล้วอยู่เฝ้าไข้เขาจนเขาลุกได้
      habit: soft_heart
      text: |
        กวีเร่นอนอยู่ที่นอนท้ายโรงเตี๊ยม เจ้าของให้อาศัยโดยไม่คิดเงิน ตัวร้อนเหมือนเตา {name}ไปขอน้ำร้อนจากบ้านใกล้ๆ ไปหายาแก้ไอจากคนที่มีขาย เงินไม่พอซื้อก็ขอเอา เช็ดตัวให้ทุกครั้งที่เหงื่อออก

        สามคืนนั้นเขาละเมอเป็นเพลง เพลงที่ไม่มีใครเคยได้ยิน บางเพลงเป็นภาษาที่ฟังไม่ออก เช้าวันที่สี่ไข้ลด เขาลุกขึ้นนั่งได้ ขอขนมปัง แล้วถามว่าคืนที่ผ่านมาเขาร้องอะไรบ้าง {name}บอกว่าจำไม่ได้ เขาดูโล่งใจ
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [lean_cleric, nursed_bard] }

- id: youth.hook_father
  stage: youth
  weight: 12
  when:
    age: [12, 13]
    flags: [father_iron_arm]
  text: |
    สายหนังที่รัดขอเหล็กของ{father}ขึ้นไปถึงไหล่เปื่อยจนต้องผูกเชือกต่อ ปีนี้งานที่มีให้คนแขนเดียวน้อยลงอีก ทหารผ่านศึกสงครามถ่านยังกลับมาไม่หมด แต่งานหมดก่อนแล้ว

    ต้นปี บริษัทขนถ่านประกาศรับยามคุมเกวียน ขอคนที่เคยจับอาวุธ {father}ไปสมัคร หัวหน้ายามดูขอเหล็กก่อนดูหน้า แล้วบอกว่ารับ ถ้ามีคนขนกระสอบให้อีกแรง ค่าแรงสองคนเท่าคนเดียว

    คืนนั้น{father}ไม่กลับบ้าน ไปนั่งที่โรงเตี๊ยมกับทหารผ่านศึกคนอื่น
  choices:
    - id: second_arm
      label: ไปบอกพ่อว่าจะเป็นอีกแรงให้บนเกวียนถ่าน
      check: { stat: STR, dc: 12 }
      success:
        text: |
          กระสอบถ่านมารหนักกว่าตัว{name} ต้องลากขึ้นเกวียนทีละครึ่งกระสอบ เดือนแรกไหล่ถลอกจนนอนตะแคงไม่ได้ เดือนที่สามยกได้ทั้งกระสอบ

          คืนหนึ่งที่ลานพักเกวียน มีคนแอบมาตักถ่านใส่ถุง {father}ไม่ได้ลุกจากกองไฟด้วยซ้ำ ขอเหล็กเกี่ยวคอเสื้อคนนั้นไว้ตั้งแต่ถุงยังไม่เต็ม {name}ถือตะเกียงส่องหน้าโจร เป็นเด็กอายุพอๆ กัน {father}ปล่อยมันไป แล้วบอกหัวหน้ายามว่าไม่เห็นใคร

          ปลายปีหัวหน้ายามเพิ่มค่าแรงให้{name}อีกครึ่ง
        effects: { stats: { STR: 1 }, gold: 3, flags: [lean_warrior, coal_cart_with_father] }
      failure:
        text: |
          เที่ยวที่สอง กระสอบหลุดมือ{name}ตกจากท้ายเกวียน ป่านปริ ถ่านมารกระจายไปทั่วทาง แดงอยู่บนดินเหมือนตาสัตว์ หัวหน้ายามหักค่าแรงทั้งเที่ยว

          {father}เก็บถ่านทีละก้อนด้วยขอเหล็ก ไม่ให้{name}ใช้มือจับ จนครบทุกก้อน แล้วแบกกระสอบใหม่ขึ้นเกวียนเองด้วยไหล่ข้างที่เหลือแขน
        effects: { stats: { STR: 1 }, gold: 1, flags: [lean_warrior] }
    - id: fix_hook
      label: รื้อสายหนังกับขอเหล็กออกมาทำใหม่ ให้พ่อใส่เองได้ด้วยมือเดียว
      habit: craft_hands
      check: { stat: INT, dc: 12 }
      success:
        text: |
          {name}ขอซากนาฬิกาเก่าจากร้านซ่อม แกะเอาสปริงออกมาหนึ่งขด ใช้เวลาครึ่งเดือนทำหัวเข็มขัดที่ดันเข้าแล้วขัดสลักเอง ดึงลงแล้วปลดเอง

          เช้าวันที่ลองใส่ {father}สอดแขนเข้าไป ดันไหล่ทีหนึ่ง เสียงดังแกร๊ก สายหนังรัดแน่นเอง เขาลองดึงอีกทีหนึ่ง แล้วดันกลับเข้าไปใหม่ ทำซ้ำอยู่อย่างนั้นอีกหลายรอบ ครั้งแรกในรอบหลายปีที่เขาใส่แขนเองได้โดยไม่ต้องเรียกใคร

          วันนั้นเขาไปบอกหัวหน้ายามว่าไม่ต้องมีอีกแรงแล้ว
        effects: { stats: { INT: 1 }, flags: [lean_wizard, fixed_father_hook] }
      failure:
        text: |
          หัวเข็มขัดใหม่ใช้ได้สามวัน วันที่สี่สปริงดีดออกตอน{father}ยกถังน้ำขึ้นจากบ่อ ขอเหล็กหลุดตกบ่อไปพร้อมถัง

          สองพ่อลูกช่วยกันตกขอขึ้นมาด้วยตะขอเกี่ยวถังจนมืด ได้ขึ้นมาตอนตะเกียงจะหมดน้ำมัน {father}ถือขอเปียกๆ ไว้ในมือซ้าย ส่งหัวเข็มขัดคืนให้{name} บอกว่าสปริงอ่อนไปขดหนึ่ง
        effects: { stats: { INT: 1 }, flags: [lean_wizard] }
    - id: sing_home
      label: ไปตามพ่อที่โรงเตี๊ยม แล้วร้องเพลงเดินทัพนำกลับบ้าน
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          ทหารผ่านศึกหกคนนั่งรวมโต๊ะเดียว ทุกคนมีเหล็กอยู่ตรงไหนสักแห่งบนตัว {name}ยืนที่ประตู ร้องเพลงเดินทัพที่เด็กแถวนั้นร้องล้อทหารตอนเกณฑ์ ร้องอย่างที่ทหารร้อง ไม่ใช่อย่างที่เด็กร้องล้อ

          ถึงท่อนที่สอง ชายขาเหล็กคนหนึ่งเคาะโต๊ะตามจังหวะ ท่อนที่สามร้องกันทั้งโต๊ะ {father}ลุกขึ้นเดินตามลูกออกมา ปากยังร้องไม่จบเพลง แล้วร้องต่อไปตลอดทางกลับบ้าน ถึงหน้าประตูก็หยุด บอกว่าพรุ่งนี้จะไปคุยกับหัวหน้ายามอีกที
        effects: { stats: { CHA: 1 }, flags: [lean_bard, sang_father_home] }
      failure:
        text: |
          ทั้งโต๊ะหันมามอง ไม่มีใครร้องตาม ชายแขนเหล็กคนหนึ่งโยนเหรียญทองแดงมาให้เหมือนโยนให้ขอทาน เหรียญกลิ้งไปหยุดที่ปลายเท้า{name}

          {father}ลุกขึ้นเก็บเหรียญนั้น วางคืนบนโต๊ะคนโยน แล้วเดินออกมาโดยไม่บอกลาใคร สองพ่อลูกเดินกลับบ้านด้วยกัน ไม่มีใครเอ่ยถึงเพลงอีก
        effects: { stats: { WIS: 1 }, flags: [lean_bard] }

- id: youth.witch_book_pages
  stage: youth
  weight: 12
  when:
    age: [12, 13]
    flags: [witch_book]
  text: |
    สมุดของยายเนเรสอยู่ใต้แผ่นกระดานแผ่นที่สามนับจากผนังมาหลายปี {name}เปิดอ่านได้แค่คืนที่คนอื่นหลับหมดแล้ว อ่านจนจำได้เกือบทุกหน้า ยาแก้ไอ ยาทาแผลไฟลวก ยาที่ผู้หญิงมาขอกันตอนกลางคืน ทุกสูตรบอกไว้ว่าต้มกี่น้ำ เก็บได้กี่วัน และคนแบบไหนห้ามกิน

    สิบหน้าสุดท้ายเป็นลายมือเดียวกัน แต่อ่านไม่ออกทั้งหน้า

    ปีนี้ข่าวมาถึงว่ายายเนเรสจะไม่ได้กลับมาแล้ว หน้าหนาวปีเดียวกัน เด็กเล็กแถวนั้นไอกันทั้งละแวก ไม่มีใครรู้ว่าจะไปเอายาแก้ไอจากที่ไหน
  choices:
    - id: mirror_pages
      label: เอาเศษกระจกมาส่องสิบหน้าสุดท้าย
      habit: curious
      check: { stat: INT, dc: 12 }
      success:
        text: |
          ตัวหนังสือกลับด้านทั้งหมด พอส่องเศษกระจก ก็กลายเป็นคำที่อ่านออก แต่ไม่ใช่สูตรยา เป็นถ้อยคำสั้นๆ ให้พูดใส่ถ้วยน้ำ ขอบกระดาษจดไว้ด้วยลายมือที่หวัดกว่า ใช้ได้ ปวดหัวสองวัน

          {name}ลองอันที่สั้นที่สุด พูดใส่ถ้วยน้ำบนขอบหน้าต่างตอนลมพัดแรง ผิวน้ำในถ้วยนิ่งสนิท ในขณะที่ผ้าม่านข้างๆ ยังสะบัด เลือดกำเดาหยดลงในถ้วยสองหยด ผิวน้ำก็ยังนิ่ง
        effects: { stats: { INT: 1 }, hp: -1, flags: [lean_wizard, read_mirror_pages] }
      failure:
        text: |
          ตัวหนังสือกลับด้านในกระจกก็ยังเป็นตัวหนังสือที่อ่านไม่ออก {name}ลอกออกมาใส่กระดาษอีกแผ่นทีละตัว ออกเสียงตามที่เดาเอา ไม่มีอะไรเกิดขึ้น

          เช้ามาปวดหัวจนต้องนอนต่อถึงเที่ยง ขอบกระดาษเขียนไว้ว่าใช้ได้แล้วปวดหัวสองวัน {name}ปวดแค่ครึ่งวัน
        effects: { stats: { INT: 1 }, flags: [lean_wizard] }
    - id: brew_remedy
      label: ต้มยาแก้ไอตามสูตรของยาย แจกเด็กที่ไอ
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          สูตรต้องใช้น้ำผึ้ง หอมแดง กับรากขมชนิดหนึ่งที่ขึ้นริมคูน้ำ {name}ขุดรากมาล้าง ต้มจนเหลือครึ่งหม้อตอนดึก แบ่งใส่ขวดยาเก่าที่เก็บจากกองขยะ เอาไปวางไว้หน้าบ้านที่มีเสียงไอ

          ครึ่งเดือนต่อมาเสียงไอในละแวกเบาลง แล้วก็มีคนมาเคาะประตูหลังตอนกลางคืน เป็นผู้หญิงที่{name}ไม่รู้จักชื่อ เธอยื่นเหรียญทองแดงให้หนึ่งเหรียญ ขอยาแบบเดียวกัน แล้วถามเบาๆ ว่าสมุดเล่มนั้นยังอยู่หรือเปล่า
        effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [lean_cleric, brews_neres_remedy] }
      failure:
        text: |
          รากขมที่ขุดมาผิดต้น เด็กสองคนที่กินเข้าไปอาเจียนทั้งคืน แม่ของเด็กคนหนึ่งเอาขวดยามาวางคืนที่หน้าประตู{name}ตอนเช้า ไม่เคาะ ไม่เรียก

          เด็กทั้งสองหายไอในสัปดาห์นั้นเอง แต่ไม่มีใครกล้ามาขออีก
        effects: { stats: { WIS: 1 }, flags: [lean_cleric] }
    - id: sell_book
      label: เอาไปขายพ่อค้าเร่ที่รับซื้อของโดยไม่ถามที่มา
      requires: { not_traits: [curious] }
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          พ่อค้าเร่พลิกสมุดเร็วๆ ทีละหน้าเหมือนคนนับเงิน แล้วมาหยุดที่สิบหน้าสุดท้าย เขาพลิกช้าลง ปิดสมุด แล้วถามราคา

          {name}บอกราคาสองเท่าของที่ตั้งใจไว้ พ่อค้าจ่ายโดยไม่ต่อสักคำ แล้วถามว่ายังมีเล่มอื่นอีกไหม ตอนเขาเดินลับไปไกลแล้ว {name}เพิ่งนึกได้ว่าน่าจะบอกราคาสามเท่า
        effects: { stats: { CHA: 1 }, gold: 8, clear_flags: [witch_book], flags: [lean_rogue, sold_witch_book] }
      failure:
        text: |
          พ่อค้าเร่บอกว่าสมุดสูตรยาของแม่มดขายได้แค่เป็นกระดาษห่อของ ให้สองเหรียญ ไม่ให้มากกว่านั้น {name}รับไว้ เพราะเก็บไว้ก็กลัว

          อีกเดือนหนึ่ง{name}เห็นพ่อค้าคนนั้นยืนคุยกับชายเสื้อขาวคนหนึ่งที่ตลาด ชายคนนั้นถือสมุดปกดำไว้ในมือ
        effects: { stats: { CHA: 1 }, gold: 2, clear_flags: [witch_book], flags: [lean_rogue, sold_witch_book] }

- id: youth.crossroads_again
  stage: youth
  weight: 12
  when:
    age: [12, 13]
    flags: [origin_farm, saved_crossroads_baby]
  text: |
    ปีนี้{name}ต้องออกไปทุ่งฝั่งเหนือตั้งแต่ก่อนไก่ขันทุกวัน ทางลัดที่ใกล้ที่สุดคือทางสามแพร่งหลังโรงสี

    เช้าวันหนึ่งปลายหนาว ตะกร้าหวายวางอยู่กลางทางแยกอีก ผ้าข้างในขยับนิดหนึ่ง ข้างตะกร้ามีรอยเท้าผู้ใหญ่เดินกลับไปทางหมู่บ้าน รอยเดียว ขนาดเท่ารอยเมื่อหลายปีก่อน ส้นข้างซ้ายสึกเหมือนกัน

    เด็กในตะกร้ายังร้องได้ ร้องเสียงดังกว่าคนก่อน
  choices:
    - id: carry_inside
      label: อุ้มไปวิหารอีเซลอีกครั้ง
      habit: soft_heart
      text: |
        ช่องส่งขนมปังเปิดออก แม่ชีคนเดิมจำ{name}ได้ คราวนี้เธอไม่รับตะกร้าผ่านช่อง แต่เดินออกมาเปิดประตูข้างให้เข้าไปข้างใน

        ห้องเด็กของวิหารยาวเหมือนโรงนา เตียงไม้เรียงสองแถว เด็กมีเขาหลายสิบคนกำลังกินข้าวต้มอยู่ แม่ชีชี้ไปที่เด็กหญิงตัวเล็กคนหนึ่ง ตอเขาเพิ่งพ้นผม เธอบอกชื่อที่วิหารตั้งให้ ชื่อตามฟ้าเช้าวันที่{name}อุ้มมาส่ง

        เด็กคนนั้นไม่รู้ว่า{name}เป็นใคร มองแล้วก็ก้มหน้ากินต่อ
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [lean_cleric, saw_temple_children] }
    - id: follow_print
      label: ห่อเด็กไว้ในเสื้อ แล้วเดินตามรอยเท้านั้นกลับเข้าหมู่บ้าน
      habit: hunter_eye
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          รอยส้นสึกเดินเลี่ยงถนนใหญ่ ลัดคันนา อ้อมหลังโรงสี ข้ามรั้วไม้ตรงที่ไม้ผุ ไปหยุดที่ประตูหลังของบ้านหลังหนึ่ง บ้านที่{name}เดินผ่านทุกวัน รองเท้าคู่หนึ่งวางอยู่ข้างประตู ยังเปื้อนโคลนจากทางสามแพร่ง

          {name}ยืนอยู่ตรงนั้นจนเด็กในเสื้อเริ่มร้องอีก แล้วหันหลังเดินไปวิหาร ตลอดปีนั้นทุกครั้งที่เจอคนบ้านนั้นที่บ่อน้ำ {name}ก็ทักเหมือนทุกวัน คนบ้านนั้นก็ทักตอบเหมือนทุกวัน
        effects: { stats: { WIS: 1 }, flags: [lean_ranger, knows_crossroads_mother] }
      failure:
        text: |
          รอยเท้าไปขาดที่ทางเกวียน ร่องล้อลึกจนกลืนรอยทุกรอย {name}เดินขึ้นลงตามทางเกวียนจนเด็กในเสื้อเงียบไป

          {name}วิ่งไปวิหาร ไปถึงตอนสาย แม่ชีรับเด็กไปแล้วยังไม่ทันปิดช่อง เด็กก็ร้องขึ้นมาอีก
        effects: { stats: { WIS: 1 }, flags: [lean_ranger] }
    - id: ask_rosa
      label: อุ้มไปหาป้าโรเสน คนเลี้ยงห่านที่ไม่มีลูก
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ป้าโรเสนเปิดประตูออกมา มือยังถือไม้ไล่ห่าน ฟัง{name}พูดอยู่ที่ธรณีประตูจนจบ ไม่เชิญเข้าบ้าน ไม่ปิดประตู แล้วยื่นมือมารับตะกร้า

          เดือนต่อมาคนทั้งหมู่บ้านรู้ว่าบ้านป้าโรเสนมีเด็ก ป้าถักหมวกไหมพรมใบเล็กให้ใส่ทุกวัน ไม่ว่าแดดจะร้อนแค่ไหน ใครถามป้าก็ตอบว่าหลานจากหมู่บ้านอื่น ใครถามซ้ำ ป้าก็ยกไม้ไล่ห่านขึ้นมา
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [lean_bard, crossroads_baby_kept] }
      failure:
        text: |
          ป้าโรเสนฟังได้ครึ่งเดียวก็ส่ายหน้า "ข้าแก่แล้ว" ป้าว่า "อีกสิบปีข้าก็ตาย แล้วมันจะอยู่กับใคร" แล้วปิดประตู

          {name}อุ้มตะกร้าวิ่งไปวิหาร ไปถึงตอนเกือบเที่ยง ระหว่างทาง{name}คิดคำพูดใหม่ได้สามแบบ ทุกแบบดีกว่าแบบที่พูดไป
        effects: { stats: { CHA: 1 }, flags: [lean_bard] }

- id: youth.dock_rats_tin
  stage: youth
  weight: 12
  when:
    age: [12, 13]
    flags: [dock_rats_contact]
  text: |
    ชายหน้าเรียบคนนั้นจากท่าเรือมายืนรออยู่ตรงประตูหลังโรงกลั่นตอนเลิกกะ ยังจำชื่อ{name}ได้ เขายื่นกล่องดีบุกขนาดเท่าก้อนอิฐให้ใบหนึ่ง ฝาผนึกด้วยขี้ผึ้ง

    "ส่งให้คนที่ท่าเจ็ด ก่อนเที่ยงคืน" เขาว่า "สี่เหรียญ ห้ามเปิด"

    ใครในย่านริมแม่น้ำก็รู้ว่าของของหนูท่าที่ข้ามสะพานตอนกลางคืน มักไปไม่ถึงอีกฝั่ง เพราะคนอีกพวกชอบไปยืนรอที่กลางสะพาน
  choices:
    - id: by_roofs
      label: ไม่ข้ามสะพาน ไต่หลังคาไปลงเรือข้ามฟากที่ท่าล่าง
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          ตั้งแต่เด็ก{name}ปีนหลังคาย่านนี้เล่นจนรู้ทุกแผ่น รู้ว่าแผ่นไหนเหยียบได้ แผ่นไหนเหยียบแล้วเจ้าของบ้านตื่น ไต่ไปจนถึงหลังคาสุดท้ายริมน้ำ ไถลลงตามรางน้ำฝน ทันเรือข้ามฟากเที่ยวสุดท้าย

          คนที่ท่าเจ็ดรับกล่องไป เคาะฝาสองที แล้วจ่ายห้าเหรียญแทนสี่ บอกว่าเหรียญที่ห้าเป็นค่าไม่ข้ามสะพาน
        effects: { stats: { DEX: 1 }, gold: 5, reputation: { dock_rats: 1 }, flags: [lean_rogue, dock_rats_courier] }
      failure:
        text: |
          มีแมวนอนอยู่บนสันหลังคาหลังที่สาม มันกระโจนหนีตอน{name}ก้าวข้าม {name}เสียหลัก ไถลลงไปครึ่งหลังคาก่อนจะเกาะรางน้ำได้ กล่องหลุดจากมือ ตกลงไปในตรอกข้างล่าง

          {name}ลงไปเก็บได้ทันก่อนใคร ฝาขี้ผึ้งร้าวหนึ่งเส้น คนที่ท่าเจ็ดเห็นรอยร้าวก็ส่ายหัว ส่งเหรียญมาให้สองเหรียญ
        effects: { stats: { DEX: 1 }, hp: -1, gold: 2, flags: [lean_rogue] }
    - id: open_tin
      label: แกะฝาขี้ผึ้งดูก่อนว่าข้างในคืออะไร
      check: { stat: INT, dc: 12 }
      success:
        text: |
          ข้างในเป็นขดแก้วจากหม้อกลั่น ขดเดียว ห่อผ้าสักหลาดไว้หลายชั้น ผ้าชั้นในควรจะเปียก แต่แห้งไปครึ่งหนึ่งแล้ว ขดแก้วตรงที่ผ้าแห้งอุ่นขึ้นมาเรื่อยๆ {name}เคยเห็นขดแก้วที่อุ่นแบบนี้ในโรงกลั่น อีกไม่ถึงชั่วยามมันจะร้าว

          {name}เอาผ้าไปชุบน้ำจากรางน้ำ ห่อใหม่ทีละชั้น แล้วหยดขี้ผึ้งเทียนปิดฝาคืน คนที่ท่าเจ็ดเปิดกล่องดูต่อหน้า จับผ้าชั้นใน แล้วเงยหน้าขึ้น

          "เปิดดูแล้วสินะ" เขาว่า แล้วจ่ายหกเหรียญ บอกให้ไปบอกชายหน้าเรียบด้วยว่ากล่องเกือบพังเพราะใครห่อ
        effects: { stats: { INT: 1 }, gold: 6, reputation: { dock_rats: 1 }, flags: [lean_wizard, knows_stolen_coils] }
      failure:
        text: |
          ฝาเปิดออก ลมเย็นจากแม่น้ำพัดเข้าไปถึงผ้าชั้นใน ขดแก้วดังเปาะเบาๆ แล้วมีรอยร้าวเส้นหนึ่งวิ่งไปตามเกลียว

          ชายหน้าเรียบไม่โกรธ เขาบอกตัวเลขหนึ่งตัวให้{name}ฟังครั้งเดียว แล้วบอกว่าไม่ต้องรีบใช้ หนูท่าไม่เคยรีบ
        effects: { stats: { INT: 1 }, flags: [lean_wizard, dock_rats_debt] }
    - id: cross_bridge
      label: เดินข้ามสะพานตรงๆ ถ้ามีใครขวาง ก็สู้
      check: { stat: STR, dc: 13 }
      success:
        text: |
          กลางสะพานมีสองคนยืนรออยู่จริง คนหนึ่งยื่นมือมาคว้ากล่อง {name}กอดกล่องไว้แนบอก เอาไหล่พุ่งชนคนนั้นเต็มแรงจนเซไปกระแทกราวสะพาน แล้วเตะเข่าอีกคนที่เข้ามาจากด้านข้าง ทั้งสองคนไม่ได้คิดว่าเด็กตัวแค่นี้จะสู้ จึงถอยไปตั้งหลักนานพอให้{name}วิ่งพ้นหัวสะพาน

          คนที่ท่าเจ็ดได้ยินเรื่องก่อน{name}จะไปถึง เขาจ่ายครบสี่เหรียญ แล้วถามว่าปีหน้าอยากทำงานยามท่าไหม
        effects: { stats: { STR: 1 }, gold: 4, reputation: { dock_rats: 1 }, flags: [lean_warrior, fought_on_bridge] }
