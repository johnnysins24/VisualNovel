          กล่องยังอยู่ ฝายังไม่แตก คนที่ท่าเจ็ดรับกล่องไป มองหน้า{name}ที่บวมไปครึ่งซีก แล้วจ่ายสี่เหรียญครบ ไม่หักแม้แต่เหรียญเดียว
        effects: { stats: { CON: 1 }, hp: -2, gold: 4, flags: [lean_warrior] }
