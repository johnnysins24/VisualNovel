# ชุด 3b–3c วัยผู้ใหญ่ อายุ 25 ถึง 40: เหตุการณ์ประจำงานสายพรานและกวี งานละ 2 เรื่อง
# เรื่องแรก (25–32) ชื่อเสียงและหนี้ เรื่องที่สอง (33–40) ฟ้าที่เปลี่ยนไป น้ำหนัก 45 ไม่ผูกปี
# สายนี้ไม่มีจุดตาย สัตว์ฝั่งดาว (เงาเกิน) ไม่เห็นคนมีเขา ใบ้ไว้ในตัวเลือกของคนมีเขาเท่านั้น ไม่เฉลย
# เปลี่ยนงานกลางทาง (26–31 น้ำหนัก 15) อยู่ท้ายไฟล์ นักร้องบ้านขุนนางไม่รับคนมีเขาเว้นเลื่อยเขาแล้ว ตาม L14

- id: adult.mid_bounty_shadow
  stage: adult
  weight: 45
  when:
    age: [25, 32]
    flags: [job_bounty_hunter]
  text: |
    ทุกวันนี้ประกาศค่าหัวบางแผ่นบนกระดานในโรงเตี๊ยมเขียนชื่อ{name}ไว้ตรงหัวกระดาษ ไม่ได้ปล่อยให้ใครก็ได้มาฉีก คนติดประกาศจำได้ว่าใครรับงานแล้วกลับมาเก็บเงิน และใครรับแล้วไม่กลับมา

    แผ่นล่าสุดส่งมาจากสมาคมโรงกลั่นในเวนทราส ค่าหัวสิบสองเหรียญ ลานจานรับดาวหลังโรงกลั่นเบอร์เก้ามีของเดินอยู่ทุกคืนที่ฟ้าเปิด คนเฝ้าจานสองคนเลิกงานไปแล้ว คนที่สามนอนอยู่ห้องหมอ ซี่โครงหักสามซี่ เขาเล่าว่าคืนนั้นยืนอยู่ใต้ดาวดวงใหม่ แล้วเงาของเขามีสองเงา เงาหนึ่งลุกขึ้นยืน

    ยามของโรงกลั่นยิงปืนเวทใส่มันจนหลอดหมดไปครึ่งลัง แสงฟ้าทะลุตัวมันไปเหมือนทะลุควัน ยามอีกคนฟันดาบลงไปเต็มแรง ใบดาบผ่านตัวมันไปโดยไม่ติดอะไรเลย
  choices:
    - id: ring_of_fire
      label: ปักคบไฟน้ำมันล้อมลานไว้ไม่จุด แล้วยืนเป็นเหยื่อเองกลางวง
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ใช้เวลาครึ่งวันดูว่าแสงดาวดวงใหม่ตกลงตรงไหนของลานตอนเที่ยงคืน แล้วปักคบไฟน้ำมันเป็นวงรอบจุดนั้นยี่สิบอัน {name}ยืนอยู่กลางวง พอเงาที่สองลุกขึ้นจากพื้นข้างเท้า คนงานกะดึกห้าคนที่สมาคมส่งมาช่วยก็จุดคบไฟพร้อมกัน

          เงานั้นหดลงทุกครั้งที่ไฟสว่างขึ้นอีกดวง หดจนเหลือเท่าเงาแมว แล้วเป็นแค่รอยดำบนลานหิน ขัดไม่ออก สมาคมโรงกลั่นจ่ายสิบสองเหรียญ ยามคนที่ฟันดาบผ่านมันเอาปืนยาวลำกล้องเกลียวของเขามาให้ บอกว่าเขาเลิกเป็นยามแล้ว
        effects: { stats: { INT: 1 }, gold: 12, items: [hunter_long_rifle], flags: [killed_extra_shadow] }
      failure:
        text: |
          คนงานคนหนึ่งจุดคบไฟช้าไปจังหวะเดียว ช่องว่างในวงไฟกว้างพอให้เงานั้นไหลออกไปได้ มันผ่านตัว{name}ไปตอนออก เย็นเหมือนน้ำในบ่อลึก ซี่โครงซ้ายของ{name}ร้าวโดยไม่มีอะไรมาแตะ

          สมาคมจ่ายค่าเสียเวลาให้สองเหรียญ ประกาศแผ่นนั้นยังติดอยู่บนกระดาน ค่าหัวขึ้นเป็นสิบห้าเหรียญ
        effects: { hp: -3, gold: 2 }
    - id: lamp_chase
      label: ถือตะเกียงน้ำมันสองมือ ไล่ต้อนมันเข้าซอกด้วยตัวเอง
      check: { stat: DEX, dc: 14, foe: star }
      success:
        text: |
          {name}ไล่เงานั้นไปรอบลานด้วยตะเกียงในมือทั้งสองข้าง มันเร็วกว่าคน แต่หนีแสงได้แค่ทางเดียว ทางที่มืดกว่า {name}ต้อนมันเข้าซอกระหว่างหม้อกลั่นสองใบ แล้วเหวี่ยงตะเกียงข้างหนึ่งลงพื้นตรงหน้ามัน น้ำมันลุกพรึบเต็มซอก

          ตอนไฟดับ ในซอกเหลือแค่รอยไหม้ สมาคมจ่ายสิบสองเหรียญ หักค่าตะเกียงหนึ่งเหรียญ
        effects: { stats: { DEX: 1 }, gold: 11, flags: [killed_extra_shadow] }
      failure:
        text: |
          เงานั้นไม่หนี มันวนกลับมาด้านหลังตอนที่ลมพัดตะเกียงในมือซ้ายของ{name}ดับ มือเย็นที่ไม่มีน้ำหนักวางลงบนบ่าของ{name} แล้วบีบ กระดูกไหปลาร้าลั่นดังในหู {name}ฟาดตะเกียงที่เหลือลงพื้น ไฟลุกขึ้นทัน มันถอยกลับเข้าไปในเงาของหม้อกลั่น

          {name}กลับโรงเตี๊ยมด้วยแขนห้อย บนบ่ามีรอยนิ้วสีเทาห้ารอย ไม่จางไปอีกเลย
        effects: { hp: -4, flags: [shadow_hand_scar] }
    - id: share_with_crew
      label: ชวนนักล่ารุ่นพี่สองคนมาแบ่งงานแบ่งเงิน
      text: |
        {name}ชวนนักล่ารุ่นพี่สองคนจากโรงเตี๊ยมเดียวกันมาด้วย คนหนึ่งถือคบไฟ คนหนึ่งถือหม้อน้ำมัน {name}ยืนเป็นเหยื่อใต้แสงดาว สามคืนแรกไม่มีอะไร คืนที่สี่เงาที่สองลุกขึ้น ยังไม่ทันยืนเต็มตัว หม้อน้ำมันก็สาดลงไปพร้อมคบไฟ

        เงินสิบสองเหรียญแบ่งสามส่วนเท่ากัน {name}ได้สี่ คนถือหม้อน้ำมันบอกว่าคราวหน้ามีงานแบบนี้อีก ให้เรียกเขาก่อนคนอื่น
      effects: { stats: { CON: 1 }, gold: 4, flags: [hunted_with_crew] }
    - id: unseen_approach
      label: เดินเข้าไปหามันพร้อมตะเกียงที่ยังไม่จุด
      requires: { trait: demon_mark }
      text: |
        คืนนั้น{name}ยืนอยู่ใต้ดาวดวงใหม่กลางลานจานรับดาว เงาของ{name}มีเงาเดียว เงาของคนเฝ้าจานที่ยืนห่างออกไปมีสองเงา เงาที่สองลุกขึ้นจากเท้าเขา หันหัวไปมาเหมือนหมาดมกลิ่น ผ่านตัว{name}ไปหลายรอบโดยไม่หยุดสักครั้ง

        {name}เดินเข้าไปจนยืนข้างมัน ใกล้จนเอื้อมถึง แล้วจุดตะเกียงในมือ มันหดลงจนเหลือรอยดำบนลานหินก่อนจะทันหันมา คนเฝ้าจานถามว่ามันมองไม่เห็น{name}หรือ {name}ตอบไม่ได้ สมาคมจ่ายสิบสองเหรียญ
      effects: { gold: 12, flags: [killed_extra_shadow, shadow_couldnt_see_you] }

- id: adult.mid_bounty_westward
  stage: adult
  weight: 45
  when:
    age: [33, 40]
    flags: [job_bounty_hunter]
  text: |
    ปีนี้มีประกาศค่าหัวหมาเถ้าติดอยู่บนกระดานในโรงเตี๊ยมที่ห่างแดนเถ้าออกมาสามวันเดิน ไม่เคยมีมาก่อน ฝูงหนึ่งเดินตามรางขนถ่านออกมาทางตะวันตก กินแพะของหมู่บ้านริมรางไปสิบสองตัว กับคนเลี้ยงแพะหนึ่งคน

    ตาของ{name}ไม่ไวเท่าเดิมแล้ว ต้องหรี่ตาเวลาเล็งไกล ไหล่ขวาปวดทุกครั้งที่ยกปืนเล็งค้างไว้นาน ไนลา นักล่าสาวอายุสิบแปดที่เพิ่งมีชื่อตัวเองบนประกาศแผ่นแรก มายืนรอ{name}ที่ประตูโรงเตี๊ยมตั้งแต่ตีห้า นางขอไปด้วย ไม่ขอแบ่งเงิน ขอแค่ได้ดู
  choices:
    - id: take_the_kid
      label: พาไนลาไปด้วย สอนวิธีเล็งถ่านในอก
      check: { stat: DEX, dc: 13, foe: demon }
      success:
        text: |
          {name}สอนไนลาตั้งแต่บนทาง หมาเถ้าไม่ล้มจนกว่าถ่านในอกจะแตก ยิงหัวก็เสียกระสุน ยิงขาก็แค่ทำให้มันโกรธ ต้องรอให้มันหายใจเข้า ถ่านจะสว่างที่สุด แล้วยิงตอนนั้น

          ฝูงนั้นมีห้าตัว {name}ยิงสาม ไนลายิงสอง นัดที่สองของนางยิงตอนถ่านสว่างพอดี ค่าหัวสิบเหรียญ {name}รับไว้ทั้งหมดตามที่ตกลงกัน คืนนั้นนางนั่งเช็ดปืนข้างกองไฟจนดึก ปากท่องคำว่าหายใจเข้าซ้ำๆ
        effects: { stats: { DEX: 1 }, gold: 10, flags: [taught_naila] }
      failure:
        text: |
          ไนลายิงก่อนสัญญาณ กระสุนเข้าขาหน้าของตัวนำฝูง มันไม่ล้ม แต่หันมา แล้วทั้งฝูงก็พุ่งตามมา {name}ผลักไนลาลงหลังก้อนหิน ยิงสองตัวแรกแตก ตัวที่สามกัดเข้าต้นแขนซ้ายของ{name}ก่อนไนลาจะยิงถ่านในอกมันแตกจากระยะสามก้าว

          แผลไหม้ที่ต้นแขนหายเป็นรอยฟันดำเรียงกัน ค่าหัวได้แค่สามตัว หกเหรียญ
        effects: { hp: -3, gold: 6, flags: [taught_naila, hound_scar_arm] }
    - id: go_alone
      label: ไม่พาใครไป ล่าเองคนเดียวอย่างที่เคยทำ
      check: { stat: DEX, dc: 14, foe: demon }
      success:
        text: |
          {name}นอนรอในซอกหินเหนือรางสองคืน ปืนพาดหิน มือซ้ายรองใต้ไหล่ขวาไว้ไม่ให้สั่น คืนที่สอง ฝูงเดินมาตามรางเป็นแถว ถ่านในอกห้าดวงสว่างขึ้นลงตามจังหวะเดียวกัน {name}ยิงทีละดวง รอให้แต่ละดวงสว่างที่สุดก่อน

          ค่าหัวสิบเหรียญ หมู่บ้านริมรางให้แพะอีกหนึ่งตัว {name}ขายคืนให้หมู่บ้านแค่สามเหรียญ ผู้เฝ้าผนึกที่มาเก็บซากหมาเถ้าจดชื่อ{name}ไว้ในสมุดเวร
        effects: { gold: 13, reputation: { wardens: 1 } }
      failure:
        text: |
          คืนที่สองไหล่ขวาสั่นจนเล็งไม่นิ่ง นัดแรกพลาด ฝูงแตกกระจายเข้าหาซอกหินจากสองทาง {name}ยิงได้สองตัว ตัวที่สามขึ้นมาถึงก่อนจะบรรจุนัดใหม่ทัน {name}ฟาดพานท้ายปืนเข้าอกมันจนถ่านแตก แขนขวาไหม้ไปทั้งแถบ

          {name}เดินกลับโรงเตี๊ยมด้วยแขนพันผ้า ได้ค่าหัวสองตัว สี่เหรียญ
        effects: { hp: -4, gold: 4, flags: [hound_scar_arm] }
    - id: tell_wardens
      label: ส่งข่าวไปป้อมผู้เฝ้าผนึก ให้คนที่รู้งานมาเอง
      text: |
        {name}ส่งจดหมายไปป้อมสามกับเกวียนขนถ่านเที่ยวแรก บอกว่าหมาเถ้าออกมาไกลถึงไหน กี่ตัว เดินตามรางสายไหน ผู้เฝ้าผนึกสองคนมาถึงในห้าวัน ฆ่าทั้งฝูงในคืนเดียว แล้วนั่งดื่มกับ{name}ที่โรงเตี๊ยม บอกว่าไม่เคยมีใครนอกภาคีส่งข่าวมาก่อนที่หมาจะออกมาไกลกว่านี้

        ค่าหัวไม่มีใครได้ เพราะผู้เฝ้าผนึกไม่รับเงิน ไนลาฉีกประกาศแผ่นนั้นลงจากกระดานเอง พับเก็บใส่กระเป๋าเสื้อ
      effects: { reputation: { wardens: 1 }, alignment: { law: 1 }, flags: [warned_wardens_of_hounds] }
    - id: hound_pit
      label: ขุดหลุมดักข้างราง ไม่ยืนปะทะของที่หนักกว่าตัวเองอีก
      requires: { flag: hurt_by_golem }
      text: |
        ซี่โครงสองซี่ที่หุ่นยามตัวนั้นหักไว้ยังเจ็บทุกครั้งที่{name}หายใจลึก คราวนี้{name}ไม่ยืนปะทะ แต่ขุดหลุมลึกเท่าคนข้างรางตรงที่ฝูงเดินผ่านทุกคืน เทน้ำมันตะเกียงลงก้นหลุม ปิดปากหลุมด้วยหนังแพะทาเถ้าให้สีเหมือนพื้น

        คืนที่สามฝูงเดินมาตามราง ตัวนำฝูงตกลงไปก่อน {name}โยนคบไฟตามลงไป ถ่านในอกห้าดวงสว่างวาบขึ้นจากก้นหลุมพร้อมกัน แล้วดับ ค่าหัวสิบเหรียญ
      effects: { stats: { INT: 1 }, gold: 10, flags: [hound_pit_trap] }

- id: adult.mid_guide_hunters
  stage: adult
  weight: 45
  when:
    age: [25, 32]
    flags: [job_guide]
  text: |
    สามคนที่มาจ้าง{name}คราวนี้ไม่ปิดบังว่าเป็นใคร เสื้อคลุมขาวขลิบทอง ตะเกียงแขวนที่เข็มขัด นักล่าแม่มดของศาสนจักรตะเกียง คนที่อายุมากที่สุดวางเหรียญเรียงบนโต๊ะสิบสองเหรียญ มากกว่าที่{name}ได้จากลูกค้าคนไหนในปีนี้

    พวกเขาตามหาหมู่บ้านหนึ่งในหุบเขาที่ไม่มีบนแผนที่ หนูท่าเรือในเวนทราสส่งเด็กมีเขามาซ่อนไว้ที่นั่นทีละคนสองคนมาหลายปี เด็กที่โตแล้วไม่กลับเมือง เลี้ยงแพะ ทอผ้าขนแพะ ทุกวันนี้หมู่บ้านนั้นมีคนสามสิบกว่าคน

    {name}รู้ว่าหุบเขานั้นอยู่ไหน คนนำทางทุกคนในถิ่นนี้รู้ และจนถึงวันนี้ยังไม่มีใครเคยพาใครไป
  choices:
    - id: guide_true
      label: รับเงิน พาไปตามทางจริง
      text: |
        {name}พาสามคนนั้นเดินขึ้นหุบเขาสี่วันตามทางที่สั้นที่สุด ไปถึงหมู่บ้านตอนสายวันที่ห้า บ้านสิบสองหลังมุงหญ้า เตาในบ้านทุกหลังยังอุ่น หม้อข้าวต้มบนเตาหลังหนึ่งยังเดือดอยู่ ไม่มีคนสักคน

        นักล่าแม่มดคนอายุมากที่สุดยืนกลางลานหมู่บ้านจนหม้อข้าวต้มแห้ง แล้วนับเงินให้{name}ครบ บอกว่าทางที่{name}พามาเป็นทางจริง เขาจะเขียนไว้ในรายงาน ขาลง{name}เห็นรอยเท้าเล็กๆ หลายสิบคู่บนทางลงด้านเหนือ ใหม่จนขอบรอยยังคมอยู่
      effects: { gold: 12, alignment: { moral: -2, law: 1 }, reputation: { lamp_church: 1 }, flags: [guided_witch_hunters] }
    - id: false_trail
      label: รับเงิน แล้วพาไปหุบเขาผิดลูก
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}พาสามคนนั้นขึ้นหุบเขาทางทิศตรงข้าม หุบที่มีกระท่อมคนต้อนแพะร้างอยู่สามหลังกับเตาเก่าที่ยังมีเถ้า {name}เดินนำไปถึงตอนบ่ายวันที่หก แล้วบอกว่ามาช้าไป คนในหมู่บ้านคงได้ข่าวแล้วหนีไป

          นักล่าแม่มดคนอายุมากที่สุดเขี่ยเถ้าในเตาด้วยปลายรองเท้า เถ้าเย็นมาหลายปีแล้ว เขาไม่ว่าอะไร จ่ายให้ครึ่งเดียว หกเหรียญ บอกว่าเป็นค่าทางที่ไม่ไปถึงไหน
        effects: { stats: { INT: 1 }, gold: 6, flags: [misled_witch_hunters] }
      failure:
        text: |
          คนอายุน้อยที่สุดในสามคนพกเข็มทิศ และนับดาวเป็น คืนที่สองเขาบอกว่าเรากำลังเดินขึ้นใต้ ส่วนหุบที่ตามหาอยู่ทางเหนือ ไม่มีใครเถียงกัน คนอายุมากที่สุดเก็บเงินที่เหลือคืนเข้ากระเป๋า แล้วเดินกลับลงเขาไปกับอีกสองคน

          เดือนต่อมาชื่อของ{name}ขึ้นบัญชีของศาสนจักรตะเกียง ข้อหาขวางงานของศาสนจักร หุบเขาทางเหนือยังไม่มีใครไปถึง
        effects: { reputation: { lamp_church: -1 }, flags: [on_lamp_list] }
    - id: run_ahead
      label: ไม่รับงาน แล้วไต่ทางลัดหน้าผาคืนนั้นเลย ไปเตือนหมู่บ้านก่อน
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}เดินทั้งคืนทางลัดที่ล่อยังไม่ยอมเดิน ไต่หน้าผาสองช่วงด้วยเชือกเส้นเดียว ไปถึงหมู่บ้านตอนฟ้าสางวันที่สอง ผู้ใหญ่บ้านเป็นหญิงมีเขาอายุราวสามสิบ นางฟังจบโดยไม่ถามซ้ำ แล้วตีเกราะไม้สามครั้ง

          ก่อนเที่ยง ทั้งหมู่บ้านแบกของเท่าที่แบกไหวขึ้นทางเหนือไปหมด เหลือแต่บ้านกับเตาที่ดับแล้ว หนูท่าเรือในเวนทราสได้ข่าวเรื่องนี้ก่อนนักล่าแม่มดจะได้ออกเดินขึ้นเขา
        effects: { stats: { DEX: 1 }, reputation: { dock_rats: 1 }, flags: [warned_hidden_village] }
      failure:
        text: |
          หน้าผาช่วงที่สองเชือกขาด {name}ร่วงลงไปค้างอยู่บนชะง่อนหินครึ่งทาง ข้อเท้าซ้ายบวมเป่ง กว่าจะคลานขึ้นไปถึงหมู่บ้านก็บ่ายวันที่สาม

          ผู้ใหญ่บ้านฟังแล้วตีเกราะไม้สามครั้ง ทั้งหมู่บ้านขึ้นทางเหนือไปทันก่อนค่ำ แต่ต้องทิ้งแพะไว้ครึ่งฝูง {name}นอนอยู่ในบ้านหลังสุดท้ายอีกสามวัน จนเด็กมีเขาสองคนย้อนกลับมาพยุงไปด้วย
        effects: { hp: -2, flags: [warned_hidden_village] }
    - id: show_and_run
      label: รับงาน กลางทางปลดผ้าคลุมหัวให้พวกเขาเห็น แล้ววิ่งล่อไปอีกทาง
      requires: { trait: demon_mark }
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          คืนที่สองข้างกองไฟ {name}ปลดผ้าคลุมหัวออก ให้นักล่าแม่มดทั้งสามคนเห็นหัวของ{name}ในแสงไฟ ทั้งสามลุกขึ้นพร้อมกัน {name}วิ่งเข้าความมืดไปทางที่ไม่ใช่ทางไปหุบเขา ทั้งสามวิ่งตาม

          {name}พาพวกเขาวนอยู่ในป่าหินสามวัน แล้วหายเข้าไปในช่องหินที่คนตัวโตลอดไม่ผ่าน เดือนนั้นชื่อของ{name}ขึ้นบัญชีของศาสนจักรตะเกียง หุบเขาทางเหนือยังไม่มีใครไปถึง
        effects: { stats: { DEX: 1 }, flags: [on_lamp_list, shook_off_hunters] }
      failure:
        text: |
          คนอายุน้อยที่สุดยิงหน้าไม้ตามหลังมาในความมืด ลูกดอกเข้าน่องซ้าย {name}ยังวิ่งต่อได้ ลากขาไปจนถึงช่องหินแคบ แล้วมุดหายเข้าไป

          ลูกดอกเส้นนั้น{name}ดึงออกเองตอนสาง หัวลูกดอกสลักรูปตะเกียง แผลหายแล้วเหลือรอยนูนเท่าเหรียญ เดือนนั้นชื่อของ{name}ขึ้นบัญชีของศาสนจักรตะเกียง
        effects: { hp: -3, flags: [on_lamp_list, hunter_bolt_scar] }

- id: adult.mid_guide_apprentice
  stage: adult
  weight: 45
  when:
    age: [33, 40]
    flags: [job_guide]
  text: |
    สองผัวเมียชาวนาอายุเจ็ดสิบกว่ามาจ้าง{name}พาไปแตะเสาฟ้า ทั้งชีวิตเห็นเสามาแต่ไกล ขอแตะสักครั้งก่อนตาย ทางที่สั้นที่สุดต้องข้ามช่องเขาสองช่อง คนหนุ่มเดินสิบวัน คนเจ็ดสิบกว่าเดินสิบห้าวัน

    อาเบล ลูกมือของ{name}อายุสิบหก ขาแข็งแรง ตาไว จำทางได้ตั้งแต่เดินรอบแรก แต่ยังไม่เคยนำทางใครเองสักครั้ง เข่าซ้ายของ{name}ปีนี้เริ่มบวมทุกครั้งที่ลงเนินยาว และช่องเขาที่สองลงยาวทั้งวัน

    คืนก่อนออกเดินทาง ยายเย็บผ้าห่อขนมปังให้{name}สามผืน แล้วกระซิบว่าตาไม่ยอมบอกใคร แต่ตาเริ่มลืมทางกลับบ้านตัวเองมาตั้งแต่หนาวก่อน
  choices:
    - id: let_abel_lead
      label: ให้อาเบลนำทาง ตัวเองเดินท้าย
      check: { stat: INT, dc: 12 }
      success:
        text: |
          {name}เดินท้ายขบวนตลอดสิบห้าวัน ไม่พูดเรื่องทางสักคำ เว้นแต่อาเบลถาม ช่องเขาแรกอาเบลเลือกทางสันเขาที่ลมแรง {name}ปล่อยให้เลือก คืนนั้นตาหนาวจนสั่น วันรุ่งขึ้นอาเบลเปลี่ยนไปใช้ทางหุบเองโดยไม่ต้องมีใครบอก

          วันที่สิบห้า สองผัวเมียวางมือบนเสาฟ้าพร้อมกัน หินสีกระดูกเย็นอย่างที่ทุกคนเล่า ตาหันไปถามยายว่าที่นี่ที่ไหน ยายบอกว่าบ้าน แล้วตาก็เชื่อ
        effects: { stats: { INT: 1 }, flags: [taught_abel] }
      failure:
        text: |
          ช่องเขาที่สอง อาเบลเลือกทางลัดที่{name}ห้ามเขาไว้ตั้งแต่อายุสิบสี่ หินบนทางลัดเลื่อนลงมาตอนบ่าย ยายล้มข้อมือหัก {name}ต้องแบกยายลงเขาทั้งวันด้วยเข่าที่บวมอยู่แล้ว

          สองผัวเมียไปถึงเสาฟ้าช้ากว่ากำหนดหกวัน ยายแตะเสาด้วยมือข้างที่ดี อาเบลไม่ยอมนำทางใครอีกจนสิ้นปี
        effects: { hp: -2, flags: [taught_abel] }
    - id: lead_yourself
      label: นำทางเองทั้งทาง ให้อาเบลแบกของ
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}นำทางเองทั้งสิบห้าวัน ช่องเขาที่สองลงช้าที่สุดเท่าที่เคยลง พันเข่าไว้ด้วยผ้าห่อขนมปังผืนหนึ่งของยาย สองผัวเมียไม่รู้ว่าคนนำทางเจ็บ เพราะ{name}เดินช้าเท่ากับที่พวกเขาเดิน

          ที่โคนเสา ตาวางมือบนหินแล้วร้องไห้ ยายวางมือไว้ข้างมือตา {name}กับอาเบลนั่งรออยู่ห่างออกไปจนตะวันตกดิน ขากลับยายไม่ยอมรับผ้าพันเข่าผืนนั้นคืน บอกว่าเข่าของ{name}ยังต้องเดินอีกไกลกว่าของยาย
        effects: { stats: { CON: 1 }, items: [grandma_knee_cloth], flags: [led_the_old_couple] }
      failure:
        text: |
          วันที่เก้า เข่าซ้ายของ{name}พับลงกลางทางลงแล้วเหยียดไม่ออก อาเบลต้องนำทางที่เหลือเอง {name}เดินตามหลังด้วยไม้ค้ำที่อาเบลมัดขึ้นจากด้ามหอกกับเชือก

          สองผัวเมียได้แตะเสา ส่วนเข่าของ{name}ไม่กลับมาเหยียดได้สุดอีก
        effects: { hp: -2, flags: [guide_bad_knee] }
    - id: send_abel_alone
      label: วาดแผนที่ให้อาเบล แล้วส่งเขาไปคนเดียว
      text: |
        {name}วาดแผนที่ให้อาเบลบนหนังแพะ ทุกช่องเขา ทุกน้ำซับ ทุกถ้ำที่นอนได้ แล้วยืนส่งทั้งสามคนที่ปากทาง อาเบลเดินนำ ไม่หันกลับมาสักครั้ง

        ยี่สิบวันต่อมาอาเบลกลับมาคนเดียว ผอมลง ผิวไหม้แดด เขาวางเงินค่าจ้างครึ่งหนึ่งไว้บนโต๊ะของ{name}หกเหรียญ บอกว่ายายสั่งให้ เพราะคนวาดแผนที่ก็เดินไปด้วยเหมือนกัน
      effects: { gold: 6, flags: [sent_abel_alone] }
    - id: scatter_cairns
      label: ระหว่างทาง เตะกองหินของคนสวมแหวนเหล็กดำทิ้งทุกกอง
      requires: { flag: misled_ash_cult }
      text: |
        ทางข้ามช่องเขาที่สองผ่านเนินที่{name}เคยพาคนสวมแหวนเหล็กดำสามคนเดินวนเมื่อหลายปีก่อน ทุกวันนี้บนเนินนั้นมีกองหินเล็กๆ เรียงไปทางตะวันออกทุกร้อยก้าว ยอดทุกกองมีแหวนเหล็กดำวางอยู่หนึ่งวง พวกเขาหาทางกลับมาจนได้

        {name}ให้อาเบลพาสองผัวเมียเดินนำไปก่อน ตัวเองเดินท้าย เตะกองหินทุกกองที่ผ่านให้ล้ม เก็บแหวนใส่ถุงจนถุงหนัก คืนนั้น{name}เทแหวนทั้งถุงลงน้ำซับลึกที่ไม่มีใครตักกิน
      effects: { world: { demon: -1 }, reputation: { ash_cult: -1 }, flags: [scattered_cult_cairns] }

- id: adult.mid_scout_line
  stage: adult
  weight: 45
  when:
    age: [25, 32]
    flags: [job_scout]
  text: |
    บริษัทเหมืองถ่านมารจ้าง{name}เป็นหัวหน้าคนสำรวจ คนใต้คำสั่งหกคน เงินดีกว่าที่หอนับดาวจ่ายสามเท่า งานแรกคือเลือกแนวรางสายใหม่จากปลายรางเก่าไปถึงทุ่งถ่านแห่งใหม่ทางตะวันออก

    แนวที่สั้นที่สุดตัดผ่านพื้นอุ่น เถ้าแถบนั้นไม่มีน้ำค้างเกาะแม้ตอนตีห้า คนสำรวจที่แก่ที่สุดในคณะบอกว่าพื้นแบบนี้ ข้างใต้มักมีอะไรที่คนรุ่นก่อนเอาหินปิดไว้ แนวที่อ้อมพื้นอุ่นยาวกว่าสองวันเดิน และรางทุกวาบริษัทต้องจ่ายเอง

    ผู้จัดการบริษัทรอแผนที่อยู่ที่ปลายราง บอกว่าแนวที่สั้นที่สุดได้เงินพิเศษแปดเหรียญ
  choices:
    - id: straight_line
      label: ส่งแนวที่สั้นที่สุด
      text: |
        {name}ขีดแนวรางตรงจากปลายรางเก่าไปถึงทุ่งถ่าน ผ่านพื้นอุ่นสามช่วง ผู้จัดการจ่ายเงินพิเศษแปดเหรียญ ไม่ถามเรื่องพื้นอุ่นสักคำ

        ฤดูต่อมาคนวางรางเจอผนังหินก่อใต้เถ้าช่วงที่สอง บริษัทสั่งให้รื้อออกแล้ววางรางทับ สิบวันหลังจากนั้น คนวางรางสองคนไม่กลับเข้าค่าย
      effects: { gold: 8, world: { demon: 1 }, flags: [laid_the_straight_line] }
    - id: bend_it
      label: แต่งแผนที่ให้พื้นอุ่นกลายเป็นหนองเถ้าที่วางรางไม่ได้
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}วาดพื้นอุ่นทั้งสามช่วงเป็นหนองเถ้าเหลว ใส่ตัวเลขความลึกที่ไม่มีใครลงไปหยั่ง แนบเถ้าเปียกใส่ขวดจากน้ำซับข้างทางไปเป็นตัวอย่าง ผู้จัดการไม่เคยเหยียบเถ้าด้วยเท้าตัวเอง เขาเชื่อขวด

          รางสายใหม่อ้อมพื้นอุ่นไปสองวันเดิน บริษัทจ่ายค่าแผนที่ปกติสี่เหรียญ ไม่มีเงินพิเศษ คนสำรวจที่แก่ที่สุดในคณะเอาขวดเถ้าเปียกใบที่เหลือไปตั้งไว้บนชั้นในค่าย บอกว่าจะเก็บไว้ดูเล่น
        effects: { stats: { INT: 1 }, gold: 4, flags: [bent_the_rail_line] }
      failure:
        text: |
          ผู้จัดการส่งคนไปดูหนองเถ้าเอง คนที่ไปเหยียบพื้นแข็งอุ่นๆ กลับมา บริษัทวางรางตามแนวตรง แล้วจ้างหัวหน้าคนสำรวจคนใหม่ {name}ได้ค่าแผนที่ครึ่งเดียว สองเหรียญ
        effects: { gold: 2, flags: [scout_lost_post] }
    - id: map_for_ileth
      label: ส่งแนวอ้อมให้บริษัทตามจริง แล้วส่งสำเนาพื้นอุ่นไปหอนับดาว
      text: |
        {name}ส่งแนวรางที่อ้อมพื้นอุ่นไปให้บริษัท บอกตรงๆ ว่าเพราะอะไร ผู้จัดการขีดฆ่าแล้วส่งคืน สั่งให้ส่งแนวตรงมาใหม่ภายในสามวัน {name}ส่งใบลาออกกลับไปแทน

        สำเนาแผนที่พื้นอุ่นทั้งสามช่วงไปถึงหอนับดาวไอเลธกับขบวนเกวียนปลายฤดู หอนับดาวจ่ายค่าแผนที่มาสองเหรียญ กับจดหมายบอกว่าพื้นอุ่นสามช่วงนั้นตรงกับรอยในแผนที่ที่พวกเขาวาดไว้เมื่อร้อยปีก่อน
      effects: { gold: 2, reputation: { star_hall: 1 }, flags: [mapped_for_star_hall] }
    - id: keep_the_pit_off
      label: ลากแนวรางให้อ้อมห่างหลุมที่เคยลบออกจากแผนที่
      requires: { flag: hid_sealed_pit }
      text: |
        พื้นอุ่นช่วงที่สามอยู่ห่างหลุมที่{name}ลบออกจากแผนที่เมื่อหลายปีก่อนไม่ถึงครึ่งวันเดิน หลุมที่มีผนังหินก่อปิดไว้ ถ้าแนวรางผ่านตรงนั้น คนวางรางจะเจอมันภายในสัปดาห์ {name}ขีดแนวรางให้อ้อมเป็นโค้งใหญ่ แล้วเขียนเหตุผลว่าหินใต้เถ้าแข็งเกินกว่าจะตอกหมุดรางได้

        ผู้จัดการบ่นเรื่องสองวันที่เพิ่มขึ้น แต่จ่ายค่าแผนที่ปกติสี่เหรียญ หลุมนั้นยังไม่มีใครเจอ และยังไม่อยู่บนแผนที่ฉบับไหน
      effects: { gold: 4, alignment: { moral: 1 }, flags: [kept_pit_hidden] }

- id: adult.mid_scout_camp
  stage: adult
  weight: 45
  when:
    age: [33, 40]
    flags: [job_scout]
  text: |
    สิบกว่าปีมานี้ค่ายของบริษัทเหมืองลึกเข้าไปในแดนเถ้าทุกปี ปีนี้{name}เจอค่ายหนึ่งร้าง กระโจมยังกางอยู่สิบสองหลัง หม้อข้าวยังวางบนเตาที่ดับไปนานแล้ว ไม่มีคน ไม่มีศพ ไม่มีรอยเท้าเดินออกจากค่าย

    กลางค่ายมีหลุมเจาะ ปากหลุมกว้างเท่าบ่อน้ำ ขอบหลุมเป็นหินก่อที่บริษัทเจาะทะลุลงไป หัวเจาะเหล็กสามหัววางอยู่ข้างปากหลุม ละลายเป็นก้อนเหมือนเทียนที่ทิ้งไว้กลางแดด ไอร้อนลอยขึ้นจากหลุมเป็นจังหวะ จากข้างล่างลึกลงไปมีเสียงเคาะ เป็นชุด ห่างกันเท่าๆ กัน

    หลังของ{name}ไม่ยอมนอนบนพื้นเย็นอีกแล้ว แต่หูยังดีเหมือนเดิม
  choices:
    - id: rope_down
      label: ผูกเชือกลงไปดูว่าข้างล่างมีอะไร
      check: { stat: CON, dc: 13 }
      success:
        text: |
          เชือกยาวสามสิบวาหมดตอนเท้าแตะพื้นข้างล่างพอดี ข้างล่างเป็นห้องหินก่อ ผนังสลักอักษรตัวเดียวกันซ้ำทั้งผนัง ตัวที่คนสำรวจในแดนเถ้ารู้กันว่าแปลว่าอย่า ผนังด้านตะวันออกมีช่องที่เพิ่งเจาะทะลุ กว้างพอให้คนมุด ไอร้อนพ่นออกมาจากช่องนั้น เสียงเคาะดังมาจากข้างในช่อง

          {name}ไม่มุดเข้าไป จดทุกอย่างลงสมุด วาดผนังทั้งสี่ด้าน แล้วปีนขึ้นมาด้วยมือที่พองทั้งสองข้าง
        effects: { stats: { CON: 1 }, flags: [saw_the_breach] }
      failure:
        text: |
          ครึ่งทางลง ไอร้อนพ่นขึ้นมาแรงจนเชือกร้อนในมือ {name}ปีนกลับขึ้นมาไม่ทันก่อนไอระลอกที่สองจะมาถึง ผิวหน้ากับมือทั้งสองข้างไหม้แดง ตาข้างขวาบวมปิดไปสามวัน

          {name}ไม่ได้เห็นว่าข้างล่างมีอะไร ได้ยินแค่ว่าเสียงเคาะดังขึ้นตอนที่{name}ห้อยอยู่กลางหลุม
        effects: { hp: -3, flags: [heard_the_breach] }
    - id: seal_and_report
      label: กลิ้งหัวเจาะที่ละลายปิดปากหลุม แล้วไปบอกผู้เฝ้าผนึก
      text: |
        {name}งัดหัวเจาะที่ละลายเป็นก้อนสามก้อนกลิ้งลงปิดปากหลุม อัดเถ้าทับจนไอร้อนลอดขึ้นมาไม่ได้ แล้วเดินสามวันไปป้อมสาม ผู้เฝ้าผนึกจดตำแหน่งลงแผนที่ในห้องเวรด้วยหมึกสีแดง ข้างรอยหมึกแดงอีกหลายรอยที่ไม่มีบนแผนที่ของบริษัท

        บริษัทส่งคนมาถามว่าค่ายนั้นหายไปไหน {name}ตอบตามจริงทุกคำ คนที่มาถามจดไปแค่ครึ่งเดียว
      effects: { reputation: { wardens: 1 }, alignment: { law: 1 }, flags: [reported_open_pit] }
    - id: sell_the_camp
      label: วาดแผนที่ค่ายกับหลุมให้ละเอียด แล้วขายให้บริษัทเหมือง
      text: |
        {name}วาดแผนที่ค่ายร้างกับหลุมเจาะละเอียดทุกกระโจม ทุกหัวเจาะ ขายให้บริษัทหกเหรียญ บริษัทอยากได้ของในค่ายคืน เครื่องเจาะสามชุดราคาสูงกว่าค่าแรงคนงานสิบสองคนทั้งปี

        ฤดูต่อมาบริษัทส่งคนงานชุดใหม่ไปเก็บของในค่าย คนงานชุดนั้นกลับมาครบ พร้อมเครื่องเจาะสองชุด ชุดที่สามพวกเขาบอกว่าตกลงไปในหลุม หลุมนั้นกว้างกว่าที่แผนที่ของ{name}เขียนไว้อีกเท่าตัว
      effects: { gold: 6, world: { demon: 1 }, flags: [sold_the_camp_map] }
    - id: answer_the_knock
      label: นั่งลงที่ปากหลุม แล้วเคาะตอบไปสามครั้ง
      requires: { flag: heard_the_knock }
      text: |
        {name}เคยได้ยินเสียงเคาะแบบนี้มาครั้งหนึ่งแล้ว จากหลุมหินก่อหลุมแรกที่ลบออกจากแผนที่ {name}นั่งลงที่ปากหลุม เอาด้ามมีดเคาะหินขอบหลุมสามครั้ง ห่างเท่าๆ กัน แล้วรอ

        ข้างล่างเงียบไปนานพอให้ไอร้อนพ่นขึ้นมาสามระลอก แล้วก็มีเสียงเคาะตอบขึ้นมาสามครั้ง ช้ากว่าเดิม ห่างกว่าเดิม ไอร้อนระลอกต่อไปอ่อนลง {name}นั่งเคาะตอบอยู่ที่ปากหลุมจนสาง
      effects: { world: { gods: 1 }, flags: [answered_the_knock] }

- id: adult.mid_troupe_patron
  stage: adult
  weight: 45
  when:
    age: [25, 32]
    flags: [job_troupe]
  text: |
    เข่าของมาริเดลพังในหน้าฝนปีหนึ่ง นางตกจากเวทีไม้ตอนฉากสุดท้าย ลุกขึ้นได้แต่เดินไม่ได้อีก นางนั่งเก้าอี้คุมคณะอยู่หลังเวที ส่วนเวทีทั้งเวที ทุกบทพูด ทุกคืน กลายเป็นของ{name}

    คืนหนึ่งในเมืองตลาดใหญ่ ขุนนางคนหนึ่งดูเรื่องคืนที่เสาฟ้าหักจนจบ แล้วเดินมาหลังเวทีเอง ท่านเสนอเงินอุปถัมภ์เดือนละแปดเหรียญ กับโรงละครไม้ในเมืองให้เล่นได้ทั้งหน้าหนาว ไม่ต้องลากเกวียนตากฝน แลกกับเรื่องเดียว คณะต้องเลิกเล่นคืนที่เสาฟ้าหัก ท่านบอกว่าเรื่องนี้ทำให้คนรักจอมมาร และศาสนจักรตะเกียงก็คิดเหมือนท่าน

    มาริเดลนั่งอยู่บนเก้าอี้หลังเวที ไม่ตอบแทน{name}
  choices:
    - id: take_patron
      label: รับเงินอุปถัมภ์ เลิกเล่นเรื่องนั้น
      text: |
        คณะเล่นเรื่องใหม่ในโรงละครไม้ของท่านทั้งหน้าหนาว เรื่องอัศวินกับเจ้าหญิงที่ท่านเขียนเอง ตอนจบทุกคนแต่งงานกัน คนดูปรบมือทุกคืน แต่ไม่มีใครกลับมาดูซ้ำ เงินอุปถัมภ์เดือนแรกแปดเหรียญ

        เขาไม้ทาสีแดงของจอมมารแขวนอยู่บนตะปูหลังเวที ฝุ่นจับหนาขึ้นทุกเดือน มาริเดลให้เด็กในคณะปัดฝุ่นมันทุกเช้า
      effects: { gold: 8, reputation: { crown: 1 }, flags: [troupe_patron] }
    - id: keep_the_road
      label: ขอบคุณท่าน แล้วลากเกวียนออกจากเมืองในเช้าวันรุ่งขึ้น
      text: |
        คณะลากเกวียนออกจากเมืองตลาดตอนฝนยังตก หน้าหนาวปีนั้นเล่นตามลานหมู่บ้าน ได้ข้าวกับถ่านมากกว่าเหรียญ {name}นอนใต้เกวียนเกือบทุกคืน ไอทุกเช้าจนหน้าหนาวผ่านไป

        คืนที่เสาฟ้าหักเล่นครบทุกคืน บทพูดยาวของจอมมาร คนดูท่องตามได้ทุกถิ่น
      effects: { stats: { CON: 1 }, alignment: { law: -1 }, flags: [kept_the_road] }
    - id: play_both
      label: รับเงิน เล่นเรื่องของท่านในเมือง แล้วแอบเล่นเรื่องเก่าที่หมู่บ้านรอบเมือง
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}เล่นสองเรื่องในหน้าหนาวเดียว ห้าคืนเป็นอัศวินในโรงละครไม้ สองคืนเป็นจอมมารบนลานดินในหมู่บ้านรอบเมือง ขี่ล่อไปกลับทั้งคืน ล้างสีหน้าบนหลังล่อ ท่านขุนนางไม่เคยออกนอกกำแพงเมืองตอนกลางคืน

          เงินอุปถัมภ์เดือนแรกแปดเหรียญมาตรงวัน คนในหมู่บ้านรอบเมืองท่องบทจอมมารได้ก่อนคนในเมือง
        effects: { stats: { CON: 1 }, gold: 8, flags: [played_both] }
      failure:
        text: |
          คืนวันว่างที่สาม ลูกชายของท่านขุนนางนั่งอยู่แถวหลังบนลานดินในหมู่บ้าน เขาไม่เคยมาดูเรื่องอัศวินสักคืน เช้ามาเงินอุปถัมภ์หยุด โรงละครไม้ปิดประตู คณะลากเกวียนออกจากเมืองตอนฝนยังตก
        effects: { flags: [kept_the_road] }
    - id: ask_about_horns
      label: ปลดผ้าคลุมหัว ถามท่านว่าที่ไม่ชอบคือเรื่อง หรือคือเขา
      requires: { flag: played_demon_with_own_horns }
      text: |
        {name}ปลดผ้าคลุมหัวต่อหน้าท่านขุนนาง ท่านไม่ถอย ท่านพิจารณาเขาของ{name}เหมือนคนดูม้าในตลาด แล้วบอกว่าท่านจะจ่ายสองเท่า ถ้า{name}มายืนเป็นจอมมารในโรงละครไม้ให้แขกของท่านดูทุกคืนวันว่าง ไม่ต้องเล่นเรื่องอื่น ไม่ต้องพูดบทยาว แค่ยืนให้แสงตะเกียงส่องเขา

        {name}ปฏิเสธ ท่านไม่โกรธ ท่านบอกว่าคนแบบนี้หาได้ไม่ยากในเวนทราส แล้วจ่ายค่าดูละครคืนนั้นให้หกเหรียญ เหรียญเงินทุกเหรียญ คณะลากเกวียนออกจากเมืองในเช้าวันรุ่งขึ้น
      effects: { gold: 6, alignment: { moral: 1 }, flags: [refused_to_be_shown, kept_the_road] }

- id: adult.mid_troupe_passing
  stage: adult
  weight: 45
  when:
    age: [33, 40]
    flags: [job_troupe]
  text: |
    บทพูดยาวของจอมมารในฉากที่สามยาวเท่าเดิม แต่ลมหายใจของ{name}สั้นลง ปีนี้พอถึงท่อนที่ว่าด้วยเสาต้นที่เจ็ด {name}ต้องหยุดหายใจกลางประโยคทุกคืน คนดูที่ท่องตามได้รู้ว่าหยุดผิดที่

    แคสซิน นักแสดงอายุสิบเจ็ดที่เข้าคณะมาสามปี ท่องบทจอมมารได้ทุกคำ ตั้งแต่ก่อนจะมีใครสอน เขาท่องตามอยู่หลังเวทีทุกคืน ปากขยับตรงจังหวะที่{name}ควรหายใจ

    คนดูรุ่นใหม่ก็เปลี่ยนไป เด็กที่โตมากับตะเกียงฟ้ามาถามหลังเวทีว่าทำไมเรื่องนี้ไม่มีดาว ทุกคืนบนฟ้ามีดาวขึ้นใหม่ ในเรื่องมีแต่เสากับจอมมาร
  choices:
    - id: pass_the_role
      label: ยกบทจอมมารให้แคสซิน ตัวเองไปเล่นผู้กล้าที่ตายในฉากแรก
      text: |
        คืนแรกที่แคสซินเล่นจอมมาร เขาพูดบทยาวจบได้ในลมหายใจที่{name}ไม่มีแล้ว แต่หยุดหายใจตรงที่{name}เคยหยุดเมื่อหลายปีก่อน คนดูท่องตามได้ทุกคำ {name}นอนตายอยู่บนเวทีตั้งแต่ฉากแรก ฟังจากพื้นไม้ ได้ยินทุกคำชัดกว่าตอนพูดเอง

        หลังเรื่องจบ แคสซินคืนเขาไม้ทาสีแดงให้{name} บอกว่าเขาจะแกะเขาไม้ของตัวเองใหม่
      effects: { alignment: { moral: 1 }, flags: [passed_the_demon_role] }
    - id: one_more_season
      label: ฝึกลมหายใจใหม่ เล่นต่ออีกฤดู
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ตื่นก่อนไก่ขันทุกเช้า วิ่งขึ้นเนินหลังลานพักเกวียน ท่องบทจอมมารทั้งบทตอนวิ่ง จนลมหายใจยาวพอให้ถึงท่อนเสาต้นที่เจ็ดโดยไม่หยุด ใช้เวลาสองเดือน

          ฤดูนั้นเป็นฤดูที่ดีที่สุดของคณะในรอบสิบปี คนดูไม่รู้ว่าเพราะอะไร แคสซินรู้ เขายืนดูอยู่หลังเวทีทุกคืน จดว่า{name}หายใจตรงไหน
        effects: { stats: { CON: 1 }, flags: [one_more_season] }
      failure:
        text: |
          เดือนที่สอง {name}เป็นลมกลางท่อนเสาต้นที่เจ็ด ล้มลงบนเวทีต่อหน้าคนดูสามร้อยคน แคสซินเดินออกมาจากหลังเวทีทันที สวมเขาไม้อันสำรอง แล้วพูดบทต่อจากคำที่{name}หยุด คนดูนึกว่าเป็นส่วนหนึ่งของเรื่อง ปรบมือนานที่สุดในฤดู

          {name}นอนพักอยู่ในเกวียนสิบวัน ฟังเสียงแคสซินเล่นทุกคืน
        effects: { hp: -2, flags: [passed_the_demon_role] }
    - id: write_star_scene
      label: เขียนฉากใหม่ ใส่ดาวลงไปในเรื่อง
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}เขียนฉากที่สี่ต่อจากฉากเสาหัก ผู้กล้าคนสุดท้ายที่ยังเหลือนั่งอยู่ใต้ฟ้าที่ไม่มีเสาต้นที่เจ็ด แล้วนับดาวที่ขึ้นใหม่ทีละดวง นับไปจนนับไม่ทัน ไม่มีบทพูด มีแต่เสียงนับ ตะเกียงฟ้าบนเวทีจุดเพิ่มทีละดวงจนสว่างทั้งเวที

          เด็กๆ ชอบฉากนั้นที่สุด ผู้ใหญ่บางคนเดินออกก่อนจบ คนในหมู่บ้านหนึ่งใส่เหรียญลงหมวกเพิ่มอีกสี่เหรียญ ขอให้เล่นฉากนั้นซ้ำ
        effects: { stats: { INT: 1 }, gold: 4, flags: [wrote_star_scene] }
      failure:
        text: |
          ฉากใหม่ยาวเกินไป คนดูลุกไปซื้อขนมกลางฉาก มาริเดลนั่งดูจากเก้าอี้หลังเวทีจนจบ แล้วบอกว่าเรื่องที่ดีต้องรู้ว่าจบตรงไหน ฉากนั้นเล่นได้สามคืนก็ถอดออก
        effects: { flags: [cut_star_scene] }
    - id: restore_speech
      label: เอาท่อนท้ายของบทพูดยาวที่คณะตัดทิ้งไปเมื่อหลายปีก่อนกลับมาเล่น
      requires: { flag: cut_demon_speech }
      text: |
        ท่อนท้ายของบทพูดยาว ท่อนที่จบด้วยประโยคว่าฟ้าของพวกเจ้าไม่ได้มีไว้ให้พวกเจ้า คณะตัดทิ้งตั้งแต่คืนที่ผู้ตรวจของศาสนจักรมานั่งแถวหน้า แล้วไม่เคยใส่กลับ คนดูรุ่นหลังไม่เคยได้ยิน แต่{name}ยังจำได้ทุกคำ {name}ให้แคสซินท่องจนจำได้ แล้วเล่นคืนแรกที่ลานหมู่บ้านไกลที่สุดของเส้นทาง

        คนแก่ในหมู่บ้านนั้นท่องตามได้สามบรรทัดแรก บอกว่าได้ยินจากคณะอื่นเมื่อสี่สิบปีก่อน ฤดูต่อมาศาสนจักรตะเกียงส่งผู้ตรวจคนใหม่มาตามคณะ เขายังไม่ทันได้ฟังบทนั้นสักคืน
      effects: { alignment: { law: -1 }, reputation: { lamp_church: -1 }, flags: [restored_demon_speech] }

- id: adult.mid_news_press
  stage: adult
  scene: tavern
  weight: 45
  when:
    age: [25, 32]
    flags: [job_news_walker]
  text: |
    คัลเดน เจ้าของร้านพิมพ์ในเมือง มานั่งรอ{name}ที่โต๊ะริมประตูโรงเตี๊ยมสามคืน คืนที่สามเขาวางกระดาษแผ่นหนึ่งลงบนโต๊ะ พิมพ์ด้วยตัวตะกั่ว หมึกยังไม่แห้งดี เป็นข่าวที่{name}ร้องเมื่อคืนก่อนทุกคำ เขาพิมพ์ได้ห้าร้อยแผ่นในคืนเดียว ขายสิบแผ่นหนึ่งเหรียญ

    เขาอยากให้{name}เป็นคนเขียนข่าว เขาเป็นคนพิมพ์ แบ่งกำไรกันคนละครึ่ง เสียงของ{name}ไปได้แค่สุดโรงเตี๊ยม กระดาษของเขาไปได้ทั้งเมือง

    ติดอยู่เรื่องเดียว ใบพิมพ์ทุกแผ่นในเมืองต้องมีตราของสำนักตรวจหนังสือของราชสำนัก ตราหนึ่งตราต่อข่าวหนึ่งข่าว และสำนักตรวจขีดฆ่าทุกบรรทัดที่ไม่ชอบ
  choices:
    - id: print_with_stamp
      label: เขียนข่าวส่งสำนักตรวจ พิมพ์เท่าที่ตราอนุญาต
      text: |
        ข่าวแผ่นแรกของ{name}ส่งไปสำนักตรวจสิบสองบรรทัด กลับมาเหลือเจ็ด ห้าบรรทัดที่ขีดฆ่าเป็นเรื่องค่าแรงคนงานโรงกลั่น ตราสีน้ำเงินประทับอยู่มุมขวาล่าง คัลเดนพิมพ์เจ็ดบรรทัดนั้นห้าร้อยแผ่น ขายหมดก่อนเที่ยง

        ส่วนแบ่งเดือนแรกหกเหรียญ {name}ยังร้องข่าวในโรงเตี๊ยมทุกคืน ร้องครบสิบสองบรรทัด
      effects: { gold: 6, reputation: { crown: 1 }, alignment: { law: 1 }, flags: [news_printed] }
    - id: voice_only
      label: ไม่เขียน ร้องต่อไปด้วยเสียงอย่างเดิม
      text: |
        {name}บอกคัลเดนว่าข่าวที่ต้องให้คนอื่นขีดก่อนจะไปถึงหูคน ไม่ใช่ข่าวของ{name} คัลเดนไม่เถียง เขาซื้อเหล้าให้แก้วหนึ่ง แล้วถามว่าถ้าเขาจดตามเสียงร้องไปพิมพ์เอง ไม่ใส่ชื่อ{name} จะว่าอะไรไหม

        {name}ยักไหล่ เดือนต่อมามีกระดาษข่าวไม่มีตราวางขายใต้สะพานทุกเช้า ทุกบรรทัดตรงกับที่{name}ร้องเมื่อคืนก่อน
      effects: { alignment: { law: -1 }, flags: [kept_news_spoken] }
    - id: print_at_night
      label: เขียนให้คัลเดนพิมพ์ตอนกลางคืน ไม่ต้องมีตรา
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          แท่นพิมพ์ของคัลเดนทำงานตั้งแต่เที่ยงคืนถึงตีสี่ หลังจากนั้น{name}กับลูกมือร้านพิมพ์สองคนแบกกระดาษข่าวไปวางตามบันไดท่าน้ำ ใต้สะพาน หน้าประตูโรงกลั่นทุกโรง ก่อนกะเช้าจะเข้างาน ไม่มีใครเห็นคนวาง

          ข่าวสิบสองบรรทัดครบทุกบรรทัด ส่วนแบ่งเดือนแรกห้าเหรียญ ตั้งแต่เดือนที่สอง หนูท่าเรือส่งเด็กมาช่วยแบกกระดาษโดยไม่คิดเงิน
        effects: { stats: { DEX: 1 }, gold: 5, reputation: { dock_rats: 1 }, flags: [printed_without_stamp] }
      failure:
        text: |
          คืนที่สาม ยามราชสำนักเจอกระดาษข่าวกองหนึ่งใต้สะพานก่อนสาง ไม่มีตรา สำนักตรวจปรับร้านพิมพ์ของคัลเดนหกเหรียญ คัลเดนจ่ายครึ่ง {name}จ่ายอีกครึ่ง เขาบอกว่าคราวหน้าให้วางไกลจากสะพานอีกสามซอย
        effects: { gold: -3, flags: [news_fined] }
    - id: hevelin_prints
      label: ไปหาเฮเวลิน ให้คนงานโรงสีช่วยกันแจกกระดาษ
      requires: { flag: exposed_bought_news }
      text: |
        เฮเวลินจำ{name}ได้ คนที่ร้องข่าวจริงเรื่องนางในคืนที่มีคนจ่ายเงินให้ร้องข่าวปลอม นางฟังเรื่องแท่นพิมพ์จนจบ แล้วบอกว่าคนงานโรงสีสามร้อยคนเดินผ่านทุกซอยในเมืองทุกเช้าก่อนตะวันขึ้น

        ตั้งแต่เดือนนั้น กระดาษข่าวของ{name}ออกจากร้านคัลเดนทุกคืน แล้วไปอยู่ในย่ามข้าวของคนงานโรงสีทุกเช้า ไม่มีกองไหนวางทิ้งไว้ให้ยามเจอ ส่วนแบ่งเดือนแรกสี่เหรียญ เฮเวลินไม่เอาส่วนของนาง ขอแค่ให้ข่าวค่าแรงขึ้นเป็นบรรทัดแรกทุกครั้ง
      effects: { gold: 4, alignment: { moral: 1 }, flags: [hevelin_prints] }

- id: adult.mid_news_dream
  stage: adult
  scene: tavern
  weight: 45
  when:
    age: [33, 40]
    flags: [job_news_walker]
  text: |
    ร้องข่าวมาหลายปี {name}ไม่เคยเจอข่าวแบบนี้ คนเดินข่าวสามคนจากสามถิ่นมาถึงโรงเตี๊ยมเดียวกันในสัปดาห์เดียว คนหนึ่งมาจากเวนทราส คนหนึ่งจากหมู่บ้านชายป่าไอเลธ คนหนึ่งจากเมืองริมรางในแดนเถ้า ทั้งสามคนมีข่าวเดียวกัน

    คนในถิ่นของพวกเขาฝันเรื่องเดียวกันในคืนเดียวกัน ฝันว่ายืนอยู่บนหลังคาบ้านตัวเอง ฟ้ามีรอยร้าวเส้นหนึ่ง แล้วมีเสียงเคาะ ไม่รู้ว่ามาจากฝั่งไหนของฟ้า สามคนเล่าความฝันนั้นตรงกันทุกคำ แม้กระทั่งจำนวนครั้งที่เคาะ

    เสียงของ{name}ไม่สูงเท่าเดิม ร้องเพลงยาวต้องพักกลางเพลง แต่โรงเตี๊ยมยังเงียบทุกครั้งที่{name}ลุกขึ้นยืน คืนนี้ทุกโต๊ะรอฟังว่า{name}จะร้องข่าวนี้หรือไม่
  choices:
    - id: sing_the_dream
      label: ร้องข่าวความฝันตามที่สามคนเล่า
      text: |
        {name}ร้องข่าวความฝันตามที่สามคนเล่า ไม่ตัด ไม่เติม ร้องจนถึงจำนวนครั้งที่เคาะ โรงเตี๊ยมเงียบจนได้ยินเสียงไส้ตะเกียงไหม้ หลังเพลงจบ หญิงคนหนึ่งที่โต๊ะริมหน้าต่างลุกขึ้น บอกว่านางก็ฝัน แล้วอีกสองคน แล้วอีกเจ็ดคน

        ข่าวของ{name}ไปถึงถิ่นอื่นก่อนคนเดินข่าวสามคนนั้นจะได้กลับบ้าน คนฟังจ่ายค่าข่าวคืนนั้นห้าเหรียญ มากที่สุดในรอบปี
      effects: { gold: 5, world: { star: 1 }, flags: [sang_the_dream] }
    - id: not_news
      label: ไม่ร้อง บอกทั้งโรงเตี๊ยมว่าความฝันไม่ใช่ข่าว
      text: |
        {name}ลุกขึ้นยืน บอกทั้งโรงเตี๊ยมว่าคนเดินข่าวร้องเรื่องที่มีคนเห็นด้วยตา ความฝันของคนเป็นพันคนก็ยังเป็นความฝัน แล้วร้องข่าวราคาข้าวกับข่าวเรือเกลือล่มแทน เสียงคุยกลับมาดังก่อนข่าวแรกจะจบ บางคนลุกออกไป

        คนเดินข่าวสามคนนั้นไปร้องที่โรงเตี๊ยมอื่น คืนนั้น{name}สอนลูกมือร้องข่าวที่อายุน้อยที่สุดในโรงเตี๊ยมว่าข่าวกับเรื่องเล่าต่างกันตรงไหน
      effects: { alignment: { law: 1 }, flags: [taught_news_rule] }
    - id: trace_it
      label: นั่งถามสามคนว่าคืนที่ฝัน ถิ่นของเขามีอะไรเหมือนกัน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}นั่งถามสามคนนั้นจนดึก ทีละเรื่อง ลมพัดทางไหน ฝนตกไหม ดาวดวงไหนขึ้นตรงหัว ทั้งสามถิ่นไม่มีอะไรเหมือนกันสักอย่าง ยกเว้นเรื่องเดียว ทั้งสามถิ่นเพิ่งตั้งจานรับดาวใบใหม่ได้ไม่ถึงเดือน

          {name}ร้องข่าวนั้นในคืนต่อมา ร้องแค่สิ่งที่รู้ ไม่ร้องสิ่งที่เดา คนฟังเงียบกว่าคืนก่อน
        effects: { stats: { INT: 1 }, flags: [traced_the_dream] }
      failure:
        text: |
          สามคนตอบไม่ตรงกันสักข้อ คนหนึ่งจำวันผิด อีกคนเมาเกินกว่าจะจำได้ว่าคืนนั้นอยู่ถิ่นไหน {name}นั่งถามจนไก่ขัน ไม่ได้อะไรกลับมานอกจากคอที่แหบไปสามวัน
        effects: { stats: { CON: 1 } }
    - id: sing_it_as_rumor
      label: รับเงินจากชายเสื้อนอกดีคนเดิม ร้องว่าความฝันนี้เป็นข่าวลือ
      requires: { flag: sang_bought_news }
      text: |
        ชายเสื้อนอกดีคนเดิมมาเอง แก่ลง เสื้อนอกดีกว่าเดิม เขาจำ{name}ได้ จำได้ว่าคนเดินข่าวคนนี้เคยรับเงินร้องข่าวปลอมมาครั้งหนึ่งแล้ว เขาวางเหรียญแปดเหรียญข้างแก้ว ขอให้ร้องว่าความฝันนี้เป็นข่าวลือที่คนเดินข่าวกุขึ้นขายกันเอง

        {name}ร้อง คนฟังหัวเราะในจังหวะที่ควรหัวเราะ คนเดินข่าวสามคนนั้นไม่มีใครจ้างร้องอีกในเมืองนี้ คืนนั้นเหรียญแปดเหรียญวางอยู่บนโต๊ะข้างเตียงจนเช้า {name}ไม่ได้นับ
      effects: { gold: 8, alignment: { moral: -1 }, reputation: { distillers: 1 }, flags: [sang_bought_dream] }

- id: adult.mid_house_singer_post
  stage: adult
  scene: noble_hall
  weight: 45
  when:
    age: [25, 32]
    flags: [job_house_singer]
  text: |
    ปีที่{name}ได้เป็นครูดนตรีประจำบ้านขุนนาง มีนักร้องรุ่นเด็กใต้คำสั่งสี่คน มีห้องของตัวเองที่ไม่ใช่ห้องคนใช้ และมีกุญแจห้องดนตรีที่อยู่ติดกับห้องอ่านหนังสือของเจ้าของบ้าน ผนังระหว่างสองห้องบางพอให้ได้ยินเสียงพลิกกระดาษ

    บ้านขุนนางอีกตระกูลหนึ่งส่งคนมาหาถึงตลาด ข้อเสนอมีสองชั้น ชั้นแรก ค่าจ้างสองเท่าถ้า{name}ย้ายไปเป็นครูดนตรีบ้านนั้น ชั้นที่สอง ค่าจ้างสามเท่าถ้าอยู่บ้านเดิมต่อ แล้วจดว่าจดหมายที่เจ้าของบ้านเขียนทุกคืนวันว่างส่งไปถึงใครบ้าง

    คนที่มาเสนอเป็นนักร้องรุ่นเดียวกับ{name} เคยร้องคู่กันตอนเป็นลูกมือ เขาบอกว่าบ้านขุนนางทุกบ้านในเมืองนี้มีนักร้องที่ฟังผนังเป็น บ้านไหนไม่มี บ้านนั้นจะเป็นบ้านถัดไปที่ต้องขายบ้าน
  choices:
    - id: stay_loyal
      label: ปฏิเสธทั้งสองชั้น แล้วบอกเจ้าของบ้านว่ามีคนมาถาม
      text: |
        {name}เล่าให้เจ้าของบ้านฟังทั้งหมด ชื่อบ้านที่ส่งคนมา ชื่อนักร้องคนนั้น ค่าจ้างทั้งสองชั้น เจ้าของบ้านฟังจนจบ ไม่ขอบคุณ แค่สั่งให้ย้ายห้องดนตรีไปอยู่ปีกตะวันตก ห่างห้องอ่านหนังสือสามห้อง

        ค่าจ้างเดือนนั้นขึ้นสี่เหรียญ ห้องดนตรีใหม่หนาวกว่าเดิม ผนังหนากว่าเดิม
      effects: { gold: 4, reputation: { crown: 1 }, flags: [house_music_master] }
    - id: take_the_offer
      label: ย้ายไปเป็นครูดนตรีบ้านนั้น รับค่าจ้างสองเท่า
      text: |
        บ้านใหม่ใหญ่กว่าบ้านเดิม ห้องดนตรีมีพิณสามตัวที่ไม่มีใครเล่นมาสิบปี ค่าจ้างเดือนแรกแปดเหรียญครบตามที่บอก

        เดือนที่สอง เจ้าของบ้านใหม่เรียก{name}ไปถามว่าบ้านเดิมรับแขกคนไหนบ้างในปีที่ผ่านมา ถามด้วยเสียงสบายๆ เหมือนถามว่ากินข้าวมาหรือยัง
      effects: { gold: 8, alignment: { law: -1 }, flags: [changed_noble_house] }
    - id: feed_false_letters
      label: รับชั้นที่สอง แล้วส่งรายชื่อผู้รับจดหมายปลอมไปให้
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}ส่งรายชื่อผู้รับจดหมายไปให้บ้านนั้นทุกเดือน ทุกชื่อเป็นชื่อจริง ของคนที่เจ้าของบ้านไม่เคยเขียนถึง พ่อค้าผ้า ช่างทำรองเท้า หมอฟันที่ตายไปแล้ว บ้านนั้นส่งคนไปตามคนในรายชื่อทุกคน ใช้เงินไปมากกว่าที่จ่าย{name}สามเท่า

          ค่าจ้างส่วนที่เพิ่มมาครบทุกเดือน รวมได้หกเหรียญ ปลายปีบ้านนั้นเลิกส่งเงินมาเอง ไม่ได้บอกเหตุผล
        effects: { stats: { INT: 1 }, gold: 6, flags: [fed_false_letters] }
      failure:
        text: |
          เดือนที่สาม พ่อค้าผ้าคนหนึ่งในรายชื่อของ{name}เป็นคนที่บ้านนั้นจ้างไว้เองมาสิบปี บ้านนั้นเลิกส่งเงิน แล้วส่งจดหมายไม่ลงชื่อฉบับหนึ่งถึงเจ้าของบ้านเดิมของ{name}

          เจ้าของบ้านอ่านจดหมายฉบับนั้นที่โต๊ะอาหารเช้า แล้วยื่นให้{name}อ่าน ไม่ไล่ออก แต่ตั้งแต่นั้นห้องดนตรีย้ายไปอยู่ปีกตะวันตก
        effects: { flags: [noble_houses_wary] }
    - id: tell_hedrik
      label: ไปบอกท่านเฮดริค วาเรน ว่ามีคนมาขอให้ฟังผนัง
      requires: { flag: kept_lords_secret }
      text: |
        ท่านเฮดริคยังจำคนบนระเบียงคืนนั้นในกระจกห้องอ่านหนังสือได้ ท่านฟัง{name}เล่าจนจบ แล้วบอกให้รับชั้นที่สองไว้ ส่งรายชื่อผู้รับจดหมายไปให้บ้านนั้นตามที่ขอ เป็นรายชื่อที่ท่านเขียนเองทุกเดือน

        ตลอดปีนั้นบ้านนั้นจ่ายค่าจ้างส่วนเพิ่มให้{name}รวมหกเหรียญ ส่วนท่านเฮดริคได้รู้ว่าบ้านนั้นกลัวใครบ้าง จากชื่อที่บ้านนั้นส่งคนไปตาม ปลายปีท่านเรียก{name}ว่าครูดนตรีต่อหน้าแขกเป็นครั้งแรก
      effects: { gold: 6, reputation: { crown: 1 }, flags: [house_music_master, hedrik_used_the_wall] }

- id: adult.mid_house_singer_requiem
  stage: adult
  scene: noble_hall
  weight: 45
  when:
    age: [33, 40]
    flags: [job_house_singer]
  text: |
    เจ้าของบ้านอายุแปดสิบแล้ว ลงบันไดเองไม่ได้ เสียงของ{name}ก็ไม่ใสเท่าเดิม เสียงสูงสุดที่เคยร้องถึงได้ตอนยี่สิบ ทุกวันนี้ร้องถึงได้แค่ตอนเช้าก่อนพูดกับใคร

    คืนหนึ่งท่านเรียก{name}ไปที่ห้องนอน ขอให้ร้องเพลงส่งศพของท่านให้ฟัง เพลงที่จะร้องในงานศพของท่าน ร้องตอนนี้ ตอนท่านยังได้ยิน ท่านบอกว่าทั้งชีวิตได้ยินแต่เพลงที่คนร้องให้คนอื่น ไม่เคยได้ยินเพลงของตัวเอง

    บ้านขุนนางเก่ามีธรรมเนียมว่าห้ามร้องเพลงส่งศพให้คนที่ยังหายใจ เพลงจะไปเรียกสิ่งที่ไม่ควรเรียกมาก่อนเวลา พ่อบ้านยืนอยู่ที่ประตู ส่ายหน้าช้าๆ
  choices:
    - id: sing_it_now
      label: ร้องให้ท่านฟังคืนนี้
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ร้องเพลงส่งศพทั้งเพลงในห้องนอนที่มีเทียนเล่มเดียว เสียงสูงสุดตอนท้ายเพลง {name}ร้องถึงได้ครั้งเดียวในปีนั้น คือคืนนั้น ท่านหลับตาฟังจนจบ แล้วบอกว่าท่อนที่สามช้าไปหน่อย ตอนงานจริงให้ร้องเร็วกว่านี้

          ท่านอยู่ต่ออีกสองหนาว ทุกครั้งที่เจอ{name}บนบันได ท่านฮัมท่อนที่สามให้ฟังในจังหวะที่ท่านชอบ
        effects: { alignment: { law: -1 }, flags: [sang_the_living_requiem] }
      failure:
        text: |
          เสียงสูงตอนท้ายเพลงไม่ขึ้น {name}ร้องตกลงไปครึ่งเสียง แล้วหยุด ท่านลืมตาขึ้น บอกว่าไม่เป็นไร เสียงคนแก่ก็เป็นแบบนี้ ตอนงานจริงให้หาคนเสียงดีกว่านี้มาร้อง

          สามวันต่อมาท่านจ้างนักร้องหนุ่มจากเวนทราสมาเป็นนักร้องคนที่สองของบ้าน
        effects: { flags: [lost_the_high_note] }
    - id: teach_the_young
      label: สอนนักร้องรุ่นเด็กให้ร้องเพลงนั้น แล้วให้ร้องจากนอกประตู
      check: { stat: INT, dc: 12 }
      success:
        text: |
          {name}เลือกนักร้องรุ่นเด็กคนที่เสียงสูงที่สุด สอนเพลงส่งศพทีละท่อนในห้องดนตรีที่ปิดประตู ไม่ให้พ่อบ้านรู้ เด็กคนนั้นจำได้ในเจ็ดวัน คืนที่แปด{name}พาเขาไปยืนหน้าประตูห้องนอน ร้องจากนอกประตู ไม่ใช่ในห้อง

          ท่านฟังจนจบ ตอนเช้าท่านถามพ่อบ้านว่าเมื่อคืนใครร้องเพลง พ่อบ้านบอกว่าไม่มีใครร้อง ท่านหัวเราะ
        effects: { stats: { INT: 1 }, flags: [taught_requiem] }
      failure:
        text: |
          เด็กคนนั้นร้องท่อนที่สามผิดสองคำ เป็นคำที่เพลงส่งศพไม่ใช้ เพราะเป็นคำของเพลงงานแต่ง ท่านได้ยินจากนอกประตู หัวเราะจนไอ แล้วสั่งว่าในงานจริงให้ร้องผิดแบบนี้ด้วย
        effects: { flags: [taught_requiem] }
    - id: keep_the_custom
      label: บอกท่านว่าเพลงนั้นมีไว้ให้คนที่ยังอยู่
      text: |
        {name}นั่งลงข้างเตียง บอกว่าเพลงนั้นร้องได้ครั้งเดียว และครั้งนั้นเป็นของคนที่ยังอยู่ ไม่ใช่ของท่าน ท่านฟังแล้วถอนหายใจ ขอให้ร้องเพลงอื่นแทน เพลงที่ร้องในงานเลี้ยงวันเกิดท่านเมื่อสามสิบปีก่อน

        {name}ร้องเพลงนั้นจนจบ ร้องถึงทุกเสียง ท่านหลับไปตอนท่อนสุดท้าย พ่อบ้านดับเทียนให้
      effects: { alignment: { law: 1 }, stats: { CON: 1 }, flags: [kept_the_requiem_custom] }
    - id: write_his_requiem
      label: แต่งเพลงส่งศพใหม่ ซ่อนเรื่องของท่านไว้ในนั้น แบบที่เคยซ่อนเรื่องสองพันเหรียญ
      requires: { flag: sang_the_secret }
      text: |
        {name}แต่งเพลงส่งศพใหม่ทั้งเพลง ไม่ใช้เพลงเก่าของบ้าน ท่อนแรกเป็นเรื่องเด็กชายที่ตกม้าตอนห้าขวบ ท่อนที่สองเป็นเรื่องหนี้ก้อนหนึ่ง ท่อนที่สามเป็นเรื่องเสียงหนึ่งเสียงในสภาที่เจ้าของเลือกเองว่าจะให้ใคร ไม่มีชื่อคน ไม่มีตัวเลข คนที่รู้เรื่องจะรู้ คนที่ไม่รู้ก็ได้ยินแค่เพลงเศร้า

        {name}ไม่ได้ร้องให้ท่านฟัง ส่งเนื้อเพลงให้ท่านอ่านแทน ท่านอ่านจบแล้วพับเก็บไว้ใต้หมอน บอกว่าธรรมเนียมห้ามร้อง ไม่ได้ห้ามอ่าน
      effects: { stats: { INT: 1 }, flags: [wrote_hedriks_requiem] }

- id: adult.mid_switch_ranger
  stage: adult
  weight: 15
  when:
    age: [26, 31]
    class: ranger
  text: |
    หน้าแล้งปีหนึ่ง ครูพรานคนแรกของ{name}ฝากข่าวมากับคนต้อนแพะ ข่าวไม่ได้เขียน ฝากมาเป็นคำพูด สามเรื่อง คนต้อนแพะท่องมาตลอดทางจนจำได้แม่น

    เรื่องแรก กระดานค่าหัวในโรงเตี๊ยมทุกถิ่นมีประกาศมากกว่าคนรับ เรื่องที่สอง คนนำทางรุ่นเก่าในช่องเขากับแดนเถ้าตายหรือเลิกไปครึ่งหนึ่ง ทางที่เคยมีคนพาเดิน ตอนนี้ไม่มีใครพา เรื่องที่สาม หอนับดาวไอเลธกับบริษัทเหมืองแย่งกันจ้างคนเดินทำแผนที่ จ่ายแข่งกันจนคนเดินแผนที่ได้เป็นฝ่ายเลือก

    คนต้อนแพะบอกว่ามีเรื่องที่สี่ด้วย แต่จำไม่ได้แล้ว
  choices:
    - id: stay
      label: ให้คนต้อนแพะค้างคืน แล้วออกไปทำงานเดิมในเช้าวันรุ่งขึ้น
      text: |
        {name}ให้คนต้อนแพะนอนค้างหนึ่งคืน เลี้ยงข้าวหนึ่งมื้อ ตอนเช้าก่อนเขาไป เขานึกเรื่องที่สี่ออก ครูพรานฝากบอกว่าให้{name}ทำงานที่ทำอยู่ให้ดีที่สุด ไม่ต้องตอบข่าวนี้ก็ได้

        {name}ทำงานเดิมต่อ หน้าแล้งปีนั้นเดินไกลกว่าทุกปี
      effects: { stats: { DEX: 1 } }
    - id: to_bounty
      label: ไปรับงานจากกระดานค่าหัว
      requires: { not_flags: [job_bounty_hunter] }
      text: |
        กระดานค่าหัวในโรงเตี๊ยมใหญ่ของถิ่นมีประกาศติดซ้อนกันสามชั้น ชั้นล่างสุดกระดาษเหลืองจนอ่านไม่ออก {name}ฉีกแผ่นบนสุดลงมาหนึ่งแผ่น หมาป่าฝูงหนึ่งที่กินแกะในหุบเหนือ

        เจ้าของโรงเตี๊ยมเขียนชื่อ{name}ลงสมุดคนรับงาน ต่อท้ายชื่อที่มีขีดฆ่าอยู่ครึ่งหน้า แล้วบอกว่าถ้ากลับมาได้ เหล้าแก้วแรกเขาเลี้ยง
      effects: { flags: [job_bounty_hunter], clear_flags: [job_guide, job_scout], stats: { DEX: 1 } }
    - id: to_guide
      label: รับพาคนข้ามช่องเขากับแดนเถ้า
      requires: { min_stat: { WIS: 13 }, not_flags: [job_guide] }
      text: |
        ลูกค้าคนแรกเป็นพ่อค้าเกลือสองคนกับล่อหกตัว จะข้ามช่องเขาไปถิ่นอื่นในเจ็ดวัน คนนำทางคนเก่าของพวกเขาตกเขาตายเมื่อหน้าหนาว {name}เดินนำไปตามทางที่ครูพรานเคยพาเดินตอนเด็ก จำได้แทบทุกโค้ง

        ถึงปลายทาง พ่อค้าเกลือจ่ายสามเหรียญ แล้วนัด{name}ไว้อีกเที่ยวก่อนหน้าหนาว
      effects: { flags: [job_guide], clear_flags: [job_bounty_hunter, job_scout], gold: 3 }
    - id: to_scout
      label: รับจ้างเดินทำแผนที่
      requires: { not_flags: [job_scout] }
      text: |
        หอนับดาวไอเลธจ่ายน้อยกว่าบริษัทเหมือง แต่ให้แผนที่เปล่าที่ขอบกระดาษมีลายมือเอลฟ์จดไว้ว่าอยากรู้อะไร บริษัทเหมืองจ่ายมากกว่า และอยากรู้แค่ว่าตรงไหนมีถ่าน {name}รับงานของทั้งสองที่ในฤดูเดียว ใช้สมุดคนละเล่ม

        วันที่สิบของการเดิน {name}เจอลำธารที่ไม่มีบนแผนที่ฉบับไหน วาดลงสมุดทั้งสองเล่ม เล่มหนึ่งวาดแต่ลำธาร อีกเล่มวาดแต่หินดำที่ก้นลำธาร
      effects: { flags: [job_scout], clear_flags: [job_bounty_hunter, job_guide], stats: { INT: 1 } }

- id: adult.mid_switch_bard
  stage: adult
  weight: 15
  when:
    age: [26, 31]
    class: bard
  text: |
    คืนหนึ่งคนแปลกหน้าคนหนึ่งร้องเพลงของ{name}ในตลาด ร้องผิดท่อนที่สอง ผิดตรงเดียวกับที่{name}ร้องผิดในคืนแรกที่ร้องเพลงนั้นเมื่อหลายปีก่อน

    คืนเดียวกันมีคนมาหาสามคน คนแรกเป็นนักแสดงคณะละครเร่ของมาริเดล คณะขาดคนเล่นบทใหญ่ คนที่สองเป็นเจ้าของโรงเตี๊ยมใหญ่ที่อยากได้คนร้องข่าวประจำ คนที่สามเป็นพ่อบ้านของบ้านขุนนางในเวนทราส บ้านนั้นขาดนักร้องประจำบ้านมาตั้งแต่ต้นปี

    ทั้งสามคนเริ่มด้วยประโยคเดียวกัน ว่าได้ยินเพลงของ{name}มาจากคนอื่น
  choices:
    - id: stay
      label: ขอบคุณทั้งสามคน แล้วร้องเพลงต่ออย่างเดิม
      text: |
        {name}ร้องเพลงนั้นให้ทั้งสามคนฟังอีกรอบ ร้องท่อนที่สองแบบที่ควรเป็น คืนนั้นไม่คิดเงินใคร ทั้งสามคนกลับไปตามทางของตัวเอง ทิ้งเหรียญไว้ในหมวกสองเหรียญ

        คืนต่อๆ มาในตลาด คนแปลกหน้าคนนั้นยังร้องผิดท่อนที่สองเหมือนเดิม {name}ปล่อยไว้อย่างนั้น
      effects: { gold: 2, alignment: { law: 1 } }
    - id: to_troupe
      label: ไปเข้าคณะละครเร่ของมาริเดล
      requires: { not_flags: [job_troupe] }
      text: |
        คณะของมาริเดลลากเกวียนสามเล่มเข้าลานตลาดตอนบ่าย มาริเดลยื่นบทให้{name}อ่านหนึ่งบท บทผู้กล้าคนที่สองในเรื่องคืนที่เสาฟ้าหัก แล้วบอกว่าคนเล่นบทนี้คนก่อนแต่งงานไปกับลูกชาวนาในถิ่นที่แล้ว

        คืนนั้น{name}เล่นบทนั้นครั้งแรก ตายในฉากที่สองตามบท แล้วนอนฟังจอมมารพูดบทยาวจากพื้นไม้ จนจำได้ครึ่งบท
      effects: { flags: [job_troupe], clear_flags: [job_news_walker, job_house_singer], stats: { DEX: 1 } }
    - id: to_news
      label: ไปเป็นคนร้องข่าวประจำโรงเตี๊ยม
      requires: { not_flags: [job_news_walker] }
      text: |
        เจ้าของโรงเตี๊ยมให้{name}ร้องข่าวทุกคืนตั้งแต่จุดตะเกียงถึงเที่ยงคืน แลกกับข้าวหนึ่งมื้อ ห้องใต้หลังคา และเหรียญในหมวกทั้งหมด ข่าวหาเอง ร้องเอง ผิดเอง

        คืนแรก{name}ร้องข่าวราคาข้าว ข่าวเรือเข้าท่า กับข่าวขุนนางที่ขายบ้าน หมวกได้สองเหรียญ
      effects: { flags: [job_news_walker], clear_flags: [job_troupe, job_house_singer], gold: 2, stats: { INT: 1 } }
    - id: to_house_singer
      label: ไปเป็นนักร้องประจำบ้านขุนนางในเวนทราส
      requires: { min_stat: { CHA: 15 }, not_flags: [job_house_singer, race_tiefling] }
      text: |
        พ่อบ้านพา{name}เข้าทางประตูคนใช้ ขึ้นบันไดหลังสามชั้น ไปยืนร้องเพลงหนึ่งเพลงให้เจ้าของบ้านฟังในห้องอ่านหนังสือ เจ้าของบ้านไม่เงยหน้าจากกระดาษตลอดเพลง พอเพลงจบท่านบอกพ่อบ้านว่าให้ห้องที่ระเบียง

        ห้องของนักร้องประจำบ้านอยู่เหนือห้องโถง ผนังด้านหนึ่งติดกับห้องอ่านหนังสือ
      effects: { flags: [job_house_singer], clear_flags: [job_troupe, job_news_walker], location_tag: ventras, reputation: { crown: 1 } }
    - id: to_house_singer_hidden
      label: ไปเป็นนักร้องประจำบ้านขุนนางในเวนทราส
      requires: { flag: horns_sawn, min_stat: { CHA: 15 }, not_flags: [job_house_singer] }
      text: |
        นักร้องในเวนทราสทุกคนสวมหมวกผ้าทรงสูงเวลาร้องในงานเลี้ยง {name}ใส่มาตั้งแต่ประตูคนใช้ ปิดตอเขาได้มิด พ่อบ้านพาขึ้นบันไดหลังสามชั้น ไปยืนร้องเพลงหนึ่งเพลงให้เจ้าของบ้านฟังในห้องอ่านหนังสือ เจ้าของบ้านไม่เงยหน้าจากกระดาษตลอดเพลง พอเพลงจบท่านบอกพ่อบ้านว่าให้ห้องที่ระเบียง

        ห้องของนักร้องประจำบ้านอยู่เหนือห้องโถง ผนังด้านหนึ่งติดกับห้องอ่านหนังสือ คืนแรก{name}ถอดหมวกได้ก็ต่อเมื่อลงกลอนประตูแล้ว
      effects: { flags: [job_house_singer], clear_flags: [job_troupe, job_news_walker], location_tag: ventras, reputation: { crown: 1 } }
