# ชุด 3b–3c เหตุการณ์ของโลก ปี 318 ถึง 340
# จุดยึดสี่ครั้ง (must: true) ไม่ผูกกับถิ่น ใครอายุ 19 ขึ้นไปในปีนั้นต้องเจอ ระบบหยิบให้ทันทีที่เข้าเงื่อนไข
# ช่วงอายุถึง 70 เพราะคนที่เกิดปี 270 อายุ 67 แล้วในปี 337 จุดยึดเป็นเรื่องของทั้งถิ่น ข้อความจึงห้ามเดาว่าตัวละครยังหนุ่มสาว
#   318 กษัตริย์สิ้น ห้ามบอกว่ารัชทายาทคนไหนได้บัลลังก์
#   324 คืนที่ดาวหรี่ ห้ามบอกสาเหตุ มีแต่คนเดา
#   332 หนี้สงครามถ่านครบกำหนด ห้ามบอกผลการลงเสียงของคนแคระ
#   337 หอดูดาวหลวงนับได้เกินหมื่น
# จุดยึด 332 แยกฉบับคนแคระ (adult.world_debt_due_dwarf) อีกห้าเรื่องคือดาวที่เร่งขึ้นช่วงปี 330 ถึง 340 (ฝันร่วมแยกฉบับทีฟลิ่ง) ทีฟลิ่งไม่ได้ยินเสียงหึ่งและไม่ฝันร่วม ห้ามเขียนว่าเพราะอะไร

# ---------- 318 กษัตริย์สิ้น ----------
- id: adult.world_king_dies
  stage: adult
  weight: 500
  must: true
  mark: กษัตริย์สิ้น
  when:
    age: [19, 70]
    year: [318, 319]
  text: |
    คนส่งข่าวหลวงมาถึงถิ่นตอนสาย ม้าที่ขี่มาไม่ใช่ตัวที่ออกจากเวนทราส เขาเปลี่ยนม้ามาแล้วสี่ตัวตามทาง เขาตอกประกาศขอบดำไว้ตรงที่คนผ่านมากที่สุด ดื่มน้ำหนึ่งกระบวย แล้วขึ้นม้าไปถิ่นถัดไปก่อนใครจะอ่านจบ

    กษัตริย์สวรรคตแล้วเมื่อเจ็ดคืนก่อน ประกาศบอกแค่นั้น กับให้ไว้ทุกข์สามสิบวัน ไม่ได้บอกว่าใครจะขึ้นแทน

    อีกสามวันมีประกาศมาตอกข้างกันอีกสองแผ่น แผ่นหนึ่งขอบขาว ประทับตราตะเกียงแขวนของศาสนจักร บอกว่าบัลลังก์เป็นของเจ้าชายฮาลเวริน โอรสองค์โต ผู้ไปสวดที่วิหารเวรัสทุกเช้ามาตั้งแต่เจ็ดขวบ อีกแผ่นขอบเทา ประทับตาชั่งเหล็กคล้องโซ่ บอกว่าเจ้าหญิงเซลีมาร์ ธิดาองค์รอง ลงชื่อต่อหน้าเบเลคแล้วว่าจะรับหนี้ทุกบรรทัดของบัลลังก์ไว้เอง สองแผ่นเขียนเหมือนกันอยู่บรรทัดเดียว คือราชวงศ์นี้สืบเลือดมาจากผู้กล้า

    พอถึงวันที่ห้า คนในถิ่นเริ่มผูกผ้าที่ต้นแขน ผ้าขาวบ้าง ผ้าเทาบ้าง ร้านผ้าขายผ้าเทาหมดก่อน แล้วขึ้นราคาผ้าขาว
  choices:
    - id: white_band
      label: ผูกผ้าขาวที่ต้นแขน
      text: |
        นักบวชตะเกียงสองคนเดินแจกผ้าขาวมาถึงถิ่นในวันที่หก คนหนึ่งผูกให้กับมือ ปมแน่นสองชั้น อีกคนจดชื่อลงสมุด เสมียนเบเลคที่ตั้งโต๊ะอยู่ฝั่งตรงข้ามมองมือของ{name}ตั้งแต่ยื่นแขนจนผูกเสร็จ แล้วจดอะไรลงสมุดของตัวเองบ้าง

        ผ้าขาวสกปรกเร็ว {name}ซักทุกสามวันจนผ้าบางลงเท่าผ้าพันแผล ปลายเดือนนักบวชคนเดิมเดินผ่านมา เห็นผ้ายังอยู่ที่แขนก็ยิ้มให้ จำชื่อได้โดยไม่ต้องเปิดสมุด
      effects: { reputation: { lamp_church: 1, belek_bank: -1 }, flags: [wore_white_band] }
    - id: grey_band
      label: ผูกผ้าเทาที่ต้นแขน
      text: |
        ผ้าเทาหมดร้านไปแล้ว {name}ตัดผ้าขี้ริ้วสีหม่นจากก้นหีบเป็นแถบยาว ผูกเองด้วยมือเดียวกับฟัน เสมียนเบเลคเห็นแล้วไม่ถามว่าผ้ามาจากไหน จดชื่อลงสมุดบรรทัดเดียวกับคนที่ซื้อผ้าเทาจากร้าน

        ตกเย็นมีผ้าเทาผืนใหม่วางอยู่หน้าประตูบ้าน พับเป็นสี่เหลี่ยมเรียบร้อย ไม่มีชื่อคนส่ง {name}ใช้ผืนใหม่จนครบสามสิบวัน ผืนขี้ริ้วเก็บไว้เช็ดมือ
      effects: { stats: { DEX: 1 }, reputation: { belek_bank: 1, lamp_church: -1 }, flags: [wore_grey_band] }
    - id: black_only
      label: ไม่ผูกสีไหน พันผ้าดำไว้ทุกข์ให้กษัตริย์ตามประกาศแผ่นแรก
      text: |
        ผ้าดำผืนที่เคยใช้ไว้ทุกข์ให้คนในบ้าน {name}พันรอบแขนให้ครบสามสิบวันตามที่ประกาศแผ่นแรกบอก คนผ้าขาวกับคนผ้าเทาเดินผ่านแล้วชำเลืองมองผ้าดำทุกคน เหมือนอยากถามว่าข้างไหน แต่ไม่มีใครถาม

        วันที่สามสิบ คนของราชสำนักขี่ม้ามาปลดประกาศขอบดำ เขาหยุดม้าตรงหน้า{name} ถามชื่อ แล้วจดไว้ด้านหลังประกาศแผ่นเก่า พับใส่ย่ามไปพร้อมกัน
      effects: { alignment: { law: 1 }, reputation: { crown: 1 }, flags: [mourned_the_king] }
    - id: tear_both
      label: แอบงัดประกาศสองแผ่นหลังลงตอนกลางคืน เหลือไว้แต่แผ่นขอบดำ
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ประกาศแผ่นละสี่ตะปู {name}งัดด้วยปลายมีดทีละตัวจนหลุดหมดโดยไม่มีเสียง ม้วนประกาศสองแผ่นยัดเข้าเตาที่บ้าน ไฟติดกระดาษดีกว่าฟืน

          เช้านั้นคนในถิ่นยืนอ่านประกาศแผ่นเดียวที่เหลือกันซ้ำแล้วซ้ำอีก เหมือนเพิ่งรู้ข่าวกษัตริย์สวรรคต สามวันต่อมามีประกาศใหม่มาตอกแทน สองแผ่นเหมือนเดิม แผ่นละแปดตะปู
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [tore_the_heir_notices] }
      failure:
        text: |
          ตะปูตัวที่สามงอคามีด {name}ออกแรงมากไป ไม้ที่ตอกประกาศหลุดลงมาทั้งแผ่น เสียงดังไปทั้งลาน หมาเห่ากันทั้งถิ่น หน้าต่างเปิดขึ้นสามบาน

          {name}วิ่งกลับบ้านพร้อมประกาศขอบขาวที่ยังติดมืออยู่ครึ่งแผ่น หลังมือมีรอยตะปูข่วนยาวถึงข้อ วันต่อมานักบวชตะเกียงมาถามทุกบ้านว่าเมื่อคืนใครออกไปข้างนอก ถามบ้าน{name}นานกว่าบ้านอื่น
        effects: { hp: -1, alignment: { law: -1 }, reputation: { lamp_church: -1 }, flags: [tore_the_heir_notices] }

# ---------- 324 คืนที่ดาวหรี่ ----------
- id: adult.world_dim_night
  stage: adult
  weight: 500
  must: true
  mark: คืนที่ดาวหรี่
  when:
    age: [19, 70]
    year: [324, 325]
  text: |
    คืนนั้นฟ้าเปิดทั้งฟ้า ไม่มีเมฆสักก้อน แต่พอ{name}เงยหน้าขึ้นไปตอนหัวค่ำ ฟ้าดูว่างกว่าเมื่อคืน

    ดาวดวงใหม่หรี่ลงพร้อมกันทั้งฟ้า ไม่ได้ดับ ยังเห็นเป็นจุดซีดเหมือนถ่านใต้ขี้เถ้า ดาวเก่าสว่างเท่าเดิมทุกดวง ฟ้าแบบที่คนแก่เล่าว่าเคยเห็นตอนเด็กกลับมาอยู่เหนือหัวหนึ่งคืน จานรับดาวทุกใบหงายรอทั้งคืนโดยไม่ได้น้ำค้างสักหยด ตะเกียงฟ้าที่จุดไว้ก่อนแล้วยังสว่างดีทุกดวง

    คนออกมายืนกันที่ลานจนดึก เดากันไปคนละทาง คนแก่บอกว่าเทพกำลังนับดาวใหม่ คนที่เพิ่งกลับจากเมืองบอกว่าเปลือกฟ้าซ่อมตัวเอง นักบวชตะเกียงบอกว่านี่คือคำเตือน แต่ไม่บอกว่าเตือนเรื่องอะไร คนงานเหมืองเก่าคนหนึ่งบอกว่าคนข้างในพลิกตัว พอมีคนถามว่าข้างในไหน เขาก็ลุกกลับบ้าน

    คนทำงานกะดึกโรงกลั่นที่มาเยี่ยมญาตินั่งอยู่ที่ขอบบ่อ เอามือป้องหูทั้งสองข้าง เอาออก แล้วป้องอีก เขาบอกว่าเสียงที่ดังอยู่ในหูมาทั้งชีวิตเงียบไปตั้งแต่หัวค่ำ เงียบจนนอนไม่ลง
  choices:
    - id: count_patch
      label: ทาบกรอบหน้าต่างกับฟ้า นับดาวที่ยังสว่างเทียบกับที่จำได้
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ฟ้าในกรอบหน้าต่างบานนี้{name}นับมาเกือบทุกคืนที่นอนไม่หลับ จำได้ว่าเมื่อคืนมีสี่สิบเอ็ดดวง คืนนี้ดวงที่สว่างพอจะนับได้เหลือสิบสอง ทั้งสิบสองดวงอยู่ที่เดิม ไม่ขยับแม้แต่ดวงเดียว

          {name}เขียนตัวเลขสองตัวไว้ที่ขอบหน้าต่างด้วยถ่าน สี่สิบเอ็ด กับสิบสอง คืนต่อมาดาวกลับมาครบสี่สิบเอ็ด ตัวเลขยังอยู่ที่ขอบหน้าต่าง {name}ไม่ได้ลบ
        effects: { stats: { INT: 1 }, flags: [counted_the_dim_night] }
      failure:
        text: |
          นับได้ยี่สิบกว่าดวงก็หลง ดาวซีดๆ ดวงหนึ่งหายไปตอนกะพริบตา แล้วโผล่มาอีกที่ {name}นับใหม่สามรอบได้ตัวเลขสามตัว จนตีสามก็ยังนั่งนับอยู่

          ใกล้สาง ดาวทุกดวงจางไปพร้อมกันตามปกติ ดวงเก่าดวงใหม่จางเท่ากันหมด จนแยกไม่ออกอีกว่าดวงไหนเป็นดวงไหน
        effects: { stats: { CON: 1 } }
    - id: dead_bottle
      label: ไปดูขวดน้ำค้างดาวที่เจ้าของร้านค้าเปิดฝาตั้งทิ้งไว้บนขอบบ่อ
      habit: curious
      text: |
        เจ้าของร้านค้าในถิ่นเอาขวดน้ำค้างดาวขวดหนึ่งมาตั้งไว้บนขอบบ่อตั้งแต่หัวค่ำ เปิดฝาไว้ อยากรู้ว่าคืนแบบนี้มันจะรับแสงได้หรือเปล่า พอสาง ดาวดวงใหม่สว่างคืนมาทุกดวง ขวดอื่นในร้านเรืองฟ้าเหมือนเดิม ขวดบนขอบบ่อใสเหมือนน้ำในบ่อ ปิดฝาแล้วเขย่าก็ไม่เรือง

        เขายกให้{name}เฉยๆ บอกว่าขวดที่ขายไม่ได้อย่าให้อยู่ในร้าน {name}เก็บไว้ที่หัวนอน บางคืนตื่นขึ้นมาแตะดู น้ำในขวดเย็นกว่าทุกอย่างในห้อง
      effects: { items: [dim_night_vial], flags: [kept_dim_night_vial] }
    - id: pray
      label: คุกเข่าลงกลางลาน สวดไปกับคนแก่ที่บอกว่าเทพกำลังนับดาว
      text: |
        คนแก่สวดบทนับ บทที่ไล่ชื่อเทพทีละองค์ แล้วเว้นว่างไว้หนึ่งจังหวะตรงที่เคยเป็นชื่ออัสเทล ทุกคนหยุดหายใจตรงจังหวะนั้นพร้อมกันเหมือนซ้อมกันมา {name}เพิ่งรู้ว่าบทสวดนี้มีช่องว่าง

        สวดจนดาวกลับมา เข่าเย็นจนต้องให้คนข้างๆ ช่วยดึงขึ้น คนแก่ที่นำสวดบอกว่าเห็นไหม เทพนับเสร็จแล้ว แกพูดเสียงดังเหมือนพูดให้คนที่ไม่ได้มาสวดได้ยินด้วย
      effects: { world: { gods: 1 }, alignment: { law: 1 }, flags: [prayed_on_dim_night] }
    - id: warm_horns
      label: ยืนอยู่ห่างๆ เอามือแตะโคนเขาที่อุ่นขึ้นเองตั้งแต่หัวค่ำ
      requires: { trait: curse_brand }
      text: |
        โคนเขาของ{name}อุ่นขึ้นทีละนิดตั้งแต่หัวค่ำ อุ่นเหมือนวางมือไว้ใกล้เตาที่เพิ่งดับ ไม่เจ็บ ไม่คัน อุ่นอยู่ตรงนั้นที่เดียว

        คนทำงานกะดึกหันมาถาม{name}ว่าได้ยินไหม มันหยุดแล้ว {name}ถามกลับว่าอะไรหยุด เขาจ้องหน้า{name}ครู่หนึ่ง แล้วหันกลับไปป้องหูเหมือนเดิม โคนเขาเย็นลงตอนไหน{name}ไม่ทันรู้ตัว ตอนสางลองแตะดูอีกที ก็เย็นเท่าผิวตรงอื่นแล้ว
      effects: { flags: [horns_warm_dim_night] }

# ---------- 332 หนี้สงครามถ่านครบกำหนด ----------
- id: adult.world_debt_due
  stage: adult
  weight: 500
  must: true
  mark: หนี้สงครามถ่านครบกำหนด
  when:
    age: [19, 70]
    year: [332, 333]
    not_flags: [race_dwarf]
  text: |
    หนี้สงครามถ่านครบกำหนดปีนี้ สามสิบเอ็ดปีหลังคนแคระแพ้ คนในถิ่นของ{name}รู้แค่ว่าหนี้นี้มีอยู่ เหมือนรู้ว่าแม่น้ำมีต้นน้ำ จนวันที่ขบวนรถถ่านจากทุนดาร์ไม่มาตามวัน

    ขบวนแรกไม่มา ขบวนที่สองไม่มา ข่าวตามมาทีหลังว่าช่างหินในทุนดาร์สลักขีดสุดท้ายใต้หนี้ไปแล้ว แต่ราชสำนักบอกว่ายังจ่ายไม่ครบ ขอต่ออีกสิบปี สภาตระกูลจึงหยุดส่งถ่านทุกขบวนระหว่างที่คนแคระลงเสียงกันว่าจะเอาอย่างไร

    สิบวันนั้นถ่านในเมืองราคาขึ้นสามเท่า โรงตีเหล็กดับเตาไปครึ่งหนึ่ง เตาอบขนมปังอบวันเว้นวัน ห้องเช่าหลายห้องนอนกันทั้งเสื้อคลุม ที่ปากหลุมในแดนเถ้ากลับเป็นอีกแบบ ถ่านกองสูงขึ้นทุกวันเพราะไม่มีรถมาขน คนขุดไม่ได้ค่าแรงไปสิบวันเต็ม วันที่สิบเอ็ดขบวนแรกกลับมา ตู้ถ่านว่างไปครึ่งขบวน คนขับบอกแค่ว่าเขาได้มาเท่านี้
  choices:
    - id: buy_early
      label: จ่ายสามเหรียญซื้อถ่านตุนไว้ตั้งแต่ขบวนแรกไม่มา
      requires: { min_gold: 3 }
      text: |
        วันที่ขบวนแรกไม่มา สามเหรียญยังซื้อถ่านได้สองกระสอบ {name}แบกกลับบ้านทีละกระสอบ อีกสามวันต่อมา สามเหรียญซื้อได้กระสอบเดียว พอถึงวันที่เจ็ดไม่มีถ่านขายแล้วไม่ว่าราคาเท่าไร

        บ้าน{name}เป็นบ้านเดียวในแถวที่ควันขึ้นปล่องทุกเช้า เด็กข้างบ้านมายืนผิงมือที่หน้าต่างครัวทุกวัน {name}เปิดหน้าต่างให้กว้างขึ้นอีกนิด
      effects: { gold: -3, stats: { INT: 1 }, flags: [hoarded_coal_332] }
    - id: burn_old
      label: รื้อเก้าอี้หักกับรั้วเก่ามาผ่าเป็นฟืนแทนถ่าน
      text: |
        เก้าอี้ขาหักสองตัว รั้วไม้หลังบ้านสามช่วง กับหีบผุที่ไม่ได้เปิดมาหลายปี {name}ผ่าทั้งหมดเป็นฟืนกองสูงถึงเอว ไม้เก่าติดไฟเร็วและหมดเร็ว ต้องลุกมาเติมทั้งคืน

        ในหีบมีของที่ลืมไปแล้วว่าเก็บไว้ รองเท้าเด็กข้างเดียว ลูกข่างที่เชือกขาด ผ้าพันคอที่ถักค้างไว้ครึ่งผืน {name}เอาออกมาวางบนโต๊ะก่อนจะผ่าหีบ ลูกข่างอันนั้นถือไว้ในมือจนไฟในเตาเกือบมอด แล้วก็วางกลับลงบนโต๊ะ ไม่ได้โยนเข้าเตา
      effects: { stats: { CON: 1 }, flags: [burned_the_old_chest] }
    - id: haul_for_crown
      label: รับจ้างราชสำนักขนถ่านจากโกดังหลวงไปแจกโรงขนมปังกับโรงหมอ สองเหรียญ
      text: |
        โกดังหลวงประจำเขตเปิดประตูวันที่สี่ คนของราชสำนักจ้างคนแบกถ่านวันละหลายสิบคน {name}แบกกระสอบขึ้นเกวียนตั้งแต่เช้ามืดจนค่ำ ไหล่ถลอกเป็นรอยกระสอบ ได้สองเหรียญกับข้าวต้มหนึ่งชาม

        ถ่านในโกดังหลวงก้อนใหญ่และดำกว่าถ่านที่เคยซื้อในตลาด เสมียนโกดังบอกว่าเป็นถ่านที่เก็บไว้ตั้งแต่สงคราม ไม่เคยเอาออกมาใช้ เพิ่งได้ใช้ก็ปีนี้
      effects: { gold: 2, stats: { STR: 1 }, reputation: { crown: 1 }, flags: [hauled_crown_coal] }
    - id: veteran_cold
      label: นั่งดูเตาที่มอดลงทีละก้อน นึกถึงเถ้าในแดนเถ้าที่เคยยืนอยู่
      requires: { flag: war_veteran }
      text: |
        ถ่านทุกก้อนในกระสอบมาจากเหมืองที่{name}เคยไปรบแย่งเขามา เถ้าที่นั่นลึกถึงเข่า ลมพัดทีไรเข้าตาทุกคน {name}นึกออกว่าตอนนั้นคิดว่าถ้ากลับบ้านได้จะไม่บ่นเรื่องหนาวอีก

        คืนที่สามถ่านหมด {name}นั่งดูเถ้าในเตาเย็นลง แล้วนับชื่อคนในหน่วยที่ยังจำได้ทีละชื่อ จนถึงชื่อสุดท้ายก็ไม่หนาวแล้ว หรือหนาวจนไม่รู้สึก
      effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [veteran_cold_winter_332] }

- id: adult.world_debt_due_dwarf
  stage: adult
  weight: 500
  must: true
  mark: หนี้สงครามถ่านครบกำหนด
  when:
    age: [19, 70]
    year: [332, 333]
    flags: [race_dwarf]
  text: |
    ปีนี้ช่างหินสลักขีดสุดท้ายใต้หนี้สงครามถ่าน ขีดนั้นลงตรงขอบกำแพงพอดี ไม่มีหินเรียบเหลืออีกแม้แต่ช่องเดียว แต่ทูตราชสำนักที่ขึ้นมาดูการสลักบอกว่ายังไม่ครบ ในสมุดบัญชีของบัลลังก์ คนแคระยังค้างอยู่อีกสามปี ราชสำนักจึงขอต่ออีกสิบปี

    สภาตระกูลไม่ตอบทูต หยุดส่งถ่านทุกขบวน แล้วส่งแผ่นหินชนวนไปให้คนแคระที่อายุครบทุกคน ไม่ว่าจะอยู่ในทุนดาร์หรือไปทำงานไกลแค่ไหน คนเดินแผ่นมาถึง{name}ในวันที่สาม รองเท้าสึกจนเห็นนิ้ว

    บนแผ่นมีสองช่อง ช่องค้อน แปลว่าไม่ต่อแม้แต่วันเดียว ให้ราชสำนักมาทวงเอาเอง ช่องประตูปิด แปลว่ายอมต่อสิบปี ส่งถ่านต่อไปเหมือนเดิม กรีดได้ช่องเดียว แล้วส่งคืนกับคนเดินแผ่นภายในเจ็ดวัน

    แผ่นที่มาถึงมือ{name}มีคนเอาดินสอเขียนไว้ที่มุมล่าง ตัวเล็กมาก ต้องเอียงแผ่นหาแสงถึงอ่านออก เปิดชั้นยี่สิบสาม
  choices:
    - id: hammer
      label: กรีดช่องค้อน
      text: |
        {name}กรีดเครื่องหมายค้อนจนชนวนเป็นร่องลึกถึงครึ่งแผ่น ลึกกว่าที่ต้องกรีด คนเดินแผ่นรับไปพลิกดูหน้าหลัง แล้วยัดใส่ย่ามรวมกับแผ่นอื่น ย่ามของเขาหนักจนสายย่ามบาดไหล่

        เขาบอกว่าแผ่นที่กรีดลึกขนาดนี้ เขาแบกมาเยอะแล้วตั้งแต่เช้า
      effects: { stats: { STR: 1 }, reputation: { dwarf_council: 1, crown: -1 }, flags: [voted_hammer_332] }
    - id: door
      label: กรีดช่องประตูปิด
      text: |
        {name}กรีดเครื่องหมายประตูให้เส้นตรงทุกเส้น ช้าๆ เหมือนตอนหัดสลักชื่อตัวเองครั้งแรก สิบปีอีกสิบขีด หินเรียบต้องต่อกำแพงออกไปอีกแผ่น

        คนเดินแผ่นรับไปโดยไม่ดูหน้าแผ่น เขาบอกว่าแผ่นประตูปิดมักกรีดตื้น คนกรีดกลัวคนอื่นจะได้ยินเสียง
      effects: { stats: { CON: 1 }, alignment: { law: 1 }, reputation: { crown: 1 }, flags: [voted_door_332] }
    - id: pencil_third
      label: ไม่กรีดสองช่องนั้น กรีดเครื่องหมายลงข้างตัวหนังสือดินสอที่มุมล่าง
      text: |
        {name}กรีดขีดเดียวสั้นๆ ข้างตัวหนังสือดินสอ แล้วเอานิ้วถูให้ผงชนวนกลบรอยดินสอไว้ คนเดินแผ่นรับไปโดยไม่ดู ใส่ลงช่องด้านในของย่าม แยกจากแผ่นอื่น

        คืนนั้น{name}นอนไม่หลับ ได้ยินเสียงเคาะสามทีที่ไหนสักแห่งข้างใต้พื้น เคาะช้าๆ แล้วเงียบไปจนเช้า
      effects: { alignment: { law: -1 }, world: { demon: 1 }, flags: [voted_open_23] }
    - id: names_instead
      label: ไม่กรีดช่องไหน สลักชื่อคนในหน่วยที่ไม่ได้กลับขึ้นมาลงบนแผ่นแทน
      requires: { flag: war_veteran }
      text: |
        {name}สลักชื่อลงแผ่นชนวนทีละชื่อด้วยปลายตะปู ชื่อตัวกับชื่อตระกูล เรียงจากชื่อที่ตายก่อน จนแผ่นเต็มทั้งสองหน้า ไม่มีที่เหลือให้กรีดช่องไหน

        คนเดินแผ่นอ่านชื่อแรกแล้วหยุด เขาบอกว่าชื่อนี้เป็นลุงของเขา แล้วเก็บแผ่นนั้นไว้ในเสื้อ ไม่ใส่ย่าม
      effects: { alignment: { moral: 1 }, reputation: { dwarf_council: 1 }, flags: [voted_with_names] }

# ---------- 337 นับดาวได้เกินหมื่น ----------
- id: adult.world_star_count
  stage: adult
  weight: 500
  must: true
  mark: ดาวเกินหมื่นดวง
  when:
    age: [19, 70]
    year: [337, 338]
  text: |
    หอดูดาวหลวงส่งคนเอาตัวเลขปีนี้ไปตอกทุกถิ่น ตัวเลขหมึกแดงตัวใหญ่กว่าทุกปี หนึ่งหมื่นสิบเจ็ดดวง ใต้ตัวเลขมีอีกบรรทัด ราชอาณาจักรนับดาวได้เกินหมื่นเป็นครั้งแรก ถิ่นไหนอยากฉลอง ราชสำนักออกค่าเหล้าให้ถิ่นละหนึ่งถัง

    คืนนั้นถิ่นของ{name}เปิดถังเหล้ากันที่ลาน มีคนเอาใบปลิวอีกแบบมาแจกไปพร้อมกัน กระดาษเนื้อหยาบ ลายมือยาวเอียงแบบเอลฟ์ ของหอนับดาวในป่าไอเลธ ทั้งแผ่นมีตัวเลขตัวเดียว หกพันสองร้อยสี่สิบแปด กับประโยคเดียว ที่เกินจากนี้ หอนับดาวยังไม่ยอมเรียกว่าดาว

    คนกลุ่มที่สามมาถึงทีหลังสุด เสื้อดีกว่าทุกคนในลาน ยืนแจกบัตรกระดาษหนาหมึกน้ำเงิน เชิญไปนั่งอ่านงานเขียนของอาจารย์โอเดล คอร์ดิส ด้วยกันในวันอัสเทลหน้า พวกเขาไม่ยื่นให้ทุกคน หยุดคุยกับแต่ละคนครู่หนึ่งก่อน แล้วถึงยื่นหรือไม่ยื่น
  choices:
    - id: drink
      label: ดื่มฉลองกับคนอื่นจนถังหมด
      text: |
        มีคนชูแก้วขึ้นแล้วนับดาวออกเสียง หนึ่ง สอง สาม ทั้งลานนับตาม นับถึงสามร้อยกว่าก็เริ่มเมา นับข้าม นับซ้ำ นับแข่งกันจนเหลือคนนับอยู่สองคน ถังเหล้าหมดก่อนดาวหมด

        {name}ตื่นมาตอนสายบนม้านั่งกลางลาน มีใบปลิวของเอลฟ์แผ่นหนึ่งห่มอยู่บนอก ใครห่มให้ไม่รู้ ตัวเลขบนใบปลิวเปียกน้ำค้างตอนเช้าจนหมึกซึม
      effects: { stats: { CON: 1 }, world: { star: 1 }, flags: [drank_to_ten_thousand] }
    - id: post_leaflets
      label: ช่วยคนของหอนับดาวติดใบปลิวไว้ข้างประกาศหลวง
      text: |
        คนแจกใบปลิวเป็นเอลฟ์หนุ่มที่พูดภาษาของเมืองได้ไม่คล่อง {name}ถือหม้อกาวเดินตามเขาไปทั่วถิ่น ทาเสาทุกต้นที่มีประกาศหลวง แล้วแปะใบปลิวไว้ข้างๆ ให้ตัวเลขสองตัวอยู่ระดับสายตาเดียวกัน

        ตอนเช้าใบปลิวหายไปครึ่งหนึ่ง เหลือแต่รอยกาว ครึ่งที่เหลือมีคนมายืนอ่านเทียบกับประกาศหลวง อ่านจากตัวเลขหนึ่งไปอีกตัวหนึ่ง แล้วแหงนดูฟ้าที่ยังสว่างไม่พอจะเห็นดาว
      effects: { stats: { DEX: 1 }, reputation: { star_hall: 1 }, flags: [posted_elf_leaflets] }
    - id: take_card
      label: รับบัตรเชิญไปวงอ่านหนังสือ
      requires: { not_flags: [race_tiefling] }
      text: |
        ชายที่ยื่นบัตรถาม{name}คำถามเดียวก่อนยื่น ว่าตอนกลางคืนเคยได้ยินเสียงต่ำๆ ไหม เสียงที่ดังอยู่ใต้เสียงอื่น {name}บอกว่าเคย ใครๆ ก็เคย เขายิ้ม แล้ววางบัตรลงในมือ{name}ด้วยมือทั้งสองข้าง

        บัตรใบนั้นเหน็บอยู่ข้างกรอบประตูจนถึงวันอัสเทล ลายมือสวยจน{name}อ่านซ้ำทุกครั้งที่เดินผ่าน
      effects: { stats: { INT: 1 }, world: { star: 1 }, reputation: { star_listeners: 1 }, flags: [took_reading_circle_card] }
    - id: card_withdrawn
      label: ยื่นมือไปรับบัตรเชิญ
      requires: { trait: curse_brand }
      text: |
        ชายที่ถือบัตรถาม{name}คำถามเดียว ว่าตอนกลางคืนเคยได้ยินเสียงต่ำๆ ไหม เสียงที่ดังอยู่ใต้เสียงอื่น {name}บอกว่าไม่เคย เขายิ้มกว้างขึ้นนิดหนึ่ง เก็บบัตรใบนั้นกลับเข้าอกเสื้อ บอกว่าวงนี้คงไม่สนุกสำหรับ{name} แล้วเดินไปหาคนถัดไป

        เช้าวันต่อมามีรูปดาวเจ็ดแฉกเขียนด้วยปูนขาวอยู่ที่กรอบประตูบ้าน ตัวเล็ก สูงแค่ระดับเข่า {name}เช็ดออก วันอัสเทลถัดมามันกลับมาอยู่ที่เดิม
      effects: { flags: [listeners_chalked_door] }

# ---------- ดาวเร่งขึ้น ปี 330 ถึง 340 ----------
- id: adult.world_dew_cheap
  stage: adult
  weight: 10
  scene: market
  when:
    age: [33, 70]
    year: [330, 340]
  text: |
    ปีนี้ตะเกียงฟ้าพร้อมน้ำค้างหนึ่งขวดราคาเหลือสองเหรียญ ดาวยิ่งเพิ่ม น้ำค้างยิ่งราคาตก พ่อค้าเร่ขนตะเกียงมาวางขายเต็มแผงจนถึงถิ่นที่ไม่เคยมีใครใช้ ถิ่นของ{name}ซื้อกันทีละบ้านสองบ้าน แล้วก็ทีละหลายบ้าน

    ร้านเทียนหัวตลาดปิดก่อนสิ้นหน้าหนาว ช่างเทียนแก่ยกหม้อขี้ผึ้งใบใหญ่ออกมาวางหน้าร้าน ติดป้ายขายครึ่งราคา ไม่มีใครซื้อ แกนั่งอยู่ข้างหม้อทั้งวัน มือยังมีกลิ่นไส้เทียน
  choices:
    - id: buy_lamp
      label: จ่ายสองเหรียญซื้อตะเกียงฟ้าหนึ่งดวงพร้อมขวด
      requires: { min_gold: 2 }
      text: |
        ตะเกียงฟ้าไม่มีควัน ไม่มีกลิ่น ไม่ต้องตัดไส้ แสงสีฟ้าสว่างกว่าเทียนสี่เล่มรวมกัน ทำให้ผิวทุกคนในบ้านดูเย็นเหมือนคนเพิ่งขึ้นจากน้ำ {name}นั่งอ่านหนังสือได้จนดึกเป็นครั้งแรกโดยไม่แสบตา

        คืนที่สาม มีแมลงตัวเล็กปีกใสมาเกาะที่กระจกตะเกียงตัวหนึ่ง เกาะนิ่งอยู่อย่างนั้นจนเช้า
      effects: { gold: -2, stats: { INT: 1 }, world: { star: 1 }, flags: [bought_dew_lamp] }
    - id: keep_candles
      label: ใช้เทียนที่เหลือต่อไป ทำงานกลางคืนด้วยมือให้มากขึ้น
      text: |
        {name}เก็บเทียนเล่มสั้นไว้ใช้แต่ตอนจำเป็น งานกลางคืนทำในความมืดเกือบทั้งหมด ร้อยเข็ม มัดเชือก ผ่าฟืน จนมือรู้ทางเองโดยไม่ต้องดู

        บ้านข้างๆ ตะเกียงฟ้าสว่างลอดรั้วมาถึงหน้าต่าง{name}ทุกคืน พอให้เห็นเงามือตัวเองบนผนัง
      effects: { stats: { DEX: 1 }, flags: [kept_the_candles] }
    - id: help_chandler
      label: ให้ช่างเทียนหนึ่งเหรียญ แล้วช่วยแบกหม้อขี้ผึ้งไปฝากขายที่ถิ่นที่ยังใช้เทียน
      habit: soft_heart
      requires: { min_gold: 1 }
      text: |
        หม้อขี้ผึ้งหนักเท่าคนหนึ่งคน {name}กับช่างเทียนผลัดกันแบกด้วยไม้คานเดินไปครึ่งวัน ถิ่นที่ยังใช้เทียนอยู่ปลายทางเกวียน ร้านที่นั่นรับฝากขายครึ่งหม้อ อีกครึ่งให้แบกกลับ

        ขากลับแกเอาเหรียญที่{name}ให้มาคืน {name}ไม่รับ แกจึงซื้อขนมปังสองก้อนด้วยเหรียญนั้น ให้{name}ก้อนหนึ่ง กินกันระหว่างทาง
      effects: { gold: -1, stats: { STR: 1 }, alignment: { moral: 1 }, flags: [helped_the_chandler] }

- id: adult.world_glass_skin
  stage: adult
  weight: 10
  when:
    age: [33, 70]
    year: [330, 340]
  text: |
    ผู้หญิงคนหนึ่งเดินมาถึงถิ่นพร้อมย่ามใบเดียว ถามหางานทุกบ้าน นางใส่ถุงมือหนังยาวถึงศอกในหน้าร้อน ใครถามก็ถอดให้ดู หลังมือทั้งสองข้างเป็นแผ่นใส เรียบเหมือนกระจกที่ฝนเพิ่งล้าง ข้างใต้มีแสงฟ้าเต้นเบาๆ ตามจังหวะหัวใจ แผ่นใสขึ้นไปถึงข้อศอกแล้ว นางบอกว่าล้างจานรับดาวในโรงกลั่นมายี่สิบปี

    ไม่มีบ้านไหนจ้าง ตกบ่ายนางมานั่งพักที่หน้าบ้าน{name} มองฟ้าที่ใสไม่มีเมฆ แล้วบอกว่าพรุ่งนี้บ่ายฝนจะตก ให้เก็บผ้าก่อนเที่ยง
  choices:
    - id: hire
      label: จ้างนางช่วยงานสามวัน สามเหรียญ
      requires: { min_gold: 3 }
      text: |
        นางทำงานเร็วและไม่บ่น วันแรกล้างทุกอย่างในบ้านที่ล้างได้ บ่ายวันที่สองฝนตกตามที่นางบอก ผ้าที่{name}เก็บไว้ตั้งแต่ก่อนเที่ยงแห้งทุกผืน ผ้าของบ้านอื่นในแถวเปียกทั้งราว

        เย็นวันที่สาม{name}นับสามเหรียญใส่มือนาง นางบอกว่าปีหน้าหลังคาด้านเหนือจะรั่วตรงมุม ให้เปลี่ยนกระเบื้องแผ่นที่สามจากสันก่อนหน้าฝน แล้วสะพายย่ามออกจากถิ่นไปทางที่มา
      effects: { gold: -3, flags: [hired_glass_woman] }
    - id: touch_glass
      label: ขอจับมือข้างที่เป็นแก้ว
      text: |
        นางถอดถุงมือให้โดยไม่ลังเล แผ่นใสเรียบ อุ่นเท่าผิวคน แสงฟ้าข้างใต้เต้นอยู่ใต้ฝ่ามือของ{name} เต้นช้ากว่าหัวใจของ{name}ครึ่งจังหวะ นางบอกว่าสองปีที่ผ่านมามีคนจับมือนางสองคน {name}เป็นคนที่สาม

        คืนนั้น{name}ฝันว่ายืนตากฝนอยู่กลางลาน ฝนเม็ดใหญ่และอุ่น บ่ายวันต่อมาฝนตกจริง ตกอุ่นแบบในฝันทุกเม็ด
      effects: { alignment: { moral: 1 }, world: { star: 1 }, flags: [touched_glass_skin] }
    - id: ask_how
      label: ถามนางว่ารู้ได้อย่างไรว่าฝนจะตก
      text: |
        นางคิดอยู่ครู่หนึ่งก่อนตอบ นางบอกว่าไม่ได้รู้ นางจำได้ จำเหมือนจำได้ว่าเมื่อวานกินอะไร แต่เป็นเรื่องของพรุ่งนี้ ช่วงแรกจำได้แต่เรื่องฝน ตอนนี้จำได้มากขึ้นทุกเดือน เรื่องที่จำได้ไม่เคยผิดสักครั้ง

        {name}ถามต่อว่าจำเรื่องของ{name}ได้ไหม นางมองหน้า{name} แล้วบอกว่าได้ แต่ไม่บอก เพราะเคยบอกคนหนึ่งไปแล้ว คนคนนั้นใช้ชีวิตที่เหลือรอให้มันเกิด
      effects: { stats: { INT: 1 }, flags: [asked_glass_woman] }
    - id: send_away
      label: บอกนางว่าที่นี่ไม่มีงาน
      text: |
        นางขอบคุณที่บอกตรงๆ แทนการเงียบใส่เหมือนบ้านอื่น แล้วสะพายย่ามเดินต่อไปทางท้ายถิ่น {name}ยืนดูจนนางลับไปหลังโค้งทาง

        บ่ายวันต่อมาฝนตกหนัก ผ้าบนราวของ{name}เปียกทุกผืน
      effects: { alignment: { law: 1 }, flags: [sent_glass_woman_away] }

- id: adult.world_hum_swarm
  stage: adult
  weight: 10
  when:
    age: [33, 70]
    year: [330, 340]
  text: |
    ปีนี้แมลงหึ่งบินมาไกลกว่าทุกปี ฝูงที่เคยวนอยู่แต่บนจานรับดาวในย่านโรงกลั่นลอยมาถึงถิ่นของ{name}ตั้งแต่ต้นหน้าร้อน ผีเสื้อกลางคืนปีกใส ตัวเท่าเล็บมือ ลงเกาะตะเกียงฟ้าทุกดวงที่จุดอยู่ ตะเกียงน้ำมันกับเทียนไม่มีตัวไหนแวะ

    เพื่อนบ้านบอกว่าฝูงนี้ดัง เสียงต่ำเสียงเดียวดังอยู่ใต้เสียงทุกอย่าง ฟังไปนานๆ แล้วไม่แน่ใจว่าดังอยู่ข้างนอกหรือข้างในหัว ผู้ใหญ่ทั้งถิ่นหาวตั้งแต่หัวค่ำ เด็กเล็กบางคนฮัมเพลงที่ไม่มีใครสอน ฮัมทำนองเดียวกันทุกบ้าน
  choices:
    - id: douse_lamps
      label: ดับตะเกียงฟ้าทุกดวงในบ้าน จุดเทียนแทน
      text: |
        {name}ดับตะเกียงฟ้าทีละดวง ฝูงที่เกาะอยู่ลอยขึ้น วนรอบบ้านสองสามรอบ แล้วไปเกาะตะเกียงบ้านข้างๆ แทน ในบ้านเหลือแต่แสงเทียนสีเหลืองกับเงาที่สั่นตามเปลวไฟ

        เพื่อนบ้านสองหลังเห็นแล้วทำตาม หลังที่สามไม่ทำ คืนนั้นทั้งบ้านหลังที่สามหลับกันตั้งแต่ยังไม่ได้กินข้าว
      effects: { stats: { INT: 1 }, flags: [doused_dew_lamps] }
    - id: burn_swarm
      label: จุดคบไฟไล่เผาฝูงที่เกาะตะเกียงหน้าบ้าน
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}กวาดคบไฟผ่านตะเกียงหน้าบ้านทีเดียว ปีกใสไหม้ไปหลายสิบตัว ไหม้โดยไม่มีควัน ร่วงลงพื้นเป็นผงแวววาวเหมือนเกล็ดเกลือ ที่เหลือลอยหนีขึ้นไปทางจานรับดาวบนหลังคาบ้านอื่น

          ตอนเช้าผงนั้นยังอยู่บนพื้นหน้าบ้าน กวาดไม่ออก ต้องรอฝนล้างถึงหายไป
        effects: { stats: { DEX: 1 }, flags: [burned_hum_moths] }
      failure:
        text: |
          ฝูงไม่หนีคบไฟ แต่ลอยแหวกออกเป็นช่อง คบไฟกวาดไปเจอแต่ลม {name}กวาดแรงขึ้นอีกครั้ง คบไฟฟาดเข้ากับเสาประตู สะเก็ดไฟกระเด็นลงหลังมือ

          แผลพองเท่าเหรียญ ฝูงกลับมาเกาะตะเกียงที่เดิม เหมือนไม่เคยมีใครมาไล่
        effects: { hp: -1, flags: [burned_hum_moths] }
    - id: listen
      label: นั่งที่ขั้นบันได ฟังเสียงหึ่งจนกว่าจะง่วง
      requires: { not_flags: [race_tiefling] }
      text: |
        เสียงนั้นต่ำจนต้องตั้งใจถึงได้ยิน แต่พอได้ยินแล้วก็เลิกได้ยินไม่ได้ อยู่ใต้เสียงหัวใจ ใต้เสียงลม ใต้เสียงคนคุยกันในบ้านข้างๆ {name}นั่งฟังจนตาปรือ

        ตอนสะดุ้งตื่น {name}กำลังฮัมเพลงอยู่ เด็กข้างบ้านยืนอยู่ที่รั้ว ฮัมตาม ทำนองเดียวกันทุกเสียง {name}ไม่เคยได้ยินเพลงนี้มาก่อน
      effects: { world: { star: 1 }, flags: [listened_to_the_hum] }
    - id: walk_through
      label: เดินฝ่าฝูงไปปลุกเพื่อนบ้านที่หลับคาธรณีประตู
      requires: { trait: curse_brand }
      text: |
        ฝูงแหวกออกรอบตัว{name}ทุกก้าว ไม่มีตัวไหนแตะผม แตะไหล่ หรือมาเกาะเสื้อเลยสักตัว สำหรับ{name}ฝูงนี้เงียบ ไม่มีเสียงปีก ไม่มีเสียงอะไรทั้งนั้น เหมือนเดินผ่านหิมะที่ตกช้าๆ

        {name}เขย่าไหล่เพื่อนบ้านที่หลับคาประตูจนตื่น เขาถามด้วยเสียงงัวเงียว่า{name}ไม่หาวบ้างเหรอ แล้วหลับต่อก่อนจะได้คำตอบ
      effects: { stats: { STR: 1 }, flags: [walked_through_the_swarm] }

- id: adult.world_shared_dream
  stage: adult
  weight: 10
  when:
    age: [33, 70]
    year: [330, 340]
    not_flags: [race_tiefling]
  text: |
    คืนนั้น{name}ฝันว่ายืนอยู่บนทุ่งแก้ว ทุ่งเรียบเหมือนน้ำนิ่งแผ่ไปจนสุดตา ข้างใต้มีแสงฟ้าเต้นเบาๆ ฟ้าเหนือหัวอยู่ต่ำจนแทบเอื้อมถึง และบนฟ้ามีรอยมือ มือหนึ่งกดอยู่จากอีกด้าน เห็นเป็นรอยฝ่ามือกับนิ้วยาวๆ ที่นับได้ไม่ครบ

    ตอนเช้าที่บ่อน้ำ คนแรกที่มาตักน้ำเล่าความฝันของตัวเอง ทุ่งแก้ว ฟ้าต่ำ รอยมือ คนที่สองบอกว่าฝันแบบเดียวกัน คนที่สามก็ด้วย จนเชือกถังแกว่งอยู่ในมือคนตักโดยไม่มีใครดึงขึ้น
  choices:
    - id: tell_it
      label: เล่าความฝันของตัวเองให้คนที่บ่อฟังบ้าง
      text: |
        {name}เล่าตรงกับคนอื่นทุกอย่าง จนถึงตอนท้ายที่ไม่มีใครเล่า ในฝันของ{name} มือนั้นเลื่อนมาทางซ้ายหนึ่งนิ้ว คนที่ยืนรอบบ่อเงียบไปหมด แล้วหญิงแก่คนหนึ่งบอกว่าของนางก็เลื่อน แต่ไม่กล้าพูด

        ก่อนเที่ยงทั้งถิ่นรู้ว่ามือเลื่อน ตกเย็นมีคนบอกว่าเลื่อนสองนิ้ว
      effects: { world: { star: 1 }, flags: [told_shared_dream] }
    - id: write_it
      label: กลับบ้านไปเขียนความฝันลงกระดาษก่อนจะลืม
      text: |
        {name}เขียนทุกอย่างที่จำได้ ขนาดของทุ่ง สีของแสง ความสูงของฟ้า ระยะห่างระหว่างนิ้ว เขียนจนหมดหน้ากระดาษแล้ววาดรูปมือไว้ที่มุม พับเก็บไว้ใต้ฟูก

        อีกครึ่งปีต่อมา{name}ฝันเรื่องเดียวกันอีก ตื่นมาหยิบกระดาษออกมาเทียบ ทุกอย่างเหมือนเดิม ยกเว้นระยะระหว่างนิ้วที่แคบลง
      effects: { stats: { INT: 1 }, flags: [wrote_shared_dream] }
    - id: go_work
      label: ไม่เล่าให้ใครฟัง ไปทำงานให้ลืม
      text: |
        {name}ตักน้ำเสร็จแล้วเดินออกจากบ่อระหว่างที่คนยังเล่ากันอยู่ ชายอีกคนที่ยืนฟังห่างๆ มาตั้งแต่เช้าหิ้วถังเดินออกมาพร้อมกัน ไม่ได้เล่าอะไรเหมือนกัน สองคนเดินคู่กันไปจนถึงทางแยกโดยไม่ได้หันหน้าหากัน

        วันนั้น{name}แบกของที่ปกติแบกสองเที่ยวในเที่ยวเดียว กลับถึงบ้านแล้วหลับไปโดยไม่ได้ฝันอะไร
      effects: { stats: { STR: 1 }, flags: [ignored_shared_dream] }
    - id: ask_child
      label: กลับบ้านไปถามลูกว่าเมื่อคืนฝันอะไร
      requires: { flag: has_child, not_flags: [child_horned] }
      text: |
        ลูกเล่าเหมือนที่บ่อทุกอย่าง ทุ่งแก้ว ฟ้าต่ำ รอยมือ แล้วเล่าต่ออีกนิดหนึ่ง ว่ามือนั้นเคาะ เคาะสามที ช้าๆ เหมือนคนเคาะประตูบ้านที่ไม่แน่ใจว่ามีคนอยู่

        ลูกถามว่าถ้ามันเคาะอีก ควรตอบไหม
      effects: { world: { star: 1 }, flags: [child_heard_the_knock] }
    - id: ask_horned_child
      label: กลับบ้านไปถามลูกว่าเมื่อคืนฝันอะไร
      requires: { flag: child_horned }
      text: |
        ลูกบอกว่าไม่ได้ฝัน หลับยาวตั้งแต่หัวค่ำจนเช้า แล้วถามว่าทำไมคนที่บ่อหน้าซีดกันหมด ทำไมป้าบ้านข้างๆ ถึงจับหัวลูกแล้วรีบปล่อย

        {name}ไม่มีคำตอบ ได้แต่ลูบหัวลูกตรงที่ป้าจับ ลูบซ้ำอยู่อย่างนั้น
      effects: { flags: [horned_child_no_dream] }

- id: adult.world_shared_dream_tiefling
  stage: adult
  weight: 10
  when:
    age: [33, 70]
    year: [330, 340]
    trait: curse_brand
  text: |
    เช้านั้นที่บ่อน้ำ ทุกคนพูดเรื่องเดียวกัน ทุ่งแก้วที่แผ่ไปสุดตา ฟ้าต่ำจนเอื้อมถึง กับรอยมือที่กดฟ้าอยู่จากอีกด้าน คนหนึ่งเล่า อีกคนต่อ อีกคนแก้ให้ตรง เหมือนทุกคนไปที่เดียวกันมาเมื่อคืน

    {name}หลับสนิททั้งคืน ไม่ได้ฝันอะไรเลย

    ในวงคนที่บ่อมีคนแปลกหน้าคนหนึ่ง เสื้อดี ผมหวีเรียบ ไม่ได้ถือถังมา เขาฟังทุกคนเล่า ถามคำถามเล็กๆ จดลงกระดาษแผ่นเล็กในมือ แล้วหันมาทาง{name}เป็นคนสุดท้าย ถามว่าเมื่อคืนฝันเห็นมือข้างไหน
  choices:
    - id: pretend
      label: เล่าความฝันตามที่ได้ยินคนอื่นเล่า
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}เก็บรายละเอียดจากที่คนอื่นเล่ามาเย็บต่อกัน ขาดนิดเกินหน่อยเหมือนคนที่เพิ่งตื่นจริงๆ ตอบว่ามือซ้าย เพราะหญิงแก่ข้างๆ บอกว่ามือซ้าย คนแปลกหน้าจดลงกระดาษ แล้วหันไปถามคนต่อไป

          เขาไม่หันกลับมาอีก {name}ถือถังกลับบ้าน มือเปียกเหงื่อจนเชือกถังลื่น
        effects: { stats: { INT: 1 }, flags: [faked_shared_dream] }
      failure:
        text: |
          {name}ตอบว่ามือขวา หญิงแก่ข้างๆ แก้ให้ทันทีว่ามือซ้าย ทุกคนที่บ่อเห็นมือซ้ายกันหมด คนแปลกหน้าไม่แก้ตาม เขาจดลงกระดาษนานกว่าตอนจดของคนอื่น

          ก่อนจะเดินจากไป เขาถามชื่อ{name} ถามสุภาพเหมือนถามทาง
        effects: { flags: [listeners_noted_name] }
    - id: tell_truth
      label: บอกตามจริงว่าไม่ได้ฝัน
      text: |
        หญิงที่ยืนข้างๆ บอกว่าโชคดี นางอยากหลับแบบนั้นบ้าง คนแปลกหน้ายิ้มให้{name} ยิ้มแบบเดียวกับที่ยิ้มให้ทุกคน แล้วจดลงกระดาษสั้นกว่าของคนอื่น สั้นแค่คำเดียว

        เขาถามชื่อ{name} แล้วขอบคุณ
      effects: { alignment: { moral: 1 }, flags: [listeners_noted_name] }
    - id: follow
      label: ไม่ตอบ เดินออกมาก่อน แล้วย้อนตามคนแปลกหน้าไปห่างๆ
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          เขาออกจากบ่อไปตอนสาย เดินช้าเหมือนคนเดินเล่น {name}ตามไปห่างสองหลังคาเรือน เขาหยุดที่บ้านหลังหนึ่งท้ายถิ่น ก้มลง เอาปูนขาวเขียนอะไรเล็กๆ ไว้ที่กรอบประตูระดับเข่า แล้วเดินต่อไปทางถนนใหญ่

          {name}เดินไปดู เป็นรูปดาวเจ็ดแฉก บ้านหลังนั้นเป็นบ้านที่ลูกคนเล็กโพกผ้าไว้บนหัวตลอดเวลา
        effects: { stats: { DEX: 1 }, flags: [saw_chalk_star] }
      failure:
        text: |
          เขาเลี้ยวหัวมุมไป {name}เร่งฝีเท้าตาม แต่พอถึงหัวมุม ถนนว่างทั้งเส้น

          {name}เดินกลับบ้าน ที่กรอบประตูบ้านตัวเองมีรูปดาวเจ็ดแฉกเขียนด้วยปูนขาวอยู่ระดับเข่า ปูนขาวยังไม่แห้งดี
        effects: { flags: [listeners_chalked_door] }
