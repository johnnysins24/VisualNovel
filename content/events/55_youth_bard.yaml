# วัยหนุ่มสาว 15–17 ทางกวีเร่ (class: bard)
# สองเรื่องแรกใช้ได้ทุกถิ่น ไม่ระบุสถานที่ ใช้ได้ทั้งงานแต่งในหมู่บ้าน ตีนไม้ ป้อม และเมือง
# คณะละครเร่มีสองแบบ: คนธรรมดา (บ้านชาวนา) กับทีฟลิ่งที่เขายังอยู่ (ลูกที่บ้านเลี้ยงไว้ เด็กวิหาร) เพราะนักล่าแม่มดล่าคนมีตรามาร
# งานเลี้ยงที่แขกฮัมเป็นของเวนทราส (นักร้องใต้สะพาน โรงละครถนนสายตะเกียง)
# คนแคระทุกคนรู้ว่าบรรพบุรุษขุดทะลุถึงเบื้องล่าง แต่ไม่มีใครพูดต่อหน้าคนนอก (คัมภีร์ หัวข้อคนแคระ)

- id: youth.bard_wedding_verse
  stage: youth
  weight: 30
  when:
    age: [15, 16]
    class: bard
  text: |
    งานแต่งครั้งนั้นเป็นงานแรกที่มีคนจ้าง{name}ร้องคนเดียว ค่าจ้างสามเหรียญกับข้าวหนึ่งห่อ ร้องตั้งแต่ตะวันตกจนแขกเมาครบทุกโต๊ะ

    ใกล้เที่ยงคืน ชายพุงใหญ่คนหนึ่งลุกขึ้นเต้น เต้นไม่ตรงจังหวะสักก้าว แต่เต้นเหมือนลานทั้งลานเป็นของตัวเอง {name}แต่งท่อนใหม่สดๆ ใส่ทำนองเพลงเกี่ยวข้าว ว่าด้วยชายที่พุงเดินนำหน้าตัวเองไปสองก้าว ทั้งงานหัวเราะจนโต๊ะสั่น เจ้าบ่าวหัวเราะจนสำลักเหล้า

    ไม่มีใครบอก{name}ว่าชายคนนั้นถือหนี้ของแขกครึ่งงาน รวมทั้งหนี้ค่างานแต่งคืนนั้นด้วย

    สามวันต่อมา เด็กทั้งถิ่นร้องท่อนนั้นกันตามทาง แล้วคนของชายพุงใหญ่สองคนก็มายืนรออยู่หน้าที่พักของ{name} มือว่างทั้งคู่ บอกว่านายอยากฟังเพลงนั้นอีกสักรอบ ต่อหน้า
  choices:
    - id: sweeten_verse
      label: ไปร้องต่อหน้าเขา แต่เปลี่ยนท่อนนั้นเป็นท่อนยกย่อง
      habit: sweet_tongue
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ร้องทำนองเดิม คำเกือบเดิม แต่คราวนี้พุงที่เดินนำหน้าสองก้าวเป็นพุงของคนที่เลี้ยงคนทั้งถิ่นจนอิ่ม ชายพุงใหญ่ฟังจนจบ ไม่ยิ้ม ไม่ขมวดคิ้ว แล้วโยนเหรียญมาให้หนึ่งเหรียญ

          เขาบอกว่าเด็กๆ คงไม่จำท่อนนี้ เขาพูดถูก เด็กทั้งถิ่นยังร้องท่อนแรกกันไปอีกเป็นเดือน ไม่มีใครร้องท่อนใหม่ แต่ก็ไม่มีใครมายืนรอหน้าที่พักของ{name}อีก
        effects: { stats: { CHA: 1 }, gold: 1, flags: [softened_the_verse] }
      failure:
        text: |
          ท่อนยกย่องที่นั่งแต่งมาทั้งคืนออกจากปาก{name}แข็งเหมือนคนท่องบัญชี ชายพุงใหญ่ฟังได้ครึ่งเดียวก็ยกมือให้หยุด บอกว่าข้าไม่ได้เรียกเจ้ามาขอโทษ ข้าเรียกมาฟังเพลงที่ทั้งถิ่นร้อง

          {name}ต้องร้องท่อนแรกจนจบต่อหน้าคนของเขาทั้งห้อง ร้องจบไม่มีใครหัวเราะ บ่ายนั้นเขาทวงค่างานแต่งจากเจ้าบ่าวเพิ่มอีกสองเหรียญ แล้วเจ้าบ่าวก็มาทวงต่อจาก{name}
        effects: { stats: { CON: 1 }, gold: -2, flags: [verse_spread] }
    - id: out_the_window
      label: ไม่ไป ปีนออกทางหน้าต่างหลังที่พัก
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}ปีนออกหน้าต่างหลัง ไต่รางน้ำลงไปถึงกองฟืนของบ้านข้างๆ ก่อนที่สองคนหน้าประตูจะรู้ว่ากำลังเคาะห้องว่าง แล้วไปค้างที่อื่นอยู่สิบวัน

          กลับมาอีกที ชายพุงใหญ่มีเรื่องอื่นให้โกรธแล้ว แต่ตั้งแต่นั้นมา งานไหนในถิ่นนั้นจ้าง{name}ไปร้อง คนจ้างจะกระซิบขอท่อนนั้นด้วยทุกครั้ง ขอตอนเขาไม่อยู่ในงาน และจ่ายเพิ่มให้หนึ่งเหรียญ
        effects: { stats: { DEX: 1 }, gold: 2, flags: [verse_spread] }
      failure:
        text: |
          รางน้ำหลุดจากผนังตอนที่{name}ห้อยอยู่ครึ่งทาง {name}ตกลงไปกลางกองฟืน ข้อเท้าพลิก สองคนนั้นเดินอ้อมมาดูอย่างไม่รีบ คนหนึ่งช่วยพยุงขึ้น อีกคนบอกว่านายไม่ได้คิดจะทำอะไร แค่อยากฟังเพลง แต่ตอนนี้นายคงอยากฟังเรื่องรางน้ำด้วย

          {name}ร้องท่อนนั้นต่อหน้าเขาทั้งที่ข้อเท้าบวมเท่ากำปั้น ร้องจบ เขาหัวเราะอยู่คนเดียวทั้งห้อง แล้วให้คนพาไปส่งหมอ
        effects: { hp: -2, stats: { CON: 1 }, flags: [verse_spread] }
    - id: sharper_verse
      label: ไปร้องต่อหน้าเขา แล้วต่อท่อนใหม่ที่คมกว่าเดิม
      check: { stat: CHA, dc: 15 }
      success:
        text: |
          {name}ร้องท่อนเดิมจนจบ แล้วต่อท่อนใหม่ ว่าด้วยชายที่พุงใหญ่เพราะกินดอกเบี้ยแทนข้าวมาสามสิบปี คนของเขาในห้องกลั้นหายใจกันทั้งแถว

          ชายพุงใหญ่นิ่งไปนาน แล้วหัวเราะดังกว่าตอนอยู่ในงานแต่ง เขาบอกว่าทั้งถิ่นนี้ไม่มีใครกล้าพูดกับข้าแบบนี้มายี่สิบปีแล้ว แล้วจ้าง{name}ไปร้องในงานวันเกิดของแม่เขาเดือนหน้า ห้ามร้องสองท่อนนี้เด็ดขาด
        effects: { stats: { CHA: 1 }, gold: 4, flags: [bold_verse] }
      failure:
        text: |
          ท่อนใหม่ยังร้องไม่จบ คนของเขาสองคนก็ยก{name}ขึ้นทั้งตัว พาออกไปโยนลงร่องน้ำหลังบ้าน แล้วเตะซ้ำอีกสองที ไม่หนักพอจะหัก แต่หนักพอจะจำ

          หลังจากนั้นไม่มีงานไหนในถิ่นนั้นกล้าจ้าง{name}อีก ส่วนท่อนใหม่ที่ร้องไม่จบ เด็กๆ แต่งต่อกันเองจนจบ หยาบจน{name}เองยังไม่กล้าร้อง
        effects: { hp: -3, stats: { CHA: 1 }, flags: [bold_verse, beaten_for_a_song] }

- id: youth.bard_rumor_song
  stage: youth
  weight: 30
  when:
    age: [16, 17]
    class: bard
  text: |
    คนแปลกหน้าคนนั้นนั่งฟัง{name}ร้องสามคืนติดกัน นั่งโต๊ะเดิม สั่งน้ำเปล่าทุกคืน ไม่ได้ดื่มสักคืน คืนที่สี่ เขาวางเหรียญทองแดงห้าเหรียญเรียงเป็นแถวบนโต๊ะ กับกระดาษพับไว้แผ่นหนึ่ง

    ในกระดาษเป็นเนื้อเพลง ไม่มีทำนอง ว่าด้วยดาวที่เพิ่มขึ้นทุกปี ว่าดาวพวกนั้นมองลงมาทุกคืน ว่าแสงสีฟ้าในตะเกียงทุกดวงคือตาที่ไม่เคยกะพริบ ท่อนสุดท้ายว่าในแผ่นดินนี้มีแต่สิ่งที่หลับอยู่ใต้เถ้าเท่านั้นที่ดาวกลัว

    เขาบอกว่าไม่ต้องบอกใครว่าใครแต่ง ร้องให้ครบสิบที่ ที่ไหนก็ได้ที่มีคนนั่งฟัง ครบแล้วจะมีอีกห้าเหรียญ
  choices:
    - id: sing_it
      label: รับเหรียญ แล้วร้องให้ครบสิบที่
      text: |
        {name}ใส่ทำนองช้า เสียงต่ำ ที่แรกคนฟังเงียบกันทั้งห้อง ที่ที่ห้ามีคนขอให้ร้องซ้ำ ที่ที่เก้า {name}ได้ยินเด็กคนหนึ่งร้องท่อนสุดท้ายเล่นอยู่หน้าประตู ทั้งที่{name}ยังไม่เคยไปร้องที่นั่น

        คนแปลกหน้ามาวางอีกห้าเหรียญตามที่บอก แล้ว{name}ก็ไม่เคยเห็นเขาอีก เดือนต่อมามีข่าวว่าเด็กมีเขาคนหนึ่งในถิ่นนั้นโดนคนขว้างหินใส่กลางตลาด เพราะมีคนลือกันว่าลัทธิเถ้าเข้ามาเคลื่อนไหวแถวนี้ ไม่มีใครรู้ว่าข่าวลือเริ่มจากไหน
      effects: { stats: { CHA: 1 }, gold: 10, world: { demon: 1 }, reputation: { ash_cult: 1 }, flags: [sang_cult_song] }
    - id: spoil_ending
      label: รับเหรียญ แต่แอบแก้ท่อนสุดท้าย
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}เก็บทุกท่อนไว้ตามกระดาษ ยกเว้นท่อนสุดท้าย สิ่งที่หลับอยู่ใต้เถ้ากลายเป็นพ่อครัวที่หลับคาเตา ปล่อยข้าวไหม้ติดก้นหม้อทั้งหม้อ คนฟังหัวเราะทุกที่ ไม่กี่คืนเพลงทั้งเพลงก็กลายเป็นเพลงตลก คนเมาร้องกันตอนจะกลับบ้าน

          คนแปลกหน้าไม่ได้มาวางห้าเหรียญหลัง แต่มายืนหน้า{name}คืนหนึ่ง จ้องหน้า{name}จนเพลงจบ แล้วเดินออกไปโดยไม่พูดอะไร
        effects: { stats: { CHA: 1 }, gold: 5, reputation: { ash_cult: -1 }, flags: [mocked_cult_song] }
      failure:
        text: |
          ท่อนที่แก้ไม่ติดหูใคร ที่ที่สาม คนฟังโต๊ะหลังตะโกนขอให้ร้องท่อนที่ถูก ท่อนที่ว่าดาวกลัวสิ่งที่หลับใต้เถ้า เขาเคยได้ยินมาจากนักร้องอีกคนที่อื่นแล้ว

          {name}ไม่ใช่คนเดียวที่ได้เหรียญห้าเหรียญกับกระดาษพับแผ่นนั้น
        effects: { stats: { WIS: 1 }, gold: 5, world: { demon: 1 }, flags: [cult_song_spread] }
    - id: follow_him
      label: ไม่รับ แล้วตามเขาออกไปตอนเขาเดินออกจากร้าน
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          เขาเดินไม่รีบ ไม่หันหลังสักครั้ง แต่เลี้ยวทุกหัวมุมที่เลี้ยวได้ {name}ตามห่างๆ ไปจนถึงบ้านร้างหลังหนึ่ง หน้าต่างตีไม้ปิดทุกบาน ข้างในมีแสงไฟลอดร่องไม้ออกมา มีเสียงคนพูดพร้อมกันเบาๆ คำเดียวซ้ำไปซ้ำมา ฟังไม่ออกว่าคำอะไร

          {name}นั่งอยู่หลังกองไม้ฝั่งตรงข้ามจนดึก นับคนที่เดินเข้าไปได้เจ็ดคน คนที่หกเป็นคนที่นั่งฟัง{name}ร้องเพลงแทบทุกคืน และเคยขอเพลงกล่อมเด็กให้ลูกสาว
        effects: { stats: { DEX: 1 }, flags: [knows_cult_house] }
      failure:
        text: |
          ที่หัวมุมที่สาม เขาหายไป {name}ยืนหันซ้ายหันขวาอยู่กลางทาง แล้วได้ยินเสียงเขาอยู่ข้างหลัง ใกล้จนรู้สึกถึงลมหายใจ

          เขาบอกว่าเจ้าร้องเพราะ ข้าจะกลับมาฟังอีก แล้วเดินผ่านไป คืนนั้นตอนกลับถึงห้อง {name}เจอกระดาษแผ่นเดิมสอดอยู่ใต้ประตู พับไว้เหมือนเดิม กับเหรียญทองแดงห้าเหรียญ
        effects: { stats: { DEX: 1 }, gold: 5, flags: [cult_noticed_you] }

- id: youth.bard_witch_hunter_play
  stage: youth
  scene: market
  weight: 30
  when:
    age: [15, 17]
    flags: [path_troupe]
    not_flags: [race_tiefling]
  text: |
    คณะละครเร่ไปถึงหมู่บ้านนั้นตอนบ่าย ลานหน้าวิหารที่ควรว่างไว้ให้ตอกเวทีมีเสาไม้ปักอยู่แล้วหนึ่งต้น ข้างเสามีกองฟืนสูงถึงเอว

    นักล่าแม่มดของศาสนจักรตะเกียงมาถึงก่อนคณะสองวัน จับหญิงทำยาสมุนไพรของหมู่บ้านขังไว้ในยุ้งข้าวหลังวิหาร จะตัดสินตอนสาง หัวหน้าคณะไปขออนุญาตเล่นละคร เขาอนุญาต ทั้งยังขอให้เล่นเรื่องผู้กล้าทั้งหกผนึกจอมมาร เรื่องที่มีปีศาจตายบนเวทีสามตัว เขาบอกว่าคืนก่อนพิธี คนในหมู่บ้านควรได้ดูว่าคนรับใช้ฝั่งมืดจบลงอย่างไร

    {name}เล่นเป็นผู้กล้าคนที่สาม คนที่ตายกลางองก์สอง ตอนแทงปีศาจตัวแรกในองก์หนึ่ง {name}มองข้ามไหล่คนเล่นเป็นปีศาจไป เห็นนักล่าแม่มดนั่งแถวหน้าสุด ปรบมือตามจังหวะกลอง
  choices:
    - id: play_it_straight
      label: เล่นตามบทจนจบ
      text: |
        ผู้กล้าคนที่สามตายกลางองก์สองตามบท ปีศาจทั้งสามตัวตายตามบท คนดูโห่ร้องทุกครั้งที่ปีศาจล้ม นักล่าแม่มดโห่ดังที่สุด หลังละครเขาส่งเหรียญมาให้คณะเพิ่มอีกสี่เหรียญ

        ตอนสาง คณะเก็บเวทีเสร็จก่อนพิธีเริ่ม หัวหน้าคณะสั่งให้ออกเดินทางทันที ไม่มีใครหันกลับไปมอง จนเกวียนเล่มสุดท้ายพ้นเนินแรก ควันก็ลอยขึ้นมาให้เห็นจากข้างหลัง
      effects: { gold: 2, alignment: { law: 1 }, reputation: { lamp_church: 1 }, flags: [played_for_hunter] }
    - id: ask_the_demon
      label: เปลี่ยนบทสดๆ ให้ผู้กล้าถามปีศาจว่าทำอะไรผิด
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          คนเล่นเป็นปีศาจตาค้างอยู่ใต้หน้ากาก แล้วรับมุกทันที ปีศาจตอบว่ามันแค่ต้มยาให้เด็กที่ไอไม่หยุด {name}หันไปถามคนดูทั้งลานว่าจะให้แทงไหม ลานเงียบไปพักหนึ่ง แล้วเด็กคนหนึ่งตะโกนว่าไม่ ตามด้วยอีกคน แล้วก็ทั้งลาน

          นักล่าแม่มดลุกเดินออกไปกลางเรื่อง ตอนสาง ผู้ใหญ่บ้านไปยืนหน้ายุ้งข้าวพร้อมผู้ชายสิบกว่าคน บอกว่าหมู่บ้านนี้จะตัดสินคนของหมู่บ้านเอง นักล่าแม่มดจดชื่อผู้ใหญ่บ้านลงสมุด แล้วออกจากหมู่บ้านไปก่อนเที่ยง ก่อนไปเขาจดชื่อคณะละครไว้ด้วย
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, reputation: { lamp_church: -1 }, flags: [saved_herb_woman, troupe_on_church_list] }
      failure:
        text: |
          คนเล่นเป็นปีศาจไม่รับมุก ยืนนิ่งรอให้แทงตามบท คนดูหัวเราะ นึกว่า{name}ลืมบท {name}แทงตามบทในที่สุด

          นักล่าแม่มดไม่หัวเราะ หลังละครเขาเดินมาหลังเวที ถามหัวหน้าคณะว่าเด็กคนนี้เรียนบทมาจากใคร หัวหน้าคณะต้องจ่ายค่าปรับเท่าค่าเล่นทั้งคืน เพื่อให้คณะได้ออกจากหมู่บ้านครบทุกคน จนเกวียนพ้นเนินแรก ไม่มีใครในคณะพูดกับ{name}สักคำ แล้วควันก็ลอยขึ้นมาข้างหลัง
        effects: { stats: { CON: 1 }, gold: -1, reputation: { lamp_church: -1 }, flags: [troupe_on_church_list] }
    - id: open_the_barn
      label: ตายตามบทกลางองก์สองแล้ว แอบไปที่ยุ้งข้าว
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ลากตัวเองออกไปหลังเวที ถอดเกราะกระดาษทิ้ง วิ่งอ้อมหลังวิหาร ยามหน้ายุ้งข้าวยืนหันหน้าไปทางลาน ฟังละครเพลินอยู่ {name}งัดไม้ฝาด้านหลังออกสองแผ่น ช่องกว้างพอดีตัวคน หญิงทำยาลอดออกมา เธอไม่พูดอะไร บีบมือ{name}ทีเดียวแล้ววิ่งเข้าป่าไป

          {name}กลับไปทันโค้งคำนับ หัวหน้าคณะเห็นเศษฟางติดอยู่ในผม{name} แล้วดึงออกให้ก่อนม่านเปิด ตอนสาง ทั้งหมู่บ้านตื่นเพราะเสียงนักล่าแม่มดตะโกน คณะเก็บเวทีเร็วที่สุดเท่าที่เคยเก็บมา
        effects: { stats: { DEX: 1, STR: 1 }, alignment: { moral: 1, law: -1 }, flags: [freed_herb_woman] }
      failure:
        text: |
          ไม้ฝาแผ่นที่สองร้องเอี๊ยดดังตอนงัด ยามหันมา {name}วิ่ง ยามวิ่งตาม ทันกันที่ริมคูน้ำ ยามเตะ{name}ลงไปในคู {name}จมลงไปทั้งตัว ยามคลำหาในน้ำมืดไม่เจอ พอได้ยินเสียงปรบมือจบองก์ดังมาจากลานก็รีบกลับไปเฝ้าประตู {name}โผล่ขึ้นมาสำลักโคลนอยู่ใต้กอหญ้าริมคู

          สีผู้กล้าบนหน้า{name}ล้างออกในคูหมดแล้ว ยามจำหน้าไม่ได้ หัวหน้าคณะเห็นสภาพ{name}ตอนกลับมาหลังเวที แล้วรีบเอาผ้าห่มคลุมทั้งตัว ตอนสาง ควันลอยขึ้นจากลานหน้าวิหาร คณะออกเดินทางก่อนควันจะจาง
        effects: { hp: -2, stats: { DEX: 1 }, flags: [tried_to_free_herb_woman] }

- id: youth.bard_witch_hunter_horns
  stage: youth
  scene: market
  weight: 30
  when:
    age: [15, 17]
    flags: [path_troupe, race_tiefling]
  text: |
    คณะละครเร่ไปถึงหมู่บ้านนั้นตอนบ่าย ลานหน้าวิหารที่ควรว่างไว้ให้ตอกเวทีมีเสาไม้ปักอยู่แล้วหนึ่งต้น ข้างเสามีกองฟืนสูงถึงเอว

    นักล่าแม่มดของศาสนจักรตะเกียงมาถึงก่อนคณะสองวัน จับหญิงทำยาสมุนไพรของหมู่บ้านขังไว้ในยุ้งข้าวหลังวิหาร จะตัดสินตอนสาง หัวหน้าคณะเดินกลับมาจากวิหารหน้าซีด บอกว่าเขาอนุญาตให้เล่น และขอเรื่องผู้กล้าทั้งหกผนึกจอมมาร เขาอยากให้ทั้งหมู่บ้านได้ดูว่าจอมมารจบลงอย่างไร ในคืนก่อนพิธี

    ทั้งคณะหันมามอง{name} คนเดียวในคณะที่ไม่ต้องใส่เขาปลอม
  choices:
    - id: play_the_demon
      label: ขึ้นเวทีเป็นจอมมาร ให้เขาเห็นเขาจริงอยู่ตรงหน้า
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}เล่นจอมมารเสียงดัง ก้าวยาว ตายช้า คนดูโห่จนลานสั่น นักล่าแม่มดปรบมืออยู่แถวหน้าสุด

          หลังละคร นักล่าแม่มดเดินมาหลังเวที ชมว่าเขาปลอมคู่นี้ทำเหมือนจริงที่สุด แล้วยื่นมือมาจะจับ หัวหน้าคณะก้าวเข้ามาขวางก่อน บอกว่ากาวยังไม่แห้ง ติดมือท่านแล้วล้างไม่ออกสามวัน เขาหัวเราะ แล้วกลับไปนอน

          ตอนสาง คณะออกเดินทางก่อนพิธีเริ่ม จนเกวียนเล่มสุดท้ายพ้นเนินแรก ควันก็ลอยขึ้นมาให้เห็นจากข้างหลัง
        effects: { stats: { CHA: 1 }, gold: 3, flags: [fooled_witch_hunter] }
      failure:
        text: |
          ฉากสุดท้าย {name}ล้มลงตายแรงเกินไป เขาข้างซ้ายฟาดขอบเวที เสียงดังทึบเหมือนกระดูกกระทบไม้ ไม่ใช่เสียงไม้ทาสี นักล่าแม่มดลุกขึ้นยืน

          หัวหน้าคณะเตะตะเกียงหน้าเวทีล้มทั้งแถว ตะโกนว่าไฟไหม้ คนดูแตกฮือ คณะทิ้งเวทีไว้ทั้งเวที ขนไปได้แค่คน ม้า กับเกวียนสองเล่ม ออกจากหมู่บ้านไปในคืนนั้น นักล่าแม่มดไม่ได้เห็นหน้า{name}ชัด แต่เห็นเขาบนหัวชัดเต็มตา
        effects: { hp: -1, stats: { DEX: 1 }, gold: -2, reputation: { lamp_church: -1 }, flags: [hunted_by_witch_hunter] }
    - id: hide_in_wagon
      label: ให้คนอื่นใส่เขาปลอมเล่นแทน แล้วซ่อนตัวในเกวียน
      habit: faint_heart
      text: |
        คนเล่นทหารยามใส่เขาปลอมเล่นจอมมารแทน เขาปลอมหลุดกลางเรื่องเหมือนทุกครั้งที่ใครใส่ คนดูหัวเราะกันทั้งลาน {name}นอนอยู่ใต้กองผ้าม่านในเกวียน ได้ยินละครทั้งเรื่อง ได้ยินนักล่าแม่มดหัวเราะดังกว่าใคร

        ดึกลงมา เสียงในลานเงียบหมดแล้ว {name}ได้ยินเสียงผู้หญิงร้องเพลงกล่อมเด็กลอดมาจากทางยุ้งข้าว ร้องอยู่คนเดียว เพลงเดิมซ้ำไปซ้ำมา จนเกือบสาง
      effects: { stats: { CON: 1 }, flags: [hid_from_witch_hunter] }
    - id: open_the_barn
      label: ระหว่างที่ทั้งหมู่บ้านดูละคร แอบไปที่ยุ้งข้าว
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ยามหน้ายุ้งข้าวยืนหันหน้าไปทางลาน ฟังเสียงคนดูหัวเราะเขาปลอมที่หลุด {name}งัดไม้ฝาด้านหลังออกสองแผ่น หญิงทำยาลอดออกมา เห็นเขาบนหัว{name}ในแสงจันทร์ แล้วหลุดหัวเราะออกมาครึ่งเสียง กระซิบว่าเขาจับผิดคน

          เธอบีบมือ{name}ทีเดียวแล้ววิ่งเข้าป่าไป ตอนสาง ทั้งหมู่บ้านตื่นเพราะเสียงนักล่าแม่มดตะโกน คณะเก็บเวทีเสร็จก่อนไก่ตัวแรกจะขัน
        effects: { stats: { DEX: 1, STR: 1 }, alignment: { moral: 1, law: -1 }, flags: [freed_herb_woman] }
      failure:
        text: |
          ไม้ฝาแผ่นที่สองร้องเอี๊ยดดังตอนงัด ยามหันมาพร้อมยกตะเกียงขึ้น {name}วิ่งก่อนแสงจะถึงหน้า วิ่งไม่หยุดจนถึงเกวียน มุดลงไปใต้กองผ้าม่าน

          ยามไม่เห็นหน้า แต่เห็นเงาเขาคู่หนึ่งวิ่งผ่านแสงตะเกียงไป ก่อนเที่ยงคืน นักล่าแม่มดเดินตรวจเกวียนของคณะทีละเล่ม หัวหน้าคณะนั่งอยู่บนกองผ้าม่านเล่มที่{name}ซ่อน กินขนมปังอยู่เฉยๆ จนเขาเดินผ่านไป ตอนสาง ควันลอยขึ้นจากลานหน้าวิหาร
        effects: { stats: { DEX: 1 }, reputation: { lamp_church: -1 }, flags: [tried_to_free_herb_woman, hunted_by_witch_hunter] }

- id: youth.bard_humming_party
  stage: youth
  scene: noble_hall
  weight: 30
  when:
    age: [15, 17]
    class: bard
    location_tag: ventras
  text: |
    บ้านหลังนั้นอยู่บนเนินเหนือย่านโรงกลั่น หลังคามีจานรับดาวสามใบ ใหญ่กว่าจานทุกใบในย่าน เจ้าของบ้านเป็นลูกสาวเจ้าของโรงกลั่นสองโรง อายุยังไม่ถึงสามสิบ จ้าง{name}มาร้องในงานเลี้ยงวันเกิดของตัวเอง ค่าจ้างเท่าค่าแรงครึ่งเดือนของคนงานโรงกลั่น

    แขกสามสิบกว่าคนแต่งตัวดีทั้งห้อง ระหว่างเพลงที่สี่ {name}ได้ยินเสียงฮัมดังขึ้นจากมุมหนึ่ง แล้วอีกมุม แล้วทั้งห้อง แขกทุกคนฮัมเสียงต่ำเสียงเดียวกัน ทั้งที่ยังคุยกันอยู่ ยังยกแก้วกันอยู่ ไม่มีใครรู้ตัว

    เจ้าของบ้านไม่ได้ฮัม เธอยืนอยู่ข้างเตาผิง กวาดตามองแขกทีละคน ตาของเธอหยุดที่{name}ครู่หนึ่ง เห็นว่า{name}กำลังร้องเพลงอยู่ แล้วก็เลื่อนต่อไป จนไปหยุดที่เด็กสาวรับใช้ผ้าโพกหัวสีเทาคนหนึ่ง ที่ถือถาดแก้วยืนอยู่ข้างประตู ปากปิดสนิท
  choices:
    - id: loud_dance
      label: เปลี่ยนเป็นเพลงเต้นรำ ให้ทั้งห้องหันมาที่ตัวเอง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ตีจังหวะเร็วขึ้นเป็นเพลงเต้นรำของท่าเรือ เพลงที่คนเมาทุกคนร้องตามได้ เสียงฮัมแตกออกเป็นเสียงหัวเราะ เสียงตบโต๊ะ แขกคนหนึ่งดึงอีกคนออกมาเต้นกลางห้อง เจ้าของบ้านหันมามอง{name}ทั้งตัว ยิ้มบางๆ อย่างคนที่ได้ของเล่นชิ้นใหม่ ระหว่างนั้น เด็กสาวรับใช้หายไปทางประตูครัว

          ตอนรับค่าจ้าง เจ้าของบ้านจ่ายให้ครบ แล้วถามว่าบ้าน{name}อยู่ที่ไหน
        effects: { stats: { CHA: 1 }, gold: 6, flags: [drew_star_host_eye] }
      failure:
        text: |
          เพลงเต้นรำออกมาเร็วเกินมือ สายพิณหลุดจังหวะไปสองห้อง แขกไม่มีใครหันมา ยังฮัมกันต่อใต้เพลงของ{name} เหมือนเพลงของ{name}เป็นแค่เสียงลมนอกหน้าต่าง เจ้าของบ้านยังมองเด็กสาวคนนั้นอยู่จนเพลงจบ

          สัปดาห์ต่อมา {name}เดินผ่านบ้านหลังนั้น ถามคนเฝ้าประตูถึงเด็กสาวผ้าโพกหัวสีเทาที่ถือถาดแก้ว คนเฝ้าประตูบอกว่าบ้านนี้ไม่มีเด็กรับใช้ผู้หญิง ไม่เคยมี
        effects: { stats: { DEX: 1 }, gold: 6, world: { star: 1 }, flags: [servant_girl_vanished] }
    - id: find_the_girl
      label: พอเพลงจบ ตามเด็กสาวคนนั้นไปที่ครัว
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}ขอตัวไปดื่มน้ำ เดินเลี่ยงแขกออกทางประตูข้าง เจอเด็กสาวล้างแก้วอยู่คนเดียวในครัว {name}บอกเธอว่าเจ้าของบ้านมองเธอทั้งคืน มองแบบที่คนขายเนื้อมองหมูในคอก

          เธอวางแก้วลงในอ่าง "คืนนี้พวกเขาฮัมกันอีกแล้วใช่ไหม" เธอถาม "ฉันได้ยินแต่เสียงพวกเขา ไม่เคยรู้ว่าพวกเขาฮัมตามอะไร" แล้วดึงผ้าโพกหัวให้แน่นขึ้น ออกประตูหลังไปทั้งผ้ากันเปื้อน ไม่กลับมาเอาค่าแรงที่ค้างอยู่
        effects: { stats: { DEX: 1 }, gold: 6, alignment: { moral: 1 }, flags: [warned_servant_girl] }
      failure:
        text: |
          {name}ออกทางประตูข้าง แล้วชนเข้ากับเจ้าของบ้านที่ยืนอยู่กลางทางเดินพอดี เธอยิ้ม ถามว่าหาห้องน้ำหรือ แล้วเดินนำไปเอง

          ระหว่างทางเธอเล่าว่าชอบเสียง{name} ชอบที่{name}ร้องได้ทั้งคืนโดยไม่ต้องฮัมตามใคร แล้วพากลับเข้างาน คืนนั้น{name}ไม่เห็นเด็กสาวคนนั้นอีก
        effects: { stats: { DEX: 1 }, gold: 6, flags: [star_host_noticed] }
    - id: join_the_hum
      label: ปล่อยเพลงลงไปหาเสียงฮัมของแขก
      text: |
        {name}ลดเสียงลง ปล่อยทำนองไหลลงไปหาเสียงต่ำเสียงนั้นทีละเสียง จนเพลงของ{name}กับเสียงฮัมของแขกทั้งห้องกลายเป็นเสียงเดียวกัน เจ้าของบ้านหันมามอง หลับตาลง แล้วยิ้ม

        ตอนรับค่าจ้าง เธอจ่ายให้สองเท่า แล้วชวนให้มาร้องที่บ้านนี้ทุกเย็นวันอัสเทล มีแขกประจำนั่งอ่านหนังสือกันสิบกว่าคน เธอบอกว่าไม่ต้องเตรียมเพลงมา พวกเราร้องเพลงเดียวกันอยู่แล้ว
      effects: { stats: { CHA: 1 }, gold: 12, world: { star: 1 }, reputation: { star_listeners: 1 }, flags: [sang_for_listeners] }

- id: youth.bard_wall_outsiders
  stage: youth
  scene: tavern
  weight: 30
  when:
    age: [15, 17]
    flags: [path_wall_singer]
  text: |
    โรงเตี๊ยมของคนอาร์เวลที่ตลาดตีนเขาเป็นที่แรกที่{name}ได้ร้องกำแพงให้คนนอกฟัง คืนนั้นมีคนนั่งสามสิบกว่าคน พ่อค้าถ่านมาร คนงานเหมืองที่ลงมาจากเหมืองบริษัท ชายแก่ขาเหล็กคนหนึ่ง กับเด็กยกเหล้าที่หยุดเช็ดโต๊ะมายืนฟัง

    {name}ร้องจากชื่อล่างสุดของกำแพงย้อนขึ้นไปหาชื่อบนสุด ชื่อคนที่ตายในเหมือง ชื่อคนที่ผิดคำสาบานแล้วโดนสกัดชื่อออก เหลือแต่รอยหินว่าง หนี้ของตระกูลที่ยังใช้ไม่หมด คนฟังเงียบตั้งแต่ชื่อที่สิบ พ่อค้าถ่านที่หัวเราะอยู่ตอนต้นเพลงวางแก้วลง

    ท่อนถัดไปเป็นท่อนบนสุดของกำแพง ท่อนที่คนแคระทุกคนรู้ และไม่มีใครพูดต่อหน้าคนนอก ท่อนที่บรรพบุรุษขุดลงไปจนทะลุถึงเบื้องล่าง
  choices:
    - id: sing_the_deep
      label: ร้องท่อนนั้นด้วย ให้ครบทั้งกำแพง
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ร้องท่อนนั้นช้าที่สุดในเพลง ไม่ขอโทษแทนใคร ไม่โทษใคร ร้องแค่ว่าใครขุด ขุดลงไปลึกแค่ไหน และอะไรเดินขึ้นมาตามทางนั้น โรงเตี๊ยมเงียบจนได้ยินเสียงฟืนแตกในเตา ร้องจบไม่มีใครปรบมือ

          ชายแก่ขาเหล็กลุกขึ้น เดินกะเผลกมาวางเหรียญลงในหมวก{name} บอกว่าขาข้างนี้คนแคระทำให้ ใส่มาสิบสองปี เพิ่งรู้วันนี้ว่าคนทำแบกอะไรอยู่บนหลัง

          สามวันต่อมาข่าวขึ้นไปถึงเมือง คนแก่ที่สุดในบ้านเรียก{name}ไปยืนหน้ากำแพงชื่อ ให้อ่านคำสาบานของตัวเองออกเสียงหนึ่งรอบ แล้วไล่กลับไปนอน ไม่ได้พูดอะไรมากกว่านั้น
        effects: { stats: { CHA: 1 }, gold: 3, reputation: { dwarf_council: -1 }, flags: [sang_the_deep] }
      failure:
        text: |
          {name}ร้องได้สองบรรทัด คนงานเหมืองหลังห้องก็ตะโกนขึ้นมาว่า งั้นที่บรรพบุรุษข้าต้องคุกเข่าให้จอมมาร ก็เพราะพวกเอ็งขุด แก้วใบแรกลอยมาโดนพิณ ใบที่สองโดนหน้าผาก{name}

          เจ้าของร้านลาก{name}ออกทางหลังร้าน ส่งกลับขึ้นเขาไปกับเกวียนขนถ่านเที่ยวดึก ข่าวขึ้นไปถึงเมืองก่อนตัว{name}เสียอีก
        effects: { hp: -2, stats: { CON: 1 }, reputation: { dwarf_council: -1 }, flags: [sang_the_deep] }
    - id: skip_the_deep
      label: ข้ามท่อนนั้นไป ร้องต่อเหมือนไม่มีอะไรขาด
      text: |
        ไม่มีใครในโรงเตี๊ยมรู้ว่ามีท่อนหายไป ร้องจบคนฟังปรบมือกันทั้งห้อง ชายแก่ขาเหล็กซื้อเหล้าให้หนึ่งแก้ว พ่อค้าถ่านมารจ้างให้มาร้องทุกต้นเดือน {name}นับเหรียญในหมวกได้เจ็ดเหรียญ

        คืนนั้นกลับถึงบ้าน {name}เดินผ่านกำแพงชื่อ แล้วไม่ได้หยุดแตะชื่อบนสุดเหมือนทุกคืน
      effects: { stats: { CHA: 1 }, gold: 7, reputation: { dwarf_council: 1 }, flags: [skipped_the_deep] }
    - id: old_tongue
      label: ร้องท่อนนั้นเป็นภาษาคนแคระ
      text: |
        คนอาร์เวลในห้องได้ยินแต่เสียงหนัก ตัวสะกดแข็ง ทำนองช้าลงจนเหมือนเพลงสวด บางคนหลับตาฟัง นึกว่าเป็นเพลงไว้อาลัยคนตาย ก็ไม่ผิดนัก

        นอกจาก{name} ในโรงเตี๊ยมมีคนแคระอีกคนเดียว คือคนงานเหมืองแก่ที่นั่งมุมห้องมาทั้งคืน พอท่อนนั้นจบ เขาวางแก้วลง เดินมาหย่อนเหรียญในหมวก{name}หนึ่งเหรียญ แล้วบอกเป็นภาษาคนแคระว่า สักวันหนึ่งเจ้าต้องร้องท่อนนี้เป็นภาษาของพวกเขา
      effects: { stats: { CHA: 1, WIS: 1 }, gold: 1, flags: [sang_deep_in_dwarvish] }
