# ชุด 3 วัยกลางคน อายุ 41 ถึง 64: เหตุการณ์ประจำสายนักรบ นักย่อง นักเวท สายละ 4 เรื่อง
# 41–52 สองเรื่อง 53–64 สองเรื่อง แต่ละสายมีการปะทะหนึ่งเรื่องที่ชนะได้โดยไม่ต้องใช้แรง
# ข้อความหลักไม่ถือว่าเรื่องช่วง 25–40 เกิดแล้ว คนเก่าและเรื่องเก่ากลับมาในตัวเลือกที่ต้องมี flag ของติดตัว หรือคนเข้าบท

# ---------- นักรบ ----------
- id: adult.path_warrior_mill_bridge
  stage: adult
  scene: road
  weight: 30
  when:
    age: [41, 52]
    class: warrior
  text: |
    คนสีข้าวจากโรงสีริมลำธารท้ายทางเดินมาหา{name}ถึงบ้าน หมวกฟางอยู่ในมือ ทุกวันตลาดมีคนสี่คนมาที่โรงสีตอนบ่าย แบกข้าวที่สีแล้วออกไปคราวละสามกระสอบ บอกว่าเป็นค่าดูแลทาง ทางนั้นคนสีข้าวถางเองกับมือ เขาไม่มีเงินจ้างใคร มีแต่ข้าวสารหนึ่งกระสอบ กับคำว่าแถวนี้มีคนถือดาบที่เขากล้าไปเคาะประตูบ้านอยู่คนเดียว

    วันก่อนตลาด{name}ไปเดินดูทาง โรงสีตั้งอยู่อีกฟากของรางน้ำ มีสะพานไม้กระดานพาดข้าม กว้างพอให้คนเดินได้ทีละคน ฝั่งนี้เป็นตลิ่งดินเหนียวลาดลงไปหาลำธาร ฝนเมื่อคืนทำให้ดินลื่นจนต้องเดินเอียงตัว

    เข่าขวาของ{name}ลั่นทุกครั้งที่ลงตลิ่ง ลั่นดังพอให้คนสีข้าวหันมาดู สมัยก่อน{name}เลือกที่สู้จากว่าตรงไหนฟันได้ถนัด เดี๋ยวนี้ต้องเลือกจากว่าตรงไหนไม่ต้องก้าวถอย
  choices:
    - id: hold_the_plank
      label: ยืนรับบนสะพานกระดาน ตรงที่คนข้ามมาได้ทีละคน
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ยืนอยู่กลางสะพานตั้งแต่เที่ยง ดาบยังอยู่ในฝัก สี่คนนั้นมาถึงตอนบ่ายตามเวลา คนหน้าสุดก้าวขึ้นกระดานได้สองก้าวก็หยุด เขาเพิ่งเห็นว่าบนไม้กว้างแค่นี้ สี่ต่อหนึ่งก็คือหนึ่งต่อหนึ่ง สามคนข้างหลังทำได้อย่างเดียวคือยืนดูหลังเขา และคนที่ยืนรออยู่กลางสะพานไม่ได้ยืนแบบคนกลัวน้ำ

          เขาถอยลงจากกระดานเอง พาอีกสามคนกลับไปทางเดิม คนสีข้าวแบกข้าวสารมาวางที่ประตูบ้าน{name}หนึ่งกระสอบตามที่บอก เมียของเขาเดินตามมาข้างหลัง ยัดเหรียญสองเหรียญใส่มือ{name}แล้วรีบเดินกลับก่อนจะต้องฟังใครปฏิเสธ
        effects: { stats: { WIS: 1 }, gold: 2, flags: [held_the_mill_bridge] }
      failure:
        text: |
          ไม้กระดานเปียกน้ำจากรางมาตั้งแต่เช้า คนหน้าสุดไม่ขึ้นสะพาน เขาเก็บก้อนหินจากตลิ่งขว้างมาสองก้อน ก้อนที่สองโดนไหล่ {name}เบี่ยงตัวหลบก้อนที่สาม เข่าขวาไม่ไปด้วย เท้าลื่นจากขอบกระดานลงรางน้ำทั้งตัว

          น้ำในรางลึกแค่อก แต่เย็นและแรง กว่าคนสีข้าวจะเอาไม้ยาวมาดึง{name}ขึ้นได้ สี่คนนั้นแบกกระสอบไปครบสามใบ คนสุดท้ายหันมาโบกมือให้
        effects: { hp: -2, flags: [fell_in_the_millrace] }
    - id: meet_them_on_the_road
      label: ไปนั่งรอพวกนั้นที่ทางเกวียนก่อนถึงโรงสี คุยกับคนหัวหน้าก่อนจะต้องชักดาบ
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}นั่งรออยู่บนตอไม้ข้างทาง ดาบพาดตัก คนหัวหน้าอายุไม่ถึงสามสิบ เขาเห็นดาบก่อนเห็นหน้า {name}ไม่ลุก บอกเขาว่าโรงสีนี้ส่งข้าวให้บ้านเขาเองด้วย แม่ของเขาซื้อข้าวจากที่นี่ทุกตลาด เขาเถียงว่าไม่จริง {name}บอกชื่อแม่เขาให้ฟัง ชื่อที่คนสีข้าวจดไว้ในสมุดเชื่อ

          เขายืนอยู่ตรงนั้นจนอีกสามคนเริ่มเดินกลับไปก่อน แล้วถามว่า{name}จะไปบอกแม่เขาไหม {name}บอกว่าจะไม่บอก ถ้าตลาดหน้าเขาไม่มา

          ตลาดหน้าเขาไม่มา ตลาดต่อไปก็ไม่มา
        effects: { stats: { CHA: 1 }, flags: [talked_down_the_mill_gang] }
      failure:
        text: |
          คนหัวหน้าฟังจนจบ แล้วบอกว่าคนแก่พูดเก่งทุกคน เขาให้อีกสามคนเดินอ้อม{name}ไปทางทุ่ง {name}ลุกขึ้นตามได้ช้ากว่าที่ตั้งใจไว้ครึ่งจังหวะ และในที่โล่งไม่มีอะไรบังข้าง ศอกของคนหนึ่งได้ซี่โครงไปก่อนดาบจะออกจากฝัก

          พวกนั้นได้ข้าวสองกระสอบในวันนั้น ไม่ใช่สาม คนสีข้าวบอกว่าถือว่าดีขึ้นแล้ว ตอนพูดเขาก้มดูหมวกฟางในมือตัวเอง
        effects: { hp: -2, flags: [lost_the_mill_road] }
    - id: teach_the_millers_sons
      label: สอนลูกชายสองคนของคนสีข้าวให้ถือไม้พลองยืนคู่กัน ส่วน{name}ยืนอยู่ข้างหลัง
      text: |
        {name}มีเวลาสี่วัน สอนได้ท่าเดียว คือยืนชิดกัน ไหล่ชนไหล่ ปลายไม้พลองชี้ไปข้างหน้าทางเดียวกัน ไม่ต้องตี แค่ไม่ถอย สองพี่น้องเหงื่อแตกตั้งแต่วันแรก คนน้องร้องไห้ตอนเย็นวันที่สองเพราะมือพอง

        วันตลาดสี่คนนั้นมาถึงก็หยุดอยู่ที่หัวสะพาน ข้างหน้ามีไม้พลองสองอัน ข้างหลังไม้พลองมีคนถือดาบยืนพิงเสาโรงสี สี่คนนั้นยืนนับอยู่พักหนึ่ง แล้วหันไปเอาข้าวที่อื่น คนน้องปล่อยไม้พลองหล่นตอนเห็นพวกนั้นหันหลัง มือทั้งสองข้างยังสั่นไปจนถึงมื้อเย็น
      effects: { alignment: { moral: 1 }, flags: [taught_the_millers_sons] }
    - id: sit_on_the_bridge
      label: ยกเก้าอี้ไปตั้งกลางสะพาน นั่งรอ ไม่ต้องยืนด้วยเข่าข้างนั้น
      requires: { flag: warrior_bad_knee }
      text: |
        ตั้งแต่คืนที่เข่าขวาทรุดต่อหน้าเด็กหนุ่มถือปืนเวท {name}รู้ว่ายืนนานไม่ได้ แต่นั่งได้ทั้งวัน {name}ยกเก้าอี้ไม้จากโรงสีไปตั้งกลางกระดาน วางดาบพาดตัก แล้วนั่งรอตั้งแต่เที่ยง

        สี่คนนั้นมาถึงหัวสะพานแล้วหยุด คนถือดาบที่ยืนรอ คนหัวหน้ารู้ว่าต้องทำอย่างไร คนถือดาบที่นั่งรอ ไม่ลุก ไม่จับด้าม เขาไม่รู้ เขาเดาเอาว่าคนที่นั่งได้ต้องรู้อะไรบางอย่างที่เขาไม่รู้ เขาถุยน้ำลายลงรางน้ำ แล้วพาอีกสามคนกลับไป เย็นนั้นคนสีข้าวยกเก้าอี้ตัวนั้นมาให้{name}ถึงบ้าน ขาเก้าอี้ยังเปียกน้ำจากกระดาน
      effects: { gold: 2, flags: [sat_the_mill_bridge] }

- id: adult.path_warrior_row_door
  stage: adult
  scene: market
  weight: 30
  when:
    age: [41, 52]
    class: warrior
  text: |
    ห้องแถวท้ายตลาดเปลี่ยนเจ้าของตั้งแต่ต้นฤดู เจ้าของใหม่อยากได้ที่ดินเปล่าไปทำโกดัง สามบ้านย้ายออกไปแล้ว เหลือสองบ้านที่ไม่มีที่ไป ยายขายผักดองกับหลานสองคนบ้านหนึ่ง ช่างซ่อมรองเท้าขาเป๋อีกบ้านหนึ่ง

    เช้านี้เจ้าของใหม่ส่งคนมาคนเดียว ทหารรับจ้างผมขาวที่ขมับ อายุไล่เลี่ยกับ{name} เข่าซ้ายพันผ้าไว้แน่นทับกางเกง เขาขนหีบเครื่องมือของช่างรองเท้าออกมาวางข้างทางทีละใบอย่างระวัง ไม่ทำของใครแตก ยายขายผักดองยืนขวางประตูบ้านตัวเอง ถือไม้กวาด

    {name}เดินผ่านมาพอดี ทหารรับจ้างเห็นท่าเดินของ{name} เห็นดาบ เขาวางหีบใบสุดท้ายลง แล้วชักดาบออกมาช้าๆ "ข้ารับเงินมาครึ่งวัน" เขาว่า "ไม่อยากให้ครึ่งวันนี้ยาวกว่านั้น"
  encounter:
    foe: mercenary
    name: ทหารรับจ้างผมขาว
    morale: 2
    beats:
      - text: เขาไม่บุก ยืนเอียงน้ำหนักไปทางขาขวา ดาบชี้ต่ำ รอดูว่า{name}จะเข้ามาทางไหน ยายขายผักดองยังยืนอยู่ที่ประตูข้างหลัง{name}
        moves:
          - id: row_read_knee
            label: ไม่เข้า ยืนดูว่าเข่าที่พันผ้าของเขารับน้ำหนักได้แค่ไหน
            kind: read
            stat: WIS
            success: เขาย้ายน้ำหนักจากขาขวาไปขาซ้ายครั้งหนึ่ง แล้วย้ายกลับทันที หน้าไม่เปลี่ยน แต่มุมปากกระตุก เข่าซ้ายของเขาแย่กว่าเข่าขวาของ{name} เขาจะไม่ก้าวไปทางซ้ายถ้าไม่จำเป็น และเขารู้ว่า{name}เห็นแล้ว
          - id: row_take_door
            label: ถอยไปยืนในกรอบประตูบ้านยาย ให้วงกบบังสองข้าง
            kind: guard
            success: วงกบไม้เก่ากว้างพอดีตัว ไม่มีช่องให้ใครอ้อมมาข้าง ถ้าจะเข้ามาต้องเข้ามาตรงๆ ทางเดียว ทหารรับจ้างดูวงกบ ดูเข่าตัวเอง แล้วถอนใจ
          - id: row_ask_pay
            label: ถามเขาว่าเจ้าของใหม่จ่ายครึ่งวันเท่าไร
            kind: talk
          - id: row_lunge
            label: เข้าไปฟันก่อนที่เขาจะตั้งตัว
            kind: attack
            tags: [edge]
            failure: ดาบของเขารออยู่ตรงที่{name}จะเข้ามาพอดี เขาไม่ต้องก้าวเลย ปัดแล้วฟันกลับในจังหวะเดียว ท่าของคนที่หากินกับการรอให้คนอื่นบุกมาทั้งชีวิต คมดาบเปิดแผลยาวที่ต้นแขนของ{name}
          - id: row_leave
            label: ถอยออกไป บอกยายว่าคนเดียวสู้ไม่ไหว
            kind: flee
      - text: เขาเปลี่ยนใจ เข้ามาเอง ฟันสั้นสามครั้งติดกัน หนักทุกครั้ง แบบคนที่อยากให้จบก่อนเข่าจะบอกว่าพอ
        answer: guard
        moves:
          - id: row_hold
            label: ยืนให้มั่น รับทั้งสามดาบ ไม่ถอยสักก้าว
            kind: guard
            success: สองดาบแรกสะเทือนขึ้นไปถึงไหล่ ดาบที่สามเบากว่าเพราะเขาต้องลงน้ำหนักขาซ้ายตอนฟัน {name}ไม่ฟันกลับ แค่ดันดาบเขาออกไป เขาเซไปก้าวหนึ่ง ทางซ้าย
          - id: row_sidestep
            label: ก้าวหลบออกข้าง ให้เขาฟันลม
            kind: quick
            failure: เข่าขวาของ{name}ก้าวช้ากว่าที่หัวสั่งไปครึ่งก้าว ดาบที่สามมาถึงก่อน ปลายดาบกรีดผ่านสีข้างเป็นรอยยาวเท่าฝ่ามือ
          - id: row_shout
            label: ตะโกนบอกเขาว่าฟันแรงขนาดนี้ เข่าข้างนั้นไม่พาเขากลับถึงบ้าน
            kind: talk
          - id: row_leave2
            label: ถอยหลังออกไปทางตลาด ปล่อยห้องแถวไป
            kind: flee
      - text: คนในตลาดเริ่มออกมายืนดูหัวท้ายห้องแถว ช่างรองเท้านั่งบนหีบเครื่องมือของตัวเอง ทหารรับจ้างเอาหลังมือปาดเหงื่อ แล้วยกดาบขึ้นอีกครั้ง ช้ากว่าครั้งก่อน
        answer: talk
        moves:
          - id: row_same_knee
            label: ถามเขาเบาๆ ว่าเข่าข้างนั้นเจ็บมาจากที่ไหน
            kind: talk
            success: เขาตอบโดยไม่ได้ตั้งใจจะตอบ ทางขึ้นเขาหน้าหนาว ม้าล้มทับ ยี่สิบปีแล้ว {name}เล่าที่มาของเข่าตัวเองให้ฟังบ้าง เขาหัวเราะออกมาเสียงหนึ่ง แล้วดูเหมือนจะโกรธตัวเองที่หัวเราะ
          - id: row_offer_day
            label: บอกว่าครึ่งวันที่เหลือ{name}จ่ายให้เอง ให้เขากลับไปบอกเจ้าของว่าไม่มีใครอยู่บ้าน
            kind: talk
            parley: true
            requires: { min_gold: 3 }
          - id: row_hold2
            label: ยืนอยู่ที่เดิม ให้เขาเป็นคนเลือกเองว่าจะเข้ามาไหม
            kind: guard
          - id: row_read_grip
            label: ดูว่ามือที่ถือดาบของเขายังกำแน่นเท่าตอนแรกไหม
            kind: read
            stat: INT
            success: ข้อนิ้วของเขาขาวน้อยลง ด้ามดาบเลื่อนลงในมือไปครึ่งข้อ เขาไม่ได้เหนื่อยจนถือไม่ไหว เขาแค่เลิกเชื่อว่าครึ่งวันนี้คุ้ม
          - id: row_leave3
            label: เก็บดาบ เดินออกไปจากห้องแถว
            kind: flee
    win:
      text: |
        ทหารรับจ้างลดดาบลงจนปลายแตะดิน ยืนพิงมันอยู่ครู่หนึ่งเหมือนพิงไม้เท้า แล้วเก็บเข้าฝัก บอกว่าครึ่งวันของเขาหมดแล้ว ที่เหลือเป็นเวลาของเขาเอง

        เขาช่วยช่างรองเท้ายกหีบเครื่องมือกลับเข้าห้องทีละใบ ช้าเท่าตอนยกออก แล้วเดินกระเผลกกลับไปทางที่มา ห้องแถวท้ายตลาดยังมีคนอยู่สองบ้านไปจนจบฤดูฝน ยายขายผักดองเอาผักดองมาวางหน้าประตูบ้าน{name}ไหหนึ่งทุกต้นเดือน
      effects: { stats: { CON: 1 }, flags: [held_the_row_door] }
    lose:
      text: |
        {name}ลืมตาขึ้นมาบนพื้นหน้าห้องแถว ยายขายผักดองเอาผ้าเปียกกดไว้ที่หน้าผาก ทหารรับจ้างไปแล้ว หีบเครื่องมือของช่างรองเท้าเรียงอยู่ริมทางครบทุกใบ ประตูบ้านยายมีกลอนใหม่คล้องจากข้างนอก

        ยายบอกว่าเขาไม่ได้ฟันซ้ำ เขาลาก{name}ออกมาให้พ้นธรณีประตูก่อนจะคล้องกลอน
      effects: { flags: [lost_the_row_door] }
    stalemate:
      text: |
        คนในตลาดออกมายืนดูมากเกินไป มีคนตะโกนเรียกยามเมือง ทหารรับจ้างได้ยิน เขาถอยออกไปสองก้าว เก็บดาบ แล้วบอกว่าพรุ่งนี้เจ้าของจะส่งคนมาอีก ไม่ใช่เขา คนที่เด็กกว่า

        พรุ่งนี้ไม่มีใครมา มะรืนก็ไม่มี ช่างรองเท้ายกหีบเครื่องมือกลับเข้าห้อง แต่ไม่แกะของออกจากหีบอีกเลย
      effects: { flags: [stood_off_the_old_sword] }
    flee:
      text: |
        {name}เดินออกจากห้องแถวโดยไม่หันกลับไปดู เสียงไม้กวาดของยายฟาดอะไรสักอย่างดังตามมาสองที แล้วเงียบ

        ตกเย็นห้องแถวท้ายตลาดว่างทั้งแถว อีกครึ่งเดือนต่อมามีคนมารื้อหลังคา {name}ต้องเดินอ้อมไปซื้อผักดองที่ตลาดอีกฝั่ง
      effects: { flags: [left_the_row_door] }
    parley:
      text: |
        ทหารรับจ้างนับเหรียญในมือ แล้วนับใหม่ เขาบอกว่าเจ้าของจ่ายครึ่งวันน้อยกว่านี้ แล้วเก็บดาบ ก่อนไปเขายกหีบใบสุดท้ายกลับเข้าไปวางในห้องของช่างรองเท้าเอง

        เขาบอกเจ้าของว่าไม่มีใครอยู่บ้านตามที่ตกลงกันไว้ เจ้าของส่งคนมาใหม่ในเดือนต่อมา สองบ้านนั้นใช้เดือนนั้นหาที่ไปจนได้
      effects: { gold: -3, flags: [paid_the_old_sword_off] }
    death:
      text: |
        ดาบของเขามาถึงเร็วกว่าที่เข่าของ{name}จะพาตัวหลบได้ทัน ทหารรับจ้างไม่ได้เช็ดดาบ เขาวางมันลงบนพื้นข้างตัว{name} แล้วนั่งลงบนหีบเครื่องมือของช่างรองเท้า เอามือกดเข่าซ้ายไว้ นั่งอยู่อย่างนั้นจนยามเมืองมาถึง

- id: adult.path_warrior_behind_the_line
  stage: adult
  scene: road
  time: night
  weight: 30
  cast:
    pupil: { id: mila, optional: true }
  when:
    age: [53, 64]
    class: warrior
  text: |
    ฤดูหนาวปีนี้คนปล้นลงมาจากเขาเร็วกว่าทุกปี ตีโรงนาท้ายถิ่นไปสองแห่งในครึ่งเดือน คนในถิ่นตั้งยามกลางคืนขึ้นใหม่ บ้านไหนมีคนจับของมีคมเป็น ต้องส่งมาบ้านละคน หัวหน้ายามเป็นลูกชายช่างตีเหล็ก อายุยังไม่ถึงยี่สิบห้า ใส่เกราะหนังที่พ่อตอกหมุดให้ใหม่ทั้งตัว

    เขาจัดแถวที่ทางเข้าถิ่นตอนพลบค่ำ คนหนุ่มเก้าคนยืนหน้า ถือหอกถือขวาน พอเห็น{name}มาถึง เขาก็เดินมาหาด้วยท่าทางนอบน้อมแบบที่คนหนุ่มใช้กับคนแก่ แล้วให้{name}ไปยืนข้างหลัง ถือตะเกียง เฝ้าถังน้ำเผื่อไฟไหม้ เขาบอกว่าตรงนั้นสำคัญเหมือนกัน

    {name}ยืนอยู่ข้างหลังได้ไม่นานก็เห็นสองอย่าง แถวของเขากว้างเกินไป ช่องระหว่างคนเดินผ่านได้ทั้งตัว และตะเกียงทุกดวงแขวนอยู่ข้างหลังแถว คนที่ลงมาจากเขาจะเห็นเงาของคนหนุ่มเก้าคนชัดเหมือนตัดกระดาษ ส่วนคนหนุ่มเก้าคนจะเห็นแค่ความมืด
  choices:
    - id: move_the_lanterns
      label: รับที่ข้างหลัง แล้วย้ายตะเกียงไปไว้ตรงที่ควรอยู่ โดยไม่ต้องบอกใคร
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ถือตะเกียงเดินออกไปทีละดวงเหมือนคนแก่ที่ไปเติมน้ำมัน แขวนไว้บนกิ่งไม้ข้างทางลงเขา ห่างหน้าแถวออกไปสามสิบก้าว หัวหน้ายามไม่ทันเห็น เขากำลังนับคนในแถว พอดึกคนปล้นหกคนลงมาตามทาง เดินเข้ามาในแสงตะเกียงก่อนจะรู้ว่ามีใครรออยู่ คนหนุ่มเก้าคนเห็นคนพวกนั้นชัดทุกคน คนพวกนั้นเห็นแค่แสงแยงตา

          หกคนนั้นหันหลังกลับขึ้นเขาโดยไม่มีใครต้องเลือดออก เช้าวันต่อมาหัวหน้ายามเล่าให้พ่อฟังว่าเขาตั้งตะเกียงไว้หน้าแถว พ่อของเขาชมว่าคิดได้ดี {name}ได้ยินอยู่ในร้านตีเหล็ก ระหว่างรอเขาตอกหมุดเข็มขัดให้
        effects: { stats: { WIS: 1 }, flags: [moved_the_watch_lanterns] }
      failure:
        text: |
          หัวหน้ายามเห็น{name}แขวนตะเกียงดวงที่สองบนกิ่งไม้ เขาวิ่งมาปลดลงเอง บอกอย่างสุภาพว่าตะเกียงต้องอยู่ข้างหลัง คนในแถวจะได้เห็นทางถอย แล้วยกตะเกียงกลับไปแขวนที่เดิม

          คืนนั้นคนปล้นไม่ลงมาทางนี้ พวกนั้นอ้อมไปตีโรงนาอีกฝั่งของถิ่น ตรงที่ไม่มีใครยืนอยู่เลย คนหนุ่มเก้าคนยืนจนสาง {name}ยืนข้างถังน้ำจนเข่าทั้งสองข้างแข็ง กว่าจะเดินกลับถึงบ้านก็สาย
        effects: { hp: -1, flags: [lanterns_put_back] }
    - id: tell_the_young_captain
      label: เรียกหัวหน้ายามไปคุยหลังถังน้ำ บอกเขาตรงๆ ว่าแถวกว้างเกินไป
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ไม่พูดต่อหน้าคนในแถว บอกเขาเรื่องช่องระหว่างคน เรื่องตะเกียง แล้วบอกว่าตอนอายุเท่าเขา{name}ก็ตั้งแถวแบบนี้ และก็มีคนแก่คนหนึ่งมาบอกแบบนี้เหมือนกัน

          เขากลับไปบีบแถวเข้าหากันจนไหล่ชนไหล่ ย้ายตะเกียงออกไปข้างหน้าเองโดยไม่ต้องให้ใครบอกเป็นครั้งที่สอง คืนที่สามคนปล้นลงมา เจอแถวที่ไม่มีช่อง แล้วกลับขึ้นไป ตลอดฤดูหนาวนั้น ก่อนจัดแถวทุกเย็น เขาจะเดินมายืนข้างถังน้ำครู่หนึ่ง ไม่ได้ถามอะไร แค่ยืน แล้วค่อยเดินกลับไปที่แถว
        effects: { stats: { CHA: 1 }, flags: [taught_the_young_captain] }
      failure:
        text: |
          เขาฟังจนจบ ยิ้มแบบที่คนหนุ่มยิ้มให้คนแก่ แล้วบอกว่าขอบคุณ เขาจะจำไว้ พอ{name}เดินกลับไปที่ถังน้ำ ก็ได้ยินคนในแถวคนหนึ่งเลียนเสียงคนแก่ให้เพื่อนฟัง เสียงหัวเราะดังไปจนสุดแถว

          แถวกว้างเท่าเดิมไปจนจบฤดู คืนหนึ่งปลายฤดูคนปล้นลอดช่องเข้ามาได้สองคน ขวานของคนหนึ่งได้แขนลูกชายช่างไม้ไป {name}เป็นคนพันแผลให้ ที่ข้างถังน้ำ
        effects: { flags: [unheard_at_the_line] }
    - id: stand_in_the_gap
      label: วางตะเกียงไว้ข้างถังน้ำ แล้วเดินไปยืนในช่องที่กว้างที่สุดของแถว
      check: { stat: CON, dc: 14 }
      success:
        text: |
          ไม่มีใครกล้าไล่{name}กลับไป หัวหน้ายามเปิดปากจะพูด แล้วปิด คืนที่สองคนปล้นลงมาตรงช่องนั้นพอดี เพราะในความมืดช่องนั้นยังดูว่าง คนแรกที่ลอดเข้ามาเจอด้ามดาบเข้าที่ท้อง คนที่สองเห็นคนแรกล้มแล้ววิ่งกลับขึ้นไป

          {name}ยืนอยู่ในช่องนั้นทุกคืนจนจบฤดู ไม่ต้องฟันใครอีก แต่ทุกเช้าต้องนั่งแช่เข่าในน้ำอุ่นจนแดดสูง คนหนุ่มในแถวเริ่มเรียกช่องนั้นด้วยชื่อของ{name}
        effects: { stats: { CON: 1 }, flags: [held_the_gap_in_the_line] }
      failure:
        text: |
          คืนแรกยังไหว คืนที่สามเข่าขวาแข็งจนงอไม่ลง พอคนปล้นลงมา {name}หันตัวตามได้ช้า ด้ามขวานกระแทกเข้าที่ไหล่ หัวหน้ายามกับคนหนุ่มอีกสองคนเป็นคนไล่พวกนั้นกลับขึ้นไป

          เช้าวันต่อมาหัวหน้ายามเอาตะเกียงมาคืน{name}ด้วยมือตัวเอง ยังสุภาพเหมือนเดิม ไม่มีใครเอ่ยถึงช่องในแถวอีก ช่องนั้นมีคนหนุ่มคนหนึ่งยืนแทนไปจนจบฤดู
        effects: { hp: -3, flags: [knocked_down_at_the_line] }
    - id: mila_reads_the_line
      label: หันไปดูคนในเสื้อคลุมของภาคีที่ลงมาจากเกวียนท้ายถิ่น
      requires: { cast: [pupil] }
      text: |
        มิลาผ่านมากับเกวียนของภาคีผู้เฝ้าผนึกที่แวะพักม้าท้ายถิ่น นางเห็นแถวก่อนเห็น{name} ยืนดูอยู่ครู่เดียว แล้วเดินไปหาหัวหน้ายาม บอกเขาด้วยเสียงเรียบๆ ว่าคนยืนห่างกันเกินช่วงแขน ตะเกียงแขวนผิดฝั่ง และคนที่ยืนหลังสุดควรเป็นคนที่เคยยืนหน้าสุดมาก่อน เพราะคนนั้นเห็นทั้งแถว

        หัวหน้ายามแก้แถวตามนางทุกคำ เขาไม่เถียงคนของภาคี ก่อนเกวียนออก มิลาเดินมาหยุดข้างถังน้ำ บอก{name}ว่าคำพวกนั้นนางไม่ได้คิดเอง นางได้มาจากหลังบ้านของ{name} ตอนเช้ามืดเมื่อหลายปีก่อน แล้วนางก็ขึ้นเกวียนไป ตะเกียงดวงที่นางย้ายส่องทางลงเขาอยู่อย่างนั้นจนสาง
      effects: { people: [{ id: mila, closeness: 1 }], flags: [mila_fixed_the_line] }

- id: adult.path_warrior_blade_count
  stage: adult
  scene: home
  weight: 30
  when:
    age: [53, 64]
    class: warrior
  text: |
    เสมียนจากเมืองมาเคาะประตูตอนสาย ถือสมุดบัญชีเล่มหนากับกล่องป้ายดีบุก ปีนี้เมืองสั่งนับใบมีดทุกเล่มที่ยาวเกินศอกในบ้านคน เล่มไหนจะเก็บไว้ต้องจดชื่อเจ้าของ ตอกป้ายดีบุกที่โคนด้าม จ่ายปีละสองเหรียญ เล่มไหนไม่อยากจ่าย ให้ส่งไปที่ลานหลอม เหล็กดาบเก่าเป็นเหล็กดี โรงหลอมเอาไปรีดเป็นรางรถไฟได้

    ดาบของ{name}แขวนอยู่เหนือประตูตั้งแต่ต้นฤดูหนาว ทุกเจ็ดวัน{name}ปลดลงมาเช็ดน้ำมันครั้งหนึ่งแล้วแขวนกลับ ทั้งฤดูยังไม่ได้คาดเอวออกนอกบ้านสักครั้ง

    เสมียนอายุน้อยพอจะเป็นหลาน เขาเงยหน้าดูดาบบนผนัง แล้วถามว่ายังใช้อยู่ไหม ถามแบบคนที่ต้องเขียนคำตอบลงช่อง
  choices:
    - id: pay_and_hang
      label: จ่ายสองเหรียญ ให้เขาตอกป้ายดีบุกแล้วแขวนไว้ที่เดิม
      requires: { min_gold: 2 }
      text: |
        เสมียนตอกป้ายดีบุกเข้าที่โคนด้ามสามที ป้ายเล็กเท่าเล็บหัวแม่มือ มีเลขประจำเล่มกับตราเมือง เขาจดชื่อ{name}ลงช่องเจ้าของ ส่วนช่องว่ายังใช้อยู่หรือไม่ เขาเขียนเองโดยไม่ถามซ้ำ

        ดาบกลับไปแขวนเหนือประตู คืนนั้นแสงตะเกียงในห้องตกกระทบป้ายดีบุก เกิดประกายเล็กๆ จุดหนึ่งตรงโคนด้าม ตรงที่มือเคยกำทุกวัน
      effects: { gold: -2, alignment: { law: 1 }, flags: [registered_the_old_sword] }
    - id: send_it_to_the_melt
      label: ปลดดาบลงจากผนัง เดินเอาไปส่งที่ลานหลอมเอง
      text: |
        ลานหลอมอยู่ริมน้ำ ใบมีดกองสูงเท่าเอว ดาบทหาร มีดตัดไม้ หอกหักครึ่ง ใบเคียวที่ทื่อจนไม่เหลือคม คนคุมลานรับดาบของ{name}ไปชั่งกับตาชั่งแขวน แล้วโยนลงกองโดยไม่ได้ดู

        {name}ยืนรอจนเขาตักกองนั้นเข้าเตาไปหนึ่งพลั่ว เหล็กในเตาแดงเท่ากันหมด เล่มไหนเป็นของใครดูไม่ออกแล้ว ขากลับบ้านมือขวาของ{name}ยังกำอยู่ข้างตัว ต้องคลายนิ้วออกเองทีละนิ้ว
      effects: { stats: { WIS: 1 }, flags: [melted_the_old_sword] }
    - id: call_it_an_ornament
      label: บอกเสมียนว่าดาบเล่มนั้นเป็นของประดับ ทื่อมาสิบปีแล้ว
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ปลดดาบลงมาให้เขาดู ใช้นิ้วโป้งลูบไปตามคม ทำหน้าแบบคนที่รู้ดีว่าคมนี้ทื่อ เสมียนไม่ได้ลองเอง เขาเขียนในช่องว่าของประดับ ไม่ต้องตอกป้าย ไม่ต้องจ่าย แล้วเดินไปเคาะประตูบ้านถัดไป

          คืนนั้น{name}ลับดาบใหม่ทั้งเล่ม เสียงหินลับดังไปถึงบ้านข้างๆ จนดึก คมกลับมาบางเหมือนเดิม แล้วดาบก็กลับไปแขวนเหนือประตูที่เดิม
        effects: { stats: { CHA: 1 }, flags: [called_the_sword_dull] }
      failure:
        text: |
          เสมียนฉีกกระดาษแผ่นหนึ่งจากท้ายสมุด ยื่นเข้าไปแตะคมดาบเบาๆ กระดาษขาดเป็นสองแผ่นเอง เขาเงยหน้าขึ้น ไม่ได้โกรธ ดูเหนื่อยมากกว่า แล้วเขียนค่าปรับลงช่องข้างๆ

          {name}จ่ายสี่เหรียญ สองเหรียญเป็นค่าป้าย อีกสองเหรียญเป็นค่าโกหก ป้ายดีบุกตอกลงที่โคนด้ามแรงกว่าที่ต้องตอก
        effects: { gold: -4, flags: [fined_for_the_sword] }
    - id: kedras_sword_off_the_wall
      label: ยกดาบที่มีรอยบิ่นสามรอยลงจากผนัง บอกเสมียนว่าเล่มนี้ไม่ได้มีไว้แขวน
      requires: { item: kedra_sword, min_gold: 2 }
      text: |
        ตลอดเวลาที่ดาบเล่มนี้อยู่กับเคดรา ไม่เคยมีวันไหนที่มันแขวนอยู่บนผนัง ฤดูหนาวนี้มันแขวนมาแล้วทั้งฤดู {name}จ่ายสองเหรียญให้เสมียนตอกป้ายดีบุก แล้วบอกให้เขาเขียนในช่องว่ายังใช้อยู่

        ตั้งแต่วันนั้นดาบเล่มนั้นอยู่ที่เอวทุกครั้งที่{name}ออกจากบ้าน ไปตลาดก็คาด ไปบ่อน้ำก็คาด เด็กๆ ในถิ่นเดินตามมานับรอยบิ่นบนใบดาบ นับได้สามทุกครั้ง แล้วถามว่ารอยไหนได้มาจากใคร {name}ตอบได้อย่างเดียว ว่าไม่มีรอยไหนเป็นของ{name}เลย
      effects: { gold: -2, stats: { STR: 1 }, flags: [wore_kedras_sword_again] }

# ---------- นักย่อง ----------
- id: adult.path_rogue_known_hands
  stage: adult
  scene: market
  weight: 30
  cast:
    old_hand: { id: finnick, optional: true }
  when:
    age: [41, 52]
    class: rogue
  text: |
    แม่ค้าขายผ้าย้ายถุงเงินจากเอวขวาไปเอวซ้ายตอนที่{name}เดินผ่าน ไม่ได้ทำให้ใครเห็น ทำเหมือนเกาเอว เด็กสองคนที่วิ่งเล่นข้างบ่อน้ำหยุดวิ่ง ชี้มือมาทาง{name}แล้วกระซิบกัน ยามตลาดคนใหม่ที่{name}ไม่เคยเห็นหน้าทัก{name}ด้วยชื่อจริง

    บ่ายวันนั้นช่างทองหัวตลาดร้องขึ้นมาว่าแหวนทองฝังพลอยหายไปจากนิ้ว ระหว่างที่เขายืนต่อราคาปลาอยู่หน้าแผง ยามตลาดมาถึงก่อนที่เขาจะร้องจบ ยามไม่ได้ถามว่าใครยืนอยู่ใกล้ ยามเดินตรงมาหา{name}

    วันนี้มือของ{name}ไม่ได้แตะกระเป๋าของใครเลย แต่ทั้งตลาดยืนดูอยู่ และทั้งตลาดรู้ว่ามือคู่นี้เคยทำอะไรได้
  choices:
    - id: find_the_real_hand
      label: ขอเวลายามเท่าน้ำเดือดหนึ่งกา จะหาแหวนมาให้เอง
      check: { stat: INT, dc: 13 }
      success:
        text: |
          คนที่ถอดแหวนจากนิ้วคนอื่นได้ไม่ได้ใช้แรง ใช้น้ำมัน {name}เดินย้อนไปที่แผงปลา หาคนที่มือเป็นมันวาวแต่ไม่ได้ขายของทอด เจอเด็กชายผอมคนหนึ่งนั่งยองๆ อยู่ข้างแผงผัก มือข้างหนึ่งกำไว้ อีกข้างเช็ดกับเสื้อไม่หยุด {name}นั่งลงข้างเขา บอกเบาๆ ว่าถ้ากลืนลงไปจะต้องรอสองวัน แล้วยามจะรอด้วย

          เด็กแบมือ แหวนกลับไปถึงนิ้วช่างทองก่อนน้ำเดือด ยามตลาดจดชื่อเด็กแทนชื่อ{name} ช่างทองยื่นเหรียญให้สามเหรียญ ไม่ได้ขอบคุณ ยื่นให้แบบคนจ่ายค่าตามหาของ
        effects: { stats: { INT: 1 }, gold: 3, flags: [found_the_goldsmiths_ring] }
      failure:
        text: |
          {name}เดินตามรอยไปถึงแผงปลา แผงผัก ร้านขนม แหวนไม่อยู่ที่ไหนทั้งนั้น คนที่เอาไปคงออกจากตลาดไปนานแล้ว ยามตลาดเดินตามอยู่ตลอดทาง พอน้ำเดือดเขาก็จับแขน{name}

          คืนนั้น{name}นอนในห้องขังของยามตลาด เช้ามาเขาปล่อยตัวเพราะไม่เจอแหวนในตัว{name} แต่เก็บค่านอนสองเหรียญ ตลาดนั้นจำได้แต่ว่า{name}ไปค้างห้องขัง ไม่มีใครจำว่าออกมาเพราะอะไร
        effects: { gold: -2, flags: [jailed_for_the_ring] }
    - id: turn_out_your_pockets
      label: ถอดเสื้อนอก พลิกกระเป๋าทุกใบออกกลางตลาดให้ทุกคนดู
      text: |
        {name}ถอดเสื้อนอกส่งให้ยาม พลิกกระเป๋ากางเกงทั้งสองข้าง ถอดรองเท้าเคาะลงบนพื้นทีละข้าง แล้วยืนกางแขนให้เขาคลำจนถึงข้อเท้า ในกระเป๋ามีเศษเชือก เหรียญทองแดงสองเหรียญ กับถั่วคั่วที่ซื้อมาเมื่อเช้า

        ยามคืนเสื้อให้ คนที่ยืนดูเริ่มเดินกลับไปที่แผงของตัวเอง สองวันต่อมาช่างทองเจอแหวนในรอยพับผ้ากันเปื้อนของตัวเอง ไม่มีใครมาบอก{name} {name}รู้จากเด็กที่วิ่งเล่นข้างบ่อน้ำ
      effects: { alignment: { law: 1 }, flags: [turned_out_pockets_at_market] }
    - id: slip_the_watch
      label: ปล่อยให้ยามเดินมาถึงครึ่งทาง แล้วหายเข้าไปในฝูงคน
      habit: light_fingers
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ตลาดตอนบ่ายมีคนมากพอให้คนคนหนึ่งหายไปได้ ถ้ารู้ว่าต้องก้มตรงไหน {name}ก้มหลบหลังเกวียนแตง เดินตามคนแบกกระสอบไปสิบก้าว แล้วออกทางตรอกหลังร้านขนม ยามตลาดยังยืนหันซ้ายหันขวาอยู่หน้าแผงปลา

          {name}รอดจากยามได้ แต่ตลาดนั้นจำ ตั้งแต่ตลาดหน้าเป็นต้นไป แม่ค้าทุกแผงย้ายถุงเงินมาไว้ข้างหน้าตอนที่{name}เดินผ่าน ไม่มีใครทำเหมือนเกาเอวอีกแล้ว
        effects: { stats: { DEX: 1 }, flags: [slipped_the_market_watch] }
      failure:
        text: |
          เข่าของ{name}ก้มได้ไม่เร็วเท่าที่หัวจำ เกวียนแตงขยับออกไปก่อน ยามหนุ่มคว้าคอเสื้อไว้ได้ ดึงแรงจนตะเข็บไหล่ขาด {name}เซไปกระแทกเสาแผงปลา

          ยามไม่เจอแหวนในตัว{name} แต่การวิ่งหนียามก็มีความผิดของมันเอง {name}จ่ายค่าปรับสามเหรียญที่หน้าโต๊ะยาม แล้วเดินกลับบ้านในเสื้อที่ขาดเปิดไหล่
        effects: { hp: -1, gold: -3, flags: [caught_slipping_the_watch] }
    - id: ask_finnick
      label: มองหาผมแดงปอยสุดท้ายที่ขั้นบันไดน้ำพุ
      requires: { cast: [old_hand], flag: finnick_went_to_glass_ward }
      text: |
        ฟินนิคนั่งอยู่บนขั้นบันไดน้ำพุ เหมือนรู้มาตั้งแต่เช้าว่าวันนี้ต้องมานั่งตรงนี้ แผ่นใสลามขึ้นไปถึงไหล่แล้ว ผมแดงเหลือแค่ปอยเดียวที่ท้ายทอย เขาไม่ลุก บอก{name}ให้เดินไปที่รางน้ำหน้าร้านขนม นับตะแกรงเหล็กไปตะแกรงที่สามจากมุม แล้วรอ

        {name}ไปยืนรอที่นั่นกับยาม รอจนยามเริ่มหงุดหงิด เด็กร้านขนมสาดน้ำล้างถาดลงราง น้ำพาของวาวชิ้นหนึ่งไหลมาติดตะแกรงที่สาม แหวนหลุดจากนิ้วช่างทองเองตอนเขาโบกมือต่อราคาปลา กลิ้งลงรางไปตั้งแต่บ่าย ฟินนิคไม่ได้ตามมาดู เขารู้อยู่แล้วว่าจะเป็นอย่างไร
      effects: { people: [{ id: finnick, closeness: 1 }], flags: [finnick_found_the_ring] }

- id: adult.path_rogue_green_letters
  stage: adult
  scene: noble_hall
  time: night
  weight: 30
  when:
    age: [41, 52]
    class: rogue
  text: |
    หญิงชราที่มาหา{name}ตอนค่ำแต่งตัวเรียบร้อยเกินกว่าจะมาตรอกนี้ นางบอกว่าขุนนางเฒ่าบ้านริมคลองตายเมื่อต้นเดือน พรุ่งนี้เช้าคนของธนาคารจะมานับของในบ้านเพื่อขายใช้หนี้ ในลิ้นชักโต๊ะเขียนหนังสือชั้นบนมีจดหมายมัดแถบผ้าเขียวอยู่มัดหนึ่ง นางเขียนถึงเขาเมื่อนานมาแล้ว นานจนลายมือในนั้นไม่เหมือนลายมือของนางตอนนี้ นางไม่อยากให้คนนับของอ่าน

    นางวางเหรียญห้าเหรียญบนโต๊ะ แล้วบอกอีกเรื่องหนึ่ง บ้านนั้นไม่มีคนเฝ้า มีแต่หุ่นรับใช้ตัวหนึ่ง ทำด้วยเหล็กกับไม้มะเกลือ เดินรอบบ้านตามคำสั่งสุดท้ายของนายมาตั้งแต่วันที่เขาตาย

    {name}เข้าทางหน้าต่างครัวได้ไม่ยาก ยากตรงขึ้นบันได เสียงเท้าเหล็กเดินอยู่ชั้นบน ช้า สม่ำเสมอ ไปแล้วกลับ
  encounter:
    foe: house_servitor
    name: หุ่นรับใช้ไม้มะเกลือ
    morale: 2
    beats:
      - text: หุ่นรับใช้เดินมาตามทางเดินชั้นบน ถือถาดเงินเปล่าระดับอก หยุดหน้าประตูทุกบาน หันหัวเข้าไปในห้อง แล้วเดินต่อ ห้องเขียนหนังสืออยู่สุดทาง
        moves:
          - id: servitor_count
            label: หมอบอยู่ที่หัวบันได นับว่ามันหยุดหน้าประตูแต่ละบานนานเท่าไร
            kind: read
            stat: INT
            success: หน้าประตูทุกบานหุ่นหยุดนับสิบเท่ากัน ยกเว้นห้องเขียนหนังสือ หน้าห้องนั้นหยุดนับสามสิบ แล้วโค้งให้ห้องเปล่าหนึ่งครั้ง คำสั่งสุดท้ายของนายคงเกี่ยวกับห้องนั้น ช่วงนับสามสิบคือช่วงที่หลังของหุ่นหันมาทางบันได
          - id: servitor_coin
            label: ดีดเหรียญทองแดงไปกลิ้งในห้องสุดทางเดินอีกฝั่ง
            kind: item
            stat: DEX
            tags: [noise]
            success: เหรียญกลิ้งไปหยุดใต้ตู้ในห้องฝั่งโน้น หุ่นรับใช้หยุดกลางทาง หันหัวไปทางเสียง แล้วเดินไปที่ห้องนั้น ก้มลงเก็บเหรียญขึ้นมาวางบนถาดเงิน ในบ้านนี้ของตกพื้นไม่ได้
          - id: servitor_slip
            label: รอให้มันหันหัวเข้าห้องข้างๆ แล้วก้าวผ่านหลังไป
            kind: quick
          - id: servitor_wall
            label: ยืนแนบผนังในเงามืด รอให้มันเดินผ่านไปเอง
            kind: guard
            failure: หุ่นรับใช้เดินมาถึงแล้วหยุด หันหัวมาทางเงาที่ไม่ควรมีอะไร วางถาดลงกับพื้น ยก{name}ขึ้นเหมือนยกหีบ เอาไปวางที่หัวบันไดแรงกว่าที่ควรวางหีบ แล้วเดินกลับไปหยิบถาด
          - id: servitor_out
            label: ถอยกลับลงไปทางหน้าต่างครัว
            kind: flee
      - text: ลิ้นชักโต๊ะเขียนหนังสือฝืด ดังเอี๊ยดตอนดึงออกมาได้ครึ่งหนึ่ง เสียงเท้าเหล็กในทางเดินหยุด แล้วเร็วขึ้น หุ่นรับใช้มาถึงประตูห้อง ยื่นแขนยาวเข้ามาจะยก{name}ออกไปให้พ้นโต๊ะของนาย
        answer: quick
        moves:
          - id: servitor_duck
            label: ปล่อยเสื้อนอกให้ติดมือมันไป แล้วมุดลงใต้โต๊ะ
            kind: quick
            success: แขนเหล็กยกเสื้อนอกขึ้นไปเปล่าๆ หุ่นรับใช้ถือเสื้อไว้ครู่หนึ่ง แล้วพับอย่างประณีตสามทบ เดินเอาไปวางบนเก้าอี้ข้างประตู {name}ได้เวลาเท่าพับเสื้อหนึ่งตัว
          - id: servitor_tidy
            label: ดันลิ้นชักกลับเข้าที่ จัดปากกาบนโต๊ะให้ตรง ทำให้ห้องกลับเป็นแบบที่นายของมันชอบ
            kind: read
            stat: WIS
            success: แขนของหุ่นรับใช้หยุดกลางอากาศ ห้องเรียบร้อยแล้ว ไม่มีอะไรต้องยกออก หัวหมุนไปมาสองรอบ หาของที่ผิดที่ แล้วแขนก็ลดลง คำสั่งของหุ่นคือดูแลห้อง ไม่ใช่ดูแลคน
          - id: servitor_bell
            label: กระตุกเชือกกระดิ่งเรียกคนรับใช้ที่ห้อยอยู่ข้างโต๊ะ
            kind: item
            stat: INT
            tags: [noise]
            success: กระดิ่งไปดังอยู่ที่ครัวชั้นล่าง ไกลและเบา หุ่นรับใช้หันหลังทันที เดินลงบันไดไปหาเสียงที่เรียกมันมาทั้งชีวิต ถึงครัวแล้วก็ยืนรอคำสั่งอยู่หน้ากระดิ่งที่ยังแกว่ง
          - id: servitor_shove
            label: เอาไหล่ดันมันออกไปทางประตู
            kind: attack
          - id: servitor_window
            label: ปีนออกทางหน้าต่างห้องเขียนหนังสือ ทิ้งจดหมายไว้
            kind: flee
      - text: จดหมายมัดแถบผ้าเขียวอยู่ในมือแล้ว หุ่นรับใช้กลับมายืนเต็มประตู ถือถาดเงินระดับอกเหมือนเดิม ไม่เข้ามา รออยู่อย่างนั้น เหมือนรอให้ใครสักคนสั่งว่าคืนนี้พอแล้ว
        answer: talk
        moves:
          - id: servitor_dismiss
            label: ยืดตัวตรง บอกด้วยเสียงแบบคนเป็นนายว่าคืนนี้พอแล้ว ไปพักได้
            kind: talk
            success: หุ่นรับใช้ก้มหัวลงช้าๆ ข้อต่อที่คอดังกรอดหนึ่งครั้ง แล้วหันหลังเดินกลับไปตามทางเดิน เสียงเท้าเหล็กห่างออกไปจนถึงห้องสุดทาง แล้วเงียบ เงียบเป็นครั้งแรกตั้งแต่ต้นเดือน
          - id: servitor_under
            label: รอจังหวะที่มันเอียงถาด แล้วลอดใต้แขนออกไป
            kind: quick
          - id: servitor_candles
            label: เป่าเทียนในห้องให้ดับทุกเล่ม ห้องที่มืดคือห้องที่นายเข้านอนแล้ว
            kind: read
            stat: WIS
          - id: servitor_canal
            label: ทิ้งทุกอย่าง ปีนหน้าต่างลงไปทางคลอง
            kind: flee
    win:
      text: |
        {name}ออกจากบ้านทางประตูหน้า เดินลงบันไดหินเหมือนแขกที่เพิ่งกินข้าวเย็นเสร็จ จดหมายมัดแถบผ้าเขียวอยู่ในอกเสื้อ ข้างหลังในบ้าน เสียงเท้าเหล็กเริ่มเดินรอบใหม่

        หญิงชรารับจดหมายไปโดยไม่แกะแถบผ้า นางจ่ายห้าเหรียญตามที่ตกลง แล้วโยนจดหมายลงเตาทั้งมัด ยืนรอจนแถบผ้าเขียวไหม้หมด {name}ไม่ได้ถามว่าในนั้นเขียนอะไร นางก็ไม่ได้เล่า
      effects: { stats: { DEX: 1 }, gold: 5, flags: [fetched_the_green_letters] }
    lose:
      text: |
        หุ่นรับใช้วาง{name}ลงบนบันไดหินหน้าบ้าน วางผ้าพันคอที่หล่นอยู่บนทางเดินไว้ข้างๆ พับเรียบร้อย แล้วปิดประตูลงกลอนจากข้างใน ทุกอย่างทำอย่างประณีต ยกเว้นตอนวางตัว{name}

        เช้ามาคนของธนาคารมาถึงพร้อมสมุดนับของ หญิงชราไม่ได้มาทวงเรื่องจดหมาย นางส่งคนมาบอกแค่ว่าไม่เป็นไร คนในเรื่องนั้นตายไปเกือบหมดแล้ว
      effects: { flags: [servitor_put_you_out] }
    stalemate:
      text: |
        นกเริ่มร้องข้างนอก ฟ้าสางแล้ว หุ่นรับใช้ยังยืนอยู่ที่ประตู {name}ปีนออกทางหน้าต่างห้องเขียนหนังสือ มือข้างหนึ่งเกาะขอบหน้าต่าง อีกข้างกอดมัดจดหมาย แถบผ้าเขียวหลุดตอนเท้าแตะกำแพงริมคลอง จดหมายครึ่งมัดปลิวลงน้ำ

        หญิงชรารับส่วนที่เหลือไปนับ แล้วจ่ายสามเหรียญ บอกว่าที่ลอยไปกับน้ำก็ไม่มีใครอ่านออกแล้ว หมึกสมัยนั้นละลายน้ำ
      effects: { gold: 3, flags: [fetched_half_the_letters] }
    flee:
      text: |
        {name}ออกจากบ้านริมคลองมือเปล่า หน้าต่างครัวยังเปิดค้างไว้อย่างตอนเข้ามา เช้ามาคนของธนาคารคงเห็น และคงคิดว่าเป็นแมว

        หญิงชราฟังจนจบ แล้วหยิบเหรียญห้าเหรียญกลับใส่ถุงทีละเหรียญ สามวันต่อมา{name}ได้ยินในโรงเตี๊ยมว่าคนนับของบ้านขุนนางเฒ่าเจอจดหมายรักมัดหนึ่ง เอามาอ่านกันจนทั่วโรงเตี๊ยม
      effects: { flags: [left_the_green_letters] }

- id: adult.path_rogue_young_boss
  stage: adult
  scene: tavern
  weight: 30
  when:
    age: [53, 64]
    class: rogue
  text: |
    หนูท่าส่งเด็กมาตาม{name}ไปที่ห้องหลังโรงเตี๊ยม ห้องเดิม โต๊ะเดิม คนที่นั่งหัวโต๊ะเปลี่ยนไปหลายคนแล้วตั้งแต่{name}ยัง{หนุ่ม|สาว} หัวหน้าคนใหม่อายุน้อยกว่า{name}เกือบครึ่งชีวิต ข้างหน้ามีถุงผ้าใบเล็กวางอยู่ใบหนึ่ง

    หัวหน้าพูดอย่างสุภาพ เหมือนซ้อมมาก่อน เดือนที่แล้วยามจับคนเก่าของหนูท่าได้สองคน ทั้งสองคนมือยังดี แต่เข่าไม่ดี วิ่งไม่ทัน และคนแก่ที่อยู่ในห้องขังนานๆ มักพูดมากกว่าคนหนุ่ม ในถุงมีเหรียญหกเหรียญ จะมีถุงแบบนี้ไปถึงบ้าน{name}ทุกต้นฤดู ตราบที่{name}ไม่ทำงานในย่านของหนูท่าอีก

    คนอื่นในห้องไม่มีใครเงยหน้า ทุกคนรู้ว่าถุงแบบนี้เคยวางอยู่หน้าใครมาก่อน และรู้ว่าคนพวกนั้นไปอยู่ที่ไหนกันหมด
  choices:
    - id: take_the_purse
      label: รับถุง ลุกออกจากโต๊ะ
      text: |
        {name}นับเหรียญในถุงต่อหน้าทุกคน นับช้าๆ จนครบหก แล้วผูกปากถุงคืน ตอนเดินออกจากห้อง เด็กที่ไปตาม{name}มาเปิดประตูให้ ก้มหัวให้แบบที่ก้มให้คนแก่ในตลาด

        ถุงผ้าใบมาถึงทุกต้นฤดูจริง ไม่ขาดสักครั้ง เด็กที่เอามาส่งเปลี่ยนหน้าทุกปี ทุกคนถามเรื่องเดียวกันที่ประตู ว่าเรื่องที่คนในท่าเล่ากันนั้น เรื่องไหนจริงบ้าง
      effects: { gold: 6, flags: [took_the_rats_purse] }
    - id: one_last_ring
      label: ขอทำงานชิ้นหนึ่งให้หัวหน้าดูก่อน ถ้ามือแก่คู่นี้พลาด ค่อยรับถุง
      habit: stubborn
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          หัวหน้าชี้ไปที่คนนั่งข้างประตู มือขวาของหัวหน้าเอง แหวนตราของหนูท่าอยู่ที่นิ้วก้อยของเขา {name}เดินออกไปสั่งเหล้าที่หน้าร้าน เดินกลับเข้ามาวางจอกตรงหน้าหัวหน้า แล้ววางแหวนตราลงข้างจอก คนข้างประตูยังนั่งประสานมือบนตักเหมือนเดิม

          หัวหน้าหยิบแหวนขึ้นมาส่งคืนคนข้างประตู แล้วเลื่อนถุงเหรียญกลับไปไว้ข้างตัว บอกว่าข้อตกลงยังเหมือนเดิม แค่เปลี่ยนจากคำว่าห้ามทำงาน เป็นห้ามโดนจับ
        effects: { stats: { DEX: 1 }, flags: [showed_the_young_boss] }
      failure:
        text: |
          นิ้วของ{name}แตะแหวนได้แล้ว แต่ข้อนิ้วที่บวมทุกเช้างอไม่ลงพอจะดึงออก คนข้างประตูจับข้อมือ{name}ไว้ ไม่ได้บีบแรง จับไว้เฉยๆ ให้ทุกคนในห้องเห็น

          หัวหน้าบอกว่าเสียใจจริงๆ แล้วเลื่อนถุงกลับไปไว้ข้างตัว บอกว่าข้อตกลงนี้มีไว้ให้คนที่เลือกเอง คนที่ต้องให้คนอื่นเลือกให้ไม่ได้ถุง ตั้งแต่เดือนนั้นคนในย่านท่าเรือทักทาย{name}เหมือนเดิมทุกอย่าง ไม่มีใครส่งงานมาอีก
        effects: { reputation: { dock_rats: -1 }, flags: [fumbled_the_last_ring] }
    - id: trade_purse_for_kids
      label: ไม่เอาเงิน ขอให้ส่งเด็กใหม่มาเรียนที่ห้อง{name}แทน คนที่รู้วิธีไม่โดนจับควรได้เป็นครู
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          หัวหน้าถามว่าจะสอนอะไร {name}บอกว่าไม่สอนล้วง คนที่ล้วงเก่งมีอยู่เต็มท่า คนที่ล้วงมายี่สิบปีแล้วยังเดินอยู่ข้างนอกมีไม่กี่คน {name}จะสอนส่วนนั้น หัวหน้าหันไปดูคนข้างประตู คนข้างประตูยักไหล่

          ตั้งแต่เดือนนั้นเด็กหนูท่ามานั่งบนพื้นห้อง{name}ทุกคืนที่ห้า คราวละสามสี่คน {name}สอนเรื่องเดียวซ้ำทุกคืน ว่าตลาดมีทางออกกี่ทาง และต้องรู้ให้ครบก่อนยื่นมือ เด็กคนหนึ่งจดใส่ฝ่ามือด้วยถ่าน ล้างไม่ออกไปสามวัน
        effects: { stats: { CHA: 1 }, reputation: { dock_rats: 1 }, flags: [teaching_the_rats_kids] }
      failure:
        text: |
          หัวหน้าบอกว่าเด็กหนูท่าเรียนจากถนน ไม่ได้เรียนจากห้อง แล้วลุกขึ้นก่อน ทิ้งถุงไว้บนโต๊ะ {name}ไม่หยิบ ตอนเดินออกจากห้อง ถุงยังวางอยู่ที่เดิม ไม่มีใครในห้องกล้าหยิบเหมือนกัน

          เดือนต่อมาเด็กของหนูท่าโดนจับที่ตลาดปลาสองคน คนหนึ่งในนั้นยืนอยู่ในห้องหลังโรงเตี๊ยมคืนนั้นด้วย
        effects: { reputation: { dock_rats: -1 }, flags: [rats_refused_your_school] }
    - id: the_boy_with_the_snacks
      label: จำหน้าหัวหน้าได้ เด็กที่ถือห่อขนมทอดยืนรออยู่หน้าศาลวันนั้น
      requires: { flag: took_the_rats_fall }
      text: |
        หน้าโตขึ้นจนเกือบจำไม่ได้เป็นครั้งที่สอง {name}ไม่ตอบเรื่องถุง ถามแทนว่าปลาเค็มชิ้นที่วางอยู่บนข้าวเย็นบางมื้อในห้องขังปีนั้น ใครเป็นคนใส่

        หัวหน้านิ่งไปนาน แล้วบอกว่าเขาเอง ทุกครั้งที่ขายของได้ เขาหยิบถุงผ้าใบกลับไป บอกคนในห้องให้ออกไปก่อน คืนนั้นทั้งสองนั่งกินขนมทอดห่อใบตองที่เขาสั่งเด็กไปซื้อจากปากตลาด ถุงผ้าใบยังมาถึงบ้าน{name}ทุกต้นฤดู ข้างในไม่มีเหรียญ มีขนมทอด ไม่มีเงื่อนไขผูกมากับปากถุง
      effects: { reputation: { dock_rats: 1 }, flags: [snack_boy_runs_the_docks] }
    - id: ask_about_the_first_year
      label: ถามหัวหน้าว่าทุกวันนี้หนี้ปีแรกของเด็กใหม่ยังเก็บกันอยู่ไหม
      requires: { flag: rats_debt_honored }
      text: |
        หัวหน้าบอกว่าไม่เก็บแล้ว เลิกไปตั้งแต่ปีที่หัวหน้าคนก่อนเดินเข้าศาลเอง เด็กที่เข้ามาทุกวันนี้ไม่รู้ด้วยซ้ำว่าเคยมี หัวหน้ารู้ เพราะเป็นเด็กคนที่เดินไปถาม{name}ที่ท่าเรือวันนั้นเองว่าหนี้ของเขาจ่ายเป็นเงินได้ไหม

        หัวหน้าเลื่อนถุงมาตรงหน้า{name} บอกว่าเงื่อนไขเมื่อครู่พูดให้คนในห้องฟัง ถุงนี้เป็นของ{name} จะทำงานต่อหรือไม่ก็ได้ ขอแค่อย่าโดนจับในย่านนี้ เพราะถ้า{name}โดนจับ คนที่ต้องเดินเข้าศาลไปรับแทนคือเขา หนูท่าทุกวันนี้ทำกันอย่างนั้น
      effects: { gold: 6, alignment: { law: 1 }, flags: [rats_boss_walks_to_court] }

- id: adult.path_rogue_last_lock
  stage: adult
  scene: home
  time: night
  weight: 30
  when:
    age: [53, 64]
    class: rogue
  text: |
    ตอนเช้านิ้วของ{name}งอไม่ลงจนกว่าจะแช่น้ำอุ่นครึ่งชาม ข้อนิ้วกลางบวมจนแหวนเก่าสวมไม่เข้า พอสายก็กลับมาใช้ได้ ใช้ได้ดีด้วย แต่ไม่เคยดีเท่าตอนเย็น

    บนชั้นเหนือเตียงมีกุญแจทองเหลืองลูกหนึ่งวางอยู่ตั้งแต่{name}ยัง{หนุ่ม|สาว} ซื้อมาจากเมียหม้ายของช่างทำกุญแจที่ตายไปโดยไม่ได้บอกใครว่าข้างในทำไว้อย่างไร ไม่มีลูกกุญแจ {name}ลองเปิดมาทุกฤดูหนาว ไม่เคยได้

    คืนหนึ่ง{name}ตื่นเพราะเสียงเหล็กขูดกลอนประตู ขูดผิดทาง ขูดดังเกิน เด็กหญิงคนหนึ่งอายุราวสิบสองนั่งยองๆ อยู่หน้าประตู ถือเข็มเย็บกระสอบงอเป็นตะขอสองอัน นางไม่วิ่ง นางบอกว่าชื่อเมรีส ได้ยินมาว่าบ้านนี้มีกลอนดีที่สุดในย่าน นางอยากรู้ว่าจริงไหม
  choices:
    - id: open_it_in_front_of_her
      label: หยิบกุญแจทองเหลืองลงมาวางตรงหน้านาง แล้วลองเปิดให้ดูอีกครั้ง
      habit: stubborn
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          {name}ใช้ตะขอเข็มกระสอบของเมรีสเอง ไม่ใช้เหล็กงัดของตัวเอง ลิ้นเหล็กข้างในมีสามชิ้น สองชิ้นแรกยกตามที่ควรยก ชิ้นที่สามช่างตะไบกลับด้านไว้ ต้องกดลงตอนที่มือทุกมือในเมืองอยากยกขึ้น {name}เพิ่งรู้สึกได้คืนนี้ ด้วยนิ้วที่ช้าลงจนมีเวลาฟังเหล็ก

          กุญแจเปิดดังแกร๊กเบาเหมือนกิ่งไม้แห้งหัก เมรีสไม่ได้ตาโต นางขอตะขอคืน แล้วถามว่าพรุ่งนี้มาได้ไหม {name}บอกว่ามาได้ ถ้าเคาะประตู
        effects: { stats: { DEX: 1 }, people: [{ id: meris, name: เมรีส, gender: f, bond: friend, closeness: 1, age: 12 }], flags: [opened_the_brass_lock] }
      failure:
        text: |
          ข้อนิ้วกลางเกร็งค้างตอนตะขอเข้าไปได้ครึ่งทาง {name}ดึงมือออกไม่ทัน ตะขอหักคาอยู่ข้างใน ปวดจนต้องเอามือแช่น้ำเย็นทั้งคืน

          เมรีสดูอยู่จนจบ แล้วบอกว่ากลอนประตูบ้านนี้ดีจริง แต่คนในบ้านไม่ดีเท่ากลอน นางเดินหายไปในความมืด ตะขออีกอันวางทิ้งไว้บนธรณีประตู
        effects: { hp: -1, flags: [brass_lock_still_shut] }
    - id: give_her_the_lock
      label: ยื่นกุญแจทองเหลืองให้นางเอาไปลอง เปิดได้เมื่อไรค่อยกลับมาเรียนอย่างอื่น
      text: |
        เมรีสรับกุญแจไปด้วยสองมือ ตรวจดูทุกด้านเหมือนพ่อค้าดูเหรียญปลอม แล้วใส่ไว้ในอกเสื้อ นางมาเคาะประตูทุกสามสี่วันเพื่อบอกว่ายังไม่ได้ บางครั้งมากับแผลถลอกที่นิ้ว บางครั้งมากับคำถาม {name}ตอบคำถาม ไม่ตอบเรื่องกุญแจ

        ฤดูหนาวถัดมานางมาเคาะประตูตอนเช้ามืด ยืนอยู่หน้าบ้านในลมหนาว กุญแจทองเหลืองอยู่ในมือ ห่วงเปิดค้าง นางไม่ได้บอกว่าเปิดได้อย่างไร นางถามว่าวันนี้จะสอนอะไร
      effects: { alignment: { moral: 1 }, people: [{ id: meris, name: เมรีส, gender: f, bond: friend, closeness: 2, age: 12 }], flags: [gave_meris_the_brass_lock] }
    - id: send_her_to_a_locksmith
      label: จ่ายสามเหรียญให้ช่างทำกุญแจหัวตลาดรับนางเป็นลูกมือ
      requires: { min_gold: 3 }
      text: |
        ช่างทำกุญแจหัวตลาดไม่อยากรับเด็กผู้หญิงที่มาจากตรอก จนกระทั่งเมรีสเปิดกลอนหน้าร้านเขาให้ดูต่อหน้า ด้วยเข็มเย็บกระสอบงอสองอัน ใช้เวลาไม่ถึงเท่าน้ำเดือด เขารับสามเหรียญจาก{name} แล้วบอกว่าจะสอนนางทำกลอนที่คนอย่างนางเปิดไม่ได้

        ตั้งแต่นั้นมากลอนใหม่ทุกตัวในย่านมีรอยตะไบเล็กๆ ที่ด้านใน รอยเดียวกันทุกตัว {name}ไม่เคยถามว่ารอยนั้นมีไว้ทำอะไร เมรีสก็ไม่เคยบอก
      effects: { gold: -3, alignment: { law: 1 }, people: [{ id: meris, name: เมรีส, gender: f, bond: friend, closeness: 1, age: 12 }], flags: [sent_meris_to_a_locksmith] }
    - id: two_hands_for_the_lock
      label: บอกนางว่ากุญแจลูกนี้ต้องเปิดสองคน แบบกลอนชั้นที่สามของลิ้นชักในวิหารเบเลค
      requires: { flag: lifted_belek_ledger }
      text: |
        คืนที่ต้องเอาสมุดลูกหนี้ออกจากลิ้นชักหัวหน้าเสมียนวิหารเบเลค กลอนชั้นที่สามมีเหล็กสองซี่ที่ต้องหมุนสวนกันพร้อมกัน {name}เพิ่งเห็นคืนนี้ว่ากุญแจทองเหลืองลูกนี้ก็มีสองซี่แบบนั้น แต่ช่างวางสองซี่ไว้ห่างกันเกินกว่ามือข้างเดียวจะเอื้อมถึง ช่างคนนั้นทำกุญแจที่ต้องเปิดสองคน และไม่เคยบอกใคร

        {name}ถือซี่ซ้ายด้วยนิ้วที่บวม เมรีสถือซี่ขวาด้วยตะขอเข็มกระสอบ {name}นับหนึ่ง สอง ทั้งสองหมุนพร้อมกัน ห่วงกุญแจเด้งขึ้นมาเอง หลังจากรอมาตั้งแต่{name}ยัง{หนุ่ม|สาว} เมรีสหัวเราะเสียงดังจนต้องเอามือปิดปาก แล้วขอให้คล้องกุญแจใหม่ จะได้เปิดอีกรอบ
      effects: { stats: { INT: 1 }, people: [{ id: meris, name: เมรีส, gender: f, bond: friend, closeness: 2, age: 12 }], flags: [opened_the_brass_lock_with_meris] }

# ---------- นักเวท ----------
- id: adult.path_wizard_wall_writing
  stage: adult
  scene: home
  weight: 30
  when:
    age: [41, 52]
    class: wizard
  text: |
    เช้าวันแรก{name}คิดว่ามีคนเข้ามาในห้อง ผนังข้างหัวเตียงมีตัวหนังสือเขียนด้วยถ่านจากเตา สามแถว ตัวเล็กเรียงชิดกัน เขียนกลับด้านแบบที่ต้องส่องกระจกจึงจะอ่านได้ กลอนประตูยังลงอยู่ หน้าต่างยังปิด นิ้วชี้กับนิ้วกลางมือขวาของ{name}ดำเพราะถ่าน

    เช้าวันที่สองมีห้าแถว เช้าวันที่สามมีเก้าแถว และปลอกหมอนมีเลือดกำเดาเป็นดวงเท่าฝ่ามือ ลายมือบนผนังเป็นลายมือของ{name}เอง หางตัวอักษรตวัดขึ้นแบบที่ครูเวทคนแรกเคยตีมือให้เลิกมาตั้งแต่เด็ก

    {name}ส่องกระจกอ่าน ออกเสียงได้ทุกตัว แต่ไม่รู้จักคำไหนเลยสักคำ
  choices:
    - id: sit_up_and_watch
      label: นั่งเฝ้าตัวเองทั้งคืน ไม่ยอมหลับ ดูว่ามือทำอะไรตอนไหน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          สามคืนแรกไม่มีอะไรเกิด มือวางอยู่บนตัก ผนังไม่มีตัวหนังสือเพิ่ม คืนที่สี่{name}นั่งพิงหัวเตียงจนตาปรือ แล้วเห็นมือขวาของตัวเองลุกขึ้นไปหยิบถ่านจากปากเตา ช้าๆ ไม่รีบ เหมือนมือของคนอื่นที่รู้ว่าต้องไปหยิบตรงไหน

          {name}จับข้อมือตัวเองไว้ด้วยมือซ้าย มือขวาไม่ดิ้น ปล่อยถ่านหล่นแล้วกลับมาวางบนตักเอง ตั้งแต่คืนนั้นผนังไม่มีตัวหนังสือเพิ่มอีก {name}เอาผ้าผูกข้อมือขวาไว้กับหัวเตียงทุกคืนไปจนจบฤดู
        effects: { stats: { CON: 1 }, flags: [caught_own_hand_writing] }
      failure:
        text: |
          คืนที่ห้า{name}หลับไปตอนไหนไม่รู้ ตื่นมาพบตัวเองยืนอยู่หน้าผนัง ถ่านอยู่ในมือ ตัวหนังสือแถวใหม่ยังเขียนไม่จบ หางของตัวสุดท้ายลากยาวลงไปจนถึงขอบพื้น เลือดกำเดาไหลลงมาถึงคาง

          {name}ไม่นั่งเฝ้าอีก ร่างกายรับไม่ไหวทั้งสองทาง ทั้งไม่นอนและนอน
        effects: { hp: -2, flags: [woke_at_the_wall] }
    - id: whitewash_it
      label: ทาปูนขาวทับผนัง ย้ายเตียงไปไว้อีกฝั่งห้อง
      text: |
        ปูนขาวสองชั้นกลบตัวหนังสือได้มิด {name}ย้ายเตียงไปชิดผนังฝั่งหน้าต่าง เก็บถ่านทั้งหมดใส่ไหปิดฝาไว้นอกห้อง สองสัปดาห์ต่อมาไม่มีอะไรเกิดขึ้น ปลอกหมอนกลับมาขาว

        ปลายฤดูฝนผนังชื้น ปูนขาวพองขึ้นเป็นแผ่น ใต้แผ่นที่ร่อนออกมีรอยถ่านสีจางอยู่สองสามตัว {name}ทาปูนทับอีกชั้นโดยไม่ส่องกระจกดู
      effects: { flags: [whitewashed_the_dream_wall] }
    - id: copy_and_work_it_out
      label: คัดตัวหนังสือบนผนังลงสมุด แล้วนั่งไล่หาว่าคืออะไร
      habit: curious
      check: { stat: INT, dc: 14 }
      success:
        text: |
          ไม่ใช่คำ เป็นเวลา {name}ไล่อยู่สามคืนกว่าจะเห็นว่าตัวหนังสือแต่ละกลุ่มคือชื่อยามของคืน แต่ละแถวจดว่ายามไหนอะไรเกิดขึ้นนอกหน้าต่าง หมาบ้านตรงข้ามเห่า เกวียนถ่านผ่าน ตะเกียงหัวถนนดับ จดด้วยตัวอักษรที่{name}ไม่เคยเรียน ด้วยลายมือที่{name}รู้จักดีที่สุด

          {name}ไปถามคนจุดตะเกียงหัวถนน เขาบอกว่าเมื่อคืนตะเกียงดับก่อนเวลาจริง ดับในยามที่บนผนังจดไว้ ยามนั้น{name}หลับอยู่ หันหน้าเข้าผนัง หลับตา
        effects: { stats: { INT: 1 }, flags: [read_the_dream_wall] }
      failure:
        text: |
          ตัวหนังสือบนผนังไม่ซ้ำกันสักแถว {name}คัดลงสมุดได้สามหน้า แล้วเริ่มเห็นตัวหนังสือแบบเดียวกันบนหน้าที่ยังไม่ได้เขียน หลับตาก็ยังเห็น เลือดกำเดาหยดลงบนหน้าที่สามหยดเดียว กลมพอดี

          {name}ปิดสมุด เอาไปใส่ไว้ในหีบใต้เตียง แล้ววางของหนักทับ คืนต่อมาผนังมีตัวหนังสือเพิ่มอีกสองแถว
        effects: { hp: -1, flags: [copied_the_dream_wall] }
    - id: back_to_the_market_doctor
      label: เอาสมุดที่คัดไว้ไปให้หมอที่ย่านตลาดดู หมอคนที่จดชื่อ{name}ไว้ใต้ชื่อคนงานโรงกลั่น
      requires: { flag: doctor_listed_stair_dream }
      text: |
        หมอแก่ลงมาก แต่ยังจำได้ เขาเปิดสมุดบันทึกคนไข้เล่มเดิม หน้าที่สี่ยังมีชื่อ{name}อยู่ใต้ชื่อคนงานโรงกลั่นสามคน เขาไม่ได้ดูตัวหนังสือที่{name}คัดมาเลย ถามแค่ว่าในฝันยังเดินลงอยู่ไหม {name}ตอบว่ายังลง

        หมอเขียนคำนั้นต่อท้ายบรรทัดเดิมที่เขียนไว้เมื่อหลายปีก่อน แล้วยื่นห่อรากไม้แห้งให้ห่อหนึ่ง ต้มดื่มก่อนนอน เขาบอกว่าไม่รู้ว่ามันรักษาอะไร รู้แต่ว่าคนที่ดื่มหลับลึกจนไม่ลุกจากเตียง ตั้งแต่คืนที่{name}เริ่มดื่ม ผนังไม่มีตัวหนังสือเพิ่ม แต่ในฝัน บันไดยังลงต่อไปเรื่อยๆ
      effects: { stats: { WIS: 1 }, flags: [stair_dream_still_down] }

- id: adult.path_wizard_reading_eye
  stage: adult
  scene: home
  time: night
  weight: 30
  when:
    age: [41, 52]
    class: wizard
    not_traits: [curse_brand]
  text: |
    ตารางคำนวณที่{name}รับมาทำต้องส่งพรุ่งนี้เช้า {name}นั่งเขียนตัวเลขอยู่ใต้ตะเกียงจนดึก ร่ายคาถาเล็กๆ ช่วยนับไปด้วย คาถานับเลขแทนหัวได้เร็วกว่าลูกคิด แต่ทุกครั้งที่ร่าย ขมับข้างซ้ายจะตุบหนึ่งที

    ตุบที่สิบสอง{name}เงยหน้าขึ้นจากกระดาษ เหนือโต๊ะมีลูกตาขนาดเท่ากำปั้นลอยอยู่ ห่างออกไปหนึ่งช่วงแขน ไม่มีเปลือกตา ตาขาวชื้น รูม่านตาไม่ได้จ้องหน้า{name} จ้องกระดาษ จ้องมือที่ถือปากกา

    {name}หยุดเขียน รูม่านตาเลื่อนไปหยุดที่ปลายปากกา แล้วรอ
  encounter:
    foe: float_eye
    name: ตาลอยที่อ่านกระดาษ
    beats:
      - text: ตาลอยเลื่อนเข้ามาใกล้โต๊ะอีกคืบ ตัวเลขบนกระดาษสะท้อนอยู่ในรูม่านตา เรียงเป็นแถว ทีละแถว ขมับของ{name}ตุบตามจังหวะที่มันอ่าน
        moves:
          - id: eye_pipe
            label: จุดกล้องยาเส้นที่ไม่ได้สูบมาหลายปี พ่นควันใส่มันช้าๆ
            kind: item
            stat: CON
            tags: [smoke]
            success: ควันยาเส้นลอยขึ้นเป็นม่านเทาบางๆ ระหว่างโต๊ะกับตาลอย ตาขาวเอ่อน้ำขึ้นมาทั้งลูก รูม่านตาหดเหลือเท่าปลายเข็ม แล้วลูกตาก็ถอยขึ้นไปลอยชิดขื่อ {name}ไอจนน้ำตาไหลเหมือนกัน แต่{name}ยังมีเปลือกตาไว้หลับ
          - id: eye_cover_page
            label: คว่ำกระดาษลง เอาสองมือกดไว้ คิดเลขต่อในหัว
            kind: guard
          - id: eye_false_figures
            label: เขียนตัวเลขผิดลงไปแถวหนึ่ง ดูว่ามันอ่านอะไรกันแน่
            kind: read
            stat: INT
            success: รูม่านตาสะดุดตรงแถวที่ผิด ขยายออกแล้วหดเข้าสองครั้ง เหมือนคนอ่านเจอคำสะกดผิด ตาลอยไม่ได้แค่ดูกระดาษ มันอ่าน และมันรู้ว่าแถวนั้นผิดพร้อมกับที่{name}รู้
          - id: eye_ask
            label: ถามมันว่าอยากรู้อะไร
            kind: talk
          - id: eye_leave
            label: ทิ้งกระดาษไว้บนโต๊ะ ออกไปนั่งในครัว
            kind: flee
      - text: ตาลอยลงมาจากขื่อ ตรงมาที่หน้าของ{name} ไม่สนกระดาษแล้ว ห่างจากดั้งจมูกแค่คืบเดียว เลือดกำเดาอุ่นๆ ไหลลงมาถึงริมฝีปาก รูม่านตาขยายรับ
        answer: guard
        moves:
          - id: eye_shut
            label: หลับตา เอามือปิดทับ ท่องสูตรคูณตั้งแต่แม่สองช้าๆ
            kind: guard
            success: แม่สอง แม่สาม แม่สี่ เสียงของตัวเองดังกว่าความคิดที่ไม่ใช่ของตัวเอง พอถึงแม่เจ็ด ความเย็นที่หน้าผากก็ถอยออกไป {name}ลืมตาขึ้นซีกเดียว ตาลอยกลับไปลอยอยู่เหนือโต๊ะ รูม่านตาเล็กลงครึ่งหนึ่ง
          - id: eye_burn_page
            label: จ่อกระดาษคำนวณเข้ากับเปลวตะเกียง ให้ควันกระดาษลอยขึ้นระหว่างกัน
            kind: item
            stat: WIS
            tags: [smoke]
          - id: eye_inkpot
            label: สาดหมึกทั้งขวดใส่มัน
            kind: quick
          - id: eye_leave2
            label: ก้มลงใต้โต๊ะ คลานออกทางประตู
            kind: flee
      - text: ตาลอยหันไปทางชั้นหนังสือ ไปหยุดหน้าสมุดของ{name}ที่เรียงอยู่ยี่สิบกว่าเล่ม สันสมุดทุกเล่มเขียนด้วยลายมือเดียวกัน มันลอยไล่ไปทีละเล่ม ช้าๆ เหมือนคนเลือกหนังสือในร้าน
        answer: item
        moves:
          - id: eye_censer
            label: เทเศษเทียนกับผงกำยานลงจานรอง จุดไว้ใต้ชั้นหนังสือ แล้วปิดหน้าต่าง
            kind: item
            stat: INT
            tags: [smoke]
          - id: eye_look_away
            label: หันหลังให้ชั้นหนังสือ ตั้งใจนึกถึงอะไรก็ได้ที่ไม่ได้อยู่ในสมุด
            kind: read
            stat: WIS
            success: "{name}นึกถึงกลิ่นข้าวต้มตอนเช้า เสียงไก่ขันบ้านข้างๆ ไม้กวาดทางมะพร้าวกวาดลาน ข้างหลังเงียบไปครู่หนึ่ง แล้วมีเสียงสันสมุดเล่มหนึ่งเอียงไปพิงอีกเล่ม ตาลอยหันกลับมาทาง{name} เหมือนคนอ่านที่โดนแย่งหนังสือไปกลางหน้า"
          - id: eye_slap
            label: ฟาดมันด้วยสมุดเล่มที่หนาที่สุด
            kind: attack
          - id: eye_leave3
            label: หอบสมุดเท่าที่ถือไหว ออกไปขอนอนบ้านข้างๆ
            kind: flee
    win:
      text: |
        ตาลอยถอยขึ้นไปชิดขื่อ แล้วไหลออกทางช่องลมเหนือประตู ลอยสูงขึ้นไปทางดาวดวงใหม่ทางทิศเหนือ เล็กลงจนแยกไม่ออกจากดาวดวงอื่น ควันในห้องยังไม่ทันจาง

        {name}เปิดหน้าต่างไล่ควันจนสาง แล้วนั่งคำนวณใหม่ตั้งแต่ต้น เสร็จทันส่งตอนสาย คืนต่อมา{name}เลิกร่ายคาถานับเลข กลับไปใช้ลูกคิด ขมับข้างซ้ายเงียบไปทั้งเดือน
      effects: { stats: { WIS: 1 }, flags: [smoked_out_the_reading_eye] }
    lose:
      text: |
        {name}ตื่นขึ้นมาตอนสาย ฟุบอยู่กับโต๊ะ แก้มแนบกระดาษ เลือดกำเดาแห้งติดกระดาษเป็นแผ่น ตัวเลขทั้งหน้าเรียงครบถูกต้องทุกแถว เขียนด้วยลายมือของ{name}เอง {name}จำไม่ได้ว่าเขียนแถวไหนบ้าง

        ตาลอยไม่อยู่แล้ว สมุดบนชั้นเรียงอยู่ครบทุกเล่ม แต่สลับลำดับ เล่มเก่าที่สุดย้ายไปอยู่หน้าสุด
      effects: { flags: [reading_eye_read_your_books] }
    stalemate:
      text: |
        ไก่บ้านข้างๆ ขันครั้งแรก ฟ้าเริ่มสาง ตาลอยจางลงทีละน้อยเหมือนหยดหมึกในน้ำ จนเหลือแค่รอยชื้นกลมๆ บนผิวโต๊ะ ตรงที่มันลอยอยู่ข้างบน

        {name}ส่งงานไม่ทัน ตัวเลขครึ่งหลังยังว่าง คนจ้างหักค่าจ้างไปครึ่งหนึ่ง
      effects: { gold: -2 }
    flee:
      text: |
        {name}นั่งในครัวจนสาง ห่มผ้าคลุมหัว ไม่ได้หลับ พอแดดขึ้นค่อยกลับเข้าห้อง ตาลอยไม่อยู่แล้ว

        กระดาษคำนวณบนโต๊ะมีรอยชื้นกลมๆ ทุกแถว เหมือนมีใครเอาแว่นขยายวางไล่อ่านทีละบรรทัด หมึกตรงนั้นซีดจนต้องเขียนทับใหม่ทั้งหน้า
      effects: { flags: [fled_the_reading_eye] }

- id: adult.path_wizard_bakers_boy
  stage: adult
  scene: home
  weight: 30
  when:
    age: [53, 64]
    class: wizard
  text: |
    แม่ของเด็กชายลากลูกมาถึงหน้าบ้าน{name}ตั้งแต่เช้ามืด มือหนึ่งจับข้อมือลูก อีกมือถือผ้าเช็ดหน้าที่เปื้อนเลือดจนแข็ง เด็กชื่อซีลาส อายุสิบสี่ ลูกคนทำขนมปังหัวถนน แม่บอกว่าสามเดือนมานี้ไม่มีใครต้องนวดแป้งในร้าน แป้งนวดตัวเองตอนที่ซีลาสยืนดูอยู่ข้างราง เตาติดไฟเองตอนที่เขาเป่าลมใส่มือ และเลือดกำเดาของเขาไหลทุกเช้า

    ซีลาสยืนก้มหน้า แต่ปากยังยิ้มอยู่ครึ่งหนึ่ง ยิ้มแบบเด็กที่รู้ว่าตัวเองทำอะไรได้ที่คนอื่นทำไม่ได้ {name}ให้เขาเงยหน้า ดูที่ตาขาว เส้นเลือดเล็กๆ แตกเป็นจุดแดงอยู่ที่หางตาทั้งสองข้าง

    {name}รู้จักจุดแดงแบบนี้ {name}มีมาตั้งแต่ยัง{หนุ่ม|สาว} และรู้ว่าคนที่เริ่มมีตั้งแต่อายุเท่าซีลาส จะไปถึงตรงไหนเมื่อแก่เท่า{name}
  choices:
    - id: teach_him_to_stop
      label: รับเขาไว้สอน บทเรียนแรกคือหยุดก่อนเลือดจะมา
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          เดือนแรก{name}ไม่สอนคาถาสักบท สอนให้จับชีพจรตัวเองที่ข้อมือ สอนให้รู้ว่าขมับตุบกี่ทีก่อนเลือดมา สอนให้วางมือลงตอนที่ยังอยากร่ายต่อ ซีลาสเกลียดเดือนนั้น เขาบอกว่ามาเรียนเวท ไม่ได้มาเรียนนั่งเฉยๆ

          เดือนที่สามเขานวดแป้งได้ทั้งราง แล้ววางมือลงก่อนแป้งจะเนียน ปล่อยให้พ่อนวดต่อเอง ผ้าเช็ดหน้าในกระเป๋าของเขาขาวทั้งสัปดาห์ เขาเอามาให้{name}ดูเหมือนเอาของรางวัลมาอวด
        effects: { stats: { WIS: 1 }, people: [{ id: silas, name: ซีลาส, gender: m, bond: friend, closeness: 2, age: 14 }], flags: [taught_silas_to_stop] }
      failure:
        text: |
          ซีลาสฟังทุกคำ แล้วทำตรงข้ามทุกคำตอนที่{name}ไม่อยู่ เขาฝึกเองหลังร้านตอนกลางคืน คาถาเดียวกับที่{name}สั่งห้าม ปลายเดือนแม่ของเขามาเคาะประตูอีก เขาล้มลงข้างเตาขนมปัง ปลุกไม่ตื่นจนเที่ยง

          {name}จ่ายค่าหมอสองเหรียญ เพราะเป็นคนรับเขามาสอน ซีลาสตื่นขึ้นมาก็ยังยิ้มครึ่งหนึ่งเหมือนเดิม
        effects: { gold: -2, people: [{ id: silas, name: ซีลาส, gender: m, bond: friend, closeness: 1, age: 14 }], flags: [silas_trained_in_secret] }
    - id: tell_him_to_bake
      label: บอกแม่ของเขาว่าอย่าให้เขาใช้มันอีก ให้เขาเป็นคนทำขนมปังเหมือนพ่อ
      text: |
        {name}บอกซีลาสตรงๆ ว่าเลือดที่ไหลตอนนี้จะกลายเป็นอะไรเมื่อเขาอายุสามสิบ เรื่องตาที่พร่า เรื่องปลอกหมอน เรื่องมือที่สั่นตอนเช้า ทุกเรื่องที่ไม่เคยมีใครนั่งลงบอก{name} ซีลาสฟังจนจบ ยิ้มครึ่งหนึ่งที่ปากหายไป แม่ของเขาร้องไห้

        ร้านขนมปังหัวถนนกลับมานวดแป้งด้วยมือ ทุกเช้าที่{name}เดินผ่าน ซีลาสยืนนวดอยู่ข้างราง แขนเปื้อนแป้งถึงศอก บางเช้าแป้งในรางกระเพื่อมขึ้นเองนิดหนึ่งตอนที่เขาเผลอ แล้วเขาก็ตบมันลงไป
      effects: { alignment: { law: 1 }, flags: [told_silas_to_bake] }
    - id: make_him_a_rod
      label: ทำไม้เท้าสั้นฝังหลอดน้ำค้างดาวให้เขา ให้เวทผ่านหลอดแก้วแทนผ่านเส้นเลือด
      habit: craft_hands
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}ใช้เวลาสิบวันทำไม้เท้ายาวเท่าแขนเด็ก ปลายฝังหลอดแก้วเล็กๆ ใส่น้ำค้างดาวครึ่งข้อนิ้ว เวทที่ผ่านไม้เท้าช้ากว่าผ่านมือ และต้องเติมน้ำค้างทุกสามวัน แต่ไม่ต้องผ่านหลังตาของใคร วันที่สองซีลาสนวดแป้งด้วยไม้เท้าได้แล้ว

          เขาบ่นว่าช้า บ่นทุกวัน แต่ผ้าเช็ดหน้าที่แม่ใส่กระเป๋าให้ทุกเช้ากลับมาขาวทุกเย็น
        effects: { stats: { INT: 1 }, people: [{ id: silas, name: ซีลาส, gender: m, bond: friend, closeness: 2, age: 14 }], flags: [made_silas_a_rod] }
      failure:
        text: |
          หลอดแก้วแตกในวันที่สามที่ซีลาสใช้ น้ำค้างดาวเย็นจัดกระเซ็นใส่หลังมือเขา ทิ้งรอยไหม้รูปหยดน้ำไว้ {name}จ่ายค่ายาให้แม่ของเขาสามเหรียญ

          ซีลาสไม่ยอมจับไม้เท้าอีก เขากลับไปใช้มือเหมือนเดิม เลือดกำเดากลับมาเหมือนเดิม
        effects: { gold: -3, people: [{ id: silas, name: ซีลาส, gender: m, bond: friend, closeness: 1, age: 14 }], flags: [silas_rod_broke] }
    - id: send_him_to_your_old_pupil
      label: พาซีลาสไปหาลูกสาวช่างตีเหล็กที่{name}เคยสอนเมื่อหลายปีก่อน
      requires: { flag: took_wizard_apprentice }
      text: |
        ลูกสาวช่างตีเหล็กโตเป็นผู้ใหญ่แล้ว รับจ้างร่ายเวทยกของให้โรงต่อเรือริมน้ำมาหลายปี นางฟังเรื่องของซีลาสจนจบ แล้วหยิบผ้าเช็ดหน้าเปื้อนเลือดจากมือแม่ของเขามาดู พลิกไปพลิกมาเหมือนอ่านจดหมาย

        นางรับเขาไว้ บทเรียนแรกของนางคือเรื่องเลือดกำเดา สอนตั้งแต่วันแรก ด้วยคำที่{name}เคยใช้สอนนางเกือบทุกคำ {name}ยืนฟังอยู่ที่ประตูโรงต่อเรือ ได้ยินคำของตัวเองออกมาจากปากคนอื่น ฟังแล้วถูกต้องกว่าตอนที่{name}พูดเอง
      effects: { alignment: { moral: 1 }, people: [{ id: silas, name: ซีลาส, gender: m, bond: friend, closeness: 1, age: 14 }], flags: [sent_silas_to_your_old_pupil] }
    - id: finish_severins_lamp
      label: ยกตะเกียงที่เซเวรินทำค้างไว้ลงจากชั้น ให้ซีลาสใช้ตาหนุ่มของเขาช่วย
      requires: { flag: has_severins_lamp }
      text: |
        ตะเกียงต้นนั้นอยู่บนชั้นมาตั้งแต่คนรับใช้ของเซเวรินเอามาส่ง พร้อมกระดาษแผ่นเดียว ไฟที่สั่นแบบนี้แปลว่าลมเข้าทางฐาน ทุกวันนี้ตาของ{name}มองเกลียวในไส้ตะเกียงได้ไม่ชัดพอ ซีลาสมองเห็นทุกเส้น {name}บอกทีละขั้น ซีลาสทำตามบ้าง ไม่ทำตามบ้าง ทั้งสองเถียงกันทุกคืนจนแม่ของเขาต้องมาตามกลับบ้าน

        คืนที่ยี่สิบไฟติด {name}ยื่นมืออังเหนือเปลว ถามซีลาสว่ามันสีอะไร ซีลาสบอกว่าฟ้า เหมือนตะเกียงทุกต้น {name}ถามว่าสั่นไหม เขาบอกว่าไม่สั่น นิ่งเหมือนน้ำในชาม ขวดน้ำค้างที่เติมไว้ตอนหัวค่ำลดลงแค่หนึ่งในสี่ตอนรุ่งสาง
      effects: { stats: { INT: 1 }, people: [{ id: silas, name: ซีลาส, gender: m, bond: friend, closeness: 2, age: 14 }], flags: [finished_severins_lamp] }

- id: adult.path_wizard_own_notebooks
  stage: adult
  scene: home
  weight: 30
  when:
    age: [53, 64]
    class: wizard
  text: |
    สมุดของ{name}เรียงอยู่บนชั้นสามชั้น สามสิบเจ็ดเล่ม ปกหนังบ้าง ปกผ้าบ้าง เล่มแรกๆ ลายมือเล็กเรียบร้อย เล่มหลังๆ ตัวหนังสือใหญ่ขึ้นทุกปี เพราะตาเห็นตัวเล็กไม่ชัดแล้ว ทุกเล่มมีรอยสีน้ำตาลจางๆ ตามขอบกระดาษ ตรงที่เลือดกำเดาเคยหยด

    ฤดูนี้สถาบันเวทหลวงส่งคนเดินซื้อสมุดของนักเวทที่ยังมีชีวิตอยู่ ซื้อตอนที่เจ้าของยังอธิบายได้ว่าตัวเองเขียนอะไรลงไป คนของสถาบันมาถึงตอนบ่าย สวมถุงมือผ้าขาวก่อนหยิบเล่มแรก เปิดไปสามหน้าแล้วถามว่าในนี้มีอะไรที่ไม่ควรอยู่ในห้องสมุดไหม

    {name}ไม่ได้ตอบทันที ในสามสิบเจ็ดเล่มนั้นมีหลายเล่มที่{name}เขียนจบแล้วไม่เคยเปิดอ่านอีกเลย
  choices:
    - id: sell_them_all
      label: ขายให้สถาบันทั้งสามสิบเจ็ดเล่ม แล้วตอบคำถามของเขาทุกข้อ
      text: |
        คนของสถาบันมาทุกบ่ายตลอดหนึ่งเดือน ถามทีละหน้า {name}ตอบเท่าที่จำได้ หน้าไหนจำไม่ได้ก็บอกว่าจำไม่ได้ เขาจดคำว่าจำไม่ได้ลงไปด้วย ลายมือของเขาเล็กและตรง เหมือนลายมือของ{name}ในเล่มแรก

        วันสุดท้ายเขาขนสมุดใส่หีบไม้สองใบ จ่ายแปดเหรียญ ชั้นหนังสือว่างทั้งสามชั้น {name}เอาหม้อกับไหไปวางแทน ชั้นบนสุดยังมีรอยฝุ่นเป็นแถวยาวตรงที่สันสมุดเคยตั้ง
      effects: { gold: 8, reputation: { royal_institute: 1 }, flags: [sold_own_notebooks] }
    - id: burn_what_should_not_be_kept
      label: เปิดอ่านทีละเล่มก่อนขาย เล่มไหนไม่ควรอยู่ในมือใครก็เผาเสีย
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ใช้เวลาครึ่งฤดูอ่านทุกเล่มตั้งแต่หน้าแรก เล่มที่จดวิธีทำ เก็บไว้ เล่มที่จดว่าวิธีนั้นต้องจ่ายด้วยอะไร เก็บไว้ เล่มที่จดสิ่งที่{name}รู้โดยจำไม่ได้ว่ารู้มาจากไหน เผา มีเจ็ดเล่ม ไหม้ช้ากว่าที่สมุดควรจะไหม้

          คนของสถาบันกลับมารับยี่สิบกว่าเล่มที่เหลือ จ่ายห้าเหรียญ เขานับช่องว่างบนชั้นหนังสือได้เจ็ดช่อง แต่ไม่ได้ถาม
        effects: { stats: { WIS: 1 }, gold: 5, flags: [burned_seven_notebooks] }
      failure:
        text: |
          {name}อ่านไปได้สี่เล่มก็เริ่มฝันถึงหน้าที่อยู่ในเล่มที่ห้า ก่อนจะได้เปิดเล่มนั้นด้วยซ้ำ เลือดกำเดาไหลทุกคืน ปลอกหมอนเปื้อนจนต้องทิ้ง

          {name}ยอมแพ้ ขายทั้งหมดให้สถาบันอย่างที่เป็น ไม่ได้บอกว่าเล่มไหนเป็นเล่มไหน คนของสถาบันเห็นรอยเลือดใหม่บนกระดาษ แล้วลดราคาเหลือสี่เหรียญ
        effects: { hp: -2, gold: 4, flags: [sold_own_notebooks] }
    - id: write_the_cost_book
      label: ยังไม่ขาย เขียนเล่มสุดท้ายก่อน เล่มบางๆ ที่จดแค่ว่าเวทแต่ละบทกินอะไรไปจากร่างกาย
      check: { stat: INT, dc: 14 }
      success:
        text: |
          เล่มที่สามสิบแปดบางกว่าทุกเล่ม ยี่สิบสองหน้า หน้าละหนึ่งบท ชื่อคาถาอยู่บนสุด ข้างใต้ไม่มีวิธีร่าย มีแต่สิ่งที่ต้องจ่าย เลือดกำเดากี่หยด ขมับตุบกี่ที ตาข้างไหนพร่าก่อน กี่ปีจึงเห็น {name}เขียนตัวใหญ่ คนตาไม่ดีจะได้อ่านออก

          คนของสถาบันซื้อสามสิบเจ็ดเล่มแรกในราคาที่ตกลง แล้วขอซื้อเล่มที่สามสิบแปดเพิ่มอีกสามเหรียญ {name}ไม่ขาย {name}คัดเป็นสามชุด ส่งไปให้นักเวทหนุ่มสาวสามคนในเมือง คนที่{name}เคยเห็นเลือดกำเดาไหลตอนร่ายต่อหน้าคนอื่นแล้วไม่ยอมเช็ด
        effects: { stats: { INT: 1 }, gold: 8, flags: [wrote_the_cost_book] }
      failure:
        text: |
          {name}เขียนได้เก้าหน้า หน้าที่สิบเป็นคาถายกคาน จะจดว่ากินอะไรไปต้องร่ายดูอีกครั้ง {name}ร่าย แล้วจดไม่ทัน เลือดหยดลงกลางหน้ากระดาษจนหมึกแผ่ออกเป็นวง

          คนของสถาบันรอไม่ไหว เขาไปซื้อสมุดของนักเวทบ้านถัดไปแทน สมุดเล่มที่สามสิบแปดค้างอยู่ที่หน้าสิบ วางอยู่บนโต๊ะข้างเตียง
        effects: { hp: -2, flags: [cost_book_unfinished] }
    - id: keep_the_blind_notes
      label: ไม่ยอมให้สมุดตัวเลขของนักดาราศาสตร์ตาบอดออกจากบ้านไปพร้อมกัน
      requires: { flag: read_blind_notes }
      text: |
        สามเล่มนั้นอยู่ชั้นล่างสุดมาตั้งแต่{name}ยัง{หนุ่ม|สาว} ทุกปี{name}ออกไปนับดาวทางทิศเหนือแล้วเทียบกับตาราง ตัวเลขตรงกับตารางของปีถัดไปทุกปี ไม่เคยพลาดสักปี {name}จดผลต่อท้ายสมุดเล่มที่สามของเขาด้วยลายมือของตัวเอง แถวละปี

        คนของสถาบันเห็นสามเล่มนั้นแล้วเสนอราคาเท่าสมุดของ{name}ทั้งชั้น {name}ขายแต่สมุดของตัวเอง ได้แปดเหรียญ ก่อนเขากลับ เขาถามว่าวงกลมหมึกหนาท้ายเล่มที่สามหมายถึงอะไร {name}บอกว่าไม่รู้ และถ้าเขารู้เมื่อไรให้กลับมาบอกด้วย เขาไม่ได้กลับมา
      effects: { gold: 8, flags: [kept_the_blind_notes] }
    - id: burn_nothing_this_time
      label: นึกถึงขี้เถ้ากระดาษที่ยังมีรอยตัวเลขสีขาว คราวนี้ไม่เผาอะไรเลย
      requires: { flag: burned_blind_notes }
      text: |
        คืนที่{name}เผาสมุดของนักดาราศาสตร์ตาบอด ตัวเลขบนหน้าที่เปิดค้างยังอ่านได้จนนาทีสุดท้าย แล้วดาวดวงใหม่ก็ยังขึ้นทุกปีเหมือนเดิม ไฟไม่ได้หยุดอะไร ไฟแค่ทำให้ไม่มีใครรู้ว่าเคยมีคนนับ

        {name}ขายสมุดให้สถาบันครบทุกเล่ม แล้วบอกคนของสถาบันให้จดไว้ที่ปกในของแต่ละเล่มด้วยว่าเล่มไหนอ่านแล้วจะฝัน คนที่เปิดต่อจะได้รู้ก่อนเปิด เขาจดตามทุกคำ ลงในช่องที่ห้องสมุดเว้นไว้สำหรับคำเตือน ช่องนั้นมีมาก่อนแล้วในทุกเล่มที่สถาบันซื้อ
      effects: { gold: 8, alignment: { law: 1 }, flags: [sold_notebooks_with_warnings] }

