# ชุด 3 วัยกลางคน อายุ 41 ถึง 64: งานสายนักรบและนักย่อง งานละ 3 ขั้น
# ขั้นกลาง (41–48) คนที่ทุกคนไปตามเมื่อเรื่องพัง ปัญหาที่คนเก่าเท่านั้นอ่านออก และครั้งแรกที่ร่างกายหรือยุคสมัยบอกว่าไม่
# ขั้นสูง (49–56) รับผิดชอบงานและความผิดของคนอื่น ทางไหนก็มีราคา
# วันวางมือ (57–64) ทุกตัวเลือกตั้ง retired หรือ still_working อย่างใดอย่างหนึ่ง กับ flag เฉพาะของทางนั้น
# ข้อความหลักไม่ถือว่าเรื่องช่วง 19–40 เกิดแล้ว เรื่องย้อนอยู่ในตัวเลือกที่ต้องมี flag
# ผู้เฝ้าผนึกที่ออกจากป้อม clear_flags job_wardens และตั้ง left_the_fort กับ retired (ระบบพาออกจากภาคีเอง)
# ตายได้สองจุด: ทหารเรือปีนเปิดลิ้นถุงลม (DEX 11) กับผู้เฝ้าออกตามเด็กหนีเวรในทุ่งเถ้า (CON 11) label บอกชัด

# ---------- ราชนาวี ----------
- id: adult.career_navy_lift
  stage: adult
  scene: ship_deck
  weight: 45
  when:
    age: [41, 48]
    flags: [job_navy]
  text: |
    ต้นปีนี้ราชนาวีเปลี่ยนน้ำค้างในถุงลมของเรือหลวงทุกลำ ของใหม่ราคาไม่ถึงครึ่งของเก่า เพราะโรงกลั่นริมแม่น้ำกลั่นได้มากขึ้นทุกเดือน สีก็ต่างไป ฟ้าจัดกว่า เย็นกว่า เชือกผูกปากถุงแข็งเป็นไม้ทุกเช้า

    คืนนี้เรือลอยลาดตระเวนเหนือทะเลใต้ เมฆชั้นล่างปิดน้ำไว้ทั้งผืน ฟ้าข้างบนเปิดโล่ง {name}ตื่นจากเปลนอนตอนตีสองเพราะหูอื้อ หูอื้อแบบนี้มีเหตุเดียว เรือกำลังขึ้น ไม่มีใครสั่ง ใบพัดถ่านมารยังหมุนรอบเท่าเดิม แต่หัวเรือเชิดหาดาวดวงใหม่ทางตะวันออกเหมือนดอกทานตะวันหันหาแดด เชือกยึดถุงลมมีน้ำแข็งจับเป็นเกล็ด

    ร้อยโทเวรเพิ่งขึ้นเรือมาได้สองเดือน ยืนเกาะราวท้ายเรือ ถามนายท้ายว่าทำไมหายใจไม่เต็มปอด ลิ้นระบายถุงลมอยู่บนหลังถุงใบกลาง สูงจากดาดฟ้าสามช่วงตัวคน ทางขึ้นมีแต่ตาข่ายเชือก เข่าซ้ายของ{name}บอกก่อนหัวว่าคืนนี้ตาข่ายนั้นสูงกว่าสมัยเป็นพลทหาร
  choices:
    - id: climb_to_valve
      label: ปีนตาข่ายขึ้นไปเปิดลิ้นถุงลมเอง (เสี่ยงถึงชีวิต)
      check: { stat: DEX, dc: 11 }
      success:
        text: |
          {name}ปีนทีละช่อง นับช่องออกเสียงแบบที่จ่าคนแรกสอน มือซ้ายจับ เท้าขวาหา มือขวาจับ เข่าซ้ายลากตามมาทีหลัง ลิ้นถุงลมเป็นแผ่นทองเหลืองเท่าฝาหม้อ น้ำแข็งปิดขอบไว้หนา {name}เอาด้ามมีดเคาะจนน้ำแข็งร่อน แล้วหมุนครึ่งรอบ

          ไอสีฟ้าพ่นออกมาเป็นสาย ไม่ตกลง ลอยขึ้นตรงไปทางดาวดวงนั้นจนจางหายไปเหนือเสากระโดง เรือทรุดลงช้าๆ จนท้องเรือแตะเมฆ ตอนสาง ร้อยโทหนุ่มเขียนลงสมุดเรือว่าคืนนั้นใครขึ้นไป ลายมือของเขาเอียงจนอ่านยาก แต่สะกดชื่อถูกทุกตัว
        effects: { stats: { DEX: 1 }, reputation: { crown: 1 }, flags: [vented_the_lift_bag] }
      failure:
        text: |
          ลิ้นทองเหลืองหมุนได้ครึ่งรอบ ไอฟ้าพ่นออกมาตามที่ควร แล้วเข่าซ้ายก็ไม่รับน้ำหนักอีก ตาข่ายเชือกที่น้ำแข็งเกาะไม่ให้นิ้วจับ {name}ร่วงผ่านขอบถุงลม ผ่านราวกราบ ลงไปในเมฆที่ปิดทะเลอยู่ข้างล่าง

          เรือลดระดับลงทันสางตามที่ควร ลูกเรือนับหัวกันบนดาดฟ้าได้ขาดหนึ่งคน ที่ลิ้นถุงลมยังมีเชือกเส้นหนึ่งผูกค้างไว้ เป็นปมแบบที่คนเรือรุ่นเก่าผูกกัน ไม่มีใครในเรือแก้ปมนั้นออก
        effects: { die: sacrifice }
    - id: talk_the_boy_up
      label: ส่งพลทหารที่ตัวเบาที่สุดขึ้นไป แล้วตะโกนบอกทางทีละช่อง
      check: { stat: INT, dc: 13 }
      success:
        text: |
          เด็กที่ตัวเบาที่สุดในเรือเป็นลูกคนเลี้ยงเป็ดจากริมทุ่ง ยังไม่เคยปีนตาข่ายตอนกลางคืน {name}ยืนโคนตาข่าย บอกทีละช่องว่าช่องไหนเชือกเปื่อย ช่องไหนต้องเหยียบตรงปม ลิ้นต้องหมุนทางไหน และต้องหันหน้าหนีตอนไอพ่นออกมา

          เด็กลงมาพร้อมนิ้วสีม่วงทั้งสิบนิ้ว {name}ถอดเสื้อนอกห่อมือเขาไว้จนนิ้วกลับเป็นสีคน เช้าวันนั้นเขาเล่าให้ทั้งห้องครัวฟังว่าข้างบนเย็นแค่ไหน เล่าซ้ำอีกครั้งตอนกินข้าวเที่ยง
        effects: { stats: { INT: 1 }, flags: [talked_a_boy_up_the_bag] }
      failure:
        text: |
          เด็กปีนได้ครึ่งทางแล้วแข็งค้างอยู่ตรงนั้น ไม่ขึ้น ไม่ลง ลมหายใจออกมาเป็นไอขาว {name}ต้องปีนตามไปครึ่งทางเพื่อแกะมือเขาออกจากเชือกทีละนิ้ว แล้วพาลงมาทั้งคู่

          เรือขึ้นต่อจนฟ้าสาง ดาวดวงนั้นลับฟ้าเมื่อไร เรือก็ค่อยๆ ลงเองเมื่อนั้น ลูกเรือเป็นลมไปสี่คน ปลายนิ้วของ{name}ชาไปทั้งเดือน
        effects: { hp: -2, flags: [rode_out_the_rise] }
    - id: ride_it_out
      label: สั่งทุกคนลงห้องท้องเรือ ปล่อยให้เรือขึ้นไปจนดาวลับฟ้า
      habit: cool_headed
      text: |
        {name}ปลุกคนทั้งลำ ให้ลงไปนั่งเบียดกันในห้องท้องเรือที่อุ่นที่สุด ปิดช่องลมทุกช่อง เรือขึ้นต่อไปจนเกล็ดน้ำแข็งเกาะถึงราวบันได ในห้องท้องเรือมีคนอาเจียนสองคน ไม่มีใครตาย

        ตอนสางเรือลงเองตามดาว เข้าท่าช้ากว่ากำหนดหนึ่งวัน กัปตันหักเงินเดือนของจ่าเวรสามเหรียญ ค่าถุงจดหมายของราชสำนักที่ไปถึงช้า ในใบหักเงินช่องเหตุผลเขียนว่าเรือขึ้นเอง กัปตันขีดฆ่าแล้วเขียนใหม่ว่าลมแรง
      effects: { gold: -3, alignment: { law: 1 }, flags: [rode_out_the_rise] }
    - id: steer_off_the_star
      label: เปิดสมุดเรือหน้าที่จดดาวใหม่ไว้ หาว่าถุงลมกำลังเอียงหาดวงไหน
      requires: { flag: logged_new_stars }
      text: |
        หน้านั้นในสมุดเรือยังเป็นลายมือของ{name}เอง ดาวที่เรือเชิดหาขึ้นมาเมื่อต้นฤดูฝน จดไว้พร้อมเวลาที่เห็นครั้งแรก ทุกคืนดาวดวงนั้นขึ้นเร็วกว่าเดิมเท่าเวลาต้มน้ำหนึ่งกา {name}ให้นายท้ายหมุนเรือเอากราบซ้ายเข้าหาดาวดวงนั้น ถุงลมใบนอกจะได้บังแสงให้ใบในอีกสองใบ

        ไม่ถึงชั่วยาม ถุงลมใบในอุ่นขึ้นจนน้ำแข็งที่เชือกละลายหยดลงดาดฟ้า เรือเลิกขึ้น แล้วค่อยๆ ทรุดลงหาเมฆ ร้อยโทหนุ่มยืนดูสมุดเรือข้าง{name}จนจบหน้า แล้วขอยืมไปคัดตอนเช้า
      effects: { reputation: { crown: 1 }, flags: [steered_off_the_new_star] }

- id: adult.career_navy_inquiry
  stage: adult
  scene: ship_deck
  weight: 45
  when:
    age: [49, 56]
    flags: [job_navy]
  text: |
    คืนที่เมฆลงต่ำจนเสาของเวรัสหายเข้าไปทั้งต้น พลทหารเฝ้าหัวเรือชื่อดาเมล อายุสิบเก้า ตะโกนเตือนช้าไปสิบลมหายใจ กราบซ้ายของเรือครูดผิวเสาไปยาวสามสิบศอก เสียงเหมือนเลื่อยตัดกระดูก ราวกราบหลุดไปทั้งแถบ ลูกเรือสองคนที่ยืนพิงราวตรงนั้นร่วงลงไปในเมฆ

    ศาลเรือนั่งกันในห้องกัปตันวันรุ่งขึ้น นายทหารสามคนหลังโต๊ะ สมุดเวรเปิดวางอยู่ตรงกลาง ระเบียบเขียนไว้สองข้อ คนเฝ้าหัวเรือที่เตือนช้าให้โบยสิบสองที แล้วปลดกลับบ้านไม่มีเบี้ยหวัด จ่าเวรที่ปล่อยให้คนเฝ้าหัวเรือยืนคนเดียวตอนเมฆลงให้ลดแถบ คืนนั้นจ่าเวรคือ{name} และเป็น{name}เองที่เรียกพลทหารคนที่สองลงไปช่วยแกะน้ำแข็งที่เชือกท้ายเรือ

    ดาเมลยืนรออยู่หน้าห้อง มือสองข้างกำหมวกจนปีกหมวกยับ เขาบอกทุกคนที่เดินผ่านว่าเห็นแสงที่ผิวเสา คิดว่าเป็นตะเกียงของเรืออีกลำ แสงนั้นเป็นดาวดวงใหม่ที่สะท้อนผิวหินสีกระดูก ใครที่ยืนหัวเรือมานานพอรู้ว่ามันหลอกตาได้ คนที่ยืนมาสองเดือนไม่รู้
  choices:
    - id: take_the_stripe
      label: บอกศาลว่าจ่าเวรเป็นคนสั่งให้เขายืนคนเดียว
      text: |
        {name}ให้การจบในสามประโยค ศาลไม่ถามซ้ำ กัปตันใช้กรรไกรของตัวเองตัดแถบออกจากแขนเสื้อตรงนั้น เงินเดือนลดลงห้าเหรียญต่อฤดูไปจนกว่าจะได้แถบคืน ศาลไม่ได้บอกว่าเมื่อไร

        ดาเมลไม่โดนโบย เขาได้ย้ายไปเฝ้าท้ายเรือ ตำแหน่งที่ไม่มีใครอยาก คืนแรกที่ท้ายเรือ เขาเอาเข็มกับด้ายมาเย็บแถบเก่าของ{name}ติดคืนบนเสื้อตัวที่ใส่นอน ไม่ได้ขอก่อน
      effects: { gold: -5, alignment: { moral: 1 }, people: [{ id: damel, name: ดาเมล, gender: m, bond: friend, closeness: 2, age: 19 }], flags: [lost_a_stripe_for_damel] }
    - id: by_the_book
      label: ให้การตามสมุดเวร ไม่เพิ่ม ไม่ลด
      habit: cold_blood
      text: |
        สมุดเวรเขียนว่าคนเฝ้าหัวเรือคืนนั้นชื่อดาเมล เขียนเวลาที่เขาตะโกน เขียนเวลาที่เรือครูดเสา ห่างกันสิบลมหายใจ {name}อ่านตามนั้น ไม่เอ่ยถึงคนที่สองที่จ่าเวรเรียกลงไปท้ายเรือ เพราะสมุดไม่ได้จด

        ดาเมลโดนโบยสิบสองทีบนดาดฟ้าตอนเที่ยง ทั้งลำยืนดู ก่อนค่ำเขาลงเรือส่งเสบียงกลับฝั่ง เปลนอนของเขาม้วนเก็บไว้ใต้บันไดสามวันก่อนมีคนใหม่มาแขวน
      effects: { alignment: { law: 1, moral: -1 }, reputation: { crown: 1 }, flags: [damel_was_discharged] }
    - id: blame_the_chart
      label: กางแผนที่ดาวต่อหน้าศาล ชี้ดาวดวงที่หลอกตาคนเฝ้าหัวเรือ
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}กางแผนที่ดาวที่หอดูดาวหลวงส่งมาเมื่อต้นปีลงบนโต๊ะ ชี้ดาวดวงที่ขึ้นตรงแนวเสาของเวรัสในคืนนั้น แล้ววางแผนที่ปีก่อนลงข้างกัน ตรงนั้นในปีก่อนไม่มีอะไร นายทหารคนหนึ่งเอาแผนที่สองแผ่นยกขึ้นส่องตะเกียง ซ้อนกัน แล้ววางลงช้าๆ

          ศาลจดว่าเรือครูดเสาเพราะดาวที่ยังไม่มีในตำราเฝ้าหัวเรือ ไม่มีใครโดนโบย ไม่มีใครเสียแถบ เดือนต่อมาราชนาวีออกระเบียบว่าคืนเมฆลงต่ำ หัวเรือต้องมีคนยืนสองคน ในใบระเบียบไม่มีชื่อใคร
        effects: { stats: { INT: 1 }, flags: [chart_took_the_blame] }
      failure:
        text: |
          นายทหารคนกลางฟังจนจบ แล้วบอกว่าดาวบนฟ้ามีให้ทุกคนดูเท่ากัน คนเฝ้าหัวเรือคนอื่นในราชนาวีก็ไม่ได้เอาเรือไปครูดเสา ศาลตัดสินทั้งสองข้อ

          ดาเมลโดนโบยแล้วลงเรือกลับฝั่ง {name}เสียแถบ เงินเดือนลดลงสี่เหรียญต่อฤดู แผนที่สองแผ่นยังวางซ้อนกันอยู่บนโต๊ะตอนศาลลุก ไม่มีใครยกขึ้นส่องอีก
        effects: { gold: -4, flags: [damel_was_discharged] }
    - id: ensign_on_the_court
      label: หันไปหานายทหารคนขวาสุด คนที่เคยยืนหัวเรือกับ{name}คืนเมฆลงเมื่อหลายปีก่อน
      requires: { flag: taught_the_ensign }
      text: |
        ร้อยตรีหนุ่มคนนั้นเป็นนาวาตรีแล้ว ขมับขาวทั้งสองข้าง เขาไม่รอให้ใครถาม เขาลุกขึ้นเล่าให้ศาลฟังว่าเคยเกือบเอาเรือเข้าหินนอกอ่าว เพราะเชื่อดาวดวงที่ไม่ใช่ดาวนำทาง แล้วเล่าว่าคืนนั้นใครพาเขาขึ้นหัวเรือไปหาแสงเมืองใต้ท้องเมฆ

        ศาลลงโทษดาเมลด้วยการให้ยืนหัวเรือคู่กับ{name}ทุกคืนเมฆลงไปหนึ่งปี ไม่มีใครเสียแถบ ก่อนแยกกัน นาวาตรีส่งแผนที่ดาวฉบับของตัวเองให้{name} ขอบกระดาษมีดินสอลายมือตัวเล็กเอียงขวาจดไว้แน่นทุกด้าน
      effects: { reputation: { crown: 1 }, people: [{ id: damel, name: ดาเมล, gender: m, bond: friend, closeness: 1, age: 19 }], flags: [ensign_spoke_at_the_court] }

- id: adult.career_navy_last_berth
  stage: adult
  scene: ship_deck
  weight: 45
  mark: ลงจากเรือหลวง
  when:
    age: [57, 64]
    flags: [job_navy]
  text: |
    หมอเรือจับเข่าของ{name}งอขึ้นงอลงสามครั้ง เอียงหูฟังเสียงกระดูกเหมือนฟังเปลือกหอย แล้วเขียนใบตรวจบรรทัดเดียว ว่าไม่ควรขึ้นที่สูงเกินบันไดดาดฟ้า ราชนาวีมีทางให้คนที่ได้บรรทัดนี้สองทาง ลงจากเรือรับเบี้ยหวัดเดือนละสองเหรียญไปจนตาย หรือไปนั่งโต๊ะที่โรงเรียนนายเรือ สอนเด็กที่โตมาตอนฟ้ามีดาวเบียดกันแล้ว

    เรือหลวงผูกอยู่ที่หอท่าริมแม่น้ำของเวนทราสสามวันก่อนออกลาดตระเวนรอบใหม่ ของทั้งหมดที่{name}มีบนเรือใส่หีบไม้ได้ใบเดียว หีบตั้งอยู่ปลายเปลนอนที่รู้จักทุกจังหวะโคลงของเรือลำนี้

    พลทหารใหม่ที่จะได้เปลนี้ไปยืนรอที่หัวบันได กอดหมอนของตัวเองไว้ เขาไม่กล้าวางหมอนลงจนกว่าคนเก่าจะลุก
  choices:
    - id: take_the_pension
      label: ลงจากเรือ รับเบี้ยหวัด เช่าห้องที่หน้าต่างหันไปทางหอท่า
      text: |
        ห้องเช่าอยู่ชั้นสามของบ้านคนทำใบเรือ หน้าต่างเปิดออกไปเห็นหอท่าพอดีถ้าเอียงหัวพิงกรอบ ทุกเช้า{name}นับเรือที่ปลดเชือกขึ้นฟ้า รู้ชื่อเรือจากเสียงใบพัดก่อนเห็นธง

        เบี้ยหวัดเดือนแรกได้มาครบสองเหรียญ กับเงินค้างเก่าอีกสองเหรียญที่เสมียนหาเจอในบัญชี เดือนที่สามมีพลทหารสองคนมาเคาะประตู ถามทางผูกปมที่ไม่มีในตำรา ทั้งสองคนกลับไปตอนดึก
      effects: { gold: 4, hp: 2, flags: [retired, pensioned_by_the_tower] }
    - id: teach_at_school
      label: ไปนั่งโต๊ะที่โรงเรียนนายเรือ สอนนำเรือโดยไม่ใช้ดาว
      text: |
        ห้องเรียนอยู่ใต้หลังคาตึกเก่าของโรงเรียนนายเรือ หน้าต่างแคบ ฟ้าแคบ {name}ไม่กางแผนที่ดาวสักครั้งตลอดฤดูแรก สอนนับจังหวะคลื่น สอนอ่านท้องเมฆที่มีแสงเมืองสะท้อน สอนฟังเสียงใบพัดตอนลมเปลี่ยน นักเรียนครึ่งห้องคิดว่าครูคนใหม่ไม่รู้จักดาว

        สิ้นฤดู พายุพาเรือฝึกลำหนึ่งหลงไปทั้งคืน คนที่นำเรือกลับเข้าอ่าวได้เป็นเด็กในห้องของ{name} เขาบอกกัปตันว่าเลิกดูดาวตั้งแต่ชั่วยามแรก
      effects: { stats: { WIS: 1 }, mark: สอนที่โรงเรียนนายเรือ, flags: [still_working, taught_at_naval_school] }
    - id: go_home
      label: ถือหีบลงบันไดทีละขั้น ขึ้นเกวียนกลับหมู่บ้านเกิด
      text: |
        หมู่บ้านยังจุดเทียนไขเหมือนเดิม เรือเหาะยังเป็นแค่จุดดำบนฟ้าเหมือนเดิม {name}เป็นคนเดียวในหมู่บ้านที่เคยเห็นหลังเมฆ เด็กๆ มานั่งล้อมทุกเย็น ถามว่าข้างบนนั้นมีอะไร {name}บอกว่ามีน้ำแข็งกับดาว เด็กไม่เชื่อเรื่องน้ำแข็ง

        เบี้ยหวัดมาถึงหมู่บ้านทุกสามเดือนกับคนส่งของหลวง {name}เอาเงินนั้นซื้อหลังคาฟางใหม่ทั้งหลังในปีแรก ตอนกลางคืน เวลามีเรือเหาะผ่าน {name}ยังลุกออกไปฟังเสียงใบพัด แล้วบอกชื่อเรือให้หมาฟัง
      effects: { hp: 2, location_tag: arvel_village, flags: [retired, went_home_from_the_navy] }
    - id: horned_crew
      label: เปิดจดหมายที่ส่งมาถึงหอท่า ลายมือเด็กที่หัดเขียนได้ไม่นาน
      requires: { flag: let_horned_boat_go }
      text: |
        จดหมายมาจากอ่าวเล็กสุดชายฝั่งใต้ คนเขียนเป็นเด็กคนโตในเรือลำนั้นเมื่อหลายปีก่อน ตอนนี้มีเรือหาปลาของตัวเองสองลำ ลูกเรือครึ่งหนึ่งมีเขา เขาไม่ได้เขียนขอบคุณ เขาเขียนว่าเรือลำที่สองยังไม่มีคนถือหางเสือที่อ่านเมฆเป็น ถ้า{name}ลงจากเรือหลวงเมื่อไร ที่ท้ายเรือมีเปลว่างอยู่หนึ่งเปล

        {name}ไปถึงอ่าวนั้นตอนต้นฤดูปลาขึ้น เรือหาปลาไม่มีใบพัด ไม่มีถุงลม มีแต่ใบผ้ากับน้ำเค็ม ลูกเรือที่มีเขาเรียก{name}ว่าคนเรือหลวง เรียกแบบหยอก แล้วไม่เคยเรียกด้วยชื่ออื่นอีก
      effects: { stats: { CON: 1 }, location_tag: arvel_village, flags: [retired, fished_with_the_horned_crew] }

# ---------- ผู้เฝ้าผนึก ----------
- id: adult.career_wardens_pay
  stage: adult
  scene: fort
  weight: 45
  when:
    age: [41, 48]
    flags: [job_wardens]
  text: |
    เกวียนเงินเดือนขึ้นมาถึงป้อมสามช้ากว่ากำหนดสิบเอ็ดวัน ล่อตัวเดียวลากหีบไม้ใบเดียว เสมียนของภาคีเปิดหีบบนโต๊ะยาวในห้องกินข้าวต่อหน้าทุกคน นับเหรียญออกเป็นกองตามรายชื่อ กองละสองเดือน ไม่ใช่สาม จดหมายที่มากับหีบบอกว่าเดือนที่สามจะตามมาเมื่อเงินอุดหนุนรอบใหม่ลงมาจากราชสำนัก คนที่กินข้าวโต๊ะนี้มาเกินสิบหนาวรู้ว่าประโยคนี้แปลว่าอะไร

    ประกาศของบริษัทเหมืองถ่านมารตอกติดเสาหน้าประตูป้อมมาตั้งแต่ต้นเดือน รับคนเฝ้าหัวเจาะ ค่าจ้างสามเท่าของผู้เฝ้า แจกรองเท้าหนัง ข้าวสามมื้อ ตกค่ำ ผู้เฝ้ารุ่นหนุ่มห้าคนม้วนผ้าห่มมัดเชือก ไปนั่งรอเกวียนถ่านขาลงที่ประตู คนนำคือโอเรน หอกที่แม่นที่สุดในรุ่น

    เด็กกะดึกวิ่งขึ้นกำแพงมาตาม{name} ไม่ได้ไปตามหัวหน้ากะคนอื่น ลมหัวค่ำเย็นลงเร็ว หลังของ{name}แข็งเป็นแผ่นกระดาน บันไดลงจากกำแพงยี่สิบสองขั้น คืนนี้ต้องหยุดพักกลางทางหนึ่งครั้ง ไม่เคยต้องหยุดมาก่อน
  choices:
    - id: sit_at_the_gate
      label: ไปนั่งกับพวกเขาที่ประตู เล่าว่าหัวเจาะตอนกลางคืนเป็นอย่างไร
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ไม่ได้สั่งให้ใครอยู่ {name}นั่งลงบนหินเย็นข้างประตู ตรงกลางระหว่างห้าคนกับเสาที่ติดประกาศ แล้วเล่าว่าจากบนกำแพงเห็นอะไรทุกคืน ไฟที่หัวเจาะสว่างที่สุดในทุ่ง จุดแดงหลังแนวหินจึงไปถึงที่นั่นก่อนที่อื่นทุกครั้ง คนเฝ้าหัวเจาะไม่มีระฆัง ไม่มีกำแพง บริษัทจดชื่อพวกเขาเป็นเลข ฤดูที่แล้ว{name}นับไฟหัวเจาะที่ดับกลางดึกได้สี่ดวง ไม่มีดวงไหนจุดขึ้นใหม่ด้วยมือคนเดิม

          เกวียนถ่านมาตอนสาง ขึ้นไปสองคน โอเรนลุกขึ้นแบกผ้าห่มกลับเข้าประตู อีกสองคนเดินตามเขา ก่อนเที่ยงเขาขึ้นกำแพงมาขอเวรช่องที่{name}ยืน บอกว่าอยากรู้ว่ายืนตรงไหนถึงนับไฟได้ครบสี่ดวง
        effects: { stats: { CHA: 1 }, reputation: { wardens: 1 }, people: [{ id: oren, name: โอเรน, gender: m, bond: friend, closeness: 1, age: 20 }], flags: [kept_oren_at_the_fort] }
      failure:
        text: |
          โอเรนฟังจนจบอย่างคนมีมารยาท แล้วบอกว่าหลังคาบ้านแม่เขารั่วมาสองฝน น้องยังเล็กอีกสามคน เขาว่าผู้เฝ้าตายได้หนเดียว แต่บ้านเขาหนาวทุกปี {name}หาคำตอบให้ประโยคนั้นไม่ทันก่อนเกวียนจะมา

          ห้าคนขึ้นเกวียนถ่านไปพร้อมกัน {name}ยัดเหรียญสองเหรียญใส่มือโอเรนตอนเขาก้าวขึ้นล้อ ค่ารองเท้าคู่แรก ไม่ต้องรอบริษัทแจก คืนนั้นห้องนอนรวมมีเตียงว่างห้าเตียงติดกัน
        effects: { gold: -2, flags: [young_wardens_left] }
    - id: split_your_pay
      label: แบ่งเงินเดือนของตัวเองให้ห้าคนจนครบสามเดือน
      requires: { min_gold: 6 }
      text: |
        {name}เทเหรียญกองของตัวเองลงบนผ้าห่มผืนบนสุดของโอเรน แบ่งเป็นห้ากองด้วยนิ้วชี้ ห้าคนนั่งนิ่ง ไม่มีใครเอื้อมมือก่อน จนโอเรนหยิบกองของตัวเองขึ้นมานับ แล้วนับซ้ำอีกรอบ

        ห้าคนอยู่ผ่านหนาวนั้น ต้นฝนสองคนลงเขาไปกับเกวียนถ่านอยู่ดี โอเรนไม่ไป ทุกต้นเดือนหลังจากนั้น{name}เจอเหรียญทองแดงเหรียญหนึ่งวางอยู่ข้างจานข้าวของตัวเอง ไม่มีใครเห็นว่าใครวาง
      effects: { gold: -6, alignment: { moral: 1 }, flags: [split_pay_with_the_young] }
    - id: open_the_gate
      label: ถอดสลักประตูให้เอง บอกพวกเขาว่าป้อมไม่ใช่คุก
      habit: soft_heart
      text: |
        ระเบียบของภาคีเขียนว่าผู้เฝ้าที่ลงจากแนวก่อนครบสัญญาให้ตามตัวกลับ {name}ถอดสลักประตูป้อมเอง ดึงบานหนักออกให้กว้างพอเกวียนเข้า แล้วยืนพิงบานไว้จนเกวียนถ่านมา โอเรนเดินออกไปเป็นคนสุดท้าย เขาหยุดตรงหน้า{name}ครู่หนึ่ง แล้วยื่นหอกของป้อมคืน หันด้ามมาทาง{name}

        ภาคีส่งจดหมายตำหนิมาถึงป้อมสามก่อนสิ้นเดือน หนาวต่อมา หนึ่งในห้าคนเดินกลับขึ้นมาที่ประตูป้อม มือสองข้างพันผ้าถึงข้อศอก ขอเตียงเดิม {name}ให้เตียงเดิม
      effects: { alignment: { law: -1 }, reputation: { wardens: -1 }, flags: [let_the_young_wardens_go] }
    - id: show_the_heat_table
      label: กางตารางความร้อนข้างหินให้ห้าคนดูใต้ตะเกียงประตู
      requires: { flag: stone_heat_ledger }
      text: |
        ตารางเล่มนั้นยังอยู่ใต้หมอนของ{name} ตัวเลขข้างหินก้อนที่สามสิบสองถึงสามสิบเก้า จดมาทุกคืนตั้งแต่ปีที่บริษัทเริ่มเจาะ {name}เปิดหน้าล่าสุด ชี้ให้ดูว่าเถ้าตรงที่หัวเจาะตั้งอุ่นถึงมือตั้งแต่ลึกครึ่งศอก ตรงที่ผู้เฝ้ายืนต้องลึกสองศอก เด็กห้าคนนี้ปักเหล็กลงเถ้าให้ตารางเล่มนี้มาทั้งฤดู ยังไม่เคยมีใครเปิดให้พวกเขาดูว่าตัวเลขขึ้นไปถึงไหนแล้ว

        โอเรนไล่นิ้วตามตัวเลขลงมาทีละบรรทัดจนสุดหน้า แล้วลุกไปดึงประกาศของบริษัทออกจากเสา พับสี่ทบ เอาไปจุดเตาในห้องกินข้าว ห้าคนอยู่ผ่านหนาว ตารางเล่มต่อมาเป็นลายมือของโอเรนครึ่งเล่ม
      effects: { reputation: { wardens: 1 }, people: [{ id: oren, name: โอเรน, gender: m, bond: friend, closeness: 1, age: 20 }], flags: [oren_read_the_heat_table] }

- id: adult.career_wardens_goats
  stage: adult
  scene: fort
  weight: 45
  when:
    age: [49, 56]
    flags: [job_wardens]
  text: |
    หมาเถ้าตัวหนึ่งข้ามแนวหินเมื่อคืน ตรงช่องระหว่างหินก้อนที่สี่สิบกับสี่สิบเอ็ด หมาตัวนั้นลงเขาไปถึงคอกแพะท้ายบ้านหญ้าเงินก่อนเที่ยงคืน แพะตายเจ็ดตัว ลูกสาวคนเลี้ยงแพะอายุแปดขวบออกมาไล่ด้วยไม้กวาดหญ้า แขนซ้ายของเด็กไหม้ตั้งแต่ข้อศอกถึงข้อมือ

    ช่องนั้นคืนนั้นเป็นเวรของวาลิก ผู้เฝ้าอายุสิบแปดในกะของ{name} วาลิกไม่ได้อยู่ที่ช่อง เขาลงไปบ้านหญ้าเงินหาลูกสาวช่างฟอกหนังตั้งแต่หัวค่ำ ตะเกียงเวรของเขาจุดค้างไว้บนหิน ให้คนบนกำแพงเห็นแสงแล้วนึกว่ามีคนยืนอยู่ คนบนกำแพงคืนนั้นก็นึกอย่างนั้นจริง

    สายวันนี้คนเลี้ยงแพะขึ้นมาถึงประตูป้อมพร้อมคนเฒ่าของหมู่บ้านสองคน พวกเขาไม่ได้มาขอให้โบยใคร พวกเขามาถามว่าใครจะจ่ายค่าแพะ และป้อมยังเฝ้าช่องนั้นอยู่จริงหรือเปล่า ระเบียบป้อมเขียนไว้สั้นๆ ผู้เฝ้าที่ทิ้งช่องให้โบยสิบห้าที ตัดเงินหนึ่งฤดู ผู้เฝ้าคนนั้นอยู่ในกะของใคร คนนั้นตัดสิน

    วาลิกยืนรออยู่ข้างบ่อน้ำ เสื้อชุ่มเหงื่อเพราะลากซากแพะไปเผามาทั้งเช้า รอยเท้าไหม้ของหมาตัวนั้นยังวนอยู่แถวหุบใต้หมู่บ้าน ยังไม่ย้อนข้ามแนวกลับไป
  choices:
    - id: flog_by_the_rule
      label: สั่งโบยวาลิกสิบห้าทีตามระเบียบ ต่อหน้าคนบ้านหญ้าเงิน
      habit: stubborn
      text: |
        {name}นับเองทุกที เสียงดังพอให้คนเลี้ยงแพะได้ยินถึงประตู วาลิกเกาะขอบบ่อน้ำไว้ ไม่ร้อง ถึงทีที่สิบ คนเลี้ยงแพะหันหลังเดินลงเขาไปก่อน คนเฒ่าสองคนรอจนครบ แล้วตามลงไปโดยไม่ลา

        หนาวนั้นบ้านหญ้าเงินเลิกส่งนมแพะขึ้นมาให้ป้อมทุกเจ็ดวันอย่างเคย ช่องระหว่างก้อนที่สี่สิบกับสี่สิบเอ็ดมีตะเกียงสองดวงทุกคืน วาลิกถือดวงหนึ่งไว้ในมือ ไม่เคยวางลงบนหินอีก
      effects: { alignment: { law: 1 }, flags: [flogged_valik] }
    - id: pay_the_goats
      label: นับค่าแพะจากกระเป๋าตัวเอง ให้วาลิกใช้คืนด้วยแรง
      requires: { min_gold: 6 }
      text: |
        {name}นับหกเหรียญลงในมือคนเลี้ยงแพะ บอกว่าตัวที่เจ็ดป้อมยังติดอยู่ คนเลี้ยงแพะกำเหรียญไว้แน่น ถามว่าแล้วแขนลูกสาวเขาเล่า {name}ไม่มีเหรียญสำหรับคำถามนั้น จึงส่งวาลิกลงเขาไปกับเขา

        ทุกวันพักเวรตลอดสองหนาวต่อมา วาลิกลงไปขนน้ำ ซ่อมรั้วคอก ต้อนแพะฝูงใหม่ออกเล็มหญ้าเงินริมห้วย เด็กหญิงที่แขนเป็นแผลเป็นเดินนำหน้าเขา บอกชื่อแพะทีละตัว และดุทุกครั้งที่เขาเรียกผิด
      effects: { gold: -6, alignment: { moral: 1 }, flags: [paid_for_the_goats] }
    - id: wait_at_the_pen
      label: พาวาลิกลงไปนั่งเฝ้าคอกแพะคืนนี้ รอหมาตัวนั้นกลับมา (เสี่ยงถึงชีวิต)
      check: { stat: CON, dc: 11, foe: demon }
      success:
        text: |
          {name}กับวาลิกนั่งหลังรั้วคอกที่ยังเหลือ หอกวางบนตัก ไม่จุดตะเกียง แพะสิบสามตัวเบียดกันอยู่มุมคอก ไออุ่นลอยขึ้นจากหลัง ตีสาม แพะทั้งคอกหันหัวไปทางเดียวกันพร้อมกัน {name}รู้ก่อนเห็น

          หมาเถ้ากระโดดข้ามรั้วเข้ามาตรงที่แพะหัน วาลิกแทงพลาด {name}ไม่พลาด หนังร้อนแตกเป็นถ่านที่ปลายหอก ไฟลามติดแขนเสื้อ{name}ไปครึ่งแขนก่อนวาลิกจะคว้าน้ำในรางแพะสาดดับ เช้านั้นคนเลี้ยงแพะโกยซากถ่านใส่กระสอบ แบกขึ้นเขาไปวางที่ประตูป้อมเอง
        effects: { hp: -1, stats: { CON: 1 }, reputation: { wardens: 1 }, flags: [waited_at_the_pen_with_valik] }
      failure:
        text: |
          ตีสาม แพะทั้งคอกหันหัวไปทางเดียวกัน {name}ลุกช้ากว่าที่เข่าเคยลุกไปหนึ่งจังหวะ หมาเถ้ากระโดดข้ามรั้วเข้ามา ไม่ใช่ทางที่แพะหัน แต่ทางที่{name}ยืน

          วาลิกแทงหมาตัวนั้นจนถ่านในอกแตก ตอนนั้นสายไปแล้ว เขาแบกร่าง{name}ขึ้นเขาเองทั้งทาง ไม่ยอมให้ใครช่วย บ่ายวันนั้นผนังห้องกินข้าวมีหัวหอกแขวนเพิ่มอีกอัน วาลิกเป็นคนตอกตะปู
        effects: { die: sacrifice }
    - id: sathil_goes_down
      label: ให้ซาธิลพาวาลิกลงไปหาคนเฒ่าบ้านหญ้าเงิน
      requires: { flag: taught_sathil }
      text: |
        ซาธิลโตมาในบ้านหญ้าเงิน แม่ของเขายังทอผ้าอยู่หลังบ่อน้ำกลางหมู่บ้าน เขารู้ว่าคนเฒ่าที่นั่นไม่ฟังคำของป้อม ฟังแต่คำของคนที่เคยกินหญ้าเงินขมๆ มาด้วยกัน เขาพาวาลิกลงไปตอนบ่าย กลับขึ้นมาคนเดียวตอนค่ำ

        ซาธิลบอก{name}ว่าหมู่บ้านตัดสินตามธรรมเนียมของหมู่บ้าน คนที่ทำให้คอกเสียแพะต้องนอนในคอกจนกว่าลูกแพะตัวแรกของฤดูจะเกิด วาลิกนอนในคอกนั้นสี่สิบเอ็ดคืน ลูกแพะตัวแรกเป็นตัวเมียสีดำ เด็กหญิงที่แขนเป็นแผลเป็นตั้งชื่อลูกแพะตามชื่อเขา
      effects: { reputation: { wardens: 1 }, alignment: { moral: 1 }, flags: [valik_slept_in_the_goat_pen] }

- id: adult.career_wardens_last_winter
  stage: adult
  scene: fort
  weight: 45
  mark: ปลดหอก
  when:
    age: [57, 64]
    flags: [job_wardens]
  text: |
    ผนังด้านยาวของห้องกินข้าวป้อมสามมีหัวหอกแขวนเรียงกันหลายแถว ของคนที่ตายบนแนว {name}เรียกชื่อได้ทุกอันในสามแถวล่าง ผนังด้านสั้นข้างประตูมีหัวหอกไม่ถึงสิบอัน ของคนที่เดินลงจากแนวไปด้วยขาตัวเอง

    หนาวนี้นิ้วของ{name}กำด้ามหอกไม่รอบจนกว่าแดดจะขึ้น เด็กกะดึกแบกน้ำมันตะเกียงขึ้นบันไดแทนโดยไม่มีใครสั่ง และเดินช้าลงทุกครั้งที่เดินข้าง{name}

    เช้าวันแรกของหนาว เสมียนป้อมเอาสมุดรายชื่อกับขวดหมึกมาวางข้างชามข้าวของ{name} ทุกต้นหนาวเขาต้องเขียนลงข้างชื่อทุกชื่อ ว่าอยู่อีกหนาวหรือลง เกวียนถ่านขาลงออกจากประตูตอนเที่ยง ที่ท้ายเกวียนยังว่างหนึ่งที่ เสมียนจุ่มปากกาค้างไว้จนหมึกหยดลงขอบสมุดหนึ่งหยด
  choices:
    - id: settle_below
      label: ลงไปเช่ากระท่อมใต้แนวป้อม ฟังระฆังจากข้างล่าง
      text: |
        {name}ปีนเก้าอี้ขึ้นแขวนหัวหอกของตัวเองบนผนังด้านสั้น ตะปูตัวแรกตอกเอง ตัวที่สองต้องให้เด็กกะดึกตอกให้ กระท่อมที่เช่าอยู่ปลายบ้านหญ้าเงิน หลังคามุงหญ้าเงินทั้งหลัง ฝนเถ้าตกเมื่อไรต้องปีนขึ้นไปกวาด

        ทุกคืนที่ระฆังป้อมสามดัง {name}ลุกขึ้นนั่งก่อนเสียงแรกจะจบ นับว่ากี่ชุด นับเสร็จก็นอนต่อไม่ได้ ต้มน้ำรอจนสาง เผื่อมีใครลงมา
      effects: { clear_flags: [job_wardens], location_tag: ashland, flags: [retired, left_the_fort, settled_under_the_line] }
    - id: ride_south
      label: ขึ้นเกวียนถ่านขาลง ไปหาที่ที่ฝนยังใส
      text: |
        เกวียนถ่านลงเขาสามวันกว่าจะพ้นแดนเถ้า วันที่สี่{name}ลงจากเกวียนที่หมู่บ้านริมทุ่งนาแห่งแรกที่ฝนตกลงมาเป็นน้ำใส ไม่มีสีเทาปน เช่าห้องหลังโรงสีข้าว คนในหมู่บ้านไม่เคยเห็นหมาเถ้า ไม่รู้ด้วยซ้ำว่าแนวหินอยู่ทางไหน

        หลังของ{name}หายปวดในหน้าฝนแรก ไอที่ติดคอมาหลายปีเบาลงในหน้าฝนที่สอง กลางดึกเวลาโรงสีตีเกราะบอกยาม {name}ยังลุกขึ้นนั่งนับอยู่หลายเดือน
      effects: { hp: 2, clear_flags: [job_wardens], location_tag: arvel_village, flags: [retired, left_the_fort, went_south_from_the_fort] }
    - id: train_the_recruits
      label: บอกเสมียนให้เขียนว่าอยู่ แล้วขอเวรสอนเด็กใหม่ที่ลานฝึก
      text: |
        ลานฝึกอยู่หลังกำแพงชั้นใน ลมไม่ค่อยถึง {name}สอนจากเก้าอี้ ไม่ถือหอก ใช้ไม้เท้าเคาะข้อเท้าเด็กที่ยืนผิดท่า สอนว่าหอกต้องยาวแค่ไหนหมาเถ้าถึงแตกก่อนไฟจะลามมาถึงมือ สอนว่าตะเกียงเวรห้ามวางบนหิน

        เด็กใหม่รุ่นนั้นสิบสองคน หนาวแรกบนแนวไม่มีใครตาย เสมียนป้อมเขียนลงสมุดข้างชื่อของ{name}ว่าอยู่ แล้วเขียนต่อท้ายอีกคำ ว่าลานฝึก
      effects: { stats: { WIS: 1 }, mark: ครูลานฝึกป้อมสาม, flags: [still_working, taught_the_fort_recruits] }
    - id: another_winter_at_36
      label: ขอเวรกะดึกที่หินก้อนที่สามสิบหกอีกหนาว
      requires: { flag: sealed_stone_36 }
      text: |
        ผู้เฝ้ารุ่นใหม่ยังเรียกหินก้อนที่สามสิบหกด้วยชื่อของ{name} หลายคนไม่รู้ว่าเป็นชื่อคนที่ยังกินข้าวโต๊ะเดียวกับพวกเขา ปูนในรอยร้าวยังมีรอยมือเดิม ซีดลงจนเกือบเป็นสีเดียวกับหิน

        {name}นั่งเก้าอี้เตี้ยที่เด็กกะดึกยกลงมาให้ หลังพิงหิน ผ้าห่มคลุมเข่า เฝ้าทั้งหนาว ปลายหนาวมีจุดแดงมาหยุดห่างโคนหินสามก้าวสองคืน แล้วถอยกลับไปเองทั้งสองคืน เสมียนเขียนข้างชื่อของ{name}ว่าอยู่ ไม่ได้เขียนว่าอีกกี่หนาว
      effects: { stats: { CON: 1 }, reputation: { wardens: 1 }, flags: [still_working, another_winter_at_stone_36] }

# ---------- ทหารรับจ้าง ----------
- id: adult.career_merc_golems
  stage: adult
  scene: road
  weight: 45
  when:
    age: [41, 48]
    flags: [job_mercenary]
  text: |
    บริษัทเหมืองส่งหุ่นยามมาขึ้นขบวนถ่านสองตัว สูงกว่าคนครึ่งตัว หัวเป็นโคมแก้ว แขนขวาเป็นลำกล้องปืนเวทยาวสองศอก ในอกมีหลอดน้ำค้างเรียงสามหลอด ช่างจากกิลด์ที่ขึ้นขบวนมาด้วยบอกว่าหุ่นไม่หลับ ไม่ไอ ไม่ขอเงินเดือน ใบสั่งจากสำนักงานปลายรางมาถึงพร้อมกัน ยามใต้คำสั่งของ{name}ลดจากสิบสองคนเหลือสี่

    ช่างอธิบายวิธีที่หุ่นทำงานเหมือนอธิบายข้อดี หลังตะวันตก อะไรขยับเข้าใกล้รางในห้าสิบก้าวโดยไม่ชูโคมเขียวของบริษัท หุ่นยิงก่อน ไม่ถาม ตาของ{name}ทุกวันนี้มองในความมืดได้ไม่ถึงสามสิบก้าว หุ่นสองตัวนั้นเห็นได้ห้าสิบ

    คืนนี้ขบวนจะผ่านโค้งหินตอนสองยาม ใครที่คุมขบวนบนรางสายนี้มานานพอจะรู้ว่าคืนเดือนดับแบบนี้ คนหมู่บ้านริมรางลงมาเก็บถ่านที่หล่นตรงโค้งนั้น และรู้ว่าไม่มีใครในหมู่บ้านมีโคมเขียว
  choices:
    - id: pull_the_vials
      label: ปีนขึ้นหลังคาตู้ แงะฝาอกหุ่น ถอดหลอดน้ำค้างออกก่อนถึงโค้ง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ฝาอกหุ่นปิดด้วยสลักทองเหลืองสี่ตัว {name}ไขด้วยปลายมีดทีละตัว บนหลังคาตู้ที่โยกไปตามราง ช่างกิลด์นอนหลับอยู่ในตู้หลัง หลอดน้ำค้างหกหลอดเรียงอยู่ในกระเป๋าเสื้อ{name}ก่อนขบวนถึงโค้ง โคมแก้วบนหัวหุ่นยังสว่าง หันซ้ายหันขวาตามเงาข้างราง แขนปืนยกขึ้นสองครั้ง ไม่มีอะไรออกมา

          เช้ามาช่างเปิดฝาอกเจอรังหลอดว่าง เขียนรายงานว่าหลอดหลุดเพราะรางสั่น สำนักงานปลายรางสั่งสลักแบบใหม่ ของมาถึงอีกสามเดือนให้หลัง
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [pulled_the_golem_vials] }
      failure:
        text: |
          สลักตัวที่สามติดแน่น ปลายมีดหักคาร่อง ไอฟ้ารั่วออกจากรังหลอดทางร่องสลัก เผาหลังมือ{name}จนพองเป็นแผ่น ขบวนเข้าโค้งหินตอนที่ฝาอกยังเปิดค้างครึ่งเดียว หุ่นยิงหนึ่งนัดลงไปในความมืดข้างราง

          {name}เดินย้อนไปที่โค้งตอนสาง เจอกระสอบป่านเปล่าใบหนึ่งไหม้เป็นรูกลางผืน ไม่มีเลือด ไม่มีรอยลาก มือข้างนั้นจับด้ามปืนได้ไม่เต็มกำไปครึ่งเดือน
        effects: { hp: -2, flags: [golem_fired_at_the_curve] }
    - id: walk_ahead
      label: ลงเดินนำขบวนไปถึงโค้งหินก่อน ถือตะเกียงไปบอกคนหมู่บ้าน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ขบวนถ่านวิ่งเร็วกว่าคนเดินไม่มากนัก {name}เดินตามรางในความมืดสองชั่วยาม ตะเกียงมือส่องรางได้ไม่ถึงสิบก้าว ถึงโค้งหินก่อนขบวนเท่าเวลาต้มน้ำกาหนึ่ง คนหมู่บ้านนั่งรออยู่หลังกองหินแล้วเจ็ดคน ถือกระสอบเปล่ามาทุกคน {name}บอกเรื่องหุ่น บอกระยะห้าสิบก้าว ให้ทุกคนนอนราบหลังเนินจนขบวนผ่าน

          โคมหัวหุ่นกวาดผ่านเนินไปสองรอบ ไม่เจออะไรขยับ เที่ยวต่อๆ มา ถ่านไปหล่นที่จุดเติมน้ำตอนกลางวันแทน ต่อหน้าหุ่นทั้งสองตัว หุ่นไม่ยิงคนที่เดินมาให้เห็นหน้าตอนกลางวัน
        effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [walked_ahead_of_the_golems] }
      failure:
        text: |
          เข่าของ{name}พลิกบนหินโรยรางตรงที่ตะเกียงส่องไม่ถึง {name}เดินกะเผลกต่อไปได้ครึ่งทาง แล้วขบวนก็แซงไป เสียงปืนเวทดังที่โค้งหินหนึ่งนัด แสงฟ้าวาบขึ้นไปถึงท้องเมฆ

          {name}ไปถึงโค้งตอนใกล้สาง หลังกองหินมีกระสอบเปล่าทิ้งไว้สามใบ รอยเท้าวิ่งกระจายไปทางหมู่บ้าน ทุกรอยลึกเท่ากันทั้งสองข้าง ไม่มีรอยไหนลาก
        effects: { hp: -2, flags: [golem_fired_at_the_curve] }
    - id: let_them_ride
      label: ปล่อยให้หุ่นทำงานตามที่ช่างบอก
      habit: cold_blood
      text: |
        {name}นั่งในตู้หัวขบวน เอาผ้าอุดหูกันเสียงล้อ ขบวนผ่านโค้งหินตอนสองยาม หุ่นยิงสามนัด แสงฟ้าวาบสามครั้งบนผนังตู้ ไม่มีเสียงร้องตามมา

        บริษัทจ่ายรางวัลเที่ยวที่ไม่หายสักกระสอบสี่เหรียญ เที่ยวกลับผ่านโค้งหินตอนกลางวัน บนกองหินมีแพะตายตัวหนึ่ง ขนไหม้เป็นวงกลมกลางสีข้าง ใต้ตัวแพะมีกระสอบป่านใบหนึ่งยังพับอยู่
      effects: { gold: 4, alignment: { moral: -1 }, flags: [let_the_golems_ride] }
    - id: three_lamps
      label: แขวนตะเกียงสามดวงที่ท้ายขบวน
      requires: { flag: rail_village_pact }
      text: |
        รหัสตะเกียงที่ตกลงกับคนแก่ของหมู่บ้านไว้ตั้งแต่หนาวนั้นมีแค่สองแบบ สองดวงแปลว่ามีกระสอบตก ดวงเดียวแปลว่ายามบริษัทขึ้นมาด้วย ไม่เคยมีสามดวง {name}จุดตะเกียงสามดวงแขวนเรียงที่ท้ายตู้สุดท้าย ให้แกว่งไปตามรางตลอดทางเข้าโค้ง

        ที่โค้งหินไม่มีใครลงมา โคมหัวหุ่นกวาดผ่านกองหินว่างเปล่าสองรอบ แล้วหันกลับไปทางราง เที่ยวต่อมาตอนกลางวัน เด็กหมู่บ้านคนหนึ่งยืนบนกองหิน ชูสามนิ้วให้ตู้หัวขบวน {name}ชูสามนิ้วตอบ
      effects: { alignment: { moral: 1 }, flags: [three_lamps_at_the_curve] }

- id: adult.career_merc_tea_fire
  stage: adult
  scene: road
  weight: 45
  when:
    age: [49, 56]
    flags: [job_mercenary]
  text: |
    กลางเดือนฝน ขบวนของ{name}จอดพักที่ทางแยกเถ้าแดง ดับตะเกียงทั้งขบวนตามระเบียบของแถบนั้น ระเบียบข้อนี้{name}เป็นคนขอให้บริษัทเขียนลงสมุดขบวนเองเมื่อหลายหนาวก่อน เคลด ยามอายุยี่สิบที่เพิ่งขึ้นขบวนได้ฤดูเดียว จุดไฟต้มน้ำชาในตู้ท้ายเพราะนิ้วหนาวจนงอไม่ได้ ไฟดวงนั้นเล็กเท่ากำปั้น

    หมาเถ้าสามตัวมาก่อนน้ำเดือด ยามสองคนที่นอนตู้ท้ายไม่ได้ลุกออกมาจากผ้าห่ม เคลดรอดเพราะลุกไปฉี่ข้างราง

    สามสัปดาห์ต่อมา สำนักงานปลายรางส่งใบรายงานเหตุมาให้หัวหน้าขบวนลงชื่อ ช่องสาเหตุเว้นว่าง เสมียนเขียนดินสอบางๆ ไว้ข้างช่อง ยามที่ตายเพราะขบวนทำผิดระเบียบ บริษัทไม่จ่ายเงินทำศพ แม่ของยามสองคนนั้นนั่งรออยู่บนม้านั่งหน้าสำนักงานมาตั้งแต่เช้า เคลดยืนอยู่ข้างหลัง{name} ไม่กล้านั่ง
  choices:
    - id: write_the_truth
      label: เขียนตามจริงว่าไฟดวงนั้นมาจากมือใคร
      text: |
        {name}เขียนช่องสาเหตุสองบรรทัด ชื่อเคลด ไฟต้มน้ำ หมาเถ้าสามตัว เสมียนเป่าหมึกให้แห้งแล้วเก็บเข้าแฟ้ม แม่สองคนบนม้านั่งได้คนละหนึ่งเหรียญเป็นค่าเกวียนกลับบ้าน ไม่ได้มากกว่านั้น

        บริษัทปลดเคลดตั้งแต่บ่าย ก่อนขึ้นเกวียนเขาเดินไปที่ม้านั่ง คุกเข่าลงตรงหน้าแม่สองคน คนหนึ่งลุกเดินหนี อีกคนนั่งอยู่ที่เดิมจนเขาลุกไปเอง
      effects: { alignment: { law: 1 }, flags: [wrote_down_kleds_fire] }
    - id: write_hounds_in_the_dark
      label: เขียนว่าหมาเถ้าบุกตู้ท้ายในความมืด ขบวนดับไฟครบ
      check: { stat: INT, dc: 14 }
      success:
        text: |
          คืนนั้นก่อนเสมียนจะมาตรวจตู้ {name}เอากาต้มน้ำก้นดำโยนลงบ่อเถ้า ขูดรอยเขม่าบนพื้นตู้ออกด้วยมีดจนเห็นเนื้อไม้ใหม่ แล้วขูดพื้นทั้งตู้ให้ใหม่เท่ากันหมด จากนั้นนั่งกับเคลดจนเขาท่องเรื่องเดียวกันได้ไม่ติดสักคำ

          เสมียนตรวจตู้แล้วไม่เจออะไร บริษัทจ่ายเงินทำศพให้แม่สองคนนั้นคนละหกเหรียญ เคลดได้อยู่ขบวนต่อ ตลอดหนาวนั้นเขาไม่ยอมจิบน้ำร้อนสักหยดหลังตะวันตก
        effects: { stats: { INT: 1 }, alignment: { law: -1, moral: 1 }, flags: [lied_for_kled] }
      failure:
        text: |
          เสมียนปีนเข้าไปในตู้ท้ายเอง เอานิ้วลูบพื้นตรงที่{name}ขูดเขม่าออก ดมปลายนิ้ว แล้วเปิดสมุดขบวนหน้าที่เขียนระเบียบดับไฟ ข้างล่างระเบียบนั้นมีลายมือของ{name}รับรองไว้

          บริษัทไม่จ่ายเงินทำศพ หักเงินเดือน{name}ห้าเหรียญฐานเขียนรายงานเท็จ แล้วปลดเคลด แม่สองคนได้ยินทั้งหมดจากม้านั่ง ผ่านหน้าต่างสำนักงานที่เปิดค้างไว้
        effects: { gold: -5, flags: [company_caught_the_report] }
    - id: pay_the_mothers
      label: เขียนตามจริง แล้วจ่ายค่าทำศพจากเงินตัวเอง
      requires: { min_gold: 8 }
      text: |
        {name}ลงชื่อในใบรายงานตามจริง แล้วเดินออกไปนั่งที่ม้านั่งหน้าสำนักงาน ตรงกลางระหว่างแม่สองคน นับเหรียญออกมาแปดเหรียญ แบ่งเป็นสองกอง วางลงบนตักคนละกอง ไม่ได้บอกว่าเงินมาจากไหน

        แม่คนหนึ่งถามว่าบริษัทจ่ายแค่นี้หรือ {name}บอกว่าแค่นี้ นางนับเหรียญซ้ำอีกรอบ แล้วผูกเข้าชายผ้าคาดเอวทีละเหรียญ เคลดยืนดูอยู่หลังหน้าต่างสำนักงานจนนางผูกครบ
      effects: { gold: -8, alignment: { moral: 1 }, flags: [paid_the_dead_guards_mothers] }
    - id: fedens_mother
      label: พาเคลดข้ามแม่น้ำไปหาแม่ของเฟเดน
      requires: { flag: lost_a_guard }
      text: |
        แม่ของเฟเดนยังอยู่บ้านเดิมริมแม่น้ำ ยังซ่อมแหให้คนหาปลาทั้งหมู่บ้าน ลูกชายของนางกลับบ้านมาในตู้ถ่านเมื่อหลายหนาวก่อน บริษัทไม่เคยส่งเงินทำศพมาสักเหรียญ {name}ลงชื่อในใบรายงานตามจริง แล้วพาเคลดลงเรือข้ามฟากไปหานางในวันเดียวกัน

        นางฟังเรื่องไฟต้มน้ำจนจบ แล้วโยนแหผืนหนึ่งให้เคลด บอกว่าตาขาดสิบเจ็ดตา ซ่อมให้เสร็จก่อนค่ำ เคลดซ่อมไม่เป็น นางสอนทีละตา หนาวนั้นเคลดไม่กลับขึ้นขบวน เขาอยู่ซ่อมแหกับนางริมแม่น้ำ
      effects: { alignment: { law: 1, moral: 1 }, flags: [kled_stayed_with_fedens_mother] }

- id: adult.career_merc_last_convoy
  stage: adult
  scene: road
  weight: 45
  mark: ขบวนสุดท้าย
  when:
    age: [57, 64]
    flags: [job_mercenary]
  text: |
    รางถ่านสายที่{name}นั่งตู้หัวขบวนมาทั้งชีวิตการงาน ตอนนี้มีรางคู่วางขนาน ขบวนวิ่งวันละสามเที่ยว หุ่นยามยืนบนหลังคาตู้ทุกขบวน ยามที่เป็นคนเหลือขบวนละสองคน งานของสองคนนั้นคือเช็ดโคมแก้วบนหัวหุ่นตอนเถ้าเกาะ

    สำนักงานปลายรางส่งคนมาบอกว่าเที่ยวนี้เป็นเที่ยวสุดท้ายที่บริษัทจ้างคนเป็นหัวหน้าขบวน เที่ยวหน้าหุ่นตัวที่สามจะนั่งตู้หัวแทน บริษัทให้เงินก้อนหกเหรียญ กับนาฬิกาพกทองเหลืองที่สลักชื่อ{name}ไว้ที่ฝา สะกดผิดไปหนึ่งตัว

    ขบวนสุดท้ายออกจากปลายรางฝั่งเมืองตอนสาง ล้อกระทบรอยต่อรางทุกรอยแบบที่หลังของ{name}รู้จังหวะ ถึงปลายรางในแดนเถ้าตอนบ่าย ตรงที่ทุกขบวนต้องหยุดเติมน้ำ
  choices:
    - id: take_the_watch
      label: รับเงินก้อนกับนาฬิกา นั่งเกวียนกลับเมือง
      text: |
        {name}เช่าห้องชั้นบนของร้านขายตะปูใกล้ปลายรางฝั่งเมือง จากหน้าต่างเห็นขบวนออกทุกเช้า เสียงล้อลอยมาถึงก่อนเห็นควัน นาฬิกาพกเดินช้าวันละเท่าเวลาต้มน้ำกาหนึ่ง {name}ไม่เคยเอาไปให้ช่างแก้

        ทุกเที่ยวที่ขบวนกลับมาช้า {name}รู้ก่อนสำนักงานปลายราง เพราะนับเสียงล้อเป็น ยามรุ่นเช็ดโคมสองคนแวะมานั่งกินน้ำชาบนบันไดหน้าห้องทุกวันพัก ถามว่าโค้งไหนต้องระวัง
      effects: { gold: 6, location_tag: ventras, flags: [retired, took_the_company_watch] }
    - id: wipe_the_lamps
      label: ขอขึ้นขบวนต่อเป็นยามเช็ดโคม รับเงินเดือนครึ่งเดียว
      text: |
        งานเช็ดโคมไม่ต้องปีนบันได มีราวเหล็กให้เกาะไปตามหลังคาตู้ {name}เช็ดโคมแก้วบนหัวหุ่นวันละสามรอบ ระหว่างนั้นบอกช่างกิลด์หนุ่มที่นั่งตู้หลังว่าหมาเถ้าชอบตัดรางตรงไหน ช่วงไหนของเดือน ทางไหนลม

        ปลายฤดู ช่างหนุ่มปรับโคมหัวหุ่นตัวหน้าให้หันไปทางเนินตะวันตกทุกครั้งที่ขบวนผ่านทางแยกเถ้าแดง ตามที่{name}บอก ไม่มีขบวนไหนเสียตู้ท้ายอีกตลอดหนาว ในบัญชีบริษัทเขียนว่าหุ่นทำงานดีขึ้น
      effects: { stats: { WIS: 1 }, flags: [still_working, wiped_the_golem_lamps] }
    - id: open_a_guard_yard
      label: เช่าลานหลังโกดังในเวนทราส สอนยามให้พ่อค้าเกวียนที่จ้างหุ่นไม่ไหว
      text: |
        ลานที่เช่าได้อยู่หลังโกดังเกลือ พื้นเป็นดินอัด มีเสาไม้สามต้นไว้ฝึกยิง ค่าเช่าเดือนแรกสี่เหรียญ {name}จ่ายจากเงินก้อนของบริษัท พ่อค้าเกวียนเล็กส่งลูกชายหลานชายมาเรียนทีละสองสามคน เรียนดับตะเกียง เรียนนอนราบใต้ล้อ เรียนนับเสียงฝีเท้าในความมืด

        ปีแรกมีลูกศิษย์สิบเก้าคน ไม่มีใครถือปืนเวท ทุกคนถือปืนคาบศิลาของพ่อ {name}สอนให้ยิงขึ้นฟ้าก่อนหนึ่งนัดทุกครั้ง แล้วค่อยคิดว่าจะยิงนัดที่สองไปทางไหน
      effects: { gold: -4, location_tag: ventras, mark: เปิดลานฝึกยามเกวียน, flags: [still_working, opened_a_convoy_guard_yard] }
    - id: stay_at_the_curve
      label: ลงจากขบวนที่โค้งหิน แล้วไม่ขึ้นอีก
      requires: { flag: rail_village_pact }
      text: |
        คนแก่ที่ตกลงรหัสตะเกียงกับ{name}ตายไปเมื่อหนาวก่อน ลูกสาวของเขาเป็นคนจุดตะเกียงที่ปลายรางแทน นางให้{name}อยู่บ้านดินหลังสุดของหมู่บ้าน หลังที่หน้าต่างหันไปทางโค้งหิน

        ทุกคืนที่ขบวนผ่าน {name}นั่งนับตะเกียงที่ท้ายตู้สุดท้ายจากหน้าต่าง บอกเด็กๆ ว่าคืนนี้ลงไปที่โค้งได้หรือไม่ได้ เด็กในหมู่บ้านเรียก{name}ว่าคนนับไฟ ไม่มีใครในหมู่บ้านจำได้ว่าก่อนหน้านั้นเรียกอะไร
      effects: { location_tag: ashland, flags: [retired, settled_at_the_stone_curve] }

# ---------- นักลักลอบ ----------
- id: adult.career_smuggler_filled_canal
  stage: adult
  scene: market
  weight: 45
  when:
    age: [41, 48]
    flags: [job_smuggler]
  text: |
    ศาลาว่าการเวนทราสกำลังถมคลองเจ็ด เอาหินกับเถ้าจากโรงกลั่นมาเทลงทีละเรือ จะทำลานรางรถไฟ ร้านขายเชือกริมคลองปิดไปตั้งแต่ต้นฝน ห้องใต้ร้านมีน้ำขังถึงเข่า ท่อระบายน้ำที่เคยพาเด็กลอดใต้คลองไปออกท่าเก่า ตอนนี้ไปจบที่กำแพงอิฐใหม่ ปูนยังไม่แห้ง

    คืนนี้มีครอบครัวหนึ่งรออยู่ในห้องเช่าเหนือร้านซ่อมแหของ{name} พ่อ แม่ กับลูกสาวสามเดือนที่ตุ่มสองตุ่มเพิ่งดันผ้าห่อหัวขึ้นมา เรือที่จะไปฝั่งใต้ออกจากท่าเก่าก่อนสาง คนนำทางรุ่นหนุ่มสองคนนั่งยองๆ อยู่หน้าเตา ถามหาทางที่ไม่ต้องลอดใต้คลอง

    ทางหลังคายังมี แต่หลังคาไม่ใช่ทางของ{name}อีกแล้ว เข่าซ้ายบอกตั้งแต่ปีก่อน ตอนลงจากหลังคาโกดังเกลือแล้วต้องนั่งพักบนรางน้ำจนสาง ส่วนคนที่จำได้ว่าก่อนคลองเจ็ดจะมีตลิ่งหิน ใต้ดินแถวนั้นมีอะไรบ้าง ในเมืองนี้เหลืออยู่ไม่กี่คน
  choices:
    - id: clay_drain
      label: ไปหาท่อดินเผาเก่า ทางน้ำที่มีก่อนคลองจะมีตลิ่งหิน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ปากท่อดินเผาอยู่ใต้พื้นโรงฟอกหนังร้าง สมัยที่{name}ยังวิ่งส่งลังให้หนูท่า เคยมีคนเรือแก่ชี้ให้ดูครั้งเดียว ตอนนั้นไม่มีใครใช้แล้ว {name}คลานนำ ครอบครัวนั้นคลานตาม ท่อสูงแค่ศอกครึ่ง ดินเผาเย็นเฉียบ แม่อุ้มลูกไว้ใต้อก คลานด้วยศอกสองข้าง

          ท่อไปโผล่ที่ตลิ่งดินหลังท่าเก่า ห่างเรือสามสิบก้าว เด็กไม่ร้องตลอดทาง {name}คลานกลับมาคนเดียวตอนสาง ศอกถลอกทั้งสองข้าง แล้วเอาถ่านวาดทางลงบนพื้นห้อง ให้คนรุ่นหนุ่มลอกไปจำ
        effects: { stats: { INT: 1 }, reputation: { dock_rats: 1 }, flags: [found_the_clay_drain] }
      failure:
        text: |
          ปากท่อดินเผาใต้โรงฟอกหนังยังอยู่ แต่ลึกเข้าไปสามสิบช่วงตัว ท่อยุบ ดินเผาแตกทับกันแน่น {name}คลานถอยหลังออกมาทั้งทาง ครอบครัวนั้นคลานถอยตาม เด็กร้องจนแม่ต้องให้นมอุดปาก

          คนนำทางรุ่นหนุ่มพาครอบครัวนั้นออกทางหลังคาตอนตีสาม {name}นั่งรอที่ห้องจนได้ข่าวว่าเรือออกแล้ว ศอกกับเข่าถลอกจนต้องพันผ้าไปครึ่งเดือน
        effects: { hp: -2, flags: [clay_drain_had_fallen] }
    - id: through_the_rail_yard
      label: ห่อเด็กใส่ตะกร้าข้าว เดินผ่านลานรางเหมือนคนงานกะดึก
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          คนงานลานรางกะดึกมีสามร้อยคน ไม่มีใครรู้จักหน้ากันครบ {name}ใส่เสื้อหนังเปื้อนเถ้า แบกพลั่ว พ่อแม่เด็กเดินตามหลังหิ้วตะกร้า เด็กหลับอยู่ใต้ผ้าห่อขนมปัง ยามลานทักว่า{name}ไม่ใช่คนกะนี้ {name}บ่นเรื่องหัวหน้ากะที่ชอบเรียกคนแก่มาเติมตอนดึก บ่นยาวจนยามโบกมือไล่

          ลานรางไปสุดที่ตลิ่งดินหลังท่าเก่า เรือยังรออยู่ คนเรือรู้ว่าคนนำทางคนนี้ไม่เคยมาสาย
        effects: { stats: { CHA: 1 }, flags: [walked_through_the_rail_yard] }
      failure:
        text: |
          ยามลานรางคนนั้นเป็นคนท่าเรือ จำหน้า{name}ได้ตั้งแต่สมัยที่{name}ยังวิ่งบนหลังคา เขาไม่เรียกใคร เขาแบมือ

          {name}จ่ายห้าเหรียญ ครอบครัวนั้นผ่านไปถึงเรือ ยามคนนั้นตะโกนตามหลังมาว่าเที่ยวหน้าราคาเท่าเดิม แล้วบอกชื่อตัวเองไว้เผื่อ{name}ลืม
        effects: { gold: -5, flags: [paid_the_yard_watchman] }
    - id: send_the_young
      label: วาดทางหลังคาให้คนรุ่นหนุ่ม แล้วนั่งรอข้างเตา
      habit: cool_headed
      text: |
        {name}วาดทางหลังคาลงบนพื้นห้องด้วยถ่านจากเตา ชี้จุดที่กระเบื้องผุ จุดที่ต้องรอระฆังหอท่า แล้วผูกผ้าสองผืนให้ดูว่าต้องผูกเด็กไว้กับหลังอย่างไรให้หลุดยาก ทำซ้ำจนเด็กหนุ่มคนที่มือช้ากว่าผูกได้เอง

        {name}นั่งข้างเตาจนถ่านมอด ตีสี่ได้ยินเสียงเท้าบนหลังคาฝั่งตะวันออก เบาจนต้องกลั้นหายใจฟัง ตอนสางเด็กหนุ่มสองคนกลับมาพร้อมผ้าผูกเด็กที่ยังพับไม่เรียบร้อย
      effects: { reputation: { dock_rats: 1 }, flags: [sent_the_young_over_the_roofs] }
    - id: crickets_way
      label: ไปถามจิ้งหรีดว่านางเจอทางใหม่แล้วหรือยัง
      requires: { flag: taught_cricket }
      text: |
        จิ้งหรีดเจอทางใหม่ตั้งแต่สัปดาห์ที่ศาลาว่าการเริ่มถมคลอง นางไม่ได้บอกใครเพราะยังไม่มีใครถาม ทางของนางลอดใต้ลานรางไปตามร่องฐานรากที่คนงานยังไม่เททับ ต้องก้มตัวเดินผ่านตอนคนงานพักกินข้าวกลางดึก

        {name}เดินตามหลังนาง ครอบครัวนั้นเดินตามหลัง{name} ทั้งทางนางหันกลับมาสองครั้ง ครั้งแรกตอนเข่าของ{name}ลั่น ครั้งที่สองตอนถึงท่าเก่า ครั้งหลังนางไม่ได้ดูเข่า นางดูว่า{name}จำทางได้หรือยัง
      effects: { reputation: { dock_rats: 1 }, flags: [walked_crickets_new_way] }

- id: adult.career_smuggler_moth
  stage: adult
  scene: tavern
  weight: 45
  when:
    age: [49, 56]
    flags: [job_smuggler]
  text: |
    สองเที่ยวติดกันที่คนของศาสนจักรตะเกียงไปยืนรอที่ท่าเก่าก่อนเรือ เที่ยวแรกเรือหนีทัน เที่ยวที่สองไม่ทัน เด็กมีเขาสองคนไปอยู่ในโรงเลี้ยงของศาสนจักร คนนำทางรุ่นหนุ่มคนหนึ่งโดนตีจนหูซ้ายไม่ได้ยิน

    {name}ไม่ต้องสืบนาน ทางของสองเที่ยวนั้นมีคนรู้ห้าคน สี่คนรู้มาหลายปี คนที่ห้าคือแมงเม่า สาวอายุสิบเจ็ดที่{name}รับเข้ามาเองเมื่อต้นฝน เพราะนางวิ่งบนหลังคาได้เงียบ และเพราะนางเดินมาขอด้วยตัวเอง

    คืนนี้นางนั่งตรงข้าม{name}ในโรงเตี๊ยมหลังตลาดปลา {name}ยังไม่ทันถาม นางเล่าเอง แม่ของนางอยู่ในห้องขังใต้โบสถ์ตะเกียงมาตั้งแต่หน้าแล้ง นักบวชเสื้อขาวบอกนางว่าทุกทางที่เอามาบอก แม่จะได้กินข้าวอีกหนึ่งสัปดาห์ หนูท่ารู้เรื่องแล้ว คนของหนูท่าสองคนนั่งรออยู่โต๊ะข้างประตู
  choices:
    - id: give_her_to_the_rats
      label: ลุกไปบอกสองคนที่ข้างประตูว่านางเป็นของพวกเขา
      habit: cold_blood
      text: |
        {name}ลุกจากโต๊ะ เดินไปพูดกับชายสองคนข้างประตูประโยคเดียว แล้วออกจากโรงเตี๊ยมทางหลังร้าน แมงเม่าไม่ได้ร้องเรียก

        ตั้งแต่คืนนั้นไม่มีใครเห็นนางในย่านท่าเรืออีก หนูท่าส่งเด็กมาที่ห้องของ{name}เดือนละสองเที่ยวเหมือนเดิม ตลอดปีนั้นไม่มีเที่ยวไหนเจอคนยืนรอที่ท่าเก่า
      effects: { reputation: { dock_rats: 1 }, alignment: { moral: -1 }, flags: [gave_mangmao_to_the_rats] }
    - id: feed_false_routes
      label: ให้นางเอาทางปลอมไปบอกนักบวชต่อทุกสัปดาห์
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}วาดทางให้แมงเม่าทุกสัปดาห์ ซอยจริง ท่าจริง เวลาระฆังจริง แต่เป็นคืนที่ไม่มีเด็กคนไหนไป คนของศาสนจักรไปยืนรอที่ท่าร้างสามแห่งตลอดหน้าหนาว เด็กตัวจริงออกทางอื่นในคืนอื่น

          นักบวชเสื้อขาวเลิกเชื่อนางเมื่อปลายหนาว แต่ปล่อยแม่ของนางออกมาก่อนเลิก เพราะคนแก่ในห้องขังกินข้าวเปลือง สองแม่ลูกขึ้นเรือไปฝั่งใต้ในเที่ยวจริงเที่ยวแรกของหน้าฝน
        effects: { stats: { INT: 1 }, alignment: { law: -1 }, flags: [fed_the_lamp_false_routes] }
      failure:
        text: |
          ทางปลอมเที่ยวที่สามไปตรงกับซอยที่คนนำทางอีกสายใช้จริงในคืนเดียวกัน {name}ไม่รู้ว่ามีสายนั้นอยู่ คนของศาสนจักรได้เด็กไปอีกหนึ่งคน

          หนูท่าไม่ถามว่าใครวาดทางนั้น ตอนดึก ชายสองคนจากโต๊ะข้างประตูมาที่ห้องของ{name} ถามข้อเดียวว่าแมงเม่าอยู่ไหน แล้วบีบข้อมือ{name}จนกระดูกเล็กร้าว แมงเม่าไม่อยู่ที่ไหนที่{name}รู้จักอีกแล้ว
        effects: { hp: -2, reputation: { dock_rats: -1 }, flags: [mangmao_routes_went_wrong] }
    - id: buy_out_the_mother
      label: จ่ายผู้คุมห้องขังใต้โบสถ์ แลกแม่ของนางออกมา
      requires: { min_gold: 8 }
      text: |
        ผู้คุมห้องขังใต้โบสถ์ตะเกียงเป็นคนท่าเรือ ลูกชายเขาติดหนี้โต๊ะไพ่ในย่านที่{name}รู้จักทุกโต๊ะ ค่าตัวแม่ของแมงเม่าคือแปดเหรียญ กับคำสัญญาว่าหนี้ของลูกชายเขาจะหายไปจากสมุดเจ้ามือหนึ่งเล่ม

        แม่ของแมงเม่าออกมาทางประตูขนถ่านหลังโบสถ์ตอนตีสี่ ผอมจนผ้าคลุมหัวหลวม สองแม่ลูกลงเรือไปฝั่งใต้คืนเดียวกัน แมงเม่าก้าวลงเรือแล้วหันกลับมาที่สะพานท่า ยื่นผ้าพันคอของตัวเองให้{name} ผืนเดียวที่นางมี
      effects: { gold: -8, alignment: { moral: 1 }, people: [{ id: mangmao, name: แมงเม่า, gender: f, bond: friend, closeness: 1, age: 17 }], flags: [bought_out_mangmaos_mother] }
    - id: crickets_answer
      label: ส่งเรื่องให้จิ้งหรีดตัดสิน
      requires: { flag: taught_cricket }
      text: |
        จิ้งหรีดยืนฟังจนจบโดยไม่นั่ง แล้วถามแมงเม่าข้อเดียว ว่าห้องขังของแม่อยู่ใต้ปีกไหนของโบสถ์ แมงเม่าตอบได้ จิ้งหรีดออกทางหน้าต่างหลังโรงเตี๊ยมก่อนไส้ตะเกียงบนโต๊ะจะสั้นลงหนึ่งข้อนิ้ว

        สามคืนต่อมา หญิงผอมคนหนึ่งลงเรือไปฝั่งใต้พร้อมเด็กมีเขาสามคนกับแมงเม่า โบสถ์ตะเกียงประกาศว่ามีคนลอดรางน้ำหลังคาปีกตะวันตกเข้าไปในห้องขัง ไม่มีใครในย่านท่าเรือเชื่อว่าคนลอดรางน้ำแคบขนาดนั้นได้ ตอนสาง{name}ได้ยินเสียงเคาะประตูห้อง สามครั้ง เว้น สองครั้ง
      effects: { reputation: { dock_rats: 1 }, flags: [cricket_took_the_mother_out] }

- id: adult.career_smuggler_chalk_board
  stage: adult
  scene: home
  weight: 45
  mark: ลบชื่อจากกระดาน
  when:
    age: [57, 64]
    flags: [job_smuggler]
  text: |
    กระดานดำของคนนำทางแขวนอยู่บนผนังห้องเหนือร้านซ่อมแห ชื่อเขียนด้วยปูนขาวเรียงลงมา ชื่อที่ขีดฆ่ามีมากกว่าชื่อที่เหลือ ชื่อบนสุดที่ยังไม่ขีดเป็นชื่อของ{name} ใต้ลงมาอีกเจ็ดชื่อ ลายมือคนละคน

    บันไดขึ้นห้องมีสิบสี่ขั้น หนาวนี้{name}ต้องหยุดพักสองครั้ง คนนำทางรุ่นหนุ่มเลิกนัดกันที่ห้องนี้ทุกคืน เปลี่ยนมาคืนเว้นคืน ไม่มีใครบอกว่าทำไม เมื่อคืนคนหนึ่งในนั้นนั่งนับแท่งปูนขาวในกล่อง แล้วถามขึ้นมาลอยๆ ว่าวันหน้าชื่อไหนจะอยู่บนสุด

    ทุกชื่อที่หายไปจากกระดานนี้ หายด้วยเส้นขีดทับ ยังไม่เคยมีใครเอาผ้าเปียกลบชื่อตัวเองออกด้วยมือตัวเองสักคน
  choices:
    - id: wipe_own_name
      label: เอาผ้าเปียกลบชื่อตัวเองออก แล้วคืนกุญแจห้อง
      text: |
        {name}ลบช้าๆ ทีละตัวอักษร ปูนขาวละลายเป็นน้ำขุ่นไหลลงไปถึงชื่อที่สอง เด็กหนุ่มคนที่ถามเมื่อคืนเอาแขนเสื้อซับไว้ไม่ให้ชื่อนั้นเลอะ แล้วเลื่อนทุกชื่อขึ้นไปหนึ่งบรรทัดด้วยลายมือตัวเอง

        {name}ย้ายไปเช่าห้องเหนือร้านขายน้ำมันตะเกียงต้นน้ำ ไกลจากท่าเรือครึ่งวันเดิน ไม่มีใครเคาะประตูห้องนั้นสามครั้ง เว้น สองครั้ง {name}ยังตื่นตีสี่ทุกคืนอยู่หลายเดือน
      effects: { flags: [retired, wiped_own_name_off_the_board] }
    - id: room_to_cricket
      label: ยกห้องกับกระดานให้จิ้งหรีด
      requires: { flag: taught_cricket }
      text: |
        จิ้งหรีดรับกุญแจใส่กระเป๋าเสื้อเหมือนรับเหรียญทอน นางไม่ลบชื่อของ{name} ไม่ขีดทับ นางเอามีดสลักชื่อนั้นลงบนกรอบไม้ของกระดาน ตรงมุมบนซ้าย ตัวเล็กเท่าเล็บมือ แล้วเริ่มเขียนชื่อตัวเองด้วยปูนขาวไว้บนสุด

        {name}ย้ายไปอยู่ห้องชั้นล่างของร้านซ่อมแหเดียวกัน เดือนละสองสามครั้ง ตีสี่ ได้ยินเสียงเท้าเบาๆ บนบันไดที่ไม่มีขั้นไหนลั่น
      effects: { reputation: { dock_rats: 1 }, flags: [retired, gave_the_board_to_cricket] }
    - id: one_trip_a_month
      label: ไม่ลบ คุมทางเองเดือนละเที่ยว จนกว่าบันไดจะไม่ยอม
      text: |
        เดือนละเที่ยว เลือกคืนที่ฝนไม่ตก เลือกทางที่ไม่ต้องปีน {name}เดินช้าลง จึงเลือกครอบครัวที่มีคนแก่หรือเด็กเล็ก ครอบครัวที่คนนำทางรุ่นหนุ่มพาไปแล้วต้องรอ

        หนาวนั้นมีเด็กออกจากเมืองทางของ{name}สิบเอ็ดคน ทุกคนไปถึงเรือ ชื่อบนสุดของกระดานยังไม่มีเส้นขีดทับ
      effects: { stats: { CON: 1 }, flags: [still_working, one_trip_a_month] }
    - id: sail_south
      label: ขึ้นเรือไปฝั่งใต้กับเด็กเที่ยวสุดท้ายของปี
      text: |
        {name}นั่งท้ายเรือกับเด็กมีเขาสี่คน คลื่นแรงตลอดสามวัน เด็กอาเจียนทุกคน {name}อาเจียนด้วย อ่าวที่เรือเข้าเทียบมีบ้านหลังคาจากเรียงตามหาด คนที่ออกมารับที่สะพานท่าครึ่งหนึ่งมีเขา บางคนปลายเขาเริ่มสึกแล้ว

        หญิงคนหนึ่งในนั้นจำ{name}ได้ นางเคยนั่งรอเรืออยู่ในห้องใต้ร้านเชือกเมื่อนานมาแล้ว นางพา{name}ไปอยู่ห้องหลังบ้าน หน้าต่างเปิดออกไปทางทะเล ทุกปลายปี{name}ยืนนับเด็กที่ก้าวลงจากเรือเที่ยวสุดท้าย
      effects: { flags: [retired, sailed_south_with_the_children] }

# ---------- สายลับธนาคาร ----------
- id: adult.career_bankspy_seric
  stage: adult
  scene: market
  weight: 45
  when:
    age: [41, 48]
    flags: [job_bank_spy]
  text: |
    ปีนี้{name}ต้องซื้อแว่นขยายด้ามกระดูกจากร้านช่างแว่นหลังธนาคาร ไว้อ่านตัวเลขเล็กในสมุดหนี้ มองข้ามถนนไปแล้วหน้าคนอีกฝั่งเหลือแค่วงสีเนื้อ ห้องใต้ดินยังส่งซองครั่งดำมาให้ทุกเดือนเหมือนเดิม คนที่ตาไม่ดีแล้วยังเฝ้าคนเฝ้าด้วยกันได้ เพราะคนเฝ้าด้วยกันไม่ระวัง{name}

    ซองเดือนนี้มีชื่อเซริค คนเฝ้าอายุยี่สิบสามที่{name}สอนงานมาเองสองปี รายงานของเขาสามเดือนหลังเรื่องครอบครัวช่างปั้นหม้อในซอยคลองหก ลูกหนี้สัญญากู้เงินสร้างเตาเผา เขียนเหมือนกันทุกเดือนแทบทุกคำ เตายังเผาทุกวัน ลูกหนี้ยังขายของได้ ไม่มีอะไรน่าห่วง

    {name}ไปยืนที่ปากซอยคลองหกสามเช้าติดกัน ตามองไม่ถึงเตาเผา แต่จมูกยังดีเท่าเดิม ไม่มีกลิ่นดินสุกลอยมาสักเช้า สายวันที่สาม เซริคเดินผ่านปากซอยไปส่งรายงาน ไม่เห็น{name}ที่ยืนอยู่ในเงาซุ้มประตู
  choices:
    - id: report_seric
      label: เขียนรายงานตามที่จมูกบอก ส่งคืนในซองครั่งดำ
      text: |
        {name}เขียนครึ่งหน้า สามเช้า ไม่มีควัน ไม่มีกลิ่น รายงานของเซริคสามเดือนเหมือนกันทุกคำ ส่งคืนห้องใต้ดินพร้อมซอง ห้องใต้ดินจ่ายหกเหรียญ

        เดือนต่อมาประตูโรงเตาในซอยคลองหกมีตราตาชั่งสองชั้นตอกติดไว้ เซริคย้ายไปนั่งนับเหรียญในห้องใต้ดิน โต๊ะของเขาอยู่ใต้บันได ห่างจากโต๊ะของ{name}สิบก้าว เขาไม่เงยหน้าขึ้นเวลา{name}เดินผ่าน
      effects: { gold: 6, reputation: { belek_bank: 1 }, alignment: { law: 1 }, flags: [reported_seric] }
    - id: ask_seric_why
      label: นั่งรอเซริคที่โต๊ะในโรงเตี๊ยม ถามเขาตรงๆ
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เซริคไม่เถียง เขาเล่าว่าช่างปั้นหม้อมีลูกห้าคน คนโตเพิ่งสิบขวบ เตาร้าวตั้งแต่ต้นฝน ไม่มีเงินก็ซ่อมไม่ได้ ไม่ได้เผาก็ไม่มีเงิน {name}ฟังจนจบ แล้วสอนเรื่องเดียวที่ห้องใต้ดินไม่เคยสอน ว่ารายงานที่เขียนเหมือนกันทุกเดือนคือรายงานที่คนอ่านจับได้ก่อนเล่มอื่น

          รายงานของเซริคเดือนต่อมาเขียนว่าเตาร้าว ช่างกำลังหาเงินซ่อม ห้องใต้ดินขยายเวลาให้สองเดือน ตามระเบียบลูกหนี้ที่ยังมีของค้ำ ปลายหนาวมีควันขึ้นจากซอยคลองหกอีกครั้ง {name}ได้กลิ่นจากปากซอย
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, people: [{ id: seric, name: เซริค, gender: m, bond: friend, closeness: 1, age: 23 }], flags: [taught_seric_to_report_true] }
      failure:
        text: |
          เซริครู้ทันทีว่าทำไม{name}มานั่งโต๊ะนี้ เขาลุกขึ้นก่อนชาจะมา ลืมหมวกไว้บนเก้าอี้ คืนนั้นเขาไปบอกช่างปั้นหม้อให้หนี

          ครอบครัวช่างปั้นหม้อออกจากเมืองก่อนสาง ทิ้งเตาร้าวกับหม้อดิบไว้เต็มลาน ห้องใต้ดินส่งซองชื่อเซริคออกไปอีกซอง คราวนี้ไม่ได้ส่งถึง{name} หมวกใบนั้นยังแขวนอยู่ที่ตะขอหลังประตูห้องของ{name}
        effects: { reputation: { belek_bank: -1 }, flags: [seric_ran_with_the_potters] }
    - id: hear_him_out
      label: เลิกใช้ตา ตามเซริคด้วยหูไปจนถึงบ้านช่างปั้นหม้อ
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}เดินห่างเซริคครึ่งถนน ฟังเสียงส้นรองเท้าเขาเหยียบหินปูถนน ส้นซ้ายสึกกว่าข้างขวา เสียงจึงไม่เท่ากัน เสียงนั้นเลี้ยวเข้าซอยคลองหก หยุดหน้าประตูบ้านหลังที่สาม แล้วมีเสียงเด็กหลายคนวิ่งออกมารับ เรียกเขาด้วยชื่อเล่น

          {name}ยืนฟังอยู่หลังกำแพงจนได้ยินเสียงเหรียญวางบนโต๊ะไม้ห้าเหรียญ เซริคจ่ายดอกเงินกู้เตาเผาด้วยเงินเดือนตัวเองมาสามเดือน รายงานที่{name}ส่งคืนห้องใต้ดินเขียนว่าลูกหนี้ซอยคลองหกจ่ายดอกครบทุกเดือน ข้อนั้นเป็นความจริง
        effects: { stats: { WIS: 1 }, alignment: { law: -1 }, flags: [heard_seric_pay_the_potter] }
      failure:
        text: |
          ถนนตลาดตอนสายมีเสียงส้นรองเท้าเป็นร้อยคู่ {name}ตามผิดเสียงไปสองซอย จนไปจบที่หน้าร้านขายปลาเค็ม ส่วนเซริคหายไปในทางที่ไม่รู้ ขากลับ{name}ก้าวพลาดขอบรางน้ำ ข้อเท้าพลิก

          ต้องเดินกะเผลกกลับห้องใต้ดิน รายงานเดือนนั้นของ{name}เขียนได้แค่ว่ายังไม่มีอะไรยืนยัน ห้องใต้ดินส่งซองชื่อเซริคมาให้ซ้ำในเดือนต่อมา
        effects: { hp: -2, flags: [lost_seric_in_the_market] }
    - id: pour_tea_for_seric
      label: สั่งชาเพิ่มอีกถ้วย แล้วเลื่อนซองที่ยังไม่แกะไปวางข้างถ้วยของเซริค
      requires: { flag: grey_man_owes_you }
      text: |
        {name}ทำแบบที่คาเดล แทลเลสเคยทำที่โต๊ะนี้ ไม่เอ่ยชื่อใคร พูดแค่ชื่อซอยคลองหก เซริคอ่านชื่อบนหน้าซองโดยไม่แตะ แล้วนั่งอยู่ตรงนั้นจนชาถ้วยที่สองเย็น

        รายงานที่{name}ส่งคืนห้องใต้ดินเขียนว่าคนในซองไม่มีอะไรผิดปกติ สิ้นเดือน{name}ไปร้านรับจำนำหลังตลาดปลา ไขตู้ฝากของด้วยกุญแจทองเหลืองดอกเดิม แล้วเขียนชื่อเซริคต่อท้ายรายชื่อคนเฝ้าที่อยู่ในตู้ ไว้ใต้บรรทัดที่สิบเก้า
      effects: { alignment: { moral: 1, law: -1 }, flags: [poured_tea_for_seric] }

- id: adult.career_bankspy_wrong_name
  stage: adult
  scene: belek_bank
  weight: 45
  when:
    age: [49, 56]
    flags: [job_bank_spy]
  text: |
    ปีนี้สัญญาฟ้าหน้าครบกำหนดพร้อมกันหลายสิบฉบับ โรงกลั่นเล็กสามโรงริมแม่น้ำจ่ายดอกไม่ไหว ห้องใต้ดินส่งงานยึดลงมาเป็นปึก {name}นั่งโต๊ะหัวแถวของคนเฝ้าห้าคน ใบยึดทุกใบต้องผ่านลายมือของ{name}ก่อนขึ้นห้องบน

    เดือนก่อน คนเฝ้าในแถวชื่อยาเดลเขียนชื่อลูกหนี้ไว้ครบ เขียนชื่อถนนไว้ครบ ไม่ได้เขียนเลขบ้าน ถนนเส้นนั้นมีชายชื่อเดียวกันสองคน คนหนึ่งเป็นเจ้าของโรงกลั่นเล็กที่กู้สัญญาฟ้าหน้า อีกคนขายน้ำมันตะเกียงมาทั้งชีวิตโดยไม่เคยกู้เงินใคร ห้องบนยึดร้านน้ำมันไปแล้ว ขายทอดตลาดไปเมื่อวานซืน {name}ลงชื่อในใบยึดใบนั้นเอง ตอนตาล้า กลางปึกที่สูงเท่าศอก

    ชายแก่ขายน้ำมันมานั่งบนบันไดหน้าธนาคารเบเลคทุกเช้า ถือใบรับซื้อน้ำมันเก่าปึกหนึ่งไว้บนตัก ยามไล่ก็ลุกไปนั่งขั้นที่ต่ำลงมาหนึ่งขั้น ยาเดลยืนอยู่หน้าโต๊ะของ{name} รอฟังว่าตัวเองจะได้อยู่หรือต้องไป
  choices:
    - id: let_it_stand
      label: ส่งบันทึกขึ้นห้องบนว่าใบยึดลงชื่อครบ ไม่มีข้อผิด
      habit: cold_blood
      text: |
        {name}เขียนบันทึกสั้นๆ ส่งห้องบน ว่าใบยึดลงชื่อครบสองลายมือ ถูกแบบทุกช่อง ยาเดลได้อยู่ต่อ ห้องบนไม่ถามอะไรเพิ่ม

        ชายแก่มานั่งบันไดหน้าธนาคารอีกสิบเอ็ดเช้า เช้าที่สิบสองขั้นนั้นว่าง เหลือใบรับซื้อน้ำมันใบหนึ่งติดอยู่ในร่องหิน ลมพัดไม่ออก
      effects: { alignment: { law: 1, moral: -1 }, reputation: { belek_bank: 1 }, flags: [let_the_wrong_seizure_stand] }
    - id: find_the_right_debtor
      label: ตามหาลูกหนี้ตัวจริงก่อนห้องบนจะปิดบัญชี
      check: { stat: INT, dc: 14 }
      success:
        text: |
          ชายชื่อเดียวกันอีกคนขายเครื่องกลั่นไปครึ่งโรงให้ช่างคนแคระเมื่อปลายเดือนก่อน แล้วเอาเงินไปซ่อนในชื่อเมีย {name}อ่านใบขายของช่างคนแคระผ่านแว่นขยายทีละบรรทัด จนเจอน้ำหนักทองแดงที่ไม่ตรงกับเครื่องจริงครึ่งหนึ่ง ห้องบนยึดเงินก้อนนั้นคืนได้เกินค่าร้านน้ำมันสองเท่า

          ร้านน้ำมันตะเกียงกลับไปเป็นของเจ้าของเดิมในเดือนเดียวกัน คนที่ประมูลได้รับเงินคืนพร้อมดอก ชายแก่กลับไปนั่งหลังตู้ไม้ในร้าน ตะเกียงทุกดวงที่แขวนขายไม่ได้จุดสักดวงอยู่หลายคืน จนเขาแน่ใจว่าไม่มีใครมาเอาไปอีก
        effects: { stats: { INT: 1 }, reputation: { belek_bank: 1 }, flags: [found_the_right_debtor] }
      failure:
        text: |
          ชายชื่อเดียวกันอีกคนขึ้นเรือเหาะไปทางเหนือตั้งแต่สามวันก่อน {name}ตามเอกสารไปถึงหอท่า เจอแค่ใบรายชื่อผู้โดยสารที่สะกดชื่อเขาผิดไปอีกแบบ ห้องบนแจ้งลงมาว่าเรื่องนี้ปิดแล้ว และถามว่าทำไมแถวของ{name}ยังเปิดเรื่องนี้อยู่

          สิ้นเดือน ค่าจ้างของ{name}หายไปสามเหรียญ ในซองมีกระดาษแผ่นเล็กบอกว่าเป็นค่าเวลาของห้องบน
        effects: { gold: -3, reputation: { belek_bank: -1 }, flags: [chased_the_wrong_name] }
    - id: buy_back_the_shop
      label: ใช้เงินตัวเองซื้อร้านคืนจากคนที่ประมูลได้
      requires: { min_gold: 8 }
      text: |
        คนที่ประมูลได้เป็นพ่อค้าถ่าน ซื้อร้านไว้ทำโกดัง เขาขายคืนให้{name}แปดเหรียญ กำไรสองเหรียญจากที่จ่ายไปเมื่อวานซืน ไม่ถามว่าทำไม {name}เอากุญแจร้านไปวางบนบันไดหน้าธนาคาร ข้างปึกใบรับซื้อน้ำมัน แล้วเดินเข้าธนาคารไปทำงานโดยไม่หยุด

        ยาเดลได้อยู่ต่อ ตั้งแต่วันนั้นเขาเขียนเลขบ้านต่อท้ายชื่อลูกหนี้ทุกชื่อ แม้แต่ลูกหนี้ที่อยู่บ้านเดียวโดดๆ กลางทุ่ง
      effects: { gold: -8, alignment: { moral: 1 }, flags: [bought_back_the_lamp_shop] }
    - id: west_gate_at_dawn
      label: ไปยืนรอที่ประตูตะวันตกตอนสาง ข้างฝูงแพะ
      requires: { flag: warned_the_cooper }
      text: |
        {name}รู้ว่าลูกหนี้ของเบเลคออกจากเมืองทางไหนมาตั้งแต่ปีที่ช่างทำถังไม้หนีหนี้ เช้าที่สามที่ไปยืนรอ ชายชื่อเดียวกันอีกคนเดินมาที่ประตูตะวันตก หิ้วหีบหนังหนักจนไหล่เอียง ยืนรวมกับฝูงแพะ คนเลี้ยงแพะที่หลังค่อมแล้วหันมาเห็น{name} แล้วหยุดต้อนแพะ

        {name}ไม่ต้องเรียกยาม ชายคนนั้นเห็นแผ่นทองเหลืองที่ปกเสื้อของ{name}ก็วางหีบลงเอง เงินในหีบพอสำหรับหนี้สัญญาฟ้าหน้าและค่าร้านน้ำมันคืน ฝูงแพะออกประตูไปตามเวลา ช้ากว่าทุกวันนิดเดียว คนเลี้ยงแพะไม่หันกลับมาอีก
      effects: { reputation: { belek_bank: 1 }, alignment: { law: 1 }, flags: [stopped_the_debtor_at_the_west_gate] }

- id: adult.career_bankspy_brass_plate
  stage: adult
  scene: belek_bank
  weight: 45
  mark: คืนแผ่นทองเหลือง
  when:
    age: [57, 64]
    flags: [job_bank_spy]
  text: |
    แผ่นทองเหลืองตราตาชั่งที่ติดปกเสื้อด้านในของ{name}สึกจนตาชั่งเหลือแต่รอยขีด ทุกวันนี้{name}ไม่ได้ใช้ตาเฝ้าใครแล้ว ใช้หู ใช้จมูก ใช้ความจำว่าใครเคยนั่งโต๊ะไหน ห้องใต้ดินรู้ และห้องใต้ดินมีธรรมเนียมเดียวสำหรับคนเฝ้าที่ตาไม่พอจะเฝ้า

    คืนแผ่นทองเหลืองที่โต๊ะหัวหน้าเสมียน แล้วสาบานต่อหน้ารูปปั้นเบเลคในห้องนับเงิน ว่าทุกอย่างที่เห็นมาจะไม่ออกจากปาก ธนาคารจ่ายเบี้ยเลี้ยงชีพตามจำนวนปีที่เฝ้า คนเฝ้าที่ไม่สาบาน ธนาคารไม่จ่าย และส่งคนเฝ้าคนใหม่มาเฝ้าแทน

    หัวหน้าเสมียนคนปัจจุบันเคยนั่งโต๊ะใต้บันไดตอนที่{name}นั่งโต๊ะหัวแถวแล้ว นางวางถาดทองเหลืองใบเล็กไว้ตรงหน้า{name} แล้วรอ ด้วยมือสองข้างประสานบนโต๊ะ
  choices:
    - id: swear_the_oath
      label: วางแผ่นลงถาด แล้วเดินไปสาบานต่อหน้าเบเลค
      text: |
        รูปปั้นเบเลคในห้องนับเงินถือตาชั่งสองมือ ตาชั่งข้างหนึ่งมีเหรียญเงินวางอยู่หนึ่งเหรียญเสมอ อีกข้างว่าง {name}สาบานตามถ้อยคำที่หัวหน้าเสมียนอ่านนำทีละวรรค ถ้อยคำไม่ยาว จบก่อนเทียนบนโต๊ะจะหยดน้ำตาเทียนลงสักหยด

        เบี้ยเลี้ยงชีพมาในซองครั่งแดงทุกต้นเดือน ซองแรกมีหกเหรียญ {name}ยังไปนั่งโต๊ะเดิมในโรงเตี๊ยมทุกเช้า โต๊ะมุมตรงข้ามมีคนหนุ่มเสื้อเทาสั่งชาถ้วยเดียวทุกเช้าเหมือนกัน {name}ไม่เคยถามชื่อเขา
      effects: { gold: 6, alignment: { law: 1 }, flags: [retired, swore_the_bank_silence] }
    - id: keep_the_plate
      label: ขอเฝ้าต่อ บอกนางว่าหูยังฟังได้ชัดกว่าตาของคนหนุ่ม
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          หัวหน้าเสมียนให้{name}ไปนั่งโรงน้ำชาหน้าหอท่าเรือเหาะหนึ่งสัปดาห์ ไม่ต้องดูใคร ให้ฟัง {name}กลับมาพร้อมรายชื่อคนสามคนที่คุยเรื่องขนเงินขึ้นเรือเหาะไปทางเหนือ กับเวลาเรือออกที่ไม่ตรงกับตารางของหอท่า

          นางเก็บถาดทองเหลืองเข้าลิ้นชัก ห้องใต้ดินมีคนเฝ้าที่ไม่ใช้ตาเป็นคนแรก ซองครั่งดำที่ส่งถึง{name}ทุกเดือนหลังจากนั้น ข้างในไม่มีชื่อคน มีแต่ชื่อร้านน้ำชา
        effects: { stats: { WIS: 1 }, mark: คนเฝ้าที่ใช้หู, flags: [still_working, watched_by_ear] }
      failure:
        text: |
          หัวหน้าเสมียนให้{name}ลองฟังหนึ่งสัปดาห์ที่โรงน้ำชาหน้าหอท่า {name}ได้ยินชื่อคนเยอะ แต่จับคู่ชื่อกับเสียงไม่ได้สักคู่ รายงานที่ส่งคืนยาวสามหน้าแต่ไม่มีอะไรที่ห้องใต้ดินใช้ได้

          นางไม่ได้รับแผ่นทองเหลืองคืน ให้{name}นั่งคัดสมุดหนี้ในห้องใต้ดินแทน ได้เงินเดือนครึ่งเดียว แว่นขยายด้ามกระดูกวางอยู่ข้างสมุดตลอดวัน
        effects: { gold: -3, flags: [still_working, copied_ledgers_in_the_cellar] }
    - id: walk_out_with_the_goats
      label: ไม่คืนแผ่น เดินออกประตูตะวันตกตอนสางไปกับฝูงแพะ
      requires: { flag: warned_the_cooper }
      text: |
        คนเลี้ยงแพะที่ประตูตะวันตกเป็นคนใหม่ ลูกชายของคนเก่า เขาไม่ถามชื่อ{name} เหมือนพ่อเขาไม่เคยถามชื่อใคร ฝูงแพะพา{name}ออกไปตามทางดินทางตะวันตก สามวันถึงหมู่บ้านริมทุ่งที่ไม่มีธนาคาร มีแต่ยุ้งข้าว โรงสี กับคนเลี้ยงแพะอีกสองฝูง

        ห้องใต้ดินส่งคนมาเฝ้า{name}ที่หมู่บ้านนั้นสองครั้งในปีแรก แล้วเลิก แผ่นทองเหลืองที่ไม่ได้คืน เด็กในหมู่บ้านเอาไปปั่นเล่นบนลานนวดข้าว ไม่มีใครในหมู่บ้านรู้ว่าตาชั่งที่ลบจนเกือบหมดนั้นเป็นของใคร
      effects: { reputation: { belek_bank: -1 }, location_tag: arvel_village, flags: [retired, left_with_the_goatherd] }
    - id: name_the_envelopes
      label: วางแผ่นลงถาด แล้วบอกนางว่ารู้ว่าในลิ้นชักโต๊ะนี้มีซองชื่อใครบ้าง
      requires: { flag: read_the_watchers_drawer }
      text: |
        {name}ไล่ชื่อในลิ้นชักให้นางฟังเท่าที่จำได้ สิบสองชื่อ ไม่ผิดสักชื่อ ชื่อที่สิบสามเป็นชื่อของนางเอง ลงวันที่ไว้ตั้งแต่ปีที่นางได้แผ่นทองเหลืองแผ่นแรก หัวหน้าเสมียนไม่เปิดลิ้นชักดู นางเลื่อนถาดกลับเข้าไปใต้โต๊ะ

        ไม่มีใครพา{name}ไปห้องนับเงิน เบี้ยเลี้ยงชีพมาในซองครั่งแดงทุกต้นเดือน มากกว่าคนที่สาบานสองเหรียญ ตั้งแต่เดือนนั้นมีคนเดินตาม{name}ทุกวัน ห่างครึ่งถนนเสมอ เป็นคนที่{name}ไม่เคยเห็นหน้า และ{name}ไม่เคยหันไปดู
      effects: { gold: 8, alignment: { law: -1 }, flags: [retired, bargained_with_the_drawer] }

# ---------- นักต้มตุ๋น ----------
- id: adult.career_swindler_old_paper
  stage: adult
  scene: market
  weight: 45
  when:
    age: [41, 48]
    flags: [job_swindler]
  text: |
    หน้าของ{name}ใช้ไม่ได้แล้วในเวนทราสครึ่งเมือง ชื่อปลอมที่ยังไม่มีใครจับได้เหลือชื่อเดียว ชื่อนั้นนั่งคัดทะเบียนอยู่ในหอเอกสารของสภาขุนนางสามวันต่อสัปดาห์ รับเงินเดือนจริง แว่นกระจกเปล่าที่เคยใส่ปลอมตัว ตั้งแต่ปีก่อนต้องเปลี่ยนเป็นแว่นสายตาของจริง ตัวหนังสือในทะเบียนเล็กลงทุกปี

    เช้านี้แม่ค้าผักดองแก่ๆ คนหนึ่งเอากระดาษหุ้นมาวางบนโต๊ะคัดทะเบียน ถามว่าทุ่งจานรับดาวในใบนี้จดกับสภาจริงหรือเปล่า ตราหัวสิงห์ หมึกเลอะ กระดาษบางจนเห็นรอยนิ้วคนพิมพ์ ถ้อยคำบนกระดาษเป็นถ้อยคำที่{name}เขียนเองเมื่อนานมาแล้วทุกคำ ผิดอยู่ที่เดียว ทุ่งที่ระบุในใบนี้มีอยู่จริง เป็นทุ่งจานของโรงกลั่นตระกูลหนึ่งที่จ้างคนแคระคุมประตู

    แม่ค้าบอกว่าซื้อมาจากเด็กหนุ่มสามคนที่ตลาดปลา คนนำพูดเพราะเหมือนนักร้องโรงละคร ยังขายอยู่ทุกเช้า นางจ่ายไปสี่เหรียญ เงินเก็บทั้งหน้าแล้ง {name}รู้ว่าเจ้าของทุ่งตัวจริงจะได้ข่าวก่อนสิ้นสัปดาห์ และรู้ว่าคนที่โรงกลั่นแบบนั้นส่งออกมาตาม ไม่ได้พาใครไปศาล
  choices:
    - id: warn_the_crew
      label: ไปตลาดปลา ซื้อหุ้นจากพวกเขาหนึ่งใบ แล้วบอกว่าทุ่งนั้นเป็นของใคร
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ยืนฟังเด็กคนนำพูดจนจบแบบลูกค้า แล้วอ่านถ้อยคำบนกระดาษให้เขาฟังกลับ จังหวะเดียวกับที่เขาพูดเมื่อครู่ แต่หยุดหายใจตรงจุดที่ควรหยุด เด็กคนนำเลิกยิ้มตั้งแต่ประโยคที่สอง พอ{name}บอกชื่อเจ้าของทุ่ง เขาเก็บกระดาษเข้าห่อผ้าทั้งปึก

          ตกบ่าย แม่ค้าผักดองได้เงินคืนสี่เหรียญจากมือเด็กหนุ่มคนที่เดินช้าที่สุดในสามคน เด็กคนนำไม่มาตลาดปลาอีก สองเดือนต่อมา{name}ได้ยินเสียงเขาร้องเพลงอยู่ในโรงละครริมคลอง เป็นเสียงที่สามจากซ้าย
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [warned_the_young_crew] }
      failure:
        text: |
          เด็กคนนำหัวเราะ บอกว่าคนแก่ที่รู้มากขนาดนี้น่าจะขายเองมากกว่ามาสอน สี่วันต่อมาคนของโรงกลั่นมาที่ตลาดปลา ต้อนเด็กสามคนเข้าซอกหลังร้านปลาเค็ม เด็กคนนำชี้มือมาทาง{name}ที่ยืนอยู่ปากซอย บอกว่าคนนั้นเป็นคนเขียนกระดาษ

          ไม่ใช่คำโกหกทั้งหมด {name}เดินกะเผลกกลับบ้านเช่า ซี่โครงข้างซ้ายร้าวไปหนึ่งซี่ ชื่อนักคัดทะเบียนยังใช้ได้ เพราะคนของโรงกลั่นไม่รู้ว่าคนแก่ที่ปากซอยมีชื่ออื่น
        effects: { hp: -2, flags: [young_crew_pointed_at_you] }
    - id: school_them
      label: สอนพวกเขาให้ทำให้ถูก แล้วรับส่วนแบ่ง
      habit: sweet_tongue
      text: |
        {name}นั่งกับเด็กสามคนในโรงเตี๊ยมหลังตลาดปลาหนึ่งบ่าย เปลี่ยนชื่อทุ่งในหุ้นเป็นทุ่งที่ไม่มีใครเป็นเจ้าของเพราะไม่มีอยู่จริง เปลี่ยนร้านพิมพ์ เปลี่ยนตลาด สอนว่าต้องขายคนที่มีเงินพอจะเสียได้ ไม่ใช่แม่ค้าผักดอง

        ส่วนแบ่งมาถึงบ้านเช่าของ{name}ทุกปลายสัปดาห์จนครบหกเหรียญ ปลายเดือน{name}เห็นเด็กคนนำเดินผ่านหน้าหอเอกสาร ใส่เสื้อนอกตัวใหม่ ปกเสื้อตัดแบบเดียวกับที่{name}เคยใส่ตอนอายุเท่าเขา
      effects: { gold: 6, alignment: { moral: -1 }, flags: [schooled_the_young_crew] }
    - id: stamp_it_false
      label: ประทับตราหอเอกสารว่าไม่มีในทะเบียน แล้วคืนเงินแม่ค้าจากกระเป๋าตัวเอง
      text: |
        ตราของหอเอกสารเป็นตราไม้หัวทองเหลือง หนักมือ {name}ประทับลงบนกระดาษหุ้นตรงกลางตราหัวสิงห์ หมึกแดงทับถ้อยคำที่ตัวเองเขียน แล้วนับสี่เหรียญจากกระเป๋าใส่มือแม่ค้า บอกว่าสภามีเงินกองกลางไว้คืนคนที่โดนหลอกแบบนี้

        แม่ค้าผักดองเอากระดาษใบนั้นไปติดไว้ที่เสาแผงของตัวเองในตลาด หมึกแดงหันออกถนน หุ้นตราหัวสิงห์ขายในตลาดนั้นไม่ได้อีกเลย เด็กสามคนย้ายไปขายตลาดอื่น
      effects: { gold: -4, alignment: { law: 1, moral: 1 }, flags: [stamped_the_old_paper_false] }
    - id: nella_prints_a_notice
      label: เอากระดาษใบนั้นไปให้เนลลาดูที่ร้านพิมพ์หลังท่าเรือ
      requires: { flag: kept_nella_out }
      text: |
        เนลลาจับกระดาษขึ้นส่องหน้าต่างครั้งเดียวก็รู้ ตราหัวสิงห์ในใบนี้พิมพ์จากแม่พิมพ์ทองแดงอันเก่าของร้าน อันที่หายไปจากหีบหลังร้านตั้งแต่ต้นฝน นางไม่ถามว่าหุ้นใบนี้เกี่ยวกับ{name}อย่างไร นางเรียงตัวพิมพ์ใหม่ทั้งแผ่นแทน

        เช้าวันรุ่งขึ้น ประกาศแผ่นใหญ่ติดทุกเสาในตลาดปลา ตัวหนังสือสูงเท่านิ้วมือ ว่าหุ้นทุ่งจานตราหัวสิงห์ทุกใบปลอม ลงชื่อร้านพิมพ์หลังท่าเรือ เด็กสามคนหายไปจากตลาดก่อนเที่ยง ปลายสัปดาห์แม่พิมพ์ทองแดงอันนั้นกลับมาวางอยู่หน้าร้านพิมพ์ ห่อผ้าไว้อย่างดี
      effects: { alignment: { law: 1 }, flags: [nella_printed_the_warning] }

- id: adult.career_swindler_forged_line
  stage: adult
  scene: noble_hall
  weight: 45
  when:
    age: [49, 56]
    flags: [job_swindler]
  text: |
    ชื่อนักคัดทะเบียนของ{name}อยู่ในหอเอกสารสภาขุนนางมานานพอจะมีโต๊ะของตัวเองริมหน้าต่าง กับลูกมือหนึ่งคน เบลดา ลายมือดีที่สุดที่{name}เคยเห็น ดีกว่ามือของ{name}เองตอนหนุ่ม {name}สอนนางคัดทะเบียน สอนผสมหมึกกับเถ้าให้ดูเก่า ทั้งสองอย่างสอนที่โต๊ะเดียวกัน

    เช้านี้สภาส่งเชือกสายเลือดฉบับหนึ่งมาให้หอเอกสารรับรอง เจ้าของโรงกลั่นคนหนึ่งยื่นขอใช้นามตระกูลเก่าที่สูญไปแล้ว ฝ่ายที่ยื่นค้านเป็นหญิงซักผ้าในย่านคลอง ถือทะเบียนเกิดของยายทวดฉบับจริงมาด้วย มุมกระดาษขาด แต่ตรงกับเล่มของวิหารออสซาทุกบรรทัด

    {name}อ่านเชือกของเจ้าของโรงกลั่นแค่หน้าแรกก็รู้ว่าปลอม รู้ด้วยว่าใครเขียน หมึกผสมเถ้าแบบที่{name}สอน หางตัวอักษรตวัดแบบที่{name}แก้ให้เมื่อฤดูก่อน เบลดานั่งคัดทะเบียนอยู่โต๊ะถัดไป ไม่เงยหน้า สภาจะเรียกฟังคำรับรองของหอเอกสารพรุ่งนี้เช้า
  choices:
    - id: declare_forged
      label: รับรองต่อสภาว่าเชือกฉบับนั้นปลอม แล้วชี้ที่หมึก
      text: |
        {name}หยดน้ำส้มลงบนมุมกระดาษต่อหน้าสภา หมึกผสมเถ้าละลายเป็นสีน้ำตาล หมึกเก่าจริงไม่ละลาย ทนายของสภาจดตามทุกคำ ตกบ่ายคนของสภามาค้นโต๊ะเบลดา เจอหมึกผสมเถ้าครึ่งขวด นางไม่ปฏิเสธ และไม่บอกว่าใครสอน

        หอเอกสารปลดเบลดาก่อนค่ำ บนโต๊ะของนางเหลือขวดหมึกปิดจุกแน่น ข้างขวดเป็นปากกาด้ามกระดูกที่{name}ให้นางในวันแรก วางขนานกับขอบโต๊ะพอดี
      effects: { alignment: { law: 1 }, flags: [exposed_beldas_line] }
    - id: pass_it
      label: รับรองว่าเชือกฉบับนั้นถูกต้อง
      habit: cold_blood
      text: |
        {name}รับรองด้วยถ้อยคำมาตรฐานสามบรรทัด สภาไม่ถามเพิ่ม หญิงซักผ้าพับทะเบียนเกิดของยายทวดเก็บเข้าอกเสื้อ เดินออกจากห้องประชุมโดยไม่มองใคร

        ปลายสัปดาห์มีซองไม่ระบุชื่อวางอยู่ใต้ขวดหมึกบนโต๊ะของ{name} ข้างในมีแปดเหรียญ เบลดายังนั่งโต๊ะถัดไป ลายมือของนางสวยขึ้นทุกเดือน
      effects: { gold: 8, alignment: { moral: -1 }, flags: [passed_beldas_line] }
    - id: sink_it_quietly
      label: หาข้อบกพร่องที่ไม่ชี้กลับไปหาเบลดา
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}อ่านเชือกฉบับนั้นทั้งคืนใต้ตะเกียง จนเจอสิ่งที่ไม่เกี่ยวกับมือคนเขียน หน้าที่สามเป็นกระดาษจากโรงกระดาษริมแม่น้ำที่เพิ่งตั้งหลังปีที่ทะเบียนหน้านั้นอ้างไว้สามสิบปี ใครก็เขียนลงกระดาษแผ่นนั้นได้ ข้อบกพร่องอยู่ที่กระดาษ ไม่ได้อยู่ที่ลายมือ

          สภาตัดสินว่าเชือกฉบับนั้นไม่มีหลักฐานพอ หญิงซักผ้าได้นามตระกูลของยายทวดคืน ไม่มีใครค้นโต๊ะเบลดา บ่ายวันนั้นนางเอาขวดหมึกผสมเถ้าไปเททิ้งในรางน้ำหลังหอเอกสารเอง {name}เห็นจากหน้าต่าง
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [sank_beldas_line_quietly] }
      failure:
        text: |
          ทนายของเจ้าของโรงกลั่นยกบัญชีโรงกระดาษเล็กๆ อีกโรงที่เคยมีมาตั้งแต่สมัยนั้นขึ้นมาอ้าง ข้อโต้แย้งเรื่องกระดาษของ{name}จึงตกไป เชือกผ่าน เจ้าของโรงกลั่นได้นามตระกูล

          {name}เอาเงินห้าเหรียญไปให้หญิงซักผ้าที่ย่านคลอง บอกว่าเป็นค่ารับรองที่สภาคืนให้ฝ่ายแพ้ นางรับไว้โดยไม่ถามว่าสภาเคยคืนเงินใครตั้งแต่เมื่อไร
        effects: { gold: -5, flags: [beldas_line_passed_anyway] }
    - id: confess_the_garedos_line
      label: วางทะเบียนตระกูลกาเรดอสเล่มเก่าลงคู่กันต่อหน้าสภา
      requires: { flag: sold_a_title }
      text: |
        {name}เปิดทะเบียนหน้าที่ตัวเองเคยเติมชื่อปู่ของฮอบรันไว้ในช่องว่างของตระกูลกาเรดอส วางไว้ข้างเชือกของเบลดา ให้สภาเห็นว่าหมึกสองหน้านี้มาจากขวดสูตรเดียวกัน หน้าหนึ่งเขียนเมื่อนานมาแล้ว อีกหน้าหนึ่งเขียนเมื่อฤดูก่อน แล้วบอกว่าคนที่สอนสูตรนี้คือคนที่ยืนอยู่ตรงหน้าสภา

        สภาขีดทิ้งทั้งสองเชือกในวันเดียว ช่างแกะไม้มาถอดตรานกกระสาออกจากประตูบ้านฮอบรันทีละบาน สภาขีดชื่อนักคัดทะเบียนของ{name}ออกจากบัญชีเงินเดือน ไม่มีใครตามจับ เพราะชื่อนั้นไม่มีบ้าน ไม่มีญาติ ไม่มีวันเกิดอยู่ในทะเบียนเล่มไหน
      effects: { alignment: { law: 1, moral: 1 }, flags: [confessed_the_garedos_line] }

- id: adult.career_swindler_last_name
  stage: adult
  scene: temple
  weight: 45
  mark: ชื่อบนแผ่นหิน
  when:
    age: [57, 64]
    flags: [job_swindler]
  text: |
    ห้องทะเบียนของวิหารออสซาอยู่ใต้หลังคาต่ำ กลิ่นกระดาษเก่ากับขี้ผึ้ง คนเวนทราสที่อยู่มาจนผมขาวมาจดชื่อไว้ที่นี่ล่วงหน้า ชื่อที่จะสลักบนแผ่นหินเมื่อถึงวัน จ่ายสองเหรียญ จดครั้งเดียว แก้ไม่ได้

    {name}มีชื่อให้เลือกมากกว่าคนอื่นในแถว ชื่อนักคัดทะเบียนที่หอเอกสารสภาขุนนางรู้จัก ชื่อปลอมอีกหลายชื่อที่ใช้ไม่ได้แล้ว กับชื่อจริงที่ไม่ได้เขียนมานานจนต้องฝึกเขียนชื่อตัวเองใหม่บนเศษกระดาษเมื่อคืน มือสั่นจนตัวสุดท้ายไม่เหมือนตัวแรก

    นักบวชหญิงของออสซาจุ่มปากการออยู่ หลัง{name}ยังมีคนแก่ต่อแถวอีกห้าคน
  choices:
    - id: archivist_name
      label: จดชื่อนักคัดทะเบียน ชื่อที่สภาจ่ายเงินเดือนให้มาหลายปี
      requires: { not_flags: [confessed_the_garedos_line] }
      text: |
        นักบวชจดตามที่{name}สะกดให้ ช้าๆ ทีละตัว ชื่อนั้นมีบ้านเช่าหนึ่งหลัง มีเพื่อนบ้านที่ทักทุกเช้า มีเบี้ยหวัดจากหอเอกสารเดือนละสองเหรียญหลังวางมือ เพื่อนบ้านรู้ว่าคนชื่อนี้ชอบชาไม่ใส่น้ำตาล ไม่ชอบเสียงประตูปิดแรง

        {name}ออกจากหอเอกสารปลายฤดูนั้น เด็กๆ ในซอยเรียก{name}ด้วยชื่อที่จดไว้ ไม่มีใครในซอยรู้จักชื่ออื่น ร้านชาหัวซอยจดหนี้ค่าชาไว้ใต้ชื่อนั้นทุกเดือน และทุกเดือน{name}จ่ายครบ
      effects: { flags: [retired, kept_the_archivists_name] }
    - id: real_name
      label: จดชื่อจริง แล้วกลับไปหาที่ที่ชื่อนั้นยังมีคนจำ
      text: |
        นักบวชถามว่าสะกดอย่างไร {name}ต้องหยุดคิดตรงตัวที่สาม แล้วสะกดใหม่ให้ถูก ชื่อนั้นไม่ได้ออกจากปาก{name}มานานจนเสียงตัวเองฟังแปลกหู

        {name}ขึ้นเกวียนออกจากเวนทราสในสัปดาห์นั้น ไปจนถึงถิ่นที่โตมา คนแก่ที่นั่นเหลือสองสามคนที่จำชื่อนั้นได้ จำได้แค่ว่าเคยมีเด็กชื่อนี้วิ่งเล่นแถวบ่อน้ำ แล้วออกไปหางานในเมืองตั้งแต่ไหล่ยังไม่พ้นขอบบ่อ พวกเขาถามว่าทำงานอะไรมาทั้งชีวิต {name}ตอบว่าคัดลายมือ
      effects: { flags: [retired, took_back_the_real_name] }
    - id: letter_writer
      label: ไม่จด ออกไปตั้งโต๊ะรับเขียนจดหมายหน้าวิหาร
      text: |
        คนที่มาวิหารออสซาส่วนใหญ่เป็นคนแก่ ครึ่งหนึ่งเขียนหนังสือไม่ได้ ลูกหลานอยู่ไกล {name}รับเขียนจดหมายให้ฉบับละครึ่งเหรียญ เขียนตามที่เขาบอก แล้วเติมอีกนิด หลังคาที่รั่วกลายเป็นหลังคาที่เพิ่งซ่อม ไอทั้งหนาวกลายเป็นไอนิดหน่อยตอนเช้า

        ลูกหลานอ่านแล้วไม่ต้องรีบกลับมา คนแก่ไม่ได้ขอให้เติม แต่ไม่มีใครขอให้ลบ หนาวแรกมีคนมาต่อแถวหน้าโต๊ะของ{name}ยาวกว่าแถวในห้องทะเบียน
      effects: { stats: { CHA: 1 }, mark: คนเขียนจดหมายหน้าวิหาร, flags: [still_working, letter_writer_at_the_temple] }
    - id: isvels_stone
      label: บอกนักบวชให้เปิดดูก่อน ว่ามีใครจ่ายแทนไว้แล้วหรือยัง
      requires: { flag: widow_tea_friend }
      text: |
        นักบวชพลิกสมุดย้อนไปหลายเล่ม จนเจอบรรทัดหนึ่งในลายมือเก่า ท่านหญิงอิสเวลจ่ายค่าแผ่นหินไว้ให้ล่วงหน้าก่อนนางตายสองหนาว ชื่อที่นางให้จดเป็นชื่อที่{name}ใช้ตอนนั่งดื่มชากับนางทุกบ่าย ชื่อที่{name}แต่งขึ้นในวันแรก ข้างชื่อนางเขียนกำกับไว้อีกบรรทัด ว่าคนนี้โกหกเก่ง แต่รินชาให้คนแก่ไม่เคยหก

        {name}ไม่ได้จดชื่ออื่น ปลายเดือน{name}ย้ายไปเช่าห้องในถนนสายที่เคยเป็นย่านขุนนางเก่า หน้าต่างหันไปทางบ้านหลังปลายถนน บ่ายวันที่อากาศดี {name}ต้มชาสองถ้วย
      effects: { flags: [retired, isvel_paid_for_the_stone] }
