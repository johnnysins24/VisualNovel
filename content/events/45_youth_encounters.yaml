# การปะทะของวัยรุ่น 13–17 (ชุดแรก)
# ทุกเรื่องในไฟล์นี้เป็นการปะทะ (encounter) ไม่มี choices ตัวเลขของศัตรูอยู่ใน content/foes.yaml
# วัยนี้พลังชีวิตยังไม่ฟื้นเอง ศัตรูจึงเป็นระดับภัย 1 ถึง 2 และเกือบทุกเรื่องไม่เอาถึงตาย (deadly: false)
# ตายได้เรื่องเดียวในไฟล์นี้: youth.enc_winter_wolves (ทางพราน) ซึ่งมีทางหนีทุกจังหวะ
# {dad} {friend} เป็นบทที่ไม่มีก็ได้ ใช้ได้เฉพาะในวิธีที่มี ally

- id: youth.enc_sheepfold
  stage: youth
  weight: 20
  time: night
  mark: เฝ้าคอกแกะคืนหมาเถ้า
  cast:
    dad: { id: father, optional: true }
  when:
    age: [14, 17]
    location_tag: arvel_village
  text: |
    คืนที่สามหลังหิมะแรก แกะทั้งคอกยืนเบียดกันอยู่มุมเดียวโดยไม่มีตัวไหนร้อง

    {name}ถือตะเกียงออกมาดู คิดว่าจะเจอหมาจิ้งจอก ที่ขอบแสงมีจุดแดงสามจุดลอยอยู่สูงแค่เข่า สว่างขึ้นแล้วหรี่ลงพร้อมกันเป็นจังหวะเดียวกับลมหายใจ

    หน้าร้อนที่แล้วคนขับเกวียนถ่านแวะมาขอน้ำ แล้วเล่าเรื่องหมาที่ไม่มีขนกับไม่มีเสียงให้เด็กในหมู่บ้านฟัง ตอนนั้นทุกคนหัวเราะ ทางขนถ่านอยู่ห่างจากที่นี่ตั้งสองวันเดิน
  encounter:
    foe: ash_hound
    name: ฝูงหมาเถ้า
    deadly: false
    beats:
      - text: ทั้งสามตัวยังไม่เข้ามาในแสง เดินวนรอบคอกช้าๆ จมูกไล่ดมไปตามไม้รั้วทีละท่อน หนังของพวกมันดำและย่นเหมือนกระดาษที่ไหม้แล้วแต่ยังไม่แตก
        moves:
          - id: fold_look
            label: ชูตะเกียงขึ้นสูง ดูให้ออกว่าแสงแดงนั้นอยู่ตรงไหนของตัวมัน
            kind: read
            stat: WIS
            success: แสงแดงไม่ได้อยู่ที่ตา มันอยู่ลึกเข้าไประหว่างซี่โครง ก้อนเท่ากำปั้น สว่างทุกครั้งที่มันสูดลม ตัวที่โดนตะเกียงส่องตรงอกถอยกลับเข้าเงามืด เหมือนไม่ชอบให้ใครเห็นของข้างใน
            failure: "{name}มัวเพ่งจุดแดงตรงหน้า ตัวที่วนไปข้างหลังจึงเข้ามาถึงตัวก่อน เขี้ยวของมันครูดผ่านน่อง ร้อนเหมือนโดนคีมจากเตา"
          - id: fold_fork
            label: คว้าสามง่ามโกยฟาง แทงตัวที่ใกล้รั้วที่สุด
            kind: attack
            tags: [pierce]
          - id: fold_shout
            label: ตะโกนเรียกคนทั้งหมู่บ้าน
            kind: talk
            tags: [noise]
            success: เสียงของ{name}ดังไปถึงบ้านหลังสุดท้าย หมาตัวแรกในหมู่บ้านเริ่มเห่า แล้วตัวที่สอง ฝูงที่วนอยู่หยุดเดิน หันหัวไปทางเสียงเห่าพร้อมกันทั้งสามตัว
          - id: fold_bolt
            label: ถอยเข้าบ้านแล้วลงกลอน
            kind: flee
      - text: ตัวที่ผอมที่สุดมุดหัวเข้าใต้ไม้รั้วท่อนล่าง ไหล่มันคาอยู่ตรงนั้นครู่หนึ่ง แกะตัวหน้าสุดเริ่มร้อง
        answer: attack
        moves:
          - id: fold_pin
            label: แทงสามง่ามลงไปตอนที่มันยังคาอยู่ใต้รั้ว
            kind: attack
            tags: [pierce]
            success: ง่ามกลางเข้าระหว่างซี่โครงจนชนของแข็งและร้อน {name}กดด้ามลงทั้งตัว ถ่านก้อนหนึ่งหลุดออกมากลิ้งบนหิมะ ตัวที่คาอยู่ใต้รั้วยุบลงเป็นเถ้าเหมือนมีคนเตะกองไฟ
          - id: fold_block
            label: เอาตัวขวางช่องรั้ว ยันมันไว้ด้วยด้ามสามง่าม
            kind: guard
          - id: fold_dad
            label: ร้องเรียก{dad}ให้ออกมาช่วยยันรั้วอีกแรง
            kind: guard
            ally: dad
            success: "{dad}ออกมาทั้งที่ยังไม่ได้ใส่รองเท้า ถือขวานผ่าฟืนมาด้วย สองคนยันไม้รั้วท่อนล่างไว้คนละข้าง ตัวที่มุดอยู่ถอยหัวออกไปเองเมื่อดันไม่เข้า"
          - id: fold_bolt2
            label: ทิ้งคอกไว้ วิ่งกลับเข้าบ้าน
            kind: flee
      - text: ตัวหน้าฝูงย่อขาหลัง ไหล่ลดต่ำจนคางเกือบแตะหิมะ แสงในอกมันสว่างค้างอยู่อย่างนั้นโดยไม่หรี่ลง
        answer: quick
        moves:
          - id: fold_first
            label: ชิงแทงก่อนมันกระโจน
            kind: quick
            tags: [pierce]
            success: มันลอยขึ้นจากพื้นได้ครึ่งตัว ปลายสามง่ามก็ไปรออยู่ตรงอกแล้ว แรงกระโจนของมันเองทำงานที่เหลือ {name}โดนด้ามไม้กระแทกจนหงายหลัง แต่สิ่งที่ตกลงมาทับมีแต่เถ้าอุ่นๆ
            failure: "{name}แทงเร็วไปครึ่งจังหวะ ง่ามเสียบได้แต่อากาศ ตัวหน้าฝูงกระโจนข้ามด้ามไม้มาทั้งตัว กรงเล็บลากผ่านไหล่ ทิ้งรอยไหม้ไว้บนเสื้อสามเส้น"
          - id: fold_brace
            label: ปักด้ามสามง่ามยันพื้น ให้มันพุ่งเข้ามาเสียบเอง
            kind: guard
            tags: [pierce]
          - id: fold_clang
            label: ฟาดตะเกียงกับเสารั้วให้ดังที่สุด แล้วตะโกนไล่
            kind: talk
            tags: [noise]
          - id: fold_bolt3
            label: หันหลังวิ่งเข้าบ้าน
            kind: flee
      - text: หน้าต่างบ้านหลังถัดไปสว่างขึ้นหนึ่งบาน ฝูงที่เหลือได้ยินเสียงประตูเปิดแต่ยังไม่ถอย ตัวหนึ่งหันไปทางลูกแกะที่หลุดออกมานอกคอก
        answer: guard
        moves:
          - id: fold_lamb
            label: วิ่งไปยืนคร่อมลูกแกะไว้
            kind: guard
            success: "{name}ยืนคร่อมลูกแกะ สามง่ามชี้ต่ำ หมาเถ้าเดินเข้ามาจนเหลือสองก้าวแล้วหยุด แสงในอกมันสว่างขึ้นสองครั้ง หรี่ลงสองครั้ง ก่อนที่มันจะหันหัวกลับ"
          - id: fold_chase
            label: ไล่แทงตัวที่หันหลังให้
            kind: attack
            tags: [pierce]
          - id: fold_grab
            label: คว้าลูกแกะขึ้นมากอด ถอยไปชิดผนังคอก
            kind: quick
          - id: fold_bolt4
            label: ปล่อยลูกแกะไว้ วิ่งเข้าบ้าน
            kind: flee
    win:
      text: |
        ฝูงหมาเถ้าถอยกลับเข้าไปในความมืดทีละก้าว ไม่หันหลังให้จนพ้นแสง รอบคอกเหลือรอยเท้าที่ละลายหิมะลงไปจนเห็นดินดำ

        เช้าวันรุ่งขึ้นคนครึ่งหมู่บ้านมายืนดูรอยเท้าพวกนั้น ผู้ใหญ่บ้านนับแกะให้เองกับมือ ครบทุกตัว แล้วมอง{name}ด้วยสายตาแบบที่แกใช้มองคนที่จ่ายภาษีตรงเวลา
      effects: { stats: { STR: 1, CHA: 1 }, flags: [held_sheepfold] }
    lose:
      text: |
        {name}ล้มลงข้างรั้ว หิมะใต้แก้มเย็นจนชา แต่แขนกับขายังร้อนอยู่ทุกที่ที่โดนกัด เสียงสุดท้ายที่ได้ยินก่อนทุกอย่างมืดคือเสียงจอบกระทบกัน กับเสียงคนหลายคนตะโกนไล่

        ตอนลืมตาอีกทีก็นอนอยู่ข้างเตาในบ้าน แกะหายไปสี่ตัว คนที่แบก{name}เข้ามาบอกว่าหมาพวกนั้นไม่ได้กินแกะตรงนั้น มันคาบไปทั้งตัว ไม่มีเลือดสักหยดบนหิมะ
      effects: { flags: [sheepfold_lost] }
    stalemate:
      text: |
        คนทั้งหมู่บ้านออกมาพร้อมคบไฟ จอบ กับฝาหม้อที่เอามาเคาะ ฝูงหมาเถ้าถอยไปเองโดยไม่รีบ ตัวหน้าฝูงหยุดตรงขอบแสง หันมามองคอกแกะอีกครั้งเหมือนกำลังจำทาง

        คืนต่อมาทุกบ้านที่มีคอกผลัดเวรกันเฝ้าจนถึงวันหิมะละลาย {name}ได้เวรคืนแรก
      effects: { stats: { CON: 1 } }
    flee:
      text: |
        กลอนประตูลงทันก่อนกรงเล็บจะถึง {name}ยืนพิงบานประตู ฟังเสียงแกะร้องอยู่ข้างนอกจนเสียงนั้นเงียบไปเอง

        เช้ามาคอกเหลือแกะอยู่ครึ่งเดียว ที่ประตูบ้านมีรอยไหม้สี่เส้นสูงเท่าเอว ไม่มีใครในบ้านพูดถึงรอยนั้น แต่ก็ไม่มีใครขัดมันออก
      effects: { flags: [sheepfold_lost] }

- id: youth.enc_toll_boys
  stage: youth
  weight: 12
  scene: road
  when:
    age: [13, 16]
  text: |
    ทางลัดไปตลาดต้องข้ามสะพานไม้แผ่นเดียว วันนี้มีเด็กโตสามคนนั่งห้อยขาอยู่บนราวสะพาน คนตัวใหญ่ที่สุดกระโดดลงมายืนกลางแผ่นไม้ตอนที่{name}เดินมาถึงครึ่งทาง

    "ค่าข้าม" มันแบมือ "วันนี้เก็บสองเหรียญ พรุ่งนี้ยังไม่ได้คิด"

    ในกระเป๋าเสื้อของ{name}มีเงินที่ที่บ้านฝากมาซื้อเกลือ น้ำใต้สะพานลึกแค่เอว แต่เป็นน้ำหน้าหนาว
  encounter:
    foe: bandit
    name: เด็กโตเฝ้าสะพาน
    threat: 1
    morale: 2
    beats:
      - text: คนตัวใหญ่ก้าวเข้ามาจนแผ่นไม้ยวบ มือข้างหนึ่งยื่นมาจะคว้าคอเสื้อ อีกสองคนบนราวสะพานยังไม่ขยับ รอดูว่าเรื่องจะไปทางไหน
        answer: quick
        moves:
          - id: toll_duck
            label: มุดลอดใต้แขนมันแล้ววิ่งต่อ
            kind: quick
            success: "{name}ย่อตัวลอดใต้รักแร้มันไปได้ คนตัวใหญ่หมุนตามจนเท้าพันกันเอง ต้องคว้าราวสะพานไว้ไม่ให้ตกน้ำ สองคนข้างบนหัวเราะลั่น และไม่ได้หัวเราะ{name}"
          - id: toll_shove
            label: ผลักอกมันสุดแรง
            kind: attack
          - id: toll_talk
            label: บอกว่าเงินนี้เป็นของที่บ้าน แล้วถามว่าพ่อมันรู้ไหมว่ามาทำอะไรตรงนี้
            kind: talk
            parley: true
          - id: toll_back
            label: ถอยกลับไปทางเดิม ยอมเดินอ้อมไปอีกครึ่งชั่วยาม
            kind: flee
      - text: คนตัวใหญ่หน้าแดงขึ้นมาถึงหู มันกำหมัดแล้วง้างไปข้างหลังไกลเกินจำเป็น แบบคนที่เคยเห็นผู้ใหญ่ชกกันแต่ยังไม่เคยชกเอง
        answer: guard
        moves:
          - id: toll_take
            label: ยกแขนกันหน้า ยืนให้มั่น รับหมัดนั้นไว้
            kind: guard
            success: หมัดลงบนท่อนแขนของ{name}เต็มแรง เจ็บ แต่{name}ไม่ถอยสักก้าว คนตัวใหญ่สะบัดมือตัวเองสองที มองข้อนิ้วที่ถลอก แล้วมองหน้า{name}ใหม่อีกรอบ
          - id: toll_trip
            label: เกี่ยวขามันตอนที่มันเหวี่ยงหมัดจนเสียหลัก
            kind: quick
          - id: toll_swing
            label: ชกสวนเข้าที่ท้อง
            kind: attack
          - id: toll_jump
            label: กระโดดลงน้ำ ลุยข้ามไปเอง
            kind: flee
    win:
      text: |
        คนตัวใหญ่ยืนหอบเกาะราวสะพาน ไม่ยื่นมือมาอีก สองคนบนราวกระโดดลงมาคนละฝั่งแล้วหลีกทางให้โดยไม่มีใครสั่ง

        {name}ซื้อเกลือได้ครบ ขากลับเดินข้ามสะพานเดิม ไม่มีใครนั่งอยู่บนราวแล้ว อีกหลายเดือนต่อมาเด็กเล็กแถวนั้นยังเดินตาม{name}ข้ามสะพานเป็นแถว
      effects: { stats: { STR: 1 }, flags: [bridge_stood] }
    lose:
      text: |
        {name}ลงไปนั่งอยู่ในน้ำลึกแค่เอว ปากแตก เสื้อเปียกถึงคอ บนสะพานมีเสียงเหรียญกระทบกันสองครั้ง แล้วเสียงฝีเท้าสามคู่วิ่งห่างออกไป

        วันนั้นที่บ้านกินแกงที่ไม่ได้ใส่เกลือ ไม่มีใครบ่น ซึ่งแย่กว่าโดนบ่น
      effects: { gold: -2, flags: [bridge_robbed] }
    stalemate:
      text: |
        ทั้งสองฝ่ายยืนหอบอยู่คนละครึ่งสะพาน จนมีเกวียนฟางมาจ่อที่หัวสะพานแล้วคนขับตะโกนถามว่าจะให้รอถึงหน้าเกี่ยวหรือ เด็กโตสามคนเดินหนีไปทางหนึ่ง {name}เดินไปอีกทาง

        เงินค่าเกลือยังอยู่ครบ แต่แขนเสื้อขาดไปข้างหนึ่ง
      effects: { stats: { CON: 1 } }
    flee:
      text: |
        {name}ไปถึงตลาดช้ากว่าทุกวัน รองเท้าเปียก ร้านเกลือเก็บของไปแล้วครึ่งร้าน แต่เงินยังอยู่ครบทุกเหรียญ

        วันต่อมา{name}ออกจากบ้านเร็วขึ้นครึ่งชั่วยาม เพื่อจะได้เดินอ้อมทันโดยไม่ต้องผ่านสะพาน
      effects: { stats: { DEX: 1 } }
    parley:
      text: |
        คนตัวใหญ่ชะงักที่คำว่าพ่อ มันหันไปมองสองคนบนราวสะพาน ไม่มีใครช่วยตอบ มันจึงถ่มน้ำลายลงน้ำ บอกว่าวันนี้ยกให้ แล้วหลีกทาง

        ขากลับ{name}เดินผ่านมันอีกรอบ มันทำเป็นมองปลาในน้ำ
      effects: { stats: { CHA: 1 }, flags: [bridge_talked] }

- id: youth.enc_woodpile_snake
  stage: youth
  weight: 12
  scene: home
  when:
    age: [13, 17]
  text: |
    ฟืนท่อนสุดท้ายของกองอยู่ล่างสุด ชิดผนัง {name}ล้วงมือเข้าไปจนสุดแขน แล้วรู้สึกว่าของที่นิ้วแตะอยู่ไม่ใช่เปลือกไม้ มันเย็นกว่า เรียบกว่า และขยับ

    งูตัวหนาเท่าข้อมือขดอยู่ในซอกนั้น หัวมันยกขึ้นมาช้าๆ จนอยู่ระดับเดียวกับศอกของ{name} ลิ้นแลบออกมาสองครั้ง

    คนแก่บอกไว้เสมอว่างูกองฟืนกัดแล้วไม่ถึงตาย ถ้าไปถึงมือหมอทันค่ำ บ้านหมออยู่ไกลออกไปครึ่งวันเดิน
  encounter:
    foe: snake
    beats:
      - text: คองูโค้งไปข้างหลังเป็นรูปตะขอ ตัวท่อนล่างขดแน่นขึ้นอีกรอบ มือของ{name}ยังอยู่ในซอกฟืน ห่างจากหัวมันไม่ถึงคืบ
        answer: guard
        moves:
          - id: snake_still
            label: นิ่งไว้ทั้งตัว ไม่ชักมือ ไม่หายใจแรง
            kind: guard
            success: "{name}นิ่งจนขาเริ่มสั่น งูแลบลิ้นอีกสามครั้ง ไม่เจออะไรที่ขยับ คอที่โค้งอยู่จึงค่อยๆ คลายลง หัวมันลดต่ำลงไปวางบนขดของตัวเอง"
            failure: "{name}กลั้นได้ไม่นานพอ นิ้วกระตุกเองครั้งเดียว หัวงูพุ่งมาถึงหลังมือเร็วกว่าที่ตาจะมองทัน เหลือรูเล็กๆ สองรูที่เริ่มชาเป็นวงกว้าง"
          - id: snake_watch
            label: ดูลายบนหลังมัน นึกให้ออกว่าคนแก่เรียกงูชนิดนี้ว่าอะไร
            kind: read
            stat: WIS
            success: ลายข้าวหลามตัดสีน้ำตาลสลับเทา งูกองฟืนธรรมดา คนแก่บอกว่ามันฉกเพราะตกใจ ไม่ใช่เพราะหิว และมันตามองไม่ดี ของที่ไม่ขยับคือของที่ไม่มีอยู่ {name}หายใจช้าลงได้เอง
          - id: snake_yank
            label: ชักมือออกให้เร็วที่สุด
            kind: quick
          - id: snake_run
            label: กระโดดถอยหลัง ทิ้งฟืนไว้ทั้งกอง
            kind: flee
      - text: งูเริ่มคลายขดออกจากซอก ตัวมันยาวกว่าที่คิดไว้มาก ไหลลงมาตามกองฟืน หัวหันไปทางประตูครัวที่เปิดอ้าอยู่
        moves:
          - id: snake_stick
            label: ใช้ฟืนท่อนยาวกดคอมันไว้กับพื้น
            kind: attack
            tags: [blunt]
            success: ฟืนกดลงหลังหัวมันพอดี ตัวที่เหลือม้วนขึ้นมาพันท่อนไม้แน่นจนเปลือกไม้ลั่น {name}ถือทั้งฟืนทั้งงูเดินไปปล่อยที่ชายทุ่ง ไกลพอที่มันจะไม่กลับมาก่อนหน้าหนาวหมด
          - id: snake_basket
            label: คว้าตะกร้าผ้าครอบมันไว้
            kind: quick
          - id: snake_door
            label: วิ่งไปปิดประตูครัวก่อนมันเลื้อยถึง
            kind: guard
          - id: snake_leave
            label: ถอยออกมา ปล่อยให้มันไปทางไหนก็ไป
            kind: flee
    win:
      text: |
        กองฟืนกลับมาเป็นของคนในบ้านอีกครั้ง {name}ขนท่อนที่เหลือเข้าครัวจนหมด ทีนี้ใช้เท้าเขี่ยทุกท่อนก่อนหยิบ

        ตอนมื้อเย็นมีคนถามว่าทำไมวันนี้ขนฟืนนานนัก {name}เล่าให้ฟังโดยกางแขนบอกความยาวของงู คนฟังบอกให้หุบแขนเข้ามาหน่อย
      effects: { stats: { WIS: 1 }, flags: [woodpile_snake_caught] }
    lose:
      text: |
        มือข้างที่โดนกัดบวมจนกำไม่ได้ก่อนถึงครึ่งทางไปบ้านหมอ {name}จำครึ่งทางหลังไม่ได้เลย จำได้แต่ว่ามีคนแบก และมีคนบอกให้นับเลขออกเสียงไปเรื่อยๆ อย่าหยุด

        หมอกรีดแผล บีบ แล้วพอกด้วยของที่กลิ่นเหมือนโคลนผสมเหล้า อีกเจ็ดวันกว่ามือข้างนั้นจะถือช้อนได้
      effects: { flags: [snake_bitten] }
    stalemate:
      text: |
        งูหายเข้าไปในร่องใต้พื้นครัว ไม่มีใครเห็นมันออกมาอีก และไม่มีใครเห็นมันตาย

        ทั้งหน้าหนาวนั้นคนในบ้านเดินเข้าครัวโดยกระทืบเท้าก่อนสองที {name}เป็นคนเริ่ม
      effects: { stats: { DEX: 1 } }
    flee:
      text: |
        {name}ยืนอยู่กลางลาน ห่างจากกองฟืนสิบก้าว มือสองข้างยังอยู่ครบและไม่มีรู

        คืนนั้นเตาในบ้านใช้ฟืนที่ขอยืมจากบ้านข้างๆ กองของตัวเองไม่มีใครแตะจนกว่าจะมีผู้ใหญ่ว่างมารื้อ
      effects: { stats: { DEX: 1 } }

- id: youth.enc_lamp_moths
  stage: youth
  weight: 20
  time: night
  when:
    age: [13, 16]
    location_tag: ventras
    not_traits: [curse_brand]
  text: |
    ตะเกียงฟ้าหัวตรอกดับไปสองคืน คืนนี้กลับมาสว่างกว่าเดิม รอบโคมมีผีเสื้อกลางคืนปีกใสเกาะซ้อนกันหลายชั้น จนโคมทั้งดวงดูเหมือนมีขน

    เด็กในตรอกฮัมเพลงเดียวกันมาตั้งแต่หัวค่ำ เพลงที่ไม่มีแม่คนไหนสอน พอดึก เสียงต่ำเสียงเดียวก็ดังขึ้นจากทางโคม ดังพอให้ถ้วยบนชั้นกระทบกันเอง

    {name}เปิดหน้าต่างออกไปดู เด็กเล็กบ้านติดกันเดินเท้าเปล่าอยู่กลางตรอก ตายังปิด มุ่งหน้าไปทางตะเกียง
  encounter:
    foe: hum_moth
    name: ฝูงแมลงหึ่ง
    beats:
      - text: ปีกใสทั้งฝูงขยับพร้อมกันเป็นจังหวะเดียว ฟันของ{name}สั่นตามเสียงนั้น เด็กเล็กเดินไปได้ครึ่งตรอกแล้ว
        answer: quick
        moves:
          - id: moth_carry
            label: วิ่งลงไปอุ้มเด็กกลับเข้าบ้าน
            kind: quick
            success: เด็กตัวอุ่นและหนักแบบคนหลับ {name}อุ้มกลับไปวางหน้าประตูบ้านของแก เคาะสามที แม่ของเด็กออกมารับทั้งที่ยังฮัมเพลงนั้นอยู่ในคอ พอเห็นลูกก็หยุดฮัมกลางท่อน
          - id: moth_rag
            label: จุดเศษผ้าชุบน้ำมันบนปลายไม้ ชูขึ้นไปใต้โคม
            kind: item
            stat: DEX
            tags: [smoke, fire]
          - id: moth_count
            label: อุดหูสองข้าง นับเลขออกเสียงสู้กับเสียงหึ่ง
            kind: guard
          - id: moth_shut
            label: ปิดหน้าต่าง เอาหมอนกดหูไว้จนเช้า
            kind: flee
      - text: ฝูงแตกออกจากโคมเป็นสาย ม้วนลงมาต่ำเท่าหัวคน เสียงหึ่งเปลี่ยนเป็นทำนอง ทำนองเดียวกับที่เด็กในตรอกฮัมกันทั้งวัน
        answer: guard
        moves:
          - id: moth_song
            label: ยืนให้มั่น ร้องเพลงของตัวเองทับให้ดังที่สุด
            kind: guard
            success: "{name}ร้องเพลงกล่อมที่จำได้ตั้งแต่ยังเดินไม่เป็น ร้องผิดคีย์และดังเกินไป ทำนองของฝูงสะดุด สายที่ม้วนอยู่รอบหัวคลายออก เหมือนหาจังหวะที่จะเกาะไม่เจอ"
          - id: moth_broom
            label: จุดไฟปลายไม้กวาด กวาดไปกลางฝูง
            kind: attack
            tags: [fire]
          - id: moth_watch
            label: ดูให้ออกว่าฝูงบินตามอะไร ตามแสง ตามเสียง หรือตามคน
            kind: read
            stat: WIS
            success: ฝูงไม่ได้ตามคน มันตามแสงสีฟ้า และหลบทุกที่ที่มีควัน ปล่องครัวบ้านไหนยังอุ่นอยู่ ไม่มีแมลงสักตัวเกาะหลังคาบ้านนั้น
          - id: moth_shut2
            label: วิ่งกลับเข้าบ้าน ปิดประตู
            kind: flee
      - text: ตะเกียงฟ้าหรี่ลงเอง ฝูงเริ่มแตกแถวหาแสงใหม่ หน้าต่างบ้านของ{name}ยังเปิดอยู่ และตะเกียงข้างเตียงยังไม่ได้ดับ
        answer: quick
        moves:
          - id: moth_snuff
            label: วิ่งขึ้นไปดับตะเกียงทุกดวงในบ้านก่อนฝูงจะถึง
            kind: quick
          - id: moth_straw
            label: โยนฟางชื้นลงเตา ให้ควันออกทั้งปล่องทั้งหน้าต่าง
            kind: item
            stat: WIS
            tags: [smoke]
          - id: moth_sheet
            label: ยืนขวางหน้าต่าง กางผ้าห่มรับไว้ทั้งฝูง
            kind: guard
          - id: moth_shut3
            label: ปล่อยบ้านไว้ ไปนั่งรอที่บันไดวิหารจนสว่าง
            kind: flee
    win:
      text: |
        ฝูงยกตัวขึ้นเป็นก้อนเดียว ลอยข้ามหลังคาไปทางปล่องโรงกลั่น เสียงต่ำนั้นเบาลงจนเหลือแค่เสียงที่ไม่แน่ใจว่าได้ยินจริงหรือเปล่า

        เด็กในตรอกเลิกฮัมเพลงนั้นไปเจ็ดวัน วันที่แปดมีคนหนึ่งเริ่มฮัมอีกตอนกระโดดเชือก คนที่เหลือหันไปมอง แล้วก็ฮัมตาม
      effects: { stats: { WIS: 1 }, flags: [moths_driven] }
    lose:
      text: |
        {name}ตื่นตอนฟ้าสาง นั่งพิงเสาตะเกียงอยู่กลางตรอก เท้าเปล่า จำไม่ได้ว่าเดินออกมาตอนไหน บนไหล่มีผงปีกสีเงินติดอยู่เป็นปื้น

        เสียงต่ำเสียงนั้นยังอยู่ในหูข้างซ้าย คนในบ้านพูดด้วยต้องพูดสองรอบไปทั้งเดือน
      effects: { flags: [moths_took_night] }
    stalemate:
      text: |
        ฝูงกลับไปเกาะโคมตามเดิมก่อนฟ้าสาง เช้ามาคนจุดตะเกียงของเมืองเอาไม้ยาวเขี่ยออกทีละกำ บ่นว่าเดือนนี้เขี่ยมาสามตรอกแล้ว

        {name}นอนไม่พอ ทั้งวันรุ่งขึ้นหาวจนโดนถามว่าเมื่อคืนไปไหนมา
      effects: { stats: { CON: 1 } }
    flee:
      text: |
        เช้ามาเด็กเล็กบ้านติดกันนอนอยู่บนเตียงของแกเอง มีคนอุ้มกลับมา ไม่ใช่{name}

        ทั้งตรอกตื่นสาย และทุกบ้านเล่าตรงกันว่าเมื่อคืนหลับสนิทผิดปกติ ไม่มีใครถามต่อว่าทำไมถึงตรงกัน
      effects: { stats: { WIS: 1 } }

- id: youth.enc_coal_ghost
  stage: youth
  weight: 20
  scene: mine
  when:
    age: [13, 16]
    location_tag: hordun
  text: |
    งานของเด็กรุ่น{name}คือแบกน้ำมันตะเกียงลงไปส่งชั้นสาม วันละสองเที่ยว ทางลงมีตะเกียงแขวนทุกยี่สิบก้าว

    เที่ยวบ่าย ตะเกียงสองดวงตรงโค้งหรี่ลงพร้อมกันทั้งที่น้ำมันยังเต็ม ลมหายใจของ{name}ออกมาเป็นไอขาว บนคานค้ำเหนือหัวมีก้อนสีเทาเท่าแมวเกาะอยู่ ไม่มีหน้า ไม่มีขา ผิวเป็นเถ้าที่อัดกันจนแน่น

    คนเหมืองทุกคนเคยเล่าเรื่องนี้ และทุกคนเล่าตอนนั่งอยู่ข้างเตา
  encounter:
    foe: coal_ghost
    beats:
      - text: ก้อนเถ้าไหลลงจากคานมาเกาะขอบตะเกียงในมือ เปลวไฟหดเหลือเท่าเมล็ดถั่ว ปลายนิ้วของ{name}เริ่มชา
        moves:
          - id: ghost_splash
            label: สาดน้ำจากกระติกใส่มันทั้งกระติก
            kind: item
            stat: DEX
            tags: [water]
            success: น้ำโดนมันเต็มก้อน เถ้าที่อัดแน่นเละลงเป็นโคลนสีเทาไหลย้อยตามมือ ส่วนที่ยังแห้งหดตัวเล็กลงครึ่งหนึ่ง แล้วดีดกลับขึ้นไปบนคาน เปลวตะเกียงค่อยๆ ยืดกลับมา
          - id: ghost_poke
            label: เอาด้ามค้อนเขี่ยมันออกจากตะเกียง
            kind: attack
            tags: [blunt]
          - id: ghost_hug
            label: กอดตะเกียงไว้กับอก เอาเสื้อคลุมบังไว้ทั้งดวง
            kind: guard
          - id: ghost_recall
            label: นึกให้ออกว่าคนเหมืองเล่าว่าต้องทำอย่างไรกับมัน
            kind: read
            stat: INT
            success: ถังน้ำ ทุกเรื่องที่เล่ากันมีถังน้ำ หัวหน้ากะวางถังน้ำไว้ข้างตะเกียงทุกดวง และ{name}เคยคิดมาตลอดว่าเอาไว้ดับไฟ ถังใบที่ใกล้ที่สุดอยู่ห่างไปสิบก้าว
          - id: ghost_drop
            label: วางตะเกียงทิ้งไว้ คลำผนังกลับขึ้นไปในความมืด
            kind: flee
      - text: ก้อนเถ้าแยกเป็นสองก้อน ก้อนเล็กไต่ขึ้นมาตามแขนเสื้อของ{name} ทุกที่ที่มันผ่านเย็นวาบเหมือนเอาแขนจุ่มน้ำแข็ง
        answer: quick
        moves:
          - id: ghost_shake
            label: สะบัดแขน ถอดเสื้อคลุมทิ้งทั้งตัว
            kind: quick
          - id: ghost_dunk
            label: จุ่มแขนลงถังน้ำข้างราง ทั้งแขนทั้งมัน
            kind: item
            stat: CON
            tags: [water]
          - id: ghost_torch
            label: จ่อเปลวตะเกียงเข้าใส่มันตรงๆ
            kind: attack
            tags: [fire]
            failure: ก้อนเถ้ากลืนเปลวไฟเข้าไปทั้งดวงเหมือนคนหิวได้ซุป มันพองขึ้น อุ่นขึ้น ส่วนตะเกียงดับสนิท ความเย็นวิ่งจากข้อมือของ{name}ขึ้นไปถึงไหล่
          - id: ghost_drop2
            label: ทิ้งทุกอย่าง วิ่งขึ้นไปหาแสงชั้นบน
            kind: flee
      - text: ก้อนที่เหลือกลิ้งไปตามรางที่ลาดลงชั้นล่าง ข้างล่างนั้นมีตะเกียงอีกสิบดวง กับคนอีกสิบคนที่ยังไม่รู้เรื่อง
        moves:
          - id: ghost_pail
            label: วิ่งดักหน้า เอาถังเปล่าครอบมันไว้
            kind: quick
          - id: ghost_flood
            label: ถีบถังน้ำให้ล้มขวางราง
            kind: attack
            tags: [water]
          - id: ghost_warn
            label: ตะโกนลงไปบอกชั้นล่างให้ยกตะเกียงขึ้นที่สูง
            kind: talk
          - id: ghost_drop3
            label: ถอยขึ้นไปตามทางเดิม ให้ผู้ใหญ่จัดการ
            kind: flee
    win:
      text: |
        สิ่งที่เหลืออยู่บนพื้นรางคือโคลนสีเทากองหนึ่ง เย็นกว่าหินรอบๆ {name}ตักใส่ถังขึ้นไปให้หัวหน้ากะดู แกเทมันลงเตาหลอมโดยไม่พูดอะไร แล้วเติมน้ำมันให้ตะเกียงของ{name}เองกับมือ

        ตั้งแต่วันนั้นเด็กแบกน้ำมันทุกคนได้กระติกน้ำเพิ่มคนละใบ และ{name}เป็นคนสอนว่าต้องสาดตรงไหน
      effects: { stats: { CON: 1 }, flags: [coal_ghost_drowned], reputation: { dwarf_council: 1 } }
    lose:
      text: |
        คนชั้นสามขึ้นมาเจอ{name}นั่งพิงผนังอยู่ในความมืด ปากเขียว มือสองข้างกำไม่เข้า พวกเขาแบกขึ้นไปวางข้างเตาหลอม ห่มหนังแกะสามผืน

        ถึงค่ำ{name}ก็ยังหนาวอยู่ข้างใน หนาวแบบที่ไฟช่วยไม่ถึง
      effects: { flags: [coal_ghost_chilled] }
    stalemate:
      text: |
        ก้อนเถ้าหายเข้าไปในรอยแยกของผนัง ตะเกียงตรงโค้งกลับมาสว่างเท่าเดิม {name}ส่งน้ำมันชั้นสามช้าไปครึ่งชั่วยาม โดนหัวหน้ากะดุ จนเล่าว่าเจออะไร

        แกหยุดดุ แล้วสั่งคนไปวางถังน้ำเพิ่มที่โค้งนั้นอีกสองใบ
      effects: { stats: { WIS: 1 } }
    flee:
      text: |
        {name}ขึ้นมาถึงปากอุโมงค์มือเปล่า ไม่มีตะเกียง ไม่มีน้ำมัน หัวหน้ากะฟังเรื่องจบแล้วส่งผู้ใหญ่สองคนลงไปพร้อมถังน้ำ

        ค่าน้ำมันกับค่าตะเกียงที่หาย หักจากส่วนแบ่งของบ้านเดือนนั้น
      effects: { gold: -2 }

- id: youth.enc_young_boar
  stage: youth
  weight: 20
  when:
    age: [14, 17]
    location_tag: ileth
  text: |
    ใต้ต้นโอ๊กแก่ชายป่ามีลูกโอ๊กร่วงหนาพอให้เก็บได้เต็มตะกร้าในครึ่งเช้า {name}เก็บมาได้ครึ่งตะกร้าแล้ว ตอนที่ได้ยินเสียงดินโดนขุดจากอีกฟากของโคนต้น

    หมูป่าหนุ่มตัวหนึ่งกำลังใช้จมูกไถดินหารากไม้ ไหล่มันสูงเท่าเอวคน เขี้ยวเพิ่งงอกพ้นปาก ยังขาวอยู่ ยังไม่ทันเหลือง

    มันเงยหน้าขึ้นตอนที่กิ่งไม้ใต้เท้าของ{name}หัก
  encounter:
    foe: boar
    name: หมูป่าหนุ่ม
    threat: 2
    morale: 2
    deadly: false
    beats:
      - text: หูสองข้างของมันหันมาทางเดียวกัน จมูกเปื้อนดินขยับสูดลม มันยังไม่ได้ตัดสินใจว่า{name}เป็นอะไร
        moves:
          - id: boar_wind
            label: ดูทางลม ดูขามัน นึกว่าคนชายป่าเล่าเรื่องหมูป่าว่าอย่างไร
            kind: read
            stat: WIS
            success: ลมพัดจาก{name}ไปหามัน มันได้กลิ่นหมดแล้ว และคนชายป่าพูดตรงกันทุกคน หมูป่าพุ่งตรงอย่างเดียว เลี้ยวไม่เป็น คนที่โดนคือคนที่ยืนอยู่กับที่ {name}ขยับเท้าไปยืนข้างโคนต้นที่มีรากโผล่
          - id: boar_tree
            label: ถอยไปยืนให้โคนต้นโอ๊กอยู่ระหว่างตัวเองกับมัน
            kind: quick
          - id: boar_big
            label: กางแขน ชูตะกร้าเหนือหัว ทำตัวให้ใหญ่
            kind: guard
          - id: boar_clap
            label: ตบมือ ตะโกนไล่
            kind: talk
            tags: [noise]
          - id: boar_climb
            label: ทิ้งตะกร้า ปีนขึ้นกิ่งที่ต่ำที่สุด
            kind: flee
      - text: มันก้มหัวลงจนเขี้ยวชี้มาข้างหน้า กีบหน้าขูดดินสองที
        answer: quick
        moves:
          - id: boar_side
            label: รอจนมันออกตัว แล้วกระโดดออกข้าง
            kind: quick
            success: "{name}รอจนเห็นขนบนสันหลังมันตั้ง แล้วกระโดดไปทางซ้าย หมูป่าพุ่งผ่านที่ที่{name}เคยยืนไปทั้งตัว ชนพุ่มหนามข้างหลัง เสียงมันร้องฟังเหมือนด่า"
            failure: "{name}กระโดดเร็วไป มันยังไม่ทันออกตัวด้วยซ้ำ พอเท้าแตะพื้น หมูป่าก็เล็งใหม่เสร็จแล้ว หัวไหล่ของมันกระแทกต้นขาของ{name}จนลอยขึ้นจากพื้น"
          - id: boar_stake
            label: ปักไม้ขุดปลายแหลมยันพื้น หันปลายรับ
            kind: attack
            tags: [pierce]
          - id: boar_stand
            label: ยืนกางขา ตั้งตะกร้าไว้ข้างหน้าเป็นโล่
            kind: guard
          - id: boar_climb2
            label: ปีนขึ้นต้นไม้ตอนที่มันยังก้มหัวอยู่
            kind: flee
      - text: มันหมุนตัวกลับช้าๆ สีข้างยกขึ้นลงแรง ดินที่กีบมันเพิ่งไถเป็นร่องยาวตรงมาทาง{name}
        answer: attack
        moves:
          - id: boar_jab
            label: แทงไม้ขุดเข้าสีข้างตอนที่มันยังหมุนตัวไม่เสร็จ
            kind: attack
            tags: [pierce]
          - id: boar_acorn
            label: เทลูกโอ๊กทั้งตะกร้าลงพื้น แล้วเดินถอยหลังช้าๆ
            kind: item
            stat: WIS
            tags: [bait]
            success: ลูกโอ๊กกลิ้งกระจายไปถึงเท้ามัน หมูป่ามอง{name} มองลูกโอ๊ก แล้วก้มลงกินลูกแรก ลูกที่สอง ตอนที่{name}ถอยไปถึงชายทุ่ง มันยังไม่เงยหน้าขึ้นมาอีกเลย
          - id: boar_dodge
            label: วิ่งวนรอบโคนต้นให้มันเลี้ยวตามไม่ทัน
            kind: quick
          - id: boar_climb3
            label: ปีนขึ้นต้นไม้ รอให้มันเบื่อไปเอง
            kind: flee
    win:
      text: |
        หมูป่าหนุ่มวิ่งกลับเข้าป่าไปทางที่มันมา หางชี้ตรง เสียงพุ่มไม้หักไล่หลังไปอีกไกล

        {name}เก็บลูกโอ๊กที่หกกลับใส่ตะกร้าทีละลูก มือยังสั่นอยู่ตอนเก็บลูกสุดท้าย คนชายป่าที่ได้ฟังเรื่องตอนเย็นถามคำเดียวว่าเขี้ยวมันเหลืองหรือยัง พอรู้ว่ายังขาวก็หัวเราะ แล้วบอกว่าปีหน้าอย่าไปต้นนั้น
      effects: { stats: { DEX: 1 }, flags: [boar_stared_down] }
    lose:
      text: |
        {name}นอนหงายอยู่ใต้ต้นโอ๊ก มองกิ่งไม้ข้างบนหมุนช้าๆ หมูป่ายืนคร่อมตะกร้าที่คว่ำ กินลูกโอ๊กจนหมด แล้วเดินจากไปโดยไม่หันมามองอีก

        คนที่ออกมาตามหาตอนบ่ายต้องหามกลับ ขาข้างที่โดนเขี้ยวเกี่ยวเย็บไปเจ็ดเข็ม
      effects: { flags: [boar_gored] }
    stalemate:
      text: |
        ทั้งคู่ยืนหอบอยู่คนละฟากของโคนต้น จนหมูป่าเป็นฝ่ายเลิกก่อน มันสะบัดหัวทีหนึ่ง แล้วเดินกลับไปไถดินตรงที่เดิม ทำเหมือน{name}เป็นตอไม้

        {name}ถอยออกมาทีละก้าว ได้ลูกโอ๊กกลับบ้านครึ่งตะกร้าเท่าเดิม
      effects: { stats: { CON: 1 } }
    flee:
      text: |
        {name}นั่งอยู่บนกิ่งโอ๊กจนบ่าย ข้างล่างหมูป่ากินลูกโอ๊กในตะกร้าจนเกลี้ยง นอนพักใต้ต้นอีกพักใหญ่ แล้วค่อยลุกเดินไป

        ตะกร้าใบนั้นมีรอยเขี้ยวทะลุสองรู ยังใช้ใส่ของชิ้นใหญ่ได้
      effects: { stats: { DEX: 1 } }

- id: youth.enc_night_scrap
  stage: youth
  weight: 20
  time: night
  when:
    age: [13, 17]
    location_tag: ashland
  text: |
    คืนเดือนดับ เด็กจากค่ายเหมืองใหม่มานั่งล้อมกองไฟกับเด็กในหมู่บ้านเป็นครั้งแรก เด็กคนนั้นเพิ่งย้ายมาจากอาร์เวลได้เจ็ดวัน ยังไม่มีใครสอนอะไรแก

    แกเงยหน้า ยกนิ้วชี้ขึ้นฟ้า "ดวงนั้นเมื่อวานยังไม่มี"

    ทุกคนรอบกองไฟเงียบ เด็กโตคนหนึ่งคว้ามือแกกดลง แต่ช้าไปแล้ว เหนือหัวของเด็กใหม่ ความมืดชิ้นหนึ่งหลุดออกจากความมืดที่เหลือ ขอบมันขาดวิ่นเหมือนผ้าเก่า ตรงกลางมีตาคู่เดียว
  encounter:
    foe: night_scrap
    beats:
      - text: เศษกลางคืนลอยต่ำลงมาเหนือไหล่เด็กใหม่ ไฟในกองหรี่ลงทั้งที่ไม่มีลม ตาคู่นั้นไม่ได้มองคนอื่นเลย มองแต่นิ้วที่เพิ่งชี้
        moves:
          - id: scrap_lamp
            label: คว้าตะเกียงเข้าไปชูคั่นระหว่างมันกับเด็ก
            kind: item
            stat: DEX
            tags: [light]
            success: แสงตะเกียงตกโดนขอบที่ขาดวิ่นของมัน ส่วนที่โดนแสงบางลงจนมองทะลุเห็นดาวข้างหลัง เศษกลางคืนหดตัวกลับขึ้นไปสูงเกินเอื้อม ตาคู่นั้นหรี่ลงเหมือนคนโดนปลุก
          - id: scrap_sorry
            label: จับมือเด็กใหม่กำไว้ แล้วกล่าวขอโทษฟ้าเสียงดังแบบที่ยายสอน
            kind: talk
          - id: scrap_shield
            label: ดึงเด็กมาไว้ข้างหลัง ยืนบังไว้ทั้งตัว
            kind: guard
          - id: scrap_stick
            label: คว้าฟืนติดไฟจากกองฟาดใส่มัน
            kind: attack
            tags: [fire, blunt]
          - id: scrap_run
            label: วิ่งกลับบ้านพร้อมเด็กคนอื่น
            kind: flee
      - text: มันกางออกกว้างเท่าผ้าห่ม ขอบที่ขาดม้วนลงมารอบตัวเด็กใหม่ทีละชาย แกยืนนิ่ง ลืมตากว้าง แต่ไม่ได้มองอะไร
        answer: item
        moves:
          - id: scrap_grass
            label: จุดหญ้าเงินแห้งทั้งกำ โยนเข้าไปใต้มัน
            kind: item
            stat: DEX
            tags: [fire, light]
          - id: scrap_pull
            label: พุ่งเข้าไปกระชากเด็กออกมาจากใต้มัน
            kind: quick
          - id: scrap_eyes
            label: เอามือปิดตาเด็ก แล้วปิดตาตัวเอง นิ่งไว้
            kind: guard
            success: พอไม่มีตาคู่ไหนมองมัน เศษกลางคืนก็เหมือนหาของที่ตามมาไม่เจอ ชายที่ม้วนลงมาค่อยๆ คลาย ลมเย็นพัดผ่านหลังคอของ{name}ไปครั้งเดียว แล้วไม่มีอีก
          - id: scrap_run2
            label: ปล่อยมือ ถอยออกมาจากกองไฟ
            kind: flee
    win:
      text: |
        เศษกลางคืนลอยกลับขึ้นไป บางลงเรื่อยๆ จนแยกจากฟ้าไม่ออก กองไฟลุกกลับมาเท่าเดิมเองโดยไม่มีใครเติมฟืน

        เด็กใหม่ร้องไห้ตอนที่ทุกอย่างจบแล้ว เด็กโตพาแกไปส่งบ้าน ระหว่างทางสอนข้อห้ามให้ครบทุกข้อ ข้อแรกคือไม่ชี้ดาว ข้อสองคือไม่นับดาวออกเสียง {name}เดินตามหลัง ถือตะเกียงให้
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, taboo: { night: keep }, flags: [scrap_sent_back] }
    lose:
      text: |
        {name}จำได้ว่าความมืดม้วนลงมาปิดหน้า เย็นและเบาเหมือนขี้เถ้า แล้วก็จำอะไรไม่ได้อีก

        ผู้ใหญ่ที่ถือคบไฟออกมาตามเจอเด็กทั้งสองนั่งอยู่ข้างกองไฟที่ดับแล้ว ตาเปิด ไม่พูด ต้องรอจนฟ้าสางกว่าทั้งคู่จะตอบชื่อตัวเองได้ และอีกหลายคืนกว่า{name}จะกล้าดับตะเกียงก่อนนอน
      effects: { taboo: { night: learn }, flags: [scrap_touched] }
    stalemate:
      text: |
        ผู้ใหญ่ทั้งหมู่บ้านออกมาพร้อมคบไฟ ยืนล้อมเด็กสองคนไว้เป็นวง ไม่มีใครเงยหน้า เศษกลางคืนลอยวนอยู่เหนือวงแสงจนไก่ขัน แล้วก็ไม่อยู่ตรงนั้นแล้ว

        ยายคนที่แก่ที่สุดบอกว่ามันจำหน้าได้ และคืนเดือนดับหน้าให้เด็กใหม่นอนในบ้านที่มีไฟ
      effects: { stats: { CON: 1 }, taboo: { night: learn } }
    flee:
      text: |
        {name}วิ่งถึงบ้านแล้วจึงหันกลับไปมอง กองไฟดับไปแล้ว มีคบไฟหลายดวงกำลังเคลื่อนไปทางนั้น

        เด็กใหม่ไม่เป็นอะไร แต่ไม่มานั่งล้อมกองไฟอีกเลย และเวลาเดินสวนกัน แกมอง{name}แค่แวบเดียว
      effects: { alignment: { moral: -1 }, taboo: { night: learn } }

- id: youth.enc_belfry_bats
  stage: youth
  weight: 10
  scene: temple
  when:
    age: [13, 16]
  text: |
    ระฆังของวิหารไม่ดังมาสามวัน เชือกขึ้นไปติดอะไรสักอย่างบนหอ คนดูแลวิหารเข่าไม่ดี บันไดหอมีแปดสิบขั้นกับอีกหนึ่งช่วงที่ต้องไต่ แกจึงยื่นเหรียญให้{name}หนึ่งเหรียญกับเทียนไขหนึ่งเล่ม

    บนสุดของหอ เชือกระฆังพันอยู่กับขื่อ และใต้ขื่อทั้งท่อนมีของสีน้ำตาลห้อยอยู่แน่นเป็นพวง พวงนั้นหายใจ

    ค้างคาวตัวที่ใกล้ที่สุดกางปีกออกข้างหนึ่ง แล้วหุบ
  encounter:
    foe: bat
    name: ฝูงค้างคาว
    beats:
      - text: ทั้งฝูงยังห้อยหัวอยู่ แต่หูเล็กๆ นับร้อยคู่หันมาทางเปลวเทียน เชือกระฆังอยู่ห่างออกไปสามช่วงแขน ต้องเอื้อมผ่านใต้พวงนั้น
        moves:
          - id: bat_creep
            label: ดับเทียน ไต่ไปตามขื่อเงียบๆ จนถึงเชือก
            kind: quick
          - id: bat_smoke
            label: เป่าเทียนให้เหลือแต่ควัน ถือชูไว้ใต้ฝูง
            kind: item
            stat: WIS
            tags: [smoke]
            success: ควันเทียนลอยขึ้นไปเป็นเส้นตรง ค้างคาวที่ควันผ่านสะบัดหัว ขยับหนีไปเกาะขื่อท่อนถัดไปทีละตัวโดยไม่บิน พวงใต้ขื่อบางลงจนเห็นเชือกทั้งเส้น
          - id: bat_clap
            label: ตบมือดังๆ ให้มันบินออกไปทางช่องลม
            kind: talk
            tags: [noise]
          - id: bat_down
            label: ลงบันไดไปคืนเหรียญ
            kind: flee
      - text: ฝูงแตกออกจากขื่อพร้อมกัน หอทั้งหอมีแต่ปีก ปีกตีหน้า ตีหู เกาะผม ที่ยืนบนขื่อกว้างแค่ฝ่าเท้าเดียว
        answer: guard
        moves:
          - id: bat_hug
            label: กอดขื่อไว้ทั้งตัว ก้มหน้า รอให้ฝูงผ่าน
            kind: guard
          - id: bat_bell
            label: คว้าเชือกแล้วกระชากระฆังสุดแรง
            kind: attack
            tags: [noise]
            success: ระฆังดังครั้งแรกในรอบสามวัน ดังในหอแคบจน{name}รู้สึกเสียงนั้นในกระดูกอก ฝูงค้างคาวทะลักออกทางช่องลมทั้งสี่ด้านเหมือนควันออกจากปล่อง ข้างล่างมีคนร้องถามว่าใครตาย
          - id: bat_swat
            label: เหวี่ยงเชิงเทียนไล่ตีตัวที่เกาะหน้า
            kind: quick
          - id: bat_down2
            label: ไถลลงบันไดไต่ ไม่สนเชือกแล้ว
            kind: flee
    win:
      text: |
        หอระฆังว่าง เหลือแต่ขี้ค้างคาวหนาเป็นนิ้วบนขื่อ {name}แก้เชือกออกจากไม้ หย่อนกลับลงไปให้คนดูแลวิหาร

        เย็นนั้นระฆังดังตรงเวลา คนดูแลวิหารจ่ายเพิ่มอีกหนึ่งเหรียญโดยไม่มีใครขอ แล้วถามว่าปีหน้าว่างไหม
      effects: { gold: 2, stats: { DEX: 1 }, flags: [belfry_cleared] }
    lose:
      text: |
        {name}ลงมาถึงพื้นได้ด้วยการไถล ครึ่งหนึ่งของแปดสิบขั้นลงด้วยหลัง หน้ากับคอมีรอยข่วนถี่จนนับไม่ได้ ตาข้างหนึ่งบวมปิด

        คนดูแลวิหารล้างแผลให้ด้วยเหล้าที่แกบอกว่าเอาไว้ทำพิธี ระฆังเงียบต่อไปอีกเจ็ดวัน จนมีช่างมุงหลังคาผ่านมา
      effects: { gold: 1, flags: [belfry_clawed] }
    stalemate:
      text: |
        ฝูงค้างคาวบินวนอยู่ในหอจนเหนื่อยแล้วกลับไปเกาะที่เดิม เชือกหลุดจากขื่อมาได้ครึ่งเส้น พอให้คนข้างล่างดึงระฆังได้เบาๆ

        ระฆังเย็นนั้นจึงดังแค่ครึ่งเสียง คนดูแลวิหารบอกว่าเทพคงไม่ถือ
      effects: { gold: 1, stats: { CON: 1 } }
    flee:
      text: |
        {name}ลงมาถึงพื้น วางเทียนกับเหรียญคืนบนโต๊ะ คนดูแลวิหารไม่ว่าอะไร มองขึ้นไปบนหอ แล้วถอนใจแบบคนที่รู้อยู่แล้วว่าจะได้คำตอบนี้

        ระฆังเงียบต่อไปจนถึงวันที่มีคนกล้ากว่าขึ้นไป
      effects: { stats: { WIS: 1 } }

- id: youth.enc_fallen_star
  stage: youth
  weight: 10
  time: night
  when:
    age: [14, 17]
    not_traits: [curse_brand]
  text: |
    คืนที่มีดาวดวงใหม่ ฟ้ามีเส้นแสงขีดลงมาเส้นหนึ่ง สั้นกว่าดาวตกทั่วไป และไม่ดับ

    เช้ามืด{name}ออกไปดูกับคนอื่นๆ ที่ลานว่างท้ายถิ่น ของชิ้นนั้นยังอยู่ ลอยเหนือพื้นสูงแค่อก เป็นเศษแสงห้าแฉกขนาดเท่าฝาหม้อ หมุนช้าๆ รอบตัวเอง ใต้มันหญ้าเอนออกเป็นวง

    คนขายของเก่าพูดขึ้นว่าของแบบนี้ในเมืองมีคนรับซื้อ แล้วก็ไม่มีใครขยับ ทุกคนรอให้คนอื่นเป็นคนเดินเข้าไป
  encounter:
    foe: fallen_star
    beats:
      - text: ดาวร่วงหมุนมาจนแฉกหนึ่งชี้ตรงมาที่{name} ตาพร่าขึ้นมาทันทีเหมือนเผลอมองดวงอาทิตย์ หลังเปลือกตามีรูปห้าแฉกสีเขียวค้างอยู่
        answer: guard
        moves:
          - id: star_shut
            label: หลับตา ยืนนิ่งอยู่กับที่ ปล่อยให้มันหมุนผ่าน
            kind: guard
            success: "{name}หลับตาแน่นจนเห็นแต่สีแดงของเปลือกตาตัวเอง ความอุ่นกวาดผ่านหน้าไปช้าๆ แล้วเลยไป พอลืมตา ดาวร่วงหรี่ลงกว่าเดิม เหมือนตะเกียงที่ไม่มีใครมอง"
          - id: star_shadow
            label: ก้มมองเงาของมันบนพื้นแทนตัวมัน
            kind: read
            stat: INT
            success: เงาของมันบนหญ้าไม่ได้มีห้าแฉก มีแค่วงกลมเล็กๆ ที่สั่น ทุกครั้งที่มีคนในลานจ้องมันตรงๆ วงนั้นขยายออก พอคนนั้นหลบตา วงก็หดกลับ มันกินสายตา
          - id: star_sack
            label: วิ่งเข้าไปเอากระสอบครอบ
            kind: quick
          - id: star_sickle
            label: เอาเคียวฟันมันให้ขาดเป็นสองท่อน
            kind: attack
            tags: [edge]
          - id: star_leave
            label: เดินกลับบ้าน ไม่หันไปมองอีก
            kind: flee
      - text: แฉกทั้งห้าหุบเข้าหากัน แล้วมันสว่างขึ้นจนเงาของทุกคนในลานชี้ออกจากมันเป็นรัศมี คนขายของเก่ายกมือบังหน้า เด็กคนหนึ่งเริ่มเดินเข้าไปหา
        answer: guard
        moves:
          - id: star_back
            label: หันหลังให้มัน คว้าเด็กไว้ กดหน้าแกเข้ากับเสื้อ
            kind: guard
          - id: star_cloak
            label: ถอดเสื้อคลุมโยนทับมันทั้งผืน
            kind: quick
            success: เสื้อคลุมตกลงครอบมันพอดี แสงลอดเนื้อผ้าออกมาเป็นจุดๆ ครู่หนึ่ง แล้วค่อยๆ จางเหมือนถ่านที่โดนกลบ พอมีคนใช้ไม้เขี่ยผ้าออก ข้างใต้เหลือแต่รอยไหม้ห้าแฉกบนหญ้า
          - id: star_shout
            label: ตะโกนบอกทุกคนให้หลับตา อย่ามอง
            kind: talk
          - id: star_leave2
            label: ก้มหน้าเดินออกจากลาน
            kind: flee
    win:
      text: |
        ดาวร่วงหรี่ลงจนเหลือแค่แสงเท่าหิ่งห้อย แล้วตกลงบนหญ้าเบาๆ เหมือนใบไม้ ที่ตรงนั้นเหลือกรวดก้อนหนึ่ง สีขุ่น อุ่นอยู่ในมือ ไม่มีอะไรบอกเลยว่ามันเคยลอย

        คนขายของเก่าขอซื้อทันทีสามเหรียญ {name}ขายไป ทั้งลานเห็นตรงกันว่าเป็นราคาที่ดี จนอีกเจ็ดวันต่อมามีคนเล่าว่าแกเอาไปขายต่อในเมืองได้สามสิบ
      effects: { gold: 3, stats: { CON: 1 }, flags: [fallen_star_sold] }
    lose:
      text: |
        {name}จำได้ว่ามองมันนานเกินไป จำได้ว่ามีรูปห้าแฉกซ้อนอยู่บนทุกอย่างที่เห็น แล้วก็มีคนเอาผ้ามาคลุมหัวพากลับบ้าน

        สามวันแรก{name}ต้องนอนในห้องที่ปิดหน้าต่างทุกบาน เพราะแสงแค่ลอดร่องประตูก็แสบเข้าไปถึงท้ายทอย
      effects: { flags: [fallen_star_stared] }
    stalemate:
      text: |
        พอฟ้าสว่างเต็มที่ ดาวร่วงก็จางลงเองจนมองไม่เห็น ไม่มีใครบอกได้ว่ามันดับ หรือแค่แดดกลบ

        ลานนั้นไม่มีใครเดินตัดผ่านตอนกลางคืนไปอีกนาน หญ้าที่เอนเป็นวงไม่ยอมตั้งกลับ
      effects: { stats: { WIS: 1 } }
    flee:
      text: |
        {name}กลับถึงบ้านก่อนฟ้าสาง ไม่ได้เห็นว่าเรื่องที่ลานจบอย่างไร

        ตอนสายมีคนเล่าว่าคนขายของเก่าได้ของชิ้นนั้นไป และตั้งแต่วันนั้นแกเลิกหลับตอนกลางคืน นั่งอยู่หน้าร้านทั้งคืน มองขึ้นข้างบน
      effects: { stats: { WIS: 1 } }

- id: youth.enc_winter_wolves
  stage: youth
  weight: 20
  mark: รอดจากฝูงหมาป่าหน้าหนาว
  when:
    age: [16, 17]
    class: ranger
  text: |
    ครูพรานให้{name}ออกไปเก็บกับดักแถวสุดท้ายคนเดียวเป็นครั้งแรก แถวนั้นอยู่ไกลที่สุด ไปกลับกินเวลาทั้งวัน

    ขากลับหิมะเริ่มลง {name}หันไปดูรอยเท้าตัวเองตามนิสัยที่ครูสอน รอยยังอยู่ แต่มีรอยอื่นเดินทับมาด้วย รอยอุ้งเท้าสี่ชุด ก้าวสั้น ลึกไม่เท่ากัน สัตว์ที่เดินแบบนั้นคือสัตว์ที่ผอม

    กระต่ายสามตัวที่ห้อยอยู่กับเข็มขัดยังอุ่น กลิ่นเลือดลอยไปข้างหลังตามลม
  encounter:
    foe: wolf
    name: ฝูงหมาป่าผอม
    beats:
      - text: ตัวแรกโผล่ออกมาจากแนวสนทางซ้าย ไม่วิ่ง เดินขนานไปกับ{name}ในระยะที่ธนูยิงถึง ซี่โครงมันนับได้ทุกซี่ อีกสามตัวยังไม่ให้เห็น
        moves:
          - id: wolf_fire
            label: หยุดเดิน ก่อไฟตรงนี้เลย ก่อนจะมืด
            kind: item
            stat: WIS
            tags: [fire]
            success: เปลือกเบิร์ชแห้งในย่ามติดไฟตั้งแต่ประกายแรก {name}เติมกิ่งสนจนเปลวสูงถึงเข่า ตัวที่เดินขนานอยู่หยุด นั่งลงบนหิมะ ห่างออกไปอีกสิบก้าวจากเดิม
          - id: wolf_bow
            label: ขึ้นสายธนู ยิงตัวที่เห็น
            kind: attack
            tags: [ranged, pierce]
          - id: wolf_hare
            label: ปลดกระต่ายตัวหนึ่งโยนไปไกลๆ แล้วเดินต่อ
            kind: item
            stat: DEX
            tags: [bait]
          - id: wolf_stare
            label: หันไปประจันหน้า เดินเข้าหามันสามก้าว
            kind: talk
          - id: wolf_tree
            label: ปีนขึ้นต้นสน
            kind: flee
      - text: ตัวข้างหลังเข้ามาใกล้พอให้ได้ยินเสียงหายใจ ตัวข้างหน้าหยุดเดินแล้วหันมา พวกมันกำลังปิดวง
        answer: guard
        moves:
          - id: wolf_back
            label: ถอยไปยืนหลังชิดโขดหิน ให้มันเข้าได้ทางเดียว
            kind: guard
            success: "{name}ได้หินเย็นๆ แนบหลัง ทีนี้หมาป่าทั้งสี่ตัวอยู่ข้างหน้าหมด ตัวที่ลองอ้อมเข้ามาทางข้างเจอปลายธนูชี้รออยู่ มันถอยกลับไปเข้าแถว"
          - id: wolf_brand
            label: ชูกิ่งสนติดไฟ กวาดเป็นวงรอบตัว
            kind: attack
            tags: [fire]
          - id: wolf_howl
            label: ตะโกนสุดเสียง เคาะมีดกับหัวเข็มขัด
            kind: talk
            tags: [noise]
          - id: wolf_tree2
            label: วิ่งไปที่ต้นสนที่ใกล้ที่สุดแล้วปีน
            kind: flee
      - text: ตัวที่ผอมที่สุดทนไม่ไหวก่อนเพื่อน มันพุ่งเข้ามาต่ำๆ เล็งที่กระต่ายข้างเอว
        answer: quick
        moves:
          - id: wolf_cut
            label: ชักมีดสวนตอนมันกระโจน
            kind: quick
            tags: [edge]
            failure: มีดออกจากฝักช้าไปครึ่งอึดใจ เขี้ยวของมันงับได้ทั้งกระต่ายทั้งเนื้อสะโพกของ{name} มันสะบัดหัวสองทีก่อนจะหลุด หิมะตรงนั้นแดงเป็นวงกว้าง
          - id: wolf_drop
            label: ปลดเข็มขัดทิ้งทั้งเส้น กระต่ายทั้งสามตัว
            kind: item
            stat: DEX
            tags: [bait]
            success: กระต่ายสามตัวตกลงบนหิมะ ตัวที่พุ่งมาเปลี่ยนทางกลางอากาศ อีกสามตัวเข้ามารุมภายในอึดใจเดียว เสียงขู่กันเองดังกว่าตอนที่มันล้อม{name}เสียอีก ไม่มีตัวไหนเงยหน้าขึ้นมา
          - id: wolf_kick
            label: เตะสวนเข้าที่ขากรรไกร
            kind: attack
          - id: wolf_tree3
            label: ปีนขึ้นต้นไม้ทั้งที่มันกัดชายเสื้ออยู่
            kind: flee
      - text: ฟ้ามืดลงจนเห็นแต่ตากับไอปาก ไกลออกไปทางที่พัก มีแสงคบไฟดวงหนึ่งกำลังเคลื่อนมา ยังอีกไกล
        answer: talk
        moves:
          - id: wolf_call
            label: ป้องปากตะโกนเรียกครูพราน ให้เสียงไปถึงก่อนตัว
            kind: talk
            tags: [noise]
          - id: wolf_hold
            label: ยืนนิ่ง ถือไฟไว้ รอให้คบไฟดวงนั้นมาถึง
            kind: guard
            tags: [fire]
          - id: wolf_last
            label: ยิงธนูดอกสุดท้ายใส่ตัวหน้าฝูง
            kind: attack
            tags: [ranged, pierce]
          - id: wolf_tree4
            label: ปีนขึ้นต้นสน รออยู่ข้างบนนั้น
            kind: flee
    win:
      text: |
        ฝูงหมาป่าถอยกลับเข้าแนวสนไปทีละตัว ตัวสุดท้ายหันมามองอีกครั้งก่อนจะหายไป ไม่ได้โกรธ แค่หิวเหมือนเดิม

        ครูพรานมาถึงพร้อมคบไฟ ดูรอยเท้าบนหิมะรอบตัว{name}จนครบวง นับได้สี่ชุด แกไม่ถามสักคำ ยื่นกระติกเหล้าให้ ซึ่งแกไม่เคยยื่นให้ใครที่ยังเป็นลูกมือ
      effects: { stats: { WIS: 1, DEX: 1 }, flags: [faced_winter_wolves] }
    lose:
      text: |
        ครูพรานมาถึงตอนที่{name}ล้มอยู่บนหิมะ แกยิงนัดเดียวขึ้นฟ้า แล้วเหวี่ยงคบไฟเข้าไปกลางฝูง พวกมันแตกไปคนละทาง คาบกระต่ายไปได้ทุกตัว

        ทางกลับที่พัก{name}โดนลากบนเลื่อนขนฟืน ครูพรานเย็บแผลให้ข้างเตา ไม่ดุ บอกแค่ว่าครั้งหน้าถ้ามีเลือดติดตัว ให้เดินทวนลม
      effects: { flags: [mauled_by_wolves] }
    stalemate:
      text: |
        คบไฟของครูพรานมาถึงตอนที่ทั้งสองฝ่ายยังยืนจ้องกันอยู่ หมาป่าถอยออกไปห่างเท่าเดิม แล้วเดินตามทั้งคู่ไปจนถึงชายป่า ไม่เข้าใกล้กว่านั้น ไม่ห่างกว่านั้น

        คืนนั้นครูพรานแขวนกระต่ายไว้นอกรั้วหนึ่งตัว เช้ามาไม่อยู่แล้ว แกบอกว่าบางปีต้องจ่ายค่าเช่าป่า
      effects: { stats: { CON: 1 } }
    flee:
      text: |
        {name}นั่งกอดลำต้นสนอยู่บนกิ่งจนครูพรานมาถึงพร้อมคบไฟกับปืน ข้างล่างหมาป่ากินกระต่ายที่ตกลงไปจนไม่เหลือขน แล้วนอนรออยู่ใต้ต้น

        นิ้วเท้าสองนิ้วของ{name}ชาไปจนถึงหน้าร้อน ครูพรานบอกว่าปีนต้นไม้ไม่ผิด แต่พรานที่ดีต้องรู้ว่าจะลงเมื่อไร
      effects: { stats: { CON: 1 } }
    death:
      text: |
        ตัวที่สี่มาจากข้างหลัง ตัวที่{name}ไม่เคยเห็นเลยตั้งแต่ต้น น้ำหนักของมันลงที่ไหล่ แล้วหิมะก็ขึ้นมารับหน้า

        คบไฟของครูพรานยังอยู่อีกไกล ไกลเกินไป
