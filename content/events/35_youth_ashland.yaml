# วัยรุ่น 12–13 ลูกทีฟลิ่งในแดนเถ้า บ้านหญ้าเงิน (origin_ashland)
# ทางประจำถิ่นคือนักรบ (ผู้เฝ้าผนึกป้อมสาม) เปิดเสมอในพิธี เหตุการณ์ในไฟล์นี้จึงไม่ให้ lean_warrior
# ยกเว้นทางเล่าเรื่องเสียงทุ้มให้จ่ามอร์เดนฟัง ซึ่งเป็นทางของคนที่จะไปเป็นผู้เฝ้าผนึกอยู่แล้ว
# นักบวชของถิ่นนี้รับใช้ออสซา นักบวชออสซาจากป้อมสามมาสลักชื่อคนตายบนแผ่นหินหน้าลานศพ (ธรรมเนียมใหม่ ระบุใน PR)
# ระวังคำว่า "เขา" ที่แปลว่าเขาบนหัว อย่าใช้ "เขา" เป็นสรรพนามในประโยคเดียวกัน

- id: youth.ashland_surveyors
  stage: youth
  weight: 10
  when:
    age: [12, 13]
    flags: [origin_ashland]
  text: |
    ต้นหน้าหนาว ช่างสำรวจคนแคระสามคนจากบริษัทเหมืองในทุนดาร์มาถึงบ้านหญ้าเงิน พร้อมล่อสองตัว ขาตั้งกล้องส่องทาง และหีบไม้ใส่หมุดเหล็กหัวทาสีแดง หัวหน้าช่างชื่อกุลดอร์ หนวดสีเดียวกับเถ้า ถือกระดาษอนุญาตจากเวนทราสที่ประทับครั่งแดงสามดวง

    พวกเขาจะไปเนินหินดำทางเหนือของตอเสา ทางนั้นไม่มีแผ่นไม้ปู เพราะไม่เคยมีใครในหมู่บ้านอยากไป ผู้ใหญ่บ้านอ่านกระดาษจบแล้วยื่นคืน บอกว่าห้ามไม่ได้ แต่ก็ไม่มีผู้ใหญ่คนไหนว่างพาไป ทุกคนต้องลงหลุม

    กุลดอร์จึงมาหาเด็ก ให้วันละเหรียญ เท่าค่าแรงผู้ใหญ่ในหลุมเก้า {name}รับงาน เช้าวันออกเดินทาง ป้อมสามส่งผู้เฝ้าผนึกมาเดินคุมขบวนหนึ่งคน ชื่อไรธัส อายุยังไม่ถึงยี่สิบ เดินรั้งท้ายตลอด และไม่ยอมเปิดปากกับคนแคระสักคำ

    เด็กบ้านหญ้าเงินรู้กันทุกคนว่าเถ้าไม่ได้ลึกเท่ากันทุกที่ ตรงไหนข้างใต้เป็นอุโมงค์เก่าที่ถล่มไปแล้ว เถ้าข้างบนจะดูแน่นพอๆ กับที่อื่น จนกว่าจะมีใครเหยียบลงไป
  choices:
    - id: long_way
      label: พาเดินอ้อมไปตามสันที่หญ้าเงินขึ้น ถึงจะช้ากว่าเดิมสองวัน
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          คนแก่ในหมู่บ้านสอนเด็กว่าหญ้าเงินไม่ขึ้นบนเถ้าที่ข้างใต้กลวง แต่ยังไม่เคยมีใครเดินตามหญ้าเงินไปไกลขนาดนี้ {name}เดินนำ ก้มดูทีละกอ บางช่วงสันแคบเหลือแค่ไหล่คน ต้องคลานไป ล่อเดินตามรอยเท้าทุกก้าว

          วันที่ห้าขบวนถึงเนินหินดำ ช่างสำรวจปักหมุดแดงสิบสองหมุดเป็นวงรอบเนิน จากตรงนั้น ตอเสาอยู่ใกล้จนต้องแหงนคอ ไรธัสยืนดูคนแคระตอกหมุดจนหมุดสุดท้ายลง แล้วถ่มน้ำลายลงบนเถ้า

          ขากลับกุลดอร์จ่ายครบห้าวัน แถมให้อีกหนึ่ง แล้วถามว่าปีหน้าบริษัทส่งคนมาอีก จะมานำทางให้อีกไหม
        effects: { stats: { WIS: 1 }, gold: 6, flags: [lean_ranger, guided_surveyors] }
      failure:
        text: |
          สันหญ้าเงินขาดเป็นช่วงๆ {name}ต้องเดาทางระหว่างกอหญ้าสองกอที่ห่างกันสิบก้าว เดาถูกเก้าครั้ง ครั้งที่สิบ ล่อตัวหน้าก้าวลงไปในเถ้าจนจมถึงท้อง

          ล่อร้องเหมือนคน ไรธัสโยนเชือกมาให้ {name}คล้องรอบคอมัน แล้วทุกคนดึงพร้อมกัน ดึงจนเชือกบาดฝ่ามือ{name}เป็นทางยาวทั้งสองข้าง ล่อขึ้นมาได้ แต่ขาตั้งกล้องที่ผูกอยู่บนหลังหลุดจมลงไปแทน ช่างสำรวจต้องหันหลังกลับวันนั้น กุลดอร์จ่ายให้แค่สองวันที่เดินมา
        effects: { stats: { WIS: 1 }, hp: -1, gold: 2, flags: [lean_ranger] }
    - id: walk_circles
      label: พาเดินวนให้ครบสามวัน แล้วบอกว่าข้างหน้าไปต่อไม่ได้
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          คนแคระชินกับภูเขาที่มีหน้าผาไว้ให้จำ พอมาอยู่บนเถ้าที่ทุกทิศหน้าตาเหมือนกัน ก็เหมือนคนปิดตาเดิน ตอเสาใหญ่เท่าภูเขา เดินเข้าหาทั้งวันก็ดูไม่ใกล้ขึ้น สามวันนั้น{name}จึงพาขบวนเดินโค้งไปโค้งมา โดยที่ไม่มีใครรู้ว่าได้เข้าใกล้มันจริงหรือเปล่า

          บ่ายวันที่สาม {name}พาทุกคนไปหยุดที่ขอบเถ้าสีเหลืองผืนหนึ่ง แล้วโยนก้อนหินลงไป หินจมหายโดยไม่มีเสียง "ข้างหน้าเป็นอย่างนี้ทั้งหมด" {name}บอก เถ้าเหลืองผืนนั้นกว้างไม่ถึงลานนวดข้าว

          กุลดอร์เขียนลงแผนที่ว่า ผ่านไม่ได้ แล้วจ่ายครบสามวัน ไรธัสผิวปากเป็นเพลงไปตลอดทางกลับหมู่บ้าน
        effects: { stats: { CHA: 1 }, gold: 3, flags: [lean_rogue, misled_surveyors] }
      failure:
        text: |
          เช้าวันแรก กุลดอร์แอบปักหมุดแดงไว้ข้างกองหินกองหนึ่ง บ่ายวันที่สอง ขบวนเดินกลับมาเจอหมุดนั้น

          กุลดอร์ถอนหมุดขึ้นมา เช็ดเถ้าออกกับขากางเกง เก็บลงหีบ แล้วจ่ายให้{name}วันเดียว "อีกวันข้าไม่จ่าย" แกว่า "ถือเป็นค่าสอนเดินวน"

          รุ่งขึ้นคนแคระทั้งสามออกเดินกันเอง ไรธัสตามไป สี่วันต่อมาคนกลับมาครบ แต่ล่อเหลือตัวเดียว
        effects: { stats: { DEX: 1 }, gold: 1, flags: [lean_rogue] }
    - id: go_between
      label: รับเป็นคนเดินคำพูดระหว่างกุลดอร์กับไรธัส
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          กุลดอร์พูดกับ{name} {name}เดินไปท้ายขบวนพูดกับไรธัส ไรธัสตอบ {name}เดินกลับมาหัวขบวน เป็นอย่างนั้นทั้งวัน ระยะที่{name}เดินจึงเกือบเป็นสองเท่าของคนอื่น

          คำของกุลดอร์ไปถึงไรธัสสุภาพกว่าตอนออกจากปาก คำของไรธัสไปถึงกุลดอร์ก็เหมือนกัน คืนที่สามทั้งสองนั่งกองไฟเดียวกันเป็นครั้งแรก เพราะไม่มีใครอยากออกแรงก่ออีกกอง ไรธัสยื่นถุงหญ้าเงินคั่วให้ กุลดอร์เคี้ยวไปคำหนึ่งแล้วทำหน้าเหมือนโดนต่อย สองคนหัวเราะออกมาพร้อมกัน แล้วหยุดพร้อมกัน เหมือนเพิ่งนึกได้ว่าไม่ควร

          ครบห้าวัน กุลดอร์นับค่าจ้างใส่มือ{name}ห้าเหรียญ ก่อนแยกทาง ไรธัสบอก{name}ว่าคราวหน้าป้อมสามมีงานเดินข่าว จะมาตาม
        effects: { stats: { CHA: 1 }, gold: 5, reputation: { wardens: 1 }, flags: [ash_go_between] }
      failure:
        text: |
          วันที่สอง กุลดอร์พูดว่าผู้เฝ้าผนึกเฝ้าตอไม้มาสามร้อยปี จนตัวเองกลายเป็นตอไม้ไปด้วย {name}เหนื่อยจนลืมเกลา ส่งไปถึงไรธัสครบทุกคำ

          สองคนนั้นตรงเข้าหากันกลางขบวน ศอกของใครสักคนฟาดโดนหน้า{name}ที่ยืนขวางอยู่ตรงกลาง เลือดกำเดาหยดลงบนเถ้า ทั้งคู่ชะงักมือ ช่วยกันหาผ้ามาอุดจมูกให้ แล้วไม่ยอมสบตากันอีกเลยจนครบห้าวัน ค่าจ้างของ{name}ได้ครบทุกเหรียญ
        effects: { stats: { WIS: 1 }, hp: -1, gold: 5, flags: [lean_bard] }

- id: youth.ashland_names_stone
  stage: youth
  weight: 10
  when:
    age: [12, 13]
    flags: [origin_ashland]
  text: |
    กะดึกของหลุมเก้าหามลุงโอเบนขึ้นมาตอนตีสาม ตัวแกไม่มีแผลสักแห่ง แต่สั่นจนฟันกระทบกันได้ยินถึงนอกบ้าน คนที่หามมาเล่าว่าผีถ่านเกาะหลังแกอยู่สามตัว กว่าจะมีใครเห็น ตะเกียงบนหมวกแกก็ดับไปนานแล้ว

    ป้าเมลา เมียลุงโอเบน ก่อไฟจนเตาแดง ไปยืมผ้าห่มบ้านข้างๆ มาสุมจนหมดหมู่บ้าน {name}จับมือลุงโอเบนไว้ มือนั้นเย็นเหมือนเหล็กหน้าหนาว ใกล้รุ่งแกหยุดสั่น ห้องทั้งห้องเพิ่งร้อนจนทุกคนเหงื่อแตกก็ตอนนั้น

    สามวันต่อมา นักบวชออสซาจากป้อมสามขี่ม้ามาพร้อมสิ่วกับค้อน มาสลักชื่อลุงโอเบนลงบนแผ่นหินหน้าลานศพ หัวแผ่นหินสลักรูปประตูปิด ใต้ประตูมีชื่อคนบ้านหญ้าเงินอยู่สามแถว ลึกบ้างตื้นบ้างตามมือนักบวชแต่ละรุ่น

    วันเดียวกัน ถุงจดหมายของจ่ามอร์เดนก็มีซองจากบริษัทเหมืองมาด้วยซองหนึ่ง จ่าหน้าถึงป้าเมลา ป้าอ่านหนังสือไม่ออก
  choices:
    - id: hold_chisel
      label: ช่วยนักบวชสลักชื่อ แล้วอยู่เฝ้าแผ่นหินกับป้าจนเช้า
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          นักบวชเป็นชายแก่ มือสั่นจนจับสิ่วไม่ค่อยอยู่ แกให้{name}จับสิ่วไว้ แล้วตอกค้อนเอง ทีละตัวอักษร {name}ต้องเลื่อนสิ่วตามเส้นดินสอที่แกขีดไว้ ตอกพลาดไปครึ่งเส้นผมก็เห็น

          ชื่อเสร็จตอนพลบค่ำ ป้าเมลานั่งลงข้างแผ่นหิน เอานิ้วลูบชื่อสามีที่ยังมีผงหินติดอยู่ ลูบไปลูบมาจนผงหมด {name}นั่งอยู่อีกข้างจนฟ้าสาง

          ก่อนขึ้นม้า นักบวชถามชื่อ{name} แล้วจดลงสมุดที่ห้อยเอว บอกว่าคราวหน้าบ้านหญ้าเงินมีชื่อต้องสลักอีก แกจะส่งข่าวมาตาม{name}ก่อน มือแกเหลือแรงตอกอีกไม่กี่ชื่อแล้ว
        effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [lean_cleric, carved_names_stone] }
      failure:
        text: |
          ตัวอักษรที่สี่ สิ่วลื่นไปทางขวา ขีดหางยาวเกินไปหนึ่งข้อนิ้ว ชื่อลุงโอเบนบนแผ่นหินจึงอ่านเหมือนชื่อคนอื่น

          {name}จะขอสลักใหม่ข้างล่าง นักบวชส่ายหัว บอกว่าแผ่นหินมีที่ให้คนละบรรทัด ป้าเมลาเดินมาดู แล้วหัวเราะออกมาเป็นครั้งแรกตั้งแต่คืนนั้น ลุงโอเบนเองก็เขียนชื่อตัวเองหางยาวแบบนี้ทุกครั้ง
        effects: { stats: { WIS: 1 }, flags: [lean_cleric] }
    - id: read_letter
      label: อ่านจดหมายของบริษัทให้ป้าเมลาฟัง
      check: { stat: INT, dc: 12 }
      success:
        text: |
          จดหมายยาวหนึ่งหน้าครึ่ง หน้าแรกเสียใจกับครอบครัว หน้าหลังเป็นตัวเลข ค่าทำขวัญสามสิบเหรียญ หักค่าตะเกียงที่ทำหาย หักค่าหมวก หักกะที่ทำไม่ครบอีกครึ่งกะ

          {name}อ่านสองรอบ แล้วเอาถ่านเขียนตัวเลขลงบนพื้นบ้าน ค่าตะเกียงโดนหักสองครั้ง ครั้งหนึ่งในชื่อค่าตะเกียง อีกครั้งในชื่อค่าอุปกรณ์

          วันรุ่งขึ้น{name}เดินไปหลุมเก้ากับป้าเมลา ยื่นจดหมายให้เสมียนบริษัท ชี้บรรทัดที่ซ้ำ เสมียนนับใหม่อยู่สองรอบ แล้วนับเหรียญคืนให้สี่เหรียญ ไม่ขอโทษ ไม่เงยหน้า
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [read_company_letter] }
      failure:
        text: |
          {name}อ่านหน้าซองจดหมายในหมู่บ้านออกทุกฉบับ แต่ภาษาของบริษัทไม่เหมือนหน้าซอง ค่าชดเชยตามข้อสี่วรรคสอง หักตามระเบียบอุปกรณ์ ทุกคำอ่านออก แต่ต่อกันแล้วไม่รู้เรื่อง

          {name}อ่านให้ฟังทีละคำจนจบ ป้าเมลาบอกว่าเข้าใจแล้ว {name}ก็บอกว่าเข้าใจ สัปดาห์ต่อมาป้าไปพิมพ์ลายนิ้วมือรับเงินที่หลุมเก้า กลับมาก็นับเหรียญบนโต๊ะสามรอบ ได้ยี่สิบเอ็ด
        effects: { stats: { INT: 1 }, flags: [lean_wizard] }
    - id: sing_miners
      label: ร้องเพลงคนขุดถ่านตอนฝังลุงโอเบน
      check: { stat: CHA, dc: 11 }
      success:
        text: |
          เพลงคนขุดถ่านมีสี่ท่อน ร้องตอนลงหลุมเช้า ไม่เคยมีใครร้องตอนฝังศพ

          ลงหลุมเมื่อฟ้ายังไม่สาง
          ถือถ่านแดงกลางฟ้าดำ
          ขึ้นหลุมเมื่อดาวขึ้นนำ
          นับหัวกันซ้ำทุกคืน

          {name}ร้องท่อนแรกคนเดียว ท่อนที่สองคนงานกะเช้าที่ยืนอยู่รอบหลุมศพร้องตามทีละคน พอถึงท่อนสุดท้าย เสียงต่ำของผู้ชายสิบกว่าคนก็ดังจนเถ้าบนหลังคาบ้านใกล้ๆ ร่วงลงมาเป็นสาย คนกะเช้าไปถึงปากเหมืองสายไปครึ่งชั่วยามวันนั้น หัวหน้ากะก็ไม่ได้ว่าอะไร
        effects: { stats: { CHA: 1 }, flags: [lean_bard, sang_miners_song] }
      failure:
        text: |
          ปีนี้เสียงของ{name}เริ่มแตก ร้องท่อนแรกได้ครึ่งท่อน เสียงก็พลิกเป็นเสียงเป็ด {name}หยุดร้องกลางคำ หน้าร้อนจนหูแดง

          ตาแก่คนหนึ่งในกะเช้าร้องต่อจากคำที่ค้างไว้ คนที่เหลือร้องตาม จนจบทั้งสี่ท่อน {name}ยืนอยู่หัวหลุมศพ ฟังเพลงที่ตัวเองขึ้นต้นเดินต่อไปโดยไม่มีตัวเองอยู่ในนั้น
        effects: { stats: { CHA: 1 }, flags: [lean_bard] }

- id: youth.ashland_voice_price
  stage: youth
  weight: 12
  when:
    age: [12, 13]
    flags: [origin_ashland, demon_bargain_small]
  text: |
    ตั้งแต่ปีที่{name}ฝันถึงเสียงนั้น ก็ไม่มีหมาเถ้าตัวไหนเข้าใกล้บ้าน{name}อีกเลย คนในหมู่บ้านพูดกันว่าบ้านนี้ดวงดี บางบ้านมาขอขี้เถ้าจากเตาไปโรยหน้าประตูตัวเอง เถ้าข้างนอกลึกถึงเข่า แต่ทุกคนอยากได้เถ้าจากเตาบ้านนี้

    คืนหนึ่งที่ฟ้าครึ้ม เสียงทุ้มกลับมาในฝัน สุภาพเหมือนเดิม

    "ถึงเวลาแล้ว" เสียงนั้นว่า "ไม่มากหรอก พรุ่งนี้จ่ามอร์เดนจะมา ในถุงจดหมายมีซองหนึ่งประทับครั่งสีเทา จ่าหน้าถึงกรมเหมืองหลวงที่เวนทราส ข้าอยากให้ซองนั้นไปไม่ถึง โยนลงเถ้าตรงไหนก็ได้ ข้าไม่เลือก"

    แล้วก็ไปเลย ไม่รอคำตอบ

    {name}ตื่นมาตอนฟ้ายังมืด เปิดหน้าต่างดู มีรอยเท้าหมาเถ้าวนรอบบ้านข้างๆ สองรอบ ไม่มีรอยไหนเข้ามาใกล้บ้านตัวเองแม้แต่รอยเดียว
  choices:
    - id: obey
      label: ช่วยจ่าคัดจดหมาย แล้วซ่อนซองนั้นเข้าแขนเสื้อ
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          จ่ามอร์เดนเทถุงจดหมายลงบนชานบ้านผู้ใหญ่บ้านเหมือนทุกเดือน {name}นั่งลงช่วยคัดซองของหมู่บ้านออกจากซองที่ต้องส่งต่อ ซองครั่งเทาอยู่เกือบก้นถุง หนาเกือบเท่านิ้วโป้ง เข้าไปอยู่ในแขนเสื้อตอนที่จ่าหันไปรับน้ำจากผู้ใหญ่บ้าน

          บ่ายวันนั้น{name}เดินออกไปบนแผ่นไม้จนสุดทาง เอากิ่งไม้กดซองลงไปในเถ้าจนมองไม่เห็น ก่อนซองจะจมมิด {name}เห็นลายมือบนหน้าซองชัดๆ ลายมือเดียวกับที่เขียนคำว่า ผนึก บนกระดานชนวนให้เด็กบ้านหญ้าเงินอ่านมาทุกรุ่น

          คืนนั้นเสียงทุ้มมาแค่ครู่เดียว พูดคำเดียวว่า ขอบใจ
        effects: { stats: { DEX: 1 }, world: { demon: 1 }, flags: [lean_rogue, paid_the_voice, sank_mordan_letter] }
      failure:
        text: |
          ซองยังเข้าแขนเสื้อไปไม่ถึงครึ่ง มือใหญ่หยาบของจ่ามอร์เดนก็วางลงบนข้อมือ{name}

          จ่าดึงซองออกมา พลิกดูครั่งสีเทา แล้วเก็บเข้าเสื้อคลุมตัวเองแทนถุง "ใครใช้มา" แกถาม {name}ส่ายหน้า จ่ามองหน้า{name}จนอีกฝ่ายต้องหลบตา แล้วเก็บถุงขึ้นม้าออกไป วันนั้นไม่มีการสอนหนังสือบนชาน เดือนต่อมาแกก็ไม่แวะสอน

          คืนนั้นเสียงทุ้มมาหา "ไม่เป็นไร" เสียงนั้นว่า "เจ้าทำแล้ว ข้านับให้"
        effects: { stats: { DEX: 1 }, world: { demon: 1 }, reputation: { wardens: -1 }, flags: [lean_rogue, paid_the_voice, mordan_caught_letter] }
    - id: stay_awake
      label: ไปนั่งที่แผ่นหินหน้าลานศพทั้งคืน ไม่ยอมหลับ
      habit: stubborn
      text: |
        เสียงทุ้มมาได้แต่ในฝัน {name}จึงไม่ยอมฝัน คืนนั้นนั่งพิงแผ่นหินชื่อคนตายจนรุ่งเช้า หนาวจนต้องเอาเถ้ากลบขาไว้ ง่วงเมื่อไหร่ก็เอานิ้วไล่ตามรอยประตูปิดที่หัวแผ่นหิน ไล่จนจำได้ทุกเส้น จ่ามอร์เดนมาถึงตอนสาย คัดจดหมาย แล้วเอาถุงขึ้นม้าออกไป ซองครั่งเทาก็ไปด้วย

        คืนต่อมา{name}หลับเป็นตาย เสียงทุ้มไม่มา

        ใกล้เที่ยงคืน มีเสียงเล็บข่วนแผ่นไม้ใต้ถุนบ้าน ข่วนวนรอบบ้านช้าๆ หนึ่งรอบ แล้วอีกรอบ เช้ามา{name}ออกไปดู รอยเท้าบนเถ้าเป็นของหมาเถ้าตัวเดียว รอยใหญ่เท่าของเจ้าหูแหว่ง
      effects: { stats: { WIS: 1 }, clear_flags: [demon_bargain_small], flags: [lean_cleric, refused_the_voice] }
    - id: tell_mordan
      label: เล่าเรื่องเสียงทุ้มให้จ่ามอร์เดนฟังทั้งหมด ตั้งแต่ข้อตกลงคืนแรก
      text: |
        จ่ามอร์เดนฟังไปคัดจดหมายไป ไม่ขัดสักคำ พอ{name}เล่าจบ แกก็หยิบซองครั่งเทาขึ้นมาจากก้นถุง

        "ฉบับนี้ข้าเขียนเอง" แกว่า "ปีละฉบับ สิบปีแล้ว ไม่เคยมีใครตอบกลับมาสักฉบับ" แกพลิกซองไปมา "มันอยากให้ฉบับนี้หาย ก็แปลว่าที่เวนทราสมีคนอ่าน"

        แกเก็บซองเข้าเสื้อคลุม ไม่ใส่คืนถุง ก่อนขึ้นม้า แกบอกให้คืนนี้ปิดหน้าต่างให้สนิท และให้{father}เอาขวานมาวางไว้ข้างประตู เดือนหน้าให้{name}ไปป้อมสาม เล่าเรื่องเดียวกันนี้ให้ผู้บัญชาการฟังด้วยปากตัวเอง

        คืนนั้นหมาเถ้าวนรอบบ้านจนเช้า {name}นั่งฟังเสียงเล็บอยู่ข้างประตูกับ{father} ขวานอยู่ระหว่างสองคน
      effects: { stats: { CON: 1 }, reputation: { wardens: 1 }, clear_flags: [demon_bargain_small], flags: [lean_warrior, told_mordan_voice] }
