# เรื่องเติมช่องว่าง วัยหนุ่มสาว อายุ 15 ถึง 17 เกิดซ้ำได้ (once: false) น้ำหนักต่ำ ถิ่นละเรื่อง
# เน้นกำลังกับว่องไว เพราะเรื่องตามทางส่วนใหญ่ทอยเสน่ห์ ญาณ และปัญญา
# ห้ามใช้ {father} {mother} เวนทราสต้องเป็นเรื่องที่ทั้งเมืองเห็นพร้อมกัน
# ไอเลธมีทั้งเอลฟ์บนกิ่งไม้และพรานที่ย้ายมาอยู่หมู่บ้านชายป่า แดนเถ้ามีทั้งหมู่บ้านทีฟลิ่งและป้อมผู้เฝ้าผนึก

- id: youth.filler_late_arvel
  stage: youth
  weight: 1
  once: false
  when:
    age: [15, 17]
    location_tag: arvel_village
  text: |
    เกี่ยวข้าวเสร็จทั้งถิ่นแล้ว งานเลี้ยงปิดลานจัดที่ลานนวดข้าวใหญ่ของเมืองตลาด คนมาจากทุกหมู่บ้านรอบเสาของอีเซล มีแผงขายขนมทอด มีวงซอสองวงที่เล่นแข่งกันว่าวงไหนดังกว่า

    ตกบ่ายมีการละเล่นของคนหนุ่มสาว ชักเย่อเชือกฟางระหว่างหมู่บ้าน กับเสาไม้ทาไขมันหมูสูงสามช่วงตัว บนยอดเสาแขวนห่อผ้าไว้ ข้างในเป็นอะไรไม่มีใครรู้
  choices:
    - id: tug_of_war
      label: ลงไปดึงเชือกให้หมู่บ้านตัวเอง
      text: |
        เชือกฟางบาดฝ่ามือตั้งแต่ดึงครั้งแรก {name}ยืนอยู่คนที่สามจากหัวเชือก ยันส้นเท้าลงดินจนเป็นร่อง หมู่บ้านตรงข้ามล้มลงไปกองกันทั้งแถวในยกที่สาม คนแก่ในหมู่บ้านเลี้ยงเหล้าหวานทุกคนที่ดึงเชือก ฝ่ามือ{name}แดงเป็นรอยเชือกไปสามวัน
      effects: { stats: { STR: 1 } }
    - id: greased_pole
      label: ปีนเสาทาไขมัน ไปเอาห่อผ้าบนยอด
      text: |
        คนที่ปีนก่อนหน้าเช็ดไขมันออกไปครึ่งเสาแล้ว {name}ใช้ขากับเข่าหนีบ ปีนทีละคืบ ไถลลงมาสองหน ขึ้นไปใหม่สองหน มือแตะห่อผ้าได้ตอนคนข้างล่างเริ่มเลิกเชียร์ ในห่อเป็นรองเท้าหนังใหม่หนึ่งคู่ ใหญ่ไปสองนิ้ว ใส่ถุงเท้าสองชั้นก็พอดี
      effects: { stats: { DEX: 1 } }
    - id: fry_stall
      label: ไปช่วยแผงขนมทอดของยายที่มือไม่ไหวแล้ว
      text: |
        ยายเจ้าของแผงยืนทอดคนเดียวมาตั้งแต่เช้า {name}ยืนหน้ากระทะแทนไปจนค่ำ น้ำมันกระเด็นใส่แขนเป็นจุดๆ จนนับไม่ถ้วน ตอนเก็บแผง ยายยัดเหรียญใส่มือให้สองเหรียญ กับขนมทอดที่ขายไม่หมดอีกครึ่งตะกร้า
      effects: { stats: { CON: 1 }, gold: 2 }

- id: youth.filler_late_ventras
  stage: youth
  weight: 1
  once: false
  when:
    age: [15, 17]
    location_tag: ventras
  text: |
    น้ำทะเลหนุนขึ้นมาพร้อมลมใต้สามวันสามคืน ปากแม่น้ำล้นเข้าย่านท่าเรือ น้ำขึ้นมาถึงเอวในตรอกที่ต่ำที่สุด ตะเกียงฟ้าตามถนนเรียบแม่น้ำจมน้ำดับไปทีละต้น ทั้งเมืองเห็นแสงไฟหายไปจากริมน้ำทีละช่วง

    ราชนาวีส่งทหารมาแจกกระสอบทราย โรงกลั่นริมน้ำดับหม้อทุกโรง คนทั้งเมืองที่ขาไม่จมน้ำลงมาช่วยกันตั้งแต่หัวค่ำ
  choices:
    - id: sandbags
      label: แบกกระสอบทรายไปวางกั้นปากตรอก
      text: |
        กระสอบทรายเปียกหนักเท่าเด็กห้าขวบ {name}แบกไปวางทีละกระสอบ ต่อแถวกับคนที่ไม่รู้จักชื่อ คนแบกข้างหน้าเป็นนายทหารราชนาวีที่ถอดเสื้อนอกทิ้งไว้ตั้งแต่กระสอบที่สิบ ใกล้สางกำแพงกระสอบสูงถึงอก น้ำหยุดอยู่หน้ากำแพงนั้น
      effects: { stats: { STR: 1 } }
    - id: row_people_out
      label: ยืมเรือพายลำเล็ก ไปรับคนที่ติดอยู่ชั้นบนของบ้านริมน้ำ
      text: |
        กระแสน้ำในตรอกไหลแรงกว่าแม่น้ำ เรือหมุนทุกครั้งที่เลี้ยวหัวมุม {name}พายไปกลับห้ารอบ รับคนแก่สองคน เด็กสามคน กับหมาที่ไม่ยอมให้ใครอุ้มนอกจากเด็กคนเล็กที่สุด รอบสุดท้ายเรือครูดหลังคาจมน้ำจนท้องเรือรั่ว พายกลับมาถึงฝั่งได้พอดี
      effects: { stats: { DEX: 1 } }
    - id: fish_the_crates
      label: ไปยืนท้ายน้ำ ดักลังสินค้าที่ลอยหลุดมาจากโกดัง
      text: |
        ลังไม้ลอยมาตามน้ำทีละใบ บางใบเปล่า บางใบหนักจนเกือบจม {name}ใช้ไม้ตะขอดึงเข้าฝั่งได้สี่ใบ ในนั้นเป็นเทียนไขแช่น้ำ ผ้าปูโต๊ะ กับขวดเหล้าที่ไม่แตกหกขวด เจ้าของโกดังมาตามหาตอนสาง {name}คืนให้ห้าขวด เจ้าของโกดังทำเป็นนับไม่ครบ
      effects: { stats: { DEX: 1 }, gold: 2, alignment: { law: -1 } }

- id: youth.filler_late_hordun
  stage: youth
  weight: 1
  once: false
  when:
    age: [15, 17]
    location_tag: hordun
  text: |
    หินถล่มลงมาปิดทางเกวียนเส้นล่างตอนกลางคืน ก้อนที่ใหญ่ที่สุดใหญ่เท่าบ้านหนึ่งหลัง ทางเส้นนั้นเป็นทางเดียวที่ส่งข้าวขึ้นมาจากตีนเขา ถ้าไม่เปิดภายในสิบวัน ครัวทุกบ้านในชั้นล่างจะเริ่มนับมันฝรั่งเป็นหัว

    ทุกตระกูลส่งคนมาตระกูลละสามคน คนแก่ที่สุดของแต่ละบ้านยืนดูอยู่ข้างทาง ชี้ว่าก้อนไหนต้องย้ายก่อน ก้อนไหนห้ามแตะ
  choices:
    - id: haul_stone
      label: ลงไปงัดหินกับคนอื่น
      text: |
        งานคืองัดหินด้วยชะแลงเหล็กยาวสองช่วงแขน ยกขึ้นเกวียน ลากไปทิ้งริมผา {name}งัดอยู่สิบวันจนมือด้านทับมือด้าน คืนที่สิบ เกวียนข้าวเล่มแรกผ่านขึ้นมาได้ คนขับโยนมันฝรั่งให้คนงัดหินคนละหัว ทุกคนหัวเราะ แต่ไม่มีใครโยนทิ้ง
      effects: { stats: { STR: 1 }, reputation: { dwarf_council: 1 } }
    - id: check_the_cliff
      label: ไต่ขึ้นไปดูหินบนผาว่ามีก้อนไหนจะหล่นซ้ำ
      text: |
        {name}ผูกเชือกที่เอว ไต่ขึ้นไปตามรอยแตกของผา เคาะหินทีละก้อนแล้วฟังเสียง ก้อนที่เสียงกลวงทำเครื่องหมายด้วยชอล์กแดง ได้สิบสองก้อน วันรุ่งขึ้นคนงานงัดก้อนที่ทำเครื่องหมายลงมาก่อนทีละก้อน ก้อนที่สิบสองหล่นลงมาเองก่อนจะมีใครไปแตะ ตรงจุดที่{name}ยืนเคาะเมื่อวาน
      effects: { stats: { DEX: 1 } }
    - id: carry_soup
      label: แบกหม้อซุปจากครัวชั้นล่างลงไปให้คนงานทุกเที่ยง
      text: |
        หม้อซุปหนักกว่าหิน บันไดจากครัวลงไปถึงทางเกวียนมีสองร้อยกว่าขั้น {name}แบกลงไปทุกเที่ยงสิบวันติด ห้ามหก ห้ามเย็น คนงานแก่คนหนึ่งบอกว่าซุปวันที่เจ็ดเค็มเกินไป แต่ขอเติมสองชาม
      effects: { stats: { CON: 1 } }

- id: youth.filler_late_ileth
  stage: youth
  weight: 1
  once: false
  when:
    age: [15, 17]
    location_tag: ileth
  text: |
    พายุผ่านป่าไอเลธมาทั้งคืน ตอนเช้าต้นไม้ใหญ่ต้นหนึ่งล้มขวางลำธาร รากทั้งรากงัดขึ้นมาจากดิน สูงกว่าหลังคาบ้าน น้ำในลำธารเริ่มเอ่อขึ้นมาท่วมทางเดินด้านล่าง ปลาในบ่อพักน้ำลอยหงายท้องไปแล้วครึ่งบ่อ

    คนที่ขาว่างทุกคนลงมาที่ลำธาร ทั้งคนบนกิ่งและคนชายป่า พรานแก่คนหนึ่งบอกว่าต้นนี้อายุมากกว่าทุกคนที่ยืนอยู่ตรงนี้รวมกัน ต้องตัดให้ถูกจุด ไม่อย่างนั้นทั้งต้นจะพลิกทับคนข้างล่าง
  choices:
    - id: drag_logs
      label: ช่วยลากท่อนไม้ที่ตัดแล้วขึ้นจากน้ำ
      text: |
        ท่อนไม้แต่ละท่อนต้องใช้คนหกคน {name}ลุยน้ำถึงเอวทั้งวัน มือเกาะเชือกลาก ลากขึ้นฝั่งได้เจ็ดท่อนก่อนพลบค่ำ คืนนั้นน้ำในลำธารลดลงจนเห็นก้อนหินเดิม {name}หลับไปทั้งที่ยังนั่งกินข้าว ชามยังอยู่ในมือ
      effects: { stats: { STR: 1 } }
    - id: climb_the_crown
      label: ปีนขึ้นไปบนลำต้นที่ล้ม ตัดกิ่งที่ค้างกันลำต้นอยู่
      text: |
        พรานแก่ชี้ให้ดูกิ่งสามกิ่งที่ค้ำลำต้นไว้กับตลิ่ง ถ้าตัดผิดกิ่ง ต้นไม้จะกลิ้ง {name}ไต่ขึ้นไปตามลำต้นที่ยังเปียกฝน ตัดกิ่งแรก ลำต้นขยับ ทุกคนข้างล่างวิ่งหนี ตัดกิ่งที่สอง ลำต้นทรุดลงไปนอนนิ่งกับพื้นพอดี กิ่งที่สามพรานแก่บอกว่าไม่ต้องตัดแล้ว
      effects: { stats: { DEX: 1 } }
    - id: save_the_fish
      label: ไปช้อนปลาที่ยังไม่ตายจากบ่อพักน้ำไปปล่อยต้นลำธาร
      text: |
        {name}ช้อนปลาใส่ถังไม้ทีละถัง แบกเดินทวนลำธารไปปล่อยที่น้ำยังใส ไปกลับสิบเอ็ดรอบ ปลาที่รอดมีเกินครึ่ง เด็กเล็กสองคนเดินตามมาช่วยตั้งแต่รอบที่สี่ ตั้งชื่อปลาให้ทุกตัวที่ปล่อย จำได้แค่สามชื่อ
      effects: { stats: { CON: 1, WIS: 1 } }

- id: youth.filler_late_ashland
  stage: youth
  weight: 1
  once: false
  when:
    age: [15, 17]
    location_tag: ashland
  text: |
    พายุเถ้ามาตอนบ่าย ฟ้าทางตอเสามืดลงก่อน แล้วลมก็พัดเถ้าร้อนมาเป็นกำแพงสีเทา ทุกคนอุดประตูหน้าต่างด้วยผ้าเปียก นั่งรอในความมืดอยู่สองวันสองคืน ฟังเสียงเถ้าเม็ดเล็กๆ ซัดฝาบ้านเหมือนฝนที่ไม่เปียก

    พายุผ่านไปตอนเช้าวันที่สาม เถ้ากองสูงถึงหน้าต่าง บ่อน้ำกลางถิ่นจมหายไปทั้งบ่อ หลังคาบางหลังทรุดลงมาเพราะน้ำหนักเถ้า
  choices:
    - id: dig_the_well
      label: ขุดเถ้าออกจากบ่อน้ำ
      text: |
        เถ้าข้างบนเย็นแล้ว แต่ลึกลงไปยังอุ่นเหมือนขี้เถ้าในเตาเมื่อคืน {name}ขุดด้วยพลั่วไม้จนพลั่วหัก ขุดด้วยมือต่อจนเล็บดำ ตกเย็นถึงขอบบ่อ เช้าวันต่อมาตักน้ำขึ้นมาได้ถังแรก น้ำมีรสเถ้าไปอีกครึ่งเดือน แต่ทุกบ้านก็ดื่ม
      effects: { stats: { STR: 1 } }
    - id: clear_roofs
      label: ปีนขึ้นหลังคาที่ใกล้ทรุด กวาดเถ้าลงก่อนจะพังลงมาอีก
      text: |
        หลังคาที่กองเถ้าหนาแอ่นลงตรงกลางเหมือนท้องวัว {name}ขึ้นไปทีละหลัง เหยียบตามแนวคาน กวาดเถ้าลงทีละกอง กวาดได้เจ็ดหลังก่อนค่ำ หลังที่แปดทรุดลงไปตอน{name}เพิ่งก้าวลงบันได ในบ้านไม่มีใครอยู่ คนในบ้านนั่งกินข้าวอยู่ที่บ้านข้างๆ
      effects: { stats: { DEX: 1 } }
    - id: walk_the_houses
      label: เดินไปเคาะประตูทุกบ้าน ดูว่ายังมีใครอยู่ข้างในบ้าง
      text: |
        {name}เดินเคาะประตูทีละบ้าน บ้านไหนไม่ตอบก็ขุดเถ้าหน้าประตูออกเอง บ้านหลังที่สิบเอ็ดมีคนแก่นั่งอยู่ในความมืดคนเดียว ผ้าเปียกที่อุดประตูแห้งกรอบไปตั้งแต่คืนแรก แกไอจนพูดไม่ได้ แต่ยังชี้ให้{name}ไปเปิดหม้อข้าวที่หุงไว้ให้คนที่มาเคาะ
      effects: { stats: { CON: 1, CHA: 1 } }
