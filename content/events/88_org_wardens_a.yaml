# ชุด 3 องค์กร: ภาคีผู้เฝ้าผนึก (wardens) ไฟล์ ก ทางเข้า 4 เรื่อง กับงานที่ภาคีส่งมา 10 เรื่อง
# สมาชิกคือทุกคนที่มี job_wardens หรือ job_fort_priest ข้อความต้องอ่านได้ทั้งคนยืนแนวและนักบวชประจำป้อม นักบวชมีทางของตัวเองผ่าน requires: { flag: job_fort_priest }
# คนประจำของป้อมสาม (มีแต่ในข้อความ ไม่อยู่ในผังคน): บรอนกา ตระกูลบันไดลึก ผู้เฒ่าของป้อม (คนแคระ อายุยืนพอจะอยู่ตลอดชีวิตของตัวละคร)
#   เอสทริน นายคลังแขนซ้ายเป็นขอเหล็ก · เวสซา ผู้เฝ้าทีฟลิ่งหญิงจากบ้านหญ้าเงินที่ออกไปรับคน · เบอร์ทัล คนครัวที่ห้อยกุญแจไว้ที่คอ (เป็นผู้ถือกุญแจ เรื่องลับในไฟล์ ข เฉลยว่ากุญแจมีไว้ทำอะไร)
# บรอนกาเป็นผู้เฒ่าจนกว่าตัวละครจะขึ้นยศ 4 เรื่องที่เล่าถึงนางในฐานะผู้เฒ่าที่ยังนั่งตำแหน่งจึงกันด้วย max_rank
# ป้อมสามดูแลหินสิบหกก้อน เลขที่เรื่องเก่าใช้ (สามสิบสองถึงสามสิบเก้า) คือครึ่งแรกของแนว เรื่องในไฟล์นี้ใช้เลขไม่เกินสี่สิบเจ็ด
# งาน (duty) ไม่ให้ผลงานเอง ระบบให้ +1 เมื่อทำสำเร็จ 0 เมื่อพลาด −1 เมื่อปัด งานเกิดซ้ำ (once: false) ให้แค่เงินหรือชื่อเสียง
# ทางเข้ากลางชีวิตล้าง flag งานเดิมทั้ง 24 งาน ตั้ง job_wardens หรือ job_fort_priest และย้ายไปแดนเถ้า

# ---------- ทางเข้า ----------
- id: adult.wardens_first_winter_names
  stage: adult
  scene: fort
  weight: 40
  time: night
  when:
    age: [20, 45]
    org: { id: wardens, max_rank: 1 }
  text: |
    คืนแรกของฤดูหนาว ป้อมสามดับไฟในห้องกินข้าวทุกดวง แล้วออกไปยืนเรียงหน้าแนวหินกันทั้งป้อม คนยืนแนว นักบวช คนครัว เด็กเลี้ยงล่อ ตะเกียงแขวนอยู่บนขอเหล็กของหินทั้งสิบหกก้อน ลมจากฝั่งเถ้าพัดเปลวไฟเอนไปทางเดียวกันหมด

    บรอนกา ตระกูลบันไดลึก ผู้เฒ่าของป้อม เดินจากหัวแถวไปท้ายแถว ไม้เท้าเหล็กจิ้มเถ้าทุกก้าว นางเป็นคนแคระ ตัวสูงไม่ถึงไหล่ใครในแถว ผมขาวถักเปียเส้นเดียวพันคอสองรอบแทนผ้าพันคอ ปีนี้นางขานชื่อสองชื่อ แล้วเดินกลับเข้าป้อมโดยไม่หันมาดูว่าเจ้าของชื่อเดินตามมาหรือเปล่า

    ในห้องกินข้าว เอสทริน นายคลังของป้อม เปิดสมุดเวรเล่มหนาวางตรงหน้า{name} ขอเหล็กที่แขนซ้ายกดสันสมุดไว้ไม่ให้ปิด ทุกคนในป้อมมีหน้าของตัวเอง เวรที่ป้อมส่งไปหนึ่งครั้งคือหนึ่งบรรทัด ท้ายบรรทัดมีรอยดินสอขีดลงช่องใดช่องหนึ่งในสองช่อง ช่องรับกับช่องปัด เอสทรินไม่เคยลบสักเส้น

    บรอนกานั่งลงฝั่งตรงข้าม ชี้ไม้เท้าไปที่สมุดนับหินบนหิ้ง ชี้กุญแจเหล็กดอกยาวที่เข็มขัดตัวเอง แล้วชี้เก้าอี้ว่างหัวโต๊ะ นางบอกว่าป้อมนี้มีคนสี่แบบ คนยืน คนนับ คนถือกุญแจ กับคนที่ต้องไปนั่งในห้องที่มีเก้าอี้เจ็ดตัว ใครเป็นแบบไหนขึ้นอยู่กับหน้ากระดาษในสมุดเล่มนี้ ไม่ขึ้นกับว่าอยู่มากี่หนาว ป้อมไม่ได้ขอให้ใครกล้า ป้อมขอให้มา แล้วนางก็บอกธรรมเนียมของคืนนี้ คนที่ยังไม่ได้ยินชื่อตัวเอง ถามผู้เฒ่าได้คนละหนึ่งข้อ
  choices:
    - id: ask_lower_door
      label: ถามว่าประตูเหล็กใต้ห้องเก็บน้ำมันเปิดไปที่ไหน
      habit: curious
      text: |
        บรอนกาปลดกุญแจออกจากเข็มขัด วางลงข้างชามน้ำแกง ด้ามเหล็กสึกเป็นรอยเว้าตรงกลาง เว้าแบบด้ามค้อนที่ผ่านมือมาสามชั่วคน นางบอกว่าประตูบานนั้นเปิดไปห้องล่าง ห้องล่างไม่มีน้ำมัน ไม่มีหัวหอก ไม่มีของให้ขโมย แล้วร้อยกุญแจกลับเข้าเข็มขัด นางนับว่านั่นคือคำตอบหนึ่งข้อ

        คืนนั้น{name}นอนไม่หลับ ได้ยินกลอนประตูเหล็กใต้ห้องเก็บน้ำมันเลื่อนเปิดตอนเที่ยงคืน ตามด้วยเสียงเท้าลงบันไดหินทีละขั้น ช้า หนักข้างซ้าย จังหวะของคนที่เข่าไม่ดี ก่อนเปลี่ยนกะ กลอนเลื่อนปิดอีกครั้ง
      effects: { stats: { WIS: 1 }, flags: [asked_about_lower_door] }
    - id: ask_why_two
      label: ถามว่าทำไมปีนี้ขานแค่สองชื่อ
      text: |
        เอสทรินพลิกสมุดไปหน้าอื่นให้ดูก่อนผู้เฒ่าจะทันตอบ หน้าหนึ่งช่องปัดมีรอยขีดเรียงแน่นเหมือนรั้วไม้ หน้าถัดไปก็แน่นพอกัน เจ้าของสองหน้านั้นยังอยู่ในป้อม ยังกินข้าวโต๊ะเดียวกัน ได้ค่าจ้างเท่าทุกคน บรอนกาบอกว่าป้อมสามไม่เคยไล่ใครออก ป้อมแค่จำ

        {name}กินน้ำแกงจนหมดชาม กลางโต๊ะมีถ้วยเกลือหยาบใบเดียวที่ทั้งโต๊ะหยิบใช้ร่วมกัน คนที่มีรั้วไม้ในช่องปัดเอื้อมมือไปหยิบได้ใกล้เท่าคนอื่น
      effects: { alignment: { law: 1 }, flags: [saw_the_passing_column] }
    - id: take_the_warm_stone
      label: ไม่ถามอะไร ขอลงชื่อยืนเวรที่หินก้อนที่สามสิบหกคืนนี้แทน
      habit: stubborn
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ยืนที่หินก้อนที่สามสิบหกจนสาง ลมหนาวแรกของปีพัดเถ้าเข้าคอเสื้อจนข้างในเสื้อเป็นสีเทา ตีสองมีจุดแดงขึ้นมาหลังแนวหินจุดเดียว ลอยอยู่ตรงนั้นเกือบชั่วยามแล้วจมลงไปเอง ตอนเปลี่ยนกะ นิ้วสองมือกำด้ามหอกแข็งจนต้องแกะออกทีละนิ้ว

          เอสทรินขีดในช่องรับให้หนึ่งเส้น แล้วลากดินสอทับซ้ำจนรอยดำกว่าเส้นอื่นในหน้านั้น นางไม่ได้บอกว่าทำไม
        effects: { stats: { CON: 1 }, flags: [stood_first_winter_night] }
      failure:
        text: |
          ตีสามลมเปลี่ยนทิศ ตะเกียงบนขอเหล็กดับสองครั้ง ครั้งที่สอง{name}จุดใหม่ไม่ติด นิ้วชาจนตีเหล็กไฟไม่ออกประกาย ต้องยืนอยู่ในความมืดจนสาง ฟังเถ้าข้างหน้าเลื่อนไหลไปมาโดยไม่รู้ว่าอะไรทำให้มันเลื่อน

          เช้านั้นเบอร์ทัล คนครัว ต้มน้ำอุ่นใส่กะละมังมาให้แช่มือ ปลายนิ้วสามนิ้วซีดอยู่สามวันกว่าจะกลับเป็นสีเดิม
        effects: { hp: -2, flags: [stood_first_winter_night] }
    - id: ask_what_to_pray
      label: ถามว่าป้อมอยากให้นักบวชสวดอะไรก่อนนับหินตอนเช้ามืด
      requires: { flag: job_fort_priest }
      text: |
        บรอนกาบอกว่าไม่ต้องสวดให้หิน หินไม่ฟังใคร ให้สวดให้คนนับ คนที่วางมือบนหินก้อนที่อุ่นแล้วต้องเขียนว่าอุ่น คนนั้นต้องเขียนจดหมายขอค่าน้ำมันทีหลัง และต้องนั่งอ่านจดหมายตอบ

        ตั้งแต่หนาวนั้น ทุกเช้ามืด{name}ยืนอยู่ปลายแนวหินตอนผู้นับหินเดินผ่าน สวดบทที่สั้นที่สุดที่{god}มี ผู้นับหินบางคนแตะไหล่{name}ตอนเดินผ่าน บางคนไม่แตะ ไม่มีใครขอให้หยุด
      effects: { stats: { WIS: 1 }, flags: [blessed_the_dawn_count] }
    - id: tell_garvens_knock
      label: เล่าเรื่องเสียงเคาะที่การ์เวนเล่าให้ฟังในคืนสุดท้ายของเขา
      requires: { flag: garven_told_the_knock }
      text: |
        บรอนกาฟังจนจบโดยไม่ขัดสักคำ ด้ามหอก เคาะสามครั้ง คำเดียวที่ตอบกลับมาในภาษาที่การ์เวนไม่เคยได้ยิน พอ{name}เล่าจบ นางบอกว่าด้ามหอกไม่ใช่ของที่ใช้เคาะ แล้วลุกจากโต๊ะ ทิ้งน้ำแกงไว้ครึ่งชาม

        เอสทรินบอกว่าอยู่ป้อมนี้มายี่สิบหนาว ไม่เคยเห็นผู้เฒ่าลุกก่อนกินหมดชาม เบอร์ทัลเดินมาเก็บชามของนางไปเงียบๆ กุญแจดอกเล็กที่ห้อยคอเขาด้วยเชือกหนังแกว่งไปกระทบขอบชามดังกริ๊กหนึ่งครั้ง
      effects: { stats: { INT: 1 }, flags: [told_bronka_the_knock] }

- id: adult.wardens_late_oil_cart
  stage: adult
  scene: road
  weight: 7
  when:
    age: [28, 52]
    not_orgs: [wardens, fang_house]
    not_flags: [left_the_fort, deserted_the_fort, sold_the_fort]
  text: |
    เกวียนน้ำมันของภาคีผู้เฝ้าผนึกจอดอยู่หน้าโรงเตี๊ยมมาสามวันแล้ว คนขับคนเดิมเท้าแตกตอนยกถังลง หญิงที่นั่งเฝ้าเกวียนแขนซ้ายตั้งแต่ศอกลงไปเป็นขอเหล็ก ปลายขอขัดจนขึ้นเงา นางชื่อเอสทริน เป็นนายคลังของป้อมสาม นางวางสองเหรียญบนโต๊ะ ให้ใครก็ได้ที่จะขับเกวียนไปส่งถึงแดนเถ้า {name}เป็นคนเดียวในโรงเตี๊ยมที่ลุกจากโต๊ะ

    สิบสองวันบนทาง เถ้าเกาะล้อหนาขึ้นทุกเช้า วันที่เก้าหญ้าข้างทางเปลี่ยนเป็นสีเงิน วันที่สิบเอ็ดตอเสาของอัสเทลโผล่ขึ้นมาบนขอบฟ้า ใหญ่ขึ้นทุกชั่วยามแต่ไม่ใกล้เข้ามาเลย เอสทรินพูดวันละไม่กี่คำ ส่วนใหญ่เป็นตัวเลข น้ำมันกี่ถัง หัวหอกกี่อัน คนกี่คน ที่ป้อมสาม ทั้งสามอย่างมีน้อยกว่าที่ควร

    เกวียนถึงประตูป้อมตอนตะวันตกดิน นางนับถังลงจนครบ แล้วพาเข้าห้องกินข้าว เปิดสมุดเวรเล่มหนาไปหน้าที่ยังว่าง วางดินสอลงข้างสมุด นางบอกว่าป้อมเลิกรับเด็กหนุ่มสาวมาหลายปีแล้ว เด็กหนีตั้งแต่หนาวแรก ป้อมอยากได้คนที่เหนื่อยกับงานอื่นมาจนพอแล้ว และยังไม่ไปไหน
  choices:
    - id: sign_the_page
      label: เขียนชื่อลงหัวกระดาษหน้าที่ว่าง
      text: |
        {name}เขียนชื่อตัวเองบนหัวกระดาษ ลายมือเอียงกว่าที่ตั้งใจเพราะโต๊ะไม่เรียบ เอสทรินเป่าหมึกให้แห้ง แล้วเขียนบรรทัดแรกต่อให้ด้วยลายมือของนาง ขับเกวียนน้ำมันจากโรงเตี๊ยมถึงป้อม สิบสองวัน ขีดลงช่องรับ

        คืนนั้น{name}ได้เตียงในห้องนอนรวม ผ้าห่มขนแพะผืนหนึ่ง กับหอกที่ด้ามมีรอยมือคนอื่นสึกเป็นร่องไว้ก่อนแล้ว ของจากชีวิตเก่าเหลืออยู่ในย่ามใบเดียวใต้เตียง
      effects:
        mark: เข้าเป็นผู้เฝ้าผนึก
        flags: [job_wardens, enlisted_late]
        clear_flags: [job_artificer, job_bank_spy, job_bough_crafter, job_bounty_hunter, job_city_priest, job_clerk, job_docker, job_farmer, job_guide, job_hedge_doctor, job_house_singer, job_mercenary, job_merchant, job_miner, job_navy, job_news_walker, job_refinery_hand, job_researcher, job_road_healer, job_scout, job_smith, job_smuggler, job_swindler, job_troupe]
        location_tag: ashland
        reputation: { wardens: 1 }
    - id: one_night_first
      label: ขอยืนกะดึกให้ดูหนึ่งคืนก่อน แล้วค่อยเขียน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          เอสทรินให้หอกหนึ่งด้ามกับที่ยืนข้างหินก้อนที่สามสิบเก้า ข้างผู้เฝ้าแก่คนหนึ่งที่ไม่ถามชื่อ{name}ทั้งคืน จุดแดงขึ้นมาหลังแนวหินสามจุด เดินเลียบไปมาจนเที่ยงคืนแล้วหายไป ผู้เฝ้าแก่หาวสองครั้ง นอกนั้นไม่ขยับเลย

          ตอนสาง{name}เดินกลับเข้าห้องกินข้าว หยิบดินสอที่ยังวางอยู่ข้างสมุดตรงที่เดิม แล้วเขียนชื่อลงไป มือยังเย็นจนตัวอักษรตัวแรกสั่น เอสทรินขีดบรรทัดแรกให้ ยืนกะดึกหนึ่งคืนก่อนมีชื่อในป้อม ช่องรับ
        effects:
          mark: เข้าเป็นผู้เฝ้าผนึก
          stats: { CON: 1 }
          flags: [job_wardens, enlisted_late]
          clear_flags: [job_artificer, job_bank_spy, job_bough_crafter, job_bounty_hunter, job_city_priest, job_clerk, job_docker, job_farmer, job_guide, job_hedge_doctor, job_house_singer, job_mercenary, job_merchant, job_miner, job_navy, job_news_walker, job_refinery_hand, job_researcher, job_road_healer, job_scout, job_smith, job_smuggler, job_swindler, job_troupe]
          location_tag: ashland
          reputation: { wardens: 1 }
      failure:
        text: |
          ตีสองลมหนาวพัดผ่านแนวหินเหมือนน้ำเย็นราดหลัง ตีสามจุดแดงจุดหนึ่งขึ้นมาตรงหน้าหินก้อนที่สามสิบเก้า ห่างไม่ถึงสิบก้าว แล้วอยู่ตรงนั้นจนเกือบสาง {name}ยืนได้ แต่มือที่ถือหอกไม่ยอมหยุดสั่นจนฟ้าสว่าง

          เช้านั้นเอสทรินนับสองเหรียญที่ค้างใส่มือ แล้วปิดสมุดเวรโดยไม่ฉีกหน้าที่ว่างนั้นทิ้ง {name}ขึ้นขบวนถ่านเที่ยวกลับตอนสาย นั่งหันหลังให้แดนเถ้าไปจนพ้นหญ้าสีเงิน
        effects: { hp: -1, gold: 2, flags: [tried_one_night_at_fort] }
    - id: take_pay_home
      label: รับค่าจ้างที่เหลือ แล้วขึ้นขบวนถ่านเที่ยวกลับตอนเช้า
      text: |
        เอสทรินนับสามเหรียญใส่มือ เกินที่ตกลงไว้หนึ่งเหรียญ นางว่าเป็นค่าล้อที่{name}ซ่อมเองกลางทางเมื่อวันที่หก แล้วปิดสมุดเวร หน้าที่ว่างยังว่างอยู่ในนั้น

        บนขบวนถ่านขากลับ คนขายตั๋วถามว่าไปส่งของให้ป้อมไหน {name}ตอบว่าป้อมสาม เขาบอกว่าป้อมสามขาดคนมาตั้งแต่เขายังเด็ก แล้วไม่คิดค่าตั๋ว
      effects: { gold: 3, flags: [drove_the_wardens_oil] }
    - id: hound_news_remembered
      label: ทักผู้เฝ้าคนหนึ่งในห้องกินข้าว คนที่เคยมาฆ่าฝูงหมาเถ้าข้างรางตามข่าวที่ส่งไป
      requires: { flag: warned_wardens_of_hounds }
      text: |
        ผู้เฝ้าคนนั้นจำ{name}ได้ก่อนจะทันทัก เขาเป็นหนึ่งในสองคนที่มาถึงหมู่บ้านริมรางเมื่อหลายปีก่อน ฆ่าฝูงหมาเถ้าในคืนเดียว แล้วนั่งดื่มอยู่ในโรงเตี๊ยมจนเช้า เขาลุกมายืนข้างเอสทริน เอาดินสอจากมือนางไปเขียนบรรทัดแรกในหน้าที่ว่างเอง ส่งข่าวหมาเถ้ามาถึงป้อมก่อนมันออกไปไกลกว่านั้น

        {name}เขียนชื่อไว้เหนือบรรทัดนั้น คืนนั้นทั้งโต๊ะรินเหล้าให้คนละจอก จอกของ{name}รินจนล้น
      effects:
        mark: เข้าเป็นผู้เฝ้าผนึก
        flags: [job_wardens, enlisted_late]
        clear_flags: [job_artificer, job_bank_spy, job_bough_crafter, job_bounty_hunter, job_city_priest, job_clerk, job_docker, job_farmer, job_guide, job_hedge_doctor, job_house_singer, job_mercenary, job_merchant, job_miner, job_navy, job_news_walker, job_refinery_hand, job_researcher, job_road_healer, job_scout, job_smith, job_smuggler, job_swindler, job_troupe]
        location_tag: ashland
        reputation: { wardens: 2 }

- id: adult.wardens_late_priest_boxes
  stage: adult
  scene: temple
  weight: 16
  when:
    age: [28, 52]
    class: cleric
    not_orgs: [wardens, fang_house]
    not_flags: [left_the_fort, deserted_the_fort, sold_the_fort]
  text: |
    กล่องดีบุกสามใบมาถึงมือ{name}ผ่านนายสถานีขบวนถ่าน ใบละเท่าฝ่ามือ ฝาบัดกรีปิดสนิท บนฝาแต่ละใบมีชื่อขูดด้วยปลายตะปู ลายมือคนละคน นายสถานีบอกว่าภาคีผู้เฝ้าผนึกสั่งให้ส่งถึงนักบวชคนที่อยู่ใกล้ปลายรางที่สุด เขาถามมาหลายสถานีแล้ว ทุกคนส่ายหน้า

    ใต้กล่องใบล่างมีกระดาษพับสองทบ เขียนแน่นจนแทบไม่เหลือขอบ เป็นจดหมายของเอสทริน นายคลังของป้อมสาม ป้อมไม่มีนักบวชมาสามหนาวแล้ว คนที่ตายบนแนวหินเข้าเตาหลอมไปโดยไม่มีใครเอ่ยชื่อให้ นางขอให้นักบวชองค์ไหนก็ได้สวดส่งสามคนนี้ แล้วส่งกล่องต่อถึงบ้าน ที่อยู่ของแต่ละบ้านเขียนไว้ท้ายจดหมาย บรรทัดที่สามเขียนว่าไม่รู้

    {name}วางกล่องสามใบเรียงบนแท่นของ{god} ดีบุกเย็นกว่าที่ควรเป็นในห้องที่จุดเทียนไว้ทั้งวัน
  choices:
    - id: carry_them_back
      label: แบกกล่องทั้งสามกลับไปป้อมสามเอง แล้วอยู่ที่นั่น
      text: |
        {name}ขึ้นขบวนถ่านเที่ยวไปพร้อมกล่องในย่าม ห้องสวดของป้อมสามใช้เก็บกระสอบแป้งมาสามหนาว เอสทรินขนกระสอบออกเองทีละใบ หิ้วด้วยมือขวา ประคองด้วยขอเหล็ก ไม่ให้ใครช่วย นางบอกว่าห้องนี้ควรว่างไว้ให้คนที่ต้องมาใช้มัน

        คืนนั้น{name}สวดส่งสามชื่อหน้าเตาหลอมของป้อม ผู้เฝ้ายืนฟังอยู่ที่ประตูสิบกว่าคน บางคนยังถือชามข้าว สองชื่อแรกส่งต่อไปถึงบ้านกับขบวนถ่านเช้าวันรุ่งขึ้น กล่องใบที่สามไม่มีบ้านให้ไป {name}วางมันไว้บนหิ้งในห้องสวด หันชื่อออกด้านนอก
      effects:
        mark: เข้าเป็นนักบวชประจำป้อมสาม
        flags: [job_fort_priest, enlisted_late]
        clear_flags: [job_artificer, job_bank_spy, job_bough_crafter, job_bounty_hunter, job_city_priest, job_clerk, job_docker, job_farmer, job_guide, job_hedge_doctor, job_house_singer, job_mercenary, job_merchant, job_miner, job_navy, job_news_walker, job_refinery_hand, job_researcher, job_road_healer, job_scout, job_smith, job_smuggler, job_swindler, job_troupe]
        location_tag: ashland
        reputation: { wardens: 1 }
    - id: rites_and_send
      label: สวดส่งทั้งสามที่นี่ แล้วส่งกล่องต่อถึงบ้านตามที่อยู่
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}สวดส่งทีละชื่อ คนละคืน สามคืน คืนที่สามจุดเทียนจนหมดเล่ม แล้วห่อกล่องด้วยผ้าสะอาด เขียนที่อยู่ลงบนผ้าด้วยถ่าน สองกล่องแรกไปถึงบ้านในเดือนนั้น กล่องที่สาม{name}ถามคนเดินขบวนถ่านทุกคนที่ผ่านมาจนได้ชื่อหมู่บ้านริมทุ่งแห่งหนึ่ง ที่นั่นมีหญิงแก่คนหนึ่งรอลูกชายกลับมาช่วยเกี่ยวข้าวทุกปี

          ปลายฤดู กระดาษแผ่นเล็กแผ่นหนึ่งมาถึงพร้อมขบวนถ่าน ลายมือแน่นแบบเดิม เขียนแค่ว่าได้รับแจ้งแล้วทั้งสามบ้าน
        effects: { stats: { WIS: 1 }, flags: [sent_three_boxes_home] }
      failure:
        text: |
          สองกล่องแรกไปถึงบ้านตามที่อยู่ กล่องที่สามไม่มีใครรู้จักชื่อบนฝา นายสถานีไม่รู้ คนขับขบวนไม่รู้ ป้อมสามตอบจดหมายมาว่าเขามาถึงป้อมโดยไม่บอกว่ามาจากไหน และป้อมก็ไม่ได้ถาม

          กล่องใบนั้นยังวางอยู่ที่มุมแท่นของ{god} {name}ปัดฝุ่นให้ทุกเช้าพร้อมกับปัดฝุ่นแท่น
        effects: { alignment: { moral: 1 }, flags: [kept_a_wardens_box] }
    - id: send_them_back
      label: ส่งกล่องกลับไปป้อมสามพร้อมจดหมาย บอกว่าที่นี่ก็ขาดนักบวชเหมือนกัน
      text: |
        {name}เขียนจดหมายตอบยาวครึ่งหน้า บอกว่าคนที่นี่ก็ตาย ก็ต้องมีคนเอ่ยชื่อให้เหมือนกัน แล้วสวดบทสั้นให้กล่องทั้งสามก่อนส่งกลับไปกับขบวนถ่านเที่ยวแรก

        เดือนต่อมาขบวนถ่านไม่ได้เอากล่องดีบุกมาที่สถานีนี้อีก นายสถานีบอกว่าภาคีคงส่งไปสถานีถัดไปแล้ว ไม่มีใครรู้ว่าสถานีถัดไปมีนักบวชหรือเปล่า
      effects: { alignment: { law: 1 }, flags: [returned_the_wardens_boxes] }
    - id: back_to_old_fort
      label: กลับไปป้อมที่เคยเขียนจดหมายถึงแม่ของรอสเวน
      requires: { flag: wrote_rosven_letter }
      text: |
        {name}จำลายมือแน่นๆ ในจดหมายได้ ป้อมสามยังเป็นหินสีเทาสามชั้นเหมือนวันที่จากมา ห้องสวดยังติดห้องเก็บศพ เอสทรินออกมายืนรอที่ประตูทั้งที่ไม่มีใครบอกว่าจะมีคนมา นางบอกว่าห้องสวดยังไม่มีใครย้ายของเข้าไปอยู่ เพราะไม่มีใครกล้าย้ายหนังสือสวดที่{name}ทิ้งไว้บนหิ้ง

        คืนแรก{name}เขียนจดหมายสามฉบับถึงสามบ้าน เล่าคืนสุดท้ายของแต่ละคนตามที่คนในป้อมเห็น ไม่ตัด ไม่เติม แบบที่เคยเขียนให้รอสเวน
      effects:
        mark: กลับไปเป็นนักบวชประจำป้อมสาม
        flags: [job_fort_priest, enlisted_late]
        clear_flags: [job_artificer, job_bank_spy, job_bough_crafter, job_bounty_hunter, job_city_priest, job_clerk, job_docker, job_farmer, job_guide, job_hedge_doctor, job_house_singer, job_mercenary, job_merchant, job_miner, job_navy, job_news_walker, job_refinery_hand, job_researcher, job_road_healer, job_scout, job_smith, job_smuggler, job_swindler, job_troupe]
        location_tag: ashland
        reputation: { wardens: 2 }

- id: adult.wardens_late_horned_register
  stage: adult
  scene: market
  weight: 7
  when:
    age: [28, 52]
    trait: curse_brand
    not_orgs: [wardens, fang_house]
    not_flags: [left_the_fort, deserted_the_fort, sold_the_fort]
  text: |
    ประกาศของศาสนจักรตะเกียงตอกอยู่บนประตูตลาดทุกเมืองบนเส้นทางขบวนถ่าน คนมีตราทุกคนต้องไปลงชื่อในทะเบียนวิหารเวรัสภายในหนึ่งเดือน แจ้งที่อยู่ แจ้งงาน แจ้งชื่อพ่อแม่ถ้ารู้ ใครย้ายบ้านต้องมาแจ้งใหม่ ประกาศไม่ได้เขียนว่าทะเบียนนั้นเอาไปใช้ทำอะไร และไม่มีใครต้องถาม

    แถวหน้าวิหารเช้านั้นยาวไปถึงร้านขายเกลือ คนมีตรายืนเรียงกันเงียบๆ บางคนใส่หมวก บางคนไม่ใส่ เด็กผู้หญิงคนหนึ่งข้างหน้า{name}ถามแม่ว่าลงชื่อแล้วจะได้อะไร แม่จัดผ้าโพกหัวให้ลูกใหม่แทนคำตอบ

    ปลายแถว หญิงคนหนึ่งยืนพิงล้อเกวียนเปล่า ผ้าคลุมสีเทาของภาคีผู้เฝ้าผนึกพาดบ่า ผมตัดสั้นชิดหนังจนเห็นเขาคู่หนึ่งโค้งไปข้างหลังเต็มตา ปลายเขาสวมปลอกทองเหลืองกันบิ่น นางชื่อเวสซา มาจากบ้านหญ้าเงินในแดนเถ้า ไม่ได้ตะโกนเรียกใคร แค่บอกคนที่เดินผ่านไปทีละคน ว่าป้อมสามจดชื่อคนลงสมุดเวร ไม่ได้จดลงทะเบียนวิหาร และสมุดเวรไม่มีช่องให้กรอกชื่อพ่อแม่
  choices:
    - id: climb_the_cart
      label: ออกจากแถว ขึ้นนั่งท้ายเกวียนของเวสซา
      text: |
        เกวียนออกจากตลาดตอนบ่าย ท้ายเกวียนมีคนนั่งอยู่แล้วสองคน หญิงแก่ที่เคยทำงานโรงกลั่นจนมือแตกลาย กับเด็กหนุ่มที่ยังไม่ยอมบอกชื่อ เวสซาขับเกวียนตลอดทาง ฮัมเพลงไม่มีเนื้อเป็นทำนองเดียวซ้ำไปมา หญิงแก่บอกว่าเป็นเพลงกล่อมเด็กของบ้านหญ้าเงิน คนที่นั่นร้องให้ลูกฟังเพื่อกลบเสียงอื่นในฝัน

        ป้อมสามจด{name}ลงสมุดเวรในหน้าว่างหน้าหนึ่ง ช่องชื่อพ่อแม่ไม่มีจริงอย่างที่เวสซาบอก คืนแรกที่ยืนข้างแนวหิน หมาเถ้าตัวหนึ่งเดินมาหยุดห่างจาก{name}สามก้าว แล้วนั่งลงเหมือนรอให้ใครอนุญาต
      effects:
        mark: เข้าเป็นผู้เฝ้าผนึก
        flags: [job_wardens, enlisted_late]
        clear_flags: [job_artificer, job_bank_spy, job_bough_crafter, job_bounty_hunter, job_city_priest, job_clerk, job_docker, job_farmer, job_guide, job_hedge_doctor, job_house_singer, job_mercenary, job_merchant, job_miner, job_navy, job_news_walker, job_refinery_hand, job_researcher, job_road_healer, job_scout, job_smith, job_smuggler, job_swindler, job_troupe]
        location_tag: ashland
        reputation: { wardens: 1 }
    - id: ask_about_the_voice
      label: ถามเวสซาว่าที่ป้อม เสียงทุ้มที่พูดในฝันดังขึ้นหรือเบาลง
      check: { stat: WIS, dc: 13, foe: demon }
      success:
        text: |
          เวสซาตอบตรงๆ ว่าดังขึ้น ที่ป้อมสามมันเรียกชื่อเต็มทุกพยางค์ แต่ที่ป้อม คนที่ได้ยินเสียงนั้นยืนอยู่หน้าแนวหิน เสียงอยู่ข้างหลังหิน มีหินคั่นอยู่ตรงกลางทั้งคืน ที่ตลาดนี้ไม่มีอะไรคั่นเลย

          {name}ออกจากแถวไปขึ้นเกวียน คืนแรกที่ป้อม เสียงในฝันเรียกชื่อ{name}ครบทุกพยางค์จริง ตื่นขึ้นมา{name}ลุกไปยืนพิงหินก้อนที่สามสิบหกจนสาง แล้วกลับไปนอนต่อได้
        effects:
          mark: เข้าเป็นผู้เฝ้าผนึก
          stats: { WIS: 1 }
          flags: [job_wardens, enlisted_late]
          clear_flags: [job_artificer, job_bank_spy, job_bough_crafter, job_bounty_hunter, job_city_priest, job_clerk, job_docker, job_farmer, job_guide, job_hedge_doctor, job_house_singer, job_mercenary, job_merchant, job_miner, job_navy, job_news_walker, job_refinery_hand, job_researcher, job_road_healer, job_scout, job_smith, job_smuggler, job_swindler, job_troupe]
          location_tag: ashland
          reputation: { wardens: 1 }
      failure:
        text: |
          เวสซาตอบว่าดังขึ้น แล้วหยุดอยู่แค่นั้น {name}ฟังคำนั้นคำเดียวแล้วถอยกลับเข้าแถว เกวียนของภาคีออกจากตลาดไปตอนบ่ายพร้อมคนสองคน

          เสมียนวิหารจดชื่อ{name}ลงทะเบียนเป็นคนที่สี่สิบเอ็ดของวัน ถามชื่อพ่อแม่ แล้วเว้นช่องนั้นไว้ให้ว่างโดยไม่ต้องรอคำตอบ
        effects: { alignment: { law: 1 }, flags: [signed_lamp_register] }
    - id: stay_in_line
      label: ยืนในแถวต่อ ลงชื่อในทะเบียนวิหารให้จบเรื่อง
      text: |
        เสมียนวิหารจดชื่อ จดที่อยู่ จดงาน ลายมือสวยเป็นระเบียบ จดเสร็จแล้วยื่นแผ่นไม้เล็กสลักเลขให้ แผ่นไม้มีรูร้อยเชือก ไว้ห้อยคอเวลามีคนถาม

        ขากลับ{name}เดินผ่านเกวียนของเวสซาที่ยังจอดรออยู่ ท้ายเกวียนมีคนนั่งสองคน เวสซาไม่ได้เรียก แผ่นไม้ในกระเป๋าเสื้อของ{name}ขอบคมจนบาดนิ้วตอนล้วงหาเหรียญ
      effects: { alignment: { law: 1 }, reputation: { lamp_church: 1 }, flags: [signed_lamp_register] }
    - id: show_the_stumps
      label: ถอดหมวกให้เวสซาดูตอเขาที่เลื่อยทิ้งตั้งแต่เกิด
      requires: { flag: horns_sawn }
      text: |
        เวสซาก้มลงดูตอเขาสองตอที่เรียบเสมอหนังหัว แล้วหัวเราะออกมาเบาๆ ไม่ได้หัวเราะเยาะ เป็นเสียงหัวเราะของคนที่เจอคนรู้จัก นางบอกว่าที่บ้านหญ้าเงินก็มีคนเลื่อยแบบนี้ พี่สาวแท้ๆ ของนางเอง เลื่อยไปแล้วหมาเถ้ายังลังเลต่อหน้าแกเหมือนเดิม หมาเถ้าไม่ได้ดูที่หัว

        {name}ขึ้นเกวียนโดยไม่สวมหมวกกลับ ลมตอนบ่ายเย็นตรงตอเขาทั้งสองข้าง เป็นที่เดียวบนหัวที่ไม่ได้โดนลมมาตั้งแต่จำความได้
      effects:
        mark: เข้าเป็นผู้เฝ้าผนึก
        stats: { CHA: 1 }
        flags: [job_wardens, enlisted_late]
        clear_flags: [job_artificer, job_bank_spy, job_bough_crafter, job_bounty_hunter, job_city_priest, job_clerk, job_docker, job_farmer, job_guide, job_hedge_doctor, job_house_singer, job_mercenary, job_merchant, job_miner, job_navy, job_news_walker, job_refinery_hand, job_researcher, job_road_healer, job_scout, job_smith, job_smuggler, job_swindler, job_troupe]
        location_tag: ashland
        reputation: { wardens: 1 }

# ---------- งานที่ภาคีส่งมา (ไฟล์ ก: 10 เรื่อง) ----------
- id: adult.wardens_duty_line_walk
  stage: adult
  scene: fort
  weight: 20
  once: false
  time: night
  duty: wardens
  when:
    age: [20, 64]
    org: wardens
  text: |
    ป้อมสามคนน้อยจนตารางเวรไม่แยกว่าใครถือหอกใครถือหนังสือสวด ชื่อไหนอยู่ในช่องเดินแนว คนนั้นเดิน คืนนี้ช่องนั้นเขียนชื่อ{name}

    เดินแนวคือเดินจากหินก้อนแรกของป้อมไปจนถึงก้อนที่สิบหก เติมน้ำมันตะเกียงที่ขอเหล็กทุกขอ ก้มดูเถ้าที่โคนหินว่ามีอะไรเดินผ่านมาตั้งแต่หัวค่ำ แล้วเดินกลับ ไปกลับรอบหนึ่งกินเวลาครึ่งคืน ไม่มีใครในป้อมนับว่าตัวเองเดินมาแล้วกี่รอบ

    ระหว่างหินก้อนที่สามสิบแปดกับสามสิบเก้า รอยบนเถ้าเป็นรอยอุ้งเท้าใหม่ ขอบรอยไหม้เป็นสีน้ำตาล เถ้าหลังแนวหินกระเพื่อมเหมือนมีอะไรหายใจอยู่ข้างใต้ แล้วแสงแดงก็ขึ้นมาสองจุด ห่างกันพอดีระยะหินสองก้อน
  encounter:
    foe: ash_hound
    name: หมาเถ้าคู่หนึ่ง
    morale: 2
    beats:
      - text: ตัวหนึ่งเดินเลียบนอกแนวหินไปทางซ้าย อีกตัวนั่งลงตรงหน้าช่องหิน ถ่านในอกสว่างขึ้นช้าๆ ทุกครั้งที่มันหายใจเข้า ตะเกียงบนขอเหล็กข้างหัวของ{name}เหลือน้ำมันอีกครึ่งดวง
        moves:
          - id: walk_watch_breath
            label: ยืนนิ่ง นับจังหวะที่ถ่านในอกมันสว่าง
            kind: read
            stat: WIS
            success: ถ่านสว่างทุกห้านับ สว่างที่สุดตอนมันหายใจเข้าจนสุด แล้วหรี่ลงครึ่งนับก่อนมันจะขยับตัว ตัวที่นั่งอยู่ไม่ได้รอ{name} มันรอตัวที่เดินอ้อม
          - id: walk_spear
            label: ก้าวออกไปแทงตัวที่นั่งอยู่ก่อนมันลุก
            kind: attack
            tags: [pierce]
          - id: walk_back_to_stone
            label: ถอยจนหลังชนหิน ตั้งปลายหอกรอ
            kind: guard
          - id: walk_priest_names
            label: ยกตะเกียงขึ้นสูง เอ่ยชื่อคนตายของป้อมทีละชื่อด้วยเสียงสวด
            kind: item
            stat: WIS
            requires: { flag: job_fort_priest }
          - id: walk_run_bell
            label: วิ่งกลับไปตีระฆังที่หอเวร
            kind: flee
      - text: ตัวที่อ้อมไปโผล่ขึ้นจากเถ้าข้างหินก้อนที่สามสิบเก้า กระโจนเข้าหาด้านที่{name}ไม่ได้ถือหอก ตัวที่นั่งอยู่ลุกขึ้นพร้อมกัน
        answer: guard
        moves:
          - id: walk_turn_shaft
            label: หมุนด้ามหอกฟาดขวางตัวที่กระโจนมา
            kind: guard
          - id: walk_duck_gap
            label: มุดเข้าช่องระหว่างหินสองก้อน ให้มันชนหินแทน
            kind: quick
          - id: walk_stab_front
            label: ไม่หันไปหาตัวที่กระโจน แทงตัวข้างหน้าตอนมันลุก
            kind: attack
            tags: [pierce]
          - id: walk_run_bell2
            label: ทิ้งตะเกียง วิ่งไปทางป้อม
            kind: flee
      - text: เหลือตัวเดียวที่ยังยืนอยู่หน้าช่องหิน ถ่านในอกมันสว่างจ้าจนเห็นเงาซี่โครงดำอยู่ข้างใน มันย่อขาหลังลงต่ำ
        answer: attack
        moves:
          - id: walk_final_thrust
            label: รอให้ถ่านสว่างที่สุด แล้วแทงเข้ากลางแสง
            kind: attack
            tags: [pierce]
            success: ปลายหอกเข้าไปถึงของแข็งที่ร้อนจนด้ามสั่น {name}บิดข้อมือครึ่งรอบ ถ่านในอกแตกเป็นสองซีก หมาเถ้าทั้งตัวยุบลงเป็นกองเถ้าอุ่นๆ ที่ลมพัดกระจายก่อนจะทันเย็น
          - id: walk_hold_gap
            label: ยืนขวางช่องหิน ไม่ให้มันผ่านเข้ามาฝั่งป้อม
            kind: guard
          - id: walk_shout
            label: ตะโกนเรียกคนบนหอเวรด้วยเสียงทั้งหมดที่มี
            kind: talk
          - id: walk_run_bell3
            label: ถอยไปตามแนวหิน ไปหาแสงตะเกียงของหอเวร
            kind: flee
    win:
      text: |
        กองเถ้าสองกองหน้าช่องหินยังอุ่นอยู่จนสาง คนกะเช้าเอาพลั่วมาตักเทกลับไปฝั่งโน้น ไม่ให้เหลือติดฝั่งนี้แม้แต่กำมือเดียว ตามธรรมเนียมที่ไม่มีใครเขียนไว้

        เอสทรินขีดในช่องรับของ{name}หนึ่งเส้น แล้วเขียนตัวเลขเล็กๆ ไว้ท้ายบรรทัด เลขสอง
      effects: { reputation: { wardens: 1 } }
    lose:
      text: |
        คนบนหอเวรเห็นตะเกียงที่หินก้อนที่สามสิบแปดส่ายผิดจังหวะ ระฆังดังสามครั้ง กะดึกลงมาพร้อมหอกกับคบไฟ {name}นอนอยู่ในช่องหิน เสื้อไหม้เป็นรอยอุ้งเท้า ยังหายใจ

        เบอร์ทัลต้มน้ำเกลือให้ล้างแผลทั้งคืน ตารางเวรเดือนนั้นเขียนชื่อคนอื่นในช่องเดินแนวไปจนสิ้นเดือน
    stalemate:
      text: |
        ระฆังเปลี่ยนกะดังขึ้นจากป้อม ตะเกียงอีกสองดวงเดินลงมาตามแนวหิน หมาเถ้าถอยออกนอกแสง ถ่านในอกหรี่ลงทีละจุด แล้วจมหายลงไปในเถ้าเหมือนคนดำน้ำ

        {name}เดินแนวต่อจนครบสิบหกก้อน เติมน้ำมันตะเกียงที่เหลืออีกเจ็ดขอ ตามที่ตารางเวรเขียนไว้
      effects: { reputation: { wardens: 1 } }
    flee:
      text: |
        {name}ตีระฆังจนแขนชา กะดึกลงไปถึงช่องหินตอนหมาเถ้าข้ามแนวเข้ามาได้สามก้าว และล้มมันได้ที่ก้าวที่สี่

        เช้านั้นไม่มีใครในกะดึกพูดเรื่องเมื่อคืนต่อหน้า{name} ส่วนรอยไหม้สามก้าวบนเถ้าฝั่งนี้ ลมพัดหายไปเองก่อนเที่ยง
      effects: { reputation: { wardens: -1 } }
    death:
      text: |
        ตัวที่สองมาจากด้านที่ตะเกียงส่องไม่ถึง น้ำหนักของมันกดลงบนอก ร้อนทะลุเสื้อสองชั้น

        ตะเกียงบนขอเหล็กเหนือหัวยังติดอยู่ เปลวไฟเอนไปทางเดียวกับลม ทางเดียวกับเปลวไฟทุกดวงบนแนวหิน

- id: adult.wardens_duty_kitchen_chimney
  stage: adult
  scene: fort
  weight: 20
  once: false
  time: night
  duty: wardens
  when:
    age: [20, 64]
    org: wardens
  text: |
    ตั้งแต่ภาคีตัดค่าฟืน ครัวของป้อมสามก็ต้องเผาถ่านมารที่ขอแบ่งมาจากขบวนของบริษัทเหมือง ถ่านก้อนเดียวต้มน้ำแกงพอทั้งป้อม แต่ทุกหนาวควันของมันเรียกของบางอย่างมาเกาะปากปล่องครัว

    เบอร์ทัลกลบไฟไว้ก่อนนอนแล้ว ตีหนึ่งเตาครัวก็ลุกขึ้นเอง บนหลังคาเหนือครัวมีเสียงหัวเราะแหลมๆ เหมือนกาน้ำที่ไม่มีใครยกลงจากเตา เบอร์ทัลยืนอยู่หน้าเตาในชุดนอน กุญแจดอกเล็กห้อยคออยู่นอกเสื้อ มือถือกระบวยเหล็ก ชี้ขึ้นไปบนหลังคา

    ตารางเวรหนาวนี้เขียนว่าปล่องครัวเป็นงานของคนที่ตื่นอยู่ คืนนี้คนที่ตื่นอยู่คือ{name}
  encounter:
    foe: chimney_imp
    name: ภูตปล่องสามตัว
    morale: 2
    beats:
      - text: บนหลังคามีภูตปล่องสามตัวเกาะขอบปากปล่อง ตัวเท่าเด็กอ่อน สีถ่านคุ ผลัดกันก้มหน้าลงไปสูดควัน ตัวหนึ่งเห็น{name}โผล่หัวพ้นบันได แล้วขยี้เขม่าเป็นก้อนในมือ
        moves:
          - id: chim_bucket
            label: หิ้วถังน้ำขึ้นบันได สาดใส่ปากปล่องทั้งถัง
            kind: item
            stat: DEX
            tags: [water]
            success: น้ำทั้งถังลงกลางปากปล่อง ไอน้ำกับเขม่าพุ่งขึ้นเป็นก้อนเดียว ภูตปล่องสองตัวร่วงลงจากขอบ กลิ้งไปบนกระเบื้องหินเหมือนลูกแมวเปียก ร้องเสียงเหมือนเหล็กชุบ
          - id: chim_broom
            label: กวาดไม้กวาดใส่ตัวที่ใกล้ที่สุด
            kind: attack
          - id: chim_wet_cloth
            label: เอาผ้าชุบน้ำคลุมหน้า ปีนขึ้นไปช้าๆ
            kind: guard
          - id: chim_holy_bowl
            label: ปีนขึ้นไปพร้อมชามน้ำที่สวดไว้ตั้งแต่หัวค่ำ
            kind: item
            stat: WIS
            tags: [water]
            requires: { flag: job_fort_priest }
          - id: chim_down
            label: ลงบันได ปิดประตูครัว ปล่อยมันเล่นไปจนสาง
            kind: flee
      - text: ตัวหนึ่งโฉบลงมาหาหัว ปีกหนังกระพือดังเหมือนคนสะบัดผ้าเปียก อีกตัวเกาะอยู่บนขอบปล่องคอยถ่มถ่านคุลงมาทีละเม็ด
        answer: quick
        moves:
          - id: chim_duck_grab
            label: ก้มหลบ แล้วคว้าขามันตอนโฉบผ่าน
            kind: quick
          - id: chim_swat
            label: ตีสวนขึ้นไปด้วยด้ามไม้กวาด
            kind: attack
          - id: chim_hold_ladder
            label: กอดบันไดไว้แน่น ปล่อยให้มันตบจนเหนื่อย
            kind: guard
          - id: chim_down2
            label: ไถลลงบันไดหนีเข้าครัว
            kind: flee
      - text: ตัวสุดท้ายมุดหัวลงไปในปากปล่อง จะลงไปในครัว ข้างล่างเบอร์ทัลกำลังยกฝาหม้อน้ำแกงที่ต้มไว้สำหรับมื้อเช้า
        answer: item
        moves:
          - id: chim_shout_lid
            label: ตะโกนลงไปบอกเบอร์ทัลให้ยกหม้อน้ำแกงไปไว้ใต้ปากปล่อง
            kind: item
            stat: INT
            tags: [water]
            success: เบอร์ทัลเข้าใจตั้งแต่คำแรก หม้อน้ำแกงใบใหญ่เลื่อนไปอยู่ใต้ปากปล่องพอดี ภูตปล่องร่วงลงไปทั้งตัว น้ำแกงเดือดพล่านสามอึดใจ แล้วมันก็ตะกายขึ้นปล่องกลับออกไปทางที่มา ร้องเหมือนกาน้ำแตก
          - id: chim_tail
            label: คว้าหางมันไว้ก่อนมันมุดพ้น
            kind: quick
          - id: chim_plug
            label: เอาฝาเหล็กปิดปากปล่อง ให้มันติดอยู่ในนั้น
            kind: guard
          - id: chim_down3
            label: ปล่อยมันลงไป แล้ววิ่งลงไปช่วยในครัว
            kind: flee
    win:
      text: |
        ภูตปล่องสามตัวบินเป็นแถวไปทางหลุมเหมืองตอนฟ้าเริ่มเทา ร้องกันตลอดทางเหมือนเด็กโดนไล่กลับบ้าน เตาครัวมอดลงเอง

        เช้านั้นน้ำแกงมีกลิ่นเขม่านิดหนึ่ง เบอร์ทัลตักชามแรกให้{name} ชามที่มีเนื้อชิ้นใหญ่ที่สุดในหม้อ ทุกคนในห้องกินข้าวเห็น ไม่มีใครบ่น
      effects: { reputation: { wardens: 1 } }
    lose:
      text: |
        {name}ร่วงลงจากบันไดขั้นที่สาม หลังกระแทกกองฟืน ผมไหม้ไปหย่อมหนึ่งเท่าเหรียญ ภูตปล่องเล่นบนหลังคาต่ออีกครึ่งคืนจนเบื่อ แล้วบินไปเอง

        เบอร์ทัลเอาเนยแกะทาหย่อมผมที่ไหม้ให้ บอกว่าเขาโดนแบบนี้มาสามสิบหนาว ไม่มีหนาวไหนชนะมันได้ครบสามตัว
    stalemate:
      text: |
        ฟ้าเริ่มเทา ภูตปล่องเบื่อก่อนคน มันบินกลับไปทางหลุมเหมืองทีละตัว ตัวสุดท้ายหันมาถ่มถ่านคุใส่หลังคาอีกเม็ดหนึ่งก่อนไป

        เตาครัวมอดลงเอง เบอร์ทัลบอกว่าหนาวนี้มันจะกลับมาอีกอย่างน้อยสามคืน แล้วยื่นน้ำอุ่นให้{name}ล้างหน้า
      effects: { reputation: { wardens: 1 } }
    flee:
      text: |
        {name}ปิดประตูครัวลงกลอน ภูตปล่องเล่นบนหลังคาจนสาง ขว้างถ่านคุลงมาตามปล่องจนเตาลุกโชนทั้งคืน ถ่านมารที่ป้อมขอแบ่งมาทั้งเดือนหมดไปในคืนเดียว

        สัปดาห์นั้นป้อมสามกินขนมปังแข็งกับน้ำเย็น เบอร์ทัลไม่ได้ว่าใคร แต่ตอนตักขนมปังให้{name} เขาเลือกชิ้นที่แข็งที่สุด
      effects: { reputation: { wardens: -1 } }

- id: adult.wardens_duty_rail_cart
  stage: adult
  scene: road
  weight: 20
  once: false
  duty: wardens
  when:
    age: [20, 64]
    org: wardens
  text: |
    ทุกต้นเดือนต้องมีคนจากป้อมสามขับเกวียนล่อไปรับของที่ปลายราง น้ำมันตะเกียง แป้ง เกลือ จดหมาย และหีบค่าจ้างถ้าเดือนนั้นภาคีส่งมา ทางไปกลับกินเวลาสองวัน ล้อซ้ายของเกวียนคันนั้นหลวมมาตั้งแต่ก่อนใครในป้อมจะจำได้ ไม่มีใครซ่อม เพราะซ่อมเสร็จ เดือนต่อมามันก็หลวมอีก

    เดือนนี้ชื่อ{name}อยู่ในช่องเกวียน ล่อแก่ตัวเดิมยืนรออยู่หน้าประตูตั้งแต่ไก่ยังไม่ขัน มันรู้ว่าวันนี้วันอะไรก่อนตารางเวรจะติดเสียอีก
  choices:
    - id: drive_hard
      label: ขับให้ถึงปลายรางก่อนขบวนถ่านออก
      check: { stat: CON, dc: 12 }
      success:
        text: |
          {name}ไม่หยุดพักตอนเที่ยง กินขนมปังบนหลังเกวียน ปล่อยให้ล่อเดินไปเองบนทางที่มันรู้ดีกว่าใคร ถึงปลายรางก่อนขบวนถ่านออกครึ่งชั่วยาม ของของป้อมยังกองอยู่ข้างราง ไม่มีถังไหนโดนย้ายไปอยู่กองของบริษัทเหมือง

          นายสถานีแถมเกลือให้หนึ่งถุงเพราะมาทันเวลา เป็นครั้งแรกในรอบปีที่ป้อมสามได้ของครบทุกอย่างตามใบส่งของ
        effects: { reputation: { wardens: 1 } }
      failure:
        text: |
          ครึ่งทาง ล้อซ้ายหลุดออกจากเพลาตามที่ทุกคนรู้ว่าวันหนึ่งมันจะหลุด {name}นั่งซ่อมอยู่ข้างทางจนมืด นิ้วโดนลิ่มไม้หนีบจนเล็บดำ

          ไปถึงปลายรางขบวนถ่านออกไปแล้ว น้ำมันของป้อมสองถังไปอยู่ในกองของบริษัทเหมือง นายสถานีบอกว่าเขาเขียนชื่อเจ้าของบนถังให้แล้ว แต่คนยกของของบริษัทอ่านหนังสือไม่ออก
        effects: { hp: -1 }
    - id: walk_with_mule
      label: จูงล่อเดินไปตามจังหวะของมัน ไม่เร่ง
      text: |
        ล่อแก่หยุดกินหญ้าสีเงินข้างทางทุกครั้งที่อยากหยุด {name}ปล่อยมันกิน ระหว่างรอก็นั่งอ่านใบส่งของ ถึงปลายรางช้าไปครึ่งวัน ของของป้อมขึ้นเกวียนครบ เพราะเดือนนี้ขบวนถ่านก็มาช้าเหมือนกัน

        ขากลับ คนงานเหมืองสองคนฝากจดหมายถึงบ้านไปกับขบวนเที่ยวหน้า ให้ค่าฝากคนละเหรียญ {name}รับไว้ แล้วนั่งฟังพวกเขาบอกที่อยู่ซ้ำสามรอบ
      effects: { gold: 2 }
    - id: carry_the_boxes
      label: เอากล่องดีบุกของคนที่ตายเดือนนี้ขึ้นเกวียนไปด้วย ส่งถึงขบวนถ่านเอง
      requires: { flag: job_fort_priest }
      text: |
        เดือนนี้มีกล่องดีบุกสองใบ {name}วางไว้บนตักตลอดทาง ไม่วางรวมกับถังน้ำมัน ที่ปลายราง{name}ยื่นให้คนคุมตู้ทีละใบ บอกชื่อบนฝาให้ฟังทุกชื่อ คนคุมตู้ทวนชื่อตาม แล้ววางกล่องไว้ในตู้หน้าสุด ห่างจากถ่าน

        นายสถานีบอกว่าตั้งแต่นักบวชป้อมสามมาส่งเอง ไม่มีกล่องไหนของป้อมสามไปผิดบ้านอีก
      effects: { reputation: { wardens: 1 } }
    - id: swap_the_cart
      label: แลกเวรกับคนอื่น เลี้ยงเหล้าคนที่ไปแทนตามธรรมเนียม
      refuse: true
      text: |
        ผู้เฝ้าหนุ่มคนหนึ่งรับไปแทน รับเหรียญค่าเหล้าไปก่อนออกเดินทาง {name}อยู่ป้อม ซ่อมรองเท้าตัวเองกับตอกตะปูขอเหล็กที่หลวมสองขอ

        เอสทรินเปิดสมุดเวร ขีดในช่องปัดของ{name}หนึ่งเส้น ในช่องรับของผู้เฝ้าหนุ่มหนึ่งเส้น ทั้งสองเส้นยาวเท่ากัน
      effects: { gold: -1 }

- id: adult.wardens_duty_smoke_shaft
  stage: adult
  scene: mine
  weight: 20
  duty: wardens
  when:
    age: [22, 60]
    org: wardens
  text: |
    ปล่องระบายอากาศของเหมืองชั้นลึกโผล่ขึ้นจากเถ้าห่างหินก้อนที่สี่สิบสามไปสี่ร้อยก้าว บริษัทเหมืองสร้างไว้เมื่อสองหนาวก่อน พร้อมกระดาษที่ใครสักคนลงชื่อรับรองว่าห่างพอ เช้านี้คนงานเหมืองสิบกว่าคนวิ่งมาถึงประตูป้อม หน้าดำ ตาแดง ไอจนพูดไม่เป็นประโยค

    ควันที่ออกจากปากปล่องไม่ลอยขึ้นฟ้า มันลงมาบนเถ้าแล้วรวมตัวเป็นร่างหลังค่อม สูงกว่าคนครึ่งตัว ตาเป็นถ่านแดงสองจุด แล้วเดินทวนลมมาทางแนวหิน ช้า ไม่หยุด ป้อมส่งคนออกไปหกคนพร้อมถังน้ำบนเลื่อน {name}อยู่หัวแถว
  encounter:
    foe: walking_smoke
    name: ควันเดินจากปล่องเหมือง
    morale: 2
    beats:
      - text: ควันเดินยังห่างแนวหินสองร้อยก้าว ลมพัดเถ้าบางๆ มาจากทางมันจนแสบตา ถังน้ำบนเลื่อนมีหกถัง คนที่ลากเลื่อนอีกห้าคนรอดูว่า{name}จะเอายังไง
        moves:
          - id: smoke_read_wind
            label: ดูลม ดูว่ามันเดินทวนลมได้เร็วแค่ไหน
            kind: read
            stat: INT
            success: มันเดินทวนลมได้ แต่ทุกครั้งที่ลมแรงขึ้น ขอบตัวมันจะเลือนไปทางหลังเหมือนผ้าที่โดนลมดึง แล้วต้องหยุดก่อร่างใหม่ครึ่งอึดใจ ครึ่งอึดใจนั้นคือเวลาสาดน้ำ
          - id: smoke_first_barrel
            label: ลากเลื่อนเข้าไปตรงๆ สาดน้ำถังแรกใส่กลางตัว
            kind: item
            stat: STR
            tags: [water]
          - id: smoke_spear
            label: แทงหอกเข้าตรงที่ถ่านแดงสองจุดอยู่
            kind: attack
            tags: [pierce]
            failure: หอกผ่านควันไปทั้งด้ามโดยไม่ติดอะไร ควันไหลขึ้นมาตามด้ามหอกถึงข้อมือ แสบเหมือนจุ่มมือลงน้ำปูน
          - id: smoke_priest_water
            label: สวดลงถังน้ำถังแรกก่อน แล้วถือเข้าไปเอง
            kind: item
            stat: WIS
            tags: [water]
            requires: { flag: job_fort_priest }
          - id: smoke_back_to_line
            label: ถอยกลับไปตั้งแนวที่หิน รอให้มันมาถึงเอง
            kind: flee
      - text: ควันเดินแตกตัวออกเป็นสองสาย สายหนึ่งพุ่งเข้าหาเลื่อนถังน้ำ อีกสายวนต่ำมาทางขาของ{name} คนลากเลื่อนคนหนึ่งไอจนทรุดลงคุกเข่า
        answer: guard
        moves:
          - id: smoke_cover_mouth
            label: เอาผ้าชุบน้ำปิดปากจมูก ยืนขวางหน้าเลื่อน
            kind: guard
          - id: smoke_drag_man
            label: ลากคนที่ทรุดลงถอยออกจากควัน
            kind: quick
          - id: smoke_second_barrel
            label: ถีบถังน้ำล้มให้น้ำไหลลงตรงทางที่มันวนมา
            kind: item
            stat: DEX
            tags: [water]
          - id: smoke_run_back
            label: ทิ้งเลื่อน วิ่งกลับแนวหิน
            kind: flee
      - text: ร่างหลังค่อมก่อตัวขึ้นใหม่ตรงหน้า ใกล้จนได้กลิ่นเขม่าร้อนในจมูก ถ่านแดงสองจุดอยู่ระดับเดียวกับตาของ{name}
        answer: item
        moves:
          - id: smoke_last_barrel
            label: ยกถังสุดท้ายขึ้นเหนือหัว เทลงตรงถ่านสองจุดนั้น
            kind: item
            stat: STR
            tags: [water]
            success: น้ำทั้งถังลงตรงกลางร่าง เสียงเหมือนเหล็กแดงจุ่มน้ำดังขึ้นพร้อมกันทั้งตัว ถ่านแดงสองจุดดับ ควันที่เหลือร่วงลงเป็นเขม่าเปียกกองบนเถ้า ดำ หนัก ไม่ลุกขึ้นมาอีก
          - id: smoke_hold_breath
            label: กลั้นหายใจ ยืนนิ่งให้มันผ่านไป
            kind: guard
          - id: smoke_wet_coat
            label: ถอดเสื้อชุบน้ำก้นถัง ตีลงกลางตัวมัน
            kind: attack
            tags: [water]
          - id: smoke_run_back2
            label: ถอยออกไปข้างลม ให้ลมช่วย
            kind: flee
    win:
      text: |
        กองเขม่าเปียกกองนั้นยังอยู่ตรงที่เดิมจนเย็น ไม่มีใครกล้าเหยียบ คนงานเหมืองที่วิ่งมาตอนเช้ากลับไปเอาไม้กระดานมาปิดปากปล่องเอง ตอกตะปูเองทุกตัว

        คืนนั้นปอดของ{name}ยังแสบจนต้องนอนตะแคง ไอเป็นเขม่าออกมาสามวัน เอสทรินขีดช่องรับให้ แล้วเขียนเลขปล่องลงไว้ข้างบรรทัด เผื่อมีคนถาม
      effects: { stats: { CON: 1 }, reputation: { wardens: 1 }, flags: [quenched_shaft_smoke] }
    lose:
      text: |
        คนลากเลื่อนลากตัว{name}กลับแนวหินบนเลื่อนเปล่า ตาแดงก่ำ ไอเป็นสีดำ ควันเดินมาหยุดที่หน้าหินก้อนที่สี่สิบสาม วนอยู่ตรงนั้นครึ่งวัน แล้วไหลกลับเข้าปากปล่องเองเมื่อลมเปลี่ยนทิศ

        ปล่องนั้นยังเปิดอยู่ บริษัทส่งจดหมายมาขอบคุณภาคีที่ช่วย แล้วไม่ได้เขียนถึงเรื่องปิดปล่อง
    stalemate:
      text: |
        ลมเปลี่ยนทิศตอนบ่าย ควันเดินเสียรูปทั้งตัว ไหลกลับเข้าปากปล่องเหมือนน้ำไหลลงรู ทิ้งเถ้าที่ร้อนจนเป็นแก้วไว้เป็นทางยาวตามรอยที่มันเดิน

        บริษัทส่งคนมาปิดปากปล่องด้วยแผ่นเหล็กตอนค่ำ แล้วเจาะปล่องใหม่ห่างออกไปอีกสองร้อยก้าว
      effects: { reputation: { wardens: 1 } }
    flee:
      text: |
        ควันเดินมาถึงหินก้อนที่สี่สิบสามก่อนลมจะเปลี่ยน มันไม่ข้ามแนว มันแทรกตัวลงไปในรอยร้าวเล็กๆ ที่โคนหิน แล้วหายไป

        ตลอดเดือนนั้นหินก้อนที่สี่สิบสามอุ่นตลอดทั้งคืน ผู้นับหินต้องเขียนว่าอุ่นทุกเช้า และทุกเช้ามีคนมองหน้า{name}ตอนเดินผ่าน
      effects: { reputation: { wardens: -1 } }
    death:
      text: |
        ควันเข้ามาทางปาก เข้ามาทางจมูก ร้อนเหมือนสูดไอจากปากเตาหลอม {name}คุกเข่าลงบนเถ้า ถังน้ำใบสุดท้ายล้มอยู่ข้างตัว น้ำซึมลงเถ้าจนหมด

        ข้างบน ถ่านแดงสองจุดลอยต่ำลงมาจนอยู่ระดับเดียวกับหน้า แล้วเดินต่อไปทางหิน

- id: adult.wardens_duty_inspector
  stage: adult
  scene: fort
  weight: 20
  duty: wardens
  when:
    age: [24, 64]
    org: wardens
  text: |
    ผู้ตรวจของราชสำนักมาถึงป้อมสามด้วยเกวียนมีหลังคา เสื้อนอกสีครามติดกระดุมทองเหลืองครบทุกเม็ด รองเท้าขัดมันจนเถ้าเกาะไม่ติด เขามาตัดสินว่าแนวหินช่วงนี้นิ่งพอให้บริษัทเหมืองต่อใบอนุญาตไปอีกสิบปีหรือไม่ วิศวกรของบริษัทขี่ม้าตามมาห่างๆ ไม่ยอมลงจากหลังม้า

    จดหมายของภาคีสั่งให้ป้อมพาผู้ตรวจเดินแนวหินตามที่เขาขอ ตอบทุกคำถาม และห้ามพูดเกินคำถาม ผู้ตรวจขอเดินตอนเที่ยงวัน ตอนเที่ยงวันหินทุกก้อนเย็นมือ ตอนตีสาม หินก้อนที่สามสิบหกอุ่นจนน้ำค้างไม่เกาะ ทั้งป้อมรู้ ผู้ตรวจไม่รู้

    คนที่ป้อมส่งให้เดินข้างเขาคือ{name}
  choices:
    - id: walk_at_three
      label: เดินกับเขาตอนเที่ยงตามจดหมาย แล้วชวนเขาออกมาอีกรอบตอนตีสามโดยไม่บอกวิศวกร
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ผู้ตรวจลังเลอยู่จนถึงมื้อเย็น แล้วมาเคาะประตูห้องนอนรวมเองตอนตีสอง ใส่เสื้อนอกทับชุดนอน {name}พาเขาเดินไปถึงหินก้อนที่สามสิบหก ให้ถอดถุงมือ วางฝ่ามือลงบนหิน เขาชักมือกลับเร็วเหมือนแตะกาน้ำ แล้ววางกลับลงไปใหม่ช้าๆ นับลมหายใจเหมือนที่ผู้นับหินนับ

          รายงานของเขามีบรรทัดหนึ่งที่วิศวกรอ่านแล้วขี่ม้ากลับไปเอง หินก้อนที่สามสิบหก ตีสาม อุ่นมือ ใบอนุญาตค้างอยู่บนโต๊ะในเวนทราสอีกหนึ่งปี
        effects: { stats: { CHA: 1 }, reputation: { wardens: 1 }, flags: [showed_inspector_the_warm_stone] }
      failure:
        text: |
          ผู้ตรวจปฏิเสธอย่างสุภาพ บอกว่าระเบียบของราชสำนักให้ตรวจตอนกลางวัน เพราะกลางคืนคนเห็นอะไรผิดไปจากที่เป็นได้ง่าย แล้วเล่าเรื่องนี้ให้วิศวกรฟังตอนกินข้าวเย็น ทั้งสองคนหัวเราะ

          รายงานเขียนว่านิ่งสิบหกบรรทัด ลายมือสวยทุกบรรทัด จดหมายตำหนิของภาคีมาถึงหลังจากนั้นหนึ่งเดือน เรื่องคนของป้อมที่พูดเกินคำถาม
        effects: { reputation: { crown: -1 }, flags: [inspector_wrote_stable] }
    - id: by_the_letter
      label: เดินตอนเที่ยงตามจดหมาย ตอบเฉพาะที่ถาม
      text: |
        ผู้ตรวจวางมือบนหินทั้งสิบหกก้อน เขียนว่านิ่งทั้งสิบหกบรรทัด เขาถามคำถามเดียวตลอดทาง ถามที่หินก้อนที่สามสิบหก ว่าทำไมขอเหล็กของหินก้อนนี้ดำกว่าก้อนอื่น {name}ตอบตามที่ถาม ว่าตะเกียงที่แขวนขอนี้จุดทั้งคืนทุกคืน มากกว่าขออื่น

        เขาเขียนคำตอบนั้นไว้ที่ขอบกระดาษ ตัวเล็กมาก นอกเส้นบรรทัด แล้วถามต่อว่าห้องน้ำของป้อมอยู่ทางไหน
      effects: { alignment: { law: 1 }, flags: [inspector_wrote_stable] }
    - id: heat_ledgers
      label: เอาสมุดจดความร้อนของเถ้าที่คนกะดึกจดกันเองมาหลายปีวางให้เขาดู
      requires: { flag: stone_heat_ledger }
      text: |
        สมุดวางซ้อนกันสูงถึงเข่า ทุกปี ทุกคืน ตัวเลขข้างหินแต่ละก้อนเรียงลงมาเป็นแถว ผู้ตรวจนั่งอ่านอยู่ในห้องกินข้าวจนเทียนหมดสองเล่ม วิศวกรรออยู่ข้างนอกจนต้องขอที่นอน

        เช้ามาผู้ตรวจขอคัดตารางสามหน้าไปแนบรายงาน เขียนเองด้วยมือ ตอนจะขึ้นเกวียนเขาถามว่าใครเป็นคนเริ่มจด {name}บอกชื่อไปตามจริง เขาเขียนชื่อนั้นลงหัวกระดาษที่คัดไป
      effects: { stats: { INT: 1 }, reputation: { wardens: 1 }, flags: [inspector_took_heat_copy] }
    - id: shelf_of_boxes
      label: พาเขาไปห้องสวด ให้ดูหิ้งกล่องดีบุกของคนตายที่ยังไม่มีบ้านให้ส่ง
      requires: { flag: job_fort_priest }
      text: |
        ผู้ตรวจนับกล่องบนหิ้งเองทีละใบ สิบเจ็ดใบ แล้วถามว่าแต่ละคนตายที่หินก้อนไหน {name}เปิดสมุดคนตายให้อ่านเอง สามสิบห้า สามสิบหก สามสิบหก สามสิบเจ็ด สามสิบหก

        เขาจดตัวเลขลงกระดาษแผ่นหนึ่งแยกจากรายงาน พับเก็บใส่กระเป๋าเสื้อด้านใน ก่อนกลับเขาวางเหรียญหนึ่งเหรียญไว้บนหิ้ง ข้างกล่องใบที่ไม่มีชื่อบ้าน ไม่ได้บอกว่าให้ใคร
      effects: { stats: { WIS: 1 }, flags: [showed_inspector_the_boxes] }
    - id: send_dorval
      label: บอกเอสทรินว่าเดินกับคนแบบนี้ไม่ไหว ให้ดอร์วัลไปแทน
      refuse: true
      text: |
        ดอร์วัล หัวหน้ากะกลางวัน พาผู้ตรวจเดินแนวตอนเที่ยง เดินเร็ว ตอบเร็ว หัวเราะกับวิศวกรได้ตลอดทาง รายงานเขียนว่านิ่งสิบหกบรรทัด ใบอนุญาตออกมาก่อนสิ้นเดือน

        เอสทรินขีดช่องปัดของ{name}หนึ่งเส้น ในช่องหมายเหตุข้างบรรทัดเขียนชื่อดอร์วัลไว้ เผื่อมีใครถามว่าใครไปแทน
      effects: { flags: [dorval_walked_inspector] }

- id: adult.wardens_duty_lost_recruit
  stage: adult
  scene: fort
  weight: 20
  time: night
  duty: wardens
  when:
    age: [22, 60]
    org: wardens
  text: |
    เด็กใหม่ที่มาถึงป้อมเมื่อต้นฤดูชื่อเมลิค หนวดยังไม่ขึ้น มาจากหมู่บ้านทำนาที่ไม่เคยเห็นเถ้า สามคืนก่อนเขาถามคนในห้องนอนรวมว่าใครเรียกชื่อเขาจากข้างนอกหน้าต่างตอนดึก ทุกคนหัวเราะ คืนนี้เตียงของเขาว่าง รองเท้ายังวางคู่กันอยู่ใต้เตียง

    รอยเท้าเปล่าคู่หนึ่งเดินจากประตูหลังป้อมไปถึงหินก้อนที่สี่สิบ แล้วข้ามแนวหินออกไปในทุ่งเถ้า มุ่งไปทางตอเสา ไม่เป๋ ไม่ลังเล เหมือนคนเดินไปหาคนที่ยืนรออยู่ ฟ้าจะสางในอีกสามชั่วยาม กฎของป้อมห้ามข้ามแนวหินตอนกลางคืน

    หัวหน้ากะยื่นตะเกียงให้{name} บอกว่ากฎข้อนั้นเขียนไว้สำหรับคืนที่ไม่มีใครหายไป
  choices:
    - id: follow_the_tracks
      label: เดินตามรอยเท้าออกไปในทุ่งเถ้าด้วยตะเกียงดวงเดียว
      check: { stat: WIS, dc: 13, foe: demon }
      success:
        text: |
          รอยเท้าเดินตรงไปครึ่งชั่วยาม แล้ววนเป็นวงกลม เมลิคคุกเข่าอยู่กลางวงนั้น หันหน้าไปทางตอเสา พูดกับความมืดเบาๆ เหมือนตอบคำถาม รอบวงมีรอยอุ้งเท้าของหมาเถ้าเดินวนอยู่ข้างนอกอีกชั้น ไม่มีรอยไหนข้ามเข้าไปในวง

          {name}จับข้อมือเด็กไว้แล้วพาเดินกลับตามรอยเดิม เมลิคไม่ขัดขืน ระหว่างทางเขาบอกว่าเสียงนั้นเรียกชื่อเขาถูกทุกพยางค์ แม่ของเขายังเรียกผิดพยางค์ท้ายมาตั้งแต่เขาเกิด
        effects: { stats: { WIS: 1 }, flags: [fetched_melik] }
      failure:
        text: |
          รอยเท้าหายไปในเถ้าที่ลมพัดปิด {name}เดินวนหาจนจุดแดงสามจุดขึ้นมาข้างหลัง แล้วต้องถอยกลับแนวหินพร้อมรอยไหม้ที่หน้าแข้งสองรอย

          ตอนสาง กะเช้าเจอเมลิคนั่งอยู่ที่หินก้อนที่สี่สิบ หันหน้าออกไปทางทุ่ง เท้าเปล่าสองข้างดำเป็นถ่าน เขาไม่พูดอีกเลยหนึ่งเดือน พอพูดได้ คำแรกที่ถามคือคืนนั้นใครเดินตามเขาออกไป
        effects: { hp: -3, flags: [lost_track_of_melik] }
    - id: rope_and_call
      label: ผูกเชือกจากขอเหล็กหินก้อนที่สี่สิบเข้ากับเอว เดินออกไปเท่าที่เชือกยาว แล้วตะโกนเรียกชื่อเขา
      text: |
        เชือกยาวสองร้อยก้าว {name}ยืนสุดปลายเชือก ตะโกนเรียกชื่อเมลิคทุกครั้งที่นับถึงร้อย เสียงหายไปในเถ้าเร็วกว่าที่คิด เหมือนตะโกนใส่ผ้าห่ม ตะโกนจนเสียงแหบ จนนับร้อยไม่ไหวแล้วนับแค่ห้าสิบ

        ใกล้สาง เมลิคเดินกลับมาจากความมืดเอง เอามือจับเชือกไต่มาทีละช่วงแขน เขาบอกว่าเดินตามเสียงของ{name}มา เพราะเสียงนั้นเรียกชื่อเขาผิดพยางค์ท้าย แบบที่ทุกคนในป้อมเรียกผิด เขาเลยรู้ว่าเป็นเสียงคน
      effects: { reputation: { wardens: 1 }, flags: [fetched_melik] }
    - id: walk_out_dark
      label: ดับตะเกียง เดินออกไปในความมืดตามรอยเท้า
      requires: { trait: curse_brand }
      text: |
        {name}เดินโดยไม่มีแสง เถ้าลึกถึงหน้าแข้ง จุดแดงสองจุดขึ้นมาข้างทาง หันมาตาม{name} แล้วหยุดนิ่งอยู่ตรงนั้นเหมือนคนรอคำสั่ง ไม่เดินตามมาสักก้าว

        เมลิคนั่งอยู่กลางวงรอยเท้าของตัวเอง {name}นั่งลงข้างเขาจนเขาหันมา เขาถามว่าทำไมหมาพวกนั้นไม่เข้ามา {name}ไม่ตอบ จับข้อมือเขาลุกขึ้นแล้วเดินกลับ ทั้งสองคนถึงแนวหินตอนระฆังเปลี่ยนกะดังพอดี
      effects: { stats: { CON: 1 }, flags: [fetched_melik] }
    - id: call_him_home
      label: ยืนที่หินก้อนที่สี่สิบ เรียกชื่อเขาด้วยบทเรียกคนที่ยังไม่ข้ามประตู
      requires: { flag: job_fort_priest }
      text: |
        บทสวดบทนั้นนักบวชใช้กับคนที่นอนอยู่ระหว่างตายกับไม่ตาย เรียกชื่อเต็มสามครั้ง เว้นนานเท่าลมหายใจยาวหนึ่งครั้ง แล้วเรียกใหม่ {name}เรียกชื่อเมลิคตามบทนั้นจนเสียงแตก ผู้เฝ้ากะดึกมายืนถือคบไฟเรียงอยู่ข้างหลังโดยไม่มีใครสั่ง

        เมลิคเดินกลับมาตอนฟ้าเริ่มเทา เขาบอกว่าได้ยินคนเรียกสองทาง ทางหนึ่งเรียกชื่อถูกทุกพยางค์ อีกทางมีเสียงคนหลายสิบคนหายใจอยู่ข้างหลังคนเรียก เขาเลือกทางที่มีคนหายใจ
      effects: { stats: { WIS: 1 }, flags: [fetched_melik] }
    - id: wait_for_dawn
      label: บอกหัวหน้ากะว่ากฎเขียนไว้แล้ว รอจนสางค่อยออกตาม
      refuse: true
      text: |
        กะเช้าออกตามรอยไปตอนแดดขึ้น รอยเท้าเปล่าเดินตรงไปหกร้อยก้าวแล้ววนเป็นวง กลางวงมีเสื้อของเมลิคพับเรียบวางอยู่บนเถ้า พับแบบที่แม่สอนลูกให้พับก่อนนอน นอกจากนั้นไม่มีอะไร

        เอสทรินขีดช่องปัดของ{name}หนึ่งเส้น หน้าของเมลิคในสมุดเวรมีอยู่สามบรรทัด ทั้งสามบรรทัดอยู่ในช่องรับ
      effects: { alignment: { law: 1 }, flags: [waited_for_dawn_melik] }

- id: adult.wardens_duty_ash_box
  stage: adult
  scene: road
  weight: 20
  duty: wardens
  when:
    age: [22, 62]
    org: wardens
  text: |
    ทาวิน ผู้เฝ้าจากบ้านหญ้าเงิน ตายที่หินก้อนที่สามสิบเจ็ดเมื่อต้นเดือน เถ้าของเขาอยู่ในกล่องดีบุกใบเท่าฝ่ามือ ค่าจ้างค้างสามเดือนอยู่ในถุงผ้าอีกใบ เอสทรินนับเหรียญต่อหน้า{name}สองรอบ แล้วผูกปากถุงด้วยเชือกป่านเส้นเดียวกับที่ใช้ผูกกล่อง

    บ้านหญ้าเงินอยู่ห่างป้อมครึ่งวันเดิน หลังคามุงแผ่นดีบุกที่ตัดจากถังน้ำมันเก่า คนในหมู่บ้านมีตราเกือบทุกคน ทำงานในเหมืองเกือบทุกคน เดือนนี้นักล่าแม่มดของศาสนจักรตะเกียงสามคนตั้งกระโจมอยู่ที่ปากทางเข้าหมู่บ้าน จดชื่อทุกคนที่เดินเข้าออก แม่ของทาวินยังไม่รู้ว่าลูกตายแล้ว
  choices:
    - id: walk_past_the_tent
      label: เดินผ่านกระโจมของนักล่าแม่มดตรงๆ ถือกล่องไว้ในมือให้เห็น
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          นักล่าแม่มดคนหัวหน้าเดินออกมาขวาง ถามว่าในกล่องมีอะไร {name}บอกว่าผู้เฝ้าผนึกที่ตายบนแนวหิน ตายเพื่อกันของจากข้างในไม่ให้ออกมาถึงตะเกียงของพวกเขา นักล่าแม่มดยืนอยู่อย่างนั้นครู่หนึ่ง แล้วถอดหมวกปีกกว้างออกถือไว้ระดับอก หลีกทางให้ จนกว่า{name}จะเดินพ้นไป เขาไม่ได้จดชื่อใคร

          แม่ของทาวินรับกล่องไว้ด้วยสองมือที่ดำเพราะถ่าน นางเปิดถุงเงินนับเหรียญต่อหน้า{name} ครบทุกเหรียญ นางว่าลูกชายนางนับเงินเก่งที่สุดในบ้าน
        effects: { stats: { CHA: 1 }, reputation: { wardens: 1 }, flags: [delivered_tavins_box] }
      failure:
        text: |
          นักล่าแม่มดสองคนขวางทางไว้ คนหนึ่งเอาปลายมีดงัดฝากล่องดีบุกออกต่อหน้า เถ้าข้างในหกลงบนดินครึ่งกำมือ {name}คุกเข่ากวาดกลับลงกล่องด้วยมือเปล่า ทีละหยิบ จนนักล่าแม่มดคนที่สามบอกให้เพื่อนหลีกไป เพราะคนในหมู่บ้านเริ่มออกมายืนดูกันเต็มทาง

          แม่ของทาวินยืนอยู่ที่ประตูบ้านตลอด นางรับกล่องไปกอดไว้กับอก ปากยังเปื้อนเถ้าตรงที่เผลอเอามือป้าย ถุงเงินเบาลงสองเหรียญ เป็นค่าที่นักล่าแม่มดเก็บไปตอนปล่อยให้ผ่าน
        effects: { gold: -2, flags: [delivered_tavins_box] }
    - id: back_way_in
      label: อ้อมไปทางเนินเถ้าหลังหมู่บ้าน ทางที่คนในหมู่บ้านใช้หลบคนมาจดชื่อ
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          ทางหลังเนินชันจนต้องใช้มือช่วยปีน เถ้าไหลลงตามเท้าทุกก้าว เด็กสองคนที่นั่งเฝ้าอยู่บนเนินเห็นผ้าคลุมสีเทาของภาคีแล้ววิ่งนำทางลงไปให้ ไม่ต้องถามว่ามาหาใคร

          แม่ของทาวินจุดตะเกียงน้ำมันดวงเดียวในบ้านทั้งที่ยังกลางวัน วางกล่องไว้ตรงหน้า แล้วขอให้{name}เล่าว่าคืนนั้นลูกชายยืนอยู่ตรงไหน {name}เล่าตามที่คนกะดึกเล่าต่อมา ทุกคำ
        effects: { stats: { DEX: 1 }, flags: [delivered_tavins_box] }
      failure:
        text: |
          เถ้าบนเนินไหลลงพร้อมตัว{name}ไปกองอยู่หลังกระโจมพอดี นักล่าแม่มดสามคนออกมาจับแขนไว้ ถามชื่อ ถามงาน ถามว่าทำไมต้องอ้อม แล้วจดชื่อ{name}ลงสมุดเล่มเดียวกับชื่อคนในหมู่บ้าน

          กล่องไปถึงมือแม่ของทาวินตอนเย็น ช้ากว่าที่ควรครึ่งวัน ตะเกียงในบ้านนางจุดรอไว้แล้ว มีคนในหมู่บ้านวิ่งไปบอกก่อน
        effects: { hp: -1, flags: [delivered_tavins_box, on_lamp_list] }
    - id: rite_at_the_door
      label: ขอให้นักล่าแม่มดยืนร่วมพิธีส่งที่หน้าบ้านของแม่ทาวิน
      requires: { flag: job_fort_priest }
      text: |
        {name}ไปขอถึงหน้ากระโจม บอกว่าพิธีส่งคนตายของ{god}ต้องมีคนนอกครอบครัวยืนฟังอย่างน้อยสามคน ในหมู่บ้านนี้คนนอกมีอยู่สามคนพอดี นักล่าแม่มดคนหัวหน้าเคาะปากกาขนนกกับขอบสมุดสองสามที แล้วลุกตามมา ลูกน้องสองคนลุกตาม

        พวกเขายืนหลังสุดตลอดพิธี หมวกอยู่ในมือ คนในหมู่บ้านยืนเต็มลาน หันหลังให้พวกเขา พอพิธีจบ หัวหน้านักล่าแม่มดเขียนอะไรบางอย่างในสมุดของตัวเอง แล้วขีดฆ่าบรรทัดนั้นทิ้ง
      effects: { stats: { WIS: 1 }, reputation: { wardens: 1 }, flags: [delivered_tavins_box] }
    - id: send_by_cart
      label: ฝากกล่องกับคนขับเกวียนน้ำมันที่ผ่านหมู่บ้านพรุ่งนี้
      refuse: true
      text: |
        คนขับเกวียนรับกล่องกับถุงเงินไว้ บอกว่าผ่านหมู่บ้านนั้นทุกเที่ยว รู้จักบ้านแม่ของทาวินดี

        กล่องไปถึงบ้านหญ้าเงินในสามวัน ถุงเงินไปถึงพร้อมกัน เหรียญขาดไปหนึ่ง คนขับเกวียนบอกว่าเขาไม่ได้เปิด นักล่าแม่มดที่ปากทางเปิด
      effects: { flags: [sent_tavins_box_by_cart] }

- id: adult.wardens_duty_blasting
  stage: adult
  scene: mine
  weight: 20
  duty: wardens
  when:
    age: [25, 64]
    org: wardens
  text: |
    บริษัทเหมืองจะระเบิดหน้าดินที่หลุมใหม่ตอนเที่ยง หลุมนั้นห่างหินก้อนที่สี่สิบเอ็ดสามร้อยก้าว ตรงตามระยะที่ใบอนุญาตเขียนไว้ทุกตัวอักษร คนงานฝังดินดำลงไปสิบสองหลุมตั้งแต่เช้า สายชนวนลากมารวมกันที่ม้านั่งไม้ตัวเดียว หัวหน้าคนงานนั่งอยู่บนม้านั่งนั้น สูบกล้องยา ด้ายสีแดงเลือดหมูพันข้อมือขวาสามรอบ

    เมื่อคืนตอนบริษัทฝังดินดำหลุมแรก หินก้อนที่สี่สิบเอ็ดครางจนตะเกียงบนขอเหล็กแกว่ง ภาคีไม่มีอำนาจห้ามสิ่งที่ใบอนุญาตเขียนไว้แล้ว ป้อมส่ง{name}ไปพูด พูดเฉยๆ ไม่มีอะไรในมือนอกจากปาก
  choices:
    - id: sit_on_the_fuse
      label: นั่งลงบนจุดที่สายชนวนรวมกัน ไม่ลุกจนกว่าเขาจะเลื่อน
      habit: stubborn
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}นั่งลงบนกองสายชนวนตั้งแต่สายถึงตะวันตกดิน แดดบนเถ้าร้อนจนกางเกงแนบผิว คนงานยืนดู หัวหน้าคนงานสูบกล้องยาหมดไปสามกล้อง ไม่มีใครกล้าจุดชนวนที่มีคนนั่งทับอยู่ ตอนเย็นวิศวกรขี่ม้ามา คุยกับหัวหน้าคนงานเบาๆ แล้วสั่งเลื่อนไปเจ็ดวัน เจ็ดวันนั้นหินก้อนที่สี่สิบเอ็ดไม่ครางอีก

          ก่อนกลับ หัวหน้าคนงานแกะด้ายแดงออกจากข้อมือ ผูกไว้ที่ขาม้านั่งตรงที่{name}นั่ง ผูกเงื่อนแน่นสามรอบ ไม่ได้มองหน้าใครตอนผูก
        effects: { stats: { CON: 1 }, reputation: { wardens: 1 }, hunted: { ash_cult: 1 }, flags: [sat_on_the_fuse] }
      failure:
        text: |
          ตอนเที่ยง คนงานสี่คนหิ้วปีก{name}ออกจากกองสายชนวนไปวางไว้ห่างร้อยก้าว จับไว้ไม่ให้ลุก หัวหน้าคนงานเคาะกล้องยาลงปลายชนวน

          ดินดำสิบสองหลุมระเบิดเกือบพร้อมกัน เถ้าลอยขึ้นเป็นกำแพง แรงลมผลัด{name}กับคนที่จับไว้ล้มกลิ้งไปด้วยกัน ทางป้อม หินก้อนที่สี่สิบเอ็ดครางยาวจนตะเกียงทุกดวงบนแนวแกว่ง เถ้าข้างหินอุ่นอยู่จนสิ้นเดือน
        effects: { hp: -2, flags: [blast_went_ahead] }
    - id: count_the_paces
      label: ขอดูใบอนุญาต แล้วนับก้าวจากหินไปถึงหลุมเอง
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ใบอนุญาตเขียนว่าสามร้อยก้าวนับจากแนวหิน {name}อ่านซ้ำสองรอบ แนวหินในแผนที่ของภาคีลากผ่านกลางหิน ไม่ได้ลากผ่านหน้าหิน บริษัทนับจากหน้าหินด้านนอก {name}เดินนับให้ดูต่อหน้าคนงานทั้งหมด จากกลางหินไปถึงขอบหลุม สองร้อยเก้าสิบเอ็ดก้าว

          วิศวกรมานับซ้ำเอง ได้สองร้อยเก้าสิบสาม บริษัทต้องย้ายหลุมออกไปอีกสิบก้าว ขุดดินดำขึ้นมาฝังใหม่ทั้งสิบสองหลุม เสียเวลาไปห้าวัน หัวหน้าคนงานเลิกสูบกล้องยาไปทั้งห้าวันนั้น
        effects: { stats: { INT: 1 }, reputation: { wardens: 1 }, flags: [measured_the_blast] }
      failure:
        text: |
          {name}นับได้สามร้อยสี่ก้าว นับใหม่ได้สามร้อยสอง ใบอนุญาตถูกทุกบรรทัด หัวหน้าคนงานยื่นกล้องยามาให้สูบด้วยท่าทางเหมือนคนปลอบเด็ก {name}ไม่รับ

          ตอนเที่ยง ดินดำสิบสองหลุมระเบิด หินก้อนที่สี่สิบเอ็ดครางยาวจนได้ยินถึงห้องกินข้าว
        effects: { flags: [blast_went_ahead] }
    - id: old_stakes
      label: บอกหัวหน้าคนงานว่าหลักเขตของบริษัทเคยมีคนย้ายมาแล้ว และคนนั้นยังจำได้ว่าหลักเดิมอยู่ตรงไหน
      requires: { flag: moved_mine_stakes }
      text: |
        หัวหน้าคนงานดึงกล้องยาออกจากปาก {name}เดินไปปักเหล็กลงเถ้าตรงที่หลักเขตทาสีแดงของบริษัทเคยปักอยู่เมื่อหลายปีก่อน ก่อนจะมีใครถอนไปปักใหม่ตอนตีสาม หลุมระเบิดหลุมที่หกอยู่ห่างเหล็กแท่งนั้นไม่ถึงยี่สิบก้าว

        หัวหน้าคนงานรู้ว่าแผนที่ของบริษัททำมาจากหลักชุดไหน เขาสั่งเลื่อนการระเบิดเอง โดยไม่รอวิศวกร แล้วนั่งกลับลงบนม้านั่ง กล้องยาดับคามืออยู่อย่างนั้นจนเย็น
      effects: { reputation: { wardens: 1 }, alignment: { law: -1 }, flags: [measured_the_blast] }
    - id: no_rites_for_the_pit
      label: บอกคนงานว่าใครตายในหลุมนี้ นักบวชป้อมสามจะไม่สวดส่งให้
      requires: { flag: job_fort_priest }
      text: |
        คนงานเหมืองที่ตายในหลุมใกล้แนวหิน เพื่อนร่วมหลุมหามมาเผาที่เตาหลอมของป้อมสามมาตลอด เพราะบริษัทไม่มีนักบวช {name}พูดประโยคนั้นเสียงไม่ดัง แต่คนงานที่ยืนใกล้ม้านั่งได้ยินทุกคน ไม่มีใครยอมยื่นไฟให้หัวหน้าคนงาน

        การระเบิดเลื่อนออกไปจนกว่าบริษัทจะหานักบวชมาประจำหลุมได้เอง ทั้งเดือนนั้นไม่มีนักบวชคนไหนยอมมา {name}นอนไม่หลับไปหลายคืน เพราะเรื่องที่พูดออกไปเป็นเรื่องที่{god}ไม่เคยอนุญาต
      effects: { alignment: { law: -1 }, reputation: { wardens: 1 }, flags: [threatened_the_pit_rites] }
    - id: paper_is_right
      label: กลับไปบอกเอสทรินว่ากระดาษถูกทุกบรรทัด ไม่มีอะไรให้พูด
      refuse: true
      text: |
        {name}เดินกลับป้อมก่อนเที่ยง ได้ยินเสียงระเบิดตอนกำลังข้ามลาน เสียงมาถึงช้ากว่าแรงสั่นที่เท้าครึ่งอึดใจ ตะเกียงบนขอเหล็กหินก้อนที่สี่สิบเอ็ดแกว่งอยู่นานกว่าดวงอื่น

        เอสทรินขีดช่องปัดหนึ่งเส้นโดยไม่ถามอะไร ข้างเส้นนั้นนางเขียนเลขหินกำกับไว้ สี่สิบเอ็ด
      effects: { world: { demon: 1 }, flags: [let_the_blast_go] }

- id: adult.wardens_duty_warm_count
  stage: adult
  scene: fort
  weight: 20
  duty: wardens
  when:
    age: [25, 64]
    org: { id: wardens, min_rank: 2 }
  text: |
    เช้ามืดวันนั้นเป็นเวรนับหินของ{name} สิบหกก้อน วางฝ่ามือบนหินทุกก้อนนานเท่าหายใจเข้าออกสามครั้ง แล้วเขียนลงสมุดนับหินว่าครบและนิ่ง สิบห้าก้อนเย็นเหมือนทุกเช้า ก้อนที่สี่สิบสี่อุ่น อุ่นแบบหลังม้าที่เพิ่งวิ่งมา ไม่ใช่อุ่นแบบหินโดนแดด แดดยังไม่ขึ้น

    เอสทรินมายืนรอที่ปลายแนว ขอเหล็กเกี่ยวหูถังน้ำมันเปล่า นางรู้แล้วจากหน้าของ{name} นางบอกว่าเดือนไหนสมุดนับหินมีคำว่าอุ่น ราชสำนักจะส่งผู้ตรวจมา และเงินค่าน้ำมันของฤดูนั้นจะค้างอยู่ที่เวนทราสจนกว่าผู้ตรวจจะเขียนรายงานเสร็จ หนาวที่แล้วค้างอยู่สี่เดือน นางไม่ได้ขอให้{name}เขียนอะไร นางแค่ยกถังเปล่าขึ้นให้ดู
  choices:
    - id: write_warm
      label: เขียนว่าอุ่น พร้อมเลขหินกับเวลาที่วางมือ
      text: |
        {name}เขียนบรรทัดนั้นด้วยลายมือที่ตั้งใจให้ชัดกว่าบรรทัดอื่น หินก้อนที่สี่สิบสี่ ก่อนสาง อุ่นมือ แล้วลงชื่อท้ายหน้าเหมือนทุกเช้า

        เงินค่าน้ำมันค้างอยู่ที่เวนทราสสามเดือน ป้อมสามจุดตะเกียงบนแนวหินเว้นขอหนึ่ง ห้องกินข้าวกินในความมืด เบอร์ทัลต้มน้ำแกงวันละหม้อแทนสองหม้อ ไม่มีใครในป้อมพูดถึงบรรทัดนั้นต่อหน้า{name}สักคำ ทั้งคำว่าดีและคำว่าไม่ดี
      effects: { alignment: { law: 1 }, flags: [wrote_warm_in_count] }
    - id: count_by_the_hour
      label: ยังไม่เขียนอะไร กลับมาวางมือซ้ำตอนเที่ยงและตอนตีสาม
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ตอนเที่ยงหินก้อนที่สี่สิบสี่เย็นเหมือนก้อนอื่น ตอนตีสามอุ่นกว่าตอนสางอีก {name}เขียนทั้งสองเวลาลงสมุด กับเวลาตอนสาง สามบรรทัดเรียงกัน

          ผู้ตรวจที่ราชสำนักส่งมาอ่านสามบรรทัดนั้นแล้วยอมค้างที่ป้อมหนึ่งคืน ลุกขึ้นมาวางมือบนหินเองตอนตีสาม รายงานของเขาเสร็จในสองเดือนแทนสี่ เอสทรินบอกว่าสองเดือนที่ได้คืนมา เท่ากับน้ำมันสิบหกถัง
        effects: { stats: { WIS: 1 }, flags: [wrote_warm_in_count, counted_by_the_hour] }
      failure:
        text: |
          ตอนเที่ยงหินเย็นมือ ตอนตีสามหมาเถ้าสามตัวมานั่งรออยู่หน้าหินก้อนที่สี่สิบสี่ {name}ไปถึงตัวหินไม่ได้ ได้แต่ยืนดูอยู่ห่างสิบก้าวจนสาง แผลที่ข้อมือได้มาจากตัวที่เข้ามาใกล้เกินไป

          {name}เขียนลงสมุดว่าก่อนสางอุ่นมือ ตอนเที่ยงเย็น ตอนตีสามมีของนั่งเฝ้า จดหมายจากภาคีตอบกลับมาถามว่าของนั่งเฝ้าแปลว่าอะไร
        effects: { hp: -1, flags: [wrote_warm_in_count] }
    - id: write_still
      label: เขียนว่านิ่ง เหมือนอีกสิบห้าก้อน
      text: |
        เงินค่าน้ำมันมาถึงตรงเวลา ป้อมสามจุดตะเกียงครบทุกขอตลอดหนาว ห้องกินข้าวสว่าง เบอร์ทัลต้มน้ำแกงวันละสองหม้อ

        หินก้อนที่สี่สิบสี่อุ่นอยู่ทั้งหนาว {name}วางมือบนหินก้อนนั้นทุกเช้าที่เป็นเวรนับ นับลมหายใจครบสามครั้ง แล้วเขียนว่านิ่งทุกเช้า
      effects: { alignment: { moral: -1 }, world: { demon: 1 }, flags: [wrote_still_on_warm_stone] }
    - id: match_the_dead
      label: เปิดสมุดคนตายของป้อมเทียบกับสมุดนับหินย้อนหลังก่อนเขียน
      requires: { flag: job_fort_priest }
      text: |
        สมุดคนตายของป้อมสามเป็นงานของนักบวช {name}เปิดเทียบกับสมุดนับหินทีละปีจนเทียนหมดเล่ม ปีไหนหินก้อนที่สี่สิบสี่มีคำว่าอุ่นในสมุดนับหิน ปีนั้นมีคนตายที่หินก้อนนั้นมากกว่าปีอื่นสามเท่า ปีไหนมีคนเขียนว่านิ่งทั้งปี ตัวเลขในสมุดคนตายก็ไม่ได้น้อยลง

        {name}เขียนว่าอุ่น แล้วแนบรายชื่อคนตายที่หินก้อนที่สี่สิบสี่ย้อนหลังสิบปีไปกับสมุดนับหินที่ส่งภาคี รายชื่อยาวหนึ่งหน้าครึ่ง
      effects: { stats: { INT: 1 }, flags: [wrote_warm_in_count, matched_the_dead_to_stones] }
    - id: hand_the_count
      label: ขอให้ผู้นับหินอีกคนมาวางมือนับใหม่ แล้วให้เขาเป็นคนเขียน
      refuse: true
      text: |
        ผู้นับหินอีกคนมาถึงตอนแดดขึ้น ตอนนั้นแดดส่องหินทุกก้อนอุ่นเท่ากันหมดแล้ว เขาวางมือครบสิบหกก้อน เขียนว่านิ่ง แล้วลงชื่อของตัวเอง

        เอสทรินขีดช่องปัดของ{name}หนึ่งเส้น ถังน้ำมันเปล่าที่นางถือมายังวางอยู่ที่ปลายแนวหินจนเย็น ไม่มีใครเก็บ
      effects: { flags: [handed_the_count_away] }

- id: adult.wardens_duty_stone_scraper
  stage: adult
  scene: fort
  weight: 20
  time: night
  duty: wardens
  when:
    age: [25, 62]
    org: { id: wardens, min_rank: 2 }
  text: |
    ก่อนสางยังเหลือครึ่งชั่วยาม {name}เดินนับหินมาถึงก้อนที่สี่สิบเจ็ด ก้อนเกือบสุดท้ายของแนวป้อมสาม ตะเกียงบนขอเหล็กของก้อนนั้นดับ น้ำมันยังเหลือ แต่ไส้ตะเกียงโดนบีบจนแบน

    คนในเสื้อคลุมดำขลิบแดงเลือดหมูคุกเข่าอยู่ที่โคนหินด้านนอกแนว ชามเหล็กใส่ถ่านมารวางข้างเข่า มือข้างหนึ่งถือตะปูยาวเท่าฝ่ามือ ขูดอักษรที่สลักบนหิน ขูดไปตามร่องทีละตัวเหมือนคนลอกลายมือคนอื่น เสียงเหล็กขูดหินเบาจนถ้าไม่ได้ยืนห่างแค่สิบก้าวก็ไม่ได้ยิน อักษรสามตัวล่างสุดเหลือแค่รอยขูดสีขาว
  encounter:
    foe: ash_cultist
    name: สาวกลัทธิเถ้าที่หินก้อนที่สี่สิบเจ็ด
    morale: 2
    beats:
      - text: เขาไม่หันมา ขูดตัวอักษรตัวที่สี่ต่อไปทีละขีด แล้วพูดขึ้นมาเหมือนคุยกับหิน ว่าคนที่สลักอักษรพวกนี้ไม่รู้ด้วยซ้ำว่ากำลังขังอะไรไว้ ถ่านในชามข้างเข่าสว่างขึ้นตามลมหายใจของเขา
        moves:
          - id: scrape_water
            label: ดึงจุกกระบอกน้ำ สาดใส่ชามไฟข้างเข่าเขา
            kind: item
            stat: DEX
            tags: [water]
            success: น้ำในกระบอกลงกลางชามพอดี ถ่านมารร้องเสียงเหมือนเหล็กชุบ ไอสีสนิมพุ่งขึ้นใส่หน้าเขา ตะปูในมือหลุดลงเถ้า เขาหันมาเป็นครั้งแรก หน้าตาธรรมดาเหมือนคนงานเหมืองทุกคนที่เคยเดินสวนกันบนทางขนถ่าน
          - id: scrape_spear
            label: พุ่งเข้าไปแทงก่อนเขาลุก
            kind: attack
            tags: [pierce]
          - id: scrape_name
            label: ถามเขาว่าใครส่งมา แล้วบอกว่าหินก้อนนี้มีคนนับทุกเช้า
            kind: talk
            parley: true
          - id: scrape_look
            label: ยกตะเกียงขึ้นดูหน้า ดูมือ ดูว่าเขามาจากไหน
            kind: read
            stat: INT
            success: เล็บทุกเล็บของเขาดำเพราะถ่าน ไม่ใช่เพราะดิน ข้อมือขวามีด้ายแดงพันสามรอบเหมือนหัวหน้าคนงานที่หลุมระเบิด รองเท้าเป็นรองเท้าบู๊ตของบริษัทเหมืองที่ยังไม่ทันสึก คนนี้ไม่ได้มาไกล เขากลับไปนอนในค่ายคนงานได้ก่อนสาง
          - id: scrape_bell
            label: วิ่งกลับไปตีระฆัง
            kind: flee
      - text: เขาลุกขึ้นพร้อมชามไฟ เป่าลงไปในชามทีเดียว ถ่านคุพุ่งออกมาเป็นสายใส่หน้าของ{name}
        answer: quick
        moves:
          - id: scrape_sidestep
            label: เบี่ยงตัวหลบหลังหิน ให้ถ่านคุกระทบหินแทน
            kind: quick
          - id: scrape_book_shield
            label: ยกสมุดนับหินขึ้นบังหน้า
            kind: guard
          - id: scrape_rush
            label: ก้มหน้าพุ่งฝ่าสายถ่านเข้าไปถึงตัว
            kind: attack
          - id: scrape_bell2
            label: ถอยกลับเข้าแนวหิน วิ่งไปทางหอเวร
            kind: flee
      - text: เขาวางมือข้างที่ไม่ได้ถือชามแนบลงบนหินก้อนที่สี่สิบเจ็ด ตรงรอยอักษรที่ขูดไปแล้ว หินครางต่ำจนรู้สึกได้ที่ฟัน ฝ่ามือเขาเริ่มมีควันขึ้น แต่เขาไม่ยอมเอามือออก
        answer: attack
        moves:
          - id: scrape_strike_arm
            label: ฟาดด้ามหอกลงตรงแขนข้างที่แนบหิน
            kind: attack
            tags: [blunt]
            success: ด้ามหอกลงเต็มแขนท่อนล่าง เสียงกระดูกดังพร้อมเสียงเขาร้อง มือที่แนบหินหลุดออกมา ฝ่ามือไหม้ดำเป็นรูปรอยอักษรบนหิน หินหยุดคราง
          - id: scrape_pull_off
            label: กระชากตัวเขาออกจากหิน
            kind: quick
          - id: scrape_last_water
            label: เทน้ำที่เหลือก้นกระบอกลงบนมือเขากับหิน
            kind: item
            stat: WIS
            tags: [water]
          - id: scrape_bell3
            label: ทิ้งเขาไว้กับหิน วิ่งไปตีระฆังเรียกทั้งป้อม
            kind: flee
    win:
      text: |
        สาวกลัทธิเถ้านอนคว่ำอยู่บนเถ้า แขนข้างหนึ่งงอผิดทาง ชามเหล็กคว่ำอยู่ข้างตัว ถ่านมารดับหมดทุกก้อน กะเช้ามัดเขาไว้กับขอเหล็กของหินก้อนที่สี่สิบเจ็ดจนคนของภาคีมารับตัว เขาไม่บอกชื่อ ไม่บอกอะไรเลยนอกจากถามว่าคนนับหินเช้านี้ชื่ออะไร

        {name}เขียนลงสมุดนับหินว่าหินก้อนที่สี่สิบเจ็ดครบ อักษรล่างสามตัวเสียหาย ช่างซ่อมหินมาสลักใหม่ตามแบบจากหินก้อนข้างๆ ใช้เวลาเจ็ดวัน
      effects: { stats: { WIS: 1 }, reputation: { wardens: 1 }, hunted: { ash_cult: 1 }, flags: [caught_stone_scraper] }
    lose:
      text: |
        กะเช้าเจอ{name}นอนพิงหินก้อนที่สี่สิบเจ็ด เสื้อไหม้เป็นรูเท่าเหรียญหลายสิบรู สมุดนับหินยังอยู่ในมือ ไม่มีหน้าไหนไหม้ สาวกลัทธิเถ้าไปแล้ว ทิ้งตะปูไว้ปักอยู่ในร่องอักษรตัวที่ห้า

        เช้านั้นผู้นับหินอีกคนเป็นคนนับแทน เขาเขียนว่าครบ แล้วเขียนเพิ่มอีกบรรทัดเรื่องอักษรห้าตัวที่หายไป
    stalemate:
      text: |
        ระฆังเปลี่ยนกะดังขึ้นจากป้อม แสงแรกขึ้นที่ขอบฟ้า เขาเก็บชามไฟลุกขึ้นช้าๆ แล้วเดินถอยหลังกลับไปในทุ่งเถ้า ไม่รีบ หันหน้ามาทาง{name}ตลอดทาง จนกลืนหายไปกับสีเทาของเถ้ายามเช้า

        อักษรที่ขูดไปมีสี่ตัว {name}เขียนลงสมุดนับหินตามที่เห็น ทุกตัว
      effects: { reputation: { wardens: 1 } }
    flee:
      text: |
        ระฆังดังสามชุด ทั้งป้อมลงมาที่แนวหิน หน้าหินก้อนที่สี่สิบเจ็ดเหลือแต่รอยคุกเข่าบนเถ้ากับชามเหล็กคว่ำ อักษรล่างสุดหายไปหกตัว

        ช่างซ่อมหินบอกว่าหกตัวนั้นเป็นอักษรชุดที่ไม่มีหินก้อนไหนบนแนวมีซ้ำ ต้องรอให้ภาคีส่งแบบมาจากหอเอกสาร
      effects: { reputation: { wardens: -1 } }
    parley:
      text: |
        เขาหยุดขูด หันมาพิจารณาหน้า{name}ทีละส่วนเหมือนจะจำไว้ แล้ววางตะปูลงบนเถ้าตรงหน้าหิน เขาบอกว่าไม่มีใครส่งเขามา แล้วบอกอีกว่าหินของป้อมสามยังมีคนนับ แต่ห้องล่างของบางป้อมเงียบกว่าที่นี่มาหลายหนาวแล้ว

        เขาเดินกลับเข้าไปในทุ่งเถ้าพร้อมชามไฟ {name}เก็บตะปูขึ้นมา ปลายตะปูสึกจนมน ไม่ใช่ตะปูที่เพิ่งใช้ขูดเป็นครั้งแรก
      effects: { flags: [heard_of_a_quiet_fort] }
    death:
      text: |
        ถ่านคุสายสุดท้ายลงเต็มหน้าอก ไม่ร้อนอย่างที่คิด แต่หนัก หนักเหมือนมีคนเอาฝ่ามือกดไว้ {name}ทรุดลงนั่งพิงหิน สมุดนับหินตกลงบนตัก

        เสียงตะปูขูดหินดังต่อจากที่ค้างไว้ ทีละขีด ช้า ไม่รีบ
