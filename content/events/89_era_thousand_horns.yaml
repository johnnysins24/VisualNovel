# ยุคดาวเร่ง ชุด B ไฟล์ 3: ปีเขาพันคู่ (9 เรื่อง ปี 355 ถึง 362) ยืนรอบหมุดปี 355 ทั้งสองแบบ (อาร์เวล และถิ่นไกล)
# ตามคัมภีร์: การล่าลากถึงปี 356 ปี 357 เลิก ตั้งแต่นั้นไม่มีใครตรวจเด็กเกิดใหม่ เด็กรุ่นนั้นคือลูกปีเขา ไม่มีฉากไหนให้เห็นเด็กเจ็บ รถมีประทุนออกไปก็พอ
# ช่วงวัย: ทุกวัย 6 (หมวกผ้า เกวียนเกลือ พยานหัวเกลี้ยง ทางสามแพร่ง นับใหม่หมึกแดง คนที่มากับเกวียนเกลือ) · วัยทำงาน 1 (คนเข็นคนที่สาม) · วัยชรา 2 (สองแท่นเทศน์ เกมของลูกปีเขา)
# คนที่มีแต่ในข้อความ: ลอธาน ช่างเย็บหมวก · เกลเบน คนขับเกวียนเกลือ · ทอลวิน เสมียนทะเบียนวิหาร (ใน bare_headed_witness กับ red_ink_recount คนเดียวกัน)
#   หมอตำแย หญิงขายผ้า นักบวชสองวิหาร ช่างตีเกือกม้าที่มีเขา คนถือสมุดของคนเสื้อคลุมขาว (ไม่มีชื่อ)
# ของที่คิดขึ้นในไฟล์นี้: ตะเข็บหนาตรงขมับของหมวกปีเขา · ช่องเกิดหัวเกลี้ยงในใบเกิดกับพยานสองคน · หินวางของที่ทางสามแพร่งกับริบบิ้นสีฟ้า (มีริบบิ้น = พ่อแม่อาจกลับมาก่อนเที่ยง)
#   ธรรมเนียมออกชื่อรับคนที่มาแล้วไม่ไป (ใครเป็นคนพาเข้า) กับวิธีเก่าที่ให้คนใหม่ทำงานให้ทุกบ้านจนครบปี · เกมเสื้อขาวจับเขา · เกลือร่อนขี้เถ้าจากบ้านหญ้าขม

# ---------- ทุกวัย ----------
- id: adult.era_horns_bonnet_season
  stage: adult
  weight: 24
  when:
    age: [16, 130]
    year: [355, 356]
    location_tag: [arvel_village, ventras, kardin]
  text: |
    ปีนี้เด็กอ่อนทุกคนในซอยใส่หมวกผ้า มีเขาหรือไม่มีก็ใส่ ผูกใต้คาง ปิดถึงคิ้ว แม่ที่ลูกหน้าผากเกลี้ยงใส่ให้ลูกก่อนใครด้วยซ้ำ เด็กใส่หมวกคนเดียวในซอยคือเด็กที่ทุกคนรู้ว่าซ่อนอะไร เด็กใส่หมวกทั้งซอยคือหมวกที่ไม่บอกอะไรใครเลย

    ลอธาน ช่างเย็บหมวกที่ตลาด ไม่ได้นอนเต็มคืนมาตั้งแต่ต้นปี ร้านเปิดถึงตีสาม เสียงกรรไกรตัดผ้าดังออกมาถึงถนน เขาเย็บแบบเดียว ผ้าฝ้ายสองชั้น ตะเข็บหนาตรงขมับ ใครถามว่าทำไมต้องหนาตรงนั้น เขาบอกว่าเด็กชอบเอาหัวโขกเปล

    หมวกใบละสองเหรียญ แม่ที่ไม่มีเงินจ่ายเป็นไข่ เป็นถ่าน เป็นผ้าเก่าให้เขาตัดใบใหม่ เย็นนี้{name}ผ่านหน้าร้าน ลอธานหลับคาโต๊ะ มือยังถือเข็ม หมวกที่เย็บค้างกองสูงถึงเข่า
  choices:
    - id: buy_bonnets_for_bare_heads
      label: ซื้อหมวกโหลหนึ่ง ไปแจกบ้านที่มีเด็กอ่อนแต่ไม่มีเงินซื้อ
      habit: soft_heart
      text: |
        {name}แจกทุกบ้านที่มีเด็กอ่อนแต่ยังไม่มีหมวก ไม่ถามว่าบ้านไหนต้องซ่อนอะไร แม่คนหนึ่งรับหมวกไปแล้วยืนนิ่ง บอกว่าลูกนางไม่มีอะไรต้องซ่อน {name}บอกว่ารู้ แล้วผูกหมวกให้เด็กเอง

        บ่ายวันต่อมาคนเสื้อคลุมขาวเดินผ่านซอย เด็กอ่อนทุกบ้านใส่หมวกแบบเดียวกัน ผ้าเดียวกัน ตะเข็บเดียวกัน คนถือสมุดหยุดเขียนกลางหน้า
      effects: { gold: -2, stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [bought_bonnets_for_bare_heads], city: { merit: 1, here: true } }
    - id: tell_the_white_cloaks
      label: บอกคนเสื้อคลุมขาวว่าหมวกทั้งซอยมาจากร้านไหน
      habit: cold_blood
      text: |
        คนเสื้อคลุมขาวให้{name}หนึ่งเหรียญ แล้วไม่ได้ทำอะไรลอธาน ไม่ปิดร้าน ไม่จับ คนถือสมุดไปนั่งในร้านทั้งวัน ซื้อหมวกทุกใบที่เย็บเสร็จ จ่ายราคาเต็ม และจดชื่อทุกคนที่เดินเข้ามาสั่ง ตกเย็นไม่มีใครเข้าร้านอีก คืนนั้นลอธานได้นอนเต็มคืนเป็นคืนแรกของปี

        หมวกที่คนเสื้อขาวซื้อไปทั้งตะกร้า วันต่อมาวางกองอยู่หน้าวิหารตะเกียง ป้ายเขียนว่าแจกฟรี ไม่มีใครหยิบ
      effects: { gold: 1, world: { gods: 1 }, reputation: { lamp_church: 1 }, alignment: { moral: -1 }, flags: [named_the_bonnet_maker] }
    - id: learn_to_sew
      label: ขอนั่งเย็บหมวกช่วยลอธานตอนกลางคืน
      habit: craft_hands
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          ลอธานสอนครั้งเดียว ตะเข็บตรงขมับเย็บสองรอบ ปมซ่อนไว้ด้านใน ไม่ให้ระคายหัวเด็ก {name}เย็บได้คืนละสี่ใบ ลอธานได้นอนหัวค่ำวันเว้นวัน

          ปลายปีมีหมวกใบหนึ่งตะเข็บเบี้ยวอยู่บนหัวเด็กบ้านท้ายซอย {name}จำได้ว่าเป็นใบแรกของตัวเอง แม่ของเด็กผูกเชือกใต้คางให้แน่นเป็นสองปม
        effects: { stats: { DEX: 1 }, flags: [learned_to_sew_horn_year_bonnets] }
      failure:
        text: |
          เข็มแทงนิ้วจนเลือดซึมผ้าไปสองใบ ลอธานเอาไปซักแล้วเย็บต่อเอง หมวกสองใบนั้นมีรอยจางสีน้ำตาลตรงขมับ เขาขายครึ่งราคา

          แม่ที่ซื้อไปบอกว่าดีแล้ว หมวกเปื้อนเลือดแบบนี้คนเสื้อขาวไม่อยากจับ
        effects: { flags: [learned_to_sew_horn_year_bonnets] }

- id: adult.era_horns_salt_cart_barn
  stage: adult
  weight: 24
  time: night
  when:
    age: [16, 130]
    year: [355, 357]
    location_tag: arvel_village
  text: |
    หมาบ้าน{name}เห่าสองที แล้วเงียบ เพราะคนข้างนอกโยนอะไรให้กิน ชายคนนั้นยืนอยู่หน้ารั้วกับเกวียนเกลือ ล่อสองตัว กระสอบพูนท้ายเกวียน เขาบอกชื่อก่อนบอกธุระ เกลเบน ขับเกวียนเกลือสายบ้านหญ้าขมมาหลายหน้าแล้ว ขอค้างในยุ้งคืนเดียว จ่ายเป็นเกลือ

    ระหว่างที่เขาพูด กระสอบใบล่างสุดไอ เสียงเล็กๆ ครั้งเดียว แล้วเงียบ เกลเบนพูดต่อเสียงดังขึ้นนิดหนึ่ง เรื่องราคาเกลือที่ตีนเขา เรื่องทางที่ฝนกัดจนเกวียนผ่านยาก

    บ้านอื่นในหมู่บ้านยังไม่มีไฟสักดวง หมาบ้านอื่นยังไม่ตื่น
  choices:
    - id: give_the_barn
      label: เปิดยุ้งให้ ไม่ถามว่าใต้กระสอบมีอะไร
      text: |
        เกลเบนจูงล่อเข้ายุ้งเอง ปิดประตูเอง {name}กลับไปนอน ได้ยินแต่เสียงล่อเคี้ยวฟาง ก่อนไก่ขันเกวียนออกไปแล้ว ถุงเกลือถุงหนึ่งวางอยู่บนธรณี

        ในยุ้ง ฟางตรงที่เกวียนจอดมีรอยบุ๋มเล็กๆ เรียงกันห้ารอย เหมือนมีคนยกตะกร้าลงมาวางพักทั้งคืน แล้วยกขึ้นไปก่อนสว่าง
      effects: { gold: 1, alignment: { moral: 1 }, flags: [gave_the_salt_carter_the_barn] }
    - id: barn_and_bread
      label: เปิดยุ้งให้ แล้วเอาขนมปังกับนมอุ่นไปวางไว้ข้างล้อ
      habit: soft_heart
      text: |
        {name}วางชามนมอุ่นกับขนมปังไว้ข้างล้อหลัง ไม่ชะโงกดูใต้กระสอบ เกลเบนขอบใจแค่ครั้งเดียว ตอนรุ่งชามว่าง เช็ดสะอาด คว่ำไว้บนถังน้ำ

        หน้าหนาวต่อมาเกลเบนผ่านมาอีก ทิ้งถุงเกลือไว้ให้ถุงหนึ่ง เกลือเม็ดหยาบสีเทา ร่อนมากับขี้เถ้า กลิ่นหญ้าขม เขาบอกว่าคนที่บ้านหญ้าขมฝากมา ไม่ได้บอกว่าใคร
      effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [fed_the_salt_cart_in_the_barn] }
    - id: send_him_on
      label: ตักน้ำให้ล่อ แล้วบอกให้ไปต่อก่อนหมาบ้านอื่นตื่น
      habit: faint_heart
      text: |
        เกลเบนไม่เถียง ขอบใจเรื่องน้ำ ถามทางหลังหมู่บ้านที่ไม่ผ่านบ้านนายบ้าน {name}บอกให้ เขาเอาผ้าห่อล้อทั้งสี่แล้วออกไปทางหลังเล้าหมู ไม่มีเสียงล้อสักเสียง

        เช้ามา ทางโคลนหลังบ้าน{name}มีรอยล้อสองแถว กับรอยเท้าคนเดินตามเกวียนสองคู่ คู่หนึ่งเล็กกว่า
      effects: { alignment: { law: 1 }, flags: [sent_the_salt_carter_on] }

- id: adult.era_horns_bare_headed_witness
  stage: adult
  weight: 24
  when:
    age: [16, 130]
    year: [355, 357]
    location_tag: [arvel_village, ventras, kardin]
  text: |
    ใบเกิดของวิหารปีนี้มีช่องใหม่ช่องเดียว ใต้ชื่อเด็ก เกิดหัวเกลี้ยง ต้องมีพยานสองคนลงชื่อว่าเห็นหน้าผากเด็กตอนคลอด ใบที่มีชื่อพยานครบ คนเสื้อคลุมขาวขีดผ่านโดยไม่เอาเหล็กแตะ ใบที่มีชื่อพยานแล้วเด็กไม่นิ่ง ชื่อพยานไปอยู่หน้าหลังสุดของสมุด หมึกแดง

    พยานคนแรกคือหมอตำแย ลงชื่อไปแล้ว ลายมือหวัดจนอ่านไม่ออก พยานคนที่สองหามาสามวันยังไม่ได้

    เช้านี้สองผัวเมียจากท้ายซอยมายืนที่ประตูบ้าน{name} คนเมียอุ้มลูกไว้แนบอก หมวกผ้าผูกใต้คาง คนผัวถือปากกาขนห่านกับใบเกิด หมึกตรงชื่อหมอตำแยยังเป็นมัน ทอลวิน เสมียนทะเบียนของวิหาร ปิดโต๊ะตอนตะวันตกดิน
  choices:
    - id: sign_it
      label: ไปลงชื่อที่โต๊ะของทอลวิน
      habit: soft_heart
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ทอลวินเลื่อนใบเกิดมาให้ ถามคำถามเดียว เห็นหน้าผากเด็กตอนคลอดหรือ {name}ตอบว่าเห็น เสียงเรียบเหมือนบอกราคาไข่ ทอลวินไม่เงยหน้า ประทับตราให้ แล้วเป่าหมึกจนแห้ง

          สัปดาห์ต่อมาคนเสื้อขาวมาถึงซอย เปิดใบเกิดของบ้านท้ายซอย เห็นชื่อพยานครบ ขีดผ่าน รถมีประทุนเข็นผ่านหน้าบ้านนั้นไปโดยไม่ชะลอ
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [signed_as_bare_headed_witness] }
      failure:
        text: |
          ทอลวินถามว่าเห็นหน้าผากเด็กตอนคลอดหรือ {name}ตอบว่าเห็น ทอลวินถามต่อว่าเด็กคลอดตอนไก่ขันหรือตอนตะวันขึ้น {name}ตอบผิดจากที่หมอตำแยเขียนไว้ ทอลวินประทับตราให้อยู่ดี ไม่เงยหน้า

          ปลายสัปดาห์คนเสื้อขาวมาที่ซอย เปิดใบเกิดของบ้านท้ายซอย ขีดผ่าน แล้วเดินมาที่ประตูบ้าน{name} ถามคำถามเดิมอีกรอบ ช้ากว่าเดิม
        effects: { hunted: { lamp_church: 1 }, alignment: { moral: 1 }, flags: [signed_as_bare_headed_witness] }
    - id: refuse
      label: บอกว่าไม่ได้เห็น ลงชื่อให้ไม่ได้
      text: |
        คนผัวพับใบเกิดเก็บใส่อกเสื้อ คนเมียผูกหมวกลูกเพิ่มอีกปม บ่ายนั้นพวกเขาได้พยานคนที่สอง คนขายถ่านที่ย้ายออกจากซอยไปตั้งแต่ก่อนเด็กเกิด ใบเกิดมีชื่อครบ

        ตั้งแต่นั้นคนขายถ่านผ่านซอยทีไร ได้กินข้าวบ้านท้ายซอยทุกครั้ง บ้าน{name}ได้คำทักทายเท่าเดิม
      effects: { alignment: { law: 1 }, flags: [refused_to_witness_a_bare_head] }
    - id: ask_the_price
      label: ถามว่าชื่อของ{name}บนใบนี้มีค่าเท่าไร
      text: |
        คนผัวควักเหรียญสามเหรียญออกมาจากผ้าที่ห่อมาแล้ว เหมือนรู้อยู่ก่อนว่าจะต้องจ่าย {name}ลงชื่อ ทอลวินประทับตราโดยไม่เงยหน้า

        สามวันต่อมาใบเกิดอีกใบมาถึงประตู ของน้องสะใภ้คนผัวจากถิ่นข้างๆ ช่องพยานคนที่สองว่าง เหรียญสามเหรียญห่อผ้ามาด้วย ใบที่สามมาถึงก่อนสิ้นเดือน
      effects: { gold: 3, alignment: { law: -1 }, flags: [sold_a_witness_signature] }

- id: adult.era_horns_crossroads_basket
  stage: adult
  weight: 24
  when:
    age: [16, 130]
    year: [355, 359]
    location_tag: arvel_village
  text: |
    ที่ทางสามแพร่งนอกหมู่บ้านมีหินแบนก้อนหนึ่งอยู่ใต้ต้นโอ๊ก คนแก่เรียกว่าหินวางของ ปีที่ข้าวยากหมากแพง คนเอาของที่เลี้ยงไม่ไหวมาวางตรงนั้นตอนรุ่ง ลูกหมู ลูกแพะ บางปีเป็นเด็ก ธรรมเนียมนี้หายไปนานจนคนรุ่นหลังคิดว่าเป็นนิทาน ปีเขาทำให้กลับมา

    เช้านี้ตอนที่{name}เดินผ่าน มีตะกร้าใบหนึ่งวางอยู่บนหิน ผ้าคลุมมิด หูหิ้วผูกริบบิ้นสีฟ้าเส้นหนึ่ง ตามธรรมเนียม ริบบิ้นแปลว่าพ่อแม่อาจกลับมาก่อนเที่ยง ไม่มีริบบิ้นแปลว่าใครผ่านมาก็เอาไปได้ ไม่มีใครจำได้แล้วว่าถ้าเลยเที่ยงไปแล้วต้องทำอย่างไร

    ผ้าคลุมขยับ ทางหนึ่งไปหมู่บ้าน ทางหนึ่งไปวิหารอีเซล ทางที่สามไปไร่
  choices:
    - id: carry_to_the_bread_hatch
      label: หิ้วตะกร้าไปช่องขนมปังของวิหารอีเซล
      habit: soft_heart
      text: |
        {name}หิ้วตะกร้าเดินช้าๆ ไปตามทางที่สอง พักสองหน ช่องไม้ข้างประตูครัวเปิดอยู่ มือเปื้อนแป้งยื่นออกมารับ ก่อนช่องปิด มือนั้นแตะริบบิ้นสีฟ้า แล้วถามเสียงเบาว่าเลยเที่ยงหรือยัง {name}บอกว่ายัง ช่องปิด

        บ่ายนั้น{name}เดินกลับไปทางสามแพร่ง บนหินวางของมีผู้หญิงคนหนึ่งนั่งอยู่ มือกำผ้าคลุมไหล่จนข้อนิ้วขาว {name}บอกทางไปวิหารอีเซลให้
      effects: { world: { gods: 1 }, alignment: { moral: 1 }, flags: [carried_the_crossroads_basket_to_the_hatch] }
    - id: wait_behind_the_hedge
      label: นั่งรอหลังพุ่มไม้ ดูว่าใครจะกลับมาก่อนเที่ยง
      habit: cool_headed
      text: |
        สายๆ ผู้หญิงคนหนึ่งเดินมาจากทางหมู่บ้าน เดินผ่านหินไปหนึ่งรอบโดยไม่หยุด แล้วย้อนกลับมายืนข้างตะกร้า นางแก้ริบบิ้นออก ผูกเข้าข้อมือตัวเอง แล้วอุ้มตะกร้ากลับไปทางเดิม

        ทั้งปีนั้น{name}เห็นริบบิ้นสีฟ้าเส้นนั้นที่ข้อมือของหญิงขายไข่ทุกวันตลาด นางขายไข่ให้{name}ราคาเท่าคนอื่น
      effects: { stats: { WIS: 1 }, flags: [waited_by_the_crossroads_basket] }
    - id: walk_on
      label: เดินผ่านไป ปล่อยให้เป็นไปตามธรรมเนียม
      habit: cold_blood
      text: |
        {name}เดินต่อไปทางไร่ ไม่หันกลับ ทั้งเช้าทำงานไปหูก็ฟังทางสามแพร่งไป ไม่มีเสียงอะไรมาถึง

        ตกบ่ายตอนเดินกลับ หินวางของว่าง ใต้ต้นโอ๊กมีริบบิ้นสีฟ้าผูกอยู่กับกิ่งต่ำสุด ผูกเป็นโบว์เรียบร้อย
      effects: { world: { land: 1 }, flags: [left_the_crossroads_basket_to_the_custom] }
    - id: leave_a_name
      label: เขียนชื่อบ้านคนมีเขาที่รับเด็กได้ลงบนผ้า ผูกไว้กับหูตะกร้า
      requires: { flag: race_tiefling }
      text: |
        {name}ฉีกชายเสื้อ เขียนด้วยถ่านจากกระเป๋า บ้านคนมีเขาท้ายหมู่บ้าน ทางไปให้ถามคนตีเกือก ผูกไว้ข้างริบบิ้นสีฟ้า แล้วเดินต่อ

        หลายคืนต่อมาบ้านท้ายหมู่บ้านมีเสียงเด็กอ่อนร้องตอนดึก ทั้งหมู่บ้านได้ยิน ไม่มีใครถาม ชายเสื้อชิ้นนั้นกลับมาหา{name}ทางรั้ว ซักสะอาด พับเป็นสี่เหลี่ยม
      effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [left_a_name_on_the_crossroads_basket] }

- id: adult.era_horns_red_ink_recount
  stage: adult
  weight: 120
  when:
    age: [16, 130]
    year: [355, 357]
    location_tag: [arvel_village, ventras, kardin]
    trait: curse_brand
  text: |
    หมายหมึกแดงมาถึงซอยของ{name}เจ็ดใบในเช้าเดียว คนเสื้อคลุมขาวเสียบไว้ที่ประตูทีละบ้าน ไม่เคาะ ทุกใบเขียนเหมือนกัน ผู้มีชื่อในหน้าผู้ต้องตรา และผู้ที่มีคนแจ้งชื่อเข้ามาในปีนี้ ให้มาที่โต๊ะทะเบียนของวิหารเพื่อนับใหม่ภายในสามวัน ปีนี้ศาสนจักรให้เหรียญละชื่อแก่คนที่มาแจ้ง

    ตกเย็นคนที่ได้หมายมานั่งในครัวบ้าน{name} ครบเจ็ดบ้าน ช่างตีเกือกม้าที่เขาสองข้างโค้งไปข้างหลัง หญิงซักผ้ากับลูกสาวสองคน ชายแก่คนหนึ่งที่ไม่มีใครรู้ว่าชื่อเขาไปอยู่ในหน้านั้นได้อย่างไร ตัวเขาเองก็ไม่รู้ ไม่มีใครถามว่าใครแจ้งชื่อใคร

    เสมียนที่โต๊ะทะเบียนคือทอลวิน คนที่จดชื่อทุกคนในครัวนี้มาแล้วทุกครั้งที่มีเรื่องให้จด วันเกิด วันแต่ง วันตายของพ่อแม่ ทุกคนรู้จักเขา ช่างตีเกือกม้าบอกว่าเขาจะไม่เงยหน้า
  choices:
    - id: go_together
      label: ไปพร้อมกันทั้งเจ็ดบ้าน เดินกลางถนน
      text: |
        เช้าวันที่สาม ทั้งเจ็ดบ้านออกจากครัว{name}พร้อมกัน เดินกลางถนน คนในตลาดหลีกทางให้โดยไม่มีใครบอก ที่โต๊ะทะเบียน ทอลวินจดชื่อทีละคนด้วยหมึกแดง ไม่เงยหน้า ถึงชื่อ{name} ปลายปากกาหยุดอยู่เหนือกระดาษครู่หนึ่ง แล้วเขียนต่อ

        ขากลับทั้งเจ็ดบ้านเดินกลางถนนเหมือนตอนมา ช่างตีเกือกม้าเลี้ยงเหล้าทุกคนคนละถ้วยที่ร้านหัวซอย เจ้าของร้านรับเงินแล้วเช็ดถ้วยทุกใบสองรอบ
      effects: { stats: { CHA: 1 }, flags: [went_to_the_recount_together], city: { merit: 1, here: true } }
    - id: go_alone
      label: ไปคนเดียวแต่เช้า ก่อนคนอื่นตื่น
      text: |
        {name}ไปถึงตอนวิหารเพิ่งเปิด ทอลวินกำลังเหลาปากกา ในห้องไม่มีใครอื่น เขาจดชื่อ{name}โดยไม่เงยหน้า ระหว่างนั้นบอกว่าแม่ของเขาฝากถามถึง{name} เสียงเหมือนพูดกับกระดาษ

        ตอน{name}เดินออกจากวิหาร อีกหกบ้านกำลังเดินมาด้วยกันกลางถนน ช่างตีเกือกม้าเห็น{name}แล้วไม่ทัก
      effects: { alignment: { law: 1 }, flags: [went_to_the_recount_alone] }
    - id: dont_go
      label: ไม่ไป
      habit: stubborn
      text: |
        วันที่สามผ่านไป วันที่สี่คนเสื้อคลุมขาวสองคนมายืนที่ประตู ไม่เข้าบ้าน คนหนึ่งเอาชอล์กวาดตะเกียงดวงเล็กไว้ที่ด้านในวงกบประตู ตรงที่คนในบ้านต้องเห็นทุกครั้งที่ออกไปข้างนอก แล้วทั้งสองก็ไป

        {name}เช็ดตะเกียงชอล์กไม่ออก ต้องทาปูนขาวทับ ปูนแห้งแล้วยังเห็นเงาเส้นอยู่ข้างใต้
      effects: { hunted: { lamp_church: 1 }, alignment: { law: -1 }, flags: [ignored_the_red_ink_summons] }

- id: adult.era_horns_bonnets_abroad
  stage: adult
  weight: 24
  when:
    age: [16, 130]
    year: [355, 360]
    location_tag: [hordun, ileth, ashland]
  text: |
    ครอบครัวที่มากับเกวียนเกลือในปีเขาไม่ได้ไปไหนต่อแล้ว ผู้ชายรับจ้างขนของ ผู้หญิงรับซักผ้า เด็กถอดหมวกผ้าตั้งแต่หน้าหนาวแรก ตอเขาโตขึ้นทีละนิด คนในถิ่นไม่มีใครหันมาดูเป็นครั้งที่สอง เด็กพวกนั้นพูดสำเนียงถิ่นนี้ได้ก่อนพ่อแม่

    แต่ถิ่นนี้มีธรรมเนียมเก่าสำหรับคนที่มาแล้วไม่ไป ต้องมีคนในถิ่นออกชื่อรับ คนออกชื่อรับหนี้ที่คนใหม่ก่อ รับเรื่องที่คนใหม่มีกับใคร และถ้าคนใหม่หนีไป ต้องทำงานที่ค้างไว้ให้เสร็จเอง คนในถิ่นเรียกสั้นๆ ว่าใครเป็นคนพาเข้า

    ถึงสิ้นฤดูนี้ยังมีสามครอบครัวที่ไม่มีใครออกชื่อให้ ช่างขนของกับลูกชายที่ชอบชกต่อย หญิงซักผ้าที่พูดน้อย และแม่ลูกคู่หนึ่งที่มาทีหลังคนอื่น เดินเท้ามาเอง ไม่ได้มากับเกวียน เช้านี้คนแก่ของถิ่นมาถามถึงบ้าน{name}
  choices:
    - id: vouch
      label: ออกชื่อรับครอบครัวช่างขนของ
      habit: soft_heart
      text: |
        ช่างขนของแบกของให้บ้าน{name}ฟรีทั้งปี ไม่ต้องขอ ปลายปีลูกชายเขาชกกับลูกบ้านข้างๆ จนตอเขาบิ่นไปข้างหนึ่ง ส่วนอีกฝ่ายฟันหน้าโยก

        บ้านข้างๆ มาทวงค่ายาที่บ้าน{name} ไม่ได้ไปทวงที่บ้านช่างขนของ ตามธรรมเนียม {name}จ่าย แล้วเรียกเด็กทั้งสองคนมานั่งกินข้าวที่โต๊ะเดียวกัน
      effects: { gold: -1, stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [vouched_for_a_horn_year_family] }
    - id: give_work_not_name
      label: จ้างหญิงซักผ้าทำงาน แต่ไม่ออกชื่อให้
      text: |
        {name}จ้างนางซักผ้าทุกสัปดาห์ จ่ายตรงวัน นางซักสะอาด รีดเรียบ พับมุมผ้าตรงกันทุกผืน ปลายปีคนแก่ประกาศชื่อคนพาเข้า ครอบครัวนั้นไม่มีชื่อใครอยู่ข้างหลัง ต้องย้ายออกไปอยู่ชายถิ่น

        นางยังเดินมาซักผ้าให้บ้าน{name}ทุกสัปดาห์ ไกลกว่าเดิมครึ่งเช้า มาถึงตรงเวลาเดิม
      effects: { gold: -1, alignment: { law: 1 }, flags: [hired_a_horn_year_family_unvouched] }
    - id: the_one_you_sheltered
      label: ออกชื่อรับแม่ลูกที่เดินมาเอง
      requires: { flag: sheltered_horn_year_families }
      text: |
        {name}จำนางได้ก่อนนางจะเงยหน้า ผู้หญิงที่เคยนอนข้างเตาบ้าน{name}สิบเอ็ดคืนในปีเขา ที่ที่เกวียนคันนั้นพานางไปไม่ยอมรับ นางเดินย้อนทางเดิมกลับมาทั้งหน้าหนาว ลูกเดินเองได้แล้ว คำแรกที่นางถามคือหมวกใบนั้น

        {name}ออกชื่อรับต่อหน้าคนแก่ของถิ่น ลายมือมั่นกว่าที่คิด ผู้หญิงคนนั้นกลับไปนอนข้างเตาบ้าน{name}อีกสามคืนจนหาห้องได้ คราวนี้ตื่นทีหลังไก่
      effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [vouched_for_the_woman_from_the_stove] }
    - id: old_way
      label: เสนอวิธีที่เก่ากว่านั้น ให้ทั้งถิ่นออกชื่อรับพร้อมกัน
      text: |
        {name}เล่าวิธีที่เคยได้ยินคนแก่รุ่นก่อนพูดถึง คนใหม่ทำงานให้ทุกบ้านในถิ่นบ้านละวัน วนไปจนครบปี บ้านไหนไม่ติงานถือว่าออกชื่อรับไปแล้ว คนแก่ของถิ่นฟังจบแล้วหัวเราะ บอกว่านึกว่าไม่มีใครจำได้แล้ว แล้วก็ประกาศใช้

        บ้าน{name}เป็นบ้านแรกในรายชื่อเพราะเป็นคนเสนอ ได้คนใหม่มาทำงานให้ก่อนทุกบ้าน ช่างขนของมาซ่อมรั้วที่พังมาหลายหน้าฝนจนเสร็จในวันเดียว
      effects: { world: { land: 1 }, stats: { WIS: 1 }, flags: [proposed_the_old_way_to_vouch], city: { merit: 1, here: true } }

# ---------- วัยทำงาน ----------
- id: adult.era_horns_third_man
  stage: adult
  weight: 24
  when:
    age: [16, 59]
    year: [355, 356]
    location_tag: [arvel_village, ventras, kardin]
  text: |
    รถมีประทุนจอดทิ้งอยู่หน้าศาลาตั้งแต่เช้า ไม่มีใครเข็น ประทุนผ้าใบสีขาวหม่น ผ้าด้านท้ายเปิดอยู่ ใครเดินผ่านก็เห็นข้างใน ผ้าห่มหนาปูสามชั้น หมอนใบเล็กสามใบวางเรียงกัน ปลอกหมอนซักสะอาด รีดเรียบ

    คนเข็นรถของคนเสื้อคลุมขาวหนีไปเมื่อคืน ทิ้งรองเท้าไว้หนึ่งคู่หน้าประตูโรงนอน คนถือสมุดยืนอยู่ข้างรถ ประกาศด้วยเสียงธรรมดาเหมือนประกาศหาคนขนอิฐ ค่าแรงวันละสองเหรียญ ทำถึงตะวันตกดิน งานคือเข็นรถตามหลังทีละซอย ไม่ต้องจับใคร ไม่ต้องแตะใคร

    เขาชี้มาที่{name} ถามว่าแขนแข็งแรงดีไหม
  choices:
    - id: push_the_cart
      label: รับงาน เข็นรถ
      text: |
        รถเบากว่าที่คิด ล้อหน้าข้างซ้ายร้องเอี๊ยดทุกรอบที่หมุน {name}เข็นตามหลังคนเสื้อขาวสองคนทีละซอย ยืนรอนอกประตู ไม่ได้เข้าบ้านไหน บางซอยตอนเข็นออกรถเบาเท่าตอนเข็นเข้า บางซอยไม่

        ตกเย็นคนถือสมุดจ่ายสองเหรียญ {name}ล้างมือที่บ่อสองรอบ คนที่ตักน้ำอยู่ก่อนขยับถอยห่างจนพ้นเงา
      effects: { gold: 2, world: { gods: 1 }, alignment: { moral: -1 }, flags: [pushed_the_white_cloaks_cart] }
    - id: refuse
      label: ส่ายหน้า เดินกลับบ้าน
      text: |
        คนถือสมุดไม่ว่าอะไร หันไปถามคนถัดไป ก่อนเที่ยงก็ได้คนเข็น ชายหน้าใหม่ที่เพิ่งมาจากต่างถิ่นหางานทำ ไม่รู้จักใครในซอยสักบ้าน

        บ่ายนั้นทั้งซอยได้ยินเสียงล้อเอี๊ยดมาก่อนตัวรถสามบ้าน ประตูหลังทุกบานเปิดทันพอดี
      effects: { flags: [refused_the_cart_job] }
    - id: loose_the_wedge
      label: รับงาน แล้วแอบคลายลิ่มล้อไว้ ให้หลุดตรงหัวมุมที่ใช่
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}คลายลิ่มล้อข้างที่ร้องไว้ครึ่งตัวตอนพักเที่ยง ตรงหัวมุมซอยช่างย้อม ล้อหลุดกลิ้งลงคูน้ำ รถทรุดตะแคง คนเสื้อขาวสองคนช่วยกันงมล้ออยู่จนตะวันบ่าย พอไปถึงซอยช่างย้อม บ้านเจ็ดหลังว่างเปล่า ประตูหลังเปิดค้าง ไฟในเตายังอุ่น

          คนถือสมุดจ่ายค่าแรงเต็มวัน แล้วบอกว่าพรุ่งนี้ไม่ต้องมา ลิ่มหลุดไม่ใช่ความผิดของคนเข็น เขาแค่ไม่อยากเห็นหน้าคนดวงซวย
        effects: { stats: { DEX: 1 }, gold: 1, alignment: { moral: 1 }, flags: [loosed_the_cart_wedge] }
      failure:
        text: |
          ลิ่มหลุดเร็วไปหนึ่งซอย ล้อหลุดหน้าวิหารตะเกียง ต่อหน้าคนเสื้อขาวสามคน คนถือเหล็กก้มลงหยิบลิ่มขึ้นมาพลิกดู รอยมีดที่หัวลิ่มยังใหม่

          เขายื่นลิ่มคืนใส่มือ{name} ไม่ว่าสักคำ คนถือสมุดเปิดสมุดไปหน้าหลังสุด ค่าแรงวันนั้นไม่มีใครจ่าย
        effects: { hunted: { lamp_church: 1 }, flags: [loosed_the_cart_wedge] }

# ---------- วัยชรา ----------
- id: elder.era_horns_two_pulpits
  stage: elder
  weight: 24
  scene: temple
  when:
    age: [60, 130]
    year: [355, 358]
    location_tag: [arvel_village, ventras, kardin]
  text: |
    เช้าวันอีเซล นักบวชหญิงของอีเซลตั้งแท่นเทศน์บนบันไดวิหารของนาง อีกฟากลานตลาด ห่างไปสี่สิบก้าว นักบวชตะเกียงตั้งแท่นของเขาบนบันไดวิหารตะเกียง เทศน์เวลาเดียวกัน คนละเรื่อง ม้านั่งของแต่ละวิหารลากออกมาตั้งเรียงหน้าบันได คนหนุ่มสาวยืนฟังกลางลาน ขยับไปขยับมาได้ ไม่มีใครว่า คนแก่ต้องนั่ง ม้านั่งมีสองฝั่ง และทั้งถิ่นเห็นว่าใครนั่งฝั่งไหน

    นักบวชตะเกียงเทศน์เรื่องตะเกียงที่ต้องส่องให้ถึงทุกซอก นักบวชหญิงเทศน์เรื่องขนมปังที่ไม่ถามชื่อคนกิน ทั้งสองพูดดังขึ้นทุกประโยค จนประโยคชนกันกลางลาน

    {name}ยืนอยู่กลางลาน เข่าเริ่มปวด ม้านั่งฝั่งตะเกียงว่างที่หนึ่ง ข้างหญิงขายผ้าที่{name}ซื้อผ้ามาทั้งชีวิต ม้านั่งฝั่งอีเซลว่างที่หนึ่ง ข้างหมอตำแย
  choices:
    - id: sit_lamp_bench
      label: นั่งฝั่งตะเกียง ข้างหญิงขายผ้า
      text: |
        หญิงขายผ้าขยับให้ นักบวชตะเกียงเห็น ทักชื่อ{name}กลางเทศน์ เสียงดังพอให้ข้ามไปถึงฝั่งโน้น หลังจบ เขาเดินจับมือคนแก่บนม้านั่งฝั่งเขาทุกคน แจกตะเกียงน้ำมันดวงเล็กคนละดวง

        สัปดาห์นั้นหมอตำแยเดินสวน{name}ที่ตลาดสองครั้ง ทักเรื่องลมเรื่องฝนทั้งสองครั้ง
      effects: { world: { gods: 1 }, reputation: { lamp_church: 1 }, flags: [sat_the_lamp_bench] }
    - id: sit_isel_bench
      label: นั่งฝั่งอีเซล ข้างหมอตำแย
      text: |
        หมอตำแยขยับให้ นักบวชหญิงเทศน์จบแล้วแจกขนมปังตามม้านั่ง ก้อนแรกให้{name} คนเสื้อคลุมขาวคนหนึ่งยืนอยู่ข้างแท่นฝั่งตะเกียง จดอะไรลงสมุดตอน{name}ยื่นมือรับ

        เดือนนั้นหญิงขายผ้ายังขายผ้าให้{name}ราคาเดิม แต่ตัดสั้นไปหนึ่งคืบ
      effects: { world: { gods: 1 }, reputation: { lamp_church: -1 }, flags: [sat_the_isel_bench] }
    - id: stand_in_the_middle
      label: ยืนอยู่กลางลานจนทั้งสองฝั่งเทศน์จบ
      habit: stubborn
      check: { stat: CON, dc: 12 }
      success:
        text: |
          {name}ยืนจนเข่าสั่น ยืนจนทั้งสองเทศน์จบ คนหนุ่มสาวที่ยืนกลางลานค่อยๆ ขยับมายืนใกล้{name} ทีละคนสองคน พอจบมีคนยืนล้อมอยู่ครึ่งวง

          นักบวชทั้งสองเดินลงบันไดมาพร้อมกัน ต่างคนต่างจะมาเชิญ{name}ไปนั่งฝั่งตัวเองวันอีเซลหน้า แล้วหยุดห่างกันสามก้าว
        effects: { stats: { CON: 1 }, flags: [stood_between_the_two_pulpits] }
      failure:
        text: |
          ยืนได้ครึ่งเทศน์ เข่าข้างหนึ่งก็ทรุด คนหนุ่มสาวพยุง{name}ไว้ นักบวชทั้งสองรีบลงจากแท่นมาถึงพร้อมกัน แล้วเถียงกันว่าใครจะพา{name}กลับบ้าน

          เถียงจนเกวียนของหญิงขายผ้ามาจอด หญิงขายผ้าพา{name}กลับไปเอง
        effects: { hp: -1, flags: [stood_between_the_two_pulpits] }
    - id: sit_lamp_bench_branded
      label: นั่งฝั่งตะเกียง แล้วรอดูว่านักบวชจะจับมือหรือไม่
      requires: { trait: curse_brand }
      text: |
        หญิงขายผ้าขยับให้ช้ากว่าที่ควรครึ่งจังหวะ หลังเทศน์ นักบวชตะเกียงเดินจับมือคนแก่บนม้านั่งทีละคน ถึง{name} เขาจับมือ{name}นานเท่าคนอื่นพอดี ไม่ขาด ไม่เกิน คนทั้งม้านั่งเห็น

        ตะเกียงดวงเล็กที่แจก{name}ได้เหมือนทุกคน ขากลับ{name}ยกขึ้นเขย่า น้ำมันอยู่แค่ครึ่ง ของคนอื่นเต็มถึงคอ
      effects: { world: { gods: 1 }, stats: { CHA: 1 }, flags: [sat_the_lamp_bench_branded] }

- id: elder.era_horns_horn_year_games
  stage: elder
  weight: 24
  when:
    age: [60, 130]
    year: [360, 362]
    location_tag: [arvel_village, ventras, kardin]
  text: |
    ไม่มีใครตรวจเด็กเกิดใหม่มาหลายปีแล้ว ลูกปีเขาวิ่งเล่นกันในซอยโดยไม่มีหมวก บางคนมีตอเขา บางคนไม่มี เล่นเป็นฝูงเดียวกัน เกมที่เล่นบ่อยที่สุดในซอยชื่อเสื้อขาวจับเขา

    กติกาละเอียดกว่ากฎหมายบางข้อ จับสลากด้วยกรวด กรวดขาวเป็นเสื้อขาว มีสองคน กรวดดำเป็นเขา คนที่จับได้กรวดแตกเป็นช่องขนมปัง ยืนที่หน้าต่างบ้านช่างไม้ เขาที่ไปแตะหน้าต่างได้ถือว่ารอด เขาที่ขึ้นเกวียนเกลือ คือรถเข็นผักของบ้านท้ายซอย ต้องนั่งนิ่งห้ามหัวเราะ เสื้อขาวที่จับเขาได้ต้องเอาช้อนเหล็กแตะหน้าผาก ถ้าเขาหัวเราะถือว่าไม่นิ่ง ต้องไปนั่งหลังบ้านช่างไม้จนจบตา

    บ่ายนี้เกมหยุดกลางคัน เพราะเถียงกันเรื่องเดียว เขาที่ขึ้นเกวียนเกลือแล้ว ลงกลางทางได้ไหม เด็กทั้งสองฝ่ายเดินมาหยุดหน้าบ้าน{name} ขอให้ตัดสิน เพราะ{name}เป็นคนแก่คนเดียวในซอยที่นั่งหน้าบ้านทุกบ่าย
  choices:
    - id: rule_strict
      label: ตัดสินว่าขึ้นเกวียนแล้วต้องไปจนสุดทาง
      text: |
        ฝั่งเขาโห่ ฝั่งเสื้อขาวเฮ เด็กที่นั่งบนรถเข็นผักนั่งต่อจนครบตา แล้วประกาศว่าถึงบ้านหญ้าขมแล้ว

        บ่ายนั้นเด็กคนนั้นไม่กลับเข้าเกมอีก นั่งอยู่บนรถเข็นผัก เล่นเป็นคนบ้านหญ้าขมอยู่คนเดียว ทักทุกคนที่เดินผ่านด้วยสำเนียงที่คิดขึ้นเอง
      effects: { stats: { WIS: 1 }, alignment: { law: 1 }, flags: [ruled_the_salt_cart_one_way] }
    - id: rule_lenient
      label: ตัดสินว่าลงกลางทางได้ ถ้ามีบ้านไหนเปิดประตูรับ
      text: |
        ฝั่งเสื้อขาวโวยว่าแบบนี้จับใครไม่ได้ เถียงกันจนได้กติกาใหม่ ลงกลางทางได้ ถ้ามีบ้านในซอยเปิดประตูรับ บ่ายนั้นเด็กไปเคาะประตูทุกบ้านในซอย บางบ้านเปิด บางบ้านไม่

        ประตูบ้าน{name}เปิดค้างไว้ทั้งบ่าย เด็กวิ่งเข้าออกจนพื้นครัวมีรอยเท้าโคลนทับกันเป็นชั้น
      effects: { alignment: { moral: 1 }, flags: [ruled_the_salt_cart_may_stop] }
    - id: play_the_bread_hatch
      label: ไม่ตัดสิน ขอเข้าเล่นเป็นช่องขนมปังเสียเอง
      text: |
        {name}นั่งที่หน้าต่างบ้านตัวเอง เด็กที่มาถึงต้องแตะมือ{name} {name}ยื่นขนมปังให้จริงทีละชิ้น เกมยืดไปจนพลบค่ำ ฝั่งเสื้อขาวจับใครไม่ได้เลย เพราะผู้เล่นฝั่งเขาทุกคนวิ่งมาหน้าต่างบ้าน{name} ขนมปังหมดตะกร้า

        วันต่อมาเด็กสองคนที่จับได้กรวดขาวเมื่อวานมาขอจับสลากใหม่ ขอเป็นเขาบ้าง
      effects: { stats: { CHA: 1 }, flags: [played_the_bread_hatch_in_the_game] }
