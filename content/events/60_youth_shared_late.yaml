# วัยหนุ่มสาว 15–17 เรื่องที่ทุกทางเจอได้ น้ำหนัก 10 (เรื่องตามทางน้ำหนัก 30)
# ห้ามใช้ {father} {mother} เพราะเด็กวิหารเจอได้ทุกเรื่อง
# เขียนไม่ระบุถิ่น ถ้าเรื่องไหนไม่เข้ากับบ้านบนกิ่งไม้ของเอลฟ์ ให้ตัด origin_elf_bough ออก
# ข่าวลือเรื่องดาวหรี่เหนือตอเสาเป็นแค่ข่าวลือ ไม่ยืนยันว่าเกิดจริง

- id: youth.first_love
  stage: youth
  weight: 10
  when:
    age: [15, 17]
  text: |
    คนคนนั้นมาถึงถิ่นนี้ตอนต้นฤดู มาพร้อมคนเดินทางกลุ่มหนึ่ง แล้วไม่ได้ไปต่อกับกลุ่ม ทำงานทุกอย่างที่มีคนจ้าง หัวเราะเสียงดังกว่าทุกคนในวงข้าว และจำชื่อคนทั้งถิ่นได้ภายในสิบวัน

    {name}รู้ตัวเป็นครั้งแรกตอนเห็นตัวเองเลือกทางกลับบ้านทางที่อ้อมไกลกว่าเดิม เพราะทางนั้นผ่านที่ที่คนคนนั้นนั่งพักตอนเย็น รู้ตัวครั้งที่สองตอนได้ยินคนอื่นเอ่ยชื่อคนคนนั้นในวงเหล้า แล้วหูร้อนขึ้นมาเอง

    ปลายฤดู คนเดินทางกลุ่มเดิมผ่านกลับมาอีกรอบ ได้ยินว่าคนคนนั้นจะไปกับกลุ่มตอนสาง
  choices:
    - id: say_it
      label: ไปหาคืนนั้น แล้วพูดออกไปตรงๆ
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          {name}ซ้อมคำพูดมาตลอดทาง พอถึงหน้ากันจริงก็ลืมหมด พูดออกไปได้แค่ครึ่งประโยค คนคนนั้นหัวเราะ ไม่ใช่หัวเราะเยาะ แล้วต่อประโยคที่เหลือให้เอง

          คืนนั้นสองคนนั่งคุยกันจนดาวเก่าตกไปครึ่งฟ้า ตอนสาง คนคนนั้นไม่ได้ไปกับกลุ่ม บอกว่าฤดูหน้าค่อยไปก็ได้ ทางไม่หนีไปไหน
        effects: { stats: { CHA: 1 }, flags: [first_love, first_love_stayed] }
      failure:
        text: |
          {name}พูดออกไปครบทุกคำ คนคนนั้นฟังจนจบ แล้วจับมือ{name}ไว้นานพอให้รู้ว่าได้ยินทุกคำ ก่อนจะบอกเบาๆ ว่าตอนสางยังต้องไป

          {name}ไม่ได้ไปส่ง ตอนสางนอนฟังเสียงล้อเกวียนกับเสียงเท้าคนเดินออกจากถิ่นไปทีละคน จนเงียบ
        effects: { stats: { CON: 1 }, flags: [first_love, first_love_left] }
    - id: fetch_the_kite
      label: ไม่พูด แต่ปีนไปเอาว่าวที่คนคนนั้นทำติดปลายเสาสูงลงมาให้
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ว่าวตัวนั้นติดปลายเสาสูงกลางถิ่นมาตั้งแต่กลางฤดู ทุกคนเลิกพยายามไปนานแล้ว {name}ปีนขึ้นไปตอนพลบค่ำ ปลายเสาเล็กเท่าข้อมือ เอนไปตามลมทุกครั้งที่ขยับ {name}ปลดสายว่าวออกได้ด้วยมือข้างเดียว ลงมาถึงพื้นแขนถลอกทั้งสองข้าง

          คนคนนั้นรับว่าวไปถือไว้นาน ไม่พูดอะไร แล้วเอาว่าวมาคืนใส่มือ{name} บอกว่าเก็บไว้ จะได้มีเหตุให้กลับมาเอา ตอนสางคนคนนั้นไปกับกลุ่ม ว่าวตัวนั้นแขวนอยู่ที่ผนังข้างที่นอนของ{name}
        effects: { stats: { DEX: 1 }, flags: [first_love, first_love_left] }
      failure:
        text: |
          มือที่เกาะเสาลื่นตอน{name}เอื้อมไปถึงสายว่าว {name}รูดลงมาสองช่วงตัว ไปค้างอยู่กับคานขวางเสา ว่าวตกลงมาก่อน ขาดเป็นสองซีก

          คนคนนั้นวิ่งมาดูทั้งที่ยังถือชามข้าวอยู่ในมือ ช่วยพยุง{name}ลงมา แล้วนั่งต่อกระดาษว่าวด้วยข้าวเหนียวข้างกองไฟอยู่ครึ่งคืน ต่อเสร็จก็หัวเราะ บอกว่าว่าวตัวนี้คงบินไม่ขึ้นแล้ว แต่ก็ไม่ทิ้ง ตอนสางยังถือว่าวตัวนั้นไปด้วย
        effects: { hp: -1, stats: { DEX: 1 }, flags: [first_love, first_love_left] }
    - id: walk_them_home
      label: ไม่พูดอะไร แค่เดินไปส่งที่พักทุกคืนจนวันสุดท้าย
      text: |
        {name}เดินไปส่งทุกคืน ทางเดิม ระยะเดิม พูดเรื่องฝน เรื่องงาน เรื่องหมาของบ้านท้ายถิ่น คืนสุดท้าย คนคนนั้นหยุดเดินก่อนถึงที่พักสิบก้าว ยืนรออยู่พักหนึ่งเหมือนรอให้{name}พูดอะไร แล้วก็เดินต่อ

        ตอนสาง{name}ไปยืนส่งที่ปากทาง คนคนนั้นโบกมือครั้งเดียว ไม่หันกลับมาอีก
      effects: { stats: { CON: 1, STR: 1 }, flags: [first_love, first_love_left] }

- id: youth.veteran_story
  stage: youth
  weight: 10
  when:
    age: [15, 17]
    year: [302, 317]
    not_flags: [origin_elf_bough]
  text: |
    ชายคนนั้นนั่งที่เดิมทุกเย็น ข้างกองไฟหลังร้านเหล้า แขนซ้ายเป็นเหล็กตั้งแต่ไหล่ลงมา นิ้วเหล็กขยับได้สามนิ้ว อีกสองนิ้วงอค้างอยู่ตลอดเหมือนกำของที่ไม่มีอยู่ เขารบในสงครามถ่านห้าปีเต็ม ไม่เคยบอกใครว่ารบให้ฝั่งไหน และคนในถิ่นก็เลิกถามไปนานแล้ว

    คืนนี้เขาเมากว่าทุกคืน เคาะแขนเหล็กกับขอบโต๊ะเป็นจังหวะ แล้วบอกเสียงดังว่าใครพาเขากลับถึงบ้านได้ เขาจะเล่าเรื่องที่ไม่เคยเล่าให้ใครฟังให้ฟังเรื่องหนึ่ง คนในร้านหัวเราะ ไม่มีใครลุก
  choices:
    - id: carry_him
      label: ลุกไปพาดแขนเขาไว้บนบ่า แล้วพยุงกลับบ้าน
      check: { stat: STR, dc: 13 }
      success:
        text: |
          แขนเหล็กหนักเท่าคนอีกครึ่งตัว {name}พยุงเขาไปตลอดทางมืด หยุดพักสามครั้ง บ้านเขาเป็นห้องเดียวท้ายถิ่น มีเตียงหนึ่ง เก้าอี้หนึ่ง กับหมวกทหารใบเดียวที่แขวนอยู่บนตะปู ไม่มีตราของฝั่งไหนติดอยู่ เขาแกะตราออกไปนานแล้ว เหลือแต่รอยหมุด

          เขาเล่าว่าคืนหนึ่งในปีที่สาม หลุมถ่านมารที่ทั้งสองฝ่ายแย่งกันอยู่พังลงมา ฝังคนทั้งสองฝั่งไว้ข้างใต้ ทั้งคืนนั้นไม่มีใครยิงใคร ทหารทั้งสองฝั่งขุดดินด้วยมือข้างกัน ดึงคนออกมาได้สิบเอ็ดคน ไม่มีใครดูว่าใครเป็นคนของฝั่งไหน พอฟ้าสาง ต่างคนต่างเดินกลับไปที่แนวของตัวเอง แล้วเริ่มยิงกันใหม่

          เล่าจบเขาก็หลับไปทั้งที่ยังนั่ง {name}ถอดรองเท้าให้ แล้วปิดประตูให้ตอนออกมา
        effects: { stats: { STR: 1 }, flags: [heard_veteran_story] }
      failure:
        text: |
          ครึ่งทาง ขา{name}พับลงเอง ทั้งคู่ล้มลงไปกองอยู่กลางทางโคลน แขนเหล็กของเขาทับขา{name}ไว้ เขาหัวเราะจนไอ แล้วนอนหงายมองดาวอยู่ตรงนั้น ไม่ยอมลุก

          {name}นั่งเฝ้าเขาอยู่ข้างทางจนเช้า ตอนฟ้าสางเขาตื่นมา มองหน้า{name} บอกว่าเรื่องที่สัญญาไว้ไม่ได้เล่าเพราะเจ้าพาไปไม่ถึง แต่เจ้านั่งเฝ้าคนเมาทั้งคืนโดยไม่ทิ้ง นายร้อยของข้าก็เคยทำแบบนี้ แล้วลุกเดินกลับบ้านไปเอง
        effects: { stats: { CON: 1 }, flags: [sat_with_veteran] }
    - id: take_his_knife
      label: ท้าเขาว่าจะชิงมีดที่เอวเขามาให้ได้ ถ้าได้ให้สอนวิชามีด
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          เขาหัวเราะ แล้วลุกขึ้นยืนเหมือนคนไม่ได้เมาสักนิด {name}พุ่งไปทางขวา เขาหันตาม {name}เปลี่ยนทางกลางก้าว ปลายนิ้วเกี่ยวด้ามมีดออกมาได้ก่อนแขนเหล็กจะหุบลงมา

          เขามองมือที่ว่างของตัวเองอยู่นาน แล้วนั่งลง สอนให้ตรงนั้นเลย ถือมีดยังไงไม่ให้หลุดเวลาแทงโดนกระดูก ถอยยังไงไม่ให้หลังชนกำแพง เขาสอนอยู่ทุกเย็นจนหมดฤดู ไม่เคยพูดว่าใครสอนเขามา
        effects: { stats: { DEX: 1 }, flags: [veteran_knife_trick] }
      failure:
        text: |
          มือ{name}ไปถึงด้ามมีด แล้วแขนเหล็กก็หุบลงมาหนีบข้อมือไว้แน่นเหมือนคีมช่างตีเหล็ก เขาดึงมีดออกจากฝักเองช้าๆ แตะสันมีดกับแก้ม{name}เบาๆ ทีหนึ่ง แล้วปล่อย

          เขาบอกว่าเจ้าเร็วดี แต่คนที่ตายในสงครามส่วนใหญ่ก็เร็วดี แล้วให้{name}ซื้อเหล้าให้เขาหนึ่งแก้วเป็นค่าเรียน ข้อมือ{name}เขียวช้ำเป็นรอยนิ้วเหล็กไปอีกหลายวัน
        effects: { hp: -1, stats: { DEX: 1 }, flags: [veteran_knife_trick] }
    - id: sit_and_listen
      label: ไปนั่งข้างกองไฟ ไม่ต้องให้เล่าเรื่องนั้น ฟังเรื่องอะไรก็ได้
      text: |
        เขาไม่ได้เล่าเรื่องที่ไม่เคยเล่า เล่าเรื่องแขนแทน ว่าแขนเหล็กไม่รู้สึกอะไรเลย ร้อนก็ไม่รู้ หนาวก็ไม่รู้ แต่คืนไหนหนาวจัด แขนข้างที่ไม่มีแล้วจะปวดขึ้นมาตั้งแต่ข้อศอกถึงปลายนิ้ว ปวดจนนอนไม่หลับ

        เขาให้{name}ลองจับนิ้วเหล็ก นิ้วเหล็กเย็นกว่าอากาศ แล้วถามว่า{name}เคยคิดจะไปเป็นทหารไหม ไม่รอให้ตอบ บอกว่าดีแล้ว แล้วเคาะแขนกับขอบโต๊ะต่อ
      effects: { stats: { WIS: 1 }, flags: [heard_veteran_arm] }

- id: youth.friend_leaves
  stage: youth
  weight: 10
  when:
    age: [15, 17]
  text: |
    เพื่อนที่สนิทที่สุดของ{name}ที่นี่จะไปจากถิ่นนี้ตอนสาง มีคนจ้างไปทำงานไกล ไกลจนต้องเดินทางสิบสองวัน ค่าแรงสามเท่าของที่นี่ จ้างสามปี

    ทั้งเย็น เพื่อนเอาของที่ไม่เอาไปด้วยมาแจกคนนั้นคนนี้ รองเท้าคู่เก่า หม้อหูหัก หินก้อนกลมที่เก็บไว้ตั้งแต่เจ็ดขวบ ตกค่ำเหลือของในห่อผ้าแค่ห่อเดียว แล้วเพื่อนก็มานั่งลงข้าง{name}เหมือนทุกคืน ไม่พูดเรื่องพรุ่งนี้
  choices:
    - id: one_last_race
      label: ท้าวิ่งแข่งไปถึงหินหลักปากทางเหมือนทุกครั้ง
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          สองคนออกวิ่งพร้อมกันในความมืด ล้มคนละครั้ง ลุกขึ้นวิ่งต่อ {name}แตะหินหลักก่อนครึ่งช่วงแขน แล้วล้มลงนั่งหอบพิงหิน เพื่อนล้มลงข้างๆ หัวเราะจนหายใจไม่ทัน

          เพื่อนบอกว่าตั้งแต่รู้จักกันมา{name}ไม่เคยชนะเลยสักครั้ง ชนะครั้งแรกคืนนี้ แล้วเอามีดเล็กขีดเส้นหนึ่งลงบนหินหลัก บอกว่ากลับมาเมื่อไหร่จะมาแก้มือ
        effects: { stats: { DEX: 1 }, flags: [friend_left, friend_owes_a_race] }
      failure:
        text: |
          เพื่อนแตะหินหลักก่อนเหมือนทุกครั้ง แล้วยืนรอ{name}อยู่ข้างหินเหมือนทุกครั้ง หัวเราะเหมือนทุกครั้ง

          สองคนนั่งพิงหินหลักจนดึก เพื่อนบอกว่าดีแล้วที่แพ้ ถ้า{name}ชนะคืนนี้ ไปถึงที่โน่นคงคิดถึงแต่เรื่องนี้ทั้งสามปี
        effects: { stats: { DEX: 1 }, flags: [friend_left] }
    - id: walk_a_day
      label: ตอนสางเดินไปส่งด้วย ไปให้ไกลที่สุดเท่าที่ขาไหว
      check: { stat: CON, dc: 12 }
      success:
        text: |
          {name}เดินไปด้วยทั้งวัน ข้ามเนินที่ไม่เคยข้าม ผ่านถิ่นที่ไม่เคยรู้ชื่อ พอตะวันตกถึงทางแยกที่เพื่อนต้องเลี้ยว สองคนแบ่งขนมปังก้อนสุดท้ายกันคนละครึ่ง แล้วเพื่อนก็เลี้ยวไป

          {name}เดินกลับคนเดียวทั้งคืน ถึงบ้านตอนฟ้าสาง เท้าพองทั้งสองข้าง แต่จำทางได้ทุกโค้ง เผื่อวันหนึ่งต้องเดินไปทางนั้นเอง
        effects: { stats: { CON: 1 }, flags: [friend_left, walked_friend_off] }
      failure:
        text: |
          ตอนบ่ายขา{name}เริ่มไม่ฟัง เดินช้าลงจนเพื่อนต้องหยุดรอทุกเนิน ถึงเนินที่สี่ เพื่อนหยุดแล้วบอกว่าพอแล้ว ถ้าเดินต่อ{name}จะกลับบ้านไม่ถึง

          สองคนกอดกันบนเนินนั้น แล้วต่างคนต่างเดินไปคนละทาง {name}หันกลับไปมองสองครั้ง ครั้งแรกเพื่อนยังหันมาโบก ครั้งที่สองไม่เห็นแล้ว
        effects: { stats: { CON: 1 }, flags: [friend_left] }
    - id: give_the_best
      label: ให้ของที่ดีที่สุดที่ตัวเองมีติดตัวไปด้วย
      text: |
        ของที่ดีที่สุดที่{name}มีราคาไม่ถึงสองเหรียญ เพื่อนรู้ว่าราคาเท่าไหร่ และรู้ว่า{name}เก็บไว้มานานแค่ไหน เพื่อนรับไปห่อผ้าไว้ในห่อเดียวกับเสื้อผ้า แล้วล้วงหินก้อนกลมที่เก็บไว้ตั้งแต่เจ็ดขวบออกมาจากกระเป๋าเสื้อ เป็นก้อนเดียวที่ไม่ได้แจกใคร

        ตอนสาง{name}ยืนส่งที่ปากทาง หินก้อนนั้นอุ่นอยู่ในมือจนเพื่อนเดินลับเนินไป
      effects: { stats: { CHA: 1 }, flags: [friend_left, friend_stone] }

- id: youth.demon_rumor
  stage: youth
  weight: 10
  when:
    age: [15, 17]
  text: |
    ข่าวลือมาถึงพร้อมคนเดินทางสองสามคน แล้วก็อยู่ต่อหลังคนเดินทางไปแล้ว ว่าคืนหนึ่งเมื่อเดือนก่อน คนเฝ้าป้อมที่อยู่ใกล้ตอเสาในแดนเถ้าที่สุดเห็นดาวดวงใหม่เหนือตอเสาหรี่ลงพร้อมกันทั้งแถบ นานครึ่งอึดใจ แล้วสว่างขึ้นเหมือนเดิม ดาวเก่าไม่เป็นอะไรสักดวง

    คนที่เล่าต่อแต่ละคนเล่าไม่เหมือนกัน บางคนว่าหรี่ลงครึ่งอึดใจ บางคนว่าดับไปทั้งคืน แต่ทุกคนเล่าตอนจบเหมือนกัน ว่าจอมมารพลิกตัวในหลับ

    คืนนี้คนทั้งถิ่นออกมานั่งนอกบ้าน แหงนมองฟ้าทั้งที่ไม่รู้ว่ากำลังหาอะไร เด็กเล็กคนหนึ่งถาม{name}ว่าดาวหรี่เพราะกลัวจอมมารหรือ
  choices:
    - id: climb_to_watch
      label: ปีนขึ้นที่สูงที่สุดในถิ่น เฝ้าดูดาวดวงใหม่ทั้งคืน
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ปีนขึ้นไปนั่งบนจุดที่สูงที่สุดที่ปีนถึง ลมแรงจนต้องเอาขาเกี่ยวไว้ ดาวดวงใหม่อยู่ที่เดิมทั้งคืน สว่างนิ่ง ไม่กะพริบเหมือนดาวเก่า ไม่มีดวงไหนหรี่

          ก่อนฟ้าสางไม่นาน ลมหยุดพัดไปครู่หนึ่ง ทั้งถิ่นเงียบจนได้ยินเสียงหัวใจตัวเอง ดาวดวงใหม่เหนือตอเสาดูเหมือนจะหรี่ลงนิดหนึ่ง หรือตา{name}ล้าเพราะไม่ได้หลับทั้งคืน {name}ขยี้ตา มองใหม่ ทุกดวงสว่างเท่าเดิม
        effects: { stats: { DEX: 1, WIS: 1 }, flags: [watched_the_stars_dim] }
      failure:
        text: |
          ครึ่งทาง ที่เหยียบหลุดจากเท้า {name}ไถลลงมาเกือบถึงพื้น แขนครูดไปกับขอบที่ไต่จนเลือดซิบ เด็กเล็กคนนั้นวิ่งไปตามผู้ใหญ่

          คืนนั้น{name}นั่งดูดาวอยู่บนพื้นกับคนอื่น แขนพันผ้า ไม่เห็นดาวดวงไหนหรี่ แต่ทั้งคืนก็ไม่มีใครในถิ่นกล้าเข้าบ้านไปนอนก่อน
        effects: { hp: -1, stats: { DEX: 1 }, flags: [heard_demon_rumor] }
    - id: answer_the_child
      label: ตอบเด็กคนนั้น ให้คนที่นั่งอยู่แถวนั้นได้ยินด้วย
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          {name}บอกเด็กว่าดาวอยู่บนฟ้ามาตั้งแต่ก่อนปู่ทวดของทุกคนเกิด ไม่เคยลงมากินใคร ส่วนจอมมารนอนอยู่ใต้เถ้ามาหลายร้อยปี ถ้าจะพลิกตัวสักทีก็ไม่แปลก คนแก่ก็พลิกตัวทั้งคืน

          คนแถวนั้นหัวเราะ เด็กหัวเราะตาม คนแก่คนหนึ่งบอกว่าตัวเองพลิกทั้งคืนจริง แล้วก็ลุกเข้าบ้านไปนอนเป็นคนแรก คนอื่นค่อยๆ ลุกตามไปทีละคน
        effects: { stats: { CHA: 1 }, flags: [calmed_the_rumor] }
      failure:
        text: |
          {name}บอกเด็กว่าดาวไม่กลัวใครหรอก ดาวอยู่ของมันอย่างนั้น เด็กถามต่อว่าแล้วทำไมดาวต้องเพิ่มทุกปี {name}ตอบไม่ได้ คนที่นั่งอยู่แถวนั้นหันมารอฟังคำตอบ แล้วก็หันกลับไปมองฟ้าเงียบๆ

          ทั้งคืนนั้นไม่มีใครในถิ่นกล้าเข้าบ้านไปนอนก่อน
        effects: { stats: { WIS: 1 }, world: { demon: 1 }, flags: [heard_demon_rumor] }
    - id: ask_the_oldest
      label: ไปถามคนที่แก่ที่สุดในถิ่นว่าเคยได้ยินเรื่องแบบนี้ไหม
      text: |
        คนแก่ที่สุดในถิ่นนั่งอยู่หน้าประตูบ้านคนเดียว ไม่ได้แหงนมองฟ้าเหมือนคนอื่น บอกว่าตอนตัวเองอายุเท่า{name} ก็มีข่าวลือแบบนี้มาครั้งหนึ่ง ตอนนั้นว่าดาวหรี่สามคืน ยายของตัวเองบอกว่าตอนยายเป็นเด็กก็มีครั้งหนึ่ง

        ทุกครั้งคนทั้งถิ่นออกมานั่งนอกบ้านแบบนี้ ทุกครั้งไม่มีอะไรเกิดขึ้น แล้วคนก็ลืม คนแก่บอกว่ามีอย่างเดียวที่ไม่เหมือนเดิม คือตอนนั้นดาวบนฟ้าน้อยกว่านี้มาก
      effects: { stats: { INT: 1 }, flags: [heard_demon_rumor] }

- id: youth.airship_down
  stage: youth
  weight: 10
  when:
    age: [15, 17]
    year: [298, 317]
  text: |
    เรือเหาะลำนั้นลงมาช้ามาก ช้าจนคนที่เห็นตั้งแต่แรกนึกว่ากำลังจะลงจอด ถุงลมด้านหนึ่งยุบ ไฟสีฟ้าของน้ำค้างดาวรั่วออกมาเป็นทางยาวตามหลัง จนท้องเรือครูดสันเนิน แล้วก็ลงไปกระแทกพื้นห่างจากที่{name}ยืนไม่ถึงครึ่งชั่วยามเดิน

    {name}ไปถึงเป็นคนแรกๆ เรือขนของลำเล็ก ลูกเรือสี่คน สองคนคลานออกมาได้เอง หนึ่งคนนอนนิ่งอยู่ข้างซากไม่ขยับ อีกคนติดอยู่ใต้โครงเหล็กของห้องบังคับเรือ ตะโกนอยู่ข้างใต้

    ขวดน้ำค้างดาวหลุดจากลังกระจายไปทั่วพื้น บางขวดแตก แสงฟ้าซึมลงดิน บางขวดยังดี ขวดหนึ่งขายได้เท่าค่าแรงคนครึ่งเดือน ไฟเล็กๆ เริ่มลุกที่ถุงลมด้านที่ยุบ
  choices:
    - id: lift_the_frame
      label: มุดเข้าไปยกโครงเหล็กให้คนที่ติดอยู่
      check: { stat: STR, dc: 14 }
      success:
        text: |
          {name}มุดเข้าไปใต้ซาก เอาไหล่ดันคานเหล็กที่ร้อนจนเสื้อไหม้ติดหนัง ดันขึ้นได้แค่ฝ่ามือหนึ่ง แต่พอให้คนข้างใต้ดึงขาออกมาได้ ลูกเรือสองคนที่คลานออกมาก่อนช่วยลากเขาออกไปไกลจากไฟ

          คนที่ติดอยู่เป็นเด็กหนุ่มอายุไม่มากกว่า{name}เท่าไร ขาหักข้างหนึ่ง เขาจับข้อมือ{name}ไว้ ถามชื่อ แล้วท่องชื่อนั้นซ้ำไปซ้ำมาจนคนจากเมืองมาถึง ไหล่ของ{name}เป็นรอยแผลไหม้รูปคานเหล็กไปตลอดชีวิต
        effects: { hp: -1, stats: { STR: 1 }, alignment: { moral: 1 }, flags: [saved_airship_crew] }
      failure:
        text: |
          คานเหล็กไม่ขยับ {name}ดันจนตาลาย เสื้อไหม้ติดไหล่ คนข้างใต้ร้องให้{name}ออกไป ไฟลามมาถึงห้องบังคับเรือแล้ว ลูกเรือคนหนึ่งดึงขา{name}ออกมาจากใต้ซากทั้งที่{name}ยังไม่ยอมปล่อยมือ

          คนข้างใต้เงียบไปก่อนไฟจะดับ คืนนั้นไหล่ของ{name}พองเป็นแผลไหม้ทั้งแผ่น ลูกเรือคนที่ดึงขาออกมานั่งอยู่ข้าง{name}ทั้งคืน ไม่ได้พูดอะไร
        effects: { hp: -2, stats: { STR: 1 }, flags: [airship_crew_died] }
    - id: grab_the_vials
      label: เก็บขวดน้ำค้างดาวที่ยังดีให้ได้มากที่สุดก่อนคนอื่นมาถึง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}เก็บขวดที่กลิ้งอยู่ห่างจากซากที่สุดก่อน ขวดที่ไม่มีใครเห็น ซ่อนไว้ในกอหญ้าสามขวด ใต้ก้อนหินอีกสอง แล้วเดินกลับมาช่วยคนอื่นดับไฟเหมือนคนที่เพิ่งมาถึง

          ทหารจากเมืองมานับลังตอนเที่ยงคืน ขวดขาดไปสิบกว่าขวด ไม่มีใครรู้ว่าขาดไปกับใครบ้าง {name}เอาขวดออกมาขายทีละขวด ห่างกันทีละเดือน ไปขายที่ตลาดคนละที่
        effects: { stats: { DEX: 1 }, gold: 10, alignment: { moral: -1 }, flags: [looted_airship] }
      failure:
        text: |
          ขวดที่สามแตกคามือตอน{name}รีบยัดเข้าเสื้อ น้ำค้างดาวเย็นจัดไหลลงไปตามแขน ซึมเข้าผิวหนังเหมือนน้ำซึมลงทราย แขนข้างนั้นเรืองแสงฟ้าจางๆ ในความมืด ใครเห็นก็รู้ว่า{name}ทำอะไร

          แสงที่แขนอยู่ไปสิบวันกว่าจะจาง สิบคืนนั้น{name}นอนไม่ค่อยหลับ ทุกครั้งที่พลิกตัว แสงฟ้าจากแขนลอดผ้าห่มขึ้นมาจับเพดาน
        effects: { hp: -1, stats: { DEX: 1 }, world: { star: 1 }, flags: [star_dew_burn] }
    - id: fight_the_fire
      label: ตะโกนเรียกคน แล้วช่วยกันเอาดินกลบไฟที่ถุงลม
      text: |
        {name}ตะโกนจนคนที่ยังยืนดูอยู่ไกลๆ วิ่งเข้ามา ทุกคนเอามือกอบดิน เอาเสื้อตีไฟ ไฟที่ถุงลมดับก่อนลามไปถึงห้องบังคับเรือ คนที่ติดอยู่ข้างใต้ยังตะโกนอยู่ จนคนสิบกว่าคนช่วยกันยกโครงเหล็กขึ้นได้

        คนที่นอนนิ่งข้างซากไม่ได้ลุกขึ้นอีก {name}ช่วยยกเขาขึ้นเกวียนไปส่งเมือง ตัวเขาเบาผิดขนาดตัว
      effects: { stats: { STR: 1, CHA: 1 }, flags: [fought_airship_fire] }

- id: youth.pawn_heirloom
  stage: youth
  weight: 10
  when:
    age: [15, 17]
    not_flags: [origin_elf_bough]
  text: |
    ร้านรับจำนำอยู่ท้ายตลาด หน้าร้านแคบ แต่ข้างในลึกเข้าไปจนมองไม่เห็นผนังหลัง ของวางกองไว้บนชั้นถึงเพดาน ป้ายราคาเขียนด้วยดินสอพองบนกระดานเล็กๆ ที่ห้อยไว้กับของทุกชิ้น

    {name}เข้าไปหารองเท้ามือสองที่พอใส่ได้ แต่ตาไปหยุดที่ของชิ้นหนึ่งบนชั้นกลาง กล่องดนตรีไม้ดำขนาดเท่ากำปั้น ฝาบิ่นมุมหนึ่ง {name}ไม่เคยเห็นของชิ้นนี้มาก่อน แต่รู้ว่าถ้าหมุนลานแล้ว เพลงจะสะดุดที่โน้ตที่เจ็ดทุกรอบ และรู้ว่าใต้ฐานมีช่องลับ เปิดได้ด้วยการกดมุมที่บิ่น

    ป้ายราคาเขียนไว้ห้าเหรียญ คนเฝ้าร้านเป็นหญิงแก่ใส่แว่นตาหนาเท่าก้นขวด นั่งนับเหรียญอยู่หลังโต๊ะ ไม่ได้มองมาทางนี้
  choices:
    - id: buy_it
      label: ขอทำงานในร้านแลกกับกล่องดนตรี
      text: |
        หญิงแก่หยิบกล่องลงมาจากชั้น เป่าฝุ่นออก หมุนลานให้ฟังหนึ่งรอบ เพลงสะดุดที่โน้ตที่เจ็ด เธอบอกว่าเสียตรงนั้นมาตั้งแต่ก่อนมาอยู่ที่ร้าน แล้วชี้ลังที่กองอยู่หลังร้าน ให้ยกขึ้นชั้นบนให้หมดก่อนค่อยมาเอา

        ลังหนักทุกใบ บางใบมีเสียงอะไรกลิ้งอยู่ข้างใน {name}ยกอยู่สามวันจนบันไดหลังร้านคุ้นเท้า วันที่สาม หญิงแก่ห่อกล่องดนตรีด้วยกระดาษเก่ายื่นให้ กลับถึงที่นอน {name}กดมุมที่บิ่น ฐานกล่องเลื่อนออกมาครึ่งนิ้ว ในช่องลับมีกระดาษพับแผ่นเล็ก สีเหลืองจนแทบเป็นสีน้ำตาล ลายมือในนั้นเลือนจนอ่านได้คำเดียว เป็นคำว่ากลับ
      effects: { stats: { STR: 1, WIS: 1 }, flags: [bought_music_box] }
    - id: slip_it_away
      label: รอให้คนเฝ้าร้านก้มนับเหรียญ แล้วหยิบใส่เสื้อ
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          หญิงแก่นับเหรียญออกเสียงทีละเหรียญ ถึงยี่สิบเจ็ด กล่องดนตรีก็ไปอยู่ใต้เสื้อ{name}แล้ว {name}ลองรองเท้าอีกสองคู่ บอกว่าไม่พอดี แล้วเดินออกจากร้าน

          คืนนั้นกดมุมที่บิ่น ฐานกล่องเลื่อนออกมาครึ่งนิ้ว ในช่องลับมีกระดาษพับแผ่นเล็ก สีเหลืองจนแทบเป็นสีน้ำตาล ลายมือเลือนจนอ่านได้คำเดียว เป็นคำว่ากลับ ทั้งคืนนั้น{name}ไม่ได้หมุนลานสักรอบ
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [bought_music_box] }
      failure:
        text: |
          มือ{name}ยังไม่ทันพ้นชั้น หญิงแก่ก็พูดขึ้นมาโดยไม่เงยหน้าจากเหรียญ ว่าแว่นหนาก็จริง แต่หูยังดีอยู่ แล้วบอกให้วางกลับที่เดิม

          เธอไม่เรียกยาม ไม่ไล่ออกจากร้าน ขายรองเท้าให้{name}คู่หนึ่งในราคาเต็ม แล้วบอกว่ากล่องนั้นไม่มีใครถามหามาสามสิบปี เธอจะเก็บไว้ให้อีกปีหนึ่ง
        effects: { gold: -1, stats: { DEX: 1 }, flags: [music_box_waits] }
    - id: ask_whose
      label: ถามคนเฝ้าร้านว่าใครเอากล่องนี้มาจำนำ
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          หญิงแก่ถอดแว่นเช็ดอยู่นาน แล้วเล่าว่าคนที่เอามาจำนำไม่ใช่เจ้าของ เป็นคนเก็บของจากบ้านคนตาย เจ้าของจริงตายไปก่อนนั้นอีกหลายปี ไม่มีญาติ ไม่มีใครมารับของ ของทั้งบ้านจึงมาจบที่ร้านนี้

          {name}ถามว่าเจ้าของเป็นคนแบบไหน เธอบอกว่าจำได้แค่ว่าเป็นคนที่ชอบเดินทาง กลับบ้านปีละครั้ง และทุกครั้งที่กลับ จะเข้ามาที่ร้านนี้ ถามหาของที่ไม่เคยมี
        effects: { stats: { CHA: 1 }, flags: [knows_music_box_owner] }
      failure:
        text: |
          หญิงแก่บอกว่าร้านนี้รับของ ไม่ได้รับเรื่อง ใครเอาอะไรมาก็ไม่ใช่ธุระของคนซื้อ แล้วกลับไปนับเหรียญต่อ

          {name}ซื้อรองเท้าคู่ที่หามา แล้วเดินออกจากร้าน ตอนเดินผ่านหน้าต่างร้าน กล่องดนตรีบนชั้นกลางอยู่ในมุมที่มองเห็นจากถนนพอดี
        effects: { gold: -1, stats: { WIS: 1 }, flags: [music_box_waits] }

- id: youth.letter_home
  stage: youth
  weight: 10
  when:
    age: [16, 17]
  text: |
    หญิงแม่ม่ายที่อยู่ถัดไปไม่กี่หลังถือจดหมายมาหา{name}ตั้งแต่เช้า ซองดี กระดาษหนา ตราประทับสีแดงที่มุมซอง เป็นจดหมายฉบับแรกที่ส่งมาจากที่ทำงานของลูกชายเธอ ตั้งแต่เขาออกไปทำงานไกลเมื่อสองปีก่อน

    เธออ่านหนังสือไม่ออก ทั้งถิ่นมีคนอ่านออกไม่กี่คน และ{name}เป็นคนหนึ่งในนั้น เธอนั่งลงตรงหน้า{name} มือวางบนเข่า ยิ้มรอ ตั้งแต่เช้าเธอยังไม่ได้เปิดซอง
  choices:
    - id: read_it_true
      label: เปิดซอง อ่านให้ฟังทุกคำตามที่เขียน
      check: { stat: INT, dc: 12 }
      success:
        text: |
          ลายมือในจดหมายสวย เป็นลายมือเสมียน ไม่ใช่ลายมือลูกชายเธอ {name}อ่านบรรทัดแรกในใจก่อน แล้วอ่านออกเสียงช้าๆ ทีละคำ ไม่ข้ามคำไหน ว่าบริษัทเสียใจ ว่าเกิดเหตุในกะดึก ว่าจะส่งค่าแรงที่ค้างอยู่ตามมาทีหลัง

          เธอนั่งนิ่งจนจบ แล้วขอให้อ่านอีกรอบ {name}อ่านอีกรอบ ช้ากว่าเดิม รอบที่สองเธอเอามือปิดหน้า {name}นั่งอยู่ด้วยจนเที่ยง ไม่ได้ลุกไปไหน
        effects: { stats: { INT: 1 }, flags: [read_the_death_letter] }
      failure:
        text: |
          ลายมือเสมียนหวัดจน{name}ต้องหยุดสะกดทีละพยางค์ อ่านได้ครึ่งบรรทัดก็ติดคำที่ไม่เคยเห็น พอสะกดได้ก็รู้ว่าเป็นคำว่าเสียใจ

          {name}เงยหน้าขึ้นมา เธอไม่ต้องให้อ่านต่อแล้ว เธอเห็นจากหน้าของ{name} ดึงจดหมายกลับไปถือไว้ แล้วเดินกลับบ้านไปทั้งที่จดหมายยังพับอยู่ครึ่งเดียว
        effects: { stats: { INT: 1 }, flags: [read_the_death_letter] }
    - id: read_it_kind
      label: อ่านในใจก่อน แล้วอ่านให้เธอฟังว่าลูกชายสบายดี
      text: |
        {name}อ่านในใจจนจบ แล้วพับจดหมายกลับ บอกเธอว่าลูกชายสบายดี ได้ขึ้นค่าแรง ฝากความคิดถึงมา ปีหน้าอาจได้กลับบ้าน เธอยิ้มจนตาหยี ขอให้อ่านซ้ำ {name}อ่านซ้ำ คำเดิมทุกคำ

        เธอเก็บจดหมายไว้ในหีบใต้เตียง ทุกเดือนหลังจากนั้น {name}ต้องเขียนจดหมายจากลูกชายเธอขึ้นมาเองหนึ่งฉบับ แล้วเอาไปอ่านให้เธอฟัง ใช้ซองเก่าซองเดิม
      effects: { stats: { CHA: 1 }, alignment: { law: -1, moral: 1 }, flags: [writes_false_letters] }
    - id: fetch_someone
      label: บอกว่าอ่านไม่คล่อง แล้วไปตามคนแก่ที่อ่านออกมาอ่านแทน
      text: |
        คนแก่ที่อ่านออกเป็นคนที่เธอรู้จักมาทั้งชีวิต แกอ่านบรรทัดแรกในใจ แล้วนั่งลงข้างเธอก่อนจะอ่านออกเสียง จับมือเธอไว้ข้างหนึ่งตลอดเวลาที่อ่าน

        {name}ยืนอยู่หน้าประตู ได้ยินทุกคำ ได้ยินเสียงเธอเงียบไปตอนกลางจดหมาย แล้วไม่ได้ยินเสียงอะไรอีกนาน จนคนแก่เรียกให้ไปต้มน้ำ
      effects: { stats: { CON: 1 }, flags: [fetched_the_reader] }

- id: youth.tavern_brawl
  stage: youth
  weight: 10
  when:
    age: [15, 17]
    not_flags: [origin_elf_bough]
  text: |
    วงไพ่ที่โต๊ะมุมร้านเหล้าเล่นกันมาตั้งแต่หัวค่ำ เสียงดังขึ้นเรื่อยๆ จนเกือบเที่ยงคืน ชายไหล่กว้างคนหนึ่งกล่าวหาอีกคนว่าซ่อนไพ่ไว้ในแขนเสื้อ อีกคนไม่เถียง เอาเหยือกเหล้าฟาดหัวเขาแทน

    ภายในสามอึดใจทั้งร้านลุกขึ้นมาต่อยกัน คนที่ไม่รู้ด้วยซ้ำว่าเริ่มจากอะไรก็ต่อย เหรียญบนโต๊ะไพ่หกกระจายไปทั้งพื้น เด็กสาวยกเหล้าเหล้าโดนดันไปติดมุมโต๊ะยาวหลังร้าน ชายไหล่กว้างลุกขึ้นมาได้ เลือดอาบหน้า แล้วหันมาเจอ{name}เป็นคนแรก
  choices:
    - id: hit_first
      label: ต่อยเขาก่อนที่เขาจะต่อย
      check: { stat: STR, dc: 13 }
      success:
        text: |
          หมัดของ{name}เข้าคางเขาเต็มๆ ตอนเขายังตั้งตัวไม่ทัน ชายไหล่กว้างหงายหลังลงไปทับโต๊ะ ขาโต๊ะหักทั้งสองข้าง เขานอนอยู่ตรงนั้นไม่ลุกอีก

          พอทุกอย่างสงบ เจ้าของร้านเดินข้ามเศษแก้วมาหา{name} บอกว่าคนนั้นตีกันในร้านเขามาสามปี ยังไม่เคยมีใครทำให้ล้มได้ แล้วบอกว่าเหล้าคืนนี้ไม่ต้องจ่าย คืนไหนเกิดเรื่องอีกให้มายืนหน้าประตู จะจ่ายค่าแรงให้
        effects: { stats: { STR: 1 }, gold: 2, flags: [won_tavern_brawl] }
      failure:
        text: |
          {name}ต่อยไปก่อนจริง หมัดเข้าไหล่เขา เขาไม่ขยับสักนิด หมัดของเขาตามมาถึงหน้า{name} แล้ว{name}ก็ไปตื่นอีกทีบนพื้นหลังร้าน มีคนเอาน้ำสาดหน้า

          ฟันกรามข้างหนึ่งโยกจนเคี้ยวข้าวไม่ได้ไปสิบวัน ชายไหล่กว้างคนนั้นเจอ{name}ที่ตลาดสามวันต่อมา ยิ้มให้ ไม่ได้ทำอะไร แค่ยิ้ม
        effects: { hp: -2, stats: { STR: 1 }, flags: [lost_tavern_brawl] }
    - id: pull_the_girl
      label: มุดไปดึงเด็กสาวยกเหล้าออกจากมุมโต๊ะยาวหลังร้าน
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}ก้มหลบหมัดที่ไม่ได้ตั้งใจต่อยใคร ลอดใต้โต๊ะสองตัว ไปถึงมุมโต๊ะยาวหลังร้าน ดึงเด็กสาวลงมาหลบใต้โต๊ะยาวหลังร้านด้วยกัน เก้าอี้ตัวหนึ่งลอยข้ามหัวไปแตกกับชั้นเหล้าตรงที่เธอยืนเมื่อครู่

          สองคนนั่งกอดเข่าอยู่ใต้โต๊ะยาวหลังร้านจนเสียงข้างบนเงียบ เด็กสาวบอกว่าเธอทำงานที่นี่มาสองปี นี่เป็นครั้งที่สิบเอ็ด แต่เป็นครั้งแรกที่มีคนมาดึงลงมาด้วย
        effects: { stats: { DEX: 1 }, alignment: { moral: 1 }, flags: [pulled_the_girl] }
      failure:
        text: |
          {name}มุดไปได้ครึ่งทาง ขาโต๊ะลอยมาโดนหลังจนจุก ทรุดลงไปกับพื้น พอเงยหน้าขึ้น เด็กสาวคนนั้นปีนลงมาหลบใต้โต๊ะยาวหลังร้านได้เองแล้ว แล้วเอื้อมมือมาดึง{name}เข้าไปด้วย

          สองคนนั่งกอดเข่าอยู่ใต้โต๊ะยาวหลังร้านจนเสียงข้างบนเงียบ เด็กสาวบอกว่าเธอทำงานที่นี่มาสองปี นี่เป็นครั้งที่สิบเอ็ด ครั้งหน้าให้{name}มุดมาทางซ้าย ทางขวามีแต่คนเมาหนัก
        effects: { hp: -1, stats: { DEX: 1 }, flags: [pulled_the_girl] }
    - id: floor_coins
      label: ก้มเก็บเหรียญที่กระจายอยู่บนพื้นระหว่างที่ทุกคนกำลังต่อยกัน
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ไม่มีใครมองพื้น {name}คลานไปตามขาโต๊ะ กวาดเหรียญเข้าแขนเสื้อทีละกำ ชายไหล่กว้างก้าวข้ามหลัง{name}ไปต่อยคนอื่นโดยไม่รู้ว่าเหยียบอยู่ข้างอะไร

          {name}ออกทางประตูหลังก่อนยามจะมาถึง นับใต้แสงจันทร์ได้เจ็ดเหรียญ กับไพ่หนึ่งใบที่ติดมากับเหรียญ ไพ่ใบนั้นหลังไม่เหมือนไพ่ทั้งสำรับ
        effects: { stats: { DEX: 1 }, gold: 7, alignment: { law: -1 }, flags: [took_brawl_coins] }
      failure:
        text: |
          มือ{name}ไปถึงกองเหรียญพร้อมกับรองเท้าหนังหุ้มข้อของใครคนหนึ่ง รองเท้าเหยียบลงมาบนหลังมือเต็มน้ำหนัก แล้วบิด {name}ร้องจนคนแถวนั้นหันมามอง

          เจ้าของรองเท้าเป็นคนที่โดนกล่าวหาว่าซ่อนไพ่ เขาก้มลงเก็บเหรียญใต้มือ{name}ไปจนหมด แล้วยกเท้าขึ้น บอกว่าขอบใจที่ช่วยเก็บ
        effects: { hp: -1, stats: { DEX: 1 }, flags: [hand_stomped] }
