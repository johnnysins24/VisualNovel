# ชุด อ แดนเถ้าที่ไม่มีใครอยากปกครอง (6 เรื่อง) สำหรับคนที่อยู่ในแดนเถ้า เล่าจากหน้าบ้าน ไม่บอกเหตุจากชั้นบน
# สองเรื่องอ่านสภาพอาณาจักร (ไม่เปลี่ยนค่า): fort_asks_for_grain (คลังต่ำ ป้อมมาขอข้าว กัน wardens ที่อยู่ในป้อมเอง) · road_without_patrol (ความสงบต่ำ ด่านว่าง กัน crown_army)
# สี่เรื่องการเมืองของแดน: who_mends_the_road · pit_head_court · two_wells_one_dry_season · one_voice_to_ventras
# ธรรมเนียมที่ใช้ร่วม (ตีความต่อจากคัมภีร์และไฟล์ 87): วงของบ่อพูดทีละบ้านตามรอยบากบนไม้เวร ตกลงกันได้แล้วคนแก่ที่สุดชักถังขึ้นมาให้ดื่มคนละขัน
#   ถ่านก้นตะกร้า (เศษถ่านก้นตะกร้าเป็นของคนขุด) · ก้อนหินหนึ่งก้อนแทนหนึ่งบ่อ
# คนที่มีแต่ในข้อความ: คาร์เวท นายเสบียงของป้อม ขาเป๋ · ทัมซิน ทหารหญิงที่ไม่ถอนไปกับกอง · เรนวิค นายปากหลุมของบริษัท
#   ดราเซล คนขุดหนุ่ม · กิลดา คนแก่ที่สุดของวงบ้านรางเก่า · เฮลกา เจ้าของโรงเตี๊ยมเกวียนถ่าน มาจากคาร์ดิน
# ที่: บ้านรางเก่า หมู่บ้านอีกวงที่ใช้บ่อของตัวเอง (หมู่บ้านของตัวละครไม่ระบุชื่อ)

- id: adult.realm_ashland_fort_asks_for_grain
  stage: adult
  scene: home
  weight: 22
  when:
    age: [22, 64]
    location_tag: ashland
    world: { treasury: [-8, -2] }
    not_orgs: [wardens]
  text: |
    เกวียนจากป้อมมาถึงบ่อน้ำตอนสาย ไม่ใช่เกวียนเสบียงที่มาตามกำหนด เป็นเกวียนเปล่า ล่อสองตัวผอมจนเห็นกระดูกสะโพก ท้ายเกวียนมีผู้เฝ้าผนึกหนุ่มนั่งมาสามคน คนขับเป็นนายเสบียงของป้อม ชายขาเป๋ชื่อคาร์เวท เขาลงจากเกวียน ถอดหมวก แล้วนั่งลงบนขอบบ่อ ตรงที่คนนอกวงไม่เคยนั่ง

    เขาพูดไม่อ้อม เบี้ยของป้อมไม่มาสามเดือนแล้ว ข้าวในยุ้งป้อมเหลือพอถึงกลางหน้าหนาว ผู้เฝ้าผนึกกินวันละมื้อมาตั้งแต่ต้นเดือน เขาขอข้าว ขอหญ้าเงินตากแห้ง ขอเกลือ อะไรก็ได้ที่กินได้ เงินมาเมื่อไรจะใช้คืน เงินจะมาเมื่อไรเขาไม่รู้ ไม่มีใครบอกเขา

    วงของบ่อน้ำตัดสินเรื่องแบบนี้ด้วยการพูดทีละบ้าน เรียงตามรอยบากบนไม้เวร ตกลงกันได้เมื่อไร คนแก่ที่สุดของวงจะชักน้ำขึ้นมาหนึ่งถัง ให้ทุกคนดื่มคนละขัน บ้านต้นทางพูดว่าให้ บ้านที่สองพูดว่าไม่ให้ ลำดับมาถึงรอยบากที่สาม บ้านของ{name}
  choices:
    - id: speak_for_the_fort
      label: พูดให้วงแบ่งข้าวให้ป้อม บ้านละหนึ่งกระสอบ
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}พูดเรื่องเดียว คืนที่หมาเถ้าลงมาจากเนิน คนที่ถือคบไฟวิ่งมาถึงรั้วก่อนใครคือคนจากป้อม ทุกบ้านในวงจำได้สักคืน บ้านที่สี่พูดตาม บ้านที่ห้าก็ตาม เหลือบ้านเดียวที่ไม่ยอม คนแก่ที่สุดชักถังขึ้นมาก่อนบ้านสุดท้ายจะพูดจบ

          ตกบ่าย เกวียนเปล่าของคาร์เวทมีกระสอบสิบเจ็ดใบ บ้านละใบ ไม่มีใบไหนเต็ม คาร์เวทนับสองรอบ จดลงสมุดเสบียงด้วยดินสอหิน ไม่ได้เขียนชื่อบ้าน เขียนเลขรอยบาก ล่อสองตัวก้มหน้าลากเกวียนกลับไปช้ากว่าตอนมา
        effects: { stats: { CHA: 1 }, reputation: { wardens: 1 }, flags: [spoke_the_well_into_feeding_the_fort] }
      failure:
        text: |
          {name}พูดยังไม่จบ บ้านถัดไปก็พูดแทรก หน้าหนาวที่แล้วเกวียนเสบียงของป้อมมาช้ากว่ากำหนดสองหน ตอนนั้นไม่มีใครจากป้อมมานั่งขอโทษที่ขอบบ่อ บ้านต่อๆ ไปพูดตามทางนั้น คนแก่ที่สุดไม่ชักถัง

          {name}กลับบ้าน แบกกระสอบข้าวของตัวเองมาวางบนเกวียนของคาร์เวทใบเดียว เขามองกระสอบใบนั้นบนพื้นเกวียนเปล่าอยู่ครู่หนึ่ง แล้วถอดหมวกอีกรอบ
        effects: { gold: -3, reputation: { wardens: 1 }, flags: [gave_the_fort_my_own_sack] }
    - id: trade_for_a_night_watch
      label: เสนอให้ป้อมแลกข้าวด้วยคนเฝ้าหมู่บ้านตอนกลางคืน จนกว่าเงินจะมา
      text: |
        คาร์เวทรับคำโดยไม่ต่อ ผู้เฝ้าผนึกที่ท้องว่างยังถือคบไฟได้ วงชักถังขึ้นมาตั้งแต่บ้านที่หก ตั้งแต่คืนนั้นผู้เฝ้าผนึกสองคนเดินมาจากป้อมทุกพลบ นอนเฝ้าใต้ถุนบ้านต้นทางกับบ้านใกล้ปากเหมืองสลับกัน กินข้าวเย็นจากหม้อของบ้านที่ตัวเองนอนเฝ้า

        หน้าหนาวนั้นหมาเถ้าลงมาจากเนินสองหน ทั้งสองหนมีคบไฟลุกขึ้นใต้ถุนก่อนหมาจะถึงรั้ว เสียงผู้เฝ้าผนึกตะโกนเรียกกันดังกว่าเสียงหมา
      effects: { stats: { INT: 1 }, reputation: { wardens: 1 }, flags: [traded_grain_for_a_night_watch] }
    - id: keep_the_grain
      label: พูดว่าข้าวของหมู่บ้านต้องอยู่ในหมู่บ้าน หน้าหนาวนี้ไม่มีใครรู้ว่าจะยาวแค่ไหน
      text: |
        บ้านถัดไปพูดตาม บ้านต่อไปก็ตาม คาร์เวทฟังจนบ้านสุดท้ายพูดจบ สวมหมวก แล้วขึ้นเกวียน ไม่ต่อว่าใครสักคำ ผู้เฝ้าผนึกหนุ่มสามคนนั่งท้ายเกวียนหันหน้าออกทางที่มา

        กลางหน้าหนาว เกวียนเสบียงของป้อมไม่มาตามกำหนด ทั้งหมู่บ้านกินหญ้าเงินตากแห้งกันจนลิ้นชา ไม่มีใครพูดถึงคาร์เวทที่ขอบบ่อ ตรงที่เขาเคยนั่ง ไม่มีใครนั่งทับ
      effects: { alignment: { moral: -1 }, reputation: { wardens: -1 }, flags: [kept_the_grain_from_the_fort] }
    - id: teach_them_the_silver_grass
      label: เล่าให้วงฟังเรื่องหน้าแล้งตอนยังเด็กที่เกวียนเสบียงมาช้า แล้วพาคนของป้อมไปเก็บหญ้าเงิน
      requires: { flag: origin_ashland }
      text: |
        ตอนยังเด็ก {name}เคยกินหญ้าเงินรอเกวียนเสบียงของป้อมจนน้ำตาไหลทุกมื้อ แล้วก็รอด หญ้าเงินขึ้นบนเถ้าทุกที่ แต่คนในป้อมไม่มีใครรู้วิธีเลือก ต้นใบวาวขมน้อย ต้นใบหม่นขมมาก ต้นที่โคนใบเป็นสีแดงห้ามแตะ วงฟังจบแล้วชักถังขึ้นมา ข้าวของหมู่บ้านแบ่งให้ครึ่งเดียว อีกครึ่งให้ป้อมไปเก็บเอง

        บ่ายนั้น{name}พาผู้เฝ้าผนึกหนุ่มสามคนออกไปเนินทางใต้ สอนเลือกทีละต้นจนตะกร้าเต็มสี่ใบ คนที่ตัวใหญ่ที่สุดเคี้ยวใบหม่นใบแรกแล้วน้ำตาไหลพราก อีกสองคนหัวเราะจนต้องนั่งลงบนแผ่นไม้ คาร์เวทจดวิธีเลือกลงหน้าหลังสุดของสมุดเสบียง
      effects: { stats: { WIS: 1 }, reputation: { wardens: 1 }, flags: [taught_the_fort_to_pick_silver_grass] }

- id: adult.realm_ashland_road_without_patrol
  stage: adult
  scene: road
  weight: 22
  when:
    age: [22, 64]
    location_tag: ashland
    world: { peace: [-8, -2] }
    not_orgs: [crown_army]
  text: |
    ด่านทหารตรงทางแยกทางขนถ่านว่างมาเจ็ดวันแล้ว ไม้กั้นทางยกค้าง เตาหน้าเพิงเย็นสนิท ไม่มีใครบอกหมู่บ้านว่ากองไปไหน หรือจะกลับมาไหม คนขับเกวียนถ่านเล่าว่าด่านอื่นตลอดทางสายนี้ก็ว่างทุกด่าน ทหารที่ยังอยู่มีคนเดียว หญิงชื่อทัมซิน นางเลาะเครื่องหมายกองออกจากเสื้อแล้ว นอนในเพิงหน้าด่านคนเดียว หมวกเหล็กของนางแขวนอยู่บนตะปูหน้าเพิง ไม่ได้สวมอีกตั้งแต่วันที่กองออกเดิน

    คืนที่สาม เกวียนถ่านเล่มหนึ่งโดนดักที่ทางโค้งหลังเนิน คนขับเดินกลับมาถึงหมู่บ้านตอนสางด้วยเท้าเปล่า ล่อหาย ถ่านหาย รองเท้าก็หาย คืนที่ห้ามีคนเห็นแสงไฟเดินอยู่บนเนินเลยรั้วหมู่บ้าน ไม่ใช่แสงแดงในอกหมาเถ้า เป็นคบไฟของคน

    วงของบ่อน้ำนั่งกันตั้งแต่บ่าย เรื่องมีเรื่องเดียว ใครจะเฝ้าทางตอนกลางคืน คนหนุ่มอยู่ในหลุมทั้งกะ คนแก่ตาไม่ดีพอ อีกสิบวันจะถึงคืนเดือนดับ คืนที่ไม่มีใครในหมู่บ้านเงยหน้า ทัมซินนั่งฟังอยู่นอกวง ไม่ได้ขอพูด
  choices:
    - id: stand_the_first_watch
      label: รับเวรคืนแรกเอง ถือคบไฟไปนั่งที่ทางโค้งหลังเนิน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}นั่งหลังก้อนหินตรงทางโค้ง ปักคบไฟไว้ห่างตัวสิบก้าว ให้แสงตกที่ทาง ไม่ตกที่คน เลยเที่ยงคืนมีฝีเท้าสามคู่ลงมาจากเนิน หยุดตรงขอบแสง ยืนดูคบไฟจนเปลวเตี้ยลงครึ่งหนึ่ง แล้วถอยกลับขึ้นไป ไม่มีใครรู้ว่าหลังหินมีคนเฝ้าอยู่กี่คน

          ตอนสาง{name}เดินกลับหมู่บ้าน มือแข็งจนกำไม่ลง บนขอบบ่อมีชามข้าวต้มอุ่นวางรออยู่ใบหนึ่ง ไม่มีใครบอกว่าใครวาง
        effects: { stats: { CON: 1 }, flags: [stood_the_first_road_watch] }
      failure:
        text: |
          {name}นั่งหลังก้อนหินจนเลยเที่ยงคืน แล้วตาก็ปิดเอง ตื่นมาเพราะคบไฟล้มลงเถ้า ไฟดับ มีคนยืนอยู่ข้างตัว กระบองฟาดลงที่ไหล่ครั้งเดียว แค่พอให้รู้ แล้วฝีเท้าก็ลงทางโค้งไปทางเกวียนที่จอดพักอยู่ปลายทาง

          ตอนสาง คนขับเกวียนเล่มนั้นเดินเท้าเปล่ามาถึงหมู่บ้านอีกคน เขาเห็นไหล่ที่บวมเป่งของ{name} แล้วไม่ถามสักคำ
        effects: { hp: -2, flags: [slept_through_the_road_watch] }
    - id: watch_by_the_rota_stick
      label: เสนอให้เวรเฝ้าทางเดินตามรอยบากบนไม้เวร บ้านละคืน คืนเดือนดับให้คนเฝ้านั่งก้มหน้าฟังแทนดู
      text: |
        วงตกลงก่อนตะวันตก คนแก่ที่สุดชักถังขึ้นมาให้ดื่มคนละขัน ไม้เวรที่ใช้เรียกกวาดเถ้ามีงานเพิ่ม แขวนหน้าบ้านไหน บ้านนั้นส่งคนไปนั่งที่ทางโค้งหนึ่งคืน คนแก่ไปกับหลาน คนที่อยู่บ้านคนเดียวไปกับบ้านข้างๆ คืนเดือนดับเวียนมาถึงบ้าน{name}พอดี {name}นั่งที่ทางโค้งทั้งคืน หน้าผากแตะเข่า คบไฟปักห่างไปสิบก้าว ฟังเสียงเถ้าใต้รองเท้าที่ไม่ใช่ของคนในหมู่บ้าน

        ตอนสาง บนเถ้าตรงทางโค้งมีรอยเท้าคนสามคู่ เดินลงมาจากเนินถึงขอบแสงคบไฟ แล้วเลี้ยวกลับ
      effects: { stats: { WIS: 1 }, flags: [put_the_road_watch_on_the_rota_stick] }
    - id: hire_the_young_miners
      label: ออกเงินจ้างคนหนุ่มจากหลุมให้เฝ้าแทน ชดเชยค่ากะที่เสียไป
      requires: { min_gold: 3 }
      text: |
        คนหนุ่มสี่คนรับเงิน ไปขอลากะดึกกับนายปากหลุม นายปากหลุมหักค่าแรงคนละสามวันเป็นค่าลา บริษัทไม่ขาดคน หน้าหลุมมีคนรอรับกะแทนเสมอ

        สี่คนนั้นเฝ้าทางโค้งด้วยพลั่วกับคบไฟ คุยกันเสียงดังทั้งคืนให้คนบนเนินได้ยิน ครบเดือนไม่มีเกวียนโดนดักที่ทางโค้งอีก พลั่วสี่ด้ามพิงเรียงอยู่หน้าเพิงด่าน ใต้หมวกเหล็กใบนั้น
      effects: { gold: -3, flags: [paid_the_young_miners_to_watch] }
    - id: let_the_soldier_lead
      label: ขอให้ทัมซินนำเวร และให้ทั้งวงตกลงกันว่าถ้ากองกลับมา ไม่มีใครเคยเห็นนาง
      text: |
        คนแก่ที่สุดชักถังขึ้นมา ส่งขันแรกให้ทัมซิน คนนอกวงคนแรกที่ได้ดื่มจากถังนั้น นางจัดเวรแบบทหาร ผลัดละสองชั่วยาม คำผ่านทางเปลี่ยนทุกคืน สอนคนแก่ถือหอกไม้แบบไม่ต้องใช้แรง สอนเด็กโตให้วิ่งไปตีระฆังปากหลุม คืนที่สิบสองมีคนลงมาจากเนินถึงขอบแสงคบไฟ ได้ยินเสียงนางร้องถามคำผ่านทางด้วยเสียงทหาร แล้วถอยกลับขึ้นไปเอง

        หลังคืนเดือนดับ ทัมซินเอาหมวกเหล็กลงจากตะปู ฝังไว้ในเถ้าหลังเพิง ก่อนหน้าฝนจะมา บนหลุมนั้นมีหญ้าเงินขึ้นต้นหนึ่ง ใบวาว
      effects: { alignment: { law: -1 }, reputation: { crown: -1 }, flags: [hid_the_soldier_who_stayed] }

- id: adult.realm_ashland_who_mends_the_road
  stage: adult
  scene: road
  weight: 22
  when:
    age: [22, 60]
    location_tag: ashland
  text: |
    ทางแผ่นไม้จากหมู่บ้านไปปากหลุมยาวราวสองพันก้าว ใครก็ใช้ คนงานเดินไปเข้ากะ เด็กเดินไปเก็บหญ้าเงิน คนส่งจดหมายของป้อมเดินผ่านเดือนละครั้ง แต่เกวียนถ่านของบริษัทเหมืองใช้หนักที่สุด ล้อเหล็กบดแผ่นไม้จนแตกเป็นเสี้ยน แผ่นที่แตกจมลงไปในเถ้าทีละน้อย ไม่มีใครเห็นวันที่จม

    เช้าวันหนึ่งช่วงกลางทางขาดไปสามแผ่นติดกัน ล่อของคนขายเกลือเหยียบลงไปในช่องนั้น ขาหน้าหัก ต้องฆ่าทิ้งตรงนั้น คนขายเกลือนั่งร้องไห้บนกระสอบเกลือจนเที่ยง

    นายปากหลุมบอกว่าทางเป็นของหมู่บ้าน หมู่บ้านบอกว่าเกวียนบริษัททำทางพัง ป้อมบอกว่าป้อมใช้ทางนี้เดือนละครั้งเท่านั้น วงของบ่อน้ำเถียงกันมาสองบ่ายแล้ว ไม่มีใครชักถังขึ้นมา ช่องว่างกลางทางกว้างขึ้นทุกวัน
  choices:
    - id: lay_the_first_plank
      label: แบกไม้ของตัวเองไปอุดช่องก่อน ไม่รอวง
      text: |
        ไม้ที่{name}มีคือบานประตูเก่าที่พิงอยู่หลังบ้าน หนักกว่าที่คิด {name}ลากไปตามทางแผ่นไม้จนถึงช่องว่าง ขุดเถ้าให้ลึก วางลงไปให้แน่น เหยียบลองสามรอบ แล้วนั่งพักบนไม้ที่เพิ่งวาง

        เย็นนั้นมีคนเดินผ่านสามคน คนแรกเดินข้ามไปเฉยๆ คนที่สองหยุดดูแล้วกลับไปเอาไม้ของตัวเองมา คนที่สามคือคนขายเกลือ เขาเอาเชือกจูงล่อเส้นเก่ามามัดไม้แผ่นใหม่เข้ากับแผ่นข้างๆ ไม่ให้เลื่อน
      effects: { stats: { STR: 1 }, flags: [laid_the_first_plank_myself] }
    - id: count_the_wheel_marks
      label: นั่งนับรอยล้อเหล็กบนแผ่นที่แตก ทำบัญชีไปวางบนโต๊ะนายปากหลุม
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}นับอยู่สามวัน แผ่นที่แตกตามรอยล้อเหล็กกว้างเท่าล้อเกวียนบริษัทพอดี แผ่นที่แตกตามรอยเท้าคนไม่มีสักแผ่น บัญชีมีสองช่อง ช่องหนึ่งยาวเต็มหน้า อีกช่องว่าง นายปากหลุมอ่านแล้วอ่านซ้ำ ไม่เถียง เขาเขียนใบเบิกแผ่นไม้จากโรงไม้ของบริษัทยี่สิบแผ่น บอกว่าครั้งเดียว ไม่มีครั้งหน้า

          แผ่นไม้ของบริษัททาน้ำมันดินมาแล้วทั้งแผ่น ดำกว่าแผ่นเก่าของหมู่บ้าน ทางช่วงนั้นจึงมีแถบดำอยู่กลางทาง เด็กๆ เล่นกระโดดข้ามแถบดำกันทุกเย็น
        effects: { stats: { INT: 1 }, flags: [billed_the_company_for_the_planks] }
      failure:
        text: |
          นายปากหลุมอ่านไม่ถึงครึ่ง ถามว่าใครนับ แล้วถามว่า{name}มีธุระอะไรกับเกวียนของบริษัท ไม่ว่า{name}จะตอบอย่างไร เขาก็ฉีกบัญชีครึ่งหน้า ม้วนจุดตะเกียงบนโต๊ะ

          ช่องว่างกลางทางยังกว้างอยู่ทั้งเดือน สามวันที่นั่งนับ{name}ไม่ได้ทำงานอื่น เทียนสองเล่มที่จุดนับตอนกลางคืนก็หมดไปเปล่าๆ
        effects: { gold: -2, flags: [the_pit_master_burned_my_count] }
    - id: toll_the_coal_carts
      label: เสนอให้วงเก็บค่าผ่านทางจากเกวียนถ่าน เล่มละหนึ่งเหรียญ เอาไปซื้อแผ่นไม้
      text: |
        วงตกลงเร็วกว่าที่{name}คิด คนแก่ที่สุดชักถังขึ้นมาตั้งแต่บ้านที่ห้ายังพูดไม่จบ วันรุ่งขึ้นมีคนแก่สองคนนั่งเก็บเงินที่หัวทาง ข้างตัวมีกระป๋องสังกะสีใบหนึ่ง คนขับเกวียนบริษัทจ่ายทุกเหรียญ ด่าทุกเหรียญ

        ครบเดือน บริษัทให้เกวียนอ้อมไปทางเถ้าลึกทางตะวันตก ไม่ผ่านหมู่บ้านอีก เงินในกระป๋องพอซื้อแผ่นไม้ใหม่ได้ทั้งช่วงที่พัง ทางแผ่นไม้เรียบที่สุดตั้งแต่มีหมู่บ้าน ไม่มีล้อเหล็กมาบดอีก มีแต่เท้าคนกับกีบล่อตัวใหม่ของคนขายเกลือ
      effects: { stats: { CHA: 1 }, flags: [put_a_toll_on_the_coal_carts] }
    - id: fort_timber
      label: เดินไปป้อม ขอไม้เก่าที่รื้อออกจากแนวรั้ว
      text: |
        จ่าที่ประตูป้อมพา{name}ไปดูกองไม้หลังโรงม้า ไม้รั้วเก่าที่รื้อออกจากแนวหิน ดำเพราะเถ้า แข็งเพราะอายุ ขอบมีรอยตะปูที่ตอกแล้วถอนมาหลายรอบ เขาให้ขนไปเท่าที่เกวียนของหมู่บ้านบรรทุกได้ แลกกับให้ซ่อมทางช่วงหน้าป้อมก่อน

        ไม้รั้วของป้อมวางลงกลางทางเป็นช่วงยาวสิบแผ่น ทุกแผ่นมีรอยขีดเล็กๆ ที่ปลาย นับวันเวรเฝ้าของผู้เฝ้าผนึกคนไหนสักคนที่ไม่มีใครในหมู่บ้านรู้จัก
      effects: { reputation: { wardens: 1 }, flags: [mended_the_road_with_fort_timber] }

- id: adult.realm_ashland_pit_head_court
  stage: adult
  scene: mine
  weight: 22
  when:
    age: [22, 60]
    location_tag: ashland
  text: |
    บริษัทเหมืองตั้งศาลที่ปากหลุมเมื่อต้นเดือน ไม่ได้ถามใคร โต๊ะไม้ตัวหนึ่งตั้งบนกองตะกรัน ระฆังทองเหลืองแขวนข้างโต๊ะ เสมียนบริษัทนั่งจดสมุดเล่มหนา นายปากหลุมชื่อเรนวิคนั่งกลาง ตีระฆังหนึ่งทีเมื่อเริ่ม ตีอีกทีเมื่อตัดสิน คำตัดสินทุกคำจ่ายด้วยค่าแรงที่หักไว้

    วันนี้คนที่ยืนหน้าโต๊ะคือดราเซล คนขุดหนุ่มจากบ้านใกล้ปากเหมือง เสมียนอ่านข้อหา ขโมยหินถ่านมารของบริษัทหนึ่งก้อน ห่อผ้ากลับบ้านตอนเลิกกะ ทั้งหมู่บ้านรู้ว่าก้อนนั้นคืออะไร ถ่านก้นตะกร้า เศษที่ค้างก้นตะกร้าตอนเทลงเกวียน คนขุดเก็บกลับไปอุ่นบ้านกันมาตั้งแต่ก่อนบริษัทนี้จะมาซื้อหลุม

    เสมียนเรียกชื่อ{name}เป็นพยาน วันนั้น{name}เดินผ่านกองตะกรันตอนเลิกกะ เห็นดราเซลห่อผ้า เห็นเต็มตา
  choices:
    - id: testify_as_seen
      label: ให้การตามที่เห็น ห่อผ้าหนึ่งห่อ ก้อนเดียว ไม่มากกว่านั้น
      text: |
        เสมียนจดคำของ{name}ทีละคำ ห่อผ้าหนึ่งห่อ ก้อนเดียว เรนวิคตีระฆังหนึ่งที หักค่าแรงดราเซลครึ่งเดือน เสมียนวางเหรียญค่าพยานหนึ่งเหรียญบนโต๊ะตรงหน้า{name}

        เย็นนั้นที่บ่อน้ำ ไม่มีใครถามว่า{name}ให้การว่าอะไร ทุกคนรู้แล้ว คนตักน้ำส่งขันให้{name}ช้ากว่าส่งให้คนอื่นครึ่งจังหวะ
      effects: { gold: 1, alignment: { law: 1 }, flags: [testified_at_the_pit_head_court] }
    - id: speak_the_custom
      label: บอกศาลว่าก้อนนั้นคือถ่านก้นตะกร้า ของคนขุดมาตั้งแต่ก่อนบริษัทมาซื้อหลุม
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ไม่ได้พูดกับเรนวิค พูดกับเสมียน ขอให้จดลงสมุดทุกคำ ว่าถ่านก้นตะกร้าคืออะไร ทำกันมากี่รุ่น บ้านไหนบ้างที่อุ่นบ้านด้วยเศษถ่านแบบนี้ เสมียนจดจนเต็มหน้า คนงานที่ยืนดูรอบกองตะกรันยกมือทีละคน จนเรนวิคนับไม่ทัน

          เรนวิคตีระฆังหนึ่งที ไม่หักค่าแรง ตั้งแต่วันนั้น ข้างประตูปากหลุมมีตะกร้าเปล่าวางไว้ใบหนึ่ง คนเลิกกะเทเศษถ่านก้นตะกร้าลงไปก่อน แล้วค่อยหยิบกลับบ้าน ตะกร้าใบนั้นไม่เคยมีใครนับ
        effects: { stats: { CHA: 1 }, flags: [wrote_bottom_basket_coal_into_the_ledger] }
      failure:
        text: |
          เรนวิคฟังจนจบแล้วถามว่าธรรมเนียมนี้เขียนไว้ที่ไหน {name}ตอบว่าไม่มีที่ไหนเขียน เขาตีระฆังหนึ่งที หักค่าแรงดราเซลหนึ่งเดือน แล้วตีอีกที ปรับ{name}สองเหรียญฐานพูดแทนจำเลยโดยไม่ได้รับอนุญาต เสมียนบอกว่าถ้าไม่จ่าย พรุ่งนี้ห้ามเหยียบทางแผ่นไม้ช่วงของบริษัท

          ขากลับ ดราเซลเดินตาม{name}มาตลอดทางแผ่นไม้ ไม่พูดสักคำ ถึงหน้าบ้าน{name} เขาวางห่อผ้าเล็กๆ ไว้บนขั้นบันได ข้างในเป็นถ่านก้นตะกร้าก้อนเดียว ยังอุ่น
        effects: { gold: -2, flags: [fined_for_speaking_at_the_pit_head] }
    - id: saw_nothing
      label: บอกเสมียนว่าวันนั้นฝุ่นตะกรันตลบ มองอะไรไม่ชัด
      text: |
        เสมียนถามซ้ำสองรอบ {name}ตอบเท่าเดิมทั้งสองรอบ เรนวิคมองหน้า{name}อยู่ครู่หนึ่ง แล้วตีระฆังหนึ่งที ยกฟ้อง ไม่มีพยาน เสมียนจดชื่อ{name}ลงในหน้าอื่นของสมุด ไม่ใช่หน้าคดี

        เย็นนั้นที่บ่อน้ำ ดราเซลยืนรออยู่ตรงที่คนตักน้ำยืน เขาตักถังแรกของเย็นนั้นยื่นให้{name}ก่อนคนแก่ที่สุด ผิดธรรมเนียม ไม่มีใครในวงทักท้วง
      effects: { alignment: { law: -1, moral: 1 }, flags: [saw_nothing_at_the_pit_head] }
    - id: take_it_to_the_well
      label: บอกศาลว่าเรื่องของคนในหมู่บ้านต้องตัดสินที่บ่อ แล้วเดินลงจากกองตะกรัน
      text: |
        เรนวิคตีระฆังเรียกสองที เสียงระฆังตามหลัง{name}มาจนถึงทางแผ่นไม้ ตกเย็นวงของบ่อน้ำนั่งฟังเรื่องเดียวกันอีกรอบ ดราเซลเล่าเอง วงตัดสินให้เขาแบกถ่านก้นตะกร้าหนึ่งตะกร้าไปวางที่บ้านแม่ม่ายท้ายหมู่บ้าน แล้วคนแก่ที่สุดก็ชักถังขึ้นมา

        วันรุ่งขึ้นศาลปากหลุมตัดสินโดยไม่มีพยาน หักค่าแรงดราเซลหนึ่งเดือนเต็ม ดราเซลรับโทษจากสองศาลในสองวัน ไม่เถียงทั้งสองครั้ง ตะกร้าถ่านหน้าบ้านแม่ม่ายพร่องลงทีละก้อนจนหมดหน้าหนาว
      effects: { stats: { WIS: 1 }, flags: [took_the_coal_case_to_the_well] }

- id: adult.realm_ashland_two_wells_one_dry_season
  stage: adult
  scene: home
  weight: 22
  when:
    age: [25, 64]
    location_tag: ashland
  text: |
    หน้าแล้งนั้นบ่อของบ้านรางเก่าแห้งก่อนกลางฤดู เชือกถังของบ้านรางเก่าต่อยาวขึ้นทุกสัปดาห์ จนวันหนึ่งถังลงไปถึงก้นแล้วขึ้นมาพร้อมโคลนครึ่งถัง บ่อของหมู่บ้าน{name}อยู่ห่างไปครึ่งเช้าเดิน น้ำยังมี แต่ลดลงจากขอบมาสองช่วงตัวคนแล้ว

    เช้าวันที่สามที่บ่อแห้ง คนบ้านรางเก่ามาถึงขอบบ่อพร้อมถังทุกใบที่มี หญิงแก่คนหนึ่งเดินนำ ชื่อกิลดา คนแก่ที่สุดของวงบ้านรางเก่า นางไม่ตักน้ำ นางวางถังลงข้างขอบบ่อ แล้วขอพูดกับวง

    ในแดนเถ้า บ้านที่ตักน้ำบ่อเดียวกันคือวงเดียวกัน ทุกคนรู้ กิลดาก็รู้ ถ้าบ้านรางเก่าตักน้ำบ่อนี้ทั้งหน้าแล้ง ไม้เวรของหมู่บ้าน{name}ต้องบากเพิ่มอีกสิบเอ็ดรอย และทุกเรื่องที่ตัดสินกันที่ขอบบ่อนี้ จะมีเสียงของบ้านรางเก่าเพิ่มมาอีกสิบเอ็ดเสียง
  choices:
    - id: one_circle
      label: บอกวงว่าให้ตัก และให้นั่งวงด้วย ไม้เวรบากเพิ่มก็บากไป
      text: |
        วงเถียงกันจนตะวันคล้อย ลำดับพูดเวียนมาถึง{name}ตอนเสียงเท่ากันพอดี {name}พูดว่าให้ คนแก่ที่สุดชักถังขึ้นมา ส่งขันแรกให้กิลดา

        คืนนั้นคนถือไม้เวรนั่งบากรอยเพิ่มสิบเอ็ดรอยต่อท้ายรอยของบ้านใกล้ปากเหมือง {name}ถือตะเกียงให้จนดึก ตอนบากรอยสุดท้าย ไม้เวรยาวไม่พอ ต้องบากขึ้นไปบนหัวด้ามที่ไม่เคยมีใครบาก
      effects: { stats: { CHA: 1 }, flags: [joined_two_wells_into_one_circle] }
    - id: count_by_pebbles
      label: เสนอให้ตักได้บ้านละสองถังต่อวัน นับด้วยกรวด แต่ไม่ให้นั่งวง
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ตักหนึ่งถัง วางกรวดหนึ่งก้อนลงกระป๋องของบ้านตัวเอง ครบสองก้อนก็พอ วงตกลง กิลดาตกลง นางว่าน้ำไม่ต้องมีเสียง ขอแค่มีน้ำ ทั้งหน้าแล้งคนบ้านรางเก่าเดินมาตักทุกเช้า ไม่มีกระป๋องไหนเกินสองก้อน

          วันที่ฝนแรกตก กิลดาหิ้วกระป๋องกรวดของบ้านรางเก่าทุกใบมาวางคืนที่ขอบบ่อ กรวดทั้งหมดเทรวมกันได้กองเท่าตะกร้า เด็กสองหมู่บ้านนั่งนับกันจนมืดก็ยังนับไม่จบ
        effects: { stats: { WIS: 1 }, flags: [counted_the_buckets_with_pebbles] }
      failure:
        text: |
          กรวดนับถังใช้ได้สามวัน วันที่สี่มีกรวดเกินในกระป๋องของบ้านหนึ่ง ไม่มีใครรู้ว่าใครใส่ คืนนั้นคนสองบ้านต่อยกันที่ขอบบ่อ {name}เข้าไปแยก โดนศอกเข้าที่ปากจนริมฝีปากแตก

          กิลดามาที่บ่อตอนเช้า เก็บกระป๋องกรวดของบ้านรางเก่าทุกใบกลับไป วันต่อมาคนบ้านรางเก่าเดินไปตักน้ำที่บ่อของป้อม ครึ่งวันไป ครึ่งวันกลับ
        effects: { hp: -1, flags: [the_pebble_count_broke] }
    - id: one_well_one_circle
      label: บอกว่าบ่อนี้เลี้ยงได้วงเดียว ถ้าแบ่ง หน้าแล้งนี้จะแห้งทั้งสองวง
      text: |
        กิลดาฟังจนจบ ไม่เถียง นางยกถังเปล่าขึ้น บอกคนของนางให้หันหลังกลับ ระหว่างทางกลับ เด็กบ้านรางเก่าคนหนึ่งหันมามองบ่อทุกสิบก้าว

        หน้าแล้งนั้นบ่อของหมู่บ้าน{name}ไม่แห้ง น้ำลดลงอีกช่วงตัวคนแล้วหยุด หน้าฝนต่อมาบ้านรางเก่าว่างไปสามหลัง ไม่มีใครรู้ว่าย้ายไปไหน ไม้เวรของบ้านรางเก่าคงมีลิ่มไม้อุดรอยบากเพิ่มสามลิ่ม
      effects: { alignment: { moral: -1 }, flags: [kept_the_well_for_one_circle] }
    - id: dig_the_dry_well
      label: ชวนคนทั้งสองวงไปขุดบ่อของบ้านรางเก่าให้ลึกลงไปอีก
      check: { stat: STR, dc: 13 }
      success:
        text: |
          คนสองวงขุดกันสิบวัน ผลัดกันลงไปทีละสองคน ตักโคลนขึ้นมาทีละถัง {name}ลงไปเป็นคู่ที่เก้า ใต้โคลนมีชั้นหินดำ ใต้หินดำมีเสียงน้ำ ไม่ใช่เสียงหยด เสียงไหล

          วันที่น้ำขึ้นมาถึงเข่าคนขุด กิลดาชักถังแรกขึ้นมาเอง ส่งขันแรกให้คนแก่ที่สุดของหมู่บ้าน{name} สองวงดื่มบ่อเดียวกันคนละขัน แล้วแยกกันกลับไปบ่อของตัวเอง
        effects: { stats: { STR: 1 }, flags: [dug_the_dry_well_deeper] }
      failure:
        text: |
          วันที่หก ผนังบ่อด้านหนึ่งพังลงมาเป็นแผ่น {name}อยู่ก้นบ่อพอดี เถ้ากับโคลนทับถึงอก กว่าคนข้างบนจะดึงเชือกขึ้นมาได้ ซี่โครงข้างหนึ่งร้าว

          บ่อบ้านรางเก่าตื้นกว่าเดิมเพราะผนังที่พังลงมา คนบ้านรางเก่าเลิกขุด กิลดาเดินมาส่งข้าวต้มที่บ้าน{name}ทุกเย็นจนซี่โครงหาย ทุกเย็นนางหิ้วถังเปล่ามาด้วยใบหนึ่ง วางไว้ข้างประตู แล้วหิ้วกลับไปเปล่าๆ
        effects: { hp: -3, flags: [the_old_well_fell_in_on_me] }

- id: adult.realm_ashland_one_voice_to_ventras
  stage: adult
  scene: home
  weight: 22
  when:
    age: [30, 64]
    location_tag: ashland
  text: |
    เฮลกาเจ้าของโรงเตี๊ยมเกวียนถ่านเป็นคนพูดขึ้นที่บ่อ นางย้ายมาจากคาร์ดินตั้งแต่ยังสาว เคยเห็นเวนทราสมาสองครั้ง นางว่าทุกแดนส่งเสียงไปเวนทราสได้ ฮอร์ดุนมีสภาตระกูล ป่าไอเลธมีคนปีนขึ้นชานนับ แดนเถ้ามีป้อม มีบริษัท มีบ่อน้ำเป็นร้อยบ่อ แต่ไม่มีใครพูดแทนบ่อน้ำสักบ่อ

    นางเสนอให้ทุกวงส่งก้อนหินมาหนึ่งก้อน แทนหนึ่งบ่อ กองรวมกันที่ทางแยกทางขนถ่าน แล้วเลือกคนหนึ่งคนถือจดหมายของทุกบ่อเดินไปเวนทราส ไปยืนหน้าห้องคนนับเตา ขอให้เขาจดว่าคนแดนเถ้ามีอยู่จริง

    คนแก่ที่สุดของวงถามคำถามเดียว จะให้เขาจดว่าอะไร คนที่นี่ไม่มีชื่อในสมุดเล่มไหน เรียกตัวเองว่าคนนอกบัญชีมาตั้งแต่ก่อนใครในวงจะเกิด จดลงไปแล้วก็ไม่นอกบัญชีอีก คำถามนั้นวนรอบขอบบ่อมาถึง{name}
  choices:
    - id: against_the_book
      label: พูดว่าคนที่หนีหน้ากระดาษมาอยู่ที่นี่ ไม่ควรเดินกลับไปขอให้ใครจดชื่อ
      text: |
        {name}พูดไม่ยาว คนครึ่งหมู่บ้านมาอยู่ที่นี่เพราะชื่อเคยอยู่ในสมุดเล่มหนึ่ง สมุดเล่มไหนก็มีหน้าท้ายเล่ม ไม่มีใครในวงแย้ง คนแก่ที่สุดไม่ชักถังขึ้นมา วงไม่ต้องตกลงอะไร

        เฮลกากลับโรงเตี๊ยมคนเดียว ที่ทางแยกทางขนถ่านมีก้อนหินอยู่ก้อนเดียว ก้อนที่นางวางเองตั้งแต่เช้า ตลอดหน้าหนาวก้อนนั้นวางอยู่ตรงนั้น ไม่มีใครเตะทิ้ง ไม่มีใครวางก้อนที่สองข้างๆ
      effects: { stats: { WIS: 1 }, flags: [spoke_against_being_written_down] }
    - id: keep_our_own_name
      label: เสนอให้จดตามที่คนที่นี่เรียกตัวเอง คนนอกบัญชี ไม่ต้องหาชื่อใหม่
      text: |
        บางคนหัวเราะ คนแก่ที่สุดไม่หัวเราะ นางว่าคนนับเตาจะได้รู้ว่ากำลังจดอะไรอยู่ วงเถียงกันอีกครึ่งบ่าย แล้วคนแก่ที่สุดก็ชักถังขึ้นมา จดหมายที่เฮลกาถือไปขึ้นต้นบรรทัดแรกว่า จากคนนอกบัญชีแห่งแดนเถ้า บ่อน้ำที่ส่งหินมาสิบเก้าบ่อ

        เฮลกากลับมาก่อนหน้าฝน นางเล่าว่าคนนับเตาอ่านบรรทัดแรกแล้ววางปากกา หาช่องในสมุดจะลงไม่เจอ สุดท้ายเขียนไว้ที่ขอบกระดาษ ตัวเล็ก ตั้งตรง
      effects: { stats: { INT: 1 }, flags: [named_us_the_people_outside_the_book] }
    - id: carry_the_letter
      label: รับเป็นคนถือจดหมายเดินไปเวนทราสเอง
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          ก้อนหินที่ทางแยกกองได้สิบเก้าก้อน {name}ขึ้นเกวียนถ่านไปเวนทราสพร้อมจดหมายสิบเก้าฉบับเย็บรวมเป็นเล่มเดียว หน้าห้องคนนับเตามีคนรอคิวยาวลงไปถึงบันไดนอกตึก {name}ยืนรอสามวัน วันที่สามเสมียนหนุ่มคนหนึ่งรับไปอ่าน อ่านทุกฉบับจนจบ แล้วลุกไปตามคนที่นั่งโต๊ะใหญ่กว่ามา

          ไม่มีใครรับปากอะไร แต่ก่อน{name}กลับ เสมียนหนุ่มคัดชื่อบ่อทั้งสิบเก้าบ่อลงในหน้าที่ยังว่างของสมุดเล่มหนึ่ง หัวกระดาษเขียนว่าแดนเถ้า ข้างใต้ยังเหลือที่ว่างอีกเกือบเต็มหน้า
        effects: { stats: { CHA: 1 }, reputation: { crown: 1 }, flags: [carried_the_ashland_letter_to_ventras] }
      failure:
        text: |
          {name}ยืนรอหน้าห้องคนนับเตาเก้าวัน ค่าห้องเช่ากับค่าข้าวกินเงินที่เตรียมไปจนหมด วันที่สิบเสมียนรับจดหมายไป เปิดฉบับแรก ถามว่าแดนเถ้าอยู่อำเภอไหน {name}บอกว่าไม่อยู่อำเภอไหน เสมียนพับจดหมายคืนใส่มือ{name}ทั้งเล่ม บอกว่าห้องนี้รับเรื่องเป็นอำเภอ

          {name}เอาจดหมายกลับมาวางคืนที่ทางแยกทางขนถ่าน บนกองหินสิบเก้าก้อน เอาก้อนบนสุดทับไว้ไม่ให้ลมพัด
        effects: { gold: -3, flags: [came_back_with_the_letter_unread] }
    - id: send_helga
      label: เสนอให้เฮลกาไปเอง คนที่เคยเห็นเวนทราสมาแล้วสองครั้ง
      text: |
        เฮลกาไม่ปฏิเสธ นางว่ารู้อยู่แล้วว่าคนพูดก่อนต้องเป็นคนเดิน ก้อนหินที่ทางแยกกองได้สิบเก้าก้อน นางขึ้นเกวียนถ่านไปพร้อมจดหมายสิบเก้าฉบับ ฝากโรงเตี๊ยมไว้ให้{name}ดูแลจนกว่าจะกลับ

        สองเดือนที่{name}ดูแลโรงเตี๊ยม คนขับเกวียนถ่านทุกเล่มถามเรื่องเดียวกัน เฮลกาไปไหน {name}ตอบทุกครั้งว่าไปเวนทราส ไปให้เขาจด บางคนหัวเราะ บางคนไม่ บางคนวางเหรียญเกินค่าเหล้าไว้บนโต๊ะหนึ่งเหรียญ บอกว่าฝากเป็นค่ารองเท้าของเฮลกา
      effects: { gold: 1, flags: [kept_helgas_inn_while_she_walked] }
