# ชุด 5 ค การปะทะครึ่งหลังของยุคดาวเร่ง 8 เรื่อง (ปี 361 ถึง 379)
# ทุกเรื่องเป็นการปะทะ ไม่มี choices ตัวเลขของศัตรูอยู่ใน content/foes.yaml
# ฝั่งจอมมาร (หมา ทหาร ควัน ภูต ผีถ่าน) ลังเลต่อหน้าคนมีตราเอง ระบบให้แต้มเอง ข้อความไม่บอกว่าเข้าหาทุกคนเท่ากัน
# ฝั่งดาว (ลูกของทะเลข้างบน ปูฝนเค็ม) ใส่ not_traits: [curse_brand] ไม่เห็นตัวเต็ม ไม่มีใครจับมือเปล่า
# ฉากของทุกวัย (ควันในซอย ภูตในเตา คนด้ายแดงที่ประตู ปูในบ่อ) deadly: false สองถึงสามจังหวะ มีวิธีที่คนแก่ทำได้ทุกจังหวะ
# ฉากที่เอาถึงตาย (ฝูงที่รั้ว แถวบนทางถ่าน ของที่มากับฝน) มีทางหนีทุกจังหวะ
# เกิดซ้ำได้สองเรื่อง (ควันในซอย ภูตในเตา) สร้างบนธรรมเนียมที่ทำกันทุกครั้ง ให้เงิน ไม่ให้ค่าพลัง

# ---------- ฝูงที่รั้ว ----------
- id: adult.enc_era_pack_at_the_fence
  stage: adult
  weight: 12
  time: night
  cast:
    pal: { bond: [friend], optional: true }
  when:
    age: [16, 64]
    year: [361, 379]
  text: |
    ตั้งแต่ปีป้อมสาม ถิ่นของ{name}ช่วยกันปักรั้วไม้รอบชายถิ่น สูงแค่อก กันอะไรไม่ได้จริง แต่ทำให้ทุกคนรู้ว่าขอบของถิ่นอยู่ตรงไหน เวรเฝ้ารั้วเวียนกันบ้านละคืน มีฆ้องหนึ่งใบ ส้อมฟางหนึ่งเล่ม กับคบไฟที่ต้องจุดเอง คืนนี้ถึงคราว{name}

    คอกแพะของหญิงม่ายท้ายถิ่นติดรั้วด้านตะวันออก เมื่อเช้ามีรอยเท้าขอบไหม้วนรอบคอกสามรอบ ไม่ได้เข้าไป แพะทั้งคอกไม่ยอมกินหญ้าทั้งวัน

    ใกล้เที่ยงคืน แพะร้องขึ้นพร้อมกัน แล้วหยุดพร้อมกัน นอกรั้วมีจุดแดงจุดหนึ่งสว่างขึ้นที่ระดับเข่า แล้วจุดที่สอง ที่สาม ที่สี่
  encounter:
    foe: ash_hound
    name: ฝูงหมาเถ้าที่รั้ว
    morale: 2
    beats:
      - text: ฝูงเดินเลียบรั้วด้านนอกช้าๆ ทีละตัว จมูกไล่ดมหลักไม้ทีละหลัก หลักที่โดนดมนานมีควันจางๆ ขึ้นตรงรอยจมูก ตัวหน้าหยุดที่หลักที่ผุที่สุด
        moves:
          - id: fence_gong
            label: ตีฆ้องเวรให้ทั้งถิ่นตื่น
            kind: item
            stat: CHA
            tags: [noise]
            success: เสียงฆ้องดังไปทั้งถิ่น ไฟในหน้าต่างติดขึ้นทีละบาน ฝูงหยุดดม หันหัวไปทางเสียงพร้อมกัน ตัวหน้าถอยออกจากหลักผุไปสองก้าว
          - id: fence_fork
            label: แทงส้อมฟางลอดช่องรั้วใส่ตัวหน้า
            kind: attack
            tags: [pierce]
          - id: fence_watch
            label: ยืนนิ่ง ดูว่าตัวไหนเป็นตัวนำ
            kind: read
            stat: WIS
          - id: fence_pal
            label: "ส่งเสียงเรียก{pal}ที่นอนอยู่บ้านใกล้รั้วที่สุด ให้ถือคบมายืนข้างกัน"
            kind: guard
            ally: pal
            success: "{pal}มาถึงในชุดนอน คบไฟในมือข้างหนึ่ง ขวานผ่าฟืนในอีกข้าง มายืนห่าง{name}สามก้าวโดยไม่ต้องบอก ฝูงเดินช้าลง ตัวหน้าหันไปดูคนที่รั้วทีละคน"
          - id: fence_back
            label: ถอยเข้าประตูถิ่น ลงไม้ขวาง
            kind: flee
      - text: ตัวหนึ่งกระโดดข้ามรั้วตรงมุมคอกแพะ ลงพื้นโดยไม่มีเสียง แพะทั้งคอกเบียดกันเข้ามุม ลูกแพะตัวหนึ่งหลุดออกมาอยู่กลางคอกตัวเดียว
        answer: quick
        moves:
          - id: fence_kid
            label: กระโจนเข้าคอก คว้าลูกแพะออกมา
            kind: quick
          - id: fence_chest
            label: เล็งส้อมฟางที่อก ตรงที่มีแสงแดงลอดหนังออกมา
            kind: attack
            tags: [pierce]
            success: ง่ามส้อมเข้าไปถึงแสงแดงในอก มีเสียงเหมือนถ่านแตกในเตา ตัวนั้นสะบัดหลุด กระโดดกลับข้ามรั้วไป ทิ้งเถ้าไว้เป็นทางบนหญ้า
          - id: fence_gate
            label: ยืนขวางประตูคอก ไม่ให้มันเข้าไปลึกกว่านั้น
            kind: guard
          - id: fence_out
            label: ทิ้งคอก ไปทางบ้านคนที่ใกล้ที่สุด
            kind: flee
      - text: ตัวนำมายืนนอกรั้วตรงหน้า{name} ห่างกันแค่หลักไม้ขวางกลาง แสงในอกของมันสว่างขึ้นช้าๆ ตามลมหายใจ ไอร้อนลอดช่องรั้วมาถึงหน้า
        answer: attack
        moves:
          - id: fence_thrust
            label: แทงสุดแขนลอดช่องรั้ว
            kind: attack
            tags: [pierce]
          - id: fence_stand
            label: ยืนให้มั่น ยกคบไว้ระหว่างกัน
            kind: guard
          - id: fence_shout
            label: ตะโกนใส่หน้ามันสุดเสียง
            kind: talk
            tags: [noise]
          - id: fence_run
            label: ถอยกลับไปทางประตูถิ่นทีละก้าว
            kind: flee
    win:
      text: |
        ตัวนำหันหลังก่อน ตัวอื่นตามไปทีละตัว ทิ้งรอยเท้าขอบไหม้เป็นแถวยาวไปทางทุ่งตะวันออก รุ่งเช้าคนทั้งถิ่นมายืนดูรอยที่รั้ว หลักไม้สามต้นดำเป็นรอยจมูก หญิงม่ายนับแพะได้ครบ แล้วนับซ้ำอีกรอบ

        บ่ายนั้นนางเอานมแพะมาให้{name}หนึ่งไห ตั้งแต่นั้นทุกคืนที่ถึงเวรของ{name} จะมีคนเอาฟืนมากองไว้ที่รั้วให้ก่อนค่ำ ไม่มีใครบอกว่าใคร
      effects: { stats: { CON: 1 }, flags: [drove_the_pack_from_the_fence] }
    lose:
      text: |
        {name}ฟื้นขึ้นมาบนเตียงของหญิงม่าย แขนกับขาพันผ้า กลิ่นขนไหม้ยังติดผม คนเฝ้าเวรบ้านอื่นมาทันตอนฝูงพังคอกไปครึ่งหนึ่ง

        แพะหายไปสามตัว หญิงม่ายไม่พูดถึงแพะเลย ป้อนซุปให้{name}ทีละช้อน
      effects: { flags: [fell_at_the_fence] }
    stalemate:
      text: |
        ฝูงวนอยู่นอกรั้วจนฟ้าเริ่มเทา แล้วจากไปพร้อมกันโดยไม่มีตัวไหนหันกลับมา ลูกแพะตัวหนึ่งหายไปจากคอก ไม่มีใครเห็นว่าตอนไหน

        คนเฝ้าเวรคืนถัดไปมาถึงตั้งแต่ก่อนค่ำ ถือส้อมฟางของตัวเองมา แล้วถาม{name}ว่าคืนนั้นฝูงมาทางไหน
      effects: { flags: [held_the_fence_till_dawn] }
    flee:
      text: |
        {name}ถอยเข้าประตูถิ่น ลงไม้ขวาง ตีฆ้องจนแขนล้า คนออกมาพร้อมคบไฟก็จริง แต่ไม่มีใครออกไปนอกรั้ว เช้าขึ้นมาคอกแพะท้ายถิ่นว่าง ประตูคอกปิดอยู่ ไม่มีรอยงัด

        หญิงม่ายยืนอยู่หน้าคอกว่างทั้งเช้า สัปดาห์ต่อมาชื่อของ{name}ย้ายไปอยู่เวรเฝ้าประตูถิ่น ไม่ใช่เวรเฝ้ารั้ว
      effects: { flags: [left_the_fence_to_the_pack] }

# ---------- แถวบนทางถ่าน ----------
- id: adult.enc_era_column_on_the_coal_road
  stage: adult
  weight: 12
  scene: road
  when:
    age: [16, 59]
    year: [361, 379]
  text: |
    ทางถ่านเป็นทางที่ทุกคนรู้ว่าแถวทหารเถ้าใช้เดิน และทุกคนก็ยังต้องใช้ เพราะไม่มีทางอื่นที่เกวียนผ่านได้ คนเดินทางถ่านจำกฎได้ข้อเดียว แถวไม่เหลียวมองอะไรที่อยู่ข้างทาง ของที่อยู่บนทางเป็นอีกเรื่อง

    เกวียนที่{name}คุมมาล้อหลังจมร่องโคลนครึ่งล้อ ล่อตัวเดียวดึงไม่ขึ้น ตอนนั้นเองพื้นเริ่มสั่นเป็นจังหวะ ไม่ใช่จังหวะเท้าคน หนักกว่า ช้ากว่า ที่ทางโค้งข้างหน้า หัวแถวโผล่ขึ้นมาในฝุ่นเถ้า เดินเรียงสี่ ตรงมาทางนี้
  encounter:
    foe: ash_soldier
    name: ทหารเถ้าริมแถว
    threat: 3
    morale: 2
    beats:
      - text: หัวแถวยังห่างราวร้อยก้าว ไม่เร่ง ไม่ช้า เกราะแผ่นซ้อนกันเสียดเป็นเสียงเดียวทั้งแถว ล่อดิ้นจนสายบังเหียนตึง
        moves:
          - id: column_heave
            label: เอาไหล่ดันท้ายเกวียนให้ล้อขึ้นจากร่อง
            kind: attack
          - id: column_traces
            label: ตัดสายเทียมปล่อยล่อ แล้วงัดเกวียนออกข้างทางเอง
            kind: quick
          - id: column_count
            label: ดูว่าแถวกินทางกว้างแค่ไหน ข้างทางเหลือที่ให้เกวียนหลบไหม
            kind: read
            stat: INT
            success: แถวเดินเรียงสี่พอดีกับหน้ากว้างของทางถ่าน ไม่เผื่อ ไม่ล้ำ ข้างทางฝั่งซ้ายเหลือที่พอดีกับล้อเกวียนหนึ่งข้าง {name}งัดล้อหน้าเบนไปทางนั้นได้ทันก่อนหัวแถวจะถึง
          - id: column_leave
            label: ทิ้งเกวียน ลงคูข้างทาง หมอบให้ต่ำ
            kind: flee
      - text: หัวแถวผ่านไปโดยไม่เหลียว แต่ทหารเถ้าตัวริมแถวตัวหนึ่งหยุดเดิน หันมาทั้งตัว ไม่ใช่หันแค่หัว ช่องตาบนหมวกเหล็กมีแสงแดงสองจุด ระหว่างมันกับท้ายเกวียนเหลือสามก้าว
        answer: guard
        moves:
          - id: column_spoke
            label: ดึงซี่ล้อสำรองใต้เกวียนมาเป็นกระบอง ฟาดที่รอยต่อเกราะ
            kind: attack
            tags: [blunt]
          - id: column_wall
            label: ยืนหลังกระบะเกวียน ให้ไม้กระบะรับแทน
            kind: guard
          - id: column_sack
            label: ผลักกระสอบบนเกวียนให้ร่วงลงขวางหน้ามัน
            kind: item
            stat: STR
          - id: column_ditch
            label: กลิ้งลงคูข้างทาง ปล่อยเกวียนไว้ตรงนั้น
            kind: flee
      - text: เกราะแผ่นหนึ่งที่ไหล่ของมันเผยอขึ้น เถ้าร้อนไหลออกมาเป็นสายเหมือนทรายจากกระสอบรั่ว มันยกแขนขึ้นช้าๆ ข้างหลังมัน แถวยังเดินต่อไม่หยุด ไม่มีตัวไหนรอ
        answer: attack
        moves:
          - id: column_crush
            label: ทุบซ้ำที่แผ่นเกราะที่เผยอ
            kind: attack
            tags: [blunt]
          - id: column_dodge
            label: ก้มลอดแขนมัน ไปอยู่อีกฝั่งของล้อ
            kind: quick
          - id: column_brace
            label: ยันไม้คานเกวียนรับแขนนั้นไว้
            kind: guard
          - id: column_last
            label: ทิ้งทุกอย่าง ถอยย้อนทางที่มา
            kind: flee
    win:
      text: |
        แผ่นเกราะหลุดลงพื้นทีละแผ่น เถ้าข้างในไหลออกมากองกลางทาง ร้อนจนโคลนรอบกองแห้งเป็นวง ท้ายแถวเดินผ่านไปโดยไม่มีตัวไหนเหลียวมอง เสียงเกราะเสียดกันเบาลงทีละน้อยจนหายไปทางตะวันตก

        {name}เก็บแผ่นเกราะขึ้นเกวียนได้สามแผ่น ร้อนจนต้องใช้กระสอบชุบน้ำรอง ป้อมของผู้เฝ้าผนึกรับซื้อแผ่นละเหรียญ ไม่ถามว่าได้มาอย่างไร
      effects: { stats: { STR: 1 }, gold: 3, flags: [broke_a_soldier_from_the_column] }
    lose:
      text: |
        {name}ฟื้นขึ้นในคูข้างทาง เสื้อไหม้เป็นรอยแขนพาดจากไหล่ถึงสะโพก แถวไปแล้ว ล้อหลังของเกวียนยังจมร่องอย่างเดิม ล่อยืนกินหญ้าข้างทางเหมือนไม่มีอะไรเกิดขึ้น

        คนขับเกวียนเกลือที่ผ่านมาตอนบ่ายช่วยยกล้อขึ้น เขาบอกว่าใครยืนบนทางถ่านตอนแถวมา แล้วยังได้นอนในคูแทนที่จะนอนใต้ล้อ ถือว่าโชคดี
      effects: { flags: [fell_before_the_column] }
    stalemate:
      text: |
        ทหารเถ้าตัวนั้นยืนอยู่ตรงนั้นจนท้ายแถวเดินผ่าน แล้วหันกลับ เดินตามแถวไปด้วยก้าวเท่าเดิม แผ่นเกราะที่ไหล่ยังเผยอ เถ้าร่วงเป็นทางตามหลังไปจนสุดสายตา

        เกวียนพังไปครึ่งคัน ของที่เหลือพอให้ส่งถึงปลายทาง {name}ลากล้อที่ยังดีกลับมาเองกับล่อ ใช้เวลาสองวัน
      effects: { gold: -1, flags: [stood_off_the_column] }
    flee:
      text: |
        {name}หมอบอยู่ในคูจนพื้นหยุดสั่น แถวเดินผ่านเกวียนไปทั้งแถว ไม่มีตัวไหนแตะ แต่ก็ไม่มีตัวไหนอ้อม เกวียนโดนเดินผ่านไปตรงกลาง

        ที่เหลือบนทางคือไม้กระบะไหม้เป็นแผ่น ล้อหนึ่งข้าง กับล่อที่สายเทียมขาด ยืนสั่นอยู่ข้างคูอีกฟาก
      effects: { gold: -2, flags: [left_the_cart_to_the_column] }

# ---------- ควันในซอย ----------
- id: adult.enc_era_smoke_in_the_lane
  stage: adult
  weight: 6
  once: false
  time: night
  cast:
    pal: { bond: [friend], optional: true }
  when:
    age: [16, 130]
    year: [361, 379]
  text: |
    ซอยของ{name}มีธรรมเนียมรับควันเดินแล้ว ใครเห็นก่อนเคาะหม้อสามที ทุกบ้านอัดกระสอบชุบน้ำใต้ประตู ปิดบานเกล็ด วางถังน้ำไว้ใต้หน้าต่าง เด็กทั้งซอยไปนอนรวมกันชั้นบนของบ้านช่างไม้กลางซอย ผู้ใหญ่ผลัดกันเฝ้าข้างล่างบ้านละคืน และทุกครั้งต้องมีคนหนึ่งกลับไปตามแมวของยายบ้านหัวซอย

    คืนนี้เวรเฝ้าบ้านช่างไม้เป็นของ{name} เสียงหม้อดังมาสามที ควันมาจากปลายซอย ต่ำ ช้า สูงไม่ถึงเข่า เลียพื้นมาทีละบ้าน ตรงไหนที่มันผ่าน ฝุ่นบนพื้นเป็นรอยเหมือนมีคนลากผ้าเปียกผ่าน
  encounter:
    foe: walking_smoke
    threat: 2
    morale: 2
    deadly: false
    beats:
      - text: ควันมาถึงธรณีบ้านช่างไม้ หยุดอยู่ตรงนั้นพักหนึ่ง แล้วเริ่มดันตัวเข้ามาใต้ประตูทีละนิด ช้าเหมือนน้ำซึมเข้ารองเท้า กระสอบเปียกใต้ประตูเริ่มมีไอขึ้น
        moves:
          - id: smoke_sack
            label: ราดน้ำจากถังลงบนกระสอบใต้ประตูอีกรอบ
            kind: item
            stat: WIS
            tags: [water]
          - id: smoke_hold
            label: เอาหลังพิงประตูไว้ เอาผ้าเปียกปิดจมูก
            kind: guard
          - id: smoke_pot
            label: เคาะหม้อต่อให้บ้านถัดไปรู้ว่าควันอยู่ตรงนี้
            kind: item
            stat: CHA
            tags: [noise]
          - id: smoke_pal
            label: "ตะโกนข้ามซอยให้{pal}ส่งถังน้ำข้ามมาทางหน้าต่าง"
            kind: item
            stat: CHA
            ally: pal
            tags: [water]
            success: "{pal}ยื่นถังข้ามช่องหน้าต่างมาสองถัง แล้วยื่นถังที่สามมาก่อนจะมีใครขอ น้ำสามถังลงบนธรณีพร้อมกัน ควันตรงนั้นหนักจนเลื้อยต่อไม่ไหว"
          - id: smoke_up
            label: ขึ้นไปอยู่ชั้นบนกับเด็กๆ ปิดประตูหัวบันได
            kind: flee
      - text: ควันส่วนหนึ่งลอดเข้ามาได้ ลอยต่ำเลียพื้นห้องตรงไปทางเตา เตาที่เพิ่งดับยังอุ่น ควันขดตัวรอบขาเตาเหมือนแมวพันขาคน
        answer: item
        moves:
          - id: smoke_hearth
            label: ตักน้ำจากโอ่งราดลงเตาทีละขัน จนเตาเย็น
            kind: item
            stat: CON
            tags: [water]
          - id: smoke_low
            label: ก้มต่ำ ผ้าเปียกปิดปาก ค่อยๆ ไปเปิดประตูหลังให้ลมพัดผ่าน
            kind: guard
          - id: smoke_look
            label: ดูให้ออกว่าตรงไหนของควันหนาที่สุด
            kind: read
            stat: WIS
            success: ควันทั้งก้อนบางเท่ากันหมด ยกเว้นตรงกลางขด มีปมสีเข้มขนาดกำปั้น ขยับช้ากว่าส่วนอื่น {name}เทน้ำขันต่อไปลงตรงนั้น
          - id: smoke_up2
            label: ขึ้นบันไดไปอยู่กับเด็กๆ
            kind: flee
      - text: ควันที่เหลือเริ่มไต่ขึ้นตามผนัง หาทางออกทางปล่องเตาหรือทางบันได ทางไหนก็ได้ที่อุ่นกว่า ข้างบนมีเสียงเด็กไอ
        moves:
          - id: smoke_rag
            label: เอาผ้าห่มชุบน้ำโยนคลุมทั้งก้อน
            kind: item
            stat: DEX
            tags: [water]
          - id: smoke_stair
            label: ยืนขวางตีนบันได ไม่ให้มันขึ้น
            kind: guard
          - id: smoke_flap
            label: โบกผ้าเปียกไล่ไปทางประตูหลังที่เปิดไว้
            kind: quick
          - id: smoke_up3
            label: ขึ้นไปอุดช่องประตูชั้นบน อยู่กับเด็กๆ จนสาง
            kind: flee
    win:
      text: |
        ควันหนักน้ำจนยืนไม่ได้ ทรุดลงเป็นโคลนสีเทาบนพื้นห้อง เหม็นเหมือนเตาที่โดนฝน เด็กๆ ลงบันไดมาดูทีละคน คนเล็กเอานิ้วจิ้มโคลน พี่สาวตีมือ

        เช้าขึ้นมา บ้านที่ควันจมเป็นโคลนในบ้านได้ค่าล้างพื้นจากกระปุกกลางซอยสองเหรียญ ไม่มีใครจำได้ว่าธรรมเนียมนี้เริ่มเมื่อไร ช่างไม้แบ่งให้คนเฝ้าเวรทั้งสองเหรียญ ยายบ้านหัวซอยได้แมวคืน
      effects: { gold: 2, flags: [soaked_the_lane_smoke] }
    lose:
      text: |
        {name}ไอจนต้องคุกเข่า ตาลายจนมองไม่เห็นประตู คนบ้านติดกันพังบานเกล็ดเข้ามาลากออกไปนอนกลางซอย ควันออกจากบ้านทางหน้าต่างที่พังนั่นเอง แล้วเลียพื้นต่อไปทางท้ายซอย

        เช้านั้นคนทั้งซอยช่วยกันซ่อมบานเกล็ดให้ช่างไม้ ยายบ้านหัวซอยเอาน้ำผึ้งผสมน้ำอุ่นมาให้{name}จิบ บอกว่าดีกับคอ แมวของนางนอนอยู่บนตักนาง
      effects: { flags: [choked_on_the_lane_smoke] }
    stalemate:
      text: |
        ควันอยู่ในห้องจนฟ้าสาง แล้วถอยออกทางใต้ประตูเหมือนตอนเข้ามา ไปบ้านถัดไป ทิ้งกลิ่นเขม่าไว้บนทุกอย่าง ผ้าห่ม ขนมปัง ผมเด็ก

        ขนมปังที่{name}ห่อมากินระหว่างเฝ้ากินไม่ได้ทั้งห่อ ผ้าที่ใส่มาต้องซักสองน้ำ บ้านถัดไปเคาะหม้อสามทีตอนรุ่งสาง เสียงเดียวกับที่ได้ยินมาทุกเดือน
      effects: { gold: -1, flags: [sat_out_the_lane_smoke] }
    flee:
      text: |
        {name}ขึ้นไปนั่งชั้นบนกับเด็กๆ อัดผ้าเปียกใต้ประตูหัวบันได เล่านิทานให้ฟังจนเด็กหลับหมด ข้างล่างไม่มีเสียงอะไร นอกจากเสียงน้ำในโอ่งเดือดขึ้นเองครั้งหนึ่งตอนดึก

        เช้าขึ้นมาควันไปแล้ว ทิ้งเขม่าบางๆ เป็นรอยลากยาวจากประตูหน้าถึงเตา ช่างไม้ต้องขัดพื้นทั้งเช้า ไม่ได้บ่นสักคำ แต่ไม่ได้ชวน{name}กินข้าวเช้าด้วย
      effects: { gold: -1, flags: [hid_upstairs_from_the_smoke] }

# ---------- ภูตในเตา ----------
- id: adult.enc_era_in_the_stove
  stage: adult
  weight: 6
  once: false
  time: night
  when:
    age: [16, 130]
    year: [361, 379]
  text: |
    ถ่านแพงขึ้นทุกปีจนทุกบ้านซื้อทีละครึ่งกระสอบ เทเก็บในหีบมีกุญแจ และนับก้อนก่อนนอน ครึ่งกระสอบที่{name}ซื้อมาเมื่อวานจากร้านหัวถิ่นราคาเท่าค่าแรงหลายวัน

    คืนนี้เตาในที่อยู่ของ{name}ไม่ได้ติดไฟ แต่มีเสียงกรอบแกรบเหมือนคนเคี้ยวขนมปังแข็ง ฝาเตากระดิกสองที ในช่องเตามีแสงส้มดวงเล็กสองดวง ถ่านในหีบที่นับไว้ก่อนนอนหายไปสามก้อน หีบยังล็อกอยู่
  encounter:
    foe: chimney_imp
    name: ภูตปล่องในเตา
    deadly: false
    beats:
      - text: ภูตปล่องตัวเท่าแมวหมอบอยู่ในช่องเตา กอดถ่านไว้สองมือ กินทีละคำ ทุกคำมีประกายลอดออกมาจากซอกฟัน ตาสองดวงจ้องมาที่ตะเกียงในมือ{name}
        moves:
          - id: stove_kettle
            label: เทน้ำในกาลงช่องเตาทั้งกา
            kind: item
            stat: DEX
            tags: [water]
            success: น้ำในกาลงไปเต็มตัว ภูตปล่องร้องเสียงแหลมเหมือนกาน้ำเดือด ทิ้งก้อนถ่านที่กอดอยู่ ตัวมีไอขาวขึ้นทั้งตัว ถอยไปเกาะผนังเตาด้านใน
          - id: stove_lid
            label: ปิดฝาเตา เอาเหล็กเขี่ยไฟขัดหูฝาไว้
            kind: guard
          - id: stove_watch
            label: นั่งลงดูเงียบๆ ว่ามันกินก้อนไหนก่อน
            kind: read
            stat: WIS
            success: มันเลือกก้อนที่ดำสนิทก่อนทุกครั้ง ก้อนที่มีขี้เถ้าเกาะมันเขี่ยทิ้ง {name}เห็นแล้วว่ามันไม่ได้กินเพราะหิว มันเลือกกิน
          - id: stove_dung
            label: โยนก้อนมูลวัวแห้งเข้าไปแทน ให้มันกินของถูก
            kind: item
            stat: CHA
            tags: [bait]
      - text: ภูตปล่องแลบลิ้นสีถ่านคุออกมาเลียขอบเตา ตะแกรงเหล็กเริ่มแดง มันกำลังจะจุดเตาด้วยตัวของมันเอง
        answer: item
        moves:
          - id: stove_jar
            label: ตักน้ำจากโอ่งข้างเตาราดทีละขัน
            kind: item
            stat: CON
            tags: [water]
          - id: stove_apron
            label: เอาผ้ากันเปื้อนชุบน้ำคลุมปากเตา
            kind: item
            stat: DEX
            tags: [water]
          - id: stove_poker
            label: เอาเหล็กเขี่ยไฟกระทุ้งมันออกจากตะแกรง
            kind: attack
          - id: stove_out
            label: ออกไปขอนอนบ้านเพื่อนบ้าน ปล่อยมันไว้กับเตา
            kind: flee
      - text: มันอมถ่านก้อนสุดท้ายไว้ในปาก ปีนขึ้นทางท่อปล่อง เขม่าร่วงลงมาเป็นสาย
        moves:
          - id: stove_tongs
            label: คว้าหางมันด้วยคีมคีบถ่าน
            kind: quick
          - id: stove_splash
            label: สาดน้ำที่เหลือก้นถังขึ้นไปตามท่อ
            kind: item
            stat: DEX
            tags: [water]
          - id: stove_shout
            label: ตะโกนให้มันคายถ่านคืน
            kind: talk
            tags: [noise]
    win:
      text: |
        ภูตปล่องคายก้อนถ่านทิ้งแล้วหายขึ้นปล่องไป ทิ้งเขม่ากองหนึ่งไว้บนตะแกรง สีน้ำตาลแดง ไม่เหมือนเขม่าเตาทั่วไป {name}กวาดใส่ห่อกระดาษไว้

        ร้านถ่านหัวถิ่นมีธรรมเนียมใหม่ตั้งแต่ถ่านแพง ใครเอาเขม่าภูตมาให้ดู ร้านคืนค่าถ่านที่โดนกินให้ครึ่งหนึ่ง เพราะร้านรู้ว่าภูตมากับกระสอบ ไม่ได้มาทางปล่อง เจ้าของร้านดมเขม่า นับเหรียญคืนให้ แล้วถามว่ากระสอบไหน
      effects: { gold: 2, flags: [chased_the_imp_from_the_dear_coal] }
    lose:
      text: |
        ภูตปล่องพ่นเปลวไฟเล็กๆ ใส่มือ{name}ตอนเอื้อมเข้าไป แล้วกินถ่านจนหมดหีบอย่างไม่รีบ ก่อนรุ่งมันขึ้นปล่องไปเองเหมือนแขกที่อิ่มแล้ว

        หลังมือ{name}พองเป็นแนวยาวเท่านิ้ว หีบถ่านว่างจนเห็นก้น ทั้งสัปดาห์นั้นต้องต้มน้ำด้วยกิ่งไม้แห้งที่เก็บจากข้างทาง
      effects: { gold: -2, flags: [lost_the_dear_coal_to_an_imp] }
    stalemate:
      text: |
        จนตะเกียงหมดน้ำมัน ภูตปล่องก็ยังอยู่ในเตา แต่ไม่กินแล้ว หมอบหลับอยู่บนก้อนถ่านที่เหลือเหมือนแมวบนหมอน เตาอุ่นทั้งคืนโดยไม่ต้องจุด

        เช้าขึ้นมามันไปแล้ว ถ่านในหีบหายไปครึ่งหนึ่ง ข้าวต้มเช้านั้นสุกเร็วกว่าทุกวัน
      effects: { gold: -1, flags: [shared_the_stove_with_an_imp] }
    flee:
      text: |
        {name}ไปขอนอนบ้านเพื่อนบ้าน เพื่อนบ้านไม่ถามเหตุผล ปูเสื่อให้ข้างเตาของตัวเอง ตอนดึกได้ยินเสียงฝาเตาของ{name}กระดิกเป็นจังหวะมาตามลม

        เช้าขึ้นมาหีบถ่านว่าง กุญแจยังล็อก ข้างในเหลือแต่ฝุ่นถ่านกับรอยเท้าเล็กๆ วนเป็นวงกลม
      effects: { gold: -2, flags: [left_the_stove_to_an_imp] }

# ---------- โรงหลอมวันเตาเย็น ----------
- id: adult.enc_era_cold_forge
  stage: adult
  weight: 12
  scene: smithy
  time: night
  when:
    age: [16, 64]
    year: [361, 379]
    location_tag: [kardin, hordun]
  text: |
    ตั้งแต่ถ่านแพงเป็นสามเท่า โรงหลอมทุกโรงมีวันเย็นของตัวเอง ผลัดกันดับเตาคนละวัน คนเรียกวันนั้นว่าวันเตาเย็น โรงที่เตาเย็นไม่มีใครอยู่ ของมีค่าหายง่าย นายโรงจึงจ้างคนนอกมานั่งเฝ้าคืนละเหรียญ คืนนี้{name}รับจ้าง

    โรงหลอมที่ไม่มีไฟเย็นกว่าข้างนอก ทั่งเหล็กเย็นจนแตะแล้วนิ้วชา รางน้ำชุบเหล็กข้างเตามีน้ำเต็ม ผิวน้ำนิ่ง ตอนดึก กองเถ้าในเตาใหญ่ขยับ ไม่มีลมสักนิด
  encounter:
    foe: coal_ghost
    beats:
      - text: เถ้าในเตาค่อยๆ ก่อตัวขึ้นเป็นรูปคนนั่งยองๆ ไหล่กว้าง หัวก้ม ตรงที่ควรเป็นตามีถ่านคุอยู่ดวงเดียว มันยกมือเถ้าขึ้นแตะขอบเตา เหมือนคนจำบ้านตัวเองได้
        moves:
          - id: forge_trough
            label: วักน้ำจากรางชุบเหล็กสาดใส่
            kind: item
            stat: DEX
            tags: [water]
          - id: forge_anvil
            label: ถอยไปอยู่หลังทั่ง ให้ทั่งอยู่ตรงกลาง
            kind: guard
          - id: forge_watch
            label: ยืนนิ่ง ดูว่ามันมองหาอะไร
            kind: read
            stat: WIS
            success: ถ่านที่ตาของมันไม่ได้หันมาทาง{name}เลย หันไปทางกระสอบถ่านที่มุมโรง แล้วหันไปทางที่สูบลม {name}รู้แล้วว่ามันจะไปทางไหนก่อน
          - id: forge_hammer
            label: คว้าค้อนจากราวฟาดลงกลางตัว
            kind: attack
            tags: [blunt]
          - id: forge_door
            label: ออกไปยืนข้างนอก ปิดประตูโรงไว้
            kind: flee
      - text: ผีถ่านลุกขึ้นยืน ลากเท้าเถ้าไปทางที่สูบลม มือข้างหนึ่งจับด้ามที่สูบไว้แล้ว ถ้าลมเข้าเตา ไฟจะติดทั้งเตา
        answer: quick
        moves:
          - id: forge_bellows
            label: คว้าด้ามที่สูบลมอีกข้างไว้ก่อน
            kind: quick
          - id: forge_bucket
            label: จ้วงถังลงรางน้ำ สาดเต็มแรงที่มือมัน
            kind: item
            stat: STR
            tags: [water]
          - id: forge_damper
            label: ดึงโซ่ปิดช่องลมของเตาลง
            kind: item
            stat: INT
          - id: forge_door2
            label: ออกไปเรียกยามย่าน
            kind: flee
      - text: ตัวของมันเริ่มหลุดเป็นก้อน เถ้าเปียกร่วงลงพื้น แต่ถ่านที่ตายังคุอยู่ และมันกำลังทรุดกลับลงไปหาเถ้ากองเดิมในเตา
        moves:
          - id: forge_quench
            label: ใช้คีมคีบถ่านที่ตามันจุ่มลงรางน้ำ
            kind: quick
          - id: forge_pour
            label: ยกถังน้ำเทลงเตาใหญ่ทั้งถัง
            kind: item
            stat: STR
            tags: [water]
          - id: forge_block
            label: ยืนขวางปากเตา ไม่ให้มันกลับลงไป
            kind: guard
    win:
      text: |
        ถ่านดวงสุดท้ายลงรางน้ำ ร้องฉ่าเหมือนเหล็กชุบ ทั้งตัวของผีถ่านทรุดลงเป็นโคลนเถ้า เลอะตั้งแต่ปากเตาถึงรางน้ำ โรงหลอมเย็นเหมือนเดิม แต่ไม่ได้เย็นแบบเดียวกับตอนหัวค่ำ

        นายโรงมาถึงตอนสาง ดูโคลนบนพื้น แล้วจ่ายให้สามเหรียญแทนหนึ่ง เขาบอกว่าวันเตาเย็นคราวหน้าจะจ้าง{name}ก่อนใคร และจะเติมน้ำในรางให้เต็มกว่านี้
      effects: { stats: { WIS: 1 }, gold: 3, flags: [quenched_the_cold_forge_ghost] }
    lose:
      text: |
        {name}ฟื้นขึ้นมาบนพื้นโรงหลอม ไหล่แสบเป็นรอยมือเถ้า ล้างสามน้ำกว่าจะออก เตาใหญ่ติดไฟอยู่ ไฟอ่อนๆ ที่ไม่มีใครจุด ถ่านหายไปจากกระสอบที่มุมโรงครึ่งกระสอบ

        นายโรงมาถึงตอนสาง ดับไฟเองด้วยมือที่ชินงาน ไม่จ่ายค่าเฝ้าคืนนั้น บอกว่าถ่านครึ่งกระสอบแพงกว่าค่าเฝ้าหลายคืน
      effects: { flags: [lost_the_cold_forge_to_a_ghost] }
    stalemate:
      text: |
        ผีถ่านกลับลงไปเป็นกองเถ้าในเตาก่อนฟ้าสาง กองนั้นสูงกว่าตอนหัวค่ำนิดหนึ่ง ถ่านที่ตามองไม่เห็นแล้ว

        นายโรงฟังเรื่องทั้งหมดโดยไม่แปลกใจ จ่ายค่าจ้างหนึ่งเหรียญ บอกว่าเตาของเขามีของแบบนี้ทุกวันเตาเย็น ที่เขาจ้างคนเฝ้าก็เพราะอย่างนี้ ไม่ใช่เพราะขโมย
      effects: { gold: 1, flags: [sat_the_cold_forge_with_a_ghost] }
    flee:
      text: |
        {name}ยืนอยู่หน้าประตูโรงทั้งคืน ข้างในมีเสียงที่สูบลมเป่าเป็นจังหวะช้าๆ เหมือนคนหายใจตอนหลับ แสงส้มลอดร่องประตูออกมาแล้วหรี่ลง

        นายโรงมาตอนสาง เปิดประตู เตาใหญ่อุ่น ถ่านในกระสอบหายไปครึ่ง เขาไม่จ่ายค่าเฝ้า แต่ก็ไม่ได้ทวงค่าถ่าน
      effects: { flags: [left_the_cold_forge] }

# ---------- ถ่านสำหรับประตูนี้ ----------
- id: adult.enc_era_a_coal_for_your_door
  stage: adult
  weight: 12
  time: dusk
  cast:
    pal: { bond: [friend], optional: true }
  when:
    age: [16, 130]
    year: [362, 379]
    not_flags: [set_a_door_coal]
  text: |
    คนผูกด้ายแดงสามคนมาหยุดหน้าที่อยู่ของ{name}ตอนพลบ คนนำเป็นชายสูงวัย หนวดเรียบ สวมถุงมือผ้าเก่าข้างเดียว มืออีกข้างประคองผ้าห่อก้อนกลม คนที่สองถือชามเหล็กใส่ถ่านคุ คนที่สามเป็นหญิงร่างเล็ก ยืนอยู่ที่ประตูรั้ว ไม่ได้ถืออะไร

    ชายสูงวัยบอกอย่างสุภาพว่าประตูในละแวกนี้มีถ่านกันเกือบครบแล้ว เหลือไม่กี่ประตู ประตูนี้เป็นหนึ่งในนั้น วงที่มีรูไม่ใช่วง เจ้าของบ้านไม่ชอบ เขาไม่ได้มาขอให้{name}วางเอง มือของเขาอุ่นอยู่แล้ว เขาจะวางให้ ไม่คิดอะไร

    {name}ไม่ได้ขอ คนทั้งละแวกรู้ว่า{name}ไม่ได้ขอ
  encounter:
    foe: ash_cultist
    name: คนด้ายแดงสามคน
    morale: 2
    deadly: false
    beats:
      - text: ชายสูงวัยก้าวขึ้นบันไดหน้าบ้านมาหนึ่งขั้น คลี่ผ้าออก ถ่านก้อนเท่ากำปั้นเด็กแดงอยู่บนผ้า คนถือชามยืนชิดหลังเขา ไอร้อนจากชามลอยมาถึงหน้า{name}
        moves:
          - id: coal_step
            label: ก้าวออกไปยืนบนธรณีเสียเอง ไม่ให้เหลือที่ว่างให้วาง
            kind: guard
          - id: coal_jar
            label: ตักน้ำจากโอ่งข้างประตูสาดใส่ชามไฟ
            kind: item
            stat: DEX
            tags: [water]
            success: น้ำลงชามเต็มๆ ถ่านในชามร้องฉ่า ไอขึ้นเป็นก้อน คนถือชามยืนงงอยู่กับชามที่ดับ เหมือนคนเพิ่งตื่นนอนแล้วจำไม่ได้ว่าอยู่บ้านใคร
          - id: coal_ask
            label: ถามเขาตรงๆ ว่าต้องทำอย่างไรเขาถึงจะกลับไป
            kind: talk
            parley: true
          - id: coal_who
            label: ดูว่าในสามคนนี้ใครเป็นคนสั่งจริง
            kind: read
            stat: WIS
            success: ชายสูงวัยเป็นคนพูด แต่ก่อนพูดทุกครั้งเขาเหลือบไปที่หญิงร่างเล็กที่ประตูรั้ว ด้ายแดงที่ข้อมือของนางพันห้ารอบ ไม่ใช่สามรอบเหมือนคนอื่น
          - id: coal_pal
            label: "เรียก{pal}จากบ้านใกล้ๆ มายืนบนธรณีด้วยกัน"
            kind: guard
            ally: pal
            success: "{pal}มาถึงทั้งผ้ากันเปื้อนที่ยังไม่ได้ถอด มายืนข้าง{name}บนธรณีแคบๆ จนไหล่ชนกัน ชายสูงวัยดูคนสองคนบนธรณี แล้วถอยลงบันไดไปหนึ่งขั้น"
          - id: coal_inside
            label: ถอยเข้าบ้าน ลงกลอน
            kind: flee
      - text: ชายสูงวัยก้มลง จะวางถ่านลงบนธรณีด้วยมือของเขาเอง ช้าๆ เหมือนวางไข่ลงรัง
        answer: quick
        moves:
          - id: coal_foot
            label: วางเท้าลงบนธรณีก่อนมือเขาจะถึง
            kind: quick
          - id: coal_wet
            label: เทน้ำจากกาที่ถืออยู่ราดธรณีจนเปียกโชก
            kind: item
            stat: DEX
            tags: [water]
          - id: coal_say
            label: บอกเขาว่าบ้านที่ไม่ได้เปิดประตูให้ ไม่ใช่บ้านที่ใครจะมาวางอะไรได้
            kind: talk
          - id: coal_brace
            label: ยืนขวางประตูไว้ทั้งตัว
            kind: guard
      - text: หญิงร่างเล็กที่ประตูรั้วพูดขึ้นเป็นครั้งแรก เสียงเบาจน{name}ต้องตั้งใจฟัง นางบอกว่าฝูงจะผ่านละแวกนี้ในหน้าหนาว ไม่ว่าประตูนี้จะมีอะไรวางอยู่หรือไม่ ชามไฟในมือคนที่สองสว่างขึ้นอีกครั้ง
        moves:
          - id: coal_douse
            label: สาดน้ำที่เหลือก้นถังใส่ชามไฟ
            kind: item
            stat: DEX
            tags: [water]
          - id: coal_answer
            label: ตอบนางว่าถ้าฝูงมา บ้านนี้จะรับเอง
            kind: talk
            parley: true
          - id: coal_hold
            label: ยืนบนธรณีไม่ขยับ
            kind: guard
          - id: coal_inside2
            label: ถอยเข้าบ้าน ปิดประตู
            kind: flee
    win:
      text: |
        ชามไฟดับ ถ่านในผ้ายังอุ่นอยู่ในมือของชายสูงวัย เขาห่อกลับอย่างเดิม ไม่โกรธ หญิงร่างเล็กหันหลังเดินไปก่อน อีกสองคนตามไป ชายสูงวัยหยุดที่รั้ว บอกว่าประตูที่ไม่เปิดก็ยังเป็นประตู เขาจะจำไว้

        เพื่อนบ้านทักทาย{name}เหมือนทุกวัน มีคนหนึ่งถามว่าไม่กลัวหรือ หน้าหนาวนั้นเวลาได้ยินเสียงหอน {name}นอนหันหน้าไปทางประตู
      effects: { stats: { WIS: 1 }, reputation: { ash_cult: -1 }, flags: [refused_a_coal_at_the_door] }
    lose:
      text: |
        ไอร้อนจากชามไฟพุ่งใส่แขน{name}ตอนเอื้อมไปปัดมือเขา {name}ล้มนั่งลงบนบันได ชายสูงวัยรอจนแน่ใจว่า{name}ไม่เป็นอะไรมาก แล้ววางถ่านลงบนธรณีด้วยมือของเขาเอง

        ถ่านก้อนนั้นอยู่ที่ธรณีตั้งแต่คืนนั้น ไม่มีใครในบ้านเป็นคนวาง ไม่มีฝ่ามือในบ้านนี้ที่อุ่นขึ้น แต่คนทั้งละแวกเห็นว่าประตูนี้มีถ่านแล้ว ชายสูงวัยเดินผ่านทุกวันตลาด มือข้างที่วางพันผ้าหนาขึ้นทุกครั้ง
      effects: { flags: [a_coal_set_on_my_step] }
    stalemate:
      text: |
        ฟ้ามืดสนิท ชามไฟเป็นแสงเดียวหน้าบ้าน ชายสูงวัยมองธรณีที่{name}ยังยืนขวางอยู่ แล้วถอยออกไป วางถ่านก้อนนั้นไว้บนหัวเสารั้วแทน ข้างนอกประตูรั้ว ไม่ใช่ในบ้าน

        ไม่มีใครในละแวกกล้าหยิบลง หิมะแรกของปีตกลงมา ละลายเป็นวงอยู่บนหัวเสาต้นเดียวในทั้งแถว
      effects: { flags: [a_coal_left_on_my_gatepost] }
    parley:
      text: |
        ชายสูงวัยหันไปทางหญิงร่างเล็กที่ประตูรั้ว นางยกมือขึ้นครั้งเดียว เขาห่อถ่านกลับ แล้ววางถ่านอีกก้อนลงบนบันไดขั้นล่างสุด ก้อนเล็ก ดำ เย็นสนิท ถ่านก้อนเดียวบนบันไดคือคำเชิญ เขาบอก ไม่ใช่ถ่านเฝ้าประตู หม้อซุปตั้งอยู่ท้ายตลาดทุกวัน จะมาเมื่อไรก็ได้ หรือไม่มาก็ได้

        {name}ใช้คีมคีบถ่านเย็นก้อนนั้นไปทิ้งลงลำธารในวันรุ่งขึ้น สามวันต่อมามีถ่านเย็นอีกก้อนวางอยู่บนบันไดขั้นเดิม ก้อนเท่ากัน
      effects: { reputation: { ash_cult: 1 }, flags: [was_invited_to_the_red_thread_pot] }
    flee:
      text: |
        {name}ลงกลอนประตู ได้ยินเสียงฝีเท้าบนบันไดหน้าบ้านขึ้นมาหนึ่งขั้น หยุด แล้วลงไป ไม่มีใครเคาะ

        เช้าขึ้นมาถ่านก้อนเท่ากำปั้นเด็กวางอยู่บนธรณี ตรงกลางพอดี ไม่มีใครในบ้านเป็นคนวาง ไม่มีฝ่ามือไหนในบ้านอุ่นขึ้น แต่ถ้าจะยกออกไป ก็ต้องมีคนในบ้านเป็นคนจับ
      effects: { flags: [a_coal_set_on_my_step] }

# ---------- ของที่มากับฝน ----------
- id: adult.enc_era_fell_with_the_rain
  stage: adult
  weight: 12
  time: night
  when:
    age: [16, 64]
    year: [367, 379]
    not_traits: [curse_brand]
  text: |
    ฝนเค็มหยุดตอนหัวค่ำ ทุกบ้านเปิดฝาโอ่งได้แล้ว ตอนเอาถังไปเทน้ำทิ้งหลังที่อยู่ {name}ได้ยินเสียงเปียกๆ จากกองฟางข้างรั้ว เสียงเหมือนคนบิดผ้าขี้ริ้ว แต่ไม่มีใครบิด

    หมาของบ้านข้างๆ ยืนอยู่อีกฟากรั้ว ไม่เห่า ขนหลังตั้ง ถอยหลังทีละก้าว กองฟางขยับ ฟางที่ผิวนอกมีเกล็ดเกลือเกาะเป็นแนว ตรงกลางกองมีไออุ่นลอยขึ้น ในคืนที่หนาวจนเห็นลมหายใจตัวเอง
  encounter:
    foe: sky_spawn
    name: ของที่มากับฝน
    morale: 2
    beats:
      - text: ของในกองฟางเลื่อนออกมาทางแสงตะเกียง เห็นแค่ส่วนเดียว เส้นเปียกยาวเส้นหนึ่ง สีเหมือนน้ำทะเลตอนพลบ หนาเท่าข้อมือ ปลายของมันเอียงไปทางมือที่ถือตะเกียง แล้วเอียงไปทางหมา ไปทางไหนก็ได้ที่อุ่นกว่า
        moves:
          - id: rain_brick
            label: คว้าอิฐอุ่นที่วางรองหม้อหลังเตา โยนไปอีกทาง
            kind: item
            stat: DEX
            tags: [bait]
            success: อิฐที่ยังอุ่นจากเตาตกลงกลางลาน เส้นเปียกนั้นเลี้ยวตามไปทันที รัดอิฐไว้แน่นจนเกลือบนตัวมันแตกเป็นเกล็ด {name}ได้ระยะห่างคืนมาสามก้าว
          - id: rain_lamp
            label: ยื่นเปลวตะเกียงเข้าไปใกล้ ให้มันเจอไฟก่อนเจอมือ
            kind: item
            stat: WIS
            tags: [fire]
          - id: rain_fork
            label: แทงด้วยส้อมฟาง
            kind: attack
            tags: [pierce]
          - id: rain_look
            label: ถือตะเกียงนิ่ง ดูว่าส่วนที่เหลืออยู่ตรงไหน
            kind: read
            stat: INT
            success: ส่วนที่โผล่ออกมามีเส้นเดียว แต่ฟางทั้งกองขยับเป็นจังหวะเดียวกัน {name}เห็นว่ามันไม่ได้ซ่อนอยู่ในกองฟาง กองฟางทั้งกองคือที่ที่มันพันตัวอยู่ และตรงกลางอุ่นที่สุด
          - id: rain_back
            label: ถอยเข้าบ้าน ปิดประตู ไม่หันหลังให้
            kind: flee
      - text: เส้นเปียกอีกเส้นออกมาจากใต้กองฟางโดยไม่มีเสียง พันรอบข้อเท้า{name}แล้ว อุ่นเท่าตัวคน รัดขึ้นมาทีละรอบ
        answer: item
        moves:
          - id: rain_torch
            label: กดตะเกียงลงบนเส้นที่รัดข้อเท้า ให้ไฟติดมันก่อนติดขา
            kind: item
            stat: CON
            tags: [fire]
            success: น้ำมันตะเกียงหกลงบนตัวมัน ไฟติดแม้ตัวมันยังเปียก ไหม้เป็นสีฟ้าเหมือนเกลือในเตา มันไม่คลายจนไฟลามไปถึงส่วนที่อยู่ในกองฟาง แล้วจึงคลาย
          - id: rain_pull
            label: กระชากขาออกสุดแรง
            kind: quick
          - id: rain_coat
            label: ถอดเสื้อคลุมที่ยังอุ่นยัดให้มันรัดแทน
            kind: item
            stat: DEX
            tags: [bait]
          - id: rain_post
            label: เกาะเสารั้วไว้ ไม่ให้มันลากไป
            kind: guard
          - id: rain_shout
            label: ตะโกนเรียกคนบ้านข้างๆ แล้วดิ้นออกทางเดิม
            kind: flee
    win:
      text: |
        ไฟไหม้กองฟางทั้งกองจนเหลือแต่เถ้าเปียกกับเกล็ดเกลือ กลิ่นเหมือนปลาเค็มย่างไหม้ ไม่มีอะไรเหลือให้เห็นเป็นตัว เหลือแต่เกลือเป็นวงขดหลายวงซ้อนกันบนพื้น แข็งเหมือนเปลือกหอย

        คนบ้านข้างๆ มาช่วยกวาด ทุกคนใช้พลั่ว ไม่มีใครใช้มือเปล่า หมาของเขากลับมานอนที่เดิมตอนเช้า ข้อเท้าของ{name}มีรอยแดงพันเป็นเกลียวสามรอบ หายในสามวัน
      effects: { stats: { CON: 1 }, flags: [burned_what_fell_with_the_rain] }
    lose:
      text: |
        {name}จำได้แค่ว่าความอุ่นขึ้นมาถึงเข่า แล้วถึงอก แล้วก็จำอะไรไม่ได้ คนบ้านข้างๆ ได้ยินหมาหอนจึงออกมาดู เห็น{name}นอนอยู่ข้างกองฟาง เขาเอาคบไฟจี้กองฟางจนไหม้ทั้งกอง

        {name}ฟื้นขึ้นมาบนเตียงตัวเอง ตัวร้อนเป็นไข้ ขาทั้งสองข้างมีรอยแดงพันเป็นเกลียว รอยนั้นเย็นเฉียบเวลาเอามือแตะ เกือบเดือนกว่าจะจาง
      effects: { flags: [held_by_what_fell_with_the_rain] }
    stalemate:
      text: |
        ของในกองฟางคลายจากข้อเท้า{name}เอง เลื่อนกลับเข้าไปในกอง แล้วกองฟางทั้งกองก็เคลื่อนไปทางคูน้ำหลังบ้านช้าๆ ทิ้งรอยเปียกเป็นแนวกว้างบนดิน

        เช้าขึ้นมาคูน้ำมีเกล็ดเกลือเกาะขอบไปจนถึงลำธาร คนในถิ่นเลิกใช้น้ำลำธารไปครึ่งเดือน ฟางกองใหม่ไม่มีใครยอมกองที่เดิม
      effects: { flags: [let_what_fell_go_to_the_ditch] }
    flee:
      text: |
        {name}ดิ้นหลุดเข้าบ้านได้ ปิดประตู เอาหลังพิงไว้ ข้างนอกมีเสียงเปียกๆ วนรอบบ้านหนึ่งรอบ ช้าๆ ผ่านใต้หน้าต่างทุกบาน แล้วหยุดที่ผนังด้านที่มีเตา เตาที่ยังอุ่น

        {name}เทน้ำดับเตาในคืนที่หนาวจัด แล้วนั่งห่มผ้าจนสาง เช้าขึ้นมาผนังด้านนอกตรงหลังเตามีเกล็ดเกลือเกาะเป็นวงขด กองฟางข้างรั้วหายไปทั้งกอง
      effects: { flags: [fled_what_fell_with_the_rain] }

# ---------- ในบ่อ ----------
- id: adult.enc_era_in_the_well
  stage: adult
  weight: 12
  time: day
  cast:
    pal: { bond: [friend], optional: true }
  when:
    age: [16, 130]
    year: [367, 379]
    not_traits: [curse_brand]
  text: |
    เมื่อคืนน้ำในบ่อกลางถิ่นขึ้นเองโดยไม่มีฝน เช้านี้ผิวน้ำอยู่ห่างปากบ่อแค่ฝ่ามือ รสเค็ม ถังที่หย่อนลงไปตักไม่ต้องใช้เชือก

    {name}มาถึงบ่อเป็นคนแรก บนหินขอบบ่อด้านในมีของเกาะอยู่เป็นแถว ตัวเท่าฝ่ามือ สีเทาใสเหมือนเกลือที่ตากยังไม่แห้ง ก้ามสองข้างไม่เท่ากัน มีเสียงเปาะแปะเหมือนคนเคาะเล็บกับกระเบื้อง ตัวหนึ่งนั่งอยู่ในถังตักน้ำของบ่อ
  encounter:
    foe: salt_crab
    name: ปูฝนเค็มในบ่อ
    morale: 2
    deadly: false
    beats:
      - text: เสียงเปาะแปะหยุดพร้อมกันทั้งแถว ทุกตัวหันก้ามข้างใหญ่มาทางเดียวกัน ทาง{name} ตัวที่อยู่ในถังปีนขึ้นมาเกาะขอบถัง
        moves:
          - id: well_spoon
            label: เอาฝาหม้อสังกะสีของบ่อโยนไปทางลานหญ้าให้มันเห็นแวว
            kind: item
            stat: WIS
            tags: [bait]
            success: ฝาหม้อตกลงบนหินลานบ่อเสียงดังแกร๊ง แดดตกพอดี ทั้งแถวหันตาม เดินเป็นสายไปทางฝาหม้อ ก้ามข้างใหญ่ยกสูงเหมือนคนเดินถือของ
          - id: well_lid
            label: ยกแผ่นไม้ฝาบ่อมาปิดไว้ ให้ตัวที่เหลือขึ้นมาไม่ได้
            kind: guard
          - id: well_watch
            label: ยืนดูว่าตัวไหนเป็นตัวที่ตัวอื่นรอ
            kind: read
            stat: INT
          - id: well_broom
            label: เอาไม้กวาดกวาดลงจากขอบบ่อ
            kind: attack
            tags: [blunt]
          - id: well_pal
            label: "เรียก{pal}ให้เอาหม้อทองเหลืองที่ขัดแล้วมาด้วย"
            kind: item
            stat: CHA
            ally: pal
            tags: [bait]
            success: "{pal}มาถึงพร้อมหม้อทองเหลืองที่ขัดจนส่องหน้าได้ วางลงกลางลาน ปูทั้งแถวไต่ลงจากขอบบ่อไปล้อมหม้อ เกาะขอบหม้อเรียงกันเป็นวง {pal}ยืนดูหม้อของตัวเองโดนล้อมแล้วหัวเราะไม่ออก"
          - id: well_leave
            label: กลับไปเรียกคนทั้งถิ่น
            kind: flee
      - text: ตัวใหญ่ที่สุดขึ้นมาจากน้ำ ตัวเท่าฝาตะเกียง ก้ามข้างใหญ่หนีบขอบถังจนสังกะสีบุบ มันยืนขวางทางลงบ่อ ตัวเล็กๆ กลับมารวมอยู่ข้างหลังมัน
        answer: item
        moves:
          - id: well_ladle
            label: เอากระบวยทองเหลืองของบ่อส่องแดดใส่ตามัน แล้วค่อยๆ ลากแสงออกไปทางลาน
            kind: item
            stat: DEX
            tags: [bait]
          - id: well_sack
            label: เอากระสอบครอบ ทั้งถังทั้งตัว
            kind: quick
          - id: well_board
            label: เอาแผ่นฝาบ่อกั้นไว้ ไม่ให้มันเดินออกมาถึงลาน
            kind: guard
          - id: well_leave2
            label: ถอยออกมา ปล่อยบ่อไว้ให้คนอื่น
            kind: flee
    win:
      text: |
        ปูทั้งแถวเดินตามแวววาวไปลงกระสอบที่เปิดรอไว้ทีละตัว ตัวใหญ่ลงเป็นตัวสุดท้าย {name}มัดปากกระสอบด้วยเชือกบ่อ หิ้วไปเทลงลำธารที่ไหลออกไปทางทุ่ง ตอนเท กระสอบเบากว่าตอนหิ้วมา

        ตกบ่ายน้ำในบ่อลดลงไปอยู่ระดับเดิม รสจืดเหมือนเดิม คนในถิ่นมาตักน้ำกันตามปกติ ฝาหม้อสังกะสีของบ่อหายไปหนึ่งใบ ไม่มีใครเห็นว่าหายตอนไหน
      effects: { stats: { WIS: 1 }, flags: [cleared_the_salt_crabs_from_the_well] }
    lose:
      text: |
        ก้ามข้างใหญ่หนีบนิ้วของ{name}ตอนเอื้อมไปหยิบถัง หนีบแล้วไม่ปล่อย จนคนที่มาตักน้ำคนที่สองเอาไม้ฟาดขอบถังให้มันตกน้ำ นิ้วบวมเป่งไปทั้งสัปดาห์

        ปูทั้งแถวกลับลงบ่อไปเอง คนในถิ่นต้องเดินไปตักน้ำบ่อถิ่นข้างๆ จนน้ำลดลงเท่าเดิม เกือบครึ่งเดือน
      effects: { flags: [pinched_at_the_salt_well] }
    stalemate:
      text: |
        ทั้งแถวลงน้ำไปพร้อมกันเมื่อแดดขึ้นสูง ไม่มีใครเห็นว่าลงตอนไหน เหลือแต่รอยเกลือเป็นจุดๆ บนหินขอบบ่อ

        น้ำในบ่อลดลงช้าๆ ตลอดเดือน รสเค็มจางลงทีละวัน ตั้งแต่นั้นคนตักน้ำคนแรกของทุกเช้าต้องเคาะขอบถังสามทีก่อนหย่อนลงไป ธรรมเนียมนี้เริ่มจาก{name}
      effects: { flags: [waited_out_the_salt_crabs] }
    flee:
      text: |
        {name}กลับไปเรียกคนทั้งถิ่น พอกลับมา ปูทั้งแถวลงน้ำไปแล้ว เหลือถังตักน้ำบุบหนึ่งใบกับรอยเกลือบนหิน คนทั้งถิ่นยืนล้อมบ่อ ไม่มีใครอยากเป็นคนหย่อนถังคนแรก

        สุดท้ายหญิงแก่คนหนึ่งเป็นคนหย่อน ตักขึ้นมาได้น้ำเต็มถัง เค็ม ใส ไม่มีอะไรในถัง นางเทน้ำทิ้ง แล้วหย่อนอีกรอบ
      effects: { flags: [called_the_lane_to_the_salt_well] }
