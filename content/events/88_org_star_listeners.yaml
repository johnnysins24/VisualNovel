# ชุด อ ผู้ฟังดาว (10 เรื่อง): ทางเข้า 2 · งาน 4 · ขึ้นยศ 2 · โดนเปิดโปง 1 · ชีวิตหลังเรื่องแตก 1
# วงของตัวละครคือวงของบรานเวลในห้องใต้หลังคาร้านขายแว่นตา (คัมภีร์) เรื่องที่ไม่ผูกถิ่นไม่บอกว่าร้านอยู่เมืองไหน
# คนเงยหน้า (ยศ 1) ยังไม่รู้เรื่องวงหลังเที่ยงคืน งานทั้งสี่เขียนให้อ่านได้โดยไม่ต้องรู้ แต่ละเรื่องมีทางให้แอบเห็น
# คนที่มีแต่ในข้อความ: ช่างแว่นชั้นล่าง (ไม่มีชื่อ) · เบรนนา หญิงเสื้อผ้าเนื้อดีที่แจกบัตรในโรงเตี๊ยม
#   ราธิก เด็กฝึกงานโรงพิมพ์ที่มานั่งวงครั้งแรก · ดุสกา หญิงแก่บ้านติดกันที่หลานเป็นเด็กรับใช้ในวิหารตะเกียง
# ของประจำยศ: สมุดปกผ้า (listeners_blue_notebook) ได้ในฉากขึ้นเป็นคนจดคำตอบทุกทาง เผาที่วิหารเมื่อตัดขาดจากวง
# ทางถอดรอยดาว (curse_star_marks): listeners_after_the_oil_cart ตัวเลือกช่างเงินดาวที่หอนับดาว

# ---------- ทางเข้า ----------
- id: adult.listeners_join_blue_card
  stage: adult
  weight: 12
  when:
    age: [25, 55]
    location_tag: ventras
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [left_the_star_listeners]
    not_traits: [curse_brand]
  text: |
    ชายผมหวีเรียบคนหนึ่งยืนรอ{name}อยู่หน้าโรงอาบน้ำ เสื้อดีกว่าเสื้อทุกตัวในถนน เขาถามคำถามเดียวก่อนจะยื่นอะไรให้ ว่าตอนกลางคืนเคยได้ยินเสียงต่ำๆ ไหม เสียงที่ดังอยู่ใต้เสียงอื่น {name}ตอบว่าเคย ใครในเวนทราสก็เคย เขาวางบัตรกระดาษหนาลงในมือ{name}ด้วยมือทั้งสองข้าง หมึกน้ำเงิน ลายมือสวย มุมบัตรมีดาวเจ็ดแฉกดวงเล็กวาดด้วยหมึกเดียวกัน ห้องใต้หลังคาร้านขายแว่นตา วันอัสเทล หลังมื้อเย็น

    บันไดหลังร้านขายแว่นตามีกลิ่นผงขัดเลนส์ ห้องใต้หลังคามีโต๊ะยาวตัวเดียว คนนั่งรอบโต๊ะสิบเอ็ดคน ถ้วยชาครบทุกที่ หนังสือของอาจารย์โอเดล คอร์ดิส เปิดอยู่หน้าเดียวกันทุกเล่ม ผลัดกันอ่านคนละย่อหน้า แล้วคุยกันเรื่องที่อ่านด้วยเสียงที่ไม่มีใครขึ้นสูงกว่าใคร คนที่นั่งหัวโต๊ะคือบรานเวล ชายผอมที่พูดช้าจนคนฟังต้องรอ และจำชื่อทุกคนได้ตั้งแต่ได้ยินครั้งแรก เพดานกลางห้องมีรอยต่อไม้เป็นสี่เหลี่ยมใหญ่ ตะขอเหล็กสองตัวห้อยอยู่ที่ขอบ ไม่มีใครเงยหน้าดู

    พอชาหมดกาที่สอง บรานเวลปิดหนังสือ บอกว่าวันอัสเทลหน้าเวลาเดิม ใครอยากมาก็มา เขาไม่เคยชวนใครซ้ำสองครั้ง
  choices:
    - id: come_back
      label: กลับไปนั่งที่เดิมวันอัสเทลถัดไป และวันอัสเทลถัดจากนั้น
      text: |
        ครั้งที่สาม บรานเวลเรียกชื่อ{name}ตั้งแต่{name}ยังถอดเสื้อคลุมไม่เสร็จ ที่นั่งของ{name}เป็นที่เดิมทุกครั้ง ชาเป็นชาเดิม หน้าหนังสือขยับไปทีละหน้า ไม่มีใครถามว่า{name}ทำงานอะไร ไม่มีใครถามว่าเชื่อเรื่องที่อ่านหรือเปล่า

        ทุกครั้งที่วงเลิก {name}ลงบันไดไปพร้อมคนส่วนใหญ่ ได้ยินเสียงเก้าอี้ขยับกันข้างบนตามหลังมา แต่ไม่ครบทุกตัว
      effects:
        org: { id: star_listeners, join: true, secret: true }
        mark: เข้าวงของผู้ฟังดาว
        stats: { INT: 1 }
        flags: [kept_the_astel_day_seat]
    - id: bring_the_old_card
      label: เอาบัตรใบเก่าจากคืนฉลองดาวครบหมื่นดวงไปให้บรานเวลดู
      requires: { flag: took_reading_circle_card }
      text: |
        บรานเวลถือบัตรใบเก่าไว้ใกล้ตะเกียง หมึกจางไปครึ่งหนึ่ง ขอบบัตรนิ่มเพราะเหน็บกรอบประตูมาหลายหน้าฝน เขาบอกว่าเป็นลายมือของเขาเอง คืนนั้นเขาเขียนไปสองร้อยใบ ได้กลับมาสามสิบเอ็ดใบ แล้วเขาก็ลุกไปปักบัตรของ{name}ไว้บนคานหลังคา ต่อจากบัตรเก่าสามสิบเอ็ดใบที่ปักเรียงกันอยู่ก่อน

        ใบของ{name}เป็นใบที่สามสิบสอง ทุกวันอัสเทลหลังจากนั้น{name}นั่งตรงที่มองเห็นคานนั้นพอดี
      effects:
        org: { id: star_listeners, join: true, secret: true }
        mark: เข้าวงของผู้ฟังดาว
        stats: { WIS: 1 }
        flags: [brought_back_the_old_blue_card]
    - id: drink_and_leave
      label: ดื่มชาให้หมดถ้วย ขอบคุณ แล้วไม่กลับไปอีก
      text: |
        บรานเวลไม่ถามเหตุผล เขาเดินมาส่งถึงหัวบันได บอกว่าเขาจำทุกคนที่เคยนั่งโต๊ะนี้ได้ แม้คนที่นั่งครั้งเดียว แล้วยื่นมือให้จับ มือเขาเย็นกว่าถ้วยชาที่เพิ่งวาง

        ทุกวันอัสเทลหลังจากนั้น{name}เดินอ้อมถนนร้านขายแว่นตา สิ้นหน้าฝนมีบัตรหมึกน้ำเงินใบหนึ่งสอดอยู่ใต้ประตูบ้าน ไม่มีคำเชิญ มีแต่ชื่อ{name}เขียนไว้กลางบัตร กับดาวเจ็ดแฉกดวงเล็กตรงมุม
      effects: { stats: { WIS: 1 }, flags: [drank_the_tea_and_left] }
    - id: ask_about_the_hooks
      label: ถามช่างแว่นชั้นล่างว่าตะขอเหล็กบนเพดานห้องใต้หลังคามีไว้ทำอะไร
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ช่างแว่นเป็นชายแก่ตาเหล่ข้างหนึ่ง เขาขัดเลนส์ต่อโดยไม่เงยหน้า บอกว่าหลังคาห้องนั้นเปิดได้ เปิดหลังเที่ยงคืนวันอัสเทล เขาไม่เคยขึ้นไปตอนนั้น เขาเอาสำลีอุดหูนอนตั้งแต่หัวค่ำ เช้าวันต่อมามีคนเลือดกำเดาติดคอเสื้อลงบันไดมาเสมอ

          เขาเป่าผงขัดออกจากเลนส์ แล้วบอกว่าถ้า{name}ยังอยากนอนหลับ ก็ไม่ต้องกลับมา {name}ไม่กลับไปอีก
        effects: { stats: { WIS: 1 }, flags: [learned_the_roof_opens] }
      failure:
        text: |
          ช่างแว่นวางเลนส์ลง ตอบว่าตะขอมีไว้แขวนตะเกียง ตอบเร็วเกินไปครึ่งจังหวะ พอ{name}ออกจากร้าน เขาก็เดินขึ้นบันไดหลังร้านไป ปล่อยร้านเปิดทิ้งไว้ไม่มีใครเฝ้า

          วันอัสเทลถัดมา มีชายสวมถุงมือหนังสีขาวยืนอยู่ฝั่งตรงข้ามบ้าน{name}ตั้งแต่บ่ายจนมืด ไม่เคาะประตู ไม่เข้ามาใกล้ พอมืดสนิทเขาถอดถุงมือข้างหนึ่งพับใส่กระเป๋า แล้วเดินไป
        effects: { hunted: { star_listeners: 1 }, flags: [asked_the_optician_about_the_hooks] }

- id: adult.listeners_join_question
  stage: adult
  scene: tavern
  weight: 6
  when:
    age: [25, 55]
    location_tag: [arvel_village, ventras, kardin]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [left_the_star_listeners]
    not_traits: [curse_brand]
  text: |
    {name}มีคำถามข้อหนึ่งที่ถามมาหลายปี ถามนักบวชได้คำตอบเป็นคำสวด ถามคนแก่ได้คำตอบเป็นนิทาน ถามตัวเองตอนนอนไม่หลับได้คำตอบเป็นเสียงหายใจของตัวเอง คืนนี้ในโรงเตี๊ยม หลังเหล้าถ้วยที่สาม {name}ถามออกเสียงเป็นครั้งแรก ถามถ้วยเหล้าตรงหน้า ในร้านที่เสียงดังพอจะไม่มีใครได้ยิน

    หญิงที่นั่งโต๊ะติดกันได้ยิน นางชื่อเบรนนา เสื้อผ้าเนื้อดีกว่าทุกคนในร้าน นั่งดื่มน้ำชาในโรงเตี๊ยมเหมือนนั่งอยู่บ้านตัวเอง นางไม่ถามว่าคำถามคืออะไร นางถามว่าตอนกลางคืน{name}เคยได้ยินเสียงต่ำๆ ไหม เสียงที่ดังอยู่ใต้เสียงอื่น

    {name}บอกว่าเคย นางเลื่อนบัตรกระดาษหนาหมึกน้ำเงินมาให้ใบหนึ่ง ห้องใต้หลังคาร้านขายแว่นตา วันอัสเทล มุมบัตรมีดาวเจ็ดแฉกดวงเล็ก นางบอกว่าวงของนางไม่มีใครตอบคำถามให้ใคร แต่บางคนนั่งนานพอ คำตอบก็มาเอง บางคนนั่งทั้งชีวิตก็ไม่มา นางพูดเรื่องนี้เหมือนพูดเรื่องฝน
  choices:
    - id: carry_the_question_up
      label: ไปตามบัตรในวันอัสเทล พกคำถามข้อนั้นไปด้วย
      text: |
        ห้องใต้หลังคาร้านขายแว่นตามีโต๊ะยาวตัวเดียว ชาครบทุกที่ หนังสือของอาจารย์โอเดล คอร์ดิส เปิดหน้าเดียวกันทุกเล่ม ไม่มีใครถามคำถามของ{name} บรานเวล ชายผอมที่นั่งหัวโต๊ะ พูดช้าจนทั้งโต๊ะต้องรอ ตอนส่ง{name}ที่หัวบันไดเขาบอกว่าคำถามที่ไม่ได้ถามออกเสียงหนักที่สุด ให้แบกมาทุกวันอัสเทลจนกว่าจะวางได้

        {name}ไม่เคยบอกเขาว่ามีคำถาม เบรนนาก็บอกว่าไม่ได้บอก
      effects:
        org: { id: star_listeners, join: true, secret: true }
        mark: เข้าวงของผู้ฟังดาว
        stats: { WIS: 1 }
        flags: [carried_the_question_up_the_stairs]
    - id: keep_the_question
      label: เก็บบัตรไว้ แต่ไม่ไป เก็บคำถามไว้ถามตัวเองต่อ
      text: |
        บัตรใบนั้นอยู่ในลิ้นชักใต้ผ้าห่มผืนหนาที่ใช้แค่หน้าหนาว ทุกครั้งที่ดึงผ้าห่มออกมา{name}เห็นมุมดาวเจ็ดแฉก แล้วดันลิ้นชักปิด

        คำถามข้อนั้นยังไม่มีคำตอบ {name}ถามตัวเองทุกคืนที่นอนไม่หลับ ได้คำตอบเป็นเสียงหายใจของตัวเองเหมือนเดิม หน้าหนาวนั้น{name}ห่มผ้าห่มผืนบาง
      effects: { stats: { CON: 1 }, flags: [kept_the_question_unasked] }
    - id: show_the_card_to_a_priest
      label: เอาบัตรไปให้นักบวชดู แล้วถามคำถามข้อนั้นกับนักบวชอีกครั้ง
      text: |
        นักบวชพลิกบัตรดูครั้งเดียว แล้วจุ่มมุมที่มีดาวลงไฟตะเกียงจนไหม้ทั้งใบ เขาไม่ถามว่าใครให้มา เขาตอบคำถามของ{name}ด้วยคำสวดบทเดิม คราวนี้กุมมือ{name}ไว้ตลอดบท และสวดช้ากว่าเดิม

        คำตอบยังเป็นคำสวด แต่คืนนั้น{name}หลับได้ตั้งแต่หัวค่ำ
      effects: { reputation: { lamp_church: 1 }, flags: [gave_the_blue_card_to_a_priest] }
    - id: hum_it_back
      label: ฮัมเสียงต่ำๆ นั้นให้นางฟัง เสียงที่เคยนั่งฟังมาแล้วในห้องอื่น
      requires: { any_flags: [joined_listening_circle, visited_listeners] }
      text: |
        {name}ฮัมได้ไม่ถึงสามจังหวะ เบรนนาก็ฮัมต่อ เสียงเดียวกัน จังหวะเดียวกัน คนโต๊ะข้างๆ หันมาแล้วหันกลับ นางบอกว่าคนที่เคยฟังมาแล้วไม่ต้องนั่งหัดใหม่ วงที่ร้านขายแว่นตามีที่ว่างให้เสมอ

        วันอัสเทลแรกที่ไป บรานเวลจัดที่นั่งให้{name}ใกล้หัวโต๊ะ ใกล้กว่าคนที่มาก่อนหลายคน
      effects:
        org: { id: star_listeners, join: true, secret: true }
        mark: เข้าวงของผู้ฟังดาว
        stats: { INT: 1 }
        flags: [hummed_back_to_brenna]

# ---------- งาน (คัดคำตอบ ยืมหลังคา และรับโถทำซ้ำได้ นั่งข้างคนมาใหม่มีครั้งเดียวเพราะราธิกมาวงครั้งแรกได้หนเดียว) ----------
- id: adult.listeners_duty_copy_an_answer
  stage: adult
  scene: home
  weight: 20
  once: false
  duty: star_listeners
  when:
    age: [25, 64]
    org: { id: star_listeners, secret: true }
  text: |
    ซองไม่จ่าหน้าสอดอยู่ใต้ประตูตอนเช้า ในซองมีบัตรเปล่าเนื้อหนาสามสิบใบ ขวดหมึกน้ำเงินขวดเล็ก กับกระดาษต้นฉบับแผ่นเดียว ลายมือเอียงซ้ายของใครสักคนที่{name}ไม่รู้จัก ตรงมุมมีคำสั่งสั้นๆ คัดให้ครบก่อนวันอัสเทล ตัวตรง ห้ามแก้ วาดดาวเจ็ดแฉกดวงเล็กไว้มุมบัตรทุกใบ

    ต้นฉบับมีประโยคเดียว เขียนแบบที่คนบอกกันเรื่องฝนฟ้า ถนนที่ไม่มีประตูติดดาวชอล์ก จะได้ยินชัดกว่าถนนอื่นก่อนสิ้นหน้าหนาว ประโยคนี้ไม่ได้มาจากหนังสือของอาจารย์โอเดล คอร์ดิส {name}อ่านหนังสือของเขามาพอจะรู้
  choices:
    - id: copy_thirty
      label: คัดให้ครบสามสิบใบ ตัวตรงทุกตัว ไม่อ่านซ้ำ
      text: |
        {name}คัดสองคืนติดใต้ตะเกียง หมึกน้ำเงินซึมเข้าร่องเล็บนิ้วกลางจนล้างไม่ออกไปครึ่งเดือน บัตรสามสิบใบหน้าตาเหมือนกันทุกใบ {name}สอดซองคืนใต้ประตูร้านขายแว่นตาก่อนสาง

        เดือนต่อมามีเกวียนขนของจอดหน้าบ้านหลังหนึ่งท้ายถนนที่{name}ผ่านทุกวัน ประตูบ้านหลังนั้นมีรอยดาวชอล์กที่ล้างแล้วยังเห็น คนที่ช่วยยกหีบขึ้นเกวียนอย่างสุภาพคือคนที่{name}เคยเห็นนั่งปลายโต๊ะวงอ่านหนังสือ
      effects: { flags: [copied_thirty_answers] }
    - id: read_it_through
      label: อ่านประโยคนั้นจนเข้าใจก่อน แล้วค่อยคัด
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}อ่านเจ็ดรอบ รอบที่เจ็ดจึงนึกออกว่าดาวชอล์กที่ประตูเคยเห็นที่ไหน บ้านท้ายถนนที่คนมีเขาอยู่กันสามรุ่น ประตูบานนั้นโดนขีดดาวทุกวันอัสเทล แล้วโดนล้างทุกเช้าวันต่อมา

          {name}คัดครบสามสิบใบ ใบสุดท้ายใช้เวลานานกว่าใบแรกครึ่งชั่วยาม ตัวหนังสือตรงเท่ากันทุกใบ
        effects: { flags: [understood_the_answer_and_copied_it] }
      failure:
        text: |
          อ่านถึงรอบที่สี่ มีเสียงหึ่งต่ำๆ ขึ้นมาจากกระดาษ หรือจากในหัว{name}เอง แยกไม่ออก เลือดกำเดาหยดลงบัตรใบที่สิบสองเป็นจุดกลมสองจุด ซึมเข้าเนื้อกระดาษหนา บัตรอีกสิบแปดใบเปื้อนตามเพราะมือที่ยกขึ้นปิดจมูก

          {name}ส่งซองคืนพร้อมบัตรที่ใช้ได้สิบเอ็ดใบ วันอัสเทลถัดมาไม่มีใครพูดถึง บัตรครบสามสิบใบออกไปถึงมือคนตามเวลาเดิม ลายมือของคนอื่น
        effects: { hp: -1, flags: [bled_on_the_twelfth_card] }
    - id: send_back_the_blanks
      label: สอดซองคืนใต้ประตูร้านขายแว่นตา บัตรเปล่าครบสามสิบใบ
      refuse: true
      text: |
        วันอัสเทลถัดมาไม่มีใครถามถึงซอง บรานเวลรินชาให้{name}ก่อนคนอื่นเหมือนทุกครั้ง

        ครึ่งเดือนต่อมา{name}เห็นบัตรใบหนึ่งเหน็บอยู่ที่กรอบประตูร้านขายผัก ลายมือเอียงขวาของใครอีกคน ประโยคเดิมทุกคำ
      effects: { flags: [sent_back_the_blank_cards] }

- id: adult.listeners_duty_lend_the_roof
  stage: adult
  scene: home
  time: night
  weight: 20
  once: false
  duty: star_listeners
  when:
    age: [25, 64]
    org: { id: star_listeners, secret: true }
  text: |
    คนในวงคนหนึ่งมาขอยืมหลังคาบ้าน{name}หนึ่งคืน ชายเงียบๆ ที่นั่งข้างกาน้ำชาทุกวันอัสเทล ไม่เคยอ่านออกเสียงสักย่อหน้า เขาบอกว่าหลังคาที่เคยใช้กำลังซ่อม ไม่บอกว่าใช้ทำอะไร คืนพรุ่งนี้ฟ้าจะโปร่ง เขาขอให้เปิดช่องขึ้นหลังคาทิ้งไว้ ปิดบานเกล็ดทุกบาน แล้วอยู่ชั้นล่างจนสาง ได้ยินอะไรก็อย่าขึ้นมา

    หลังคาบ้าน{name}ขึ้นได้ทางช่องในห้องเก็บของ ฝั่งหนึ่งชิดชายคาบ้านติดกัน บ้านที่มีเด็กหญิงตัวเล็กนอนอยู่ใต้ชายคาฝั่งนั้นทุกคืน
  choices:
    - id: lend_and_stay_down
      label: เปิดช่องหลังคาทิ้งไว้ แล้วอยู่ชั้นล่างตามที่เขาขอ
      text: |
        เที่ยงคืนมีฝีเท้าเจ็ดคู่เดินข้ามเพดาน แล้วหยุดพร้อมกัน ฝุ่นร่วงลงมาจากรอยต่อไม้เป็นเส้น เสียงหึ่งต่ำๆ ลอดคานลงมาจนถ้วยในตู้สั่น {name}นั่งอยู่ชั้นล่างทั้งคืน ก่อนไก่ขัน ฝีเท้าทั้งเจ็ดลงทางชายคาฝั่งถนน ไม่ผ่านในบ้าน

        สายวันนั้นแม่ของเด็กหญิงบ้านติดกันเอาหมอนมาซักที่บ่อ หมอนเปื้อนเลือดกำเดาเป็นดวงใหญ่ นางถามทุกคนที่ผ่านว่าเมื่อคืนได้ยินอะไรไหม {name}ตอบว่าไม่ได้ยิน
      effects: { flags: [lent_the_roof_and_stayed_down] }
    - id: lend_and_look
      label: เปิดช่องหลังคาให้ แต่ตอนเที่ยงคืนขึ้นบันไดไปแง้มดู
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          บนหลังคามีคนนอนหงายอยู่เจ็ดคน หัวชนกันเป็นวง ตะเกียงดับทุกดวง ตาทุกคู่เปิด ริมฝีปากขยับพร้อมกันแต่ไม่มีเสียงออกมา คนที่แปดนั่งอยู่นอกวง เขียนอะไรบางอย่างลงกระดาษในความมืดโดยไม่ก้มดูกระดาษเลย

          {name}ปิดช่องลงช้าๆ ก่อนจะมีใครหันมา เช้าวันต่อมาปีนขึ้นไปดู กระเบื้องตรงที่คนนอนเย็นกว่ากระเบื้องรอบๆ จนน้ำค้างยังเกาะอยู่ตอนสาย เป็นรอยคนเจ็ดรอยหัวชนกัน
        effects: { flags: [saw_them_lying_on_the_roof] }
      failure:
        text: |
          พอแง้มช่องได้หนึ่งคืบ เสียงหึ่งก็ไหลลงมาตามรอยแง้มเหมือนน้ำเย็น {name}สั่งมือให้ปิดกลับ มือไม่ฟัง แล้วก็หลับคาบันได

          ตื่นมาตอนสาย ช่องหลังคาปิดสนิท ลงกลอนจากข้างล่างด้วยมือของใครสักคน ขั้นบันไดที่{name}เกาะมีเลือดกำเดาแห้งเป็นทาง มีคนเช็ดไปแล้วครึ่งหนึ่ง
        effects: { hp: -1, flags: [fell_asleep_under_the_trapdoor] }
    - id: say_the_roof_leaks
      label: บอกเขาว่าหลังคารั่ว ให้ยืมไม่ได้
      refuse: true
      text: |
        ชายคนนั้นไม่ถามซ้ำ วันอัสเทลถัดมาเขายังนั่งข้างกาน้ำชาที่เดิม รินชาให้{name}เหมือนทุกครั้ง

        ครึ่งเดือนต่อมามีข่าวที่บ่อน้ำว่าแม่ม่ายท้ายซอยได้ค่าเช่าหลังคาหนึ่งคืนสามเหรียญ จากใครไม่รู้ นางซื้อฟืนได้ทั้งหน้าหนาว ลูกชายนางนอนเลือดกำเดาไหลอยู่สามวัน
      effects: { flags: [said_the_roof_leaked] }

- id: adult.listeners_duty_glass_jar
  stage: adult
  weight: 20
  once: false
  duty: star_listeners
  when:
    age: [25, 64]
    org: { id: star_listeners, secret: true }
  text: |
    ถุงมือหนังสีขาวคู่หนึ่งมาพร้อมคำสั่งปากเปล่า ไปรับโถที่ประตูหลังห้องหมอฝานแก้วข้างโรงกลั่น จากคนขับเกวียนที่สวมถุงมือแบบเดียวกัน แล้วเอาไปส่งที่ประตูหลังร้านขายแว่นตาก่อนพลบ ห้ามเปิดฝา ห้ามจับด้วยมือเปล่า

    หน้าประตูห้องหมอฝานแก้วมีคนงานโรงกลั่นยืนเรียงแถว แขนพันผ้า บางคนพันถึงศอก คนขับเกวียนตัวใหญ่ ถุงมือขาวสะอาดเกินมือคนขับเกวียน เขายื่นโถดินเผาปิดฝาด้วยขี้ผึ้งให้ด้วยสองมือ เอียงนิดเดียวก็มีเสียงกรุ๊งกริ๊งเบาๆ ข้างใน เหมือนกระดิ่งเล็กๆ หลายสิบอัน

    หมอนับเหรียญจากคนขับเกวียนอยู่ในประตู คนงานคนหนึ่งในแถวบอกคนข้างหลังว่าตั้งแต่คนถุงมือขาวเริ่มมา หมอฝานลึกกว่าเดิม
  choices:
    - id: carry_by_the_main_road
      label: สวมถุงมือขาว อุ้มโถเดินถนนใหญ่ไปส่งให้ทันก่อนพลบ
      text: |
        {name}อุ้มโถไว้แนบอกเหมือนอุ้มเด็กหลับ เสียงกระดิ่งข้างในดังทุกครั้งที่ก้าวลงหลุมถนน ช่างแว่นรับโถที่ประตูหลังร้านด้วยถุงมือขาวของเขาเอง ไม่ขอบใจ ไม่ถามว่าเปิดดูหรือเปล่า

        เดือนต่อมาแถวหน้าประตูห้องหมอฝานแก้วยาวขึ้นเท่าตัว {name}เห็นคนงานคนหนึ่งที่จุดใสบนหลังมือเคยเล็กเท่าเล็บ เดินออกมาพร้อมผ้าพันเต็มฝ่ามือ
      effects: { flags: [carried_the_glass_jar] }
    - id: cut_across_the_temple_yard
      label: ลัดผ่านลานวิหารตะเกียงให้ถึงก่อนเวลา
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ลานวิหารกำลังจุดตะเกียงเย็น นักบวชเด็กสองคนถือไม้ขอเกี่ยวตะเกียงขึ้นเสา ไม่มีใครสนใจคนอุ้มโถดินเผา {name}เดินผ่านกลางลานด้วยฝีเท้าเท่าคนกลับบ้าน

          ถึงประตูหลังร้านขายแว่นตาก่อนพลบนานพอให้ช่างแว่นเลิกคิ้ว เขารับโถไปโดยไม่ถามว่ามาทางไหน
        effects: { flags: [took_the_jar_across_the_temple_yard] }
      failure:
        text: |
          กลางลานวิหาร ส้นรองเท้า{name}สะดุดร่องหิน โถกระเด้งในอ้อมแขน เสียงกระดิ่งข้างในดังทั่วลาน นักล่าแม่มดคนหนึ่งที่ยืนอยู่ข้างเสาหันมา ถามว่าในโถมีอะไร {name}ตอบว่าลูกปัดแก้ว เขาไม่ขอเปิด เขาขอดูถุงมือ ดูทั้งสองข้าง แล้วปล่อยให้ไป

          ตอนเดินออกจากลาน{name}ได้ยินเสียงเขาจดอะไรลงสมุด ปลายดินสอขูดกระดาษแรงพอจะได้ยินถึงประตูลาน
        effects: { hunted: { lamp_church: 1 }, flags: [a_witch_hunter_heard_the_jar_ring] }
    - id: give_back_the_gloves
      label: คืนถุงมือขาว ไม่ไปรับโถ
      refuse: true
      text: |
        {name}พับถุงมือขาวใส่ห่อ สอดคืนใต้ประตูร้านขายแว่นตาตั้งแต่เช้า ตกพลบคนขับเกวียนขับมาส่งโถเองถึงประตูหลังร้าน

        เกวียนของเขาผ่านหน้าบ้าน{name}ทั้งขาไปและขากลับ ขากลับช้ากว่าขาไป
      effects: { flags: [gave_back_the_white_gloves] }

- id: adult.listeners_duty_sit_with_the_newcomer
  stage: adult
  weight: 20
  duty: star_listeners
  when:
    age: [25, 64]
    org: { id: star_listeners, secret: true }
  text: |
    วันอัสเทลนี้มีคนมาวงครั้งแรกหนึ่งคน ราธิก เด็กฝึกงานโรงพิมพ์ ตัวสูงเกินเก้าอี้ นิ้วดำหมึกพิมพ์ทุกนิ้ว ถือบัตรหมึกน้ำเงินไว้ด้วยสองมือเหมือนกลัวปลิว เขามาถึงก่อนเวลาครึ่งชั่วยาม นั่งรอที่หัวบันได ไม่กล้าขึ้นก่อนคนอื่น

    บรานเวลขอให้{name}นั่งข้างเด็กคนนั้น เขาบอกด้วยเสียงช้าๆ แบบเดิมว่าคนที่มาครั้งแรกแล้วได้นั่งข้างคนที่คุ้นกับวง จะกลับมาอีกเสมอ
  choices:
    - id: sit_and_pour
      label: นั่งข้างราธิก รินชาให้ แล้วชี้บรรทัดให้ตามทัน
      text: |
        ราธิกอ่านช้า นิ้วไล่ตามบรรทัดทิ้งรอยหมึกพิมพ์จางๆ ไว้ใต้ตัวหนังสือ {name}ชี้บรรทัดให้ทุกครั้งที่คนอ่านเปลี่ยน ถึงตอนที่อาจารย์โอเดลเขียนว่าฟ้ามีเปลือกเหมือนไข่ ราธิกหัวเราะออกมาเสียงเดียว แล้วรีบปิดปาก ไม่มีใครดุ บรานเวลยิ้ม

        ราธิกมาทุกวันอัสเทลหลังจากนั้น ไม่เคยขาด ปลายหน้าหนาวช่างพิมพ์ไล่เขาออก เพราะเลือดกำเดาหยดลงแท่นพิมพ์กลางหน้าประกาศของวิหาร
      effects: { flags: [sat_beside_rathik] }
    - id: read_aloud_for_him
      label: อ่านหน้าที่ถึงคิวให้ราธิกฟังเอง ช้าพอให้เขาตามทัน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}อ่านช้ากว่าที่เคยอ่าน หยุดทุกที่ที่ควรหยุด ราธิกขยับปากตามคำท้ายของทุกประโยคโดยไม่มีเสียง พออ่านจบหน้า เขาขอยืมหนังสือกลับไปอ่านต่อที่บ้าน บรานเวลให้ยืมเล่มของตัวเอง

          ราธิกเอาหนังสือมาคืนวันอัสเทลถัดไป หน้าที่{name}อ่านให้ฟังมีรอยนิ้วหมึกพิมพ์ทุกบรรทัด
        effects: { flags: [read_cordis_aloud_for_rathik] }
      failure:
        text: |
          ถึงบรรทัดเรื่องเปลือกฟ้า เสียง{name}แหบลงกลางคำ ไอจนอ่านต่อไม่ได้ ราธิกยื่นมือมารับหนังสือไปอ่านต่อเองจนจบหน้า เสียงเขาดีกว่าเสียง{name} ช้ากว่า หนักกว่า ทั้งโต๊ะฟังไม่มีใครขยับ

          บรานเวลบอกราธิกว่าเสียงแบบนี้ควรได้ยินคำตอบ ราธิกก้มหน้าหลบ หูแดงไปถึงต้นคอ
        effects: { flags: [rathik_read_the_rest] }
    - id: skip_this_astel_day
      label: ไม่ไปวงวันอัสเทลนี้
      refuse: true
      text: |
        {name}อยู่บ้านทั้งวันอัสเทล ไม่ทำงาน ไม่ฉลอง เหมือนคนอื่นทุกคน

        วันอัสเทลถัดมาราธิกไม่อยู่ในวง คนข้างกาน้ำชาเล่าว่าเขาได้นั่งข้างหญิงที่ไม่ค่อยยิ้มคนหนึ่ง อ่านไม่ทัน แล้วไม่กลับมาอีก ได้ข่าวว่าไปเป็นช่างพิมพ์เต็มตัวที่เมืองอื่น
      effects: { flags: [skipped_the_astel_day_circle] }

# ---------- ขึ้นยศ ----------
- id: adult.listeners_rise_open_roof
  stage: adult
  weight: 60
  must: true
  time: night
  when:
    age: [19, 80]
    org: { id: star_listeners, secret: true, min_rank: 1, max_rank: 1, ready: true }
  text: |
    วงอ่านหนังสือคืนวันอัสเทลจบตามเวลา คนลุกกลับบ้านทีละคนสองคน {name}ลุกตามเหมือนทุกครั้ง บรานเวลแตะไหล่{name}เบาๆ ตอนเดินผ่านหัวโต๊ะ บอกว่าคืนนี้อยู่ต่อได้ แล้วเดินไปหรี่ตะเกียงดวงแรก

    คนที่อยู่ต่อมีเจ็ดคนรวม{name} บรานเวลดับตะเกียงทีละดวงจนห้องมืดสนิท แล้วดึงตะขอเหล็กสองตัวที่เพดาน สี่เหลี่ยมกลางเพดานยกขึ้นทั้งแผ่น ลมเย็นไหลลงมาพร้อมฟ้าที่ดาวดวงใหม่หนาแน่นจนดูต่ำลง ทุกคนนอนหงายลงกับพื้นไม้ หัวชนกันเป็นวง

    บรานเวลอธิษฐานถึงอัสเทลด้วยเสียงช้าแบบเดียวกับที่อ่านหนังสือ ชื่อของเทพที่ตายไปแล้วดังอยู่ในห้องมืดเหมือนชื่อคนที่ยังไม่กลับบ้าน เสียงหึ่งต่ำๆ ลงมาจากช่องหลังคา ดังขึ้นจนพื้นไม้สั่นใต้หลัง ใกล้สาง หญิงคนหนึ่งในวงพูดขึ้นมาประโยคหนึ่งด้วยเสียงที่ไม่ใช่เสียงของนาง บรานเวลพูดซ้ำทุกคำ แล้วจดลงสมุดในความมืด
  choices:
    - id: lie_still
      label: นอนนิ่ง ฟังจนสาง ไม่ขยับแม้หลังจะเริ่มชา
      text: |
        พื้นไม้เย็นจนหลังชา {name}ไม่ขยับ ฟังเสียงหึ่งแตกออกเป็นหลายเสียง แล้วรวมกลับเป็นเสียงเดียว หลายรอบจนนับไม่ทัน ตอนสาง บรานเวลปิดหลังคา จุดตะเกียงดวงเดียว แล้วรินชาให้ทุกคน ถ้วยของ{name}รินก่อน

        ลงบันไดมาเช้านั้น{name}เพิ่งรู้ว่าเก้าอี้ที่ไม่เคยขยับตามหลังทุกวันอัสเทลเป็นของใครบ้าง
      effects:
        org: { id: star_listeners, promote: true }
        mark: ขึ้นเป็นคนนั่งวง
        stats: { WIS: 1 }
        flags: [lay_still_under_the_open_roof]
    - id: keep_eyes_shut
      label: หลับตาฟัง ไม่ดูดาวที่ช่องหลังคา
      text: |
        {name}หลับตาตั้งแต่หลังคาเปิด ข้างในเปลือกตาไม่มืด มีจุดสว่างเล็กๆ ลอยอยู่ เรียงตัวเหมือนฟ้าที่ไม่ได้ดู เสียงหึ่งรู้ทางเข้ามาเองโดยไม่ต้องผ่านตา

        ตอนสาง เลือดกำเดาไหลลงมาถึงริมฝีปาก หญิงที่นอนหัวชนกับ{name}ยื่นผ้าเช็ดหน้าให้ บอกว่าคนที่หลับตาเลือดออกช้ากว่าคนที่ลืมตา แต่ออกเหมือนกัน
      effects:
        org: { id: star_listeners, promote: true }
        mark: ขึ้นเป็นคนนั่งวง
        stats: { CON: 1 }
        flags: [kept_eyes_shut_the_first_night]
    - id: say_it_with_branwel
      label: พูดประโยคนั้นตามบรานเวล ทีละคำ
      text: |
        {name}ได้ยินปากตัวเองขยับตามบรานเวลก่อนจะคิดว่าจะพูด ทุกคำตรงกัน จังหวะตรงกัน เหมือนท่องบทที่เคยท่องมาแล้ว บรานเวลหยุดจดครู่หนึ่งในความมืด

        ตอนสาง เขาให้{name}ถือสมุดเล่มนั้นลงบันไดแทนเขา หนักกว่าที่เห็น หน้าที่เพิ่งเขียนยังเปียกหมึก
      effects:
        org: { id: star_listeners, promote: true }
        mark: ขึ้นเป็นคนนั่งวง
        stats: { INT: 1 }
        flags: [said_the_answer_with_branwel]

- id: adult.listeners_rise_own_answer
  stage: adult
  weight: 60
  must: true
  time: night
  when:
    age: [19, 80]
    org: { id: star_listeners, secret: true, min_rank: 2, max_rank: 2, ready: true }
  text: |
    คืนนั้นคำตอบมาถึง{name}เอง มากับเสียงหึ่งหลังเที่ยงคืน ใช้เสียงของ{name}เอง ตอบคำถามข้อหนึ่งที่{name}ไม่เคยถามออกเสียงในวง ตอบตรง สั้น และจริง {name}รู้ว่าจริง เพราะคำตอบนั้นรู้เรื่องที่{name}ไม่เคยเล่าให้ใครฟัง

    ตอนสางบรานเวลยื่นสมุดปกผ้าเล่มบางกับขวดหมึกน้ำเงินให้ หน้าแรกว่าง เขาบอกด้วยเสียงช้าแบบเดิมว่าคนที่ได้คำตอบเป็นคนจดให้คนอื่นอ่าน แล้วพูดคำตอบของ{name}ซ้ำกลับมาทุกคำ ได้ยินครั้งเดียวเขาก็จำได้แล้ว

    เช้าวันนั้น{name}ล้างหน้าในห้องมืดก่อนจุดตะเกียง เห็นจุดใสเล็กๆ ใต้ผิวหลังใบหูในเงาน้ำ เรืองแสงจางๆ สามจุด เหมือนดาวที่เพิ่งขึ้นตอนหัวค่ำ
  choices:
    - id: write_it_down
      label: เขียนคำตอบของตัวเองลงหน้าแรกของสมุด
      text: |
        {name}เขียนด้วยหมึกน้ำเงิน ช้ากว่าที่เคยเขียนอะไรมา ตัวหนังสือออกมาเอียงซ้าย เอียงแบบลายมือในต้นฉบับที่วงเคยส่งมาให้คัด {name}ไม่เคยเขียนเอียงแบบนี้มาก่อน

        คืนนั้นจุดใสหลังใบหูเพิ่มเป็นห้าจุด
      effects:
        org: { id: star_listeners, promote: true }
        mark: ขึ้นเป็นคนจดคำตอบ
        items: [listeners_blue_notebook]
        traits: [curse_star_marks]
        world: { star: 1 }
        stats: { INT: 1 }
        flags: [wrote_my_answer_on_the_first_page]
    - id: leave_it_with_branwel
      label: ไม่เขียน บอกบรานเวลว่าคำตอบนี้ขอเก็บไว้คนเดียว
      text: |
        บรานเวลไม่ห้าม เขาบอกว่าเขาจำไว้ให้แล้ว วันไหน{name}ลืม ให้มาถาม แล้วเขาก็เปิดสมุดเล่มของเขาเอง เขียนคำตอบของ{name}ลงไปหนึ่งบรรทัด ลายมือเอียงซ้าย

        {name}เริ่มใส่เสื้อคอสูงตั้งแต่เดือนนั้น
      effects:
        org: { id: star_listeners, promote: true }
        mark: ขึ้นเป็นคนจดคำตอบ
        items: [listeners_blue_notebook]
        traits: [curse_star_marks]
        world: { star: 1 }
        stats: { WIS: 1 }
        flags: [left_my_answer_with_branwel]
    - id: old_marks_meet_the_new
      label: ดูจุดใสที่มีอยู่แล้วบนตัว ว่าคืนนี้ลามไปถึงไหน
      requires: { trait: curse_star_marks }
      text: |
        จุดใสที่{name}มีมาก่อนเข้าวงลามขึ้นมาถึงท้ายทอยในคืนเดียว ต่อเป็นแนวเดียวกับจุดใหม่หลังใบหู บรานเวลดูแล้วบอกว่าดาวรู้จัก{name}ก่อนวงจะรู้จัก

        จุดเก่ากับจุดใหม่เรืองแสงพร้อมกันทุกครั้งที่ดับตะเกียง {name}เลิกดับตะเกียงตอนนอน
      effects:
        org: { id: star_listeners, promote: true }
        mark: ขึ้นเป็นคนจดคำตอบ
        items: [listeners_blue_notebook]
        trait_step: { curse_star_marks: 1 }
        world: { star: 1 }
        stats: { CHA: 1 }
        flags: [old_star_marks_met_the_new]

# ---------- โดนเปิดโปง ----------
- id: adult.listeners_exposed
  stage: adult
  scene: home
  weight: 12
  when:
    age: [25, 64]
    org: { id: star_listeners, secret: true, min_rank: 2 }
  text: |
    ลมพัดกระดาษแผ่นหนึ่งจากหน้าต่างบ้าน{name}ข้ามรั้วไปตกในลานบ้านติดกัน ดุสกา หญิงแก่บ้านนั้น ถือมาคืนเองถึงประตู กระดาษหนา หมึกน้ำเงิน ลายมือเอียงซ้าย ตรงมุมมีดาวเจ็ดแฉกดวงเล็ก นางยื่นให้แต่ยังไม่ปล่อยมือ

    หลานชายของดุสกาเป็นเด็กรับใช้ในวิหารตะเกียง นางบอกว่าหลานเคยเล่าเรื่องดาวเจ็ดแฉกหมึกน้ำเงิน และเรื่องที่วิหารให้รางวัลคนที่เอากระดาษแบบนี้ไปส่ง นางบอกอีกว่าทุกคืนวันอัสเทล{name}กลับบ้านหลังเที่ยงคืน คนแก่นอนไม่ค่อยหลับ นางนับได้

    ดุสกายังไม่ปล่อยกระดาษ นางถามว่าในนี้เขียนว่าอะไร
  choices:
    - id: pay_duska
      label: ยื่นห้าเหรียญให้ดุสกา ขอให้นางลืมว่าลมพัดอะไรมา
      requires: { min_gold: 5 }
      text: |
        ดุสกานับเหรียญด้วยนิ้วที่สั่นทุกนิ้ว แล้วปล่อยกระดาษ นางบอกว่านางแก่แล้ว ความจำไม่ดี พรุ่งนี้คงจำไม่ได้ว่าลมพัดอะไรมา

        ทุกคืนวันอัสเทลหลังจากนั้น ไฟบ้านดุสกาดับก่อน{name}ออกจากบ้าน และมืดสนิทตอน{name}กลับ
      effects: { gold: -5, flags: [paid_for_duskas_silence] }
    - id: tell_her_the_front
      label: เล่าเรื่องวงอ่านหนังสือให้นางฟัง บอกว่ากระดาษนั้นคัดมาจากหนังสือที่วงอ่าน
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}เล่าเรื่องวงอ่านหนังสือ เรื่องชา เรื่องหนังสือของอาจารย์โอเดล คอร์ดิส ที่ร้านหนังสือไหนก็มีขาย เล่าจนดุสกาหาวสองครั้ง นางปล่อยกระดาษ บอกว่าหลานนางยังเด็ก เห็นอะไรก็เป็นเรื่องใหญ่ไปหมด

          ตั้งแต่นั้น{name}ปิดหน้าต่างก่อนออกจากบ้านทุกครั้ง แม้ในวันที่ร้อนที่สุด
        effects: { stats: { CHA: 1 }, flags: [talked_duska_round] }
      failure:
        text: |
          ดุสกาฟังจนจบ แล้วพับกระดาษใส่อกเสื้อ บอกว่าถ้าเป็นแค่วงอ่านหนังสือ หลานนางคงไม่ว่าอะไร นางจะให้หลานอ่านดูก่อน

          เดือนนั้นคนที่เคยจ้าง เคยซื้อ เคยขายให้{name}เลิกทีละคน วันอัสเทลถัดมาประตูหลังร้านขายแว่นตาลงกลอน {name}เคาะจนคนบ้านฝั่งตรงข้ามเปิดหน้าต่างออกมาดู แล้วปิด ไม่มีใครลงมาเปิดประตู
        effects:
          org: { id: star_listeners, secret: false }
          mark: โดนเปิดโปงว่าเป็นคนของผู้ฟังดาว
          flags: [exposed_as_listener, duska_showed_her_grandson]
    - id: read_it_to_her
      label: อ่านประโยคในกระดาษให้นางฟังตรงๆ แล้วบอกว่ามาจากไหน
      text: |
        {name}อ่านให้ฟังช้าๆ แบบที่บรานเวลอ่าน ดุสกาฟังจนจบ ปากนางขยับตามคำท้ายเหมือนเด็กท่องบท แล้วนางก็ปล่อยกระดาษ ถอยกลับเข้าลานบ้านตัวเอง ลงกลอนประตูรั้ว ตกค่ำหลานชายของนางมาถึง เดินผ่านหน้าบ้าน{name}เข้าบ้านยาย ไม่หันมา

        เดือนนั้นคนที่เคยจ้าง เคยซื้อ เคยขายให้{name}เลิกทีละคน วันอัสเทลถัดมาประตูหลังร้านขายแว่นตาลงกลอน ไม่มีใครลงมาเปิดให้
      effects:
        org: { id: star_listeners, secret: false }
        mark: โดนเปิดโปงว่าเป็นคนของผู้ฟังดาว
        stats: { WIS: 1 }
        flags: [exposed_as_listener, read_the_answer_to_duska]

# ---------- ชีวิตหลังเรื่องแตก ----------
- id: adult.listeners_after_the_oil_cart
  stage: adult
  scene: home
  weight: 30
  when:
    age: [25, 64]
    org: { id: star_listeners, secret: false }
  text: |
    เกวียนน้ำมันคันหนึ่งจอดหน้าบ้าน{name}บ่อยกว่าที่เกวียนน้ำมันควรจอดหน้าบ้านไหน ล่อตัวเดิม คนขับคนเดิม ถังบนเกวียนมีรอยชอล์กขีดไว้ที่ฝา คนขับนั่งหลับบนม้านั่งหน้าเกวียนครึ่งวัน ล่อกินใบไม้จากรั้วบ้าน{name}จนแหว่งเป็นรูปปากล่อ ไม่มีใครลงจากเกวียนมาเคาะประตู

    ตั้งแต่เรื่องแตก คนที่เคยจ้าง เคยซื้อ เคยขายให้{name}หายไปหมด ชื่อของ{name}ในย่านกลายเป็นคำที่แม่ใช้ขู่ลูกให้เข้าบ้านก่อนมืด ส่วนวงก็ตัดขาด ประตูหลังร้านขายแว่นตาไม่เปิดให้อีก คนในวงเดินสวนกันในตลาดโดยไม่มีใครยกมือทัก บรานเวลคนเดียวที่ยังจำชื่อ{name}ได้ แต่เขาไม่เคยเรียก
  choices:
    - id: abjure_at_the_temple
      label: ไปคุกเข่าที่บันไดวิหารตะเกียง ตัดขาดจากวงต่อหน้าตะเกียงแขวน
      text: |
        นักบวชให้{name}วางกระดาษหมึกน้ำเงินทุกแผ่นที่มีลงในไฟตะเกียงแขวนทีละแผ่น บัตร ต้นฉบับ สมุด ไม่เว้นอะไร แผ่นไหนมีดาวเจ็ดแฉก ให้อ่านประโยคบนนั้นออกเสียงก่อนเผา ต่อหน้าคนที่มายืนดูที่บันได แล้วท่องคำสาบานต่อเวรัสจนจบ

        สัปดาห์ต่อมาเกวียนน้ำมันไม่มาจอดอีก ปลายเดือนมีชายสวมถุงมือหนังสีขาวมายืนตรงที่เกวียนเคยจอด ยืนจนมืด ไม่เคาะประตู
      effects:
        org: { id: star_listeners, leave: true }
        mark: ตัดขาดจากวงต่อหน้าวิหาร
        lose_items: [listeners_blue_notebook]
        hunted: { lamp_church: -1, star_listeners: 2 }
        flags: [left_the_star_listeners, burned_the_blue_cards_at_the_temple]
    - id: read_on_the_doorstep
      label: อยู่ต่อแบบที่ทุกคนรู้ วันอัสเทลยกเก้าอี้ออกมาอ่านหนังสือของอาจารย์โอเดลหน้าประตู
      text: |
        วันอัสเทลแรก{name}ยกเก้าอี้ออกมาตั้งหน้าประตู อ่านหนังสือของอาจารย์โอเดล คอร์ดิส ออกเสียงทีละย่อหน้า ช้าแบบที่บรานเวลอ่าน คนขับเกวียนน้ำมันตื่นขึ้นมาฟัง ล่อกินรั้วต่อ

        วันอัสเทลที่สี่ มีเด็กสองคนมานั่งยองๆ ฟังที่ปลายรั้ว แม่ของเด็กคนหนึ่งมาลากกลับ อีกคนไม่มีใครมาลาก นั่งฟังจนจบเล่ม
      effects: { stats: { CHA: 1 }, flags: [read_cordis_on_the_doorstep] }
    - id: go_to_ground
      label: ย้ายไปย่านที่ไม่มีใครรู้จักหน้า ใช้ชื่ออื่น เลิกเงยหน้าดูฟ้าตอนกลางคืน
      text: |
        {name}ย้ายตอนที่คนขับเกวียนหลับ ขนของได้เท่าที่ใส่ย่ามได้ ห้องใหม่อยู่ใต้บันไดโรงทอผ้า ไม่มีหน้าต่าง เจ้าของห้องเรียก{name}ด้วยชื่อที่{name}บอก ชื่อที่ไม่เคยใช้มาก่อน

        ทั้งหน้าหนาว{name}ไม่ออกจากห้องหลังมืด ปลายหน้าหนาวเห็นเกวียนน้ำมันคันหนึ่งผ่านหน้าโรงทอผ้า ล่อตัวอื่น คนขับคนอื่น ถังไม่มีรอยชอล์ก
      effects: { stats: { WIS: 1 }, hunted: { lamp_church: -1 }, flags: [went_to_ground_under_the_weavers_stair] }
    - id: pull_the_star_marks
      label: เดินทางไปให้ช่างเงินดาวที่หอนับดาวดึงรอยดาวออกทีละจุด
      requires: { trait: curse_star_marks, min_gold: 8 }
      text: |
        ช่างเงินดาวที่หอนับดาวเป็นเอลฟ์ที่ไม่ถามชื่อ ถามแต่ว่ามีกี่จุด นางใช้เข็มเงินดาวปลายงอจิ้มลงใต้ผิวทีละจุด แล้วดึงอะไรใสๆ เท่าเม็ดทรายออกมาวางเรียงบนผ้ากำมะหยี่สีดำ ทุกเม็ดเรืองแสงอยู่ครู่หนึ่งก่อนจะดับ เจ็บกว่าที่ใครเล่าไว้ทุกจุด

        นางคิดเงินเป็นจุด ไม่ลดให้ ตอนกลับ หลังใบหู{name}มีรอยเข็มเล็กๆ เป็นแถว ดับตะเกียงแล้วไม่มีอะไรเรืองแสงอีก
      effects: { gold: -8, hp: -2, lose_traits: [curse_star_marks], flags: [had_the_star_marks_pulled] }
