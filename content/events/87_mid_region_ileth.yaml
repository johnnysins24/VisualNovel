# ชุด 4 วัยกลางคนตามถิ่น: ป่าไอเลธ (ข้อห้ามของป่า ไม่โค่นไม้ที่ยังมีใบ ไม่ล่าแม่ที่มีลูกอ่อน · ข้อห้ามของลม ไม่ขังนกป่า)
# ห้าเรื่องตามแบบ: #1 ป่ากับปากท้อง · #2 คนอื่นขังนก · #3 ขอขมาป่า · #4 งานของถิ่นที่เปลี่ยนไป · #5 ธรรมเนียมเปลี่ยนชื่อของเอลฟ์
# คนในถิ่นพูดว่า ป่า ไม้ นก ไม่มีใครเรียกเจ้าเดิม เอลฟ์อายุเทียบมนุษย์ ห้ามนับปีของใคร
# คนใหม่: ธาลีเรีย (ileth_neighbour) เอลฟ์หญิงที่แลกของกับ{name}ที่ลานตะกร้า · อัลเวรา ย่าของธาลีเรียบนกิ่ง (มีแต่ในข้อความ)

- id: adult.region_ileth_the_red_cloth
  stage: adult
  scene: road
  weight: 22
  when:
    age: [41, 57]
    location_tag: ileth
  text: |
    ค่ายตัดไม้ของบริษัทอู่เรือเหาะตั้งอยู่ห่างหมู่บ้านชายป่าครึ่งวันเดิน หน้าแล้งทุกปีคนชายป่าเกือบทุกบ้านส่งคนไปทำงานที่ค่าย ลากซุง ผ่าไม้ หุงข้าวให้คนตัด ปีนี้{name}ก็ไป ค่าแรงที่ค่ายเลี้ยงบ้านได้ทั้งหน้าฝน

    ไม้ที่ค่ายตัดได้ตามสัญญากับราชสำนักคือไม้ยืนตาย ต้นที่ใบร่วงหมดแล้วไม่แตกยอดใหม่สองฤดู ไม้ไอเลธตายแล้วยังไม่ผุ อู่เรือเหาะในเวนทราสรับทุกท่อน แต่ไม้ยืนตายรอบค่ายหมดไปตั้งแต่ปีก่อน

    เช้านี้นายค่ายเดินผูกผ้าแดงไว้ที่ต้นไม้สิบต้นริมลำธาร ต้นที่ยังเขียวทั้งต้น เขาบอกคนชายป่าที่ยืนดูว่าต้นพวกนี้รากโดนน้ำเซาะ อีกไม่กี่ปีก็ตายเอง ยืนรอให้ตายก็เสียเวลา ใครตัดต้นที่ผูกผ้าแดงได้ค่าแรงสามเท่า ใครไม่ตัด กลับบ้านได้ตั้งแต่วันนี้ คนชายป่าทุกคนรู้ตั้งแต่ก่อนเดินได้ ไม้ที่ยังมีใบไม่โค่น
  choices:
    - id: go_home
      label: วางขวาน เก็บของกลับบ้านตั้งแต่เช้านี้
      text: |
        {name}เดินกลับหมู่บ้านคนเดียว ครึ่งทางมีอีกสองคนเดินตามมา ไม่มีใครพูดถึงผ้าแดง ทั้งสามคนพูดเรื่องฝนว่าปีนี้จะมาเร็วหรือช้า

        หน้าฝนปีนั้นบ้าน{name}กินข้าวผสมมันเทศเกือบทุกมื้อ หลังคาที่รั่วสองจุดยังไม่ได้ซ่อม ตอนฝนแรกตก{name}เอาหม้อสองใบไปรองน้ำ เสียงน้ำหยดลงหม้อดังทั้งคืนไม่เท่ากัน ใบหนึ่งเร็ว ใบหนึ่งช้า
      effects: { gold: -3, taboo: { forest: keep }, flags: [left_the_camp_over_the_red_cloth] }
    - id: fell_it
      label: ยกขวานไปที่ต้นแรกที่ผูกผ้าแดง
      text: |
        ไม้ไอเลธที่ยังเป็นเนื้อแข็งกว่าที่คิด ขวานกระดอนสามครั้งกว่าจะกินเนื้อ ยางใสไหลออกจากรอยขวานเหมือนน้ำ กลิ่นเหมือนหญ้าที่เพิ่งตัด ตกบ่ายต้นแรกล้มลงข้ามลำธาร นกทั้งฝูงบินขึ้นจากเรือนยอดพร้อมกันจนฟ้าตรงนั้นมืดไปอึดใจหนึ่ง

        ค่าแรงสามเท่าจ่ายทุกเจ็ดวัน {name}ซ่อมหลังคาทันก่อนฝน ซื้อเกลือได้ทั้งปี คืนแรกที่กลับถึงบ้าน หมาของบ้านข้างๆ ดมขากางเกง{name}แล้วถอยออกไปนอนที่อื่น
      effects: { gold: 5, taboo: { forest: break }, flags: [felled_a_green_tree] }
    - id: find_the_dead_ones
      label: บอกนายค่ายว่าจะเดินเข้าป่าลึกไปหาไม้ยืนตายมาให้ครบสิบต้นแทน
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          นายค่ายหัวเราะ แต่ให้เวลาเจ็ดวัน {name}เดินลึกเข้าไปตามลำธาร ดูเปลือกไม้ ดูกิ่งที่ไม่มีนกเกาะ ดูโคนต้นที่มีเห็ดชั้นขึ้นเป็นขั้น วันที่สามเจอต้นแรก วันที่หกเจอครบสิบ ไกลจากค่ายเกือบวันเดิน ต้องลากซุงออกมาตามลำธารทีละท่อน

          นายค่ายจ่ายค่าแรงปกติ ไม่ใช่สามเท่า ผ้าแดงสิบผืนยังผูกอยู่ที่ต้นริมลำธารจนหมดหน้าแล้ง ไม่มีใครตัด ปลายฤดูลมพัดผ้าผืนหนึ่งหลุดลอยลงลำธารไป
        effects: { gold: 2, stats: { WIS: 1 }, taboo: { forest: keep }, flags: [hauled_dead_timber_instead] }
      failure:
        text: |
          ป่าลึกกว่าที่{name}จำได้ ทางที่เคยเดินมีรากไม้ขึ้นขวางจนต้องอ้อม วันที่เจ็ด{name}หาไม้ยืนตายเจอแค่สามต้น นายค่ายยืนรออยู่ริมลำธารพร้อมขวาน บอกว่าอีกเจ็ดต้นที่เหลือมีผ้าแดงผูกรออยู่แล้ว

          {name}ตัดต้นที่ผูกผ้าแดงต้นหนึ่งตอนพลบค่ำ มือพองจากการลากซุงมาหกวัน ขวานพลาดไปโดนหน้าแข้งครั้งหนึ่ง ไม่ลึก ค่าแรงได้ครึ่งของที่สัญญา
        effects: { gold: 2, hp: -1, taboo: { forest: break }, flags: [hauled_dead_timber_and_felled_one] }
    - id: tell_the_bough
      label: ปีนขึ้นไปบอกกิ่งว่าค่ายผูกผ้าแดงไว้ที่ต้นไหนบ้าง
      requires: { flag: origin_elf_bough }
      text: |
        คนบนกิ่งฟังจนจบแล้วดึงบันไดเชือกขึ้น คืนนั้นไม่มีเสียงอะไรในป่ามากกว่าคืนอื่น เช้าวันต่อมาผ้าแดงสิบผืนหายไปจากต้นริมลำธาร ไปผูกอยู่ที่ต้นไม้ยืนตายสิบต้นลึกเข้าไปในป่า แต่ละต้นห่างกันพอดีกับระยะที่วัวลากซุงเดินได้หนึ่งวัน

        นายค่ายด่าอยู่ทั้งเช้า พิสูจน์อะไรไม่ได้ สุดท้ายต้องส่งคนไปตัดตามผ้าแดงที่ผูกใหม่ {name}ได้ค่าแรงปกติ ไม่มีใครในค่ายถามว่า{name}ขึ้นไปบนกิ่งคืนไหน
      effects: { gold: 1, taboo: { forest: keep }, flags: [told_the_bough_about_the_red_cloth] }

- id: adult.region_ileth_the_singing_cages
  stage: adult
  scene: market
  weight: 22
  when:
    age: [43, 60]
    location_tag: ileth
  text: |
    พ่อค้าจากเวนทราสมาตั้งแผงที่ลานตะกร้าทุกปลายฝน รับซื้อผ้าทอใยไม้กับยางสน ปีนี้เขาพาลูกจ้างมาสามคน กับกรงไม้ไผ่ซ้อนกันเต็มเกวียน คนรวยในเวนทราสอยากได้นกป่าไอเลธไว้ร้องเพลงในห้องรับแขก นกขนเขียวหางยาวที่ร้องเป็นสามจังหวะ ตัวเดียวขายได้พอค่าเช่าห้องในเมืองครึ่งปี

    ลูกจ้างของเขากางตาข่ายที่ชายป่าตั้งแต่สาง ตอนสายมีนกในกรงแล้วเจ็ดตัว ร้องกันทั้งเกวียน นกที่ยังอยู่ข้างนอกเกาะกิ่งรอบลานตะกร้า ร้องตอบ

    คนชายป่าไม่ขังนกป่า ไม่มีใครบอกเขา หรือบอกแล้วเขาไม่ฟัง ตอนบ่ายเขามาขอให้{name}ช่วยถือตาข่ายอีกข้าง แบ่งให้ตัวละเหรียญ คนอื่นที่ลานตะกร้าก้มหน้าทำงานของตัวเอง ตะกร้าจากข้างบนลงมาครึ่งเช้าแล้วไม่ลงมาอีก
  choices:
    - id: open_the_cages
      label: รอจนดึก แล้วไปเปิดกรงทีละใบ
      text: |
        กรงไม้ไผ่ผูกด้วยเชือกป่าน แก้ง่ายกว่าที่คิด นกตัวแรกไม่ยอมออก ตัวที่สองออกแล้วตัวแรกก็ตาม {name}เปิดได้หกกรง กรงที่เจ็ดมีกระดิ่งผูกไว้ที่ประตู

        ลูกจ้างสองคนวิ่งออกมาจากใต้เกวียน คนหนึ่งตีด้วยด้ามตาข่ายเข้าที่ไหล่ อีกคนเตะซ้ำตอน{name}ล้ม พ่อค้าตามออกมาด่าเป็นภาษาเมืองหลวง ด่าจนหมดเสียง แล้วเก็บกรงเปล่าขึ้นเกวียนออกจากหมู่บ้านก่อนสาง เช้านั้นนกขนเขียวสามตัวเกาะอยู่บนหลังคาบ้าน{name} ร้องเป็นสามจังหวะ
      effects: { hp: -2, taboo: { wind: keep }, flags: [opened_the_bird_cages] }
    - id: hold_the_net
      label: ถือตาข่ายอีกข้างให้เขาจนเย็น
      text: |
        ตาข่ายเส้นเล็กจนมองไม่เห็นถ้าไม่มีแดดส่อง นกบินเข้ามาเองทีละตัว ติดแล้วดิ้น ยิ่งดิ้นยิ่งพัน {name}ต้องแกะขาเล็กๆ ออกจากตาข่ายด้วยนิ้วโดยไม่ให้หัก ตกเย็นได้อีกสามตัว พ่อค้าจ่ายสามเหรียญตามที่บอก

        คืนนั้นนกในกรงร้องทั้งคืน นกข้างนอกร้องตอบทั้งคืน คนในหมู่บ้านนอนไม่หลับไปตามกัน ตอนพ่อค้าออกจากหมู่บ้าน ฝูงนกตามเกวียนไปจนพ้นชายป่า บินต่ำ ไม่ร้อง
      effects: { gold: 3, taboo: { wind: break }, flags: [held_the_bird_net] }
    - id: look_away
      label: ส่ายหน้า แล้วกลับไปทำงานของตัวเองเหมือนคนอื่นที่ลาน
      text: |
        {name}บอกว่ามือไม่ว่าง พ่อค้าไปขอคนอื่น ได้เด็กหนุ่มจากหมู่บ้านถัดไปมาถือแทน ตกเย็นกรงเต็มสิบสองกรง

        สามวันต่อมาพ่อค้าออกจากหมู่บ้าน หน้าต่างบ้าน{name}ปิดไว้ทุกบานเพราะลมแรงผิดฤดู ลมพัดมาจากทางป่าทั้งวัน ดึงหลังคาบ้านปลายหมู่บ้านหลุดไปหนึ่งแผง แล้วหยุดเองตอนค่ำ เหมือนไม่เคยพัด
      effects: { world: { land: 1 }, flags: [looked_away_from_the_cages] }
    - id: hawk_call
      label: ผิวปากเสียงที่คนชายป่าใช้บอกกันว่ามีเหยี่ยว
      requires: { taboo: { id: wind, keeps: true } }
      text: |
        เสียงผิวปากนั้นต่ำ ยาว แล้วตัดสั้นตอนท้าย คนชายป่ารุ่นก่อนใช้บอกกันว่ามีเหยี่ยวอยู่เหนือหัว ให้เก็บไก่เข้าเล้า {name}ผิวครั้งเดียว นกทุกตัวรอบลานตะกร้าเงียบพร้อมกัน แล้วขึ้นไปเกาะสูงเหนือระยะตาข่าย

        สามวันต่อมาตาข่ายของพ่อค้าว่างทุกเช้า เขาขนกรงเจ็ดกรงที่มีอยู่ออกจากหมู่บ้านไปด้วยหน้าบึ้ง ไม่รู้ว่าเกิดอะไรขึ้น เช้าวันต่อมาตะกร้าที่บ้าน{name}ส่งขึ้นไปกลับลงมาพร้อมผ้าทอผืนหนึ่งที่ไม่มีใครสั่ง
      effects: { stats: { WIS: 1 }, taboo: { wind: keep }, flags: [whistled_the_hawk_call] }

- id: adult.region_ileth_taller_than_a_head
  stage: adult
  scene: road
  weight: 22
  when:
    age: [41, 55]
    location_tag: ileth
  text: |
    ปีนี้ป่าอึดอัด คนชายป่าพูดกันแบบนั้น ไม่มีใครอธิบายได้ดีกว่านี้ ต้นไม้ลั่นตอนกลางคืนทั้งที่ไม่มีลม กวางเดินเข้ามาถึงลานตะกร้ากลางวันแสกๆ ยืนดูคนแล้วเดินกลับ รากไม้ดันพื้นลานจนหินปูแตกไปสองแผ่น

    ตาเฒ่าพรานคนสุดท้ายของชายป่านั่งอยู่ที่กองไฟกลางหมู่บ้านทุกคืน เขาจำวิธีเก่าได้ คนที่เคยโค่นไม้ที่ยังมีใบ หรือเอาชีวิตแม่ที่ยังมีลูกอ่อน ให้ปลูกไม้หนึ่งต้นด้วยมือตัวเองตรงที่เคยฝืน แล้วอยู่ดูมันจนสูงท่วมหัว ห้ามย้ายไปไหนไกลกว่าที่เดินกลับมาดูได้ก่อนค่ำ ห้ามให้คนอื่นรดน้ำแทน ต้นไม้ไอเลธโตเร็วกว่าไม้ที่อื่น แต่ไม่เร็วพอให้ใครอยากทำ

    คืนนี้เขาพูดเรื่องนี้ซ้ำ แล้วยื่นต้นกล้าในห่อใบตองให้คนที่นั่งใกล้กองไฟที่สุด คนนั้นคือ{name}
  choices:
    - id: plant_and_stay
      label: ปลูกต้นกล้าตรงที่ตัวเองเคยฝืน แล้วอยู่ดูมันจนสูงท่วมหัว
      requires: { taboo: { id: forest, unbroken: false } }
      text: |
        ที่ตรงนั้น{name}เดินไปถึงได้โดยไม่ต้องถามทางใคร {name}ขุดหลุม ปลูกต้นกล้า หาบน้ำมารดด้วยมือตัวเองทุกเช้า ปีแรกต้นกล้าสูงถึงเข่า งานที่ต้องเดินทางไปไกล{name}ปฏิเสธหมด รายได้ทั้งบ้านมาจากงานที่ทำได้ในระยะครึ่งวันเดิน

        หน้าฝนผ่านไปหลายครั้ง ไม่มีใครนับ ต้นกล้าสูงถึงเอว ถึงอก ถึงไหล่ หน้าแล้งหนึ่งมีกวางมาเล็มยอด{name}นอนเฝ้าอยู่ข้างต้นสามคืน แล้ววันหนึ่งในต้นหน้าฝน{name}ยืนข้างมันตอนรดน้ำแล้วต้องเงยหน้าดูยอด ตาเฒ่าพรานเดินมาดูไม่ไหวแล้ว ลูกชายของเขามายืนดูแทน บอกว่าพ่อเขาเคยพูดว่าคนที่อยู่จนต้องเงยหน้า ป่าจำหน้าได้
      effects: { gold: -4, stats: { CON: 1 }, taboo: { forest: mend }, flags: [planted_and_stayed] }
    - id: plant_for_the_camp
      label: ปลูกต้นกล้าแทนไม้ที่ค่ายตัดไป ตรงตอที่ใกล้หมู่บ้านที่สุด
      requires: { taboo: { id: forest, unbroken: true } }
      text: |
        {name}ไม่มีอะไรของตัวเองค้างอยู่กับป่า แต่ตอไม้สดจากค่ายตัดไม้มีอยู่ทั่วชายป่า {name}เลือกตอที่ใกล้หมู่บ้านที่สุด ปลูกต้นกล้าลงข้างตอ รดน้ำทุกเช้าจนพ้นหน้าแล้ง ระหว่างนั้นรับงานได้แค่ครึ่งเดียว

        ตาเฒ่าพรานบอกว่าไม่ล้างอะไรให้ใคร เพราะคนที่ตัดไม่ได้มาปลูกเอง แต่ป่าจะรู้ว่ามีคนมาถาม ปลายปีป่าเงียบลง หรือ{name}ชินกับเสียงลั่นตอนกลางคืนแล้ว บอกไม่ได้ ต้นกล้าสูงถึงเข่า
      effects: { gold: -1, taboo: { forest: keep }, world: { land: -1 }, flags: [planted_for_the_camp] }
    - id: seed_from_the_bough
      label: ปีนขึ้นไปขอเมล็ดจากต้นแม่ของกิ่ง มาปลูกแทนต้นกล้าในห่อใบตอง
      requires: { flag: origin_elf_bough }
      text: |
        คนบนกิ่งหย่อนเมล็ดลงมาให้ในตะกร้า ห่อด้วยผ้าทอ เมล็ดเดียว ใหญ่เท่าไข่นกพิราบ ตาเฒ่าพรานเห็นแล้วเงียบไป บอกว่าต้นกล้าในห่อใบตองเขาเก็บมาจากโคนต้นที่ไหนก็ได้ ส่วนเมล็ดนี้มาจากต้นที่บ้านของ{name}อยู่

        {name}ปลูกที่ตอไม้สดที่ใกล้หมู่บ้านที่สุด ยอดอ่อนแทงขึ้นมาในเจ็ดวัน เร็วจนคนในหมู่บ้านมายืนดู ป่าที่ลั่นตอนกลางคืนเงียบลงทีละคืน
      effects: { stats: { WIS: 1 }, taboo: { forest: keep }, world: { land: -1 }, flags: [planted_a_bough_seed] }
    - id: hand_it_back
      label: ส่งห่อใบตองคืนให้ตาเฒ่าพราน
      text: |
        ตาเฒ่ารับห่อคืนโดยไม่ถาม ยื่นให้คนถัดไป คนถัดไปก็ส่งต่อ ห่อใบตองเวียนรอบกองไฟหนึ่งรอบแล้วกลับมาวางข้างตัวเขา

        เช้าวันต่อมาเขาเดินไปปลูกเอง ที่ตอไม้ใกล้หมู่บ้าน ขาเขาไม่ดีแล้ว เดินไปกลับใช้เวลาครึ่งเช้า {name}เห็นเขาเดินผ่านหน้าบ้านทุกวันหลังจากนั้น ถือกระบอกน้ำไผ่ไปทางเดียว
      effects: { flags: [handed_back_the_sapling] }

- id: adult.region_ileth_the_brass_winch
  stage: adult
  scene: market
  weight: 22
  when:
    age: [42, 58]
    location_tag: ileth
  text: |
    หอนับดาวบนยอดไม้ส่งจดหมายกับเครื่องมือขึ้นลงมากขึ้นทุกปี ลังเครื่องมือจากเวนทราสหนักจนคนคุมเชือกที่ลานตะกร้าต้องเรียกคนหนุ่มมาช่วยดึงสี่คน ปีนี้ช่างจากเวนทราสมาติดรอกทองเหลืองกับกว้านเหล็กที่ลานตะกร้า กว้านตัวเดียวยกลังได้หนักเท่าคนสี่คนดึง หน้าปัดบอกน้ำหนักติดอยู่ข้างกว้าน

    คนหมุนกว้านต้องอ่านหน้าปัดเป็น และพูดภาษาข้างบนพอจะขานขึ้นไปว่าพร้อม หอนับดาวจ่ายค่าแรงเป็นเงินเมืองหลวง ไม่ใช่ผ้าทอหรือยางสน ทั้งหมู่บ้านอยากได้งานนี้ ทั้งหมู่บ้านไม่ไว้ใจกว้าน อาเธล คนคุมเชือกคนเก่า ยืนดูช่างขันสลักตัวสุดท้าย มือยังกำเชือกป่านขดเก่าไว้

    ตะกร้าผ้าทอของเอลฟ์ยังลงมาด้วยเชือกป่านทุกเช้าเหมือนเดิม ข้างบนไม่ยอมให้ผ้าของตัวเองแตะเหล็ก
  choices:
    - id: learn_the_winch
      label: ขอลองหมุนกว้านยกลังแรก อ่านหน้าปัดเอง
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}ขานขึ้นไปด้วยคำที่ลงท้ายเสียงสูง ข้างบนขานตอบ ลังเครื่องมือลอยขึ้นตามจังหวะกว้าน เข็มบนหน้าปัดสั่นอยู่ตรงขีดเดิมตลอดทาง {name}ผ่อนกว้านช้าลงตอนลังเข้าใกล้กิ่ง ไม่ให้กระแทก ช่างจากเวนทราสจดชื่อ{name}ลงสมุดเป็นคนแรก

          ค่าแรงเดือนแรกเป็นเหรียญใหม่จากเมืองหลวง ขอบยังคม เด็กในหมู่บ้านขอจับดูกันทั้งบ้าน ตอนเช้า{name}ยังยืนข้างคนคุมเชือกคนเก่าตอนตะกร้าผ้าทอลง ช่วยเขาดึงเชือกป่านโดยไม่มีใครจ้าง
        effects: { gold: 2, stats: { INT: 1 }, flags: [works_the_basket_winch] }
      failure:
        text: |
          ลังขึ้นไปได้ครึ่งทาง {name}อ่านหน้าปัดผิดขีด ปล่อยมือจากด้ามกว้านเร็วไปจังหวะหนึ่ง ด้ามเหล็กหมุนย้อนกลับมาฟาดแขนท่อนล่าง ลังร่วงลงมาสองช่วงตัวก่อนเฟืองขัดจะจับไว้ได้

          ในลังเป็นแก้วส่องดาวสามอัน แตกไปหนึ่งอัน หอนับดาวไม่ให้{name}หมุนกว้านอีก แขนบวมเขียวทั้งเดือน คนคุมเชือกคนเก่าพันแขนให้ด้วยใบไม้ต้ม ไม่เอ่ยถึงกว้านสักคำ
        effects: { hp: -2, flags: [dropped_the_star_hall_crate] }
    - id: keep_the_hand_rope
      label: ยืนดึงเชือกป่านต่อกับคนคุมเชือกคนเก่า ให้ตะกร้าของเอลฟ์ไม่ต้องแตะเหล็ก
      text: |
        ตะกร้าผ้าทอหนักน้อยกว่าลังเครื่องมือมาก แต่ลงมาทุกเช้า ทุกฤดู ไม่ขาดสักวัน {name}กับคนคุมเชือกคนเก่าผลัดกันดึง แขนของ{name}แข็งขึ้นทีละเดือนจนยกถังน้ำสองถังได้ไม่ต้องพัก

        ค่าแรงไม่มี มีแต่ผ้าทอที่ข้างบนหย่อนเกินลงมาให้ทุกสิ้นเดือน ผืนหนึ่งเล็กกว่าฝ่ามือ ปลายปี{name}มีผ้าแบบนั้นสิบสองผืน เย็บต่อกันเป็นผ้าห่มได้หนึ่งผืน
      effects: { stats: { STR: 1 }, flags: [kept_the_hand_rope] }
    - id: carry_the_letters
      label: รับงานเดินจดหมายของหอนับดาวไปส่งที่สถานีรถไฟสองวันเดิน
      text: |
        ถุงจดหมายของหอนับดาวผูกด้วยเชือกสีน้ำเงิน ประทับครั่งทุกซอง จ่าหน้าถึงคนในเวนทราสที่{name}ไม่รู้จัก บางซองหนาจนพับไม่ได้ {name}เดินไปกลับเดือนละสองเที่ยว ได้ค่าแรงเป็นเงินเมืองหลวงเหมือนคนหมุนกว้าน

        เที่ยวที่หกนายสถานีคืนถุงจดหมายตอบกลับมาให้ถือขึ้นไป ถุงเบากว่าขาไปครึ่งหนึ่ง เที่ยวต่อๆ มาก็เบาเท่านั้นทุกครั้ง
      effects: { gold: 3, flags: [carries_the_star_hall_letters] }
    - id: wrap_the_hook
      label: ขึ้นไปพูดแทนกิ่ง ขอให้หุ้มตะขอกว้านด้วยเปลือกไม้ก่อนใช้กับของจากข้างบน
      requires: { flag: origin_elf_bough }
      text: |
        ช่างจากเวนทราสไม่เข้าใจว่าเปลือกไม้จะช่วยอะไร คนจากหอนับดาวเข้าใจ เขาสั่งให้ช่างทำตาม {name}ลอกเปลือกไม้จากกิ่งที่หักเองตามลม พันรอบตะขอเหล็กสามชั้น ผูกด้วยเชือกป่านเส้นเก่าของคนคุมเชือก

        เช้าต่อมาตะกร้าผ้าทอลงมาทางกว้านเป็นครั้งแรก คนทั้งลานตะกร้ายืนดู ไม่มีใครพูดว่าดีหรือไม่ดี ปลายเดือนคนบนกิ่งขอให้เปลี่ยนเปลือกไม้ใหม่ เพราะเปลือกเก่าเริ่มมีกลิ่นเหล็ก
      effects: { stats: { CHA: 1 }, flags: [wrapped_the_winch_hook] }

- id: adult.region_ileth_the_last_call_of_a_name
  stage: adult
  scene: market
  weight: 22
  when:
    age: [44, 60]
    location_tag: ileth
  people:
    - { id: ileth_neighbour, name: ธาลีเรีย, gender: f, race: elf, bond: friend, closeness: 1, age: 45 }
  text: |
    เอลฟ์เปลี่ยนชื่อทุกร้อยปี ชื่อเต็มคือทุกชื่อต่อกัน แต่หลังวันเปลี่ยน ชื่อเก่าจะไม่มีใครเรียกออกเสียงอีก ธรรมเนียมระหว่างหมู่บ้านชายป่ากับกิ่งข้างบนมีมาตั้งแต่ก่อนมีลานตะกร้า วันที่เอลฟ์คนหนึ่งเปลี่ยนชื่อ คนข้างล่างที่แลกของกับเอลฟ์คนนั้นมานานที่สุดจะยืนที่โคนต้น เรียกชื่อเก่าขึ้นไปเป็นครั้งสุดท้าย แล้วเอลฟ์คนนั้นจะขานตอบลงมาด้วยชื่อใหม่

    ปีนี้ถึงคราวของอัลเวรา ย่าของธาลีเรีย อัลเวราหย่อนตะกร้าลงมาแลกของที่ลานตะกร้าทุกเช้า ตั้งแต่วันแรกที่{name}ไปยืนที่ลานนั้น ตะกร้าของนางมีลูกสนแห้งติดมาหนึ่งลูกเสมอ ไม่มีใครรู้ว่าทำไม คนที่แลกของกับนางมาก่อนหน้า{name} ตายไปบ้าง ย้ายเข้าเมืองไปบ้าง จนไม่เหลือใคร

    ธาลีเรียลงมาจากกิ่งเอง ลงบันไดเชือกมาถึงพื้นเอง เอลฟ์ไม่ค่อยทำแบบนี้ นางมายืนรอ{name}ที่ลานตะกร้าตั้งแต่เช้ามืด บอกว่าย่าขอให้{name}เป็นคนเรียก พรุ่งนี้ตอนแดดแรกแตะยอดไม้
  choices:
    - id: call_it_plain
      label: ยืนที่โคนต้นตอนแดดแรก แล้วเรียกชื่ออัลเวราขึ้นไปครั้งเดียว
      text: |
        {name}เรียกชื่อนั้นเสียงดังกว่าที่ตั้งใจ เสียงขึ้นไปตามลำต้น ทุกกิ่งเงียบ ครู่หนึ่งเสียงหญิงชราขานลงมา ชื่อใหม่สามพยางค์ในภาษาข้างบน {name}จำได้แค่พยางค์แรก แล้วไม่ต้องจำ เพราะชื่อนั้นเป็นของคนบนกิ่ง

        เช้าวันต่อมาตะกร้าของนางลงมาเหมือนทุกเช้า มีลูกสนแห้งหนึ่งลูกเหมือนทุกเช้า {name}ยืนหน้าตะกร้าแล้วเพิ่งรู้ว่าไม่มีชื่อจะเรียกนางอีกแล้ว ธาลีเรียยืนอยู่ข้างๆ ขำจนต้องเอามือปิดปาก
      effects: { stats: { WIS: 1 }, people: [{ id: ileth_neighbour, closeness: 1 }], flags: [called_alvera_last] }
    - id: call_it_with_the_pinecone
      label: เรียกชื่อนาง แล้วชูลูกสนแห้งลูกที่เก็บไว้จากตะกร้าใบแรกขึ้นไปด้วย
      text: |
        ลูกสนลูกนั้นอยู่ในกล่องเข็มของบ้าน{name}มาตั้งแต่วันนั้น แห้งจนเกล็ดกางทุกเกล็ด {name}ชูมันขึ้นสุดแขน แล้วเรียกชื่ออัลเวราขึ้นไป ข้างบนเงียบนานกว่าที่ธาลีเรียบอกว่าจะเงียบ

        เสียงที่ขานลงมาเป็นชื่อใหม่ แล้วตามด้วยคำในภาษาข้างบนอีกคำหนึ่ง ธาลีเรียไม่ยอมแปล นางบอกว่าย่าไม่เคยพูดคำนั้นกับใครที่อยู่บนพื้น ตะกร้าเช้าต่อมามีลูกสนสองลูก
      effects: { stats: { CHA: 1 }, people: [{ id: ileth_neighbour, closeness: 1 }], flags: [called_alvera_with_the_pinecone] }
    - id: someone_else
      label: บอกธาลีเรียว่าให้คนอื่นเรียก คนที่เสียงดังกว่า
      text: |
        ธาลีเรียไม่เถียง นางไปขอคนขายเกลือที่แลกของกับย่ามาน้อยกว่า{name}ครึ่งหนึ่ง เขาเรียกชื่อนั้นเสียงดังจนนกแตกฝูง เสียงขานตอบลงมาช้ากว่าปกติ

        {name}ยืนฟังอยู่หลังคนอื่นที่ลานตะกร้า ได้ยินชื่อเก่าเป็นครั้งสุดท้ายจากปากคนอื่น ตะกร้าของนางยังลงมาทุกเช้า ลูกสนยังมีหนึ่งลูกทุกครั้ง {name}เก็บไว้ทุกลูกตั้งแต่วันนั้น ไม่รู้จะเรียกเจ้าของมันว่าอะไร
      effects: { flags: [let_another_call_the_name] }
    - id: call_in_the_bough_tongue
      label: เรียกชื่อนางด้วยเสียงขึ้นลงแบบภาษาข้างบน แบบที่คนบนกิ่งเรียกกันเอง
      requires: { flag: origin_elf_bough }
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          ชื่ออัลเวราในภาษาข้างบนมีเสียงขึ้นตรงพยางค์กลาง แล้วค้างไว้นานกว่าที่คนพื้นจะกล้าค้าง {name}ค้างไว้เท่าที่ลมหายใจมี กิ่งทั้งต้นเงียบตั้งแต่พยางค์แรก

          ชื่อใหม่ขานลงมาทันทีที่{name}หยุด เหมือนรออยู่แล้ว คนชายป่าที่ยืนดูไม่เข้าใจทั้งสองชื่อ แต่ทุกคนรู้ว่าครั้งนี้ไม่เหมือนครั้งก่อนๆ ธาลีเรียกอดคอ{name}แน่นอยู่ครู่หนึ่ง เอลฟ์บนกิ่งไม่กอดใครแบบนี้
        effects: { stats: { CHA: 1 }, people: [{ id: ileth_neighbour, closeness: 2 }], flags: [called_alvera_in_the_bough_tongue] }
      failure:
        text: |
          เสียงขึ้นผิดพยางค์ ชื่อที่ขึ้นไปฟังเหมือนคำว่าเปลือกไม้แห้งในภาษาข้างบน {name}รู้ตัวตั้งแต่ยังไม่จบ แต่หยุดกลางชื่อไม่ได้

          ข้างบนเงียบไปครู่หนึ่ง แล้วเสียงหัวเราะของหญิงชราก็ดังลงมาก่อนชื่อใหม่ ชื่อใหม่ตามลงมาหลังจากนั้น ชัดทุกพยางค์ ธาลีเรียบอกว่าย่าจะเล่าเรื่องนี้ไปอีกร้อยปี
        effects: { people: [{ id: ileth_neighbour, closeness: 1 }], flags: [miscalled_alvera] }
