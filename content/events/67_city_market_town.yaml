# ชุด ม เมือง: เมืองตลาด (market_town ถิ่น arvel_village) แปดเรื่องตามแบบ "แปดเรื่องของหนึ่งเมือง"
# ย่าน: rail_side ย่านริมราง (คนมาใหม่ลงที่นี่) · weigh_square ลานโรงชั่ง · mill_lane ซอยโรงสี
# หน้าเดิมของเมือง: เพลเดน นายโรงชั่ง
# เมืองเล็กพอที่ทุกคนรู้ว่าใครค้างค่าเช่า ไม่มีใครเกิดในเมืองนี้ในเกม ทุกคนย้ายเข้ามา

# ---------- a ข้อเสนอให้ย้าย ----------
- id: adult.city_market_town_offer
  stage: adult
  weight: 12
  scene: market
  when:
    age: [19, 56]
    location_tag: arvel_village
    city: none
    not_flags: [institute_student, left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter]
    # คนของไส้ตะเกียงกับคนในสายงานของอาณาจักรไม่ย้ายเมืองไปหางาน (ชุด อ)
    not_orgs: [wick, crown_office, crown_army, crown_court]
  text: |
    ปลายฤดูเกี่ยว ลานโรงชั่งของเมืองตลาดมีตลาดจ้างงานสามวัน คนจ้างยืนฝั่งโรงชั่ง คนรับจ้างยืนฝั่งราง ตกลงกันได้เมื่อไรก็ผูกเชือกฟางไว้ที่ข้อมือกันคนละเส้น {name}เข้ามาเมืองนี้ทุกปลายฤดูด้วยงานของตัวเอง ปีนี้ฝั่งรางมีคนยืนไม่ถึงครึ่งของปีก่อน คนหนุ่มสาวของหมู่บ้านรอบเสาอีเซลขึ้นขบวนเที่ยงไปเวนทราสกันตั้งแต่ก่อนข้าวออกรวง

    วันที่สอง คนจ้างเดินข้ามลานมาถึงฝั่งรางแล้วยังหาคนไม่ได้ สามคนในนั้นมาหยุดที่{name} ถามเรื่องเดียวกันคนละแบบ ว่า{name}จะอยู่ในเมืองหลังตลาดวายไหม งานแบบที่{name}ทำ เมืองนี้ไม่มีคนทำมาตั้งแต่หน้าฝน

    คนที่สามเป็นหญิงแก่ ห่มผ้าคลุมไหล่สีน้ำตาลซีด นางมีห้องเหนือโรงพัสดุริมราง เป็นห้องของหลานชายที่ขึ้นรถไฟไปเมืองหลวงเมื่อต้นปี ค่าเช่าเก็บเมื่อครบรอบสัญญาเหมือนห้องอื่นในเมือง ข้อแม้มีข้อเดียว คนเช่าต้องหิ้วน้ำจากเครื่องสูบกลางย่านขึ้นมาให้นางทุกเช้า บันไดสูงเกินเข่าของนางแล้ว นางวางกุญแจทองเหลืองไว้บนเชือกฟางในมือ{name} แล้วบอกว่ารอได้ถึงน้ำค้างแข็งแรก
  choices:
    - id: take_the_grandsons_room
      label: รับกุญแจห้องเหนือโรงพัสดุ แล้วกลับไปขนของจากหมู่บ้านมาก่อนน้ำค้างแข็ง
      text: |
        ค่าเกวียนขนของจากหมู่บ้านเข้าเมืองหนึ่งเที่ยวกินเงินไปสองเหรียญ ของที่ใส่เกวียนไม่ลง{name}ยกให้บ้านข้างๆ ไป ห้องเหนือโรงพัสดุยังมีของของหลานชายอยู่ หมวกผ้าแขวนตะปูหลังประตู กับรอยมีดบนขอบหน้าต่างเป็นขีดนับวัน ขีดสุดท้ายไม่มีใครขีดต่อ

        ขบวนสินค้ากลางคืนวิ่งผ่านใต้หน้าต่างสองเที่ยว เตียงสั่นจนแก้วน้ำเดินไปชนผนัง เช้าแรก หญิงแก่เอาด้ามไม้กวาดเคาะพื้นจากห้องข้างล่างสามที ถังน้ำของนางวางรออยู่หัวบันไดแล้ว
      effects: { gold: -2, city: { move: market_town, home: room }, mark: ย้ายไปเมืองตลาด, flags: [moved_to_market_town, took_the_grandsons_room] }
    - id: loft_over_the_mill
      label: ไปต่อรองห้องใต้หลังคาโรงสีกับเจ้าของโรงสีในซอยโรงสี
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เจ้าของโรงสีพูดเร็ว หัวเราะเร็ว และนับเลขเร็วกว่านั้น {name}ปล่อยให้เขาพูดจนจบ แล้วบอกว่างานของ{name}เดือนละครั้งแลกกับห้องใต้หลังคาไม่คิดค่าเช่าปีแรก เขาหัวเราะ ตบบ่า{name} แล้วตกลงก่อนจะนึกขึ้นได้ว่าตัวเองตกลงไปแล้ว

          ห้องใต้หลังคามีแป้งเกาะทุกขอบไม้เหมือนหิมะบาง กลิ่นข้าวสาลีบดลอยขึ้นมาตามร่องพื้น ทุกคืนมีเสียงกังหันน้ำตีน้ำเป็นจังหวะช้าๆ อยู่ใต้หมอน
        effects: { stats: { CHA: 1 }, city: { move: market_town, district: mill_lane, home: room }, mark: ย้ายไปเมืองตลาด, flags: [moved_to_market_town, loft_over_the_mill] }
      failure:
        text: |
          เจ้าของโรงสีฟังข้อเสนอของ{name}แล้วหัวเราะ บอกราคาค่าเช่าของตัวเอง แล้วบอกว่าราคานี้รวมแป้งที่จะเกาะเสื้อผ้า{name}ทุกวันแล้ว {name}ต่อได้แค่เศษเหรียญ ปลายฤดูขนของเข้าซอยโรงสีพร้อมเงินที่เบาลงสองเหรียญ

          ห้องใต้หลังคามีแป้งเกาะทุกขอบไม้ ตอนเช้าเจ้าของโรงสีชอบตะโกนขึ้นมาถามว่า{name}ยังอยู่ไหม แล้วหัวเราะเองก่อนรอคำตอบ
        effects: { gold: -2, city: { move: market_town, district: mill_lane, home: room }, mark: ย้ายไปเมืองตลาด, flags: [moved_to_market_town] }
    - id: stay_in_the_village
      label: แก้เชือกฟางที่ข้อมือคืนให้นาง แล้วกลับหมู่บ้านไปกับเกวียนเปล่า
      text: |
        หญิงแก่รับกุญแจคืน ม้วนเชือกฟางพันรอบกุญแจแล้วเก็บใส่อกเสื้อ บอกว่าปีหน้าห้องนั้นอาจยังว่าง {name}นั่งเกวียนเปล่ากลับหมู่บ้านตอนบ่าย ล้อเกวียนกระแทกร่องทางจนกระดานท้ายเกวียนดังตลอดทาง

        ต้นปีต่อมา ขบวนเที่ยงพาคนหนุ่มสาวจากหมู่บ้านของ{name}ไปอีกสามคน งานที่เมืองตลาดเคยเรียกหา คนในหมู่บ้านเดินมาเคาะประตูบ้าน{name}แทน
      effects: { flags: [stayed_out_of_the_market_town] }

# ---------- b ย่าน: ซอยโรงสี ----------
- id: adult.city_market_town_mill_dust
  stage: adult
  weight: 33
  when:
    age: [19, 64]
    city: market_town
  text: |
    ซอยโรงสีอยู่ด้วยแป้ง โรงสีเจ็ดโรงเรียงริมลำรางเดียวกัน กังหันน้ำหมุนตั้งแต่สางจนค่ำในฤดูที่ข้าวขึ้นลาน แป้งลอยออกมาทางประตูทุกบานจนหลังคาทั้งซอยขาวเหมือนเพิ่งมีน้ำค้างแข็ง คนซอยนี้ห้ามเด็กเล่นไฟ ห้ามจุดตะเกียงในโรงหลังตะวันตกดิน และรู้ว่าไฟในโรงสีไม่ดับด้วยการสาดน้ำ แป้งที่ลอยอยู่ในห้องลุกได้ทั้งห้องในอึดใจเดียว ต้องปิดประตูหน้าต่างให้สนิท แล้วตีไฟที่ลามออกมาด้วยกระสอบชุบน้ำ

    กลางดึกคืนหนึ่ง ระฆังมือของซอยดังรัว โรงสีหลังที่สามจากหัวซอยมีแสงส้มลอดใต้ประตู เจ้าของโรงยืนอยู่หน้าโรงในชุดนอน ร้องบอกทุกคนว่าคนงานลืมตะเกียงไว้บนกองกระสอบ คนซอยโรงสีต่อแถวจากเครื่องสูบน้ำกลางซอยแล้ว ถังน้ำส่งต่อกันมาเพื่อชุบกระสอบ ไม่ได้สาดเข้าประตู

    บนหลังคาโรงยังมีช่องลมเปิดค้างไว้หนึ่งช่อง ทุกครั้งที่ลมพัด ไฟข้างในหายใจตามจนแสงใต้ประตูกะพริบ
  choices:
    - id: join_the_sack_line
      label: เข้าแถวส่งถังน้ำ ชุบกระสอบส่งให้คนที่ยืนตีไฟหน้าประตู
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ถังน้ำผ่านมือ{name}ไปจนนับไม่ได้ กระสอบชุบน้ำหนักจนต้องใช้สองมือส่ง คนหน้าแถวตีไฟที่ลามออกมาตามขอบประตูทีละจุด ใกล้รุ่ง ไฟข้างในหายใจอ่อนลงจนแสงใต้ประตูกลายเป็นสีแดงคล้ำ แล้วดับไป

          ตอนสางทั้งแถวนั่งลงบนขอบลำราง มือทุกคนเปื่อยน้ำ หน้าเปื้อนเขม่าปนแป้งเป็นสีเทา คนซอยโรงสีที่นั่งข้าง{name}ยื่นขนมปังครึ่งก้อนมาให้ ไม่ได้ถามว่าอยู่ซอยไหน
        effects: { stats: { CON: 1 }, city: { merit: 1 }, flags: [stood_in_the_mill_fire_line] }
      failure:
        text: |
          คนหน้าแถวแง้มประตูโรงเพื่อตีไฟที่ลามมาถึงวงกบ ลมจากข้างนอกพุ่งเข้าไป ไฟข้างในพองออกมาเป็นก้อนส้มทางช่องประตู {name}ยืนอยู่แถวที่สาม ไอร้อนเลียแขนทั้งสองข้างจนขนแขนหงิกเป็นเม็ด

          ไฟดับตอนเกือบสาง หลังคาโรงหายไปครึ่งหนึ่ง {name}พันแขนด้วยผ้าชุบน้ำเย็นอยู่สามวัน ผิวลอกเป็นแผ่นบางเหมือนเปลือกหัวหอม
        effects: { hp: -2, flags: [scorched_at_the_mill_fire] }
    - id: shut_the_roof_hatch
      label: ปีนบันไดข้างโรงขึ้นไปดึงฝาช่องลมบนหลังคาให้ปิด
      requires: { city: { district: [mill_lane] } }
      text: |
        คนซอยโรงสีรู้ว่าฝาช่องลมของทุกโรงมีเชือกดึงอยู่ข้างปล่อง ไม่ต้องเอามือแตะฝา {name}ปีนบันไดลิงข้างโรงขึ้นไป หลังคาร้อนจนแป้งที่เกาะอยู่ไหม้เป็นจุดดำๆ ใต้ฝ่าเท้า เชือกดึงขึ้นรากับเขม่า ดึงครั้งแรกไม่มา ครั้งที่สองฝาช่องลมปิดลงเสียงดังตึง

        แสงใต้ประตูหรี่ลงทันที คนหน้าแถวตีไฟที่เหลือจนดับก่อนเที่ยงคืน ฝ่ามือของ{name}มีรอยเชือกไหม้เป็นทางยาว เจ้าของโรงเอาเหล้าข้าวสาลีมาราดล้างให้เองตอนสาง
      effects: { hp: -1, city: { merit: 1 }, flags: [shut_the_mill_hatch] }
    - id: carry_out_the_grain
      label: ไปช่วยเจ้าของข้าวขนกระสอบออกจากโรงเก็บข้างๆ ก่อนไฟลามไปถึง
      text: |
        โรงเก็บข้างโรงสีมีข้าวสาลีของสามหมู่บ้านกองรอสี กระสอบละมีชื่อหมู่บ้านเขียนด้วยสีดำ {name}กับชาวนาที่นอนเฝ้าข้าวแบกกระสอบออกไปวางเรียงกลางซอยจนหมดโรง ไฟไม่ได้ลามมาถึงโรงเก็บ แต่ไม่มีใครรู้จนสาง

        ชาวนาหมู่บ้านหนึ่งยัดเหรียญใส่มือ{name}ตอนเช้า บอกว่าเป็นค่าหลังของ{name} ส่วนคนซอยโรงสีจำได้ว่าคืนนั้น{name}ยืนอยู่ฝั่งโรงเก็บ ไม่ได้อยู่ในแถวส่งถัง
      effects: { gold: 1, flags: [carried_grain_from_the_mill_fire] }

# ---------- c ย่าน: ย่านริมราง ----------
- id: adult.city_market_town_unclaimed_parcels
  stage: adult
  weight: 33
  scene: station
  when:
    age: [19, 64]
    city: market_town
  text: |
    ย่านริมรางอยู่ด้วยของที่รถไฟทิ้งไว้ ขบวนเที่ยงลงคนกับห่อของสำหรับทุกหมู่บ้านรอบเสาอีเซล คนแบกของรับห่อไปส่ง ห้องเช่าเหนือโรงพัสดุรับคนที่ลงผิดสถานี เตาขนมปังหน้าชานขายให้คนที่รอรถ ห่อที่ไม่มีใครมารับไปกองอยู่ในห้องหลังของสถานีจนครบปี

    หลังเกี่ยวทุกปี นายสถานีขนห่อที่ครบปีออกมาวางบนโต๊ะยาวกลางชาน ห่อละหนึ่งเหรียญ ไม่ให้แกะดูก่อน เงินที่ได้ใช้ซื้อน้ำมันตะเกียงของชานไปทั้งปี ปีนี้มียี่สิบสามห่อ ห่อหนึ่งจ่าหน้าด้วยลายมือตัวกลมบรรจง ถึงหญิงคนหนึ่งในหมู่บ้านที่ห่างไปสองชั่วโมงเดิน นายสถานีบอกว่านางตายไปตั้งแต่หน้าหนาวที่แล้ว ห่ออีกห่อเป็นของคนที่ย้ายออกไปจากถิ่นนี้แล้ว ไม่มีใครรู้ว่าไปไหน

    คนย่านริมรางยืนล้อมโต๊ะ หยิบห่อขึ้นมาชั่งในมือ เขย่าฟังเสียง แล้ววางคืน
  choices:
    - id: buy_one_blind
      label: จ่ายหนึ่งเหรียญซื้อห่อที่หนักที่สุดโดยไม่แกะดูก่อน
      requires: { min_gold: 1 }
      text: |
        ห่อที่{name}เลือกหนักเพราะข้างในเป็นรองเท้าหุ้มข้อหนังวัวคู่หนึ่ง ยังไม่เคยใส่ พื้นตอกตะปูทองเหลืองเรียงสองแถว ในรองเท้าข้างขวามีกระดาษพับเล็กๆ เขียนว่าใส่ตอนหน้าหนาวนะแม่ ลายมือเดียวกับที่จ่าหน้าห่อ

        รองเท้าคู่นั้นเล็กกว่าเท้าของ{name}สองนิ้ว {name}ไม่ได้ถามใครในย่านริมรางว่าใส่ได้ไหม แขวนทั้งคู่ไว้บนตะปูหลังประตู กระดาษพับยังอยู่ในข้างขวา
      effects: { gold: -1, flags: [bought_an_unclaimed_parcel] }
    - id: walk_it_out
      label: ขอห่อที่จ่าหน้าถึงหญิงที่ตายแล้วไปส่งเองถึงหมู่บ้าน
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          หมู่บ้านนั้นมีบ่อน้ำบ่อเดียวกับบ้านสิบสองหลัง {name}ถามคนที่ตักน้ำว่าบ้านของหญิงคนนั้นอยู่ไหน คนแรกไม่รู้ คนที่สองชี้ไปที่บ้านที่ประตูตอกไม้ขวาง คนที่สามบอกว่าลูกสาวของนางแต่งออกไปอยู่บ้านท้ายทุ่ง {name}เดินต่อไปท้ายทุ่ง

          ลูกสาวของนางแกะห่อบนขอบประตู ข้างในเป็นผ้าคลุมไหล่ถักมือสีแดงเข้ม นางเอาขึ้นคลุมไหล่ตัวเองตรงนั้นเลย แล้วถามว่าคนส่งมาเขียนอะไรไว้ไหม {name}ส่ายหน้า ขากลับถึงเมืองตอนค่ำ นายสถานีจดชื่อ{name}ไว้ในสมุดห่อ ข้างคำว่าส่งแล้ว
        effects: { stats: { WIS: 1 }, city: { merit: 1 }, flags: [walked_a_parcel_home] }
      failure:
        text: |
          {name}ถามคนที่บ่อน้ำจนครบทุกคน ไม่มีใครรู้ว่าญาติของนางไปอยู่ที่ไหน บ้านของนางมีไม้ตอกขวางประตู ขากลับ{name}เหยียบร่องเกวียนที่น้ำขังจนข้อเท้าพลิก ต้องเดินกะเผลกกลับเมืองจนมืด

          ห่อนั้นกลับไปอยู่ในห้องหลังของสถานีอีกหนึ่งปี นายสถานีวางห่อไว้บนชั้นบนสุด แยกจากห่ออื่น
        effects: { hp: -1, flags: [could_not_deliver_the_parcel] }
    - id: name_the_owners
      label: บอกนายสถานีว่าห่อไหนน่าจะเป็นของใคร จากหน้าคนที่เห็นลงรถไฟมาทั้งปี
      requires: { city: { district: [rail_side] } }
      text: |
        คนย่านริมรางเห็นทุกคนที่ลงจากขบวนเที่ยง {name}หยิบห่อทีละห่อ อ่านจ่าหน้า แล้วบอกว่าชื่อนี้ลงรถไฟเมื่อไร ใส่เสื้อสีอะไร ถามทางไปหมู่บ้านไหน นายสถานีจดตามทุกคำ ห่อที่เหลือบนโต๊ะยาวลดลงจากยี่สิบสามเหลือสิบ

        ปีนั้นน้ำมันตะเกียงของชานสถานีไม่พอ ช่วงปลายปีชานมืดตั้งแต่หัวค่ำ คนที่รอรถกลางคืนยืนกันในที่มืด แต่ทุกคนรู้ว่าทำไมมืด
      effects: { city: { merit: 1 }, flags: [named_the_parcel_owners] }

# ---------- d เรื่องเริ่มตึง: ตาชั่งที่มีคนหาว่าโกง ----------
- id: adult.city_market_town_short_sack
  stage: adult
  weight: 21
  scene: market
  when:
    age: [19, 64]
    city: { id: market_town, mood: [calm] }
  text: |
    หน้าต่างรับชั่งของโรงชั่งมีคนต่อแถวยาวถึงหัวลาน เสมียนตะโกนน้ำหนักทีละกระสอบ แล้วบากไม้นับให้ชาวนาเก็บไว้ ถึงสิ้นเดือนเอาไม้นับมาแลกเหรียญ ตาชั่งคานใหญ่ในโรงห้อยลูกตุ้มทองเหลืองตอกตราหลวงไว้ทุกลูก

    หญิงม่ายคนหนึ่งจากหมู่บ้านทางใต้ยืนอยู่หน้าหน้าต่างไม่ยอมไป นางชั่งข้าวทุกกระสอบด้วยตาชั่งแขวนของบ้านมาก่อนแล้ว ไม้นับที่เสมียนบากให้น้อยกว่าที่บ้านนางชั่งกระสอบละหนึ่งกำมือ สิบสองกระสอบรวมกันเท่ากับข้าวที่ลูกสามคนของนางกินได้หนึ่งเดือน นางยื่นไม้นับให้คนข้างหลังดู คนข้างหลังคือ{name}

    แถวข้างหลังเริ่มเงียบ คนที่ได้ยินหันมาดูไม้นับของตัวเอง
  choices:
    - id: say_it_loud
      label: ชูไม้นับของนางขึ้น บอกคนทั้งแถวว่าโรงชั่งตัดข้าวของนางไปเท่าไร
      text: |
        คนทั้งแถวได้ยิน คนที่ยืนท้ายแถวได้ยินจากคนกลางแถว ไม่ถึงเที่ยงชาวนาครึ่งลานเอาไม้นับของตัวเองมาเทียบกัน บางคนว่าตัดจริง บางคนว่าไม่ตัด ทุกคนเลิกยืนแถว ไปยืนรวมกันหน้าหน้าต่างแทน

        โรงชั่งปิดหน้าต่างตอนบ่าย เปิดอีกทีเช้าวันต่อมาพร้อมยามสองคนที่ไม่เคยมีมาก่อน ตั้งแต่วันนั้นชาวนาทุกคนที่ขนข้าวเข้าเมืองหิ้วตาชั่งแขวนของบ้านมาด้วย ชั่งกันเองหน้าโรงก่อนเข้าแถว
      effects: { city: { mood: tense }, flags: [called_out_the_short_weight] }
    - id: weigh_it_with_her
      label: ขอเสมียนชั่งกระสอบของนางใหม่ต่อหน้าทั้งสองคน แล้วดูให้ครบทุกขั้น
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          เสมียนชั่งใหม่ให้หนึ่งกระสอบ {name}ไม่ได้ดูตาชั่ง ดูมือเสมียน เขาหักน้ำหนักกระสอบเปล่าออกตามตัวเลขบนแผ่นไม้เหนือหน้าต่าง แผ่นไม้ที่ทาสีไว้ตั้งแต่ก่อนหญิงม่ายเกิด กระสอบป่านของนางหนาและหนักกว่ากระสอบที่แผ่นไม้คิดไว้ ส่วนที่หายไปคือข้าวจริง แต่ไม่ได้หายเข้ากระเป๋าใคร

          {name}อ่านแผ่นไม้ให้นางฟังออกเสียง คนในแถวได้ยินไปด้วย เสมียนเติมรอยบากให้นางหนึ่งรอยเพราะคนทั้งแถวยืนดู ปลายเดือนนั้นแผ่นไม้เหนือหน้าต่างมีตัวเลขใหม่เขียนเพิ่มอีกแถว สำหรับกระสอบป่านหนา
        effects: { stats: { WIS: 1 }, city: { merit: 1 }, flags: [read_the_sack_board_aloud] }
      failure:
        text: |
          เสมียนไม่ยอมชั่งใหม่ บอกว่ากระสอบที่ชั่งแล้วคือกระสอบที่ชั่งแล้ว ถ้าทุกคนขอชั่งใหม่ โรงชั่งจะปิดไม่ทันค่ำ {name}เถียงกลับ เสียงดังขึ้นทีละคำจนคนท้ายแถวเดินเข้ามาดู

          พอตกเย็นทั้งลานพูดกันว่าโรงชั่งไม่ยอมชั่งใหม่ คำพูดนั้นเดินไปถึงหมู่บ้านรอบเสาอีเซลเร็วกว่าเกวียนข้าว สัปดาห์ต่อมาหน้าโรงชั่งมียามสองคนยืนอยู่ทั้งวัน
        effects: { city: { mood: tense }, flags: [argued_at_the_weigh_window] }
    - id: pay_her_the_difference
      label: ยื่นเหรียญให้นางหนึ่งเหรียญ บอกให้กลับบ้านก่อนมืด
      requires: { min_gold: 1 }
      text: |
        นางมองเหรียญในมือ แล้วมองหน้า{name} นางไม่รู้จัก{name} และ{name}ก็ไม่รู้จักนาง นางเก็บเหรียญใส่ผ้าผูกเอว ไม่ได้ขอบใจ หิ้วกระสอบเปล่าสิบสองใบขึ้นบ่าแล้วเดินออกจากลานไป

        แถวกลับมาเดินต่อ คนที่ยืนข้างหลัง{name}ชั่งข้าวของตัวเองเสร็จ รับไม้นับแล้วพลิกดูรอยบากสองรอบก่อนเก็บ
      effects: { gold: -1, alignment: { moral: 1 }, flags: [paid_the_widows_difference] }

# ---------- e เดือด: ราคาที่คนรับซื้อจากเวนทราสตั้ง ----------
- id: adult.city_market_town_price_board
  stage: adult
  weight: 35
  scene: market
  when:
    age: [19, 64]
    city: { id: market_town, mood: [tense] }
  text: |
    คนรับซื้อข้าวของสมาคมโรงกลั่นลงจากขบวนเที่ยงพร้อมแผ่นไม้ราคาที่ทาสีมาจากเวนทราสเรียบร้อยแล้ว ข้าวที่เขาซื้อไปเลี้ยงคนงานโรงกลั่นทั้งเมืองหลวง ลูกน้องของเขาเป็นคนท่าเรือหกคน ถือไม้พลองสั้น เขาตอกแผ่นไม้ไว้ที่เสาหน้าโรงชั่ง ราคาข้าวสาลีหนึ่งกระสอบต่ำกว่าปีก่อนหนึ่งในสาม

    ลานโรงชั่งมีเกวียนข้าวจอดเรียงไปจนถึงราง บางคันรอมาสามวัน ชาวนาคนหนึ่งอ่านแผ่นไม้จบ เดินกลับไปที่เกวียนของตัวเอง ปลดสลักกระดานท้าย แล้วดันกระสอบลงพื้นทีละใบ ใช้มีดกรีด ข้าวสาลีไหลออกมาเป็นกองสีทองกลางลาน คนข้างๆ เริ่มทำตาม

    ลูกน้องคนรับซื้อเดินแหวกคนเข้าไปหาเกวียนคันแรก คนรับซื้อขึ้นไปยืนบนบันไดโรงชั่ง มือข้างหนึ่งจับเสา ก้อนดินก้อนแรกลอยข้ามหัวคนไปกระแทกแผ่นไม้ราคาจนสีกะเทาะ
  choices:
    - id: tip_with_them
      label: ช่วยชาวนาข้างๆ ปลดกระดานท้ายเกวียน ดันกระสอบลงกลางลาน
      text: |
        กระสอบลงพื้นทีละใบ ข้าวกองสูงขึ้นถึงเข่า ลูกน้องคนรับซื้อเอาพลองฟาดหลังชาวนาที่อยู่ใกล้ที่สุด แล้วเสียงทั้งลานก็เปลี่ยน หน้าต่างรับชั่งแตก มีคนงัดแผ่นไม้ราคาออกจากเสาไปเผากลางลาน คนรับซื้อหนีเข้าโรงชั่งแล้วลงกลอนจากข้างใน

        ไม้พลองของใครสักคนฟาดโดนไหล่{name} ตกค่ำลานโรงชั่งยังมีไฟลุกอยู่สองกอง ข้าวสาลีที่ไหลเต็มพื้นโดนเท้าคนเหยียบจนเป็นแป้งดำ
      effects: { hp: -2, reputation: { distillers: -1 }, city: { mood: riot }, flags: [tipped_grain_at_the_weigh_square] }
    - id: stand_by_the_buyer
      label: ขึ้นไปยืนบนบันไดโรงชั่ง กันคนไม่ให้ถึงตัวคนรับซื้อ
      text: |
        คนรับซื้อหลบอยู่ข้างหลัง{name} มือยังกำผ้าเช็ดหน้า ก้อนดินลูกที่สองโดนหน้าผาก{name} ลูกที่สามโดนเสา คนข้างล่างเรียก{name}ด้วยชื่อที่ไม่เคยมีใครในเมืองนี้เรียกมาก่อน

        ลูกน้องของเขาพาเขาออกทางประตูหลังโรงชั่งไปขึ้นขบวนบ่ายได้ทัน ลานข้างหน้าลุกเป็นไฟจนค่ำ ก่อนขึ้นรถไฟเขายัดเหรียญใส่มือ{name}หนึ่งเหรียญ บอกว่าสมาคมจะจำชื่อไว้
      effects: { hp: -2, gold: 1, reputation: { distillers: 1 }, city: { mood: riot }, flags: [shielded_the_grain_buyer] }
    - id: ask_for_seven_days
      label: ปีนขึ้นแท่นตาชั่ง ตะโกนขอให้คนรับซื้อรับข้าวเข้าโรงชั่งไว้เจ็ดวัน ระหว่างส่งข่าวไปเวนทราส
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ยืนบนแท่นตาชั่ง สูงกว่าหัวคนทั้งลาน ตะโกนข้อเสนอซ้ำจนคนข้างหน้าหยุดฟังแล้วตะโกนต่อให้คนข้างหลัง ข้าวทุกกระสอบเข้าโรงชั่ง บากไม้นับตามน้ำหนักจริง ไม่มีใครขาย ไม่มีใครเอากลับ เจ็ดวันให้คนรับซื้อส่งข่าวไปถึงเจ้านายกับขบวนกลางคืน

          คนรับซื้อตกลงเพราะไม่มีทางอื่นจะลงจากบันไดได้ ข่าวที่กลับมาในวันที่หกให้ราคาขึ้นจากแผ่นไม้ครึ่งทาง ไม่ถึงราคาปีก่อน ชาวนาบ่นกันทั้งลาน แต่ขายกันครบทุกเกวียน กองข้าวที่กรีดไว้กลางลานมีคนกวาดใส่กระสอบเก็บไปจนหมด
        effects: { stats: { CHA: 1 }, city: { mood: calm }, flags: [held_the_grain_seven_days] }
      failure:
        text: |
          เสียงของ{name}ไปไม่ถึงกลางลาน ชาวนาข้างหน้าได้ยินแค่คำว่าเจ็ดวัน ก็ตะโกนกลับว่าเจ็ดวันข้าวในเกวียนจะขึ้นรา มีคนดึงขา{name}ลงจากแท่นตาชั่ง {name}ล้มลงบนกองข้าวที่ไหลอยู่บนพื้น มีคนเหยียบมือ

          หน้าต่างโรงชั่งแตกทั้งแถวก่อนค่ำ แผ่นไม้ราคาไหม้อยู่กลางลาน คนรับซื้อหนีไปขึ้นรถไฟได้ทางประตูหลัง
        effects: { hp: -2, city: { mood: riot }, flags: [pulled_off_the_scale_platform] }
    - id: go_home
      label: ออกจากลานโรงชั่ง กลับไปลงกลอนประตูห้อง
      text: |
        {name}เดินออกจากลานทางซอยข้างโรงชั่ง ได้ยินเสียงไม้พลองกระทบหลังคนครั้งแรกตอนเลี้ยวหัวมุม แล้วเสียงหน้าต่างแตกทีละบาน

        คืนนั้นควันจากลานโรงชั่งลอยข้ามหลังคาทั้งเมือง กลิ่นข้าวไหม้หอมจนคนที่ไม่รู้เรื่องคงนึกว่าใครอบขนมปัง
      effects: { city: { mood: riot }, flags: [went_home_from_the_grain_riot] }

# ---------- f ไข้มาถึง: มากับรถไฟ ----------
- id: adult.city_market_town_harvest_fever
  stage: adult
  weight: 9
  scene: station
  when:
    age: [19, 64]
    city: { id: market_town, mood: [calm, tense] }
  text: |
    พรุ่งนี้คืองานเลี้ยงปิดลาน คนทั้งถิ่นรอบเสาอีเซลจะมานั่งโต๊ะยาวกลางลานโรงชั่ง ขบวนกลางคืนจากเวนทราสพาคนหนุ่มสาวที่ขึ้นรถไฟไปตั้งแต่ต้นปีกลับมาเยี่ยมบ้านทั้งตู้ชั้นสาม ชานสถานีมีแม่กับยายยืนรอถือตะเกียงจนชานสว่าง

    ประตูตู้ชั้นสามเปิด คนที่ลงมาคนแรกไอแห้งๆ ลงบันไดตู้ คนที่สองไอ คนที่สามต้องมีเพื่อนสองคนประคอง เป็นเด็กสาวที่ตัวร้อนจนแก้มแดงเป็นจ้ำ นายสถานีถามคนตรวจตั๋วที่ลงมาจากขบวน คนตรวจตั๋วบอกว่าเมืองหลวงเป็นไข้ท่าเรือกันมาสองสัปดาห์แล้ว ในตู้นั้นนั่งกันมาทั้งคืน หน้าต่างปิดทุกบาน

    แม่คนหนึ่งเดินฝ่าคนไปกอดลูกชาย {name}ยืนอยู่ข้างนายสถานี
  choices:
    - id: hold_the_carriage
      label: ขอนายสถานีปลดตู้ชั้นสามไว้ที่รางแยก ให้คนในตู้อยู่ในนั้นจนครบเจ็ดวัน
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          {name}ไม่ได้ขอนายสถานี ขอยายที่ยืนหน้าสุดของชานก่อน ยายคนนั้นเคยเห็นไข้ท่าเรือมาเมื่อตอนยังสาว นางพูดกับแม่ๆ บนชานคนละคำสองคำ ไม่ถึงชั่วโมงทุกคนยอม คนที่ลงมาแล้วกลับขึ้นตู้ นายสถานีปลดตู้ชั้นสามไปไว้ที่รางแยกท้ายสถานี หน้าต่างเปิดได้ ประตูปิด

          เจ็ดวันนั้นแม่ๆ เอาน้ำแกงมาส่งทางหน้าต่าง งานเลี้ยงปิดลานจัดตามเดิมแต่เงียบกว่าทุกปี วันที่แปด เด็กสาวคนนั้นลงจากตู้มาเองด้วยขาที่ยังสั่น ปลายเดือนนั้นทั้งเมืองไม่มีใครไอ
        effects: { city: { merit: 2 }, flags: [held_the_fever_carriage] }
      failure:
        text: |
          นายสถานีฟัง{name}จนจบ แต่แม่ที่กอดลูกชายอยู่ไม่ฟัง นางพาลูกเดินออกจากชานไปก่อนใคร แล้วคนอื่นก็ตามไป ตู้ชั้นสามว่างภายในชั่วโมงเดียว นายสถานีปลดตู้เปล่าไปไว้ที่รางแยกตามที่{name}ขอ

          งานเลี้ยงปิดลานจัดตามเดิม คนนั่งโต๊ะยาวกันเต็มลาน สิบวันต่อมาหมู่บ้านรอบเสาอีเซลหกหมู่บ้านมีคนไอ ห้องเช่าริมรางผูกผ้าขาวที่หน้าประตูกันทีละห้อง
        effects: { city: { mood: plague }, flags: [could_not_hold_the_carriage] }
    - id: carry_their_bags
      label: ช่วยหิ้วห่อผ้าของคนที่ลงจากตู้ไปส่งที่เกวียนของแต่ละบ้าน
      text: |
        ห่อผ้าของคนที่กลับจากเมืองหลวงหนักกว่าตอนไป ข้างในเป็นของฝาก ผ้า รองเท้า หลอดน้ำค้างดาวสำหรับตะเกียงที่บ้านยังไม่มี {name}หิ้วไปส่งถึงเกวียนทีละห่อ เด็กหนุ่มคนหนึ่งไอใส่หลังมือแล้วขอบใจ{name}ด้วยสำเนียงที่เริ่มเป็นสำเนียงคนเมืองหลวงแล้ว

        เกวียนพาพวกเขากลับหมู่บ้านไปตอนดึก สัปดาห์ต่อมา{name}เริ่มได้ยินเสียงไอจากห้องข้างๆ ตอนกลางคืน เสียงเดียวกับที่ได้ยินบนชานคืนนั้น
      effects: { city: { mood: plague }, flags: [carried_bags_off_the_fever_train] }
    - id: set_the_long_tables
      label: ไปช่วยตั้งโต๊ะยาวที่ลานโรงชั่งตามที่รับปากไว้ ปล่อยเรื่องบนชานให้นายสถานี
      text: |
        {name}ยกโต๊ะยาวออกจากโรงชั่งกับคนอื่นจนถึงดึก ปูผ้า ตั้งม้านั่ง วางถ้วยเรียงจนสุดลาน วันงานคนนั่งเต็มทุกโต๊ะ คนหนุ่มสาวที่กลับจากเมืองหลวงนั่งรวมโต๊ะเดียวกันตรงกลาง เล่าเรื่องเรือเหาะให้คนรอบโต๊ะฟัง ไอสลับกับหัวเราะ

        สิบวันต่อมาคนที่นั่งโต๊ะนั้นกับโต๊ะข้างๆ นอนซมอยู่ทั่วถิ่น ม้านั่งยาวยังวางเรียงอยู่กลางลาน ไม่มีใครเก็บ
      effects: { city: { mood: plague }, flags: [set_the_tables_for_the_fever_feast] }

# ---------- g คนมีหน้ามีตา: นายโรงชั่งขอลายมือชื่อ ----------
- id: adult.city_market_town_peldens_contract
  stage: adult
  weight: 45
  scene: market
  when:
    age: [25, 64]
    city: { id: market_town, min_rank: 3 }
  text: |
    เพลเดน นายโรงชั่ง เป็นชายร่างหนาที่พูดเบาจนคนต้องเอนตัวเข้าไปฟัง ที่คอห้อยลูกตุ้มทองเหลืองลูกเล็กตอกตราหลวง ลูกตุ้มแม่แบบที่ลูกตุ้มทุกลูกในโรงชั่งต้องเอามาเทียบน้ำหนัก เขานับเลขในหัวเร็วกว่าเสมียนทั้งโรงบากไม้ และไม่เคยเชิญใครเข้าห้องหลังโรงชั่ง วันนี้เขาเชิญ{name}

    บนโต๊ะมีสัญญาจากคนรับซื้อของเวนทราส ข้าวทุกกระสอบของถิ่นจะผ่านโรงชั่งไปให้คนรับซื้อรายเดียวห้าฤดูเกี่ยว ราคาตายตัว ปีข้าวล้นก็ขายได้ ปีข้าวขาดก็ขายได้แค่ราคานี้ ใต้ชื่อของเพลเดนมีช่องว่างสามช่อง เขาอยากได้ชื่อของคนในเมืองที่คนรอบเสาอีเซลเชื่อ ลงไว้เป็นพยานว่าเมืองตกลงด้วย ไม่ใช่นายโรงชั่งคนเดียว

    เขาเลื่อนปากกาข้ามโต๊ะมา แล้วรอ ลูกตุ้มที่คอแกว่งเบาๆ ตามลมหายใจ
  choices:
    - id: sign_under_him
      label: ลงชื่อในช่องแรกใต้ชื่อของเพลเดน
      text: |
        หมึกของเพลเดนเป็นหมึกดี แห้งเร็ว ไม่ซึม เขาพับสัญญาใส่ซองหนัง ขอบใจ{name}ด้วยเสียงเบาเท่าเดิม แล้วส่งถุงชาสามห่อกับเหรียญหนึ่งเหรียญมาให้ที่บ้านในวันต่อมา บอกว่าเป็นค่าเดินทางของหมึก

        ปีแรกข้าวล้นทั้งถิ่น ชาวนาขายได้ทุกกระสอบ ไม่มีใครบ่น ปีที่สามข้าวขาด ชาวนาเริ่มถามกันว่าใครลงชื่อในสัญญาบ้าง คำตอบมีชื่อของ{name}อยู่ด้วย
      effects: { gold: 1, reputation: { distillers: 1 }, flags: [signed_peldens_contract] }
    - id: read_it_in_the_square
      label: บอกว่าจะลงชื่อ ถ้าได้อ่านสัญญาออกเสียงให้คนทั้งลานโรงชั่งฟังก่อน
      text: |
        เพลเดนเงียบไปนานพอให้ลูกตุ้มที่คอหยุดแกว่ง แล้วตกลงด้วยเสียงเบาเท่าเดิม {name}อ่านสัญญาบนบันไดโรงชั่งตอนเช้าวันตลาด ทีละบรรทัด ชาวนาเงียบฟังจนถึงบรรทัดราคาปีข้าวขาด แล้วเสียงทั้งลานก็ดังขึ้นพร้อมกัน

        สัญญากลับไปเวนทราสพร้อมบรรทัดใหม่หนึ่งบรรทัด ปีไหนข้าวขาด ราคาเปิดใหม่ได้ ชื่อของ{name}อยู่ช่องแรกใต้ชื่อเพลเดน ตั้งแต่นั้นค่าชั่งของ{name}ที่โรงชั่งแพงขึ้นกว่าคนอื่นนิดหนึ่งทุกครั้ง เสมียนบอกว่าตามแผ่นไม้ แผ่นไม้ไม่ได้เขียนไว้
      effects: { gold: -2, city: { merit: 1 }, flags: [signed_peldens_contract, read_peldens_contract_aloud] }
    - id: leave_it_blank
      label: เลื่อนปากกาคืน บอกว่าชื่อของ{name}จะไม่อยู่ใต้ราคาที่ตัวเองไม่ได้ตั้ง
      text: |
        เพลเดนรับปากกาคืน เช็ดปลายด้วยผ้าแล้วเก็บลงกล่อง ไม่ได้ถามเหตุผล สัปดาห์ต่อมาช่องว่างสามช่องใต้ชื่อเขามีชื่อเจ้าของโรงสีสองคนกับนายสถานี

        ปีที่ข้าวขาด ชาวนาที่หน้าโรงชั่งเอ่ยชื่อทั้งสามคนนั้นทุกวัน ไม่มีใครเอ่ยชื่อ{name} ห้องหลังโรงชั่งไม่เคยเชิญ{name}เข้าไปอีก
      effects: { flags: [refused_peldens_contract] }

# ---------- h หลังคา: บ้านกับร้าน ----------
- id: adult.city_market_town_roof
  stage: adult
  weight: 10
  once: false
  scene: home
  when:
    age: [22, 62]
    city: { id: market_town, home: [none, room, family], min_years: 2 }
  text: |
    กระดานหน้าโรงชั่งบอกทุกเรื่องของเมืองตลาด ราคาข้าว วันเกวียนออก ชื่อคนตาย และห้องที่ว่าง ใครค้างค่าเช่า ทั้งเมืองรู้ก่อนเจ้าตัวจะเดินถึงกระดาน เพราะเจ้าของห้องเล่าที่หน้าต่างรับชั่ง บ้านที่ขายขาดขึ้นกระดานไม่กี่ปีครั้ง พอขึ้นแล้วคนก็หยุดยืนอ่านกันนานกว่าราคาข้าว

    ปีนี้กระดานมีสองแผ่น บ้านหลังเล็กท้ายซอยโรงสี ผนังอิฐ หลังคากระเบื้อง มีเตาอบในครัว ราคาสิบเหรียญ กับหน้าร้านริมราง ห้องหน้ากว้างพอวางชั้นสามชั้น ข้างบนมีห้องนอน สิบสี่เหรียญ คนขายทั้งสองรายจะขึ้นขบวนเที่ยงไปอยู่กับลูกในเมืองหลวง

    ห้องเช่าในเมืองนี้จ่ายค่าเช่าเมื่อครบรอบสัญญา บ้านที่ซื้อขาดไม่ต้องจ่ายใคร และไม่มีชื่อใครขึ้นกระดานว่าค้าง
  choices:
    - id: buy_the_mill_house
      label: นับสิบเหรียญให้คนขาย แล้วรับกุญแจบ้านท้ายซอยโรงสี
      requires: { min_gold: 10 }
      text: |
        คนขายนับเหรียญบนโต๊ะในครัว แล้วสอน{name}จุดเตาอบ ฟืนต้องวางขวาง ไม่ใช่วางตาม ไม่อย่างนั้นควันจะย้อนเข้าห้อง เขาทิ้งถาดอบขนมปังไว้ให้หนึ่งใบ บอกว่าเมืองหลวงไม่มีใครอบขนมปังเองแล้ว

        เช้าวันต่อมา แผ่นกระดานหน้าโรงชั่งเหลือแผ่นเดียว คนที่ยืนอ่านรู้ว่าบ้านท้ายซอยโรงสีเป็นของใคร ก่อนที่{name}จะเดินไปถึงกระดาน
      effects: { gold: -10, city: { district: mill_lane, home: house }, mark: ซื้อบ้านในเมืองตลาด, flags: [owns_a_house_in_market_town] }
    - id: buy_the_rail_front
      label: นับสิบสี่เหรียญ ซื้อหน้าร้านริมราง
      requires: { min_gold: 14 }
      text: |
        ชั้นไม้สามชั้นของร้านยังมีรอยฝุ่นเป็นสี่เหลี่ยมตรงที่ของของคนเก่าเคยวาง ประตูหน้าร้านหันเข้าหาชานสถานี ทุกคนที่ลงจากขบวนเที่ยงต้องเดินผ่านก่อนเลี้ยวเข้าเมือง ห้องนอนข้างบนสั่นตามขบวนกลางคืนเหมือนห้องอื่นทุกห้องริมราง

        {name}ตอกป้ายชื่อไว้เหนือประตูในวันแรก ตอนเย็นนายสถานีเดินมาอ่าน แล้วบอกว่าป้ายเอียงไปทางรางนิดหนึ่ง
      effects: { gold: -14, city: { district: rail_side, home: shop }, mark: เปิดร้านในเมืองตลาด, flags: [owns_a_shop_in_market_town] }
    - id: read_and_walk_on
      label: อ่านกระดานจนจบ แล้วเดินกลับห้องเช่า
      text: |
        บ้านท้ายซอยโรงสีขายได้ภายในสัปดาห์ หน้าร้านริมรางอยู่บนกระดานนานกว่านั้น จนสีที่เขียนราคาซีดไปครึ่งหนึ่ง

        {name}ยังเดินผ่านกระดานทุกเช้า อ่านราคาข้าว อ่านชื่อคนตาย อ่านชื่อคนค้างค่าเช่าแล้วดูให้แน่ว่าไม่มีชื่อของตัวเอง
      effects: { flags: [read_the_board_and_walked_on] }
