# ชุด ม สถาบันเวทหลวง: หลังห้องห้าคน (12 เรื่อง)
# เพื่อนร่วมห้องสี่คน คนละสองเรื่อง (อายุ 24 ถึง 38 และ 40 ถึง 62) ทุกเรื่องใช้ cast ด้วย id ของเพื่อน จึงออกเฉพาะตอนเพื่อนยังอยู่
#   อ่านได้ทั้งคนที่เรียนจบและคนที่ออกกลางคัน ทุกงาน ทุกเมือง เพื่อนมาหา หรือเจอกันกลางทาง
#   เรื่องที่สองของเนริสเป็นงานศพ (people @mate dies) เรื่องเดียวในแปดเรื่องที่มีคนตาย
#   ไม่มีเรื่องไหนพูดถึงสงครามถ่าน จึงไม่ต้องกันด้วย when.year
# คนที่ออกจากสถาบัน: งานแรกของช่างเวทเถื่อน (must) กับอีกสามเรื่อง คนตรวจทะเบียน ฮัลบริคกลางตลาด และชายเงียบที่ถือเครื่องมือเหล็กเย็น
#   (ใบ้ถึงองค์กรที่ชุดหลังจะเขียน ห้ามเอ่ยชื่อ ยศ หรือบ้านขององค์กร)

# ---------- เอดริค วาเรน ----------

- id: adult.cohort_edric_back_doors
  stage: adult
  scene: tavern
  weight: 25
  cast:
    mate: { id: cohort_edric }
  when:
    age: [24, 38]
    flags: [institute_cohort]
    not_flags: [institute_student]
  text: |
    ห้องในของร้านเหล้าที่แพงที่สุดแถวนั้นมีโต๊ะตัวเดียว {mate}จองไว้ตั้งแต่บ่าย สั่งอาหารมาเจ็ดจาน ไก่ย่างทั้งตัว ปลาไหลรมควัน ขนมปังที่ยังมีไอ แล้วกินเองแค่ปีกไก่ข้างเดียว เสื้อคลุมของเขาเป็นสีกรมท่าแบบที่ราชสำนักแจกคนของตัวเอง กระดุมทองเหลืองขัดจนเปลวตะเกียงไปอยู่ในนั้นทุกเม็ด ผมเริ่มถอยจากหน้าผาก เสียงหัวเราะยังดังเท่าตอนอยู่เตียงริมหน้าต่าง

    เขาเล่าเรื่องห้องห้าคนเหมือนเพิ่งย้ายออกมาเมื่อวาน เล่าเรื่องกระดานชนวนของดอร์กา เรื่องเทียนของเธริลที่ไม่เคยดับก่อนตีสอง เล่าผิดไปครึ่งหนึ่งแบบที่เขาเล่าผิดมาตลอด งานของตัวเองในราชสำนักเขาเล่าแค่ว่าได้เดินทาง เมืองละสองสามคืน กินข้าวกับคนที่ไม่อยากกินด้วย

    ระหว่างเล่า ปลายนิ้วของ{mate}จุ่มเขม่าจากก้นโป๊ะตะเกียง แล้วขีดลงบนผ้าเช็ดปากไปเรื่อยๆ เส้นยาวหนึ่งเส้นเป็นถนน สี่เหลี่ยมเล็กๆ เรียงสองข้าง แล้วเขาก็ถาม เสียงเดียวกับที่ถามว่าพรุ่งนี้ฝนจะตกไหม ถนนแถวที่{name}พัก บ้านหลังไหนมีประตูหลังออกตรอก หน้าฝนน้ำไหลไปลงทางไหน คนจุดตะเกียงถนนเดินไปจบที่หัวมุมไหน
  choices:
    - id: tell_him
      label: บอกเขาไปตามที่รู้ ทีละหลัง
      text: |
        {mate}ขีดตามเร็วกว่าที่{name}พูด มือที่ในปีหนึ่งคัดตารางได้วันละหน้าเดียว วาดประตูหลังเป็นขีดสั้นๆ ข้างสี่เหลี่ยม บ่อน้ำเป็นวง ทางน้ำเป็นเส้นประ หัวมุมที่คนจุดตะเกียงเดินไปจบ เขาวงไว้สองรอบ แล้วพับผ้าผืนนั้นเป็นสี่ทบ เก็บเข้ากระเป๋าในของเสื้อคลุม

        เขาจ่ายค่าอาหารเจ็ดจานด้วยเหรียญเงิน แล้วกดเหรียญที่สองลงในมือ{name} บอกว่าราชสำนักขอบคุณ ฟังดูเหมือนเรื่องตลกที่เขาเล่าคนเดียวมาหลายเมืองแล้ว ไก่ย่างทั้งตัวยังวางอยู่บนโต๊ะ ไม่มีใครแตะ
      effects: { gold: 2, reputation: { crown: 1 }, flags: [drew_your_street_for_edric] }
    - id: ask_why
      label: ถามเขาตรงๆ ว่าวาดไปให้ใครดู
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          มือของ{mate}หยุดกลางเส้น เขาหัวเราะก่อน แล้วถึงตอบว่าเป็นนิสัยที่สำนักสงครามสอนมา เข้าเมืองไหน วาดเมืองนั้น ทุกประตู ทุกบ่อ ทุกหัวมุม เดเวค รอสตันบอกนักเรียนตั้งแต่ปีสามว่า ทหารที่ไม่รู้ว่าประตูหลังอยู่ไหน ตายที่ประตูหน้า

          แล้วเขาก็ยกผ้าเช็ดปากขึ้นจ่อเปลวตะเกียง มุมผ้าไหม้ไปเท่าเล็บมือ เขาดึงกลับ ตบไฟจนดับ แล้วพับใส่กระเป๋าในของเสื้อคลุมเหมือนเดิม บอกว่ามือเขาทำเองก่อนหัวสั่ง มาตั้งแต่ปีสาม
        effects: { stats: { WIS: 1 }, flags: [asked_edric_about_the_maps] }
      failure:
        text: |
          {mate}หัวเราะ บอกว่าราชสำนักจ่ายเงินให้เขาอยากรู้อยากเห็น แล้ววกไปเล่าเรื่องที่ดินผืนสุดท้ายของตระกูลวาเรน เรื่องลุง เรื่องโรงกลั่นที่ตั้งอยู่บนที่ที่ปู่ของเขาเคยขี่ม้า เล่าไปสั่งเหล้าไปจนเจ้าของร้านมาเก็บเทียน

          ตอนจะจ่ายเงิน เขาคลำกระเป๋าแล้วบอกว่าลืมไว้ที่โรงแรม พรุ่งนี้จะเอามาคืน เช้าวันรุ่งขึ้นโรงแรมบอกว่าเขาออกไปตั้งแต่ก่อนไก่ขัน ผ้าเช็ดปากผืนนั้นไม่ได้อยู่บนโต๊ะตั้งแต่เมื่อคืนแล้ว
        effects: { gold: -2, flags: [edric_left_you_the_bill] }
    - id: false_door
      label: ขอผ้าผืนใหม่ วาดถนนให้เขาเองตามแบบที่เดเวค รอสตันสอน แต่ย้ายประตูหลังผิดไปหนึ่งบาน
      requires: { flag: school_war }
      text: |
        {name}วาดแบบที่ลานฝึกสอน ลูกศรชี้ทิศเหนือก่อน ถนนทีหลัง บ้านทุกหลังมีเลข ประตูหลังเป็นขีดสั้น บ่อเป็นวง ทุกอย่างตรงตามจริง ยกเว้นบ้านของ{name}เอง ประตูหลังบานนั้น{name}ขีดไว้ผิดฝั่ง ไปอยู่ตรงที่เป็นกำแพงทึบ

        {mate}วางผ้าสองผืนเทียบกัน ของเขากับของ{name} แล้วบอกว่า{name}วาดดีกว่าตอนเรียน เขาเก็บผืนของ{name}ไป ทิ้งผืนของตัวเองไว้บนโต๊ะ คืนนั้นประตูหลังบ้านของ{name}กลายเป็นกำแพงในลิ้นชักของใครสักคน
      effects: { stats: { INT: 1 }, alignment: { law: -1 }, flags: [drew_edric_a_false_door] }
    - id: tear_it
      label: ดึงผ้าเช็ดปากมาฉีกเป็นสองท่อน
      text: |
        เสียงผ้าขาดดังกว่าที่คิด คนในห้องนอกหันมาดู {mate}มองผ้าสองท่อนบนโต๊ะ แล้วหัวเราะ หัวเราะนานกว่าที่เรื่องควรขำ แบบที่เขาหัวเราะมาตั้งแต่ห้องห้าคน

        จากนั้นเขาก็หยิบผ้าเช็ดปากผืนใหม่จากโต๊ะข้างๆ จุ่มนิ้วในเขม่า แล้ววาดถนนเส้นเดิมขึ้นมาใหม่จนเสร็จ โดยไม่ถามอะไรอีกสักคำ ประตูหลังครบทุกบาน เขามีถนนเส้นนี้อยู่ในหัวตั้งแต่ก่อนนั่งลงกินข้าว
      effects: { people: [{ id: cohort_edric, closeness: -1 }], flags: [tore_edrics_napkin] }

- id: adult.cohort_edric_winter_bed
  stage: adult
  scene: home
  weight: 25
  cast:
    mate: { id: cohort_edric }
  when:
    age: [40, 62]
    flags: [institute_cohort]
    not_flags: [institute_student]
  text: |
    เด็กข้างบ้านมาบอกว่ามีลุงคนหนึ่งนั่งอยู่บนขั้นบันไดหน้าที่พักของ{name}ตั้งแต่เที่ยง ไม่ขอน้ำ ไม่ขอข้าว ถามชื่อ{name}ครั้งเดียวแล้วก็นั่งรอ เสื้อคลุมของเขาเคยเป็นสีกรมท่า ตอนนี้เป็นสีเทา ตรงที่กระดุมทองเหลืองเคยอยู่เหลือเป็นวงด้ายขาดเรียงลงมาเจ็ดวง หีบไม้ใบเดียววางข้างเท้า มุมหีบมีรอยมีดขูดตราอะไรสักอย่างออก

    {mate}เล่าเองก่อนจะมีใครถาม ลุงตายไปหลายปีแล้ว หนี้ที่ลุงลงชื่อไว้กับธนาคารเบเลคไม่ได้ตายตาม บ้านหลังสุดท้ายของตระกูลวาเรนเป็นของธนาคารตั้งแต่ใบไม้ร่วง ราชสำนักให้เขาพักงานพร้อมเหรียญตราหนึ่งเหรียญ กับเงินบำนาญที่มาช้าทุกฤดู งานสุดท้ายของเขาในราชสำนัก เขาไม่เล่า

    เขาขอที่นอนสักหนาวหนึ่ง พื้นก็ได้ ตอนออกงานเขานอนพื้นมาแล้วทุกแบบ ระหว่างรอคำตอบ ปลายนิ้วของเขาลากไปบนฝุ่นบนโต๊ะ เป็นถนนหน้าบ้าน บ้านทุกหลัง ประตูหลังทุกบาน โดยที่ตาของเขาไม่ได้มองลงไปที่โต๊ะเลย
  choices:
    - id: give_the_bed
      label: ปูที่นอนให้เขาข้างเตา ให้อยู่จนหิมะละลาย
      text: |
        {mate}กินน้อยกว่าที่{name}คิด นอนตื่นสาย เล่าเรื่องห้องห้าคนให้เด็กข้างบ้านฟังทุกบ่าย เล่าผิดทุกครั้ง แต่ผิดไม่ซ้ำกัน เด็กมาฟังทุกวัน วันไหนเล่าตรงกับวันก่อน เด็กท้วง

        เช้าวันที่หิมะละลายหมด ที่นอนข้างเตาพับไว้เรียบร้อย หีบไม้หายไป ใต้จานข้าวของ{name}มีเหรียญตราของราชสำนักวางอยู่หนึ่งเหรียญ ด้านหลังเหรียญมีรอยเล็บขูดเป็นเส้นเดียว ยาวตลอดชื่อที่สลักไว้
      effects: { gold: -2, alignment: { moral: 1 }, people: [{ id: cohort_edric, closeness: 1 }], flags: [wintered_edric] }
    - id: the_varen_line
      label: บอกเขาว่าเคยคัดชื่อลุงของเขาลงสมุดธนาคาร ตั้งแต่ปีหนึ่ง
      requires: { flag: saw_the_varen_loan }
      text: |
        {mate}หัวเราะจนไอ ไอจนต้องจับขอบโต๊ะ บอกว่าเขารู้ตั้งแต่ปีนั้น เห็นหมึกธนาคารติดข้อมือเสื้อ{name}ทุกเช้าวันที่ไปคัดสมุดมา หมึกธนาคารสีดำอมเขียว ไม่เหมือนหมึกของสถาบัน เขารอให้{name}เล่าเองมาตลอด แล้วก็เลิกรอไปตอนไหนจำไม่ได้

        คืนนั้นเขาเปิดหีบไม้ หยิบสมุดผ่อนของลุงออกมาให้ดู เล่มปกดำแบบเดียวกับที่{name}เคยคัด หน้าสุดท้ายเป็นลายมือของเขาเอง ลงชื่อรับหนี้ที่เหลือแทนลุง ลายมือสวยที่สุดในเล่ม
      effects: { people: [{ id: cohort_edric, closeness: 1 }], flags: [told_edric_about_the_varen_loan] }
    - id: last_job
      label: รินเหล้าให้เขาจนเต็มแก้ว แล้วถามว่างานสุดท้ายของราชสำนักคืออะไร
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          เขาดื่มไปสามแก้วก่อนจะตอบ แล้วตอบด้วยเสียงที่{name}ไม่เคยได้ยินจากเขา เสียงเบา ไม่มีหัวเราะต่อท้าย แผนที่ที่สำนักสงครามสอนให้วาดไม่เคยเป็นแผนที่ของฮอร์ดุน ไม่เคยเป็นภูเขาของใครที่ไหน เป็นถนนของเวนทราสเอง ทีละย่าน ถนนที่ห้องห้าคนมองลงไปเห็นทุกเช้า งานสุดท้ายของเขาคือส่งแผนที่ทุกแผ่นในหัวคืนให้ราชสำนัก นั่งวาดใหม่ในห้องใต้ดินอยู่สองเดือน

          เขาบอกว่าวาดคืนไปหมดแล้ว แต่ในหัวยังอยู่ครบ ไม่มีใครเอาออกให้ได้ แล้วเขาก็ลากนิ้วบนฝุ่นบนโต๊ะอีกครั้ง คราวนี้{name}จำได้ว่าถนนที่เขาวาดคือถนนหน้าประตูสถาบัน
        effects: { stats: { CHA: 1 }, flags: [heard_edrics_last_job] }
      failure:
        text: |
          {mate}ดื่มทุกแก้วที่{name}ริน เล่าเรื่องลุง เรื่องม้าของปู่ เรื่องห้องห้าคนอีกรอบ พอถึงคำถามนั้น เขาบอกว่าราชสำนักจ่ายบำนาญให้เขาเพื่อจะได้ไม่ต้องจำ แล้วขอเหล้าอีกแก้ว

          เช้ามา ไหเหล้าที่{name}ซื้อมาแพงกว่าค่าข้าวทั้งสัปดาห์เหลือแต่ก้น {mate}นั่งอยู่ที่ขั้นบันไดหน้าบ้านเหมือนเมื่อวาน หีบไม้วางข้างเท้า ถามว่ายังให้อยู่ต่อไหม
        effects: { gold: -2, flags: [edric_kept_his_last_job] }
    - id: no_room
      label: บอกเขาว่าที่นี่ไม่มีที่ให้นอน
      text: |
        {mate}ลุกขึ้นช้าๆ ปัดฝุ่นที่เข่า ขอบคุณเหมือนแขกที่เพิ่งกินข้าวเย็นบ้านขุนนางเสร็จ แล้วยกหีบขึ้นบ่า บอกว่าจะลองไปหาดอร์กาดู ถ้ายังอยู่ที่เดิม

        เขาเดินไปจนสุดถนน เลี้ยวซ้ายเข้าตรอกที่{name}เองไม่เคยรู้ว่าทะลุไปไหนได้ บนโต๊ะในบ้าน ฝุ่นยังเป็นรูปถนนอยู่ทั้งเส้น ประตูหลังทุกบาน{name}ไม่ได้เช็ดทิ้งจนอีกหลายวัน
      effects: { people: [{ id: cohort_edric, closeness: -1 }], flags: [turned_edric_away] }

# ---------- ดอร์กา ตระกูลลิ่มเหล็ก ----------

- id: adult.cohort_dorga_rubbing
  stage: adult
  scene: home
  weight: 25
  cast:
    mate: { id: cohort_dorga }
  when:
    age: [24, 38]
    flags: [institute_cohort]
    not_flags: [institute_student]
  text: |
    กระบอกหนังทาน้ำมันที่{mate}วางลงบนโต๊ะยาวเท่าแขนคน ข้างในเป็นแบบแขนกลม้วนหนึ่ง สถาบันขายแบบนี้ให้โรงประกอบที่เธอคุมช่างอยู่ ราคาเท่าค่าแรงช่างสองคนหนึ่งปี เป็นแบบที่ดีที่สุดที่เธอเคยเห็น ข้อศอกงอได้สามทางโดยไม่มีเสียง เธอประกอบตามแบบนี้มาแล้วสิบสองแขน

    เธอคลี่ม้วนกระดาษจนถึงมุมล่าง ตรงใต้ภาพข้อศอก ลายเส้นตรงนั้นไม่ใช่หมึก เป็นถ่านที่ถูลงบนกระดาษที่ทาบอยู่บนอะไรสักอย่างที่ขรุขระ เนื้อหินขึ้นมาเป็นจุดเม็ดทราย ตรงปลายเส้นสุดท้ายมีรอยสลักเล็กๆ รูปลิ่ม มีบากสามบาก เครื่องหมายที่ตระกูลลิ่มเหล็กสลักปิดท้ายทุกบรรทัดบนหินของตระกูล บากสามบากนั้นเป็นมือของยายทวด ตอนเด็กเธอนับมันทุกเช้าก่อนไปนับอย่างอื่น

    {mate}ยังนับหนี้ของตระกูลทุกเช้า กระดานชนวนแผ่นเดิมอยู่ในย่าม เธอบอกว่าถ้าตระกูลรู้ว่ามีคนเอากระดาษไปทาบหินของตระกูล จะต้องมีใครสักคนรับผิด และคนที่ตระกูลส่งไปเรียนกับมนุษย์มีอยู่คนเดียว เธอถาม{name}ว่าถ้าเป็น{name} จะทำอย่างไร
  choices:
    - id: take_it_home
      label: บอกให้เธอเอาม้วนนี้กลับไปให้ตระกูลดูเอง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {mate}นั่งเงียบจนเทียนสั้นลงหนึ่งข้อนิ้ว แล้วม้วนกระดาษกลับเข้ากระบอก ช้า ไม่ให้ถ่านเลอะ เช้ามาเธอซื้อตั๋วรถไฟเที่ยวเดียวขึ้นไปทางทุนดาร์ ก่อนขึ้นรถเธอยื่นกระดานชนวนให้{name}ถือไว้ บอกว่านับแทนให้ด้วย วันละหนึ่งช่อง ถ้าเธอไม่กลับมา ให้นับต่อไปจนกระดานเต็ม

          กระดานแผ่นนั้นวางอยู่บนขอบหน้าต่างของ{name}มาตั้งแต่วันนั้น ตัวเลขแถวบนสุดเป็นลายมือของเธอ แถวต่อมาเป็นลายมือของ{name}
        effects: { stats: { CHA: 1 }, people: [{ id: cohort_dorga, closeness: 1 }], flags: [sent_dorga_home_with_the_rubbing] }
      failure:
        text: |
          {mate}บอกว่า{name}พูดเหมือนคนที่อยู่ข้างล่างนานเกินไป ตระกูลขูดชื่อคนออกจากหินด้วยเรื่องที่เล็กกว่านี้ เธอเคยเห็นมากับตา เธอม้วนกระดาษเข้ากระบอกเร็วจนถ่านเลอะนิ้ว ตอนสะบัดกระบอกขึ้นบ่า ปลายกระบอกฟาดโดนโคมน้ำค้างดาวบนโต๊ะ โคมตกแตกบนพื้น

          น้ำค้างดาวที่หกออกมาเรืองแสงสีฟ้าอยู่บนพื้นจนเกือบเที่ยงคืนก่อนจะจางไป {mate}ไม่ได้อยู่ดูจนมันจาง เธอวางเหรียญค่าโคมไว้บนโต๊ะครึ่งหนึ่ง แล้วเดินออกไปขึ้นรถไฟเที่ยวดึก กระบอกหนังกระทบวงกบประตูดังเหมือนเสียงตะไบตก
        effects: { gold: -1, people: [{ id: cohort_dorga, closeness: -1 }], flags: [dorga_kept_the_rubbing] }
    - id: clan_business
      label: บอกว่าหินของตระกูลเป็นเรื่องของตระกูล แบบแผ่นนี้คือค่าข้าวของเธอ
      text: |
        {mate}ไม่เถียง เธอม้วนกระดาษกลับเข้ากระบอก ขอบคุณเสียงแข็งแบบคนแคระขอบคุณคนที่ตอบตรง แล้วกลับไปโรงประกอบในเช้าวันต่อมา

        เดือนถัดมาเธอส่งของมาให้ชิ้นหนึ่ง ข้อนิ้วกลทองเหลืองหนึ่งข้อ งานของเธอเอง ประกอบจากแบบม้วนนั้น ลื่นจนงอเองได้ด้วยน้ำหนักของมันเอง ที่ด้านในข้อ ตรงที่คนใส่มองไม่เห็น เธอตะไบรูปลิ่มเล็กๆ ไว้หนึ่งรูป มีบากสามบาก
      effects: { alignment: { law: 1 }, flags: [told_dorga_to_keep_quiet] }
    - id: keep_the_tube
      label: รับกระบอกไว้เอง ให้ไม่มีใครเจอมันในย่ามของเธอ
      text: |
        {mate}ลังเลอยู่นานเท่าที่ใช้นับเลขสามหลัก แล้วดันกระบอกข้ามโต๊ะมา บอกว่าที่นี่ทั้งตระกูลและโรงประกอบไม่มีใครคิดจะมาค้น เพราะไม่มีใครคิดว่าลิ่มเหล็กจะฝากของไว้กับคนนอกตระกูล

        {name}ซุกกระบอกไว้ใต้กระดานพื้นตรงที่เดินแล้วมีเสียงเอี๊ยด ตั้งแต่นั้นทุกครั้งที่เหยียบแผ่นนั้น{name}ได้ยินเสียงเดียวกัน ส่วน{mate}ส่งข่าวมาทุกปีใหม่ ไม่เคยถามถึงกระบอก แต่ท้ายข่าวทุกฉบับมีรูปลิ่มเล็กๆ วาดไว้หนึ่งรูป
      effects: { people: [{ id: cohort_dorga, closeness: 1 }], flags: [kept_dorgas_rubbing] }
    - id: own_tracings
      label: เปิดสมุดลอกแบบปีสามของตัวเองออกมาวางเทียบ
      requires: { flag: school_machine }
      text: |
        สมุดลอกแบบเล่มนั้นอยู่ก้นหีบมาหลายปี หน้ากระดาษติดกันเป็นแผ่นเพราะน้ำมันเฟือง {name}แกะออกทีละหน้า จนเจอแขนกลแบบเดียวกัน ข้อศอกเดียวกัน ลอกด้วยมือของ{name}เองในห้องตะไบของสำนัก ตรงมุมล่างใต้ข้อศอก มีรอยเปื้อนเล็กๆ ที่ตอนนั้น{name}นึกว่าตัวเองลอกพลาด

        {mate}เอานิ้วโป้งทาบลงไปบนรอยนั้น นับบากได้สามบาก แล้วบอกว่า{name}ลอกแม้แต่มือของยายทวดเธอมาด้วย ลอกครบทุกบาก
      effects: { stats: { INT: 1 }, flags: [found_the_wedge_in_your_notes] }

- id: adult.cohort_dorga_name_chip
  stage: adult
  scene: road
  weight: 25
  cast:
    mate: { id: cohort_dorga }
  when:
    age: [40, 62]
    flags: [institute_cohort]
    not_flags: [institute_student]
  text: |
    โรงเตี๊ยมกลางทางมีเตาเหล็กหนึ่งเตา ม้านั่งยาวหนึ่งตัว และแขกที่รอรถเที่ยวเช้าหกคน หญิงคนแคระที่นั่งใกล้เตาที่สุดมีกระดานชนวนวางบนตัก เขียนตัวเลขแถวหนึ่ง เอาแขนเสื้อลบ แล้วเขียนใหม่ {name}จำท่าลบนั้นได้ก่อนจำหน้า

    {mate}ผมขาวทั้งหัว เปียสองข้างยังถักแน่นแบบคนแคระถัก เธอเพิ่งลงมาจากทุนดาร์ บอกด้วยเสียงเดียวกับที่บอกยอดหนี้ ว่าตระกูลลิ่มเหล็กขูดชื่อเธอออกจากหินแล้ว สภาตระกูลไม่ต้องบอกเหตุผล ไม่เคยต้องบอก มีคนแก่คนหนึ่งพูดไว้แค่ว่า คนที่อยู่กับมนุษย์นานกว่าอยู่กับหิน หินจำไม่ได้แล้ว

    เธอแกะผ้าห่อเล็กๆ บนตักออก ข้างในเป็นเศษหินสีเทาเท่าข้อนิ้ว ด้านหนึ่งยังมีครึ่งตัวอักษรของชื่อเธอ ตามธรรมเนียม เศษหินที่ขูดออกต้องกวาดลงแม่น้ำในวันเดียวกัน เธอเก็บมันขึ้นมาจากรางน้ำใต้หินก่อนคนกวาดจะมาถึง คนของตระกูลเก็บชื่อที่ตระกูลขูดทิ้งไว้ไม่ได้ เธอบอก แต่ไม่มีใครเคยห้ามคนนอกตระกูล
  choices:
    - id: keep_the_chip
      label: รับเศษหินไว้
      text: |
        {name}ห่อเศษหินด้วยผ้าผืนเดิม ใส่กระเป๋าเสื้อด้านใน ตรงที่ตบดูได้ทุกครั้งที่นึกขึ้นได้ {mate}มองมือของ{name}จนห่อผ้าหายเข้าไปในกระเป๋า แล้วหันกลับไปที่กระดานชนวนบนตัก

        คราวนี้เธอลบตัวเลขทั้งแผ่น ไม่ได้ลบทีละแถว ลบทั้งแผ่นจนชนวนเป็นสีดำเรียบ แล้วเขียนลงไปตรงกลางแค่ตัวเลขเดียว ตัวเลขที่{name}ไม่รู้ว่านับอะไร เธอไม่บอก รถเที่ยวเช้ามาถึงตอนที่ชอล์กยังไม่ทันแห้ง
      effects: { people: [{ id: cohort_dorga, closeness: 1 }], flags: [keeps_dorgas_name_chip] }
    - id: speak_at_the_stone
      label: ขึ้นรถย้อนไปทุนดาร์กับเธอ ไปยืนพูดแทนเธอหน้าหินของตระกูล
      requires: { flag: origin_dwarf_clan }
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          ผู้อาวุโสของลิ่มเหล็กฟัง{name}พูดจนจบ ฟังเพราะ{name}พูดภาษาของหินถูกทุกคำ และบอกชื่อตระกูลของตัวเองก่อนคำอื่นตามธรรมเนียม ชื่อที่ขูดไปแล้วไม่มีใครสลักคืนได้ แกบอก หินไม่ได้มีไว้ให้แก้

          แต่แกให้{mate}เดินเข้าไปถึงหน้าหิน เอามือแตะตรงที่ว่าง ตรงที่ผิวหินยังขาวกว่าตรงอื่น ได้หนึ่งครั้ง {mate}แตะนานเท่าที่ใช้นับลมหายใจได้สิบ แล้วเดินออกมาทางประตูเดียวกับที่ตระกูลส่งเธอลงไปเวนทราสเมื่อหลายสิบปีก่อน
        effects: { stats: { CHA: 1 }, people: [{ id: cohort_dorga, closeness: 1 }], flags: [spoke_for_dorga_at_the_stone] }
      failure:
        text: |
          ผู้อาวุโสฟังได้ครึ่งเดียวก็ยกมือขึ้น แกถามชื่อตระกูลของ{name} {name}บอก แกให้คนข้างตัวจดลงแผ่นชนวน บอกว่าคนแคระที่มาพูดแทนคนที่หินลืมแล้ว ควรนึกถึงหินของตระกูลตัวเองให้มาก

          {mate}รออยู่ที่บันไดข้างนอก ไม่ได้เข้าไปฟัง พอเห็นหน้า{name}ตอนเดินออกมา เธอหยิบกระดานชนวนขึ้นมา นับอะไรสักอย่างแล้วเขียนเพิ่มไปหนึ่งแถว แถวนั้นไม่ใช่ตัวเลข เป็นชื่อตระกูลของ{name}
        effects: { reputation: { dwarf_council: -1 }, flags: [spoke_for_dorga_and_was_noted] }
    - id: return_the_tube
      label: บอกเธอว่ากระบอกหนังที่เธอฝากไว้ยังอยู่ใต้พื้นบ้าน
      requires: { flag: kept_dorgas_rubbing }
      text: |
        {mate}หัวเราะออกจมูกเป็นครั้งแรกในเช้านั้น บอกว่าเธอลืมไปแล้วจริงๆ ลืมไปตั้งแต่ปีที่สองที่ไม่ได้ถาม แล้วเธอก็ขอให้{name}เก็บไว้ต่อ ม้วนกระดาษกับเศษหิน ไว้ด้วยกัน ชื่อของเธอกับที่ที่ชื่อนั้นไป

        ก่อนรถเที่ยวเช้าจะออก เธอเขียนอะไรบางอย่างลงกระดานชนวน แล้วยื่นให้{name}อ่าน เป็นตัวเลขของยอดหนี้ตระกูลลิ่มเหล็ก บรรทัดสุดท้ายที่เธอนับ ใต้ตัวเลขเขียนว่า ต่อจากนี้ไม่ใช่ของฉันแล้ว
      effects: { people: [{ id: cohort_dorga, closeness: 1 }], flags: [keeps_dorgas_name_chip, kept_dorgas_rubbing_and_name] }
    - id: the_river
      label: บอกให้เธอทำตามธรรมเนียม โยนเศษหินลงแม่น้ำ
      text: |
        สะพานหน้าโรงเตี๊ยมเป็นสะพานไม้ ใต้สะพานน้ำไหลเชี่ยว สีเทาเพราะหิมะละลายจากเขา {mate}ยืนอยู่ที่ราวสะพานนานจนคนขับรถเที่ยวเช้าตะโกนเรียก แล้วกำห่อผ้าไว้ในมือข้างเดียว

        เธอไม่ได้โยน เธอเก็บห่อผ้ากลับเข้าย่ามข้างกระดานชนวน บอก{name}ว่าคนนอกตระกูลมาบอกให้ลิ่มเหล็กทำตามธรรมเนียม ฟังแล้วตลกกว่าที่คิด แล้วขึ้นรถไปโดยไม่หันกลับมา
      effects: { flags: [told_dorga_to_let_it_go] }

# ---------- เนริส ลูกโทบัน ----------

- id: adult.cohort_neris_surety
  stage: adult
  scene: home
  weight: 25
  cast:
    mate: { id: cohort_neris }
  when:
    age: [24, 38]
    flags: [institute_cohort]
    not_flags: [institute_student]
  text: |
    มือของ{mate}ถือถ้วยน้ำชาด้วยสองมือ ผิวหลังมือแดงลอกเป็นแผ่นเพราะน้ำด่างที่ใช้ล้างมือวันละสามสิบรอบ เล็บตัดสั้นจนเห็นเนื้อ เธอนั่งเกวียนมาสองวันเพื่อมาถึงครัวของ{name} มีกระดาษพับเล็กเท่าฝ่ามือมาแผ่นเดียว

    กระดาษแผ่นนั้นมาจากธนาคารเบเลค สัญญาที่เธอลงชื่อไว้ตอนเข้าสถาบันครบกำหนดแล้ว เธอจ่ายมาทุกฤดูไม่เคยขาด ส่งเงินกลับบ้านทุกเดือนไม่เคยขาดเหมือนกัน ยอดที่ยังค้างยังมากกว่าเงินที่กู้มาตอนแรก ธนาคารเปิดให้สองทาง ทางแรก หาคนที่มีชื่อและมีหลังคามาลงชื่อค้ำ ต่อสัญญาไปอีกสิบปี ทางที่สอง ลงชื่อทำงานให้ห้องรักษาของธนาคารที่เหมืองแห่งหนึ่ง ค่าแรงจ่ายเป็นบรรทัดในสมุด ไม่ใช่เหรียญ ส่งเงินกลับบ้านไม่ได้อีก

    โทบันพ่อของเธอลงชื่อค้ำครั้งแรกด้วยนาสองแปลงหลังโบสถ์ ธนาคารไม่รับชื่อคนแก่ซ้ำ {mate}พูดตรงแบบคนหมู่บ้านพูด ไม่อ้อม ไม่ขอโทษก่อนขอ ว่า{name}จะลงชื่อค้ำให้ได้ไหม ในย่ามของเธอมีรายชื่ออีกแผ่น ชื่อบนสุดสองชื่อขีดฆ่าไปแล้ว
  choices:
    - id: stand_surety
      label: ลงชื่อค้ำให้เธอ
      text: |
        สาขาของธนาคารเบเลคในเมืองที่ใกล้ที่สุดเปิดตั้งแต่เช้ามืด เสมียนอ่านสัญญาใหม่ให้ฟังทั้งฉบับ ตอนอ่านถึงบรรทัดผู้ค้ำ เขาเงยหน้ามอง{name}ครั้งเดียว แล้วอ่านต่อจนจบ ปลายปากกาเย็นตอนจรด เย็นแล่นขึ้นข้อมือแล้วหายไป

        ขากลับ{mate}เดินเร็วกว่าปกติ ไม่ได้พูดขอบคุณ ที่หน้าบ้าน เธอฉีกรายชื่อในย่ามเป็นชิ้นเล็กๆ ทิ้งลงรางน้ำ แล้วถามว่าที่นี่มีใครเป็นแผลที่ยังไม่มีใครดูให้บ้างไหม
      effects: { alignment: { moral: 1 }, reputation: { belek_bank: 1 }, people: [{ id: cohort_neris, closeness: 1 }], flags: [stood_surety_for_neris] }
    - id: count_it_together
      label: วางสมุดปกดำของตัวเองลงข้างกระดาษของเธอ แล้วนับดอกทีละฤดู
      requires: { flag: entry_loan }
      check: { stat: INT, dc: 13 }
      success:
        text: |
          สองเล่มวางเทียบกันบนโต๊ะครัว ยอดแรกเท่ากัน ฤดูแรกเท่ากัน ต่างกันตั้งแต่ปีสอง วันที่เธอลงชื่อโต๊ะสำนักรักษา สองเหรียญที่ธนาคารเรียกว่าค่าเสี่ยงนั้นงอกดอกเป็นของตัวเองมาทุกฤดู ทั้งที่สัญญาเขียนไว้ว่าค่าเสี่ยงไม่คิดดอก {name}จำบรรทัดนั้นได้ เพราะเคยอ่านสัญญาของตัวเองจนขาด

          เสมียนธนาคารอ่านบรรทัดที่{name}ชี้สองรอบ แล้วขีดฆ่าแถวตัวเลขยาวหนึ่งแถวในสมุดของ{mate} ยอดที่เหลือยังต้องมีคนค้ำ แต่เล็กลงจนเธอหัวเราะออกมากลางสำนักงานธนาคาร เสียงหัวเราะของเด็กหมู่บ้านที่{name}ไม่ได้ยินมาตั้งแต่ห้องห้าคน
        effects: { stats: { INT: 1 }, people: [{ id: cohort_neris, closeness: 1 }], flags: [found_the_line_in_neris_loan] }
      failure:
        text: |
          {name}นับจนเทียนหมดสองเล่ม ตัวเลขของธนาคารตรงทุกหลัก ทุกฤดู ไม่มีบรรทัดไหนผิด เช้ามา{name}ยังพาเธอไปที่สาขาธนาคาร ขอให้เสมียนเปิดสมุดใหญ่ให้ดู เสมียนเปิดให้ เก็บค่าเปิดสมุดหนึ่งเหรียญ แล้วชี้ให้ดูทีละบรรทัดว่าไม่มีอะไรผิด

          {mate}จ่ายเหรียญนั้นเองก่อน{name}จะทันล้วง บอกว่าที่หมู่บ้านเธอ คนที่ช่วยนับต้องได้กินข้าวก่อน ไม่ใช่จ่ายค่านับ
        effects: { gold: -1, flags: [counted_neris_loan_for_nothing] }
    - id: lend_coin
      label: ให้เงินเธอไปจ่ายหนึ่งฤดูก่อน ซื้อเวลาให้หาคนค้ำ
      requires: { min_gold: 4 }
      text: |
        เหรียญสี่เหรียญวางบนโต๊ะครัว {mate}นับสองรอบ แล้วเย็บติดไว้ในรอยพับของกระดาษธนาคารด้วยเข็มที่ยังพกอยู่ในปกเสื้อ เย็บทีละเหรียญ แบบที่คนบ้านโม่หินเย็บเงินที่ต้องเดินทางไกล

        เธอเขียนชื่อ{name}กับเลขสี่ลงบนเศษกระดาษ ใส่ในกระป๋องใบชาฝาบุบที่เอามาด้วย กระป๋องใบนั้นมีเศษกระดาษแบบเดียวกันอยู่อีกเป็นกำ ชื่อคนละคน เลขคนละเลข ทุกแผ่นยังไม่มีรอยขีดฆ่า
      effects: { gold: -4, alignment: { moral: 1 }, people: [{ id: cohort_neris, closeness: 1 }], flags: [lent_neris_coin] }
    - id: cannot_sign
      label: บอกเธอว่าลงชื่อให้ไม่ได้
      text: |
        {mate}ไม่ถามเหตุผล เธอหยิบรายชื่อในย่ามออกมา ขีดชื่อ{name}เป็นเส้นที่สาม เส้นตรง ไม่แรงไม่เบา เท่ากับสองเส้นข้างบน แล้วพับกระดาษกลับใส่ย่าม

        เธอนอนบนเสื่อในครัวคืนนั้น ออกเดินทางตั้งแต่ก่อนสว่าง บนโต๊ะครัวมีตลับไม้เล็กๆ วางไว้หนึ่งตลับ ข้างในเป็นขี้ผึ้งทามือที่เธอเคี่ยวเอง กลิ่นเหมือนห้องของสำนักรักษาตอนเช้า
      effects: { flags: [refused_neris_surety] }

- id: adult.cohort_neris_last_sum
  stage: adult
  scene: temple
  weight: 25
  mark: "{mate}จากไป"
  cast:
    mate: { id: cohort_neris }
  people: [{ id: "@mate", dies: true }]
  when:
    age: [40, 62]
    flags: [institute_cohort]
    not_flags: [institute_student]
  text: |
    หลุมของ{mate}อยู่แถวที่เจ็ดในลานหลังโบสถ์อีเซลของบ้านโม่หิน ลมจากทุ่งข้าวสาลีพัดดินที่เพิ่งกลบให้แห้งเร็ว ไข้ท่าเรือมากับเรือสินค้าลำหนึ่ง เด็กบนเรือป่วยสามคน เธอรักษาทั้งสามคนจนหาย แล้วไอแห้งเองเจ็ดวัน วันที่แปดไม่ได้ลุก

    คนมาส่งเธอมีมากกว่าคนในหมู่บ้าน คนจากเมืองนั่งเกวียนมาสองวัน คนงานโรงกลั่นที่นิ้วไม่ครบ แม่ที่อุ้มลูกมาด้วย ชายคนหนึ่งที่ข้อมือมีแผลเย็บเป็นแนวสวย โทบันพ่อของเธอนั่งเก้าอี้ที่ลูกบ้านแบกมาจากบ้าน หลังงอจนคางเกือบถึงเข่า มือลูบกระป๋องใบชาฝาบุบบนตักไปมา

    ชายจากธนาคารเบเลคยืนอยู่ปลายแถว สมุดปกดำในมือ รอจนแม่ชีตอกเลขแถวกับเลขหลุมลงสันแผ่นหินเสร็จ แล้วเปิดสมุดอ่านออกเสียง ยอดที่ยังค้างของ{mate} ลูกโทบัน ทีละฤดูจนถึงฤดูนี้ จากนั้นอ่านช่องค้ำประกันของสัญญาฉบับแรก นาสองแปลงหลังโบสถ์ แปลงที่หลุมของ{mate}หันหน้าไปหา ธนาคารอ่านยอดที่หลุมศพเสมอ เขาบอก เพราะคนที่ต้องได้ยินอยู่ครบที่นี่
  choices:
    - id: sign_it_over
      label: เดินไปหาเขา ลงชื่อรับยอดที่เหลือมาเป็นของตัวเอง
      text: |
        ชายจากธนาคารไม่แปลกใจ เขาเปิดหน้าใหม่ไว้แล้วตั้งแต่ก่อนอ่าน ช่องค้ำประกันในหน้าใหม่ว่าง {name}ลงชื่อบนหัวกระดาษ ปลายปากกาเย็นจนต้องกำแน่น ลมพัดทรายจากหลุมมาเกาะหมึกก่อนหมึกจะแห้ง

        โทบันไม่ได้ลุกจากเก้าอี้ แกยื่นกระป๋องใบชาบนตักให้{name} ข้างในเป็นเศษกระดาษพับเป็นกำ ชื่อคนละชื่อ เลขคนละเลข ลายมือของ{mate} ทุกแผ่นมีเส้นขีดฆ่า เส้นตรง ไม่แรงไม่เบา เธอใช้คืนครบทุกคนก่อนตาย ยกเว้นธนาคาร
      effects: { gold: -4, debt: true, alignment: { moral: 1 }, flags: [signed_over_neris_debt] }
    - id: pay_it_now
      label: นับเงินจ่ายให้หมดตรงนั้น ต่อหน้าหลุม
      requires: { min_gold: 5 }
      text: |
        {name}นับเหรียญลงบนสมุดปกดำที่เขายังกางอยู่ในมือ ทีละเหรียญ ดังพอให้ทุกคนในลานได้ยิน ชายจากธนาคารนับตามด้วยปาก แล้วขีดเส้นยาวหนึ่งเส้นใต้ยอดสุดท้าย ปิดสมุด

        ลูกบ้านสองคนแบกเก้าอี้ของโทบันกลับบ้านตอนเย็น ผ่านนาสองแปลงหลังโบสถ์ แกให้หยุดตรงคันนา ก้มลงหยิบดินมาหนึ่งกำ ถือไว้ในมือจนถึงบ้าน
      effects: { gold: -5, alignment: { moral: 1 }, flags: [paid_off_neris_debt] }
    - id: bury_the_debt
      label: บอกเขาว่าหนี้ของคนตายควรลงหลุมไปพร้อมคน
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}พูดเสียงไม่ดัง แต่คนทั้งลานเงียบฟัง เรื่องเด็กสามคนบนเรือสินค้า เรื่องมือที่ลอกเพราะน้ำด่าง เรื่องเงินที่เธอจ่ายมาทุกฤดูตั้งแต่ยังใส่เสื้อขอบเทา คนงานโรงกลั่นที่นิ้วไม่ครบเดินมายืนข้าง{name} แล้วคนที่สอง แล้วแม่ที่อุ้มลูก

          ชายจากธนาคารมองแถวคนที่ยืนอยู่ตรงหน้า แล้วบอกว่าธนาคารไม่ฝังหนี้ แต่ธนาคารรอได้ เขาเขียนคำหนึ่งต่อท้ายช่องค้ำประกัน คำว่ารอ แล้วปิดสมุด นาสองแปลงหลังโบสถ์ยังเป็นของโทบันไปจนวันที่แกได้หลุมแถวเดียวกับลูก
        effects: { stats: { CHA: 1 }, flags: [bank_waited_for_toban] }
      failure:
        text: |
          ชายจากธนาคารฟังจนจบ แล้วอ่านช่องค้ำประกันซ้ำอีกรอบ ดังกว่าเดิม บอกว่าหนี้ไม่ได้อยู่ในตัวคน อยู่ในชื่อ ชื่อยังอยู่ในสมุด เขาเขียนชื่อ{name}ลงขอบหน้า ใต้คำว่าผู้คัดค้าน แล้วเก็บค่าคัดค้านตามระเบียบ

          {name}จ่าย เหรียญหล่นลงบนดินที่เพิ่งกลบ ชายจากธนาคารก้มเก็บเอง ปัดดินออกจากเหรียญ แล้วใส่กระเป๋า
        effects: { gold: -2, flags: [objected_at_neris_grave] }
    - id: the_second_surety
      label: บอกเขาว่าชื่อผู้ค้ำของสัญญาฉบับที่สองยืนอยู่ตรงนี้
      requires: { flag: stood_surety_for_neris }
      text: |
        ชายจากธนาคารพลิกย้อนไปหลายหน้าจนเจอลายมือของ{name} หมึกซีดเป็นสีน้ำตาลแล้ว เขาบอกว่าสัญญาฉบับนั้นครบสิบปีไปนานแล้ว ชื่อผู้ค้ำหมดอายุไปพร้อมสัญญา ธนาคารไม่ได้เรียกหาชื่อใหม่ เพราะสิบปีนั้นเธอไม่เคยจ่ายช้าสักฤดู ยอดที่เหลือจึงย้อนกลับไปหาหลักประกันของฉบับแรก

        {name}ขอปากกา เขียนชื่อเดิมลงใต้ชื่อเดิม เขาเอาไม้บรรทัดทาบ ขีดเส้นทับคำว่านาสองแปลง เป่าหมึก แล้วอ่านยอดให้ฟังอีกรอบ คราวนี้หันหน้ามาทาง{name} โทบันได้ยินไม่ครบทุกคำ แกถามคนข้างเก้าอี้ว่าเขาอ่านชื่อใคร
      effects: { gold: -3, debt: true, alignment: { moral: 1 }, flags: [stood_surety_for_neris_twice] }
    - id: walk_back
      label: ยืนฟังจนเขาอ่านจบ แล้วเดินกลับไปที่เกวียน
      text: |
        ชายจากธนาคารอ่านจนจบทุกบรรทัด แล้วบอกโทบันว่าธนาคารจะมาดูนาหลังเก็บเกี่ยว โทบันไม่ตอบ แกนั่งลูบกระป๋องใบชาบนตักต่อไป

        เกวียนขากลับมีคนจากเมืองนั่งมาแน่น ชายที่ข้อมือมีแผลเย็บเป็นแนวสวยนั่งข้าง{name} ตลอดทางเขาเล่าว่าเธอเย็บแผลนี้ให้กลางดึก ด้วยแสงตะเกียงที่น้ำมันใกล้หมด ไม่ขอเงินสักเหรียญ เย็บเสร็จแล้วถามว่าที่บ้านเขามีใครเป็นแผลอีกไหม
      effects: { flags: [left_neris_debt_to_the_bank] }

# ---------- เธริล ----------

- id: adult.cohort_theril_witness
  stage: adult
  scene: home
  weight: 25
  cast:
    mate: { id: cohort_theril }
  when:
    age: [24, 38]
    flags: [institute_cohort]
    not_flags: [institute_student]
  text: |
    {mate}นั่งอยู่บนหลังคาตอนที่{name}ปีนขึ้นไปตามเสียงเรียก หน้าเขายังเหมือนคืนที่เขียนจดหมายบนเตียงในห้องห้าคน ไม่แก่ขึ้นสักปี เขาเดินทางนับฟ้ามาสามเมืองแล้วในหนาวนี้ หอนับดาวอยากได้ตัวเลขจากหลังคาหลายที่ เมืองละคืน

    เขาไม่ได้มาเพราะตัวเลข เขาส่งจดหมายฉบับหนึ่งให้{name} ลายมือเอลฟ์เส้นยาวเป็นสายน้ำ ส่วนท้ายเป็นตารางตัวเลขเรียงเดือน จดหมายฉบับนี้เขาเขียนมาแล้วทุกเดือนตั้งแต่ปีหนึ่ง ใจความเหมือนเดิมทุกฉบับ คนเวนทราสรู้ว่าฟ้าเต็มขึ้นทุกปี รู้จากราคาน้ำค้างดาวที่ถูกลงทุกปี และไม่อยากรู้มากไปกว่านั้น

    คำตอบจากไอเลธก็เหมือนเดิมทุกฉบับ ให้เขียนต่อไป คราวนี้หอนับดาวขอมากกว่านั้น ขอชื่อคนนอกหอหนึ่งชื่อลงไว้ใต้จดหมาย ชื่อของคนที่อ่านแล้วยืนยันว่าเธริลเขียนตามจริง เธริลยื่นปากกาให้ บอกว่า{name}เป็นคนเดียวที่เขาจะกล้าขอ
  choices:
    - id: sign_it
      label: ลงชื่อใต้จดหมายของเขา
      text: |
        {name}เขียนชื่อลงบนขอบกระดาษที่เขาเว้นไว้ ตัวหนังสือตัวเหลี่ยมแบบที่สถาบันสอนคัดอยู่ใต้ลายมือเอลฟ์ที่ไหลยาว ดูเหมือนก้อนหินใต้น้ำ {mate}เป่าหมึกให้แห้งแล้วพับจดหมายใส่ฝักไม้สีน้ำตาลอ่อน ฝักแบบที่ต้นไม้ในไอเลธทิ้งลงมาทุกใบไม้ร่วง

        เขาบอกว่าจดหมายฉบับนี้จะไปถึงไอเลธก่อนหิมะ คำตอบจะมาถึงก่อนหิมะครั้งหน้า แล้วเขาก็นอนลงบนหลังคา นับฟ้าต่อจนถึงเช้า ปากขยับเป็นเสียงนับภาษาเอลฟ์
      effects: { people: [{ id: cohort_theril, closeness: 1 }], flags: [signed_therils_letter] }
    - id: read_it_all
      label: ขออ่านทุกบรรทัดกับตัวเลขทุกแถวก่อน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ตัวเลขในตารางเรียงเดือนละแถว ตั้งแต่เดือนแรกที่เขาขึ้นหลังคาหอพัก จนถึงเดือนนี้ {name}ไล่นิ้วลงไปทีละแถว ตัวเลขขึ้นช้าๆ ขึ้นไม่เคยลง บางเดือนขึ้นมากกว่าเดือนอื่น เดือนเหล่านั้นตรงกับเดือนที่ราคาน้ำค้างดาวในตลาดลดลงพอดี {mate}จดราคาไว้ข้างตัวเลขด้วยทุกเดือน

          คืนนั้น{name}นับช่องฟ้าช่องเดียวกับเขา ตัวเลขที่ได้น้อยกว่าของเขาสองดวง เขาบอกว่าตาที่ยังนับมาไม่ถึงร้อยปีพลาดสองดวงทุกคน ทุกครั้ง แล้วเขียนตัวเลขของ{name}ลงจดหมายด้วย ข้างชื่อของ{name}
        effects: { stats: { INT: 1 }, people: [{ id: cohort_theril, closeness: 1 }], flags: [read_therils_numbers, signed_therils_letter] }
      failure:
        text: |
          ตัวเลขของหอนับดาวนับเป็นกองละสิบสอง ไม่ใช่สิบแบบที่สถาบันสอน {name}แปลงกลับทีละแถวด้วยถ่านบนกระเบื้องหลังคาจนนิ้วดำ แปลงไปได้ครึ่งตาราง หัวเริ่มปวดตรงหลังตา ลมบนหลังคาหนาวจนมือสั่น

          {name}ลงชื่อตอนฟ้าเริ่มสาง ตัวเลขครึ่งหลังยังไม่ได้อ่าน {mate}ไม่ถามว่าอ่านจบหรือเปล่า เช้านั้น{name}จามไม่หยุดจนเที่ยง กระเบื้องหลังคาแผ่นนั้นยังมีตัวเลขถ่านติดอยู่จนฝนแรกของปี
        effects: { hp: -1, flags: [signed_therils_letter] }
    - id: count_together
      label: นั่งนับช่องฟ้ากับเขาก่อน แบบที่วิเรีย ซอลเดน สอนบนทางเดินรอบโดม
      requires: { flag: school_stars }
      text: |
        จุกไม้ก๊อกที่สำนักแจกยังอยู่ในกระเป๋าเสื้อ{name} {name}คาบไว้ เริ่มนับช่องฟ้าช่องเดียวกับเธริล ด้วยตาเปล่า ไม่ออกเสียง เขานับเป็นภาษาเอลฟ์ ปากขยับ ทั้งสองนับเสร็จเกือบพร้อมกัน ตัวเลขตรงกันทุกหลัก

        {mate}เขียนตัวเลขสองแถวลงท้ายจดหมาย แถวของเขากับแถวของ{name} เหมือนกันทุกตัว แล้วให้{name}ลงชื่อใต้แถวที่สอง บอกว่าหอนับดาวจะเชื่อตัวเลขของสถาบัน ก็ต่อเมื่อตัวเลขนั้นนับบนหลังคาข้างคนของหอ
      effects: { stats: { WIS: 1 }, people: [{ id: cohort_theril, closeness: 1 }], flags: [counted_the_sky_with_theril, signed_therils_letter] }
    - id: refuse_to_sign
      label: บอกเขาว่าไม่อยากเป็นชื่อคนนอกชื่อเดียวในจดหมายของหอนับดาว
      text: |
        {mate}ไม่เถียง เขาฟัง แล้วหยิบปากกากลับไป เขียนอะไรบางอย่างลงท้ายจดหมายด้วยลายมือที่ไหลยาว ยาวสองบรรทัด

        {name}ถามว่าเขียนอะไร เขาอ่านให้ฟังโดยไม่ลังเล คนที่ข้าไว้ใจที่สุดตั้งแต่ลงจากไอเลธมาอ่านจดหมายฉบับนี้แล้ว และไม่อยากให้ชื่อตัวเองอยู่ใต้จดหมาย แล้วเขาก็พับจดหมายใส่ฝักไม้ บอกว่าฉบับนี้หอนับดาวคงเชื่อ
      effects: { flags: [refused_therils_letter] }

- id: adult.cohort_theril_still_thirty
  stage: adult
  scene: market
  weight: 25
  cast:
    mate: { id: cohort_theril }
  when:
    age: [40, 62]
    flags: [institute_cohort]
    not_flags: [institute_student]
  text: |
    ชายหนุ่มที่ต่อราคาเทียนไขอยู่หน้าแผงในตลาดหน้าเหมือนลูกชายของเธริล {name}คิดอย่างนั้นจนเขาเขียนราคาลงบนฝ่ามือตัวเองด้วยปลายนิ้วเปียกน้ำลาย ท่าเดียวกับที่เขาจดราคาหลอดน้ำค้างดาวในปีหนึ่ง {mate}หันมาเจอ{name}พอดี ยิ้มแบบคนที่เพิ่งเจอกันเมื่อเดือนก่อน หน้าเขาตอนนี้เหมือนคนอายุสามสิบ {name}เห็นหน้าตัวเองในกระจกร้านข้างแผง แล้วไม่อยากเห็นอีก

    ในย่ามของเขามีห่อกระดาษมัดเชือกหนาเท่าหมอน คำตอบจากไอเลธทุกฉบับตั้งแต่ปีหนึ่ง เขาแกะเชือกออกให้ดูกลางตลาด ฉบับแรกกับฉบับล่าสุดเขียนเหมือนกันทุกคำ ลายมือคนละคน ให้เขียนต่อไป

    ฤดูหน้าหอนับดาวจะส่งคนมาแทน คนใหม่อายุน้อยกว่าเธริลแปดสิบปี เขาจะกลับไอเลธก็ได้ อยู่ต่อก็ได้ หอไม่ได้สั่ง เขาถาม{name}ว่าคนที่อยู่เวนทราสมานานเท่าชีวิตคนหนึ่งคนแบบเขา ควรทำอย่างไรกับจดหมายที่ไม่มีใครอ่าน
  choices:
    - id: go_home
      label: บอกให้เขากลับไปดูเองว่าที่ไอเลธมีใครอ่าน
      text: |
        {mate}ซื้อเทียนไขทั้งกำที่ต่อราคาไว้ แล้วแบ่งให้{name}ครึ่งหนึ่ง บอกว่าที่ไอเลธเขาไม่จุดตะเกียงฟ้า ได้แต่เทียนไขแบบนี้ เขาเคยชิน

        ปีต่อมามีจดหมายมาถึง{name}เป็นครั้งแรก ฝักไม้สีน้ำตาลอ่อนแบบเดียวกับที่เขาใช้ส่งกลับบ้านมาตลอด ข้างในมีกระดาษแผ่นเดียว ลายมือเอลฟ์เส้นยาว เขียนว่าเขาเจอจดหมายของเขาครบทุกฉบับ อยู่ในหีบสามใบใต้ต้นไม้ต้นหนึ่ง ทุกฉบับแกะแล้ว และทุกฉบับมีรอยดินสอขีดเส้นใต้บรรทัดเดียวกัน
      effects: { people: [{ id: cohort_theril, closeness: 1 }], flags: [told_theril_to_go_home] }
    - id: stay
      label: ขอให้เขาอยู่ต่อ
      text: |
        {mate}บอกว่าตั้งแต่ลงจากไอเลธมา เพิ่งมีคนพูดคำนี้กับเขาเป็นครั้งแรก ฟังแล้วแปลกหูดี แล้วเขาก็ซื้อเทียนไขเพิ่มอีกกำ พอสำหรับเขียนจดหมายไปอีกหลายปี

        เดือนต่อมาเขาย้ายมาเช่าห้องห่างจากที่พักของ{name}ไม่ถึงสองถนน ทุกคืนที่ฟ้าโปร่ง ไฟเทียนในห้องของเขาจุดจนถึงตีสองเหมือนเดิม จดหมายฉบับใหม่ของเขามีชื่อ{name}อยู่ในทุกฉบับ
      effects: { people: [{ id: cohort_theril, closeness: 1 }], flags: [asked_theril_to_stay] }
    - id: write_yourself
      label: เขียนจดหมายถึงหอนับดาวเองหนึ่งฉบับ ด้วยลายมือของตัวเอง
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          {name}เขียนสั้นกว่าจดหมายทุกฉบับของเธริล ไม่มีตารางตัวเลข มีแต่สิ่งที่คนในเมืองพูดกันในตลาด ในร้านเหล้า ที่หน้าวิหาร เวลามีใครชี้ขึ้นฟ้า แล้วบอกตรงๆ ว่าตัวเองก็เป็นคนหนึ่งในนั้น คนที่เห็น และไม่ได้ทำอะไร {mate}ส่งไปพร้อมจดหมายฉบับของเดือนนั้น

          คำตอบมาถึงก่อนหิมะ ฝักไม้สองฝัก ฝักของเธริลยังเขียนเหมือนเดิม ให้เขียนต่อไป ฝักของ{name}เขียนบรรทัดเดียวเหมือนกัน แต่เป็นคำที่ต่างออกไป ขอบใจที่บอก
        effects: { stats: { WIS: 1 }, reputation: { star_hall: 1 }, people: [{ id: cohort_theril, closeness: 1 }], flags: [wrote_to_the_star_hall] }
      failure:
        text: |
          {name}เขียนสามคืน ทิ้งไปสองฉบับ ฉบับที่สามยาวกว่าที่ตั้งใจ อธิบายมากกว่าบอก ค่าส่งไปไอเลธแพงกว่าค่าส่งไปเมืองไหน เพราะต้องผ่านมือคนชายป่าสองทอด

          คำตอบมาถึงก่อนหิมะ ฝักไม้ฝักเดียว จ่าหน้าถึงเธริล ข้างในมีกระดาษสองแผ่น แผ่นหนึ่งของเธริล อีกแผ่นจดหมายของ{name}เองที่ส่งกลับมา มีรอยดินสอขีดเส้นใต้บรรทัดหนึ่ง เธริลบอกว่าแปลว่ามีคนอ่าน
        effects: { gold: -1, flags: [wrote_to_the_star_hall_too_long] }
    - id: the_ladys_table
      label: บอกเขาเรื่องโต๊ะของท่านหญิงฮาสทิลในปีหนึ่ง เรื่องที่เล่าให้นางฟัง
      requires: { flag: told_the_lady_about_theril }
      text: |
        {mate}ฟังจนจบโดยไม่ขัด แล้วดึงจดหมายฉบับหนึ่งออกจากกลางห่อ ฉบับที่สี่ที่เขาเขียนกลับไอเลธ เขาเก็บสำเนาไว้ทุกฉบับ ในฉบับนั้นมีบรรทัดหนึ่งเขียนว่า คนในห้องของข้าคนหนึ่งเล่าเรื่องข้าให้เจ้าของโรงกลั่นฟังเพื่อแลกค่าเสื้อ ข้าไม่โกรธ คนคนนั้นต้องกินข้าว

        เขาบอกว่าคำตอบของฉบับที่สี่เป็นฉบับเดียวที่ไม่ได้เขียนว่าให้เขียนต่อไป หอเขียนกลับมาว่า ให้อยู่ห้องเดิม
      effects: { alignment: { moral: 1 }, people: [{ id: cohort_theril, closeness: 1 }], flags: [confessed_the_ladys_table_to_theril] }

# ---------- คนที่ออกจากสถาบัน ----------

- id: adult.institute_dropout_work
  stage: adult
  scene: workshop
  weight: 1000
  must: true
  when:
    age: [19, 27]
    flags: [institute_left]
    not_flags: [institute_student, job_artificer, job_bank_spy, job_bough_crafter, job_bounty_hunter, job_city_priest, job_clerk, job_docker, job_farmer, job_fort_priest, job_guide, job_hedge_doctor, job_house_singer, job_mercenary, job_merchant, job_miner, job_navy, job_news_walker, job_refinery_hand, job_researcher, job_road_healer, job_scout, job_smith, job_smuggler, job_swindler, job_troupe, job_wardens]
  text: |
    เงินที่เหลือนับได้บนฝ่ามือเดียว ที่ซุกหัวนอนคิดเงินเป็นรายคืน และคืนนี้ยังไม่ได้จ่าย {name}ใช้เวทวิชาได้ทุกอย่างที่เรียนมา ไม่มีอะไรหายไปจากมือพร้อมกับชื่อในสมุดของสถาบัน แต่ร้านไหนที่ติดป้ายหาช่าง ก็ถามหาชื่อในทะเบียนก่อนถามว่าทำอะไรเป็น คนในตรอกหลังตลาดมีคำเรียกคนแบบ{name}อยู่แล้ว ช่างเวทเถื่อน

    เมื่อวานชายคนหนึ่งดักรอที่บันได ถือโคมน้ำค้างดาวที่ไส้ขาด ร้านที่มีชื่อคิดค่าซ่อมเท่าค่าโคมใหม่ เขาได้ยินมาว่า{name}เคยใส่เสื้อขอบเทา เช้านี้หญิงคนหนึ่งพาลูกชายมายืนหน้าประตู แขนเด็กพองเพราะน้ำร้อนลวก หมอที่มีป้ายอยู่ห่างไปสามถนน และไม่รับคนที่จ่ายเป็นไข่ไก่

    ทั้งสองคนยืนรอคำตอบอยู่คนละมุมของทางเดิน
  choices:
    - id: back_bench
      label: รับโคมไว้ แล้วตั้งโต๊ะช่างในตรอกหลังร้านซ่อมกระทะ
      text: |
        เจ้าของร้านซ่อมกระทะให้เช่ามุมหลังร้านเดือนละเหรียญเดียว ตรงนั้นผู้ตรวจทะเบียนไม่เคยเดินมาถึง เพราะต้องมุดราวตากผ้าสามราว {name}ต่อไส้โคมเสร็จก่อนเที่ยง ชายคนนั้นจ่ายครึ่งเหรียญ แล้วกลับมาตอนบ่ายพร้อมกาต้มน้ำของน้องสาว ใบที่ร้อนเองไม่ได้มาสองฤดูแล้ว

        ปลายเดือนมีของรอซ่อมวางอยู่บนพื้นหลังร้านจนเต็ม ไม่มีป้าย ไม่มีชื่อ คนที่มาส่งของรู้ทางเอง โต๊ะช่างตัวนั้นเป็นบานประตูเก่าวางบนลังสองใบ ขอบโต๊ะมีรอยไหม้รูปนิ้วมือของ{name}ทั้งห้านิ้ว
      effects: { stats: { DEX: 1 }, mark: เริ่มงานแรก, flags: [job_artificer, unregistered_mage] }
    - id: back_room_cure
      label: พาเด็กเข้าห้อง แล้วเปิดห้องรักษาคนที่จ่ายหมอมีป้ายไม่ไหว
      text: |
        {name}ล้างแผลด้วยน้ำต้มที่เย็นแล้ว เจาะตุ่มน้ำ ทายา แล้ววางมือไว้เหนือแขนเด็กจนผิวที่แดงจางลง แม่ของเด็กยื่นไข่ไก่ให้หกฟอง ห่อผ้ามาอย่างดี ไม่แตกสักฟอง

        สัปดาห์ต่อมาประตูห้องมีคนมายืนรอทุกเช้า คนงานที่นิ้วโดนเครื่อง ยายที่ไอไม่หยุด เด็กที่ตกหลังคา {name}เขียนป้ายด้วยถ่านติดไว้ด้านในประตู ไม่ได้ติดด้านนอก คนที่ต้องรู้ก็รู้กันเอง ไข่ไก่ในตะกร้าหลังห้องไม่เคยหมด
      effects: { alignment: { moral: 1 }, mark: เริ่มงานแรก, flags: [job_hedge_doctor, unregistered_mage] }
    - id: pawn_room
      label: ไปรับงานซ่อมของจำนำในห้องหลังของธนาคารเบเลค
      requires: { flag: entry_loan }
      text: |
        ชายจากธนาคารคนเดิม คนที่อ่านยอดให้ฟังทุกฤดู รู้ว่า{name}ออกจากสถาบันก่อนใครในห้อง เขาเปิดห้องหลังของสำนักงานให้ดู ชั้นวางเต็มไปถึงเพดาน โคม แขนกล กาต้มน้ำ นาฬิกาที่เดินด้วยน้ำค้างดาว ของที่ลูกหนี้เอามาวางแล้วไม่ได้กลับมาเอา ของเสียขายไม่ได้ ของดีขายได้ ช่างที่มีชื่อในทะเบียนคิดแพง ช่างที่ไม่มีชื่อ ธนาคารคิดราคาเอง

        ค่าแรงสองเหรียญต่อเดือน กับยอดหนี้ที่หยุดงอกชั่วคราวตราบที่{name}ยังนั่งโต๊ะในห้องนี้ ห้องหลังไม่มีหน้าต่าง มีตะเกียงฟ้าแขวนต่ำดวงเดียว แสงตกลงบนโต๊ะพอดี แบบเดียวกับห้องคัดสมุดบัญชี
      effects: { gold: 2, reputation: { belek_bank: 1 }, mark: เริ่มงานแรก, flags: [job_artificer, unregistered_mage] }

- id: adult.institute_left_register
  stage: adult
  scene: workshop
  weight: 25
  when:
    age: [20, 55]
    flags: [institute_left]
  text: |
    ผู้ตรวจทะเบียนช่างเวทถือสมุดสองเล่ม เล่มหนาเป็นทะเบียนของเมือง ชื่อช่างเวทที่มีสิทธิ์รับงาน เรียงตามถนน เล่มบางเป็นรายชื่อที่สถาบันเวทหลวงส่งมาให้ทุกปี คนที่ออกกลางคัน ชื่อทุกชื่อในเล่มบางมีเส้นขีดทับ เส้นเดียวบ้าง สองเส้นบ้าง

    เขามาเพราะมีคนเห็นแสงลอดจากนิ้วมือของ{name} ใครเห็นเขาไม่บอก เขาเปิดเล่มหนาไปที่หน้าของถนนนี้ ไล่นิ้วลงทีละบรรทัด แล้วเปิดเล่มบาง ไล่นิ้วลงอีกรอบ ชื่อของ{name}อยู่ในเล่มบาง ไม่อยู่ในเล่มหนา

    เขาบอกว่าเขามาดูชื่อในทะเบียน ขอดูหน่อย ชื่อที่เขาก็รู้อยู่แล้วว่าไม่มี เขาพูดช้า ไม่รีบ เหมือนคนที่ทำงานนี้มานานจนรู้ว่าคำตอบแบบไหนจะตามมา
  choices:
    - id: talk_him_round
      label: บอกเขาว่าแสงที่คนเห็นมาจากโคม ไม่ใช่จากนิ้ว
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ยกโคมน้ำค้างดาวบนชั้นลงมาวางตรงหน้าเขา เปิดฝา หมุนไส้ ให้แสงพุ่งลอดช่องหน้าต่างออกไปทางถนนแบบที่คนข้างนอกคงเห็น แล้วอธิบายว่าโคมใบนี้ไส้รั่ว แสงเลยกระตุกเป็นจังหวะ ใครมองจากถนนก็คงนึกว่าเป็นมือคน

          ผู้ตรวจฟังจนจบ ปิดเล่มหนา เขียนคำหนึ่งลงในเล่มบาง ข้างชื่อของ{name} คำว่าไม่พบ ตอนเดินออกไปเขาหยุดที่ประตู บอกว่าโคมใบนั้นควรเปลี่ยนไส้ได้แล้ว ทำเองก็ได้ ถ้าทำเป็น
        effects: { stats: { CHA: 1 }, flags: [talked_past_the_register] }
      failure:
        text: |
          ผู้ตรวจฟังจนจบ แล้วถามว่าโคมใบนั้นซื้อมาจากร้านไหน {name}ตอบช้าไปหนึ่งจังหวะ เขาเขียนชื่อร้านที่{name}บอกลงไปทั้งที่รู้ว่าไม่มีร้านนั้น แล้วเขียนค่าปรับต่อท้าย

          ค่าปรับเท่าค่ากินสามสัปดาห์ เขารับเหรียญ นับ ออกใบรับให้หนึ่งใบ ด้านหลังใบรับพิมพ์ไว้ว่า ครั้งที่สองปรับสองเท่า ครั้งที่สามส่งชื่อต่อ ส่งไปที่ไหนไม่ได้พิมพ์ไว้
        effects: { gold: -2, flags: [register_fined_you] }
    - id: coin_under_the_book
      label: สอดเหรียญไว้ใต้สมุดเล่มหนาของเขา
      requires: { min_gold: 2 }
      text: |
        เขายกสมุดเล่มหนาขึ้น เหรียญสองเหรียญหายไปโดยไม่มีเสียง เร็วจน{name}ไม่แน่ใจว่าเห็นมือเขาขยับ เขาเขียนลงเล่มบางว่าไม่พบ ลายมือเรียบร้อย

        ก่อนไป เขาบอกว่าเขามาถนนนี้ปีละครั้ง เดือนเดิม วันเดิม ถ้าวันนั้นโต๊ะของ{name}ไม่มีอะไรวางอยู่ เขาก็ไม่ต้องเปิดสมุดให้เมื่อยมือ ใต้สมุดก็ไม่ต้องมีอะไร
      effects: { gold: -2, alignment: { law: -1 }, flags: [paid_the_register_man] }
    - id: let_him_write
      label: บอกตามจริงว่าไม่มีชื่อ ให้เขาเขียนลงไปตามระเบียบ
      text: |
        ผู้ตรวจเขียนช้าๆ ชื่อ ถนน งานที่ทำ วันที่เห็นแสง ใต้บรรทัดนั้นเขาเขียนค่าปรับ เท่าค่ากินสองสัปดาห์ แล้วอ่านทั้งหมดให้ฟังด้วยเสียงเดียวกัน ทุกคำ

        เขาบอกว่าคนที่ยอมให้เขียนแต่ครั้งแรกมีไม่มาก ครั้งหน้าถ้าเห็นแสงอีก ชื่อนี้จะอยู่ในเล่มที่สาม เล่มที่เขาไม่ได้ถือมา ตอนเดินออกไป เขาขีดเส้นใต้ชื่อของ{name}ในเล่มบางหนึ่งเส้น
      effects: { gold: -2, alignment: { law: 1 }, flags: [register_wrote_your_name] }

- id: adult.institute_left_registrar
  stage: adult
  scene: market
  weight: 25
  when:
    age: [20, 34]
    flags: [institute_left]
  text: |
    ร้านขายหมึกในตลาดมีลูกค้าคนเดียว ชายแก่ที่ถามราคาหมึกดำขวดใหญ่ด้วยเสียงเดียวกันทุกคำ เหมือนอ่านข้อผูกพันให้ใครฟัง นายทะเบียนฮัลบริคผมเหลือไม่กี่เส้น หลังงอลง แต่ยังถือสมุดขอบเทาไว้ใต้แขน เล่มที่เล็กกว่าเล่มในโถงหน้า

    เขาจำ{name}ได้ก่อน{name}จำเขาได้ เรียกชื่อเต็ม แล้วบอกปีที่ขีดเส้นทับชื่อนั้น ถูกต้อง ไม่ต้องเปิดดู เขาบอกว่าจำได้ทุกชื่อที่ตัวเองขีด เพราะขีดเองทุกเส้น

    ทุกปีสถาบันให้เขาส่งรายชื่อคนที่ออกกลางคันไปที่ทะเบียนของเมือง ข้างชื่อต้องเขียนว่าคนนั้นไปทำอะไร อยู่ที่ไหน เล่มเล็กใต้แขนคือรายชื่อปีนี้ เขาเปิดถึงหน้าที่มีชื่อ{name} ช่องข้างชื่อยังว่าง แล้วเขาถามด้วยเสียงเดียวกับที่ถามราคาหมึก ว่าจะให้เขียนว่าอะไร
  choices:
    - id: tell_him_true
      label: บอกเขาตามจริง ว่าทำอะไร อยู่ที่ไหน
      text: |
        ฮัลบริคเขียนตามคำบอก ทีละคำ ไม่ย่อ ไม่ถามซ้ำ ตัวหนังสือของเขาเล็กลงกว่าเมื่อก่อน แต่ยังตรงเหมือนเดิม เขาโรยทรายซับหมึกจากถุงเล็กที่พกไว้ เป่าทีเดียว

        แล้วเขาก็ซื้อหมึกขวดใหญ่ บอกว่าปีนี้มีคนออกกลางคันมากกว่าปีก่อน ช่องว่างข้างชื่อต้องใช้หมึกมาก เขาเดินออกจากร้านไป สมุดเล่มเล็กหนีบใต้แขนข้างเดิม
      effects: { alignment: { law: 1 }, flags: [halbric_wrote_your_trade] }
    - id: ask_for_unknown
      label: ขอให้เขาเขียนว่าไม่ทราบ
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ปลายปากกาของฮัลบริคค้างอยู่เหนือช่องว่างนานเท่าที่ใช้อ่านข้อผูกพันหนึ่งบรรทัด แล้วเขาก็เขียนว่าไม่ทราบ ตัวหนังสือตรงเท่าคำอื่นทุกคำในเล่ม เขาบอกว่าช่องนี้มีคำว่าไม่ทราบมากกว่าคำอื่นทุกปี เขียนบ่อยจนมือจำได้เอง

          ก่อนจากกัน เขาเปิดหน้าก่อนหน้านั้นให้ดูหนึ่งหน้า ชื่อนักเรียนปีเดียวกับ{name}สิบสองชื่อ ข้างชื่อเขียนว่าไม่ทราบสิบเอ็ดชื่อ
        effects: { stats: { CHA: 1 }, flags: [halbric_wrote_unknown] }
      failure:
        text: |
          ฮัลบริคบอกว่าเขาไม่ได้ถามเพราะไม่รู้ เขาถามเพื่อให้{name}ได้พูดเอง แล้วเขาก็เขียนงานกับถนนที่{name}อยู่ลงไปตรงนั้น ถูกทุกคำ ในตลาดนี้มีคนอยากเล่าเรื่องของคนอื่นให้นายทะเบียนฟังเสมอ เขาบอก

          {name}จ่ายค่าหมึกขวดใหญ่ให้เขา เพราะไม่รู้จะทำอะไรกับมือ เขารับไว้ ขอบใจ แล้วบอกว่าขวดนี้คงพอใช้ถึงปีหน้า
        effects: { gold: -1, flags: [halbric_wrote_your_trade] }
    - id: his_cough
      label: ฟังเสียงไอของเขา แล้วพาเขาไปนั่งในร้านน้ำชาข้างตลาด
      requires: { flag: job_hedge_doctor }
      text: |
        เสียงไอของฮัลบริคมาจากลึกกว่าคอ {name}ให้เขานั่ง แกะกระดุมเสื้อสองเม็ด วางมือไว้บนอกเขาจนลมหายใจที่ติดขัดลื่นขึ้น ฮัลบริคนั่งนิ่งให้ทำ ไม่ถามว่ามือนั้นมีชื่อในทะเบียนไหม

        พอเสร็จ เขาปิดสมุดเล่มเล็กโดยไม่ได้เขียนอะไรในช่องข้างชื่อ{name} บอกว่าวันนี้หมึกหมด ขวดใหญ่ที่เพิ่งซื้อมายังวางอยู่บนโต๊ะร้านน้ำชา ปากขวดยังมีขี้ผึ้งปิดอยู่ทั้งแผ่น
      effects: { alignment: { moral: 1 }, flags: [treated_halbric] }

- id: adult.institute_left_cold_iron
  stage: adult
  scene: home
  weight: 25
  when:
    age: [22, 55]
    flags: [institute_left]
    # คนที่สาบานกับเตาแล้ว หรือเคยสาบาน เตารู้จักหน้าอยู่แล้ว ไม่ต้องมาถามเพื่อนบ้าน (ชุด อ)
    not_orgs: [cold_iron]
    not_flags: [left_the_cold_iron]
  text: |
    หญิงซักผ้าที่บ่อน้ำหัวถนนเล่าให้{name}ฟังโดยไม่หยุดบิดผ้า ว่าเมื่อวานมีผู้ชายสองคนมาถาม ไม่ได้ใส่เครื่องแบบของใคร พูดเบา ขอบคุณทุกครั้งที่มีคนตอบ คนหนึ่งถือคีมยาวสีดำด้าน อีกคนถือไม้บรรทัดเหล็กยาวที่มีรอยบาก กับพวงกุญแจที่กระทบกันแล้วไม่มีเสียงดังกังวาน ตอนพวกเขาเดินผ่าน น้ำในถังของนางเย็นลงจนนิ้วชา นางว่าเหล็กแบบนั้นนางไม่เคยเห็น

    พวกเขาถามว่าถนนนี้ใครซ่อมของโดยไม่มีตรา ใครรักษาแผลโดยไม่มีใบ ใครมีแสงที่ปลายนิ้ว ถามทุกบ้าน ทีละบ้าน นางบอกว่าไม่รู้ พวกเขาขอบคุณแล้วจดชื่อนางลงไปด้วย

    ตอนกลับถึงบ้าน {name}เห็นรอยบากเล็กๆ บนวงกบประตูของตัวเอง สูงเท่าระดับไหล่ ใหม่ เนื้อไม้ยังขาว ประตูบ้านอื่นตลอดแถวไม่มีรอยแบบนั้น
  choices:
    - id: find_them_first
      label: ออกไปหาพวกเขาเองก่อนพวกเขาจะกลับมา
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          สองคนนั้นนั่งกินข้าวต้มอยู่ที่ร้านหัวตลาด {name}นั่งลงตรงข้ามโดยไม่ขอ คนที่ถือไม้บรรทัดยิ้ม ถามชื่อ แล้วถามเรื่องที่สถาบัน ปีไหน สำนักไหน ทำไมออก ถามสุภาพเหมือนคนจดทะเบียนวัว {name}ตอบเท่าที่ต้องตอบ ไม่เกินนั้น

          เขาจดลงสมุดเล่มเล็กปกหนังสีดำ แล้วบอกว่าวันนี้แค่มาถาม มาถามก่อนทุกครั้ง พอ{name}ลุกขึ้น คีมสีดำวางพาดอยู่บนโต๊ะใกล้มือ{name}ห่างแค่คืบเดียว ปลายนิ้วชาไปจนถึงข้อมือ ไม่มีใครในสองคนนั้นขยับไปหยิบมัน
        effects: { stats: { CHA: 1 }, hunted: { cold_iron: 1 }, flags: [cold_iron_asked_about_you, met_the_quiet_men] }
      failure:
        text: |
          {name}เจอพวกเขาที่ร้านหัวตลาด คนที่ถือคีมยื่นคีมมาให้ถือ ขอให้ช่วยถือไว้ระหว่างเขาจดชื่อ พูดสุภาพจนปฏิเสธไม่ทัน พอนิ้วแตะด้ามเหล็ก ความเย็นแล่นขึ้นแขนเหมือนจุ่มมือลงในน้ำแข็ง แสงที่ปลายนิ้วดับวูบ ทั้งมือหมดแรงจนคีมร่วงลงพื้น

          เขาก้มเก็บคีม ขอบคุณ แล้วจดอะไรบางอย่างเพิ่มอีกบรรทัด กว่าความรู้สึกจะกลับมาที่นิ้วก็ตกค่ำ ตรงที่แตะด้ามคีมยังเป็นรอยแดงเหมือนแผลไฟลวกอยู่อีกหลายวัน
        effects: { hp: -2, hunted: { cold_iron: 1 }, flags: [cold_iron_asked_about_you, held_the_cold_tongs] }
    - id: lie_low
      label: เก็บเครื่องมือ ปิดประตู ไม่ใช้เวทวิชาสักฤดู
      text: |
        {name}เก็บของทุกชิ้นที่อาจมีใครจำได้ใส่หีบ ซุกไว้ใต้เตียง ใช้มือแบบคนทั่วไปทำงานแบบคนทั่วไป ฤดูนั้นเงินเข้าน้อยกว่าที่ออก ค่าข้าวเป็นหนี้ร้านข้าวต้มไปหลายมื้อ

        ปลายฤดู รอยบากบนวงกบประตูมีรอยที่สองอยู่ข้างๆ สูงเท่ากัน ใหม่ เนื้อไม้ยังขาว ไม่มีใครในถนนเห็นว่าใครมาทำไว้เมื่อไร
      effects: { gold: -2, hunted: { cold_iron: 1 }, flags: [cold_iron_asked_about_you, laid_low_a_season] }
    - id: ask_the_washerwoman
      label: ซื้อขนมปังให้หญิงซักผ้า แล้วถามว่าพวกเขาจดอะไรไปอีกบ้าง
      text: |
        หญิงซักผ้าหยุดบิดผ้าเป็นครั้งแรก ตอนกัดขนมปัง นางบอกว่าคนที่ถือไม้บรรทัดถามชื่อนางก่อน แล้วถามว่ามีคนบ้านไหนที่นางไม่อยากให้เขารู้จัก นางบอกว่าไม่มี เขาจดว่าไม่มี

        แล้วนางก็บอกอีกเรื่องที่ไม่ได้เล่าในตอนแรก ก่อนไป สองคนนั้นยืนอยู่หน้าบ้านของ{name}ครู่หนึ่ง คนที่ถือคีมเอาปลายคีมแตะวงกบประตู แตะแค่นั้น ไม่ได้ขีด รอยบากนั้นเกิดขึ้นเอง
      effects: { gold: -1, hunted: { cold_iron: 1 }, flags: [cold_iron_asked_about_you, washerwoman_saw_the_tongs] }
    - id: warn_the_alley
      label: เดินไปบอกคนในตรอกที่ทำงานเถื่อนเหมือนกันให้รู้ตัว
      requires: { flag: unregistered_mage }
      text: |
        คืนนั้น{name}เดินไปห้าที่ ช่างซ่อมโคมหลังร้านขายปลา หญิงที่ต่อกระดูกในห้องใต้บันได เด็กหนุ่มที่ออกจากสถาบันหลัง{name}สองปีแล้วมาเปิดโต๊ะซ่อมกาต้มน้ำ อีกสองคน{name}ไม่รู้ชื่อ รู้แค่ว่าแสงลอดออกมาจากหน้าต่างบ้านไหน ทุกคนฟังจนจบ ไม่มีใครถามว่าเหล็กสีดำแบบไหน

        เช้ามา โต๊ะซ่อมกาต้มน้ำของเด็กหนุ่มคนนั้นว่างเปล่า ประตูห้องใต้บันไดลงกลอนจากข้างใน วงกบประตูทั้งห้าบานไม่มีรอยบากสักบาน
