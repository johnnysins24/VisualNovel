# ชุด อ ชีวิตที่ถูกตาม ไฟล์ ข: ภาคีเหล็กเย็นตาม 4 เรื่อง เตาตามคนของตัวเองที่เดินออกมา 1 เรื่อง สถาบันเวทหลวงตาม 3 เรื่อง
# เหล็กเย็น: รอยบากครั้งแรก (เริ่มการตาม) → เคาะครั้งที่สอง (hunt) → เคาะครั้งที่สาม (hunt, ฉากปะทะ เกิดซ้ำ) → ทางลง
# สถาบัน: ใบงาช้างใต้ประตู (เริ่มการตาม) → เสื้อคลุมเรียบมาค้นบ้าน (hunt) → ทางลง · ทุกเรื่องของสถาบันกัน not_orgs: [reclaimers, cold_iron]
# คนในไฟล์นี้ไม่มีชื่อ: หญิงร่างเตี้ยที่นำการเคาะครั้งที่สอง คนถือค้อน ยายขายถ่าน ชายแก่ร้านคัดหนังสือที่เคยใส่เสื้อคลุมเรียบ
# เสมียนสวมถุงมือเทา = เสมียนของธนาคารเบเลค (ความลับข้อ 3 ของเหล็กเย็น ไฟล์ 88_org_cold_iron_b) ข้อความไม่บอกตรงๆ

# ---------- ภาคีเหล็กเย็น ----------
- id: adult.hunted_notch_in_the_frame
  stage: adult
  scene: home
  weight: 14
  time: dusk
  when:
    age: [20, 64]
    any_flags: [unregistered_mage, job_hedge_doctor, job_road_healer, job_artificer]
    not_orgs: [cold_iron]
    not_flags: [left_the_cold_iron]
    max_hunted: { cold_iron: 0 }
  text: |
    รอยบากอยู่บนวงกบประตูด้านนอก สูงระดับไหล่ ลึกเท่าเล็บ เนื้อไม้ในรอยยังขาวสด {name}ไม่ได้ยินเสียงสิ่วตอนกลางคืน คนบากรู้วิธีบากโดยไม่ให้ใครได้ยิน

    สามวันต่อมาหญิงบ้านติดกันที่เคยแวะมาขอให้ช่วยทุกหน้าหนาวเดินผ่านหน้าประตูโดยไม่หันมา ลูกชายนางยังวิ่งมาเล่นหน้าบ้าน นางออกมาเรียกกลับก่อนเด็กจะถึงธรณี คนส่งฟืนวางฟืนไว้ที่ปากซอย ไม่ยอมเข้ามาถึงประตู

    คนที่ทำงานแบบ{name}เคยได้ยินเรื่องนี้มาทั้งชีวิต รอยบากคือการเคาะครั้งแรกของภาคีเหล็กเย็น การเคาะครั้งที่สองไม่ใช่รอยบาก
  choices:
    - id: put_it_away
      label: เก็บงานทั้งหมดลงหีบ หยุดไว้หนึ่งฤดู
      text: |
        {name}ล้างเครื่องมือ ห่อผ้า ใส่หีบ วางหีบไว้ใต้เตียง คนที่มาเคาะประตูหลังบ้านตอนดึกได้คำตอบเดียวกันทุกคน ไปหาคนอื่น เงินที่เคยได้จากงานหายไปทั้งฤดู

        ปลายฤดู หญิงบ้านติดกันใช้ลูกชายเอาขนมมาให้หนึ่งห่อ ไม่มีคำฝาก รอยบากบนวงกบเริ่มคล้ำลงตามเนื้อไม้รอบข้าง
      effects: { gold: -2, stats: { WIS: 1 }, flags: [put_the_craft_away_a_season] }
    - id: carry_on
      label: ทำงานต่อเหมือนเดิม คนที่ต้องการยังต้องการ
      text: |
        คนที่ต้องการยังมา มาช้ากว่าเดิม มาทางประตูหลัง เดินชิดรั้ว หญิงคนหนึ่งพาลูกที่ไข้ไม่ลดมาตอนตีสาม นางรออยู่ข้างนอกจนซอยมืดสนิท ไม่ยอมผ่านประตูหน้าที่มีรอย

        เช้าวันหนึ่งข้างรอยบากเดิมมีขีดสั้นๆ เพิ่มอีกขีด บางเท่าเส้นผม เหมือนคนจดไว้ว่าแวะมาดูแล้ว
      effects: { hunted: { cold_iron: 1 }, flags: [carried_on_under_the_notch] }
    - id: find_the_notchers
      label: ตามหาคนบากรอยนี้ ไปดูให้เห็นหน้า
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ถามคนส่งฟืน ถามยายขายถ่านปากซอย ถามเด็กที่ตื่นเช้า ทุกคำตอบชี้ไปที่เตาเหล็กหลังโรงซ่อมล้อเกวียน ตอนพลบ{name}ยืนอยู่หลังกองล้อเก่า เห็นคนห้าหกคนนั่งล้อมเตา ช่างตีเหล็ก คนขายเชือก หญิงซักผ้า คนที่{name}เคยซื้อของด้วย เคยทักทาย คนหนึ่งเคยมาให้ช่วยเมื่อหน้าหนาวก่อน

          หญิงร่างเตี้ยที่นั่งใกล้เตาที่สุดหันมาทางกองล้อ บอกขอบคุณที่มาหาเอง คนในวงเตาจำหน้า{name}ได้ทุกคน
        effects: { stats: { WIS: 1 }, hunted: { cold_iron: 2 }, flags: [saw_the_cold_iron_circle] }
      failure:
        text: |
          {name}เดินถามจนค่ำ ไม่มีใครตอบตรงๆ ขากลับปากซอยมืด มีคนเดินชนไหล่แรงจน{name}ล้มกระแทกขอบรางน้ำ คนชนเอ่ยขอโทษ แล้วขอบคุณ แล้วเดินต่อไปโดยไม่หันกลับ

          เช้ามาวงกบประตูมีรอยบากใหม่อีกสองรอย ระดับเดียวกัน ห่างเท่ากัน
        effects: { hp: -2, hunted: { cold_iron: 2 }, flags: [went_looking_for_the_notchers] }
    - id: wax_over_the_notch
      label: อุดรอยบากด้วยขี้ผึ้งผสมผงเวท ให้วงกบเรียบเหมือนเดิม
      requires: { flag: unregistered_mage }
      text: |
        ขี้ผึ้งเข้ารอยพอดี ผงเวทจับเนื้อไม้จนเป็นสีเดียวกัน {name}เอานิ้วลูบแล้วหาขอบรอยไม่เจอ

        เช้าวันต่อมารอยบากกลับมาที่เดิม ลึกกว่าเดิมเท่าตัว ขี้ผึ้งทั้งก้อนวางอยู่บนธรณี ปั้นเป็นก้อนกลม มีรอยนิ้วโป้งกดไว้ตรงกลางหนึ่งรอย
      effects: { hunted: { cold_iron: 1 }, flags: [waxed_over_the_notch] }

- id: adult.hunted_thank_you_knock
  stage: adult
  scene: home
  weight: 15
  hunt: cold_iron
  when:
    age: [20, 64]
    not_orgs: [cold_iron]
    not_flags: [left_the_cold_iron]
  text: |
    คนสามคนมาถึงตอนสาย ใส่ผ้ากันเปื้อนหนังเหมือนเพิ่งลุกจากหน้าเตา ไม่มีใครถืออาวุธ คนนำเป็นหญิงร่างเตี้ยไหล่หนา นางขอบคุณ{name}ที่เปิดประตู แล้วเดินตรงไปห้องทำงานโดยไม่ต้องถามทาง

    ของที่{name}ใช้ทำงานออกไปกองกลางลานทีละชิ้น ของที่ไหม้ได้ไปทางกองไฟ ของที่ไหม้ไม่ได้ไปทางค้อน ทุกชิ้นที่ผ่านประตูออกไป นางบอกขอบคุณหนึ่งครั้ง ชายคนหนึ่งจุดไฟกองเล็กกลางลาน อีกคนถือค้อนด้ามสั้น หัวค้อนสีหม่นไม่สะท้อนแสงไฟ

    เพื่อนบ้านยืนเกาะรั้วอยู่สามสี่คน ไม่มีใครเข้ามา คนหนึ่งในนั้นเคยมาขอให้{name}ช่วยเมื่อหน้าหนาวก่อน
  choices:
    - id: watch_it_burn
      label: ยืนดูจนไฟมอด ไม่ขวาง
      text: |
        ไฟกองเล็กไหม้นานกว่าที่คิด ค้อนลงครั้งละหนึ่งชิ้น ไม่รีบ เสียงเหล็กเย็นกระทบของบนหินดังทึบ ไม่มีเสียงสะท้อน พอไฟมอด หญิงร่างเตี้ยกวาดเถ้าเข้ากองเอง ขอบคุณอีกครั้ง แล้วพาคนของนางออกไป

        คืนนั้นเพื่อนบ้านคนที่เคยมาขอให้ช่วยเอาหม้อข้าวมาวางไว้หน้าประตู ไม่เคาะ
      effects: { gold: -2, flags: [watched_the_second_knock] }
    - id: snatch_one_thing
      label: แย่งของชิ้นเดียวออกจากกองก่อนไฟจะถึง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ล้วงเข้ากองตอนชายถือค้อนหันไปรับชิ้นถัดไป ได้ชิ้นที่ต้องการออกมา ร้อนจนต้องโยนจากมือซ้ายไปมือขวา แล้วซุกเข้าเสื้อ หญิงร่างเตี้ยเห็น นางไม่ห้าม นางบอกขอบคุณ แล้วหันไปบอกชายถือค้อนว่าชิ้นนั้นจดไว้แล้ว

          ของชิ้นนั้นอยู่กับ{name}ต่อมา รอยไหม้ที่มุมเป็นรอยเดียวบนตัวมันที่ไม่ได้มาจากการใช้งาน
        effects: { stats: { DEX: 1 }, hunted: { cold_iron: 1 }, flags: [snatched_one_thing_from_the_fire] }
      failure:
        text: |
          มือ{name}ถึงกองไฟช้าไปครึ่งอึดใจ ของชิ้นนั้นติดไฟแล้ว ฝ่ามือพองตั้งแต่ข้อนิ้วถึงข้อมือ หญิงร่างเตี้ยดึงแขน{name}ออกจากกอง จุ่มลงถังน้ำข้างบ่อ จับไว้จนน้ำหายร้อน แล้วขอบคุณที่ไม่ดื้อต่อ

          ของชิ้นนั้นเหลือแต่มุมเดียว {name}เก็บมุมนั้นไว้ในกระเป๋าเสื้อ
        effects: { hp: -2, flags: [burned_reaching_into_the_fire] }
    - id: argue_for_the_street
      label: บอกนางว่าคนครึ่งซอยเคยมาให้{name}ช่วย คนที่เกาะรั้วอยู่ก็ด้วย
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          หญิงร่างเตี้ยหันไปทางรั้ว คนเกาะรั้วคนหนึ่งก้มหน้า อีกคนเดินกลับเข้าบ้าน นางให้ชายถือค้อนวางค้อนลง เลือกของออกจากกองหนึ่งชิ้น ชิ้นที่คนในซอยเคยได้ใช้มากที่สุด แล้วยื่นคืนให้{name}

          ที่เหลือไหม้ตามเดิม นางขอบคุณที่บอก แล้วบอกว่าเตาจะจดเรื่องนี้ไว้ด้วย
        effects: { stats: { CHA: 1 }, flags: [argued_for_the_street] }
      failure:
        text: |
          นางฟังจบแล้วบอกว่าบ้านทุกหลังที่เตาไปเคาะพูดแบบเดียวกัน และจริงแบบเดียวกัน ค้อนลงต่อ ชิ้นถัดไปที่ลงคือชิ้นที่แพงที่สุดในกอง

          ฤดูถัดมา{name}ต้องซื้อของใหม่ทั้งหมด ราคาแพงกว่าเดิม เพราะคนขายรู้ว่าทำไมต้องซื้อ
        effects: { gold: -3, flags: [argued_with_the_second_knock] }
    - id: show_them_the_cores
      label: บอกให้หยุด ถ้าทุบผิดจุด แกนในเครื่องจะแตกใส่ทั้งลาน
      requires: { flag: job_artificer }
      text: |
        ชายถือค้อนชะงัก หญิงร่างเตี้ยให้{name}ชี้ {name}ถอดฝาเครื่องทีละเครื่อง ดึงแกนออกมาวางเรียงบนหินให้ดู แกนเวทที่ถอดออกมาแล้วเป็นแค่หลอดแก้วกับขดลวด ค้อนลงครั้งเดียวต่อหลอด ไม่มีอะไรแตกใส่ใคร

        นางขอบคุณสองครั้ง ครั้งแรกเรื่องที่บอก ครั้งที่สองเรื่องที่ถอดให้ ชายถือค้อนจดวิธีถอดลงหลังมือด้วยถ่าน
      effects: { stats: { INT: 1 }, flags: [showed_the_hammer_the_cores] }

- id: adult.hunted_third_knock
  stage: adult
  weight: 15
  time: night
  once: false
  hunt: cold_iron
  when:
    age: [20, 64]
    not_orgs: [cold_iron]
    not_flags: [left_the_cold_iron]
  text: |
    การเคาะครั้งที่สามของภาคีเหล็กเย็นไม่มีเสียงเคาะ ประตูเปิดอยู่แล้วตอนที่{name}ลืมตา คนที่ยืนอยู่กลางห้องเป็นคนธรรมดา เสื้อหนังเก่า มือหยาบ ค้อนด้ามสั้นหัวสีหม่นอยู่ในมือหนึ่ง อีกมือถือโซ่ที่ปลายผูกห่วงเหล็กเย็น

    เขาบอกขอบคุณก่อนจะพูดอย่างอื่น ขอบคุณที่ไม่ร้อง แล้วบอกว่าคืนนี้เตาไม่ได้ส่งเขามาทุบของ
  encounter:
    foe: witch_hunter
    name: คนถือค้อน
    morale: 3
    beats:
      - text: เขาเหวี่ยงโซ่ต่ำกวาดพื้น ห่วงเหล็กเย็นลากผ่านแผ่นไม้ดังครืด เข้ามาใกล้เตียงทีละช่วงแขน
        moves:
          - id: tk_throw_cup
            label: คว้าถ้วยดินข้างหมอนขว้างใส่หน้าเขา
            kind: attack
            tags: [ranged, blunt]
          - id: tk_who_sent
            label: ถามว่าใครส่งชื่อ{name}ไปที่เตา
            kind: talk
            parley: true
          - id: tk_back_window
            label: ออกทางหน้าต่างหลังบ้าน
            kind: flee
      - text: เขาเข้ามาถึงระยะแขน ค้อนยกขึ้นเหนือไหล่ ตาจ้องอยู่ที่มือของ{name} ไม่ใช่ที่หน้า
        answer: quick
        moves:
          - id: tk_under_table
            label: มุดใต้โต๊ะไปอีกฝั่ง
            kind: quick
          - id: tk_chair
            label: ยกเก้าอี้ขึ้นรับค้อน
            kind: guard
          - id: tk_read_eyes
            label: อ่านจากตาเขาว่าค้อนจะลงทางไหน
            kind: read
            stat: WIS
            success: ตาของเขาไม่ขยับตามค้อน ตาอยู่ที่ข้อมือขวาของ{name}ตลอด
          - id: tk_front_door
            label: พุ่งออกทางประตูหน้า
            kind: flee
      - text: เขาถอยครึ่งก้าว เปลี่ยนมือถือโซ่ หายใจแรงทางจมูก หน้ายังนิ่งเหมือนตอนเข้ามา
        moves:
          - id: tk_pot
            label: ขว้างหม้อดินบนเตาใส่ข้อมือเขาจากอีกฟากห้อง
            kind: attack
            tags: [ranged]
          - id: tk_swear_here
            label: สาบานต่อหน้าเขาตรงนี้ว่าจะเลิก
            kind: talk
            parley: true
            success: เขาลดค้อนลงครึ่งทาง เอียงหูข้างหนึ่งเข้ามาฟัง
          - id: tk_grab_hammer
            label: พุ่งเข้าแย่งค้อน
            kind: attack
            tags: [blunt]
          - id: tk_roof
            label: ปีนขึ้นหลังคาทางช่องเก็บของ
            kind: flee
    win:
      text: |
        คนถือค้อนนั่งพิงขาโต๊ะ มือกุมข้อมือข้างที่โดนหม้อ โซ่กองอยู่ข้างเท้า หน้ายังนิ่ง เขาลุกขึ้นช้าๆ ม้วนโซ่เข้ามือ ขอบคุณที่ไม่ตามมาซ้ำ แล้วเดินออกทางประตูที่เขาเข้ามา

        {name}นั่งหันหน้าเข้าประตูจนฟ้าสาง เศษหม้อดินบนพื้นมีรอยห่วงเหล็กเย็นลากผ่านเป็นเส้นขาว
      effects: { flags: [drove_off_the_hammer] }
    lose:
      text: |
        {name}ล้มหงาย โซ่พันข้อมือทั้งสองข้างไว้กับขาโต๊ะ เขาวางแท่งเหล็กเย็นทาบลงบนหลังมือทีละข้าง ผิวตรงนั้นซีดขาว ชาขึ้นไปถึงศอก แล้วเขาก็ไม่ได้ยกค้อน เขาบอกว่าคืนนี้แค่นี้ ขอบคุณ

        มือทั้งสองข้างของ{name}ชาอยู่สามวัน วันที่สี่ปลายนิ้วเริ่มเหน็บ แล้วมือก็กลับมาเป็นของ{name}อีกครั้ง ของทุกชิ้นที่ใช้ทำงานหายไปจากห้องตั้งแต่คืนนั้น
      effects: { gold: -3, flags: [hands_chilled_by_the_hammer] }
    stalemate:
      text: |
        ทั้งสองยืนหอบอยู่คนละฟากโต๊ะจนไก่ขัน บ้านข้างๆ เริ่มเปิดหน้าต่าง คนถือค้อนม้วนโซ่เก็บ บอกว่าเตาจะส่งเขามาอีก แล้วขอบคุณสำหรับคืนนี้

        ประตูปิดตามหลังเขาเบาๆ กลอนไม่ได้ลง ไม่เคยลงมาตั้งแต่ต้น
      effects: { flags: [stood_off_the_hammer] }
    flee:
      text: |
        {name}วิ่งไม่หยุดจนพ้นสามซอย ซุกตัวนอนในโรงเก็บฟืนของคนแปลกหน้าจนสาง เช้ามากลับบ้าน ประตูปิดเรียบร้อย ของในห้องอยู่ครบ

        บนโต๊ะมีห่วงเหล็กเย็นวางไว้หนึ่งห่วง เย็นจนน้ำค้างเกาะ {name}ใช้คีมคีบไปทิ้งบ่อ
      effects: { flags: [ran_from_the_hammer] }
    parley:
      text: |
        {name}สาบานด้วยคำของตัวเอง ไม่ได้ใช้คำที่ใครสอน คนถือค้อนฟังจนจบ ม้วนโซ่เก็บ บอกว่าเตาจะฟังจากเพื่อนบ้านอีกหนึ่งฤดู ถ้าเพื่อนบ้านไม่มีอะไรต้องเล่า เขาจะไม่ต้องมาอีก

        เขาขอบคุณ แล้วก่อนออกไปเขาลงกลอนประตูให้จากข้างใน ปีนออกทางหน้าต่าง
      effects: { hunted: { cold_iron: -1 }, flags: [swore_to_the_hammer] }
    death:
      text: |
        ค้อนลงที่มือตามที่เขาบอกไว้ แต่โซ่เกี่ยวข้อเท้าในจังหวะเดียวกัน {name}ล้มหงาย ท้ายทอยกระแทกขอบเตาไฟ เสียงทึบกว่าเสียงค้อน

        คนถือค้อนคุกเข่าลงข้างตัว{name}อยู่ครู่หนึ่ง เอามือแตะใต้จมูก แล้วลุกขึ้น ขอบคุณกับห้องที่ไม่มีใครตอบ เขาปิดประตูตามที่มันเคยปิด

- id: adult.hunted_cold_iron_way_down
  stage: adult
  scene: market
  weight: 20
  time: dusk
  when:
    age: [20, 64]
    min_hunted: { cold_iron: 1 }
    not_orgs: [cold_iron]
    not_flags: [left_the_cold_iron]
  text: |
    ยายขายถ่านปากซอยเคยมีรอยบากที่วงกบประตูเหมือนกัน ตอนนี้วงกบบ้านนางมีไม้อุดสีอ่อนกว่าเนื้อไม้รอบข้าง นางนั่งบนกระสอบถ่าน ชี้ไม้อุดนั้นให้{name}ดู แล้วเล่าโดยไม่ต้องรอให้ถาม

    ทางลงจากรายชื่อของเตามีสามทาง ทางแรกคือสาบานเลิกต่อหน้าคนทั้งซอย ให้คนของเตาได้ยินจากปากเพื่อนบ้าน ทางที่สองคือเงิน มีเสมียนสวมถุงมือเทาคนหนึ่งรับจ้างทำให้บรรทัดหนึ่งหายไปจากกระดาษบางแผ่น ทางที่สามคืออยู่นิ่งๆ ไม่ทำอะไรให้เตาได้ยินจนเตาลืม

    นางว่าทางที่สามช้าที่สุด นางไม่รู้จักใครที่รอจนจบ
  choices:
    - id: swear_in_the_street
      label: ยืนกลางซอยตอนเช้า สาบานต่อหน้าทุกคนว่าจะเลิกงานนี้
      text: |
        คนมายืนดูมากกว่าที่คิด คนขายผัก คนส่งฟืน หญิงบ้านติดกันกับลูกชาย ชายใส่ผ้ากันเปื้อนหนังคนหนึ่งยืนฟังอยู่ท้ายซอย ฟังจนจบแล้วเดินกลับไปทางเดิม {name}พูดจบแล้วมือยังสั่นอยู่พักหนึ่ง

        สัปดาห์ต่อมาวงกบประตูบ้าน{name}มีไม้อุดชิ้นเล็กอัดอยู่ในรอยบาก ตัดพอดีรอย ไม่มีใครบอกว่าใครเป็นคนอุด
      effects: { hunted: { cold_iron: -2 }, alignment: { law: 1 }, flags: [swore_off_the_craft_in_the_street] }
    - id: pay_the_grey_gloves
      label: ไปหาเสมียนสวมถุงมือเทา จ่ายให้บรรทัดของ{name}หายไป
      requires: { min_gold: 4 }
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เสมียนนั่งอยู่หลังโต๊ะเล็กในห้องที่ไม่มีป้าย ถุงมือเทาไม่ถอดตลอดเวลาที่นับเหรียญ เขาไม่ถามว่าทำไม ถามแค่ว่าชื่อสะกดอย่างไร แล้วจดลงสมุดของตัวเองหนึ่งบรรทัด

          ฤดูนั้นไม่มีรอยใหม่บนวงกบ ฤดูต่อมาก็ไม่มี เงินสี่เหรียญซื้อบรรทัดที่หายไปหนึ่งบรรทัด กับบรรทัดใหม่อีกบรรทัดในสมุดของคนอื่น
        effects: { gold: -4, hunted: { cold_iron: -2 }, alignment: { law: -1 }, flags: [paid_the_grey_gloves] }
      failure:
        text: |
          เสมียนนับเหรียญครบ แล้วบอกว่าบรรทัดของ{name}อยู่บนกระดาษสองแผ่น เขาทำให้หายได้แผ่นเดียว อีกแผ่นอยู่ที่เตาแล้ว เหรียญไม่คืน

          {name}เดินออกมาจากห้องที่ไม่มีป้าย ถุงเงินเบาลง รอยบากบนวงกบยังขาวสดเหมือนวันแรก
        effects: { gold: -4, flags: [cheated_by_the_grey_gloves] }
    - id: outlast_them
      label: อยู่นิ่งๆ ไม่ทำอะไรให้เตาได้ยิน จนกว่าเตาจะลืม
      text: |
        ทั้งฤดู{name}ไม่รับงาน ไม่เปิดประตูหลัง ไม่ตอบคนที่มาเคาะตอนดึก เงินเก็บหมดก่อนหน้าหนาว ต้องขายของในบ้านไปสองชิ้น หญิงบ้านติดกันกลับมาทักก่อนในปลายฤดู ทักเรื่องอากาศ

        ขีดสั้นๆ ข้างรอยบากไม่เพิ่มขึ้นอีก ขีดเก่าเริ่มคล้ำจนต้องเอานิ้วลูบถึงจะรู้ว่ามี
      effects: { gold: -2, stats: { WIS: 1 }, hunted: { cold_iron: -1 }, flags: [outlasted_the_cold_iron] }

# ---------- คนของเตาที่เดินออกมาทั้งที่ยังติดค้างเตา ----------
# เรื่องตามของภาคีสามเรื่องข้างบนเล่าถึงงานช่างกับงานรักษา จึงไม่ออกกับคนที่เคยสาบาน คนพวกนั้นได้เรื่องนี้แทน
# คนที่โดนตาม: เก็บแท่งเหล็กเย็นไว้ (kept_a_cold_iron_bar) กับขายห่วงแผ่นเหล็กให้สถาบัน (sold_the_name_ring) คนที่วางของครบเตาไม่ตาม
# ทางลด: คืนแท่งเหล็ก −2 · ท่องชื่อให้เตาตีแผ่นใหม่ −1 (ทอย) · ยื่นมือรับเหล็กเย็น −1 (ทุกคน ทุกครั้ง)
- id: adult.hunted_lodge_comes_for_its_own
  stage: adult
  scene: home
  weight: 15
  time: dusk
  once: false
  hunt: cold_iron
  when:
    age: [25, 75]
    flags: [left_the_cold_iron]
    not_orgs: [cold_iron]
  text: |
    โดเรคนั่งอยู่บนขั้นบันไดหน้าที่พักตอน{name}กลับถึง ถังน้ำใบหนึ่งวางข้างเท้า ในถังมีสิ่วเล่มเล็กกับแท่งเหล็กสีเทาด้านหนึ่งแท่ง เขาไม่ลุก บอกขอบคุณที่{name}ยังเดินกลับบ้านทางเดิม เขาจะได้ไม่ต้องเดินหา

    วงกบข้างหลังเขามีรอยบากใหม่เพิ่มอีกรอย เนื้อไม้ยังขาว รอยนี้เขาบากเอง เตาไม่ส่งคนอื่นมาบากบ้านของคนที่เคยนั่งลังเดียวกัน

    เขาทวนธรรมเนียมด้วยน้ำเสียงเดียวกับตอนบอกราคาเกือกม้า คนที่วางของลงบนทั่งครบแล้วเดินออกไป เตาไม่ตาม คนที่เดินออกไปทั้งที่ยังติดค้างเตา เตามาหาทุกฤดู จนกว่าจะไม่มีอะไรค้างกัน
  choices:
    - id: give_back_the_bar
      label: ล้วงแท่งเหล็กเย็นจากก้นย่าม วางคืนลงในถังของเขา
      requires: { flag: kept_a_cold_iron_bar, not_flags: [gave_the_bar_back_to_dorek] }
      text: |
        แท่งเหล็กเย็นจนติดนิ้ว {name}ต้องสะบัดมือสองทีกว่าจะหลุดลงถัง เสียงกระทบก้นถังทื่อ ไม่มีกังวาน โดเรคก้มดูครู่เดียว ไม่หยิบขึ้นมาตรวจ เขาบอกว่าแท่งนี้เงาขึ้นกว่าตอนอยู่ข้างทั่ง คนถือคงกำบ่อย

        เขาเอาสิ่วไสรอยบากรอยใหม่ออกจนเหลือแต่เนื้อไม้เรียบ ขอบคุณ แล้วเอาขอเหล็กเกี่ยวหูถังเดินกลับไปทางทางหลวง รอยเก่าเขาไม่แตะ บอกว่ารอยนั้นปล่อยให้ไม้คล้ำไปเอง
      effects: { hunted: { cold_iron: -2 }, flags: [gave_the_bar_back_to_dorek] }
    - id: recite_the_names
      label: ท่องชื่อบนห่วงแผ่นเหล็กให้เขาฟังเท่าที่จำได้ ให้เตาตีแผ่นใหม่
      requires: { flag: sold_the_name_ring, not_flags: [recited_the_names_to_dorek] }
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ท่องได้สิบเก้าชื่อ บอกด้วยว่าชื่อไหนมีรอยค้อนทับแล้ว โดเรคไม่จด เขาขยับปลายขอเหล็กทีละชื่อเหมือนดีดลูกคิด พอจบเขาบอกว่าห่วงมียี่สิบสามแผ่น อีกสี่ชื่อเขาจำได้เอง

          เขาบอกว่าแผ่นเหล็กตีใหม่ได้ ที่ตีใหม่ไม่ได้คือสถาบันอ่านชื่อพวกนั้นไปแล้ว เรื่องนั้น{name}เอาคืนมาให้เตาไม่ได้ เขาขอบคุณสำหรับสิบเก้าชื่อ แล้วกลับไปโดยไม่บากรอยเพิ่ม
        effects: { stats: { INT: 1 }, hunted: { cold_iron: -1 }, flags: [recited_the_names_to_dorek] }
      failure:
        text: |
          ชื่อที่หกกับชื่อที่เจ็ดสลับกัน ชื่อที่สิบ{name}ใส่รอยค้อนให้คนที่ยังไม่จบ โดเรคยกขอเหล็กขึ้นให้หยุด เขาบอกว่าชื่อผิดหนึ่งชื่อคือประตูผิดหนึ่งบาน เตาไม่เคาะประตูจากชื่อที่ท่องผิด

          เขาขอบคุณที่พยายาม แล้วลุกไปบากรอยเพิ่มบนวงกบอีกรอย ช้า ให้{name}เห็นสิ่วทุกจังหวะ
        effects: { flags: [misremembered_the_names_for_dorek] }
    - id: give_both_hands
      label: ยื่นมือทั้งสองข้างให้เขา รับเหล็กเย็นของฤดูนี้
      text: |
        โดเรคหยิบแท่งเหล็กสีเทาด้านจากก้นถัง ทาบลงบนหลังมือ{name}ทีละข้าง เขานับในใจ ริมฝีปากขยับ ผิวใต้เหล็กซีดขาว ชาไล่ขึ้นไปถึงศอก เขายกแท่งออกตอน{name}เริ่มไม่รู้ว่านิ้วตัวเองงออยู่หรือเหยียดอยู่

        เขาบอกว่าเตาจะจดว่าฤดูนี้มาแล้ว ได้แล้ว แล้วขอบคุณ มือทั้งสองข้างกลับมาเป็นของ{name}ในวันที่สี่ ก่อนหน้านั้นช้อนหล่นจากมือไปหลายมื้อ
      effects: { hp: -1, hunted: { cold_iron: -1 }, flags: [gave_dorek_both_hands] }
    - id: shut_the_door
      label: ก้าวข้ามถังของเขา เข้าบ้าน ลงกลอน
      text: |
        โดเรคไม่ลุกตาม เสียงสิ่วดังขึ้นที่วงกบอีกฟากของประตู ช้า เท่ากันทุกจังหวะ แล้วเงียบ {name}นั่งหันหน้าเข้าประตูจนตะเกียงหมดน้ำมัน

        เช้ามาบนขั้นบันไดมีสาลี่ผ่าซีกวางอยู่ซีกหนึ่ง มดขึ้นแล้ว คนส่งฟืนวางฟืนไว้ที่ปากซอยตั้งแต่วันนั้น ไม่เข้ามาถึงประตู
      effects: { flags: [shut_the_door_on_dorek] }

# ---------- สถาบันเวทหลวง ----------
- id: adult.hunted_ivory_slip
  stage: adult
  scene: home
  weight: 12
  when:
    age: [20, 64]
    any_flags: [institute_left, institute_graduate, kept_dorgas_rubbing, unregistered_mage]
    not_orgs: [reclaimers, cold_iron]
    not_flags: [gave_up_dorgas_rubbing, left_the_reclaimers, signed_own_line_lost]
    max_hunted: { royal_institute: 0 }
  text: |
    กระดาษสีงาช้างแผ่นเล็กสอดเข้ามาใต้ประตูตอนไหนไม่มีใครเห็น ขนาดเท่าฝ่ามือ ขอบบนฉีกจากเล่ม มีเลขทะเบียนหนึ่งเลข วันที่ และประโยคเดียวเขียนด้วยลายมือเรียบ ห้องบัญชีหายขอรับของชิ้นนี้คืน ข้างล่างเว้นช่องไว้ให้ลงชื่อ

    {name}ไม่ต้องอ่านเลขให้จบก็รู้ว่าเป็นของชิ้นไหน ของที่มาถึงมือ{name}ทางใดทางหนึ่งแล้วไม่เคยกลับไป ของที่เก็บไว้ก้นหีบมาหลายฤดู หยิบออกมาดูบ้างเวลานอนไม่หลับ

    ด้านหลังกระดาษเขียนวันอีกวันหนึ่ง อีกสามวัน
  choices:
    - id: wrap_it_for_them
      label: ห่อของชิ้นนั้นด้วยผ้าสะอาด รอให้เขามารับ
      text: |
        วันที่สามหญิงในเสื้อคลุมเรียบไม่มีขอบสีมาถึงตอนสาย ไม่เข้าบ้าน ยืนรับห่อผ้าที่ธรณี แกะดูแค่มุมเดียว พูดเลขทะเบียนออกมาตรงกับในกระดาษ แล้วฉีกใบรับสีงาช้างจากเล่มให้หนึ่งใบ

        ใบรับนั้น{name}เก็บไว้ในหีบใบเดิม ตรงที่ของเคยอยู่
      effects: { reputation: { royal_institute: 1 }, alignment: { law: 1 }, flags: [returned_the_numbered_thing] }
    - id: hide_it_and_burn_the_slip
      label: ย้ายของไปซ่อนที่อื่น แล้วเผากระดาษแผ่นนั้นในเตา
      text: |
        กระดาษงาช้างไหม้ช้ากว่ากระดาษทั่วไป ขอบม้วนเข้าหากันก่อนจะดำ {name}ซุกของไว้ใต้กระดานพื้นตรงที่เหยียบแล้วมีเสียง

        วันที่สามไม่มีใครมาเคาะ วันที่สี่มีกระดาษสีงาช้างอีกแผ่นสอดเข้ามาใต้ประตู เลขทะเบียนเดิม ด้านหลังเว้นว่าง ไม่มีวันนัด
      effects: { hunted: { royal_institute: 1 }, flags: [hid_the_numbered_thing] }
    - id: sell_it_on
      label: เอาไปขายให้พ่อค้าของหลุดก่อนวันที่สาม
      text: |
        พ่อค้าของหลุดพลิกของในมือสองรอบ ส่องหาตราที่ก้น แล้วจ่ายห้าเหรียญโดยไม่ต่อ เร็วจน{name}รู้ว่าขายถูกไป เขาบอกว่าห้องบัญชีหายจะมาซื้อจากเขาอีกที ในราคาที่ดีกว่านี้

        วันที่สามหญิงในเสื้อคลุมเรียบมาถึงหน้าประตู{name} นางไม่ขอของ นางขอชื่อพ่อค้า แล้วเขียนชื่อ{name}ลงสมุดอีกเล่มหนึ่ง
      effects: { gold: 5, hunted: { royal_institute: 2 }, flags: [sold_the_numbered_thing] }
    - id: ask_to_renew
      label: เขียนคำขอยืมต่อตามระเบียบหอสมุด แนบไปกับของ
      requires: { flag: institute_graduate }
      text: |
        {name}เขียนตามแบบฟอร์มที่จำได้ตั้งแต่สมัยใส่เสื้อคลุมขอบเทา ชื่อ เลขทะเบียน เหตุผล ขอยืมต่อหนึ่งรอบ หญิงในเสื้อคลุมเรียบอ่านคำขอที่ธรณีประตู หัวเราะเป็นเสียงสั้นๆ ครั้งเดียว แล้วรับของไป

        ใบรับที่นางให้มีหมายเหตุเขียนด้านหลัง เลขชั้นในหอสมุดที่ของชิ้นนี้จะขึ้นไปอยู่ ยืมได้ทุกวันที่สามของสัปดาห์ ห้ามยืมออก
      effects: { stats: { INT: 1 }, flags: [asked_to_renew_the_numbered_thing] }

- id: adult.hunted_plain_cloaks
  stage: adult
  scene: home
  weight: 15
  hunt: royal_institute
  when:
    age: [20, 64]
    not_orgs: [reclaimers, cold_iron]
  text: |
    เสื้อคลุมเรียบไม่มีขอบสีสองตัวมาถึงหน้าประตูก่อนเที่ยง คนหนึ่งถือสมุดบัญชีเล่มหนาเปิดค้างไว้ อีกคนถือตราทองเหลืองไว้ในฝ่ามือ คนของนายอำเภอที่ตามมาด้วยยืนห่างออกไปสามก้าว ดูตรานั้นแล้วถอยไปอีกก้าว ตรานี้เปิดประตูได้โดยไม่ต้องรอนายอำเภอ

    คนถือสมุดอ่านบรรทัดที่มีชื่อ{name}ให้ฟัง เลขทะเบียน ที่ที่เห็นของครั้งสุดท้าย และคำว่ามีผู้แจ้งว่าของอยู่ในบ้านหลังนี้ เขาบอกว่าห้องไม่ได้มาจับใคร ห้องมาเขียนใบรับ
  choices:
    - id: let_them_search
      label: เปิดประตูให้ค้น
      text: |
        สองคนค้นทุกห้องอย่างคนที่ทำมาหลายร้อยบ้าน เปิดหีบ เปิดตู้ ยกกระดานพื้นแผ่นที่มีเสียง ของทุกชิ้นที่หยิบขึ้นมาวางกลับลงที่เดิม เรียบร้อยกว่าก่อนหยิบ คนถือตราอ่านก้นโหล อ่านขอบกระดาษ อ่านหมุดของทุกอย่างที่เป็นทองเหลือง

        ก่อนกลับคนถือสมุดฉีกใบรับให้หนึ่งใบ ช่องของเขียนว่าค้นแล้ว ช่องสภาพเขียนตามที่เจอ เขาบอกว่าบรรทัดนี้จะเปิดค้างไว้อีกพักหนึ่ง
      effects: { flags: [let_the_plain_cloaks_search] }
    - id: stand_in_the_door
      label: ยืนขวางประตู บอกว่าบ้านนี้จะเปิดให้นายอำเภอคนเดียว
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          คนถือตรามองหน้า{name} มองคนของนายอำเภอที่ยืนห่างออกไป แล้วมองเพื่อนบ้านที่เริ่มออกมายืนหน้าบ้าน เขาเก็บตราลงกระเป๋า คนถือสมุดเขียนบรรทัดสั้นๆ ไม่ได้เข้า

          สองคนเดินจากไปโดยไม่รีบ คนของนายอำเภอเดินตามไปอีกทาง เพื่อนบ้านคนหนึ่งยกมือให้{name}จากรั้ว
        effects: { stats: { CHA: 1 }, flags: [held_the_door_against_the_cloaks] }
      failure:
        text: |
          คนถือตรายกตราขึ้นให้ดูอีกครั้ง ใกล้กว่าเดิม แล้วเดินผ่านแขนของ{name}เข้าไปเหมือนแขนนั้นเป็นม่าน กลอนประตูหลุดตามมาด้วยเพราะ{name}จับขอบประตูแน่นเกินไป

          ใบรับที่เขาทิ้งไว้มีสองบรรทัด บรรทัดแรกเรื่องที่ค้น บรรทัดที่สองเรื่องกลอนประตู ห้องไม่จ่ายค่าซ่อม ช่างซ่อมกลอนคิดสองเหรียญ
        effects: { gold: -2, flags: [pushed_past_by_the_cloaks] }
    - id: read_the_informer
      label: เหลือบอ่านชื่อผู้แจ้งในสมุดของเขาให้ทันก่อนเขาปิด
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ตัวหนังสือกลับหัว ลายมือเล็ก {name}อ่านได้ทันก่อนสมุดจะปิด ชื่อของคนที่ยืมบันไดไปเมื่อต้นหน้าแล้งแล้วยังไม่เอามาคืน

          บันไดยังพิงอยู่ที่ผนังบ้านเขา {name}เห็นทุกเช้าตอนเปิดหน้าต่าง
        effects: { stats: { INT: 1 }, flags: [read_the_informers_name] }
      failure:
        text: |
          คนถือสมุดเห็นสายตา{name}ก่อน เขาไม่ปิดสมุด เขาหันหน้ากระดาษให้ดูตรงๆ ช่องผู้แจ้งเขียนว่าไม่ประสงค์ออกนาม แล้วบอกว่าถ้าอยากได้สำเนาบรรทัดนี้ ห้องคิดค่าคัดสองเหรียญ

          {name}จ่าย สำเนาที่ได้มาลายมือสวยกว่าต้นฉบับ ช่องผู้แจ้งเขียนเหมือนเดิมทุกคำ
        effects: { gold: -2, flags: [paid_for_the_informer_line] }
    - id: hide_it_with_a_spell
      label: ร่ายเวทซ่อนของไว้ก่อนเขาก้าวเข้าบ้าน
      requires: { flag: unregistered_mage, any_flags: [hid_the_numbered_thing, kept_one_numbered_book] }
      text: |
        เวทจับของได้ทันก่อนเสียงฝีเท้าถึงธรณี คนถือตราเดินผ่านมุมนั้นสองรอบ รอบที่สามเขาหยุด ยกนิ้วแตะอากาศตรงนั้นเหมือนแตะผิวน้ำ แล้วหันมาบอกว่าเวทนี้ไม่มีเลขทะเบียน แต่ทำแบบที่ปีสามสอน

        เขาไม่เอาของไป เขาเขียนบรรทัดใหม่ใต้บรรทัดเดิม ในบ้านหลังนี้มีคนร่ายเวทแบบสถาบันโดยไม่มีชื่อในทะเบียน
      effects: { hunted: { royal_institute: 1 }, flags: [hid_it_from_the_cloaks_with_a_spell] }

- id: adult.hunted_institute_way_down
  stage: adult
  weight: 20
  time: dusk
  when:
    age: [20, 64]
    min_hunted: { royal_institute: 1 }
    not_orgs: [reclaimers, cold_iron]
  text: |
    ชายแก่ร้านคัดหนังสือหัวถนนบอกว่าเห็นเสื้อคลุมเรียบไม่มีขอบสีมายืนฝั่งตรงข้ามบ้าน{name}สามครั้งแล้ว เขารู้จักเสื้อแบบนั้น เขาเคยใส่ เลิกใส่ตอนนิ้วสั่นจนเขียนใบรับไม่ตรง

    เขาบอกว่าห้องบัญชีหายไม่เคยเลิกตาม แต่ห้องปิดบรรทัดได้ ห้องต้องการแค่บรรทัดที่ปิดได้ ได้ของคืนแล้วเขียนใบรับ หรือได้หลักฐานว่าของไม่มีอยู่ในโลกแล้ว ไฟเป็นหลักฐานที่ห้องเชื่อง่ายที่สุด เพราะห้องเองก็ใช้ไฟ
  choices:
    - id: hand_it_over_late
      label: ข้ามถนนไปยื่นของให้คนในเสื้อคลุมเรียบ แล้วขอใบรับ
      requires: { any_flags: [hid_the_numbered_thing, kept_one_numbered_book] }
      text: |
        หญิงในเสื้อคลุมเรียบรับของไปโดยไม่ถามว่าทำไมช้า นางเขียนใบรับบนเข่า ลงวันที่วันนี้ ไม่ใช่วันที่ควรคืน ช่องหมายเหตุนางเขียนสองคำ คืนเอง

        คืนนั้นฝั่งตรงข้ามบ้านไม่มีใครยืน คืนต่อมาก็ไม่มี ชายแก่ร้านคัดหนังสือขอดูใบรับ แล้วบอกว่าลายมือคนเขียนดีขึ้นกว่าสมัยเขามาก
      effects: { hunted: { royal_institute: -2 }, alignment: { law: 1 }, flags: [handed_it_over_late] }
    - id: lost_in_a_fire
      label: จุดไฟเผาเพิงหลังบ้าน ให้ของหายไปกับเพิง
      requires: { any_flags: [hid_the_numbered_thing, kept_one_numbered_book] }
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}เผาเพิงตอนลมนิ่ง ใส่ของที่ไหม้แล้วทิ้งรอยลงไปให้ครบ ลวดทองเหลือง เศษแก้ว ตะปูหัวกลม คนของนายอำเภอมาดูกองเถ้าตอนสาย เขียนรายงานไฟไหม้หนึ่งแผ่น หญิงในเสื้อคลุมเรียบมาอ่านรายงานนั้นที่โต๊ะนายอำเภอ แล้วเขียนลงสมุดว่าหายในไฟ มีพยาน

          ของจริงอยู่ใต้กระดานพื้นในบ้าน {name}ไม่เปิดดูอีกเลยทั้งฤดู ค่าไม้สร้างเพิงใหม่แพงกว่าที่คิด
        effects: { gold: -2, hunted: { royal_institute: -1 }, alignment: { law: -1 }, flags: [lost_it_in_a_fire] }
      failure:
        text: |
          หญิงในเสื้อคลุมเรียบเขี่ยกองเถ้าด้วยปลายไม้อยู่ครู่เดียว ไม่เจอบัดกรีที่ละลาย ไม่เจอลวดที่ควรเหลือ ของของสถาบันไหม้แล้วทิ้งรอย กองนี้ไม่มีรอยของสถาบันสักชิ้น

          นางเขียนลงสมุดว่าเพิงไหม้ ของไม่ได้ไหม้ {name}เหลือแต่รอยพองที่หลังมือจากตอนจุดไฟ กับเพิงที่ต้องสร้างใหม่
        effects: { hp: -1, gold: -2, flags: [faked_a_fire_badly] }
    - id: sign_the_empty_line
      label: ข้ามถนนไปบอกว่าของไม่ได้อยู่กับ{name}แล้ว ให้ค้นต่อหน้าพยาน
      requires: { not_flags: [hid_the_numbered_thing, kept_one_numbered_book] }
      text: |
        หญิงในเสื้อคลุมเรียบไม่แปลกใจที่{name}เดินมาหาเอง นางให้ตามคนของนายอำเภอมายืนเป็นพยาน แล้วค้นทุกห้อง เปิดแม้แต่โถเกลือ ชายแก่ร้านคัดหนังสือยืนดูจากหัวถนน พยักหน้าทุกครั้งที่นางวางของคืนที่เดิม

        ไม่มีอะไรให้เจอ นางเขียนลงสมุดว่าค้นแล้ว ไม่พบ ให้{name}ลงชื่อใต้บรรทัดนั้น ให้คนของนายอำเภอลงชื่อต่อท้าย นางบอกว่าบรรทัดยังปิดไม่ได้จนกว่าของจะโผล่ที่ไหนสักแห่ง แต่ห้องจะเลิกส่งคนมายืนฝั่งตรงข้ามบ้านหลังนี้
      effects: { hunted: { royal_institute: -1 }, flags: [signed_the_empty_line] }
    - id: thank_him_and_wait
      label: ขอบคุณเขา แล้วยังไม่ทำอะไร
      text: |
        ชายแก่ไม่เถียง เขาฉีกกระดาษเปล่าแผ่นหนึ่งจากสมุดของร้าน เขียนอะไรบางอย่างแล้วพับให้ บอกว่าเก็บไว้ วันไหนเปลี่ยนใจให้ยื่นแผ่นนี้คู่กับของ

        ในกระดาษเป็นแบบใบรับที่เขาเขียนจากความจำ ทุกช่องครบ ช่องลายมือชื่อเว้นว่าง ลายมือสั่นแต่ตรงทุกเส้น
      effects: { flags: [kept_the_old_clerks_blank_receipt] }
