# วัยเด็ก เรื่องที่หลายชาติกำเนิดเจอได้ อายุ 3 ถึง 11
# เรื่องที่พูดถึงพ่อแม่ต้องกันเด็กวิหาร (origin_marked_foundling)
# สงครามถ่าน ปี 296 ถึง 301: เกณฑ์ทหารตั้ง father_away แล้วจบด้วยพ่อกลับมา (father_iron_arm) หรือพ่อไม่กลับ (father_lost)

# ---------- สงครามถ่าน ----------
- id: childhood.war_conscription
  stage: childhood
  weight: 14
  when:
    age: [3, 11]
    year: [296, 300]
    not_flags: [origin_dwarf_clan, origin_elf_bough, origin_ashland, origin_marked_foundling, origin_marked_hidden]
  text: |
    ประกาศเกณฑ์ทหารมาถึงพร้อมทหารม้าสองนายกับเสมียนหนึ่งคน เสมียนยืนอ่านเสียงดังฟังชัด ราชอาณาจักรอาร์เวลทำศึกกับสภาตระกูลคนแคระ ผู้ชายอายุสิบแปดถึงสี่สิบห้าต้องไปรายงานตัวภายในเจ็ดวัน

    ในเมืองเรียกศึกนี้ว่าสงครามถ่าน เพราะสองฝ่ายแย่งกันแค่เหมืองถ่านมารในแดนเถ้า คนส่วนใหญ่ที่ต้องไปไม่เคยจับถ่านมารสักก้อน

    {father}อยู่ในเกณฑ์

    คืนก่อนไป เขานั่งลับมีดพกอยู่หน้าบ้านจนดึก ทางการจะแจกอาวุธให้ที่ค่าย มีดเล่มนั้นไม่ได้ใช้ในสงคราม
  choices:
    - id: give_token
      label: เอาของที่รักที่สุดให้พ่อพกไปด้วย
      text: |
        {name}เอาก้อนหินกลมที่เก็บได้จากริมน้ำมาให้ ก้อนที่ขัดกับเสื้อจนมันวาวมาทั้งปี {father}รับไปพลิกดู แล้วใส่กระเป๋าเสื้อ ตบเบาๆ สองที

        "เดี๋ยวพ่อเอามาคืน" เขาว่า

        เช้าวันต่อมา{name}ยืนดูพ่อเดินตามหลังทหารม้าไปจนลับหัวโค้ง เขาไม่หันกลับมา แต่มือขวาวางอยู่บนกระเป๋าเสื้อตลอดทาง
      effects: { stats: { CHA: 1 }, flags: [father_at_war, father_away, gave_father_token] }
    - id: cling
      label: กอดขาพ่อไว้ไม่ยอมปล่อยตอนเขาออกเดิน
      text: |
        {name}กอดขาพ่อไว้ทั้งสองแขน {father}ย่อตัวลงให้ลูกย้ายมากอดคอแทน แล้วลุกขึ้นยืน ลูกยังห้อยต่องแต่งอยู่ที่คอ ทหารม้าที่ยืนรออยู่หันไปมองทางอื่น

        {mother}เป็นคนแกะมือลูกออกจากคอพ่อ {name}ดิ้นจนเธอเกือบล้ม ร้องจนเสียงหาย แต่{father}ก็เดินลับหัวโค้งไปอยู่ดี
      effects: { stats: { STR: 1 }, flags: [father_at_war, father_away] }
    - id: ask_why
      label: ถามว่าทำไมพ่อต้องไปรบกับคนแคระ
      text: |
        {father}วางมีดลงบนเข่า

        "เพราะเขาสั่ง" เขาว่า "แล้วถ้าพ่อไม่ไป เขาก็มาลากตัวไปอยู่ดี"

        "แล้วคนแคระทำอะไรเรา"

        {father}ไม่ตอบ เขาหยิบมีดขึ้นมาลับต่อ ลับจนใบมีดสึกเป็นร่อง
      effects: { stats: { INT: 1 }, flags: [father_at_war, father_away] }

- id: childhood.war_father_returns
  stage: childhood
  weight: 8
  when:
    age: [3, 11]
    year: [301, 311]
    flags: [father_away]
  text: |
    สงครามจบไปหลายเดือนแล้ว ทหารทยอยกลับบ้านทีละคนสองคน บางคนเดินกลับมาเอง บางคนกลับมาบนเกวียน บางคนกลับมาเป็นจดหมาย

    {father}กลับมาตอนฝนตก ยืนอยู่ที่ประตู เปียกทั้งตัว ผอมจนเสื้อหลวม แขนขวาสั้นลงถึงข้อศอก ต่อด้วยขอเหล็กกับสายหนังที่รัดขึ้นไปถึงไหล่ ปลายขอตะไบมนไว้ ไม่ให้เกี่ยวเสื้อขาด

    ราชนาวีแจกแขนให้ทหารที่เสียแขนตามยศ ยศของ{father}ได้แค่นี้

    {mother}ยืนนิ่งอยู่กลางบ้าน ผ้าที่พับค้างอยู่ในมือหล่นลงพื้น แล้วเธอก็ยกมือขึ้นปิดปาก
  choices:
    - id: run_hug
      label: วิ่งเข้าไปกอด
      text: |
        {name}วิ่งเข้าไปกอด เปียกไปด้วยกันทั้งตัว {father}กอดตอบด้วยแขนซ้าย ขอเหล็กยกค้างอยู่กลางอากาศ ไม่รู้จะวางตรงไหน แล้วค่อยๆ ลดลงมา ใช้ด้านหลังของขอแตะหลังลูก ด้านที่ไม่แหลม
      effects: { stats: { CHA: 1 }, clear_flags: [father_away], flags: [war_resolved, father_iron_arm] }
    - id: touch_arm
      label: จับขอเหล็กของพ่อ
      text: |
        ขอเหล็กเย็นกว่าที่คิด เย็นเหมือนราวสะพานตอนเช้า {father}เกี่ยวนิ้วก้อยของ{name}ไว้ในวงขอ ยกขึ้นลงเบาๆ เหมือนเล่นด้วย

        "ยังหัดอยู่" เขาว่า "เมื่อเดือนก่อนยังเกี่ยวถ้วยแตกไปสองใบ"
      effects: { stats: { WIS: 1 }, clear_flags: [father_away], flags: [war_resolved, father_iron_arm] }
    - id: hide
      label: หลบอยู่หลังแม่
      text: |
        {name}หลบอยู่หลังกระโปรงแม่ ไม่ยอมออกมา {father}ไม่เข้ามาใกล้ นั่งลงตรงธรณีประตู ถอดรองเท้าทีละข้างด้วยมือเดียว

        สามวันกว่า{name}จะยอมให้อุ้ม เขาอุ้มด้วยแขนซ้ายข้างเดียว ขอเหล็กซ่อนไว้ข้างหลังตลอด
      effects: { stats: { DEX: 1 }, clear_flags: [father_away], flags: [war_resolved, father_iron_arm] }
    - id: ask_token
      label: ถามหาก้อนหินที่ให้พ่อพกไป
      requires: { flag: gave_father_token }
      text: |
        {father}ใช้ขอเหล็กแหวกปากกระเป๋าเสื้อ แล้วล้วงด้วยมือซ้าย มือเดียวที่เหลือ ควานอยู่พักหนึ่งกว่าจะเจอ แล้วหยิบก้อนหินกลมออกมาวางในมือ{name}

        "บอกแล้วว่าจะเอามาคืน" เขาว่า ก้อนหินยังมันวาว มันกว่าวันที่ให้ไป
      effects: { stats: { CHA: 1, WIS: 1 }, clear_flags: [father_away], flags: [war_resolved, father_iron_arm] }

- id: childhood.war_father_lost
  stage: childhood
  weight: 4
  when:
    age: [3, 11]
    year: [300, 311]
    flags: [father_away]
    not_flags: [war_resolved]
  text: |
    จดหมายมาถึงก่อนหน้าหนาว ซองสีน้ำตาล ประทับตราราชนาวี {mother}ไม่ยอมให้ใครเปิด เก็บไว้ใต้หมอนสามวัน วันที่สี่ถึงเอาไปให้นักบวชอ่าน

    จดหมายเขียนว่า{father}หายไปในการรบที่เหมืองถ่านในแดนเถ้า ไม่พบศพ ไม่มีชื่อในรายชื่อเชลย ราชนาวีเสียใจด้วย แนบเงินชดเชยมาสองเหรียญเงิน

    {mother}กลับมาบ้าน วางเหรียญสองเหรียญไว้บนโต๊ะ แล้วออกไปตักน้ำเหมือนทุกวัน
  choices:
    - id: wait_road
      label: ไปนั่งรอพ่อที่หัวโค้งทุกเย็น
      text: |
        {name}ไปนั่งรอที่หัวโค้งทุกเย็น ตรงที่เห็นพ่อเดินลับไปวันนั้น ไม่มีใครห้าม

        ครบปี {mother}เดินมานั่งด้วย นั่งจนมืด แล้วจูงมือกลับบ้าน ปีต่อมา{name}ก็ยังไปนั่ง บางเย็น{mother}ก็ไปด้วย
      effects: { stats: { WIS: 1 }, clear_flags: [father_away], flags: [war_resolved, father_lost, waits_for_father] }
    - id: keep_coin
      label: เก็บเหรียญเงินไว้เหรียญหนึ่ง
      text: |
        {mother}ใช้เหรียญหนึ่งซื้อถ่านกับน้ำมันตะเกียงให้พอถึงสิ้นหนาว อีกเหรียญเธอวางไว้ในมือ{name} บอกว่าของลูก

        {name}เก็บไว้ในถุงผ้าผูกคอ ไม่เคยใช้ แม้ปีที่ข้าวไม่พอกิน
      effects: { stats: { CON: 1 }, gold: 1, clear_flags: [father_away], flags: [war_resolved, father_lost] }
    - id: help_mother
      label: ถือถังตามแม่ไปที่บ่อ
      text: |
        {name}ถือถังเล็กตามแม่ไป สองคนตักน้ำจนโอ่งเต็ม แล้วก็ยังตักต่อ ตักจนน้ำล้นโอ่งไหลนองหน้าบ้าน ไม่มีใครพูดว่าพอ

        คืนนั้น{mother}นอนกอดลูกทั้งคืน ไม่ร้องไห้ให้ได้ยินสักครั้ง
      effects: { stats: { STR: 1 }, clear_flags: [father_away], flags: [war_resolved, father_lost] }

- id: childhood.war_veteran_hook
  stage: childhood
  weight: 6
  when:
    age: [5, 11]
    year: [301, 311]
    not_flags: [origin_dwarf_clan, origin_elf_bough, origin_ashland]
  text: |
    ชายคนนั้นนั่งอยู่ตีนสะพานทุกวัน แขนซ้ายสิ้นสุดที่ข้อศอก ต่อด้วยขอเหล็กกับสายหนัง ข้างตัวมีกระป๋องเปล่า ทหารผ่านศึกสงครามถ่าน ราชนาวีแจกแขนกลให้ตามยศ คนยศต่ำได้ขอเหล็ก

    เด็กแถวนั้นเรียกเขาว่าตาขอ ปาก้อนดินใส่แล้ววิ่งหนี เขาไม่เคยหันไปมอง ไม่เคยไล่ วันไหนมีคนหยอดเหรียญ เขาพยักหน้า วันไหนไม่มี เขาก็พยักหน้า

    วันนี้เด็กสามคนเดินนำหน้า{name}ไปทางสะพาน มือกำก้อนดินไว้คนละก้อน
  choices:
    - id: join_kids
      label: กำก้อนดินตามไปด้วย
      text: |
        ก้อนดินของ{name}โดนไหล่ ดินร่วนกระจายลงบนตัก เขาปัดออกด้วยขอเหล็ก ช้าๆ แล้วยังนั่งอยู่ที่เดิม

        เด็กอีกสามคนหัวเราะชอบใจ วิ่งหนีไปจนสุดถนน {name}วิ่งตามไป แต่ไม่หัวเราะ
      effects: { stats: { STR: 1 }, alignment: { moral: -1 } }
    - id: give_food
      label: เอาขนมปังที่พกมาไปวางในกระป๋อง
      text: |
        {name}วางขนมปังลงในกระป๋อง เด็กอีกสามคนยืนมอง แล้วทิ้งก้อนดินลงข้างทาง เดินกลับไปทางอื่น

        ชายคนนั้นพยักหน้า เหมือนทุกวัน แต่คราวนี้พูดด้วย "ขอบใจ" เสียงแหบเหมือนไม่ได้พูดมานาน
      effects: { stats: { CHA: 1 }, alignment: { moral: 1 } }
    - id: ask_hook
      label: นั่งลงข้างๆ ถามว่าขอเหล็กนั่นใช้อย่างไร
      text: |
        เขาเหลือบมองเด็กสามคนที่ยืนกำก้อนดินอยู่ไกลๆ แล้วยกขอขึ้นให้ดู ปลดสายหนังให้ดูว่าผูกอย่างไร หมุนให้ดูว่าเกี่ยวอะไรได้บ้าง

        "ช่างตีเหล็กในค่ายทำให้ ตีเสร็จในครึ่งชั่วยาม" เขาว่า "แขนเงินของท่านนายพล ช่างคนแคระทำครึ่งปี ขยับนิ้วได้ทุกข้อ ได้ข่าวว่าเล่นพิณได้ด้วย"
      effects: { stats: { INT: 1 }, flags: [knows_veteran_hook, lean_warrior] }

# ---------- โลกกว้าง ----------
- id: childhood.first_airship
  stage: childhood
  weight: 8
  when:
    age: [3, 10]
    year: [289, 311]
    not_flags: [origin_refinery, origin_marked_hidden, origin_elf_bough, origin_dwarf_clan]
  text: |
    ตอนแรก{name}นึกว่าเป็นเมฆ ก้อนเมฆสีเทายาวรีที่ลอยทวนลม แล้วเสียงก็มาถึง เสียงใบพัดตีอากาศกระหึ่มจนกระดูกสั่น

    เรือเหาะลำนั้นบินต่ำกว่าที่ใครเคยเห็น ต่ำจนเห็นตัวหนังสือข้างลำ เห็นคนยืนเกาะราวดาดฟ้า เห็นควันสีสนิมพ่นออกจากท้ายเรือ ถุงลมข้างบนเรืองสีฟ้าจางๆ ทั้งที่เป็นกลางวัน

    เงาของเรือคลุมทุกอย่างไว้จนแดดหาย ไก่วิ่งหนีเข้าเล้า หมาเห่าไม่หยุด ผู้ใหญ่ทุกคนวางมือจากงาน แหงนคอมองเหมือนกันหมด

    คนบนดาดฟ้าคนหนึ่งโบกมือลงมา
  choices:
    - id: wave
      label: โบกมือตอบ
      text: |
        {name}โบกจนแขนล้า คนบนดาดฟ้าโบกตอบ แล้วโยนอะไรเล็กๆ ลงมา ของสิ่งนั้นหมุนติ้วกลางอากาศ ตกลงไปไกลหลายสิบก้าว

        {name}ค้นอยู่ครึ่งวันถึงเจอ เป็นกระดุมทองเหลือง ตรารูปเรือเหาะไขว้กับสมอ
      effects: { stats: { CHA: 1 }, flags: [airship_button] }
    - id: chase
      label: วิ่งไล่ตามเงาเรือ
      text: |
        {name}วิ่งตามเงาเรือ วิ่งจนลืมดูทาง จนเงาหลุดไปข้างหน้า ทิ้งให้ยืนหอบอยู่กลางแดด

        เรือเหาะเหลือเป็นจุดดำบนฟ้าแล้ว แต่เสียงใบพัดยังดังอยู่ในหูไปจนค่ำ
      effects: { stats: { DEX: 1 } }
    - id: hide
      label: วิ่งหลบเข้าบ้าน
      text: |
        {name}วิ่งหลบเข้าบ้าน มุดเข้าใต้โต๊ะ เสียงใบพัดดังผ่านหลังคา ถ้วยชามบนชั้นสั่นกระทบกัน

        พอเสียงจางไป ออกมาอีกที ทุกคนยังยืนแหงนคออยู่ที่เดิม ไม่มีใครสังเกตว่า{name}หายไป
      effects: { stats: { WIS: 1 } }

- id: childhood.bard_six_heroes
  stage: childhood
  weight: 7
  when:
    age: [4, 11]
  text: |
    กวีเร่คนหนึ่งเดินทางผ่านมา ตั้งเก้าอี้ร้องเพลงแลกข้าวอยู่ตรงที่คนผ่านมากที่สุด เสื้อคลุมสีแดงซีดจนเกือบเป็นสีชมพู พิณหกสายของเขาขาดไปหนึ่งสาย

    เขาร้องเพลงผู้กล้าหกคน หกคนจากสี่เผ่า คนหนึ่งได้พรจากเวรัส คนหนึ่งได้พรจากอีเซล จากทาลิส จากออสซา จากอุลเวน และจากเบเลค หกคนล่อจอมมารเข้าไปในตอเสาแล้วผนึกไว้ข้างใน

    ท่อนสุดท้ายเขาร้องช้าลง สามคนเดินออกมาจากตอเสา สามคนไม่ได้ออกมา แล้วเพลงก็จบตรงนั้น

    คนที่ฟังโยนเหรียญลงหมวก บางคนโยนขนมปัง แล้วแยกย้ายกันไป
  choices:
    - id: ask_three
      label: ถามว่าสามคนที่ไม่ได้ออกมา ไปไหน
      text: |
        กวีเร่ดีดพิณต่ออีกสองจังหวะก่อนตอบ

        "เพลงจบตรงนั้น" เขาว่า "ใครอยากรู้ว่าต่อจากนั้นเป็นอย่างไร ก็ต้องเข้าไปถามเอง"

        แล้วเขาก็หัวเราะ เหมือนเพิ่งพูดเรื่องตลก
      effects: { stats: { INT: 1 }, flags: [asked_about_three] }
    - id: sing_along
      label: ร้องท่อนซ้ำตามจนจำได้
      text: |
        ท่อนซ้ำร้องง่าย {name}ร้องตามได้ตั้งแต่รอบที่สอง รอบที่สามเสียงดังกว่ากวีเร่ เขาหยุดร้อง ปล่อยให้{name}ร้องคนเดียวจนจบท่อน แล้วยกหมวกขึ้นคำนับ

        คืนนั้น{name}ร้องเพลงนี้ซ้ำจนคนในบ้านบอกให้เงียบ
      effects: { stats: { CHA: 1 }, flags: [knows_heroes_song, lean_bard] }
    - id: give_bread
      label: หักขนมปังครึ่งหนึ่งใส่หมวกเขา
      text: |
        กวีเร่มองขนมปังครึ่งก้อนในหมวก แล้วมอง{name}

        เขากินขนมปังตรงนั้นเลย แล้วร้องเพลงสั้นๆ ให้อีกเพลง เพลงเรื่องหมาที่เดินตามคนไปทั่วแผ่นดิน
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 } }

- id: childhood.empty_day
  stage: childhood
  weight: 2
  when:
    age: [3, 8]
    not_flags: [origin_elf_bough]
  text: |
    ผู้ใหญ่สามคนนั่งพับผ้าอยู่ด้วยกัน คนหนึ่งเผลอพูดขึ้นมาว่าเด็กคนนี้เกิดวันว่าง แล้วหุบปากทันทีเหมือนเผลอทำของแตก อีกสองคนหันไปมองคนพูด ไม่มีใครมอง{name}

    วันว่างคือวันที่เจ็ดของสัปดาห์ วันของอัสเทล วันนั้นทุกบ้านปิดหน้าต่าง ไม่มีใครแต่งงาน ไม่มีใครย้ายบ้าน และถ้าเลือกได้ ก็ไม่มีใครอยากให้ลูกเกิด {name}เพิ่งรู้วันนั้นเองว่าตัวเองเกิดวันไหน
  choices:
    - id: ask_what
      label: ถามว่าเกิดวันว่างแล้วจะเป็นอย่างไร
      text: |
        ผู้ใหญ่ทั้งสามคนพูดพร้อมกันว่าไม่เป็นอะไรหรอก พูดเร็วเกินไป

        คนที่เผลอพูดสะบัดผ้าผืนที่พับค้างอยู่ "คนแก่ว่ากันไปเรื่อย" แล้วก็พูดเรื่องอื่นจนผ้าหมดกอง
      effects: { stats: { INT: 1 }, traits: [born_empty_day] }
    - id: shrug
      label: ยักไหล่ บอกว่าวันไหนก็เหมือนกัน
      text: |
        "วันไหนก็เกิดเหมือนกันแหละ" {name}ว่า แล้วหยิบผ้ามาช่วยพับ

        ผู้ใหญ่ทั้งสามคนหัวเราะ เสียงหัวเราะคลายลงไปทั้งวง คนที่เผลอพูดหักขนมในกระเป๋าให้ครึ่งชิ้น
      effects: { stats: { CHA: 1 }, traits: [born_empty_day] }
    - id: look_up
      label: คืนนั้นออกไปนั่งมองฟ้าคนเดียว
      text: |
        คืนนั้น{name}ออกไปนั่งข้างนอกคนเดียว มองดาวที่ขึ้นเต็มฟ้า ไม่ได้นับ ไม่ได้ชี้ แค่มอง

        ไม่มีอะไรเกิดขึ้น ดาวก็คือดาว แต่ตอนลุกเข้าบ้าน {name}รู้สึกเหมือนมีใครนั่งอยู่ด้วยตลอด
      effects: { stats: { WIS: 1 }, traits: [born_empty_day], flags: [empty_day_vigil] }

# ---------- ชีวิตรอบตัว ----------
- id: childhood.stray_dog
  stage: childhood
  weight: 6
  when:
    age: [3, 8]
    not_flags: [origin_elf_bough, origin_ashland, origin_marked_foundling, origin_marked_hidden]
  text: |
    หมาตัวหนึ่งเดินตาม{name}กลับบ้าน ตัวผอมจนนับซี่โครงได้ หูข้างหนึ่งตั้ง อีกข้างพับ หางกุดครึ่ง เดินห่างไปสิบก้าว หยุดเมื่อ{name}หยุด เดินเมื่อ{name}เดิน

    ถึงหน้าบ้าน มันนั่งลงตรงประตู ไม่ยอมไปไหน

    {mother}ออกมาเห็นแล้วถอนใจ บอกว่าในบ้านไม่มีข้าวเหลือพอจะเลี้ยงอีกปาก
  choices:
    - id: name_dog
      label: ตั้งชื่อให้มัน
      text: |
        {name}ตั้งชื่อให้มันว่าหูพับ เรียกทีเดียวมันก็กระดิกหางกุดๆ นั้น เหมือนรู้ชื่อตัวเองมาตั้งแต่เกิด

        {mother}บอกว่าตั้งชื่อแล้วก็ต้องเลี้ยง จะไล่ไม่ได้แล้ว แล้วเธอก็เป็นคนเทน้ำแกงก้นหม้อใส่ชามดินบิ่นให้มันเอง
      effects: { stats: { CHA: 1 }, flags: [has_dog] }
    - id: share_food
      label: แบ่งข้าวของตัวเองให้ครึ่งหนึ่ง
      text: |
        {name}แบ่งข้าวเย็นของตัวเองให้มันครึ่งหนึ่ง ทุกมื้อ จนกางเกงหลวม {mother}เห็นแล้วไม่ว่า แต่มื้อต่อๆ มาตักข้าวให้ลูกมากขึ้นนิดหนึ่ง

        หมาตัวนั้นนอนอยู่หน้าประตูทุกคืน ใครเดินผ่านดึกๆ มันลุกขึ้นยืน ไม่เห่า แค่ยืน
      effects: { stats: { CON: 1 }, flags: [has_dog] }
    - id: shoo
      label: ไล่มันไป ตามที่แม่บอก
      text: |
        {name}ไล่มันไป มันวิ่งออกไปสิบก้าว แล้วหยุด หันกลับมามอง

        สามวันต่อมา{name}เห็นมันนอนอยู่หน้าบ้านหลังอื่น เด็กบ้านนั้นกำลังป้อนข้าวมันด้วยมือ
      effects: { stats: { WIS: 1 } }

- id: childhood.sibling_fever
  stage: childhood
  weight: 6
  when:
    age: [3, 10]
    not_flags: [origin_marked_foundling, origin_elf_bough, father_away, father_lost]
  text: |
    {mother}คลอดน้องตอนต้นปี ตัวเล็กกว่าที่ใครเคยเห็น ร้องเสียงเบาเหมือนลูกนก หน้าหนาวยังไม่ทันหมด น้องก็ตัวร้อน

    คืนที่สาม ผู้ใหญ่ในบ้านหลับกันหมด หลับเพราะไม่ได้หลับมาสองคืน {name}นอนอยู่ข้างเปล ได้ยินเสียงหายใจของน้องเปลี่ยนไป ถี่ขึ้น แล้วเบาลง แล้วเว้นช่วงนานขึ้นทุกที
  choices:
    - id: watch_close
      label: ลุกขึ้นดูใกล้ๆ นับลมหายใจน้อง
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          {name}นับลมหายใจน้อง แล้วนับช่องว่างระหว่างลมหายใจ ช่องว่างยาวขึ้นถึงเจ็ด {name}จึงเขย่าแม่จนตื่น

          {mother}อุ้มน้องขึ้นมาตบหลัง เอาผ้าชุบน้ำอุ่นเช็ดตัว ทำอยู่อย่างนั้นจนฟ้าสาง เช้าวันนั้นน้องร้อง ร้องดังกว่าทุกวันตั้งแต่เกิด
        effects: { stats: { WIS: 1 }, flags: [has_sibling, saved_sibling, lean_cleric] }
      failure:
        text: |
          {name}นับไปได้ถึงห้า แล้วก็หลับ เด็กตัวเท่านั้นนับได้เท่านั้น

          ตอนเช้า เสียงที่ปลุก{name}คือเสียง{mother} ไม่ใช่เสียงน้อง
        effects: { stats: { CON: 1 }, flags: [lost_sibling] }
    - id: wake_mother
      label: เขย่าปลุกแม่ทันที
      text: |
        {mother}สะดุ้งตื่น อุ้มน้องขึ้นมาแนบอก ทั้งคืนไม่ได้วางลงอีก {name}นั่งอยู่ข้างๆ คอยส่งผ้าชุบน้ำให้

        ใกล้รุ่ง เธอเลิกตบหลังน้อง แต่ยังอุ้มไว้อย่างนั้น ไม่ยอมให้ใครรับไป จนพระอาทิตย์ขึ้นเต็มดวง
      effects: { stats: { CHA: 1 }, flags: [lost_sibling] }
    - id: sing
      label: ร้องเพลงกล่อมให้น้องฟังเบาๆ
      text: |
        {name}ร้องเพลงกล่อมทุกเพลงที่รู้ ร้องวนไปวนมาจนจำไม่ได้ว่าเพลงไหนร้องไปแล้ว น้องหายใจเบาลงเรื่อยๆ ใต้เสียงเพลง แต่ยังหายใจ

        เช้าวันนั้นไข้ลด {mother}ตื่นมาเห็นลูกสองคนหลับอยู่ข้างเปล คนหนึ่งในเปล อีกคนกอดขาเปลไว้
      effects: { stats: { CHA: 1 }, flags: [has_sibling] }

- id: childhood.belek_child_account
  stage: childhood
  weight: 5
  when:
    age: [6, 10]
    not_flags: [origin_elf_bough, origin_ashland, origin_dwarf_clan, origin_marked_foundling, origin_marked_hidden]
  text: |
    เสมียนจากวิหารเบเลคมาพร้อมสมุดปกเหล็กบางๆ กับตาชั่งอันเล็ก ตั้งโต๊ะอยู่หน้าตลาดทั้งวัน รับเปิดบัญชีให้เด็ก ฝากเดือนละเหรียญทองแดง ครบสิบแปดปีได้คืนเกือบสองเท่า

    "สัญญาลงชื่อต่อหน้าเบเลค" เสมียนบอกทุกคนที่มามุง "ไม่มีใครโกงใครได้ ทั้งเราและท่าน"

    เด็กแถวนั้นรู้ว่าป้าขายผักข้างตลาดใส่เสื้อสามชั้นมาตั้งแต่ปีกลาย และรู้ว่าเพราะอะไร แต่ก็ยังต่อแถวกันยาว เพราะคนที่ลงชื่อได้ลูกกวาดหนึ่งเม็ด

    ถึงคิวของ{name} เสมียนยื่นปากกาให้
  choices:
    - id: sign
      label: ลงชื่อ แล้วรับลูกกวาด
      text: |
        {name}เขียนชื่อตัวเองลงไปตัวโย้เย้ หมึกยังไม่ทันแห้ง ปลายนิ้วก็เย็นวาบขึ้นมาแวบหนึ่ง แล้วหายไป เสมียนยิ้ม ยื่นลูกกวาดให้

        คืนนั้น{mother}รู้เรื่อง เธอนั่งนับเหรียญในกระป๋องข้าวสองรอบ แล้วบอกว่าเดือนละเหรียญ แม่จะหาให้ ห้ามขาดสักเดือน
      effects: { stats: { CHA: 1 }, reputation: { belek_bank: 1 }, flags: [belek_child_account] }
    - id: read_terms
      label: ขออ่านข้อความในสัญญาก่อน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ตัวหนังสือเล็กเท่าขาแมลง {name}อ่านช้าๆ ทีละบรรทัด จนเจอบรรทัดก่อนสุดท้าย ถ้าเดือนไหนไม่ได้ฝาก เงินที่ฝากไว้ทั้งหมดจะเป็นของวิหาร และผู้ฝากเป็นหนี้วิหารเท่ากับเงินที่ฝากไว้

          {name}วางปากกาคืน เสมียนไม่ว่าอะไร ยื่นลูกกวาดให้อยู่ดี "อ่านเก่งนะ" เขาว่า "โตขึ้นมาทำงานกับเราไหม"
        effects: { stats: { INT: 1 }, flags: [read_belek_terms] }
      failure:
        text: |
          ตัวหนังสือเล็กเท่าขาแมลง {name}อ่านได้สามบรรทัดก็ตาลาย คนต่อแถวข้างหลังเริ่มบ่น เสมียนยิ้มรอ ไม่เร่งสักคำ

          {name}วางปากกาคืนโดยไม่ลงชื่อ ไม่ได้ลูกกวาด เดินกลับบ้านโดยยังไม่รู้ว่าข้างในเขียนว่าอะไร
        effects: { stats: { WIS: 1 } }
    - id: walk_away
      label: ส่ายหน้า เดินออกจากแถว
      text: |
        {name}ส่ายหน้า เดินออกจากแถว เด็กข้างหลังขยับขึ้นมาแทนทันที

        ปีต่อมาเด็กสองคนในแถววันนั้นต้องออกไปทำงานแบกของที่ตลาด เพราะพ่อแม่หาเหรียญให้ไม่ทันเดือนหนึ่ง หน้าร้อนปีนั้น เด็กทั้งสองคนใส่เสื้อสองชั้น
      effects: { stats: { WIS: 1 } }

- id: childhood.river_dare
  stage: childhood
  weight: 6
  when:
    age: [7, 11]
    not_flags: [origin_dwarf_clan, origin_elf_bough, origin_ashland, origin_marked_hidden]
  text: |
    หน้าน้ำหลาก แม่น้ำกว้างขึ้นเกือบเท่าตัว สีขุ่นเหมือนน้ำชา พัดกิ่งไม้กับฟางลอยผ่านไม่ขาดสาย เด็กโตท้ากันว่าใครว่ายข้ามไปแตะตอไม้กลางน้ำแล้วกลับมาได้ จะได้เป็นหัวหน้าไปจนหน้าน้ำปีหน้า

    เด็กชายคนหนึ่งชื่อเรมิสกระโดดลงไปก่อน ว่ายไปได้ครึ่งทาง หัวก็จมหายไปใต้น้ำ แล้วโผล่ขึ้นมาไกลกว่าเดิม มือตะกุยน้ำ ไม่มีเสียงร้อง

    เด็กโตที่ยืนอยู่ริมตลิ่งยืนนิ่งกันหมด
  choices:
    - id: jump_in
      label: กระโดดลงไปช่วย
      check: { stat: STR, dc: 13 }
      success:
        text: |
          {name}ว่ายตามกระแสไปจนคว้าคอเสื้อเรมิสได้ ลากเข้าหาตลิ่งทีละศอก น้ำเข้าปากเข้าจมูกจนตาพร่า เด็กโตช่วยกันดึงทั้งสองคนขึ้นมาจากรากไม้

          เรมิสอาเจียนน้ำออกมาเป็นขัน แล้วร้องไห้ เด็กโตไม่มีใครพูดเรื่องหัวหน้าอีก
        effects: { stats: { STR: 1 }, alignment: { moral: 1 }, flags: [saved_friend_river, lean_warrior] }
      failure:
        text: |
          กระแสน้ำแรงกว่าที่คิด {name}ว่ายไปได้ไม่ถึงครึ่งทางก็โดนพัดออกห่างไปเรื่อยๆ กว่าจะเกาะกิ่งไม้ริมตลิ่งได้ ก็หมดแรงจนยกตัวขึ้นไม่ไหว

          คนที่ช่วยเรมิสขึ้นมาคือคนจับปลาที่พายเรือผ่านมาพอดี เรมิสรอด {name}ไอเป็นน้ำอยู่สองวัน
        effects: { stats: { CON: 1 }, alignment: { moral: 1 } }
    - id: reach_branch
      label: วิ่งไปหักกิ่งไม้ยาวยื่นให้
      check: { stat: DEX, dc: 11 }
      success:
        text: |
          {name}หักกิ่งหลิวยาวกว่าตัววิ่งไปตามตลิ่ง ยื่นไปข้างหน้าเรมิสตรงจุดที่กระแสน้ำจะพาเขาไป เรมิสคว้าได้ เด็กโตตื่นจากที่ยืนนิ่ง วิ่งมาช่วยกันดึง

          เย็นนั้นเรมิสเดินตาม{name}กลับบ้าน ไม่พูดอะไร แค่เดินตาม
        effects: { stats: { DEX: 1 }, alignment: { moral: 1 }, flags: [saved_friend_river, lean_ranger] }
      failure:
        text: |
          กิ่งไม้สั้นไปหนึ่งช่วงแขน เรมิสคว้าพลาด หายลับไปที่โค้งน้ำ {name}วิ่งตามไปจนสุดตลิ่ง

          คนจับปลาที่ท่าลากเขาขึ้นมาได้ที่โค้งถัดไป เรมิสรอด แต่หลังจากนั้นไม่ยอมลงน้ำอีกเลย
        effects: { stats: { WIS: 1 } }
    - id: run_adults
      label: วิ่งไปตามผู้ใหญ่
      text: |
        {name}วิ่งจนหายใจไม่ทัน ไปถึงคนจับปลาที่กำลังซ่อมแหอยู่ท่าน้ำ เขาโยนแหทิ้งแล้วพายเรือออกไปทันที

        เรมิสรอด ลากขึ้นมาได้ที่โค้งน้ำ ตัวเขียวเหมือนลูกกบ เด็กโตบางคนว่า{name}ขี้ขลาด คนจับปลาบอกว่าเด็กที่กระโดดลงไปตามน่ะ ตายมาทุกปี
      effects: { stats: { INT: 1 } }

- id: childhood.witch_hunt
  stage: childhood
  weight: 6
  when:
    age: [6, 11]
    not_flags: [origin_dwarf_clan, origin_elf_bough, origin_ashland, origin_marked_hidden]
  text: |
    ยายเนเรสอยู่บ้านหลังสุดท้ายท้ายทาง ทำยาให้ทุกคนที่ไม่มีเงินจ่ายหมอ ยาแก้ไอ ยาทาแผล ยาที่ผู้หญิงมาขอกันตอนกลางคืน ทุกคนเคยกินยาของแก และทุกคนเรียกแกว่าแม่มดเวลาแกไม่อยู่

    เช้านั้นนักล่าแม่มดของศาสนจักรตะเกียงมาถึงพร้อมทหารสี่นาย เสื้อคลุมขาวปักรูปตะเกียงที่อก มีคนแจ้งชื่อยายเนเรสไป ไม่มีใครรู้ว่าใคร หรือทุกคนรู้แต่ไม่พูด

    ทหารลากแกออกมาหน้าบ้าน แกเดินเองได้ แต่เขาลาก คนมามุงยืนห่างๆ

    {name}เคยไปบ้านยายเนเรสสองครั้ง จำได้ว่าใต้เตียงแกมีสมุดเล่มหนึ่ง ปกหนังเก่าจนดำ ข้างในเป็นลายมือของแกเอง
  choices:
    - id: hide_book
      label: อ้อมไปหลังบ้าน มุดเข้าไปเอาสมุดเล่มนั้น
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}มุดเข้าทางหน้าต่างหลังบ้านตอนที่ทหารยังวุ่นอยู่ข้างหน้า คว้าสมุดใต้เตียงซุกเข้าเสื้อ แล้วมุดออกมาทางเดิม

          ตอนบ่ายทหารค้นบ้านทั้งหลัง หาอะไรสักอย่างไม่เจอ นักล่าแม่มดถามยายเนเรสว่าเอาไปซ่อนไว้ไหน แกไม่ตอบ แกมองข้ามไหล่เขามาทางคนมุง มาหยุดที่{name} แล้วมองต่อไปทางอื่น
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [witch_book, lean_wizard] }
      failure:
        text: |
          ทหารคนหนึ่งยืนเฝ้าหลังบ้านอยู่ก่อนแล้ว เขาคว้าคอเสื้อ{name}ไว้ตั้งแต่ยังปีนหน้าต่างไม่พ้น ลากออกไปหน้าบ้าน

          นักล่าแม่มดก้มลงมาจนหน้าเสมอหน้า{name} แล้วบอกทหารให้ปล่อย "เด็ก" เขาว่า "ไม่รู้ว่าตัวเองกำลังทำอะไร" เขาจดชื่อ{name}ไว้ในสมุดของเขาก่อนจะหันไปทางอื่น
        effects: { stats: { WIS: 1 }, reputation: { lamp_church: -1 }, flags: [lamp_noted_child] }
    - id: watch
      label: ยืนดูอยู่กับคนมุง
      text: |
        {name}ยืนดูอยู่กับคนมุงจนทหารพายายเนเรสขึ้นเกวียน แกนั่งตัวตรงอยู่ท้ายเกวียน มือมัดไว้ข้างหน้า

        เกวียนเลี้ยวพ้นหัวโค้งไปแล้ว คนมุงก็ยังไม่มีใครขยับ ผู้หญิงคนหนึ่งข้างๆ พึมพำว่าแล้วยาแก้ไอของลูกฉันล่ะ
      effects: { stats: { WIS: 1 } }
    - id: tell_hunter
      label: เดินไปบอกนักล่าแม่มดเรื่องสมุดใต้เตียง
      text: |
        นักล่าแม่มดฟังจบ ก็ส่งทหารไปค้นใต้เตียง ได้สมุดออกมา เขาเปิดดูสองสามหน้า แล้วยื่นเหรียญทองแดงให้{name}หนึ่งเหรียญ

        "ศาสนจักรจำคนซื่อได้" เขาว่า

        ยายเนเรสมองตามเหรียญนั้นไปจนถึงมือ{name}
      effects: { stats: { INT: 1 }, gold: 1, alignment: { law: 1, moral: -1 }, reputation: { lamp_church: 1 } }
