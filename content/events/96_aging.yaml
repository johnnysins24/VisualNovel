# ชุด 1 ร่างกายที่แก่ลง อายุ 41 ขึ้นไป ทุกถิ่น ทุกอาชีพ (ข้อความห้ามผูกกับงานหรือถิ่น ยกเว้นเรื่องที่กันด้วย location_tag)
# แผลจากวัย (wound_knee wound_back wound_tremor wound_limp wound_lungs) ได้จากทางที่ฝืนหรือทางที่ทอยพลาดเท่านั้น ทุกเรื่องมีทางเลี่ยงที่ต้องจ่ายอย่างอื่นแทน
# หลังสี่สิบเอ็ดไม่ให้ค่าพลังเพิ่มง่ายๆ ผลของตัวเลือกคือเงิน พลังชีวิต ธง นิสัย และความสนิท
# เอลฟ์แก่ไม่ถึงวัยในไฟล์นี้ก่อนปีสุดท้ายของเรื่อง ยกเว้นเรื่องแรกซึ่งกันเอลฟ์ไว้ (เอลฟ์ไม่ผมขาวตอนอายุเท่านี้)

- id: adult.aging_first_grey
  stage: adult
  mark: ผมขาวสามเส้นแรก
  scene: market
  weight: 12
  when:
    age: [41, 49]
    not_flags: [race_elf]
  text: |
    ช่างตัดผมเร่มาตั้งเก้าอี้ที่มุมตลาดเหมือนทุกต้นเดือน {name}นั่งลงตามคิว เขาคลุมผ้าให้ ลับกรรไกรกับสายหนังสองที แล้วหยุดมือ

    "ตรงขมับมีสามเส้นแล้วนะ" เขาว่า ยื่นกระจกมือบานร้าวมาให้ดูเอง

    ในกระจก สามเส้นนั้นขาวกว่าที่คิด ขาวแบบด้ายเย็บผ้า ไม่ได้ขาวแบบผมที่โดนแดดเลีย ช่างตัดผมเคาะขวดเล็กสีน้ำตาลที่ห้อยอยู่ข้างเก้าอี้ น้ำเปลือกไม้ย้อมผม ทาครั้งละหนึ่งเหรียญ อยู่ได้ถึงหน้าหนาว
  choices:
    - id: dye
      label: จ่ายหนึ่งเหรียญ ให้เขาย้อมทับ
      requires: { min_gold: 1 }
      text: |
        น้ำย้อมเย็นและเหม็นเหมือนเปลือกไม้แช่น้ำค้างคืน ช่างตัดผมแต้มทีละเส้นด้วยไม้พันสำลี มือนิ่งมาก แต่ไม่นิ่งพอ ขอบหูของ{name}เป็นสีน้ำตาลไปสามวัน

        ไม่มีใครในถิ่นทักเรื่องผม ทุกคนทักเรื่องหู
      effects: { gold: -1, flags: [dyes_hair] }
    - id: pluck
      label: ขอแหนบ ถอนออกเองทั้งสามเส้น
      habit: stubborn
      text: |
        ช่างตัดผมยื่นแหนบให้ แล้วเล่าว่าแม่ของเขาเคยสอนไว้ ถอนหนึ่งเส้น อีกเจ็ดเส้นจะมางานศพ {name}ถอนครบสามเส้น วางเรียงไว้บนผ้าคลุม ยาวเท่ากันทั้งสาม

        ต้นเดือนถัดมาช่างตัดผมนับให้อีกรอบ ได้ห้าเส้น เขาไม่ได้พูดอะไร แค่ยื่นแหนบมาให้ก่อนจะถูกขอ
      effects: { flags: [plucks_grey] }
    - id: leave
      label: บอกให้ตัดตามเดิม ไม่ต้องยุ่งกับสามเส้นนั้น
      text: |
        กรรไกรเดินไปตามทางเดิมที่เดินมาหลายสิบครั้ง ผมที่ร่วงลงบนผ้าคลุมยังดำเกือบทั้งหมด

        ขากลับ เด็กที่เล่นอยู่ข้างบ่อน้ำตะโกนเรียกให้ช่วยเก็บลูกหนังที่กลิ้งมาทางนี้ เรียกว่า{ลุง|ป้า} {name}หันไปมองข้างหลังก่อน ว่าเด็กเรียกใคร ข้างหลังไม่มีใคร
      effects: { flags: [grey_shown] }

- id: adult.aging_knee
  stage: adult
  scene: road
  weight: 12
  when:
    age: [50, 60]
    not_traits: [wound_knee]
  text: |
    ทางลัดไปตลาดมีร่องน้ำขวางอยู่ร่องหนึ่ง กว้างราวหนึ่งช่วงแขน {name}กระโดดข้ามร่องนี้มานานจนจำไม่ได้ว่ากี่ปี ไม่เคยต้องคิด

    เช้านี้ขอบร่องยังเป็นโคลนจากน้ำที่คนสาดล้างถนนเมื่อคืน เด็กส่งนมสองคนวิ่งมาจากข้างหลัง กระโดดข้ามไปทั้งที่หาบถังอยู่ ไม่ได้ชะลอด้วยซ้ำ

    {name}ยืนอยู่ที่ขอบ มองร่องน้ำ แล้วมองสะพานไม้ที่อยู่ไกลออกไปอีกสองร้อยก้าว เป็นครั้งแรกที่เท้าหยุดก่อนที่หัวจะสั่ง
  choices:
    - id: jump
      label: ถอยหลังสองก้าว แล้วกระโดดข้ามเหมือนทุกวัน
      check: { stat: DEX, dc: 11 }
      success:
        text: |
          เท้าหลังลื่นไปนิดตอนถีบตัว แต่เท้าหน้าลงถึงฝั่ง โคลนกระเด็นขึ้นถึงเข่า เด็กส่งนมคนหนึ่งหันมาผิวปากให้

          {name}เดินต่อโดยไม่หันไปมองร่องน้ำ ถึงตลาดแล้วหัวใจยังเต้นแรงอยู่ แรงกว่าที่การกระโดดข้ามร่องกว้างหนึ่งช่วงแขนควรจะทำได้
        effects: { flags: [still_jumps] }
      failure:
        text: |
          เท้าหน้าลงถึงฝั่ง แต่เข่าไม่ได้งอรับอย่างที่เคย มีเสียงดังข้างในเหมือนคนหักกิ่งไม้สด {name}ล้มตะแคงลงในโคลน เด็กส่งนมวางหาบแล้ววิ่งกลับมาพยุง

          หมอกระดูกบอกว่าไม่หัก แต่เอ็นข้างในจะไม่กลับมาเหมือนเดิม ตั้งแต่นั้นเข่าข้างนี้ปวดก่อนฝนมาหนึ่งวันเสมอ แม่นกว่าคนดูฟ้าคนไหนในถิ่น
        effects: { hp: -3, traits: [wound_knee] }
    - id: bridge
      label: เดินอ้อมไปข้ามสะพาน
      habit: cool_headed
      text: |
        สองร้อยก้าวไป สองร้อยก้าวกลับ ถึงตลาดช้ากว่าทุกวันจนขนมปังเตาแรกหมด คนขายบอกว่าเตาสองต้องรออีกครึ่งชั่วยาม {name}ยืนรอ

        ตั้งแต่วันนั้น{name}ออกจากบ้านเร็วขึ้นเท่ากับสี่ร้อยก้าว และไม่ได้เดินทางลัดเส้นนั้นอีก
      effects: { flags: [takes_the_bridge] }
    - id: plank
      label: กลับไปเอาไม้กระดานที่บ้านมาพาดข้ามร่อง
      habit: craft_hands
      text: |
        กระดานแผ่นนั้นเคยเป็นฝาหีบ {name}แบกมาพาด เหยียบลองสองที แล้วเดินข้าม

        วันต่อมารอยเท้าโคลนของคนอื่นทับกันอยู่บนกระดาน ทั้งรอยรองเท้าหนังและรอยเท้าเปล่าขนาดเท่าฝ่ามือ ไม่ถึงเดือนก็มีคนเอาหินมาหนุนหัวท้ายให้ ไม่มีใครรู้ว่าใคร
      effects: { alignment: { moral: 1 }, flags: [laid_the_plank] }

- id: adult.aging_back
  stage: adult
  scene: home
  weight: 12
  when:
    age: [48, 60]
    not_traits: [wound_back]
  text: |
    เพื่อนบ้านฝั่งตรงข้ามย้ายออกวันนี้ เกวียนจอดรออยู่หน้าบ้านตั้งแต่เช้า ของชิ้นสุดท้ายที่ยังอยู่ข้างในคือหีบไม้ใบใหญ่บุเหล็กสี่มุม ลูกชายเจ้าของบ้านออกไปตามคนมาช่วยยกแล้วยังไม่กลับ

    หญิงแก่เจ้าของหีบยืนเท้าเอวมองมาที่{name} "สิบปีก่อนเอ็งยกตู้กับข้าวให้ข้าได้คนเดียว" นางว่า ไม่ได้ขอ แค่บอก

    คนขับเกวียนเงยดูตะวัน แล้วก้มดูหีบ
  choices:
    - id: lift_alone
      label: ยกคนเดียว เหมือนตู้กับข้าวใบนั้น
      habit: stubborn
      check: { stat: STR, dc: 13 }
      success:
        text: |
          {name}ย่อเข่า สอดมือใต้หีบ แล้วยกขึ้นด้วยขา หีบลอยจากพื้น หนักกว่าตู้กับข้าวใบนั้นแน่ หรือไม่อย่างนั้นสิบปีก็มีน้ำหนักของตัวเอง ยี่สิบก้าวถึงเกวียน วางลงได้โดยไม่กระแทก

          หญิงแก่พยักหน้าทีเดียว เหมือนเป็นเรื่องที่รู้อยู่แล้ว คืนนั้น{name}นอนหงายไม่ได้ แต่เช้ามาก็ลุกได้เอง
        effects: { hp: -1, flags: [lifted_the_chest] }
      failure:
        text: |
          หีบลอยจากพื้นได้คืบหนึ่ง แล้วมีอะไรเลื่อนผิดที่ตรงบั้นเอว ทีแรกไม่เจ็บ แค่ขาสองข้างไม่รับคำสั่งไปชั่วอึดใจ หีบตกกลับลงพื้น {name}ยืนค้างอยู่ท่านั้น ยืดตัวไม่ขึ้น

          หญิงแก่เป็นคนประคองไปนั่ง นางบอกว่าผัวของนางก็เป็นแบบนี้ตอนอายุเท่านี้ แล้วก็เป็นไปจนตาย ตั้งแต่วันนั้น{name}เก็บของที่พื้นด้วยการย่อเข่า และลุกจากเตียงด้วยการพลิกตะแคงก่อน
        effects: { hp: -3, traits: [wound_back] }
    - id: wait_for_hands
      label: บอกนางให้รอลูกชาย แล้วยกด้วยกันหลายคน
      text: |
        ลูกชายกลับมาพร้อมคนอีกคน เลยกลายเป็นสามคน หีบไปถึงเกวียนโดยแทบไม่รู้สึกถึงน้ำหนัก หญิงแก่ไม่ได้พูดเรื่องตู้กับข้าวอีก

        ก่อนเกวียนออก นางยื่นไหผักดองมาให้ไหหนึ่ง บอกว่าขนไปด้วยก็หนักเปล่า {name}กินผักดองไหนั้นไปได้ทั้งหน้าหนาว
      effects: { hp: 1 }
    - id: drag_on_blanket
      label: เอาผ้าห่มเก่ารองใต้หีบ แล้วลากไปแทนการยก
      habit: craft_hands
      text: |
        {name}เอียงหีบทีละข้าง สอดผ้าห่มเข้าไปข้างใต้ แล้วลากถอยหลังไปตามพื้น ถึงธรณีประตูก็ใช้ไม้คานงัดข้าม ถึงเกวียนก็พาดกระดานทำทางลาด

        ใช้เวลานานกว่ายกสามเท่า หลังไม่ได้ออกแรงสักครั้ง คนขับเกวียนยืนดูอยู่ตลอด แล้วบอกว่าจะจำไว้ใช้
      effects: { flags: [dragged_the_chest] }

- id: adult.aging_young_replacement
  stage: adult
  weight: 12
  when:
    age: [52, 62]
  text: |
    ทุกปลายหน้าแล้ง คนในละแวกของ{name}ช่วยกันล้างบ่อ ต้องมีคนหนึ่งผูกเชือกรอบเอวลงไปถึงก้น ตักโคลนใส่ถังให้คนข้างบนสาวขึ้น ยี่สิบปีมานี้คนคนนั้นคือ{name}ทุกปี ไม่เคยมีใครต้องถามว่าปีนี้ใครลง

    ปีนี้ตอน{name}ไปถึงปากบ่อ เชือกผูกอยู่รอบเอวของลูกชายคนทำขนมปังแล้ว เด็กหนุ่มอายุยังไม่ถึงยี่สิบ ไหล่ยังไม่เต็ม กำลังฟังคนรอบบ่อบอกว่าต้องเหยียบหินก้อนไหนบ้าง คนบอกบอกผิดไปสองก้อน

    ไม่มีใครมาบอก{name}ก่อน ทุกคนทำเหมือนเป็นเรื่องที่ตกลงกันไว้นานแล้ว หญิงเจ้าของถังยื่นปลายเชือกมาให้ช่วยสาว
  choices:
    - id: tell_the_stones
      label: บอกเด็กหนุ่มว่าหินก้อนไหนเหยียบได้ ก้อนไหนโยก
      text: |
        ก้อนที่สามจากบนโยก ก้อนที่เจ็ดลื่นเพราะตะไคร่ ที่ก้นบ่อด้านเหนือมีโพรงที่เท้าจะจมถึงเข่าถ้าไม่ระวัง {name}บอกทีละก้อน เด็กหนุ่มทวนตามทุกก้อน แล้วลงไป ไม่นานก็ตะโกนขึ้นมาว่าเจอโพรงแล้ว ไม่ได้จม

        ถังแรกขึ้นมา{name}เป็นคนสาว เชือกเส้นเดิม แต่จับคนละปลายกับทุกปี หนังด้านบนฝ่ามืออยู่ผิดที่ จึงพองไปสองเม็ดก่อนเที่ยง
      effects: { mark: "ส่งเชือกลงบ่อให้คนหนุ่ม", alignment: { moral: 1 }, flags: [passed_the_rope] }
    - id: one_more_year
      label: ขอเชือกคืน บอกว่าปีนี้ลงเองอีกปี
      habit: stubborn
      check: { stat: CON, dc: 12 }
      success:
        text: |
          เด็กหนุ่มแก้เชือกให้โดยไม่เถียง {name}ลงไปตามหินก้อนเดิม ช้ากว่าทุกปี โคลนปีนี้ลึกเท่าปีก่อน แต่ถังหนักกว่า งานที่เคยเสร็จก่อนเที่ยงไปเสร็จเอาตอนเงายาว

          ขาขึ้นต้องหยุดพักสองครั้ง เด็กหนุ่มเป็นคนสาวเชือกทุกถัง และเป็นคนยื่นมือมาดึงตอนถึงปากบ่อ ปีถัดมาไม่มีใครถามอีกว่าใครลง {name}เองก็ไม่ได้ไปยืนที่ปากบ่อก่อนคนอื่น
        effects: { hp: -2, flags: [last_well_year] }
      failure:
        text: |
          ลงไปได้ครึ่งทาง แขนสองข้างก็เริ่มสั่น หินก้อนที่เจ็ดลื่นเหมือนทุกปี ปีนี้มือเกาะไม่อยู่ {name}ห้อยอยู่กลางบ่อด้วยเชือกเส้นเดียว หมุนช้าๆ เหมือนถังโคลน

          คนข้างบนสี่คนช่วยกันสาวขึ้น เด็กหนุ่มรับเชือกไปผูกเอวใหม่โดยไม่มองหน้า แล้วลงไปทำจนเสร็จ รอยเชือกรัดรอบเอวของ{name}เขียวอยู่ครึ่งเดือน
        effects: { hp: -4, flags: [pulled_from_the_well] }
    - id: take_the_rope_end
      label: รับปลายเชือกมาสาว ไม่พูดอะไร
      habit: cool_headed
      text: |
        ถังขึ้นมาสิบเก้าใบก่อนตะวันตรงหัว {name}สาวทุกใบ นับทุกใบ ปีที่ลงเองเคยได้ยี่สิบสอง

        เด็กหนุ่มขึ้นมาตัวดำถึงคอ ยิ้มฟันขาว มองหาคนที่จะชม ทุกคนชม {name}ส่งผ้าเช็ดตัวให้ ผืนที่เตรียมมาใช้เอง
      effects: { mark: "ส่งเชือกลงบ่อให้คนหนุ่ม", flags: [passed_the_rope] }

- id: elder.aging_hands
  stage: elder
  scene: home
  weight: 12
  when:
    age: [58, 72]
    not_traits: [wound_tremor]
  text: |
    ช้อนซุปเคาะขอบชามสามครั้งก่อนจะถึงปาก {name}วางช้อนลง มองมือขวาที่วางอยู่บนโต๊ะ นิ้วชี้กับนิ้วกลางยังขยับอยู่เองเบาๆ เหมือนกำลังนับอะไรสักอย่าง

    อาการนี้มีมาตั้งแต่ต้นหน้าฝน ทีแรกเป็นแค่ตอนเช้า เดือนนี้สนเข็มไม่ได้แล้ว กลัดกระดุมเม็ดบนสุดเม็ดเดียวใช้เวลาเท่ากับที่เคยแต่งตัวทั้งชุด

    หมอยาที่ตลาดมีให้เลือกสองอย่าง ยาต้มรากขมห่อละสามเหรียญ กินแล้วมือนิ่งไปได้ทั้งหน้าหนาว กับคำแนะนำที่แกไม่คิดเงิน ว่าให้หัดใช้มือซ้ายเสียตั้งแต่ตอนนี้
  choices:
    - id: buy_root
      label: จ่ายสามเหรียญ ซื้อยาต้มรากขม
      requires: { min_gold: 3 }
      text: |
        ยาขมจนต้องบีบจมูกกลืน แต่ได้ผลอย่างที่หมอว่า เช้าวันที่สามช้อนซุปไปถึงปากโดยไม่เคาะอะไร {name}สนเข็มได้ในครั้งแรก แล้วสนซ้ำอีกสองเล่มทั้งที่ไม่ได้จะเย็บอะไร

        ห่อยาหมดตอนน้ำแข็งเริ่มละลาย หมอยาบอกว่าปีหน้าราคาเท่าเดิม ถ้ารากยังหาได้
      effects: { gold: -3, hp: 1, flags: [takes_bitter_root] }
    - id: train_left
      label: หัดใช้มือซ้าย เริ่มจากช้อน
      check: { stat: DEX, dc: 11 }
      success:
        text: |
          สัปดาห์แรกซุปหกมากกว่าเข้าปาก สัปดาห์ที่สามหกเท่ากับตอนใช้มือขวา พอหมดหน้าฝน มือซ้ายตักซุป หั่นขนมปัง และกลัดกระดุมได้ทุกเม็ด ช้า แต่ไม่พลาด

          มือขวายังสั่นอยู่บนตัก {name}ให้มือข้างนั้นถือของที่ไม่ต้องนิ่ง เช่นราวบันได
        effects: { flags: [left_handed_late] }
      failure:
        text: |
          มือซ้ายไม่เคยทำอะไรนอกจากช่วยจับมาหกสิบปี จะให้เริ่มเรียนตอนนี้ก็เรียนได้เท่าเด็กสามขวบ ชามแตกไปสองใบ นิ้วโดนมีดบาดไปหนึ่งแผล {name}กลับไปใช้มือขวา ทั้งที่สั่น

          คนในถิ่นเริ่มรินน้ำชาให้{name}แค่ครึ่งถ้วย โดยไม่มีใครบอกว่าเพราะอะไร
        effects: { hp: -1, traits: [wound_tremor] }
    - id: carry_on
      label: ใช้มือขวาต่อไปอย่างเดิม ใครจะมองก็มอง
      habit: stubborn
      text: |
        {name}ยกช้อนขึ้นใหม่ ซุปหกลงโต๊ะสองหยดก่อนถึงปาก ก็เช็ด แล้วตักต่อ

        ถึงปลายปีมือขวาสั่นทั้งมือ ลายมือที่เคยเซ็นชื่อกลายเป็นเส้นคลื่น คนรับเงินที่ตลาดต้องแบมือมารอใต้มือของ{name}ทุกครั้งที่จ่ายเหรียญ ไม่มีเหรียญไหนตกพื้นสักเหรียญ
      effects: { traits: [wound_tremor] }

- id: elder.aging_ears
  stage: elder
  mark: หูซ้ายเริ่มไม่ได้ยิน
  scene: market
  weight: 12
  when:
    age: [60, 75]
  text: |
    คนขายปลาถามว่าวันนี้เอากี่ตัว {name}ตอบว่าสบายดี

    คนขายปลาไม่ได้หัวเราะ แกถามซ้ำ ดังขึ้นและช้าลง เหมือนพูดกับเด็กหรือคนต่างถิ่น คนที่ต่อคิวอยู่ข้างหลังสองคนมองหน้ากัน

    หูซ้ายเป็นมาปีกว่าแล้ว เสียงตลาดทั้งตลาดฟังเหมือนดังมาจากใต้น้ำ {name}เดาคำพูดจากปากคนมาตลอด ส่วนใหญ่เดาถูก วันนี้คนขายปลาก้มหน้าควักไส้ปลาอยู่ตอนถาม
  choices:
    - id: say_it
      label: บอกเขาตรงๆ ว่าหูซ้ายไม่ได้ยินแล้ว ให้พูดทางขวา
      text: |
        คนขายปลาเดินอ้อมแผงมายืนฝั่งขวา ถามใหม่ด้วยเสียงปกติ {name}ตอบว่าสองตัว ตัวกลาง

        ข่าวไปถึงทั้งตลาดก่อนเที่ยง ตั้งแต่วันนั้นคนที่รู้จักจะเดินมาทางขวาเสมอ เด็กบางคนแกล้งมากระซิบทางซ้ายแล้ววิ่งหนี {name}ไม่เคยได้ยินว่าเด็กพวกนั้นกระซิบว่าอะไร
      effects: { flags: [admits_deaf_ear] }
    - id: nod_along
      label: พยักหน้า ยิ้ม แล้วชี้เอา
      habit: faint_heart
      text: |
        {name}ชี้ปลาสองตัว คนขายปลาพูดอะไรอีกประโยค {name}พยักหน้า แกชั่ง ห่อ แล้วแบมือ เหรียญที่ต้องจ่ายมากกว่าทุกครั้งหนึ่งเหรียญ

        ถึงบ้านแกะห่อออกจึงรู้ว่าประโยคนั้นคืออะไร แกถามว่าเอาหัวปลาของเมื่อวานไปต้มด้วยไหม ในห่อมีมาสามหัว
      effects: { gold: -1, flags: [nods_along] }
    - id: ear_horn
      label: ไปร้านช่างคนแคระ ซื้อแตรฟังทองเหลือง
      requires: { min_gold: 4 }
      text: |
        แตรยาวหนึ่งคืบ ปากบานเท่าถ้วยชา ช่างคนแคระเรียกสี่เหรียญ และไม่ลดให้ เขาบอกว่าหูคนแคระก็ดับเพราะเสียงค้อนกันครึ่งตระกูล ร้านนี้ขายแตรได้มากกว่าขายกุญแจ

        {name}ยกแตรขึ้นแนบหูซ้ายกลางตลาด เสียงคนขายปลาที่อยู่ห่างไปสิบแผงดังขึ้นมาชัดทุกคำ แกกำลังบอกลูกค้าว่าปลาเมื่อวานยังสดอยู่
      effects: { gold: -4, flags: [carries_ear_horn] }

- id: elder.aging_coal_cough
  stage: elder
  scene: home
  weight: 14
  when:
    age: [55, 75]
    location_tag: ashland
    not_traits: [wound_lungs]
  text: |
    ลมพัดมาจากทางเหมืองได้สามวันแล้ว เถ้าละเอียดเกาะขอบหน้าต่างเป็นเส้นสีเทา {name}ไอตั้งแต่ตื่น ไอแห้งๆ ที่ไม่มีอะไรออกมา จนเช้านี้มี บนผ้าเช็ดปากเป็นจุดดำขนาดเท่าเมล็ดถั่ว

    คนแดนเถ้ารู้จักจุดดำแบบนี้ดี ไม่ต้องให้หมอบอก บ้านไหนมีคนแก่ บ้านนั้นมีผ้าแบบนี้ตากอยู่บนราว

    หมอประจำเหมืองดูให้โดยไม่คิดเงิน แกเคาะหลัง{name}สองที เอาหูแนบฟัง แล้วบอกทางที่มีอยู่สามทาง ไม่มีทางไหนที่แกเรียกว่ารักษา
  choices:
    - id: wet_cloth
      label: ผูกผ้าชุบน้ำปิดปากทุกวันที่ลมมาจากเหมือง
      check: { stat: CON, dc: 11 }
      success:
        text: |
          ผ้าผืนแรกดำภายในครึ่งวัน {name}ซักแล้วผูกใหม่ วันละสามผืน เด็กในตรอกเรียกว่าโจรปล้นเกวียน

          ถึงปลายปีจุดดำบนผ้าเช็ดปากยังเท่าเมล็ดถั่วเท่าเดิม ไม่ได้เล็กลง แต่ก็ไม่ได้โตขึ้น หมอบอกว่าในแดนเถ้า แค่นี้ก็นับว่าชนะแล้ว
        effects: { flags: [wears_ash_cloth] }
      failure:
        text: |
          ผ้าชุบน้ำกันได้แต่เถ้าเม็ดหยาบ เม็ดละเอียดผ่านเข้าไปเหมือนไม่มีอะไรกั้น ถึงปลายปีจุดดำบนผ้าเช็ดปากโตเท่าเหรียญ ขึ้นบันไดสิบขั้นต้องหยุดหนึ่งครั้ง

          หมอบอกว่าปอดแบบนี้เจอในคนเหมืองทุกคน และในคนที่อยู่ใต้ลมเหมืองมานานพอ
        effects: { flags: [wears_ash_cloth], traits: [wound_lungs] }
    - id: move_upwind
      label: จ่ายสี่เหรียญ ย้ายไปเช่าห้องฝั่งต้นลม
      requires: { min_gold: 4 }
      text: |
        ห้องฝั่งต้นลมเล็กกว่าเดิมครึ่งหนึ่งและแพงกว่าเท่าตัว หน้าต่างบานเดียวหันออกไปทางทุ่งเถ้าที่ยังไม่มีใครขุด เช้าแรกที่ตื่นขึ้นมา ขอบหน้าต่างไม่มีเส้นสีเทา

        {name}ยังไออยู่ แต่ผ้าเช็ดปากกลับมาขาว เพื่อนบ้านเก่าบางคนเลิกทัก เพราะคนที่ย้ายไปฝั่งต้นลมคือคนที่คิดว่าตัวเองดีกว่าเถ้า
      effects: { gold: -4, flags: [moved_upwind] }
    - id: keep_coughing
      label: ไอต่อไป คนที่นี่ก็ไอกันทั้งนั้น
      habit: stubborn
      text: |
        {name}พับผ้าเช็ดปากเอาด้านที่มีจุดดำไว้ข้างใน แล้วไปทำอย่างที่ทำทุกวัน

        ถึงปลายปีผ้าผืนนั้นใช้ไม่ได้แล้ว ต้องเปลี่ยนเป็นผ้าสีเข้ม หน้าหนาวที่เคยผ่านไปเฉยๆ เริ่มเป็นของที่ต้องนับวันรอให้หมด
      effects: { traits: [wound_lungs] }

- id: elder.aging_memory
  stage: elder
  scene: market
  weight: 12
  when:
    age: [66, 88]
  text: |
    {name}ยืนอยู่หน้าแผงผักมาพักหนึ่งแล้ว ตะกร้าอยู่ในมือ เหรียญอยู่ในกำ รู้ว่าออกจากบ้านมาซื้อของสามอย่าง จำได้สองอย่าง เกลือกับด้ายดำ อย่างที่สามไม่ยอมมา

    คนขายผักรอ คนข้างหลังเริ่มขยับเท้า

    เดือนก่อน{name}ลืมกาไว้บนเตาจนก้นทะลุ สัปดาห์ก่อนเรียกเด็กข้างบ้านด้วยชื่อพ่อของเด็ก ซึ่งตายไปสิบปีแล้ว ไม่มีใครทัก ทุกคนใจดีพอที่จะไม่ทัก
  choices:
    - id: ask_the_seller
      label: ถามคนขายว่าปกติตัวเองมาซื้ออะไร
      text: |
        "หัวหอม" คนขายตอบทันทีโดยไม่ต้องคิด "สี่หัว ทุกวันอีเซล ซื้อแบบนี้มายี่สิบปีแล้ว" นางหยิบใส่ตะกร้าให้เอง เลือกหัวที่เปลือกแห้ง

        ตั้งแต่วันนั้นแผงไหนที่{name}ไปยืนนิ่งเกินสามอึดใจ คนขายจะบอกเองว่าครั้งก่อนซื้ออะไรไป ทั้งตลาดจำแทนให้ โดยไม่มีใครนัดกัน
      effects: { flags: [market_remembers] }
    - id: tie_knots
      label: กลับบ้านไปก่อน แล้วเริ่มผูกปมเชือกที่ข้อมือ ปมละหนึ่งอย่าง
      habit: craft_hands
      text: |
        อย่างที่สามมาตอนเดินถึงหน้าบ้านพอดี หัวหอม {name}ไม่ได้เดินกลับไป กินซุปไม่ใส่หอมไปหนึ่งคืน

        เช้าวันต่อมา{name}ตัดเชือกป่านยาวหนึ่งศอกผูกข้อมือ จะซื้อกี่อย่างก็ผูกเท่านั้นปม ซื้อแล้วแก้ออกทีละปม บางวันกลับถึงบ้านแล้วยังเหลืออยู่หนึ่งปม และไม่รู้ว่าปมนั้นคืออะไร แต่อย่างน้อยก็รู้ว่าลืม
      effects: { flags: [ties_knots] }
    - id: bluff
      label: ชี้กะหล่ำปลีหัวใหญ่ที่สุด ทำเหมือนตั้งใจมาซื้อ
      text: |
        กะหล่ำปลีหัวนั้นราคาหนึ่งเหรียญ หนักจนตะกร้าเอียง {name}หิ้วกลับบ้านอย่างคนที่ได้ของตามต้องการ

        ในตู้กับข้าวมีกะหล่ำปลีอยู่แล้วสามหัว จากวันตลาดสามครั้งก่อนหน้า หัวที่เก่าที่สุดเริ่มเหลือง
      effects: { gold: -1, flags: [four_cabbages] }

- id: elder.aging_last_long_walk
  stage: elder
  scene: road
  weight: 12
  when:
    age: [68, 88]
    not_traits: [wound_limp]
  text: |
    นอกถิ่นออกไปครึ่งวันเดินมีเนินหินอยู่เนินหนึ่ง คนแถวนี้เอาหินไปวางให้คนของตัวเองที่ตายไปแล้ว ปีละก้อน ทุกสิ้นหน้าเกี่ยว {name}เดินไปวางมาทุกปีตั้งแต่ก้อนแรก ตอนนี้หินที่ต้องถือไปมีมากกว่าหนึ่งก้อนแล้ว

    ปีนี้หมอห้าม เพื่อนบ้านห้าม คนขายขนมปังที่ไม่เคยยุ่งเรื่องใครก็ยังห้าม ทางขึ้นเนินช่วงสุดท้ายเป็นหินร่วน ปีก่อน{name}ใช้เวลาขึ้นช่วงนั้นนานเท่ากับเดินมาทั้งทาง

    หินของปีนี้เลือกไว้แล้ว วางอยู่บนขอบหน้าต่างตั้งแต่ต้นเดือน
  choices:
    - id: walk_it
      label: ออกเดินตั้งแต่ฟ้ายังไม่สาง
      habit: stubborn
      check: { stat: CON, dc: 12 }
      success:
        text: |
          ถึงตีนเนินตอนตะวันตรงหัว ช้ากว่าปีก่อนสองชั่วยาม ช่วงหินร่วน{name}ขึ้นด้วยมือกับเข่า หินในถุงเสื้อเคาะกันทุกก้าว

          บนยอดเนิน หินที่{name}เคยวางไว้ปนอยู่กับของคนอื่นจนแยกไม่ออกแล้วว่าก้อนไหน {name}วางก้อนของปีนี้ลงบนสุด นั่งอยู่จนลมเย็น กว่าจะกลับถึงบ้านก็มืด ขาสองข้างใช้ไม่ได้ไปสามวัน
        effects: { mark: "เดินถึงเนินหินด้วยขาตัวเอง", hp: -2, flags: [walked_to_the_cairn] }
      failure:
        text: |
          ขาขึ้นไม่มีอะไร หินวางลงบนยอดเนินแล้วเรียบร้อย ขาลงตรงช่วงหินร่วน ส้นเท้าไถลไปพร้อมกับหินทั้งแถบ

          คนขับเกวียนเกลือมาเจอ{name}นอนอยู่ตีนเนินตอนบ่ายคล้อย ขาขวาบิดผิดทาง หมอกระดูกดามให้คืนนั้น แต่กระดูกของคนอายุเท่านี้ไม่ต่อกันตรงอย่างของเด็ก ตั้งแต่นั้น{name}เดินได้ด้วยไม้เท้ากับขาที่สั้นกว่าอีกข้างหนึ่งนิ้ว
        effects: { hp: -4, traits: [wound_limp], flags: [walked_to_the_cairn] }
    - id: hire_cart
      label: จ่ายสองเหรียญ จ้างเกวียนไปส่งถึงตีนเนิน
      requires: { min_gold: 2 }
      text: |
        คนขับเกวียนรอที่ตีนเนิน ช่วงหินร่วนเขาเดินตามหลังขึ้นมาเองโดยไม่ได้ถูกขอ มือกางรออยู่ข้างหลังตลอดทาง ไม่ได้แตะตัวสักครั้ง

        {name}วางหิน นั่งพัก แล้วลงมา คนขับเกวียนหยิบหินจากข้างทางขึ้นมาก้อนหนึ่ง เดินกลับขึ้นไปวางของตัวเองบ้าง เขาไม่ได้บอกว่าวางให้ใคร และไม่ได้คิดค่ารอ
      effects: { mark: "นั่งเกวียนไปเนินหิน", gold: -2, flags: [rode_to_the_cairn] }
    - id: stone_at_the_door
      label: วางหินก้อนนั้นไว้ที่ธรณีประตูบ้านตัวเองแทน
      text: |
        {name}วางหินลงข้างธรณีประตู ตรงที่ไม่มีใครเตะ แล้วบอกชื่อคนที่หินก้อนนี้เป็นของเขาออกมาดังๆ ครั้งหนึ่ง เหมือนที่เคยบอกบนเนิน

        สิ้นหน้าเกี่ยวปีถัดมา มีหินอีกก้อนมาวางอยู่ข้างกัน เล็กกว่า สีเข้มกว่า {name}ถามทั้งละแวกแล้วไม่มีใครรับว่าเป็นคนวาง
      effects: { mark: "วางหินของปีนี้ไว้ที่ธรณีประตู", flags: [stone_at_the_door] }

- id: elder.aging_give_away
  stage: elder
  scene: home
  weight: 12
  cast:
    kid: { kin: [child], min_age: 16, optional: true }
  when:
    age: [70, 92]
  text: |
    หีบใต้เตียงของ{name}ไม่ได้เปิดมาหลายปี เช้านี้เปิดเพราะจะหาผ้าห่มผืนหนา แล้วก็นั่งอยู่หน้าหีบจนสาย

    ข้างในเป็นของที่เก็บไว้เพราะคิดว่าวันหนึ่งจะได้ใช้ รองเท้าหนังคู่ที่ยังเดินได้อีกหลายหน้าหนาว มีดพับด้ามเขาสัตว์ เสื้อคลุมขนสัตว์ที่ใส่ครั้งสุดท้ายเมื่อไรจำไม่ได้ เข็มขัดเส้นที่รัดถึงรูสุดท้ายแล้วก็ยังหลวมไปสองนิ้วสำหรับเอวตอนนี้

    ของทุกชิ้นยังดี ดีกว่าหัวเข่าของเจ้าของหีบ
  choices:
    - id: to_the_child
      label: "เรียก{kid}มาเลือกเอาไปก่อน"
      requires: { cast: [kid] }
      text: |
        {kid}ลองสวมรองเท้า หลวมไปนิด {kid:เขา|เธอ}บอกว่าใส่ถุงเท้าสองชั้นก็พอดี แล้วหยิบมีดพับขึ้นมาถามว่าเล่มนี้ได้มาจากไหน

        เรื่องยาวกว่าที่{name}คิด เล่าไปได้ครึ่งเดียวก็ถึงมื้อเย็น {kid}บอกว่าพรุ่งนี้จะมาฟังต่อ แล้วก็มาจริง
      effects:
        mark: "ยกของในหีบให้{kid}"
        flags: [gave_things_away]
        people: [{ id: "@kid", closeness: 1 }]
    - id: to_the_temple
      label: หอบทั้งหีบไปให้เด็กกำพร้าที่วิหารอีเซล
      habit: soft_heart
      text: |
        แม่ชีรับของไปทีละชิ้น ไม่ได้ถามว่าทำไมถึงเอามาให้ตอนนี้ เด็กกำพร้าคนที่ตัวโตที่สุดได้เสื้อคลุมขนสัตว์ ชายลากพื้น แขนต้องพับสามทบ

        ตลอดหน้าหนาว{name}เห็นเสื้อคลุมตัวนั้นเดินผ่านหน้าบ้านทุกเช้า พอถึงใบไม้ผลิ แขนเสื้อเหลือพับอยู่สองทบ
      effects: { mark: "ยกหีบให้เด็กที่วิหารอีเซล", alignment: { moral: 1 }, flags: [gave_things_away] }
    - id: pawn
      label: แบกไปร้านรับจำนำ ได้เท่าไรก็เท่านั้น
      habit: tight_fist
      text: |
        คนรับจำนำพลิกดูรองเท้า ดมเสื้อคลุม เปิดมีดพับออกแล้วพับเก็บ ตีราคาทั้งหีบสามเหรียญ บอกว่าของคนแก่ขายยาก คนซื้อกลัวติดโชค

        {name}ต่อได้อีกครึ่งเหรียญเป็นเศษทองแดง ขากลับเดินตัวเบา หีบเปล่าเอาไว้ใส่ผ้าห่ม
      effects: { mark: "จำนำของทั้งหีบ", gold: 3, flags: [pawned_the_chest] }
    - id: shut_the_lid
      label: หยิบแต่ผ้าห่ม แล้วปิดฝาหีบ
      habit: stubborn
      text: |
        {name}ดันหีบกลับเข้าใต้เตียงด้วยเท้า เข้าไปได้ครึ่งเดียวก็ติด ต้องก้มลงใช้มือดันอีกแรง

        รองเท้าคู่นั้นยังอยู่ใต้เตียง ขัดน้ำมันไว้แล้วด้วย เผื่อวันที่ต้องเดินไกล
      effects: { flags: [kept_the_chest] }
