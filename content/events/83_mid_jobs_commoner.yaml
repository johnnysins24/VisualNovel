# ชุด 3b–3c วัยผู้ใหญ่ อายุ 25 ถึง 40: เหตุการณ์ประจำงานชาวบ้าน งานละ 2 เรื่อง
# เรื่องแรก (25–32) ชื่อเสียงและหนี้ เรื่องที่สอง (33–40) ฟ้าที่เปลี่ยนไป: ดาวเพิ่ม น้ำค้างดาวราคาตก ร่างกายเริ่มไม่ฟัง
# งานชาวบ้านไม่มีพลังพิเศษ ปัญหาคือเงิน นาย และร่างกาย น้ำหนัก 45 ไม่ผูกปี เรื่องย้อน 3a อยู่ในตัวเลือกที่ต้องมี flag
# ตายได้จุดเดียว: คนงานเหมืองเอาหลังรับคาน (CON 10) label บอกชัดว่าเสี่ยงถึงชีวิต
# ฝันร่วมของคนงานโรงกลั่นเขียนจากสายตาคนเฝ้าเข็มหม้อ ไม่บอกว่า {name} ฝันหรือไม่ฝัน
# เปลี่ยนงานกลางทาง (26–31 น้ำหนัก 15) อยู่ท้ายไฟล์ ใช้ path_commoner

- id: adult.mid_farmer_foreman
  stage: adult
  weight: 45
  when:
    age: [25, 32]
    flags: [job_farmer]
  text: |
    เจ้าของที่ล้มลงกลางลานบ้านตอนต้นฤดูไถ ลุกขึ้นมาอีกทีครึ่งตัวซีกซ้ายก็ไม่ฟังแล้ว ตั้งแต่นั้นออสรินนั่งหัวโต๊ะแทนพ่อ เขาไม่ขี่ม้าไปลานนวดเองเหมือนเมื่อก่อน คนเช่านาทั้งสิบเอ็ดแปลงต้องเดินมาหาเขาที่บ้านใหญ่ทีละคน

    พอถึงตา{name} ออสรินไม่พูดเรื่องค่าเช่า เขายกตาชั่งเหล็กของพ่อขึ้นวางบนโต๊ะ ตาชั่งตัวที่ชั่งส่วนแบ่งของถิ่นนี้มาสามสิบปี แล้วบอกว่าต้องการคนเดินเก็บส่วนแบ่งแทนเขาทุกลาน คนที่คนเช่านายังยอมเปิดประตูให้ ค่าจ้างคือข้าวหนึ่งกระสอบจากทุกสิบกระสอบที่เก็บได้ กับนาแปลงหัวน้ำที่ไม่ต้องเสียค่าเช่าอีก

    จานตาชั่งข้างซ้ายต่ำกว่าข้างขวานิดเดียว ต่ำเท่าข้าวสองเมล็ด คนเช่านาทุกแปลงรู้เรื่องนี้มาตั้งแต่รุ่นพ่อ แต่ยังไม่เคยมีใครได้จับตาชั่งตัวนี้ด้วยมือตัวเอง
  choices:
    - id: take_the_scales
      label: รับตาชั่ง ชั่งตามที่ออสรินสั่ง
      text: |
        {name}แบกตาชั่งไปทีละลาน ชั่งทีละกระสอบ ขานตัวเลขให้คนแบกของออสรินจด คนเช่านาบางคนยืนดูจานข้างซ้าย บางคนไม่ดู ไม่มีใครเถียง เพราะคนที่ขานตัวเลขเป็นคนที่เคยเกี่ยวข้าวข้างกันมา

        สิ้นฤดู{name}ได้ข้าวส่วนตัวมากพอขายได้สี่เหรียญ วันที่แบกตาชั่งกลับไปคืนบ้านใหญ่ มีเด็กคนหนึ่งยืนอยู่หน้าบ้านคนเช่านาแปลงบน เด็กคนนั้นถ่มน้ำลายลงบนฝุ่นตรงที่{name}เพิ่งเดินผ่าน
      effects: { gold: 4, alignment: { law: 1, moral: -1 }, flags: [farm_foreman] }
    - id: refuse_the_scales
      label: เลื่อนตาชั่งคืนไป บอกว่ามือนี้ถือได้แต่เคียว
      text: |
        ออสรินไม่ตื๊อ เขายกตาชั่งกลับไปวางที่เดิมแล้วเรียกคนถัดไป ฤดูนั้นคนเช่านาแปลงบนรับตาชั่งไปถือแทน นาแปลงหัวน้ำตกเป็นของเขา ค่าเช่าของ{name}ยังเป็นหนึ่งในสามเหมือนทุกปี

        {name}ไถนาแปลงเดิมจนดินแตกเป็นก้อนเท่ากำปั้น ตอนพักเที่ยงนั่งกินข้าวบนตอไม้หัวคันนา ฟังเสียงโซ่ตาชั่งกระทบกันที่ลอยมาตามลมจากลานข้างๆ
      effects: { stats: { CON: 1 }, flags: [refused_foreman] }
    - id: true_scales
      label: รับตาชั่ง แล้วหาทางให้มันชั่งตรงโดยออสรินไม่รู้
      check: { stat: INT, dc: 13 }
      success:
        text: |
          คืนแรก{name}ถอดจานตาชั่งออกมาดูใต้ตะเกียง โซ่ข้างซ้ายสั้นกว่าข้างขวาหนึ่งข้อ มีคนตัดออกไปนานแล้ว รอยตัดขึ้นสนิมจนกลืนไปกับข้ออื่น {name}เอาลวดเหล็กมาดัดเป็นข้อใหม่ ทาเขม่าให้ดำเท่ากัน จานสองข้างจึงเสมอกันเป็นครั้งแรกในสามสิบปี

          ตัวเลขสิ้นฤดูต่ำกว่าปีก่อนสิบสองกระสอบ ออสรินถาม {name}ชี้ไปที่นาแปลงที่หนอนกอลงหนักที่สุด แล้วไล่ชื่อแปลงที่น้ำไม่ถึงให้ฟังทีละแปลง เขาจดตามแล้วไม่ถามอีก
        effects: { stats: { INT: 1 }, flags: [farm_foreman, honest_scales] }
      failure:
        text: |
          {name}ตะไบจานข้างขวาให้บางลงทีละนิดทุกคืน ฤดูนั้นตาชั่งเกือบตรง แต่ปลายฤดู ออสรินยกกระสอบที่ชั่งแล้วกระสอบหนึ่งไปชั่งซ้ำกับตาชั่งไม้ในโรงสี ตัวเลขไม่ตรงกับที่เขาจำได้จากรุ่นพ่อ

          เขาเอาตาชั่งคืน หักค่าข้าวที่ขาดไปจากส่วนของ{name}สองเหรียญ แล้วสั่งคนแบกว่าปีหน้าให้ชั่งนาของ{name}ก่อนแปลงอื่น ด้วยตาชั่งตัวเดิมที่เปลี่ยนจานใหม่แล้ว
        effects: { gold: -2, flags: [landlord_distrusts] }
    - id: let_renters_choose
      label: ขอให้คนเช่านาทั้งสิบเอ็ดแปลงเลือกเองว่าจะให้ใครถือตาชั่ง
      requires: { flag: renters_stood_together }
      text: |
        ออสรินยังจำเช้าที่คนเช่านาสิบเอ็ดคนไปยืนถือกระบุงหน้าบ้านพ่อได้ เขายอมให้เลือก คนเช่านานัดกันใต้ต้นมะขามหัวหมู่บ้าน เลือกด้วยข้าวเปลือกคนละเมล็ดหย่อนลงกระบุง กระบุงของ{name}ได้สิบเมล็ด อีกเมล็ดหนึ่งเป็นของ{name}เอง หย่อนลงกระบุงของคนแปลงบน

        คนเช่านาขอข้อเดียว ตาชั่งต้องต่อโซ่ให้จานเสมอกันต่อหน้าทุกคน แล้วตั้งไว้ใต้ต้นมะขาม ใครจะชั่งซ้ำก็ได้ทุกเมื่อ ฤดูแรก{name}ได้ข้าวส่วนตัวพอขายสองเหรียญ ตาชั่งตั้งอยู่ใต้ต้นมะขามมาตั้งแต่นั้น เด็กในหมู่บ้านเอาก้อนกรวดมาชั่งเล่นกันทุกเย็น
      effects: { gold: 2, alignment: { moral: 1 }, flags: [farm_foreman, renters_man] }

- id: adult.mid_farmer_back
  stage: adult
  weight: 45
  when:
    age: [33, 40]
    flags: [job_farmer]
  text: |
    หน้าเกี่ยวปีนั้น หลังของ{name}ฟ้องก่อนข้าวจะสุกเต็มแปลง ก้มเกี่ยวได้สามกอต้องยืดตัวหนึ่งครั้ง ตอนเช้าต้องพลิกตัวคว่ำแล้วดันตัวขึ้นจากเสื่อทีละข้อ นาที่เคยเกี่ยวจบในห้าวัน วันที่หกยังเหลือครึ่งแปลง ขอบฟ้าทางใต้มีเมฆฝนตั้งเค้าทุกบ่าย

    เช้าวันที่เจ็ด มีเด็กผู้ชายนอนขดอยู่ในกองฟางท้ายนา อายุราวสิบสาม เท้าเปล่า ใส่เสื้อคนงานโรงกลั่นตัวใหญ่จนแขนเสื้อต้องพับสามทบ หลังมือซ้ายมีแผ่นใสขนาดเท่าเหรียญ ข้างใต้มีแสงฟ้าเต้นเบาๆ เหมือนหัวใจของสัตว์ตัวเล็กๆ

    เด็กตื่นมาเห็น{name}แล้วไม่วิ่ง บอกว่าชื่อโครี เดินมาจากเวนทราสสิบเอ็ดคืน กลางคืนในเมืองไม่เคยมืด เขาอยากหาที่ที่ยังมืดพอให้หลับ แต่ฟ้าเหนือทุ่งตรงนี้ดาวก็เยอะจนเขานอนนับไม่หมดเหมือนกัน
  choices:
    - id: take_him_in
      label: ให้โครีอยู่ช่วยเกี่ยว แลกกับข้าวและที่นอน
      text: |
        โครีเกี่ยวข้าวไม่เป็น แต่มือไว ครึ่งวันก็จับจังหวะเคียวได้ เขาเกี่ยวด้วยมือขวา มือซ้ายพันผ้าไว้ตลอด คนนาแปลงข้างๆ เปลี่ยนไปเดินคันนาอีกฝั่ง ไม่ยอมเดินผ่านใกล้ ข้าวกำสุดท้ายขึ้นลานนวดก่อนฝนแรกครึ่งวัน

        คืนนั้นโครีนอนบนแคร่หน้ากระท่อม ซุกมือซ้ายไว้ใต้ท้องไม่ให้แสงฟ้าลอดออกมาเข้าตาตัวเอง {name}นั่งดูฟ้าเหนือทุ่งอยู่ข้างเขา ตอน{name}อายุเท่าเขา ฟ้าตรงนี้ยังมีช่องมืดให้เด็กนอนนับดาวจนหลับได้
      effects: { alignment: { moral: 1 }, flags: [took_glass_kid] }
    - id: send_him_on
      label: ให้ข้าวห่อหนึ่ง แล้วชี้ทางไปหมู่บ้านถัดไป
      text: |
        โครีรับห่อข้าวด้วยมือขวา ขอบใจ แล้วเดินไปตามคันนาทางที่{name}ชี้ เดินช้าๆ ไม่หันกลับมา มือซ้ายซุกอยู่ในแขนเสื้อที่พับสามทบ

        {name}เกี่ยวต่อคนเดียวจนฝนมา ข้าวแปลงท้ายจมน้ำไปเกือบครึ่ง เย็นวันนั้นหลังเจ็บจนต้องนอนตะแคง ฟังเสียงฝนตกลงบนข้าวที่ยังไม่ได้เกี่ยว
      effects: { hp: -1, alignment: { moral: -1 } }
    - id: work_through
      label: เอาผ้ารัดเอวให้แน่น เกี่ยวต่อคนเดียวให้ทันฝน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ให้โครีกินข้าวแล้วไล่ไปนอนในกระท่อม ส่วนตัวเองเอาผ้าคาดเอวพันสองรอบ เกี่ยวตั้งแต่ก่อนสว่างจนมองไม่เห็นรวงข้าวในมือ หลังร้องทุกครั้งที่ก้ม {name}ก็ก้มลงไปอีกทุกครั้ง

          ข้าวกำสุดท้ายขึ้นลานตอนฝนเม็ดแรกตกลงบนหลังมือ โครีหายไปตั้งแต่เช้าวันนั้น ทิ้งห่อข้าวที่กินเหลือครึ่งห่อไว้บนแคร่ ผูกปากห่อไว้อย่างดีเหมือนคนคืนของ
        effects: { stats: { CON: 1 } }
      failure:
        text: |
          บ่ายวันที่สอง {name}ก้มลงเกี่ยวกอหนึ่ง แล้วยืดตัวขึ้นไม่ได้อีก กระดูกโคนหลังเคลื่อน ดังกึกอยู่ข้างในเหมือนกิ่งไม้แห้งหัก {name}คุกเข่าอยู่กลางนาจนโครีวิ่งมาพยุงกลับกระท่อม

          ข้าวที่เหลือ โครีเกี่ยวคนเดียวทั้งคืนจนเสร็จ แล้วจากไปตอนเช้า ตั้งแต่ปีนั้น{name}ยกกระสอบข้าวคนเดียวไม่ได้อีก ต้องใช้คานหามสองคนทุกครั้ง
        effects: { hp: -3, flags: [farmer_bad_back] }
    - id: feed_him_first
      label: หุงข้าวให้โครีกินจนอิ่มก่อนจะถามอะไรทั้งนั้น
      requires: { flag: farm_hungry_winter }
      text: |
        หน้าหนาวปีที่{name}กินข้าวต้มวันละมื้อยังอยู่ในท้อง ไม่ได้อยู่ในหัว {name}หุงข้าวสวยเต็มหม้อ ไม่ใส่ผักให้ข้น ตักให้โครีจนเขาวางช้อนเอง เขากินสามจาน จานที่สามกินช้าๆ เหมือนกลัวมันจะหมด

        เช้าวันต่อมาเขาตื่นก่อน{name} ลงนาไปเกี่ยวโดยไม่มีใครบอก สามวันข้าวขึ้นลานหมด หลังของ{name}ได้พักจนลุกจากเสื่อได้โดยไม่ต้องพลิกตัวคว่ำ โครีอยู่ต่อจนถึงหน้าไถ แล้วอยู่ต่ออีกหน้า
      effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [took_glass_kid] }

- id: adult.mid_refinery_shift
  stage: adult
  weight: 45
  scene: refinery
  when:
    age: [25, 32]
    flags: [job_refinery_hand]
  text: |
    เมอร์ดอนได้ขึ้นไปคุมโรงกลั่นทั้งแถวริมแม่น้ำ ก่อนย้าย เขาฝากกะดึกของโรงเดิมไว้กับ{name} พร้อมพวงกุญแจลิ้นท่อ กับสมุดบัญชีกะปกหนังสีดำ กะนี้มีคนงานยี่สิบเอ็ดคน หม้อกลั่นสิบหกใบ หัวหน้ากะได้ค่าแรงมากกว่าคนงานคืนละครึ่งเหรียญ

    ท้ายสมุดมีหน้าหนึ่งที่สมาคมโรงกลั่นพิมพ์มาให้ หัวกระดาษเขียนว่า คนงานผิวแก้ว ข้างล่างเป็นช่องว่างให้เขียนชื่อ หัวหน้ากะเขียนลงไปหนึ่งชื่อ สมาคมจ่ายห้าเหรียญ คนที่มีชื่อในหน้านั้นจะเดินออกจากโรงตอนหมดกะ แล้วไม่ได้กลับเข้ามาอีก สมาคมบอกว่าทำเพื่อคนงานคนอื่น

    คืนที่สามของการคุมกะ {name}เห็นยอสซิลพันผ้ารอบข้อมือซ้ายแน่นกว่าทุกคืน เขาเฝ้าหม้อเบอร์เก้ามาสิบสองปี มีลูกสี่คน คนโตอายุสิบสาม ตรงที่ผ้าพันทับกันหลายชั้น มีแสงฟ้าจางๆ ซึมออกมาตามร่องเส้นด้าย
  choices:
    - id: write_his_name
      label: เขียนชื่อยอสซิลลงหน้านั้น
      text: |
        {name}เขียนชื่อเขาด้วยตัวหนังสือที่ตั้งใจให้อ่านง่าย ตอนหมดกะ ยอสซิลยืนรออยู่หน้าประตูโรงกับคนของสมาคมสองคน เขาไม่เถียง เขาแก้ผ้าที่ข้อมือออก พับเป็นสี่เหลี่ยม แล้ววางลงบนสมุดบัญชีตรงหน้า{name}ก่อนเดินออกไป

        เช้านั้นสมาคมจ่ายห้าเหรียญ คืนต่อมาหม้อเบอร์เก้ามีคนเฝ้าคนใหม่ เด็กผู้ชายที่บอกคนของสมาคมว่าอายุสิบสี่ หน้าตาเหมือนยอสซิลทุกส่วน คนงานในกะเรียกเด็กคนนั้นว่าเบอร์เก้า ยังไม่มีใครถามชื่อ
      effects: { gold: 5, alignment: { moral: -2 }, reputation: { distillers: 1 }, flags: [reported_glass_worker] }
    - id: hide_him
      label: ย้ายยอสซิลไปเฝ้าหม้อมุมมืด ไกลจากทางเดินของคนตรวจ
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          คนตรวจของสมาคมเข้าโรงสัปดาห์ละสองครั้ง เดินทางเดิมทุกครั้งตามแถวตะเกียงที่แขวนไว้ {name}สลับให้ยอสซิลไปเฝ้าหม้อเบอร์สิบหก ใบสุดท้ายในมุมที่ตะเกียงดับไปดวงหนึ่ง แล้วจดบัญชีกะให้เบอร์เก้ามีคนเฝ้าครบทุกคืน ลายมือในบัญชีเรียบจนคนตรวจพลิกผ่านโดยไม่หยุด

          ยอสซิลทำงานต่อได้อีกสามปี ก่อนแผ่นใสจะลามขึ้นมาถึงคอ ตอนนั้นลูกคนโตของเขาได้เป็นลูกมือช่างหลอมในโรงหล่อ ไม่ต้องเข้าโรงกลั่น
        effects: { stats: { DEX: 1 }, alignment: { law: -1, moral: 1 }, flags: [hid_glass_worker] }
      failure:
        text: |
          คืนที่คนตรวจเปลี่ยนทางเดิน เขาตรงไปที่มุมโรงที่ตะเกียงดับ เหมือนรู้ว่าจะเจออะไร ยอสซิลยืนอยู่หน้าหม้อเบอร์สิบหก มือซ้ายพันผ้า คนตรวจไม่ต้องแกะผ้าดู ในที่มืด แสงลอดเส้นด้ายออกมาเอง

          ชื่อยอสซิลลงไปอยู่ในหน้านั้นด้วยลายมือของคนตรวจ สมาคมหักค่าแรง{name}สามเหรียญเป็นค่าจดบัญชีไม่ตรง ตั้งแต่คืนนั้น คนตรวจมาเปิดสมุดบัญชีกะของ{name}ทุกคืน ไม่ใช่สัปดาห์ละสองครั้ง
        effects: { gold: -3, reputation: { distillers: -1 }, flags: [guild_watches_shift] }
    - id: tell_him
      label: เปิดหน้านั้นให้ยอสซิลดู แล้วถามว่าเขาจะเอาอย่างไร
      text: |
        ยอสซิลอ่านหัวกระดาษช้าๆ เขาอ่านหนังสือไม่คล่อง อ่านจบแล้วขอเวลาหนึ่งเดือน ลูกคนโตของเขาจะอายุครบสิบสี่ปลายเดือนนี้ พอดีกับเกณฑ์ที่สมาคมรับเด็กเข้ากะ เขาอยากสอนลูกเฝ้าหม้อเบอร์เก้าด้วยมือตัวเองก่อน

        เดือนนั้นแผ่นใสลามจากข้อมือขึ้นไปถึงข้อศอก คืนสุดท้ายของเดือน ยอสซิลขอปากกาจาก{name} เขียนชื่อตัวเองลงในหน้านั้น ตัวหนังสือโย้ไปทางขวาทุกตัว เงินที่สมาคมจ่ายตามหน้านั้น{name}ห่อผ้าใส่มือเขาให้ถือกลับบ้านทั้งห่อ
      effects: { alignment: { moral: 1, law: 1 }, flags: [yossil_wrote_his_name] }
    - id: show_own_glass
      label: ถกแขนเสื้อ ให้ยอสซิลดูจุดแก้วเจ็ดจุดบนแขนของตัวเอง
      requires: { flag: glass_spot_adult }
      text: |
        จุดใสเจ็ดจุดบนแขนซ้ายของ{name}ยังอยู่ที่เดิมตั้งแต่คืนที่หม้อเบอร์สิบสี่ร้าว ไม่ลาม ไม่หาย ยอสซิลดูแขน{name} แล้วดูข้อมือตัวเอง ของเขาลามเร็วกว่าและเป็นแผ่นกว้างกว่า แต่เป็นแสงสีเดียวกัน

        {name}ปิดสมุดบัญชีกะ วางมือทับปกหนังสีดำ บอกเขาว่าหน้านั้นมีช่องให้เขียนชื่อคนงาน ไม่มีช่องให้เขียนชื่อหัวหน้ากะ เพราะหัวหน้ากะเป็นคนถือปากกา คืนต่อๆ มา ทั้งสองคนพันผ้าที่แขนคนละข้าง เฝ้าหม้อของตัวเองจนหมดกะ
      effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [showed_own_glass] }

- id: adult.mid_refinery_dream
  stage: adult
  weight: 45
  scene: refinery
  when:
    age: [33, 40]
    flags: [job_refinery_hand]
  text: |
    กลางกะดึกมีหนึ่งชั่วโมงที่หม้อกลั่นทุกใบต้มเองได้โดยไม่ต้องเติม คนงานผลัดกันเอนหลังบนกระสอบเปล่าข้างผนัง ส่วน{name}นั่งเฝ้าเข็มหม้อตามเวรของคนงานรุ่นเก่า นั่งมาหลายปีจนรู้ว่าเข็มของหม้อแต่ละใบสั่นไม่เหมือนกัน

    คืนนั้นเข็มหม้อเบอร์หกเพิ่งขยับผ่านขีดที่สาม คนงานสิบเก้าคนบนกระสอบลุกขึ้นพร้อมกันทุกคน ไม่มีเสียงใครเรียก ตายังปิดอยู่ทุกคู่ ทุกคนเดินไปที่ผนังด้านตะวันออก ผนังที่ไม่มีหน้าต่าง แล้วยืนเรียงหน้ากระดานหันหน้าเข้าหาอิฐ ปลายเท้าห่างผนังเท่ากันทุกคน คางเงยขึ้นนิดเดียว เหมือนคนที่ได้ยินเสียงจากที่สูง

    คนเดียวที่ยังนอนอยู่คือโอลเบน เด็กใหม่อายุสิบสี่ที่เพิ่งเข้ากะเป็นคืนที่สี่ เขาบิดตัวอยู่บนกระสอบ เข่าเริ่มเกร็ง มือข้างหนึ่งยันพื้นเหมือนจะลุก ประตูโรงลงกลอนจากข้างนอก อีกสองชั่วโมงถึงหมดกะ
  choices:
    - id: break_the_door
      label: เอาชะแลงงัดประตูโรง พาทุกคนออกไปรับลมข้างนอก
      check: { stat: STR, dc: 13 }
      success:
        text: |
          สมาคมย้ายบานพับประตูทุกโรงออกไปไว้ข้างนอกนานแล้ว {name}จึงงัดที่ตัวกลอนตรงร่องกลางบาน งัดจนไม้รอบกลอนแตกเป็นเสี้ยน ประตูเปิดออก ลมแม่น้ำตอนตีสามพัดเข้ามาเย็นจัด {name}แบกโอลเบนขึ้นบ่าออกไปเป็นคนแรก

          คนงานที่ยืนหน้าผนังหันตามลมทีละคน แล้วเดินออกไปยืนบนลานหน้าโรง ตายังปิด คราวนี้ทุกคนเงยหน้าตรงขึ้นไปหาฟ้า ยืนอย่างนั้นจนดาวทางตะวันออกเริ่มจาง แล้วตื่นขึ้นพร้อมกัน ถามกันว่าออกมาข้างนอกทำไม โอลเบนตื่นอยู่บนบ่าของ{name} เสื้อด้านหลังชุ่มเหงื่อ ตัวเย็นเหมือนเพิ่งขึ้นจากน้ำ
        effects: { stats: { STR: 1 }, alignment: { law: -1 }, reputation: { distillers: -1 }, flags: [broke_door_at_dream] }
      failure:
        text: |
          กลอนไม่ขยับ สมาคมเปลี่ยนกลอนเป็นเหล็กหล่อทั้งแท่งตั้งแต่หลายปีก่อน {name}งัดจนฝ่ามือพอง ชะแลงลื่นหลุดจากร่องมาฟาดกระดูกหน้าแข้ง

          พอเข็มหม้อเบอร์หกเลยขีดที่ห้า คนงานทั้งสิบเก้าคนเดินกลับมานอนลงบนกระสอบที่เดิมของตัวเอง ตอนหมดกะไม่มีใครจำอะไรได้ มีแต่ปลายจมูกของทุกคนที่มีฝุ่นอิฐติดอยู่จางๆ
        effects: { hp: -2 }
    - id: log_it
      label: จดเวลา ขีดบนเข็มหม้อ และชื่อทุกคนที่ยืนหน้าผนังลงสมุดกะ
      text: |
        {name}เขียนทุกอย่างลงสมุด เข็มหม้อเบอร์หกอยู่ขีดที่สามกับอีกครึ่ง คนยืนสิบเก้าคน ชื่อเรียงจากซ้ายไปขวา คางเงยเท่ากัน ระหว่างเขียน โอลเบนลุกจากกระสอบ เดินไปยืนต่อแถวเป็นคนที่ยี่สิบ {name}เขียนชื่อเขาต่อท้าย พอเข็มเลยขีดที่ห้า ทุกคนเดินกลับมานอนที่เดิม ตอนหมดกะไม่มีใครจำได้

        ปีนั้นเรื่องแบบนี้เกิดสิบเอ็ดครั้ง {name}จดทุกครั้ง ทุกครั้งเข็มหม้อเบอร์หกอยู่ขีดเดียวกัน ขีดที่หม้อกลั่นน้ำค้างดาวออกมาเข้มที่สุดของคืน และทุกครั้งเป็นคืนฟ้าเปิด
      effects: { stats: { INT: 1 }, flags: [logged_the_dream_wall] }
    - id: hold_the_boy
      label: นั่งลงข้างโอลเบน กุมมือเขาไว้ แล้วคุยกับเขาไปเรื่อยๆ จนกว่าจะตื่น
      text: |
        มือของโอลเบนเย็นและชื้น {name}กุมไว้ทั้งสองมือ แล้วพูดเรื่องอะไรก็ได้ที่นึกออก ราคาข้าวในตลาดล่าง ชื่อหม้อทั้งสิบหกใบ แมวที่ชอบมานอนบนหลังคาโรงข้างๆ เสียงของ{name}ไม่ดังกว่าเสียงหม้อต้ม แต่ไม่หยุด

        ตาของโอลเบนเปิดขึ้นตอนเข็มหม้อเบอร์หกผ่านขีดที่สี่ เขากระซิบว่าได้ยินคนเป็นร้อยร้องเพลงเสียงเดียวกัน ไม่มีคำ มีแต่เสียงหึ่งต่ำๆ ยาวๆ เหมือนลมผ่านปากไห เขาเกือบจะลุกไปร้องด้วยแล้ว ตั้งแต่คืนนั้น โอลเบนขอนอนข้างเก้าอี้ของ{name}ทุกคืน
      effects: { alignment: { moral: 1 }, flags: [kept_kid_awake] }
    - id: close_the_line
      label: ปีนขึ้นไปปิดลิ้นท่อตัวที่ส่งไออุ่นเข้ามุมพักของคนงาน
      requires: { flag: knows_the_valves }
      text: |
        ลิ้นท่อบนเพดานมีเก้าตัว เมอร์ดอนสอนชื่อทุกตัวให้{name}ตั้งแต่คืนที่หม้อเบอร์สิบสี่ร้าว ตัวที่เจ็ดส่งไออุ่นจากหม้อเบอร์หกไปตามท่อเล็กที่วิ่งเลียบผนังด้านตะวันออก สมาคมทำไว้ให้คนงานนอนพักไม่หนาว {name}ปีนขึ้นไปหมุนตัวที่เจ็ดจนสุด

        ท่อเล็กเลียบผนังยังไม่ทันเย็น คนงานทั้งสิบเก้าคนก็ทรุดลงตรงที่ยืน หลับต่อบนพื้นอิฐเหมือนเด็กที่เล่นจนหมดแรง โอลเบนนอนนิ่งลงบนกระสอบ ตอนหมดกะทุกคนบ่นปวดหลัง สองเดือนต่อมาคนของสมาคมขึ้นมาเปิดลิ้นตัวที่เจ็ดคืน แขวนป้ายไม้ไว้ว่าห้ามแตะ
      effects: { stats: { INT: 1 }, flags: [closed_dream_line] }

- id: adult.mid_docker_gang
  stage: adult
  weight: 45
  when:
    age: [25, 32]
    flags: [job_docker]
  text: |
    ท่าเรือเวนทราสแบ่งคนแบกของเป็นแถว แถวละยี่สิบคน แต่ละแถวมีหัวแถวหนึ่งคน รับงานจากเจ้าของเรือ แบ่งค่าแรงให้คนในแถว และเป็นคนที่เจ้าของเรือด่าเมื่อของตกน้ำ ปีนั้นหัวแถวที่สามขาหักเพราะลังเกลือล้มทับ คนในแถวยกให้{name}ขึ้นแทน

    สัปดาห์ที่สองของการเป็นหัวแถว มีชายคนหนึ่งนั่งรอ{name}อยู่ในโรงข้าวต้มท้ายท่า เขาไม่ต้องบอกว่ามาจากไหน คนท่าเรือรู้จักคนของหนูท่าจากรองเท้า รองเท้าหนังที่ไม่เคยเปียกน้ำทะเล เขาบอกว่าหนูท่ามีลังเข้าท่าทุกคืนเดือนดับ ลังไม่มีตราภาษี ต้องขนจากเรือเล็กขึ้นโกดังให้เสร็จก่อนยามด่านเปลี่ยนเวร แถวที่รับงาน หัวแถวได้หกเหรียญต่อเดือน คนในแถวได้คนละเหรียญ

    ก่อนลุกไป เขาบอกว่าหัวแถวคนเก่าเคยปฏิเสธงานนี้ แล้วจ่ายค่าข้าวต้มของ{name}ให้ทั้งชาม
  choices:
    - id: take_the_crates
      label: รับงานกลางคืนของหนูท่า
      text: |
        ทุกคืนเดือนดับ แถวของ{name}ขนลังไม่มีตราจากเรือเล็กขึ้นโกดังสิบสอง ลังหนักไม่เท่ากัน บางลังมีเสียงแก้วกระทบกันข้างใน {name}สั่งคนในแถวไม่ให้ใครเขย่า ไม่ให้ใครถาม ยามด่านเดินผ่านปลายท่าตรงเวลาทุกคืน ไม่เคยหันมาทางโกดังสิบสองสักครั้ง

        สิ้นเดือนแรก คนรองเท้าแห้งเอาเงินมาวางบนโต๊ะในโรงข้าวต้ม ส่วนของหัวแถวหกเหรียญ ส่วนของคนในแถวใส่ถุงแยกไว้คนละถุง ไม่มีถุงไหนขาด
      effects: { gold: 6, alignment: { law: -1 }, reputation: { dock_rats: 1 }, flags: [gang_works_for_rats] }
    - id: refuse_the_crates
      label: บอกเขาว่าแถวนี้แบกแต่ของที่มีตรา
      text: |
        คนรองเท้าแห้งไม่โกรธ เขาเช็ดปากด้วยผ้าเช็ดหน้าแล้วเดินออกไป สัปดาห์ต่อมาเจ้าของเรือสามรายที่เคยใช้แถวของ{name}หันไปใช้แถวอื่นโดยไม่บอกเหตุผล แถวของ{name}เหลืองานเดียวที่ไม่มีใครแย่ง คือท่าเกลือปลายสุด กระสอบเกลือเปียกหนักกว่ากระสอบข้าวครึ่งหนึ่ง

        {name}แบกเองทุกเที่ยวที่คนในแถวแบกไม่ไหว หน้าหนาวปีนั้นไหล่ของ{name}หนาขึ้นจนเสื้อตัวเก่าใส่ไม่ได้ และไม่มีลังเกลือลังไหนล้มทับใคร
      effects: { stats: { STR: 1 }, reputation: { dock_rats: -1 }, flags: [refused_dock_rats] }
    - id: bargain
      label: รับงาน แต่ต่อราคาให้คนในแถวได้ส่วนมากกว่านี้
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}นับให้เขาฟังบนโต๊ะในโรงข้าวต้ม คืนเดือนดับคืนหนึ่งมีลังสี่สิบลัง คนยี่สิบคนขนเสร็จในเวลาที่ยามด่านเดินรอบเดียว ถ้าใช้คนสิบคนต้องรอยามเดินสองรอบ และยามรอบที่สองไม่ได้กินเงินหนูท่า เขาดูนิ้วของ{name}ที่เคาะโต๊ะตามตัวเลข แล้วหัวเราะสั้นๆ

          คนในแถวได้คนละสองเหรียญต่อเดือน ส่วนของหัวแถวลดเหลือสี่เหรียญ ตั้งแต่เดือนนั้น คนแบกของแถวอื่นเรียกแถวของ{name}ว่าแถวสองเหรียญ ไม่มีใครเรียกเล่นๆ
        effects: { stats: { INT: 1 }, gold: 4, alignment: { law: -1 }, reputation: { dock_rats: 1 }, flags: [gang_works_for_rats] }
      failure:
        text: |
          เขาฟังตัวเลขของ{name}จนจบ แล้วบอกว่าหนูท่าไม่ต่อราคากับคนแบกของ ไม่เอาก็มีแถวอื่น เขาลุกไปโดยไม่จ่ายค่าข้าวต้ม

          คืนต่อมามีคนเข้ามาในห้องเช่าของ{name} ไม่มีอะไรพัง ไม่มีอะไรรื้อ แต่เงินในถุงใต้ฟูกหายไปสามเหรียญ ที่เหลือไว้ในถุงพอดีค่าเช่าเดือนหน้า
        effects: { gold: -3, reputation: { dock_rats: -1 } }
    - id: let_the_gang_vote
      label: ให้คนทั้งยี่สิบคนในแถวเลือกกันเอง
      requires: { flag: docker_stood_together }
      text: |
        คนในแถวจำเช้าวันที่ไม่มีใครเดินไปหยอดเหรียญให้เบอร์ริกได้ทุกคน {name}เล่าเรื่องคนรองเท้าแห้งให้ฟังทั้งหมด รวมถึงประโยคสุดท้ายของเขาเรื่องหัวแถวคนเก่า แล้วให้ทุกคนเดินออกมาหย่อนก้อนหินลงไหสองใบหลังโรงข้าวต้มทีละคนต่อหน้ากัน ไหดำคือรับ ไหขาวคือไม่รับ

        ไหดำได้สิบสามก้อน ไหขาวได้เจ็ด {name}รับงานตามไหดำ แต่ทุกคืนเดือนดับ เจ็ดคนที่หย่อนหินลงไหขาวได้นอนบ้าน ไม่ต้องลงท่า และได้ส่วนแบ่งเท่าคนที่ลง สิ้นเดือนส่วนของหัวแถวเหลือสามเหรียญ คนในแถวเรียกตัวเองว่าแถวไหตั้งแต่นั้น
      effects: { gold: 3, alignment: { moral: 1, law: -1 }, reputation: { dock_rats: 1 }, flags: [gang_works_for_rats, gang_votes] }

- id: adult.mid_docker_crane
  stage: adult
  weight: 45
  when:
    age: [33, 40]
    flags: [job_docker]
  text: |
    เจ้าของเรือรายใหญ่ที่สุดของท่าซื้อหุ่นยามมาลงท่าสามตัวในปีเดียว ตัวสูงเท่าคนสองคนยืนต่อบ่า ไหล่กว้างเท่าประตูโกดัง กลางอกมีหลอดน้ำค้างดาวสองหลอดเรืองแสงฟ้า ดาวบนฟ้าเพิ่มขึ้นทุกปี น้ำค้างดาวก็ราคาตกลงทุกปี ตอนนี้หุ่นหนึ่งตัวกินค่าหลอดน้อยกว่าค่าแรงคนแบกสามคน ไม่ป่วย ไม่ขอขึ้นค่าแรงหน้าหนาว แถวของ{name}เหลือสิบสองคนจากยี่สิบ

    เช้าวันนั้นหุ่นตัวที่สองยกลังเหล็กขึ้นจากท้องเรือ หมุนตัวครึ่งรอบ แล้ววางลงตรงที่มันวางลังเมื่อวาน ตรงนั้นวันนี้มีดอกัลยืนผูกเชือกอยู่ เขาดึงตัวออกทัน ดึงแขนขวาออกไม่ทัน

    ตอนเย็นคนแบกรุ่นหนุ่มหกคนมานั่งรอ{name}ที่ท่าปลาย มีค้อนเหล็กด้ามยาวสองเล่มกับชะแลงหนึ่งเล่มวางอยู่บนพื้นไม้ พวกเขาบอกว่าคืนนี้หุ่นทั้งสามตัวจอดอยู่ในโกดังเจ็ด ประตูโกดังเจ็ดลงกลอนตัวเดียว
  choices:
    - id: smash_them
      label: ไปโกดังเจ็ดกับพวกเขา ทุบหลอดน้ำค้างกลางอกหุ่น
      check: { stat: STR, dc: 13, foe: machine }
      success:
        text: |
          หุ่นทั้งสามยืนนิ่งเรียงกันในความมืด แสงฟ้าจากอกส่องพื้นโกดังเป็นวงกลมสามวง {name}เหวี่ยงค้อนเข้ากลางอกตัวแรกเต็มแรง หลอดแตก น้ำค้างดาวไหลออกมาเป็นแสงเหลวกองบนพื้น แล้วค่อยๆ จางหายเหมือนน้ำค้างตอนสาย ตัวที่สองกับตัวที่สามตามไปก่อนแสงของตัวแรกบนพื้นจะจางหมด

          เจ้าของเรือสั่งหลอดใหม่จากโรงกลั่นได้ในสามวัน แต่สามวันนั้นแถวของ{name}ได้กลับมาแบกของเต็มแถว ยามด่านเดินถามหาคนทุบหุ่นทั่วท่า ไม่มีคนแบกของคนไหนจำได้ว่าคืนนั้นใครไปไหน
        effects: { stats: { STR: 1 }, alignment: { law: -1 }, flags: [smashed_dock_golem] }
      failure:
        text: |
          ค้อนเล่มแรกลงผิดที่ กระแทกแผ่นเหล็กข้างหลอด เสียงดังก้องทั้งโกดัง ช่องแสงสองช่องบนหัวหุ่นสว่างขึ้น แล้วมันทำสิ่งเดียวที่มันรู้ คือยกของที่อยู่ตรงหน้าไปวางที่เดิม ของที่อยู่ตรงหน้าคือ{name}

          มันยก{name}ขึ้นทั้งตัว วางลงบนกองลังเหล็กข้างผนัง วางแรงเท่าที่วางลังเหล็กทุกวัน ซี่โครงข้างซ้ายร้าวสองซี่ คนหนุ่มทั้งหกคนแบก{name}หนีออกทางหน้าต่างก่อนยามด่านมาถึง
        effects: { hp: -3, alignment: { law: -1 }, flags: [golem_cracked_ribs] }
    - id: learn_the_plates
      label: ไปขอเจ้าของเรือเรียนวิธีสั่งหุ่น ให้คนในแถวคุมมันเอง
      check: { stat: INT, dc: 13 }
      success:
        text: |
          หุ่นยามรับคำสั่งจากแผ่นทองเหลืองเจาะรูที่เสียบเข้าหลังคอ คนสั่งต้องเจาะแผ่นใหม่ทุกวันตามที่ที่ของจะวาง ช่างเวทที่เจ้าของเรือจ้างมาเจาะแผ่นเดียวใช้ทั้งสัปดาห์ หุ่นจึงวางของที่เดิมทุกวัน ไม่ว่าตรงนั้นจะมีอะไรอยู่ {name}ใช้เวลาสิบคืนเรียนจนอ่านรูบนแผ่นออก

          เจ้าของเรือจ่ายเพิ่มให้สี่เหรียญเป็นค่าเจาะแผ่น {name}เจาะใหม่ทุกเช้า แล้วเจาะเพิ่มอีกรูหนึ่งที่ไม่มีในแบบของช่างเวท รูที่สั่งให้หุ่นหยุดเมื่อมีอะไรอุ่นอยู่ใต้มือ
        effects: { stats: { INT: 1 }, gold: 4, flags: [golem_operator] }
      failure:
        text: |
          เจ้าของเรือฟัง{name}จบแล้วถามว่าคนแบกของอ่านหนังสือออกด้วยหรือ เขาหัวเราะ แล้วส่งหลานชายที่เพิ่งกลับจากโรงเรียนช่างไปเรียนแทน

          หลานชายเจาะแผ่นได้ดีกว่าช่างเวทคนเก่า แต่ไม่เคยลงมายืนที่ท่า หุ่นได้แผ่นคำสั่งใหม่ที่ขนของเร็วกว่าเดิม เดือนนั้นค่าแรงของ{name}หายไปสองเหรียญ
        effects: { gold: -2 }
    - id: odd_loads
      label: พาคนหนุ่มไปรับงานที่หุ่นทำไม่เป็น
      text: |
        หุ่นยกได้แต่ของที่วางนิ่งและมีขอบให้จับ {name}พาคนหนุ่มทั้งหกไปรับงานที่ไม่มีขอบ ไหแก้วของร้านน้ำหอม แพะที่ไม่ยอมลงเรือ หีบสินสอดของเจ้าสาวที่ต้องแบกขึ้นบันไดแคบสามชั้น ค่าแรงต่ำกว่าแบกลังครึ่งหนึ่ง แต่ไม่มีหุ่นตัวไหนแย่ง

        ค้อนเหล็กสองเล่มกับชะแลงยังวางอยู่ที่ท่าปลาย ฝนตกใส่จนขึ้นสนิมแดง ไม่มีใครหยิบไปใช้
      effects: { alignment: { law: 1 }, flags: [taught_young_carriers] }
    - id: someone_walks_ahead
      label: ไปหาเจ้าของเรือคนที่เคยฟังเรื่องเบอร์ริก
      requires: { flag: outfoxed_dock_boss }
      text: |
        เจ้าของเรือคนนั้นแก่ลงมาก แต่ยังจำคนแบกของที่บอกเขาว่าเรือจะเสียน้ำขึ้นรอบเย็นได้ {name}ไม่พูดเรื่องแขนของดอกัล พูดเรื่องน้ำขึ้นเหมือนครั้งก่อน หุ่นที่วางลังทับคนต้องหยุดทั้งท่าครึ่งวัน ยามด่านต้องมาจด เรือทุกลำในท่าเสียน้ำขึ้นรอบเช้าไปพร้อมกัน

        เขาจ้างคนแบกของหนึ่งคนให้เดินนำหน้าหุ่นทุกตัว ตะโกนบอกทุกครั้งที่หุ่นจะวางของ แล้วจ่ายให้{name}สองเหรียญ คนที่{name}ส่งไปเดินนำหน้าหุ่นตัวที่สองคือดอกัล แขนเสื้อข้างขวาของเขาพับเหน็บเข็มขัดไว้ เสียงของเขาดังที่สุดในท่า
      effects: { stats: { INT: 1 }, gold: 2, flags: [dogal_walks_ahead] }

- id: adult.mid_miner_layer
  stage: adult
  weight: 45
  scene: mine
  when:
    age: [25, 32]
    flags: [job_miner]
  text: |
    บริษัทเหมืองให้{name}คุมคนงานสิบสี่คนในอุโมงค์ชั้นห้า ชั้นที่ลึกที่สุดที่บริษัทยังกล้าส่งคนลง ถ่านมารที่ชั้นนี้ดำจนแสงตะเกียงส่องแล้วไม่สะท้อนกลับ ก้อนเท่ากำปั้นเผาเตาหลอมได้ครึ่งวัน ช่วงหลังคนงานชั้นนี้ทะเลาะกันบ่อยกว่าชั้นอื่น เรื่องพลั่ว เรื่องที่นั่งกินข้าว เรื่องใครหายใจดัง

    ปลายอุโมงค์ชั้นห้าชนผนังหินที่ไม่ใช่หินของภูเขา ก้อนหินตัดเป็นเหลี่ยม เรียงสนิทจนแทรกใบมีดไม่เข้า ทุกก้อนสลักตัวหนังสือแบบเก่าที่ไม่มีใครในเหมืองอ่านออก ใต้ตัวหนังสือมีรูปฝ่ามือกางห้านิ้วซ้ำกันทุกก้อน คนงานรุ่นก่อนเรียกมันว่ากำแพงมือ ไม่มีใครเอาพลั่วไปแตะ

    เช้าวันนั้นคนของบริษัทลงมาพร้อมแผนที่ชั้นหิน ชี้ว่าสายถ่านที่หนาที่สุดในเหมืองวิ่งเลียบหลังกำแพงมือ ขุดอุโมงค์อ้อมไปทางขวาสองช่วงตัวก็ถึง บริษัทจ่ายหัวหน้าคนงานหกเหรียญ ถ้าเปิดสายถ่านได้ภายในเดือนนี้
  choices:
    - id: dig_around
      label: พาคนขุดอ้อมกำแพงตามแผนที่
      text: |
        อุโมงค์อ้อมยาวสองช่วงตัวขุดเสร็จในสิบเก้าวัน หินช่วงนั้นอุ่นเหมือนผนังเตาขนมปังตอนเช้า สายถ่านที่เจอหนาเท่าคนยืน คนของบริษัทลงมาดูเอง จ่ายหกเหรียญให้{name}ต่อหน้าคนงานทั้งสิบสี่คน

        เดือนต่อมาคนงานชั้นห้าตีกันสองครั้ง ครั้งที่สองมีคนใช้พลั่ว ตอนเลิกงาน{name}เดินไปปลายอุโมงค์คนเดียว เอามือแตะรูปฝ่ามือบนก้อนที่อยู่ใกล้ช่องอ้อมที่สุด ก้อนนั้นอุ่นเท่ามือคน ก้อนอื่นยังเย็น
      effects: { gold: 6, world: { demon: 1 }, flags: [opened_deep_seam] }
    - id: refuse_the_seam
      label: บอกคนของบริษัทว่าคนชั้นห้าจะไม่ขุดตรงนั้น
      text: |
        คนของบริษัทพับแผนที่เก็บ บอกว่าเข้าใจ แล้วขึ้นไป สัปดาห์ต่อมาบริษัทส่งหัวหน้าคนงานคนใหม่ลงมาชั้นห้า {name}กลับไปถือพลั่วในชั้นสาม ค่าแรงเท่าคนงานทั่วไป

        สายถ่านหลังกำแพงมือยังไม่มีใครเปิด หัวหน้าคนใหม่ขุดอ้อมไปได้ครึ่งช่วงตัว แล้วขอย้ายขึ้นไปเอง ตอนขึ้นมาถึงปากเหมือง มือทั้งสองข้างของเขาพันผ้าไว้ทุกนิ้ว
      effects: { alignment: { moral: 1, law: -1 }, flags: [refused_deep_seam] }
    - id: shore_it
      label: ขุดตามสั่ง แต่ลงคานค้ำเองทุกช่วงตัว ไม่ให้ใครอยู่ใกล้กำแพงเกินจำเป็น
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ลงคานค้ำทุกช่วงตัวด้วยมือตัวเอง ใช้เวลาเป็นสองเท่า ไม่ยอมให้ใครทำงานติดกำแพงเกินครึ่งวัน ผลัดกันทีละสองคน ลงจากกะแล้วต้องขึ้นไปสูดลมชั้นบนทุกครั้ง อุโมงค์อ้อมเสร็จช้าไปสิบวัน สายถ่านหนาเท่าคนยืน

          บริษัทจ่ายแค่สามเหรียญเพราะเสร็จช้า แต่คนของบริษัทเห็นคานค้ำทั้งแถวแล้วส่งหมวกเหล็กติดตะเกียงมาให้ใบหนึ่ง หมวกที่บริษัทให้เฉพาะหัวหน้าคนงานที่ไม่มีใครตายในกะ
        effects: { stats: { CON: 1 }, gold: 3, items: [miner_lamp_helmet], world: { demon: 1 }, flags: [opened_deep_seam] }
      failure:
        text: |
          คานค้ำช่วงที่สามเอียงตอนตอกลิ่มตัวสุดท้าย หินก้อนเท่าหัววัวไถลลงมาตามคาน {name}ผลักคนงานข้างตัวออกทัน แต่หินครูดลงไปตามไหล่ซ้ายของ{name}จนเสื้อขาด

          อุโมงค์เสร็จช้าไปสิบวัน บริษัทจ่ายสามเหรียญ ไหล่ซ้ายของ{name}ยกขึ้นเหนือหัวไม่ได้ไปจนสิ้นฤดู
        effects: { hp: -2, gold: 3, world: { demon: 1 }, flags: [opened_deep_seam] }
    - id: taai_tells
      label: ให้ตาไอเล่าเรื่องกำแพงมือให้คนทั้งชั้นฟัง
      requires: { flag: carried_miner_to_sun }
      text: |
        ตาไอลงบันไดมาชั้นห้าทีละขั้น เดินช้าจนคนงานต้องรอ เขานั่งลงหน้ากำแพงมือแล้วเล่าว่าพ่อของเขาเคยขุดเลียบกำแพงแบบนี้ในเหมืองอีกฝั่งหุบ เดือนแรกคนในกะตีกันเอง เดือนที่สองมีคนฝันถึงเสียงเรียกชื่อจากใต้พื้นทุกคืน ช้าๆ ทีละพยางค์ เดือนที่สามพ่อของเขาเดินลงอุโมงค์ไปคนเดียวกลางดึก แล้วไม่มีใครเห็นเขาขึ้นมาอีก

        คนงานทั้งสิบสี่คนฟังจนจบ เช้าวันต่อมาทั้งสิบห้าคนรวม{name}ไปยืนรอคนของบริษัทที่ปากเหมือง บริษัทไล่คนออกสิบห้าคนพร้อมกันไม่ได้ เพราะเหมืองต้องส่งถ่านให้ทันกำหนด แผนที่ชั้นหินแผ่นนั้นกลับไปอยู่ในลิ้นชัก
      effects: { alignment: { moral: 1 }, flags: [crew_refused_together] }

- id: adult.mid_miner_beam
  stage: adult
  weight: 45
  scene: mine
  when:
    age: [33, 40]
    flags: [job_miner]
  text: |
    ไอของ{name}มีเถ้าปนมาตั้งแต่หน้าหนาวที่แล้ว ไอทีละชุดยาวจนต้องเอามือยันผนังอุโมงค์ เสมหะตอนเช้าเป็นสีเทา คนงานเหมืองทุกคนที่อยู่มาถึงอายุนี้ไอแบบเดียวกัน ไม่มีใครถือเป็นเหตุให้หยุดงาน ช่วงหลังบริษัทให้ขนถ่านขึ้นจากปากเหมืองตอนกลางคืนด้วย เพราะฟ้าสว่างขึ้นทุกปีจนไม่ต้องจุดคบ

    วันนั้นคานค้ำหลังที่สามในอุโมงค์ชั้นสี่ทรุดลงโดยไม่มีเสียงเตือน หินหล่นลงมาครึ่งช่วงตัว ฝุ่นถ่านพุ่งดับตะเกียงไปสามดวง พอฝุ่นจาง {name}เห็นเวสซัน คนงานหนุ่มที่เพิ่งลงเหมืองได้สองปี นอนคว่ำอยู่ใต้คานหลังที่สี่ ขาทั้งสองข้างติดอยู่ใต้หิน คานเหนือตัวเขาร้องเสียงไม้ปริ ร้องช้าๆ ทุกครั้งที่หินข้างบนขยับ

    ในมุมที่ตะเกียงดับไป ก้อนเถ้าสามก้อนเริ่มขยับ เลื้อยเข้ามาหาความร้อนจากตัวคน
  choices:
    - id: hold_the_beam
      label: มุดเข้าไปเอาหลังรับคานไว้ ให้คนอื่นดึงเวสซันออก (เสี่ยงถึงชีวิต)
      check: { stat: CON, dc: 10 }
      success:
        text: |
          {name}มุดเข้าไปใต้คานหลังที่สี่ คุกเข่าคร่อมตัวเวสซัน แล้วยืดหลังขึ้นรับน้ำหนักไม้ คานกดลงมาบนสะบักทั้งสองข้าง หนักเหมือนแบกเกวียนทั้งเล่ม คนงานสองคนดึงข้อเท้าเวสซันออกทีละข้าง หินก้อนเล็กร่วงลงมากระทบหลัง{name}เป็นจังหวะ เหมือนใครเคาะประตู

          พอเวสซันพ้นออกไป {name}กลิ้งตัวตามออกมา ยังไม่ทันได้หายใจ คานหลังที่สี่ก็ลงถึงพื้นตรงที่{name}เพิ่งคุกเข่าอยู่ {name}นั่งไออยู่หน้าเตาพักจนตะเกียงดวงหนึ่งหมดน้ำมัน ไม่มีเลือดปนออกมา เวสซันขาหักข้างเดียว
        effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [held_the_beam, saved_vessan] }
      failure:
        text: |
          {name}รับคานไว้ได้ คนงานดึงเวสซันออกไปได้ครึ่งตัว แล้วไอชุดหนึ่งก็ขึ้นมาจากอกของ{name} ไอที่มีเถ้าปนมาตั้งแต่หน้าหนาวที่แล้ว ไอจนหลังที่ยืดตรงอยู่งอลงหนึ่งข้อ คานงอตามลงมาหนึ่งข้อ แล้วไม่หยุด

          เวสซันหลุดออกไปได้ทั้งตัว เขาจำได้แค่ว่ามีมือคู่หนึ่งผลักข้อเท้าเขาออกไปเป็นครั้งสุดท้าย คนงานชั้นสี่ใช้เวลาสามวันขุดหินออก แล้วแบก{name}ขึ้นบันไดสองร้อยหกสิบขั้น ขึ้นไปให้แดดเที่ยงส่องเป็นครั้งสุดท้าย
        effects: { die: true }
    - id: run_for_beams
      label: วิ่งขึ้นไปเอาคานสำรองกับคนจากชั้นสาม
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          บันไดจากชั้นสี่ขึ้นชั้นสามมีหกสิบขั้น {name}ขึ้นทีละสองขั้น ไอไปตลอดทาง ตะโกนเรียกคนเป็นคำๆ ระหว่างไอ คนงานชั้นสามสี่คนแบกคานสำรองตามลงมา ตอกคานใหม่ค้ำข้างคานที่ร้องได้ก่อนมันจะยอมแพ้

          พวกเขาขุดเวสซันออกมาได้ตอนตะเกียงดวงสุดท้ายเหลือน้ำมันก้นถ้วย ขาของเขาหักทั้งสองข้าง แต่หักตรง หมอกระดูกในหมู่บ้านบอกว่าเดินได้แน่
        effects: { stats: { DEX: 1 }, flags: [saved_vessan] }
      failure:
        text: |
          {name}ขึ้นบันไดได้ครึ่งทาง ไอก็พับตัว{name}ลงกับขั้นบันได ต้องนั่งรอให้ลมกลับเข้าอก คนงานชั้นสามได้ยินเสียงไอก่อนได้ยินเสียงเรียก พอคานสำรองลงไปถึง คานหลังที่สี่ก็ยอมแพ้ไปแล้ว

          เวสซันรอด หินที่ลงมาเพิ่มไม่ถึงตัวเขา แต่ทับขาข้างซ้ายจนหมอต้องตัดออกใต้เข่า ฤดูต่อมาเขากลับมาที่ปากเหมืองด้วยไม้ค้ำรักแร้ มานั่งเฝ้าเตาพักให้คนอื่น
        effects: { hp: -2, flags: [vessan_lost_leg] }
    - id: ring_of_lamps
      label: จุดตะเกียงที่เหลือวางล่อไว้ กันผีถ่านไม่ให้ถึงตัวเวสซัน
      check: { stat: INT, dc: 12 }
      success:
        text: |
          ผีถ่านกินความร้อนที่ใกล้ตัวที่สุดก่อนเสมอ {name}ไม่วางตะเกียงล้อมเวสซัน แต่วางห่างออกไปทางมุมมืดทีละดวง ให้มันเจอไฟก่อนเจอคน ก้อนเถ้าทั้งสามเลื้อยไปเกาะตะเกียงคนละดวง กินไฟจนดับ แล้วนอนอิ่มอยู่ตรงนั้น

          ระหว่างนั้นคนงานที่เหลือใช้ลิ่มไม้ค่อยๆ ยันคานหลังที่สี่ไว้ทีละนิ้ว พอเวสซันพ้นออกมา {name}เดินไปตีผีถ่านที่นอนอิ่มอยู่ทีละก้อน ง่ายเหมือนตีกองขี้เถ้า
        effects: { stats: { INT: 1 }, flags: [saved_vessan] }
      failure:
        text: |
          ตะเกียงดวงที่สามที่{name}วางลงยังไม่ทันติดดี ผีถ่านก้อนหนึ่งก็ข้ามมันมาหาความร้อนที่ใหญ่กว่า มันเกาะลงที่น่องของ{name} ความหนาวเจาะลึกลงไปถึงกระดูก จนขาข้างนั้นไม่รู้สึกว่ามีพื้นอยู่ใต้เท้า

          คนงานคนหนึ่งเอาตะเกียงทุบใส่ขา{name} ผีถ่านถึงยอมไปกินไฟแทน คนอื่นยันคานจนดึงเวสซันออกมาได้ทั้งตัว น่องของ{name}มีรอยด่างสีเทาเท่าฝ่ามือ ไม่หายไปจากผิวอีกเลย
        effects: { hp: -3, flags: [coal_ghost_cold, saved_vessan] }
    - id: shovel_the_ghosts
      label: คว้าพลั่ว ไล่ตีผีถ่านทีละก้อนอย่างที่เคยทำ
      requires: { flag: killed_coal_ghost }
      text: |
        {name}เคยฆ่าผีถ่านที่เกาะคอตาไอมาแล้ว รู้ว่ามันแตกง่ายที่สุดตอนยังไม่ได้เกาะอะไร {name}เดินเข้าหามุมมืดก่อนมันจะเลื้อยมาถึงตัวเวสซัน ฟาดพลั่วลงทีละก้อน ก้อนละครั้ง ไม่รีบ ผงเถ้ากระจายบนพื้นอุโมงค์สามกอง

        คนงานที่เหลือไม่ต้องคอยหันหลังระวังมุมมืดอีก ทั้งหมดช่วยกันตอกลิ่มยันคานหลังที่สี่ แล้วลากเวสซันออกมาได้ก่อนคานจะร้องเสียงสุดท้าย เวสซันเอาข้าวห่อมาให้{name}ทุกวันจนสิ้นเดือน
      effects: { stats: { DEX: 1 }, alignment: { moral: 1 }, flags: [saved_vessan] }

- id: adult.mid_smith_inspection
  stage: adult
  weight: 45
  scene: smithy
  when:
    age: [25, 32]
    flags: [job_smith]
    not_flags: [origin_marked_kept, origin_marked_foundling, origin_ashland]
  text: |
    นักล่าแม่มดของศาสนจักรตะเกียงไม่เคยเข้าร้านตีเหล็กเอง มีแต่ส่งเสมียนมา คนนี้มาเอง เสื้อคลุมขาวขลิบทองเปื้อนโคลนจนเทาถึงเข่า ตะเกียงแขวนดวงใหญ่ที่อกเหลือแต่โครง แก้วแตกไปตั้งแต่กลางทาง เขาวางกุญแจมือคู่หนึ่งลงบนทั่ง วงข้อมือเล็กเท่าข้อมือเด็ก หมุดในกลไกหักเป็นสองท่อน หน้าหักเป็นเม็ดหยาบสีเทา

    เขาเล่าว่าเด็กมีเขาคนหนึ่งบิดข้อมือหลุดจากกุญแจคู่นี้ระหว่างทางลงเวนทราส วิ่งหายเข้าป่าละเมาะริมทาง ตามสามวันก็ไม่เจอ เขาไม่ได้มาหาคนผิด เขามาหาช่างที่ทำหมุดไม่หัก ศาสนจักรจะสั่งกุญแจมือทุกฤดู ฤดูละยี่สิบคู่ จ่ายล่วงหน้าแปดเหรียญ

    {name}หยิบหมุดท่อนหนึ่งขึ้นมาดูใกล้ๆ รอยหักแบบนี้ ช่างตีเหล็กทุกคนรู้ว่าเกิดจากเหล็กที่จุ่มน้ำเร็วไปครึ่งจังหวะ
  choices:
    - id: take_contract
      label: รับสัญญา ตีกุญแจมือส่งศาสนจักรทุกฤดู
      text: |
        {name}รับเงินแปดเหรียญ นักล่าแม่มดนับให้บนทั่งทีละเหรียญ แล้ววางหมุดหักสองท่อนไว้ข้างกองเหรียญ บอกให้เก็บไว้ดูเป็นตัวอย่างของงานที่เขาไม่ต้องการ

        ฤดูแรก{name}ตีกุญแจมือยี่สิบคู่ หมุดทุกตัวจุ่มน้ำตรงจังหวะ ตะไบขอบในให้เรียบเหมือนที่ช่างทุกคนทำ ตอนเสมียนมารับ เขาบิดกุญแจคู่หนึ่งด้วยคีมจนด้ามคีมงอ หมุดไม่หัก
      effects: { gold: 8, alignment: { moral: -1, law: 1 }, reputation: { lamp_church: 1 }, flags: [lamp_smith] }
    - id: refuse_both
      label: วางหมุดลงบนทั่ง บอกว่าร้านนี้ไม่รับงานศาสนจักร
      text: |
        นักล่าแม่มดเก็บกุญแจมือคู่นั้นกลับใส่ย่าม ไม่ถามเหตุผล เขาเดินไปอีกร้านหนึ่งในถิ่นเดียวกัน ฤดูต่อมาเสียงค้อนจากร้านนั้นดังข้ามถนนมาจนถึงค่ำทุกวัน

        {name}รับงานคันไถของทั้งถิ่นมาแทน งานหนัก ราคาต่ำ ตีจนเหล็กร้อนไม่ทันเย็น สิ้นฤดูแขนของ{name}ใหญ่ขึ้นจนต้องเลาะตะเข็บแขนเสื้อ
      effects: { stats: { STR: 1 }, alignment: { moral: 1 }, reputation: { lamp_church: -1 }, flags: [refused_lamp_contract] }
    - id: brittle_contract
      label: รับสัญญา แล้วตีหมุดทุกตัวให้เปราะเหมือนตัวนี้
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          หมุดเปราะที่ดีต้องผ่านคีมของเสมียน แต่ไม่ผ่านข้อมือเด็กที่บิดไปบิดมาทั้งคืน {name}ลองอยู่สิบคืนจนได้จังหวะ จุ่มน้ำให้ผิวนอกแข็ง ข้างในทิ้งเม็ดหยาบไว้ตรงกลาง บิดตรงๆ ไม่หัก บิดกลับไปกลับมายี่สิบครั้งถึงจะหัก

          ฤดูแรกเสมียนบิดกุญแจคู่หนึ่งด้วยคีม หมุดไม่หัก เขาจ่ายครบแปดเหรียญ ฤดูที่สาม มีข่าวจากทางเหนือว่าเด็กมีเขาหนีหลุดจากขบวนของศาสนจักรได้สองคนในคืนเดียว
        effects: { stats: { DEX: 1 }, gold: 8, alignment: { moral: 1, law: -1 }, flags: [lamp_smith, weak_shackles] }
      failure:
        text: |
          หมุดเปราะที่{name}ทำจุ่มน้ำเร็วเกินไปมาก เสมียนบิดด้วยคีมครั้งเดียวหมุดก็หัก เขาหยิบท่อนหักขึ้นมาวางเทียบกับหมุดหักท่อนเดิมที่นักล่าแม่มดทิ้งไว้ เม็ดหยาบสีเทาเหมือนกันทุกเม็ด

          ศาสนจักรเอาเงินมัดจำคืนไปทั้งหมด ในสมุดของเสมียนมีชื่อร้านของ{name}ขีดเส้นใต้สองเส้น
        effects: { reputation: { lamp_church: -1 }, flags: [lamp_noted_smith] }
    - id: cover_the_rivet
      label: โกหกเขาว่าหมุดแบบนี้หักเพราะเหล็กแท่งรุ่นใหม่จากเหมือง ไม่ใช่เพราะมือช่าง
      requires: { flag: weak_shackles }
      check: { stat: INT, dc: 13 }
      success:
        text: |
          หมุดท่อนนั้นเป็นของ{name}เอง {name}จำเม็ดหยาบตรงกลางได้ทุกเม็ด แต่หยิบขึ้นมาส่องกับแสงเตาเหมือนช่างที่เพิ่งเห็นมันครั้งแรก แล้วเล่าเรื่องเหล็กแท่งจากเหมืองใหม่ทางตะวันออกที่มีขี้แร่ปนจนช่างทั้งถิ่นบ่น เล่าละเอียดจนบอกได้ว่าแท่งไหนมากับเกวียนเล่มไหน

          นักล่าแม่มดฟังจนจบ แล้วจดชื่อเหมืองลงสมุดแทนชื่อร้าน ก่อนไปเขาถามว่า{name}จะรับสัญญาไหม {name}บอกว่าร้านเล็กเกินไปสำหรับยี่สิบคู่ต่อฤดู เขาเชื่อเรื่องนั้นด้วย
        effects: { stats: { INT: 1 }, alignment: { law: -1 }, flags: [covered_weak_rivet] }
      failure:
        text: |
          {name}เล่าเรื่องเหล็กแท่งจากเหมืองใหม่ เล่ายาวเกินไป นักล่าแม่มดดูมือของ{name}ระหว่างเล่า มือที่หมุนหมุดท่อนนั้นไปมาเหมือนคนที่รู้จักมันดี

          เขาไม่จับใคร ไม่ขึ้นเสียง แค่เก็บหมุดทั้งสองท่อนกลับใส่ย่าม จดชื่อร้าน ชื่อ{name} และวันที่ลงสมุด ขีดเส้นใต้สองเส้น ตั้งแต่นั้นมีคนเสื้อคลุมขาวมายืนอ่านป้ายหน้าร้านของ{name}เดือนละครั้ง ยืนจนเหล็กในเตาเย็น แล้วเดินไป
        effects: { reputation: { lamp_church: -1 }, flags: [lamp_noted_smith] }
    - id: mend_one_pair
      label: รับกุญแจคู่นั้นไว้ซ่อมคืนเดียว แล้วแอบตีหมุดตัวใหม่ให้เปราะเหมือนตัวเก่า
      requires: { trait: demon_mark, not_flags: [weak_shackles] }
      text: |
        คืนนั้นร้านปิดแล้ว {name}นั่งลงหน้าเตา มือข้างหนึ่งลูบโคนเขาของตัวเองอย่างที่ทำทุกคืน อีกข้างหยิบกุญแจมือคู่นั้นขึ้นมาสวมข้อมือตัวเอง ข้อมือผู้ใหญ่ใส่ได้แค่ครึ่งวง

        {name}ตีหมุดตัวใหม่ จุ่มน้ำเร็วไปครึ่งจังหวะเหมือนตัวเก่า ส่วนกลไกที่เหลือทำให้ดีกว่าเดิมทุกชิ้น เช้าวันต่อมานักล่าแม่มดบิดด้วยมือเปล่าแล้วพอใจ เขาถามเรื่องสัญญาอีกครั้ง {name}บอกว่าร้านเล็กเกินไปสำหรับยี่สิบคู่ เขาจ่ายค่าซ่อมหนึ่งเหรียญ แล้วเอากุญแจคู่นั้นไปใส่เด็กคนต่อไป
      effects: { gold: 1, stats: { DEX: 1 }, alignment: { moral: 1, law: -1 }, flags: [weak_shackles] }

- id: adult.mid_smith_coal
  stage: adult
  weight: 45
  scene: smithy
  when:
    age: [33, 40]
    flags: [job_smith]
  text: |
    เตาในร้านของ{name}เผาถ่านมารมาหลายปีแล้ว ตั้งแต่ปีที่ถ่านไม้แพงจนไม่คุ้มค่าจุด ถ่านมารก้อนเดียวให้ไฟเท่าถ่านไม้ครึ่งกระสอบ ไฟสีแดงคล้ำ ร้อนนิ่ง ไม่กระพือตามลม งานโครงตะเกียงกับข้อต่อแขนกลเข้ามาไม่ขาดตั้งแต่น้ำค้างดาวราคาตกลงทุกปี ร้านตีทันก็เพราะเตานี้

    เดือนนั้นลูกมือสองคนในร้านต่อยกันสามครั้ง ครั้งสุดท้ายเพราะใครสักคนวางคีมผิดที่ คนหนึ่งเอาเหล็กเส้นที่ยังแดงฟาดแขนอีกคน ตัว{name}เองก็เพิ่งขว้างค้อนใส่ผนังเมื่อวานซืน เพราะเหล็กแท่งหนึ่งงอผิดมุม รอยบุบบนแผ่นไม้ยังอยู่ตรงระดับหัวคน

    ทอฟรา ลูกมือคนแคระที่เพิ่งมาจากฮอร์ดุน ยืนดูรอยบุบนั้นพักหนึ่ง แล้วบอกว่าที่บ้านของนาง ร้านไหนเผาถ่านมาร ต้องเปิดประตูร้านทิ้งไว้ทั้งวัน และห้ามมีค้อนอยู่ใกล้มือเกินหนึ่งเล่ม
  choices:
    - id: back_to_charcoal
      label: กลับไปซื้อถ่านไม้ ถึงจะแพงกว่าเกือบเท่าตัว
      requires: { min_gold: 5 }
      text: |
        {name}จ่ายห้าเหรียญซื้อถ่านไม้สิบกระสอบ ใช้ได้ไม่ถึงสองเดือน ไฟถ่านไม้สีส้ม กระพือทุกครั้งที่ประตูเปิด เหล็กร้อนช้ากว่าเดิมครึ่งหนึ่ง งานข้อต่อแขนกลสองงานหลุดไปร้านอื่นที่ส่งของทันกำหนด

        สัปดาห์ที่สามลูกมือสองคนนั้นนั่งกินข้าวกลางวันบนม้านั่งตัวเดียวกัน สัปดาห์ที่ห้า{name}ทำเหล็กแท่งหนึ่งงอผิดมุมอีก ดูมันครู่หนึ่ง แล้ววางลงในกองเศษเหล็กเฉยๆ รอยบุบบนผนังยังอยู่ที่เดิม
      effects: { gold: -5, world: { demon: -1 }, flags: [smith_back_to_charcoal] }
    - id: keep_the_coal
      label: เผาถ่านมารต่อ แล้วไล่ลูกมือคนที่ฟาดเหล็กออก
      text: |
        ลูกมือคนนั้นเก็บของออกไปตอนเย็น ไม่บอกลาใคร เดือนนั้นร้านส่งข้อต่อแขนกลครบทุกงาน ได้กำไรมากกว่าเดือนก่อนสี่เหรียญ ลูกมือคนใหม่มาจากโรงหล่อในเมือง แขนแข็ง พูดน้อย

        ปลายเดือน ลูกมือคนใหม่ต่อยลูกมือคนเก่าที่เหลืออยู่จนฟันหลุด เพราะอีกฝ่ายเดินผ่านหลังตอนเขาถือเหล็ก {name}เข้าไปแยกทั้งสองคนออกจากกัน มือที่ดันอกลูกมือคนใหม่ยังกำค้อนอยู่ จำไม่ได้ว่าหยิบมาตอนไหน
      effects: { gold: 4, flags: [kept_demon_coal] }
    - id: quiet_hammer
      label: ให้ทอฟราสอนวิธีตีเหล็กแบบตระกูลของนาง
      check: { stat: STR, dc: 13 }
      success:
        text: |
          ตระกูลของทอฟราชื่อตระกูลค้อนเงียบ ช่างของตระกูลตีเหล็กหน้าเตาถ่านมารโดยนับลมหายใจ หายใจเข้าหนึ่งครั้ง ยกค้อน หายใจออก ค้อนลง ห้ามเร็วกว่านั้น ห้ามตีตามอารมณ์ {name}ตีแบบนั้นได้สิบครั้งแรกก็อยากเหวี่ยงแรงขึ้น ทอฟรายืนนับเสียงดังอยู่ข้างทั่งจนจบงาน ทุกงาน ทั้งเดือน

          เดือนที่สอง{name}นับเองได้ในใจ เหล็กที่ตีช้าลงกลับเรียบกว่าเดิม ลูกมือทั้งสองคนนับตาม ปลายฤดู ตระกูลของทอฟราส่งค้อนเล่มหนึ่งมาจากฮอร์ดุน หัวค้อนสลักเส้นนับไว้สิบเส้น เป็นค้อนที่ตระกูลให้ช่างนอกตระกูลที่นับได้ครบ
        effects: { stats: { STR: 1 }, items: [smith_dwarf_hammer], flags: [learned_quiet_hammer] }
      failure:
        text: |
          {name}นับได้สามวัน วันที่สี่เหล็กเส้นหนึ่งร้าวกลางเส้น {name}นับต่อไม่ไหว เหวี่ยงค้อนลงเต็มแรงสามครั้งติด ครั้งที่สามค้อนเด้งกลับจากทั่งมาฟาดหลังมือตัวเอง

          ทอฟราพันมือให้ แล้วกลับไปนั่งนับลมหายใจของตัวเองอยู่หน้าเตาคนเดียว ทุกเช้าก่อนจุดไฟ
        effects: { hp: -2 }
    - id: answer_the_voice
      label: ตอบเสียงทุ้มใต้พื้นร้านที่เรียกชื่อ{name}ในฝันทุกคืน
      requires: { trait: demon_mark }
      text: |
        เสียงนั้นมาครั้งแรกในปีที่สองของเตาถ่านมาร ทุ้มต่ำจากใต้พื้นร้าน เรียกชื่อ{name}ช้าๆ ทีละพยางค์ เหมือนคนที่ไม่เคยต้องรีบเรื่องอะไรในชีวิต ช่วงหลังมันไม่ได้เรียกแค่ชื่อ มันบอกว่าไฟในเตาของ{name}จะไม่มีวันดับ และวันที่ฟ้าเปิดออก คนทั้งถิ่นจะมาขอไฟจากเตานี้

        คืนนั้น{name}ตอบมันเป็นครั้งแรก ตอบคำเดียวว่าไม่ แล้วตื่นขึ้นมาในความมืด เหงื่อท่วมหมอน เตาข้างล่างยังคุอยู่ ไฟสีแดงคล้ำไม่กระพือ เสียงนั้นไม่มาอีกสามคืน คืนที่สี่มันกลับมา เรียกชื่อช้ากว่าเดิม ช้าเหมือนรอได้อีกร้อยปี
      effects: { stats: { CON: 1 }, flags: [told_the_voice_no] }

- id: adult.mid_bough_raid
  stage: adult
  weight: 45
  scene: home
  when:
    age: [25, 32]
    flags: [job_bough_crafter]
  text: |
    ค่ายตัดไม้ของอู่ต่อเรือเวนทราสขยับเข้ามาใกล้ป่าไอเลธทุกปี ปีนี้มาตั้งห่างต้นไม้ต้นแรกของป่าแค่ครึ่งวันเดิน มีเลื่อยสองคนชักสิบสองคู่ กับเกวียนเหล็กที่ใช้วัวลากทีละสี่ตัว ไม้ที่ค่ายตัดยังเป็นไม้นอกป่า แต่เสียงเลื่อยลอยขึ้นมาถึงหมู่บ้านบนกิ่งทุกเช้า

    ผู้เฒ่าตอบทุกคนที่ถามเหมือนกันว่าป่ารอได้ เอลฟ์รุ่นหนุ่มเก้าคนรอไม่ได้ คืนหนึ่งพวกเขามาเคาะบันไดเชือกบ้านของ{name} เพราะ{name}เป็นคนเฝ้าคลังไม้ร่วงของหมู่บ้าน คลังที่เก็บเชือกใยไม้ น้ำมันยางสน และกิ่งแห้งที่ป่าทิ้งลงมาตลอดสิบฤดู

    พวกเขาต้องการน้ำมันยางสนสามไห กับเชือกยาวพอข้ามลำธารหน้าค่าย ในคืนเดือนดับที่จะถึง เอลฟ์ที่พูดแทนทั้งเก้าคนอายุน้อยกว่า{name}แค่สามฤดู มือของเขายังมีรอยเชือกบาดจากงานทอผ้า
  choices:
    - id: give_and_go
      label: เปิดคลังให้ แล้วตามไปด้วยในคืนเดือนดับ
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ผูกเชือกข้ามลำธารเอง ผูกแบบที่ช่างบนกิ่งผูกสะพานชั่วคราว ดึงทีเดียวก็หลุด พวกหนุ่มราดน้ำมันยางสนรอบกองไม้ที่ตัดแล้วกับล้อเกวียนเหล็ก ก่อนจุดไฟ {name}ให้คนหนึ่งเขย่ากระดิ่งแพะจนคนในค่ายวิ่งออกจากกระโจมครบทุกคน

          กองไม้ไหม้จนเช้า เกวียนเหล็กเหลือแต่โครงดำ ไม่มีใครในค่ายตาย ตอนข้ามกลับ {name}กระตุกเชือกให้หลุดจากฝั่งตรงข้าม ปล่อยให้มันลอยไปตามลำธาร
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [helped_camp_burning] }
      failure:
        text: |
          ลมเปลี่ยนทิศตอนไฟลุกได้ครึ่งกอง เปลวไฟเลียข้ามทุ่งหญ้าแห้งไปทางตีนป่า {name}กับพวกหนุ่มต้องตีไฟด้วยเสื้อตัวเองจนเกือบสว่าง ไฟหยุดห่างต้นไม้ต้นแรกของป่าไม่ถึงสามช่วงตัว

          แขนซ้ายของ{name}พองเป็นแผลยาวจากข้อมือถึงข้อศอก ผู้เฒ่าเห็นแผลนั้นตอนเช้า ดูแล้วไม่ถาม คนบนกิ่งรู้กันทั้งหมู่บ้านภายในวันเดียว
        effects: { hp: -3, alignment: { law: -1 }, flags: [helped_camp_burning, bough_burn_scar] }
    - id: tell_elders
      label: ปิดคลัง แล้วเอาเรื่องไปบอกผู้เฒ่าก่อนเดือนดับ
      text: |
        ผู้เฒ่าเรียกเอลฟ์หนุ่มทั้งเก้าคนขึ้นไปบนกิ่งใหญ่ ไม่ได้ดุ ให้ทุกคนนั่งฟังเสียงเลื่อยจากค่ายด้วยกันตั้งแต่เช้าจนค่ำ แล้วส่งทั้งเก้าคนลงไปช่วยงานบ้านตีนไม้หนึ่งฤดู ตีนไม้อยู่ใกล้ค่ายที่สุด ได้ยินเสียงเลื่อยชัดที่สุด

        ฤดูนั้นไม่มีใครมาเคาะบันไดเชือกของ{name}อีก ตอนกลับขึ้นมา คนที่เคยพูดแทนทั้งเก้าคนเดินผ่านบ้าน{name}ไปโดยไม่เงยหน้า
      effects: { alignment: { law: 1 }, flags: [told_elders_of_raid] }
    - id: warn_the_camp
      label: ลงไปบอกหัวหน้าค่ายตัดไม้ให้ตั้งยามคืนเดือนดับ
      text: |
        หัวหน้าค่ายเป็นชายหนวดเทา ฟัง{name}จนจบ แล้วถามว่าทำไมเอลฟ์ถึงมาบอกเรื่องนี้กับคนตัดไม้ {name}ตอบว่าไม่อยากให้มีใครตาย ทั้งสองฝั่ง เขาให้สองเหรียญเป็นค่าข่าว {name}รับไว้ เพราะถ้าไม่รับ เขาจะไม่เชื่อ

        คืนเดือนดับ ค่ายจุดคบไฟรอบกองไม้สามสิบดวง เอลฟ์หนุ่มเก้าคนนอนดูไฟจากริมลำธารจนสว่าง แล้วกลับขึ้นกิ่งมือเปล่า ไม่ต้องถามกันก็รู้ว่าใครเป็นคนบอก
      effects: { gold: 2, alignment: { moral: 1, law: 1 }, flags: [warned_logging_camp] }
    - id: wheels_with_elrin
      label: ไปหาเอลริน ชวนเขาแอบถอดล้อเกวียนเหล็กแทนการเผา
      requires: { flag: helped_sithran }
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          เอลรินยังจำฤดูที่{name}ช่วยทำกี่ทอผ้าใช้หนี้ได้ เขาไปพูดกับพวกหนุ่มเองว่าไฟลามขึ้นป่าได้ แต่ล้อเกวียนที่หายไปไม่ลามไปไหน คืนเดือนดับ เขากับ{name}คลานเข้าค่ายใต้เสียงกรนของคนตัดไม้ ถอดสลักล้อทั้งสี่ทีละตัว แล้วแบกล้อเหล็กหนักเท่าคนไปทิ้งลงแอ่งลึกในลำธาร

          ค่ายรอล้อใหม่จากเวนทราสสองเดือน สองเดือนนั้นเลื่อยทั้งสิบสองคู่ตัดไม้ได้ แต่ขนไม้ออกไม่ได้ กองไม้ที่ตัดแล้วเริ่มขึ้นรา เสียงเลื่อยเบาลงทุกสัปดาห์
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [unwheeled_iron_wagon] }
      failure:
        text: |
          ล้อแรกหลุดออกมาง่าย ล้อที่สองสลักขึ้นสนิม {name}ใช้ค้อนไม้เคาะเบาที่สุดแล้วก็ยังดัง หมาของค่ายวิ่งออกมาจากใต้เกวียน งับน่อง{name}จนเลือดซึมกางเกง เอลรินลาก{name}หนีข้ามลำธารได้ทัน

          ล้อเกวียนหลุดไปล้อเดียว คนของค่ายเปลี่ยนใหม่ได้ในสามวัน ส่วนรอยเขี้ยวสี่รูบนน่องของ{name}กลายเป็นแผลเป็นสีขาว เรียงกันเหมือนตะเข็บผ้า
        effects: { hp: -2, alignment: { law: -1 }, flags: [logger_dog_bite] }

- id: adult.mid_bough_tier
  stage: adult
  weight: 45
  scene: star_hall
  when:
    age: [33, 40]
    flags: [job_bough_crafter]
  text: |
    หอนับดาวบนยอดไม้ที่สูงที่สุดของป่าไอเลธมีชั้นนั่งนับเจ็ดชั้น ไล่ลงมาตามลำต้น ชั้นละยี่สิบที่ คนนับแต่ละคนนั่งหลังกรอบไม้ไผ่ของตัวเอง นับดาวในช่องฟ้าของตัวเองทุกคืนที่ฟ้าเปิด ตอน{name}ขึ้นหอครั้งแรก เจ็ดชั้นยังเหลือที่ว่าง ปีนี้คนนับนั่งเบียดจนไหล่ชนไหล่ ช่องฟ้าแต่ละช่องต้องแบ่งให้แคบลง เพราะดาวในช่องเดิมมากจนคนเดียวนับไม่ทันก่อนฟ้าสาง

    ผู้คุมหอขอชั้นที่แปด เหนือชั้นบนสุดขึ้นไปอีกสามช่วงตัว ตรงที่ลำต้นเรียวลงและแกว่งตามลมแรงที่สุด ต้องใช้คานยาวสิบสองท่อน ตามธรรมเนียม ไม้ทุกชิ้นในหอนับดาวต้องเป็นไม้ที่ป่าทิ้งลงมาเอง คลังไม้ร่วงมีกิ่งยาวพอทำคานอยู่แปดท่อน ปีหนึ่งป่าทิ้งกิ่งยาวขนาดนั้นลงมาไม่เกินสองกิ่ง

    ที่ตีนป่า พ่อค้าไม้จากเวนทราสมีไม้เลื่อยจากค่ายตัดไม้วางขาย ตรง ยาว ไม่มีปุ่ม ท่อนละหนึ่งเหรียญ
  choices:
    - id: wait_for_fallen
      label: รอไม้ที่ป่าทิ้งลงมาเอง สร้างชั้นที่แปดทีละคาน
      text: |
        {name}วางคานแปดท่อนแรกในฤดูเดียว แล้วรอ ฤดูลมปีแรกป่าทิ้งกิ่งยาวลงมาหนึ่งกิ่ง ปีที่สองไม่ทิ้งเลย ปีที่สามหนึ่งกิ่ง ระหว่างนั้นคนนับดาวชั้นที่แปดนั่งบนพื้นที่ยังมีแค่ครึ่งชั้น ผูกตัวไว้กับลำต้นด้วยเชือกใยไม้ทุกคืน

        ปีที่สี่ป่าทิ้งลงมาสองกิ่งในคืนเดียว คานท่อนสุดท้ายขึ้นไปวางครบ ผู้คุมหอวางมือบนคานนั้น บอกว่าไม้ที่ป่าให้เองไม่เคยหักใต้คนนับ ฟ้าทางเหนือมีช่องที่ไม่มีใครนับมาสี่ปี คืนแรกที่มีคนนั่งนับ เขานับได้เกือบสองเท่าของที่จดไว้บนแผ่นใบไม้ครั้งสุดท้ายที่มีคนนับช่องนั้น
      effects: { alignment: { law: 1 }, flags: [built_tier_slow] }
    - id: buy_sawn
      label: ซื้อไม้เลื่อยสี่ท่อนจากตีนป่ามาทำคานที่ขาด โดยไม่บอกใคร
      requires: { min_gold: 4 }
      text: |
        {name}จ่ายพ่อค้าสี่เหรียญ ขนไม้เลื่อยขึ้นกิ่งตอนกลางคืน แล้วเอาดินกับยางไม้ทาปลายท่อนให้ดูเหมือนรอยหักของกิ่งที่ป่าทิ้ง วิธีเดียวกับที่คนตัดกิ่งขายใช้ปิดรอยเลื่อย ชั้นที่แปดเสร็จในฤดูเดียว คนนับดาวขึ้นไปนั่งเต็มชั้นตั้งแต่คืนฟ้าเปิดคืนแรก

        ผู้คุมหอวางมือบนคานทุกท่อนตอนขึ้นไปตรวจ วางเท่ากันทุกท่อน ไม่หยุดที่ท่อนไหนนานกว่าท่อนอื่น {name}ยืนดูมือนั้นจนมันลงจากคานท่อนสุดท้าย
      effects: { gold: -4, alignment: { law: -1 }, flags: [built_with_sawn_wood] }
    - id: weave_the_tier
      label: ปีนขึ้นไปสานชั้นที่แปดจากเชือกใยไม้กับกิ่งเป็นๆ ที่ยังติดต้น
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          กิ่งเป็นที่ยอดไม้เรียวและเหนียว ดัดได้โดยไม่หัก {name}ปีนขึ้นไปผูกมันเข้าหากันทีละคู่ด้วยเชือกใยไม้ สานเป็นพื้นตาข่ายรอบลำต้น ใช้คานจากคลังแค่สี่ท่อนเป็นโครง ทำอยู่สามสิบคืน ลมที่ยอดไม้พัดไม่หยุด กิ่งที่ผูกไว้แกว่งไปพร้อมกันทั้งชั้นเหมือนใบไม้ใบเดียว

          คืนสุดท้าย{name}นั่งพักบนชั้นที่สานเสร็จ ไม่มีกรอบไม้ไผ่ ไม่มีช่องฟ้าให้นับ เงยหน้าดูดาวเฉยๆ เป็นครั้งแรกในรอบหลายปี ดูจนเริ่มรู้สึกว่ามีอะไรบางอย่างข้างบนนั้นมองลงมาตอบ แล้วก้มหน้าไต่กลับลงไปก่อนจะได้รู้ว่ามันคืออะไร
        effects: { stats: { DEX: 1 }, flags: [built_the_high_tier] }
      failure:
        text: |
          เชือกเส้นที่ผูกตัว{name}ไว้กับลำต้นลื่นตอนลมกระโชก {name}ร่วงลงมาหนึ่งช่วงตัว สีข้างกระแทกขอบชั้นที่เจ็ดเต็มแรง คนนับดาวที่นั่งอยู่ชั้นนั้นคว้าข้อเท้าไว้ได้ก่อนจะร่วงต่อ

          ชั้นที่แปดสานไปได้ครึ่งเดียว{name}ก็ต้องลงไปนอนรักษาสีข้างที่บ้านทั้งเดือน ครึ่งชั้นที่สานไว้แกว่งตามลมอยู่บนยอดไม้ มีคนนับดาวสองคนขึ้นไปนั่งนับบนนั้นทุกคืน ผูกตัวไว้กับลำต้นคนละสองเส้น
        effects: { hp: -3 }
    - id: the_sawn_branch
      label: เอากิ่งมีรอยเลื่อยที่เก็บไว้ใต้บ้านมาทำคานท่อนที่เก้า
      requires: { flag: bought_cut_branch }
      text: |
        กิ่งที่{name}ซื้อจากพ่อค้าเมื่อหลายปีก่อนยังวางอยู่ใต้บ้าน ไสเป็นคานไว้แล้ว ปลายที่เคยมีรอยเลื่อยซีดจนเหมือนกิ่งที่ป่าทิ้งลงมาเอง {name}กับเอลรินแบกมันขึ้นหอนับดาวด้วยกัน คานท่อนนี้ยาวพอดีกับช่องที่เก้า เหมือนช่องนั้นเว้นไว้รอมันมาตลอด

        ผู้คุมหอวางมือบนคานทุกท่อนตอนขึ้นมาตรวจ มือของเขาหยุดบนท่อนที่เก้านานกว่าท่อนอื่นนิดหนึ่ง แล้วเลื่อนไปท่อนถัดไป คานที่ขาดอีกสามท่อน ป่าทิ้งลงมาให้ภายในสองฤดู
      effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [cut_branch_in_star_hall] }

- id: adult.mid_merchant_shop
  stage: adult
  weight: 45
  scene: market
  when:
    age: [25, 32]
    flags: [job_merchant]
  text: |
    ร้านหัวมุมตลาดเป็นของคนขายเชือกที่ตายไปเมื่อหน้าฝน ภรรยาของเขาจะไปอยู่กับลูกสาวที่ถิ่นอื่น ร้านกว้างสองช่วงแขน ลึกห้าช่วง มีชั้นไม้สามชั้น ประตูบานเฟี้ยมปิดได้สนิท ห้องนอนข้างหลังมีหน้าต่างบานเดียวที่มองเห็นบ่อน้ำกลางตลาด นางขายสิบเหรียญ ต่ำกว่าราคาร้านแบบนี้ เพราะอยากขายให้จบก่อนเกวียนของลูกเขยมารับ

    {name}เร่ขายของมาหลายปี ลูกค้าตามหมู่บ้านจำเสียงกระดิ่งที่ห้อยท้ายเกวียนได้ คนที่ซื้อเชื่อไว้ก็รอจ่ายตอนเกวียนผ่านมารอบหน้า ถ้ามีร้าน ลูกค้าต้องเดินมาหาเอง

    คนของวิหารเบเลคมีโต๊ะอยู่ฝั่งตรงข้ามบ่อน้ำ เขาเห็น{name}มายืนหน้าร้านนั้นสามเย็นติดกันแล้ว เย็นที่สี่ เขาเดินข้ามมาพร้อมกระดาษสัญญาฉบับเปล่า
  choices:
    - id: borrow_for_it
      label: ลงชื่อกู้วิหารเบเลคสิบเหรียญ ซื้อร้านวันนี้
      text: |
        คนของเบเลคเขียนตัวเลขลงกระดาษบนขอบบ่อน้ำ ผ่อนเดือนละครึ่งเหรียญ ดอกทบทุกปี ร้านเป็นของค้ำ {name}ลงชื่อ แล้วเอาเงินสิบเหรียญไปวางในมือภรรยาคนขายเชือกก่อนหมึกจะแห้ง

        คืนแรกในร้าน {name}ปลดกระดิ่งจากท้ายเกวียนมาแขวนเหนือประตู ประตูเปิดทีไรกระดิ่งก็ดัง ตอนดึกลมพัดลอดบานเฟี้ยม กระดิ่งดังเบาๆ เหมือนเกวียนยังวิ่งอยู่ที่ไหนสักแห่ง
      effects: { gold: -10, debt: true, reputation: { belek_bank: 1 }, flags: [owns_the_shop, shop_on_belek_loan] }
    - id: buy_outright
      label: จ่ายสิบเหรียญจากถุงที่เก็บมาตลอดหลายปี
      requires: { min_gold: 10 }
      text: |
        {name}นับเหรียญให้ภรรยาคนขายเชือกทีละเหรียญบนชั้นไม้ชั้นกลาง ครบสิบเหรียญ นางเก็บใส่ผ้าห่อ แล้ววางกุญแจประตูบานเฟี้ยมลงในมือ{name} บอกว่าบานที่สามชอบติด ต้องยกขึ้นนิดหนึ่งก่อนเลื่อน

        คนของเบเลคมองข้ามบ่อน้ำมา แล้วพับกระดาษสัญญาฉบับเปล่าเก็บใส่อกเสื้อ ปีนั้นเขาไม่ได้เดินข้ามมาที่ร้านอีก
      effects: { gold: -10, flags: [owns_the_shop] }
    - id: stay_on_the_road
      label: ขอบใจนาง แล้วเข็นเกวียนออกไปทางเดิม
      text: |
        {name}บอกนางว่าลูกค้าตามทางยังรออยู่ นางไม่ว่าอะไร ร้านหัวมุมตกเป็นของคนขายผ้าจากเมืองในสัปดาห์ต่อมา เขาทาสีประตูบานเฟี้ยมเป็นสีแดง

        ฤดูนั้นเกวียนของ{name}วิ่งไกลกว่าทุกปี ไปถึงหมู่บ้านที่ไม่เคยได้ยินเสียงกระดิ่งมาก่อน ขาของ{name}แข็งแรงขึ้นจนเดินทั้งวันแล้วไม่ปวด แต่ทุกครั้งที่เข้าตลาดเดิม {name}ก็หันไปดูประตูสีแดงนั้น
      effects: { stats: { CON: 1 }, flags: [stayed_on_the_road] }
    - id: collect_hail_debt
      label: ขับเกวียนไปหมู่บ้านลูกเห็บ ดูว่าแผ่นไม้บนเสากลางลานยังมีชื่ออยู่ไหม
      requires: { flag: hail_village_credit }
      text: |
        แผ่นไม้ยังตอกอยู่บนเสากลางลาน ตัวหนังสือซีดจนต้องเอานิ้วไล่ หญิงแก่หลังค่อมตายไปตั้งแต่หน้าหนาวก่อน หลานชายของนางขึ้นเป็นหัวหน้าหมู่บ้านแทน เขาจำเกวียนของ{name}ได้ก่อนจำหน้า

        เขาเรียกทุกบ้านมาที่ลาน แต่ละบ้านเอาเงินมาวางบนตอไม้ใต้แผ่นไม้ ทีละเหรียญ ทีละครึ่งเหรียญ จนครบหกเหรียญ มากกว่าราคาข้าวครึ่งเกวียนในปีที่ยืม เพราะยายของเขาสั่งไว้ว่าให้คืนตามราคาปีที่คืน แล้วเขาก็งัดแผ่นไม้ออกจากเสา ยื่นให้{name}ถือกลับไปด้วย
      effects: { gold: 6, flags: [hail_village_paid] }

- id: adult.mid_merchant_prices
  stage: adult
  weight: 45
  scene: market
  when:
    age: [33, 40]
    flags: [job_merchant]
  text: |
    ปีนี้เทียนไขขายไม่ออก ปีก่อนยังพอขายได้ในหมู่บ้านไกลๆ ปีนี้แม้แต่หมู่บ้านที่เกวียนต้องเดินสามวันจากเมืองก็มีตะเกียงน้ำค้างดาวแขวนหน้าบ้านหัวหน้าหมู่บ้านแล้ว แสงฟ้าจางๆ ไม่มีควัน ไม่มีกลิ่น จุดทีเดียวอยู่ได้สิบคืน ราคาหลอดน้ำค้างดาวตกลงทุกปีตามดาวบนฟ้าที่เพิ่มขึ้น คนขายหลอดบอกลูกค้าแบบนั้นด้วยน้ำเสียงของคนที่บอกว่าพรุ่งนี้ฝนจะตก

    ในห้องเก็บของของ{name}มีเทียนไขสี่ร้อยเล่มกับน้ำมันตะเกียงยี่สิบไห ซื้อมาตอนหน้าหนาวที่แล้วด้วยราคาเต็ม เทียนเล่มบนสุดเริ่มงอตามอากาศร้อน
  choices:
    - id: carry_to_the_hills
      label: แบกเทียนกับน้ำมันขึ้นไปขายหมู่บ้านบนเขาที่เกวียนขึ้นไม่ถึง
      check: { stat: CON, dc: 12 }
      success:
        text: |
          ทางขึ้นหมู่บ้านบนเขาเป็นบันไดหินกว้างเท่าเท้าเดียว ลาขึ้นไม่ได้ {name}แบกเทียนขึ้นไปเที่ยวละห้าสิบเล่ม น้ำมันทีละสองไห ขึ้นลงสิบสองเที่ยวในหนึ่งเดือน บนนั้นยังไม่มีใครเคยเห็นตะเกียงแสงฟ้า คนแก่ในหมู่บ้านถามว่าเทียนของ{name}ทำจากไขอะไร ถึงไหม้นานกว่าเทียนที่ทำเองครึ่งคืน

          ของหมดในหน้าแล้งเดียว ได้เงินกลับมาห้าเหรียญ ต่ำกว่าทุนนิดหน่อย แต่ไม่ต้องทิ้งเทียนสักเล่ม ตอนลงเขาเที่ยวสุดท้าย {name}เห็นแสงฟ้าจางๆ ดวงหนึ่งที่ปากทางขึ้นบันได มีคนเอาตะเกียงน้ำค้างดาวมาแขวนไว้ตรงนั้นแล้ว
        effects: { stats: { CON: 1 }, gold: 5 }
      failure:
        text: |
          เที่ยวที่สาม ขั้นบันไดหินขั้นหนึ่งโยกใต้เท้า {name}เซไปชนผนังเขา ไหน้ำมันในย่ามแตกสองไห น้ำมันซึมเปียกเสื้อจนถึงเอว เข่าข้างขวาบวมจนต้องนั่งพักครึ่งทางทุกเที่ยวหลังจากนั้น

          ทั้งเดือน{name}ขึ้นเขาได้แค่หกเที่ยว ขายได้สองเหรียญ เทียนที่เหลือละลายติดกันเป็นก้อนในห้องเก็บของตอนหน้าร้อน
        effects: { hp: -2, gold: 2 }
    - id: switch_to_dew
      label: ขายเทียนกับน้ำมันทิ้งให้ร้านในเมือง แล้วหันมาขายหลอดน้ำค้างดาว
      text: |
        ร้านในเมืองรับเทียนไปในราคาที่{name}อายจะบอกใคร {name}เอาเงินนั้นไปลงหลอดน้ำค้างดาวทั้งเกวียน ขายพร้อมโครงตะเกียงตามหมู่บ้านที่ยังไม่มีตะเกียงฟ้า หักทุนทั้งหมดแล้ว ฤดูนั้นได้กำไรแปดเหรียญ

        หลอดน้ำค้างดาวเบาจนแทบไม่มีน้ำหนัก ลังหนึ่งเบากว่าเทียนสิบเล่ม แต่ตอนกลางคืน เกวียนของ{name}เรืองแสงฟ้าออกมาตามร่องไม้ คนเลี้ยงแพะที่เดินสวนกลางทางนึกว่ามีผีนั่งอยู่บนเกวียน
      effects: { gold: 8, world: { star: 1 }, flags: [sells_star_lamps] }
    - id: sell_to_ileth
      label: นึกถึงเผ่าเดียวที่ไม่ยอมใช้น้ำค้างดาว แล้วขนของขึ้นป่าไอเลธ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          หมู่บ้านบนกิ่งยังจุดเทียนทุกบ้าน และไม่มีพ่อค้าคนไหนอยากขึ้นไปขาย เพราะเอลฟ์ไม่จ่ายเป็นเหรียญ จ่ายเป็นผ้าทอใยไม้ {name}รับผ้าแทนเงินทั้งหมด คิดราคาผ้าเทียบกับราคาที่ร้านผ้าในเวนทราสรับซื้อ บวกค่าเกวียนลงเขาเข้าไปด้วย แล้วนั่งต่อราคากับผู้เฒ่าที่ต่อเก่งที่สุดในหมู่บ้านอยู่ครึ่งวัน

          ผ้าทอใยไม้ขายในเมืองได้หกเหรียญ ผู้เฒ่าบอกให้กลับมาอีกปีหน้า เทียนสี่ร้อยเล่มพอใช้แค่หมู่บ้านเดียว ในป่ายังมีหมู่บ้านบนกิ่งอีกหลายสิบหมู่บ้าน
        effects: { stats: { INT: 1 }, gold: 6, flags: [sold_candles_to_ileth] }
      failure:
        text: |
          {name}คิดราคาผ้าทอใยไม้ตามราคาที่ร้านผ้าในเวนทราสขาย ไม่ใช่ราคาที่ร้านรับซื้อ ผู้เฒ่าที่ต่อเก่งที่สุดในหมู่บ้านรู้ทันตั้งแต่คำแรก นั่งต่อจน{name}เหนื่อยก่อน แล้วรับไปแค่น้ำมันตะเกียงสามไห จ่ายเป็นผ้าทอผืนเล็กผืนเดียว

          ผ้าผืนนั้นขายในเมืองได้หนึ่งเหรียญ เกวียนของ{name}ลงจากป่าพร้อมเทียนเต็มคันเหมือนตอนขึ้นไป
        effects: { gold: 1 }
    - id: oil_for_the_mine
      label: ไปหาคนของบริษัทเหมือง คนที่เคยขี่ม้ารอข้าวหน้าหมู่บ้านลูกเห็บ
      requires: { flag: outbid_the_mine }
      text: |
        คนของบริษัทเหมืองจำ{name}ได้ เขารู้มาหลายปีแล้วว่าถิ่นถัดไปไม่เคยมีโรงสี เขาหัวเราะเรื่องนั้นก่อนจะฟังว่า{name}มาขายอะไร ในเหมืองถ่านมาร คนงานยังใช้ตะเกียงน้ำมัน เพราะเปลวไฟหรี่ลงเมื่อลมในอุโมงค์เสีย แสงฟ้าบอกเรื่องนั้นไม่ได้

        เขาซื้อน้ำมันทั้งยี่สิบไหในราคาเต็ม กับเทียนอีกครึ่งหนึ่งไว้ให้คนงานจุดตอนตะเกียงดับ จ่ายหกเหรียญเป็นเหรียญเงินบนหลังม้าเหมือนเดิม คราวนี้เขาลงจากม้ามาช่วยขนไหเอง
      effects: { gold: 6, flags: [sold_oil_to_mine] }

- id: adult.mid_clerk_heirs
  stage: adult
  weight: 45
  scene: belek_bank
  when:
    age: [25, 32]
    flags: [job_clerk]
  text: |
    เสมียนใหญ่ย้าย{name}มานั่งโต๊ะทายาท โต๊ะที่อยู่ใกล้ประตูที่สุดในห้องโถง เสมียนทุกคนต้องผ่านโต๊ะนี้หนึ่งปีก่อนได้ขึ้นไปนั่งชั้นบน งานของโต๊ะมีอย่างเดียว คนที่อายุครบสิบหกในปีนี้และมีชื่อเป็นทายาทในสัญญาของคนตาย ต้องมาลงชื่อรับหนี้ต่อจากพ่อแม่ที่โต๊ะนี้ ก่อนวันเกิดของตัวเอง

    สัปดาห์แรกมีคนมาเจ็ดคน ทุกคนถือใบทวงที่วิหารส่งไปถึงบ้าน บางคนอ่านเองได้ บางคนให้{name}อ่านให้ฟัง เด็กผู้ชายคนหนึ่งถามว่าถ้าไม่ลงชื่อจะเป็นอย่างไร {name}ตอบตามคู่มือโต๊ะ ว่าหนี้จะตกไปที่น้องคนถัดไป เด็กคนนั้นมีน้องสาวสองคน

    ทุกเย็นเสมียนใหญ่อ่านบัญชีโต๊ะทายาทของ{name} ปลายปีเขาจะตัดสินว่า{name}ได้ขึ้นชั้นบนหรือไม่
  choices:
    - id: run_the_desk
      label: ให้ทุกคนลงชื่อตามสัญญา ไม่ขาดสักคน
      text: |
        ปีนั้นโต๊ะทายาทมีคนมาลงชื่อสองร้อยสิบสี่คน ไม่ขาดสักคน {name}อ่านสัญญาให้ทุกคนที่อ่านไม่ออกฟังจนจบ ชี้ช่องลงชื่อด้วยปลายปากกา แล้วซับหมึกให้ด้วยกระดาษซับแผ่นเดียวกันทั้งปี ปลายปีกระดาษแผ่นนั้นดำจนอ่านลายมือกลับด้านได้สองร้อยสิบสี่ชื่อ

        เสมียนใหญ่ให้{name}ขึ้นชั้นบน เดือนแรกถุงค่าแรงหนักขึ้นสามเหรียญ โต๊ะทายาทได้เสมียนคนใหม่ในวันเดียวกัน
      effects: { gold: 3, alignment: { law: 1, moral: -1 }, reputation: { belek_bank: 1 }, flags: [belek_upper_floor] }
    - id: read_every_contract
      label: อ่านสัญญาของทายาททุกคนทั้งฉบับ หาบรรทัดที่เปิดช่องให้
      check: { stat: INT, dc: 14 }
      success:
        text: |
          สัญญาแต่ละฉบับยาวสิบถึงยี่สิบหน้า {name}อ่านทุกฉบับในคืนก่อนเจ้าของชื่อจะมา เจอบรรทัดที่ให้ชำระด้วยแรงงานในสามฉบับ เจอบรรทัดที่ว่าหนี้ของคนที่ตายระหว่างทำงานให้วิหารไม่ตกถึงลูกอีกหนึ่งฉบับ เด็กผู้ชายที่มีน้องสาวสองคนเป็นลูกของคนแบกหีบเงินที่ตายตอนขนหีบให้วิหาร

          ปลายปีเสมียนใหญ่เรียก{name}ขึ้นไปชั้นบน ไม่ได้ให้นั่งโต๊ะ ให้นั่งร่างแบบสัญญาฉบับใหม่ที่วิหารจะใช้ปีหน้า เขาบอกว่าคนที่รู้ว่าช่องอยู่ตรงไหน คือคนที่ปิดช่องได้ดีที่สุด แบบสัญญาฉบับใหม่วางอยู่ตรงหน้า{name} หน้าสิบสี่ยังเป็นหน้าว่าง
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [found_belek_clause, asked_to_close_clauses] }
      failure:
        text: |
          {name}อ่านสัญญาทุกคืนจนน้ำมันตะเกียงหมดไปสองขวด ไม่เจอบรรทัดไหนเปิดให้ใคร เจอแต่บรรทัดที่ปิดซ้อนกันสามชั้น ปลายเดือนเสมียนใหญ่ถามว่าทำไมตะเกียงโต๊ะทายาทหมดน้ำมันเร็วกว่าโต๊ะอื่น

          ปลายปีเขาไม่ให้{name}ขึ้นชั้นบน ให้นั่งโต๊ะทายาทต่ออีกปี เขาบอกว่าเสมียนที่อ่านสัญญาที่ไม่ต้องอ่าน ยังไม่พร้อมจะนั่งข้างบน
        effects: { reputation: { belek_bank: -1 }, flags: [stayed_at_heir_desk] }
    - id: pay_toward_mila
      label: จ่ายห้าเหรียญของตัวเองลงหนี้ของมีลา
      requires: { flag: copied_child_debt, min_gold: 5 }
      text: |
        หน้าคัดหนี้ของทอมลินยังอยู่ในลิ้นชักห้องหลัง ลายมือของ{name}เอง หนี้สี่สิบเอ็ดเหรียญทบดอกมาตั้งแต่วันที่มีลายืนเกาะขอบโต๊ะ ตอนนี้เป็นตัวเลขที่{name}ไม่อยากอ่านออกเสียง

        {name}เอาห้าเหรียญของตัวเองมาวางบนโต๊ะทายาท ลงบัญชีเป็นเงินชำระจากคนนอกสัญญา เบเลคไม่ขีดบรรทัดไหนทิ้ง แต่รับทุกเหรียญที่มีคนยื่นให้ เย็นนั้นเสมียนใหญ่อ่านบัญชีมาถึงบรรทัดนั้น หยุดอยู่ครู่หนึ่ง แล้วพลิกหน้าต่อโดยไม่ถามสักคำ ตัวเลขข้างชื่อมีลาลดลงห้าเหรียญ ยังห่างจากศูนย์อีกไกล
      effects: { gold: -5, alignment: { moral: 1 }, flags: [paid_toward_mila] }

- id: adult.mid_clerk_missing_line
  stage: adult
  weight: 45
  scene: belek_bank
  when:
    age: [33, 40]
    flags: [job_clerk]
  text: |
    ตัวหนังสือในสัญญาเล็กลงทุกปี {name}รู้ว่าตัวหนังสือไม่ได้เล็กลง ห้องโถงของวิหารเปลี่ยนจากเทียนมาแขวนตะเกียงน้ำค้างดาวตั้งแต่ปีที่หลอดราคาตก แสงฟ้าทำให้หมึกดำดูเป็นสีเขียวน้ำ ตอนเย็นต้องถือกระดาษห่างออกไปจนสุดแขน เสมียนใหญ่จึงส่งทาเรสมานั่งข้างโต๊ะ เด็กหนุ่มอายุสิบเจ็ด ลายมือเรียบเหมือนตัวพิมพ์ อ่านเร็วจนต้องหยุดรอให้{name}ตามทัน

    งานแรกที่{name}ให้ทาเรสฝึกคือตรวจสำเนาเก่าเทียบกับต้นฉบับ งานที่ต้องทำทุกสิบปี เพราะเบเลคไม่ขีดบรรทัดไหนทิ้ง และไม่ยอมให้บรรทัดไหนหายไปด้วย วันที่สามทาเรสยกสำเนาฉบับหนึ่งมาวางตรงหน้า{name} ลายมือของ{name}เองเมื่อหลายปีก่อน สำเนามีสิบแปดบรรทัด ต้นฉบับมีสิบเก้า

    บรรทัดที่หายบอกว่าดอกของหนี้ก้อนนี้ทบทุกปี ไม่ใช่ทบครั้งเดียว ลูกหนี้เป็นหญิงทอผ้าคนหนึ่ง จ่ายตามสำเนามาตลอดจนเหลืออีกเหรียญเดียว ถ้าเติมบรรทัดนั้นลงไป นางจะเป็นหนี้มากกว่าวันแรกที่กู้
  choices:
    - id: correct_it
      label: ให้ทาเรสเติมบรรทัดที่หายลงในสำเนา แล้วส่งใบทวงใหม่
      text: |
        ทาเรสเขียนบรรทัดที่สิบเก้าลงในสำเนาด้วยลายมือที่เรียบที่สุดของเขา {name}ลงชื่อรับรองข้างบรรทัด แล้วส่งใบทวงใหม่ไปบ้านหญิงทอผ้า ในใบทวงมีตัวเลขสองแถว แถวที่จ่ายแล้วกับแถวที่ยังต้องจ่าย แถวหลังยาวกว่า

        เสมียนใหญ่รู้เรื่องในวันเดียวกัน เขาไม่ตำหนิสำเนาที่ผิด เขาวางแว่นขยายกรอบทองเหลืองอันหนึ่งไว้บนโต๊ะของ{name} บอกว่าเสมียนที่อ่านไม่ครบทุกบรรทัด ต้องมีของช่วยให้อ่านครบ
      effects: { alignment: { law: 1, moral: -1 }, reputation: { belek_bank: 1 }, items: [clerk_reading_lens], flags: [corrected_missing_line] }
    - id: blame_the_ink
      label: ชี้ให้ทาเรสดูว่าบรรทัดที่สิบเก้าในต้นฉบับใช้หมึกคนละขวดกับบรรทัดอื่น
      check: { stat: INT, dc: 14 }
      success:
        text: |
          ใต้แสงฟ้า หมึกทุกขวดดูเป็นสีเดียวกัน {name}พาทาเรสไปส่องต้นฉบับกับเทียนในห้องเก็บเอกสาร บรรทัดที่สิบเก้าเป็นสีน้ำตาลกว่าบรรทัดอื่นนิดหนึ่ง {name}รู้ว่าเป็นเพราะเสมียนคนเก่าเติมหมึกระหว่างเขียน แต่บอกทาเรสว่าบรรทัดที่เติมทีหลังโดยไม่มีผู้กู้ลงชื่อกำกับ เป็นบรรทัดที่วิหารไม่ควรทวงตาม

          ทาเรสคิดอยู่คืนหนึ่ง แล้วลงชื่อตรวจตามสำเนาเดิม เดือนต่อมาหญิงทอผ้าเอาเหรียญสุดท้ายมาวาง ได้ตราหนี้ครบประทับกลับไป ต้นฉบับกลับเข้าลิ้นชักพร้อมบันทึกของทาเรสหนึ่งแผ่น เขียนว่าหมึกบรรทัดที่สิบเก้าควรตรวจซ้ำ
        effects: { stats: { INT: 1 }, alignment: { law: -1, moral: 1 }, flags: [kept_missing_line] }
      failure:
        text: |
          ทาเรสส่องต้นฉบับกับเทียนตามที่{name}ชี้ แล้วเปิดสัญญาอีกสามฉบับของเสมียนคนเดียวกันมาเทียบ ทุกฉบับมีบรรทัดสีน้ำตาลกว่าบรรทัดอื่นตรงที่เสมียนคนนั้นเติมหมึก เขาวางทั้งสี่ฉบับเรียงกันบนโต๊ะของ{name} แล้วนั่งรอ

          เช้าวันต่อมาเสมียนใหญ่มีบันทึกของทาเรสวางอยู่บนโต๊ะ ค่าแรงของ{name}เดือนนั้นหายไปสองเหรียญ ใบทวงใหม่ไปถึงบ้านหญิงทอผ้าก่อนสิ้นสัปดาห์
        effects: { gold: -2, reputation: { belek_bank: -1 }, flags: [clerk_on_warning] }
    - id: ask_tares
      label: ถามทาเรสว่าถ้าเป็นโต๊ะของเขา เขาจะทำอย่างไร
      text: |
        ทาเรสไม่ตอบทันที เขาขอเอาสำเนากับต้นฉบับกลับไปนั่งดูคนเดียวหนึ่งคืน เช้าวันต่อมาเขาเอาทั้งสองฉบับมาคืน ข้างในมีกระดาษแผ่นหนึ่ง ลายมือเรียบเหมือนตัวพิมพ์ เขียนว่าเบเลคไม่ขีดบรรทัดไหนทิ้ง แต่ไม่ได้บอกว่าต้องเติมบรรทัดที่หายเมื่อไร

        เขาวางสำเนาฉบับนั้นไว้ในกองที่จะตรวจในรอบสิบปีหน้า ตรงกลางกอง ไม่บนสุด ไม่ล่างสุด เดือนต่อมาหญิงทอผ้าจ่ายเหรียญสุดท้าย {name}ยืนดูทาเรสประทับตราหนี้ครบให้นาง มือของเขานิ่งสนิท
      effects: { alignment: { moral: 1 }, flags: [tares_deferred_the_line] }
    - id: the_far_drawer
      label: พาทาเรสไปเปิดลิ้นชักที่ไกลที่สุดในห้องหลัง
      requires: { flag: misfiled_child_debt }
      text: |
        ลิ้นชักปีที่ไกลขนาดนั้นไม่มีเสมียนคนไหนเปิด มันฝืดจนต้องใช้สองมือดึง ข้างในมีกระดาษอยู่หน้าเดียว คือหน้าคัดหนี้ของมีลา ลายมือของ{name}เมื่อหลายปีก่อน ฝุ่นบนกระดาษหนาจนเห็นรอยนิ้วชัด {name}ไม่อธิบายอะไร แค่ยืนให้ทาเรสอ่านจนจบ

        ทาเรสอ่านจบแล้วปิดลิ้นชัก เขาเดินกลับไปหยิบต้นฉบับหนี้ของหญิงทอผ้า แล้วเปิดลิ้นชักถัดลงไปหนึ่งช่อง วางมันลงไปเองโดยไม่มีใครบอก ตอนออกจากห้องหลัง เขาเดินนำ{name}หนึ่งก้าว ไม่หันกลับมา
      effects: { stats: { DEX: 1 }, alignment: { law: -1, moral: 1 }, flags: [young_clerk_keeps_secret] }

- id: adult.mid_switch_commoner
  stage: adult
  weight: 15
  when:
    age: [26, 31]
    flags: [path_commoner]
  text: |
    นายคนแรกของ{name} คนที่คืนกระดาษสัญญาลูกมือให้หลังข้าวมื้อนั้นตอนอายุสิบแปด ตายในหน้าหนาวปีนี้ คนมางานศพสามสิบกว่าคน เกือบทั้งหมดเคยเป็นลูกมือของเขา บางคนยังทำงานเดิม บางคนไปทำอย่างอื่นนานแล้ว ทุกคนนั่งกินข้าวด้วยกันบนม้านั่งยาวหน้าบ้าน คุยเรื่องเงินกันตรงๆ แบบที่เขาสอนไว้

    คนที่นั่งทางซ้ายของ{name}จะขายเกวียนกับลาสองตัว เพราะเข่าไม่ดีแล้ว คนที่นั่งทางขวาเป็นช่างตีเหล็ก ลูกมือของเขาเพิ่งหนีไปทำงานโรงกลั่น เขาต้องการคนแขนแรงที่ไม่ต้องสอนตั้งแต่จับคีม คนที่นั่งตรงข้ามใส่เสื้อเสมียนวิหารเบเลค บอกว่าปีนี้วิหารรับเสมียนเพิ่มสิบคน รับเฉพาะคนที่อ่านสัญญาได้โดยไม่ต้องขยับปาก

    พอข้าวหมดหม้อ ทุกคนก็ลุกไปทางของตัวเอง
  choices:
    - id: stay
      label: กลับไปทำงานเดิมตั้งแต่เช้าวันรุ่งขึ้น
      text: |
        {name}ช่วยลูกสาวของนายล้างหม้อ เก็บม้านั่งเข้าใต้ถุนบ้าน แล้วกลับไปถึงที่ทำงานก่อนคนอื่นในเช้าวันต่อมา งานเดิมยังรออยู่ที่เดิม เหนื่อยตรงเดิม จ่ายเท่าเดิม และทำให้มือเป็นแผลแบบที่{name}รู้จักดี

        ตอนเย็น{name}เอาถ้วยข้าวใบที่ลูกสาวของนายให้ติดมือมาวางไว้บนชั้น ถ้วยใบที่นายใช้กินข้าวมื้อนั้น
      effects: { stats: { CON: 1 } }
    - id: to_merchant
      label: ซื้อเกวียนกับลาสองตัวต่อจากคนเข่าไม่ดี
      requires: { not_flags: [job_merchant], min_gold: 4 }
      text: |
        เขาขายให้สี่เหรียญ ที่เหลือให้ผ่อนเป็นน้ำมันทาเข่าเดือนละขวดจนกว่าเขาจะตาย หรือจนกว่าลาจะตาย แล้วแต่อะไรจะมาก่อน ลาสองตัวชื่อเช้ากับเย็น ตัวเช้าเดินนำ ตัวเย็นเดินตามเสมอ สลับกันไม่ได้

        เที่ยวแรก{name}ขนของจากถิ่นตัวเองไปขายถิ่นถัดไป ขายหมดในสองวัน ขากลับซื้อของถิ่นนั้นกลับมาเต็มเกวียน ลาตัวเย็นหยุดกินหญ้าทุกครั้งที่ผ่านบ้านเจ้าของเก่า
      effects: { gold: -4, flags: [job_merchant], clear_flags: [job_farmer, job_refinery_hand, job_docker, job_miner, job_smith, job_bough_crafter, job_clerk] }
    - id: to_smith
      label: ไปเป็นมือขวาในร้านตีเหล็ก
      requires: { not_flags: [job_smith, origin_elf_bough] }
      text: |
        ช่างตีเหล็กให้{name}ยืนหน้าทั่งตั้งแต่วันแรก ไม่ต้องเริ่มจากกวาดขี้เหล็ก เดือนแรก{name}ตีเกือกม้าเบี้ยวไปสามสิบคู่ เขาเอาไปขายเป็นเศษเหล็กโดยไม่บ่น เดือนที่สามเกือกม้าตรงทุกคู่

        ปลายปีเขาเอาเหล็กประทับของร้านมาให้{name}ประทับลงบนเกือกม้าคู่หนึ่งเอง เป็นคู่แรกที่มีตราร้านกับรอยค้อนของ{name}อยู่บนเหล็กชิ้นเดียวกัน
      effects: { stats: { STR: 1 }, flags: [job_smith], clear_flags: [job_farmer, job_refinery_hand, job_docker, job_miner, job_bough_crafter, job_merchant, job_clerk] }
    - id: to_clerk
      label: ไปสมัครเป็นเสมียนวิหารเบเลค
      requires: { not_flags: [job_clerk], min_stat: { INT: 13 } }
      text: |
        การสอบของวิหารเบเลคมีข้อเดียว เสมียนใหญ่ยื่นสัญญายาวสิบเก้าหน้าให้อ่านในใจ แล้วถามว่าบรรทัดไหนในหน้าเก้าที่ผู้กู้ไม่ควรลงชื่อ {name}ตอบได้ เขาจดชื่อลงสมุดเสมียนใหม่เป็นคนที่เจ็ด

        สัปดาห์แรก{name}คัดสัญญาจนนิ้วกลางมีหมึกฝังอยู่ในร่องเล็บ ล้างไม่ออก เสมียนรุ่นพี่บอกว่าไม่ต้องล้าง อีกสามปีมันจะกลายเป็นสีผิว
      effects: { alignment: { law: 1 }, reputation: { belek_bank: 1 }, flags: [job_clerk], clear_flags: [job_farmer, job_refinery_hand, job_docker, job_miner, job_smith, job_bough_crafter, job_merchant] }
