# ชุด 5 ยุคดาวเร่ง แพ็ก ก: ผู้ยืมรูป คนคาร์ดินเรียกว่า "คนซ้ำ" (8 เรื่อง) สิ่งติดตัว curse_nameless (ขายชื่อ) กับ curse_shadow (เงาเกิน) ไม่มีขั้นทั้งคู่
# 1 สัญญาณแรกที่ถนนสมุดบัญชี ตั๋วใบเดียวขึ้นเงินสองหน (ทุกวัย คนมีตรามีทางของตัวเอง) · 2 คำบ้านก่อนถอดรองเท้า (ทุกวัย ไม่ผูกถิ่น)
# 3 คนแปลกหน้าบนม้านั่งคนแก่ขอถือชื่อไปให้ ดันรอยดาว (วัยปลาย) · 4 ห้องใต้ดินกับตะเกียงดวงเดียว เงาเกิน (วัยทำงาน)
# 5 คนทวงหนี้ที่ไม่เคยกู้ ข้อตกลงที่สอง ดันรอยดาว (ทุกวัย) · 7 ตะเกียงสองดวง (เกิดซ้ำได้) · 8 ทางออกของชื่อ · 8 ทางออกของเงา
# คนที่มีแต่ในข้อความ: ดัลเมอร์ คนฟอกหนังที่ตั๋วโดนขึ้นเงินไปก่อน · ออดริกกับเทสซา ผัวเมียบ้านตรงข้ามที่ตกลงคำบ้านกันไว้
#   โครวิส เจ้าของโกดังผ้าที่จ้างคนนับม้วนตอนกลางคืน · ชายใจดีบนม้านั่งที่หัวเราะหลังคนอื่นหยุดแล้ว (ไม่มีชื่อของตัวเอง)
# ข้อความไม่อธิบายว่าคนซ้ำคืออะไร คนมีตราไม่อยู่ในสายตาของมัน

# ---------- 1 สัญญาณแรก: ตั๋วใบเดียว ----------
- id: adult.sky_borrower_note_cashed_twice
  stage: adult
  weight: 28
  scene: belek_bank
  when:
    age: [16, 130]
    year: [360, 368]
    location_tag: kardin
  text: |
    ถนนสมุดบัญชีมีโต๊ะของเบเลคตั้งเรียงกันสองฝั่งถนน โต๊ะละเสมียนสองคน คนหนึ่งจ่าย คนหนึ่งจด เช้านั้น{name}ต่อแถวอยู่ที่โต๊ะฝั่งตะวันออก คนข้างหน้าคือดัลเมอร์ คนฟอกหนังที่ทั้งถนนจำได้จากกลิ่น เขายื่นตั๋วเงินใบเดียวที่มีอยู่ให้เสมียน เสมียนพลิกดูสองหน แล้ววางลงบนโต๊ะช้าๆ เด็กวิ่งสารจากโต๊ะฝั่งตรงข้ามเพิ่งวิ่งมากระซิบเมื่อครู่ ตั๋วเลขนี้ขึ้นเงินไปแล้ว คนขึ้นลงชื่อดัลเมอร์ ลายมือของดัลเมอร์

    พยานรับจ้างสองคนที่นั่งรองานอยู่บนบันไดโต๊ะ ยกมือสาบานพร้อมกันว่าเห็นดัลเมอร์ที่โต๊ะฝั่งโน้น เสื้อหนังตัวนี้ ศอกปะผ้าสีนี้ คนหนึ่งเล่าเพิ่มว่าเขายิ้มให้เสมียนช้าไปครึ่งจังหวะ ยิ้มเหมือนรอดูคนอื่นยิ้มก่อน ส่วนดัลเมอร์ยืนอยู่หน้า{name}มาตั้งแต่โต๊ะยังไม่เปิด กลิ่นหนังของเขาติดเสื้อ{name}มาตั้งแต่ตอนนั้น

    เสมียนคนจดหันมาถามทั้งแถวว่ามีใครเห็นดัลเมอร์ออกจากแถวบ้าง ดัลเมอร์หันมาหา{name}ด้วย หน้าเขาซีดจนกลิ่นหนังจางลงไปนิดหนึ่ง
  choices:
    - id: vouch_for_him
      label: บอกเสมียนว่าเขายืนอยู่ตรงนี้ตลอด ไม่ได้ไปไหน
      text: |
        เสมียนจดชื่อ{name}ลงสมุดในช่องพยาน ให้ลงลายมือกำกับ แล้วถามดัลเมอร์ว่าแม่ของเขาเกิดที่ไหน ดัลเมอร์ตอบทันที เด็กวิ่งสารวิ่งข้ามถนนไปแล้ววิ่งกลับมา คนขึ้นเงินเมื่อครู่ก็โดนถามข้อเดียวกัน ตอบตรงกันทุกคำ เสมียนบอกว่าโต๊ะจะเก็บเรื่องไว้ เงินวันนี้ยังจ่ายไม่ได้ ดัลเมอร์เดินออกจากแถวมือเปล่า

        ดัลเมอร์ได้เงินคืนตอนสิ้นเดือน เขาเอาหนังขัดมันผืนเล็กมาให้{name}ผืนหนึ่ง กลิ่นติดอยู่หลายวัน
      effects: { alignment: { law: 1 }, flags: [vouched_for_the_tanner_at_the_desk] }
    - id: cross_to_the_other_desk
      label: เดินข้ามถนนไปดูโต๊ะฝั่งโน้นด้วยตาตัวเอง
      habit: curious
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ใต้ร่มโต๊ะฝั่งโน้น ชายเสื้อหนังศอกปะกำลังนับเหรียญลงถุง {name}เดินไปหยุดห่างสามก้าว เขาเงยหน้าขึ้นยิ้มให้ ยิ้มช้าไปครึ่งจังหวะ แล้วหัวเราะกับเรื่องที่เสมียนเล่าจบไปแล้วตั้งนาน เขาเดินเข้าฝูงคน {name}ตามไปสองหัวมุม มาเสียรอยที่แผงปลา ชายขายปลาหน้าแผงหันมายิ้มให้{name} ช้าไปครึ่งจังหวะเหมือนกัน

          {name}เดินกลับมาที่โต๊ะ ดัลเมอร์ยังยืนอยู่ในแถว {name}เล่าให้เสมียนฟังทีละอย่าง เสมียนจดทุกคำ แล้วถามว่าชายขายปลาคนนั้นชื่ออะไร
        effects: { stats: { WIS: 1 }, flags: [saw_the_double_at_the_other_desk] }
      failure:
        text: |
          โต๊ะฝั่งโน้นว่าง เสมียนบอกว่าคนขึ้นตั๋วเพิ่งไปเมื่อครู่ ทางไหนก็ไม่ได้ดู {name}ยืนหาคนเสื้อหนังในฝูงคนจนตาลาย เห็นเสื้อหนังศอกปะเต็มถนนไปหมด

          ตอนเดินกลับ ที่ของ{name}ในแถวมีคนอื่นยืนแทนแล้ว ต้องไปต่อท้ายใหม่ ธุระวันนั้นไม่ทันโต๊ะปิด
        effects: { gold: -1, flags: [saw_the_double_at_the_other_desk] }
    - id: swear_for_a_coin
      label: รับเหรียญจากหัวหน้าพยานรับจ้าง แล้วสาบานเป็นคนที่สาม
      text: |
        หัวหน้าพยานรับจ้างกระซิบว่าโต๊ะจ่ายค่าพยานทั้งสองฝั่ง ไม่ถามว่าฝั่งไหนจริง {name}ยกมือสาบานว่าเห็นดัลเมอร์ที่โต๊ะฝั่งโน้น เสมียนจดชื่อ{name}ไว้ใต้ชื่อพยานอีกสองคน แล้วจ่ายค่ามาสาบานให้ตามอัตรา

        ดัลเมอร์ไม่ได้ด่า เขาหันมามอง{name} แล้วก้มดูเสื้อตัวเอง ดูศอกที่ปะ เหมือนกำลังนึกว่าเช้านี้ตัวเองข้ามถนนไปหรือเปล่า
      effects: { gold: 2, alignment: { law: -1 }, flags: [swore_falsely_about_the_double] }
    - id: stand_before_the_double
      label: เดินข้ามไปยืนตรงหน้าโต๊ะฝั่งโน้น
      requires: { trait: curse_brand }
      text: |
        ชายเสื้อหนังยังอยู่ที่โต๊ะ {name}ยืนขวางระหว่างเขากับเสมียน ตาของเขาเลื่อนผ่านหน้า{name}ไปเหมือนเลื่อนผ่านเก้าอี้ว่าง แล้วพูดกับเสมียนข้ามไหล่{name} ขอนับเหรียญอีกรอบ ทุกอย่างเหมือนดัลเมอร์ ยกเว้นไม่มีกลิ่นหนัง

        เสมียนมองเห็นทั้งสองคน เห็นชัดว่าชายเสื้อหนังไม่ได้มอง{name} พอชายคนนั้นเดินจากไป เสมียนปิดสมุดแล้วถามเสียงต่ำว่า{name}เป็นใครมาจากไหน ทำไมเขาถึงไม่เห็น
      effects: { stats: { INT: 1 }, flags: [went_unseen_by_the_double] }

# ---------- 2 คำบ้าน ----------
- id: adult.sky_borrower_house_word
  stage: adult
  weight: 24
  scene: home
  time: dusk
  when:
    age: [16, 130]
    year: [364, 378]
  text: |
    บ้านตรงข้ามตกลงคำบ้านกันไว้ตั้งแต่ต้นปี เทสซาไม่เคยบอกใครว่าเป็นคำอะไร บอกแต่ว่าเป็นคำที่คนนอกบ้านไม่มีทางเดาถูก บนโต๊ะในบ้านนางมีตะเกียงสองดวงจุดคู่กันทุกค่ำ เหมือนอีกหลายบ้านในละแวก

    ค่ำนี้ออดริกผัวนางกลับบ้านช้ากว่าทุกวัน เหนื่อยจนลืมตัว ยืนถอดรองเท้าข้างหนึ่งก่อนแล้วถึงพูดคำบ้าน คำถูกทุกพยางค์ แต่มาหลังรองเท้า เทสซาปิดประตูใส่หน้าเขา ลงกลอนดังทั้งซอย ออดริกนั่งลงบนขั้นบันไดหน้าบ้าน รองเท้าข้างเดียวยังอยู่ในมือ บ้านอื่นบางบ้านหัวเราะ บางบ้านปิดประตูตัวเองตาม

    ออดริกเห็น{name}ตรงหน้าต่าง เขาลุกขึ้นเดินข้ามมา ขอให้ช่วยไปบอกเทสซาว่าเขาคือเขา
  choices:
    - id: ask_what_only_he_knows
      label: ไปยืนระหว่างสองคน ให้เทสซากระซิบคำถามมาให้ถามเขา
      habit: cool_headed
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          เทสซาแง้มประตูเท่าสันมือ กระซิบคำถามใส่หู{name} {name}เดินข้ามไปถามออดริก ถามช้าๆ ทีละคำ ดูหน้าเขาตอนฟัง เขาตอบก่อน{name}จะถามจบด้วยซ้ำ แล้วหน้าแดงไปถึงหู คำตอบเป็นเรื่องคืนแรกที่ทั้งสองคนย้ายเข้าบ้านหลังนี้ ไม่ใช่เรื่องที่คนอื่นควรได้ยิน

          เทสซาเปิดประตู ดึงผัวเข้าบ้านไปพร้อมรองเท้าข้างที่ยังถืออยู่ ก่อนปิดประตู นางขอโทษ{name}เรื่องคำตอบ ไม่ได้ขอโทษเรื่องอื่น
        effects: { stats: { WIS: 1 }, flags: [carried_the_second_question_across] }
      failure:
        text: |
          ออดริกตอบถูก แต่เขาเงียบไปครู่หนึ่งก่อนตอบ ยิ้มก่อนตอบ เทสซาได้ยินจากหลังประตู นางไม่เปิด คืนนั้นออดริกมานอนบนพื้นห้อง{name} เขากรนเสียงดังจนสว่าง

          เช้ามาเขาเดินกลับบ้าน พูดคำบ้านก่อนแล้วค่อยถอดรองเท้าทั้งสองข้าง เทสซาเปิดประตูรับ ตกบ่ายนางข้ามมาหา{name}เงียบๆ ถามเรื่องเดียวว่าเมื่อคืนเขากรนไหม
        effects: { flags: [carried_the_second_question_across] }
    - id: laugh_him_in
      label: หัวเราะ แล้วไปเคาะประตูบอกเทสซาว่าเลิกเล่นได้แล้ว
      text: |
        {name}เคาะประตูแล้วพูดเสียงดังให้ทั้งซอยได้ยิน ว่าถ้าเป็นคนซ้ำจริง คงพูดคำบ้านก่อนถอดรองเท้าถูกลำดับ ไม่ลืมแบบคนเหนื่อยหรอก คนในซอยหัวเราะตาม เทสซาเปิดประตูเพราะทนให้ทั้งซอยหัวเราะไม่ไหว ออดริกถอดรองเท้าอีกข้างแล้วเดินเข้าบ้าน

        สัปดาห์ต่อมาเทสซาข้ามมาหา{name}ตอนผัวไม่อยู่ ถามว่าคืนนั้น{name}เห็นไหมว่าเงาของออดริกบนผนังมีกี่เงา นางนับเองทุกค่ำแล้ว นับได้สองทุกครั้ง เพราะตะเกียงมีสองดวง นางบอกว่านับแล้วก็ยังไม่สบายใจ
      effects: { stats: { CHA: 1 }, alignment: { law: -1 }, flags: [laughed_off_the_house_word] }
    - id: fetch_a_wick_from_isel
      label: ไปขอไฟจากชามไฟของอีเซลมาจุดตะเกียงดวงที่สองให้บ้านนั้น
      text: |
        คนเฝ้าศาลอีเซลไม่ถามอะไรมาก เขาจุดไส้ตะเกียงจากชามไฟในสองมือของรูปเทพ ครอบโคมให้กันลม บอกว่าไฟจากเตาของท่านนับเงาได้ตรงกว่าไฟจากตลาด {name}ถือโคมกลับมาวางไว้บนขั้นบันไดข้างออดริก อีกดวงอยู่ในมือเทสซาที่แง้มประตูออกมาดู

        ออดริกนั่งอยู่กลางไฟสองดวง เงาสองเงาแผ่ไปคนละทางบนผนังบ้าน นับง่าย ไม่มีเงาไหนขยับก่อนตัวเขา เทสซาเปิดประตู สัปดาห์นั้นมีอีกสามบ้านในซอยเดินไปขอไฟที่ศาลอีเซล
      effects: { world: { gods: 1 }, flags: [fetched_isels_fire_for_the_second_lamp] }

# ---------- 3 ของที่ยื่นให้: ถือชื่อไปให้ (วัยปลาย) ----------
- id: elder.sky_borrower_carry_the_name
  stage: elder
  weight: 24
  scene: market
  when:
    age: [60, 130]
    year: [364, 378]
    not_traits: [curse_brand, curse_nameless]
  text: |
    ม้านั่งยาวหน้าร้านน้ำชาเป็นที่ของคนแก่ ใครแก่พอก็นั่งได้ ไม่ต้องขอใคร สัปดาห์นี้มีชายคนหนึ่งมานั่งปลายม้านั่งทุกเช้า แต่งตัวเรียบร้อย อายุดูไม่ออก เขาจำชื่อหลานของทุกคนบนม้านั่งได้หมด หัวเราะตามเรื่องที่คนอื่นเล่า หัวเราะหลังคนอื่นหยุดไปแล้วนิดหนึ่งทุกครั้ง แต่หัวเราะจริงใจ ไม่มีใครถือ

    เช้านี้เขาเลื่อนมานั่งข้าง{name} เล่าเรื่องชีวิตของ{name}ให้ฟังเหมือนเคยอยู่ด้วย งานแรกที่ได้ค่าแรง ชื่อตรอกที่เคยเช่าห้อง ทะเลาะกับใครเรื่องอะไร เรื่องเล็กๆ ที่{name}เองลืมไปแล้วจนเขาเล่าให้ฟัง แล้วเขาบอกว่าชื่อคนแก่หนักขึ้นทุกปี คนทวงหนี้ตามชื่อมา ญาติตามชื่อมา เรื่องเก่าตามชื่อมา เขาขอถือชื่อนั้นไปใช้ให้แทน ไกลออกไปในที่ที่{name}ไม่มีวันไป ใช้ให้ทำงาน ไม่ให้ว่าง ส่วน{name}จะได้ใบหน้าที่ไม่มีใครจำ นั่งตรงไหนก็ไม่มีใครมาเรียก เขาวางเหรียญเงินสามเหรียญเรียงไว้บนม้านั่งระหว่างกัน
  choices:
    - id: sell_the_name
      label: รับเหรียญ ยกชื่อให้เขาถือไป (ของแบบนี้ติดตัวไปนาน)
      text: |
        เขาประกบมือสองข้างเป็นถ้วย ขอให้{name}พูดชื่อตัวเองลงไปหนึ่งครั้ง ช้าๆ ครบทุกพยางค์ {name}พูด เขาปิดมือ เก็บใส่กระเป๋าเสื้อตรงอก ตบเบาๆ สองที แล้วลุกขึ้นโค้งให้ทั้งม้านั่ง เดินออกไปทางถนนใหญ่ ไม่หันกลับมา

        ตอนจะลุก หญิงร้านน้ำชาที่ชงชาให้{name}มาไม่รู้กี่ปีเดินมาถามอย่างสุภาพว่ามาจากไหน มาครั้งแรกหรือ รับชาเลยไหม คนบนม้านั่งเลื่อนที่ให้เหมือนให้คนแปลกหน้า ตกเย็นเพื่อนบ้านที่ทักกันทุกค่ำเดินสวนไปเฉยๆ {name}ทักก่อน เขาทักตอบอย่างสุภาพ แล้วถามว่าย้ายมาใหม่หรือ
      effects: { traits: [curse_nameless], marks: { star: 1 }, world: { star: 1 }, gold: 3, flags: [sold_the_name_on_the_old_bench] }
    - id: keep_the_name
      label: เลื่อนเหรียญคืนไปให้ บอกว่าชื่อนี้ยังใช้อยู่
      text: |
        เขาเก็บเหรียญคืนโดยไม่ต่อรอง หัวเราะ หัวเราะช้ากว่า{name}ครึ่งจังหวะ บอกว่าไม่เป็นไร คนแก่ส่วนมากชอบถือของหนักเอง

        วันต่อมาเขาไปนั่งข้างตาเฒ่าที่ปลายม้านั่งอีกฝั่ง เดือนต่อมาตาเฒ่าคนนั้นมานั่งที่เดิมทุกเช้า ไม่มีใครบนม้านั่งทักแก ลูกสาวแกมาตามกลับบ้านตอนเที่ยง ต้องร้องถามคนทั้งร้านว่าใครเห็นพ่อบ้าง แกนั่งอยู่ตรงหน้านาง
      effects: { flags: [kept_the_name_on_the_old_bench] }
    - id: ask_his_own_name
      label: ถามกลับว่าแล้วชื่อของเขาเองล่ะ
      habit: curious
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          เขาตอบชื่อหนึ่งออกมาคล่องปาก เป็นชื่อของตาช่างไม้ที่เคยนั่งปลายม้านั่งนี้ทุกเช้า ตาช่างไม้ตายไปตั้งแต่หน้าหนาวที่แล้ว {name}รู้จักชื่อนั้นดี เคยไปงานศพ เคยเห็นลูกหลานแกร้องไห้

          {name}พูดชื่อนั้นซ้ำให้ดังพอทั้งม้านั่งได้ยิน คนบนม้านั่งหันมาพร้อมกัน ชายคนนั้นยิ้มช้าไปครึ่งจังหวะ ลุกขึ้นโค้ง เก็บเหรียญเดินจากไป ไม่กลับมานั่งอีก
        effects: { stats: { WIS: 1 }, flags: [named_the_stranger_on_the_bench] }
      failure:
        text: |
          เขาตอบชื่อของ{name} ครบทุกพยางค์ ด้วยเสียงที่{name}ได้ยินตัวเองพูดมาทั้งชีวิต แล้วยิ้ม ยิ้มช้าไปครึ่งจังหวะ

          คืนนั้น{name}นอนไม่หลับ ลุกขึ้นมาพูดชื่อตัวเองกับเพดานหลายรอบ ฟังเสียงตัวเองว่ายังเหมือนเดิมไหม เช้ามาปวดหัวจนต้องนอนต่อถึงเที่ยง
        effects: { hp: -1, flags: [named_the_stranger_on_the_bench] }

# ---------- 4 อุบัติเหตุ: ตะเกียงดวงเดียว (วัยทำงาน) ----------
- id: adult.sky_borrower_one_lamp_cellar
  stage: adult
  weight: 20
  time: night
  when:
    age: [16, 59]
    year: [364, 378]
    not_traits: [curse_brand, curse_shadow]
  text: |
    โครวิสเจ้าของโกดังผ้าจ้างคนนับม้วนผ้าในห้องใต้ดินตอนกลางคืน ให้เสร็จก่อนเกวียนมารับตอนรุ่ง ค่าจ้างคืนเดียวเท่าค่าแรงสามวัน {name}รับงาน ห้องใต้ดินไม่มีหน้าต่าง มีช่องตะแกรงเหล็กเล็กๆ ระดับถนนช่องเดียว ตะเกียงดวงเดียวแขวนกลางห้อง โครวิสบอกว่าน้ำมันพอถึงสาง

    {name}นับไปได้ครึ่งกอง ที่ผนังตรงข้ามมีเงาของ{name}สองเงา เงาหนึ่งก้มนับตาม อีกเงาหนึ่งยืนตรง ไม่ก้ม ช้าไปครึ่งจังหวะทุกครั้งที่{name}ขยับ แล้วเงานั้นลอกออกจากผนังทีละน้อย ลงมายืนบนพื้นระหว่าง{name}กับบันได ตะเกียงกระพริบ ไส้กินน้ำมันเร็วกว่าที่โครวิสบอก
  choices:
    - id: back_to_the_stairs
      label: ประคองตะเกียงถอยเลียบผนังไปหาบันได อย่าให้ไฟดับ
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ยกตะเกียงสูงไว้ระหว่างตัวกับเงานั้น ถอยทีละก้าว ส้นเท้าคลำหาขั้นบันได เงาตามมาเท่าที่แสงยอม หยุดตรงที่แสงส่องเต็มพื้น ขั้นที่สิบสอง{name}ดันประตูออกไปเจอแสงตะเกียงถนน ยืนหอบอยู่ตรงนั้นจนสาง

          เช้ามาโครวิสลงไปดูห้อง ม้วนผ้าที่นับแล้วคลี่ออกทุกม้วน ผ้าลากยาวไปทางบันได เขาจ่ายค่าจ้างครึ่งคืน แล้วไม่ถามอะไรอีก
        effects: { stats: { DEX: 1 }, flags: [backed_out_of_the_one_lamp_cellar] }
      failure:
        text: |
          ส้นเท้าเกี่ยวขอบม้วนผ้า {name}ล้มหงาย ตะเกียงหลุดมือกลิ้งไปกระแทกผนัง ดับ มืดสนิทจนแยกไม่ออกว่าลืมตาอยู่หรือไม่ ทั้งคืนมีอะไรเย็นๆ แนบหลังอยู่ ไม่หนัก ไม่ขยับ {name}นั่งกอดเข่าอยู่ตรงนั้นจนแสงสางลอดช่องตะแกรงลงมาเป็นเส้น

          โครวิสลงมาพร้อมตะเกียงดวงใหม่ เขาเห็นก่อน{name} บนผนังข้างหลัง{name}มีเงาสองเงา จากตะเกียงดวงเดียว เขาจ่ายค่าจ้างเต็มคืน แล้วขอให้{name}ไม่ต้องมาอีก
        effects: { traits: [curse_shadow], flags: [sat_out_the_dark_with_a_second_shadow] }
    - id: burn_the_cloth
      label: ดึงม้วนผ้ามาจุดไฟล้อมตัวให้แสงมาจากทุกทาง
      text: |
        ม้วนผ้าสามม้วนวางเป็นสามมุมรอบตัว {name}จุดทีละม้วนจากตะเกียง ควันขึ้นเต็มเพดาน แสงมาจากทุกทาง เงาทุกเงาหดลงมากองใต้เท้าเป็นเงาเดียว ส่วนที่ยืนอยู่บนพื้นหายไปตอนไหนไม่ทันเห็น {name}นั่งไอกลางกองไฟเล็กๆ จนสาง

        โครวิสเห็นผ้าไหม้สามม้วนกับเพดานดำ เขาหักค่าผ้าจากค่าจ้างจนติดลบ {name}ต้องควักเพิ่มให้อีก เขาไม่ด่า เขาเอาตะเกียงอีกสองดวงมาแขวนในห้องใต้ดินตั้งแต่วันนั้น
      effects: { gold: -2, flags: [burned_the_cloth_for_light] }
    - id: face_it_till_dawn
      label: ยืนนิ่งจ้องมันไว้ ประคองไส้ตะเกียงให้ติดจนถึงสาง
      habit: stubborn
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ลดไส้ตะเกียงลงเหลือเปลวเท่าเมล็ดข้าว ให้น้ำมันพอถึงสาง แล้วยืนจ้องเงานั้นอยู่กลางห้อง ไม่ก้ม ไม่ขยับ เงานั้นก็ไม่ขยับ ขาเริ่มสั่นตอนเกือบสาง {name}กัดฟันยืนต่อ

          แสงสางลอดช่องตะแกรงลงมา เงานั้นบางลงจนเห็นลายผนังทะลุ แล้วไม่เหลือ ม้วนผ้านับไม่ทันครึ่ง โครวิสบ่น แต่ก็จ่ายเต็ม
        effects: { stats: { CON: 1 }, flags: [faced_the_second_shadow_till_dawn] }
      failure:
        text: |
          น้ำมันหมดก่อนสาง เปลวไฟเท่าเมล็ดข้าวหรี่ลงเป็นจุดแดง แล้วไม่เหลือ ในความมืดมีอะไรเย็นๆ เดินมาหยุดตรงหน้า ใกล้จนลมหายใจของ{name}กระทบกลับมาที่หน้า {name}ยืนอยู่อย่างนั้นจนแสงสางลงมา

          ตอนโครวิสจุดตะเกียงดวงใหม่ ที่ผนังมีเงาของ{name}สองเงา เงาหนึ่งยืนตรง อีกเงาก้มนิดหนึ่งเหมือนกำลังนับ
        effects: { traits: [curse_shadow], flags: [faced_the_second_shadow_till_dawn] }

# ---------- 5 ลึกลง: หนี้ที่ไม่เคยกู้ ข้อตกลงที่สอง ----------
- id: adult.sky_borrower_debt_never_taken
  stage: adult
  weight: 80
  scene: home
  cast:
    mate: { id: partner, optional: true }
  when:
    age: [16, 130]
    year: [364, 379]
    trait: curse_nameless
    not_traits: [curse_brand]
  text: |
    คนทวงหนี้มาถึงหน้าประตูตอนสาย มือถือกระดาษกู้แผ่นหนึ่ง กู้จากโต๊ะเบเลคในเมืองที่{name}ไม่เคยไป ชื่อคนกู้คือชื่อเดิมของ{name} ลายมือเหมือนลายมือ{name}ทุกตัว ตัวสุดท้ายลากหางยาวเหมือนที่{name}เคยลากตอนยังเซ็นชื่อนั้นได้ เขาทวงเงินกับดอกครบสามเหรียญ

    คุยกันได้ครู่เดียวเขาก็ถามว่า{name}เป็นใคร ถามสุภาพ เหมือนเพิ่งเดินมาถึง {name}ตอบ เขาจดลงกระดาษ แล้วถามใหม่อีกในครู่ต่อมา ตอนเขาเดินไปหาน้ำกินที่บ่อปากซอย มีชายคนหนึ่งยืนพิงรั้วอยู่ท้ายซอย ยืนท่าเดียวกับที่{name}ชอบยืน ยกมือทักมาทางนี้ช้าไปครึ่งจังหวะ แล้วชี้ไปที่กระดาษในมือคนทวงหนี้ แล้วชี้ที่มือของ{name}
  choices:
    - id: give_the_hand_too
      label: เดินไปหาชายท้ายซอย ยกลายมือให้มันไปด้วย หนี้จะได้ตามมันไป (ของแบบนี้ติดตัวไปนาน)
      text: |
        ชายคนนั้นจับมือ{name}หงายขึ้น ใช้ปลายนิ้วลากลายเซ็นชื่อเดิมลงกลางฝ่ามือช้าๆ ครบทุกตัวจนถึงหางตัวสุดท้าย แล้วปล่อยมือ เดินออกจากซอยไป {name}ไม่ได้ตามไปดูว่าเขาเลี้ยวทางไหน

        คนทวงหนี้กลับมาจากบ่อ คลี่กระดาษกู้ออกดู ตรงที่เคยมีชื่อเหลือแต่รอยหมึกจางๆ เขาขอโทษ บอกว่าคงมาผิดบ้าน แล้วเดินจากไปโดยไม่หันกลับ เย็นนั้น{name}ลองเขียนชื่อตัวเองลงกระดาษ ไม่ว่าชื่อไหน ตัวหนังสือออกมาโย้เย้เหมือนเด็กเพิ่งหัดเขียน เซ็นชื่อลงอะไรไม่ได้อีกเลย
      effects: { marks: { star: 1 }, world: { star: 1 }, flags: [gave_the_handwriting_to_the_double] }
    - id: answer_the_second_question
      label: พาคนทวงหนี้ไปโต๊ะเบเลค ให้เสมียนถามคำถามที่สอง
      check: { stat: INT, dc: 13 }
      success:
        text: |
          เสมียนคลี่กระดาษกู้ อ่านคำถามที่สองที่โต๊ะเมืองโน้นถามคนกู้ไว้ กับคำตอบที่จดไว้ข้างใต้ แล้วถาม{name}ข้อเดียวกัน เป็นเรื่องตอนเด็กที่{name}ต้องนึกอยู่นานกว่าจะได้ครบ {name}ตอบ ตอบครบทุกอย่าง คำตอบบนกระดาษถูกแค่ครึ่งเดียว เสมียนโต๊ะโน้นจดต่อท้ายไว้ด้วยว่าคนกู้ยิ้มก่อนตอบ

          เสมียนขีดเส้นแดงทับกระดาษกู้ คนทวงหนี้ฉีกกระดาษทิ้งต่อหน้า แต่ก่อนออกจากโต๊ะเขาถาม{name}อีกครั้งว่าเป็นใคร
        effects: { stats: { INT: 1 }, flags: [beat_the_debt_with_the_second_question] }
      failure:
        text: |
          {name}ตอบคำถามที่สองถูก ตรงกับคำตอบบนกระดาษกู้ทุกคำ คำบนกระดาษคล่องกว่าด้วยซ้ำ เสมียนบอกว่าโต๊ะแยกไม่ออกว่าใครกู้ ต้องแบ่งหนี้คนละครึ่ง

          {name}จ่ายส่วนของตัวเองที่โต๊ะนั้นเลย คนทวงหนี้ออกใบรับให้ ชื่อในใบรับเป็นชื่อเดิมของ{name} เขียนด้วยลายมือของเขาเอง
        effects: { gold: -2, flags: [beat_the_debt_with_the_second_question] }
    - id: pay_the_debt
      label: จ่ายให้ครบแล้วให้เขาไป
      text: |
        {name}นับเหรียญใส่มือคนทวงหนี้สามเหรียญ เขาเขียนใบรับ ลงชื่อเดิมของ{name}ไว้ในช่องคนจ่าย ขอโทษที่ต้องถามชื่อซ้ำ แล้วถามอีกครั้งก่อนจากไป

        ชายท้ายซอยหายไปแล้วตอนที่{name}มองไปอีกที ใบรับแผ่นนั้น{name}พับเก็บไว้ในหีบ เป็นกระดาษแผ่นเดียวในบ้านที่ยังมีชื่อนั้นอยู่
      effects: { gold: -3, flags: [paid_a_debt_never_taken] }
    - id: mate_vouches
      label: ให้{mate}ออกมายืนยันกับคนทวงหนี้ว่านี่คือใคร
      requires: { cast: [mate] }
      text: |
        {mate}ออกมายืนข้าง{name} จับแขนไว้ อ้าปากจะบอกชื่อ แล้วนิ่งไป นึกไม่ออก ยิ่งนึกยิ่งหายไปไกล {mate}บีบแขน{name}แน่นขึ้นเรื่อยๆ จนคนทวงหนี้ต้องหลบตา เขาพับกระดาษกู้ บอกว่าเดือนหน้าค่อยมาใหม่ แล้วรีบเดินออกไป

        คืนนั้น{mate}เขียนชื่อเดิมของ{name}ลงแผ่นไม้เล็กๆ แขวนไว้หัวเตียง ทุกเช้าอ่านก่อนลืมตาเต็มที่ เดือนต่อมาคนทวงหนี้มาตามนัด {name}จ่ายเงินให้ไปโดยไม่ให้{mate}ออกมา
      effects: { gold: -3, people: [{ id: "@mate", closeness: 1 }], flags: [a_spouse_could_not_say_the_name] }

# ---------- 7 อยู่กับมัน: ตะเกียงสองดวง ----------
- id: adult.sky_borrower_two_lamps
  stage: adult
  weight: 60
  once: false
  scene: home
  time: night
  cast:
    pal: { bond: [friend], optional: true }
  when:
    age: [16, 130]
    year: [364, 410]
    trait: curse_shadow
  text: |
    ค่ำนี้น้ำมันตะเกียงเหลือพอสำหรับดวงเดียวถึงเช้า หรือสองดวงถึงเที่ยงคืน ไฟดวงเดียวในห้องทำให้มีเงาของ{name}สองเงาบนผนัง เงาหนึ่งทำตาม อีกเงาไม่ค่อยทำ
  choices:
    - id: buy_more_oil
      label: ลงไปซื้อน้ำมันเพิ่ม จุดสองดวงทั้งคืน
      text: |
        คนขายน้ำมันตะเกียงหัวซอยรินให้เต็มขวดโดยไม่ต้องบอก เขาขายให้บ้านที่จุดไฟสองดวงมาหลายบ้านแล้ว คืนนั้นเงาสองเงาบนผนังขยับพร้อมกันทุกครั้ง นับง่าย
      effects: { gold: -1, flags: [kept_two_lamps_burning] }
    - id: one_lamp_tonight
      label: จุดดวงเดียวประหยัดน้ำมัน
      habit: tight_fist
      text: |
        {name}หันหน้าเข้าผนังนอน หลับตาแล้วก็ยังรู้ว่าบนผนังข้างหลังมีอะไรขยับ ตอนดึกเงาที่ไม่ค่อยทำตามมานั่งปลายเตียง ผ้าห่มตรงนั้นยุบลงนิดหนึ่ง เช้ามาตาแดงทั้งสองข้าง
      effects: { hp: -1, flags: [slept_by_one_lamp] }
    - id: sleep_before_dark
      label: ดับไฟทั้งหมด นอนตั้งแต่ฟ้ายังไม่มืด
      text: |
        ไม่มีไฟ ก็ไม่มีเงาสักเงา {name}เข้านอนตอนนกยังร้อง หลับยาวจนสางเป็นครั้งแรกในรอบเดือน เพื่อนบ้านถามว่าป่วยหรือเปล่า บ้านมืดตั้งแต่หัวค่ำ
      effects: { hp: 1, flags: [slept_before_the_lamps] }
    - id: pal_brings_a_lamp
      label: ให้{pal}หิ้วตะเกียงของตัวเองมานั่งเล่นด้วย
      requires: { cast: [pal] }
      text: |
        {pal}วางตะเกียงของตัวเองไว้อีกมุมห้อง นั่งเล่นไพ่กันจนดึก บนผนังมีเงาสี่เงา ของ{name}สอง ของ{pal}สอง {pal}ชี้ให้ดูแล้วหัวเราะ บอกว่าวันนี้ตัวเองก็เกินเหมือนกัน
      effects: { people: [{ id: "@pal", closeness: 1 }], flags: [a_friend_brought_the_second_lamp] }

# ---------- 8 ทางออกของชื่อ ----------
- id: adult.sky_borrower_old_name
  stage: adult
  weight: 150
  once: false
  scene: road
  when:
    age: [16, 130]
    year: [364, 410]
    trait: curse_nameless
    not_flags: [took_a_new_name]
  text: |
    นักบวชออสซาที่เฝ้าประตูสุสานรู้เรื่องชื่อมากกว่าใคร เพราะชื่อเป็นของชิ้นสุดท้ายที่คนตายทิ้งไว้ที่ประตู แกนั่งฟัง{name}เล่า ถามซ้ำสามรอบว่า{name}เป็นใคร แล้วจดไว้บนหลังมือตัวเองกันลืม

    แกว่าชื่อที่หลุดไปแล้วยังติดอยู่ที่ปากคนที่เรียกมันก่อนใคร ให้กลับไปหาคนที่รู้จักกันมาตั้งแต่เด็กสามคน ให้ยืนเรียกชื่อเดิมพร้อมกันตอนรุ่ง หรือไม่ก็ตามไปเอาคืนจากมือคนที่ถือมันอยู่ ทางหลังต้องรู้ก่อนว่ามันใช้ชื่อนั้นอยู่ที่ไหน แกบอกว่าคนส่วนมากเลือกทางที่สาม ตั้งชื่อใหม่ แล้วย้ายไปอยู่ที่ที่ไม่มีใครรู้จัก แกไม่ว่าใคร
  choices:
    - id: three_at_dawn
      label: กลับไปหาคนที่รู้จักกันมาตั้งแต่เด็กสามคน พาไปยืนเรียกชื่อพร้อมกันตอนรุ่ง
      text: |
        ทางกลับไปถิ่นเก่ากินเงินกว่าที่คิด คนแรกจำหน้า{name}ไม่ได้ แต่จำเสียงไอได้ ไอแบบเดียวกับตอนเด็ก คนที่สองต้องจ้างให้ทิ้งงานมาครึ่งวัน คนที่สามต้องไปตามถึงห้องเช่าอีกฝั่งเมือง ทั้งสามคนนึกชื่อเดิมไม่ออกสักคนจน{name}เล่าเรื่องที่ทั้งสี่ทำไว้ด้วยกันตอนเด็ก เรื่องที่ไม่มีใครกล้าเล่าให้พ่อแม่ฟัง

        รุ่งเช้าทั้งสามยืนเรียงกันที่หน้าบ้านเก่า เรียกชื่อพร้อมกัน เสียงไม่ตรงกันสักคน คนหนึ่งเรียกชื่อเล่น คนหนึ่งเรียกเต็ม คนหนึ่งเรียกแบบที่แม่ของ{name}เคยเรียก {name}หันไปตามเสียง หันได้ทันที ไม่ต้องนึก ขากลับคนเลี้ยงม้าที่ทางพักจำหน้า{name}ได้ตั้งแต่ไกล ถามว่าคราวก่อนไปไหนมา
      effects: { lose_traits: [curse_nameless], marks: { star: -1 }, gold: -3, flags: [called_back_by_three_childhood_friends] }
    - id: hunt_the_name
      label: ตามรอยหนี้กับจดหมายที่จ่าหน้าชื่อเดิม ไปเอาชื่อคืนจากมือมัน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ทุกกระดาษที่มีชื่อเดิมมาจากที่ต่างกัน แต่วันที่ไล่กันเป็นทางเดียว {name}ตามไปถึงโรงเตี๊ยมแห่งหนึ่ง สมุดลงชื่อแขกมีชื่อเดิมของ{name} ลายมือของ{name} ห้องท้ายระเบียง {name}ยืนที่ประตูห้อง แล้วพูดชื่อนั้นออกไปก่อน พูดดัง ครบทุกพยางค์

          ชายในห้องหันมา ยิ้มช้าไปครึ่งจังหวะ แล้วลุกออกทางประตูหลังโดยไม่หยิบอะไรไปสักชิ้น {name}กลับลงมาดูสมุดลงชื่อแขก หมึกตรงชื่อนั้นเข้มขึ้นเหมือนเพิ่งเขียน เจ้าของโรงเตี๊ยมเงยหน้ามาทัก{name}ด้วยชื่อนั้น
        effects: { lose_traits: [curse_nameless], marks: { star: -1 }, flags: [took_the_name_back_from_the_double] }
      failure:
        text: |
          รอยกระดาษพาไปถึงห้องเช่าห้องหนึ่ง ห้องว่าง เจ้าของห้องบอกว่าแขกชื่อนั้นเพิ่งย้ายออกไปเมื่อสามวันก่อน จ่ายค่าห้องครบ ขอบคุณทุกคน ไม่บอกว่าไปไหน ทั้งค่าเดินทาง ค่าห้อง ค่าเลี้ยงเหล้าคนที่รู้ทาง หมดไปเปล่าๆ

          ในลิ้นชักโต๊ะมีกระดาษแผ่นหนึ่ง ลายมือ{name} เขียนชื่อเดิมซ้ำๆ ไว้ทั้งแผ่น ตัวหนังสือค่อยๆ สวยขึ้นทีละบรรทัด
        effects: { gold: -2, flags: [lost_the_trail_of_the_name] }
    - id: take_a_new_name
      label: ตั้งชื่อใหม่ให้ตัวเอง แล้วเริ่มใหม่ที่ไม่มีใครรู้จัก
      text: |
        {name}ลองชื่อใหม่ที่หน้าประตูสุสาน ลองสามชื่อ นักบวชฟังแล้วเลือกให้ชื่อหนึ่ง บอกว่าชื่อนี้ไม่มีใครในสมุดของแกใช้มาสองชั่วคน แกเขียนชื่อนั้นลงหลังมือตัวเองข้างชื่อเดิมที่จดไว้ แล้วล้างชื่อเดิมออกด้วยน้ำลาย
      effects: { flags: [took_a_new_name] }

# ---------- 8 ทางออกของเงา ----------
- id: adult.sky_borrower_three_lights
  stage: adult
  weight: 150
  once: false
  scene: home
  when:
    age: [16, 130]
    year: [364, 410]
    trait: curse_shadow
    not_flags: [kept_the_second_shadow]
  text: |
    ช่างทำโคมที่ขายตะเกียงคู่ให้{name}มาตลอดรู้ทางออกสองทาง เขาเล่าระหว่างห่อตะเกียง ทางแรก ยืนกลางแสงที่มาจากสามทางพร้อมกันตั้งแต่ค่ำจนรุ่ง ให้เงาทุกเงาหดลงมาเหลือเงาเดียวใต้เท้า ห้ามให้ดวงไหนดับก่อนสาง ทางที่สอง ยกเงาที่เกินให้ของชิ้นหนึ่งที่ใช้มานาน วางของชิ้นนั้นไว้ข้างตัวหน้าไฟดวงเดียว รอจนเงาที่เกินย้ายไปอยู่กับของ แล้วเอาของนั้นไปฝัง

    เขาบอกว่าของที่เงายอมย้ายไปหา ต้องเป็นของที่{name}เสียดาย ของถูกๆ เงาไม่ไป
  choices:
    - id: three_lights_till_dawn
      label: เช่าตะเกียงอีกสองดวง ยืนกลางแสงสามทางจนรุ่ง
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ตะเกียงสามดวงตั้งเป็นสามมุมรอบตัว {name}ยืนตรงกลาง ไม่นั่ง เงาทุกเงาหดลงมาเหลือวงดำเล็กๆ ใต้เท้า ตอนดึกวงนั้นดิ้น ดึงข้อเท้าเหมือนอยากออกไปอยู่ที่ผนัง {name}ไม่ขยับเท้า ขาชาไปถึงเอว ตอนจวนสาง ดวงหนึ่งกินน้ำมันจนแห้ง {name}เติมทันก่อนเปลวจะหรี่

          สางแล้ว ดับตะเกียงสองดวง เหลือดวงเดียว บนผนังมีเงาของ{name}เงาเดียว {name}ยกมือ เงายกตาม ตรงจังหวะ
        effects: { lose_traits: [curse_shadow], marks: { star: -1 }, gold: -2, flags: [stood_in_three_lights_till_dawn] }
      failure:
        text: |
          ตอนดึกขาเริ่มสั่น {name}ทรุดลงนั่งแค่ครู่เดียว ตะเกียงดวงหนึ่งโดนแขนเสื้อปัดล้ม ดับ แสงเหลือสองทาง บนผนังด้านที่มืดมีเงาลุกขึ้นยืนทันที ยืนตรง ไม่ก้มตามที่{name}ก้ม

          ค่าเช่าตะเกียงสองดวงจ่ายไปแล้ว คืนต่อมา{name}กลับไปจุดไฟสองดวงเหมือนเดิม
        effects: { gold: -2, flags: [failed_the_three_lights] }
    - id: give_it_to_a_chair
      label: ยกเงาให้เก้าอี้ไม้ตัวที่นั่งมาทุกวัน แล้วเอาไปฝัง
      text: |
        เก้าอี้ไม้ตัวนั้นนั่งมานานจนที่วางแขนสึกเป็นรอยมือ {name}วางไว้ข้างตัวหน้าไฟดวงเดียว นั่งกับพื้นข้างเก้าอี้ทั้งคืน ใกล้สาง เงาที่เกินค่อยๆ เลื่อนออกจากผนังไปทาบอยู่บนเก้าอี้ แล้วไม่กลับมา บนผนังเหลือเงาของ{name}เงาเดียว กับเงาเก้าอี้ที่ดำกว่าเงาเก้าอี้ทั่วไป

        {name}จ้างคนขุดหลุมลึกเท่าตัวคนที่มุมลานหลังบ้าน ฝังเก้าอี้ทั้งตัว คนขุดถามว่าทำไมไม่ขายเอาเงิน ไม้ยังดีอยู่ บ้านไม่มีเก้าอี้ตัวนั้นแล้วโต๊ะดูแปลกไปหลายเดือน
      effects: { lose_traits: [curse_shadow], marks: { star: -1 }, gold: -1, flags: [buried_the_shadow_in_a_chair] }
    - id: keep_two_lamps
      label: ซื้อตะเกียงคู่ใหม่ แล้วจุดสองดวงต่อไป
      text: |
        ช่างทำโคมห่อตะเกียงสองดวงให้เหมือนทุกครั้ง แถมไส้สำรองให้อีกคู่ บอกว่าลูกค้าส่วนมากก็ซื้อคู่ใหม่ ไม่มีใครยอมยืนทั้งคืน ไม่มีใครยอมฝังของที่เสียดาย
      effects: { flags: [kept_the_second_shadow] }
