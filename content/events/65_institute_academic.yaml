# ชุด ม สถาบันเวทหลวง: บันไดของนักวิจัย (8 เรื่อง)
# ผู้ช่วยอาจารย์ (institute_assistant มีอยู่แล้วจาก adult.mid_researcher_seat) อาจารย์ อาจารย์ใหญ่ของสำนัก อธิการ
# ทุกเรื่องต้องมี job_researcher อ่านได้ทั้งคนที่จบจากสถาบันและคนที่เข้ามาตอนสิบแปดโดยไม่ได้เรียนหกปี
#   คนที่จบมีทางของตัวเองผ่าน requires: { flag: institute_graduate }
# ไม่รู้ว่าตัวละครอยู่สำนักไหน ไม่เอ่ยชื่อสำนัก ไม่ใช้ flag saw_the_*_secret เรียกแค่ "ห้องที่ไม่มีในผังของสำนัก"
# เรื่องเดิมใน 88_ กันไว้แล้ว: adult.career_researcher_lowan ไม่ออกกับคนที่เป็นอาจารย์ใหญ่ของสำนัก (อาจารย์ใหญ่ในเรื่องนั้นเป็นคนอื่น)
#   และ adult.career_researcher_tables ไม่ออกกับอธิการ (ฉากวางมือของอธิการอยู่ในชุดวัยชรา)
# เรื่องที่เอ่ยถึงอาจารย์ใหญ่หรืออธิการบาเซลเป็นคนอื่น ต้องไม่ออกหลังตัวละครขึ้นตำแหน่งนั้นเอง (ดู not_flags ของแต่ละเรื่อง)

- id: adult.academy_second_seat
  stage: adult
  scene: institute
  weight: 30
  when:
    age: [33, 44]
    flags: [job_researcher]
    not_flags: [institute_assistant]
  text: |
    ตำแหน่งผู้ช่วยอาจารย์ใต้หลังคาตึกตะวันตกว่างอีกครั้ง คนที่ได้ไปเมื่อหลายปีก่อนขึ้นเป็นอาจารย์แล้ว ห้องที่มีหน้าต่างเปิดได้ เงินเดือนเพิ่มสี่เหรียญ ลูกศิษย์สองคน กับเสียงหนึ่งเสียงในที่ประชุมว่าเงินทุนปีหน้าจะไปโต๊ะไหน ทุกอย่างเหมือนครั้งก่อน ยกเว้นว่าคราวนี้{name}เป็นคนที่นั่งโต๊ะเดิมใต้หลังคามานานที่สุดในตึก โดยไม่มีตำแหน่งอะไรต่อท้ายชื่อ

    คนชิงอีกคนชื่อทาริน อายุน้อยกว่า{name}เกือบสิบปี สอบจบปีหกเป็นที่หนึ่งของรุ่น ยกชาไปวางให้ทุกโต๊ะในตึกตั้งแต่สัปดาห์แรกที่ย้ายขึ้นมา ทุกคนรู้ว่าในกระเป๋าเสื้อของเขามีจดหมายจากคนที่จ่ายเงินให้ห้องที่เขานั่งอยู่ ไม่มีใครเห็นจดหมายนั้น เพราะไม่มีใครต้องเห็น

    ที่ประชุมนัดวันเวรัสหน้า ทารินยกชามาวางบนโต๊ะของ{name}เมื่อเช้านี้ด้วย ถ้วยยังอุ่น
  choices:
    - id: stand_again
      label: ยืนเสนองานของตัวเองต่อที่ประชุมอีกครั้ง
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}ไม่ได้เสนองานของปีนี้ เสนองานของทุกปีที่นั่งอยู่ใต้หลังคา วางเรียงบนโต๊ะประชุมตั้งแต่แผ่นแรกจนแผ่นล่าสุด ตารางที่คนในตึกใช้กันทุกวันโดยไม่รู้ว่าใครทำ อยู่ในกองนั้นสี่แผ่น ทารินเสนองานของเขาดี ดีกว่าที่{name}ทำได้ตอนอายุเท่าเขา

          ที่ประชุมให้ตำแหน่งกับ{name} ห่างกันสองเสียง ทารินเป็นคนแรกที่ลุกมาจับมือ มือเขาอุ่นเหมือนถ้วยชา เช้าวันรุ่งขึ้นบนโต๊ะในห้องใหม่มีชาวางอยู่หนึ่งถ้วย
        effects: { stats: { INT: 1 }, gold: 4, reputation: { royal_institute: 1 }, flags: [institute_assistant] }
      failure:
        text: |
          ทารินเสนอเสร็จแล้วมีคนในที่ประชุมปรบมือ ที่ตึกตะวันตกไม่มีใครปรบมือให้ใครมาหลายปีแล้ว {name}เสนองานต่อจากเสียงนั้น ทุกตัวเลขถูก ทุกแผ่นครบ ที่ประชุมฟังจนจบด้วยหน้าตาของคนที่ตัดสินใจไปแล้ว

          ตำแหน่งเป็นของทาริน กระดาษที่{name}ซื้อมาทำตารางชุดใหม่สำหรับวันนี้ ราคาเท่าค่าเช่าห้องครึ่งเดือน กองอยู่บนโต๊ะเดิมใต้หลังคา ยังไม่มีใครขอยืมไปดู
        effects: { gold: -2, flags: [lost_the_seat_twice] }
    - id: the_last_examiner
      label: ไปเคาะประตูอาจารย์คนที่ถามข้อสุดท้ายในวันสอบจบปีหก
      requires: { flag: institute_graduate }
      text: |
        อาจารย์คนนั้นยังจำได้ จำคำถามได้ จำคำตอบได้ จำได้ด้วยว่า{name}ตอบช้าไปหนึ่งลมหายใจก่อนจะพูด เขานั่งอยู่ในที่ประชุมมาสามปีแล้ว เขาไม่สัญญาอะไร ขอแค่ให้{name}ทิ้งงานไว้ให้อ่านหนึ่งคืน

        วันประชุมเขาพูดก่อนใคร พูดไม่ยาว พูดเรื่องคำตอบข้อนั้นในวันสอบจบ ไม่ได้พูดเรื่องงานบนโต๊ะสักคำ ที่ประชุมให้ตำแหน่งกับ{name} ทารินได้ห้องข้างๆ ที่ไม่มีหน้าต่าง และยังยกชามาวางให้ทุกเช้าเหมือนเดิม
      effects: { gold: 4, reputation: { royal_institute: 1 }, flags: [institute_assistant] }
    - id: meron_above
      label: รับข้อเสนอของเมรอน ฮาสทิล ให้ชื่อเขาอยู่เหนือชื่อตัวเองในตารางฉบับหน้า
      requires: { flag: meron_rival }
      text: |
        เมรอนนั่งอยู่ในที่ประชุมตั้งแต่ปีที่ชนะ{name}ไปหนึ่งเสียง ข้อเสนอของเขามาพร้อมถาดอาหารเย็นจากร้านแพงในย่านสถาบัน ไม่มีกระดาษ ไม่มีลายเซ็น เสียงของเขาไปที่{name} ตารางฉบับหน้าของ{name}มีชื่อเขาอยู่บรรทัดแรก

        ที่ประชุมให้ตำแหน่งกับ{name} เมรอนเป็นคนแรกที่ลุกมาจับมือ เดือนต่อมาตารางของ{name}ออกจากตึกตะวันตกพร้อมชื่อสองชื่อ ชื่อบนตัวใหญ่กว่า หมึกเข้มกว่า
      effects: { gold: 4, alignment: { moral: -1 }, flags: [institute_assistant, put_meron_above_your_name] }
    - id: step_aside
      label: ไปบอกทารินก่อนวันประชุมว่าจะไม่ชิง
      text: |
        ทารินไม่ได้ทำหน้าดีใจ เขาถามว่าทำไม {name}บอกว่าโต๊ะใต้หลังคาตัวนี้นั่งสบายแล้ว เขาไม่เชื่อ แต่ก็ไม่ถามซ้ำ

        ปลายปี ตอนที่ประชุมแบ่งเงินทุน เสียงหนึ่งเสียงที่ได้มาพร้อมตำแหน่งผู้ช่วยอาจารย์ของทาริน ไปลงที่โต๊ะของ{name} โต๊ะที่ไม่มีหน้าต่าง ได้เงินทุนมากที่สุดในตึกปีนั้น ไม่มีใครในตึกเข้าใจว่าทำไม นอกจากสองคน
      effects: { gold: 3, flags: [stepped_aside_for_tarin] }

- id: adult.academy_better_student
  stage: adult
  scene: laboratory
  weight: 30
  when:
    age: [30, 46]
    flags: [job_researcher, institute_assistant]
    not_flags: [institute_head_of_school]
  text: |
    ยาลินเป็นเด็กทุนจากหมู่บ้านทางใต้ ปกเสื้อด้านในยังมีเลขปักด้ายสีเทา งานแรกที่{name}ให้เธอทำคืองานแรกที่ลูกศิษย์ทุกคนในตึกตะวันตกต้องทำ คัดตารางของอาจารย์ตัวเองลงสมุด ทั้งเล่ม ให้รู้ว่ามือของอาจารย์เดินอย่างไร

    สมุดกลับมาวางบนโต๊ะในเดือนที่สาม ข้างแถวที่สี่สิบเอ็ดของแผ่นที่เก้ามีจุดดินสอเล็กๆ หนึ่งจุด {name}ไล่ตัวเลขแถวนั้นซ้ำ แล้วไล่อีกรอบ ตัวเลขในแถวนั้นผิดหนึ่งหลัก ผิดมาตั้งแต่วันที่{name}เขียน ตารางแผ่นนั้นเป็นแผ่นที่ทั้งตึกใช้กันอยู่ทุกวัน

    ยาลินยืนรออยู่ที่ประตู ไม่ได้ถามว่าจุดนั้นถูกหรือผิด เธอรู้แล้ว เธออยากรู้อย่างเดียว ว่า{name}จะทำอย่างไรกับจุดนั้น
  choices:
    - id: her_name_first
      label: ส่งใบแก้ตัวเลขออกจากตึก ให้ชื่อของยาลินอยู่บรรทัดแรก
      text: |
        ที่ตึกตะวันตกไม่เคยมีใบแก้ที่ชื่อลูกศิษย์อยู่เหนือชื่ออาจารย์ คนในตึกอ่านชื่อนั้นแล้วอ่านซ้ำ อาจารย์ใหญ่เรียก{name}ไปถามว่าเด็กคนนี้เป็นใคร ถามแบบที่คนถามราคาของ

        ก่อนสิ้นฤดู มีคนจากผู้ที่จ่ายเงินให้สำนักมาขอยืมตัวยาลินไปทำงานในห้องที่{name}ไม่มีกุญแจ สถาบันให้ยืม เพราะเธอยังติดข้อผูกพันสิบปี เธอมาคืนสมุดเล่มนั้นให้{name}ในวันที่ย้ายห้อง ทุกหน้ายังมีจุดดินสออยู่ครบ ไม่ได้ลบออกสักจุด
      effects: { alignment: { moral: 1 }, reputation: { royal_institute: -1 }, people: [{ id: yalin, name: ยาลิน, gender: f, bond: friend, closeness: 2, age: 20 }], flags: [credited_yalin] }
    - id: quiet_fix
      label: แก้ตัวเลขแถวนั้นเองเงียบๆ ส่งใบแก้ในชื่อของตัวเอง
      text: |
        ใบแก้ออกจากตึกในชื่อ{name} ที่ประชุมชมว่ารู้จักตรวจงานตัวเองย้อนหลัง ให้เงินพิเศษสองเหรียญ คนในตึกแก้ตัวเลขในตารางของตัวเองตามทั้งตึก ด้วยหมึกคนละสี

        ยาลินคัดตารางเล่มที่สองต่อจนจบปี ไม่มีจุดดินสอสักจุด ทั้งที่{name}รู้ว่าตารางเล่มนั้นมีอีกสองแถวที่ไม่แน่ใจ เธอไม่ทำผิดสักตัว และไม่ชี้ให้ใครเห็นอีกเลย
      effects: { gold: 2, alignment: { moral: -1 }, people: [{ id: yalin, name: ยาลิน, gender: f, bond: rival, closeness: 1, age: 20 }], flags: [took_yalins_correction] }
    - id: find_where_you_slipped
      label: นั่งไล่หาให้เจอก่อน ว่าตัวเองพลาดตรงไหน แล้วส่งใบแก้ในสองชื่อ
      check: { stat: INT, dc: 14 }
      success:
        text: |
          สามคืน{name}ไล่ย้อนจากแถวที่สี่สิบเอ็ดขึ้นไปจนถึงต้นสาย เจอตัวที่ทดผิดในกระดาษทดแผ่นหนึ่งที่ยังเก็บไว้ในลิ้นชัก ลายมือตัวเองเมื่อหลายปีก่อน ทดเลขเจ็ดเป็นหนึ่ง เพราะตอนนั้นตะเกียงใกล้หมด

          ใบแก้ออกจากตึกพร้อมสองชื่อ ชื่อ{name}กับชื่อยาลิน ท้ายใบแนบกระดาษทดแผ่นนั้นไปด้วย ให้ทุกคนเห็นเลขเจ็ดที่เหมือนเลขหนึ่ง ปีต่อมามีลูกศิษย์ของอาจารย์คนอื่นสองคนมาขอย้ายมาอยู่กับ{name}
        effects: { stats: { INT: 1 }, people: [{ id: yalin, name: ยาลิน, gender: f, bond: friend, closeness: 1, age: 20 }], flags: [published_with_yalin] }
      failure:
        text: |
          สามคืน{name}หาไม่เจอว่าพลาดตรงไหน เช้าวันที่สี่ยาลินยืนอธิบายให้ฟังหน้ากระดานในห้องเรียน ต่อหน้าลูกศิษย์อีกห้าคน ใช้เวลาเท่ากับชาหนึ่งกา ตัวทดเลขเจ็ดที่เขียนเหมือนเลขหนึ่ง

          ธรรมเนียมของตึกตะวันตก อาจารย์ที่ลูกศิษย์แก้เลขให้ต่อหน้าห้องต้องจ่ายค่าชาทั้งห้อง {name}จ่าย ใบแก้ออกจากตึกในสองชื่อ ชื่อของ{name}อยู่บรรทัดแรก เพราะยาลินเป็นคนเขียน
        effects: { gold: -1, people: [{ id: yalin, name: ยาลิน, gender: f, bond: friend, closeness: 1, age: 20 }], flags: [yalin_corrected_you_in_class] }
    - id: celens_door
      label: พายาลินไปยืนที่ประตูห้องของเซเลน คอร์ดิส
      requires: { flag: presented_celens_table }
      text: |
        ประตูห้องของเซเลนยังเปิดเหมือนทุกวัน {name}ยื่นสมุดของยาลินให้ เปิดไว้ที่แผ่นที่เก้า เซเลนดูจุดดินสอจุดเดียวนั้น แล้วพลิกไปดูหน้าอื่นทุกหน้า ทุกหน้าไม่มีจุด เธอถามยาลินว่าแผ่นอื่นถูกหมดจริงไหม ยาลินบอกว่ามีอีกสองแถวที่ไม่แน่ใจ แต่ยังไม่กล้าชี้

        เซเลนบอกให้ชี้ ตั้งแต่สัปดาห์นั้นยาลินคัดตารางอยู่ในห้องที่ประตูไม่เคยปิด ใบแก้ออกจากตึกในชื่อยาลินกับชื่อ{name} ตามลำดับที่เซเลนเป็นคนเรียง
      effects: { alignment: { moral: 1 }, people: [{ id: yalin, name: ยาลิน, gender: f, bond: friend, closeness: 2, age: 20 }], flags: [sent_yalin_to_celen] }

- id: adult.academy_lecturer_gown
  stage: adult
  scene: classroom
  weight: 30
  when:
    age: [34, 50]
    flags: [job_researcher, institute_assistant]
    not_flags: [institute_lecturer]
  text: |
    ช่างตัดเสื้อของสถาบันเอาเชือกผูกปมทาบตัวคนชิงตำแหน่งอาจารย์ทุกคนก่อนวันลงคะแนน ทาบไหล่ ทาบแขน ทาบจากคอถึงข้อเท้า แล้วจดจำนวนปมไว้บนกระดาษคนละแผ่น เสื้อคลุมอาจารย์สีน้ำเงินที่เข้มจนเกือบดำ ช่างตัดให้ตัวเดียว ให้คนที่ชนะ กระดาษแผ่นที่เหลือช่างเก็บไว้ในลิ้นชัก บางแผ่นอยู่ในนั้นมายี่สิบปี

    ก่อนลงคะแนน คนชิงต้องบรรยายเปิดหนึ่งครั้งในห้องยาวชั้นล่างของตึกกลาง ห้องที่นักเรียนขอบเทาหกสิบคนนั่งคัดตารางกันอยู่ทุกวัน ใครจะถามอะไรก็ได้ อาจารย์ใหญ่ทุกสำนักนั่งแถวหลัง ข้างหลังพวกเขามีคนที่ไม่ใช่อาจารย์นั่งอยู่สามสี่คน เสื้อดีกว่าทุกคนในห้อง

    คนชิงปีนี้มีสองคน อีกคนเป็นที่ชอบของแถวหลังสุด ทุกคนรู้ ช่างตัดเสื้อก็รู้ เขาทาบเชือกบนตัวคนนั้นนานกว่าบนตัว{name}
  choices:
    - id: open_lecture
      label: ขึ้นยืนบรรยายเปิดในห้องยาว
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ไม่ได้พูดกับแถวหลัง พูดกับแถวหน้า เด็กขอบเทาที่นิ้วกลางยังมีรอยปากกากด {name}เล่าว่าตารางที่พวกเขาคัดอยู่ทุกวันมาจากไหน ใครทำ ผิดตรงไหนมาแล้วบ้าง แล้วใครเป็นคนแก้ เด็กคนหนึ่งยกมือถามว่าแล้วตารางที่ยังไม่มีใครเจอที่ผิดล่ะ {name}บอกว่านั่นคืองานของพวกเขา ห้องหัวเราะ แถวหลังไม่หัวเราะ แต่ก็ไม่มีใครลุก

          ที่ประชุมลงคะแนนในเย็นวันนั้น อธิการบาเซล มอร์เทน ลงชื่อในใบตั้งโดยไม่อ่าน แล้ววางปากกา ไม่พูดว่าเห็นด้วย ช่างตัดเสื้อหยิบกระดาษแผ่นของ{name}ออกจากลิ้นชัก เสื้อเสร็จในสิบวัน แขนเสื้อยาวไปครึ่งนิ้ว
        effects: { stats: { CHA: 1 }, mark: ขึ้นเป็นอาจารย์, reputation: { royal_institute: 1 }, flags: [institute_lecturer] }
      failure:
        text: |
          ครึ่งทาง เด็กขอบเทาแถวหน้ายกมือถามข้อหนึ่ง ข้อที่ไม่มีในตารางเล่มไหน {name}ตอบได้ครึ่งเดียว แล้วตอบส่วนที่เหลือด้วยคำว่าไม่ทราบ แถวหลังมีเสียงกระซิบ เด็กคนนั้นจดคำว่าไม่ทราบลงขอบสมุด

          ที่ประชุมให้เสื้อคลุมกับอีกคน ช่างตัดเสื้อส่งใบเก็บเงินมาที่โต๊ะของ{name}ในเดือนต่อมา ค่าทาบตัว ธรรมเนียมของสถาบัน คนที่ไม่ได้เสื้อเป็นคนจ่ายค่าเชือก กระดาษแผ่นของ{name}กลับลงไปอยู่ในลิ้นชัก
        effects: { gold: -2, flags: [lost_the_gown] }
    - id: the_long_room
      label: บรรยายเรื่องที่ตัวเองรู้ดีที่สุดในห้องนั้น ห้องที่เคยนั่งคัดตารางจนนิ้วแตกในปีหนึ่ง
      requires: { flag: institute_graduate }
      text: |
        {name}เดินไปนั่งโต๊ะตัวเดิม แถวที่สี่ ริมหน้าต่าง โต๊ะที่ขอบยังมีรอยมีดสลักชื่อเด็กสามรุ่นทับกัน แล้วเริ่มบรรยายจากตรงนั้น ไม่ได้ขึ้นไปยืนหน้าห้อง พูดเรื่องตารางแผ่นแรกที่ทุกคนต้องคัด ตัวเลขแถวไหนที่เด็กขอบเทาคัดผิดทุกรุ่น ผิดเพราะอะไร ทำไมรุ่นต่อมาถึงผิดซ้ำที่เดิม

        เด็กทั้งห้องเปิดสมุดของตัวเองไปที่แถวนั้น แล้วเงียบ ที่ประชุมลงคะแนนในเย็นวันนั้น อธิการบาเซล มอร์เทน ลงชื่อในใบตั้ง แล้ววางปากกา ไม่พูดว่าเห็นด้วยเหมือนทุกครั้ง ช่างตัดเสื้อหยิบกระดาษแผ่นของ{name}ออกจากลิ้นชัก
      effects: { mark: ขึ้นเป็นอาจารย์, reputation: { royal_institute: 1 }, flags: [institute_lecturer] }
    - id: pay_the_tailor
      label: ไปจ่ายค่าเสื้อคลุมให้ช่างตัดเสื้อเต็มราคา ก่อนวันลงคะแนน
      requires: { min_gold: 5 }
      text: |
        ช่างตัดเสื้อรับเงินโดยไม่ถามอะไร ห้าเหรียญ เขาตัดเสื้อตัวนั้นเสร็จก่อนวันบรรยายเปิด แขวนไว้บนหุ่นไม้หน้าร้านในย่านสถาบัน ที่ปกด้านในปักชื่อ{name}ไว้แล้ว ใครเดินผ่านก็เห็น

        วันลงคะแนน ที่ประชุมไม่มีใครอยากเป็นคนบอกช่างตัดเสื้อว่าเสื้อที่ปักชื่อแล้วต้องเลาะ อธิการบาเซล มอร์เทน ลงชื่อในใบตั้งของ{name} วางปากกา แล้วบอกที่ประชุมว่าปีหน้าให้ช่างตัดเสื้อรับเงินหลังวันลงคะแนน คำสั่งนั้นเป็นคำสั่งเดียวในปีนั้นที่เขาพูดออกมาเอง
      effects: { gold: -5, alignment: { law: -1 }, mark: ขึ้นเป็นอาจารย์, flags: [institute_lecturer] }
    - id: not_this_year
      label: ถอนชื่อ บอกช่างตัดเสื้อให้เก็บกระดาษแผ่นนั้นไว้ก่อน
      text: |
        ช่างตัดเสื้อพับกระดาษแผ่นของ{name}เป็นสองทบ เก็บเข้าลิ้นชักใบล่างสุด บอกว่าจำนวนปมของคนอายุเท่านี้ไม่ค่อยเปลี่ยน ยกเว้นรอบเอว

        อีกคนได้เสื้อไปโดยไม่ต้องลงคะแนนแข่งกับใคร เขาใส่มาเดินผ่านโต๊ะของ{name}ในวันแรก ชายเสื้อยาวลากพื้น ฝุ่นตึกตะวันตกติดขึ้นมาเป็นแถบสีเทา
      effects: { flags: [let_the_gown_go] }

- id: adult.academy_walkout_student
  stage: adult
  scene: dormitory
  weight: 30
  when:
    age: [36, 56]
    flags: [job_researcher, institute_lecturer]
    not_flags: [institute_head_of_school]
  text: |
    ดาเรสมาที่ห้องของ{name}ตอนตีหนึ่ง ย่ามสะพายไหล่ ข้างในมีเสื้อสองตัว สมุดทุกเล่มที่เขาเคยจด และรองเท้าอีกคู่ เขาเป็นลูกศิษย์ที่ถามน้อยที่สุดในห้อง และส่งงานตรงเวลาที่สุด คืนนี้เขาไม่ได้นั่ง

    เขาบอกว่าเมื่อค่ำเขาเดินผิดประตู เข้าไปในห้องที่ไม่มีในผังของสำนัก ไม่ได้ตั้งใจ อยู่ข้างในไม่นานเท่าที่ใช้นับถึงร้อย แล้วถอยออกมาเอง เขาไม่เล่าว่าข้างในมีอะไร เขาถามคำเดียว ว่าอาจารย์รู้ไหม

    ในมือเขาถือกระดาษลาออกหนึ่งแผ่น ช่องลงชื่ออาจารย์ที่ปรึกษายังว่าง ถ้ามีลายมือของอาจารย์ นายทะเบียนจะขีดชื่อเขาด้วยเส้นเดียว คนที่ลาออก ถ้าไม่มี ขีดสองเส้น คนที่โดนไล่ออก ทั้งสองแบบ เช้ามาเขาก็เป็นช่างเวทเถื่อนเท่ากัน
  choices:
    - id: sign_one_line
      label: ลงชื่อในช่องว่างให้เขา
      text: |
        {name}ลงชื่อ ดาเรสรอให้หมึกแห้งเอง ไม่เป่า แล้วพับกระดาษใส่ย่าม เขาไม่ได้ถามคำถามเดิมซ้ำ เพราะลายมือในช่องนั้นตอบไปแล้ว

        เช้ามานายทะเบียนขีดชื่อเขาด้วยเส้นเดียว สองฤดูต่อมามีโคมน้ำค้างดาวใบหนึ่งมาวางไว้หน้าประตูห้องของ{name} ไส้ใหม่ ต่อเรียบร้อย ไม่มีตราร้าน ไม่มีป้ายชื่อ ใต้ฐานโคมมีรอยขีดเส้นเดียวด้วยปลายมีด
      effects: { alignment: { moral: 1 }, reputation: { royal_institute: -1 }, flags: [signed_dares_out] }
    - id: talk_him_down
      label: ชวนเขานั่งลง แล้วพูดจนเขาวางย่าม
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ไม่ได้ตอบคำถามของเขา เล่าเรื่องอื่นแทน เรื่องคนที่ออกไปแล้วคนข้างในก็ยังทำแบบเดิมต่อ เรื่องคนที่อยู่ต่อ แล้วได้เป็นคนถือกุญแจในวันหนึ่ง ดาเรสฟังจนเทียนเหลือครึ่ง แล้ววางย่ามลงข้างเท้า

          เขาฉีกกระดาษลาออกเป็นสองท่อน ไม่ทิ้ง เก็บไว้ในสมุดเล่มที่จดอยู่ทุกวัน ตั้งแต่นั้นเขาถามในห้องเรียนมากกว่าทุกคน ส่งงานช้ากว่าเดิม และทุกคำถามของเขาเริ่มด้วยคำว่า ถ้า
        effects: { stats: { CHA: 1 }, flags: [kept_dares_in] }
      failure:
        text: |
          ดาเรสฟังได้ไม่นาน เขาบอกว่าอาจารย์พูดเหมือนคนที่รู้ แล้วเลือกจะไม่ตอบ การไม่ตอบก็เป็นคำตอบเหมือนกัน เขาเก็บกระดาษลาออกกลับใส่ย่ามโดยที่ช่องลงชื่อยังว่าง

          {name}เดินตามไปถึงประตูตะวันตก ยัดเหรียญใส่มือให้สองเหรียญเป็นค่ารถไฟ เขารับไว้ เพราะไม่มีเงินจริงๆ เช้ามานายทะเบียนขีดชื่อเขาสองเส้น
        effects: { gold: -2, flags: [dares_left_on_two_lines] }
    - id: wake_the_head
      label: บอกให้เขารอในห้อง แล้วเดินไปปลุกอาจารย์ใหญ่
      text: |
        อาจารย์ใหญ่ฟังในชุดนอน ถามแค่ชื่อเด็กกับเวลาที่เข้าห้องนั้น แล้วส่งคนไปที่ประตูตะวันตกก่อนตัวเองจะเปลี่ยนเสื้อ ตอน{name}เดินกลับมาถึงห้อง ห้องว่าง ย่ามไม่อยู่ กระดาษลาออกวางอยู่บนโต๊ะ ช่องลงชื่อยังว่าง

        ยามจับดาเรสได้ที่ซุ้มประตูก่อนสาง เช้ามานายทะเบียนขีดชื่อเขาสองเส้น ปลายเดือน{name}ได้ห้องใหม่ที่มีหน้าต่างสองบาน และได้รับมอบลูกศิษย์อีกสองคน ไม่มีคนไหนถามอะไรในห้องเรียนเลย
      effects: { alignment: { law: 1, moral: -1 }, reputation: { royal_institute: 1 }, flags: [reported_dares] }
    - id: your_own_year_three
      label: เล่าให้เขาฟังเรื่องปีสามของตัวเอง ปีที่รู้เป็นครั้งแรกว่าประตูไหนไม่มีในผัง
      requires: { flag: institute_graduate }
      text: |
        {name}เล่าตามจริง ประตูบานไหน คืนไหน อาจารย์ที่ปรึกษาคนไหนเป็นคนเปิดให้ดู แล้วเล่าต่อว่าหลังจากคืนนั้น{name}ทำอะไร อยู่ต่อ เรียนต่อ จนวันนี้นั่งอยู่ตรงนี้ ส่วนที่ไม่ได้ทำ{name}ก็เล่า ไม่ได้ข้าม

        ดาเรสฟังจนจบ แล้วบอกว่าเขาขอเวลาหนึ่งสัปดาห์ กระดาษลาออกเขาฝากไว้บนโต๊ะของ{name} ช่องลงชื่อยังว่าง สัปดาห์นั้นเขามาเรียนทุกวัน วันสุดท้ายของสัปดาห์ กระดาษแผ่นนั้นหายไปจากโต๊ะ ไม่มีใครเห็นว่าใครหยิบ
      effects: { alignment: { moral: 1 }, flags: [told_dares_about_your_year_three] }

- id: adult.academy_head_falls
  stage: adult
  scene: institute
  weight: 30
  when:
    age: [42, 58]
    flags: [job_researcher, institute_lecturer]
    not_flags: [institute_head_of_school]
  text: |
    อาจารย์ใหญ่ของสำนักนอนอยู่ที่เชิงบันไดหินของตึกตะวันตกตอนเช้ามืด คอหัก คนกวาดลานเป็นคนเจอ คนในตึกครึ่งหนึ่งบอกว่าคืนนั้นน้ำค้างแข็งเกาะบันไดจนลื่น อีกครึ่งพูดเบากว่า ว่าตั้งแต่ฤดูก่อน คนที่จ่ายเงินให้สำนักเลิกส่งถุงเงินมาที่โต๊ะของเขา ส่งไปที่โต๊ะอื่นแทน

    วันรุ่งขึ้นหลังงานศพ ชายจากผู้ที่จ่ายเงินให้สำนักขึ้นมาบนตึกตะวันตก ไม่บอกว่ามาจากไหน ไม่ต้องบอก เขาเข้าห้องอาจารย์ทีละห้อง ห้องละหนึ่งนาฬิกาทราย ถามคำถามเดียวกันทุกห้อง กุญแจห้องที่ไม่มีในผังของสำนัก ถ้าอยู่กับท่าน ท่านจะเอาไปทำอะไร

    ห้องของ{name}เป็นห้องที่สี่ ทรายในนาฬิกาเริ่มไหลตอนเขานั่งลง
  choices:
    - id: his_answer
      label: ตอบว่ากุญแจจะไม่ไขให้ใครนอกจากคนที่จ่ายเงิน
      text: |
        เขาไม่จดอะไร ฟังจนจบ แล้วลุกขึ้นก่อนทรายจะหมด เดินไปห้องที่ห้าเพื่อถามคำถามเดิม เพราะต้องถามให้ครบทุกห้อง

        สามวันต่อมาอธิการบาเซล มอร์เทน ลงชื่อในใบตั้งอาจารย์ใหญ่ของสำนักคนใหม่ วางปากกา ไม่พูดว่าเห็นด้วย ใบตั้งมีชื่อ{name} ถุงเงินถุงแรกมาถึงโต๊ะในห้องใหม่ก่อนช่างทาสีจะลบชื่อคนเก่าออกจากประตูเสร็จ
      effects: { gold: 3, alignment: { law: 1, moral: -1 }, mark: ขึ้นเป็นอาจารย์ใหญ่ของสำนัก, flags: [institute_head_of_school, took_the_chair_on_the_payers_word] }
    - id: own_answer
      label: ตอบตามที่คิดจริงทุกคำ
      check: { stat: WIS, dc: 15 }
      success:
        text: |
          {name}พูดจนทรายหมดนาฬิกา เรื่องห้องนั้นเท่าที่รู้ เรื่องที่ไม่ควรมีใครถือกุญแจคนเดียว เรื่องที่สถาบันเรียกตัวเองว่าความรู้ที่ไม่มีเจ้าของ เขาพลิกนาฬิกาทรายครั้งหนึ่งให้{name}พูดต่อ ไม่ได้พลิกให้ห้องอื่น

          ที่โต๊ะสุดท้ายก่อนเขาลงบันได เขาบอกอาจารย์คนหนึ่งว่าคนที่บอกตามจริงหาง่ายกว่าคนที่บอกสิ่งที่เขาอยากฟัง และไว้ใจได้นานกว่า ใบตั้งที่อธิการบาเซล มอร์เทน ลงชื่อในสามวันต่อมามีชื่อ{name} ถุงเงินมาถึงช้ากว่าที่อาจารย์ใหญ่คนก่อนเคยได้หนึ่งเดือน
        effects: { stats: { WIS: 1 }, mark: ขึ้นเป็นอาจารย์ใหญ่ของสำนัก, flags: [institute_head_of_school, took_the_chair_on_your_own_word] }
      failure:
        text: |
          {name}พูดเรื่องที่คิดจริง พูดยาว ทรายหมดก่อนจบ เขาลุกขึ้นตอนเม็ดสุดท้ายตก ขอบคุณ แล้วไปห้องที่ห้า ไม่ได้พลิกนาฬิกา

          ใบตั้งในสามวันต่อมามีชื่ออาจารย์อีกคน ห้องที่หก เดือนต่อมาอาจารย์ใหญ่คนใหม่ตัดเงินทุนห้องของ{name}ลงครึ่งหนึ่ง เขียนเหตุผลไว้บรรทัดเดียว ว่างานของห้องนี้ช้าเกินไป
        effects: { gold: -2, flags: [lost_the_chair] }
    - id: back_meron
      label: บอกเขาว่าคนที่ควรได้คือเมรอน ฮาสทิล แล้วถามว่าคนพูดชื่อนั้นจะได้อะไร
      requires: { flag: meron_rival }
      text: |
        ชายคนนั้นยิ้มเป็นครั้งแรกตั้งแต่ขึ้นมาบนตึก บอกว่ามีคนพูดชื่อนี้มาแล้วสามห้อง ห้องของ{name}เป็นห้องแรกที่ถามว่าจะได้อะไร เขาตอบด้วยตัวเลข ตัวเลขนั้นมาถึงโต๊ะของ{name}ในถุงผ้าสีเทาในอีกเจ็ดวัน

        เมรอนได้ใบตั้ง ในงานเลี้ยงขึ้นตำแหน่ง เขาชนแก้วกับ{name}เป็นคนแรก แล้วบอกว่าเขารอวันนี้มาตั้งแต่วันที่ชนะ{name}ไปหนึ่งเสียง ไม่ได้รอใบตั้ง รอดูว่า{name}จะพูดชื่อเขาเมื่อไร
      effects: { gold: 4, alignment: { moral: -1 }, flags: [backed_meron_for_the_chair] }
    - id: ask_about_the_stairs
      label: ถามเขากลับว่าอาจารย์ใหญ่ลื่นบันไดจริงหรือ
      text: |
        เขาตอบว่าน้ำค้างแข็งเกาะบันไดหินทุกคืนในเดือนนี้ ตอบด้วยเสียงเดียวกับที่ถามเรื่องกุญแจ แล้วรอให้{name}ตอบคำถามของเขาต่อ {name}ไม่ได้ตอบ ทรายหมดนาฬิกา เขาลุกขึ้นไปห้องที่ห้า

        ใบตั้งในสามวันต่อมามีชื่ออาจารย์อีกคน คืนนั้น{name}เดินลงบันไดหินของตึกตะวันตกช้าๆ ทีละขั้นจนถึงเชิงบันได ขั้นที่สามจากล่างมีรอยกะเทาะใหม่ที่ขอบ เท่าส้นรองเท้า
      effects: { flags: [asked_about_the_stairs] }

- id: adult.academy_the_key
  stage: adult
  scene: laboratory
  weight: 30
  when:
    age: [44, 62]
    flags: [job_researcher, institute_head_of_school]
    not_flags: [institute_rector, lost_the_rectors_pen, passed_the_rectors_pen]
  text: |
    พวงกุญแจของอาจารย์ใหญ่ของสำนักมีกุญแจสิบเจ็ดดอก สิบหกดอกมีป้ายทองเหลืองบอกว่าไขห้องไหน ดอกที่สิบเจ็ดไม่มีป้าย ไขห้องที่ไม่มีในผังของสำนัก {name}ถือพวงนี้มาตั้งแต่วันรับตำแหน่ง รู้น้ำหนักโดยไม่ต้องชั่ง

    ปีละครั้ง วันเดิม ชายจากผู้ที่จ่ายเงินให้สำนักมาเดินดูห้องนั้นกับอาจารย์ใหญ่ ใช้เวลาหนึ่งนาฬิกาทราย ไม่แตะอะไร ไม่ถามอะไร แล้วออกมาลงชื่อในกระดาษแผ่นเดียวกับที่อาจารย์ใหญ่ลงชื่อ ว่าห้องนั้นไม่มี ถุงเงินของทั้งปีวางลงบนโต๊ะหลังหมึกแห้ง

    ปีนี้กระดาษยาวกว่าเดิมหนึ่งบรรทัด สมุดจดของห้องนั้นทุกเล่ม เมื่อสิ้นปีให้ส่งไปเก็บที่บ้านของผู้จ่าย ไม่ใช่ห้องสมุดของสถาบัน เขาวางปากกาไว้ข้างกระดาษ แบบที่วางทุกปี
  choices:
    - id: sign_it
      label: ลงชื่อใต้บรรทัดใหม่
      text: |
        หมึกแห้ง ถุงเงินวางลง หนักกว่าปีก่อน ก่อนกลับเขาขอสมุดของปีนี้ไปเลย ไม่ต้องรอสิ้นปี {name}ยื่นให้ห้าเล่ม เขานับ ใส่ย่ามหนัง แล้วลงบันไดไป

        ชั้นในห้องนั้นที่เคยมีสมุดเรียงเต็ม ตอนนี้เหลือที่ว่างกว้างเท่าแขน คืนนั้น{name}ใช้กุญแจดอกที่สิบเจ็ดเปิดห้อง นั่งดูชั้นว่างอยู่จนเทียนหมด แล้วล็อกประตูกลับ
      effects: { gold: 4, alignment: { law: 1, moral: -1 }, flags: [signed_the_payers_line] }
    - id: strike_the_line
      label: ขีดฆ่าบรรทัดใหม่ แล้วลงชื่อใต้บรรทัดเก่า
      check: { stat: CHA, dc: 15 }
      success:
        text: |
          เขาอ่านบรรทัดใต้เส้นขีดสองรอบ แล้วลงชื่อใต้ชื่อ{name} ไม่เอ่ยถึงบรรทัดที่ขีด ถุงเงินวางลง เบากว่าปีก่อนเท่าเงินเดือนผู้ช่วยอาจารย์หนึ่งคน

          ปีนั้นสมุดของห้องที่ไม่มีในผังยังอยู่บนชั้นครบทุกเล่ม {name}เขียนป้ายติดสันสมุดเล่มใหม่ด้วยลายมือตัวเอง บอกว่าเล่มนี้เป็นของสถาบันเวทหลวง ป้ายติดอยู่บนสันในห้องที่ไม่มีใครในสถาบันเข้าได้ นอกจากคนถือกุญแจ
        effects: { stats: { CHA: 1 }, reputation: { royal_institute: 1 }, flags: [kept_the_rooms_books] }
      failure:
        text: |
          เขาไม่ลงชื่อ เขาพับกระดาษใส่ย่าม ขอบคุณ แล้วลงบันไดไปโดยไม่วางถุงเงิน เย็นวันนั้นกระดาษแผ่นเดียวกันวางอยู่บนโต๊ะของอธิการบาเซล มอร์เทน บรรทัดที่{name}ขีดทิ้งเขียนใหม่ไว้ใต้เส้นแล้ว

          อธิการลงชื่อ วางปากกา ไม่พูดว่าเห็นด้วย ถุงเงินมาถึงโต๊ะของ{name}ในวันรุ่งขึ้น เบากว่าปีก่อนหนึ่งในสาม สมุดห้าเล่มของปีนั้นออกจากห้องไปก่อน{name}ตื่น
        effects: { gold: -3, flags: [lost_the_rooms_books] }
    - id: make_him_look
      label: พาเขาเดินดูห้องแบบที่อาจารย์ที่ปรึกษาเคยพาเดินในปีสาม ให้ดูทุกชั้น ทุกมุม
      requires: { flag: institute_graduate }
      text: |
        ทุกปีเขาเดินตามหลังอาจารย์ใหญ่ ปีนี้{name}ให้เขาเดินนำ หยุดเขาไว้หน้าชั้นทุกชั้น บอกว่าแต่ละชั้นคืออะไร ปีไหน ใครทำ ทำไมยังอยู่ อย่างที่อาจารย์ที่ปรึกษาบอก{name}ในคืนแรกของปีสาม ไม่ข้ามชั้นไหน ทรายหมดนาฬิกาไปสองรอบ

        ออกมาถึงโต๊ะ เขานั่งลง หยิบปากกา แล้วไม่ลงชื่อทันที เขาถามว่าทุกปีที่ผ่านมา เขาจ่ายเงินให้สิ่งนี้มาตลอดเลยหรือ {name}บอกว่าใช่ เขาลงชื่อใต้บรรทัดเก่า ปล่อยบรรทัดใหม่ไว้โดยไม่มีชื่อใครข้างใต้ ถุงเงินวางลง น้ำหนักเท่าเดิม
      effects: { stats: { WIS: 1 }, flags: [made_the_payer_look] }

- id: adult.academy_market_book
  stage: adult
  scene: market
  weight: 30
  when:
    age: [38, 60]
    flags: [job_researcher, institute_assistant]
  text: |
    แผงหนังสือมือสองท้ายตลาดเป็นของหญิงม่ายคนหนึ่ง ผัวของนางรับซื้อของจากบ้านคนตาย หนังสือ ช้อนส้อม แว่นตา ตายไปแล้วนางก็ขายต่อตามน้ำหนัก สมุดเล่มที่{name}หยิบขึ้นมาเป็นปกหนังสีน้ำตาล สันมีรูเจาะหนึ่งรูแบบที่ห้องสมุดสถาบันเจาะไว้ร้อยโซ่ ตราประทับในปกในมีคนขูดจนเหลือแค่ขอบวง ข้างในเป็นลายมือของใครสักคน เต็มทุกหน้า สูตร ตาราง ภาพวาดเครื่องมือ และบันทึกเวลาที่จดถี่ขึ้นเรื่อยๆ จนถึงหน้าสุดท้าย

    หญิงคนหนึ่งในเสื้อคลุมเรียบมาหยุดข้าง{name} นางมองสมุดในมือ{name}แบบคนที่มองของที่ตามหามาหลายสัปดาห์ นางบอกว่าตัวเองเป็นผู้ทวงตำราของสถาบัน งานของนางคือตามของของสถาบันที่หลุดออกไปให้กลับเข้ากำแพง นางไม่ได้อ่านสูตรออก จึงต้องการตาของคนที่อ่านออก

    นางถามว่าสมุดเล่มนี้เป็นของสถาบันหรือไม่ หญิงม่ายเจ้าของแผงหยุดชั่งช้อนบนตาชั่ง หันมาฟัง
  choices:
    - id: it_is_ours
      label: บอกนางว่าใช่ เล่มนี้เป็นของสถาบัน
      text: |
        นางหยิบสมุดไปจากมือ{name}อย่างระวัง ห่อด้วยผ้าที่เตรียมมา แล้วยื่นใบรับให้หญิงม่ายหนึ่งแผ่น บอกว่าสถาบันไม่ซื้อของของตัวเองคืน ใบรับนี้ไว้บอกคนที่มาถามว่าสมุดหายไปไหน

        หญิงม่ายพับใบรับเก็บใต้ตาชั่ง แล้วชั่งช้อนต่อ หญิงในเสื้อคลุมเรียบขอบคุณ{name}ด้วยการบอกชื่อของ{name}ออกมาถูกต้อง ทั้งที่{name}ยังไม่ได้บอก แล้วเดินหายเข้าไปในตลาด
      effects: { reputation: { royal_institute: 1 }, alignment: { law: 1 }, flags: [helped_the_book_claimers] }
    - id: not_ours
      label: บอกนางว่าไม่ใช่ เป็นสมุดคัดลอกของคนนอก แล้วจ่ายเงินซื้อไว้เอง
      text: |
        หญิงในเสื้อคลุมเรียบดูรูที่สันสมุดครั้งหนึ่ง แล้วมองหน้า{name} นางไม่เถียง นางบอกว่าถ้าตาของคนที่อ่านออกบอกว่าไม่ใช่ นางก็ไม่มีอะไรจะบอกสถาบัน แล้วเดินจากไป

        หญิงม่ายชั่งสมุดบนตาชั่งเดียวกับที่ชั่งช้อน คิดราคาสองเหรียญ คืนนั้น{name}อ่านจนถึงหน้าสุดท้าย บันทึกเวลาหยุดกลางบรรทัด ลายมือเดียวกันทั้งเล่ม ไม่มีชื่อเจ้าของ มีแต่ร่องรอยของคนที่ไม่อยากให้ใครเอาสิ่งที่ตัวเองเขียนกลับไปไว้ในกำแพง
      effects: { gold: -2, alignment: { law: -1 }, flags: [hid_a_book_from_the_claimers] }
    - id: read_it_first
      label: ขออ่านหน้าสุดท้ายก่อนตอบ
      check: { stat: INT, dc: 14 }
      success:
        text: |
          บันทึกเวลาบนหน้าสุดท้ายไม่ใช่ของห้องสมุด เป็นของคนที่จดเองที่บ้าน เวลาตื่น เวลากิน เวลาที่มือเริ่มสั่น สูตรในเล่มเป็นงานของคนที่ออกจากสถาบันไปนานแล้ว ยืมสมุดเปล่าของห้องสมุดไปตั้งแต่ยังเรียน แล้วไม่ได้คืน ทั้งเล่มไม่มีบรรทัดไหนที่สถาบันเป็นคนสอน

          {name}บอกนางว่าปกเป็นของสถาบัน ข้างในไม่ใช่ นางคิดอยู่ครู่หนึ่ง แล้วฉีกปกออกจากสมุดเอาไปแค่ปก ข้างในทั้งเล่ม{name}จ่ายหญิงม่ายไปหนึ่งเหรียญ นางบอกว่าไม่มีปกแล้วชั่งได้เบากว่าเดิม
        effects: { stats: { INT: 1 }, gold: -1, flags: [hid_a_book_from_the_claimers] }
      failure:
        text: |
          {name}อ่านไปได้สามหน้า หญิงในเสื้อคลุมเรียบก็ยื่นมือมาขอสมุดคืนอย่างสุภาพ นางบอกว่าคนที่อ่านนานขนาดนี้ แปลว่าข้างในมีของที่สถาบันควรได้อ่านก่อน แล้วห่อสมุดด้วยผ้าที่เตรียมมา

          หญิงม่ายได้ใบรับหนึ่งแผ่นแทนเงิน {name}ทิ้งเหรียญไว้บนตาชั่งของนางหนึ่งเหรียญ นางไม่ถามว่าค่าอะไร ชั่งเหรียญนั้นรวมกับช้อนแล้วจดลงสมุด
        effects: { gold: -1, flags: [helped_the_book_claimers] }

- id: adult.academy_rectors_pen
  stage: adult
  scene: council_hall
  weight: 30
  when:
    age: [52, 64]
    year: [318, 356]
    flags: [job_researcher, institute_head_of_school]
  text: |
    อธิการบาเซล มอร์เทน ลงชื่อในทุกเรื่องของสถาบันมาตั้งแต่ก่อน{name}จะได้โต๊ะตัวแรกใต้หลังคาตึกตะวันตก ไม่เคยพูดว่าเห็นด้วยกับเรื่องไหนสักครั้ง ในที่ประชุมอาจารย์ใหญ่หกสำนักต้นปีนี้ เขาลงชื่อในใบสุดท้ายของวาระ แล้ววางปากกาลงบนโต๊ะ ไม่ได้วางข้างแท่นหมึกแบบทุกครั้ง วางตรงกลางโต๊ะ หันปลายออกจากตัว บอกว่าเขาจะไม่ลงชื่ออะไรอีก

    อธิการคนใหม่มาจากอาจารย์ใหญ่หกคนในห้องนี้ ที่ประชุมเลือกเอง แต่ทุกคนในห้องรู้ว่าก่อนวันเลือก แต่ละคนจะได้แขกหนึ่งคน คนของราชสำนัก คนของธนาคาร คนของสมาคมโรงกลั่น ชื่อที่เขียนอยู่บนกระดาษของแขกมีสามชื่อ ชื่อหนึ่งในนั้นคือ{name}

    ปากกาของอธิการวางอยู่กลางโต๊ะทั้งคืน ไม่มีใครหยิบ
  choices:
    - id: the_crowns_name
      label: รับคนของราชสำนักที่มาเคาะประตูห้องคืนนั้น
      text: |
        คนของราชสำนักไม่ได้ขออะไรมาก ขอให้สถาบันส่งชื่อนักเรียนปีหกที่ดีที่สุดสิบคนไปที่โต๊ะของราชสำนักก่อนโต๊ะอื่นทุกปี ขอให้อธิการคนใหม่ไปกินข้าวที่วังต้นปี ขอแค่นั้น

        วันเลือก อาจารย์ใหญ่สี่ในหกคนเขียนชื่อ{name} {name}หยิบปากกาจากกลางโต๊ะ ลงชื่อในใบแรกของตัวเอง แล้ววางข้างแท่นหมึก บาเซล มอร์เทน นั่งอยู่แถวหลัง ไม่ได้ลงชื่อในใบนั้น เป็นใบแรกในรอบหลายสิบปีที่ไม่มีลายมือของเขา
      effects: { mark: ขึ้นเป็นอธิการ, reputation: { crown: 1 }, alignment: { law: 1, moral: -1 }, flags: [institute_rector, rector_by_the_crown] }
    - id: no_guest
      label: ปิดประตูห้องคืนนั้น ไม่รับแขกคนไหน แล้วให้ที่ประชุมเลือกจากงาน
      check: { stat: CHA, dc: 15 }
      success:
        text: |
          มีคนเคาะประตูสามครั้งในคืนนั้น ห่างกันครั้งละชั่วเทียน {name}ไม่เปิดสักครั้ง เช้าวันเลือก {name}ลุกขึ้นพูดก่อนใคร บอกที่ประชุมว่าเมื่อคืนมีคนมาเคาะสามครั้ง แล้วบอกว่าใครบ้างที่ไม่ได้เปิดประตูคืนนั้น ในห้องมีคนเดียวที่ยกมือ คือ{name}

          อาจารย์ใหญ่สี่ในหกคนเขียนชื่อ{name} บาเซล มอร์เทน ลุกจากแถวหลัง เดินมาหยิบปากกาจากกลางโต๊ะ ยื่นใส่มือ{name}เอง ไม่วางลงบนโต๊ะ เป็นครั้งแรกที่ใครในห้องเห็นเขายื่นอะไรให้ใคร
        effects: { stats: { CHA: 1 }, mark: ขึ้นเป็นอธิการ, reputation: { royal_institute: 1 }, flags: [institute_rector, rector_by_the_vote] }
      failure:
        text: |
          {name}ไม่เปิดประตูสักครั้ง อาจารย์ใหญ่อีกห้าคนเปิดทุกครั้ง วันเลือก ชื่อ{name}ได้สองเสียง ของตัวเองกับของอาจารย์ใหญ่ที่อายุน้อยที่สุดในห้อง

          ปากกาไปอยู่ในมือคนที่ราชสำนักเคาะประตูก่อน งานเลี้ยงขึ้นตำแหน่งทุกคนในห้องต้องช่วยออกค่าเหล้า {name}ออกสองเหรียญ เท่ากับทุกคน บาเซล มอร์เทน ไม่มางาน เขาส่งคนมาบอกว่าไม่ว่าง
        effects: { gold: -2, flags: [lost_the_rectors_pen] }
    - id: the_bonded_one
      label: เปิดสมุดขอบเทาให้ที่ประชุมดู ข้อผูกพันสิบปีของตัวเองยังไม่เคยมีใครเขียนว่าครบ
      requires: { flag: serving_the_institute_bond }
      text: |
        {name}เปิดสมุดขอบเทาเล่มเดิมให้ที่ประชุมดู หน้าที่มีชื่อเด็กทุนคนหนึ่ง ข้อผูกพันพิมพ์ไว้หน้าขวา สิบปีผ่านไปนานแล้ว ไม่มีใครเคยเขียนว่าครบ {name}บอกว่าคนที่สถาบันเป็นเจ้าของอยู่แล้ว แขกคนไหนก็ซื้อซ้ำไม่ได้

        ที่ประชุมเงียบไปนานเท่าที่บาเซล มอร์เทน ใช้ลุกจากเก้าอี้ เขาเดินมาที่สมุด หยิบปากกาจากกลางโต๊ะ เขียนคำว่าครบลงข้างชื่อ{name} ลงชื่อกำกับ แล้ววางปากกาไว้ข้างสมุด ไม่ได้วางกลางโต๊ะอีก อาจารย์ใหญ่ห้าในหกคนเขียนชื่อ{name}
      effects: { mark: ขึ้นเป็นอธิการ, reputation: { royal_institute: 1 }, alignment: { law: 1 }, flags: [institute_rector, rector_from_the_bond] }
    - id: hand_it_on
      label: หยิบปากกาจากกลางโต๊ะ ยื่นให้อาจารย์ใหญ่ที่อายุน้อยที่สุดในห้อง
      text: |
        อาจารย์ใหญ่คนนั้นอายุน้อยกว่า{name}เกือบยี่สิบปี เขารับปากกาไว้ในมือ ไม่ได้ปฏิเสธ ไม่ได้ขอบคุณ มองปากกาเหมือนคนที่ได้ของที่ยังไม่รู้ว่าจะวางไว้ตรงไหน

        วันเลือก ชื่อของเขาได้สามเสียง เท่ากับชื่อของคนที่ราชสำนักเคาะประตู ที่ประชุมให้อธิการคนเก่าเป็นคนตัดสิน บาเซล มอร์เทน ไม่ลงชื่อ ไม่พูด เขาลุกออกจากห้องไป ปากกาด้ามนั้นยังอยู่ในมืออาจารย์ใหญ่คนหนุ่มจนค่ำ
      effects: { alignment: { moral: 1 }, flags: [passed_the_rectors_pen] }
