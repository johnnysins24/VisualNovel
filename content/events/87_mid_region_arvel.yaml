# วัยกลางคน: ถิ่นทุ่งอาร์เวล (batch 4 package A)
# ห้าเรื่องของคนวัยสี่สิบถึงหกสิบที่อยู่ในหมู่บ้านทุ่งหรือเมืองตลาด ข้อห้ามของวัวใต้ทุ่ง (field)
# อ่านได้ทั้งคนที่โตในทุ่งและคนที่ย้ายมาทีหลัง ตัวเลือกที่ต้องรู้ธรรมเนียมแต่เด็กกันด้วย origin_farm

- id: adult.region_arvel_old_pond
  stage: adult
  weight: 22
  when:
    age: [41, 58]
    location_tag: arvel_village
  text: |
    คนของพ่อค้าข้าวข้างรางเอาไม้ไผ่ลำยาวมาจิ้มบ่อเก่าหลังบ้าน{name}ตั้งแต่เช้า จิ้มทีละจุด ตะโกนบอกตัวเลขให้อีกคนจด ไม้จมลงไปไม่ถึงเข่าก็ติดโคลน บ่อนี้ไม่มีใครตักน้ำกินมาตั้งแต่หมู่บ้านขุดบ่อหินกลางลาน เหลือไว้ให้เป็ดลงเล่นกับกบร้องตอนหัวค่ำ ริมบ่อมีหินก้อนแบนที่คนรุ่นก่อนยืนตักน้ำ ผิวหินสึกเป็นแอ่งตื้นสองแอ่งพอดีเท้า

    สายๆ พ่อค้าเดินมาเอง เขาจะตัดทางเกวียนจากทุ่งตรงลงไปที่ลานขนข้าวข้างราง เกวียนข้าวจะได้ไม่ต้องอ้อมผ่านกลางหมู่บ้าน ทางเส้นนั้นผ่านหลังบ้าน{name}พอดี บ้านไหนให้ทางผ่าน เขาจ่ายค่าผ่าน บ้านไหนมีบ่อขวาง ถ้าถมเสร็จก่อนสิ้นสัปดาห์ เขาจ่ายสองเท่า พูดจบเขาวางเหรียญเป็นตั้งไว้บนหินก้อนแบน วางไว้ให้ดูเฉยๆ ยังไม่ให้หยิบ

    ยายบ้านหัวแถว คนที่ถือคันไถมานานที่สุดของบ้านนั้น ยืนฟังอยู่ข้างรั้ว พอพ่อค้ากลับไป ยายพูดกับ{name}ประโยคเดียว ว่าบ่อเก่าถมได้ แต่ต้องบอกดินก่อน แล้วเดินกลับเข้าบ้าน ไม่ได้บอกว่าบอกอย่างไร
  choices:
    - id: keep_the_old_pond
      label: ไม่ถม บอกพ่อค้าให้ตัดทางอ้อมบ่อไปเอง
      text: |
        พ่อค้าไม่เถียง เก็บเหรียญบนหินคืนทีละตั้ง ทางเกวียนเส้นใหม่เลี้ยวไปผ่านหลังบ้านถัดไปแทน บ้านนั้นได้ค่าผ่าน ไม่มีบ่อให้ถม

        พอถึงหน้าเกี่ยว ข้าวของ{name}ขึ้นตาชั่งข้างรางเป็นเจ้าสุดท้ายทุกรอบ คนชั่งหักความชื้นมากกว่าบ้านอื่นทุกกระสอบ ไม่มีใครพูดว่าเพราะอะไร ปีนั้นเงินหน้าเกี่ยวของ{name}ขาดไปเกือบเท่าค่าเช่าหนึ่งฤดู ตกค่ำกบในบ่อเก่าร้องเหมือนทุกปี เสียงล้อเกวียนข้าวลอยมาจากทางเส้นใหม่ ไกลจนเกือบไม่ได้ยิน
      effects:
        gold: -3
        taboo: { field: keep }
        flags: [kept_the_old_pond]
    - id: fill_the_old_pond
      label: ถมบ่อให้เสร็จก่อนสิ้นสัปดาห์ รับเงินสองเท่า
      text: |
        คนของพ่อค้าขนดินมาสามเกวียน {name}ช่วยโกยเองอีกหนึ่ง เป็ดสองตัวสุดท้ายไม่ยอมขึ้นจากบ่อจนดินถมถึงอก กบกระโดดขึ้นมาตามทางเดินเข้าบ้าน{name}กันทั้งคืน เช้ามาเหยียบโดนหลายตัว หินก้อนแบนจมลงไปใต้ทางเกวียนพร้อมแอ่งรอยเท้าทั้งสองแอ่ง

        พ่อค้าจ่ายครบตามที่พูด เกวียนข้าวเล่มแรกที่วิ่งผ่านทางใหม่ส่งเสียงล้อก้องขึ้นมาจากใต้ดิน ก้องแบบล้อเกวียนกลิ้งผ่านสะพานไม้ คนขับก้มลงดูพื้นข้างล้อ แล้วตีวัวให้เดินเร็วขึ้น
      effects:
        gold: 4
        taboo: { field: break }
        flags: [filled_the_old_pond]
    - id: bend_the_cart_track
      label: ขอเดินดูแนวทางเกวียนกับคนของพ่อค้า หาทางเลี้ยวอ้อมบ่อโดยไม่เสียระยะ
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}ขึงเชือกเดินแนวใหม่ไปตามคันนาเก่าหลังบ่อ คันนาเส้นนั้นคนรุ่นก่อนเหยียบมาจนแน่นเป็นหิน ส่วนดินที่ถมบ่อจะยุบไปอีกหลายหน้าฝน เกวียนข้าวเต็มคันจะจมล้อทุกครั้งที่ฝนลง คนของพ่อค้าลองตอกไม้ลงคันนา ตอกไม่ลง ลองตอกลงขอบบ่อ จมไปครึ่งลำ

          พ่อค้าเปลี่ยนแนวทาง จ่ายค่าผ่านให้{name}เท่าบ้านอื่น แถมให้อีกหนึ่งเหรียญเป็นค่าเดินดูแนว ทางเกวียนเส้นใหม่โค้งอ้อมบ่อเป็นวงกว้าง คนขับเกวียนบ่นเรื่องโค้งนั้นทุกเช้า แต่ไม่มีล้อไหนจมสักครั้ง
        effects:
          stats: { INT: 1 }
          gold: 2
          taboo: { field: keep }
          flags: [bent_the_cart_track]
      failure:
        text: |
          โค้งที่{name}ขึงเชือกไว้แคบเกินไป เกวียนข้าวเล่มแรกเลี้ยวไม่พ้น ล้อหลังตกขอบบ่อ กระสอบไถลลงน้ำสองใบ วัวตื่นจะลากทั้งเกวียนตามลงไป {name}ลงไปยืนในโคลนถึงเอว ดันล้อไว้จนคนมาช่วยครบ เข่าบิดตอนดึงขาขึ้นจากโคลน

          พ่อค้าให้คนของตัวเองขึงเชือกใหม่ โค้งกว้างกว่าเดิมเท่าตัว ทางเกวียนอ้อมบ่อไปได้ แต่เขาไม่จ่ายค่าผ่านให้บ้าน{name}สักเหรียญ หักเป็นค่าข้าวสองกระสอบที่จมอยู่ก้นบ่อ
        effects:
          hp: -2
          flags: [bent_the_cart_track, tipped_a_grain_cart]
    - id: tell_the_earth_first
      label: ทำอย่างที่คนแก่ในทุ่งทำกันมา บอกดินก่อน แล้วค่อยถม
      requires: { flag: origin_farm }
      text: |
        ตอนเด็ก{name}เคยเดินตามผู้ใหญ่ไปบอกดินครั้งหนึ่ง ตอนบ้านข้างโรงสีถมบ่อ เช้ามืดวันต่อมา{name}เด็ดรวงข้าวมาวางบนปากบ่อ เอาเสียมแซะดินขอบบ่อขึ้นมาก้อนหนึ่ง หญ้ายังติด อุ้มเดินออกไปถึงเนินกลางทุ่ง วางคว่ำลงบนเนิน แล้วพูดออกเสียงให้ดินฟัง ว่าบ่อนี้ใครขุด ใครเคยตักกิน จากนี้ไปจะเป็นทางเกวียน พูดจนจบ ไม่รีบ

        คนของพ่อค้าหัวเราะกันอยู่จนเห็นยายบ้านหัวแถวอุ้มดินอีกก้อนเดินตามมา วางลงข้างก้อนของ{name} พ่อค้าหักค่ารอไปครึ่งวัน ที่เหลือจ่ายครบ ทางเกวียนเส้นใหม่ผ่านหลังบ้าน{name}ไปเงียบๆ แบบทางดินทุกเส้นในทุ่ง
      effects:
        stats: { WIS: 1 }
        gold: 2
        taboo: { field: keep }
        flags: [told_the_earth_about_the_pond]

- id: adult.region_arvel_last_row
  stage: adult
  weight: 22
  when:
    age: [44, 60]
    location_tag: arvel_village
  text: |
    คนเกี่ยวรับจ้างของพ่อค้าข้างรางลงนาแปลงริมเนินตั้งแต่ไก่ยังไม่ขัน สิบสองคน เคียวสิบสองเล่ม ร้องเพลงนับฟ่อนไปตามจังหวะเคียว ค่าจ้างคิดเป็นฟ่อน ใครนับเร็วก็ได้เงินมาก นาแปลงนี้เคยเป็นของบ้านปลายทุ่ง ตอนนี้เป็นของพ่อค้า ทาเลน คนหนุ่มจากเมืองตลาดเช่าทำอยู่ได้ฤดูเดียวก็ยกให้พ่อค้าเกี่ยวเอง แลกกับค่าเช่าที่ลดลง

    ใกล้เที่ยงเหลือข้าวแถวเดียว แถวที่ชิดเนินที่สุด ทุกปีบ้านปลายทุ่งเว้นแถวนี้ไว้ให้นกกินจนหน้าหนาว เสียงเพลงนับฟ่อนขาดไปทีละเสียง คนเกี่ยวยืนถือเคียวกันอยู่ที่หัวแถว ไม่มีใครก้มลงก่อน หลายคนในสิบสองคนนั้นโตมาในหมู่บ้านทุ่งเหมือนกัน

    หัวหน้าคนเกี่ยวด่าลูกน้องจนหมดคำ แล้วหันมาเห็น{name}เดินผ่านมาตามคันนาพอดี เขายื่นเคียวเล่มที่สิบสามมาให้ ค่าแรงหนึ่งวันเต็มสำหรับแถวเดียว คนแก่ของหมู่บ้านไปลานโรงชั่งในเมืองตลาดกันตั้งแต่เช้า ในทุ่งเหลือแต่เด็กเลี้ยงวัว คนเกี่ยวสิบสองคน กับ{name}
  choices:
    - id: stand_in_the_last_row
      label: ลงไปยืนกลางแถวสุดท้าย ไม่ให้ใครเกี่ยว
      text: |
        หัวหน้าคนเกี่ยวไม่ได้ตี เขาก้มลงเกี่ยวเองรอบตัว{name} คว้ากอข้าวข้างขา{name}ทีละกอ {name}ยื่นมือไปกันไว้กอหนึ่ง คมเคียวลากผ่านหลังแขนเป็นแผลยาว เลือดหยดลงบนรวงข้าว

        เขาหยุดตรงนั้น คนเกี่ยวสิบสองคนลงไปนั่งแกะข้าวห่อกินบนคันนา ไม่มีใครลุกจนหัวหน้ายอมม้วนเชือกกลับ ข้าวแถวสุดท้ายยืนอยู่ริมเนินจนหน้าหนาว ฝูงนกกระจอกลงกินทุกเช้า รวงต้นหนึ่งมีคราบเลือดแห้งเป็นจุดสีน้ำตาลอยู่จนนกจิกไปหมด
      effects:
        hp: -2
        taboo: { field: keep }
        flags: [stood_in_the_last_row]
    - id: reap_the_last_row
      label: รับเคียวมา เกี่ยวแถวสุดท้ายให้จบ เอาค่าแรงหนึ่งวัน
      text: |
        แถวเดียวเกี่ยวไม่นาน {name}เกี่ยวคนเดียว คนเกี่ยวสิบสองคนยืนดู ไม่มีใครร้องนับฟ่อนให้ พอกอสุดท้ายขาดจากดิน หัวหน้าจ่ายเงินใส่มือ{name}ครบตามที่บอก แล้วสั่งให้ทุกคนขนฟ่อนขึ้นเกวียน

        คืนนั้นหมาทั้งหมู่บ้านหันไปเห่าทางทุ่งจนเกือบรุ่ง เช้ามามีรอยแยกยาวเท่าแขนขึ้นบนเนิน ตรงที่ตอซังแถวสุดท้ายชิดอยู่ ทาเลนเอาดินมาอุดรอยแยก อุดเสร็จแล้วไม่ได้เดินกลับไปดูอีกเลยทั้งฤดู
      effects:
        gold: 2
        taboo: { field: break }
        flags: [reaped_the_last_row]
    - id: walk_on_past
      label: เดินต่อไป นานั้นเป็นของพ่อค้า ไม่ใช่ของ{name}
      text: |
        {name}เดินต่อไปตามคันนา ได้ยินเสียงหัวหน้าด่าอีกสองสามคำ แล้วได้ยินเสียงเคียวเล่มเดียว ตามด้วยเล่มที่สอง ไม่มีเสียงเพลงนับฟ่อนอีก

        ตกเย็นยายบ้านปลายทุ่งกลับจากเมืองตลาด ลงจากเกวียนตรงหัวนา ยืนถือรองเท้าไว้ข้างหนึ่ง มองตอซังเกลี้ยงรอบเนิน แล้วถามเด็กเลี้ยงวัวว่าใครเกี่ยว เด็กชี้ไปทางพ่อค้า ไม่ได้ชี้มาทาง{name}
      effects:
        world: { land: 1 }
        flags: [walked_past_the_last_row]
    - id: send_for_talen
      label: ให้เด็กเลี้ยงวัววิ่งไปตามทาเลนมาคุยกันที่ริมเนิน
      requires: { taboo: { id: field, keeps: true } }
      text: |
        คนเกี่ยวรู้จัก{name} รู้ว่านาที่{name}ทำเหลือรวงไว้ทุกปี คนหนึ่งบอกหัวหน้าว่าถ้าจะเกี่ยวแถวนี้ ให้ถามคนนี้ก่อน หัวหน้ายักไหล่ ทาเลนมาถึงเหงื่อโชกหน้า {name}ไม่ได้เล่าเรื่องเนิน เรื่องวัว หรือเรื่องคนแก่ บอกแค่ว่าคนที่สอน{name}เว้นแถวนี้ทุกปี แปลงไหนเว้นไว้ ปีต่อไปข้าวแปลงนั้นไม่ล้ม

        ทาเลนฟังจบก็บอกหัวหน้าคนเกี่ยวว่าแถวนี้เขาหักจากค่าเช่าเอง ข้าวแถวสุดท้ายยืนอยู่ริมเนินจนหน้าหนาว ปีต่อมาทาเลนเว้นแถวเดียวกันโดยไม่ต้องมีใครบอก เว้นกว้างกว่าเดิมอีกหนึ่งกอ
      effects:
        stats: { CHA: 1 }
        taboo: { field: keep }
        flags: [talen_left_the_last_row]

- id: adult.region_arvel_amends
  stage: adult
  weight: 22
  when:
    age: [43, 60]
    location_tag: arvel_village
  text: |
    วัวคู่ไหนเดินมาถึงคันนาแปลงริมเนินก็หยุด หมู่บ้านลองมาครบทุกคู่แล้ว จูงไม่ไป ตีไม่ไป ยืนก้มหัวอยู่ที่คันนาเหมือนรอให้ใครเปิดประตูที่ไม่มี ข้าวในแปลงรอบเนินงอกแล้วล้มนอนตั้งแต่ยังไม่ออกรวง ไถทุกเล่มที่ลงแปลงนั้นพลิกหินก้อนกลมเท่าหัวเด็กขึ้นมา หินแบบที่ไม่เคยมีใครเห็นในทุ่งนี้ น้ำในบ่อหินกลางลานมีรสดินติดลิ้น

    คนที่จำได้ว่าต้องทำอย่างไรเหลืออยู่คนเดียว ยายฮัลดา แม่เฒ่าบ้านท้ายทุ่ง คนที่ถือคันไถมานานที่สุดในหมู่บ้าน ยายนั่งบนแคร่หน้าบ้าน ให้หลานไปเรียกคนมาฟัง แล้วพูดช้าๆ ทีละข้อ ใครเคยไถข้ามเนิน เกี่ยวรวงสุดท้าย หรือถมบ่อเก่าโดยไม่บอกดิน คนนั้นต้องเว้นนาไว้หนึ่งแปลง ไม่เกี่ยวทั้งปี พอสิ้นหน้าเกี่ยวให้ถอดรองเท้า จูงไถเดินอ้อมเนินสามรอบ ถ้าไม่มีใครรับ ก็ต้องมีใครสักคนทำแทนทั้งหมู่บ้าน

    คนในลานหันไปทางนั้นทีทางนี้ที ไม่มีใครรับ ผู้ใหญ่บ้านกระแอมแล้วถามขึ้นมาว่าปีนี้พ่อค้าข้างรางให้ราคาเท่าไร
  choices:
    - id: own_the_breaking
      label: รับต่อหน้าทุกคนว่า{name}เคยฝืน แล้วทำให้ครบทั้งปี
      requires: { taboo: { id: field, unbroken: false } }
      text: |
        {name}บอกต่อหน้าทุกคนว่าเคยทำอะไร แล้วชี้แปลงที่จะเว้น เป็นแปลงที่ดีที่สุดที่มี แปลงที่ได้ข้าวมากที่สุดทุกปี ทั้งหน้าเกี่ยวข้าวในแปลงนั้นสุกแล้วร่วงคาต้น นกลงกินเป็นฝูง เพื่อนบ้านเดินผ่านแล้วส่ายหัว บางคนเอาข้าวมาแบ่งให้ถุงหนึ่งโดยไม่ถามอะไร

        วันสุดท้ายของหน้าเกี่ยว{name}ถอดรองเท้าไว้ที่คันนา จูงไถเดินอ้อมเนิน ตอซังแทงฝ่าเท้าทุกก้าว รอบแรกวัวไม่ยอมเดิน {name}ต้องลากทั้งเชือกทั้งวัว รอบที่สองวัวเดินตามช้าๆ รอบที่สามเชือกหย่อนอยู่ในมือตลอดรอบ ยายฮัลดายืนนับรอบอยู่ที่คันนา นับครบแล้วเรียกหลานมาพยุงกลับบ้าน
      effects:
        gold: -4
        hp: -1
        taboo: { field: mend }
        flags: [did_the_field_amends]
    - id: do_the_rite_for_the_village
      label: ไม่มีใครรับ {name}ก็จะทำแทนทั้งหมู่บ้านเอง
      text: |
        {name}เว้นนาไว้ครึ่งแปลง ยายฮัลดาบอกว่าครึ่งแปลงไม่นับ ต้องทั้งแปลง {name}เว้นทั้งแปลง ทั้งปีคนในหมู่บ้านผลัดกันเอาของมาวางไว้หน้าบ้าน{name} ฟักทองบ้าง ไข่บ้าง ข้าวสารครึ่งกระสอบบ้าง ไม่มีใครบอกว่าเป็นค่าอะไร

        สิ้นหน้าเกี่ยว{name}เดินเท้าเปล่าจูงไถอ้อมเนินครบสามรอบ ฝ่าเท้าแตกเป็นริ้ว เด็กๆ ทั้งหมู่บ้านเดินตามเป็นแถวยาว ถอดรองเท้ากันเองโดยไม่มีผู้ใหญ่คนไหนสั่ง ฤดูไถปีต่อมาวัวคู่แรกที่ลงแปลงริมเนินเดินข้ามคันนาไปโดยไม่ต้องจูง
      effects:
        stats: { CON: 1 }
        gold: -2
        taboo: { field: keep }
        world: { land: -1 }
        flags: [did_the_rite_for_the_village]
    - id: dig_the_old_drain
      label: ไปเดินดูทางน้ำรอบเนินก่อน เผื่อเป็นเรื่องที่จอบแก้ได้
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}เดินตามร่องน้ำเก่าที่หญ้าขึ้นปิดไปจนถึงทางเกวียนของพ่อค้า ร่องน้ำมุดหายไปใต้ทางเกวียน ไม่มีท่อ ไม่มีช่อง น้ำจากทุ่งไหลออกไม่ได้มาทั้งฤดู {name}ขุดร่องใหม่อ้อมหัวทางเกวียนลงไปถึงลำห้วยอยู่ทั้งวัน น้ำขังในแปลงริมเนินไหลออกตามร่องเป็นสีโคลน

          สามวันต่อมาน้ำในบ่อหินกลางลานหายรสดิน ข้าวที่ล้มแล้วลุกไม่ขึ้นอีก แต่ต้นที่งอกใหม่ยืนตรง วัวยังหยุดที่คันนาทุกคู่ ยายฮัลดาฟังเรื่องร่องน้ำแล้วชมว่าขุดดี ขุดดีมาก แล้วถามว่าใครจะจูงไถ
        effects:
          stats: { INT: 1 }
          flags: [dug_the_old_drain]
      failure:
        text: |
          {name}ขุดตามร่องผิดเส้น ร่องที่ขุดพาน้ำจากลำห้วยย้อนเข้าแปลงริมเนินแทนที่จะพาออก ดินคันนาชุ่มน้ำจนพังลงมาทับขา{name}ครึ่งตัว กว่าเพื่อนบ้านจะมาขุดออกได้ ขาก็บวมเป็นสีม่วง

          แปลงริมเนินมีน้ำขังเพิ่มอีกหนึ่งคืบ ผู้ใหญ่บ้านให้คนมาถมร่องที่{name}ขุด ยายฮัลดาส่งหลานเอาน้ำมันทาเข่ามาให้ขวดหนึ่ง ฝากมาบอกว่าทาวันละสองหน ไม่ได้ฝากเรื่องอื่น
        effects:
          hp: -2
          flags: [dug_the_old_drain]
    - id: refuse_the_old_rite
      label: บอกยายฮัลดาว่าปีนี้ไม่มีบ้านไหนมีนาเหลือให้เว้น
      text: |
        ยายฮัลดาไม่เถียง บอกว่าเข้าใจ บ้านยายเองก็ไม่มี คนในลานแยกย้ายกลับไปทำนาของตัวเอง ไม่มีใครยกเรื่องนี้ขึ้นมาอีก

        ฤดูไถปีต่อมาผู้ใหญ่บ้านเช่าคันไถไอน้ำจากเมืองตลาดมาไถแปลงริมเนิน เพราะไม่มีวัวคู่ไหนยอมลง คนขับไม่ใช่คนในทุ่ง เขาไถตามแนวเชือกที่ผู้ใหญ่บ้านขึงไว้ อ้อมเนินอย่างระวัง ควันดำลอยไปทางบ้านท้ายทุ่ง ยายฮัลดาลุกไปปิดหน้าต่าง
      effects: { flags: [refused_the_field_rite] }

- id: adult.region_arvel_buyers_paper
  stage: adult
  weight: 22
  when:
    age: [41, 56]
    location_tag: arvel_village
  text: |
    หลังข้าวเย็นคนหนุ่มสาวห้าคนของหมู่บ้านมายืนเกาะรั้วบ้าน{name} คนหนึ่งถือกระดาษพับสี่ทบ อีกคนถือตะเกียง ไม่มีใครอยากเปิดปากก่อน จนลูกสาวบ้านโรงสียื่นกระดาษข้ามรั้วมาให้

    เป็นสัญญาของพ่อค้าข้างราง รับซื้อข้าวทั้งแปลงตั้งแต่ต้นยังเขียว ราคาตายตัว จ่ายครึ่งหนึ่งวันลงชื่อ อีกครึ่งวันส่งข้าวที่ลานข้างราง ชั่งด้วยตาชั่งของพ่อค้าเอง ไม่ต้องขนข้าวไปลานโรงชั่งในเมืองตลาดให้เสียครึ่งวันเดิน บนหลังคายุ้งของพ่อค้ามีจานรับดาวใบใหญ่หงายรับฟ้า เป็นจานใบเดียวในทุ่งที่ไม่ได้อยู่บนหลังคาโรงสี

    พ่อแม่ของพวกเขาลงชื่อกันไปครึ่งหมู่บ้านแล้ว อีกครึ่งบอกให้มาถาม{name} {name}เพิ่งนึกได้ตอนนั้นว่า คนที่ตัวเองเคยไปยืนเกาะรั้วถามแบบนี้ หลายคนไม่อยู่แล้ว ที่ยังอยู่ก็หูตึงจนต้องตะโกนถาม
  choices:
    - id: read_every_line
      label: ยกตะเกียงมาใกล้ๆ อ่านสัญญาทีละบรรทัด
      check: { stat: INT, dc: 14 }
      success:
        text: |
          บรรทัดที่สองจากท้ายเขียนตัวเล็กกว่าบรรทัดอื่น น้ำหนักให้ถือตามตาชั่งของผู้ซื้อ และผู้ซื้อหักความชื้นได้ตามที่เห็นควร {name}อ่านให้ฟังสองรอบ รอบที่สองอ่านช้า คนหนุ่มสาวหันไปสบตากันเอง

          {name}ขีดฆ่าบรรทัดนั้น เขียนลงไปใหม่ว่าชั่งที่ลานโรงชั่งเมืองตลาด ต่อหน้าคนชั่งของเมือง แล้วบอกให้เอากระดาษนี้ไปให้พ่อค้าลงชื่อใหม่ พ่อค้าลงชื่อให้สองคนจากห้า อีกสามคนลงชื่อในฉบับเดิมไปตั้งแต่เมื่อวาน หน้าเกี่ยวปีนั้นเกวียนข้าวสองเล่มออกจากหมู่บ้านไปทางเมืองตลาด สวนกับอีกสามเล่มที่เลี้ยวไปทางราง
        effects:
          stats: { INT: 1 }
          flags: [read_the_buyers_paper]
      failure:
        text: |
          ตะเกียงริบหรี่ ตัวหนังสือเล็กเท่าเมล็ดงา {name}อ่านจบแล้วบอกว่าไม่เห็นมีอะไรผิด คนหนุ่มสาวเอาไปลงชื่อกันในเช้าวันต่อมา

          หน้าเกี่ยวคนชั่งข้างรางหักความชื้นทุกกระสอบ หักจนข้าวทั้งแปลงได้เงินไม่ถึงที่ตกลง ลูกสาวบ้านโรงสีมาเกาะรั้วอีกครั้ง คราวนี้ไม่มีกระดาษ มีแต่ตัวเลข {name}แบ่งเงินเก็บของตัวเองให้คนละนิด ไม่มากพอจะใช้คืนได้ แต่พอให้ลูกสาวบ้านโรงสีเลิกนับตัวเลขบนนิ้ว
        effects:
          gold: -2
          flags: [read_the_buyers_paper, missed_the_damp_clause]
    - id: weigh_one_sack_twice
      label: แบกข้าวกระสอบเดียวกันไปชั่งทั้งสองที่ ให้เห็นกับตา
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}แบกกระสอบขึ้นตาชั่งข้างรางตอนเช้า คนชั่งอ่านตัวเลข {name}ให้คนหนุ่มคนหนึ่งจดไว้ แล้วแบกกระสอบเดิมเดินครึ่งวันไปลานโรงชั่งในเมืองตลาด ชั่งอีกครั้ง ตัวเลขที่ลานโรงชั่งมากกว่าเท่าข้าวหนึ่งกำมือใหญ่ๆ

          ขากลับคนหนุ่มถือกระดาษสองแผ่นเดินเร็วจนต้องหยุดรอ{name}เป็นระยะ ตกค่ำตัวเลขสองตัวนั้นเดินไปถึงทุกบ้านในหมู่บ้านก่อน{name}จะได้ล้างเท้า
        effects:
          stats: { CON: 1 }
          flags: [weighed_one_sack_twice]
      failure:
        text: |
          ครึ่งทางไปเมืองตลาด หลังของ{name}ลั่นตอนเปลี่ยนบ่า กระสอบตกลงข้างทาง {name}นั่งอยู่บนกระสอบจนเกวียนเล่มหนึ่งผ่านมา คนขับเป็นคนของพ่อค้าข้างราง เขารับไปส่งถึงบ้าน ไม่คิดค่าแรง ช่วยยกกระสอบลงให้ด้วย

          คนหนุ่มสาวลงชื่อในสัญญากันในสัปดาห์นั้น {name}นอนคว่ำอยู่บนแคร่เจ็ดวัน ได้ยินเกวียนข้าวเลี้ยวไปทางรางทุกเช้า นับได้ทีละเล่ม
        effects:
          hp: -2
          flags: [weighed_one_sack_twice, hurt_back_on_the_market_road]
    - id: tell_them_to_sign
      label: บอกให้ลงชื่อ ตาชั่งข้างรางอยู่ใกล้ ครึ่งวันที่ไม่ต้องเดินก็เป็นเงิน
      text: |
        คนหนุ่มสาวลงชื่อกันครบในเช้าวันต่อมา หน้าเกี่ยวปีนั้นเกวียนข้าวของหมู่บ้านเลี้ยวไปทางรางทั้งหมด ไม่ต้องตื่นตีสามไปต่อแถวที่ลานโรงชั่ง ไม่ต้องนอนค้างใต้เกวียนในเมืองตลาด

        เงินที่ได้น้อยกว่าที่ตกลงไว้นิดหนึ่ง ทุกบ้านน้อยลงเท่าๆ กัน ไม่มีใครรู้แน่ว่าหายไปตรงไหน ลูกสาวบ้านโรงสีบอกว่าคุ้มกับครึ่งวันที่ได้นอน ปลายฤดูลานโรงชั่งในเมืองตลาดมีงานเลี้ยงปิดลานเหมือนทุกปี คนจากหมู่บ้านนี้ไปนั่งไม่เต็มโต๊ะ
      effects: { flags: [told_the_young_to_sign] }
    - id: sell_as_one_village
      label: พาไปทำอย่างที่คนรุ่นก่อนทำ รวมข้าวทั้งหมู่บ้านไปต่อราคาเป็นเจ้าเดียว
      requires: { flag: origin_farm }
      text: |
        ตอนเด็ก{name}เคยนั่งบนกองกระสอบในลานโรงชั่ง ดูผู้ใหญ่ทั้งหมู่บ้านยืนเป็นแถวเดียวต่อราคากับพ่อค้าจากเวนทราส พูดทีละคน ไม่มีใครยอมขายก่อน {name}เดินบ้านต่อบ้านอยู่สามคืน คนที่ลงชื่อไปแล้วถอนไม่ได้ คนที่ยังไม่ลงชื่อมารวมชื่อในกระดาษแผ่นเดียวกันได้สิบเอ็ดบ้าน

        วันชั่ง{name}ยืนหัวแถวเกวียนสิบเอ็ดเล่มหน้าลานข้างราง พ่อค้าเดินดูเกวียนทีละเล่มจนสุดแถว แล้วขึ้นราคาให้กระสอบละนิดเดียว นิดเดียวแต่ทุกกระสอบ
      effects:
        stats: { CHA: 1 }
        flags: [sold_as_one_village]

- id: adult.region_arvel_first_sheaf
  stage: adult
  weight: 22
  when:
    age: [46, 60]
    location_tag: arvel_village
  text: |
    ตาเบอร์ลันมัดฟ่อนแรกของปีเสร็จตั้งแต่ก่อนสาง มัดด้วยเชือกฟางสามเส้นแบบที่มัดมาทุกปี พาดไว้บนแคร่หน้าบ้าน แล้วนั่งลงข้างฟ่อนข้าวเพื่อใส่รองเท้า ใส่ได้ข้างเดียว เข่าซ้ายบวมจนขากางเกงตึง ลุกไม่ขึ้น

    ทุกต้นฤดูเกี่ยว ฟ่อนแรกของหมู่บ้านต้องเดินไปถึงวิหารอีเซลที่โคนเสาก่อนเที่ยง ไม่ขึ้นเกวียน ไม่ให้วัวลาก คนแบกเป็นคนที่หมู่บ้านนับว่าอยู่กับทุ่งมานานที่สุด ตาเบอร์ลันแบกมาตั้งแต่พ่อของตาแบกไม่ไหว แบกจนคนในหมู่บ้านลืมไปแล้วว่าคนอื่นก็แบกได้

    ตาส่งหลานมาตาม{name} ไม่ได้ส่งไปตามลูกชายของตาเอง ไม่ได้ส่งไปตามผู้ใหญ่บ้าน พอ{name}มาถึง ตาบอกว่าคนแบกไม่ต้องไถเก่งที่สุด ไม่ต้องแก่ที่สุด ต้องเดินถึง และตาเห็น{name}เดินผ่านหน้าบ้านทุกเช้ามาหลายฤดูแล้ว ไม่เคยเห็นสายสักวัน คนในลานยืนฟังกันอยู่ครบ ไม่มีใครค้าน
  choices:
    - id: carry_it_alone
      label: แบกฟ่อนแรกเดินไปวิหารคนเดียว ให้ถึงก่อนเที่ยง
      check: { stat: CON, dc: 14 }
      success:
        text: |
          ฟ่อนแรกหนักกว่าที่ดู รวงยังชื้นน้ำค้าง {name}เปลี่ยนบ่าทุกครั้งที่ผ่านหลักบอกทาง ไม่วางลงกับพื้นสักครั้ง คนทุ่งที่ยืนอยู่ริมทางถอดหมวกให้ทุกบ้านที่ผ่าน บางบ้านมาเดินตามท้าย ถึงโคนเสาขบวนก็ยาวเป็นหาง

          แม่ชีอีเซลรับฟ่อนข้าวไปวางบนแท่นตอนเงายังไม่หดเข้าใต้ตัว ฟ่อนของหมู่บ้านอื่นวางอยู่ก่อนแล้วสามฟ่อน ทุกฟ่อนมัดด้วยเชือกสามเส้นเหมือนกัน คนแบกที่ยืนรออยู่หน้าวิหารแก่กว่า{name}ทุกคน
        effects:
          stats: { CON: 1 }
          flags: [carried_the_first_sheaf]
      failure:
        text: |
          ครึ่งทางเชือกเส้นหนึ่งหลุด รวงร่วงตามทาง {name}ต้องวางฟ่อนลงบนตักตัวเองมัดใหม่ เพราะห้ามวางกับพื้น มัดเสร็จไหล่ก็ระบมจนยกฟ่อนขึ้นบ่าไม่ไหว ต้องอุ้มไว้กับอกเดินต่อ มาถึงโคนเสาตอนเที่ยงผ่านไปแล้ว แม่ชีอีเซลรับฟ่อนไปวางบนแท่นเหมือนฟ่อนอื่น ไม่ได้ถามว่าทำไมมาสาย

          ขากลับคนในหมู่บ้านถามว่าทันไหม {name}บอกว่าทัน ตาเบอร์ลันฟังจากหลานแล้วหัวเราะ บอกว่ามีปีหนึ่งตาเองก็ไปไม่ทัน แล้วก็บอกทุกคนว่าทันเหมือนกัน
        effects:
          hp: -1
          flags: [carried_the_first_sheaf, came_after_noon]
    - id: wheel_berlan_along
      label: ยืมรถเข็นของโรงสีมาเข็นตาไปด้วย ให้ตาอุ้มฟ่อนข้าวเอง
      text: |
        ป้าบ้านหัวแถวท้วงว่าฟ่อนแรกห้ามขึ้นเกวียน ตาเบอร์ลันบอกว่ารถเข็นไม่ใช่เกวียน และฟ่อนข้าวไม่ได้ขึ้นรถเข็น ฟ่อนข้าวอยู่บนตักตา ป้าเถียงต่อไม่ออก {name}เข็นตาไปตามทางดิน ล้อรถเข็นเอียงซ้ายตลอดทาง ตาอุ้มฟ่อนข้าวไว้ทั้งสองแขน ชี้เนินกลางทุ่งทุกเนินที่ผ่าน เล่าว่าเนินไหนบ้านไหนไถอ้อม บ้านไหนเคยไถข้ามแล้วข้าวล้มทั้งแปลง รวงสุดท้ายต้องเหลือไว้ทำไม เล่าไม่หยุดจนถึงโคนเสา

        หน้าวิหาร ตาให้{name}ประคองลุก ยืนขาเดียวส่งฟ่อนข้าวให้แม่ชีด้วยมือตัวเอง แล้วทรุดกลับลงรถเข็นหายใจแรงอยู่พักใหญ่ บอกว่าปีหน้าคงต้องเข็นกันอีก
      effects:
        stats: { WIS: 1 }
        taboo: { field: learn }
        flags: [wheeled_berlan_to_the_temple]
        people: [{ id: neighbour_berlan, name: เบอร์ลัน, gender: m, bond: friend, closeness: 1, age: 81 }]
    - id: pass_it_to_the_newcomer
      label: ส่งฟ่อนข้าวต่อให้เด็กหนุ่มที่เพิ่งย้ายมาเช่านา ให้เขาแบกแทน
      text: |
        เด็กหนุ่มคนนั้นย้ายมาจากคาร์ดินตั้งแต่ต้นปี ยังจำชื่อคนในหมู่บ้านได้ไม่ถึงครึ่ง เขายืนอยู่ท้ายลาน ไม่รู้ว่าทำไมทุกคนหันมาทางเขา {name}ยกฟ่อนข้าวใส่มือเขา บอกทางไปโคนเสา บอกว่าห้ามวางลงกับพื้น ห้ามขึ้นเกวียน ห้ามไปถึงหลังเที่ยง

        ตาเบอร์ลันให้หลานพยุงไปนั่งที่หัวคันนา นั่งรอจนเด็กหนุ่มเดินกลับมาตอนบ่าย มือเปล่า ไหล่แดงเป็นรอยเชือก ตาถามคำเดียวว่าทันไหม เด็กหนุ่มบอกว่าทัน ต้นฤดูเกี่ยวปีต่อมาไม่มีใครต้องไปตามเขา เขามายืนรออยู่หน้าบ้านตาตั้งแต่ก่อนสาง
      effects: { flags: [passed_the_first_sheaf_on] }
    - id: tie_the_fourth_cord
      label: ขอเชือกเพิ่มอีกเส้น มัดเส้นที่สี่แบบที่คนรุ่นก่อนมัด แล้วค่อยออกเดิน
      requires: { flag: origin_farm }
      text: |
        ตอนเด็ก{name}เคยเห็นคนแก่ในบ้านมัดฟ่อนแรกด้วยเชือกสี่เส้น สามเส้นมัดรอบฟ่อน เส้นที่สี่รวบปลายรวงไว้ด้วยกัน คนแก่บอกว่าเส้นนั้นมัดไว้ให้ตัวที่นอนอยู่ใต้ทุ่ง ไม่ได้มัดให้อีเซล ตาเบอร์ลันฟังแล้วนิ่งไปพักหนึ่ง บอกว่าแม่ของตาก็มัดสี่เส้น ตาเองลืมไปตั้งแต่เมื่อไรก็ไม่รู้ {name}มัดเส้นที่สี่ ตาเอานิ้วลูบเชือกเส้นนั้นไปมา แล้วไล่ให้รีบไป

        ที่แท่นในวิหาร ฟ่อนของหมู่บ้านอื่นมัดสามเส้นทุกฟ่อน แม่ชีอีเซลรับฟ่อนของ{name}ไป จับเชือกเส้นที่สี่แล้วถามว่าเส้นนี้มัดไว้ทำไม {name}ตอบว่ากันเมล็ดร่วงระหว่างทาง แม่ชีวางฟ่อนลงข้างฟ่อนอื่น แล้วไม่ได้ถามต่อ
      effects:
        stats: { WIS: 1 }
        flags: [tied_the_fourth_cord]
        people: [{ id: neighbour_berlan, name: เบอร์ลัน, gender: m, bond: friend, closeness: 1, age: 81 }]
