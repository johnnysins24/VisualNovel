# ชุด 3 องค์กร: โรงรับเขี้ยว (fang_house) ไฟล์ ข งานอีก 2 เรื่อง เลื่อนยศ 4 เรื่อง ความลับ 4 เรื่อง ถูกตามล่าและออกจากโรง 4 เรื่อง
# คนของสาขาเหมือนไฟล์ ก (ออร์ริส ฟินเดล ยาเรค อาซริธ) ออร์ริสลงจากโต๊ะชั่งในฉากขึ้นยศ 4 เรื่องที่นางยังนั่งโต๊ะกัน max_rank: 3
# เวสซา ผู้เฝ้าทีฟลิ่งจากป้อมสาม (ไฟล์ 88_org_wardens_a) มาขอหน้าสมุดเขี้ยวในฉากทรยศ
# ผลงานเพิ่มนอกงาน: หนี้ค่าหัว 1 · ห้องหลัง 1 · สมุดเขี้ยว 2 · เขาทีฟลิ่ง 1 รวม 5
# hunted fang_house +1 ในงาน: กรีดสายรัดอานยาเรค (ไฟล์ ก) · ขายถ่านจากหีบ · ตามเกวียนด้ายแดง
# ฉากตามล่าเรื่องที่สองไม่ผูกกับการเป็นสมาชิก ใช้ได้กับคนที่ออกจากโรงไปพร้อมของของโรง

# ---------- งานที่โรงส่งมา (ไฟล์ ข: 2 เรื่อง) ----------
- id: adult.fang_duty_star_lump
  stage: adult
  scene: clan_hall
  weight: 20
  duty: fang_house
  when:
    age: [28, 64]
    org: fang_house
  text: |
    ก้อนดาวสาปตกทะลุหลังคาโรงเก็บหินของตระกูลเตาเจ็ดในฮอร์ดุนเมื่อสามคืนก่อน ก้อนเท่าหม้อหุงข้าว สีเทาเหลือบเงิน ร้อนจนหิมะรอบรูบนหลังคาละลายเป็นวงกลม ทุกอย่างที่มันแตะกลายเป็นแก้วขุ่น หินแกรนิตที่ตระกูลสะสมไว้สร้างโถงใหม่กลายเป็นแก้วไปสามก้อน คนแคระคนแรกที่เอามือไปแตะนิ้วแข็งเป็นแก้วสองข้อ

    ใบของตระกูลเขียนด้วยลายมือคนแคระ ตัวหนังสือเหลี่ยมหนัก หกเหรียญให้คนที่เอามันออกไปจากโรงเก็บหินโดยไม่ให้แตะหินของตระกูลอีกก้อน โรงรับเขี้ยวรับเศษของมันเป็นหลักฐาน ผู้เฒ่าตระกูลยืนกอดอกอยู่หน้าประตู เคราพันเข้าเข็มขัดสองรอบ บอกว่าคนในตระกูลไม่มีใครเข้าไปอีกแล้ว

    หน้าประตูโรงเก็บหินมีชายในเสื้อคลุมของสถาบันเวทหลวงนั่งรออยู่บนลังไม้ตั้งแต่เช้า ข้างเท้ามีกล่องบุตะกั่วใบเล็ก เขาไม่ได้ถือใบของใคร
  choices:
    - id: burn_it_in_place
      label: ก่อกองถ่านล้อมมัน เผาอยู่กับที่จนมันแตก
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ใช้คีมยาวคีบถ่านหินของตระกูลไปวางล้อมทีละก้อน ไม่ให้คีมแตะผิวมัน เป่าไฟจนถ่านขาวทั้งกอง ก้อนดาวสาปส่งเสียงแตกเปาะทั้งคืนเหมือนน้ำแข็งในแม่น้ำ ตีสี่แตกเป็นเศษเท่าเล็บมือ ความร้อนหายไปพร้อมกัน เศษเย็นจนจับได้

          ผู้เฒ่าตระกูลจ่ายหกเหรียญ นับให้ด้วยมือที่ยังพันผ้า ชายจากสถาบันนั่งดูอยู่ที่ประตูทั้งคืน ตอนสายเขาเก็บกล่องตะกั่วเปล่าแล้วเดินลงเขาไป
        effects: { stats: { CON: 1 }, gold: 6, flags: [burned_a_star_lump] }
      failure:
        text: |
          ควันจากกองถ่านอัดอยู่ในโรงเก็บหิน {name}เป่าไฟจนหน้ามืด ล้มลงห่างก้อนดาวไม่ถึงศอก แขนเสื้อข้างหนึ่งแตะผิวมันไปครู่เดียว ผ้าแข็งเป็นแก้วขุ่นตั้งแต่ข้อศอกลงไป ผิวข้างใต้แดงพอง

          คนแคระสองคนลากตัว{name}ออกมา ก้อนนั้นแตกเองตอนเช้าเพราะไฟที่เหลือ ผู้เฒ่าตระกูลจ่ายครึ่งเดียว บอกว่าครึ่งที่เหลือเป็นของไฟ
        effects: { hp: -2, gold: 3, flags: [burned_a_star_lump] }
    - id: drag_it_out
      label: คล้องโซ่ ลากขึ้นเลื่อนเหล็ก พาออกไปกลางหิมะ
      check: { stat: STR, dc: 13 }
      success:
        text: |
          โซ่เหล็กกลายเป็นแก้วทีละห่วงจากปลายที่แตะมัน {name}ลากเร็วกว่าที่แก้วไต่ขึ้นมา ก้อนดาวไถลขึ้นเลื่อนเหล็ก ออกประตูไปกลางลานหิมะ หิมะรอบตัวมันละลายเป็นบ่อน้ำร้อน ไอขึ้นเป็นเสา

          สามวันต่อมาก้อนนั้นเย็นลงจนแตกเป็นเศษ เด็กในตระกูลมายืนดูเสาไอน้ำกันทุกเช้า ผู้เฒ่าตระกูลจ่ายหกเหรียญ เลื่อนเหล็กคันนั้นตระกูลไม่ขอคืน
        effects: { stats: { STR: 1 }, gold: 6, flags: [hauled_a_star_lump] }
      failure:
        text: |
          โซ่กลายเป็นแก้วเร็วกว่าที่คิด ห่วงกลางแตกตอน{name}กระชากเต็มแรง ก้อนดาวกลิ้งกลับไปแตะหินแกรนิตอีกก้อน{name}ล้มหงายหลังกระแทกพื้นหิน

          ตระกูลหักค่าหินก้อนนั้นออกจากค่าหัว เหลือสองเหรียญ ก้อนดาวกลิ้งออกไปเองตอนหิมะละลายรอบมันจนเป็นร่อง
        effects: { hp: -1, gold: 2, flags: [hauled_a_star_lump] }
    - id: let_the_institute_have_it
      label: ให้ชายจากสถาบันเอากล่องตะกั่วเข้าไปเก็บมันไปทั้งก้อน แล้วเคาะเศษเล็กไว้วางบนโต๊ะ
      text: |
        ชายจากสถาบันใส่ถุงมือตะกั่ว ใช้คีมเงินคีบก้อนดาวใส่กล่องได้ในอึดใจเดียว เหมือนทำมาหลายครั้ง ก่อนปิดฝา{name}เคาะเศษเท่าเมล็ดถั่วออกมาได้ชิ้นหนึ่ง เขาจ่ายห้าเหรียญโดยไม่ต่อรอง ผู้เฒ่าตระกูลจ่ายอีกสามเหรียญตามใบที่เหลือ เพราะของออกไปจากโรงเก็บหินแล้วจริง

        ที่โต๊ะชั่ง เศษเท่าเมล็ดถั่วชั่งได้ราคาเต็มใบ ไม่มีใครถามว่าก้อนที่เหลือไปอยู่ที่ไหน
      effects: { gold: 8, world: { star: 1 }, flags: [let_the_institute_take_a_star_lump] }
    - id: find_someone_else
      label: บอกผู้เฒ่าตระกูลให้หาคนอื่น
      refuse: true
      text: |
        ผู้เฒ่าตระกูลไม่ตอบ หันหลังกลับเข้าบ้าน ปิดประตูหนักจนหิมะบนหลังคาร่วง

        ขากลับ{name}สวนกับชายจากสถาบันที่กำลังเดินขึ้นเขาไปอีกรอบ ถุงมือตะกั่วเหน็บเข็มขัด กล่องบุตะกั่วหนีบรักแร้
      effects: { flags: [left_the_star_lump] }

- id: adult.fang_duty_proof_chest
  stage: adult
  scene: road
  weight: 20
  time: night
  duty: fang_house
  when:
    age: [30, 64]
    org: { id: fang_house, max_rank: 3 }
  text: |
    ทุกปลายฤดู หีบหลักฐานที่สาขาชั่งแล้วจ่ายแล้วต้องเดินทางไปโรงใหญ่ที่ประตูตะวันออกของเวนทราส โรงฟอกหนังเก่าที่โรงรับเขี้ยวเริ่มต้น ของในหีบจะเข้าเตาเผาของโรงใหญ่ ไม่ให้เขี้ยวซี่เดิมกลับมาวางบนโต๊ะได้อีก ไม่จ่ายสองครั้ง ฟินเดลบอกทุกคนที่ถือหีบไปแบบนี้ ด้วยประโยคเดียวกันทุกปี

    หีบเหล็กลงกลอนสองชั้น กุญแจชั้นหนึ่งอยู่ที่ออร์ริส อีกชั้นอยู่ที่โรงใหญ่ หนักจนล่อตัวเดียวต้องลากเกวียนเล็กไปทั้งคัน ทางสามวัน

    คืนที่สองที่โรงเตี๊ยมริมทาง ชายในเสื้อคลุมขนแกะมานั่งข้าง{name} ตัวมีกลิ่นถ่าน ด้ายแดงเส้นเล็กพันข้อมือสามรอบ เขาขอซื้อถ่านหมาเถ้าในหีบหนึ่งก้อน สี่เหรียญ เขารู้ว่าในหีบมีเพราะเห็นตอนยกขึ้นเกวียน และรู้วิธีถอดสลักบานพับโดยไม่ต้องแตะกลอนทั้งสองชั้น
  choices:
    - id: deliver_it_sealed
      label: บอกเขาว่าหีบไม่ใช่ของตัวเอง แล้วส่งให้ถึงโรงใหญ่ทั้งสองกลอน
      text: |
        โรงใหญ่ยังมีกลิ่นน้ำฝาดของโรงฟอกหนังติดผนัง เสมียนแก่คนหนึ่งไขกลอนชั้นที่สอง ตรวจตามใบรายการของออร์ริสทีละห่อ ครบ ลงชื่อในใบรับให้ เตาเผาใหญ่อยู่สุดโถง ประตูเตาเปิดอ้า ข้างในกวาดเรียบ ไม่มีขี้เถ้าสักกำ

        {name}ถามว่าเตาจุดเมื่อไร เสมียนแก่บอกว่าวันสุดท้ายของฤดู แล้วยื่นใบรับให้ ใบรับลงวันที่วันนี้
      effects: { reputation: { fang_house: 1 }, flags: [saw_the_cold_furnace] }
    - id: sell_him_one
      label: รับสี่เหรียญ ให้เขาถอดสลักเอาไปก้อนหนึ่ง
      text: |
        เขาถอดสลักบานพับด้วยตะปูตัวเดียวในอึดใจเดียว ล้วงมือเข้าไปไม่ต้องดู หยิบห่อผ้าน้ำมันออกมาห่อหนึ่ง แล้วตอกสลักกลับเข้าที่ หีบดูเหมือนเดิมทุกอย่าง

        ที่โรงใหญ่ เสมียนแก่ตรวจตามใบรายการทีละห่อ ห่อที่สิบเจ็ดไม่มี เขาไม่ถามสักคำ จดชื่อ{name}ลงท้ายใบรับ ขีดเส้นใต้ แล้วพับเก็บแยกจากใบอื่น
      effects: { gold: 4, alignment: { law: -1 }, hunted: { fang_house: 1 }, flags: [sold_a_coal_from_the_chest] }
    - id: look_inside
      label: รอเขากลับไป แล้วถอดสลักดูข้างในเอง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ข้างในหีบไม่ใช่กองของที่รอเผา ห่อทุกห่อผูกเชือกแน่น แขวนป้ายกระดาษเล็กๆ ห่อถ่านหมาเถ้าผูกด้ายแดงสามรอบที่ปมเชือก ห่อเศษแก้วกับตาลอยแห้งวาดรูปดาวดวงเล็กด้วยหมึกไว้ที่มุมป้าย ไม่มีห่อไหนเขียนว่าเผา

          {name}ตอกสลักกลับก่อนไก่ขัน มือไม่สั่นจนถึงตอนนั้น ที่โรงใหญ่ เสมียนแก่ตรวจครบทุกห่อ ลงชื่อในใบรับให้โดยไม่ดูบานพับ
        effects: { stats: { DEX: 1 }, flags: [saw_the_sorted_proofs] }
      failure:
        text: |
          สลักตัวล่างหักคามือ {name}ตอกกลับได้ครึ่งเดียว บานพับเอียงจนฝาหีบปิดไม่สนิท

          ที่โรงใหญ่ เสมียนแก่ดูบานพับก่อนดูอย่างอื่น ปรับสองเหรียญค่าสลัก หักจากค่าเดินทาง แล้วจดชื่อ{name}ลงท้ายใบรับ
        effects: { gold: -2, flags: [broke_the_chest_pin] }
    - id: ask_for_another
      label: บอกออร์ริสก่อนออกเดินทางว่าให้คนอื่นถือหีบไป
      refuse: true
      text: |
        ยาเรครับหีบไปแทน กลับมาในหกวัน ใส่รองเท้าบู๊ตคู่ใหม่ หนังดีกว่าที่นักล่าป้ายทองเหลืองจะซื้อไหว

        ฟินเดลเขียนในสมุดของสาขาว่าใครปฏิเสธหีบรอบนี้ ยาเรคเอารองเท้าคู่ใหม่ขึ้นพาดโต๊ะในโรงเตี๊ยมให้ทุกคนดูอยู่หลายคืน
      effects: { flags: [passed_on_the_proof_chest] }

# ---------- เลื่อนยศ ----------
- id: adult.fang_rise_brass
  stage: adult
  scene: market
  weight: 60
  must: true
  mark: ขึ้นเป็นนักล่าป้ายทองเหลือง
  when:
    age: [19, 80]
    org: { id: fang_house, min_rank: 1, max_rank: 1, ready: true }
  text: |
    ออร์ริสไม่ได้เรียก{name}ขึ้นไปยืนหน้าใคร เช้านั้นนางนั่งตอกเลขลงป้ายทองเหลืองแผ่นใหม่ที่ปลายโต๊ะชั่ง ด้วยค้อนเล็กกับเหล็กตอกตัวเลข ทีละตัว นักล่าที่ต่อแถวรอชั่งของต้องรอจนนางตอกเสร็จ เจาะรู ร้อยห่วง แล้วยื่นป้ายข้ามโต๊ะมาให้{name}โดยไม่ลุกจากเก้าอี้

    ฟินเดลเปิดตู้ไม้หลังโต๊ะชั่ง หยิบสมุดเล่มหนาปกหนังวัวมาวางให้ สมุดทางเขี้ยว ทุกหน้าเป็นลายมือนักล่าคนละคน คนละรุ่น หมาเถ้าเข้าหาคนจากทางไหน หมีเลือกตีข้างไหน ปูฝนเค็มกลัวอะไร บางหน้ามีรอยเลือดแห้งเป็นจุดที่มุมกระดาษ

    ออร์ริสบอกว่านักล่าป้ายทองเหลืองเปิดสมุดเล่มนี้อ่านได้ทุกเมื่อ เบิกเกลือกับผ้าพันแผลจากสาขาไปก่อนได้ จ่ายคืนตอนได้ค่าหัว ส่วนตู้ใบข้างๆ ที่ลงกลอนสองชั้น ไม่ใช่ของป้ายทองเหลือง
  choices:
    - id: hang_it_and_read
      label: แขวนป้ายที่เข็มขัด นั่งอ่านหน้าหมาเถ้าตรงนั้นเลย
      text: |
        หน้าหมาเถ้ามีลายมือเจ็ดคน คนแรกเขียนว่าแทงที่อก คนที่สามขีดฆ่าแล้วเขียนว่าแทงใต้ซี่โครงข้างซ้าย ตอนถ่านในอกหรี่ คนที่เจ็ดเขียนไว้บรรทัดเดียว ตัวเล็ก อย่าไปคนเดียว

        {name}อ่านจนถึงหน้าหมีก่อนออร์ริสจะปิดโต๊ะ ป้ายทองเหลืองที่เข็มขัดกระทบหัวเข็มขัดดังกริ๊กทุกครั้งที่ขยับตัว ดังจนต้องเอาผ้าพันไว้รอบหนึ่ง
      effects: { org: { id: fang_house, promote: true }, items: [fang_brass_tag], flags: [read_the_fang_path] }
    - id: write_a_page
      label: ขอกระดาษเปล่า เขียนหน้าของตัวเองลงสมุดทางเขี้ยว
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}เขียนเรื่องที่รู้ดีที่สุดเรื่องเดียว สั้น ไม่มีตอนไหนเล่าว่าตัวเองเก่ง ออร์ริสอ่านจบแล้วยื่นให้ฟินเดลเย็บเข้าเล่ม ต่อท้ายหน้าที่ลายมือเหมือนกันเจ็ดคน

          ป้ายทองเหลืองห้อยอยู่ที่เข็มขัดตั้งแต่บ่ายวันนั้น ฟินเดลจดเลขป้ายไว้ที่มุมหน้ากระดาษที่{name}เขียน
        effects: { org: { id: fang_house, promote: true }, stats: { INT: 1 }, items: [fang_brass_tag], flags: [read_the_fang_path, wrote_a_fang_path_page] }
      failure:
        text: |
          ออร์ริสอ่านครึ่งหน้าแล้ววาง บอกว่านี่เป็นเรื่องเล่า ไม่ใช่ทางเขี้ยว ทางเขี้ยวไม่มีใครเป็นพระเอก นางพับกระดาษแผ่นนั้นคืนใส่มือ{name}อย่างระวัง ไม่ได้ขยำ

          ป้ายทองเหลืองห้อยอยู่ที่เข็มขัดตั้งแต่บ่ายวันนั้น กระดาษแผ่นนั้นอยู่ในย่ามอีกหลายปี
        effects: { org: { id: fang_house, promote: true }, items: [fang_brass_tag], flags: [read_the_fang_path] }
    - id: the_dead_mans_number
      label: อ่านเลขบนป้ายซ้ำ เลขเดียวกับป้ายในย่ามของนักล่าที่ตายข้างทาง
      requires: { flag: sold_a_dead_mans_sack }
      text: |
        ออร์ริสบอกว่าโรงไม่ทิ้งเลข ป้ายของคนที่ไม่กลับหลอมใหม่แล้วตอกเลขเดิม ให้คนถัดไป เลขของโรงมีจำกัด คนไม่จำกัด ฟินเดลเปิดสมุดของสาขาไปหน้าที่ขีดเส้นทับชื่อไว้เส้นเดียว ข้างเลขนั้นมีชื่อเรียงกันสามชื่อ สองชื่อแรกขีดเส้นทับ

        {name}แขวนป้ายที่เข็มขัด ฟินเดลเขียนชื่อ{name}ต่อเป็นชื่อที่สี่
      effects: { org: { id: fang_house, promote: true }, stats: { WIS: 1 }, items: [fang_brass_tag], flags: [wears_a_dead_mans_number] }
    - id: azriths_knot
      label: ให้อาซริธผูกป้ายเข้ากับเข็มขัดด้วยเงื่อนหนังแบบของนาง
      requires: { flag: hunted_with_azrith }
      text: |
        อาซริธตัดเส้นหนังฟอกจากที่พันเขาของตัวเองออกมาเส้นหนึ่ง ร้อยรูป้ายแล้วผูกเงื่อนที่ไม่มีปลายให้ดึง นางบอกว่าเงื่อนนี้ไม่หลุดเวลาวิ่ง และไม่ดังเวลาย่อง ป้ายที่ดังเวลาย่องฆ่าคนมาแล้วหลายคน

        คืนนั้นนางพาไปกินเหล้าโรงเตี๊ยมที่นักล่าป้ายทองเหลืองนั่งกัน โต๊ะในสุด ติดผนัง
      effects: { org: { id: fang_house, promote: true }, stats: { DEX: 1 }, items: [fang_brass_tag], flags: [read_the_fang_path] }

- id: adult.fang_rise_black_iron
  stage: adult
  scene: market
  weight: 60
  must: true
  mark: ขึ้นเป็นนักล่าป้ายเหล็กดำ
  when:
    age: [19, 80]
    org: { id: fang_house, min_rank: 2, max_rank: 2, ready: true }
  text: |
    ป้ายเหล็กดำไม่มีเลข ไม่มีรูร้อยห่วง เป็นแผ่นเหล็กหล่อเท่าฝ่ามือเด็ก ผิวด้าน ขอบคมพอบาดนิ้วถ้าจับไม่ระวัง ออร์ริสวางมันบนโต๊ะชั่ง แล้วยกม่านผ้ากระสอบหลังโต๊ะขึ้นให้{name}เดินเข้าไปเป็นครั้งแรก

    ห้องหลังกว้างกว่าที่คิด กลิ่นเกลือ กลิ่นถ่าน กลิ่นหนังดิบ ชั้นไม้เรียงชิดผนังสามด้าน บนชั้นเป็นห่อผ้าผูกเชือก แขวนป้ายกระดาษเล็กๆ ผนังด้านที่สี่มีใบค่าหัวปักไว้ด้วยมีดเจ็ดแปดเล่ม ใบที่ไม่เคยขึ้นกระดานหน้าร้านไหน

    ออร์ริสบอกกติกาของห้องนี้ข้อเดียว ของที่เห็นในห้องนี้ ไม่ได้เห็น แล้วให้เลือกใบบนผนังได้หนึ่งใบเป็นใบแรก
  choices:
    - id: pull_the_oldest_knife
      label: ดึงมีดเล่มที่สนิมจับมากที่สุดออกจากผนัง
      text: |
        ใบใต้มีดเล่มนั้นปักอยู่นานจนกระดาษเหลืองเป็นวงรอบรูมีด ไม่มีใครเอาไปเพราะค่าหัวน้อยกว่าความเสี่ยง หุ่นเรือนร้างในคฤหาสน์ที่เจ้าของตายไปแล้ว ทายาทอยากขายบ้านโดยไม่มีใครรู้ว่าข้างในมีอะไรเดินอยู่

        ออร์ริสเลิกคิ้วข้างหนึ่ง บอกว่าเลือกใบที่คนอื่นไม่เอา ใช้ได้ ป้ายเหล็กดำห้อยคู่กับป้ายทองเหลืองที่เข็มขัดตั้งแต่วันนั้น หนักกว่ากันสามเท่า
      effects: { org: { id: fang_house, promote: true }, items: [fang_black_iron_tag], flags: [took_the_oldest_curtain_paper] }
    - id: read_the_bundle_tags
      label: เดินช้าๆ ผ่านชั้นไม้ อ่านป้ายกระดาษที่ผูกห่อผ้า
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ป้ายกระดาษไม่มีชื่อเมือง ไม่มีชื่อคน มีแต่เครื่องหมายสองแบบ ห่อหนึ่งผูกด้ายแดงสามรอบที่ปมเชือก อีกห่อวาดดาวดวงเล็กด้วยหมึกที่มุมป้าย ห่อที่ผูกด้ายแดงทุกห่อหนักและดำ ห่อที่วาดดาวทุกห่อเบาและวาวเมื่อโดนแสง

          {name}เลือกใบบนผนังได้หนึ่งใบ ออร์ริสยื่นป้ายเหล็กดำให้ตอนออกจากห้อง แล้วปล่อยม่านลงช้าๆ จนสุด
        effects: { org: { id: fang_house, promote: true }, stats: { WIS: 1 }, items: [fang_black_iron_tag], flags: [noticed_two_marks_in_the_back_room] }
      failure:
        text: |
          {name}ยังอ่านป้ายไม่ทันถึงห่อที่สาม ออร์ริสก็มายืนบังชั้นไม้ บอกว่าของที่เห็นในห้องนี้ ไม่ได้เห็น ข้อเดียวของห้องนี้ ไม่ต้องบอกซ้ำ

          {name}เลือกใบบนผนังได้หนึ่งใบ ป้ายเหล็กดำห้อยคู่กับป้ายทองเหลืองที่เข็มขัดตั้งแต่วันนั้น
        effects: { org: { id: fang_house, promote: true }, items: [fang_black_iron_tag], flags: [took_the_oldest_curtain_paper] }
    - id: ask_about_people_papers
      label: ถามออร์ริสว่าใบบนผนังนี้มีใบคนบ้างไหม
      requires: { flag: job_bounty_hunter }
      text: |
        ออร์ริสชี้ผ่านช่องม่านออกไปที่คานไม้เหนือโต๊ะชั่ง ข้อแรก แล้วดึงใบหนึ่งลงจากผนังให้อ่าน ใบเขียนว่าตัวที่ตอบได้ หนึ่งตัว ในโรงพักถังร้าง ไม่มีคำว่าคน ไม่มีคำว่าแก้ว

        {name}ปักใบนั้นคืนด้วยมีดเล่มเดิม เลือกใบหมูป่าในไร่องุ่นแทน ป้ายเหล็กดำห้อยคู่กับป้ายทองเหลืองที่เข็มขัดตั้งแต่วันนั้น
      effects: { org: { id: fang_house, promote: true }, stats: { INT: 1 }, items: [fang_black_iron_tag], flags: [asked_about_people_papers] }

- id: adult.fang_rise_table
  stage: adult
  scene: market
  weight: 60
  must: true
  mark: ขึ้นเป็นเจ้าโต๊ะชั่ง
  when:
    age: [19, 80]
    org: { id: fang_house, min_rank: 3, max_rank: 3, ready: true }
  text: |
    ออร์ริสเลิกชั่งในฤดูที่มือขวาของนางบีบตาชั่งไม่อยู่ ข้อนิ้วบวมเป็นปุ่มเหมือนรากไม้ นางจะกลับไปฟอกหนังกับพี่สาวที่ริมแม่น้ำ งานที่มือของนางรู้จักก่อนโต๊ะนี้ นางว่ามือคนฟอกหนังไม่ต้องบีบอะไรแน่น

    เช้าวันสุดท้ายของนาง ออร์ริสถอดตราของโรงออกจากคอ ตราทองเหลืองรูปตาชั่งที่สึกจนลายเกือบเรียบ วางลงในมือ{name} ตามด้วยกุญแจสองดอกของตู้สองชั้น สมุดเขี้ยวอยู่ในชั้นล่าง นางไม่ได้บอกว่าข้างในมีอะไร บอกแค่ว่าเปิดคนเดียว ปิดคนเดียว

    ของชิ้นแรกที่วางบนโต๊ะเช้านั้นมาพร้อมกันสองชิ้น ยาเรคกับอาซริธเดินเข้าประตูโรงมาเกือบพร้อมกัน คนละคนถือเขี้ยวหมูป่าคนละซี่ จากหมูตัวเดียวกัน ใบเดียวกัน วางลงบนโต๊ะพร้อมกัน ใบเดียว จ่ายครั้งเดียว
  choices:
    - id: by_the_door
      label: ถามฟินเดลว่าเท้าของใครข้ามธรณีประตูก่อน
      text: |
        ฟินเดลนั่งหันหน้าเข้าประตูมาสิบกว่าปี เขาตอบโดยไม่ต้องคิด อาซริธ ครึ่งก้าว {name}จ่ายให้อาซริธ ยาเรคหัวเราะเสียงดังจนนักล่าที่ต่อแถวข้างหลังสะดุ้ง แล้วเก็บเขี้ยวของตัวเองใส่ย่าม บอกว่าจะเอาไปทำด้ามมีด

        ออร์ริสนั่งดูอยู่ที่ม้านั่งข้างประตูกับห่อผ้าของนาง รอเกวียนที่จะพาไปริมแม่น้ำ นางไม่ได้ลุกมาช่วย
      effects: { org: { id: fang_house, promote: true }, alignment: { law: 1 }, flags: [paid_by_the_door] }
    - id: whose_kill
      label: ชั่งเขี้ยวทั้งสองซี่ ดูว่าซี่ไหนมาจากข้างที่โดนแผลถึงตาย
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ซี่หนึ่งสะอาด อีกซี่มีเลือดแห้งอยู่ที่โคนเป็นคราบหนา ปลายบิ่น ข้างที่หมูล้มทับตอนตาย {name}ถามว่าใครแทงจากข้างซ้าย ยาเรคยกมือ อาซริธยักไหล่ บอกว่านางถอนซี่ที่เหลือหลังจากมันตายแล้ว

          {name}จ่ายให้ยาเรค อาซริธหัวเราะ บอกว่าเจ้าโต๊ะชั่งคนใหม่ชั่งเป็น แล้วไปนั่งรอยาเรคเลี้ยงเหล้าที่หน้าโรง ออร์ริสลุกจากม้านั่งข้างประตูขึ้นเกวียนไปตอนนั้นพอดี
        effects: { org: { id: fang_house, promote: true }, stats: { INT: 1 }, flags: [weighed_the_killing_tusk] }
      failure:
        text: |
          เขี้ยวสองซี่หนักเท่ากัน ยาวเท่ากัน มีเลือดแห้งเท่ากัน {name}ชั่งสามรอบก็ไม่ต่าง สุดท้ายจ่ายให้อาซริธ เพราะนางวางก่อนครึ่งอึดใจตามที่ฟินเดลบอก ยาเรคเถียงเสียงดังจนออร์ริสต้องลุกจากม้านั่งข้างประตูมาชี้คานไม้

          ยาเรคไม่มาวางของที่โต๊ะนี้อีกหนึ่งเดือน
        effects: { org: { id: fang_house, promote: true }, flags: [paid_by_the_door] }
    - id: pay_once_split
      label: จ่ายครั้งเดียว แล้วผ่าเงินแบ่งครึ่งต่อหน้าทั้งสองคน
      text: |
        {name}นับเงินตามใบลงบนโต๊ะ แบ่งเป็นสองกองเท่ากัน เศษหนึ่งเหรียญที่แบ่งไม่ลงตัว{name}วางเพิ่มจากกระเป๋าตัวเอง ยาเรคกับอาซริธมองกองเงินแล้วมองกันเอง ยาเรคหัวเราะก่อน

        ฟินเดลเขียนลงสมุดของสาขาว่าใบนี้จ่ายครั้งเดียว ลายมือของเขาบรรทัดนั้นเอียงกว่าทุกบรรทัด ออร์ริสที่นั่งรอเกวียนอยู่ข้างประตูส่ายหัว แต่ไม่ได้ลุกมา
      effects: { org: { id: fang_house, promote: true }, gold: -1, alignment: { moral: 1 }, flags: [split_the_first_payment] }

- id: adult.fang_passed_over
  stage: adult
  scene: market
  weight: 30
  when:
    age: [28, 64]
    org: { id: fang_house, max_rank: 3, min_refused: 3 }
  text: |
    ใบดีๆ ไม่มาถึงมือ{name}มาหลายเดือนแล้ว ฟินเดลยื่นใบให้คนอื่นก่อนทุกครั้ง ใบหมีให้อาซริธ ใบหลังม่านให้ยาเรค ใบที่เหลือมาถึงมือ{name}คือใบหนูเหมือง ตัวละครึ่งเหรียญ

    {name}ถามฟินเดลตรงๆ ฟินเดลไม่อธิบาย เปิดสมุดของสาขาไปหน้าของ{name} ข้างชื่อมีวงกลมเล็กๆ เขียนด้วยหมึกแดงหลายวง วงละครั้งที่ปฏิเสธใบ ออร์ริสพูดจากหลังโต๊ะชั่งโดยไม่เงยหน้าจากตาชั่ง โรงไม่ไล่ใคร โรงแค่ยื่นใบให้คนที่รับ
  choices:
    - id: take_the_rat_papers
      label: รับใบหนูเหมืองไปทั้งปึก
      text: |
        หนูเหมืองตัวเท่าแมว กัดเชือกตะเกียงของคนงาน {name}ลงเหมืองสามแห่งในหนึ่งเดือน กลับมาวางหางบนโต๊ะครบทุกใบ เหม็นจนนักล่าที่ต่อแถวข้างหลังถอยไปสองก้าว

        ออร์ริสนับหางทีละหาง จ่ายตัวละครึ่งเหรียญ ฟินเดลไม่ได้เขียนวงแดงเพิ่มในเดือนนั้น
      effects: { gold: 2, flags: [took_the_rat_papers] }
    - id: ask_orris_for_one
      label: ขอใบดีๆ จากมือออร์ริสตรงๆ สักใบ
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ออร์ริสวางตาชั่ง ดึงใบหนึ่งออกจากใต้โต๊ะ ใบหมูป่าที่กินคนเลี้ยงหมูไปแล้วหนึ่งคน บอกว่าใบนี้ไม่มีใครเอาเพราะหมู่บ้านอยู่ไกล ถ้า{name}คืนใบนี้อีก ใบต่อไปก็คือใบหนู

          {name}พับใบใส่อกเสื้อ ฟินเดลจดเลขใบไว้ข้างชื่อ{name} ด้วยหมึกดำ
        effects: { stats: { CHA: 1 }, flags: [asked_orris_for_a_paper] }
      failure:
        text: |
          ออร์ริสบอกว่าใบหนูก็เป็นใบ หนูกินเชือกตะเกียงจนคนงานต้องทำงานในความมืด แล้วกลับไปชั่งของของนักล่าคนถัดไป

          {name}ยืนอยู่หน้าโต๊ะจนนักล่าคนถัดไปกระแอม
        effects: { alignment: { law: -1 }, flags: [asked_orris_for_a_paper] }
    - id: strike_the_name
      label: บอกฟินเดลให้ขีดชื่อออกจากสมุดของสาขา
      text: |
        ฟินเดลขีดเส้นทับชื่อ{name}เส้นเดียว แบบเดียวกับที่ขีดชื่อคนที่ไม่กลับ แล้วเขียนตัวเล็กๆ ไว้ข้างเส้นว่าออกเอง ออร์ริสบอกว่าโรงไม่ตามคนที่ออกทางประตูหน้า

        ขาออก{name}เดินผ่านกระดานหน้าโรงเตี๊ยมที่เคยปลดใบ แผ่นทองเหลืองที่หัวกระดานขึ้นเงาเหมือนเดิม
      effects: { org: { id: fang_house, leave: true }, flags: [left_the_fang_house] }

# ---------- ความลับ ----------
- id: adult.fang_secret_village_debt
  stage: adult
  scene: road
  weight: 25
  when:
    age: [30, 64]
    org: { id: fang_house, min_rank: 2, max_rank: 3 }
  text: |
    ใบหมาป่าใบที่สามของปีมาจากหมู่บ้านเลี้ยงแกะริมเขา คราวนี้{name}ไปถึงแล้วเจอรั้วใหม่ล้อมทุ่งเลี้ยงสัตว์ส่วนกลาง เสาทุกต้นทาสีน้ำเงิน ป้ายไม้ตอกตราตาชั่งเหล็กคล้องโซ่ของธนาคารเบเลค แกะของหมู่บ้านยืนเบียดกันอยู่ในคอกเล็กหลังวิหาร กินฟางแห้ง

    ผู้ใหญ่บ้านเล่าให้ฟังที่ประตูคอก เงินบนใบค่าหัวทุกใบของหมู่บ้านไม่ใช่เงินของหมู่บ้าน ธนาคารออกให้ก่อน เขาลงชื่อรับทุกครั้ง สามใบในปีเดียว หมาป่า หมาป่า หมูป่า หมู่บ้านใช้คืนไม่ทัน ทุ่งเลยเป็นของธนาคาร คนของธนาคารบอกเขาเองว่าโรงรับเขี้ยวได้ส่วนแบ่งจากทุกใบ ทั้งตอนธนาคารออกเงิน ทั้งตอนโต๊ะชั่งจ่ายค่าหัว

    หมาป่ายังอยู่ เมื่อคืนมันเข้าคอกหลังวิหาร ผู้ใหญ่บ้านถือกระดาษใบใหม่ที่ยังไม่ลงชื่อไว้ในมือ ถ้าลงชื่อ ธนาคารจะออกเงินใบที่สี่ ใบที่สี่จะจ่ายให้{name}
  choices:
    - id: carry_the_fourth_paper
      label: บอกให้เขาลงชื่อ ฆ่าหมาป่า แล้วถือใบที่สี่กลับไปวางบนโต๊ะ
      text: |
        ผู้ใหญ่บ้านลงชื่อด้วยมือที่จับปากกาเหมือนจับมีด {name}ฆ่าหมาป่าสองตัวในคืนนั้น ตัวที่สามหนีขึ้นเขา ที่โต๊ะชั่ง ฟินเดลเขียนลงสมุดสองบรรทัด บรรทัดหนึ่งค่าหัว อีกบรรทัดส่วนของโรงจากเงินที่ธนาคารออก สองบรรทัดอยู่ติดกัน ลายมือเดียวกัน

        ออร์ริสไม่ถามว่า{name}รู้อะไรมา นางแค่วางใบต่อไปของหมู่บ้านเดียวกันไว้ข้างมือ{name} ยังไม่ได้ลงชื่อ
      effects: { org: { id: fang_house, merit: 1 }, gold: 3, alignment: { moral: -1 }, flags: [carried_the_fourth_paper] }
    - id: hunt_without_a_paper
      label: บอกเขาไม่ต้องลงชื่อ คืนนี้จะเฝ้าคอกให้เอง ไม่เอาเงิน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}นั่งเฝ้าคอกหลังวิหารสามคืน คืนที่สามหมาป่ามาสองตัว ตัวหนึ่งไม่ได้กลับ อีกตัวหนีขึ้นเขาไปพร้อมรอยหอกที่สะโพก ไม่กลับมาอีกจนสิ้นหนาว

          ผู้ใหญ่บ้านฉีกกระดาษใบที่สี่ทิ้งลงเตา หางหมาป่า{name}ไม่ได้เอาไปวางบนโต๊ะ ทิ้งไว้ให้เด็กในหมู่บ้านผูกปลายไม้เล่น
        effects: { stats: { CON: 1 }, flags: [hunted_for_the_village_free] }
      failure:
        text: |
          คืนที่สองหมาป่ามาสามตัว {name}ไล่ได้สองตัว ตัวที่สามงับน่องไว้จนต้องตีด้วยด้ามหอกสามครั้งกว่ามันจะปล่อย แกะตายสองตัว

          เช้านั้นผู้ใหญ่บ้านลงชื่อในกระดาษใบที่สี่ ส่งลูกชายเอาไปให้โรงรับเขี้ยวในเมือง ใบไปถึงโต๊ะชั่งก่อน{name}จะเดินได้
        effects: { hp: -2, flags: [hunted_for_the_village_free] }
    - id: tell_the_square
      label: ไปยืนกลางลานหมู่บ้าน บอกทุกคนว่าเงินบนใบมาจากไหน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          คนทั้งหมู่บ้านมาฟังที่ลานหน้าวิหาร {name}เล่าตามที่ผู้ใหญ่บ้านเล่า แล้วเล่าส่วนที่ผู้ใหญ่บ้านไม่รู้ ว่าใบที่ขึ้นกระดานแต่ละใบโต๊ะชั่งได้ส่วนแบ่งกี่ส่วน ไม่มีใครลงชื่อในใบที่สี่ คนเลี้ยงแกะสามบ้านไปบอกหมู่บ้านถัดไปก่อนค่ำ

          เดือนต่อมาฟินเดลเปิดสมุดของสาขาให้ออร์ริสดูหน้าหนึ่ง หมู่บ้านในเขตนั้นไม่ส่งใบมาเลยสามหมู่บ้าน ออร์ริสอ่านแล้วปิดสมุด ใบหลังม่านใบต่อมาของ{name}เป็นใบที่ไกลที่สุดบนผนัง
        effects: { stats: { CHA: 1 }, reputation: { fang_house: -1 }, flags: [told_the_villages_of_the_debt] }
      failure:
        text: |
          คนมาฟังไม่ถึงสิบคน ส่วนใหญ่เป็นคนแก่ เมียคนเลี้ยงแกะคนหนึ่งถามว่าถ้าไม่ลงชื่อ ใครจะจ่ายค่าหมาป่า {name}ตอบไม่ได้

          ผู้ใหญ่บ้านลงชื่อในใบที่สี่ตอนเย็น ยื่นให้{name}ด้วยตัวเอง บอกว่าเอาไปเถอะ อย่างน้อยเงินก็ตกถึงมือคนที่ฆ่าหมาจริง
        effects: { alignment: { moral: 1 }, flags: [told_the_villages_of_the_debt] }

- id: adult.fang_secret_back_room
  stage: adult
  scene: market
  weight: 25
  time: night
  when:
    age: [32, 64]
    org: { id: fang_house, min_rank: 3, max_rank: 3 }
  text: |
    สิ้นเดือน{name}อยู่ช่วยห้องหลังจนดึก ลังไม้สองใบวางกลางห้อง ฝาเปิด ใบหนึ่งรับถ่านหมาเถ้าทุกก้อนที่สาขาชั่งไปในเดือนนั้น อีกใบรับเศษผิวแก้ว ตาลอยตากแห้ง ผงจากปีกแมลงหึ่ง ห่อถ่านผูกด้ายแดงสามรอบ ห่อแก้วกับตาวาดดาวดวงเล็กด้วยหมึก

    ฟินเดลเขียนใบส่งของสองใบ ใบแรกจ่าหน้าถึงโรงหลอมเก่าที่หุบเขาเหล็กในฮอร์ดุน โรงที่คนแคระทั้งหุบรู้ว่าไม่ได้จุดเตามายี่สิบปี ใบที่สองจ่าหน้าถึงวงอ่านหนังสือชั้นสามของสถาบันเวทหลวง ไม่มีใบไหนจ่าหน้าถึงเตาเผาของโรงใหญ่ ตอน{name}ยังเป็นคนส่งเขี้ยว ทุกคนบอกว่าหลักฐานที่จ่ายแล้วเข้าเตาเผา

    ใกล้ตีสอง เกวียนสองคันมาจอดหลังโรง มาคนละทาง คนขับคันแรกมีด้ายแดงที่ข้อมือ คนขับคันที่สองใส่ถุงมือหนังสีขาว ทั้งสองคนไม่มองหน้ากัน ไม่มีใครรู้ว่าอีกคันมาเอาอะไร
  choices:
    - id: lift_the_crates
      label: ยกลังขึ้นเกวียนทั้งสองคัน แล้วกลับไปนอน
      text: |
        ลังถ่านหนักจนต้องยกสองคน ลังแก้วเบาจนยกคนเดียวได้ คนขับทั้งสองคนไม่ได้ลงมาช่วย ไม่ได้ขอบคุณ ไม่ได้ลงชื่อในกระดาษใบไหน เกวียนสองคันออกไปคนละทางก่อนตีสาม

        เช้านั้นออร์ริสวางเหรียญสองเหรียญบนโต๊ะชั่งตรงหน้า{name} ไม่ใช่ค่าหัวของใบไหน นางบอกว่าค่ายก แล้วชั่งของของนักล่าคนแรกของวันต่อ
      effects: { org: { id: fang_house, merit: 1 }, gold: 2, alignment: { moral: -1 }, flags: [loaded_the_back_room_crates] }
    - id: follow_the_red_cart
      label: ยกลังเสร็จแล้วเดินตามเกวียนคันที่มีด้ายแดงไปในความมืด
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          เกวียนไปจอดที่ลานรถขนถ่านท้ายเมือง คนขับยกลังขึ้นตู้ถ่านที่เขียนชอล์กไว้ข้างตู้ว่าฮอร์ดุน แล้วยื่นใบส่งของให้คนหนึ่งที่ยืนรออยู่ในเงาตู้ เสื้อคลุมดำขลิบแดงเลือดหมู คนนั้นพับใบใส่อกเสื้อแล้วปีนขึ้นตู้ไปนั่งกับลัง

          {name}กลับถึงโรงตอนฟ้าเริ่มเทา ที่ประตูหลังมีชายสองคนในผ้ากันเปื้อนหนังนั่งรออยู่บนลังเปล่า ไม่ได้ถามว่า{name}ไปไหนมา
        effects: { stats: { DEX: 1 }, hunted: { fang_house: 1 }, flags: [followed_the_red_cart] }
      failure:
        text: |
          สองตรอกต่อมา เกวียนหยุด คนขับลงมายืนหันหน้ามาทางที่{name}ยืนในเงา ไม่พูด ไม่ขยับ จนกว่า{name}จะเดินกลับ

          เช้านั้นออร์ริสบอกว่ามีคนเดินตามเกวียนเมื่อคืน นางไม่ได้ถามว่าใคร ไหล่ซ้ายของ{name}เคล็ดตอนปีนกำแพงกลับเข้าโรง
        effects: { hp: -1, hunted: { fang_house: 1 }, flags: [tried_to_follow_the_red_cart] }
    - id: ask_orris_straight
      label: ถามออร์ริสตรงๆ ว่าทำไมบอกคนส่งเขี้ยวว่าของเข้าเตาเผา
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ออร์ริสนั่งลงบนลังเปล่า บอกว่าโรงรู้มากกว่าทุกกลุ่มในทวีป เพราะโรงเห็นทุกอย่างที่ตายแล้ว ของที่ตายแล้วไม่ต้องเผา ขายได้ คนที่ซื้อถ่านไม่รู้ว่ามีคนซื้อแก้ว คนที่ซื้อแก้วไม่รู้ว่ามีคนซื้อถ่าน นางว่าแบบนั้นปลอดภัยกว่าสำหรับทุกคน รวมทั้งโรง

          นางบอกอีกว่าห้องหลังมีกติกาข้อเดียว คืนนี้นางพูดเกินกติกาไปหนึ่งครั้ง เพราะ{name}ถามตรง
        effects: { stats: { CHA: 1 }, flags: [orris_told_of_the_two_buyers] }
      failure:
        text: |
          ออร์ริสบอกว่าของที่เห็นในห้องนี้ ไม่ได้เห็น แล้วยกลังถ่านขึ้นเกวียนเองครึ่งหนึ่ง มือสีน้ำฝาดเกร็งจนข้อนิ้วขาว

          ใบหลังม่านเดือนต่อมาของ{name}มีแต่ใบหนูกับใบนก
        effects: { flags: [orris_told_of_the_two_buyers] }
    - id: write_to_the_fort
      label: เขียนจดหมายถึงป้อมที่ใกล้ที่สุด บอกว่าถ่านหมาเถ้าไปที่โรงหลอมไหน
      text: |
        จดหมายสั้น ไม่ลงชื่อ บอกชื่อหุบเขา ชื่อโรงหลอม และบอกว่าด้ายแดงผูกห่อทุกห่อ {name}ฝากไปกับขบวนถ่านเที่ยวเช้า จ่าหน้าถึงนายคลังของป้อม

        สองเดือนต่อมาข่าวมาตามขบวนถ่านว่าโรงหลอมร้างในหุบเขาเหล็กไฟไหม้ ไม่มีใครตาย ไม่มีใครรู้ว่าไหม้จากอะไร ลังถ่านเดือนนั้นของสาขาไปจอดที่ลานรถขนถ่านนานกว่าทุกเดือน จนมีเกวียนคันใหม่มารับ
      effects: { reputation: { wardens: 1, fang_house: -1 }, flags: [warned_the_fort_of_the_coal_buyer] }

- id: adult.fang_secret_ledger
  stage: adult
  scene: market
  weight: 25
  time: night
  when:
    age: [34, 64]
    org: { id: fang_house, min_rank: 3, max_rank: 3 }
  text: |
    ออร์ริสล้มป่วยกลางฤดูฝน ไข้ขึ้นจนมือสั่นจับปากกาไม่ได้ สิ้นเดือนเป็นคืนที่เจ้าโต๊ะชั่งต้องปิดบัญชีของสาขา นางเรียก{name}เข้าห้องนอนหลังโรง ยื่นกุญแจสองดอกให้ บอกให้ไปเปิดตู้สองชั้น หยิบสมุดในชั้นล่างมา แล้วนั่งจดตามที่นางอ่าน

    สมุดเขี้ยวหนาเท่าฝ่ามือ ปกหนังหมูดำ กระดาษหน้าแรกเหลืองเป็นสีชา ลายมือหน้าแรกเป็นของคนฟอกหนังคนแรกของโรง นับเขี้ยวหมาป่าทีละซี่ หน้าหลังๆ แบ่งเป็นสองช่อง ช่องซ้ายของที่มาจากเถ้า ช่องขวาของที่มาจากฟ้า รวมยอดไว้ท้ายหน้าทุกปี

    {name}จดยอดเดือนนี้ตามที่ออร์ริสอ่าน แล้วพลิกกลับไปดูยอดปีก่อนๆ ตัวเลขทั้งสองช่องไต่ขึ้นทุกปี ไม่เคยลงสักปี ช่วงหลังไต่เร็วขึ้น ช่องขวาเร็วกว่าช่องซ้าย ออร์ริสนอนหลับตาอยู่บนเตียง แต่รู้ว่า{name}พลิกไปหน้าไหน
  choices:
    - id: add_the_columns
      label: บวกยอดของทุกสาขาที่ส่งมาให้ครบทั้งคืน ตามที่ออร์ริสสอน
      text: |
        ยอดของสาขาอื่นมาเป็นกระดาษพับแนบท้ายเล่ม สิบสี่สาขา {name}บวกทีละช่องจนเทียนหมดสองเล่ม ออร์ริสลืมตามาตรวจทุกยอด ผิดสองที่ นางชี้ให้แก้ด้วยนิ้วที่สั่น

        ก่อนสาง นางบอกว่าตั้งแต่คืนนี้ ทุกสิ้นเดือน{name}เป็นคนบวก นางจะอ่านอย่างเดียว แล้วบอกอีกว่าคนที่บวกตัวเลขพวกนี้เป็น นอนไม่ค่อยหลับ นางเองไม่ได้หลับดีมาสิบปีแล้ว
      effects: { org: { id: fang_house, merit: 2 }, flags: [kept_the_fang_ledger] }
    - id: copy_the_totals
      label: ระหว่างที่นางหลับตา คัดยอดรวมรายปีลงหลังใบค่าหัวเปล่า
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ยอดรวมสองช่อง ปีละบรรทัด ย้อนไปสี่สิบปี {name}คัดด้วยดินสอตัวเล็กจนต้องหรี่ตาอ่าน เสร็จก่อนออร์ริสจะลืมตาขึ้นมาถามยอดเดือนถัดไป ใบค่าหัวแผ่นนั้นพับสี่ทบอยู่ใต้พื้นรองเท้าข้างซ้าย

          ขากลับห้องตัวเอง{name}เดินเหมือนคนที่มีกรวดในรองเท้า
        effects: { stats: { DEX: 1 }, flags: [copied_fang_ledger] }
      failure:
        text: |
          คัดได้ไม่ถึงสิบปี ออร์ริสพูดขึ้นมาโดยไม่ลืมตา ให้ยื่นกระดาษแผ่นนั้นมา นางจ่อมุมกระดาษกับเปลวเทียนบนโต๊ะข้างเตียง ถือไว้จนไฟลามถึงนิ้ว

          นางไม่ได้ไล่{name}ออกจากห้อง ให้จดยอดเดือนนี้ต่อจนเสร็จ แล้วเก็บกุญแจสองดอกไว้ใต้หมอนของตัวเอง
        effects: { flags: [orris_burned_the_copy] }
    - id: read_the_two_lines
      label: ถามออร์ริสว่าเส้นสองเส้นที่ไต่ขึ้นนี้คืออะไร
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ออร์ริสไม่ตอบ ให้{name}ตอบเอง {name}เทียบช่องซ้ายกับปีที่หินผนึกแตกที่ป้อมไหนสักแห่งตามข่าวที่ขบวนถ่านเอามา ช่องขวากับปีที่ฝนเค็มตกครั้งแรกที่เวนทราส ตัวเลขขึ้นตามกัน นับหลักฐานของที่ตาย ก็คือนับว่าของจากเถ้ากับของจากฟ้าออกมามากแค่ไหนในแต่ละปี

          ออร์ริสบอกว่าในทวีปนี้มีตัวเลขแบบนี้อยู่เล่มเดียว อยู่ในมือ{name}ตอนนี้
        effects: { stats: { INT: 1 }, flags: [read_the_two_lines] }
      failure:
        text: |
          ออร์ริสบอกว่าเป็นตัวเลข จดให้ถูกก็พอ {name}จดต่อจนจบเดือน ตัวเลขช่องขวาของเดือนนี้มากกว่าทั้งปีที่สามสิบหน้าก่อนรวมกัน

          {name}คืนกุญแจสองดอกไว้ใต้หมอนของนางตอนฟ้าสาง นางหลับไปแล้วจริงๆ
        effects: { flags: [read_the_two_lines] }
    - id: close_it_up
      label: จดยอดเดือนนี้ให้เสร็จ ปิดสมุด คืนกุญแจ
      text: |
        {name}จดยอดเดือนนี้ลงช่อง ตรวจซ้ำหนึ่งรอบ ปิดสมุด ล็อกตู้สองชั้นทั้งสองกลอน วางกุญแจคืนใต้หมอนของออร์ริส

        นางลืมตาขึ้นมาครู่หนึ่ง ถามว่าพลิกไปดูหน้าก่อนๆ หรือเปล่า {name}ตอบว่าดู นางหลับตาลงอีกครั้ง
      effects: { alignment: { law: 1 }, flags: [closed_the_fang_ledger] }

- id: adult.fang_secret_horns
  stage: adult
  scene: market
  weight: 25
  time: night
  when:
    age: [36, 64]
    org: { id: fang_house, min_rank: 4 }
  text: |
    ตู้สองชั้นชั้นบน ใต้ห่อใบรับเก่าที่ไม่มีใครแตะมาหลายสิบปี มีกล่องไม้สนใบหนึ่ง ฝาตอกตะปูปิด {name}งัดออกด้วยปลายมีดชั่ง ข้างในเป็นสมุดบางๆ เล่มหนึ่ง ลายมือเสมียนคนเดียวทั้งเล่ม กับกระดาษอีกหน้าที่ใครสักคนฉีกออกมาจากสมุดเขี้ยว พับสองทบ

    สมุดของเสมียนเป็นบัญชีของโต๊ะหลัง โต๊ะที่ไม่มีในสาขาไหนแล้ว ทุกบรรทัดหน้าตาเหมือนกัน ช่องแรกเป็นจำนวนคู่ของเขาทีฟลิ่ง ช่องที่สองเป็นราคา ช่องผู้ซื้อวาดเป็นรูปดาวดวงเล็กด้วยหมึก บรรทัดสุดท้ายหยุดกลางคำ หน้าที่ฉีกจากสมุดเขี้ยวเป็นลายมือเจ้าโต๊ะชั่งรุ่นนั้น เขียนว่าโรงแขวนคอเสมียนไว้ที่ประตูหลังตามคำสั่งโรงใหญ่ และโรงจะไม่บอกใครว่ารับไปกี่คู่

    {name}นับบรรทัดในสมุดของเสมียนได้เป็นตัวเลข ตัวเลขที่โรงไม่เคยบอกใคร ข้อแรกบนคานไม้เหนือโต๊ะชั่งอยู่ห่างจากตู้ใบนี้สิบก้าว
  choices:
    - id: nail_it_shut
      label: ใส่ทุกอย่างกลับลงกล่อง ตอกตะปูปิดตามเดิม
      text: |
        {name}ตอกตะปูตัวเดิมกลับลงรูเดิมทีละตัว เบาๆ ไม่ให้ฟินเดลที่นอนอยู่ห้องข้างๆ ตื่น วางห่อใบรับเก่าทับไว้ตามที่เคยอยู่

        เช้านั้นนักล่าทีฟลิ่งคนหนึ่งวางเขี้ยวหมาป่าบนโต๊ะชั่ง {name}ชั่ง จ่าย แล้วนับตัวเลขในหัวอีกรอบระหว่างที่นางเดินออกประตู
      effects: { org: { id: fang_house, merit: 1 }, flags: [kept_the_horn_ledger_shut] }
    - id: write_the_count_in
      label: เขียนตัวเลขนั้นลงในสมุดเขี้ยว ในหน้าของปีนั้น ด้วยลายมือของตัวเอง
      text: |
        หน้าของปีนั้นในสมุดเขี้ยวมีรอยฉีกอยู่ตรงกลางเล่ม ขอบกระดาษยังหยัก {name}เขียนลงหน้าถัดไปบรรทัดเดียว จำนวนคู่ของเขาทีฟลิ่ง ผู้ซื้อ วันที่แขวนคอเสมียน แล้วลงชื่อเจ้าโต๊ะชั่งของสาขาไว้ท้ายบรรทัด

        เจ้าโต๊ะชั่งคนต่อไปที่เปิดสมุดเล่มนี้จะอ่านเจอ ใครจะเป็นคนนั้น{name}ยังไม่รู้
      effects: { alignment: { law: 1, moral: 1 }, flags: [wrote_the_horn_count] }
    - id: tell_azrith
      label: เอาสมุดของเสมียนไปให้อาซริธอ่าน
      requires: { flag: hunted_with_azrith }
      text: |
        อาซริธอ่านทีละบรรทัดจนจบ มือที่ถือสมุดไม่สั่น พออ่านจบนางคลายเส้นหนังที่พันเขาข้างซ้ายออกรอบหนึ่ง แล้วพันกลับเข้าไปใหม่ให้แน่นกว่าเดิม

        นางคืนสมุดให้ บอกว่าที่บ้านหญ้าเงินมีคนแก่เล่าว่าสมัยก่อนมีคนหายจากหมู่บ้านทุกหน้าหนาว เด็กส่วนใหญ่ คนในหมู่บ้านคิดว่าหมาเถ้าเอาไป นางจะกลับไปเล่าให้คนแก่พวกนั้นฟังว่าไม่ใช่หมาเถ้า
      effects: { stats: { CHA: 1 }, flags: [showed_azrith_the_horn_ledger] }
    - id: burn_the_box
      label: เอากล่องทั้งใบไปเผาในเตาครัวหลังโรง
      text: |
        ไม้สนติดไฟง่าย กระดาษติดง่ายกว่า สมุดของเสมียนม้วนตัวในไฟทีละหน้าเหมือนมีคนพลิก {name}ยืนดูจนเหลือแต่ตะปูในกองขี้เถ้า

        ตัวเลขนั้นยังอยู่ในหัว ไม่มีที่อื่นในโลกที่เขียนไว้อีกแล้ว
      effects: { alignment: { law: -1 }, flags: [burned_the_horn_ledger] }

# ---------- ถูกตามล่า ทรยศ และออกจากโรง ----------
- id: adult.fang_hunt_fake_tags
  stage: adult
  scene: home
  weight: 15
  time: night
  hunt: fang_house
  when:
    age: [28, 64]
    org: { id: fang_house, max_rank: 3 }
  text: |
    ใบหมาเถ้าที่{name}ปลดมาเมื่อวานยังไม่ถึงโต๊ะ ถ่านสองก้อนห่อผ้าน้ำมันอยู่ในย่ามที่แขวนหลังประตูบ้าน พรุ่งนี้เช้าโต๊ะชั่งเปิด

    ตีหนึ่ง มีคนงัดกลอนประตูหน้าบ้าน คนสามคนเดินเข้ามาโดยไม่รีบ ป้ายทองเหลืองห้อยเข็มขัดคนหน้าสุด เลขบนป้ายตอกเบี้ยว ตัวเลขห่างกันไม่เท่ากัน ป้ายปลอม เขาถือกระบองหุ้มเหล็ก บอกว่าใบนั้นไม่ใช่ของ{name} คนแรกที่ถึงโต๊ะคือคนที่ได้ ไม่จ่ายสองครั้ง เขาพูดกติกาของโรงชัดกว่าฟินเดลเสียอีก
  encounter:
    foe: mercenary
    name: นักล่าป้ายปลอมสามคน
    morale: 2
    beats:
      - text: คนหน้าสุดยืนขวางระหว่าง{name}กับย่ามหลังประตู อีกสองคนแยกไปยืนข้างหน้าต่างกับข้างเตาไฟ ตะเกียงบนโต๊ะส่องหน้าทั้งสามคนไม่ครบ
        moves:
          - id: ft_offer_half
            label: บอกว่าใบนั้นยังมีอีกฝูงที่ยังไม่ได้ปลด จะบอกทางให้
            kind: talk
            parley: true
          - id: ft_lamp
            label: ปัดตะเกียงบนโต๊ะใส่หน้าคนที่ยืนใกล้เตา
            kind: item
            stat: DEX
            tags: [fire]
          - id: ft_bar_door
            label: ยืนขวางหน้าย่าม หลังพิงประตู
            kind: guard
          - id: ft_read_tags
            label: ดูป้ายของอีกสองคน ดูว่าใครเป็นหัว
            kind: read
            stat: WIS
            success: คนหน้าสุดถือกระบองแต่ตาคอยเหลือบไปทางคนข้างหน้าต่างทุกครั้งก่อนพูด คนข้างหน้าต่างตัวเล็กที่สุด ไม่มีป้าย มือซ้ายเกาแผลเป็นที่คอ คนนั้นคือคนสั่ง
          - id: ft_rush
            label: พุ่งเข้าใส่คนหน้าสุดก่อนเขาตั้งตัว
            kind: attack
          - id: ft_out_window
            label: กระโดดออกหน้าต่างหลังบ้าน
            kind: flee
      - text: คนหน้าสุดฟาดกระบองลงมาที่ไหล่ คนข้างเตาเข้ามาจากด้านข้างจะคว้าย่าม
        answer: guard
        moves:
          - id: ft_block
            label: ยกเก้าอี้ขึ้นรับกระบอง
            kind: guard
          - id: ft_duck
            label: ก้มหลบ ปล่อยให้กระบองฟาดประตู
            kind: quick
          - id: ft_shame
            label: บอกว่าป้ายตอกเบี้ยวแบบนี้ ออร์ริสดูออกตั้งแต่ยังไม่ถึงโต๊ะ
            kind: talk
          - id: ft_out_window2
            label: ทิ้งย่าม ออกทางหน้าต่าง
            kind: flee
      - text: คนข้างหน้าต่างก้าวออกมาจากเงาเป็นครั้งแรก ตัวเล็กกว่าที่คิด ไม่ถืออาวุธ เขาถามว่า{name}คิดว่าถ่านสองก้อนคุ้มกับฟันกี่ซี่
        answer: talk
        moves:
          - id: ft_name_price
            label: บอกเขาว่าถ่านสองก้อนไม่คุ้มกับคนที่ต้องกลับไปบอกออร์ริสว่าใครงัดบ้านนักล่าของโรง
            kind: talk
            success: เขาหัวเราะเบาๆ ผิวปากเรียกคนอีกสองคน ทั้งสามคนเดินออกประตูหน้าที่ยังเปิดค้างอยู่ คนถือกระบองหันกลับมาปิดประตูให้ด้วย
          - id: ft_hit_the_small_one
            label: ข้ามโต๊ะไปคว้าคอเสื้อคนตัวเล็ก
            kind: attack
          - id: ft_hold_bag
            label: กอดย่ามไว้แน่น ไม่ยอมปล่อย
            kind: guard
          - id: ft_out_window3
            label: โยนย่ามออกหน้าต่าง แล้วกระโดดตาม
            kind: flee
    win:
      text: |
        คนตัวเล็กหนีไปก่อน อีกสองคนลากกันออกประตูไป ป้ายทองเหลืองปลอมแผ่นหนึ่งหลุดตกอยู่บนพื้นบ้าน เชือกขาด

        เช้านั้น{name}วางถ่านสองก้อนกับป้ายปลอมบนโต๊ะชั่งพร้อมกัน ออร์ริสชั่งถ่าน จ่ายตามใบ แล้วโยนป้ายปลอมลงเตาหลอมเล็กหลังโต๊ะโดยไม่ต้องดูเลข
      effects: { stats: { CON: 1 }, hunted: { fang_house: -1 }, flags: [beat_the_fake_tags] }
    lose:
      text: |
        {name}ตื่นขึ้นบนพื้นบ้านตอนฟ้าสาง หัวแตกตรงขมับ ย่ามหลังประตูว่าง ประตูหน้าบ้านปิดสนิท ใครสักคนปิดให้

        บ่ายนั้นฟินเดลบอกว่ามีคนเอาถ่านสองก้อนมาวางตั้งแต่โต๊ะเปิด ป้ายทองเหลือง เลขตอกเบี้ยวนิดหน่อย ออร์ริสจ่ายไปแล้ว
    stalemate:
      text: |
        บ้านข้างๆ จุดตะเกียงขึ้นทีละหลัง หมาทั้งซอยเห่า คนตัวเล็กผิวปากครั้งเดียว ทั้งสามคนออกไปทางประตูหน้าเหมือนตอนเข้ามา ไม่รีบ

        {name}นั่งกอดย่ามอยู่หลังประตูจนเช้า ถ่านสองก้อนถึงโต๊ะชั่งเป็นของชิ้นแรกของวัน
      effects: { flags: [held_off_the_fake_tags] }
    flee:
      text: |
        {name}ตกลงไปในกองฟืนหลังบ้าน ได้ยินเสียงคนในบ้านค้นของไปทั่ว แล้วเงียบ

        ย่ามหลังประตูหายไป ทั้งถ่านทั้งเงินสามเหรียญที่ซุกไว้ก้นย่าม เช้านั้นที่โต๊ะชั่ง ใบหมาเถ้าใบนั้นขีดออกจากสมุดไปแล้ว
      effects: { gold: -3, flags: [robbed_by_fake_tags] }
    parley:
      text: |
        คนตัวเล็กข้างหน้าต่างฟังทางที่{name}บอก ถามซ้ำสองคำถาม แล้วผิวปากเรียกคนอื่น บอกว่าถ้าทางที่บอกผิด พวกเขาจะกลับมาใหม่

        ทางนั้นไม่ผิด สัปดาห์ต่อมามีถ่านหมาเถ้าสามก้อนวางบนโต๊ะชั่งด้วยป้ายทองเหลืองเลขตอกเบี้ยว ออร์ริสไม่รับ ข้อสองบนคานไม้ไม่ได้บอกว่าโรงต้องรับป้ายปลอม
      effects: { flags: [sent_the_fake_tags_elsewhere] }
    death:
      text: |
        กระบองหุ้มเหล็กลงที่ขมับครั้งเดียว {name}ล้มลงข้างประตู มือยังกำสายย่าม

        คนตัวเล็กก้มลงแกะนิ้วออกทีละนิ้ว ไม่รีบ แล้วเดินออกไปพร้อมถ่านสองก้อน ประตูหน้าบ้านปิดตามหลัง

- id: adult.fang_hunt_house_men
  stage: adult
  scene: home
  weight: 15
  time: dusk
  hunt: fang_house
  when:
    age: [28, 64]
    min_hunted: { fang_house: 2 }
  text: |
    ชายสองคนนั่งบนม้านั่งหน้าบ้านฝั่งตรงข้ามถนนมาสามเย็นติดกัน ผ้ากันเปื้อนหนังแบบคนฟอกหนัง มือสีน้ำฝาดถึงข้อศอก ไม่ทำอะไร กินถั่วคั่ว ทิ้งเปลือกเป็นกองที่เท้า เย็นที่สามคนหนึ่งข้ามถนนมาเคาะประตูบ้าน{name}

    เขาบอกว่าโรงไม่ได้ส่งเขามาทำร้ายใคร โรงส่งมาบอกว่าโรงจำได้ แล้วยื่นกระดาษแผ่นหนึ่งให้ เป็นหน้าหนึ่งที่ฉีกจากสมุดของสาขา หน้าของ{name} ข้างชื่อมีหมึกแดงวงใหญ่วงหนึ่ง ไม่ใช่วงเล็กแบบที่ฟินเดลใช้

    เพื่อนของเขายังนั่งกินถั่วคั่วอยู่ที่ม้านั่ง หันหน้ามาทางประตูบ้าน
  choices:
    - id: ask_what_they_want
      label: ถามตรงๆ ว่าโรงอยากได้อะไรคืน
      text: |
        เขาบอกว่าโรงอยากได้ของที่ไม่ใช่ของ{name}คืน ไม่ว่าจะเป็นอะไร แล้วบอกว่าไม่ต้องตอบตอนนี้ คืนพรุ่งนี้เขาจะมาใหม่ {name}เอาของทุกชิ้นที่มีตราหรือลายมือของโรงใส่ห่อผ้าไว้ก่อนเขามา ห่อนั้นเบากว่าที่คิด

        เขารับห่อไปโดยไม่แกะดู บอกว่าโรงจะจำว่าคืนแล้ว เย็นต่อมาม้านั่งฝั่งตรงข้ามว่าง เหลือแต่กองเปลือกถั่ว
      effects: { hunted: { fang_house: -1 }, flags: [gave_the_house_its_things] }
    - id: move_out_at_night
      label: เก็บของใส่ล่อคืนนั้น ย้ายไปอยู่เมืองอื่น
      text: |
        {name}ออกจากบ้านตอนตีสาม ผ่านม้านั่งฝั่งตรงข้ามที่ว่างอยู่ ไม่มีใครนั่ง ไม่มีใครตาม ห้าวันต่อมาถึงเมืองใหม่ เช่าห้องเหนือร้านขายเชือก ค่าเช่าแพงกว่าที่เดิมสองเท่า

        เดือนแรกไม่มีใครนั่งม้านั่งฝั่งตรงข้ามห้องเหนือร้านขายเชือก เดือนที่สองก็ไม่มี เดือนที่สามมีกองเปลือกถั่วคั่วกองเล็กๆ อยู่ที่ขาม้านั่ง
      effects: { gold: -3, hunted: { fang_house: -1 }, flags: [moved_from_the_house_men] }
    - id: go_out_with_a_club
      label: ถือไม้ฟืนออกไปบอกให้พวกเขาไปนั่งที่อื่น
      check: { stat: STR, dc: 13 }
      success:
        text: |
          คนที่นั่งกินถั่วลุกขึ้นยืน สูงกว่า{name}ครึ่งหัว มองไม้ฟืนในมือ{name}แล้วปัดเปลือกถั่วออกจากผ้ากันเปื้อน บอกว่าได้ แล้วเดินออกไปพร้อมเพื่อนโดยไม่หันกลับมา

          คืนนั้น{name}นอนกอดไม้ฟืน ตื่นมาเจอกระดาษหน้าเดิมสอดอยู่ใต้ประตู วงแดงวงเดิม เพิ่มอีกวงซ้อน
        effects: { stats: { STR: 1 }, flags: [faced_the_house_men] }
      failure:
        text: |
          ไม้ฟืนหลุดมือตั้งแต่ครั้งแรกที่เหวี่ยง คนกินถั่วรับไว้กลางอากาศ ส่งคืนใส่มือ{name} แล้วชกท้องครั้งเดียว {name}ทรุดลงนั่งกับพื้นถนน อ้าปากหาลมได้แต่เสียงหวีด

          สองคนนั้นกลับไปนั่งที่ม้านั่ง กินถั่วต่อจนหมดถุง แล้วเดินจากไปตอนตะเกียงถนนจุด
        effects: { hp: -2, flags: [faced_the_house_men] }
    - id: send_for_azrith
      label: ส่งเด็กไปตามอาซริธจากโรงเตี๊ยม
      requires: { flag: hunted_with_azrith }
      text: |
        อาซริธมาถึงก่อนตะวันตก ข้ามถนนไปนั่งลงม้านั่งตรงกลางระหว่างสองคนนั้น หยิบถั่วจากถุงของพวกเขากิน คุยด้วยคำที่คนนอกโรงฟังไม่ออก ภาษาของคนฟอกหนังกับนักล่ารุ่นเก่า

        คุยกันไม่นาน สองคนนั้นลุกไป อาซริธเดินข้ามมาบอกว่าโรงจะเลิกส่งคนมานั่ง แต่โรงไม่เคยเลิกจำ แล้วขอเหล้าหนึ่งจอกเป็นค่าเดิน
      effects: { stats: { CHA: 1 }, hunted: { fang_house: -1 }, flags: [azrith_sent_the_house_men_off] }

- id: adult.fang_ledger_offer
  stage: adult
  scene: tavern
  weight: 12
  when:
    age: [32, 64]
    org: { id: fang_house, min_rank: 3, max_rank: 3 }
  text: |
    หญิงในผ้าคลุมสีเทาของภาคีผู้เฝ้าผนึกนั่งรออยู่ในโรงเตี๊ยมที่{name}กินข้าวเย็นทุกวัน ผมตัดสั้นชิดหนัง เขาคู่หนึ่งโค้งไปข้างหลัง ปลายสวมปลอกทองเหลือง นางชื่อเวสซา มาจากป้อมสาม ภาคีได้ยินมาว่าโรงรับเขี้ยวนับหลักฐานทุกชิ้นมาตั้งแต่วันแรก แยกของจากเถ้ากับของจากฟ้า ภาคีไม่มีตัวเลขแบบนั้น ภาคีมีแต่ฝ่ามือของคนนับหินที่บอกได้ว่าอุ่นหรือนิ่ง

    นางวางถุงเงินบนโต๊ะ หกเหรียญ ทั้งหมดที่ป้อมสามเจียดได้ ขอแค่หน้าสรุปยอดรายปี ตู้สองชั้นอยู่ที่ไหน กุญแจอยู่ที่ไหน {name}รู้

    คืนต่อมา ชายในเสื้อนอกสีครามกระดุมทองเหลืองครบทุกเม็ดมานั่งที่โต๊ะเดียวกัน ราชสำนักรู้ว่าภาคีมาขออะไร เขาบอกว่าราชสำนักจ่ายแปดเหรียญ ไม่ต้องการหน้าไหนไปอ่าน ต้องการแค่ให้หน้าพวกนั้นไม่มีอยู่ในโลกอีก โรงรับเขี้ยวจำคนที่เอาของออกไปจากโรงได้ทุกคน ทั้งสองคนรู้ดี
  choices:
    - id: sell_to_the_wardens
      label: เปิดตู้สองชั้นตอนดึก ฉีกหน้าสรุปยอดไปให้เวสซา
      text: |
        หน้าสรุปยอดมีสิบเอ็ดหน้า {name}ฉีกทีละหน้าตามรอยเย็บ ไม่ให้ขาด ใส่ซองหนังที่เวสซาให้มา นางรับซองไปแนบอกใต้ผ้าคลุม จ่ายหกเหรียญ แล้วขึ้นขบวนถ่านเที่ยวเช้าไปแดนเถ้า

        คืนนั้น{name}ไม่ได้กลับไปที่โรงอีก ป้ายทั้งสองแผ่นยังห้อยอยู่ที่เข็มขัด ไม่ได้วางคืน
      effects:
        mark: ขายหน้าสมุดเขี้ยวให้ภาคีผู้เฝ้าผนึก
        gold: 6
        reputation: { wardens: 2 }
        hunted: { fang_house: 2 }
        org: { id: fang_house, leave: true }
        flags: [sold_fang_pages_to_wardens, took_the_fang_tags]
    - id: burn_for_the_crown
      label: เอาหน้าสรุปยอดไปเผาในเตาผิงของโรงเตี๊ยม ต่อหน้าชายเสื้อคราม
      text: |
        ชายเสื้อครามนั่งดูกระดาษไหม้ทีละหน้า ใช้ไม้เขี่ยไฟพลิกให้ไหม้ทั่ว จนเหลือแต่ขี้เถ้าสีดำบางๆ ที่ยังเห็นเงาตัวเลขอยู่ แล้วเขี่ยจนเงานั้นแตก จ่ายแปดเหรียญ ไม่ขอบคุณ

        {name}ไม่ได้กลับไปที่โรงอีก ป้ายทั้งสองแผ่นยังห้อยอยู่ที่เข็มขัด ไม่ได้วางคืน
      effects:
        mark: เผาหน้าสมุดเขี้ยวให้ราชสำนัก
        gold: 8
        reputation: { crown: 1 }
        hunted: { fang_house: 2 }
        org: { id: fang_house, leave: true }
        flags: [burned_fang_pages_for_the_crown, took_the_fang_tags]
    - id: hand_over_the_copy
      label: ยื่นยอดรวมที่คัดไว้ใต้พื้นรองเท้าให้เวสซา ไม่ต้องเปิดตู้
      requires: { flag: copied_fang_ledger }
      text: |
        ใบค่าหัวเปล่าแผ่นนั้นพับสี่ทบจนรอยพับเป็นขน เวสซาคลี่ออกบนโต๊ะ อ่านตัวเลขสองช่องทีละปีด้วยปลายนิ้ว นิ้วหยุดตรงปีที่ช่องซ้ายกระโดดขึ้นเท่าตัว นางบอกว่าปีนั้นหินก้อนที่สามสิบหกแตก นางรู้เพราะนางยืนอยู่ตรงนั้น

        นางจ่ายหกเหรียญ {name}ไม่ได้กลับไปที่โรงอีก ตู้สองชั้นไม่มีใครเปิด แต่ฟินเดลจำได้ว่าคืนที่ออร์ริสป่วย ใครนั่งจดอยู่ข้างเตียง
      effects:
        mark: ขายหน้าสมุดเขี้ยวให้ภาคีผู้เฝ้าผนึก
        gold: 6
        reputation: { wardens: 2 }
        hunted: { fang_house: 2 }
        org: { id: fang_house, leave: true }
        flags: [sold_fang_pages_to_wardens, took_the_fang_tags]
    - id: no_such_book
      label: บอกทั้งสองคนว่าไม่มีสมุดแบบนั้น
      text: |
        เวสซาเก็บถุงเงินกลับใส่อกเสื้อ บอกว่าป้อมสามจะส่งคนมาถามใหม่ปีหน้า คนที่ยังไม่รู้ว่าหินก้อนไหนจะแตกต่อ ชายเสื้อครามยิ้ม จ่ายค่าเหล้าของ{name}คืนนั้นโดยไม่ถาม

        เช้าวันต่อมา ออร์ริสไม่ได้พูดเรื่องโรงเตี๊ยมเลย แต่กุญแจตู้สองชั้นย้ายไปอยู่ที่ใหม่
      effects: { flags: [refused_to_sell_the_ledger] }

- id: adult.fang_return_tag
  stage: adult
  scene: market
  weight: 10
  when:
    age: [36, 64]
    org: { id: fang_house, min_rank: 2, max_rank: 3 }
  text: |
    นักล่าป้ายเหล็กดำที่แก่ที่สุดของสาขาไม่กลับจากใบน้ำเดินที่หนองทางใต้ ป้ายของเขากลับมาถึงโต๊ะชั่งในถุงผ้า ชาวบ้านที่เจอศพเป็นคนส่งมา ฟินเดลหย่อนป้ายลงลิ้นชักใต้โต๊ะ ลิ้นชักที่เก็บป้ายที่กลับมาแล้วห้าสิบกว่าแผ่น ป้ายของคนตายส่วนใหญ่ ส่วนน้อยเป็นของคนที่เดินมาวางคืนเอง

    โรงไม่ตามคนที่คืนป้าย โรงตามคนที่เอาป้ายไปด้วย ประโยคนี้ฟินเดลบอกทุกคนตั้งแต่วันแรกที่มีป้าย

    บ่ายนั้น{name}ยืนอยู่หน้าโต๊ะชั่งโดยไม่มีอะไรจะชั่ง เข่าซ้ายบวมตั้งแต่หนาวที่แล้วไม่ยุบ นิ้วสองนิ้วของมือขวางอไม่ลงแล้ว ใบบนกระดานเช้านี้มีหกใบ ใบที่อ่านแล้วอยากไปมีใบเดียว
  choices:
    - id: lay_the_tag_down
      label: ปลดป้ายจากเข็มขัด วางลงบนโต๊ะชั่ง
      text: |
        ฟินเดลหยิบป้ายขึ้นมาดูเลข ตรวจกับสมุด แล้วหย่อนลงลิ้นชัก ป้ายกระทบป้ายแผ่นอื่นดังแป๊ะเดียว ข้างชื่อ{name}ในสมุดเขาเขียนว่าคืนป้าย ไม่ได้ขีดเส้นทับชื่อ

        ขาออก เจ้าโต๊ะชั่งบอกว่าถ้าเจอของดีให้เอามาวาง ชั่งให้เหมือนคนนอกทั่วไป เข็มขัดของ{name}เบาจนต้องขยับรูเข้าไปอีกรู
      effects:
        mark: คืนป้ายให้โรงรับเขี้ยว
        org: { id: fang_house, leave: true }
        flags: [returned_the_fang_tag]
    - id: take_the_one_paper
      label: ปลดใบที่อยากไปลงจากกระดาน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ใบหมาป่าในหุบเขาที่หิมะยังไม่ละลาย เข่าซ้ายส่งเสียงทุกก้าวขึ้นเขา {name}เดินช้ากว่าเมื่อก่อนครึ่งหนึ่ง แต่อ่านรอยได้ไกลกว่าเมื่อก่อนเท่าตัว ฆ่าได้สองตัวจากที่เฝ้าเดียว ไม่ต้องวิ่งสักก้าว

          ที่โต๊ะชั่ง ป้ายยังห้อยอยู่ที่เข็มขัด เจ้าโต๊ะชั่งชั่งหางแล้วจ่ายตามใบ ไม่ได้มองขาของ{name}
        effects: { stats: { CON: 1 }, gold: 3, flags: [kept_the_fang_tag] }
      failure:
        text: |
          ครึ่งทางขึ้นเขาเข่าซ้ายล็อก {name}นั่งรอให้มันคลายอยู่ข้างทางจนตะวันบ่าย แล้วเดินลงเขากลับมาตัวเปล่า

          ใบนั้นยังแขวนอยู่บนกระดาน{name}เดินผ่านทุกเช้าจนมีคนอื่นปลดไป ป้ายยังห้อยอยู่ที่เข็มขัด
        effects: { hp: -1, flags: [kept_the_fang_tag] }
    - id: ask_azrith_why
      label: ไปหาอาซริธ ถามว่าทำไมนางยังไม่คืนป้าย
      requires: { flag: hunted_with_azrith }
      text: |
        อาซริธยกขาขึ้นวางบนโต๊ะในโรงเตี๊ยม เข่าข้างขวาพันผ้าหนาสองชั้น บอกว่านางจะคืนป้ายวันที่ล่าหมาเถ้าไม่ได้แล้ว หมาเถ้าลังเลต่อหน้าคนมีเขา คนอื่นไม่มีข้อได้เปรียบนี้ จนกว่าจะถึงวันนั้นนางยังมีงาน

        นางถามกลับว่า{name}ล่าอะไรได้ที่คนอื่นล่าไม่ได้ {name}ตอบ นางเอาปลายมีดชี้ไปทางกระดานใบประกาศ
      effects: { stats: { WIS: 1 }, flags: [kept_the_fang_tag] }
