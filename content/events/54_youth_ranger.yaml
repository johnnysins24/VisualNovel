# วัยหนุ่มสาว 15–17 ทางพราน (class: ranger)
# สองเรื่องแรกใช้ได้ทุกทาง ไม่ระบุถิ่น "ครูพราน" ใช้แทนพรานที่รับ{name}เป็นลูกมือ
# youth.ranger_first_hunt ไม่ใช้กับคนนำทางแดนเถ้า เพราะทางนั้นไม่ได้ล่าสัตว์
# youth.ranger_trap_snow ใช้กับพรานในอาร์เวล (location arvel_village) youth.ranger_loggers ใช้กับพรานในไอเลธ (location ileth)
# ตายได้จุดเดียวในไฟล์นี้: youth.ranger_ash_crossing ตัวเลือก straight_across ทางที่พลาด

- id: youth.ranger_first_hunt
  stage: youth
  weight: 30
  when:
    age: [15, 16]
    class: ranger
    not_flags: [path_ash_guide]
  text: |
    สัตว์ตัวแรกที่{name}ล่าเองคนเดียว ยิงโดนตัวแต่ไม่โดนที่ตาย มันวิ่งหนีไปพร้อมลูกธนูที่ปักอยู่ข้างสะโพก ทิ้งรอยเลือดเป็นจุดๆ ไว้บนพื้น ครูพรานบอกไว้ตั้งแต่วันแรก ตัวที่เจ็บเพราะเรา เราต้องตามไปให้จบ

    รอยเลือดพา{name}ไปจนบ่ายคล้อย ผ่านลำธารสองสาย ข้ามสันเขาเตี้ยๆ หนึ่งสัน จนเจอมันนอนหอบอยู่ในพุ่มไม้ ขาหลังข้างหนึ่งยกไม่ขึ้นแล้ว มันหันมามอง{name} ไม่พยายามลุก ตามันดำและเปียก
  choices:
    - id: clean_finish
      label: เข้าไปใกล้ แล้วปลิดมันให้จบในครั้งเดียว
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}ย่องเข้าไปจากด้านหลังหัว คุกเข่าลง แล้วใช้มีดครั้งเดียวตรงที่ครูพรานชี้ให้ดูบนตัวที่ตายแล้วมาเป็นสิบตัว มันสะดุ้งครั้งเดียว แล้วนิ่ง

          {name}ถลกหนัง ตัดเนื้อ ห่อเครื่องในด้วยใบไม้ แบกกลับมาถึงที่พักตอนมืด ครูพรานดูรอยมีดที่คอแล้วพยักหน้า แกไม่ชม แต่คืนนั้นแกยกเนื้อชิ้นที่ดีที่สุดให้{name}ก่อนตัวเอง
        effects: { stats: { DEX: 1, STR: 1 }, flags: [first_clean_kill] }
      failure:
        text: |
          มันยังมีแรงเหลืออยู่ในขาหน้า พอ{name}เข้าไปใกล้ มันดีดตัวขึ้นครึ่งตัว กีบเท้าเฉียดหน้าผากไปนิดเดียว แล้วฟาดเข้าที่ไหล่เต็มแรง {name}ล้มทับมันลงไปทั้งตัว กว่าจะจบก็ใช้มีดไปสามครั้ง ทุกครั้งไม่ตรงที่

          ขากลับ{name}แบกเนื้อไปได้ครึ่งเดียว ไหล่ข้างนั้นยกไม่ขึ้น ครูพรานไปแบกที่เหลือกลับมาเองในวันต่อมา ไม่พูดเรื่องนี้เลย
        effects: { stats: { DEX: 1 }, hp: -2, flags: [first_kill_messy] }
    - id: wait_it_out
      label: นั่งลงห่างๆ แล้วรอให้มันไปเอง
      text: |
        {name}นั่งลงบนก้อนหินห่างไปยี่สิบก้าว ไม่เข้าไปใกล้ ไม่ส่งเสียง มันมอง{name}อยู่นาน แล้วค่อยๆ วางหัวลงกับพื้น ลมหายใจช้าลงทีละน้อยจนแสงหมดฟ้า

          ครูพรานตามรอยมาเจอตอนมืด นั่งลงข้างๆ บนหินก้อนเดียวกัน แกบอกว่าคนส่วนใหญ่ทนรอไม่ไหว เข้าไปจบเองให้ตัวเองหายเจ็บ ไม่ใช่ให้สัตว์หายเจ็บ แล้วแกก็ลุกขึ้นไปจุดไฟ
      effects: { stats: { CON: 1, DEX: 1 }, flags: [waited_for_kill] }
    - id: pull_and_release
      label: ดึงลูกธนูออก แล้วปล่อยมันไป
      text: |
        มันไม่ดิ้นตอน{name}จับลูกธนู ดิ้นตอนดึงออกครั้งเดียว แล้วลุกขึ้นยืนได้ทั้งที่ขาหลังสั่น มันยืนมอง{name}อยู่ครู่หนึ่ง เหมือนไม่แน่ใจว่าควรทำอะไรต่อ แล้วก็เดินกะเผลกหายเข้าไปในพุ่มไม้

        ครูพรานเห็นลูกธนูเปื้อนเลือดในกระบอกก็รู้เรื่องทั้งหมด แกไม่ดุ บอกแค่ว่าปีหน้า{name}คงได้เจอมันอีก ถ้าหมาป่าไม่เจอมันก่อน
      effects: { stats: { STR: 1 }, alignment: { moral: 1 }, flags: [released_first_kill] }

- id: youth.ranger_lost_child
  stage: youth
  weight: 30
  when:
    age: [16, 17]
    class: ranger
  text: |
    บ่ายวันหนึ่งมีคนวิ่งมาเคาะประตูหา{name} เด็กเจ็ดขวบคนหนึ่งหายไปตั้งแต่เช้า ไม่มีใครรู้ว่าออกไปทางไหน ผู้ใหญ่ทั้งหมู่บ้านออกตามหากันคนละทิศแล้ว ครูพรานไม่อยู่ ไปส่งของตั้งแต่เมื่อวาน

    ฟ้าเริ่มครึ้มจากทางเหนือ ลมเปลี่ยนทิศสองครั้งในหนึ่งชั่วยาม คืนนี้หนาวพอจะทำให้เด็กที่นอนอยู่ข้างนอกไม่ตื่นขึ้นมาอีก

    แม่ของเด็กยืนอยู่หน้าประตู มือกำผ้าพันคอผืนเล็กของลูกไว้แน่น ไม่ได้ร้องไห้ ยังไม่ร้อง
  choices:
    - id: read_tracks
      label: ขอผ้าพันคอผืนนั้น แล้วหารอยเท้าเด็กจากหน้าบ้าน
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          รอยเท้าเด็กเล็กกว่ารอยผู้ใหญ่ครึ่งหนึ่ง และไม่เดินตรง {name}ตามไปทีละรอย ตรงไหนรอยหายก็ก้มลงดูกรวดที่เขี่ยกระจาย ดูก้อนหินที่พลิก จนรอยพาไปถึงซอกหินที่ลมเข้าไม่ถึง

          เด็กนอนขดอยู่ในนั้น ตัวเย็นแต่ยังหายใจ กอดลูกแมวที่ตามมาตั้งแต่เช้าไว้แน่น {name}ห่อทั้งสองด้วยเสื้อของตัวเอง แบกกลับไปถึงหมู่บ้านก่อนฝนเย็นเม็ดแรกจะตก แม่ของเด็กเพิ่งร้องไห้ออกมาตอนนั้นเอง
        effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [found_lost_child] }
      failure:
        text: |
          รอยเท้าหายไปตรงลานหินกว้าง {name}วนหาอยู่จนมืด ไม่เจอรอยต่อ ได้ยินแต่เสียงคนอื่นตะโกนเรียกชื่อเด็กอยู่ไกลๆ

          คนอีกกลุ่มเจอเด็กตอนสาง นอนอยู่ในเพิงร้างอีกฟากเนิน ยังมีชีวิต แต่หมอต้องตัดนิ้วเท้าสองนิ้วที่ดำไปแล้ว ตอนเด็กหายดี แม่ของเด็กเดินมาขอบคุณ{name}ที่ช่วยตามหา {name}ไม่รู้จะตอบอะไร
        effects: { stats: { DEX: 1, CON: 1 }, flags: [lost_child_found_late] }
    - id: climb_high
      label: ปีนขึ้นที่สูงที่สุดแถวนั้น ดูให้ทั่ว
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}ปีนขึ้นไปจนสุดทางที่ปีนได้ ลมบนนั้นแรงจนตาพร่า แต่มองเห็นข้ามหมู่บ้านไปได้อีกหลายเนิน ไกลออกไปทางตะวันตก มีจุดสีแดงเล็กๆ ขยับอยู่ข้างแนวหิน สีเดียวกับผ้าพันคอในมือแม่ของเด็ก

          {name}ลงมาบอกทาง คนสามคนวิ่งไปถึงก่อนมืด เด็กหลงเดินวนอยู่ตรงนั้นทั้งวัน ร้องไห้จนเสียงแหบ แต่ไม่เป็นอะไร
        effects: { stats: { DEX: 1 }, alignment: { moral: 1 }, flags: [found_lost_child] }
      failure:
        text: |
          ครึ่งทางขึ้นไป ที่จับมือหลุดออกมาทั้งก้อน {name}ไถลลงมาเกือบถึงพื้น ข้อมือข้างหนึ่งบิดผิดทาง ขาถลอกยาวตั้งแต่เข่าถึงข้อเท้า

          {name}เดินตามหาต่อด้วยมือข้างเดียวจนมืด คนอื่นเจอเด็กก่อนเที่ยงคืน นอนหลับอยู่ในกองหญ้าแห้งท้ายเกวียนของคนที่ไม่รู้ว่ามีเด็กซุกอยู่ในนั้น
        effects: { stats: { DEX: 1 }, hp: -2 }
    - id: search_all_night
      label: ตามหาต่อทั้งคืนคนเดียว ไม่กลับมาเอาตะเกียง
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}เดินไปเรื่อยๆ ในความมืด เรียกชื่อเด็กเป็นระยะ แล้วหยุดฟัง เรียก แล้วหยุดฟัง จนเกือบเที่ยงคืนถึงได้ยินเสียงไอเล็กๆ ตอบกลับมาจากใต้ชะง่อนหิน

          ทั้งสองคนนั่งกอดกันอยู่ใต้ชะง่อนนั้นจนฟ้าสาง {name}ไม่กล้าพาเดินในความมืด กลัวพาตกหลุม เลยถอดเสื้อให้เด็กใส่ แล้วนั่งหนาวอยู่อย่างนั้นทั้งคืน ตอนเช้าเดินกลับถึงหมู่บ้านพร้อมกัน เด็กหลับอยู่บนหลัง
        effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [found_lost_child] }
      failure:
        text: |
          ไม่ถึงครึ่งคืน{name}ก็หลงเอง ทางที่คุ้นเคยตอนกลางวันกลายเป็นทางที่ไม่รู้จักตอนกลางคืน มือเท้าชาจนเดินไม่เป็นเส้นตรง สุดท้ายต้องหยุดนั่งพิงหินก้อนหนึ่ง กอดเข่ารอฟ้าสาง

          คนที่ตามหาเด็กเจอ{name}ก่อนเจอเด็ก เด็กอยู่ห่างออกไปแค่สองร้อยก้าว หลับอยู่ในหลุมหินที่ลมเข้าไม่ถึง ปลอดภัยดีกว่า{name}เสียอีก นิ้วมือข้างซ้ายของ{name}ชาไปอีกครึ่งเดือน
        effects: { stats: { CON: 1 }, hp: -3 }

- id: youth.ranger_trap_snow
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    class: ranger
    location_tag: arvel_village
  text: |
    ปลายหนาวปีนั้น ครูพรานพลาดเป็นครั้งแรกตั้งแต่{name}รู้จัก กับดักหมาป่าที่แกวางเองเมื่อสามปีก่อน ใบไม้ทับจนแกลืมไปแล้วว่าวางไว้ตรงนั้น งับข้อเท้าแกเข้าเต็มแรง ฟันเหล็กจมลงไปถึงกระดูก

    {name}งัดกับดักออกได้ แต่ขาข้างนั้นลงน้ำหนักไม่ได้แล้ว ที่นี่ห่างจากหมู่บ้านที่ใกล้ที่สุดครึ่งวันเดิน หิมะเริ่มตก

    ครูพรานสบถด่าตัวเองอยู่พักหนึ่ง แล้วบอกให้{name}ทิ้งแกไว้ตรงนี้ ไปเอาคนมา
  choices:
    - id: carry_on_back
      label: ไม่ทิ้ง แบกครูขึ้นหลังแล้วเดินกลับเอง
      check: { stat: STR, dc: 13 }
      success:
        text: |
          ครูพรานตัวเล็กนิดเดียว แต่พอขึ้นหลังแล้วหนักเท่าหมูป่าครึ่งตัว {name}แบกแกเดินไปทีละร้อยก้าว วางลง หายใจ แล้วแบกต่อ แกด่า{name}อยู่ครึ่งทาง แล้วเงียบไป จนนึกว่าแกหลับ ที่จริงแกนับก้าวให้อยู่ในใจ

          ถึงหมู่บ้านตอนมืดสนิท หิมะสูงถึงข้อเท้า หมอบอกว่าขาข้างนั้นจะหายแต่จะเดินไม่เหมือนเดิม ครูพรานบอกว่าแกเดินไม่เหมือนคนอื่นมาตั้งแต่เกิดแล้ว ตั้งแต่วันนั้นแกเรียก{name}ด้วยชื่อที่แกใช้เรียกหมาตัวโปรดตัวเก่า
        effects: { stats: { STR: 1, CON: 1 }, alignment: { moral: 1 }, flags: [carried_mentor] }
      failure:
        text: |
          เดินได้ไม่ถึงหนึ่งในสามของทาง ขาของ{name}ก็สั่นจนต้องวางแกลง {name}ก่อไฟที่ซอกหิน ผิงไฟกันสองคนจนมืด หิมะหนาขึ้นเรื่อยๆ

          คนเผาถ่านสองคนเห็นควันไฟ มาเจอตอนดึก ช่วยกันหามกลับไป ครูพรานบอกคนเผาถ่านว่าลูกมือของแกโง่ ไม่ยอมทิ้งแกไว้ตามที่สั่ง แต่ตอนพูด แกจับไหล่{name}ไว้ไม่ปล่อย
        effects: { stats: { STR: 1 }, hp: -2, alignment: { moral: 1 }, flags: [carried_mentor] }
    - id: drag_sled
      label: ตัดกิ่งไม้ผูกเป็นเลื่อน แล้วลากครูไปบนหิมะ
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          กิ่งสนสองกิ่ง ไม้ขวางสามท่อน เชือกจากกระเป๋าครูพราน เลื่อนเสร็จก่อนหิมะจะหนาถึงข้อเท้า ลากบนหิมะเบากว่าแบกครึ่งหนึ่ง และแกนอนด่าได้สบายกว่าตอนโดนแบก

          ครูพรานดูเลื่อนตลอดทาง ถึงหมู่บ้านแกบอกให้เก็บไว้ ฤดูหน้าจะได้ใช้ลากเนื้อกลับบ้าน ไม่ต้องแบกเป็นชิ้นๆ อย่างที่แกแบกมาสามสิบปี
        effects: { stats: { DEX: 1, INT: 1 }, alignment: { moral: 1 }, flags: [carried_mentor] }
      failure:
        text: |
          เชือกที่มัดไม้ขวางคลายตอนลงเนิน เลื่อนแยกออกเป็นสองท่อน ครูพรานไถลลงไปในหิมะทั้งที่ขายังเจ็บ ร้องเสียงที่{name}ไม่เคยได้ยินจากแก

          ที่เหลือของทาง{name}ลากแกด้วยมือเปล่าบนผ้าคลุม ไปถึงหมู่บ้านตอนดึก มือของ{name}แตกเป็นแผลทั้งสองข้าง
        effects: { stats: { DEX: 1 }, hp: -1, flags: [carried_mentor] }
    - id: run_for_help
      label: ก่อไฟให้แก แล้ววิ่งไปตามคนมาช่วยตามที่แกสั่ง
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}ก่อไฟให้ กองฟืนไว้ใกล้มือแก แล้ววิ่ง วิ่งตามทางที่จำได้ ไม่หยุดพักเลยจนถึงหมู่บ้าน ขาทั้งสองข้างเหมือนไม่ใช่ขาตัวเอง

          คนห้าคนกลับไปพร้อม{name}ก่อนมืด ครูพรานนั่งผิงไฟอยู่ที่เดิม กำลังเหลาไม้ไว้ทำไม้ค้ำ แกบอกว่ารู้อยู่แล้วว่าจะกลับมาทัน เพราะสอนให้วิ่งมาเองกับมือ
        effects: { stats: { DEX: 1, CON: 1 }, alignment: { law: 1 }, flags: [ran_for_mentor] }
      failure:
        text: |
          หิมะหนาขึ้นจนทางที่จำได้หายไปครึ่งหนึ่ง {name}หลงอยู่ครู่ใหญ่กว่าจะเจอทาง ถึงหมู่บ้านตอนบ่ายคล้อย กลับไปพร้อมคนอื่นถึงตอนมืดสนิท

          ไฟดับไปแล้ว ครูพรานยังมีชีวิตอยู่ ซุกมืออยู่ใต้รักแร้ แต่นิ้วสองนิ้วของมือขวาดำแล้ว หมอตัดทิ้งในคืนนั้น แกบอกว่าสองนิ้วนั้นไม่ได้ใช้ดึงสายธนูอยู่แล้ว ทั้งที่สองนิ้วนั้นคือนิ้วที่แกดึงสายมาสามสิบปี
        effects: { stats: { DEX: 1 }, flags: [ran_for_mentor, mentor_lost_fingers] }

- id: youth.ranger_loggers
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    class: ranger
    location_tag: ileth
  text: |
    หัวหน้าค่ายตัดไม้คนใหม่ขึ้นมาถึงหมู่บ้านพร้อมถุงเงิน เขาต้องการคนนำทางไปหาต้นไม้ที่สูงเกินหอระฆังและตรงที่สุดในป่าทางตะวันตก อู่ต่อเรือหลวงที่เวนทราสสั่งไม้มาสิบสองลำ ไม้ไอเลธเบาและไม่ผุ หาที่ไหนไม่ได้อีก

    ค่าจ้างเท่ากับที่ครูพรานหาได้ทั้งปี ปีนี้เอลฟ์หนุ่มเผาค่ายตัดไม้ไปแล้วสองค่าย หัวหน้าค่ายคนก่อนถึงได้กลับเวนทราสไป

    เขาวางถุงเงินบนโต๊ะ แล้วบอกว่าไม่ต้องตอบตอนนี้ พรุ่งนี้เช้าเขาจะมาฟังคำตอบ ถ้า{name}ไม่รับ เขาก็มีคนอื่นในใจอยู่แล้ว
  choices:
    - id: guide_wrong
      label: รับงาน แล้วพาไปหาต้นที่ใหญ่ที่สุด ต้นที่ฟ้าเคยผ่ากลางลำ
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}รู้จักต้นนั้นมาตั้งแต่ปีแรก ต้นใหญ่ที่สุดทางตะวันตก ตรงเหมือนเสา เปลือกปิดรอยฟ้าผ่าไว้จนหมดแล้ว แต่ข้างในแตกร้าวเป็นวงตั้งแต่โคนถึงยอด เคาะแล้วเสียงแตกพร่า หัวหน้าค่ายเห็นแล้วตาลุก ไม่ได้เคาะ

          ค่ายตัดไม้ใช้เวลาสิบสองวันโค่นต้นนั้น พอล้มลงมา ลำต้นแตกออกตามรอยร้าวเป็นซีกๆ ไม่มีท่อนไหนยาวพอทำกระดูกงูเรือ หัวหน้าค่ายจ่ายเงินตามสัญญา เพราะสัญญาบอกว่าจ้างให้พาไปหาต้นที่ใหญ่ที่สุด ไม่ได้บอกว่าต้องไม่ร้าว คืนนั้นมีขนนกเหยี่ยวเสียบอยู่ที่วงกบประตูของ{name} ไม่มีใครรู้ว่าใครเอามาเสียบ
        effects: { stats: { WIS: 1 }, gold: 6, alignment: { law: -1 }, reputation: { star_hall: 1 }, flags: [misled_loggers] }
      failure:
        text: |
          หัวหน้าค่ายตัดไม้มาสามสิบปี เขาเดินรอบต้นนั้นรอบเดียว แล้วเอาด้ามขวานเคาะ ฟังเสียงแตกพร่านั้น แล้วหันมามอง{name}

          เขาไม่จ่ายสักเหรียญ ไล่{name}กลับไปตอนนั้นเลย วันต่อมาเขาจ้างคนนำทางอีกคนจากหมู่บ้านตีนไม้ คนนั้นพาเขาไปหาต้นที่ดีที่สุดภายในสามวัน
        effects: { stats: { CON: 1 }, flags: [loggers_suspect] }
    - id: guide_true
      label: พาไปหาต้นที่ดีที่สุด ตามที่เขาจ้าง
      text: |
        ต้นที่ดีที่สุดอยู่ห่างหมู่บ้านสองวันเดิน ตรงจนแสงแดดตอนเที่ยงไม่ทอดเงาเฉียง ค่ายตัดไม้ใช้เวลาแปดวันโค่น เสียงขวานดังไปถึงหมู่บ้านทุกวัน เสียงตอนต้นล้มดังจน{name}รู้สึกได้ที่ฝ่าเท้า ทั้งที่อยู่ห่างออกไปครึ่งวันเดิน

        เงินที่ได้มาซื้อเกลือ ซื้อหัวลูกธนูเหล็ก ซื้อผ้าห่มขนแกะให้ครูพรานได้หนึ่งผืน คืนนั้นมีลูกธนูปักอยู่ที่วงกบประตูของ{name} ขนหางเป็นขนเหยี่ยว ปักลึกจนถอนไม่ออก
      effects: { stats: { DEX: 1 }, gold: 10, reputation: { star_hall: -1 }, flags: [guided_loggers] }
    - id: refuse
      label: ปฏิเสธ คืนถุงเงินไปตอนเช้า
      text: |
        หัวหน้าค่ายรับถุงเงินคืนไปโดยไม่ว่าอะไร พยักหน้าเหมือนคิดไว้แล้ว แล้วเดินลงไปหมู่บ้านตีนไม้ทันที

        สิบวันต่อมา{name}ได้ยินเสียงต้นไม้ใหญ่ล้มดังมาจากทางตะวันตก ไกลจนนกบนยอดไม้ทั้งแถบบินขึ้นก่อนเสียงจะมาถึง ครูพรานนั่งฟังอยู่ข้างๆ บอกว่าต้นนั้นคงอายุมากกว่าอาณาจักรอาร์เวล
      effects: { stats: { WIS: 1 }, flags: [refused_loggers] }

- id: youth.ranger_ash_crossing
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    flags: [path_ash_guide]
  text: |
    ลูกค้ารายแรกที่คนนำทางแก่ปล่อยให้{name}พาข้ามเองเป็นช่างสำรวจของบริษัทเหมืองสองคน มนุษย์จากอาร์เวล รองเท้าหนังคู่ใหม่ ถือแผนที่ที่วาดมาจากเมืองหลวง พวกเขาจ่ายเงินเต็มล่วงหน้า ขอไปถึงเนินหินดำก่อนค่ำวันที่สอง

    บ่ายวันที่สอง ทางที่คนนำทางแก่สอนให้เดินอ้อมเนินเถ้าใหญ่ไปทางเหนือ ช้ากว่าครึ่งวัน ช่างสำรวจคนหนึ่งชี้ทางตรงข้ามเนิน ปลายทางอยู่แค่นั้น มองเห็นด้วยตาเปล่า

    เขาบอกว่าจะจ่ายเพิ่มอีกเท่าตัวถ้าไปทางนี้ ผิวเถ้าตรงหน้าเรียบเหมือนผ้าปูที่นอนที่เพิ่งรีด
  choices:
    - id: straight_across
      label: พาเดินตัดตรงข้ามเนินตามที่เขาขอ
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          {name}เดินนำ ไม่เดินเป็นเส้นตรง เดินซิกแซกตามรอยย่นเล็กๆ บนผิวเถ้าที่คนอื่นมองไม่เห็น รอยย่นแปลว่าข้างใต้ยังมีหินรับ ผิวเรียบแปลว่าไม่มี ทุกก้าวต้องกดปลายเท้าลงก่อนลงส้น

          ถึงเนินหินดำก่อนแดดหมดฟ้า ช่างสำรวจจ่ายเพิ่มตามที่พูด คนนำทางแก่ได้ยินเรื่องนี้ทีหลัง แกฟังจบแล้วว่า คนนำทางที่ตายส่วนใหญ่ก็เคยผ่านทางตรงได้หนึ่งครั้งก่อน
        effects: { stats: { WIS: 1 }, gold: 12, flags: [crossed_ash_straight] }
      failure:
        text: |
          ครึ่งทาง ผิวเถ้าใต้เท้าของ{name}ยุบลงเงียบๆ ไม่มีเสียงอะไรเตือน ลงไปถึงเข่า ถึงเอว ยิ่งดิ้นก็ยิ่งลง {name}ตะโกนให้สองคนข้างหลังหยุดอยู่กับที่ อย่าเข้ามา

          ช่างสำรวจคนหนึ่งเดินถอยหลังตามรอยเท้าตัวเองกลับไปจนถึงทางอ้อม แล้วเล่าเรื่องนี้ให้บริษัทฟัง บริษัทจดลงไปในแผนที่ว่าตรงนั้นห้ามเดิน คนนำทางแก่ไปนั่งอยู่ริมเนินนั้นสามวัน ไม่มีอะไรให้ขุดขึ้นมา
        effects: { die: true }
    - id: go_around
      label: ปฏิเสธ พาอ้อมทางเหนือตามที่ครูสอน
      text: |
        ช่างสำรวจบ่นตลอดทางอ้อม บ่นว่าคนนำทางแดนเถ้ากินเงินเปล่า บ่นว่าทางนี้ยาวเพราะอยากได้ค่าจ้างวันที่สาม {name}เดินนำเงียบๆ ไม่เถียง

        ถึงเนินหินดำตอนสาง ช้ากว่าที่ตกลงไว้ครึ่งคืน เขาหักเงินที่จ่ายล่วงหน้าคืนไปครึ่งหนึ่ง คนนำทางแก่หัวเราะตอนได้ฟัง บอกว่าคนที่ด่าแบบนี้ได้ แปลว่ายังมีปากครบ
      effects: { stats: { CON: 1 }, gold: 3, alignment: { law: 1 }, flags: [kept_the_long_way] }
    - id: test_alone
      label: ให้สองคนนั้นรอ ผูกเชือกที่เอว แล้วเดินลองทางตรงไปก่อนคนเดียว
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ผูกเชือกยาวที่เอว ให้ช่างสำรวจถือปลายไว้ แล้วเดินลองไปทีละก้าว ปักไม้เท้าลงก่อนทุกครั้ง ร้อยก้าวแรกแข็ง ร้อยก้าวที่สองไม้เท้าจมลงไปทั้งท่อน แล้วก็ไม่มีเสียงอะไรจากข้างล่างเลย

          {name}ถอยกลับมาตามรอยเดิม บอกว่าทางตรงไปไม่ได้ ช่างสำรวจเห็นไม้เท้าที่เหลือแค่ด้ามจับ ก็ไม่เถียงอีก เดินอ้อมไปด้วยกันเงียบๆ ถึงเนินหินดำตอนดึก เขาจ่ายเพิ่มให้ทั้งที่ไม่ได้ไปทางตรง
        effects: { stats: { DEX: 1, WIS: 1 }, gold: 8, flags: [tested_ash_alone] }
      failure:
        text: |
          ก้าวที่หกสิบ เถ้าใต้เท้ายุบ {name}จมลงไปถึงอกในอึดใจเดียว เชือกที่เอวตึงเปรี๊ยะ ช่างสำรวจสองคนลากกันสุดแรงอยู่นานกว่าจะดึง{name}ขึ้นมาได้ทั้งตัว

          เถ้าร้อนเข้าไปอยู่ในเสื้อ ในหู ในปาก ผิวหนังตั้งแต่อกลงไปพองเป็นแผ่น ช่างสำรวจคนที่เคยบ่นเป็นคนทาน้ำมันให้ทั้งคืน แล้วไม่พูดเรื่องทางตรงอีกเลยจนถึงเนินหินดำ
        effects: { stats: { DEX: 1 }, hp: -3, gold: 6, flags: [tested_ash_alone] }
