# ชุด อ ลัทธิเถ้า (10 เรื่อง): ทางเข้า 2 · งาน 4 · ขึ้นยศ 2 · โดนเปิดโปง 1 · ชีวิตหลังเรื่องแตก 1
# คนที่มีแต่ในข้อความ: ทาเซีย หญิงขายปลาแห้งในผ้าคลุมไหล่สีซีด ถือหม้อถ่านอุ่นมือ (ทางเข้าแรก)
#   กอร์ซัน หัวหน้าปากหลุมในแดนเถ้า มือพันผ้า (ทางเข้าที่สอง) · เกรซา หญิงรับซักผ้าที่น้องชายเป็นเสมียนของนักล่าแม่มด
# กองของตัวละครไม่มีชื่อ ไม่บอกว่าอยู่เมืองไหน เรื่องหลังทางเข้าเขียนให้ใช้ได้ทั้งกองในห้องใต้หลังคาและกองในเหมืองเก่า
# ของประจำยศ: ตลับถ่าน (ashcult_coal_tin) ได้ในฉากขึ้นเป็นคนถือถ่านทุกทาง หลุดมือเมื่อตัดขาดจากกองหรือเอาไปคืน
# ทางถอดตราร้อน (curse_brand) ของคนเผ่าอื่น: ashcult_after_the_post ตัวเลือกคืนตลับถ่านแล้วให้นักบวชเวรัสลบตราด้วยไฟตะเกียง
# ผลงานเพิ่มนอกงาน: นั่งเฝ้าหลังหน้าต่างครัวจนคนของกองผ่าน (สำเร็จ) 1 · ได้เวรยามครบเดือนจากลุงยาม (สำเร็จ) 1 ชีวิตหนึ่งได้งานราวหกถึงแปดงาน ยศสาม (ผลงาน 7) จึงต้องมีทางแบบนี้ ทางเข้ารับถึงอายุ 45 ด้วยเหตุเดียวกัน

# ---------- ทางเข้า ----------
- id: adult.ashcult_join_small_kindness
  stage: adult
  scene: market
  weight: 13
  when:
    age: [25, 45]
    location_tag: [arvel_village, ventras, kardin]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [left_the_ash_cult]
  text: |
    ถุงผ้าที่ผูกเอวหายไปตอนไหนสักตอนระหว่างแผงปลากับแผงเกลือ ในถุงมีเงินทั้งเดือน กับของชิ้นเล็กชิ้นหนึ่งที่{name}พกติดถุงมาหลายปีจนลืมไปแล้วว่าพกเพราะอะไร {name}เดินย้อนทางเดิมสามรอบ ก้มดูใต้แผงทุกแผง ถามคนขายทุกคนที่ยืนอยู่ตรงนั้นเมื่อตอนสาย ไม่มีใครเห็น ตกบ่าย{name}เพิ่งรู้ว่าของชิ้นนั้นสำคัญแค่ไหน มือยังคลำหามันที่เอวทุกครั้งที่หยุดเดิน

    พลบค่ำ{name}นั่งอยู่บนขั้นบันไดบ่อน้ำกลางตลาด หญิงขายปลาแห้งคนหนึ่งในผ้าคลุมไหล่สีซีดนั่งลงข้างๆ วางหม้อดินใบเล็กไว้บนตัก ในหม้อมีถ่านคุอยู่ก้อนเดียว แม่ค้าตลาดพกหม้อแบบนี้ไว้อุ่นมือกันทั้งนั้น นางสั่งน้ำแกงจากแผงข้างบ่อมาสองชาม ยื่นให้{name}ชามหนึ่งโดยไม่ถามว่าหิวไหม แล้วนับเหรียญจากถุงของนางวางเรียงบนขั้นบันไดระหว่างสองคน นางนับจนหยุดเอง ยอดเท่ากับเงินในถุงที่หายไป ไม่ขาดไม่เกินสักเหรียญ

    นางชื่อทาเซีย บอกว่าจะคืนเมื่อไรก็ได้ ห้องของนางอยู่ใต้หลังคาบ้านหลังใหญ่ท้ายตรอกช่างย้อม เจ้าของเก่าขายบ้านไปนานแล้ว ชั้นล่างยังไม่มีคนซื้อ ขึ้นบันไดไม้ข้างตึกไปได้เลย มือที่นับเหรียญพันผ้าไว้ทั้งสองข้างเหมือนมือคนที่จับเกลือทั้งวัน นางไม่ถามว่า{name}ทำอะไรหาย

    คืนนั้นเสียงทุ้มต่ำเรียกชื่อ{name}ในฝัน เรียกแบบที่คนในบ้านเรียกกันให้มากินข้าว แล้วบอกว่าของชิ้นนั้นอยู่ในรางน้ำหลังโรงย้อม เช้าวันต่อมา{name}เจอของชิ้นนั้นในรางจริง เปียกโชก มีสีครามติดอยู่ครึ่งหนึ่ง
  choices:
    - id: go_up_to_the_attic
      label: เอาเหรียญขึ้นไปคืนทาเซียที่ห้องใต้หลังคา
      text: |
        บันไดไม้ข้างตึกผุไปสองขั้น ห้องใต้หลังคากว้างกว่าที่คิด มีคนนั่งล้อมหม้อดินใบเดียวกับที่ทาเซียถืออยู่เจ็ดคน ช่างทำถัง หญิงขายเทียน ชายแก่ที่กวาดลานหน้าวิหารตะเกียงทุกเช้า อีกสี่คน{name}ไม่รู้จัก คนหนึ่งปะเสื้อ คนหนึ่งกินขนมปัง ทาเซียไม่รับเหรียญคืน นางเลื่อนเบาะรองนั่งมาให้ใบหนึ่ง บอกว่าเจ้าของบ้านอยากให้นั่งก่อน เรื่องเงินค่อยว่ากัน

        ทั้งห้องคุยกันเรื่องราคาถ่าน เรื่องลูกสาวช่างทำถังที่จะแต่งงานหน้าแล้ง แล้วทุกคนก็หยุดพูดพร้อมกันเหมือนนัดไว้ ถ่านในหม้อแดงขึ้นทีละน้อยโดยไม่มีใครเป่า ตอนดึก{name}ลงบันไดกลับบ้าน เหรียญของทาเซียอยู่ในถุงครบทุกเหรียญ
      effects:
        org: { id: ash_cult, join: true, secret: true }
        mark: เข้ากองของลัทธิเถ้า
        stats: { WIS: 1 }
        flags: [went_up_to_tasias_attic]
    - id: repay_at_the_stair_foot
      label: รวบรวมเงินมาคืนให้ครบ แล้วยื่นให้นางที่เชิงบันได ไม่ขึ้นไป
      text: |
        {name}เก็บเงินจากส่วนที่กันไว้ทำอย่างอื่นได้ครบในสามวัน แล้วยืนรอที่เชิงบันไดข้างตึกจนทาเซียลงมาตักน้ำ นางรับเหรียญไปนับทีละเหรียญเหมือนตอนให้ ไม่ถามว่าทำไมไม่ขึ้นไป บอกแค่ว่าประตูข้างบนไม่เคยลงกลอน

        ตั้งแต่คืนนั้นเสียงทุ้มต่ำไม่มาในฝันอีก ทาเซียยังนั่งขายปลาแห้งที่ขั้นบันไดบ่อน้ำทุกเย็น หม้อดินอยู่บนตัก ทุกครั้งที่{name}เดินผ่าน นางยกมือที่พันผ้าขึ้นทักเหมือนทักคนในตรอกเดียวกัน
      effects: { gold: -3, alignment: { law: 1 }, flags: [repaid_tasia_at_the_stair_foot] }
    - id: tell_the_lamp_temple
      label: เอาเหรียญไปให้นักบวชที่วิหารตะเกียงดู แล้วเล่าเรื่องเสียงในฝัน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          นักบวชเวรคืนนั้นฟังจนจบ ถามชื่อตรอกซ้ำหนึ่งหน แล้วส่งเด็กรับใช้วิ่งไปตามนักล่าแม่มด ก่อนเที่ยงคืนนักล่าแม่มดสี่คนขึ้นบันไดข้างตึก ห้องใต้หลังคาว่าง กวาดสะอาด มีแต่รอยวงกลมบนพื้นไม้ที่ยังอุ่นเมื่อเอามือแตะ นักบวชคืนเหรียญให้ บอกว่าเงินไม่ผิด

          ทาเซียไม่มาขายปลาแห้งที่บ่อน้ำอีก ครึ่งเดือนต่อมา{name}เปิดประตูตอนเช้า เจอชามน้ำแกงเปล่าสองใบวางคว่ำซ้อนกันไว้บนธรณีประตู
        effects: { stats: { CHA: 1 }, reputation: { lamp_church: 1 }, hunted: { ash_cult: 1 }, flags: [told_the_temple_about_the_attic] }
      failure:
        text: |
          นักบวชเวรคืนนั้นง่วงจนต้องให้{name}เล่าซ้ำ เขาจดชื่อตรอกลงสมุดผิดตรอก แล้วบอกให้กลับมาใหม่วันเวรัส กว่านักล่าแม่มดจะขึ้นไปถึงห้องใต้หลังคา ห้องนั้นมีครอบครัวช่างทำถังเช่าอยู่แล้ว เด็กสามคนนอนเรียงกันตรงที่หม้อดินเคยวาง

          ทาเซียยังนั่งขายปลาแห้งที่ขั้นบันไดบ่อน้ำทุกเย็น นางเรียกชื่อ{name}ทักทุกครั้งที่เดินผ่าน ชื่อที่{name}จำไม่ได้ว่าเคยบอกนาง
        effects: { hunted: { ash_cult: 1 }, flags: [told_a_sleepy_priest_about_the_attic] }
    - id: brand_warmed_at_the_well
      label: เอาเหรียญไปคืนนางแต่เช้า เพราะเมื่อวานตราบนตัวร้อนขึ้นตั้งแต่นางนั่งลง
      requires: { trait: curse_brand }
      text: |
        ทาเซียรับเหรียญคืนโดยไม่นับ นางยกหม้อดินจากตักไปวางอีกฝั่งของตัว ห่างจาก{name}ออกไปหนึ่งช่วงแขน บอกว่าคนที่มีตราไม่ต้องให้ใครพาขึ้นบันได วันไหนอยากขึ้นก็ขึ้นมาเอง แล้วหันไปนับปลาแห้งในตะกร้าต่อ

        ตราบนตัว{name}อุ่นอยู่ทั้งเช้าเหมือนมีมือใครทาบไว้ ตกบ่ายจึงเย็นลง ตั้งแต่วันนั้น{name}ไปตักน้ำที่บ่อท้ายตลาด ไกลกว่าเดิมครึ่งตรอก
      effects: { gold: -3, stats: { WIS: 1 }, flags: [returned_tasias_coins_at_dawn] }

- id: adult.ashcult_join_owner_of_the_house
  stage: adult
  scene: mine
  time: night
  weight: 26
  when:
    age: [25, 45]
    location_tag: ashland
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [left_the_ash_cult]
  text: |
    ลูกชายหญิงม่ายบ้านถัดไปไม่กลับจากปากหลุม เด็กคนนั้นคัดถ่านอยู่ที่ลานหน้าเหมืองมาตั้งแต่ตัวยังเล็กกว่าตะกร้า แม่เด็กเข่าเสีย เดินลงเนินไม่ได้ นางมาเคาะประตูบ้าน{name}ตอนพลบ ถือตะเกียงมาให้ดวงหนึ่ง คนคัดถ่านด้วยกันบอกว่าเห็นเด็กเดินเข้าทางเหมืองเก่า ทางที่ปิดไปตั้งแต่น้ำท่วมชั้นล่าง มีไม้ตีกากบาทขวางไว้ ไม่มีใครเข้า

    ไม้กากบาทมีคนถอดออกแล้ววางพิงผนังไว้เรียบร้อย {name}เดินลงไปตามรางเกวียนเก่า ลมในอุโมงค์อุ่นขึ้นทุกช่วงไม้ค้ำ อุ่นผิดเหมืองที่ปิดมาหลายหน้าแล้ง ถึงทางแยกที่สาม มีแสงสีส้มลอดออกมาจากห้องขุดข้างทาง

    คนเจ็ดคนนั่งล้อมชามเหล็กใบหนึ่ง ในชามมีถ่านก้อนเดียว แดงสม่ำเสมอทั้งก้อน ไม่มีควัน ไม่มีเสียงแตก เด็กชายนอนขดหลับอยู่บนกองกระสอบข้างผนัง ห่มเสื้อตัวใหญ่ของใครสักคน แก้มแดงเพราะไออุ่น คนที่นั่งใกล้ทางเข้าที่สุดคือกอร์ซัน หัวหน้าปากหลุมที่จ่ายค่าแรงเด็กคนนั้นทุกสิ้นเดือน ฝ่ามือทั้งสองข้างของเขาพันผ้า ในวงมีอีกสองคนที่พันแบบเดียวกัน

    กอร์ซันไม่ลุก เขาบอกว่าเด็กเดินตามไออุ่นลงมาเอง เจ้าของบ้านไม่ไล่คนที่หนาว จะอุ้มกลับตอนนี้ก็ได้ จะนั่งรอให้เด็กตื่นก่อนก็ได้ พูดจบเขาแบมือข้างหนึ่งยื่นเข้าหาชาม ผ้าพันมือเลื่อนลง กลางฝ่ามือมีรอยแดงคล้ำเท่าเหรียญ แดงขึ้นทีละน้อยจนเท่ากับถ่านในชาม
  choices:
    - id: sit_by_the_bowl
      label: นั่งลงในวง รอให้เด็กตื่นเอง
      text: |
        คนในวงขยับให้มีที่ว่างหนึ่งที่ ไม่มีใครถามชื่อ{name} เพราะทุกคนรู้อยู่แล้ว คนที่นั่งข้างๆ คือหญิงที่ขายเกลือให้ทั้งหมู่บ้าน นางรินน้ำร้อนจากกาที่วางอุ่นไว้ข้างชามให้ถ้วยหนึ่ง วงคุยกันเรื่องน้ำซึมที่ชั้นสาม เรื่องหน่วยลาดตระเวนของป้อมที่มาช้ากว่าเดิมครึ่งวัน แล้วหยุดคุยทีละคน เอามือแตะพื้นหิน

        ใต้หินมีเสียงทุ้มต่ำเหมือนลมผ่านปล่องที่อยู่ลึกลงไป {name}ฟังไม่ออกว่าเป็นคำอะไร รู้แค่ว่ามันเรียกด้วยน้ำเสียงแบบที่คนในบ้านเรียกกัน ใกล้สางเด็กชายตื่น {name}อุ้มขึ้นไปส่งแม่ ไม่มีใครในวงสั่งว่าห้ามเล่า ไม่มีใครต้องสั่ง
      effects:
        org: { id: ash_cult, join: true, secret: true }
        mark: เข้ากองของลัทธิเถ้า
        stats: { WIS: 1 }
        flags: [sat_by_the_bowl_in_the_old_gallery]
    - id: carry_the_boy_out
      label: อุ้มเด็กขึ้นหลัง แล้วเดินกลับทางเดิมทันที
      text: |
        ไม่มีใครลุกขวาง กอร์ซันยื่นเสื้อตัวใหญ่ที่ห่มเด็กมาให้ด้วย บอกว่าข้างบนลมแรง ห่มไปก่อน พรุ่งนี้ค่อยเอามาคืนที่ปากหลุม {name}แบกเด็กขึ้นตามรางเกวียน ไออุ่นจางลงทุกช่วงไม้ค้ำ พอถึงปากทาง ลมหนาวตีหน้าเหมือนคนเพิ่งสร่างไข้

        เช้าวันต่อมา{name}เอาเสื้อไปคืนที่ปากหลุม กอร์ซันรับไปพาดบ่า แล้วจ่ายค่าแรงของวันที่เด็กไม่ได้มาคัดถ่านให้เต็ม ไม่หักสักเหรียญ ตกบ่ายไม้กากบาทกลับไปขวางทางเหมืองเก่า ตะปูใหม่ทุกตัว
      effects: { stats: { CON: 1 }, flags: [carried_the_boy_out_of_the_gallery] }
    - id: tell_the_line_wardens
      label: พาเด็กกลับบ้าน แล้วไปบอกผู้เฝ้าผนึกว่าเห็นอะไรในเหมืองเก่า
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          {name}ไม่ไปที่ประตูป้อม ไปหาผู้เฝ้าผนึกกะเช้าที่เดินตรวจแนวหินแทน คนที่ไม่เคยได้นั่งในห้องเสมียน เขาฟังแล้วเรียกเพื่อนมาอีกสามคน ลงเหมืองเก่ากันตอนสายพร้อมตะเกียงและถังน้ำ ห้องขุดข้างทางแยกที่สามว่างเปล่า ชามเหล็กหายไป พื้นหินกลางห้องสะอาดเป็นวงกลมเท่าปากชาม รอบวงนั้นฝุ่นถ่านหนาเท่าเล็บ

          กอร์ซันยังจ่ายค่าแรงที่ปากหลุมทุกสิ้นเดือน มือพันผ้าเหมือนเดิม ทุกครั้งที่{name}เดินผ่าน เขาถามถึงเด็กคนนั้นว่ากินข้าวได้มากขึ้นหรือยัง
        effects: { stats: { WIS: 1 }, reputation: { wardens: 1 }, hunted: { ash_cult: 1 }, flags: [told_the_line_wardens_about_the_bowl] }
      failure:
        text: |
          ผู้เฝ้าผนึกที่ยืนยามประตูป้อมพา{name}ไปส่งห้องเสมียน เสมียนจดทุกคำลงสมุด ถามชื่อกอร์ซันซ้ำสองหน แล้วบอกว่าจะส่งคนลงไปดู สองวันต่อมา{name}เห็นชายคนหนึ่งเดินออกจากห้องเสมียนห้องนั้น เสื้อคนงานเหมืองซักจนสีจาง เล็บสะอาดทุกเล็บ มือว่างทั้งสองข้าง

          ไม่มีใครลงไปดูเหมืองเก่า ไม้กากบาทยังพิงผนังอยู่ข้างปากทาง ไม่มีใครตีกลับ
        effects: { hunted: { ash_cult: 1 }, flags: [reported_the_bowl_to_a_bought_clerk] }
    - id: brand_answered_the_bowl
      label: ยื่นมือเข้าหาชาม ให้วงเห็นว่าตราบนตัวร้อนขึ้นตามถ่านก้อนนั้น
      requires: { trait: curse_brand }
      text: |
        ตราบนตัว{name}ร้อนขึ้นตั้งแต่ทางแยกที่สอง พอยื่นมือเข้าใกล้ชาม ตรานั้นร้อนจนเหมือนมีนิ้วใครกดลงไป กอร์ซันดูมือที่ยื่นมา แล้วขยับเบาะของตัวเองชิดผนังเข้าไปอีกนิด ทั้งวงขยับตาม จนมีที่ว่างพอดีหนึ่งคน

        ไม่มีใครถามว่าตรานั้นได้มาอย่างไร ใกล้สาง{name}อุ้มเด็กขึ้นไปส่งแม่ ตลอดทางขึ้น ตราเย็นลงทีละช่วงไม้ค้ำ เหมือนแสงไฟของบ้านที่เดินห่างออกมาเรื่อยๆ
      effects:
        org: { id: ash_cult, join: true, secret: true }
        mark: เข้ากองของลัทธิเถ้า
        stats: { CHA: 1 }
        flags: [brand_answered_the_bowl]

# ---------- งาน (ประตูรั้ว ห่อด้ายแดง และถ่านบนธรณีประตูทำซ้ำได้ เวรยามมีครั้งเดียวเพราะหลานยามไม่อยู่แล้วหลังจากนั้น ถ่านบนธรณีประตูเลิกออกเมื่อเคยทำแตกเป็นสองก้อน) ----------
- id: adult.ashcult_duty_undrawn_bolt
  stage: adult
  scene: home
  time: night
  weight: 20
  once: false
  duty: ash_cult
  when:
    age: [25, 64]
    org: { id: ash_cult, secret: true }
  text: |
    ระหว่างยืนรอคิวตักน้ำ หญิงคนหนึ่งที่{name}ไม่เคยเห็นหน้ามาต่อคิวข้างหลัง ด้ายแดงสีเลือดหมูพันข้อมือนางสามรอบ ตอนถังของ{name}ขึ้นพ้นปากบ่อ นางพูดเบาพอให้ได้ยินคนเดียว คืนนี้ประตูรั้วหลังบ้านเจ้า อย่าลงกลอน แล้วก็ก้มลงคลายเชือกถังของนางต่อ ไม่หันมาอีก

    ประตูรั้วหลังบ้าน{name}มีกลอนไม้อันเดียว ลงทุกคืนจนมือทำเองโดยไม่ต้องคิด นอกรั้วเป็นตรอกแคบที่คนเดินลัดกันตอนกลางวัน อีกฝั่งของลานหลังบ้านมีกำแพงเตี้ยที่ข้ามไปออกอีกถนนได้ กลางคืนไม่มีใครใช้ทางนี้ นอกจากคนที่ไม่อยากเดินถนนใหญ่

    พลบค่ำมีคนสวมรองเท้าหนักสองสามคนเดินเร็วผ่านปากตรอกไปทางตลาด แล้วย้อนกลับมาอีกรอบ
  choices:
    - id: leave_the_bolt
      label: ปล่อยกลอนไว้ แล้วเข้านอนตามปกติ
      text: |
        กลางดึกประตูรั้วเปิดแล้วปิด ฝีเท้าคนสองคนผ่านลานหลังบ้าน คนหนึ่งหนัก คนหนึ่งเบาเหมือนเด็ก แล้วหายไปทางกำแพงเตี้ย กลิ่นถ่านร้อนค้างอยู่ในลานจนเกือบสาง

        สายวันต่อมานักล่าแม่มดสองคนเดินเคาะประตูไล่ทั้งตรอก แล้วพาชายหนุ่มบ้านถัดไปไปด้วย เพราะเมื่อคืนเขากลับบ้านดึกและบอกไม่ได้ว่าไปไหนมา ตกค่ำเขาเดินกลับมาเอง มุมปากแตก นั่งล้างแผลอยู่ที่บ่อคนเดียวจนมืด
      effects: { flags: [left_the_back_gate_unbolted] }
    - id: watch_from_the_kitchen
      label: ปล่อยกลอนไว้ แต่นั่งดูอยู่หลังหน้าต่างครัวว่าใครจะผ่าน
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}นั่งในมุมมืดหลังบานเกล็ดจนเลยเที่ยงคืน ประตูรั้วเปิด ชายตัวใหญ่คนหนึ่งอุ้มเด็กห่มผ้าเดินผ่านลาน ขากางเกงเปื้อนเถ้าถึงเข่า ก่อนปีนกำแพงเตี้ยเขาหยุด หันมาทางหน้าต่างครัว ยกมือข้างที่ว่างขึ้นแตะหน้าผากหนึ่งที แล้วข้ามไป {name}ไม่รู้ว่าเขาเห็น หรือแค่รู้ว่าต้องมีคนดูอยู่

          สายวันต่อมานักล่าแม่มดพาชายหนุ่มบ้านถัดไปไปสอบทั้งวัน เพราะเมื่อคืนเขากลับบ้านดึก
        effects: { org: { id: ash_cult, merit: 1 }, flags: [watched_who_used_the_back_gate] }
      failure:
        text: |
          ตอนดึก ขาม้านั่งที่{name}ลากมานั่งหลังหน้าต่างหักดังไปทั้งตรอก ประตูรั้วที่กำลังแง้มชะงักอยู่ครึ่งบาน แล้วปิดกลับเบาๆ ฝีเท้าหายไปทางปากตรอก ส่วนที่ปากตรอกมีแสงตะเกียงของใครคนหนึ่งแกว่งเข้ามาดู

          สายวันต่อมานักล่าแม่มดคนหนึ่งมาเคาะประตูบ้าน{name}คนเดียว ถามว่าเมื่อคืนเสียงอะไร {name}ตอบว่าม้านั่งหัก เขาขอดูม้านั่ง ดูแล้วจดอะไรบางอย่างลงสมุดเล่มเล็ก สั้นกว่าชื่อคน ยาวกว่าคำว่าไม่มีอะไร
        effects: { hunted: { lamp_church: 1 }, flags: [a_witch_hunter_saw_the_broken_stool] }
    - id: draw_the_bolt
      label: ลงกลอนเหมือนทุกคืน
      refuse: true
      text: |
        กลอนไม้ลงช่องเสียงดังเท่าทุกคืน กลางดึกมีคนดันประตูรั้วครั้งหนึ่ง ไม่แรง แล้วฝีเท้าก็ย้อนกลับไปทางปากตรอก เช้าวันต่อมามีเถ้าติดอยู่บนกลอนเป็นรอยนิ้วสี่นิ้ว

        ตอนเที่ยงมีข่าวมาถึงบ่อน้ำว่าเมื่อคืนนักล่าแม่มดจับคนได้หนึ่งคนที่ปากตรอกฝั่งโน้น คนที่เล่าไม่รู้ว่าคนนั้นอุ้มอะไรมาด้วยหรือเปล่า
      effects: { flags: [bolted_the_back_gate_anyway] }

- id: adult.ashcult_duty_red_thread_parcel
  stage: adult
  weight: 20
  once: false
  duty: ash_cult
  when:
    age: [25, 64]
    org: { id: ash_cult, secret: true }
  text: |
    ห่อผ้าดิบขนาดเท่าก้อนขนมปัง มัดด้ายแดงสีเลือดหมูสามรอบ วางอยู่บนธรณีประตูบ้าน{name}ตอนเช้า ข้างห่อมีด้ายอีกเส้นที่ยาวพอพันข้อมือสามรอบ กับเศษกระดาษเขียนไว้สองบรรทัด บ้านหลังไหน กับเวลาไหน

    บ้านหลังนั้นอยู่อีกฟากของย่าน เมื่อวานมีคนหามโลงออกมาจากบ้านหลังนั้น ห่อหนักกว่าที่ดู เอียงแล้วมีเสียงเหรียญกระทบกัน ตรงกลางห่อมีอะไรอุ่นอยู่ก้อนหนึ่ง อุ่นเหมือนขนมปังที่เพิ่งออกจากเตา แต่ห่อนี้วางอยู่ตรงนั้นมาตั้งแต่ก่อนสาง

    ด้ายแดงสามรอบที่ข้อมือบอกคนในกองว่าอย่าทัก คนนี้กำลังทำงาน นักล่าแม่มดบางคนก็อ่านด้ายแบบนี้ออก
  choices:
    - id: wind_and_carry
      label: พันด้ายรอบข้อมือสามรอบ แล้วเอาห่อไปส่งตามเวลาในกระดาษ
      text: |
        หญิงที่เปิดประตูตาบวมจนเกือบปิด ข้างหลังนางยังมีม้านั่งเรียงเป็นแถวจากงานเมื่อวาน ไม่มีใครเก็บ นางมองด้ายที่ข้อมือ{name}ก่อนมองหน้า แล้วรับห่อไปกอดไว้กับอก ไม่ถามว่าใครส่งมา นางพูดแค่ว่าค่าโลงยังค้างช่างไม้อยู่ห้าเหรียญ พูดเหมือนพูดกับตัวเอง

        ครึ่งเดือนต่อมา{name}เดินผ่านบ้านหลังนั้นตอนพลบ ริมหน้าต่างมีหม้อดินใบเล็กวางอยู่ใบหนึ่ง ในหม้อมีถ่านคุอยู่ก้อนเดียว
      effects: { flags: [carried_a_parcel_in_red_thread] }
    - id: look_inside_first
      label: แกะห่อดูก่อนส่ง แล้วมัดกลับให้เหมือนเดิม
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ในห่อมีเหรียญห้าเหรียญห่อผ้าแยกไว้ ขนมปังก้อนหนึ่ง กับตลับเหล็กเล็กๆ ที่ฝาร้อนจนต้องจับผ่านชายเสื้อ {name}ไม่เปิดตลับ มัดด้ายกลับสามรอบ ปมเดิม ทิศเดิม แล้วเอาไปส่งตรงเวลา หญิงที่รับห่อไม่ดูปมสักนิด นางกอดห่อไว้กับอกแล้วปิดประตู

          ห้าเหรียญนั้นพอดีกับค่าโลงที่บ้านหลังนั้นค้างช่างไม้ {name}รู้ทีหลังจากคนที่บ่อน้ำ
        effects: { flags: [looked_inside_the_red_thread_parcel] }
      failure:
        text: |
          ตลับเหล็กในห่อร้อนกว่าที่คิด {name}เผลอจับด้วยมือเปล่า ปลายนิ้วพองทันทีสามนิ้ว ตลับหล่นกลิ้งเข้าใต้โต๊ะ กว่าจะเขี่ยออกมาได้ก็เลยเวลาในกระดาษไปแล้ว

          บ้านหลังนั้นปิดประตูลงกลอน {name}วางห่อไว้บนธรณีประตู ด้ายที่มัดกลับไม่ใช่ปมเดิม เช้าวันต่อมาห่อหายไป ไม่มีใครบอกว่าใครเอาไป
        effects: { hp: -1, flags: [burned_fingers_on_the_parcel_tin] }
    - id: put_the_parcel_back
      label: วางห่อคืนบนธรณีประตูบ้านตัวเองตอนค่ำ ไม่ไปส่ง
      refuse: true
      text: |
        ตอนค่ำ{name}วางห่อคืนบนธรณีประตูตรงที่เดิม ด้ายเส้นที่ยาวพอพันข้อมือวางทับไว้ข้างบน เช้าวันต่อมาห่อหายไป ทั้งด้ายทั้งห่อ

        สามวันต่อมาช่างไม้มาขนโต๊ะกับม้านั่งของบ้านหลังนั้นไปแทนค่าโลง หญิงเจ้าของบ้านยืนดูอยู่หน้าประตู มือว่างทั้งสองข้าง
      effects: { flags: [returned_the_red_thread_parcel] }

- id: adult.ashcult_duty_watch_rota
  stage: adult
  weight: 20
  duty: ash_cult
  when:
    age: [25, 64]
    org: { id: ash_cult, secret: true }
  text: |
    ยามกลางคืนของย่านมีสองคน ลุงยามคนแก่ที่เดินเคาะไม้ทุกหัวมุม หัวมุมละสามที กับหลานชายของเขาที่เคาะหัวมุมละทีเดียวแล้วรีบไปหัวมุมถัดไป ใครนอนไม่หลับก็นับได้ว่าคืนนี้เป็นเวรของใคร ส่วนคืนไหนไม่มีเสียงไม้เลยทั้งคืน คือคืนที่หลานชายแอบนอนในซุ้มประตูวิหาร

    กองอยากรู้ว่าคืนไหนไม่มีเสียงไม้ คนที่มาบอก{name}คือชายขายถั่วคั่วหัวตรอก เขาตักถั่วให้เกินถุงไปหนึ่งกำมือ แล้วพูดเบาๆ ว่าให้นับให้ครบเดือน ด้ายแดงพันข้อมือเขาสามรอบ โผล่พ้นแขนเสื้อที่พับไว้พอให้เห็น
  choices:
    - id: count_the_knocks
      label: นอนฟังเสียงไม้เคาะทุกคืนจนครบเดือน แล้วไปบอกชายขายถั่ว
      text: |
        {name}นับด้วยเล็บ ขีดหนึ่งบนขอบเตียงสำหรับคืนของลุงยาม สองขีดสำหรับคืนของหลาน วงกลมสำหรับคืนที่ไม่มีเสียงไม้ สิ้นเดือนขอบเตียงมีวงกลมสี่วง {name}จำทั้งหมดไปบอกเป็นคำ แล้วกลับมาขูดขอบเตียงจนเรียบ

        เดือนต่อมามีคืนหนึ่งที่คนในย่านเห็นแสงไฟเดินผ่านเป็นแถวตอนดึก และไม่มีเสียงไม้เคาะสักหัวมุม เช้าวันนั้นนักล่าแม่มดลากหลานยามออกมาจากซุ้มประตูวิหาร เขากลับไปอยู่บ้านแม่ที่อื่น ไม้เคาะของเขาแขวนอยู่ข้างประตูวิหารไปอีกครึ่งหน้าแล้ง ไม่มีใครถือ
      effects: { flags: [counted_the_watchmens_nights] }
    - id: buy_the_old_man_a_jar
      label: ซื้อเหล้าให้ลุงยามสักไห แล้วปล่อยให้เขาบ่นเรื่องหลานชายเอง
      requires: { min_gold: 1 }
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ลุงยามดื่มไปครึ่งไห แล้วบ่นเรื่องหลานชายไม่หยุด คืนไหนหลานเข้าเวร คืนไหนหลานแลกเวรกับเขาเพื่อไปหาสาว เขานับนิ้วให้ฟังครบทั้งเดือนโดยไม่ต้องมีใครถาม ก่อนแยกกันเขาตบบ่า{name} บอกว่าคนที่ยอมฟังคนแก่บ่นหายากขึ้นทุกวัน

          เดือนต่อมาหลานชายของเขาโดนไล่ออกจากเวรยาม หลังคืนหนึ่งที่มีแสงไฟเดินผ่านย่านเป็นแถวโดยไม่มีเสียงไม้เคาะ ลุงยามเลิกมานั่งร้านเหล้า {name}ไม่เห็นเขาที่ร้านนั้นอีก
        effects: { gold: -1, org: { id: ash_cult, merit: 1 }, flags: [got_the_rota_over_a_jar] }
      failure:
        text: |
          ลุงยามดื่มเร็วกว่าที่{name}คิด ยังไม่ทันถึงเรื่องหลาน เขาก็ร้องเพลงสมัยหนุ่มเสียงดังไปทั้งร้าน แล้วหลับคาโต๊ะ {name}ต้องพยุงเขากลับบ้าน เขาเรียก{name}ด้วยชื่อลูกชายที่ตายไปแล้วตลอดทาง

          {name}ได้เวรมาครึ่งเดือน อีกครึ่งเดาเอา ชายขายถั่วรับไปโดยไม่ถามว่าครึ่งไหนเดา
        effects: { gold: -1, flags: [the_old_watchman_sang_instead] }
    - id: could_not_keep_count
      label: บอกชายขายถั่วว่านับไม่ทัน
      refuse: true
      text: |
        ชายขายถั่วตักถั่วให้พอดีถุงเหมือนลูกค้าทั่วไป ไม่ทวง ไม่ถามซ้ำ

        เดือนต่อมามีหญิงขายแป้งทอดมานั่งขายที่หัวมุมตรงข้ามซุ้มประตูวิหารทุกคืน นั่งจนดึก ไม่เคยขายหมดสักคืน
      effects: { flags: [did_not_count_the_watch] }

- id: adult.ashcult_duty_coal_on_the_step
  stage: adult
  weight: 20
  once: false
  duty: ash_cult
  when:
    age: [25, 64]
    org: { id: ash_cult, secret: true }
    not_flags: [broke_the_coal_in_two]
  text: |
    ถ่านก้อนหนึ่งห่อผ้าเปียกมาถึงมือ{name}ปนกับเงินทอน หญิงขายผักที่ทอนเงินให้กำมือ{name}ปิดไว้ครู่หนึ่งก่อนปล่อย แล้วบอกเบาพอได้ยินกันสองคน ก่อนสาง ธรณีประตูหลังร้านขนมปัง ก้อนเดียว

    คนอบขนมปังของย่านตะโกนเรียกชื่อลูกค้าจากในร้านทุกเช้าก่อนลูกค้าจะเดินมาถึงหน้าร้าน ขนมปังของ{name}เขาเลือกก้อนที่ขอบไหม้น้อยที่สุดให้เสมอ ลูกสาวของเขาเป็นคนห่อ เมียของเขาเป็นคนทอนเงิน

    ถ่านก้อนเดียวบนธรณีประตูคือนัด สองก้อนคือหนี คนของกองรู้กันทุกคน
  choices:
    - id: set_it_before_dawn
      label: เดินไปวางถ่านก้อนเดียวบนธรณีประตูหลังร้านก่อนสาง
      text: |
        ก่อนสาง ประตูหลังร้านขนมปังยังปิด ไฟในเตาเพิ่งติด แสงลอดช่องประตูออกมาเป็นเส้น {name}วางถ่านลงกลางธรณีประตู แกะผ้าเปียกเก็บใส่กระเป๋า แล้วเดินกลับทางเดิมโดยไม่เร่ง

        เช้าวันต่อมาร้านขนมปังเปิดสาย ขนมปังออกมาครึ่งเดียวของทุกวัน คนในย่านยืนรอเป็นแถวยาวถึงหัวมุม หญิงแก่บ้านท้ายย่านกลับบ้านมือเปล่าพร้อมหลานสามคน คนอบขนมปังตาแดงเหมือนคนไม่ได้นอน เขาตะโกนเรียกชื่อ{name}จากในร้านเหมือนทุกเช้า
      effects: { flags: [put_one_coal_on_the_bakers_step] }
    - id: toss_it_from_the_alley
      label: โยนถ่านจากปากตรอกให้ตกบนธรณีประตู ไม่ต้องเข้าไปใกล้ร้าน
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ถ่านตกกลางธรณีประตูพอดี กลิ้งไปครึ่งรอบแล้วหยุด ไม่มีใครเห็นมือที่โยน ครู่ต่อมาคนอบขนมปังเปิดประตูออกมาสาดน้ำล้างถาด เขาก้าวข้ามถ่านก้อนนั้นไปเหมือนไม่เห็น แล้วก้าวกลับมาเขี่ยมันเข้าซอกกำแพงด้วยปลายเท้า

          เช้าวันต่อมาขนมปังของทั้งย่านออกมาครึ่งเดียว คนยืนรอกันถึงหัวมุม
        effects: { flags: [tossed_the_coal_onto_the_step] }
      failure:
        text: |
          ถ่านกระทบขอบหินของธรณีประตู แตกเป็นสองก้อน กลิ้งไปนอนข้างกัน {name}ยังไม่ทันเดินเข้าไปเก็บ ประตูหลังร้านก็เปิด คนอบขนมปังยืนถือถาดค้างอยู่ตรงนั้น ก้มลงดูถ่านสองก้อนที่ปลายเท้า แล้วกลับเข้าร้านไปโดยไม่ได้สาดน้ำ

          ตกเย็นร้านขนมปังปิด เตายังอุ่น แป้งที่นวดไว้ขึ้นฟูล้นราง คนอบขนมปัง เมีย และลูกสาว หายไปทั้งบ้าน ข้าวของอยู่ครบทุกชิ้น เพื่อนบ้านลือกันว่าหนีหนี้ ย่านนั้นไม่มีคนอบขนมปังไปอีกหลายเดือน
        effects: { flags: [broke_the_coal_in_two] }
    - id: drown_the_coal
      label: ทิ้งถ่านลงคูน้ำ แล้วไปซื้อขนมปังตามปกติ
      refuse: true
      text: |
        ถ่านจมลงคูน้ำโดยไม่มีเสียงฉ่า ไม่มีไอขึ้นสักสาย {name}ยืนดูผิวน้ำจนนิ่ง แล้วเดินไปร้านขนมปัง คนอบขนมปังตะโกนเรียกชื่อ{name}จากในร้าน เลือกก้อนที่ขอบไหม้น้อยที่สุดให้เหมือนทุกเช้า

        สามวันต่อมา{name}เดินผ่านหลังร้านแต่เช้า บนธรณีประตูมีถ่านก้อนเดียววางอยู่ คนอื่นมาวางแทนแล้ว
      effects: { flags: [drowned_the_meeting_coal] }

# ---------- ขึ้นยศ ----------
- id: adult.ashcult_rise_ash_keeper
  stage: adult
  weight: 60
  must: true
  time: night
  when:
    age: [19, 80]
    org: { id: ash_cult, secret: true, min_rank: 1, max_rank: 1, ready: true }
  text: |
    นัดคืนนั้นจบเหมือนทุกนัด คนในกองทยอยกลับทีละคน เว้นช่วงให้ห่างกันพอที่ใครเห็นจะไม่คิดว่ามาจากที่เดียวกัน ทุกนัดที่ผ่านมา{name}ได้กลับก่อนเพื่อน คืนนี้คนถือถ่านคนหนึ่งในกองบอกให้อยู่จนคนสุดท้าย

    พอเหลือกันสองคน คนถือถ่านยื่นของให้สองอย่าง ไม้กวาดมือด้ามสั้นที่ขนแปรงสึกเอียงไปข้างหนึ่ง กับด้ายแดงสีเลือดหมูม้วนเล็กพอกำมือ ม้วนของ{name}เอง ไม่ต้องยืมจากใคร

    ไม่มีใครอธิบายว่าคนเก็บเถ้าทำอะไร คนถือถ่านคุกเข่าลง กวาดเถ้าที่ร่วงออกจากชามมารวมเป็นกองเล็กทีละกวาด ลากเบาะกับกระสอบที่ใช้นั่งไปสุมไว้มุมห้องเหมือนของเก่าที่ไม่มีใครใช้ แล้วยื่นไม้กวาดคืนให้{name}ทำต่อ ที่ที่มีคนนั่งกันเกือบสิบคนเมื่อครู่ ต้องดูเหมือนไม่เคยมีใครมา
  choices:
    - id: sweep_it_empty
      label: กวาดจนดูเหมือนไม่เคยมีใครมา แล้วห่อเถ้ากลับไปด้วย
      text: |
        {name}กวาดจนเลยเที่ยงคืน กวาดรอยเข่า รอยที่นั่ง รอยขาชาม จนพื้นตรงนั้นมีฝุ่นหนาเท่าพื้นรอบๆ เถ้ากองเล็กห่อผ้าใส่กระเป๋าเสื้อ อุ่นอยู่ข้างตัวตลอดทางกลับ

        คืนนั้น{name}เทเถ้าห่อนั้นลงเตาในบ้าน ตอนเช้าเถ้าจากชามของกองกับเถ้าจากเตาบ้าน{name}ปนกันจนแยกไม่ออก
      effects:
        org: { id: ash_cult, promote: true }
        mark: ขึ้นเป็นคนเก็บเถ้า
        stats: { DEX: 1 }
        flags: [swept_the_meeting_place_clean]
    - id: ask_whose_broom
      label: ถามว่าไม้กวาดอันนี้เป็นของใครมาก่อน
      text: |
        คนถือถ่านตอบว่าเป็นของคนที่หายไป ตอบแค่นั้น น้ำเสียงเหมือนบอกว่าเป็นของคนที่ย้ายบ้าน ขนแปรงสึกเอียงไปทางซ้าย คนก่อนกวาดด้วยมือซ้าย

        {name}ลองกวาดด้วยมือขวา ไม้กวาดเอียงหนีพื้นจนกวาดไม่เข้า จึงเปลี่ยนเป็นมือซ้าย กวาดได้เรียบตั้งแต่ครั้งแรก ตั้งแต่นั้นมือซ้ายของ{name}คือมือที่กวาด
      effects:
        org: { id: ash_cult, promote: true }
        mark: ขึ้นเป็นคนเก็บเถ้า
        stats: { WIS: 1 }
        flags: [asked_whose_broom_it_was]
    - id: try_the_thread
      label: พันด้ายแดงม้วนใหม่รอบข้อมือสามรอบ ลองดูว่ายาวพอไหม
      text: |
        ด้ายพันได้สามรอบพอดี เหลือปลายพอผูกปมเดียว ไม่ขาดไม่เกิน ใครสักคนในกองกะขนาดข้อมือ{name}ไว้ตั้งแต่เมื่อไรก็ไม่รู้ {name}นึกย้อนไม่ออกว่ามีใครเคยจับข้อมือนานพอจะกะได้

        คนถือถ่านแกะด้ายออกจากข้อมือ{name}ให้ ม้วนกลับเป็นก้อนเดิม บอกว่าพันเฉพาะวันที่มีงาน วันอื่นเก็บไว้ในที่ที่ไม่มีใครค้น {name}เก็บไว้ก้นโถเกลือ
      effects:
        org: { id: ash_cult, promote: true }
        mark: ขึ้นเป็นคนเก็บเถ้า
        stats: { CHA: 1 }
        flags: [the_red_thread_fit_the_wrist]

- id: adult.ashcult_rise_coal_holder
  stage: adult
  scene: tavern
  weight: 60
  must: true
  when:
    age: [19, 80]
    org: { id: ash_cult, secret: true, min_rank: 2, max_rank: 2, ready: true }
  text: |
    หญิงคนถือถ่านของกองนั่งลงฝั่งตรงข้าม{name}ในร้านน้ำชาตอนเที่ยง ร้านที่คนนั่งแน่นจนไม่มีใครฟังโต๊ะข้างๆ นางวางตลับเหล็กเท่าตลับยาเส้นลงบนโต๊ะ ฝาตลับอุ่น ข้างในมีถ่านก้อนเท่าข้อนิ้วโป้ง แดงอยู่ตรงกลาง ไม่มีควัน ไม่มีเถ้าร่วง

    นางบอกว่าถ่านก้อนนี้ไม่เคยมอดมาตั้งแต่ก่อนคนในกองทุกคนจะเกิด วันไหนที่{name}ต้องไปหากองอื่น ให้เปิดตลับให้เขาดู แล้วไม่ต้องอธิบายอะไรอีก

    ถ่านแบบนี้ไม่ส่งต่อด้วยคีม คนรับหยิบเองด้วยมือเปล่า แล้วกำไว้จนกว่าถ่านจะปล่อยมือ ผ้าพันมือของนางเลื่อนลงตอนวางตลับ กลางฝ่ามือมีรอยแดงคล้ำเท่าเหรียญ ไม่พองเหมือนแผลไฟ และไม่หายเหมือนแผลไฟ
  choices:
    - id: close_the_hand
      label: หยิบถ่านด้วยมือเปล่า แล้วกำไว้จนกว่ามันจะปล่อย
      text: |
        ถ่านไม่ร้อนแบบไฟ ร้อนแบบมือใครสักคนที่กุมมือ{name}แน่นเกินไปแล้วไม่ยอมคลาย {name}กำอยู่จนน้ำชาในถ้วยตรงหน้าเย็นชืด โต๊ะข้างๆ ลุกไปสองโต๊ะ มีคนอื่นมานั่งแทน ไม่มีใครหันมา พอมือคลายออกเอง ถ่านกลิ้งลงตลับ กลางฝ่ามือมีรอยแดงคล้ำเท่าเหรียญ

        คืนนั้น{name}ฉีกชายเสื้อตัวเก่ามาพันฝ่ามือสามชั้น ตั้งแต่วันนั้นไม่เคยแกะผ้าต่อหน้าใครอีก
      effects:
        org: { id: ash_cult, promote: true }
        mark: ขึ้นเป็นคนถือถ่าน
        items: [ashcult_coal_tin]
        traits: [curse_brand]
        world: { demon: 1 }
        stats: { CON: 1 }
        flags: [closed_the_hand_on_the_coal]
    - id: ask_who_will_know
      label: ถามก่อนว่ากำถ่านก้อนนี้แล้ว ใครบ้างจะรู้ว่ามือนี้เป็นของใคร
      text: |
        นางตอบเหมือนตอบเรื่องราคาข้าว คนในกองรู้ กองอื่นรู้ นักล่าแม่มดรู้ถ้าให้แบมือ เจ้าของบ้านรู้ตั้งแต่ตอนที่นิ้วแตะถ่าน แล้วนางก็รอให้{name}ยื่นมือมาเอง

        ระหว่างที่กำถ่าน มีเสียงทุ้มต่ำดังอยู่ใต้เสียงคนคุยกันทั้งร้าน เรียกชื่อ{name}ครั้งเดียว แบบที่คนในบ้านเรียกกันตอนอีกคนกลับมาถึง พอแบมือ กลางฝ่ามือมีรอยแดงคล้ำเท่าเหรียญ
      effects:
        org: { id: ash_cult, promote: true }
        mark: ขึ้นเป็นคนถือถ่าน
        items: [ashcult_coal_tin]
        traits: [curse_brand]
        world: { demon: 1 }
        stats: { WIS: 1 }
        flags: [asked_who_would_know_the_hand]
    - id: show_the_old_brand
      label: ยื่นมือให้นางดู บอกว่ามีตราร้อนติดตัวอยู่แล้ว
      requires: { trait: curse_brand }
      text: |
        นางดูตราบนตัว{name}ครู่หนึ่ง แล้วหยิบถ่านด้วยมือของนางเองวางลงบนฝ่ามือ{name} ถ่านอุ่นไม่ต่างจากถ้วยน้ำชา ตราที่มีอยู่แล้วร้อนขึ้นแทน ร้อนช้าๆ จนเท่ากับถ่าน แล้วนิ่ง นางบอกว่าเจ้าของบ้านจำคนที่มีตราได้อยู่แล้ว ไม่ต้องกดซ้ำ

        นางปิดฝาตลับ เลื่อนข้ามโต๊ะมาให้ แล้วลุกไปก่อน ทิ้งค่าน้ำชาไว้สำหรับสองคน
      effects:
        org: { id: ash_cult, promote: true }
        mark: ขึ้นเป็นคนถือถ่าน
        items: [ashcult_coal_tin]
        world: { demon: 1 }
        stats: { CHA: 1 }
        flags: [the_old_brand_answered_the_coal]

# ---------- โดนเปิดโปง ----------
- id: adult.ashcult_exposed
  stage: adult
  scene: home
  weight: 12
  when:
    age: [25, 64]
    org: { id: ash_cult, secret: true, min_rank: 2 }
  text: |
    เกรซารับซักผ้าให้คนครึ่งย่าน รวมทั้งของ{name} เช้าวันนั้นนางไม่ได้หอบตะกร้ามา นางยืนหน้าประตูบ้าน{name}มือเปล่า เว้นแต่มือขวาที่กำอะไรไว้ พอประตูเปิดนางก็แบให้ดู ด้ายแดงสีเลือดหมูเส้นหนึ่ง ยาวพอพันข้อมือสามรอบ ติดอยู่ในกระเป๋าเสื้อที่{name}ส่งไปซัก ใต้ด้ายมีเถ้าสีเทาอ่อนติดตะเข็บเป็นเส้น

    น้องชายของเกรซาเป็นเสมียนให้นักล่าแม่มด นางบอกเรื่องนี้ก่อนเรื่องอื่น ไม่ได้บอกเพื่อขู่ นางรู้ว่าด้ายแบบนี้หมายถึงอะไรก็เพราะน้องชายเล่าให้ฟังตอนกินข้าวเย็น

    นางบอกว่ายังไม่ได้บอกใคร แล้วพูดต่อไปเลยโดยไม่เว้นช่วง ว่าลูกนางสามคน สามีตกนั่งร้านขาหักตั้งแต่ต้นหน้าฝน หน้านี้ผ้าที่รับมาซักน้อยลงทุกสัปดาห์ พูดถึงตรงนั้นนางจึงหยุด
  choices:
    - id: pay_for_the_washing
      label: ยื่นห้าเหรียญให้ บอกว่าเป็นค่าซักผ้าล่วงหน้า
      requires: { min_gold: 5 }
      text: |
        เกรซานับเหรียญต่อหน้า{name} ใส่ถุงผ้าที่ห้อยคอ แล้วยื่นด้ายคืน นางบอกว่าผ้าของ{name}นางจะซักเองทุกชิ้น ไม่ให้ลูกสาวช่วย

        ผ้าที่ส่งกลับมาจากเกรซาพับเรียบกว่าเดิม กระเป๋าเสื้อทุกใบกลับด้านออกมาให้เห็นว่าว่าง ต้นเดือนถัดมานางมายืนหน้าประตูมือเปล่าอีกครั้ง ไม่ต้องบอกว่ามาทำไม
      effects: { gold: -5, flags: [paid_for_grezas_silence] }
    - id: second_hand_shirt
      label: พูดให้นางเชื่อว่าด้ายเส้นนั้นติดมากับเสื้อมือสองที่ซื้อมา
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          เกรซาฟังจนจบ แล้วหัวเราะออกมาครั้งเดียว เสียงหัวเราะของคนที่ได้หายใจออกเสียที นางบอกว่าน้องชายนางเห็นอะไรก็เป็นลัทธิไปหมด เสื้อมือสองครึ่งตลาดคงมีด้ายแดงติดมาสักเส้น นางยื่นด้ายคืน แล้วกลับไปหอบตะกร้าที่วางไว้หัวตรอก

          คืนนั้น{name}เผาด้ายเส้นนั้นในเตา ด้ายไหม้เป็นเส้นแดงอยู่ครู่หนึ่งก่อนจะดำ ผ้าที่ส่งไปซักครั้งต่อมา{name}กลับกระเป๋าทุกใบออกดูเองก่อนส่ง
        effects: { stats: { CHA: 1 }, flags: [talked_greza_round] }
      failure:
        text: |
          เกรซาฟังจนจบ แล้ววางด้ายไว้บนธรณีประตู ไม่ยื่นใส่มือ นางถอยหลังไปสองก้าว บอกว่าน้องชายเคยเล่าว่าคนพวกนี้พูดเก่งทุกคน แล้วรีบเดินไปทางบ่อน้ำ ตกเย็นทั้งย่านรู้ เพื่อนบ้านปิดหน้าต่างทีละบาน

          ดึกคืนนั้นมีถ่านสองก้อนวางอยู่บนธรณีประตูบ้าน{name} ตรงที่เกรซาวางด้ายไว้ ก่อนสาง{name}ออกทางประตูหลัง ตอนนักล่าแม่มดมาถึงหน้าบ้านพร้อมน้องชายเกรซา บ้านหลังนั้นว่างแล้ว
        effects:
          org: { id: ash_cult, secret: false }
          mark: โดนเปิดโปงว่าเป็นคนของลัทธิเถ้า
          flags: [exposed_as_ash_cult, greza_told_the_well]
    - id: wind_it_in_front_of_her
      label: พันด้ายรอบข้อมือสามรอบต่อหน้านาง เลิกปิดเสียที
      text: |
        เกรซาดู{name}พันด้ายรอบข้อมือทีละรอบจนครบสาม หน้านางซีดลงทีละรอบเหมือนกัน นางไม่ร้อง ไม่วิ่ง นางเดินกลับไปทางบ่อน้ำด้วยฝีเท้าปกติ ตกเย็นทั้งย่านรู้ เพื่อนบ้านสามคนมายืนหน้าบ้าน{name} ถือคบไฟที่ยังไม่ได้จุด ถือไว้เฉยๆ ให้เห็น

        ดึกคืนนั้นมีถ่านสองก้อนวางบนธรณีประตู หลังจากนั้นกองไม่ส่งอะไรมาอีก ก่อนสาง{name}ออกจากบ้านทางประตูหลัง ด้ายยังพันข้อมือครบสามรอบ
      effects:
        org: { id: ash_cult, secret: false }
        mark: โดนเปิดโปงว่าเป็นคนของลัทธิเถ้า
        stats: { CON: 1 }
        flags: [exposed_as_ash_cult, wound_the_thread_before_greza]

# ---------- ชีวิตหลังเรื่องแตก ----------
- id: adult.ashcult_after_the_post
  stage: adult
  scene: temple
  weight: 30
  when:
    age: [25, 64]
    org: { id: ash_cult, secret: false }
  text: |
    {name}อยู่บ้านเดิมไม่ได้ตั้งแต่คืนที่เรื่องแตก ห้องที่เช่าได้อยู่เหนือคอกล่อ เจ้าของคอกให้เช่าเพราะไม่มีใครเช่าห้องเหม็นแบบนี้อยู่แล้ว ทุกทางจากห้องนั้นไปตลาดต้องผ่านหน้าวิหารตะเกียง ผ่านเสาหินหน้าบันไดวิหารที่ดำไปครึ่งต้นจากโคน ดำจนฝนล้างไม่ออก คนที่ผ่านหน้าวิหารเดินอ้อมเสาต้นนั้นกันเอง ไม่มีใครสั่ง พอ{name}เดินอ้อมบ้าง คนบนถนนก็หยุดดูกันทุกคน

    กองตัดขาดตั้งแต่คืนแรก ไม่มีถ่านบนธรณีประตู ไม่มีห่อมัดด้ายแดง คนในกองที่{name}เคยนั่งข้างทุกนัดเดินสวนกันในตลาดแล้วมองผ่านไปเหมือนมองเสา คนขายของชั่งให้ขาดทุกครั้ง {name}ไม่ทักสักครั้ง

    นักล่าแม่มดสองคนผลัดกันยืนที่หัวมุมใต้ห้องเช่าทุกเย็น คนหนึ่งผิวปากเพลงเดิมซ้ำไปมา อีกคนนับก้อนหินบนกำแพงด้วยปลายนิ้ว ไม่มีใครขึ้นมาเคาะประตู ทั้งสองคนรอให้{name}ทำอะไรสักอย่างก่อน
  choices:
    - id: abjure_on_the_steps
      label: ไปคุกเข่าที่บันไดวิหาร ตัดขาดจากกองต่อหน้าตะเกียงแขวน
      text: |
        นักบวชให้{name}คุกเข่าบนบันไดขั้นล่างสุดตั้งแต่สางจนเที่ยง ตรงที่คนเดินผ่านเห็นได้ทุกคน แล้วจึงลงมาถามชื่อคนในกองทีละคน {name}ตอบเท่าที่รู้ ชื่อคนที่เคยนั่งข้าง ชื่อคนที่ยื่นด้ายให้ ที่ที่นัดกัน นักบวชจดทุกชื่อ ของของกองที่ยังติดตัวอยู่ให้วางลงบนบันไดขั้นที่คุกเข่า แล้วให้{name}ยื่นมือเหนือไฟตะเกียงแขวนระหว่างท่องคำสาบานต่อเวรัสจนจบ

        คืนนั้นนักล่าแม่มดที่หัวมุมเหลือคนเดียว คืนต่อมาไม่มีเลย ที่นัดเก่าว่างตั้งแต่ก่อนนักล่าแม่มดไปถึง ชื่อที่{name}ให้ไป มีบางชื่อที่เจ้าของหายไปจากย่านในสัปดาห์เดียวกัน ตั้งแต่นั้น{name}นอนหันหน้าเข้าหาประตู
      effects:
        org: { id: ash_cult, leave: true }
        mark: ตัดขาดจากกองต่อหน้าวิหาร
        lose_items: [ashcult_coal_tin]
        hp: -1
        hunted: { lamp_church: -1, ash_cult: 2 }
        flags: [left_the_ash_cult, gave_names_on_the_temple_steps]
    - id: walk_past_the_post
      label: อยู่ต่อแบบที่ทุกคนรู้ เดินผ่านหน้าเสาทุกเช้าโดยไม่อ้อม
      text: |
        เช้าแรก{name}เดินตรงผ่านหน้าเสา ห่างแค่ช่วงแขน คนหยุดดูกันทั้งถนน เช้าที่สิบ หยุดดูกันครึ่งเดียว พอถึงปลายหน้าแล้ง มีแต่เด็กที่ยังหยุด เด็กคนหนึ่งวิ่งตามมาถามว่าเจ้าของบ้านหน้าตาเป็นอย่างไร แม่เด็กลากกลับไปก่อน{name}จะได้ตอบ

        นักล่าแม่มดยังผลัดกันยืนที่หัวมุมทุกเย็น คนที่ผิวปากเปลี่ยนเพลงแล้ว {name}ยังจำเพลงเก่าได้ทุกท่อน
      effects: { stats: { CON: 1 }, flags: [walked_past_the_post_every_morning] }
    - id: go_to_ground
      label: ย้ายไปย่านที่ไม่มีใครรู้จักหน้า ใช้ชื่ออื่น ไม่เดินผ่านวิหารหลังไหนอีก
      text: |
        {name}ย้ายตอนเที่ยงคืน ขนของได้เท่าที่แบกไหว ห้องใหม่อยู่หลังโรงต้มสบู่ เจ้าของถามชื่อครั้งเดียว {name}บอกชื่อของคนที่ตายไปนานแล้ว ทั้งหน้าแล้งไม่เดินผ่านวิหารหลังไหน ไปตลาดทางริมคูน้ำที่อ้อมไกลกว่าเดิมครึ่งชั่วยาม

        ปลายหน้าแล้ง นักล่าแม่มดคนที่ชอบผิวปากเดินผ่านหน้าโรงต้มสบู่ ผิวปากเพลงเดิม {name}ล้างถังอยู่หน้าโรง ไม่เงยหน้า เพลงผ่านไปจนสุดถนน
      effects: { stats: { WIS: 1 }, hunted: { lamp_church: -1 }, flags: [went_to_ground_across_town] }
    - id: return_the_coal_and_burn_the_brand
      label: เอาตลับถ่านไปคืนที่นัดเก่า แล้วให้นักบวชเวรัสลบตราที่ฝ่ามือด้วยไฟตะเกียง
      requires:
        trait: curse_brand
        not_flags: [race_tiefling]
        any_flags: [closed_the_hand_on_the_coal, asked_who_would_know_the_hand]
      text: |
        ที่นัดเก่าว่าง ฝุ่นหนาเท่ากันทั้งห้องอย่างที่คนเก็บเถ้าทิ้งไว้ทุกครั้ง {name}วางตลับไว้ตรงที่ชามเคยตั้ง เปิดฝาไว้ ถ่านในตลับแดงอยู่เท่าเดิม แล้วเดินไปวิหารตะเกียงโดยไม่หันกลับ นักบวชที่แก่ที่สุดของวิหารจับข้อมือ{name}ไว้เหนือไฟตะเกียงแขวน ไล่เปลวไฟไปตามรอยทีละนิดจนครบวง เจ็บกว่าวันที่รับตรา เพราะครั้งนี้ไม่มีอะไรกุมมือไว้

        แผลที่ฝ่ามือพอง แตก แล้วหายเหมือนแผลไฟทั่วไป เหลือผิวเรียบสีชมพูกว่ารอบๆ นักบวชจดชื่อ{name}ลงสมุดของวิหาร ใต้ชื่อเขียนว่ากลับมาแล้ว คืนนั้นนักล่าแม่มดที่หัวมุมเหลือคนเดียว
      effects:
        org: { id: ash_cult, leave: true }
        mark: ลบตราร้อนด้วยไฟตะเกียง
        lose_items: [ashcult_coal_tin]
        lose_traits: [curse_brand]
        hp: -2
        hunted: { lamp_church: -1, ash_cult: 2 }
        flags: [left_the_ash_cult, brand_burned_out_by_lamp_fire]
