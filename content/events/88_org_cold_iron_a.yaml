# ชุด อ องค์กรลับ: ภาคีเหล็กเย็น (cold_iron) ไฟล์ ก ทางเข้า 4 ทาง กับงานที่เตาส่งมา 10 เรื่อง
# คนของเตา (มีแต่ในข้อความ ไม่อยู่ในผังคน): เกรดิส ผู้เฒ่าเตา ช่างตีเกือกม้าหญิง เตาอยู่ในโรงไม้หลังร้านตีเกือกม้าริมทางหลวง
#   โดเรค คนถือค้อน แขนซ้ายเป็นขอเหล็กเปล่า พูดเบา ขอบคุณทุกคนที่ตอบ · เอดริน คนถือกระดิ่ง หญิงสาวที่ออกจากสถาบันกลางปีสาม
#   เฮสทัน เสมียนใส่ถุงมือสีเทาที่มากับเกวียนเหล็กปีละสองหน
# เกรดิสเป็นผู้เฒ่าจนตัวละครขึ้นยศ 4 เรื่องที่เล่าถึงนางในฐานะผู้เฒ่าที่ยังนั่งตำแหน่งจึงกัน max_rank: 3 ทุกเรื่องไม่บอกว่าเตาอยู่เมืองไหน
# เรื่องที่ช่วงอายุเริ่มต่ำกว่า 32 ไม่พูดถึงสงครามถ่าน แขนกลของโดเรคเล่าได้ แต่ไม่บอกว่าเสียแขนในสงครามไหน
# การเคาะสามครั้ง: ครั้งแรกบากวงกบประตูสูงระดับไหล่ ครั้งที่สองเครื่องมือกับตำรา ครั้งที่สามค้อน ไม่ข้าม ไม่ซ้ำ
# งาน (duty) ไม่ให้ผลงานเอง งานเกิดซ้ำ 3 เรื่อง (เดินถาม ยืนปากซอย ขนเหล็กลงจากเกวียน) ให้แค่ชื่อเสียงกับ flag และไม่บอกว่าใครเป็นคนรับห่อจากเฮสทัน
# hunted: { royal_institute: 1 } อยู่ในผลของงานที่มีคนของสถาบันเห็นหน้าตัวละคร: ลูกช่างทำถัง (ไฟล์นี้ 2 ผล) หมอตำแย (ไฟล์ ข 1 ผล)

# ---------- ทางเข้า ----------
- id: adult.iron_join_blue_still
  stage: adult
  scene: home
  weight: 5
  time: night
  when:
    age: [25, 50]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [left_the_cold_iron]
  text: |
    หม้อกลั่นในเพิงหลังร้านย้อมผ้าระเบิดตอนยามสาม ห่างจากที่{name}พักอยู่ปีนั้นไปสี่หลังคาเรือน เสียงแรกไม่เหมือนไฟไหม้ เหมือนฝาหม้อใบใหญ่กระแทกเพดาน จากนั้นไฟสีฟ้าก็ไหลออกมาตามรางน้ำ ลุกอยู่บนผิวน้ำได้เหมือนน้ำมัน ไหลไปไกลถึงปากซอย

    รุ่งเช้าบ้านสองหลังข้างเพิงเหลือแต่เสา ครอบครัวช่างย้อมสี่คน ยายขายน้ำมันตะเกียงที่ปากซอยอีกหนึ่ง เจ้าของเพิงไม่มีใครเคยเห็นหน้า ค่าเช่าเพิงจ่ายล่วงหน้าเป็นเหรียญใหม่เอี่ยมทุกเดือน

    สามวันต่อมา ชายคนหนึ่งเดินเข้ามาตามซอย แขนซ้ายตั้งแต่ข้อศอกลงไปเป็นขอเหล็กเปล่า ไม่มีลาย ไม่มีข้อต่อ เขาถามทีละประตูว่าใครเคยเห็นแสงในเพิงตอนกลางคืน ใครเคยเห็นคนแบกขวดเข้าไป ตอบหรือไม่ตอบเขาก็ขอบคุณ ขอบคุณแม้แต่เด็กที่แค่ชี้มือไปทางถนนใหญ่ ประตูที่{name}พักเป็นประตูสุดท้าย เขาบอกว่าชื่อโดเรค แล้วนั่งลงบนขั้นบันไดโดยไม่รอให้ใครเชิญ

    เขาพูดเบาจน{name}ต้องเอนตัวเข้าไปฟัง คนที่ขายของเหลวสีฟ้าให้เพิงนั้นจะไปตั้งหม้อใบใหม่ในซอยอื่น หลังร้านตีเกือกม้าริมทางหลวงมีเตาอยู่เตาหนึ่ง คนที่นั่นทำให้หม้อใบที่สองไม่มีวันได้จุดไฟ ที่นั่นไม่มีใครร่ายเวท ไม่ร่ายแม้แต่เพื่อเรื่องดี ถ้าอยากรู้ชื่อคนที่ซื้อ ให้ไปพรุ่งนี้หลังมืด
  choices:
    - id: go_to_the_forge
      label: ไปที่เตาหลังร้านตีเกือกม้า แล้วสาบาน (จะร่ายเวทไม่ได้อีก)
      text: |
        เตานั้นอยู่ในโรงไม้ลึกเข้าไปหลังร้าน ไฟในเตาเป็นถ่านไม้ล้วน ไม่มีถ่านมารสักก้อน คนสิบกว่าคนนั่งอยู่บนลังกับกองเกือกม้า ส่วนใหญ่ยังใส่เสื้อทำงาน ผู้หญิงที่ยืนหน้าเตาชื่อเกรดิส ตัวเตี้ย ไหล่หนา ฝ่ามือด้านหนาเหมือนพื้นรองเท้า นางยื่นแท่งเหล็กสีเทาด้านไม่มีตราให้{name}กำ บอกให้กำไว้จนมือชา แล้วค่อยพูดตามนาง

        เหล็กเย็นกว่าที่เหล็กควรจะเย็น ความเย็นไต่จากฝ่ามือขึ้นไปถึงศอก ถึงไหล่ {name}พูดตามทีละท่อน ไม่ร่าย ไม่ขอพรจากใคร ไม่ใช้ของที่มีเวท พอวางแท่งเหล็กลง ห้านิ้วยังงอค้างเป็นรูปกำ โดเรคเอาผ้าชุบน้ำอุ่นมาพันให้ แล้วบอกชื่อคนซื้อทั้งสามคน ทีละชื่อ ช้าๆ ให้{name}ทวนตามจนครบ
      effects: { org: { id: cold_iron, join: true }, traits: [oath_cold_iron], mark: สาบานกับภาคีเหล็กเย็น, flags: [swore_after_the_blue_still] }
    - id: give_the_names
      label: บอกโดเรคว่าเคยเห็นใครเดินเข้าออกเพิงนั้นบ้าง
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}นึกออกสองคน คนหนึ่งเป็นคนเข็นรถน้ำแข็งที่มาตอนตีสี่ทุกวันที่สาม อีกคนเป็นหญิงสวมผ้าคลุมไหล่สีเขียวขี้ม้า เดินเร็วเกินกว่าจะเป็นคนในซอย โดเรคฟังจบ ขอบคุณสองครั้ง แล้วลุกจากขั้นบันไดไปโดยไม่จดอะไรไว้เลย

          เจ็ดวันต่อมา วงกบประตูบ้านคนเข็นรถน้ำแข็งมีรอยบากเล็กๆ รอยหนึ่ง สูงระดับไหล่ เนื้อไม้ตรงรอยยังขาว ตั้งแต่วันนั้นแม่บ้านในซอยเลิกซื้อน้ำแข็งจากเขา ไม่มีใครบอกใครว่าเพราะอะไร
        effects: { stats: { WIS: 1 }, flags: [named_the_still_buyers] }
      failure:
        text: |
          {name}บอกไปชื่อเดียว ชายที่ซ่อมหม้อทองเหลืองอยู่ท้ายซอย เพราะเคยเห็นเขาเดินผ่านหน้าเพิงตอนค่ำหลายหน โดเรคขอบคุณ แล้วลุกไป

          เจ็ดวันต่อมาวงกบประตูร้านซ่อมหม้อมีรอยบากระดับไหล่ ภายในเดือนเดียวลูกค้าหายไปครึ่งร้าน ต้นหนาวหม้อกลั่นใบที่สองระเบิดในอีกซอยหนึ่ง คนซ่อมหม้อยังนั่งเคาะหม้ออยู่หน้าร้านทุกวัน หม้อบนโต๊ะเกือบทั้งหมดเป็นหม้อของบ้านตัวเอง ใบที่เหลือเป็นหม้อของ{name} หม้อที่ไม่ได้รั่ว {name}จ่ายค่าซ่อมให้เต็มราคา
        effects: { alignment: { moral: -1 }, gold: -1, flags: [named_the_wrong_neighbour] }
    - id: say_there_is_nothing
      label: บอกว่าไม่เห็นอะไร แล้วปิดประตู
      text: |
        โดเรคขอบคุณเหมือนที่ขอบคุณทุกประตู ลุกจากขั้นบันได เดินออกไปทางปากซอยที่ยังมีรอยไหม้สีฟ้าเป็นทางยาวบนหินปูถนน

        หนาวนั้นเพิงหลังร้านย้อมผ้าสร้างขึ้นใหม่ มีคนมาเช่าต่อ จ่ายล่วงหน้าเป็นเหรียญใหม่เอี่ยม คนในซอยไม่มีใครเคยเห็นหน้าคนนี้เหมือนกัน
      effects: { flags: [shut_the_door_on_dorek] }
    - id: lay_own_tools_down
      label: ห่อเครื่องมือของตัวเองไปวางบนทั่งที่เตา แล้วสาบาน (จะร่ายเวทไม่ได้อีก)
      requires: { flag: unregistered_mage }
      text: |
        {name}ห่อเครื่องมือทุกชิ้นที่ใช้ทำงานแบบไม่มีตราไว้ในผ้าผืนเดียว คืนต่อมาก็เอาไปวางบนทั่งในโรงไม้หลังร้านตีเกือกม้า ต่อหน้าคนสิบกว่าคนที่นั่งอยู่บนลังกับกองเกือกม้า เกรดิส ผู้หญิงที่ยืนหน้าเตา ไม่แกะห่อดู นางยื่นแท่งเหล็กสีเทาด้านไม่มีตราให้กำจนมือชา แล้วให้พูดตามนางทีละท่อน

        พอพูดจบนางถึงแกะผ้า หยิบเครื่องมือขึ้นมาดูทีละชิ้น ดูรอยสึกที่ด้าม แล้ววางคืนลงในผ้าทุกชิ้น นางบอกว่าคนที่เอาของตัวเองมาวางบนทั่งไม่ต้องให้ใครไปเคาะประตู แล้วโยนห่อผ้าเข้าเตาไปทั้งห่อ
      effects: { org: { id: cold_iron, join: true }, traits: [oath_cold_iron], mark: สาบานกับภาคีเหล็กเย็น, stats: { WIS: 1 }, flags: [laid_own_tools_on_the_anvil] }

- id: adult.iron_join_old_soldier
  stage: adult
  scene: smithy
  weight: 14
  when:
    age: [25, 50]
    any_flags: [war_veteran, job_mercenary]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [left_the_cold_iron]
  text: |
    ขบวนเกวียนที่{name}อาศัยไปด้วยหยุดเปลี่ยนเกือกม้าที่ร้านตีเกือกม้าริมทางหลวง ช่างบอกว่าครึ่งชั่วยาม ม้านั่งหน้าร้านมีคนนั่งอยู่ก่อนแล้ว ชายผมสั้นเกรียน แขนซ้ายเป็นขอเหล็กเปล่า เขาใช้ปลายขอจิ้มลูกสาลี่ไว้ แล้วปอกด้วยมีดในมือขวา เปลือกยาวเป็นเส้นเดียวไม่ขาดสักช่วง

    {name}นั่งลงปลายม้านั่ง หลังพิงผนัง หน้าหันออกทางถนน เท้าข้างหนึ่งสอดไว้ใต้ม้านั่งพร้อมลุก ชายคนนั้นปอกสาลี่ต่อจนเสร็จ ผ่าครึ่ง ยื่นซีกหนึ่งมาให้ บอกว่าคนที่เคยยืนแถวนั่งแบบนี้ทุกคน เขาชื่อโดเรค

    เขาเล่าว่าในแถว คนที่ฆ่าคนได้มากที่สุดไม่ใช่คนถือหอก เป็นคนที่ยืนหลังแถว ถือกระดาษแผ่นเดียว อ่านออกเสียงไม่ถึงสามบรรทัด เขาเล่าน้ำเสียงเดียวกับตอนบอกราคาเกือกม้า แล้วบอกว่าหลังร้านนี้มีเตาอีกเตาหนึ่ง คนที่นั่นไม่ขอให้ใครถือหอก ขอแค่ให้ไปยืนที่ปากซอยสักคืน ดูว่ามีใครเดินเข้ามาบ้าง
  choices:
    - id: stand_the_lane
      label: ไปยืนปากซอยให้เขาคืนหนึ่ง แล้วสาบาน (จะร่ายเวทไม่ได้อีก)
      text: |
        ซอยนั้นแคบจนคนสองคนเดินสวนกันต้องเบี่ยงไหล่ {name}ยืนปากซอยตั้งแต่ตะเกียงถนนจุด มือเปล่า โดเรคบอกไว้ว่าไม่ต้องถืออะไร เขาเดินเข้าไปคนเดียว หยุดหน้าบ้านหลังที่สาม คนข้างในไม่เปิดประตู เขาก้มหน้าเข้าไปชิดวงกบอยู่ครู่เดียว แล้วเดินกลับออกมา ขอบคุณ{name}ที่ยืนให้

        คืนนั้นไม่มีใครเดินเข้าซอยเลย ใกล้สาง{name}กำแท่งเหล็กสีเทาด้านในโรงไม้หลังร้าน ต่อหน้าผู้หญิงชื่อเกรดิสกับคนอีกสิบกว่าคน กำจนมือชา แล้วพูดตามนางทีละท่อน คล้ายตอนรับคำสั่งให้เข้าแถวครั้งแรก ต่างกันตรงที่คราวนี้ไม่มีใครตะโกน
      effects: { org: { id: cold_iron, join: true }, traits: [oath_cold_iron], mark: สาบานกับภาคีเหล็กเย็น, stats: { CON: 1 }, flags: [stood_the_lane_for_dorek] }
    - id: ask_about_the_hook
      label: ถามว่าแขนข้างนั้นหายไปที่ไหน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          โดเรคบอกว่าแขนไม่ได้หายที่ไหนพิเศษ หายที่เดียวกับแขนของคนอื่นอีกหลายคน เรื่องที่เขาเล่าคือแขนข้างที่สอง แขนกลทองเหลืองที่ช่างคนแคระทำให้ ข้อนิ้วขยับได้ทีละนิ้ว ใส่อยู่หลายปี ก่อนสาบานเขาถอดมันห่อผ้า เดินทางเก้าวันไปคืนถึงมือคนทำ ช่างคนแคระวางมันลงบนตาชั่ง แล้วคืนเงินให้ครึ่งหนึ่ง

          เขายกขอเหล็กขึ้นให้ดู ไม่มีลาย ไม่มีหมุด ตีจากเหล็กแท่งเดียว เขาบอกว่าเอาไว้แขวนถังน้ำได้ แขวนเสื้อได้ จับมือใครไม่ได้ แล้วหัวเราะอยู่คนเดียว
        effects: { stats: { CHA: 1 }, flags: [heard_of_doreks_brass_arm] }
      failure:
        text: |
          โดเรคก้มลงดูขอเหล็กของตัวเอง แล้วตอบเป็นราคาเปลี่ยนเกือกม้าทั้งขบวน ตัวเลขตรงทุกตัว เขาลุกไปก่อนช่างจะตอกตะปูตัวสุดท้าย สาลี่ซีกที่ยังไม่ได้กินวางทิ้งไว้บนม้านั่ง

          ม้าตัวหนึ่งในขบวนเหยียบตะปูตอนออกจากร้าน ขบวนเลยออกช้าไปอีกครึ่งชั่วยาม คนคุมขบวนเก็บค่าที่นั่งเพิ่มจาก{name}หนึ่งเหรียญ บอกว่าเป็นค่ารอ
        effects: { gold: -1, flags: [asked_dorek_too_soon] }
    - id: leave_the_pear
      label: ลุกไปขึ้นเกวียน ไม่รับสาลี่ซีกนั้น
      text: |
        {name}ลุกขึ้นตอนช่างเรียกว่าเกือกม้าเสร็จแล้ว โดเรคไม่ทักซ้ำ เขากินสาลี่ทั้งสองซีกเอง ทีละคำ ช้าๆ

        ขบวนเกวียนออกไปตามทางหลวง พ้นโค้งแรกแล้วเสียงค้อนจากหลังร้านยังดังตามมา จังหวะช้ากว่าเสียงค้อนตีเกือกม้า เสียงทื่อ ไม่มีกังวานค้าง เป็นเสียงของคนที่ตีเหล็กซึ่งเย็นสนิทแล้ว
      effects: { flags: [left_doreks_pear] }
    - id: tell_him_the_hill
      label: เล่าให้เขาฟังว่าคนถือกระดาษหลังแถวทำอะไรกับแถวของ{name}
      requires: { flag: war_veteran, not_flags: [origin_dwarf_clan] }
      text: |
        {name}เล่าไม่ยาว แถวยืนอยู่บนเนินเถ้า คนของสำนักสงครามยืนหลังแถว อ่านกระดาษจบตอนลมเปลี่ยนทิศ คนในแถวล้มลงทีละคนจากหัวแถวมาจนถึงคนที่ยืนข้าง{name} ไม่มีเลือด ล้มลงเหมือนคนหลับ โดเรคฟังจนจบ ลุกขึ้นปัดเศษสาลี่ออกจากตัก แล้วเดินนำอ้อมไปหลังร้าน

        เกรดิส ผู้หญิงที่ยืนหน้าเตา ยื่นแท่งเหล็กสีเทาด้านให้กำจนมือชา {name}พูดตามนางทีละท่อน พอพูดจบ โดเรคขอบคุณ แล้วบอกว่าขบวนเกวียนออกไปตั้งแต่ครึ่งชั่วยามก่อน คืนนี้นอนบนกองกระสอบข้างเตาได้
      effects: { org: { id: cold_iron, join: true }, traits: [oath_cold_iron], mark: สาบานกับภาคีเหล็กเย็น, stats: { WIS: 1 }, flags: [told_dorek_of_the_hill] }

- id: adult.iron_join_quiet_men
  stage: adult
  scene: tavern
  weight: 20
  when:
    age: [25, 50]
    any_flags: [institute_left, met_the_quiet_men, held_the_cold_tongs, cold_iron_asked_about_you]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [left_the_cold_iron]
  text: |
    ชายสองคนนั่งรออยู่ที่โต๊ะริมประตูโรงเตี๊ยม ไม่ใส่เครื่องแบบของใคร คนหนึ่งวางคีมยาวสีดำด้านไว้ข้างจานขนมปัง อีกคนวางไม้บรรทัดเหล็กที่บากเป็นช่องตลอดความยาว พวงกุญแจที่เอวเขากระทบกันทุกครั้งที่ขยับตัว ดังกริ๊กแต่ไม่กังวาน ทั้งสองลุกขึ้นตอน{name}เดินเข้ามา คนถือไม้บรรทัดเรียกชื่อ{name}ถูกทั้งชื่อ แล้วขอบคุณที่มา {name}แค่มากินข้าว

    เหยือกเหล้าบนโต๊ะเย็นจนมีหยดน้ำเกาะรอบ โต๊ะข้างๆ ว่างทั้งสองฝั่ง

    คนถือไม้บรรทัดพูดช้า เสียงเบาเท่าคนคุยกันในห้องสมุด เขาบอกว่าสถาบันสอนให้คนยกแสงขึ้นมาไว้ที่ปลายนิ้ว แต่ไม่เคยสอนว่าจะวางมันลงที่ไหน คนที่ออกมากลางทางมีสองแบบ แบบหนึ่งยังเก็บแสงไว้ในลิ้นชัก อีกแบบรู้แล้วว่าลิ้นชักนั้นไม่มีกุญแจ เขาไม่ถามว่า{name}เป็นแบบไหน บอกแค่ว่าหลังร้านตีเกือกม้าริมทางหลวงมีเตาอยู่เตาหนึ่ง ที่นั่นมีผู้หญิงคนหนึ่งที่ออกจากสถาบันกลางปีสาม
  choices:
    - id: follow_them_to_the_forge
      label: ตามสองคนนั้นไปที่เตา แล้วสาบาน (จะร่ายเวทไม่ได้อีก)
      text: |
        ผู้หญิงที่ออกจากสถาบันกลางปีสามชื่อเอดริน อายุน้อยกว่าที่{name}คิด นางนั่งอยู่บนลังข้างเตาถ่านไม้ กระดิ่งเหล็กใบเล็กห้อยอยู่ที่สะโพก ข้างในไม่มีลูกตุ้ม นางไม่ถามว่า{name}ออกจากสถาบันเพราะอะไร {name}ก็ไม่ถามนาง

        เกรดิส ผู้เฒ่าของเตา ยื่นแท่งเหล็กสีเทาด้านให้กำ ความเย็นวิ่งขึ้นแขนเร็วกว่าที่{name}คาด แล้วมีอะไรบางอย่างที่ปลายนิ้วดับลง เบาเหมือนไส้ตะเกียงโดนบีบ {name}พูดตามนางทีละท่อนจนจบ ปลายนิ้วทั้งสิบชาไปจนเช้า เอดรินยื่นถ้วยน้ำร้อนมาให้ถือ แล้วกลับไปนั่งที่ลังของนาง
      effects: { org: { id: cold_iron, join: true }, traits: [oath_cold_iron], mark: สาบานกับภาคีเหล็กเย็น, flags: [followed_the_quiet_men] }
    - id: ask_where_the_names_went
      label: ถามว่าคนที่พวกเขาเคยถามหา ตอนนี้อยู่ที่ไหน
      text: |
        คนถือไม้บรรทัดตอบทีละคนตามที่จำได้ ช่างซ่อมโคมย้ายไปอยู่กับลูกสาวที่หมู่บ้านริมแม่น้ำ หญิงที่ต่อกระดูกใต้บันไดเลิกต่อแล้ว ตอนนี้ขายผักดอง เด็กหนุ่มที่ซ่อมกาต้มน้ำ เขาหยุดตรงชื่อนั้น บอกว่าไม่รู้ แล้วขอบคุณ{name}ที่ถาม

        เขาวางเหรียญค่าเหล้าไว้บนโต๊ะ ทั้งสองลุกไปพร้อมกัน คนถือคีมเดินช้ากว่าเพื่อนครึ่งก้าว ปลายคีมแตะวงกบประตูโรงเตี๊ยมตอนเดินผ่าน แตะแค่นั้น เจ้าของโรงเตี๊ยมเห็น เขาเช็ดโต๊ะตัวนั้นซ้ำสามรอบก่อนปิดร้าน
      effects: { flags: [asked_after_the_quiet_mens_names] }
    - id: hold_the_tongs_again
      label: ขอจับคีมดำอีกครั้งก่อนตอบ
      requires: { flag: held_the_cold_tongs }
      check: { stat: CON, dc: 13 }
      success:
        text: |
          คนถือคีมเลื่อนคีมมาให้ ไม่ถามว่าทำไม {name}กำด้ามคีมไว้ ความเย็นเดิมไต่ขึ้นแขน ครั้งนี้{name}ไม่ปล่อย กำไว้จนรอยแดงเก่าที่หายไปนานแล้วขึ้นมาใหม่ตรงเดิม จนนิ้วทั้งห้าเหมือนไม่ใช่ของตัวเอง

          สองคนนั้นรอจน{name}วางคีมลงเอง คืนนั้นที่เตาหลังร้านตีเกือกม้า เกรดิส ผู้เฒ่าของเตา ยื่นแท่งเหล็กสีเทาด้านมาให้ {name}กำไว้ด้วยมือข้างที่ยังชาจากคีม พูดตามนางทีละท่อนจนจบ นางบอกว่ามือที่ชาอยู่แล้วกำได้นานกว่ามือที่ยังอุ่น
        effects: { org: { id: cold_iron, join: true }, traits: [oath_cold_iron], mark: สาบานกับภาคีเหล็กเย็น, stats: { CON: 1 }, flags: [held_the_tongs_until_numb] }
      failure:
        text: |
          {name}กำคีมได้ไม่ถึงสามลมหายใจ มือก็ปล่อยเอง คีมตกกระทบพื้นไม้ดังกว่าเสียงไหนในโรงเตี๊ยม รอยแดงที่ฝ่ามือขึ้นมาใหม่ตรงเดิม ซ้อนรอยเก่า

          คนถือคีมเก็บคีมขึ้นมาเช็ดกับแขนเสื้อ คนถือไม้บรรทัดวางเหรียญค่าเหล้าไว้บนโต๊ะ บอกว่าเตาหลังร้านตีเกือกม้าไม่เคยปิดประตูใส่คนที่มือหายชาแล้ว
        effects: { hp: -1, flags: [dropped_the_cold_tongs] }
    - id: read_the_black_notebook
      label: ถามชายถือไม้บรรทัดว่าสมุดปกหนังดำเล่มนั้นเขียนอะไรถึง{name}ไว้
      requires: { flag: met_the_quiet_men }
      text: |
        เขาหยิบสมุดเล่มเล็กปกหนังดำออกจากอกเสื้อ เปิดไปหน้าที่พับมุมไว้ หมึกจางลงแล้ว ลายมือเล็กเท่ามด ชื่อ{name} ร้านข้าวต้มหัวตลาด แล้วอีกสามคำ ถามสุภาพ ตอบครบ ไม่หนี เขาหันสมุดให้{name}อ่านเอง แล้วรอ

        {name}พลิกไปได้อีกหน้าเดียวก่อนเขาจะดึงคืน หน้านั้นมีเจ็ดชื่อ สี่ชื่อมีเส้นหมึกขีดทับ เส้นเดียว ตรง ไม่มีเส้นไหนเบี้ยวสักเส้น
      effects: { stats: { INT: 1 }, flags: [read_the_quiet_mans_notebook] }

- id: adult.iron_join_charcoal_forge
  stage: adult
  scene: smithy
  weight: 10
  when:
    age: [25, 50]
    any_flags: [job_smith, job_miner, job_docker]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [left_the_cold_iron]
  text: |
    ป้ายไม้หน้าร้านตีเกือกม้าริมทางหลวงเขียนไว้สั้นๆ จ้างคนแบกถ่านหนึ่งวัน สองเหรียญ คนจ้างคือเกรดิส เจ้าของร้าน ผู้หญิงตัวเตี้ยไหล่หนา ฝ่ามือด้านหนาเหมือนพื้นรองเท้า นางพา{name}เดินผ่านเตาหน้าร้าน ลึกเข้าไปถึงโรงไม้หลังร้านที่มีเตาอีกเตาหนึ่ง

    เตาหลังร้านกินแต่ถ่านไม้ เช้านั้นพ่อค้าเอาถ่านมารมาวางขายหน้าร้านสองกระสอบ เกรดิสไม่ซื้อ ให้{name}แบกไปวางคืนไว้ริมถนนให้เขามาเก็บเอง เหล็กที่ตีในเตานี้เป็นแท่งสีเทาด้าน ไม่มีตรา นางเผาจนแดง ตีขึ้นรูป วางพักไว้จนเย็นสนิท จากนั้นชายแขนขอเหล็กคนหนึ่งก็ยกขึ้นวางบนทั่ง ตีซ้ำอีกรอบตอนที่เหล็กเย็นแล้ว เสียงค้อนบนเหล็กเย็นทื่อกว่าเสียงค้อนทุกเสียงที่{name}เคยได้ยิน

    ผนังโรงไม้ด้านหนึ่งติดกับที่ดินว่าง หญ้าขึ้นสูงถึงเอว กลางพงหญ้ามีเสาไม้ดำสองต้น ไหม้ถึงโคน ตอนเย็น ก่อนจ่ายค่าแรง เกรดิสถามว่า{name}เคยถือของที่ทำงานได้เองไหม ของที่ไม่ต้องมีมือคนจับ
  choices:
    - id: grip_the_bar
      label: กำแท่งเหล็กแท่งหนึ่งไว้จนมือชา แล้วสาบาน (จะร่ายเวทไม่ได้อีก)
      text: |
        เกรดิสไม่ถามซ้ำ นางเลือกแท่งที่เย็นสนิทแล้วจากกองข้างทั่ง ยื่นให้ คนในโรงไม้ที่กำลังจะกลับบ้านนั่งลงบนลังอีกครั้ง สิบกว่าคน ส่วนใหญ่ยังไม่ได้ถอดผ้ากันเปื้อน {name}กำเหล็กแท่งนั้นไว้ ฟังนางพูดทีละท่อน พูดตามทีละท่อน ไม่ร่าย ไม่ขอพรจากใคร ไม่ใช้ของที่มีเวท

        นางให้{name}กำต่อจนชาไปถึงข้อศอก แล้วรับแท่งเหล็กคืน นับสองเหรียญใส่มือข้างที่ยังชา ชายแขนขอเหล็กยกแท่งนั้นขึ้นวางบนทั่ง ตีอีกหนึ่งที
      effects: { org: { id: cold_iron, join: true }, traits: [oath_cold_iron], mark: สาบานกับภาคีเหล็กเย็น, gold: 2, stats: { STR: 1 }, flags: [swore_at_the_charcoal_forge] }
    - id: ask_why_strike_cold
      label: ถามว่าทำไมต้องตีเหล็กตอนที่เย็นแล้ว
      check: { stat: INT, dc: 13 }
      success:
        text: |
          เกรดิสอธิบายด้วยมือมากกว่าด้วยปาก ตีตอนแดง เหล็กจำรูป ตีตอนเย็น เหล็กลืมทุกอย่างที่เคยผ่านเข้าไปในเนื้อมัน ไฟ ถ่าน มือคนตี เหล็กที่ลืมหมดแล้วไม่ยอมให้อะไรไหลผ่านอีก นางเคาะแท่งเหล็กกับขอบทั่งให้ฟัง เสียงทื่อ ไม่มีกังวานค้าง

          {name}ถามต่อว่าอะไรที่ไม่ไหลผ่าน นางตอบว่าอะไรก็ตามที่เพื่อนบ้านคนเก่าบนที่ดินว่างข้างโรงไม้เคยกลั่นใส่ขวด แล้วนับค่าแรงสองเหรียญใส่มือ เดินไปปิดประตูเตา
        effects: { stats: { INT: 1 }, gold: 2, flags: [learned_why_iron_is_struck_cold] }
      failure:
        text: |
          {name}ยื่นมือไปจับแท่งที่ชายแขนขอเหล็กเพิ่งวางลง นึกว่าเย็นแล้ว แท่งนั้นยังร้อนพอจะลอกหนังฝ่ามือออกเป็นแผ่น เกรดิสจับข้อมือ{name}กดลงในถังน้ำชุบเหล็กจนพ้นข้อ

          นางไม่ได้ตอบคำถาม ตอนส่งกลับนางนับสองเหรียญใส่มือข้างที่ไม่ได้พันผ้า
        effects: { hp: -2, gold: 2, flags: [burned_at_the_charcoal_forge] }
    - id: take_the_pay
      label: รับค่าแรงสองเหรียญ ตอบว่าไม่เคย แล้วกลับ
      text: |
        เกรดิสนับสองเหรียญใส่มือ ไม่ถามซ้ำ ชายแขนขอเหล็กยกขอขึ้นลา ขอบคุณที่มาแบกถ่าน

        คืนนั้นก่อนนอน ฝุ่นถ่านไม้ยังฝังอยู่ในร่องลายมือทั้งสองข้าง ล้างสามน้ำก็ไม่ออก
      effects: { gold: 2, flags: [carried_charcoal_for_gredis] }
    - id: back_to_charcoal_too
      label: บอกนางว่าเตาของตัวเองก็กลับมาใช้ถ่านไม้แล้ว
      requires: { flag: smith_back_to_charcoal }
      text: |
        เกรดิสถามว่าทำไม {name}เล่าเรื่องลูกมือสองคนที่ต่อยกัน เรื่องค้อนที่ขว้างใส่ผนัง เรื่องรอยบุบที่ยังอยู่บนแผ่นไม้ นางฟังจนจบ แล้วเดินไปหยิบแท่งเหล็กแท่งหนึ่งจากกองข้างทั่ง เลือกนานกว่าที่เลือกแท่งไหนทั้งวัน

        {name}กำแท่งนั้นไว้จนมือชา ต่อหน้าคนสิบกว่าคนที่นั่งบนลัง พูดตามนางทีละท่อน ไม่ร่าย ไม่ขอพร ไม่ใช้ของที่มีเวท พอจบ นางนับสองเหรียญใส่มือ แล้วบอกว่าเตาของ{name}จะได้ลูกค้าจากเตานี้ไปอีกสองราย ราคาถ่านไม้แพงกว่าเดิมเท่าไร เตานี้รู้ดีกว่าใคร
      effects: { org: { id: cold_iron, join: true }, traits: [oath_cold_iron], mark: สาบานกับภาคีเหล็กเย็น, stats: { STR: 1 }, gold: 2, flags: [swore_with_a_charcoal_smith] }

# ---------- งานที่เตาส่ง: งานเกิดซ้ำ ----------
- id: adult.iron_duty_asking_round
  stage: adult
  scene: market
  weight: 20
  once: false
  time: dusk
  duty: cold_iron
  when:
    age: [25, 64]
    org: cold_iron
  text: |
    เตาส่งคนออกไปถามเป็นคู่ ไม่เคยไปคนเดียว คนหนึ่งเคาะประตู อีกคนยืนห่างออกมาสามก้าว ให้คนในบ้านเห็นว่ามือทั้งสองคู่ว่างเปล่า คำถามมีสามข้อ ถามเหมือนกันทุกบ้าน ใครซ่อมของโดยไม่มีตรา ใครรักษาแผลโดยไม่มีใบ ใครเคยเห็นแสงที่ปลายนิ้วของใคร ตอบหรือไม่ตอบก็ขอบคุณ ไม่จดต่อหน้าใคร

    ถนนรอบนี้ยาว ประตูหลายบานไม่เปิด บางบานเปิดก่อนจะทันเคาะ คนที่เปิดก่อนมักมีชื่อเตรียมไว้แล้ว ชื่อเพื่อนบ้านที่ยืมเงินแล้วไม่คืน ชื่อสะใภ้ ชื่อคนที่ปลูกต้นไม้บังแดดหน้าต่าง พอได้ยินว่าเตาไม่จ่ายค่าชื่อ บางคนก็ปิดประตูกลางประโยค
  choices:
    - id: knock_and_ask
      label: เป็นคนเคาะ ถามสามข้อไปจนสุดถนน
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          บ้านหลังที่สามสิบกว่า หญิงแก่คนหนึ่งเปิดประตูแค่คืบเดียว ฟังคำถามจนครบสามข้อ แล้วตอบข้อที่สองเป็นชื่อเดียว ชื่อคนที่รักษาแผลให้หลานนางเมื่อปลายฝน แผลหายในคืนเดียว แต่หลานนางพูดไม่ได้มาตั้งแต่วันนั้น นางไม่ได้โกรธใคร พูดเหมือนบอกทางไปบ่อน้ำ

          ขากลับ{name}จำชื่อนั้นได้ทั้งชื่อ ไม่ต้องทวน คู่ที่เดินด้วยกันรอบนี้ขอบคุณ{name}ตอนแยกกันที่หัวถนน
        effects: { reputation: { cold_iron: 1 }, flags: [brought_back_a_true_name] }
      failure:
        text: |
          บ้านหลังที่สิบเอ็ด ชายคนหนึ่งฟังได้ข้อเดียว แล้วตะโกนเรียกเพื่อนบ้านออกมาดูคนมาถามเรื่องแม่มด กระถางดินจากหน้าต่างชั้นบนตกลงมาเฉียดหัวไหล่ แตกกระจายบนหินปูถนน

          {name}ถามต่อจนสุดถนน ไหล่ข้างนั้นช้ำเป็นสีม่วงอยู่ห้าวัน ชื่อที่ได้กลับมามีสองชื่อ เป็นชื่อสะใภ้ทั้งสองชื่อ
        effects: { hp: -1, flags: [walked_a_hostile_street] }
    - id: stand_and_remember
      label: ยืนห่างสามก้าว จำทุกชื่อที่ได้ยิน ไม่ตัดชื่อไหนทิ้ง
      text: |
        {name}จำได้สิบเจ็ดชื่อ เขียนลงกระดาษให้เตาตามลำดับบ้าน ข้างชื่อเขียนว่าใครให้มา ชื่อสะใภ้อยู่บรรทัดที่สี่ ชื่อคนปลูกต้นไม้บังแดดอยู่บรรทัดที่เก้า ทุกชื่อมีที่ของมันบนกระดาษเท่ากัน

        ที่เตา มีคนอ่านกระดาษแผ่นนั้นทุกบรรทัด ขีดทิ้งสิบห้า เหลือสอง ชื่อสะใภ้ไม่อยู่ในสองชื่อนั้น
      effects: { alignment: { law: 1 }, flags: [wrote_every_name_given] }
    - id: drop_the_spite_names
      label: ตัดชื่อที่ได้มาเพราะความแค้นออกก่อนส่งให้เตา
      requires: { trait: soft_heart }
      text: |
        {name}เขียนแต่ชื่อที่มีคนเห็นด้วยตา ไม่ใช่ชื่อที่มีคนอยากให้เห็น ชื่อสะใภ้ไม่ได้ขึ้นกระดาษ ชื่อคนปลูกต้นไม้ก็ไม่ได้ขึ้น กระดาษแผ่นนั้นเหลือสองบรรทัด

        เตาอ่านสองบรรทัดนั้นแล้ววางไว้บนกองที่ต้องตามต่อ คู่ที่เดินด้วยกันรอบนี้รู้ว่ากระดาษสั้นลงไปเท่าไร เขาไม่บอกใคร แต่รอบหน้าเขาขอเดินคู่กับ{name}อีก
      effects: { reputation: { cold_iron: 1 }, alignment: { moral: 1 }, flags: [kept_spite_off_the_list] }
    - id: stay_by_the_forge
      label: บอกว่าเข่าไม่ดี ขอนั่งเฝ้าเตาแทน
      refuse: true
      text: |
        คนอื่นออกไปถามแทน {name}นั่งเติมถ่านไม้อยู่หน้าเตาจนพวกเขากลับมาตอนดึก กระดาษที่ได้มาวางลงบนโต๊ะ ลายมือไม่ใช่ของ{name}

        เข่าไม่ได้เจ็บ ทุกคนในโรงไม้รู้ ไม่มีใครถาม
      effects: { flags: [sat_out_an_asking_round] }

- id: adult.iron_duty_lane_end
  stage: adult
  weight: 20
  once: false
  time: night
  duty: cold_iron
  when:
    age: [25, 64]
    org: cold_iron
  text: |
    การเคาะครั้งที่สองไม่ใช้เวลานาน คนของเตาสามคนเข้าไปในบ้าน ขนเครื่องมือออกมาวางบนลานหน้าบ้าน หักทีละชิ้นบนขอบบ่อหิน ตำรากับสมุดจดกองรวมกันแล้วจุดไฟ คนในบ้านยืนดูอยู่ที่ประตู ส่วนใหญ่ไม่ร้อง หลายคนหยิบชิ้นที่ซ่อนไว้ออกมาส่งให้เอง ทุกชิ้นที่ได้มา คนของเตาขอบคุณ

    งานของ{name}คืนนี้คือยืนที่ปากซอย ให้คนที่เดินผ่านเห็นว่าซอยนี้มีคนยืนอยู่ ไม่ต้องห้ามใคร ไม่ต้องตอบใคร แสงไฟจากลานหน้าบ้านส่องออกมาถึงปากซอยพอให้คนเดินผ่านเห็นว่าคนที่ยืนอยู่ไม่ได้ถืออะไรเลย
  choices:
    - id: block_the_lane
      label: ยืนขวางกลางปากซอย ให้คนที่จะเข้าเดินอ้อมไปทางอื่น
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          หญิงหิ้วตะกร้าคนหนึ่งหยุดตรงหน้า ชะเง้อดูไฟในซอย ถามว่าเผาอะไร {name}ตอบว่าตำรา นางยืนอีกครู่หนึ่ง แล้วอ้อมไปทางถนนหลังร้านขนม ชายสองคนที่เดินตามหลังนางมาก็อ้อมตาม ไม่มีใครถามข้อที่สอง

          ไฟในลานมอดก่อนเที่ยงคืน คนของเตาเดินออกมาทีละคน คนสุดท้ายแตะไหล่{name}ตอนเดินผ่าน
        effects: { reputation: { cold_iron: 1 }, flags: [held_a_lane_end] }
      failure:
        text: |
          ชายหนุ่มคนหนึ่งวิ่งมาจากถนนใหญ่ ไม่หยุดฟัง เขาเอาไหล่กระแทก{name}เข้ากำแพงแล้ววิ่งเข้าซอยไป ลูกชายของบ้านหลังนั้น ไปถึงลานตอนตำราเล่มสุดท้ายไหม้เหลือแต่สันปก

          เขายืนดูอยู่ข้างกองไฟจนมอด คนของเตาขอบคุณเขาด้วย ตอนเดินออกจากซอย ไหล่ของ{name}ยังปวดตรงที่กระแทกกำแพง
        effects: { hp: -1, flags: [held_a_lane_end] }
    - id: let_them_pass
      label: ไม่ขวางใคร ดูว่าใครเดินเข้าซอยไปบ้าง
      text: |
        คนที่เดินเข้าไปมีคนเดียว หญิงชราใส่ผ้าคลุมไหล่ผืนบาง นางเดินผ่าน{name}ไปโดยไม่หันมาดู ไปยืนข้างกองไฟในลาน ยื่นมือสองข้างออกไปผิงไฟ ผิงอยู่อย่างนั้นจนตำราไหม้หมดทุกเล่ม

        ขากลับนางเดินผ่าน{name}อีกครั้ง บอกว่าคืนนี้หนาว แล้วเดินต่อไป ฝุ่นเถ้าสีเทาเกาะอยู่บนผ้าคลุมไหล่ของนางตลอดทาง
      effects: { reputation: { cold_iron: 1 }, flags: [watched_who_came_to_the_fire] }
    - id: stand_like_a_sentry
      label: ยืนแบบยืนยาม หันหลังให้ไฟ ให้ตาชินกับความมืด
      requires: { any_flags: [war_veteran, job_mercenary] }
      text: |
        คนยืนยามไม่หันหน้าเข้าหาไฟ เพราะหันกลับมาทีไรตาจะบอดไปครึ่งชั่วลมหายใจ {name}ยืนหันหลังให้ลาน หน้าหันออกถนน เห็นคนทุกคนที่ผ่านไปมาก่อนที่พวกเขาจะเห็นไฟ ทุกคนเลี้ยวหลบไปเอง ไม่มีใครต้องขวาง

        ไฟมอดตอนไหน{name}รู้จากกลิ่น ไม่ได้รู้จากแสง คนของเตาเดินออกมาเจอ{name}ยืนท่าเดิม ไม่ขยับมาตั้งแต่หัวค่ำ
      effects: { reputation: { cold_iron: 1 }, flags: [stood_the_lane_like_a_sentry] }
    - id: walk_off_early
      label: เดินออกจากปากซอยก่อนไฟมอด
      refuse: true
      text: |
        {name}เดินออกมาได้สองถนน เสียงไม้แตกในกองไฟยังได้ยินตามหลัง กลิ่นกระดาษไหม้ติดเสื้อไปจนถึงที่พัก

        เช้าวันต่อมา คนของเตาที่ยืนแทนบอกว่าคืนนั้นไม่มีใครเดินเข้าซอยเลย เขาบอกแค่นั้น แล้วไปล้างเขม่าออกจากมือ
      effects: { flags: [left_a_lane_end] }

- id: adult.iron_duty_bar_cart
  stage: adult
  scene: smithy
  weight: 20
  once: false
  time: dusk
  duty: cold_iron
  when:
    age: [25, 64]
    org: cold_iron
  text: |
    เกวียนเหล็กมาปีละสองหน มาตอนพลบ คนขับคนเดิม ล่อสองตัวเดิม ผ้าใบคลุมสีน้ำตาลปะไว้สามแห่ง ใต้ผ้าใบเป็นแท่งเหล็กสีเทาด้านไม่มีตรา มัดเป็นมัดละสิบด้วยลวด ทุกหนเตาเรียกคนไปช่วยขนลง ต้องลงให้หมดก่อนตะเกียงถนนจุด

    เฮสทันมากับเกวียนทุกหน ชายร่างผอมที่ใส่ถุงมือสีเทาไม่ถอดแม้ตอนกินข้าว เขายืนข้างล้อเกวียน นับทุกมัดที่ยกผ่านด้วยการแตะปลายนิ้วถุงมือกับลวดมัด ปากไม่ขยับ ไม่จด นับครบแล้วก็ยื่นห่อผ้าเล็กๆ ห่อหนึ่งเข้าไปในโรงไม้ แล้วขึ้นเกวียนกลับไปทางที่มา เขาไม่เคยค้างคืน
  choices:
    - id: haul_the_bundles
      label: แบกมัดเหล็กลงจากเกวียนให้หมดก่อนตะเกียงจุด
      check: { stat: STR, dc: 12 }
      success:
        text: |
          มัดหนึ่งหนักเท่าเด็กโต {name}แบกลงทีละมัด เดินจากท้ายเกวียนเข้าโรงไม้ วางเรียงกับผนังด้านที่ติดที่ดินว่าง เฮสทันแตะลวดทุกมัดตอนผ่านมือ มัดสุดท้ายลงพื้นพอดีกับตอนคนจุดตะเกียงเดินมาถึงหัวถนน

          เฮสทันแตะลวดมัดสุดท้ายสองครั้งแทนครั้งเดียว คนในเตาที่ขนเหล็กมาหลายหนรู้ว่านั่นคือคำขอบคุณแบบเดียวที่เขามี
        effects: { reputation: { cold_iron: 1 }, flags: [hauled_the_iron_cart] }
      failure:
        text: |
          มัดที่เจ็ดลื่นจากบ่าตอนก้าวลงจากล้อ ปลายแท่งเหล็กลงบนหลังเท้า ไม่หัก แต่บวมจนต้องตัดเชือกรองเท้าออก {name}แบกต่อจนหมดด้วยเท้าข้างเดียว

          เฮสทันนับมัดที่ตกพื้นเหมือนมัดอื่น แตะลวดหนึ่งครั้ง ไม่ถามว่าเจ็บไหม ตอนขึ้นเกวียนเขาวางขวดน้ำมันถูนวดขวดเล็กไว้บนกองกระสอบ ไม่บอกว่าให้ใคร
        effects: { hp: -1, flags: [hauled_the_iron_cart] }
    - id: count_beside_hestan
      label: ไปยืนนับข้างเฮสทัน
      text: |
        เฮสทันไม่ไล่ ไม่ทัก เขานับด้วยปลายนิ้ว {name}นับด้วยปาก ถึงมัดที่สี่สิบ{name}นับได้สี่สิบเอ็ด เขาหันมาครั้งเดียว ชี้มัดที่วางซ้อนอยู่ใต้มัดอื่นจนเห็นลวดแค่ครึ่ง แล้วนับต่อ

        พอครบ เขาบอกตัวเลขหนึ่งตัว เสียงแหบเหมือนคนไม่ได้พูดมาทั้งวัน ตรงกับที่{name}นับได้ตอนท้าย เขาขอบคุณแบบคนบัญชี คือพูดตัวเลขซ้ำอีกครั้ง
      effects: { reputation: { cold_iron: 1 }, flags: [counted_with_hestan] }
    - id: read_the_hammer_marks
      label: ดูรอยค้อนบนแท่งเหล็กทีละแท่งตอนวางเรียง
      requires: { flag: job_smith }
      text: |
        ช่างตีเหล็กดูรอยค้อนออกเหมือนคนอ่านลายมือ แท่งเหล็กทุกแท่งในเกวียนรอบนี้มีรอยค้อนลงด้วยจังหวะเดียวกัน หนักสาม เบาหนึ่ง ทุกแท่ง ทุกมัด มือคนเดียว หรือมือหลายคนที่ฝึกมาจากครูคนเดียวกัน

        {name}วางแท่งสุดท้ายลงโดยไม่ถามใคร คืนนั้นลองตีหนักสามเบาหนึ่งบนทั่งของตัวเอง มือไม่ชิน ต้องนับในใจทุกครั้ง
      effects: { reputation: { cold_iron: 1 }, flags: [read_the_foundry_rhythm] }
    - id: skip_the_cart
      label: ไม่ไปช่วยขนรอบนี้
      refuse: true
      text: |
        เกวียนมาตามเวลา คนในเตาขนกันเองครบโดยไม่มี{name} เสร็จช้ากว่าทุกหน ตะเกียงถนนจุดตอนยังเหลืออีกสามมัด

        เฮสทันนับสามมัดสุดท้ายในแสงตะเกียง นับสองรอบ ปลายนิ้วถุงมือแตะลวดช้ากว่าทุกมัดที่นับมาก่อนหน้า
      effects: { flags: [missed_the_iron_cart] }

# ---------- งานที่เตาส่ง: งานครั้งเดียว ----------
- id: adult.iron_duty_first_knock
  stage: adult
  scene: home
  weight: 20
  time: dusk
  duty: cold_iron
  when:
    age: [25, 64]
    org: cold_iron
  text: |
    ชื่อนี้มาจากรอบเดินถาม แม่ค้าสามคนในถนนเดียวกันให้มาตรงกัน ตาแก่นอร์วัลท้ายถนนพูดอะไรสักอย่างกับก้อนหิน แล้วก้อนหินก็อุ่น การเคาะครั้งแรกเป็นงานของคนคนเดียว เตาให้สิ่วเล่มเล็กติดตัวไปสำหรับรอยนี้โดยเฉพาะ

    {name}ไปถึงตอนพลบ ประตูแง้มไว้ให้ลมเข้า ข้างในเป็นห้องเดียว เมียของนอร์วัลนอนอยู่บนเตียงชิดผนัง ขาข้างหนึ่งไม่ขยับมาหลายหนาวแล้ว นอร์วัลนั่งยองข้างเตาไฟ ถือก้อนหินแม่น้ำกลมๆ ขนาดเท่ากำปั้นไว้ในสองมือ พูดสามคำที่ไม่ใช่ภาษาของถนนนี้ แล้วห่อหินด้วยผ้า สอดเข้าไปใต้ผ้าห่มตรงปลายเท้าเมีย เมียหลับต่อ

    ที่ขอบหน้าต่างมีก้อนหินอีกหกก้อนวางเรียงกันอยู่ ขนาดไม่เท่ากัน สีไม่เหมือนกัน แต่ละก้อนมีเชือกผูกไว้ ปลายเชือกเขียนชื่อคน

    การเคาะครั้งแรกคือรอยบากหนึ่งรอยบนวงกบประตู สูงระดับไหล่ บากแล้วเดินออกมา ไม่ต้องพูดกับใคร
  choices:
    - id: cut_the_notch
      label: บากวงกบตามที่เตาสั่ง แล้วเดินออกมา
      text: |
        สิ่วเข้าเนื้อไม้ง่ายกว่าที่คิด รอยบากยาวเท่าข้อนิ้ว เนื้อไม้ข้างในยังขาว ข้างในห้อง นอร์วัลไม่ได้ยินอะไร

        สองสัปดาห์ต่อมา{name}เดินผ่านถนนนั้นอีก ก้อนหินบนขอบหน้าต่างเหลือก้อนเดียว ก้อนที่ไม่มีเชือกผูก เพื่อนบ้านที่เคยเอาหินมาฝากอุ่นทุกเย็นเลิกมากันหมด นอร์วัลยังนั่งยองอยู่ข้างเตาไฟ ถือก้อนหินก้อนนั้นไว้ในสองมือ
      effects: { alignment: { law: 1 }, flags: [notched_norvals_door] }
    - id: tell_him_first
      label: เคาะประตูก่อน บอกเขาให้รู้ว่ารอยนี้แปลว่าอะไร
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          นอร์วัลฟังจนจบ ถามข้อเดียว ว่าก้อนหินนับด้วยหรือ {name}บอกว่านับ เขาไม่เถียง เขาเดินไปหยิบหินจากใต้ผ้าห่มเมียออกมา วางลงในขี้เถ้าใต้เตาไฟ แล้วนั่งรอ หินที่อุ่นด้วยขี้เถ้าต้องใช้เวลาทั้งหัวค่ำ เขาบอกว่าเขามีเวลาทั้งหัวค่ำ

          {name}บากวงกบตอนเดินออกมา นอร์วัลยืนดูอยู่ที่ประตู ยกมือขึ้นลูบรอยบากครั้งเดียวหลังจาก{name}เดินพ้นไปแล้ว
        effects: { stats: { CHA: 1 }, flags: [warned_norval_before_the_notch] }
      failure:
        text: |
          นอร์วัลฟังได้ครึ่งเดียว แล้วลุกพรวด หินยังอยู่ในมือ เขาตะโกนว่าห้องนี้ไม่มีอะไรให้เตาไหนมาเอา เมียบนเตียงสะดุ้งตื่น ก้อนหินในมือเขาร้อนพอจะพองผิว เขาขว้างมันใส่ เข้ากลางไหล่ของ{name}

          {name}บากวงกบตอนถอยออกมา ไหล่พองเป็นวงเท่าก้อนหินอยู่หลายวัน เพื่อนบ้านสองคนออกมายืนดูที่หน้าประตูตัวเอง จำหน้า{name}ได้ทุกคน
        effects: { hp: -2, flags: [warned_norval_before_the_notch] }
    - id: leave_charcoal_money
      label: บากวงกบ แล้วสอดเงินค่าถ่านไว้ใต้ประตู
      requires: { min_gold: 2 }
      text: |
        {name}บากรอยตามที่สั่ง แล้วห่อสองเหรียญด้วยใบไม้แห้ง สอดเข้าไปใต้ประตู พอให้ซื้อถ่านอุ่นห้องได้ทั้งหนาว คนที่ต้องอุ่นหินด้วยขี้เถ้าต้องใช้ถ่านมากกว่าคนที่พูดสามคำ

        เดือนต่อมาเตาเกือบได้ชื่อนอร์วัลมาอีกรอบ แม่ค้าคนหนึ่งบอกว่าห้องเขามีไฟติดทั้งคืนทุกคืน แต่ไฟที่ติดทั้งคืนเป็นไฟจากถ่าน เตาไม่ได้นับ
      effects: { gold: -2, alignment: { moral: 1 }, stats: { WIS: 1 }, flags: [paid_norvals_charcoal] }
    - id: refuse_the_warm_stone
      label: กลับไปบอกเตาว่าหินอุ่นไม่ใช่งานของเตา
      refuse: true
      text: |
        เตาฟังจนจบ ขอบคุณ{name}ที่พูดออกมา แล้วส่งชื่อนอร์วัลให้คนอื่น

        สัปดาห์ต่อมาวงกบประตูห้องนั้นมีรอยบากอยู่ดี รอยของมือคนอื่น ลึกกว่าที่{name}จะบาก
      effects: { flags: [refused_norvals_notch] }

- id: adult.iron_duty_cooper_son
  stage: adult
  weight: 20
  time: dusk
  duty: cold_iron
  when:
    age: [25, 64]
    org: { id: cold_iron, min_rank: 2 }
  text: |
    {name}เดินผ่านถนนช่างทำถังเป็นรอบที่สามของสัปดาห์ กระดิ่งเหล็กที่สะโพกเริ่มสั่นตอนผ่านบ้านหลังที่เจ็ด สั่นเอง สั่นถี่ จนขอบกระดิ่งกระทบหัวเข็มขัดดังแกร๊ก กระดิ่งไม่มีลูกตุ้ม ไม่บอกว่าของในบ้านเป็นของใคร ไม่บอกว่าดีหรือร้าย บอกแค่ว่ามีอยู่ไม่เกินสิบก้าว

    บ้านหลังที่เจ็ดเป็นของช่างทำถังที่ส่งลูกชายคนเดียวไปเรียนสถาบัน ฤดูนี้ลูกชายกลับมาบ้าน ทูเลน ผอมกว่าตอนไป ใส่เสื้อคลุมขลิบแขนด้วยสีของสำนัก ตอนเย็นเขานั่งหน้าบ้านช่วยพ่อขัดห่วงเหล็กรัดถัง ห่วงที่เขาขัดเสร็จแล้วไม่ขึ้นสนิมอีกเลย ลูกค้าเริ่มสั่งถังจากร้านนี้ร้านเดียวทั้งถนน

    คนถือกระดิ่งเป็นคนเลือกว่าประตูไหนจะได้รอยบาก
  choices:
    - id: notch_the_cooper
      label: บากวงกบบ้านช่างทำถัง
      text: |
        {name}บากรอยตอนตีหนึ่ง ถนนช่างทำถังเงียบจนได้ยินเสียงสิ่วเข้าเนื้อไม้ เช้ามาพ่อของทูเลนเอาหัวแม่มือถูรอยนั้นไปมา เหมือนจะถูให้หายได้ ลูกค้าสองรายแรกของวันเดินผ่านร้านไปซื้อร้านถัดไป

        ทูเลนกลับสถาบันก่อนสิ้นฤดูครึ่งเดือน วันที่เขาออกเดินทาง เขาหยุดตรงหัวถนน หันมาจ้องหน้า{name}ที่ยืนอยู่หน้าร้านขายเชือก จ้องให้จำได้ ห่วงเหล็กที่เขาขัดค้างไว้ขึ้นสนิมภายในสิบวัน
      effects: { alignment: { law: 1 }, hunted: { royal_institute: 1 }, flags: [notched_the_coopers_door] }
    - id: watch_three_evenings
      label: เดินผ่านอีกสามเย็น ดูให้แน่ว่าเขาทำอะไรกับห่วงเหล็ก
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          สามเย็นนั้นทูเลนขัดห่วงเหล็กทุกเย็น ปากขยับนิดเดียวตอนมือลากผ้าครบรอบ ไม่สอนใคร ไม่รับงานใคร ไม่แตะของคนอื่นนอกจากห่วงของพ่อ เย็นที่สาม{name}เห็นเขาเก็บห่วงที่ขัดเสร็จไว้ใต้ม้านั่ง แยกไว้ให้ถังที่พ่อจะขายให้โรงต้มเบียร์ข้างแม่น้ำ ถังที่ต้องแช่น้ำทั้งปี

          {name}กลับไปบอกเตาว่ากระดิ่งสั่นที่บ้านหลังที่เจ็ด ลูกสถาบันกลับบ้าน อีกฤดูก็กลับไป เขียนไว้แค่นั้น ไม่บากประตูไหนรอบนี้ เตาจดชื่อไว้ ไม่ถามต่อ
        effects: { stats: { WIS: 1 }, flags: [let_the_cooper_son_be] }
      failure:
        text: |
          เย็นที่สอง ทูเลนวางห่วงเหล็กลง ลุกเดินตรงมาหา{name}ที่ยืนอยู่หน้าร้านขายเชือก เขาไม่ได้มองหน้า เขาจ้องที่สะโพก กระดิ่งยังสั่นอยู่ใต้ชายเสื้อ เขาถามเสียงเบาว่าเป็นเหล็กเย็นใช่ไหม ที่สถาบันมีรูปวาดในตำราปีหนึ่ง

          {name}เดินจากไปโดยไม่ตอบ ขดเชือกที่ซื้อไว้ทำทีเป็นลูกค้ามาสามเย็นห้อยอยู่บนไหล่ วันต่อมาทูเลนออกเดินทางกลับสถาบันเร็วกว่ากำหนด ในย่ามมีชื่อถนน ชื่อร้านขายเชือก กับหน้าตาของคนที่ยืนอยู่หน้าร้าน
        effects: { hunted: { royal_institute: 1 }, gold: -1, flags: [seen_by_the_cooper_son] }
    - id: step_back_ten_paces
      label: ถอยออกมาสิบก้าว ดูว่ากระดิ่งหยุดสั่นหรือไม่
      requires: { wears_rarity: enchanted }
      text: |
        {name}ถอยออกมาสิบก้าว ยี่สิบก้าว จนพ้นหัวถนน กระดิ่งยังสั่นอยู่ที่สะโพก จังหวะเดิม ไม่ช้าลงสักครั้ง บ้านหลังที่เจ็ดอยู่ไกลเกินสิบก้าวไปนานแล้ว ของที่อยู่ไม่เกินสิบก้าวจากกระดิ่งมีอย่างเดียวที่เดินตามมาด้วยตลอดทาง

        คืนนั้น{name}แขวนกระดิ่งไว้กับตะปูบนผนังอีกฝั่งของห้อง กระดิ่งหยุดสั่น ของอีกอย่างยังอยู่ที่ตัว ไม่มีใครในเตารู้ ประตูบ้านช่างทำถังไม่มีรอยบากในฤดูนั้น
      effects: { alignment: { law: -1 }, flags: [bell_heard_your_own_gear] }
    - id: pass_the_cooper_by
      label: เดินผ่านไป ไม่บากประตูไหนรอบนี้ และไม่บอกเตา
      refuse: true
      text: |
        {name}เดินผ่านถนนช่างทำถังโดยไม่หยุด กระดิ่งสั่นจนพ้นบ้านหลังที่เจ็ดแล้วก็หยุด

        สองสัปดาห์ต่อมาเอดรินถือกระดิ่งเดินผ่านถนนเดียวกัน กระดิ่งของนางเลือกประตูเดียวกัน
      effects: { flags: [passed_the_cooper_by] }

- id: adult.iron_duty_frost_child
  stage: adult
  weight: 20
  duty: cold_iron
  when:
    age: [25, 64]
    org: cold_iron
  text: |
    เอดรินเป็นคนพาชื่อนี้มาเอง นางถือกระดิ่งเดินผ่านลานซักผ้าหลังโรงเลื่อย กระดิ่งสั่นตอนเด็กหญิงคนหนึ่งร้องไห้ ร้องเพราะห่านตัวผู้ไล่จิกน่อง น้ำในกะละมังทุกใบในลานจับเป็นเกล็ดน้ำแข็งบางๆ กลางวันที่แดดร้อนจนผ้าแห้งก่อนจะทันบิด พอเด็กหยุดร้อง น้ำแข็งก็ละลาย

    เด็กชื่อฟิออน ตัวเล็กพอจะมุดใต้ราวตากผ้าได้โดยไม่ต้องก้ม แม่เป็นคนซักผ้า เช่าห้องอยู่หลังลาน พ่อไม่มี เตาสั่งการเคาะครั้งแรก บากวงกบห้องเช่าของแม่ เอดรินขอไม่ไปเอง เด็กจำหน้านางได้แล้ว
  choices:
    - id: notch_the_washroom
      label: บากวงกบห้องเช่าของแม่ตามที่เตาสั่ง
      text: |
        รอยบากอยู่สูงระดับไหล่ผู้ใหญ่ เด็กเอื้อมไม่ถึง แต่แม่เห็นตั้งแต่เช้า นางยืนลูบรอยนั้นอยู่ครู่หนึ่ง แล้วยกกะละมังของตัวเองไปตั้งที่มุมลาน ห่างจากคนอื่น หญิงซักผ้าคนอื่นไม่ต้องขยับหนี

        ฟิออนเล่นอยู่คนเดียวที่มุมลานนั้นทั้งฤดู ไม่มีใครทำให้ร้อง น้ำในกะละมังทุกใบไม่จับเป็นน้ำแข็งอีกเลย
      effects: { alignment: { law: 1 }, flags: [notched_the_washerwomans_door] }
    - id: speak_to_the_mother
      label: เคาะประตูบอกแม่ก่อนว่าเตาเห็นอะไร แล้วค่อยบาก
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          แม่ของฟิออนยืนฟังที่ประตู มือยังเปียกน้ำสบู่ ฟังจนจบแล้วถามว่าต้องทำอย่างไร {name}ไม่รู้คำตอบที่เตาจะยอมรับ เลยบอกเท่าที่รู้ เด็กที่ไม่ร้องไม่ทำให้น้ำแข็ง

          ตั้งแต่วันนั้นนางสอนลูกให้กลั้นหายใจแล้วนับนิ้วเวลาจะร้อง นับให้ครบสองมือก่อน รอยบากขึ้นบนวงกบตอนบ่าย นางยืนดู{name}บากโดยไม่ห้าม แล้วเอาผ้าเปียกเช็ดขี้เลื่อยออกจากรอยให้เอง
        effects: { stats: { CHA: 1 }, flags: [taught_the_mother_to_count] }
      failure:
        text: |
          แม่ของฟิออนฟังได้สองประโยค แล้วคว้าไม้พายซักผ้าที่พิงอยู่ข้างประตู ฟาดลงที่แขน{name}เต็มแรง ไม้พายแตกเป็นสองท่อน นางตะโกนไล่จนทั้งลานหันมาดู

          รอยบากขึ้นบนวงกบตอนดึก{name}ต้องกลับไปบากเองด้วยแขนข้างที่ยังบวม ข้างในห้อง เด็กร้องไห้ทั้งคืน ตอนสาง ขอบหน้าต่างห้องนั้นมีน้ำแข็งเกาะหนาเท่านิ้ว
        effects: { hp: -2, flags: [struck_by_the_washerwoman] }
    - id: buy_the_gander
      label: ซื้อห่านตัวผู้ตัวนั้นจากคนเลี้ยง ส่งให้แม่ต้มกิน แล้วค่อยบาก
      requires: { min_gold: 2 }
      text: |
        คนเลี้ยงห่านขายให้สองเหรียญ แพงกว่าราคาห่านตลาดเกือบเท่าตัว ห่านตัวนั้นจิกเขามาตั้งแต่มันขนยังไม่เต็มตัว เขาว่า {name}หิ้วมันไปส่งที่ประตูห้องเช่า แม่ของฟิออนรับไว้โดยไม่ถามว่าทำไม

        คืนนั้นทั้งห้องมีกลิ่นน้ำแกงห่าน รอยบากขึ้นบนวงกบตอนเด็กหลับแล้ว เช้าวันต่อมาฟิออนออกมาวิ่งเล่นในลานได้ทั้งลาน ไม่มีอะไรไล่จิกน่อง
      effects: { gold: -2, alignment: { moral: 1 }, stats: { CHA: 1 }, flags: [bought_the_biting_gander] }
    - id: refuse_a_childs_door
      label: บอกเตาว่าไม่บากประตูบ้านเด็ก
      refuse: true
      text: |
        โดเรคฟังจนจบ ขอบคุณ{name}ที่พูดออกมาดังๆ เขาบอกว่าทุกเตาควรมีคนที่พูดประโยคนี้ แล้วหยิบสิ่วจากโต๊ะไปเอง

        รอยบากขึ้นบนวงกบห้องเช่าหลังลานซักผ้าในคืนนั้น สูงระดับไหล่ ตรง ลึกเท่ากับรอยทุกรอยที่โดเรคเคยบาก
      effects: { flags: [refused_the_childs_door] }

- id: adult.iron_duty_coal_still_smoke
  stage: adult
  weight: 20
  time: night
  duty: cold_iron
  when:
    age: [25, 64]
    org: cold_iron
  text: |
    รอยบากบนวงกบเพิงหลังโรงฟอกหนังยังไม่ทันเป็นสีเทา เจ้าของเพิงก็ซื้อถ่านมารที่ขโมยจากลานเกวียนมาเพิ่มอีกสองกระสอบ เผาใต้หม้อกลั่นทั้งคืน กลิ่นกำมะถันลอยไปถึงถนนข้างหน้า การเคาะครั้งที่สองจึงมาถึงเร็วกว่าที่เตาตั้งใจ

    คืนที่เตาไป เพิงไม่มีคน เจ้าของหนีไปตั้งแต่เห็นคนของเตาเดินเข้าซอย หม้อทองแดงสูงเท่าคนยังเดือดอยู่บนเตาถ่านมาร ค้อนลงครั้งแรก หม้อแตกตามตะเข็บ ของเหลวข้างในราดลงบนถ่าน ควันสีดำพุ่งขึ้นเต็มเพิง ควันก้อนนั้นไม่ลอยออกทางหลังคา รวมตัวกันอยู่กลางเพิง สูงกว่าคน หลังค่อม ถ่านแดงสองก้อนลอยอยู่ตรงที่ควรจะเป็นตา
  encounter:
    foe: walking_smoke
    name: ควันจากหม้อกลั่น
    morale: 2
    beats:
      - text: ควันเดินเข้าหาคนที่ยืนใกล้ที่สุด คนนั้นคือ{name} ทุกก้าวที่มันขยับ เถ้าบนพื้นเพิงปลิวตามเป็นวง ถังน้ำหล่อเย็นของหม้อกลั่นตั้งอยู่ชิดผนังด้านหลัง
        moves:
          - id: cs_trough
            label: ถีบรางน้ำหล่อเย็นให้คว่ำใส่มัน
            kind: attack
            tags: [water]
          - id: cs_wet_cloth
            label: ชุบผ้าพันคอในถังน้ำ ปิดจมูกปากไว้
            kind: guard
            tags: [water]
          - id: cs_watch_eyes
            label: ดูว่าถ่านสองก้อนนั้นหันตามอะไร
            kind: read
            stat: WIS
            success: ถ่านสองก้อนไม่ได้หันตามคน หันตามไอร้อน ควันเอนไปทางเตาถ่านมารทุกครั้งที่ลมพัด เหมือนคนหนาวเอนเข้าหากองไฟ ถ้าเตาดับ มันก็ไม่มีที่ให้เอน
          - id: cs_out_door
            label: ถอยออกทางประตูเพิง
            kind: flee
      - text: ควันทรุดตัวลงคลุมพื้นทั้งเพิง ไต่ขึ้นมาตามขา กลิ่นเขม่าเข้าจมูกจนตาพร่า คนของเตาอีกสองคนไอจนต้องคุกเข่า
        answer: guard
        moves:
          - id: cs_low_crawl
            label: กลั้นหายใจ ก้มต่ำ คลานไปหาถังน้ำ
            kind: guard
          - id: cs_hack
            label: คว้าขวานผ่าฟืนข้างเตา ฟันผ่ากลางตัวมัน
            kind: attack
            tags: [edge]
          - id: cs_kick_coals
            label: เตะถ่านมารออกจากเตาให้กระจายลงร่องน้ำทิ้ง
            kind: quick
            tags: [water]
          - id: cs_out_door2
            label: ลากคนที่คุกเข่าอยู่ใกล้ที่สุดออกทางประตู
            kind: flee
      - text: ควันลุกขึ้นอีกครั้ง เล็กกว่าเดิม ถ่านสองก้อนที่เป็นตาสว่างขึ้น มันโน้มเข้ามาจะคลุมหน้าของ{name}
        answer: attack
        moves:
          - id: cs_bucket
            label: ยกถังน้ำทั้งถังเทลงตรงถ่านสองก้อนนั้น
            kind: attack
            tags: [water]
            success: น้ำทั้งถังลงตรงกลางหัวของมัน ถ่านสองก้อนร้องเสียงเหมือนเหล็กชุบ ควันหนักขึ้นจนยืนไม่อยู่ ทรุดลงเป็นโคลนเขม่าสีดำแผ่ไปทั่วพื้นเพิง
          - id: cs_wet_sack
            label: เอากระสอบชุบน้ำตบลงไปบนหัวมัน
            kind: attack
            tags: [water]
          - id: cs_brace
            label: เอาผ้าเปียกปิดหน้า ยืนให้มันผ่านไป
            kind: guard
          - id: cs_out_door3
            label: ทิ้งเพิง วิ่งออกไปในซอย
            kind: flee
    win:
      text: |
        พื้นเพิงเหลือแต่โคลนเขม่ากับถ่านสองก้อนที่ดับแล้ว คนของเตาทำงานต่อจนเสร็จ หักท่อทองแดงทุกท่อ เผาสมุดจดสูตรสามเล่มบนลาน เผาเพิงทั้งหลังตอนเกือบสาง

        {name}ไอเป็นเขม่าอยู่สองวัน ชื่อเจ้าของเพิงบนแผ่นเหล็กในสมุดชื่อยังไม่ได้รอยค้อน เขาหนีไปพร้อมสูตรที่อยู่ในหัว
      effects: { stats: { CON: 1 }, flags: [drowned_the_still_smoke] }
    lose:
      text: |
        คนของเตาลาก{name}ออกจากเพิงตอนควันคลุมหน้าไปครึ่งตัว นอนไอเป็นสีดำอยู่ริมซอยจนฟ้าสาง ควันลอยออกไปทางช่องหลังคาเอง ช้าๆ เหมือนเดินออกจากบ้านตัวเอง

        เพิงยังตั้งอยู่ สมุดสูตรไหม้ไปเล่มเดียว อีกสองเล่มไม่มีใครหาเจอ
      effects: { flags: [lost_to_the_still_smoke] }
    stalemate:
      text: |
        ถ่านมารในเตาหมดก่อนที่ใครจะชนะ ควันจางลงทีละน้อยจนเหลือแค่หมอกบางๆ ลอยออกทางช่องหลังคา แผ่ไปทั่วถนนข้างหน้า

        คนในถนนนั้นไอกันทั้งสัปดาห์ ไม่มีใครรู้ว่ามาจากไหน คนของเตาเผาสมุดสูตรได้ครบสามเล่ม
      effects: { flags: [outlasted_the_still_smoke] }
    flee:
      text: |
        {name}พาคนที่ล้มอยู่ออกมาได้หนึ่งคน อีกคนออกมาเอง ทั้งสามนั่งไออยู่ปากซอยจนควันลอยออกจากเพิงไปทางหลังคา ไปลงที่ไหนไม่มีใครเห็น

        เช้ามาเพิงว่างเปล่า สมุดสูตรหายไปทั้งสามเล่ม
      effects: { flags: [fled_the_still_smoke] }
    death:
      text: |
        ควันไม่ได้เข้ามาทางจมูก เข้ามาทางทุกทาง {name}ล้มลงกลางเพิง ฟังเสียงหม้อทองแดงที่แตกแล้วยังเดือดอยู่บนเตา

        คนของเตาลากร่างออกมาได้ตอนควันจางแล้ว ปากกับจมูกของ{name}มีเขม่าดำเป็นคราบ เหมือนคนที่นอนหลับข้างเตาถ่านมารทั้งคืน

- id: adult.iron_duty_wisewomans_son
  stage: adult
  weight: 20
  time: night
  duty: cold_iron
  when:
    age: [25, 64]
    org: { id: cold_iron, max_rank: 2 }
  text: |
    ลูกชายแม่หมอได้รอยบากบนวงกบตั้งแต่ต้นหนาว กลางหนาวได้การเคาะครั้งที่สอง ชามเหล็กใส่ถ่านกับสมุดยาของแม่เขาไหม้อยู่บนลานหน้าบ้านพร้อมกัน เขายืนดูอยู่ที่ประตู ไม่ห้าม ไม่ร้อง ปลายหนาวยุ้งข้าวสองยุ้งของคนที่ชี้บ้านเขาให้เตาเห็นก็ไฟไหม้ คนเฝ้ายุ้งคนหนึ่งไหม้ทั้งแผ่นหลัง ยังไม่ตาย ไม่มีใครเห็นเขาจุดไฟ ไม่มีใครต้องเห็น

    โดเรคถือค้อนเดินนำ {name}เดินตามหลังครึ่งก้าวทางขวา ตามที่เขาบอกไว้ตั้งแต่ที่เตา การเคาะครั้งที่สามไม่มีใครไปคนเดียว และไม่เคาะประตู

    ลูกชายแม่หมอรออยู่กลางลานหน้าบ้าน ชามเหล็กใบใหม่วางอยู่ข้างเท้า ถ่านในชามสว่างขึ้นตามลมหายใจของเขา เขาบอกว่าแม่รักษาคนครึ่งหมู่บ้านด้วยสมุดเล่มที่เผาไป
  encounter:
    foe: ash_cultist
    name: ลูกชายแม่หมอ
    morale: 2
    beats:
      - text: เขาไม่ขยับจากชาม ถามโดเรคว่าเผาสมุดของแม่แล้วยังมาทำไมอีก โดเรคตอบว่ามาขอบคุณที่รอ ถ่านในชามสว่างขึ้นอีกระดับ
        moves:
          - id: ws_trough_water
            label: คว้าถังน้ำข้างบ่อ สาดใส่ชามไฟ
            kind: attack
            tags: [water]
          - id: ws_set_it_down
            label: บอกเขาว่าถ้าวางชามลงตอนนี้ ค้อนจะไม่ยกขึ้นเลย
            kind: talk
            parley: true
          - id: ws_watch_hands
            label: ดูว่าเขาใช้มือข้างไหนเรียกไฟ
            kind: read
            stat: INT
            success: มือขวาประคองชาม มือซ้ายไม่ได้ทำอะไร แต่นิ้วซ้ายขยับตามจังหวะลมหายใจ ไฟในชามขึ้นลงตามนิ้วนั้น ไม่ได้ตามปาก ถ้ามือซ้ายหยุด ไฟก็หยุด
          - id: ws_back_off
            label: ถอยออกไปนอกรั้ว
            kind: flee
      - text: เขาก้มลงเป่าชามทีเดียว ถ่านคุพุ่งออกมาเป็นสาย ตรงมาที่หน้าของ{name} ไม่ใช่ที่โดเรค
        answer: quick
        moves:
          - id: ws_sidestep
            label: เบี่ยงตัวหลบไปทางซ้าย ให้ถ่านคุผ่านไป
            kind: quick
          - id: ws_wet_cloak
            label: ยกเสื้อคลุมที่ชุบน้ำบ่อไว้แล้วขึ้นบัง
            kind: guard
            tags: [water]
          - id: ws_charge
            label: ก้มหน้าพุ่งฝ่าสายถ่านเข้าไป
            kind: attack
          - id: ws_back_off2
            label: กระโดดข้ามรั้วออกไป
            kind: flee
      - text: นิ้วมือซ้ายของเขาเริ่มขยับเร็วขึ้น ปากขยับตามเป็นคำที่ไม่ใช่ภาษาของหมู่บ้าน ไฟในชามลุกสูงเท่าหัวเข่า โดเรคยกค้อนขึ้นช้าๆ รอ
        answer: attack
        moves:
          - id: ws_strike_hand
            label: ฟาดมือซ้ายของเขาก่อนคำสุดท้ายจะจบ
            kind: attack
            tags: [blunt]
            success: ฟาดลงตรงหลังมือซ้ายพอดีกับตอนเขาจะพูดคำสุดท้าย คำนั้นไม่ออกจากปาก ไฟในชามยุบลงเหลือแค่ถ่านแดงธรรมดา เขาก้มลงกุมมือ ปากยังขยับ แต่ไม่มีเสียง
          - id: ws_kick_bowl
            label: เตะชามไฟให้คว่ำลงร่องน้ำข้างลาน
            kind: quick
            tags: [water]
          - id: ws_cover_dorek
            label: ยืนบังหน้าโดเรคไว้ ให้เขาได้จังหวะ
            kind: guard
          - id: ws_back_off3
            label: วิ่งออกจากลาน
            kind: flee
    win:
      text: |
        ลูกชายแม่หมอนั่งพิงบ่อน้ำ กุมมือซ้ายไว้กับอก ชามเหล็กคว่ำอยู่ในร่องน้ำ ถ่านดับหมด โดเรควางหัวค้อนลงบนดิน ขอบคุณเขาที่ไม่หนี แล้วยกค้อนขึ้นอีกครั้ง ลงที่มือข้างเดิม ครั้งเดียว

        ขากลับโดเรคเดินช้ากว่าขามา ที่เตา เขาปลดแผ่นเหล็กแผ่นหนึ่งออกจากห่วง วางบนทั่ง ตอกรอยค้อนลงทับชื่อหนึ่งชื่อ แล้วร้อยแผ่นนั้นกลับเข้าห่วงตามเดิม
      effects: { stats: { STR: 1 }, reputation: { cold_iron: 1 }, flags: [stood_at_the_third_knock] }
    lose:
      text: |
        {name}ล้มลงข้างบ่อ แขนเสื้อไหม้เป็นรูหลายสิบรู ผิวข้างใต้พองเป็นแถบ ตอนลืมตาขึ้น ลานหน้าบ้านว่างเปล่า ชามเหล็กหายไปพร้อมเจ้าของ โดเรคนั่งอยู่ข้างๆ เอาน้ำบ่อราดแผลให้

        ระหว่างทางกลับเขาพูดเรื่องเดียว ว่าครั้งที่สามไม่มีครั้งที่สี่ ชื่อนั้นจะรอบนแผ่นเหล็กจนกว่าจะมีคนไปจบมัน
      effects: { flags: [lost_at_the_third_knock] }
    stalemate:
      text: |
        ถ่านในชามหมดเชื้อก่อนที่ใครจะยอม เขาหอบชามเปล่าวิ่งออกทางหลังบ้าน หายเข้าไปในทุ่งข้าวที่เก็บเกี่ยวแล้ว โดเรคไม่ตาม

        เช้ามาบ้านหลังนั้นว่าง ประตูเปิดทิ้งไว้ มีรอยบากบนวงกบรอยเดียว ชื่อของเขายังไม่ได้รอยค้อน แต่หมู่บ้านนั้นไม่มียุ้งข้าวไหม้อีกตลอดฤดู
      effects: { flags: [drove_off_the_wisewomans_son] }
    flee:
      text: |
        {name}ข้ามรั้วออกมาได้ วิ่งไปหยุดที่ปลายถนน หอบอยู่ในความมืด จากลานหน้าบ้านหลังนั้นมีเสียงหนึ่งดังมาถึง เสียงค้อนลงบนอะไรสักอย่าง ครั้งเดียว

        โดเรคเดินออกมาจากถนนนั้นทีหลัง ค้อนพาดบ่า เขาขอบคุณ{name}ที่มาด้วย แล้วเดินนำกลับเตา
      effects: { flags: [ran_from_the_third_knock] }
    parley:
      text: |
        เขามองชามไฟในมือตัวเอง แล้วมองค้อนของโดเรค แล้วคว่ำชามลงในร่องน้ำเอง ถ่านมารดับเสียงฉ่า ไอสีสนิมลอยขึ้นมาถึงหัวเข่า เขาบอกว่าจะออกจากหมู่บ้านก่อนสาง ไปทางที่ไม่มีใครรู้จักแม่ของเขา

        โดเรคขอบคุณเขา แล้วเดินกลับเตา ค้อนไม่ได้ยกขึ้นเลยทั้งคืน ชื่อนั้นบนแผ่นเหล็กได้รอยค้อนในคืนเดียวกัน รอยเดียวกับชื่ออื่น
      effects: { alignment: { moral: 1 }, flags: [talked_down_the_wisewomans_son] }
    death:
      text: |
        สายถ่านคุสายสุดท้ายลงเต็มอก ร้อนไม่เท่าที่คิด แต่หนัก {name}ทรุดลงข้างบ่อน้ำ เห็นโดเรคยกค้อนขึ้นเหนือหัว ช้ากว่าที่ควรครึ่งจังหวะ

        คืนนั้นเตาหลังร้านตีเกือกม้าไม่มีใครตีเหล็ก โดเรคนั่งข้างทั่งจนสาง ขอบคุณ{name}ออกเสียงครั้งหนึ่ง ในโรงไม้ที่ไม่มีใครตอบ

- id: adult.iron_duty_bone_mender
  stage: adult
  weight: 20
  time: night
  duty: cold_iron
  when:
    age: [25, 64]
    org: cold_iron
  text: |
    ออสเวลต่อกระดูกคนละสามเหรียญ แพงกว่าหมอตำแยห้าเท่า ต่อเสร็จในคืนเดียว คนขาหักเดินออกจากบ้านเขาได้ตอนเช้า ไม่มีใครถามว่าทำไมเร็ว คนที่ถามคือเตา เพราะคนที่ขาหักแล้วเดินได้ในคืนเดียวตาเป็นสีฟ้าซีดอยู่สามวัน และทุกคนพูดถึงเสียงหึ่งในหูที่ไม่ยอมหาย

    รอยบากบนวงกบบ้านเขามีมาตั้งแต่ปลายฝน เขาไม่หยุด แค่ขึ้นราคาเป็นสี่เหรียญ คืนนี้คือการเคาะครั้งที่สอง เครื่องมือกับตำรา {name}กับคนของเตาอีกสองคนเข้าไปถึงห้องหลังบ้าน เขานั่งรออยู่แล้ว หลอดแก้วเล็กๆ เรียงเป็นแถวบนโต๊ะ ข้างในเรืองสีฟ้า เขายิ้ม บอกว่าเขาต่อขาให้คนที่ชี้บ้านเขาให้เตาเมื่อฤดูที่แล้ว ไม่คิดเงิน
  encounter:
    foe: star_listener
    name: ออสเวล หมอต่อกระดูก
    morale: 2
    beats:
      - text: เขาหยิบหลอดแก้วหลอดหนึ่งขึ้นมาหมุนเล่นในมือ ปากขยับฮัมเสียงต่ำๆ เสียงเดียว แสงสีฟ้าในหลอดทุกหลอดบนโต๊ะสว่างขึ้นพร้อมกัน
        moves:
          - id: bm_pan
            label: ตีหม้อเหล็กบนเตาด้วยด้ามสิ่วให้ดังลั่นห้อง
            kind: talk
            tags: [noise]
          - id: bm_sweep
            label: กวาดหลอดแก้วทั้งแถวลงกระสอบก่อนเขาจะหยิบอีก
            kind: quick
          - id: bm_hand_them_over
            label: ถามเขาว่าจะยื่นตำราให้เองไหม
            kind: talk
            parley: true
          - id: bm_read_notes
            label: อ่านใบจดที่ติดผนังว่าเขาต่อขาใครไปบ้าง
            kind: read
            stat: INT
            success: ใบจดเรียงตามวัน ชื่อคน ขาข้างไหน กี่เหรียญ ท้ายแต่ละบรรทัดมีขีดเล็กๆ หนึ่งถึงสามขีด จำนวนวันที่ตาเป็นสีฟ้า ชื่อที่ไม่มีขีดเลยมีสามชื่อ สามชื่อนั้นตายภายในเดือน
      - text: เขาปาหลอดแก้วลงแตกตรงเท้าของ{name} ไอเย็นสีฟ้าพุ่งขึ้นถึงเข่า
        answer: guard
        moves:
          - id: bm_sack_up
            label: ยกกระสอบขึ้นบังหน้า ถอยออกจากไอเย็น
            kind: guard
          - id: bm_jump
            label: กระโดดข้ามไอเย็นเข้าไปถึงตัวเขา
            kind: quick
          - id: bm_shout_count
            label: ตะโกนนับเลขดังๆ ไม่ให้หูได้ยินเสียงอื่น
            kind: guard
            tags: [noise]
      - text: เขาชี้นิ้วขึ้นเพดาน ฮัมเสียงเดียวยาว ฟันของ{name}เริ่มสั่นตามเสียงนั้น คนของเตาอีกสองคนยกมือปิดหู
        answer: talk
        moves:
          - id: bm_bang_table
            label: ทุบโต๊ะด้วยกำปั้นให้เสียงฮัมขาด
            kind: talk
            tags: [noise]
            success: กำปั้นลงกลางโต๊ะ หลอดแก้วที่เหลือกระโดดตกพื้นแตกพร้อมกันหลายหลอด เสียงฮัมขาดกลางลม ออสเวลยกมือปิดหูข้างหนึ่ง รอยยิ้มหายไปจากหน้า
          - id: bm_grab_wrist
            label: คว้าข้อมือข้างที่ชี้ขึ้นเพดานดึงลงมา
            kind: quick
          - id: bm_cover_ears
            label: ปิดหูแล้วเดินเข้าไปหาเขาทีละก้าว
            kind: guard
    win:
      text: |
        คนของเตาหักโครงไม้ดามขาทุกอันบนลานหลังบ้าน เผาตำราสองเล่มกับใบจดบนผนัง หลอดแก้วที่เหลือเทลงหลุมแล้วกลบดิน ออสเวลนั่งดูอยู่บนขั้นบันได มือกุมหูข้างหนึ่งไว้ตลอด

        ฤดูต่อมามีคนขาหักในถนนนั้นอีกสองคน ทั้งสองไปหาหมอตำแยที่ต่อกระดูกด้วยเฝือกไม้ไผ่ คนหนึ่งเดินได้ในเดือนครึ่ง อีกคนเดินกะเผลกไปตลอดชีวิต
      effects: { stats: { WIS: 1 }, flags: [broke_the_bone_menders_frames] }
    lose:
      text: |
        {name}ทรุดลงข้างโต๊ะ หูอื้อ ภาพตรงหน้าเอียงไปข้างหนึ่ง คนของเตาสองคนพยุงออกมานอกบ้าน ตอนหูหายอื้อ ออสเวลไปแล้ว เอาหลอดแก้วไปด้วยครึ่งหนึ่ง

        ตำรากับใบจดยังอยู่ คนของเตาเผาบนลานจนหมดตามที่สั่ง เสียงหึ่งในหูของ{name}หายไปในสามวัน
      effects: { flags: [lost_to_the_bone_mender] }
    stalemate:
      text: |
        ทั้งสองฝ่ายยืนหอบกันคนละฟากห้อง หลอดแก้วบนโต๊ะเหลือสามหลอด ออสเวลเก็บใส่อกเสื้อทั้งสามหลอด แล้วนั่งลงบนเก้าอี้ ยื่นมือให้คนของเตาเอาเครื่องมือไปเอง

        ตำราไหม้บนลานพร้อมโครงไม้ดามขา หลอดสามหลอดในอกเสื้อเขาไม่มีใครกล้าล้วง
      effects: { flags: [left_three_vials_with_the_mender] }
    parley:
      text: |
        ออสเวลวางหลอดแก้วลง เดินไปหยิบตำราสองเล่มจากใต้เตียงมาวางบนโต๊ะเอง แล้วขอเก็บไว้อย่างเดียว เฝือกไม้เก่าอันหนึ่งที่พ่อเขาใช้ต่อกระดูกมาก่อน ไม้ล้วน ไม่มีอะไรเรือง คนของเตาหยิบขึ้นมาดู แล้ววางคืน

        ตำราไหม้บนลาน ออสเวลยืนดูจนจบ ถือเฝือกไม้ของพ่อไว้ในมือ หลังจากนั้นเขาต่อกระดูกคนละเหรียญ ช้า ต้องนอนพักเป็นเดือน คนในถนนบ่นกันทั้งถนน
      effects: { alignment: { moral: 1 }, flags: [left_the_mender_his_fathers_splint] }

- id: adult.iron_duty_beekeepers_house
  stage: adult
  weight: 20
  duty: cold_iron
  when:
    age: [25, 64]
    org: cold_iron
  text: |
    ชื่อของยายเซเวลอยู่บนแผ่นเหล็กแผ่นหนึ่งในสมุดชื่อของเตามาตั้งแต่ปลายฝน การเคาะครั้งแรกบากไว้แล้ว นางตายไปเมื่อกลางหนาว ก่อนครั้งที่สองจะถึง เตาไม่ลบชื่อใคร ชื่อจะจบได้ก็ต่อเมื่อเคาะครบตามที่สั่งไว้ และตำราของนางยังอยู่ในบ้าน

    บ้านของนางอยู่ท้ายทุ่ง หลังคาฟาง รังผึ้งไม้สิบกว่ารังเรียงอยู่ริมรั้ว ไม่มีผึ้งสักตัว ประตูไม่ลงกลอน ข้างในหนาวกว่าข้างนอก ในห้องเดียวของบ้าน ร่างหนึ่งยืนอยู่ข้างหิ้งตำรา ซีด โปร่งจนเห็นหิ้งข้างหลัง ไม่ใช่ยายเซเวล เป็นผู้ชาย ใส่เสื้อแบบที่ไม่มีใครใส่กันแล้ว ร่างนั้นหันมาถามอะไรสักอย่างโดยไม่มีเสียง
  encounter:
    foe: nameless_ghost
    name: ผีในบ้านคนเลี้ยงผึ้ง
    morale: 2
    beats:
      - text: ร่างนั้นเดินเข้ามาช้าๆ มือซีดยื่นออกมาหาหน้าของ{name} ตำราสามเล่มบนหิ้งอยู่ห่างไปห้าก้าว
        moves:
          - id: bk_call_sevel
            label: เรียกชื่อยายเซเวลออกไปดังๆ
            kind: talk
            tags: [name]
          - id: bk_grab_books
            label: เบี่ยงตัวผ่านมันไปคว้าตำราจากหิ้ง
            kind: quick
          - id: bk_follow_finger
            label: ดูว่ามันชี้ไปที่อะไร
            kind: read
            stat: WIS
            success: นิ้วซีดไม่ได้ชี้ตำรา ชี้ผ่านหน้าต่างออกไปที่รังผึ้งริมรั้ว รังไม้ทุกรังมีตัวหนังสือสลักไว้ที่ฝา รังหนึ่งสลักลึกกว่ารังอื่น
      - text: ร่างนั้นหยุดตรงหน้า โน้มหน้าเข้ามาใกล้จนลมหายใจของ{name}เป็นไอขาว ถามคำเดิมอีกครั้งโดยไม่มีเสียง ปากขยับเป็นรูปเดียวซ้ำๆ
        answer: talk
        moves:
          - id: bk_give_a_name
            label: ตั้งชื่อให้มันสักชื่อ ชื่อไหนก็ได้
            kind: talk
            tags: [name]
            parley: true
          - id: bk_read_hives
            label: ออกไปอ่านตัวหนังสือบนฝารังผึ้งรังที่สลักลึกที่สุด
            kind: read
            stat: INT
            tags: [name]
            success: ฝารังผึ้งรังนั้นสลักชื่อผู้ชายชื่อหนึ่ง ตัวอักษรเก่ากว่ารังอื่นมาก ขอบตัวอักษรมนเพราะมือคนลูบ ข้างใต้มีรอยสลักใหม่กว่าอีกบรรทัด ลายมือสั่น ว่ารอก่อน
          - id: bk_stand_still
            label: ยืนนิ่ง ปล่อยให้มันลูบหน้า
            kind: guard
      - text: ร่างนั้นจางลงครึ่งหนึ่ง แต่ไม่ถอย นิ้วซีดลูบไปตามหน้าของ{name}เหมือนคนตาบอดคลำหาตัวอักษร ชื่อคนที่{name}รู้จักเริ่มหายไปจากหัวทีละชื่อ
        answer: talk
        moves:
          - id: bk_call_hive_name
            label: เรียกชื่อที่สลักอยู่บนฝารังผึ้ง
            kind: talk
            tags: [name]
            success: พอชื่อนั้นออกจากปาก ร่างซีดหยุดนิ่ง เอียงหูฟัง แล้วหันไปทางหน้าต่างที่มองเห็นรังผึ้ง ยืนอยู่อย่างนั้นจนจางเหลือแค่ไอเย็นบนกระจก
          - id: bk_burn_now
            label: โยนตำราเข้าเตาไฟตอนนี้เลย ไม่รอ
            kind: quick
          - id: bk_hold_names
            label: ท่องชื่อคนที่รู้จักทุกชื่อ ไม่ยอมให้หายไป
            kind: guard
    win:
      text: |
        ห้องอุ่นขึ้นทีละน้อยจนเหมือนห้องธรรมดา {name}เอาตำราสามเล่มของยายเซเวลไปเผาที่ลานหน้าบ้าน เล่มหนึ่งเป็นสูตรน้ำผึ้งรักษาแผล อีกสองเล่มอ่านไม่ออก

        ที่เตา ชื่อของยายเซเวลได้รอยค้อนทับในคืนนั้น ชื่อผู้ชายบนฝารังผึ้งไม่ได้อยู่บนแผ่นเหล็กแผ่นไหน เตาไม่เคยรู้ว่าบ้านหลังนั้นมีคนสองคน
      effects: { stats: { INT: 1 }, flags: [named_the_beekeepers_ghost] }
    lose:
      text: |
        {name}ตื่นขึ้นนอกรั้วตอนสาย นอนอยู่ข้างรังผึ้งร้าง ชื่อหมู่บ้านที่ตัวเองโตมานึกไม่ออกอยู่สามวัน วันที่สี่ถึงกลับมาทีละพยางค์

        คนของเตาไปเผาตำราแทนในสัปดาห์ต่อมา พวกเขาบอกว่าบ้านหลังนั้นหนาวเหมือนเดิม ไม่มีใครเห็นอะไร
      effects: { flags: [forgot_a_name_at_the_hives] }
    stalemate:
      text: |
        แสงแรกขึ้นทางหน้าต่าง ร่างซีดจางลงจนเหลือแค่ไอเย็นบนกระจก {name}เผาตำราสามเล่มบนลานหน้าบ้าน ชื่อของยายเซเวลได้รอยค้อน

        ห้องนั้นยังหนาวกว่าข้างนอกทุกเช้า คนในหมู่บ้านไม่มีใครย้ายเข้าไปอยู่
      effects: { flags: [burned_the_beekeepers_books] }
    parley:
      text: |
        {name}ตั้งชื่อให้มันชื่อหนึ่ง ชื่อของคนในหมู่บ้านที่ตัวเองโตมา ร่างซีดฟังชื่อนั้นซ้ำสองครั้ง แล้วถอยกลับไปยืนข้างหิ้ง หลีกทางให้หยิบตำรา

        ตำราสามเล่มไหม้บนลานหน้าบ้าน ชื่อของยายเซเวลได้รอยค้อน ฤดูต่อมามีคนในหมู่บ้านเล่าว่าเห็นผู้ชายซีดๆ ยืนอยู่ริมรั้วรังผึ้งตอนพลบ เรียกตัวเองด้วยชื่อหนึ่งที่ไม่ใช่ชื่อคนแถวนั้น
      effects: { alignment: { moral: 1 }, flags: [gave_the_ghost_a_name] }
