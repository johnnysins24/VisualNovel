# เรื่องเติมช่องว่าง วัยผู้ใหญ่ อายุ 19 ถึง 24 เกิดซ้ำได้ (once: false) น้ำหนักต่ำ ถิ่นละเรื่อง กับเรื่องกลางอีกหนึ่งเรื่อง
# ห้ามใช้ {father} {mother} ห้ามพูดถึงเรือเหาะ เพราะไม่มีเงื่อนไขปี
# แดนเถ้าไม่มีต้นไม้ ไอเลธมีทั้งเอลฟ์บนกิ่งและหมู่บ้านมนุษย์ชายป่า

- id: adult.filler_arvel
  stage: adult
  weight: 1
  once: false
  when:
    age: [19, 24]
    location_tag: arvel_village
  text: |
    ฝนแรกของปีตกลงมาตอนบ่าย ตกหนักจนทางเกวียนกลายเป็นคลอง คนทั้งถิ่นวิ่งออกไปยืนตากฝนกลางลาน เด็กถอดเสื้อ คนแก่แหงนหน้า ทุกคนรู้ว่าปีนี้นาจะได้น้ำทันหว่าน

    เกวียนขนข้าวสารของพ่อค้าต่างถิ่นเล่มหนึ่งติดหล่มอยู่ปากทาง ล้อจมโคลนถึงดุม วัวสองตัวดึงไม่ขึ้น
  choices:
    - id: push_cart
      label: ลงไปช่วยเข็นเกวียนขึ้นจากหล่ม
      text: |
        คนหกคนเอาไหล่ดันท้ายเกวียน {name}อยู่ตรงกลาง โคลนกระเด็นขึ้นมาถึงคอ เกวียนขยับทีละคืบ แล้วหลุดขึ้นมาทีเดียวจนทุกคนล้มคว่ำลงไปในโคลน พ่อค้าแจกข้าวสารให้คนละกำ
      effects: { stats: { STR: 1 } }
    - id: stand_in_rain
      label: ยืนตากฝนกลางลานกับคนอื่น
      text: |
        {name}ยืนแหงนหน้าจนฝนเข้าตา คนแก่ข้างๆ บอกว่าฝนแรกที่ตกตอนบ่ายแปลว่าปีนี้ข้าวจะดี ฝนแรกที่ตกตอนเช้าแปลว่าปีนี้จะมีงานแต่งเยอะ {name}ถามว่าใครบอก แกตอบว่ายายของแก
      effects: { stats: { WIS: 1 } }
    - id: sell_planks
      label: ไปขายแผ่นไม้ให้พ่อค้ารองล้อ
      text: |
        แผ่นไม้เก่าหลังบ้านสองแผ่นขายได้ราคาดีกว่าที่ควรเท่าหนึ่ง เพราะพ่อค้าไม่มีทางเลือก เกวียนขึ้นจากหล่มได้บนแผ่นไม้ของ{name}
      effects: { gold: 2 }

- id: adult.filler_ventras
  stage: adult
  scene: star_hall
  weight: 1
  once: false
  when:
    age: [19, 24]
    location_tag: ventras
  text: |
    คืนนั้นหอนับดาวหลวงประกาศตัวเลขใหม่ที่หน้าประตูใหญ่ คนในเมืองไปยืนรอฟังกันแน่นถนน ปีนี้ดาวดวงใหม่เพิ่มขึ้นอีกหลายสิบดวง เสมียนของหออ่านตัวเลขสองรอบ รอบที่สองช้ากว่ารอบแรก

    คนในฝูงคนบางคนปรบมือ เพราะดาวเพิ่มแปลว่าน้ำค้างดาวจะราคาลดลง บางคนเงียบ บางคนแหงนหน้ามองฟ้าแล้วนับเอง
  choices:
    - id: clap
      label: ปรบมือกับคนอื่น
      text: |
        {name}ปรบมือจนฝ่ามือแดง ร้านเหล้าหัวถนนเปิดถังใหม่ฉลองตัวเลข ขายแก้วละครึ่งราคา {name}ดื่มไปสองแก้ว ตื่นมาจำตัวเลขไม่ได้
      effects: { stats: { CHA: 1 } }
    - id: count_yourself
      label: แหงนหน้านับดาวเอง
      text: |
        {name}นับได้ร้อยกว่าดวงก็นับซ้ำ เพราะดาวดวงใหม่สว่างไม่เท่ากัน บางดวงเหมือนกะพริบ ชายแก่ข้างๆ บอกว่าเขานับมาสามสิบปี ทุกปีนับได้มากกว่าตัวเลขของหอ
      effects: { stats: { INT: 1 }, world: { star: 1 } }
    - id: pick_pockets
      label: เดินผ่านฝูงคนที่กำลังแหงนหน้า
      habit: light_fingers
      text: |
        คนที่แหงนหน้ามองฟ้าไม่มีใครมองกระเป๋าตัวเอง {name}เดินผ่านฝูงคนหนึ่งรอบ ออกมาอีกฝั่งถนนพร้อมเหรียญที่ไม่ใช่ของตัวเองสามเหรียญ
      effects: { gold: 3, alignment: { moral: -1, law: -1 } }

- id: adult.filler_hordun
  stage: adult
  weight: 1
  once: false
  when:
    age: [19, 24]
    location_tag: hordun
  text: |
    รถไฟไต่เขาขบวนเช้าหยุดกลางทาง ขั้นบันไดรางที่สามมีหินถล่มลงมาขวาง คนในตู้โดยสารลงมายืนบนราง บางคนบ่น บางคนนั่งกินข้าวห่อ บางคนเริ่มขนหินออกเองโดยไม่รอใคร

    คนขับรถไฟเป็นคนแคระแก่ หนวดถักเป็นสามเปีย เขานั่งสูบกล้องยาอยู่บนหัวรถจักร บอกว่าคนซ่อมทางจะมาถึงตอนบ่าย
  choices:
    - id: move_rocks
      label: ช่วยขนหินออกจากราง
      text: |
        หินก้อนใหญ่ที่สุดต้องใช้คนสี่คน {name}เป็นคนหนึ่งในนั้น ทางโล่งก่อนเที่ยง คนขับรถไฟเคาะกล้องยากับขอบหัวรถจักรสามทีแทนคำขอบใจ แล้วออกรถ
      effects: { stats: { STR: 1 } }
    - id: talk_to_driver
      label: ขึ้นไปนั่งคุยกับคนขับรถไฟบนหัวรถจักร
      text: |
        คนขับรถไฟเล่าว่าเขาขับขบวนนี้มาสี่สิบปี หินถล่มตรงขั้นที่สามทุกปี ราชสำนักส่งคนมาสำรวจทุกปี เขียนรายงานทุกปี ไม่มีใครมาซ่อม เพราะขั้นที่สามอยู่ในแผนที่ของสภาตระกูล ไม่ใช่ของราชสำนัก
      effects: { stats: { INT: 1 } }
    - id: walk_up
      label: เดินขึ้นเขาไปเอง ไม่รอ
      text: |
        ทางเดินเท้าข้างรางชันจนต้องใช้มือช่วย {name}ไปถึงเมืองข้างบนก่อนรถไฟครึ่งชั่วโมง ขาสั่นไปจนค่ำ
      effects: { stats: { CON: 1 } }

- id: adult.filler_ileth
  stage: adult
  weight: 1
  once: false
  when:
    age: [19, 24]
    location_tag: ileth
  text: |
    ลมระหว่างเสาของอุลเวนกับทาลิสเปลี่ยนทิศในคืนเดียว พัดจากใต้ขึ้นเหนือ ฤดูนี้ไม่เคยมีลมแบบนี้มาก่อน ใบไม้ทั้งป่าพลิกหงายด้านขาวขึ้นฟ้า คนแก่บนกิ่งและคนแก่ในหมู่บ้านชายป่าพูดเหมือนกันว่าลมแบบนี้พัดของมาส่ง

    เช้าวันต่อมาพื้นป่ามีของตกอยู่ทั่ว กิ่งไม้หัก รังนก ผ้าที่ปลิวมาจากราวตากของใครสักคน และขนนกสีน้ำเงินที่ไม่มีใครเคยเห็นในป่านี้
  choices:
    - id: gather_branches
      label: เก็บกิ่งไม้ที่หักลงมาไปขาย
      text: |
        กิ่งที่ลมหักลงมาเป็นไม้ที่ป่าให้ ใครเก็บก่อนได้ก่อน {name}เก็บได้เต็มสองหาบ ขายให้ช่างไม้ในหมู่บ้านชายป่า
      effects: { gold: 2 }
    - id: keep_feather
      label: เก็บขนนกสีน้ำเงินไว้
      text: |
        ขนนกยาวเท่าฝ่ามือ สีน้ำเงินเข้มจนเกือบดำเวลาอยู่ในร่ม คนที่อายุมากที่สุดในถิ่นก็บอกไม่ได้ว่าเป็นของนกอะไร {name}เหน็บไว้ที่ผม ทั้งวันมีคนเดินมาถามสามคน
      effects: { stats: { CHA: 1 } }
    - id: return_cloth
      label: เอาผ้าที่ปลิวมาไปถามหาเจ้าของ
      text: |
        ผ้าผืนนั้นเป็นผ้าห่อเด็กของบ้านหนึ่งในหมู่บ้านชายป่า ห่างไปครึ่งวันเดิน แม่ของเด็กรับคืนแล้วยืนกอดผ้าไว้ทั้งที่มันยังเปียก บอกว่าเป็นผืนที่ยายเย็บให้
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 } }

- id: adult.filler_ashland
  stage: adult
  weight: 1
  once: false
  when:
    age: [19, 24]
    location_tag: ashland
  text: |
    พายุเถ้ามาจากทางตอเสา ฟ้าเป็นสีเดียวกับพื้น คนในถิ่นมัดผ้าเปียกปิดจมูก ปิดหน้าต่างด้วยผ้าห่ม แล้วนั่งรอในบ้าน พายุแบบนี้ไม่เคยบอกล่วงหน้าว่าจะอยู่นานแค่ไหน ครั้งที่แล้วนานสามวัน

    บ้านข้างๆ มีแพะสามตัวยังผูกอยู่ข้างนอก เจ้าของออกไปทำงานที่เหมืองตั้งแต่ก่อนพายุมา
  choices:
    - id: bring_goats
      label: ออกไปจูงแพะเข้ามาไว้ในบ้าน
      text: |
        เถ้าเข้าตาตั้งแต่ก้าวแรกที่เปิดประตู {name}คลำหาเชือกผูกแพะจนเจอ จูงเข้ามาในบ้านได้ทั้งสามตัว บ้านเหม็นแพะไปสามวัน เจ้าของกลับมาเอานมแพะมาให้หนึ่งหม้อ
      effects: { stats: { CON: 1 }, alignment: { moral: 1 } }
    - id: tell_stories
      label: นั่งเล่าเรื่องให้เด็กในบ้านฟังจนพายุผ่าน
      text: |
        {name}เล่าเรื่องเดิมซ้ำจนเด็กท่องได้ แล้วเด็กก็เล่ากลับให้ฟังผิดตรงที่ตัวเองชอบ พายุผ่านไปตอนเช้าวันที่สอง เด็กคนเล็กที่สุดหลับไปก่อนเรื่องจบทุกรอบ
      effects: { stats: { CHA: 1 } }
    - id: sweep_roof
      label: ปีนขึ้นไปกวาดเถ้าออกจากหลังคา ก่อนหลังคาจะรับน้ำหนักไม่ไหว
      text: |
        เถ้าบนหลังคาหนาขึ้นทีละนิ้ว {name}กวาดจนแขนล้า กวาดเสร็จก็มีเถ้าใหม่ลงมาแทน แต่ไม้ขื่อไม่หักเหมือนบ้านสองหลังท้ายถิ่น
      effects: { stats: { STR: 1 } }

- id: adult.filler_any
  stage: adult
  weight: 1
  once: false
  when:
    age: [19, 24]
  text: |
    วันพักงานวันหนึ่ง {name}ตื่นเช้ากว่าปกติโดยไม่มีเหตุผล ข้างนอกยังไม่มีใครตื่น ถนนเงียบจนได้ยินเสียงน้ำหยดจากชายคา ทั้งวันว่าง ไม่มีใครต้องการอะไรจาก{name}

    ในกระเป๋ามีเหรียญเหลืออยู่สองเหรียญ
  choices:
    - id: sleep_more
      label: กลับไปนอนต่อจนเที่ยง
      text: |
        {name}นอนต่อจนแดดเข้าหน้าต่าง ตื่นมาตัวเบาเหมือนไม่เคยเหนื่อยมาก่อน วันนั้นไม่ได้ทำอะไรเลย และไม่รู้สึกผิดสักนิด
      effects: { hp: 2 }
    - id: buy_something
      label: ไปตลาด ซื้ออะไรสักอย่างที่ไม่จำเป็น
      requires: { min_gold: 2 }
      text: |
        สองเหรียญซื้อได้ผ้าพันคอสีที่ไม่เข้ากับเสื้อตัวไหน {name}ใส่มันทั้งวัน มีคนชมหนึ่งคน
      effects: { gold: -2, stats: { CHA: 1 } }
    - id: walk_far
      label: เดินไปทางที่ไม่เคยไป
      text: |
        ทางนั้นพาไปถึงลำธารที่{name}ไม่รู้ว่ามีอยู่ ห่างจากที่พักไม่ถึงครึ่งวันเดิน มีหินแบนก้อนหนึ่งพอให้นั่ง {name}นั่งอยู่จนแดดอ่อน แล้วเดินกลับก่อนมืด
      effects: { stats: { CON: 1 } }
