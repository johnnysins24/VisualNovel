# วัยเด็ก ลูกชาวนา บ้านเงาเสา แคว้นอาร์เวล (origin_farm)
# เรื่องที่มีพ่ออยู่ด้วยต้องกัน father_away (พ่อไปรบ) และ father_lost (พ่อไม่กลับ)

- id: childhood.farm_calf
  stage: childhood
  weight: 8
  when:
    age: [3, 5]
    flags: [origin_farm]
    not_flags: [father_away, father_lost]
  text: |
    คืนนั้นแม่วัวจะตกลูก {father}ปลุก{name}ขึ้นมาดู ห่อผ้าห่มให้สองชั้นแล้วอุ้มไปวางบนกองฟางในคอก ตะเกียงแขวนอยู่บนตะปูที่เสา แสงส่ายไปมาทุกครั้งที่วัวขยับ

    ลูกวัวออกมาตอนตีสี่ ตัวเปียก ขายาวเก้งก้างเหมือนขาโต๊ะที่ยังไม่ได้ตอกตะปู แม่วัวเลียตัวให้จนแห้ง แต่ลูกวัวลุกไม่ขึ้น ล้มลงทุกครั้งที่ยันขาหน้า

    {father}นั่งยองๆ ข้างคอก ดึงฟางมาบิดเล่นจนขาดเป็นท่อนๆ แล้วบอกว่าถ้าเช้านี้ยังลุกไม่ได้ ก็คงไม่รอด
  choices:
    - id: hug_calf
      label: มุดลงไปนอนกอดลูกวัวในกองฟาง
      text: |
        {name}มุดลงไปนอนแนบตัวลูกวัว ห่มผ้าห่มคลุมไว้ทั้งสองตัว {father}ไม่ห้าม เขาเอาผ้าห่มของตัวเองมาคลุมทับอีกชั้น แล้วนั่งพิงเสาหลับไป

        ตอนเช้า{name}ตื่นเพราะมีลิ้นสากๆ เลียหน้าอยู่ ลูกวัวยืนได้แล้ว ขายังสั่น แต่ยืนอยู่
      effects: { stats: { CON: 1 }, flags: [farm_calf] }
    - id: name_calf
      label: ตั้งชื่อให้ลูกวัว แล้วเรียกชื่อมันทั้งคืน
      text: |
        {name}ตั้งชื่อให้ลูกวัวว่าเจ้าก้าง {father}บอกว่าอย่าไปตั้งชื่อให้ของที่ยังไม่รู้ว่าจะรอดหรือเปล่า {name}ไม่ฟัง นั่งเรียก เจ้าก้าง เจ้าก้าง อยู่ข้างกองฟาง เรียกไปสัปหงกไป

        ฟ้าสาง ลูกวัวลุกขึ้นยืนแล้วเดินโซเซไปหาแม่ {father}หัวเราะ บอกว่าคงรำคาญจนต้องลุกหนี
      effects: { stats: { CHA: 1 }, flags: [farm_calf] }
    - id: push_calf
      label: ช่วยพ่อดันก้นลูกวัวให้ลุก
      text: |
        {father}ประคองอก {name}ดันก้น ดันจนหน้าแดง ลูกวัวล้มทับ{name}ไปสองรอบ รอบที่สามยืนได้ ยืนอยู่สามอึดใจแล้วเดินไปหาเต้านมแม่เอง

        {father}ปัดฟางออกจากผมลูก บอกว่าแรงดีกว่าพ่อตอนเท่านี้เยอะ
      effects: { stats: { STR: 1 }, flags: [farm_calf] }

- id: childhood.counting_stars
  stage: childhood
  weight: 8
  when:
    age: [5, 9]
    flags: [origin_farm]
    not_flags: [father_away, father_lost]
  text: |
    คืนนั้นฟ้าเปิด {father}ปีนขึ้นไปนั่งบนกองฟางหลังคอก แล้วดึง{name}ขึ้นไปนั่งด้วย ลมพัดกลิ่นฟางมาเป็นระลอก ทางเหนือ เสาของอีเซลพุ่งขึ้นจากขอบฟ้า ยอดหายเข้าไปในความมืด

    {father}ชี้ให้ดูดาวเจ็ดดวงที่ต่อกันเป็นรูปคันไถ ปู่ของ{father}เป็นคนสอน ด้ามไถชี้ไปทางไหน ทางนั้นคือเหนือ หัวไถจมขอบฟ้าเมื่อไร ก็ถึงเวลาหว่าน คนบ้านเงาเสาดูคันไถก่อนดูปฏิทินวิหาร

    "นับดูซิ ครบเจ็ดไหม"

    {name}นับไล่จากปลายด้ามไปถึงหัวไถ ได้แปด นับใหม่ก็ยังได้แปด ดวงที่แปดอยู่ชิดใบไถ เล็กกว่าดวงอื่น ขาวอมฟ้าเหมือนตะเกียงฟ้าในเมืองที่พ่อเคยเล่า ไม่กะพริบเหมือนดวงอื่น และระหว่างที่มองอยู่นั้นเอง แสงของมันก็สว่างขึ้นทีละนิด เหมือนไส้ตะเกียงที่เพิ่งติดไฟ

    {father}เอนหลังลงบนฟาง มือหนุนหัว รอฟังคำตอบ
  choices:
    - id: wake_father
      label: ชี้ดวงที่แปดให้พ่อดู
      text: |
        {father}ลุกขึ้นนั่ง มองตามนิ้วไปครู่หนึ่ง แล้วจับมือ{name}กดลงกับฟาง "อย่าชี้ดาว"

        เขาพูดเบาๆ แต่ไม่ยอมปล่อยมือจนปีนลงจากกองฟาง หลังคืนนั้นก็ไม่ชวนขึ้นไปดูคันไถอีก
      effects: { stats: { WIS: 1 }, flags: [saw_star_born] }
    - id: keep_watching
      label: จ้องดวงนั้นต่อ ดูว่าจะกะพริบไหม
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          ยิ่งจ้อง ดวงนั้นยิ่งไม่เหมือนดาว เหมือนรูที่ใครเอาเข็มเจาะไว้บนผ้าดำ แล้ว{name}ก็รู้ขึ้นมาเฉยๆ ว่าอีกฝั่งของรูมีอะไรมองลงมาเหมือนกัน

          {เขา|เธอ}หลับตาปี๋ แล้วตอบพ่อเสียงดังว่าเจ็ด ครบเจ็ดดวง
        effects: { stats: { WIS: 1 }, flags: [saw_star_born, star_looked_back] }
      failure:
        text: |
          ตื่นมาอีกทีก็สายแล้ว {name}นอนอยู่บนเสื่อในบ้าน จำไม่ได้ว่าลงจากกองฟางมาตอนไหน

          บนหมอนมีเลือดกำเดาแห้งเป็นดวงสีน้ำตาล แต่ยังจำได้แม่นว่าดวงนั้นไม่กะพริบเลยสักครั้ง
        effects: { stats: { INT: 1, CON: -1 }, flags: [saw_star_born, star_looked_back, star_touched] }
    - id: count_it
      label: ตอบพ่อว่าแปด
      text: |
        {father}หัวเราะ บอกว่านับเกินอีกแล้ว แล้วชี้นับให้ดูทีละดวง เสียงดังฟังชัด หนึ่ง สอง สาม จนถึงเจ็ด นิ้วของเขาค้างอยู่ตรงใบไถ แล้วเขาก็นับใหม่อีกรอบ รอบนี้เสียงเบาลง

        ปีต่อมา พอถึงฤดูหว่าน {father}ไม่ได้ขึ้นกองฟางไปดูคันไถ เขาเดินไปถามวันหว่านจากปฏิทินวิหารเหมือนคนเมือง
      effects: { stats: { INT: 1 } }

- id: childhood.farm_survey_chain
  stage: childhood
  weight: 8
  when:
    age: [6, 10]
    flags: [origin_farm]
    not_flags: [father_away, father_lost]
  text: |
    ปลายฤดูเก็บเกี่ยว มีคนแปลกหน้าสามคนเดินมาตามคันนา สวมรองเท้าหนังหุ้มข้อที่ยังไม่เคยเปื้อนโคลน คนหนึ่งแบกขาตั้งไม้สามขา คนหนึ่งลากโซ่เหล็กขดใหญ่ ข้อโซ่ยาวเท่ากันทุกข้อ คนที่สามถือแค่สมุด

    พวกเขาลากโซ่ข้ามนาของ{father} ปักหลักไม้ทาสีแดงไว้เป็นระยะ ไม่ได้ขออนุญาตใคร {father}ยืนดูอยู่ที่หัวคันนา มือกำเคียว แต่ไม่ได้เดินเข้าไป

    ตกเย็นคนในหมู่บ้านไปรวมกันที่โรงสี ได้ความว่าขุนนางเจ้าของที่ดินขายทุ่งฝั่งตะวันออกทั้งผืนให้เจ้าของโรงกลั่นจากเวนทราสไปแล้ว ไม่มีใครรู้ว่าเขาจะเอาไปทำอะไร บางคนว่าจะวางราง บางคนว่าจะตั้งโรงงาน {father}เดินกลับบ้านก่อนคนอื่น ลืมหมวกไว้ที่โรงสี

    เช้าวันรุ่งขึ้น คนลากโซ่เดินผ่านหน้าบ้าน เห็น{name}นั่งอยู่บนรั้ว เลยกวักมือเรียก

    "หนู มาช่วยถือปลายโซ่หน่อย ให้เหรียญหนึ่ง"
  choices:
    - id: hold_chain
      label: รับเหรียญ ไปช่วยถือปลายโซ่
      text: |
        ทั้งวัน{name}เดินถือปลายโซ่ข้ามนาของคนที่รู้จักทุกบ้าน คนลากโซ่สอนให้อ่านตัวเลขบนหลักไม้ สอนให้นับข้อโซ่โดยไม่ต้องก้มดู ป้าบ้านท้ายคลองยืนมองจากหน้าบ้าน ไม่ทักเหมือนทุกวัน

        ตกเย็นได้เหรียญทองแดงหนึ่งเหรียญ {father}เห็นเหรียญในมือลูก ก็พยักพเยิดไปทางครัว บอกว่าเอาไปให้แม่
      effects: { stats: { INT: 1 }, gold: 1, flags: [helped_surveyors] }
    - id: pull_stakes
      label: แอบออกไปถอนหลักแดงตอนกลางคืน
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          คืนนั้น{name}ย่องออกจากบ้านตอนทุกคนหลับ ถอนหลักแดงได้สิบเอ็ดหลัก โยนลงคลองไปทีละหลัก ฟังเสียงน้ำกลืนดังจ๋อมๆ

          เช้าขึ้นคนลากโซ่ด่าลั่นคันนา ต้องวัดใหม่ทั้งแปลง ไม่มีใครในหมู่บ้านบอกว่าใครทำ หลายคนเห็นโคลนติดขากางเกงของ{name} แล้วจู่ๆ ก็ความจำไม่ดีขึ้นมาพร้อมกัน
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [pulled_survey_stakes] }
      failure:
        text: |
          หลักที่สามปักลึกกว่าที่คิด {name}ดึงสุดแรงจนหงายหลังตกคลอง น้ำกระจายดังจนหมาเห่าทั้งหมู่บ้าน

          {father}เป็นคนออกมาดึงลูกขึ้นจากคลอง เขาไม่ถามว่ามาทำอะไร เช้าวันต่อมา เขาเอาหลักนั้นไปปักคืนที่เดิมด้วยมือตัวเอง
        effects: { stats: { WIS: 1 }, alignment: { law: -1 } }
    - id: ask_father
      label: ถามพ่อว่าโซ่นั่นวัดอะไร
      text: |
        {father}เช็ดเคียวกับขากางเกงสองรอบก่อนจะตอบ

        "วัดว่าเราจะอยู่ตรงนี้ได้อีกนานแค่ไหน" เขาว่า แล้วเดินไปผูกวัวต่อ
      effects: { stats: { WIS: 1 }, flags: [knows_land_sold] }

- id: childhood.farm_crossroads
  stage: childhood
  weight: 8
  when:
    age: [7, 11]
    flags: [origin_farm]
  text: |
    ทางสามแพร่งหลังโรงสีเป็นทางลัดไปทุ่งฝั่งเหนือ เด็กบ้านเงาเสารู้กันทุกคนว่าตอนเช้ามืดห้ามเดินทางนั้น ผู้ใหญ่ไม่เคยบอกว่าทำไม บอกแค่ว่าห้าม

    เช้านั้นวัวหลุดคอกตั้งแต่ไก่ยังไม่ขัน {name}ต้องออกไปตาม รอยเท้าวัวมุ่งไปทางสามแพร่ง

    กลางทางแยกมีตะกร้าหวายวางอยู่ ผ้าข้างในขยับนิดหนึ่ง แล้วนิ่ง มีเสียงเหมือนลูกแมวร้อง แต่ไม่ใช่ลูกแมว

    {name}เดินเข้าไปใกล้จนเห็นหน้า ผิวเด็กเขียวคล้ำเพราะความหนาว บนหัวมีตุ่มแข็งสองตุ่ม เล็กเท่าเม็ดถั่ว ข้างตะกร้ามีรอยเท้าผู้ใหญ่เดินกลับไปทางหมู่บ้าน รอยเดียว

    วัวยืนเล็มหญ้าอยู่ห่างออกไปไม่กี่ก้าว ไม่สนใจอะไรทั้งนั้น
  choices:
    - id: carry_to_temple
      label: อุ้มเด็กวิ่งไปวิหารอีเซลที่โคนเสา
      check: { stat: CON, dc: 11 }
      success:
        text: |
          วิหารใหญ่อยู่ที่โคนเสา ห่างไปครึ่งเช้า {name}ซุกเด็กไว้ในเสื้อ วิ่งบ้างเดินบ้าง ไปถึงช่องส่งขนมปังตอนแดดเพิ่งโผล่

          แม่ชีที่เปิดช่องรับเด็กไปโดยไม่ถามสักคำ ถามแค่ว่า{name}กินอะไรมาหรือยัง แล้วยื่นขนมปังค้างคืนออกมาให้หนึ่งก้อน

          กลับถึงบ้านตอนบ่าย โดนตีที่ปล่อยวัวหาย {name}ไม่เล่าว่าไปไหนมา
        effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [saved_crossroads_baby] }
      failure:
        text: |
          {name}วิ่งได้ครึ่งทางขาก็เริ่มสั่น เดินต่อไปได้อีกนิดก็ต้องนั่งพัก เด็กในเสื้อเงียบไปตั้งแต่ตอนนั้น

          ไปถึงช่องส่งขนมปังตอนสาย แม่ชีรับเด็กไปแล้วรีบเข้าไปข้างใน ไม่ได้บอกว่ายังหายใจอยู่หรือเปล่า {name}นั่งรออยู่หน้าช่องจนเที่ยง ไม่มีใครออกมาบอก
        effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [saved_crossroads_baby] }
    - id: tell_mother
      label: วิ่งกลับไปบอกแม่
      text: |
        {mother}ฟังจบก็คว้าผ้าคลุมไหล่ บอกให้{name}อยู่บ้าน ห้ามออกไปไหน

        สายๆ เธอกลับมาโดยไม่มีตะกร้า บอกว่าเอาไปให้วิหารแล้ว {name}มองรองเท้าของแม่ วิหารอยู่ไกลครึ่งเช้า ทางเป็นโคลนตลอดสาย แต่รองเท้าคู่นั้นแห้งสนิท
      effects: { stats: { WIS: 1 }, flags: [told_mother_crossroads] }
    - id: leave_it
      label: ไล่วัวกลับบ้าน ทำเป็นไม่เห็น
      text: |
        {name}ไล่วัวกลับบ้าน ไม่หันไปมอง เสียงเหมือนลูกแมวตามหลังมาอยู่พักหนึ่ง แล้วเงียบไปตอนข้ามสะพาน

        เย็นนั้นมีคนเดินผ่านทางสามแพร่ง แล้วไม่มีใครพูดถึงอะไร {name}ก็ไม่พูด
      effects: { alignment: { moral: -1 }, flags: [left_crossroads_baby] }
