# ชุด ม ชีวิตคนเมือง: สิบสองเรื่องที่ออกได้ในทุกเมือง
# ห้ามเอ่ยชื่อเมือง ย่าน เสาเทพ แม่น้ำ ภูเขา หรือต้นไม้ที่มีชื่อ ต้องอ่านได้ทั้งในเมืองหลวงที่มีตะเกียง ลานประตูของคนแคระ และลานใต้ต้นไม้
# เรื่องที่เกิดซ้ำ (once: false) ไม่ให้ค่าสถานะ และมีตัวเลือกที่เปิดเมื่อเคยเลือกทางหนึ่งมาแล้ว เพื่อให้อ่านรอบสองรอบสามได้ของใหม่

# ---------- 1 คืนแรก ----------
- id: adult.town_first_night
  stage: adult
  weight: 30
  when:
    age: [18, 60]
    city: { native: false, max_years: 1, home: [none] }
    not_flags: [institute_student]
  text: |
    คืนแรกในเมืองนี้ {name}ยังไม่มีหลังคา ของทั้งชีวิตอยู่ในห่อที่สะพายมา หนักกว่าตอนออกจากที่เก่า คนที่มาด้วยกันแยกย้ายไปตั้งแต่ก่อนค่ำ บางคนมีญาติรอ บางคนมีชื่อของใครสักคนเขียนไว้บนเศษกระดาษ

    หน้าต่างตามทางเริ่มมีไฟทีละบาน ทุกบานมีคนอยู่ข้างในแล้ว ร้านค้าลงบานไม้ เด็กที่เล่นตามทางโดนเรียกเข้าบ้านทีละคน จนเหลือแต่{name}กับหมาตัวหนึ่งที่เดินตามมาตั้งแต่หัวถนน

    เชือกของห่อบนบ่าเริ่มกดลงไปในเนื้อ
  choices:
    - id: inn_bed
      label: จ่ายหนึ่งเหรียญค่าฟูกในห้องนอนรวมของคนเดินทาง
      requires: { min_gold: 1 }
      text: |
        ห้องนอนรวมมีฟูกเรียงชิดกันจนต้องนอนตะแคง คนข้างซ้ายกรน คนข้างขวานอนกอดห่อของตัวเองเหมือนกอดลูก {name}ทำแบบเดียวกัน หนุนห่อแทนหมอน

        ตอนสางเจ้าของที่พักต้มน้ำร้อนให้คนละถ้วย ถามทุกคนว่าจะอยู่กี่คืน คนส่วนใหญ่ตอบว่าคืนเดียว แล้วกลับมานอนฟูกเดิมคืนต่อมา
      effects: { gold: -1, flags: [first_night_in_a_shared_room] }
    - id: room_at_once
      label: เคาะประตูบ้านที่แขวนป้ายห้องว่าง ขอเช่าตั้งแต่คืนนี้
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          เจ้าของห้องเปิดประตูแค่คืบ ยกตะเกียงส่องหน้า{name} แล้วส่องห่อของ {name}พูดก่อนเขาจะถาม ว่ามาจากไหน มาทำอะไร และจะจ่ายเมื่อครบรอบสัญญาเหมือนคนอื่น ประตูเปิดกว้างขึ้นทีละนิดตามคำพูด

          ห้องอยู่บนสุดของบันได เตียงไม้ หน้าต่างบานเดียว ขอบหน้าต่างมีตะปูตอกไว้หนึ่งดอก ไม่รู้ว่าคนก่อนแขวนอะไร {name}แขวนห่อของไว้ตรงนั้น
        effects: { stats: { CHA: 1 }, city: { home: room }, flags: [took_a_room_the_first_night] }
      failure:
        text: |
          เจ้าของห้องถามสามข้อ {name}ตอบผิดไปข้อหนึ่ง ไม่รู้ว่าข้อไหน เขาเรียกเงินมัดจำหนึ่งเหรียญที่บ้านอื่นไม่เรียก แล้วจึงยื่นกุญแจให้

          ห้องอยู่บนสุดของบันได เตียงไม้ หน้าต่างบานเดียว ใต้ประตูมีลมลอดเข้ามาตลอดคืน {name}เอาเสื้อตัวที่สองอุดไว้
        effects: { gold: -1, city: { home: room }, flags: [took_a_room_the_first_night] }
    - id: doorway
      label: นั่งพิงประตูร้านที่ปิดแล้ว รอให้สว่าง
      text: |
        ชายคาหน้าร้านยื่นออกมาแค่ศอก กันน้ำค้างได้ครึ่งตัว ตอนดึกหมาตัวนั้นมานอนพิงขา{name} อุ่นข้างเดียว ก้นกับหลังเย็นจนชาก่อนฟ้าสาง

        เจ้าของร้านเปิดประตูออกมาเจอ{name}นั่งอยู่ เขาไม่ได้ไล่ ยื่นขนมปังแข็งให้ครึ่งก้อน แล้วบอกทางไปบ้านที่มีห้องว่างสามหลัง หลังที่สามเขาบอกว่าอย่าไป แต่ไม่ได้บอกว่าทำไม
      effects: { hp: -1, flags: [slept_in_a_doorway_the_first_night] }

# ---------- 2 หาห้อง (ซ้ำได้) ----------
- id: adult.town_rent_a_room
  stage: adult
  weight: 20
  once: false
  scene: home
  when:
    age: [18, 64]
    city: { home: [none], min_years: 1 }
  text: |
    อยู่เมืองนี้มาได้พักหนึ่งแล้ว {name}ยังไม่มีห้องของตัวเอง นอนตามที่ที่มีคนให้นอน ห้องนอนรวม ห้องเก็บของ มุมครัวของคนรู้จัก ของในห่อลดลงทุกครั้งที่ย้าย

    เช้านี้มีคนบอกว่าห้องเหนือร้านซ่อมรองเท้าว่าง คนเช่าเก่าเพิ่งย้ายออก เจ้าของเป็นหญิงแก่ที่ถามคนมาเช่าข้อเดียว ว่าทำงานกลางวันหรือกลางคืน อีกทางหนึ่ง คนงานคนหนึ่งในห้องนอนรวมบอกว่าห้องที่เขาเช่ามีเตียงสองเตียง เตียงหนึ่งว่าง ถ้า{name}จ่ายครึ่ง เขาก็จ่ายครึ่ง

    ห้องเหนือร้านซ่อมรองเท้าจะมีคนเช่าก่อนเที่ยง ห้องแบบนั้นไม่เคยว่างเกินเที่ยง
  choices:
    - id: take_it
      label: ตอบหญิงแก่ตามจริง แล้วรับห้องเหนือร้านซ่อมรองเท้า
      text: |
        หญิงแก่ฟังคำตอบ แล้วบอกว่าคนเช่าเก่าตอบเหมือนกัน ห้องมีกลิ่นหนังกับกาว กลางวันได้ยินเสียงค้อนตอกพื้นรองเท้าจากข้างล่าง ตอกทีละสามที หยุด แล้วตอกอีกสามที

        คนเช่าเก่าลืมของไว้ใต้เตียงหนึ่งชิ้น รองเท้าข้างเดียว เพิ่งเปลี่ยนพื้นใหม่ ยังไม่เคยใส่
      effects: { city: { home: room }, flags: [rented_a_room_of_own] }
    - id: half_a_room
      label: จ่ายครึ่ง นอนเตียงว่างในห้องของคนงานคนนั้น
      text: |
        ห้องมีเตียงสองเตียงหันหัวชนกัน กลางห้องมีเส้นดินขาวขีดไว้บนพื้น ไม่มีใครบอกว่าใครขีด คนร่วมห้องออกไปทำงานก่อนสาง กลับมาหลังมืด {name}รู้จักเขาจากเสียงรองเท้าบนบันไดกับกลิ่นสบู่มากกว่าจากหน้า

        ครบรอบสัญญาแรก เขาวางส่วนของเขาไว้บนเส้นดินขาวก่อน{name}ตื่น นับแล้วครบ
      effects: { city: { home: room }, flags: [shares_half_a_room] }
    - id: half_a_room_again
      label: ถามคนงานก่อนว่าเขาทำกะไหน แล้วค่อยตกลงแบ่งห้อง
      requires: { flag: shares_half_a_room }
      text: |
        ครั้งก่อนที่แบ่งห้อง เตียงแคบไม่เคยทำให้{name}นอนไม่หลับ คนที่เปิดประตูเข้ามาตอน{name}เพิ่งหลับต่างหาก คราวนี้{name}ถามเรื่องกะก่อนเรื่องราคา คนงานคนนั้นทำกะกลางวัน {name}ไม่เอา แล้วถามต่อจนเจอคนที่ทำกะกลางคืน

        ห้องของเขามีหน้าต่างหันไปทางตะวันออก กลางวันแดดเข้าเต็มห้อง กลางคืนห้องว่าง เตียงสองเตียงในห้องนั้นไม่เคยมีคนนอนพร้อมกัน
      effects: { city: { home: room }, flags: [shares_half_a_room, asked_about_the_shift_first] }
    - id: go_without
      label: บอกทั้งสองทางว่ายังไม่เอา เก็บเงินไว้อีกหน่อย
      text: |
        คืนนั้น{name}นอนห้องนอนรวมเหมือนเดิม ฟูกเดิม ข้างคนกรนคนเดิม ห้องเหนือร้านซ่อมรองเท้ามีคนเช่าก่อนเที่ยงอย่างที่ว่า

        เงินในห่อเท่าเดิม ห่อเบาลงอีกนิด ของชิ้นหนึ่งหายไปตอนย้ายฟูกเมื่อคืน {name}ไม่รู้ว่าชิ้นไหน จนวันที่ต้องใช้
      effects: { flags: [went_on_without_a_room] }

# ---------- 3 ค้างค่าเช่า (ซ้ำได้) ----------
- id: adult.town_rent_behind
  stage: adult
  weight: 40
  once: false
  scene: home
  when:
    age: [18, 80]
    city: { home: [room], behind: true }
  text: |
    ครบรอบสัญญาผ่านมาแล้ว และถุงเงินของ{name}ว่างวันนั้นพอดี เจ้าของห้องไม่ได้ทวง ไม่ได้เคาะประตู แค่เขียนเลขห้องของ{name}ไว้บนกระดานข้างบันได ต่อจากเลขห้องอื่นอีกสองห้อง ทุกคนที่ขึ้นลงบันไดเห็น

    ธรรมเนียมเช่าห้องเหมือนกันทุกที่ ค้างหนึ่งรอบ เจ้าของห้องรอ ค้างรอบที่สอง กุญแจต้องกลับไปแขวนที่ตะปูหน้าห้องเขา เช้านี้เจ้าของห้องยืนเช็ดบันไดอยู่ตรงขั้นที่{name}ต้องผ่าน
  choices:
    - id: pay_late
      label: วางเหรียญที่ค้างไว้บนขั้นบันไดข้างผ้าเช็ด
      requires: { min_gold: 1 }
      text: |
        เจ้าของห้องหยิบเหรียญขึ้นมากัดดูก่อนเก็บ แล้วเอาผ้าผืนที่ถืออยู่เช็ดเลขห้องของ{name}ออกจากกระดาน สัญญาใหม่เริ่มวันนั้น

        เลขอีกสองห้องยังอยู่บนกระดาน เลขหนึ่งอยู่มานานจนดินขาวซีดจนเกือบมองไม่ออก
      effects: { gold: -1, city: { home: room }, flags: [paid_the_rent_late] }
    - id: work_it_off
      label: ขอทำงานให้เจ้าของห้องแทนค่าเช่า
      check: { stat: STR, dc: 12 }
      success:
        text: |
          เจ้าของห้องมีงานที่เลื่อนมาทั้งปี ขนของเก่าลงจากใต้หลังคา หีบ เก้าอี้หัก ม้วนพรมที่หนูกัด {name}ทำสามวันจนเสร็จ ใต้หลังคาว่างจนเห็นแสงลอดกระเบื้อง

          เจ้าของห้องเช็ดเลขห้องของ{name}ออกจากกระดาน แล้วเขียนสัญญาใหม่ลงสมุดด้วยลายมือที่ไม่ได้ตั้งใจให้ใครอ่านออก
        effects: { city: { home: room }, flags: [worked_off_the_rent] }
      failure:
        text: |
          หีบใบสุดท้ายหนักกว่าที่คิด หลุดมือตอนลงบันไดขั้นที่สาม ไหล่ของ{name}เคล็ดตามหีบไป ฝาหีบแตก ข้างในเป็นจานกระเบื้องห่อผ้าทีละใบ ไม่แตกสักใบ

          เจ้าของห้องเก็บจานกลับขึ้นไปเอง ไม่ได้ว่าอะไร เลขห้องของ{name}ยังอยู่บนกระดาน
        effects: { hp: -1, flags: [dropped_the_landlords_box] }
    - id: the_job_nobody_wants
      label: ถามหางานที่เจ้าของห้องไม่อยากทำเอง แล้วขอทำงานนั้น
      requires: { flag: worked_off_the_rent }
      text: |
        งานแลกค่าเช่าครั้งก่อนสอน{name}ไว้อย่างหนึ่ง เจ้าของห้องทุกคนมีงานที่เลื่อนไว้เพราะไม่อยากแตะ งานนั้นไม่หนัก แค่สกปรก คราวนี้{name}ถามหางานนั้นตรงๆ ได้ร่องส้วมหลังบ้านที่อุดมาตั้งแต่หน้าฝน

        เจ้าของห้องให้ถังกับพลั่ว ยืนดูจากหัวบันไดครู่เดียวแล้วกลับเข้าห้อง ตกเย็นเลขห้องของ{name}หายจากกระดาน กลิ่นติดมือ{name}อยู่อีกสามวัน
      effects: { hp: -1, city: { home: room }, flags: [worked_off_the_rent, did_the_landlords_dirty_job] }
    - id: give_the_key_back
      label: แขวนกุญแจคืนก่อนจะต้องคืน แล้วหิ้วห่อออกไป
      text: |
        {name}แขวนกุญแจไว้ที่ตะปูหน้าห้องเจ้าของก่อนเขาตื่น ห่อของบนบ่าหนักพอๆ กับวันที่มาถึง บนบันไดไม่มีใครเห็น

        สายวันนั้นเลขห้องของ{name}หายจากกระดาน ป้ายห้องว่างแขวนขึ้นแทนที่หน้าต่างชั้นบน
      effects: { city: { home: none }, flags: [gave_the_key_back_early] }

# ---------- 4 ขึ้นเป็นชาวย่าน ----------
- id: adult.town_rise_local
  stage: adult
  weight: 900
  must: true
  scene: home
  mark: เป็นชาวย่าน
  when:
    age: [19, 95]
    city: { ready: true, max_rank: 1, home: [room, house, shop] }
    not_flags: [institute_student]
  text: |
    หญิงห้องข้างๆ เคาะประตูตอนเช้าตรู่ ไม่ได้มายืมเกลือ นางต้องไปต่างถิ่นสามวัน ไปดูแลแม่ที่ป่วย นางยื่นกุญแจสำรองที่ผูกเชือกแดงให้{name} บอกว่ารดน้ำกระถางผักหน้าหน้าต่างด้วย ให้ข้าวแมวด้วย ถ้าลูกชายคนเล็กกลับจากที่ทำงานเร็วก็ดูไว้ให้ด้วย

    ตอนบ่ายคนเก็บเงินของถนนมาถึงประตู ปีนี้ถนนต้องเปลี่ยนรางน้ำ แบ่งกันจ่ายทุกห้อง ในบัญชีของเขามีเลขห้องของ{name}อยู่แล้ว เขียนไว้ระหว่างห้องข้างบนกับห้องข้างล่าง ไม่ได้อยู่ท้ายบัญชีเหมือนปีก่อน

    คนในถนนเรียก{name}ว่าคนมาใหม่มาตั้งแต่วันแรก วันนี้ไม่มีใครเรียกแบบนั้นแล้ว ไม่มีใครบอกว่าเลิกเรียกตั้งแต่เมื่อไร
  choices:
    - id: keep_the_spare_key
      label: แขวนกุญแจเชือกแดงไว้ข้างกุญแจของตัวเอง
      text: |
        สามวันนั้น{name}รดน้ำกระถางผักเช้าเย็น แมวของนางกินข้าวแล้วมานอนหน้าห้อง{name}แทนห้องตัวเอง วันที่สามนางกลับมาตอนค่ำ ขอบใจแล้วเข้าห้อง ไม่ได้ขอกุญแจคืน

        กุญแจเชือกแดงแขวนอยู่ข้างกุญแจของ{name}ต่อไป ทุกครั้งที่ปิดประตู กุญแจสองดอกกระทบกันเสียงเดียว
      effects: { city: { promote: true }, flags: [holds_a_neighbours_spare_key] }
    - id: sign_the_streets_bill
      label: จ่ายส่วนค่ารางน้ำ แล้วลงชื่อในบัญชีของถนนด้วยมือตัวเอง
      requires: { min_gold: 1 }
      text: |
        คนเก็บเงินยื่นปากกาให้ ไม่ได้ยื่นหมึกให้กดนิ้วเหมือนที่ยื่นให้คนที่เขียนไม่ได้ {name}ลงชื่อเต็ม ตัวใหญ่กว่าชื่อข้างบนกับข้างล่าง

        ปลายเดือนรางน้ำของถนนเปลี่ยนใหม่ ช่วงหน้าห้องของ{name}ตอกตะปูแน่นกว่าช่วงอื่น เพราะ{name}ยืนดูช่างตอกอยู่ทั้งบ่าย
      effects: { gold: -1, city: { promote: true }, flags: [signed_the_streets_bill] }
    - id: mind_the_boy
      label: รับดูลูกชายคนเล็กของนางทั้งสามวัน
      text: |
        ลูกชายคนเล็กของนางไม่เล็กแล้ว สูงถึงไหล่{name} กลับจากที่ทำงานตั้งแต่บ่ายทุกวัน แล้วนั่งรอบนบันไดหน้าห้อง{name}โดยไม่เคาะ {name}เปิดประตูให้ ทอดไข่ให้กิน สองวันแรกเขากินแล้วกลับห้อง

        วันที่สามเขาเล่าเรื่องที่ทำงานให้ฟัง นายจ้างของเขาหักค่าแรงทุกครั้งที่เขาทำของแตก เดือนนี้หักไปจนเหลือครึ่ง เขาขอให้{name}อย่าบอกแม่ {name}ไม่ได้บอก
      effects: { alignment: { moral: 1 }, city: { promote: true }, flags: [minded_a_neighbours_child] }

# ---------- 5 ขึ้นเป็นคนมีหน้ามีตา ----------
- id: adult.town_rise_notable
  stage: adult
  weight: 900
  must: true
  mark: เป็นคนมีหน้ามีตา
  when:
    age: [24, 95]
    city: { ready: true, min_rank: 2, max_rank: 2, home: [family, room, house, shop] }
    not_flags: [institute_student]
  text: |
    เรื่องเริ่มจากคนขายผักหัวถนน เขาจะขึ้นราคาหัวหอม ก่อนจะเขียนราคาใหม่ลงกระดาน เขาเดินมาถาม{name}ว่าขึ้นเท่านี้คนจะว่าอะไรไหม ลานตักน้ำของถนน คนที่ยืนรอเงียบลงตอน{name}เดินมาถึง แล้วถามความเห็นเรื่องที่เถียงกันค้างไว้

    วันที่สาม หญิงม่ายห้องข้างล่างถือกล่องไม้มาวางหน้าประตู{name} ในกล่องเป็นเครื่องมือช่างไม้ของสามีนาง สิ่ว กบ เลื่อย ขวานด้ามสั้น มีคนแปลกหน้ามาขอซื้อทั้งกล่องในราคาที่นางไม่รู้ว่าดีหรือไม่ดี นางจะไม่ตอบเขาจนกว่า{name}จะตอบนาง

    {name}เป็นชาวย่านมาหลายปี ฟังคนอื่นตัดสินใจมาตลอด ปีนี้คนถาม{name}ก่อนแล้วค่อยตัดสินใจ
  choices:
    - id: name_the_price
      label: เปิดกล่องดูเครื่องมือทีละชิ้น แล้วบอกนางว่าควรได้เท่าไร
      text: |
        {name}ไล่ดูทีละชั้น ลูบคมสิ่ว ส่องกบกับแสงหน้าต่าง ด้ามขวานมีรอยมือสึกเป็นร่องตรงที่สามีนางจับ {name}บอกราคาสองเท่าของที่คนแปลกหน้าเสนอ

        หญิงม่ายบอกราคานั้นกับคนขอซื้อในวันต่อมา เขาจ่ายโดยไม่ต่อสักคำ แล้วถามนางว่าใครเป็นคนตั้งราคา นางบอกชื่อ{name}
      effects: { city: { promote: true }, flags: [named_a_fair_price_on_the_street] }
    - id: buy_the_tools
      label: ซื้อกล่องไว้เองในราคาที่คนแปลกหน้าเสนอ
      requires: { min_gold: 2 }
      text: |
        หญิงม่ายนับเหรียญสองเหรียญจากมือ{name} แล้วเลื่อนกล่องเข้ามาในห้อง {name}เก็บไว้ใต้เตียง ไม่ได้เป็นช่างไม้ แต่รู้ว่ากล่องแบบนี้ไม่ควรไปอยู่กับคนที่ไม่มีใครในถนนรู้จัก

        ตั้งแต่นั้น ใครในถนนต้องใช้สิ่วหรือขวานก็มาเคาะประตู{name} ไม่ได้ไปเคาะประตูหญิงม่าย ทุกชิ้นที่ยืมไปกลับมาก่อนค่ำ
      effects: { gold: -2, city: { promote: true }, flags: [bought_a_widows_tools] }
    - id: ask_her_back
      label: ไม่ตอบ ถามนางกลับว่าสามีของนางจะว่าอย่างไร
      text: |
        หญิงม่ายนิ่งไปจนชาในถ้วยเย็น แล้วตอบเองว่าเขาจะไม่ขาย เขาจะยกให้เด็กหนุ่มที่เคยเป็นลูกมือ เด็กที่ตอนนี้รับจ้างแบกของเพราะไม่มีเครื่องมือของตัวเอง

        สัปดาห์ต่อมาเด็กหนุ่มคนนั้นแบกกล่องไม้ผ่านหน้าประตู{name} หยุดก้มหัวให้{name}ทั้งตัว กล่องบนบ่าเอียงจนสิ่วข้างในกระทบกันดังกริ๊ก
      effects: { alignment: { moral: 1 }, city: { promote: true }, flags: [answered_with_a_question] }

# ---------- 6 ขึ้นเป็นผู้อาวุโสของเมือง ----------
- id: adult.town_rise_elder
  stage: adult
  weight: 900
  must: true
  mark: เป็นผู้อาวุโสของเมือง
  when:
    age: [35, 95]
    city: { ready: true, min_rank: 3, max_rank: 3, home: [family, room, house, shop] }
    not_flags: [institute_student]
  text: |
    {name}รู้เรื่องนี้ทีหลังจากเด็กที่มาส่งของ เมื่อวานลานตักน้ำของถนนมีสองคนเถียงกันเรื่องเส้นเขตรั้ว เถียงจนเกือบลงมือ แล้วมีคนหนึ่งในวงถามขึ้นว่า ถ้าเป็น{name} จะว่าอย่างไร ทั้งสองคนหยุด คิด แล้วตกลงกันได้เอง ตอนนั้น{name}ไม่ได้อยู่ตรงนั้น ไม่รู้ด้วยซ้ำว่ามีเรื่อง

    ตอนค่ำเป็นวันที่คนของถนนนั่งคุยกันประจำเดือน ในห้องมีม้านั่งยาวกับเก้าอี้มีพนักพิงตัวเดียว ทุกเดือนเก้าอี้ตัวนั้นว่าง {name}คิดมาตลอดว่าเป็นของคนที่ไม่มา คืนนี้คนเฝ้าห้องบอกว่าเก้าอี้ว่างไว้ให้{name}มาตั้งแต่ต้นปี รอแค่{name}ไม่นั่งม้านั่งเสียที

    คนในห้องเงียบรอ ม้านั่งที่{name}เคยนั่งมีคนอื่นนั่งไปแล้ว
  choices:
    - id: take_the_kept_chair
      label: นั่งลงบนเก้าอี้ตัวนั้น
      text: |
        พนักพิงของเก้าอี้สึกเป็นรอยหลังคน ไม่ใช่รอยหลังของ{name} ใครนั่งก่อนหน้านี้ไม่มีใครบอก และ{name}ไม่ได้ถาม

        ตลอดการประชุม คนที่พูดหันมาทาง{name}ก่อนจบประโยคทุกคน เรื่องสุดท้ายของคืนนั้นไม่มีใครตัดสิน ทุกคนรอจน{name}พูด
      effects: { city: { promote: true }, flags: [sits_in_the_kept_chair] }
    - id: give_the_chair_away
      label: ยกเก้าอี้ไปให้คนที่แก่ที่สุดในห้อง แล้วนั่งม้านั่งตามเดิม
      text: |
        คนที่แก่ที่สุดในห้องเป็นชายขาไม่ดีที่นั่งม้านั่งยาวมาทุกเดือนโดยไม่บ่น เขานั่งลงบนเก้าอี้ด้วยท่าที่เหมือนกลัวเก้าอี้จะหัก แล้วเอนหลังจนพนักพิงดังเอี๊ยด

        เดือนต่อมาในห้องมีเก้าอี้มีพนักพิงสองตัว ตัวที่สองวางข้างตัวแรก ว่างอยู่ ไม่มีใครบอกว่าใครยกมา
      effects: { alignment: { moral: 1 }, city: { promote: true }, flags: [gave_the_kept_chair_away] }
    - id: feed_the_room
      label: สั่งเหล้ากับขนมปังให้ทั้งห้องก่อนเริ่มคุย
      requires: { min_gold: 2 }
      text: |
        เหล้าหมดสองไห ขนมปังหมดตะกร้า คืนนั้นการประชุมจบช้ากว่าทุกเดือน ไม่มีเรื่องไหนตัดสินได้สักเรื่อง แต่ทุกคนอยู่จนจบ

        ตอนแยกย้าย คนเฝ้าห้องเก็บขนมปังที่เหลือใส่ผ้า บอกว่าจะเอาไปให้คนที่ไม่ได้มา แล้วบอกชื่อ{name}ให้คนพวกนั้นฟังด้วย
      effects: { gold: -2, city: { promote: true }, flags: [fed_the_street_meeting] }

# ---------- 7 ปีที่หน้าตึง (ซ้ำได้) ----------
- id: adult.town_tense_year
  stage: adult
  weight: 24
  once: false
  when:
    age: [19, 70]
    city: { mood: [tense], home: [family, room, house, shop] }
  text: |
    ปีนี้คนในถนนเลิกมองหน้ากัน ราคาขนมปังขึ้นสองครั้งในเดือนเดียว คนขายบอกว่าไม่ใช่ความผิดของเขา คนซื้อเชื่อครึ่งเดียว ข่าวลือมาถึงทุกเช้าพร้อมกับน้ำ บางข่าวว่าจะมีคนมาค้นห้อง บางข่าวว่ามีคนจดชื่อ ประตูที่เคยเปิดค้างไว้ตอนกลางวันเริ่มปิด

    ต้นเดือน คนของถนนตกลงกันว่าจะผลัดกันนั่งเฝ้าหัวถนนตอนกลางคืน คนละคืน ไม่มีใครรู้แน่ว่าเฝ้าอะไร แต่ทุกคนอยากให้มีคนเฝ้า ชื่อของ{name}อยู่ในบัญชีคืนที่สิบ
  choices:
    - id: sit_the_watch
      label: นั่งเฝ้าหัวถนนคืนที่สิบ
      text: |
        คืนนั้นไม่มีอะไรเกิดขึ้น มีคนเดินผ่านสามคน คนแรกเป็นคนในถนนที่กลับดึก คนที่สองเป็นหญิงที่ออกไปตามหมอให้ลูก คนที่สามไม่ใช่คนในถนน หยุดถามทาง {name}ชี้ทางให้ แล้วจำหน้าเขาไว้

        เช้าวันต่อมา{name}เล่าให้คนเฝ้าคืนที่สิบเอ็ดฟังทั้งสามคน รวมทั้งเรื่องที่ไม่มีอะไรเกิด คนเฝ้าคืนที่สิบเอ็ดจดไว้บนแผ่นไม้ที่แขวนหัวถนน
      effects: { city: { merit: 1 }, flags: [sat_a_watch_in_a_tense_year] }
    - id: trace_the_rumour
      label: ตามหาว่าข่าวลือเช้านี้เริ่มจากปากใคร
      requires: { flag: sat_a_watch_in_a_tense_year }
      text: |
        {name}เคยนั่งเฝ้ามาแล้ว รู้ว่าคืนส่วนใหญ่ไม่มีอะไรเกิด ข่าวลือเกิดตอนกลางวันที่ลานตักน้ำ คราวนี้{name}ถามย้อนทีละคน ใครเล่าให้ฟัง ใครเล่าให้คนนั้นฟัง ถามไปห้าคนก็มาหยุดที่คนเดียว คนขายแป้งหัวถนน

        เขาไม่ได้ตั้งใจโกหก เขาได้ยินมาจากคนส่งแป้งที่มาจากต่างถิ่น แล้วเล่าต่อให้ลูกค้าทุกคน ข่าวเดียวกันวันละหลายสิบรอบ ยาวขึ้นนิดหนึ่งทุกรอบ
      effects: { alignment: { law: 1 }, flags: [traced_a_rumour_in_a_tense_year] }
    - id: trade_the_night
      label: ขอแลกคืนให้คนอื่นเฝ้าแทน แล้วอยู่ในห้อง
      text: |
        คนที่รับแลกเป็นชายหนุ่มที่อยากเฝ้าอยู่แล้ว เช้าวันต่อมาเขาเล่าให้ทั้งถนนฟังว่าเห็นเงาคนเดินผ่านหัวถนนสามครั้ง ไม่มีใครถามว่าเงาของใคร

        เรื่องเงาไปถึงถนนข้างๆ ก่อนเที่ยง ตกเย็นถนนข้างๆ ก็เริ่มผลัดกันเฝ้าบ้าง
      effects: { flags: [kept_in_during_a_tense_year] }
    - id: lay_in_flour
      label: ซื้อแป้งกับเกลือตุนไว้ก่อนราคาขึ้นอีก
      requires: { min_gold: 1 }
      text: |
        แป้งครึ่งกระสอบกับเกลือหนึ่งถุงขึ้นบันไดไปอยู่ใต้เตียงของ{name} คนข้างห้องเห็นตอนขนขึ้น วันต่อมาคนข้างห้องก็ขนขึ้นมาบ้าง

        ร้านแป้งหัวถนนหมดของก่อนเที่ยง บ่ายวันนั้นราคาขึ้นครั้งที่สาม
      effects: { gold: -1, flags: [laid_in_stores_in_a_tense_year] }

# ---------- 8 ปีจลาจล (ซ้ำได้) ----------
- id: adult.town_riot_year
  stage: adult
  weight: 60
  once: false
  scene: home
  when:
    age: [19, 70]
    city: { mood: [riot], home: [family, room, house, shop] }
  text: |
    ร้านทุกร้านในถนนลงบานไม้ตั้งแต่สาย คนที่ออกไปข้างนอกกลับมาเล่าคนละเรื่อง เรื่องเดียวที่ตรงกันคือมีของไหม้อยู่ที่ไหนสักแห่ง เพราะกลิ่นควันมาถึงถนนตั้งแต่เช้า ตอนบ่ายคนกลุ่มหนึ่งเดินผ่านหัวถนน ถือของที่ไม่ใช่ของตัวเอง ตะโกนอะไรบางอย่างที่ไม่มีใครในถนนฟังออก

    ตกค่ำถนนมืดกว่าทุกคืน ไม่มีใครจุดไฟหน้าประตู ประตูห้องของ{name}เป็นไม้แผ่นเดียว กลอนเป็นเหล็กเส้นเล็กที่เคยพอสำหรับคืนธรรมดา
  choices:
    - id: bar_the_door
      label: ซื้อไม้หน้าหนาจากคนข้างห้องมาตีขวางประตู
      requires: { min_gold: 1 }
      text: |
        คนข้างห้องขายให้แผ่นละครึ่งเหรียญ แพงกว่าราคาไม้วันธรรมดาสามเท่า เขาบอกว่าคืนนี้ไม่ใช่คืนธรรมดา {name}ตอกไม้สองแผ่นไขว้กันหลังประตู แล้วนั่งพิงไว้อีกชั้น

        ตอนดึกมีคนลองผลักประตูครั้งหนึ่ง แล้วเดินไปผลักประตูถัดไป ประตูถัดไปเป็นของคนข้างห้อง ที่ขายไม้ไปหมดแล้ว
      effects: { gold: -1, flags: [barred_the_door_in_a_riot] }
    - id: stand_watch
      label: ถือไม้ท่อนหนึ่งไปยืนเฝ้าปลายถนนกับคนที่ไม่ยอมนอน
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ยืนกับคนอีกห้าคนที่ปลายถนน ไม่มีใครถือไม้ขึ้นเหนือเอว กลุ่มคนที่เดินผ่านตอนเที่ยงคืนหยุดดูพวกเขา คนหน้าสุดของกลุ่มมองไม้ในมือ{name} แล้วมองถนนข้างหลังที่มืดสนิท แล้วเลี้ยวไปทางอื่น

          ตอนสางคนหนึ่งในห้าคนวางไม้ลง บอกชื่อของทั้งหกคนให้คนที่เปิดประตูออกมาฟังทีละชื่อ ชื่อของ{name}อยู่ลำดับที่สาม
        effects: { city: { merit: 1 }, flags: [stood_a_riot_night_watch] }
      failure:
        text: |
          กลุ่มที่เดินผ่านตอนเที่ยงคืนไม่ได้เลี้ยว คนข้างหน้าเห็นไม้ในมือ{name}แล้วหัวเราะ อิฐก้อนแรกลอยมาโดนหน้าแข้ง ก้อนที่สองโดนผนังข้างหู คนเฝ้าห้าคนถอยเข้าประตูใครประตูมัน

          {name}คลานขึ้นบันไดห้องตัวเองได้ก่อนกลุ่มนั้นจะผ่านไปจนสุดถนน หน้าแข้งบวมเท่ากำปั้น สีม่วงอยู่ครึ่งเดือน
        effects: { hp: -2, flags: [hurt_on_a_riot_watch] }
    - id: knock_the_lone_doors
      label: เดินเคาะทุกประตูที่มีคนอยู่คนเดียวก่อนมืด
      requires: { flag: stood_a_riot_night_watch }
      text: |
        เช้าหลังคืนที่ยืนเฝ้าครั้งก่อน {name}เพิ่งรู้ว่าคนที่เจ็บในถนนคือคนแก่ที่อยู่คนเดียว ล้มในห้องมืดเพราะไม่กล้าจุดไฟ แล้วไม่มีใครได้ยิน คนที่ออกไปข้างนอกกลับมาครบทุกคน คราวนี้{name}เคาะทุกประตูที่รู้ว่ามีคนอยู่คนเดียว ฝากเทียนไว้คนละเล่ม บอกให้จุดได้ถ้าคลุมผ้าไว้

        สามประตู ประตูหนึ่งไม่ตอบ {name}เคาะซ้ำจนมีเสียงลากเท้ามาถึงหลังประตู ช้า แต่มา
      effects: { city: { merit: 1 }, flags: [checked_the_lone_doors_in_a_riot] }
    - id: go_out_with_them
      label: ออกไปกับคนกลุ่มที่เดินผ่าน ไปดูให้เห็นกับตา
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ข้างนอกไม่ได้มีคนมากอย่างที่ฟังจากในห้อง กลุ่มที่{name}เดินด้วยมีไม่ถึงยี่สิบคน คนหน้าสุดไม่รู้ว่าจะพาไปไหน เลี้ยวตามเสียงที่ดังที่สุด {name}ช่วยคนอื่นงัดบานไม้ร้านหนึ่ง ข้างในมีแต่ชั้นเปล่า เจ้าของขนของออกไปตั้งแต่บ่าย

          {name}กลับถึงห้องก่อนสาง ในพื้นรองเท้ามีเศษกระจกฝังอยู่ ไม่รู้ว่าเหยียบมาจากหน้าต่างบ้านใคร
        effects: { alignment: { law: -1 }, flags: [walked_with_a_riot_crowd] }
      failure:
        text: |
          กลุ่มที่{name}เดินด้วยเลี้ยวเข้าซอยที่ยามรออยู่ทั้งสองปลาย กระบองไม่เลือกว่าใครถืออะไร ใครมาเพราะอะไร {name}โดนฟาดหลังสองที ล้ม แล้วคลานออกมาทางรางน้ำ

          กลับถึงห้องตอนสาง หลังเป็นรอยยาวสองแถว นอนหงายไม่ได้อยู่ครึ่งเดือน คนข้างห้องเห็นตอนกลับ แล้วไม่ทักอีกเลยทั้งปี
        effects: { hp: -2, alignment: { law: -1 }, flags: [hurt_running_with_a_riot_crowd] }

# ---------- 9 ปีไข้ (ซ้ำได้) ----------
- id: adult.town_fever_year
  stage: adult
  weight: 60
  once: false
  scene: home
  when:
    age: [19, 70]
    city: { mood: [plague], home: [family, room, house, shop] }
  text: |
    ไข้ท่าเรือขึ้นบันไดมาทีละขั้น เริ่มจากห้องล่างสุด ไอแห้งก่อน แล้วตัวร้อนเจ็ดวัน คนแก่กับเด็กเล็กล้มก่อน คนหนุ่มสาวล้มทีหลังแต่ลุกเร็วกว่า ห้องไหนมีคนป่วย ผ้าขาวผูกที่ลูกบิดประตู สัปดาห์นี้บนบันไดมีผ้าขาวสี่ผืน

    ห้องที่มีผ้าขาวไม่มีใครเข้า คนข้างในต้องการน้ำกับน้ำแกงมากกว่าหมอ เช้านี้ที่หัวบันไดมีถังน้ำวางอยู่หนึ่งใบ กับหม้อน้ำแกงที่ใครสักคนต้มไว้ ยังไม่มีใครหิ้ว
  choices:
    - id: carry_broth
      label: หิ้วน้ำกับน้ำแกงไปวางหน้าประตูที่มีผ้าขาวทุกห้อง
      check: { stat: CON, dc: 12 }
      success:
        text: |
          {name}วางถ้วยแล้วเคาะสองที ถอยออกมาสามก้าวก่อนประตูจะเปิด เช้าหนึ่งเย็นหนึ่ง เจ็ดวัน ถ้วยเปล่าวางคืนไว้หน้าประตูทุกครั้ง บางใบมีเศษผ้าผูกหูถ้วยไว้ บางใบมีเหรียญทองแดงข้างใน {name}เทเหรียญคืนลงถ้วยใบต่อไป

          วันที่เจ็ด ห้องล่างสุดเปิดประตูเอง ชายแก่ในห้องนั้นยื่นถ้วยเปล่าคืนให้{name}ถึงมือ ด้วยมือที่ยังสั่น ถ้วยล้างมาแล้ว
        effects: { city: { merit: 1 }, flags: [carried_broth_in_a_fever_year] }
      failure:
        text: |
          วันที่สี่{name}เริ่มไอ แห้ง เสียงเดียวกับเสียงที่ได้ยินผ่านประตูทุกบาน คืนนั้นตัวร้อนจนผ้าห่มเปียก เจ็ดวันต่อมา{name}จำได้แค่เพดานกับเสียงคนเคาะประตูสองที

          ทุกเช้าเย็นมีถ้วยน้ำแกงวางอยู่หน้าประตูห้องของ{name} ถ้วยใบเดียวกับที่{name}เคยหิ้วไปวางหน้าห้องอื่น ลูกบิดประตูมีผ้าขาวผูกไว้ ไม่รู้ว่าใครผูก
        effects: { hp: -3, flags: [caught_fever_carrying_broth] }
    - id: sit_the_fifth_night
      label: นับวันของทุกห้องที่มีผ้าขาว แล้วไปนั่งเฝ้าห้องที่ถึงคืนที่ห้า
      requires: { flag: carried_broth_in_a_fever_year }
      text: |
        {name}หิ้วน้ำแกงมาแล้วรอบหนึ่ง จำได้ว่าไข้ท่าเรือแตกในคืนที่ห้า คนที่ตัวร้อนจะหนาวสั่นทั้งคืน ถ้ามีคนเติมผ้าห่ม ป้อนน้ำอุ่นทีละช้อน ตอนเช้าจะลุกได้ คราวนี้{name}ขีดวันของทุกห้องไว้บนผนังบันได ห้องไหนถึงคืนที่ห้า {name}ผูกผ้าปิดปากแล้วนั่งหน้าเตียงห้องนั้น

        ห้องล่างสุดเป็นห้องแรก แล้วห้องที่สาม แล้วห้องของเด็กสองคนที่พ่อแม่ป่วยพร้อมกัน ขีดบนผนังบันไดเพิ่มทุกวัน ไม่มีขีดไหนต้องลบ
      effects: { hp: -1, city: { merit: 1 }, flags: [sat_the_fifth_night] }
    - id: shut_the_door
      label: ซื้อของไว้พอเจ็ดวัน ปิดประตู แล้วนับวัน
      requires: { min_gold: 1 }
      text: |
        {name}ขีดผนังวันละขีด กินทีละน้อย ได้ยินเสียงไอผ่านผนังทุกคืน จนแยกได้ว่าเสียงไหนห้องไหน ห้องข้างล่างไอสั้นสองที ห้องข้างๆ ไอยาวแล้วหอบ

        วันที่สิบสองเสียงไอห้องข้างๆ เงียบไป เช้าวันต่อมาคนห้องข้างๆ เปิดหน้าต่างแล้วตะโกนไล่แมว เสียงแหบ แต่ดัง
      effects: { gold: -1, flags: [counted_the_fever_days_behind_a_door] }
    - id: go_to_the_country
      label: เก็บของจำเป็นใส่ห่อ ออกไปอยู่นอกเมืองจนกว่าไข้จะผ่าน
      text: |
        ทางออกจากเมืองมีคนเดินไปทางเดียวกันเป็นแถว ทุกคนแบกห่อ ไม่มีใครไอ หรือไม่มีใครยอมไอให้คนอื่นได้ยิน {name}ได้ที่นอนในโรงเก็บของของคนนอกเมือง เจ้าของคิดค่านอนแพงกว่าห้องในเมือง

        ข่าวจากเมืองมากับคนขายของทุกสัปดาห์ บอกจำนวนผ้าขาวบนแต่ละถนน ถนนของ{name}มีผ้าขาวมากกว่าถนนอื่นอยู่สองสัปดาห์ แล้วน้อยลง สัปดาห์ถัดมาคนขายของมีข่าวอีกเรื่อง ห้องเช่าที่คนเช่าทิ้งไว้ตอนหนีไข้ เจ้าของปล่อยให้คนใหม่เช่าไปหมดแล้ว
      effects: { city: { leave: true }, flags: [left_town_for_a_fever] }

# ---------- 10 งานของถนน (ซ้ำได้) ----------
- id: adult.town_street_work
  stage: adult
  weight: 15
  once: false
  when:
    age: [19, 64]
    city: { mood: [calm], min_years: 1, home: [family, room, house, shop] }
  text: |
    ทุกปีก่อนฤดูน้ำหลาก ถนนล้างร่องน้ำกันหนึ่งวัน ร่องน้ำวิ่งผ่านหน้าทุกประตู ใบไม้ เศษของ ขี้เถ้าจากเตาทั้งปีไปกองอยู่ข้างใน ถ้าไม่ล้าง น้ำหลากครั้งแรกจะเอ่อขึ้นมาถึงธรณีประตู

    คนที่มาเคาะประตูเรียกคนเป็นคนเดิมทุกปี ถือพลั่วมาด้วย เขาไม่ถามว่าว่างไหม เขาถามว่าจะลงช่วงเช้าหรือช่วงบ่าย คนที่ไม่ลงร่องจ่ายแทนแรงได้ ชื่อขึ้นบัญชีคนละด้าน
  choices:
    - id: get_in_the_drain
      label: ลงร่องช่วงเช้า
      text: |
        ร่องน้ำช่วงหน้าห้องของ{name}เก็บของไว้ทั้งปี เหรียญทองแดงขึ้นสนิมเขียวสองเหรียญ ช้อนงอ ฟันหมาหนึ่งซี่ {name}โกยเลนขึ้นใส่ถังจนแขนชา แผลที่นิ้วโดนเศษกระเบื้องบาดรู้ตัวตอนล้างมือ

        ตกเย็นคนลงร่องนั่งกินขนมปังกับน้ำแกงบนธรณีประตูใครประตูมัน คุยกันข้ามถนน ร่องน้ำสะอาดจนได้ยินเสียงน้ำไหล
      effects: { hp: -1, city: { merit: 1 }, flags: [cleared_the_street_drain] }
    - id: crawl_the_covered_drain
      label: ลงไปช่วงที่ร่องน้ำลอดใต้ทางเดิน ช่วงที่ไม่มีใครลง
      requires: { flag: cleared_the_street_drain }
      text: |
        ครั้งก่อนที่ลงร่อง {name}เห็นว่ามีช่วงหนึ่งที่ร่องน้ำลอดใต้ทางเดินยาวสิบก้าว มืด ต้องคลาน ทุกปีคนล้างแค่ปากทางสองฝั่งแล้วหวังว่าน้ำจะดันที่เหลือไปเอง คราวนี้{name}ถือเทียนคลานเข้าไป เข่าถลอกตั้งแต่ก้าวที่สาม

        ข้างในมีของที่ถนนทำหายมาหลายสิบปี กุญแจพวงหนึ่ง แหวนเงินบาง ตุ๊กตาไม้ของเด็กที่ตอนนี้มีลูกแล้ว ตอนเย็น{name}วางของทั้งหมดเรียงบนขั้นบันไดให้เจ้าของมาหยิบ แหวนเงินไม่มีใครมารับ
      effects: { hp: -1, city: { merit: 1 }, flags: [went_down_the_covered_drain] }
    - id: pay_a_share
      label: จ่ายหนึ่งเหรียญแทนแรง
      requires: { min_gold: 1 }
      text: |
        คนเก็บเงินจดชื่อ{name}ไว้ในบัญชีด้านขวา ด้านของคนจ่ายแทนแรง ด้านซ้ายเป็นชื่อคนลงร่อง ด้านขวาสั้นกว่าทุกปี

        เงินของด้านขวาซื้อพลั่วใหม่สองเล่มกับน้ำแกงหม้อใหญ่ให้คนด้านซ้าย ตกเย็น{name}เดินผ่านคนที่นั่งกินน้ำแกงบนธรณีประตู
      effects: { gold: -1, flags: [paid_for_the_drain_day] }
    - id: busy_that_day
      label: บอกว่าวันนั้นมีงานของตัวเองที่เลื่อนไม่ได้
      text: |
        คนถือพลั่วจดอะไรบางอย่างไว้ข้างชื่อ{name} ไม่ได้ว่าอะไร ตอนเย็นกลับมา ร่องน้ำหน้าประตู{name}สะอาดเหมือนช่วงอื่น ไม่มีใครพูดถึง

        น้ำหลากครั้งแรกมาในสัปดาห์ต่อมา ไหลผ่านหน้าประตูไปตามร่องเรียบร้อย
      effects: { flags: [missed_the_drain_day] }

# ---------- 11 เพื่อนบ้านทะเลาะกัน (ซ้ำได้) ----------
- id: adult.town_neighbours_quarrel
  stage: adult
  weight: 15
  once: false
  scene: home
  when:
    age: [22, 70]
    city: { min_rank: 2, home: [family, room, house, shop] }
  text: |
    สองประตูมาเคาะห้องของ{name}ในเช้าเดียวกัน ห่างกันไม่ถึงชั่วโมง ชายห้องบนกับหญิงห้องล่าง น้ำจากพื้นห้องบนซึมลงเพดานห้องล่างมาตั้งแต่หน้าฝน หญิงห้องล่างว่าชายห้องบนล้างพื้นแบบสาดน้ำ ชายห้องบนว่าพื้นห้องเขาไม่รั่ว เพดานห้องนางผุเอง

    ทั้งสองไม่พูดกันมาสองเดือน ทั้งสองรู้จัก{name} และทั้งสองขอให้{name}ไปดู เจ้าของบ้านเช่าบอกว่าจะส่งช่างมาถ้าทั้งสองยอมแบ่งค่าช่าง ทั้งสองไม่ยอม
  choices:
    - id: settle_it
      label: ให้ทั้งสองคนขึ้นไปดูพื้นห้องบนพร้อมกัน แล้วลงมาดูเพดานห้องล่างพร้อมกัน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}เทน้ำลงพื้นห้องบนหนึ่งถ้วย แล้วพาทั้งสองลงไปยืนใต้เพดานห้องล่าง ครู่หนึ่งหยดน้ำหยดแรกก็ลงมาที่มุมเดียวกับรอยเปื้อนเก่า ทั้งสองคนเห็นพร้อมกัน ไม่มีใครต้องพูดว่าใครผิด

          ทั้งสองตกลงแบ่งค่าช่างคนละครึ่ง สัปดาห์ต่อมาชายห้องบนลงมาช่วยหญิงห้องล่างยกตู้ออกจากมุมที่เปียก ตู้หนักจนต้องหยุดพักกลางทาง
        effects: { city: { merit: 1 }, flags: [settled_a_neighbours_quarrel] }
      failure:
        text: |
          พอ{name}บอกว่าน้ำรั่วจริง ชายห้องบนเดินขึ้นบันไดไปกระแทกประตู หญิงห้องล่างบอกว่า{name}พูดช้าไปสองเดือน {name}จ่ายค่าช่างเองหนึ่งเหรียญเพื่อให้เรื่องจบ

          ช่างปะพื้นห้องบนเสร็จในวันเดียว น้ำไม่ซึมอีก ทั้งสองยังไม่พูดกัน และไม่พูดกับ{name}ไปอีกเดือน
        effects: { gold: -1, flags: [a_quarrel_turned_on_you] }
    - id: find_the_older_quarrel
      label: ถามทั้งสองว่าก่อนเรื่องน้ำ ทะเลาะกันเรื่องอะไร
      requires: { flag: settled_a_neighbours_quarrel }
      text: |
        ไกล่เกลี่ยมาแล้วครั้งหนึ่ง {name}จึงรู้ว่าเรื่องที่คนเอามาเคาะประตูมักเป็นเรื่องที่สอง คราวนี้{name}ถามถึงเรื่องก่อนหน้า ชายห้องบนตอบหลังจากเงียบไปพักใหญ่ ว่าเมื่อหน้าหนาว เตาของเขาแตก หญิงห้องล่างไม่ยอมให้ยืมเตา หญิงห้องล่างบอกว่าเขาไม่เคยขอ เขาแค่ยืนอยู่หน้าประตูนางทั้งเย็น

        เรื่องน้ำซึมจบในบ่ายวันนั้น เรื่องเตายังไม่จบ แต่ทั้งสองเริ่มพูดถึงเรื่องนั้นต่อหน้ากัน
      effects: { city: { merit: 1 }, flags: [found_the_older_quarrel] }
    - id: take_her_side
      label: เข้าข้างหญิงห้องล่าง เพราะน้ำมาจากข้างบน
      text: |
        หญิงห้องล่างยัดเหรียญหนึ่งเหรียญใส่มือ{name} บอกว่าค่าเดินขึ้นบันได แล้วไปเคาะประตูห้องบนพร้อมชื่อ{name} ชายห้องบนจ่ายค่าช่างคนเดียว

        ตั้งแต่นั้นชายห้องบนเดินผ่าน{name}บนบันไดโดยหันหน้าเข้าผนัง ห้องของเขาเงียบลง ไม่มีเสียงสาดน้ำอีก
      effects: { gold: 1, flags: [took_a_side_in_a_stair_quarrel] }
    - id: send_them_to_the_landlord
      label: บอกทั้งสองให้ไปหาเจ้าของบ้านเช่า เพราะพื้นกับเพดานเป็นของเขา
      text: |
        เจ้าของบ้านเช่ามาดูในอีกสามสัปดาห์ ซ่อมทั้งพื้นและเพดาน แล้วบวกค่าซ่อมลงในค่าเช่ารอบหน้าของทั้งสองห้อง

        ทั้งสองห้องเลิกทะเลาะกันเรื่องน้ำ แล้วเริ่มบ่นเจ้าของบ้านเช่าด้วยกันบนบันได เสียงดังพอให้{name}ได้ยินจากในห้อง
      effects: { flags: [sent_a_quarrel_to_the_landlord] }

# ---------- 12 สิบห้าปีบนถนนเดียว ----------
- id: adult.town_fifteen_years
  stage: adult
  weight: 38
  when:
    age: [34, 70]
    city: { native: false, min_years: 15, home: [room, house, shop] }
  text: |
    สิบห้าปีบนถนนเดียว ขั้นบันไดที่{name}เหยียบทุกวันสึกตรงกลางเป็นแอ่งตื้น ประตูห้องตรงข้ามเปลี่ยนคนอยู่มาสี่รอบ เด็กที่เกิดในปีที่{name}มาถึงทำงานแล้ว เดินผ่าน{name}โดยไม่รู้ว่า{name}เคยเป็นคนมาใหม่ เจ้าของห้องคนแรกตายไปแล้ว คนที่จำได้ว่า{name}หิ้วห่อเข้ามาวันแรกเหลือไม่ถึงสามคน

    ถนนจำบางเรื่องของ{name}ได้ดีกว่าตัว{name}เอง คนขายของหัวถนนรู้ว่า{name}ไม่กินอะไร ร้านซ่อมรองเท้ารู้ว่ารองเท้าของ{name}สึกข้างไหนก่อน แต่บางเรื่องถนนลืมไปแล้ว ชื่อของที่ที่{name}จากมา ไม่มีใครถามมาหลายปี

    เช้านี้คนมาใหม่คนหนึ่งยืนสะพายห่อหนักกว่าตัวอยู่ที่หัวถนน ถามคนที่เดินผ่านทีละคนว่าห้องว่างอยู่ทางไหน
  choices:
    - id: walk_the_newcomer_in
      label: พาคนมาใหม่ไปหาห้อง
      text: |
        ห้องที่คนมาใหม่ถามหามีคนเช่าไปตั้งแต่หน้าหนาว {name}พาไปห้องที่รู้ว่าว่าง ระหว่างทางบอกเรื่องที่ไม่มีใครบอก{name}เมื่อสิบห้าปีก่อน ร้านไหนชั่งขาด เจ้าของห้องคนไหนให้รอ ลานตักน้ำว่างตอนไหน

        คนมาใหม่จดไว้ที่หลังมือด้วยถ่าน ตอนเย็น{name}เห็นเขานั่งอยู่บนธรณีประตูห้องใหม่ หลังมือยังดำ
      effects: { city: { merit: 1 }, flags: [walked_a_newcomer_in] }
    - id: count_the_old_doors
      label: เดินถนนทั้งเส้นช้าๆ นับประตูที่คนเดิมยังอยู่
      text: |
        ถนนมีสิบเก้าประตู มีคนเดิมอยู่หกประตู ประตูหนึ่งเปลี่ยนสีไปสามครั้ง คนข้างในยังเป็นคนเดิม อีกประตูสีเดิมทุกปี แต่คนข้างในเปลี่ยนไปห้าครั้ง {name}นับซ้ำอีกรอบจากอีกฝั่งของถนน ได้หกเท่าเดิม

        ประตูที่หกเป็นของ{name}เอง
      effects: { stats: { WIS: 1 }, flags: [counted_the_old_doors] }
    - id: mend_the_worn_step
      label: จ้างช่างมาเปลี่ยนขั้นบันไดที่สึก
      requires: { min_gold: 2 }
      text: |
        ช่างงัดขั้นเก่าออกได้ในครึ่งเช้า ใต้ขั้นมีเหรียญทองแดงเก่าหนึ่งเหรียญ ช่างบอกว่าคนก่อนสร้างวางไว้ให้โชคดี {name}วางคืนไว้ใต้ขั้นใหม่

        {name}ขอขั้นเก่าไว้ วางข้างประตูใช้นั่งตอนเย็น แอ่งตรงกลางพอดีก้น ขั้นใหม่บนบันไดยังไม่มีรอยใคร
      effects: { gold: -2, flags: [mended_the_worn_step] }
