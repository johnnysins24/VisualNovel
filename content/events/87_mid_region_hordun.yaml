# ชุด 4 วัยกลางคนตามถิ่น: ฮอร์ดุน (ข้อห้ามของหิน เคาะหินสามครั้งก่อนเจาะ ไม่ขุดในเดือนที่หนาวที่สุด)
# ห้าเรื่องตามแบบ: ข้อห้ามกับปากท้อง · คนอื่นฝืน · ขอขมา · งานของถิ่นที่เปลี่ยนไป · ธรรมเนียมที่คนวัยกลางคนยืนแทนคนรุ่นก่อน
# คนในถิ่นพูดว่า หิน กับ เดือนหนาว ไม่มีใครเรียกเจ้าเดิม คนแคระอายุเทียบมนุษย์ ห้ามนับปี
# หนี้บนกำแพงสภาพูดถึงได้แค่ว่ายังสลักอยู่ตรงนั้น ไม่บอกว่าถึงกำหนดหรือยัง
# คนใหม่: บรัมดุก ตระกูลเชือกแปด (hordun_neighbour) คนแคระห้องตรงข้าม · ยายดอร์บา ตระกูลบ่อเย็น (มีแต่ในข้อความ)

- id: adult.region_hordun_the_cold_month_shift
  stage: adult
  scene: mine
  weight: 22
  when:
    age: [41, 58]
    location_tag: hordun
  text: |
    ประกาศของบริษัทเหมืองติดอยู่ที่ประตูกรงชักตั้งแต่ปลายใบไม้ร่วง ปีนี้เหมืองไม่หยุดในเดือนที่หนาวที่สุด ใครลงกะเดือนหนาวได้ค่าแรงสองเท่า รับทุกคนที่มีแขน ไม่เคยลงเหมืองก็รับ ถ่านทุกเกวียนที่ออกจากปากเหมืองนี้ไปหักหนี้ที่สลักอยู่บนกำแพงสภา ใต้ประกาศมีคนเอาถ่านเขียนต่อไว้บรรทัดหนึ่ง ตัวเล็ก ลายมือคนแคระ หินไม่ชอบให้ปลุกเดือนนี้

    เด็กทุกคนในฮอร์ดุนรู้สองข้อตั้งแต่ก่อนจะยกค้อนไหว เคาะหินสามครั้งก่อนเจาะ เดือนที่หนาวที่สุดไม่ลงเหมือง คนแก่สอนแค่นั้น ถามว่าทำไม คนแก่ก็ตอบว่าหินคือหิน หนาวคือหนาว

    นายกะคนใหม่มาจากอาร์เวล เสียงดัง ยืนอ่านรายชื่อหน้ากรงชักทุกเช้า เดือนหนาวในฮอร์ดุนไม่มีงานให้ใครทำมากนัก ทุกบ้านกินของที่เก็บไว้ ใครทำงานกับเหมืองอยู่แล้วแต่ไม่ลง นายกะบอกว่าฤดูหน้าไม่ต้องมา ข้าวในโอ่งบ้าน{name}ปีนี้พอถึงกลางเดือนหนาว ไม่พอถึงปลาย
  choices:
    - id: stay_up
      label: ไม่ลง อยู่บ้านกินของที่เก็บไว้จนพ้นเดือน
      text: |
        เดือนหนาวปีนั้นยาว {name}ซ่อมรองเท้าทุกคู่ในบ้าน ซ่อมขาเก้าอี้ ต้มข้าวให้เหลวขึ้นทุกสัปดาห์ ทุกคืนได้ยินเสียงกรงชักลงไปข้างล่าง กึก กึก ห่างกันเท่าๆ กัน แล้วขึ้นมาตอนเช้ามืด

        วันแรกหลังพ้นเดือน ข้าวในโอ่งเหลือแค่ก้น คนที่ไม่ได้ลงไปยืนเรียงกันหน้ากรงชัก นายกะอ่านรายชื่อ ข้ามชื่อของทุกคนในแถวนั้นไปเหมือนไม่มีใครยืนอยู่ {name}ยืนอยู่ตรงนั้นจนเขาอ่านจบ
      effects: { gold: -3, taboo: { stone: keep }, flags: [stayed_up_in_the_cold_month] }
    - id: go_down
      label: ลงกะเดือนหนาว รับค่าแรงสองเท่า
      text: |
        หินในเดือนหนาวแข็งกว่าที่ใครจำได้ ดอกสว่านบิ่นวันละสองดอก น้ำที่ซึมจากผนังจับเป็นน้ำแข็งเส้นบางๆ นายกะสั่งไม่ให้เคาะ เพราะเคาะทุกหน้าหินเสียเวลาครึ่งกะ คนแคระในกะก้มหน้าเจาะเหมือนคนอื่น ไม่มีใครมองหน้าใคร

        ปลายเดือนค่าแรงหนักมือ {name}ซื้อข้าวเต็มโอ่งกับถ่านอีกสองกระสอบ ตอนเดินกลับบ้านคืนสุดท้ายของกะ ได้ยินเสียงหินลั่นลึกลงไปข้างล่าง เสียงยาว ช้า เหมือนอะไรตัวใหญ่พลิกตัวในที่นอน แล้วก็เงียบ
      effects: { gold: 5, taboo: { stone: break }, flags: [worked_the_cold_month] }
    - id: haul_only
      label: ลงไปแต่ขนอย่างเดียว ไม่จับสว่าน แล้วเคาะทุกหน้าหินที่เดินผ่าน
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          {name}บอกนายกะว่าจะลากเกวียนถ่านที่คนอื่นตัดไว้ เขาไม่สนว่าใครทำอะไรขอให้ถ่านขึ้นมา ตลอดเดือน{name}เข็นเกวียนขึ้นลงรางแคบ เลี้ยวโค้งโดยไม่ให้ล้อแตะผนังสักครั้ง ทุกหน้าหินที่ผ่าน{name}เอาข้อนิ้วเคาะสามที แล้วเข็นต่อ

          ค่าแรงคนเข็นได้ครึ่งของคนเจาะ แต่ข้าวในโอ่งพอถึงสิ้นเดือน คนแคระแก่คนหนึ่งในกะเห็น{name}เคาะ วันต่อมาเขาเคาะบ้าง เคาะเบาๆ ให้นายกะไม่ได้ยิน
        effects: { gold: 2, stats: { DEX: 1 }, taboo: { stone: keep }, flags: [hauled_through_the_cold_month] }
      failure:
        text: |
          เกวียนตกรางที่โค้งหน้าชั้นสาม ล้อหน้าจมเข้าซอกหิน ดึงยังไงก็ไม่ขึ้น นายกะยื่นสกัดให้ บอกให้สกัดหินตรงซอกออกจนกว่าล้อจะหลุด ไม่มีเวลาให้เคาะ

          {name}สกัดอยู่ครึ่งกะ หินแตกเป็นเสี้ยวคมบาดหลังมือสองแผล ล้อหลุดออกมาได้ ค่าแรงเดือนนั้นได้ครึ่งของคนเจาะ แผลหายก่อนเดือนหนาวจะหมด แต่ซอกที่สกัดไว้ยังเป็นรอยขาวอยู่ข้างราง ใครเข็นผ่านก็เห็น
        effects: { gold: 2, hp: -1, taboo: { stone: break }, flags: [hauled_and_had_to_cut] }
    - id: ask_the_clan
      label: ไปหาผู้อาวุโสของตระกูล ขอเบิกหีบเดือนหนาวตามธรรมเนียมเก่า
      requires: { flag: origin_dwarf_clan }
      text: |
        หีบเดือนหนาวของตระกูลเคยจ่ายให้คนที่ไม่ยอมลงเหมืองในเดือนนั้น ตั้งแต่ก่อนมีบริษัท ตั้งแต่ก่อนมีหนี้บนกำแพง หลายปีหลังมานี้ไม่มีใครเบิก เพราะทุกคนลง ผู้อาวุโสเปิดหีบให้ดู ข้างในเหลือเหรียญไม่ถึงครึ่ง

        เขาแบ่งให้{name}พอซื้อข้าวถึงปลายเดือน แล้วเขียนชื่อ{name}ลงสมุดของหีบ ใต้ชื่อคนที่เบิกครั้งสุดท้าย หมึกซีดจนเกือบอ่านไม่ออก หน้าร้อนปีนั้น{name}ต้องไปทำงานให้ตระกูลโดยไม่คิดค่าแรงสิบวัน คืนเงินเข้าหีบตามธรรมเนียม
      effects: { gold: 1, taboo: { stone: keep }, reputation: { dwarf_council: 1 }, flags: [drew_from_the_cold_month_chest] }

- id: adult.region_hordun_the_room_behind_the_wall
  stage: adult
  scene: home
  weight: 22
  when:
    age: [43, 60]
    location_tag: hordun
  text: |
    คู่หนุ่มสาวห้องถัดไปตามทางเดินเพิ่งได้ลูกคนแรก ห้องเช่าห้องเดียวแคบเกินไปสำหรับสามคน ค่าห้องที่สองแพงเกินกว่าที่สองคนจะหาได้ ผัวเป็นคนแคระหนุ่มจากตระกูลเล็ก เมียเป็นคนอาร์เวลที่ขึ้นมาทำงานโรงหล่อ ทั้งคู่ตัดสินใจเจาะห้องเพิ่มเข้าไปในผนังหินหลังห้องเอง

    เริ่มในเดือนที่หนาวที่สุด เพราะเป็นเดือนเดียวที่โรงหล่อปิดและทั้งคู่ว่าง เสียงสว่านมือดังผ่านผนังมาถึงห้องของ{name}ตั้งแต่เช้ามืด ไม่มีเสียงเคาะนำ คนในทางเดินได้ยินกันทุกห้อง ไม่มีใครเปิดประตูออกมา

    เย็นวันที่สาม ผัวมาขอยืมค้อนสองมือของ{name} บอกว่าหินชั้นในแข็งกว่าที่คิด ถ้าว่างช่วยจับสกัดให้สักบ่ายก็จะดี เขาไม่ได้ถามว่า{name}คิดอย่างไรกับเดือนนี้ อาจคิดไม่ถึงด้วยซ้ำ เขาโตมาในโรงหล่อ ส่วนเมียของเขามาจากที่ที่ไม่มีใครเคาะหิน
  choices:
    - id: stand_in_the_door
      label: บอกเขาตรงๆ ว่าเดือนนี้ไม่เจาะ แล้วยืนขวางประตูห้องเขาจนกว่าจะวางสว่าน
      text: |
        ผัวหน้าแดงขึ้นทันที บอกว่าลูกเขานอนไอทุกคืนเพราะห้องชื้น ใครจะมาเลี้ยงลูกให้ เขาผลัก{name}ครั้งหนึ่ง แรงพอให้หลังกระแทกวงกบ แล้วยืนหอบอยู่ตรงนั้น เมียของเขาอุ้มลูกออกมาดู เด็กร้อง

        เขาวางสว่านลงในคืนนั้น ไม่ได้วางเพราะเชื่อ วางเพราะคนในทางเดินเริ่มเปิดประตูออกมายืนดูทีละห้อง ทั้งสามคนเบียดกันอยู่ในห้องเดียวจนพ้นเดือน พอเหมืองเปิด เขาเคาะผนังสามที เบาจนแทบไม่ได้ยิน แล้วเจาะต่อ ทั้งฤดูนั้นเขาไม่ทัก{name}สักครั้ง หลังของ{name}เขียวเป็นทางยาวอยู่ครึ่งเดือน
      effects: { hp: -2, taboo: { stone: keep }, flags: [stopped_the_cold_drilling] }
    - id: hold_the_chisel
      label: หยิบค้อนสองมือไปจับสกัดให้เขาหนึ่งบ่าย
      text: |
        หินชั้นในแข็งจริง แข็งแบบหินที่ไม่มีใครแตะมานาน {name}จับสกัด ผัวทุบ เศษหินกระเด็นเข้าตาสองครั้ง ตกบ่ายผนังลึกเข้าไปได้หนึ่งช่วงแขน เมียของเขาต้มน้ำชาให้ ใส่น้ำตาลมากกว่าที่คนฮอร์ดุนใส่

        ห้องใหม่เสร็จก่อนเดือนหนาวจะหมด เล็ก เพดานต่ำ แต่เด็กนอนได้ ตอนกลางคืน{name}ได้ยินเสียงเด็กไอน้อยลงทุกคืน กับเสียงอีกอย่างที่ลึกกว่าเสียงไอ ดังมาจากผนังหินทางเดียวกัน เสียงหินลั่นช้าๆ ที่ไม่เคยได้ยินในทางเดินนี้มาก่อน
      effects: { stats: { STR: 1 }, taboo: { stone: break }, flags: [helped_carve_in_the_cold_month] }
    - id: shut_the_door
      label: ไม่ให้ยืมค้อน ไม่ห้าม ปิดประตูห้องตัวเอง
      text: |
        {name}บอกว่าค้อนหัวหลวม แล้วปิดประตู เสียงสว่านดังต่อไปอีกเก้าวัน คนในทางเดินไม่มีใครออกไปพูดอะไร ทุกคนปิดประตูเหมือนกัน

        ห้องใหม่เสร็จพอดีกับวันที่เหมืองเปิด ปลายเดือนต่อมา{name}เห็นรอยร้าวเส้นเท่าเส้นผมขึ้นบนผนังห้องตัวเอง ทางเดียวกับห้องใหม่ของคู่นั้น ไม่ยาวขึ้น ไม่หายไป ทุกคืนก่อนนอน{name}เอานิ้วไล่ตามมันหนึ่งครั้ง
      effects: { world: { land: 1 }, flags: [shut_the_door_on_the_drill] }
    - id: lend_the_storeroom
      label: สอนเขาเคาะ แล้วยกห้องเก็บของของตัวเองให้สามคนอยู่จนพ้นเดือน
      requires: { taboo: { id: stone, keeps: true } }
      text: |
        {name}พาผัวไปยืนหน้าผนังหลังห้องเขา วางข้อนิ้วซ้ายลงบนหิน เคาะสามที เว้นจังหวะเท่าลมหายใจ แบบที่คนแก่ในทางเดินเคยสอน แล้วบอกว่าเคาะแล้วต้องรอ รอจนเดือนนี้หมด ระหว่างรอ ห้องเก็บของของ{name}ว่างพอให้ปูที่นอนได้

        สามคนย้ายเข้าห้องเก็บของคืนนั้น ข้าวของของ{name}กองอยู่ในห้องนอนจนเดินชนทุกเช้า พอเหมืองเปิด ผัวเคาะผนังของตัวเองสามที เว้นจังหวะเท่ากันทุกครั้ง แล้วจึงเจาะ ห้องใหม่เสร็จก่อนหน้าร้อน วันย้ายออก เมียของเขาฝากผ้าห่มขนแกะไว้ให้หนึ่งผืน ทอเองตอนนั่งรอในห้องเก็บของ
      effects: { alignment: { moral: 1 }, taboo: { stone: keep }, flags: [lent_the_storeroom_for_the_cold_month] }

- id: adult.region_hordun_tools_left_below
  stage: adult
  scene: mine
  weight: 22
  when:
    age: [42, 60]
    location_tag: hordun
  text: |
    ปีนี้เหมืองชั้นสามถล่มสองครั้งในเดือนเดียว ไม่มีใครตาย คนงานสองคนขาหัก เกวียนสองคันฝังอยู่ใต้หิน บริษัทส่งไม้ค้ำมาเพิ่มสามเกวียน ช่างค้ำบอกว่าหินชั้นนั้นขยับเอง ไม่มีเหตุ ไม่มีน้ำซึม ไม่มีใครระเบิดผิดที่

    ยายดอร์บา ตระกูลบ่อเย็น นั่งอยู่บนม้านั่งหินที่ปากทางลงชั้นสามทุกเช้าตั้งแต่ครั้งที่สองถล่ม ตัวเล็กจนเท้าไม่ถึงพื้น นางเป็นคนเดียวในฮอร์ดุนที่ยังจำวิธีเก่าได้ทั้งหมด ใครเคยเจาะหินโดยไม่เคาะ หรือลงเหมืองในเดือนที่หนาว ให้ลงไปมือเปล่าถึงหน้าหินที่เคยเจาะ เคาะสามครั้งด้วยข้อนิ้ว แล้ววางเครื่องมือของตัวเองไว้ตรงนั้นทุกชิ้น จนพ้นเดือนที่หนาวที่สุดถัดไป ไม่ยืมใคร ไม่ซื้อใหม่ ใครหากินด้วยเครื่องมือก็อดไปจนกว่าจะได้คืน

    ยายไม่ได้ชี้ใคร นางพูดดังพอให้คนที่เดินผ่านได้ยิน เช้านี้นางพูดตอนที่{name}เดินผ่าน
  choices:
    - id: leave_the_tools
      label: ลงไปมือเปล่าถึงหน้าหินที่เคยเจาะ เคาะสามครั้ง แล้ววางเครื่องมือทุกชิ้นไว้ตรงนั้น
      requires: { taboo: { id: stone, unbroken: false } }
      text: |
        {name}ห่อเครื่องมือทุกชิ้นที่ใช้หากินลงผ้าผืนเดียว แบกไปถึงหน้าหินที่ตัวเองเคยฝืน ทางมืด ไม่มีตะเกียง เพราะยายบอกว่ามือเปล่าคือมือเปล่า {name}คลำผนังไปจนเจอรอยเก่าของตัวเอง วางข้อนิ้วลงบนหิน เคาะสามครั้ง เสียงเคาะหายเข้าไปในหินเหมือนหินกลืน แล้ววางห่อเครื่องมือลงที่พื้นตรงนั้น เดินกลับขึ้นมามือเปล่า

        เดือนต่อๆ มาจนพ้นเดือนหนาว{name}รับจ้างแบกของ ล้างหม้อ ทำทุกงานที่ไม่ต้องใช้เครื่องมือของตัวเอง เงินที่ได้ไม่ถึงครึ่งของที่เคยได้ วันแรกหลังพ้นเดือนหนาว{name}ลงไปเอาคืน ห่อผ้าอยู่ที่เดิม เย็นจนเกาะเกล็ดน้ำแข็งทั้งห่อ เครื่องมือข้างในไม่มีสนิมสักจุด ยายดอร์บาไม่ได้ถามว่าไปมาแล้วหรือยัง นางเลิกนั่งที่ม้านั่งหินตั้งแต่เช้าวันนั้น
      effects: { gold: -4, taboo: { stone: mend }, flags: [left_tools_at_the_face] }
    - id: knock_for_the_mine
      label: ลงไปเคาะหน้าหินที่ถล่มแทนคนทั้งเหมือง แล้ววางค้อนเล่มหนึ่งไว้
      requires: { taboo: { id: stone, unbroken: true } }
      text: |
        {name}ไม่ได้ฝืนอะไรที่นี่ แต่ไปถามยายว่าคนที่ไม่ได้ฝืนทำแทนเหมืองได้ไหม ยายบอกว่าได้ ไม่ล้างอะไรให้ใคร แต่หินจะรู้ว่ามีคนลงมาถาม

        หน้าหินที่ถล่มยังมีไม้ค้ำใหม่ตั้งเรียงเป็นแถว {name}เคาะสามครั้งตรงช่องระหว่างไม้ค้ำ แล้ววางค้อนเล็กของตัวเองไว้ที่โคนไม้ค้ำต้นสุดท้าย ค้อนเล่มนั้นใช้มานานจนด้ามเป็นรอยนิ้ว เดือนต่อมาชั้นสามไม่ถล่มอีก ช่างค้ำบอกว่าเพราะไม้ค้ำ
      effects: { gold: -1, taboo: { stone: keep }, world: { land: -1 }, flags: [knocked_for_the_mine] }
    - id: carry_dorba_down
      label: แบกยายดอร์บาลงไปให้นางเคาะเองถึงหน้าหินที่ถล่ม
      requires: { flag: origin_dwarf_clan }
      text: |
        ยายตัวเบากว่ากระสอบถ่าน แต่จับไหล่{name}แน่นจนเล็บจิกเนื้อ ทางลงชั้นสามมีสี่ร้อยกว่าขั้น ยายนับทุกขั้นออกเสียง พอถึงหน้าหินที่ถล่ม นางให้วางลง ยืนเองโดยไม่ต้องจับ แล้วเคาะสามครั้งด้วยข้อนิ้วที่งอไม่ตรงแล้ว

        นางเคาะแล้วรอ รอนานจนคนเฝ้าไม้ค้ำเริ่มกระสับกระส่าย แล้วบอกว่าพอ ขาขึ้น{name}แบกนางอีกครั้ง ยายไม่นับขั้นแล้ว นางเล่าเรื่องปู่ของ{name}ตอนยังหนุ่ม ว่าเคยลงไปเคาะแทนคนทั้งตระกูลในปีที่หนาวที่สุดที่นางจำได้
      effects: { stats: { STR: 1 }, taboo: { stone: keep }, world: { land: -1 }, flags: [carried_dorba_down] }
    - id: walk_past
      label: เดินผ่านไปทำงานตามปกติ
      text: |
        {name}เดินผ่านม้านั่งหินโดยไม่หยุด ยายดอร์บาพูดประโยคเดิมกับคนถัดไป แล้วคนถัดไป ทั้งเช้ามีคนหยุดฟังสองคน ไม่มีใครลงไปมือเปล่า

        บริษัทค้ำชั้นสามเพิ่มอีกสองแถว ถ่านขึ้นมาครบยอดที่บริษัทสั่ง ทุกเช้าที่{name}เดินผ่าน ยายยังนั่งอยู่ตรงนั้น เท้าไม่ถึงพื้น ห่มผ้าขนแกะสองผืน พูดประโยคเดิมด้วยเสียงเท่าเดิม จนกลายเป็นเสียงหนึ่งของปากเหมืองเหมือนเสียงโซ่กรงชัก
      effects: { flags: [walked_past_dorba] }

- id: adult.region_hordun_the_counting_engine
  stage: adult
  scene: station
  weight: 22
  when:
    age: [41, 56]
    location_tag: hordun
  text: |
    ใต้กำแพงสภาที่สลักหนี้สงครามไว้ทั้งแผ่น เป็นด่านชั่งเกวียนถ่านก่อนลงรางไปอาร์เวล คนนับเกวียนหกคนนั่งเรียงกันบนม้านั่งยาวที่ด่านนี้มาตั้งแต่ก่อนสงคราม ขีดดินสอหินลงกระดานชนวนทุกเกวียนที่ผ่าน ทุกเย็นยกกระดานไปให้เสมียนสภาคัดลงสมุดหนี้ ตัวเลขบนกำแพงยังสลักอยู่ตรงนั้น คนนับเกวียนนั่งหันหลังให้มันทั้งวัน

    เดือนนี้ด่านได้เครื่องนับทองเหลืองจากคาร์ดิน ตัวเท่าตู้เสื้อผ้า เฟืองหลายสิบตัวหมุนทุกครั้งที่ล้อเกวียนเหยียบแผ่นเหล็กบนราง ตัวเลขเลื่อนขึ้นเองในช่องกระจก ไม่มีดินสอหิน ไม่มีกระดาน ไม่ต้องคิดเลข สภาประกาศว่าจะเก็บคนไว้คนเดียว คอยดูเครื่อง คอยหยอดน้ำมัน คอยซ่อมเมื่อเฟืองติด ใครจะเป็นคนนั้น ให้ลองกันเองเดือนหนึ่ง ใครในฮอร์ดุนก็มาลองได้

    คนนับเกวียนรุ่นเก่ายืนกอดอกดูเครื่องอยู่ห่างๆ คนหนึ่งในนั้นนับเกวียนที่ด่านนี้มาตั้งแต่{name}ยังเด็ก
  choices:
    - id: learn_the_engine
      label: ขอเปิดฝาเครื่อง ไล่ดูทีละเฟืองจนรู้ว่ามันนับอย่างไร
      check: { stat: INT, dc: 14 }
      success:
        text: |
          ช่างจากคาร์ดินที่มาติดเครื่องยังไม่กลับ {name}ตามเขาทุกเย็นจนเขารำคาญแล้วยอมสอน เฟืองตัวใหญ่นับหนึ่ง เฟืองตัวที่สองนับสิบ ลวดขดตัวเล็กใต้แผ่นเหล็กคือตัวที่พังบ่อยที่สุด ปลายเดือน{name}ถอดลวดขดตัวนั้นเปลี่ยนเองได้ในเวลาที่เกวียนหนึ่งคันผ่าน

          สภาให้{name}เป็นคนดูเครื่อง ค่าแรงประจำทุกเดือน ไม่ต้องรอฤดู คนนับเกวียนรุ่นเก่ากลับบ้านไปห้าคน คนหนึ่งในนั้นเดินผ่านหน้าด่านทุกเช้า หยุดดูตัวเลขในช่องกระจกครู่หนึ่ง แล้วเดินต่อ
        effects: { gold: 2, stats: { INT: 1 }, flags: [keeps_the_counting_engine] }
      failure:
        text: |
          {name}ยื่นมือเข้าไปจับเฟืองตัวที่สองตอนที่มีเกวียนเหยียบแผ่นเหล็กพอดี เฟืองหมุนหนีบปลายนิ้วกลางไปครึ่งข้อ เลือดหยดลงในเครื่อง ช่างจากคาร์ดินต้องถอดเฟืองออกมาล้าง เครื่องหยุดนับไปครึ่งวัน

          สภาให้คนอื่นดูเครื่อง เล็บนิ้วกลางของ{name}ขึ้นใหม่เบี้ยวไปทางหนึ่ง ตั้งแต่นั้นทุกครั้งที่ผ่านด่าน{name}ได้ยินเสียงเฟืองหมุนก่อนได้ยินเสียงเกวียน
        effects: { hp: -1, flags: [caught_a_finger_in_the_engine] }
    - id: count_beside_it
      label: นั่งนับด้วยดินสอหินข้างเครื่องอีกหนึ่งเดือน โดยไม่มีใครจ้าง
      text: |
        {name}ยืมม้านั่งยาวตัวเดิมมานั่งข้างเครื่อง ขีดกระดานทุกเกวียนเหมือนคนนับรุ่นเก่า ปลายเดือนเอากระดานไปเทียบกับตัวเลขในช่องกระจก เครื่องนับขาดไปสิบเจ็ดเกวียน ทุกเกวียนที่ขาดคือเกวียนที่ต่อพ่วงกันสองคันแล้วล้อเหยียบแผ่นเหล็กพร้อมกัน

        สภาเรียก{name}ไปถาม เสมียนเปิดสมุดหนี้ คิดว่าสิบเจ็ดเกวียนต่อเดือนหักหนี้ได้เท่าไร แล้วปิดสมุด สภาให้มีคนนับด้วยดินสอหินนั่งข้างเครื่องต่อไปอีกหนึ่งคน คนนับรุ่นเก่าคนที่นับมาตั้งแต่{name}ยังเด็กได้ม้านั่งนั้นคืน
      effects: { gold: -1, stats: { WIS: 1 }, flags: [counted_beside_the_engine] }
    - id: leave_it
      label: ปล่อยให้คนนับรุ่นเก่าแย่งกันเอง ไม่เข้าไปยุ่ง
      text: |
        {name}ทำงานของตัวเองไปทั้งฤดู เดินผ่านด่านก็ไม่หยุด ไม่ได้ไปดูว่าใครได้ดูเครื่อง

        ปลายฤดูมีคนบอกว่าสภาให้หลานของเสมียนดูเครื่อง เด็กหนุ่มที่ไม่เคยนั่งม้านั่งยาวสักวัน คนนับรุ่นเก่าห้าคนไปรับจ้างที่ท่าเกวียน งานที่นั่นไม่ต้องนับอะไร ยกกระสอบขึ้น วางกระสอบลง คนหนึ่งยกไม่ไหว นั่งนับกระสอบให้คนอื่นแทน ไม่มีใครจ้างให้นับ
      effects: { flags: [left_the_count_to_others] }
    - id: clan_count
      label: เสนอให้ตระกูลสลักตัวเลขของตัวเองลงหินทุกสิ้นเดือน เทียบกับเครื่อง
      requires: { flag: origin_dwarf_clan }
      text: |
        ตระกูลคนแคระสลักสัญญาลงหินมาก่อนมีกระดาษ ผู้อาวุโสของตระกูลฟังแล้วเห็นด้วยตั้งแต่ประโยคแรก หนี้ที่สลักอยู่บนกำแพงสภาสลักด้วยมือคนแคระ ตัวเลขที่หักหนี้ก็ควรสลักด้วยมือคนแคระเหมือนกัน ไม่ใช่เลื่อนอยู่ในช่องกระจกของเครื่องจากคาร์ดิน

        แผ่นหินแผ่นแรกตั้งอยู่ข้างด่าน ข้างเครื่องทองเหลือง {name}สลักตัวเลขเดือนแรกเองต่อหน้าคนนับรุ่นเก่า ตัวเลขบนหินกับในช่องกระจกไม่ตรงกัน หินมากกว่า สภาไม่ได้ตอบว่าจะเชื่ออันไหน แผ่นที่สองตั้งข้างกันในเดือนต่อมา
      effects: { alignment: { law: 1 }, reputation: { dwarf_council: 1 }, flags: [clan_carved_its_own_count] }

- id: adult.region_hordun_lamps_at_the_pillar_wall
  stage: adult
  scene: temple
  weight: 22
  when:
    age: [44, 60]
    location_tag: hordun
  people:
    - { id: hordun_neighbour, name: บรัมดุก ตระกูลเชือกแปด, gender: m, race: dwarf, bond: friend, closeness: 1, age: 120 }
  text: |
    วันแรกหลังพ้นเดือนที่หนาวที่สุด ตอนที่เหมืองทั้งฮอร์ดุนเปิดและทุกคนเคาะหินพร้อมกัน คนในทางเดินเดียวกันจะขึ้นไปที่ผนังเสาของออสซา ไปหาช่องศพของคนในทางเดินที่ตายไปแล้ว ปัดเขม่าที่เกาะหน้าแผ่นหินมาทั้งปี จุดตะเกียงน้ำมันดวงเล็กไว้หน้าช่องละดวง แล้วลงสิ่วสลักชื่อที่ตื้นที่สุดให้ลึกขึ้นอีกชั้น คนถือสิ่วคือคนที่แก่ที่สุดของทางเดิน คนถือตะเกียงคือคนรองลงมา

    ปีนี้คนที่แก่ที่สุดของทางเดินเข่าไม่ดี ขึ้นบันไดไปถึงผนังเสาไม่ไหวแล้ว บรัมดุก ตระกูลเชือกแปด ห้องตรงข้ามกับ{name} ต้องถือสิ่วเป็นปีแรก มือของเขาสั่นมาตั้งแต่ปีที่เตาของตระกูลระเบิด ถือค้อนตีเหล็กได้ ถือสิ่วเล็กไม่นิ่ง

    เช้ามืด เขายืนรออยู่หน้าห้องของ{name} ถือกล่องสิ่วของทางเดินไว้สองมือ กับตะเกียงดวงเล็กที่ยังไม่จุดอีกหนึ่งถุง เขาบอกว่าคนรองจากเขาในทางเดินนี้ลงไปคาร์ดินตั้งแต่หน้าร้อน ยังไม่กลับ ธรรมเนียมให้คนถือสิ่วเลือกคนถือตะเกียงเองได้ เขาเลือกห้องตรงข้าม
  choices:
    - id: hold_the_chisel
      label: รับสิ่วแทนเขา ให้เขาถือตะเกียงแล้วชี้ชื่อ
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          บรัมดุกเดินนำขึ้นบันไดผนังเสา ชี้ช่องทีละช่อง อ่านชื่อให้ฟังทีละชื่อ {name}วางสิ่วลงในร่องตัวอักษรเดิม เคาะเบาๆ ตามร่องที่คนแก่กว่าเคยเคาะมาแล้วหลายรอบ ไม่สร้างร่องใหม่ ชื่อที่ตื้นที่สุดลึกขึ้นทีละชื่อ

          ช่องสุดท้ายเป็นช่องของพ่อบรัมดุก ชื่อยังใหม่ ไม่ต้องสลักอะไร บรัมดุกจุดตะเกียงไว้หน้าช่องเอง มือสั่นจนต้องจุดสามครั้ง {name}ไม่ช่วย ยืนถือสิ่วรออยู่ข้างหลัง
        effects: { stats: { DEX: 1 }, people: [{ id: hordun_neighbour, closeness: 1 }], flags: [cut_the_names_at_the_pillar] }
      failure:
        text: |
          ชื่อที่สามจากล่างเก่าจนร่องตัวอักษรเกือบหายไปในเนื้อหิน สิ่วของ{name}ลื่นออกนอกร่องไปทางขวา กินเนื้อหินระหว่างตัวอักษรสองตัวไปเท่าเล็บ ชื่อนั้นอ่านเป็นชื่ออื่นได้ถ้าไม่รู้มาก่อน

          บรัมดุกไม่ว่าอะไร เขาป้ายเขม่าตะเกียงลงในรอยที่เกิน ให้ดำเท่ากับร่องตัวอักษร แล้วบอกว่าปีหน้าค่อยให้ช่างหินของตระกูลขึ้นมาแก้ ค่าช่างหนึ่งเหรียญ {name}จ่ายเองตั้งแต่วันนั้น
        effects: { gold: -1, flags: [cut_the_names_at_the_pillar, slipped_on_an_old_name] }
    - id: hold_the_lamp
      label: ถือตะเกียงแล้วอ่านชื่อให้ เขาสลักเองช้าๆ
      text: |
        {name}จุดตะเกียงทีละดวง วางหน้าช่องละดวง แล้วยืนอ่านชื่อที่ตื้นที่สุดออกเสียงให้บรัมดุกได้ยินทีละพยางค์ เขาสลักช้า หยุดพักมือทุกสามเคาะ กว่าจะครบทุกช่องตะเกียงดวงแรกก็หมดน้ำมัน

          ขากลับเขาบอกว่าชื่อคนแคระรุ่นเก่าออกเสียงยาก คนในทางเดินเองยังอ่านผิดกันอยู่ แต่{name}อ่านถูกทุกชื่อตั้งแต่ครั้งแรก {name}บอกว่าเพราะได้ยินคนแก่อ่านมาทุกปี
      effects: { stats: { WIS: 1 }, people: [{ id: hordun_neighbour, closeness: 1 }], flags: [read_the_names_at_the_pillar] }
    - id: one_more_lamp
      label: ซื้อตะเกียงเพิ่มอีกดวง จุดให้คนของ{name}เองที่ไม่มีช่องอยู่ที่ไหนเลย
      text: |
        บรัมดุกไม่ถามว่าให้ใคร เขาชี้ที่ว่างตรงขอบล่างสุดของผนังส่วนของทางเดิน ที่ที่ไม่มีช่อง ไม่มีชื่อ บอกว่าคนในทางเดินใช้ตรงนั้นวางตะเกียงให้คนที่ตายไกลบ้านมาตั้งแต่ก่อนเขาเกิด

          {name}จุดตะเกียงวางลงตรงนั้น ไม่ได้พูดชื่อออกเสียง เปลวไฟเอียงไปทางเดียวกับตะเกียงดวงอื่นทั้งแถว ตามลมที่ไหลลงจากยอดเสา ปีต่อมา{name}ซื้อตะเกียงสองดวงตั้งแต่ก่อนบรัมดุกจะมาเคาะประตู
      effects: { gold: -1, alignment: { moral: 1 }, flags: [lit_a_lamp_for_own_dead] }
    - id: lead_the_knock
      label: ยืนหน้าทางเดินที่ผนังเสา แล้วเคาะหินนำทุกคนสามครั้งแบบที่ผู้อาวุโสเคยเคาะ
      requires: { flag: origin_dwarf_clan }
      text: |
        ก่อนจะลงสิ่ว คนในทางเดินต้องเคาะผนังเสาพร้อมกันสามครั้ง คนแก่ที่สุดเคาะนำ บรัมดุกมองมือตัวเอง แล้วมองหน้า{name} {name}จึงไปยืนตรงที่คนแก่เคยยืน วางข้อนิ้วลงบนหินเย็น เคาะครั้งแรก เสียงข้อนิ้วอีกยี่สิบกว่าคนตามมาพร้อมกันจนเป็นเสียงเดียว

          ครั้งที่สามเงียบกว่าสองครั้งแรก ทุกคนรู้ว่าต้องเบาลง ไม่มีใครสอน บรัมดุกลงสิ่วได้นิ่งกว่าที่กลัว ขากลับเด็กคนหนึ่งในทางเดินเดินตาม{name} เคาะผนังบันไดสามครั้งทุกสิบขั้น จนแม่ต้องจับมือไว้
      effects: { stats: { CHA: 1 }, people: [{ id: hordun_neighbour, closeness: 1 }], flags: [led_the_corridor_knock] }
