# วัยกลางคน เค้ากลางคืนกับสัญญาหลับ (ชุด 4) สายเรื่องที่ผูกกันด้วย flag
# เค้ากลางคืนออกจากฟ้าเหนือแดนเถ้าไม่ได้ คนไปหามัน มันไม่มาหาใคร ทุกฉากที่มันพูดจึงเกิดใต้ฟ้าแดนเถ้าในคืนเดือนดับ
#   คนที่ไม่ได้อยู่แดนเถ้าเดินทางไปเอง ข้อความเล่าทางไปสั้นๆ
# มันพูดช้า เว้นช่วงนาน เรียกของด้วยชื่อก่อนมีเทพ: หมุด (เสาฟ้า) ผู้มาทีหลัง (เทพ) ผู้เช่า (คน) ค่าเช่า (ข้อห้าม)
# มันไม่อยู่ข้างใคร และเจ็บทุกครั้งที่ดาวดวงใหม่ขึ้น
# ลำดับ: over_the_roofs / word_on_the_old_road → first_words → the_counting → the_sleep_pact
#   → new_star, borrowed_fire, lamp_hunter, asks_a_messenger → question_laid_down → answer_carried_back → the_price
# word_on_the_old_road กัน origin_ashland เพราะเงื่อนไขของเหตุการณ์บอกไม่ได้ว่า "ไม่ได้อยู่แดนเถ้า" (คนแดนเถ้าไปถึงมันทางฉากแรกอยู่แล้ว)
# answer_carried_back ทุกตัวเลือกตั้ง heard_what_the_ground_said ให้ the_price ออกหลังฉากนี้เสมอ

- id: adult.owl_over_the_roofs
  stage: adult
  weight: 16
  scene: land_night
  time: night
  when:
    age: [18, 60]
    location_tag: ashland
  text: |
    คืนเดือนดับ {name}กลับถึงหมู่บ้านช้าไปครึ่งยาม บ้านทุกหลังชักบันไดขึ้นไปหมดแล้ว ไม่มีไฟสักดวงลอดออกมาจากใต้ชายคา คนในแดนเถ้าไม่จุดไฟให้คนข้างนอกเห็นในคืนแบบนี้ และไม่มีใครเงยหน้า

    ลมพัดลงมาจากข้างบน ไม่ได้พัดมาจากทิศไหน ลมอุ่น หนัก มีกลิ่นขี้เถ้ากับขนนก ดาวเหนือหลังคาบ้านหลังสุดท้ายดับไปเป็นแถบ แถบนั้นกว้างขึ้นเรื่อยๆ จนกินฟ้าไปครึ่งผืน แล้วเสียงหนึ่งก็ดังผ่านเหนือหัว เสียงปีกกระพือครั้งเดียว ช้าเท่าลมหายใจของภูเขา

    ดินเถ้าใต้เท้าสะเทือนตามเสียงนั้น หมาเถ้าที่หอนอยู่ไกลๆ หยุดหอนพร้อมกันทุกตัว
  choices:
    - id: sit_head_down
      label: นั่งลงตรงนั้น ก้มหน้าจนคางชิดอก ไม่ขยับจนกว่าจะเช้า
      text: |
        {name}นั่งลงบนเถ้า กอดเข่า ก้มหน้า ลมอุ่นพัดผ่านลงมาอีกสามครั้งตลอดคืน ทุกครั้งห่างกันนานพอให้ขาชาจนลืมไปว่ามีขา น้ำค้างลงจับหลังมือเป็นเกล็ด ครั้งหนึ่งมีเสียงหมาเถ้าเดินมาดมห่างแค่ช่วงแขน แล้วเดินจากไปเงียบๆ เหมือนมีใครเรียก

        ฟ้าสางคนบนเรือนหลังสุดท้ายหย่อนบันไดลงมาเห็น{name}นั่งอยู่ตรงนั้น เถ้ารอบตัวโดนลมกวาดเป็นวงเรียบ กว้างเท่าลานนวดข้าว ไม่มีรอยเท้าสักรอย นอกจากรอยของ{name}เอง
      effects: { stats: { CON: 1 }, taboo: { night: keep }, flags: [sat_under_the_owl] }
    - id: look_up
      label: เงยหน้าขึ้นดู
      text: |
        {name}เงยหน้า ข้างบนเป็นกลางคืน กลางคืนที่มีขอบ ขอบนั้นโค้งไปจนสุดสายตาทั้งสองข้าง ข้างในขอบไม่มีดาวสักดวง ข้างนอกขอบดาวยังอยู่ครบ แล้วขอบนั้นก็เคลื่อนผ่านไปทางตอเสา ช้าๆ ดาวที่ดับไปค่อยๆ กลับมาทีละแถว

        หลังจากคืนนั้น{name}ปวดคออยู่ทั้งสัปดาห์ หันหน้าไปทางไหนก็ปวด เว้นแต่ตอนก้มหน้ามองดิน
      effects: { taboo: { night: break }, flags: [looked_up_at_the_dark_moon_sky] }
    - id: whistle_for_a_ladder
      label: วิ่งไปเรือนที่ใกล้ที่สุด ผิวปากสั้นสั้นยาวเรียกบันได
      text: |
        {name}ผิวปากจนลมหมดปอด สั้น สั้น ยาว สั้น สั้น ยาว เรือนหลังที่ใกล้ที่สุดหย่อนบันไดลงมาครึ่งทาง ไม่มีใครโผล่หน้า {name}ปีนขึ้นไปด้วยขาที่ยังสั่น คนในเรือนชักบันไดตามขึ้นมาทันที แล้วนั่งก้มหน้ากันทั้งบ้านจนเช้า

        ไม่มีใครถามว่าไปทำอะไรมา เจ้าของเรือนยื่นผ้าห่มให้ผืนหนึ่ง ผ้าห่มมีกลิ่นควันกับกลิ่นแพะ
      effects: { flags: [ran_in_from_the_dark_moon] }

- id: adult.owl_word_on_the_old_road
  stage: adult
  weight: 30
  when:
    age: [28, 60]
    flags: [land_boon_taken]
    not_location_tag: ashland
    not_flags: [sat_under_the_owl, origin_ashland]
  text: |
    คนแปลกหน้ามานั่งพักที่ข้างประตูบ้าน{name}ตอนบ่าย รองเท้าหนังพันด้วยผ้าหลายชั้น ไม้เท้าสึกจนเหลือแค่ครึ่ง ไม่ได้ขออะไร พอ{name}ยื่นน้ำให้ เขาดื่มหมดถ้วยแล้วพูดขึ้นมาเฉยๆ ด้วยสำเนียงที่ไม่ใช่ของถิ่นไหน

    เขาบอกว่าเดินทางสายเก่า สายที่มีก่อนถนนหลวง รับฝากคำพูดจากปากคนหนึ่งไปบอกอีกคนหนึ่ง ไม่เขียนอะไรลงกระดาษ คำที่ฝากมาครั้งนี้ไม่ได้มาจากปากคน มาจากทางตะวันออก ไกลไปจนสุดทางที่แดนเถ้า

    "คนที่แผ่นดินรู้จักแล้ว" เขาท่องเหมือนท่องสิ่งที่จำมาทีละคำ "เชิญมา คืนเดือนดับ ใต้ฟ้าที่ไม่มีหมุด" แล้วเขาก็ลุก ขอบใจเรื่องน้ำ เดินต่อไปทางเดิม ไม่ได้บอกว่าใครเป็นคนฝาก
  choices:
    - id: go_east
      label: ออกเดินทางไปทางตะวันออก ให้ทันคืนเดือนดับ
      text: |
        ทางไปแดนเถ้ากินเวลาเกือบเดือน ค่าเกวียน ค่าที่นอน ค่าคนนำทางช่วงสุดท้ายที่พาเดินอ้อมแนวหินของป้อม รวมสามเหรียญ คนนำทางเป็นทีฟลิ่งเขาหักข้างหนึ่ง สอนสองอย่างระหว่างทาง ไม่ชี้ดาว ไม่เงยหน้าในคืนเดือนดับ เขาบอกว่าใต้ฟ้านี้ค่าเช่ามีแค่นั้น

        คืนเดือนดับ{name}นั่งก้มหน้าอยู่บนเถ้านอกหมู่บ้านคนเดียว ลมอุ่นพัดลงมาจากข้างบน ดาวดับไปครึ่งฟ้า แล้วกลับมา {name}ไม่เงยหน้าสักครั้งจนฟ้าสาง เถ้ารอบตัวโดนลมกวาดเป็นวงเรียบ
      effects: { gold: -3, taboo: { night: learn }, flags: [sat_under_the_owl, went_east_for_the_owl] }
    - id: stay_home
      label: ไม่ไป งานที่บ้านรอไม่ได้
      text: |
        {name}เก็บถ้วยน้ำเข้าบ้านแล้วทำงานต่อจนมืด คืนเดือนดับมาถึงอีกครั้งตอนปลายเดือน {name}นอนไม่หลับ ลุกขึ้นมานั่งข้างหน้าต่างจนดึก ดาวบนฟ้าครบทุกดวง

        ปีต่อมามีคนเดินทางเก่าผ่านมาอีกคน ไม่ใช่คนเดิม เขานั่งพักที่ข้างประตูเดิม ดื่มน้ำ แล้วเดินต่อไป ไม่ได้เอ่ยถึงคำฝากของใครสักคำ
      effects: { flags: [stayed_home_from_the_old_road] }
    - id: send_word_back
      label: วิ่งตามไปฝากคำตอบกลับไปกับเขา
      text: |
        {name}วิ่งตามไปทันที่หัวถนน คนเดินทางเก่าหยุดฟังโดยไม่หันมา {name}ฝากไปว่ายังไปไม่ได้ ปีนี้ยังไม่ได้ เขาท่องทวนคำนั้นสองรอบ ช้าๆ ทีละคำเหมือนตอนท่องมา แล้วเดินต่อไปทางตะวันออก

        {name}ไม่รู้ว่าคำนั้นไปถึงหรือเปล่า ไม่รู้ว่าใครจะเป็นคนฟัง คืนเดือนดับถัดมาลมพัดลงมาจากข้างบนครั้งหนึ่ง อุ่นผิดฤดู
      effects: { flags: [sent_word_back_on_the_old_road] }

- id: adult.owl_first_words
  stage: adult
  weight: 120
  scene: land_night
  time: night
  when:
    age: [20, 66]
    flags: [sat_under_the_owl]
  text: |
    {name}กลับไปนั่งที่เดิมอีกในคืนเดือนดับคืนหนึ่ง ไม่มีใครเรียก ตอบตัวเองไม่ได้ว่ากลับไปทำไม ลมอุ่นพัดลงมาจากข้างบนตั้งแต่หัวค่ำ ดาวดับไปครึ่งฟ้า แล้วไม่กลับมา มันไม่ได้บินผ่าน มันลงมาเกาะ

    เสียงนั้นไม่ได้ดังลงมาจากข้างบน มันดังขึ้นมาจากเถ้าใต้ฝ่ามือ ทุ้มและช้า เหมือนลมผ่านปากเหมืองร้าง คำแรกกับคำที่สองห่างกันนานพอให้น้ำค้างลงจับหลังมือ

    "ผู้เช่า" มันว่า แล้วเว้นไปนาน "จ่าย ค่าเช่า อะไร มาแล้ว บ้าง"
  choices:
    - id: tell_it_true
      label: ก้มหน้าตอบตามจริง ข้อที่จ่ายและข้อที่ค้าง
      text: |
        {name}ตอบไปทีละข้อ ข้อไหนถือมาตลอด ข้อไหนเคยฝืน ข้อไหนไม่เคยรู้ว่ามีอยู่ด้วยซ้ำ เสียงตัวเองฟังเล็กเท่าเสียงแมลงในหญ้า เค้ากลางคืนฟังจนจบ ไม่ขัด

        "ผู้เช่า ที่นับ ของตัวเอง" มันว่าหลังจากนั้นนาน "มี น้อย" แล้วลมอุ่นก็พัดลงมาอีกครั้ง เถ้ารอบตัว{name}เรียบเป็นวงเหมือนคืนแรก
      effects: { stats: { WIS: 1 }, taboo: { night: keep }, flags: [spoke_with_the_owl, told_the_owl_the_truth] }
    - id: say_all_paid
      label: ตอบว่าจ่ายครบทุกข้อ ไม่เคยค้าง
      text: |
        {name}ตอบเสียงดังกว่าที่ตั้งใจ เค้ากลางคืนเงียบไปนานจนดาวที่ขอบฟ้าเคลื่อนไปหนึ่งนิ้ว แล้วเสียงหนึ่งก็ดังขึ้นมาจากเถ้า ต่ำ สั้น ฟังเหมือนเสียงหัวเราะของภูเขา

        "ผู้มาทีหลัง ก็ พูด อย่างนั้น" มันว่า แล้วไม่ถามอะไรอีกจนเช้า
      effects: { flags: [spoke_with_the_owl, told_the_owl_all_was_paid] }
    - id: the_land_knows_me
      label: ก้มหน้าบอกมันว่าแผ่นดินที่บ้านรู้จักชื่อแล้ว
      requires: { flag: land_boon_taken }
      text: |
        {name}เล่าเรื่องเช้าวันนั้น ของที่เปลี่ยนไปเองโดยไม่มีใครทำ เล่าไม่ถูกว่าจะเรียกมันว่าอะไร เค้ากลางคืนฟังแล้วเงียบไปนาน ลมอุ่นพัดลงมาหนึ่งครั้ง ดมเหมือนสัตว์ใหญ่ดมกลิ่นลูกของตัวอื่น

        "ตัว ที่หลับ ใกล้บ้าน เจ้า" มันว่า "ยัง จำ ได้ ว่า ผู้เช่า หน้าตา เป็น อย่างไร" เสียงนั้นช้าลงอีกตอนพูดคำสุดท้าย
      effects: { taboo: { night: keep }, flags: [spoke_with_the_owl, named_the_land_that_knows_me] }
    - id: answer_as_ash_folk
      label: ตอบแบบที่คนเดินกลางคืนสอนมา ไม่ชี้ ไม่นับ ไม่เงย
      requires: { flag: origin_ashland }
      text: |
        {name}ตอบสามคำ คำที่คนเดินกลางคืนของหมู่บ้านสอนเด็กทุกคนก่อนจะให้ลงจากเรือนตอนมืดได้ ไม่ชี้ ไม่นับ ไม่เงย ตอบแล้วก็ก้มหน้าต่อ

        "ผู้เช่า ใต้ ข้า" เค้ากลางคืนว่า เว้นไปนาน "จ่าย ตรง ทุก คืน" ลมอุ่นพัดลงมาแตะท้ายทอยครั้งหนึ่ง เบาเหมือนผ้าห่มที่มีคนดึงขึ้นมาคลุมให้
      effects: { taboo: { night: keep }, flags: [spoke_with_the_owl, answered_as_the_ash_folk_do] }

- id: adult.owl_the_counting
  stage: adult
  weight: 120
  scene: land_night
  time: night
  when:
    age: [20, 66]
    flags: [spoke_with_the_owl]
  text: |
    คืนเดือนดับอีกคืน เค้ากลางคืนลงมาเกาะเร็วกว่าเคย ลมอุ่นที่พัดลงมาวันนี้มีอะไรบางอย่างไม่เหมือนเดิม กระตุกเป็นช่วงๆ เหมือนลมหายใจของคนที่ข้อเท้าแพลง

    "ผู้เช่า" มันว่า เว้นนาน "คืนนี้ ดาว มี กี่ดวง"

    {name}ก้มหน้าอยู่ ไม่เห็นดาวสักดวง แต่ทุกคนที่เคยอยู่แดนเถ้ารู้ว่าคำถามนี้ตอบเป็นตัวเลขไม่ได้ คนเดินกลางคืนสอนกันมาว่าไม่นับดาวออกเสียง ไม่ว่าใครจะถาม ไม่มีใครบอกว่าถ้าคนที่ถามคือกลางคืนเองจะต้องทำอย่างไร
  choices:
    - id: will_not_count
      label: บอกมันตรงๆ ว่านับให้ไม่ได้
      text: |
        {name}ตอบว่าผู้เช่านับดาวออกเสียงไม่ได้ เป็นค่าเช่า เค้ากลางคืนเงียบไปนาน ลมอุ่นกระตุกอีกครั้งหนึ่ง แล้วนิ่ง

        "ดี" มันว่า คำเดียว ทั้งคืนหลังจากนั้นไม่ถามอะไรอีก ตอนฟ้าสาง {name}ได้ยินเสียงปีกกระพือหนึ่งครั้งไปทางตอเสา หนักกว่าทุกครั้งที่เคยได้ยิน
      effects: { taboo: { night: keep }, flags: [would_not_count_for_the_owl] }
    - id: answer_without_numbers
      label: ตอบโดยไม่ใช้ตัวเลข
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}คิดอยู่พักใหญ่ แล้วตอบว่ามากกว่าเมื่อคืนก่อน และเมื่อคืนก่อนก็มากกว่าคืนก่อนหน้านั้น เค้ากลางคืนไม่ตอบ ลมอุ่นพัดลงมาครั้งหนึ่ง ยาวกว่าทุกครั้ง

          "เจ้า รู้" มันว่า "โดย ไม่ ต้อง นับ" ดาวแถบหนึ่งที่ขอบฟ้าดับลงช้าๆ ใต้ปีกของมัน แล้วไม่กลับมาจนเช้า
        effects: { stats: { WIS: 1 }, taboo: { night: keep }, flags: [answered_the_owl_without_numbers] }
      failure:
        text: |
          {name}เริ่มตอบด้วยคำว่ามากกว่า แล้วลิ้นก็พาไปเองอย่างลิ้นของคนที่นับของมาทั้งชีวิต ตัวเลขตัวแรกหลุดออกมาครึ่งคำ {name}กัดลิ้นตัวเองไว้ทัน ไม่ทันพอ

          ลมอุ่นหยุดพัดกลางคัน ดาวทั้งฟ้ากลับมาพร้อมกันในอึดใจเดียว เค้ากลางคืนไม่อยู่ตรงนั้นแล้ว
        effects: { taboo: { night: break }, flags: [half_counted_for_the_owl] }
    - id: count_aloud
      label: เงยหน้าขึ้นนับให้มันตามที่ขอ
      text: |
        {name}เงยหน้า ข้างบนครึ่งฟ้าเป็นกลางคืนที่มีขอบ อีกครึ่งมีดาวขึ้นหนา {name}เริ่มนับจากดวงที่ใกล้ขอบที่สุด ออกเสียงทีละดวง ช้าๆ อย่างที่เด็กนับเม็ดถั่ว

        นับไปได้ไม่ถึงสิบ ขอบของกลางคืนก็สะดุ้ง สะดุ้งอย่างสัตว์ที่โดนเข็ม ลมอุ่นพัดลงมาแรงจน{name}ล้มหงาย พอลุกขึ้นได้ ฟ้าเปิดทั้งผืน เค้ากลางคืนไปแล้ว
      effects: { taboo: { night: break }, flags: [counted_the_stars_aloud_for_it] }

- id: adult.owl_the_sleep_pact
  stage: adult
  weight: 120
  scene: land_night
  time: night
  mark: ได้ฟังสัญญาหลับ
  when:
    age: [22, 68]
    flags: [spoke_with_the_owl]
    taboo: { id: night, keeps: true }
    not_traits: [old_night]
  text: |
    คืนนั้นเค้ากลางคืนลงมาเกาะบนตอเสา ไม่ใช่บนฟ้า ใกล้จน{name}ได้ยินเสียงขนปีกเสียดกันเหมือนเสียงทรายไหล มันเริ่มพูดโดยไม่มีใครถาม เสียงนั้นช้ากว่าทุกคืน ทุกคำวางลงทีละคำอย่างคนวางหินทับหลุมศพ

    "ก่อน ผู้มาทีหลัง" มันว่า "แผ่นดิน มี เจ้าของ แล้ว เจ็ด ตน ผู้มาทีหลัง มา ขอ ที่ ไม่ได้ รบ ทำ สัญญา" มันเว้นไปนานพอให้หมาเถ้าที่ไหนสักแห่งหอนจนจบเพลง "ข้อ หนึ่ง พวกข้า หลับ ยอม ให้ ปัก หมุด ลง บน ที่นอน ข้อ สอง ผู้มาทีหลัง กาง เปลือก กัน ความมืด ข้างนอก ข้อ สาม ผู้เช่า จ่าย ค่าเช่า เจ็ด อย่าง"

    แล้วมันหยุด เหมือนคนที่เล่าเรื่องเดิมมาสามพันปีแล้วนึกขึ้นได้ว่ายังเหลืออีกยาว "ตรงนี้ ผู้มาทีหลัง สาบาน ยาว มาก" มันว่า "ข้า ข้าม" เค้ากลางคืนหาว ทั้งฟ้าหาวตาม ดาวแถบหนึ่งดับไปครู่หนึ่งแล้วกลับมา

    "สัญญา ไม่มี วัน หมด" มันว่าต่อ ช้าลงอีก "มี ข้อเลิก ข้อ เดียว ถ้า เปลือก ขาด และ ค่าเช่า ขาด พวกข้า ไม่ต้อง หลับ ต่อ" มันเว้นไปนานที่สุดตั้งแต่เริ่มพูด "เปลือก ขาด แล้ว ตั้งแต่ ดาว ดวงใหม่ ดวงแรก ค่าเช่า" ลมอุ่นพัดลงมาหนึ่งครั้ง "ข้า ยัง นับ อยู่"
  choices:
    - id: listen_to_the_end
      label: ก้มหน้าฟังจนมันพูดจบ มือวางนิ่งบนเข่า
      text: |
        {name}ไม่ขยับนิ้วสักนิ้ว ตั้งแต่คำแรกจนคำสุดท้าย พอมันพูดจบ เค้ากลางคืนก็เงียบไปเฉยๆ ไม่มีคำลา ไม่มีคำสั่ง มันขยับปีกจัดขนเหมือนนกที่เพิ่งกินอิ่ม แล้วถามขึ้นมาว่า "เจ้า หนาว ไหม"

        {name}ตอบว่าหนาว มันว่าดี แล้วลมอุ่นก็พัดลงมาคลุม{name}ไว้จนเช้า ตั้งแต่คืนนั้น นิ้วชี้ข้างขวาของ{name}งอเข้าหาฝ่ามือเองทุกครั้งที่อยู่ใต้ฟ้าเปิด
      effects: { traits: [old_night], flags: [heard_the_sleep_pact] }
    - id: point_at_the_first_star
      label: ยกนิ้วขึ้นชี้ฟ้าตอนมันพูดถึงดาวดวงใหม่ดวงแรก
      text: |
        คำว่าดาวดวงใหม่ดวงแรกออกมา มือของ{name}ยกขึ้นเองก่อนจะคิดทัน นิ้วชี้ขึ้นไปทางฟ้า ทางที่คนเมืองชี้ให้เด็กดูดาวที่สว่างที่สุด

        เค้ากลางคืนพูดต่อจนจบประโยค ไม่ช้าลง ไม่เร็วขึ้น แล้วบินขึ้นจากตอเสาโดยไม่บอกอะไร ลมจากปีกของมันพัด{name}คว่ำหน้าลงไปในเถ้า ในปากมีแต่รสขี้เถ้าเย็นๆ จนเช้า
      effects: { taboo: { night: break }, flags: [heard_the_sleep_pact, pointed_during_the_pact] }
    - id: leave_before_the_end
      label: ลุกขึ้นกลับก่อนมันพูดจบ
      text: |
        ตอนมันพูดถึงข้อเลิก {name}ลุกขึ้น ขาชาจนเกือบล้ม เดินกลับทางหมู่บ้าน หน้ายังก้มอยู่ ข้างหลังเสียงนั้นยังพูดต่อ ช้า ทีละคำ ไม่ได้ดังขึ้น ไม่ได้ตามมา

        {name}ได้ยินคำว่า ข้า ยัง นับ อยู่ ตอนเดินมาไกลแล้ว ไกลพอที่จะบอกตัวเองว่าได้ยินผิด
      effects: { flags: [left_before_the_pact_was_told] }

- id: adult.owl_new_star
  stage: adult
  weight: 20
  scene: land_night
  time: night
  when:
    age: [22, 64]
    flags: [heard_the_sleep_pact]
  text: |
    คืนเดือนดับ{name}นั่งก้มหน้าอยู่ใต้มันอีกครั้ง เค้ากลางคืนเกาะอยู่บนฟ้า เงียบมาตั้งแต่หัวค่ำ ลมอุ่นพัดลงมาเป็นจังหวะช้าๆ เหมือนลมหายใจคนหลับ

    ใกล้เที่ยงคืน แสงหนึ่งตกลงบนเถ้าข้างหน้า{name} แสงขาว เย็น บางจนแทบมองไม่เห็น มาจากข้างบนตรงที่ไม่เคยมีดาว แล้วกลางคืนทั้งผืนก็สะดุ้ง ลมกระชากหนึ่งครั้งจนเถ้าลอยขึ้นเป็นม่าน เสียงหนึ่งดังขึ้นมาจากพื้น ไม่ใช่คำพูด เหมือนเสียงสัตว์ใหญ่ที่เหยียบหนาม

    ตอเสาเงียบ หมาเถ้าเงียบ เถ้าที่ลอยขึ้นค่อยๆ ร่อนกลับลงมาบนหลัง{name}ทีละเกล็ด
  choices:
    - id: stay_until_morning
      label: นั่งอยู่ตรงนั้นเป็นเพื่อนมันจนเช้า
      text: |
        {name}ไม่ลุก ลมอุ่นกระตุกเป็นพักๆ ทั้งคืน ช่วงหลังเที่ยงคืนถี่ขึ้น แล้วห่างลง แล้วห่างลงอีก ตอนฟ้าเริ่มเทา ลมพัดลงมาครั้งสุดท้าย ยาวและช้า เหมือนคนที่เจ็บมาทั้งคืนแล้วหลับไปได้เสียที

        ขาของ{name}แข็งจนต้องคลานไปครึ่งทางกว่าจะยืนได้ แสงขาวบนเถ้าข้างหน้าจางหายไปตั้งแต่ฟ้าสว่าง
      effects: { stats: { CON: 1 }, flags: [sat_with_the_owl_through_a_new_star] }
    - id: talk_to_it
      label: พูดกับมัน เล่าเรื่องที่บ้านให้ฟัง เรื่องอะไรก็ได้
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}เล่าเรื่องเตาที่บ้าน เรื่องข้าวที่หุงไหม้ก้น เรื่องคนข้างบ้านที่ทะเลาะกันเรื่องรั้ว เรื่องเล็กๆ ที่ไม่มีใครบนฟ้าสนใจ เล่าเสียงเรียบ ไม่หยุด ลมอุ่นค่อยๆ ช้าลงตามเสียง

          พอ{name}เล่าจบเรื่องที่สาม เค้ากลางคืนก็ว่าขึ้นมาว่า "รั้ว" แล้วเงียบไป เหมือนคนที่ชอบคำหนึ่งแล้วอยากเก็บไว้ ตอนเช้า{name}เสียงแหบจนพูดไม่ออกไปสองวัน
        effects: { stats: { CHA: 1 }, flags: [told_the_owl_small_things] }
      failure:
        text: |
          {name}อ้าปากแล้วไม่มีเรื่องอะไรออกมา ทุกเรื่องที่นึกได้เล็กเกินไปสำหรับสิ่งที่นั่งอยู่บนฟ้า เล็กจนอายที่จะพูด {name}ปิดปาก

          ลมอุ่นกระตุกอยู่จนเช้า ตอนฟ้าสาง {name}ยังเปิดปากไม่ออกสักคำ ปากแห้งแตกเพราะอ้าค้างไว้ในลมหนาวทั้งคืน
        effects: { hp: -1, flags: [had_nothing_to_tell_the_owl] }
    - id: cover_the_eyes
      label: เอามือปิดตา ไม่ให้แสงนั้นเข้าตาตัวเองอีกคน
      text: |
        {name}เอามือสองข้างปิดตา แสงขาวที่ตกบนเถ้าไม่ได้หายไปไหน แต่ในฝ่ามือมืดสนิท มืดอย่างที่กลางคืนเคยมืด เค้ากลางคืนเงียบ ลมอุ่นพัดลงมาแตะหลังมือครั้งหนึ่ง

        ตอนเช้ามีรอยกดของนิ้วสิบนิ้วเป็นสีแดงอยู่รอบตาของ{name} คนในหมู่บ้านเห็นแล้วไม่ถาม
      effects: { taboo: { night: keep }, flags: [shut_the_new_star_out] }
    - id: go_home
      label: ลุกกลับบ้าน ของใหญ่ขนาดนั้นคนตัวเท่านี้ช่วยอะไรไม่ได้
      text: |
        {name}ลุกเดินกลับหมู่บ้าน หน้ายังก้มอยู่ ข้างหลังเสียงนั้นดังขึ้นจากพื้นอีกสองครั้ง ห่างกันนาน เบาลงทุกครั้ง

        คืนนั้น{name}นอนบนเรือนที่ชักบันไดขึ้นแล้ว ฟังเสียงลมกระตุกผ่านหลังคาจนเช้า ไม่มีใครในเรือนหลับ
      effects: { flags: [left_the_owl_to_its_pain] }

- id: adult.owl_the_borrowed_fire
  stage: adult
  weight: 20
  scene: land_night
  time: night
  when:
    age: [22, 64]
    flags: [heard_the_sleep_pact]
  text: |
    คืนเดือนดับคืนนั้น {name}ก่อไฟเล็กๆ ไว้ข้างตัวก่อนนั่งก้มหน้า ไฟจากเตาบ้านคนในหมู่บ้าน ยืมมาใส่หม้อดิน เค้ากลางคืนลงมาเกาะแล้วเงียบไปนาน ลมอุ่นพัดลงมาแตะเปลวไฟจนเอนครั้งหนึ่ง

    "ไฟ ยืม" มันว่า เว้นไปนาน "ต้อง คืน ก่อน รุ่ง"

    แล้วมันก็เล่าต่อเหมือนเล่าเรื่องเมื่อวาน ผู้มาทีหลังองค์ที่ถือตาชั่งกับสมุดหนี้มาขอยืมไฟจากแม่เสือไฟ ไฟก้อนแรกที่ใช้ตีเหล็กก้อนแรก มันอยู่ตรงนั้นตอนที่ยืม ได้ยินกำหนดคืนกับหูตัวเอง ก่อนรุ่ง "รุ่ง ผ่าน ไป" มันว่า "หลาย ครั้ง แล้ว"
  choices:
    - id: tell_a_belek_priest
      label: กลับไปเล่าให้นักบวชเบเลคฟัง
      text: |
        วิหารเบเลคที่ใกล้บ้านที่สุดดูเหมือนธนาคาร เพราะข้างในเป็นธนาคาร นักบวชที่โต๊ะหน้าฟังเรื่องของ{name}จนจบ หน้าตาเหมือนคนฟังลูกหนี้ขอผ่อน แล้วเรียกนักบวชอีกคนออกมาฟังซ้ำ คนที่สองไม่ถามอะไร จดชื่อ{name}ลงสมุดเล่มหนา

        สัปดาห์ต่อมาเจ้าหน้าที่ของธนาคารมาตรวจบัญชีของ{name} หนี้ไม่มีค้างสักเหรียญก็ยังตรวจ ละเอียดจนถึงใบเสร็จค่าเกลือ
      effects: { reputation: { belek_bank: -1 }, flags: [heard_of_the_borrowed_fire, told_belek_of_the_fire] }
    - id: keep_it_quiet
      label: เก็บเรื่องนี้ไว้ ไม่เล่าให้ใครฟัง
      text: |
        {name}ไม่เล่าให้ใคร เรื่องหนี้ของผู้มาทีหลังองค์ที่ทวงหนี้ทั้งแผ่นดินมีคนอยากฟังมากเกินไป และคนที่อยากฟังที่สุดคือคนที่ไม่อยากให้คนอื่นได้ฟัง

        ก่อนรุ่งคืนนั้น{name}เอาไฟในหม้อดินไปคืนเตาบ้านที่ยืมมา คืนตอนถ่านยังร้อน เจ้าของบ้านงัวเงียลุกมารับ ถามว่ารีบอะไร
      effects: { flags: [heard_of_the_borrowed_fire, kept_the_borrowed_fire_quiet] }
    - id: ask_what_if_never
      label: ถามมันว่าถ้าไม่มีวันคืน จะเป็นอย่างไร
      text: |
        เค้ากลางคืนเงียบไปนานที่สุดเท่าที่{name}เคยรอมัน นานจนไฟในหม้อดินมอดลงครึ่งหนึ่ง แล้วมันก็ตอบ

        "ตัว ที่ หลับ ไม่ ทวง" มันว่า "ตัว ที่ ตื่น ทวง" ลมอุ่นพัดลงมาแตะไฟในหม้อ ไฟลุกขึ้นสูงเท่าฝ่ามือแล้วนิ่ง ก่อนรุ่ง{name}เอาไฟไปคืนบ้านที่ยืมมา ถ่านในหม้อร้อนกว่าตอนยืมมา
      effects: { stats: { INT: 1 }, flags: [heard_of_the_borrowed_fire, asked_about_the_unreturned_fire] }

- id: adult.owl_asks_a_messenger
  stage: adult
  weight: 120
  scene: land_night
  time: night
  when:
    age: [24, 68]
    flags: [heard_the_sleep_pact]
  text: |
    "ผู้เช่า" เค้ากลางคืนว่าตั้งแต่ลงมาเกาะ ไม่ปล่อยให้{name}ได้นั่งให้ขาชาก่อนเหมือนทุกคืน "ข้า ออก จาก ฟ้า นี้ ไม่ได้" มันเว้นไปนาน "ไกล เท่า เงา ตอ หมุด เท่านั้น"

    มันขอของอย่างเดียว ให้{name}เอาคำถามหนึ่งข้อไปวางที่ดินของตัวที่หลับอยู่ใกล้บ้าน{name}ที่สุด แล้วกลับมาบอกว่าดินตอบว่าอย่างไร คำถามสั้นจน{name}ท่องได้ในครั้งเดียว

    "ถ้า ทำ สัญญา ใหม่ ได้" มันว่า "จะ ยัง อยาก หลับ อยู่ ไหม"
  choices:
    - id: carry_it
      label: รับคำถามไว้ ท่องทวนให้มันฟังหนึ่งรอบ
      text: |
        {name}ท่องทวนทีละคำ ช้าเท่าที่มันพูด ไม่ตกสักคำ เค้ากลางคืนฟังจนจบ แล้วลมอุ่นก็พัดลงมาแตะริมฝีปากของ{name}ครั้งหนึ่ง อุ่นเท่าถ้วยน้ำชาที่เพิ่งยกออกจากเตา

        ขากลับ{name}ท่องคำถามนั้นในใจไปตลอดทาง ไม่ได้ตั้งใจท่อง มันท่องเอง ทุกก้าวหนึ่งคำ
      effects: { flags: [carries_the_owls_question] }
    - id: carry_it_and_ask_why
      label: รับไว้ แต่ถามก่อนว่าทำไมมันไม่ถามเอง
      text: |
        เค้ากลางคืนเงียบไปนาน แล้วตอบว่าตัวที่หลับไม่ได้ยินเสียงของตัวที่ตื่น ได้ยินแต่เสียงของผู้เช่า เพราะผู้เช่าเดินอยู่บนตัวมันทุกวัน "ข้า ตะโกน มา สาม พัน ปี" มันว่า ไม่ได้ฟังเหมือนบ่น ฟังเหมือนบอกว่าฝนตก

        {name}รับคำถามไว้ ท่องทวนหนึ่งรอบ ขากลับเดินเร็วกว่าขามา
      effects: { flags: [carries_the_owls_question, asked_why_the_owl_cannot_ask] }
    - id: refuse_the_errand
      label: ปฏิเสธ เรื่องของตัวใหญ่ขนาดนั้นไม่ใช่เรื่องของผู้เช่า
      text: |
        {name}ตอบว่าไม่รับ เค้ากลางคืนไม่ได้ถามซ้ำ ไม่ได้ขู่ มันเงียบไปเฉยๆ แล้วลมอุ่นก็พัดลงมาตามจังหวะเดิมทั้งคืน เหมือนไม่มีใครเคยขออะไร

        ตอนเช้า{name}เดินกลับ ระหว่างทางเจอคนเดินกลางคืนของหมู่บ้านคนหนึ่งเดินสวนไปทางตอเสา เขาไม่ได้ถาม{name}ว่ามาจากไหน
      effects: { flags: [refused_the_owls_errand] }

- id: adult.owl_question_laid_down
  stage: adult
  weight: 120
  when:
    age: [24, 70]
    flags: [carries_the_owls_question]
  text: |
    คำถามติดอยู่ในปากมาตั้งแต่ขากลับ ท่องจนลิ้นจำเองได้ {name}รู้ว่าต้องไปวางมันที่ไหน ที่ที่คนรุ่นก่อนทำของแปลกๆ ที่ไม่มีใครอธิบายได้ ที่ที่ข้อห้ามของบ้านนี้ผูกไว้

    วันหนึ่งตอนที่ไม่มีใครอยู่ใกล้ {name}ไปถึงที่นั่น นั่งลง วางมือแบนลงกับสิ่งที่ต้องวาง น้ำ ดิน หิน รากไม้ หรือขี้เถ้าในเตา ข้างใต้ลึกลงไปมีอะไรบางอย่างนอนอยู่ ใหญ่จนนึกภาพไม่ออก หลับมานานจนลืมว่ากำลังหลับ

    {name}พูดคำถามนั้นออกไป ช้าๆ ทีละคำ อย่างที่ได้ยินมา
  choices:
    - id: at_the_water_steps
      label: ถามที่ขั้นล่างสุดของท่าน้ำ มือแช่อยู่ในน้ำ
      requires: { taboo: { id: river, taught: true } }
      text: |
        น้ำในคลองนิ่งไปทั้งสาย เรือที่กำลังพายผ่านไหลไปเองโดยไม่มีใครพาย แล้วน้ำก็ลดลงจากขั้นล่างสุดไปหนึ่งขั้น ช้าๆ เหมือนคนหายใจออก เปิดให้เห็นตะไคร่กับเหรียญทองแดงเขียวคล้ำเรียงอยู่บนหินเป็นแถว

        แล้วน้ำก็กลับขึ้นมาเท่าเดิม แต่ไม่หยุดที่ขั้นเดิม มันขึ้นมาท่วมข้อมือของ{name}อีกหนึ่งนิ้ว อุ่น แล้วจึงลดลงไปอยู่ที่ของมัน
      effects: { world: { land: -1 }, flags: [the_ground_answered, asked_the_river_steps] }
    - id: at_the_mound
      label: ถามที่ตีนเนิน ฝ่ามือกดบนหญ้า
      requires: { taboo: { id: field, taught: true } }
      text: |
        เนินหายใจ หญ้าทั้งเนินลู่ลงพร้อมกันเป็นวงจากยอดลงมาถึงตีน แล้วตั้งขึ้นใหม่ช้าๆ ลมอุ่นที่มีกลิ่นดินใต้รากพัดผ่านหน้า{name}ไปทางเดียว ทางที่ไม่ใช่ทางลม

        ดินใต้ฝ่ามือสะเทือนสองครั้ง ครั้งแรกเบา ครั้งที่สองเบากว่า แล้วนิ่งไป รอยฝ่ามือของ{name}จมลงไปในดินลึกกว่าที่กดไว้ ลึกเท่าข้อนิ้ว
      effects: { world: { land: -1 }, flags: [the_ground_answered, asked_the_mound] }
    - id: at_the_stone_face
      label: ลงไปถามที่หน้าหินชั้นล่างสุด หลังเคาะสามครั้ง
      requires: { taboo: { id: stone, taught: true } }
      text: |
        {name}เคาะสามครั้งด้วยข้อนิ้ว แล้วถาม หินเงียบไปนานจนเปลวตะเกียงสั้นลงครึ่งข้อนิ้ว แล้วเสียงเคาะก็ดังกลับมาจากข้างใน ครั้งหนึ่ง สองครั้ง แล้วหยุด

        {name}รอครั้งที่สามจนตะเกียงเกือบหมดน้ำมัน ไม่มี ตอนจะลุก ฝุ่นหินร่วงลงมาจากเพดานเป็นสายบางๆ สายเดียว ตรงลงบนหลังมือที่ยังวางอยู่กับหิน
      effects: { world: { land: -1 }, flags: [the_ground_answered, asked_the_stone_face] }
    - id: at_the_spring
      label: ถามที่ตาน้ำในป่าลึก ฝ่ามือวางบนรากไม้ที่โผล่พ้นดิน
      requires: { taboo: { id: forest, taught: true } }
      text: |
        ใบไม้ทั้งป่าหยุดไหวพร้อมกัน นกที่ร้องอยู่เงียบไปกลางเพลง รากใต้ฝ่ามือของ{name}อุ่นขึ้นทีละน้อยอย่างไม้ที่ตากแดดมาทั้งวัน ทั้งที่แดดส่องลงมาไม่ถึงพื้นตรงนี้

        กวางตัวเมียตัวหนึ่งเดินออกมาจากหลังพุ่มไม้ ก้มลงกินน้ำห่างจาก{name}ไม่ถึงสามก้าว กินจนอิ่ม เงยหน้ามองมาครั้งหนึ่ง แล้วเดินกลับเข้าไป ใบไม้กลับมาไหวตอนที่หางของมันลับพุ่มไม้ไปแล้ว นกตัวเดิมร้องต่อจากที่ค้างไว้
      effects: { world: { land: -1 }, flags: [the_ground_answered, asked_the_forest_spring] }
    - id: at_the_hearth
      label: ถามที่หน้าเตาในบ้านตัวเอง ทุกบ้านที่มีเตามีตัวที่หลับอยู่ใต้ไฟ
      text: |
        {name}นั่งยองๆ หน้าเตาตอนดึก ไฟเหลือแค่ถ่านแดงใต้ขี้เถ้า ถามไปทีละคำ ถ่านไม่ขยับ แล้วขี้เถ้าทั้งเตาก็ยุบลงพร้อมกัน เบาๆ เหมือนแมวที่ขยับตัวในที่นอน

        ถ่านใต้ขี้เถ้าแดงขึ้นทีละก้อน จากก้อนในสุดออกมาหาก้อนนอกสุด แล้วหรี่ลงทีละก้อนในลำดับเดียวกัน เหลือก้อนสุดท้ายแดงอยู่ก้อนเดียว ตรงหน้า{name}พอดี จนเช้า
      effects: { world: { land: -1 }, flags: [the_ground_answered, asked_the_hearth] }

- id: adult.owl_answer_carried_back
  stage: adult
  weight: 120
  scene: land_night
  time: night
  when:
    age: [25, 72]
    flags: [the_ground_answered]
  text: |
    {name}กลับไปที่เดิมอีกครั้งพร้อมคำตอบที่ไม่ใช่คำพูด คืนเดือนดับนั่งก้มหน้าที่เดิม เค้ากลางคืนลงมาเกาะเร็ว ไม่รอให้ขาชา ลมอุ่นพัดลงมาครั้งหนึ่งแล้วหยุดค้าง

    {name}เล่าสิ่งที่เห็นตามที่เห็น ไม่เติม ไม่ตัด น้ำ ดิน หิน ไม้ หรือไฟ ขยับอย่างไร กี่ครั้ง ช้าเร็วแค่ไหน เค้ากลางคืนฟังจนจบ แล้วเงียบไปนานกว่าที่เคยเงียบทุกครั้ง

    "มัน ว่า" เค้ากลางคืนว่า เสียงช้ากว่าเคย "ไม่ อยาก ตื่น อยู่ ตัว เดียว"
  choices:
    - id: ask_what_it_means
      label: ถามว่าแปลว่าอยากตื่นหรืออยากหลับ
      text: |
        เค้ากลางคืนไม่ตอบ ลมอุ่นพัดลงมาหนึ่งครั้ง ยาว แล้วมันก็พูดคำเดิมซ้ำอีกรอบ ทีละคำ ช้าเท่าเดิม ไม่มีคำไหนเปลี่ยน ไม่มีคำไหนเน้น

        ขากลับ{name}พลิกคำนั้นไปมาอยู่ในหัวทั้งทาง ด้านหนึ่งอ่านว่าจะไม่ตื่นจนกว่าตัวอื่นจะตื่นด้วย อีกด้านอ่านว่าสงสารตัวที่ต้องตื่นอยู่บนฟ้าคนเดียวมาสามพันปี ถึงบ้านแล้วก็ยังพลิกไม่เลิก
      effects: { flags: [heard_what_the_ground_said, asked_the_owl_what_it_meant] }
    - id: sit_with_it
      label: นั่งอยู่กับคำนั้นเงียบๆ จนเช้า
      text: |
        {name}ไม่ถาม เค้ากลางคืนไม่พูดต่อ ทั้งสองนั่งอยู่อย่างนั้น คนหนึ่งบนเถ้า ตัวหนึ่งบนฟ้า ลมอุ่นพัดลงมาเป็นจังหวะช้าๆ ไม่กระตุก เป็นคืนแรกที่{name}ได้ยินลมของมันไม่กระตุกเลยทั้งคืน

        ตอนฟ้าสาง มันว่าขึ้นมาคำเดียวก่อนบินไปทางตอเสา "ดี" ไม่รู้ว่าหมายถึงคำตอบของดิน หรือหมายถึงที่{name}ไม่ถาม
      effects: { stats: { WIS: 1 }, flags: [heard_what_the_ground_said, sat_with_the_grounds_answer] }
    - id: say_it_is_not_alone
      label: บอกมันว่าบนฟ้านี้มันก็ไม่ได้ตื่นอยู่ตัวเดียว
      text: |
        {name}พูดไปก่อนจะคิดว่าควรพูดหรือไม่ ผู้เช่าใต้ฟ้านี้ก็ตื่นอยู่ทุกคืนเดือนดับ นั่งก้มหน้าอยู่ข้างล่าง ทุกหมู่บ้าน

        เค้ากลางคืนเงียบไปนาน แล้วเสียงหนึ่งก็ดังขึ้นมาจากเถ้า เสียงที่{name}เคยได้ยินครั้งเดียว ต่ำ สั้น เหมือนหัวเราะของภูเขา "ผู้เช่า" มันว่า "ตัว เล็ก" แต่ลมที่พัดลงมาหลังจากนั้นอุ่นกว่าทุกคืน
      effects: { alignment: { moral: 1 }, flags: [heard_what_the_ground_said, told_the_owl_it_was_not_alone] }

- id: adult.owl_the_lamp_hunter
  stage: adult
  weight: 14
  when:
    age: [24, 66]
    flags: [heard_the_sleep_pact]
    not_location_tag: ashland
  text: |
    ชายในเสื้อคลุมขาวปักรูปตะเกียงที่อกมานั่งรออยู่ในบ้าน{name}ตั้งแต่ก่อนเจ้าของบ้านกลับ เก้าอี้ตัวที่ดีที่สุดในบ้าน ถ้วยน้ำชาที่เขาชงเอง นักล่าแม่มดของศาสนจักรตะเกียง ไม่มีทหารตามมา มีแต่สมุดเล่มบางในมือ

    เขาไม่ได้กล่าวหาอะไร เขาแค่อ่านจากสมุดให้ฟัง วันที่{name}ออกจากบ้าน ทุกวันตรงกับก่อนคืนเดือนดับไม่กี่วัน ทางที่ไปคือทางตะวันออก ทุกครั้ง แล้วเขาก็ปิดสมุด ถามสามคำถามที่นักล่าแม่มดถามทุกคน ฝันถึงใคร ได้ยินเสียงอะไรตอนกลางคืน ไปที่ไหนมาบ้าง

    คำถามที่สามเขาถามช้ากว่าสองข้อแรก
  choices:
    - id: tell_him_the_truth
      label: ตอบตามจริง ไปนั่งก้มหน้าในแดนเถ้า ฟังกลางคืนพูด
      text: |
        นักล่าแม่มดฟังจนจบโดยไม่จด พอ{name}พูดถึงเสียงที่ดังขึ้นมาจากเถ้า เขาวางถ้วยชาลง ถามว่ามันพูดถึงเวรัสบ้างไหม {name}ตอบว่ามันไม่เรียกผู้มาทีหลังด้วยชื่อ เขาจดประโยคนั้นประโยคเดียว

        ก่อนกลับเขาบอกว่าศาสนจักรไม่ได้ห้ามคนนั่งบนเถ้า แต่จะส่งคนมาถามอีกทุกปี ชื่อ{name}ย้ายจากสมุดเล่มบางไปอยู่ในสมุดเล่มหนา
      effects: { reputation: { lamp_church: -1 }, flags: [told_the_lamp_hunter_the_truth] }
    - id: lie_to_him
      label: ตอบว่าไปเยี่ยมญาติทางตะวันออก
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}เล่าเรื่องญาติที่ไม่มีอยู่จริง ป้าที่ขาไม่ดี หลานที่ไม่ยอมแต่งงาน ราคาข้าวที่นั่นแพงกว่าที่นี่เท่าไร เล่าละเอียดจนตัวเองเกือบเชื่อ นักล่าแม่มดฟัง หาว แล้วถามชื่อป้า

          {name}ตอบทันทีโดยไม่ต้องคิด เขาจดลงสมุด ปิดสมุด ดื่มชาที่เหลือจนหมดแล้วลุกกลับ บอกว่าปีหน้าอาจมาอีก หรืออาจไม่มา
        effects: { stats: { CHA: 1 }, flags: [lied_to_the_lamp_hunter] }
      failure:
        text: |
          {name}เล่าเรื่องญาติทางตะวันออก นักล่าแม่มดถามชื่อหมู่บ้าน {name}ตอบชื่อหนึ่ง เขาเปิดสมุดดู แล้วบอกว่าหมู่บ้านนั้นย้ายไปอยู่หลังแนวหินของป้อมตั้งแต่หลายปีก่อน ไม่มีใครอยู่แล้ว

          เขาไม่ได้โกรธ เขาจดลงสมุดนานกว่าเดิม แล้วบอกว่าคนที่โกหกเรื่องที่ไปมาคือคนที่ศาสนจักรต้องมาถามบ่อยขึ้น ก่อนกลับเขาล้างถ้วยชาของตัวเอง วางคว่ำไว้ข้างโอ่ง เหมือนคนที่รู้ว่าจะได้มาใช้อีก
        effects: { reputation: { lamp_church: -1 }, flags: [caught_lying_to_the_lamp_hunter] }
    - id: pay_him_to_forget
      label: วางเงินบนโต๊ะ ขอให้เขาลืมหน้าสมุดหน้านั้น
      requires: { min_gold: 3 }
      text: |
        นักล่าแม่มดมองเหรียญบนโต๊ะ แล้วมอง{name} แล้วฉีกหน้าสมุดหน้านั้นออกมาพับใส่กระเป๋าเสื้อ ไม่ได้ทิ้ง เขาเก็บเงินไว้ด้วย

        ตอนเดินออกประตูเขาบอกว่าหน้าที่ฉีกออกไปแล้วเขียนใหม่ไม่ได้ แต่จำได้ คนที่มาแทนเขาปีหน้าจะไม่มีหน้านี้ให้อ่าน ถ้าเขายังเป็นคนมาเองก็อีกเรื่อง
      effects: { gold: -3, alignment: { law: -1 }, flags: [paid_the_lamp_hunter] }
    - id: take_him_along
      label: ชวนเขาไปนั่งด้วยกันคืนเดือนดับหน้า ให้เห็นเอง
      text: |
        นักล่าแม่มดไปจริง นั่งก้มหน้าอยู่ข้าง{name}บนเถ้านอกหมู่บ้าน ทนได้จนเกือบเที่ยงคืน พอลมอุ่นพัดลงมาครั้งแรก เขาก็เงยหน้า

        เขาไม่ร้อง ไม่วิ่ง เขาลุกขึ้นปัดเถ้าออกจากเสื้อคลุม แล้วเดินกลับไปทางป้อมคนเดียวตอนดึก คืนนั้นเค้ากลางคืนไม่พูดกับ{name}สักคำ ปีต่อมาไม่มีใครจากศาสนจักรมาถามอีก ไม่มีใครรู้ว่าเขาจดอะไรไว้
      effects: { flags: [took_the_lamp_hunter_east] }

- id: adult.owl_the_price
  stage: adult
  weight: 120
  scene: land_night
  time: night
  mark: ตอบคำถามของเค้ากลางคืน
  when:
    age: [30, 74]
    flags: [the_ground_answered, heard_what_the_ground_said]
  text: |
    คืนเดือนดับที่หนาวที่สุดของปี เค้ากลางคืนลงมาเกาะบนตอเสา ไม่ได้ทักทาย ไม่ได้ถามเรื่องค่าเช่า มันถามคำถามเดียว ช้ากว่าทุกคำที่เคยพูด

    "ถ้า ทำ สัญญา ใหม่ ได้" มันว่า "แผ่นดิน ควร ตื่น ไหม" มันเว้นไปนาน "ผู้เช่า ตอบ"

    แล้วมันก็บอกราคาโดยไม่มีใครถาม ถ้าแผ่นดินตื่น เตาที่กินถ่านมาร เหมืองที่ไม่หยุดในเดือนไหน โรงกลั่นที่เทน้ำล้างหม้อลงคลองทุกคืน จะอยู่ไม่ได้ ผู้มาทีหลังจะตัวเล็กลง หมุดจะเป็นแค่หมุด ถ้าแผ่นดินหลับต่อ ค่าเช่าก็ต้องจ่ายต่อ ทุกบ้าน ทุกคืน และเปลือกที่เป็นรูก็ยังเป็นรูอยู่อย่างนั้น "ไม่ มี ทาง ไหน ได้ เปล่า" มันว่า "ข้า ไม่ ได้ ขาย ของ"
  choices:
    - id: let_it_wake
      label: ตอบว่าควรตื่น
      text: |
        {name}ตอบคำเดียว เค้ากลางคืนไม่ได้ตอบรับ ไม่ได้ขอบใจ ลมอุ่นพัดลงมาครั้งหนึ่ง แรงกว่าทุกครั้ง แรงจนเถ้าทั้งลานลอยขึ้นเป็นม่าน แล้วร่อนลงช้าๆ

        ขากลับ{name}ผ่านปล่องเหมืองถ่านมารที่ไฟไม่เคยดับ ผ่านรางรถไฟที่หัวรถจักรกำลังเติมถ่าน ผ่านบ้านคนที่มีงานทำเพราะของพวกนั้น เดินผ่านทีละอย่างโดยไม่ได้หันไปมอง
      effects: { flags: [would_wake_the_land] }
    - id: let_it_sleep
      label: ตอบว่าหลับต่อเถิด ผู้เช่าจะจ่ายค่าเช่าต่อ
      text: |
        {name}ตอบ แล้วรับปากต่อท้ายโดยไม่มีใครขอ เค้ากลางคืนเงียบไปนาน แล้วว่า "ผู้เช่า หนึ่ง คน" เว้นไปนานอีก "ผู้เช่า มี มาก"

        ขากลับ{name}นับในใจว่ารู้จักกี่คนที่ยังโยนเหรียญ ยังเว้นรวง ยังเคาะหิน นับได้ไม่ครบมือเดียว
      effects: { flags: [would_keep_the_sleep] }
    - id: will_not_answer
      label: ไม่ตอบ ผู้เช่าคนเดียวไม่ควรเป็นคนตอบเรื่องนี้
      text: |
        {name}บอกมันอย่างนั้นตรงๆ เค้ากลางคืนไม่โกรธ ลมอุ่นพัดลงมาเป็นจังหวะเดิม เหมือนคืนแรกที่{name}นั่งอยู่ใต้มันโดยยังไม่รู้ว่ามันคืออะไร

        "ผู้มาทีหลัง ก็ ไม่ ตอบ" มันว่า "นาน แล้ว" แล้วมันก็บินขึ้นจากตอเสาไปทางที่ดาวยังไม่ดับ ทิ้งให้{name}นั่งอยู่บนเถ้าที่ลมกวาดไว้เรียบเป็นวงจนเช้า
      effects: { flags: [would_not_answer_the_owl] }
