# ชุด ม สถาบันเวทหลวง: ทางเข้า ปีหนึ่ง ปีสอง และปีหก (12 เรื่อง)
# ทางเข้าสองเรื่องเป็น must อายุ 15 เท่านั้น ทุกทางที่เข้าเรียนตั้ง mark city.move course.enter และ flag ทางเข้าหนึ่งอย่าง
# เรื่องของหลักสูตรไม่มี when.age when.year when.city หรือ cast ปีเรียนตกได้ทุกปีตั้งแต่ก่อนสงครามถ่านจนหลังสงคราม
# ห้ามเอ่ยถึงสงคราม หนี้สงคราม หรือทหารผ่านศึกในเรื่องของหลักสูตร หนี้ของตระกูลดอร์กาคือหนี้ธนาคารเบเลคที่มีทุกยุค
# ปีหนึ่ง: เรื่องละทางเข้า ทุกเรื่องพาเพื่อนร่วมห้องสี่คนเข้าผังที่ระดับเหตุการณ์ ทุกทางที่อยู่ต่อตั้ง institute_cohort
#   ทางออกกลับบ้านในหนาวแรกมีเรื่องเดียว (youth.institute_scholar_kitchen)
# ปีสอง: เลือกสำนัก ไม่บอกใบ้ความลับของสำนัก (ความลับเปิดในปีสาม)
# ปีหก: ไม่เอ่ยชื่อสำนักหรืองานวิทยานิพนธ์ ทุกทางได้งานหนึ่งงานและ mark จบจากสถาบันเวทหลวง

# ---------- ทางเข้า ----------

- id: youth.institute_gate_scholar
  stage: youth
  scene: institute
  weight: 1000
  must: true
  when:
    age: [15, 15]
    class: wizard
    flags: [path_institute]
  text: |
    ปีที่เป็นลูกมือของหอช่างสถาบัน {name}กวาดผงตะไบ ล้างโหล แบกลังหลอดแก้วขึ้นบันไดตึกตะวันตกวันละเจ็ดแปดเที่ยว นอนบนแคร่ในห้องเก็บของใต้บันไดกับลูกมืออีกหกคนที่ได้ชื่อมาจากโต๊ะเดียวกัน ครบปีวันไหนไม่มีใครบอก รู้แค่ว่าเช้าวันหนึ่ง ปลายแคร่ทุกแคร่มีเสื้อคลุมขอบเทาวางพับไว้ตัวละตัว

    นายทะเบียนฮัลบริคนั่งหลังโต๊ะยาวในโถงหน้า สมุดทะเบียนขอบเทากางอยู่ตรงหน้า หน้าซ้ายเว้นช่องไว้ให้เขียนชื่อ หน้าขวาพิมพ์ข้อผูกพันไว้แล้ว ทุนของสถาบันให้ที่นอน อาหาร และค่าเรียนหกปี เรียนจบแล้วทำงานให้สถาบันสิบปีในที่ที่สถาบันส่งไป ฮัลบริคอ่านให้ทุกคนฟังด้วยเสียงเดียวกันทุกคำ เหมือนคนที่อ่านข้อนี้มาแล้วสามสิบปี

    ปลายโต๊ะเดียวกันมีเสมียนธนาคารเบเลคนั่งอีกคน สมุดปกดำ ตาชั่งเหล็กเล็กเท่าฝ่ามือตั้งข้างขวดหมึก ใครไม่อยากเป็นของสถาบันสิบปี ไปเป็นลูกหนี้ธนาคารแทนก็ได้ แปดเหรียญ ดอกงอกทุกฤดู

    ลูกมือคนที่ยืนหน้า{name}ลงชื่อโดยไม่อ่านสักบรรทัด คนที่ยืนหลังถามฮัลบริคว่าสิบปีเริ่มนับวันไหน
  choices:
    - id: sign_the_bond
      label: ลงชื่อรับทุน กับข้อผูกพันสิบปี
      requires: { not_flags: [origin_marked_hidden] }
      text: |
        ฮัลบริคตอบคนข้างหลังว่าเริ่มนับวันรุ่งขึ้นหลังได้ขอบน้ำเงิน แล้วยื่นปากกาให้{name} หมึกในปากกาเหลือครึ่งหยด พอเขียนชื่อเสร็จเขาโรยทรายซับหมึกบางๆ เป่าทีเดียว แล้วยื่นเสื้อคลุมขอบเทาให้

        ด้านในปกเสื้อตัวนั้นมีตัวเลขปักด้วยด้ายสีเทา เลขเดียวกับเลขหน้าในสมุดที่{name}เพิ่งเขียนชื่อลงไป คืนนั้นลูกมือทั้งเจ็ดคนนั่งเทียบเลขในปกเสื้อกันบนแคร่ แล้วถึงรู้ว่าเลขเรียงต่อกันตามลำดับแถว ไม่มีใครได้เลขที่ไม่ได้ยืนรอ
      effects: { mark: ขึ้นทะเบียนนักเรียนสถาบัน, city: { move: ventras, district: institute }, course: { enter: institute }, reputation: { royal_institute: 1 }, flags: [entry_scholar] }
    - id: family_pays
      label: ส่งข่าวไปบ้าน ให้ทางบ้านจ่ายค่าเรียนเต็ม ไม่ให้ใครเป็นเจ้าของ
      requires: { flag: origin_marked_hidden }
      text: |
        คนรับใช้เก่าของตระกูลมาถึงตอนเที่ยง ถือถุงเงินที่ผูกปากด้วยครั่งสีเลือดหมู ตราของบ้านยังอุ่นอยู่ เขานับเงินลงบนโต๊ะของฮัลบริคทีละเหรียญจนครบ ไม่ขาดไม่เกิน ฮัลบริคพลิกสมุดไปอีกเล่ม ขอบเทาเหมือนกัน แต่หน้าขวาว่างเปล่า ไม่มีข้อผูกพันพิมพ์ไว้สักบรรทัด

        คนรับใช้ยกหีบเสื้อผ้าจากบ้านขึ้นหอพักให้ด้วย ใต้เสื้อที่พับไว้ชั้นบนสุดมีตะไบอันเล็กของท่านย่าวางอยู่ในซองหนังสีเดียวกับเสื้อนักเรียน กับเศษกระดาษหนึ่งแผ่น ลายมือท่านย่า เขียนคำเดียว เดือนละครั้ง
      effects: { mark: ขึ้นทะเบียนนักเรียนสถาบัน, city: { move: ventras, district: institute }, course: { enter: institute }, alignment: { law: 1 }, flags: [entry_family] }
    - id: sign_with_the_bank
      label: เดินไปปลายโต๊ะ ลงชื่อกู้ค่าเรียนกับธนาคารเบเลค
      text: |
        เสมียนธนาคารไม่ถามว่า{name}สอบได้ที่เท่าไร ถามแค่ชื่อเต็ม ที่เกิด และใครเป็นคนที่ต้องรู้ถ้า{name}ตายก่อนใช้หนี้หมด ตอนจรดปากกา ความเย็นแล่นจากปลายนิ้วขึ้นไปถึงข้อมือ แล้วหายไปก่อน{name}จะเขียนชื่อจบ

        ฮัลบริคมองข้ามโต๊ะมาครู่หนึ่ง แล้วขีดเส้นตรงหนึ่งเส้นทับช่องว่างในหน้าทุน ช่องที่เว้นไว้ให้{name} ลูกมือคนที่ยืนหลังได้หน้านั้นไปแทน เขาเขียนชื่อทับเส้นของฮัลบริคพอดี
      effects: { mark: ขึ้นทะเบียนนักเรียนสถาบัน, city: { move: ventras, district: institute }, course: { enter: institute }, gold: -8, debt: true, reputation: { belek_bank: 1 }, flags: [entry_loan] }
    - id: stay_a_hand
      label: ไม่ลงชื่อสักเล่ม กลับไปแบกลังที่หอช่างต่อ
      text: |
        ฮัลบริคไม่ถามเหตุผล เขาพับเสื้อคลุมขอบเทาตัวที่ไม่มีใครรับกลับใส่ลัง เสื้อตัวนั้นจะได้คนใส่ในปีหน้า แคร่ใต้บันไดเหลือ{name}คนเดียว ที่เหลือย้ายขึ้นหอพักกันหมดในบ่ายวันนั้น

        ลูกมือแก่ที่ล้างโหลอยู่หอช่างมาสามปีบอก{name}ระหว่างกินข้าวเย็นว่า ลูกมือที่อยู่ครบสี่ปีไม่ต้องสอบเหมือนคนนอก ไปยืนตอบอาจารย์สามคนให้หมดคำถามก็ได้ห้องใต้หลังคา แกพูดเหมือนเป็นเรื่องที่แกเองรอมาตลอด แล้วก็ลุกไปล้างชาม
      effects: { stats: { CON: 1 }, flags: [stayed_a_workshop_hand] }

- id: youth.institute_gate_open
  stage: youth
  scene: institute
  weight: 1000
  must: true
  when:
    age: [15, 15]
    class: wizard
    not_flags: [path_institute]
  text: |
    ประกาศของสถาบันเวทหลวงมาถึงในเดือนเดียวกันทุกปี กระดาษหนาสีนวล ตราประทับสีน้ำเงิน มากับรถไฟขบวนไปรษณีย์ กับเกวียนสินค้า กับคนส่งจดหมายที่ขึ้นทางตะวันตก แล้วไปติดอยู่บนผนังของทุกที่ที่มีเด็กหัดเวทวิชา ปีนี้ครูของ{name}ตอกตะปูติดไว้ข้างกระดานแขวนเครื่องมือ ตรงที่ต้องเห็นทุกเช้า แล้วไม่เอ่ยถึงอีก

    ประกาศบอกไว้สามทาง สอบสามวันที่เวนทราส วันแรกสูตร วันที่สองมือ วันที่สามห้องมืด คนสอบผ่านไม่ถึงหนึ่งในสิบ ทางที่สอง ผู้อุปถัมภ์มาดูตัวเด็กในสัปดาห์รับสมัคร ชื่อแรกในรายชื่อคือท่านหญิงคาเมีย ฮาสทิล เจ้าของโรงกลั่นสองโรง ทางที่สาม โต๊ะของธนาคารเบเลคที่ประตูสถาบันให้กู้ค่าเรียนเต็มจำนวน แปดเหรียญ ผ่อนเมื่อเรียนจบ

    บรรทัดสุดท้ายพิมพ์ตัวเล็กกว่าบรรทัดอื่น ทุนของสถาบันและการสอบเข้าไม่เปิดรับผู้ต้องตรา

    สัปดาห์รับสมัครกินค่าแรงลูกมือไปครึ่งเดือน จะนั่งรถไฟชั้นสามมาจากไหนหรือแค่เดินข้ามเมืองมาก็เท่ากัน ครูหักค่าแรงทุกวันที่ไม่ได้ยืนหน้ากระดานเครื่องมือ คืนก่อนสัปดาห์นั้น ครูวางชามข้าวลงแล้วบอกว่าแกเคยนั่งห้องมืดมาครั้งหนึ่ง ตอนอายุเท่า{name} แกเล่าแค่นั้น
  choices:
    - id: sit_the_three_days
      label: ไปนั่งสอบสามวันที่สถาบัน
      requires: { not_flags: [race_tiefling] }
      check: { stat: INT, dc: 13 }
      success:
        text: |
          วันแรกสอบในโถงที่มีโต๊ะสองร้อยตัว ข้อสุดท้ายเป็นสูตรที่{name}ไม่เคยเห็น แต่เดาทางได้จากข้อก่อนหน้า วันที่สองต้องกลั่นน้ำค้างดาวหนึ่งหยดจากแสงในโหลแก้ว หยดของ{name}ออกมาช้ากว่าคนข้างๆ แต่ใส วันที่สาม คนคุมสอบพาเข้าห้องที่ไม่มีหน้าต่าง ปิดประตู แล้วให้นั่งจนกว่าจะเล่าได้ว่าได้ยินอะไร

          {name}ได้ยินเสียงชีพจรตัวเองก่อน แล้วถึงได้ยินเสียงที่อยู่ใต้มัน เสียงเหมือนใครนับเลขช้าๆ อยู่อีกฟากผนัง {name}เล่าตามนั้น คนคุมสอบจดลงไปโดยไม่เงยหน้า สิบวันต่อมาจดหมายมาถึงพร้อมเสื้อคลุมขอบเทาหนึ่งตัว ครูอ่านจดหมายจบแล้วดึงประกาศลงจากผนัง พับเก็บใส่ลิ้นชัก
        effects: { stats: { INT: 1 }, mark: ขึ้นทะเบียนนักเรียนสถาบัน, city: { move: ventras, district: institute }, course: { enter: institute }, flags: [entry_exam] }
      failure:
        text: |
          วันแรกกับวันที่สองผ่านไปโดยไม่มีอะไรผิดที่{name}รู้ตัว วันที่สามในห้องมืด{name}นั่งจนขาชา ได้ยินแต่เสียงลมหายใจของตัวเอง กับเสียงน้ำหยดที่ไหนสักแห่งในท่อ พอประตูเปิด{name}เล่าเรื่องน้ำหยด คนคุมสอบจดลงไปคำเดียว

          จดหมายมาถึงในสิบวัน ไม่มีเสื้อคลุมแนบมา มีแต่ตัวเลขคะแนนสามตัวเขียนด้วยหมึกแดง กับบรรทัดว่าปีหน้าสอบใหม่ได้ ค่าแรงของสัปดาห์ที่หายไปไม่มีใครจ่ายคืน ครูไม่ถามอะไร แกแขวนกระดาษแผ่นนั้นไว้ที่ตะปูเดิม ตรงที่ประกาศเคยอยู่
        effects: { gold: -1, flags: [failed_the_institute_exam] }
    - id: meet_the_lady
      label: ไปต่อแถวให้ท่านหญิงคาเมีย ฮาสทิล ดูตัว
      requires: { min_stat: { CHA: 11 } }
      text: |
        ท่านหญิงนั่งในห้องรับแขกของสถาบัน เด็กยืนต่อแถวยาวออกไปถึงบันได นางดูมือของเด็กแต่ละคนก่อนดูหน้า ดูทั้งสองข้าง หงายแล้วคว่ำ แล้วถามคำถามข้อเดียวกันกับทุกคน ถ้ารู้เรื่องที่คนอื่นไม่รู้ จะเอาไปบอกใครก่อน

        {name}ตอบว่าบอกคนที่จ่ายค่าข้าว ท่านหญิงมองเด็กตรงหน้าตั้งแต่ศีรษะจนถึงรองเท้า ไม่หยุดดูตรงไหนนานกว่าตรงอื่น แล้วยกนิ้วขึ้นหนึ่งนิ้ว เลขานุการของนางเขียนชื่อ{name}ลงบนสันสมุดปกหนังเล่มใหม่ สมุดเล่มนั้นยังไม่มีอะไรข้างใน นางบอกว่าเดือนหนึ่งจะเลี้ยงข้าวหนึ่งมื้อ ของที่นางจ่ายให้เรียนเป็นของนาง ส่วนตัว{name}เป็นของ{name}เอง ถ้าแยกสองอย่างนั้นออกจากกันได้
      effects: { mark: ขึ้นทะเบียนนักเรียนสถาบัน, city: { move: ventras, district: institute }, course: { enter: institute }, reputation: { distillers: 1 }, flags: [entry_patron] }
    - id: sign_at_the_bank
      label: ลงชื่อกู้ค่าเรียนที่โต๊ะธนาคารเบเลคหน้าประตูสถาบัน
      text: |
        โต๊ะของธนาคารตั้งอยู่ใต้ซุ้มประตูสถาบันพอดี ใครจะเข้าไปสอบต้องเดินผ่านโต๊ะตัวนี้ก่อน เสมียนไม่ถามว่า{name}เก่งแค่ไหน ถามว่าเกิดที่ไหน อายุเท่าไร และมีใครในบ้านที่จะอยู่จนถึงวันใช้หนี้ไหม

        ปลายปากกาเย็นเหมือนเหล็กที่ทิ้งไว้ข้างนอกทั้งคืน ความเย็นนั้นวิ่งขึ้นข้อมือแล้วหายไป เสมียนยื่นใบรับเงินให้ เงินแปดเหรียญไม่เคยผ่านมือ{name} ไปถึงโต๊ะของนายทะเบียนก่อน{name}จะเดินไปถึงด้วยซ้ำ เสื้อคลุมขอบเทาที่ได้มาใหม่กว่าของทุกคนในแถว เพราะธนาคารคิดค่าเสื้อรวมไปแล้ว
      effects: { mark: ขึ้นทะเบียนนักเรียนสถาบัน, city: { move: ventras, district: institute }, course: { enter: institute }, gold: -8, debt: true, reputation: { belek_bank: 1 }, flags: [entry_loan] }
    - id: let_it_hang
      label: ปล่อยประกาศไว้บนผนัง ทำงานของครูต่อ
      text: |
        สัปดาห์รับสมัครผ่านไปโดยที่{name}ยังอยู่หน้ากระดานเครื่องมือ ทำงานที่ครูให้ทำเหมือนทุกวัน มือเร็วขึ้นกว่าเดือนก่อน ครูไม่ชม ไม่ติ ไม่ถามเรื่องประกาศ

        ปีต่อมาประกาศแผ่นใหม่มาถึงในเดือนเดิม ครูตอกตะปูทับลงบนแผ่นเก่า ตรงรูเดิม {name}เห็นขอบกระดาษปีที่แล้วยื่นออกมาใต้แผ่นใหม่นิดหนึ่ง สีนวลกลายเป็นสีน้ำชาแล้ว
      effects: { stats: { DEX: 1 }, flags: [passed_on_the_institute] }

# ---------- ปีหนึ่ง: ห้องห้าคน ----------

- id: youth.institute_scholar_kitchen
  stage: youth
  scene: dormitory
  course: { id: institute, year: 1 }
  when:
    flags: [entry_scholar]
  people:
    - { id: cohort_edric, name: เอดริค, gender: m, bond: friend, closeness: 1, age: 16 }
    - { id: cohort_dorga, name: ดอร์กา, gender: f, race: dwarf, bond: friend, closeness: 1, age: 16 }
    - { id: cohort_neris, name: เนริส, gender: f, bond: friend, closeness: 1, age: 15 }
    - { id: cohort_theril, name: เธริล, gender: m, race: elf, bond: friend, closeness: 1, age: 19 }
  text: |
    ทุนของสถาบันจ่ายค่าเรียน ส่วนเตียงต้องจ่ายด้วยมือ ก่อนไก่ขันหนึ่งชั่วยาม{name}ลงไปขัดหม้อในครัวใต้โรงอาหาร หม้อข้าวต้มของนักเรียนสามร้อยคน ขัดจนเห็นก้นเหล็ก บ่ายวันว่างล้างโหลในห้องกลั่นจนปลายนิ้วซีด แม่ครัวกอร์ลาขีดชอล์กบนกระดานข้างประตูครัวหนึ่งขีดต่อหนึ่งชั่วโมง ห้าขีดคือหนึ่งคืนบนเตียง

    ห้องนอนชั้นสี่มีเตียงห้าเตียง เอดริคได้เตียงริมหน้าต่างตั้งแต่คืนแรกเพราะให้เหรียญเงินคนเฝ้าหอไปหนึ่งเหรียญ แล้วเอาผ้าห่มผืนที่สองของตัวเองมาโยนไว้บนเตียงของ{name}โดยไม่ถาม ดอร์กาตื่นก่อน{name}ทุกเช้า นั่งเขียนตัวเลขบนกระดานชนวนใต้แสงเทียน ลบ แล้วเขียนใหม่ ก่อนจะลงไปกินข้าว เนริสถามแค่ว่าครัวจ่ายเป็นเหรียญหรือเป็นชอล์ก พอรู้ว่าเป็นชอล์กก็หันกลับไปเย็บปกเสื้อที่รับจากห้องอื่นมาเย็บ ปกละเหรียญทองแดง ส่วนเธริลถามเรื่องหมู่บ้านไม่หยุด หน้าหนาวกินอะไร เลี้ยงหมูกี่ตัว ใครเป็นคนบอกว่าข้าวปีนี้พอ แล้วจดคำตอบลงจดหมายที่เขียนกลับไอเลธ

    จดหมายจากบ้านมาถึงพร้อมหิมะแรก ลายมือของคนที่หัดเขียนตอนแก่ ข้าวปีนี้ไม่พอถึงหน้าไถ หลังคาโรงวัวพังไปครึ่งหนึ่งในคืนที่ลมแรง ในจดหมายไม่มีใครขออะไร เขียนบอกแค่ว่าที่บ้านเป็นอย่างไร แล้วถามว่าในเมืองหนาวไหม
  choices:
    - id: more_chalk
      label: ขอแม่ครัวรับงานเพิ่ม แลกเป็นเหรียญแทนชอล์ก
      check: { stat: CON, dc: 12 }
      success:
        text: |
          กอร์ลาไม่เคยแลกชอล์กเป็นเหรียญให้ใคร นางบอกว่าเหรียญมีให้เฉพาะงานที่ไม่มีใครอยากทำ แล้วชี้หม้อต้มน้ำใบใหญ่ในห้องกลั่น ตะกรันข้างในหนาเท่าเปลือกขนมปัง ต้องขูดด้วยทรายกับเศษอิฐคืนละสองชั่วโมง

          {name}ขูดหม้อใบนั้นตลอดหนาว ก่อนหน้าไถส่งเหรียญกลับบ้านได้สามเหรียญ ฝากไปกับรถไฟขบวนไปรษณีย์ ตอนกลับขึ้นห้อง ดอร์กาเงยหน้าจากกระดานชนวน บอกจำนวนชั่วโมงที่{name}ทำในเดือนนั้นได้ถูกทุกชั่วโมง ไม่มีใครเคยบอกเธอ
        effects: { stats: { CON: 1 }, flags: [sent_chalk_coin_home, institute_cohort] }
      failure:
        text: |
          คืนที่เก้า{name}หลับไปบนม้านั่งข้างหม้อต้ม มือห้อยลงไปโดนขอบหม้อที่เพิ่งยกลงจากเตา หนังที่หลังมือพองขึ้นมาเท่าเหรียญ กอร์ลาทาน้ำมันหมูให้ พันผ้า แล้วบอกว่าเด็กทุนที่มาตายในครัว สถาบันคิดเงินจากนาง

          หนาวนั้นส่งเหรียญกลับบ้านได้เหรียญเดียว ฝากไปพร้อมจดหมายที่เขียนด้วยมือซ้าย ตัวหนังสือโย้จนคนที่บ้านคงคิดว่าในเมืองหนาวจริง
        effects: { hp: -2, flags: [burned_in_the_stillroom, institute_cohort] }
    - id: copy_for_edric
      label: รับคัดตารางให้เอดริค คืนละหน้า
      text: |
        เอดริคพูดเก่งกว่าสอบ ตารางที่อาจารย์สั่งให้คัดวันละสี่หน้า เขาคัดได้หน้าเดียวแล้วเลิกไปคุยกับห้องข้างๆ ลุงของเขาส่งเงินมาทุกเดือน เขาจ่ายให้{name}หน้าละเหรียญทองแดง จ่ายเป็นเหรียญเงินตอนสิ้นเดือน เพราะเขาว่าทองแดงหนักกระเป๋า

        ตารางของเอดริคกับตารางของตัวเอง {name}คัดทั้งสองชุดด้วยเทียนเล่มเดียวบนขอบหน้าต่างของเขา ปลายเดือนข้อนิ้วกลางแตกตรงที่ปากกากด ปลายหนาว{name}ท่องตารางแสงได้ทั้งเล่ม เอดริคท่องได้แค่หน้าแรก แต่ลายมือในสมุดของเขาสวยกว่าของ{name}
      effects: { stats: { INT: 1 }, flags: [copied_edrics_tables, institute_cohort] }
    - id: send_the_savings
      label: ส่งเงินเก็บที่มีทั้งหมดกลับบ้าน
      requires: { min_gold: 2 }
      text: |
        แถวหน้าช่องฝากของไปรษณีย์ยาวออกมาถึงถนน เนริสยืนอยู่หน้า{name}สองคน ถือซองจดหมายของเธอเองเหมือนทุกเดือน พอเห็นว่า{name}ใส่เหรียญลงซองเปล่าๆ เธอดึงไปแกะ แล้วเย็บเหรียญติดไว้ในรอยพับของกระดาษทีละเหรียญด้วยเข็มที่พกอยู่ในปกเสื้อ บอกว่าที่หมู่บ้านเธอทำแบบนี้ ซองจะได้ไม่เบาจนคนอยากเปิด

        ขากลับทั้งสองเดินช้า ไม่มีเงินซื้อขนมทอดที่หัวมุมถนน เนริสบอกชื่อหมู่บ้านของเธอ เป็นชื่อที่{name}ไม่เคยได้ยิน แต่อยู่ห่างจากบ้านของ{name}ไม่ถึงสองวันเดิน
      effects: { gold: -2, alignment: { moral: 1 }, people: [{ id: cohort_neris, closeness: 1 }], flags: [sent_savings_home, institute_cohort] }
    - id: first_winter
      label: เก็บของขึ้นรถไฟกลับบ้านก่อนหิมะปิดทาง
      text: |
        กอร์ลาลบชอล์กบนกระดานของ{name}ด้วยฝ่ามือทีเดียว แล้วยื่นขนมปังแข็งให้สองก้อนไว้กินบนรถไฟ นายทะเบียนฮัลบริคขีดชื่อในสมุดขอบเทาด้วยเส้นเดียว ไม่ใช่สองเส้น บอกว่าเด็กทุนที่ออกก่อนใบไม้ผลิแรก สถาบันไม่ตามเก็บค่าข้าว เพราะค่าคนตามแพงกว่าค่าข้าว

        เอดริคยัดผ้าห่มผืนที่สองใส่ห่อผ้าของ{name}ให้ บอกว่าเขาไม่เคยใช้ เธริลขอชื่อหมู่บ้าน จดลงจดหมายฉบับเดือนนั้น ปลายหนาว หลังคาโรงวัวที่บ้านมีไม้ใหม่สามแผ่น เป็นไม้ที่{name}ตัดเอง ผ้าห่มผืนนั้นยังมีตราของตระกูลวาเรนปักอยู่ที่มุม
      effects: { course: { leave: true }, mark: ออกจากสถาบัน, flags: [institute_left, left_institute_first_winter] }

- id: youth.institute_ward_table
  stage: youth
  scene: dormitory
  course: { id: institute, year: 1 }
  when:
    flags: [entry_patron]
  people:
    - { id: cohort_edric, name: เอดริค, gender: m, bond: friend, closeness: 1, age: 16 }
    - { id: cohort_dorga, name: ดอร์กา, gender: f, race: dwarf, bond: friend, closeness: 1, age: 16 }
    - { id: cohort_neris, name: เนริส, gender: f, bond: friend, closeness: 1, age: 15 }
    - { id: cohort_theril, name: เธริล, gender: m, race: elf, bond: friend, closeness: 1, age: 19 }
  text: |
    วันสุดท้ายของทุกเดือน รถม้าของท่านหญิงคาเมีย ฮาสทิล มาจอดหน้าหอพักตอนจุดตะเกียง ม้าสีเทาสองตัว คนขับไม่เคยลงจากที่นั่ง {name}ต้องอาบน้ำ หวีผม และใส่เสื้อคลุมขอบเทาตัวที่ไม่มีคราบหมึก ในห้องนี้มีอยู่ตัวเดียว เป็นของ{name} เพราะท่านหญิงส่งมาให้สองตัว

    เอดริครู้จักชื่อฮาสทิลก่อนใครในห้อง ที่ดินผืนสุดท้ายของตระกูลวาเรนขายให้เจ้าของโรงกลั่นตั้งแต่เขายังเดินไม่แข็ง เขาบอกให้{name}ขโมยช้อนเงินกลับมาสักคันเป็นค่าดอกเบี้ย แล้วหัวเราะคนเดียวนานกว่าที่เรื่องควรขำ ดอร์กาถามว่าท่านหญิงจ่ายปีละเท่าไร ได้ตัวเลขแล้วเขียนลงกระดานชนวนข้างตัวเลขของตระกูลตัวเอง บอกว่าเงินที่ซื้อนักเรียนได้ทั้งคน ตระกูลลิ่มเหล็กจ่ายดอกให้ธนาคารหมดในสองเดือน เนริสฝากให้เก็บขนมปังก้อนเล็กที่ไม่มีใครแตะบนโต๊ะท่านหญิงกลับมา ส่วนเธริลนั่งเขียนจดหมายถึงไอเลธอยู่บนเตียงด้วยแสงเทียน เขาไม่จุดตะเกียงฟ้า และไม่เคยถามเรื่องโต๊ะของท่านหญิงเลยสักเดือน

    โต๊ะในบ้านฮาสทิลยาวพอนั่งยี่สิบคน คืนนี้นั่งกันสามคน ท่านหญิง {name} และเลขานุการที่จดทุกคำตอบลงสมุดปกหนังสันเขียนชื่อ{name} ท่านหญิงถามทุกเดือนว่าเดือนนี้เขาสอนอะไร ฟังจนจบแล้วถามข้อต่อไป คืนนี้ข้อต่อไปคือเด็กเอลฟ์ในห้องของ{name} ที่หอนับดาวส่งมา เขียนจดหมายกลับบ้านเดือนละฉบับ เขียนเรื่องอะไร
  choices:
    - id: tell_her
      label: เล่าให้ท่านหญิงฟังเท่าที่รู้
      text: |
        {name}เล่าว่าเธริลจดว่าอาจารย์คนไหนพูดถึงดาวว่าอย่างไร จดราคาหลอดน้ำค้างดาวในร้านหัวมุม จดว่าหลังคาที่มองเห็นจากหน้าต่างห้องมีจานรับดาวกี่ใบ ท่านหญิงฟังโดยไม่วางช้อน เลขานุการจดจนหมึกหมดหนึ่งครั้ง

        ก่อนกลับ มีถุงผ้าเล็กๆ วางข้างจานของ{name} ข้างในมีสองเหรียญ ท่านหญิงบอกว่าเป็นค่าเสื้อตัวที่สาม คืนนั้นเธริลยังเขียนจดหมายไม่เสร็จ {name}นอนฟังเสียงปากกาของเขาจนหลับ เดือนต่อมาสมุดปกหนังบนโต๊ะท่านหญิงหนาขึ้นอีกหน้าหนึ่ง
      effects: { gold: 2, alignment: { law: 1, moral: -1 }, reputation: { distillers: 1 }, flags: [told_the_lady_about_theril, institute_cohort] }
    - id: recite_the_lesson
      label: ท่องบทเรียนของเดือนให้ฟังทั้งบท ไม่เหลือช่องให้ถามข้อต่อไป
      check: { stat: INT, dc: 12 }
      success:
        text: |
          {name}ท่องสูตรทั้งเดือนตามลำดับที่อาจารย์สอน ตารางแสงทุกแถว ข้อที่อาจารย์เขียนผิดบนกระดานแล้วลบ ข้อที่นักเรียนคนหนึ่งถามแล้วอาจารย์ตอบไม่ได้ ซุปเย็นจนเป็นฝ้า เลขานุการเปลี่ยนหน้าสมุดไปเจ็ดหน้า

          ท่านหญิงยกมือขึ้นตอนเทียนเล่มที่สองเหลือครึ่ง บอกว่า{name}พูดเหมือนสมุดบัญชี นางชอบสมุดบัญชี แล้วให้คนขับรถพากลับหอ ข้อต่อไปที่นางถามไว้ไม่มีใครเอ่ยถึงอีกตลอดคืนนั้น เดือนต่อมาก็ไม่มี
        effects: { stats: { INT: 1 }, flags: [recited_to_the_lady, institute_cohort] }
      failure:
        text: |
          ครึ่งทาง{name}ท่องตารางแถวหนึ่งผิดไปหนึ่งหลัก ท่านหญิงพูดตัวเลขที่ถูกออกมาเองโดยไม่ต้องดูอะไร นางรู้บทเรียนของเดือนนี้อยู่แล้ว รู้ก่อนที่{name}จะนั่งลง แล้วนางก็ถามเรื่องเด็กเอลฟ์ซ้ำอีกครั้ง ด้วยเสียงเท่าเดิม

          {name}บอกว่าไม่ทราบ เลขานุการเขียนคำนั้นลงสมุดตัวโต รถม้าเดือนต่อมามาช้ากว่าเดิมหนึ่งชั่วยาม เงินค่าขนมที่ท่านหญิงให้ทุกเดือนหายไปหนึ่งเหรียญ ไม่มีใครบอกว่าทำไม
        effects: { gold: -1, flags: [lady_noted_a_silence, institute_cohort] }
    - id: invite_him
      label: เรียนท่านหญิงว่าถ้าอยากรู้ ให้เชิญเธริลมานั่งโต๊ะนี้เองเดือนหน้า
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ท่านหญิงหัวเราะ เสียงสั้นและแห้ง เลขานุการเงยหน้าขึ้นจากสมุดเป็นครั้งแรกในคืนนั้น เดือนต่อมามีเก้าอี้ตัวที่สี่ เธริลกินแต่ขนมปังกับน้ำ ตอบทุกคำถามอย่างสุภาพ ตอบยาว ตอบครบ และไม่มีคำไหนที่เลขานุการจดแล้วเอาไปใช้ได้

          ขากลับในรถม้า เธริลบอก{name}ว่าคืนนี้เขาได้กินข้าวกับคนที่อยากให้ดาวเพิ่มขึ้นทุกปี เขาจะเขียนเรื่องนี้ลงจดหมายฉบับหน้า แล้วจะเขียนด้วยว่าใครพาเขาไป
        effects: { stats: { CHA: 1 }, people: [{ id: cohort_theril, closeness: 1 }], flags: [brought_theril_to_the_lady, institute_cohort] }
      failure:
        text: |
          หน้าท่านหญิงนิ่ง เลขานุการหยุดเขียน ท่านหญิงบอกว่าสถาบันสอนให้นักเรียนตอบเรื่องที่มีคนถาม ไม่ได้สอนให้ถามกลับ แล้วสั่งยกของหวานออกไปก่อนจะถึงโต๊ะ

          เช้าวันรุ่งขึ้นเลขานุการมาที่หอพัก ขอสมุดจดทุกเล่มของ{name}ไปอ่าน บอกว่าของที่ท่านหญิงจ่ายให้เรียนเป็นของท่านหญิง สมุดกลับมาในสามวัน ทุกเล่มครบ มีรอยนิ้วของคนที่ไม่ใช่{name}อยู่บนมุมกระดาษทุกหน้า
        effects: { gold: -1, flags: [lady_read_the_notebooks, institute_cohort] }

- id: youth.institute_debtor_count
  stage: youth
  scene: classroom
  course: { id: institute, year: 1 }
  when:
    flags: [entry_loan]
  people:
    - { id: cohort_edric, name: เอดริค, gender: m, bond: friend, closeness: 1, age: 16 }
    - { id: cohort_dorga, name: ดอร์กา, gender: f, race: dwarf, bond: friend, closeness: 1, age: 16 }
    - { id: cohort_neris, name: เนริส, gender: f, bond: friend, closeness: 1, age: 15 }
    - { id: cohort_theril, name: เธริล, gender: m, race: elf, bond: friend, closeness: 1, age: 19 }
  text: |
    ปีหนึ่งเรียนกันในห้องยาวชั้นล่างของตึกกลาง โต๊ะสามสิบตัว นักเรียนขอบเทาหกสิบคน งานของทุกคนคือคัดตารางแสงดาวจากเล่มครูลงสมุดตัวเองวันละสี่หน้า ขอบกระดาษทุกหน้าของ{name}มีตัวเลขอีกชุดหนึ่งที่ไม่ได้มาจากเล่มครู แปดเหรียญ ดอกงอกทุกฤดู คัดจบหนึ่งหน้า บวกดอกเพิ่มไปอีกบรรทัด

    วันเบเลคแรกของทุกฤดู ชายจากธนาคารมานั่งที่ประตูสถาบันพร้อมสมุดปกดำ นักเรียนที่กู้ค่าเรียนเข้าแถวลงชื่อรับรู้ยอด เนริสยืนหน้า{name} ชื่อของเธออยู่บรรทัดบนชื่อ{name}ในหน้าเดียวกัน หมู่บ้านของเธอนับเงินเป็นกระสอบแป้ง เธอบอกว่าดอกฤดูนี้เท่ากับแป้งสามกระสอบครึ่ง ดอร์กาไม่ต้องเข้าแถวแต่เดินตามมา ธนาคารเดียวกันถือหนี้ของตระกูลลิ่มเหล็กมาสามชั่วคน เธอดูยอดของ{name}แวบเดียวแล้วบอกว่ายังเล็ก ปีหกจะไม่เล็กแบบนี้ เอดริคได้ยินยอดแล้วหัวเราะ บอกว่าลุงเขาเสียมากกว่านี้ในวงไพ่คืนเดียว แล้วเขาก็เงียบไปเองก่อนใครจะตอบ ส่วนเธริลอายุร้อยสามสิบ ไม่เคยติดใครสักเหรียญ ตอนกลับห้องเขาถาม{name}ว่าเป็นหนี้แล้วรู้สึกอย่างไร ถามจริงจัง เพราะต้องเขียนอธิบายลงจดหมาย

    ปีนี้ธนาคารติดกระดาษไว้ข้างโต๊ะ ลูกหนี้ที่เป็นนักเรียนมาคัดสมุดบัญชีที่สำนักงานธนาคารได้ทุกคืน ค่าแรงไม่จ่ายเป็นเหรียญ หักลบกับยอดหนี้
  choices:
    - id: bank_nights
      label: รับงานคัดสมุดบัญชีของธนาคารตอนกลางคืน
      text: |
        ห้องหลังของสำนักงานธนาคารมีโต๊ะยาวสองตัว ตะเกียงฟ้าแขวนต่ำจนแสงตกลงบนกระดาษพอดี {name}คัดยอดหนี้จากสมุดเก่าลงสมุดใหม่ ชื่อคน ชื่อร้าน ชื่อโรงสี ทีละบรรทัดจนตีสอง สามคืนต่อสัปดาห์

        คืนที่สิบเอ็ด{name}คัดเจอชื่อที่รู้จัก ชายคนหนึ่งในตระกูลวาเรน ยอดยาวสองบรรทัด ช่องหลักประกันเขียนว่าค่าเรียนของหลานชายหนึ่งคนที่สถาบันเวทหลวง ปลายฤดู ชายจากธนาคารขีดยอดของ{name}ลงสองเหรียญต่อหน้าแถว เอดริคยืนอยู่ไม่ไกล ถามว่างานกลางคืนเป็นอย่างไร {name}บอกว่าน่าเบื่อ
      effects: { gold: 2, reputation: { belek_bank: 1 }, flags: [copied_for_the_bank, saw_the_varen_loan, institute_cohort] }
    - id: dorgas_count
      label: ขอให้ดอร์กาสอนวิธีนับดอกแบบตระกูลลิ่มเหล็ก
      check: { stat: INT, dc: 12 }
      success:
        text: |
          ดอร์กาสอนบนกระดานชนวนแผ่นเดียวกับที่เธอนับหนี้ตระกูลทุกเช้า ดอกฤดูแรกเขียนเป็นแถว ดอกฤดูที่สองเขียนเป็นแถวที่งอกจากแถวแรก แถวที่สามงอกจากทั้งสองแถว จนกระดานเต็มแล้วต้องลบมุมซ้ายทิ้ง เธอบอกว่าคนแคระนับแบบนี้เพราะหินจำได้นานกว่าคน ส่วนธนาคารจำได้นานกว่าหิน

          ก่อนหิมะละลาย{name}นับเองได้จนถึงปีหก ได้ตัวเลขเดียวกับที่ดอร์กานับไว้ให้ดูก่อนหน้า {name}เขียนตัวเลขนั้นไว้ที่ปกในของสมุดตารางแสง ด้วยดินสอ ตัวเล็ก ตรงที่อาจารย์ไม่เปิดดู
        effects: { stats: { INT: 1 }, flags: [counted_the_debt_to_year_six, institute_cohort] }
      failure:
        text: |
          แถวที่สามของดอร์กางอกไปเร็วกว่าที่หัวของ{name}ตามทัน {name}นับต่อเองในคืนนั้นด้วยเทียนเล่มเดียว นับไปนับมา ตัวเลขออกมาไม่ตรงกันสักรอบ จนตีสี่ ตอนเช้าตัวร้อน เป็นไข้อยู่สองวัน

          วันที่สามตื่นมาเห็นกระดานชนวนวางอยู่ข้างหมอน ดอร์กาเขียนตัวเลขของปีหกไว้ให้แล้ว ตัวเล็ก มุมล่าง ใต้ตัวเลขมีอีกบรรทัด เขียนว่าไม่ต้องนับทุกคืน ธนาคารนับให้อยู่แล้ว
        effects: { hp: -1, flags: [dorga_counted_for_you, institute_cohort] }
    - id: one_tin
      label: ใส่เหรียญลงกระป๋องใบเดียวกับเนริส ฤดูไหนใครขาด หยิบไปก่อน
      text: |
        กระป๋องใบนั้นเคยใส่ใบชา ฝาบุบ เนริสเอามาจากร้านข้างหอ ทั้งสองเขียนชื่อลงบนฝาคนละด้าน วางไว้ใต้เตียงของเนริส ทุกครั้งที่ใครได้เหรียญมาโดยไม่คาดคิด หยอดลงไปหนึ่งเหรียญ

        วันเบเลคของฤดูที่สาม เนริสยืนนับเงินในแถวแล้วขาดไปหนึ่งเหรียญ {name}เปิดกระป๋องให้ต่อหน้าชายจากธนาคาร เขามองกระป๋อง มองชื่อสองชื่อบนฝา แล้วจดยอดของเนริสว่าครบ คืนนั้นเนริสนอนหันหน้าเข้าผนัง ไม่ได้เย็บปกเสื้อของใครเลย
      effects: { alignment: { moral: 1 }, people: [{ id: cohort_neris, closeness: 1 }], flags: [shared_a_tin_with_neris, institute_cohort] }

- id: youth.institute_free_owed
  stage: youth
  scene: dormitory
  course: { id: institute, year: 1 }
  when:
    not_flags: [entry_scholar, entry_patron, entry_loan]
  people:
    - { id: cohort_edric, name: เอดริค, gender: m, bond: friend, closeness: 1, age: 16 }
    - { id: cohort_dorga, name: ดอร์กา, gender: f, race: dwarf, bond: friend, closeness: 1, age: 16 }
    - { id: cohort_neris, name: เนริส, gender: f, bond: friend, closeness: 1, age: 15 }
    - { id: cohort_theril, name: เธริล, gender: m, race: elf, bond: friend, closeness: 1, age: 19 }
  text: |
    คืนสุดท้ายของเดือนแรก ห้องนอนชั้นสี่จุดไฟสามดวง เทียนของเธริลบนหัวเตียง ตะเกียงฟ้าของเอดริคริมหน้าต่าง กับเทียนไขสั้นกุดของดอร์กาที่ตั้งไว้บนกระดานชนวน ทุกคนในห้องนั่งนับอะไรสักอย่าง

    ดอร์กานับหนี้ธนาคารของตระกูลลิ่มเหล็ก เลขเดิมทุกเช้า ลบหนึ่งช่องทุกครั้งที่ตระกูลส่งข่าวว่าจ่ายงวดแล้ว เดือนนี้ไม่มีช่องให้ลบ เนริสนับเหรียญทองแดงบนผ้าห่มแยกเป็นกอง กองส่งบ้าน กองส่งธนาคาร กองกินข้าว กองสุดท้ายเล็กที่สุด เอดริคอ่านจดหมายของลุงซ้ำเป็นรอบที่สาม บรรทัดแรกเป็นค่าเรียนของเขา บรรทัดสุดท้ายเป็นจำนวนที่ตระกูลวาเรนจะได้คืนเมื่อเขาเข้ารับราชการ เธริลเขียนจดหมายฉบับแรกถึงหอนับดาว หอส่งเขามาดูว่าคนเวนทราสรู้เรื่องดาวแค่ไหน ค่าที่นอนของเขาคือจดหมายเดือนละฉบับ ห้ามขาด

    ค่าเรียนของ{name}ไม่มีใครถือสมุดทวง ไม่มีใครรอให้เรียนจบแล้วมาเก็บคืน เอดริคเป็นคนพูดขึ้นก่อน ว่าห้องนี้มีคนเดียวที่จบแล้วเดินไปทางไหนก็ได้ ขอดูหน่อยว่ากระเป๋าเงินของคนแบบนั้นหน้าตาเป็นอย่างไร

    ทางฝั่งเตียงของเนริส เหรียญกองที่ส่งธนาคารนับสามรอบแล้วก็ยังขาดสองเหรียญทุกรอบ
  choices:
    - id: cover_neris
      label: วางสองเหรียญลงบนกองของเนริส
      requires: { min_gold: 2 }
      text: |
        เนริสดันเหรียญกลับมาครั้งหนึ่ง {name}ดันกลับไปอีกครั้ง เธอไม่ดันกลับมาอีก แต่ฉีกมุมกระดาษห่อขนมปัง เขียนชื่อ{name}กับเลขสอง พับเก็บไว้ในกระป๋องเงินของเธอ ใต้เหรียญทุกเหรียญ

        วันเบเลคแรกของฤดู เธอเข้าแถวรับรู้ยอดได้ครบ เอดริคมองอยู่จากเตียงริมหน้าต่าง แล้วบอกว่ากระเป๋าเงินของคนที่เดินไปไหนก็ได้ หน้าตาเบาลงกว่าเมื่อวาน
      effects: { gold: -2, alignment: { moral: 1 }, people: [{ id: cohort_neris, closeness: 1 }], flags: [covered_neris_interest, institute_cohort] }
    - id: read_ahead
      label: ใช้คืนที่ไม่ต้องนับอะไร อ่านล่วงหน้าไปอีกครึ่งเล่ม
      check: { stat: INT, dc: 12 }
      success:
        text: |
          {name}ยืมตำราปีสองจากห้องสมุดได้เล่มหนึ่ง อ่านคืนละสิบหน้าใต้เทียนของเธริล เพราะเธริลนอนดึกที่สุดในห้อง เดือนต่อมาอาจารย์ถามข้อหนึ่งในห้องยาว ข้อที่ยังไม่ได้สอน ถามเพื่อให้ทั้งห้องรู้ว่ายังไม่รู้

          {name}ตอบได้ อาจารย์จดชื่อ{name}ไว้ที่ขอบกระดาน แล้วลบทิ้งก่อนเลิกชั้น คืนนั้นเอดริคมายืนที่ปลายเตียง ขอยืมสมุดไปคัด
        effects: { stats: { INT: 1 }, flags: [read_ahead_in_year_one, institute_cohort] }
      failure:
        text: |
          คืนที่หก เลือดกำเดาหยดลงบนหน้ากระดาษของตำราที่ยืมมา สองหยด แห้งเป็นสีสนิมก่อน{name}จะหาผ้ามาซับทัน ห้องสมุดคิดค่าหน้ากระดาษหนึ่งเหรียญ บรรณารักษ์ตัดหน้านั้นออกต่อหน้า{name} แล้วเย็บหน้าใหม่ที่คัดด้วยลายมืออื่นเข้าไปแทน

          ตำราเล่มนั้นยังอยู่บนชั้น หน้าที่สามสิบเจ็ดเป็นลายมือที่ไม่เหมือนหน้าอื่น
        effects: { gold: -1, hp: -1, flags: [bled_on_a_library_book, institute_cohort] }
    - id: the_bolt
      label: บอกดอร์กาว่าห้องน้ำที่มีกลอนเอาไว้ทำอะไร
      requires: { flag: origin_marked_hidden }
      text: |
        ดอร์กานับทุกอย่าง เธอนับได้ว่า{name}เข้าห้องน้ำปลายทางเดินห้องที่มีกลอนเดือนละครั้ง ครั้งละหนึ่งในสามของเทียน แล้วออกมาพร้อมผงสีกระดูกติดใต้เล็บ คืนนั้น{name}พาเธอไปยืนหน้าประตูบานนั้น บอกด้วยเสียงที่เบาพอให้คนในห้องข้างๆ ไม่ได้ยิน แล้วแหวกผมให้ดู

        ดอร์กาดูนานเท่าที่ใช้นับเลขสองหลัก แล้วกลับไปที่เตียง เอาแขนเสื้อลบตัวเลขแถวหนึ่งบนกระดานชนวนออก เป็นตัวเลขแรกที่{name}เห็นเธอลบทั้งที่ยังไม่มีใครจ่าย ตั้งแต่เดือนนั้น คืนที่{name}เข้าห้องน้ำบานนั้น ดอร์กาจะนั่งอ่านหนังสืออยู่บนพื้นทางเดินหน้าประตู
      effects: { stats: { CHA: 1 }, people: [{ id: cohort_dorga, closeness: 1 }], flags: [told_dorga_about_the_bolt, institute_cohort] }
    - id: empty_the_purse
      label: เทกระเป๋าเงินลงบนเตียงให้เอดริคดู
      text: |
        เหรียญที่หล่นออกมามีไม่กี่เหรียญ ปนกับกระดุมหนึ่งเม็ด เศษดินสอ และตั๋วรถไฟขาเดียวที่ใช้ไปแล้ว เอดริคมองกองนั้นอยู่ครู่หนึ่ง แล้วหัวเราะจนต้องเอาหมอนปิดปาก ดอร์กาบอกให้เงียบ เธอนับเลขผิดไปแล้วหนึ่งแถว

        เอดริคพับจดหมายของลุงเก็บใต้หมอน บอกว่าเขานึกว่าคนที่เดินไปไหนก็ได้จะมีเงินมากกว่านี้ {name}บอกว่าเดินไปไหนก็ได้ ไม่ได้แปลว่ามีค่ารถไฟ เขาจำประโยคนั้นไปเล่าในห้องข้างๆ ทั้งสัปดาห์ เล่าผิดทุกครั้ง
      effects: { flags: [showed_edric_the_purse, institute_cohort] }

# ---------- ปีสอง: สัปดาห์ประตูเปิด ----------

- id: youth.institute_choosing_free
  stage: youth
  scene: classroom
  course: { id: institute, year: 2 }
  when:
    not_flags: [entry_loan]
  text: |
    สัปดาห์ประตูเปิดเริ่มวันเวรัสหลังหิมะละลาย หกสำนักเปิดห้องทำงานให้นักเรียนขอบเทาเดินเข้าไปดูได้ทุกห้อง ยกเว้นห้องที่ปิดอยู่ ทุกสำนักมีห้องแบบนั้น วันสุดท้ายนายทะเบียนฮัลบริคตั้งโต๊ะหกตัวเรียงในโถงหน้า โต๊ะละหนึ่งสำนัก ลงชื่อโต๊ะไหน ชื่อนั้นอยู่ในสมุดของสำนักนั้นไปจนวันตาย

    ห้องห้าคนเลือกกันไม่พร้อมกัน ดอร์กาเดินตรงไปสำนักจักรกลเวทตั้งแต่เช้าวันแรก ไม่แวะประตูอื่น เธริลขึ้นทางเดินรอบโดมของสำนักดาราศาสตร์ แล้วไม่ลงมาจนค่ำ เนริสเดินห้องของสำนักรักษาสองรอบ ถามค่าผ้ากันเปื้อน เอดริคเดินทุกห้องเหมือนแขกในงานเลี้ยง คุยกับอาจารย์ทุกคนที่ยอมคุยด้วย

    เช้าวันสุดท้าย จดหมายของลุงเอดริคมาถึงก่อนโต๊ะจะตั้งเสร็จ เขาอ่านแค่บรรทัดแรก แล้วเดินไปลงชื่อที่โต๊ะสำนักสงครามเป็นคนแรกของโถง ลายมือสวยที่สุดในหน้า ตอนเดินกลับมาเขาบอก{name}ว่าลุงเลือกให้ตั้งแต่ปีก่อน เขาแค่มาเดินดูว่าห้องอื่นเป็นอย่างไร

    ฮัลบริคจุ่มปากกาแล้ววางพาดไว้บนปากขวดหมึก รอชื่อของ{name}
  choices:
    - id: distill
      label: ลงชื่อที่โต๊ะสำนักกลั่น
      text: |
        ของชิ้นแรกที่สำนักกลั่นยื่นให้คือถุงมือหนังบุขนแกะคู่หนึ่ง กับป้ายไม้แขวนคอเขียนเลขชั้นวางโหลที่{name}ต้องล้างทุกเช้าก่อนเรียน ตอนลงบันไดกลับ{name}เห็นซาเบล เทอร์ริค อาจารย์ที่ปรึกษาของสำนัก ยืนส่งแขกเสื้อดีที่ประตูข้าง เธอดึงถุงมือขึ้นจนสุดข้อมือก่อนจะจับมือเขา ผมของแขกคนนั้นมีกลิ่นควันหม้อกลั่นติดมาถึงหัวบันได
      effects: { course: { track: distill }, mark: เข้าสำนักกลั่น, stats: { CON: 1 } }
    - id: machine
      label: ลงชื่อที่โต๊ะสำนักจักรกลเวท
      text: |
        สำนักจักรกลเวทยื่นตะไบด้ามสึกให้หนึ่งอัน กับแผ่นทองเหลืองเท่าฝ่ามือ ตะไบจนวางไม้บรรทัดเหล็กลงไปแล้วไม่มีแสงลอดใต้ไม้ได้เมื่อไร ค่อยได้แตะเฟือง ดอร์กาลงชื่อไว้เหนือชื่อ{name}สองบรรทัด กลางลานหลังตึก โกรดัน ตระกูลเฟืองหัก อาจารย์ที่ปรึกษา นั่งกินข้าวคนเดียวบนลังไม้คว่ำ หัวเข็มขัดของเขาเรียบ ตรงที่คนแคระคนอื่นตอกตราตระกูลไว้
      effects: { course: { track: machine }, mark: เข้าสำนักจักรกลเวท, stats: { DEX: 1 } }
    - id: texts
      label: ลงชื่อที่โต๊ะสำนักตำรา
      text: |
        สำนักตำรายื่นดินสอให้สองแท่งกับกระดาษกฎของห้องอ่านหนึ่งแผ่น ข้อแรกเขียนว่าห้ามหมึก ห้ามไฟ ห้ามพูด ข้อสุดท้ายเขียนว่าหนังสือที่อยู่นอกมือคุณไม่ใช่เรื่องของคุณ ผ่านกระจกประตูห้องอ่าน{name}เห็นคาสเซน ดูเวล อาจารย์ที่ปรึกษา ชายแก่ไล่นิ้วไปตามอักษรคนแคระเส้นหนักบนแผ่นหนังเก่า ริมฝีปากขยับตาม นักเรียนปีสามคนหนึ่งเคาะกระจกสองครั้ง เขาไม่เงยหน้า
      effects: { course: { track: texts }, mark: เข้าสำนักตำรา, stats: { WIS: 1 } }
    - id: stars
      label: ลงชื่อที่โต๊ะสำนักดาราศาสตร์
      text: |
        สำนักดาราศาสตร์ยื่นกระดานชนวนตีตารางให้หนึ่งแผ่น กับจุกไม้ก๊อกหนึ่งอัน คาบไว้ตอนนับ จะได้ไม่นับออกเสียงจนคนข้างๆ นับผิดตาม เธริลยืนอยู่ข้างโต๊ะ ช่วยฮัลบริคสะกดชื่อของนักเรียนที่เขียนไม่ชัด ตอนพลบค่ำ บนทางเดินรอบโดม วิเรีย ซอลเดน อาจารย์ที่ปรึกษา นับช่องฟ้าช่องหนึ่งด้วยตาเปล่าแข่งกับนักเรียนที่หมุนเครื่องนับเลขอยู่ข้างเธอ เธอนับเสร็จก่อน แล้วยืนรอให้เครื่องตามทัน
      effects: { course: { track: stars }, mark: เข้าสำนักดาราศาสตร์, stats: { WIS: 1 } }
    - id: healing
      label: ลงชื่อที่โต๊ะสำนักรักษา
      text: |
        สำนักรักษายื่นผ้ากันเปื้อนที่ต้มมาจนแข็งเป็นแผ่นให้หนึ่งผืน กับบัตรประทับตราสำหรับเข้าห้องไข้ของบ้านอีเซลริมแม่น้ำ เนริสได้บัตรแบบเดียวกันก่อน{name}ครึ่งวัน เธอผูกเชือกผ้ากันเปื้อนลองดูตรงนั้นเลย ที่อ่างล้างมือท้ายห้อง โรเซล ทาวิค อาจารย์ที่ปรึกษา ถูมือขึ้นไปจนถึงศอกช้าๆ ทีละข้าง ปากนับอะไรบางอย่างเบาๆ แบบที่วิหารอีเซลสอนแม่ชีทุกคนให้ทำ
      effects: { course: { track: healing }, mark: เข้าสำนักรักษา, stats: { CHA: 1 } }
    - id: war
      label: ลงชื่อที่โต๊ะสำนักสงคราม
      text: |
        สำนักสงครามยื่นรองเท้าหนังหุ้มข้อให้หนึ่งคู่ กับตารางฝึกที่เริ่มก่อนไก่ขัน ทุกแผ่นประทับตราราชสำนักที่มุมล่าง ชื่อของเอดริคอยู่บรรทัดแรกของหน้า ลายมือสวยที่สุดในหน้า เช้าวันต่อมาบนลานฝึก เดเวค รอสตัน อาจารย์ที่ปรึกษา ทหารเก่าของทางเหมือง ยืนนับจังหวะให้นักเรียนปีสามวิ่ง แขนซ้ายของเขาเป็นงานของช่างคนแคระ ข้อนิ้วเหล็กเคาะต้นขาตามจังหวะที่นับ
      effects: { course: { track: war }, mark: เข้าสำนักสงคราม, stats: { STR: 1 } }

- id: youth.institute_choosing_bank
  stage: youth
  scene: classroom
  course: { id: institute, year: 2 }
  when:
    flags: [entry_loan]
  text: |
    สัปดาห์ประตูเปิดจบด้วยโต๊ะหกตัวในโถงหน้า โต๊ะละหนึ่งสำนัก ลงชื่อโต๊ะไหน ชื่อนั้นอยู่ในสมุดของสำนักนั้นไปจนวันตาย ท้ายโถงมีเก้าอี้ตัวที่เจ็ด ชายจากธนาคารเบเลคนั่งไขว่ห้าง สมุดปกดำวางบนเข่า สัญญากู้ที่{name}ลงชื่อไว้เมื่อปีก่อนให้สิทธิ์ธนาคารนั่งฟังวันนี้

    ทุกคนในแถวรู้ว่าธนาคารชอบโต๊ะไหน กลั่น จักรกลเวท และสงคราม สามสำนักที่จบแล้วมีคนจ้างก่อนหมึกในใบจบจะแห้ง ใครกู้ค่าเรียนแล้วไปลงชื่อโต๊ะอื่น ธนาคารเพิ่มยอดอีกสองเหรียญ เรียกว่าค่าเสี่ยง

    เนริสอยู่ในแถวหน้า{name}สองคน เธอเดินผ่านโต๊ะกลั่น ผ่านโต๊ะจักรกลเวท แล้วหยุดที่โต๊ะสำนักรักษา ชายจากธนาคารเปิดสมุด จุ่มปากกา เขียนอะไรบางอย่างต่อท้ายชื่อเธอ เสียงปลายปากกาขูดกระดาษดังไปทั้งโถง เนริสลงชื่อเสร็จก่อนเขาจะเขียนเสร็จ ไม่หันไปดู

    ถึงตา{name}
  choices:
    - id: distill
      label: ลงชื่อที่โต๊ะสำนักกลั่น
      text: |
        ชายจากธนาคารขีดเส้นสั้นๆ ข้างชื่อ{name} แล้วปิดสมุด ของชิ้นแรกที่สำนักกลั่นยื่นให้คือถุงมือหนังบุขนแกะคู่หนึ่ง กับป้ายไม้แขวนคอเขียนเลขชั้นวางโหลที่ต้องล้างทุกเช้า ตอนออกจากโถง{name}เห็นซาเบล เทอร์ริค อาจารย์ที่ปรึกษา คุยกับชายจากธนาคารคนเดียวกันที่หน้าประตู เธอใส่ถุงมือทั้งที่ในโถงไม่หนาว ตอนจับมือเขาเธอไม่ได้ถอด
      effects: { course: { track: distill }, mark: เข้าสำนักกลั่น, stats: { CON: 1 }, flags: [chose_what_the_bank_likes] }
    - id: machine
      label: ลงชื่อที่โต๊ะสำนักจักรกลเวท
      text: |
        ชายจากธนาคารขีดเส้นสั้นๆ ข้างชื่อ{name}โดยไม่เงยหน้า ดอร์กาที่ยืนรออยู่ข้างโต๊ะยื่นตะไบด้ามสึกของสำนักให้แทนคนแจก บอกว่าตะไบแผ่นทองเหลืองจนวางไม้บรรทัดแล้วไม่มีแสงลอดเมื่อไร ค่อยได้แตะเฟือง เย็นนั้นกลางลานหลังตึก โกรดัน ตระกูลเฟืองหัก อาจารย์ที่ปรึกษา นั่งกินข้าวคนเดียวบนลังไม้คว่ำ หัวเข็มขัดเรียบ ไม่มีตราตระกูลแบบที่หัวเข็มขัดของดอร์กามี
      effects: { course: { track: machine }, mark: เข้าสำนักจักรกลเวท, stats: { DEX: 1 }, flags: [chose_what_the_bank_likes] }
    - id: texts
      label: ลงชื่อที่โต๊ะสำนักตำรา แล้วให้ธนาคารเพิ่มยอด
      text: |
        ชายจากธนาคารเขียนเลขสองต่อท้ายชื่อ{name} ตัวโตพอให้คนข้างหลังอ่านได้ สำนักตำรายื่นดินสอให้สองแท่งกับกระดาษกฎของห้องอ่าน ห้ามหมึก ห้ามไฟ ห้ามพูด ผ่านกระจกประตูห้องอ่าน คาสเซน ดูเวล อาจารย์ที่ปรึกษา นั่งไล่นิ้วไปตามอักษรคนแคระเส้นหนัก ปากขยับตามโดยไม่มีเสียง นักเรียนคนหนึ่งเคาะกระจกถามทาง เขาไม่เงยหน้า
      effects: { course: { track: texts }, mark: เข้าสำนักตำรา, stats: { WIS: 1 }, gold: -2, debt: true, flags: [defied_the_bank] }
    - id: stars
      label: ลงชื่อที่โต๊ะสำนักดาราศาสตร์ แล้วให้ธนาคารเพิ่มยอด
      text: |
        ชายจากธนาคารเขียนเลขสองต่อท้ายชื่อ{name} เธริลที่ยืนช่วยฮัลบริคสะกดชื่ออยู่ข้างโต๊ะมองตามปลายปากกานั้น แล้วถาม{name}เบาๆ ว่าสองเหรียญนี้ซื้ออะไรได้ สำนักยื่นกระดานชนวนตีตารางกับจุกไม้ก๊อกไว้คาบตอนนับให้ พลบค่ำบนทางเดินรอบโดม วิเรีย ซอลเดน อาจารย์ที่ปรึกษา นับช่องฟ้าช่องหนึ่งด้วยตาเปล่าเสร็จก่อนเครื่องนับเลขที่นักเรียนหมุนอยู่ข้างเธอ แล้วยืนรอให้เครื่องตามทัน
      effects: { course: { track: stars }, mark: เข้าสำนักดาราศาสตร์, stats: { WIS: 1 }, gold: -2, debt: true, flags: [defied_the_bank] }
    - id: healing
      label: ลงชื่อที่โต๊ะสำนักรักษา แล้วให้ธนาคารเพิ่มยอด
      text: |
        ปลายปากกาของชายจากธนาคารขูดกระดาษเป็นครั้งที่สองของวัน เลขสองตัวเดียวกับที่เขียนต่อท้ายชื่อเนริส เนริสยืนรออยู่ที่ประตูโถง ยื่นผ้ากันเปื้อนที่ต้มจนแข็งเป็นแผ่นให้{name}ผืนหนึ่ง เธอรับมาเผื่อไว้ตั้งแต่เช้า ที่อ่างล้างมือท้ายห้องของสำนัก โรเซล ทาวิค อาจารย์ที่ปรึกษา ถูมือขึ้นไปจนถึงศอกทีละข้าง ปากนับเบาๆ ไม่ได้มองว่าใครเพิ่งเข้ามา
      effects: { course: { track: healing }, mark: เข้าสำนักรักษา, stats: { CHA: 1 }, gold: -2, debt: true, people: [{ id: cohort_neris, closeness: 1 }], flags: [defied_the_bank] }
    - id: war
      label: ลงชื่อที่โต๊ะสำนักสงคราม
      text: |
        ชายจากธนาคารขีดเส้นสั้นๆ ข้างชื่อ{name} แล้วเขียนอีกคำหนึ่งที่{name}อ่านกลับหัวไม่ออก ชื่อของเอดริคอยู่บรรทัดแรกของหน้า สำนักยื่นรองเท้าหนังหุ้มข้อกับตารางฝึกที่เริ่มก่อนไก่ขันให้ ทุกแผ่นประทับตราราชสำนักที่มุมล่าง เช้าวันต่อมาบนลานฝึก เดเวค รอสตัน ทหารเก่าของทางเหมือง ยืนนับจังหวะให้ปีสามวิ่ง ข้อนิ้วเหล็กของแขนซ้ายที่ช่างคนแคระทำให้เคาะต้นขาตามเสียงนับ
      effects: { course: { track: war }, mark: เข้าสำนักสงคราม, stats: { STR: 1 }, flags: [chose_what_the_bank_likes] }

# ---------- ปีหก: สอบจบ แล้วไปไหนต่อ ----------

- id: adult.institute_finals_scholar
  stage: adult
  scene: institute
  course: { id: institute, year: 6 }
  when:
    flags: [entry_scholar]
  text: |
    สอบจบในห้องเดียวกับที่{name}เขียนชื่อลงสมุดขอบเทาเมื่อหกปีก่อน โต๊ะยาวตัวเดิม คนหลังโต๊ะเปลี่ยนเป็นอาจารย์สามคน คนซ้ายถามแต่ตัวเลข คนขวาให้ทำด้วยมือทุกข้อที่ถาม คนกลางเปิดงานของปีห้าที่หน้าสุดท้ายก่อนหน้าแรก แล้วไม่ถามอะไรเลยจนชั่วโมงที่สี่ ข้อเดียวที่เขาถามเป็นเรื่องที่{name}ไม่ได้เขียนไว้ในงาน แต่คิดไว้ในคืนที่ไม่ได้เขียน {name}ตอบ ทั้งสามคนเขียนลงขอบกระดาษ แล้วบอกว่าหมดคำถามแล้ว

    นายทะเบียนฮัลบริคเข้ามาตอนอาจารย์ออกไป ผมบางลงกว่าเดิม สมุดเล่มเดิมกางอยู่ในมือ หน้าที่มีลายมือตัวโย้ของ{name}สมัยยังเป็นลูกมือ ข้อผูกพันสิบปีเริ่มนับพรุ่งนี้ สถาบันมีที่ให้แล้ว โต๊ะใต้หลังคาตึกตะวันตก เงินเดือนครึ่งหนึ่งของนักวิจัยที่สอบเข้ามาจากข้างนอก

    นอกห้องมีคนรออยู่สองคน ชายในเสื้อคลุมที่ปักตราราชสำนักถือแผ่นกระดาษมีตราประทับไว้แล้วครึ่งแผ่น กับช่างตาขุ่นข้างหนึ่งที่มีรอยไหม้ทุกนิ้ว เขามาถามหาคนอ่านสูตรออกสักคน ไม่ได้มาหา{name} ส่วนย่านโรงกลั่นริมแม่น้ำ ไม่ต้องมีใครมายืนรอ ใครๆ ก็รู้ว่าที่นั่นคนเจ็บมีมากกว่าหมอ
  choices:
    - id: serve_the_bond
      label: ลงชื่อรับโต๊ะใต้หลังคา เริ่มนับสิบปีตั้งแต่พรุ่งนี้
      text: |
        ห้องใต้หลังคามีหน้าต่างบานเดียว เปิดไม่ได้เพราะกรอบทาสีทับกันมาหลายชั้น บนผนังข้างโต๊ะมีขีดชอล์กของคนที่นั่งโต๊ะนี้คนก่อน ขีดเป็นกลุ่ม กลุ่มละห้าขีด สิบกลุ่ม ขีดฆ่าไปเก้ากลุ่ม กลุ่มสุดท้ายยังขาดไปสองขีด

        {name}ไม่ได้ลบ เช้าวันแรกของข้อผูกพัน {name}ขีดชอล์กกลุ่มใหม่ไว้ข้างกลุ่มนั้น ขีดแรก ชอล์กแท่งนั้นอยู่บนขอบหน้าต่างมาตั้งแต่ก่อน{name}มา
      effects: { mark: จบจากสถาบันเวทหลวง, reputation: { royal_institute: 1 }, flags: [job_researcher, serving_the_institute_bond] }
    - id: crown_seal
      label: ยื่นมือรับแผ่นกระดาษที่มีตราราชสำนัก ก่อนหมึกของฮัลบริคจะแห้ง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          คนของราชสำนักบอกว่าราชสำนักไม่ซื้อข้อผูกพันของใคร ราชสำนักรับคนที่ราชสำนักต้องการ ฮัลบริคเขียนคำว่าผิดสัญญาลงข้างชื่อ{name}ด้วยลายมือเดียวกับที่ใช้เขียนทุกอย่าง {name}ขอเงินเดือนแรกล่วงหน้าก่อนจะลงชื่อในแผ่นของราชสำนัก แล้วขอให้เขียนลงในแผ่นเดียวกันว่าราชสำนักจ่ายค่าห้อง

          คนของราชสำนักยิ้มเหมือนคนที่เพิ่งได้ของถูกกว่าที่คิด เขียนตามที่ขอ แล้วนับเงินสองเหรียญวางลงบนสมุดของฮัลบริค ตรงหน้าที่เพิ่งมีคำว่าผิดสัญญา
        effects: { stats: { CHA: 1 }, gold: 2, mark: จบจากสถาบันเวทหลวง, reputation: { crown: 1, royal_institute: -2 }, flags: [job_researcher, crown_paid_researcher, broke_the_institute_bond] }
      failure:
        text: |
          คนของราชสำนักบอกว่าราชสำนักไม่ซื้อข้อผูกพันของใคร ราชสำนักรับคนที่ราชสำนักต้องการ {name}ถามเรื่องเงินเดือน เขาบอกว่าคนที่ถามเรื่องเงินก่อนลงชื่อ ราชสำนักจดไว้ในช่องที่ต่างออกไป

          ฮัลบริคเขียนคำว่าผิดสัญญาลงข้างชื่อ{name} {name}ลงชื่อในแผ่นของราชสำนักตรงช่องล่างสุด ใต้ชื่อเสมียนคัดลายมือสองคน
        effects: { mark: จบจากสถาบันเวทหลวง, reputation: { crown: 1, royal_institute: -2 }, flags: [job_researcher, crown_paid_researcher, broke_the_institute_bond] }
    - id: haldans_bench
      label: เดินออกประตูหน้าไปกับช่างตาขุ่น
      text: |
        ช่างคนนั้นชื่อฮาลเดน เขาไม่ถามเรื่องข้อผูกพัน ไม่ถามว่าสอบได้ที่เท่าไร ถึงร้านแล้วยื่นแขนกลที่ข้อนิ้วหักให้หนึ่งข้าง แล้วไปนั่งกินข้าวเที่ยง พอเขากินเสร็จ{name}ต่อข้อนิ้วได้สองข้อ ข้อที่สามยังงอไม่ลง

        ฮาลเดนงอแขนเองสามครั้ง ฟังเสียงเฟืองข้างใน บอกให้มาตอนไก่ขัน ไฟในเตาเผาโลหะต้องจุดก่อนตะวันขึ้น ที่สถาบัน ฮัลบริคเขียนคำว่าผิดสัญญาลงข้างชื่อ{name}ตอนบ่าย ไม่มีใครอยู่ดู
      effects: { mark: จบจากสถาบันเวทหลวง, reputation: { royal_institute: -2 }, flags: [job_artificer, broke_the_institute_bond] }
    - id: refinery_room
      label: ไปเช่าห้องในย่านโรงกลั่น รักษาคนเจ็บโดยไม่ขอใบอนุญาตจากใคร
      text: |
        ห้องที่เช่าได้อยู่เหนือร้านขายเชือก บันไดผุสองขั้น {name}เขียนป้ายด้วยถ่านแปะไว้ที่บันได รักษาแผล ไข้ และอาการจากโรงกลั่น ราคาตามที่จ่ายไหว คนไข้คนแรกขึ้นมาตอนเที่ยงคืนของวันที่สอง คนงานกะดึกที่นิ้วโป้งเกือบขาด จ่ายเป็นเชือกป่านหนึ่งขด

        ฮัลบริคเขียนคำว่าผิดสัญญาลงข้างชื่อ{name}ในสมุดขอบเทา แล้วส่งใบแจ้งของสถาบันมาถึงห้องเหนือร้านเชือกในเดือนต่อมา {name}ใช้ด้านหลังใบนั้นจดชื่อคนไข้
      effects: { mark: จบจากสถาบันเวทหลวง, alignment: { moral: 1 }, reputation: { royal_institute: -2 }, flags: [job_hedge_doctor, broke_the_institute_bond] }

- id: adult.institute_finals_ward
  stage: adult
  scene: institute
  course: { id: institute, year: 6 }
  when:
    flags: [entry_patron]
  text: |
    อาจารย์สามคนหลังโต๊ะยาวถามงานของปีห้าจนหมดคำถาม คนหนึ่งถามว่าทำไม อีกคนถามว่าแล้วถ้าไม่ คนที่สามถามว่าใครเป็นคนแรกที่ได้อ่าน ข้อสุดท้ายนั้น{name}ตอบตามจริง ว่าเลขานุการของท่านหญิงคาเมีย ฮาสทิล อ่านก่อนอาจารย์ทุกคน อาจารย์คนที่สามจดคำตอบนั้นด้วยหน้าตาของคนที่รู้อยู่แล้ว

    เลขานุการรออยู่นอกห้อง สมุดปกหนังสันเขียนชื่อ{name}อยู่ในมือ หนาจนต้องใช้สายหนังรัด หกปีของคืนสุดท้ายของเดือน เขายื่นจดหมายให้ฉบับหนึ่ง ท่านหญิงสัญญากับอาจารย์ใหญ่ของสำนักกลั่นไว้ตั้งแต่ปีสี่ ว่าลูกอุปถัมภ์ของนางจะไปนั่งโต๊ะใต้หลังคาตึกตะวันตกที่เงินของโรงกลั่นนางจ่าย ทุกอย่างที่{name}เขียนที่โต๊ะนั้นจะผ่านโต๊ะของนางก่อนโต๊ะอื่น สำนักไหนที่{name}เรียนมาไม่ได้อยู่ในจดหมาย

    ในโถงหน้ามีคนของราชสำนักกำลังรับชื่อ ร้านช่างแห่งหนึ่งส่งคนมาตามหาคนอ่านสูตรออก และทุกคนรู้ว่าในย่านโรงกลั่น ห้องเหนือร้านเชือกมีห้องว่างเสมอ
  choices:
    - id: where_she_sent
      label: ไปนั่งโต๊ะที่ท่านหญิงจองไว้ให้
      text: |
        โต๊ะใต้หลังคามีหน้าต่างที่เปิดได้ เปิดออกไปทางปล่องของโรงกลั่นสองโรงริมแม่น้ำ ทุกเช้าเลขานุการคนเดิมขึ้นบันไดมารับกระดาษที่{name}เขียนเมื่อวาน ทุกเย็นกระดาษแผ่นเดิมกลับมาวางที่มุมโต๊ะ บางแผ่นมีรอยขีดเส้นใต้ด้วยหมึกสีเขียว หมึกที่ท่านหญิงใช้คนเดียว

        เดือนแรกมีถุงเงินมาวางพร้อมกระดาษ เงินเดือนของสถาบันกับอีกครึ่งหนึ่งที่ท่านหญิงเติมให้ ในถุงมีบัตรเล็กๆ เขียนว่าค่าเสื้อตัวที่เจ็ด
      effects: { mark: จบจากสถาบันเวทหลวง, gold: 2, reputation: { royal_institute: 1, distillers: 1 }, flags: [job_researcher, went_where_the_lady_sent] }
    - id: crown_instead
      label: ไปลงชื่อกับคนของราชสำนักในโถงหน้า
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          คนของราชสำนักรู้จักชื่อ{name}ก่อน{name}จะบอก เขาถามว่าท่านหญิงรู้หรือยัง {name}บอกว่ายัง เขายิ้มแล้วเขียนชื่อลงแผ่นที่มีตราประทับ บอกว่าราชสำนักกับบ้านฮาสทิลกินข้าวโต๊ะเดียวกันทุกต้นปี ถ้าท่านหญิงถาม เขาจะตอบเอง

          {name}ส่งสมุดปกหนังคืนเลขานุการทั้งเล่ม เลขานุการรับไป แล้วยื่นจดหมายอีกฉบับให้ ซองเปิดไว้แล้ว ข้างในเป็นลายมือหมึกเขียวบรรทัดเดียว ว่าของที่นางจ่ายให้เรียน นางเก็บไว้ครบแล้ว
        effects: { stats: { WIS: 1 }, mark: จบจากสถาบันเวทหลวง, reputation: { crown: 1, distillers: -1 }, flags: [job_researcher, crown_paid_researcher, refused_the_lady] }
      failure:
        text: |
          คนของราชสำนักเขียนชื่อ{name}ลงแผ่นที่มีตราประทับ แล้วถามว่าท่านหญิงรู้หรือยัง {name}บอกว่ายัง เขาวางปากกาลง บอกว่าเช่นนั้นราชสำนักจะรอให้ท่านหญิงรู้ก่อน

          สิบวันต่อมาแผ่นนั้นมาถึงห้องพักของ{name} มีตราครบ แต่ชื่อของ{name}ย้ายไปอยู่ล่างสุดของรายชื่อ ใต้คนที่ลงชื่อหลัง{name}ทุกคน เลขานุการไม่ได้มาเอาสมุดปกหนังคืน เขาส่งคนมาเอาไปตอนที่{name}ไม่อยู่
        effects: { mark: จบจากสถาบันเวทหลวง, reputation: { crown: 1, distillers: -1 }, flags: [job_researcher, crown_paid_researcher, refused_the_lady] }
    - id: the_bench
      label: ไปร้านช่างที่ส่งคนมาตามหาคนอ่านสูตรออก
      text: |
        ช่างใหญ่ชื่อฮาลเดน ตาข้างหนึ่งขุ่นเพราะประกายไฟ เขาไม่ถามว่า{name}เป็นลูกอุปถัมภ์ของใคร ยื่นแขนกลที่ข้อนิ้วหักมาหนึ่งข้าง แล้วไปกินข้าวเที่ยง พอเขากลับมา{name}ต่อข้อนิ้วได้สองข้อ ข้อที่สามยังงอไม่ลง เขางอเองสามครั้ง ฟังเสียงเฟือง แล้วบอกให้มาตอนไก่ขัน

        คืนนั้นเลขานุการมาที่หอพัก เอาสมุดปกหนังไป แล้วทิ้งถุงมือหนังไว้คู่หนึ่ง ถุงมือที่ท่านหญิงส่งมาให้ใส่ไปโต๊ะของนางในปีแรก ตอนนี้นิ้วของ{name}ใหญ่เกินกว่าจะใส่ได้แล้ว
      effects: { stats: { DEX: 1 }, mark: จบจากสถาบันเวทหลวง, reputation: { distillers: -1 }, flags: [job_artificer, refused_the_lady] }
    - id: rope_shop_room
      label: ไปเช่าห้องเหนือร้านเชือกในย่านโรงกลั่น เปิดรับคนเจ็บ
      text: |
        คนงานโรงกลั่นแถวนั้นครึ่งหนึ่งทำงานให้ท่านหญิงฮาสทิล คนไข้คนแรกที่ขึ้นบันไดมาเป็นเด็กเช็ดหม้อของโรงกลั่นนาง ฝ่ามือพองทั้งสองข้าง {name}เจาะตุ่มน้ำ ทายา พันผ้า เด็กจ่ายเป็นขนมปังครึ่งก้อน

        เดือนต่อมาเลขานุการขึ้นบันไดผุมาเอง ยืนอยู่ที่ประตู มองเตียงสองเตียงกับป้ายถ่าน แล้วบอกว่าท่านหญิงจะไม่ส่งคนของนางมาที่นี่อีก ตั้งแต่สัปดาห์นั้นคนไข้จากโรงกลั่นของนางยังขึ้นบันไดมาเหมือนเดิม แต่มาหลังเที่ยงคืน
      effects: { mark: จบจากสถาบันเวทหลวง, alignment: { moral: 1 }, reputation: { distillers: -1 }, flags: [job_hedge_doctor, refused_the_lady] }

- id: adult.institute_finals_debtor
  stage: adult
  scene: institute
  course: { id: institute, year: 6 }
  when:
    flags: [entry_loan]
  text: |
    อาจารย์สามคนถามงานของปีห้าตั้งแต่สายจนบ่าย คนหนึ่งถามเร็ว คนหนึ่งถามช้า คนที่สามถามซ้ำข้อที่คนแรกถามไปแล้ว ด้วยคำอื่น เพื่อดูว่า{name}จะตอบเหมือนเดิมไหม {name}ตอบเหมือนเดิม คำถามหมดตอนตะวันบ่ายคล้อยถึงขอบหน้าต่าง

    ชายจากธนาคารเบเลครออยู่ที่ปลายทางเดิน คนเดียวกับที่นั่งเก้าอี้ตัวที่เจ็ดในปีสอง ผมหงอกขึ้น สมุดปกดำเล่มเดิม เขาไม่รอให้{name}เดินไปถึง เปิดสมุดแล้วอ่านยอดออกเสียงทีละฤดู ยี่สิบสี่ฤดู ฤดูละบรรทัด นักเรียนปีห้าสองคนที่เดินผ่านหยุดฟังจนจบ

    แล้วเขาก็บอกข้อเสนอของธนาคาร โต๊ะผู้ประเมินทรัพย์ที่ถนนสมุดบัญชีว่างอยู่หนึ่งตัว ผู้ประเมินคือคนที่ไปดูของของลูกหนี้แล้วบอกว่ามีค่าเท่าไร ธนาคารชอบคนที่อ่านสูตรออก เพราะของสมัยนี้ครึ่งหนึ่งเดินด้วยน้ำค้างดาว ค่าแรงเดือนแรกหักยอดให้ทันที ทางอื่นทุกทางยอดเท่าเดิม
  choices:
    - id: assessor_desk
      label: รับโต๊ะผู้ประเมินทรัพย์ของธนาคาร
      text: |
        งานแรกเป็นโรงทอผ้าเล็กๆ ที่เจ้าของผ่อนเครื่องทอไม่ไหว {name}เดินดูเครื่องทอแปดเครื่อง เปิดฝาดูหลอดน้ำค้างดาวทุกเครื่อง เขียนราคาลงแบบฟอร์มทีละเครื่อง เจ้าของโรงเดินตามหลังตลอด ไม่พูด มือกำผ้าเช็ดหน้าไว้แน่น

        สิ้นเดือน ชายจากธนาคารขีดยอดของ{name}ลงต่อหน้าเหมือนวันที่อ่านยอดในทางเดิน ขีดเดียว ยาว เครื่องทอทั้งแปดเครื่องย้ายไปอยู่โกดังของธนาคารในวันเดียวกัน
      effects: { gold: 6, mark: จบจากสถาบันเวทหลวง, alignment: { law: 1, moral: -1 }, reputation: { belek_bank: 1 }, flags: [job_clerk, became_a_bank_assessor] }
    - id: west_roof
      label: บอกชายจากธนาคารว่าจะอยู่ใต้หลังคาตึกตะวันตก ยอดเท่าเดิมก็ได้
      check: { stat: INT, dc: 13 }
      success:
        text: |
          เขาปิดสมุด บอกว่าธนาคารรอได้ ธนาคารรอเก่งกว่าคน ตึกตะวันตกมีโต๊ะว่างสำหรับคนที่สอบจบไม่ต้องสอบเข้าซ้ำ {name}ได้ห้องที่หน้าต่างเปิดได้ครึ่งบาน เพราะคำตอบข้อสุดท้ายในห้องสอบไปถึงหูอาจารย์ใหญ่ก่อนที่{name}จะเดินถึงบันได

          สิ้นเดือนแรก{name}นั่งคิดตารางของตัวเองเสร็จก่อนเพื่อนห้องข้างๆ สองวัน แล้วใช้สองวันนั้นนั่งนับยอดหนี้บนขอบตาราง แถวงอกจากแถว แบบที่ดอร์กานับหนี้ตระกูลบนกระดานชนวนทุกเช้าในห้องห้าคน
        effects: { stats: { INT: 1 }, mark: จบจากสถาบันเวทหลวง, reputation: { royal_institute: 1 }, flags: [job_researcher] }
      failure:
        text: |
          เขาปิดสมุด บอกว่าธนาคารรอได้ ธนาคารรอเก่งกว่าคน ตึกตะวันตกมีโต๊ะว่างอยู่ตัวเดียว ห้องที่หน้าต่างเปิดไม่ได้ ข้างห้องเก็บสารเคมีที่กลิ่นซึมผ่านผนังทั้งวัน {name}รับไว้

          สิ้นเดือนแรก ใบแจ้งยอดของธนาคารมาถึงโต๊ะใต้หลังคาพร้อมใบแจ้งเงินเดือนของสถาบันในซองเดียวกัน ไม่มีใครรู้ว่าคนส่งไปเอาซองของสถาบันมาจากไหน
        effects: { mark: จบจากสถาบันเวทหลวง, reputation: { royal_institute: 1 }, flags: [job_researcher, bank_found_the_west_roof] }
    - id: haldans_shop
      label: ไปหาร้านช่างที่รับคนอ่านสูตรออก
      text: |
        ร้านของฮาลเดนรับซ่อมแขนกล หุ่นยาม และอะไรก็ตามที่เดินด้วยน้ำค้างดาวแล้วหยุดเดิน ตาข้างหนึ่งของเขาขุ่นเพราะประกายไฟ เขาไม่ถามเรื่องหนี้ ยื่นแขนกลที่ข้อนิ้วหักให้หนึ่งข้าง แล้วไปกินข้าว พอเขากลับมา{name}ต่อข้อนิ้วได้สองข้อ ข้อที่สามยังงอไม่ลง

        ฮาลเดนงอเองสามครั้ง ฟังเสียงเฟืองข้างใน แล้วบอกให้มาตอนไก่ขัน ตอนเดินออกจากร้าน{name}เห็นสมุดผ่อนของวิหารเบเลคเสียบอยู่ใต้กุญแจร้านของเขาเหมือนกัน หนากว่าของ{name}สองเท่า
      effects: { mark: จบจากสถาบันเวทหลวง, flags: [job_artificer] }
    - id: rope_shop_room
      label: ไปเช่าห้องเหนือร้านเชือกในย่านโรงกลั่น รับรักษาทุกคนที่ขึ้นบันไดมา
      text: |
        ห้องเหนือร้านเชือกมีเตียงเดียว {name}ซื้อเตียงที่สองจากคนที่ย้ายออก ด้วยเงินที่ควรเอาไปผ่อนธนาคาร คนไข้คนแรกเป็นเด็กเช็ดหม้อ ฝ่ามือพองทั้งสองข้าง จ่ายเป็นปลาเค็มสองตัว คนที่สองจ่ายเป็นคำขอบคุณ คนที่สามไม่จ่าย

        วันเบเลคแรกของฤดู ชายจากธนาคารขึ้นบันไดมาเอง นั่งบนเตียงที่สองโดยไม่ถาม อ่านยอดให้ฟังทีละฤดู ยี่สิบห้าฤดู แล้วลงบันไดไปโดยไม่ขอเงินสักเหรียญ ตั้งแต่นั้นมาเขามาทุกฤดู
      effects: { mark: จบจากสถาบันเวทหลวง, alignment: { moral: 1 }, flags: [job_hedge_doctor] }

- id: adult.institute_finals_free
  stage: adult
  scene: institute
  course: { id: institute, year: 6 }
  when:
    not_flags: [entry_scholar, entry_patron, entry_loan]
  text: |
    อาจารย์สามคนถามงานของปีห้าจนเทียนบนโต๊ะเปลี่ยนเล่ม คนที่ถามมากที่สุดเป็นคนที่พูดน้อยที่สุดตอนสอนในปีสาม ข้อสุดท้ายของเขาไม่มีคำตอบที่ถูก เขาอยากรู้แค่ว่า{name}จะยอมบอกว่าไม่รู้ไหม {name}บอก เขาเขียนอะไรบางอย่างแล้วขีดเส้นใต้สองเส้น

    นอกห้องสอบ มีคนยืนรอใครสักคนอยู่ตลอดแนวผนังทางเดิน นายทะเบียนฮัลบริคยืนรอเด็กทุนพร้อมสมุดขอบเทา เลขานุการของบ้านฮาสทิลรอลูกอุปถัมภ์ ชายจากธนาคารรอลูกหนี้ เอดริคยืนคุยกับคนของราชสำนักเหมือนรู้จักกันมาสิบปี ดอร์กาถือจดหมายของตระกูลที่ยังไม่แกะ เนริสเข้าแถวรอชายจากธนาคาร เธริลเขียนจดหมายบนขอบหน้าต่าง ฉบับที่เจ็ดสิบสองที่เขียนกลับไอเลธ

    ไม่มีใครรอ{name} บนกระดานประกาศข้างบันไดมีกระดาษสี่แผ่น โต๊ะใต้หลังคาตึกตะวันตกสำหรับคนที่สอบจบ ราชสำนักรับชื่อในโถงหน้า ร้านช่างของฮาลเดนหาลูกมือที่อ่านสูตรออก แผ่นสุดท้ายเขียนด้วยถ่าน ห้องเหนือร้านเชือกในย่านโรงกลั่นว่าง ใครจะรักษาคนเจ็บไม่ต้องมีใบอนุญาต
  choices:
    - id: west_roof
      label: ขึ้นบันไดไปขอโต๊ะใต้หลังคาตึกตะวันตก
      text: |
        อาจารย์ที่ถามข้อสุดท้ายเป็นคนเปิดประตูห้องให้ ห้องเล็ก หน้าต่างเปิดได้ เห็นหลังคาหอพักที่{name}นอนมาหกปี กับหน้าต่างชั้นสี่ของห้องห้าคน ตอนนั้นมีคนกำลังโยนฟูกเก่าลงมาที่ลานข้างล่าง

        เขาบอกว่าคนที่ไม่ได้เป็นของใคร สถาบันให้เงินเดือนเท่ากับคนอื่น ไม่มากกว่า แต่ไม่มีใครมาขอดูสมุดของ{name}ก่อนเขาจะได้อ่าน แล้วเขาก็วางกุญแจห้องลงบนโต๊ะ ไม่ได้ยื่นใส่มือ
      effects: { mark: จบจากสถาบันเวทหลวง, reputation: { royal_institute: 1 }, flags: [job_researcher] }
    - id: crown_seal
      label: ไปรับตราราชสำนักในโถงหน้า
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เอดริคยังอยู่ที่โต๊ะของราชสำนัก เขาแนะนำ{name}กับคนของราชสำนักเหมือน{name}เป็นของที่เขาหามาให้ คนของราชสำนักถามว่าใครจ่ายค่าเรียน {name}บอกว่าไม่มีใคร เขาเลิกคิ้ว แล้วเขียนชื่อลงแผ่นแรก ไม่ใช่แผ่นที่สาม

          ห้องทำงานของราชสำนักอยู่ใต้หอบันทึกหลวง มีตะเกียงฟ้าสองดวงและตู้เอกสารที่ลงกุญแจทุกตู้ วันแรก{name}ได้กุญแจมาหนึ่งดอก ไขได้ตู้เดียว
        effects: { stats: { CHA: 1 }, mark: จบจากสถาบันเวทหลวง, reputation: { crown: 1 }, flags: [job_researcher, crown_paid_researcher] }
      failure:
        text: |
          คนของราชสำนักถามว่าใครจ่ายค่าเรียน {name}บอกว่าไม่มีใคร เขาเขียนชื่อลงแผ่นที่สาม บอกว่าคนที่ไม่มีใครจ่ายให้ ราชสำนักไม่รู้ว่าจะไปถามใครเมื่อคนคนนั้นทำพลาด

          ห้องทำงานอยู่ใต้หอบันทึกหลวง ชั้นใต้ดิน ตะเกียงฟ้าดวงเดียว ตู้เอกสารทุกตู้ลงกุญแจ{name}ไม่ได้กุญแจสักดอก
        effects: { mark: จบจากสถาบันเวทหลวง, reputation: { crown: 1 }, flags: [job_researcher, crown_paid_researcher] }
    - id: haldans_shop
      label: เดินไปร้านช่างของฮาลเดน
      text: |
        ช่างใหญ่ตาข้างหนึ่งขุ่นเพราะประกายไฟ เขาไม่ถามว่า{name}จบสำนักไหน ยื่นแขนกลที่ข้อนิ้วหักให้หนึ่งข้างแล้วไปกินข้าวเที่ยง พอกินเสร็จ{name}ต่อข้อนิ้วได้สองข้อ ข้อที่สามยังงอไม่ลง

        ฮาลเดนหยิบแขนไปงอเองสามครั้ง ฟังเสียงเฟืองข้างใน แล้วบอกว่าพรุ่งนี้มาตอนไก่ขัน เปลวไฟในเตาเผาโลหะต้องจุดก่อนตะวันขึ้น ขากลับ{name}เดินผ่านประตูสถาบันโดยไม่มีใครเรียกชื่อ เสื้อคลุมขอบน้ำเงินพับอยู่ใต้แขน
      effects: { stats: { DEX: 1 }, mark: จบจากสถาบันเวทหลวง, flags: [job_artificer] }
    - id: rope_shop_room
      label: ฉีกแผ่นถ่านลงจากกระดาน ไปเช่าห้องเหนือร้านเชือก
      text: |
        คนขายเชือกข้างล่างให้เช่าห้องราคาครึ่งเดียว เพราะคนเช่าคนก่อนเป็นหมอเหมือนกัน แล้วหายไปตอนกลางคืนโดยไม่เอาของไปสักชิ้น เตียงสองเตียง ผ้าพันแผลต้มแล้วพับเป็นกอง ขวดยาเรียงบนชั้น ฉลากเขียนด้วยลายมือที่{name}อ่านไม่ออกครึ่งหนึ่ง

        คนไข้คนแรกมาตอนตีสอง คนงานกะดึกที่นิ้วโป้งเกือบขาด {name}เย็บด้วยด้ายที่หมอคนก่อนทิ้งไว้ เขาจ่ายเป็นเชือกป่านหนึ่งขด แล้วถามว่าหมอคนเก่าไปไหน
      effects: { mark: จบจากสถาบันเวทหลวง, alignment: { moral: 1 }, flags: [job_hedge_doctor] }
