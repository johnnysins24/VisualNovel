# ชุด ม แพ็ก B: สำนักกลั่น สำนักจักรกลเวท สำนักตำรา สำนักละห้าเรื่อง
# ปีสาม อาจารย์ที่ปรึกษากับความลับ · ปีสี่ ฝึกงานนอกกำแพง · ปีห้า วิทยานิพนธ์ (ของอยู่ใน items_m_thesis.yaml)
# แล้วเรื่องหลังเรียน: ความลับกลับมาหา (school_<สำนัก>_comes_due) กับฝีมือของคนสำนักนั้น (school_<สำนัก>_craft)
# บทเรียนต้องจริงได้ทุกปีตั้งแต่ก่อนสงครามถ่านถึงหลังสงคราม: ไม่พูดถึงสงคราม หนี้สงคราม หรือค่าปฏิกรรม
# ห้ามบอกว่าสำนักจักรกลได้ม้วนลอกลายจากหินของตระกูลมาด้วยวิธีไหน
# ผู้จ่ายของสำนักจักรกลคืออู่หลวง (ตารางในคัมภีร์ไม่ได้บอก ชุดนี้เลือกเอง)

# ---------- สำนักกลั่น ----------

- id: adult.institute_distill_advisor
  stage: adult
  scene: laboratory
  weight: 20
  course: { id: institute, year: 3, track: distill }
  text: |
    สำนักกลั่นแปะรายชื่อคู่อาจารย์กับนักเรียนปีสามไว้ที่ประตูห้องล้างโหล ชื่อ{name}อยู่ใต้ชื่อซาเบล เทอร์ริค บรรทัดเดียว ใต้ชื่อเธอไม่มีนักเรียนคนอื่น

    งานแรกที่เธอให้ทำคือช่วยยกลังโหลเปล่าลงบันไดหลังห้องกลั่นที่สาม ผังที่แขวนอยู่หน้าตึกไม่มีบันไดนี้ {name}นับได้สามสิบเอ็ดขั้น ข้างล่างเป็นห้องยาวเพดานต่ำ ชั้นไม้ตั้งเรียงไปจนสุดผนังอีกฝั่ง บนชั้นมีโหลน้ำค้างดาวที่กลั่นเสร็จแล้วนับร้อยใบ ปิดจุกตะกั่วทุกใบ ไม่มีใบไหนติดป้ายขาย

    ซาเบลถอดถุงมือข้างขวา เอาข้อนิ้วเคาะโหลใบหน้าสุดสองครั้ง เสียงแก้วดังกลับมาสองครั้ง ช้ากว่าที่ควรครึ่งลมหายใจ แล้วดังครั้งที่สามเองโดยไม่มีใครเคาะ เธอสวมถุงมือกลับ บอกว่าห้องนี้ไม่มีชื่อ และไม่เคยมีใครเทโหลไหนทิ้ง ค่าน้ำมันตะเกียงกับค่าจุกตะกั่วมาจากสมาคมโรงกลั่นทุกสามเดือน สมุดบัญชีของสำนักลงไว้บรรทัดเดียว ช่องรายการเขียนว่า ไม่มี
  choices:
    - id: wipe_the_jars
      label: รับผ้าเช็ดโหลจากมือเธอ เริ่มจากชั้นล่างสุด
      check: { stat: INT, dc: 12 }
      effects: { flags: [saw_the_distill_secret, kept_the_distill_secret] }
      success:
        text: |
          {name}เช็ดไปถึงชั้นที่เจ็ดโดยไม่ให้โหลใบไหนกระทบกัน ซาเบลยืนอยู่ปลายแถว พอถึงใบที่ร้อยสิบสอง เธอบอกให้หยุด แล้วเคาะใบนั้นเองสองครั้ง เสียงตอบกลับมาสี่ครั้ง เธอจดเลขสี่ลงสมุดเล่มเล็ก ข้างเลขของเดือนก่อนที่เป็นสาม

          ก่อนขึ้นบันได เธอยื่นกุญแจดอกหนึ่งให้ ร้อยเชือกเส้นเดียวกับป้ายไม้เลขชั้นวางโหลที่{name}ห้อยคอมาตั้งแต่ปีสอง เช้าวันอุลเวนต่อจากนี้เป็นเวรของ{name}
        effects: { stats: { INT: 1 }, reputation: { royal_institute: 1 } }
      failure:
        text: |
          โหลใบที่สี่สิบกว่าลื่นออกจากผ้า ขอบกระทบไม้ชั้นแล้วร้าวเป็นเส้นตรงจากจุกถึงก้น เสียงที่ออกมาจากรอยร้าวไม่ใช่เสียงแก้ว ฟังคล้ายคนกลั้นหายใจไว้นานแล้วปล่อยออกทีเดียว หูของ{name}อื้อไปจนเย็น เลือดกำเดาหยดลงบนผ้าเช็ดโหลสองหยด

          ซาเบลเอาขี้ผึ้งอุดรอยร้าว พันผ้าป่านทับสามรอบ แล้ววางโหลใบนั้นกลับที่เดิม พรุ่งนี้{name}ต้องลงมาเช็ดชั้นนี้ต่อ เริ่มจากใบนั้น
        effects: { hp: -1 }
    - id: tell_theril
      label: เล่าให้เธริลฟังตอนกลางคืน ให้เขาเขียนลงจดหมายถึงไอเลธ
      text: |
        เธริลฟังจนจบโดยไม่ขัด แล้วขอให้{name}เล่าเสียงครั้งที่สามซ้ำอีกรอบ ช้าๆ เขาจดลงกระดาษบางแผ่นเดียวกับที่ใช้เขียนจดหมายกลับบ้านทุกเดือน อักษรเอลฟ์เส้นเล็กเท่าขาแมลง กระดาษแผ่นนั้นพับรวมไปกับจดหมายฉบับเดือนนั้น

        สองเดือนต่อมามีจดหมายจากไอเลธถึงเธริล เขายื่นให้{name}ดูบรรทัดเดียว เป็นคำถามว่าโหลใบนั้นตอบกี่ครั้งเมื่อเคาะในคืนเดือนมืด สัปดาห์เดียวกันประตูห้องล่างเปลี่ยนกุญแจ ดอกใหม่ซาเบลไม่ได้ร้อยเชือกให้{name}
      effects:
        reputation: { star_hall: 1, distillers: -1 }
        alignment: { law: -1 }
        people: [{ id: cohort_theril, closeness: 1 }]
        flags: [saw_the_distill_secret, told_the_distill_secret, asked_theril_to_write_of_the_jars]
    - id: walk_out
      label: วางลังโหลไว้ที่ขั้นบันได แล้วเดินขึ้นไปคนเดียว
      text: |
        {name}ขึ้นบันไดสามสิบเอ็ดขั้นโดยไม่หันกลับ ปลายเดือนนั้นนายทะเบียนฮัลบริคขีดชื่อ{name}ด้วยหมึกแดงเส้นเดียว ไม่ถามเหตุผล ช่องเหตุผลเขียนว่า ออกเอง

        ป้ายไม้เลขชั้นวางโหลยังห้อยคออยู่จนถึงประตูใหญ่ {name}ถอดออก ตั้งใจจะโยนลงคูหน้าสถาบัน แล้วเก็บใส่กระเป๋าแทน คืนแรกนอกกำแพง{name}นอนในโรงเตี๊ยมแถวท่าเรือเหาะ ได้ยินแก้วกระทบกันในห้องข้างล่างทั้งคืน ทุกเสียงดังช้ากว่าที่ควรครึ่งลมหายใจ
      effects:
        stats: { WIS: 1 }
        course: { leave: true }
        mark: ออกจากสถาบัน
        flags: [saw_the_distill_secret, kept_the_distill_secret, institute_left, left_institute_over_distill]

- id: adult.institute_distill_field
  stage: adult
  scene: refinery
  weight: 20
  course: { id: institute, year: 4, track: distill }
  text: |
    ฤดูฝึกงานของปีสี่ สำนักส่ง{name}เข้ากะดึกของโรงกลั่นริมคลองในย่านโรงกลั่น หัวหน้ากะชื่อบาริค แขนขวาลวกจนผิวเป็นมันตั้งแต่ข้อมือถึงไหล่ เรียกนักเรียนสถาบันทุกคนว่าคุณตำรา ไม่เคยถามชื่อ

    ตำราของสำนักบอกให้ดับไฟหม้อกลั่นเมื่อเข็มแตะขีดสาม เกินจากนั้นแก้วในท่อจะเริ่มร้อง กะของบาริคดับที่ขีดสี่ทุกหม้อ ได้น้ำค้างดาวเพิ่มอีกหนึ่งในห้า สมาคมจ่ายค่ากะตามจำนวนหลอด ไม่ได้จ่ายตามชั่วโมง

    ตีสองคืนหนึ่ง เข็มของหม้อห้าเลยขีดสามไปครึ่งช่อง ท่อแก้วเริ่มส่งเสียงบางๆ คล้ายนิ้วถูขอบถ้วย ใต้หม้อมีเด็กเติมถ่านคนหนึ่งนอนหลับอยู่บนกองกระสอบ บาริคยืนนับหลอดอยู่ปลายแถว หันหลังให้
  choices:
    - id: close_at_three
      label: ดับไฟหม้อห้าตามตำรา
      text: |
        เสียงในท่อแก้วลดลงทีละน้อยจนหายไป บาริคได้ยินว่าเสียงหายก่อนเวลา เดินมาดูเข็ม แล้วเขียนลงสมุดกะบรรทัดเดียว หม้อห้า คุณตำราดับ หลอดที่หายไปหนึ่งในห้าของหม้อนั้นหักจากค่ากะของทุกคนเท่ากันในสัปดาห์นั้น

        คืนต่อมาไม่มีใครในกะยื่นขนมปังให้{name}ตอนพักตีสาม เด็กเติมถ่านย้ายไปนอนใต้หม้อสี่
      effects: { stats: { INT: 1 }, reputation: { distillers: -1 }, flags: [closed_pot_five_at_three] }
    - id: run_to_four
      label: ปล่อยให้ถึงขีดสี่แบบที่กะนี้ทำ
      text: |
        เสียงร้องในท่อสูงขึ้นจนเป็นเสียงหวีดแหลมบางเท่าเส้นด้าย เด็กใต้หม้อพลิกตัวสองครั้งแต่ไม่ตื่น ถึงขีดสี่บาริคดับไฟทุกหม้อพร้อมกันด้วยมือข้างที่ลวก หลอดของหม้อห้าออกมาขุ่นกว่าหลอดอื่นเท่าเส้นผม ไม่มีคนซื้อคนไหนดูออก

        ตอนเช้าบาริคแจกค่ากะเป็นกองบนฝาหม้อ ส่วนของ{name}สองเหรียญ เขาตบหลังแล้วบอกว่าคุณตำราคนนี้ใช้ได้ ท่อแก้วของหม้อห้ามีรอยร้าวบางเท่าเส้นผมอยู่ใต้ข้อต่อ บาริคทาชันทับไว้ก่อนกะเช้ามาถึง
      effects: { gold: 2, alignment: { law: -1 }, reputation: { distillers: 1 }, flags: [ran_the_pots_to_four] }
    - id: cool_by_hand
      label: ปลุกเด็กให้ออกไปก่อน แล้วประคองท่อด้วยเวทเย็นที่ใช้กับโหล
      check: { stat: CON, dc: 12 }
      success:
        text: |
          {name}จับท่อแก้วทั้งสองมือ ปล่อยเวทเย็นที่สำนักสอนให้ใช้ประคองโหลตอนขนลงบันได ความร้อนไหลเข้าฝ่ามือจนแสบขึ้นไปถึงข้อศอก เข็มถอยกลับมาที่ขีดสาม หม้อห้ากลั่นต่อไปถึงขีดสี่โดยไม่ร้องอีก

          บาริคเดินมาดูฝ่ามือที่แดงเป็นปื้นทั้งสองข้าง สั่งเด็กเติมถ่านให้ไปเอาน้ำมันหมูมาทาให้คุณตำรา คืนนั้นเขาถามชื่อ{name} แล้วเขียนลงสมุดกะในช่องที่เคยเขียนว่าคุณตำรา
        effects: { stats: { CON: 1 }, flags: [cooled_pot_five_by_hand] }
      failure:
        text: |
          ท่อแก้วร้าวใต้ฝ่ามือ ไอน้ำค้างดาวพุ่งออกมาเป็นเส้นขาว {name}ปล่อยมือไม่ทัน ผิวฝ่ามือพองเป็นตุ่มใสทั้งสองข้าง เด็กเติมถ่านยืนอยู่ข้างประตูแล้ว ไม่เป็นอะไรเลยสักนิด

          บาริคต้องปิดทั้งแถว กะนั้นได้หลอดไม่ถึงครึ่ง ทั้งฤดูไม่มีคนในกะพูดกับ{name}อีก ยกเว้นเด็กเติมถ่าน ที่เอาตลับน้ำมันหมูมาวางไว้ข้างหม้อห้าให้ทุกคืน
        effects: { hp: -2, flags: [cracked_pot_five] }

- id: adult.institute_distill_thesis
  stage: adult
  scene: laboratory
  weight: 20
  course: { id: institute, year: 5, track: distill }
  text: |
    วิทยานิพนธ์ของสำนักกลั่นต้องเป็นของที่ใช้ได้ในห้องกลั่นจริง อาจารย์สามคนลงชื่อรับ หนึ่งในสามต้องเป็นอาจารย์ที่ปรึกษา

    {name}เลือกทำปลอกมือ ต้นคิดมาจากถุงมือของซาเบล ถุงมือที่เธอไม่เคยถอดตอนจับมือคน แต่ถอดทุกครั้งตอนจับโหล ปลอกมือของ{name}มีข้างซ้ายข้างเดียว ข้อนิ้วเป็นเกล็ดทองเหลืองซ้อนกัน ซับในต้องเก็บความเย็นที่รั่วจากโหลไว้ในตัว ไม่ให้ขึ้นไปถึงกระดูกของคนสวม ชิ้นแรกกับชิ้นที่สองซับในแตก ชิ้นที่สามทนได้ครึ่งชั่วยาม

    สัปดาห์ก่อนวันส่ง ชายเสื้อคลุมสีน้ำตาลจากสมาคมโรงกลั่นมานั่งรอที่ม้านั่งหน้าห้องล้างโหล ถุงเงินวางบนตัก เขาบอกว่าถ้าแบบนี้ใช้ได้ สมาคมอยากซื้อชิ้นแรกไปทั้งชิ้นพร้อมแบบ ชื่อคนทำยังอยู่ในทะเบียนของสถาบันตามเดิม
  choices:
    - id: remake_with_fleece
      label: ทำซับในใหม่ด้วยหนังแกะทั้งผืน ให้ทันวันสอบ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ไม่ได้นอนสี่คืน หนังแกะที่แช่น้ำมันมาห้าวันเก็บความเย็นจากโหลห้องล่างได้ครบชั่วยาม วันสอบ อาจารย์คนที่สามให้{name}สวมปลอกมือแล้วจับโหลที่เย็นที่สุดในห้องไว้จนเทียนบนโต๊ะสอบละลายไปหนึ่งขีด นิ้วทั้งห้ายังงอได้

          ซาเบลลงชื่อเป็นคนสุดท้าย ลายมือของเธอเอียงไปทางซ้าย เพราะเขียนทั้งถุงมือ
        effects: { stats: { INT: 1 }, items: [still_keeper_gauntlet], flags: [thesis_distill] }
      failure:
        text: |
          ซับในชิ้นใหม่แข็งตัวกลางห้องสอบ ความเย็นทะลุขึ้นไปถึงข้อศอก {name}ต้องแกะปลอกมือออกต่อหน้าอาจารย์สามคน นิ้วชาไปจนค่ำ

          งานผ่าน ใต้ชื่อในสมุดผลสอบมีหมายเหตุหนึ่งบรรทัดด้วยลายมือเอียงซ้ายของซาเบล ความคิดถูก มือยังไม่ถึง ปลอกมือชิ้นนั้นสำนักเก็บเข้าตู้ของเสีย ของที่เคยจับโหลห้องล่างแล้วห้ามออกจากตึก
        effects: { hp: -1, flags: [thesis_distill] }
    - id: mend_the_third
      label: ซ่อมชิ้นที่สาม แล้วบอกอาจารย์ตรงๆ ว่าทนได้นานแค่ไหน
      text: |
        {name}เสริมเกล็ดอีกสองแผ่นตรงข้อนิ้วโป้ง เย็บซับในใหม่ตรงที่แตก วันสอบ อาจารย์คนที่สามพลิกนาฬิกาทรายครั้งเดียว ปลอกมือทนได้จนทรายหมด แล้วทนต่ออีกสิบลมหายใจ

        ซาเบลลงชื่อรับ เขียนใต้ชื่อว่าซื่อตรงเรื่องเวลา ชายเสื้อน้ำตาลกลับไปมือเปล่า เขาทิ้งป้ายไม้ของสมาคมไว้บนม้านั่ง เผื่อวันหลังมีคนเปลี่ยนใจ
      effects: { items: [still_keeper_gauntlet], flags: [thesis_distill] }
    - id: sell_to_the_guild
      label: ขายชิ้นแรกกับแบบให้สมาคมโรงกลั่น
      text: |
        ชายเสื้อน้ำตาลนับเหรียญลงบนม้านั่งทีละเหรียญจนครบห้า ปลอกมือออกจากสถาบันในกล่องไม้บุฟางก่อนวันสอบหนึ่งวัน อาจารย์สามคนสอบจากภาพลอกกับแบบ ทะเบียนเขียนชื่อ{name}ไว้ใต้ภาพลอกตามสัญญา ส่วนตัวของอยู่ในโรงกลั่นแห่งหนึ่งริมคลอง

        ปีต่อมา หัวหน้ากะทุกโรงของสมาคมสวมปลอกมือทองเหลืองข้างซ้ายแบบเดียวกัน ซับในเป็นหนังวัว ราคาครึ่งเดียว
      effects: { gold: 5, reputation: { distillers: 1 }, flags: [thesis_distill, sold_the_gauntlet_to_the_guild] }

- id: adult.school_distill_comes_due
  stage: adult
  scene: home
  weight: 25
  when:
    age: [26, 45]
    flags: [saw_the_distill_secret]
    not_flags: [institute_student]
  text: |
    กริสซา คนรับซื้อแก้วแตกที่เข็นรถไปตามประตูหลังของโรงกลั่นทุกโรงในเวนทราส ตามหา{name}จนเจอ เธอวางห่อผ้าบนโต๊ะแล้วแกะออก ข้างในเป็นโหลน้ำค้างดาวปิดจุกตะกั่ว คอโหลมีรอยเชือกที่เคยผูกป้าย ตัวป้ายไม่อยู่แล้ว

    เธอได้โหลใบนี้มาจากกองแก้วหลังสถาบัน กองที่เธอรับไปหลอมทุกเดือน คนขนจากห้องกลั่นวางผิดกอง ตอนจะโยนลงเตา เธอเคาะดูครั้งเดียว ได้ยินเสียงตอบสองครั้ง แล้วยืนนิ่งอยู่หน้าเตาจนคนงานหลอมต้องเรียก ชื่อ{name}เธอได้มาจากคนเฝ้าประตูหลัง แลกกับเหรียญหนึ่งเหรียญ

    กริสซาไม่อยากได้คืน ไม่อยากหลอม และไม่อยากเอากลับไปไว้ในบ้านอีกแม้คืนเดียว
  choices:
    - id: send_it_back
      label: เอาโหลไปส่งคืนที่ประตูหลังของสถาบันด้วยตัวเอง
      requires: { flag: kept_the_distill_secret }
      text: |
        คนเฝ้าประตูหลังรับโหลไปโดยไม่ถามว่ามาจากไหน ไม่นานหลังจากนั้นชายเสื้อคลุมสีน้ำตาลมาเคาะประตูบ้าน{name} วางเหรียญสามเหรียญบนธรณี บอกว่าสมาคมโรงกลั่นขอบคุณที่เก็บของหายให้ แล้วไปโดยไม่รอให้ใครเชิญเข้าบ้าน

        {name}แบ่งให้กริสซาหนึ่งเหรียญ เธอรับไว้ แล้วถามว่าตอนวางโหลลงที่ประตูหลัง ข้างในตอบอะไรหรือเปล่า
      effects: { gold: 2, reputation: { distillers: 1 }, flags: [sent_the_silent_jar_back] }
    - id: send_it_west
      label: จ่ายค่าฝากไปกับกองเกวียนขึ้นไอเลธ ให้หอนับดาวเก็บไว้
      requires: { flag: told_the_distill_secret, min_gold: 2 }
      text: |
        คนคุมกองเกวียนรับห่อไปพร้อมเหรียญสองเหรียญ ผูกไว้ใต้เบาะคนขับตามที่{name}ขอ ห่างจากหีบอื่น กริสซากลับไปโดยไม่ขอเหรียญที่เสียไปที่ประตูหลังคืน

        สามเดือนต่อมามีจดหมายจากหอนับดาว อักษรเอลฟ์เส้นเล็ก บอกว่าโหลถึงแล้ว เคาะแล้ว ตอบสามครั้ง ในป่าตอบช้ากว่าในเมืองครึ่งลมหายใจ ท้ายจดหมายถามว่าสถาบันมีโหลแบบนี้อีกกี่ใบ
      effects:
        gold: -2
        reputation: { star_hall: 1, distillers: -1 }
        flags: [sent_the_silent_jar_west]
    - id: drown_it
      label: เอาโหลลงไปในน้ำที่ลึกที่สุดแถวนั้น แล้วทุบใต้น้ำ
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}เดินลงน้ำไปจนน้ำถึงอก เอาโหลกดลงไปใต้น้ำทั้งใบ แล้วทุบด้วยด้ามค้อนครั้งเดียว เสียงตอบดังขึ้นครั้งเดียวใต้น้ำ เป็นฟองอากาศก้อนใหญ่ลอยขึ้นมาแตกตรงหน้า ไม่มีใครบนตลิ่งได้ยินอะไร

          เศษแก้วจมลงไปหมด กริสซายืนรออยู่บนตลิ่ง เธอถามแค่ว่าเปียกถึงไหน แล้วยื่นผ้าห่มจากรถเข็นให้
        effects: { stats: { WIS: 1 }, flags: [drowned_the_silent_jar] }
      failure:
        text: |
          โหลลื่นขึ้นมาจากมือก่อนค้อนจะลง แตกบนหินริมตลิ่ง เสียงที่ออกมาเหมือนคนร้องเรียกชื่อใครสักคนจากหลังประตูปิด {name}เลือดกำเดาไหลทั้งสองข้าง กริสซาหูอื้อไปสามวัน

          เศษแก้วบนหินยังสั่นเบาๆ อยู่ทั้งสัปดาห์ เด็กแถวนั้นเก็บไปทำลูกเต๋า แล้วเอามาคืนในวันเดียวกัน
        effects: { hp: -2, world: { star: 1 }, flags: [broke_the_silent_jar] }
    - id: keep_it
      label: ให้เงินกริสซาหนึ่งเหรียญ แล้วเก็บโหลไว้เอง
      requires: { min_gold: 1 }
      text: |
        {name}ห่อโหลด้วยผ้าขนสัตว์สองชั้น ใส่ไว้ในหม้อดินใต้เตียง กริสซารับเหรียญแล้วรีบไป ทิ้งผ้าห่อเดิมไว้บนโต๊ะ

        ทุกครั้งที่มีคนเคาะประตูบ้าน ในหม้อดินมีเสียงตอบเบาๆ ช้ากว่าครึ่งลมหายใจ เดือนที่สอง{name}เริ่มเคาะประตูบ้านตัวเองสองครั้งก่อนไขกุญแจเข้าไป
      effects: { gold: -1, world: { star: 1 }, flags: [kept_a_silent_jar] }

- id: adult.school_distill_craft
  stage: adult
  scene: market
  weight: 25
  when:
    age: [23, 50]
    flags: [school_distill, institute_graduate]
  text: |
    ร้านขายหลอดน้ำค้างดาวในตลาดเช้าเติมหลอดเองหลังแผง แม่ค้าเติมเร็ว เติมเต็มปากหลอดทุกหลอด ลูกค้าชอบเพราะได้เต็ม {name}ยืนรอซื้อของที่แผงข้างๆ แล้วได้ยินเสียงบางๆ ดังมาจากถาดหลอดที่เพิ่งเติม เสียงนิ้วถูขอบถ้วย

    หลอดที่ร้องดังที่สุดอยู่ในมือเด็กผู้หญิงคนหนึ่ง เด็กเพิ่งจ่ายเงิน กำหลอดไว้แน่นด้วยมือทั้งสองข้าง บอกแม่ค้าว่าหลอดเย็นจนมือเจ็บ แม่ค้าบอกให้กำไว้อย่างนั้น เดี๋ยวก็อุ่น

    คนสำนักกลั่นรู้ตั้งแต่เดือนแรกในสำนักว่าหลอดที่เติมเกินขีดแล้วเริ่มร้อง เหลือเวลาราวสิบลมหายใจ
  choices:
    - id: take_the_tube
      label: คว้าหลอดออกจากมือเด็ก
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}จับข้อมือเด็ก กดตรงโคนนิ้วโป้งให้มือคลายออกเอง หลอดหล่นลงในอุ้งมือ{name} แล้วลอยต่อลงรางน้ำม้าหน้าร้านในลมหายใจเดียวกัน น้ำในรางแข็งเป็นแผ่นหนาเท่าฝ่ามือ ม้าที่ก้มกินน้ำอยู่ยกหัวขึ้นแล้วถอยหลังสองก้าว

          แม่ค้ายกถาดหลอดที่เหลือเข้าไปหลังร้านโดยไม่ต้องมีใครบอก เด็กยืนเป่ามือที่แดงเป็นปื้น แล้วถามว่าจะได้เงินคืนไหม
        effects: { stats: { DEX: 1 }, alignment: { moral: 1 }, flags: [pulled_a_singing_tube] }
      failure:
        text: |
          นิ้วของเด็กไม่ยอมคลาย {name}ต้องง้างทีละนิ้ว นับได้ถึงนิ้วที่สี่ หลอดก็แตกในมือของทั้งสองคน ไอเย็นพุ่งขึ้นเป็นก้อนขาว {name}เอามือตัวเองครอบมือเด็กไว้ หลังมือ{name}ขาวแข็งเหมือนไขมันในหม้อที่ทิ้งไว้ข้ามคืน เด็กเจ็บแค่ปลายนิ้ว

          หมอในตลาดทาน้ำมันห่านให้ บอกว่าเล็บสองเล็บจะหลุด แล้วงอกใหม่ภายในฤดูเดียว
        effects: { hp: -2, alignment: { moral: 1 }, flags: [pulled_a_singing_tube] }
    - id: warn_the_queue
      label: บอกเสียงดังพอให้ทั้งแถวได้ยินว่าหลอดถาดนี้เติมเกินขีด
      text: |
        แม่ค้าคว้าหลอดจากมือเด็กแล้วโยนลงรางน้ำม้าเร็วจน{name}รู้ว่าเธอเคยทำแบบนี้มาก่อน น้ำในรางแข็งเป็นแผ่น คนในแถวแยกย้ายไปทีละสองสามคน บางคนหันมาดูหน้า{name}ให้จำได้

        เช้าวันต่อมาร้านนั้นยังเปิด ถาดหลอดยังเต็มปากหลอดทุกหลอด ข้างแผงมีรางน้ำใบใหม่วางเพิ่มมาอีกหนึ่งใบ
      effects: { alignment: { law: 1 }, flags: [warned_a_queue_of_overfill] }
    - id: pay_to_bleed
      label: จ่ายแม่ค้าให้หยุดขายครึ่งเช้า แล้วนั่งปล่อยไอส่วนเกินทิ้งทีละหลอด
      requires: { min_gold: 2 }
      text: |
        {name}เอาหลอดออกจากมือเด็กอย่างช้าๆ ส่งหลอดที่เพิ่งปล่อยไอให้แทน แล้วนั่งลงหลังแผง เอาเข็มเย็บผ้าเจาะจุกขี้ผึ้งทีละหลอด ปล่อยไอออกจนเสียงร้องหาย วิธีเดียวกับที่นักเรียนใหม่ของสำนักกลั่นทำทุกเช้าก่อนเรียน

        ไอขาวลอยขึ้นเหนือแผงยี่สิบเจ็ดครั้ง แม่ค้ายืนกอดอกดูอยู่ข้างๆ พอหลอดสุดท้ายเงียบ เธอถามว่าเข็มเล่มนั้นขายไหม
      effects: { gold: -2, alignment: { moral: 1 }, flags: [bled_a_tray_of_tubes] }
    - id: gauntlet_grip
      label: สวมปลอกมือทองเหลืองข้างซ้าย แล้วรับหลอดจากมือเด็ก
      requires: { item: still_keeper_gauntlet }
      text: |
        หลอดเงียบลงทันทีที่เกล็ดทองเหลืองปิดรอบหลอด {name}ถือไว้จนเด็กหายใจทัน แล้วจับหลอดในถาดทีละหลอดจนครบ เกล็ดที่ข้อนิ้วขึ้นฝ้าขาวทีละแผ่น แม่ค้ายืนนับตาม ไม่กล้าขายหลอดไหนก่อน{name}จะวาง

        ตอนถอดปลอกมือ นิ้วทั้งห้าชาขึ้นไปถึงข้อศอก แม่ค้าจะจับมือขอบใจ แล้วชักมือกลับเองครึ่งทาง เช้าวันต่อมาหลอดในถาดของเธอเติมต่ำกว่าขีดครึ่งเส้น
      effects: { reputation: { distillers: 1 }, alignment: { moral: 1 }, flags: [quieted_a_tray_in_the_gauntlet] }

# ---------- สำนักจักรกลเวท ----------

- id: adult.institute_machine_advisor
  stage: adult
  scene: workshop
  weight: 20
  course: { id: institute, year: 3, track: machine }
  text: |
    โกรดัน ตระกูลเฟืองหัก รับนักเรียนปีสามปีละสองคน คนที่อยากเป็นลูกศิษย์ต้องมาตะไบเฟืองให้เขาดูทุกเช้า ใครตะไบแล้วยังมีแสงลอดใต้ไม้บรรทัดเหล็ก เขาไม่บอกว่าไม่รับ เขาแค่ไม่มาอีก เช้าที่สามเขายังมายืนข้างโต๊ะของ{name}

    งานแรกคือคัดแบบแขนกลจากม้วนกระดาษลอกลายลงกระดาษสะอาด ม้วนมาในกล่องหนังที่ฝาตอกตราเรือของอู่หลวง ลายบนกระดาษเป็นรอยถ่านที่ถูลงบนหินสลัก เห็นเนื้อหินเป็นจุดๆ ข้อต่อตรงข้อศอกเป็นแบบที่สำนักไม่เคยสอน ลิ่มสามตัวขบกันโดยไม่มีหมุด

    มุมล่างขวาของม้วนมีลายที่ไม่ใช่แบบแขน ค้อนไขว้สองอันกับขีดเก้าขีด ตราตระกูลที่ติดมาตอนถู โกรดันชี้มุมนั้นด้วยนิ้วที่ดำด้วยน้ำมัน บอกว่าลอกทุกเส้น เว้นตรงนั้น ตรงนั้นไม่ใช่ของเรา ที่เหลือก็ไม่ใช่ แต่อู่หลวงจ่ายค่าสอนไปแล้ว ม้วนแบบลงมาจากทุนดาร์ปีละม้วน ตระกูลที่เป็นเจ้าของหินไม่เคยรู้ หัวเข็มขัดของเขายังเรียบเหมือนวันแรกที่{name}เห็น
  choices:
    - id: copy_it_clean
      label: ลอกตามที่สั่ง เว้นมุมล่างขวา
      check: { stat: DEX, dc: 12 }
      effects: { flags: [saw_the_machine_secret, kept_the_machine_secret] }
      success:
        text: |
          {name}ลอกอยู่สิบเอ็ดวัน เส้นสุดท้ายคือขอบของลิ่มตัวที่สาม โกรดันวางไม้บรรทัดเหล็กทาบทีละเส้น ไม่มีเส้นไหนเกินแบบแม้แต่ความหนาของถ่าน

          เขาใส่ม้วนเดิมคืนกล่องหนัง ปิดฝาเอง แล้วยื่นแบบที่{name}ลอกให้เสมียนของอู่หลวงที่รออยู่หน้าประตู เสมียนลงชื่อรับ ช่องผู้ลอกเขียนชื่อสำนัก
        effects: { stats: { DEX: 1 } }
      failure:
        text: |
          ตะเกียงบนโต๊ะเอียงตอน{name}เอื้อมไปหยิบถ่าน เปลวไฟเลียมุมล่างขวาของม้วนเดิม {name}ตบไฟดับด้วยมือเปล่า ฝ่ามือพองเป็นแผล ตราค้อนไขว้กับขีดเก้าขีดกลายเป็นรูขอบดำเท่าเหรียญ

          โกรดันหยิบม้วนขึ้นส่องตะเกียง ยื่นนิ้วเข้าไปในรูนั้น แล้วบอกว่าตอนนี้ม้วนนี้ไม่มีเจ้าของแล้ว ให้ลอกต่อ
        effects: { hp: -1, flags: [burned_the_clan_corner] }
    - id: carry_the_mark
      label: จำตรามุมล่างไว้ แล้วไปถามช่างคนแคระที่ประตูตะวันออก
      text: |
        ร้านตีเหล็กหน้าประตูตะวันออกของเวนทราสเป็นของดากรุม ตระกูลค้อนเก้า {name}เอาเศษถ่านวาดตราลงบนโต๊ะหน้าร้าน ไม่ทันเสร็จ ดากรุมก็เอาแขนเสื้อปาดทิ้ง แล้วถามว่าเห็นที่ไหน {name}ตอบตามจริง เขาลงกลอนบานร้านตั้งแต่ยังไม่เที่ยง

        ร้านปิดไปสามสัปดาห์ วันที่กลับมาเปิด บนบานประตูมีตราค้อนไขว้กับขีดเก้าขีดตอกใหม่ ตัวโตเท่าฝ่ามือ ลึกจนนิ้วสอดลงไปได้
      effects:
        reputation: { dwarf_council: 1, royal_institute: -1 }
        alignment: { law: -1 }
        flags: [saw_the_machine_secret, told_the_machine_secret, showed_dagrum_the_mark]
    - id: hand_back_the_roll
      label: เก็บม้วนกระดาษคืนกล่อง แล้วบอกเขาว่าลอกไม่ได้
      text: |
        โกรดันรับกล่องคืน ไม่ถามเหตุผล เขาบอกว่าคนแคระวัดคนด้วยไม้บรรทัดอันเดียว เส้นตรงหรือไม่ตรง ไม่มีครึ่ง แล้วนั่งลงตะไบเฟืองตัวที่ค้างอยู่ต่อ

        ปลายเดือน{name}ออกจากสถาบัน ตะไบด้ามสึกที่สำนักแจกตั้งแต่ปีสองวางคืนไว้บนลังไม้คว่ำกลางลานหลังตึก ข้างจานข้าวของโกรดัน สัปดาห์ต่อมาตะไบยังวางอยู่ที่เดิม ไม่มีใครหยิบไปแจกคนใหม่
      effects:
        alignment: { moral: 1 }
        course: { leave: true }
        mark: ออกจากสถาบัน
        flags: [saw_the_machine_secret, kept_the_machine_secret, institute_left, left_institute_over_machine]

- id: adult.institute_machine_field
  stage: adult
  scene: ship_deck
  weight: 20
  course: { id: institute, year: 4, track: machine }
  text: |
    ดอร์กาตื่นก่อนทุกคนในเรือนพักของอู่หลวง นั่งนับหนี้ของตระกูลลิ่มเหล็กกับธนาคารเบเลคบนกระดาษแผ่นเดิมทุกเช้า ตัวเลขลดลงทีละนิดทุกครั้งที่ค่าจ้างของเธอส่งถึงบ้าน แล้วเพิ่มขึ้นเองทุกต้นเดือนตามดอก

    ฤดูฝึกงานปีสี่ สำนักส่งเธอกับ{name}มาต่อข้อแขนเครนบนดาดฟ้าของเรือเหาะลำที่ยังต่อไม่เสร็จ นายช่างคุมงานชื่อเคสตัน คนเวนทราสแท้ พูดเร็ว นับหมุดเร็วกว่าพูด

    ตำราของสำนักบอกว่าข้อแขนเครนใช้หมุดสองตัวต่อข้อ แบบของอู่บอกตัวเดียว ตอนกินข้าวกลางวัน ดอร์กาบอก{name}เสียงเบาพอให้เคสตันไม่ได้ยิน ว่าบนเขาไม่มีตระกูลไหนใช้หมุด ทุกตระกูลใช้ลิ่มสามตัวขบกัน ต่างกันที่รอยบากของลิ่ม {name}เคยเห็นข้อต่อแบบนั้นครั้งเดียว บนม้วนลอกลายในปีสาม
  choices:
    - id: two_rivets
      label: ต่อตามตำรา หมุดสองตัวทุกข้อ
      text: |
        เคสตันนับหมุดที่{name}เบิกไปแล้วบ่นว่าเปลืองกว่าแบบเท่าตัว แต่ไม่สั่งให้รื้อ ข้อแขนของ{name}เสร็จช้ากว่าคนอื่นสองวัน

        วันยกเครื่องยนต์ชิ้นแรกขึ้นดาดฟ้า แขนเครนทุกข้อร้องเอี๊ยดตอนรับน้ำหนัก ยกเว้นสามข้อที่{name}ต่อ เคสตันเดินไปฟังทีละข้อ แล้วจดเลขข้อลงสมุด
      effects: { stats: { INT: 1 }, alignment: { law: 1 }, flags: [riveted_the_crane_by_the_book] }
    - id: dorgas_wedges
      label: ขอให้ดอร์กาสอนข้อต่อลิ่มสามตัว
      check: { stat: DEX, dc: 12 }
      effects: { people: [{ id: cohort_dorga, closeness: 1 }] }
      success:
        text: |
          ดอร์กาสอนบนดาดฟ้าตอนกลางคืน ใช้ลิ่มไม้แทนเหล็กจะได้ไม่มีเสียง ข้อต่อลิ่มข้อแรกของ{name}ขบแน่นจนเธอต้องใช้ค้อนไม้เคาะถึงจะแยกออก เคสตันเห็นตอนเช้า ถามว่าแบบนี้มาจากตำราเล่มไหน ดอร์กาตอบว่าเล่มที่ไม่มีในห้องสมุด

          ก่อนจบฤดู เคสตันวาดข้อต่อนั้นลงสมุดของอู่ ข้างภาพเขียนว่า แบบลิ่มเหล็ก คืนนั้นดอร์กาฉีกหน้านั้นออกตอนเขาไปห้องน้ำ แล้วเอาไปเผาในเตาหลอมหมุด
        effects: { stats: { DEX: 1 }, flags: [learned_dorgas_wedge_joint] }
      failure:
        text: |
          ลิ่มตัวที่สามเด้งออกจากข้อตอนเครนยกของชิ้นแรก ฟาดหน้าแข้ง{name}จนเป็นรอยเขียวยาวเท่าฝ่ามือ ของที่ยกค้างอยู่กลางอากาศครึ่งลมหายใจก่อนข้อจะขบกลับเอง

          ดอร์กาเปลี่ยนข้อนั้นเป็นหมุดก่อนเคสตันจะเดินมาถึง คืนนั้นเธอนั่งตะไบลิ่มชุดใหม่ให้{name}จนตีหนึ่ง กระดาษนับหนี้วางพับอยู่ข้างตัว
        effects: { hp: -1, flags: [learned_dorgas_wedge_joint] }
    - id: one_rivet
      label: ต่อตามแบบของอู่ หมุดตัวเดียว
      text: |
        งานเสร็จก่อนกำหนดสามวัน เคสตันจ่ายรางวัลคนที่เสร็จก่อน ส่วนของ{name}สองเหรียญ ดอร์กาได้เท่ากัน เช้าวันต่อมาเธอบวกสองเหรียญนั้นลงกระดาษหนี้

        ปลายปีมีข่าวจากอู่ว่าแขนเครนตัวนั้นหักที่ข้อที่สี่ ไม่มีใครเจ็บ อู่เปลี่ยนแขนใหม่ทั้งแขน ใช้หมุดตัวเดียวเหมือนเดิม
      effects: { gold: 2, flags: [riveted_the_crane_with_one] }

- id: adult.institute_machine_thesis
  stage: adult
  scene: workshop
  weight: 20
  course: { id: institute, year: 5, track: machine }
  text: |
    ประแจบนโต๊ะของ{name}มีด้ามเดียวเจ็ดปาก หมุนเลือกปากด้วยนิ้วโป้ง สำนักจักรกลเวทให้นักเรียนปีห้าส่งเครื่องมือหนึ่งชิ้นเป็นวิทยานิพนธ์ ต้องใช้กับงานที่มีอยู่จริงในเมือง ประแจของ{name}ทุกปากต้องรับหัวหมุดได้ทั้งแบบของสถาบันและแบบของคนแคระโดยไม่ทิ้งรอย ช่างต่อแขนที่ต้องคลายข้อแขนคนในซอยมืดจะได้ไม่ต้องหอบประแจไปเจ็ดอัน

    หกปากแรกเสร็จก่อนกำหนด ปากที่เจ็ดเป็นขนาดของหมุดที่ไม่มีในตำรา ขนาดที่{name}จำมาจากม้วนลอกลาย ฝนเท่าไรก็ยังหลวมอยู่ครึ่งเส้นผม

    เสมียนคลังของอู่หลวงมาเดินดูห้องช่างของสำนักทุกปลายปี ปีนี้เขาหยุดที่โต๊ะของ{name} ถามราคาประแจทั้งอันพร้อมแบบ อู่มีช่างต่อแขนสามร้อยคน
  choices:
    - id: grind_the_jaws
      label: ฝนปากที่เจ็ดเองจนกว่าจะพอดี
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          คืนที่สิบ ปากที่เจ็ดขบหัวหมุดคนแคระแน่นจนยกหมุดขึ้นจากโต๊ะได้โดยไม่ต้องบีบ วันสอบ อาจารย์เอาหมุดเจ็ดขนาดมาเรียงบนแผ่นเหล็ก {name}คลายครบทั้งเจ็ด หัวหมุดไม่มีรอยสักตัว

          โกรดันลงชื่อรับเป็นคนแรก ใต้ชื่อเขาเขียนอักษรคนแคระสองตัว ไม่มีอาจารย์คนไหนในห้องอ่านออก และไม่มีใครถาม
        effects: { stats: { DEX: 1 }, items: [arm_fitter_spanner], flags: [thesis_machine] }
      failure:
        text: |
          ตะไบลื่นเข้าโคนนิ้วชี้ตอนตีสาม เลือดหยดลงในร่องฟันของปากที่เจ็ด ปากนั้นยังหลวมจนถึงวันสอบ หัวหมุดคนแคระหมุนอยู่ในปากประแจเหมือนเฟืองที่หลุดฟัน

          งานผ่าน หมายเหตุในสมุดผลสอบเขียนว่า หกปากใช้ได้ ปากที่เจ็ดไม่ควรมี สำนักเก็บประแจไว้ในตู้แบบ ข้างกล่องหนังที่มีตราเรือ
        effects: { hp: -1, flags: [thesis_machine] }
    - id: ask_grodan
      label: เอาประแจไปวางบนลังไม้ข้างจานข้าวของโกรดัน
      text: |
        โกรดันหมุนประแจไปที่ปากที่เจ็ด แล้วเอาตะไบด้ามสึกของตัวเองถูปากนั้นสามครั้ง ไม่ทาบไม้บรรทัด ไม่ลองหมุด แล้ววางคืน หัวหมุดคนแคระเข้าไปพอดีจนไม่โยก

        เขาบอกว่าหมุดขนาดนี้ไม่มีในตำรา เพราะในสำนักไม่มีใครเคยยืนอยู่หน้าหินต้นแบบ นอกจากเขา วันสอบประแจผ่านทั้งเจ็ดปาก ทะเบียนเขียนชื่อ{name}ไว้ใต้ภาพลอกของประแจ ชื่อโกรดันไม่อยู่ตรงไหนในแผ่นนั้น
      effects: { items: [arm_fitter_spanner], flags: [thesis_machine, grodan_ground_the_seventh_jaw] }
    - id: sell_to_the_yard
      label: ขายประแจกับแบบให้อู่หลวง
      text: |
        เสมียนคลังนับเหรียญห้าเหรียญลงบนโต๊ะช่าง แล้วม้วนแบบใส่กระบอกหนังที่ตอกตราเรือ ทะเบียนของสถาบันเขียนชื่อ{name}ไว้ใต้ภาพลอกของประแจตามธรรมเนียม ตัวเล็กกว่าชื่อสำนัก

        ปีต่อมาช่างต่อแขนของอู่ทุกคนมีประแจเจ็ดปากห้อยเอว ปากที่เจ็ดหลวมครึ่งเส้นผมทุกอัน
      effects: { gold: 5, reputation: { crown: 1 }, flags: [thesis_machine, sold_the_spanner_to_the_yard] }

- id: adult.school_machine_comes_due
  stage: adult
  scene: home
  weight: 25
  when:
    age: [26, 45]
    flags: [saw_the_machine_secret]
    not_flags: [institute_student]
  text: |
    แขนกลข้างหนึ่งวางอยู่บนโต๊ะของ{name} ห่อผ้าใบไว้ครึ่งท่อน ตราเรือของอู่หลวงตอกอยู่ที่ต้นแขน คนเอามาวางคือหญิงคนแคระชื่อกาดรุน ตระกูลทั่งดำ ทหารเรือคนหนึ่งเอาแขนนี้ไปจำนำที่ร้านของหลานชายเธอแล้วไม่กลับมาไถ่

    ข้อศอกของแขนนั้นเป็นลิ่มสามตัวขบกัน ไม่มีหมุด ลิ่มทุกตัวบากเฉียงแบบที่ตระกูลทั่งดำบาก กาดรุนเป็นคนเฝ้าห้องหินของตระกูล ลายนี้อยู่บนหินแผ่นที่สามนับจากประตู คนนอกตระกูลไม่เคยมีใครได้เข้าห้องนั้น

    ช่างที่อู่บอกเธอว่าแขนรุ่นนี้แบบมาจากสถาบัน แล้วชื่อของ{name}ก็มาถึงเธอทีละปาก เธอวางแขนลงบนโต๊ะ ถามเรื่องเดียว ใครถูหินของบ้านเธอ
  choices:
    - id: say_nothing_seen
      label: บอกเธอว่าไม่เคยเห็นแบบนี้มาก่อน
      requires: { flag: kept_the_machine_secret }
      text: |
        กาดรุนห่อแขนกลับเข้าผ้าใบ ผูกเชือกเงื่อนเดิม ไม่เถียง ไม่ถามซ้ำ ก่อนออกประตูเธอหยุดดูมือของ{name} ดูรอยด้านที่ปลายนิ้วโป้งกับนิ้วชี้ รอยของคนที่เคยจับตะไบทุกเช้า

        เธอลงบันไดไปช้าๆ แขนกลในห่อกระทบราวบันไดทุกขั้น เหล็กกระทบเหล็ก จนเสียงหายไปที่ปากซอย
      effects: { alignment: { moral: -1 }, flags: [lied_to_the_stone_keeper] }
    - id: name_the_hammer_clan
      label: บอกเธอว่าตระกูลค้อนเก้ารู้เรื่องนี้มาหลายปีแล้ว
      requires: { flag: told_the_machine_secret }
      text: |
        {name}เล่าเรื่องตราค้อนไขว้บนม้วนลอกลาย กับร้านตีเหล็กที่ประตูตะวันออก กาดรุนฟังจนจบ แล้วหัวเราะสั้นๆ ไม่มีเสียง ค้อนเก้ารู้ แต่ไม่ได้บอกบ้านไหน บ้านไหนรู้ก็ไม่บอกบ้านไหน เธอขอให้{name}เขียนสิ่งที่เห็นลงแผ่นหนัง แล้วลงชื่อไว้ข้างใต้ แผ่นนั้นเธอพับเก็บในเสื้อ เอากลับไปทุนดาร์

        ปีต่อมา{name}ได้ห่อของจากทุนดาร์ ไม่มีจดหมาย ข้างในเป็นกระดาษลอกลายจากหินแผ่นที่สาม ครบทั้งแผ่น มุมล่างขวามีตราตระกูลทั่งดำ ถูไว้ชัดกว่าลายแขน
      effects: { reputation: { dwarf_council: 1, crown: -1 }, flags: [witnessed_for_the_stone_keeper] }
    - id: show_the_copy_marks
      label: ชี้ให้เธอดูรอยที่ติดมากับการลอก
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ชี้ที่ขอบลิ่มตัวที่สาม รอยหยักเล็กเท่าปลายเข็มที่มีเหมือนกันทุกแขนของอู่ รอยนั้นไม่ใช่แบบ เป็นรอยแตกบนหินที่ติดมากับถ่านตอนถู ช่างที่ลอกต่อกันมาลอกรอยแตกไปด้วยเพราะไม่รู้ว่าคืออะไร กาดรุนเอานิ้วลูบรอยนั้น บอกว่าหินแผ่นที่สามแตกตรงนี้มาตั้งแต่สมัยย่าของย่าเธอ

          เธอขอถ่านกับกระดาษ ถูรอยแตกบนแขนกลออกมาหนึ่งแผ่น พับเก็บไว้ในเสื้อข้างเดียวกับหัวใจ
        effects: { stats: { INT: 1 }, flags: [showed_the_stone_keeper_the_crack] }
      failure:
        text: |
          {name}ยกแขนกลขึ้นส่องตะเกียงเพื่อหารอยที่จำได้ ข้อลิ่มคลายตัวกลางอากาศแล้วขบกลับลงบนนิ้วสองนิ้วของ{name} ต้องใช้มีดงัดออก รอยที่{name}ชี้ให้เธอดูหลังจากนั้นเป็นรอยตะไบของช่างอู่ กาดรุนรู้ตั้งแต่แตะครั้งแรก

          เธอห่อแขนกลับ ทิ้งผ้าพันแผลม้วนหนึ่งไว้บนโต๊ะก่อนออกไป
        effects: { hp: -1, flags: [could_not_show_the_stone_keeper] }
    - id: give_back_the_wedges
      label: ถอดลิ่มสามตัวออกจากข้อศอก ให้เธอเอากลับบ้าน
      text: |
        {name}ถอดลิ่มออกทีละตัวโดยไม่ให้ขอบบิ่น แขนกลข้อศอกพับลงห้อยเหมือนกิ่งไม้หัก ทหารเรือคนไหนจะมาไถ่ก็ได้ของที่ใช้ไม่ได้กลับไป

        กาดรุนห่อลิ่มสามตัวด้วยผ้าเช็ดหน้าของเธอ ทีละตัว ส่วนแขนที่เหลือเธอทิ้งไว้ให้{name} บอกว่าเหล็กของอู่ไม่ใช่ของบ้านเธอ
      effects: { alignment: { moral: 1 }, flags: [gave_the_stone_keeper_the_wedges] }

- id: adult.school_machine_craft
  stage: adult
  scene: tavern
  weight: 25
  when:
    age: [23, 50]
    flags: [school_machine, institute_graduate]
  text: |
    ในโรงเตี๊ยมตอนหัวค่ำ ชายแก่คนหนึ่งจับข้อมือหลานชายไว้ด้วยมือทองเหลือง แล้วปล่อยไม่ได้ แขนของเขาเป็นงานของร้านช่างข้างทาง ข้อนิ้วล็อกค้างในท่ากำ เด็กหนุ่มไม่ร้อง แต่หน้าซีดลงทุกครั้งที่นิ้วทองเหลืองบีบเข้าอีกครึ่งข้อ

    คนในโรงเตี๊ยมยืนล้อมเป็นวง คนหนึ่งว่าเอาค้อนทุบ อีกคนว่าตัดสายหนังที่ไหล่ ชายแก่เหงื่อออกเต็มหน้า บอกทุกคนว่าแขนนี้เขาผ่อนมาสองปี ยังเหลืออีกปีครึ่ง

    จากโต๊ะที่นั่ง{name}เห็นหัวหมุดตรงโคนนิ้วโป้ง ร้านที่ทำแขนนี้ใช้แบบที่ลอกต่อมาจากแบบของสถาบันอีกทอดหนึ่ง ลิ้นล็อกนิ้วอยู่ใต้หมุดตัวนั้น
  choices:
    - id: press_the_tongue
      label: สอดปลายมีดเข้าใต้หมุด กดลิ้นล็อก
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          นิ้วทองเหลืองคลายออกพร้อมกันทั้งสี่นิ้ว เสียงดังแกร๊กเดียว เด็กหนุ่มสะบัดมือ ข้อมือมีรอยนิ้วสีม่วงเรียงกันสี่รอย คนในวงแยกย้ายกลับไปที่โต๊ะ บางคนยกแก้วให้

          ชายแก่ถามว่าลิ้นตัวนั้นจะล็อกอีกไหม {name}บอกตามจริงว่าล็อก ทุกครั้งที่อากาศเย็นลง ให้กำมือช้าๆ ในหน้าหนาว
        effects: { stats: { DEX: 1 }, alignment: { moral: 1 }, flags: [freed_a_locked_brass_hand] }
      failure:
        text: |
          ปลายมีดลื่นออกจากหัวหมุดแล้วกรีดเข้าอุ้งมือ{name} ลิ้นล็อกขยับไปครึ่งเดียว พอให้เด็กหนุ่มกระชากมือออกมาได้ ทิ้งหนังที่หลังข้อมือไว้ในกำมือทองเหลือง

          เจ้าของโรงเตี๊ยมเอาเหล้ามาราดแผลให้ทั้งสองคน คิดเงินค่าเหล้าเฉพาะที่ดื่ม
        effects: { hp: -1, alignment: { moral: 1 }, flags: [freed_a_locked_brass_hand] }
    - id: cut_the_tendons
      label: ตัดเอ็นทองเหลืองที่ข้อมือ แล้วจ่ายค่าต่อใหม่ให้เขา
      requires: { min_gold: 2 }
      text: |
        {name}ยืมคีมจากคนในวง ตัดลวดเอ็นสามเส้นที่ข้อมือ มือทองเหลืองอ้าออกแล้วห้อยลงเหมือนถุงมือเปียก เด็กหนุ่มนั่งลงกับพื้นทั้งอย่างนั้น

        {name}วางเหรียญสองเหรียญไว้ในมือข้างที่ยังเป็นเนื้อของชายแก่ ร้านช่างข้างทางคิดค่าต่อเอ็นใหม่สามเหรียญ อีกเหรียญเขาหาเอง
      effects: { gold: -2, alignment: { moral: 1 }, flags: [cut_an_old_mans_tendons] }
    - id: talk_him_down
      label: บอกชายแก่ให้วางไหล่ลง แล้วหายใจออกยาวๆ
      text: |
        แขนแบบนี้กำตามกล้ามที่ต้นแขน ยิ่งกลัวยิ่งกำ {name}บอกให้ชายแก่นั่งลง วางข้อศอกบนโต๊ะ แล้วหายใจออกช้าๆ นับไปพร้อมกัน ครั้งที่สามนิ้วทองเหลืองคลายออกครึ่งข้อ พอให้หลานชายดึงมือออก

        ชายแก่ไม่กล้าขยับแขนอีกจนเหล้าหมดแก้ว หลานชายนั่งลงข้างเขา ฝั่งที่เป็นแขนเนื้อ
      effects: { flags: [talked_an_old_man_loose] }
    - id: spanner_turn
      label: หมุนประแจเจ็ดปากไปที่ปากที่สี่ แล้วคลายหมุดโคนนิ้วโป้ง
      requires: { item: arm_fitter_spanner }
      text: |
        หมุดคลายออกโดยไม่มีรอย ลิ้นล็อกเลื่อนกลับที่ นิ้วทองเหลืองคลายออกทีละข้อเหมือนมือคนตื่นนอน {name}ปรับลิ้นตัวนั้นให้ต่ำลงครึ่งเส้นผม ต่อไปลิ้นตัวนี้จะไม่ล็อกอีก แล้วขันหมุดกลับ

        คนแคระคนหนึ่งที่โต๊ะหลังสุดลุกเดินมาดูประแจในมือ{name} ดูปากที่เจ็ดใกล้ๆ แล้ววางเหรียญค่าเหล้าไว้บนโต๊ะ เดินออกไปโดยทิ้งเหล้าไว้ครึ่งแก้ว
      effects: { alignment: { moral: 1 }, flags: [fixed_an_old_mans_arm] }

# ---------- สำนักตำรา ----------

- id: adult.institute_texts_advisor
  stage: adult
  scene: library
  weight: 20
  course: { id: institute, year: 3, track: texts }
  text: |
    คาสเซน ดูเวล ไม่สอน นักเรียนปีสามของเขาได้งานคัดลอกวันละสิบสองหน้า ด้วยดินสอ ไม่มีคำอธิบาย หน้าไหนผิดหนึ่งตัวอักษร หน้านั้นคัดใหม่ทั้งหน้า สามเดือนแรก{name}คัดแต่ตารางหมึก หมึกของรัชสมัยไหนซีดเป็นสีอะไรเมื่อเวลาผ่านไปกี่ปี

    เดือนที่สี่ เขาวางม้วนหนังม้วนหนึ่งบนโต๊ะของ{name} ม้วนนั้นมาจากชั้นหลังลูกกรงเหล็กท้ายห้องอ่าน กุญแจชั้นนั้นไม่ใช่ของสถาบัน เสมียนของราชสำนักถือไว้ มาเปิดทุกเช้าวันเบเลค ยืนรอจนม้วนกลับเข้าชั้นแล้วล็อกเอง ค่ากุญแจราชสำนักจ่ายเป็นรายเดือน

    ม้วนนั้นคือรายชื่อสายเลือดที่ราชวงศ์อ้างว่าสืบมาจากผู้กล้า ชื่อต่อชื่อ ลูกต่อพ่อ กลางม้วนมีรอยต่อ หนังสองผืนเย็บติดกันด้วยด้ายสีเดียวกับหมึก หมึกเหนือรอยต่อซีดเป็นสีสนิม หมึกใต้รอยต่อยังดำ ตามตารางที่{name}คัดมาสามเดือน สองชื่อที่ติดกันตรงนั้นเขียนห่างกันสี่สิบปี คาสเซนยืนอยู่หลังเก้าอี้ บอกให้คัดทั้งม้วน รอยต่อด้วย
  choices:
    - id: copy_over_the_seam
      label: คัดทั้งม้วนตามสั่ง รอยต่อด้วย
      check: { stat: WIS, dc: 12 }
      effects: { flags: [saw_the_texts_secret, kept_the_texts_secret] }
      success:
        text: |
          {name}คัดรอยต่อเป็นเส้นตรงเส้นเดียว ไม่เขียนอะไรข้างเส้น ไม่เว้นที่ คาสเซนอ่านหน้านั้นจบแล้วไม่สั่งคัดใหม่ เสมียนราชสำนักเก็บม้วนเข้าชั้น ล็อก แล้วจดชื่อ{name}ลงสมุดคนเปิด

          เช้าวันต่อมาบนโต๊ะของ{name}มีสมุดเล่มบางวางอยู่ ตารางอักษรคนแคระรุ่นก่อน ลายมือดินสอ ไม่มีชื่อคนเขียน ไม่มีคำอธิบายสักบรรทัด
        effects: { stats: { WIS: 1 }, flags: [given_the_old_dwarf_tables] }
      failure:
        text: |
          ดินสอหักตรงรอยต่อทุกครั้ง มือที่คัดมาสามเดือนสั่นเองเมื่อถึงเส้นนั้น {name}คัดหน้านั้นใหม่สิบเอ็ดรอบ จนนิ้วกลางแตกตรงที่ดินสอกดทับ เลือดซึมลงกระดาษรอบที่สิบเอ็ด

          คาสเซนรับหน้าที่สิบสองไปโดยไม่พลิกดู เอาหน้าที่มีเลือดไปเผาในเตาผิงห้องอ่าน กฎข้อแรกของห้องคือห้ามไฟ เขาเป็นคนเดียวที่จุดได้
        effects: { hp: -1 }
    - id: tell_the_news_walker
      label: เล่าเรื่องรอยต่อให้คนเดินข่าวที่โรงเตี๊ยมหน้าสถาบันฟัง
      text: |
        คนเดินข่าวฟังแล้วขอเหล้าเพิ่มหนึ่งแก้ว ไม่จดอะไร บอกว่าเรื่องแบบนี้ต้องจำด้วยปาก สองเดือนต่อมามีเพลงใหม่ในโรงเตี๊ยมย่านท่าเรือเหาะ เพลงกษัตริย์ที่หลับไปสี่สิบปี ตื่นมาเป็นลูกของตัวเอง ไม่มีชื่อใครในเพลง คนร้องตามได้ตั้งแต่รอบที่สอง

        เสมียนของราชสำนักเลิกมาเปิดกุญแจเช้าวันเบเลค มาวันไหนก็ได้ ไม่บอกล่วงหน้า และจดชื่อทุกคนที่นั่งอยู่ในห้องอ่านตอนเขามา
      effects:
        reputation: { crown: -1 }
        alignment: { law: -1 }
        flags: [saw_the_texts_secret, told_the_texts_secret, the_sleeping_king_song]
    - id: put_down_the_pen
      label: วางดินสอลงบนรอยต่อ แล้วลุกจากเก้าอี้
      text: |
        คาสเซนเก็บม้วนเข้าชั้นเอง รอจนเสมียนล็อก แล้วกลับไปนั่งไล่นิ้วตามอักษรคนแคระที่โต๊ะเดิม {name}ไม่กลับเข้าห้องอ่านอีก

        นายทะเบียนฮัลบริคถามเหตุผลที่ออก {name}บอกว่าตาไม่ดี ช่องเหตุผลจึงเขียนตามนั้น ตัวเล็ก หมึกดำ อีกสี่สิบปีคงซีดเป็นสีสนิม
      effects:
        alignment: { law: -1 }
        course: { leave: true }
        mark: ออกจากสถาบัน
        flags: [saw_the_texts_secret, kept_the_texts_secret, institute_left, left_institute_over_texts]

- id: adult.institute_texts_field
  stage: adult
  scene: library
  weight: 20
  course: { id: institute, year: 4, track: texts }
  text: |
    เดอร์วัล เสมียนคุมห้องเก็บเอกสารของราชสำนักใต้ศาลบนย่านวิหาร นั่งโต๊ะเดิมมาสามสิบปี ใส่ปลอกแขนผ้าดำกันหมึก นักเรียนสำนักตำราที่มาฝึกงานกับเขาได้ที่นั่งคนละครึ่งโต๊ะ ในห้องยาวไม่มีหน้าต่าง กลิ่นกาวหนังปนขี้หนู งานคือคัดโฉนดเก่าที่หมึกซีดจนแทบอ่านไม่ออกลงกระดาษใหม่ ก่อนแผ่นเดิมจะผุไปกับมือ

    สัปดาห์ที่สอง เขาวางโฉนดแผ่นหนึ่งให้{name} ที่ดินริมแม่น้ำแปลงหนึ่ง ด้านเหนือจดต้นโอ๊ก บรรทัดที่บอกจำนวนต้นซีดจนเหลือแค่หางของตัวเลข อาจเป็นสอง อาจเป็นสาม

    โอ๊กสามต้นแปลว่าที่ดินกว้างกว่าโอ๊กสองต้นเท่าลานบ้านหนึ่งลาน เจ้าของที่ดินสองแปลงที่ติดกันมีทนายนั่งรอฟังผลอยู่ที่ม้านั่งหน้าห้องคนละฝั่ง เดอร์วัลบอกว่าให้คัดตามที่เห็น แล้วไปทำแผ่นอื่นต่อ
  choices:
    - id: draw_the_circle
      label: คัดตามที่เห็น เว้นวงกลมไว้ตรงตัวเลข
      text: |
        {name}วาดวงกลมเปล่าลงในที่ของตัวเลข ใต้วงเขียนตัวเล็กว่าอ่านไม่ออก เดอร์วัลอ่านแล้วประทับตราห้องเก็บเอกสารลงข้างวงกลม ทนายทั้งสองฝ่ายออกจากห้องไปมือเปล่า

        คดีนั้นค้างอยู่ที่ศาลอีกสามปี ก่อนศาลจะส่งคนลงไปดูที่ดิน ต้นโอ๊กริมแม่น้ำมีคนแอบตัดไปหนึ่งต้น เหลือตอสูงเท่าเข่า
      effects: { stats: { WIS: 1 }, flags: [left_the_oaks_blank] }
    - id: write_three
      label: คัดเป็นสาม ตามที่ทนายคนหนึ่งกระซิบตอนพักเที่ยง
      text: |
        ทนายคนนั้นทิ้งเหรียญไว้ในกล่องดินสอของ{name}ก่อนกลับ เดอร์วัลประทับตราสำเนาโดยไม่ถาม เขาประทับวันละหกสิบแผ่น

        ฤดูต่อมามีคนมาลงเสาไม้ปักเขตใหม่ริมแม่น้ำ ห่างจากเสาเดิมไปเท่าลานบ้านหนึ่งลาน ข้างเสามีโอ๊กสามต้น ต้นที่สามยังเล็กกว่าข้อมือ
      effects: { gold: 1, alignment: { moral: -1 }, flags: [wrote_three_oaks] }
    - id: dig_for_another_copy
      label: ขอค้นห้องหาสำเนาที่สองของโฉนดแผ่นนี้
      habit: curious
      check: { stat: INT, dc: 12 }
      success:
        text: |
          สำเนาที่สองอยู่ในกล่องภาษีที่ดินของปีเดียวกัน ข้างใต้รายการค่าธรรมเนียมขนข้าว คนเก็บภาษีปีนั้นคัดเขตที่ดินไว้เพื่อคิดอากร หมึกยังดำ เขียนว่าโอ๊กสองต้น ชัดทุกเส้น

          เดอร์วัลจดเลขกล่องที่{name}เจอลงสมุดของห้อง ในช่องผู้ค้นเขาเขียนชื่อ{name}ลงไปเต็มๆ บรรทัดข้างบนทั้งหน้าเขียนแค่คำว่า นักเรียน
        effects: { stats: { INT: 1 }, flags: [found_the_two_oaks] }
      failure:
        text: |
          ชั้นกล่องภาษีชั้นที่สามโยกตอน{name}ปีนขึ้นไป กล่องสี่ใบหล่นลงมาพร้อมฝุ่นสามสิบปี มุมกล่องใบหนึ่งเปิดคิ้ว{name}แตก ไม่มีสำเนาที่สองในกล่องไหนเลย

          {name}กลับมานั่งคัดตามที่เห็น เลือดหยดลงบนโฉนดหนึ่งหยด ตรงที่ตัวเลขควรอยู่
        effects: { hp: -1, flags: [searched_the_record_room] }

- id: adult.institute_texts_thesis
  stage: adult
  scene: library
  weight: 20
  course: { id: institute, year: 5, track: texts }
  text: |
    วิทยานิพนธ์ของสำนักตำราโดยมากเป็นคำแปลหนาสองร้อยหน้า ไม่มีใครอ่านจบนอกจากอาจารย์สามคน {name}ขอทำของหนึ่งชิ้นแทน แว่นสองชั้นสำหรับอ่านหนังสัตว์ที่มีคนขูดหมึกเก่าออกแล้วเขียนทับ ชั้นในฝนจากแก้วรมควัน ให้เห็นหมึกแรกชัดกว่าหมึกที่เขียนลงมาทีหลัง

    คาสเซนไม่ได้บอกว่าได้หรือไม่ได้ เขาวางหนังสัตว์แผ่นหนึ่งไว้บนโต๊ะของ{name} หมึกบนแผ่นเป็นรายการค่าธรรมเนียมท่าเรือ ใต้รายการมีรอยขูดที่ไม่มีใครในห้องอ่านอ่านออก แผ่นนั้นคือข้อสอบ

    สามสัปดาห์ก่อนวันส่ง เสมียนราชสำนักคนที่ถือกุญแจชั้นหลังลูกกรงเดินมาหยุดที่โต๊ะ ถามว่าแว่นคู่แรกจะเสร็จเมื่อไร ราชสำนักอยากได้คู่แรกพร้อมแบบฝนเลนส์ และจ่ายตามราคาที่สถาบันตั้ง
  choices:
    - id: grind_true
      label: ฝนเลนส์ชั้นในใหม่ทั้งคู่ ทีละเส้นผม
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ใต้รายการค่าธรรมเนียมท่าเรือ หมึกแรกขึ้นมาเป็นอักษรคนแคระรุ่นก่อน สมุดบัญชีของร้านขนมปังร้านหนึ่ง แป้งสามถุง น้ำผึ้งหนึ่งไห คนซื้อคนหนึ่งติดค่าขนมปังไว้เจ็ดก้อน {name}อ่านออกครึ่งแผ่น อีกครึ่งคาสเซนอ่านให้ฟัง เสียงต่ำ อ่านช้าเท่าคนอ่านให้เด็กฟัง

          เขาแก้คำแปลของ{name}คำเดียว คำที่{name}แปลว่าน้ำผึ้ง คือเกลือ แล้วลงชื่อรับเป็นคนแรก
        effects: { stats: { INT: 1 }, items: [dead_script_glasses], flags: [thesis_texts] }
      failure:
        text: |
          หมึกแรกขึ้นมาเป็นเงาจางๆ ใต้รายการค่าธรรมเนียม เห็นว่ามีตัวอักษร แต่อ่านไม่ออกสักตัว ตาของ{name}มองเห็นทุกอย่างซ้อนกันสองชั้นไปสามวัน รวมทั้งหน้าอาจารย์ทั้งสาม

          งานผ่าน ใต้ชื่อในสมุดผลสอบคาสเซนเขียนไว้ห้าคำ เห็นเงา ไม่เห็นตัว แว่นคู่นั้นสำนักเก็บไว้ในลิ้นชักโต๊ะห้องอ่าน ข้างดินสอที่หักแล้ว
        effects: { hp: -1, flags: [thesis_texts] }
    - id: bring_what_works
      label: ส่งแว่นคู่ที่มีอยู่ ใช้ได้กับรอยขูดที่ไม่ลึก
      text: |
        แว่นคู่นั้นอ่านรอยขูดตื้นได้ บนแผ่นข้อสอบ{name}อ่านสองบรรทัดแรกออก แป้งสามถุง น้ำผึ้งหนึ่งไห บรรทัดที่เหลือขูดลึกจนแว่นเห็นแค่ร่อง คาสเซนอ่านบรรทัดที่เหลือเองในใจ ริมฝีปากขยับ ไม่มีเสียง

        เขาลงชื่อรับ ใต้ชื่อเขียนว่า พอใช้ ด้วยลายมือที่เล็กที่สุดในหน้านั้น
      effects: { items: [dead_script_glasses], flags: [thesis_texts] }
    - id: sell_to_the_crown
      label: ยกแว่นคู่แรกกับแบบฝนเลนส์ให้ราชสำนัก
      text: |
        เสมียนจ่ายสี่เหรียญ นับใส่มือ{name}ทีละเหรียญ แบบฝนเลนส์เข้าแฟ้มของห้องตำรา หน้าปกแฟ้มมีชื่อคนฝนเขียนด้วยลายมือของ{name}เองตามธรรมเนียม อาจารย์สามคนสอบจากแบบ ไม่ได้เห็นแว่น

        แว่นคู่แรกออกจากห้องอ่านในกล่องไม้ที่ล็อกด้วยกุญแจดอกเดียวกับชั้นหลังลูกกรง
      effects: { gold: 4, reputation: { crown: 1 }, flags: [thesis_texts, sold_the_glasses_to_the_crown] }

- id: adult.school_texts_comes_due
  stage: adult
  scene: home
  weight: 25
  when:
    age: [26, 45]
    flags: [saw_the_texts_secret]
    not_flags: [institute_student]
  text: |
    กระดาษแผ่นนั้นมีชื่อลงไว้แล้วสิบเก้าชื่อ บางชื่อ{name}จำได้ว่าเคยนั่งคัดโต๊ะติดกัน เสมียนของราชสำนักกางกระดาษบนโต๊ะของ{name}ตอนสาย เขาเดินตามหาคนที่เคยเรียนสำนักตำราทีละบ้าน ข้อความเหนือรายชื่อเป็นคำรับรองสั้นๆ ว่าผู้ลงชื่อเคยเห็นม้วนสายเลือดของราชวงศ์ในห้องอ่านของสถาบัน และม้วนนั้นไม่มีรอยต่อ

    เขาวางเหรียญสามเหรียญข้างกระดาษ บอกว่าเป็นค่าเสียเวลา ม้วนในห้องอ่านตอนนี้ไม่มีรอยต่อแล้ว ซ่อมเรียบร้อย ราชสำนักแค่อยากได้ชื่อของคนที่เคยเห็นฉบับก่อนซ่อมให้ครบทุกคน
  choices:
    - id: sign_for_the_roll
      label: ลงชื่อ แล้วรับเหรียญ
      requires: { flag: kept_the_texts_secret }
      text: |
        ชื่อของ{name}เป็นชื่อที่ยี่สิบ เสมียนเป่าหมึกให้แห้ง พับกระดาษใส่กระบอกหนัง ก่อนกลับเขาบอกว่าวันหลังถ้ามีใครมาถามเรื่องรอยต่อ ให้ถามกลับไปว่ารอยต่ออะไร

        เหรียญสามเหรียญเป็นเหรียญใหม่ ขอบยังคม ยังไม่มีมือใครลูบจนมน
      effects: { gold: 3, reputation: { crown: 1 }, flags: [signed_for_the_seamless_roll] }
    - id: hum_the_song
      label: บอกเขาว่าเรื่องนี้เป็นเพลงไปนานแล้ว
      requires: { flag: told_the_texts_secret }
      text: |
        {name}ฮัมเพลงกษัตริย์ที่หลับไปสี่สิบปีให้เขาฟังสองท่อน ท่อนที่กษัตริย์ตื่นมาแล้วจำหน้าลูกตัวเองในกระจกได้ เสมียนฟังจนจบ แล้วเก็บเหรียญคืนทีละเหรียญ

        เขาหยิบกระดาษอีกแผ่นออกจากกระบอก ไม่ใช่แผ่นคำรับรอง เป็นรายชื่อที่สั้นกว่า แล้วขีดเส้นสั้นๆ หลังชื่อของ{name}
      effects: { reputation: { crown: -1 }, flags: [hummed_the_sleeping_king_to_the_clerk] }
    - id: push_the_coins_back
      label: ดันเหรียญคืน ไม่ลงชื่อ
      text: |
        เสมียนไม่เถียง พับกระดาษ เก็บเหรียญ ขอบใจที่ให้เวลา ท่าทางของคนที่ได้ยินคำนี้มาแล้วหลายบ้าน

        หน้าบ้านมีเสมียนอีกคนยืนรออยู่กับม้าสองตัว ถือรายชื่ออีกแผ่น ยาวกว่าแผ่นแรก
      effects: { alignment: { law: -1 }, flags: [would_not_sign_for_the_roll] }
    - id: ask_to_see
      label: ขอดูภาพลอกของฉบับที่ซ่อมแล้วก่อนจะลงชื่อ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          เสมียนมีภาพลอกหน้านั้นติดมาให้คนที่ไม่เชื่อดู {name}ไล่นิ้วไปตรงที่เคยเป็นรอยต่อ ตอนนี้ตรงนั้นมีชื่อกษัตริย์สองพระองค์ที่ไม่เคยอยู่ในม้วน หางอักษรตัวหนึ่งในชื่อที่สองเขียนแบบที่ห้องอ่านเพิ่งเลิกใช้ ไม่ใช่แบบของสมัยที่ชื่อนั้นอ้าง

          {name}ไม่ได้บอกเขาว่าเห็นอะไร และไม่ลงชื่อ เสมียนเก็บภาพลอกเข้ากระบอกหนังเร็วกว่าตอนเอาออก
        effects: { stats: { INT: 1 }, flags: [saw_the_two_new_kings, would_not_sign_for_the_roll] }
      failure:
        text: |
          ภาพลอกเรียบทุกเส้น หมึกไล่สีจากสนิมเป็นดำทีละน้อยแบบที่หมึกจริงไล่ {name}หาไม่เจอว่าเย็บตรงไหน ไล่นิ้วจนเทียนบนโต๊ะสั้นลงหนึ่งข้อ

          เสมียนเก็บภาพลอก เก็บเหรียญ จดอะไรบางอย่างลงหลังกระดาษคำรับรอง ตัวเล็กเกินกว่าจะอ่านจากอีกฝั่งโต๊ะ
        effects: { reputation: { crown: -1 }, flags: [would_not_sign_for_the_roll] }

- id: adult.school_texts_craft
  stage: adult
  scene: market
  weight: 25
  when:
    age: [23, 50]
    flags: [school_texts, institute_graduate]
  text: |
    หญิงม่ายคนหนึ่งยืนเถียงกับคนทวงหนี้หน้าแผงผัก คนทวงถือไม้เท้าหัวเหล็ก ชี้ไปที่สัญญาแผ่นเก่าในมือเธอ สัญญาเขียนด้วยอักษรอาร์เวลแบบเก่า แบบที่เลิกใช้ก่อนคนในตลาดนี้เกิด สามีของเธอลงชื่อไว้ เธออ่านไม่ออก คนทวงบอกว่าเขาอ่านออก สัญญาบอกว่าเธอติดเขาอีกหกเหรียญ

    ท้ายสัญญามีเครื่องหมายหนึ่ง เส้นตั้งตัดด้วยเส้นเฉียงสองเส้น ในอักษรแบบนั้นเครื่องหมายนี้แปลได้สองทาง จ่ายแล้ว หรือยกไปรอบหน้า ต่างกันที่ขีดเล็กๆ ปลายเส้นเฉียงเส้นล่าง ขีดเดียว

    คนทวงเห็น{name}เดินเข้ามาใกล้ ยกไม้เท้าขึ้นครึ่งหนึ่ง แล้ววางลงเมื่อเห็นว่าไม่ใช่ญาติ
  choices:
    - id: read_it_aloud
      label: ขอสัญญามาอ่านออกเสียงให้ทั้งตลาดได้ยิน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}อ่านตั้งแต่บรรทัดแรก ช้าพอให้คนแผงข้างๆ ได้ยินทุกคำ ชื่อผู้ให้กู้ ชื่อผู้กู้ ยอด หกเหรียญ ถึงเครื่องหมายท้ายสัญญา{name}ยกกระดาษขึ้นส่องแดด ชี้ขีดเล็กที่ปลายเส้นเฉียง แปลออกเสียงว่า จ่ายแล้ว

          คนทวงเดินออกจากตลาดโดยไม่เอาสัญญาคืน หญิงม่ายพับกระดาษเก็บในอกเสื้อ แล้วยัดผักกาดหัวหนึ่งใส่มือ{name}
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [read_the_widows_note] }
      failure:
        text: |
          {name}อ่านคล่องจนถึงเครื่องหมาย แล้วติดอยู่ตรงนั้น ขีดเล็กที่ปลายเส้นเฉียงอาจเป็นขีด อาจเป็นรอยหมึกกระเด็น {name}พูดออกไปว่าแปลได้สองทาง คนทวงหัวเราะ บอกทั้งตลาดว่าคนมีตำรายังอ่านไม่ออก

          สุดท้ายตกลงกันที่ครึ่งหนึ่ง สามเหรียญ หญิงม่ายมีสอง อีกเหรียญ{name}ควักให้
        effects: { gold: -1, flags: [stumbled_on_the_widows_note] }
    - id: copy_it_fair
      label: คัดสัญญาเป็นอักษรปัจจุบันให้เธอเอาไปให้เสมียนเมืองดู
      text: |
        {name}คัดบนกระดาษห่อผักที่แม่ค้าแผงข้างๆ ยื่นให้ ทีละบรรทัด ตรงเครื่องหมายท้ายสัญญาวาดวงกลมเปล่าไว้หนึ่งวง ใต้วงเขียนว่า แปลได้สองทาง ต้องดูฉบับของผู้ให้กู้ประกอบ

        คนทวงเห็นคำว่าเสมียนเมืองแล้วบอกว่าจะกลับมาใหม่ เขาไม่ได้กลับมาที่แผงนั้นอีกเลยทั้งฤดู
      effects: { alignment: { law: 1 }, flags: [copied_the_widows_note] }
    - id: claim_not_to_read
      label: บอกว่าอ่านอักษรแบบนี้ไม่ออก แล้วเดินผ่านไป
      text: |
        คนทวงยิ้มให้{name}ทางหางตา แบบที่คนยิ้มให้คนที่เข้าใจกัน {name}เดินไปถึงปลายแถวแผงผักแล้วยังได้ยินเสียงไม้เท้าหัวเหล็กเคาะไม้แผงสองครั้ง

        ขากลับ แผงผักนั้นปิด ผ้าคลุมผูกเชือกไว้แน่น
      effects: { alignment: { moral: -1 }, flags: [walked_past_the_widows_note] }
    - id: read_under_the_ink
      label: สวมแว่นสองชั้น อ่านสิ่งที่อยู่ใต้หมึก
      requires: { item: dead_script_glasses }
      text: |
        ใต้เครื่องหมายมีรอยขูด ผ่านเลนส์ชั้นในหมึกแรกขึ้นมาชัดกว่าหมึกที่ทับ จ่ายครบ ลงวัน ลงชื่อคนรับเงิน ชื่อเดียวกับนามสกุลของคนทวง ใครสักคนขูดคำนั้นออกแล้วเขียนเครื่องหมายสองทางทับลงไป

        {name}อ่านให้ทั้งตลาดฟัง คนทวงเอื้อมมาจะคว้าสัญญา หญิงม่ายเก็บเข้าอกเสื้อก่อน ทั้งบ่ายนั้น{name}มองหน้าแม่ค้าแผงไหนก็เห็นเป็นสองหน้าซ้อนกัน
      effects: { alignment: { moral: 1, law: 1 }, flags: [read_under_the_widows_note] }
