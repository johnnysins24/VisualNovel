# ชุด ม แพ็ก B: สำนักดาราศาสตร์ สำนักรักษา สำนักสงคราม สำนักละห้าเรื่อง (โครงเดียวกับ 66_institute_schools_a.yaml)
# บทเรียนต้องจริงได้ทุกปีตั้งแต่ก่อนสงครามถ่านถึงหลังสงคราม เดเวคเป็นทหารเก่าของทางเหมือง ไม่บอกว่าสงครามไหน
# ผู้จ่ายที่ตารางในคัมภีร์ไม่ได้บอก ชุดนี้เลือกเอง: ดาราศาสตร์ = ราชสำนัก (ค่าช่างพิมพ์กับเงินเดือนคนนับ)
# รักษา = สมาคมโรงกลั่น (รถของหมอประจำสมาคมส่งคนไข้ทางประตูหลัง)

# ---------- สำนักดาราศาสตร์ ----------

- id: adult.institute_stars_advisor
  stage: adult
  scene: observatory
  weight: 20
  course: { id: institute, year: 3, track: stars }
  text: |
    วิเรีย ซอลเดน รับลูกศิษย์ปีสามด้วยการพาขึ้นไปนับบนทางเดินรอบโดมทั้งคืน ช่องฟ้าที่เธอเลือกไม่ใช่ช่องที่ปีสองหัดนับ เป็นช่องที่ยังไม่มีชื่อ เธอนับด้วยตาเปล่า {name}นับด้วยกระดานชนวนกับจุกไม้ก๊อกคาบไว้ในปาก ตอนสาง ตัวเลขของสองคนต่างกันสองดวง เธอบอกว่าดีแล้ว ปีที่แล้วลูกศิษย์ของเธอต่างไปสิบ

    ตัวเลขทั้งคืนลงสมุดปกดำที่วางไว้ใต้โดม ตอนเช้าเสมียนของสำนักคัดจากสมุดปกดำลงแผ่นที่จะส่งช่างพิมพ์ของราชสำนัก {name}เห็นแผ่นนั้นตอนช่วยพับซอง ตัวเลขบนแผ่นต่ำกว่าในสมุดปกดำทุกช่อง ไม่มากพอให้คนที่นับเองสงสัย ค่ากระดาษ ค่าช่างพิมพ์ และเงินเดือนคนนับทุกคนในสำนัก ราชสำนักเป็นคนจ่าย

    คืนเดือนมืด ประตูห้องใต้โดมปิด แสงเทียนลอดออกมาใต้บาน ข้างในมีคนนั่งกันหลายคน ไม่มีเสียงคุย วิเรียบอกว่าคืนแบบนี้ไม่ต้องขึ้นมานับ ห้องนั้นมีคนใช้แล้ว
  choices:
    - id: sign_the_black_book
      label: ลงชื่อใต้ตัวเลขในสมุดปกดำ แล้วพับซองต่อตามเดิม
      check: { stat: WIS, dc: 12 }
      effects: { flags: [saw_the_stars_secret, kept_the_stars_secret] }
      success:
        text: |
          คืนต่อมาวิเรียให้{name}นับช่องเดิมอีกรอบคนเดียว เธอยืนหันหลังให้ฟ้า ตัวเลขของ{name}ตรงกับของเธอทุกดวง เธอเขียนชื่อ{name}ลงสมุดปกดำ บรรทัดเดียวกับชื่อเธอ

          บนแผ่นที่ส่งช่างพิมพ์เดือนนั้น ช่องชื่อคนนับเขียนว่าสำนักดาราศาสตร์ เหมือนทุกเดือน
        effects: { stats: { WIS: 1 } }
      failure:
        text: |
          น้ำค้างบนราวโดมแข็งก่อนเที่ยงคืน นิ้วของ{name}ติดกระดานชนวนจนต้องเอาลมหายใจเป่าให้หลุด ตัวเลขตอนสางห่างจากของวิเรียเจ็ดดวง

          เธอไม่ลบ เขียนตัวเลขของ{name}ไว้ในสมุดปกดำ บรรทัดล่างสุด ตัวเล็ก ข้างตัวเลขของเธอ ปลายนิ้วสองนิ้วของ{name}ลอกเป็นแผ่นไปทั้งสัปดาห์
        effects: { hp: -1 }
    - id: give_theril_the_number
      label: บอกตัวเลขในสมุดปกดำให้เธริลใส่ลงจดหมายเดือนนี้
      text: |
        เธริลฟังตัวเลขครั้งเดียว ไม่จด บอกว่าจำได้ คืนนั้นเขาเขียนจดหมายกลับไอเลธยาวกว่าทุกเดือนสองหน้า เขียนจนเทียนหมดเล่ม แล้วต่อด้วยเล่มของ{name}

        เดือนต่อมามีเอลฟ์จากหอนับดาวสองคนมาขอชมโดม อธิการพาเดินเองทั้งบ่าย พาขึ้นทางเดินรอบโดม พาดูเครื่องนับเลข ไม่ได้พาลงห้องใต้โดม เอลฟ์คนหนึ่งยืนนิ่งอยู่หน้าประตูห้องนั้นสามลมหายใจก่อนเดินตามไป
      effects:
        reputation: { star_hall: 1, crown: -1 }
        people: [{ id: cohort_theril, closeness: 1 }]
        flags: [saw_the_stars_secret, told_the_stars_secret, gave_theril_the_true_count]
    - id: knock_under_the_dome
      label: เคาะประตูห้องใต้โดมในคืนเดือนมืด
      check: { stat: WIS, dc: 12 }
      effects:
        reputation: { star_listeners: 1 }
        world: { star: 1 }
        flags: [saw_the_stars_secret, kept_the_stars_secret, sat_under_the_dome]
      success:
        text: |
          คนในห้องนั่งพิงผนังเป็นวง หลับตา แม่ครัวของโรงอาหาร คนเฝ้าประตูหลัง อาจารย์สองคนที่{name}ไม่เคยเห็นหน้า และคนที่นั่งใกล้ประตูที่สุดคือวิเรีย เธอขยับให้มีที่ว่างพอหนึ่งคน {name}นั่งลง ฟังเสียงที่ลงมาตามท่อทองเหลืองจากยอดโดม เสียงหึ่งต่ำๆ ที่แตกออกเป็นจังหวะ คล้ายคนนับเลข

          ตอนสางทุกคนลุกออกไปทีละคน ไม่มีใครทักใคร บนกระดานชนวนของ{name}มีตัวเลขเขียนไว้แถวหนึ่ง ลายมือของ{name}เอง จำไม่ได้ว่าเขียนตอนไหน
        effects: { stats: { WIS: 1 } }
      failure:
        text: |
          เสียงหึ่งดังขึ้นทุกครั้งที่{name}หายใจเข้า แล้วมีอะไรอุ่นๆ ไหลลงมาที่ริมฝีปาก เลือดกำเดาไหลทั้งสองข้าง หยดลงพื้นหินเป็นจุดตามจังหวะเสียง

          วิเรียพาออกมานั่งที่ขั้นบันได เอาผ้าเช็ดหน้าของเธอกดไว้ให้ บอกว่าคืนเดือนมืดหน้าค่อยลองใหม่ ผ้าเช็ดหน้าผืนนั้นเธอไม่ขอคืน
        effects: { hp: -2 }
    - id: give_back_the_slate
      label: คืนกระดานชนวนกับจุกไม้ก๊อก แล้วไม่ขึ้นโดมอีก
      text: |
        วิเรียรับกระดานคืน ลบตัวเลขที่ค้างอยู่ด้วยแขนเสื้อ แล้ววางไว้บนกองกระดานของนักเรียนปีสอง ปลายเดือน{name}ออกจากสถาบัน ช่องเหตุผลในทะเบียนเขียนว่า ตาไม่ทนลม

        คืนแรกในห้องเช่าใต้หลังคา {name}เปิดหน้าต่างนับช่องฟ้าเท่าที่กรอบหน้าต่างให้เห็น เช้าวันนั้นเดินไปลานตลาด ดูแผ่นตัวเลขดาวที่ราชสำนักตอกไว้ แล้วกลับมานับใหม่อีกคืน
      effects:
        alignment: { law: -1 }
        course: { leave: true }
        mark: ออกจากสถาบัน
        flags: [saw_the_stars_secret, kept_the_stars_secret, institute_left, left_institute_over_stars]

- id: adult.institute_stars_field
  stage: adult
  scene: observatory
  weight: 20
  course: { id: institute, year: 4, track: stars }
  text: |
    หลังคาของหอดูดาวหลวงบนเนินเหนือเมืองปูแผ่นทองแดง หน้าหนาวน้ำค้างบนนั้นแข็งก่อนเที่ยงคืน คนนับของหอใส่ถุงมือตัดปลายนิ้ว นั่งบนหนังแกะคนละผืน นักเรียนปีสี่ของสำนักดาราศาสตร์มานั่งนับกับพวกเขาทั้งฤดู ปีนี้คือ{name}กับเธริล

    หัวหน้าคนนับชื่อฮาเกน นับมายี่สิบปี คืนแรกเขาสอนวิธีของหอ ฟ้าแบ่งเป็นช่องด้วยลวดขึงบนกรอบไม้ ดาวที่ตกบนเส้นลวดพอดีไม่ต้องนับ ไม่ใช่ของช่องไหน หอทำแบบนี้มาตั้งแต่ก่อนเขาเกิด

    เธริลนั่งข้าง{name} ปากขยับนับดาวบนเส้นลวดอยู่ในใจ เขากระซิบว่าที่ไอเลธ ดาวบนเส้นนับครึ่ง ช่องซ้ายครึ่ง ช่องขวาครึ่ง ไม่มีดวงไหนหล่นหาย
  choices:
    - id: count_the_line_stars
      label: นับดาวบนเส้นลวดลงกระดานแยกไว้อีกช่อง
      text: |
        ฮาเกนเห็นช่องเกินบนกระดานของ{name}ตอนสาง ถามว่าช่องนั้นคืออะไร พอรู้แล้วบอกว่าไม่ต้องส่ง สมุดของหอไม่มีช่องให้ลง

        ปลายฤดู{name}บวกช่องนั้นทุกคืนเข้าด้วยกัน ได้สี่สิบเอ็ดดวง ไม่มีดวงไหนอยู่ในสมุดเล่มไหนของหอดูดาวหลวง
      effects: { stats: { INT: 1 }, flags: [counted_the_line_stars] }
    - id: count_their_way
      label: นับแบบของหอ ข้ามดาวบนเส้นลวด
      text: |
        หอจ่ายค่านับเป็นรายคืน ปลายฤดู{name}ได้สองเหรียญ ฮาเกนบอกว่ากระดานของ{name}สะอาดที่สุดในบรรดาเด็กสถาบันที่เคยมา ไม่มีขีดเกิน ไม่มีช่องแปลก

        คืนสุดท้ายเธริลเขียนจดหมายกลับไอเลธบนหลังคา {name}เห็นบรรทัดหนึ่งตอนเขาพับกระดาษ คนเวนทราสข้ามดาวบนเส้น
      effects: { gold: 2, flags: [counted_the_observatory_way] }
    - id: count_the_elf_way
      label: นับแบบเธริล ครึ่งช่องซ้าย ครึ่งช่องขวา
      check: { stat: WIS, dc: 12 }
      effects: { people: [{ id: cohort_theril, closeness: 1 }] }
      success:
        text: |
          ตัวเลขของ{name}กับเธริลตรงกันทุกคืน และสูงกว่าตัวเลขของคนนับของหอทุกคืน ห่างกันแค่ครึ่งดวงบ้าง ดวงหนึ่งบ้าง ฮาเกนไม่ส่งกระดานของสองคนขึ้นไป

          แต่เขาขอยืมไปอ่านตอนกลางวัน แล้วเอามาคืนตอนพลบ ขอบกระดานมีรอยนิ้วเปื้อนหมึกของเขาอยู่สามรอย
        effects: { stats: { WIS: 1 }, flags: [counted_the_elf_way] }
      failure:
        text: |
          ครึ่งดวงซ้ายกับครึ่งดวงขวาตีกันอยู่ในหัวจนตัวเลขของ{name}ไม่ตรงกับใครเลย ทั้งของหอและของเธริล นิ้วที่โผล่พ้นถุงมือแข็งจนจับดินสอหินไม่อยู่

          เธริลถอดผ้าพันคอของเขามาพันมือให้ ผ้าทอจากไอเลธ อุ่นกว่าผ้าทุกผืนที่ขายในตลาดเวนทราส ปลายนิ้วสองนิ้วของ{name}ดำคล้ำไปจนหมดฤดู
        effects: { hp: -1, flags: [counted_the_elf_way] }

- id: adult.institute_stars_thesis
  stage: adult
  scene: observatory
  weight: 20
  course: { id: institute, year: 5, track: stars }
  text: |
    ลวดเส้นที่เจ็ดดึงทีไรกรอบบิดทุกที ลวดหกเส้นแรกขึงเสร็จในสัปดาห์เดียว เส้นนี้ค้างมาเกือบเดือน กรอบสี่เหลี่ยมบนหัวไม้เท้าของ{name}ต้องแบ่งฟ้าเป็นสี่สิบเก้าช่อง ดาวที่ตกบนเส้นลวดต้องมีที่นับของตัวเอง ไม่หล่นหายจากช่องไหน ด้ามเป็นไม้ไอเลธ เบาพอถือส่องฟ้าได้ทั้งคืนโดยแขนไม่ล้า

    วิทยานิพนธ์ของสำนักดาราศาสตร์ต้องนับได้ ไม่ใช่เขียนได้ ในคืนฟ้าเปิด อาจารย์สามคนขึ้นทางเดินรอบโดมพร้อมผู้สอบ แล้วให้นับช่องที่ไม่มีใครเลือกไว้ก่อน

    หัวหน้าคนนับของหอดูดาวหลวงขึ้นมาดูงานนักเรียนปีห้าเหมือนทุกปี เขายกกรอบของ{name}ขึ้นส่องฟ้า แล้วถามว่าหอขอซื้อได้ไหม ทั้งไม้เท้าทั้งแบบ
  choices:
    - id: string_by_eye
      label: ขึงลวดเส้นที่เจ็ดด้วยตาเปล่า แบบที่วิเรียนับ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ขึงเส้นที่เจ็ดตอนกลางคืน ไม่ใช้ไม้บรรทัด ใช้ดาวสองดวงที่อยู่ห่างกันพอดีหนึ่งช่องเป็นหมุด กรอบไม่บิดอีก คืนสอบ อาจารย์สามคนนับช่องเดียวกันด้วยเครื่องนับเลข {name}นับด้วยกรอบ วิเรียนับด้วยตาเปล่า

          ตัวเลขของ{name}กับของวิเรียตรงกัน ของเครื่องขาดไปสองดวง อาจารย์คนหนึ่งหมุนเครื่องนับใหม่ ผลออกมาเท่าเดิม
        effects: { stats: { INT: 1 }, items: [sky_count_staff], flags: [thesis_stars] }
      failure:
        text: |
          ลวดเส้นที่เจ็ดขาดตอนดึงรอบสุดท้าย ปลายลวดดีดกลับมากรีดแก้ม{name}เป็นเส้นบางยาวเท่านิ้วก้อย กรอบบิดจนมุมหนึ่งไม่ได้ฉาก คืนสอบ{name}นับด้วยกรอบที่มีช่องเบี้ยวสามช่อง

          งานผ่าน หมายเหตุในสมุดผลสอบเขียนว่า ความคิดใช้ได้ ลวดใช้ไม่ได้ กรอบนั้นสำนักแขวนไว้ที่ผนังห้องใต้โดม ข้างกรอบรุ่นก่อนๆ ที่เบี้ยวแบบเดียวกัน
        effects: { hp: -1, flags: [thesis_stars] }
    - id: ask_theril_to_string
      label: ขอให้เธริลช่วยขึงลวดแบบเอลฟ์
      text: |
        เธริลไม่ดึงลวด เขาแช่ลวดในน้ำอุ่นจนอ่อน ขึงขณะยังอุ่น แล้วปล่อยให้ลวดตึงเองตอนเย็นลง เขาบอกว่าช่างที่ไอเลธขึงสายเครื่องดนตรีแบบนี้ ไม่เคยมีใครในเวนทราสถาม

        คืนสอบกรอบนับได้ครบทุกช่อง ทะเบียนเขียนชื่อ{name}ไว้หน้าเดียวกับจำนวนช่อง เธริลเขียนจดหมายกลับบ้านคืนนั้น ในจดหมายมีภาพวาดกรอบสี่สิบเก้าช่อง
      effects:
        items: [sky_count_staff]
        people: [{ id: cohort_theril, closeness: 1 }]
        flags: [thesis_stars, theril_strung_the_frame]
    - id: sell_to_the_observatory
      label: ขายไม้เท้ากับแบบให้หอดูดาวหลวง
      text: |
        หัวหน้าคนนับจ่ายห้าเหรียญ อาจารย์สามคนสอบจากแบบกับคืนเดียวที่{name}ได้ยืมกรอบกลับมานับ ทะเบียนจดชื่อ{name}ไว้หน้าเดียวกับจำนวนช่องตามธรรมเนียม

        ปีต่อมาคนนับบนหลังคาทองแดงทุกคนมีกรอบสี่สิบเก้าช่อง ดาวบนเส้นลวดยังไม่นับเหมือนเดิม
      effects: { gold: 5, reputation: { crown: 1 }, flags: [thesis_stars, sold_the_frame_to_the_observatory] }

- id: adult.school_stars_comes_due
  stage: adult
  scene: market
  weight: 25
  when:
    age: [26, 45]
    flags: [saw_the_stars_secret]
    not_flags: [institute_student]
  text: |
    แผ่นตัวเลขดาวประจำปีของราชสำนักตอกอยู่ที่เสาลานตลาดเหมือนทุกถิ่น ปีนี้ข้างตัวเลขหมึกแดงมีคนเอาถ่านเขียนตัวเลขอีกตัวไว้ สูงกว่ากันไม่กี่ดวง คนเฝ้าตลาดลบทิ้งทุกเช้า ตกเย็นตัวเลขถ่านกลับมาใหม่

    คนเขียนเป็นเด็กหนุ่มลูกช่างทำถัง {name}เจอเขาบนหลังคาโรงถังตอนดึก นั่งนับดาวด้วยกรอบไม้ที่ทำเองกับลวดตากผ้า เขานับแบบนี้มาสามปี จดลงสมุดปกกระดาษห่อของ ตัวเลขของเขาสูงกว่าแผ่นของราชสำนักทุกปี ทุกช่อง

    เขาได้ยินมาว่า{name}เคยเรียนสำนักดาราศาสตร์ เขาอยากรู้เรื่องเดียว นับผิดตรงไหน ถ้าไม่ผิด เขาจะเอาสมุดไปให้คนเดินข่าว
  choices:
    - id: tell_him_he_counted_twice
      label: บอกเขาว่าคนนับเองนับดาวบนเส้นซ้ำกันทุกคน
      requires: { flag: kept_the_stars_secret }
      text: |
        เด็กหนุ่มถามว่าแก้ยังไง {name}บอกวิธีของหอดูดาวหลวง ดาวบนเส้นลวดไม่ต้องนับ เขาขอบคุณ ปีนกลับขึ้นหลังคา แล้วนับใหม่ทั้งคืน

        ตัวเลขถ่านข้างแผ่นของราชสำนักหายไปตั้งแต่ปีต่อมา ปีหลังจากนั้นตัวเลขในสมุดของเขาตรงกับหมึกแดงทุกดวง
      effects: { alignment: { moral: -1 }, flags: [told_the_counter_he_counted_twice] }
    - id: send_him_to_ileth
      label: เขียนจดหมายแนะนำเขาถึงหอนับดาว ให้เอาสมุดไปด้วย
      requires: { flag: told_the_stars_secret }
      text: |
        {name}เขียนจดหมายสั้นๆ บอกแค่ว่าเด็กคนนี้นับอย่างไร และนับมากี่ปี เด็กหนุ่มอ่านไม่ออกว่าจดหมายเขียนถึงใคร {name}จึงเขียนชื่อหอนับดาวไว้หน้าซองตัวใหญ่ เขาเก็บสมุดกับจดหมายใส่ถุงหนังใบเดียว ไปกับกองเกวียนขึ้นไอเลธในเดือนนั้น

        โรงถังจ้างคนใหม่มาแทนเขา ตัวเลขถ่านที่เสาลานตลาดหายไปปีเดียว ปีต่อมามีคนเขียนใหม่ ลายมือคนละคน ตัวเลขเดียวกัน
      effects: { reputation: { star_hall: 1, crown: -1 }, flags: [sent_the_rooftop_counter_west] }
    - id: count_with_him
      label: ขึ้นไปนั่งนับกับเขาบนหลังคาหนึ่งคืน
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ลวดตากผ้าของเขาหย่อนไปสองเส้น {name}ขันให้ตึง แล้วนั่งนับช่องเดียวกันจนสาง ตัวเลขของสองคนตรงกัน สูงกว่าหมึกแดงสามดวง

          {name}บอกว่าเขาไม่ได้นับผิด แล้วบอกว่าสมุดเล่มนั้นอย่าเพิ่งให้ใคร เก็บไว้นับต่อ เขาถามว่าทำไม {name}ชี้ตัวเลขถ่านบนเสาลานตลาดที่มองเห็นจากหลังคา คนเฝ้าตลาดกำลังเดินไปลบ
        effects: { stats: { WIS: 1 }, flags: [counted_with_the_rooftop_boy] }
      failure:
        text: |
          กระเบื้องหลังคาโรงถังลื่นด้วยน้ำค้าง {name}ไถลลงไปครึ่งหลังคาก่อนมือจะคว้ารางน้ำทัน ข้อมือพลิก เลือดออกที่ฝ่ามือสองแผล นับได้ไม่ถึงครึ่งช่อง

          เด็กหนุ่มช่วยพยุงลงบันได ถามว่าตกลงเขานับผิดหรือเปล่า {name}ตอบไม่ได้ เพราะไม่ได้นับ
        effects: { hp: -2, flags: [fell_off_the_cooperage_roof] }
    - id: tell_him_the_truth
      label: เทียบสมุดของเขากับแผ่นหมึกแดง แล้วบอกตามจริงว่าเขานับไม่ผิด
      text: |
        เด็กหนุ่มฟังแล้วไม่ดีใจอย่างที่{name}คิด เขาถามว่าถ้าไม่ผิด แล้วใครผิด {name}ไม่มีคำตอบที่พูดได้ในลานตลาด

        เขาเอาสมุดไปให้คนเดินข่าวในเดือนนั้น คนเดินข่าวอ่านแล้วคืนให้ บอกว่าไม่มีใครอยากฟังเพลงตัวเลข เด็กหนุ่มยังเขียนตัวเลขถ่านที่เสาลานตลาดทุกเย็น
      effects: { alignment: { law: -1 }, flags: [told_the_counter_he_was_right] }

- id: adult.school_stars_craft
  stage: adult
  scene: road
  weight: 25
  when:
    age: [23, 50]
    flags: [school_stars, institute_graduate]
  text: |
    กองเกวียนหลงทางตั้งแต่หัวค่ำ หมอกลงหนาจนคนขับเกวียนคันหน้ามองไม่เห็นหัววัวของตัวเอง ทางเกวียนแตกเป็นสามแฉกตรงต้นไม้ตายต้นเดียว ไม่มีป้าย คนนำทางเป็นไข้นอนอยู่ท้ายเกวียนคันที่สอง

    ตอนดึกเมฆเปิดช่องหนึ่งช่อง เท่าผ้าเช็ดหน้า มีดาวในช่องนั้นเจ็ดดวง คนขับเกวียนทุกคนเงยหน้าขึ้นดู ไม่มีใครรู้ว่าเป็นดาวดวงไหน คนที่นับดาวมาหลายปีรู้ว่าเจ็ดดวงพอ ถ้านับเป็น และถ้าเมฆไม่ปิดเสียก่อน
  choices:
    - id: read_the_gap
      label: นับดาวเจ็ดดวงในช่องเมฆ แล้วชี้ทาง
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}นับครั้งเดียว จับได้ว่าดาวดวงที่สามจากซ้ายคือดวงที่คนเรือเรียกว่าตาเหนือ ชี้แฉกขวา เมฆปิดช่องนั้นก่อนคนขับคันหน้าจะลงแส้

          ตอนสางกองเกวียนลงถึงลำธารที่คนนำทางพูดถึงก่อนจะไข้ขึ้น คนขับคันหน้าเอาผ้าห่มผืนดีที่สุดของเขามาพาดไหล่{name}
        effects: { stats: { WIS: 1 }, flags: [read_the_way_by_seven_stars] }
      failure:
        text: |
          {name}นับได้หกดวง ดวงที่เจ็ดหายเข้าเมฆก่อนนับจบ ชี้แฉกกลางด้วยการเดา กองเกวียนเดินจนสาง ทางพาลงหุบ ล้อเกวียนคันที่สามจมโคลนถึงดุม

          ทั้งกองต้องช่วยกันงัดล้อจนเกือบเที่ยง ไหล่ของ{name}เคล็ดตั้งแต่ครั้งแรกที่ดัน คนขับคันหน้าบอกว่าอย่างน้อยก็ไม่ใช่แฉกซ้าย แฉกซ้ายไปหน้าผา
        effects: { hp: -1, flags: [misread_the_seven_stars] }
    - id: wait_for_dawn
      label: บอกให้ทุกคนจอดเกวียนรอจนสาง
      text: |
        กองเกวียนจอดเรียงกันใต้ต้นไม้ตาย ก่อไฟกองเล็ก คนขับผลัดกันนอน ตอนสางหมอกจางพอให้เห็นรอยล้อเก่าบนแฉกขวา

        ทั้งกองถึงที่หมายช้าไปครึ่งวัน พ่อค้าเจ้าของของในเกวียนหักค่าจ้างคนขับคนละครึ่งวัน คนขับคันหน้าบ่นเรื่องนี้ไปตลอดทาง แต่บ่นกับวัว
      effects: { alignment: { law: 1 }, flags: [waited_out_the_fog] }
    - id: frame_the_gap
      label: ยกไม้เท้าหัวกรอบขึ้นส่องช่องเมฆ
      requires: { item: sky_count_staff }
      text: |
        ดาวเจ็ดดวงตกลงในช่องของกรอบพอดี ดวงหนึ่งอยู่บนเส้นลวดเส้นที่เจ็ด ลวดเส้นนั้นสั่นเองโดยไม่มีลม {name}รู้ว่าดวงไหนคือดวงไหนก่อนลมหายใจที่สอง ชี้แฉกขวา กองเกวียนถึงลำธารก่อนสาง

        คนขับเกวียนรวมเงินกันได้สองเหรียญ ยัดใส่มือ{name} คืนนั้นและอีกสองคืนต่อมา{name}นอนไม่หลับ นั่งนับช่องที่มีดาวบนเส้นลวดจนครบทุกช่อง
      effects: { gold: 2, flags: [framed_the_way_through_fog] }

# ---------- สำนักรักษา ----------

- id: adult.institute_healing_advisor
  stage: adult
  scene: healer
  weight: 20
  course: { id: institute, year: 3, track: healing }
  text: |
    โรเซล ทาวิค เดินรอบดึกคนเดียวทุกคืน ปีสามเธอให้{name}เดินตาม ถือตะเกียงกับกระดานจดอาการ ห้องไข้ของสำนักมีสี่ห้องตามผัง เธอเดินครบสี่ห้องแล้วไม่หยุด ไขกุญแจประตูหลังห้องเก็บผ้า

    หลังประตูเป็นห้องยาว เตียงสิบเจ็ดเตียง คนบนเตียงผิวเป็นแก้วขึ้นไปถึงคอ บางคนถึงคาง ใต้ผิวแก้วมีแสงเต้นช้าๆ ตามชีพจร ระยะนี้ตำราของวิหารอีเซลไม่มี เพราะตามตำรา คนไข้ตายก่อนจะถึง คนในห้องนี้ไม่ตาย สำนักเฝ้าดูห้องนี้มาสิบสองปี เตียงแรกยังเป็นคนเดิม

    รถของหมอประจำสมาคมโรงกลั่นมาส่งคนไข้ทางประตูหลังก่อนสาง ค่าผ้า ค่าน้ำมันตะเกียง ค่าแรงคนเฝ้า สมาคมเป็นคนจ่าย วิหารอีเซลที่ทำงานกับสำนักมาตลอดไม่รู้ว่ามีห้องนี้ โรเซลยื่นกระดานจดอาการของห้องนี้ให้{name} ช่องแรกคือชื่อ ช่องที่สองคือแสงเต้นกี่ครั้งต่อการหายใจหนึ่งครั้ง
  choices:
    - id: take_the_board
      label: รับกระดาน แล้วเริ่มจากเตียงแรก
      check: { stat: CHA, dc: 12 }
      effects: { flags: [saw_the_healing_secret, kept_the_healing_secret] }
      success:
        text: |
          ผู้หญิงเตียงแรกยังพูดได้ เสียงแหบเหมือนลมผ่านขวด เธอถามว่าข้างนอกฝนตกหรือเปล่า {name}เล่าให้ฟังว่าฝนตกตั้งแต่บ่าย รางน้ำหน้าโรงอาหารล้น เธอขอให้เล่าเรื่องรางน้ำอีกรอบ ช้ากว่าเดิม

          ตอนจดแสงเต้นของเธอ{name}นับได้สามครั้งต่อลมหายใจ โรเซลดูกระดานแล้วบอกว่าเดือนก่อนสองครั้ง เธอให้{name}ถือกุญแจห้องนี้เวรคืนวันทาลิส
        effects: { stats: { CHA: 1 } }
      failure:
        text: |
          {name}เอานิ้วแตะข้อมือคนไข้เตียงที่สามเพื่อนับชีพจรแบบที่สำนักสอน ผิวแก้วเย็นจนนิ้วติด ถอนออกมาแล้วผิวนิ้วลอกค้างอยู่บนข้อมือเขาเป็นแผ่นบาง คนไข้ไม่รู้สึกอะไร

          โรเซลพันนิ้วให้ แล้วบอกว่าห้องนี้ไม่นับชีพจรด้วยมือ นับด้วยตา ทั้งคืนนั้น{name}นับด้วยตาจนครบสิบเจ็ดเตียง
        effects: { hp: -1 }
    - id: tell_the_family
      label: จดชื่อเตียงแรกไว้ แล้วไปบอกครอบครัวของเธอที่ย่านโรงกลั่น
      text: |
        บ้านของเธออยู่หลังโรงกลั่นที่สี่ ลูกชายเปิดประตู เขาโตเป็นผู้ชายแล้ว ไหล่กว้าง มือมีรอยลวกแบบคนงานกะดึก เขาฟังจนจบ แล้วเดินไปยืนที่ประตูหลังของสถาบันตั้งแต่เย็นนั้น ยืนทุกเย็น ไม่มีใครเปิดให้

        สัปดาห์ที่สามเตียงแรกว่าง รถของหมอสมาคมมารับไปก่อนสาง ไม่มีใครในสำนักบอก{name}ว่าไปไหน โรเซลเปลี่ยนกุญแจประตูหลังห้องเก็บผ้า
      effects:
        reputation: { distillers: -1 }
        alignment: { moral: 1 }
        flags: [saw_the_healing_secret, told_the_healing_secret, told_a_refinery_family_of_the_ward]
    - id: tell_the_isel_house
      label: ออกจากสถาบัน แล้วไปเล่าเรื่องห้องนี้ให้แม่ชีใหญ่ของบ้านอีเซลริมแม่น้ำฟัง
      text: |
        แม่ชีใหญ่ฟังจนจบ จดลงสมุดของบ้าน แล้วขอให้{name}พาไปดู {name}พาไปไม่ได้ ชื่อ{name}ไม่อยู่ในทะเบียนนักเรียนแล้ว กุญแจประตูหลังห้องเก็บผ้าไม่ใช่ของ{name}อีก

        แม่ชีส่งคนไปถามที่สถาบันสองครั้ง ได้คำตอบเดียวกันทั้งสองครั้ง สำนักรักษามีห้องไข้สี่ห้อง ตามผัง
      effects:
        reputation: { royal_institute: -1 }
        alignment: { moral: 1 }
        course: { leave: true }
        mark: ออกจากสถาบัน
        flags: [saw_the_healing_secret, told_the_healing_secret, institute_left, left_institute_over_healing]

- id: adult.institute_healing_field
  stage: adult
  scene: temple
  weight: 20
  course: { id: institute, year: 4, track: healing }
  text: |
    เนริสหลับยืนพิงเสาข้างอ่างล้างมือ คืนที่สี่ติดกันแล้วที่เธอรับเวรดึกแทนแม่ชีคนหนึ่งเพื่อเอาค่าเวรส่งกลับบ้าน ผ้ากันเปื้อนที่ต้มจนแข็งยังผูกอยู่ที่เอว

    ห้องไข้ของบ้านอีเซลริมแม่น้ำมีเตียงสามสิบ ฤดูนี้ไข้ท่าเรือมากับเรือเกลือ คนนอนพื้นอีกยี่สิบ แม่ชีคุมห้องชื่อไบรดา ไม่ใช้เวทและไม่ชอบคนที่ใช้ เธอให้นักเรียนฝึกงานของสำนักรักษาต้มผ้าสามวันก่อนจะให้แตะคนไข้

    เวทลดไข้ที่สำนักสอนลดได้ทีละคน ครั้งละครึ่งคืน คนร่ายเลือดกำเดาไหลหลังครั้งที่สาม วิธีของแม่ชีคือน้ำต้มเปลือกไม้กับผ้าชุบน้ำเย็น ช้ากว่า แต่ทำได้ทั้งห้องพร้อมกัน เตียงริมหน้าต่างมีเด็กสองคนที่ไข้ไม่ลงมาสองคืน
  choices:
    - id: school_spell
      label: ร่ายเวทลดไข้ให้เด็กสองคนริมหน้าต่างก่อน
      check: { stat: INT, dc: 12 }
      success:
        text: |
          ไข้ของเด็กคนแรกลงก่อนเที่ยงคืน คนที่สองลงตอนตีสอง เลือดกำเดาของ{name}หยดลงผ้าห่มของเด็กคนที่สองหนึ่งหยด ไบรดาเอาผ้าผืนใหม่มาเปลี่ยน ไม่ห้าม และไม่ชม

          ตอนสางเธอยื่นชามน้ำต้มเปลือกไม้ให้{name}ชามหนึ่ง บอกว่าคนร่ายก็ต้องกิน
        effects: { stats: { INT: 1 }, flags: [broke_two_fevers_by_spell] }
      failure:
        text: |
          เวทครั้งที่สองไม่ติด ไข้ของเด็กคนที่สองลงครึ่งเดียวแล้วกลับขึ้นมาใหม่ {name}ร่ายครั้งที่สามตอนหูเริ่มอื้อ เลือดกำเดาไหลไม่หยุด ต้องนอนพื้นข้างเตียงเด็กจนสาง

          ไบรดาชุบผ้าเย็นวางบนหน้าผาก{name}กับหน้าผากเด็ก สลับกันทั้งคืน ตอนสางไข้ของเด็กลงเพราะผ้าเย็น
        effects: { hp: -1, flags: [bled_for_a_fever] }
    - id: nuns_broth
      label: ทำตามวิธีของแม่ชี ต้มเปลือกไม้ ชุบผ้าเย็น ทั้งห้อง
      text: |
        {name}ต้มเปลือกไม้หม้อแล้วหม้อเล่า บิดผ้าจนนิ้วซีด เดินวนห้องสามสิบเตียงกับคนนอนพื้นอีกยี่สิบ ไข้ของเด็กริมหน้าต่างลงช้า ลงตอนบ่ายวันที่สาม

        ฤดูนั้นห้องไข้ของบ้านริมแม่น้ำเสียคนไปสองคน ทั้งสองเป็นคนแก่ ไบรดาเขียนชื่อ{name}ลงสมุดเวรของบ้าน ช่องเดียวกับแม่ชี ไม่ใช่ช่องนักเรียน
      effects: { alignment: { law: 1 }, flags: [learned_the_nuns_broth] }
    - id: cover_neris
      label: ปลุกเนริสให้ไปนอน แล้วรับเวรดึกของเธอแทน
      text: |
        เนริสเถียงสองคำแล้วหลับไปบนกองผ้าสะอาดตั้งแต่ยังเถียงไม่จบ {name}ทำเวรของเธอต่อด้วยวิธีของแม่ชี แล้วทำเวรของตัวเองต่ออีกรอบ ไม่ได้นอนเลยจนตะวันขึ้นสองครั้ง

        ค่าเวรจ่ายตามชื่อในสมุด เนริสได้ไปทั้งหมด เธอส่งกลับบ้านทั้งหมด แล้วซื้อขนมปังไส้น้ำผึ้งก้อนหนึ่งมาแบ่ง{name}ครึ่งก้อน ก้อนเดียวที่เธอซื้อให้ตัวเองทั้งฤดู
      effects:
        hp: -1
        stats: { CHA: 1 }
        people: [{ id: cohort_neris, closeness: 1 }]
        flags: [covered_neris_night_shift]

- id: adult.institute_healing_thesis
  stage: adult
  scene: healer
  weight: 20
  course: { id: institute, year: 5, track: healing }
  text: |
    ตะเกียงดวงแรกกินน้ำค้างดาวหมดหลอดในคืนเดียว ดวงที่สองอยู่ได้สองคืน ดวงที่สามสามคืน ทั้งสามดวงห้อยเรียงกันอยู่บนตะปูข้างหน้าต่างห้องของ{name} โครงทองเหลืองเท่าลูกพลับ สายยาวพอห้อยกลางอก ให้มือทั้งสองข้างว่างจับคนไข้

    วิทยานิพนธ์ของสำนักรักษาคือของหรือวิธีที่ใช้ข้างเตียงได้ แสงของตะเกียงต้องทำให้จุดแก้วที่ยังเล็กกว่าเล็บเรืองขึ้นมาก่อนเจ้าของผิวจะรู้ตัว เข้มพอให้จุดแก้วเรือง แต่ไม่เข้มจนคนไข้ตาพร่า ความคิดมาจากห้องหลังห้องเก็บผ้า จากแสงที่เต้นใต้ผิวคนไข้

    ชายจากสมาคมโรงกลั่นมาที่ห้องของ{name}พร้อมหมอประจำสมาคม หมอคนนั้นคือคนที่ขับรถมาส่งคนไข้ทางประตูหลังก่อนสาง สมาคมอยากซื้อดวงแรกกับแบบ ไว้แขวนส่องคนงานที่ประตูโรงกลั่นทุกเช้า
  choices:
    - id: tune_the_wick
      label: ปรับไส้ตะเกียงจนแสงเรืองแค่จุดแก้ว ไม่แตะผิวดี
      check: { stat: INT, dc: 13 }
      success:
        text: |
          คืนที่เก้า แสงของตะเกียงนิ่งพอ วันสอบ อาจารย์สามคนให้ส่องคนอาสาจากโรงอาหาร ชายล้างจานคนหนึ่งยืนให้ส่องทั้งตัว ใต้แสงนั้นจุดแก้วเท่าเมล็ดงาเรืองขึ้นที่หลังใบหูซ้ายของเขา เขาไม่เคยรู้

          โรเซลลงชื่อรับ แล้วพาชายล้างจานไปนั่งที่ห้องของเธอ ปิดประตู {name}ยืนรออยู่ที่ทางเดินจนตะเกียงที่ห้อยคอดับเอง
        effects: { stats: { INT: 1 }, items: [bedside_dew_lamp], flags: [thesis_healing] }
      failure:
        text: |
          แสงสั่นเพราะไส้ตะเกียงตัดไม่เรียบ จุดแก้วบนข้อมือคนไข้ที่สำนักยืมมาสอบเรืองบ้างดับบ้าง และผิวดีข้างๆ ก็เรืองตามไปด้วยในบางจังหวะ ตา{name}พร่าจนต้องนั่งลงกลางห้องสอบ

          งานผ่าน หมายเหตุใต้ชื่อเขียนว่า ตะเกียงที่โกหกครึ่งหนึ่ง แย่กว่าไม่มีตะเกียง สำนักเก็บตะเกียงดวงนั้นไว้ในลิ้นชักกุญแจของโรเซล
        effects: { hp: -1, flags: [thesis_healing] }
    - id: bring_the_third
      label: ส่งดวงที่สาม บอกอาจารย์ว่าอยู่ได้สามคืน
      text: |
        สามคืนพอสำหรับสอบ ตะเกียงดวงที่สามส่องจุดแก้วบนข้อมือคนไข้ได้ชัดทุกจุด ไม่แตะผิวดี อาจารย์คนที่สามถามว่าคืนที่สี่จะเป็นอย่างไร {name}ตอบว่ามืด

        โรเซลลงชื่อรับ ใต้ชื่อเขียนว่า สามคืน แล้วขีดเส้นใต้สองเส้น ชายจากสมาคมยังนั่งรออยู่ที่ม้านั่งหน้าห้องจนพลบ
      effects: { items: [bedside_dew_lamp], flags: [thesis_healing] }
    - id: sell_to_the_guild
      label: ขายดวงแรกกับแบบให้สมาคมโรงกลั่น
      text: |
        ชายจากสมาคมนับห้าเหรียญลงบนโต๊ะ หมอประจำสมาคมห่อตะเกียงด้วยผ้าลงไขอย่างระวัง แบบที่เหลืออาจารย์สามคนใช้สอบ ทะเบียนลงชื่อ{name}ไว้ใต้คำว่าห้ามขาย สองคำที่อาจารย์ที่ปรึกษาเขียนกำกับหน้าแบบไว้ตั้งแต่ก่อนรู้ว่าจะขาย

        ฤดูต่อมา ประตูโรงกลั่นของสมาคมทุกโรงมีตะเกียงทองเหลืองแขวนข้างโต๊ะลงชื่อเข้างาน คนงานที่มีจุดเรืองใต้แสงได้ค่าแรงวันนั้นเป็นวันสุดท้าย
      effects: { gold: 5, reputation: { distillers: 1 }, flags: [thesis_healing, sold_the_lamp_to_the_guild] }

- id: adult.school_healing_comes_due
  stage: adult
  scene: home
  weight: 25
  when:
    age: [26, 45]
    flags: [saw_the_healing_secret]
    not_flags: [institute_student]
  text: |
    ผู้หญิงคนหนึ่งนั่งพิงกรอบประตูบ้าน{name}ตั้งแต่ก่อนสาง ห่มผ้าห่มสีเทาที่มุมปักตราสถาบัน ผิวของเธอเป็นแก้วขึ้นไปถึงคาง แสงใต้ผิวเต้นช้าๆ เท้าทั้งสองข้างพันผ้าเปื้อนดินหลายชั้น ชั้นในสุดเป็นผ้าปูเตียง

    เธอจำ{name}ได้จากเสียง เสียงของคนที่เคยยืนจดแสงเต้นข้างเตียงเธอ คืนหนึ่งประตูหลังห้องเก็บผ้าไม่ได้ลงกลอน เธอเลยเดินออกมา อยากกลับบ้าน แต่บ้านไม่อยู่แล้ว คนแถวนั้นบอกว่าครอบครัวย้ายไปตั้งแต่ปีที่รถหมอมารับเธอ

    เธอขอน้ำหนึ่งถ้วย กับที่นอนหนึ่งคืน ก่อนจะคิดว่าไปไหนต่อ
  choices:
    - id: send_word_to_the_institute
      label: ส่งข่าวไปที่สถาบันให้รถมารับเธอกลับ
      requires: { flag: kept_the_healing_secret }
      text: |
        รถของหมอประจำสมาคมโรงกลั่นมาถึงตอนก่อนสาง เร็วกว่าที่ข่าวควรจะไปถึง คนขับลงมาอุ้มเธอขึ้นรถอย่างคนเคยอุ้ม เธอไม่ขัด ขอแค่ให้เขารอให้เธอพับผ้าห่มก่อน

        ผ้าห่มสีเทาวางพับอยู่บนขั้นบันไดหน้าบ้าน{name} ตรามุมผ้าหันขึ้น สองวันต่อมามีเหรียญสองเหรียญใส่ซองไม่มีชื่อมาวางทับไว้
      effects: { gold: 2, alignment: { moral: -1 }, reputation: { distillers: 1 }, flags: [sent_the_glass_woman_back] }
    - id: bring_her_to_isel
      label: พาเธอไปบ้านอีเซลที่ใกล้ที่สุด แล้วเล่าเรื่องห้องนั้นให้แม่ชีฟัง
      requires: { flag: told_the_healing_secret }
      text: |
        เธอเดินได้ทีละสิบก้าว {name}พยุงไปทีละสิบก้าวจนถึงบ้านอีเซล แม่ชีที่ประตูเห็นแสงใต้ผิวแล้วถอยหลังครึ่งก้าว แล้วก้าวกลับมาเอง

        คนไข้นั่งอยู่ตรงหน้าแม่ชีทั้งตัว แม่ชีจดทุกคำที่{name}เล่าลงสมุดของบ้าน ใต้ทุกคำมีลายมือของผู้หญิงคนนั้นลงชื่อกำกับ ลายมือสั่นแต่อ่านออก
      effects: { reputation: { royal_institute: -1 }, alignment: { moral: 1 }, flags: [brought_the_glass_woman_to_isel] }
    - id: keep_her_a_while
      label: ให้เธอนอนที่บ้าน ดูแลเองจนกว่าเธอจะไปต่อ
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เธออยู่เจ็ดคืน กินได้แค่น้ำซุปใส แต่พูดได้ทุกคืน เล่าเรื่องโรงกลั่นที่เธอล้างหม้อมาตั้งแต่เด็ก เรื่องลูกชายที่ชอบนั่งดูไฟใต้หม้อ เรื่องคนบนเตียงอื่นๆ ในห้องยาว ทีละคน ทีละชื่อ {name}จดชื่อเหล่านั้นไว้ครบ

          เช้าวันที่แปดเธอเดินไปทางแม่น้ำ ใส่รองเท้าคู่ที่{name}ซื้อให้ ผ้าห่มสีเทาทิ้งไว้บนเตียง แสงที่เต้นใต้ผิวของเธอเห็นได้จากหน้าบ้านจนเธอเลี้ยวพ้นมุมถนน
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [kept_the_glass_woman_seven_nights] }
      failure:
        text: |
          แสงใต้ผิวของเธอเต้นทั้งคืน ลอดผ้าห่มขึ้นมาบนเพดาน {name}นอนไม่หลับมาห้าคืน กินไม่ลง นั่งเฝ้าเธอเหมือนเฝ้าไฟที่ไม่รู้ว่าจะลุกหรือดับ

          คืนที่ห้าเธอหายไปตอนที่{name}เผลอหลับบนเก้าอี้ ผ้าห่มสีเทาพับไว้ปลายเตียง บนหมอนมีรอยเรืองจางๆ เป็นรูปแก้มคน หายไปตอนเที่ยง
        effects: { hp: -1, flags: [lost_the_glass_woman] }
    - id: water_and_a_coin
      label: ให้น้ำ ให้เหรียญหนึ่งเหรียญ แล้วปิดประตู
      requires: { min_gold: 1 }
      text: |
        เธอดื่มน้ำหมดถ้วย รับเหรียญด้วยมือที่เป็นแก้วถึงข้อนิ้ว เหรียญกระทบผิวแก้วดังเหมือนเหรียญหล่นลงจาน

        ตอนสาย{name}เปิดประตูอีกครั้ง กรอบประตูมีรอยเรืองจางๆ เป็นรูปไหล่คน หายไปตอนเที่ยง
      effects: { gold: -1, flags: [shut_the_door_on_the_glass_woman] }

- id: adult.school_healing_craft
  stage: adult
  scene: station
  weight: 25
  when:
    age: [23, 50]
    flags: [school_healing, institute_graduate]
  text: |
    คนแบกของประจำสถานีล้มลงกลางโถงรอขึ้นรถพร้อมลังบนบ่า ลังแตก ส้มกลิ้งไปทั่วพื้น คนในโถงแหวกเป็นวงกว้าง นายสถานีเดินมาดมกลิ่นแล้วว่าเมา สั่งให้ลากออกไปข้างนอกก่อนรถเข้า

    {name}เห็นจากม้านั่ง ริมฝีปากเขาเขียวคล้ำ หายใจถี่สั้นแบบคนที่ลมเข้าไม่ถึงก้นปอด ไม่มีกลิ่นเหล้า มีกลิ่นน้ำค้างดาวติดเสื้ออยู่จางๆ ลังที่เขาแบกทั้งเช้าก่อนลังส้มเป็นลังหลอดของโรงกลั่น
  choices:
    - id: breathe_spell
      label: คุกเข่าลงข้างเขา ร่ายเวทเปิดทางลม
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ลมหายใจแรกที่ยาวพอเข้าไปถึงปอดเขาดังเหมือนคนดึงผ้าออกจากปากขวด สีเขียวที่ริมฝีปากจางลงก่อนรถจะเข้าเทียบ คนแบกของอีกสองคนช่วยพยุงเขาไปนั่งพิงผนัง

          นายสถานีถามว่าคนนี้จะกลับมาทำงานได้เมื่อไร {name}ตอบว่าสามวัน นายสถานีจดลงสมุด หักค่าจ้างสามวัน
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [opened_a_porters_breath] }
      failure:
        text: |
          เวทเปิดทางลมได้ครึ่งเดียว เขาหายใจได้ แต่ถี่และตื้นเหมือนเดิม {name}ต้องประคองหัวเขาไว้บนตักจนหมอที่นายสถานีส่งคนไปตามมาถึง เลือดกำเดาของ{name}หยดลงบนเสื้อเขาสองหยด

          หมอมาถึงพร้อมขวดเกลือดม ดมทีเดียวเขาลุกขึ้นนั่งได้ หมอว่าเวทของสถาบันช่วยไว้ครึ่งทาง เกลือดมช่วยอีกครึ่ง แล้วคิดค่าเกลือดมกับนายสถานีเต็มราคา
        effects: { hp: -1, alignment: { moral: 1 }, flags: [opened_a_porters_breath] }
    - id: vouch_for_him
      label: บอกนายสถานีเสียงดังว่าเขาไม่ได้เมา แล้วยืนกันไม่ให้ใครลาก
      text: |
        นายสถานีถามว่า{name}เป็นใคร {name}บอกว่าเรียนสำนักรักษาของสถาบันมา นายสถานีถอยไปครึ่งก้าว คนที่จะลากก็ถอยตาม {name}จับเขานอนตะแคง คลายเสื้อ เปิดหน้าต่างโถงทุกบาน

        เขาหายใจได้ยาวขึ้นทีละน้อย พอรถออกไปแล้วเขาก็นั่งได้ ส้มที่กลิ้งไปทั่วโถงหายไปครึ่งลัง ไม่มีใครเห็นว่าใครเก็บ
      effects: { alignment: { moral: 1 }, flags: [vouched_for_a_porter] }
    - id: let_the_station_handle_it
      label: ปล่อยให้คนของสถานีจัดการ
      text: |
        คนของสถานีสองคนลากเขาออกไปทางประตูข้าง ส้นเท้าครูดพื้นเป็นทางยาว รถเข้าเทียบตรงเวลา คนในโถงขึ้นรถกันเป็นแถว

        ตอนรถออก{name}เห็นเขาจากหน้าต่าง นอนตะแคงอยู่บนกองกระสอบข้างโรงเก็บของ มีเด็กเก็บส้มคนหนึ่งนั่งพัดให้
      effects: { alignment: { moral: -1 }, flags: [let_the_station_drag_a_porter] }
    - id: lamp_on_his_chest
      label: เปิดตะเกียงห้อยคอ ส่องดูว่าน้ำค้างดาวเข้าไปถึงไหนแล้ว
      requires: { item: bedside_dew_lamp }
      text: |
        ใต้แสงตะเกียง จุดแก้วเล็กกว่าเล็บสามจุดเรืองขึ้นที่หน้าอกเขา เรียงกันตามแนวที่ลังหลอดกดทับทุกเช้า ปอดของเขายังไม่เป็นแก้ว แต่ใกล้ {name}รู้ว่าต้องกดตรงไหนให้ลมผ่าน กดแล้วเขาหายใจยาวได้ในครั้งเดียว

        เขาลุกนั่งได้ ถามว่าเห็นอะไร {name}บอกตามจริง เขาไม่ขอบคุณ เอาเสื้อปิดอกแล้วไปแบกลังส้มที่เหลือต่อ มือยังสั่นอยู่ ตะเกียงที่คอของ{name}เหลือน้ำค้างดาวอีกครึ่งหลอด
      effects: { alignment: { moral: 1 }, flags: [lit_the_glass_on_a_porter] }

# ---------- สำนักสงคราม ----------

- id: adult.institute_war_advisor
  stage: adult
  scene: fort
  weight: 20
  course: { id: institute, year: 3, track: war }
  text: |
    ห้องแผนที่ของสำนักสงครามอยู่ชั้นบนสุดของตึกริมลานฝึก โต๊ะยาวสองตัว บนโต๊ะกางแผนที่เวนทราส ไม่ใช่แผนที่ที่ขายในตลาด ทุกบันไดมีเลข ทุกร้านขนมปังมีวงกลมสีแดง ทุกบ่อน้ำมีกากบาท

    เดเวค รอสตัน ให้{name}ลงหมึกย่านโรงกลั่น หัวบันไดทุกหัว ร้านขนมปังทุกร้าน ทางที่รถเข็นสวนกันได้กับทางที่สวนไม่ได้ ข้อนิ้วเหล็กของแขนซ้ายเคาะขอบโต๊ะตามจังหวะที่เขานับเลขบันได เอดริคนั่งอีกฝั่งโต๊ะ ลงหมึกย่านวิหาร ลายมือสวยที่สุดในห้อง

    บนโต๊ะไม่มีแผ่นไหนเป็นฮอร์ดุน ไม่มีแผ่นไหนเป็นชายแดน ทุกแผ่นคือเวนทราส ย่านต่อย่าน มุมล่างขวาของทุกแผ่นมีตราราชสำนัก หัวกระดาษเขียนตัวเล็กว่า สำหรับปีที่เมืองลุก
  choices:
    - id: ink_the_district
      label: ลงหมึกต่อจนครบย่าน
      check: { stat: INT, dc: 12 }
      effects: { flags: [saw_the_war_secret, kept_the_war_secret] }
      success:
        text: |
          {name}ลงหมึกครบในเก้าวัน เดเวคนับหัวบันไดตามทีละหัว ข้อนิ้วเหล็กหยุดที่บันไดหลังโรงกลั่นที่เจ็ด เขาบอกว่าบันไดนั้นมีสองหัว หัวที่สองอยู่หลังกองถ่าน คนในย่านรู้ ใครไม่ใช่คนในย่านไม่รู้ {name}เติมหัวที่สองลงไป

          แผ่นนั้นเข้าตู้เหล็กพร้อมแผ่นของเอดริค ตู้ล็อกด้วยกุญแจสองดอก ดอกหนึ่งอยู่ที่เดเวค อีกดอกอยู่ที่นายทหารของราชสำนักที่มาเปิดตู้เดือนละครั้ง
        effects: { stats: { INT: 1 }, flags: [inked_the_refinery_district] }
      failure:
        text: |
          เดเวคนับหัวบันไดบนแผ่นของ{name}แล้วขาดไปสี่ เขาส่ง{name}ลงไปนับเองในย่านโรงกลั่นตอนกลางคืน ไม่ให้ถือตะเกียง ทหารต้องเดินมืดได้

          บันไดหลังโรงกลั่นที่เจ็ดมีสองหัว หัวที่สองอยู่หลังกองถ่าน {name}เจอหัวนั้นด้วยข้อเท้าที่พลิก กลับมาเติมลงแผ่นตอนสาง เดินกะเผลกไปอีกครึ่งเดือน
        effects: { hp: -1, flags: [inked_the_refinery_district] }
    - id: tell_the_bread_runner
      label: บอกเด็กส่งขนมปังของหนูท่าว่าราชสำนักนับหัวบันไดในย่าน
      text: |
        เด็กส่งขนมปังคนนั้นวิ่งให้หนูท่ามาตั้งแต่ยังสูงไม่ถึงโต๊ะ เขาฟังแล้วถามคำเดียว หัวไหนบ้าง {name}บอกเท่าที่จำได้ เขาวิ่งออกไปก่อนจะได้ค่าขนมปังจาก{name}

        สองเดือนต่อมา บันไดหลังโรงกลั่นสามแห่งมีประตูเหล็กติดใหม่ที่หัวบันได ลงกลอนจากข้างใน เดเวคให้{name}แก้แผ่นของย่านโรงกลั่นสามจุด แล้วถามว่าประตูพวกนี้มาจากไหน
      effects:
        reputation: { dock_rats: 1, crown: -1 }
        alignment: { law: -1 }
        flags: [saw_the_war_secret, told_the_war_secret, told_the_bread_runner_of_the_maps]
    - id: put_down_the_pen
      label: วางปากกาไว้บนแผ่นย่านโรงกลั่น แล้วเดินลงจากห้องแผนที่
      text: |
        เดเวคไม่ห้าม ข้อนิ้วเหล็กยังเคาะขอบโต๊ะต่อในจังหวะเดิม เอดริคเงยหน้าขึ้นครึ่งหนึ่ง แล้วก้มลงลงหมึกหัวบันไดถัดไปของย่านวิหาร

        {name}ออกจากสถาบันก่อนสิ้นเดือน ค่ำวันแรกนอกกำแพง{name}เดินผ่านย่านโรงกลั่นแล้วนับหัวบันไดในใจโดยไม่ได้ตั้งใจ ได้ครบทุกหัว รวมหัวที่สองหลังกองถ่าน
      effects:
        stats: { WIS: 1 }
        course: { leave: true }
        mark: ออกจากสถาบัน
        flags: [saw_the_war_secret, kept_the_war_secret, institute_left, left_institute_over_war]

- id: adult.institute_war_field
  stage: adult
  scene: fort
  weight: 20
  course: { id: institute, year: 4, track: war }
  text: |
    นายสิบลอริคเสียงแหบเพราะตะโกนมายี่สิบปี เขาไม่เรียกนักเรียนสถาบันว่านักเวท เรียกว่าพวกกระดาษ ฤดูนี้ค่ายทหารรักษาเมืองนอกกำแพงตะวันตกได้พวกกระดาษมาสองคน {name}กับเอดริค

    สำนักสอนเวทของสนามรบ ม่านควัน เสียงที่ทำให้ม้าตื่น พื้นที่ลื่นใต้เท้าข้าศึก ลานของลอริคฝึกอย่างเดียวทั้งฤดู ไล่คนออกจากลานตลาด ทหารสามสิบคนตั้งแถวโล่ ทหารอีกสามสิบคนเล่นเป็นชาวบ้าน ถือไม้กวาดกับตะกร้า

    วันที่ห้า ลอริคให้พวกกระดาษช่วยแถวโล่ ใช้อะไรก็ได้ที่สำนักสอน ขอแค่ให้ลานโล่งก่อนระฆังครั้งที่สาม เอดริคเดินไปทางฝั่งชาวบ้านก่อนจะมีใครสั่ง
  choices:
    - id: smoke_the_yard
      label: ร่ายม่านควันลงกลางลาน
      check: { stat: INT, dc: 12 }
      success:
        text: |
          ควันลงหนาเท่ากำแพง ทหารฝั่งชาวบ้านไอแล้วถอยออกนอกลานเองทีละกลุ่ม ลานโล่งก่อนระฆังครั้งที่สอง ลอริคจดเวลาลงสมุด แล้วให้{name}เขียนวิธีร่ายลงกระดาษหนึ่งแผ่นให้ค่ายเก็บไว้

          ตอนเย็นทหารคนหนึ่งในฝั่งชาวบ้านมาหา ตาแดงทั้งสองข้าง ถามว่าควันแบบนั้นถ้าเป็นลานตลาดจริงจะไปออกทางไหน
        effects: { stats: { INT: 1 }, flags: [smoked_the_drill_yard] }
      failure:
        text: |
          ลมเปลี่ยนทางตอนควันลงได้ครึ่งลาน ม่านควันม้วนกลับเข้าแถวโล่ ทหารฝั่งโล่ไอจนแถวแตก ฝั่งชาวบ้านเดินเข้ามายึดกลางลานได้สบาย {name}ไอจนเจ็บซี่โครงไปสามวัน

          ลอริคจดเวลาลงสมุดเหมือนเดิม ข้างเวลาเขียนว่า ลม
        effects: { hp: -1, flags: [smoked_the_shield_line] }
    - id: hold_a_shield
      label: ถอดเสื้อคลุม ถือโล่ยืนในแถว
      text: |
        โล่ของค่ายหนักกว่าที่{name}คิดสองเท่า แถวดันเข้าไปทีละก้าว ฝั่งชาวบ้านดันกลับด้วยไม้กวาดกับไหล่ ขอบโล่กระแทกกระดูกไหปลาร้าของ{name}ทุกครั้งที่แถวหยุด

        ลานโล่งตอนระฆังครั้งที่สาม ลอริคเดินผ่านหลังแถวแล้วตบโล่ของ{name}หนึ่งที บอกคนข้างๆ ว่าพวกกระดาษคนนี้ยืนได้ ไหปลาร้าของ{name}ช้ำเป็นรอยโค้งเท่าขอบโล่ไปครึ่งฤดู
      effects: { hp: -1, stats: { STR: 1 }, flags: [held_a_shield_in_the_line] }
    - id: follow_edric
      label: ตามเอดริคไปคุยกับฝั่งชาวบ้าน
      text: |
        เอดริคไม่ได้สั่งใคร เขาเดินไปหาคนที่ถือตะกร้า ถามว่าตะกร้ามีอะไร คนถือเล่นตามว่ามีไข่ เอดริคบอกว่าแถวโล่มาแล้ว ไข่จะแตกหมด ไปทางประตูข้างดีกว่า {name}ช่วยชี้ประตู ชาวบ้านฝั่งนั้นเดินออกไปทีละกลุ่ม ถือตะกร้าไว้แนบอก

        ลานโล่งตอนระฆังครั้งที่สอง เร็วกว่าแถวโล่ทุกรอบในฤดูนั้น ลอริคไม่จดเวลานี้ลงสมุด บอกว่าวันจริงไม่มีใครมีเวลาคุย เอดริคยิ้มให้{name}อยู่ข้างหลังเขา
      effects:
        alignment: { moral: 1 }
        people: [{ id: cohort_edric, closeness: 1 }]
        flags: [talked_the_drill_yard_empty]

- id: adult.institute_war_thesis
  stage: adult
  scene: fort
  weight: 20
  course: { id: institute, year: 5, track: war }
  text: |
    หน้าแข้งทั้งสองข้างของ{name}เขียวเป็นจ้ำมาสามสัปดาห์ จ้ำละลูกตุ้ม วิทยานิพนธ์ของสำนักสงครามต้องพาออกสนามได้ ของ{name}คือผ้าคลุมสัญญาณ ด้านนอกสีหม่นเหมือนผ้าคลุมเดินทางทุกผืน ซับในเป็นผ้าแดงสลับขาว ชายผ้าถ่วงตุ้มเหล็กดำสิบสองลูก สะบัดครั้งเดียวผ้าต้องกางเป็นธงเต็มผืนให้คนอีกฝั่งลานเห็น

    สอบที่ลานฝึก ผู้สอบยืนอีกฝั่งลาน เดเวคยืนกลางลาน ผ้าต้องกางสามครั้งติดกันโดยไม่พันตัวคนสะบัด ตุ้มสิบสองลูกต้องหนักพอให้ผ้ากางได้แม้ลมพัดสวน

    นายทหารจากค่ายรักษาเมืองมายืนดูซ้อมสองวันก่อนสอบ เขาบอกเดเวคว่าค่ายอยากซื้อผืนแรกกับแบบ ตัดให้นายสิบทุกคน เขาว่าราชสำนักจ่ายให้สำนักสงครามอยู่แล้ว จะจ่ายเพิ่มอีกหน่อยก็ไม่เป็นไร
  choices:
    - id: three_sweeps
      label: สะบัดสามครั้งติดกันต่อหน้าผู้สอบ
      check: { stat: STR, dc: 13 }
      success:
        text: |
          ครั้งแรกผ้ากางเป็นแดงเต็มผืน ครั้งที่สองพลิกเป็นขาว ครั้งที่สามกลับเป็นแดง ตุ้มเหล็กสิบสองลูกตกลงข้างเท้า{name}เรียงเป็นวง ไม่โดนหน้าแข้งสักลูก ผู้สอบอีกฝั่งลานยกมือขึ้นตอบทั้งสามครั้ง

          เดเวคลงชื่อรับ เขาให้{name}สะบัดครั้งที่สี่ให้ดูอีกครั้ง ไม่ใช่สำหรับการสอบ ข้อนิ้วเหล็กเคาะต้นขาตามจังหวะตุ้มที่หมุนรอบตัว
        effects: { stats: { STR: 1 }, items: [field_signal_cloak], flags: [thesis_war] }
      failure:
        text: |
          ครั้งที่สองผ้าพันแขนขวา ตุ้มเหล็กสามลูกฟาดหน้าแข้งซ้ายเรียงกันเหมือนนับเลข {name}ล้มลงกลางลาน ครั้งที่สามสะบัดจากพื้นได้ครึ่งผืน

          งานผ่าน หมายเหตุใต้ชื่อเขียนว่า ผ้าดี มือยังไม่ถึง ผ้าผืนนั้นสำนักพับเก็บไว้ในห้องแผนที่ ใต้ตู้เหล็ก
        effects: { hp: -2, flags: [thesis_war] }
    - id: add_two_weights
      label: เย็บตุ้มเพิ่มอีกสองลูก ให้ผ้ากางช้าลงแต่ไม่พลาด
      text: |
        ตุ้มสิบสี่ลูกทำให้ผ้ากางช้าลงครึ่งจังหวะ แต่ไม่พันตัวสักครั้ง วันสอบ{name}สะบัดครบสามครั้ง ผู้สอบอีกฝั่งลานยกมือตอบช้ากว่าเดิมครึ่งจังหวะเหมือนกัน

        เดเวคลงชื่อรับ ใต้ชื่อเขียนว่า ช้าแต่อยู่ครบ ตอนส่งผ้าคืน{name}แอบแกะตุ้มสองลูกนั้นออก ผ้าทั้งผืนเบาขึ้นทันตา
      effects: { items: [field_signal_cloak], flags: [thesis_war] }
    - id: sell_to_the_garrison
      label: ขายผืนแรกกับแบบให้ค่ายรักษาเมือง
      text: |
        นายทหารจ่ายสี่เหรียญ แบบเข้าแฟ้มของค่าย ทะเบียนของสถาบันจดชื่อ{name}ไว้ในช่องผู้คิดแบบ ไม่ใช่ช่องผู้ใช้ อาจารย์สามคนสอบจากผืนที่ยืมคืนมาจากค่ายหนึ่งบ่าย

        ฤดูต่อมานายสิบทุกคนในค่ายรักษาเมืองมีผ้าคลุมสีหม่นซับแดงขาว ซ้อมสะบัดกันที่ลานทุกเช้า ลานนั้นมองเห็นได้จากหัวบันไดหลายหัวในย่านโรงกลั่น
      effects: { gold: 4, reputation: { crown: 1 }, flags: [thesis_war, sold_the_cloak_to_the_garrison] }

- id: adult.school_war_comes_due
  stage: adult
  scene: tavern
  weight: 25
  when:
    age: [26, 45]
    flags: [saw_the_war_secret]
    not_flags: [institute_student]
  text: |
    คนเดินข่าวในโรงเตี๊ยมเล่าเรื่องคืนที่ย่านโรงกลั่นของเวนทราสลุก คนงานจะลงมาที่ถนน แต่ทหารรักษาเมืองยืนอยู่ที่หัวบันไดทุกหัวก่อนแล้ว ร้านขนมปังทุกร้านมีทหารสองคน บ่อน้ำทุกบ่อมีคนเฝ้า ย่านทั้งย่านเงียบลงก่อนสาง คนในย่านบอกว่าทหารรู้ทางในย่านดีกว่าคนเกิดในย่าน คนฟังหัวเราะ คนเดินข่าวไม่หัวเราะ

    คืนเดียวกันมีชายของราชสำนักนั่งรอ{name}อยู่ที่โต๊ะมุมห้อง เสื้อเรียบ รองเท้าเปื้อนฝุ่นทางไกล ตรงหน้าเขามีสมุดรายชื่อคนที่เคยนั่งในห้องแผนที่ของสำนักสงคราม ชื่อของ{name}อยู่ในนั้น ข้างชื่อมีคำว่าย่านโรงกลั่น

    เขาขอให้{name}ลงชื่ออีกครั้ง ใต้ข้อความสั้นๆ ว่าห้องนั้นไม่มี
  choices:
    - id: sign_the_silence
      label: ลงชื่อ
      requires: { flag: kept_the_war_secret }
      text: |
        ชายของราชสำนักเป่าหมึกให้แห้ง วางเหรียญสองเหรียญข้างแก้วของ{name} บอกว่าเป็นค่าเหล้าคืนนี้ แล้วชี้ชื่อข้างบนชื่อ{name}ให้ดู ลายมือสวยที่สุดในหน้า ลงไว้ก่อนแล้ว

        ก่อนเขาลุก{name}ถามว่าคืนนั้นมีคนเจ็บกี่คน เขาตอบว่าไม่มีในสมุด
      effects: { gold: 2, reputation: { crown: 1 }, flags: [signed_the_map_room_silence] }
    - id: name_the_iron_doors
      label: บอกเขาว่าหนูท่ารู้เรื่องหัวบันไดมาตั้งแต่ตอนนั้นแล้ว
      requires: { flag: told_the_war_secret }
      text: |
        ชายของราชสำนักปิดสมุด ถามว่า{name}รู้ได้อย่างไรว่าหนูท่ารู้ {name}บอกว่าเพราะเป็นคนบอก เขาเก็บสมุดใส่กระเป๋า จ่ายค่าเหล้าของตัวเอง แล้วออกไป

        คนเดินข่าวที่ยังนั่งอยู่หน้าเตาเล่าต่ออีกท่อน ว่าคืนนั้นมีหัวบันไดสามหัวหลังโรงกลั่นที่ทหารขึ้นไปไม่ได้ เพราะมีประตูเหล็กลงกลอนจากข้างใน
      effects: { reputation: { crown: -1, dock_rats: 1 }, flags: [named_the_iron_doors] }
    - id: refuse_to_sign
      label: ไม่ลงชื่อ ดันสมุดคืนไปฝั่งเขา
      text: |
        เขาไม่เถียง พลิกสมุดไปหน้าถัดไป ข้างชื่อ{name}เขาขีดเส้นสั้นๆ เส้นหนึ่ง เหมือนเส้นที่ขีดไว้แล้วข้างชื่ออื่นอีกสี่ชื่อในหน้านั้น

        ตอนออกจากโรงเตี๊ยม{name}นับหัวบันไดของซอยหลังร้านโดยไม่ได้ตั้งใจ แล้วนับคนที่ยืนอยู่บนหัวบันไดด้วย คืนนั้นไม่มีใคร
      effects: { alignment: { law: -1 }, flags: [refused_the_map_room_silence] }
    - id: ask_who_was_hurt
      label: ถามเขาตรงๆ ว่าคืนนั้นมีคนเจ็บกี่คน ก่อนจะคุยเรื่องอื่น
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เขาตอบหลังเงียบไปหนึ่งจิบ สิบเอ็ดคน หัวแตกเก้า ขาหักสอง ทั้งหมดเป็นคนงาน ทหารไม่มีใครเจ็บ เพราะไม่มีใครต้องวิ่งหาทาง

          เขาพับสมุดโดยไม่ได้ขอให้ลงชื่ออีก วางเหรียญค่าเหล้าไว้ให้ทั้งโต๊ะ ตัวเลขสิบเอ็ดอยู่กับ{name}ไปจนเช้า
        effects: { stats: { CHA: 1 }, flags: [learned_who_was_hurt_that_night] }
      failure:
        text: |
          เขาบอกว่าคำถามแบบนี้ไม่มีในสมุด แล้วถามกลับว่า{name}ถามแทนใคร เสียงของเขาเบาลงจนคนโต๊ะข้างๆ หยุดคุย

          {name}ไม่ได้ลงชื่อ เขาไม่ได้ขอซ้ำ แต่จดอะไรบางอย่างลงหลังสมุด ตัวเล็กเกินกว่าจะอ่านจากอีกฝั่งโต๊ะ
        effects: { reputation: { crown: -1 }, flags: [refused_the_map_room_silence] }

- id: adult.school_war_craft
  stage: adult
  scene: market
  weight: 25
  when:
    age: [23, 50]
    flags: [school_war, institute_graduate]
  text: |
    ไฟไหม้ร้านน้ำมันตะเกียงที่ปากซอย ควันดำม้วนเข้ามาในตลาด คนทั้งตลาดวิ่งไปทางเดียวกัน ทางบันไดหินแคบที่ลงไปถนนล่าง บันไดกว้างพอให้คนเดินสวนกันสองคน คนวิ่งลงไปพร้อมกันเป็นสิบ

    คนข้างหน้าสะดุดล้มกลางบันได คนข้างหลังยังดันลงมา มีเสียงเด็กร้องอยู่ใต้กองคน ทางซ้ายของ{name}มีซอยอีกซอยออกไปถนนล่างได้เหมือนกัน ควันยังไม่เข้า ไม่มีใครเห็น เพราะทุกคนมองแต่หลังคนข้างหน้า
  choices:
    - id: block_the_stair_head
      label: ยืนขวางหัวบันได กันคนข้างบนไม่ให้ลงต่อ
      check: { stat: STR, dc: 13 }
      success:
        text: |
          {name}กางแขนจับราวทั้งสองข้าง รับแรงดันของคนข้างบนไว้ด้วยหลัง นับหนึ่งถึงสิบแบบที่ลานฝึกนับ คนกลางบันไดได้ที่ว่างพอลุกขึ้น เด็กใต้กองคนคลานออกมาได้ทั้งตัว

          คนข้างบนที่ดันอยู่หยุดดันเมื่อได้ยินเสียงนับ แล้วเริ่มนับตาม บันไดว่างทีละขั้นจนถึงขั้นสุดท้าย
        effects: { stats: { STR: 1 }, alignment: { moral: 1 }, flags: [held_a_stair_head_in_a_fire] }
      failure:
        text: |
          แรงดันจากข้างบนมากกว่าแขนสองข้าง {name}ล้มลงไปทับคนข้างล่าง ข้อศอกกระแทกขอบบันไดหิน ซี่โครงด้านขวาร้าว แต่ร่างของ{name}กลายเป็นกำแพงให้เด็กที่อยู่ใต้กองคน คนข้างบนต้องก้าวข้าม ไม่ได้เหยียบ

          ไฟดับก่อนเที่ยง คนเก็บกวาดบันไดพบรองเท้าข้างเดียวสิบสามข้าง ไม่มีคู่ไหนครบ
        effects: { hp: -2, alignment: { moral: 1 }, flags: [held_a_stair_head_in_a_fire] }
    - id: open_the_side_alley
      label: ปีนขึ้นแผงผัก ตะโกนชี้ซอยทางซ้าย
      text: |
        เสียงของ{name}ดังกว่าเสียงไฟพอให้คนท้ายแถวหันมา คนท้ายแถวไปทางซอย คนกลางแถวตามไปเพราะเห็นหลังคนท้ายแถว แรงดันบนบันไดเบาลงจนคนที่ล้มลุกขึ้นได้เอง

        ไฟดับก่อนเที่ยง เจ้าของแผงผักมาขอค่าแผงที่ยุบไปกับเท้าของ{name} ไม่ได้ขอเต็มราคา
      effects: { alignment: { moral: 1 }, flags: [called_the_crowd_to_the_side_alley] }
    - id: pull_out_two
      label: ลงไปดึงคนที่ใกล้มือที่สุดออกมาก่อนสองคน
      text: |
        {name}ดึงหญิงแก่คนหนึ่งออกมาทางราว แล้วดึงเด็กผู้ชายที่ขาติดซี่ราวตามออกมาอีกคน บันไดยังแน่นเหมือนเดิม คนยังดันลงมาจากข้างบน

        ไฟดับก่อนเที่ยง หญิงแก่คนนั้นตามหา{name}จนเจอในวันต่อมา เอาขนมปังมาให้ก้อนหนึ่ง ถามว่าเห็นหลานสาวเธอบ้างไหม ตัวเท่านี้ ผมเปีย
      effects: { flags: [pulled_two_from_the_stair] }
    - id: snap_the_cloak
      label: ปีนขึ้นแผงผัก สะบัดผ้าคลุมสัญญาณให้กางเป็นแดงเหนือหัวคน
      requires: { item: field_signal_cloak }
      text: |
        ผ้ากางเป็นแดงเต็มผืนเหนือควัน คนในตลาดเงยหน้าขึ้นพร้อมกัน {name}พลิกเป็นขาว ชี้ไปทางซอยซ้าย คนท้ายแถวไปก่อน คนกลางแถวตาม แรงดันบนบันไดหายไปในสามลมหายใจ

        ไฟดับก่อนเที่ยง ทั้งตลาดรู้ว่าวันนั้นใครยืนบนแผงผัก ทหารรักษาเมืองที่มาถึงทีหลังก็รู้ หัวหน้าของพวกเขาถามชื่อ{name} แล้วจดลงสมุด
      effects: { alignment: { moral: 1 }, flags: [signalled_a_crowd_out_of_a_fire] }
