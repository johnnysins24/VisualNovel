# ยุคดาวเร่ง ชุด B ไฟล์ 4: การปะทะของครึ่งแรกของยุค (8 เรื่อง ปี 342 ถึง 360) ไม่มี choices ตัวเลขของศัตรูอยู่ใน content/foes.yaml
# ทุกวัย 3 เรื่อง (แมลงหึ่ง คนแก้วออกจากบ้านปิดม่าน ถุงมือขาวที่ประตูรั้ว) ไม่เอาถึงตาย สามจังหวะ วิธีที่คนแก่ทำได้ (ควัน แสง เสียงดัง เกลือ ประตูปิด)
# ที่เหลือ [16, 64] หรือ [16, 59] สองเรื่องเอาถึงตาย (แก้วเดิน หุ่นยาม) มีทางหนีทุกจังหวะ ตาลอยกับตาร้อยดวงไม่เอาถึงตายตามชนิดของศัตรู
# คนเสื้อคลุมขาวกลางดึกเปิดทุกวัยและไม่เอาถึงตาย (มาค้นบ้าน ไม่ได้มาฆ่าเจ้าของบ้าน) ปีของมันมีแค่ 355 ถึง 356 น้ำหนักจึงสูง (60) ไม่อย่างนั้นคนที่เกิดปี 270 ถึง 300 ไม่มีใครได้เจอ
# ศัตรูฝ่ายดาวมี not_traits: [curse_brand] ทุกเรื่อง ผู้ฟังดาวเป็นคน จึงเปิดให้คนมีตราเจอได้ ทุกวิธีในฉากนั้นเขียนข้อความตอนพลาดเอง ไม่ให้ประโยคประจำตัวที่มีเสียงหึ่งออกมากับคนที่ไม่ได้ยิน
# แรงใจกับจังหวะ: สามจังหวะแรงใจ 2 (ราว 80%) กับฉากทุกวัยและตาลอย · สี่จังหวะแรงใจ 3 (ราว 60%) กับสี่ฉากที่เหลือ
# ของที่คิดขึ้นในไฟล์นี้: เพลงเลิกกะของคนโรงกลั่นกับการเคาะปิ่นโต · ตะเกียงชอล์กที่คนเสื้อขาววาดไว้ด้านในวงกบประตูบ้านที่ค้นแล้ว (ตามคัมภีร์ชุดนี้)
#   แผ่นคำสั่งทองเหลืองของหุ่นยามที่รูไหนเปิดคือคำสั่งไหนใช้

# ---------- ทุกวัย ----------
- id: adult.enc_era_lamp_moths
  stage: adult
  weight: 6
  once: false
  time: night
  when:
    age: [16, 130]
    year: [342, 360]
    not_traits: [curse_brand]
  text: |
    ตะเกียงฟ้าทำให้กลางคืนสว่างถึงลานบ้าน และพาแขกที่ไม่ได้เชิญมาด้วย ฝูงแมลงหึ่งมาเป็นระลอกในคืนที่ไม่มีลม ตัวเล็กเท่าเมล็ดข้าว ปีกใส บินวนตะเกียงเป็นวงแน่นจนแสงขุ่น เสียงของมันไม่ได้ดังที่หู ดังที่ฟัน

    บ้านที่มีตะเกียงฟ้ารู้วิธีกันหมดแล้ว ฟางชื้นหนึ่งกำในกระถางใต้ตะเกียง ผ้าเปียกหนึ่งผืนพาดพนักเก้าอี้ ประตูที่ปิดได้ทันเวลา คืนนี้ฝูงมาเร็วกว่าที่{name}คิด
  encounter:
    foe: hum_moth
    name: ฝูงแมลงหึ่งที่ตะเกียง
    deadly: false
    beats:
      - text: ฝูงแรกเกาะโป๊ะตะเกียงจนแสงเป็นสีเทา ตัวที่หาที่เกาะไม่ได้บินวนออกมาหาหน้าคนที่อยู่ใกล้ที่สุด
        moves:
          - id: moth_straw
            label: จุดฟางชื้นในกระถางใต้ตะเกียง
            kind: item
            stat: DEX
            tags: [smoke]
            success: ควันขาวลอยขึ้นห่อโป๊ะตะเกียง ฝูงแตกออกเป็นสองก้อน เสียงหึ่งเพี้ยนไปคนละเสียง
          - id: moth_sheet
            label: เอาผ้าเปียกคลุมตะเกียงทั้งดวง
            kind: guard
          - id: moth_broom
            label: เอาไม้กวาดปัดฝูงออกจากโป๊ะ
            kind: attack
          - id: moth_door
            label: ถอยเข้าบ้าน ปิดประตู
            kind: flee
      - text: ฝูงย้ายจากตะเกียงมาที่คน มุดเข้าแขนเสื้อ เกาะคอเสื้อ เสียงหึ่งสั่นเข้าไปในกราม
        answer: guard
        moves:
          - id: moth_cover
            label: เอาผ้าคลุมหัว ยืนนิ่ง ปล่อยให้มันหาทางออกเอง
            kind: guard
          - id: moth_candle
            label: จุดเทียนถือไว้ข้างหน้า ค่อยๆ ต้อนฝูงไปทางรั้ว
            kind: item
            stat: DEX
            tags: [fire]
          - id: moth_shake
            label: สะบัดเสื้อ ตบตามตัวให้หลุด
            kind: quick
          - id: moth_door2
            label: ดึงประตูปิด แมลงติดตัวเข้าไปด้วยก็ช่าง
            kind: flee
      - text: ฝูงกลับไปรวมที่ตะเกียงอีกครั้ง หนากว่าเดิม ตะเกียงทั้งดวงสั่นอยู่บนตะขอ
        answer: item
        moves:
          - id: moth_carry
            label: ปลดตะเกียงไปแขวนที่เสารั้ว ให้ฝูงตามไปไกลบ้าน
            kind: quick
          - id: moth_douse
            label: หมุนไส้ดับตะเกียง แล้วยืนนิ่งในความมืด
            kind: guard
          - id: moth_stove
            label: โยนฟางชื้นลงเตาให้ควันออกปล่องย้อนลงมาทางตะเกียง
            kind: item
            stat: WIS
            tags: [smoke]
          - id: moth_door3
            label: เข้าบ้าน ปล่อยตะเกียงไว้ให้มัน
            kind: flee
    win:
      text: |
        ฝูงแตกขึ้นฟ้าเป็นเส้นบางๆ เหมือนควันโดนลมพัด เสียงหึ่งในกรามจางไปเอง ใต้ตะเกียงมีปีกใสร่วงกองเท่ากำมือ

        เช้ามา{name}กวาดปีกใส่ถุงไปขายคนรับซื้อของเก่าที่ตลาด ได้หนึ่งเหรียญ เขาชั่งด้วยตาชั่งทอง
      effects: { gold: 1 }
    lose:
      text: |
        {name}ลืมตาขึ้นบนพื้นใต้ตะเกียง หูอื้อ ปากมีรสโลหะ ฝูงไปแล้ว ตะเกียงยังติด โป๊ะร้าวเป็นเส้นยาวจากขอบลงมาถึงฐาน

        โป๊ะใหม่ราคาเท่าน้ำค้างสองขวด
      effects: { gold: -1 }
    stalemate:
      text: |
        ลมพัดมาตอนใกล้รุ่ง ฝูงลอยตามลมไปทางรั้วถัดไปทั้งก้อน เสียงหึ่งย้ายไปกวนบ้านข้างๆ แทน

        สักพักได้ยินเพื่อนบ้านด่าตะเกียงของตัวเองดังข้ามรั้วมา
    flee:
      text: |
        {name}ปิดประตูทัน แมลงสามสี่ตัวที่ติดเข้ามาเกาะผนังไม่ขยับจนเช้า ข้างนอก ฝูงอยู่กับตะเกียงจนน้ำค้างหมดขวด แล้วก็ไปเอง

        เช้ามาต้องซื้อน้ำค้างขวดใหม่ก่อนกำหนด
      effects: { gold: -1 }

- id: adult.enc_era_out_of_the_curtained_house
  stage: adult
  weight: 12
  when:
    age: [16, 130]
    year: [345, 360]
    not_traits: [curse_brand]
  text: |
    บ้านหลังที่สามจากหัวซอยปิดม่านทุกบานมาตั้งแต่ต้นปี ทุกคนรู้ว่าทำไม ไม่มีใครเอ่ย คนในบ้านยังออกมาซื้อของ ยังทักทาย เพียงแต่ไม่มีใครเห็นแม่เฒ่าของบ้านนั้นอีก

    บ่ายนี้ประตูบ้านนั้นเปิดอยู่ คนในบ้านยังไม่กลับจากตลาด แม่เฒ่าเดินอยู่กลางซอย ผ้าคลุมไหล่ผืนเดิม เดินช้า มือข้างหนึ่งใสถึงข้อศอก ใต้ผ้าคลุมตรงอกมีแสงฟ้าเต้นช้าๆ นางหยุดตรงหน้า{name} ทักด้วยชื่อ แล้วบอกว่าเพิ่งกลับจากงานศพ

    งานศพของใคร นางไม่บอก นางเล่าว่าคนมาเยอะ ข้าวไม่พอ ฝนตกตอนเผา ทุกอย่างที่นางเล่ายังไม่เกิดขึ้น
  encounter:
    foe: glass_one
    name: แม่เฒ่าบ้านปิดม่าน
    morale: 2
    deadly: false
    beats:
      - text: แม่เฒ่ายื่นมือแก้วมาจับข้อมือ{name} เย็นเหมือนกระจกหน้าหนาว นางเล่าเรื่องงานศพต่อ ใครร้องไห้ก่อน ใครมาสาย ใครยืนผิดที่
        moves:
          - id: curtain_take_home
            label: จับมือนางไว้ บอกว่าจะพากลับบ้าน
            kind: talk
            parley: true
          - id: curtain_pail
            label: เคาะถังเหล็กหน้าบ้านข้างๆ ให้ดังที่สุด
            kind: item
            stat: DEX
            tags: [noise]
          - id: curtain_step_back
            label: ดึงมือออกช้าๆ ถอยเข้าหลังรั้วบ้านตัวเอง
            kind: guard
          - id: curtain_read
            label: ดูว่านางนับอะไรอยู่ระหว่างเล่า
            kind: read
            stat: WIS
            success: นางพับนิ้วของมือข้างที่ยังเป็นเนื้อไปทีละนิ้ว ทุกครั้งที่พับ มีรอยร้าวเล็กๆ ขึ้นที่นิ้วแก้วข้างที่จับ{name}อยู่ ตอนหมาบ้านตรงข้ามเห่า นางพับผิดนิ้ว แล้วต้องเริ่มใหม่
      - text: นางบีบข้อมือแน่นขึ้น เสียงเล่าเปลี่ยนเป็นนับ เหลืออีกเก้าวัน เหลืออีกแปดวัน นางไม่ได้บอกว่าเหลืออะไร
        answer: guard
        moves:
          - id: curtain_still
            label: ยืนนิ่ง ปล่อยให้นางบีบ ไม่ดิ้น
            kind: guard
          - id: curtain_salt
            label: กำเกลือจากกระเป๋าเสื้อโรยลงบนมือแก้ว
            kind: item
            stat: WIS
          - id: curtain_call
            label: ตะโกนเรียกคนบ้านนั้นให้กลับมา ดังจนทั้งซอยได้ยิน
            kind: talk
            tags: [noise]
          - id: curtain_door
            label: บิดมือหลุด เข้าบ้าน ปิดประตู
            kind: flee
      - text: คนในซอยเริ่มออกมายืนที่ประตูบ้านตัวเอง ไม่มีใครเข้ามาใกล้ แม่เฒ่าหันไปมองทีละบ้าน แล้วหันกลับมาบอก{name}ว่างานนั้นทุกบ้านในซอยก็ไป
        answer: talk
        moves:
          - id: curtain_walk
            label: จูงนางกลับบ้าน ช้าๆ ตามจังหวะเท้านาง
            kind: talk
            parley: true
          - id: curtain_pots
            label: ขอให้ทุกบ้านเคาะหม้อพร้อมกัน
            kind: item
            stat: CHA
            tags: [noise]
          - id: curtain_cane
            label: เอาไม้คานฟาดข้อมือแก้วให้ปล่อย
            kind: attack
            tags: [blunt]
          - id: curtain_door2
            label: ถอยเข้าบ้านคนที่ยืนดูอยู่ใกล้ที่สุด
            kind: flee
    win:
      text: |
        รอยร้าวแล่นขึ้นแขนแก้วจนถึงไหล่ นางปล่อยมือ ยกมือนั้นขึ้นดูเหมือนเพิ่งเห็นเป็นครั้งแรก แล้วเดินกลับเข้าบ้านเอง ปิดประตูเอง ม่านบานหน้ากระตุกครั้งหนึ่งแล้วนิ่ง

        เย็นนั้นลูกชายของนางมายืนที่ประตูบ้าน{name} ถือห่อขนมมาด้วย ขอโทษที่ทำให้เดือดร้อน ไม่ถามว่าแม่เขาเล่าอะไรให้ฟัง
      effects: { stats: { WIS: 1 }, flags: [sent_the_glass_one_back_inside] }
    lose:
      text: |
        {name}นั่งอยู่บนธรณีบ้านตัวเองตอนลูกสะใภ้บ้านนั้นกลับจากตลาด ข้อมือมีรอยนิ้วสีม่วงห้ารอย เย็นอยู่จนค่ำ แม่เฒ่ากลับเข้าบ้านไปแล้ว ไม่มีใครเห็นว่าตอนไหน

        คืนนั้น{name}นอนนับวันในใจ แล้วต้องลุกมาจุดตะเกียงเพื่อเลิกนับ
      effects: { flags: [held_by_the_glass_one] }
    stalemate:
      text: |
        คนในบ้านนั้นกลับจากตลาด ลูกสะใภ้วางตะกร้าลงกลางซอย เดินมาแกะนิ้วแก้วออกจากข้อมือ{name}ทีละนิ้ว พูดกับแม่ผัวเหมือนพูดกับเด็ก แล้วจูงเข้าบ้าน

        ม่านปิดทุกบานเหมือนเดิม ประตูลงกลอนจากข้างใน
      effects: { flags: [held_by_the_glass_one] }
    flee:
      text: |
        {name}ลงกลอนประตู ได้ยินเสียงนางนับต่ออยู่หน้าประตูอีกพักใหญ่ เสียงไม่ดัง ไม่ช้าลง แล้วมีเสียงฝีเท้าลูกสะใภ้วิ่งมาจากหัวซอย เสียงนับเงียบไป
    parley:
      text: |
        {name}จูงนางเดินกลับบ้าน ช้าๆ นางเล่าเรื่องงานศพไปตลอดทางจนถึงประตู ในบ้านมืด ม่านปิดทุกบาน มีเก้าอี้ตัวเดียวตั้งอยู่กลางห้อง หันหน้าเข้าผนัง {name}พานางไปนั่งตรงนั้น

        นางขอบใจ แล้วทัก{name}ด้วยชื่ออีกครั้ง เหมือนเพิ่งเจอกันวันนี้
      effects: { alignment: { moral: 1 }, flags: [walked_the_glass_one_home] }

- id: adult.enc_era_white_gloves_at_the_gate
  stage: adult
  weight: 6
  once: false
  when:
    age: [16, 130]
    year: [349, 360]
  text: |
    คนสวมถุงมือขาวมาตามรอบ สองคน ยืนที่ประตูรั้ว ไม่เปิดเอง รอให้คนในบ้านออกมา คนหนึ่งถือสมุด คนหนึ่งหิ้วตะกร้าใส่หลอดแก้ว ถามคำถามชุดเดิมเหมือนทุกรอบ เห็นบัตรหมึกน้ำเงินตกที่ไหนบ้างไหม เห็นสมุดปกผ้าที่ไม่ใช่ของบ้านนี้ไหม บ้านไหนในซอยเงียบผิดปกติตอนกลางคืน

    รอบนี้มีคำขอเพิ่มข้อหนึ่ง สมุดของคนในวงเล่มหนึ่งหายแถวนี้ ขอเข้าไปดูในลานบ้าน{name}สักครู่ ใต้ฟาง หลังเล้า ในราง ไม่แตะอะไรในตัวบ้าน คนถือสมุดยิ้มตลอดเวลาที่พูด
  encounter:
    foe: star_listener
    name: ถุงมือขาวที่ประตูรั้ว
    morale: 2
    deadly: false
    beats:
      - text: คนถือสมุดวางมือบนกลอนประตูรั้ว ยังไม่ยก รอคำตอบ
        moves:
          - id: gate_not_today
            label: บอกว่าวันนี้ไม่สะดวก ให้มาใหม่วันหลัง
            kind: talk
            parley: true
            failure: คนถือสมุดยิ้มกว้างขึ้น บอกว่าวันหลังคงไม่สะดวกกว่านี้ ปลายนิ้วถุงมือแตะกลอน กลอนเลื่อนออกครึ่งคืบโดยไม่มีใครดัน
          - id: gate_bar
            label: เอาไม้ขัดกลอนประตูรั้วจากด้านใน
            kind: guard
            failure: คนถือตะกร้าทำหลอดแก้วหลุดมือแตกตรงโคนประตู ไอเย็นลอดใต้ประตูเข้ามาถึงเท้า{name} ขาชาจนต้องปล่อยไม้
          - id: gate_pail
            label: เคาะถังเหล็กข้างรั้วให้ดัง
            kind: item
            stat: CON
            tags: [noise]
            failure: เคาะได้ไม่ถึงสามที คนถือตะกร้ายกนิ้วขึ้นแตะปาก ยิ้ม มือของ{name}หยุดเองกลางอากาศ
          - id: gate_read
            label: ดูให้ออกว่าเขามาหาอะไรจริงๆ
            kind: read
            stat: WIS
            failure: คนถือสมุดยิ้มแบบเดียวทุกประโยค อ่านอะไรไม่ออกเลย ยิ่งดูนาน{name}ยิ่งไม่แน่ใจว่าตัวเองพูดอะไรออกไปบ้าง
          - id: gate_go_in
            label: เดินเข้าบ้าน ไม่ตอบ
            kind: flee
            failure: "{name}ก้าวไปได้สองก้าว คนถือสมุดเรียกชื่อ{name}เบาๆ เสียงแบบที่ใช้เรียกเด็ก เท้า{name}หยุดเอง"
      - text: ประตูรั้วเปิดแล้ว คนถือตะกร้าเดินไปที่เล้า ก้มดูใต้ฟาง คนถือสมุดยืนกลางลาน จดอะไรลงสมุดทุกครั้งที่อีกคนก้ม
        answer: guard
        moves:
          - id: gate_follow
            label: เดินตามติด ยืนดูทุกที่ที่เขาก้ม
            kind: guard
            failure: หลอดแก้วหลอดหนึ่งหลุดจากตะกร้า แตกตรงเท้า{name} ไอเย็นขึ้นมาถึงเข่า ขาแข็งอยู่กับที่ ปล่อยให้เขาค้นต่อ
          - id: gate_neighbours
            label: ตะโกนเรียกเพื่อนบ้านมาดูด้วยกัน
            kind: talk
            tags: [noise]
            failure: เพื่อนบ้านโผล่หน้าออกมาสองบ้าน เห็นถุงมือขาวแล้วหดหัวกลับ ประตูปิดเบาๆ ทั้งสองบาน
          - id: gate_whose
            label: ถามว่าสมุดเล่มนั้นเป็นของใคร
            kind: talk
            failure: คนถือสมุดบอกชื่อมาชื่อหนึ่ง ชื่อของคนในซอยนี้เอง แล้วถามกลับว่า{name}รู้จักไหม สนิทกันแค่ไหน
          - id: gate_lock_in
            label: เข้าบ้าน ลงกลอน ปล่อยให้เขาค้นไป
            kind: flee
            failure: กลอนประตูบ้านเย็นจัดจนจับไม่อยู่ น้ำค้างเกาะเป็นเกล็ดบนเหล็ก {name}ยืนกำมือที่ชาอยู่หน้าประตูบ้านตัวเอง
      - text: เขาค้นจนทั่ว ไม่เจออะไร คนถือสมุดปิดสมุด ยิ้ม แล้วถามคำถามสุดท้ายของรอบนี้ บ้านนี้นอนกันกี่คน
        answer: talk
        moves:
          - id: gate_truth
            label: ตอบตามจริง
            kind: talk
            parley: true
            failure: "{name}ตอบ คนถือสมุดจดลงไป แล้วถามซ้ำอีกครั้งด้วยเสียงเท่าเดิม เหมือนคำตอบแรกยังไม่ใช่คำตอบ"
          - id: gate_lie
            label: ตอบเลขที่มากกว่าความจริงสองคน
            kind: talk
            failure: เขาจดเลขนั้นลงไปโดยไม่ถามต่อ แล้วไล่สายตาไปตามหน้าต่างห้องนอนทีละบาน ริมฝีปากขยับเบาๆ
          - id: gate_point_out
            label: ชี้ไปที่ประตูรั้ว บอกให้ออกไปได้แล้ว
            kind: guard
            failure: คนถือตะกร้าวางหลอดแก้วหลอดสุดท้ายลงบนเสารั้วเบาๆ ฝ้าขาวลามจากหลอดไปทั้งเสา {name}ถอยห่างจากรั้วเองโดยไม่รู้ตัว
          - id: gate_pot
            label: เคาะหม้อเหล็กข้างเตาจนเขาต้องยกมือปิดหู
            kind: item
            stat: STR
            tags: [noise]
            failure: หม้อเหล็กเย็นเฉียบจนมือติด {name}ปล่อยหม้อ เสียงหม้อตกพื้นดังแค่ครั้งเดียว
    win:
      text: |
        คนถือสมุดยกมือปิดหูข้างหนึ่ง รอยยิ้มหายไปครู่หนึ่งแล้วกลับมาเท่าเดิม ทั้งสองขอบคุณ ขอโทษที่รบกวน แล้วไปบ้านถัดไป

        รอบหน้าเขามายืนแค่หน้าประตูรั้ว ถามคำถามชุดเดิม ไม่ขอเข้า
      effects: { reputation: { star_listeners: -1 } }
    lose:
      text: |
        ขาของ{name}ชาไปถึงเย็น สองคนนั้นค้นลานจนทั่ว ไม่เจออะไร ขอบคุณอย่างสุภาพ ปิดประตูรั้วให้ด้วยก่อนไป

        ไก่ในเล้าโดนไอเย็นทั้งเล้า ไม่ไข่ไปทั้งสัปดาห์
      effects: { gold: -1 }
    stalemate:
      text: |
        ระฆังบอกเวลาดังมาแต่ไกล สองคนนั้นมองหน้ากัน ขอบคุณ แล้วไปตามรอบที่เหลือ สมุดเล่มนั้นยังหาไม่เจอ

        รอบหน้าเขาจะถามใหม่ตั้งแต่ข้อแรก
    flee:
      text: |
        {name}อยู่ในบ้าน ลงกลอน ได้ยินเสียงฟางขยับในเล้า เสียงฝาถังเปิดปิด แล้วเสียงประตูรั้วปิดเบาๆ

        เช้ามาลานบ้านเรียบร้อยกว่าที่{name}เคยเก็บเอง ฟางเรียงเป็นตั้ง ถังคว่ำเรียงแถว
    parley:
      text: |
        คนถือสมุดจดอะไรลงไปหนึ่งบรรทัด ขอบคุณ ขอโทษที่รบกวน แล้ววางเหรียญค่ารบกวนลงบนฝ่ามือ{name}ด้วยมือที่สวมถุงมือ เหรียญเย็นจนเกาะฝ้า

        ทั้งสองไปบ้านถัดไป ปิดประตูรั้วให้อย่างดี
      effects: { gold: 1 }

# ---------- วัยทำงานและวัยกลางคน ----------
- id: adult.enc_era_eye_in_the_rafters
  stage: adult
  weight: 12
  scene: home
  time: night
  when:
    age: [16, 64]
    year: [344, 360]
    not_traits: [curse_brand]
  text: |
    ผ้าดิบที่ตอกปิดใต้ขื่อห้องนอนมีไว้กันฝุ่นหลังคาร่วงลงหน้า ตอกไว้หลายหน้าหนาวแล้ว คืนนี้ผ้าตรงกลางห้องโป่งลงมาเป็นวงเท่าถาด แล้วยุบ แล้วโป่งอีก ช้าๆ เหมือนมีอะไรหายใจอยู่ข้างบน

    ตะปูตัวหนึ่งที่มุมผ้าหลุดลงมากระทบพื้นกระดาน เสียงเล็กนิดเดียว {name}ตื่นเพราะเสียงนั้น แล้วไม่กล้าเงยหน้า ยังไม่รู้ด้วยซ้ำว่าเพราะอะไร
  encounter:
    foe: float_eye
    name: ตาลอยใต้ขื่อ
    beats:
      - text: ผ้ามุมที่ตะปูหลุดหย่อนลงมาเป็นช่อง ข้างในมืด แล้วมีอะไรกลมๆ สีซีดลอยลงมาถึงขอบผ้า หยุดตรงนั้น ไม่กะพริบ
        moves:
          - id: rafter_bowl
            label: จุดใบไม้แห้งในชามดิน พ่นควันขึ้นไปทางขื่อ
            kind: item
            stat: DEX
            tags: [smoke]
          - id: rafter_blanket
            label: ดึงผ้าห่มคลุมหัว นอนนิ่ง
            kind: guard
          - id: rafter_lamp
            label: จุดตะเกียงยกส่องขึ้นไป
            kind: item
            stat: WIS
            tags: [light]
          - id: rafter_talk
            label: พูดกับมันดีๆ ขอให้กลับขึ้นไป
            kind: talk
            failure: เสียงของ{name}ไปไม่ถึงครึ่งห้อง ตาลอยลงมาอีกคืบหนึ่ง ตามเสียงนั้นมาเหมือนคนเดินตามเสียงเรียก
          - id: rafter_out
            label: ลุกออกจากห้อง ปิดประตูตามหลัง
            kind: flee
      - text: ตาลอยหลุดออกจากผ้า ลอยลงมากลางห้อง ห่างหน้า{name}สองช่วงแขน รูม่านตาขยายจนเห็นทั้งห้องสะท้อนอยู่ข้างใน รวมทั้งคนที่อยู่บนเตียง
        answer: item
        moves:
          - id: rafter_rag
            label: ชุบผ้าขี้ริ้วด้วยน้ำมันตะเกียง จุดในกระถาง
            kind: item
            stat: DEX
            tags: [smoke]
          - id: rafter_wall
            label: หันหน้าเข้าผนัง ร้องเพลงกล่อมเด็กไม่ให้ขาดเสียง
            kind: guard
          - id: rafter_broom
            label: เอาด้ามไม้กวาดเขี่ยมันไปทางหน้าต่าง
            kind: attack
            tags: [blunt]
          - id: rafter_out2
            label: ก้มต่ำ คลานออกจากห้อง
            kind: flee
      - text: มันลอยกลับขึ้นไปที่ขอบผ้าใต้ขื่อ แต่ไม่เข้าไป หันมาอีกครั้ง ช้ากว่าเดิม
        answer: guard
        moves:
          - id: rafter_nail
            label: คว้าค้อน ตอกตะปูมุมผ้ากลับ ปิดช่องเสีย
            kind: quick
          - id: rafter_flue
            label: ปิดลิ้นปล่องเตา ให้ควันจากเตาย้อนเข้าห้อง
            kind: item
            stat: WIS
            tags: [smoke]
          - id: rafter_sit
            label: นั่งนิ่ง หลับตา ปล่อยให้มันดูจนพอ
            kind: guard
          - id: rafter_out3
            label: ลุกออกจากห้องไปนอนในครัว
            kind: flee
    win:
      text: |
        ควันลอยขึ้นไปห่อขื่อ ตาลอยหรี่ลงจนเหลือเส้นเดียว แล้วถอยเข้าไปในความมืดใต้หลังคา ผ้าดิบแบนราบ ไม่โป่งอีก

        เช้ามา{name}รื้อผ้าออกทั้งผืน ใต้ขื่อมีรังหนูร้างกับใยแมงมุมผืนหนึ่ง ขึงเป็นวงสวยผิดปกติ ทุกเส้นห่างเท่ากัน
      effects: { stats: { WIS: 1 }, flags: [smoked_the_rafter_eye_out] }
    lose:
      text: |
        {name}ตื่นสายบนพื้นข้างเตียง จำไม่ได้ว่าลงมานอนตรงนั้นตอนไหน ผ้าดิบใต้ขื่อเรียบตึง ตะปูครบทุกตัว

        ทั้งวันนั้น{name}เผลอนับขั้นบันได นับถ้วย นับซี่รั้ว แล้วต้องเริ่มใหม่ทุกครั้งที่มีคนพูดด้วย
      effects: { flags: [watched_by_the_rafter_eye] }
    stalemate:
      text: |
        ไก่ตัวแรกขัน ตาลอยถอยขึ้นไปใต้ผ้าก่อนแสงแรกจะเข้าห้อง ผ้าโป่งอีกครั้งแล้วยุบ

        คืนต่อมา{name}ตอกตะปูเพิ่มรอบผ้าทุกคืบ ผ้าไม่โป่งอีก แต่บางคืนมีเสียงเล็บเกาเบาๆ อยู่ด้านบน
      effects: { flags: [watched_by_the_rafter_eye] }
    flee:
      text: |
        {name}ไปนอนในครัว เอาผ้าอุดใต้ประตูห้องนอน ไม่ได้หลับอีกจนเช้า

        เช้ามาเปิดเข้าไป ผ้าดิบใต้ขื่อตึงเรียบ ตะปูตัวที่หลุดกลับเข้าไปอยู่ในรูของมันเอง
      effects: { flags: [watched_by_the_rafter_eye] }

- id: adult.enc_era_eyes_over_the_field
  stage: adult
  weight: 12
  time: dusk
  when:
    age: [16, 59]
    year: [346, 360]
    not_traits: [curse_brand]
  text: |
    เกวียนฟางกลับจากทุ่งช้ากว่าทุกวัน ล้อหลังติดหล่มไปครึ่งบ่าย พอขึ้นทางเกวียนได้ตะวันก็ตกแล้ว ทุ่งโล่งสองข้างทาง ไม่มีต้นไม้ ไม่มีหลังคาในระยะที่วิ่งไปถึง ท้ายเกวียนมีฟางอัดสามฟ่อนกับถังน้ำมันตะเกียงสองถังที่รับฝากมาจากตลาด

    ล่อหยุดเอง หูลู่ สิ่งที่วางขวางทางอยู่ข้างหน้า มองครั้งแรกเหมือนฟ่อนฟางที่ตกจากเกวียนคันก่อน มองครั้งที่สองมันมีรอยพับ รอยพับหนึ่งค่อยๆ แยกออก
  encounter:
    foe: great_eye
    name: ตาร้อยดวงกลางทางเกวียน
    morale: 3
    beats:
      - text: รอยพับแยกออกเป็นตา ดวงเดียว มองล่อ ล่อยืนแข็ง ไม่ยอมถอย ไม่ยอมเดิน
        moves:
          - id: field_straw
            label: ดึงฟางจากฟ่อนท้ายเกวียน จุดให้คุ
            kind: item
            stat: DEX
            tags: [smoke]
            success: ฟางอัดแน่นไม่ลุก มันคุ ควันขาวไหลเตี้ยไปตามทางเกวียน ตาดวงนั้นหรี่ลง ขอบเปลือกเปียก
          - id: field_back
            label: ค่อยๆ ถอยเกวียน ไม่ให้ล่อตื่น
            kind: guard
          - id: field_count
            label: มองกลับ พยายามนับว่ามันมีตากี่ดวง
            kind: read
            stat: INT
            failure: "{name}นับได้เจ็ด แล้วแปด แล้วเจ็ดอีกครั้ง ตัวเลขไม่ยอมอยู่นิ่ง ทุกครั้งที่นับใหม่ มีดวงหนึ่งหันมามองปากของ{name}"
          - id: field_unhitch
            label: ปลดล่อ ขี่หนีกลับทางเดิม
            kind: flee
      - text: ตาเปิดเพิ่มอีกแถว ไม่รีบ {name}ก้มมองมือที่จับบังเหียน แล้วไม่แน่ใจว่านิ้วนางอยู่ข้างไหน
        answer: guard
        moves:
          - id: field_hood
            label: ดึงผ้าคลุมหัว ก้มหน้ามองแต่ทาง
            kind: guard
          - id: field_bale
            label: ผลักฟ่อนฟางลงจากเกวียน จุดไฟทั้งฟ่อนขวางไว้
            kind: item
            stat: STR
            tags: [smoke]
          - id: field_shout
            label: ตะโกนไล่มันไปให้พ้นทาง
            kind: talk
            failure: ตาดวงใหม่เปิดขึ้นรับทุกคำที่ตะโกน พอถึงคำที่สี่ {name}ได้ยินเสียงตัวเองพูดคำที่ไม่ได้คิดจะพูด
          - id: field_walk_away
            label: ทิ้งเกวียน เดินกลับทางเดิมไม่เหลียว
            kind: flee
      - text: มันกลิ้งเข้ามาครึ่งรอบ ช้า หนัก ดินบนทางเกวียนยุบเป็นรอยลึกตามหลัง ระยะเหลือแค่ความยาวเกวียน
        answer: item
        moves:
          - id: field_oil
            label: ทุบฝาถังน้ำมันตะเกียง ราดลงบนฟางที่คุอยู่
            kind: item
            stat: DEX
            tags: [smoke]
            success: น้ำมันลงบนฟางคุ ควันดำข้นพุ่งขึ้นเป็นกำแพง ตาแถวล่างหลับลงทีละดวงตามแนวควัน น้ำใสไหลออกจากเบ้าเป็นทาง
          - id: field_wheel
            label: ขวางเกวียนเป็นกำแพง หลบหลังล้อ
            kind: guard
          - id: field_goad
            label: ตีก้นล่อให้ลากเกวียนพุ่งอ้อมมันไป
            kind: quick
          - id: field_ditch
            label: กระโดดลงจากเกวียน วิ่งลัดทุ่ง
            kind: flee
      - text: ตาทั้งหมดที่ยังลืมอยู่หันมารวมที่จุดเดียว ที่หน้าของ{name} ตาดวงที่ใหญ่ที่สุดยังปิดอยู่ ขอบเปลือกเริ่มสั่น
        answer: guard
        moves:
          - id: field_shut
            label: หลับตา เอามือปิดหน้า ยืนให้อยู่
            kind: guard
          - id: field_second_barrel
            label: ราดถังที่สองรอบตัวเอง จุดให้ควันห่อทั้งเกวียน
            kind: item
            stat: CON
            tags: [smoke]
          - id: field_lantern
            label: ขว้างตะเกียงท้ายเกวียนใส่เปลือกตาดวงใหญ่
            kind: attack
            tags: [ranged, fire]
          - id: field_run
            label: หลับตาวิ่ง ทางไหนก็ได้ที่ห่างจากมัน
            kind: flee
    win:
      text: |
        ตาหลับลงทีละแถวตามแนวที่ควันลอยผ่าน ดวงสุดท้ายที่หลับคือดวงที่มองล่อ ก้อนนั้นทรุดลงช้าๆ จนเหลือรอยกดบนทางเกวียนกว้างเท่าลานตากผ้า

        {name}จูงล่อเดินอ้อมรอยนั้นกลับถึงถิ่นตอนดึก น้ำมันหายไปถังครึ่ง เจ้าของถังไม่ทวง พอได้ยินว่าเอาไปทำอะไร
      effects: { stats: { WIS: 1 }, flags: [smoked_out_the_eyes_on_the_cart_road] }
    lose:
      text: |
        คนออกไปเก็บฟางเจอ{name}ตอนเช้า นอนอยู่ใต้เกวียน ตาลืม ถามชื่อแล้วตอบได้ช้า ล่อยืนอยู่ข้างๆ ทั้งคืน ไม่ไปไหน

        บนทางเกวียนข้างหน้ามีรอยกดกว้าง ไม่มีรอยลากออกไปทางไหน
      effects: { flags: [seen_by_the_eyes_on_the_cart_road] }
    stalemate:
      text: |
        ฟ้าสางทางตะวันออก ดาวดวงใหม่จางไปก่อนดาวเก่า ตาทุกดวงบนก้อนนั้นหรี่ลงพร้อมกันเหมือนคนง่วง พอแสงแรกแตะทาง มันไม่อยู่แล้ว

        เหลือรอยกดบนทางเกวียน กับล่อที่ยืนตัวสั่นอยู่จนตะวันขึ้นพ้นทุ่ง
      effects: { flags: [seen_by_the_eyes_on_the_cart_road] }
    flee:
      text: |
        {name}ไม่เหลียวจนถึงหัวถิ่น นั่งหอบอยู่ข้างบ่อจนมีคนออกมาถาม

        เช้าวันต่อมาคนออกไปเอาเกวียนคืน เกวียนจอดอยู่กลางทาง หันหัวกลับมาทางถิ่น ไม่มีใครหันไว้ให้
      effects: { flags: [seen_by_the_eyes_on_the_cart_road] }

- id: adult.enc_era_glass_at_shift_change
  stage: adult
  weight: 12
  scene: refinery
  when:
    age: [16, 64]
    year: [342, 360]
    location_tag: [ventras, kardin]
    not_traits: [curse_brand]
  text: |
    หวูดเปลี่ยนกะดังตอนฟ้ายังไม่สาง กะดึกเดินออกจากประตูโรงกลั่นเป็นแถว หน้าซีด ปิ่นโตห้อยมือ ตามธรรมเนียมของย่านโรงกลั่น พอพ้นประตู คนหัวแถวจะขึ้นเพลงเลิกกะ ที่เหลือร้องตาม เคาะปิ่นโตเป็นจังหวะ เพลงนี้ไม่มีใครรู้ว่าใครแต่ง ร้องตรงกันทุกคนแค่ท่อนแรกกับท่อนสุดท้าย

    {name}เดินสวนแถวมาตามตรอก เพลงยังไม่จบท่อนแรก คนท้ายแถวก็ตะโกนคำที่คนโรงกลั่นตะโกนกันจนเป็นคำเดียว ระวังแก้ว

    ในแถวมีอยู่ตัวหนึ่งที่เดินตรงจังหวะกว่าทุกคน ใสตั้งแต่อกลงไป แสงฟ้าเต้นอยู่ข้างในตามจังหวะเพลงที่เพิ่งหยุด
  encounter:
    foe: glass_walker
    name: แก้วเดินในแถวกะดึก
    morale: 3
    beats:
      - text: แถวกะดึกแตก คนกระจายชิดกำแพง แก้วเดินไม่รีบ เดินต่อไปตามจังหวะเพลงที่ไม่มีใครร้องแล้ว ตรงมาทางตรอกที่{name}ยืนอยู่
        moves:
          - id: shift_tins
            label: เคาะปิ่นโตของคนที่ทิ้งไว้ ขึ้นเพลงเลิกกะใหม่
            kind: item
            stat: CHA
            tags: [noise]
          - id: shift_crowbar
            label: เอาชะแลงฟาดเข่ามัน
            kind: attack
            tags: [blunt]
          - id: shift_read
            label: ดูให้ออกว่ามันเดินตามอะไร
            kind: read
            stat: WIS
            success: มันไม่ได้เดินตามคน มันเดินตามจังหวะ ใครในแถวเผลอเคาะปิ่นโต มันเอียงหัวไปหา แล้วรอยร้าวเส้นเล็กๆ ก็ขึ้นที่คอ
          - id: shift_run
            label: หลบเข้าตรอกข้าง
            kind: flee
      - text: มันถึงคนแรกที่ล้มอยู่ เด็กยกถังกะดึกที่สะดุดขาตัวเอง แก้วเดินก้าวข้ามไปโดยไม่ก้มดู ขอบแก้วที่ข้อเท้าบาดแขนเด็กเป็นทาง
        answer: quick
        moves:
          - id: shift_pull
            label: กระชากเด็กออกมาจากทางของมัน
            kind: quick
          - id: shift_cart
            label: เข็นรถถังเปล่าขวางหน้ามัน
            kind: guard
          - id: shift_bang
            label: ตีปิ่นโตสองใบเข้าหากันเหนือหัว
            kind: item
            stat: DEX
            tags: [noise]
          - id: shift_run2
            label: ถอยกลับไปทางที่มา
            kind: flee
      - text: มันหันมาทาง{name} แสงในอกย้ายมาอยู่ด้านนี้ แขนแก้วยกขึ้น ช้า เหมือนคนจะยกมือทัก
        answer: attack
        moves:
          - id: shift_sledge
            label: คว้าค้อนตอกหมุดที่พิงกำแพงโรงกลั่น ทุบเข้าที่อก
            kind: attack
            tags: [blunt]
          - id: shift_knife
            label: ฟันด้วยมีดตัดเชือกที่เหน็บเอว
            kind: attack
            tags: [edge]
            failure: มีดไถลไปตามแขนแก้วเหมือนไถบนกระจกหน้าต่าง เหลือแค่เสียงเอี๊ยด ข้อมือของ{name}ล้าไปถึงศอก แขนแก้วลงมาต่อโดยไม่ช้าลงเลย
          - id: shift_step
            label: ก้าวถอยตามจังหวะเดียวกับมัน ให้แขนวืด
            kind: quick
          - id: shift_run3
            label: วิ่งเข้าประตูโรงกลั่นที่ยังเปิดอยู่
            kind: flee
      - text: คนกะดึกที่ชิดกำแพงเริ่มขยับทีละคน ถือปิ่นโตไว้ในมือ รอให้ใครสักคนเริ่ม
        answer: talk
        moves:
          - id: shift_song
            label: ขึ้นเพลงเลิกกะท่อนแรก ดังที่สุดเท่าที่คอจะไหว
            kind: talk
            tags: [noise]
            success: ท่อนแรกยังไม่จบ คนกะดึกทั้งตรอกก็ร้องตาม ปิ่นโตเป็นร้อยใบเคาะลงพร้อมกัน แก้วเดินหยุดกลางก้าว ทุกครั้งที่ปิ่นโตลง รอยร้าวแล่นต่อจากอกขึ้นไปอีกคืบ
          - id: shift_last
            label: เข้าไปทุบเองให้จบ
            kind: attack
            tags: [blunt]
          - id: shift_hold
            label: ยืนขวางประตูโรงกลั่น ไม่ให้มันกลับเข้าไป
            kind: guard
          - id: shift_run4
            label: ปล่อยให้คนอื่นจัดการ หลบไปทางตรอกหลัง
            kind: flee
    win:
      text: |
        มันแตกตอนเพลงถึงท่อนสุดท้าย ท่อนที่ทุกคนร้องตรงกัน ทรุดลงเป็นกองเศษแก้วสูงถึงเข่า แสงฟ้าลอยออกไปทางปล่อง คนกะดึกร้องต่อจนจบเพลงตามธรรมเนียม แล้วต่างคนต่างกลับบ้าน

        สายวันนั้นนายโรงกลั่นจ่ายค่าเก็บเศษแก้วให้{name}สองเหรียญ ไม่ถามว่าใครเป็นคนเริ่มเพลง
      effects: { gold: 2, stats: { STR: 1 }, flags: [broke_the_glass_walker_at_shift_change] }
    lose:
      text: |
        {name}ฟื้นขึ้นมาบนพื้นตรอก คนกะเช้าเดินอ้อมไปทีละคน หมอของโรงกลั่นนั่งคีบเศษแก้วออกจากแขน คีบไปบ่นไป

        แก้วเดินไม่อยู่ในตรอกแล้ว ไม่มีใครบอกได้ว่ามันไปทางไหน
      effects: { flags: [cut_by_the_glass_walker] }
    stalemate:
      text: |
        หวูดกะเช้าดัง แก้วเดินหยุด หันหลัง แล้วเดินกลับเข้าประตูโรงกลั่นพร้อมแถวกะเช้า ตรงจังหวะกว่าทุกคนในแถว

        คนกะเช้าเดินห่างจากมันครึ่งช่วงตัวทั้งหน้าและหลัง ไม่มีใครวิ่ง ไม่มีใครร้องเพลง
    flee:
      text: |
        {name}พ้นตรอกออกมาได้ หลังพิงกำแพงอีกฝั่ง หอบจนเจ็บซี่โครง

        สักพักเพลงเลิกกะขึ้นมาอีกครั้งจากที่ไกลๆ ร้องไม่ครบคน

- id: adult.enc_era_white_cloaks_at_night
  stage: adult
  weight: 60
  time: night
  cast:
    mate: { id: partner, optional: true }
  when:
    age: [16, 130]
    year: [355, 356]
    location_tag: [arvel_village, ventras, kardin]
  text: |
    คนเสื้อคลุมขาวสามคนมาถึงตอนเที่ยงคืน ไม่เคาะ ทุบ คนถือสมุดบอกว่ามีคนเห็นตะกร้าข้ามรั้วมาจากบ้านแม่ม่ายข้างๆ ตอนหัวค่ำ มาลงทางลานบ้าน{name} ขอดูโรงเก็บของหลังบ้าน โรงเก็บของไม่มีกุญแจ ไม่เคยมี

    คนถือเหล็กยืนข้างหลัง แท่งเหล็กห่อผ้าถือไว้เหมือนไม้เท้า คนที่สามจุดคบไฟ เปลวไฟส่องเห็นกลอนไม้ของโรงเก็บของ

    {name}ไม่รู้ว่าคืนนี้มีอะไรอยู่ในโรงเก็บของบ้าง
  encounter:
    foe: witch_hunter
    name: คนเสื้อคลุมขาวกลางดึก
    morale: 3
    deadly: false
    beats:
      - text: คนถือสมุดก้าวเข้ามาในลานโดยไม่รอให้ใครเชิญ คนถือเหล็กเดินอ้อมไปทางโรงเก็บของ
        moves:
          - id: cloak_block
            label: ไปยืนขวางประตูโรงเก็บของ
            kind: guard
          - id: cloak_warrant
            label: ถามหาหมาย ถามว่าใครเห็น เห็นตอนไหน
            kind: talk
            parley: true
          - id: cloak_lamp
            label: ขว้างตะเกียงใส่คบไฟให้ลานมืด
            kind: attack
            tags: [ranged]
          - id: cloak_mate
            label: ให้{mate}ไปยืนเถียงกับคนถือสมุดที่ประตูหน้า เสียงดังให้ทั้งซอยตื่น
            kind: talk
            tags: [noise]
            ally: mate
          - id: cloak_run
            label: ออกประตูหลัง ข้ามรั้วไปทางทุ่ง
            kind: flee
      - text: คนถือเหล็กถึงประตูโรงเก็บของ มือจับกลอน ข้างในมีเสียงอะไรขยับบนกองกระสอบ
        answer: quick
        moves:
          - id: cloak_wrist
            label: คว้าข้อมือคนถือเหล็กไว้ก่อนเขาดึงกลอน
            kind: quick
          - id: cloak_stone
            label: ขว้างหินใส่มือที่ถือคบไฟ
            kind: attack
            tags: [ranged]
          - id: cloak_read
            label: ดูหน้าคนถือเหล็ก ว่าเขาอยากเจออะไรจริงๆ
            kind: read
            stat: WIS
            failure: หน้าเขานิ่งเหมือนหน้าคนนับเหรียญ ไม่มีอะไรให้อ่าน มีแต่สายตาที่มองเลยไหล่{name}ไปที่กลอนประตู
          - id: cloak_run2
            label: วิ่งออกทางรั้วข้างเล้า
            kind: flee
      - text: คนถือสมุดเหวี่ยงโซ่มาจากด้านข้าง ไม่ได้เล็งตัว เล็งข้อเท้า
        answer: guard
        moves:
          - id: cloak_post
            label: ยืนตั้งหลักชิดเสาเล้า ให้โซ่พันเสาแทนขา
            kind: guard
          - id: cloak_jump
            label: กระโดดข้ามโซ่
            kind: quick
          - id: cloak_rake
            label: คว้าคราดเหล็กที่พิงเล้าฟาดโซ่
            kind: attack
          - id: cloak_run3
            label: ปล่อยลาน ปีนรั้วหนี
            kind: flee
      - text: คนที่สามเอาคบไฟจ่อประตูโรงเก็บของ ไม่ได้จุด แค่จ่อ แล้วถามว่าจะเปิดเองหรือให้เขาเปิด
        answer: talk
        moves:
          - id: cloak_open
            label: เปิดประตูโรงเก็บของเองต่อหน้าทั้งสามคน
            kind: talk
            parley: true
          - id: cloak_bluff
            label: บอกว่าข้างในมีถังน้ำมันตะเกียงสามถัง ไฟเข้าไปไหม้ทั้งซอย
            kind: talk
          - id: cloak_pot
            label: ขว้างหม้อดินใส่มือที่ถือคบไฟ
            kind: attack
            tags: [ranged]
          - id: cloak_run4
            label: หนีออกประตูหลังไปทางทุ่ง
            kind: flee
    win:
      text: |
        คบไฟตกลงรางน้ำ ดับเสียงฉ่า คนถือสมุดยกมือห้ามอีกสองคน บอกว่าคืนนี้พอแค่นี้ ยังมีอีกหลายบ้าน ก่อนไป คนถือเหล็กเอาชอล์กวาดตะเกียงดวงเล็กไว้ที่ด้านในวงกบประตูบ้าน{name} เหมือนบ้านที่ค้นแล้วทุกบ้าน

        โรงเก็บของไม่มีใครได้เปิด เช้าขึ้นมา{name}เปิดดูเอง กองกระสอบยุบเป็นแอ่ง ยังอุ่น ในแอ่งไม่มีอะไรแล้ว
      effects: { hunted: { lamp_church: 1 }, stats: { CON: 1 }, flags: [held_the_shed_against_the_white_cloaks] }
    lose:
      text: |
        {name}ฟื้นขึ้นมาตอนฟ้าสาง นอนอยู่กลางลาน ข้อมือมีรอยโซ่ ประตูโรงเก็บของเปิดอ้า ข้างในกระสอบรื้อกระจาย ไม่มีอะไรอื่น

        ที่ด้านในวงกบประตูบ้านมีตะเกียงชอล์กดวงเล็ก วาดเส้นเดียวไม่ยกมือ
      effects: { flags: [searched_by_the_white_cloaks] }
    stalemate:
      text: |
        ไก่ตัวแรกขัน คนถือสมุดปิดสมุด บอกว่าคืนนี้ยังเหลืออีกสิบบ้าน วาดตะเกียงชอล์กไว้ที่ด้านในวงกบประตูบ้าน{name} แล้วทั้งสามก็ออกไปทางประตูรั้ว

        เช้ามาประตูโรงเก็บของแง้มอยู่ครึ่งคืบ {name}จำไม่ได้ว่าใครเปิด
      effects: { flags: [searched_by_the_white_cloaks] }
    flee:
      text: |
        {name}ไม่หยุดจนพ้นทุ่ง นั่งรออยู่ในคูข้างคันนาจนฟ้าสาง กลับถึงบ้าน ประตูโรงเก็บของเปิดอ้า กระสอบรื้อกระจาย ตะเกียงชอล์กดวงเล็กวาดอยู่ที่ด้านในวงกบประตูบ้าน

        ไม่มีใครในซอยเล่าว่าคืนนั้นรถมีประทุนผ่านมาหรือเปล่า
      effects: { flags: [searched_by_the_white_cloaks] }
    parley:
      text: |
        ประตูโรงเก็บของเปิดออก คบไฟส่องเข้าไป บนกองกระสอบมีแมวลายเสือนอนอยู่กับลูกห้าตัว ตะกร้าใบหนึ่งของแม่ม่ายข้างบ้านคว่ำอยู่ข้างๆ แมวตัวนั้นคาบลูกข้ามรั้วมาทีละตัวตั้งแต่หัวค่ำ

        คนถือเหล็กหัวเราะออกมาครั้งเดียว แล้วกลบด้วยการไอ คนถือสมุดขีดบรรทัดหนึ่งในสมุด ขอโทษที่รบกวน ก่อนออกจากลาน คนถือเหล็กยังวาดตะเกียงชอล์กไว้ที่ด้านในวงกบประตูบ้าน{name}เหมือนบ้านที่ค้นแล้วทุกบ้าน
      effects: { flags: [opened_the_shed_for_the_white_cloaks] }

- id: adult.enc_era_sentry_with_new_orders
  stage: adult
  weight: 12
  when:
    age: [16, 64]
    year: [345, 360]
    location_tag: [ventras, kardin]
  text: |
    หุ่นยามประจำลานสินค้าเดินรอบเดิมมาตั้งแต่ก่อนคนเฝ้าลานคนปัจจุบันจะเกิด แผ่นคำสั่งทองเหลืองที่อกเจาะรูไว้ตามที่นายลานสั่ง รูไหนเปิดคือคำสั่งไหนใช้ ห้ามคนนอกเข้าหลังมืด ห้ามขนของออกโดยไม่มีใบ เดินรอบลานไม่ขาดจังหวะ

    เช้านี้แผ่นทองเหลืองมีรูใหม่สามรู ไม่มีใครเจาะ ตั้งแต่ตะวันขึ้น มันยกทุกคนที่ถือของขึ้นจากพื้น แบกไปวางไว้ที่ประตูลาน แล้วกลับมายกคนต่อไป คนงานแขนเคล็ดไปสามคน กระสอบแตกสิบกว่าใบ

    นายลานบอกว่าคนรับซื้อเศษเหล็กจะมาพรุ่งนี้ ลานขายหุ่นตัวนี้ตามน้ำหนักไปแล้ว วันนี้ใครหยุดมันได้ เอาแผ่นทองเหลืองที่อกไปขายเอง {name}ยืนอยู่กลางลาน ห่อของยังอยู่ในมือ
  encounter:
    foe: mad_sentry
    name: หุ่นยามคำสั่งใหม่
    morale: 3
    beats:
      - text: หุ่นยามหันมาทาง{name} ไฟที่ช่องตากะพริบสามที แล้วเดินตรงเข้ามา
        moves:
          - id: sentry_drop
            label: วางห่อของลงพื้น ยกมือสองข้างให้มันเห็น
            kind: guard
            success: หุ่นยามหยุดห่างไปหนึ่งก้าว ไฟที่ตามองห่อของบนพื้น มองมือ{name} แล้วเดินวนรอบ{name}หนึ่งรอบ หาของที่ไม่มีอยู่แล้ว
          - id: sentry_plate
            label: อ่านแผ่นคำสั่งที่อก ว่ารูใหม่สามรูหมายถึงอะไร
            kind: read
            stat: INT
            success: รูใหม่สามรูอยู่ในแถวที่ไม่มีคำสั่งตอกกำกับ ขอบรูเรียบเหมือนเจาะด้วยเครื่อง รูหนึ่งอยู่ตรงกับช่องไขลานด้านหลังพอดี ทุกครั้งที่มันหมุนตัว ช่องนั้นเปิดให้เห็นครึ่งจังหวะ
          - id: sentry_bar
            label: เอาเหล็กงัดฟาดข้อศอกมัน
            kind: attack
            tags: [blunt]
          - id: sentry_run
            label: วิ่งออกประตูลานไปก่อนมันถึง
            kind: flee
      - text: มันคว้าไหล่{name} นิ้วทองเหลืองปิดลงช้าๆ แน่นพอดีเหมือนจับปากกระสอบ
        answer: quick
        moves:
          - id: sentry_twist
            label: บิดตัวหลุดจากมือก่อนนิ้วจะปิดสนิท
            kind: quick
          - id: sentry_order
            label: ตะโกนคำสั่งยกเลิกแบบที่นายลานใช้
            kind: talk
            failure: หุ่นยามฟังจนจบ ไฟที่ตากะพริบช้าลงสามที แล้วนิ้วทองเหลืองก็ปิดต่อจนสุด
          - id: sentry_crate
            label: ดึงลังใบบนสุดให้ร่วงลงหัวมัน
            kind: attack
            tags: [blunt]
          - id: sentry_run2
            label: สะบัดเสื้อหลุดทั้งตัว วิ่ง
            kind: flee
      - text: มันยก{name}ขึ้นจากพื้นได้คืบหนึ่ง เดินไปทางประตูลาน ตอนหมุนตัว ช่องไขลานที่ท้ายทอยหันมาอยู่ใกล้มือ{name}
        answer: attack
        moves:
          - id: sentry_spike
            label: ยัดเหล็กแหลมเข้าช่องไขลาน
            kind: attack
            tags: [pierce]
            success: เหล็กแหลมจมเข้าไปครึ่งนิ้ว เฟืองข้างในขบกันเสียงเหมือนเคี้ยวกรวด หุ่นยามหยุดกลางก้าว แขนที่ยก{name}อยู่ลดลงทีละน้อย
          - id: sentry_hook
            label: เอาตะขอเกี่ยวกระสอบงัดช่องไขลาน
            kind: item
            stat: DEX
            tags: [pierce]
          - id: sentry_limp
            label: ทิ้งตัวให้หนักที่สุด ปล่อยให้มันแบก
            kind: guard
          - id: sentry_run3
            label: ดิ้นหลุดจากมือแล้ววิ่ง
            kind: flee
      - text: มันวาง{name}ลงที่ประตูลาน เรียบร้อยเหมือนวางลัง แล้วหันกลับไปหาคนงานที่ยังถือกระสอบอยู่กลางลาน เด็กหนุ่มคนหนึ่ง ยืนแข็งอยู่กับที่
        answer: quick
        moves:
          - id: sentry_back
            label: วิ่งกลับไปแทงช่องไขลานจากข้างหลัง
            kind: attack
            tags: [pierce]
          - id: sentry_call
            label: ตะโกนให้เด็กวางกระสอบลง
            kind: talk
            failure: เด็กได้ยิน แต่มือไม่ยอมปล่อยกระสอบ หุ่นยามก้าวถึงตัวเด็กก่อน{name}จะตะโกนจบ
          - id: sentry_chain
            label: เอาโซ่ลากลังพันขามัน
            kind: quick
          - id: sentry_run4
            label: ออกจากลานไปตามคนเฝ้ายาม
            kind: flee
    win:
      text: |
        เฟืองข้างในกินกันเอง เสียงเหมือนโม่หินที่ไม่มีข้าวให้บด แขนทองเหลืองตกลงข้างตัว ไฟที่ตาดับทีละดวง หุ่นยามยืนนิ่งกลางลานจนรถรับซื้อเศษเหล็กมาถึง

        นายลานให้{name}งัดแผ่นคำสั่งออกไปขายเอง รูใหม่สามรูขอบเรียบเหมือนเจาะด้วยเครื่อง ร้านรับซื้อทองเหลืองให้สองเหรียญ ไม่ถามว่ารูพวกนั้นมาจากไหน
      effects: { gold: 2, stats: { DEX: 1 }, flags: [stopped_the_sentry_with_new_orders] }
    lose:
      text: |
        คนงานพบ{name}ตอนบ่าย นั่งพิงประตูลานอยู่ข้างกองกระสอบ ห่อของวางเรียบร้อยอยู่บนตัก หุ่นยามยังเดินรอบลานต่อ ยกคนที่ถือของไปวางที่ประตูทีละคนจนตะวันตก แล้วไปยืนนิ่งที่มุมของมัน

        พรุ่งนี้รถรับซื้อเศษเหล็กจะมา
      effects: { flags: [carried_out_by_the_sentry] }
    stalemate:
      text: |
        หุ่นยามหยุดเดินเองตอนตะวันตก ยืนที่มุมลาน ไฟที่ตาหรี่ลงเหลือจุดเดียว คืนนั้นไม่มีใครเข้าลาน

        เช้ามารถรับซื้อเศษเหล็กมาถึง คนรับซื้อเคาะแผ่นอกฟังเสียง แล้วต่อราคาลงครึ่งหนึ่ง บอกว่าตัวนี้ยังไม่ตาย
    flee:
      text: |
        {name}พ้นประตูลานออกมา ยืนหอบอยู่ข้างนอก ข้างในได้ยินเสียงเท้าเหล็กเดินรอบลานตามจังหวะเดิม

        ตะวันบ่ายหุ่นยามยกคนงานอีกคนมาวางที่ประตู วางเรียบร้อย หันหน้าออกนอกลาน
