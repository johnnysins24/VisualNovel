# ชุด 5 ค ปีสองเมือง 9 เรื่อง (ปี 373 ถึง 379) สองของทุกอย่าง
# สองเมืองไม่ได้รบกัน เก็บภาษีซ้อน จับเสมียนของกันและกัน ไม่รับกระดาษของกัน เรียกตราขาว ตราเทา เมืองน้ำค้าง เมืองถ่าน
# ไม่เอ่ยชื่อเจ้านายของปีกไหน ไม่บอกว่าใครสวมมงกุฎ
# สามแดนของอาร์เวล: นับเตาสองรอบ · คำร้องเก่าได้คำตอบ (วัยปลาย) · ด่านสองตรา (ทำงานได้ หมู่บ้านกับคาร์ดิน)
# ฮอร์ดุน ไอเลธ แดนเถ้า คนละเรื่อง · ลูกปีเขาโตแล้ว (คนมีตรามีทางของตัวเอง) · ชกกันกลางตลาด (วัยปลาย)
# คนในฮอร์ดุนกับไอเลธที่มีชื่อในตำราไม่เอ่ยชื่อ ใช้ตำแหน่งแทน (นายราคา ข้าหลวงคนเก่า)

# ---------- นับเตาสองรอบ ----------
- id: adult.era_cities_counted_twice
  stage: adult
  weight: 24
  scene: home
  when:
    age: [16, 130]
    year: [373, 379]
    location_tag: [arvel_village, ventras, kardin]
  text: |
    นับเตาสองรอบมาถึงถิ่นของ{name}ในสัปดาห์เดียวกัน คนนับตราขาวมาวันเวรัส ถือสมุดปกขาว มีเด็กถือตะเกียงเดินตาม คนนับตราเทามาวันเบเลค ถือสมุดปกเทา มีชายถือกระบองเดินตาม ทั้งสองนับเตาแบบเดียวกัน ดูควันจากปล่อง แล้วดูเถ้าในเตา

    ทั้งถิ่นรู้วิธีหลบนับมาแต่ไหนแต่ไร ดับไฟก่อนสาง เอาเถ้าเย็นจากกองหลังบ้านมาโรยทับ ปล่องไม่มีควัน เถ้าไม่อุ่น คือเตาร้าง ไม่ต้องจ่าย คนนับตราขาวเป็นเด็กหนุ่มที่ไม่เคยนับเตาที่ไหนมาก่อน เดินผ่านปล่องเย็นไปครึ่งถิ่นโดยไม่ก้มดูเตาสักเตา ทิ้งใบรับเขียนว่าเตาร้างไว้ให้ทุกบ้านที่ไม่มีควัน บ้านของ{name}ก็ได้ไปใบหนึ่ง

    คนนับตราเทาคือเสมียนเตาคนเดิมของอำเภอ คนที่มานับทุกปีตั้งแต่ก่อนมีสองเมือง เขารู้ว่าเตาไหนเย็นจริง เตาไหนเพิ่งเย็น เขาเอาหลังมือแตะหินเตาทีละบ้าน วันนี้หลังมือของเขาอยู่บนหินเตาของ{name}แล้ว
  choices:
    - id: pay_the_second_count
      label: จ่ายตามที่เขานับ
      text: |
        เขารับเหรียญ เขียนใบรับตราเทาด้วยลายมือที่{name}จำได้ตั้งแต่สมัยที่ใบรับยังมีสองตราในใบเดียว แล้วเดินไปบ้านถัดไป แตะหินเตาด้วยหลังมือเหมือนเดิม

        ทั้งถิ่นได้ใบรับคนละสองใบ สีละใบ ใบหนึ่งบอกว่าเตาร้าง อีกใบบอกว่าจ่ายแล้ว เสียบตะปูตัวเดียวกันไว้ข้างประตู คนในถิ่นเรียกตะปูตัวนั้นว่าตะปูสองเมือง
      effects: { gold: -2, alignment: { law: 1 }, flags: [paid_the_second_hearth_count] }
    - id: play_one_against_the_other
      label: บอกเขาว่าคนคุ้มกันของตราขาวยังเดินหาเสมียนตราเทาอยู่ในถิ่น
      habit: sweet_tongue
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}พูดเบาๆ แบบคนที่ไม่อยากให้ใครได้ยิน ว่าเด็กถือตะเกียงของตราขาวถามหาเขาที่บ่อเมื่อเช้า ถามสองหน ชายถือกระบองหันไปดูหัวถิ่น เสมียนเตาปิดสมุด เขาเพิ่งได้ข่าวว่าเสมียนตราเทาคนหนึ่งโดนจับที่เมืองตลาดเมื่อเดือนก่อน

          บ่ายนั้นเขานับเสร็จทั้งถิ่นในชั่วต้มข้าว ไม่แตะหินเตาบ้านไหนอีก เขียนเตาร้างตามใบรับตราขาวทุกบ้าน ก่อนขึ้นเกวียนเขาหันมามอง{name}ครั้งหนึ่ง แบบคนที่จะจำหน้าไว้ถึงปีหน้า
        effects: { stats: { CHA: 1 }, flags: [played_the_two_counters] }
      failure:
        text: |
          เสมียนเตาฟังจนจบ แล้วบอกว่าเด็กตราขาวขึ้นเกวียนกลับไปตั้งแต่เที่ยง เขาเห็นกับตา เขาเขียนเตาของ{name}ลงสมุดสองบรรทัด บรรทัดหนึ่งสำหรับเตา อีกบรรทัดสำหรับเรื่องที่เล่า

          ใบรับของ{name}ปีนั้นเป็นใบเดียวในถิ่นที่มีตัวเลขสองตัว ชายถือกระบองยืนรอจน{name}นับเหรียญครบ
        effects: { gold: -3, flags: [played_the_two_counters] }
    - id: show_him_the_white_receipt
      label: ยื่นใบรับตราขาวที่เขียนว่าเตาร้างให้เขาดู
      text: |
        เสมียนเตาอ่านใบรับ บอกว่ากระดาษตราเดียวของอีกฝั่งใช้กับเขาไม่ได้ แล้วก็คัดคำว่าเตาร้างลงสมุดของตัวเองตามนั้นทุกตัว เขาบอกว่าสมุดสองเล่มที่เขียนไม่ตรงกันเป็นเรื่องให้เขาต้องเดินไปอธิบายที่คาร์ดิน เขาเกลียดการเดินมากกว่ารักภาษี

        ปีนั้นบ้านของ{name}ไม่ต้องจ่ายสักรอบ หน้าหนาวมาถึง วิหารแจกขนมปังหน้าหนาวตามสมุดเตา บ้านที่เป็นเตาร้างในสมุดทั้งสองเล่มไม่มีชื่อในบัญชีแจก
      effects: { gold: 1, flags: [showed_the_white_receipt_to_the_grey_counter] }

# ---------- คำร้องเก่า ----------
- id: elder.era_cities_answer_to_an_old_petition
  stage: elder
  weight: 24
  scene: home
  when:
    age: [60, 130]
    year: [373, 379]
    location_tag: [arvel_village, ventras, kardin]
    not_flags: [moved_midlife, origin_ashland, origin_elf_bough, origin_dwarf_clan]
  text: |
    คนเดินสมุดของตราขาวหยุดหน้าประตูบ้าน{name} ไม่ได้มาเรื่องลงชื่อ มาส่งคำตอบ ห่อกระดาษผูกเชือกแดงห่อหนึ่ง ข้างในเป็นคำร้องฉบับเดิมที่บ้านนี้ยื่นไว้ กับใบอนุญาตตราขาวหนึ่งใบ กระดาษคำร้องเหลืองเป็นสีชา ลายมือในนั้น{name}จำได้ก่อนจะอ่านออก

    {name}ต้องให้เขาอ่านให้ฟังว่าเรื่องอะไร คำร้องขอสิทธิ์ให้บ้านนี้ตักน้ำจากบ่อหลวงท้ายถนนได้ เพราะเด็กในบ้านป่วยจากน้ำบ่อในซอยสามหน้าร้อนติดกัน เด็กคนนั้นคือ{name} ตราขาวอนุญาตแล้ว ชื่อของ{name}ขึ้นบัญชีบ่อหลวงตั้งแต่วันนี้

    ยังไม่ทันครบเดือน คนเดินสมุดของตราเทาก็มาถึง ถือกระดาษอีกแผ่น บ่อหลวงดูแลด้วยเงินคลัง คลังอยู่คาร์ดิน ใบอนุญาตที่ไม่มีตราเทาใช้ไม่ได้ ชื่อของ{name}ขีดออกจากบัญชีแล้ว
  choices:
    - id: draw_from_the_royal_well
      label: ถือใบตราขาวไปตักน้ำบ่อหลวงทุกเช้า ใครจะห้ามก็ให้มาห้ามเอง
      habit: stubborn
      text: |
        คนเฝ้าบ่อหลวงเป็นชายแก่ที่อ่านหนังสือไม่ออก เขามีบัญชีสองแผ่น ตอกไว้คนละเสา แผ่นหนึ่งมีชื่อ{name} อีกแผ่นมีรอยขีดทับชื่อ{name} เขาคิดเองว่าวันคี่ให้เชื่อเสาซ้าย วันคู่ให้เชื่อเสาขวา ไม่มีตราไหนสั่ง

        {name}ไปตักน้ำทุกวันคี่ น้ำบ่อหลวงเย็นกว่าน้ำในซอย จืดกว่า ตักกลับบ้านหนึ่งถังทุกครั้ง ข้างถังผูกใบตราขาวพับไว้ในถุงผ้ากันน้ำ คนเฝ้าบ่อไม่เคยขอดู
      effects: { alignment: { law: -1 }, flags: [drew_on_the_old_petition] }
    - id: petition_the_grey_seal_too
      label: ยื่นคำร้องใหม่ถึงตราเทาอีกฉบับ ให้ได้ใบอนุญาตครบสองสี
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}คัดคำร้องฉบับเดิมทุกคำ วางฉบับของคนเขียนคนแรกไว้ข้างมือ เทียบทีละบรรทัด แล้วยื่นที่โต๊ะตราเทาพร้อมค่าธรรมเนียม ครึ่งฤดูต่อมาใบอนุญาตตราเทาก็มา สองใบ สองตรา คนละแผ่น ตามธรรมเนียมเก่ายังใช้ไม่ได้สักแผ่น แต่คนเฝ้าบ่อหลวงยอมรับทั้งสองแผ่น

          {name}ตักน้ำบ่อหลวงได้ทุกวัน ใบอนุญาตสองใบเย็บติดกันด้วยด้ายเย็บกระสอบ ห้อยอยู่ข้างถัง คำร้องฉบับเดิมเก็บไว้ในหีบ
        effects: { stats: { INT: 1 }, gold: -2, flags: [petitioned_the_grey_seal_too] }
      failure:
        text: |
          เสมียนโต๊ะตราเทารับคำร้อง เขียนเลขให้หนึ่งเลขบนเศษกระดาษ บอกว่าคำตอบจะมาตามลำดับ {name}ถามว่าลำดับที่เท่าไร เขาชี้กองกระดาษบนโต๊ะข้างหลัง กองนั้นสูงกว่าตัวเขา

          เศษกระดาษใบนั้นเหน็บอยู่ที่กรอบหน้าต่างบ้าน{name} ข้างเศษกระดาษอีกใบที่เขียนเลขคล้ายกัน ลายมือเก่ากว่า เป็นของคำร้องฉบับเดิม
        effects: { gold: -1, flags: [petitioned_the_grey_seal_too] }
    - id: keep_the_old_petition
      label: เก็บคำร้องฉบับเดิมไว้ แล้วตักน้ำบ่อในซอยต่อไปตามเดิม
      text: |
        คืนนั้น{name}อ่านคำร้องเองทั้งฉบับใต้ตะเกียง ลายมือนั้นเขียนตัวโตกว่าที่จำได้ บรรยายไข้ของเด็กไว้ทีละอาการ ตัวร้อนกี่คืน อาเจียนกี่หน ปากแห้งจนแตก เขียนลงกระดาษเพื่อให้คนในเวนทราสที่ไม่เคยเห็นหน้าเด็กคนนั้นเชื่อ

        ใบตราขาวกับใบตราเทาที่ขีดชื่อทิ้งอยู่ในกองกระดาษรอจุดเตา คำร้องฉบับเดิมพับเก็บไว้ในหีบใบเล็ก ใต้ผ้าห่มผืนที่ดีที่สุด
      effects: { stats: { WIS: 1 }, flags: [kept_the_old_petition] }

# ---------- ด่านสองตรา ----------
- id: adult.era_cities_two_seal_gate
  stage: adult
  weight: 24
  scene: station
  when:
    age: [16, 59]
    year: [373, 379]
    location_tag: [arvel_village, kardin]
  text: |
    ด่านสองตราตั้งอยู่ตรงที่ทางเกวียนข้ามรางระหว่างเมืองตลาดกับคาร์ดิน ด่านนี้เคยมีเสมียนคนเดียว พกตลับตราสองตลับกับหมวกสองใบ ประทับตราขาวก็สวมหมวกขาว ประทับตราเทาก็เปลี่ยนเป็นหมวกเทา คนผ่านด่านล้อเขามาทั้งชีวิต

    ตั้งแต่ปีสองเมืองด่านมีโต๊ะสองตัว ห่างกันสิบก้าว เสมียนคนเดิมนั่งโต๊ะตราขาว หลานชายของเขานั่งโต๊ะตราเทา สวมหมวกเทาใบเดิมของลุง ทั้งสองไม่คุยกัน ของทุกเกวียนจ่ายสองหน ตอนเที่ยงเด็กส่งข้าวของบ้านลุงยังถือห่อข้าวกลางวันมาส่งให้หลาน

    {name}คุมเกวียนรับจ้างมาถึงด่านตอนสาย ต่อแถวเป็นคันที่เก้า ทุกคนในแถวรู้ว่ามีทางเดินเลียบคูน้ำอ้อมด่านไปทางตะวันตก เกวียนผ่านไม่ได้ คนแบกของผ่านได้ และที่โรงเตี๊ยมหน้าด่านมีคนรับจ้างพาเดินทางนั้นตอนกลางคืน
  choices:
    - id: pay_both_tables
      label: จ่ายสองโต๊ะตามแถว
      text: |
        ลุงรับเหรียญ ประทับตราขาว หลานรับเหรียญ ประทับตราเทา ใช้หมึกจากตลับใบเดียวกันที่ลุงแบ่งให้ตั้งแต่ปีแรก ไม่มีใครพูดถึงตลับนั้น {name}ได้ใบผ่านสองใบ ไปถึงปลายทางตอนตะวันตกดิน ช้ากว่าที่ตกลงกับเจ้าของของครึ่งวัน

        เจ้าของของหักค่าจ้างไปครึ่งเหรียญเพราะช้า แล้วคืนให้ทีหลังเมื่อเห็นใบผ่านสองใบ เขาบอกว่าปีนี้ใครก็ช้ากันทั้งนั้น
      effects: { gold: -2, alignment: { law: 1 }, flags: [paid_the_two_seal_gate] }
    - id: carry_round_by_night
      label: แบกของเดินอ้อมด่านทางคูน้ำตอนกลางคืน
      habit: tight_fist
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ทิ้งเกวียนไว้ในแถว แบกของเป็นสามเที่ยว ทางเลียบคูน้ำแคบเท่าฝ่าเท้า ลื่นทุกก้าว กบเงียบเสียงทุกครั้งที่มีคนเดินผ่าน เที่ยวที่สามเห็นแสงตะเกียงของคนเฝ้าด่านแกว่งอยู่บนคันราง ห่างไปไม่ถึงยี่สิบก้าว ตะเกียงดวงนั้นหยุด แล้วแกว่งต่อไปทางอื่น

          ฟ้าสาง เกวียนเปล่าผ่านด่านไปโดยจ่ายแค่ค่าเกวียนเปล่า ของรออยู่อีกฝั่งครบทุกห่อ เจ้าของของจ่ายส่วนที่ไม่ต้องเสียให้ด่านมาให้{name}ครึ่งหนึ่ง
        effects: { stats: { DEX: 1 }, gold: 3, flags: [carried_round_the_two_seal_gate] }
      failure:
        text: |
          เที่ยวที่สองตะเกียงของคนเฝ้าด่านมาหยุดอยู่ตรงหน้า ห่อของห่อหนึ่งหลุดมือตกคู ทั้งห่อและ{name}โดนพาไปที่โต๊ะ คนเฝ้าเป็นคนของโต๊ะตราเทา แต่ทั้งลุงและหลานลุกจากเก้าอี้มาดูพร้อมกัน

          สองโต๊ะนี้ไม่คุยกันเรื่องอะไรเลยมาตั้งแต่ปีสองเมือง ยกเว้นเรื่องคนเลี่ยงด่าน คืนนั้นชื่อของ{name}ลงสมุดทั้งสองเล่ม ลุงสะกดชื่อให้หลานฟังทีละตัว
        effects: { hunted: { crown: 1 }, gold: -1, flags: [caught_round_the_two_seal_gate] }
    - id: guide_the_footpath
      label: ฝากเกวียนไว้ แล้วรับจ้างพาคนเดินทางคูน้ำตอนกลางคืน
      text: |
        คนพาทางที่โรงเตี๊ยมมีราคากลาง หัวละครึ่งเหรียญ แบ่งให้เด็กเลี้ยงห่านที่นอนเฝ้าปากทางอีกส่วนหนึ่ง เด็กคนนั้นเป่านกหวีดไม้ไผ่เป็นเสียงนกกลางคืนเมื่อมีตะเกียงมา {name}พาคนข้ามไปสี่คืน ได้ค่าจ้างมากกว่าคุมเกวียนทั้งเดือน

        คืนสุดท้ายคนที่{name}พาข้ามมีหญิงแก่คนหนึ่งแบกไก่สองตัวใส่ตะกร้า ไก่สองตัวไม่ยอมเงียบ เด็กเลี้ยงห่านต้องเป่านกหวีดดังกว่าไก่ตลอดทาง คนเฝ้าด่านบนคันรางได้ยินเสียงนกกลางคืนที่ร้องไม่หยุดทั้งคืน แล้วก็ไม่ได้ลงมาดู
      effects: { gold: 4, alignment: { law: -1 }, flags: [guided_the_gate_footpath] }
    - id: waved_through_as_branded
      label: ขับเกวียนเข้าโต๊ะแรกตามแถว ปล่อยให้เขาเห็นตรา
      requires: { trait: curse_brand }
      text: |
        ลุงที่โต๊ะตราขาวเห็นตราของ{name}แล้ววางตราประทับลง ไม่เก็บเงิน ยื่นใบรับสมัครขึ้นหัวเรือของราชนาวีมาให้แทน หลานที่โต๊ะตราเทาเห็นแล้วลุกเดินมาสิบก้าวเป็นครั้งแรกในรอบปี ไม่เก็บเงินเหมือนกัน เหน็บใบรับสมัครแถวหน้าที่ธนาคารจ่ายเบี้ยไว้ในเกวียน

        ลุงกับหลานยืนเถียงกันข้างล้อเกวียนว่าใบของใครเสนอดีกว่า เสียงดังจนแถวข้างหลังหัวเราะ {name}ขับเกวียนผ่านไประหว่างที่สองคนนั้นยังเถียงกันไม่จบ ใบรับสมัครสองใบปลิวอยู่บนกองของ
      effects: { gold: 2, flags: [waved_through_the_two_seal_gate] }

# ---------- ลูกอยู่ใต้อีกตรา ----------
- id: elder.era_cities_child_under_the_other_seal
  stage: elder
  weight: 24
  scene: home
  cast:
    kid: { kin: [child], min_age: 17, max_age: 45 }
  when:
    age: [60, 130]
    year: [373, 379]
  text: |
    {kid}อยู่ในเมืองที่ใช้ตราอีกสี ตราที่ถิ่นของ{name}ไม่ได้ใช้ ตั้งแต่คืนขบวนคลัง จดหมายจาก{kid}มาถึงช้าลงครึ่งเดือน และมาถึงแบบเดียวกันทุกฉบับ ซองแกะแล้วปิดใหม่ด้วยแป้งเปียก ประทับตราสองดวงคนละมุม ขาวหนึ่ง เทาหนึ่ง บางฉบับมีรอยดินสอขีดใต้คำที่คนอ่านก่อนหน้า{name}สนใจ

    ฉบับล่าสุดมีรอยขีดอยู่คำเดียว คำว่าคิดถึง

    ท้ายจดหมาย{kid}เขียนว่าจะมาหาก็ต้องมีใบผ่านของทั้งสองตรา ใบหนึ่งออกจากฝั่งของตัวเอง อีกใบเข้าฝั่งโน้น คนละโต๊ะ คนละแถว คนละค่าธรรมเนียม ปีนี้{kid}ลางานไม่ได้
  choices:
    - id: go_through_the_gate
      label: "ไปต่อแถวขอใบผ่านทั้งสองตรา แล้วไปหา{kid}เอง"
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          แถวแรกยาวครึ่งวัน แถวที่สองยาวทั้งวัน เสมียนโต๊ะที่สองถามว่าไปหาใคร ไปทำไม {name}ตอบว่าไปหาลูก เสมียนเขียนคำว่าลูกลงช่องเหตุผล แล้วประทับตรา ไม่ถามต่อ

          {kid}มารอที่ปลายทางตั้งแต่ก่อนรถเข้า {name}อยู่ได้ห้าวัน ได้เห็นห้องที่{kid}เช่า เตาที่ต้องซื้อถ่านแพง หน้าต่างที่มองเห็นรางรถไฟ วันกลับ{kid}ยัดขนมใส่ห่อจนห่อปิดไม่ลง
        effects: { stats: { CHA: 1 }, gold: -2, people: [{ id: "@kid", closeness: 1 }], flags: [crossed_the_seals_to_see_the_child] }
      failure:
        text: |
          ใบผ่านใบแรกได้ ใบที่สองไม่ได้ เสมียนบอกว่าใบแรกประทับตราเอียงไปหนึ่งนิ้ว ตามระเบียบต้องไปขอใบใหม่ {name}ต่อแถวแรกใหม่ตั้งแต่ต้น วันนั้นโต๊ะปิดก่อนถึงคิว

          {name}กลับบ้าน แล้วส่งห่อของไปกับเกวียนรับจ้างแทน ขนม ถุงเท้าถักหนึ่งคู่ กับใบผ่านใบแรกที่ใช้ไม่ได้ จดหมายตอบของ{kid}มาถึงหลังจากนั้นหนึ่งเดือน ซองประทับตราสองดวง ถุงเท้าคู่นั้นใส่พอดี
        effects: { gold: -2, flags: [crossed_the_seals_to_see_the_child] }
    - id: send_for_the_child
      label: "เขียนไปบอกให้{kid}กลับมาบ้านสักหน ค่าใบผ่านทั้งสองใบจะออกให้เอง"
      text: |
        {kid}มาถึงตอนปลายฤดู อยู่ได้สามวัน สองวันแรกซ่อมสิ่งที่{name}ไม่ได้ขอให้ซ่อม วันที่สามนั่งเฉยๆ กับ{name}ที่หน้าประตูทั้งบ่าย ทั้งสองคนไม่พูดเรื่องตราสักคำ พูดเรื่องราคาไข่ เรื่องเพื่อนบ้านที่ตายไปแล้ว เรื่องต้นไม้หน้าบ้านที่ใหญ่ขึ้น

        วันกลับ{kid}ถือใบผ่านสองใบไว้ในมือจนถึงทางโค้ง {name}ยืนดูจนลับ แล้วเข้าไปนับเงินที่เหลือในกระปุก
      effects: { gold: -3, people: [{ id: "@kid", closeness: 1 }], flags: [sent_for_the_child_across_the_seals] }
    - id: letters_that_say_nothing
      label: "หัดเขียนจดหมายที่ไม่บอกอะไรเลย แล้วสอน{kid}ให้อ่านเป็น"
      text: |
        ฉบับแรกที่{name}ส่งไปเขียนเรื่องอากาศทั้งฉบับ ท้ายฉบับเขียนว่าแม่ไก่ไข่ดี ฉบับต่อมาเขียนเรื่องราคาเกลือ ท้ายฉบับเขียนว่าแม่ไก่ไข่ดีอีก ฉบับที่สาม{kid}ตอบมาว่าที่โน่นแม่ไก่ก็ไข่ดี

        ตั้งแต่นั้นจดหมายทุกฉบับมาถึงโดยไม่มีรอยดินสอขีดสักเส้น ซองยังโดนแกะ ยังประทับตราสองดวง คนอ่านคนก่อนอ่านเรื่องอากาศกับราคาเกลือแล้วปิดซองคืน ปีนั้นแม่ไก่ในจดหมายไข่ดีทุกฉบับ ยกเว้นฉบับหนึ่งที่ไม่ได้เขียนถึงแม่ไก่ {name}ตอบฉบับนั้นภายในวันเดียว
      effects: { stats: { WIS: 1 }, flags: [wrote_letters_that_say_nothing] }

# ---------- คว่ำสิ่ว ----------
- id: adult.era_cities_chisel_face_down
  stage: adult
  weight: 24
  scene: clan_hall
  when:
    age: [16, 130]
    year: [373, 379]
    location_tag: hordun
  text: |
    งวดสุดท้ายสลักลงกำแพงหนี้หน้าวงสภาเสร็จตั้งแต่ต้นฤดู ช่างสลักวางสิ่วลงบนหินขอบกำแพง คว่ำหน้าสิ่วลง ทั้งชั้นห้าได้ยินเสียงเหล็กกระทบหิน ไม่มีใครปรบมือ ผู้ถือค้อนของแต่ละตระกูลเคาะหินหน้ากำแพงคนละครั้ง แล้วกลับไปทำงาน ตั้งแต่นั้นสภาไม่จ่ายตราไหนอีก

    ถ่านที่ลงเขาขายราคาของคนแคระเป็นครั้งแรก ที่ประตูล่างมีโต๊ะประมูลสองตัว คนของเมืองน้ำค้างตัวหนึ่ง คนของเมืองถ่านตัวหนึ่ง ราคาสูงขึ้นทุกเช้า นายราคาที่ลานถ่านของตลาดตีนเขา ชายที่อาร์เวลตั้งไว้ให้บอกราคาถ่านทุกขบวน ยังมานั่งโต๊ะตัวเองทุกวัน กระดานราคาข้างตัวเขาว่าง

    ชั้นโรงหลอมข้างล่างไฟเต็มเตาเป็นครั้งแรกตั้งแต่ใครจะจำได้ ถนนวนชั้นบนที่ตระกูลจนอยู่ต้องซื้อถ่านก้อนเดียวกันในราคาเดียวกับที่สองเมืองประมูล ราคาของคนแคระมีราคาเดียว คนแคระด้วยกันก็ต้องจ่าย
  choices:
    - id: tally_the_bids
      label: รับจ้างนั่งจดราคาประมูลให้สภาที่ประตูล่าง
      text: |
        {name}นั่งระหว่างโต๊ะประมูลสองตัว จดราคาที่สองฝั่งตะโกนแข่งกันลงกระดานหินด้วยชอล์ก คนของเมืองน้ำค้างพูดสุภาพ คนของเมืองถ่านพูดเร็ว ทั้งสองฝั่งเพิ่มราคาทีละเหรียญ ไม่มีใครยอมเพิ่มทีละสอง คนแคระที่คุมประตูยืนดูกระดาน ไม่พูดสักคำจนกว่าเสียงตะโกนจะหยุด แล้วชี้ตัวเลขสุดท้าย

        สิ้นฤดูสภาจ่ายค่าจ้าง{name}เป็นเหรียญที่ตีในชั้นโรงหลอมเอง หน้าหนึ่งเป็นรูปค้อน อีกหน้าว่าง ไม่มีตราของใคร
      effects: { gold: 3, reputation: { dwarf_council: 1 }, flags: [tallied_the_coal_bids] }
    - id: carry_coal_up_to_the_poor_levels
      label: ซื้อถ่านราคาของคนแคระกระสอบหนึ่ง แบกขึ้นไปให้ตระกูลจนชั้นบน
      habit: soft_heart
      text: |
        ธรรมเนียมเก่าของภูเขาว่าไฟแรกของหน้าหนาวในบ้านไหนต้องจุดด้วยถ่านที่บ้านนั้นไม่ได้ซื้อ ไม่มีใครทำมานานแล้ว ตั้งแต่ถ่านเป็นของที่ต้องส่งลงเขา {name}ซื้อหนึ่งกระสอบที่ประตูล่าง แบ่งใส่ตะกร้าเล็กให้คนแบกรับจ้างช่วยขึ้นถนนวน แจกบ้านละก้อนจนหมดกระสอบ

        คืนนั้นถนนวนชั้นบนมีควันขึ้นจากปล่องเป็นแถว เช้าวันต่อมามีคนแคระสามตระกูลลงไปซื้อถ่านที่ประตูล่าง แบกขึ้นมาแจกบ้านที่{name}ไปไม่ถึง ไม่มีใครบอกว่าทำตามใคร
      effects: { gold: -3, world: { land: 1 }, flags: [carried_coal_up_to_the_poor_levels], city: { merit: 1, here: true } }
    - id: sit_with_the_price_master
      label: ไปนั่งเป็นเพื่อนนายราคาที่โต๊ะว่างของเขา
      text: |
        นายราคาเป็นคนอาร์เวล ผมขาวทั้งหัว นั่งโต๊ะนี้มาตั้งแต่ก่อนบัลลังก์ว่าง เขาจำราคาถ่านได้ทุกปีที่เขาเป็นคนบอก ไล่ให้{name}ฟังทีละปีโดยไม่ต้องเปิดสมุด จนถึงปีที่ราคาขึ้นเป็นสามเท่า แล้วหยุด

        เขาบอกว่าไม่มีใครส่งกระดาษมาบอกให้เลิกนั่ง ตราขาวไม่ส่ง ตราเทาไม่ส่ง เขาจึงนั่งต่อ ตอนแยกกันเขาให้ชอล์กแท่งหนึ่งกับ{name} ชอล์กที่เคยใช้เขียนกระดานราคา ปลายยังแหลมอยู่
      effects: { stats: { WIS: 1 }, flags: [sat_with_the_old_price_master] }

# ---------- ข้าหลวงป่าไม้สองคน ----------
- id: adult.era_cities_two_forest_officers
  stage: adult
  weight: 24
  when:
    age: [16, 130]
    year: [373, 379]
    location_tag: ileth
  text: |
    หอนับดาวได้ข้าหลวงป่าไม้สองคน คนเก่าถือสมุดใบอนุญาตเล่มเดิม ตอนนี้ประทับตราขาวอย่างเดียว คนใหม่มาจากคาร์ดิน ถือสมุดตราเทาเล่มใหม่ กับโซ่วัดที่โรงหล่อของธนาคารทำ ห่วงโซ่ยาวกว่าห่วงของโซ่อาณาจักรนิดเดียว ต้นไม้ต้นเดียวกันวัดด้วยโซ่ใหม่ได้ห่วงน้อยกว่า ต้นที่เคยแก่เกินจะตัดจึงกลายเป็นต้นที่ตัดได้

    ลานโคนต้นให้กิ่งไม้แก่ข้าหลวงทั้งสอง คนละกิ่ง ห่อด้วยผ้าของกิ่ง และให้คำตอบเดียวกันทั้งสองคน ป่าไม่ได้ลงชื่อกับใคร ข้าหลวงคนใหม่เอากิ่งไปห้อยกับโซ่วัดของเขา วันรุ่งขึ้นเอลฟ์คนหนึ่งมาขอกิ่งนั้นคืน ผ้าของกิ่งไม่แตะเหล็ก

    สัปดาห์นี้ข้าหลวงทั้งสองมาหา{name}คนละวัน ไม่รู้ว่าอีกคนมาแล้ว ถามคำถามเดียวกัน ป่าแถบนี้ต้นไหนแก่
  choices:
    - id: tell_both_the_same
      label: ชี้ต้นเดียวกันให้ทั้งสองคน ตามที่รู้จริง
      text: |
        ข้าหลวงคนเก่าจดตามที่{name}ชี้ ทาสีขาวรอบโคนต้นไว้เป็นวง ข้าหลวงคนใหม่จดเหมือนกัน แล้วเดินไปวัดด้วยโซ่ของเขาเอง เขียนคำว่าอ่อนไว้ข้างคำว่าแก่ที่{name}บอก ทั้งสองคำอยู่บนต้นเดียวกันในสมุดเล่มเดียวกัน

        ปลายฤดูมีคนมาตัดต้นที่ไม่มีวงสีขาว ต้นที่มีวงยังยืนอยู่ คนตัดไม้ถือใบอนุญาตตราเทา แต่ไม่มีใครกล้าตัดต้นที่ข้าหลวงอีกคนทาสีไว้ เพราะสองเมืองจับเสมียนของกันและกันอยู่แล้ว ไม่มีใครอยากเป็นคนตัดไม้คนแรกที่โดนจับ
      effects: { alignment: { law: 1 }, flags: [told_both_officers_the_same] }
    - id: cross_their_books
      label: ชี้ต้นคนละชุดให้แต่ละคน ให้สมุดสองเล่มขัดกันเอง
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ชี้ต้นแก่ให้คนเก่าครึ่งหนึ่ง อีกครึ่งให้คนใหม่ แล้วชี้ต้นอ่อนจริงให้ทั้งสองคนเป็นต้นแก่ ปลายฤดูสมุดสองเล่มต้องส่งไปที่หอนับดาวเพื่อให้เอลฟ์ลงชื่อรับรู้ เอลฟ์ที่หอวางสมุดสองเล่มคู่กันบนโต๊ะ แล้วไม่ลงชื่อในเล่มไหน บอกว่าสองเล่มนี้ไม่ได้พูดถึงป่าเดียวกัน

          ปีนั้นไม่มีใบอนุญาตตัดไม้ออกจากสมุดเล่มไหนเลย ข้าหลวงทั้งสองนั่งเทียบสมุดกันที่โรงเตี๊ยมจนดึก โต๊ะเดียวกัน เป็นครั้งแรก
        effects: { stats: { WIS: 1 }, world: { land: 1 }, flags: [crossed_the_two_forest_books] }
      failure:
        text: |
          สมุดสองเล่มไม่ได้ขัดกันอย่างที่{name}คิด ข้าหลวงแต่ละคนเชื่อสมุดของตัวเอง ออกใบอนุญาตตามเล่มของตัวเอง ปลายฤดูมีต้นไม้โดนตัดสองชุด ชุดหนึ่งตามตราขาว อีกชุดตามตราเทา

          เอลฟ์จากลานโคนต้นมาเดินดูตอไม้ทั้งสองชุด ไม่ได้ถามว่าใครชี้ แต่ตั้งแต่นั้นเวลา{name}ผ่านลานโคนต้น ไม่มีใครเรียกเข้าไปนั่ง
        effects: { reputation: { star_hall: -1 }, flags: [crossed_the_two_forest_books] }
    - id: give_the_halls_answer
      label: ตอบทั้งสองคนแบบเดียวกับลานโคนต้น ป่าไม่ได้ลงชื่อกับใคร
      text: |
        ข้าหลวงคนเก่าหัวเราะ บอกว่าได้ยินประโยคนี้มาทั้งชีวิตแล้ว ข้าหลวงคนใหม่ไม่หัวเราะ เขาจดประโยคนั้นลงสมุดของเขาทั้งประโยค ใต้ชื่อ{name} ในช่องที่หัวข้อว่าคนที่ไม่ให้ความร่วมมือ

        ปลายสัปดาห์มีเอลฟ์จากลานโคนต้นมาวางกิ่งไม้กิ่งเล็กห่อผ้าของกิ่งไว้ที่หน้าประตู{name} ไม่ได้เคาะ ไม่ได้รอ
      effects: { reputation: { star_hall: 1 }, flags: [gave_the_halls_answer] }
    - id: sell_the_answer
      label: บอกต้นแก่ทั้งหมดให้ข้าหลวงคนใหม่ แลกค่าตอบแทนที่เขายื่นให้
      text: |
        ข้าหลวงคนใหม่จ่ายสามเหรียญ เหรียญตีจากคาร์ดิน สะอาดเหมือนเพิ่งออกจากแม่พิมพ์ เขาจดทุกต้นที่{name}ชี้ แล้ววัดด้วยโซ่ของเขาเองทีละต้น ต้นที่{name}บอกว่าแก่ที่สุดใหญ่จนโซ่ของเขาพันรอบไม่ถึง เขาจดไว้ว่าวัดไม่ได้ แล้วข้ามไป

        ต้นอื่นมีคนมาตัดก่อนหิมะแรก ต้นที่เหลือยืนอยู่ต้นเดียวกลางที่โล่ง {name}เดินผ่านตรงนั้นทุกวัน ไม่มีทางอื่นให้เดิน
      effects: { gold: 3, alignment: { moral: -1 }, flags: [sold_the_old_trees] }

# ---------- สมุดของแดนเถ้าเอง ----------
- id: adult.era_cities_the_ashlands_own_book
  stage: adult
  weight: 24
  when:
    age: [16, 130]
    year: [373, 379]
    location_tag: ashland
  text: |
    ปีสองเมือง คนเดินสมุดของทั้งสองตรากางโต๊ะไปทั่วอาร์เวล ไม่มีโต๊ะไหนมาถึงแดนเถ้า เหมือนทุกเรื่องที่ผ่านมา คนที่บ่อน้ำของถิ่น{name}เล่าเรื่องนี้ให้กันฟังแล้วหัวเราะ หัวเราะนานกว่าเรื่องตลกทั่วไปนิดหนึ่ง

    วงบ่อน้ำตัดสินเรื่องของถิ่นมาตลอดด้วยรอยบากบนไม้เวร บ้านละรอย คนแก่ที่สุดตักน้ำขึ้นถังหนึ่งเมื่อเรื่องจบ ปีนี้วงตกลงกันว่าจะเริ่มจดลงสมุดด้วย ใครแต่งกับใคร ใครติดใครเท่าไร บ่อไหนเป็นของบ้านไหน ของที่ไม่มีเมืองไหนจดให้ แดนเถ้าจะจดเอง หญิงสาวคนหนึ่งที่ไปเรียนหนังสือที่คาร์ดินมาซื้อสมุดปกหนังเล่มหนาจากร้านบนถนนสมุดบัญชี เขียนหน้าแรกเสร็จแล้ว

    ที่ยังไม่ตกลงคือจะเก็บสมุดไว้ที่ไหน บ้านดินในแดนเถ้ารั่วทุกหลัง หนูกินกระดาษ คนผูกด้ายแดงที่นั่งขอบวงมาตั้งแต่ปีป้อมสามบอกว่าห้องใต้ดินของกองแห้งที่สุดในถิ่น จะเก็บให้ ไม่คิดอะไร ใครอยากเปิดดูเมื่อไรก็ได้ วงหันมาฟังว่า{name}จะว่าอย่างไร
  choices:
    - id: let_the_red_thread_keep_it
      label: ให้คนด้ายแดงเก็บ
      text: |
        สมุดไปอยู่ในห้องใต้ดินของกอง แห้งจริง ไม่มีหนู ใครไปขอดูก็ได้ดูทุกครั้ง คนเฝ้าห้องจุดตะเกียงให้ ยกเก้าอี้ให้นั่ง แล้วยืนรออยู่ที่บันได ไม่เคยอ่านข้ามไหล่

        ปลายปี{name}ไปขอดูหน้าที่จดเรื่องบ่อของบ้านตัวเอง ระหว่างหน้ากระดาษมีด้ายแดงเส้นหนึ่งสอดไว้เป็นที่คั่น ไม่มีใครในวงจำได้ว่าใครสอด
      effects: { world: { demon: 1 }, flags: [let_the_red_thread_keep_the_book] }
    - id: keep_it_at_the_well
      label: ให้เก็บไว้ที่บ่อ ใต้หินฝาบ่อ ในหีบที่วงช่วยกันทำ
      text: |
        ช่างทำหีบหินใบเล็กใส่ใต้หินฝาบ่อ สมุดห่อผ้าทาน้ำมันสามชั้น ทุกครั้งที่วงตัดสินเรื่องหนึ่ง คนแก่ที่สุดตักน้ำขึ้นถังหนึ่งตามเดิม แล้วหญิงสาวคนนั้นยกหินฝาขึ้น เขียนหนึ่งบรรทัด อ่านออกเสียงให้วงฟัง แล้ววางหินคืน

        ขอบกระดาษชื้นเป็นคลื่น ตัวหมึกบางบรรทัดเริ่มซึม แต่อ่านออกทุกบรรทัด ไม้เวรที่มีรอยบากยังวางอยู่ข้างหีบ คนในวงอ่านทั้งสองอย่างคู่กัน
      effects: { world: { land: 1 }, flags: [kept_the_ashland_book_at_the_well] }
    - id: send_it_to_the_fort
      label: ส่งสมุดขึ้นไปฝากไว้ที่ป้อมของผู้เฝ้าผนึก
      text: |
        ผู้เฝ้าผนึกที่ป้อมรับสมุดไว้โดยไม่ต้องถาม คนจดของป้อมคัดทุกหน้าลงสมุดของป้อมอีกเล่มหนึ่ง แล้วส่งเล่มเดิมคืนมากับรถเข็นน้ำทุกฤดู ทุกครั้งที่สมุดกลับมา หน้าสุดท้ายมีลายมือของคนจดของป้อมเขียนไว้บรรทัดเดียว คัดแล้ว

        หลังจากนั้นทุกฤดูมีคนขี่ม้าจากป้อมลงมาที่บ่อ อ่านบรรทัดใหม่ๆ แล้วถามว่ายังมีบ้านไหนที่ยังไม่ได้จด
      effects: { reputation: { wardens: 1 }, flags: [sent_the_ashland_book_to_the_fort] }
    - id: keep_it_myself
      label: รับสมุดไปเก็บที่บ้านเอง อย่างที่เคยเฝ้าบ่อในปีป้อมสาม
      requires: { flag: held_the_well_in_the_fort_year }
      text: |
        วงไม่ต้องเถียงกัน คนที่เฝ้าบ่อมาตลอดหน้าหนาวปีนั้นเฝ้าสมุดได้ {name}เอาสมุดไปไว้ในหีบใต้เตียง ห่อผ้าสองชั้น ทุกครั้งที่วงตัดสินเรื่อง{name}เป็นคนถือสมุดมาที่บ่อ แล้วถือกลับ

        คนด้ายแดงที่ขอบวงยกถ้วยซุปขึ้นทีหนึ่ง แล้วไม่เสนอเรื่องห้องใต้ดินอีก ตั้งแต่นั้นเด็กๆ ในถิ่นเรียกบ้านของ{name}ว่าบ้านสมุด
      effects: { stats: { CHA: 1 }, flags: [kept_the_ashland_book_myself] }

# ---------- ลูกปีเขาโตแล้ว ----------
- id: adult.era_cities_horn_year_comes_of_age
  stage: adult
  weight: 24
  when:
    age: [16, 130]
    year: [373, 379]
    not_location_tag: ashland
  text: |
    ระฆังห้าเกิดในปีเขาพันคู่ ไปถึงวิหารอีเซลทางช่องขนมปังตอนตัวยังไม่เต็มตะกร้า นักบวชตั้งชื่อตามเสียงระฆังที่ตีอยู่ตอนพบตัว ตอนนี้สูงกว่าประตูวิหาร เขาสองข้างยาวเลยหูไปแล้ว ตะไบไม่ทันเลยเลิกตะไบ

    คนรับสมัครมาหาลูกปีเขาถึงที่ ตราเทาเสนอแถวหน้า เบี้ยสองเท่าที่ธนาคารจ่าย ตราขาวเสนอหัวเรือ เบี้ยเท่าที่ราชนาวีให้คนมีตรา คนผูกด้ายแดงไม่เสนออะไรเลย ตั้งหม้อซุป ตักให้ ไม่ถาม ไม่ขอ บอกแค่ว่าเจ้าของบ้านกำลังกลับมา อยากมาเมื่อไรก็มา

    เย็นนี้ระฆังห้ามายืนอยู่หน้าที่อยู่ของ{name} ไม่ได้มาขอข้าว มาของาน งานอะไรก็ได้ที่ไม่ต้องไปยืนหน้าอะไร หรือไม่ก็ขอให้{name}บอกว่าควรเลือกทางไหน ระฆังห้าว่าคนทั้งถิ่นมีคำแนะนำให้หมดแล้ว ยกเว้น{name}
  choices:
    - id: give_the_youth_work
      label: ให้งานทำ งานธรรมดาที่ไม่ต้องยืนหน้าอะไรทั้งนั้น
      habit: soft_heart
      text: |
        {name}ให้ระฆังห้าซ่อมรั้ว ผ่าฟืน ขนน้ำ ถอนหญ้า จ่ายตามแรง ไม่มาก ระฆังห้าทำงานช้า ละเอียด พักกินข้าวตรงเวลา ไม่เคยมาสาย คนรับสมัครทั้งสองตรามาถามหาที่หน้าบ้าน{name}คนละสองหน {name}บอกทุกหนว่าเด็กไม่ว่าง ติดงาน

        ปลายฤดูรั้วรอบที่อยู่ของ{name}เป็นรั้วที่ตรงที่สุดในถิ่น คนข้างบ้านมาถามว่าจ้างใครทำ แล้วมาจ้างระฆังห้าต่อ
      effects: { gold: -2, alignment: { moral: 1 }, flags: [gave_work_to_a_horn_year_youth], city: { merit: 1, here: true } }
    - id: tell_the_youth_to_take_the_pass
      label: บอกให้ไปยืนแถวหน้าสักฤดู เอาใบเว้นหน้ามา แล้วกลับมาใช้ชีวิต
      text: |
        {name}บอกตามที่คิด ใบเว้นหน้าคือกระดาษใบเดียวในโลกตอนนี้ที่ทั้งสองตรายอมรับ คนเสื้อคลุมขาวแตะต้องไม่ได้ ธนาคารจ้างงานดีๆ ให้ หนึ่งฤดูแลกกับทั้งชีวิตที่เหลือ ระฆังห้าฟังจนจบ แล้วถามว่าคนที่ยืนแถวหน้าแล้วไม่ได้กลับมาได้ใบอะไร

        ระฆังห้าไปในฤดูนั้น กลับมาตอนหิมะละลาย พร้อมกล่องสังกะสีใบเล็ก ใบเว้นหน้าพับสี่ทบอยู่ข้างใน มาบอก{name}ที่หน้าบ้านว่ากลับมาแล้ว แล้วถามว่ารั้วยังต้องซ่อมไหม
      effects: { alignment: { law: 1 }, flags: [told_a_horn_year_youth_to_take_the_pass] }
    - id: stand_witness_at_the_pot
      label: เดินไปกับระฆังห้าถึงหม้อซุป ยืนเป็นพยานให้ ถ้าจะรับถ่าน
      text: |
        หญิงผูกด้ายแดงที่หม้อซุปตักซุปให้ทั้งสองคนก่อน แล้ววางถ่านลงในมือระฆังห้า ประโยคเดิม วางด้วยมือตัวเอง แล้วอย่าย้าย นางหันมาถามชื่อ{name} บอกว่าเจ้าของบ้านอยากรู้ว่าใครพามา {name}บอกชื่อ นางไม่ได้จด

        ระฆังห้าวางถ่านลงบนธรณีห้องเช่าเล็กๆ หลังโรงสีด้วยมือขวา ไม่มีครอบครัวให้ปกป้อง ไม่มีของให้เฝ้า ฝ่ามือข้างที่วางยังค้างอยู่เหนือถ่านอีกพักหนึ่ง {name}ยืนอยู่ข้างประตูจนระฆังห้าลุกขึ้นยืน แล้วเดินกลับบ้านคนเดียว
      effects: { world: { demon: 1 }, flags: [stood_witness_to_a_horn_year_coal] }
    - id: what_you_already_have
      label: บอกว่าของที่ทุกฝ่ายอยากซื้อ ระฆังห้ามีอยู่แล้ว ไม่ต้องขายให้ใคร
      requires: { trait: curse_brand }
      text: |
        {name}พาระฆังห้าไปนั่งธรณีบ้านคนในคืนที่หมาหอน ห่มผ้าคนละผืน นั่งคนละฟากซอย บ้านที่ไม่มีถ่านจ่ายเป็นขนมปัง บางบ้านจ่ายเหรียญ ไม่มีบ้านไหนให้ลงชื่อ ไม่มีใครให้ยืนหน้าใคร ฝูงมาถึงปากซอยหนหนึ่ง ยืนอยู่ตรงนั้น แล้วเลี้ยวกลับ

        ตอนสาง ระฆังห้านับขนมปังที่ได้ทั้งคืน แบ่งให้{name}ครึ่งหนึ่งโดยไม่ต้องบอก แล้วถามว่าคืนพรุ่งนี้ซอยไหน
      effects: { stats: { CHA: 1 }, gold: 1, flags: [taught_a_horn_year_youth_to_sit_doorsteps] }

# ---------- ชกกันกลางตลาด ----------
- id: elder.era_cities_fists_in_the_market
  stage: elder
  weight: 24
  scene: market
  when:
    age: [60, 130]
    year: [373, 379]
    not_location_tag: ashland
  text: |
    ตั้งแต่ถนนเริ่มมีเรื่องชกกัน แม่ค้าผักในลานตลาดก็วางถังน้ำไว้ใต้แผงทุกร้าน ไว้สาด ยามตลาดรับพนันอยู่ข้างโต๊ะชั่ง ชกกันแต่ละครั้งจบในชั่วต้มไข่ และเริ่มจากเรื่องเดียวกันทุกครั้ง ใครยืนแจกของตรงไหน

    วันนี้เริ่มที่แผงผักของป้าขายผักกาด ตรงที่{name}กำลังเลือกหัวผักกาดอยู่ คนถุงมือขาวสองคนกับคนผูกด้ายแดงสามคน คนหนึ่งผลักอีกคนล้มลงไปในกองกะหล่ำ เสาผ้าใบของแผงเอนไปข้างหนึ่ง ป้าขายผักกาดกอดเสาไว้ทั้งตัว ส่งเสียงด่าทั้งสองฝ่ายด้วยคำที่{name}ไม่ได้ยินมาตั้งแต่สมัยยังหนุ่มสาว

    กะหล่ำกลิ้งมาหยุดที่ปลายเท้า{name}หัวหนึ่ง
  choices:
    - id: pull_them_apart
      label: ตวาดให้หยุด แล้วเข้าไปยืนตรงกลาง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เสียงของ{name}ดังกว่าที่ทุกคนคิด ดังกว่าที่{name}คิดด้วย ทั้งห้าคนหยุด เพราะไม่มีใครอยากเป็นคนผลักคนแก่ต่อหน้าคนทั้งตลาด {name}ยืนอยู่ตรงกลาง ชี้ให้ฝั่งหนึ่งไปยืนทางซ้าย อีกฝั่งไปทางขวา แล้วบอกให้จ่ายค่ากะหล่ำ

          ทั้งสองฝ่ายจ่าย คนถุงมือขาวจ่ายเป็นเหรียญ คนด้ายแดงจ่ายเป็นเหรียญกับซุปหนึ่งหม้อสำหรับป้า ยามตลาดคืนเงินพนันให้ทุกคน เพราะไม่มีฝ่ายไหนชนะ
        effects: { stats: { CHA: 1 }, flags: [stopped_the_market_fight], city: { merit: 1, here: true } }
      failure:
        text: |
          {name}ตวาดได้คำเดียว ศอกของใครสักคนก็มาโดนซี่โครง ล้มลงนั่งบนลังผักกาด ทั้งห้าคนชกกันต่อเหมือนไม่มีใครตวาด จนป้าขายผักกาดปล่อยเสา ยกถังน้ำสาดทีเดียวเปียกทั้งหกคน รวม{name}

          ทุกคนลุกขึ้นเดินออกไปคนละทาง ป้าเอาผ้ามาเช็ดหน้าให้{name} บ่นว่าอายุขนาดนี้แล้วยังจะเข้าไปยืนตรงกลางอีก ซี่โครงเจ็บไปครึ่งเดือน
        effects: { hp: -1, flags: [stopped_the_market_fight] }
    - id: side_with_the_red_thread
      label: ยกถังน้ำใต้แผงสาดใส่คนถุงมือขาว
      habit: hot_headed
      text: |
        คนถุงมือขาวสองคนเปียกตั้งแต่หัวจรดเท้า ถุงมือหนังขาวเปียกน้ำแล้วเป็นสีเทา ทั้งสองคนถอยออกจากแผง สะบัดบัตรหมึกน้ำเงินที่เปียกจนหมึกไหล คนด้ายแดงสามคนลุกขึ้นปัดกะหล่ำออกจากเสื้อ คนหนึ่งยกมือแตะหน้าผากให้{name}

        เย็นนั้นมีซุปหนึ่งหม้อมาวางที่หน้าบ้าน{name} หม้อยังร้อน ไม่มีใครเคาะประตู ไม่มีถ่านวางมาด้วย
      effects: { world: { demon: 1 }, flags: [sided_with_the_red_thread_in_the_market] }
    - id: side_with_the_white_gloves
      label: เอาไม้เท้าขัดขาคนด้ายแดงที่กำลังจะเข้าไปซ้ำ
      habit: hot_headed
      text: |
        คนด้ายแดงล้มคว่ำลงบนกองหัวผักกาด คนถุงมือขาวสองคนจับแขนเขาไว้ได้ทันที เรื่องจบตรงนั้น คนถุงมือขาวคนหนึ่งเดินมาช่วยพยุง{name}ที่เสียหลักเพราะไม้เท้า มือในถุงมือหนังเย็นกว่ามือคนทั่วไป

        เขายื่นบัตรหมึกน้ำเงินให้{name}หนึ่งใบ มุมบัตรมีดาวเจ็ดแฉกดวงเล็ก บอกว่าคำถามหนึ่งข้อ ไม่คิดเงิน เมื่อไรก็ได้ {name}เหน็บบัตรไว้ที่กรอบกระจกในบ้าน ทุกเช้าที่ส่องกระจกหวีผม คำถามที่คิดไว้เปลี่ยนไปไม่ซ้ำกัน
      effects: { world: { star: 1 }, flags: [sided_with_the_white_gloves_in_the_market] }
    - id: hold_up_the_stall
      label: เข้าไปช่วยป้ากอดเสาผ้าใบไว้ไม่ให้แผงล้ม
      habit: soft_heart
      text: |
        {name}กับป้าขายผักกาดกอดเสาคนละข้าง เสาเอนไปทางหนึ่ง ทั้งสองคนเอนไปอีกทาง คนชกกันวนรอบแผงสามรอบ ไม่มีใครชนเสาซ้ำ แผงยืนอยู่ได้ ผ้าใบขาดไปหนึ่งมุม ผักกาดเหลือครึ่งกอง

        ตั้งแต่วันนั้นทุกวันตลาด ป้าขายผักกาดเก็บหัวที่ดีที่สุดไว้ใต้แผงหนึ่งหัว ห่อผ้าไว้รอ ไม่ยอมรับเงิน บอกว่าคนที่กอดเสาด้วยกันมาแล้วไม่ต้องจ่าย
      effects: { stats: { CON: 1 }, flags: [held_up_the_vegetable_stall], city: { merit: 1, here: true } }
