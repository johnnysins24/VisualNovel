# ชุด 3 องค์กร: ภาคีผู้เฝ้าผนึก (wardens) ไฟล์ ข งานอีก 2 เรื่อง เลื่อนยศ 4 เรื่อง ความลับ 4 เรื่อง ถูกตามล่าและออกจากป้อม 4 เรื่อง
# คนประจำป้อมเหมือนไฟล์ ก (บรอนกา เอสทริน เบอร์ทัล) เพิ่ม โยแรน ผู้ถือกุญแจป้อมห้า · อูเลส คนเลี้ยงล่อทีฟลิ่งที่ถือกุญแจป้อมสามจนตาย
#   ฮาร์เมก ผู้เฒ่าป้อมหก · คาลิน ผู้เฝ้าหนุ่มที่หลับเวร · นิสซา หลานสาวของโยแรน ทุกคนมีแต่ในข้อความ
# บรอนกาลงจากตำแหน่งในฉากขึ้นยศ 4 เรื่องที่นางยังเป็นผู้เฒ่าจึงกัน max_rank: 3
# ลำดับความลับ: ลงบันไดห้องล่างครั้งแรก (went_down_the_stair) → ห้องล่างป้อมห้าเงียบ (found_fort_five_silent) → เหตุที่โยแรนเลิกเคาะ
# ผลงานเพิ่มนอกงาน: ความลับเรื่องลายมือชื่อ 1 · เคาะครั้งแรก 2 · เคาะแทนป้อมห้า 1 · ลงไปกับโยแรน 1 รวม 5
# ทรยศ: ล้าง flag งานทั้งสอง ชื่อเสียงภาคี −3 ตั้ง sold_the_fort กับ left_the_fort ไม่แตะ hunted ของภาคี

# ---------- งานที่ภาคีส่งมา (ไฟล์ ข: 2 เรื่อง) ----------
- id: adult.wardens_duty_fort_five_oil
  stage: adult
  scene: road
  weight: 20
  duty: wardens
  when:
    age: [28, 64]
    org: { id: wardens, min_rank: 2 }
  text: |
    เด็กเลี้ยงล่อของป้อมห้ามาถึงป้อมสามตอนเที่ยง ขี่ล่อเปล่ามาสองวันเต็ม ริมฝีปากแตกเป็นร่องเพราะลมเถ้า ในมือมีกระดาษแผ่นเดียว ลายมือของโยแรน ผู้ถือกุญแจของป้อมห้า ขอยืมน้ำมันตะเกียงสี่ถัง ใช้คืนเมื่อเงินฤดูหน้ามาถึง ท้ายกระดาษเขียนคำว่าขอบคุณไว้สองครั้ง

    เอสทรินเปิดสมุดคลังวางข้างกระดาษแผ่นนั้น ป้อมห้าขอน้ำมันมาแล้วสามหนาวติดกัน ปีละมากขึ้น คนเท่ากัน หินเท่ากัน ขอเหล็กเท่ากัน นางวางปลายขอเหล็กทับตัวเลขสามบรรทัดนั้นทีละบรรทัด แล้วเขียนชื่อ{name}ลงช่องเกวียน

    ทางไปป้อมห้าเลียบแนวหินไปทางตะวันออกสองวัน ผ่านป้อมสี่ที่จุดตะเกียงเว้นขอ ถึงประตูป้อมห้าตอนตะวันตกดินของวันที่สอง ตะเกียงบนแนวหินของป้อมห้าจุดครบทุกขอ สว่างกว่าแนวของป้อมไหนที่{name}เคยเห็น เถ้าที่โคนหินก้อนแรกอุ่นทะลุพื้นรองเท้า
  choices:
    - id: unload_and_sign
      label: ขนน้ำมันลงตามจำนวน ให้โยแรนลงชื่อรับ แล้วกลับ
      text: |
        โยแรนเป็นชายแก่ไหล่ห่อ หนวดขาวเหลืองตรงมุมปากเพราะกล้องยา กุญแจเหล็กดอกยาวห้อยเข็มขัดอยู่ข้างถุงยาเส้น มือที่จับปากกาสั่นจนต้องเอาข้อมืออีกข้างกดไว้ เขาลงชื่อรับ แล้วขอบคุณซ้ำอีกสองครั้งตามที่เขียนในกระดาษ

        {name}ออกจากป้อมห้าก่อนสาง ระหว่างทางผ่านผู้นับหินของป้อมห้าที่กำลังเดินนับ เขาวางมือบนหินแต่ละก้อนสั้นกว่าหนึ่งลมหายใจ แล้วเขียนลงสมุดทุกก้อน ตัวอักษรเดียวกันทุกบรรทัด
      effects: { reputation: { wardens: 1 }, flags: [lent_oil_to_fort_five] }
    - id: stay_for_the_count
      label: ค้างหนึ่งคืน ขอเดินนับหินกับผู้นับหินของป้อมห้าตอนเช้ามืด
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ผู้นับหินของป้อมห้ายังหนุ่ม ไม่ขัดที่มีคนเดินตาม {name}วางฝ่ามือลงตามเขาทีละก้อน หินก้อนแรกอุ่น ก้อนที่สามร้อนจนต้องนับลมหายใจเร็วขึ้น ก้อนกลางแนวสี่ก้อนร้อนเท่าก้อนที่สามสิบหกของป้อมสามในคืนที่มันแตก ผู้นับหินหนุ่มเขียนว่านิ่งทั้งสิบหกบรรทัด

          {name}ถามว่าร้อนแบบนี้มานานเท่าไรแล้ว เขาตอบว่าตั้งแต่เขามาถึง หินป้อมห้าก็อุ่นแบบนี้ทุกเช้า โยแรนบอกเขาตั้งแต่วันแรกว่าหินแต่ละป้อมอุ่นไม่เท่ากัน
        effects: { stats: { WIS: 1 }, flags: [lent_oil_to_fort_five, felt_fort_five_warm] }
      failure:
        text: |
          ผู้นับหินของป้อมห้ายืนขวางหน้าหินก้อนแรก บอกว่าคนป้อมอื่นไม่แตะหินของป้อมห้า ธรรมเนียมเก่า {name}ก้าวเลี่ยงไปทางซ้าย เขาก็ก้าวตาม จนศอกของ{name}กระแทกขอเหล็กเต็มแรง

          โยแรนออกมาห้ามด้วยตัวเอง ยื่นชาร้อนให้ถ้วยหนึ่ง แล้วเดินคุยเรื่องราคาน้ำมันไปส่ง{name}ถึงเกวียน ตอนออกจากประตู แดดขึ้นแล้ว หินทุกก้อนอุ่นด้วยแดดเท่ากันหมด
        effects: { hp: -1, flags: [lent_oil_to_fort_five] }
    - id: bless_their_boxes
      label: ขอดูห้องที่ป้อมห้าเก็บกล่องดีบุกของคนตาย
      requires: { flag: job_fort_priest }
      text: |
        ป้อมห้าไม่มีนักบวชมาหลายหนาว กล่องดีบุกวางซ้อนกันอยู่ในมุมห้องเก็บแป้ง ยี่สิบสามใบ บางใบยังไม่ได้ขูดชื่อ {name}สวดส่งทีละใบจนดึก เด็กเลี้ยงล่อนั่งถือเทียนให้ตลอด

        ชื่อที่ขูดไว้บนฝาส่วนใหญ่มีเลขหินกำกับ เลขหินเหล่านั้นอยู่กลางแนวของป้อมห้าเกือบทั้งหมด และกล่องที่ขูดเลขไว้ใหม่ที่สุดมีมากกว่ากล่องเก่าสองเท่า
      effects: { stats: { WIS: 1 }, flags: [lent_oil_to_fort_five, blessed_fort_five_dead] }
    - id: ask_about_the_quiet
      label: ถามโยแรนถึงที่สาวกลัทธิเถ้าพูดเรื่องห้องล่างของบางป้อมที่เงียบ
      requires: { flag: heard_of_a_quiet_fort }
      text: |
        โยแรนหัวเราะ เสียงหัวเราะออกมาก่อนคำถามจะจบ บอกว่าพวกเสื้อดำพูดได้ทุกเรื่อง ปากไม่มีภาษี แล้วรินชาให้{name}อีกถ้วย ชาหกลงบนโต๊ะครึ่งถ้วย เขาเอาแขนเสื้อเช็ด เช็ดจนโต๊ะแห้งแล้วก็ยังเช็ดต่อ

        คืนนั้น{name}นอนห้องที่อยู่เหนือห้องเก็บน้ำมันของป้อมห้า ทั้งคืนไม่มีเสียงกลอนเหล็กเลื่อนสักครั้ง
      effects: { flags: [lent_oil_to_fort_five, asked_yoran_about_the_quiet] }
    - id: send_the_boy_back
      label: บอกเอสทรินว่าให้เด็กเลี้ยงล่อขับเกวียนกลับไปเอง
      refuse: true
      text: |
        เด็กเลี้ยงล่อขับเกวียนน้ำมันสี่ถังออกจากป้อมสามตอนสาย นั่งตัวตรงบนที่นั่งคนขับ ตัวเล็กจนเท้าแตะไม่ถึงไม้พักเท้า

        ปลายเดือนกระดาษแผ่นหนึ่งมาถึงจากป้อมห้า เขียนว่าได้รับครบสี่ถัง ขอบคุณสองครั้ง เอสทรินขีดช่องปัดของ{name}หนึ่งเส้น แล้วหนีบกระดาษแผ่นนั้นไว้ในสมุดคลังหน้าเดียวกับอีกสามแผ่น
      effects: { flags: [sent_oil_with_the_boy] }

- id: adult.wardens_duty_judgement
  stage: adult
  scene: fort
  weight: 20
  time: dusk
  duty: wardens
  when:
    age: [32, 64]
    org: { id: wardens, min_rank: 3, max_rank: 3 }
  text: |
    คาลิน ผู้เฝ้าที่ยังอยู่ป้อมไม่ครบสามหนาว หลับที่หินก้อนที่สามสิบหกเมื่อคืน หลับในท่านั่งพิงหิน หอกพาดตัก ตะเกียงบนขอเหล็กหมดน้ำมันดับไปตอนตีสอง ไม่มีอะไรข้ามแนว คนกะเช้าเจอเขายังหลับ แก้มแนบหินด้านที่อุ่น ริมฝีปากขยับเหมือนตอบคำถามใครสักคน

    ธรรมเนียมของป้อมสามให้ผู้ถือกุญแจเป็นคนตัดสินเรื่องหลับเวร ผู้เฒ่าเก็บไว้ตัดสินเรื่องที่ใหญ่กว่านั้น หนาวนี้บรอนกาชี้ไม้เท้ามาทาง{name}

    ห้องกินข้าวเลื่อนโต๊ะไปชิดผนังให้ คาลินยืนกลางห้อง สองมือกำเข็มขัด หลังของเขาคือผนังหัวหอก หัวหอกเหล็กเรียงเป็นแถว ใต้แต่ละอันมีชื่อสลักบนไม้ บางชื่อ{name}ยังจำเสียงหัวเราะได้ ธรรมเนียมเก่าที่สุดของป้อมให้คนหลับเวรกลับไปยืนหินก้อนเดิมคนเดียวหนึ่งเดือน ทุกคืน ไม่มีคู่
  choices:
    - id: by_the_custom
      label: ตัดสินตามธรรมเนียม หนึ่งเดือนที่หินก้อนเดิม คนเดียว
      text: |
        คาลินยืนหินก้อนที่สามสิบหกครบสามสิบคืน ไม่หลับอีก คืนที่ยี่สิบเขามากินข้าวเช้าด้วยมือที่ยังกำด้ามหอกไม่คลาย ต้องให้เบอร์ทัลป้อนน้ำแกงสองช้อนแรก

        พอครบเดือน เขามาขอเอสทรินให้เขียนชื่อเขาไว้ที่หินก้อนที่สามสิบหกต่อไปอีกหนึ่งหนาว เอสทรินเขียนให้ แล้วขีดช่องรับของ{name}ไว้บรรทัดเดียวกับบรรทัดคำตัดสิน
      effects: { alignment: { law: 1 }, flags: [judged_the_sleeper] }
    - id: stand_beside_him
      label: ตัดสินตามธรรมเนียม แล้วไปยืนหินก้อนข้างๆ เขาทุกคืนจนครบเดือน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          สามสิบคืน{name}ยืนหินก้อนที่สามสิบเจ็ด ห่างคาลินสิบหกก้าว ไม่ได้คุยกัน ไม่ได้ส่งเสียงเรียก แค่ตะเกียงสองดวงที่จุดอยู่ใกล้กันพอให้เห็นว่าอีกคนยังยืน คืนที่สิบเก้าจุดแดงขึ้นมาหน้าหินก้อนที่สามสิบหก คาลินแทงทีเดียวถูกกลางถ่าน

          เช้าวันสุดท้าย หลังของ{name}เกร็งจนต้องเดินกลับป้อมด้วยไม้ค้ำของเบอร์ทัล คาลินเดินถือหอกให้สองด้าม
        effects: { stats: { CON: 1 }, flags: [judged_the_sleeper, stood_with_kalin] }
      failure:
        text: |
          คืนที่สิบสอง{name}หลับไปเองโดยไม่รู้ตัว ตื่นมาเพราะมีมือเขย่าไหล่ คาลินทิ้งหินของตัวเองเดินมาสิบหกก้าว ปลุกเสร็จแล้วเดินกลับไปยืนที่เดิมทันที ตะเกียงของเขาจุดอยู่ไม่ได้ดับ

          ไม่มีใครเขียนคืนนั้นลงสมุดเวร หลังเดือนนั้น{name}ปวดสะโพกทุกครั้งที่ฝนจะตก
        effects: { hp: -2, flags: [judged_the_sleeper, kalin_woke_you] }
    - id: hear_his_dream
      label: พาเขาไปห้องสวดก่อน ฟังว่าเมื่อคืนเขาฝันอะไร
      requires: { flag: job_fort_priest }
      text: |
        คาลินเล่าว่าเสียงทุ้มเสียงหนึ่งพูดกับเขาตอนตีหนึ่ง เสียงใจดีกว่าแม่เขาเสียอีก บอกว่าเขาเหนื่อยมาทั้งหนาวแล้ว หลับเถอะ เสียงนั้นจะเฝ้าหินให้เอง {name}ฟังจนจบ แล้วสวดบทล้างหูของ{god}ให้เขาสามรอบ

        คำตัดสินของ{name}คือหนึ่งเดือนที่หินก้อนเดิม แต่ทุกคืนก่อนลงไปยืน คาลินต้องมาที่ห้องสวด บอกให้{name}ฟังว่าเมื่อคืนเสียงนั้นพูดอะไร คืนที่สิบแปดเขามาบอกว่าเมื่อคืนเสียงนั้นไม่ได้พูดอะไรเลย
      effects: { stats: { WIS: 1 }, flags: [judged_the_sleeper, heard_kalins_dream] }
    - id: pass_to_bertal
      label: ส่งเรื่องให้เบอร์ทัลตัดสินแทน บอกว่าตัวเองเคยหลับเวรมาก่อน
      refuse: true
      text: |
        เบอร์ทัลตัดสินตามธรรมเนียมทุกคำ หนึ่งเดือน หินก้อนเดิม คนเดียว แล้วกะเผลกกลับเข้าครัวไปต้มน้ำแกงต่อ

        เอสทรินขีดช่องปัดของ{name}หนึ่งเส้น คาลินผ่านโต๊ะของ{name}ไปทุกเช้าตลอดเดือนนั้น ถือชามข้าวไปนั่งกินกับคนกะเดียวกันที่อีกโต๊ะ
      effects: { flags: [passed_kalins_judgement] }

# ---------- เลื่อนยศ ----------
- id: adult.wardens_rise_counter
  stage: adult
  scene: fort
  weight: 60
  must: true
  time: night
  mark: ขึ้นเป็นผู้นับหิน
  when:
    age: [19, 80]
    org: { id: wardens, min_rank: 1, max_rank: 1, ready: true }
  text: |
    คืนแรกของฤดูหนาว ป้อมสามดับไฟในห้องกินข้าวแล้วออกไปยืนเรียงหน้าแนวหินเหมือนทุกปี บรอนกาเดินจากหัวแถว ไม้เท้าเหล็กจิ้มเถ้าทีละก้าว มาหยุดตรงหน้า{name} แล้วขานชื่อ{name} เสียงไม่ดังกว่าตอนขานชื่อคนอื่นในปีก่อนๆ แล้วนางก็เดินต่อไปท้ายแถว

    ไม่มีใครตบไหล่ ไม่มีเหล้า ก่อนตีห้าเอสทรินมาสะกิดถึงเตียง ยื่นสมุดนับหินให้ เป็นเล่มที่ใช้อยู่ ปกหนังแพะดำเพราะมือคน หน้าล่าสุดมีลายมือของผู้นับหินคนก่อนลงไว้เมื่อวาน ใต้ลายมือชื่อนั้นยังว่าง ปลายปีสมุดเล่มนี้จะขึ้นขบวนถ่านไปถึงราชสำนักที่เวนทราส ราชสำนักไม่อ่านอะไรอย่างอื่นจากป้อมสามเลย

    ข้างนอกยังมืด ตะเกียงบนขอเหล็กเหลือน้ำมันก้นดวง หินสิบหกก้อนรออยู่ในแสงนั้น วางฝ่ามือทีละก้อน นานเท่าหายใจเข้าออกสามครั้ง แล้วเขียนว่าครบและนิ่ง หรือเขียนอย่างอื่นตามที่มือรู้
  choices:
    - id: count_and_sign
      label: เดินวางมือให้ครบสิบหกก้อน แล้วลงชื่อ
      text: |
        หินเย็นทุกก้อน เย็นแบบหินที่ค้างน้ำค้างมาทั้งคืน {name}เขียนว่าครบและนิ่ง แล้วลงชื่อใต้ชื่อของผู้นับหินคนก่อน ลายมือตัวเองบนหน้านั้นดูเหมือนลายมือของคนแปลกหน้า

        กลับเข้าห้องกินข้าว เอสทรินรับสมุดไปวางคืนบนหิ้ง ข้างสมุดเวร แล้วตักน้ำแกงชามแรกของวันให้ ก่อนคนกะดึกจะเข้ามา
      effects: { org: { id: wardens, promote: true }, alignment: { law: 1 }, flags: [signed_first_count] }
    - id: count_twice
      label: นับสองรอบ รอบที่สองนับย้อนจากก้อนสุดท้ายกลับมา
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          รอบแรกหินเย็นทุกก้อน รอบที่สอง ก้อนที่สามสิบหกอุ่นกว่ารอบแรกนิดเดียว นิดพอให้ฝ่ามือรู้แต่ปากยังเรียกว่าเย็น {name}เขียนว่าครบและนิ่ง แล้วเขียนตัวเลขเล็กๆ ไว้ท้ายบรรทัดของก้อนที่สามสิบหก เลขสอง

          บรอนกาเปิดดูหน้านั้นตอนสาย ใช้นิ้วเคาะเลขสองนั้นหนึ่งครั้ง แล้วปิดสมุด
        effects: { org: { id: wardens, promote: true }, stats: { WIS: 1 }, flags: [signed_first_count] }
      failure:
        text: |
          รอบที่สองยังไม่ถึงครึ่งแนว แดดแรกก็ขึ้นมาส่องหลังหิน หินทุกก้อนเริ่มอุ่นเท่ากันหมด {name}เดินนับต่อจนครบ แล้วลงชื่อในสมุดตอนฟ้าสว่างเต็มที่

          บรอนกายืนรออยู่ที่ปลายแนวตั้งแต่เมื่อไรไม่มีใครรู้ นางบอกว่านับในแดดคือนับแดด แล้วยื่นมือมารับสมุดไปถือเอง
        effects: { org: { id: wardens, promote: true }, flags: [signed_first_count, counted_into_the_sun] }
    - id: pray_for_the_counter
      label: สวดบทสั้นให้ตัวเองก่อนวางมือบนหินก้อนแรก
      requires: { flag: job_fort_priest }
      text: |
        ผู้นับหินของป้อมสามเดินนับคนเดียวมาทุกเช้า ไม่มีใครยืนสวดให้ที่ปลายแนว เช้านี้{name}สวดบทนั้นให้ตัวเองเบาๆ บทที่สั้นที่สุดที่{god}มี แล้วเริ่มวางมือ

        หินนิ่งทุกก้อน {name}ลงชื่อ ตอนเดินกลับ ผู้เฝ้าหนุ่มสองคนที่เพิ่งลงกะดึกยืนรออยู่ที่ประตู แตะไหล่{name}คนละครั้งตอนเดินสวน
      effects: { org: { id: wardens, promote: true }, stats: { CHA: 1 }, flags: [signed_first_count] }
    - id: own_handprint
      label: วางมือบนหินก้อนที่สามสิบหกตรงรอยปูนที่เป็นรอยมือตัวเอง
      requires: { flag: sealed_stone_36 }
      text: |
        ปูนในรอยร้าวแห้งแข็งมาหลายหนาวแล้ว รอยนิ้วทั้งห้ายังอยู่ครบ ลึกพอให้น้ำค้างขังเป็นหยด ฝ่ามือของ{name}วางลงไปพอดีร่อง หินข้างใต้เย็น เย็นตลอดสามลมหายใจ

        {name}เขียนว่าครบและนิ่ง ลงชื่อ บรรทัดของก้อนที่สามสิบหก ผู้นับหินคนก่อนๆ เขียนชื่อหินก้อนนี้ไว้ในวงเล็บด้วยชื่อของ{name} ทุกเช้ามาหลายหนาวแล้ว
      effects: { org: { id: wardens, promote: true }, stats: { CON: 1 }, flags: [signed_first_count] }

- id: adult.wardens_rise_key
  stage: adult
  scene: fort
  weight: 60
  must: true
  time: night
  mark: ขึ้นเป็นผู้ถือกุญแจ
  when:
    age: [19, 80]
    org: { id: wardens, min_rank: 2, max_rank: 2, ready: true }
  text: |
    อูเลส คนเลี้ยงล่อของป้อมสาม ตายในคอกล่อเมื่อปลายฤดูฝน นั่งพิงรางหญ้าอยู่อย่างนั้นเหมือนพักเหนื่อย ทีฟลิ่งแก่คนนั้นอยู่ป้อมมานานกว่าใคร ไม่เคยยืนเวร ไม่เคยนับหิน คนในป้อมเพิ่งรู้วันแต่งศพว่าอูเลสห้อยกุญแจเหล็กดอกยาวไว้ใต้เสื้อมาทั้งชีวิต เชือกหนังที่ร้อยกุญแจขาดแล้วต่อใหม่ด้วยเงื่อนตายเจ็ดเงื่อน

    คืนแรกของฤดูหนาว บรอนกาขานชื่อ{name}หน้าแนวหิน แล้วไม่ได้เดินกลับเข้าป้อมทันทีเหมือนทุกปี นางพา{name}ไปที่คอกล่อ ล่อแก่ของอูเลสยังยืนอยู่ข้างรางหญ้าเดิม นางวางกุญแจดอกนั้นลงในมือ{name} ยังอุ่นจากที่เหน็บเข็มขัดนางมาทั้งวัน ด้ามเหล็กสึกเป็นรอยเว้าตรงกลาง เหมือนกุญแจของนางเอง

    เบอร์ทัลยืนรออยู่ที่ประตูคอก ไม้ค้ำใต้รักแร้ข้างซ้าย กุญแจดอกเล็กของเขาห้อยอยู่นอกเสื้อ เขาบอกเรื่องเดียว อย่าลงไปห้องล่างจนกว่าเขาจะบอก ส่วนจะบอกเมื่อไร เขาไม่ได้บอก
  choices:
    - id: wear_it_on_the_cord
      label: ร้อยกุญแจกลับเข้าเชือกหนังเส้นเดิม ห้อยคอไว้ใต้เสื้อ
      text: |
        เชือกเส้นนั้นมีกลิ่นล่อกับกลิ่นยาเส้นของอูเลส {name}ไม่ได้เปลี่ยน เงื่อนตายเจ็ดเงื่อนกดเป็นรอยบนหน้าอกทุกครั้งที่นอนคว่ำ

        เที่ยงคืนแรกที่มีกุญแจอยู่ใต้เสื้อ {name}ได้ยินกลอนประตูเหล็กใต้ห้องเก็บน้ำมันเลื่อนเปิด เสียงไม้ค้ำลงบันไดหินทีละขั้น ครึ่งชั่วยามต่อมาเลื่อนปิด เสียงเดิมที่ได้ยินมาทุกคืนตั้งแต่หนาวแรก คืนนี้กุญแจบนอกเย็นขึ้นตอนกลอนเลื่อนเปิด
      effects: { org: { id: wardens, promote: true }, items: [wardens_fort_key], flags: [carries_ules_key] }
    - id: ask_bertal_what_is_down
      label: ตามเบอร์ทัลไปถึงครัว ถามว่าห้องล่างมีอะไร
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เบอร์ทัลวางไม้ค้ำพิงเตา นั่งลงบนกระสอบแป้ง บอกว่าห้องล่างไม่มีอะไรให้ดู มีแต่ให้ฟัง แล้วเงียบไปจนน้ำในหม้อเดือด ก่อน{name}จะลุก เขาบอกอีกประโยคหนึ่ง อูเลสลงคืนคู่ เขาลงคืนคี่ มาสามสิบหนาว ตั้งแต่ปลายฤดูฝนเขาลงทุกคืน

          {name}ห้อยกุญแจไว้ใต้เสื้อ ตอนเดินออกจากครัว เบอร์ทัลกำลังนวดเข่าซ้ายด้วยมือทั้งสองข้าง
        effects: { org: { id: wardens, promote: true }, stats: { CHA: 1 }, items: [wardens_fort_key], flags: [carries_ules_key, bertal_said_listen] }
      failure:
        text: |
          เบอร์ทัลบอกให้ถามใหม่ปีหน้า แล้วยกหม้อน้ำแกงขึ้นตั้งเตาก่อนเวลาต้มเกือบชั่วยาม

          {name}ห้อยกุญแจไว้ใต้เสื้อ คืนนั้นกลอนประตูห้องล่างเลื่อนเปิดตอนเที่ยงคืนเหมือนเดิม เสียงไม้ค้ำลงบันไดช้ากว่าที่เคย
        effects: { org: { id: wardens, promote: true }, items: [wardens_fort_key], flags: [carries_ules_key] }
    - id: ask_why_me
      label: ถามบรอนกาว่าทำไมไม่ให้คนที่อยู่ป้อมมานานกว่า
      text: |
        บรอนกาพากลับไปห้องกินข้าว เปิดสมุดเวรไปหน้าของอูเลส สี่สิบหนาวที่เขาเลี้ยงล่อ เข็นเกวียน ขนศพ ช่องปัดของหน้านั้นว่างทั้งหน้า ไม่มีขีดสักเส้น แล้วนางเปิดหน้าของ{name}ให้ดูต่อ

        นางไม่ได้อธิบายอะไรเพิ่ม {name}ห้อยกุญแจไว้ใต้เสื้อ เช้าวันต่อมาไปป้อนหญ้าล่อแก่ของอูเลสก่อนกินข้าว แล้วทำแบบนั้นทุกเช้าจนล่อตัวนั้นตาย
      effects: { org: { id: wardens, promote: true }, items: [wardens_fort_key], flags: [carries_ules_key, fed_ules_mule] }
    - id: name_ules_home
      label: สวดส่งอูเลสก่อนรับกุญแจ แล้วขูดชื่อบ้านลงบนฝากล่องของเขา
      requires: { flag: job_fort_priest }
      text: |
        กล่องดีบุกของอูเลสยังไม่มีชื่อบ้าน ไม่มีใครในป้อมรู้ว่าเขามาจากไหน ตอนเขามาถึง ป้อมไม่ได้ถาม {name}สวดส่งเขาหน้าเตาหลอม แล้วขูดคำว่าป้อมสามลงบนฝาด้วยปลายตะปู ตรงช่องที่กล่องใบอื่นขูดชื่อหมู่บ้าน

        กล่องใบนั้นวางอยู่บนหิ้งในห้องสวด หันชื่อออกด้านนอก กุญแจของเขาห้อยอยู่ใต้เสื้อของ{name}ตั้งแต่คืนนั้น
      effects: { org: { id: wardens, promote: true }, stats: { WIS: 1 }, items: [wardens_fort_key], flags: [carries_ules_key, named_ules_home] }

- id: adult.wardens_rise_elder
  stage: adult
  scene: fort
  weight: 60
  must: true
  mark: ขึ้นเป็นผู้เฒ่าเจ็ดป้อม
  when:
    age: [19, 80]
    org: { id: wardens, min_rank: 3, max_rank: 3, ready: true }
  text: |
    บรอนกาจะกลับฮอร์ดุน หลังของนางงอลงทุกหนาว ไม้เท้าเหล็กจิ้มเถ้าแรงขึ้นทุกก้าว ตระกูลบันไดลึกส่งหลานสองคนมารับถึงประตูป้อม ทั้งสองยืนตัวแข็งอยู่ข้างเกวียน ไม่ยอมให้รองเท้าแตะเถ้า คืนแรกของฤดูหนาวปีนั้นนางขานชื่อเป็นครั้งสุดท้าย ชื่อเดียว ชื่อของ{name}

    ห้องที่มีเก้าอี้เจ็ดตัวอยู่ที่ป้อมหนึ่ง ห่างไปสามวันตามแนวหิน ผู้เฒ่าอีกหกป้อมนั่งรออยู่ก่อนแล้วตอน{name}ไปถึง เก้าอี้ว่างตัวเดียวมีเบาะหนังแกะยุบเป็นรอยของคนตัวเล็ก ไม่มีใครเปลี่ยนเบาะให้

    ของชิ้นแรกบนโต๊ะคือใบอนุญาตของบริษัทเหมือง ขอขุดลึกลงไปอีกชั้นใต้หลุมที่ห่างหินก้อนที่สี่สิบเอ็ดสามร้อยก้าว ใบนี้ต้องมีลายมือชื่อผู้เฒ่าสี่ในเจ็ด มีแล้วสาม ฮาร์เมก ผู้เฒ่าป้อมหก ลายมือเอียงซ้ายจัด เลื่อนขวดหมึกมาวางตรงหน้า{name} บอกว่าป้อมสามไม่เคยลงชื่อมาตลอดสมัยบรอนกา ป้อมสามก็ได้น้ำมันน้อยที่สุดมาตลอดสมัยบรอนกา
  choices:
    - id: sign_the_permit
      label: ลงชื่อ แล้วขอน้ำมันส่วนของป้อมสามให้ครบทุกถังตั้งแต่หนาวนี้
      text: |
        ฮาร์เมกยิ้มเป็นครั้งแรกตั้งแต่{name}เข้าห้อง เงินที่เจ็ดป้อมแบ่งกันหนาวนั้น ป้อมสามได้น้ำมันครบทุกถังเป็นครั้งแรกในรอบสิบปี เอสทรินนับถังลงจากเกวียนสองรอบเพราะไม่เชื่อตัวเลขของตัวเอง

        ต้นฤดูใหม่ เสียงเครื่องเจาะดังมาจากทางหินก้อนที่สี่สิบเอ็ด ลึกกว่าเดิม ดังทั้งวันทั้งคืน
      effects: { org: { id: wardens, promote: true }, world: { demon: 1 }, alignment: { moral: -1 }, flags: [signed_permit_as_elder] }
    - id: push_the_ink_back
      label: เลื่อนขวดหมึกกลับไปทางฮาร์เมก
      text: |
        ขวดหมึกไถลกลับไปบนโต๊ะไม้เก่า หยุดตรงหน้าฮาร์เมก ผู้เฒ่าอีกสองคนที่ยังไม่ได้ลงชื่อเลื่อนมือออกจากโต๊ะไปวางบนตัก ใบอนุญาตใบนั้นค้างอยู่ที่สามชื่อจนถึงปลายหนาว

        เงินที่แบ่งกันหนาวนั้น ป้อมสามได้น้ำมันน้อยที่สุดในเจ็ดป้อม เท่ากับทุกหนาวในสมัยบรอนกา เอสทรินอ่านใบแบ่งเงินแล้วพับเก็บใส่สมุดคลัง
      effects: { org: { id: wardens, promote: true }, alignment: { law: 1 }, reputation: { wardens: 1 }, flags: [refused_permit_as_elder] }
    - id: ask_for_the_books
      label: ขอให้ทุกป้อมส่งสมุดนับหินสามปีหลังมาวางบนโต๊ะก่อนใครจะลงชื่อ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          สมุดเจ็ดป้อม ยี่สิบเอ็ดเล่ม มาถึงป้อมหนึ่งในสิบวัน {name}อ่านทุกเล่มจนเทียนหมดหลายเล่ม ป้อมที่อยู่ใกล้หลุมเขียนคำว่าอุ่นถี่ขึ้นทุกปี ยกเว้นป้อมห้า สมุดป้อมห้าเขียนว่านิ่งทุกบรรทัด ทุกเช้า สามปีเต็ม

          ใบอนุญาตค้างอยู่บนโต๊ะจนส่งสมุดคืนครบทุกป้อม ผู้เฒ่าป้อมสองขอดูตารางที่{name}คัดออกมา แล้วไม่ลงชื่อ
        effects: { org: { id: wardens, promote: true }, stats: { INT: 1 }, flags: [read_seven_count_books] }
      failure:
        text: |
          ฮาร์เมกบอกว่าสมุดนับหินเป็นของราชสำนัก ไม่ใช่ของผู้เฒ่า ผู้เฒ่าอีกสามคนเห็นด้วย ใบอนุญาตได้ชื่อที่สี่จากผู้เฒ่าป้อมเจ็ดก่อนเที่ยง

          เก้าอี้ตัวนั้นยังเป็นรอยของบรอนกา {name}นั่งทับมาทั้งวันแล้วก็ยังไม่เข้ารูปตัวเอง ขวดหมึกอยู่ห่างมือไปครึ่งโต๊ะตลอดการประชุม
        effects: { org: { id: wardens, promote: true }, flags: [lost_the_first_vote] }
    - id: lay_the_dead_beside
      label: วางสมุดคนตายของป้อมสามไว้ข้างใบอนุญาต เปิดหน้าหินก้อนที่สี่สิบเอ็ด
      requires: { flag: job_fort_priest }
      text: |
        {name}เปิดสมุดค้างไว้ข้างใบอนุญาต ไม่อธิบาย หน้าหินก้อนที่สี่สิบเอ็ดยาวสองหน้า ลายมือนักบวชหลายรุ่น หน้าหลังสุดเป็นลายมือของ{name}เอง ผู้เฒ่าสองคนเอื้อมมือมาเปิดอ่านต่อ

        ใบอนุญาตค้างอยู่ที่สามชื่อจนปลายหนาว ฮาร์เมกเก็บใบนั้นกลับใส่ซองหนังตอนเลิกประชุม ไม่ได้ทิ้ง
      effects: { org: { id: wardens, promote: true }, stats: { WIS: 1 }, flags: [refused_permit_as_elder] }
    - id: old_signature
      label: ดึงหนังสือรับรองฉบับเก่าที่มีลายมือตัวเองออกจากท้ายแฟ้ม แล้วฉีกต่อหน้าทุกคน
      requires: { flag: signed_mine_permit }
      text: |
        หนังสือรับรองใบนั้นแนบอยู่ท้ายแฟ้มของบริษัทมาหลายปี ใบที่หัวหน้ากะดึกของป้อมสามเคยลงชื่อรับรองว่าแนวหินก้อนที่สามสิบสองถึงสามสิบเก้านิ่งพอให้ขุด บริษัทใช้ใบนั้นเป็นหลักฐานทุกครั้งที่ขอขุดเพิ่ม {name}ฉีกเป็นสองท่อน แล้วสี่ท่อน

        ฮาร์เมกบอกว่าฉีกกระดาษไม่ได้ทำให้หลุมตื้นขึ้น {name}วางเศษกระดาษไว้ในขวดหมึก กดให้จมจนดำทั้งแผ่น
      effects: { org: { id: wardens, promote: true }, alignment: { moral: 1 }, flags: [refused_permit_as_elder, tore_own_old_permit] }

- id: adult.wardens_passed_over
  stage: adult
  scene: fort
  weight: 30
  time: night
  when:
    age: [24, 64]
    org: { id: wardens, max_rank: 3, min_refused: 3 }
  text: |
    ชื่อแรกที่บรอนกาขานหน้าแนวหินหนาวนี้เป็นของผู้เฝ้าที่มาถึงป้อมหลัง{name}สี่หนาว ชื่อที่สองกับชื่อที่สามก็มาทีหลังทั้งคู่ ไม่มีชื่อ{name} ปีที่แล้วก็ไม่มี

    ในห้องกินข้าว เอสทรินไม่ได้รอให้ใครถาม นางเปิดสมุดเวรไปหน้าของ{name} วางไว้ตรงกลางโต๊ะ ช่องปัดมีรอยขีดเรียงกันเหมือนรั้วไม้ บางเส้นจำได้ว่าเพราะอะไร เข่าบวม จดหมายจากบ้าน คืนที่หนาวเกินไป บางเส้นจำไม่ได้แล้ว

    บรอนกานั่งลงฝั่งตรงข้ามเหมือนคืนแรกที่{name}มาถึงป้อม ป้อมสามไม่เคยไล่ใครออก ป้อมแค่จำ นางพูดประโยคนี้ช้ากว่าครั้งแรก
  choices:
    - id: ask_for_the_hard_slots
      label: ขอให้เอสทรินเขียนชื่อลงช่องที่ไม่มีใครอยากได้ไปจนสิ้นเดือน
      text: |
        เอสทรินเขียนให้ทันที ช่องเดินแนวตีสอง ช่องปล่องครัว ช่องเกวียนขากลับที่ต้องค้างปลายราง สามสิบวันเต็มไม่มีวันว่าง

        สิ้นเดือน ช่องรับในหน้าของ{name}มีรอยใหม่ยี่สิบกว่าเส้น ลากด้วยดินสอแท่งเดียวกัน หน้ากระดาษแผ่นนั้นยังไม่พลิกไปหน้าใหม่
      effects: { reputation: { wardens: 1 }, flags: [asked_for_the_hard_slots] }
    - id: argue_each_line
      label: ชี้ทีละเส้นในช่องปัด บอกว่าแต่ละคืนมีเหตุผล
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          บรอนกาฟังจนครบทุกเส้น ไม่ขัด แล้วบอกเอสทรินให้เขียนเหตุผลลงช่องหมายเหตุข้างเส้นที่{name}จำได้ เอสทรินเขียนตัวเล็กจนต้องเอียงสมุดหาแสง เข่าบวม จดหมายจากบ้าน หนาวเกิน

          ช่องปัดยังมีเส้นเท่าเดิม แต่หน้านั้นกลายเป็นหน้าที่มีตัวหนังสือมากที่สุดในสมุดเวรเล่มนั้น
        effects: { stats: { CHA: 1 }, flags: [explained_the_fence] }
      failure:
        text: |
          บรอนกาฟังจนถึงเส้นที่ห้า แล้ววางมือบนหน้ากระดาษ บอกว่าทุกคนในป้อมมีเหตุผลทุกเส้น คนที่ไม่ปัดก็มีเหตุผลเหมือนกัน

          {name}กินน้ำแกงจนหมดชาม กลางโต๊ะยังมีถ้วยเกลือหยาบใบเดียวกับที่วางอยู่ตรงนั้นตั้งแต่คืนแรก
        effects: { alignment: { law: -1 }, flags: [explained_the_fence] }
    - id: eat_and_sleep
      label: ปิดสมุด กินน้ำแกงให้หมดชาม แล้วไปนอน
      text: |
        {name}ปิดสมุดเวรเอง เลื่อนคืนไปทางเอสทริน แล้วกินน้ำแกงจนหมดชาม เบอร์ทัลมาเติมให้อีกครึ่งทัพพีโดยไม่มีใครขอ

        คืนนั้นตารางเวรติดใหม่บนประตูห้องกินข้าว ชื่อ{name}อยู่ในช่องเดียวกับเดือนก่อน ช่องยืนหินก้อนที่สี่สิบสามตั้งแต่หัวค่ำถึงเที่ยงคืน
      effects: { flags: [accepted_the_fence] }
    - id: read_the_shelf
      label: ไปนั่งในห้องสวด อ่านชื่อบนกล่องดีบุกทีละใบ
      requires: { flag: job_fort_priest }
      text: |
        {name}เปิดสมุดเวรเล่มเก่าที่เก็บไว้ใต้หิ้ง เทียบชื่อบนกล่องดีบุกกับหน้าของแต่ละคน กล่องสิบเจ็ดใบ หน้าที่ช่องปัดว่างทั้งหน้ามีเก้า

        ตีสามระฆังเปลี่ยนกะดังขึ้น {name}ยังนั่งอยู่บนพื้นห้องสวด สมุดเวรเล่มเก่าเปิดค้างอยู่บนตัก หน้าของอูเลส
      effects: { stats: { WIS: 1 }, flags: [read_the_shelf_of_boxes] }

# ---------- ความลับ ----------
- id: adult.wardens_secret_signatures
  stage: adult
  scene: noble_hall
  weight: 25
  when:
    age: [28, 64]
    org: { id: wardens, min_rank: 2, max_rank: 3 }
  text: |
    ปลายปี สมุดนับหินของป้อมสามต้องขึ้นขบวนถ่านไปส่งถึงหอทะเบียนของราชสำนักที่เวนทราส ปีนี้คนถือไปคือ{name} ห่อผ้าน้ำมันสองชั้น นอนกอดไว้ตลอดทาง

    เสมียนหอทะเบียนรับสมุดไปวางบนกองของป้อมอื่นโดยไม่เปิด แล้วให้นั่งรอใบรับ โต๊ะข้างๆ เสมียนอีกคนกำลังเย็บใบอนุญาตเหมืองเป็นตั้ง ใบบนสุดมีลายมือชื่อที่{name}จำได้จากจดหมายเวียนของภาคี ฮาร์เมก ผู้เฒ่าป้อมหก ลายมือเอียงซ้ายจัด ท้ายใบเย็บตั๋วเงินของธนาคารเบเลคติดมาด้วยใบหนึ่ง สี่สิบเหรียญ สั่งจ่ายถึงชื่อฮาร์เมก ไม่ใช่ถึงป้อมหก

    เสมียนเย็บต่อไปโดยไม่สนว่ามีใครเห็น ใบที่สองมีตั๋วแบบเดียวกัน ชื่อผู้เฒ่าอีกป้อมหนึ่ง ใบที่สามไม่มีตั๋ว ช่องลงชื่อของป้อมสามว่าง
  choices:
    - id: tell_bronka
      label: เอาเรื่องที่เห็นกลับไปเล่าให้บรอนกาฟังทุกตัวเลข
      text: |
        บรอนกาฟังจบแล้วไม่แปลกใจ นางรู้มาหลายปี รู้ชื่อทุกชื่อ นางบอกว่าน้ำมันนางยังขอได้ ลายมือชื่อที่ให้ไปแล้วนางขอคืนไม่ได้ แล้วให้{name}นั่งเขียนตัวเลขทุกตัวที่จำได้ลงกระดาษ เป็นจดหมายถึงผู้เฒ่าอีกหกป้อม ลงชื่อ{name}ไว้ใต้ชื่อนาง

        จดหมายฉบับนั้นไม่มีใครตอบ เงินที่แบ่งกันหนาวต่อมา ป้อมสามได้น้ำมันน้อยกว่าหนาวก่อนสี่ถัง ฮาร์เมกเป็นคนเขียนใบแบ่ง
      effects: { org: { id: wardens, merit: 1 }, alignment: { law: 1 }, flags: [told_bronka_of_the_drafts] }
    - id: copy_the_drafts
      label: ขยับเก้าอี้เข้าใกล้ จดเลขตั๋วกับชื่อลงซับในเสื้อ
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}จดด้วยถ่านลงซับในเสื้อ ตัวเล็ก ทีละตัว ระหว่างเสมียนเอี้ยวตัวไปหยิบด้าย สามใบ สามเลข สองชื่อ แล้วนั่งรอใบรับต่อด้วยหน้าตาของคนที่เบื่อ

          ซับในเสื้อตัวนั้นไม่เคยซักอีกเลย {name}พับเก็บไว้ก้นย่าม ใต้ผ้าห่มขนแพะ
        effects: { stats: { DEX: 1 }, flags: [copied_elder_drafts] }
      failure:
        text: |
          เสมียนหันมาตอนที่{name}จดถึงเลขตัวที่สาม เขาไม่ตะโกน ไม่เรียกยาม แค่พลิกตั้งใบอนุญาตคว่ำลง แล้วบอกว่าใบรับสมุดของป้อมสามคงต้องรอถึงพรุ่งนี้ ถ้าไม่มีค่าน้ำหมึก

          {name}จ่ายค่าน้ำหมึกไปสองเหรียญ ได้ใบรับก่อนค่ำ
        effects: { gold: -2, flags: [saw_elder_drafts] }
    - id: count_the_pits
      label: อ่านเลขหินบนใบอนุญาตทุกใบ แล้วเทียบกับสมุดคนตายที่พกติดตัว
      requires: { flag: job_fort_priest }
      text: |
        ใบอนุญาตทุกใบเขียนเลขหินกำกับไว้ว่าหลุมอยู่ห่างก้อนไหน {name}อ่านกลับหัวจากอีกฟากโต๊ะได้สี่ใบ สี่ใบนั้นอยู่ในแนวของป้อมหกทั้งหมด ป้อมหกได้หลังคาใหม่เมื่อสองหนาวก่อน สมุดคนตายที่ป้อมหกส่งมาให้ป้อมสามคัดสำเนาทุกปลายปี มีชื่อเพิ่มขึ้นสามเท่าในสองหนาวเดียวกัน

        ขบวนถ่านขากลับ {name}คัดตัวเลขทั้งสองชุดไว้บนหน้าว่างท้ายสมุดคนตาย เรียงคู่กันเป็นสองแถว
      effects: { stats: { WIS: 1 }, flags: [matched_drafts_to_the_dead] }
    - id: take_the_receipt
      label: รับใบรับสมุด แล้วขึ้นขบวนถ่านกลับ
      text: |
        ใบรับมาถึงก่อนค่ำ ประทับตราครั่งสีน้ำเงิน {name}พับใส่ย่าม ขึ้นขบวนถ่านเที่ยวกลางคืน นั่งตู้เดียวกับถังน้ำมันที่ป้อมหกสั่งมา สิบสองถัง

        ป้อมสามสั่งไปสี่ถัง ได้มาสองถัง
      effects: { flags: [saw_elder_drafts] }

- id: adult.wardens_secret_knock
  stage: adult
  scene: fort
  weight: 30
  time: night
  when:
    age: [28, 64]
    org: { id: wardens, min_rank: 3 }
  text: |
    เที่ยงคืน กลอนประตูเหล็กใต้ห้องเก็บน้ำมันเลื่อนเปิดเหมือนทุกคืน ตามด้วยเสียงไม้ค้ำกระทบบันไดหินขั้นแรก ขั้นที่สอง แล้วเสียงของหนักไถลลงไปหลายขั้นพร้อมกัน

    {name}ลงไปถึงตอนเบอร์ทัลนั่งอยู่กลางบันได เข่าซ้ายบิดผิดรูป หน้าซีดจนเหงื่อเป็นเม็ด ตะเกียงตกอยู่ข้างล่างแต่ยังติด ตั้งแต่อูเลสตาย เบอร์ทัลลงบันไดนี้คนเดียวทุกคืน เขาไม่ให้หามขึ้น ชี้ลงไปข้างล่าง แล้วบอกว่าคืนนี้ต้องมีคนลง ใครก็ได้ที่มีกุญแจ

    บันไดหินมียี่สิบเจ็ดขั้น ห้องล่างเล็กกว่าห้องเก็บน้ำมันข้างบน ผนังหินเปลือย พื้นหินเปลือย กลางผนังด้านในมีของสีดำโผล่ออกมาจากหินเท่าลำตัวคน ผิวเรียบ เย็นกว่าหินรอบๆ คนป้อมเรียกว่ารากของตอเสา ระหว่างที่{name}ยังยืนอยู่ขั้นสุดท้าย เสียงก็ดังขึ้นจากข้างในรากนั้น เคาะ สามครั้ง แล้วเงียบ

    เบอร์ทัลบอกลงมาจากบันไดว่าตอบด้วยด้ามกุญแจ สามครั้ง ไม่ต้องเร็ว
  choices:
    - id: knock_back
      label: เคาะตอบสามครั้งด้วยด้ามกุญแจ แล้วรับลงแทนเขาทุกคืนจนกว่าเข่าจะหาย
      text: |
        ด้ามกุญแจกระทบรากสามครั้ง เสียงทุ้มกว่าที่คิด ความเงียบหลังจากนั้นไม่เหมือนความเงียบก่อนหน้า {name}บอกไม่ได้ว่าต่างตรงไหน เบอร์ทัลบนบันไดหายใจออกยาวจน{name}ได้ยิน

        สี่สิบคืนต่อมา{name}ลงบันไดยี่สิบเจ็ดขั้นทุกเที่ยงคืน เคาะตอบแล้วขึ้นมานอนต่อ บางคืนต้องรอเสียงจากข้างในนานจนตะเกียงหรี่ ไม่เคยมีคืนไหนที่เสียงนั้นไม่มา เช้าที่เบอร์ทัลเดินลงครัวได้เองโดยไม่ใช้ไม้ค้ำ เขาวางชามน้ำแกงชามแรกไว้ที่ที่นั่งของ{name}
      effects: { org: { id: wardens, merit: 2 }, flags: [went_down_the_stair, knocked_in_the_lower_room] }
    - id: carry_bertal_down
      label: หามเบอร์ทัลลงไปให้เขาเคาะเอง
      check: { stat: STR, dc: 13 }
      success:
        text: |
          {name}แบกเบอร์ทัลขึ้นหลัง ลงทีละขั้น เข่าซ้ายของเขาห้อยกระแทกผนังสองครั้ง เขากัดฟันไม่ร้อง ถึงข้างล่าง เขาเอื้อมมือเคาะตอบสามครั้งจากบนหลังของ{name} จังหวะเหมือนคนเคาะประตูบ้านตัวเอง

          ขาขึ้นยากกว่าขาลง ถึงขั้นบนสุด{name}ทรุดนั่งพิงกระสอบแป้ง เบอร์ทัลบอกว่าพรุ่งนี้คืนคู่ คืนของอูเลส แล้วยื่นกุญแจของ{name}คืนมาให้ถือ
        effects: { stats: { STR: 1 }, flags: [went_down_the_stair, carried_bertal_down] }
      failure:
        text: |
          ขั้นที่สิบเก้าเท้าของ{name}ลื่น ทั้งสองคนไถลลงไปถึงพื้นห้องล่างพร้อมกัน เบอร์ทัลกลิ้งไปหยุดข้างราก เอื้อมมือเคาะตอบสามครั้งทั้งที่ยังนอนตะแคง ไหล่ของ{name}หลุดจากเบ้า ต้องให้คนกะดึกลงมาดึงเข้าที่

          เช้านั้นห้องเก็บน้ำมันมีคนนั่งรออยู่สามคน ไม่มีใครถามว่าข้างล่างมีอะไร
        effects: { hp: -2, flags: [went_down_the_stair, carried_bertal_down] }
    - id: ask_about_the_word
      label: เคาะตอบ แล้วขึ้นไปถามเบอร์ทัลถึงคำเดียวที่ตอบการ์เวนกลับมา
      requires: { flag: garven_told_the_knock }
      text: |
        {name}เคาะสามครั้ง ขึ้นไปนั่งข้างเบอร์ทัลบนบันได เล่าเรื่องด้ามหอกของการ์เวน เคาะตอบที่แนวหิน กับเสียงที่ตอบกลับมาเป็นคำ หนึ่งคำ ภาษาที่การ์เวนไม่เคยได้ยิน

        เบอร์ทัลบอกว่าสามสิบหนาวที่ลงบันไดนี้ ไม่เคยมีคำไหนตอบกลับมา มีแต่เสียงเคาะ แล้วเขาจับข้อมือ{name}แน่นจนเจ็บ ให้สัญญาว่าจะไม่เคาะด้วยของอย่างอื่นนอกจากกุญแจ ไม่เคาะที่ไหนนอกจากห้องนี้ ตลอดทางขึ้นเขาไม่ปล่อยข้อมือ
      effects: { stats: { INT: 1 }, flags: [went_down_the_stair, knocked_in_the_lower_room, told_bertal_of_the_word] }
    - id: rite_of_the_door
      label: สวดบทเฝ้าประตูของ{god}ก่อน แล้วค่อยเคาะ
      requires: { flag: job_fort_priest }
      text: |
        บทเฝ้าประตูนักบวชใช้สวดที่ธรณีห้องคนป่วย ให้คนข้างในรู้ว่ามีคนนั่งอยู่ข้างนอก {name}สวดครบทั้งบท เสียงก้องในห้องหินเล็กจนฟังเหมือนมีคนสวดตามอีกเสียง แล้วเคาะตอบสามครั้ง

        เบอร์ทัลถามจากบนบันไดว่าสวดให้ใคร {name}ตอบว่าให้คนที่เคาะ เบอร์ทัลบอกว่าป้อมนี้ไม่เคยมีนักบวชคนไหนได้ลงมาถึงห้องนี้มาก่อน
      effects: { stats: { WIS: 1 }, flags: [went_down_the_stair, knocked_in_the_lower_room, prayed_in_the_lower_room] }

- id: adult.wardens_secret_fort_five
  stage: adult
  scene: fort
  weight: 30
  time: night
  when:
    age: [30, 64]
    org: { id: wardens, min_rank: 3 }
    flags: [went_down_the_stair]
  text: |
    ภาคีส่ง{name}ไปป้อมห้าพร้อมหีบหัวหอกสิบอันที่ป้อมสามแบ่งให้ ค้างที่นั่นหนึ่งคืน ห้องนอนแขกของป้อมห้าอยู่เหนือห้องเก็บน้ำมันพอดี แบบเดียวกับที่ป้อมสาม ทุกป้อมสร้างจากแบบเดียวกัน

    เที่ยงคืน{name}ตื่นเองตามที่ร่างกายชินมาหลายปี นอนรอเสียงกลอนเหล็กเลื่อนเปิด ไม่มี ตีหนึ่งไม่มี ตีสองก็ไม่มี ทั้งป้อมห้าเงียบจนได้ยินล่อในคอกเคี้ยวหญ้า

    ก่อนสาง{name}ออกไปวางฝ่ามือบนหินก้อนแรกของแนวป้อมห้า ร้อนจนต้องชักมือกลับ ก้อนที่สองก็ร้อน ก้อนที่สามด้วย ผู้นับหินของป้อมห้าเดินผ่านไปพร้อมสมุด วางมือ เขียนว่านิ่ง วางมือ เขียนว่านิ่ง โยแรนยังนอนอยู่ในห้องของเขา กุญแจห้อยอยู่ที่ตะปูหัวเตียง
  choices:
    - id: knock_on_the_door
      label: ลงไปนอนบนประตูเหล็กในห้องเก็บน้ำมัน เคาะสามครั้งด้วยด้ามกุญแจของตัวเองทุกเที่ยงคืนที่ยังค้าง
      text: |
        กุญแจของป้อมสามไขประตูห้องล่างของป้อมห้าไม่ได้ {name}เคาะลงบนแผ่นเหล็กแทน สามครั้ง ทุกเที่ยงคืน ห้าคืนที่หาเรื่องค้างต่อ ไม่รู้ว่าเสียงลงไปถึงข้างล่างหรือเปล่า เช้าวันที่ห้า หินก้อนแรกของป้อมห้ายังร้อน แต่ร้อนน้อยกว่าเช้าแรกพอให้วางมือได้ครบสามลมหายใจ

        เช้าวันที่หก ตอน{name}เทียมล่อจะกลับ มีด้ายสีแดงเลือดหมูพันอยู่ที่ด้ามแส้ สามรอบ เงื่อนแน่น
      effects: { org: { id: wardens, merit: 1 }, hunted: { ash_cult: 1 }, flags: [found_fort_five_silent, knocked_for_fort_five] }
    - id: wake_yoran
      label: ปลุกโยแรน บอกเขาว่ารู้แล้ว
      text: |
        โยแรนลืมตาตอน{name}แตะไหล่ เหมือนคนที่ยังไม่ได้หลับ เขามองไปที่กุญแจบนตะปูหัวเตียงก่อน แล้วถึงมองหน้า{name} เขาไม่ถามว่ารู้อะไร

        เขาลุกไปที่ห้องเก็บน้ำมัน ไขกุญแจ เลื่อนกลอน แล้วยืนอยู่ที่ขั้นบนสุดของบันไดจนตะเกียงในมือหมดน้ำมัน ไม่ได้ลงไปสักขั้น
      effects: { flags: [found_fort_five_silent, woke_yoran] }
    - id: write_to_the_elders
      label: เขียนรายงานถึงผู้เฒ่าเจ็ดป้อม แนบตัวเลขความร้อนของหินป้อมห้าทุกก้อน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ค้างต่ออีกสามคืน วางมือบนหินป้อมห้าทุกก้อนทุกเช้ามืด จดความร้อนเทียบกับหินป้อมสามที่จำได้ขึ้นใจ ตัวเลขออกมาเป็นตารางสองแถว แถวหนึ่งนิ่ง แถวหนึ่งไม่นิ่งเลย

          ผู้เฒ่าป้อมห้าตอบจดหมายมาเองว่าจะดูให้ จดหมายของผู้เฒ่าอีกสองป้อมมาถึงพร้อมกัน ถามว่าตารางนี้ใครเป็นคนวางมือ
        effects: { stats: { INT: 1 }, flags: [found_fort_five_silent, reported_fort_five] }
      failure:
        text: |
          รายงานของ{name}ยาวสองหน้า เขียนเรื่องหินร้อน เรื่องกลอนประตูที่ไม่เลื่อน ส่งไปถึงผู้เฒ่าเจ็ดป้อม

          จดหมายตอบมาฉบับเดียว จากผู้เฒ่าป้อมห้า ป้อมห้านับหินทุกเช้า ครบและนิ่ง สมุดนับหินสามปีหลังส่งให้ราชสำนักไปแล้ว ใครสงสัยไปขอดูที่เวนทราสได้
        effects: { flags: [found_fort_five_silent] }
    - id: count_their_dead
      label: นับกล่องดีบุกของป้อมห้าที่ตายในแนวหินตั้งแต่เสียงกลอนเงียบ
      requires: { flag: job_fort_priest }
      text: |
        คนเลี้ยงล่อของป้อมห้าจำได้ว่าเสียงกลอนเหล็กตอนเที่ยงคืนหายไปตั้งแต่หนาวที่ล่อตัวลายตาย สามหนาวก่อน {name}นับกล่องดีบุกที่ขูดชื่อหลังหนาวนั้น สิบเอ็ดใบ สามหนาวก่อนหน้ามีสามใบ

        {name}สวดส่งทั้งสิบเอ็ดใบในห้องเก็บแป้งคืนนั้น เสียงสวดลอดพื้นลงไปถึงห้องล่างได้หรือไม่ {name}ไม่รู้ สวดจบแล้วจึงเอาหูแนบพื้น ไม่ได้ยินอะไร
      effects: { stats: { WIS: 1 }, flags: [found_fort_five_silent, counted_fort_five_dead] }

- id: adult.wardens_secret_yoran
  stage: adult
  scene: fort
  weight: 30
  when:
    age: [32, 64]
    org: { id: wardens, min_rank: 3 }
    flags: [found_fort_five_silent]
  text: |
    {name}กลับไปป้อมห้าอีกครั้งโดยไม่มีหีบ ไม่มีจดหมาย โยแรนนั่งซ่อมบังเหียนอยู่ในคอกล่อ เห็น{name}เดินเข้ามาแล้ววางเข็มเย็บหนังลง เหมือนรอมานานแล้ว

    เขาเล่าเองโดยไม่ต้องถาม นิสซา หลานสาวคนเดียวของเขา กู้เงินธนาคารเบเลคไปเปิดร้านเย็บผ้าในเวนทราส ร้านเจ๊งในปีเดียว หนี้ทบจนธนาคารจะเอาตัวนางไปใช้แรงในโรงกลั่น หนาวหนึ่งชายในเสื้อคลุมดำขลิบแดงมาที่ป้อมห้า วางตั๋วหนี้ของนิสซาที่ประทับว่าชำระแล้วไว้บนโต๊ะ ไม่ขออะไรเลยในวันนั้น สามเดือนต่อมามาอีก ขอแค่คืนเดียวที่ไม่ต้องลง

    คืนนั้นโยแรนนั่งรอข้างบนทั้งคืน ไม่มีอะไรเกิดขึ้น หินอุ่นขึ้นนิดหน่อย คืนเดียวกลายเป็นสองคืน แล้วเป็นเดือน เขาบอกตัวเองว่าการเคาะเป็นแค่ธรรมเนียม เหมือนโรยเกลือที่ธรณีประตู ไม่มีใครรู้จริงว่ามีอะไรอยู่ข้างใน เขาพูดประโยคนี้กับ{name}เหมือนพูดมาแล้วเป็นร้อยครั้งกับคนที่ไม่ได้อยู่ในคอก
  choices:
    - id: go_down_with_him
      label: บอกเขาว่าคืนนี้จะลงไปด้วยกัน แล้วอยู่ต่อจนเขาลงเองได้
      text: |
        เที่ยงคืนโยแรนไขกุญแจ มือสั่นจนกุญแจกระทบรูสามครั้งกว่าจะเข้า บันไดของป้อมห้าก็ยี่สิบเจ็ดขั้น ฝุ่นบนขั้นหนาจนเห็นรอยเท้าของสองคนชัด ข้างล่าง เขายืนหันหน้าเข้าราก รอจนตะเกียงหรี่ลงครึ่งดวง เสียงจากข้างในจึงดัง เคาะ สามครั้ง เงียบ โยแรนเคาะตอบ แล้วนั่งลงกับพื้นหินร้องไห้เหมือนเด็ก

        {name}ค้างป้อมห้าหนึ่งเดือน ลงบันไดกับเขาทุกคืน คืนที่ยี่สิบเขาลงคนเดียว {name}นอนฟังเสียงกลอนเหล็กเลื่อนเปิดอยู่ในห้องแขก แล้วหลับไปก่อนกลอนจะเลื่อนปิด
      effects: { org: { id: wardens, merit: 1 }, flags: [yoran_knocked_again] }
    - id: take_his_key
      label: ขอกุญแจของเขา เอาไปให้ผู้เฒ่าป้อมห้าเลือกคนถือใหม่
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          โยแรนแกะกุญแจออกจากเข็มขัดช้าๆ ทีละรอบเชือก วางบนฝ่ามือ{name} ด้ามเหล็กของดอกนี้ไม่มีรอยเว้า เรียบเหมือนเพิ่งตีเสร็จ เขาบอกว่าตั้งแต่ได้กุญแจมา เขาลงบันไดได้ไม่ถึงสิบหนาว

          ผู้เฒ่าป้อมห้าให้กุญแจดอกนั้นกับผู้นับหินหนุ่มคนที่เขียนว่านิ่งทุกบรรทัด {name}ลงบันไดกับเขาคืนแรก สอนให้เคาะ ไม่ต้องเร็ว
        effects: { stats: { CHA: 1 }, flags: [took_yorans_key] }
      failure:
        text: |
          โยแรนกำกุญแจไว้ในมือทั้งสองข้าง บอกว่านี่เป็นของชิ้นเดียวที่เขามี ถ้าเอาไป เขาก็ไม่มีอะไรจะให้นิสซาภูมิใจ เขาจะลงเอง พรุ่งนี้ คืนนี้ขอนอนก่อน

          {name}กลับป้อมสามโดยไม่ได้กุญแจ ทางกลับผ่านหินของป้อมห้าตอนก่อนสาง ร้อนเท่าเดิม
        effects: { flags: [yoran_kept_his_key] }
    - id: tell_the_seven
      label: นำเรื่องนี้ไปบอกห้องที่มีเก้าอี้เจ็ดตัว ทั้งชื่อนิสซา ทั้งตั๋วหนี้
      text: |
        ผู้เฒ่าเจ็ดป้อมเรียกโยแรนมาที่ป้อมหนึ่ง เขาเดินเข้าห้องโดยไม่มีใครต้องพยุง ตอบทุกคำถามตามจริง ห้องนั้นให้กุญแจป้อมห้ากับผู้ถือกุญแจของป้อมสี่ไปก่อน จนกว่าป้อมห้าจะมีคนใหม่

        โยแรนขึ้นขบวนถ่านไปเวนทราสในสัปดาห์นั้น ไปอยู่กับนิสซา ข่าวที่มาถึงป้อมสามหนาวต่อมาบอกว่าเขาเย็บผ้าเป็นแล้ว
      effects: { alignment: { law: 1 }, reputation: { wardens: 1 }, flags: [reported_yoran] }
    - id: hear_him_out
      label: นั่งลงในคอก ให้เขาเล่าจนจบแบบที่คนเล่าให้นักบวชฟัง
      requires: { flag: job_fort_priest }
      text: |
        {name}ไม่ขัดสักคำ โยแรนเล่าซ้ำตั้งแต่ต้น ช้ากว่าเดิม รอบนี้มีเรื่องที่รอบแรกไม่มี ชื่อของชายเสื้อดำที่เขาจำได้เพียงพยางค์แรก ร้านขายเกลือหน้าสถานีปลายรางที่ชายคนนั้นนั่งรอคำตอบทุกต้นเดือน

        จบแล้ว{name}สวดบทของคนที่ยังมีงานเหลือให้เขา ไม่ใช่บทของคนที่ทำผิด โยแรนลุกขึ้นปัดฟางจากกางเกง แล้วบอกว่าคืนนี้จะลง
      effects: { stats: { WIS: 1 }, flags: [yoran_knocked_again, heard_yorans_confession] }
    - id: keep_his_secret
      label: บอกเขาว่าจะไม่เล่าให้ใครฟัง แล้วกลับป้อมสาม
      text: |
        โยแรนจับมือ{name}ด้วยมือสองข้าง บีบแน่น ไม่ปล่อยจนเดินมาถึงเกวียน

        หลังจากนั้นทุกปลายฤดูฝน ป้อมห้ายังส่งกระดาษมาขอยืมน้ำมันตะเกียง ปีละมากขึ้น ลายมือของโยแรนเหมือนเดิม คำว่าขอบคุณยังเขียนไว้สองครั้ง
      effects: { world: { demon: 1 }, flags: [kept_yorans_secret] }

# ---------- ถูกตามล่า ทรยศ และออกจากป้อม ----------
- id: adult.wardens_hunt_kitchen_boy
  stage: adult
  scene: fort
  weight: 15
  time: night
  hunt: ash_cult
  when:
    age: [20, 64]
    org: wardens
    not_orgs: [ash_cult]
  text: |
    เด็กช่วยครัวคนใหม่มาถึงป้อมสามตั้งแต่ต้นเดือน มาจากค่ายคนงานเหมือง ไม่พูดมาก ปอกหัวผักกาดเก่ง ตื่นก่อนเบอร์ทัลทุกเช้า เบอร์ทัลบอกใครต่อใครว่าเด็กคนนี้มือเบา หม้อไม่เคยไหม้

    คืนนี้{name}ตื่นเพราะกลิ่นถ่านร้อนในห้องนอนรวม เด็กช่วยครัวคุกเข่าอยู่ข้างเตียงของ{name} ในมือมีชามเหล็กใส่ถ่านมารที่ขอแบ่งจากเตาครัว เป่าเบาๆ ไปทางหน้าของ{name} เหมือนเป่าไฟให้ลุก ข้อมือขวามีด้ายแดงพันสามรอบ คนอื่นในห้องยังหลับ เสียงกรนดังเป็นจังหวะเดิม
  encounter:
    foe: ash_cultist
    name: เด็กช่วยครัวกับชามถ่าน
    morale: 2
    beats:
      - text: เขายังไม่รู้ว่า{name}ตื่น ถ่านในชามสว่างขึ้นทุกครั้งที่เขาเป่า ไอร้อนเลียมาถึงขอบผ้าห่ม กลิ่นขนแพะไหม้ลอยขึ้นมาบางๆ
        moves:
          - id: kb_kick_bowl
            label: ถีบชามถ่านออกจากมือเขา
            kind: quick
            success: เท้าโดนก้นชามเต็มแรง ชามเหล็กลอยไปกระแทกเสาเตียงฝั่งตรงข้าม ถ่านมารกระจายบนพื้นหินเป็นดวงแดงสิบกว่าดวง คนเตียงถัดไปสะดุ้งตื่น เด็กช่วยครัวมองตามชามไปก่อนจะหันกลับมา
          - id: kb_blanket
            label: สะบัดผ้าห่มคลุมชามถ่านไว้ทั้งชาม
            kind: guard
          - id: kb_grab_wrist
            label: คว้าข้อมือข้างที่พันด้ายแดง
            kind: attack
          - id: kb_ask_name
            label: ถามชื่อจริงของเขา ชื่อที่ไม่ได้บอกเบอร์ทัล
            kind: talk
            parley: true
          - id: kb_names_rite
            label: สวดชื่อคนตายของป้อมดังๆ ให้ทั้งห้องตื่น
            kind: item
            stat: WIS
            requires: { flag: job_fort_priest }
          - id: kb_roll_off
            label: กลิ้งลงจากเตียง วิ่งไปทางประตู
            kind: flee
      - text: เขาลุกขึ้นพร้อมชาม สะบัดถ่านคุออกเป็นสายตามทางเดินระหว่างเตียง ผ้าห่มสองผืนติดไฟ คนที่ตื่นแล้วร้องเรียกกันลั่นห้อง
        answer: quick
        moves:
          - id: kb_behind_post
            label: หลบหลังเสาเตียง ให้ถ่านคุกระทบไม้แทน
            kind: quick
          - id: kb_mattress
            label: ยกฟูกขึ้นบังตัว
            kind: guard
          - id: kb_charge
            label: พุ่งฝ่าสายถ่านเข้าไปถึงตัว
            kind: attack
          - id: kb_out_door
            label: ถอยออกประตู ไปตีระฆัง
            kind: flee
      - text: เขาวิ่งไปถึงประตูห้องเก็บน้ำมัน ยกชามขึ้นเหนือถังน้ำมันตะเกียงที่ซ้อนกันอยู่หกถัง ถ่านในชามสว่างจ้าจนเห็นหน้าเขาชัดเป็นครั้งแรก หน้าเด็กธรรมดาที่ยังไม่มีหนวด
        answer: attack
        moves:
          - id: kb_tackle
            label: กระโจนเข้าชนเขาให้ล้มออกห่างถัง
            kind: attack
            tags: [blunt]
            success: ทั้งสองคนล้มกลิ้งไปบนพื้นห้องเก็บน้ำมัน ชามหลุดมือเขา คว่ำลงบนพื้นหินห่างถังใบใกล้สุดสองศอก ถ่านคุดิ้นอยู่ใต้ชามแล้วมอดเพราะไม่มีลม
          - id: kb_water_jar
            label: คว้าโอ่งน้ำล้างหน้าข้างประตู สาดใส่ชามในมือเขา
            kind: item
            stat: DEX
            tags: [water]
          - id: kb_talk_down
            label: บอกเขาว่าเบอร์ทัลยืนอยู่ข้างหลัง
            kind: talk
          - id: kb_out_door2
            label: ปิดประตูห้องเก็บน้ำมันขังเขาไว้ แล้ววิ่งไปตามคน
            kind: flee
    win:
      text: |
        เบอร์ทัลมัดข้อมือเด็กช่วยครัวด้วยเชือกผูกปากกระสอบแป้งเอง มัดแน่นแบบมัดหมูก่อนเชือด มือไม่สั่นสักครั้ง ด้ายแดงที่ข้อมือ{name}แกะออกมาเผาในเตาครัว ไฟลุกเป็นสีเขียวอยู่ครู่หนึ่งแล้วกลับเป็นสีเดิม

        คนของภาคีมารับตัวเขาไปตอนสาย เช้านั้นเบอร์ทัลปอกหัวผักกาดเองทั้งกระบุง ปอกหนาจนเนื้อหายไปครึ่งหัว
      effects: { stats: { CON: 1 }, reputation: { wardens: 1 }, hunted: { ash_cult: -1 }, flags: [caught_the_kitchen_boy] }
    lose:
      text: |
        {name}ตื่นอีกทีในครัว นอนบนโต๊ะนวดแป้ง ผ้าเปียกวางทับแผลไหม้ที่หน้าอกกับแขน เด็กช่วยครัวหายไปทางประตูหลังตั้งแต่คนกะดึกวิ่งเข้ามา ห้องเก็บน้ำมันไม่ไหม้

        เบอร์ทัลนั่งเฝ้าอยู่ข้างโต๊ะจนสาง กระบุงหัวผักกาดที่เด็กคนนั้นปอกค้างไว้ยังวางอยู่ที่เท้าเขา
    stalemate:
      text: |
        ระฆังเปลี่ยนกะดังขึ้น ทั้งห้องนอนรวมลุกพร้อมกัน เด็กช่วยครัวขว้างชามทิ้งแล้วออกไปทางหน้าต่างครัว วิ่งข้ามลานไปทางแนวหิน ข้ามแนวหินไปในทุ่งเถ้าตอนฟ้ายังมืด

        เช้านั้นไม่มีใครตามไป บนเตียงของเขาในห้องคนครัวมีผ้าห่มพับเรียบ กับด้ายแดงม้วนหนึ่งยาวพอพันข้อมือได้อีกหลายสิบคน
      effects: { flags: [kitchen_boy_ran] }
    flee:
      text: |
        {name}ตีระฆังจนทั้งป้อมลงมาที่ลาน คนกะดึกพังประตูห้องเก็บน้ำมันเข้าไป ข้างในมีแต่ชามเหล็กคว่ำ ถ่านดับหมดแล้ว หน้าต่างบานเล็กที่ไม่มีใครคิดว่าคนจะลอดได้เปิดค้างอยู่

        ถังน้ำมันหกถังยังอยู่ครบ ถังใบบนสุดมีด้ายแดงพันไว้รอบหูสามรอบ
      effects: { flags: [kitchen_boy_ran] }
    parley:
      text: |
        เด็กช่วยครัวหยุดเป่า ตอบชื่อจริงของเขาออกมาเป็นคำที่{name}ไม่เคยได้ยินในภาษาไหน แล้วบอกว่าไม่มีใครส่งเขามา เขามาเพราะอยากเห็นหน้าคนที่ป้อมสามเรียกชื่อในคืนแรกของหนาว

        เขาวางชามถ่านลงบนพื้นข้างเตียง เดินออกไปทางประตูครัวเหมือนคนลุกไปเข้าห้องน้ำ เช้านั้นเบอร์ทัลถามหาเขาทั่วป้อม ถ่านในชามยังอุ่นอยู่จนเที่ยง
      effects: { flags: [let_the_kitchen_boy_go] }
    death:
      text: |
        ถ่านคุสายแรกลงเต็มหน้า ร้อนจนไม่ได้ยินเสียงตัวเองร้อง {name}ล้มลงบนพื้นหินระหว่างเตียงสองหลัง

        ข้างบน เสียงกรนของห้องนอนรวมยังดังเป็นจังหวะเดิมอยู่อีกครู่หนึ่ง ก่อนจะมีคนแรกตื่น

- id: adult.wardens_hunt_red_thread
  stage: adult
  scene: fort
  weight: 15
  time: dusk
  hunt: ash_cult
  when:
    age: [20, 64]
    org: wardens
    min_hunted: { ash_cult: 2 }
    not_orgs: [ash_cult]
  text: |
    เส้นแรกพันอยู่ที่หูตะเกียงประจำตัวของ{name} ตรงที่มือจับ สามรอบ เงื่อนแน่น ด้ายสีแดงเลือดหมูแบบเดียวกับที่หัวหน้าคนงานเหมืองพันข้อมือ {name}ตัดทิ้งไปโดยไม่คิดอะไร

    สามวันต่อมาเส้นที่สองผูกเชือกรองเท้าคู่ที่วางไว้ใต้เตียง เส้นที่สามพันเสาหัวเตียงตรงที่หัวของ{name}พิงทุกคืน ไม่มีใครในห้องนอนรวมเห็นใครเข้ามา คนเตียงข้างๆ ย้ายไปนอนเตียงว่างที่ปลายห้องโดยไม่บอกเหตุผล

    เย็นนี้เส้นที่สี่พันอยู่ที่หูชามน้ำแกงของ{name} ชามที่วางคว่ำรอไว้บนโต๊ะในห้องกินข้าว
  choices:
    - id: burn_them_all
      label: แกะด้ายทุกเส้นที่หาเจอ เอาไปเผาในเตาครัว
      text: |
        {name}เดินหาไปทั่วข้าวของของตัวเอง เจออีกสองเส้น เส้นหนึ่งอยู่ในย่ามใต้ผ้าห่มขนแพะ อีกเส้นพันอยู่ที่ขอเหล็กของหินก้อนที่{name}ยืนเวรประจำ รวมหกเส้น โยนเข้าเตาครัวทีเดียว ไฟลุกเป็นสีเขียวครู่หนึ่งแล้วกลับเป็นสีเดิม

        เบอร์ทัลยืนดูอยู่ข้างเตา ถือกระบวยค้างไว้กลางอากาศจนไฟกลับเป็นสีเดิม แล้วตักน้ำแกงใส่ชามใหม่ให้ ชามที่ไม่มีหู
      effects: { flags: [burned_the_red_threads] }
    - id: lie_awake
      label: นอนลืมตาทั้งคืน รอดูว่าใครเข้ามาผูก
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ตีสอง เด็กเลี้ยงล่อของป้อมคนหนึ่งย่องเข้ามาด้วยเท้าเปล่า ในมือมีด้ายแดงม้วนเล็ก {name}จับข้อมือเด็กไว้ตอนปลายด้ายแตะเสาเตียง เด็กร้องไห้ก่อน{name}จะทันถามอะไร บอกว่าชายที่ร้านขายเกลือปลายรางให้เหรียญทองแดงเส้นละเหรียญ ไม่ได้บอกว่าผูกไปทำไม

          {name}ให้เด็กสองเหรียญ ให้สัญญาว่าจะเอาด้ายที่เหลือมาให้ทั้งม้วน ต้นเดือนต่อมาชายที่ร้านขายเกลือไม่มานั่งรออีก
        effects: { stats: { WIS: 1 }, gold: -2, hunted: { ash_cult: -1 }, flags: [caught_the_thread_boy] }
      failure:
        text: |
          {name}หลับไปตอนไหนไม่รู้ ตื่นมาตอนสาง ด้ายแดงพันอยู่รอบข้อมือซ้ายของตัวเอง สามรอบ เงื่อนแน่นจนเนื้อข้างใต้ขึ้นเป็นรอยแดง ต้องให้เบอร์ทัลเอามีดหั่นผักค่อยๆ ตัด

          รอยนั้นอยู่บนข้อมือเจ็ดวันกว่าจะจาง
        effects: { hp: -1, flags: [woke_with_red_thread] }
    - id: tie_them_to_the_stone
      label: เอาด้ายทุกเส้นไปพันขอเหล็กของหินก้อนที่สามสิบหก ให้คนที่ส่งมาเห็น
      requires: { trait: curse_brand }
      text: |
        {name}พันด้ายหกเส้นรวมกันที่ขอเหล็ก แขวนตะเกียงทับ แล้วยืนเวรที่หินก้อนนั้นทั้งคืน ตีสามหมาเถ้าสามตัวขึ้นมานั่งเรียงหน้าแนวหิน ห่างแค่สามก้าว นั่งเฉยอยู่อย่างนั้นเหมือนรอให้ใครอนุญาต ด้ายแดงไหม้เป็นขี้เถ้าทีละเส้นโดยไม่มีไฟไปแตะ

        ตอนสางหมาเถ้ากลับลงไปในเถ้า ขอเหล็กของหินก้อนที่สามสิบหกเหลือแต่รอยดำหกวง
      effects: { stats: { CHA: 1 }, flags: [burned_the_red_threads] }
    - id: name_each_knot
      label: แกะด้ายทีละเส้นในห้องสวด สวดหนึ่งบทต่อหนึ่งเงื่อน
      requires: { flag: job_fort_priest }
      text: |
        เงื่อนทุกเงื่อนผูกแบบเดียวกัน สามรอบ ดึงแล้วยิ่งแน่น {name}แกะด้วยปลายเข็มทีละเส้น สวดบทล้างมือของ{god}หนึ่งบทต่อหนึ่งเงื่อน สิบแปดบท ตอนเงื่อนสุดท้ายหลุด เทียนบนหิ้งดับเองโดยไม่มีลม

        {name}จุดเทียนใหม่ แล้วเอาด้ายทั้งหกเส้นใส่กล่องดีบุกเปล่าใบหนึ่ง บัดกรีฝาปิด วางไว้หลังสุดของหิ้ง ไม่ขูดชื่อ
      effects: { stats: { WIS: 1 }, flags: [boxed_the_red_threads] }
    - id: tell_estrin
      label: เอาด้ายทั้งหมดไปวางบนสมุดเวรของเอสทริน
      text: |
        เอสทรินเขี่ยด้ายด้วยปลายขอเหล็ก นับครบหกเส้น แล้วเปิดสมุดเวรไปหน้าท้ายที่ไม่มีใครใช้ เขียนวันที่ เขียนหกเส้น เขียนที่ที่เจอทีละที่ ใต้บรรทัดนั้นมีบรรทัดแบบเดียวกันอีกสี่บรรทัด ลายมือของนางทั้งหมด ชื่อคนละชื่อ

        สองในสี่ชื่อนั้น{name}จำได้ เพราะเคยเห็นหัวหอกของพวกเขาบนผนังห้องกินข้าว
      effects: { alignment: { law: 1 }, flags: [showed_estrin_the_threads] }

- id: adult.wardens_cult_offer
  stage: adult
  scene: tavern
  weight: 12
  when:
    age: [28, 64]
    org: { id: wardens, min_rank: 2 }
  text: |
    ร้านขายเกลือหน้าสถานีปลายรางขายเหล้าด้วยตอนค่ำ {name}นั่งรอขบวนถ่านเที่ยวดึกที่โต๊ะริมประตู ชายคนหนึ่งในเสื้อคนงานเหมืองที่ซักจนสีจางมานั่งฝั่งตรงข้าม สั่งเหล้าสองจอก เลื่อนจอกหนึ่งมาให้ เล็บมือเขาสะอาด สะอาดเกินกว่าคนที่ใส่เสื้อแบบนั้น

    เขารู้ชื่อ{name} รู้ว่าเช้ามืดวันไหนเป็นเวรนับหินของ{name} รู้ว่าผ้าห่มบนเตียงของ{name}เป็นขนแพะผืนเดียว เขาวางถุงหนังลงข้างจอก เสียงเหรียญข้างในดังทึบ บอกว่าไม่ได้ขออะไรมาก เช้ามืดเช้าเดียว ลงชื่อในสมุดนับหินโดยไม่ต้องเดิน หรือถ้า{name}มีกุญแจ ขอคืนเดียวที่ประตูห้องล่างไม่ได้ลงกลอน

    แค่ครั้งเดียว เขาพูดเหมือนคนบอกราคาเกลือ แล้วจิบเหล้าของตัวเอง
  choices:
    - id: sign_without_walking
      label: รับถุงเงิน ลงชื่อในสมุดนับหินเช้าวันนั้นโดยไม่ได้เดิน
      text: |
        เช้ามืดวันนั้น{name}นั่งอยู่ในห้องกินข้าว เขียนว่าครบและนิ่ง ลงชื่อ ลายมือนิ่งกว่าที่คิด ปลายแนวหินยังมืด ตะเกียงบนขอเหล็กหินก้อนที่สี่สิบสี่ดับไปตั้งแต่ตีสี่ ไม่มีใครเดินไปจุด

        สัปดาห์ต่อมา{name}ขึ้นขบวนถ่านเที่ยวสาย ไม่ได้ลาใคร หน้ากระดาษบรรทัดนั้นยังอยู่ในสมุดนับหิน ลายมือของ{name} ปลายปีจะขึ้นขบวนถ่านไปถึงเวนทราสตามเดิม
      effects:
        mark: ทิ้งป้อมสามพร้อมถุงเงิน
        gold: 8
        clear_flags: [job_wardens, job_fort_priest]
        reputation: { wardens: -3 }
        alignment: { moral: -1 }
        world: { demon: 1 }
        flags: [sold_the_fort, left_the_fort]
    - id: leave_the_door
      label: รับถุงเงิน คืนนั้นลงไปไขกลอนประตูห้องล่างทิ้งไว้
      requires: { org: { id: wardens, min_rank: 3 } }
      text: |
        {name}ไขกุญแจ เลื่อนกลอนเหล็กออก แล้วขึ้นไปนอน คืนนั้นไม่มีใครลงบันไดยี่สิบเจ็ดขั้น ก่อนสาง หินก้อนที่สามสิบหกร้อนจนน้ำค้างไม่เกาะ ผู้นับหินเขียนว่าอุ่น ขีดเส้นใต้สองเส้น

        {name}ขึ้นขบวนถ่านก่อนที่ใครจะทันถามว่าเมื่อคืนกลอนประตูห้องล่างเลื่อนกี่ครั้ง กุญแจยังห้อยอยู่ใต้เสื้อ หนักกว่าตอนรับมาเป็นสิบเท่า
      effects:
        mark: ทิ้งป้อมสามพร้อมถุงเงิน
        gold: 8
        clear_flags: [job_wardens, job_fort_priest]
        reputation: { wardens: -3 }
        alignment: { moral: -2 }
        world: { demon: 1 }
        flags: [sold_the_fort, left_the_fort]
    - id: drag_him_to_the_fort
      label: คว้าคอเสื้อเขาไว้ ลากขึ้นเกวียนไปให้เอสทรินดู
      check: { stat: STR, dc: 13 }
      success:
        text: |
          ชายคนนั้นตัวเบากว่าที่คิด {name}ล็อกแขนเขาไว้ข้างหลัง กดลงกับพื้นเกวียน มัดด้วยเชือกผูกถังน้ำมัน ถุงเงินโยนตามขึ้นไปด้วย ตลอดทางกลับป้อมเขาร้องเพลงกล่อมเด็กเพลงเดียวซ้ำไปซ้ำมา

          เอสทรินนับเหรียญในถุงต่อหน้าทุกคนในห้องกินข้าว สี่สิบเหรียญพอดี นางจดลงสมุดคลังว่าเงินบริจาค แล้วสั่งน้ำมันเพิ่มสิบถัง
        effects: { stats: { STR: 1 }, reputation: { wardens: 1 }, flags: [caught_the_purse_man] }
      failure:
        text: |
          มือของ{name}ได้แค่คอเสื้อ ชายคนนั้นบิดตัวหลุดออกจากเสื้อทั้งตัว มีดสั้นเล่มบางปาดผ่านหลังมือของ{name}ไปหนึ่งรอยก่อนเขาหายไปทางหลังร้าน

          ถุงเงินหายไปพร้อมเขา บนโต๊ะเหลือเสื้อคนงานเหมืองตัวหนึ่ง ข้อมือเสื้อข้างขวามีด้ายแดงเย็บติดไว้สามรอบ
        effects: { hp: -2, flags: [fought_the_purse_man] }
    - id: pour_it_out
      label: เทเหล้าในจอกลงพื้น แล้วลุกไปรอขบวนข้างนอก
      text: |
        เหล้าซึมลงพื้นดินอัดของร้านเกลือเป็นวงดำ ชายคนนั้นไม่ได้รั้ง ไม่ได้ขึ้นเสียง เก็บถุงเงินใส่อกเสื้อ แล้วสั่งเหล้าจอกใหม่ให้ตัวเอง

        {name}ยืนรอขบวนอยู่ใต้ตะเกียงสถานีจนดึก ขบวนมาช้าไปครึ่งชั่วยาม ตอนขึ้นตู้ ชายคนนั้นยังนั่งอยู่ที่โต๊ะเดิม หันหน้ามาทางสถานี
      effects: { alignment: { moral: 1 }, flags: [refused_the_cult_purse] }

- id: adult.wardens_walk_out
  stage: adult
  scene: road
  weight: 10
  time: day
  when:
    age: [36, 60]
    org: wardens
  text: |
    ขบวนถ่านเที่ยวสายจอดรออยู่ที่ปลายราง ตู้ท้ายสุดว่าง ประตูตู้เปิดค้างไว้ คนคุมตู้นั่งห้อยขากินขนมปังอยู่ตรงขอบประตู บอกใครก็ได้ที่เดินผ่านว่าตู้นี้ไปถึงเวนทราสโดยไม่จอดรับอะไรอีก

    {name}ขนถังน้ำมันของป้อมขึ้นเกวียนครบแล้ว ล่อยืนรอ เข่าขวาของ{name}ไม่ยอมงอเต็มที่มาตั้งแต่ปลายฤดูฝน นิ้วมือซ้ายกำไม่สุดอีกแล้วตอนเช้ามืด เมื่อคืนฝันว่ายืนหินก้อนเดิม ตื่นมาเหนื่อยเท่าคืนที่ยืนจริง

    คนที่เลิกงานป้อมแบบมีหน้ามีตา คือคนที่อยู่จนยืนเวรไม่ไหวจริงๆ แล้วผู้เฒ่าขานชื่อให้ลงจากแนว มีคนรินเหล้าให้จนล้นจอก ส่วนคนที่ไปเองก่อนถึงวันนั้น ป้อมไม่ตาม แต่สมุดเวรจะจำบรรทัดสุดท้ายไว้อย่างนั้น ตู้ท้ายสุดยังว่าง
  choices:
    - id: climb_into_the_car
      label: ฝากล่อกับเกวียนไว้กับนายสถานี แล้วขึ้นตู้ท้าย
      text: |
        {name}ยื่นเชือกล่อให้นายสถานี บอกว่าคนจากป้อมจะมารับก่อนค่ำ แล้วปีนขึ้นตู้ท้ายโดยไม่ลาใคร คนคุมตู้เลื่อนตัวให้นั่งตรงขอบประตูด้วยกัน ยื่นขนมปังให้ครึ่งก้อน

        ขบวนออกตอนเที่ยง หญ้าสีเงินข้างรางเปลี่ยนเป็นหญ้าสีเขียวตอนบ่ายของวันที่สาม ทั้งทางไม่มีใครถามว่ามาจากไหน
      effects:
        mark: ทิ้งป้อมสามก่อนครบเวลา
        clear_flags: [job_wardens, job_fort_priest]
        reputation: { wardens: -2 }
        location_tag: ventras
        flags: [left_the_fort, deserted_the_fort]
    - id: letter_on_the_cart
      label: เขียนกระดาษถึงเอสทริน เหน็บไว้ใต้เชือกมัดถัง แล้วขึ้นตู้ท้าย
      text: |
        กระดาษแผ่นนั้นเขียนได้สามบรรทัด เข่า มือ ขอให้ขีดบรรทัดสุดท้ายในช่องที่นางเห็นว่าใช่ {name}เหน็บไว้ใต้เชือกมัดถังน้ำมันใบหน้าสุด ตรงที่เอสทรินต้องเอาขอเหล็กเกี่ยวเป็นใบแรก

        ขบวนออกตอนเที่ยง {name}นั่งหันหลังให้แดนเถ้าจนพ้นหญ้าสีเงิน ไม่รู้ว่านางขีดบรรทัดนั้นลงช่องไหน
      effects:
        mark: ทิ้งป้อมสามก่อนครบเวลา
        clear_flags: [job_wardens, job_fort_priest]
        reputation: { wardens: -1 }
        location_tag: ventras
        flags: [left_the_fort, deserted_the_fort, left_a_note_for_estrin]
    - id: drive_back
      label: ขึ้นนั่งบนเกวียน จูงล่อกลับป้อม
      check: { stat: CON, dc: 12 }
      success:
        text: |
          ล่อเดินกลับทางเดิมโดยไม่ต้องบอก {name}นั่งบนเกวียนจนถึงหญ้าสีเงินช่วงที่โค้งเข้าหาป้อม ตอนนั้นเข่าขวายังไม่งอเต็มที่ แต่ยกขึ้นวางบนไม้พักเท้าได้

          ถึงป้อมตอนตะวันตกดิน เอสทรินนับถังลงจนครบ ขีดช่องรับให้ ตารางเวรเดือนหน้าเขียนชื่อ{name}ไว้ในช่องยืนหินก้อนเดิม
        effects: { stats: { CON: 1 }, flags: [stayed_past_the_train] }
      failure:
        text: |
          ครึ่งทางกลับ เข่าขวาของ{name}ล็อกแข็งจนก้าวลงจากเกวียนไม่ได้ ต้องนั่งรอบนเกวียนกลางทุ่งจนคนจากป้อมขี่ล่อออกมาตามตอนค่ำ

          เบอร์ทัลเอาน้ำมันหมูอุ่นนวดเข่าให้ทั้งคืน บอกว่าเข่าของเขาเริ่มแบบนี้ตอนที่อยู่ป้อมมาได้ครึ่งหนึ่งของตอนนี้
        effects: { hp: -1, flags: [stayed_past_the_train] }
    - id: read_the_boxes
      label: เปิดผ้าคลุมกล่องดีบุกที่ต้องส่งขึ้นขบวนวันนี้ อ่านชื่อบนฝาทีละใบ
      requires: { flag: job_fort_priest }
      text: |
        กล่องสามใบ ชื่อสามชื่อ ชื่อหนึ่ง{name}เป็นคนสวดส่งเมื่อสามวันก่อน ผู้เฝ้าอายุน้อยกว่า{name}ครึ่งหนึ่ง ตายที่หินก้อนที่สามสิบเก้า {name}ยื่นกล่องให้คนคุมตู้ทีละใบ บอกชื่อบนฝาให้ฟังทุกชื่อ คนคุมตู้ทวนชื่อตาม

        ขบวนออกตอนเที่ยง {name}ยืนอยู่ข้างเกวียนจนตู้ท้ายพ้นสายตา แล้วจูงล่อกลับป้อม
      effects: { stats: { WIS: 1 }, flags: [stayed_past_the_train] }
