# วัยหนุ่มสาว 15–17 ทางนักย่อง (class: rogue)
# สองเรื่องแรกใช้ได้ทุกทาง ไม่ระบุถิ่น (youth.rogue_caught ไม่ใช้กับพวกพาข้ามแดน เพราะงานนั้นไม่ได้หยิบของใคร)
# youth.rogue_horned_passage ใช้กับหนูท่าและพวกพาข้ามแดน งานพาเด็กมีเขาผ่านด่านโดยไม่คิดเงิน (คัมภีร์ หัวข้อกลุ่มอำนาจ)
# แยกสองแบบ: คนธรรมดา กับทีฟลิ่งที่ต้องผ่านตะเกียงตรวจหัวด้วยตัวเอง ใช้ตัวเลือกลุยน้ำกับส่งต่อร่วมกัน
# youth.rogue_caught ไม่ใช้กับพวกเผาค่ายตัดไม้ เพราะงานนั้นไม่ได้หยิบของใคร
# youth.rogue_mooring_rope ต้องมีปี 298 ขึ้นไป เรือเหาะลำแรกขึ้นปี 289 ต้องรอหลายปีกว่าบริษัทจะมีเรือผูกเต็มหอท่า
# youth.rogue_weigh_station ต้องมีปี 302 ขึ้นไป เพราะหนี้บนกำแพงสภาเป็นหนี้สงครามถ่าน
# ตายได้จุดเดียวในไฟล์นี้: youth.rogue_mooring_rope ตัวเลือก climb_rope ทางที่พลาด

- id: youth.rogue_known_face
  stage: youth
  weight: 30
  when:
    age: [15, 16]
    class: rogue
  text: |
    งานคืนนี้ง่ายที่สุดตั้งแต่เริ่มมา ยืนดูต้นทาง เห็นใครเดินมาให้ผิวปากสองที คนอื่นทำงานอยู่ข้างหลัง {name}มีหน้าที่แค่ยืนอยู่ในเงา ทำเหมือนรอใครสักคน

    แล้วคนที่เดินมาก็เป็นคนที่{name}รู้จัก คนที่เห็น{name}มาตั้งแต่ยังตัวเท่าเอว และเคยพูดถึง{name}ให้คนอื่นฟังแต่ในทางดี

    เขาหยุดเดิน หรี่ตามอง แล้วเรียกชื่อ{name}ออกมาดังๆ ทั้งที่เสียงผิวปากยังไม่ทันออกจากปาก
  choices:
    - id: talk_smooth
      label: ทักกลับเสียงดังกว่า ทำเหมือนดีใจที่เจอ แล้วพาเขาเดินออกไป
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          {name}เดินเข้าไปกอดเขา ถามเรื่องคนที่รู้จักกันทีละคนจนเขาต้องนับนิ้วตอบ แล้วเดินไปส่งเขาตามทางที่เขาจะไป เขาเดินคุยไปทั้งที่ยังเล่าไม่จบ ไม่ได้หันกลับไปมองทางที่{name}ยืนเฝ้าอยู่เลยสักครั้ง

          ตอนแยกกัน เขาบอกว่าดีใจที่เห็น{name}โตขึ้นมาดี {name}บอกว่าดีใจเหมือนกัน แล้วเดินกลับไปหาคนอื่น งานคืนนั้นเสร็จครบทุกอย่าง
        effects: { stats: { CHA: 1 }, flags: [fooled_home_face] }
      failure:
        text: |
          {name}ทักกลับเร็วเกินไป เสียงสูงเกินไป เขาเลยมองข้ามไหล่{name}ไปข้างหลัง ตรงที่มีเงาคนขยับอยู่

          เขาไม่ได้ร้องเรียกใคร แค่ยืนดูจนคนข้างหลังรู้ตัวและหนีกันไปหมด งานคืนนั้นพังทั้งงาน หัวหน้าไม่ให้{name}ยืนต้นทางอีกทั้งเดือน แล้วบอกว่าคราวหน้า ถ้าเจอคนรู้จัก ให้ผิวปากก่อน ค่อยทัก
        effects: { stats: { CON: 1 }, flags: [seen_by_home_face] }
    - id: whistle_and_run
      label: ผิวปากสองที แล้ววิ่งไปอีกทาง
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}ผิวปาก แล้ววิ่งเข้าทางแรกที่เจอ เลี้ยวแล้วเลี้ยวอีก ข้ามอะไรสักอย่างที่มองไม่เห็นในความมืด จนเสียงเรียกชื่อข้างหลังเงียบไป คนอื่นหนีทันกันทุกคน

          แต่เขาเห็นหน้าแล้ว อีกครึ่งเดือนต่อมา คนที่รู้จัก{name}ทุกคนรู้ว่ามีคนเห็น{name}ยืนอยู่ในเงาตอนดึก กับคนที่ไม่ควรอยู่ด้วย ข่าวไปถึงก่อนตัว{name}เสมอ
        effects: { stats: { DEX: 1 }, flags: [known_back_home] }
      failure:
        text: |
          {name}วิ่งไปได้สามก้าว แขนเสื้อก็ติดอยู่ในมือเขา เขาไม่ได้ดึงแรง จับไว้เฉยๆ แล้วพูดเบาๆ ว่ากลับไปเถอะ ยังทันอยู่

          {name}สะบัดแขนจนเสื้อขาด แล้ววิ่งต่อ เศษแขนเสื้อติดมือเขาไปชิ้นหนึ่ง {name}ไม่เคยเย็บเสื้อตัวนั้นใหม่ ใส่ทั้งที่ขาดอย่างนั้นจนเปื่อย
        effects: { stats: { DEX: 1 }, flags: [known_back_home] }
    - id: tell_truth
      label: เดินไปหาเขา บอกตรงๆ ว่ากำลังทำงาน ขอให้เดินต่อไปเหมือนไม่เห็น
      text: |
        เขาฟังจนจบ มองหน้า{name}อยู่นานเหมือนกำลังหาเด็กตัวเท่าเอวคนนั้นในหน้านี้ แล้วถอนหายใจยาว พยักหน้าครั้งเดียว เดินต่อไปตามทางเดิม ไม่หันกลับมาดู

        เขาไม่เคยเอาเรื่องคืนนั้นไปเล่าให้ใครฟัง {name}รู้ เพราะถ้าเขาเล่า ข่าวจะกลับมาถึงก่อนสิ้นเดือน แต่ไม่มีข่าวอะไรมาเลย
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [asked_to_be_unseen] }

- id: youth.rogue_caught
  stage: youth
  weight: 30
  when:
    age: [16, 17]
    class: rogue
    not_flags: [path_crossing_crew, path_camp_burners]
  text: |
    ทุกงานมีคืนที่พลาด คืนนี้ของ{name}มาถึงในรูปของมือที่จับคอเสื้อจากข้างหลัง ยามคนหนึ่ง ตะเกียงอยู่ในมืออีกข้าง ลมหายใจกลิ่นเหล้าหวาน เขาหัวเราะเหมือนคนเพิ่งตกปลาได้ตัวโต

    ของที่{name}เพิ่งหยิบมายังอยู่ในเสื้อ คนอื่นหายไปหมดแล้ว อย่างที่ตกลงกันไว้ตั้งแต่ก่อนเริ่มงาน ว่าใครโดนจับ คนนั้นไม่รู้จักใคร
  choices:
    - id: twist_free
      label: บิดตัวหลุดจากเสื้อ ทิ้งเสื้อไว้ในมือเขา แล้ววิ่ง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ยกแขนขึ้นเหนือหัวแล้วทรุดตัวลง เสื้อทั้งตัวหลุดขึ้นไปค้างอยู่ในกำมือยาม ของที่ซ่อนไว้ก็ร่วงลงพื้นไปด้วย แต่{name}ไม่ได้ก้มเก็บ วิ่งตัวเปล่าฝ่าลมกลางคืนไปจนถึงที่ซ่อนตัว

          กลับมามือเปล่า แต่ตัวยังอยู่ หัวหน้าโยนเสื้อตัวใหม่ให้ บอกว่าเสื้อหาใหม่ได้ ตัวคนหายาก
        effects: { stats: { DEX: 1 }, flags: [slipped_the_guard] }
      failure:
        text: |
          เสื้อหลุดออกครึ่งตัวแล้วติดที่ข้อศอก ยามดึงกลับทีเดียว{name}ก็ล้มลงกับพื้น แล้วรองเท้าของเขาก็ตามลงมาที่ซี่โครง สองที สามที จนเขาเหนื่อยเอง

          ยามลาก{name}ไปถึงหน้าป้อมยาม แล้วเปลี่ยนใจ เพราะถ้าพาเข้าไปต้องนั่งเขียนบันทึกจนเช้า เขาเตะซ้ำอีกทีแล้วปล่อยให้คลานกลับไปเอง ของที่หยิบมาอยู่ในกระเป๋าเขาแทน ซี่โครงข้างนั้นปวดทุกครั้งที่หัวเราะไปจนหมดหน้าหนาว
        effects: { stats: { CON: 1 }, hp: -3, flags: [beaten_by_guard] }
    - id: bargain
      label: ยื่นของคืนให้ แล้วบอกว่าเขาเก็บไว้เองก็ได้ ไม่มีใครรู้
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          ยามชั่งของในมือ แล้วชั่งหน้า{name} มือที่จับคอเสื้อคลายลงทีละนิ้ว เขาหัวเราะอีกที เสียงเบากว่าเดิม แล้วบอกให้ไปให้พ้นหน้าก่อนเขาจะเปลี่ยนใจ

          {name}ไม่ได้อะไรกลับมาจากงานคืนนั้น แต่ได้รู้ว่ายามคนนี้ชอบเหล้าหวาน เดินเวรสายตะวันออกทุกคืนวันเบเลค และมีราคา
        effects: { stats: { CHA: 1 }, flags: [bought_a_guard] }
      failure:
        text: |
          ยามรับของไปใส่กระเป๋าตัวเอง แล้วลาก{name}ไปห้องขังต่อเหมือนไม่ได้ยินอะไร ตอนเช้า ของชิ้นนั้นไม่มีอยู่ในบันทึกของกลาง

          {name}ออกมาได้ตอนบ่าย ไม่มีอะไรติดตัวกลับมาเลย ตอนเดินผ่านป้อมยาม ยามคนนั้นยกขวดเหล้าหวานขวดใหม่ขึ้นทักจากหน้าต่าง
        effects: { stats: { CON: 1 }, hp: -1, flags: [night_in_cell] }
    - id: stay_silent
      label: ยอมให้เขาพาไป ไม่พูดชื่อใครสักคน
      text: |
        คนที่สอบสวนเปลี่ยนหน้ามาสามคนในสามวัน คนแรกตะคอก คนที่สองยื่นขนมปังให้แล้วถามเหมือนเพื่อน คนที่สามไม่ถามอะไรเลย นั่งมองเฉยๆ ครึ่งวัน {name}ตอบทุกคนเหมือนกันหมด ว่าทำคนเดียว

        วันที่สี่มีคนมาจ่ายค่าปรับให้ คนที่จ่ายเป็นใครไม่รู้ ไม่เคยเห็นหน้า หัวหน้ามารอรับอยู่หัวมุมถนน ยื่นขวดน้ำให้ แล้วเดินนำกลับไปโดยไม่พูดอะไร ตั้งแต่วันนั้น งานที่หัวหน้าส่งมาให้{name}ไม่มีงานยืนดูต้นทางอีกเลย
      effects: { stats: { CON: 1 }, alignment: { law: -1 }, flags: [kept_silent_caught] }

- id: youth.rogue_mooring_rope
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    year: [298, 317]
    flags: [path_dock_rats]
  text: |
    เรือเหาะของบริษัทเดินเรือลำหนึ่งผูกอยู่ที่หอท่าหลังที่สี่มาสามวันแล้ว รอลมสงบ ในห้องเก็บของใต้ท้องเรือมีหลอดน้ำค้างดาวสำหรับปืนเวทหกกล่อง หนูท่ามีคนรับซื้อไว้แล้วทั้งหกกล่อง

    ทางขึ้นมีสองทาง ทางบันไดหอท่ามียามสองคนผลัดกันทั้งคืน อีกทางคือเชือกผูกเรือเส้นเท่าแขน ขึงจากหลักบนลานขึ้นไปถึงห่วงใต้ท้องเรือ คืนนี้ลมแรงจนเรือแกว่ง เชือกตึงแล้วหย่อน ตึงแล้วหย่อน

    หัวหน้าถามว่าคืนนี้ใครจะขึ้น ทุกคนมองเชือก แล้วมองหน้ากันเอง
  choices:
    - id: climb_rope
      label: ปีนเชือกผูกเรือขึ้นไปทั้งที่ลมแรง
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          {name}รอจังหวะเชือกตึงแล้วไต่ขึ้นทีละช่วงแขน พอเชือกหย่อนก็กอดไว้ทั้งตัว ปล่อยให้ลมเหวี่ยงไปมา ลานข้างล่างเล็กลงเรื่อยๆ จนตะเกียงยามเหลือเท่าหัวไม้ขีด กว่าจะคว้าห่วงใต้ท้องเรือได้ ฝ่ามือก็ถลอกจนเลือดซึม

          ขนลงมาได้สองกล่อง ทีละกล่อง ผูกเชือกหย่อนลงไปให้คนข้างล่างรับ ส่วนของ{name}มากกว่าทุกคน หัวหน้าไม่พูดอะไร แต่คืนต่อมาเขาให้{name}เป็นคนเลือกว่าใครจะขึ้น
        effects: { stats: { DEX: 1, STR: 1 }, gold: 12, reputation: { dock_rats: 1 }, flags: [climbed_mooring_rope] }
      failure:
        text: |
          ครึ่งทางขึ้นไป ลมกระโชกมาตอนที่เชือกหย่อนสุด เชือกกระตุกกลับขึ้นไปตึงในอึดใจเดียว แรงพอสะบัดมือข้างหนึ่งหลุด อีกข้างก็ตามไปเพราะรับน้ำหนักทั้งตัวไม่ไหว

          คนบนลานได้ยินเสียงหลังคาโกดังยุบ แล้วก็เงียบ ตอนเช้ายามหอท่าเขียนลงสมุดว่าพบคนตกจากที่สูง ไม่ทราบชื่อ ส่วนเรือเหาะลำนั้นออกจากท่าตอนสาย ลมสงบพอดี
        effects: { die: true }
    - id: bribe_guard
      label: เอาเงินที่มีไปซื้อยามบันไดหนึ่งคน
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          ยามคนที่สองเพิ่งได้ลูกคนแรก บ่นเรื่องค่านมแพะให้ทุกคนที่ยอมฟัง {name}ยอมฟัง ฟังจนจบ แล้ววางเหรียญสองเหรียญไว้บนราวบันได ตรงที่มือเขาวางอยู่

          เขาไปเข้าห้องส้วมนานกว่าปกติ นานพอให้คนสองคนขึ้นไปแล้วลงมาพร้อมกล่องหนึ่งกล่อง ส่วนแบ่งหักค่ายามแล้วยังเหลือมากกว่าที่ลงไป
        effects: { stats: { CHA: 1 }, gold: 5, flags: [bought_a_guard] }
      failure:
        text: |
          ยามรับเหรียญไป กำไว้ในมือ แล้วเป่านกหวีดเรียกยามอีกคนลงมาจากหอ {name}วิ่งหนีทัน แต่ข้อเท้าพลิกตอนกระโดดลงจากกองลังไม้

          เงินสองเหรียญนั้นยามคงเอาไปซื้อนมแพะ {name}ได้แต่ข้อเท้าบวมกลับไป
        effects: { stats: { WIS: 1 }, gold: -2, hp: -1 }
    - id: watch_below
      label: ยืนดูต้นทางอยู่ข้างล่าง ให้คนอื่นปีน
      text: |
        คนที่ขึ้นคือเด็กหนูท่ารุ่นพี่ ตัวเล็กกว่า{name} มือเร็วกว่าทุกคน เขาไต่ขึ้นไปจนลับตาในความมืด แล้วกล่องแรกก็ค่อยๆ หย่อนลงมาตามเชือก {name}ยืนอยู่หัวลาน ผิวปากเบาๆ ทุกครั้งที่ยามบนหอหันมาทางนี้

        ส่วนแบ่งของคนดูต้นทางน้อยที่สุด หัวหน้านับเหรียญใส่มือให้สามเหรียญ แล้วบอกว่าคราวหน้าเชือกเส้นนั้นเป็นของ{name}
      effects: { stats: { DEX: 1 }, gold: 3, flags: [rope_next_time] }

- id: youth.rogue_horned_passage
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    class: rogue
    not_flags: [path_rail_runner, path_camp_burners, race_tiefling]
  text: |
    งานนี้ไม่มีใครได้เงิน หัวหน้าบอกตั้งแต่ก่อนเริ่ม เด็กมีเขาอายุราวหกขวบคนหนึ่งต้องผ่านด่านตรวจของศาสนจักรตะเกียงไปให้ได้ก่อนรุ่งเช้า ฝั่งโน้นมีคนรอรับ ใครรอ ไม่มีใครบอก

    เด็กคนนั้นนั่งกอดเข่าอยู่ในมุมห้อง ปลายเขาเพิ่งงอกพ้นผมขึ้นมาครึ่งข้อนิ้ว มีคนเอาผ้าพันหัวไว้ให้ แต่พันแน่นจนหน้าผากแดงเป็นรอย

    ด่านตั้งอยู่บนทางเดียวที่เกวียนผ่านได้ คืนนี้มีนักล่าแม่มดสองคน กับตะเกียงแขวนดวงใหญ่ ส่องทุกหัวที่ผ่าน
  choices:
    - id: sick_disguise
      label: ทาหน้าเด็กให้ซีดเหมือนคนเป็นไข้ แล้วบอกว่าเป็นไข้ที่ติดกันง่าย
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}เอาแป้งผสมขี้เถ้าทาหน้าเด็กให้ซีด ป้ายน้ำมันหมูที่ริมปากให้แห้งแตก แล้วอุ้มเดินเข้าไปหาตะเกียงแขวนด้วยท่าทางของคนที่เดินมาสามวันไม่ได้นอน นักล่าแม่มดคนหนึ่งเอื้อมมือมาจะแกะผ้า {name}บอกว่าน้องเพิ่งเริ่มไอเมื่อเช้า แล้วเด็กก็ไอขึ้นมาพอดี ไอแห้งยาว

          มือนักล่าแม่มดหดกลับเร็วกว่าตอนยื่นมา เขาโบกให้ผ่าน แล้วเอาผ้าปิดจมูกตัวเอง เลยด่านไปครึ่งชั่วยาม เด็กกระซิบว่าไอเก่งไหม {name}บอกว่าเก่งที่สุดเท่าที่เคยได้ยิน
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [passed_horned_child] }
      failure:
        text: |
          นักล่าแม่มดคนที่สองไม่กลัวไข้ เขาบอกว่าคนเป็นไข้ก็มีหัว แล้วดึงผ้าออก {name}ผลักตะเกียงแขวนให้ล้มก่อนผ้าจะหลุดถึงตอเขา ไฟดับทั้งด่าน เด็กวิ่งหายเข้าไปในความมืดอย่างที่ซ้อมกันไว้

          {name}โดนกดลงกับพื้นจนหน้าเปื้อนดิน นอนห้องขังของวิหารอยู่สามคืน แล้วได้ออกมาเพราะไม่มีใครเห็นตอเขาแม้แต่คนเดียว ไม่มีใครบอก{name}ว่าเด็กไปถึงฝั่งโน้นหรือเปล่า {name}ก็ไม่ได้ถาม
        effects: { stats: { CON: 1 }, hp: -2, reputation: { lamp_church: -1 }, flags: [passed_horned_child, lamp_church_cell] }
    - &horned_wade
      id: wade_around
      label: อุ้มเด็กอ้อมด่าน ลุยน้ำเย็นไปตามทางที่ไม่มีใครใช้
      check: { stat: CON, dc: 12 }
      success:
        text: |
          ทางอ้อมด่านต้องลุยน้ำครึ่งคืน น้ำลึกถึงอกตอนกลาง เย็นจนฟันกระทบกันเสียงดังกว่าเสียงน้ำ {name}ให้เด็กขี่คอ ให้เด็กกำผมไว้แน่นๆ แล้วเดินไปทีละก้าว ใช้เท้าคลำหาหินใต้น้ำก่อนลงน้ำหนัก

          ขึ้นฝั่งได้ตอนฟ้าเริ่มเทา มีคนยืนรออยู่ที่ต้นไม้ตายต้นเดียวริมทาง เขาห่อเด็กด้วยผ้าขนสัตว์ผืนใหญ่ แล้วยื่นกระติกเหล้าให้{name} {name}มือสั่นจนเปิดฝาไม่ออก เขาเปิดให้
        effects: { stats: { CON: 1, STR: 1 }, alignment: { moral: 1 }, flags: [passed_horned_child] }
      failure:
        text: |
          กลางทาง ขาข้างหนึ่งเป็นตะคริวเพราะความเย็น {name}ล้มลงทั้งตัว เด็กหลุดจากคอ ทั้งสองคนจมลงไปพร้อมกัน แล้วโผล่ขึ้นมาพร้อมกัน {name}คว้าเสื้อเด็กไว้ได้ ลากกันกลับเข้าฝั่งเดิม

          คืนนั้นข้ามไม่ได้ ต้องรอคืนต่อมา คนที่พาเด็กไปในคืนที่สองไม่ใช่{name} เพราะ{name}นอนไข้อยู่สามวัน ตอนหายไข้ หัวหน้าบอกว่าเด็กไปถึงแล้ว และฝากบอกว่าไม่โกรธที่ทำตก
        effects: { stats: { CON: 1 }, hp: -2, alignment: { moral: 1 } }
    - &horned_hand_over
      id: hand_over
      label: บอกหัวหน้าว่าทำไม่ได้ ให้คนอื่นพาไป
      text: |
        หัวหน้าไม่ได้ว่าอะไร แค่พยักหน้า แล้วเรียกชื่อคนต่อไป คนนั้นพยักหน้ารับโดยไม่ถามสักคำ แล้วจูงมือเด็กออกไปทางประตูหลัง

        {name}นอนไม่หลับทั้งคืน ตอนเช้าไม่มีใครพูดถึงเรื่องนี้ วันต่อมาก็ไม่มี ไม่มีใครบอกว่าเด็กไปถึงหรือไม่ถึง
      effects: { stats: { WIS: 1 }, flags: [refused_passage] }

- id: youth.rogue_horned_passage_marked
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    class: rogue
    flags: [race_tiefling]
    not_flags: [path_rail_runner, path_camp_burners]
  text: |
    งานนี้ไม่มีใครได้เงิน หัวหน้าบอกตั้งแต่ก่อนเริ่ม เด็กมีเขาอายุราวหกขวบคนหนึ่งต้องผ่านด่านตรวจของศาสนจักรตะเกียงไปให้ได้ก่อนรุ่งเช้า ฝั่งโน้นมีคนรอรับ ใครรอ ไม่มีใครบอก

    เด็กคนนั้นนั่งกอดเข่าอยู่ในมุมห้อง ปลายเขาเพิ่งงอกพ้นผมขึ้นมาครึ่งข้อนิ้ว มีคนเอาผ้าพันหัวไว้ให้ แต่พันแน่นจนหน้าผากแดงเป็นรอย หัวหน้าเลือก{name} เพราะ{name}รู้ดีที่สุดว่าผ้าพันหัวต้องพันอย่างไรถึงจะไม่เจ็บ

    ด่านตั้งอยู่บนทางเดียวที่เกวียนผ่านได้ คืนนี้มีนักล่าแม่มดสองคน กับตะเกียงแขวนดวงใหญ่ ส่องทุกหัวที่ผ่าน หัวของ{name}ก็ต้องผ่านแสงนั้นเหมือนกัน
  choices:
    - id: sick_pair
      label: พันผ้าบนหัวตัวเองกับเด็กแบบเดียวกัน ทาหน้าให้ซีดทั้งคู่ บอกว่าเป็นไข้ที่ติดกันง่าย
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}คลายผ้าบนหัวเด็กออกแล้วพันใหม่ให้หลวมพอหายใจ พันหัวตัวเองด้วยผ้าผืนเดียวกัน เอาแป้งผสมขี้เถ้าทาหน้าทั้งสองคนให้ซีด แล้วอุ้มเด็กเดินเข้าไปหาตะเกียงแขวนด้วยท่าทางของคนที่เดินมาสามวันไม่ได้นอน

          นักล่าแม่มดคนหนึ่งเอื้อมมือมาจะแกะผ้าบนหัว{name} {name}ไอใส่มือเขาเต็มๆ ไอแห้งยาว เด็กไอตามอีกคน มือนั้นหดกลับเร็วกว่าตอนยื่นมา เขาโบกให้ผ่าน แล้วเอาผ้าปิดจมูกตัวเอง เลยด่านไปครึ่งชั่วยาม เด็กกระซิบถามว่าพี่ไอเก่งไหม {name}บอกว่าเก่งน้อยกว่าเด็กคนนี้นิดเดียว
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [passed_horned_child] }
      failure:
        text: |
          นักล่าแม่มดคนที่สองไม่กลัวไข้ เขาบอกว่าคนเป็นไข้ก็มีหัว แล้วดึงผ้าบนหัวเด็ก {name}ผลักตะเกียงแขวนให้ล้ม ไฟดับทั้งด่าน เด็กวิ่งหายเข้าไปในความมืดอย่างที่ซ้อมกันไว้

          มือของนักล่าแม่มดยังขยุ้มผ้าบนหัว{name}อยู่ {name}ดิ้นหลุดในความมืดก่อนไฟจะติดใหม่ ผ้าผืนนั้นหลุดค้างอยู่ในมือเขา วิ่งไปถึงโค้งแรกยังได้ยินเขาตะโกนบอกอีกคนว่าคืนนี้มีสองตัว
        effects: { stats: { DEX: 1 }, hp: -1, reputation: { lamp_church: -1 }, flags: [passed_horned_child, hunted_by_witch_hunter] }
    - id: be_the_bait
      label: ส่งเด็กให้คนอื่นอุ้ม แล้วเดินเข้าแสงตะเกียงเองโดยไม่พันผ้า
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          {name}เดินเข้าไปในแสงตะเกียงหัวโล่ง ผ่านหน้านักล่าแม่มดไปสามก้าวถึงมีคนเห็น ทั้งสองคนลุกพรวดขึ้นพร้อมกัน {name}หันหลังวิ่งกลับเข้าความมืด เสียงรองเท้าสองคู่ไล่ตามมา ทิ้งด่านไว้ว่าง คนของหัวหน้าอุ้มเด็กเดินผ่านด่านไปตอนนั้นเอง ไม่ต้องรีบ

          {name}พาพวกเขาวิ่งวนอยู่จนฟ้าเริ่มเทา ปล่อยให้เกือบตามทันสองครั้ง แล้วหายไปในทางที่มีแต่หนูท่ารู้ กลับถึงที่ซ่อนตัว หัวหน้ายื่นน้ำให้ แล้วบอกว่าเด็กไปถึงแล้ว
        effects: { stats: { DEX: 1 }, alignment: { moral: 1 }, reputation: { lamp_church: -1 }, flags: [passed_horned_child, hunted_by_witch_hunter] }
      failure:
        text: |
          {name}วิ่งได้เร็ว แต่นักล่าแม่มดคนหนึ่งวิ่งเร็วกว่า เขาเหวี่ยงตะเกียงมือถือฟาดเข้ากลางหลัง น้ำมันร้อนสาดติดเสื้อ ไฟลุกเป็นแถบ {name}กลิ้งตัวกับพื้นจนไฟดับ แล้วลุกวิ่งต่อทั้งที่หลังยังร้อนจนตาพร่า

          เด็กผ่านด่านไปได้ระหว่างที่ทั้งสองคนวิ่งไล่ หลังของ{name}เป็นแผลพองยาวเท่าฝ่ามือ หายแล้วเหลือรอยดำไปตลอดชีวิต และนักล่าแม่มดคนนั้นเห็นหน้า{name}ชัดในแสงไฟจากเสื้อตัวเอง
        effects: { stats: { DEX: 1 }, hp: -2, alignment: { moral: 1 }, reputation: { lamp_church: -1 }, flags: [passed_horned_child, hunted_by_witch_hunter] }
    - *horned_wade
    - *horned_hand_over

- id: youth.rogue_weigh_station
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    year: [302, 317]
    flags: [path_rail_runner]
  text: |
    ถ่านมารที่ออกจากเหมืองของตระกูลต้องผ่านตาชั่งของบริษัทที่สถานีกลางเขา คนแคระเรียกตาชั่งนั้นว่าปากหนี้ ทุกก้อนที่ผ่านปากหนี้ไป ตัวเลขบนกำแพงสภาลดลงนิดหนึ่ง ส่วนก้อนที่ไม่ผ่าน ตระกูลเก็บไว้เอง

    เดือนนี้บริษัทส่งผู้ตรวจคนใหม่ขึ้นมา มนุษย์หนุ่มจากเวนทราส ใส่แว่นช่าง นับทุกตู้สองรอบ และจดน้ำหนักลงสมุดของตัวเองแยกจากสมุดของสถานี

    คืนพรุ่งนี้มีขบวนของตระกูลผ่าน ตู้ที่สามมีถ่านเกินจากที่แจ้งไว้สองตัน
  choices:
    - id: swap_weights
      label: แอบเปลี่ยนตุ้มถ่วงในตาชั่งก่อนขบวนมาถึง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ตุ้มถ่วงของปากหนี้เป็นแท่งเหล็กหล่อสิบสองแท่ง เรียงอยู่ในรางใต้แท่นชั่ง {name}มุดลงไปตอนผู้ตรวจไปกินข้าว เอาแท่งที่สามออก ใส่แท่งที่ช่างของตระกูลหล่อตะกั่วอัดไส้ไว้ตั้งแต่ปีกลายแทน หน้าตาเหมือนแท่งเดิมทุกอย่าง แต่หนักกว่า เสร็จก่อนข้าวต้มชามหนึ่งจะเย็น

          คืนนั้นตู้ที่สามชั่งได้ตรงกับที่แจ้งพอดี ผู้ตรวจนับสองรอบ ได้เท่ากันทั้งสองรอบ เขาจดลงสมุดของตัวเอง แล้วขีดเส้นใต้สองเส้น ไม่รู้ว่าขีดเพราะพอใจ หรือเพราะตัวเลขพอดีเกินไป
        effects: { stats: { DEX: 1 }, reputation: { dwarf_council: 1 }, flags: [swapped_debt_weights] }
      failure:
        text: |
          ผู้ตรวจกลับมาก่อนเวลา เขาไม่ได้ไปกินข้าว เขาไปเอาตะเกียงอีกดวง {name}ยังมีแท่งเหล็กอยู่ในมือตอนที่แสงตะเกียงส่องลงมาในราง

          เขาไม่เรียกยาม แค่ขอให้{name}ยื่นแท่งเหล็กขึ้นมาให้ดู แล้วชั่งมันกับมือตัวเอง เช้าวันต่อมา สภาตระกูลได้หนังสือจากบริษัท ค่าปรับเท่าถ่านสองตัน ลุงที่ยื่นเสื้อคลุมมีซับให้{name}ในคืนสาบานเป็นคนเอาไปจ่าย และไม่ได้พูดกับ{name}อีกเลยจนสิ้นปี
        effects: { stats: { DEX: 1 }, reputation: { dwarf_council: -1 }, flags: [weigh_station_caught] }
    - id: drink_with_inspector
      label: ไปนั่งดื่มกับผู้ตรวจคนใหม่ทุกคืนก่อนขบวนมา
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          ผู้ตรวจคนใหม่ไม่มีใครคุยด้วยบนเขา คนแคระไม่คุยกับคนของบริษัท ส่วนคนของบริษัทคนอื่นอยู่สถานีล่างกันหมด {name}เอาเหล้าเห็ดไปนั่งด้วยสามคืน ฟังเขาเล่าเรื่องหนี้ที่เขาติดวิหารเบเลค เรื่องแม่ที่มือเริ่มใส เรื่องที่เขาเกลียดความหนาว

          คืนที่ขบวนผ่าน เขายังเมาค้างจากคืนก่อน นับตู้ที่สามรอบเดียว แล้ววางปากกาลง บอก{name}ว่าบางคืนก็นับรอบเดียวได้ ตอนพูดเขาไม่ได้มองตาชั่ง
        effects: { stats: { CHA: 1 }, reputation: { dwarf_council: 1 }, flags: [befriended_inspector] }
      failure:
        text: |
          ผู้ตรวจดื่มเก่งกว่าคนแคระ เขาดื่มทุกแก้วที่{name}รินให้ แล้วตื่นเช้ามานับตู้สองรอบเหมือนเดิม ถ่านเกินสองตันลงไปอยู่ในสมุดของเขาครบทั้งสองตัน

          ตอนขบวนออกจากสถานี เขาเดินมาขอบคุณ{name}เรื่องเหล้า บอกว่าไม่ได้คุยกับใครยาวขนาดนี้มาครึ่งปี ส่วนเรื่องตู้ที่สาม เขาบอกว่าขอโทษ แต่แม่เขาต้องกินข้าว
        effects: { stats: { CON: 1 }, flags: [befriended_inspector] }
    - id: shovel_off
      label: ตอนขบวนจอดรอสับรางก่อนถึงสถานี ขึ้นไปโกยถ่านเกินลงข้างราง
      check: { stat: STR, dc: 13 }
      success:
        text: |
          ขบวนจอดรอสับรางที่ทางแยกก่อนถึงสถานีครึ่งชั่วยามทุกคืน {name}ปีนขึ้นตู้ที่สามพร้อมพลั่วไม้ โกยถ่านมารลงซอกหินข้างรางทีละพลั่ว ถ่านร้อนจนด้ามพลั่วไหม้เป็นรอยดำ ไอร้อนลอยขึ้นมาแสบตา พอหัวรถจักรเป่าหวูด {name}โกยไปได้เกือบหมด แล้วกระโดดลงก่อนล้อจะหมุน

          คืนนั้นตู้ที่สามชั่งได้เกินจากที่แจ้งไว้นิดเดียว พอให้ผู้ตรวจจดว่าตาชั่งคลาดเคลื่อน คืนต่อมาคนของตระกูลมาขนถ่านในซอกหินขึ้นเขาไป ซอกหินนั้นอุ่นอยู่จนเช้า หิมะรอบปากซอกละลายเป็นวง
        effects: { stats: { STR: 1 }, reputation: { dwarf_council: 1 }, flags: [shoveled_debt_coal] }
      failure:
        text: |
          คืนนั้นหัวรถจักรเป่าหวูดออกเร็วกว่าทุกคืน {name}ยังยืนอยู่บนกองถ่านตอนตู้กระชาก ล้มกลิ้งลงจากตู้ ไหล่กระแทกหินรางเต็มแรง ถ่านที่โกยลงไปได้ยังไม่ถึงครึ่ง

          ตู้ที่สามชั่งได้เกินจากที่แจ้งไว้เกือบตันครึ่ง ผู้ตรวจจดลงสมุดของตัวเอง แล้วขีดเส้นใต้สองเส้น ไหล่ของ{name}ยกไม่ขึ้นอยู่ครึ่งเดือน
        effects: { stats: { CON: 1 }, hp: -3, reputation: { dwarf_council: -1 }, flags: [weigh_station_caught] }
