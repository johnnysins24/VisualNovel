# ชุด 3 อายุ 41 ถึง 64: ขั้นงานของพรานกับกวีเร่ งานละสามเรื่อง
# ขั้นกลาง (41–48) คนที่ใครๆ มาตามตอนงานพัง กับครั้งแรกที่ร่างกายหรือยุคสมัยบอกว่าไม่
# ขั้นสูง (49–56) รับผิดชอบงานและความผิดของคนอื่น
# วันวางมือ (57–64) ทุกตัวเลือกตั้ง retired หรือ still_working อย่างใดอย่างหนึ่ง กับ flag เฉพาะของตัวเลือก

# ---------- นักล่าค่าหัว ----------
- id: adult.career_bounty_fire_cub
  stage: adult
  weight: 45
  when:
    age: [41, 48]
    flags: [job_bounty_hunter]
  text: |
    ผู้ใหญ่บ้านเตาร่วมเดินมาครึ่งวันเพื่อหา{name} ในมือถือประกาศค่าหัวที่ฉีกลงมาจากกระดานโรงเตี๊ยมเอง กระดาษไหม้ไปครึ่งแผ่น ค่าหัวสิบสองเหรียญ สำหรับสัตว์สีไฟตัวหนึ่งที่ออกมาจากเตาอบขนมปังกลางหมู่บ้านทุกคืน

    นักล่าหนุ่มสามคนรับประกาศไปก่อนแล้ว คนหนึ่งยิงโดนเต็มตัว กระสุนทะลุไปเหมือนยิงเข้ากองควัน สัตว์ตัวนั้นกระโดดข้ามรั้วไปเล่นในยุ้งข้าว ยุ้งไหม้ไปครึ่งหลัง ผู้ใหญ่บ้านเล่าว่ามันตัวเท่าหมา ไล่ไก่แต่ไม่กินไก่ และเริ่มออกมาตั้งแต่คืนที่คนอบขนมปังทะเลาะกับเมีย แล้วสาดน้ำทั้งถังเข้าปากเตา

    {name}ฟังจบก็รู้ว่าเป็นอะไร คนล่ารุ่นก่อนเรียกมันว่าลูกเสือไฟ และไม่มีใครในรุ่นนั้นรับเงินฆ่ามัน ทางครึ่งวันที่ผู้ใหญ่บ้านเพิ่งเดินมา {name}ต้องเดินกลับไปกับเขา ปีนี้เข่าทั้งสองข้างปวดทุกครั้งที่เดินเกินสองชั่วยาม
  choices:
    - id: relight_the_oven
      label: ตักน้ำออกจากเตา ก่อไฟใหม่ แล้วนั่งรออยู่หน้าปากเตา
      check: { stat: WIS, dc: 13, foe: nature }
      success:
        text: |
          {name}ใช้ขันตักน้ำเน่าที่ขังก้นเตาออกจนแห้ง ปูฟืนสนแห้งที่ผู้ใหญ่บ้านหามาให้ จุดไฟด้วยถ่านจากเตาในบ้านคนอบขนมปังเอง แล้วนั่งพิงผนังเตาอยู่ข้างปากเตาที่เปิดไว้ ปืนวางพาดตัก ไม่ได้บรรจุกระสุน

          ใกล้สาง ลูกเสือไฟเดินมาจากทางยุ้งที่ไหม้ ดมรองเท้าของ{name} ดมปืน แล้วกระโดดเข้าปากเตาไปนอนขดบนฟืน ไฟในเตาลุกสูงขึ้นหนึ่งศอกแล้วนิ่ง เช้านั้นหมู่บ้านเตาร่วมได้อบขนมปังเป็นครั้งแรกในรอบเดือน ผู้ใหญ่บ้านจ่ายแปดเหรียญ ไม่ครบสิบสอง เพราะไม่มีซากให้เอาไปแสดงที่โรงเตี๊ยม
        effects: { stats: { WIS: 1 }, gold: 8, taboo: { fire: keep }, flags: [calmed_the_fire_cub] }
      failure:
        text: |
          ผนังเตายังชื้น ไฟติดยาก ลูกเสือไฟมาถึงก่อนไฟจะลุกดี พอเห็นคนนั่งขวางปากเตา ลูกเสือก็กระโดดข้ามตัก{name}ไปทีเดียว ขนไฟปัดแขนเสื้อจนลุกพรึบ {name}กลิ้งตัวดับไฟบนพื้นดินหน้าเตา ได้ยินเสียงฟืนในเตาแตกเปรี๊ยะอยู่ข้างหลัง

          พอลุกขึ้นได้ ไฟในเตาลุกเต็มปากแล้ว ลูกเสือไฟนอนขดอยู่ข้างใน แขนซ้ายของ{name}พองเป็นแถบยาวเท่าฝ่ามือ ผู้ใหญ่บ้านจ่ายหกเหรียญ หักสองเหรียญไปเป็นค่าน้ำมันทาแผลที่ภรรยาแกเคี่ยวให้
        effects: { hp: -2, gold: 6, taboo: { fire: keep }, flags: [calmed_the_fire_cub] }
    - id: shoot_it_down
      label: ทำตามที่ประกาศเขียน ยิงให้ล้ม
      check: { stat: DEX, dc: 14, foe: nature }
      success:
        text: |
          คนรุ่นก่อนเล่าว่ากระสุนตะกั่วทะลุตัวมันไปเปล่าๆ {name}จึงแช่กระสุนในน้ำบ่อทั้งคืน แล้วห่อด้วยผ้าเปียกก่อนบรรจุ นัดเดียวเข้ากลางอก ลูกเสือไฟร้องเสียงเหมือนลูกแมว ขนไฟหดลงทีละกระจุก จนเหลือแต่ตัวสีเทาเท่าหมาแก่ตัวหนึ่ง นอนนิ่งอยู่บนดินเย็น

          ผู้ใหญ่บ้านจ่ายครบสิบสองเหรียญ ตลอดหน้าหนาวนั้นเตาอบขนมปังกลางหมู่บ้านจุดติดยากทุกเช้า ต้องใช้ฟืนมากกว่าเดิมเท่าตัว และขนมปังทุกก้อนออกมาก้นไหม้
        effects: { gold: 12, alignment: { moral: -1 }, taboo: { fire: learn }, flags: [shot_the_fire_cub] }
      failure:
        text: |
          นัดแรกทะลุไปเหมือนที่นักล่าหนุ่มเล่า นัดที่สองไม่ทันได้ยิง ลูกเสือไฟวิ่งเข้าใส่ด้วยท่าทางของลูกหมาที่อยากเล่น กระโดดขึ้นเกาะไหล่{name} ผมด้านซ้ายไหม้ไปทั้งแถบ คอเสื้อลุก

          {name}ทิ้งตัวลงรางน้ำหน้าบ้านคนอบขนมปัง น้ำในรางดับทั้งไฟบนเสื้อและขนไฟของลูกเสือที่เกาะอยู่ ลูกเสือร้องแหลม วิ่งกลับเข้าปากเตา แล้วไม่ออกมาอีก ผู้ใหญ่บ้านจ่ายค่าเสียเวลาสามเหรียญ
        effects: { hp: -3, gold: 3, taboo: { fire: learn }, flags: [fire_cub_burn] }
    - id: send_for_naila
      label: ส่งคนไปตามไนลา ให้นางทำ ตัวเองนั่งบอกอยู่ข้างเตา
      requires: { flag: taught_naila }
      text: |
        ไนลามาถึงตอนบ่าย ปืนของนางยาวกว่าของ{name}หนึ่งคืบ ผมตัดสั้นติดหนังหัวแบบคนที่ไม่มีเวลาหวี นางฟังเรื่องลูกเสือไฟจนจบโดยไม่แตะปืน แล้วถามคำเดียวว่าน้ำต้องตักออกให้แห้งแค่ไหน

        {name}นั่งบนม้านั่งของคนอบขนมปัง ยืดขาทั้งสองข้างออกไปข้างหน้า บอกทีละขั้น ไนลาตักน้ำ ก่อไฟ แล้วนั่งรอหน้าปากเตาแทน ใกล้สางลูกเสือไฟกลับเข้าเตาไปเอง ไนลาแบ่งค่าหัวให้{name}ครึ่งหนึ่ง หกเหรียญ บอกว่าเป็นค่าเข่า
      effects: { gold: 6, taboo: { fire: learn }, flags: [naila_calmed_the_cub] }
    - id: find_the_borrowed_fire
      label: ถามหาก่อนว่าใครยืมไฟจากเตานี้ไปแล้วไม่คืน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}เดินถามทีละบ้าน ไม่ถามเรื่องสัตว์ ถามว่าคืนที่ทะเลาะกันใครออกจากบ้านไปไหน ได้ความว่าเมียคนอบขนมปังหอบลูกไปนอนบ้านแม่ที่ท้ายหมู่บ้าน คืนนั้นนางตักถ่านแดงจากเตากลางหมู่บ้านใส่หม้อดินติดมือไปด้วยหม้อหนึ่ง แล้วไม่ได้เอามาคืน

          {name}พานางถือหม้อถ่านเดินกลับมาเทลงปากเตาก่อนไก่ขัน คนอบขนมปังยืนอยู่ข้างเตา ไม่มีใครเอ่ยเรื่องถังน้ำ ลูกเสือไฟออกมานอนบนถ่านหม้อนั้นครู่หนึ่ง แล้วมุดเข้าเตาไปไม่ออกมาอีก ผู้ใหญ่บ้านจ่ายหกเหรียญ
        effects: { stats: { CHA: 1 }, gold: 6, taboo: { fire: keep }, flags: [returned_the_borrowed_fire] }
      failure:
        text: |
          เมียคนอบขนมปังยอมรับว่าเอาถ่านไป แต่ไม่ยอมเอาคืน นางบอกว่าเตานั้นก่อด้วยแรงพ่อของนาง ไม่ใช่แรงผัว สองผัวเมียเถียงกันอยู่หน้าบ้านจนเลยรุ่ง คืนนั้นลูกเสือไฟออกมาเล่นในยุ้งอีกรอบ ยุ้งที่เหลือครึ่งหลังไหม้หมด

          ผู้ใหญ่บ้านไม่จ่ายสักเหรียญ {name}เดินกลับโรงเตี๊ยมครึ่งวันด้วยเข่าที่บวมทั้งสองข้าง
        effects: { hp: -1, taboo: { fire: learn }, flags: [cub_village_unpaid] }

- id: adult.career_bounty_guarantor
  stage: adult
  scene: tavern
  weight: 45
  when:
    age: [49, 56]
    flags: [job_bounty_hunter]
  text: |
    เจ้าของโรงเตี๊ยมเรียก{name}เข้าไปคุยในครัว ไม่ใช่ที่โต๊ะ ประกาศค่าหัวหมูป่าแผ่นที่{name}ลงชื่อรับรองให้ลูกช่างเกือกเมื่อเดือนก่อนวางอยู่บนเขียง ธรรมเนียมของกระดานนี้ คนหนุ่มที่ยังไม่มีชื่อรับประกาศราคาเกินสิบเหรียญได้ ถ้ามีคนเก่าลงชื่อไว้ใต้ชื่อเขา และถ้างานพัง คนที่ลงชื่อไว้ข้างใต้เป็นคนจ่าย

    ลูกช่างเกือกยิงหมูตัวนั้นเข้าสะโพกแล้วตามรอยเลือดไม่ทัน หมูบาดเจ็บวิ่งเข้าตลาดนัดของหมู่บ้านบนเนินตอนสาย ล้มแผงไข่ แผงผ้า และขาของหญิงขายไข่หักไปข้างหนึ่ง หมู่บ้านเรียกค่าเสียหายเจ็ดเหรียญ หมูตัวนั้นยังไม่ตาย และหมูที่มีตะกั่วฝังอยู่ในสะโพกไม่กลัวคนอีกแล้ว

    ลูกช่างเกือกนั่งอยู่ที่บันไดหลังครัว แขนพันผ้า หัวเข่าชิดกัน รอฟังว่า{name}จะว่าอย่างไร
  choices:
    - id: pay_and_track
      label: จ่ายค่าเสียหาย แล้วพาเด็กนั่นตามรอยเลือดจนเจอหมู
      check: { stat: WIS, dc: 13, foe: nature }
      success:
        text: |
          {name}จ่ายเจ็ดเหรียญที่บ้านบนเนิน แล้วพาลูกช่างเกือกเดินตามรอยเลือดแห้งไปสี่วัน สอนให้ดูว่าเลือดบนใบหญ้าอยู่สูงจากพื้นแค่ไหน เลือดต่ำแปลว่าแผลที่ขา เลือดเป็นฟองแปลว่าปอด ส่วนเลือดของหมูตัวนี้หยดเป็นจังหวะเดียวกันทุกสามก้าว แปลว่ามันยังเดินสบาย

          เย็นวันที่สี่หมูตัวนั้นนอนแช่โคลนอยู่ในร่องห้วย ลูกช่างเกือกยิงนัดเดียวเข้าหลังหู {name}ไม่ต้องแตะปืน ค่าหัวเก้าเหรียญเป็นของเด็กทั้งหมด
        effects: { stats: { WIS: 1 }, gold: -7, flags: [tracked_with_the_cobblers_boy] }
      failure:
        text: |
          วันที่สามหมูตัวนั้นวนกลับมาตามรอยของคนที่ตามมัน อย่างที่หมูเจ็บทุกตัวทำ {name}รู้เรื่องนี้ดีกว่าใคร แต่รู้ช้าไปหนึ่งก้าว เขี้ยวข้างซ้ายเกี่ยวเข้าต้นขาของ{name}ก่อนลูกช่างเกือกจะยิงหมูล้มจากระยะห้าก้าว

          {name}เดินกะเผลกไปทั้งหน้าหนาว ค่าเสียหายเจ็ดเหรียญยังต้องจ่ายเต็ม ลูกช่างเกือกเอาเขี้ยวหมูตัวนั้นมาวางไว้บนโต๊ะของ{name}ทุกเช้า จนเจ้าของโรงเตี๊ยมบอกให้เก็บ
        effects: { hp: -3, gold: -7, flags: [tracked_with_the_cobblers_boy] }
    - id: strike_the_name
      label: เอาถ่านขีดชื่อตัวเองออกจากใต้ชื่อเด็ก ไม่จ่าย
      text: |
        {name}หยิบถ่านจากเตามาขีดชื่อตัวเองที่ท้ายประกาศสองเส้น เจ้าของโรงเตี๊ยมไม่ห้าม ธรรมเนียมของกระดานยอมให้ทำได้ครั้งเดียวในชีวิต และทุกคนในโรงเตี๊ยมจะรู้ภายในคืนนั้น

        ลูกช่างเกือกจ่ายค่าเสียหายเองด้วยเงินที่ยืมพ่อ ฤดูต่อมาเขากลับไปตอกเกือกม้าที่ร้านพ่อ ประกาศที่มีชื่อ{name}อยู่หัวกระดาษยังติดอยู่บนกระดานเหมือนเดิม แต่ไม่มีคนหนุ่มคนไหนมาขอให้{name}ลงชื่อใต้ชื่อตัวเองอีก
      effects: { alignment: { moral: -1 }, flags: [struck_the_guarantee] }
    - id: finish_it_alone
      label: ให้เด็กนั่นอยู่โรงเตี๊ยม แล้วไปจบหมูตัวนั้นเอง
      check: { stat: DEX, dc: 14, foe: nature }
      success:
        text: |
          {name}ไม่ตามรอยเลือด แต่ไปนั่งรอที่แอ่งโคลนริมห้วยแห่งเดียวในละแวกนั้นที่น้ำยังไม่แห้ง หมูเจ็บต้องมาแช่แผล วันที่สองหมูมาจริง เดินกะเผลก ขาหลังซ้ายลากเป็นร่อง นัดเดียวเข้าหลังหู

          ค่าหัวเก้าเหรียญ หักค่าเสียหายเจ็ดเหรียญที่บ้านบนเนิน เหลือสองเหรียญ ลูกช่างเกือกขอซื้อเขี้ยวหมูตัวนั้นไปแขวนคอ {name}ให้ไปเปล่าๆ
        effects: { gold: 2, flags: [finished_the_boys_boar] }
      failure:
        text: |
          {name}รอที่แอ่งโคลนสามวัน หมูไม่มา วันที่สี่ชาวบ้านบนเนินเจอหมูตายอยู่ในคอกแพะของตัวเอง แผลที่สะโพกเน่าจนหนอนขึ้น ชาวบ้านไม่จ่ายค่าหัวให้ซากที่ตายเอง

          ค่าเสียหายเจ็ดเหรียญยังต้องจ่าย และหลังของ{name}ปวดไปทั้งเดือนจากการนั่งบนหินเปียกสามคืน
        effects: { hp: -1, gold: -7, flags: [boar_died_unpaid] }
    - id: teach_the_pit
      label: พาเด็กไปขุดหลุมดัก แบบที่เคยขุดดักหมาเถ้าข้างราง
      habit: hunter_eye
      requires: { flag: hound_pit_trap }
      text: |
        หมูป่าวิ่งตรงได้อย่างเดียว เลี้ยวไม่เป็น {name}จ่ายค่าเสียหายเจ็ดเหรียญ แล้วพาลูกช่างเกือกไปขุดหลุมลึกเท่าอกที่ปลายทางด่านหมูริมไร่มัน ปักไม้แหลมไว้ก้นหลุม ปิดปากหลุมด้วยกิ่งไม้กับใบไม้แห้ง แล้วให้เด็กยืนโบกผ้าแดงอยู่หลังหลุม

        หมูตัวนั้นเห็นผ้าแดงก็วิ่งตรงมาอย่างที่หมูทุกตัวทำ ลูกช่างเกือกยืนนิ่ง ไม่ถอยแม้ครึ่งก้าว ค่าหัวเก้าเหรียญเด็กแบ่งให้{name}สามเหรียญ แล้วขอสมุดที่{name}จดวิธีขุดหลุมไปลอก
      effects: { stats: { INT: 1 }, gold: -4, flags: [taught_the_boar_pit] }

- id: adult.career_bounty_last_board
  stage: adult
  scene: tavern
  weight: 45
  mark: แขวนปืนล่าค่าหัว
  when:
    age: [57, 64]
    flags: [job_bounty_hunter]
  text: |
    เจ้าของโรงเตี๊ยมคนใหม่เป็นหลานของคนเก่า เขาเปลี่ยนกระดานประกาศเป็นแผ่นไม้ใหม่ ทาน้ำมัน ตอกหมุดทองเหลือง แต่ยังเว้นช่องหนึ่งไว้ที่หัวกระดานแบบเดิม ช่องสำหรับประกาศที่คนจ้างเขียนชื่อคนล่ามาเอง ฤดูนี้ช่องนั้นมีประกาศแผ่นเดียว ชื่อ{name}อยู่บนสุด

    งานไม่ยาก หมาจิ้งจอกบ้าตัวหนึ่งกัดแพะในหมู่บ้านทางเหนือสามวันเดิน คนจ้างเป็นหญิงแก่ที่จำได้ว่าเมื่อหลายสิบปีก่อน{name}เคยยิงหมาบ้าให้แม่ของนาง แต่ทุกวันนี้ตาของ{name}เห็นเป้าที่ร้อยก้าวเป็นก้อนเบลอสองก้อน และนิ้วชี้ขวาเหยียดไม่สุดมาตั้งแต่หน้าหนาวก่อน

    คนล่ารุ่นใหม่สามคนนั่งอยู่โต๊ะข้างเตาผิง รอดูว่า{name}จะดึงประกาศแผ่นนั้นลงหรือไม่
  choices:
    - id: take_the_last_notice
      label: ดึงประกาศลง ไปล่าแผ่นสุดท้ายด้วยตัวเอง
      check: { stat: WIS, dc: 14, foe: nature }
      effects: { flags: [retired, took_the_last_notice] }
      success:
        text: |
          {name}ไม่ล่าด้วยตา ล่าด้วยเวลา หมาบ้าเดินวนทางเดิมทุกค่ำ เลียบรั้วคอกแพะจากตะวันออกไปตะวันตก {name}นั่งรอบนลังไม้หลังคอกที่สาม ปลายทางวนของมัน ปล่อยให้มันเดินเข้ามาจนเห็นฟองน้ำลายที่มุมปาก แล้วยิงจากระยะสิบก้าว

          กลับถึงโรงเตี๊ยม {name}ติดประกาศแผ่นนั้นคืนบนกระดาน เขียนคำว่าจบไว้มุมล่าง แล้วแขวนปืนไว้บนตะปูเหนือเตาผิง หญิงแก่คนนั้นส่งเงินมาแปดเหรียญ กับแพะอีกหนึ่งตัวที่ไม่มีใครรู้ว่าจะเอาไปเลี้ยงที่ไหน
        effects: { stats: { WIS: 1 }, gold: 8 }
      failure:
        text: |
          นัดแรกเข้าเสารั้ว หมาบ้าวิ่งตรงเข้าหา {name}ฟาดพานท้ายปืนจนมันล้ม แต่ฟันของมันข่วนหลังมือซ้ายไปหนึ่งแผล หมอยาในหมู่บ้านเอาเหล็กเผาไฟจี้แผลตรงนั้นเลย บนลังไม้หลังคอก

          {name}ไม่บ้า แผลหายแล้วเหลือรอยด่างเท่าเหรียญ กลับถึงโรงเตี๊ยม{name}แขวนปืนไว้บนตะปูเหนือเตาผิง ค่าหัวได้ห้าเหรียญ
        effects: { hp: -3, gold: 5 }
    - id: corner_table
      label: ยกประกาศให้คนหนุ่ม แล้วไปนั่งโต๊ะมุมสอนอ่านรอย
      text: |
        {name}ดึงประกาศแผ่นนั้นลง เดินไปวางบนโต๊ะข้างเตาผิง ให้คนล่ารุ่นใหม่สามคนจับไม้สั้นไม้ยาวกันเอง แล้วสั่งเหล้าร้อนหนึ่งกา นั่งลงที่โต๊ะมุมใกล้กระดาน ปืนพิงผนังอยู่ข้างเก้าอี้

        ตั้งแต่หน้าหนาวนั้น ใครจะรับประกาศราคาเกินสิบเหรียญ เจ้าของโรงเตี๊ยมให้มานั่งโต๊ะมุมก่อน {name}ให้วาดรอยเท้าสัตว์ที่จะล่าลงบนโต๊ะด้วยนิ้วจุ่มเหล้า วาดผิดก็ลบแล้ววาดใหม่ ไม้หน้าโต๊ะมีคราบเหล้าเป็นวงซ้อนกันจนดำ
      effects: { alignment: { moral: 1 }, flags: [retired, teaches_at_the_corner_table] }
    - id: hunt_from_a_stool
      label: เก็บประกาศไว้ ขอรับแต่งานที่นั่งรอได้ ไม่ต้องวิ่ง
      text: |
        {name}พับประกาศใส่กระเป๋าเสื้อ แล้วบอกเจ้าของโรงเตี๊ยมว่าตั้งแต่นี้ไปจะรับแต่งานที่สัตว์เดินเข้ามาหาเอง งานที่ต้องนั่งรอในซุ้มบังตัวทั้งคืน ไม่ต้องไล่ ไม่ต้องปีน

        {name}สั่งช่างไม้ทำเก้าอี้พับขาสั้นตัวหนึ่ง ที่นั่งบุหนังแพะ ฤดูนั้นรับประกาศสามแผ่น จบทั้งสามแผ่นจากเก้าอี้ตัวเดียวกัน คนล่ารุ่นใหม่เรียกเก้าอี้ตัวนั้นว่าเก้าอี้ค่าหัว
      effects: { gold: 6, flags: [still_working, hunts_from_the_stool] }
    - id: give_naila_the_top
      label: ขีดชื่อตัวเองออก เขียนชื่อไนลาลงไปแทน
      requires: { flag: taught_naila }
      text: |
        {name}เอาถ่านขีดชื่อตัวเองบนประกาศออก เขียนชื่อไนลาลงไปแทน แล้วฝากเจ้าของโรงเตี๊ยมส่งข่าวไปบอกหญิงแก่ทางเหนือว่าคนที่ไปแทนคือคนที่{name}สอนเอง

        ไนลากลับมาในเจ็ดวัน ไม่เล่าว่าล่าอย่างไร วางหางหมาจิ้งจอกไว้บนโต๊ะ แล้วไปยืนดูช่องหัวกระดาน ตั้งแต่ฤดูนั้นประกาศในช่องนั้นมีชื่อไนลาบ่อยกว่าชื่อใคร ปืนของ{name}แขวนอยู่บนตะปูเหนือเตาผิง
      effects: { alignment: { moral: 1 }, flags: [retired, gave_naila_the_top_slot] }

# ---------- คนนำทาง ----------
- id: adult.career_guide_salt_party
  stage: adult
  scene: road
  weight: 45
  when:
    age: [41, 48]
    flags: [job_guide]
  text: |
    ล่อตัวหนึ่งเดินลงจากช่องเขามาถึงหมู่บ้านตีนเขาตอนเที่ยง กระดิ่งที่คอยังดัง บนหลังยังมีกระสอบเกลือสองกระสอบ ไม่มีคนจูง {name}จำเสียงกระดิ่งได้ เป็นของขบวนคนขนเกลือเจ็ดคนที่ออกจากหมู่บ้านไปเมื่อสามวันก่อน ไม่ได้จ้าง{name} แต่จ้างคนนำทางหนุ่มคนหนึ่งที่บอกว่ารู้ทางใหม่ ข้ามสันเขาตรงๆ ประหยัดได้สองวัน

    คนนำทางหนุ่มลงมาถึงตอนบ่าย แขนขวาหัก ปากแตก เล่าว่าทางใหม่ไปจบที่ลานหินเลื่อน หมอกลงหนาจนมองไม่เห็นมือตัวเอง เขาลงมาหาทาง ส่วนเจ็ดคนนั้นนั่งรออยู่บนลานหิน ไม่มีใครในหมู่บ้านรู้ว่าลานไหน ทุกคนหันมาทาง{name}

    {name}รู้ ลานหินเลื่อนบนสันนั้นมีลานเดียว แต่เข่าซ้ายบวมมาตั้งแต่ต้นฤดู ขาขึ้นยังไหว ส่วนขาลงทั้งคืนในหมอก{name}ไม่แน่ใจ
  choices:
    - id: go_up_now
      label: พันเข่าให้แน่น แล้วขึ้นไปรับเองคืนนี้
      check: { stat: CON, dc: 14 }
      success:
        text: |
          {name}ขึ้นทางเก่าที่อ้อมสันไปทางตะวันออก ทางที่ยาวกว่าแต่ไม่มีหินเลื่อน ถึงลานหินตอนเที่ยงคืน เรียกชื่อคนขนเกลือทีละคนตามที่คนนำทางหนุ่มบอกไว้ ได้ยินเสียงตอบเจ็ดเสียง

          ขาลง{name}ผูกเชือกเส้นเดียวเอวต่อเอวทั้งแปดคน เดินนำอยู่หัวเชือก นับก้าวออกเสียงทุกก้าวให้คนท้ายเชือกได้ยิน ถึงหมู่บ้านตอนสาง เข่าซ้ายบวมจนสวมกางเกงไม่เข้าไปสามวัน ขบวนเกลือจ่ายค่าทางห้าเหรียญ
        effects: { stats: { CON: 1 }, gold: 5, flags: [fetched_the_salt_party] }
      failure:
        text: |
          ครึ่งทางขาลง เข่าซ้ายพับลงบนหินเปียก {name}ไถลลงไปสามช่วงตัว เชือกที่ผูกเอวไว้กับคนข้างหลังรั้งไว้ทัน คนขนเกลือสองคนตัดไม้มัดเป็นแคร่ แล้วหาม{name}ลงไปจนถึงหมู่บ้าน

          ทั้งเจ็ดคนลงมาถึงครบ ลงมาตามเสียงบอกทางของคนที่นอนอยู่บนแคร่ ขบวนเกลือจ่ายค่าทางสองเหรียญ แล้วขอเชือกคืน
        effects: { hp: -3, gold: 2, flags: [fetched_the_salt_party, guide_knee_gave_way] }
    - id: fire_line
      label: ไม่ขึ้น ให้คนในหมู่บ้านจุดไฟเป็นแถวตามทางเก่า
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          คนติดหมอกบนสันจะเห็นไฟก่อนได้ยินเสียง {name}ให้เด็กในหมู่บ้านแบกฟืนขึ้นไปจุดกองไฟทุกสองร้อยก้าวตามทางเก่า กองสุดท้ายอยู่สูงที่สุดเท่าที่เด็กกล้าขึ้นไป แล้ว{name}นั่งตีเกราะไม้อยู่ที่กองล่างสุด ตีสามครั้งทุกครั้งที่นับได้ร้อย

          ใกล้สาง กองไฟกองบนสุดกะพริบ มีคนเดินผ่านหน้า แล้วอีกคน ทั้งเจ็ดคนลงมาตามแถวไฟทีละกอง ถึงหมู่บ้านตอนตะวันขึ้น คนขนเกลือที่แก่ที่สุดบอกว่าเห็นไฟกองแรกก็รู้ว่าข้างล่างมีคนที่รู้ทาง
        effects: { stats: { WIS: 1 }, gold: 3, flags: [lit_the_fire_line] }
      failure:
        text: |
          หมอกหนาเกินกว่าไฟจะทะลุ คนบนสันไม่เห็นกองไฟสักกอง คนขนเกลือคนหนึ่งทนรอไม่ไหว ลงมาเองในความมืด ตกหินขาหัก อีกหกคนรอจนหมอกยกตอนสาย แล้วเดินลงมาตามแถวควันจากกองไฟที่มอดไปแล้ว

          {name}จ่ายค่าหมอดามขาให้คนขนเกลือคนนั้นสามเหรียญ เพราะไม่มีใครอื่นจะจ่าย
        effects: { gold: -3, flags: [lit_the_fire_line] }
    - id: send_abel_up
      label: ส่งอาเบลขึ้นไปแทน ตัวเองนั่งรออยู่ตีนทาง
      requires: { flag: taught_abel }
      text: |
        อาเบลไม่ใช่เด็กสิบหกที่แบกของแล้ว มีลูกค้าของตัวเอง มีล่อสองตัว และรู้จักลานหินเลื่อนบนสันนั้นตั้งแต่สมัยเดินตามหลัง{name} {name}บอกเขาแค่สองอย่าง ขึ้นทางอ้อมตะวันออก และนับก้าวออกเสียงตอนลง

        {name}นั่งบนก้อนหินตีนทางทั้งคืน คนนำทางหนุ่มแขนหักนั่งอยู่ข้างๆ ไม่ยอมไปหาหมอ ตอนสาง เสียงนับก้าวของอาเบลลงมาก่อนตัว เลขสามร้อยกว่า แล้วทั้งเจ็ดคนก็โผล่ออกมาจากหมอกทีละคน คนนำทางหนุ่มลุกขึ้นถามอาเบลว่านับก้าวไปทำไม
      effects: { alignment: { moral: 1 }, flags: [abel_fetched_the_salt_party] }

- id: adult.career_guide_iron_posts
  stage: adult
  scene: road
  weight: 45
  when:
    age: [49, 56]
    flags: [job_guide]
  text: |
    นายช่างสำรวจของราชสำนักมาพร้อมเกวียนสองเล่ม บรรทุกเสาเหล็กยาวเท่าคน ปลายเสามีขอแขวนตะเกียง ราชสำนักกับบริษัทเกลือที่กู้เงินวิหารเบเลคมาตั้งตัว จะปักเสาแบบนี้ทุกห้าร้อยก้าวตามทุกทางข้ามเขาในถิ่นนี้ ปักเสร็จเมื่อไร ใครก็เดินข้ามได้โดยไม่ต้องจ้างคนนำทาง

    นายช่างจ้าง{name}ให้เดินนำ ชี้ทุกทางที่รู้ ตลอดฤดูร้อน แล้วเปิดสมุดให้ดูรายชื่อคนที่ตายบนช่องเขาในถิ่นนี้ในสิบปีที่ผ่านมา สามสิบเอ็ดชื่อ {name}รู้จักเกินครึ่ง

    ทางที่{name}รู้มีบางทางที่ไม่ควรมีเสา ทางขึ้นหุบที่คนบางพวกหนีไปซ่อนตัว ทางไปเนินที่คนสวมแหวนเหล็กดำชอบไปวางกองหิน และในหมู่บ้านตีนเขายังมีคนนำทางหนุ่มอีกเป็นสิบคนที่ไม่มีงานอื่นทำ
  choices:
    - id: mark_every_pass
      label: เดินนำ ปักเสาให้ทุกทางที่รู้
      text: |
        {name}เดินนำนายช่างทั้งฤดูร้อน ชี้ทุกทาง ทุกทางลัด ทุกน้ำซับ เสาเหล็กปักลงทุกห้าร้อยก้าว ไปจนถึงปากหุบที่ไม่มีบนแผนที่และเนินที่มีกองหิน นายช่างจดทุกอย่างลงสมุด

        หน้าหนาวปีนั้นไม่มีใครตายบนช่องเขาในถิ่นนี้ ตะเกียงบนเสาสว่างเป็นแถวทุกคืน มองจากหมู่บ้านเหมือนมีคนเอาด้ายเรืองแสงขึงข้ามเขา คนนำทางหนุ่มครึ่งหนึ่งไปรับจ้างเติมน้ำมันตะเกียงให้ราชสำนัก อีกครึ่งย้ายไปเมือง หุบทางเหนือไม่มีควันไฟลอยขึ้นมาอีกตั้งแต่เดือนที่เสาต้นแรกปักถึงปากหุบ
      effects: { gold: 8, reputation: { crown: 1 }, alignment: { law: 1 }, flags: [marked_every_pass] }
    - id: hide_the_valley
      label: ปักเสาให้ แต่พาเดินให้หุบนั้นตกแผนที่
      requires: { flag: warned_hidden_village }
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}พานายช่างขึ้นช่องเขาจากด้านที่ปากหุบซ่อนอยู่หลังไหล่หิน แล้วจัดให้ไปถึงตรงนั้นตอนหมอกบ่ายลงทุกครั้ง นายช่างจดว่าแถบนั้นเป็นหน้าผา ไม่มีทางลง {name}ไม่แก้

          เสาเหล็กปักเรียงผ่านไปห่างปากหุบสองร้อยก้าว ปีต่อมาหญิงมีเขาที่เป็นผู้ใหญ่บ้านในหุบนั้นส่งผ้าขนแพะมาให้{name}ผืนหนึ่ง ไม่มีจดหมาย มีแต่ปมเชือกผูกไว้ที่มุมผ้าสามปม
        effects: { stats: { INT: 1 }, gold: 6, alignment: { moral: 1 }, flags: [kept_the_valley_off_the_posts] }
      failure:
        text: |
          ผู้ช่วยของนายช่างเป็นเด็กหนุ่มตาไว เช้าวันที่สามเด็กคนนั้นเห็นควันไฟบางๆ ลอยขึ้นจากหลังสันหิน แล้วชี้ให้นายช่างดู นายช่างจดลงสมุดว่าหุบมีคนอยู่ ไม่ถาม{name}สักคำ แต่ตัดค่าจ้างเดือนสุดท้ายไปครึ่งหนึ่ง

          ก่อนสิ้นปี เสาเหล็กต้นหนึ่งปักลงที่ปากหุบ ตะเกียงบนเสาส่องลงไปในหุบทุกคืน
        effects: { gold: 3, flags: [valley_found_by_surveyor] }
    - id: refuse_the_posts
      label: ไม่รับงาน บอกนายช่างว่าทางบนเขาไม่ได้อยู่นิ่งให้ปักเสา
      text: |
        {name}บอกนายช่างว่าหินบนช่องเขาเลื่อนทุกหน้าฝน ทางที่ปลอดภัยปีนี้ ปีหน้าอาจไปจบที่หน้าผา เสาเหล็กไม่รู้เรื่องนี้ คนนำทางรู้ นายช่างจดคำพูดนั้นลงสมุดอย่างสุภาพ แล้วจ้างคนนำทางอีกคนในวันเดียวกัน

        เสาปักครบทุกทางก่อนหน้าหนาว ปีที่สามหลังจากนั้น หินบนช่องเขาที่สองเลื่อนทับเสาไปสี่ต้น คนเดินทางสองคนเดินตามแถวตะเกียงต่อไปในทิศที่เสาเคยชี้ {name}เป็นคนขึ้นไปพาลงมา
      effects: { alignment: { law: -1 }, flags: [refused_the_pass_posts] }
    - id: train_guides_instead
      label: เอาสมุดรายชื่อคนตายมานับให้นายช่างดู แล้วขอให้ราชสำนักจ่ายค่าฝึกคนนำทางแทน
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}กางสมุดรายชื่อคนตายบนโต๊ะในโรงเตี๊ยม นับให้นายช่างดูทีละชื่อ ยี่สิบสองชื่อตายตอนเดินเองโดยไม่มีคนนำทาง เก้าชื่อตายกับคนนำทางที่อายุไม่ถึงยี่สิบ ไม่มีสักชื่อที่ตายกับคนนำทางที่เดินทางนั้นมาเกินสิบปี

          นายช่างส่งตัวเลขนั้นกลับไปเมืองหลวง ฤดูต่อมาราชสำนักปักเสาแค่ทางหลักสองทาง แล้วจ่ายค่าเลี้ยงคนนำทางฝึกหัดหกคนให้{name}สอน คนละสองเหรียญต่อเดือน
        effects: { stats: { CHA: 1 }, gold: 4, flags: [trained_the_pass_guides] }
      failure:
        text: |
          นายช่างฟังจนจบ แล้วบอกว่าคนนำทางแก่แล้วก็ตาย เสาเหล็กไม่ตาย เขาจ้างคนนำทางอีกคนในวันเดียวกัน เสาปักครบทุกทางก่อนหน้าหนาว รวมทั้งทางที่{name}ไม่เคยบอกใคร

          คนนำทางคนนั้นเคยแบกของให้{name}อยู่สองฤดูเมื่อหลายปีก่อน
        effects: { reputation: { crown: -1 }, flags: [posts_planted_past_you] }

- id: adult.career_guide_staff_wall
  stage: adult
  scene: tavern
  weight: 45
  mark: แขวนไม้เท้านำทาง
  when:
    age: [57, 64]
    flags: [job_guide]
  text: |
    โรงเตี๊ยมตีนเขามีผนังด้านหนึ่งที่ไม่มีใครแขวนอะไรนอกจากไม้เท้า คนนำทางที่เลิกเดินจะเอาไม้เท้าของตัวเองมาตอกตะปูแขวนไว้ ไม้เท้าอันเก่าที่สุดดำจนดูไม่ออกว่าเป็นไม้อะไร ไม้เท้าของ{name}ด้ามสึกเป็นร่องตรงที่นิ้วโป้งกดมาหลายสิบปี

    ปีนี้{name}พาคนข้ามช่องเขาได้แค่สองเที่ยว ทั้งสองเที่ยวต้องค้างคืนเพิ่มหนึ่งคืนเพราะเข่า ทั้งชีวิต{name}พาคนไปแตะเสาฟ้ามานับไม่ถ้วน แต่ไม่เคยแตะเองสักครั้ง คนนำทางถิ่นนี้ถือกันว่าคนนำทางต้องยืนรอห่างจากเสาสิบก้าว เพราะคนที่แตะแล้วมักไม่อยากเดินกลับ

    ขบวนสุดท้ายของหน้าร้อนมาถามหาคนนำทางข้ามช่องเขาที่สองก่อนหิมะแรก
  choices:
    - id: lead_the_last_crossing
      label: รับขบวนสุดท้าย แล้วค่อยแขวนไม้เท้า
      check: { stat: CON, dc: 14 }
      effects: { flags: [retired, led_the_last_crossing] }
      success:
        text: |
          {name}นำขบวนข้ามช่องเขาที่สองช้ากว่าที่เคยนำมาทั้งชีวิต หยุดพักทุกสองชั่วยาม ให้ลูกค้าคิดว่าพักเพื่อพวกเขา หิมะแรกลงตอนขบวนลงถึงหุบอีกฝั่งพอดี เช้าวันนั้นทุกคนหันกลับไปดูช่องเขาที่เพิ่งข้ามมา ขาวทั้งช่อง

          ขากลับ{name}ไม่ข้ามเขา นั่งเกวียนอ้อมทางที่ราบสิบวัน แล้วตอกตะปูแขวนไม้เท้าบนผนังโรงเตี๊ยม ตรงช่องว่างช่องสุดท้ายที่ระดับหัวคน
        effects: { stats: { CON: 1 }, gold: 6 }
      failure:
        text: |
          ลงจากช่องเขาได้ครึ่งทาง หิมะแรกมาก่อนกำหนดสามวัน {name}ต้องพาขบวนกลับขึ้นไปหลบในถ้ำหินแห่งเดียวบนทางนั้น นอนอยู่สี่คืน นิ้วเท้าซ้ายสองนิ้วดำแล้วไม่กลับมาแดงอีก

          ขบวนลงถึงหุบอีกฝั่งครบทุกคน ลูกค้าจ่ายเงินครบ แต่{name}ไม่ได้เดินกลับเอง คนขับเกวียนขนฟางพากลับมาส่งถึงโรงเตี๊ยม พร้อมไม้เท้าที่วางพาดอยู่บนกองฟาง
        effects: { hp: -3, gold: 6 }
    - id: hang_it_today
      label: ยกขบวนนั้นให้คนนำทางหนุ่ม แล้วแขวนไม้เท้าวันนี้
      text: |
        {name}ชี้ตัวคนนำทางหนุ่มที่ดีที่สุดในโรงเตี๊ยมให้ขบวนนั้น บอกเขาสามเรื่องเกี่ยวกับช่องเขาที่สอง เรื่องที่สามเป็นเรื่องที่{name}ไม่เคยบอกใคร คือตรงไหนที่หมอกบ่ายลงเร็วกว่าที่อื่น แล้วขอค้อนจากเจ้าของโรงเตี๊ยม

        ไม้เท้าของ{name}แขวนอยู่ระดับเดียวกับหัวคน ใครเดินเข้าประตูมาจะเห็นร่องนิ้วโป้งก่อนอย่างอื่น คนนำทางหนุ่มบางคนเอานิ้วโป้งของตัวเองไปวางในร่องนั้นก่อนออกเดิน
      effects: { alignment: { moral: 1 }, flags: [retired, hung_the_guide_staff] }
    - id: touch_the_pillar
      label: ให้อาเบลนำไปแตะเสาฟ้าสักครั้ง
      requires: { flag: taught_abel }
      text: |
        อาเบลมีลูกมือของตัวเองสองคนแล้ว ไม่ถามว่าทำไม จัดขบวนให้เหมือนขบวนที่พาสองผัวเมียชาวนาไปเมื่อหลายปีก่อน เดินสิบห้าวัน ให้{name}เดินกลางขบวน ห้ามแบกของ

        ที่โคนเสา หินสีกระดูกเย็นอย่างที่ทุกคนเล่า {name}วางมือลงแล้วไม่ยกออก จนอาเบลต้องล้ำเข้ามาในระยะสิบก้าวเพื่อแตะไหล่ ขากลับ{name}เดินตามหลังอาเบลทั้งทาง นับก้าวในใจ พอถึงโรงเตี๊ยมก็แขวนไม้เท้าโดยไม่ต้องมีใครบอก
      effects: { stats: { WIS: 1 }, flags: [retired, touched_the_sky_pillar] }
    - id: half_day_routes
      label: ไม่แขวน รับแต่ทางที่ไปเช้ากลับเย็น
      text: |
        {name}ตัดเชือกพันด้ามไม้เท้าเส้นเก่าทิ้ง พันใหม่ด้วยหนังแพะ แล้วบอกเจ้าของโรงเตี๊ยมว่าตั้งแต่นี้ไปรับแต่ทางที่ไปเช้ากลับเย็น พาพ่อค้าไปน้ำซับ พาเด็กเลี้ยงแพะไปหาแพะหลง พาคนต่างถิ่นไปดูลานหินที่ใครๆ ก็อยากดูแต่ไม่มีใครอยากค้าง

        ค่าจ้างวันละครึ่งเหรียญ ถึงหน้าหนาว{name}ได้มาสามเหรียญ กับชื่อที่เด็กในหมู่บ้านตั้งให้ว่าคนนำทางครึ่งวัน
      effects: { gold: 3, flags: [still_working, guides_half_day_routes] }

# ---------- คนสำรวจ ----------
- id: adult.career_scout_joined_ground
  stage: adult
  weight: 45
  when:
    age: [41, 48]
    flags: [job_scout]
  text: |
    แผนที่สองแผ่นวางซ้อนกันบนฝาหีบในห้องเก็บแผนที่ของบริษัทเหมือง แผ่นล่างเป็นของ{name} วาดเมื่อเกือบยี่สิบปีก่อน พื้นอุ่นสามช่วงแยกกันห่างเป็นวันเดิน แผ่นบนเป็นของคนสำรวจหนุ่มที่บริษัทเพิ่งจ้าง เส้นพื้นอุ่นของเขาลากต่อกันเป็นแนวเดียว โค้งยาวเหมือนรอยเล็บ

    คนสำรวจหนุ่มยืนอยู่ปลายโต๊ะ บอกผู้จัดการว่าแผนที่เก่าวาดพลาด พื้นอุ่นต่อกันมาตั้งแต่ต้น คนวาดคงเดินไม่ครบทาง ผู้จัดการยื่นแว่นขยายให้{name} ถามว่าจริงหรือไม่

    {name}ไม่รับแว่น ถือแผนที่ของตัวเองห่างออกไปจนสุดแขนถึงจะอ่านตัวเลขออก เส้นหมึกบางๆ ที่เคยวาดด้วยมือตัวเองเบลอเป็นขนหนอน
  choices:
    - id: walk_it_again
      label: ออกไปเหยียบพื้นอุ่นทุกช่วงด้วยตัวเองก่อนตอบ
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}เดินแนวพื้นอุ่นทั้งแนวสิบเอ็ดวัน ทุกเช้าก่อนตะวันขึ้นคุกเข่าวางฝ่ามือบนเถ้า ตรงไหนไม่มีน้ำค้าง ตรงนั้นอุ่น ช่วงที่เคยแยกกันตอนนี้ต่อกันจริง แต่เถ้าในช่วงที่ต่อใหม่ยังร่วน ไม่อัดตัวแน่นเหมือนพื้นอุ่นเก่า

          {name}กลับมาเขียนไว้ใต้แผนที่ทั้งสองแผ่นว่าวาดถูกทั้งคู่ แผ่นล่างถูกเมื่อยี่สิบปีก่อน แผ่นบนถูกในปีนี้ คนสำรวจหนุ่มเอาทั้งสองแผ่นไปลอกซ้อนกันไว้ในสมุดของตัวเอง
        effects: { stats: { CON: 1 }, flags: [walked_the_joined_ground] }
      failure:
        text: |
          คืนที่หก หลังของ{name}ไม่ยอมให้ลุกจากพื้นเย็น ต้องนอนอยู่ในกระโจมสองวัน คนสำรวจหนุ่มที่บริษัทส่งมาด้วยเดินแทนช่วงที่เหลือ แล้วกลับมาบอกว่าพื้นอุ่นต่อกันจริง แต่เถ้าช่วงที่ต่อใหม่ยังร่วนอยู่ แปลว่าเพิ่งอุ่น

          ผู้จัดการจดว่าแผนที่ของ{name}ถูกต้องในปีที่วาด แล้วจดต่ออีกบรรทัดว่าหลังของคนสำรวจรุ่นเก่ารับงานไกลเกินห้าวันไม่ได้แล้ว
        effects: { hp: -2, flags: [walked_the_joined_ground] }
    - id: sign_the_young_map
      label: ยอมว่าแผ่นเก่าอาจพลาด ลงชื่อรับรองแผ่นใหม่
      text: |
        {name}ลงชื่อรับรองแผ่นบน ใต้ชื่อคนสำรวจหนุ่ม ผู้จัดการพับแผ่นล่างใส่หีบแผนที่เก่า คนสำรวจหนุ่มขอบคุณด้วยเสียงของคนที่เพิ่งชนะ

        ฤดูต่อมาบริษัทวางรางสายใหม่อ้อมแนวพื้นอุ่นทั้งแนว จ่ายค่ารับรองให้{name}สามเหรียญ แผ่นล่างนอนอยู่ก้นหีบ ใต้แผนที่รางเก่าอีกสามสิบแผ่น
      effects: { gold: 3, flags: [signed_the_young_map] }
    - id: layer_with_star_hall
      label: ส่งทั้งสองแผ่นไปหอนับดาว ขอให้วางซ้อนกับแผ่นร้อยปีก่อน
      requires: { flag: mapped_for_star_hall }
      text: |
        หอนับดาวยังเก็บแผนที่ร้อยปีก่อนแผ่นที่เคยเขียนจดหมายมาบอกว่าตรงกับพื้นอุ่นสามช่วงของ{name} {name}ส่งแผนที่สองแผ่นไปพร้อมจดหมายสั้นๆ ขอให้วางสามแผ่นซ้อนกันบนโต๊ะที่มีไฟส่องจากข้างใต้

        สองเดือนต่อมามีกระดาษบางแผ่นหนึ่งส่งกลับมา ลอกเส้นทั้งสามรุ่นไว้บนแผ่นเดียว หมึกสามสี เส้นของร้อยปีก่อนเป็นจุดเล็กๆ ห่างกัน เส้นของ{name}เป็นสามช่วง เส้นของปีนี้เป็นเส้นเดียว ใต้แผ่นมีลายมือคนหอนับดาวเขียนไว้บรรทัดเดียว ขอให้ส่งแผ่นต่อไปมาเมื่อมี
      effects: { stats: { INT: 1 }, gold: 3, reputation: { star_hall: 1 }, flags: [layered_the_warm_maps] }

- id: adult.career_scout_false_hill
  stage: adult
  weight: 45
  when:
    age: [49, 56]
    flags: [job_scout]
  text: |
    ทุกแผนที่ที่คนสำรวจในคณะส่งออกไป ต้องมีชื่อ{name}ลงกำกับไว้ใต้ชื่อคนวาด ปีนี้คณะมีคนหนุ่มห้าคน คนที่วาดดีที่สุดคือเด็กหนุ่มผอมสูงจากหมู่บ้านริมราง มือนิ่งกว่า{name}ตอนอายุเท่ากัน

    แผนที่แผ่นล่าสุดของเขามีเนินหินเตี้ยๆ เนินหนึ่งกลางที่ราบเถ้า แรเงาครบทุกด้าน ใส่ความสูงไว้ด้วย {name}เคยเดินผ่านที่ราบนั้นมาสามครั้ง ไม่เคยมีเนิน

    {name}ไปดูเอง ตรงที่ควรมีเนิน เถ้าราบเรียบ ไม่มีน้ำค้างตอนเช้า ปลายไม้แหย่ลงไปได้ครึ่งศอกก็กระทบหินก่อ เด็กหนุ่มยืนอยู่ข้างหลัง บอกว่าได้ยินอะไรบางอย่างจากข้างใต้ แล้วไม่อยากให้บริษัทมาเจาะตรงนี้
  choices:
    - id: report_the_false_hill
      label: ลบเนินออก แล้วส่งตำแหน่งไปป้อมผู้เฝ้าผนึก
      text: |
        {name}ลบเนินออกจากแผนที่ด้วยมือตัวเอง วาดที่ราบเถ้ากลับคืน กากบาทสีแดงไว้ตรงกลาง แล้วส่งสำเนาไปป้อมสามกับเกวียนขนถ่านเที่ยวแรก บริษัทได้แผ่นเดียวกันในวันเดียวกัน

        ผู้เฝ้าผนึกสองคนมาถึงก่อนคนเจาะของบริษัทสามวัน ปักธงเหล็กไว้ที่กากบาท ห้ามใครเข้าใกล้ บริษัทเลิกจ้างเด็กหนุ่มคนนั้นในเดือนเดียวกัน ข้อหาวาดแผนที่เท็จ ชื่อ{name}ที่กำกับอยู่ใต้ชื่อเขาบนแผ่นแรกยังอยู่ในหีบของบริษัท ไม่มีใครลบ
      effects: { reputation: { wardens: 1 }, alignment: { law: 1 }, flags: [reported_the_false_hill] }
    - id: sign_the_hill
      label: ลงชื่อกำกับเนินนั้นตามที่วาด
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}ลงชื่อกำกับ แล้วพาเด็กหนุ่มกลับไปที่ราบนั้นอีกรอบ สอนให้แรเงาเนินให้ตรงกับเวลาที่ผู้จัดการจะเปิดดู เงาตอนบ่ายต้องทอดไปทางตะวันออก แล้ววาดหินร่วงไว้ที่ตีนเนินสองสามก้อน เนินจริงไม่มีลูกไหนเกลี้ยง

          บริษัทลากแนวเจาะอ้อมเนินนั้นเหมือนที่อ้อมเนินทุกลูก เด็กหนุ่มไม่ขอบคุณ แต่ทุกแผนที่ที่เขาส่งหลังจากนั้นมีหินร่วงที่ตีนเนินทุกลูก
        effects: { stats: { INT: 1 }, alignment: { law: -1 }, flags: [signed_the_false_hill] }
      failure:
        text: |
          ผู้จัดการคนใหม่ของบริษัทชอบขี่ม้าออกไปดูที่ที่จะเจาะด้วยตาตัวเอง ไปถึงที่ราบนั้นแล้วไม่เจอเนิน กลับมาฉีกแผนที่ต่อหน้าทั้งคณะ แล้วหักค่าจ้างเดือนนั้นของ{name}ทั้งเดือน เพราะชื่ออยู่ใต้แผ่นนั้น เด็กหนุ่มเก็บของออกจากค่ายในคืนเดียวกัน

          ฤดูต่อมาบริษัทเจาะลงตรงกลางที่ราบนั้น
        effects: { gold: -5, world: { demon: 1 }, flags: [false_hill_torn] }
    - id: teach_the_empty_map
      label: เล่าเรื่องหลุมหินก่อหลุมแรกที่ตัวเองเคยลบจากแผนที่
      requires: { flag: hid_sealed_pit }
      text: |
        {name}พาเด็กหนุ่มนั่งลงบนเถ้าตรงนั้น เล่าเรื่องหลุมแรกที่เจอตอนยังอายุน้อยกว่าเขา หลุมที่ไม่เคยอยู่บนแผนที่ฉบับไหน แล้วบอกว่าเนินปลอมเป็นของที่คนขี่ม้ามาดูเองได้ ที่ราบเปล่าไม่มีใครขี่ม้ามาดู ส่วนแนวเจาะ ให้ลากไปผ่านที่อื่นที่น่าเจาะกว่า

        เด็กหนุ่มวาดแผนที่ใหม่ ที่ราบนั้นว่างเปล่าเหมือนเดิม ห่างออกไปครึ่งวันเดินมีชั้นถ่านตื้นๆ ที่บริษัทเจาะได้ง่ายกว่า {name}ลงชื่อกำกับโดยไม่แก้สักเส้น
      effects: { alignment: { moral: 1 }, flags: [taught_the_empty_map] }
    - id: sell_the_false_hill
      label: ลบเนินออก แล้วขายตำแหน่งหินก่อให้บริษัทเอง
      text: |
        {name}ลบเนินออก เขียนตำแหน่งหินก่อใต้เถ้าลงกระดาษแผ่นแยก ขายให้ผู้จัดการบริษัทหกเหรียญ บอกว่าเป็นของที่เด็กหนุ่มซ่อนไว้ ผู้จัดการจ่ายครบ แล้วไล่เด็กหนุ่มออกในวันเดียวกัน

        ฤดูต่อมาหัวเจาะของบริษัทลงตรงกลางที่ราบนั้น {name}ได้ข่าวจากคนขับเกวียนว่าหัวเจาะหัวแรกกลับขึ้นมาร้อนจนไม่มีใครจับได้ไปสามวัน
      effects: { gold: 6, world: { demon: 1 }, alignment: { moral: -1 }, flags: [sold_the_false_hill] }

- id: adult.career_scout_notebooks
  stage: adult
  scene: home
  weight: 45
  mark: วางสมุดแผนที่
  when:
    age: [57, 64]
    flags: [job_scout]
  text: |
    สมุดแผนที่ของ{name}มีสามสิบเจ็ดเล่ม มัดเป็นสามมัดด้วยเชือกป่าน วางอยู่ใต้เตียง ปกหนังของเล่มแรกๆ กรอบจนแตกตามรอยพับ เล่มหลังๆ ลายมือตัวโตขึ้นทุกเล่ม เพราะตาเห็นตัวหนังสือเล็กไม่ชัดแล้ว

    หน้าหนาวนี้{name}ออกเดินสำรวจได้แค่สองวันก็ต้องกลับ ข้อนิ้วมือขวาบวมจนจับปากกาขนนกไม่ได้ทั้งเช้า หอนับดาวขอซื้อสมุดทั้งหมด บริษัทเหมืองก็ส่งคนมาขอซื้อ ให้ราคาสูงกว่าหอนับดาวเท่าตัว คนสำรวจรุ่นหลังที่เคยเดินตาม{name}มาหลายปีมาขอยืมดูบ่อยขึ้นทุกเดือน

    ในสมุดสามสิบเจ็ดเล่มนั้นมีบางหน้าที่{name}ไม่เคยเปิดให้ใครดู
  choices:
    - id: to_the_star_hall
      label: ส่งสมุดทั้งหมดไปหอนับดาวไอเลธ
      text: |
        {name}ห่อสมุดสามสิบเจ็ดเล่มด้วยผ้าน้ำมันสามชั้น ส่งไปไอเลธกับขบวนเกวียนปลายฤดู หอนับดาวจ่ายห้าเหรียญ แนบจดหมายลายมือคนแก่มาด้วย บอกว่าสมุดของ{name}จะวางอยู่บนชั้นเดียวกับแผนที่ร้อยปีก่อน ใครจะดูต้องดูในห้อง ห้ามยืมออก

        ใต้เตียงของ{name}ว่างไปทั้งแถบ ฝุ่นเป็นรอยสี่เหลี่ยมสามรอยตรงที่มัดสมุดเคยวาง
      effects: { gold: 5, reputation: { star_hall: 1 }, flags: [retired, notebooks_to_star_hall] }
    - id: burn_the_room_pages
      label: ฉีกหน้าที่วาดห้องหินใต้ค่ายร้างออกมาเผา แล้วยกที่เหลือให้คนรุ่นหลัง
      requires: { flag: saw_the_breach }
      text: |
        หน้าที่วาดผนังสี่ด้านของห้องหินใต้ค่ายร้างมีหกหน้า อักษรตัวเดียวกันซ้ำเต็มผนังที่{name}ลอกไว้ทีละตัว {name}ฉีกออกทีละหน้าตามรอยเย็บ นั่งเผาในเตาครัวทีละแผ่น รอให้แผ่นหนึ่งไหม้หมดก่อนใส่แผ่นต่อไป

        สมุดที่เหลือ{name}ยกให้คนสำรวจรุ่นหลังที่มาขอยืมบ่อยที่สุด เล่มหนึ่งในนั้นมีรอยฉีกอยู่กลางเล่ม เขาไม่ถาม
      effects: { alignment: { moral: 1 }, flags: [retired, burned_the_room_pages] }
    - id: sell_the_notebooks
      label: ขายให้บริษัทเหมืองตามราคาที่ให้
      text: |
        คนของบริษัทขนสมุดขึ้นเกวียนทั้งสามมัด จ่ายแปดเหรียญเป็นเหรียญเงินทั้งหมด เขาเปิดเล่มแรกดูบนเกวียน หัวเราะกับลายมือของ{name}สมัยหนุ่ม แล้วถามว่าพื้นอุ่นที่วาดไว้ในเล่มนี้ ทุกวันนี้ยังอุ่นอยู่ไหม

        {name}บอกให้ไปเหยียบเอง
      effects: { gold: 8, world: { demon: 1 }, flags: [retired, sold_the_notebooks] }
    - id: one_more_survey
      label: เก็บสมุดไว้ แล้วออกเดินอีกฤดูหนึ่ง
      check: { stat: CON, dc: 14 }
      effects: { flags: [still_working, one_more_survey] }
      success:
        text: |
          {name}พันข้อนิ้วด้วยผ้าชุบน้ำมันงา ใช้ถ่านแท่งแทนปากกาขนนก แล้วออกเดินกับคนสำรวจรุ่นหลังสองคนที่ขอตามมา เดินช้า หยุดบ่อย แต่ทุกจุดที่หยุด{name}เห็นสิ่งที่สองคนนั้นเดินผ่านไปแล้ว เถ้าที่ทรุดลงเป็นแอ่งตื้นๆ น้ำค้างที่หายไปจากหินก้อนเดียวในทั้งลาน

          สมุดเล่มที่สามสิบแปดเต็มในฤดูเดียว ลายมือตัวโตเท่าหัวแม่มือ
        effects: { stats: { WIS: 1 } }
      failure:
        text: |
          วันที่สี่ {name}ล้มลงบนเถ้าตอนลุกจากที่นอน แล้วลุกเองไม่ได้ คนสำรวจรุ่นหลังสองคนผลัดกันแบกกลับค่าย {name}นอนอยู่ในค่ายจนสิ้นฤดู เขียนสมุดเล่มที่สามสิบแปดจากสิ่งที่สองคนนั้นเล่าให้ฟังทุกเย็น
        effects: { hp: -3 }

# ---------- คณะละครเร่ ----------
- id: adult.career_troupe_brass_demon
  stage: adult
  scene: market
  weight: 45
  when:
    age: [41, 48]
    flags: [job_troupe]
  text: |
    คณะจากเวนทราสมาถึงเมืองตลาดก่อนคณะของ{name}สองวัน เกวียนสี่เล่มทาสีน้ำเงิน เวทีมีตะเกียงฟ้าสิบสองดวงที่ไม่ต้องเติมน้ำมัน จอมมารของคณะนั้นเป็นหุ่นทองเหลืองสูงสองช่วงตัว เขาเหล็กหุ้มทองแดง ตาเป็นแก้วสีแดงมีไฟอยู่ข้างใน หุ่นยกแขนได้ หันหัวได้ แต่พูดไม่ได้ บทพูดของจอมมารมาจากชายคนหนึ่งที่นั่งอยู่หลังม่าน

    สองคณะได้ลานคนละฝั่งตลาด เล่นคืนเดียวกัน คืนแรกคนดูฝั่งตะเกียงฟ้าแน่นจนต้องยืนบนหลังคาเกวียน ฝั่งของ{name}มีคนแก่สี่สิบคนกับเด็กที่ไม่มีเงินจ่ายค่าดู

    ฝนเดือนก่อนทำให้เข่าขวาของ{name}บวมทุกครั้งที่ขึ้นเวทีไม้ เด็กในคณะนับเหรียญในหมวกคืนนั้นได้สามเหรียญ พอซื้อข้าวให้คนสิบสองคนกินได้สองวัน
  choices:
    - id: outplay_the_brass
      label: เล่นคืนที่เสาฟ้าหักแข่งทุกคืน จนกว่าคณะไหนจะออกจากเมืองก่อน
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ย้ายบทพูดยาวของจอมมารมาเล่นตอนดึก หลังคณะตะเกียงฟ้าเล่นจบ คนดูที่เดินออกจากลานฝั่งนั้นได้ยินเสียงคนพูดบทเดียวกันดังมาจากอีกฝั่งตลาด เสียงคนจริง ไม่มีม่าน ไม่มีหุ่น หยุดหายใจผิดที่บ้าง ถูกที่บ้าง คืนที่สามคนดูเดินข้ามตลาดมาครึ่งลาน คืนที่ห้ามาเต็ม

          คณะตะเกียงฟ้าออกจากเมืองก่อนหนึ่งวัน ชายที่นั่งหลังม่านแวะมาที่เกวียนของ{name}ก่อนไป ซื้อเหล้าให้หนึ่งไห ไม่บอกชื่อ หมวกคืนสุดท้ายมีเจ็ดเหรียญ
        effects: { stats: { CHA: 1 }, gold: 7, flags: [outplayed_the_brass_demon] }
      failure:
        text: |
          ห้าคืนติดกันคนดูฝั่งของ{name}ไม่เคยเกินห้าสิบคน คืนที่หกเข่าขวาพับกลางฉากต่อสู้ {name}ล้มลงบนเวที คนดูหัวเราะนึกว่าเป็นมุก

          คณะลากเกวียนออกจากเมืองก่อนคณะตะเกียงฟ้า เงินในหมวกห้าคืนรวมกันไม่พอค่าเช่าลาน {name}ควักเงินตัวเองจ่ายส่วนที่ขาด
        effects: { hp: -2, gold: -3, flags: [lost_the_market_to_brass] }
    - id: meet_the_voice
      label: จ่ายค่าดูเรื่องของคณะนั้นหนึ่งคืน แล้วเดินไปหาคนหลังม่าน
      text: |
        {name}จ่ายค่าดูเหมือนคนอื่น นั่งแถวหลัง หุ่นทองเหลืองยกแขนตอนบทพูดถึงเสาต้นที่เจ็ด ยกตรงจังหวะ ไม่พลาดสักคืน เสียงหลังม่านพูดบทยาวได้ทุกคำ หยุดหายใจตรงที่มาริเดลสอนให้หยุด

        หลังเรื่องจบ{name}เดินอ้อมไปหลังม่าน ชายที่พูดบทจอมมารนั่งอยู่บนเก้าอี้ติดล้อ ขาทั้งสองข้างลีบอยู่ใต้ผ้าห่ม เขาจำ{name}ได้ เคยเล่นผู้กล้าคนที่สามในคณะของมาริเดลเมื่อหลายปีก่อน ก่อนจะตกจากหลังคาเกวียน เขาบอกว่าหุ่นทองเหลืองไม่เคยถามว่าคนพูดยืนได้ไหม แล้วรินเหล้าให้{name}หนึ่งจอก
      effects: { gold: -1, flags: [met_the_voice_behind_the_brass] }
    - id: take_the_hill_villages
      label: ยกตลาดให้เขา ลากเกวียนขึ้นไปหมู่บ้านที่เกวียนสีน้ำเงินขึ้นไม่ถึง
      text: |
        {name}สั่งเก็บเวทีตั้งแต่เช้าวันที่สอง คณะลากเกวียนขึ้นไปทางหมู่บ้านบนเนิน ทางที่เกวียนสี่เล่มทาสีน้ำเงินขึ้นไม่ได้เพราะแคบเกินไป หมู่บ้านแรกไม่เคยมีคณะไหนขึ้นไปเล่นมาเจ็ดปี

        ฤดูนั้นคณะได้เงินน้อยกว่าทุกฤดู แต่ได้ข้าวสาร ถั่ว ไข่ และผ้าห่มขนแพะสามผืน ที่หมู่บ้านสุดท้าย เด็กๆ ขอให้เล่นบทพูดยาวของจอมมารซ้ำสองรอบ
      effects: { gold: 2, alignment: { moral: 1 }, flags: [took_the_hill_villages] }
    - id: call_the_villages_in
      label: ส่งข่าวไปหมู่บ้านรอบเมืองที่เคยเล่นให้ดูตอนหน้าหนาวฝนตก
      requires: { flag: kept_the_road }
      text: |
        หน้าหนาวปีที่คณะปฏิเสธเงินอุปถัมภ์ คณะเล่นตามลานหมู่บ้านรอบเมืองนี้ครบทุกหมู่บ้าน ได้ข้าวกับถ่านแทนเหรียญ {name}ส่งเด็กในคณะขี่ล่อไปบอกทุกหมู่บ้านว่าคืนที่สาม คณะจะเล่นคืนที่เสาฟ้าหักในเมืองตลาด

        คืนที่สามเกวียนวัวสิบกว่าเล่มเข้าเมืองตั้งแต่บ่าย คนจากหมู่บ้านนั่งเต็มลานฝั่งของ{name} กินข้าวห่อที่เอามาเอง ท่องบทจอมมารตามดังกว่าเสียงคนบนเวที คนดูฝั่งตะเกียงฟ้าบางคนเดินข้ามมาดูว่าเสียงอะไร หมวกคืนนั้นได้หกเหรียญ กับไก่สองตัว
      effects: { gold: 6, flags: [villages_came_to_town] }

- id: adult.career_troupe_winter_purse
  stage: adult
  scene: tavern
  weight: 45
  when:
    age: [49, 56]
    flags: [job_troupe]
  text: |
    หิมะแรกปีนี้ลงตอนคณะยังอยู่กลางทาง เงินที่เก็บไว้ทั้งปีพอเช่าโรงนาพักหน้าหนาวได้หนึ่งหลัง กับซื้อข้าวให้คนสิบคน คณะมีสิบสี่คน

    มาริเดลไม่ได้นั่งเก้าอี้หลังเวทีมาหลายปีแล้ว แต่เกวียนทาสีของนางยังอยู่ ด้านข้างเกวียนวาดรูปเสาฟ้าเจ็ดต้น ต้นที่เจ็ดหักครึ่ง ทุกเมืองจำคณะได้จากเกวียนเล่มนั้นก่อนจะได้ยินเสียงกลอง พ่อค้าไม้ในเมืองล่าสุดเสนอซื้อแปดเหรียญ จะเอาไปตั้งหน้าร้านให้คนเดินผ่านดู

    คนในคณะสิบสี่คนนั่งล้อมเตาในโรงเตี๊ยมราคาถูก ไม่มีใครถามว่าใครต้องไป ทุกคนรอให้{name}เป็นคนพูดก่อน
  choices:
    - id: let_four_go
      label: ให้สี่คนที่เข้าคณะทีหลังสุดแยกไปหางานหน้าหนาวเอง
      text: |
        {name}เรียกสี่คนนั้นออกไปคุยหลังโรงเตี๊ยมทีละคน ให้เงินคนละหนึ่งเหรียญ กับจดหมายแนะนำถึงเจ้าของโรงเตี๊ยมสามแห่งที่ยังติดค้างน้ำใจคณะอยู่ สองคนไปจริง อีกสองคนนั่งอยู่ในคอกม้าจนดึก ไม่ยอมเข้ามาผิงไฟ

        หน้าหนาวนั้นคณะสิบคนอยู่รอด หน้าร้อนปีต่อมามีคนกลับมาคนเดียว อีกสามคนได้งานในโรงละครไม้ในเมือง แล้วไม่กลับมาลากเกวียนอีก
      effects: { gold: -4, flags: [cut_four_for_winter] }
    - id: sell_the_painted_wagon
      label: ขายเกวียนทาสีของมาริเดล
      text: |
        พ่อค้าไม้จ่ายแปดเหรียญ ลากเกวียนไปตั้งหน้าร้านในวันเดียวกัน {name}งัดแผ่นไม้ด้านข้างที่วาดเสาเจ็ดต้นออกมาก่อนส่ง แผ่นเดียว ยาวเท่าคนนอน พ่อค้าไม่ว่าอะไร เพราะจะทาสีใหม่ทั้งเล่มอยู่แล้ว

        คณะทั้งสิบสี่คนผ่านหน้าหนาวไปได้ ปีต่อมาไม่มีเมืองไหนจำคณะได้จากไกล แผ่นไม้รูปเสาเจ็ดต้นพิงอยู่ข้างเวทีทุกคืน ต้นที่เจ็ดหักครึ่งเหมือนเดิม
      effects: { gold: 8, flags: [sold_maridels_wagon] }
    - id: play_through_winter
      label: พาทั้งคณะเล่นตามโรงเตี๊ยมตลอดหน้าหนาว ไม่หยุดพัก
      check: { stat: CON, dc: 14 }
      success:
        text: |
          คณะแยกเป็นสามสาย เล่นในโรงเตี๊ยมสามแห่งคืนเดียวกัน เรื่องสั้นลงเหลือฉากเดียว ไม่มีเวที ไม่มีฉากหลัง มีแค่เขาไม้ทาสีแดงกับผ้าคลุมสีดำ {name}เดินเวียนสามโรงเตี๊ยมทุกคืนในหิมะ เล่นบทเดียวกันสามรอบ

          ไม่มีใครในคณะต้องไป ถึงหน้าร้อนทุกคนผอมลง {name}ไอไปจนถึงกลางปี แต่เงินที่เหลือพอซื้อผ้าใบเวทีผืนใหม่
        effects: { stats: { CON: 1 }, gold: 2, flags: [played_through_winter] }
      failure:
        text: |
          เดือนที่สอง {name}ล้มลงกลางโรงเตี๊ยมแห่งที่สาม ไข้ขึ้นสูงจนจำหน้าคนในคณะไม่ได้สองคืน คนในคณะต้องหยุดเล่นทั้งสามสายมาเฝ้า เงินที่หาได้ในเดือนแรกหมดไปกับหมอและยา

          พอ{name}ลุกไหว ก็ต้องให้สี่คนแยกไปหางานเองอยู่ดี
        effects: { hp: -3, flags: [cut_four_for_winter] }
    - id: back_to_the_patron
      label: กลับไปหาบ้านขุนนางที่เคยให้เงินอุปถัมภ์
      requires: { flag: troupe_patron }
      text: |
        ท่านขุนนางคนเดิมไม่รับแขกแล้ว ลูกชายของท่านเป็นคนออกมาพบ จำ{name}ได้จากเรื่องอัศวินกับเจ้าหญิงที่พ่อเขียน ลูกชายเปิดโรงละครไม้ให้คณะพักทั้งหน้าหนาว ข้าวสามมื้อทุกคน แลกกับการเล่นเรื่องของพ่อเขาทุกคืนวันว่างให้แขกของบ้านดู

        คณะเล่นเรื่องอัศวินอีกหนึ่งหน้าหนาว ตอนจบทุกคนแต่งงานกันเหมือนเดิม ลูกชายท่านขุนนางนั่งแถวหน้าทุกคืน หัวเราะในที่ที่ไม่มีใครหัวเราะ ปลายหน้าหนาวเขาจ่ายเพิ่มให้ห้าเหรียญ บอกว่าพ่อคงอยากให้จ่าย
      effects: { gold: 5, reputation: { crown: 1 }, flags: [wintered_in_the_patrons_theatre] }

- id: adult.career_troupe_last_night
  stage: adult
  scene: road
  weight: 45
  mark: คืนสุดท้ายบนเวที
  when:
    age: [57, 64]
    flags: [job_troupe]
  text: |
    คืนที่เสาฟ้าหักคืนนี้เป็นรอบที่เท่าไรแล้ว {name}นับไม่ได้ แคสซินจดไว้ในสมุดของคณะ บอกว่าเกินสองพันคืนไปตั้งแต่หน้าหนาวก่อน

    ปีนี้{name}เล่นแค่บทเล็ก ผู้กล้าที่ตายในฉากแรก นอนอยู่บนพื้นไม้ตลอดเรื่อง พอเรื่องจบ เข่าทั้งสองข้างไม่ยอมให้ลุกขึ้นจากพื้นเวทีเอง ต้องให้คนในคณะมาพยุง คนดูนึกว่าเป็นส่วนหนึ่งของการคำนับ

    คณะยังเป็นของ{name} ทุกคนรู้ เกวียน เงินในหีบ บทในหัว ไม่มีที่ไหนเขียนไว้ว่าเมื่อไรจะไม่ใช่
  choices:
    - id: give_it_to_cassin
      label: ยกคณะให้แคสซิน ทั้งเกวียน หีบเงิน และเขาไม้สีแดงคู่แรก
      requires: { flag: passed_the_demon_role }
      text: |
        {name}ยกหีบเงินให้แคสซินหลังเรื่องจบ ต่อหน้าทั้งคณะ ในหีบมีเงินสิบเอ็ดเหรียญ สมุดบัญชีที่มาริเดลเริ่มเขียน และเขาไม้ทาสีแดงคู่แรกของคณะ สีลอกจนเห็นเนื้อไม้ แคสซินเล่นจอมมารมาหลายปีด้วยคู่ที่แกะเอง คืนนั้นแคสซินวางคู่เก่าไว้บนฝาหีบ ไม่สวม

        เช้าวันต่อมาคณะลากเกวียนออกจากหมู่บ้าน {name}นั่งอยู่ท้ายเกวียนเล่มสุดท้าย ไม่ได้ขับ ไม่ได้นับเงิน แคสซินตะโกนบอกทางจากเกวียนเล่มหน้า เสียงไปถึงท้ายขบวน
      effects: { alignment: { moral: 1 }, flags: [retired, gave_the_troupe_to_cassin] }
    - id: write_it_down
      label: นั่งเขียนคืนที่เสาฟ้าหักลงกระดาษทั้งเรื่อง ก่อนจะลืม
      check: { stat: INT, dc: 13 }
      effects: { flags: [retired] }
      success:
        text: |
          ทั้งหน้าหนาว{name}นั่งเขียนอยู่ในโรงนาที่คณะพัก เขียนทุกบท ทุกจังหวะหยุดหายใจ ทุกที่ที่คนดูมักหัวเราะ ทุกท่อนที่คณะเคยตัดออกแล้วใส่คืน และท่อนไหนตัดเพราะใคร บทพูดยาวของจอมมารยาวสิบเอ็ดหน้า

          สมุดเล่มนั้นหนาสองนิ้ว ปกหุ้มด้วยผ้าใบเวทีผืนเก่า คณะอื่นสองคณะขอยืมไปลอก คณะหนึ่งคืนมาพร้อมเงินสามเหรียญ อีกคณะไม่คืน
        effects: { stats: { INT: 1 }, gold: 3, flags: [wrote_down_the_play] }
      failure:
        text: |
          เขียนได้ครึ่งเรื่อง{name}ก็หยุด บทบนกระดาษนิ่ง อ่านแล้วไม่มีที่ให้หายใจ คนในคณะที่อ่านบอกว่าเหมือนรายการของที่ต้องขนขึ้นเกวียน {name}เผากระดาษครึ่งเรื่องนั้นในเตา เก็บไว้แค่หน้าแรก มีชื่อเรื่องกับรายชื่อตัวละคร

          กระดาษกับหมึกทั้งหน้าหนาวราคาสี่เหรียญ
        effects: { gold: -4, flags: [burned_the_written_play] }
    - id: step_off_the_wagon
      label: ลงจากเกวียนที่หมู่บ้านนอกกำแพงที่ชอบที่สุด ไม่ตามไปอีก
      text: |
        หมู่บ้านนั้นอยู่ห่างกำแพงเมืองครึ่งวันเดิน มีลานดินหน้าโรงสีที่คณะเล่นทุกปีมาตั้งแต่สมัยมาริเดล ผู้ใหญ่บ้านให้เช่ากระท่อมหลังโรงสีปีละสองเหรียญ {name}ลงจากเกวียนพร้อมหีบผ้าใบใบเดียว

        คณะผ่านหมู่บ้านนั้นปีละสองครั้ง ทุกครั้ง{name}นั่งแถวหน้าบนเก้าอี้ที่ยกมาจากบ้าน ท่องบทจอมมารตามได้ทุกคำ เด็กในหมู่บ้านคิดว่า{name}เป็นคนแต่งเรื่องนี้
      effects: { gold: -2, location_tag: arvel_village, flags: [retired, settled_by_the_mill_green] }
    - id: play_from_the_chair
      label: อยู่กับคณะต่อ เขียนบทที่นั่งเก้าอี้เล่นได้ให้ตัวเอง
      text: |
        {name}เขียนบทใหม่ให้ตัวเองหนึ่งบท คนเฝ้าเสาต้นที่เจ็ดที่แก่เกินกว่าจะหนี นั่งเก้าอี้อยู่ข้างเวทีตลอดเรื่อง พูดแค่สามประโยค ประโยคสุดท้ายพูดตอนเสาหัก

        คนดูรุ่นใหม่ชอบคนแก่บนเก้าอี้มากกว่าผู้กล้าทั้งหกคน บางหมู่บ้านขอให้พูดประโยคสุดท้ายซ้ำ {name}ไม่ยอมพูดซ้ำสักครั้ง
      effects: { stats: { CHA: 1 }, flags: [still_working, plays_from_the_chair] }

# ---------- คนเดินข่าว ----------
- id: adult.career_news_well_song
  stage: adult
  scene: tavern
  weight: 45
  when:
    age: [41, 48]
    flags: [job_news_walker]
  text: |
    ข่าวนั้นมาถึงโรงเตี๊ยมก่อน{name}จะได้ยินจากปากใคร พอคนแบกน้ำที่โต๊ะริมประตูร้องให้เพื่อนฟัง ก็เป็นเพลงแล้ว ทำนองข่าว สัมผัสท้ายวรรค จังหวะสามสี่ที่คนเดินข่าวใช้ร้องเรื่องที่อยากให้คนจำ เพลงว่าเด็กมีเขาในตรอกช่างฟอกหนังเอาอะไรบางอย่างใส่บ่อน้ำกลางตรอก คนดื่มน้ำบ่อนั้นท้องร่วงไปเจ็ดบ้าน

    {name}ฟังรอบที่สองแล้วรู้ว่าไม่มีคนเห็นจริง เพลงข่าวของคนที่เห็นเองจะบอกเวลา บอกเสื้อผ้า บอกว่าใครยืนอยู่ตรงไหน เพลงนี้บอกแต่เขา บ่อ กับท้องร่วง และคนแต่งรู้จังหวะดีเกินกว่าจะเป็นคนแบกน้ำ

    คนสามสิบกว่าคนในโรงเตี๊ยมเริ่มร้องตาม มีคนลุกไปหยิบคบไฟจากหน้าประตู เสียงของ{name}แหบมาตั้งแต่ต้นหนาว ถ้าไม่ตะโกนก็ร้องได้แค่ครึ่งห้อง
  choices:
    - id: sing_over_it
      label: ขึ้นยืนบนโต๊ะ ร้องข่าวแก้ทับเพลงนั้น
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ไม่แข่งเสียงดัง ร้องทำนองเดียวกัน จังหวะเดียวกัน แต่เปลี่ยนคำ ใครเห็น เห็นตอนไหน เด็กชื่ออะไร บ้านไหนท้องร่วง ร้องทีละคำถามเป็นเพลงข่าว เว้นช่องท้ายวรรคไว้ให้คนตอบ โรงเตี๊ยมเงียบลงทีละโต๊ะ เพราะไม่มีใครมีคำตอบ

          คนที่หยิบคบไฟเอาไปเสียบคืนที่ประตูก่อนเที่ยงคืน คนแบกน้ำคนนั้นนั่งลง บอกว่าได้ยินมาจากคนเดินข่าวหน้าใหม่ที่ร้องอยู่หน้าโรงกลั่นเมื่อเช้า
        effects: { stats: { CHA: 1 }, flags: [sang_down_the_well_song] }
      failure:
        text: |
          เสียงแตกตั้งแต่วรรคที่สอง คนที่โต๊ะริมประตูหัวเราะ แล้วร้องเพลงเดิมทับดังกว่าเก่า ใครคนหนึ่งดึงขาโต๊ะ {name}ตกลงมากระแทกม้านั่ง ข้อศอกซ้ายบวมเป่ง

          คืนนั้นคนสิบกว่าคนถือคบไฟเดินไปที่ตรอกช่างฟอกหนัง ประตูบ้านหลังหนึ่งไหม้ คนในบ้านหนีออกทางหลังทันทุกคน
        effects: { hp: -2, flags: [well_song_burned_a_door] }
    - id: drink_from_the_well
      label: เดินนำไปที่บ่อ ตักน้ำดื่มต่อหน้าคนที่ตามมา
      check: { stat: CON, dc: 13 }
      success:
        text: |
          คนสิบกว่าคนตาม{name}ไปที่ตรอก บางคนถือคบไฟ {name}หย่อนถังลงบ่อ ตักขึ้นมาเต็มถัง ดื่มสามขันต่อหน้าทุกคน แล้วยืนรออยู่ข้างบ่อ คนที่ถือคบไฟก็รอด้วย ไม่มีใครรู้ว่าต้องรอนานเท่าไร

          ใกล้สาง{name}ยังยืนอยู่ ชาวบ้านในตรอกตักน้ำบ่อนั้นไปหุงข้าวเช้า คนถือคบไฟทยอยกลับทีละคน สองวันต่อมามีคนงมเจอหนูตายสามตัวที่ก้นบ่ออีกฝั่งของตรอก
        effects: { stats: { CON: 1 }, flags: [drank_from_the_well] }
      failure:
        text: |
          {name}ดื่มสามขันต่อหน้าทุกคน ตอนสางท้องเริ่มบิด ถึงเที่ยงก็นอนอยู่หลังตรอกเหมือนคนเจ็ดบ้านนั้น คนถือคบไฟส่งเสียงฮือ แต่ยังไม่ทันได้ไปไหน คนงมบ่อก็เจอหนูตายสามตัวที่ก้นบ่อ ขึ้นอืดจนขนหลุด

          {name}นอนซมอยู่ห้าวัน ไม่ได้ร้องข่าวสักคืน ข่าวหนูตายในบ่อไปถึงทุกโรงเตี๊ยมก่อน{name}จะลุกไหว
        effects: { hp: -2, flags: [drank_from_the_well] }
    - id: find_the_song_buyer
      label: ตามหาคนแต่งเพลงให้เจอก่อนใครจะตามหาเด็ก
      requires: { flag: exposed_bought_news }
      text: |
        {name}เคยร้องข่าวจริงในคืนที่มีคนจ่ายเงินให้ร้องข่าวปลอม รู้ว่าเพลงข่าวที่จังหวะดีขนาดนี้ต้องมีคนจ่าย คืนนั้น{name}ไปหาคนเดินข่าวหน้าใหม่ที่หน้าโรงกลั่น เด็กหนุ่มเสียงดีอายุไม่ถึงยี่สิบ ไม่ต้องขู่ เด็กบอกเองว่าได้เงินสามเหรียญจากเสมียนโรงกลั่น เพราะตรอกช่างฟอกหนังอยู่ตรงที่โรงกลั่นอยากขยายโกดัง

        เช้าวันต่อมา{name}ร้องข่าวใหม่หน้าโรงกลั่นเดียวกัน บอกชื่อเสมียน บอกราคาสามเหรียญ บอกขนาดโกดังที่อยากได้ เด็กมีเขาในตรอกนั้นนั่งฟังอยู่บนบันไดบ้านตัวเอง
      effects: { reputation: { distillers: -1 }, alignment: { moral: 1 }, flags: [named_the_well_song_buyer] }
    - id: print_the_questions
      label: ให้คนงานโรงสีของเฮเวลินแจกกระดาษข่าวแก้ก่อนสาง
      requires: { flag: hevelin_prints }
      text: |
        เฮเวลินผมหงอกทั้งหัวแล้ว แต่ยังตื่นก่อนคนงานโรงสีทุกคน {name}เขียนข่าวแก้สิบบรรทัดบนโต๊ะในครัวของนาง ไม่ใช่เพลง เป็นคำถามสิบข้อ ใครเห็น เห็นตอนไหน บ้านไหนท้องร่วง คัลเดนพิมพ์สามร้อยแผ่นเสร็จก่อนตีสี่

        ตอนสาง กระดาษสามร้อยแผ่นอยู่ในย่ามข้าวของคนงานโรงสีทุกคนที่เดินผ่านตรอกช่างฟอกหนัง บางคนแปะไว้ที่ขอบบ่อ ค่ากระดาษกับหมึก{name}ออกเองสองเหรียญ
      effects: { gold: -2, alignment: { law: -1 }, flags: [printed_the_well_questions] }

- id: adult.career_news_brass_tags
  stage: adult
  scene: tavern
  weight: 45
  when:
    age: [49, 56]
    flags: [job_news_walker]
  text: |
    ป้ายทองเหลืองขนาดเท่าฝ่ามือเด็ก เจาะรูร้อยเชือก ด้านหน้าตอกตราสำนักตรวจหนังสือ ด้านหลังตอกชื่อคนถือ ตั้งแต่ต้นปีหน้า คนเดินข่าวที่ร้องในโรงเตี๊ยมในเมืองต้องห้อยป้ายนี้ไว้ที่คอ โรงเตี๊ยมไหนให้คนไม่มีป้ายร้อง สำนักตรวจจะปรับเจ้าของ และจับคนร้อง

    สำนักตรวจไม่รู้จักคนเดินข่าว จึงให้คนที่ร้องมานานที่สุดในแต่ละเขตเป็นคนรับรองรายชื่อ เขตนี้คนนั้นคือ{name} เสมียนของสำนักวางรายชื่อที่ร่างไว้แล้วสิบเก้าชื่อบนโต๊ะริมประตู ขอแค่ลายมือชื่อ

    {name}รู้จักคนเดินข่าวในเขตนี้ยี่สิบสามคน สี่ชื่อที่ไม่อยู่ในร่าง คือหญิงมีเขาที่ร้องข่าวในตรอกช่างฟอกหนัง สองพี่น้องที่ร้องข่าวคนงานโรงกลั่นหยุดงาน และเด็กหนุ่มที่เพิ่งร้องเป็นมาไม่ถึงปี เสมียนอธิบายว่าสามคนแรกร้องเรื่องที่ทำให้คนออกไปยืนบนถนน ส่วนคนที่สี่ยังไม่มีใครรู้จัก
  choices:
    - id: sign_as_drafted
      label: ลงชื่อตามร่าง สิบเก้าชื่อ
      text: |
        {name}ลงชื่อ เสมียนเป่าหมึกให้แห้งแล้วม้วนรายชื่อเก็บใส่กระบอก ต้นปีป้ายทองเหลืองสิบเก้าอันมาถึงโรงเตี๊ยมในกล่องไม้ ป้ายของ{name}อยู่บนสุด ชื่อตอกลึกกว่าป้ายอื่น

        หญิงจากตรอกช่างฟอกหนังยังร้องข่าวอยู่ แต่ร้องในตรอก ไม่ได้ร้องในโรงเตี๊ยม สองพี่น้องย้ายไปร้องที่ท่าเรือ เด็กหนุ่มคนนั้นมาขอเป็นลูกมือของ{name} เพื่อจะได้มีชื่อในรายชื่อปีหน้า
      effects: { reputation: { crown: 1 }, alignment: { law: 1, moral: -1 }, flags: [signed_the_walker_list] }
    - id: add_the_four
      label: เติมสี่ชื่อที่ขาดลงท้ายรายชื่อ แล้วค่อยลงชื่อ
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}เติมสี่ชื่อด้วยลายมือตัวเอง แล้วนั่งรอเสมียนอ่านจบ บอกเสมียนว่าถ้าสำนักอยากรู้ว่าใครร้องอะไร รายชื่อที่ครบจะบอกได้มากกว่ารายชื่อที่ขาด คนที่ไม่มีป้ายจะไปร้องในที่ที่สำนักไม่มีหู

          เสมียนนั่งคิดจนเหล้าในแก้วอุ่น แล้วม้วนรายชื่อยี่สิบสามชื่อใส่กระบอก ต้นปีป้ายมาถึงยี่สิบสามอัน หญิงจากตรอกช่างฟอกหนังมารับป้ายของนางเองที่โรงเตี๊ยม ห้อยไว้นอกผ้าคลุม
        effects: { stats: { CHA: 1 }, flags: [listed_every_walker] }
      failure:
        text: |
          เสมียนขีดฆ่าสี่ชื่อที่เติมทิ้งต่อหน้า{name} บอกว่ารายชื่อนี้จะส่งกลับไปพร้อมหมายเหตุว่าคนรับรองไม่ให้ความร่วมมือ ต้นปีป้ายมาถึงสิบเก้าอัน ไม่มีป้ายของ{name}ในกล่อง

          {name}ต้องไปยื่นคำร้องที่สำนักตรวจเองสามครั้ง จ่ายค่าธรรมเนียมครั้งละหนึ่งเหรียญ กว่าจะได้ป้ายมาห้อยคอ
        effects: { gold: -3, reputation: { crown: -1 }, flags: [walker_list_struck] }
    - id: refuse_to_sign
      label: ไม่ลงชื่อ แล้วร้องต่อไปโดยไม่มีป้าย
      text: |
        {name}เลื่อนรายชื่อคืนไปให้เสมียน เสมียนไม่เถียง เดือนต่อมารายชื่อมาจากคนเดินข่าวที่ร้องมานานรองจาก{name} สิบเก้าชื่อเท่าเดิม ไม่มีชื่อ{name}

        ต้นปี เจ้าของโรงเตี๊ยมยังให้{name}ร้องที่โต๊ะริมประตูต่อ แต่ร้องได้แค่หลังยามเดินผ่านไปแล้ว ข่าวของ{name}กลายเป็นข่าวดึก คนที่มาฟังเป็นคนที่ไม่อยากให้ใครเห็นว่ามาฟัง
      effects: { alignment: { law: -1 }, reputation: { crown: -1 }, flags: [sings_without_a_tag] }
    - id: print_the_unlisted
      label: ลงชื่อตามร่าง แล้วให้คัลเดนพิมพ์สี่ชื่อที่ขาดตอนกลางคืน
      requires: { flag: printed_without_stamp }
      text: |
        {name}ลงชื่อสิบเก้าชื่อตามร่าง คืนเดียวกันเขียนอีกแผ่น สี่ชื่อที่ขาด ร้องข่าวเรื่องอะไร ร้องที่ไหน คืนไหน คัลเดนพิมพ์ห้าร้อยแผ่นโดยไม่มีตรา เอาไปวางตามบันไดท่าน้ำก่อนสาง

        ต้นปีป้ายทองเหลืองมาถึงสิบเก้าอัน คนไม่มีป้ายทั้งสี่ร้องข่าวคืนละที่ตามกระดาษแผ่นนั้น ทุกที่มีคนมารอฟังก่อนคนร้องจะมาถึง สำนักตรวจส่งยามไปตามสองครั้ง ไปถึงหลังคนร้องย้ายที่ทั้งสองครั้ง
      effects: { gold: -2, reputation: { dock_rats: 1 }, flags: [printed_the_unlisted] }

- id: adult.career_news_last_song
  stage: adult
  scene: tavern
  weight: 45
  mark: ร้องข่าวครั้งสุดท้าย
  when:
    age: [57, 64]
    flags: [job_news_walker]
  text: |
    โต๊ะริมประตูโรงเตี๊ยมเป็นของ{name}มานานจนเจ้าของโรงเตี๊ยมคนปัจจุบันจำไม่ได้ว่าเคยเป็นของใครมาก่อน ขอบโต๊ะด้านที่{name}เคาะจังหวะมีรอยนิ้วสึกเป็นแอ่งตื้นๆ สี่แอ่ง

    คืนนี้{name}ร้องข่าวราคาข้าวได้สามวรรคแล้วไอจนต้องนั่งลง คนในโรงเตี๊ยมรอ ไม่มีใครคุย ไม่มีใครลุก ลูกมือร้องข่าวสองคนที่ยืนอยู่ข้างถังเหล้าร้องต่อให้จบได้ทุกคำ ทั้งสองคนรอให้{name}หันไปบอก

    ข่าวที่{name}ร้องมาทั้งชีวิตมีเป็นพันเรื่อง มีบางเรื่องที่ไม่เคยร้องให้จบ
  choices:
    - id: hand_over_the_table
      label: ชี้ให้ลูกมือร้องต่อ แล้วไม่ลุกขึ้นอีก
      text: |
        ลูกมือคนที่อายุมากกว่าก้าวออกมาร้องข่าวราคาข้าวต่อตั้งแต่วรรคที่สี่ ร้องจังหวะเดียวกับ{name} หยุดหายใจตรงที่{name}หยุด คนในโรงเตี๊ยมเคาะโต๊ะตามจังหวะ คืนนั้นเขาร้องข่าวครบเจ็ดเรื่อง

        ตั้งแต่คืนนั้น{name}นั่งโต๊ะมุมข้างเตาผิง เจ้าของโรงเตี๊ยมไม่เก็บค่าเหล้า โต๊ะริมประตูมีลูกมือคนนั้นนั่ง นิ้วเคาะลงในแอ่งสี่แอ่งบนขอบโต๊ะพอดี
      effects: { alignment: { law: 1 }, flags: [retired, gave_up_the_door_table] }
    - id: sing_the_old_truth
      label: ร้องข่าวโรงสีหยุดงานเมื่อหลายสิบปีก่อนใหม่ตามความจริง
      requires: { flag: sang_bought_news }
      text: |
        {name}ลุกขึ้นอีกครั้ง ไม่ร้องข่าวราคาข้าว ร้องข่าวคนงานโรงสีหยุดงานเมื่อหลายสิบปีก่อน ข่าวที่{name}เคยรับเงินสิบเหรียญร้องว่าเฮเวลินขโมยเงินกองกลาง คืนนี้ร้องอีกแบบ ว่าใครจ่ายเงินให้ร้อง จ่ายเท่าไร คนร้องคือใคร และเช้าวันที่สิบสองเฮเวลินยืนอยู่กลางลานคนเดียว

        คนแก่สองสามคนในโรงเตี๊ยมจำข่าวเก่าได้ คนหนุ่มไม่เคยได้ยินทั้งสองแบบ ร้องจบ{name}วางเหรียญสามเหรียญไว้บนโต๊ะริมประตู บอกว่าเป็นส่วนที่เหลือจากเงินคืนนั้น ใครจะเอาไปก็เอา แล้วเดินออกจากโรงเตี๊ยม ไม่กลับมาร้องอีก
      effects: { gold: -3, alignment: { moral: 1 }, flags: [retired, sang_the_old_truth] }
    - id: write_for_the_press
      label: เลิกร้อง แต่ไปนั่งเขียนข่าวให้ร้านพิมพ์
      check: { stat: INT, dc: 13 }
      effects: { flags: [still_working, writes_for_the_press] }
      success:
        text: |
          ร้านพิมพ์ของคัลเดนตกมาถึงมือลูกสาวแล้ว นางให้{name}นั่งโต๊ะหลังแท่นพิมพ์ เขียนข่าววันละสามเรื่อง ตัดทุกคำที่ต้องใช้เสียงช่วย ข่าวบนกระดาษไม่มีจังหวะ ไม่มีที่หายใจ {name}ต้องหัดใหม่หมด

          เดือนที่สาม คนอ่านเริ่มจำได้ว่าข่าวไหน{name}เขียน เพราะทุกข่าวบอกว่าใครยืนอยู่ตรงไหน ค่าเขียนเดือนละสามเหรียญ
        effects: { stats: { INT: 1 }, gold: 3 }
      failure:
        text: |
          ข่าวที่{name}เขียนยาวเกินแผ่น ทุกเรื่องมีวรรคที่ต้องร้องถึงจะเข้าใจ ลูกสาวคัลเดนตัดทิ้งครึ่งหนึ่งทุกเรื่อง {name}เขียนใต้ตะเกียงทุกคืนจนตาข้างขวาพร่า

          สองเดือนต่อมา{name}เลิกเขียนข่าวเอง แล้วกลับไปนั่งฟังข่าวที่โรงเตี๊ยม จดข่าวที่คนอื่นร้องผิดลงสมุดเล่มเล็ก ส่งไปให้ร้านพิมพ์ทุกเช้า
        effects: { hp: -1 }
    - id: sing_in_small_rooms
      label: ร้องต่อ แต่ร้องแค่โรงเตี๊ยมเล็กที่เสียงยังไปถึง
      text: |
        {name}ย้ายไปร้องที่โรงเตี๊ยมเล็กริมคลองสามแห่ง ห้องละไม่เกินยี่สิบโต๊ะ ร้องแค่สามข่าวต่อคืน ไม่ร้องเพลงยาว คนฟังนั่งใกล้จนได้ยินเสียงลมหายใจระหว่างวรรค

        เจ้าของโรงเตี๊ยมริมคลองแขวนป้ายไม้หน้าประตู เขียนว่าคืนไหน{name}ร้อง คืนนั้นขายเหล้าได้สองเท่า ค่าร้องคืนละครึ่งเหรียญ กับข้าวหนึ่งมื้อ
      effects: { gold: 4, flags: [still_working, sings_in_small_rooms] }

# ---------- นักร้องประจำบ้านขุนนาง ----------
- id: adult.career_house_singer_requiem
  stage: adult
  scene: noble_hall
  weight: 45
  when:
    age: [41, 48]
    flags: [job_house_singer]
  text: |
    ระฆังเล็กบนหลังคาบ้านตีเก้าครั้งตอนตีสาม ไม่ต้องรอพ่อบ้านขึ้นมาเคาะประตู {name}รู้ว่าเจ้าของบ้านสิ้นใจแล้ว งานศพจัดในอีกสามวัน ตอนตะวันตกดิน แขกสองร้อยคน เพลงส่งศพของบ้านต้องร้องโดยครูดนตรีประจำบ้าน ตามธรรมเนียมที่ไม่เคยเปลี่ยนมาหกชั่วคน

    ท่อนสุดท้ายของเพลงส่งศพขึ้นไปถึงเสียงที่สูงที่สุดในบรรดาเพลงทั้งหมดที่บ้านนี้มี ทุกวันนี้{name}ร้องถึงเสียงนั้นได้แค่ตอนเช้า ก่อนพูดกับใคร ก่อนกินอะไร

    ทายาทของบ้านส่งคนมาถามว่าครูดนตรีพร้อมหรือไม่ ถ้าไม่พร้อม ทายาทรู้จักนักร้องหนุ่มในเวนทราสหลายคน
  choices:
    - id: sing_it_all
      label: ร้องเองทั้งเพลง ไม่พูดกับใครตั้งแต่เช้าวันงาน
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ไม่พูดสักคำตั้งแต่ตื่น ไม่กินอะไรนอกจากน้ำผึ้งละลายน้ำอุ่น พอตะวันตก{name}ยืนที่หัวโลงในห้องโถงใหญ่ ร้องเพลงส่งศพทั้งเพลงด้วยเสียงที่เก็บไว้ทั้งวัน ท่อนสุดท้ายขึ้นถึงเสียงนั้นจริง ค้างไว้นานพอให้แขกแถวหลังได้ยิน

          แขกสองร้อยคนกลับบ้านไปโดยไม่มีใครรู้ว่าเสียงนั้นมาจากคนที่ไม่ได้พูดมาทั้งวัน ทายาทขึ้นค่าจ้างให้สามเหรียญ แล้วไม่เคยเอ่ยถึงนักร้องหนุ่มในเวนทราสอีก
        effects: { stats: { CHA: 1 }, gold: 3, flags: [sang_the_masters_requiem] }
      failure:
        text: |
          ท่อนสุดท้าย เสียงขึ้นไปได้ครึ่งทางแล้วแตก {name}ร้องต่อในเสียงที่ต่ำลงหนึ่งขั้นจนจบเพลง แขกส่วนใหญ่ไม่รู้ แต่ทายาทรู้ พ่อบ้านรู้ และนักร้องรุ่นเด็กทั้งสี่คนที่ยืนอยู่หลังเสาก็รู้

          คืนนั้นลำคอของ{name}มีรสเลือด ร้องอะไรไม่ได้อีกสิบวัน เดือนต่อมาทายาทจ้างนักร้องหนุ่มจากเวนทราสมาร้องงานเลี้ยง ส่วน{name}ยังเป็นครูดนตรีอยู่ในห้องดนตรีชั้นล่าง
        effects: { hp: -1, flags: [broke_on_the_requiem] }
    - id: share_the_requiem
      label: ให้ลูกศิษย์ที่เคยสอนร้องท่อนสุดท้าย ตัวเองร้องท่อนต้น
      requires: { flag: taught_requiem }
      text: |
        เด็กที่เคยยืนร้องเพลงส่งศพอยู่นอกประตูห้องนอนเมื่อหลายปีก่อน ตอนนี้เสียงแตกหนุ่มเสร็จแล้ว เหลือเสียงสูงที่ใสกว่าตอนเด็ก {name}ร้องสามท่อนแรก ส่งท่อนสุดท้ายให้ลูกศิษย์ร้อง ยืนอยู่ข้างกันที่หัวโลง

        แขกหลายคนบอกว่าไม่เคยได้ยินเพลงส่งศพร้องสองเสียงมาก่อน หลังงาน พ่อบ้านเดินมาบอก{name}ว่าท่านคงชอบ ท่านเคยถามว่าคืนนั้นใครร้อง แล้วหัวเราะ
      effects: { gold: 2, alignment: { law: -1 }, flags: [shared_the_requiem] }
    - id: third_verse_his_way
      label: ร้องท่อนที่สามเร็วขึ้น อย่างที่ท่านสั่งไว้บนบันได
      requires: { flag: sang_the_living_requiem }
      text: |
        ท่อนที่สามของเพลงส่งศพร้องช้ามาหกชั่วคน คืนนี้{name}ร้องเร็วขึ้นครึ่งจังหวะ จังหวะที่ท่านฮัมให้ฟังบนบันไดตลอดสองหน้าหนาว แขกที่รู้เพลงนี้ดีหันมาหากันกลางท่อน ทายาทขมวดคิ้ว ท่อนสุดท้าย{name}ร้องถึงเสียงนั้นหรือไม่ หลังงานไม่มีใครจำได้

        พ่อบ้านยืนอยู่ปลายโลง เคาะนิ้วบนขอบโลงตามจังหวะใหม่ หลังงานทายาทเรียก{name}ไปถามว่าใครสั่งให้เปลี่ยน {name}ตอบตามจริง ทายาทไม่ถามต่อ
      effects: { alignment: { law: -1 }, flags: [sang_the_third_verse_his_way] }
    - id: sing_it_low
      label: ร้องทั้งเพลงต่ำลงหนึ่งขั้น ไม่ฝืนขึ้นเสียงสูง
      text: |
        {name}ลดเพลงลงหนึ่งขั้นทั้งเพลง ตั้งแต่โน้ตแรก ไม่มีใครในบ้านเคยร้องแบบนี้ และไม่มีใครเคยห้ามไว้ ท่อนสุดท้ายไม่ได้สูงที่สุดในเพลงอีกต่อไป แต่ทุกคำชัด ทุกคำไปถึงแถวหลัง

        ทายาทจ่ายค่าร้องงานศพสี่เหรียญตามธรรมเนียม ปีต่อมาเพลงส่งศพในสมุดเพลงของบ้านมีโน้ตสองแถว แถวบนเป็นลายมือคนรุ่นก่อน แถวล่างเป็นลายมือของ{name}
      effects: { gold: 4, flags: [lowered_the_requiem] }

- id: adult.career_house_singer_heir
  stage: adult
  scene: noble_hall
  weight: 45
  when:
    age: [49, 56]
    flags: [job_house_singer]
  text: |
    ทายาทของบ้านอ่านบัญชีเองทุกบรรทัด เรียก{name}ไปที่ห้องอ่านหนังสือ บอกว่าบ้านเลี้ยงนักร้องห้าคนไม่ไหวแล้ว ให้เหลือสองคน ให้{name}เป็นคนเลือกภายในสิ้นเดือน

    ในห้าคนนั้น คนที่เสียงดีที่สุดคือเด็กสาวจากตรอกช่างย้อมในเวนทราส ลงเสียงต่ำได้ลึกกว่า{name}ทุกวันนี้ และขึ้นเสียงสูงได้ทุกเวลาโดยไม่ต้องรอเช้า สองสัปดาห์ก่อน{name}เห็นนางยืนแนบหูอยู่ที่ผนังห้องเก็บพิณ ผนังที่ติดห้องรับแขกของทายาท ตอนที่ทายาทคุยกับแขกจากบ้านอื่น

    {name}รู้จักท่ายืนแบบนั้นดี
  choices:
    - id: argue_for_five
      label: ไปเถียงกับทายาทให้คงนักร้องไว้ทั้งห้าคน
      check: { stat: CHA, dc: 15 }
      success:
        text: |
          {name}ไม่เถียงเรื่องเพลง เถียงเรื่องแขก บ้านขุนนางในเวนทราสแข่งกันด้วยงานเลี้ยง งานเลี้ยงแข่งกันด้วยเสียง บ้านที่ลดนักร้องเหลือสองคน ทุกบ้านในเมืองจะรู้ภายในสามงานเลี้ยงว่าบ้านนี้ขาดเงิน แล้วแต่ละบ้านจะเดากันเองว่าขาดเท่าไร

          ทายาทคิดอยู่ครึ่งคืน เช้ามาขายรถม้าคันเล็กไปหนึ่งคันแทนการลดนักร้อง ห้องดนตรียังมีห้าคน ค่าจ้างของ{name}ลดลงสองเหรียญ เพราะ{name}เป็นคนเสนอ
        effects: { stats: { CHA: 1 }, gold: -2, flags: [kept_the_music_room_whole] }
      failure:
        text: |
          ทายาทฟังจนจบ แล้วบอกว่าครูดนตรีที่เถียงเรื่องเงินกับเจ้าของบ้าน ควรมีเงินของตัวเองมาจ่ายให้เสียงที่อยากเก็บ ทายาทให้{name}เลือกสองคนภายในสามวันแทนสิ้นเดือน และหักค่าจ้างเดือนนั้นไปสามเหรียญ

          {name}เลือกเด็กสาวจากตรอกช่างย้อมกับเด็กหนุ่มอีกคน อีกสามคนออกจากบ้านเช้าวันที่สี่ พร้อมจดหมายแนะนำที่{name}เขียนให้คนละฉบับ
        effects: { gold: -3, flags: [lost_three_singers] }
    - id: dismiss_the_listener
      label: ให้เด็กสาวคนนั้นออกเป็นคนแรก ไม่บอกเหตุผลกับทายาท
      text: |
        {name}เลือกสองคนที่เสียงดีรองลงมา แล้วเรียกเด็กสาวจากตรอกช่างย้อมมาที่ห้องดนตรี ปิดประตู บอกนางว่าเห็นอะไรที่ผนังห้องเก็บพิณ แล้วบอกว่าบ้านที่จ้างให้นางฟังผนังจะไม่จ้างนางเป็นนักร้อง นักร้องที่ฟังผนังเป็นมีราคาแค่ตอนที่ยังอยู่ในบ้าน

        เด็กสาวไม่เถียง เก็บของออกจากบ้านในวันเดียวกัน ฤดูต่อมา{name}ได้ยินเสียงนางลอยมาจากระเบียงบ้านขุนนางอีกบ้านหนึ่งริมคลองใหญ่ ลงเสียงต่ำได้ลึกเหมือนเดิม
      effects: { alignment: { law: 1 }, flags: [dismissed_the_wall_listener] }
    - id: feed_the_listener
      label: เก็บนางไว้ แล้วป้อนเรื่องไม่จริงให้นางได้ยินผ่านผนัง
      requires: { flag: fed_false_letters }
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}เคยส่งรายชื่อปลอมให้บ้านอื่นมาแล้วครั้งหนึ่ง รู้ว่าเรื่องปลอมที่ดีต้องมีชื่อจริงปนอยู่ {name}ไปหาทายาท เล่าทุกอย่าง แล้วขอให้ทายาทคุยกับแขกในห้องรับแขกตามเรื่องที่{name}เขียนให้ทุกคืนวันว่าง เรื่องที่ดินริมคลองแปลงหนึ่งที่บ้านไม่เคยคิดจะซื้อ

          สามเดือนต่อมา บ้านขุนนางริมคลองบ้านหนึ่งซื้อที่ดินแปลงนั้นในราคาสองเท่า ทายาทให้{name}เก็บนักร้องไว้สี่คนแทนสอง เด็กสาวจากตรอกช่างย้อมยังร้องอยู่ในห้องดนตรี ไม่รู้ว่าทำไมยังได้อยู่
        effects: { stats: { INT: 1 }, reputation: { crown: 1 }, flags: [fed_the_wall_listener] }
      failure:
        text: |
          เด็กสาวฟังเรื่องที่ดินริมคลองครบทุกคืน แต่ไม่ส่งต่อ คืนที่สามนางเดินมาหา{name}ที่ห้องดนตรี บอกว่าเรื่องที่ทายาทคุยในห้องรับแขกช่วงนี้ฟังเหมือนเพลงที่ซ้อมมา แล้วถามว่า{name}สอนใครฟังผนังมาก่อนนางกี่คน

          คืนนั้นนางออกจากบ้านไปเอง ทายาทลดนักร้องเหลือสองคนตามเดิม และหักค่าจ้างของ{name}สองเหรียญ เพราะเสียเวลาไปสามเดือน
        effects: { gold: -2, flags: [listener_saw_through] }

- id: adult.career_house_singer_last_feast
  stage: adult
  scene: noble_hall
  weight: 45
  mark: ลงจากระเบียงร้องเพลง
  when:
    age: [57, 64]
    flags: [job_house_singer]
  text: |
    ทายาทจัดงานเลี้ยงฉลองที่บ้านนี้ตั้งมาครบสองร้อยปี แขกสามร้อยคน นักร้องหกคน ชื่อของ{name}ไม่ได้อยู่ในรายชื่อคนร้อง อยู่ในรายชื่อแขก

    พ่อบ้านคนใหม่ยื่นซองให้หลังอาหารเช้า ในซองมีจดหมายของทายาท เขียนสุภาพทุกคำ บ้านจะยกห้องเล็กใต้หลังคาปีกตะวันตกให้ครูดนตรีอยู่ไปจนสิ้นอายุ กับเงินเดือนครึ่งหนึ่งของเดิม หรือถ้าครูดนตรีอยากไปอยู่ที่อื่น บ้านจะจ่ายก้อนเดียวให้ เท่าค่าจ้างสองปี

    เสียงของ{name}ยังร้องได้ทุกเพลงของบ้าน ช้ากว่าเดิม ต่ำกว่าเดิม ห้องดนตรีชั้นล่างมีนักร้องรุ่นเด็กสามคนที่{name}สอนมากับมือ
  choices:
    - id: teach_from_the_attic
      label: รับห้องใต้หลังคา แล้วลงไปสอนนักร้องรุ่นเด็กทุกเช้า
      text: |
        {name}ย้ายของขึ้นห้องใต้หลังคาในสามเที่ยว หีบเสื้อผ้า พิณตัวเล็ก และสมุดเพลงของบ้านที่ไม่มีใครขอคืน ทุกเช้าก่อนพูดกับใคร {name}ลงบันไดสามชั้นไปห้องดนตรี สอนเด็กสามคนจนถึงเที่ยง ในช่วงที่เสียงของ{name}ยังขึ้นถึงทุกเสียง

        คืนงานเลี้ยง {name}นั่งโต๊ะแขกแถวท้าย ฟังเด็กสามคนร้องเพลงที่{name}สอน แขกข้างๆ ถามว่ารู้จักนักร้องพวกนี้หรือเปล่า {name}บอกว่ารู้จักนิดหน่อย
      effects: { gold: 3, flags: [still_working, teaches_from_the_attic] }
    - id: lump_sum_and_village
      label: รับเงินก้อน แล้วย้ายไปอยู่หมู่บ้านนอกกำแพง
      text: |
        เงินค่าจ้างสองปีห่ออยู่ในผ้าเช็ดหน้าผืนเดียว {name}เช่าบ้านไม้สองห้องในหมู่บ้านห่างกำแพงเมืองครึ่งวันเดิน หมู่บ้านนั้นจุดเทียน ไม่มีตะเกียงฟ้าสักดวง

        คืนแรก{name}นั่งหน้าบ้านจนดึก ไม่มีเสียงรถม้า ไม่มีเสียงงานเลี้ยงลอยมาจากบ้านข้างๆ มีแต่หมาเห่าต่อกันเป็นทอดไปจนสุดหมู่บ้าน เดือนที่สอง ผู้ใหญ่บ้านมาถามว่าคนจากในเมืองร้องเพลงงานแต่งเป็นไหม ลูกสาวแกจะแต่งงานหน้าหนาว
      effects: { gold: 8, location_tag: arvel_village, flags: [retired, left_the_house_for_the_village] }
    - id: last_song_from_the_balcony
      label: ขอทายาทร้องเพลงเปิดงานจากระเบียงเดิมเป็นเพลงสุดท้าย
      check: { stat: CHA, dc: 14 }
      effects: { flags: [retired, last_song_from_the_balcony] }
      success:
        text: |
          ทายาทยอม เพราะแขกบางคนในรายชื่อยังจำได้ว่าใครเคยร้องที่ระเบียงนั้น {name}ขึ้นระเบียงเหนือห้องโถงก่อนแขกมาถึง ยืนตรงที่ยืนครั้งแรกตอนยังเป็นนักร้องหน้าใหม่ ราวระเบียงตรงนั้นมีรอยที่มือของ{name}จับจนเป็นเงา

          เพลงเปิดงานยาวเจ็ดท่อน {name}ร้องครบทั้งเจ็ด แขกสามร้อยคนหยุดคุยตั้งแต่ท่อนที่สอง ร้องจบ{name}ลงบันไดหลังไปเลย ไม่รอเสียงปรบมือ ทายาทจ่ายเงินก้อนตามที่สัญญาไว้
        effects: { stats: { CHA: 1 }, gold: 8 }
      failure:
        text: |
          ท่อนที่สี่ เสียงของ{name}หายไปกลางคำ ไม่แตก ไม่แหบ หายไปเฉยๆ เหมือนเทียนที่มีคนบีบไส้ {name}ยืนนิ่งบนระเบียงครู่หนึ่ง แล้วเด็กสาวคนหนึ่งจากห้องดนตรีชั้นล่างร้องท่อนนั้นต่อจากหลังเสา ร้องไปจนจบเพลง

          แขกส่วนใหญ่นึกว่าจัดไว้ให้ครูส่งเพลงให้ศิษย์ ทายาทจ่ายเงินก้อนตามที่สัญญา {name}ไม่ได้ร้องเพลงอะไรอีกเลยตลอดหน้าหนาวนั้น
        effects: { hp: -1, gold: 8 }
    - id: refuse_the_grey_coat
      label: รับเงินก้อนแล้วออกจากบ้าน ไม่ขายเรื่องในห้องอ่านหนังสือคืนนั้นให้ใคร
      requires: { flag: kept_lords_secret }
      text: |
        วันที่{name}หิ้วหีบออกทางประตูหลังบ้าน ชายเสื้อเทาคนหนึ่งยืนรออยู่ใต้ตะเกียงฟ้าริมถนน แหวนตาชั่งที่นิ้ว อายุน้อยกว่าชายที่{name}เห็นในห้องอ่านหนังสือคืนงานวันเกิดท่านเฮดริคสามสิบปี แต่เสื้อตัวเดียวกัน ชายคนนั้นบอกว่าธนาคารจดทุกเรื่องไว้ ยกเว้นเรื่องที่คนอื่นจำได้ แล้ววางถุงเหรียญผ้าเทาไว้บนฝาหีบ ถามว่าครูดนตรีที่ไม่มีบ้านให้ภักดีแล้วจำอะไรได้บ้าง

        {name}หยิบถุงคืนใส่มือเขา บอกว่าจำได้แต่เพลง แล้วฮัมเพลงพ่อค้าที่ขายเสียงตัวเองให้ปีศาจให้ฟังท่อนหนึ่ง ห้องเช่าริมคลองที่{name}ย้ายไปอยู่มีหน้าต่างบานเดียว มองเห็นหลังคาบ้านขุนนางที่ร้องเพลงมาทั้งชีวิต
      effects: { gold: 6, reputation: { belek_bank: -1 }, flags: [retired, refused_the_grey_coat] }
