# วัยหนุ่มสาว 15–17 ทางนักเวท (class: wizard)
# สองเรื่องแรกใช้ได้ทุกทาง ไม่ระบุถิ่น "ครู" ใช้แทนอาจารย์ของทุกทาง
# ราคาของเวทวิชาตามคัมภีร์: ใช้เกินตัวแล้วเลือดกำเดาไหล และฝันถึงสิ่งที่ไม่ควรรู้ / ความรู้ไม่มีเจ้าของตั้งแต่อัสเทลตาย
# youth.wizard_listeners_card เฉพาะนักเวทในเวนทราสที่ไม่ใช่ทีฟลิ่ง (ผู้ฟังดาวล่าทีฟลิ่ง และดาวเข้าไม่ถึงคนมีตรามาร)
# youth.wizard_whose_idea ไม่ใช้กับคนนับดาว เพราะงานนั้นไม่ได้พันขด
# youth.wizard_enemy_arm ต้องมีปี 301 ขึ้นไป (หลังสงครามถ่าน)

- id: youth.wizard_nosebleed
  stage: youth
  weight: 30
  when:
    age: [15, 16]
    class: wizard
  text: |
    งานชิ้นแรกที่ครูให้ทำคนเดียวเป็นงานเล็ก เล็กจนครูบอกงานแล้วก็ออกไปกินข้าวโดยไม่หันกลับมาดู แต่ต้องเสร็จก่อนเช้า และขั้นสุดท้ายต้องใช้เวท ไม่ใช่ใช้มือ

    {name}ทำมาตั้งแต่หัวค่ำ เทียนหมดไปสองเล่ม ตอนเที่ยงคืนเหลือแค่ขั้นสุดท้าย ขั้นที่ครูบอกไว้ตั้งแต่วันแรกว่าอย่าทำตอนเหนื่อย

    {name}ลองครั้งแรก ไม่ติด ลองครั้งที่สอง ติดครึ่งเดียว ครั้งที่สามรู้สึกเหมือนมีใครเอานิ้วกดหลังตาไว้ทั้งสองข้าง แล้วก็มีอะไรอุ่นๆ ไหลลงมาที่ริมฝีปาก หยดลงบนโต๊ะ สีแดง
  choices:
    - id: push_through
      label: เช็ดเลือดแล้วทำต่อจนเสร็จ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ครั้งที่สี่ติด {name}รู้ตั้งแต่ก่อนลืมตา เพราะเสียงในหัวเงียบลงทันทีเหมือนมีคนปิดประตู งานเสร็จสวยกว่าที่ครูทำให้ดูเป็นตัวอย่าง เลือดกำเดาหยุดเองตอนตีสาม

          คืนนั้น{name}ฝันถึงห้องที่ไม่มีมุม ผนังทุกด้านเขียนอะไรไว้เต็มด้วยลายมือของตัวเอง เขียนเรื่องที่{name}ไม่รู้ ตื่นมาจำได้แค่ว่าลายมือเป็นของตัวเอง กับรู้สึกว่าเกือบอ่านออกแล้ว
        effects: { stats: { INT: 1 }, world: { star: 1 }, flags: [first_nosebleed, dreamed_cornerless_room] }
      failure:
        text: |
          ครั้งที่สี่ไม่ติด ครั้งที่ห้า{name}ไม่รู้ว่าลองหรือเปล่า เพราะจำได้อีกทีก็ตอนนอนอยู่บนพื้น แก้มแนบกับเศษงานที่แตกเป็นสามท่อน เลือดแห้งติดคางเป็นคราบ

          ครูกลับมาตอนเช้า ก้มดูเศษงาน ดูหน้า{name} แล้วเดินไปเปิดหน้าต่างให้ลมเข้า แกไม่ดุ บอกแค่ว่าวันนี้ไม่ต้องทำอะไร แล้วเอาเศษงานทั้งสามท่อนไปวางเรียงไว้บนหิ้ง ตรงที่{name}ต้องเห็นทุกวัน
        effects: { stats: { INT: 1 }, hp: -2, flags: [first_nosebleed] }
    - id: stop_and_sleep
      label: วางมือ ไปล้างหน้า แล้วนอน
      text: |
        {name}ล้างเลือดออกจากหน้า เอาผ้าเปียกพาดคอ แล้วล้มตัวลงนอนทั้งที่งานยังวางอยู่บนโต๊ะ หลับไปทั้งที่คิดว่าจะหลับไม่ลง

        ตื่นมา ครูนั่งอยู่ที่โต๊ะ กำลังทำขั้นสุดท้ายให้ดูช้าๆ ทีละจังหวะ แกไม่ได้หันมาพูดอะไร แต่ทำช้ากว่าที่แกทำได้จริงหลายเท่า ช้าพอให้{name}ที่ยังนอนอยู่มองเห็นทุกจังหวะ
      effects: { stats: { CON: 1 }, flags: [first_nosebleed] }
    - id: wake_teacher
      label: ไปเคาะประตูปลุกครู
      text: |
        ครูเปิดประตูออกมาในชุดนอน เห็นเลือดแล้วไม่ตกใจ ยิ้มด้วยซ้ำ แกพา{name}ไปนั่ง เอาผ้าชุบน้ำเย็นมาพาดต้นคอ บอกให้ก้มหน้า อย่าเงย

        ระหว่างรอเลือดหยุด แกเล่าว่าเลือดกำเดาครั้งแรกของแกออกตอนอายุสิบสี่ ตอนนั้นแกไม่ได้ปลุกใคร ทำต่อจนเสร็จ แล้วนอนไข้ไปเจ็ดวัน ฝันเรื่องเดียวกันทั้งเจ็ดคืน แกไม่เล่าว่าฝันเรื่องอะไร
      effects: { stats: { INT: 1 }, alignment: { law: 1 }, flags: [first_nosebleed, teacher_knows_limit] }

- id: youth.wizard_whose_idea
  stage: youth
  weight: 30
  when:
    age: [16, 17]
    class: wizard
    not_flags: [path_star_counter]
  text: |
    ปีที่สาม{name}คิดออกเรื่องหนึ่ง วิธีพันขดน้ำค้างดาวแบบใหม่ พันกลับทางทุกเจ็ดรอบ ขดที่พันแบบนี้รั่วน้อยลงเกือบครึ่ง ทั้งที่ช่างทุกคนพันแบบเดิมกันมาหลายสิบปี {name}คิดออกตอนกำลังจะหลับ ลุกขึ้นมาลองพันทั้งที่ยังมืด แล้วก็ใช้ได้จริง

    ครูดูอยู่นาน ดูซ้ำสามรอบ แล้วบอกว่าเรื่องนี้ต้องให้คนที่จ่ายค่าข้าวค่าที่นอนรู้ ไม่กี่วันต่อมามีคนแต่งตัวดีมาขอดู เขาดูแค่รอบเดียวก็เข้าใจ แล้วถามว่า{name}เขียนไว้ที่ไหนบ้าง เล่าให้ใครฟังไปแล้วบ้าง
  choices:
    - id: hand_it_over
      label: เขียนให้ทั้งหมด ให้เขาเอาไป
      text: |
        {name}เขียนทั้งคืน วาดรูปประกอบสามหน้า คนแต่งตัวดีอ่านจบแล้วพับใส่ซองหนัง ยื่นถุงเงินให้ถุงหนึ่ง หนักกว่าค่าแรงครึ่งปี

        อีกหลายเดือนต่อมา วิธีของ{name}ไปถึงที่อื่นแล้ว มีคนเล่าให้ฟังว่าช่างทุกที่เริ่มพันขดแบบนี้กันหมด ชื่อที่ติดอยู่กับวิธีนี้เป็นชื่อของคนอื่น {name}ไม่รู้จักชื่อนั้น
      effects: { stats: { INT: 1 }, gold: 10, flags: [sold_first_idea] }
    - id: keep_in_head
      label: บอกว่าจำได้ไม่หมด ไม่ได้เขียนไว้ที่ไหน
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          {name}ทำหน้าเหมือนคนที่เพิ่งรู้ตัวว่าทำของหาย บอกว่าคืนนั้นลองไปเรื่อยๆ จนบังเอิญได้ ถ้าให้ทำใหม่คงต้องลองอีกหลายเดือน คนแต่งตัวดีมองครูที่ยืนอยู่ข้างหลัง ครูยักไหล่

          เขากลับไปมือเปล่า บอกว่าถ้านึกออกให้ส่งข่าวไป {name}ไม่เคยส่งข่าวไปเลย วิธีนั้นอยู่ในหัว{name}คนเดียว ใช้เฉพาะตอนที่ไม่มีใครดู
        effects: { stats: { INT: 1, CHA: 1 }, flags: [kept_first_idea] }
      failure:
        text: |
          คนแต่งตัวดีไม่เชื่อ เขาขอดูที่นอนของ{name} ขอดูกล่องเครื่องมือ แล้วก็เจอเศษกระดาษที่{name}ขีดไว้ตอนเช้ามืดวันนั้นซุกอยู่ใต้หมอน เขาอ่าน ยิ้ม แล้วพับใส่ซองหนังไปเลย ไม่จ่ายอะไรสักเหรียญ

          ก่อนออกไป เขาบอกครูว่าศิษย์คนนี้โกหกไม่เก่ง ควรฝึก ครูไม่ตอบ
        effects: { stats: { INT: 1 }, flags: [idea_taken] }
    - id: give_away
      label: สอนทุกคนที่ทำงานข้างๆ ก่อนเขาจะมาเอาไป
      text: |
        {name}สอนทุกคนที่ทำงานอยู่ใกล้ๆ แล้วพวกนั้นก็ไปสอนคนที่รู้จักต่อ ไม่ถึงเจ็ดวัน ช่างทุกคนแถวนั้นพันขดแบบใหม่เป็นกันหมด บางคนพันได้เร็วกว่า{name}ด้วย

        คนแต่งตัวดีกลับมาตามนัด เห็นทุกคนพันขดแบบเดียวกันก็ยืนนิ่งไปครู่ใหญ่ แล้วเดินออกไปโดยไม่พูดอะไร ครูเรียก{name}ไปนั่งคุย บอกว่าทำแบบนี้ไม่มีใครได้เงินสักคน {name}บอกว่าทุกคนได้เลิกงานเร็วขึ้น ครูหัวเราะจนต้องไปปิดประตู
      effects: { stats: { CHA: 1 }, alignment: { moral: 1, law: -1 }, flags: [gave_idea_away] }

- id: youth.wizard_listeners_card
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    class: wizard
    location_tag: ventras
    not_flags: [race_tiefling]
  text: |
    เย็นวันหนึ่งหลังเลิกงาน มีคนยื่นบัตรกระดาษหนาให้{name}ที่หน้าประตู หมึกสีน้ำเงิน ลายมือสวย เขียนแค่ร้านกาแฟร้านหนึ่งริมถนนสายตะเกียง กับวันอัสเทล วันที่ไม่มีใครทำงาน

    คนยื่นเป็นชายหนุ่มผมหวีเรียบ เสื้อดีกว่าเสื้อทุกตัวที่{name}มี พูดเหมือนรู้จักกันมาก่อน เขาบอกว่าเคยเห็นงานของ{name} วงของเขามีแต่คนที่อยากรู้ว่าทำไมดาวดวงใหม่ให้น้ำค้าง แต่ดาวเก่าไม่ให้อะไรเลย ไม่มีค่าเข้า ไม่มีใครบังคับให้กลับมาอีก
  choices:
    - id: go_once
      label: ไปดูสักครั้ง
      check: { stat: WIS, dc: 13, foe: star }
      success:
        text: |
          ร้านกาแฟชั้นบนมีคนนั่งอยู่สิบกว่าคน อ่านหนังสือของอาจารย์โอเดล คอร์ดิส ผลัดกันทีละหน้า แล้วคุยกันเรื่องเปลือกฟ้าเหมือนคุยเรื่องกำแพงบ้านที่ร้าว พูดกันดีทุกคน ไม่มีใครขึ้นเสียง

          ใกล้เที่ยงคืน ทุกคนหันเก้าอี้ไปทางหน้าต่าง หน้าต่างบานนั้นหันไปทางกลุ่มดาวใหม่พอดี {name}มองไปได้ครู่หนึ่งก็รู้สึกเหมือนตอนเด็กที่เห็นคนแปลกหน้ายืนมองบ้านจากอีกฝั่งถนน จึงก้มลงมองถ้วยกาแฟของตัวเอง แล้วลุกออกมาก่อนคนอื่น ระหว่างลงบันได{name}เพิ่งสังเกตว่าทั้งห้องฮัมเสียงเดียวกันอยู่ตลอดเวลา ไม่มีใครรู้ตัว
        effects: { stats: { WIS: 1 }, flags: [visited_listeners] }
      failure:
        text: |
          ใกล้เที่ยงคืน ทุกคนหันเก้าอี้ไปทางหน้าต่าง {name}มองตามไป แล้วก็ละสายตาไม่ได้ ดาวดวงใหม่ดวงหนึ่งไม่ได้อยู่ไกลอย่างที่ดาวควรอยู่ มันอยู่ใกล้ ใกล้จนรู้ว่ามันก็กำลังมองอยู่เหมือนกัน

          ชายหนุ่มผมหวีเรียบเป็นคนแตะไหล่ให้{name}รู้ตัว ตอนนั้นเลือดกำเดาไหลลงมาถึงคางแล้ว เขายื่นผ้าเช็ดหน้าปักชื่อร้านให้ บอกว่าครั้งแรกเป็นแบบนี้ทุกคน วันอัสเทลหน้าจะดีขึ้น
        effects: { stats: { WIS: 1 }, hp: -1, world: { star: 1 }, reputation: { star_listeners: 1 }, flags: [visited_listeners, looked_back_at] }
    - id: show_teacher
      label: เอาบัตรไปให้ครูดู
      text: |
        ครูพลิกบัตรดูด้านหน้า ด้านหลัง แล้วเก็บใส่กระเป๋าเสื้อตัวเอง บอกว่าจะจัดการให้ ไม่ต้องห่วง แล้วถามเรื่องงานต่อเหมือนไม่มีอะไรเกิดขึ้น

        วันอัสเทลถัดมา{name}ออกไปซื้อเทียนตอนเย็น แล้วเห็นครูเดินอยู่ปลายถนนสายตะเกียง เสื้อตัวที่ดีที่สุด ผมหวีเรียบ เลี้ยวเข้าร้านกาแฟร้านนั้นเหมือนคนที่เดินมาทางนี้จนเท้าจำทางได้
      effects: { stats: { INT: 1 }, flags: [teacher_at_listeners] }
    - id: tear_card
      label: ฉีกบัตรทิ้งตรงนั้น
      text: |
        {name}ฉีกบัตรเป็นสองชิ้นต่อหน้าเขา ชายหนุ่มไม่โกรธ ยิ้มเหมือนเห็นเด็กเล็กทำของเล่นหล่น แล้วบอกว่าไม่เป็นไร ไม่มีใครบังคับ

        สัปดาห์ต่อมามีบัตรใบใหม่สอดอยู่ใต้ประตูห้องนอน ลายมือเดิม หมึกสีเดิม วันเดิม {name}ไม่รู้ว่าเขารู้ได้อย่างไรว่าห้องไหน
      effects: { stats: { WIS: 1 }, alignment: { law: 1 }, flags: [refused_listeners] }

- id: youth.wizard_enemy_arm
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    year: [301, 317]
    flags: [path_arm_smith]
  text: |
    ลูกค้าคนแรกที่ป้าให้{name}วัดแขนเองเป็นทหารผ่านศึกอาร์เวล แขนขวาขาดเหนือศอก ปลายแขนเป็นแผลเป็นเรียบนูน เขาพูดภาษาคนแคระได้สามคำ ขอบคุณ ราคาเท่าไหร่ กับอีกคำที่ทหารอาร์เวลทุกคนเรียนมาจากสนามรบ คำที่แปลว่ายอมแพ้

    ระหว่างวัดแขน เขาเล่าว่าเสียแขนที่ช่องเขาชั้นสี่ ปีสุดท้ายของสงครามถ่าน {name}รู้จักชื่อช่องเขานั้น เพราะบนกำแพงห้องโถงของตระกูล ชื่อลุงคนหนึ่งสลักอยู่คู่กับชื่อช่องเขาเดียวกัน ปีเดียวกัน

    เขาจ่ายเงินมัดจำครบ แล้วถามว่าแขนจะเสร็จเมื่อไหร่
  choices:
    - id: best_arm
      label: ทำแขนให้ดีที่สุดเท่าที่ทำได้ ขยับนิ้วได้ทุกข้อ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ทำอยู่สองเดือน อดนอนเกินกว่าที่ป้ายอมให้ สายเอ็นทองเหลืองสิบสี่เส้น ข้อต่อนิ้วสิบห้าข้อ ทุกข้อขัดจนลื่นด้วยมือ ป้ามาดูทุกคืน ไม่พูดอะไร แต่คืนสุดท้ายแกตะไบข้อต่อนิ้วโป้งให้ใหม่เองหนึ่งข้อ

          ตอนใส่แขน ทหารผ่านศึกขยับนิ้วทีละนิ้ว ช้าๆ แล้วยกมือเหล็กขึ้นมาแตะหน้าตัวเองเหมือนจำไม่ได้ว่าหน้ามีกี่ส่วน เขาพูดคำที่สี่เป็นภาษาคนแคระ คำที่{name}ไม่รู้ว่าเขาไปเรียนมาจากไหน คำที่คนแคระพูดตอนวางมือบนทั่ง
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [made_arm_for_enemy] }
      failure:
        text: |
          นิ้วทุกนิ้วขยับได้ แต่ขยับพร้อมกันหมด จะงอนิ้วชี้ก็งอทั้งห้านิ้ว {name}แกะออกมาทำใหม่สองรอบ จนเลยวันที่สัญญาไว้

          ทหารผ่านศึกมาตามนัดทุกครั้ง นั่งรออย่างอดทน ครั้งที่สามป้าทำต่อให้จนเสร็จ ตอนส่งแขน เขาขอบคุณป้าเป็นภาษาคนแคระ แล้วหันมาขอบคุณ{name}อีกครั้ง เหมือนรู้ว่าใครนั่งทำมาสองเดือน
        effects: { stats: { INT: 1, DEX: 1 }, flags: [made_arm_for_enemy] }
    - id: plain_hook
      label: ทำตามราคาที่เขาจ่าย ขอเหล็กกับสายหนัง ไม่มากไม่น้อย
      text: |
        ขอเหล็กอันนั้นเสร็จในสามวัน แข็งแรง ใช้งานได้ ทาน้ำมันกันสนิมสองชั้น แบบที่ช่างทุกคนในโรงทำให้ทหารอาร์เวลทุกคนที่จ่ายเงินแค่นี้

        ทหารผ่านศึกลองหิ้วถังน้ำ ลองเกี่ยวประตู แล้วจ่ายส่วนที่เหลือครบ เขาพูดคำว่าขอบคุณเป็นภาษาคนแคระ {name}พยักหน้ารับ เรื่องลุงบนกำแพง{name}ไม่ได้พูด และเขาก็ไม่ได้ถาม
      effects: { gold: 4, alignment: { law: 1 }, flags: [made_plain_hook] }
    - id: tell_name
      label: บอกเขาว่าลุงของ{name}ตายที่ช่องเขาเดียวกัน
      text: |
        ทหารผ่านศึกนิ่งไปนานจนสายวัดในมือ{name}หย่อนลงพื้น แล้วเขาก็ถามชื่อลุง {name}บอก เขาพูดตามช้าๆ สามครั้ง จนออกเสียงถูก

        แขนเสร็จตามกำหนด ทุกครั้งที่เขามาให้ซ่อมข้อต่อ เขาจะพูดชื่อนั้นตอนเดินเข้าประตูโรง เหมือนเป็นคำทักทาย ป้าบอก{name}ว่าทหารอาร์เวลที่มาโรงนี้มีเป็นร้อย ไม่เคยมีใครทำแบบนี้
      effects: { stats: { CHA: 1 }, flags: [named_uncle_to_veteran] }

- id: youth.wizard_star_count
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    flags: [path_star_counter]
  text: |
    ปีกลายช่องฟ้าทางตะวันตกที่{name}ได้นับมียี่สิบสามดวง คืนแรกของฤดูนับปีนี้{name}นับได้ยี่สิบสาม คืนที่สองยี่สิบสาม คืนที่สามนับได้ยี่สิบห้า

    นับใหม่ ยี่สิบห้า นับใหม่จากมุมล่าง ยี่สิบห้า ดวงที่เกินมาสองดวงอยู่ชิดกันตรงมุมขวาบนของตาราง สว่างน้อยกว่าดวงอื่น แต่นิ่งกว่า ไม่กะพริบเลยสักครั้ง

    ยิ่งมองนาน{name}ก็ยิ่งรู้สึกว่าสองดวงนั้นอยู่ใกล้กว่าดวงอื่นในช่อง ใกล้จนไม่ใช่ระยะที่ดาวควรอยู่
  choices:
    - id: record_true
      label: จดยี่สิบห้าลงสมุด แล้วเอาไปให้ผู้คุมหอดู
      text: |
        {name}อ่านตัวเลขให้ผู้คุมหอฟัง แกเงียบไปนาน แล้วให้{name}เปิดสมุดย้อนไปหน้าที่ช่องนี้นับได้สิบสี่ หน้าแรกของคนแรก แกลูบหน้านั้นอยู่พักหนึ่ง แล้วให้พลิกกลับมาหน้าปัจจุบัน

        คืนนั้นแกเขียนจดหมายถึงเวนทราส ฉบับที่เขียนทุกปี ปีนี้เพิ่มบรรทัดหนึ่งเรื่องช่องตะวันตก กับชื่อ{name}ในฐานะคนนับ แกบอกว่าปีหน้าคำตอบก็คงเหมือนเดิม แต่อย่างน้อยชื่อ{name}ก็จะอยู่ในลิ้นชักของใครสักคนในเมืองหลวง
      effects: { stats: { INT: 1 }, alignment: { law: 1 }, reputation: { star_hall: 1 }, flags: [counted_two_new] }
    - id: keep_looking
      label: นั่งมองสองดวงนั้นต่อจนเช้า ดูว่ามันทำอะไร
      check: { stat: WIS, dc: 13, foe: star }
      success:
        text: |
          สองดวงนั้นไม่ทำอะไรเลย ไม่เคลื่อน ไม่กะพริบ ไม่หรี่ แต่พอใกล้สาง {name}เริ่มรู้ว่าทุกครั้งที่ตัวเองหายใจออก มันก็นิ่งขึ้นอีกนิด เหมือนคนที่กลั้นหายใจรอฟังเสียง {name}หลับตาลงก่อนจะรู้ว่ามันรออะไร แล้วนั่งหลับตาอยู่อย่างนั้นจนแดดอุ่นขึ้นบนหน้า

          ตอนลงจากหอ{name}ไม่ได้เล่าให้ใครฟัง แต่ในสมุดของตัวเอง ใต้ตัวเลขยี่สิบห้า มีอีกบรรทัดที่เขียนว่า อย่ามองนานกว่าหนึ่งลมหายใจ
        effects: { stats: { WIS: 1 }, flags: [counted_two_new, felt_looked_at] }
      failure:
        text: |
          {name}มองจนตาแห้ง แล้วก็ยังมองต่อ จนไม่แน่ใจว่าตัวเองนั่งอยู่บนหอหรือนอนหงายอยู่ใต้อะไรบางอย่างที่กำลังก้มลงมาดู ตอนเช้าผู้คุมหอขึ้นมาเรียกชื่อ{name}สามครั้ง {name}ถึงขาน

          สามคืนต่อมา หลับตาลงทีไร สองจุดนั้นก็ยังอยู่ตรงมุมขวาบนของความมืดหลังเปลือกตา
        effects: { stats: { WIS: 1 }, hp: -1, world: { star: 1 }, flags: [counted_two_new, stared_at_new_stars] }
    - id: wait_a_night
      label: ยังไม่จดอะไร รอนับใหม่คืนพรุ่งนี้
      text: |
        คืนต่อมาเมฆลงมาคลุมป่า ห้าคืนติดกันไม่มีใครนับอะไรได้ {name}ขึ้นหอทุกคืนตามเวลา นั่งมองเมฆ แล้วลงมา

        คืนที่หกฟ้าเปิด {name}นับใหม่ตั้งแต่มุมล่าง นับช้าๆ ทีละดวง ทั้งที่รู้อยู่แล้วว่าจะได้เท่าไหร่ ยี่สิบห้า ตอนจดลงสมุด มือไม่สั่นเหมือนที่กลัวไว้
      effects: { stats: { INT: 1, CON: 1 }, flags: [counted_two_new] }
