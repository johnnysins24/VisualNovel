# ชุด 3 อายุ 41 ถึง 64: ขั้นงานของช่างตีเหล็ก ช่างกิ่ง พ่อค้า เสมียนวิหารเบเลค งานละสามเรื่อง
# ขั้นกลาง (41–48) ขั้นสูง (49–56) วันวางมือ (57–64)
# วันวางมือ: ทุกตัวเลือกตั้ง retired หรือ still_working อย่างใดอย่างหนึ่ง กับ flag เฉพาะของตัวเลือก

# ---------- ช่างตีเหล็ก ----------
- id: adult.career_smith_grey_grain
  stage: adult
  weight: 45
  scene: smithy
  when:
    age: [41, 48]
    flags: [job_smith]
  text: |
    ข้อต่อแขนกลที่ร้านของ{name}ตีด้วยมือขายข้อละสามเหรียญ ปีนี้โรงหล่อแห่งหนึ่งในเวนทราสอัดข้อต่อแบบเดียวกันออกจากแท่นเหล็กได้วันละสองร้อยข้อ ข้างข้อตอกตรารูปฟันเฟือง ขายข้อละเหรียญเดียว ลูกค้าข้อต่อของร้านเหลือแต่คนรุ่นเก่าที่ไม่ไว้ใจของที่ไม่มีใครตี

    เช้าวันหนึ่งหญิงคนหนึ่งหอบแขนกลของสามีมาวางบนทั่ง แขนพับผิดทางตรงข้อศอก ข้อต่อตราฟันเฟืองแยกเป็นสองซีก นางเล่าว่าเขายกลังขึ้นเกวียน แขนพับลงพร้อมลัง ลังหล่นทับเท้าจนนิ้วแหลกไปสองนิ้ว นางมีเงินสองเหรียญ ถามว่าพอสำหรับข้อที่ไม่หักไหม

    {name}หยิบซีกหนึ่งขึ้นมา หันหน้าหักเข้าหาแสงเตา เม็ดหยาบสีเทาอัดกันอยู่ตรงกลาง ผิวนอกเรียบและแข็ง เหล็กที่จุ่มน้ำเร็วไปครึ่งจังหวะ มือขวาที่ถืออยู่สั่นนิดๆ ช่วงหลังนี้เป็นแบบนี้ทุกเช้า จนกว่าเตาจะร้อนและมือจะร้อนตาม
  choices:
    - id: forge_her_one
      label: ตีข้อใหม่ให้นางหนึ่งข้อ รับแค่สองเหรียญที่นางมี
      habit: craft_hands
      text: |
        {name}รอจนสายให้มือหายสั่น แล้วตีข้อต่อใหม่จากเหล็กแท่งเดียวกับที่ใช้ตีคันไถ จุ่มน้ำตรงจังหวะ ตะไบร่องเดือยให้แขนพับได้ทางเดียว ค่าเหล็กเหรียญครึ่ง ค่าถ่านกับเวลาอีกครึ่งวัน นางวางสองเหรียญบนทั่ง {name}รับไว้ทั้งสองเหรียญ

        สิ้นเดือนนางกลับมาที่ร้านพร้อมผู้ชายสามคนจากถนนเดียวกัน แต่ละคนถอดแขนกลวางเรียงบนม้านั่งหน้าร้าน ข้อศอกทุกข้อมีตรารูปฟันเฟือง
      effects: { gold: 1, alignment: { moral: 1 }, flags: [forged_at_her_price] }
    - id: to_the_foundry
      label: หอบข้อต่อสองซีกไปถึงโรงหล่อที่ตอกตรานั้น ขอพบคนคุมบ่อน้ำ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          คนคุมบ่อน้ำเป็นชายหนุ่มเขม่าเปื้อนแขนถึงไหล่ เขาจุ่มข้อต่อลงบ่อตามเสียงระฆังของแท่นอัด ระฆังดังหนึ่งครั้ง ข้อต่อสิบข้อลงบ่อ ระฆังดังอีกครั้ง ยกขึ้น {name}ยื่นซีกที่แตกให้เขาดู แล้วขอยืนนับข้างบ่อหนึ่งรอบ ระฆังดังเร็วกว่าที่เหล็กหนาขนาดนี้ต้องการ ครึ่งจังหวะพอดี

          เขาไปบอกนายโรงหล่อเอง โรงหล่อตีระฆังช้าลง อัดข้อต่อได้วันละร้อยหกสิบข้อแทนสองร้อย นายโรงหล่อส่งคนเอาเงินมาให้{name}สี่เหรียญเป็นค่าคำแนะนำ พร้อมขอว่าอย่าเล่าเรื่องระฆังให้ใครฟัง
        effects: { stats: { INT: 1 }, gold: 4, flags: [slowed_the_foundry_bell] }
      failure:
        text: |
          นายโรงหล่อไม่ให้{name}เข้าไปถึงบ่อน้ำ เขารับซีกที่แตกไปชั่งในมือ แล้วโยนลงถังเศษเหล็กข้างประตู บอกว่าข้อละเหรียญเดียวก็ได้ของข้อละเหรียญเดียว ใครอยากได้ข้อที่ไม่หักก็ไปซื้อข้อละสามเหรียญจากร้านแบบร้านของ{name}

          ร้านปิดไปหลายวันระหว่างที่{name}เดินทางไปกลับ งานคันไถสองงานไปลงร้านอื่น
        effects: { gold: -3, flags: [foundry_threw_it_away] }
    - id: bend_every_arm
      label: เดินบอกทุกบ้านในถิ่นที่มีคนใส่แขนกล ให้เอาข้อศอกมาให้ร้านดัดลองโดยไม่คิดเงิน
      check: { stat: STR, dc: 13 }
      success:
        text: |
          สิบวันแรกมีแขนกลมาวางที่ร้านสี่สิบแขน {name}คลายข้อศอกออกทีละข้อ หนีบเข้าปากกาจับเหล็ก ดัดไปจนสุดทางแล้วดัดกลับ ข้อที่ดีงอตามแล้วคืนรูป ข้อที่จุ่มน้ำเร็วไปมีรอยร้าวเส้นผมโผล่ขึ้นมาตรงกลางตั้งแต่ครั้งที่สาม ข้อตราฟันเฟืองร้าวสิบเอ็ดข้อ

          {name}ตีข้อใหม่ให้ทั้งสิบเอ็ดข้อ คิดแค่ค่าเหล็ก ปลายเดือนแขนทั้งสองข้างล้าจนยกช้อนไม่ขึ้น เช้าวันต่อมามือขวาสั่นน้อยลง
        effects: { stats: { STR: 1 }, gold: -2, flags: [tested_the_district_arms] }
      failure:
        text: |
          ข้อที่สิบเจ็ดแตกตอนดัดกลับ เสียงดังเหมือนกิ่งไม้แห้งหัก เศษเหล็กชิ้นเท่าเล็บดีดขึ้นมาฝังที่สันมือขวาของ{name} มือที่สั่นอยู่แล้วจับปากกาจับเหล็กไม่แน่นพอตั้งแต่ข้อแรก

          {name}ต้องพันมือไปทั้งเดือน แขนกลอีกยี่สิบกว่าแขนวางรออยู่บนม้านั่งหน้าร้าน จนเจ้าของทยอยมาเอากลับไปใส่ตามเดิม
        effects: { hp: -2, flags: [shard_in_the_hand] }
    - id: twenty_twists
      label: บอกช่างทุกร้านในถิ่นถึงวิธีเดียวที่จะเจอเม็ดหยาบตรงกลาง บิดกลับไปกลับมายี่สิบครั้ง
      requires: { flag: weak_shackles }
      text: |
        แท่นอัดของโรงหล่อลองข้อต่อด้วยการกดครั้งเดียว คีมของเสมียนศาสนจักรก็บิดตรงๆ ครั้งเดียว {name}รู้ดีกว่าใครว่าเหล็กที่จุ่มน้ำเร็วไปครึ่งจังหวะผ่านการลองแบบนั้นได้ทุกครั้ง เพราะ{name}เคยตั้งใจทำให้ผ่าน เย็นนั้น{name}เดินไปทุกร้านบนถนนตีเหล็ก ยื่นข้อต่อซีกที่แตกให้ดู แล้วสอนวิธีบิดยี่สิบครั้ง ไม่บอกว่ารู้มาจากไหน

        ฤดูนั้นช่างในถิ่นส่งข้อต่อตราฟันเฟืองคืนโรงหล่อไปสามลัง ฤดูต่อมา เสมียนของศาสนจักรตะเกียงที่เดินถนนตีเหล็กทุกฤดูก็รู้วิธีนี้แล้ว เขายืนบิดกุญแจมือคู่หนึ่งไปกลับอยู่หน้าร้านร้านหนึ่ง นับเสียงดังทีละครั้ง ช่างทั้งถนนได้ยิน
      effects: { stats: { WIS: 1 }, flags: [taught_the_twenty_twists] }

- id: adult.career_smith_stamp
  stage: adult
  weight: 45
  scene: smithy
  when:
    age: [49, 56]
    flags: [job_smith]
  text: |
    ตราร้านของ{name}เป็นแท่งเหล็กยาวเท่าฝ่ามือ ปลายสลักรูปทั่งเล็กๆ ตอกลงบนงานทุกชิ้นที่ออกจากร้าน ชิ้นที่จะได้ตราต้องผ่านการเคาะฟังเสียงของ{name}ก่อน ช่วงหลังมือขวาสั่นจนตอกตราไม่ลงกลางรอย ลูกมือคนโตจึงเป็นคนตอกแทน หลังจาก{name}เคาะฟังทีละชิ้น

    ร้านโกเลมในถิ่นส่งข้อเข่าคืนมาหนึ่งข้อ แตกกลางเดือย ตราของร้าน{name}อยู่ข้างข้อ ชัดทุกเส้น คนของร้านโกเลมเล่าว่าโกเลมขนถ่านตัวหนึ่งเข่าทรุดกลางลาน ล้มทับขาคนงานจนหักสองท่อน ร้านโกเลมจ่ายค่าหมอไปแล้วแปดเหรียญ อยากรู้ว่าร้านของ{name}จะว่าอย่างไร

    ข้อเข่าชุดนั้นออกจากร้านในสัปดาห์ที่{name}นอนจับไข้อยู่ข้างบน ลูกมือคนเล็กสุด เด็กหนุ่มที่เพิ่งมาได้ปีเดียว ตีเองและตอกตราเอง เพราะร้านโกเลมเร่งของ ตอนนี้เขายืนอยู่หลังเตา มือกำผ้าเช็ดเหงื่อจนบิดเป็นเกลียว
  choices:
    - id: pay_and_keep_him
      label: จ่ายค่าหมอคืนร้านโกเลมทั้งแปดเหรียญ แล้วเก็บเด็กไว้
      text: |
        {name}นับแปดเหรียญใส่มือคนของร้านโกเลม บอกว่าตราร้านอยู่บนข้อ ร้านก็จ่าย เขานับซ้ำแล้วกลับไป ไม่ได้ถามว่าใครตี

        เด็กหนุ่มคนนั้นตีข้อเข่าใหม่ทุกเย็นหลังร้านปิดอยู่ทั้งเดือน ตีเสร็จก็เอามาวางให้{name}เคาะฟัง {name}โยนลงกองเศษเหล็กไปยี่สิบเจ็ดข้อ ข้อที่ยี่สิบแปด{name}เคาะแล้ววางกลับบนทั่ง เด็กยืนรอ {name}บอกว่ายังตอกตราไม่ได้ แต่ข้อนี้ใช้ได้
      effects: { gold: -8, alignment: { moral: 1 }, flags: [paid_for_the_stamp] }
    - id: name_the_boy
      label: บอกร้านโกเลมว่าเด็กคนนั้นตีเองและตอกตราเอง โดยที่{name}ไม่รู้
      text: |
        คนของร้านโกเลมจดชื่อเด็กลงสมุด ร้านของ{name}ไม่ต้องจ่ายสักเหรียญ ฤดูต่อมาร้านโกเลมยังสั่งข้อเข่าเหมือนเดิม แต่ส่งคนมายืนดูตอนตอกตราทุกครั้ง

        เด็กหนุ่มเก็บของออกไปในเย็นวันเดียวกัน ร้านโกเลมทุกร้านในถิ่นมีชื่อเขาอยู่ในสมุด ได้ข่าวว่าเขาไปแบกถ่านอยู่โรงกลั่น
      effects: { alignment: { law: 1, moral: -1 }, flags: [named_the_apprentice] }
    - id: reforge_the_set
      label: ตีข้อเข่าชุดนั้นใหม่ทั้งชุดด้วยมือตัวเอง ตอกตราเองทุกข้อ แทนเงินค่าหมอ
      check: { stat: CON, dc: 14 }
      success:
        text: |
          ข้อเข่าชุดนั้นมีสิบสองข้อ {name}ตื่นก่อนสางทุกวัน แช่มือขวาในน้ำอุ่นจนนิ้วคลาย แล้วตีตอนที่มือนิ่งที่สุดของวัน วันละข้อ เคาะฟังเอง ตอกตราเอง ข้อไหนตราเบี้ยวเพราะมือสั่น{name}โยนกลับเข้าเตาทั้งข้อ

          ข้อที่สิบสองเสร็จในวันที่สิบเก้า คนของร้านโกเลมรับไปโดยไม่ทวงค่าหมออีก ฤดูต่อมาเขาสั่งข้อเข่าเพิ่มเป็นสองเท่า และขอให้ตอกตราแบบเดิม ตราที่เอียงไปทางซ้ายนิดหนึ่งทุกข้อ
        effects: { stats: { CON: 1 }, flags: [reforged_the_knee_set] }
      failure:
        text: |
          ข้อที่หกตีไม่ทันเย็น ข้อที่เจ็ด{name}ตีทั้งคืน เช้ามืดเข่าของ{name}เองทรุดลงข้างทั่ง คีมหลุดมือ เหล็กแดงตกลงข้างเท้า ไหม้หลังเท้าซ้ายเป็นแผลยาว

          ร้านโกเลมรอได้แค่สิบวัน แล้วส่งคนมาเก็บค่าหมอครึ่งหนึ่ง ข้อเข่าหกข้อที่ตีเสร็จยังวางอยู่บนชั้นในร้าน ตราตรงทุกข้อ
        effects: { hp: -2, gold: -4, flags: [knee_set_half_done] }
    - id: count_with_tofra
      label: ให้ทอฟรายืนนับลมหายใจให้เด็กคนนั้น จนกว่าเขาจะตีข้อเข่าที่ไม่แตกได้เอง
      requires: { flag: learned_quiet_hammer }
      text: |
        ทอฟราไม่ได้เป็นลูกมือมาหลายปีแล้ว นางมีทั่งของตัวเองอยู่มุมในของร้าน นางลากม้านั่งไปตั้งข้างทั่งของเด็กหนุ่ม นั่งลง แล้วเริ่มนับ หายใจเข้า ยกค้อน หายใจออก ค้อนลง เด็กหนุ่มเหวี่ยงเร็วกว่าเสียงนับตั้งแต่ครั้งที่สอง นางหยุดนับ รอจนเขาหยุด แล้วเริ่มใหม่ตั้งแต่หนึ่ง

        สิบห้าวันต่อมาเด็กหนุ่มตีข้อเข่าใหม่ได้สิบสองข้อ {name}เคาะฟังทุกข้อ แล้วยื่นค้อนเล่มที่หัวสลักเส้นนับสิบเส้นให้เขาถือตอกตรา ร้านโกเลมได้ข้อเข่าชุดใหม่แทนเงินค่าหมอ คนของร้านลองบิดข้อหนึ่งด้วยมือเปล่า แล้วไม่ทวงอะไรอีก
      effects: { stats: { WIS: 1 }, flags: [apprentice_learned_the_count] }

- id: adult.career_smith_last_stamp
  stage: adult
  weight: 45
  scene: smithy
  mark: วางค้อนหน้าเตา
  when:
    age: [57, 64]
    flags: [job_smith]
  text: |
    ปีนี้มือขวาของ{name}ถือคีมได้ถึงแค่เที่ยง หลังเที่ยงนิ้วจะงอเข้าหาฝ่ามือเอง ต้องใช้มือซ้ายแกะออกทีละนิ้ว ช่วงบ่าย{name}นั่งบนเก้าอี้ข้างประตูร้าน ฟังเสียงค้อนจากข้างใน บอกได้จากเสียงฉ่าอย่างเดียวว่าเหล็กชิ้นไหนจุ่มน้ำเร็วไป

    ตราร้านแขวนอยู่บนตะปูเหนือทั่งใหญ่ ร้านตีเหล็กในถิ่นนี้มีธรรมเนียมเก่า ช่างที่วางค้อนเป็นคนเลือกเองว่าตราจะไปอยู่ในมือใคร ตราที่ไม่มีใครรับต้องเข้าเตาหลอมทิ้ง จะได้ไม่มีใครเอาไปตอกงานที่เจ้าของตราไม่เคยเคาะฟัง
  choices:
    - id: stamp_to_tofra
      label: ยื่นตราร้านให้ทอฟรา
      requires: { flag: learned_quiet_hammer }
      text: |
        ทอฟรารับตราไปถือไว้ในมือทั้งสองข้าง ชั่งน้ำหนักครู่หนึ่ง แล้วบอกว่าคนตระกูลค้อนเงียบตอกตราของคนอื่นไม่ได้ ถ้าจะรับ ต้องสลักเส้นนับของตระกูลลงข้างตราเดิมหนึ่งเส้น {name}บอกให้สลัก

        เช้าวันต่อมา ปลายตราร้านมีรูปทั่งเล็กๆ กับเส้นตรงเส้นหนึ่งอยู่ข้างกัน งานทุกชิ้นที่ออกจากร้านมีสองรอยนั้นคู่กัน {name}ยังมานั่งเก้าอี้ข้างประตูทุกบ่าย ทอฟรานับลมหายใจเสียงดังพอให้ได้ยินถึงประตู
      effects: { flags: [retired, stamp_to_tofra] }
    - id: sell_to_the_foundry
      label: ขายร้าน ทั่ง และเตา ให้โรงหล่อที่อยากได้ร้านซ่อมในถิ่นนี้
      text: |
        คนของโรงหล่อมาดูร้านสองครั้ง ครั้งที่สองมาพร้อมเงินสิบเหรียญกับกระดาษสัญญา เขาจะเก็บทั่งกับเตาไว้ซ่อมข้อต่อตราฟันเฟืองที่แตกในถิ่นนี้ ลูกมือที่อยากอยู่ต่อก็อยู่ได้ ใส่เสื้อของโรงหล่อ

        วันสุดท้าย{name}เอาตราร้านเข้าเตาเอง รอจนรูปทั่งเล็กๆ ที่ปลายตราละลายเป็นหยดแดง แล้ววางกุญแจร้านลงในมือคนของโรงหล่อ ป้ายชื่อร้านลงจากหน้าประตูในเย็นวันนั้น ข้างในยังมีเสียงค้อนเหมือนเดิม
      effects: { gold: 8, flags: [retired, sold_the_forge_to_the_foundry] }
    - id: small_work_alone
      label: ปล่อยลูกมือไปหาร้านใหม่ เก็บเตาเล็กไว้ตีของชิ้นเล็กคนเดียว
      text: |
        ลูกมือทุกคนได้ค้อนคนละเล่มกับเงินคนละสองเหรียญ {name}ดับเตาใหญ่ เหลือเตาเล็กมุมร้านไว้ตีตะปู บานพับ ขอแขวนหม้อ ของที่ตีเสร็จได้ก่อนเที่ยง

        ตราร้านยังแขวนอยู่บนตะปูเหนือทั่งใหญ่ที่ไม่มีใครใช้ ของชิ้นเล็กไม่ต้องตอกตรา คนในถนนเดียวกันรู้อยู่แล้วว่าตะปูกล่องไหนมาจากร้านไหน
      effects: { gold: -4, flags: [still_working, forges_small_alone] }
    - id: last_piece
      label: ตีชิ้นสุดท้ายคนเดียวตั้งแต่เช้าจนเสร็จ ตอกตราเอง แล้วเอาตราเข้าเตา
      check: { stat: STR, dc: 14 }
      effects: { flags: [retired] }
      success:
        text: |
          {name}เลือกตีข้อต่อแขนกลหนึ่งข้อ งานที่ร้านทำมามากที่สุด มือขวาสั่นตั้งแต่ค้อนแรก {name}เปลี่ยนไปจับคีมด้วยมือซ้าย ตีด้วยมือขวาเต็มแขนแทนการใช้ข้อมือ เสียงค้อนช้าและหนักกว่าทุกวัน จุ่มน้ำครั้งเดียว ตรงจังหวะ

          ตราลงกลางรอยพอดี {name}กดตราไว้กับเหล็กด้วยมือทั้งสองข้าง แล้วเอาตราเข้าเตา ข้อต่อชิ้นนั้นไม่มีใครซื้อ วางอยู่บนชั้นหน้าร้าน ลูกค้าที่เข้ามาหยิบขึ้นมาพับไปพับมาเล่นระหว่างรอ
        effects: { stats: { STR: 1 }, flags: [struck_the_last_piece] }
      failure:
        text: |
          พอเที่ยง นิ้วมือขวางอเข้าหาฝ่ามือตามเวลาเหมือนทุกวัน ด้ามค้อนหลุดจากมือกลางจังหวะ หัวค้อนกระแทกขอบทั่งแล้วเด้งมากระแทกข้อมือซ้าย ข้อต่อบนทั่งเย็นลงก่อนจะได้ตีให้จบ

          เย็นนั้น{name}เอาตราเข้าเตา ข้อต่อชิ้นสุดท้ายไม่ได้ตอกตรา วางอยู่บนทั่งจนเช้า มีรอยค้อนแค่ครึ่งชิ้น
        effects: { hp: -2, flags: [last_piece_unstamped] }
    - id: let_the_coal_die
      label: คืนสุดท้าย ปล่อยให้ไฟถ่านมารในเตาใหญ่ดับเอง
      requires: { flag: told_the_voice_no }
      text: |
        ไฟถ่านมารในเตาใหญ่ไม่เคยดับมาหลายปี ทุกคืน{name}กลบขี้เถ้าไว้ให้คุ คืนนี้{name}ไม่กลบ นั่งบนเก้าอี้ข้างประตู ดูแสงแดงคล้ำในเตาหดลงทีละนิด

        ตอนดึก เสียงทุ้มใต้พื้นร้านเรียกชื่อ{name}ครั้งหนึ่ง ช้าเหมือนทุกครั้ง แล้วไม่เรียกอีก ใกล้สาง ถ่านก้อนสุดท้ายกลายเป็นสีเทา {name}แตะด้วยหลังมือ เย็นเหมือนหิน แล้วปลดตราร้านจากตะปูโยนลงไปนอนบนขี้เถ้า ตราในเตาที่ไม่มีไฟไม่ละลาย {name}ปิดประตูร้าน แล้วไม่ได้เปิดอีก
      effects: { stats: { WIS: 1 }, world: { demon: -1 }, flags: [retired, let_the_coal_forge_die] }

# ---------- ช่างกิ่ง ----------
- id: adult.career_bough_iron_wire
  stage: adult
  weight: 45
  scene: home
  when:
    age: [41, 48]
    flags: [job_bough_crafter]
  text: |
    สะพานเชือกระหว่างหมู่บ้านบนกิ่งสองหมู่บ้านขาดในคืนแรกที่น้ำค้างแข็ง คนแบกน้ำที่เดินอยู่กลางสะพานร่วงลงไปสามช่วงตัว ค้างอยู่บนกิ่งล่าง แขนหักหนึ่งข้าง ปลายที่ขาดไม่ใช่เชือกใยไม้ เป็นลวดเหล็กจากเวนทราส หน้าหักเรียบ สีเทาด้าน

    ช่างกิ่งรุ่นหนุ่มเปลี่ยนสะพานเกือบทุกสายในป่าแถบนี้มาใช้ลวดได้สองสามฤดูแล้ว ลวดซื้อจากพ่อค้าที่ตีนป่า ขึงเสร็จในวันเดียว ไม่ขึ้นรา ไม่ต้องรอใยไม้ตากแห้งทั้งฤดู สะพานใยไม้ที่{name}ผูกต้องผูกทีละปม ปมละครึ่งลมหายใจ ปีนี้นิ้วของ{name}เริ่มแข็งในเช้าที่อากาศเย็น ปมที่เคยผูกได้ในความมืดต้องก้มดูทุกปม

    ผู้เฒ่าส่งคนมาถามว่าก่อนน้ำค้างแข็งคืนต่อไป สะพานลวดอีกสามสิบกว่าสายจะเอาอย่างไร
  choices:
    - id: reweave_by_hand
      label: ปลดลวดลงทีละสาย แล้วผูกสะพานใยไม้ขึ้นแทนด้วยมือตัวเอง
      habit: craft_hands
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ตั้งหม้อน้ำอุ่นไว้บนกิ่งข้างหัวสะพานทุกเช้า ผูกได้สิบปมก็จุ่มมือลงหม้อหนึ่งครั้ง ทั้งหน้าหนาวเปลี่ยนสะพานได้สิบเอ็ดสาย สายที่คนเดินมากที่สุดก่อน สายที่มีแต่ลมเดินทีหลัง

          น้ำค้างแข็งคืนที่สาม ลวดอีกสายขาดที่ปลายป่า ไม่มีคนอยู่บนสะพาน สะพานใยไม้ทั้งสิบเอ็ดสายแกว่งตามลมทั้งคืน เช้ามาเชือกขาวไปทั้งเส้นด้วยเกล็ดน้ำแข็ง ไม่มีปมไหนคลาย
        effects: { stats: { DEX: 1 }, flags: [rewove_the_bridges] }
      failure:
        text: |
          ปมที่สามสิบของวันแรก นิ้วชี้ของ{name}แข็งจนดึงปมไม่แน่น {name}ก้าวลงน้ำหนักบนสะพานที่เพิ่งผูกเพื่อลองเชือก ปมคลาย สะพานเอียงลงข้างหนึ่ง {name}ห้อยอยู่ด้วยมือข้างเดียว จนคนบ้านที่ใกล้ที่สุดปีนออกมาดึงขึ้นไป

          ไหล่ซ้ายเคล็ดไปทั้งหน้าหนาว สะพานลวดยังขึงอยู่ที่เดิมทุกสาย
        effects: { hp: -2, flags: [knot_slipped_in_the_frost] }
    - id: teach_the_frost_knot
      label: เรียกช่างกิ่งรุ่นหนุ่มมาเรียนปมใยไม้ แลกกับให้พวกเขาเป็นคนปีนขึ้นไปผูก
      text: |
        มากันเจ็ดคน {name}นั่งบนชานบ้าน สอนปมเดียวกันซ้ำวันละหลายสิบรอบ ด้วยนิ้วที่ช้ากว่าคนเรียนทุกคน ช่างหนุ่มคนหนึ่งบอกว่าลวดไม่ต้องผูกปม {name}ให้เขาเอาลวดเส้นหนึ่งไปแช่น้ำในหม้อ ตั้งทิ้งไว้นอกบ้านหนึ่งคืน เช้ามาเขาหักลวดเส้นนั้นได้ด้วยมือเปล่า

        หน้าหนาวนั้นสะพานใยไม้ขึ้นแทนลวดสิบเก้าสาย ปมของช่างแต่ละคนเอียงไปคนละทาง {name}ดูออกว่าปมไหนใครผูก
      effects: { stats: { WIS: 1 }, flags: [taught_the_frost_knot] }
    - id: wrap_the_wire
      label: เก็บลวดไว้เป็นแกน แล้วพันใยไม้ทับให้หนาจนความเย็นเข้าไม่ถึง
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ลองกับลวดเส้นเดียวก่อน ทายางสนกันน้ำชั้นใน พันใยไม้ทับสามชั้น แขวนไว้นอกบ้านตลอดสามคืนที่น้ำค้างแข็ง คืนที่สามเอาลงมาฟาดกับขอบชาน ลวดข้างในงอแต่ไม่หัก

          สะพานสามสิบกว่าสายพันเสร็จในหน้าหนาวเดียว ช่างรุ่นหนุ่มช่วยพัน ผู้เฒ่าขึ้นมาเดินลองสะพานสายแรกด้วยตัวเอง เดินช้าๆ จนสุดสาย แล้วเดินกลับมาอีกรอบ
        effects: { stats: { INT: 1 }, flags: [wrapped_the_wire] }
      failure:
        text: |
          ใยไม้ที่พันทับลวดเก็บน้ำไว้ข้างใน ไม่ถึงเดือนลวดก็ขึ้นสนิมใต้เชือก สนิมกินใยไม้จากข้างในจนเปื่อย ข้างนอกยังดูเหมือนเชือกดี

          สะพานสายแรกที่{name}พันขาดตอนกลางวัน คนบนสะพานคว้ากิ่งไว้ทัน {name}ต้องปลดทุกสายที่พันแล้วลงมาเอง ใยไม้ที่ใช้ไปทั้งหน้าหนาวกองเป็นขยะอยู่ใต้ชานบ้าน
        effects: { gold: -2, flags: [rust_inside_the_rope] }
    - id: elrin_weaves_rope
      label: ไปหาเอลริน ขอให้เขาทอเชือกใยไม้บนกี่ตัวที่สี่
      requires: { flag: helped_sithran }
      text: |
        กี่ตัวที่สี่ยังตั้งอยู่ในบ้านของเอลริน คานที่เคยเป็นกิ่งมีรอยเลื่อยดำมันเพราะมือจับมาตั้งแต่ฤดูนั้น เอลรินเปลี่ยนเส้นยืนให้กี่ทอเชือกแบนกว้างสองนิ้วแทนผ้า ทอได้วันละสิบช่วงแขน ไวกว่ามือคนผูกปมสิบเท่า

        {name}ไม่ต้องผูกทีละปมอีก ผูกแค่หัวกับท้ายสะพาน หน้าหนาวนั้นสะพานใยไม้ขึ้นแทนลวดครบทุกสาย ลวดที่ปลดลงมาเอลรินเอาไปขายคืนพ่อค้าที่ตีนป่า ได้เงินพอซื้อเส้นยืนสำหรับปีหน้า
      effects: { alignment: { moral: 1 }, flags: [elrin_wove_the_bridge_rope] }

- id: adult.career_bough_inside_the_forest
  stage: adult
  weight: 45
  scene: home
  when:
    age: [49, 56]
    flags: [job_bough_crafter]
  text: |
    ค่ายตัดไม้ไม่ได้ตั้งห่างป่าครึ่งวันเดินอีกแล้ว ปีนี้ค่ายอยู่ในป่า เลยต้นไม้ต้นแรกเข้ามาสามสิบต้น ต้นที่ล้มเป็นต้นไม้ไอเลธจริงๆ ต้นที่มีหมู่บ้านอยู่บนกิ่งมาก่อนคนในหมู่บ้านทุกวันนี้จะเกิด เสียงเลื่อยไม่ได้ลอยมาจากไกล ทุกเช้าพื้นชานบ้านของ{name}สั่นตามจังหวะเลื่อย

    คืนหนึ่งมีคนมาเคาะบันไดเชือกบ้านของ{name}อีกครั้ง ไม่ใช่เก้าคนนั้น เป็นเอลฟ์รุ่นที่ยังเป็นเด็กเล่นอยู่ใต้ชานบ้านในคืนเดือนดับคืนนั้น มาหกคน คนพูดแทนเป็นหญิงสาว นางรู้จากคนเล่าต่อกันมาว่าบันไดเชือกบ้านนี้เคยมีคนมาเคาะ นางขอน้ำมันยางสนจากคลังไม้ร่วงหกไห

    คราวนี้ไม่ใช่กองไม้นอกป่า ค่ายอยู่กลางต้นไม้ ไม่มีทุ่งหญ้ากั้นไฟไว้สักผืน
  choices:
    - id: shut_the_store
      label: บอกนางว่าไฟในป่าคือป่าไหม้ แล้วปิดคลัง
      text: |
        หญิงสาวฟังจนจบ แล้วถามว่าถ้าไม่ใช่ไฟ ป่ามีอะไรอีก {name}ตอบไม่ได้ในคืนนั้น นางพาคนทั้งหกลงบันไดไป ไม่ทิ้งคำขู่ไว้สักคำ

        ฤดูนั้นเสียงเลื่อยดังทุกเช้าเหมือนเดิม ปลายฤดูค่ายล้มต้นไม้อีกสิบสองต้น ต้นที่สิบสองมีบ้านร้างอยู่บนกิ่งหลังหนึ่ง ร้างมานานจนไม่มีใครในหมู่บ้านจำได้ว่าเคยเป็นบ้านของใคร
      effects: { alignment: { law: 1 }, flags: [shut_the_store_on_the_six] }
    - id: show_the_scar
      label: ถลกแขนเสื้อข้างซ้ายให้นางดูแผลไฟจากข้อมือถึงข้อศอก
      requires: { flag: bough_burn_scar }
      text: |
        แผลเป็นขาวซีดเป็นแนวยาวตามแขน ผิวตรงนั้นไม่มีขน ไม่มีริ้ว {name}เล่าเรื่องลมที่เปลี่ยนทิศตอนไฟลุกได้ครึ่งกอง กับไฟที่หยุดห่างต้นไม้ต้นแรกไม่ถึงสามช่วงตัว ครั้งนั้นมีทุ่งหญ้าคั่นอยู่ ครั้งนี้ไม่มี

        หญิงสาวแตะแผลด้วยปลายนิ้ว แล้วถามว่ามีทางอื่นไหม {name}บอกว่ายังไม่รู้ แต่ถ้านางรอได้หนึ่งฤดู จะช่วยหา ทั้งหกคนลงบันไดไปมือเปล่า คืนต่อมาหญิงสาวกลับมานั่งบนชานบ้านของ{name}คนเดียว ถามเรื่องเชือกกับปม
      effects: { stats: { WIS: 1 }, flags: [showed_the_six_the_burn] }
    - id: sink_the_saws
      label: พาทั้งหกคนลงไปเอง ไม่ใช้ไฟ เก็บใบเลื่อยของค่ายทุกใบไปทิ้งแอ่งลึกในลำธาร
      requires: { flag: helped_camp_burning }
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          ใบเลื่อยสองคนชักแขวนเรียงอยู่ใต้เพิงข้างกระโจมหัวหน้าค่าย ยี่สิบใบ ใบยาวกว่าตัวคน {name}ให้คนหนึ่งเฝ้าหมา คนหนึ่งเฝ้ากระโจม อีกสี่คนยกใบเลื่อยลงทีละใบ จับตรงกลางใบ ไม่ให้ฟันเลื่อยกระทบกัน คืนนั้นไม่มีเสียงอะไรดังกว่าลม

          ใบเลื่อยยี่สิบใบจมลงแอ่งลึกในลำธาร ค่ายรอใบใหม่จากเวนทราสหนึ่งเดือน เดือนนั้นป่าเงียบทุกเช้า หญิงสาวมาบอก{name}ว่าเงียบแบบนี้นางไม่เคยได้ยินมาตั้งแต่เกิด
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [sank_the_camp_saws] }
      failure:
        text: |
          ใบที่เก้าครูดกับเสาเพิง เสียงเหล็กร้องยาวไปทั้งค่าย คนเฝ้ายามยิงหน้าไม้เข้าไปในความมืดตามเสียง ลูกหน้าไม้เฉียดสีข้างของ{name}ไปเป็นแผลยาวเท่านิ้ว

          ทั้งเจ็ดคนหนีขึ้นกิ่งได้ครบ ใบเลื่อยแปดใบจมลงลำธาร อีกสิบสองใบยังแขวนอยู่ใต้เพิง สามวันต่อมาค่ายตั้งยามรอบค่ายทั้งคืน และเริ่มล้มต้นที่ใกล้หมู่บ้านก่อน
        effects: { hp: -3, alignment: { law: -1 }, flags: [saw_raid_went_wrong] }
    - id: elders_to_the_camp
      label: พาหญิงสาวขึ้นไปหาผู้เฒ่า ขอให้ผู้เฒ่าลงไปคุยกับหัวหน้าค่ายเอง
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          ผู้เฒ่าตอบเหมือนทุกครั้งว่าป่ารอได้ {name}ถามว่าป่ารอได้อีกกี่ต้น ผู้เฒ่าเงียบไปพักหนึ่ง แล้วให้หญิงสาวเล่าเรื่องบ้านร้างบนต้นที่ค่ายจะล้มเป็นต้นต่อไป

          สามวันต่อมาผู้เฒ่าลงบันไดเชือกไปถึงค่ายด้วยตัวเอง ตกลงกับหัวหน้าค่ายว่าไม้ร่วงจากคลังของหมู่บ้านจะลงไปขายให้อู่เรือทุกฤดูลม ในราคาที่ค่ายต้องจ่าย ค่ายถอยกลับไปตั้งนอกต้นไม้ต้นแรก คนที่นับไม้ร่วงลงไปให้ค่ายทุกฤดูคือ{name}
        effects: { stats: { CHA: 1 }, flags: [windfall_for_the_camp] }
      failure:
        text: |
          ผู้เฒ่าบอกว่าป่ารอได้ แล้วหันไปเรื่องอื่น หญิงสาวลงบันไดไปก่อน{name}

          เจ็ดคืนต่อมามีไฟที่ค่ายตัดไม้ ไม่ใช่น้ำมันยางสนจากคลัง เป็นน้ำมันตะเกียงที่ซื้อจากตีนป่า ไฟไหม้กองไม้กับต้นไม้ไอเลธสามต้นก่อนฝนจะลง {name}ลงไปช่วยตีไฟจนสาง ควันเข้าปอดจนไอไปทั้งเดือน ฝ่ามือทั้งสองข้างของหญิงสาวพองจนต้องพันผ้าไปทั้งฤดู
        effects: { hp: -2, flags: [the_six_burned_alone] }

- id: adult.career_bough_old_chisel
  stage: adult
  weight: 45
  scene: home
  mark: วางสิ่ว
  when:
    age: [57, 64]
    flags: [job_bough_crafter]
  text: |
    สิ่วเล่มที่{name}ใช้ขุดร่องคาน เจาะรูสลัก และแต่งปลายกิ่งที่ป่าทิ้งลงมา เป็นสิ่วที่ช่างกิ่งคนก่อนวางไว้ในมือ{name}ตอนที่{name}ยังไต่บันไดเชือกขึ้นลงวันละยี่สิบเที่ยว ด้ามเปลี่ยนมาสี่ด้าม ทุกด้ามทำจากไม้ร่วง ใบสิ่วยังเป็นใบเดิม บางจนแสงลอดคมได้

    ผู้เฒ่าถามว่าฤดูลมปีหน้าใครจะเฝ้าคลังไม้ร่วง ธรรมเนียมของหมู่บ้าน ช่างกิ่งที่วางสิ่วเป็นคนเลือกเองว่าสิ่วจะไปอยู่ในมือใคร ไม่ต้องเป็นคนที่เก่งที่สุด ต้องเป็นคนที่รอไม้ร่วงได้
  choices:
    - id: chisel_to_elrin
      label: วางสิ่วในมือเอลริน
      requires: { flag: helped_sithran }
      text: |
        เอลรินถือสิ่วแบบคนถือของที่ไม่แน่ใจว่าตัวเองควรได้ เขาบอก{name}ว่าบ้านเขาเคยเลื่อยกิ่ง คนทั้งหมู่บ้านยังจำได้ {name}บอกว่าเพราะอย่างนั้นถึงต้องเป็นเขา คนที่รู้ว่ากิ่งที่มีรอยเลื่อยหน้าตาเป็นอย่างไร

        ฤดูลมปีต่อมา เอลรินนับไม้ร่วงเข้าคลังทีละกิ่ง ไล่นิ้วไปตามปลายกิ่งทุกกิ่งก่อนวางลงกอง {name}นั่งดูอยู่บนชานบ้าน ไม่ได้ลงไปช่วยนับ
      effects: { flags: [retired, chisel_to_elrin] }
    - id: chisel_to_the_speaker
      label: วางสิ่วในมือคนที่เคยพูดแทนเอลฟ์หนุ่มเก้าคนในคืนเดือนดับ
      text: |
        เขาไม่ได้เป็นเอลฟ์หนุ่มแล้ว มือยังมีรอยเชือกบาด แต่เป็นรอยของช่างกิ่ง ไม่ใช่ของช่างทอ เขาถามคำเดียวว่าทำไมเป็นเขา {name}ตอบว่าคนที่รอไม่ได้ในคืนนั้น รอมาได้จนถึงวันนี้

        เขารับสิ่วไป ฤดูลมปีนั้นเขาไม่ขายไม้ร่วงให้พ่อค้าที่ตีนป่าสักกิ่ง เก็บทุกกิ่งเข้าคลัง ผู้เฒ่าไม่ว่าอะไร
      effects: { alignment: { moral: 1 }, flags: [retired, chisel_to_the_nine_speaker] }
    - id: one_more_wind_season
      label: บอกผู้เฒ่าว่าจะเฝ้าคลังต่ออีกฤดูลม แล้วอีกฤดู
      text: |
        ผู้เฒ่าไม่ถามว่าอีกกี่ฤดู {name}ยังลงไปรับไม้ร่วงทุกฤดูลม ลงบันไดเชือกทีละขั้นด้วยสองมือสองเท้า แทนการไต่ลงด้วยมือข้างเดียวอย่างที่เคย

        ช่างรุ่นหนุ่มขึ้นมานั่งข้างคลังกันมากขึ้นทุกปี ถามว่าไม้ร่วงกิ่งนั้นกิ่งนี้เคยอยู่ต้นไหน {name}ตอบได้เกือบทุกกิ่ง
      effects: { flags: [still_working, keeps_the_windfall_store] }
    - id: up_to_the_eighth_tier
      label: ไต่ขึ้นชั้นที่แปดของหอนับดาวเป็นครั้งสุดท้าย พร้อมสิ่วเล่มนั้น
      requires: { flag: built_the_high_tier }
      check: { stat: DEX, dc: 13 }
      effects: { flags: [retired] }
      success:
        text: |
          กิ่งเป็นที่{name}สานไว้เป็นพื้นชั้นที่แปดโตจนหนาเท่าแขน เชือกใยไม้ที่เคยผูกหายเข้าไปในเปลือกไม้หมดแล้ว เหลือแต่ปุ่มนูนเป็นแนวตรงที่เคยมีปม ชั้นนั้นไม่ต้องใช้เชือกอีก ต้นไม้ถือไว้เอง

          {name}ตอกสิ่วลงในปุ่มไม้ปุ่มหนึ่ง ลึกครึ่งใบ แล้วปล่อยไว้ตรงนั้น คนนับดาวชั้นที่แปดใช้ด้ามสิ่วแขวนตะกร้าแผ่นใบไม้มาตั้งแต่คืนนั้น
        effects: { stats: { DEX: 1 }, flags: [left_the_chisel_in_the_eighth_tier] }
      failure:
        text: |
          {name}ไต่ได้ถึงชั้นที่เจ็ด ลมกระโชกจากเหนือพัดลำต้นเอนจนเท้าหลุดจากขั้นหนึ่งครั้ง คนนับดาวชั้นที่เจ็ดสองคนดึง{name}ขึ้นไปนั่งบนชั้น ผูกตัวไว้กับลำต้นจนลมสงบ

          ชั้นที่แปดอยู่เหนือหัวขึ้นไปแค่สามช่วงตัว {name}ส่งสิ่วให้คนนับดาวคนหนึ่งเอาขึ้นไปวางไว้แทน แล้วให้เขาช่วยหย่อนเชือกพาลงไป
        effects: { hp: -2, flags: [chisel_sent_up_without_you] }

# ---------- พ่อค้า ----------
- id: adult.career_merchant_hungry_winter
  stage: adult
  weight: 45
  scene: market
  when:
    age: [41, 48]
    flags: [job_merchant]
  text: |
    คนจากหมู่บ้านบนเขาที่ซื้อของกับ{name}มาหลายปีซื้อเหมือนเดิมทุกปี เกลือหนึ่งถุง น้ำมันตะเกียงหนึ่งไห ผ้าดิบพอตัดเสื้อให้เด็กที่โตขึ้น ปีนี้ไม่มีใครซื้อผ้า ทุกคนซื้อเกลือสองถุง ลูกค้าเก่าสามบ้านซื้อเมล็ดข้าวไปหว่านเป็นครั้งที่สองในฤดูเดียว คนเลี้ยงแพะบนเขาต้อนแพะลงมาขายตั้งแต่ต้นฤดู ขายตัวเมียด้วย

    {name}ค้าขายมานานพอจะอ่านของพวกนี้ออก เมล็ดที่หว่านรอบแรกตายหมด เกลือถุงที่สองไว้หมักเนื้อแพะที่ต้องฆ่าก่อนหน้าหนาว ส่วนแพะตัวเมีย ไม่มีใครขาย ถ้ายังคิดว่าจะมีฤดูหน้า

    ข้าวในตลาดล่างยังราคาเท่าเดิม พ่อค้าข้าวในเมืองยังไม่มีใครรู้ เข่าของ{name}ปวดทุกเช้าที่ลมหนาวมาถึง ปีนี้เริ่มปวดเร็วกว่าทุกปี
  choices:
    - id: hold_the_grain
      label: ซื้อข้าวในตลาดล่างตอนนี้ให้เต็มห้องเก็บของ ไว้ขายปลายหน้าหนาว
      text: |
        {name}ซื้อข้าวสามสิบกระสอบในราคาที่พ่อค้าข้าวยังไม่รู้ว่าควรขึ้น จ้างเกวียนขนมาเรียงไว้ในห้องเก็บของจนถึงเพดาน

        ปลายหน้าหนาว คนจากหมู่บ้านบนเขาลงมาตลาดอีกครั้ง ไม่มีแพะเหลือให้ขาย มีแต่ผ้าห่มกับหม้อทองแดง {name}ขายข้าวไปทีละกระสอบในราคาสามเท่า ขายได้ทุกกระสอบ คนที่แบกกระสอบสุดท้ายขึ้นหลังเป็นเด็กผู้ชายตัวเท่ากระสอบ
      effects: { gold: 8, alignment: { moral: -1 }, flags: [sold_grain_in_the_hungry_winter] }
    - id: grain_up_the_hill
      label: ซื้อข้าวตอนนี้ เข็นขึ้นไปขายบนเขาในราคาทุนก่อนทางปิด รับแพะเป็นค่าข้าวตอนหน้าร้อน
      habit: soft_heart
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ทางขึ้นเขาเป็นดินเหนียว ลาลากเกวียนได้ครึ่งทาง ครึ่งที่เหลือ{name}แบกกระสอบขึ้นเอง ขึ้นลงอยู่สิบหกวัน เข่าทั้งสองข้างบวมเป่งทุกเย็น ทุกบ้านบนเขาได้ข้าวพอกินถึงหน้าร้อน ไม่มีใครขายแพะตัวเมียอีก

          หน้าร้อน คนเลี้ยงแพะต้อนลูกแพะลงมาตลาดเจ็ดตัว เป็นค่าข้าวของทั้งหมู่บ้าน {name}ขายลูกแพะได้น้อยกว่าทุนนิดหนึ่ง
        effects: { stats: { CON: 1 }, gold: -1, alignment: { moral: 1 }, flags: [fed_the_hills_at_cost] }
      failure:
        text: |
          วันที่สี่ เข่าขวาของ{name}พับลงกลางทางขึ้นเขา กระสอบข้าวกลิ้งลงห้วยไปหนึ่งกระสอบ {name}นั่งอยู่ตรงนั้นจนคนบนเขาลงมาเจอ กระสอบที่เหลือคนบนเขาแบกขึ้นไปเอง

          ข้าวขึ้นไปถึงแค่ครึ่งหนึ่งที่ตั้งใจ อีกครึ่งค้างอยู่ในห้องเก็บของจนหน้าร้อน {name}เดินกะเผลกไปทั้งหน้าหนาว
        effects: { hp: -2, gold: -3, flags: [knee_gave_on_the_hill_road] }
    - id: warn_the_crown_granary
      label: เอาสมุดบัญชีไปให้นายคลังข้าวหลวงในเมืองดู
      check: { stat: INT, dc: 14 }
      success:
        text: |
          นายคลังข้าวหลวงไม่เคยฟังพ่อค้า แต่ฟังตัวเลข {name}วางสมุดบัญชีสามปีเรียงกัน ชี้ให้ดูว่าเกลือที่ขายขึ้นเขาปีนี้มากกว่าปีก่อนเท่าตัว เมล็ดข้าวขายได้สองรอบ ผ้าไม่ได้ขายเลยสักผืน

          กลางหน้าหนาว เกวียนของคลังหลวงสี่เล่มขึ้นเขาก่อนทางปิด ข้าวที่ไปถึงเป็นข้าวเก่าค้างยุ้ง แต่กินได้ นับจากปีนั้น นายคลังส่งคนมาขอซื้อสมุดบัญชีของ{name}ทุกปลายฤดู เล่มละหนึ่งเหรียญ
        effects: { stats: { INT: 1 }, gold: 1, reputation: { crown: 1 }, flags: [warned_the_crown_granary] }
      failure:
        text: |
          นายคลังพลิกสมุดบัญชีของ{name}ไปสองหน้า แล้วถามว่าพ่อค้ามาบอกให้คลังหลวงซื้อข้าว พ่อค้าจะได้อะไร {name}ตอบไม่ได้ในทางที่เขาจะเชื่อ

          กลางหน้าหนาวทางขึ้นเขาปิด ข้าวในตลาดล่างขึ้นราคาสามเท่า ค่าเกวียนไปกลับเมืองของ{name}หายไปเปล่าๆ
        effects: { gold: -2, flags: [granary_would_not_listen] }
    - id: board_back_on_the_post
      label: ขึ้นไปหมู่บ้านลูกเห็บ พร้อมแผ่นไม้ที่หลานชายหัวหน้าหมู่บ้านงัดออกจากเสาให้
      requires: { flag: hail_village_paid }
      text: |
        ที่หมู่บ้านลูกเห็บ ปีนี้ก็มีคนหว่านเมล็ดสองรอบ หลานชายหัวหน้าหมู่บ้านมีผมขาวแซมขมับแล้ว {name}ยื่นแผ่นไม้ให้เขา ด้านหลังยังว่าง บอกให้เขียนชื่อ{name}ลงไปใหม่ กับจำนวนกระสอบข้าวบนเกวียนสองเล่มที่ตามขึ้นมา

        เขาตอกแผ่นไม้กลับขึ้นเสากลางลานด้วยตะปูตัวเดิม ปีนั้นหมู่บ้านลูกเห็บไม่มีใครขายแพะตัวเมีย หน้าร้อนปีถัดมามีเงินวางอยู่บนตอไม้ใต้เสา คิดตามราคาข้าวปีที่คืน ตามที่ยายของเขาสั่งไว้ เขางัดแผ่นไม้ลงอีกครั้ง ยื่นให้{name}ถือกลับไปเหมือนครั้งแรก
      effects: { gold: 3, alignment: { moral: 1 }, flags: [hail_board_back_on_the_post] }

- id: adult.career_merchant_tube_contract
  stage: adult
  weight: 45
  scene: market
  when:
    age: [49, 56]
    flags: [job_merchant]
  text: |
    ลูกมือของ{name}เป็นเด็กสาวจากหมู่บ้านริมทางเกวียน มาช่วยงานได้สี่ปี บวกเลขในใจเร็วกว่า{name} จำชื่อลูกค้าได้ทุกคน ปีนี้{name}ให้นางไปรับของในเมืองเองเป็นครั้งแรก นางกลับมาพร้อมกระดาษสัญญาฉบับหนึ่ง ลงชื่อ{name}ด้วยลายมือของนาง อย่างที่{name}เคยบอกว่าทำได้ถ้าราคาดี

    สัญญาซื้อหลอดน้ำค้างดาวสองร้อยหลอดจากโรงกลั่น ส่งทีละห้าสิบหลอดทุกต้นฤดู ราคาเท่ากันทั้งสี่ฤดู เป็นราคาที่ดีจริงในวันที่ลงชื่อ หนึ่งสัปดาห์ต่อมาหลอดน้ำค้างดาวราคาตกลงอีกเหมือนที่ตกทุกปี ห้าสิบหลอดแรกมาถึงพร้อมใบทวงจากคนกลางของวิหารเบเลค คิดตามราคาในสัญญา แพงกว่าราคาในตลาดเกือบครึ่ง

    ลูกมือนั่งอยู่บนลังหลอดใบหนึ่ง นับนิ้วซ้ำไปซ้ำมา บวกเลขชุดเดิมกี่รอบผลก็ออกมาเท่าเดิม
  choices:
    - id: honour_the_contract
      label: จ่ายตามสัญญาให้ครบทั้งสี่ฤดู
      text: |
        {name}จ่ายใบทวงใบแรกในวันที่ได้รับ ใบที่สอง สาม สี่ จ่ายตรงวันทุกใบ ขาดทุนไปทั้งหมดหกเหรียญ ลูกมือขอหักค่าแรงของนางจ่ายครึ่งหนึ่ง {name}ไม่ให้หัก

        ฤดูที่สาม คนกลางของเบเลคมาวางใบทวงพร้อมกระดาษสัญญาฉบับเปล่าอีกใบ บอกว่าพ่อค้าที่จ่ายตรงวันทุกใบ วิหารให้กู้ได้ไม่จำกัด
      effects: { gold: -6, reputation: { belek_bank: 1 }, flags: [paid_the_tube_contract] }
    - id: put_it_on_her
      label: บอกคนของเบเลคว่าลูกมือลงชื่อแทนโดยที่{name}ไม่รู้
      text: |
        คนของเบเลคจดคำของ{name}ลงกระดาษ ให้{name}ประทับนิ้วโป้งรับรอง แล้วโอนสัญญาไปเป็นชื่อของลูกมือ เบเลคไม่ขีดบรรทัดไหนทิ้ง แค่เปลี่ยนชื่อคนที่ต้องจ่าย

        ลูกมือเก็บของกลับหมู่บ้านในเย็นวันนั้น เอาห้าสิบหลอดแรกไปด้วย ใบทวงอีกสามใบเดินทางไปถึงหมู่บ้านริมทางเกวียนทุกต้นฤดู
      effects: { alignment: { law: 1, moral: -1 }, flags: [put_the_contract_on_her] }
    - id: read_for_the_hole
      label: อ่านสัญญาทุกบรรทัด หาบรรทัดที่โรงกลั่นทำผิดเอง
      check: { stat: INT, dc: 14 }
      success:
        text: |
          บรรทัดที่สิบเอ็ดบอกว่าโรงกลั่นต้องส่งหลอดถึงมือผู้ซื้อก่อนตะวันตกของวันแรกในฤดู ห้าสิบหลอดแรกมาถึงวันที่สอง เพราะคนส่งของแวะนอนโรงเตี๊ยมกลางทาง {name}ให้ลูกมือไปตามคนส่งของมายืนยันต่อหน้าคนของเบเลค

          เบเลคไม่ฉีกสัญญาทิ้ง แต่บรรทัดที่สิบเอ็ดทำให้สามฤดูที่เหลือต้องคิดตามราคาตลาด {name}จ่ายแค่ส่วนต่างของห้าสิบหลอดแรก ลูกมือคัดบรรทัดที่สิบเอ็ดลงสมุดของนางเอง
        effects: { stats: { INT: 1 }, gold: -1, flags: [found_line_eleven] }
      failure:
        text: |
          {name}อ่านสัญญาสามรอบ ไม่เจอบรรทัดไหนที่โรงกลั่นทำผิด เจอแต่บรรทัดที่ว่าผู้ซื้อที่จ่ายไม่ตรงวันต้องเสียค่าปรับวันละหนึ่งในสิบ คืนที่{name}อ่านจบรอบที่สาม ใบทวงเลยกำหนดมาสามวันแล้ว

          {name}จ่ายตามสัญญาพร้อมค่าปรับ ลูกมือยืนนับเหรียญส่งให้คนของเบเลคทีละเหรียญ
        effects: { gold: -8, flags: [paid_the_tube_fine] }
    - id: roll_into_the_shop_loan
      label: ให้คนของเบเลคฝั่งตรงข้ามบ่อน้ำรวมหนี้หลอดเข้ากับหนี้ร้าน
      requires: { flag: shop_on_belek_loan }
      text: |
        คนของเบเลคคนเดิม ผมบางจนเห็นหนังหัว เดินอ้อมบ่อน้ำมาพร้อมกระดาษสัญญาฉบับใหม่ หนี้ร้านที่ยังผ่อนไม่หมดรวมกับหนี้หลอดเป็นก้อนเดียว ผ่อนเดือนละครึ่งเหรียญเท่าเดิม แต่ยาวออกไปอีกเก้าปี ร้านยังเป็นของค้ำ

        {name}ลงชื่อ เดือนนั้นไม่ต้องควักเงินสักเหรียญ ลูกมือนับเดือนที่เพิ่มขึ้นด้วยนิ้ว นับครบสองมือแล้วต้องเริ่มนับใหม่อีกหลายรอบ
      effects: { reputation: { belek_bank: 1 }, flags: [rolled_tubes_into_the_shop_loan] }
    - id: sell_ahead_of_the_price
      label: เอาหลอดไปขายหมู่บ้านไกลที่ข่าวราคาตกยังไปไม่ถึง
      requires: { flag: sells_star_lamps }
      text: |
        {name}ขายหลอดน้ำค้างดาวมาตั้งแต่ปีที่เทียนขายไม่ออก รู้ว่าข่าวราคาหลอดเดินช้ากว่าเกวียนหนึ่งฤดูเสมอ ห้าสิบหลอดแรกขึ้นเกวียนไปหมู่บ้านที่ไกลที่สุดในเส้นทาง ขายในราคาของฤดูที่แล้ว ไม่มีใครต่อ เพราะไม่มีใครรู้

        ทุกต้นฤดู{name}กับลูกมือขับเกวียนออกไปไกลกว่าเดิมอีกหนึ่งวัน สัญญาจ่ายครบ เหลือกำไรสองเหรียญ ฤดูต่อมาหมู่บ้านปลายทางทุกหมู่บ้านรู้ราคาหลอดใหม่จากพ่อค้าคนอื่น
      effects: { gold: 2, alignment: { moral: -1 }, flags: [sold_tubes_ahead_of_the_price] }

- id: adult.career_merchant_bell
  stage: adult
  weight: 45
  scene: market
  mark: ปลดกระดิ่ง
  when:
    age: [57, 64]
    flags: [job_merchant]
  text: |
    กระดิ่งทองเหลืองใบที่เคยห้อยท้ายเกวียนของ{name}ตั้งแต่เที่ยวแรกยังดังทุกวัน เสียงแหบลงตามปีเหมือนเสียงคน ลิ้นกระดิ่งสึกจนต้องเปลี่ยนมาสองครั้ง ปีนี้{name}นับเงินได้คล่องเท่าเดิม แต่ยกลังไม่ไหวแล้ว ขึ้นลงเกวียนต้องมีคนช่วยดัน

    พ่อค้าในตลาดมีธรรมเนียมเก่า คนที่เลิกค้าจะปลดกระดิ่งของตัวเองลงในวันสุดท้าย เอาไปแขวนที่ไหนก็ได้ที่ไม่ใช่ที่ขายของ กระดิ่งของพ่อค้าที่เลิกแล้วห้ามดังเรียกลูกค้าอีก
  choices:
    - id: shop_to_the_helper
      label: ยกร้านหัวมุมให้คนที่ช่วยงานมาหลายปี
      requires: { flag: owns_the_shop }
      text: |
        {name}เขียนกระดาษยกร้านด้วยลายมือตัวเอง ประทับนิ้วต่อหน้าคนในตลาดสามคนตามธรรมเนียม บานเฟี้ยมบานที่สามยังติดเหมือนวันแรก {name}สอนคนรับร้านให้ยกขึ้นนิดหนึ่งก่อนเลื่อน อย่างที่ภรรยาคนขายเชือกเคยสอน คนรับร้านขอให้{name}อยู่ห้องนอนข้างหลังต่อ

        กระดิ่งลงจากเหนือประตูในเย็นวันนั้น {name}แขวนไว้ที่หน้าต่างห้องนอนข้างหลัง บานเดียวที่มองเห็นบ่อน้ำกลางตลาด ลมพัดทีไรกระดิ่งก็ดังเบาๆ ไม่มีใครเดินเข้าร้านตามเสียงนั้น
      effects: { alignment: { moral: 1 }, flags: [retired, gave_the_shop_away] }
    - id: sell_it_all
      label: ขายทุกอย่างที่มี ต่อราคากับพ่อค้าคนอื่นเป็นครั้งสุดท้าย
      check: { stat: CHA, dc: 13 }
      effects: { flags: [retired] }
      success:
        text: |
          พ่อค้าสามคนในตลาดมาดูของ {name}ให้ทั้งสามคนเดินดูพร้อมกัน ตอบคำถามของแต่ละคนดังพอให้อีกสองคนได้ยิน ต่อราคากันจนตะวันบ่าย คนที่ให้สูงสุดได้ทุกอย่างไป รวมทั้งรายชื่อลูกค้าที่ซื้อเชื่อ

          {name}ปลดกระดิ่งออกก่อนส่งของ ห่อผ้าเก็บใส่ย่าม คืนนั้นนับเงินได้มากกว่าที่คิดไว้สามเหรียญ
        effects: { stats: { CHA: 1 }, gold: 8, flags: [sold_out_well] }
      failure:
        text: |
          พ่อค้าสามคนที่มาดูของนัดกันมาก่อน ทุกคนให้ราคาเท่ากันทุกชิ้น ต่ำกว่าที่ควรครึ่งหนึ่ง {name}รู้ทันตอนที่ทั้งสามคนเลิกต่อพร้อมกัน แต่ไม่มีคนที่สี่

          {name}ขายไปในราคานั้น ปลดกระดิ่งออกก่อนส่งของ ห่อผ้าเก็บใส่ย่าม
        effects: { gold: 4, flags: [sold_out_cheap] }
    - id: sells_from_a_stool
      label: ยังไม่ปลดกระดิ่ง นั่งขายต่อบนม้านั่ง ให้คนอื่นยกลัง
      text: |
        {name}นั่งบนม้านั่งเตี้ยข้างกองของ นับเงิน ทอนเงิน จดคนที่ซื้อเชื่อ ยกลังไม่ได้แล้ว แต่บอกได้ว่าลังไหนต้องไปวางตรงไหน คนยกเป็นเด็กในตลาดที่{name}จ่ายวันละหนึ่งในสี่เหรียญ

        กระดิ่งยังดังทุกครั้งที่มีลูกค้ามา ลูกค้าเก่าบางคนมาซื้อของชิ้นเล็กที่ไม่จำเป็นต้องซื้อ แล้วนั่งคุยต่อจนตะวันบ่าย
      effects: { gold: 2, flags: [still_working, sells_from_a_stool] }
    - id: bell_to_the_hail_village
      label: ขึ้นเกวียนเที่ยวสุดท้ายไปหมู่บ้านลูกเห็บ เอากระดิ่งไปแขวนที่เสากลางลาน
      requires: { flag: hail_village_paid }
      text: |
        แผ่นไม้จากเสากลางลานหมู่บ้านลูกเห็บยังพิงผนังอยู่ในบ้านของ{name} {name}เอาทั้งแผ่นไม้และกระดิ่งขึ้นเกวียน ให้เด็กในตลาดขับให้ เที่ยวนี้ไม่มีของขายสักชิ้น

        ที่ลานกลางหมู่บ้าน {name}ตอกแผ่นไม้กลับขึ้นเสาด้วยตะปูของหมู่บ้าน แล้วแขวนกระดิ่งไว้ใต้แผ่นไม้ เด็กในหมู่บ้านไม่มีใครเกิดทันปีลูกเห็บ แต่ทุกคนรู้ว่าห้ามแกว่งกระดิ่งเล่น ลมจากทุ่งพัดมาทีไร กระดิ่งก็ดังเอง
      effects: { flags: [retired, hung_the_bell_in_hail_village] }

# ---------- เสมียนวิหารเบเลค ----------
- id: adult.career_clerk_heirs_line
  stage: adult
  weight: 45
  scene: belek_bank
  when:
    age: [41, 48]
    flags: [job_clerk]
  text: |
    ตะเกียงน้ำค้างดาวในห้องโถงของวิหารเบเลคเพิ่มจากสิบสองดวงเป็นยี่สิบดวง แสงฟ้าสว่างขึ้น แต่สำหรับตาของ{name} ตัวหนังสือในสัญญาเลือนลงทุกปี หมึกดำกลายเป็นสีเขียวน้ำ หลังตะวันบ่ายเลขสามกับเลขแปดหน้าตาเหมือนกัน

    เช้าวันหนึ่งหญิงคนหนึ่งพาลูกสาวตัวเล็กมายืนหน้าโต๊ะของ{name} เด็กสูงแค่ขอบโต๊ะ เกาะขอบไว้ด้วยสองมือ ดูปากกาของ{name}เหมือนเด็กทุกคนที่มาที่นี่ หญิงคนนั้นไอทุกครั้งที่พูดจบประโยค นางมีหนี้มรดกจากพ่อ ผ่อนมาสิบกว่าปี นางไม่ได้มาขอลดหนี้ นางมาถามว่าถ้านางตายก่อนผ่อนหมด ลูกสาวคนนี้ต้องลงชื่อตรงไหน
  choices:
    - id: show_her_the_line
      label: คิดตัวเลขให้นางดูตามจริง แล้วชี้ช่องลงชื่อของเด็ก
      text: |
        {name}ถือกระดาษห่างจนสุดแขน คิดดอกทบปีต่อปีลงกระดาษร่าง เงินที่นางจ่ายมาสิบกว่าปียังน้อยกว่าดอกที่ขึ้นในปีเดียวกัน หนี้ของนางวันนี้มากกว่าวันที่นางลงชื่อ

        {name}พลิกสัญญาให้นางดูช่องลงชื่อของทายาท อยู่หน้าสุดท้าย ยังว่าง เด็กเขย่งขึ้นดูด้วย หญิงคนนั้นขอบคุณ{name} แล้วจูงลูกออกไปทางประตูใหญ่ ไอเป็นระยะจนพ้นบันไดวิหาร
      effects: { alignment: { law: 1 }, flags: [showed_her_the_heirs_line] }
    - id: hunt_the_labor_line
      label: อ่านสัญญาของนางทั้งฉบับ หาบรรทัดที่ให้ชำระด้วยแรงงาน
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}รอจนห้องโถงว่าง ยกสัญญาไปอ่านกับเทียนในห้องเก็บเอกสาร หมึกกลับเป็นสีดำ บรรทัดที่ต้องการอยู่หน้าสิบสี่ ตัวเล็กกว่าบรรทัดอื่นเหมือนสัญญาทุกฉบับในรุ่นนั้น ผู้ค้ำหรือทายาทชำระแทนด้วยแรงงานในวิหารได้ วันละครึ่งเหรียญ

          หญิงคนนั้นไอเกินกว่าจะขัดพื้นไหว แต่บรรทัดนั้นไม่ได้บอกว่าแรงงานต้องเป็นของใคร น้องชายของนางมาขัดพื้นวิหารแทนตั้งแต่เดือนต่อมา {name}เห็นเขาทุกเช้า คุกเข่าอยู่ใต้ตะเกียงดวงที่ยี่สิบ
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [found_her_labor_line] }
      failure:
        text: |
          แสงฟ้าทำให้บรรทัดในหน้าสิบสี่กับหน้าสิบห้าเลือนเข้าหากัน {name}อ่านบรรทัดของหน้าสิบห้าเป็นของหน้าสิบสี่ บอกหญิงคนนั้นว่าลูกสาวไม่ต้องรับหนี้ ถ้านางทำงานให้วิหารครบสามปี

          เดือนต่อมานางกลับมาอีกครั้ง มีเสมียนอีกคนเดินตามมาด้วย ถือสัญญาฉบับเดียวกันเปิดค้างไว้ที่หน้าสิบห้า ค่าแรงของ{name}เดือนนั้นหายไปสามเหรียญ
        effects: { gold: -3, reputation: { belek_bank: -1 }, flags: [misread_under_the_blue_lamps] }
    - id: under_the_lens
      label: ส่องสัญญาของนางด้วยแว่นขยายกรอบทองเหลืองทีละหน้า
      requires: { item: clerk_reading_lens }
      text: |
        ใต้แว่นขยาย ขอบกระดาษหน้าสุดท้ายมีบรรทัดหนึ่งตัวเล็กเท่าเม็ดทราย คนที่อ่านใต้ตะเกียงฟ้าจะเห็นเป็นเส้นขีดธรรมดา หนี้มรดกที่ทายาทผ่อนไม่ขาดครบยี่สิบปี ไม่ตกทอดต่อไปอีกชั้น

        {name}คิดให้นางฟัง นางผ่อนมาสิบสี่ปี อีกหกปี ถ้านางผ่อนไม่ขาดสักเดือน ลูกสาวไม่ต้องลงชื่อ นางนับนิ้วหกนิ้วตรงหน้า{name} แล้วถามว่าบรรทัดนั้นอยู่ตรงไหน {name}ยื่นแว่นขยายให้นางส่องเอง
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [lens_found_the_margin_line] }
    - id: its_mila
      label: อ่านชื่อพ่อของนางในสัญญาฉบับแรก แล้วถือสัญญาเข้าห้องหลังคนเดียว
      requires: { flag: copied_child_debt }
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          ชื่อพ่อในสัญญาฉบับแรกคือทอมลิน คนขายถ่านในตลาดล่าง หนี้สี่สิบเอ็ดเหรียญ หน้าคัดหนี้เป็นลายมือของ{name}เอง หญิงตรงหน้าคือมีลา เด็กที่เคยยืนเกาะขอบโต๊ะดูปากกาของ{name}ไล่ตัวหนังสือ นางจำ{name}ไม่ได้ ตอนนั้นนางสูงแค่ขอบโต๊ะ เท่าลูกสาวของนางตอนนี้

          {name}บอกนางให้กลับไปก่อน แล้วถือสัญญาของนางเข้าห้องหลังคนเดียว เก็บเข้าลิ้นชักปีที่ห้าสิบเอ็ดนับจากวันนี้ ลิ้นชักที่ไกลจนไม่มีเสมียนคนไหนเปิด หนี้ยังอยู่ครบทุกบรรทัด แต่ใบทวงหยุดไปถึงบ้านของมีลาตั้งแต่เดือนต่อมา ใบทวงฉบับต่อไปจะออกจากลิ้นชักนั้นตอนลูกสาวของนางผมหงอกแล้ว
        effects: { stats: { DEX: 1 }, alignment: { law: -1, moral: 1 }, flags: [misfiled_milas_contract, misfiled_child_debt] }
      failure:
        text: |
          ชื่อพ่อในสัญญาฉบับแรกคือทอมลิน หญิงตรงหน้าคือมีลา {name}บอกนางให้กลับไปก่อน แล้วถือสัญญาของนางเข้าห้องหลัง มือยังจับลิ้นชักปีที่ห้าสิบเอ็ดค้างอยู่ตอนที่ทาเรสเดินเข้ามา เขาเป็นเสมียนชั้นบนแล้ว เขาไม่ถาม เอื้อมมือมาหยิบสัญญาจากมือ{name} แล้วเก็บเข้าลิ้นชักที่ตรงปีเอง

          เดือนนั้นค่าแรงของ{name}หายไปสองเหรียญ บนโต๊ะเสมียนใหญ่มีบันทึกหนึ่งแผ่น ลายมือเรียบเหมือนตัวพิมพ์
        effects: { gold: -2, reputation: { belek_bank: -1 }, flags: [tares_refiled_milas_contract] }

- id: adult.career_clerk_proof
  stage: adult
  weight: 45
  scene: belek_bank
  when:
    age: [49, 56]
    flags: [job_clerk]
  text: |
    วิหารเบเลคจะเลิกคัดสัญญาด้วยมือ แบบสัญญาฉบับใหม่จะลงแท่นพิมพ์ในเวนทราส พิมพ์ครั้งเดียวหนึ่งหมื่นฉบับ ส่งไปทุกวิหารทุกถิ่น เสมียนรุ่นหนุ่มจะคัดแค่ชื่อกับตัวเลขลงช่องว่าง บรรทัดอื่นไม่ต้องคัดอีก

    ฉบับร่างจากโรงพิมพ์มาถึงก่อนวันพิมพ์จริงสิบวัน ต้องมีเสมียนอาวุโสหนึ่งคนอ่านทุกหน้าแล้วลงชื่อรับรอง ปีนี้ถึงรอบของ{name} {name}อ่านมาถึงหน้าสิบสี่ บรรทัดที่ให้ทายาทชำระหนี้ด้วยแรงงานหายไป บรรทัดอื่นในหน้าเลื่อนขึ้นมาปิดช่องจนไม่เหลือที่ว่าง คนที่ไม่เคยอ่านฉบับเก่าจะไม่มีวันรู้ว่าเคยมีบรรทัดนั้น

    หลังหนึ่งหมื่นฉบับนี้ จะไม่มีใครคัดสัญญาด้วยมืออีก
  choices:
    - id: sign_the_proof
      label: ลงชื่อรับรองฉบับร่างตามที่ชั้นบนส่งมา
      text: |
        {name}ลงชื่อที่มุมล่างของทุกหน้า หน้าละครั้ง ฉบับร่างกลับไปโรงพิมพ์ตอนบ่าย ถุงค่าแรงเดือนนั้นหนักขึ้นสามเหรียญเป็นค่าอ่าน

        สามเดือนต่อมาสัญญาฉบับพิมพ์มาถึงวิหารเป็นลัง หน้าสิบสี่เรียบสนิท ตัวหนังสือเท่ากันทุกบรรทัด ไม่มีบรรทัดไหนเล็กกว่าบรรทัดอื่นอีกแล้ว
      effects: { gold: 3, alignment: { law: 1, moral: -1 }, reputation: { belek_bank: 1 }, flags: [signed_the_closed_proof] }
    - id: write_it_back
      label: เขียนบรรทัดแรงงานกลับลงในหน้าสิบสี่ของฉบับร่าง ด้วยลายมือที่เหมือนตัวพิมพ์ที่สุด
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          {name}ใช้ปากกาปลายเล็กที่สุดในวิหาร เขียนตอนกลางคืนกับแสงเทียน ไม่ใช่ใต้แสงฟ้า ตัวหนังสือเล็กกว่าบรรทัดอื่นนิดหนึ่ง เหมือนบรรทัดเดิมในฉบับเก่าทุกฉบับ ช่างเรียงตัวพิมพ์ที่โรงพิมพ์เรียงตามที่เห็น ไม่มีใครที่นั่นอ่านว่าบรรทัดนั้นแปลว่าอะไร

          หนึ่งหมื่นฉบับออกจากแท่นพิมพ์พร้อมบรรทัดนั้น หน้าสิบสี่ ตัวเล็กกว่าบรรทัดอื่นนิดหนึ่ง
        effects: { stats: { DEX: 1 }, alignment: { law: -1, moral: 1 }, flags: [labor_line_went_to_print] }
      failure:
        text: |
          เสมียนชั้นบนเปิดฉบับร่างดูก่อนส่งกลับโรงพิมพ์ เขาไม่ได้อ่าน แค่เห็นหมึกเขียนมือบนหน้าที่ควรเป็นตัวพิมพ์ทั้งหน้า เขาฉีกหน้านั้นออก แล้วส่งฉบับร่างใหม่ให้เสมียนอาวุโสอีกคนลงชื่อแทน

          ค่าแรงของ{name}หายไปห้าเหรียญ ใต้ชื่อของ{name}ในสมุดเสมียนมีบรรทัดใหม่อีกหนึ่งบรรทัด เบเลคไม่ขีดบรรทัดนี้ทิ้งเหมือนกัน
        effects: { gold: -5, reputation: { belek_bank: -1 }, flags: [proof_hand_caught] }
    - id: refuse_the_proof
      label: ไม่ลงชื่อ ส่งฉบับร่างกลับขึ้นไปพร้อมสัญญาฉบับเก่าหนึ่งฉบับ เปิดค้างไว้ที่หน้าสิบสี่
      text: |
        ชั้นบนส่งฉบับร่างลงมาอีกครั้งในวันเดียวกัน ไม่ได้ส่งให้{name} ส่งให้เสมียนอาวุโสที่นั่งโต๊ะถัดไป เขาลงชื่อก่อนเที่ยง ส่วนสัญญาฉบับเก่าที่{name}แนบขึ้นไป กลับลงมาวางบนโต๊ะของ{name} หน้าสิบสี่ยังเปิดค้างอยู่ ไม่มีใครพลิกไปหน้าอื่น

        ปลายเดือนเสมียนใหญ่ย้าย{name}ไปนั่งโต๊ะใกล้ประตู โต๊ะที่อ่านสัญญาให้คนอ่านไม่ออกฟัง งานที่ไม่ต้องลงชื่อรับรองอะไรอีก
      effects: { alignment: { moral: 1 }, reputation: { belek_bank: -1 }, flags: [refused_the_proof] }
    - id: page_fourteen_is_mine
      label: ชี้ให้ชั้นบนดูว่าหน้าสิบสี่ของแบบสัญญาฉบับนี้ เป็นหน้าที่{name}ร่างเอง
      requires: { flag: asked_to_close_clauses }
      text: |
        หลายปีก่อน เสมียนใหญ่ให้{name}ร่างแบบสัญญาฉบับใหม่ หน้าสิบสี่ตอนนั้นเป็นหน้าว่าง {name}ร่างหน้านั้นช้าที่สุด แก้อยู่สองปี บรรทัดแรงงานยังอยู่ในหน้านั้น เขียนด้วยภาษาปิดของเบเลคเอง ยาวและวกวน คนที่อ่านเร็วจะเห็นเป็นบรรทัดที่ปิดช่อง คนที่อ่านช้าจะเห็นช่อง

        ฉบับร่างของโรงพิมพ์ตัดบรรทัดนั้นทิ้ง {name}ขึ้นชั้นบนพร้อมร่างเดิมที่เสมียนใหญ่คนก่อนลงชื่อรับรองไว้ บนชั้นบนไม่มีใครอยากเป็นคนลบบรรทัดที่เสมียนใหญ่คนก่อนรับรองแล้ว บรรทัดนั้นกลับลงแท่นพิมพ์ ยาวและวกวนเหมือนเดิม
      effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [page_fourteen_went_to_print] }
    - id: tares_set_it
      label: เรียกทาเรสลงมาจากชั้นบน ถามว่าเขาเห็นหน้าสิบสี่หรือยัง
      requires: { flag: young_clerk_keeps_secret }
      text: |
        ทาเรสเห็นแล้ว เขาวางฉบับร่างอีกฉบับลงบนโต๊ะของ{name} ฉบับที่เขาส่งกลับไปให้โรงพิมพ์แก้เมื่อสามวันก่อนในนามของชั้นบน หน้าสิบสี่มีบรรทัดแรงงานกลับมาอยู่ที่เดิม ตัวเล็กกว่าบรรทัดอื่นนิดหนึ่ง เหมือนในฉบับเก่าทุกฉบับ

        เขาบอกว่าฉบับนี้ต้องมีเสมียนอาวุโสลงชื่อ โรงพิมพ์ถึงจะพิมพ์ {name}ลงชื่อที่มุมล่างของทุกหน้า ทาเรสเก็บฉบับร่างใส่แฟ้ม แล้วเดินขึ้นบันไดไปทีละขั้น ไม่รีบ
      effects: { alignment: { law: -1, moral: 1 }, flags: [signed_tares_proof] }

- id: adult.career_clerk_drawer_book
  stage: adult
  weight: 45
  scene: belek_bank
  mark: ลุกจากโต๊ะเสมียน
  when:
    age: [57, 64]
    flags: [job_clerk]
  text: |
    เสมียนที่ลุกจากโต๊ะเป็นครั้งสุดท้ายต้องเขียนสมุดลิ้นชัก ไล่เลขลิ้นชักทุกลิ้นชักที่ตัวเองเคยเปิดในห้องหลัง บรรทัดละลิ้นชัก แล้วลงชื่อท้ายเล่ม ไม่มีเสมียนคนไหนจำได้ครบ เสมียนใหญ่ทุกคนรู้ข้อนี้ แต่ธรรมเนียมนี้ไม่เคยเลิก

    {name}นั่งหน้าสมุดเล่มนั้นตั้งแต่เช้า ใต้ตะเกียงฟ้ายี่สิบดวง ตัวหนังสือของตัวเองบนหน้ากระดาษเลือนจนต้องเอานิ้วไล่ บางลิ้นชัก{name}จำได้ชัดกว่าหน้าเสมียนที่เคยนั่งโต๊ะติดกันสิบปี
  choices:
    - id: list_every_drawer
      label: เขียนเลขลิ้นชักทุกลิ้นชักที่จำได้ ครบทุกบรรทัด แล้วคืนกุญแจห้องหลัง
      text: |
        {name}เขียนจนตะวันบ่าย ได้สามร้อยสิบเอ็ดบรรทัด เสมียนใหญ่นับแล้วบอกว่าเป็นสมุดลิ้นชักที่ยาวที่สุดในรอบสิบปี วิหารจ่ายเงินก้อนสุดท้ายหกเหรียญตามระเบียบ

        กุญแจห้องหลังวางอยู่บนสมุดเล่มนั้น {name}เดินออกทางประตูใหญ่ ผ่านโต๊ะทายาทที่เคยนั่งปีแรก เสมียนหนุ่มที่นั่งอยู่กำลังอ่านสัญญาให้เด็กผู้ชายคนหนึ่งฟัง
      effects: { gold: 6, alignment: { law: 1 }, flags: [retired, listed_every_drawer] }
    - id: leave_out_the_far_drawer
      label: เขียนทุกลิ้นชัก ยกเว้นลิ้นชักที่ไกลที่สุดในห้องหลัง
      requires: { flag: misfiled_child_debt }
      text: |
        ลิ้นชักปีที่ห้าสิบเอ็ดเป็นบรรทัดเดียวที่{name}ไม่เขียน กระดาษของมีลายังอยู่ในนั้น ยังไม่ครบกำหนด วันที่ครบ เบเลคจะได้คืนครบทุกเหรียญ ช้าไปหลายสิบปี

        ตอนส่งสมุด เสมียนใหญ่ไล่นิ้วไปตามเลขลิ้นชักที่{name}เขียน นิ้วหยุดที่บรรทัดสุดท้าย แล้วปิดสมุด วิหารจ่ายเงินก้อนสุดท้ายหกเหรียญ {name}เดินออกจากห้องหลังเป็นครั้งสุดท้าย ไม่ได้หันไปทางลิ้นชักนั้น
      effects: { gold: 6, alignment: { law: -1, moral: 1 }, flags: [retired, left_the_far_drawer_unlisted] }
    - id: tares_writes_the_book
      label: ให้ทาเรสเป็นคนเขียนสมุดลิ้นชักแทน ตามที่{name}บอกทีละบรรทัด
      requires: { flag: young_clerk_keeps_secret }
      text: |
        ทาเรสนั่งลงหน้าสมุด เขาเป็นเสมียนชั้นบนมาหลายปี ลายมือยังเรียบเหมือนตัวพิมพ์ {name}บอกเลขลิ้นชักทีละบรรทัด ทาเรสเขียนตาม เมื่อ{name}บอกเลขลิ้นชักที่ไกลที่สุด ทาเรสไม่เขียน ปลายปากกาเลื่อนลงไปรอบรรทัดถัดไป

        สมุดเล่มนั้นเป็นลายมือของทาเรสทั้งเล่ม ชื่อของ{name}อยู่บรรทัดสุดท้าย ลิ้นชักที่ไกลที่สุดในห้องหลังไม่มีอยู่ในสมุดลิ้นชักเล่มไหนเลย
      effects: { gold: 6, flags: [retired, tares_wrote_the_drawer_book] }
    - id: reads_at_the_heir_desk
      label: ขอนั่งโต๊ะทายาทต่อครึ่งวัน อ่านสัญญาให้คนที่อ่านไม่ออกฟัง
      text: |
        เสมียนใหญ่ไม่เคยได้ยินเสมียนอาวุโสคนไหนขอลงไปนั่งโต๊ะแรกของห้องโถง แต่ก็ไม่มีเหตุผลจะห้าม ค่าแรงครึ่งหนึ่งของเดิม

        {name}นั่งโต๊ะทายาททุกเช้า ตาของ{name}อ่านตัวเล็กเองไม่ไหวแล้ว เสมียนหนุ่มที่นั่งข้างกันอ่านให้ฟังก่อนหนึ่งรอบ {name}อธิบายให้เจ้าของสัญญาฟังว่าบรรทัดนั้นแปลว่าอะไร บรรทัดไหนมีช่อง บรรทัดไหนไม่มี
      effects: { alignment: { moral: 1 }, flags: [still_working, reads_at_the_heir_desk] }
    - id: lens_at_the_kitchen_table
      label: คืนกุญแจห้องหลัง แล้วพาแว่นขยายกรอบทองเหลืองกลับบ้าน
      requires: { item: clerk_reading_lens }
      text: |
        {name}ลงชื่อในสมุดลิ้นชักเท่าที่จำได้ แล้วเดินกลับบ้านพร้อมแว่นขยายในอกเสื้อ หนึ่งเดือนต่อมา คนในถนนเดียวกันเริ่มเอาสัญญาของตัวเองมาวางบนโต๊ะกินข้าวของ{name} สัญญาเบเลค สัญญาเช่านา สัญญาลูกมือ

