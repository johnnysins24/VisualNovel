# ชุด 1 ปีที่ผ่านไป: เหตุการณ์สำรอง (fallback) ที่เล่าเวลาหลายปีรวบเดียว ออกเฉพาะปีที่เรื่องปกติบาง อายุ 41 ถึง 64
# พอชุดถัดไปเติมเรื่องของวัยกลางคนจนแน่น เรื่องพวกนี้จะเลิกออกเอง
# {years} คือจำนวนปีจริงที่เรื่องนี้กินเวลาในชีวิตนั้น (ระบบตัดให้สั้นลงได้ถ้าใกล้หมุดของโลกหรือใกล้ปีสุดท้าย)
#   เรื่องที่ไม่มี min_years ต้องอ่านรู้เรื่องแม้เวลาจะเหลือแค่หนึ่งปี เรื่องที่เนื้อหาต้องใช้เวลานานใส่ min_years
# มนุษย์กับทีฟลิ่ง: ครั้งละ 3 ถึง 5 ปี · คนแคระ: 8 ถึง 10 ปี · เอลฟ์: 15 ถึง 20 ปี (เผ่าอายุยืนเห็นมนุษย์รอบตัวเปลี่ยนรุ่น)
# ท้ายไฟล์เป็นเรื่องสั้นของเผ่าอายุยืน น้ำหนักต่ำ ไว้ออกตอนที่เรื่องยาวออกไม่ได้
# เผ่าอายุยืนแก่ช้าหลังสี่สิบ อายุเทียบมนุษย์ค้างอยู่ที่ 40 หลายปี เรื่องของเอลฟ์กับคนแคระจึงเริ่มที่อายุ 40
# ข้อความห้ามผูกกับอาชีพ ห้ามบอกปีของโลก เกิดซ้ำได้ ตัวเลือกต่างกันตามสิ่งที่ชีวิตนั้นมี (คู่ครอง ลูก เงิน)

# ===================== มนุษย์และทีฟลิ่ง =====================

- id: adult.passage_harvests
  stage: adult
  once: false
  fallback: true
  years: 4
  cast:
    kid: { kin: [child], min_age: 8, pick: eldest, optional: true }
  when:
    age: [41, 64]
    not_flags: [race_elf, race_dwarf]
  text: |
    หน้าเกี่ยวมาแล้วก็ไปอีก{years}รอบ เหมือนกับรอบก่อนหน้านั้นจนแยกไม่ออก มีปีที่ฝนมาช้า มีปีที่หนาวเร็ว ที่เหลือเป็นปีแบบที่คนถามถึงแล้วได้คำตอบว่าก็ปีธรรมดา

    งานที่ทำเป็นแล้ว มือทำเองได้โดยไม่ต้องคิด ทางที่เดินทุกวัน เท้าก็จำได้เอง วันส่วนใหญ่จบลงโดยไม่มีอะไรให้เล่าตอนมื้อเย็น

    แรงยังมี แต่ไม่ได้เหลือเฟือเหมือนตอนอายุยี่สิบ ต้องเลือกว่าจะเอาไปลงกับอะไร
  choices:
    - id: into_work
      label: ลงกับงาน เก็บเงินไว้ตอนที่หลังยังไหว
      text: |
        {name}รับงานที่คนอื่นไม่รับ ทำวันที่คนอื่นหยุด นับเหรียญทุกสิ้นเดือน ถุงเงินใต้กระดานพื้นหนักขึ้นทีละนิด

        หลังเริ่มบอกได้ล่วงหน้าว่าพรุ่งนี้ฝนจะตกไหม และบอกแม่นขึ้นทุกปี
      effects: { gold: 4, hp: -1 }
    - id: into_partner
      label: ลงกับ{partner} กลับมากินมื้อเย็นให้พร้อมกันทุกวัน
      requires: { flag: married }
      text: |
        {name}กลับถึงบ้านก่อนตะวันตกดินทุกวัน เรื่องที่คุยกันตอนกินข้าวส่วนใหญ่เป็นเรื่องเดิม ราคาเกลือ หลังคาบ้านคนอื่น หมาของใครกัดไก่ของใคร

        {partner}เล่าเรื่องเดียวกันเป็นครั้งที่สี่ {name}ก็ฟังจนจบเป็นครั้งที่สี่ แล้วถามคำถามเดิมตรงที่เดิม
      effects:
        hp: 1
        people: [{ id: partner, closeness: 1 }]
    - id: into_child
      label: ลงกับ{kid} สอนของที่ตัวเองรู้ให้หมด
      requires: { cast: [kid] }
      text: |
        {kid}เรียนเร็วกว่าที่{name}เคยเรียน และเถียงเก่งกว่าด้วย บางเรื่อง{kid:เขา|เธอ}ถามกลับมาว่าทำไมต้องทำแบบนั้น {name}ตอบไม่ได้ เพราะไม่เคยมีใครบอกเหมือนกัน

        สองคนลองทำอีกแบบดู แบบของ{kid}เร็วกว่า {name}ไม่ได้เล่าเรื่องนี้ให้ใครฟัง
      effects:
        people: [{ id: "@kid", closeness: 1 }]
    - id: into_self
      label: ลงกับตัวเอง กินให้อิ่ม นอนให้พอ
      text: |
        {name}เลิกรับงานที่ต้องตื่นก่อนไก่ กินมื้อเที่ยงแบบนั่งกิน บ่ายวันพักงานนอนกลางวันได้โดยไม่รู้สึกผิด

        เพื่อนบ้านทักว่าหน้าตาดูดีขึ้น แล้วถามว่าไปได้ยาอะไรมา
      effects: { hp: 3 }

- id: adult.passage_house
  stage: adult
  scene: home
  once: false
  fallback: true
  years: 3
  when:
    age: [41, 64]
    not_flags: [race_elf, race_dwarf]
  text: |
    บ้านแก่ไปพร้อมกับคนอยู่ {years}ปีมานี้บานพับประตูหลังหลุดไปหนึ่งตัว บันไดขั้นที่สองร้องทุกครั้งที่เหยียบ รอยร้าวบนฝาด้านเหนือยาวขึ้นปีละคืบ {name}ขีดดินสอไว้ที่ปลายรอยทุกสิ้นปี

    ช่างคิดค่าซ่อมทั้งหมดสามเหรียญ บอกว่าถ้ารอต่อไปจะเป็นห้า แล้วก็เป็นเจ็ด บ้านไม่เคยซ่อมตัวเอง
  choices:
    - id: pay_the_mason
      label: จ่ายสามเหรียญ ให้ช่างทำให้จบ
      requires: { min_gold: 3 }
      text: |
        ช่างมาสองวัน เปลี่ยนบานพับ ตอกลิ่มใต้บันได อุดรอยร้าวด้วยปูนผสมขนสัตว์ บันไดขั้นที่สองเงียบ เงียบจน{name}ต้องเหยียบแรงๆ ดูอีกทีว่าใช่ขั้นเดิมไหม

        หน้าหนาวนั้นลมไม่เข้าทางฝาด้านเหนือ เป็นปีแรกในรอบหลายปีที่ตื่นมาแล้วน้ำในเหยือกไม่เป็นแผ่น
      effects: { gold: -3, hp: 2, flags: [house_mended] }
    - id: mend_it_yourself
      label: ซ่อมเอง ด้วยของที่มีอยู่ในบ้าน
      habit: craft_hands
      text: |
        บานพับใช้หนังเข็มขัดเก่าตอกตะปูแทน บันไดเอาเศษไม้สอดไว้ข้างใต้ รอยร้าวอุดด้วยผ้าขี้ริ้วชุบโคลน ทั้งหมดใช้เวลาสามบ่าย กับนิ้วโป้งช้ำหนึ่งนิ้ว

        ประตูหลังปิดได้ ถ้ายกขึ้นนิดหนึ่งก่อนดัน บันไดขั้นที่สองเปลี่ยนจากร้องเป็นครวญ
      effects: { flags: [house_patched] }
    - id: let_it_creak
      label: ปล่อยไว้ เก็บสามเหรียญนั้นไว้ก่อน
      habit: tight_fist
      text: |
        {name}ขีดดินสอต่อไป รอยขีดเรียงกันขึ้นไปเหมือนบันไดของมด ประตูหลังใช้เก้าอี้ดันไว้ตอนกลางคืน

        บันไดขั้นที่สองกลายเป็นของมีประโยชน์ ไม่มีใครขึ้นมาชั้นบนได้โดยที่{name}ไม่รู้ รวมทั้งแมวของบ้านข้างๆ
      effects: { hp: -1 }

- id: adult.passage_street
  stage: adult
  once: false
  fallback: true
  years: 5
  min_years: 3
  when:
    age: [41, 64]
    not_flags: [race_elf, race_dwarf]
  text: |
    {years}ปีผ่านไป เด็กที่เคยวิ่งไล่กันหน้าบ้าน{name}สูงเลยขอบประตูไปแล้วทั้งฝูง คนหนึ่งแต่งงานไปอยู่ถิ่นอื่น คนหนึ่งกลับมาเปิดร้านตรงหัวมุม เรียก{name}ว่า{ลุง|ป้า}เต็มปากเต็มคำ ทั้งที่{name}ยังจำได้ว่าเคยถือไม้กวาดไล่เด็กคนนี้ออกจากกองฟืน

    เด็กฝูงใหม่มาวิ่งแทน เสียงเดียวกัน เกมเดียวกัน ลูกหนังลูกใหม่กลิ้งมาชนประตูบ้านหลังเดิม
  choices:
    - id: every_wedding
      label: ไปทุกงานแต่ง ทุกงานศพของถนนนี้
      requires: { min_gold: 2 }
      text: |
        ของขวัญงานแต่งคือเกลือหนึ่งถุง ของช่วยงานศพคือขนมปังหนึ่งก้อน {years}ปีนี้{name}ซื้อเกลือกับขนมปังให้คนอื่นมากกว่าที่กินเอง

        คนในถนนเริ่มมาเคาะประตูเวลามีเรื่องต้องตัดสิน ใครผิดเรื่องรั้ว ใครควรได้ตากผ้าตรงไหน {name}ไม่ได้อยากเป็นคนตัดสิน แต่ทุกคนเห็นตรงกันว่าคนที่ไปครบทุกงานย่อมรู้ว่าใครเป็นอย่างไร
      effects: { gold: -2, flags: [knows_the_street] }
    - id: teach_the_new_pack
      label: สอนเด็กฝูงใหม่ทำของที่ตัวเองทำเป็นสักอย่าง
      text: |
        เด็กห้าคนมานั่งที่ขั้นบันไดหน้าบ้านทุกบ่าย สามคนเลิกมาตั้งแต่เดือนแรก สองคนที่เหลือเรียนจนทำได้ คนหนึ่งทำได้ดีกว่า{name}ตอนอายุเท่ากัน

        เด็กคนนั้นยังไม่รู้ตัว {name}ก็ยังไม่ได้บอก
      effects: { alignment: { moral: 1 }, flags: [taught_street_kids] }
    - id: shut_the_door
      label: ปิดประตู อยู่ของตัวเองเงียบๆ
      text: |
        ลูกหนังกลิ้งมาชนประตูบ่อยขึ้น เพราะเด็กรู้ว่าบ้านนี้ไม่ออกมาดุ {name}ฟังเสียงจากข้างใน แยกเสียงเด็กแต่ละคนได้โดยไม่เคยเห็นหน้า

        วันหนึ่งเสียงหนึ่งหายไปจากฝูง {name}ไม่รู้ว่าเด็กคนนั้นย้ายบ้านหรือโตแล้ว และไม่มีใครให้ถาม
      effects: { hp: 1 }

- id: adult.passage_stars
  stage: adult
  once: false
  fallback: true
  years: 4
  min_years: 2
  when:
    age: [41, 64]
    not_flags: [race_elf, race_dwarf]
  text: |
    ดาวเพิ่มขึ้นทุกปี {years}ปีมานี้คืนฟ้าเปิดสว่างจนเห็นเงาตัวเองบนพื้นได้โดยไม่ต้องมีจันทร์ คนแก่ในถิ่นบ่นว่านอนไม่หลับ ไก่ขันผิดเวลา

    น้ำค้างดาวลดราคาลงอีกรอบ ตะเกียงฟ้าที่เคยแขวนแต่หน้าบ้านคนมีเงิน ตอนนี้มีขายที่แผงของชำ ดวงละสองเหรียญ แถมน้ำค้างขวดแรก คนขายบอกว่าใครยังจุดน้ำมันอยู่ก็เหมือนเผาเงินเล่น
  choices:
    - id: buy_a_sky_lamp
      label: จ่ายสองเหรียญ ซื้อตะเกียงฟ้ามาแขวนในบ้าน
      requires: { min_gold: 2 }
      text: |
        แสงสีฟ้านิ่งกว่าเปลวไฟ ไม่มีควัน ไม่มีกลิ่น {name}กลับมาอ่านตัวหนังสือเล็กๆ ได้โดยไม่ต้องเอียงกระดาษเข้าหาแสง

        มีอยู่เรื่องเดียว คืนไหนที่ตะเกียงติดอยู่ {name}ฝันเห็นห้องเดียวกับที่เพื่อนบ้านฝัน ไปรู้เอาตอนเช้าที่คุยกันข้ามรั้ว สองคนบรรยายบานประตูในฝันได้ตรงกันทุกอย่าง จนถึงสีของลูกบิด
      effects: { gold: -2, world: { star: 1 }, flags: [has_sky_lamp] }
    - id: keep_the_oil
      label: จุดน้ำมันต่อไป แล้วเย็บม่านให้หนาขึ้น
      habit: stubborn
      text: |
        ม่านสองชั้นกันแสงดาวได้เกือบหมด ห้องของ{name}เป็นห้องเดียวในถนนที่ยังมืดแบบกลางคืนสมัยก่อน เปลวตะเกียงน้ำมันสั่นทุกครั้งที่มีคนเดินผ่าน

        น้ำมันแพงขึ้นทุกปีเพราะคนซื้อน้อยลง คนขายบอกว่าอีกไม่นานคงเลิกเอามาขาย
      effects: { gold: -1 }
    - id: count_them
      label: ออกไปนั่งดูฟ้าช่องเดิมทุกคืน ดูว่าเพิ่มตรงไหน
      habit: curious
      text: |
        {name}เลือกฟ้าเหนือปล่องไฟบ้านตรงข้ามเป็นช่องประจำ จำดาวในช่องนั้นได้ทุกดวง เหมือนจำหน้าคนในตลาด

        คืนหนึ่งปลายหน้าหนาว มีดวงหนึ่งที่ไม่เคยอยู่ตรงนั้น เล็ก สีออกเขียว และไม่กะพริบเหมือนดวงอื่น {name}ดูอยู่จนคอแข็ง รู้สึกเหมือนดวงนั้นก็ดูกลับมาเหมือนกัน
      effects: { flags: [counts_the_stars] }

- id: adult.passage_bread
  stage: adult
  scene: market
  once: false
  fallback: true
  years: 3
  when:
    age: [41, 64]
    not_flags: [race_elf, race_dwarf]
  text: |
    คนทำขนมปังเจ้าเก่าวางมือ ลูกชายรับเตาต่อ {years}ปีแล้วที่ขนมปังของถิ่นนี้เปลือกบางลง เนื้อฟูขึ้น และหมดเร็วขึ้น คนหนุ่มสาวชอบ คนรุ่น{name}บ่นกันทุกเช้าระหว่างต่อคิวซื้อ

    เช้านี้คนทำขนมปังหนุ่มยื่นมาให้ลองก้อนหนึ่งก่อนจ่าย บอกว่าสูตรใหม่ ใส่นมด้วย
  choices:
    - id: tell_him
      label: บอกเขาว่าขนมปังของพ่อเขาเป็นอย่างไร
      habit: stubborn
      text: |
        {name}บอกว่าเปลือกต้องหนาพอให้เคาะแล้วดัง เนื้อต้องเหนียวพอให้เช็ดก้นชามได้โดยไม่ขาด เด็กหนุ่มฟังจนจบ แล้วบอกว่าพ่อก็พูดแบบนี้ทุกเช้า จากเก้าอี้ข้างเตา

        สัปดาห์ต่อมาบนแผงมีขนมปังสองแบบ แบบใหม่กองใหญ่ แบบเก่ากองเล็ก ปักป้ายไว้ว่า ของคนแก่ กองเล็กหมดก่อนทุกวัน
      effects: { flags: [old_bread_back] }
    - id: say_it_will_do
      label: กินแล้วบอกว่าใช้ได้
      text: |
        นุ่มจนไม่ต้องจุ่มซุป {name}บอกว่าใช้ได้ เด็กหนุ่มยิ้มกว้าง แถมให้อีกก้อน

        ฟันกรามซี่ที่โยกอยู่ได้พักตั้งแต่เช้านั้น
      effects: { hp: 1 }
    - id: bake_your_own
      label: กลับไปอบกินเองที่บ้าน
      habit: craft_hands
      text: |
        ก้อนแรกแข็งเท่าหิน ก้อนที่สองไหม้ข้างนอกดิบข้างใน ก้อนที่เก้ากินได้ {name}อบสัปดาห์ละครั้ง เปลือกหนาอย่างที่ต้องการ เคาะแล้วดัง

        เพื่อนบ้านรุ่นเดียวกันเริ่มแวะมาตอนได้กลิ่น มือเปล่าบ้าง ถือเนยมาบ้าง
      effects: { hp: 1, flags: [bakes_own_bread] }

- id: adult.passage_walk
  stage: adult
  scene: road
  once: false
  fallback: true
  years: 5
  min_years: 3
  when:
    age: [41, 64]
    not_flags: [race_elf, race_dwarf]
  text: |
    ทางเดินตอนเช้าของ{name}สั้นลงเองโดยไม่มีใครตัดสินใจ {years}ปีก่อนยังไปถึงสะพานแล้ววกกลับ ต่อมาเหลือแค่วิหาร ตอนนี้ถึงบ่อน้ำก็เลี้ยว

    ไม่ได้เหนื่อย แค่ทุกเช้ามีเหตุผลให้กลับเร็วขึ้นหนึ่งอย่าง ฟ้าครึ้ม รองเท้ากัด มีงานรอ เหตุผลพวกนี้จริงทุกข้อ
  choices:
    - id: back_to_the_bridge
      label: กลับไปเดินให้ถึงสะพานทุกเช้า ไม่ฟังเหตุผลไหนทั้งนั้น
      habit: stubborn
      text: |
        สัปดาห์แรกหอบตั้งแต่วิหาร สัปดาห์ที่สี่ถึงสะพานแล้วยังพูดได้เป็นประโยค คนตกปลาใต้สะพานพยักหน้าให้ คนเดียวกับที่เคยพยักให้เมื่อหลายปีก่อน เขาแก่ลงเหมือนกัน

        หน้าหนาวปีนั้น{name}ไม่เป็นหวัดสักครั้ง
      effects: { hp: 2, flags: [walks_to_the_bridge] }
    - id: walk_slow
      label: เดินเท่าที่เดิน แต่เดินให้ช้า ดูของข้างทาง
      habit: curious
      text: |
        ระหว่างบ้านกับบ่อน้ำมีประตูสิบเจ็ดบาน {name}รู้แล้วว่าบานไหนทาสีใหม่ บานไหนเปลี่ยนคนอยู่ บานไหนมีรอยขีดวัดความสูงของเด็กไล่ขึ้นไปบนวงกบ

        รอยขีดบนประตูบานที่เก้าหยุดอยู่ที่ระดับเอวมาสองปีแล้ว {name}ไม่เคยถามบ้านนั้นว่าทำไม
      effects: { flags: [knows_seventeen_doors] }
    - id: sit_out_front
      label: เลิกเดิน นั่งหน้าบ้านแทน
      text: |
        ม้านั่งหน้าบ้านได้แดดเช้าพอดี คนที่เดินผ่านทักทุกคน บางคนหยุดคุย {name}รู้ข่าวของทั้งถิ่นก่อนเที่ยงโดยไม่ต้องลุกไปไหน

        ขาสองข้างประท้วงตอนต้องลุกจริงๆ เสียงเข่าดังพอให้คนที่คุยด้วยหยุดพูดกลางประโยค
      effects: { hp: -1, flags: [sits_out_front] }

# ===================== เอลฟ์ =====================

- id: adult.passage_elf_bakers
  stage: adult
  scene: market
  once: false
  fallback: true
  years: 18
  min_years: 12
  when:
    age: [40, 64]
    flags: [race_elf]
  text: |
    {years}ปีผ่านไป สำหรับ{name}คือผมที่ยาวขึ้นหนึ่งคืบ กับรองเท้าที่เปลี่ยนไปไม่กี่คู่

    สำหรับร้านขนมปังที่{name}ซื้อประจำ คือคนทำขนมปังสามคน คนแรกผมดำตอนเริ่มรู้จักกัน ผมขาวตอนวางมือ คนที่สองเป็นลูก ยืนหน้าเตาได้ไม่กี่ปีก็ไอจนต้องเลิก ตอนนี้คนที่ยืนอยู่คือหลาน หน้าเหมือนปู่ตอนหนุ่มจน{name}เผลอทักด้วยชื่อปู่ไปสองครั้ง

    เด็กหนุ่มไม่ได้แก้ เขารับเหรียญ ยื่นขนมปัง แล้วมอง{name}แบบที่มนุษย์มองของที่อยู่มาก่อนตัวเองเกิด
  choices:
    - id: learn_his_name
      label: ถามชื่อเขา แล้วจำให้ได้
      text: |
        เขาบอกชื่อ {name}ทวนในใจสามครั้ง วันต่อมาก็ทักถูก เด็กหนุ่มยิ้มเป็นครั้งแรก แล้วเล่าว่าปู่เคยเล่าเรื่อง{name}ให้ฟัง ว่ามีเอลฟ์คนหนึ่งมาซื้อขนมปังก้อนเดิมทุกเช้า ตั้งแต่ปู่ยังนวดแป้งไม่เป็น

        {name}เริ่มจดชื่อคนลงสมุด เว้นช่องไว้ข้างหลังแต่ละชื่อ เผื่อชื่อของคนถัดไป
      effects: { flags: [learns_short_names] }
    - id: keep_the_old_name
      label: เรียกเขาด้วยชื่อปู่ต่อไป เขาก็ไม่ได้ว่าอะไร
      habit: stubborn
      text: |
        เด็กหนุ่มขานรับชื่อนั้นทุกเช้า บางวันตอบกลับมาด้วยประโยคที่ปู่เคยพูด ไม่รู้ว่าล้อ หรือได้มาจากปู่จริงๆ

        วันหนึ่งมีเด็กเล็กยืนเกาะขาเขาอยู่หลังแผง หน้าเหมือนกันอีกคน {name}นับได้ว่าเป็นคนที่สี่
      effects: { flags: [calls_them_by_the_first] }
    - id: learn_the_dough
      label: ขอเข้าไปหลังร้าน เรียนนวดแป้งเอง
      habit: craft_hands
      text: |
        แป้งไม่สนว่าคนนวดจะอยู่ได้อีกกี่ร้อยปี ต้องนวดให้ทันก่อนขึ้นฟู ต้องเข้าเตาตอนไฟได้ที่ ไม่มีเวลาให้ใช้แบบเอลฟ์ {name}ทำเสียไปสิบกว่าก้อนกว่าจะเข้าใจ

        เด็กหนุ่มบอกว่าปู่สอนเขาแบบเดียวกัน ดุกว่านี้ด้วย {name}กลับถึงบ้านพร้อมแป้งติดผม กับขนมปังก้อนแรกในชีวิตที่ทำเอง
      effects: { flags: [learned_the_dough] }

- id: adult.passage_elf_letters
  stage: adult
  scene: home
  once: false
  fallback: true
  years: 20
  min_years: 12
  when:
    age: [40, 64]
    flags: [race_elf]
  text: |
    เพื่อนมนุษย์คนหนึ่งของ{name}ย้ายไปอยู่ถิ่นอื่นนานแล้ว สองคนเขียนจดหมายหากันปีละสองฉบับ ตอนต้นหน้าหนาวกับตอนหิมะละลาย ไม่เคยขาด

    จดหมาย{years}ปีเรียงอยู่ในหีบ วางต่อกันแล้วเห็นว่าลายมือของเพื่อนเปลี่ยนไปอย่างไร ฉบับแรกๆ ตัวหนังสือเบียดกันเต็มหน้า ฉบับหลังๆ ตัวโตขึ้น บรรทัดห่างขึ้น ฉบับปีก่อนเส้นสั่น ส่วนลายมือของ{name}ในร่างที่เก็บไว้เหมือนกันทุกฉบับ

    ฉบับล่าสุดมาถึงเมื่อเช้า ลายมือบนซองเป็นของคนอื่น
  choices:
    - id: write_to_the_child
      label: เปิดอ่าน แล้วเขียนตอบคนที่เขียนมา
      text: |
        จดหมายสั้น ลูกของเพื่อนเป็นคนเขียน บอกว่าคนที่{name}เขียนถึงตายแล้วเมื่อหน้าใบไม้ร่วง ก่อนตายสั่งไว้ว่าต้องตอบจดหมายเอลฟ์ให้ตรงเวลา เพราะฝ่ายนั้นไม่เคยช้า

        {name}เขียนตอบ ยาวกว่าที่เคยเขียนถึงเพื่อน เล่าเรื่องที่ลูกคงไม่เคยรู้ ต้นหน้าหนาวปีถัดมามีจดหมายมาอีกฉบับ ลายมือเดิมกับบนซอง ตัวหนังสือเบียดกันเต็มหน้า
      effects: { flags: [writes_to_the_child] }
    - id: leave_it_sealed
      label: ยังไม่เปิด เก็บลงหีบไว้กับฉบับอื่น
      habit: faint_heart
      text: |
        ซองนั้นอยู่บนสุดของหีบ ยังปิดผนึก {name}รู้ว่าข้างในเขียนว่าอะไร รู้ตั้งแต่เห็นลายมือ

        ตราบใดที่ยังไม่เปิด จดหมายฉบับต่อไปของเพื่อนก็แค่มาช้า เอลฟ์รอเก่ง ต้นหน้าหนาวปีถัดมา{name}ยังเขียนไปตามเวลา ไม่มีอะไรตอบกลับมา
      effects: { flags: [sealed_letter] }
    - id: go_to_the_grave
      label: เดินทางไปหาถึงหลุม
      requires: { min_gold: 2 }
      text: |
        ทางไกลสิบสองวัน ตลอดเวลาที่เขียนหากัน{name}ไม่เคยไปถิ่นนั้นสักครั้ง คิดเสมอว่ายังมีเวลา

        หินหัวหลุมยังใหม่ คนในถิ่นมองเอลฟ์ที่ยืนอ่านจดหมายทั้งหีบให้หลุมฟังทีละฉบับ ตั้งแต่เช้าถึงค่ำ ไม่มีใครเข้ามาห้าม
      effects: { gold: -2, hp: -1, flags: [read_to_the_grave] }

- id: adult.passage_elf_words
  stage: adult
  scene: market
  once: false
  fallback: true
  years: 16
  min_years: 8
  when:
    age: [40, 64]
    flags: [race_elf]
  text: |
    คำที่มนุษย์ใช้เปลี่ยนเร็วกว่าที่{name}ตามทัน {years}ปีมานี้คำว่า งาม หายไปจากตลาด คนหนุ่มสาวใช้คำอื่นแทน แล้วก็เปลี่ยนเป็นอีกคำ แล้วก็อีกคำ {name}ยังพูดแบบที่เรียนมาตอนแรก

    เช้านี้{name}ชมผ้าที่แผงว่างามนัก เด็กสาวคนขายหัวเราะจนต้องเอามือปิดปาก แล้วบอกว่ายายของนางก็พูดแบบนี้
  choices:
    - id: learn_the_new_words
      label: ถามว่าเดี๋ยวนี้เขาพูดกันว่าอะไร แล้วหัดใช้
      text: |
        เด็กสาวสอนให้สามคำ {name}ใช้ครบทั้งสามคำในวันเดียวกัน ผิดที่ไปสอง ทั้งตลาดได้หัวเราะ แต่วันต่อมาคนขายปลาก็ทักกลับมาด้วยคำใหม่

        กว่า{name}จะใช้คล่อง คำพวกนั้นก็เริ่มเก่าแล้ว เด็กที่เล็กกว่าเด็กสาวคนขายผ้าเริ่มใช้คำอื่น
      effects: { flags: [speaks_new_words] }
    - id: keep_the_old_words
      label: พูดแบบเดิมต่อไป
      habit: stubborn
      text: |
        {name}ยังชมว่างาม ยังเรียกเหรียญว่าเบี้ย ยังทักตอนเช้าด้วยประโยคที่ไม่มีใครใช้มาสองชั่วคน คนแก่ที่สุดในตลาดชอบมายืนคุยด้วย เพราะเป็นคนเดียวที่ยังพูดเหมือนพ่อแม่ของพวกเขา

        คนแก่พวกนั้นทยอยหายไปทีละคน ทุกครั้งที่หายไปหนึ่งคน ภาษาของ{name}ก็มีคนฟังออกน้อยลงหนึ่งคน
      effects: { flags: [speaks_old_words] }
    - id: write_the_lost_words
      label: จดคำเก่าที่หายไปแล้วลงสมุด
      habit: curious
      text: |
        {name}จดได้สองร้อยกว่าคำ พร้อมประโยคตัวอย่าง และชื่อคนสุดท้ายที่เคยได้ยินใช้คำนั้น ชื่อพวกนั้นเกือบทั้งหมดอยู่บนหินหัวหลุมแล้ว

        อาจารย์จากสถาบันเวทหลวงคนหนึ่งผ่านมาเห็นเข้า ขอซื้อสมุด {name}ไม่ขาย แต่ให้นั่งลอกได้ เขานั่งลอกอยู่สิบเอ็ดวัน
      effects: { flags: [book_of_lost_words] }

- id: adult.passage_elf_bridge
  stage: adult
  scene: road
  once: false
  fallback: true
  years: 15
  min_years: 8
  when:
    age: [40, 64]
    flags: [race_elf]
  text: |
    สะพานไม้ข้ามลำธารใกล้ที่อยู่ของ{name}พังไปสองครั้งใน{years}ปี ครั้งแรกน้ำพัด ครั้งที่สองไม้ผุ มนุษย์สร้างใหม่ทั้งสองครั้ง ตรงที่เดิม ด้วยไม้ชนิดเดิม ตอกตะปูตำแหน่งเดิม

    {name}บอกช่างตั้งแต่ครั้งแรกว่าถ้าขยับขึ้นไปทางเหนือน้ำอีกยี่สิบก้าว ตลิ่งตรงนั้นเป็นหิน ช่างคนแรกพยักหน้า แล้วสร้างที่เดิม ช่างคนที่สองเป็นลูกศิษย์ของคนแรก ก็พยักหน้า แล้วสร้างที่เดิม

    ตอนนี้เสาต้นกลางเริ่มเอียงอีกแล้ว
  choices:
    - id: build_in_stone
      label: สร้างเองทางเหนือน้ำ ด้วยหิน
      habit: craft_hands
      text: |
        {name}ใช้เวลาสองหน้าร้อน วางหินทีละก้อนด้วยมือ ไม่มีใครมาช่วย เพราะไม่มีใครเชื่อว่าต้องมีสะพานสองแห่ง

        หน้าฝนปีถัดมาสะพานไม้เอียงจนต้องปิด คนทั้งถิ่นเดินขึ้นเหนือน้ำไปยี่สิบก้าว ข้ามสะพานหินโดยไม่มีใครพูดอะไร มีแต่ช่างคนที่สองที่เดินมายืนดูรอยต่อหินอยู่นาน
      effects: { hp: -1, alignment: { moral: 1 }, flags: [built_stone_bridge] }
    - id: tell_the_third
      label: บอกช่างคนที่สามเหมือนที่บอกสองคนแรก
      text: |
        ช่างคนที่สามเป็นลูกศิษย์ของคนที่สอง เขาพยักหน้า

        {name}เริ่มสงสัยว่าการพยักหน้าเป็นส่วนหนึ่งของวิชาช่างที่มนุษย์สอนต่อกันมา
      effects: { flags: [told_three_builders] }
    - id: wade_instead
      label: เลิกบอกใคร ข้ามตรงที่น้ำตื้นแทน
      text: |
        ทางน้ำตื้นอยู่ใต้สะพานลงไปร้อยก้าว เปียกแค่ข้อเท้า {name}ถอดรองเท้าถือข้ามทุกเช้า มนุษย์ที่เดินอยู่บนสะพานมองลงมาอย่างสงสาร

        วันที่สะพานพังเป็นครั้งที่สาม มีคนอยู่บนนั้นสองคน ทั้งสองคนว่ายน้ำเป็น
      effects: { flags: [wades_the_ford] }

- id: adult.passage_elf_namesake
  stage: adult
  scene: market
  once: false
  fallback: true
  years: 17
  min_years: 12
  when:
    age: [40, 64]
    flags: [race_elf]
  text: |
    เพื่อนบ้านมนุษย์คู่หนึ่งเคยมาขออนุญาต{name}ตั้งชื่อลูกตามชื่อของ{name} บอกว่าอยากให้ลูกอายุยืน {name}อนุญาต เพราะไม่รู้ว่าต้องตอบอย่างไร เอลฟ์ไม่ตั้งชื่อตามกัน

    {years}ปีผ่านไป เด็กคนนั้นโตเป็นผู้ใหญ่ ทำงานอยู่ในตลาดเดียวกัน เวลามีคนตะโกนเรียกชื่อนี้ สองคนหันพร้อมกัน คนในตลาดแก้ด้วยการเรียกคนหนึ่งว่าคนเล็ก อีกคนว่าคนเก่า

    คนเก่าคือ{name}
  choices:
    - id: answer_to_old
      label: ขานรับชื่อคนเก่า ก็เก่าจริง
      text: |
        {name}หันทุกครั้งที่ได้ยินคำว่าคนเก่า ไม่นานเด็กในตลาดก็เรียกตาม แล้วก็คนต่างถิ่นที่ไม่รู้ที่มา บางคนเข้าใจว่าเป็นชื่อจริง

        คนเล็กมาขอโทษแทนทั้งตลาด {name}บอกว่าไม่เป็นไร ชื่อที่มนุษย์ตั้งให้อยู่ได้ไม่กี่สิบปีก็หาย ชื่อนี้ก็คงเหมือนกัน
      effects: { flags: [called_the_old_one] }
    - id: teach_the_name
      label: สอนคนเล็กว่าชื่อนี้ในภาษาเอลฟ์แปลว่าอะไร
      text: |
        คนเล็กไม่เคยรู้ว่าชื่อตัวเองมีความหมาย พ่อแม่บอกแค่ว่าเป็นชื่อเอลฟ์ {name}บอกให้ฟัง แล้วสอนวิธีออกเสียงพยางค์หลังที่มนุษย์ทั้งตลาดออกผิดมาตลอด

        คนเล็กฝึกอยู่สามวันจนออกได้ ตั้งแต่นั้นมีคนเดียวในตลาดที่เรียกชื่อ{name}ถูก และคนคนนั้นชื่อเดียวกัน
      effects: { alignment: { moral: 1 }, flags: [taught_the_namesake] }
    - id: go_by_another
      label: บอกทั้งตลาดให้เรียกตัวเองด้วยชื่ออื่นแทน ยกชื่อนี้ให้เด็กไป
      habit: soft_heart
      text: |
        เอลฟ์เปลี่ยนชื่อกันอยู่แล้วเมื่อถึงเวลา {name}แค่เปลี่ยนเร็วกว่ากำหนดในปากของคนตลาด ส่วนในหัวของตัวเองยังเป็นชื่อเดิม

        คนเล็กได้ชื่อไปทั้งชื่อ ไม่ต้องมีคำต่อท้าย พ่อแม่ของเขาที่แก่มากแล้วเดินมาขอบคุณถึงบ้าน หิ้วไข่มาสิบฟอง
      effects: { hp: 1, flags: [gave_the_name_away] }

- id: adult.passage_elf_dogs
  stage: adult
  scene: home
  once: false
  fallback: true
  years: 15
  min_years: 10
  when:
    age: [40, 64]
    flags: [race_elf]
  text: |
    หมาของบ้านข้างๆ ตัวที่{name}รู้จักตายไปแล้ว ตัวใหม่มาแทน สีเดียวกัน ชื่อเดียวกัน เห่าใส่{name}ตรงรั้วจุดเดิมเหมือนตัวก่อนไม่มีผิด {years}ปีสำหรับหมาคือทั้งชีวิต กับอีกครึ่งชีวิตของตัวถัดไป

    ตัวก่อนใช้เวลาสามปีกว่าจะยอมให้{name}ลูบหัว พอยอมแล้วก็มานอนขวางประตูบ้านให้ทุกบ่าย แล้ววันหนึ่งก็ไม่มา

    ตัวใหม่ยืนเห่าอยู่ที่รั้ว หางชี้ ขนคอตั้ง
  choices:
    - id: start_over
      label: เริ่มใหม่ตั้งแต่ต้น ยื่นหลังมือให้ดม
      habit: soft_heart
      text: |
        ตัวนี้ใช้เวลาสองปี เร็วกว่าตัวก่อน หรือไม่อย่างนั้น{name}ก็เก่งขึ้น บ่ายวันหนึ่งมันเดินข้ามรั้วมานอนขวางประตู ตรงรอยเดิมที่ตัวก่อนนอนจนพื้นไม้เป็นแอ่ง

        {name}รู้ว่าตัวนี้จะอยู่ได้อีกกี่ปี รู้ตั้งแต่วันแรก แล้วก็ยังลูบหัว
      effects: { hp: 1, flags: [befriends_short_lives] }
    - id: keep_away
      label: ไม่ยื่นมือ ปล่อยให้เห่าไป
      habit: cold_blood
      text: |
        หมาเห่าอยู่สองหน้าหนาวแล้วก็เลิก เปลี่ยนเป็นมองเฉยๆ เวลา{name}เดินผ่าน {name}ก็มองกลับเฉยๆ

        ประตูบ้านไม่มีอะไรนอนขวาง ออกจากบ้านได้โดยไม่ต้องก้าวข้ามใคร
      effects: { flags: [keeps_short_lives_away] }
    - id: ask_for_a_pup
      label: ขอลูกหมาจากครอกถัดไปมาเลี้ยงเอง
      text: |
        เพื่อนบ้านยกให้ตัวที่เล็กที่สุดในครอก บอกว่าตัวนี้คงไม่รอด มันรอด นอนบนเท้าของ{name}ทุกคืน และโตจนนอนบนเท้าไม่ได้ในปีเดียว

        {name}จดวันที่ได้มันมาลงสมุด แล้วเว้นบรรทัดถัดไปไว้ ไม่ได้เขียนว่าเว้นไว้ทำไม
      effects: { hp: 1, flags: [raised_a_dog] }

# ===================== คนแคระ =====================

- id: adult.passage_dwarf_knife
  stage: adult
  scene: smithy
  once: false
  fallback: true
  years: 9
  min_years: 5
  when:
    age: [40, 64]
    flags: [race_dwarf]
  text: |
    มีดพกเล่มที่{name}เหน็บเข็มขัดผ่านมาอีก{years}ปี ใบมีดลับจนบางลงเห็นได้ด้วยตา ด้ามเปลี่ยนไปหนึ่งครั้งเพราะไม้แตก หมุดย้ำเปลี่ยนไปสองตัว ฝักเป็นฝักที่สามแล้ว

    ช่างตีมีดรับไปพลิกดู แล้วบอกว่าเหล็กเหลือให้ลับได้อีกไม่กี่ปี เผ่าอื่นคงทิ้งแล้วซื้อเล่มใหม่ แต่ถ้าจะเอาเหล็กเก่าไปหลอมรวมกับเหล็กใหม่ เขาก็ทำให้ได้ เล่มที่ออกมาจะมีของเดิมอยู่ข้างในหนึ่งในสี่
  choices:
    - id: reforge
      label: จ่ายสองเหรียญ ให้เขาหลอมรวม
      requires: { min_gold: 2 }
      text: |
        เหล็กเก่ากับเหล็กใหม่เข้ากันในเตา ตีพับเจ็ดทบ ออกมาเป็นใบมีดที่มีลายเหมือนน้ำไหล ช่างบอกว่าลายนี้มาจากเหล็กเก่า เหล็กใหม่ล้วนไม่มี

        {name}เปลี่ยนด้ามใหม่ หมุดใหม่ ฝักใหม่ แล้วบอกทุกคนที่ถามว่าเล่มเดิม
      effects: { gold: -2, flags: [reforged_knife] }
    - id: hone_it_out
      label: ลับใช้ต่อไปจนกว่าจะไม่เหลือเหล็ก
      habit: stubborn
      text: |
        ใบมีดบางลงจนหั่นขนมปังแล้วงอ หั่นเนยได้ ตัดเชือกไม่ได้ {name}ยังเหน็บไว้ที่เดิม และพกอีกเล่มไว้ใช้จริง

        วันที่ใบมีดหักคาหัวหอม {name}เก็บทั้งสองท่อนใส่กล่อง เขียนปีที่ได้มากับปีที่หักไว้บนฝา ตามแบบที่ตระกูลเขียนบนหินหัวหลุม
      effects: { flags: [wore_out_the_knife] }
    - id: hang_it_up
      label: แขวนเล่มนี้ไว้บนผนัง แล้วสั่งตีเล่มใหม่
      requires: { min_gold: 1 }
      text: |
        เล่มใหม่คมกว่า หนักกว่า และไม่รู้จักมือของ{name} สัปดาห์แรกบาดนิ้วไปสองครั้ง ตรงที่เล่มเก่าไม่เคยบาด

        เล่มเก่าแขวนอยู่เหนือเตา ทุกครั้งที่เอื้อมไปหยิบมีด มือยังไปทางผนังก่อนไปทางเข็มขัด
      effects: { gold: -1, flags: [hung_the_knife] }

- id: adult.passage_dwarf_ledger
  stage: adult
  scene: home
  once: false
  fallback: true
  years: 8
  min_years: 5
  when:
    age: [40, 64]
    flags: [race_dwarf]
  text: |
    คนแคระจดทุกอย่าง {name}ก็จด สมุดบัญชีเล่มนี้เปิดใช้มา{years}ปี ถึงหน้าสุดท้ายเมื่อคืน ทุกเหรียญที่เข้าและออก ทุกหนี้ที่ให้ยืมและยืมมา ทุกสัญญาปากเปล่าที่มาจดทีหลังกันลืม

    ก่อนเปิดเล่มใหม่ต้องยกยอดจากเล่มเก่า หน้าสุดท้ายมีหนี้ค้างอยู่สามรายการที่ลูกหนี้คงลืมไปแล้ว รวมกันสี่เหรียญ รายหนึ่งเป็นมนุษย์ที่ตอนยืมยังหนุ่ม ตอนนี้หลังงอ
  choices:
    - id: collect
      label: ไปทวงให้ครบทั้งสามราย
      habit: tight_fist
      text: |
        ชายหลังงอนับเหรียญให้ด้วยมือสั่น บอกว่าลืมไปสนิท แล้วถามว่าคนแคระจำได้ทุกอย่างแบบนี้ทุกคนหรือ {name}ตอบว่าไม่ได้จำ จดไว้

        สมุดเล่มใหม่เปิดหน้าแรกด้วยยอดที่ไม่มีอะไรค้าง
      effects: { gold: 4, alignment: { law: 1 } }
    - id: carry_forward
      label: ยกยอดไปเล่มใหม่ตามเดิม ไม่ทวง ไม่ลบ
      text: |
        สามรายการนั้นย้ายไปอยู่หน้าแรกของเล่มใหม่ หมึกใหม่ ตัวเลขเดิม หนี้ที่จดไว้ไม่ได้แปลว่าต้องทวง แปลแค่ว่าไม่ได้ลืม

        ชายหลังงอตายในอีกไม่กี่ปีต่อมา {name}ขีดเส้นใต้รายการของเขาหนึ่งเส้น ตามแบบที่ใช้กับหนี้ที่ต้องไปทวงเอากับออสซา
      effects: { flags: [carries_old_debts] }
    - id: strike_off
      label: ขีดฆ่าทั้งสามรายการ แล้วไปบอกลูกหนี้ต่อหน้า
      habit: soft_heart
      text: |
        คนแคระไม่ลบหนี้เงียบๆ ต้องไปบอกกันต่อหน้า {name}ไปครบสามบ้าน สองบ้านจำไม่ได้ว่าเคยยืม บ้านที่สามคือชายหลังงอ เขาจำได้ และร้องไห้

        สัปดาห์ต่อมาเขาอุ้มไก่มาให้ตัวหนึ่ง {name}จดไก่ตัวนั้นลงเล่มใหม่ ช่องรายรับ
      effects: { alignment: { moral: 1 }, hp: 1, flags: [struck_off_debts] }

- id: adult.passage_dwarf_fence
  stage: adult
  once: false
  fallback: true
  years: 10
  min_years: 6
  when:
    age: [40, 64]
    flags: [race_dwarf]
  text: |
    เด็กมนุษย์คนหนึ่งเคยมายืนเกาะรั้วดู{name}ทำงาน ตอนนั้นสูงไม่ถึงเอว {years}ปีผ่านไป เด็กคนนั้นมีลูกของตัวเองมายืนเกาะรั้วตรงที่เดิม สูงไม่ถึงเอวเหมือนกัน ถามคำถามเดิมด้วย ว่า{name}โตเต็มที่แล้วหรือยัง

    บนเสารั้วต้นนั้นยังมีรอยมีดที่{name}เคยขีดวัดความสูงของคนพ่อไว้ ปีละขีด ขีดบนสุดอยู่สูงกว่าหัวของ{name}ไปสองคืบ

    {name}ยังอยู่กลางวัยของคนแคระ ผมเพิ่งมีสีเทาแซมไม่กี่เส้น คนพ่อที่ยืนรอลูกอยู่ข้างถนนมีมากกว่านั้นแล้ว
  choices:
    - id: mark_the_child
      label: เรียกเด็กมายืนชิดเสา แล้วขีดรอยแรกให้
      text: |
        รอยของเด็กอยู่ต่ำกว่ารอยแรกของพ่อหนึ่งนิ้ว เด็กไม่พอใจ ขอให้ขีดใหม่ตอนเขย่งเท้า {name}ไม่ยอม

        คนพ่อเดินเข้ามาดู เอานิ้วลูบรอยของตัวเองไล่ขึ้นไปทีละขีด ถึงขีดบนสุดแล้วก็หัวเราะ บอกว่าจำไม่ได้เลยว่าเคยตัวเท่านี้
      effects: { flags: [marks_the_fence] }
    - id: answer_again
      label: ตอบคำถามนั้นเหมือนที่เคยตอบพ่อของเด็ก
      text: |
        "โตแล้ว โตมาก่อนปู่ของเอ็งเกิด" {name}ว่า เด็กคิดอยู่นาน แล้วถามว่างั้นทำไมไม่สูง

        คำตอบของคำถามที่สอง{name}ก็ใช้อันเดิม ว่าคนแคระไม่ได้โตขึ้นข้างบน โตลงข้างล่าง เหมือนราก เด็กก้มลงดูเท้าของ{name}อยู่พักใหญ่
      effects: { hp: 1 }
    - id: put_him_to_work
      label: ยื่นของให้เด็กถือ ไหนๆ ก็มายืนดูแล้ว
      habit: craft_hands
      text: |
        เด็กถือได้ไม่ถึงครึ่งชั่วยามก็ทำหล่น {name}ให้เก็บขึ้นมาถือใหม่ วันต่อมาเด็กมาอีก ถือได้นานขึ้น

        พ่อของเด็กเคยมายืนดูอยู่สามปีโดยไม่มีใครยื่นอะไรให้ถือ เขาบอกเรื่องนี้กับ{name}ทีหลัง ไม่ได้บอกแบบน้อยใจ บอกแบบคนที่เพิ่งนึกออกว่าตอนนั้นตัวเองรออะไรอยู่
      effects: { alignment: { moral: 1 }, flags: [fence_apprentice] }

- id: adult.passage_dwarf_wall
  stage: adult
  once: false
  fallback: true
  years: 9
  min_years: 5
  when:
    age: [40, 64]
    flags: [race_dwarf]
  text: |
    ตระกูลส่งจดหมายถึงคนของตัวเองทุกคนปีละฉบับ ไม่ว่าจะอยู่ไกลแค่ไหน ในจดหมายมีแค่รายชื่อ ใครเกิด ชื่อนั้นได้ขึ้นกำแพงชื่อ ใครตาย ชื่อนั้นได้ปีสลักต่อท้าย ไม่มีข่าวอื่น คนแคระถือว่านอกจากสองเรื่องนี้ไม่มีอะไรต้องรีบบอก

    จดหมาย{years}ฉบับหลังสุดวางเรียงอยู่บนโต๊ะ ชื่อที่ได้ปีต่อท้ายเริ่มเป็นชื่อที่{name}เคยวิ่งเล่นด้วย ชื่อที่ขึ้นใหม่เป็นชื่อที่ไม่เคยเห็นหน้า

    ท้ายฉบับล่าสุดมีบรรทัดเพิ่มมาหนึ่งบรรทัด ช่างหินของตระกูลแก่แล้ว สิ่วเล่มเดิมก็สึก ใครส่งอะไรมาช่วยได้ก็ส่ง
  choices:
    - id: send_coin
      label: ส่งเงินไปสองเหรียญ ค่าสิ่วเล่มใหม่
      requires: { min_gold: 2 }
      text: |
        จดหมายปีถัดมามีชื่อ{name}อยู่ท้ายสุด ไม่ได้อยู่ในช่องเกิดหรือช่องตาย อยู่ในช่องที่สาม ซึ่ง{name}ไม่เคยเห็นมาก่อน หัวช่องเขียนว่า คนที่กำแพงจำได้

        ช่องนั้นมีอยู่สี่ชื่อ
      effects: { gold: -2, alignment: { law: 1 }, flags: [the_wall_remembers] }
    - id: go_and_see
      label: เดินทางกลับไปดูกำแพงด้วยตาสักครั้ง
      requires: { min_gold: 1 }
      text: |
        กำแพงชื่อสูงกว่าที่{name}จำได้ หรือไม่อย่างนั้นก็แค่ยาวขึ้น {name}เดินไล่นิ้วไปตามชื่อที่รู้จัก นิ้วหยุดที่ชื่อของตัวเอง ตัวอักษรยังคม ข้างหลังยังว่าง

        ช่างหินแก่มองอยู่ แล้วบอกว่าทุกคนที่กลับมาก็ทำแบบนี้ เอานิ้วแตะที่ว่างหลังชื่อตัวเอง เหมือนจะวัดว่าเหลือที่เท่าไร
      effects: { gold: -1, hp: -1, flags: [saw_the_name_wall] }
    - id: file_the_letters
      label: เก็บจดหมายเข้าหีบ ไม่ตอบ เหมือนทุกปี
      text: |
        ตระกูลไม่เคยรอคำตอบ จดหมายปีถัดไปก็มาตามเวลา รายชื่อยาวเท่าเดิม ไม่มีบรรทัดเรื่องสิ่วแล้ว

        {name}ไม่รู้ว่ามีคนอื่นส่งไปให้ หรือช่างหินคนนั้นได้ปีต่อท้ายชื่อไปแล้ว ชื่อช่างไม่เคยอยู่ในจดหมาย
      effects: { flags: [files_the_letters] }

- id: adult.passage_dwarf_cask
  stage: adult
  scene: home
  once: false
  fallback: true
  years: 8
  min_years: 6
  when:
    age: [40, 64]
    flags: [race_dwarf]
  text: |
    ถังเหล้าที่{name}ฝังดินไว้ครบ{years}ปีแล้ว สูตรของตระกูลบอกไว้ชัดว่าห้ามขุดก่อน และไม่ได้บอกว่าต้องขุดเมื่อไร

    เพื่อนบ้านมนุษย์รู้เรื่องถังนี้มาตั้งแต่วันฝัง ถามถึงทุกปี ปีแรกๆ ถามว่าได้ที่หรือยัง ปีหลังๆ ถามว่าตัวเองจะอยู่ทันได้ชิมไหม คนที่ถามบ่อยที่สุดปีนี้ไม่ได้มาถาม เขาย้ายไปนอนที่เนินหลังวิหารเมื่อหน้าหนาว

    พลั่วพิงอยู่ข้างประตู
  choices:
    - id: dig_and_share
      label: ขุดขึ้นมา แล้วเปิดให้ทั้งถนนชิม
      text: |
        เหล้าออกมาสีเข้มเหมือนน้ำผึ้งป่า แรงจนคนแรกที่ชิมต้องนั่งลง ทั้งถนนมาพร้อมจอกของตัวเอง ถังหมดก่อนเที่ยงคืน

        {name}เทจอกสุดท้ายลงดินตรงหน้าบ้านของคนที่ถามบ่อยที่สุด เมียของเขายืนดูอยู่ที่ประตู แล้วบอกว่าเขาคงบ่นว่าเทน้อยไป
      effects: { hp: 1, alignment: { moral: 1 }, flags: [opened_the_cask] }
    - id: dig_and_sell
      label: ขุดขึ้นมา แล้วขายยกถังให้ร้านเหล้า
      habit: tight_fist
      text: |
        เจ้าของร้านชิมหนึ่งจิบ แล้วจ่ายห้าเหรียญโดยไม่ต่อ เขาขายต่อจอกละครึ่งเหรียญ หมดในสามคืน

        เพื่อนบ้านที่รอมาหลายปีได้ชิมเหมือนกัน แต่ต้องจ่าย บางคนเลิกทัก{name}ไปพักหนึ่ง
      effects: { gold: 5, flags: [sold_the_cask] }
    - id: leave_it
      label: ยังไม่ขุด ของแบบนี้ยิ่งรอยิ่งดี
      habit: stubborn
      text: |
        {name}เอาพลั่วไปเก็บ ถังอยู่ใต้ดินต่อไปอีกรอบ ตามเวลาของคนแคระ ซึ่งไม่ตรงกับเวลาของใครในถนนนี้

        เด็กข้างบ้านที่เกิดหลังวันฝังถังเริ่มถามแทนคนรุ่นพ่อแล้ว ว่าได้ที่หรือยัง
      effects: { flags: [cask_still_buried] }

- id: adult.passage_dwarf_lamp
  stage: adult
  scene: home
  once: false
  fallback: true
  years: 10
  min_years: 5
  when:
    age: [40, 64]
    flags: [race_dwarf]
  text: |
    {years}ปีมานี้เพื่อนบ้านมนุษย์เปลี่ยนตะเกียงไปแล้วสามแบบ จากน้ำมัน เป็นตะเกียงฟ้ารุ่นแรกที่แสงสั่น แล้วก็รุ่นที่แสงนิ่ง ทุกครั้งที่เปลี่ยนก็เดินมาบอก{name}ว่าควรเปลี่ยนตาม

    {name}ยังใช้ตะเกียงถ่านมารดวงเดิมที่ได้มาจากตระกูล ก้อนถ่านข้างในเท่ากำปั้นเด็ก แดงอยู่อย่างนั้นมาตั้งแต่รุ่นทวด ร้อนจนวางกาน้ำบนฝาแล้วเดือด แสงสีส้มทำให้ทุกอย่างในห้องดูเหมือนตอนตะวันตกดิน

    เพื่อนบ้านบอกว่าบ้านนี้เป็นบ้านเดียวในถนนที่กลางคืนยังเป็นสีแดง
  choices:
    - id: keep_the_ember
      label: ใช้ดวงเดิมต่อไป ของตระกูลไม่ได้มีไว้เปลี่ยน
      habit: stubborn
      text: |
        ตะเกียงดวงนั้นไม่เคยต้องเติมอะไร ไม่เคยดับ บางคืนที่{name}หลับลึก จะได้ยินเสียงทุ้มๆ อยู่ไกลมาก เหมือนมีคนเรียกชื่อจากก้นเหมือง ตื่นมาก็จำไม่ได้ว่าเรียกว่าอะไร

        คนแคระรุ่นทวดก็คงได้ยินเหมือนกัน ไม่มีใครเคยจดไว้
      effects: { world: { demon: 1 }, flags: [keeps_the_ember_lamp] }
    - id: hang_a_sky_lamp
      label: จ่ายสองเหรียญ ซื้อตะเกียงฟ้ามาแขวนคู่กัน
      requires: { min_gold: 2 }
      text: |
        สองแสงไม่เข้ากัน ฟ้ากับส้มตัดกันกลางห้องเป็นเส้น ของที่อยู่ตรงเส้นนั้นมีเงาสองสี {name}ใช้แสงฟ้าอ่านหนังสือ ใช้แสงส้มต้มน้ำ

        คืนที่เปิดทั้งสองดวง {name}ฝันเห็นห้องที่ไม่ใช่ห้องตัวเอง และได้ยินเสียงทุ้มจากข้างล่างพร้อมกัน สองอย่างนี้ไม่ชอบกัน รู้สึกได้แม้ในฝัน
      effects: { gold: -2, world: { star: 1 }, flags: [two_lamps] }
    - id: go_dark
      label: เก็บตะเกียงตระกูลลงหีบ กลับไปจุดเทียนไข
      text: |
        เทียนไขเหม็น ควันดำ และต้องตัดไส้ทุกครึ่งชั่วยาม แต่ไม่มีเสียงอะไรมาเรียกตอนหลับ และไม่มีความฝันของใครมาปน

        เพื่อนบ้านมองว่าคนแคระบ้านนี้ถอยหลังไปสองร้อยปี {name}นอนหลับสนิทกว่าใครในถนน
      effects: { hp: 2, gold: -1, flags: [went_back_to_candles] }

# ===================== เผ่าอายุยืน เรื่องสั้นไว้ออกตอนที่เรื่องยาวออกไม่ได้ =====================

- id: adult.passage_long_feasts
  stage: adult
  weight: 1
  once: false
  fallback: true
  years: 3
  when:
    age: [40, 64]
    not_flags: [race_human, race_tiefling]
  text: |
    มนุษย์ฉลองทุกอย่างที่ครบปี วันเกิด วันแต่ง วันเปิดร้าน วันที่หมาตัวโปรดมาอยู่ด้วย {years}ปีมานี้{name}ถูกเพื่อนบ้านมนุษย์เชิญไปงานแบบนี้มากกว่าที่เคยไปงานของเผ่าตัวเองมาทั้งชีวิต

    เผ่าของ{name}ไม่นับปีถี่ขนาดนั้น นับไปก็เปลืองนิ้ว แต่เพื่อนบ้านยืนยันว่าต้องมา และต้องกินให้หมดจาน
  choices:
    - id: bring_gifts
      label: ไปทุกงาน ถือของติดมือไปด้วยทุกครั้ง
      requires: { min_gold: 1 }
      text: |
        {name}เรียนรู้ว่าของขวัญของมนุษย์ไม่ต้องอยู่ได้นาน ขนมหนึ่งห่อก็พอ ของที่อยู่ได้ร้อยปีทำให้เจ้าของงานอึดอัด

        เด็กในบ้านนั้นเริ่มนับวันรองานถัดไปแทน{name} แล้วมาบอกล่วงหน้าสามวันทุกครั้ง
      effects: { gold: -1, hp: 1, flags: [goes_to_short_feasts] }
    - id: ask_why
      label: ถามเจ้าของงานว่าทำไมต้องฉลองถี่นัก
      habit: curious
      text: |
        หญิงเจ้าของบ้านตอบระหว่างตักซุป ว่าก็เพราะไม่รู้ว่าปีหน้าจะได้ฉลองไหม พูดเหมือนบอกราคาหัวหอม แล้วก็ตักให้{name}เพิ่มอีกทัพพี

        {name}กินจนหมดจาน
      effects: { flags: [asked_about_feasts] }
    - id: stay_home
      label: ส่งของไปแทนตัว แล้วอยู่บ้าน
      text: |
        ห่อของไปถึงทุกงานตรงเวลา มีป้ายเขียนชื่อ{name}ผูกไว้ เพื่อนบ้านขอบคุณทุกครั้งที่เจอ และเลิกเชิญในปีถัดมา

        เสียงงานเลี้ยงยังลอยข้ามรั้วมาเหมือนเดิม เพลงเดิมทุกปี {name}ร้องตามได้แล้วทั้งเพลง
      effects: { flags: [sends_gifts_instead] }

- id: adult.passage_long_still
  stage: adult
  scene: home
  weight: 1
  once: false
  fallback: true
  years: 2
  when:
    age: [40, 64]
    not_flags: [race_human, race_tiefling]
  text: |
    {years}ปีผ่านไปโดยไม่มีอะไรให้จด สำหรับเผ่าอายุยืนอย่าง{name} เวลาเท่านี้สั้นเท่ากับบ่ายวันหนึ่งของมนุษย์ ฝนตก ฝนหยุด ของในตู้หมดแล้วก็ซื้อใหม่

    เพื่อนบ้านมนุษย์ถามว่าช่วงนี้ทำอะไรอยู่ {name}ต้องคิดอยู่นานกว่าจะหาคำตอบที่ไม่ฟังเหมือนคนขี้เกียจ
  choices:
    - id: mend_things
      label: ไล่ซ่อมของในบ้านทีละชิ้น ไม่รีบ
      habit: craft_hands
      text: |
        {name}รื้อเก้าอี้ตัวที่โยกออกมาเข้าเดือยใหม่ ใช้เวลาครึ่งหน้าหนาว เพราะรอให้กาวแห้งเองโดยไม่อังไฟ เก้าอี้ตัวนั้นจะอยู่ได้นานกว่าบ้านทั้งหลัง

        เพื่อนบ้านมนุษย์มาเห็นเข้า ถามว่าทำไมไม่ซื้อใหม่ ราคาแค่ครึ่งเหรียญ
      effects: { flags: [mends_slowly] }
    - id: rest
      label: ไม่ทำอะไรเลยจริงๆ
      text: |
        {name}นั่งดูเงาของขอบหน้าต่างเลื่อนไปบนพื้นวันละรอบ รู้ว่าวันไหนของปีที่เงาจะไปถึงขาโต๊ะ และวันไหนจะเริ่มถอยกลับ

        ร่างกายที่ไม่ได้ถูกใช้ทำอะไรก็ซ่อมตัวเองไปเงียบๆ แผลเก่าที่ข้อเท้าเลิกปวดไปตอนไหนไม่รู้
      effects: { hp: 3 }
    - id: save
      label: ทำงานเท่าที่มีให้ทำ เก็บเงินไว้เฉยๆ
      text: |
        เหรียญเข้ามาช้าๆ และออกไปช้ากว่า {name}ไม่มีอะไรอยากซื้อเป็นพิเศษ ถุงเงินจึงหนักขึ้นเอง

        มนุษย์เก็บเงินไว้ใช้ตอนแก่ {name}ยังไม่รู้ว่าตัวเองเก็บไว้ใช้ตอนไหน
      effects: { gold: 2 }
