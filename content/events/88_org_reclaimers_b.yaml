# ชุด อ องค์กรลับ: ผู้ทวงตำรา (reclaimers) ไฟล์ ข งานยศสาม 2 เรื่อง เลื่อนยศ 4 ความลับ 4 ตามล่าและทางออก 4
# คนของห้องเหมือนไฟล์ ก: เวลดิส ลีเซน โอเวส เพนดิส · เวลดิสเป็นผู้ปิดหีบจนตัวละครขึ้นยศ 4 เรื่องที่นางยังนั่งโต๊ะกัน max_rank: 3
# คนของสถาบันจากไบเบิล: ซาเบล เทอร์ริค (ความลับ 1) · อธิการบาเซล มอร์เทน (เอ่ยชื่อในความลับ 1) · คาสเซน ดูเวล (ความลับ 4)
# merit พิเศษ 5: ความลับ 1, 2, 3 อย่างละหนึ่ง ความลับ 4 สองทาง (เผา หรือเก็บไว้ในหีบ) · ความลับ 4 เป็นเรื่องเดียวที่ขยับ world.throne: เผา +1 ปล่อยให้คัด -1
# ธรรมเนียมใหม่ในไฟล์นี้: สมุดลงชื่อเผา (คนได้ตราลงชื่อก่อนหนึ่งบรรทัด ช่องของที่เผาเติมทีหลัง) · ตรา กุญแจ ทุกอย่างของห้องมีเลขทะเบียน
# hunted: { star_listeners: 1 } ในไฟล์นี้: เผาตำราฟังน้ำที่ปากบ่อ (งานยศสาม)

# ---------- งานยศสาม ----------
- id: adult.reclaim_duty_noble_chest
  stage: adult
  weight: 20
  time: dusk
  duty: reclaimers
  when:
    age: [26, 64]
    org: { id: reclaimers, min_rank: 3 }
  text: |
    บ้านหลังนี้มีประตูสามชั้น ชั้นแรกเปิดให้คนที่มาติดต่อ ชั้นที่สองเปิดให้นายอำเภอ ชั้นที่สามไม่เปิดให้ใคร เจ้าของบ้านเป็นขุนนางที่ประมูลหีบไม้มะเกลือใบหนึ่งมาจากกองมรดกของคนตาย ในหีบมีสมุดจดสองเล่มที่ยังมีลายน้ำของสถาบัน นายอำเภอรับเรื่องไว้สามฤดูแล้ว ยังไม่ว่างสักวัน

    {name}แบมือให้คนเฝ้าประตูชั้นที่สองดูตราทองเหลืองในฝ่ามือ ตรานี้เปิดบ้านได้โดยไม่ต้องรอนายอำเภอ คนเฝ้าประตูรู้เรื่องนี้ดีกว่าที่อยากรู้ เขาถอยให้ทาง

    ทางเดินไปห้องเก็บของยาวสิบห้าก้าว ปลายทางมีชายสองคนในเสื้อเกราะหนังยืนอยู่หน้าประตูชั้นที่สาม คนหนึ่งหลับตาพิงผนัง อีกคนลืมตา มือวางบนด้ามดาบสั้น เขาบอกว่าเจ้าบ้านจ้างเขามาเฝ้าหีบ ไม่ได้จ้างมาอ่านตรา
  encounter:
    foe: mercenary
    name: ยามรับจ้างหน้าหีบ
    morale: 2
    beats:
      - text: ชายที่ลืมตาก้าวออกมาหนึ่งก้าว ดาบยังอยู่ในฝัก คนที่หลับตาลืมตาขึ้นช้าๆ แล้วยืดตัวออกจากผนัง
        moves:
          - id: nc_show_seal
            label: ยื่นตราให้เขาดูใกล้ๆ บอกว่าค่าจ้างของเขาไม่ได้รวมค่าคุกของสถาบัน
            kind: talk
            parley: true
          - id: nc_read_lock
            label: ดูแม่กุญแจประตูชั้นที่สามว่าเป็นงานของใคร
            kind: read
            stat: INT
            success: แม่กุญแจทองเหลืองมีหมุดตัวที่สามตอกจากด้านล่าง งานช่างของสถาบัน สลักข้างในหมุนได้ถ้ากดตรงหมุดตัวนั้นแรงๆ
          - id: nc_step_back
            label: ถอยกลับออกไปทางประตูชั้นที่สอง
            kind: flee
      - text: ดาบสั้นออกจากฝักพร้อมกันสองเล่ม คนหนึ่งเข้าทางซ้าย อีกคนยืนขวางประตูไว้ ทางเดินแคบจนสองคนเดินคู่กันไม่ได้
        answer: guard
        moves:
          - id: nc_ledger_block
            label: ยกสำเนาสมุดบัญชีปกผ้าใบขึ้นรับคมดาบ
            kind: guard
          - id: nc_wall_lamp
            label: ปัดตะเกียงผนังให้ตกลงระหว่างเขากับ{name}
            kind: quick
            tags: [fire]
          - id: nc_knee
            label: เข้าชิดตัว ฟาดเข่าคนที่เข้ามาทางซ้าย
            kind: attack
            tags: [blunt]
          - id: nc_window
            label: กระโดดออกทางหน้าต่างเตี้ยของทางเดิน
            kind: flee
      - text: คนที่เข้ามาทางซ้ายถอยไปยืนหลังเพื่อน หอบ ตาเหลือบไปทางประตูชั้นที่สอง
        answer: talk
        moves:
          - id: nc_who_pays
            label: ถามว่าเจ้าบ้านจ่ายค่าจ้างงวดนี้แล้วหรือยัง
            kind: talk
            parley: true
            success: สองคนหันไปมองหน้ากัน คนหนึ่งตอบเสียงเบาว่ายังค้างสองงวด
          - id: nc_shoulder_door
            label: พุ่งไหล่ใส่ประตูชั้นที่สามจนกลอนหลุด
            kind: attack
            tags: [blunt]
          - id: nc_hold_corridor
            label: ยืนขวางทางเดินไว้ ไม่ให้เขาไปเรียกคนเพิ่ม
            kind: guard
          - id: nc_run_out
            label: วิ่งกลับออกไปทางที่มา
            kind: flee
    win:
      text: |
        ยามสองคนนั่งพิงผนังทางเดิน คนหนึ่งกุมเข่า อีกคนกุมข้อมือ ดาบสั้นสองเล่มวางเรียงบนพื้นตามธรรมเนียมคนรับจ้างที่แพ้ ประตูชั้นที่สามเปิดด้วยกุญแจจากเข็มขัดของคนกุมเข่า

        ในหีบมะเกลือมีสมุดจดสองเล่มกับจดหมายรักปึกหนึ่งของเจ้าบ้าน {name}เขียนใบรับสองใบวางทับจดหมายปึกนั้น ใบหนึ่งสำหรับสมุดสองเล่ม อีกใบสำหรับกลอนประตู ห้องไม่จ่ายค่าซ่อม แต่ใบรับบอกได้ว่ากลอนพังเพราะใคร
      effects: { reputation: { royal_institute: 1 }, flags: [took_the_nobles_two_notebooks] }
    lose:
      text: |
        {name}ล้มลงกลางทางเดิน ปลายดาบสั้นจ่อคอหอยอยู่ครู่หนึ่งแล้วถอยออกไป คนรับจ้างไม่ฆ่าคนของสถาบันในบ้านที่ยังไม่จ่ายค่าจ้าง เขาลากแขน{name}ออกไปทิ้งไว้หน้าประตูชั้นแรก ตราทองเหลืองโยนตามออกมา กระทบขั้นบันไดดังกริ๊ง

        {name}เขียนลงสำเนาบัญชีว่าของอยู่ในหีบมะเกลือ บ้านประตูสามชั้น รอนายอำเภอ แล้วนั่งรอนายอำเภออยู่ที่โรงเตี๊ยมหัวถนนจริงๆ อีกสามวัน จ่ายค่าห้องเอง
      effects: { gold: -2, flags: [thrown_out_of_the_nobles_house] }
    stalemate:
      text: |
        คนที่กุมข้อมือเปิดประตูชั้นที่สามให้ครึ่งบาน พอให้{name}เห็นหีบมะเกลือจากที่ยืน แล้วบอกว่าเท่านี้คือทั้งหมดที่ค่าจ้างของเขายอม {name}อ่านลายน้ำบนสันสมุดจากตรงนั้น ลอกเลขทะเบียนสองเลขลงสำเนาบัญชี

        ห้องได้เลขทะเบียน ไม่ได้ของ โอเวสลงบรรทัดนั้นด้วยคำที่ไม่เคยมีในสมุดบัญชีหาย เห็นแล้ว ยังไม่ได้รับ
      effects: { flags: [saw_the_nobles_chest] }
    flee:
      text: |
        {name}ออกมาถึงถนนก่อนเสียงฝีเท้าข้างหลังจะหยุด ตราทองเหลืองยังอยู่ในกำมือ ขอบตราบาดฝ่ามือเป็นรอยโค้ง

        ใบรับที่เขียนเตรียมไว้สองใบยังเสียบอยู่ในสำเนาบัญชี ไม่มีใครเซ็นรับ {name}ฉีกทั้งสองใบเป็นสี่ชิ้น แล้วเขียนหนังสือถึงนายอำเภอด้วยลายมือที่เอียงกว่าทุกวัน
      effects: { flags: [ran_from_the_nobles_guards] }
    parley:
      text: |
        คนที่ลืมตาก่อนเก็บดาบเข้าฝัก บอกว่าเจ้าบ้านค้างค่าจ้างเขามาสองงวด เขาไม่ตายแทนคนที่ค้างเงิน คนที่หลับตาส่งกุญแจประตูชั้นที่สามให้ แล้วขอว่าวันที่เจ้าบ้านถามหากุญแจ ช่วยเขียนใบรับให้ด้วย

        {name}เขียนให้จริง ใบรับสีงาช้างหนึ่งใบ เลขทะเบียนของสมุดสองเล่ม ลายมือชื่อของ{name} ท้ายใบเขียนเพิ่มว่ากุญแจได้รับจากยามที่ไม่ได้ค่าจ้าง ยามคนนั้นพับใบรับเก็บใส่อกเสื้อเกราะ เหมือนคนเก็บค่าจ้างงวดแรกที่ได้
      effects: { stats: { CHA: 1 }, flags: [talked_past_the_nobles_guards] }
    death:
      text: |
        ดาบสั้นเข้าทางซ้ายในจังหวะที่{name}หันไปดูแม่กุญแจ คนรับจ้างไม่ได้ตั้งใจแทงลึกขนาดนั้น เขาพูดอย่างนั้นกับคนเฝ้าประตูชั้นที่สองตอนช่วยกันยก{name}ออกมา ตราทองเหลืองหลุดจากมือ กลิ้งไปหยุดอยู่ใต้หีบมะเกลือ

        นายอำเภอมาถึงในอีกสามวัน เขาเปิดประตูชั้นที่สามด้วยชื่อของตัวเอง หยิบตราใต้หีบขึ้นมา แล้วส่งกลับไปที่ห้องใต้หอสมุดพร้อมสมุดจดสองเล่ม

- id: adult.reclaim_duty_water_book
  stage: adult
  weight: 20
  time: dusk
  duty: reclaimers
  when:
    age: [26, 64]
    org: { id: reclaimers, min_rank: 3 }
  text: |
    ตำราฟังน้ำใต้ดินเล่มนี้ออกมาจากสำนักกลั่น เขียนไว้ให้นักเรียนหัดฟังเสียงน้ำผ่านชั้นหิน บรรทัดของเล่มนี้ในสมุดบัญชีหายมีหมายเหตุสามบรรทัด คนอ่านสามคน ทั้งสามขุดลงไปตามเสียงที่ได้ยิน ไม่มีใครขึ้นมา

    รอยพา{name}มาถึงหมู่บ้านบนเนินแล้ง หมู่บ้านนี้มีบ่อดีอยู่บ่อเดียว ช่างขุดบ่อขุดได้เพราะเล่มนี้ และทุกหน้าแล้งเขาลงไปลึกกว่าเดิม คืนนี้เขาอยู่ข้างล่าง เมียของเขานั่งที่ปากบ่อ เชือกพันมือไว้สองรอบ นางเล่าว่าเมื่อคืนเขาขึ้นมาบอกว่าใต้น้ำมีอีกเสียง เสียงเดียวกับที่ได้ยินตอนแหงนดูฟ้าคืนเดือนมืด

    กฎของห้องมีข้อเดียว เกินสามคนให้เข้าหีบ ช่างขุดบ่อยังไม่ใช่คนที่สี่ ตราทองเหลืองอยู่ในกระเป๋าเสื้อของ{name} กล่องตะกั่วกับเหล็กไฟอยู่ในย่ามด้วยกัน เชือกที่ปากบ่อตึงขึ้นทีละนิด
  choices:
    - id: back_to_the_shelf
      label: เขียนใบรับ แล้วส่งเล่มนี้กลับขึ้นชั้นของหอสมุด
      text: |
        ช่างขุดบ่อขึ้นมาตอนฟ้าเกือบมืด เล็บดำถึงโคน ใบหูข้างหนึ่งมีเลือดแห้งเป็นเส้น เขาส่งเล่มให้เมื่อเห็นใบรับ ถามคำเดียวว่าเด็กที่จะได้อ่านต่อมีใครถือเชือกให้ไหม

        {name}เขียนคำตอบลงช่องหมายเหตุของใบส่งขึ้นชั้น ห้ามยืมออกคนเดียว ต้องมีคนถือเชือก บรรณารักษ์ข้างบนจะเข้าใจหรือไม่ก็สุดแท้แต่ ใบรับสีงาช้างของหมู่บ้านนี้ ช่างขุดบ่อตอกตะปูติดไว้กับไม้ค้ำปากบ่อ
      effects: { stats: { WIS: 1 }, reputation: { royal_institute: 1 }, flags: [shelved_the_water_book] }
    - id: into_the_chest
      label: ลงกล่องตะกั่ว ส่งเข้าหีบ นับช่างขุดบ่อเป็นคนที่สี่ก่อนเขาจะตาย
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}นั่งลงข้างเมียช่างขุดบ่อ ช่วยนางถือเชือก แล้วพูดลงไปในบ่อ เล่าเรื่องคนอ่านสามคนก่อนหน้าทีละคน ชื่อ หมู่บ้าน ความลึกที่แต่ละคนหยุด เสียงลงไปถึงข้างล่างช้ากว่าที่คิด ก่อนรุ่งสางเชือกกระตุกสามครั้ง ช่างขุดบ่อขึ้นมาเอง ยื่นเล่มให้ด้วยมือที่ยังสั่น

          {name}บัดกรีฝากล่องตะกั่วสามจุดตรงปากบ่อ แล้วเขียนบรรทัดที่สี่ลงสำเนาบัญชี ช่องคนอ่านเป็นชื่อของคนที่ยังหายใจอยู่ ช่องผลเว้นว่างไว้
        effects: { stats: { CHA: 1 }, flags: [chested_the_water_book] }
      failure:
        text: |
          ช่างขุดบ่อไม่ขึ้น เขาตะโกนขึ้นมาว่าหน้าแล้งหน้าหมู่บ้านจะเอาน้ำจากไหน {name}ไต่เชือกลงไปเอง เชือกกินฝ่ามือทั้งสองข้างระหว่างทาง ข้างล่างเย็นจนกระดูกปวด เขาไม่สู้ เขาแค่ไม่ยอมปล่อยมือจากเล่ม

          ทั้งสองขึ้นมาด้วยกันตอนสาย เล่มขาดเป็นสองซีกตรงสัน ซีกหน้าลงกล่องตะกั่ว ซีกหลังอยู่ในกำมือช่างขุดบ่อ {name}เขียนใบรับให้เขาครึ่งเล่ม
        effects: { hp: -2, flags: [chested_half_the_water_book] }
    - id: burn_it_at_the_well
      label: เผาเล่มนี้ที่ปากบ่อ แล้วลงชื่อกำกับ
      text: |
        กระดาษของสำนักกลั่นไหม้ช้า หน้าที่มีภาพตัดของชั้นหินลุกเป็นไฟสีเหลืองอมเขียว ช่างขุดบ่อขึ้นมาทันเห็นหน้าสุดท้ายม้วนตัว เขาไม่ด่า เขานั่งลงข้างกองไฟ ยื่นมือออกไปอังเหมือนคืนหนาว

        กลับถึงห้อง{name}ลงชื่อในสมุดลงชื่อเผา วันที่ เลขทะเบียน ชื่อ เดือนต่อมามีคนแปลกหน้าแวะมาถามหาช่างขุดบ่อ ถามว่าเล่มที่เขาเคยอ่านไปอยู่ที่ไหน เมียช่างขุดบ่อบอกชื่อ{name}ไปตามที่จำได้ คนแปลกหน้าห้อยแว่นส่องดาวไว้ที่คอ
      effects: { alignment: { law: 1 }, hunted: { star_listeners: 1 }, flags: [burned_the_water_book] }
    - id: leave_it_with_the_digger
      label: เขียนในสำเนาบัญชีว่ายังตามไม่ถึง แล้วเดินลงเนินมือเปล่า
      refuse: true
      text: |
        {name}ช่วยเมียช่างขุดบ่อดึงเชือกจนเขาขึ้นมา คืนนั้นกินข้าวบ้านเขา ข้าวต้มใส่ถั่วกับน้ำจากบ่อเดียวของหมู่บ้าน น้ำเย็นและจืดสนิท

        บรรทัดนี้ในสำเนาบัญชีได้คำว่ายังตามไม่ถึงต่อท้าย หน้าแล้งถัดมามีข่าวลงเนินมาถึง{name} ข่าวไม่ได้บอกว่าช่างขุดบ่อยังขึ้นมาได้อยู่หรือเปล่า บอกแค่ว่าหมู่บ้านบนเนินมีบ่อดีเพิ่มเป็นสองบ่อ
      effects: { alignment: { moral: 1, law: -1 }, flags: [left_the_water_book_with_the_digger] }

# ---------- เลื่อนยศ ----------
- id: adult.reclaim_rise_tracker
  stage: adult
  scene: library
  weight: 60
  must: true
  time: night
  mark: ขึ้นเป็นคนตามรอย
  when:
    age: [19, 80]
    org: { id: reclaimers, min_rank: 1, max_rank: 1, ready: true }
  text: |
    ลีเซนดับตะเกียงบนโต๊ะเทียบเลข ห้องใต้หอสมุดมืดจนเห็นแต่ขอบประตูที่แสงจากบันไดรั่วลงมา นางวางของลงในมือ{name}ทีละชิ้น กระดาษแผ่นหนึ่ง โหลแก้วใบเล็ก เครื่องวัดทองเหลืองที่ยังอุ่นจากมือนาง แล้วบอกให้อ่าน

    ตราของสถาบันอ่านด้วยปลายนิ้วก่อนอ่านด้วยตา ลายน้ำในกระดาษบางกว่าเนื้อรอบข้างเท่าเส้นผม รอยบัดกรีก้นโหลนูนเท่าเมล็ดงา หมุดตัวที่สามของเครื่องทองเหลืองตอกจากด้านล่างเสมอ ถ้าตอกจากด้านบน ของชิ้นนั้นผ่านมือเพนดิสมาแล้ว นางพูดเร็ว ไม่พูดซ้ำ

    พอตะเกียงจุดอีกครั้ง ลีเซนฉีกบรรทัดหนึ่งออกจากสำเนาบัญชีของนางเองยื่นให้ เครื่องวัดความชื้นทองเหลือง ออกจากสถาบันไปกับนักเรียนฝึกงาน ไปจบที่งานประมูลข้าวของคนตาย คนซื้อสามคน บรรทัดนี้{name}ตามคนเดียว
  choices:
    - id: read_three_rivets
      label: ไปให้ครบทั้งสามบ้าน ขอดูหมุดตัวที่สามของทุกชิ้น
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          บ้านแรกเป็นของปลอม หมุดตอกจากด้านบน บ้านที่สองเป็นโรงขนมปัง เครื่องวัดแขวนอยู่เหนือรางแป้ง คนทำขนมดูเข็มทุกเช้าว่าแป้งจะขึ้นวันนี้หรือพรุ่งนี้ หมุดตัวที่สามตอกจากด้านล่าง ปลายนิ้วของ{name}รู้ก่อนตา

          {name}เขียนใบรับบนเขียงนวดแป้ง คนทำขนมรับด้วยมือที่เปื้อนแป้ง ใบรับขาวไปครึ่งใบ แล้วเขาถามว่าพรุ่งนี้จะรู้ได้ยังไงว่าแป้งจะขึ้น ลีเซนอ่านเรื่องนี้ในรายงาน เขียนต่อท้ายบรรทัดไว้สามคำ ให้ดมแป้ง
        effects: { org: { id: reclaimers, promote: true }, stats: { WIS: 1 }, flags: [read_the_bakers_rivet] }
      failure:
        text: |
          ปลายนิ้วบอก{name}ว่าชิ้นในบ้านแรกตอกจากด้านล่าง ใบรับเขียนไปแล้วหนึ่งใบ ชิ้นจริงอยู่บ้านที่สอง แขวนเหนือรางแป้งของโรงขนมปัง {name}ต้องเดินกลับไปคืนของปลอมให้บ้านแรก ขอใบรับใบนั้นคืน แล้วจ้างเกวียนวนกลับไปบ้านที่สองด้วยเงินตัวเอง

          ลีเซนอ่านรายงานจบ ไม่ติ ไม่ชม นางฉีกบรรทัดใหม่จากสำเนาของนางส่งให้อีกบรรทัด
        effects: { org: { id: reclaimers, promote: true }, gold: -2, flags: [misread_the_first_rivet] }
    - id: ask_the_auction_clerk
      label: ไปหาเสมียนงานประมูลก่อน ถามว่าใครซื้ออะไรไปกี่เหรียญ
      text: |
        เสมียนงานประมูลจำได้ทุกราคา จำไม่ได้สักหน้า สมุดของเขาบอกว่าเครื่องวัดทองเหลืองขายออกไปชิ้นเดียว อีกสองชิ้นที่ลือกันเป็นของที่คนซื้อเหมาไปทั้งหีบ ไม่ได้ลงรายการ {name}เดินไปบ้านเดียว ได้ของก่อนบ่าย

        ลีเซนฟังแล้วบอกว่าคนตามรอยครึ่งหนึ่งตามของ อีกครึ่งตามสมุดของคนอื่น นางให้{name}เขียนชื่อเสมียนคนนั้นลงสมุดคนที่ห้องเคยเจอ ใต้ชื่อพ่อค้าปลาเค็มที่จำได้ทุกเรือที่เข้าท่า
      effects: { org: { id: reclaimers, promote: true }, stats: { CHA: 1 }, flags: [traced_by_the_auction_book] }
    - id: ask_lisen_her_first_line
      label: ถามลีเซนว่าบรรทัดแรกที่นางตามคนเดียวเป็นของอะไร
      text: |
        ลูกข่างทองเหลืองของสำนักจักรกลเวท ลูกข่างที่หมุนได้ครึ่งคืนโดยไม่ล้ม นางตอบเร็วเหมือนตอบเลขทะเบียน แล้วพลิกสำเนาบัญชีของนางไปหน้าแรก บรรทัดบนสุดยังไม่มีเส้นขีด ขอบกระดาษรอบบรรทัดนั้นดำเพราะนิ้วโป้ง

        {name}ออกเดินตามบรรทัดของตัวเองในเช้าวันต่อมา ในย่ามมีลูกข่างไม้ที่ซื้อจากแผงท้ายตลาด ไว้ให้ลีเซนดูว่าลูกข่างธรรมดาหมุนได้นานแค่ไหน
      effects: { org: { id: reclaimers, promote: true }, flags: [heard_lisens_first_line] }

- id: adult.reclaim_rise_seal
  stage: adult
  scene: library
  weight: 60
  must: true
  time: night
  mark: ได้ถือตราทวง
  when:
    age: [19, 80]
    org: { id: reclaimers, min_rank: 2, max_rank: 2, ready: true }
  text: |
    ตราทองเหลืองของห้องนอนอยู่ในลิ้นชักโต๊ะของเวลดิส ห่อผ้าสักหลาดทีละอัน เวลดิสหยิบอันหนึ่งออกมาด้วยมือซ้าย มือขวายังเขียนบัญชีต่อไม่หยุด หน้าตราเป็นตะเกียงของสถาบัน ใต้ตะเกียงมีเลขทะเบียนสลักไว้ ตราก็มีเลขทะเบียน ถ้าหายก็ลงสมุดบัญชีหายเหมือนของชิ้นอื่น

    นางเลื่อนสมุดเล่มแคบปกหนังดำมาให้พร้อมกัน สมุดลงชื่อเผา หน้าต้นเล่มหมึกซีดจนเป็นสีน้ำตาล บรรทัดหนึ่งมีสามช่อง วันที่ ของที่เผา ลายมือชื่อ แทรกอยู่ระหว่างบรรทัดเหล่านั้นมีบางบรรทัดที่มีแต่ชื่อ ช่องของที่เผาว่าง

    เวลดิสบอกว่าคนที่ได้ตราลงชื่อก่อนหนึ่งบรรทัด ก่อนจะเผาอะไรสักอย่าง ของชิ้นแรกค่อยเขียนเติมทีหลัง บรรทัดถัดไปที่ว่างอยู่เป็นของ{name}
  choices:
    - id: sign_the_next_line
      label: ลงชื่อเต็มในบรรทัดถัดไป เว้นช่องของที่เผาไว้
      text: |
        ปากกาของห้องหนักกว่าปากกาที่{name}ใช้ทุกวัน หมึกลงกระดาษช้า ลายมือชื่อในบรรทัดนั้นออกมาตรงกว่าทุกครั้งที่เคยเซ็น เวลดิสเป่าหมึกให้แห้งด้วยลมหายใจเดียว ไม่อ่านซ้ำ

        ตราทองเหลืองอุ่นอยู่ในกำมือ{name}ไปจนถึงบันไดขั้นบนสุด ช่องว่างในบรรทัดนั้นรออยู่ในลิ้นชักของเวลดิส
      effects: { org: { id: reclaimers, promote: true }, items: [reclaim_brass_seal], alignment: { law: 1 }, flags: [signed_the_burning_book] }
    - id: ask_about_the_empty_lines
      label: ถามว่าบรรทัดที่มีแต่ชื่อเป็นของใคร
      text: |
        เวลดิสชี้ทีละบรรทัดด้วยปลายปากกาข้างซ้าย คนนี้ส่งทุกอย่างเข้าหีบจนวันตาย คนนี้ตกเรือข้ามฟากก่อนได้เผาอะไร คนนี้ลาออกไปขายผ้าที่ท่าเรือ มือขวาของนางเขียนบัญชีไปตลอดเวลาที่เล่า

        นางบอกว่าในสมุดเล่มนี้ทั้งสามแบบหน้าตาเหมือนกัน {name}ลงชื่อในบรรทัดว่าง ใต้คนที่ลาออกไปขายผ้า
      effects: { org: { id: reclaimers, promote: true }, items: [reclaim_brass_seal], stats: { WIS: 1 }, flags: [asked_about_the_empty_lines] }
    - id: find_veldis_line
      label: เปิดหาบรรทัดของเวลดิสก่อนลงชื่อ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          บรรทัดของเวลดิสอยู่กลางเล่ม {name}หาเจอจากลายมือ ไม่ใช่จากชื่อ ช่องชื่อกับช่องของที่เผาหมึกสีเดียวกัน เส้นหนาเท่ากัน เขียนพร้อมกันด้วยสองมือ ของชิ้นแรกที่นางเผาคือสมุดจดของอาจารย์ที่ปรึกษาของนางเอง

          เวลดิสเห็นว่าเปิดค้างอยู่หน้านั้น นางไม่ปิด นางเลื่อนตราทองเหลืองไปวางทับบรรทัดของตัวเองพอดี แล้วรอให้{name}ยกขึ้นเอง
        effects: { org: { id: reclaimers, promote: true }, items: [reclaim_brass_seal], stats: { INT: 1 }, flags: [found_veldis_first_burning] }
      failure:
        text: |
          {name}พลิกเร็วเกินไป ศอกปัดขวดหมึกของเวลดิสล้ม หมึกดำไหลลงขอบสมุดสี่หน้า หน้ากระดาษติดกันเป็นปึก เวลดิสยกสมุดขึ้นด้วยมือซ้าย มือขวาเขียนใบรับค่าช่างเย็บเล่มไปพร้อมกัน

          ใบรับใบนั้นมีชื่อ{name}อยู่ในช่องคนจ่าย บรรทัดว่างท้ายเล่มที่{name}ลงชื่อในคืนนั้นมีรอยนิ้วหมึกดำติดอยู่ที่มุม
        effects: { org: { id: reclaimers, promote: true }, items: [reclaim_brass_seal], gold: -2, flags: [spilled_ink_on_the_burning_book] }

- id: adult.reclaim_rise_closer
  stage: adult
  scene: library
  weight: 60
  must: true
  time: night
  mark: ขึ้นเป็นผู้ปิดหีบ
  when:
    age: [19, 80]
    org: { id: reclaimers, min_rank: 3, max_rank: 3, ready: true }
  text: |
    เวลดิสเขียนสองอย่างพร้อมกันเป็นครั้งสุดท้ายในห้องนี้ มือขวาเขียนบรรทัดสุดท้ายของบัญชีห้องหีบ จำนวนของที่เข้า ไม่มีช่องออก มือซ้ายเขียนใบรับสีงาช้างหนึ่งใบ ได้รับกุญแจห้องหีบหนึ่งดอก ช่องลายมือชื่อเว้นว่าง

    กุญแจวางอยู่ระหว่างสองมือของนาง เหล็กสีดำยาวเท่าฝ่ามือ ร้อยเชือกหนังเก่า เวลดิสบอกว่าพรุ่งนี้นางจะขึ้นไปนั่งอ่านหนังสือในหอสมุดข้างบนด้วยบัตรยืมเหมือนคนอื่น นางไม่เคยมีบัตรยืม

    โอเวสยืนอยู่ที่ประตู พูดเลขทะเบียนของกุญแจดอกนั้นเบาๆ หนึ่งครั้ง
  choices:
    - id: sign_for_the_key
      label: ลงชื่อในใบรับกุญแจ แล้วหยิบกุญแจจากโต๊ะ
      text: |
        {name}ลงชื่อ เวลดิสฉีกใบรับออกจากเล่ม พับครึ่งส่งให้ เก็บต้นขั้วไว้ในสมุดของห้อง ใบรับนั้นมีไว้บอกคนที่มาถามทีหลังว่ากุญแจไปอยู่กับใคร

        เชือกหนังยังอุ่นจากคอของนาง คืนนั้น{name}ไขห้องหีบคนเดียว ยืนอยู่ที่ธรณีจนน้ำมันในตะเกียงพร่องไปหนึ่งในสาม
      effects: { org: { id: reclaimers, promote: true }, alignment: { law: 1 }, flags: [signed_for_the_chest_key] }
    - id: ask_what_she_never_found
      label: ถามนางว่ามีอะไรที่นางตามมาทั้งชีวิตแล้วยังไม่เจอ
      text: |
        เวลดิสไม่ต้องคิด มือซ้ายเขียนคำตอบลงกระดาษเปล่า ขณะมือขวาเขียนเลขชิ้นสุดท้ายในบัญชี สมุดจดของโอเดล คอร์ดิส เล่มที่หายไปก่อนจะมีห้องนี้ นางเชื่อว่าเป็นเล่มที่เขาเขียนว่าน้ำค้างดาวคืออะไรจริงๆ และเชื่อว่าคนที่ถือมันอยู่คือผู้ฟังดาว

        นางพับกระดาษแผ่นนั้นใส่มือ{name}พร้อมกุญแจ บอกว่าเชื่อกับรู้ลงคนละช่อง กระดาษแผ่นนั้นนางเขียนหัวไว้ว่าเชื่อ
      effects: { org: { id: reclaimers, promote: true }, stats: { WIS: 1 }, flags: [heard_veldis_on_the_cordis_book] }
    - id: ask_her_to_stay
      label: ขอให้นางอยู่ต่ออีกฤดูหนึ่ง
      text: |
        มือขวาของเวลดิสเขียนต่อไม่หยุด มือซ้ายเขียนคำว่าไม่ลงที่มุมใบรับ ตัวเล็กเท่ามด แล้วขีดฆ่า เขียนคำเดิมซ้ำข้างๆ ให้ตัวใหญ่ขึ้น

        วันต่อมา{name}เห็นนางที่โต๊ะริมหน้าต่างของหอสมุดข้างบน บัตรยืมสีขาวใหม่เอี่ยมวางอยู่ข้างข้อศอก นางอ่านหนังสือสองเล่มที่เปิดคู่กัน มือซ้ายจดลงสมุดเล่มเล็กของเล่มซ้าย มือขวาจดของเล่มขวา
      effects: { org: { id: reclaimers, promote: true }, flags: [asked_veldis_to_stay] }

- id: adult.reclaim_passed_over
  stage: adult
  scene: library
  weight: 30
  time: night
  when:
    age: [24, 64]
    org: { id: reclaimers, max_rank: 3, min_refused: 3 }
  text: |
    โอเวสเรียก{name}ไปที่โต๊ะคัดสำเนา เปิดสมุดคนที่ห้องเคยเจอไปหน้าที่มีชื่อ{name} ใต้ชื่อมีบรรทัดเล็กๆ ไล่ลงมา บรรทัดละงาน ส่วนใหญ่ลงท้ายด้วยคำว่ารับ หลายบรรทัดลงท้ายด้วยคำว่าไม่รับ ลายมือของโอเวสทั้งหมด

    เขาบอกว่าคนในห้องที่ไม่รับงานถึงจำนวนนี้ เขาต้องคัดชื่อลงอีกเล่ม แล้วเลื่อนสมุดบัญชีหายเล่มที่เปิดอยู่มาให้ดู บรรทัดล่างสุดเป็นชื่อของ{name} มีเลขทะเบียนกำกับ ช่องที่อยู่ล่าสุดเขียนว่ายังอยู่ในห้อง ช่องสภาพเว้นว่าง

    โอเวสจำเลขทะเบียนได้มากกว่าจำหน้าคน เขาพูดเลขของ{name}ออกมาหนึ่งครั้ง ชัดทุกตัว
  choices:
    - id: ask_for_three_lines
      label: ขอสามบรรทัดถัดไปของสำเนาบัญชีมาตามติดกัน
      text: |
        โอเวสฉีกให้สามบรรทัด {name}ตามครบในฤดูเดียว ชิ้นแรกอยู่ในโรงรับจำนำ ชิ้นที่สองเป็นที่ทับกระดาษบนโต๊ะครูประจำหมู่บ้าน ชิ้นที่สามอยู่ในหลุมศพกับเจ้าของ ใบรับใบที่สามเขียนให้ลูกสาวที่ยืนอยู่ข้างหลุม ช่องสภาพเขียนว่าฝังแล้ว

        ฤดูถัดมาโอเวสขีดเส้นเดียวผ่านบรรทัดชื่อ{name}ในสมุดบัญชีหาย เส้นตรง ไม่เอียง เลขทะเบียนยังอ่านออกใต้เส้นนั้น
      effects: { reputation: { royal_institute: 1 }, flags: [took_three_lines_in_a_row] }
    - id: argue_each_line
      label: ชี้ทีละบรรทัด บอกว่าทุกครั้งที่ไม่รับมีเหตุผล
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          โอเวสฟังจนครบทุกบรรทัด ไม่ขัด พอจบเขาจุ่มปากกา เขียนเหตุผลของ{name}ลงข้างคำว่าไม่รับทีละบรรทัด ตัวเล็กเท่ามด สั้นกว่าที่{name}พูดครึ่งหนึ่ง แต่ไม่ขาดสักข้อ

          บรรทัดชื่อ{name}ในสมุดบัญชีหายยังอยู่ ช่องสภาพมีคำเพิ่มขึ้นมาหนึ่งคำ ลายมือโอเวส มีเหตุผล
        effects: { stats: { CHA: 1 }, flags: [lettered_the_refusals] }
      failure:
        text: |
          โอเวสฟังจบแล้วอ่านเลขทะเบียนของของที่ไม่มีใครรับไปตามทีละเลข พร้อมที่อยู่ล่าสุดของแต่ละชิ้น เลขสุดท้ายเป็นเลขที่{name}เพิ่งปฏิเสธเมื่อเดือนก่อน

          {name}ออกตามเลขนั้นเองในคืนเดียวกัน จ่ายค่าเรือข้ามฟากไปกลับด้วยเงินตัวเอง ของชิ้นนั้นข้ามแม่น้ำไปกับคนซื้อตั้งแต่สัปดาห์ก่อน
        effects: { gold: -2, flags: [argued_the_refusals] }
    - id: copy_through_the_night
      label: นั่งลงที่โต๊ะคัดสำเนา ช่วยโอเวสคัดจนรุ่ง
      text: |
        โอเวสไม่ขอบคุณ เขาเลื่อนตะเกียงมาตรงกลางโต๊ะให้แสงตกทั้งสองฝั่งเท่ากัน ทั้งคืนในห้องมีแต่เสียงปากกาสองด้ามกับเสียงโอเวสพูดเลขทะเบียนออกมาเป็นระยะ ให้{name}จดตาม

        ตอนรุ่งสาง บรรทัดชื่อ{name}ในสมุดบัญชีหายยังไม่มีเส้นขีด ช่องสภาพมีคำเพิ่มขึ้นมาสองคำ ลายมือโอเวส ยังทำงาน
      effects: { flags: [copied_through_the_night_with_oves] }
    - id: name_the_village_herbal
      label: บอกโอเวสว่าบรรทัดไม่รับบรรทัดหนึ่งคือตำรายาของยายอาเดล
      requires: { flag: left_the_village_herbal }
      text: |
        โอเวสพูดเลขทะเบียนของตำรายาเล่มนั้นก่อน{name}จะเล่าจบ แล้วเปิดสมุดบัญชีหายไปหน้านั้น ข้างบรรทัดมีคำว่าตามไม่พบ ลายมือของ{name}เอง

        เขาหยิบมีดขูดหมึกเล่มเล็ก ขูดคำว่าไม่รับข้างชื่อ{name}ออกหนึ่งคำ เขียนแทนว่าปล่อยไว้กับคนใช้ แล้วพลิกไปขูดคำว่าตามไม่พบข้างบรรทัดตำรายา เขียนคำเดียวกันลงไป เลขทะเบียนของเล่มนั้นไม่ต้องกลับไปอยู่ในกองที่ต้องตามใหม่อีก
      effects: { alignment: { moral: 1 }, flags: [named_the_village_herbal_to_oves] }

# ---------- ความลับ ----------
- id: adult.reclaim_secret_no_way_out
  stage: adult
  scene: library
  weight: 25
  time: night
  when:
    age: [24, 64]
    org: { id: reclaimers, min_rank: 2, max_rank: 3 }
  text: |
    ซาเบล เทอร์ริค อาจารย์ที่ปรึกษาของสำนักกลั่น ลงบันไดมาถึงห้องบัญชีหายตอนเกือบเที่ยงคืน ถุงมือหนังยังสวมอยู่ทั้งสองข้าง นางวางกระดาษแผ่นหนึ่งลงบนโต๊ะของเวลดิส คำขอคืนโหลใบหนึ่งที่ห้องรับไปเมื่อสองฤดูก่อน โหลจากห้องเงียบของสำนักกลั่น ท้ายกระดาษมีลายมือชื่อของอธิการบาเซล มอร์เทน

    เวลดิสอ่านโดยวางมือซ้ายทาบกระดาษ มือขวาเขียนอะไรบางอย่างไปพร้อมกัน แล้วบอกว่าโหลใบนั้นเข้าหีบแล้ว ซาเบลบอกว่าอธิการลงชื่อแล้ว เวลดิสบอกว่าอธิการลงชื่อทุกเรื่อง

    นางฉีกสิ่งที่มือขวาเขียนออกจากเล่มยื่นให้ซาเบล ใบรับคำขอหนึ่งฉบับ ซาเบลพับใส่กระเป๋าเสื้อแล้วขึ้นบันไดไป บัญชีห้องหีบของเวลดิสเปิดค้างอยู่บนโต๊ะ {name}เห็นได้จากที่นั่ง หน้ากระดาษตีเส้นไว้ช่องเดียว ช่องเข้า
  choices:
    - id: ask_why_no_out
      label: ถามเวลดิสว่าทำไมบัญชีห้องหีบไม่มีช่องออก
      text: |
        เวลดิสตอบโดยไม่เงยหน้า ประโยคเดียว ห้องนี้ไม่ได้ตามของกลับมาให้ใครใช้ ห้องนี้ตามของกลับมาให้หยุด มือซ้ายของนางขีดเส้นใต้คำว่าเข้าไปพร้อมกับที่พูด

        ก่อนขึ้นบันได{name}นับบรรทัดในหน้านั้นได้สี่สิบเอ็ดบรรทัด ทุกบรรทัดลงวันที่ ไม่มีบรรทัดไหนมีเส้นขีดฆ่า
      effects: { stats: { WIS: 1 }, flags: [learned_the_chest_has_no_out] }
    - id: follow_sabel_up
      label: ตามซาเบลขึ้นบันได บอกนางตรงๆ ว่าโหลใบนั้นจะไม่ออกมาอีก
      text: |
        ซาเบลหยุดที่ขั้นที่สิบ ฟังจนจบ แล้วบอกว่ารู้อยู่แล้ว ที่ลงมาก็เพื่อเอาใบรับไปยื่นให้คนข้างบน สำนักกลั่นไม่เคยเททิ้งโหลจากห้องเงียบสักใบ ใบนี้ใบแรกที่หายไปจากชั้น นางยื่นมือให้{name}จับ ถุงมือยังสวมอยู่

        ผ่านหนังถุงมือชั้นหนึ่ง นิ้วของนางยังเย็นจนข้อนิ้วของ{name}ชาไปถึงข้อมือ
      effects: { stats: { CHA: 1 }, flags: [told_sabel_the_jar_stays] }
    - id: answer_the_requests
      label: ขอรับหน้าที่เขียนคำตอบคำขอแบบนี้แทนเวลดิส
      text: |
        เวลดิสดึงลิ้นชักล่างสุดออกมา ข้างในเป็นคำขอคืนของปึกหนาจนลิ้นชักปิดไม่สนิท ทุกฉบับมีลายมือชื่ออธิการ ทุกฉบับมีต้นขั้วใบรับคำขอเย็บติดไว้ที่มุม

        ฤดูนั้น{name}เขียนใบรับคำขอไปสิบเอ็ดใบ คำในใบเหมือนกันทุกใบ เข้าหีบแล้ว อาจารย์คนที่สิบเอ็ดฉีกใบรับทิ้งต่อหน้า {name}เขียนใบใหม่ให้อีกใบ
      effects: { org: { id: reclaimers, merit: 1 }, alignment: { law: 1 }, flags: [answered_the_chest_requests] }

- id: adult.reclaim_secret_cordis_seven
  stage: adult
  scene: library
  weight: 25
  time: night
  when:
    age: [26, 64]
    org: { id: reclaimers, min_rank: 3, max_rank: 3 }
  text: |
    เพนดิสขายหน้ากระดาษให้ห้องหนึ่งแผ่น ราคาเท่าสมุดทั้งเล่ม ขอบซ้ายขาดเป็นฟันเลื่อยตรงรอยเย็บ ลายมือเอียงซ้ายเขียนตัวเลขกับคำสั้นๆ หมึกกลายเป็นสีน้ำตาลเพราะอายุ เพนดิสบอกว่าเป็นลายมือของโอเดล คอร์ดิส เขาบอกแบบนี้กับทุกแผ่นที่เอามาขาย

    เวลดิสไม่เถียง นางลุกจากโต๊ะ ปลดกุญแจดำจากคอ แล้วพา{name}เข้าห้องหีบ ข้างในเย็นกว่าห้องข้างนอกจนเห็นลมหายใจ ชั้นไม้สูงจรดเพดาน ทุกช่องมีกล่องตะกั่วหรือห่อผ้าติดป้าย

    ชั้นกลางชั้นหนึ่งมีสมุดปกหนังเจ็ดเล่มวางเรียง สันเขียนเลขด้วยลายมือเอียงซ้ายแบบเดียวกับหน้ากระดาษในมือ สองถึงแปด ประวัติที่สถาบันเขียนไว้บอกว่าคอร์ดิสทิ้งสมุดจดไว้เล่มเดียว และเล่มนั้นหายไปจากห้องของเขา ช่องแรกของชั้นว่าง
  choices:
    - id: match_the_page
      label: เทียบหน้ากระดาษกับเล่มสองทีละบรรทัด
      check: { stat: INT, dc: 14 }
      success:
        text: |
          บรรทัดสุดท้ายของหน้ากระดาษขาดกลางประโยค บรรทัดแรกของเล่มสองต่อประโยคนั้นจนจบ ตัวเลขชุดเดียวกัน หน่วยเดียวกัน หมึกจางเท่ากัน หน้านี้หลุดมาจากท้ายเล่มที่หนึ่ง

          เวลดิสวางหน้ากระดาษลงในช่องที่ว่าง แผ่นเดียวบางจนแทบไม่เห็นบนเนื้อไม้ แล้วออกไปเขียนบรรทัดใหม่ในบัญชี เล่มที่หนึ่งยังมีอยู่ มีคนฉีกขายทีละหน้า คนซื้อหน้าแรกคือห้องนี้
        effects: { org: { id: reclaimers, merit: 1 }, stats: { INT: 1 }, flags: [matched_the_cordis_page] }
      failure:
        text: |
          ตะเกียงดวงเดียวในห้องเย็นทำให้ตาพร่าตั้งแต่บรรทัดที่สาม ลายมือในหน้ากระดาษกับในเล่มสองเหมือนกันจน{name}เชื่อว่าเหมือนเกินไป {name}บอกเวลดิสว่าเป็นของปลอมที่ทำดี เวลดิสจ่ายเพนดิสตามราคาอยู่ดี แล้วเขียนใบรับค่าน้ำมันตะเกียงคืนนั้นให้{name}จ่ายครึ่งหนึ่ง

          สามฤดูต่อมาโอเวสพบว่าตัวเลขตัวสุดท้ายของหน้านั้นเป็นตัวเลขตัวแรกของเล่มสอง เขาจดไว้ในสมุดของเขา แล้วไม่บอกใคร
        effects: { gold: -1, flags: [misjudged_the_cordis_page] }
    - id: ask_why_never_existed
      label: ถามว่าทำไมประวัติของสถาบันบอกว่าคอร์ดิสมีสมุดเล่มเดียว
      text: |
        เวลดิสบอกว่าสถาบันเขียนประวัติของตัวเองจากของที่อยู่บนชั้น เจ็ดเล่มนี้ลงมาถึงห้องหีบก่อนจะมีใครนั่งเขียนประวัติเล่มนั้น นางพูดเรียบเหมือนบอกราคากระดาษ

        {name}เปิดเล่มแปดดูหน้าสุดท้าย ลายมือเอียงซ้ายหดเล็กลงทีละบรรทัด บรรทัดสุดท้ายเล็กจนต้องยกขึ้นส่องตะเกียง เป็นตัวเลขตัวเดียว ไม่มีหน่วย
      effects: { flags: [opened_cordis_eighth_book] }
    - id: stop_buying_from_pendis
      label: บอกเวลดิสว่าห้องควรเลิกซื้อจากเพนดิส
      text: |
        เวลดิสถามว่าถ้าเลิกซื้อ หน้าถัดไปจะไปอยู่กับใคร {name}ตอบไม่ได้ นางชี้ช่องแรกของชั้นที่ยังว่าง

        คืนต่อมา{name}เป็นคนนั่งต่อราคากับเพนดิสเองที่แผงท้ายตลาดมืด ได้ลดหนึ่งเหรียญ เพนดิสบอกว่าเป็นเหรียญแรกที่เขาลดให้ห้องนี้ แล้วสัญญาว่าหน้าต่อไปจะแพงกว่าเดิมสองเหรียญ
      effects: { stats: { CHA: 1 }, flags: [haggled_with_pendis_for_cordis] }

- id: adult.reclaim_secret_star_letters
  stage: adult
  scene: library
  weight: 25
  time: night
  when:
    age: [26, 64]
    org: { id: reclaimers, min_rank: 3, max_rank: 3 }
  text: |
    ห่อผ้าจากวังลงมาถึงห้องปีละสองหน ปิดครั่งไม่มีตรา คนถือมาเป็นชายหนุ่มที่ไม่ยอมนั่ง เขายืนรอใบรับ ได้แล้วก็ขึ้นบันไดไปเร็วกว่าตอนลงมา หนนี้เวลดิสส่งห่อให้{name}ถือตามเข้าห้องหีบ

    ชั้นในสุดของห้องหีบมีห่อแบบเดียวกันเรียงอยู่หลายสิบห่อ เวลดิสแกะห่อใหม่บนโต๊ะเล็ก ข้างในเป็นจดหมาย ทุกฉบับเปิดแล้ว ครั่งของหอนับดาวหักครึ่ง แต่ละฉบับมีกระดาษแผ่นเล็กแนบไว้ คัดคำตอบของราชสำนักที่ส่งกลับไป ไม่ได้รับ

    บรรทัดแรกของจดหมายทุกฉบับเป็นตัวเลข ตัวเลขดาวที่หอนับดาวนับได้ ฉบับหลังมากกว่าฉบับก่อนทุกฉบับ ตัวเลขในฉบับที่เก่าที่สุดของห่อนี้สูงกว่าตัวเลขที่สถาบันพิมพ์ไว้ในตำราปีนี้
  choices:
    - id: shelve_by_number
      label: เรียงจดหมายตามตัวเลข แล้วลงบัญชีห้องหีบให้ครบทุกฉบับ
      text: |
        {name}เรียงทั้งคืน ตัวเลขไม่เคยลด ไม่มีฉบับไหนข้าม ฉบับที่ท้ายจดหมายเขียนเพิ่มว่าขอคำตอบมีมากขึ้นทุกห่อ ลายมือท้ายจดหมายเปลี่ยนคนไปสามครั้ง

        เวลดิสลงชื่อกำกับบัญชีด้วยมือซ้าย มือขวาเขียนใบรับห่อผ้าสำหรับชายหนุ่มที่จะลงมาหนหน้า เขียนไว้ล่วงหน้าครบทุกช่อง เว้นแต่วันที่
      effects: { org: { id: reclaimers, merit: 1 }, alignment: { law: 1 }, flags: [shelved_the_star_hall_letters] }
    - id: count_the_numbers
      label: อ่านตัวเลขทุกฉบับบนชั้น แล้วเทียบกับตำราของสถาบัน
      text: |
        {name}จดตัวเลขเรียงลงหลังมือด้วยถ่าน ห่อแล้วห่อเล่า หลังมือเต็มต้องย้ายไปจดที่แขนเสื้อ ตัวเลขที่สถาบันพิมพ์ในตำราแต่ละปี ตรงกับตัวเลขในจดหมายที่ลงมาถึงห้องก่อนหน้านั้นสามห่อพอดี

        {name}ล้างมือในอ่างของห้องคัดสำเนาก่อนขึ้นบันได คราบถ่านบนแขนเสื้อซักไม่ออก
      effects: { stats: { INT: 1 }, flags: [counted_the_star_hall_numbers] }
    - id: write_received
      label: เขียนจดหมายสั้นๆ ถึงหอนับดาวโดยไม่บอกใคร บอกว่ามีคนได้รับ
      text: |
        {name}เขียนสามบรรทัด ไม่ลงชื่อ ไม่บอกว่าเขียนจากที่ไหน ฝากคาราวานที่จะไปไอเลธ จ่ายค่าฝากสองเหรียญ แพงกว่าจดหมายทั่วไปเพราะคนรับอยู่ไกล

        ห่อผ้าจากวังห่อถัดมาลงมาถึงห้องตามรอบ จดหมายฉบับหนึ่งในห่อนั้นมีบรรทัดเพิ่มท้ายฉบับ บรรทัดเดียวที่ไม่ได้เขียนถึงราชสำนัก ขอบคุณผู้ที่ได้รับ
      effects: { gold: -2, alignment: { moral: 1, law: -1 }, flags: [wrote_the_star_hall_received] }

- id: adult.reclaim_secret_bloodline
  stage: adult
  scene: library
  weight: 30
  time: night
  when:
    age: [30, 64]
    org: { id: reclaimers, min_rank: 4 }
  text: |
    คาสเซน ดูเวล อาจารย์ที่ปรึกษาสำนักตำรา ลงบันไดมาด้วยไม้เท้ากับแขนของลูกศิษย์ เขาไม่เคยลงมาห้องนี้ เขานั่งลงหน้าโต๊ะของ{name}โดยไม่รอเชิญ แล้วพูดเรื่องเดียว ม้วนสายเลือดบนชั้นที่ล็อกของสำนักตำราขาดตรงกลาง ช่วงที่ขาดยาวเท่าชีวิตคนทำงานคนหนึ่ง เขาเฝ้าช่องนั้นมาจนตาฝ้า และเชื่อว่าฉบับที่ไม่ขาดอยู่ในห้องหีบ

    ฉบับนั้นมีอยู่จริง {name}รู้ตั้งแต่คืนแรกที่ถือกุญแจ หลอดตะกั่วยาวเท่าแขนบนชั้นล่างสุด ชื่อเรียงจากบนลงล่างไม่ขาดสักชั่วคน สายของผู้กล้าบนบัลลังก์จบลงที่องค์ที่ไม่มีโอรส คนที่ขึ้นแทนคือตระกูลของคนถือตะเกียงประจำพระองค์ องค์นั้นมีธิดานอกวังหนึ่งคน นางโตในวิหารประจำถิ่น แต่งงานกับคนสีข้าว ชื่อลูกหลานของนางแตกกิ่งลงไปจนกระดาษหมดม้วน เป็นชื่อชาวบ้านทั้งนั้น

    คาสเซนขอคืนเดียว ขอคัดไปเติมช่องที่ขาดบนชั้นของเขา ชั้นที่ราชสำนักจ่ายค่ากุญแจ
  choices:
    - id: burn_the_scroll
      label: เผาม้วนนั้นในเตาเหล็กมุมห้อง แล้วลงชื่อกำกับ
      text: |
        {name}ไม่เปิดหลอดให้เขาดู คาสเซนเห็นแค่หลอดตะกั่ว เห็นไฟในเตาเหล็กมุมห้อง ได้กลิ่นกระดาษเก่า กระดาษเก่าไหม้เร็ว ชื่อบนสุดไหม้ทีหลังสุด เขานั่งอยู่จนไฟมอด แล้วขอใบรับ

        {name}เขียนให้ ใบรับของที่ไม่มีแล้ว ช่องของเขียนว่าม้วนสายเลือดฉบับไม่ขาด ช่องสภาพเขียนว่าเผา ลายมือชื่อของผู้ปิดหีบ แล้วลงบรรทัดเดียวกันในสมุดลงชื่อเผา คาสเซนพับใบรับใส่อกเสื้อ ให้ลูกศิษย์พยุงขึ้นบันไดไปทีละขั้น นับขั้นออกเสียง
      effects: { org: { id: reclaimers, merit: 1 }, world: { throne: 1 }, alignment: { law: 1 }, flags: [burned_the_whole_bloodline] }
    - id: let_him_copy
      label: ให้เขานั่งคัดคืนเดียวที่โต๊ะคัดสำเนา
      text: |
        คาสเซนคัดด้วยมือที่สั่นจนลูกศิษย์ต้องจับข้อมือไว้ทั้งคืน บางชื่อเขาคัดสองรอบเพราะรอบแรกน้ำตาหยดลงหมึก ไม่ใช่เพราะเศร้า ตาฝ้าของเขาน้ำตาไหลเองเมื่อเพ่งนาน

        เช้ามาหลอดตะกั่วกลับลงชั้นล่างสุดของห้องหีบ ม้วนใหม่ของคาสเซนขึ้นไปนอนบนชั้นที่ล็อก ชั้นที่ราชสำนักจ่ายค่ากุญแจ ลูกศิษย์ที่จับข้อมือเขาทั้งคืนอ่านทุกชื่อจนจบกิ่งสุดท้าย
      effects: { world: { throne: -1 }, alignment: { law: -1 }, flags: [let_kassen_copy_the_bloodline] }
    - id: keep_it_in_the_chest
      label: บอกเขาว่าของที่เข้าหีบแล้วไม่ออก ไม่ว่าจะมีหรือไม่มี
      text: |
        {name}เขียนใบรับคำขอให้หนึ่งใบ คำเดียวกับที่เวลดิสเคยเขียนให้อาจารย์ทุกคนที่ลงมา เข้าหีบแล้ว คาสเซนอ่านไม่ออกเพราะตาฝ้า ลูกศิษย์อ่านให้ฟัง

        เขาหัวเราะเสียงแหบสั้นๆ บอกว่าคำตอบนี้ไม่ได้บอกว่าไม่มี แล้วพับใบรับเก็บอย่างดี คืนนั้น{name}ลงไปที่ชั้นล่างสุด เอามือวางบนหลอดตะกั่ว ตะกั่วเย็นเท่ากับทุกคืน
      effects: { org: { id: reclaimers, merit: 1 }, flags: [kept_the_bloodline_in_the_chest] }

# ---------- ตามล่าและทางออก ----------
- id: adult.reclaim_hunt_blue_receipts
  stage: adult
  scene: market
  weight: 15
  time: dusk
  hunt: star_listeners
  when:
    age: [24, 64]
    org: reclaimers
    not_orgs: [star_listeners]
  text: |
    แผงหนังสือมือสองแผงที่สามของวันบอก{name}เหมือนสองแผงแรก ของในบรรทัดนั้นมีคนมาซื้อไปแล้วเมื่อวาน คนซื้อจ่ายเต็มราคา ไม่ต่อสักเหรียญ แล้วทิ้งใบรับไว้ให้เจ้าของแผง

    ใบรับแผ่นนั้นเป็นกระดาษสีน้ำเงินเข้ม ตัดขนาดเท่าใบรับของห้องพอดี ลายมือเรียบร้อย เลขทะเบียนถูก วันที่ถูก ช่องลายมือชื่อวาดดาวแปดแฉกด้วยหมึกเงิน

    ทั้งสามแผงอยู่ในหน้าเดียวกันของสำเนาบัญชีของ{name} หน้าที่เพิ่งคัดเติมเมื่อต้นสัปดาห์ หน้าที่ยังไม่ได้ตามสักบรรทัด มุมล่างของหน้านั้นมีรอยนิ้วโป้งจางๆ สีเงิน
  choices:
    - id: renumber_with_oves
      label: เอาสำเนาไปให้โอเวสเปลี่ยนลำดับหน้าทั้งเล่ม
      text: |
        โอเวสเปลี่ยนให้ภายในคืนเดียว เลขหน้าใหม่ ลำดับบรรทัดใหม่ เลขทะเบียนเดิม หน้าที่มีรอยนิ้วเงินเขาฉีกออก แล้วลงในสมุดบัญชีหายเป็นของหายหนึ่งชิ้น สำเนาบัญชีหนึ่งหน้า คนคัดไม่ทราบชื่อ

        ใบรับสีน้ำเงินสามใบเขาเย็บไว้ข้างบรรทัดนั้น เป็นใบรับชุดแรกในสมุดเล่มนั้นที่ห้องไม่ได้เขียนเอง
      effects: { reputation: { royal_institute: 1 }, flags: [renumbered_the_copy_with_oves] }
    - id: bait_a_false_line
      label: เขียนบรรทัดปลอมลงหน้าใหม่ แล้วรอดูว่าใครมาซื้อ
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}เขียนบรรทัดที่ไม่มีอยู่จริงหนึ่งบรรทัด โหลเสียงตอบหนึ่งใบ แผงของเก่าท้ายท่าน้ำ แล้วฝากโหลเปล่าไว้ที่แผงนั้น วันที่สี่หญิงสาวคนหนึ่งมาซื้อ เสื้อคลุมของนางเคยมีขอบสีน้ำเงิน รูเข็มที่เลาะด้ายออกยังเรียงเป็นแถวตามขอบ

          {name}ตามนางไปจนถึงห้องใต้หลังคาของโรงฟอกหนัง ขอบหน้าต่างมีแว่นส่องดาวสามอันวางหันขึ้นฟ้า {name}จดที่อยู่ลงสำเนาบัญชีในหน้าที่ไม่มีเลขหน้า
        effects: { stats: { INT: 1 }, flags: [traced_the_blue_receipts] }
      failure:
        text: |
          สามวันไม่มีใครมาซื้อ เจ้าของแผงคิดค่าฝากโหลวันละเหรียญ วันที่สี่{name}กลับไปเอาโหลคืน ใต้โหลมีกระดาษสีน้ำเงินพับไว้แผ่นหนึ่ง

          ใบรับ ของปลอมหนึ่งชิ้น ช่องเลขทะเบียนเว้นว่าง ช่องลายมือชื่อวาดดาวแปดแฉก
        effects: { gold: -3, flags: [fooled_by_the_blue_receipt] }
    - id: walk_ahead_at_night
      label: เดินแผงที่เหลือในหน้านั้นทั้งคืน ให้ถึงก่อนคนซื้อ
      text: |
        {name}เคาะหน้าต่างเจ้าของแผงที่สี่ตอนไก่ยังไม่ขัน ได้คำด่าหนึ่งชุดกับของหนึ่งชิ้น เขียนใบรับบนบานหน้าต่าง แผงที่ห้าอยู่อีกฝั่งเมือง เท้าพองตั้งแต่ครึ่งทาง

        แผงที่ห้ายังไม่เปิด ใต้ประตูแผงมีกระดาษสีน้ำเงินแผ่นหนึ่งสอดไว้ ลงวันที่ของคืนนี้
      effects: { stats: { CON: 1 }, hp: -1, flags: [walked_ahead_of_the_blue_receipts] }

- id: adult.reclaim_hunt_humming_bridge
  stage: adult
  scene: road
  weight: 15
  time: night
  hunt: star_listeners
  when:
    age: [24, 64]
    org: reclaimers
    not_orgs: [star_listeners]
  text: |
    กล่องตะกั่วในย่ามหนักขึ้นทุกครึ่งวัน หรือ{name}เหนื่อยขึ้นทุกครึ่งวัน กลางสะพานไม้ข้ามลำธารมีชายคนหนึ่งยืนพิงราวอยู่ แว่นส่องดาวห้อยคอด้วยเชือกหนัง เขาไม่ได้ขวางทาง เขาฮัมเสียงเดียวยาวๆ และฝาตะกั่วในย่ามสั่นตามเสียงนั้น

    เขาบอกว่าไม่อยากได้กล่อง อยากได้หน้าเดียว ห้องจะเผาหรือขังของในกล่องอยู่แล้ว ก่อนจะถึงตอนนั้นควรมีคนได้อ่านสักคน เขาพูดสุภาพ เสียงเบา ไม่รีบ
  encounter:
    foe: star_listener
    name: ผู้ฟังดาวบนสะพาน
    morale: 2
    beats:
      - text: เสียงฮัมต่ำลงจนลงไปถึงไม้กระดานใต้เท้า ฟันของ{name}เริ่มสั่นกระทบกัน
        moves:
          - id: lb_bang_lid
            label: เอาด้ามมีดเคาะฝากล่องตะกั่วให้ดังกลบเสียงฮัม
            kind: quick
            tags: [noise]
          - id: lb_maybe_shelf
            label: บอกเขาว่ากล่องนี้อาจได้กลับขึ้นชั้น ไม่ต้องรีบอ่านคืนนี้
            kind: talk
            parley: true
          - id: lb_back_off
            label: ถอยกลับไปฝั่งที่มา
            kind: flee
      - text: เขาก้าวเข้ามาสองก้าว ยื่นมือมาหาสายย่าม ไม่เร็ว ไม่ช้า ฝ่ามือหงายขึ้นรอรับ
        moves:
          - id: lb_read_hands
            label: ดูมือเขาว่าซ่อนอะไรไว้
            kind: read
            stat: WIS
            success: ระหว่างนิ้วกลางกับนิ้วนางมือขวาของเขาหนีบหลอดแก้วเล็กๆ ไว้ ข้างในเรืองแสงจาง
          - id: lb_shout_down
            label: ตะโกนเรียกคนที่ซักผ้าอยู่ใต้สะพานให้ดังที่สุด
            kind: quick
            tags: [noise]
          - id: lb_hug_bag
            label: กอดย่ามแนบอก หันไหล่ให้เขา
            kind: guard
          - id: lb_jump
            label: กระโดดลงลำธารทั้งย่าม
            kind: flee
      - text: เสียงฮัมขาดเป็นห้วงๆ เขาหอบ แว่นส่องดาวแกว่งไปมาที่คอ
        answer: talk
        moves:
          - id: lb_one_line
            label: เสนอว่าจะอ่านป้ายบนกล่องให้ฟังหนึ่งบรรทัด ไม่ใช่หนึ่งหน้า
            kind: talk
            parley: true
            success: เขาหยุดฮัม เอียงหัวเหมือนคนฟังราคา
          - id: lb_shove
            label: ผลักเขาชิดราวสะพาน
            kind: attack
            tags: [blunt]
          - id: lb_whistle
            label: ผิวปากเสียงแหลมใส่หูเขาใกล้ๆ
            kind: quick
            tags: [noise]
          - id: lb_run_past
            label: วิ่งผ่านเขาไปฝั่งโน้น
            kind: flee
    win:
      text: |
        เขานั่งลงบนกระดานสะพาน มือหนึ่งปิดหูไว้ข้างหนึ่ง เลนส์แว่นส่องดาวร้าวเป็นเส้นตรงกลาง เขาไม่โกรธ เขาบอกว่าเสียงที่{name}ทำดังมาก ดังกว่าดาว

        {name}ข้ามสะพานไปโดยไม่หันกลับ ป้ายกระดาษบนกล่องยังผูกอยู่ ไม่มีใครแกะ ห้องรับกล่องพร้อมรายงานหนึ่งบรรทัด มีคนขอดูหน้าเดียวที่สะพาน ไม่ได้ดู
      effects: { reputation: { royal_institute: 1 }, flags: [kept_the_box_on_the_bridge] }
    lose:
      text: |
        {name}ทรุดลงพิงราวสะพาน หูอื้อจนได้ยินแต่เสียงหึ่ง เขาคุกเข่าข้างย่าม แงะบัดกรีสามจุดด้วยมีดเล่มเล็กอย่างคนที่ทำมาหลายครั้ง อ่านหน้าแรกด้วยแสงดาว แล้วบัดกรีคืนให้ด้วยตะเกียงพกของตัวเอง เรียบกว่ารอยเดิม

        ห้องรับกล่องในอีกสามวัน โอเวสยกกล่องขึ้นส่องตะเกียง บอกว่ารอยบัดกรีนี้ไม่ใช่ของห้อง ห้องนี้ไม่มีใครบัดกรีได้สวยขนาดนี้
      effects: { reputation: { royal_institute: -1 }, flags: [the_listener_read_the_box] }
    stalemate:
      text: |
        ทั้งสองยืนอยู่คนละฟากของกลางสะพานจนฟ้าเริ่มสาง เกวียนผักคันแรกของวันมาถึงหัวสะพาน คนขับตะโกนให้หลบ เขาหลีกทางให้เกวียน แล้วเดินไปทางเดียวกับเกวียน ฮัมเสียงเดิมไปตลอดทาง

        {name}ข้ามสะพานโดยเดินชิดล้อเกวียน กล่องตะกั่วถึงห้องตามกำหนด ฝาบัดกรีครบสามจุด
      effects: { flags: [stood_off_the_listener_on_the_bridge] }
    flee:
      text: |
        {name}ถอยจนพ้นหัวสะพาน แล้วเดินอ้อมไปข้ามที่ท่าเรือข้ามฟากเหนือน้ำ ช้าไปสองวัน คนพายเห็นว่ารีบเลยคิดค่าเรือสองเท่า

        เสียงฮัมตามมาถึงริมน้ำแล้วหยุด โอเวสลงรายงานว่ากล่องมาช้าสองวัน ในช่องเหตุผลเขียนคำเดียว สะพาน
      effects: { gold: -2, flags: [went_round_the_listener] }
    parley:
      text: |
        {name}อ่านป้ายบนกล่องให้ฟังหนึ่งบรรทัด ชื่อสมุดกับชื่อคนเขียน ไม่มากกว่านั้น เขาหลับตาฟัง ทวนตามเบาๆ สองรอบ แล้วถอยกลับไปพิงราวตามเดิม หลีกทางให้

        ก่อน{name}จะพ้นสะพาน เขาตะโกนตามมาว่าจะบอกคนอื่นว่าคนนี้ให้หนึ่งบรรทัดเมื่อขอดีๆ ไม่ต้องขอแรง
      effects: { hunted: { star_listeners: -1 }, flags: [read_the_label_to_the_listener] }

- id: adult.reclaim_offer_one_look
  stage: adult
  weight: 12
  time: dusk
  when:
    age: [24, 64]
    org: reclaimers
  text: |
    เพนดิสไม่เคยมาหาคนของห้องเอง ห้องไปหาเขาเสมอ เย็นนี้เขานั่งรออยู่บนขั้นบันไดหน้าหอสมุด ข้างตัวมีถุงผ้าใบเล็ก ปากถุงผูกหลวมพอให้เห็นขอบเหรียญเงิน

    เขาบอกว่ามีคนอยากดูของที่{name}ถืออยู่ในย่าม ของที่จะลงไปห้องคืนนี้ ไม่เอาไป ไม่คัด ดูครั้งเดียว นานเท่าเทียนแท่งเล็กหนึ่งแท่ง คนดูไม่ใช่เขา เป็นชายสุภาพคนหนึ่งที่เขียนหนังสือด้วยหมึกน้ำเงิน รออยู่ในรถม้าปิดม่านที่หัวถนน ถุงนี้เป็นค่าเทียน

    เพนดิสยิ้มแบบคนขายของที่รู้ว่าลูกค้าจะกลับมา ห้องซื้อของจากเขามาตลอด ห้องไม่เคยถามว่าเขาซื้อมาจากใคร
  choices:
    - id: take_the_candle
      label: เดินไปที่รถม้า เปิดย่ามให้เขาดูหนึ่งเทียน
      text: |
        ในรถม้ามีกลิ่นกาแฟคั่ว ชายในรถอ่านเร็ว ไม่แตะกระดาษด้วยนิ้ว พลิกหน้าด้วยไม้บรรทัดงาช้าง จดด้วยหมึกน้ำเงินลงสมุดเล่มเล็ก ตัวหนังสือเล็กเท่ากันทุกตัว เทียนยังไม่ทันหมด เขาส่งย่ามคืน ปิดผนึกคืนให้ด้วย เรียบกว่าที่ห้องเคยทำ

        เช้าวันต่อมาโอเวสยกของขึ้นส่องตะเกียง อ่านรอยผนึก แล้วยื่นมือข้ามโต๊ะมาขอสำเนาบัญชีของ{name}คืน ฤดูนั้นชื่อของ{name}ย้ายจากสมุดคนที่ห้องเคยเจอไปอยู่ในสมุดบัญชีหาย มีเลขทะเบียนกำกับ ช่องที่อยู่ล่าสุดเว้นว่างไว้ให้คนตามรอยกรอก
      effects:
        mark: เปิดของของห้องให้คนหมึกน้ำเงินดู
        gold: 10
        org: { id: reclaimers, leave: true }
        hunted: { royal_institute: 2 }
        world: { star: 1 }
        lose_items: [reclaim_brass_seal]
        flags: [left_the_reclaimers, sold_one_candle_look]
    - id: turn_down_pendis
      label: บอกเพนดิสว่าห้องซื้อของจากเขา ไม่ได้ขายให้เขา
      text: |
        เพนดิสยักไหล่ เก็บถุงเหรียญใส่อกเสื้อ บอกว่าเข้าใจ พรุ่งนี้เขามีวงเวียนทองเหลืองอันหนึ่งจะเอามาขายห้องพอดี ราคาดี หมุดครบทุกตัว

        รถม้าที่หัวถนนออกตัวก่อนเขาจะลุกจากบันได ม่านปิดตลอดทาง ล้อหลังข้างหนึ่งดังเอี๊ยดทุกรอบ
      effects: { alignment: { law: 1 }, flags: [turned_down_pendis_candle] }
    - id: tell_lisen_everything
      label: ลงไปบอกลีเซนทั้งหมด ชื่อ รถม้า หมึกน้ำเงิน
      text: |
        ลีเซนฟังจบแล้วขึ้นบันไดไปเอง หัวถนนไม่มีรถม้าแล้ว นางกลับลงมาเขียนบรรทัดใหม่ลงสมุดคนที่ห้องเคยเจอ หน้าของเพนดิส หน้านั้นเต็มจนต้องต่อกระดาษอีกแผ่นด้วยกาวแป้ง

        สัปดาห์ต่อมาห้องซื้อวงเวียนทองเหลืองจากเพนดิสหนึ่งอัน ราคาเดิม ลีเซนเป็นคนจ่าย นับเหรียญช้ากว่าทุกครั้ง
      effects: { stats: { WIS: 1 }, reputation: { royal_institute: 1 }, flags: [reported_the_blue_ink_man] }

- id: adult.reclaim_walk_out
  stage: adult
  scene: market
  weight: 10
  time: dusk
  when:
    age: [24, 64]
    org: reclaimers
  text: |
    ลูกสาวคนขายหนังสือแผงท้ายตลาดถาม{name}ว่าเล่มที่ถืออยู่เป็นเรื่องอะไร {name}ตอบเลขทะเบียน ตอบสำนักที่เล่มนั้นออกมา ตอบชื่อคนยืมคนสุดท้าย เด็กถามซ้ำว่าเรื่องอะไร

    {name}เปิดหน้าแรก อ่านไปสามบรรทัด แล้วนึกไม่ออกว่าหนังสือเล่มสุดท้ายที่อ่านจนจบเป็นเล่มไหน สำเนาสมุดบัญชีหายในย่ามหนาขึ้นทุกฤดู ใบรับที่เขียนไปแล้วนับไม่ถ้วน ทุกใบมีลายมือชื่อของ{name}

    คืนนั้น{name}วางทุกอย่างที่ห้องให้ไว้เรียงบนโต๊ะ สำเนาบัญชี เล่มใบรับที่ยังไม่ได้ฉีก และของที่ห้องให้ถือตามยศ เล่มที่เด็กถามถึงวางอยู่ท้ายแถว
  choices:
    - id: hand_it_all_back
      label: เอาทุกอย่างลงไปคืนที่ห้อง ให้โอเวสเขียนใบรับ
      text: |
        โอเวสนับของทีละชิ้น พูดเลขทะเบียนของแต่ละชิ้นออกมา แล้วเขียนใบรับให้หนึ่งใบ ได้รับคืนครบ ห้องไม่ตามคนที่คืนครบ บรรทัดของ{name}ในสมุดคนที่ห้องเคยเจอได้เส้นขีดปิด ตรง ไม่เอียง

        ขากลับ{name}แวะแผงท้ายตลาด ซื้อหนังสือเล่มหนึ่งด้วยเงินตัวเอง เล่มที่ไม่มีลายน้ำ ไม่มีเลขทะเบียน ไม่มีใครเคยตามหา สามเหรียญ
      effects:
        mark: ออกจากห้องบัญชีหาย
        org: { id: reclaimers, leave: true }
        gold: -3
        lose_items: [reclaim_brass_seal]
        flags: [left_the_reclaimers, handed_everything_back]
    - id: keep_one_book
      label: คืนทุกอย่าง ยกเว้นเล่มเดียวที่{name}อยากอ่านให้จบ
      text: |
        โอเวสนับของบนโต๊ะครบ แล้วพูดเลขทะเบียนอีกเลขหนึ่ง เลขของเล่มที่ไม่ได้อยู่บนโต๊ะ เขาเขียนใบรับให้ ได้รับคืนไม่ครบ ขาดหนึ่ง

        เล่มนั้น{name}อ่านจบในสามคืน ตำราว่าด้วยนกที่บินกลับทางเดิมทุกหน้าหนาว ขอบทุกหน้ามีลายมือของคนอ่านคนก่อน ฤดูต่อมามีหญิงในเสื้อคลุมเรียบไม่มีขอบสีมายืนอยู่ฝั่งตรงข้ามถนนสองครั้ง นางไม่เข้ามา สำเนาบัญชีในมือนางเปิดอยู่หน้าเดียวกันทั้งสองครั้ง
      effects:
        mark: ออกจากห้องบัญชีหาย
        org: { id: reclaimers, leave: true }
        hunted: { royal_institute: 2 }
        lose_items: [reclaim_brass_seal]
        flags: [left_the_reclaimers, kept_one_numbered_book]
    - id: read_the_first_chapter
      label: เก็บทุกอย่างกลับเข้าย่าม พรุ่งนี้กลับไปอ่านให้เด็กฟัง
      text: |
        วันต่อมา{name}นั่งบนลังหนังสือหลังแผงท้ายตลาด อ่านบทแรกให้เด็กฟังจนจบ เด็กนั่งกอดเข่า ขยับปากตามคำที่ชอบ

        แล้ว{name}เขียนใบรับให้แม่ของเด็ก เก็บเล่มนั้นลงย่าม เด็กถามว่าบทต่อไปอยู่ที่ไหน {name}บอกเลขทะเบียนให้จำไว้
      effects: { stats: { CHA: 1 }, flags: [read_the_first_chapter_aloud] }
