# ชุด 3 องค์กร: โรงรับเขี้ยว (fang_house) ไฟล์ ก ทางเข้า 4 ทาง กับงานที่โรงส่งมา 10 เรื่อง
# คนของสาขา (มีแต่ในข้อความ ไม่อยู่ในผังคน): ออร์ริส เจ้าโต๊ะชั่ง หญิงร่างใหญ่อดีตช่างฟอกหนัง มือเป็นสีน้ำฝาดถึงข้อศอก
#   ฟินเดล เสมียนหนุ่มข้อมือเสื้อเปื้อนหมึก · ยาเรค นักล่าคู่แข่ง ใบหูขวาแหว่ง หัวเราะดัง · อาซริธ นักล่าทีฟลิ่งหญิง พันเขาด้วยเส้นหนัง
# ออร์ริสเป็นเจ้าโต๊ะชั่งจนตัวละครขึ้นยศ 4 เรื่องที่นางยังนั่งโต๊ะจึงกัน max_rank: 3 ทุกเรื่องไม่บอกว่าสาขาอยู่เมืองไหน
# กติกาเหนือโต๊ะชั่ง: ไม่รับของคน ไม่ถามว่าได้มาอย่างไร ไม่จ่ายสองครั้ง (ข้อหนึ่ง ข้อสอง ข้อสาม ในหมายเหตุของแต่ละเรื่อง)
# ค่าหัวของการปะทะที่ชนะสิ่งที่ไม่ใช่คน ระบบจ่ายเอง ไม่ใส่ gold ซ้ำใน win เว้นใบส่วนตัว (โรงหล่อร้าง)
# งานเกิดซ้ำ 3 เรื่อง (หมาป่า ปูในท่อ เดินปลดใบ) ให้แค่เงินหรือชื่อเสียง

# ---------- ทางเข้า ----------
- id: adult.fang_join_headman
  stage: adult
  scene: road
  weight: 1
  when:
    age: [28, 50]
    not_orgs: [fang_house, wardens]
    not_flags: [took_the_fang_tags, left_the_fang_house, returned_the_fang_tag]
  text: |
    หมูป่าตัวนั้นพังรั้วไร่ข้าวโอ๊ตของหมู่บ้านริมทางมาสามคืนติดกัน คืนที่สี่มันพุ่งออกจากพงข้างทางเข้าใส่ล่อของ{name} ล่อสะบัดเกวียนเข้าข้างทาง ตัวหมูพุ่งเลยไปตกคูน้ำ หัวทิ่มลงหินก้นคู คอหัก ตายก่อนจะทันลุก

    เช้ามาผู้ใหญ่บ้านเดินมาดูถึงคู ดึงใบค่าหัวที่ตอกไว้หน้าบ้านตัวเองมาให้ดู สี่เหรียญ ประทับตราโรงรับเขี้ยว เขาบอกว่าเงินบนใบไม่ได้อยู่ที่หมู่บ้าน ต้องเอาเขี้ยวไปวางบนโต๊ะชั่งของโรงในเมือง ให้เจ้าโต๊ะชั่งเป็นคนจ่าย หมู่บ้านจ่ายตรงไม่ได้ เพราะเขาลงชื่อในกระดาษไว้กับโรงแล้ว

    เขาช่วยถอนเขี้ยวให้สองซี่ด้วยคีมถอนตะปู ห่อผ้าให้เรียบร้อย แล้วถามว่าจะเอาไปเองหรือจะฝากลูกชายเขา ลูกชายเขากำลังจะเข้าเมืองอยู่แล้ว
  choices:
    - id: carry_the_tusks
      label: เอาเขี้ยวสองซี่ไปวางบนโต๊ะชั่งเอง
      text: |
        โต๊ะชั่งของโรงรับเขี้ยวเป็นไม้โอ๊กแผ่นเดียวหนาเท่าฝ่ามือ ผิวโต๊ะเป็นรอยมีดกับคราบเลือดแห้งซ้อนกันหลายสิบปี เหนือโต๊ะสลักกติกาสามข้อไว้บนคานไม้ ไม่รับของคน ไม่ถามว่าได้มาอย่างไร ไม่จ่ายสองครั้ง ออร์ริส เจ้าโต๊ะชั่ง หญิงร่างใหญ่ที่มือสีน้ำตาลเข้มไปถึงข้อศอกเพราะน้ำฝาดของโรงฟอกหนังสมัยก่อน วางเขี้ยวลงบนตาชั่ง อ่านใบ แล้วนับสี่เหรียญออกมาวาง ไม่ถามว่าหมูตายอย่างไร

        ฟินเดล เสมียนหนุ่มที่ข้อมือเสื้อเปื้อนหมึกเป็นวงดำทั้งสองข้าง เปิดสมุดของสาขาไปหน้าใหม่ เขียนชื่อ{name} ข้างชื่อเขียนว่าคนส่งเขี้ยว แล้วเป่าหมึกให้แห้ง
      effects: { org: { id: fang_house, join: true }, gold: 4, flags: [first_proof_boar_tusks] }
    - id: haul_the_whole_boar
      label: ลากหมูขึ้นเกวียนทั้งตัว เอาไปวางให้เจ้าโต๊ะชั่งดู
      check: { stat: STR, dc: 13 }
      success:
        text: |
          {name}ใช้ไม้กระดานสองแผ่นกับเชือกล่อลากหมูขึ้นท้ายเกวียน ไปถึงโรงตอนเย็น ออร์ริส เจ้าโต๊ะชั่งที่มือเป็นสีน้ำฝาดถึงข้อศอก เดินออกมาดูถึงเกวียน นางบอกว่าโรงจ่ายเขี้ยว ไม่จ่ายหมู แล้วถอนเขี้ยวเองต่อหน้า นับสี่เหรียญตามใบ

          จากนั้นนางนับเพิ่มอีกสองเหรียญ บอกว่าเป็นเงินของนางเอง ไม่ใช่ของโรง ค่าเนื้อหมูทั้งตัว ฟินเดลเขียนชื่อ{name}ลงสมุดของสาขา ข้างชื่อเขียนว่าคนส่งเขี้ยว
        effects: { org: { id: fang_house, join: true }, stats: { STR: 1 }, gold: 6, flags: [first_proof_boar_tusks] }
      failure:
        text: |
          ครึ่งทางเชือกขาด หมูไถลลงจากท้ายเกวียน หลังของ{name}เคล็ดตอนพยายามยกขึ้นใหม่ สุดท้ายถอนแค่เขี้ยวไปสองซี่ ทิ้งตัวไว้ให้อีกาข้างทาง

          ออร์ริสวางเขี้ยวบนตาชั่ง นับสี่เหรียญ ไม่ถามว่าทำไมเดินหลังงอ ฟินเดลเขียนชื่อ{name}ลงสมุดของสาขาหน้าใหม่
        effects: { org: { id: fang_house, join: true }, hp: -1, gold: 4, flags: [first_proof_boar_tusks] }
    - id: skin_it_too
      label: ถลกหนังหมูข้างคูน้ำ เอาไปพร้อมเขี้ยว
      requires: { class: ranger }
      text: |
        หนังหมูหลุดออกมาเป็นผืนเดียว ไม่มีรูสักรู {name}ม้วนใส่ท้ายเกวียนไปพร้อมเขี้ยว ออร์ริส เจ้าโต๊ะชั่ง ชั่งเขี้ยวแล้วจ่ายสี่เหรียญตามใบ แล้วคลี่หนังหมูออกบนโต๊ะ ลูบตามแนวขนด้วยนิ้วสีน้ำฝาดที่ล้างไม่ออกมาสิบกว่าปี

        นางบอกว่าโรงไม่ซื้อหนัง แต่นางซื้อ สองเหรียญ เพราะคนถลกรู้ว่าต้องกรีดตรงไหน แล้วบอกฟินเดลให้เขียนชื่อ{name}ลงสมุดของสาขา
      effects: { org: { id: fang_house, join: true }, stats: { DEX: 1 }, gold: 6, flags: [first_proof_boar_tusks, sold_orris_a_hide] }
    - id: give_to_the_son
      label: ฝากเขี้ยวไปกับลูกชายผู้ใหญ่บ้าน ให้เงินไปซ่อมรั้ว
      text: |
        ลูกชายผู้ใหญ่บ้านรับห่อผ้าไปด้วยสองมือ เดินเข้าเมืองตั้งแต่เช้า กลับมาตอนค่ำพร้อมสี่เหรียญกับไม้รั้วใหม่บนหลังล่อ

        ก่อน{name}ออกจากหมู่บ้าน ผู้ใหญ่บ้านเอาข้าวโอ๊ตใส่ถุงมาวางท้ายเกวียนครึ่งกระสอบ บอกว่าเป็นข้าวโอ๊ตจากแปลงที่หมูยังไม่ได้พัง
      effects: { alignment: { moral: 1 }, flags: [gave_the_tusks_to_the_village] }

- id: adult.fang_join_board
  stage: adult
  scene: tavern
  weight: 25
  when:
    age: [28, 50]
    flags: [job_bounty_hunter]
    not_orgs: [fang_house, wardens]
    not_flags: [took_the_fang_tags, left_the_fang_house, returned_the_fang_tag]
  text: |
    กระดานค่าหัวหน้าโรงเตี๊ยมที่{name}ปลดใบมาหากินหลายปีมีของใหม่ติดอยู่ที่หัวกระดาน แผ่นทองเหลืองตอกตะปูสี่มุม ตัวอักษรตอกลึก ใบค่าหัวสัตว์ทุกใบบนกระดานนี้จ่ายที่โต๊ะชั่งของโรงรับเขี้ยวเท่านั้น ใต้แผ่นทองเหลืองมีอีกบรรทัด ตัวเล็กกว่า ใบค่าหัวคนไม่เกี่ยว

    เจ้าของโรงเตี๊ยมเช็ดแผ่นทองเหลืองด้วยผ้าเปียกทุกเช้า ได้ส่วนแบ่งจากทุกใบที่มีคนปลด เงินค่าหัวที่เคยฝากไว้หลังโต๊ะรินเหล้าไม่ต้องฝากอีกแล้ว

    ใบบนกระดานเช้านี้มีเจ็ดใบ ห้าใบเป็นใบสัตว์ อีกสองใบเป็นคน คนหนึ่งขโมยม้าจากคอกของนายสถานี อีกคนหนีหนี้ธนาคารเบเลคมาสองเมือง
  choices:
    - id: sign_at_the_counter
      label: ไปโรงรับเขี้ยว ลงชื่อในสมุดของสาขา
      text: |
        ออร์ริส เจ้าโต๊ะชั่ง จับมือ{name}พลิกดูทีละข้าง หนังด้านที่โคนนิ้ว แผลเก่าที่หลังมือ รอยเชือกบาดที่ข้อ แล้วปล่อย นางบอกฟินเดลให้เขียนชื่อ ฟินเดลเขียนเสร็จก่อน{name}จะทันสะกดนามสกุลให้ฟัง

        ใบหมาป่าที่{name}ปลดมาจากกระดานเมื่อเช้า ขากลับมีคนวางหางสามเส้นบนโต๊ะไปก่อนแล้ว ออร์ริสชี้ขึ้นไปที่คานไม้ ข้อที่สาม ไม่จ่ายสองครั้ง
      effects: { org: { id: fang_house, join: true }, reputation: { fang_house: 1 }, flags: [moved_to_the_fang_board] }
    - id: people_papers_only
      label: ปลดใบคนขโมยม้า หากินกับใบคนต่อไป
      text: |
        คนขโมยม้านอนเมาอยู่ในโรงนาห่างไปครึ่งวันเดิน ม้ายังผูกอยู่ข้างโรงนา {name}พาทั้งคนทั้งม้ากลับมาถึงคอกนายสถานีก่อนค่ำ ได้สามเหรียญจากมือเจ้าของโรงเตี๊ยมเหมือนเดิม

        เดือนต่อมากระดานเหลือใบคนแค่ใบเดียว อีกหกใบเป็นใบสัตว์ แผ่นทองเหลืองที่หัวกระดานขึ้นเงาเพราะผ้าเปียกของเจ้าของร้าน
      effects: { gold: 3, flags: [kept_to_people_papers] }
    - id: bring_the_crew
      label: พาพวกที่เคยล่าด้วยกันไปลงชื่อพร้อมกัน
      requires: { flag: hunted_with_crew }
      text: |
        สี่คนยืนเรียงหน้าโต๊ะชั่ง ออร์ริสดูมือทีละคน ฟินเดลเขียนชื่อทีละบรรทัด สี่บรรทัดติดกันในหน้าเดียว ออร์ริสบอกว่าใบแต่ละใบจ่ายให้คนแรกที่ถึงโต๊ะ ไม่ใช่พวกแรก ถ้าจะแบ่งกันก็ไปแบ่งข้างนอก

        คืนนั้นทั้งสี่คนกินเหล้าที่โรงเตี๊ยมหน้ากระดาน เจ้าของร้านรินให้คนละจอกไม่คิดเงิน เขาจะได้ส่วนแบ่งจากใบของทั้งสี่คนต่อจากนี้
      effects: { org: { id: fang_house, join: true }, reputation: { fang_house: 1 }, flags: [moved_to_the_fang_board, crew_signed_together] }
    - id: ask_the_keepers_cut
      label: ถามเจ้าของโรงเตี๊ยมก่อนว่าได้ส่วนแบ่งใบละเท่าไร แล้วค่อยไปโรง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เจ้าของโรงเตี๊ยมรินเหล้าให้จอกหนึ่งก่อนตอบ หนึ่งในสิบของทุกใบ แล้วเล่าต่อโดยไม่ต้องถาม ใบของหมู่บ้านส่วนใหญ่เงินไม่ได้มาจากหมู่บ้าน ผู้ใหญ่บ้านไปลงชื่อในกระดาษที่ไหนสักแห่งก่อนจะมีเงินมาแขวน เขาไม่รู้ว่าที่ไหน และไม่อยากรู้

          บ่ายนั้น{name}ไปลงชื่อที่โรงรับเขี้ยว ฟินเดลเขียนชื่อลงสมุดของสาขา ออร์ริสไม่ถามว่ามาจากกระดานร้านไหน
        effects: { org: { id: fang_house, join: true }, stats: { CHA: 1 }, flags: [moved_to_the_fang_board, heard_the_village_papers_are_loans] }
      failure:
        text: |
          เจ้าของโรงเตี๊ยมบอกว่าส่วนแบ่งของเขาเป็นเรื่องของเขา แล้วไปเช็ดแผ่นทองเหลืองต่อ เช็ดนานกว่าทุกเช้า

          บ่ายนั้น{name}ไปลงชื่อที่โรงรับเขี้ยว ฟินเดลเขียนชื่อลงสมุดของสาขา เหล้าที่ร้านหน้ากระดานคืนนั้นแพงขึ้นจอกละครึ่งเหรียญ เฉพาะจอกของ{name}
        effects: { org: { id: fang_house, join: true }, gold: -1, flags: [moved_to_the_fang_board] }

- id: adult.fang_join_sack
  stage: adult
  scene: road
  weight: 1
  when:
    age: [28, 50]
    not_orgs: [fang_house, wardens]
    not_flags: [took_the_fang_tags, left_the_fang_house, returned_the_fang_tag]
  text: |
    คนที่นอนตายอยู่ข้างทางเกวียนตัวแข็งไปตั้งแต่เมื่อคืน หน้าคว่ำ มือข้างหนึ่งยังกำสายย่าม หลังเสื้อขาดเป็นริ้วสามริ้ว ห่างกันเท่าระยะเล็บของอะไรที่ใหญ่กว่าหมา นักล่าแบบนี้เดินทางคนเดียวบนทางเส้นนี้ทุกฤดู ไม่มีใครนับว่าคนไหนกลับ

    ย่ามของเขาหนัก ข้างในมีถ่านดำแข็งสามก้อนห่อผ้าน้ำมัน เขี้ยวหมาป่าร้อยเชือกหนึ่งพวง เศษแก้วที่ส่องแดดแล้วแสงข้างในขยับเองได้ ใต้สุดเป็นสมุดเล่มเล็กปกชุ่มน้ำค้าง กับป้ายทองเหลืองตอกเลขแผ่นหนึ่ง

    ใครๆ ก็รู้ว่าเหนือโต๊ะชั่งของโรงรับเขี้ยวสลักกติกาไว้สามข้อ ข้อที่สองบอกว่าโรงไม่ถามว่าได้มาอย่างไร
  choices:
    - id: take_it_to_the_counter
      label: แบกย่ามไปวางบนโต๊ะชั่ง
      text: |
        ออร์ริส เจ้าโต๊ะชั่ง หญิงร่างใหญ่มือสีน้ำฝาด เทของในย่ามลงบนโต๊ะทีละอย่าง ชั่งถ่าน ชั่งเขี้ยว ชั่งเศษแก้ว แล้วหยิบป้ายทองเหลืองขึ้นมาอ่านเลข หย่อนลงลิ้นชักใต้โต๊ะ ป้ายกลับเข้าโรง ส่วนเงินจ่ายให้คนที่ถือของมา ห้าเหรียญ นางไม่ถามสักคำ

        ฟินเดล เสมียนข้อมือเปื้อนหมึก พลิกสมุดของสาขาไปหาหน้าที่ตรงกับเลขบนป้าย ขีดเส้นทับชื่อบนหน้านั้นหนึ่งเส้น แล้วพลิกไปหน้าถัดไปที่ยังว่าง เขียนชื่อ{name}
      effects: { org: { id: fang_house, join: true }, gold: 5, flags: [sold_a_dead_mans_sack] }
    - id: read_his_tally
      label: เปิดสมุดเล่มเล็กของเขาอ่านก่อนไปโรง
      requires: { flag: job_clerk }
      text: |
        สมุดเล่มนั้นเป็นบัญชีที่ดีกว่าบัญชีของห้างหลายห้างที่{name}เคยทำ เลขใบ ชื่อหมู่บ้าน วันที่ฆ่า วันที่ได้เงิน ใบสุดท้ายมีวันที่ฆ่า ยังไม่มีวันที่ได้เงิน {name}เอาใบนั้นไปวางบนโต๊ะชั่งพร้อมของในย่าม ชี้บรรทัดให้ออร์ริสดู

        ออร์ริสอ่านบรรทัดนั้น จ่ายค่าหัวใบสุดท้ายของคนตายให้{name} ไม่ถามว่า{name}เป็นอะไรกับเขา แล้วบอกฟินเดลให้เขียนชื่อ{name}ลงหน้าใหม่ คนที่อ่านบัญชีของคนอื่นออก โรงมีงานให้ทำ
      effects: { org: { id: fang_house, join: true }, stats: { INT: 1 }, gold: 5, flags: [sold_a_dead_mans_sack, read_a_dead_hunters_tally] }
    - id: sing_his_name
      label: ร้องชื่อของเขาที่โต๊ะชั่ง แบบที่นักล่าร้องให้คนที่ไม่กลับ
      requires: { class: bard }
      text: |
        ชื่อของเขาเขียนอยู่ปกในของสมุดเล่มเล็ก {name}ร้องชื่อนั้นต่อหน้าโต๊ะชั่ง ทำนองเดียวกับที่นักล่าร้องกันในโรงเตี๊ยมตอนดึก เสียงเดียว ไม่มีเครื่องดนตรี ออร์ริสหยุดมือที่กำลังชั่ง ฟินเดลวางปากกา นักล่าสองคนที่รอต่อแถวอยู่ข้างหลังถอดหมวก

        ร้องจบ ออร์ริสชั่งของในย่ามต่อจนเสร็จ จ่ายห้าเหรียญ แล้วบอกฟินเดลให้เขียนชื่อ{name}ลงสมุดของสาขา
      effects: { org: { id: fang_house, join: true }, stats: { CHA: 1 }, gold: 5, flags: [sold_a_dead_mans_sack] }
    - id: bury_him_with_it
      label: ขุดหลุมข้างทาง ฝังเขาพร้อมย่ามของเขา
      text: |
        ดินข้างทางแข็งเพราะรากหญ้า {name}ขุดด้วยพลั่วสั้นที่พกไว้ซ่อมล้อจนเกือบค่ำ วางเขาลงในหลุมหันหน้าขึ้น ย่ามวางบนอก ป้ายทองเหลืองวางทับย่าม

        หลุมนั้นไม่มีป้ายชื่อ {name}ตอกไม้สั้นๆ ไว้ท่อนหนึ่งเผื่อมีคนมาตามหา สองเดือนต่อมาผ่านทางนั้นอีก ไม้ยังอยู่ ดินบนหลุมมีรอยคนขุดแล้วกลบใหม่
      effects: { alignment: { moral: 1 }, flags: [buried_the_dead_hunter] }

- id: adult.fang_join_partner
  stage: adult
  scene: tavern
  weight: 1
  when:
    age: [28, 50]
    not_orgs: [fang_house, wardens]
    not_flags: [took_the_fang_tags, left_the_fang_house, returned_the_fang_tag]
  text: |
    ทีฟลิ่งหญิงที่นั่งโต๊ะมุมของโรงเตี๊ยมพันเขาทั้งสองข้างด้วยเส้นหนังฟอกจนแน่น เหลือแต่ปลายสีดำด้านโผล่ออกมา ป้ายทองเหลืองตอกเลขห้อยเข็มขัด นางชื่ออาซริธ เป็นชื่อที่พ่อแม่ในแดนเถ้าได้ยินมาในฝัน คนในโรงเตี๊ยมเรียกนางสั้นๆ ว่าอาซ เพราะไม่มีใครอยากออกเสียงเต็ม

    นางวางใบค่าหัวลงตรงหน้า{name} ใบสองชื่อ ลูกวัวใต้ทุ่งตัวหนึ่งพังไร่ของหมู่บ้านทำนาไปสามแปลง ใบแบบนี้โรงไม่ให้ใครปลดคนเดียว ต้องมีสองชื่อบนใบรับ ชื่อที่สองที่นางหาไว้เพิ่งขาหักเมื่อวาน

    นางบอกว่าเลือก{name}เพราะ{name}นั่งหันหลังให้ฝาผนังตั้งแต่เข้าร้าน และไม่ได้มองเขาของนางเกินหนึ่งครั้ง ค่าหัวแบ่งครึ่ง ส่วนที่ต้องเสี่ยง นางเอาไปมากกว่า
  choices:
    - id: put_your_name_down
      label: เขียนชื่อลงช่องที่สองของใบ
      text: |
        ลูกวัวใต้ทุ่งโผล่หลังขึ้นจากดินกลางแปลงที่สี่ตอนสาย ใหญ่เท่าเกวียน ดินบนหลังร่วงลงเป็นก้อน อาซริธอ่านทางมันจากรอยดินนูนก่อนมันโผล่ บอก{name}ให้ไปยืนตีกลองหนังที่ปลายแปลงอีกฟาก มันหันหาเสียงกลอง นางเข้าทางหลัง

        ที่โต๊ะชั่ง ออร์ริส เจ้าโต๊ะชั่งมือสีน้ำฝาด ชั่งเกล็ดดินแข็งจากหลังของมันแผ่นเดียว จ่ายครั้งเดียว ฟินเดล เสมียนของสาขา เขียนชื่อ{name}ลงสมุด อาซริธแบ่งเงินข้างนอกตามที่ตกลง ครึ่งหนึ่งเป๊ะ ไม่ปัดเศษ
      effects: { org: { id: fang_house, join: true }, gold: 3, flags: [hunted_with_azrith] }
    - id: haggle_the_risk
      label: บอกนางว่าถ้าแบ่งเงินครึ่ง ส่วนที่ต้องเสี่ยงก็ต้องแบ่งครึ่ง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          อาซริธหัวเราะเสียงต่ำ บอกว่าตกลง แล้วให้{name}เข้าทางหลังลูกวัวแทนนาง ส่วนนางไปตีกลอง หลังมันแข็งเหมือนกำแพงดิน {name}หาช่องระหว่างเกล็ดเจอตอนมันหันไปทางเสียงกลองครั้งที่สาม

          ที่โต๊ะชั่ง ฟินเดลเขียนชื่อ{name}ลงสมุดของสาขา อาซริธแบ่งเงินให้มากกว่าครึ่งหนึ่งเหรียญ บอกว่าค่าคนที่กล้าต่อรองกับทีฟลิ่งที่ถือมีด
        effects: { org: { id: fang_house, join: true }, stats: { CHA: 1 }, gold: 4, flags: [hunted_with_azrith] }
      failure:
        text: |
          อาซริธบอกว่าเอาตามนี้หรือไม่เอา {name}เอา ทั้งวันนั้นยืนตีกลองอยู่ปลายแปลง ดินที่ลูกวัวสะบัดออกจากหลังตกใส่หัวจนผมแข็ง

          ที่โต๊ะชั่ง ฟินเดลเขียนชื่อ{name}ลงสมุดของสาขา อาซริธแบ่งเงินตามที่ตกลงแต่แรก ส่วนแบ่งของคนตีกลอง
        effects: { org: { id: fang_house, join: true }, gold: 2, flags: [hunted_with_azrith] }
    - id: same_brand
      label: บอกนางตรงๆ ว่ามีตราร้อนเหมือนกัน
      requires: { trait: curse_brand }
      text: |
        อาซริธยิ้มเป็นครั้งแรก บอกว่ารู้ตั้งแต่{name}เข้าประตูมา คนมีตราสองคนบนใบเดียว ลูกวัวไม่สน แต่เจ้าของนาจะยื่นเงินค่าข้าวเที่ยงให้ด้วยปลายนิ้ว แล้วนางก็พูดถูก ชาวนาวางขนมปังไว้บนตอไม้ให้ ไม่ยอมยื่นใส่มือ

        ที่โต๊ะชั่ง ออร์ริสชั่งเกล็ดดินแผ่นเดียว จ่ายครั้งเดียว เงินจากมือนางลงมือ{name}ตรงๆ ฟินเดลเขียนชื่อ{name}ลงสมุดของสาขา
      effects: { org: { id: fang_house, join: true }, stats: { CON: 1 }, gold: 3, flags: [hunted_with_azrith] }
    - id: slide_it_back
      label: เลื่อนใบคืนไปให้นาง
      text: |
        อาซริธพับใบเก็บเข้าอกเสื้อ ไม่ถามเหตุผล ลุกไปโต๊ะถัดไปที่มีนักล่าใบหูขวาแหว่งนั่งหัวเราะเสียงดังอยู่ คุยกันไม่ถึงครึ่งจอกก็ลุกออกไปด้วยกัน

        สัปดาห์ต่อมา{name}ได้ยินในโรงเตี๊ยมเดียวกันว่าใบลูกวัวใบนั้นปลดแล้ว ชื่อที่สองคือยาเรค แบ่งกันเจ็ดต่อสาม ยาเรคได้เจ็ด
      effects: { flags: [turned_down_azrith] }

# ---------- งานที่โรงส่งมา (ไฟล์ ก: 10 เรื่อง) ----------
- id: adult.fang_duty_wolves
  stage: adult
  scene: road
  weight: 20
  once: false
  time: dusk
  duty: fang_house
  when:
    age: [28, 64]
    org: fang_house
  text: |
    ใบค่าหัวหมาป่าขึ้นกระดานทุกหนาว ใบนี้มาจากหมู่บ้านตัดไม้ชายป่า ผู้ใหญ่บ้านเขียนว่าสามตัว คนตัดไม้ที่โดนกัดน่องบอกว่าห้า ฟินเดลอ่านทั้งสองตัวเลข แล้วบอกว่าโรงจ่ายตามหางที่วางบนโต๊ะ ไม่ได้จ่ายตามตัวเลขบนใบ

    {name}ไปถึงหมู่บ้านตอนบ่าย ชาวบ้านปิดประตูหน้าต่างตั้งแต่ตะวันยังไม่ตก แพะทั้งหมู่บ้านต้อนเข้าไปรวมกันในโรงเลื่อย เหลือแต่แพะแก่ตัวเดียวที่ผูกไว้กับหลักกลางลาน ตามที่{name}ขอ
  encounter:
    foe: wolf
    name: ฝูงหมาป่าชายป่า
    morale: 2
    beats:
      - text: ตอนพลบ หมาป่าออกมาจากชายป่าทีละตัว ไม่รีบ ตัวหน้าสุดหยุดดมลมห่างหลักแพะยี่สิบก้าว ตัวอื่นกระจายออกเป็นครึ่งวง แพะแก่ร้องเสียงแหบ
        moves:
          - id: wf_torch
            label: จุดคบเพลิง ก้าวออกไปยืนข้างแพะ
            kind: attack
            tags: [fire]
          - id: wf_pan
            label: ตีกระทะเหล็กที่ยืมมาจากครัวให้ดังลั่นลาน
            kind: talk
            tags: [noise]
          - id: wf_count
            label: นับให้ครบ ดูว่าตัวไหนเป็นจ่าฝูง
            kind: read
            stat: WIS
            success: ห้าตัว คนตัดไม้นับถูก ตัวที่หยุดดมลมไม่ใช่จ่าฝูง ตัวที่นั่งอยู่หลังสุดตรงชายป่าต่างหาก หางมันต่ำกว่าตัวอื่น และทุกตัวหันไปดูมันก่อนจะขยับ
          - id: wf_wall
            label: ถอยหลังชิดผนังโรงเลื่อย รอให้มันเข้ามาเอง
            kind: guard
          - id: wf_back_in
            label: ถอยเข้าโรงเลื่อย ปิดประตู
            kind: flee
      - text: ตัวหนึ่งอ้อมมาทางหลังโรงเลื่อย พุ่งเข้าหาขาของ{name}จากด้านที่แสงไฟส่องไม่ถึง อีกสองตัวกระโจนเข้าหาแพะพร้อมกัน
        answer: quick
        moves:
          - id: wf_sidestep
            label: เบี่ยงตัวหลบ ให้มันงับลม
            kind: quick
          - id: wf_swing
            label: เหวี่ยงไฟเป็นวงรอบตัว
            kind: attack
            tags: [fire]
          - id: wf_cloak
            label: พันผ้าคลุมรอบแขน ยื่นให้มันงับ
            kind: guard
          - id: wf_back_in2
            label: ทิ้งแพะ วิ่งเข้าโรงเลื่อย
            kind: flee
      - text: จ่าฝูงลุกจากชายป่า เดินออกมายืนกลางลาน ขนคอตั้ง หางต่ำ ตัวที่เหลือหยุดรอดูว่ามันจะเอาอย่างไร
        answer: attack
        moves:
          - id: wf_lead
            label: แทงเข้าอกจ่าฝูงตอนมันก้มหัว
            kind: attack
            tags: [pierce]
            success: ปลายหอกเข้าใต้กระดูกอกตอนมันก้มหัวจะพุ่ง จ่าฝูงล้มลงข้างหลักแพะ ขาหลังยังตะกุยดินอีกสองสามครั้ง ตัวที่เหลือถอยกลับเข้าชายป่าโดยไม่มีตัวไหนหันมาดู
          - id: wf_roar
            label: ตะโกนใส่หน้ามัน ก้าวเข้าหาทีละก้าว
            kind: talk
            tags: [noise]
          - id: wf_hold
            label: ยืนขวางหน้าแพะ ไม่ถอยสักก้าว
            kind: guard
          - id: wf_back_in3
            label: ถอยไปตามผนังจนถึงประตูโรงเลื่อย
            kind: flee
    win:
      text: |
        {name}ตัดหางจ่าฝูงกับอีกสองตัวที่นอนอยู่ในลาน ห่อผ้าเกลือ ชาวบ้านเปิดประตูออกมาทีละบ้าน คนตัดไม้ที่โดนกัดน่องเดินกะเผลกมานับหางเองสองรอบ

        คืนนั้นแพะแก่นอนอยู่ข้างเตาไฟในบ้านผู้ใหญ่บ้าน ผู้ใหญ่บ้านดึงใบค่าหัวหน้าบ้านลงเองตอนรุ่งเช้า
      effects: { reputation: { fang_house: 1 } }
    lose:
      text: |
        ชาวบ้านออกมาพร้อมคบไฟกับขวานตัดไม้ตอนได้ยินเสียง{name}ล้ม หมาป่าถอยกลับเข้าป่า เหลือรอยเขี้ยวที่แขนกับน่องของ{name}เป็นแถว แพะแก่ไม่รอด

        ผู้ใหญ่บ้านให้นอนในโรงเลื่อยจนเดินได้ ใบค่าหัวยังแขวนอยู่หน้าบ้านเขา เขียนเพิ่มด้วยถ่านว่าห้าตัว
    stalemate:
      text: |
        ไฟในคบเพลิงหมดตอนฟ้าเริ่มเทา หมาป่าถอยกลับเข้าป่าทีละตัวเหมือนตอนออกมา ไม่มีตัวไหนนอนอยู่ในลาน แพะแก่ยังยืนอยู่ที่หลัก ขาสั่น

        ผู้ใหญ่บ้านจ่ายค่าน้ำมันคบเพลิงให้หนึ่งเหรียญจากกระเป๋าตัวเอง บอกว่าอย่างน้อยหนาวนี้มันรู้แล้วว่าหมู่บ้านนี้มีคน
      effects: { gold: 1 }
    flee:
      text: |
        {name}ปิดประตูโรงเลื่อยลงกลอน แพะในนั้นร้องกันทั้งคืน ข้างนอกเสียงแพะแก่หยุดไปก่อนเที่ยงคืน

        เช้าขึ้น ในลานเหลือแต่เชือกกับหลัก ใบค่าหัวหน้าบ้านผู้ใหญ่บ้านยังแขวนอยู่ที่เดิม
    death:
      text: |
        จ่าฝูงไม่ได้มาจากข้างหน้า มันมาจากข้างหลัง ตอนที่{name}ยังหันหาตัวที่ยืนอยู่กลางลาน น้ำหนักทั้งตัวของมันกดลงบนหลัง

        คบเพลิงหลุดมือกลิ้งไปบนดิน ยังติดอยู่ ส่องแพะแก่ที่ยังยืนขาสั่นอยู่ที่หลัก

- id: adult.fang_duty_drain_crabs
  stage: adult
  scene: market
  weight: 20
  once: false
  time: night
  duty: fang_house
  when:
    age: [28, 64]
    org: fang_house
    not_traits: [curse_brand]
  text: |
    ฝนเค็มตกที่เวนทราสคืนเดียวก็พอให้ท่อระบายน้ำใต้ตลาดปลามีปูฝนเค็มทั้งรัง ใบของสมาคมพ่อค้าปลาขึ้นกระดานทุกครั้งหลังฝนแบบนี้ จ่ายตามกระดองที่วางบนโต๊ะ คืนก่อน ปลาที่คนขายวางไว้ใต้แผงหายไปสามเข่ง เหลือแต่เข่งเปล่ากับรอยก้ามบนเกล็ดที่ร่วงอยู่

    {name}ลงท่อทางตะแกรงหลังแผงขายหอย มือหนึ่งถือตะเกียง อีกมือถือถุงผ้าใส่ช้อนสังกะสีที่ซื้อเหมาจากร้านของเก่า น้ำในท่อลึกถึงข้อเท้า เค็มจนแสบแผลที่มือ
  encounter:
    foe: salt_crab
    name: รังปูฝนเค็มใต้ตลาดปลา
    morale: 2
    beats:
      - text: ใต้ตะแกรงท่อช่วงที่สาม ปูฝนเค็มสิบกว่าตัวเกาะกันเป็นก้อนเท่าโอ่ง ก้ามใสสะท้อนแสงตะเกียง ตัวใหญ่สุดเท่าฝาหม้อหุงข้าว ทุกตัวหันมาทางแสงพร้อมกัน
        moves:
          - id: crab_spoons
            label: โยนช้อนสังกะสีทั้งพวงไปทางปากท่อ
            kind: item
            stat: DEX
            tags: [bait]
            success: ช้อนสังกะสีกระทบผนังท่อดังกริ๊งแล้วจมลงน้ำ ก้อนปูแตกออกเป็นตัวๆ ไล่ตามแสงวับที่จมอยู่ใต้น้ำ เหลือตัวใหญ่สุดตัวเดียวที่ยังเกาะผนังอยู่ตรงหน้า
          - id: crab_heel
            label: กระทืบส้นรองเท้าลงตัวที่ใกล้ที่สุด
            kind: attack
            tags: [blunt]
          - id: crab_knife
            label: ใช้มีดงัดตัวใหญ่สุดออกจากผนัง
            kind: attack
            tags: [edge]
          - id: crab_lamp
            label: ส่องตะเกียงไล่ดูว่าตัวไหนเป็นตัวแม่
            kind: read
            stat: INT
          - id: crab_grate
            label: ยืนบนแผ่นตะแกรงเหล็ก ไม่ให้มันไต่ขึ้นมาถึงตัว
            kind: guard
          - id: crab_up
            label: ปีนกลับขึ้นตะแกรง
            kind: flee
      - text: ตัวใหญ่สุดหนีบหัวรองเท้าไว้ ตัวเล็กสามตัวไต่ขึ้นมาตามขากางเกง ก้ามเล็กแต่คม หนีบตรงไหนเลือดซึมตรงนั้น
        answer: guard
        moves:
          - id: crab_shake
            label: สะบัดขาฟาดกับผนังท่อ
            kind: guard
          - id: crab_fishbones
            label: เทเข่งก้างปลาที่ขอมาจากแผงลงน้ำอีกฟาก
            kind: item
            stat: DEX
            tags: [bait]
          - id: crab_lamp_bash
            label: เอาก้นตะเกียงทุบกระดองตัวที่หนีบรองเท้า
            kind: attack
            tags: [blunt]
          - id: crab_up2
            label: ทิ้งถุงช้อน ปีนกลับขึ้นไปทั้งที่ยังมีปูเกาะขา
            kind: flee
    win:
      text: |
        ตัวใหญ่สุดหงายท้องลอยอยู่ในน้ำ ตัวที่เหลือไหลไปตามท่อออกทะเล {name}เก็บกระดองได้ครึ่งถุง ใส่มาทั้งก้ามที่ยังขยับ

        ตอนรุ่งเช้าคนขายปลาวางเข่งใต้แผงเหมือนเดิม คนหนึ่งยื่นปลาทูสามตัวร้อยเชือกให้{name}ตอนเดินผ่าน ไม่ได้พูดว่าให้ทำไม
      effects: { reputation: { fang_house: 1 } }
    lose:
      text: |
        {name}ปีนขึ้นจากท่อตอนฟ้าสาง นิ้วมือสองนิ้วบวมเป่ง ขากางเกงขาดเป็นริ้ว รอยก้ามเล็กๆ ขึ้นแดงเต็มน่อง ปูยังอยู่ในท่อครบรัง

        คนขายหอยหลังแผงเห็นแล้วหัวเราะ แต่เอาน้ำจืดมาราดขาให้ทั้งถัง
    stalemate:
      text: |
        น้ำทะเลขึ้นมาตามท่อตอนเกือบสาง ปูฝนเค็มปล่อยรองเท้า ไหลออกไปกับน้ำทีละตัวจนหมดรัง เหลือแต่เข่งปลาที่มันลากลงมาเปล่าๆ สามใบ

        สมาคมพ่อค้าปลาให้ค่าลงท่อหนึ่งเหรียญ บอกว่าฝนเค็มครั้งหน้ามันก็กลับมา
      effects: { gold: 1 }
    flee:
      text: |
        {name}ขึ้นจากท่อพร้อมปูตัวเล็กสองตัวที่ยังเกาะขากางเกง สะบัดเท่าไรก็ไม่หลุดจนคนขายหอยเอาไม้คีบให้

        คืนต่อมาปลาใต้แผงหายไปอีกสองเข่ง

- id: adult.fang_duty_paper_round
  stage: adult
  scene: tavern
  weight: 20
  once: false
  duty: fang_house
  when:
    age: [28, 64]
    org: { id: fang_house, max_rank: 3 }
  text: |
    ทุกต้นเดือนฟินเดลคัดรายชื่อใบที่จ่ายไปแล้วจากสมุดของสาขา ส่งให้นักล่าคนหนึ่งเดินไปปลดออกจากกระดานหน้าโรงเตี๊ยมทุกแห่งในเขต ไม่จ่ายสองครั้ง ใบที่จ่ายแล้วยังแขวนค้าง ก็เท่ากับหลอกคนที่ยังไม่รู้ให้ออกไปเสี่ยงเปล่าๆ

    เดือนนี้รายชื่อยาวครึ่งหน้า โรงเตี๊ยมหกแห่ง ทางเดินสามวัน ค่าแรงสองเหรียญ กับเหล้าที่เจ้าของโรงเตี๊ยมทุกร้านต้องรินให้คนของโรงหนึ่งจอกตามธรรมเนียม ฟินเดลยื่นกระดาษให้ ขอบกระดาษมีรอยนิ้วหมึกของเขาเป็นวงดำ
  choices:
    - id: walk_the_round
      label: เดินปลดใบให้ครบหกร้าน
      text: |
        {name}ปลดใบตามรายชื่อทีละร้าน พับใส่ย่ามรวมกัน ร้านที่ห้ามีนักล่าหนุ่มคนหนึ่งเพิ่งกลับมาจากชายป่า ถือหางหมาป่าห่อผ้าเกลือมาจะวางโต๊ะ ใบของเขาจ่ายไปตั้งแต่สัปดาห์ก่อน

        {name}ยื่นใบที่ปลดแล้วให้เขาดู เขาอ่านชื่อคนที่ได้เงินไปแล้วออกเสียงช้าๆ แล้วนั่งลงกับม้านั่งหน้าร้าน หางหมาป่ายังอยู่บนตัก
      effects: { gold: 2 }
    - id: run_the_round
      label: เดินให้ครบในสองวัน ก่อนนักล่าในเขตจะออกไปตามใบเก่า
      check: { stat: CON, dc: 12 }
      success:
        text: |
          {name}นอนแค่คืนเดียว ปลดใบครบหกร้านก่อนตะวันตกของวันที่สอง ร้านสุดท้ายมีนักล่าสามคนนั่งตกลงกันอยู่ว่าจะออกไปตามใบหมีพรุ่งนี้ ใบหมีใบนั้นจ่ายไปแล้วตั้งแต่ต้นเดือน

          ทั้งสามคนรินเหล้าให้{name}คนละจอก ฟินเดลเขียนลงสมุดของสาขาว่าปลดใบครบก่อนกำหนด
        effects: { gold: 2, reputation: { fang_house: 1 } }
      failure:
        text: |
          วันที่สองฝนตกทั้งวัน ทางดินเละถึงข้อเท้า {name}ไปถึงร้านที่หกช้ากว่าที่ตั้งใจหนึ่งวัน ข้อเท้าซ้ายพลิกที่สะพานไม้ระหว่างทาง

          ใบที่ร้านนั้นยังแขวนอยู่ครบ นักล่าสองคนออกไปตามใบหนึ่งในนั้นตั้งแต่เมื่อวาน
        effects: { hp: -1, gold: 2 }
    - id: sing_the_list
      label: ร้องประกาศรายชื่อใบที่ปลดแล้วในทุกร้านที่ไปถึง
      requires: { class: bard }
      text: |
        {name}ร้องรายชื่อเป็นทำนองเพลงเดินทาง ใบละวรรค ชื่อหมู่บ้าน ชื่อสัตว์ ชื่อคนที่ได้เงิน คนในร้านร้องตามท่อนที่เป็นชื่อสัตว์ ร้านที่สามขอให้ร้องซ้ำ

        เจ้าของร้านที่ห้าจ่ายเพิ่มให้หนึ่งเหรียญ ขอให้ต้นเดือนหน้ากลับมาร้องอีก
      effects: { gold: 3 }
    - id: send_findel
      label: บอกฟินเดลว่าเดือนนี้ไม่ว่าง ให้เขาเดินเอง
      refuse: true
      text: |
        ฟินเดลเดินเองสามวัน กลับมาพร้อมรองเท้าที่พื้นทะลุสองข้างกับใบที่ปลดแล้วทั้งปึก ส้นเท้าพันผ้า

        เขาเขียนลงสมุดของสาขาว่าใครปฏิเสธรอบนี้ ลายมือเรียบร้อยเหมือนทุกบรรทัด
      effects: { flags: [sent_findel_on_the_round] }

- id: adult.fang_duty_bear
  stage: adult
  scene: road
  weight: 20
  duty: fang_house
  when:
    age: [30, 64]
    org: { id: fang_house, min_rank: 2 }
  text: |
    ใบหมีจากหมู่บ้านชายป่าไอเลธเขียนสองภาษา ภาษาคนบรรทัดบน ภาษาเอลฟ์บรรทัดล่าง ตัวหนังสือเอลฟ์ม้วนสวยกว่าเนื้อความ หมีตัวผู้ตัวหนึ่งทุบรังผึ้งของหมู่บ้านไปสิบสองรัง ฆ่าวัวไถหนึ่งตัว แล้วกลับมากินซากวัวทุกคืน ใบนี้ฟินเดลไม่แขวนกระดานหน้าร้าน แขวนไว้หลังโต๊ะชั่ง ให้เฉพาะนักล่าป้ายทองเหลืองขึ้นไป

    คนในหมู่บ้านพาไปดูซากวัวที่ชายป่า ขาหลังหายไปหนึ่งข้าง รอยเล็บบนเปลือกต้นสนข้างซากสูงกว่าหัวคนยืน ผู้ใหญ่บ้านให้ยืมหม้อทองเหลืองใบใหญ่กับรวงผึ้งที่เหลืออยู่สองรวง บอกว่าในป่านี้ไม่มีใครวิ่งหนีหมีพ้น
  encounter:
    foe: bear
    name: หมีชายป่าไอเลธ
    morale: 3
    beats:
      - text: หมีออกมาจากพงตอนตะวันใกล้ตก เดินตรงมาที่ซากวัว แล้วหยุด ยืนขึ้นสองขาดมลม หัวหันมาทาง{name}ช้าๆ
        moves:
          - id: bear_pot
            label: เคาะหม้อทองเหลือง ร้องเสียงต่ำยาวใส่มัน
            kind: talk
            tags: [noise]
          - id: bear_comb
            label: วางรวงผึ้งไว้กลางทาง แล้วถอยออกมาห้าก้าว
            kind: item
            stat: WIS
            tags: [bait]
          - id: bear_wind
            label: ดูทางลม ดูว่ามันได้กลิ่นมาจากทางไหน
            kind: read
            stat: WIS
            success: ลมพัดจากชายป่าออกมาทางทุ่ง มันได้กลิ่นซากวัวแต่ยังไม่ได้กลิ่นคน มันยืนขึ้นเพราะได้ยินเสียง ไม่ใช่เพราะได้กลิ่น ถ้าอ้อมไปอยู่ใต้ลม มันจะหาด้วยหูอย่างเดียว
          - id: bear_set
            label: ปักโคนหอกลงดิน ตั้งรับ
            kind: guard
          - id: bear_back
            label: ถอยกลับไปทางหมู่บ้าน
            kind: flee
      - text: มันลงสี่ขาแล้ววิ่งเข้ามา เร็วกว่าตัวขนาดนั้นควรจะเร็ว ดินกระจายทุกก้าว
        answer: guard
        moves:
          - id: bear_brace
            label: ยันโคนหอกกับดิน ให้มันวิ่งเข้าปลายหอกเอง
            kind: guard
          - id: bear_dodge
            label: กระโดดหลบข้าง
            kind: quick
          - id: bear_shout
            label: ยืนให้มั่น ตะโกนใส่หน้ามันให้ดังที่สุด
            kind: talk
            tags: [noise]
          - id: bear_back2
            label: วิ่งหนีไปทางต้นไม้
            kind: flee
      - text: มันยืนขึ้นตรงหน้า สูงกว่า{name}สองหัว ไหล่ซ้ายมีเลือดไหลเป็นทาง อุ้งเท้าหน้ายกขึ้นจะตบลงมา
        answer: attack
        moves:
          - id: bear_stab
            label: แทงสวนขึ้นไปใต้อุ้งเท้าที่ยกอยู่
            kind: attack
            tags: [pierce]
          - id: bear_shield
            label: ยกด้ามหอกขวางรับแรงตบ
            kind: guard
          - id: bear_fish
            label: โยนถุงปลาแห้งข้ามหัวมันไปข้างหลัง
            kind: item
            stat: DEX
            tags: [bait]
          - id: bear_back3
            label: ถอยหลังไปตามทางที่มา
            kind: flee
      - text: มันลงสี่ขา ถอยไปครึ่งก้าว หายใจหอบจนน้ำลายเป็นฟอง สายตาย้ายไปมาระหว่าง{name}กับชายป่า
        answer: talk
        moves:
          - id: bear_last_noise
            label: เคาะหม้อพร้อมก้าวเข้าหาทีละก้าว ให้มันเลือกป่า
            kind: talk
            tags: [noise]
            success: หม้อทองเหลืองดังไปทั้งทุ่ง {name}ก้าวเข้าหาทีละก้าวไม่หยุด หมีหันหลังให้ทีละครึ่งตัว แล้ววิ่งเข้าป่า ล้มลงตรงชายป่าห่างไปไม่ถึงสามสิบก้าว เลือดจากไหล่ไหลออกมามากเกินกว่าจะไปได้ไกลกว่านั้น
          - id: bear_finish
            label: พุ่งเข้าแทงซ้ำตอนมันลังเล
            kind: attack
            tags: [pierce]
          - id: bear_hold
            label: ยืนนิ่ง ไม่ให้มันคิดว่าได้เปรียบ
            kind: guard
          - id: bear_back4
            label: ปล่อยมันไป ถอยกลับหมู่บ้าน
            kind: flee
    win:
      text: |
        ชาวบ้านมาช่วยลากหมีออกจากชายป่าตอนเช้า ใช้คนแปดคนกับวัวอีกตัว {name}ตัดเล็บหน้าทั้งสองข้างไว้เป็นหลักฐาน ส่วนหนังกับเนื้อผู้ใหญ่บ้านแบ่งให้ทุกบ้าน

        คนเลี้ยงผึ้งของหมู่บ้านเป็นเอลฟ์แก่ หักรวงผึ้งรวงสุดท้ายที่เหลือให้{name}ครึ่งรวง พูดภาษาของเธอหนึ่งประโยค คนแปลบอกว่าแปลว่าเดินทางปลอดภัย
      effects: { stats: { STR: 1 }, reputation: { fang_house: 1 }, flags: [took_the_ileth_bear] }
    lose:
      text: |
        {name}ตื่นขึ้นในบ้านผู้ใหญ่บ้าน ไหล่กับต้นขาพันผ้าแน่น หมอสมุนไพรของหมู่บ้านบอกว่าถ้าหม้อทองเหลืองไม่ดังจนหมีตกใจหันหนีไปก่อน คงไม่ได้ตื่น

        ใบหมีกลับไปแขวนหลังโต๊ะชั่งที่สาขา มีรอยเลือดแห้งที่มุมใบ
    stalemate:
      text: |
        หมีถอยกลับเข้าป่าตอนมืดสนิท ลากขาหลังข้างหนึ่ง ไม่กลับมาที่ซากวัวอีก คืนต่อมาก็ไม่มา

        ผู้ใหญ่บ้านให้ค้างจนสัปดาห์ต่อมา รังผึ้งที่ตั้งใหม่ไม่มีอะไรมาแตะ ใบหมีปลดลงจากหลังโต๊ะชั่ง จ่ายครึ่งหนึ่งตามที่ใบเขียนไว้สำหรับไล่ไปได้โดยไม่ตาย
    flee:
      text: |
        {name}ถอยกลับถึงหมู่บ้านตอนมืด หมีไม่ตามมา มันกลับไปกินซากวัวต่อจนเหลือแต่กระดูก

        สองคืนต่อมามันพังรังผึ้งไปอีกสามรัง ผู้ใหญ่บ้านส่งคนไปบอกโรงให้หานักล่าคนใหม่
    death:
      text: |
        อุ้งเท้าหน้าตบลงมาทีเดียว หอกหลุดมือ {name}ล้มลงบนซากวัว

        ข้างบน หมีหายใจหอบเป็นไอขาว ดมลมอยู่ครู่หนึ่ง แล้วก้มลงกินต่อ

- id: adult.fang_duty_dead_factory
  stage: adult
  scene: workshop
  weight: 20
  time: night
  duty: fang_house
  when:
    age: [32, 64]
    org: { id: fang_house, min_rank: 3, max_rank: 3 }
  text: |
    ใบนี้ไม่เคยขึ้นกระดาน ออร์ริสยื่นให้ในห้องหลังม่านผ้ากระสอบ เจ้าของโรงหล่อเฟืองร้างแห่งหนึ่งริมคลองในเวนทราส ปิดโรงไปตั้งแต่หนาวที่แล้วเพราะหนี้ แต่หุ่นยามประจำโรงยังเดินตรวจอยู่ตามรอบเดิมทุกคืน ฟันคนเก็บของเก่าไปสองคน ผู้ตรวจของราชสำนักจะมาเปิดโรงในอีกสามวัน

    เขาต้องการให้หุ่นหยุดก่อนนั้น และต้องการเฟืองหัวใจของมันกลับคืนมาวางบนโต๊ะของเขาเอง ค่าจ้างนอกใบสี่เหรียญ โรงไม่ถามว่าเขาจะเอาเฟืองไปทำอะไร

    ประตูโรงหล่อล่ามโซ่ไว้ เจ้าของให้กุญแจมาดอกหนึ่ง ข้างในมีเสียงเท้าเหล็กเหยียบพื้นหินเป็นจังหวะ สิบหกก้าว หยุด สิบหกก้าว หยุด
  encounter:
    foe: mad_sentry
    name: หุ่นยามโรงหล่อร้าง
    morale: 3
    beats:
      - text: หุ่นยามเดินรอบโรงหล่อตามเส้นที่เท้าเหล็กของมันเหยียบพื้นจนเป็นร่อง ดวงตาเป็นตะเกียงสองดวงที่หรี่ลงแล้วสว่างขึ้นตามจังหวะเฟือง แขนข้างหนึ่งเป็นดาบ อีกข้างเป็นคีมจับเหล็กร้อน
        moves:
          - id: ms_count
            label: นับรอบเฟือง ดูว่ามันหยุดหันตรงไหน
            kind: read
            stat: INT
            success: สิบหกก้าว หยุด หันซ้าย หันขวา แล้วเดินต่อ ตอนหันขวามันหันไม่สุด เฟืองที่คอติดอยู่ฟันหนึ่ง ด้านซ้ายหลังของมันเป็นที่เดียวในโรงที่ตะเกียงตาไม่เคยส่องถึง
          - id: ms_knee
            label: เอาเหล็กแหลมแทงข้อเข่าตอนมันก้าว
            kind: attack
            tags: [pierce]
          - id: ms_password
            label: ตะโกนรหัสผ่านที่เจ้าของโรงจดให้
            kind: talk
          - id: ms_pillar
            label: หลบหลังเสาเหล็กหล่อ รอให้มันเดินผ่าน
            kind: guard
          - id: ms_out
            label: ถอยออกประตู ล่ามโซ่กลับ
            kind: flee
      - text: ตะเกียงตาทั้งสองดวงสว่างจ้าพร้อมกัน มันเห็นแล้ว เลิกเดินตามเส้น หันมาตรงๆ ง้างแขนดาบขึ้นสูง
        answer: quick
        moves:
          - id: ms_roll
            label: กลิ้งผ่านใต้แขนดาบไปทางซ้ายหลังของมัน
            kind: quick
          - id: ms_block
            label: ยกแท่งเหล็กขวางรับดาบ
            kind: guard
          - id: ms_jab
            label: แทงเข้าช่องใต้รักแร้ตอนมันง้าง
            kind: attack
            tags: [pierce]
          - id: ms_out2
            label: วิ่งไปทางประตู
            kind: flee
      - text: แขนดาบฟันลงมาสามครั้งติดกัน ไม่เร็ว แต่ไม่หยุด แต่ละครั้งเฉือนเสาเหล็กหล่อเป็นรอยลึกเท่านิ้ว คีมอีกข้างไล่ตามจะหนีบ
        answer: guard
        moves:
          - id: ms_brace
            label: ตั้งรับหลังทั่งตีเหล็ก ให้ดาบลงทั่ง
            kind: guard
          - id: ms_slip
            label: หลบไปมาระหว่างเสา ให้มันฟันเสาแทน
            kind: quick
          - id: ms_chain
            label: กระชากโซ่รอกจากเพดานลงมาพันแขนมัน
            kind: item
            stat: DEX
            tags: [blunt]
          - id: ms_out3
            label: วิ่งไปทางประตู
            kind: flee
      - text: มันหยุด หันหลังกลับไปเดินตามเส้นเดิมเหมือนไม่มีอะไรเกิดขึ้น สิบหกก้าว ช่องไขลานหลังคอเปิดอยู่ตรงหน้า เฟืองข้างในหมุนเป็นแสงวาบ
        answer: attack
        moves:
          - id: ms_neck
            label: แทงเหล็กแหลมเข้าช่องไขลานหลังคอ
            kind: attack
            tags: [pierce]
            success: เหล็กแหลมเข้าไปจนสุดด้าม เฟืองข้างในกินกันเองเสียงเหมือนคนบดกรวดในปาก หุ่นยามเดินต่อไปอีกสามก้าว หยุด ตะเกียงตาหรี่ลงทีละดวง แล้วล้มคว่ำลงตรงร่องที่มันเหยียบมาเองหลายปี
          - id: ms_climb
            label: ปีนขึ้นหลังมัน
            kind: quick
          - id: ms_wait
            label: รอให้มันเดินครบรอบแล้วค่อยเข้า
            kind: guard
          - id: ms_out4
            label: ปล่อยให้มันเดินไป ถอยออกประตู
            kind: flee
    win:
      text: |
        เฟืองหัวใจของหุ่นยามใหญ่เท่าจานข้าว หนักเท่าก้อนอิฐ {name}แงะออกมาตอนตีสี่ ห่อผ้า แบกไปวางบนโต๊ะของเจ้าของโรงหล่อ เขาลูบฟันเฟืองทีละซี่ นับสี่เหรียญให้โดยไม่เงยหน้า

        ผู้ตรวจของราชสำนักมาเปิดโรงตามกำหนด เขียนรายงานว่าหุ่นยามประจำโรงชำรุด หยุดทำงานเอง ไม่มีใครแก้
      effects: { stats: { DEX: 1 }, gold: 4, reputation: { fang_house: 1 }, flags: [stopped_the_foundry_sentry] }
    lose:
      text: |
        {name}คลานออกมาถึงประตูได้เอง แขนซ้ายมีรอยดาบยาวตั้งแต่ศอกถึงข้อมือ ล่ามโซ่กลับได้ก่อนหุ่นยามจะเดินมาถึงประตูครบสิบหกก้าว

        ออร์ริสเย็บแผลให้เองในห้องหลัง ด้วยเข็มเย็บหนังกับด้ายป่าน มือสีน้ำฝาดไม่สั่นสักเข็ม ใบนั้นกลับไปปักอยู่บนผนังห้องหลังด้วยมีดเล่มเดิม
    stalemate:
      text: |
        ตอนฟ้าสาง ลานในตัวหุ่นยามหมดเอง มันหยุดกลางรอบ ก้าวที่เก้า ยืนแข็งอยู่อย่างนั้น ตะเกียงตาค้างแสงสลัวไว้ดวงเดียว

        เจ้าของโรงหล่อได้เฟืองหัวใจคืนในวันนั้น แต่บ่นว่าลานหมดเองไม่ใช่ฝีมือคนที่จ้าง ค่าจ้างนอกใบเหลือสองเหรียญ
      effects: { gold: 2 }
    flee:
      text: |
        {name}ล่ามโซ่ประตูกลับตอนดาบของมันฟันลงบนบานประตูเหล็ก รอยฟันทะลุมาถึงด้านนอกเป็นรอยยาวหนึ่งฝ่ามือ

        ผู้ตรวจของราชสำนักมาถึงในสามวัน ไม่ยอมเข้าโรงหล่อหลังจากได้ยินเสียงเท้าเหล็กข้างใน เจ้าของโรงต้องจ่ายค่าปรับ ไม่จ่ายค่าจ้าง
    death:
      text: |
        ดาบครั้งที่สามลงตรงไหล่ {name}ล้มลงบนพื้นหิน ในร่องที่เท้าเหล็กของมันเหยียบมาหลายปี

        มันก้าวข้ามไปเหมือนก้าวข้ามเศษเหล็ก เดินต่อจนครบสิบหกก้าว หยุด หันซ้าย หันขวา

- id: adult.fang_duty_glass_man
  stage: adult
  scene: refinery
  weight: 20
  time: night
  duty: fang_house
  when:
    age: [28, 64]
    org: { id: fang_house, max_rank: 3 }
  text: |
    ใบจากโรงกลั่นริมท่าเวนทราสเขียนว่าแก้วเดินหนึ่งตัว อยู่ในโรงพักถังหลังโรงกลั่น ค่าหัวสามเหรียญ คนเฝ้าโรงที่พา{name}ไปถึงประตูไม่ยอมเดินเข้าไปด้วย บอกว่ามันพูดได้

    ในโรงพักถัง ร่างหนึ่งนั่งพิงถังน้ำค้างดาวที่ว่างแล้ว ผิวครึ่งตัวใสเหมือนกระจกหน้าต่าง เห็นกระดูกข้างในเป็นเงาเทา อีกครึ่งยังเป็นผิวคนธรรมดา มีขนอ่อนที่แขน มือข้างที่ยังเป็นคนกำผ้าพันคอผืนเก่า ตอนแสงตะเกียงส่องถึง มันขอน้ำ เสียงแหบเหมือนคนไม่ได้พูดมาหลายวัน

    เหนือโต๊ะชั่งของโรง ข้อแรกสลักไว้ว่าไม่รับของคน ใบในมือ{name}เขียนว่าแก้วเดิน
  choices:
    - id: do_the_paper
      label: ทำตามที่ใบเขียน เอาเศษกลับไปวางบนโต๊ะ
      text: |
        แก้วแตกง่ายกว่าที่คิด ค้อนครั้งเดียวก็พอ มันไม่ได้ยกมือขึ้นกัน {name}เก็บเศษชิ้นใหญ่ที่สุดใส่ผ้าห่อ ผ้าพันคอผืนเก่าทิ้งไว้ข้างถัง

        ออร์ริสชั่งเศษแก้ว อ่านใบ จ่ายสามเหรียญ ฟินเดลเขียนลงสมุดว่าแก้วเดินหนึ่ง ไม่มีใครถามว่ามันพูดอะไรก่อนแตก
      effects: { gold: 3, alignment: { moral: -1 }, flags: [sold_a_glass_ones_shard] }
    - id: give_him_water
      label: ส่งกระบอกน้ำให้ แล้วถามชื่อเขา
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เขาดื่มน้ำหมดกระบอก บอกชื่อของตัวเอง ชื่อหมู่บ้านริมทุ่งที่เมียกับลูกสาวยังอยู่ บอกว่าเคยเป็นคนยกถังของโรงกลั่นนี้มาเก้าปี ถังน้ำค้างดาวรั่วใส่ไหล่ซ้ายเมื่อปีกลาย เขาขอแค่ให้เปิดประตูหลังโรงพักถัง เขาจะเดินออกไปทางทุ่งเกลือเอง ไม่กลับมาอีก

          {name}เปิดประตูให้ ดูเขาเดินออกไปในความมืด ส่วนที่เป็นแก้วสะท้อนแสงดาวเป็นจุดเล็กๆ จนลับตา ใบนั้นกลับไปแขวนหลังโต๊ะชั่ง ไม่มีใครได้เงิน
        effects: { stats: { CHA: 1 }, flags: [let_the_glass_man_go] }
      failure:
        text: |
          หมาเฝ้าโรงเห่าขึ้นข้างนอกตอนเขากำลังจะบอกชื่อ เขาสะดุ้ง ลุกพรวดจนส่วนที่เป็นแก้วกระแทกขอบถังเหล็ก แตกลงมาทั้งแขน เศษกระจายใส่มือของ{name}เป็นรอยบาดสิบกว่ารอย

          เขาร้องอยู่ไม่นาน คนเฝ้าโรงเปิดประตูเข้ามาพร้อมคบไฟตอนทุกอย่างเงียบแล้ว ผ้าพันคอผืนเก่ายังอยู่ในมือข้างที่เป็นคน
        effects: { hp: -2, flags: [glass_man_shattered] }
    - id: ask_orris_first
      label: กลับไปถามออร์ริสก่อน ว่าแก้วเดินที่พูดได้นับเป็นของคนหรือไม่
      text: |
        ออร์ริสฟังจนจบ แล้วชี้นิ้วสีน้ำฝาดขึ้นไปที่คานไม้ ข้อแรก นางบอกว่าโรงจ่ายตามที่ใบเขียน แต่ถ้าของที่วางบนโต๊ะเคยขอน้ำกิน นางไม่ชั่ง ใบนั้นนางดึงลงจากหลังโต๊ะ ฉีกครึ่ง

        สามวันต่อมา{name}ได้ยินว่าโรงกลั่นจ้างนักล่าป้ายปลอมจากท่าเรือไปทำแทน ได้ค่าจ้างเท่ากัน จ่ายตรงจากมือเจ้าของโรงกลั่น
      effects: { alignment: { law: 1 }, flags: [asked_orris_about_the_glass] }
    - id: hand_it_back
      label: คืนใบให้ฟินเดล บอกว่าใบนี้ไม่ทำ
      refuse: true
      text: |
        ฟินเดลรับใบคืนโดยไม่ถาม แขวนกลับที่เดิมหลังโต๊ะชั่ง บ่ายวันนั้นยาเรคปลดใบไป

        เย็นวันต่อมายาเรควางเศษแก้วห่อผ้าบนโต๊ะชั่ง ผ้าห่อเป็นผ้าพันคอผืนเก่า ออร์ริสชั่ง จ่ายสามเหรียญ ไม่ถามว่าได้ผ้าผืนนั้นมาจากไหน
      effects: { flags: [passed_the_glass_paper] }

- id: adult.fang_duty_hound_race
  stage: adult
  scene: road
  weight: 20
  duty: fang_house
  when:
    age: [28, 60]
    org: { id: fang_house, max_rank: 3 }
  text: |
    ใบหมาเถ้าจากหมู่บ้านริมรางในแดนเถ้าจ่ายแพงกว่าใบสัตว์อื่นเท่าตัว ถ่านในอกหมาเถ้าเป็นหลักฐานที่ปลอมไม่ได้ ฝูงนั้นมีสามตัว คนงานรางช่วย{name}ล้อมไว้ในโรงเก็บหมอนรางจนได้ถ่านมาก้อนหนึ่ง อีกสองตัวหนีไปทางตอเสา

    ที่สถานีปลายราง ยาเรคนั่งอยู่บนกระสอบถ่านหน้าห้องนายสถานี ใบหูขวาแหว่งไปครึ่ง หัวเราะเสียงดังจนคนทั้งชานชาลาหันมา ในมือมีถ่านหมาเถ้าอีกก้อน จากฝูงเดียวกัน ตัวที่หนีไปตัวหนึ่ง ใบเดียว จ่ายครั้งเดียว ให้คนแรกที่ถึงโต๊ะ

    ขบวนถ่านเที่ยวต่อไปออกพรุ่งนี้สาย ยาเรคมีล่อ และรู้ทางลัดข้ามเนินเถ้า
  choices:
    - id: take_the_train
      label: นอนรอขบวนเที่ยวสาย นั่งไปจนถึงเมือง แล้ววิ่งไปโต๊ะ
      text: |
        ขบวนถ่านไปถึงเมืองตอนบ่ายวันที่สาม {name}กระโดดลงก่อนขบวนจอดสนิท วิ่งข้ามลานสถานีไปโรงรับเขี้ยว ถึงโต๊ะชั่งก่อนออร์ริสปิดโต๊ะไม่ถึงครึ่งชั่วยาม นางชั่งถ่าน จ่ายตามใบ ฟินเดลขีดใบนั้นออกจากสมุด

        ยาเรคมาถึงตอนตะวันตก ล่อเหงื่อโชก ออร์ริสไม่แตะถ่านของเขาด้วยซ้ำ ชี้ขึ้นไปที่คานไม้ ข้อที่สาม ยาเรคหัวเราะเสียงดังเหมือนเดิม แล้วโยนถ่านก้อนนั้นทิ้งลงคลองหลังโรง
      effects: { gold: 4, flags: [beat_yarek_to_the_table] }
    - id: go_together
      label: บอกยาเรคว่าไปด้วยกัน วางคู่กัน แบ่งครึ่ง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ยาเรคหัวเราะจนต้องเช็ดน้ำตา แล้วยื่นมือมาจับ ทั้งสองคนขี่ล่อตัวเดียวกันข้ามเนินเถ้า ผลัดกันเดินผลัดกันขี่ ไปถึงโต๊ะชั่งพร้อมกัน วางถ่านสองก้อนพร้อมกัน

          ออร์ริสชั่งก้อนเดียว จ่ายครั้งเดียว เงินแบ่งกันที่หน้าโรง ยาเรคจ่ายค่าเหล้าคืนนั้นทั้งหมด เล่าเรื่องหมาเถ้าตัวที่หนีให้ทั้งร้านฟังสามรอบ แต่ละรอบหมาตัวโตขึ้น
        effects: { stats: { CHA: 1 }, gold: 2, flags: [split_with_yarek] }
      failure:
        text: |
          ยาเรคตกลง จับมือ บอกว่าออกตอนตีห้า {name}ตื่นมาตอนตีห้า ล่อไม่อยู่แล้ว ถ่านในย่ามของ{name}ก็ไม่อยู่ เหลือหินถ่านหินก้อนเท่ากันห่อผ้าไว้แทน

          {name}ไปถึงโต๊ะชั่งช้ากว่าเขาสองวัน ออร์ริสบอกว่าใบนั้นจ่ายแล้ว ให้ยาเรค ไม่ถามว่าเขาได้ถ่านมาจากไหน ข้อที่สองบนคานไม้อยู่เหนือหัวพอดี
        effects: { gold: -1, flags: [yarek_took_the_coal] }
    - id: cut_his_girth
      label: กลางดึก ย่องไปกรีดสายรัดอานล่อของยาเรค
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          มีดผ่านสายรัดอานไปครึ่งหนึ่ง เหลือพอให้ยังรัดอยู่ได้จนกว่าจะขึ้นเนินแรก {name}ขึ้นขบวนเที่ยวสาย ไปถึงโต๊ะชั่งก่อน ได้เงินตามใบ

          ยาเรคมาถึงช้ากว่าห้าวัน เดินเท้ามาทั้งทาง ข้อเท้าบวม เขาไม่หัวเราะ วางสายรัดอานที่ขาดลงบนโต๊ะชั่งข้างมือ{name} รอยตัดครึ่งเส้นเรียบเกินกว่าจะขาดเอง นักล่าที่ยืนต่อแถวอยู่ข้างหลังเห็นกันทุกคน
        effects: { stats: { DEX: 1 }, gold: 4, alignment: { law: -1 }, hunted: { fang_house: 1 }, flags: [cut_yareks_girth] }
      failure:
        text: |
          ล่อของยาเรคร้องตอนมีดแตะสายรัด ยาเรคตื่นมาพร้อมไม้กระบองที่หนุนหัวนอน ไม่ถามอะไร ฟาดลงมาที่ไหล่ของ{name}ครั้งเดียว แล้วกลับไปนอน

          เช้านั้นเขาออกเดินทางตามเวลา ไปถึงโต๊ะชั่งก่อน เรื่องคืนนั้นไปถึงสาขาก่อนเขาด้วย
        effects: { hp: -2, alignment: { law: -1 }, flags: [tried_to_cut_yareks_girth] }
    - id: let_him_have_it
      label: บอกยาเรคว่าใบนี้ของเขา แล้วขายถ่านให้ช่างตีเหล็กที่ปลายราง
      refuse: true
      text: |
        ยาเรคตบไหล่{name}จนเซ บอกว่าคราวหน้าเลี้ยงเหล้า ช่างตีเหล็กที่ปลายรางซื้อถ่านหมาเถ้าไปเผาเตาหนึ่งเหรียญ ถูกกว่าค่าหัวสี่เท่า

        ฟินเดลเขียนในสมุดของสาขาว่า{name}ยกใบให้คนอื่น ยาเรคไม่เคยเลี้ยงเหล้าตามที่บอก
      effects: { gold: 1, flags: [gave_yarek_the_paper] }

- id: adult.fang_duty_fire_cub
  stage: adult
  scene: smithy
  weight: 20
  time: night
  duty: fang_house
  when:
    age: [28, 64]
    org: fang_house
  text: |
    ช่างตีเหล็กในย่านเตาหลอมของคาร์ดินแขวนใบไว้เองที่ประตูโรงตีเหล็ก ไม่ผ่านโรง แต่ประทับตราโรงรับเขี้ยวมาจ่ายเอง ลูกมือใหม่ราดน้ำดับเตาเมื่อคืนก่อนเพราะรีบกลับบ้าน ตีหนึ่งลูกเสือไฟตัวหนึ่งโผล่ออกมาจากเถ้าในเตา ตัวเท่าหมา ขนเป็นเปลวไฟ ไล่ตะครุบหางตัวเองรอบโรง เผาขื่อไปสองท่อนกับผ้ากันเปื้อนหนังอีกสามผืน

    ช่างตีเหล็กอยากได้มันตาย ใบเขียนค่าหัวสามเหรียญ คนแก่ในย่านนั้นที่นั่งดูอยู่หน้าโรงเหล้าฝั่งตรงข้ามบอกว่าแม่ของมันอยู่ใกล้กว่าที่ใครคิด ไฟที่ยืมมาต้องคืนก่อนรุ่ง

    ข้างในโรงตีเหล็ก ลูกเสือไฟนอนขดอยู่บนทั่ง หางเป็นเปลวไฟพาดลงมาถึงพื้น ไม้ใต้ทั่งเริ่มเป็นสีดำ
  choices:
    - id: put_it_out
      label: สาดน้ำทั้งถังใส่มันตอนมันหลับ
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          น้ำทั้งถังลงตรงตัว ไอน้ำพุ่งขึ้นเต็มโรง ลูกเสือไฟร้องเสียงเหมือนแมวโดนเหยียบหาง แล้วดิ้นอยู่บนทั่งจนเปลวไฟหดเหลือเท่าเปลวเทียน ดับลงทีละจุด เหลือก้อนขนสีถ่านแดงอยู่บนทั่ง ยังอุ่น

          ช่างตีเหล็กจ่ายสามเหรียญตามใบ ก่อนรุ่งเช้า เตาทุกเตาในตรอกนั้นลุกเองพร้อมกันครั้งหนึ่ง สูงจนไฟเลียขื่อ แล้วมอดลงเหลือแต่ถ่าน ไม่มีใครในตรอกจุดเตาได้อีกเจ็ดวัน
        effects: { stats: { DEX: 1 }, gold: 3, taboo: { fire: break }, flags: [killed_a_fire_cub] }
      failure:
        text: |
          น้ำลงไม่ถึงครึ่งตัว ลูกเสือไฟสะดุ้งตื่น กระโจนข้ามหัว{name}ไปเกาะกองถ่าน แล้ววิ่งเล่นรอบโรงอยู่ครึ่งคืน แขนเสื้อของ{name}ไหม้ไปทั้งแขน

          ตอนฟ้าเริ่มเทามันกระโดดกลับเข้าเตาเองแล้วหายไป ช่างตีเหล็กไม่จ่าย บอกว่ามันกลับไปเอง
        effects: { hp: -2, taboo: { fire: learn }, flags: [singed_by_a_fire_cub] }
    - id: milk_and_carry
      label: วางชามนมไว้ข้างทั่ง พอมันกินเสร็จก็อุ้มใส่หม้อเหล็ก ไปคืนเตาที่ยังไม่เคยดับก่อนรุ่ง
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ลูกเสือไฟเลียนมหมดชามแล้วนอนต่อ {name}ช้อนมันใส่หม้อเหล็กปากกว้าง ปิดฝาไม่สนิท ให้มีลม แล้วเดินไปตามตรอกหาเตาที่คนแก่หน้าโรงเหล้าบอกว่าไม่เคยดับมาสามชั่วคน เป็นเตาของช่างคนแคระที่ท้ายตรอก

          ช่างคนแคระเปิดประตูเตาให้โดยไม่ต้องอธิบาย ลูกเสือไฟเดินลงไปในถ่านเอง หันมามองครั้งหนึ่ง แล้วนอนขด ฟ้าสางพอดี ช่างตีเหล็กเจ้าของใบไม่จ่าย แต่เตาของเขาจุดติดตั้งแต่เช้านั้นโดยไม่ต้องเป่า
        effects: { stats: { WIS: 1 }, taboo: { fire: keep }, flags: [returned_a_fire_cub] }
      failure:
        text: |
          ลูกเสือไฟกินนมหมด แล้วกระโดดออกจากหม้อเหล็กกลางตรอก วิ่งเล่นไปตามหลังคาโรงตีเหล็กทีละหลัง {name}ตามไปจนสาง ผมไหม้หย่อมหนึ่ง มือพองสองข้าง

          ฟ้าสาง มันกระโดดลงปล่องเตาท้ายตรอกเอง ช่างคนแคระที่เป็นเจ้าของเตาโผล่หัวออกมาดู แล้วปิดหน้าต่าง
        effects: { hp: -1, taboo: { fire: learn }, flags: [chased_a_fire_cub] }
    - id: borrow_fire
      label: ขอไฟจากเตาข้างบ้านมาจุดเตานี้ใหม่ แล้วเปิดประตูเตาไว้ให้มันกลับเอง
      requires: { flag: job_smith }
      text: |
        {name}รู้ว่าช่างตีเหล็กทุกคนในย่านนี้รู้ แต่ลืมเวลารีบ ไฟที่ยืมมาต้องคืน ไฟที่ดับด้วยน้ำต้องจุดใหม่ด้วยไฟของคนอื่น {name}ตักถ่านแดงจากเตาข้างบ้านใส่พลั่วมาจุดเตาใหม่ เป่าจนลุก แล้วเปิดประตูเตาค้างไว้

        ลูกเสือไฟลุกจากทั่งตอนได้กลิ่นถ่านใหม่ เดินเข้าเตาไปนอนขดเหมือนแมวกลับบ้าน ช่างตีเหล็กเจ้าของใบยืนดูอยู่ที่ประตู ฉีกใบของตัวเองทิ้ง แล้วจ่ายค่าถ่านให้สองเหรียญ
      effects: { stats: { INT: 1 }, gold: 2, taboo: { fire: keep }, flags: [returned_a_fire_cub] }
    - id: leave_the_paper
      label: คืนใบให้ช่าง บอกให้ไปหาคนอื่น
      refuse: true
      text: |
        ช่างตีเหล็กพับใบใส่กระเป๋าผ้ากันเปื้อน บ่นว่าโรงรับเขี้ยวสมัยนี้เลือกงาน

        คืนนั้นโรงตีเหล็กของเขาไฟไหม้ขื่ออีกท่อน คนแก่หน้าโรงเหล้านั่งดูอยู่ที่เดิม จิบเหล้าไปด้วย
      effects: { taboo: { fire: learn }, flags: [left_the_fire_cub_paper] }

- id: adult.fang_duty_sawn_horns
  stage: adult
  scene: market
  weight: 20
  duty: fang_house
  when:
    age: [30, 64]
    org: { id: fang_house, min_rank: 2, max_rank: 3 }
  text: |
    ออร์ริสไปโรงใหญ่ที่เวนทราสสามวัน ให้{name}นั่งโต๊ะชั่งแทน นักล่าป้ายทองเหลืองนั่งโต๊ะแทนได้ ชั่งได้ จ่ายได้ เปิดตู้สมุดเขี้ยวไม่ได้ ฟินเดลนั่งเขียนอยู่ข้างๆ คอยบอกราคาของที่{name}ไม่เคยชั่ง

    บ่ายวันที่สอง เด็กผู้ชายผอมๆ คนหนึ่งวางห่อผ้าลงบนโต๊ะ แกะออกเอง ข้างในเป็นเขาโค้งคู่หนึ่ง สีดำด้าน ยาวเท่าฝ่ามือ โคนเขามีรอยเลื่อยเรียบ ขอบรอยยังขาว เด็กคนนั้นบอกว่าเป็นเขาปีศาจ เจอในทุ่งเถ้า

    ใบค่าหัวปีศาจไม่มีในโลก ฟินเดลหยุดเขียน เหนือหัวทั้งสองคน ข้อแรกบนคานไม้ ไม่รับของคน ข้อที่สองถัดมา ไม่ถามว่าได้มาอย่างไร
  choices:
    - id: push_them_back
      label: ห่อผ้ากลับให้ แล้วเลื่อนคืนไปตามข้อแรก
      text: |
        เด็กคนนั้นไม่เถียง ห่อของกลับแล้วเดินออกไป ฝั่งตรงข้ามถนนมีชายในเสื้อคลุมสะอาดยืนรออยู่ใต้กันสาดร้านขายเกลือ เด็กเดินไปหาชายคนนั้น ทั้งสองเลี้ยวเข้าตรอกข้างร้านไปด้วยกัน

        ฟินเดลเขียนลงสมุดของสาขาบรรทัดหนึ่ง ของไม่รับ หนึ่งคู่ แล้วขีดเส้นใต้สองเส้น ตลอดบ่ายนั้นเขาไม่ได้พูดเรื่องราคาของอะไรอีก
      effects: { alignment: { law: 1 }, flags: [refused_the_sawn_horns] }
    - id: ask_whose
      label: ถามเด็กว่าเป็นเขาของใคร
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เด็กคนนั้นกัดริมฝีปากจนขาว แล้วบอกว่าเป็นของน้องสาว ย่าเลื่อยให้ตอนน้องยังเดินไม่เป็น จะได้ลงสมุดวิหารว่าเป็นคน ย่าเก็บไว้ในกล่องมาหลายปี ตอนนี้ย่าป่วย ชายที่ร้านเกลือบอกว่าโรงรับเขี้ยวซื้อเขาปีศาจ ถ้าโรงไม่ซื้อ ชายคนนั้นจะซื้อเองที่ประตูหลัง

          {name}ห่อเขาคู่นั้นคืนใส่มือเด็ก ใส่สองเหรียญของตัวเองลงไปในห่อด้วย ฟินเดลมองตามเด็กไปจนลับประตู ไม่ได้เขียนบรรทัดไหนลงสมุด
        effects: { stats: { CHA: 1 }, gold: -2, flags: [paid_the_horn_boy, heard_of_a_horn_buyer] }
      failure:
        text: |
          พอได้ยินคำถาม เด็กคนนั้นคว้าห่อผ้าแล้ววิ่ง ชนนักล่าสองคนที่ยืนต่อแถวกระเด็นไปคนละทาง เขาข้างหนึ่งหลุดจากห่อผ้า กลิ้งไปหยุดใต้โต๊ะชั่ง

          ฟินเดลก้มลงเก็บ ห่อผ้าเช็ดหน้าของตัวเอง แล้วถามว่าจะให้เขียนลงสมุดว่าอะไร {name}บอกให้เขียนว่าของไม่รับ ห่อผ้านั้นอยู่ในลิ้นชักใต้โต๊ะจนออร์ริสกลับมา
        effects: { flags: [kept_a_sawn_horn_in_the_drawer] }
    - id: show_your_own
      label: ถอดผ้าโพกหัวให้เด็กเห็น แล้วถามว่าอยากให้ชั่งเขาของใครอีก
      requires: { flag: race_tiefling }
      text: |
        เด็กคนนั้นมองหัวของ{name}แล้วถอยไปก้าวหนึ่ง ห่อผ้ากลับในมือเดียว บอกเสียงสั่นว่าชายที่ร้านเกลือบอกว่าเป็นเขาปีศาจ เด็กไม่รู้ว่ามันเป็นอย่างอื่นได้

        {name}เดินไปส่งเด็กถึงหน้าร้านเกลือ ใต้กันสาดไม่มีใครยืนรอแล้ว คนขายเกลือบอกว่าชายคนนั้นมาทุกต้นเดือน ซื้อเกลือทีละถุง จ่ายเป็นเหรียญใหม่ทุกครั้ง
      effects: { stats: { CHA: 1 }, flags: [refused_the_sawn_horns, heard_of_a_horn_buyer] }
    - id: not_the_table
      label: บอกออร์ริสว่าไม่นั่งโต๊ะแทน ให้ฟินเดลนั่ง
      refuse: true
      text: |
        ฟินเดลนั่งโต๊ะสามวันแทน เขาชั่งเป็น จ่ายเป็น อ่านใบเป็น แต่ไม่มีป้าย นักล่าบางคนไม่ยอมวางของให้เขาชั่ง

        ออร์ริสกลับมาเย็นวันที่สาม ฟินเดลยื่นห่อผ้าห่อหนึ่งจากลิ้นชักให้นาง กระซิบสองสามคำ ออร์ริสถือห่อผ้านั้นเดินเข้าห้องหลังม่าน ไม่ได้ออกมาจนค่ำ
      effects: { flags: [findel_kept_the_horns] }

- id: adult.fang_duty_sealed_shaft
  stage: adult
  scene: mine
  weight: 20
  duty: fang_house
  when:
    age: [32, 64]
    org: { id: fang_house, min_rank: 3, max_rank: 3 }
  text: |
    ใบหลังม่านใบนี้มาจากบริษัทเหมืองถ่านมาร ปล่องเก่าปล่องหนึ่งที่ภาคีผู้เฝ้าผนึกเทปูนปิดไว้เมื่อหลายปีก่อน บริษัทได้ใบอนุญาตเปิดใหม่แล้ว เหลือแต่ของที่อยู่ข้างใน ผีถ่านกินคนงานไปสองคนก่อนภาคีจะมาปิดปล่อง บริษัทจ่ายแปดเหรียญให้คนที่ลงไปกำจัดของข้างในให้หมดก่อนคนงานชุดใหม่ลง

    ปากปล่องอยู่ห่างแนวหินสี่ร้อยก้าว บริษัทเจาะฝาปูนเป็นช่องพอให้คนลอดได้แล้ว บนขอบฝามีตราเหล็กหล่อของภาคีฝังอยู่ รูปกุญแจไขว้ ปูนรอบตราไม่มีใครกล้าสกัด ลมที่พัดออกมาจากช่องอุ่นเหมือนลมหายใจ

    คนคุมงานของบริษัทยื่นตะเกียงกับถังน้ำมาให้สองถัง บอกว่าผีถ่านกลัวน้ำ ส่วนเรื่องอื่น ใบไม่ได้เขียนไว้
  choices:
    - id: go_down_with_water
      label: ลงไปพร้อมถังน้ำสองถัง
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ปล่องลึกสามช่วงบันได ผีถ่านสามตัวลอยอยู่ช่วงล่างสุด ตัวเท่าเด็ก ตาเป็นถ่านแดง หนีน้ำไปเกาะผนังทีละตัวจนดับหมด ก้นปล่องเป็นหินแข็งที่มีรอยร้าวพาดยาว รอยร้าวอุ่นจนวางมือได้ไม่ครบลมหายใจ

          บริษัทจ่ายแปดเหรียญตามใบ ออร์ริสหักส่วนของโรงไปสอง คนงานชุดใหม่ลงปล่องในสัปดาห์นั้น ป้อมที่ใกล้ที่สุดส่งจดหมายมาถึงบริษัทในเดือนต่อมา บริษัทไม่ได้ตอบ
        effects: { stats: { CON: 1 }, gold: 6, world: { demon: 1 }, flags: [cleared_the_sealed_shaft] }
      failure:
        text: |
          ช่วงบันไดที่สอง ถังน้ำใบแรกหลุดมือตกลงไปก่อน ผีถ่านสามตัวลอยขึ้นมาตามเสียงถัง ถ่านคุจากตัวมันลงใส่ไหล่กับหลังมือ {name}ปีนกลับขึ้นมาได้ด้วยถังที่เหลือใบเดียว

          คนคุมงานจ่ายค่าลงหนึ่งเหรียญ บอกว่าจะหาคนอื่น ออร์ริสไม่หักส่วนของโรงจากเหรียญนั้น
        effects: { hp: -2, gold: 1, flags: [burned_in_the_sealed_shaft] }
    - id: fake_the_proof
      label: นั่งรอที่ปากปล่องจนเย็น แล้วเอาถ่านจากกองข้างปล่องห่อผ้าไปวางแทน
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          ถ่านจากกองข้างปล่องดำเหมือนถ่านผีถ่านทุกอย่าง ยกเว้นไม่อุ่น {name}ถือห่อผ้าไว้ใกล้เตาไฟในโรงเตี๊ยมคืนหนึ่งก่อนเอาไปวาง คนคุมงานจ่ายแปดเหรียญโดยไม่แกะห่อ

          ออร์ริสชั่งถ่านก้อนนั้น หักส่วนของโรงสองเหรียญ ไม่ถามว่าได้มาอย่างไร คนงานชุดใหม่ลงปล่องสัปดาห์ต่อมา สามวันหลังจากนั้นมีคนงานขึ้นมาไม่ครบ
        effects: { stats: { CHA: 1 }, gold: 6, alignment: { moral: -2 }, flags: [faked_the_shaft_proof] }
      failure:
        text: |
          ฟินเดลหยิบถ่านจากห่อผ้าขึ้นมาดม แล้ววางลง บอกว่าถ่านผีถ่านมีกลิ่นกำมะถันติดอยู่เจ็ดวัน ก้อนนี้กลิ่นเหมือนเตาโรงเตี๊ยม

          ออร์ริสไม่ได้ว่าอะไร นางปรับ{name}สองเหรียญตามธรรมเนียมของห้องหลัง แล้วปักใบคืนบนผนังด้วยมีดเล่มเดิม
        effects: { gold: -2, flags: [caught_faking_proof] }
    - id: read_the_seal
      label: วางมือบนตราเหล็กของภาคี แล้วอ่านว่ารอยร้าวข้างล่างยังอุ่นแค่ไหน
      requires: { flag: stood_at_the_crack }
      text: |
        ตราเหล็กอุ่นกว่าลมที่พัดออกมา {name}รู้จักความอุ่นแบบนี้จากคืนที่ยืนหน้าหินแตกที่ป้อมสาม ปูนที่ภาคีเทปิดไม่ได้ปิดผีถ่าน ปูนปิดรอยร้าว {name}บอกคนคุมงานตามนั้น เขาจดลงกระดาษโดยไม่เงยหน้า

        บริษัทถอนใบหลังม่านใบนั้นในเดือนต่อมา ไม่มีคำอธิบาย ออร์ริสคืนค่าลงทะเบียนใบให้บริษัทครบ แล้วบอก{name}ว่าคราวหน้าอย่าอ่านอะไรที่ใบไม่ได้ขอให้อ่าน
      effects: { stats: { INT: 1 }, reputation: { wardens: 1 }, flags: [read_the_wardens_seal] }
    - id: warn_the_fort
      label: คืนใบ แล้วไปบอกป้อมที่ใกล้ที่สุดว่าบริษัทเจาะฝาปูนแล้ว
      refuse: true
      text: |
        ป้อมที่ใกล้ที่สุดส่งคนมาเทปูนปิดช่องใหม่ในวันเดียว ผู้เฝ้าในผ้าคลุมสีเทาสามคนยืนเฝ้าปากปล่องจนปูนแห้ง ไม่มีใครถามว่า{name}เป็นใคร

        ฟินเดลเขียนในสมุดของสาขาว่าปฏิเสธใบหลังม่าน ออร์ริสอ่านบรรทัดนั้นแล้วปิดสมุด ใบหลังม่านใบต่อมาไปถึงมือคนอื่นก่อน
      effects: { reputation: { wardens: 1, fang_house: -1 }, flags: [warned_the_fort_of_the_shaft] }
