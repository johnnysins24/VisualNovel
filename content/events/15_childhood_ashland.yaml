# วัยเด็ก ลูกทีฟลิ่งในแดนเถ้า บ้านหญ้าเงิน (origin_ashland)
# พ่อขุดถ่านที่หลุมเก้า ป้อมสามของภาคีผู้เฝ้าผนึกอยู่ห่างไปครึ่งวันเดิน
# เสียงทุ้มในฝันคือจอมมาร ห้ามบอกตรงๆ ให้คนในเรื่องเรียกว่า เสียงทุ้ม หรือ คนข้างใน

- id: childhood.ashland_hound
  stage: childhood
  weight: 8
  when:
    age: [3, 8]
    flags: [origin_ashland]
    not_flags: [demon_bargain_small]
  text: |
    ตกค่ำ ทุกบ้านในบ้านหญ้าเงินชักบันไดขึ้น {name}นั่งห้อยขาอยู่ที่ชานบ้าน มองลงไปข้างล่าง

    คืนนี้เป็นครั้งแรกที่{name}เห็นมันเต็มตา ตัวใหญ่เท่าลูกวัว ผอมจนนับซี่โครงได้ กลางอกมีแสงแดงอยู่ข้างใน เหมือนใครลืมถ่านไว้ในเตาที่ปิดฝาไม่สนิท เถ้าติดอยู่ตามรอยย่นบนหนังจนดูเหมือนรูปปั้นที่ยังปั้นไม่เสร็จ หูซ้ายแหว่งไปครึ่งหนึ่ง

    คนทั้งหมู่บ้านรู้จักตัวนี้ เด็กๆ เรียกมันว่าเจ้าหูแหว่ง ผู้ใหญ่ไม่เรียกมันว่าอะไรเลย ตั้งแต่{name}เกิด มันไม่เคยห่างบ้านหลังนี้เกินหนึ่งคืน และทุกคนในหมู่บ้านก็มีความเห็นของตัวเองว่าเพราะอะไร

    มันหยุดอยู่ตรงโคนเสาบ้าน แล้วเงยหน้าขึ้นมองชานบ้าน
  choices:
    - id: throw_stone
      label: ขว้างก้อนหินใส่
      text: |
        ก้อนหินโดนหลังมันดังตุบ มันไม่สะดุ้ง ไม่วิ่ง มองหน้า{name}อยู่ครู่หนึ่ง แล้วเดินวนต่อ เหมือนก้อนหินไม่ได้ตกลงมาจากบ้านหลังนี้

        คืนต่อมามันกลับมาอีก เดินวนเท่าเดิม
      effects: { stats: { STR: 1 }, flags: [threw_at_hound] }
    - id: sing
      label: ร้องเพลงกล่อมที่แม่ร้องทุกคืน
      text: |
        {name}ร้องเพลงกล่อมเบาๆ เพลงที่คนบ้านหญ้าเงินร้องกันทุกบ้าน มันหมอบลงบนเถ้า ถ่านในอกหรี่ลงทีละนิดตามเพลง ร้องถึงท่อนที่สอง ถ่านเหลือแค่สีแดงหม่น เหมือนถ่านในเตาตอนใกล้รุ่ง

        {mother}ออกมาเห็น แล้วยืนนิ่งอยู่ที่ประตู ไม่กล้าเรียก
      effects: { stats: { CHA: 1 }, flags: [sang_to_hound] }
    - id: stare
      label: จ้องตามันกลับ
      text: |
        ตาของ{name}กับแสงในอกมันเป็นสีเดียวกัน สองฝ่ายจ้องกันจนตะเกียงในบ้านกะพริบเพราะน้ำมันใกล้หมด

        แล้วมันก็หมอบลงบนเถ้าตรงนั้น คางวางบนขาหน้า ตาไม่ละจากชานบ้าน {name}ไม่ยอมเข้าบ้าน มันก็ไม่ยอมไป จน{father}ต้องออกมาอุ้มลูกเข้าบ้านตอนตีสอง
      effects: { stats: { WIS: 1 }, flags: [stared_down_hound] }

- id: childhood.ashland_silver_grass
  stage: childhood
  weight: 8
  when:
    age: [3, 6]
    flags: [origin_ashland]
  text: |
    หญ้าสีเงินเป็นของอย่างเดียวที่ขึ้นบนเถ้า กินได้แต่ขม ขมจนเด็กทุกคนในบ้านหญ้าเงินร้องไห้ตอนกินครั้งแรก แล้วก็กินจนชิน เพราะไม่มีอย่างอื่นให้กินระหว่างรอเกวียนเสบียงจากป้อม

    ปีนั้นเกวียนเสบียงมาช้าไปสามสัปดาห์ {mother}พา{name}ออกไปเก็บหญ้าเงินที่เนินทางใต้ เถ้าลึกถึงเข่าผู้ใหญ่ ถึงเอวเด็ก ต้องเดินบนแผ่นไม้ที่ปูไว้

    {mother}สอนวิธีเลือก ต้นที่ใบเงินวาว ขมน้อย ต้นที่ใบหม่น ขมจนกินไม่ลง ต้นที่โคนใบเป็นสีแดง ห้ามแตะ

    "ทำไม"

    "ขึ้นตรงที่มีอะไรตายอยู่ข้างใต้" {mother}ว่า
  choices:
    - id: eat_bitter
      label: กินใบหม่นๆ ให้แม่ดูว่าไม่กลัวขม
      text: |
        {name}เคี้ยวทั้งน้ำตาไหล ไม่ยอมคาย {mother}หัวเราะจนต้องนั่งลงบนแผ่นไม้

        เย็นนั้นทั้งบ้านกินแกงหญ้าเงิน ไม่มีใครบ่นว่าขม เพราะ{name}บ่นแทนทุกคนไปหมดแล้ว
      effects: { stats: { CON: 1 } }
    - id: pick_shiny
      label: เลือกเก็บแต่ต้นใบวาว
      text: |
        {name}เลือกได้เร็วกว่าแม่ เก็บเต็มตะกร้าก่อนเที่ยง ไม่มีใบหม่นปนมาสักใบ {mother}ว่าตาดี ตาดีเหมือนพ่อ

        ขากลับ{name}เห็นหญ้าใบแดงขึ้นเป็นวงอยู่ริมทาง วงกว้างเท่าตัวคนนอนพอดี
      effects: { stats: { WIS: 1 } }
    - id: dig_red
      label: แอบขุดดูใต้ต้นใบแดง
      text: |
        {name}เอามือคุ้ยเถ้าใต้ต้นใบแดง ลึกลงไปได้แค่ศอก ปลายนิ้วก็ไปโดนของแข็งๆ เย็นๆ เป็นเหล็กดำ ผิวขรุขระ โค้งเหมือนกระดองเต่า

        {mother}ดึงลูกขึ้นมา เอาเถ้ากลบคืนจนเรียบ แล้วเดินกลับบ้านเร็วจน{name}ต้องวิ่งตาม คืนนั้นเธอขัดมือ{name}ด้วยขี้เถ้าจากเตาจนแดง
      effects: { stats: { INT: 1 }, flags: [dug_red_grass] }

- id: childhood.ashland_fort_letters
  stage: childhood
  weight: 8
  when:
    age: [6, 11]
    flags: [origin_ashland]
  text: |
    ป้อมสามอยู่ห่างบ้านหญ้าเงินครึ่งวันเดิน เป็นป้อมหินเตี้ยๆ ที่เถ้ากองสูงถึงขอบหน้าต่างชั้นล่าง ผู้เฝ้าผนึกในป้อมครึ่งหนึ่งมีเขา

    จ่ามอร์เดนเป็นทีฟลิ่งเขาหักข้างหนึ่ง ทุกเดือนแกขี่ม้าผ่านบ้านหญ้าเงิน รับจดหมายไปส่งที่ป้อม และสอนเด็กอ่านหนังสือบนชานบ้านผู้ใหญ่บ้านครั้งละครึ่งวัน ค่าเรียนคือต้องช่วยแบกถุงจดหมาย

    ปีนี้{name}ได้นั่งแถวหน้า จ่ามอร์เดนเขียนตัวอักษรลงกระดานชนวน แล้วให้อ่านตามทีละตัว คำแรกที่แกสอนเด็กทุกรุ่นคือคำว่า ผนึก
  choices:
    - id: learn
      label: ตั้งใจอ่านจนจำได้ทุกตัว
      text: |
        ไม่ถึงปี {name}อ่านหน้าซองจดหมายในถุงออกทุกฉบับ ถึงป้อมสาม ถึงหลุมเก้า ถึงบริษัทเหมืองในเวนทราส ถึงสภาตระกูลที่ทุนดาร์

        จ่ามอร์เดนบอกว่าห้ามแกะอ่าน แต่ไม่ได้ห้ามอ่านหน้าซอง
      effects: { stats: { INT: 1 }, flags: [reads_letters] }
    - id: carry
      label: ขอเป็นคนแบกถุงจดหมายไปส่งถึงป้อม
      text: |
        {name}เดินครึ่งวันบนแผ่นไม้ ถุงจดหมายพาดบ่า ไปถึงป้อมสามตอนบ่าย ผู้เฝ้าผนึกที่ประตูรับถุงไป แล้วโยนลูกพลับแห้งให้หนึ่งลูก

        ตั้งแต่นั้นทุกเดือน ถุงจดหมายของบ้านหญ้าเงินเป็นหน้าที่ของ{name} ผู้เฝ้าผนึกที่ประตูจำหน้าได้ และเตรียมลูกพลับไว้ให้ทุกครั้ง
      effects: { stats: { CON: 1 }, reputation: { wardens: 1 }, flags: [warden_runner] }
    - id: ask_seal
      label: ถามจ่าว่าข้างในตอเสามีอะไร
      text: |
        จ่ามอร์เดนวางดินสอหินลง

        "คนข้างใน" แกว่า เสียงเหมือนพูดถึงเพื่อนบ้านที่ไม่ค่อยถูกกัน "แต่อย่าไปถามเขาเองล่ะ เขาตอบ"

        เด็กทั้งชานบ้านหัวเราะ จ่ามอร์เดนไม่หัวเราะ แกเขียนคำว่า ผนึก ลงกระดานอีกครั้ง ตัวใหญ่กว่าเดิม
      effects: { stats: { WIS: 1 } }

- id: childhood.ashland_smuggled_child
  stage: childhood
  weight: 8
  when:
    age: [5, 10]
    flags: [origin_ashland]
  text: |
    เกวียนถ่านเปล่าขากลับจากเวนทราสหยุดที่ปากทางบ้านหญ้าเงินตอนตีสาม คนขับเกวียนเป็นมนุษย์ ไม่ลงจากเกวียน ไม่บอกชื่อ เขาเลิกผ้าใบท้ายเกวียนขึ้น ให้เด็กคนหนึ่งปีนลงมา แล้วขับต่อไปทันที

    ป้าบ้านติดกันบอกว่าปีนี้เป็นคนที่สองแล้ว คนแรกมาตอนหน้าร้อน ตัวเล็กกว่านี้ "พวกหนูท่าคิดเงินทุกอย่างที่ขนออกจากเวนทราส" แกว่า "ยกเว้นของอย่างนี้"

    เด็กคนนั้นอายุพอๆ กับ{name} สวมรองเท้าหนังที่ไม่เหมาะกับเถ้า ผมตัดสั้นจนเห็นเขาทั้งสองข้าง ที่โคนเขามีรอยเลื่อยเก่า เขางอกพ้นรอยนั้นขึ้นมาแล้วหนึ่งข้อนิ้ว เด็กคนนั้นไม่ยอมบอกชื่อ ไม่ยอมพูดอะไรเลย คนในหมู่บ้านเลยเรียกว่าเจ้าเมือง

    ผู้ใหญ่บ้านให้เจ้าเมืองไปนอนบ้านป้าที่อยู่ติดกับบ้าน{name}
  choices:
    - id: share_food
      label: เอาแกงหญ้าเงินไปให้ครึ่งชาม
      text: |
        เจ้าเมืองชิมคำแรกแล้วคายทิ้ง {name}หัวเราะ บอกว่าทุกคนก็คายครั้งแรก เจ้าเมืองชิมคำที่สอง ไม่คาย แต่น้ำตาไหล

        คืนนั้นเจ้าเมืองพูดคำแรกตั้งแต่ลงจากเกวียน "ขม"
      effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [smuggled_friend] }
    - id: teach_whistle
      label: สอนผิวปากสามจังหวะเรียกบันได
      text: |
        {name}สอนให้ผิวปากสามจังหวะ สั้น สั้น ยาว แบบที่คนบ้านหญ้าเงินใช้เรียกให้หย่อนบันไดตอนกลับดึก เจ้าเมืองผิวไม่เป็น ผิวออกมาแต่ลม ผิวอยู่สามวันถึงมีเสียง

        วันที่สี่ ตอนพลบค่ำ มีเสียงผิวปากสามจังหวะอยู่ใต้บ้านป้า ป้าหย่อนบันไดลงไป เจ้าเมืองยืนยิ้มอยู่ข้างล่าง เป็นครั้งแรกที่ใครเห็นเขายิ้ม
      effects: { stats: { DEX: 1 }, flags: [smuggled_friend] }
    - id: ask_city
      label: ถามว่าในเมืองมีอะไรบ้าง
      text: |
        เจ้าเมืองเงียบอยู่หลายวัน แล้ววันหนึ่งก็เล่าขึ้นมาเอง เล่าเรื่องตะเกียงฟ้าที่ไม่ต้องจุด เรื่องเรือเหาะที่ใหญ่กว่าหมู่บ้านทั้งหมู่บ้าน เรื่องห้องใต้บันไดที่เขาต้องนอนตลอดหกปีเพราะห้ามให้ใครเห็น

        {name}ถามว่าแล้วชอบที่ไหนมากกว่า เจ้าเมืองไม่ตอบ แต่ตอนนั้นเขานั่งอยู่บนชานบ้าน ห้อยขาเหนือเถ้า ผมเริ่มยาวจนปิดรอยเลื่อย
      effects: { stats: { INT: 1 }, flags: [smuggled_friend] }

- id: childhood.ashland_mine_collapse
  stage: childhood
  weight: 8
  when:
    age: [6, 11]
    flags: [origin_ashland]
  text: |
    เสียงระฆังที่ปากหลุมเก้าดังไม่หยุดตั้งแต่บ่าย ตีรัวแบบที่ไม่มีใครในบ้านหญ้าเงินอยากได้ยิน แปลว่าข้างล่างถล่ม

    {father}อยู่กะบ่าย

    ผู้หญิงทั้งหมู่บ้านออกมายืนบนชานบ้าน ไม่มีใครวิ่งไปหลุม ทุกคนรู้ธรรมเนียม หลุมถล่มเมื่อไหร่ บ้านไหนมีคนอยู่ข้างล่าง ต้องจุดตะเกียงแขวนไว้ใต้ถุน ให้คนที่ขึ้นมาได้หาบ้านถูกตอนมืด

    {mother}จุดตะเกียงด้วยมือที่สั่นจนต้องขีดไฟสามก้าน
  choices:
    - id: run_to_mine
      label: แอบไต่เสาบ้านลงไป วิ่งไปหลุมเก้า
      check: { stat: CON, dc: 12 }
      success:
        text: |
          {name}วิ่งบนแผ่นไม้จนเท้าพอง ไปถึงปากหลุมตอนพลบค่ำ คนงานกะเช้าช่วยกันดึงเชือกอยู่ {name}เข้าไปจับเชือกเส้นท้ายสุด ดึงตามจังหวะคนข้างหน้า ไม่มีใครไล่

          ใกล้เที่ยงคืน คนสุดท้ายที่ขึ้นมาจากหลุมคือ{father} ตัวดำทั้งตัวจนเห็นแต่ตา เขามองเห็นลูกยืนอยู่ปลายเชือก แล้วนั่งลงบนเถ้าตรงนั้นเลย

          "ฉันได้ยินอีกแล้ว" เขาพูดเบาๆ ไม่ได้พูดกับ{name} "มันบอกว่าให้คลานไปทางซ้าย"

          คืนนั้นคนบ้านหญ้าเงินลงไปสิบสี่คน ขึ้นมาสามคน
        effects: { stats: { CON: 1 }, flags: [mine_collapse_survived, father_heard_voice] }
      failure:
        text: |
          {name}วิ่งได้ครึ่งทางขาก็ทรุด ไถลตกจากแผ่นไม้ลงไปในเถ้าถึงอก ดิ้นขึ้นมาได้ก็หมดแรง นั่งหอบอยู่บนแผ่นไม้ จนป้าบ้านข้างๆ เดินถือตะเกียงมาตาม

          ใกล้รุ่ง มีเสียงผิวปากสามจังหวะอยู่ใต้บ้าน {father}ปีนขึ้นมา ตัวดำทั้งตัว เขากอดลูกไว้จนเถ้าบนเสื้อติดหน้าลูกเป็นรอยดำ แล้วพูดเบาๆ ว่า "ฉันได้ยินอีกแล้ว มันบอกว่าให้คลานไปทางซ้าย"

          คืนนั้นคนบ้านหญ้าเงินลงไปสิบสี่คน ขึ้นมาสามคน
        effects: { stats: { WIS: 1 }, flags: [mine_collapse_survived, father_heard_voice] }
    - id: tend_lamp
      label: นั่งเฝ้าตะเกียงใต้ถุนกับแม่ทั้งคืน
      text: |
        {name}นั่งเฝ้าตะเกียงกับแม่ ข้างล่างเงียบ ไม่มีหมาเถ้าตัวไหนเข้ามาใกล้แสงตะเกียงคืนนั้น ทั้งหมู่บ้าน ตะเกียงใต้ถุนสิบสี่ดวงเรียงกันเป็นแถว

        ตะเกียงดวงแรกที่ดับเป็นของบ้านป้า แกดับเองตอนตีสาม แล้วนั่งอยู่ในความมืด

        ใกล้รุ่ง มีเสียงผิวปากสามจังหวะอยู่ใต้บ้าน {father}ปีนขึ้นมา ตัวดำทั้งตัว เขาเป่าตะเกียงดับ แล้วบอก{mother}ว่า "ฉันได้ยินอีกแล้ว มันบอกว่าให้คลานไปทางซ้าย"
      effects: { stats: { WIS: 1 }, flags: [mine_collapse_survived, father_heard_voice] }
    - id: pray_ossa
      label: ไปนั่งหน้าแผ่นหินออสซาที่ปากทางหมู่บ้าน
      text: |
        ที่ปากทางบ้านหญ้าเงินมีแผ่นหินสลักรูปประตูปิดของออสซา คนที่จะลงหลุมแตะทุกเช้า {name}ไปนั่งหน้าแผ่นหินนั้น ขอให้ประตูยังไม่ปิด ขอซ้ำจนปากแห้ง

        ใกล้รุ่ง {father}เดินกลับมาตามทาง ผ่านแผ่นหินนั้นพอดี ตัวดำทั้งตัว เขาอุ้มลูกขึ้นมาทั้งที่มือยังสกปรก

        "ฉันได้ยินอีกแล้ว" เขาพูดกับแผ่นหินมากกว่าพูดกับลูก "มันบอกว่าให้คลานไปทางซ้าย"
      effects: { stats: { CHA: 1 }, flags: [mine_collapse_survived, father_heard_voice] }

- id: childhood.ashland_the_voice
  stage: childhood
  weight: 9
  when:
    age: [7, 11]
    flags: [origin_ashland]
  text: |
    ปีนี้{name}เริ่มฝันถึงเสียงทุ้ม

    ไม่ได้ฝันเห็นอะไร มีแต่ความมืดอุ่นๆ กับเสียงทุ้มต่ำเสียงหนึ่ง พูดช้าและสุภาพ เรียกชื่อ{name}ถูกทุกพยางค์ ทั้งที่คนนอกหมู่บ้านออกเสียงชื่อนี้ผิดทุกคน

    คืนแรกเสียงนั้นแค่ทัก คืนที่สามถามว่าวันนี้กินอะไร คืนที่เจ็ดเสียงนั้นเสนอบางอย่าง

    "หมาเถ้าจะไม่แตะบ้านเจ้า" เสียงนั้นว่า "ไม่ว่าคืนไหน ไม่ว่าตัวไหน ขอแค่เจ้าตอบว่าตกลง ข้าไม่ขออะไรตอนนี้ ไว้ข้าขอเมื่อไหร่ เจ้าค่อยให้"

    ในบ้านหญ้าเงิน ผู้ใหญ่ทุกคนสอนเด็กประโยคเดียวกัน ถ้าฝันถึงเสียงทุ้ม อย่าตอบ
  choices:
    - id: agree
      label: ตอบว่าตกลง
      text: |
        เสียงนั้นหัวเราะเบาๆ ไม่ใช่หัวเราะเยาะ หัวเราะอย่างผู้ใหญ่ที่เห็นเด็กทำอะไรน่าเอ็นดู

        ตั้งแต่คืนนั้น ไม่มีหมาเถ้าตัวไหนเดินวนรอบบ้านอีกเลย ตัวหูแหว่งก็ไม่มา {mother}สังเกตเห็นเป็นคนแรก เธอถามลูกว่าฝันอะไรหรือเปล่า {name}บอกว่าไม่ได้ฝัน
      effects: { stats: { CHA: 1 }, world: { demon: 1 }, flags: [demon_voice_heard, demon_bargain_small] }
    - id: silent
      label: ไม่ตอบ ตามที่ผู้ใหญ่สอน
      text: |
        เสียงนั้นรอ รอนานจน{name}เกือบตื่น

        "ไม่เป็นไร" เสียงนั้นว่า "ข้ารอเป็น ข้ารอมาสามร้อยปี"

        คืนต่อมาเสียงนั้นมาอีก และมาทุกคืนที่ฟ้าครึ้ม
      effects: { stats: { WIS: 1 }, flags: [demon_voice_heard] }
    - id: ask_who
      label: ถามกลับว่าท่านเป็นใคร
      text: |
        "เจ้ารู้" เสียงนั้นว่า "ชื่อของเจ้า พ่อเจ้าได้ยินจากข้า ข้าเป็นคนตั้ง ดีกว่าชื่อที่พวกเขาจะคิดได้เอง"

        {name}ตื่นขึ้นมากลางดึก เหงื่อเย็นทั้งตัว ได้ยินเสียง{father}กรนอยู่อีกมุมห้อง ชื่อของตัวเองดังอยู่ในหัว ด้วยเสียงทุ้มนั้น ทุกพยางค์
      effects: { stats: { INT: 1 }, flags: [demon_voice_heard, dream_name_from_voice] }
