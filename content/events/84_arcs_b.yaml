# ชุด 4 เส้นเรื่องยาว ไฟล์ ข: feud (คู่แค้น) · low_voice (ข้อเสนอสามข้อ) · glass (หย่อมใสหย่อมแรก) · seal_secret (สมุดนับรอยร้าว)
# ตอนที่ 1 มี when.age และน้ำหนักตามข้อกำหนด ตอนที่ 2 กับ 3 ไม่มี when.age น้ำหนัก 30 ข้อความไม่รู้ว่าห่างจากตอนก่อนกี่ปี ใช้คำว่า หลายปี
# ตอนที่ 3 คือที่พัก ไม่ใช่ตอนจบ ทุกตัวเลือกตั้ง flag ที่พักหนึ่งอันตามชื่อที่กำหนด (ชุด 6 อ่าน)
# เสียงทุ้มไม่มีชื่อในข้อความ สุภาพ แม่นทุกคำ ไม่โกหก ไม่บอกว่าใต้ผนึกมีอะไร
# คนใหม่: เดรสซา (feud_rival) · โทเวน ลูกชายของเดรสซา (มีแต่ในข้อความ) · โนวัล คนกะเดียวกันที่ผิวแก้วลามทั้งตัว (มีแต่ในข้อความ)
#         ไบรอส ผู้นับหินป้อมเจ็ดที่ตายแล้ว (มีแต่ในข้อความ) · ราเธน คนของเหมือง (มีแต่ในข้อความ) · เวสเตน ผู้นับหินป้อมสอง (มีแต่ในข้อความ)

# ===================== feud คู่แค้น =====================

- id: adult.arc_feud_1_the_hearing
  stage: adult
  scene: council_hall
  weight: 13
  arc: { id: feud, step: 1 }
  when:
    age: [28, 50]
  people:
    - { id: feud_rival, name: เดรสซา, gender: f, bond: rival, closeness: -2, age: 38 }
  text: |
    ยุ้งข้าวหลังตลาดไหม้ตอนเช้ามืดของวันตลาดใหญ่ ไฟกินข้าวของคนสิบสองบ้านไปจนถึงขื่อ ที่ไต่สวนตั้งในห้องโถงของสภาย่าน กลิ่นข้าวไหม้ยังติดผ้าม่าน คนที่เช่าช่องในยุ้งนั่งเรียงกันบนม้านั่งยาว {name}เป็นหนึ่งในนั้น ช่องของ{name}อยู่ติดประตูยุ้ง

    เดรสซาเช่าช่องติดกัน ลุกขึ้นให้การเป็นคนที่สาม นางสาบานต่อหน้าตะเกียงของสภาว่าเห็น{name}ถือตะเกียงเข้ายุ้งตอนพลบค่ำวันก่อน แล้วไม่ได้ถือออกมา พูดช้า ชัด ไม่หันมาทาง{name}สักครั้ง

    {name}รู้ว่าเย็นวันนั้นใครถือตะเกียงเข้ายุ้ง เด็กผู้ชายผมหยิกคนหนึ่ง ลูกชายของเดรสซาเอง ชื่อโทเวน ตอนนี้นั่งอยู่ปลายม้านั่ง ดึงด้ายที่หลุดจากแขนเสื้อทีละเส้น เด็กที่ทำยุ้งของคนสิบสองบ้านไหม้ ถ้าสภาชี้ว่าผิด จะต้องไปคัดถ่านที่ลานของหลวงจนกว่าจะใช้ค่าข้าวหมด ผู้ใหญ่ที่ทำ จ่ายค่าปรับสามเหรียญ แล้วไม่มีใครในตลาดอยากให้เช่าช่องอีก

    หัวหน้าสภาหันมาถาม{name}ว่าจะว่าอย่างไร
  choices:
    - id: pay_and_remember
      label: ไม่เถียง จ่ายค่าปรับสามเหรียญ แล้วจำหน้านางไว้
      text: |
        {name}วางเหรียญลงบนโต๊ะสภาทีละเหรียญ เสียงเหรียญกระทบไม้ดังไปถึงปลายม้านั่ง เดรสซาจูงลูกชายออกจากห้องโถงก่อนคนอื่น เด็กหันกลับมาตรงประตูครั้งหนึ่ง แม่กระชากแขนจนเซ

        วันที่คนงานรื้อซากยุ้ง {name}ไปยืนดู ขอถ่านจากขื่อยุ้งมาก้อนหนึ่ง ดำสนิท ยังเห็นรอยขวานของช่างที่ถากขื่อ เอามาวางไว้บนหิ้งในบ้าน ตรงที่ตื่นมาแล้วเห็นเป็นอย่างแรกทุกเช้า
      effects: { gold: -3, stats: { CON: 1 }, flags: [kept_the_grudge, paid_the_fire_fine] }
    - id: name_the_boy
      label: ชี้ไปที่ปลายม้านั่ง บอกสภาว่าเย็นวันนั้นใครถือตะเกียงเข้ายุ้ง
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          หัวหน้าสภาเรียกเด็กมายืนหน้าโต๊ะ ถามคำเดียวว่าเย็นวันนั้นอยู่ที่ไหน โทเวนตอบไม่ทันจบประโยคก็ร้องไห้ เดรสซาลุกขึ้นจะพูด หัวหน้าสภายกมือห้าม

          สภาไม่ปรับ{name}สักเหรียญ เด็กต้องไปคัดถ่านที่ลานของหลวงหนึ่งหน้าหนาวแทนค่าข้าว เช้าวันที่เกวียนมารับ เดรสซายืนส่งอยู่ปลายถนน ตอนเกวียนผ่านหน้าบ้าน{name} นางหันหน้ามาทางนี้ ตาแห้งทั้งสองข้าง
        effects: { stats: { CHA: 1 }, flags: [kept_the_grudge, named_the_boy_at_the_hearing] }
      failure:
        text: |
          {name}พูดยังไม่ทันจบ เดรสซาก็หัวเราะ บอกสภาว่าคนที่จนตรอกจะโยนไฟให้เด็กตัวแค่นี้ก็ได้หรือ คนบนม้านั่งยาวหันมาทาง{name}พร้อมกัน ด้วยสายตาแบบที่ใช้กับคนโกงตาชั่ง

          สภาปรับสี่เหรียญ เหรียญที่เพิ่มขึ้นมาหัวหน้าสภาเรียกว่าค่าป้ายสี เดือนนั้นทั้งตลาดเรียก{name}ว่าคนที่ชี้นิ้วไปที่เด็ก แม่ค้าบางคนยังเรียกอย่างนั้นอยู่หลังจากลืมไปแล้วว่าเด็กคนไหน
        effects: { gold: -4, flags: [kept_the_grudge, blamed_the_boy_and_lost] }
    - id: let_it_go
      label: จ่ายค่าปรับ แล้วไปบอกเดรสซาที่หน้าห้องโถงว่าเรื่องนี้จบแค่นี้
      text: |
        {name}จ่ายสามเหรียญ เดินตามเดรสซาออกไปถึงบันไดหน้าห้องโถง นางหยุดเมื่อได้ยินเสียงเรียก มือข้างหนึ่งยังกุมไหล่ลูกชายไว้ {name}บอกว่ารู้ว่าใครถือตะเกียง และจะไม่พูดถึงมันอีก ทั้งกับสภาและกับใคร

        เดรสซาไม่ขอบใจ ไม่ขอโทษ ถามว่าทำไม {name}ตอบว่าถ้าเด็กคนนั้นเป็นเด็กในบ้านของตัวเอง ก็คงสาบานแบบเดียวกัน

        หน้าหนาวนั้นยุ้งใหม่ขึ้นเสร็จ เดรสซาเช่าช่องติดกับ{name}เหมือนเดิม ปีต่อมาฝนรั่วเข้าช่องของ{name} นางยกกระสอบข้าวของ{name}ขึ้นไปวางบนชั้นของนางเองโดยไม่บอกใคร {name}รู้เพราะกระสอบแห้ง
      effects: { gold: -3, people: [{ id: feud_rival, closeness: 1 }], arc: { id: feud, close: true }, flags: [let_the_grudge_go] }
    - id: coin_before_witnesses
      label: รอให้นางมาหาเอง แล้วรับค่าเสียหายต่อหน้าพยาน
      text: |
        สามวันหลังไต่สวน เดรสซามาหาตอนมืด ถือถุงเงินมาด้วย {name}ไม่ให้นางเข้าบ้าน บอกให้เอามาวางพรุ่งนี้เช้า ที่แผงของหัวหน้าตลาด ต่อหน้าคนที่ตื่นมาเปิดแผงแล้ว

        เช้านั้นนางมาจริง นับเหรียญห้าเหรียญลงบนแผงไม้ ไม่บอกว่าเป็นค่าอะไร หัวหน้าตลาดไม่ถาม คนสามสี่คนที่ยืนอยู่ตรงนั้นก็ไม่ถาม ทุกคนเห็นว่าใครจ่ายให้ใคร หลายเดือนต่อมาตลาดเล่าเรื่องไฟยุ้งในแบบที่ไม่ตรงกับที่สภาจดไว้ {name}ไม่ต้องเล่าเองสักคำ เรื่องระหว่างสองบ้านปิดลงที่แผงไม้แผงนั้น ใครจะคิดอย่างไรกับมันต่อก็คิดไป
      effects: { gold: 2, arc: { id: feud, close: true }, flags: [took_coin_for_the_wrong] }
    - id: copy_the_record
      label: จ่ายค่าปรับ แล้วขอคัดบันทึกไต่สวนเก็บไว้ฉบับหนึ่ง
      requires: { flag: job_clerk }
      text: |
        เสมียนของสภาคิดค่าคัดครึ่งเหรียญ {name}บอกว่าจะคัดเอง เสมียนยอมให้นั่งโต๊ะของเขาจนพลบค่ำ คำให้การของเดรสซาลงกระดาษครบทุกคำ ทั้งคำว่าเห็น คำว่าถือ และคำว่าไม่ได้ถือออกมา ลายมือของ{name}ตอนท้ายแผ่นแน่นกว่าตอนต้น

        บันทึกฉบับนั้นพับสามทบ ลงไปอยู่ก้นหีบใต้ผ้าที่ไม่ได้ใช้ ปีต่อๆ มา{name}ไม่เคยหยิบขึ้นมาอ่าน แต่ทุกครั้งที่เปิดหีบก็รู้ว่ามันอยู่ตรงไหน
      effects: { gold: -3, stats: { INT: 1 }, flags: [kept_the_grudge, kept_the_hearing_record] }

- id: adult.arc_feud_2_the_granary_key
  stage: adult
  scene: market
  weight: 30
  arc: { id: feud, step: 2 }
  cast:
    rival: { id: feud_rival }
  text: |
    หลายปีหลังไฟยุ้ง ตลาดได้ยุ้งหลังใหม่ ผนังอิฐ ประตูเหล็กสองบาน กุญแจสองดอก ดอกหนึ่งอยู่กับสภาย่าน อีกดอกต้องอยู่กับคนในตลาดคนหนึ่ง คนที่ทุกบ้านที่ฝากข้าวยอมให้ถือ คนถือได้ส่วนแบ่งค่าเช่าช่องทุกเดือน ไม่ต้องตื่นมาตั้งแผงอีกตลอดชีวิต

    กระดานหน้าห้องโถงสภาติดชื่อไว้สามชื่อ ชื่อกลางคือ{rival} หลายปีมานี้นางรับซื้อข้าวจากเกวียนที่เข้าเมือง ขายต่อให้ร้านขนมปัง ตาชั่งของนางตรงทุกขีด คนในตลาดยอมรับข้อนี้ ส่วนใจของนางตรงหรือไม่ คนในตลาดเถียงกันได้ทั้งคืน

    หัวหน้าสภาคนใหม่ไม่ได้นั่งอยู่ในห้องโถงวันไต่สวน เขามายืนรอ{name}ตรงทางกลับบ้าน บอกว่าได้ยินมาว่า{name}กับนางมีเรื่องเก่ากันอยู่ เรื่องอะไรเขาไม่รู้ อยากได้ยินจากปาก{name}ก่อนจะนับเสียงพรุ่งนี้ ถามแล้วก็ยืนรอ มือไพล่หลัง
  choices:
    - id: tell_the_fire
      label: เล่าเรื่องไฟยุ้งให้เขาฟังทั้งหมด ตั้งแต่ตะเกียงดวงนั้นจนถึงคำสาบาน
      requires: { not_flags: [named_the_boy_at_the_hearing] }
      text: |
        {name}เล่าช้าๆ ไม่เติมสี ไม่ตัดอะไรออก หัวหน้าสภาฟังจนจบ ถามแค่ว่ามีใครเห็นอีกไหม {name}บอกว่าไม่มี เขาบอกว่าไม่เป็นไร เขาไม่ได้ต้องการพยาน เขาต้องการคนที่เขาไม่ต้องคิดนานตอนยื่นกุญแจให้

        วันนับเสียง ชื่อของ{rival}ได้น้อยที่สุดในสามชื่อ เย็นนั้นนางปิดแผงเร็วกว่าทุกวัน เดินผ่านหน้าบ้าน{name}ไปทางท่าเกวียน ไม่หันมา หลายวันต่อมา{name}ไปซื้อแป้งที่ร้านขนมปังหัวมุม เจ้าของร้านบอกว่าแป้งหมด กระสอบแป้งวางอยู่หลังร้านสองกองเต็ม
      effects: { flags: [struck_at_the_rival] }
    - id: point_to_the_ledger
      label: บอกเขาว่าเรื่องนั้นสภาจดไว้เองแล้ว ให้ไปเปิดสมุดไต่สวนปีที่ยุ้งไหม้
      requires: { flag: named_the_boy_at_the_hearing }
      text: |
        {name}บอกแค่ปีกับเดือน หัวหน้าสภาเลิกคิ้วข้างหนึ่ง ขอบใจ แล้วเดินกลับไปทางห้องโถง คืนนั้นตะเกียงในห้องเก็บสมุดของสภาติดอยู่จนดึก คนเฝ้ายามเล่าทีหลังว่าเขาอ่านอยู่หน้าเดียว นานเท่าที่คนอื่นใช้อ่านทั้งเล่ม

        วันนับเสียง ชื่อของ{rival}ได้น้อยที่สุดในสามชื่อ ตลาดไม่รู้ว่าทำไม คนที่นั่งบนม้านั่งยาววันไต่สวนเคยรู้ แล้วก็ลืมกันไปหมดแล้ว เย็นนั้นนางปิดแผงเร็วกว่าทุกวัน เดินผ่านหน้าบ้าน{name}ไปทางท่าเกวียน ไม่หันมา สมุดไต่สวนเล่มนั้นกลับขึ้นชั้นไปอยู่ที่เดิม สันเล่มยื่นออกมามากกว่าเล่มข้างๆ ครึ่งข้อนิ้ว
      effects: { flags: [struck_at_the_rival, pointed_to_the_hearing_book] }
    - id: say_its_old
      label: บอกว่าเป็นเรื่องเก่าระหว่างคนช่องติดกัน ไม่เกี่ยวกับกุญแจ
      text: |
        หัวหน้าสภาไม่ถามต่อ เขาดูหน้า{name}ครู่หนึ่งเหมือนคนชั่งของด้วยมือ แล้วกล่าวลา

        วันนับเสียง{rival}ได้กุญแจ นางร้อยกุญแจกับเชือกหนัง แขวนคอไว้ใต้เสื้อ ทุกครั้งที่เดินสวนกับ{name}ในตลาด มือของนางขึ้นไปแตะตรงที่กุญแจอยู่โดยไม่รู้ตัว นางรู้ว่าทั้งตลาดมีคนเดียวที่พูดได้ และคนคนนั้นไม่ได้พูด {name}รู้ว่านางรู้
      effects: { stats: { WIS: 1 }, flags: [stayed_hand_on_the_rival] }
    - id: speak_for_her
      label: บอกเขาว่าถ้าจะยื่นกุญแจให้ใคร ให้ยื่นให้นาง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}บอกว่าตาชั่งของนางตรงทุกขีด และคนที่เคยเสียของในไฟมาแล้วครั้งหนึ่งจะเฝ้าประตูยุ้งดีกว่าใคร ประโยคหลังเป็นความจริงที่สุดที่{name}พูดในเย็นนั้น หัวหน้าสภาจดลงกระดาษ

          {rival}ได้กุญแจ วันรุ่งขึ้นนางมาหาที่บ้าน ยืนอยู่หน้าประตู ถามว่าทำไม {name}ไม่ตอบ นางรออยู่ครู่หนึ่ง แล้ววางห่อแป้งไว้ที่ขั้นบันได แป้งชั้นดี ชนิดที่ร้านขนมปังซื้อไปทำขนมงานแต่ง
        effects: { stats: { CHA: 1 }, people: [{ id: feud_rival, closeness: 1 }], flags: [stayed_hand_on_the_rival, spoke_for_the_rival] }
      failure:
        text: |
          {name}ชมนางได้สองประโยค ประโยคที่สามติดอยู่ในคอ หัวหน้าสภาเอียงหน้าฟัง แล้วถามว่าเรื่องเก่าที่ว่าคือเรื่องอะไร {name}บอกว่าไม่มีอะไร เขาไม่เชื่อทั้งสองอย่าง

          กุญแจไปอยู่กับชื่อสุดท้ายบนกระดาน ตลาดลือกันว่ามีคนไปพูดอะไรบางอย่างกับหัวหน้าสภาก่อนวันนับเสียง {rival}ไม่ต้องถามใครว่าคนนั้นคือใคร
        effects: { people: [{ id: feud_rival, closeness: -1 }], flags: [stayed_hand_on_the_rival, praised_her_badly] }
    - id: hand_him_the_record
      label: ยื่นบันทึกไต่สวนที่คัดไว้ให้เขาอ่านเอง ไม่ต้องพูดสักคำ
      requires: { flag: kept_the_hearing_record }
      text: |
        หัวหน้าสภาอ่านใต้ตะเกียงหน้าบ้าน{name} อ่านสองรอบ รอบที่สองนิ้วของเขาไล่ตามบรรทัดคำสาบาน เขาพับกระดาษคืนให้ แล้วถามว่าถ้า{name}ไม่ได้ถือตะเกียง แล้วใครถือ {name}บอกว่าบันทึกไม่ได้จดเรื่องนั้นไว้

        เขาไม่ยื่นกุญแจให้{rival} และไม่ยื่นให้ใครในสามชื่อนั้นเลย สภาเลื่อนการนับเสียงไปปีหน้า ปีหน้าชื่อของนางไม่ได้ขึ้นกระดานแล้ว
      effects: { stats: { INT: 1 }, flags: [struck_at_the_rival, showed_the_hearing_record] }
    - id: give_it_to_the_news
      label: เล่าเรื่องนี้ให้คนทำใบข่าวฟัง ไม่ต้องใส่ชื่อใคร
      requires: { flag: job_news_walker }
      text: |
        ใบข่าวฉบับต่อมามีเรื่องยาวครึ่งหน้า ยุ้งข้าวที่ไฟไหม้ในตลาดแห่งหนึ่งเมื่อหลายปีก่อน กับคำสาบานที่ไม่มีใครตรวจ ไม่มีชื่อตลาด ไม่มีชื่อคน คนเขียนจ่ายให้{name}สองเหรียญเป็นค่าเรื่อง

        ไม่มีชื่อก็ไม่จำเป็นต้องมี วันนับเสียงมีคนถือใบข่าวฉบับนั้นมาที่ห้องโถงสามคน {rival}ได้เสียงน้อยที่สุด แม่ค้าบางแผงพับหน้าที่มีเรื่องนั้นเสียบไว้ข้างตาชั่งอยู่ครึ่งเดือน
      effects: { gold: 2, flags: [struck_at_the_rival, sold_the_fire_to_the_news] }

- id: adult.arc_feud_3_the_well_rope
  stage: adult
  scene: road
  weight: 30
  arc: { id: feud, step: 3 }
  cast:
    rival: { id: feud_rival }
  text: |
    ชายหนุ่มคนหนึ่งยืนอยู่ที่บ่อน้ำปากซอยตอนที่{name}ไปตักน้ำเย็น พอ{name}หย่อนถัง เขาก็เข้ามาช่วยหมุนรอกโดยไม่มีใครขอ ผมหยิกตัดสั้น ไหล่กว้าง มือหนาแบบคนแบกของมาหลายปี เขาบอกชื่อว่าโทเวน ลูกของ{rival} แล้วบอกธุระ

    เขาจะขอใบอนุญาตตั้งโรงเก็บน้ำมันตะเกียงริมตลาด สภาย่านให้หาคนในย่านที่ชื่อสะอาดมาลงชื่อรับรองสองคน คนแรกได้แล้ว คือนายช่างที่เขาฝึกงานด้วย คนที่สอง แม่บอกให้มาหา{name}

    {name}ดูมือที่หมุนรอก ปีที่ยุ้งไหม้ มือคู่นี้ยังเล็กกว่าหัวตะเกียง โทเวนพูดถึงปีนั้นแค่ว่าเป็นปีที่แม่ซื้อรองเท้าคู่ใหม่ให้ ปีที่ทั้งตลาดกินขนมปังดำ เขาวางถังน้ำลงข้างเท้า{name} น้ำไม่หกสักหยด แล้วรอคำตอบ
  choices:
    - id: tell_and_refuse
      label: เล่าให้เขาฟังว่าเย็นวันนั้นใครถือตะเกียงเข้ายุ้ง แล้วไม่ลงชื่อ
      requires: { not_flags: [named_the_boy_at_the_hearing] }
      text: |
        {name}เล่าตรงขอบบ่อนั่นเอง เล่าไม่ยาว ตะเกียงดวงหนึ่ง เด็กคนหนึ่ง คำสาบานคำหนึ่ง โทเวนฟังจนจบ หน้าของเขาไม่เปลี่ยนมาก มีแต่มือที่ยังจับเชือกรอกอยู่ บีบจนข้อนิ้วขาว

        เขาไม่เถียง ไม่ถามว่าจริงหรือ ถามแค่ว่าทำไมแม่ถึงส่งเขามาหาคนนี้ {name}บอกว่าไม่รู้ เขาเดินออกไปทางบ้านแม่ ถังน้ำของ{name}ยังวางเต็มอยู่ข้างบ่อ เดือนต่อมาคนในตลาดพูดกันว่าโทเวนไม่ไปกินข้าวบ้านแม่อีกแล้ว และ{rival}รู้ดีว่าจะโทษใคร
      effects: { flags: [feud_handed_down, told_toven_and_refused] }
    - id: sign_without_a_word
      label: ลงชื่อให้ ไม่พูดเรื่องเก่า
      text: |
        {name}ลงชื่อบนใบของสภาที่เขาพับใส่อกเสื้อมา ลายมือตรงเท่าที่มือเปียกน้ำบ่อจะเขียนได้ โทเวนเป่าหมึกให้แห้ง ขอบคุณสองครั้ง แล้วหิ้วถังน้ำไปส่งให้ถึงหน้าบ้าน

        โรงเก็บน้ำมันเปิดก่อนหน้าหนาว หลังคากระเบื้อง ผนังอิฐ ถังทรายวางข้างประตูสองถัง วันเปิดโรง{rival}มายืนดูอยู่อีกฝั่งถนน ตรงข้ามกับที่{name}ยืน ไม่มีใครข้ามถนนไปหาใคร แต่ตอนกลับ นางเดินทางเดียวกับ{name}อยู่ครึ่งทาง ห่างกันสามช่วงแขน
      effects: { flags: [feud_cooling, signed_for_toven] }
    - id: tell_and_sign
      label: เล่าให้เขาฟังทั้งหมด แล้วลงชื่อให้อยู่ดี
      requires: { not_flags: [named_the_boy_at_the_hearing] }
      text: |
        โทเวนฟังจบแล้วนั่งลงบนขอบบ่อ ถามว่าทำไมยังจะลงชื่อให้ {name}บอกว่าใบนี้ถามว่าชื่อของโทเวนสะอาดไหม ไม่ได้ถามเรื่องแม่ของเขา และเด็กที่ถือตะเกียงไม่เคยสาบานอะไรต่อหน้าใคร

        หลายวันต่อมา{rival}มาที่บ้าน ยืนอยู่หน้าประตูเหมือนคนเดินผิดซอย บอกว่าลูกเล่าให้ฟังแล้ว บอกแค่นั้น แล้วยื่นน้ำมันตะเกียงขวดเล็กจากโรงของลูกให้หนึ่งขวด ไม่คิดเงิน {name}รับไว้ ตะเกียงในบ้านใช้น้ำมันขวดนั้นได้จนสิ้นเดือน
      effects: { stats: { WIS: 1 }, people: [{ id: feud_rival, closeness: 1 }], flags: [feud_cooling, told_toven_and_signed] }
    - id: ask_about_the_coal_yard
      label: ถามเขาว่าหน้าหนาวที่ลานถ่านของหลวงเป็นอย่างไร
      requires: { flag: named_the_boy_at_the_hearing }
      text: |
        โทเวนปล่อยมือจากรอก บอกว่าหนาว ถ่านเปียกหนักกว่าถ่านแห้งสองเท่า คนคุมลานนับตะกร้าด้วยรอยขีดบนผนัง ต้นหนาวเขาคัดได้วันละเก้าตะกร้า ปลายหนาวได้สิบสี่ เล็บดำไปจนถึงหน้าฝน เขาเล่าเหมือนคนเล่าถึงงานแรกของตัวเอง

        แล้วเขาบอกว่าโกรธ{name}อยู่สองหน้าหนาว หน้าหนาวที่สามเลิกโกรธ เพราะนึกออกว่าวันนั้นคนที่ยืนสาบานหน้าตะเกียงของสภาไม่ใช่{name} {name}ลงชื่อบนใบที่เขาพับใส่อกเสื้อมา โทเวนเป่าหมึกให้แห้ง แล้วหิ้วถังน้ำไปส่งให้ถึงหน้าบ้าน บอกว่าถังนี้หนักกว่าตะกร้าถ่าน แต่ทางใกล้กว่า
      effects: { stats: { WIS: 1 }, flags: [feud_cooling, asked_toven_about_the_coal_yard] }
    - id: go_to_her_door
      label: ไม่ลงชื่อ หิ้วถังเดินไปที่บ้านของ{rival}เอง
      text: |
        {name}ไม่ตอบโทเวน ยกถังน้ำขึ้นเดินผ่านเขาไปทางบ้านของ{rival} เขาเดินตามมาสองก้าวแล้วหยุด {name}เคาะประตูบ้านนางด้วยสันมือที่ยังเปียก นางเปิดออกมาเร็วเหมือนรอเสียงนี้มาทั้งเย็น

        {name}บอกว่าถ้าอยากได้อะไรจากชื่อของ{name} ให้มาขอเอง อย่าส่งคนที่ไม่รู้อะไรมายืนรอที่บ่อแทน {rival}บอกว่าลูกนางรู้อะไรหรือไม่รู้อะไรไม่ใช่ธุระของ{name} และนางไม่เคยขออะไรจาก{name}สักอย่าง แล้วปิดประตู ไม่กระแทก ปิดช้าๆ ให้ได้ยินเสียงดาลไม้ลงล็อก ทั้งซอยได้ยินด้วย
      effects: { stats: { CHA: 1 }, flags: [feud_burning, went_to_her_door] }
    - id: ask_about_the_key
      label: ถามเขาว่าแม่เคยเล่าเรื่องกุญแจยุ้งให้ฟังไหม
      requires: { flag: struck_at_the_rival }
      text: |
        โทเวนบอกว่าเล่า แม่เล่าว่าปีนั้นมีคนไปพูดกับหัวหน้าสภาจนนางไม่ได้กุญแจ และแม่รู้ว่าคนนั้นคือ{name} {name}ถามว่าแล้วทำไมยังส่งมา เขาตอบตามที่แม่สั่งให้ตอบ คำต่อคำ คนที่กล้าพูดเรื่องจริงต่อหน้าสภา ลายมือชื่อมีค่ากว่าคนอื่น

        {name}ลงชื่อ หมึกซึมเพราะกระดาษชื้นมือ โทเวนเอาใบนั้นไปส่งสภาในบ่ายวันเดียวกัน {name}คิดถึงประโยคนั้นอยู่หลายคืน ยังหาไม่เจอว่าเป็นคำชมหรือคำด่า
      effects: { flags: [feud_cooling, signed_after_the_key] }
    - id: ask_what_she_sent
      label: ถามว่าแม่ฝากอะไรมาด้วยหรือเปล่า
      requires: { flag: stayed_hand_on_the_rival }
      text: |
        โทเวนล้วงถุงผ้าใบเล็กออกจากอกเสื้อ ข้างในมีเหรียญสามเหรียญ ปากถุงผูกด้ายแดงเก่าจนสีซีด เขาบอกว่าแม่บอกว่า{name}จะรู้เองว่าเป็นค่าอะไร {name}รู้ สามเหรียญ เท่ากับที่สภาตั้งไว้ปรับคนทำยุ้งไหม้ในวันนั้นพอดี

        {name}รับถุงไว้ แล้วลงชื่อในใบของสภา ด้ายแดงเส้นนั้น{name}แก้ออกแล้วไม่ได้ทิ้ง พันไว้รอบหูหิ้วตะกร้าใบที่ใช้ไปตลาด
      effects: { gold: 3, flags: [feud_cooling, took_the_fine_back] }

# ===================== low_voice เสียงทุ้มในฝัน =====================

- id: adult.arc_low_voice_1_the_third_plank
  stage: adult
  scene: home
  time: night
  weight: 46
  arc: { id: low_voice, step: 1 }
  when:
    age: [30, 55]
    any_flags: [race_tiefling, demon_voice_heard, dream_name_from_voice, paid_the_voice, refused_the_voice, told_the_voice_no, deep_voice_offered, father_heard_voice, met_the_voice_behind_the_brass]
  text: |
    เสียงทุ้มมาในคืนที่{name}หลับลึกที่สุดของปี ไม่มีภาพ มีแต่ความมืดอุ่นแบบในเตาที่ไฟมอดแล้ว กับเสียงต่ำเสียงเดียว พูดช้า ออกเสียงชื่อของ{name}ครบทุกพยางค์

    "สะพานไม้ข้ามคูหลังตลาด" เสียงนั้นว่า "แผ่นที่สามนับจากฝั่งตะวันออก แผ่นที่สีเข้มกว่าแผ่นอื่น เช้าวันที่สามนับจากนี้ เจ้าจะเหยียบมันตอนแบกของไปตลาด แผ่นนั้นจะหัก ข้อเท้าซ้ายของเจ้าจะหักตาม เจ้าจะต้องนอนไปครึ่งหน้าฝน"

    ความมืดรอให้{name}คิดตามทัน แล้วพูดต่อด้วยน้ำเสียงเดิม "ข้าทำให้มันไม่หักได้ ขอแค่ก่อนวันที่สาม เจ้ายกหินแบนก้อนหนึ่งจากริมคูตรงตีนสะพาน ไปวางไว้บนธรณีประตูบ้านร้างท้ายซอย หินไม่ใหญ่ ยกคนเดียวได้ ไม่มีใครเดือดร้อน ไม่มีใครต้องรู้"

    {name}ตื่นตอนฟ้ายังไม่สาง ข้อเท้าซ้ายยังดีอยู่ เช้านั้นเดินไปดูสะพาน แผ่นที่สามจากฝั่งตะวันออกสีเข้มกว่าแผ่นอื่นจริง ที่ตีนสะพานมีหินแบนก้อนหนึ่งจมโคลนอยู่ครึ่งก้อน
  choices:
    - id: carry_the_stone
      label: งัดหินขึ้นจากโคลน แล้วยกไปวางที่ธรณีประตูบ้านร้าง
      text: |
        หินหนักกว่าที่เห็น {name}ต้องพักสองครั้งกว่าจะถึงท้ายซอย วางลงบนธรณีประตูไม้ที่ผุจนนิ่ม หินแนบลงพอดีเหมือนเคยวางอยู่ตรงนั้นมาก่อน เช้าวันที่สาม{name}ตั้งใจเหยียบแผ่นสีเข้มเต็มน้ำหนัก ไม้ลั่นเสียงหนึ่ง แล้วก็รับไว้

        ปลายเดือนช่างของตลาดมาเปลี่ยนไม้สะพาน แผ่นที่สามยุ่ยคามือเขาเหมือนขนมปังแช่น้ำ เขาบ่นว่าไม่รู้ทนมาได้อย่างไร หินบนธรณีบ้านร้างไม่มีใครยกออก ตะไคร่ขึ้นคลุมด้านบนในหน้าฝนนั้น คืนที่สาม{name}นอนรอเสียงทุ้มอยู่ครึ่งคืน เสียงนั้นไม่มา
      effects: { stats: { STR: 1 }, world: { demon: 1 }, flags: [took_the_first_offer] }
    - id: the_long_way
      label: ไม่แตะหิน แล้วเดินอ้อมไปทางลานฟอกหนังทุกเช้าจนพ้นเดือน
      text: |
        ทางอ้อมไกลกว่าครึ่งชั่วโมง ทุกเช้า{name}ไปถึงตลาดหลังคนอื่นตั้งแผงเสร็จแล้ว ที่ดีๆ ไม่เหลือ ของขายได้น้อยลงทั้งเดือน กลิ่นลานฟอกหนังติดเสื้อจนต้องซักทุกเย็น

        สายวันที่สาม แผ่นที่สามของสะพานหักลงไปในคูเอง ไม่มีใครเหยียบ ไม่มีของหนักวางทับ คนที่ยืนอยู่แถวนั้นบอกว่าได้ยินเสียงไม้ลั่นแล้วก็ขาด คืนนั้นเสียงทุ้มมาหาสั้นๆ ไม่ทวง ไม่เยาะ พูดแค่ว่า "ข้ารอได้"
      effects: { gold: -2, flags: [declined_the_first_offer, took_the_long_way] }
    - id: cross_on_the_third_day
      label: ไม่แตะหิน แล้วเดินข้ามสะพานตามเดิมในเช้าวันที่สาม
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          {name}เหยียบแผ่นที่สามด้วยเท้าซ้ายตามที่เสียงนั้นบอก ไม้หักทันทีจริง แต่มือขวาจับราวสะพานไว้ก่อนที่ตัวจะตก ข้อเท้าแช่น้ำในคูถึงตาตุ่ม แล้วดึงขึ้นมาได้ ยังเดินได้

          ของในตะกร้าหล่นลงคูไปครึ่งตะกร้า {name}ยืนเปียกครึ่งตัวอยู่บนสะพาน ดูช่องว่างที่แผ่นไม้เคยอยู่ คำของเสียงทุ้มถูกทุกคำ ข้อเท้าเท่านั้นที่ไม่หัก
        effects: { stats: { DEX: 1 }, flags: [declined_the_first_offer, caught_the_rail] }
      failure:
        text: |
          ไม้หักตามที่บอก เท้าซ้ายลงไปในช่องว่าง ตัวเอียงไปอีกทาง มีเสียงดังจากข้อเท้า เสียงที่{name}จำได้ไปจนตาย คนขายปลาสองคนช่วยกันหามขึ้นจากคู

          {name}นอนอยู่ครึ่งหน้าฝนจริงตามที่เสียงนั้นว่า ไม่ขาดไม่เกิน คืนที่ข้อเท้าเริ่มหายจนลุกเดินได้ เสียงทุ้มมาหา ไม่พูดเรื่องข้อเท้า ไม่พูดเรื่องหิน พูดแค่ว่า "ข้าบอกเจ้าตามจริงทุกคำ"
        effects: { hp: -2, flags: [declined_the_first_offer, broke_the_ankle_as_told] }
    - id: cut_it_out
      label: ไปหาศาสนจักรตะเกียง ขอให้ตัดฝันนี้ออกจากหัว
      text: |
        นักบวชตะเกียงให้{name}กินน้ำมันขมครึ่งถ้วย แล้วนอนบนแผ่นหินใต้ตะเกียงดวงใหญ่สามคืนติด นักบวชสองคนผลัดกันนั่งข้างหัวทั้งคืน สวดเบาๆ เวลา{name}เริ่มฝัน มือเย็นๆ ข้างหนึ่งจะกดลงบนหน้าผากจนตื่น ก่อนจะให้กลับบ้าน นักบวชจดชื่อ{name}ลงในสมุดเล่มเล็กเล่มหนึ่ง ไม่บอกว่าเล่มอะไร

        {name}ผอมลงไปทั้งตัว เสียงทุ้มไม่มาอีกเลย และมีอย่างหนึ่งหายไปด้วย ทางเดินจากบ้านที่เกิดไปถึงบ่อน้ำ ทางที่เคยเดินวันละหลายเที่ยวมาตั้งแต่ตัวเท่าถังน้ำ {name}จำได้ว่ามีบ่อ จำได้ว่ามีบ้าน ตรงกลางระหว่างนั้นว่างเปล่า
      effects: { hp: -2, alignment: { law: 1 }, arc: { id: low_voice, close: true }, flags: [had_the_voice_cut_out] }
    - id: cut_it_out_at_the_altar
      label: ทำพิธีตัดฝันด้วยมือตัวเองหน้าแท่นของเทพที่นับถือ
      requires: { class: cleric }
      text: |
        {name}อดอาหารสามวัน นอนหน้าแท่นของ{god}โดยไม่มีหมอน ทุกครั้งที่ความมืดอุ่นเริ่มคลี่ออกในหัว {name}ลุกขึ้นนั่ง สวดบทแรกที่เคยเรียนตอนเข้าวิหาร แล้วนอนลงใหม่ คืนที่สามเสียงทุ้มมาถึงขอบฝัน เรียกชื่อครึ่งพยางค์ แล้วถอยไปเอง สุภาพเหมือนแขกที่เห็นว่าเจ้าบ้านไม่สะดวก

        เช้าวันที่สี่{name}ลุกขึ้นจะสวดขอบคุณ แล้วพบว่าจำบทแรกไม่ได้แล้ว บทที่สวดมาทั้งชีวิตหายไปทั้งบท ต้องเปิดคัมภีร์อ่านตามทีละคำเหมือนเด็กเพิ่งเข้าวิหาร ฝันคืนต่อๆ มาเป็นฝันของคนธรรมดา ตลาด ฝน คนตายที่เคยรู้จัก
      effects: { hp: -2, stats: { WIS: 1 }, arc: { id: low_voice, close: true }, flags: [had_the_voice_cut_out, cut_it_out_at_the_altar] }

- id: adult.arc_low_voice_2_the_noon_doze
  stage: adult
  scene: home
  weight: 30
  arc: { id: low_voice, step: 2 }
  text: |
    หลายปีที่เสียงทุ้มไม่มา จนเที่ยงวันหนึ่งที่ร้อนจนนกไม่ร้อง {name}เผลอหลับบนม้านั่งหลังบ้าน หลับไม่ถึงครึ่งชั่วโมง ความมืดอุ่นนั้นก็มารออยู่แล้ว เหมือนไม่เคยไปไหน

    เขาเอ่ยถึงสะพานไม้ข้างตลาดครั้งเดียว ไม่ทวง ไม่อวด บอกแค่ว่าแผ่นไม้แผ่นนั้นเปลี่ยนใหม่ไปนานแล้ว แล้วเข้าเรื่อง

    "ไอที่เจ้าเป็นมาตั้งแต่ปลายหนาว" เสียงนั้นว่า "จะลงไปถึงปอดซ้ายก่อนฝนแรก ปอดข้างนั้นจะเหลือใช้ได้ครึ่ง ตั้งแต่นั้นเจ้าจะขึ้นเนินไม่ได้โดยไม่หยุดพัก ไปจนตลอดชีวิต ข้าหยุดมันได้ พรุ่งนี้เช้า ที่โรงเตี๊ยมริมทางเกวียน ชายรองเท้าเปื้อนเถ้าคนหนึ่งจะนั่งกินข้าวต้มโต๊ะริมประตู เจ้าบอกเขาประโยคเดียว ฝนจะมาช้ากว่าที่ว่ากันไว้ครึ่งเดือน แล้วเดินออกมา ประโยคนั้นเป็นความจริง เจ้าไม่ต้องโกหกใคร"

    {name}ตื่นขึ้นมาไอ ไอยาวจนต้องเกาะพนักม้านั่ง เสมหะที่ออกมามีสีที่ไม่เคยเห็น
  choices:
    - id: say_the_sentence
      label: ไปโรงเตี๊ยมพรุ่งนี้เช้า แล้วพูดประโยคนั้น
      text: |
        ชายคนนั้นนั่งอยู่โต๊ะริมประตูจริง ผมสั้นติดหนังหัว รองเท้าเปื้อนเถ้าสีเทาอ่อนแบบที่ทางแถวนี้ไม่มี {name}ยืนข้างโต๊ะ พูดประโยคนั้นครั้งเดียว เขาวางช้อนลง จ่ายเงินค่าข้าวต้มที่ยังกินไม่ถึงครึ่ง แล้วออกไปทางท่าเกวียนโดยไม่ถามว่า{name}เป็นใคร

        ไอหายภายในเจ็ดวัน หายแบบที่ไม่เหลือแม้แต่เสียงครืดในอกตอนเช้า ฝนแรกมาช้ากว่าที่ทุกคนคาดครึ่งเดือนพอดี ปลายฤดู{name}เดินขึ้นเนินหลังย่านจนถึงยอดโดยไม่หยุดพักสักครั้ง แล้วยืนหายใจเต็มปอดอยู่บนนั้น ไม่รู้ว่าชายคนนั้นไปไหน และไม่มีวันรู้
      effects: { stats: { CON: 1 }, world: { demon: 1 }, flags: [took_the_second_offer] }
    - id: keep_the_cough
      label: ไม่ไป ปล่อยให้ไอเดินไปตามทางของมัน
      text: |
        {name}ไม่ไปโรงเตี๊ยม เช้านั้นไปทำงานตามปกติ ไอตลอดทาง ไอจนคนเดินสวนหลบ ปลายเดือนไอลงปอดจริงตามที่เขาบอก มีไข้สามสัปดาห์ หมอเอาหูแนบหลังแล้วบอกว่าข้างซ้ายเสียงไม่เหมือนข้างขวา

        ฝนแรกมาช้ากว่าที่ทุกคนคาดครึ่งเดือน เรื่องนั้นก็จริงด้วย ตั้งแต่ปีนั้น{name}ขึ้นเนินหลังย่านได้ครึ่งทางแล้วต้องหยุด ยืนพักตรงต้นไม้ต้นเดียวกันทุกครั้ง จนเปลือกต้นไม้ตรงที่เอามือยันสึกเป็นรอย
      effects: { hp: -2, flags: [declined_the_second_offer] }
    - id: go_and_watch
      label: ไปโรงเตี๊ยม นั่งดูชายคนนั้นจนเขากินเสร็จ แต่ไม่เอ่ยประโยคนั้น
      text: |
        {name}นั่งโต๊ะมุมห้อง สั่งน้ำชาร้อน ชายรองเท้าเปื้อนเถ้ากินข้าวต้มช้า เป่าทุกช้อน ดูประตูทุกครั้งที่มีคนเข้า เหมือนรอใครคนหนึ่งที่รู้ว่าจะมา กินหมดชามแล้วเขานั่งต่ออีกพักใหญ่ แล้วจ่ายเงิน เดินออกไปทางที่มา ไม่ใช่ทางท่าเกวียน

        ไอลงปอดตามที่บอก{name}นอนซมทั้งต้นหน้าฝน ฝนมาช้าครึ่งเดือน คนที่ไม่ได้ยินประโยคนั้นจะทำอะไรต่างไปจากที่ควร {name}ไม่รู้ รู้แต่ว่าชายคนนั้นไม่ใช่คนร้าย หน้าเหมือนคนหาบน้ำขายคนหนึ่ง ใครก็เป็นได้
      effects: { hp: -2, stats: { WIS: 1 }, flags: [declined_the_second_offer, watched_the_man_in_ash_shoes] }
    - id: ask_what_it_does
      label: ถามก่อนว่าประโยคนั้นจะไปทำอะไรกับใคร
      requires: { flag: took_the_first_offer }
      text: |
        เสียงทุ้มตอบโดยไม่ต้องคิด สุภาพเหมือนเคย "ชายคนนั้นจะออกเดินทางเร็วขึ้นครึ่งเดือน เขาจะไปถึงที่ที่เขาจะไปก่อนฝน แทนที่จะไปถึงหลังฝน ไม่มีใครตายเพราะประโยคนั้น ข้าพูดได้เท่านี้ และข้าไม่เคยพูดเกินที่รู้"

        {name}ไปโรงเตี๊ยมตอนเช้า พูดประโยคนั้น ชายคนนั้นออกไปทางท่าเกวียน ข้าวต้มยังเหลือครึ่งชาม ไอหายภายในเจ็ดวัน {name}รู้แล้วว่าตัวเองช่วยให้ใครคนหนึ่งไปถึงที่ไหนสักแห่งเร็วขึ้น และรู้ว่าจะไม่มีวันรู้มากกว่านั้น
      effects: { stats: { WIS: 1 }, world: { demon: 1 }, flags: [took_the_second_offer, asked_what_the_sentence_does] }
    - id: the_plank_was_enough
      label: บอกเขาว่าแผ่นไม้ก็หักไปแล้วครั้งหนึ่ง ปอดข้างเดียวก็อยู่ได้
      requires: { flag: declined_the_first_offer }
      text: |
        เสียงทุ้มไม่เถียง "เจ้าพูดถูก" เขาว่า "คนอยู่ได้ด้วยปอดครึ่งข้าง ข้าเคยเห็นมามาก" แล้วจากไปเหมือนแขกที่ลุกตอนเจ้าบ้านเริ่มเก็บถ้วย ไม่ได้รอให้{name}พูดจบ

        ไอลงปอดตามที่บอก{name}ทำงานต่อทุกวันในช่วงที่ไข้ยังไม่ลด ไม่ยอมนอน จนคนในบ้านต้องเอาผ้าห่มมาคลุมให้ตอนหลับคาโต๊ะ ปีนั้นผ่านไปแบบปีของคนที่ปฏิเสธแล้วไม่ยอมดูว่าตัวเองเสียอะไรไป
      effects: { hp: -2, stats: { CON: 1 }, flags: [declined_the_second_offer, refused_on_the_plank] }
    - id: treat_it_yourself
      label: ฟังเสียงในอกตัวเองแล้ววางแผนรับมือ อย่างหมอที่รู้ล่วงหน้าว่าโรคจะไปทางไหน
      requires: { any_flags: [job_hedge_doctor, job_road_healer] }
      text: |
        {name}เคยบอกคนไข้มาหลายสิบคนว่าโรคจะไปทางไหน ไม่เคยมีใครบอก{name}ได้แม่นเท่าเสียงนั้น {name}ไม่ไปโรงเตี๊ยม ต้มน้ำใบสนกับเกลือหยาบไว้สูดทุกคืน ย้ายที่นอนไปข้างเตา ฝึกหายใจลงท้องทีละน้อย ตามที่เคยสอนคนอื่นแต่ไม่เคยต้องทำเอง

        ปอดซ้ายยังเหลือครึ่งตามที่บอก ไม่มีอะไรเปลี่ยนเรื่องนั้นได้ แต่{name}ไม่ต้องนอนซมทั้งฤดูเหมือนคนอื่น ต้นหน้าหนาวก็กลับมาออกตรวจได้ สูตรใบสนกับเกลือ{name}จดเพิ่มลงสมุดยา ใต้หัวข้อที่ตั้งขึ้นใหม่ว่า สิ่งที่รู้ล่วงหน้า
      effects: { hp: -1, stats: { INT: 1 }, flags: [declined_the_second_offer, nursed_own_lung] }

- id: adult.arc_low_voice_3_the_price
  stage: adult
  scene: home
  weight: 30
  arc: { id: low_voice, step: 3 }
  text: |
    ครั้งที่สามเสียงทุ้มไม่รอให้{name}หลับลึก มาในช่วงที่ตายังปิดแต่หูได้ยินไก่ขันแล้ว ฟ้าข้างนอกหน้าต่างเริ่มเป็นสีน้ำนม

    "ข้อนี้เป็นข้อสุดท้ายที่ข้าจะเสนอเจ้า" เขาว่า "ข้าจะพูดราคาให้ครบก่อน เจ้าจะได้ไม่ต้องเดา ดาวที่ตกลงมาหลังจากนี้ จะไม่ตกบนหลังคาที่เจ้านอน แสงของมันจะไม่ซึมเข้าน้ำบ่อที่เจ้าดื่ม ตลอดชีวิตของเจ้า แลกกับจดหมายฉบับเดียว ถึงผู้นับหินชื่อเวสเตนที่ป้อมสอง บอกเขาว่าแม่ของเขาที่ปากทางเหมืองถามหาเขาทุกคืน เรื่องนี้จริง ข้าไม่ขอให้เจ้าโกหกใคร เขียนวันไหนก็ได้ที่ข้าจะบอก"

    เขาไม่บอกว่าเวสเตนจะทำอะไรหลังอ่านจดหมาย ไม่บอกว่าใครจะนับหินแทนเวสเตนในเดือนที่เขาไม่อยู่ {name}รู้ว่าถ้าถาม เขาจะตอบตามจริง และรู้ว่าตัวเองไม่อยากได้ยินคำตอบ

    ไก่ขันอีกครั้ง ความมืดอุ่นยังรออยู่ ไม่เร่ง
  choices:
    - id: accept
      label: รับข้อเสนอ แล้วรอวันที่เขาจะบอก
      text: |
        "ข้าจะบอกเจ้าก่อนหนึ่งคืน" เขาว่า แล้วไปเลย

        {name}ลุกขึ้นมาตอนฟ้าสาง ตัดกระดาษแผ่นหนึ่งออกจากสมุด วางไว้บนหิ้งกับขวดหมึกที่ปิดฝาแน่น ไม่ได้เขียนอะไร ปีนั้นมีดาวตกลงที่ทุ่งท้ายย่านสองครั้ง ครั้งหลังไฟลุกไปสามหลังคาเรือน หลังคาบ้าน{name}อยู่ห่างไปไม่ถึงสิบช่วงตัว ไม่มีเถ้าร่อนลงมาสักเกล็ด กระดาษแผ่นนั้นยังวางรออยู่บนหิ้ง ฝุ่นจับขอบบางๆ
      effects: { world: { demon: 1 }, flags: [owes_the_voice] }
    - id: accept_and_warn
      label: รับข้อเสนอ แล้วเขียนอีกฉบับไปถึงผู้เฒ่าป้อมสองตั้งแต่เช้านี้
      text: |
        {name}ตอบรับ เสียงทุ้มฟังจนจบ แล้วบอกว่าจดหมายฉบับนั้นต้องเขียนวันที่เขาบอก ฉบับอื่นๆ ระหว่างนี้ {name}จะเขียนกี่ฉบับ ถึงใครก็ได้ ไม่อยู่ในข้อตกลง

        เช้านั้น{name}เขียนถึงผู้เฒ่าของป้อมสอง ไม่ได้เล่าเรื่องฝัน ขอแค่ว่าถ้าวันหนึ่งผู้นับหินชื่อเวสเตนต้องลงจากป้อมไปหาแม่ ให้คนที่มือมั่นที่สุดของป้อมนับหินแทน จดหมายส่งไปกับขบวนถ่านขาขึ้น ไม่มีคำตอบกลับมา ผู้เฒ่าอาจอ่าน อาจไม่อ่าน {name}เก็บต้นร่างไว้ใต้กระดาษเปล่าแผ่นที่รออยู่บนหิ้ง
      effects: { stats: { WIS: 1 }, world: { demon: 1 }, flags: [owes_the_voice, wrote_a_warning_ahead] }
    - id: the_voice_owes_me
      label: บอกเขาว่างานที่ขอไปทำให้ครบแล้ว ข้อนี้ไม่รับ
      requires: { any_flags: [took_the_first_offer, took_the_second_offer] }
      text: |
        {name}นับให้เขาฟังทีละครั้ง งานที่เขาขอ {name}ทำครบตามคำทุกคำ ของที่เขาให้ {name}รับไว้ตามคำทุกคำ เขาเคยพูดเองว่าไม่ทวงสิ่งที่ไม่ได้ตกลงกัน ข้อที่สามนี้{name}ไม่ตกลง

        ความมืดอุ่นเงียบไปพักหนึ่ง นานกว่าทุกครั้ง "ถูกตามตัวอักษร" เขาว่า "ข้าไม่ทวง" {name}ถามต่อว่าแล้วเขาติดอะไร{name}อยู่บ้างไหม เสียงทุ้มตอบด้วยน้ำเสียงเดียวกับที่ใช้บอกเรื่องแผ่นไม้ "ข้าติดเจ้าเท่าที่เจ้าคิดว่าข้าติด" แล้วจากไป {name}ตื่นมาพร้อมคำตอบนั้น พลิกดูได้ทุกด้านยังไม่เจอขอบ
      effects: { stats: { INT: 1 }, flags: [the_voice_owes_me] }
    - id: refuse_the_third
      label: ปฏิเสธข้อนี้ เหมือนที่ปฏิเสธมาแล้วสองครั้ง
      requires: { flag: declined_the_second_offer, not_flags: [took_the_first_offer] }
      text: |
        "สามครั้ง" เสียงทุ้มว่า ไม่โกรธ ไม่เสียดาย ฟังเหมือนคนจดบัญชีอ่านยอดท้ายหน้า "ข้าจะไม่มาอีก นี่ก็เป็นความจริงเหมือนกัน"

        แล้วเขาก็ไม่มาอีกจริง ฝันของ{name}ตั้งแต่คืนนั้นเป็นฝันที่คนทั่วไปฝัน ตลาด ฝน คนที่ตายไปแล้วมานั่งกินข้าวด้วย บางคืน{name}ตื่นมากลางดึก นอนฟังความมืดในห้องที่เป็นแค่ความมืด ปีนั้นมีดาวตกที่ทุ่งท้ายย่าน {name}ยืนดูไฟอยู่กับเพื่อนบ้าน มือเปล่าเหมือนทุกคน
      effects: { stats: { WIS: 1 }, flags: [refused_the_voice_three_times] }

# ===================== glass ผิวแก้ว =====================

- id: adult.arc_glass_1_the_first_patch
  stage: adult
  scene: refinery
  weight: 46
  arc: { id: glass, step: 1 }
  when:
    age: [28, 52]
    any_flags: [job_refinery_hand, glass_spot, glass_spot_adult, works_at_institute_stillroom, school_distill, star_dew_burn]
    not_flags: [race_tiefling]
  text: |
    จุดใสเท่าเม็ดงาที่ขึ้นบนผิวคนแถวโรงกลั่นแล้วอยู่เฉยไปทั้งชีวิต คนในย่านไม่นับว่าเป็นเรื่อง หย่อมแรกเป็นอีกเรื่องหนึ่ง

    เช้าวันหนึ่งตอนล้างหน้า {name}เห็นมันบนหลังมือข้างที่แตะน้ำค้างดาวมาบ่อยที่สุด ตรงโคนนิ้วนาง กว้างเท่าเล็บนิ้วก้อย ผิวตรงนั้นใสเหมือนน้ำแข็งแผ่นบางที่เกาะขอบโอ่งตอนหน้าหนาว ไม่เจ็บ ไม่คัน กดแล้วแข็งกว่าผิวรอบๆ นิดเดียว คืนนั้น{name}ยกมือขึ้นส่องตะเกียงฟ้า ใต้ผิวใสมีแสงสีเดียวกับตะเกียงเต้นอยู่เบาๆ ช้ากว่าชีพจร

    ทั้งสัปดาห์ต่อมา{name}เห็นของในที่มืดชัดขึ้น ขีดบนโหล ตะปูบนพื้น หน้าคนในตรอกตอนไม่มีไฟ ข่าวเรื่องตาแบบนี้เดินเร็วกว่าคน หัวหน้ากะห้องมืดของโรงกลั่นริมน้ำมาหาถึงที่ ไม่ขอดูมือ ถามแค่ว่าพร้อมเข้ากะมืดเมื่อไร ค่าแรงหนึ่งเท่าครึ่ง ห้องมืดต้องการตาแบบนี้เสมอ ก่อนไปเขาบอกด้วยว่าผู้ตรวจผิวแก้วของสมาคมจะมาตรวจมือทุกคนในย่านปลายเดือนนี้
  choices:
    - id: wrap_it
      label: พันผ้าปิดหลังมือก่อนผู้ตรวจมา แล้วเข้ากะมืด
      text: |
        ผ้าฝ้ายแถบเดียวพันสองรอบก็มิด ใครถามก็บอกว่ามีดบาด วันที่ผู้ตรวจมา {name}ยื่นมืออีกข้างให้ก่อน ผู้ตรวจพลิกดูแล้วโบกให้ผ่าน ไม่ขอดูข้างที่พันผ้า คนที่ต่อแถวข้างหลังสามคนพันผ้ามือข้างเดียวกันหมด

        กะมืดเริ่มหลังเที่ยงคืน ห้องยาวที่มีตะเกียงฟ้าดวงเดียวแขวนไว้ปลายห้อง {name}คัดโหลได้เร็วกว่าคนที่ทำมาก่อนหลายปี ปลายเดือนถุงค่าแรงหนักมือจนต้องนับสองรอบ ผ้าที่พันมือ{name}ซักทุกเย็น แล้วพันใหม่ทุกเช้า
      effects: { gold: 3, flags: [hid_the_glass_patch] }
    - id: show_the_inspector
      label: ยื่นมือข้างนั้นให้ผู้ตรวจผิวแก้วดูเอง
      text: |
        ผู้ตรวจเอาห่วงทองแดงวงเล็กทาบลงบนหย่อมใส กะขนาด แล้วจดลงสมุดปกดำเล่มหนาของสมาคม ชื่อ{name} วันนี้ มือข้างไหน กว้างเท่าไร หน้านั้นมีชื่อคนอื่นเรียงอยู่ก่อนแล้วครึ่งหน้า ลายมือเดียวกันหมด

        สมาคมให้{name}ทำงานต่อได้ แต่ต้องอยู่กะสว่าง ห่างหม้อ ค่าแรงลดลงหนึ่งขั้น หัวหน้ากะห้องมืดเลิกทักทาย ผู้ตรวจบอกว่าจะมาทาบห่วงใหม่ทุกต้นฤดู {name}เดินกลับบ้านพร้อมรอยห่วงทองแดงเป็นวงเขียวจางๆ บนหลังมือ วงนั้นล้างออกในสามวัน ชื่อในสมุดปกดำไม่มีวันล้างออก
      effects: { gold: -1, stats: { WIS: 1 }, alignment: { law: 1 }, flags: [showed_the_glass_patch] }
    - id: leave_the_dew
      label: เลิกแตะงานที่มีน้ำค้างดาวตั้งแต่ปีนี้ ค่าแรงเท่าไรก็ไม่เอา
      text: |
        {name}บอกหัวหน้ากะว่าไม่เข้า แล้วไปหางานที่ไม่ต้องจับโหล ได้งานแบกกระสอบที่ท่าเกวียน ค่าแรงครึ่งหนึ่งของที่เคยได้ เดือนแรกเงินขาดจนต้องขายหม้อทองเหลืองใบเดียวในบ้าน

        หย่อมใสบนหลังมืออยู่เท่าเดิม เท่าเล็บนิ้วก้อย ไม่ลามไปไหนอีกตลอดชีวิตที่เหลือ {name}ยังเห็นในที่มืดได้ดีกว่าคนอื่นนิดหนึ่ง พอให้เดินเข้าห้องตอนดึกโดยไม่ต้องจุดไฟ พอให้หาเข็มที่ตกพื้นเจอ ไม่มากกว่านั้น
      effects: { gold: -3, arc: { id: glass, close: true }, flags: [left_the_dew_work] }
    - id: show_brenik
      label: เอามือไปให้เบรนิกดูที่ห้องกลั่นของสถาบัน
      requires: { flag: works_at_institute_stillroom }
      text: |
        เบรนิกพลิกมือ{name}ใต้ตะเกียงฟ้าของห้องกลั่น เอานิ้วโป้งกดรอบหย่อมใสทีละด้าน ไม่จด ไม่เอาห่วงอะไรมาทาบ เขาบอกว่าสมาคมโรงกลั่นจดชื่อคนมีหย่อมเพราะวันหนึ่งต้องจ่ายค่าเลิกจ้าง สถาบันไม่จ่ายอะไรให้ใคร จึงไม่ต้องจด

        แล้วเขาก็ย้าย{name}เข้ากะคัดโหลตอนดึก ค่าแรงขึ้นหนึ่งขั้น คืนแรกเขาเดินผ่านมาดูมือ{name}ตอนจับโหลครั้งหนึ่ง บอกว่าหย่อมแบบนี้ขึ้นที่มือข้างที่จับโหลก่อนเสมอ เขาเห็นมาตั้งแต่ตัวเองยังมีคิ้ว
      effects: { gold: 2, stats: { INT: 1 }, flags: [hid_the_glass_patch, brenik_saw_the_patch] }
    - id: test_the_edge
      label: เอามีดเล่มบางที่สุดลองกรีดขอบหย่อมใส ดูว่าข้างในคืออะไร
      requires: { flag: school_distill }
      check: { stat: INT, dc: 14 }
      success:
        text: |
          คมมีดแตะผิวใสแล้วไถลออกเหมือนแตะกระจก ไม่มีรอย ไม่มีเลือด {name}ลองอีกครั้ง กดแรงกว่าเดิม ผลก็เหมือนเดิม คืนนั้นเขียนลงสมุดจดของตัวเองสามหน้า ผิวแก้วกันคมได้ แต่ไม่กันแสง แสงข้างใต้เต้นเร็วขึ้นทุกครั้งที่มือเข้าใกล้หม้อกลั่น

          {name}ไม่ให้ใครอ่านสมุดเล่มนั้น และรับกะมืดที่โรงกลั่นเสนอมาเป็นงานเสริม ค่าแรงพอจะซื้อเลนส์อันใหม่
        effects: { gold: 2, stats: { INT: 1 }, flags: [hid_the_glass_patch, studied_own_glass] }
      failure:
        text: |
          มีดไถลออกจากขอบผิวใส แล้วเข้าไปในผิวธรรมดาข้างๆ ลึกกว่าที่ตั้งใจ เลือดหยดลงบนหน้าสมุดจดจนอ่านไม่ออกครึ่งหน้า แผลนั้นหายช้า ผิวใสข้างๆ ไม่มีรอยแม้แต่เส้นเดียว

          {name}พันแผลแล้วรับกะมืดที่โรงกลั่นเสนอ ผ้าพันแผลอธิบายให้ใครฟังก็ได้ ผิวใสอธิบายไม่ได้
        effects: { hp: -1, gold: 2, flags: [hid_the_glass_patch, cut_beside_the_glass] }

- id: adult.arc_glass_2_the_covered_cart
  stage: adult
  scene: refinery
  weight: 30
  arc: { id: glass, step: 2 }
  text: |
    หลายปีผ่านไป หย่อมใสบนหลังมือของ{name}ลามจนถึงข้อมือ เป็นแผ่นเดียวต่อกัน ขอบหยักเหมือนแผนที่ชายฝั่ง ค่าแรงก็ขึ้นตามมาเท่าๆ กัน งานที่มืดที่สุด ขีดที่ละเอียดที่สุด ตกมาที่มือข้างนี้ก่อนเสมอ

    โนวัลทำงานห้องเดียวกับ{name}มาหลายปี ผอม ร้องเพลงไม่เป็นแต่ร้องทุกคืน ของเขาเริ่มที่หลังมือเหมือนกัน แต่ลามเร็วกว่า ปีนี้ขึ้นคอ ขึ้นแก้มข้างหนึ่ง แสงฟ้าเต้นทั้งแผ่น คืนสุดท้ายที่มาทำงาน เขาเล่าเรื่องงานเลี้ยงงานหนึ่งให้{name}ฟังทั้งคืน ใครแต่งงานกับใคร ใครเมาจนตกบันได {name}ไม่รู้จักงานเลี้ยงนั้น ถามคนในห้อง ไม่มีใครรู้จัก ยังไม่มีใครจัดงานแบบนั้นเลยสักคน

    เช้าต่อมาโนวัลไม่มา เพื่อนบ้านของเขาบอกว่าตอนดึกมีเกวียนคลุมผ้าใบมาจอดหน้าบ้าน คนขับใส่ถุงมือหนัง พาโนวัลขึ้นเกวียนไป ไม่ได้บอกว่าไปไหน

    ที่ที่โนวัลเคยยืนเป็นมุมที่มืดที่สุดของห้อง ค่าแรงสูงที่สุด หัวหน้าต้องหาคนมาแทน เขาดูมือ{name}ก่อนดูหน้า
  choices:
    - id: take_novals_place
      label: รับที่ของโนวัล
      text: |
        บนชั้นไม้ตรงที่โนวัลยืน มีรอยมีดขีดไว้รอยหนึ่ง ระดับเดียวกับขีดบนโหลที่ต้องอ่านบ่อยที่สุด โนวัลขีดไว้เองเพราะขี้เกียจก้ม {name}ใช้รอยนั้นตั้งแต่คืนแรก

        ค่าแรงเดือนแรกที่มุมนั้นมากพอซื้อรองเท้าหนังดีๆ ได้หนึ่งคู่โดยไม่ต้องคิด {name}ซื้อ ใส่ไปทำงานคืนที่สอง ทั้งห้องไม่มีใครร้องเพลงอีก ห้องเงียบลงจนได้ยินเสียงน้ำค้างดาวหยดในหม้อ
      effects: { gold: 4, flags: [worked_on_through_the_glass] }
    - id: cut_the_hours
      label: ขอย้ายไปกะเช้า ทำงานครึ่งวัน ห่างหม้อ
      text: |
        หัวหน้าให้ย้ายแต่ตัดค่าแรงลงเกินครึ่ง {name}ใช้เวลาครึ่งวันที่ได้มา เดินถามคนขับเกวียนทุกคนในย่านที่ใส่ถุงมือหนัง ว่ารู้จักเกวียนคลุมผ้าใบคันนั้นไหม ไม่มีใครรู้ หรือไม่มีใครบอก

        หย่อมใสหยุดลามไปทั้งปี ยังอยู่ที่ข้อมือ ขอบหยักเหมือนเดิม {name}ทำกับข้าวเองได้ทุกมื้อ เพราะมีเวลา ทุกมื้อทำเผื่อหนึ่งที่ แล้วกินที่ที่เผื่อไว้เองตอนดึก
      effects: { gold: -2, stats: { CON: 1 }, flags: [cut_the_hours_for_the_glass] }
    - id: wrap_to_the_elbow
      label: พันผ้าให้ถึงข้อศอก แล้วรับกะของโนวัลเพิ่มอีกครึ่งกะ
      requires: { flag: hid_the_glass_patch }
      text: |
        ผ้าพันมือยาวขึ้นจนต้องใช้สองแถบ ใครถามก็ยังบอกว่ามีดบาด คนในห้องเลิกถามไปนานแล้ว ผู้ตรวจผิวแก้วมาปีละสองครั้ง {name}ลาป่วยตรงกับสองวันนั้นพอดีทุกปี

        กะครึ่งที่เพิ่มขึ้นทำให้ถุงค่าแรงหนักกว่าเดิมเกือบเท่าตัว และทำให้{name}นอนวันละไม่ถึงครึ่งคืน ปลายเดือนตาแดงจนต้องเอาผ้าชุบน้ำโปะ แต่ในห้องมืดตาคู่นั้นยังเห็นทุกขีด ยิ่งมืดยิ่งเห็น
      effects: { gold: 6, hp: -1, flags: [worked_on_through_the_glass, doubled_the_dark_shift] }
    - id: ask_the_inspector
      label: ไปหาผู้ตรวจผิวแก้ว ถามว่าเกวียนคลุมผ้าใบพาโนวัลไปไหน
      requires: { flag: showed_the_glass_patch }
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ผู้ตรวจเปิดสมุดปกดำให้ดูหน้าเดียว ใต้ชื่อโนวัลมีคำว่า ส่งต่อ เขียนด้วยหมึกคนละสีกับบรรทัดอื่น ไม่มีชื่อที่ ไม่มีชื่อคนรับ ผู้ตรวจบอกว่าเท่านี้คือทั้งหมดที่เขาเห็นเหมือนกัน

          แล้วเขาก็เปิดหน้าของ{name} ทาบหย่อมใสด้วยห่วงทองแดงวงที่ใหญ่ขึ้น บอกว่าของ{name}ลามช้าเพราะอยู่กะสว่างมาหลายปี ถ้าอยากให้ช้าอย่างนี้ต่อไป ให้ตัดชั่วโมงลงอีก {name}ตัดตามนั้นตั้งแต่เดือนต่อมา
        effects: { stats: { CHA: 1 }, gold: -2, flags: [cut_the_hours_for_the_glass, asked_after_noval] }
      failure:
        text: |
          ผู้ตรวจไม่เปิดสมุด บอกว่าเรื่องคนที่ส่งต่อไปแล้วไม่ใช่เรื่องที่คนงานควรถาม แล้วเขียนอะไรบางอย่างต่อท้ายชื่อของ{name}ในสมุดปกดำ คำเดียว สั้นๆ {name}อ่านกลับหัวไม่ออก

          เดือนนั้นสมาคมตัดชั่วโมงของ{name}ลงเองโดยไม่ต้องขอ ค่าแรงตกลงไปอีกขั้น หัวหน้ากะบอกว่าคำสั่งมาจากข้างบน
        effects: { gold: -3, flags: [cut_the_hours_for_the_glass, inspector_marked_a_word] }
    - id: ask_brenik
      label: ถามเบรนิกตรงๆ ว่าคนที่ลามถึงคอแล้วไปไหน
      requires: { flag: works_at_institute_stillroom }
      text: |
        เบรนิกเช็ดมือกับผ้ากันเปื้อนช้าๆ ตอบว่าไปที่ที่มีคนดูแล แล้วไม่พูดต่อ {name}ถามว่าที่ไหน เขาบอกว่าที่ที่{name}ไม่ต้องไป ถ้า{name}ไม่อยากไป

        เช้าวันต่อมาเขาย้าย{name}ออกจากกะดึก ให้ไปคุมห้องล้างโหลตอนกลางวัน ค่าแรงลดลงหนึ่งขั้น ไม่มีใครถามว่าทำไม ที่หน้าห้องกลั่นมีชื่อของ{name}ขีดฆ่าออกจากกระดานเวรดึก ลายมือของเบรนิกเอง
      effects: { gold: -2, stats: { WIS: 1 }, flags: [cut_the_hours_for_the_glass, asked_brenik_about_the_cart] }
    - id: chart_the_spread
      label: จดการลามของหย่อมตัวเองทุกสัปดาห์ เทียบกับที่จำได้ของโนวัล
      requires: { flag: school_distill }
      text: |
        {name}ตีตารางลงสมุด เอาด้ายกับไม้บรรทัดทาบขอบหย่อมใสทุกเจ็ดวัน เทียบกับที่จำได้ว่าของโนวัลลามไปถึงไหนเมื่อไร ของ{name}ช้ากว่าเกือบครึ่ง สมุดบอกว่ายังมีเวลา สมุดไม่ได้บอกว่าเวลานั้นจะจบตรงไหน

        {name}ทำงานต่อเต็มกะ เพราะตัวเลขบอกว่าทำได้ ทุกคืนก่อนนอนเปิดตารางดู ช่องว่างที่ยังไม่ได้กรอกยาวไปถึงท้ายเล่ม
      effects: { gold: 3, stats: { INT: 1 }, flags: [worked_on_through_the_glass, charted_the_spread] }

- id: adult.arc_glass_3_two_fingers
  stage: adult
  scene: home
  weight: 30
  arc: { id: glass, step: 3 }
  text: |
    เช้าวันหนึ่ง{name}ตื่นมาแล้วกำมือได้ไม่หมด นิ้วนางกับนิ้วก้อยข้างที่เป็นแก้วเหยียดตรงอยู่อย่างนั้น ไม่เจ็บ ไม่ชา งอไม่ลงเท่านั้นเอง ข้อนิ้วสองข้อใสจนเห็นแสงฟ้าเต้นช้าๆ อยู่ตรงที่เคยมีกระดูก หรือยังมีอยู่ {name}บอกไม่ได้

    อีกสามนิ้วยังงอได้ จับโหลได้ ถือช้อนได้ ผูกเชือกรองเท้าได้ช้ากว่าเดิม คนแถวโรงกลั่นรู้กันว่าสองนิ้วแรกคือที่ที่คนส่วนใหญ่ต้องเลือก บางคนเลือกตรงนี้ บางคนเลยไปจนถึงข้อศอก บางคนไม่เลือกอะไรเลยจนวันที่เกวียนคลุมผ้าใบมาจอดหน้าบ้าน

    ข่าวไปถึงที่ทำงานก่อนเที่ยง หัวหน้าส่งเด็กวิ่งมาบอกว่ามือแบบนี้ยังทำงานห้องมืดได้อีกหลายปี ค่าแรงขึ้นอีกขั้น ข่าวเดียวกันไปถึงหูคนอื่นด้วย พอค่ำ ที่โรงเตี๊ยมท้ายย่าน มีคนจ่ายค่าเหล้าให้{name}โดยไม่บอกชื่อ ถามคำเดียวว่าคนผิวแก้วเห็นในที่มืดได้จริงหรือ และจริงหรือที่บางคืนเห็นไกลกว่าคืนนั้น
  choices:
    - id: stop_here
      label: หยุดตรงนี้ เลิกงานที่มีน้ำค้างดาวตั้งแต่วันนี้
      text: |
        {name}ไม่ได้กลับไปเอาของที่ห้องมืด ให้เด็กที่วิ่งมาบอกข่าวเอาผ้ากันเปื้อนไปคืนแทน เดือนแรกนอนไม่หลับ ไม่ใช่เพราะเงิน เพราะห้องนอนมืดไม่พอ ตาที่ชินกับห้องมืดเห็นทุกอย่างในห้องชัดจนข่มตาไม่ลง

        สองนิ้วนั้นเหยียดตรงไปตลอดชีวิต เวลาวางมือบนโต๊ะ นิ้วนางกับนิ้วก้อยวางแนบกันเหมือนไม้บรรทัดสองอัน {name}หัดถือถ้วยด้วยสามนิ้วจนไม่หก หัดผูกปมด้วยมืออีกข้าง แสงฟ้าใต้ข้อนิ้วยังเต้นอยู่ ช้าลงทุกปี
      effects: { gold: -3, stats: { WIS: 1 }, flags: [stopped_at_two_fingers] }
    - id: go_on
      label: กลับไปทำงานพรุ่งนี้ รับค่าแรงขั้นใหม่
      text: |
        {name}เปลี่ยนผ้าพันมือเป็นถุงมือหนังที่ตัดนิ้วนางกับนิ้วก้อยออก ให้สองนิ้วนั้นเหยียดอยู่ข้างนอก ในห้องมืด สองนิ้วนั้นเรืองแสงจางๆ พอให้อ่านขีดบนโหลได้โดยไม่ต้องยกขึ้นส่อง หัวหน้าบอกว่าไม่เคยมีใครทำงานคล่องขึ้นเพราะนิ้วงอไม่ได้

        ปลายปีหย่อมใสขึ้นไปถึงกลางแขน ค่าแรงขึ้นไปอีกขั้น วันรับเงิน{name}นับเหรียญด้วยสามนิ้ว ช้าแต่ไม่เคยผิด
      effects: { gold: 5, flags: [works_glass_to_the_elbow] }
    - id: sell_the_seeing
      label: ตามชายที่จ่ายค่าเหล้าไปดูว่างานที่เขาว่าคืออะไร
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          งานของเขาคือเรือขนของที่ล่องตอนกลางคืนโดยไม่จุดตะเกียง {name}นั่งหัวเรือ บอกคนถือหางเสือว่าตอไม้อยู่ทางไหน ตลิ่งโค้งตรงไหน ค่าแรงคืนเดียวเท่ากับห้องมืดสามคืน

          คืนที่สี่ก่อนถึงคุ้งน้ำ {name}บอกให้หยุดเรือ ไม่รู้ว่าทำไม รู้แค่ว่าต้องหยุด คนถือหางเสือหยุด พ้นคุ้งไปเป็นซุงทั้งต้นที่เพิ่งพังลงมาจากตลิ่ง ขวางแม่น้ำอยู่ครึ่งสาย ชายที่จ่ายค่าเหล้าไม่ถามว่า{name}เห็นได้อย่างไร เขาจ่ายเพิ่มให้หนึ่งเหรียญ แล้วบอกว่าพรุ่งนี้มาอีก
        effects: { gold: 4, stats: { WIS: 1 }, flags: [sells_what_the_glass_sees] }
      failure:
        text: |
          งานของเขาคือนั่งหลังม่านในบ่อนลูกเต๋าที่ไม่จุดไฟ ดูมือคนที่นั่งรอบโต๊ะแล้วเคาะผนังตามที่ตกลงกัน {name}เห็นทุกมือ แต่ไม่รู้ว่าควรเคาะตอนไหน เคาะช้าไปสองครั้ง เร็วไปหนึ่งครั้ง

          ชายคนนั้นจ่ายเหรียญเดียว บอกว่าตาดี แต่ยังไม่รู้จักใช้ แล้วบอกว่าจะมาตามอีก {name}เดินกลับบ้านตอนตีสาม ตรอกมืดสนิท เห็นทุกก้อนหินบนทาง และเห็นตรงหัวมุมข้างหน้ามีแมวตัวหนึ่ง ก่อนที่แมวตัวนั้นจะเดินออกมา
        effects: { gold: 1, flags: [sells_what_the_glass_sees] }
    - id: brenik_offers_nights
      label: รับงานคัดโหลกะดึกที่เบรนิกเสนอ งานที่ไม่ต้องใช้สองนิ้วนั้น
      requires: { flag: works_at_institute_stillroom }
      text: |
        เบรนิกบอกว่าคนอ่านโหลไม่ต้องใช้นิ้วนางกับนิ้วก้อย ต้องใช้ตา ตาของ{name}ดีกว่าตาของใครในห้องกลั่นทุกคน รวมทั้งของเขาเอง เขาให้{name}นั่งเก้าอี้ตัวเดียวในห้อง ตัวที่เขาเคยนั่ง

        ค่าแรงกะนั้นสูงที่สุดของห้องกลั่น สูงกว่าที่สมาคมโรงกลั่นจ่ายหัวหน้ากะ {name}อ่านโหลได้คืนละหลายร้อยใบ จดเลขด้วยมือที่เหลือสามนิ้ว ปลายปีหย่อมใสขึ้นไปถึงกลางแขน เบรนิกเดินผ่านมาดูทุกคืน ไม่เคยพูดถึงแขน
      effects: { gold: 4, stats: { INT: 1 }, flags: [works_glass_to_the_elbow, took_brenik_chair] }
    - id: sell_the_notebook
      label: เลิกงาน แล้วเอาสมุดที่จดเรื่องผิวตัวเองไปขายให้สถาบัน
      requires: { flag: school_distill }
      text: |
        สถาบันเวทหลวงรับซื้อสมุดจดของนักเวทที่ยังมีชีวิต นักเวทอาวุโสคนหนึ่งเปิดสมุดของ{name}อ่านอยู่ครึ่งบ่ายโดยไม่เงยหน้า แล้วจ่ายสามเหรียญ บอกว่าถ้ามีเล่มต่อให้เอามาขายที่โต๊ะนี้

        {name}เลิกแตะน้ำค้างดาวตั้งแต่วันนั้น แต่ยังจดต่อ เล่มใหม่มีแต่เรื่องสองนิ้วที่ไม่ยอมงอ แสงข้างใต้ที่เต้นช้าลง วันไหนช้ากว่าเดิม วันไหนเท่าเดิม ไม่มีวันไหนเร็วขึ้นอีก
      effects: { gold: 3, stats: { INT: 1 }, flags: [stopped_at_two_fingers, sold_the_glass_notebook] }

# ===================== seal_secret ความลับของผนึก =====================

- id: adult.arc_seal_secret_1_the_box
  stage: adult
  scene: home
  weight: 46
  arc: { id: seal_secret, step: 1 }
  when:
    age: [28, 56]
    any_flags: [job_wardens, job_fort_priest, warden_runner, path_wardens, mapped_sealed_pit, sealed_stone_36, tried_one_night_at_fort, drove_the_wardens_oil, kept_a_wardens_box, read_the_wardens_seal, warned_the_fort_of_the_shaft]
  text: |
    หีบไม้ใบเล็กมากับขบวนถ่านขาลง จ่าหน้าถึง{name} ผู้ส่งเป็นหญิงที่{name}ไม่รู้จัก เขียนจดหมายแนบมาสองบรรทัด พี่ชายของนาง ไบรอส ผู้นับหินของป้อมเจ็ด ตายที่ป้อมเมื่อหน้าหนาวที่แล้ว ภาคีส่งข้าวของกลับมาให้ทางบ้าน ในหีบมีห่อหนึ่งที่เขาเขียนชื่อ{name}ไว้บนผ้าห่อ นางไม่ได้เปิด

    {name}จำไบรอสได้ลางๆ ชายเตี้ยไหล่หนา เคยแบ่งน้ำร้อนให้ครั้งหนึ่งที่แนวหิน หรือแบ่งไฟ จำไม่ได้แน่ เขาคงจำ{name}ได้ดีกว่านั้น

    ในห่อผ้าเป็นสมุดเล่มบาง ปกหนังแกะ เล็กพอใส่กระเป๋าเสื้อ ทุกหน้าตีเส้นเป็นช่องด้วยมือ ช่องซ้ายเป็นเลขก้อน ไม่มีเลขไหนเกินร้อยสิบสอง ช่องกลางเป็นปี ช่องขวาเป็นความยาว นับเป็นข้อนิ้ว หน้าแรกไม่มีชื่อเรื่อง มีคำเดียว ร้าว

    ใครที่เคยขึ้นไปถึงแนวหินก็รู้ว่าสมุดที่ภาคีส่งให้ราชสำนักทุกปีเขียนว่าครบและนิ่งทุกบรรทัด เล่มในมือ{name}ไม่ใช่เล่มนั้น
  choices:
    - id: read_it
      label: นั่งอ่านทีละช่องจนกว่าจะเข้าใจว่าเขาจดอะไร
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}อ่านจนน้ำมันตะเกียงหมดไปครึ่งขวด ไบรอสจดสิบหกก้อน ก้อนละหน้า บางหน้ามีบรรทัดเดียว บางหน้าเต็มทั้งสองด้าน ลายมือต้นเล่มเล็กและมั่นคง ท้ายเล่มใหญ่ขึ้น ห่างขึ้น แบบคนที่ตาเริ่มไม่ดีแล้วยังไม่ยอมใช้แว่น

          ทุกหน้าที่มีบรรทัดมากกว่าหนึ่ง ตัวเลขในช่องขวาไม่เคยน้อยลงสักครั้ง {name}ปิดสมุด วางไว้บนโต๊ะ ตะเกียงดับไปเอง {name}ยังนั่งอยู่ในความมืดกับสมุดเล่มนั้นจนไก่ขัน
        effects: { stats: { INT: 1 }, flags: [holds_a_crack_book, read_the_crack_book] }
      failure:
        text: |
          ลายมือของไบรอสอ่านยากกว่าที่คิด เลขเจ็ดกับเลขหนึ่งของเขาหน้าตาเหมือนกัน เลขสามกับเลขแปดก็เหมือน {name}อ่านได้แค่ว่าทุกครั้งที่มีบรรทัดใหม่ ตัวเลขในช่องขวาจะมากขึ้น ไม่เคยน้อยลง

          {name}ห่อผ้ากลับคืนตามเดิม เก็บไว้ในหีบใต้เตียง คืนนั้นฝันว่านั่งนับก้อนหินที่ไม่มีวันนับจบ ตื่นมาจำได้แค่ว่าก้อนสุดท้ายอุ่น
        effects: { flags: [holds_a_crack_book, could_not_read_his_hand] }
    - id: keep_it_shut
      label: ห่อผ้ากลับคืน เก็บไว้ก้นหีบ ไม่เปิดอ่านอีก
      text: |
        {name}ผูกปมผ้าห่อแน่นกว่าที่ไบรอสผูกมา วางไว้ก้นหีบไม้ใบที่เก็บเอกสารบ้าน ใต้ใบเกิด ใต้ใบเช่า ใต้จดหมายเก่าทุกฉบับ

        ไม่มีใครในบ้านรู้ว่ามีอะไรอยู่ตรงนั้น บางคืน{name}ตื่นมาคิดถึงคำเดียวบนหน้าแรก แล้วนอนต่อ หีบใบนั้นไม่หนักขึ้น แต่ทุกครั้งที่ยกย้ายที่ {name}ยกเองคนเดียว
      effects: { stats: { WIS: 1 }, flags: [holds_a_crack_book, kept_it_wrapped] }
    - id: burn_it
      label: เผามันในเตาทีละหน้า
      text: |
        กระดาษไหม้เร็ว ตัวเลขม้วนดำก่อนตัวกระดาษ ปกหนังแกะไหม้ช้ากว่าที่คิด ส่งกลิ่นเหมือนเนื้อย่างที่ลืมไว้บนเตา {name}ต้องเอาคีมพลิกอยู่ครึ่งชั่วโมงกว่าจะเหลือแต่ขี้เถ้า

        เช้าวันต่อมา{name}เขียนจดหมายถึงน้องสาวของไบรอส บอกว่าได้รับแล้ว ขอบใจ ไม่บอกว่าในห่อมีอะไร เถ้าในเตา{name}กวาดไปโรยโคนต้นมะนาวหลังบ้าน ต้นนั้นออกลูกดกกว่าทุกปี ไม่มีอะไรมากกว่านั้น
      effects: { arc: { id: seal_secret, close: true }, flags: [burned_the_crack_book] }
    - id: give_it_up
      label: เอาขึ้นไปคืนผู้เฒ่าของป้อมเจ็ดด้วยมือตัวเอง โดยไม่เปิดอ่าน
      text: |
        ขบวนถ่านขาขึ้นพา{name}ไปถึงสถานีสุดท้าย เดินต่ออีกสองวันถึงป้อมเจ็ด ผู้เฒ่าของป้อมเป็นหญิงผมสั้นเกรียน แขนข้างหนึ่งพันผ้าถึงข้อศอก นางรับห่อผ้าไป ดูชื่อที่ไบรอสเขียนไว้บนผ้า แล้วถามว่าเปิดหรือยัง {name}บอกว่ายัง

        นางเก็บห่อเข้าในเสื้อคลุมโดยไม่แกะ ขอบใจหนึ่งครั้ง แล้วให้{name}กินข้าวของป้อมหนึ่งมื้อก่อนลงเขา ข้าวต้มใส่เกลือ กับหัวหอมดิบหนึ่งหัว ตอนลงเขา{name}หันกลับไปดูครั้งเดียว นางเดินกลับเข้าแนวหินไปแล้ว
      effects: { gold: -2, reputation: { wardens: 1 }, arc: { id: seal_secret, close: true }, flags: [gave_the_crack_book_up] }
    - id: set_it_beside_the_count
      label: เทียบกับสมุดนับหินของป้อมที่ตัวเองเคยลงชื่อ ทีละปี
      requires: { flag: job_wardens }
      text: |
        {name}จำสมุดนับหินของป้อมตัวเองได้แม่นกว่าจำหน้าคน ลายมือหลายคน คำเดิมทุกบรรทัด ครบและนิ่ง ครบและนิ่ง ปีละหนึ่งหน้า {name}ไล่ปีในเล่มของไบรอสทีละปี เทียบกับที่จำได้ คนละป้อม คนละก้อน แต่ปีเดียวกัน

        ปีที่ไบรอสเขียนว่าร้าวยาวขึ้นสองข้อนิ้ว ปีนั้นทั้งเจ็ดป้อมส่งคำเดียวกันขึ้นไปให้ราชสำนัก {name}ไม่รู้ว่าป้อมเจ็ดปีนั้นใครเป็นคนลงชื่อ รู้แค่ว่าไบรอสลงชื่อในสองเล่ม
      effects: { stats: { WIS: 1 }, flags: [holds_a_crack_book, compared_with_the_count_book] }

- id: adult.arc_seal_secret_2_the_second_book
  stage: adult
  scene: tavern
  weight: 30
  arc: { id: seal_secret, step: 2 }
  text: |
    หลายปีที่สมุดของไบรอสอยู่กับ{name} ไม่มีใครถามถึง จนเย็นวันหนึ่งที่โรงเตี๊ยม ชายในเสื้อคลุมขนแกะนั่งลงตรงข้าม สั่งเหล้าสองแก้วโดยไม่ถาม บอกชื่อว่าราเธน คนของเหมืองถ่านแห่งหนึ่งที่ยื่นขอใบอนุญาตขุดใกล้แนวหินมาหลายปีแล้วยังไม่มีผู้เฒ่าลงชื่อให้ครบ

    เขาวางสมุดเล่มหนึ่งลงบนโต๊ะ ปกผ้าเปื้อนเถ้า ข้างในตีช่องแบบเดียวกับเล่มของไบรอส ลายมือคนละคน เขาซื้อมาจากเมียม่ายของผู้นับหินคนหนึ่ง จ่ายไปเท่าไรไม่บอก เขาเปิดให้ดูหน้าเดียว เลขก้อนตรงกับหน้าหนึ่งในเล่มของไบรอส ปีเดียวกัน ความยาวไม่ตรงกัน ห่างกันเกือบเท่าตัว

    ราเธนบอกว่าเขาไม่ต้องการสมุด ต้องการตัวเลขตัวเดียว ผลหาร เหมืองจะได้รู้ว่าควรขุดเร็วแค่ไหน หรือควรเลิกรอใบอนุญาตแล้วไปขุดที่อื่น ใครบอกเขาได้ เขาจ่ายดี เขารู้ว่าสมุดของไบรอสอยู่กับใคร เพราะน้องสาวของไบรอสพูดมากกว่าที่ควร
  choices:
    - id: swap_for_a_night
      label: แลกสมุดกันยืมคนละคืน แล้วคัดเล่มของเขาให้ทันก่อนเช้า
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}คัดทุกช่องใต้ตะเกียงจนใกล้รุ่ง ลายมือของผู้นับหินคนนั้นอ่านง่ายกว่าของไบรอส ตัวเลขเรียบร้อยเหมือนคนทำบัญชีร้าน ทุกบรรทัดที่คัด{name}อ่านทวนสองรอบ

          ตอนเช้าแลกสมุดคืนกันที่หน้าโรงเตี๊ยม เล่มของไบรอสกลับมามีรอยนิ้วโป้งเปื้อนฝุ่นถ่านอยู่ที่มุมหน้าหนึ่ง {name}ไม่รู้ว่าราเธนคัดไปกี่หน้า และราเธนก็ไม่รู้ว่า{name}คัดไปทั้งเล่ม
        effects: { stats: { INT: 1 }, flags: [copied_the_second_book] }
      failure:
        text: |
          ครึ่งคืนแรก{name}คัดได้ดี ครึ่งคืนหลังตาเริ่มพร่า ช่องกลางกับช่องขวาสลับกันโดยไม่รู้ตัวอยู่หลายหน้า กว่าจะเห็นฟ้าก็สางแล้ว ไม่มีเวลาคัดใหม่

          ตอนแลกสมุดคืน ราเธนดูตาแดงของ{name}แล้วหัวเราะ บอกว่าเขาคัดเสร็จตั้งแต่เที่ยงคืนแล้วเข้านอน {name}ได้สำเนาที่ต้องนั่งแก้อีกหลายเดือน และนอนไม่หลับไปอีกสองคืน
        effects: { hp: -1, flags: [copied_the_second_book, copied_in_haste] }
    - id: sell_a_page
      label: ฉีกขายหน้าเดียว หน้าที่เขาชี้
      text: |
        ราเธนเปิดเล่มของไบรอสไล่ช้าๆ แล้วชี้หน้าหนึ่ง หน้าที่เต็มทั้งสองด้าน ตัวเลขช่องขวาใหญ่ที่สุดในเล่ม {name}ฉีกออกตามแนวเย็บ ราเธนพับใส่อกเสื้อ วางเหรียญเงินสี่เหรียญบนโต๊ะ จ่ายค่าเหล้าให้อีกแก้ว แล้วลุกไป

        คืนนั้น{name}เปิดเล่มของไบรอสดู ตรงที่หน้านั้นเคยอยู่เหลือแต่ตอกระดาษสั้นๆ ติดแนวเย็บ ลายมือของไบรอสหน้าถัดไปเริ่มกลางประโยค
      effects: { gold: 4, flags: [sold_a_page_of_the_book] }
    - id: keep_them_apart
      label: ไม่ให้ดู ไม่ขอดู จ่ายค่าเหล้าแก้วของตัวเองแล้วลุก
      text: |
        ราเธนไม่โกรธ เขาเก็บสมุดใส่ย่าม บอกว่าเขาอยู่โรงเตี๊ยมนี้ทุกคืนแรกของเดือน ถ้าเปลี่ยนใจ แล้วดื่มเหล้าแก้วที่สั่งเผื่อ{name}เอง

        {name}เดินกลับบ้านทางที่ไม่ผ่านโรงเตี๊ยมนั้นมาหลายเดือน รู้ว่ามีอีกเล่มอยู่ในโลก ตัวเลขไม่ตรงกับเล่มของไบรอส และรู้ว่าตัวเองจะไม่มีวันรู้ว่าเล่มไหนผิด หรือผิดทั้งสองเล่ม
      effects: { stats: { WIS: 1 }, flags: [kept_the_books_apart] }
    - id: remember_the_page
      label: ใช้เวทจำหน้ากระดาษที่เขาเปิดค้างไว้ ขณะเขาลุกไปเติมเหล้า
      requires: { class: wizard }
      text: |
        เวทจำหน้ากระดาษเป็นเวทแรกๆ ที่นักเวทหัดกัน หัดเพื่อสอบ ไม่เคยคิดว่าจะได้ใช้กับเรื่องแบบนี้ ราเธนลุกไปที่โต๊ะยาวของเจ้าของร้าน {name}วางนิ้วบนขอบสมุดของเขา หลับตาหนึ่งลมหายใจ หน้านั้นเข้าไปอยู่ในหัวทั้งหน้า ทุกเส้นที่ตีช่อง ทุกรอยหมึกเลอะ

        พอเขากลับมา{name}บอกว่าต้องไปแล้ว คืนนั้นเขียนหน้าที่จำได้ลงกระดาษก่อนเวทจะจาง ได้หน้าเดียว แต่เป็นหน้าเดียวกับที่ตรงกับเล่มของไบรอส หน้าที่ตัวเลขห่างกันเกือบเท่าตัว
      effects: { stats: { INT: 1 }, alignment: { law: -1 }, flags: [copied_the_second_book, copied_by_spell] }

- id: adult.arc_seal_secret_3_the_slate
  stage: adult
  scene: home
  time: night
  weight: 30
  arc: { id: seal_secret, step: 3 }
  text: |
    คืนหนึ่งหลังไฟทุกบ้านในซอยดับ {name}เอากระดานชนวนกับดินสอหินออกมาวางบนโต๊ะ เปิดสมุดของไบรอสไว้ทางซ้าย ถ้ามีหน้าที่คัดจากเล่มอื่นก็วางไว้ทางขวา แล้วเริ่มหาร

    ไม่ยากอย่างที่กลัวมาหลายปี เอาความยาวที่รอยร้าวเพิ่มขึ้นมาบวกกัน หารด้วยจำนวนปี ได้ว่าหินร้าวเร็วแค่ไหนในหนึ่งปี แล้วเอาไปหารระยะที่เหลือก่อนรอยร้าวจะวิ่งถึงขอบหิน ระยะที่ไบรอสจดไว้ด้านในปกหลัง ตัวเล็กกว่าตัวอื่นในเล่ม

    {name}หารสองรอบ รอบที่สองช้ากว่ารอบแรก ได้เท่าเดิม เลขตัวนั้นอยู่บนกระดานชนวน ขาวบนดำ ใต้แสงตะเกียง ไม่ยาว เขียนด้วยมือเดียวได้สบาย ข้างนอกหมาเห่าสองที แล้วซอยก็กลับไปเงียบ

    {name}นั่งอยู่กับเลขตัวนั้นจนเปลวตะเกียงเริ่มสั่น
  choices:
    - id: to_the_forts
      label: ห่อกระดานด้วยผ้าไม่ให้เลขลบ แล้วเอาขึ้นไปให้ผู้เฒ่าที่ป้อมดู
      text: |
        ผู้เฒ่ารับกระดานไปวางบนเข่า แกะผ้าออก ดูเลขตัวนั้นครู่เดียว แล้วบอกว่าเคยเห็นเลขแบบนี้มาก่อน ไม่ใช่เลขแรก และไม่ตรงกับเลขไหนเลยที่เคยมีคนเอามาให้ดู บางตัวมากกว่า บางตัวน้อยกว่ามาก

        นางขอบใจ ให้{name}กินข้าวของป้อมหนึ่งมื้อ แล้วเก็บกระดานไว้ ไม่คืน {name}เดินลงเขามือเปล่า เลขตัวนั้นยังอยู่ในหัวครบทุกหลัก ผู้เฒ่าคงจะวางกระดานไว้ที่ไหนสักแห่ง ข้างกระดานแผ่นอื่นที่คนอื่นเอามาให้
      effects: { gold: -2, reputation: { wardens: 1 }, flags: [told_the_seal_years, told_the_seal_years_to_the_forts] }
    - id: to_the_crown
      label: คัดเลขลงกระดาษ เขียนจดหมายถึงสำนักราชเลขาที่เมืองหลวง
      text: |
        {name}เขียนจดหมายสามรอบจึงพอใจ รอบแรกยาวเกินไป รอบที่สองกลัวเกินไป รอบที่สามบอกแค่ว่าตัวเลขมาจากไหน หารอย่างไร และได้เท่าไร ปิดผนึกด้วยขี้ผึ้งเทียน แล้วจ่ายค่าส่งด่วนไปกับถุงจดหมายของหลวง

        ครึ่งปีต่อมามีซองตอบกลับ กระดาษหนา ตราประทับของสำนักราชเลขา ข้างในมีบรรทัดเดียว ได้รับเรื่องแล้ว ไม่มีชื่อคนเขียน ไม่มีเลขที่เรื่อง {name}ตอกตะปูแขวนซองนั้นไว้ข้างประตู ทุกครั้งที่ลมเข้า ซองจะกระพือหนึ่งที
      effects: { gold: -1, alignment: { law: 1 }, flags: [told_the_seal_years, told_the_seal_years_to_the_crown] }
    - id: to_the_news
      label: เอาเลขไปให้คนเดินข่าวที่ถือป้ายทองเหลือง
      text: |
        คนเดินข่าวฟังจบแล้วจ่ายสองเหรียญ ใบข่าวสัปดาห์ต่อมาพิมพ์เลขตัวนั้นตัวโตกลางหน้า ไม่มีชื่อ{name} ไม่มีชื่อไบรอส ตลาดอ่านแล้วเงียบไปครึ่งวัน

        สัปดาห์ถัดมาใบข่าวอีกเจ้าหนึ่งพิมพ์เลขอีกตัว มาจากสมุดอีกเล่มของใครก็ไม่รู้ มากกว่าของ{name}หลายเท่า เดือนต่อมามีเลขตัวที่สาม ตลาดเลิกเงียบ หันมาเถียงกันว่าเลขไหนจริง จนได้ข้อสรุปว่าไม่มีเลขไหนจริงสักตัว {name}ได้ยินคนขายผักบอกลูกค้าว่าผนึกจะอยู่นานกว่าหนี้ของเขา แล้วหัวเราะกันทั้งแผง
      effects: { gold: 2, flags: [told_the_seal_years, told_the_seal_years_to_the_news] }
    - id: wipe_it
      label: เอาแขนเสื้อลบกระดานจนดำสนิท แล้วเก็บสมุดคืนที่เดิม
      text: |
        แขนเสื้อปาดสองที เลขตัวนั้นหายไปจากกระดาน เหลือแต่ฝุ่นขาวติดผ้า {name}เก็บสมุดลงหีบ เก็บกระดานไว้หลังตู้ ดับตะเกียง แล้วนอน

        เช้าวันต่อมา{name}ซักเสื้อตัวนั้นเอง ขยี้แขนเสื้อจนน้ำขุ่น ตากแดดจนแห้ง เส้นขาวจางๆ ยังติดอยู่ที่ปลายแขน ซักกี่ครั้งก็ไม่ออก {name}ใส่เสื้อตัวนั้นต่อไปตามปกติ ไม่มีใครถามถึงรอยนั้น
      effects: { stats: { WIS: 1 }, flags: [kept_the_seal_years] }
    - id: walk_it_yourself
      label: เขียนข่าวเอง พิมพ์เอง แล้วเดินแจกด้วยมือตัวเอง
      requires: { flag: job_news_walker }
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}เขียนให้สั้นที่สุด บอกที่มา บอกวิธีหาร บอกเลข และบอกด้วยว่าสมุดเล่มอื่นจะได้เลขอื่น สำนักตรวจหนังสือผ่านให้เพราะทุกบรรทัดจริง ไม่มีบรรทัดไหนชี้ว่าใครโกหก

          {name}เดินแจกตั้งแต่ตลาดเช้าจนถึงท่าเกวียน คนอ่านแล้วถามกลับ {name}ตอบทุกคำถามที่ตอบได้ คำถามที่ตอบไม่ได้บอกว่าไม่รู้ ใบข่าวฉบับนั้นมีคนเก็บไว้มากกว่าทุกฉบับที่{name}เคยเดิน
        effects: { stats: { CHA: 1 }, flags: [told_the_seal_years, told_the_seal_years_to_the_news] }
      failure:
        text: |
          สำนักตรวจหนังสือไม่ผ่านให้ ไม่บอกเหตุผล ยึดใบที่พิมพ์ไว้ไปทั้งปึก แล้วปรับสามเหรียญฐานพิมพ์ก่อนส่งตรวจ {name}ยังเหลือใบที่ซ่อนไว้ในย่ามสิบกว่าใบ

          สิบกว่าใบนั้น{name}แจกเองทั้งหมดในคืนเดียว ให้คนที่รู้จักชื่อ ทีละคน มือต่อมือ หลายปีต่อมายังมีคนเอาใบนั้นมาถาม{name}อยู่ กระดาษพับจนขาดตามรอยพับ
        effects: { gold: -3, flags: [told_the_seal_years, told_the_seal_years_to_the_news] }
