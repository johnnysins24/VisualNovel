# ชุด 3a วัยผู้ใหญ่ อายุ 19 ถึง 24: เหตุการณ์ประจำงานสายพรานและกวีเร่ งานละ 1 เรื่อง
# พรานอยู่ถิ่นเดิมหลังเลือกงาน (เวทพื้นถิ่นผูกกับบ้าน) ข้อความจึงต้องใช้ได้ทุกถิ่น ห้ามมีต้นไม้ในฉากที่อาจเป็นแดนเถ้า
# งานผจญภัยมาจากกระดานค่าหัวในโรงเตี๊ยมและกลุ่มที่มีอยู่แล้ว ไม่มีสมาคมนักผจญภัย (L18)

- id: adult.job_bounty_golem
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_bounty_hunter]
  text: |
    ประกาศค่าหัวแผ่นนั้นติดอยู่บนกระดานในโรงเตี๊ยมนานจนกระดาษเหลือง ค่าหัวสิบห้าเหรียญ เจ้าของเขียนเอง ลายมือคนแก่ โกดังเก่าของเขาปิดมาเจ็ดปีหลังไฟไหม้ ตอนนี้มีอะไรบางอย่างในนั้นเดินไปเดินมาทั้งคืน คนแถวนั้นนอนไม่หลับ

    {name}ไปซุ่มดูตั้งแต่หัวค่ำ เงาที่เดินอยู่ในโกดังสูงกว่าคนครึ่งตัว หนาเท่าตู้ เดินได้ทีละก้าว หนักจนพื้นไม้ลั่นทุกครั้ง เป็นหุ่นยามรุ่นเก่า แบบที่บ้านคนรวยตั้งไว้เฝ้าประตู

    มันแบกลังไม้ใบหนึ่งเดินจากกองลังที่ไหม้ดำไปวางไว้ที่ผนังด้านเหนือ แล้วเดินกลับไปแบกใบใหม่ ทำซ้ำไปเรื่อยๆ ผนังด้านเหนือไม่มีประตู มีแต่รอยอิฐที่ก่อปิดไว้ใหม่กว่าอิฐส่วนอื่น
  choices:
    - id: smash_it
      label: ถือขวานเข้าไปฟันข้อเข่ามันตรงๆ
      check: { stat: STR, dc: 14, foe: machine }
      success:
        text: |
          ขวานลงที่ข้อเข่าซ้ายสามครั้ง ครั้งที่สามเฟืองข้างในแตกกระจาย หุ่นยามทรุดลงข้างหนึ่ง ลังในมือหล่นลงพื้น มันยังพยายามคลานไปทางผนังด้านเหนือด้วยแขนข้างเดียว {name}ฟันข้อศอกมันอีกสองครั้งจนมันหยุด

          เจ้าของโกดังนับเหรียญจ่ายครบสิบห้าเหรียญ แล้วขอซากหุ่นไว้ขายเป็นเศษเหล็ก เขาไม่ถามว่ามันแบกลังไปทางไหน {name}ก็ไม่ได้เล่า
        effects: { stats: { STR: 1 }, gold: 15, flags: [broke_the_golem] }
      failure:
        text: |
          ขวานลงที่ข้อเข่าครั้งแรก มันไม่หยุดเดิน แต่หันมา มันวางลังลงช้าๆ ถูกที่ถูกทางเหมือนทุกใบ แล้วเหวี่ยงแขนทีเดียว {name}ลอยไปกระแทกกองลังไหม้ดำ ซี่โครงหักสองซี่

          มันไม่ตามมา มันหยิบลังใบเดิมขึ้นแบก แล้วเดินต่อไปที่ผนังด้านเหนือ {name}คลานออกมาทางหน้าต่าง ประกาศแผ่นนั้นยังอยู่บนกระดานจนสิ้นฤดู ค่าหัวขึ้นเป็นยี่สิบเหรียญ
        effects: { hp: -5, stats: { CON: 1 }, flags: [hurt_by_golem] }
    - id: pull_the_tube
      label: รอจังหวะมันหันหลัง ปีนขึ้นไปดึงหลอดคำสั่งออกจากอก
      check: { stat: DEX, dc: 13, foe: machine }
      success:
        text: |
          ทุกรอบที่มันก้มลงวางลังที่ผนังด้านเหนือ ช่องอกด้านหลังจะเปิดกว้างเท่าฝ่ามือ {name}รอสามรอบจนจำจังหวะได้ รอบที่สี่ก็ปีนขึ้นหลังมัน มือล้วงเข้าไปในอก หลอดแก้วอุ่นเหมือนไข่เพิ่งออกจากรัง ดึงทีเดียวหลุด

          หุ่นยามหยุดค้างอยู่ในท่าก้มวางลัง ไม่ล้ม ไม่ขยับ เจ้าของโกดังมาเห็นแล้วจ่ายให้สิบห้าเหรียญ ขอหลอดแก้วไปด้วย {name}ไม่ให้ หลอดแก้วนั้นยังอุ่นอยู่ในกระเป๋าเสื้อไปจนถึงเช้า
        effects: { stats: { DEX: 1 }, gold: 15, flags: [kept_golem_tube] }
      failure:
        text: |
          มันลุกขึ้นเร็วกว่าที่{name}นับไว้ครึ่งจังหวะ {name}ร่วงลงจากหลังมัน แขนซ้ายฟาดพื้น ข้อมือพลิกจนได้ยินเสียง หุ่นยามไม่สนใจ มันหยิบลังใบใหม่ เดินไปที่ผนังด้านเหนือเหมือนเดิม

          {name}พันข้อมือด้วยผ้าคาดหัว รออีกสองรอบ แล้วปีนขึ้นไปใหม่ด้วยมือข้างเดียว ดึงหลอดออกได้ในรอบที่สาม เจ้าของโกดังจ่ายค่าหัวครบ หักไปสองเหรียญเป็นค่าลังที่{name}ทำแตกตอนตก
        effects: { hp: -3, stats: { DEX: 1 }, gold: 13 }
    - id: open_the_wall
      label: ไปดูว่ามันพยายามแบกลังไปที่ไหน แล้วทุบอิฐผนังด้านเหนือออก
      check: { stat: WIS, dc: 12, foe: machine }
      success:
        text: |
          หลังอิฐที่ก่อปิดไว้เป็นประตูเหล็กเก่าบานหนึ่ง เปิดออกไปสู่ตรอกหลังโกดัง ประตูหนีไฟ เจ็ดปีก่อนตอนไฟไหม้ คำสั่งสุดท้ายที่ใครสักคนสั่งหุ่นยามคือให้ขนของทุกอย่างออกทางประตูนี้ หลังไฟดับเจ้าของก่อประตูปิดเพราะกลัวขโมย แต่ไม่มีใครบอกหุ่นยาม

          {name}ทุบอิฐออกจนหมด ผลักประตูให้เปิด หุ่นยามแบกลังเดินผ่านประตูออกไปวางในตรอก เดินกลับมาแบกใบต่อไป ใกล้สางลังใบสุดท้ายออกไป มันยืนนิ่งอยู่กลางตรอก แล้วไม่ขยับอีกเลย เจ้าของโกดังบ่นเรื่องผนังอยู่นานสองนาน แต่ก็จ่ายค่าหัวครบ
        effects: { stats: { WIS: 1 }, gold: 15, alignment: { moral: 1 }, flags: [finished_golems_order] }
      failure:
        text: |
          {name}ทุบอิฐออกได้สามก้อน หุ่นยามหยุดเดิน วางลังลง แล้วหันมา เสียงหึ่งต่ำๆ ดังออกมาจากอกมัน มันเดินมาหา{name}ทีละก้าว ไม่เร็ว แต่ไม่หยุด

          {name}หนีออกมาทางหน้าต่างทัน ไม่บาดเจ็บ แต่เสียค่าเครื่องมือที่ทิ้งไว้ในโกดังทั้งหมด วันรุ่งขึ้นเจ้าของโกดังจ้างคนอื่นมาฟันมันจนพัง ค่าหัวไปเป็นของคนนั้น
        effects: { stats: { WIS: 1 }, gold: -3 }

- id: adult.job_guide_cultists
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_guide]
  text: |
    ลูกค้าคราวนี้มีสามคน บอกว่าเป็นนักวิชาการจากเวนทราส อยากไปดูสนามรบเก่าสมัยสงครามจอมมาร ห่างออกไปสี่วันเดิน จ่ายดีกว่าลูกค้าทุกคนที่{name}เคยพา และจ่ายครบตั้งแต่วันแรก ไม่แบ่งครึ่ง

    คืนที่สองข้างกองไฟ{name}เห็นว่าทั้งสามคนสวมแหวนเหล็กดำวงเดียวกันที่นิ้วก้อย ทุกคืนก่อนนอนทั้งสามคนจะหันหน้าไปทางตะวันออก ทางเดียวกับที่ตอเสาของอัสเทลตั้งอยู่ แล้วนั่งนิ่ง มือวางบนพื้น เหมือนคนฟังเสียงจากใต้ดิน

    คนที่อายุมากที่สุดถามว่าในสนามรบเก่านั้น เกราะของกองทัพปีศาจยังเดินอยู่จริงไหม ถามเหมือนคนถามทางไปบ้านญาติ
  choices:
    - id: take_them
      label: พาไปให้ถึง ตามที่รับเงินมา
      text: |
        {name}พาทั้งสามคนไปถึงขอบสนามรบเก่าตอนบ่ายวันที่สี่ พื้นตรงนั้นเป็นเถ้าแข็งปนเศษเหล็ก มีรอยเท้าเดินเป็นแถวตรงหายไปในหมอก รอยเท้าใหม่ ทั้งที่ไม่มีใครเดินผ่านตรงนี้มาสามร้อยปี

        ทั้งสามคนขอบใจ แล้วบอกให้{name}กลับไปได้ เดินตามรอยเท้านั้นหายไปในหมอกเอง {name}เดินกลับคนเดียวสี่วัน คืนแรกฝันถึงเสียงทุ้มต่ำเรียกชื่อตัวเอง เสียงที่ไม่เคยได้ยินมาก่อน แต่ฟังแล้วคุ้นเหมือนเสียงคนในบ้าน
      effects: { gold: 6, world: { demon: 1 }, flags: [guided_ash_cult] }
    - id: walk_in_circles
      label: พาเดินวนในหมอกจนพวกเขาเลิก
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}พาเดินอ้อมเนินเดิมสามรอบในวันที่สาม หมอกช่วยไม่ให้ใครเห็นว่าเนินเดิม วันที่สี่บอกว่าทางข้างหน้าถล่ม ต้องอ้อมอีกเจ็ดวัน เสบียงไม่พอ คนอายุมากที่สุดจ้อง{name}เหมือนชั่งน้ำหนัก แล้วบอกว่ากลับก็ได้

          ระหว่างทางกลับเขาไม่พูดกับ{name}อีกเลย ถึงปลายทาง เขาขอเงินคืนครึ่งหนึ่ง {name}คืนให้ เขาหยิบเหรียญไปแล้วบอกว่าพวกเขาจำทางที่เดินมาได้ทุกก้าว ครั้งหน้าจะไม่ต้องจ้างใคร
        effects: { stats: { WIS: 1 }, gold: 3, alignment: { moral: 1 }, flags: [misled_ash_cult] }
      failure:
        text: |
          วันที่สามตอนวนรอบเนินเดิมเป็นรอบที่สอง คนอายุน้อยที่สุดในสามคนชี้ไปที่ก้อนหินที่ตัวเองวางทำเครื่องหมายไว้เมื่อเช้า ไม่มีใครเถียงกัน ไม่มีใครด่า คนอายุมากที่สุดแค่บอกให้{name}นั่งลง

          ตื่นมาตอนเช้า ทั้งสามคนหายไป เสบียงกับถุงเงินค่าจ้างของ{name}หายไปด้วย เหลือน้ำครึ่งกระบอกกับแหวนเหล็กดำวงหนึ่งวางไว้บนรองเท้า {name}เดินกลับสามวันโดยไม่มีอะไรกิน ไม่ได้หยิบแหวนวงนั้นไป
        effects: { hp: -3, stats: { CON: 1 }, flags: [misled_ash_cult, left_cult_ring] }
    - id: tell_wardens
      label: แวะป้อมผู้เฝ้าผนึกที่อยู่ใกล้ที่สุด บอกว่าพาใครมา
      text: |
        {name}พาอ้อมไปทางที่ผ่านป้อมผู้เฝ้าผนึก บอกลูกค้าว่าต้องแวะเติมน้ำ ระหว่างลูกค้านั่งพัก {name}ไปบอกหัวหน้าป้อมเรื่องแหวนเหล็กดำกับการนั่งฟังพื้น หัวหน้าป้อมฟังแล้วถอนหายใจ เหมือนคนได้ยินข่าวที่รอมานาน

        ผู้เฝ้าผนึกสี่คนเดินออกไปคุยกับลูกค้าทั้งสาม ไม่ได้จับใคร พาไปส่งที่ทางเกวียนกลับเวนทราส ลูกค้าทั้งสามขอเงินคืนแค่สองเหรียญ เป็นค่าวันที่ยังไม่ได้เดิน คนอายุมากที่สุดหันมามอง{name}ตอนขึ้นเกวียน ยิ้มเหมือนคนจำหน้าไว้
      effects: { reputation: { wardens: 1, ash_cult: -1 }, alignment: { law: 1 }, gold: 4, flags: [reported_ash_cult] }

- id: adult.job_scout_sealed
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_scout]
  text: |
    วันที่สิบสองของการเดินทำแผนที่ {name}เจอหลุมที่ไม่มีบนแผนที่ฉบับไหน ปากหลุมกว้างเท่าบ้านหลังหนึ่ง ข้างในลึกลงไปไม่ถึงสิบช่วงตัวก็เจอผนังหินก่อทับกันหนาเท่าแขน หินทุกก้อนสลักอักษรตัวเดียวกันซ้ำๆ เป็นอักษรที่{name}ไม่เคยเห็น

    ไออุ่นลอยขึ้นมาจากรอยต่อระหว่างหิน กลิ่นเหมือนเตาที่เพิ่งดับ หินก้อนบนสุดร้าว เศษปูนกองอยู่ข้างใต้ใหม่เหมือนเพิ่งร่วงเมื่อวาน

    คนที่จ้าง{name}มาจ่ายเงินตามจำนวนสิ่งที่อยู่บนแผนที่ ทุกลำธาร ทุกเนิน ทุกหลุม ส่วนแผนที่ที่ได้ จะไปอยู่ในมือใครต่อ ก็แล้วแต่คนจ่าย
  choices:
    - id: mark_it
      label: ลงหลุมนั้นในแผนที่ให้ครบตามที่รับจ้าง
      text: |
        {name}วัดปากหลุม วัดความลึก วาดผนังหินสลักลงในแผนที่ ลอกอักษรตัวนั้นไว้ที่ขอบกระดาษหนึ่งตัว แล้วส่งแผนที่ให้คนจ้างตามกำหนด คนจ้างจ่ายเพิ่มให้สามเหรียญสำหรับหลุมนั้นหลุมเดียว ถามว่ามีใครเห็นอีกไหม

        สองฤดูต่อมา {name}ได้ยินจากคนเกวียนว่าแถวนั้นมีคนงานเข้าไปตั้งค่ายแล้ว ค่ายใหญ่ มีเครื่องเจาะหิน
      effects: { gold: 5, alignment: { law: 1 }, world: { demon: 1 }, flags: [mapped_sealed_pit] }
    - id: leave_it_off
      label: ไม่ลงหลุมนั้นในแผนที่ แล้วลากหินมาปิดปากหลุมไว้
      check: { stat: STR, dc: 12 }
      success:
        text: |
          {name}ใช้เวลาทั้งวันลากหินมาปิดปากหลุม ซ้อนจนพื้นเรียบ แล้วโรยดินกลบให้เหมือนพื้นรอบข้าง พอตกค่ำ ไออุ่นยังลอดขึ้นมาตามรอยต่อหินได้ แต่บางลงจนต้องเอามือแนบพื้นถึงจะรู้

          แผนที่ที่ส่งให้คนจ้างมีเนินเตี้ยๆ เนินหนึ่งวาดไว้ตรงนั้น คนจ้างจ่ายค่าเนินตามราคาปกติ {name}จำได้ว่าเนินนั้นอยู่ห่างจากลำธารที่สามกี่ก้าว
        effects: { stats: { STR: 1 }, alignment: { moral: 1, law: -1 }, gold: 2, flags: [hid_sealed_pit] }
      failure:
        text: |
          หินก้อนที่สี่ที่{name}ลากมาหลุดมือ กลิ้งลงไปกระแทกผนังหินสลักข้างล่าง เสียงดังก้องขึ้นมาจากหลุม แล้วมีเสียงตอบจากข้างใต้ผนัง เสียงเคาะ สามครั้ง จังหวะเดียวกับที่หินกระแทก

          {name}ปิดปากหลุมจนเสร็จก่อนมืด มือสั่นตลอดเวลา แผนที่ที่ส่งไปไม่มีหลุมนั้น แต่{name}ยังได้ยินเสียงเคาะสามครั้งนั้นตอนเงียบๆ ไปอีกหลายเดือน
        effects: { hp: -1, stats: { WIS: 1 }, alignment: { moral: 1, law: -1 }, flags: [hid_sealed_pit, heard_the_knock] }
    - id: copy_the_letters
      label: ลอกอักษรบนหินทุกก้อนไว้ แล้วส่งให้คนที่อ่านได้
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ลอกอักษรลงผ้าด้วยถ่านจนครบทุกก้อน อักษรตัวเดียวกันซ้ำๆ แต่ทุกก้อนมีขีดเล็กๆ ต่างกันที่หาง {name}ห่อผ้านั้นส่งไปหอนับดาวกับคนเดินจดหมาย เขียนกำกับว่าเจอที่ไหน

          ฤดูต่อมามีจดหมายตอบกลับมา ลายมือยาวเอียงแบบเอลฟ์ บอกว่าอักษรตัวนั้นแปลว่าอย่า ส่วนขีดที่หางเป็นตัวเลข นับปีตั้งแต่วันที่ก่อ ก้อนสุดท้ายนับถึงปีนี้พอดี จดหมายไม่ได้บอกว่าแปลว่าอะไร ขอให้{name}ไปเล่าเรื่องนี้ที่หอนับดาวด้วยตัวเอง
        effects: { stats: { INT: 1 }, reputation: { star_hall: 1 }, flags: [copied_sealed_letters] }
      failure:
        text: |
          ถ่านในมือ{name}หักทุกครั้งที่กดลงบนผ้า ลอกได้ไม่ครบครึ่ง ตอนบ่ายหินก้อนบนสุดก็ร้าวเพิ่มอีกหนึ่งรอยต่อหน้าต่อตา {name}ห่อผ้าที่ลอกได้เก็บไว้ แล้วออกเดินต่อ ไม่ได้ส่งให้ใคร

          ผ้าผืนนั้นยังอยู่ในย่าม ทุกครั้งที่{name}คลี่ดูในแสงตะเกียง อักษรบนผ้าดูเหมือนขยับนิดหนึ่ง แต่ไม่เคยขยับตอนจ้องอยู่
        effects: { stats: { WIS: 1 }, flags: [half_copied_letters] }

- id: adult.job_troupe_inspector
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_troupe]
  text: |
    เรื่องที่คณะของมาริเดลเล่นทุกคืนชื่อว่าคืนที่เสาฟ้าหัก เล่าเรื่องผู้กล้าหกคนสู้กับจอมมาร ตัวจอมมารใส่เขาไม้ทาสีแดง พูดเสียงทุ้ม และมีบทพูดยาวที่สุดในเรื่อง คนดูชอบจอมมารมากกว่าผู้กล้า ทุกถิ่น

    คืนนั้นแถวหน้าสุดมีคนนั่งเก้าอี้ที่เขาเอามาเอง เสื้อคลุมขาวขลิบทอง ตะเกียงแขวนวางอยู่บนตัก เป็นผู้ตรวจของศาสนจักรตะเกียง มาริเดลกระซิบตอนแต่งหน้าว่าคณะนี้มีชื่ออยู่ในบัญชีของศาสนจักรมาสองปีแล้ว ข้อหาทำให้จอมมารน่ารัก

    มาริเดลให้{name}เลือกเอง บทพูดยาวของจอมมารในฉากที่สาม จะเล่นตามเดิม ตัดออก หรือเปลี่ยนเป็นอย่างอื่น
  choices:
    - id: play_it_straight
      label: เล่นบทเดิมทุกคำ ให้เต็มเสียงกว่าทุกคืน
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          ฉากที่สามคนดูเงียบจนได้ยินเสียงตะเกียงฟู่ บทพูดยาวของจอมมารจบลงที่ประโยคว่า ฟ้าของพวกเจ้าไม่ได้มีไว้ให้พวกเจ้า คนดูแถวหลังลุกขึ้นปรบมือก่อน แล้วลามมาถึงแถวหน้า เหลือแค่ผู้ตรวจที่นั่งนิ่งอยู่คนเดียว

          หลังเลิกเล่น ผู้ตรวจไม่ได้เขียนอะไร เขาเดินมาหลังเวที ถามว่าใครเขียนบทนั้น มาริเดลบอกว่าไม่มีใครเขียน เล่ากันต่อมาเป็นร้อยปีแล้ว เขาจดชื่อ{name}ไว้ แล้วเดินกลับ ตะเกียงในมือดับไปตอนเขาเดินลับมุม
        effects: { stats: { CHA: 1 }, reputation: { lamp_church: -1 }, flags: [played_demon_speech, troupe_inspected] }
      failure:
        text: |
          ครึ่งทางของบทพูดยาว {name}สบตากับผู้ตรวจที่แถวหน้า แล้วลืมประโยคถัดไปทั้งประโยค เงียบไปนานจนคนดูแถวหลังหัวเราะ {name}ร้องเพลงที่จำได้แทน เป็นเพลงกล่อมเด็ก คนดูหัวเราะหนักกว่าเดิม

          ผู้ตรวจลุกออกไปก่อนเรื่องจบ เช้าวันต่อมาคณะได้หนังสือค่าปรับเจ็ดเหรียญ ข้อหาเล่นเรื่องไม่เหมาะกับเด็ก มาริเดลจ่ายเอง แล้วบอก{name}ว่าคราวหน้าลืมบทให้ลืมเป็นเพลงรบ อย่าลืมเป็นเพลงกล่อมเด็ก
        effects: { stats: { WIS: 1 }, flags: [troupe_inspected, troupe_fined] }
    - id: cut_it
      label: ตัดบทพูดยาวออก เหลือแค่จอมมารล้มลงตาย
      text: |
        ฉากที่สามสั้นลงครึ่งหนึ่ง จอมมารออกมา ยืนหัวเราะ แล้วล้มลงตายด้วยดาบผู้กล้าเล่มแรกที่ฟันมา คนดูแถวหลังโห่ บางคนลุกกลับบ้านก่อนเรื่องจบ ผู้ตรวจจดบางอย่างลงสมุด แล้วยิ้มครั้งแรกตั้งแต่เขามานั่ง

        คืนนั้นคณะได้เงินจากหมวกน้อยที่สุดตั้งแต่ออกเดินทาง แต่ไม่มีหนังสือค่าปรับมาตอนเช้า ชื่อคณะยังอยู่ในบัญชีของศาสนจักรเหมือนเดิม ดึกคืนนั้นมาริเดลนั่งท่องบทพูดยาวคนเดียวหลังเกวียนจนจบทั้งบท เหมือนกลัวมันจะหลุดหายไปจากหัว
      effects: { alignment: { law: 1 }, reputation: { lamp_church: 1 }, gold: -1, flags: [cut_demon_speech] }
    - id: change_it
      label: เปลี่ยนบทพูดยาวกลางเวที ให้จอมมารพูดถึงตะเกียงแทน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}เปลี่ยนบทพูดยาวทีละประโยคบนเวที ให้จอมมารพูดว่ากลัวแสงตะเกียงที่สุด แสงตะเกียงทำให้เขาหนาว ทำให้มือสั่น ทำให้นึกถึงวันที่พ่ายแพ้ ทุกประโยคพูดกับตะเกียงที่วางอยู่บนตักผู้ตรวจ

          คนดูหัวเราะลั่นทั้งลาน ผู้ตรวจไม่หัวเราะ แต่ก็จะเขียนค่าปรับว่าอะไรไม่ได้ เพราะทุกประโยคเป็นการสรรเสริญเวรัส เขาลุกออกไปตอนเรื่องจบ เช้าวันต่อมาไม่มีหนังสือค่าปรับ คืนต่อมาคนดูมากกว่าทุกคืน ยืนกันไปจนถึงท้ายลาน
        effects: { stats: { INT: 1 }, gold: 3, flags: [mocked_the_lamp] }
      failure:
        text: |
          {name}เปลี่ยนบทพูดยาวกลางเวที แต่ประโยคที่สามเปลี่ยนแล้วเข้าทางผิด จอมมารพูดว่าแสงตะเกียงเหมือนแสงดาวดวงใหม่ เย็นเหมือนกัน หลอกตาเหมือนกัน คนดูไม่หัวเราะ ผู้ตรวจลุกขึ้นยืน

          คณะต้องออกจากถิ่นนั้นตั้งแต่ก่อนสาง ทิ้งค่าเช่าลานที่จ่ายไปแล้วสามคืน มาริเดลไม่ได้ว่าอะไร{name}สักคำ แต่ตลอดทางนางนั่งเกวียนคันหน้า ไม่ได้นั่งคันเดียวกับ{name}เหมือนทุกครั้ง
        effects: { stats: { WIS: 1 }, gold: -3, reputation: { lamp_church: -1 }, flags: [troupe_ran_at_night] }
    - id: play_with_own
      label: ถอดเขาไม้ทาสีแดงออก เล่นจอมมารด้วยเขาของตัวเอง
      requires: { trait: demon_mark }
      text: |
        {name}เล่นจอมมารมาตลอดตั้งแต่เข้าคณะ ใส่เขาไม้ทาสีแดงทับเขาจริง คนดูไม่เคยรู้ คืนนั้น{name}ถอดเขาไม้ออกหลังเวที เดินออกไปในฉากที่สามด้วยเขาของตัวเอง ไม่ได้ทาสี ไม่ได้ทำอะไร

        คนดูไม่รู้อยู่ดี ส่วนผู้ตรวจรู้ เขาลุกขึ้นครึ่งตัว แล้วนั่งลงใหม่ นั่งฟังบทพูดยาวทั้งบทจนจบ ไม่ได้จดอะไร หลังเรื่องจบเขาไม่ได้มาหลังเวที เช้าวันต่อมาเขาออกจากถิ่นไปพร้อมคณะเกวียนเกลือ บัญชีของศาสนจักรมีชื่อ{name}เพิ่มขึ้นมาหนึ่งชื่อ ส่วนคืนนั้นในหมวกมีเหรียญมากที่สุดตั้งแต่ออกเดินทาง
      effects: { stats: { CHA: 1 }, gold: 4, reputation: { lamp_church: -1 }, flags: [played_demon_with_own_horns, on_lamp_list] }

- id: adult.job_news_bought
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_news_walker]
  text: |
    ข่าวที่ทุกคนอยากฟังเดือนนั้นคือข่าวคนงานหยุดงาน คนงานโรงสีใหญ่ทั้งโรงไม่ไปทำงานมาเก้าวัน คนที่พาหยุดชื่อเฮเวลิน หญิงตัวเล็ก เสียงดัง นิ้วกลางข้างซ้ายขาดไปข้อหนึ่งเพราะเครื่องโม่

    คืนหนึ่งชายใส่เสื้อนอกดีผิดร้านเดินมาวางเหรียญสิบเหรียญไว้ข้างแก้วของ{name} บอกว่ามีข่าวใหม่ให้ร้อง ข่าวว่าเฮเวลินขโมยเงินกองกลางของคนงานไปซ่อน ร้องคืนนี้คืนเดียว ร้องที่นี่ร้านเดียว ที่เหลือข่าวจะเดินไปเอง

    {name}รู้ว่าเฮเวลินไม่ได้ขโมย เพราะเมื่อวานเห็นนางนับเงินกองกลางออกแจกค่าข้าวคนงานกลางลานต่อหน้าทุกคน
  choices:
    - id: sing_the_lie
      label: รับเหรียญ แล้วร้องข่าวนั้นคืนนี้
      text: |
        {name}ร้องข่าวนั้นเป็นข่าวที่สองของคืน ทำนองเดียวกับข่าวอื่น ไม่เน้นคำไหนเป็นพิเศษ คนในร้านฟังแล้วก็คุยกันต่อ ไม่มีใครลุกไปไหน ชายเสื้อนอกดีออกจากร้านไปก่อนข่าวจะจบ

        สามวันต่อมาข่าวนั้นไปถึงลานโรงสีก่อน{name}ไปถึงเสียอีก คนงานครึ่งหนึ่งกลับเข้าไปทำงาน เฮเวลินยืนอยู่กลางลานคนเดียวตอนเช้าวันที่สิบสอง ยังพูดเสียงดังเหมือนเดิม แต่ไม่มีใครยืนฟัง
      effects: { gold: 10, alignment: { moral: -2 }, flags: [sang_bought_news] }
    - id: sing_the_truth
      label: คืนเหรียญ แล้วร้องเรื่องคนที่มาจ่ายเงินแทน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}เลื่อนเหรียญคืนไปข้างแก้วของเขา แล้วลุกขึ้นร้องข่าวใหม่ทันที ข่าวว่าคืนนี้มีชายเสื้อนอกดีเอาเงินสิบเหรียญมาซื้อข่าวว่าเฮเวลินเป็นขโมย ร้องจบ เสียงคุยในร้านเงียบลงทีละโต๊ะจนถึงโต๊ะของเขา เขาลุกออกไปโดยไม่เก็บเหรียญ

          ข่าวนั้นเดินเร็วกว่าที่เขาจ่ายให้ข่าวไหนเดิน วันที่สิบสามเจ้าของโรงสียอมขึ้นค่าแรงหนึ่งในสิบ เฮเวลินมาที่ร้าน วางเหรียญสิบเหรียญที่ชายคนนั้นทิ้งไว้คืนให้{name} บอกว่าคนงานยกมือกันแล้ว ให้คนร้องข่าวเก็บไป
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, gold: 10, flags: [exposed_bought_news] }
      failure:
        text: |
          {name}ร้องข่าวคนซื้อข่าวได้ครึ่งเพลง เจ้าของร้านก็เดินมาดึงแขนลงจากเก้าอี้ บอกว่าร้านนี้อยู่ได้เพราะเจ้าของโรงสีเช่าห้องชั้นบนจัดเลี้ยงทุกเดือน ชายเสื้อนอกดีเก็บเหรียญคืนแล้วเดินออกไปช้าๆ

          {name}ไม่มีงานที่ร้านนั้นอีก ไปร้องข่าวเฮเวลินตามความจริงที่ลานหน้าโรงสีแทน ไม่เก็บเงินสักเหรียญ คนงานฟังจนจบ บางคนโยนขนมปังให้
        effects: { stats: { CON: 1 }, alignment: { moral: 1 }, gold: -2, flags: [exposed_bought_news, lost_tavern_job] }
    - id: sing_nothing
      label: รับเหรียญไว้ แต่ไม่ร้องข่าวไหนเกี่ยวกับโรงสีเลย
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          {name}ร้องข่าวอื่นห้าข่าวตามปกติ ไม่มีข่าวโรงสี ชายเสื้อนอกดีนั่งรอจนข่าวที่ห้าจบ แล้วเดินมาถามว่าข่าวที่จ่ายไว้อยู่ไหน {name}ตอบว่าวันนี้คนร้องเสียงไม่ดี ร้องได้แค่ห้าข่าว

          เขาจ้องหน้า{name}ครู่หนึ่ง แล้วหัวเราะออกมาเหมือนคนที่เพิ่งเสียพนันให้เด็ก เขาไม่ขอเหรียญคืน บอกว่าข่าวที่ไม่ได้ร้องก็เป็นข่าวที่ดีพอสำหรับเงินสิบเหรียญ
        effects: { stats: { WIS: 1 }, gold: 10, flags: [kept_bought_silence] }
      failure:
        text: |
          ชายเสื้อนอกดีมารอที่ประตูหลังร้านตอนเลิกงาน มีเพื่อนมาด้วยสองคน ตัวใหญ่ทั้งคู่ พวกเขาไม่พูดมาก เอาเหรียญสิบเหรียญคืนจากกระเป๋า{name}ไปได้ในครั้งเดียว และเอาเหรียญที่ลูกค้าโยนให้คืนนั้นไปด้วย

          {name}เดินกลับห้องเช่าโดยเอามือกุมซี่โครงข้างหนึ่งไว้ตลอดทาง ไม่ได้ร้องข่าวไปเจ็ดวัน เพราะร้องแล้วเจ็บ
        effects: { hp: -2, gold: -2, stats: { CON: 1 }, flags: [beaten_over_news] }

- id: adult.job_house_singer_feast
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_house_singer]
  text: |
    งานเลี้ยงคืนนั้นจัดฉลองวันเกิดเจ้าของบ้าน ท่านเฮดริค วาเรน ขุนนางในสภาราชสำนัก แขกมาแปดสิบคน {name}ร้องเพลงที่ระเบียงเหนือห้องโถง ร้องไปสามสิบเพลงก็ยังไม่มีใครฟังเกินท่อนแรก

    ตอนพักเสียง {name}ไปยืนดื่มน้ำหลังผ้าม่านที่ระเบียง ข้างล่างผ้าม่านคือห้องอ่านหนังสือ ท่านเฮดริคกำลังคุยกับชายเสื้อเทาเรียบ แหวนตาชั่งที่นิ้ว ท่านเฮดริคบอกว่าหนี้สองพันเหรียญ ถ้าธนาคารลบให้ เสียงของท่านในสภาก็เป็นของธนาคาร ในวันที่สภาต้องเลือกว่าใครจะได้นั่งบัลลังก์

    ลงบันไดมา{name}เจอนักบวชศาสนจักรตะเกียงคนหนึ่ง เป็นแขกในงาน เขายิ้มให้ แล้วถามเบาๆ ว่านักร้องได้ยินเพลงอะไรดีๆ จากห้องอ่านหนังสือบ้างไหม เขาจ่ายค่าเพลงดีกว่าท่านเฮดริค
  choices:
    - id: tell_the_lamp
      label: เล่าให้นักบวชตะเกียงฟังทุกคำ
      text: |
        {name}เล่าตามที่ได้ยิน นักบวชฟังแล้วยิ้มกว้างขึ้น ยัดเหรียญเงินสี่เหรียญใส่มือ{name} แล้วเดินกลับไปที่ห้องโถง ไปยืนข้างภรรยาท่านเฮดริค หัวเราะกับเรื่องที่นางเล่าเหมือนไม่มีอะไรเกิดขึ้น

        เดือนต่อมาท่านเฮดริคเลิกจัดงานเลี้ยงทุกงาน บ้านทั้งหลังเงียบลงจนพ่อบ้านต้องหางานอื่นให้{name} ร้องเพลงสวดตอนเช้าในห้องสวดของบ้าน ซึ่งท่านเฮดริคเข้ามานั่งฟังทุกเช้าแต่ไม่เคยเงยหน้า
      effects: { gold: 4, reputation: { lamp_church: 1, belek_bank: -1 }, alignment: { law: 1 }, flags: [sold_lord_to_lamp] }
    - id: say_nothing
      label: บอกว่าได้ยินแต่เพลงของตัวเอง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}บอกว่าคืนนี้เสียงตัวเองดังจนไม่ได้ยินอะไรอื่น แล้วชวนนักบวชคุยเรื่องเพลงสวดของวิหารเวรัสที่ไม่มีใครร้องได้ถึงเสียงสูงสุด นักบวชคุยด้วยจนเพลิน ลืมคำถามที่ถามไว้ หรือทำเป็นลืม

          สามวันต่อมาพ่อบ้านเรียก{name}ไปพบ ไม่ได้ว่าอะไร แค่บอกว่าท่านเฮดริคเห็นคนบนระเบียงคืนนั้นในกระจกห้องอ่านหนังสือ แล้วรู้ว่าคนคนนั้นไม่ได้บอกนักบวชสักคำ ค่าจ้างเดือนนี้ของ{name}ขึ้นเท่าตัว
        effects: { stats: { CHA: 1 }, gold: 6, reputation: { crown: 1 }, flags: [kept_lords_secret] }
      failure:
        text: |
          {name}บอกว่าไม่ได้ยินอะไร แต่ตอบช้าไปจังหวะหนึ่ง นักบวชยิ้มเหมือนเดิม บอกว่าไม่เป็นไร เพลงบางเพลงต้องฟังหลายรอบถึงจะจำได้ แล้วเดินจากไป

          ตั้งแต่คืนนั้นนักบวชคนนั้นมาทุกงานเลี้ยงของบ้าน นั่งโต๊ะที่ใกล้ระเบียงที่สุด ทุกครั้งที่{name}ร้องจบเพลง เขาจะยกแก้วขึ้นนิดหนึ่ง เหมือนคนที่รอฟังเพลงเพลงเดียวมาตลอด
        effects: { stats: { WIS: 1 }, flags: [lamp_priest_watches] }
    - id: hide_it_in_song
      label: ไม่บอกใคร แต่แต่งเรื่องนี้ซ่อนไว้ในเพลงที่ร้องต่อจากนั้น
      check: { stat: INT, dc: 14 }
      success:
        text: |
          เพลงที่{name}ร้องหลังพักเสียงเป็นเพลงเก่าเรื่องพ่อค้าที่ขายเสียงตัวเองให้ปีศาจแลกกับหนี้ แขกส่วนใหญ่ไม่ฟังเกินท่อนแรกเหมือนเดิม แต่ชายเสื้อเทาฟังจนจบ ท่านเฮดริคฟังจนจบ นักบวชตะเกียงก็ฟังจนจบ

          คืนนั้นไม่มีใครเอ่ยเรื่องนี้กับ{name}สักคำ เช้าวันต่อมาบนเตียงของ{name}ในห้องคนใช้มีถุงเหรียญสองถุงวางอยู่ ถุงหนึ่งผ้าเทา ถุงหนึ่งผ้าขาวขลิบทอง ไม่มีจดหมาย
        effects: { stats: { INT: 1 }, gold: 8, flags: [sang_the_secret] }
      failure:
        text: |
          เพลงที่แต่งขึ้นตรงนั้นมีคำที่ใกล้ความจริงเกินไปหนึ่งคำ คือคำว่าสองพัน ท่านเฮดริคได้ยินกลางห้องโถง วางแก้วลง แล้วเดินออกไปทางประตูหลัง

          พ่อบ้านมาบอกตอนเช้าว่าบ้านนี้ไม่ต้องการนักร้องแล้ว จ่ายค่าจ้างให้ครบเดือนเป็นเงินสด กับหนังสือรับรองที่เขียนว่า{name}ร้องเพลงเก่ง เขียนแค่นั้น
        effects: { stats: { WIS: 1 }, gold: 2, flags: [lost_house_post] }
