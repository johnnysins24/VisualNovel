# ชุด 3a วัยผู้ใหญ่: สงครามถ่าน ปี 296 ถึง 301 สำหรับคนที่เป็นผู้ใหญ่ทันสงคราม
# ประกาศเกณฑ์เรียกผู้ชายอายุ 18 ถึง 45 (ตาม childhood.war_conscription) ผู้หญิงสมัครกองเสบียงกับกองพยาบาลได้
# สนามรบอยู่ที่เหมืองถ่านมารในแดนเถ้า แดนเถ้าไม่มีต้นไม้ มีแต่เถ้าสีเทาลึกถึงเข่ากับหญ้าสีเงิน
# คนแคระเป็นอีกฝ่าย ฉากของคนแคระอยู่ใน adult.war_dwarf_gate สงครามจบปี 301 คนแคระแพ้

- id: adult.war_draft
  stage: adult
  scene: market
  weight: 60
  must: true
  mark: ถูกเรียกไปสงครามถ่าน
  when:
    age: [19, 24]
    year: [296, 300]
    gender: m
    not_flags: [race_dwarf, race_elf, race_tiefling, origin_ashland, job_navy, job_wardens, job_fort_priest, institute_student]
    # คนของไส้ตะเกียงกับคนในสายงานของอาณาจักรไม่อยู่ในสมุดเกณฑ์ ทหารประจำการไปสงครามกับกองของตัวเอง (adult.army_coal_war ชุด อ)
    not_orgs: [wick, crown_office, crown_army, crown_court]
  text: |
    ทหารม้าสองนายกับเสมียนหนึ่งคนมาถึงลานกลางถิ่นตอนสาย เสมียนคลี่ประกาศอ่านเสียงดัง ราชอาณาจักรอาร์เวลทำศึกกับสภาตระกูลคนแคระ ผู้ชายอายุสิบแปดถึงสี่สิบห้าที่ยังไม่ได้ไปต้องไปรายงานตัวที่ค่ายภายในเจ็ดวัน แล้วอ่านรายชื่อจากสมุดวิหารทีละชื่อ

    ชื่อของ{name}เป็นชื่อที่สิบเอ็ด คนที่ยืนข้างๆ ตบไหล่ทีหนึ่ง ไม่รู้ว่าตบเพราะเห็นใจหรือเพราะดีใจที่ไม่ใช่ชื่อตัวเอง เสมียนอ่านต่อไปจนถึงชื่อที่สี่สิบสาม
  choices:
    - id: report
      label: ไปรายงานตัวตามประกาศ
      text: |
        ค่ายรายงานตัวแจกเสื้อทหารหนึ่งตัว รองเท้าหนึ่งคู่ ดาบที่ใบดาบมีรอยบิ่นของเจ้าของคนก่อน กับเหรียญเงินสองเหรียญเป็นค่าเดินทาง นายสิบนับคนที่มาครบเจ็ดวันได้สามสิบเก้าคน จดชื่อคนที่ไม่มาสี่คนไว้อีกหน้าหนึ่ง

        เกวียนพาทหารใหม่ออกเดินทางไปทางตะวันออกตอนสาง ไปที่ที่ทุกคนรู้แค่ชื่อ แดนเถ้า
      effects: { gold: 2, alignment: { law: 1 }, reputation: { crown: 1 }, flags: [went_to_coal_war] }
    - id: ask_exemption
      label: ให้นายจ้างยื่นเรื่องว่าเป็นคนงานที่ขาดไม่ได้
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ไปบอกนายว่าถ้า{name}ไป งานที่เหลือต้องจ้างคนสามคนแทน นายเขียนจดหมายถึงค่ายภายในคืนนั้น ประทับตราร้าน ยื่นพร้อมเหรียญเงินหนึ่งเหรียญที่เสมียนรับไว้โดยไม่ถามว่าเหรียญนั้นมาทำไม

          ชื่อของ{name}ย้ายไปอยู่ในหน้าคนงานที่ขาดไม่ได้ ตลอดสงคราม{name}ทำงานเท่าคนสามคนจริงๆ ตามที่นายเขียนไว้ ค่าแรงเท่าคนเดียว
        effects: { stats: { CHA: 1 }, alignment: { law: -1 }, flags: [war_exempted] }
      failure:
        text: |
          นายฟังจบแล้วบอกว่าไม่มีใครในร้านขาดไม่ได้ ถ้า{name}ไป เขาก็จ้างคนใหม่ ถ้า{name}กลับมา ค่อยมาถามว่ายังมีที่ว่างไหม

          วันที่เจ็ด{name}เดินไปรายงานตัวเป็นคนสุดท้าย นายสิบจดชื่อไว้บรรทัดล่างสุดของหน้า ใต้ชื่อคนที่ไม่มา
        effects: { gold: 2, flags: [went_to_coal_war] }
    - id: hide
      label: หนีไปซ่อนตัวจนกว่าทหารจะเลิกตามหา
      habit: faint_heart
      check: { stat: DEX, dc: 15 }
      success:
        text: |
          {name}ไปอยู่ในห้องใต้ดินของโรงเก็บของร้างนอกถิ่นสามเดือน ออกมาตอนกลางคืนเท่านั้น คนที่รู้มีคนเดียว เป็นคนเอาขนมปังมาวางไว้หน้าประตูทุกสามวัน ทหารม้ามาค้นถิ่นสองครั้ง ครั้งที่สองเดินผ่านหน้าประตูห้องใต้ดินไปแค่สองก้าว

          พอทหารเลิกตามหา ชื่อของ{name}ยังอยู่ในหน้าคนที่ไม่มารายงานตัว เบเลคไม่ขีดอะไรทิ้ง ราชสำนักก็เหมือนกัน
        effects: { stats: { DEX: 1 }, alignment: { law: -2 }, reputation: { crown: -1 }, flags: [war_deserter] }
      failure:
        text: |
          ทหารม้าเจอ{name}ในโรงเก็บของร้างตั้งแต่คืนที่สอง เพราะเด็กในถิ่นเห็นแสงตะเกียงลอดฝาเข้าไป พวกเขาไม่ตี มัดมือ{name}ขึ้นเกวียนไปพร้อมทหารใหม่คนอื่น

          ที่ค่าย นายสิบจดชื่อ{name}ไว้ในหน้าพิเศษ คนที่ต้องเดินหน้าแถวทุกครั้ง
        effects: { hp: -1, alignment: { law: -1 }, reputation: { crown: -1 }, flags: [went_to_coal_war, war_caught_hiding] }

- id: adult.war_call_women
  stage: adult
  scene: market
  weight: 30
  when:
    age: [19, 24]
    year: [297, 300]
    gender: f
    not_flags: [race_dwarf, race_elf, race_tiefling, origin_ashland, job_navy, job_wardens, job_fort_priest]
    not_orgs: [wick, crown_office, crown_army, crown_court]
  text: |
    ปีที่สองของสงคราม ผู้ชายในถิ่นไปเกือบหมดแล้ว ประกาศที่ติดหน้าวิหารเป็นประกาศใหม่ กองเสบียงกับกองพยาบาลของราชนาวีรับผู้หญิงที่สมัครเอง ค่าจ้างเท่าทหาร ส่งเงินกลับบ้านได้ทุกสองเดือน

    ผู้หญิงในถิ่นยืนอ่านประกาศกันทีละกลุ่ม อ่านจบก็ยืนต่อ บางคนอ่านไม่ออก ให้คนข้างๆ อ่านให้ฟังซ้ำ
  choices:
    - id: sign_up
      label: ไปสมัครกองพยาบาล
      text: |
        คนรับสมัครถามว่าเคยเห็นแผลเปิดไหม เคยเห็นคนตายไหม {name}ตอบตามจริง เขาจดลงสมุดโดยไม่ได้ฟังคำตอบ เพราะเขาไม่ได้คัดใครออก

        เกวียนเสบียงพาพยาบาลใหม่สิบสองคนออกเดินทางไปทางตะวันออก บนเกวียนมีลังผ้าพันแผลมากกว่าที่{name}เคยเห็นผ้าทั้งชีวิต
      effects: { gold: 2, alignment: { moral: 1 }, reputation: { crown: 1 }, flags: [went_to_coal_war, war_nurse] }
    - id: stay_and_work
      label: อยู่ทำงานต่อ ส่งของให้บ้านที่ผู้ชายไปรบ
      text: |
        {name}อยู่ต่อ ทำงานของตัวเองตอนกลางวัน ตอนเย็นช่วยบ้านที่ผู้ชายไปรบหมด ขนน้ำ ซ่อมรั้ว ส่งเสบียง หลายบ้านไม่มีเงินจ่าย จ่ายเป็นไข่ เป็นผ้า เป็นคำขอบใจ

        สงครามยาวกว่าที่ทุกคนคิดไว้ ปีที่สามบ้านที่{name}ช่วยมีเพิ่มเป็นเก้าบ้าน สามบ้านในนั้นได้จดหมายจากราชนาวีกลับมาแทนคน
      effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [war_home_help] }

- id: adult.war_front
  stage: adult
  scene: fort
  weight: 60
  must: true
  when:
    age: [19, 25]
    year: [296, 301]
    flags: [went_to_coal_war]
  text: |
    ค่ายของราชนาวีตั้งอยู่บนเนินเถ้าหน้าปากเหมืองถ่านมารเก่า ไม่มีต้นไม้ให้หลบ ไม่มีหินให้พิง มีแต่เถ้าสีเทาลึกถึงเข่ากับหญ้าสีเงินที่ม้าไม่ยอมกิน ทหารคนแคระรู้จักอุโมงค์ใต้เนินนี้ทุกเส้น ค่ายจึงไม่เคยรู้ว่าคนแคระจะโผล่ขึ้นมาจากตรงไหน

    คืนนั้นพื้นเถ้าใต้กระโจมพยาบาลยุบลงเป็นหลุม คนแคระสิบกว่าคนปีนขึ้นมาจากข้างใต้ ถือขวานด้ามสั้นกับตะเกียงถ่านมารแสงแดง กระโจมพยาบาลมีคนเจ็บนอนอยู่ยี่สิบคน
  choices:
    - id: charge_the_hole
      label: วิ่งเข้าไปที่ปากหลุม ฟันคนที่ปีนขึ้นมาก่อนจะขึ้นได้ครบ
      check: { stat: STR, dc: 11, foe: human }
      success:
        text: |
          {name}คว้าดาบเล่มที่ใกล้มือที่สุด ไปถึงปากหลุมก่อนคนแคระคนที่หกจะปีนพ้นขอบ แล้วฟันลงไปทีเดียว คนนั้นร่วงกลับลงไปในหลุม ชนคนที่ตามมาข้างหลังร่วงลงไปด้วยกันทั้งแถว {name}ยืนอยู่ที่ปากหลุมจนทหารคนอื่นวิ่งมาถึง แล้วโยนตะเกียงน้ำมันลงไป

          เช้านั้นนายกองเรียก{name}ไปยืนหน้าแถว ติดป้ายไม้ของกองให้ที่อก ตรงที่ทหารใหม่ยังไม่มีสิทธิ์ติด
        effects: { stats: { STR: 1 }, reputation: { crown: 1 }, items: [unit_tag], flags: [war_veteran, held_the_hole] }
      failure:
        text: |
          คนแคระที่ปีนขึ้นมาก่อนยืนรออยู่ที่ปากหลุมแล้ว ขวานด้ามสั้นของเขาลงมาที่ไหล่ของ{name}ก่อนดาบจะยกขึ้นพ้นหัว แล้วอีกเล่มลงมาที่สีข้าง {name}ล้มลงในเถ้า เถ้าอุ่นอยู่ใต้หน้า ร้อนกว่าเลือดที่ไหลลงไป

          เช้านั้นราชนาวีเขียนจดหมายซองสีน้ำตาลถึงบ้านของ{name} ในจดหมายเขียนว่าตายอย่างกล้าหาญ ข้อนั้นเป็นความจริง
        effects: { die: true, flags: [died_in_coal_war] }
    - id: drag_the_wounded
      label: ลากคนเจ็บออกจากกระโจมทางด้านหลัง ทีละคน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ลากคนเจ็บออกทางผ้ากระโจมด้านหลังที่กรีดเปิดด้วยมีด ทีละคน ลากไปไว้หลังกองลังเสบียง กลับเข้าไปใหม่ ลากคนต่อไป ตอนทหารคนอื่นไล่คนแคระกลับลงหลุมได้ คนเจ็บสิบสี่คนนอนเรียงอยู่หลังกองลัง

          มือของ{name}สั่นจนจับช้อนไม่ได้ไปสองวัน คนเจ็บคนหนึ่งในสิบสี่คนนั้นเป็นนายกอง เขาจำหน้า{name}ได้ตั้งแต่นั้น
        effects: { stats: { CON: 1 }, alignment: { moral: 1 }, reputation: { crown: 1 }, items: [unit_tag], flags: [war_veteran, saved_the_wounded] }
      failure:
        text: |
          {name}ลากคนเจ็บออกมาได้สามคน คนที่สี่ตัวหนักเกินแรง ระหว่างที่ลากเขาอยู่ ขวานคนแคระเล่มหนึ่งเฉี่ยวลงมาที่ต้นขาของ{name}

          {name}ยังลากเขาออกมาจนถึงกองลังเสบียงได้ ทั้งที่ขาข้างหนึ่งลากตามมาบนเถ้า แผลที่ต้นขาหายในสองเดือน แต่ตั้งแต่นั้นมาทุกครั้งที่อากาศเย็น ขาข้างนั้นปวดก่อนฝนจะตก
        effects: { hp: -4, alignment: { moral: 1 }, flags: [war_veteran, war_leg_wound] }
    - id: ring_the_alarm
      label: วิ่งไปตีระฆังกลางค่ายให้ทุกกระโจมตื่น
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          ระฆังกลางค่ายห้อยอยู่บนเสาเหล็ก {name}วิ่งไปถึงในไม่กี่ลมหายใจ ตีจนแขนชา ทั้งค่ายตื่นพร้อมกัน ทหารวิ่งออกมาจากทุกกระโจม คนแคระที่ปีนขึ้นมาแล้วถอยกลับลงหลุมก่อนจะไปถึงกระโจมที่สอง

          เช้านั้นทหารเอาเถ้ากลบหลุมจนเต็ม ปักธงไว้ตรงนั้น ใต้ธงผืนนั้นยังมีอุโมงค์แยกไปทางไหนอีกบ้าง มีแต่ทหารคนแคระที่รู้
        effects: { stats: { DEX: 1 }, reputation: { crown: 1 }, items: [unit_tag], flags: [war_veteran, rang_the_bell] }
      failure:
        text: |
          {name}วิ่งไปทางระฆัง ขาจมเถ้าลึกถึงครึ่งแข้ง ล้มลงสองหน กว่าจะไปถึงเสาเหล็ก ทหารครึ่งค่ายตื่นเพราะเสียงร้องในกระโจมพยาบาลแล้ว

          คนแคระถอยกลับลงหลุมพร้อมเสบียงสองลัง คนเจ็บในกระโจมพยาบาลตายสามคน {name}ไม่ได้บาดเจ็บสักแผล แต่จำเสียงร้องในกระโจมนั้นได้ทุกเสียง
        effects: { stats: { WIS: 1 }, flags: [war_veteran, late_to_the_bell] }

- id: adult.war_dwarf_gate
  stage: adult
  scene: clan_hall
  weight: 60
  must: true
  when:
    age: [19, 24]
    year: [296, 301]
    flags: [origin_dwarf_clan]
    # นักเรียนสถาบันอยู่เวนทราส ไม่ได้ยินกลองของสภาตระกูล (ชุด ม) คนที่กินเบี้ยของอาร์เวลก็เหมือนกัน (ชุด อ)
    not_flags: [institute_student]
    not_orgs: [wick, crown_office, crown_army, crown_court]
  text: |
    สภาตระกูลตีกลองเรียกทุกคนที่อายุครบตั้งแต่ก่อนรุ่งสาง ทหารอาร์เวลเดินขึ้นทางรถไฟไต่เขามาถึงประตูเหล็กชั้นล่างของเมืองแล้ว พวกเขาลากปืนใหญ่ถ่านมารมาด้วยสองกระบอก ปากกระบอกแดงตั้งแต่ยังไม่ได้ยิง

    หัวหน้าตระกูลแบ่งคนเป็นสามกลุ่มบนลานหน้าประตู กลุ่มหนึ่งไปยืนหลังประตู กลุ่มหนึ่งลงเตาตีอาวุธ อีกกลุ่มพาเด็กกับคนแก่ลงไปซ่อนในอุโมงค์เหมืองชั้นลึก ลึกกว่าทุกชั้นที่เคยลงไป
  choices:
    - id: hold_the_gate
      label: ไปยืนหลังประตูเหล็ก
      check: { stat: CON, dc: 10, foe: human }
      success:
        text: |
          ปืนใหญ่ยิงประตูเหล็กจนบุบเข้ามาเป็นรูปกำปั้น สามนัด ประตูก็ยังไม่เปิด {name}ยืนเอาไหล่ดันคานกลอนอยู่กับคนอีกสิบเอ็ดคน ทุกนัดที่ปืนยิง คานกลอนกระแทกไหล่จนชาไปถึงฟัน

          ทหารอาร์เวลถอยลงเขาไปตอนค่ำ ประตูเหล็กชั้นล่างไม่เปิดตลอดสงคราม แต่สงครามก็จบลงอยู่ดี สภาตระกูลแพ้ ช่างหินสลักหนี้สงครามลงบนกำแพงสภา ข้างใต้มีชื่อคนที่ยืนหลังประตูวันนั้นทั้งสิบสองชื่อ
        effects: { stats: { STR: 1 }, reputation: { dwarf_council: 1 }, flags: [held_the_iron_gate, war_veteran] }
      failure:
        text: |
          นัดที่สี่ของปืนใหญ่ทำให้คานกลอนหักกลางท่อน ประตูเหล็กเปิดออกครึ่งบาน {name}อยู่ตรงช่องที่เปิด ทหารอาร์เวลวิ่งเข้ามาสามคน ดาบของคนแรกลงที่หน้าอก {name}ล้มลงบนลานหิน มองเห็นแสงไฟแดงของปืนใหญ่ลอดประตูเข้ามาเป็นอย่างสุดท้าย

          ชื่อของ{name}อยู่บนกำแพงสภา ใต้ตัวเลขหนี้สงคราม ในแถวของคนที่ไม่ได้กลับขึ้นมาจากลานหน้าประตูวันนั้น
        effects: { die: true, flags: [died_in_coal_war] }
    - id: work_the_forge
      label: ลงเตาตีหัวขวานกับหัวหอก
      check: { stat: CON, dc: 13 }
      success:
        text: |
          เตาถ่านมารลุกแดงทั้งคืน {name}ตีหัวขวานได้สี่สิบหัวก่อนเช้า ลูกมือสองคนผลัดกันเป่าเตา ผลัดกันหลับ {name}ไม่ได้หลับ ทุกหัวขวานที่ตีเสร็จมีคนวิ่งมารับขึ้นไปที่ประตูทันที

          สงครามจบลงด้วยการแพ้ หัวขวานส่วนใหญ่ที่{name}ตีไม่ได้ใช้ ส่งคืนกลับลงมาที่เตาเพื่อหลอมเป็นราวเหล็ก แต่หัวหน้าตระกูลเก็บหัวขวานหัวแรกของคืนนั้นไว้ในห้องสภา ไม่ได้บอกว่าทำไม
        effects: { stats: { CON: 1 }, reputation: { dwarf_council: 1 }, flags: [war_forge_night, war_veteran] }
      failure:
        text: |
          คืนนั้นเตาร้อนเกินไป {name}ตีหัวขวานหัวที่สิบเจ็ดแล้วเหล็กแตกกระเด็น เศษเหล็กร้อนฝังเข้าที่หลังมือซ้ายสามเศษ {name}เอามีดแคะออกเองแล้วตีต่อจนเช้า

          สงครามจบลงด้วยการแพ้ แผลที่หลังมือหายเป็นจุดนูนสีขาวสามจุด เรียงกันเหมือนรูกระดุม
        effects: { hp: -2, stats: { CON: 1 }, reputation: { dwarf_council: 1 }, flags: [war_forge_night, war_veteran] }
    - id: lead_the_children
      label: พาเด็กกับคนแก่ลงอุโมงค์ชั้นลึก
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          อุโมงค์ชั้นลึกมืดจนตะเกียงถ่านมารส่องได้แค่สามก้าว {name}พาเด็กสี่สิบคนกับคนแก่สิบสองคนเดินตามรอยปูนขาวเก่าบนผนัง จนถึงห้องหินที่แห้งพอให้นั่ง เลยห้องนั้นไปมีกำแพงหินที่ก่อปิดตาย สลักอักษรที่ไม่มีใครในกลุ่มอ่านออก

          {name}ให้ทุกคนนั่งหันหลังให้กำแพงนั้น เล่านิทานให้เด็กฟังจนเสียงปืนใหญ่ข้างบนหยุด เด็กคนหนึ่งถามว่าหลังกำแพงมีอะไร {name}บอกว่ามีแต่หิน แล้วภาวนาให้เป็นอย่างนั้นจริง
        effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, reputation: { dwarf_council: 1 }, flags: [led_children_deep, war_veteran] }
      failure:
        text: |
          ตะเกียงดวงหนึ่งดับกลางทาง เด็กสามคนเดินแยกไปทางอุโมงค์ที่ไม่มีรอยปูนขาว {name}ต้องทิ้งกลุ่มไว้กับคนแก่ วิ่งกลับไปตามหา เจอเด็กสองคนนั่งร้องไห้อยู่ทางแยก อีกคนเดินไปไกลกว่านั้น ไปจนถึงกำแพงหินที่ก่อปิดตาย

          เด็กคนนั้นนั่งเอาหูแนบกำแพงอยู่ บอกว่าข้างหลังมีคนเคาะ {name}อุ้มเด็กกลับมาโดยไม่ฟังต่อ ตลอดทางกลับไม่ได้ยินเสียงเคาะ แต่ไม่ได้หยุดฟังเหมือนกัน
        effects: { hp: -1, stats: { WIS: 1 }, reputation: { dwarf_council: 1 }, world: { demon: 1 }, flags: [led_children_deep, child_heard_the_wall, war_veteran] }
