# ยุคดาวเร่ง ชุด B ไฟล์ 1: ป้ายเปล่า (10 เรื่อง ปี 340 ถึง 360) ยืนรอบหมุดปี 344 ปีที่ป้ายนับว่าง
# ช่วงวัย: ทุกวัย 6 (ตะเกียงฟ้า ปฏิทิน พนัน คนนับตกงาน เชือกนับ ถ่านทีละช่อง) · วัยทำงาน 1 (วันเตาเย็น) · วัยชรา 3 (ป้ายสมาคม อย่านับออกเสียง รถไฟน้อยเที่ยว)
# คนที่มีแต่ในข้อความ: ดาร์ซิล คนทำเทียนบ้านติดกัน · หลานชายคนขายปฏิทิน · เฟนนา เจ้าของโต๊ะพนันในโรงเตี๊ยมกับหลานสี่คน
#   เสมียนสมาคมโรงกลั่น (ไม่มีชื่อ) · คนอบขนมปังที่ถือเชือกนับหนี้เส้นคู่ · หญิงรถเข็นถ่านที่มีด้ายแดงใต้ข้อมือ · เวซรา เด็กหญิงวงบ่อที่นับดาวออกเสียง
# คนที่เข้าผัง: โอเวลิน (era_counter_ovelin) คนนับของหอดูดาวหลวงที่ตกงานในปีป้ายเปล่า
# ของที่คิดขึ้นในไฟล์นี้: ช่องว่างในปฏิทินที่หลานคนขายรับเติม · กระดานพนันช่องละห้าร้อยดวง · สมุดลายนิ้วโป้งของสมาคมโรงกลั่น
#   ถ่านขายทีละช่องปาดหัว · วันเตาเย็นกับงานกวาดปล่องและอิฐอุ่นเตียง · ป้ายเวลารถไฟที่ทาดำปีละบรรทัด ตลาดของขบวนวันทาลิส ขบวนถ่านวันออสซา

# ---------- ทุกวัย ----------
- id: adult.era_board_dew_lamp_pedlar
  stage: adult
  weight: 24
  time: dusk
  when:
    age: [16, 130]
    year: [340, 350]
  text: |
    คนขายตะเกียงฟ้าเข้าซอยมาทุกต้นเดือนมาหลายปีแล้ว ปีก่อนๆ ตัวตะเกียงแพงจนไม่มีบ้านไหนในซอยซื้อ ปีนี้เขาแขวนตะเกียงดวงหนึ่งไว้บนเสาหัวซอยให้ติดทั้งคืน แล้วตั้งโต๊ะใต้เสานั้น ตัวตะเกียงแจกเปล่า บ้านละดวง ของที่ขายคือน้ำค้างดาว ขวดเท่านิ้วโป้ง ขวดละเหรียญ ติดได้สิบคืน

    แสงขาวจากหัวซอยส่องลึกถึงบ้านหลังที่สี่ เงาของเสามีขอบคมเหมือนตัดด้วยกรรไกร แมลงกลางคืนไม่บินเข้าหาเหมือนบินหาเปลวไฟ บินวนอยู่ห่างๆ แล้วก็ไป

    บ้านติดกับ{name}เป็นบ้านของดาร์ซิล คนทำเทียน ทุกเย็นนางนั่งฟั่นไส้เทียนอยู่หน้าประตู นิ้วเปื้อนไขขาวถึงข้อ เย็นนี้นางฟั่นเร็วกว่าทุกวัน หันหน้าเข้าบ้าน คนขายตะเกียงเดินมาวางตะเกียงดวงหนึ่งลงบนธรณีบ้าน{name} บอกว่าไม่ต้องจ่ายอะไร ขวดแรกก็แถม เดือนหน้าค่อยว่ากัน
  choices:
    - id: take_the_free_lamp
      label: แขวนตะเกียงฟ้าไว้ที่หน้าต่าง
      text: |
        ขวดแรกหมดในเก้าคืน ไม่ใช่สิบ ขวดที่สองต้องจ่าย {name}จ่าย ราคาไม่ถึงครึ่งของน้ำมันตะเกียงที่ใช้มาทั้งชีวิต แสงจากหน้าต่างตกลงบนลานดินหน้าบ้านเป็นสี่เหลี่ยมพอดีกรอบ พอเข้าสัปดาห์ที่สอง เด็กในซอยก็มานั่งทำเลขบนกระดานชนวนกันในสี่เหลี่ยมนั้นทุกคืน ลูกคนเล็กของดาร์ซิลมาด้วย {name}นั่งตรวจเลขให้จนคล่องกว่าตอนตัวเองเรียน

        สิ้นเดือน ดาร์ซิลตั้งกระดานหน้าบ้าน เขียนว่าเทียนสามเล่มหนึ่งเหรียญ ลายมือเดียวกับป้ายแผ่นเก่าที่เขียนว่าสองเล่ม
      effects: { gold: -1, stats: { INT: 1 }, world: { star: 1 }, flags: [took_the_free_dew_lamp] }
    - id: buy_candles_next_door
      label: คืนตะเกียงให้คนขาย แล้วซื้อเทียนจากดาร์ซิลต่อไปเหมือนเดิม
      habit: stubborn
      text: |
        คนขายตะเกียงรับคืนโดยไม่ถือสา บอกว่าเดือนหน้ามาใหม่ ดวงนี้จะรอ แล้วจดอะไรบางอย่างลงสมุดเล่มเล็ก ดาร์ซิลห่อเทียนให้{name}โหลหนึ่ง นับใส่ห่อสิบสามเล่ม {name}ทักว่าเกิน นางว่าเล่มที่สิบสามเป็นค่าจ้างให้หน้าต่างบ้าน{name}เป็นสีเหลืองต่อไปอีกเดือน

        ปลายปีซอยนั้นเหลือหน้าต่างสีเหลืองอยู่สามบาน คนขายตะเกียงยังเดินผ่านทุกต้นเดือน ทักทุกบานด้วยชื่อเจ้าของ
      effects: { gold: -1, alignment: { moral: 1 }, flags: [kept_buying_the_neighbours_candles] }
    - id: share_one_lamp
      label: ชวนอีกสองบ้านแขวนตะเกียงดวงเดียวไว้กลางลาน แล้วหารค่าน้ำค้างกัน
      habit: sweet_tongue
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          บ้านตรงข้ามตกลงก่อน บ้านท้ายซอยตกลงทีหลัง พอได้ยินว่าค่าน้ำค้างหารสาม ตะเกียงดวงนั้นแขวนอยู่บนคานเล้าไก่ที่สามบ้านใช้ร่วมกัน สว่างพอให้เห็นหน้ากันตอนตักน้ำ แม่ไก่ไข่ดกขึ้นจนบ้านท้ายซอยมาขอแบ่งไข่เพิ่ม

          ทุกต้นเดือน{name}ถือกระป๋องเดินไปเก็บค่าน้ำค้างทั้งสองบ้าน ได้ครบทุกเดือน บ้านท้ายซอยจ่ายเป็นไข่
        effects: { stats: { CHA: 1 }, flags: [shared_one_lamp_three_houses], city: { merit: 1, here: true } }
      failure:
        text: |
          บ้านตรงข้ามตกลง บ้านท้ายซอยไม่ยอม บอกว่าแสงแบบนั้นทำให้ไก่ไม่หลับ ตะเกียงจึงแขวนบนคานเล้าไก่ได้แต่หันไปทางครึ่งลานของสองบ้าน {name}กับบ้านตรงข้ามหารค่าน้ำค้างกันสองคน

          บ้านท้ายซอยยังมาตักน้ำทุกค่ำ ยืนตรงขอบมืดพอดี ถังน้ำอยู่ในแสงครึ่งใบ
        effects: { gold: -1, flags: [shared_one_lamp_three_houses] }
    - id: keep_the_singing_lamps
      label: รับตะเกียงที่เพื่อนบ้านบอกว่าร้องมาไว้ที่บ้านตัวเองตอนกลางคืน
      habit: curious
      requires: { trait: curse_brand }
      text: |
        สัปดาห์ที่สอง แม่บ้านตรงข้ามถือตะเกียงฟ้ามายืนที่ประตูตอนดึก บอกว่าดวงนี้ร้อง เสียงเล็กเหมือนเอานิ้วเปียกถูขอบแก้ว ร้องทั้งคืนจนลูกไม่ยอมนอน ถามว่าฝากไว้บ้าน{name}สักคืนได้ไหม {name}ยกขึ้นแนบหู ไม่ได้ยินอะไรเลย แม่บ้านตรงข้ามไม่ถามต่อว่าทำไม

        คืนถัดมาตะเกียงวางเรียงอยู่บนธรณีบ้าน{name}สามดวง สิ้นเดือนเจ็ดดวง เจ้าของมารับคืนตอนเช้า บางบ้านทิ้งไข่ไว้ให้ บางบ้านทิ้งเหรียญ ห้องหน้าบ้าน{name}สว่างจนต้องเอาผ้าคลุมหน้านอน
      effects: { gold: 1, flags: [kept_the_singing_lamps] }

- id: adult.era_board_blank_almanac
  stage: adult
  weight: 24
  scene: market
  when:
    age: [16, 130]
    year: [344, 354]
  text: |
    ปฏิทินปีนี้ที่แผงหนังสือท้ายตลาดยังขายเล่มละสองเหรียญ กระดาษเท่าเดิม หน้าแรกยังมีตารางวันตลาด วันฟ้าเปิด วันของเทพทั้งหก ข้างขึ้นข้างแรม เปลี่ยนไปช่องเดียว ช่องที่ทุกปีพิมพ์จำนวนดาวไว้ตัวโตที่สุดในหน้า ปีนี้เป็นกรอบเปล่า ใต้กรอบพิมพ์ตัวเล็กว่า ให้ผู้ซื้อเติมเอง

    หลานชายคนขาย เด็กผอมฟันหน้าห่าง นั่งยองอยู่ข้างแผงกับขวดหมึก รับเติมช่องนั้นให้เล่มละเหรียญ ใครอยากได้เลขไหนเขาเขียนเลขนั้น ใครไม่รู้จะเอาเลขไหน เขาเลือกให้ ลายมือเขาสวยกว่าตัวพิมพ์

    {name}จ่ายค่าปฏิทินแล้ว เด็กชายยื่นมืออีกข้างมารอ ปลายปากกาจ่ออยู่เหนือกรอบ
  choices:
    - id: pay_the_boy
      label: จ่ายอีกเหรียญ ให้เด็กชายเลือกเลขให้
      text: |
        เด็กชายเลียปลายปากกาทีหนึ่ง แล้วเขียนเลขห้าหลักลงกลางกรอบ ตัวเอนนิดๆ หางเลขหกม้วนสวย {name}ถามว่าได้เลขนี้มาจากไหน เขาบอกว่าเลขนี้ขายดีที่สุด

        ทั้งปีนั้นใครมาบ้าน{name}เปิดปฏิทินก็เห็นเลขนั้น คนขายปลามีอีกเลข คนเฝ้าศาลามีอีกเลข สามบ้านเอาปฏิทินมาวางเทียบกันที่บ่อน้ำ ไม่มีใครเถียงเรื่องดาว เถียงกันว่าเด็กคนนั้นเขียนให้ใครสวยที่สุด
      effects: { gold: -1, flags: [bought_a_number_for_the_almanac] }
    - id: write_i_dont_know
      label: ยืมปากกาเด็กชาย เขียนลงไปเองว่า ไม่รู้
      text: |
        {name}เขียนสองคำลงกลางกรอบ ไม่รู้ เด็กชายชะโงกมาดู หัวเราะจนหมึกหกเปื้อนแผง คนขายปลาแผงข้างๆ ขอดูบ้าง วันต่อมาปฏิทินของคนขายปลามีสองคำเดียวกัน ลายมือคนขายปลา

        สิ้นเดือนครึ่งตลาดเขียนแบบนั้น เด็กชายเปลี่ยนป้ายข้างขวดหมึกใหม่ เขียนไม่รู้ให้ เล่มละเหรียญ
      effects: { stats: { WIS: 1 }, flags: [wrote_dont_know_in_the_almanac] }
    - id: use_it_for_the_house
      label: เก็บกรอบเปล่าไว้จดหนี้ของบ้าน
      habit: tight_fist
      text: |
        กรอบใหญ่ เส้นพิมพ์ตรง กระดาษดีกว่ากระดาษที่ใช้จดหนี้มาทั้งชีวิต {name}เขียนชื่อคนที่ยืมเงินไปลงในกรอบ ใครยืมเท่าไร คืนแล้วหรือยัง เรียงตามวัน ปลายปีกรอบเต็ม ต้องเขียนเบียดออกไปนอกเส้น

        ลูกหนี้คนหนึ่งมาขอดูปฏิทินเพราะอยากรู้วันตลาด เห็นชื่อตัวเองอยู่ในช่องที่เคยเป็นของดวงดาว สัปดาห์ถัดมาเขาเอาเงินมาคืนครบ บอกว่าไม่อยากเป็นเลขบนฟ้า
      effects: { gold: 1, alignment: { law: 1 }, flags: [kept_house_debts_in_the_star_box] }
    - id: write_the_roof_number
      label: คิดเลขจากเชือกผูกปมที่นับเองบนหลังคาคืนนั้น แล้วเขียนลงไป
      requires: { flag: counted_from_the_roof }
      check: { stat: INT, dc: 13 }
      success:
        text: |
          เชือกจากคืนนั้นยังม้วนอยู่ในลิ้นชัก {name}คลี่ออกบนโต๊ะ นับปม คูณด้วยจำนวนช่องฟ้าเท่าที่นึกออก หักส่วนที่หลังคาบ้านตรงข้ามบัง ได้เลขหนึ่ง คิดซ้ำได้เลขเดิม เลขนั้นไม่ตรงกับปฏิทินของใครในตลาด แต่{name}คิดให้ดูได้ทุกบรรทัด เด็กชายหลานคนขายมานั่งดูจนจบ แล้วขอลอกวิธีไป

          ปีถัดมาเด็กชายมีราคาใหม่ เลขที่คิดให้ดูได้ เล่มละสองเหรียญ
        effects: { stats: { INT: 1 }, flags: [wrote_own_number_in_the_almanac] }
      failure:
        text: |
          {name}คลี่เชือกออกบนโต๊ะ นับปม คูณ หาร ได้เลขหนึ่ง คิดซ้ำได้อีกเลข ห่างกันเกือบเท่าตัว สุดท้ายเขียนเลขที่สองลงไปเพราะตัวสวยกว่า

          เพื่อนบ้านเห็นเข้า ตั้งแต่นั้นใครคิดอะไรพลาดไปเท่าตัว ทั้งซอยเรียกว่าคิดแบบเลขบ้าน{name}
        effects: { flags: [wrote_own_number_in_the_almanac] }

- id: adult.era_board_count_bet
  stage: adult
  weight: 24
  scene: tavern
  when:
    age: [16, 130]
    year: [344, 350]
  text: |
    กระดานพนันของโรงเตี๊ยมแขวนอยู่ข้างถังเหล้า เดิมรับพนันวันฝนแรกกับลูกวัวตัวผู้ตัวเมีย ปีนี้เฟนนา เจ้าของโต๊ะพนัน ลบหมดแล้วตีเส้นใหม่ เริ่มที่หมื่น ช่องละห้าร้อยดวง ไล่ลงไปจนสุดกระดาน ช่องล่างสุดเขียนว่า เกินนี้ ใครแทงถูกช่องรับสามเท่า

    หอดูดาวหลวงไม่ติดเลขแล้ว คนที่จะบอกว่าช่องไหนถูกจึงเป็นหลานชายสี่คนของเฟนนา คืนเดือนมืดหลังเก็บเกี่ยว สี่คนนั้นจะขึ้นหลังคาโรงเตี๊ยม คนละมุมฟ้า เชือกคนละม้วน ผูกปมทีละสิบดวง ปมรวมกันได้เท่าไรคือเลขของกระดาน คนดื่มประจำรู้กันว่าสี่คนนั้นนับอะไรไม่เคยตรงกันแม้แต่สองคน

    คืนนี้มีคนวางเงินไปแล้วสามสิบกว่าคน เฟนนาถือชอล์กเดินมาหยุดตรงหน้า{name} ชอล์กชี้ค้างอยู่ที่กระดาน
  choices:
    - id: place_a_bet
      label: แทงช่องหนึ่ง
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ไม่ได้แทงตามดาว แทงตามหลาน คนโตนับเร็ว คนรองนับซ้ำ คนที่สามขี้เกียจ คนเล็กกลัวความสูง {name}เอาเลขที่สี่คนน่าจะได้มาเฉลี่ยกัน แล้วเลื่อนลงอีกช่อง เพราะคนเล็กจะลงมาก่อนนับเสร็จ

          คืนเดือนมืด คนเล็กลงมาจากหลังคาก่อนเที่ยงคืน ขาสั่น เลขที่เฟนนาเขียนขึ้นกระดานตกช่องของ{name}พอดี นางจ่ายสามเท่า แล้วถามว่าปีหน้าจะมาช่วยนางตั้งช่องไหม
        effects: { gold: 3, stats: { WIS: 1 }, flags: [won_the_tavern_star_bet] }
      failure:
        text: |
          {name}แทงช่องที่ฟ้าน่าจะเป็น ไม่ใช่ช่องที่หลานสี่คนนั้นจะนับได้ คืนเดือนมืดมีเมฆมาจากทางเหนือ หลานสองคนนับได้ครึ่งฟ้า เลขบนกระดานต่ำกว่าช่องของ{name}สองช่อง

          คนแทงถูกคือคนเลี้ยงแพะที่แทงช่องต่ำสุดทุกปี เขาบอกใครก็ตามที่ถามว่าดาวไม่ชอบคนนับ
        effects: { gold: -2, flags: [lost_the_tavern_star_bet] }
    - id: be_the_judge
      label: รับเป็นคนกลาง ตรวจเชือกทุกเส้นที่ตีนบันได
      habit: cool_headed
      text: |
        เฟนนาจ่ายค่าคนกลางสองเหรียญ คืนเดือนมืด{name}นั่งที่ตีนบันไดกับตะเกียงดวงเล็ก หลานลงมาทีละคน ส่งเชือกให้ เชือกสามเส้นปมห่างบ้างชิดบ้าง แบบมือคนง่วงที่ผูกไปเงยหน้าไป เส้นที่สี่ปมห่างเท่ากันทุกปม เรียบเหมือนผูกมาจากบ้าน

        {name}ชูเชือกเส้นนั้นขึ้นกลางโรงเตี๊ยม เฟนนายกกระดานปีนั้น คืนเงินทุกคน หักค่าเหล้า หลานคนนั้นล้างจานอยู่หลังร้านจนสิ้นหน้าหนาว
      effects: { gold: 2, alignment: { law: 1 }, flags: [judged_the_tavern_star_bet], city: { merit: 1, here: true } }
    - id: call_it_what_it_is
      label: บอกเฟนนาต่อหน้าคนทั้งร้านว่ากระดานนี้แทงกันว่าหลานนางนับได้เท่าไร ไม่ได้แทงฟ้า
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          คนทั้งร้านหัวเราะ เฟนนาหัวเราะดังกว่าทุกคน แล้วหยิบผ้าลบกระดานทิ้งทั้งแผ่น ตีเส้นใหม่สี่ช่อง เขียนชื่อหลานสี่คน คราวนี้แทงกันว่าใครจะได้เมียก่อน หลานคนโตยืนหน้าแดงอยู่ข้างถังเหล้า

          เงินบนกระดานใหม่มากกว่ากระดานดาวเกือบเท่าตัว ไม่มีใครต้องขึ้นหลังคา
        effects: { stats: { CHA: 1 }, flags: [called_out_the_star_bet] }
      failure:
        text: |
          ครึ่งร้านหยุดคุย เฟนนาถามกลับว่าแล้วหอดูดาวหลวงแทงกันว่าคนนับของหอจะนับได้เท่าไรหรือเปล่า คนในร้านหัวเราะ หัวเราะใส่{name} {name}ต้องเลี้ยงเหล้าโต๊ะข้างๆ ไปหนึ่งรอบถึงจะนั่งต่อได้

          คืนนั้นกระดานรับพนันเพิ่มอีกสิบสองคน คนหนึ่งแทงช่อง เกินนี้ ด้วยเงินที่ตั้งใจเก็บไว้ซื้อรองเท้า
        effects: { gold: -1, flags: [called_out_the_star_bet] }

- id: adult.era_board_dismissed_counter
  stage: adult
  weight: 24
  when:
    age: [16, 130]
    year: [345, 356]
  text: |
    หญิงคนนั้นมาถามหางานที่รั้วบ้าน{name}ตอนสาย เสื้อคลุมสีหม่นแบบที่คนทำงานหอดูดาวใส่ ตราที่อกเลาะออกไปแล้ว เหลือรอยด้ายเป็นวง นางชื่อโอเวลิน เป็นคนนับดาวของหอดูดาวหลวงมาตั้งแต่ยังสาว ปีที่ป้ายนับว่าง หอเก็บคนนับไว้สิบสองคนจากสามสิบ นางไม่ได้อยู่ในสิบสองคนนั้น

    นางรับทุกงาน ซักผ้า ผ่าฟืน ดูเด็ก ระหว่างพูดปากนางขยับอยู่ตลอด นับขั้นบันไดหน้าบ้าน นับถั่วในกระด้งที่{name}คัดค้างไว้ พอ{name}อ้าปากตอบ นางก็นับฟัน แล้วขอโทษ นางบอกว่าหยุดไม่ได้ ทำมาทั้งชีวิต มือว่างเมื่อไรปากก็นับแทน

    รองเท้าของนางขาดที่หัวทั้งสองข้าง ห่อผ้าที่สะพายมาเล็กพอจะเป็นของทั้งหมดที่นางมี
  choices:
    - id: lodge_her
      label: ให้นางพักห้องเก็บของหลังบ้าน แลกกับงานบ้าน
      habit: soft_heart
      text: |
        งานบ้านเสร็จก่อนสายทุกวัน ถั่วคัดแล้วใส่ถุง ถุงละเท่ากันทุกถุง ฟืนผ่าแล้วเรียงเป็นตั้ง ตั้งละสิบ ตอนกลางคืนโอเวลินไม่ออกไปดูฟ้า นางนั่งหันหลังให้หน้าต่าง นับตะเข็บผ้าห่มที่ปะให้{name}

        สิ้นหน้าหนาว{name}ไม่ต้องนับอะไรในบ้านเองอีกเลย จะซื้ออะไรก็ถามโอเวลินก่อนว่าของในบ้านยังเหลือเท่าไร นางตอบได้ก่อน{name}ถามจบ
      effects: { gold: -2, alignment: { moral: 1 }, people: [{ id: era_counter_ovelin, name: โอเวลิน, gender: f, bond: friend, closeness: 1, age: 46 }], flags: [lodged_the_dismissed_counter] }
    - id: find_sack_work
      label: พานางไปหาเจ้าของโกดัง ขอให้รับไว้นับกระสอบ
      habit: sweet_tongue
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          เจ้าของโกดังทะเลาะกับคนแบกเรื่องนับกระสอบผิดมาทั้งชีวิต เขาให้นางลองหนึ่งวัน ตกเย็นตัวเลขของนางตรงกับบัญชีทุกแถว แล้วนางก็ชี้ว่ามีกระสอบหายไปสามใบตั้งแต่เดือนก่อน กองไหน วันไหน

          เขาจ้างนางทั้งปี ส่ง{name}กลับบ้านพร้อมเหรียญหนึ่งเหรียญเป็นค่าพามา สัปดาห์นั้นคนแบกกระสอบลาออกไปสามคน
        effects: { stats: { CHA: 1 }, gold: 1, flags: [found_the_counter_sack_work], city: { merit: 1, here: true } }
      failure:
        text: |
          เจ้าของโกดังให้นางลองหนึ่งวัน นางนับกระสอบได้ตรง แล้วนับมอดในกระสอบข้าวต่อ นับออกเสียง คนซื้อข้าวที่ยืนรอรับของได้ยินเลขขึ้นหลักร้อย ยกเลิกไปสองเจ้า

          ตอนเย็นเจ้าของโกดังจ่ายค่าแรงหนึ่งวันให้นาง แล้วให้อีกเหรียญเป็นค่าไม่ต้องมาอีก โอเวลินเอาเหรียญนั้นมาคืน{name} บอกว่าไม่ควรมีใครต้องจ่ายสองครั้งเพราะนาง
        effects: { flags: [found_the_counter_sack_work] }
    - id: send_her_to_the_white_gloves
      label: บอกนางว่าคนสวมถุงมือขาวจ่ายดีสำหรับคนที่นับเป็น
      text: |
        โอเวลินหยุดนับไปครู่หนึ่ง ถามว่าไปหาได้ที่ไหน {name}บอกเท่าที่รู้ นางไปตั้งแต่บ่ายวันนั้น ทิ้งเหรียญไว้บนเสารั้วหนึ่งเหรียญเป็นค่าบอกทาง

        ฤดูถัดมานางเดินผ่านหน้าบ้าน{name} เสื้อเทาตัวใหม่ ถุงมือหนังสีขาว รองเท้าใหม่ ทักทาย{name}ด้วยชื่อ ถามถึงถั่วในกระด้ง ระหว่างพูดปากนางไม่ขยับนับอะไรอีกแล้ว นางบอกว่าที่ใหม่มีคนนับให้หมด
      effects: { gold: 1, world: { star: 1 }, flags: [sent_the_counter_to_the_white_gloves] }
    - id: count_beside_her
      label: นั่งลงข้างนางบนขั้นบันได แล้วนับไปด้วยกัน
      requires: { trait: curse_brand }
      text: |
        {name}นับขั้นบันไดไปพร้อมนาง เจ็ดขั้น นับจบแล้วปากนางก็นิ่ง นางนั่งอยู่อย่างนั้นสักพักแล้วบอกว่านั่งตรงนี้เลขไม่ไหล นับจบแล้วจบ ไม่ต้องนับซ้ำ นางขอทำงานแลกข้าวกับ{name}ไปก่อน แล้วค่อยหางานอื่น

        นางหางานอื่นไม่เคยเจอ ทุกหัวค่ำโอเวลินมานั่งขั้นบันไดเดิม เงยหน้าขึ้นฟ้าช่องเล็กเหนือหลังคาบ้าน{name} แล้วหลับไปตรงนั้น คนในบ้านต้องปลุกให้เข้าไปนอนข้างใน
      effects: { stats: { WIS: 1 }, people: [{ id: era_counter_ovelin, name: โอเวลิน, gender: f, bond: friend, closeness: 1, age: 46 }], flags: [sat_beside_the_dismissed_counter] }

- id: adult.era_board_tally_strings
  stage: adult
  weight: 24
  when:
    age: [16, 130]
    year: [344, 352]
    location_tag: [arvel_village, ventras, kardin]
  text: |
    นักบวชตะเกียงตั้งกระถางไฟไว้หน้าวิหารตั้งแต่เช้า วันก่อนเขาเทศน์ว่าจำนวนดาวเป็นเรื่องของเทพ คนที่ขึ้นหลังคาไปนับคือคนที่เอาเรื่องของเทพมาถือไว้ในมือตัวเอง ใครมีเชือกนับดาวให้เอามาเผา

    คนทยอยเอาเชือกมาให้ทีละเส้น เชือกป่านปมถี่ เชือกขนแพะปมห่าง เส้นหนึ่งมีเศษกระเบื้องแตกติดมาด้วย นักบวชรับทีละเส้น อวยพรเส้นละประโยค แล้วโยนลงไฟ กลิ่นขนไหม้ลอยไปถึงตลาด

    เชือกผูกปมในบ้าน{name}ไม่เคยนับดาว เป็นเชือกนับหนี้ขนมปัง ผูกปมหนึ่งทุกครั้งที่เอาขนมปังมาโดยยังไม่จ่าย คนอบขนมปังมีเส้นคู่กันแขวนอยู่ที่ร้าน ปมเท่ากันเสมอ แต่นักบวชไม่ได้สั่งให้ถามว่าเชือกนับอะไร เด็กรับใช้วิหารที่เดินถามทุกบ้านยืนอยู่ที่ประตูบ้าน{name}แล้ว ชี้นิ้วไปที่ตะปูข้างเตา
  choices:
    - id: hand_it_over
      label: ส่งเชือกนับหนี้ให้ไปเผา
      text: |
        นักบวชรับไปถือ ไล่นิ้วไปตามปมตลอดเส้น ถามว่าปมพวกนี้คืออะไร {name}บอก เขาหัวเราะ โยนลงไฟพร้อมเส้นอื่น อวยพรให้หนี้ทุกปมไหม้ไปด้วย

        ร้านขนมปังไม่ได้คิดแบบนั้น คนอบขนมปังยกเส้นคู่ของเขาออกมาให้ดู ปมครบ บ่ายนั้น{name}จ่ายหนี้ทั้งเส้น เขาตัดเส้นเก่าทิ้งแล้วเริ่มเส้นใหม่ให้ บอกว่าต่อไปเก็บไว้ที่ร้านเส้นเดียวพอ
      effects: { gold: -1, world: { gods: 1 }, reputation: { lamp_church: 1 }, flags: [gave_the_tally_string_to_the_brazier] }
    - id: hide_it
      label: บอกเด็กว่าไม่มี แล้วซุกเชือกลงถังแป้ง
      habit: stubborn
      text: |
        เด็กรับใช้วิหารชะโงกมองตะปูข้างเตา ตะปูว่าง {name}ยืนเอาสะโพกพิงถังแป้งไว้ตลอดเวลาที่เด็กยังไม่ไป มือเปื้อนแป้งถึงข้อ เด็กถามว่าทำขนมอยู่หรือ {name}บอกว่าใช่

        คืนนั้นเชือกขาวไปทั้งเส้น แป้งอัดอยู่ในปมทุกปม ร้านขนมปังเอาเส้นคู่มาเทียบ ตรงกันทุกปม คนอบขนมปังดมเชือกแล้วบอกว่าบ้าน{name}ใช้แป้งดีกว่าร้าน
      effects: { stats: { DEX: 1 }, flags: [hid_the_tally_string] }
    - id: argue_at_the_well
      label: เอาเชือกไปกางเทียบกับเส้นของร้านขนมปังที่บ่อน้ำ ต่อหน้านักบวช
      habit: sweet_tongue
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}กางเชือกสองเส้นบนขอบบ่อ ปมต่อปม แล้วถามนักบวชว่าหนี้ขนมปังเป็นเรื่องของเทพด้วยหรือเปล่า คนรอบบ่อหัวเราะ นักบวชหัวเราะด้วย แล้วประกาศว่าเชือกที่นับของบนดินไม่ต้องเผา

          บ่ายนั้นมีคนมาขอเชือกนับหนี้คืนจากกระถางอีกสามเส้น ปลายไหม้ไปคนละครึ่ง ลูกหนี้ทั้งสามบ้านยืนยันว่าปมที่ไหม้ไปเป็นปมที่จ่ายแล้ว
        effects: { stats: { CHA: 1 }, flags: [argued_for_the_tally_string], city: { merit: 1, here: true } }
      failure:
        text: |
          นักบวชฟังจบแล้วยื่นมือ บอกว่าปมคือปม ใครจะรู้ว่านับขนมปังหรือนับดาว {name}ต้องส่งเชือกให้ต่อหน้าคนทั้งบ่อ

          คนอบขนมปังยืนอยู่ในวงคนด้วย เย็นนั้นเขามาที่ประตูบ้าน{name} ถือเส้นคู่ของเขามาด้วย ปมครบทุกปม
        effects: { gold: -1, flags: [argued_for_the_tally_string] }

- id: adult.era_board_coal_by_the_scoop
  stage: adult
  weight: 24
  when:
    age: [16, 130]
    year: [346, 360]
  text: |
    ถ่านมารที่ลานถ่านขึ้นราคาอีกแล้ว คนขายเลิกขายเป็นกระบุงตั้งแต่หน้าฝน ตอนนี้ขายเป็นช่อง กระป๋องสังกะสีมีด้าม ตักแล้วเอาไม้บรรทัดปาดหัวให้เรียบเสมอขอบ เศษที่ปาดตกกลับลงกอง ช่องละหนึ่งเหรียญ ช่องหนึ่งพอติดเตาได้สองเย็นถ้าไม่ต้มน้ำ

    หญิงคนหนึ่งเข็นรถเข็นมาจอดฝั่งตรงข้ามลานถ่านทุกเช้า ขายถ่านแบบเดียวกัน ราคาเดียวกัน แต่นางตักพูน ไม่ปาด แถวหน้ารถเข็นยาวกว่าแถวหน้าลาน คนลานถ่านเอาไม้บรรทัดเคาะโต๊ะ แต่ไม่เคยเดินข้ามมาไล่

    เวลานางยื่นถ่านให้ แขนเสื้อร่นขึ้นไปนิดหนึ่ง ใต้ข้อมือมีด้ายแดงพันอยู่สามรอบ ทุกคนในแถวเห็น ไม่มีใครเอ่ยถึง เช้านี้ถังถ่านบ้าน{name}เหลือแต่ฝุ่น
  choices:
    - id: buy_from_the_barrow
      label: ต่อแถวรถเข็น
      text: |
        นางตักพูนจนถ่านล้นลงพื้นก้อนหนึ่ง นางก้มเก็บใส่ตะกร้าของ{name}ให้ด้วย ถ่านจากรถเข็นติดง่ายกว่าถ่านจากลาน ไฟแดงนานกว่า คืนนั้นบ้าน{name}อุ่นถึงเช้า

        ต้นเดือนถัดมานางทักชื่อ{name}ก่อนจะถึงคิว ถามว่าปล่องเตาที่บ้านรั่วหรือเปล่า ถ่านช่องเท่านี้ควรอยู่ได้สามเย็น {name}กลับไปดู ปล่องรั่วจริง
      effects: { gold: -1, world: { demon: 1 }, flags: [bought_coal_from_the_red_thread_barrow] }
    - id: pay_the_depot
      label: ซื้อที่ลานถ่าน ช่องปาดเรียบ มีใบเสร็จ
      text: |
        คนลานถ่านปาดหัวช่องจนเห็นขอบสังกะสีรอบวง เขียนใบเสร็จให้ ลงวัน ลงน้ำหนัก ลงชื่อ{name}ผิดหนึ่งตัว เขาบอกว่าแถวรถเข็นจะยาวแค่ไหนก็ช่าง ปลายปีจะมีคนของศาลามาตรวจว่าใครซื้อถ่านจากที่ไหน ใบเสร็จนี้เก็บไว้ให้ดี ถ่านปาดเรียบช่องเดียวไม่พอ{name}ต้องซื้อสองช่อง

        สิ้นปีไม่มีใครมาตรวจ ใบเสร็จเต็มลิ้นชัก เช้าวันที่ถ่านหมดถัง{name}เอาใบเสร็จมาจุดเตา
      effects: { gold: -2, alignment: { law: 1 }, flags: [paid_the_depot_by_the_scoop] }
    - id: burn_something_else
      label: ไม่ซื้อทั้งสองที่ รื้อเก้าอี้ตัวที่ขาโยกใส่เตาแทน
      habit: tight_fist
      text: |
        เก้าอี้ตัวนั้นขาโยกมาหลายปี ไม้แห้งดี ไฟติดเร็ว หมดเร็ว อุ่นได้ครึ่งเย็น หลังจากนั้นบ้าน{name}หนาวทั้งคืน {name}นอนทั้งเสื้อคลุม ไอแห้งๆ จนเช้า

        ถึงสิ้นหน้าหนาว บ้าน{name}เหลือเก้าอี้สองตัวกับม้านั่งยาวหนึ่งตัว แขกที่มาต้องนั่งบนลังเก่า ไม่มีใครบ่น ทุกบ้านในซอยนั่งลังกันหมดแล้ว
      effects: { hp: -1, stats: { CON: 1 }, flags: [burned_the_old_chair_for_warmth] }
    - id: the_barrow_will_not_take_coin
      label: ต่อแถวรถเข็น ยื่นเหรียญให้นางเหมือนทุกคน
      requires: { trait: curse_brand }
      text: |
        ถึงคิว{name} นางตักพูนเหมือนทุกช่อง แต่ไม่รับเหรียญ นางดันมือ{name}กลับเบาๆ ด้วยหลังมือข้างที่มีด้าย บอกว่าบ้านนี้ไม่ต้อง แล้วเรียกคนถัดไป

        คนในแถวเห็นหมด เช้าวันต่อมาที่บ่อน้ำ เสียงคุยเบาลงตอน{name}เดินมาถึง แล้วกลับมาดังเท่าเดิมตอน{name}หิ้วถังกลับ
      effects: { world: { demon: 1 }, flags: [took_free_coal_from_the_barrow] }

# ---------- วัยทำงาน ----------
- id: adult.era_board_forge_cold_day
  stage: adult
  weight: 24
  scene: smithy
  when:
    age: [16, 59]
    year: [348, 360]
    location_tag: [kardin, hordun]
  text: |
    เช้าวันเตาเย็นวันแรก ย่านเตาไม่มีเสียงค้อน คนที่อยู่ย่านนี้มาทั้งชีวิตตื่นสายกว่าทุกวันเพราะไม่มีอะไรปลุก ตื่นมาแล้วไม่รู้จะลุกไปทำอะไร ปล่องทุกปล่องไม่มีควัน แมวที่เคยนอนบนขอบเตาเพราะอุ่นเดินวนหาที่นอนใหม่อยู่ทั้งเช้า

    เตาหลอมจะดับหนึ่งวันในเจ็ดวันจนกว่าถ่านจะลงราคา ใครก็รู้ว่าถ่านไม่ลง คนตีค้อนได้ค่าแรงตามไฟ ไฟไม่ติดก็ไม่มีค่าแรง ช่างใหญ่ยังมีกิน เด็กตีค้อนกับคนเป่าลมนั่งเรียงกันอยู่ริมทาง มือว่าง

    วันเตาเย็นมีงานแบบที่วันอื่นไม่มี ปล่องที่เย็นสนิทปีนเข้าไปกวาดเขม่าได้ เจ้าของเตาจ่ายค่ากวาดดีเพราะปล่องตันกินถ่านเปลือง อิฐทนไฟแตกๆ ในท้องเตายังอุ่นจากเมื่อวาน และพอถึงเที่ยง คนเป่าลมคนแรกก็เริ่มถามคนเดินผ่านว่ามีขนมปังติดตัวไหม
  choices:
    - id: climb_the_flues
      label: รับจ้างปีนเข้าไปกวาดปล่อง
      check: { stat: STR, dc: 13 }
      success:
        text: |
          ปล่องแรกแคบจนต้องหุบไหล่ ยันหลังกับผนังด้านหนึ่ง เท้ายันอีกด้าน ขยับขึ้นทีละคืบ เขม่าร่วงลงหน้าเป็นแผ่น ตกเย็น{name}กวาดได้สามปล่อง ได้ค่าจ้างเท่าค่าแรงตีค้อนสามวัน จมูกยังดำถึงเช้าวันรุ่งขึ้น

          วันเตาเย็นถัดมา มีเจ้าของเตาสองคนมายืนรอหน้าบ้าน{name}ตั้งแต่ก่อนสว่าง ยืนห่างกันคนละฟากประตู
        effects: { gold: 3, stats: { STR: 1 }, flags: [swept_flues_on_cold_day] }
      failure:
        text: |
          ปล่องที่สองมีเหล็กยึดหลวม {name}ลื่นลงมาครึ่งปล่อง ศอกครูดผนังอิฐจนหนังถลอกทั้งแถบ ปีนกลับขึ้นไปได้ แต่ทั้งวันกวาดเสร็จปล่องเดียวกับอีกครึ่ง

          เจ้าของเตาจ่ายครึ่งเดียว บอกว่าปล่องครึ่งปล่องไม่ทำให้ถ่านเปลืองน้อยลง แล้วชี้ให้ดูเหล็กยึดอันที่หลวม ถามว่าจะซ่อมให้ด้วยไหม
        effects: { hp: -2, gold: 1, flags: [swept_flues_on_cold_day] }
    - id: sell_warm_bricks
      label: ขออิฐแตกจากท้องเตา ห่อผ้าเดินขายเป็นของอุ่นเตียง
      text: |
        {name}ห่ออิฐด้วยเศษผ้ากระสอบ ก้อนละห่อ วางเรียงบนรถเข็น เดินขายตั้งแต่สาย อิฐก้อนหนึ่งอุ่นใต้ผ้าห่มได้ถึงเที่ยงคืน คนแก่ซื้อก่อน แม่ลูกอ่อนซื้อตามมา ตกบ่ายคนเป่าลมสามคนเข็นรถมาตั้งขายข้างๆ ถูกกว่าครึ่งเหรียญ

        วันเตาเย็นที่สาม อิฐแตกในท้องเตาทั้งย่านมีคนจองไว้หมดก่อนฟ้าสาง เจ้าของเตาเริ่มคิดค่าอิฐ
      effects: { gold: 2, flags: [sold_warm_bricks_on_cold_day] }
    - id: share_bread_with_the_hammermen
      label: ซื้อขนมปังไปแบ่งคนตีค้อนที่นั่งริมทาง
      habit: soft_heart
      text: |
        ขนมปังสองก้อนใหญ่แบ่งได้ไม่ถึงคนละคำครึ่ง คนตีค้อนคนหนึ่งเก็บส่วนของตัวเองใส่กระเป๋าเสื้อไว้ให้ลูก อีกคนกินแล้วเลียเศษบนนิ้ว แล้วเล่าให้{name}ฟังว่าเตาไหนในย่านไฟร้อนที่สุด เตาไหนช่างใหญ่โกงค่าแรง

        วันเตาเย็นถัดมา{name}ไม่ได้ซื้ออะไร แต่มีขนมปังวางรออยู่บนขอบทางตรงที่เดิมสามก้อน คนตีค้อนลงขันกันซื้อมาเอง แล้วเว้นที่ไว้ให้{name}นั่ง
      effects: { gold: -1, alignment: { moral: 1 }, flags: [fed_the_hammermen_on_cold_day], city: { merit: 1, here: true } }

# ---------- วัยชรา ----------
- id: elder.era_board_guild_board
  stage: elder
  weight: 24
  when:
    age: [60, 130]
    year: [345, 356]
  text: |
    ป้ายที่ตอกอยู่บนผนังศาลาปีนี้เป็นหมึกแดง ตัวเลขใหญ่เท่าฝ่ามือ บอกว่าปีที่แล้วสมาคมโรงกลั่นกลั่นน้ำค้างดาวได้กี่ถัง ข้างล่างมีเลขของปีก่อนหน้าไว้ให้เทียบ เลขบนมากกว่าทุกปี คนส่งป้ายตอกตะปูสี่มุมแน่นกว่าคนของหอดูดาวเคยตอก

    ไม่กี่วันต่อมาเสมียนของสมาคมเดินถามไปทีละบ้าน เสื้อดี รองเท้าเพิ่งขัด หนีบสมุดปกแข็งไว้ใต้แขน เขาไม่ขอคุยกับเจ้าบ้าน เขาขอคุยกับคนที่แก่ที่สุด เขามาหยุดตรงหน้า{name}

    สมุดเปิดค้างไว้หน้าหนึ่ง หัวกระดาษพิมพ์ประโยคเดียว ข้าพเจ้าจำได้ว่ากลางคืนสว่างขึ้นทุกปีมาตลอดชีวิต ใต้ประโยคเป็นช่องให้กดนิ้วโป้ง ครึ่งหน้ามีลายนิ้วแดงแล้ว ชื่อเขียนกำกับไว้ข้างๆ เขาบอกว่ากดหนึ่งนิ้ว สมาคมให้หนึ่งเหรียญ ค่ารบกวน
  choices:
    - id: press_the_thumb
      label: กดนิ้วลงไป รับเหรียญ
      text: |
        หมึกในตลับเป็นหมึกแดงตัวเดียวกับบนป้าย เสมียนเช็ดนิ้วให้{name}ด้วยผ้าขาวที่พกมา เช็ดจนสะอาดกว่าก่อนกด แล้วเขียนชื่อ{name}ไว้ข้างลายนิ้ว ลายมือเขาสวยจนอ่านชื่อตัวเองแทบไม่ออก

        ปลายปีมีป้ายแผ่นยาวตอกเพิ่มข้างป้ายถัง ประโยคเดียวกับในสมุด ใต้ประโยคมีชื่อคนแก่ของถิ่นเรียงกันสามแถว ชื่อ{name}อยู่แถวกลาง สะกดผิดหนึ่งตัว
      effects: { gold: 1, world: { star: 1 }, flags: [thumbed_the_guild_book] }
    - id: tell_him_what_nights_were
      label: บอกเสมียนว่ากลางคืนเมื่อก่อนมืดแค่ไหน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}เล่าเรื่องเดินกลับบ้านตอนเด็ก คืนเดือนมืดต้องเอามือคลำรั้วไปทีละช่วงเสา ดาวมีพอให้รู้ว่าทางไหนเหนือ ไม่พอให้เห็นหน้าคนเดินสวน ใครจุดคบไฟอยู่อีกฝั่งทุ่งก็เห็นได้จากหน้าบ้าน เสมียนฟังจนจบ ปากกาค้างอยู่เหนือสมุด ไม่ได้เขียนอะไรลงไป

          เขาไม่ยื่นตลับหมึกให้อีก ออกจากบ้าน{name}แล้วไม่ได้ไปบ้านถัดไป เดินกลับทางที่มา สองวันต่อมามีเสมียนคนใหม่มาถามบ้านที่เหลือในซอยแทน
        effects: { stats: { CHA: 1 }, flags: [told_the_guild_clerk_the_old_nights] }
      failure:
        text: |
          {name}เล่าได้ไม่ถึงครึ่ง เสมียนก็ยิ้มแบบคนรอให้คนแก่พูดจบ แล้วพลิกสมุดให้ดูหน้าก่อน ชื่อคนแก่ของถิ่นเรียงลงไปจนสุดหน้า บอกว่าทุกคนจำได้ตรงกันหมด {name}ชี้ชื่อหนึ่ง บอกว่าคนนี้ตายตั้งแต่ก่อนหน้าฝน เสมียนเอาปลายปากกาแตะชื่อนั้น แล้วปิดสมุด

          ปลายปีชื่อนั้นขึ้นป้ายข้างศาลาแถวบนสุด ตัวโตกว่าชื่ออื่น
        effects: { flags: [told_the_guild_clerk_the_old_nights] }
    - id: ask_a_price
      label: ถามว่านิ้วของคนที่แก่ที่สุดในซอยมีราคาเท่าไร
      text: |
        เสมียนตอบว่าหนึ่งเหรียญ {name}หัวเราะใส่หน้า ถามว่าสมาคมกลั่นได้กี่ถังปีนี้ เลขแดงบนป้ายนั่นน่ะ เสมียนขยับเป็นสองเหรียญ {name}รอ เขาขยับเป็นสาม กับสัญญาว่าจะเขียนชื่อให้ถูก

        พอเขาเดินไปบ้านถัดไป {name}ก็ตะโกนข้ามรั้วบอกราคาให้บ้านนั้นรู้ก่อน บ่ายนั้นคนแก่ทั้งซอยกดนิ้วกันนิ้วละสามเหรียญ เสมียนกลับไปพร้อมสมุดเต็มหน้ากับถุงเงินแฟบ
      effects: { gold: 3, world: { star: 1 }, flags: [sold_a_thumbprint_dear] }

- id: elder.era_board_dont_count_aloud
  stage: elder
  weight: 24
  time: dusk
  when:
    age: [60, 130]
    year: [344, 356]
    location_tag: ashland
  text: |
    คนแก่ของแดนเถ้ามีคำเตือนอยู่คำเดียวที่ทุกวงบ่อพูดเหมือนกัน อย่านับออกเสียง นับแพะ นับถ่าน นับเงินค่าแรง ให้นับในใจ หรือหย่อนกรวดลงหม้อทีละก้อน ใครถามว่าทำไม คนแก่ก็ตอบคำเดิมซ้ำ ช้ากว่าเดิม

    เวซรา เด็กหญิงบ้านท้ายวงบ่อ ขึ้นไปนั่งบนกองตะกรันหลังบ่อทุกหัวค่ำ เงยหน้า แล้วนับดาวออกเสียง ดังพอให้ได้ยินถึงบ่อ แม่ของนางลากลงมาสองครั้ง ครั้งที่สามนางกัดมือแม่ แล้วปีนกลับขึ้นไปนับต่อจากเลขเดิม

    หัวค่ำวันนี้{name}นั่งพักอยู่ที่ขอบบ่อ เสียงนับดังลงมาจากกองตะกรัน ร้อยสี่สิบเอ็ด ร้อยสี่สิบสอง ผู้หญิงสองคนที่รอตักน้ำหันมาทาง{name}พร้อมกัน คนแก่ของวงเหลือไม่กี่คนแล้ว
  choices:
    - id: teach_silent_count
      label: เอาหม้อดินกับกรวดกำหนึ่งไปนั่งที่ตีนกองตะกรัน
      text: |
        {name}ไม่ได้เรียก ไม่ได้ปีนขึ้นไป นั่งลงที่ตีนกอง วางหม้อดินไว้ข้างตัว แล้วหย่อนกรวดลงทีละก้อน ช้าๆ เสียงกรวดกระทบก้นหม้อดังพอให้คนข้างบนได้ยิน เสียงนับข้างบนสะดุด หยุด เริ่มใหม่ แล้วหยุดอีก สักพักเวซราไถลลงมานั่งข้างๆ แย่งกรวดไปหย่อนเอง

        ตั้งแต่คืนนั้นกองตะกรันมีเสียงกรวดลงหม้อแทนเสียงคน หม้อใบนั้นเต็มก่อนสิ้นเดือน นางมาขอใบใหม่ ใบที่สองใหญ่กว่า
      effects: { world: { land: 1 }, stats: { WIS: 1 }, flags: [taught_the_silent_count] }
    - id: bring_to_the_well_circle
      label: ยกเรื่องนี้ขึ้นวงบ่อ ให้ทุกบ้านพูดตามรอยบากของไม้เวร
      habit: sweet_tongue
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          วงบ่อพูดทีละบ้านตามรอยบาก ไม่มีบ้านไหนบอกเหตุผล ทุกบ้านพูดคำเตือนเดียวกันด้วยคำของตัวเอง ถึงตา{name} {name}ไม่พูดเรื่องดาว พูดเรื่องเด็กที่โดนห้ามโดยไม่มีใครบอกว่าห้ามทำไม แล้วเสนอให้ทุกบ้านผลัดกันขึ้นไปนั่งกับนางหัวค่ำละบ้าน พกเรื่องเล่าไปให้เต็มปาก

          คนแก่ที่สุดของวงชักถังขึ้นมาหนึ่งถัง เรื่องจบ หัวค่ำวันต่อมาบ้านแรกในรอยบากขึ้นไปนั่งบนกองตะกรันกับเวซรา เล่าเรื่องแพะหลงทางตั้งแต่ตะวันตกดินจนนางหลับคาตัก
        effects: { stats: { CHA: 1 }, world: { land: 1 }, flags: [took_the_counting_to_the_well], city: { merit: 1, here: true } }
      failure:
        text: |
          วงบ่อพูดกันจนดึก บ้านหนึ่งว่าให้ปล่อย บ้านหนึ่งว่าให้ส่งนางไปอยู่กับญาติที่อื่น แม่ของนางลุกออกจากวงก่อนถึงรอยบากของตัวเอง คนแก่ที่สุดไม่ชักถัง เรื่องยังไม่จบ

          เสียงนับจากกองตะกรันดังลงมาถึงบ่อตลอดเวลาที่วงนั่ง ไม่มีใครหันไปทางนั้นสักคน
        effects: { flags: [took_the_counting_to_the_well] }
    - id: count_in_her_place
      label: บอกนางให้ลงมา แล้วนับแทนจากขอบบ่อ ดังกว่านาง
      habit: stubborn
      requires: { trait: curse_brand }
      text: |
        {name}นับต่อจากเลขที่นางค้างไว้ เสียงดังกว่าเด็ก นับไปจนเลยหลักพัน ไม่มีอะไรเกิดขึ้น ข้างบนกองตะกรันเวซราหยุดนับ นั่งฟัง คนแก่ที่นั่งรอบบ่อลุกขึ้นยกม้านั่งของตัวเองไปตั้งอีกฝั่งของบ่อ ไม่มีใครดุ{name}สักคำ

        สองสามวันต่อมาเวซราเอาถุงผ้าใส่กรวดมาให้{name}ถุงหนึ่ง มัดปากไว้แน่น นางบอกว่าแม่ให้เอามาให้ {name}ไม่เคยแกะถุงนั้น
      effects: { stats: { CHA: 1 }, flags: [counted_aloud_in_the_childs_place] }
    - id: let_her_be
      label: ปล่อยนางนับไป ตักน้ำแล้วกลับบ้าน
      text: |
        ผู้หญิงสองคนที่รอตักน้ำไม่ว่าอะไร คนหนึ่งตักเสร็จแล้วยืนฟังเสียงนับอยู่พักหนึ่ง แล้วหิ้วถังเดินขึ้นไปทางกองตะกรันเอง {name}เดินกลับบ้านก่อนจะได้เห็นว่านางขึ้นไปทำอะไร

        ตลอดหน้าแล้งนั้นเสียงนับยังดังลงมาทุกหัวค่ำ บางคืนมีเสียงผู้ใหญ่นับคู่ไปด้วยอีกเสียงหนึ่ง
      effects: { flags: [let_the_child_count_aloud] }

- id: elder.era_board_fewer_trains
  stage: elder
  weight: 24
  scene: station
  when:
    age: [60, 130]
    year: [348, 360]
    not_location_tag: ileth
  text: |
    ป้ายเวลารถไฟที่ป้ายหยุดรถเป็นแผ่นไม้ทาขาว เขียนเที่ยวรถด้วยสีดำ บรรทัดละขบวน ทุกปีพอถ่านขึ้นราคา นายสถานีจะจุ่มแปรงลงสีดำ ทาทับบรรทัดหนึ่งทั้งบรรทัด ทาเรียบร้อย ไม่ให้ตัวหนังสือลอดออกมาสักตัว ป้ายนี้มีแถบดำมากกว่าแถบขาวแล้ว

    ปีนี้บรรทัดที่โดนทาคือขบวนเช้าวันทาลิส ขบวนยังวิ่ง แต่ไม่จอดป้ายเล็กอีก ตลาดข้างรางเกิดขึ้นเพราะขบวนนี้ แม่ค้าผ้าจากต้นราง คนขายน้ำมันตะเกียง หญิงขายปลาเค็มจากชายฝั่ง ลงตอนสาย ขึ้นเที่ยวกลับตอนบ่าย ต่อไปตลาดย้ายไปตั้งที่ป้ายถัดไป ทางเดินเลียบรางครึ่งเช้า ที่ป้ายนี้เหลือขบวนเดียวในสัปดาห์ ขบวนถ่านวันออสซา จอดเติมน้ำพักเดียว ไม่มีตู้ให้คนนั่ง

    {name}ยืนอ่านป้ายอยู่กับคนแก่อีกสามสี่คน ทุกคนมีของต้องซื้อจากตลาดวันทาลิส ทุกคนกำลังคิดเรื่องเดียวกัน ของอย่างไหนจะยังซื้อ อย่างไหนจะเลิก
  choices:
    - id: order_a_month
      label: สั่งของทั้งเดือนไว้กับแม่ค้าในตลาดนัดสุดท้าย
      text: |
        ตลาดนัดสุดท้าย{name}เดินทุกแผง จ่ายมัดจำ สั่งให้ส่งมาเดือนละห่อกับขบวนถ่าน ต้นเดือนถัดมาห่อผ้าใบลงจากขบวนวันออสซา คนห้ามล้อโยนลงมาบนชานชาลาตอนรถยังไม่หยุดดี เชือกขาดไปเส้นหนึ่ง ของหกออกมาครึ่งห่อ

        ปลาเค็มกับน้ำมันตะเกียงห่อรวมกันมา ทั้งเดือนนั้นบ้าน{name}จุดตะเกียงทีไรก็ได้กลิ่นปลา
      effects: { gold: -2, flags: [ordered_a_month_from_the_train] }
    - id: give_up_a_pleasure
      label: เลิกของที่ไม่จำเป็นอย่างเดียว ขนมขิงของหญิงขายปลา
      habit: tight_fist
      text: |
        ขนมขิงห่อใบไม้เป็นของอย่างเดียวที่{name}ซื้อให้ตัวเองทุกวันทาลิส วันนัดสุดท้าย หญิงขายปลาจำได้ ยื่นห่อสุดท้ายให้โดยไม่รับเงิน บอกว่าที่ชายฝั่งก็ไม่มีรถจอดหน้าบ้านนางแล้วเหมือนกัน

        ห่อสุดท้าย{name}แบ่งกินทีละชิ้นเล็กอยู่สามสัปดาห์ เงินค่าขนมทั้งปีลงไปอยู่ในโถบนชั้นเหนือเตา ใบที่ห่อพับเก็บไว้ในลิ้นชัก กลิ่นขิงอยู่ได้นานกว่าขนม
      effects: { stats: { WIS: 1 }, gold: 1, flags: [gave_up_the_train_pleasure] }
    - id: walk_to_the_next_halt
      label: เดินเลียบรางไปตลาดที่ป้ายถัดไปทุกวันทาลิส
      habit: stubborn
      check: { stat: CON, dc: 12 }
      success:
        text: |
          {name}ออกตั้งแต่ไก่ขัน ถึงตอนแม่ค้าเพิ่งตั้งแผง ได้ของครบ กลับถึงบ้านตอนตะวันบ่าย ขาตึงไปสองวัน วันทาลิสถัดไปมีคนแก่ในถิ่นสองคนมายืนรอหน้าบ้าน{name} ถามว่าจะไปไหม

          สิ้นหน้าฝนพวกเดินเลียบรางมีกันเจ็ดคน เดินช้าเท่าคนที่ช้าที่สุด แต่ไปถึงตลาดทันทุกครั้ง
        effects: { stats: { CON: 1 }, flags: [walked_to_the_next_halt] }
      failure:
        text: |
          ไปได้ครึ่งทาง เข่าข้างหนึ่งเริ่มไม่ยอม {name}นั่งพักบนหมอนรางสองหน ขบวนวันทาลิสวิ่งผ่านไปโดยไม่ชะลอ คนขายน้ำมันตะเกียงโบกมือให้จากหน้าต่าง

          {name}ไปถึงตลาดตอนแม่ค้ากำลังเก็บแผง ได้ปลาเค็มตัวสุดท้ายราคาครึ่งเดียว ขากลับขอติดเกวียนฟางมาถึงหัวถิ่น
        effects: { hp: -1, flags: [walked_to_the_next_halt] }
    - id: ride_the_coal_train
      label: ขอนายสถานีให้ได้ขึ้นขบวนถ่านวันออสซาไปถึงชุมทาง
      habit: sweet_tongue
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          นายสถานีบอกว่าขบวนถ่านไม่มีที่นั่ง {name}บอกว่าไม่ได้ขอที่นั่ง ขอแค่ที่ เขาหัวเราะ เดินไปคุยกับคนห้ามล้อ {name}ได้นั่งบนกระสอบในตู้ท้ายขบวนไปถึงชุมทาง ที่ที่ร้านเปิดทุกวัน กลับมากับขบวนเดียวกันตอนค่ำ หน้าดำไปครึ่งหน้า

          ตั้งแต่นั้นทุกวันออสซา ตู้ท้ายขบวนมีที่ว่างบนกระสอบหนึ่งที่ คนห้ามล้อปัดฝุ่นถ่านออกให้ก่อน{name}นั่ง
        effects: { stats: { CHA: 1 }, flags: [asked_to_ride_the_coal_train] }
      failure:
        text: |
          นายสถานีบอกว่ากฎของนายรางห้ามคนขึ้นขบวนถ่าน ห้ามทุกคน ตอนแม่ของเขาป่วย เขาก็เคยถามนายรางแบบเดียวกันนี้

          วันออสซาถัดมาขบวนถ่านจอดเติมน้ำ {name}ยืนดูคนห้ามล้อเปิดประตูตู้ท้ายขบวนระบายควัน ข้างในว่างทั้งตู้ กระสอบเปล่าปูไว้เต็มพื้น
        effects: { flags: [asked_to_ride_the_coal_train] }
