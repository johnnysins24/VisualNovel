# ชุด 3b–3c วัยผู้ใหญ่ อายุ 25 ถึง 40: เหตุการณ์ประจำงานสายนักเวทและนักบวช งานละ 2 เรื่อง
# เรื่องแรก (25–32) ชื่อเสียงและหนี้ เรื่องที่สอง (33–40) ฟ้าที่เปลี่ยนไป น้ำหนัก 45 ไม่ผูกปี
# นักวิจัยที่ซ่อนเขา (horns_sawn) มาถึงทั้งสองเรื่อง จึงไม่มีฉากไหนพึ่งเสียงหึ่ง เรื่องคนมีเขามีตัวเลือกของคนมีเขาเอง
# สายนี้ไม่มีจุดตาย เปลี่ยนงานกลางทาง (26–31 น้ำหนัก 15) อยู่ท้ายไฟล์ สถาบันเวทหลวงไม่รับคนมีเขาเว้นเลื่อยเขาแล้ว ตาม L14

- id: adult.mid_artificer_key
  stage: adult
  scene: golem_shop
  weight: 45
  when:
    age: [25, 32]
    flags: [job_artificer]
  text: |
    หน้าหนาวปีหนึ่ง ตาข้างที่ยังดีของฮาลเดนขุ่นตามข้างแรกไปอีกข้าง เขาร้อยลวดผ่านรูเฟืองไม่ลงเป็นครั้งแรกในรอบสี่สิบปี วางคีมลง แล้ววางกุญแจร้านไว้บนโต๊ะงานของ{name} บอกว่าตั้งแต่พรุ่งนี้เขาจะนั่งเก้าอี้ข้างเตา คอยด่าคนที่ทำงานพลาด ลูกค้าทั้งหมดกับค่าเช่าร้านเป็นของ{name}

    เดือนเดียวกัน ฝั่งตรงข้ามถนนมีร้านใหม่มาเปิด ช่างคนแคระชื่อดาร์รุก ตระกูลทั่งคู่ ขนเครื่องกลึงเหล็กมาสองเครื่อง กลึงเฟืองได้วันละร้อยตัว ทุกตัวเท่ากันไม่ผิดกันสักเส้นผม ราคาครึ่งหนึ่งของเฟืองที่{name}ตะไบมือ ลูกค้าเก่าของฮาลเดนข้ามถนนไปทีละคน

    วันที่สาม เสมียนวิหารเบเลคมายืนหน้าร้าน ถือสัญญากู้สิบเหรียญสำหรับเครื่องกลึงเครื่องแรก ดอกต่ำ ผ่อนสิบปี ลงชื่อวันนี้ เครื่องมาถึงวันมะรืน
  choices:
    - id: borrow_lathe
      label: ลงชื่อกู้สิบเหรียญ ซื้อเครื่องกลึงมาแข่ง
      text: |
        {name}ลงชื่อในช่องที่เสมียนชี้ ปลายนิ้วเย็นวาบขึ้นมาครู่หนึ่งเหมือนจุ่มน้ำบ่อ แล้วหายไป เครื่องกลึงมาถึงวันมะรืนตามที่บอก ฮาลเดนนั่งฟังเสียงมันหมุนจากเก้าอี้ข้างเตา บอกว่าเสียงเหมือนแมลงวันติดขวด

        เดือนแรก{name}กลึงเฟืองได้วันละหกสิบตัว เดือนที่สามได้ร้อย ลูกค้าเริ่มข้ามถนนกลับมาทีละคน สมุดผ่อนหนี้ของวิหารเบเลควางอยู่ใต้กุญแจร้าน ยังเหลืออีกร้อยสิบเจ็ดช่อง
      effects: { gold: -10, debt: true, stats: { INT: 1 }, reputation: { belek_bank: 1 }, flags: [artificer_belek_loan] }
    - id: partner_dwarf
      label: ข้ามถนนไปชวนดาร์รุกแบ่งงานกัน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}เอาเฟืองตะไบมือตัวหนึ่งไปวางบนโต๊ะของดาร์รุก เป็นเฟืองข้อนิ้วของแขนกล ฟันไม่เท่ากันทุกซี่ เพราะนิ้วคนไม่ได้งอเท่ากันทุกข้อ เครื่องกลึงของเขาทำแบบนี้ไม่ได้ ดาร์รุกหมุนเฟืองตัวนั้นในนิ้วอยู่ครู่ใหญ่ แล้วถามว่าใครสอน

          สิ้นเดือนสองร้านแบ่งงานกัน ร้านฝั่งโน้นกลึงเฟืองธรรมดา ร้านฝั่งนี้ทำข้อนิ้ว ข้อเท้า ข้อที่ต้องงอให้เหมือนคน ส่วนแบ่งเดือนแรกสี่เหรียญ ฮาลเดนกับดาร์รุกนั่งดื่มกันข้างเตาจนดึก เถียงกันเรื่องเหล็กทุกคืน
        effects: { stats: { INT: 1 }, reputation: { dwarf_council: 1 }, gold: 4, flags: [partnered_darrug] }
      failure:
        text: |
          ดาร์รุกฟังจบแล้วหัวเราะ บอกว่าตระกูลทั่งคู่ไม่แบ่งร้านกับใครนอกตระกูลมาตั้งแต่สงครามถ่าน เช้าวันรุ่งขึ้นเขาลดราคาเฟืองลงอีกหนึ่งในสี่ ป้ายราคาใหม่หันหน้ามาทางร้านของ{name}พอดี
        effects: { flags: [darrug_rival] }
    - id: work_nights
      label: ไม่กู้ ไม่ขอ ตะไบเฟืองทั้งกลางวันกลางคืนแข่งเอง
      check: { stat: CON, dc: 13 }
      success:
        text: |
          เตาในร้านไม่เคยเย็นอีกเลยทั้งหนาว {name}ตะไบเฟืองตอนกลางคืน ส่งของตอนเช้า นอนบนม้านั่งหลังร้านตอนบ่าย ลูกค้าที่ข้ามถนนไปแล้วไม่ได้กลับมา แต่ลูกค้าที่ยังอยู่ก็ไม่ข้ามไปอีก

          ปลายหนาว ฮาลเดนยื่นแว่นช่างของเขาให้ เลนส์สองชั้นพับขึ้นลงได้ ขอบทองเหลืองดำไปตามเหงื่อสี่สิบปี เขาบอกว่าคนทำงานกลางคืนต้องมีตาดีกว่าคนทำงานกลางวัน ตาของเขาไม่ต้องใช้แว่นแล้ว เดือนนั้นร้านเหลือกำไรสามเหรียญ
        effects: { stats: { CON: 1 }, gold: 3, items: [haldan_goggles] }
      failure:
        text: |
          เดือนที่สอง มือขวาของ{name}ชาตอนตีสาม ตะไบลื่นไปกรีดโคนนิ้วโป้งลึกจนเห็นเอ็น ฮาลเดนคลำหาด้ายกับเข็มเอง แล้วเย็บแผลให้ทีละเข็มด้วยมือที่จำงานได้ดีกว่าตา

          {name}ทำงานไม่ได้สิบวัน ลูกค้าข้ามถนนไปอีกสามคน
        effects: { hp: -2, flags: [artificer_overwork] }
    - id: veterans_shop
      label: ไปหาชายแก่แขนขอเหล็ก คนที่ได้มือมีนิ้วไปเมื่อหลายปีก่อน
      requires: { flag: built_veteran_hand }
      text: |
        ชายแก่คนนั้นยังใช้มือที่{name}ทำให้ ข้อนิ้วสึกจนเป็นมัน หลานสาวโตจนจูงเขาเดินแทนแล้ว เขาฟังเรื่องร้านฝั่งตรงข้ามจนจบ แล้วบอกว่าทหารเกณฑ์ที่เสียแขนเสียขาในสงครามถ่านยังอยู่ในถิ่นนี้อีกหลายสิบคน ทุกคนใส่ขอเหล็กที่ราชสำนักแจก ไม่มีใครเคยได้มือที่จับมือหลานได้

        สัปดาห์ต่อมามีทหารผ่านศึกมายืนรอหน้าร้านตั้งแต่ก่อนเปิด เดินเข้าร้านของ{name}ทีละคนโดยไม่หันไปทางฝั่งตรงข้าม มัดจำงานเดือนแรกรวมได้หกเหรียญ
      effects: { gold: 6, alignment: { moral: 1 }, flags: [veterans_shop] }

- id: adult.mid_artificer_golems
  stage: adult
  scene: golem_shop
  weight: 45
  when:
    age: [33, 40]
    flags: [job_artificer]
  text: |
    ร้านของ{name}ซ่อมหุ่นยามมาหลายปี ไม่เคยมีปีไหนที่หุ่นเข้าร้านด้วยอาการแบบนี้มากเท่าปีนี้ หุ่นพวกนี้ไม่ได้เสีย แต่ทำงานเกินคำสั่ง หุ่นในโกดังยกของที่ไม่มีใครสั่งให้ยก หุ่นเฝ้าประตูเปิดประตูให้คนที่ไม่มีใครสั่งให้เปิด ทุกตัวยังทำงานได้ดี แค่ไม่ใช่งานของเจ้าของ

    ตัวล่าสุดเป็นหุ่นขนผ้าของพ่อค้าผ้าในตลาด ขึ้นไปยืนบนหลังคาร้านทุกคืนตั้งแต่ต้นเดือน หันหน้าไปทางเหนือ ทางดาวดวงใหม่ดวงหนึ่งที่สว่างขึ้นทุกคืน พ่อค้าจ้างคนสี่คนลากหุ่นมาถึงร้าน หลอดแสงในอกเต้นวูบวาบ ช้าบ้างเร็วบ้าง ไม่ตรงกับจังหวะเฟืองข้างในเลยสักครั้ง

    ทิเวน ลูกมืออายุสิบห้าของ{name} มือเร็วกว่าตา ถือไขควงรออยู่ข้างโต๊ะ ส่วนนิ้วของ{name}ปีนี้เริ่มแข็งตอนเช้า ต้องแช่น้ำอุ่นก่อนจะจับลวดเส้นเล็กได้
  choices:
    - id: swap_tube
      label: ถอดหลอดเก่าทิ้ง ใส่หลอดใหม่ คิดเงินตามปกติ
      text: |
        {name}ถอดหลอดแสงออกจากอกหุ่น ใส่หลอดใหม่จากลังที่โรงกลั่นส่งมา หลอดใหม่เรืองนิ่ง เต้นตรงจังหวะเฟือง หุ่นยกม้วนผ้าได้ตามคำสั่ง ไม่ขึ้นหลังคาอีก พ่อค้าจ่ายสี่เหรียญ

        หลอดเก่า{name}ทุบทิ้งในถังเศษแก้วหลังร้าน แสงที่หกออกมาไม่ดับทันที ซึมลงไปในรอยแตกของผนังอิฐ เรืองอยู่ตรงนั้นจางๆ อีกสามคืน
      effects: { gold: 4, alignment: { law: 1 }, flags: [smashed_counting_tube] }
    - id: study_it
      label: ต่อหลอดเข้ากับเข็มขีดจังหวะ นั่งดูทั้งคืนว่ามันเต้นตามอะไร
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}ต่อลวดจากหลอดเข้ากับเข็มเหล็กที่ขีดลงบนกระดาษม้วน ให้ม้วนหมุนช้าๆ ทั้งคืน ตอนสาง กระดาษยาวสิบศอกมีรอยขีดตั้งแต่ต้นจนปลาย รอยขีดไม่ได้มาสะเปะสะปะ มาเป็นชุด ชุดหนึ่งแล้วเว้น แล้วอีกชุด ชุดหลังยาวกว่าชุดก่อนหนึ่งขีดเสมอ

          {name}นับอยู่ครึ่งวันจึงรู้ว่าหลอดนั้นนับอะไร ตัวเลขชุดสุดท้ายตรงกับจำนวนดาวที่หอดูดาวหลวงประกาศไว้ปลายปีก่อน แล้วเกินไปอีกสามดวง {name}ม้วนกระดาษเก็บใส่กระบอกเหล็ก ไม่ได้ส่งให้ใคร
        effects: { stats: { INT: 1 }, world: { star: 1 }, flags: [counted_the_tube] }
      failure:
        text: |
          เข็มเหล็กขีดได้ครึ่งคืน แล้วหลอดก็ร้อนขึ้นเรื่อยๆ จนแก้วร้าว {name}เอื้อมมือไปถอดลวดตอนที่มันแตก เศษแก้วกับแสงสาดเข้าหน้า ตาซ้ายมองไม่เห็นไปสามวัน

          พอกลับมาเห็น ในตาข้างนั้นมีจุดสีฟ้าเล็กๆ ลอยอยู่ทุกครั้งที่หลับตา จุดนั้นไม่เคยหายไปอีก
        effects: { hp: -2, flags: [tube_spot_in_eye] }
    - id: teach_tiven
      label: ให้ทิเวนแกะเอง ส่วนตัวเองจับคีมประคองหลอดไว้
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}จับคีมประคองหลอดไว้นิ่ง ให้ทิเวนไล่คลายเฟืองทีละตัว บอกชื่อเฟืองทุกตัวก่อนเขาจะแตะ เฟืองตัวที่สิบสองเป็นตัวที่หุ่นยามทุกตัวมี และช่างทุกคนต้องจำให้ได้ก่อนตัวอื่น ทิเวนหาเจอเอง เฟืองตัวนั้นหมุนกลับทิศอยู่ ไม่มีใครในร้านเคยเห็นมันหมุนกลับทิศมาก่อน

          ทิเวนตั้งเฟืองกลับทางเดิม หุ่นลงจากโต๊ะเดินไปยืนรอที่ประตูตามคำสั่ง ตกเย็นเขาถามว่าเฟืองหมุนกลับเองได้อย่างไร {name}บอกตามจริงว่าไม่รู้
        effects: { stats: { DEX: 1 }, flags: [taught_tiven] }
      failure:
        text: |
          มือของ{name}สั่นตอนทิเวนคลายเฟืองตัวที่สิบสอง คีมลื่น หลอดแสงหลุดจากคีม ทิเวนคว้าไว้ด้วยมือเปล่าแล้วร้องลั่น {name}ดึงหลอดออกจากมือเขา ฝ่ามือของ{name}ไหม้ไปครึ่งฝ่ามือ ของทิเวนไหม้แค่ปลายนิ้ว

          แผลหายภายในเดือน ทิเวนทำงานต่อด้วยนิ้วพันผ้า ไม่บ่นสักครั้ง
        effects: { hp: -3, flags: [taught_tiven] }
    - id: haldan_trick
      label: ดึงหลอดคำสั่งออกด้วยมือเปล่า แบบที่ฮาลเดนทำในวันที่หัวแตก
      requires: { flag: woke_the_golem }
      text: |
        หลายปีมาแล้ว{name}จำได้ว่าฮาลเดนทำอย่างไร ไม่ได้ใช้แรง ใช้จังหวะ หลอดคำสั่งหลวมที่สุดตอนเฟืองตัวที่สิบสองหมุนครบรอบ {name}วางมือบนอกหุ่น รอจนแสงวูบช้าลง แล้วดึงขึ้นในครั้งเดียว หลอดหลุดออกมาอยู่ในมือ อุ่น ไม่ร้อน หุ่นนิ่งไปทั้งตัว

        ฮาลเดนนั่งอยู่ข้างเตา ตามองไม่เห็นแล้ว แต่ได้ยินเสียงหลอดหลุด เขาถามว่าหัวแตกไหม {name}บอกว่าไม่ เขาบอกว่างั้นแปลว่าทำได้แล้ว แล้วหลับต่อ
      effects: { stats: { DEX: 1 }, flags: [haldan_trick] }

- id: adult.mid_researcher_seat
  stage: adult
  scene: institute
  weight: 45
  when:
    age: [25, 32]
    flags: [job_researcher]
  text: |
    ตำแหน่งผู้ช่วยอาจารย์ของตึกตะวันตกว่างลงในปีที่อาจารย์ผมขาวคนเก่าเกษียณไปอยู่กับลูกสาวที่ชายฝั่ง ได้ห้องทำงานที่มีหน้าต่าง ได้เงินเดือนเพิ่มสี่เหรียญ ได้ลูกศิษย์สองคน และได้เสียงหนึ่งเสียงในที่ประชุมว่าเงินทุนปีหน้าจะไปตึกไหน

    คนชิงตำแหน่งมีสองคน {name}กับเมรอน ฮาสทิล นักวิจัยฝ่ายกลั่น เมรอนมีอาจารย์ใหญ่ฝ่ายกลั่นหนุนหลัง และมีเจ้าของโรงกลั่นสองคนนั่งฟังอยู่ในวันที่ทุกคนต้องยืนเสนองานต่อที่ประชุม

    ตารางตัวเลขที่ดีที่สุดในตึกตะวันตกปีนี้ไม่ใช่ของ{name} เป็นของเซเลน คอร์ดิส ห้องข้างๆ ที่ไม่เคยปิดประตู ตารางนั้นนับน้ำค้างที่กลั่นได้จากดาวแต่ละดวงย้อนหลังสิบปี เธอเอามาวางไว้บนโต๊ะของ{name}เมื่อคืน ไม่มีจดหมายแนบ
  choices:
    - id: present_own
      label: ยืนเสนองานของตัวเอง
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}เสนองานของตัวเองจนจบ ตอบคำถามเจ้าของโรงกลั่นทั้งสองคนโดยไม่ต้องก้มดูกระดาษ เมรอนถามคำถามสุดท้ายเพื่อให้{name}ตอบผิด {name}ตอบได้ และตอบยาวกว่าที่เขาอยากฟัง

          ที่ประชุมให้ตำแหน่งกับ{name} ห้องใหม่มีหน้าต่างหันไปทางแม่น้ำ และเปิดได้ เงินเดือนเพิ่มสี่เหรียญ ตารางของเซเลนวางอยู่บนโต๊ะใหม่ ยังไม่มีใครเปิดอ่านนอกจาก{name}
        effects: { stats: { INT: 1 }, reputation: { royal_institute: 1 }, gold: 4, flags: [institute_assistant] }
      failure:
        text: |
          งานของ{name}ดี แต่งานของเมรอนมีเจ้าของโรงกลั่นสองคนยืนยันว่าเงินทุนจะไหลมาถึงสถาบันทันที ที่ประชุมให้ตำแหน่งเขา ด้วยคะแนนห่างกันเสียงเดียว

          วันแรกในห้องใหม่ เมรอนส่งลูกศิษย์มาขอยืมสมุดจดของ{name}ไปดู บอกว่าอาจารย์อยากเห็นว่าคนที่แพ้ห่างหนึ่งเสียงทำงานแบบไหน
        effects: { flags: [meron_rival] }
    - id: side_distillers
      label: ถอนตัว เข้าข้างเมรอน แลกกับห้องทดลองในโรงกลั่นริมแม่น้ำ
      text: |
        {name}ไปหาอาจารย์ใหญ่ฝ่ายกลั่นก่อนวันประชุม บอกว่าจะไม่ชิง ขอแค่ห้องทดลองในโรงกลั่นริมแม่น้ำกับเงินทุนของตัวเอง อาจารย์ใหญ่ยิ้มเป็นครั้งแรกที่{name}เคยเห็น

        เมรอนได้ตำแหน่ง {name}ได้ห้องในโรงกลั่น ได้เงินทุนก้อนแรกหกเหรียญ และได้ชื่ออยู่ในรายชื่อคนที่ฝ่ายกลั่นจะเรียกใช้ก่อน หม้อกลั่นในห้องนั้นใหม่กว่าของสถาบันสิบปี
      effects: { gold: 6, reputation: { royal_institute: 1, distillers: 1 }, flags: [sided_with_distillers] }
    - id: present_celen
      label: ยืนเสนอตารางของเซเลน ในนามของเธอ
      text: |
        {name}ยืนต่อหน้าที่ประชุม บอกว่างานที่ดีที่สุดในตึกตะวันตกปีนี้ไม่ใช่ของตัวเอง แล้วกางตารางของเซเลนลงบนโต๊ะ อ่านทีละแถวจนครบสิบปี เจ้าของโรงกลั่นสองคนเลิกกระซิบกันตั้งแต่แถวที่สาม

        ที่ประชุมไม่ให้ตำแหน่งกับเซเลนเพราะเธอไม่ได้มายืนเอง และไม่ให้กับ{name}เพราะ{name}ไม่ได้เสนองานของตัวเอง เมรอนได้ไป คืนนั้นประตูห้องข้างๆ ปิดเป็นครั้งแรก แล้วเปิดออกอีกทีตอนเที่ยงคืน เซเลนยื่นชาแก้วหนึ่งมาให้ แล้วกลับเข้าห้องไป
      effects: { stats: { INT: 1 }, reputation: { star_hall: 1 }, flags: [presented_celens_table] }
    - id: claim_back
      label: ทวงชื่อของตัวเองคืนในใบรายงานสูตรโหลแก้ว
      requires: { flag: improved_distilling }
      check: { stat: INT, dc: 13 }
      success:
        text: |
          สูตรเก็บแสงในโหลแก้วที่โรงกลั่นริมแม่น้ำใช้อยู่ทุกวันนี้ ใบรายงานยังมีชื่อ{name}อยู่บรรทัดที่สาม {name}เอาสมุดจดที่ทำสูตรนั้นมากางต่อหน้าที่ประชุม ทุกหน้าลงวันที่ ทุกหน้าลายมือเดียว แล้วถามอาจารย์สองคนที่ชื่ออยู่บรรทัดแรกกับบรรทัดที่สองว่าฝาโหลใช้ขี้ผึ้งชนิดไหน

          ไม่มีใครตอบได้ ที่ประชุมให้ตำแหน่งกับ{name} พร้อมเงินเดือนเพิ่มสี่เหรียญ ใบรายงานฉบับใหม่มีชื่อเดียว
        effects: { stats: { INT: 1 }, reputation: { royal_institute: 1 }, gold: 4, flags: [institute_assistant] }
      failure:
        text: |
          อาจารย์บรรทัดแรกตอบได้ เพราะเขาเปิดอ่านสมุดของ{name}ไว้แล้วตั้งแต่ปีนั้น ที่ประชุมจดลงบันทึกว่า{name}กล่าวหาอาจารย์อาวุโสโดยไม่มีมูล เมรอนได้ตำแหน่งไปโดยไม่ต้องเสนออะไรเลย
        effects: { reputation: { royal_institute: -1 }, flags: [meron_rival] }

- id: adult.mid_researcher_curve
  stage: adult
  scene: institute
  weight: 45
  when:
    age: [33, 40]
    flags: [job_researcher]
  text: |
    หลายปีแล้วที่{name}จดน้ำค้างที่กลั่นได้จากดาวทุกดวงในแผนที่ ตั้งแต่ดวงที่ขึ้นก่อน{name}เกิดจนถึงดวงที่ขึ้นเมื่อเดือนก่อน กระดาษตารางวางซ้อนกันสูงถึงเข่า ตาข้างขวาของ{name}ต้องใช้แว่นขยายตอนอ่านตัวเลขแถวล่าง

    ปลายปี ราชสำนักขอรายงานจากสถาบันฉบับหนึ่ง ใช้อ่านต่อหน้าสภาขุนนางตอนพิจารณาเงินกู้สร้างโรงกลั่นแห่งใหม่สามโรง ใบขอเขียนชัดว่าอยากได้ตัวเลขที่แสดงว่าน้ำค้างดาวเพิ่มขึ้นอย่างมั่นคง เป็นเส้นตรงขึ้นทีละขั้น ใครอ่านก็เข้าใจ

    ตัวเลขของ{name}ไม่ได้เป็นเส้นตรง ดาวขึ้นใหม่ปีละมากขึ้นทุกปี น้ำค้างก็มากขึ้นตาม เส้นที่ได้โค้งขึ้นเหมือนเชือกที่มีคนดึงปลาย และปลายเส้นชันขึ้นทุกปี
  choices:
    - id: straight_line
      label: วาดเส้นตรงตามที่ราชสำนักขอ
      text: |
        {name}ลากเส้นตรงจากจุดแรกไปจุดสุดท้าย จุดตรงกลางที่ไม่อยู่บนเส้นเก็บใส่ลิ้นชัก เส้นนั้นสวย อ่านง่าย ขุนนางในสภาอ่านเข้าใจตั้งแต่บรรทัดแรก สภาอนุมัติเงินกู้ทั้งสามโรงในวันเดียว ราชสำนักส่งเงินรางวัลมาให้หกเหรียญ กับจดหมายขอบคุณที่ลงตราสีน้ำเงิน

        ลิ้นชักที่เก็บจุดตรงกลางไว้ {name}ใส่กุญแจ แล้ววางกุญแจไว้ใต้โหลแก้วใบหนึ่งบนชั้น
      effects: { gold: 6, reputation: { crown: 1, royal_institute: 1 }, alignment: { law: 1 }, flags: [drew_the_straight_line] }
    - id: true_curve
      label: ส่งเส้นโค้งตามจริง พร้อมตารางทุกแผ่น
      text: |
        {name}ส่งรายงานตามจริง เส้นโค้งหนึ่งเส้น ตารางหนึ่งร้อยสิบสองแผ่น กับบรรทัดเดียวใต้เส้นว่า ไม่มีอะไรโตแบบนี้ได้ตลอดไป อาจารย์ใหญ่ฝ่ายกลั่นตัดบรรทัดนั้นออกก่อนรายงานจะไปถึงสภา แล้วส่งกลับมาให้{name}ดูว่าตัดตรงไหน

        สภาอนุมัติเงินกู้สองโรง ไม่ใช่สาม ปีต่อมาเงินทุนของ{name}ลดลงครึ่งหนึ่ง เดือนเดียวกันนั้นจดหมายจากหอนับดาวไอเลธมาถึง ขอสำเนาตารางทั้งหนึ่งร้อยสิบสองแผ่น
      effects: { stats: { INT: 1 }, reputation: { star_hall: 1, royal_institute: -1 }, flags: [sent_true_curve] }
    - id: send_to_ileth
      label: วาดเส้นตรงให้ราชสำนัก แล้วแอบลอกเส้นจริงส่งไปไอเลธ
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ลอกตารางทั้งหมดลงกระดาษบางด้วยลายมือตัวเล็กที่สุดที่ตายังอ่านไหว สิบสองคืน ม้วนใส่กระบอกไม้ไผ่ ฝากไปกับคนส่งจดหมายที่ขึ้นทางตะวันตกทุกต้นเดือน ส่วนรายงานถึงราชสำนักเป็นเส้นตรงสวยตามที่ขอ

          ฤดูต่อมามีจดหมายตอบกลับมาจากไอเลธ ลายมือยาวเอียงแบบเอลฟ์ บรรทัดเดียว เขียนว่าตัวเลขของ{name}ตรงกับของหอนับดาวทุกปี ต่างกันแค่ปีสุดท้าย และของ{name}สูงกว่า
        effects: { stats: { DEX: 1 }, reputation: { star_hall: 1 }, flags: [sent_numbers_to_ileth] }
      failure:
        text: |
          ลูกศิษย์คนหนึ่งของ{name}เห็นกระบอกไม้ไผ่บนโต๊ะคนส่งจดหมาย แล้วเล่าให้อาจารย์ใหญ่ฟังด้วยความภูมิใจในอาจารย์ของตัวเอง สถาบันไม่ลงโทษ แต่สั่งว่าตารางทุกแผ่นที่ออกจากตึกตะวันตกต้องผ่านโต๊ะอาจารย์ใหญ่ก่อน

          กระบอกไม้ไผ่ใบนั้นไปไม่ถึงไอเลธ
        effects: { reputation: { royal_institute: -1 }, flags: [institute_reads_your_mail] }
    - id: jar_clock
      label: เอาโหลแก้วที่แสงรั่วขึ้นเพดานมาวางเทียบกับตาราง
      requires: { flag: light_leaks_upward }
      text: |
        โหลแก้วใบนั้นยังอยู่บนชั้นของ{name}มาตลอด {name}เก็บแสงใส่ใหม่ทุกคืนฟ้าเปิด และทุกคืนแสงในโหลยังไหลขึ้นไปทางเพดาน แต่ไม่ใช่ตีสามแล้ว {name}จดเวลาไว้ทุกคืนมาหลายปี ปีแรกตีสาม ปีที่ห้าตีสองครึ่ง ปีนี้ตีหนึ่งกับอีกนิด

        {name}วางเวลาของโหลทับลงบนเส้นโค้งของดาว สองเส้นซ้อนกันสนิท คืนนั้น{name}นั่งเฝ้าโหลจนถึงเวลาที่แสงเริ่มไหล แล้วจดลงขอบตาราง เร็วกว่าเมื่อคืนเท่าเวลาที่เทียนหยดลงหนึ่งหยด
      effects: { stats: { INT: 1 }, world: { star: 1 }, flags: [jar_clock] }

- id: adult.mid_hedge_offer
  stage: adult
  scene: healer
  weight: 45
  when:
    age: [25, 32]
    flags: [job_hedge_doctor]
  text: |
    ห้องเหนือร้านปลาเค็มทุกวันนี้มีเตียงสามเตียง กับลูกมือหนึ่งคน เมฆต่ำ เด็กมีเขาอายุสิบเจ็ดที่โตมาในวิหารอีเซล นางมาเคาะประตูเมื่อปีก่อน บอกว่าแม่ชีสอนให้ต้มผ้าได้ เย็บแผลได้ และไม่กลัวเลือด {name}ลองให้เย็บแผลหนึ่งแผล แผลนั้นหายเป็นเส้นเดียว ไม่มีรอยดึง

    บ่ายวันหนึ่ง หมอของสมาคมโรงกลั่นขึ้นบันไดมาถึงห้อง เสื้อคลุมสีนวลสะอาดผิดย่าน เขานั่งลงบนเตียงว่างโดยไม่ถาม แล้ววางกระดาษสองแผ่นบนโต๊ะ แผ่นแรกเป็นใบอนุญาตรักษาที่ลงตราสมาคมไว้แล้ว แผ่นที่สองเป็นสัญญาจ้าง เดือนละสิบเหรียญ งานมีอย่างเดียว คนไข้ผิวแก้วทุกคนที่ขึ้นบันไดนี้ ให้ส่งชื่อไปที่สมาคม

    ก่อนลุก เขาหันไปทางเมฆต่ำที่กำลังต้มผ้าอยู่หลังห้อง แล้วบอกว่ามีข้อสุดท้ายในสัญญาอีกข้อ สมาคมไม่จ้างคนมีตรา
  choices:
    - id: accept_license
      label: ลงชื่อรับใบอนุญาต แล้วให้เมฆต่ำไปหางานที่อื่น
      text: |
        {name}ลงชื่อทั้งสองแผ่น หมอสมาคมพับใบสัญญาใส่อกเสื้อ ทิ้งใบอนุญาตไว้บนโต๊ะ กับเงินเดือนแรกสิบเหรียญ เย็นนั้นเมฆต่ำพับผ้าที่ต้มเสร็จจนครบทุกผืน วางซ้อนไว้ปลายเตียง แล้วลงบันไดไป ไม่ได้เอาอะไรไปเลยนอกจากเข็มเย็บแผลของตัวเอง

        ใบอนุญาตใส่กรอบไม้แขวนข้างประตู คนไข้เพิ่มขึ้นเท่าตัวในเดือนเดียว คนไข้ผิวแก้วหายไปจากบันไดทั้งหมดในเดือนเดียวกัน
      effects: { gold: 10, reputation: { distillers: 1 }, alignment: { law: 1, moral: -1 }, flags: [guild_licensed] }
    - id: refuse_license
      label: ไม่ลงชื่อ ส่งกระดาษคืนทั้งสองแผ่น
      text: |
        {name}พับกระดาษทั้งสองแผ่นรวมกันแล้วยื่นคืน หมอสมาคมรับไป ไม่โกรธ บอกว่าย่านนี้มีห้องเช่ามาก บางห้องไฟไหม้บ่อย แล้วลงบันไดไปช้าๆ ทีละขั้น

        คืนนั้นเมฆต่ำปูเสื่อนอนเฝ้าหัวบันได มีมีดผ่าฝีเล่มหนึ่งวางข้างหมอน {name}ไม่ได้สั่ง
      effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [guild_doctor_enemy] }
    - id: double_game
      label: ลงชื่อรับเงิน แล้วส่งชื่อคนที่ตายไปแล้วแทนชื่อคนไข้
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ทุกต้นเดือน{name}ส่งรายชื่อคนไข้ผิวแก้วไปที่สมาคม ทุกชื่อเป็นชื่อจริง ของคนที่ตายไปแล้วด้วยเรื่องอื่น จมน้ำ ไข้ เมาตกคลอง {name}คัดมาจากแผ่นหินชื่อคนตายริมคลองทุกสิ้นเดือน ชื่อไหนช่างสลักสะกดผิด {name}ก็ลอกผิดตาม

          สมาคมจ่ายสิบเหรียญทุกเดือน แล้วส่งคนออกตามหาคนในรายชื่อจนเลิกตามไปเอง คนไข้ผิวแก้วตัวจริงขึ้นบันไดตอนเที่ยงคืน เมฆต่ำเป็นคนเปิดประตู
        effects: { stats: { DEX: 1 }, gold: 10, flags: [guild_licensed, hid_glass_patients] }
      failure:
        text: |
          รายชื่อเดือนแรกที่{name}ส่งไปมีชื่อลุงของหมอสมาคมเอง จมน้ำตายตั้งแต่ปีก่อน เขาขึ้นบันไดมาฉีกใบอนุญาตต่อหน้า{name} ไม่ทวงเงินเดือนแรกสิบเหรียญคืน บอกว่าเก็บไว้ซื้อกุญแจประตูดีๆ สักดอก
        effects: { gold: 10, flags: [guild_doctor_enemy] }
    - id: show_the_doctor
      label: ปลดผ้าคลุมหัวให้หมอสมาคมดู แล้วถามว่าข้อสุดท้ายรวมถึงหมอด้วยไหม
      requires: { trait: demon_mark }
      text: |
        {name}ปลดผ้าคลุมหัวออกตรงหน้าเขา หมอสมาคมมองหัวของ{name} มองเมฆต่ำ แล้วมองใบอนุญาตที่ลงตราไว้แล้ว เขาเก็บกระดาษทั้งสองแผ่นกลับใส่อกเสื้อ บอกว่าสมาคมไม่รู้มาก่อนว่าย่านนี้มีหมอที่มีตรา ตั้งแต่วันนี้สมาคมจะรู้

        เดือนต่อมาคนงานโรงกลั่นสามโรงได้คำสั่งห้ามมารักษาที่ห้องเหนือร้านปลาเค็ม คนไข้ลดลงครึ่งหนึ่ง อีกครึ่งที่เหลือขึ้นบันไดมาตอนกลางคืน
      effects: { alignment: { moral: 1 }, reputation: { distillers: -1 }, flags: [guild_doctor_enemy] }

- id: adult.mid_hedge_glassman
  stage: adult
  scene: healer
  weight: 45
  when:
    age: [33, 40]
    flags: [job_hedge_doctor]
  text: |
    หลายปีหลังมานี้ คนไข้ผิวแก้วที่ขึ้นบันไดห้องเหนือร้านปลาเค็มอายุน้อยลงทุกปี ปีนี้มีเด็กสามคนแล้ว คนเล็กสุดแปดขวบ จุดใสเท่าเล็บอยู่ที่หลังมือ เห็นเส้นเลือดเต้นอยู่ข้างใต้ มือของ{name}เองเริ่มสั่นตอนเย็บแผลที่ต้องใช้เข็มเล็ก ต้องเย็บตอนเช้าก่อนกินอะไรเท่านั้น

    คืนหนึ่งมีคนยืนอยู่ที่เชิงบันได ไม่ขึ้นมา เป็นผู้ชาย ใสทั้งตัว ใสจนเห็นราวบันไดผ่านหน้าอก มีแสงสีฟ้าเต้นอยู่ตรงที่หัวใจควรอยู่ เขาถามคนขายปลาเค็มข้างล่างว่าที่นี่มีหมอชื่อ{name}ไหม เสียงของเขาซ้อนกันสองชั้น ชั้นหนึ่งพูดคำนี้ อีกชั้นพูดคำถัดไปไปก่อนแล้ว

    คนขายปลาเค็มขึ้นมาตาม ยืนอยู่ที่ประตู มือยังกำมีดแล่ปลา บอกว่าจะไม่ให้คนแบบนั้นขึ้นบันไดบ้านตัวเอง
  choices:
    - id: warm_him
      label: พาเขาขึ้นมานั่งชิดเตาถ่านมาร ลองให้ความร้อนชะลอแก้ว
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}ลงไปพยุงเขาขึ้นมาเอง ตัวเขาเย็นเฉียบ น้ำหนักไม่ถึงครึ่งของที่คนขนาดนั้นควรมี {name}ให้เขานั่งชิดเตาถ่านมารที่ยืมมาจากโรงตีเหล็กข้างล่าง แล้วจดจังหวะแสงที่อกทุกครั้งที่เตาร้อนขึ้นอีกขั้น

          ตอนสาง ขอบแก้วที่ข้อมือเขาขุ่นเป็นฝ้ากว้างครึ่งนิ้ว เขาบอกว่าคืนนี้หลับได้เป็นคืนแรกในรอบเดือน {name}จดทุกอย่างลงสมุด แต่ยังบอกไม่ได้ว่าเป็นเพราะไฟในเตา หรือเพราะเขาได้นั่งข้างคนเป็นๆ ทั้งคืน เช้าวันนั้นเด็กแปดขวบคนนั้นได้นั่งชิดเตาเป็นคนต่อไป
        effects: { stats: { INT: 1 }, world: { demon: 1 }, flags: [coal_slowed_glass] }
      failure:
        text: |
          เตาร้อนขึ้น แสงในอกเขาไม่ช้าลง กลับเต้นเร็วขึ้นจนสว่างทั้งห้อง ผิวแก้วตรงไหล่ร้าวเป็นเส้น ดังเหมือนแก้วน้ำเย็นที่เทน้ำร้อนลงไป {name}ลากเตาออกห่าง มือข้างที่จับขาเตาไหม้พองทั้งฝ่ามือ

          เขาลุกขึ้นก่อนสาง ขอบคุณ แล้วลงบันไดไปเอง รอยร้าวที่ไหล่เรืองตามไปจนสุดถนน
        effects: { hp: -2, flags: [glass_cracked_by_coal] }
    - id: write_it_down
      label: ลงไปนั่งที่เชิงบันไดกับเขา แล้วจดทุกคำที่เขาพูด
      text: |
        {name}ลงไปนั่งบนบันไดขั้นล่างสุดข้างเขา คนขายปลาเค็มยืนเฝ้าอยู่ที่ประตูร้านจนตีหนึ่งแล้วเข้านอน ชายแก้วพูดทั้งคืน ส่วนใหญ่เป็นเรื่องเล็ก ฝนพรุ่งนี้ ลูกแมวในโกดังข้างๆ เรือที่จะมาช้าหนึ่งวัน แล้วก็มีเรื่องที่ไม่เล็ก เขาพูดซ้ำสามครั้งด้วยเสียงชั้นหลัง ว่าจะมีคืนหนึ่งที่ดาวเงียบพร้อมกันทั้งฟ้า

        {name}จดทุกคำลงกระดาษห่อยา ตอนสางเขาเดินจากไป ทิ้งรอยเท้าเปียกไว้บนบันได รอยนั้นเรืองจางๆ อยู่สองคืน
      effects: { stats: { CON: 1 }, world: { star: 1 }, flags: [glass_man_ledger] }
    - id: last_three_lines
      label: เอากระดาษห่อยาของทาเมสออกมา ถามเขาเรื่องสามบรรทัดสุดท้าย
      requires: { flag: kept_glass_prophecy }
      text: |
        กระดาษห่อยาแผ่นนั้นอยู่ในหีบของ{name}มาหลายปี สามบรรทัดสุดท้ายยังไม่เกิด {name}อ่านให้ชายแก้วฟังทีละบรรทัด เขาฟังจนจบ แล้วบอกว่าบรรทัดแรกเกิดไปแล้วเมื่อวาน ที่ท่าเรือ ไม่มีใครเห็น บรรทัดที่สองจะเกิดในห้องนี้

        {name}ถามถึงบรรทัดที่สาม เขายิ้ม เสียงชั้นหลังตอบมาก่อนชั้นหน้า แต่{name}ฟังออกแค่ชั้นหน้า ชั้นหน้าบอกว่าขอโทษ ยังไม่ถึงเวลาของมัน
      effects: { stats: { INT: 1 }, world: { star: 1 }, flags: [asked_about_last_lines] }
    - id: meet_him_yourself
      label: ลงไปยืนตรงหน้าเขา บอกว่าหมอชื่อนั้นคือตัวเอง
      requires: { trait: demon_mark }
      text: |
        {name}ลงบันไดไปยืนตรงหน้าเขา ห่างกันไม่ถึงศอก ชายแก้วถามคนขายปลาเค็มซ้ำอีกครั้งว่าที่นี่มีหมอชื่อ{name}ไหม ตาของเขามองผ่าน{name}ไปที่บันไดข้างหลัง เหมือนตรงนั้นไม่มีใครยืนอยู่ {name}เรียกชื่อตัวเอง เขาหันมาตามเสียง แล้วหันกลับไปทางบันไดอีก

        {name}จับข้อมือเขา เย็นและแข็ง แล้วพาขึ้นบันไดไปเอง ตลอดทางเขาขอบคุณคนขายปลาเค็มที่พามาส่ง คืนนั้นเขาพูดอยู่ในห้องของ{name}ทั้งคืน หันหน้าเข้าหาเตียงว่างเตียงหนึ่ง เหมือน{name}นั่งอยู่บนเตียงนั้น
      effects: { world: { star: 1 }, flags: [glass_man_couldnt_see_you] }

- id: adult.mid_citypriest_alms
  stage: adult
  scene: temple
  weight: 45
  when:
    age: [25, 32]
    flags: [job_city_priest]
  text: |
    นักบวชใหญ่ของวิหารสิ้นใจในฤดูฝนปีหนึ่ง ขณะนั่งรอคนมาขอพรตอนสาง สภาของวิหารมีสามคน หญิงชราสองคนที่กวาดลานวิหารมาตั้งแต่ก่อน{name}เกิด กับกาเบรน เจ้าของโรงกลั่นที่บริจาคเงินมากที่สุดในเขต สภาจะเลือกนักบวชใหญ่คนใหม่ภายในเดือนนี้ ระหว่าง{name}กับทอร์เวล นักบวชที่อยู่วิหารนี้มาก่อน{name}สามปี

    หลังคาวิหารรั่วสิบสองจุด ฝนตกทีไรต้องเอาถังไปรองทุกจุด กาเบรนบอกว่าจะซ่อมให้ทั้งหลัง กระเบื้องดินเผาใหม่ ไม้คานใหม่ แลกกับเรื่องเดียว ตะกร้าหวายข้างประตูหลังวิหารต้องย้ายออก

    ตะกร้าใบนั้นวางอยู่ตรงนั้นมาตั้งแต่สมัยนักบวชใหญ่คนเก่า คนเอาเด็กมาวางไว้ตอนกลางคืน ส่วนใหญ่เป็นเด็กที่มีเขา วิหารส่งต่อไปวิหารอีเซลนอกเมืองที่รับเลี้ยงเด็กทุกเช้า กาเบรนบอกว่าคนมาขอพรไม่อยากเดินผ่านประตูที่มีของแบบนั้นวางอยู่
  choices:
    - id: take_the_roof
      label: ยอมย้ายตะกร้า รับหลังคาใหม่
      text: |
        {name}หิ้วตะกร้าหวายไปส่งวิหารอีเซลนอกเมืองเองในเช้าวันรุ่งขึ้น แม่ชีที่ประตูรับไปวางไว้ข้างตะกร้าของวิหารอีเซลเอง สองใบวางติดกัน ใบหนึ่งมีเด็กนอนอยู่แล้ว

        สภาเลือก{name}เป็นนักบวชใหญ่ด้วยเสียงของกาเบรนกับหญิงชราคนหนึ่ง หลังคาใหม่เสร็จก่อนหนาว ฝนแรกไม่มีหยดไหนลอดลงมาถึงพื้น กาเบรนใส่ซองให้{name}ห้าเหรียญ บอกว่าเป็นค่าเสื้อนักบวชใหญ่ตัวใหม่
      effects: { gold: 5, reputation: { distillers: 1 }, alignment: { moral: -1 }, flags: [temple_head, moved_the_basket] }
    - id: keep_the_basket
      label: ไม่ย้ายตะกร้า ปีนขึ้นไปปะหลังคาเองทุกครั้งที่ฝนตก
      text: |
        สภาเลือกทอร์เวล ด้วยเสียงของกาเบรนกับหญิงชราคนหนึ่ง หญิงชราอีกคนเลือก{name} แล้วเดินไปเช็ดตะกร้าหวายด้วยชายผ้ากันเปื้อนของตัวเอง

        ฤดูฝนปีนั้น{name}ปีนขึ้นหลังคาวิหารทุกครั้งที่ฝนตก เอาดินเหนียวผสมฟางอุดรอยรั่วทีละจุด หลังคาไม่หายรั่ว แต่รั่วน้อยลงทุกปี ตะกร้าหวายยังอยู่ข้างประตูหลัง ทอร์เวลเดินอ้อมไปเข้าประตูหน้าทุกเช้า
      effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [kept_the_basket] }
    - id: mill_men_roof
      label: ไปหาชายโรงสีคนนั้น พ่อของเด็กที่เกือบไปอยู่ทางสามแพร่ง
      requires: { flag: saved_crossroads_family }
      text: |
        ชายโรงสีคนนั้น สามีของหญิงที่เคยอุ้มลูกมาขอพรก่อนสาง ทุกวันนี้เป็นหัวหน้าคนงานโรงสีสองโรง ลูกของเขาโตพอจะวิ่งเล่นที่ลานวิหารแล้ว เขาฟังเรื่องหลังคาจนจบ ไม่ถามสักคำ

        สามวันว่างติดกัน คนงานโรงสียี่สิบคนขึ้นหลังคาวิหาร รื้อกระเบื้องเก่าลงมาทั้งหมด มุงใหม่ด้วยกระเบื้องที่ขอเศษมาจากเตาเผาอิฐ ไม่คิดเงิน สภาเลือก{name}เป็นนักบวชใหญ่ด้วยเสียงหญิงชราสองคน กาเบรนเลิกบริจาคในเดือนนั้น ตะกร้าหวายยังอยู่ข้างประตูหลัง มีผ้าห่มผืนใหม่ปูรองไว้
      effects: { alignment: { moral: 1 }, flags: [temple_head, kept_the_basket, mill_men_roof] }
    - id: unveil_to_council
      label: ปลดผ้าคลุมหัวต่อหน้าสภา แล้วถามกาเบรนว่าจะย้ายใครออกก่อน
      requires: { trait: demon_mark }
      text: |
        {name}ปลดผ้าคลุมหัวออกต่อหน้าสภาทั้งสามคน กาเบรนหยุดพูดกลางประโยค หญิงชราคนหนึ่งยกมือปิดปาก อีกคนหัวเราะออกมาเสียงดัง บอกว่ารู้มาตั้งแต่ปีแรกแล้ว เพราะ{name}ไม่เคยถอดผ้าคลุมตอนกวาดลานวันแดดจัด

        กาเบรนลุกออกไปพร้อมเงินซ่อมหลังคา สภาที่เหลือสองคนเลือก{name}เป็นนักบวชใหญ่ เดือนต่อมาศาสนจักรตะเกียงส่งจดหมายมาถามเรื่องนี้ หญิงชราคนที่หัวเราะเป็นคนเขียนตอบ
      effects: { alignment: { moral: 1 }, reputation: { lamp_church: -1 }, flags: [temple_head, kept_the_basket] }

- id: adult.mid_citypriest_astel
  stage: adult
  scene: temple
  weight: 45
  when:
    age: [33, 40]
    flags: [job_city_priest]
  text: |
    {name}เป็นนักบวชมาเกือบยี่สิบปี เข่าทั้งสองข้างรู้จักพื้นหินหน้าแท่นของ{god}ดีกว่ารู้จักเตียง ทุกเช้ายังคุกเข่าได้ แต่ต้องมีมือจับขอบแท่นตอนลุก

    คืนวันว่างคืนหนึ่ง ชายหนุ่มคนหนึ่งเข้ามาตอนวิหารใกล้ปิด อายุไม่ถึงยี่สิบ เสื้อผ้าคนงานโรงกลั่น เขาไม่คุกเข่าหน้าแท่นของ{god} เขาขอเทียนหนึ่งเล่ม แล้วถามว่าวิหารนี้มีมุมไหนที่สวดถึงอัสเทลได้บ้าง เขาฝันเห็นเสาหักทุกคืนมาสามเดือน ในฝันมีคนยืนอยู่บนตอเสา เรียกเขาด้วยชื่อที่เขาไม่เคยมี

    ลูกมือคนใหม่ของวิหารยืนถือไม้กวาดอยู่ที่ประตู ฟังทุกคำ
  choices:
    - id: let_him_pray
      label: ให้เทียนเขา แล้วพาไปมุมที่ไม่มีแท่นของเทพองค์ไหน
      text: |
        {name}พาเขาไปมุมหลังวิหาร ตรงที่ผนังว่าง ไม่มีแท่น ไม่มีรูป มีแต่รอยตะปูเก่าที่ใครเคยแขวนอะไรไว้ เขาจุดเทียนวางบนพื้นหิน แล้วนั่งลงตรงนั้น ไม่สวดออกเสียง {name}นั่งรออยู่ห่างออกไปสิบก้าวจนเทียนหมดเล่ม

        เขากลับมาทุกคืนวันว่างจนสิ้นปี ตอนหลังมีคนมาด้วยอีกสองคน แล้วห้าคน ลูกมือวิหารเป็นคนขูดน้ำตาเทียนออกจากพื้นหินทุกเช้า
      effects: { alignment: { law: -1 }, flags: [watched_astel_prayer] }
    - id: talk_down
      label: บอกเขาว่าอัสเทลไม่ฟังแล้ว ชวนนั่งเล่าความฝันนั้นแทน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}นั่งฟังเขาเล่าฝันตั้งแต่ต้น ถามว่าเห็นเสาหักจากทางไหน ตอนกลางวันหรือกลางคืน คนบนตอเสาใส่อะไร เขาตอบได้ทุกข้อ ละเอียดเกินกว่าคนที่ไม่เคยไปแดนเถ้าจะรู้ {name}ถามว่าเขาทำงานหม้อไหน เขาตอบว่าหม้อที่กลั่นน้ำค้างจากดาวดวงใหม่ทางทิศตะวันออก

          {name}บอกให้เขาขอย้ายหม้อ เขาย้ายในเดือนนั้น สองเดือนต่อมาเขากลับมาวิหารอีกครั้ง คุกเข่าหน้าแท่นของ{god} บอกว่าเลิกฝันแล้ว ตอนนี้ฝันถึงแม่แทน
        effects: { stats: { INT: 1 }, world: { gods: 1 }, flags: [talked_down_astel_man] }
      failure:
        text: |
          เขาฟัง{name}จนจบ แล้ววางเทียนคืนบนแท่น บอกว่าคนที่ไม่เคยฝันแบบนี้จะพูดอะไรก็ได้ แล้วเดินออกทางประตูข้าง ลูกมือวิหารวิ่งตามไปถึงปากซอย กลับมาบอกว่าเขาเลี้ยวไปทางบ้านขุนนางเก่าที่พวกผู้ฟังดาวเช่าไว้
        effects: { flags: [lost_astel_man] }
    - id: report_to_lamp
      label: ส่งชื่อเขาไปให้ศาสนจักรตะเกียง
      text: |
        {name}จดชื่อของเขากับเบอร์หม้อที่เขาทำงานลงกระดาษ ส่งไปโบสถ์ศาสนจักรตะเกียงในเช้าวันรุ่งขึ้น ตามระเบียบที่วิหารทุกแห่งในเมืองต้องทำเมื่อมีคนเอ่ยชื่อเทพที่สิ้นแล้วในวิหาร นักบวชเสื้อขาวขลิบทองสองคนมารับเรื่องถึงวิหาร ขอบคุณ{name}ด้วยประโยคเดียวกับที่ใช้ขอบคุณทุกวิหาร

        ลูกมือวิหารไม่ถามอะไร เช้าวันรุ่งขึ้นเด็กคนนั้นเริ่มกวาดลานจากประตูหลัง ไม่ใช่ประตูหน้าเหมือนทุกวัน
      effects: { reputation: { lamp_church: 1 }, alignment: { law: 1, moral: -1 }, flags: [reported_astel_man] }
    - id: ask_his_name
      label: ถามชื่อเขา และถามว่าโตมาที่ไหน
      requires: { flag: carried_horned_baby }
      text: |
        เขาบอกชื่อว่าฟ้าร้อง ชื่อแบบที่วิหารอีเซลตั้งให้เด็กที่เก็บมาเลี้ยง ตามฟ้าเช้าวันที่พบตัว เขาโตที่วิหารอีเซลนอกเมือง แม่ชีเล่าว่ามีนักบวชคนหนึ่งอุ้มเขามาส่งตอนเขาอายุไม่ถึงเจ็ดวัน เดินมาครึ่งวัน

        {name}จำเช้าวันนั้นได้ จำได้ว่าฟ้าร้องตอนเดินถึงประตูวิหารอีเซล {name}ไม่ได้บอกเขา {name}พาเขาไปมุมหลังวิหาร จุดเทียนให้ แล้วนั่งลงข้างเขา ไม่ใช่ห่างออกไปสิบก้าว จนเทียนหมดเล่ม
      effects: { alignment: { moral: 1 }, flags: [found_the_crossroads_boy] }

- id: adult.mid_roadhealer_tithe
  stage: adult
  weight: 45
  when:
    age: [25, 32]
    flags: [job_road_healer]
  text: |
    ทุกวันนี้{name}เดินสายหมู่บ้านบนเส้นทางเกวียนพร้อมลูกมือวิหารสองคน คนหนึ่งจูงลาที่บรรทุกหม้อต้มยา อีกคนแบกย่าม {name}แบกแค่ไม้เท้ากับชื่อหมู่บ้านทุกหมู่บ้านในหัว ปีละสี่รอบ สิบเอ็ดหมู่บ้าน

    ฤดูนี้วิหารใหญ่ในเมืองออกระเบียบใหม่ หมู่บ้านที่นักบวชเดินสายไปรักษาต้องจ่ายค่าเดินสายหมู่บ้านละสองเหรียญต่อฤดู นักบวชเดินสายเป็นคนเก็บ ส่งเข้าวิหารทุกสิ้นฤดู เก็บได้ครบได้ส่วนแบ่ง เก็บไม่ครบ ชื่อจะขึ้นกระดานหน้าห้องนักบวชใหญ่

    หมู่บ้านแรกของฤดู ผู้ใหญ่บ้านเทเหรียญจากกระป๋องของทั้งหมู่บ้านลงบนโต๊ะ นับรวมกันไม่ถึงสองเหรียญ ปีนี้ราคาข้าวตก เพราะเรือขนข้าวจากทางใต้ไปถึงตลาดในเมืองก่อน
  choices:
    - id: collect_tithe
      label: เก็บตามระเบียบ หมู่บ้านไหนไม่มีให้ลงชื่อติดไว้ก่อน
      text: |
        {name}เก็บเท่าที่มีจากทุกหมู่บ้าน จดส่วนที่ขาดลงสมุดของวิหาร ผู้ใหญ่บ้านทุกคนลงชื่อรับว่าติดค้าง บางคนลงชื่อเป็นรูปวาด เพราะเขียนชื่อตัวเองไม่เป็น

        สิ้นฤดู วิหารใหญ่นับเงินแล้วจ่ายส่วนแบ่งให้สามเหรียญ ชื่อของ{name}ไม่ขึ้นกระดาน ฤดูต่อมา หมู่บ้านที่สี่เปิดประตูรั้วช้ากว่าเดิม
      effects: { gold: 3, alignment: { law: 1 }, flags: [collected_tithe] }
    - id: pay_yourself
      label: ออกเงินแทนหมู่บ้านที่ไม่มีให้ หกเหรียญ
      requires: { min_gold: 6 }
      text: |
        สิ้นฤดู {name}เอาเงินเก็บของตัวเองหกเหรียญใส่รวมกับที่เก็บได้ ส่งเข้าวิหารครบทุกหมู่บ้าน ผู้ใหญ่บ้านไม่มีใครรู้ เพราะ{name}บอกทุกคนว่าวิหารยกให้ฤดูนี้

        ลูกมือวิหารคนที่แบกย่ามรู้ เพราะเขาเป็นคนนับเงิน ฤดูต่อมาเขาเอาเงินที่แม่ให้มาใส่รวมด้วยหนึ่งเหรียญ แล้วไม่ยอมเอาคืน
      effects: { gold: -6, alignment: { moral: 1 }, flags: [paid_villages_tithe] }
    - id: off_the_map
      label: เขียนบัญชีว่าบางหมู่บ้านร้างไปแล้ว ไม่ต้องเก็บ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          แผนที่เส้นทางเกวียนของวิหารใหญ่เก่ากว่าเส้นทางจริงยี่สิบปี สามหมู่บ้านในแผนที่ย้ายไปตั้งริมรางเหล็กหมดแล้ว อีกสองหมู่บ้านย้ายไปครึ่งหนึ่ง {name}เขียนบัญชีว่าห้าหมู่บ้านนั้นร้าง ไม่ต้องเก็บ

          คนในวิหารใหญ่ไม่มีใครเดินเส้นทางนั้นนอกจากนักบวชเดินสาย บัญชีผ่านไปทุกฤดู ห้าหมู่บ้านที่ร้างในสมุดยังจุดไฟหุงข้าวกันทุกเย็น
        effects: { stats: { INT: 1 }, alignment: { law: -1, moral: 1 }, flags: [villages_off_the_map] }
      failure:
        text: |
          นักบวชใหญ่เคยเดินสายเส้นนี้ตอนยังหนุ่ม เขาจำหมู่บ้านได้ครบ และจำได้ว่าหมู่บ้านที่สิบเอ็ดมีบ่อน้ำที่หวานที่สุดในเขต เขาเรียก{name}ไปพบ ไม่ด่า ไม่ลงโทษ แค่เขียนชื่อ{name}ขึ้นกระดาน แล้วถามว่าบ่อน้ำนั้นยังหวานอยู่ไหม
        effects: { stats: { CON: 1 }, flags: [temple_warned_healer] }
    - id: village_seven
      label: ไปหมู่บ้านที่เจ็ด หมู่บ้านที่เคยตอกแผ่นไม้ปิดบ้านคนไข้
      requires: { flag: broke_the_boards }
      text: |
        ผู้ใหญ่บ้านหมู่บ้านที่เจ็ดเอาค่าเดินสายสองเหรียญมาวางให้ส่งวิหารก่อน{name}จะเปิดปากถาม ครบ บอกว่าทั้งหมู่บ้านเก็บกันไว้ตั้งแต่ได้ข่าว ไม่มีใครยอมให้นักบวชคนนั้นต้องขึ้นกระดาน

        ตอนออกจากหมู่บ้าน เด็กที่เคยเคาะแผ่นไม้วิ่งตามมาถึงหลักเขต ตัวสูงขึ้นจนเกือบเท่า{name}แล้ว เขายื่นไม้เท้าอันใหม่ให้ เป็นไม้เนื้อแข็งที่เขาเหลาเองทั้งหน้าหนาว หัวไม้แกะเป็นแผ่นไม้เล็กๆ มีรูตะปูครบทุกรู แต่ไม่มีตะปูสักตัว
      effects: { items: [healer_oak_staff], flags: [village_seven_staff] }

- id: adult.mid_roadhealer_route
  stage: adult
  weight: 45
  when:
    age: [33, 40]
    flags: [job_road_healer]
  text: |
    ลาแก่ที่แบกหม้อต้มยาให้{name}มาหลายปีล้มลงกลางทางในฤดูแล้ง แล้วไม่ลุกขึ้นอีก {name}นั่งข้างมันจนมันหยุดหายใจ แล้วแบกหม้อเองไปถึงหมู่บ้านถัดไป เข่าทั้งสองข้างร้องทุกก้าวที่ลงเนิน เดือนเดียวกัน วิหารใหญ่ส่งจดหมายมาบอกว่าเส้นทางของ{name}จะส่งต่อให้ลูกมือวิหารที่โตแล้ว ให้{name}กลับไปประจำวิหารในเมือง

    รอบสุดท้ายของ{name}ผ่านหมู่บ้านที่เพิ่งมีขึ้นในปีนี้ บ้านสิบกว่าหลังล้อมจานรับดาวใบใหญ่ของบริษัทโรงกลั่น คนงานกับลูกเมียมาอยู่เฝ้าจาน ไม่มีใครป่วย แต่เด็กทั้งหมู่บ้านฮัมเพลงเดียวกัน เพลงที่ไม่มีผู้ใหญ่คนไหนสอน และวาดรูปเดียวกันบนดินหน้าบ้าน รูปประตูบานหนึ่งลอยอยู่บนฟ้า

    ลูกมือวิหารที่จะรับเส้นทางต่อยืนดูรูปบนดินอยู่ข้าง{name} ถามว่าเรื่องนี้ต้องจดลงสมุดหมู่บ้านไหม
  choices:
    - id: bless_the_children
      label: อวยพรเด็กทีละคนด้วยบทกันฝันร้าย
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}อวยพรเด็กทีละคน วางมือบนหัว สวดบทกันฝันร้ายในนามของ{god} บทที่นักบวชทุกคนท่องได้ตั้งแต่ปีแรก เด็กคนสุดท้ายเลิกฮัมตอน{name}ยกมือออก แล้วถามว่าแม่อยู่ไหน เหมือนเพิ่งตื่นนอน

          คืนนั้นทั้งหมู่บ้านเงียบ ลมพัดรูปประตูบนดินหายไปก่อนเช้า เช้าวันรุ่งขึ้นเด็กสามคนวาดใหม่ แต่วาดไม่ครบ ขาดบานประตูไปครึ่งหนึ่ง
        effects: { world: { gods: 1 }, flags: [blessed_dish_village] }
      failure:
        text: |
          {name}สวดจนจบบท เด็กยังฮัมต่อ เสียงฮัมของเด็กสิบกว่าคนดังขึ้นพร้อมกัน กลบเสียงสวดของ{name}ไปตั้งแต่กลางบท {name}สวดซ้ำ เสียงของตัวเองก็ยังจมอยู่ใต้เพลงนั้นจนคอแห้ง

          ตอนออกจากหมู่บ้าน ทำนองนั้นติดอยู่ในหัวของ{name}ไปตลอดทางกลับเมือง
        effects: { hp: -1, stats: { CON: 1 }, flags: [prayer_drowned] }
    - id: copy_the_doors
      label: ให้ลูกมือวิหารลอกรูปทุกรูปลงสมุด แล้วส่งไปหอนับดาว
      text: |
        ลูกมือวิหารลอกรูปประตูจากหน้าบ้านทุกหลังลงสมุดหมู่บ้าน สิบสี่หลัง สิบสี่รูป {name}ช่วยจดว่ารูปไหนเด็กคนไหนวาด อายุเท่าไร หันไปทางทิศไหน ทุกรูปหันไปทางเดียวกัน ทางดาวดวงใหม่ที่ขึ้นทางทิศตะวันออกเมื่อต้นปี

        สมุดเล่มนั้นไปถึงหอนับดาวไอเลธกับขบวนเกวียนสินค้าปลายฤดู คนที่เขียนตอบกลับมาไม่ได้ถามเรื่องประตู ถามว่าเด็กคนไหนวาดรูปแรก
      effects: { stats: { INT: 1 }, reputation: { star_hall: 1 }, flags: [drew_the_sky_door] }
    - id: hand_over_map
      label: วาดแผนที่เส้นทางกับชื่อทุกหมู่บ้านให้ลูกมือวิหาร แล้วกลับเมือง
      text: |
        คืนสุดท้ายบนเส้นทาง {name}นั่งวาดแผนที่ให้ลูกมือวิหารบนหนังแพะผืนหนึ่ง สิบเอ็ดหมู่บ้าน กับหมู่บ้านใหม่อีกหนึ่ง เขียนชื่อผู้ใหญ่บ้านทุกคน ชื่อหมาทุกตัวที่กัด บ่อน้ำที่หวาน บ่อน้ำที่ห้ามดื่ม บ้านไหนจะจ่ายเป็นไข่ บ้านไหนจะจ่ายเป็นคำขอบคุณ

        เช้ามา{name}ขึ้นเกวียนกลับเมือง ลูกมือวิหารแบกหม้อต้มยาเดินไปอีกทาง เพลงของเด็กในหมู่บ้านใหม่ยังดังตามมาถึงโค้งแรกของถนน
      effects: { alignment: { law: 1 }, flags: [gave_road_map] }
    - id: hum_along
      label: ไม่สวด นั่งลงหน้าบ้านหลังแรก ฮัมตามเพลงของเด็ก
      requires: { flag: first_prayer_silent_adult }
      text: |
        {name}ไม่ยกมือขึ้นสวด คืนที่คุกเข่าสวดกลางลานหมู่บ้านที่เจ็ดจนเข่าแตกแล้วไม่มีอะไรตอบ ยังฝังอยู่ในเข่าทั้งสองข้าง {name}นั่งลงบนดินหน้าบ้านหลังแรก ฟังเด็กฮัมจนจับทำนองได้ แล้วฮัมตาม

        เด็กคนหนึ่งหยุดฮัม หันมาบอกว่า{name}ฮัมผิดตรงท้าย ตรงท้ายต้องต่ำลงอีก แล้วฮัมให้ฟังช้าๆ ทีละท่อน {name}ฮัมตามจนได้ คืนนั้นเด็กทั้งหมู่บ้านนั่งล้อมนักบวชเดินสายคนหนึ่ง สอนเพลงที่ไม่มีผู้ใหญ่คนไหนสอนพวกเขา
      effects: { world: { star: 1 }, flags: [learned_the_dish_song] }

- id: adult.mid_fortpriest_dead
  stage: adult
  scene: fort
  weight: 45
  when:
    age: [25, 32]
    flags: [job_fort_priest]
  text: |
    ภาคีผู้เฝ้าผนึกส่งระเบียบใหม่มาถึงป้อมสามในปีที่เงินอุดหนุนลด ผู้เฝ้าที่ตายบนแนวหินจะไม่ส่งศพกลับบ้านทางขบวนรถอีก ค่าขนศพหนึ่งศพเท่ากับน้ำมันตะเกียงสองเดือน ให้เผาในเตาหลอมของป้อม แล้วส่งเถ้ากลับบ้านในกล่องดีบุกใบเท่าฝ่ามือ

    ศพแรกตามระเบียบใหม่เป็นผู้เฝ้าอายุยี่สิบสองชื่อบาเรส หน้าหนาวที่สามของเขาบนแนวหิน จดหมายฉบับสุดท้ายที่เขาส่งถึงบ้านบอกว่าจะกลับไปช่วยเกี่ยวข้าว แม่ของเขาจึงขึ้นขบวนถ่านเที่ยวเปล่าจากหมู่บ้านริมทุ่งอีเซลมารับเอง นางมาถึงประตูป้อมก่อนข่าวจะไปถึงบ้าน ตอนลูกชายยังนอนอยู่ในห้องเก็บศพ

    นางไม่ร้องไห้ ถามนักบวชประจำป้อมแค่ว่าลูกชายจะได้กลับบ้านพร้อมนางไหม คนที่ต้องตอบคือ{name}
  choices:
    - id: follow_the_rule
      label: เผาตามระเบียบ สวดส่งเขาหน้าเตาหลอม
      text: |
        {name}สวดส่งบาเรสหน้าเตาหลอมของป้อม แม่ของเขายืนอยู่ข้าง{name}ตลอดพิธี มือจับขอบกล่องดีบุกใบเล็กที่ยังว่าง เปลวไฟในเตาสูงขึ้นเป็นสีส้มแล้วเป็นสีขาว กลิ่นลอยอยู่ทั้งป้อมจนถึงเย็น

        นางเดินทางกลับพร้อมกล่องใบเดียว ห่อด้วยผ้าพันคอของตัวเอง ภาคีส่งจดหมายชมป้อมสามว่าทำตามระเบียบใหม่เป็นป้อมแรก ผู้เฝ้ารุ่นใหม่เลิกพูดเรื่องกลับบ้านช่วงเกี่ยวข้าวในห้องกินข้าว
      effects: { reputation: { wardens: 1 }, alignment: { law: 1 }, flags: [burned_the_dead] }
    - id: pay_the_train
      label: จ่ายค่าขนศพกลับบ้านเองห้าเหรียญ
      requires: { min_gold: 5 }
      text: |
        {name}เอาเงินห้าเหรียญจากหีบใต้เตียงไปจ่ายที่สถานีปลายราง คนขายตั๋วนับเหรียญ แล้วเขียนใบขนส่งด้วยลายมือที่เคยเขียนใบแบบนี้มานับร้อยใบ ช่องสินค้าเขียนว่าศพหนึ่งศพ ช่องผู้ติดตามเขียนว่าแม่

        บาเรสกลับถึงบ้านทันเกี่ยวข้าว ฝังในทุ่งริมเสาของอีเซล ปลายฤดูมีกระสอบข้าวใหม่หนึ่งกระสอบมาถึงป้อมสาม จ่าหน้าถึงนักบวชประจำป้อม ไม่มีชื่อคนส่ง
      effects: { gold: -5, alignment: { moral: 1 }, flags: [paid_for_the_dead] }
    - id: bury_in_wall
      label: รื้อกำแพงด้านตะวันออก ฝังเขาไว้ในนั้น หันหน้าไปทางแนวหิน
      check: { stat: STR, dc: 13 }
      success:
        text: |
          {name}รื้อหินกำแพงด้านตะวันออกเองทีละก้อน จนเป็นช่องยาวพอให้คนนอนได้ แม่ของบาเรสช่วยยกหินก้อนเล็ก ใกล้สาง ผู้เฝ้ากะดึกสามคนออกมาช่วยโดยไม่มีใครสั่ง บาเรสนอนอยู่ในกำแพงหันหน้าออกไปทางแนวหินที่เขาเฝ้ามาสามหน้าหนาว

          แม่ของเขาขูดชื่อลูกลงบนหินก้อนนอกสุดด้วยตะปูตัวเดียว ก่อนกลับนางบอกว่าที่บ้านลูกไม่มีอะไรต้องเฝ้า ที่นี่มี ตั้งแต่นั้นผู้เฝ้าของป้อมสามที่ตายบนแนวหินนอนเรียงกันในกำแพงด้านตะวันออกทีละคน
        effects: { stats: { STR: 1 }, reputation: { wardens: 1 }, flags: [fort_wall_of_dead] }
      failure:
        text: |
          หินกำแพงก่อด้วยปูนผสมเถ้ามาหลายชั่วคน ปูนแข็งกว่าตัวหินเอง {name}รื้อได้สามก้อน แล้วก้อนที่สี่หลุดลงมาทับเท้า นิ้วเท้าแตกสองนิ้ว

          บาเรสไปเตาหลอมตามระเบียบในเย็นวันนั้น ก่อนกลับ แม่ของเขาพันเท้าให้{name}ด้วยผ้าพันคอผืนเดียวกับที่ใช้ห่อกล่องดีบุก
        effects: { hp: -2, flags: [burned_the_dead] }
    - id: letters_to_mothers
      label: อ่านจดหมายที่เขียนถึงนางให้ฟังก่อนส่ง แบบที่เคยเขียนให้รอสเวน
      requires: { flag: wrote_rosven_letter }
      text: |
        ตั้งแต่จดหมายถึงแม่ของรอสเวนเมื่อหลายปีก่อน ทุกคนที่ตายบนแนวหินของป้อมสามได้จดหมายหนึ่งฉบับถึงบ้าน ลายมือของ{name} เล่าคืนสุดท้ายของเขาตามที่คนในป้อมเห็น ไม่ตัด ไม่เติม

        {name}อ่านจดหมายของบาเรสให้แม่ของเขาฟังก่อนส่ง นางขอให้อ่านซ้ำตรงที่เขาพูดถึงข้าว แล้วรับกล่องดีบุกไปพร้อมจดหมาย ภาคีไม่เคยสั่งเรื่องจดหมาย แต่ผู้เฝ้ารุ่นใหม่ทุกคนรู้ว่าถ้าตายบนแนวหิน แม่จะได้รู้ว่าตายอย่างไร
      effects: { reputation: { wardens: 1 }, alignment: { moral: 1 }, flags: [wrote_for_every_dead, burned_the_dead] }

- id: adult.mid_fortpriest_garven
  stage: adult
  scene: fort
  weight: 45
  when:
    age: [33, 40]
    flags: [job_fort_priest]
  text: |
    การ์เวนเฝ้าแนวหินมาสี่สิบปี มือซ้ายเหลือสามนิ้วมาตั้งแต่ก่อน{name}จะมาถึงป้อม หน้าหนาวนี้เขาไอเป็นเถ้าออกมาทุกเช้า หมอของภาคีบอกว่าปอดของผู้เฝ้าที่อยู่มานานจะแข็งเป็นหินทีละน้อย ของเขาเหลือเนื้อปอดดีไม่ถึงครึ่ง ส่วนเข่าของ{name}เองไม่ชอบบันไดหอเวรมาสองหนาวแล้ว

    คืนหนึ่งเขาเรียก{name}ไปที่เตียง ยื่นตะเกียงกะดึกของเขาให้ ตะเกียงเหล็กดำบุบสามรอย ด้ามพันหนังที่เขาเปลี่ยนเองทุกปี เขาบอกว่าคืนนี้เป็นกะของเขา สี่สิบปีเขาไม่เคยขาดกะ คืนสุดท้ายก็ไม่อยากขาด

    นักบวชหนุ่มที่ภาคีส่งมาเป็นผู้ช่วย{name}เมื่อปีก่อนยืนอยู่ที่ประตูห้อง ถือหนังสือสวดส่งวิญญาณ รอฟังว่า{name}จะให้ทำอะไร
  choices:
    - id: take_his_shift
      label: ถือตะเกียงของเขาขึ้นไปยืนกะดึกแทน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ยืนบนแนวหินทั้งคืนด้วยตะเกียงของการ์เวน เปลวไฟในตะเกียงเล็ก ไม่สั่นตามลม จุดแดงหลังแนวหินขึ้นมาสามจุด แล้วจมหายลงไปในเถ้าเองก่อนเที่ยงคืน {name}ยืนจนสาง เข่าแข็งจนต้องจับราวทั้งสองมือตอนเดินลงบันไดหอเวร

          การ์เวนสิ้นใจตอนฟ้าเริ่มเทา เวลาเดียวกับที่ระฆังเปลี่ยนกะ นักบวชหนุ่มบอกว่าเขาถามเรื่องกะคืนนั้นครั้งเดียว ว่าใครถือตะเกียง แล้วหลับไปพร้อมคำตอบ ตะเกียงดวงนั้นแขวนอยู่ที่หัวเตียงของ{name}ตั้งแต่วันนั้น
        effects: { stats: { CON: 1 }, items: [garven_lantern], flags: [stood_garvens_shift] }
      failure:
        text: |
          ลมกลางคืนพัดเถ้าเข้าตาจนมองไม่เห็นไปครึ่งกะ {name}ลื่นตกจากขั้นหินขั้นที่สองของหอเวรตอนตีสาม ข้อมือซ้ายบิด ตะเกียงไม่ดับ เพราะ{name}ยกมันไว้เหนือหัวตลอดตอนตก

          การ์เวนสิ้นใจก่อนสาง ไม่ทันถามเรื่องกะ ตะเกียงดวงนั้นยังเป็นของ{name} ด้ามหนังมีรอยเลือดจากข้อมือซ้ายติดอยู่จางๆ ไม่มีใครเปลี่ยนด้ามให้
        effects: { hp: -2, items: [garven_lantern], flags: [stood_garvens_shift] }
    - id: sit_with_him
      label: ส่งนักบวชหนุ่มถือตะเกียงขึ้นแนวหิน ตัวเองนั่งข้างเตียง
      text: |
        {name}ยื่นตะเกียงให้นักบวชหนุ่ม บอกว่าคืนนี้เขาต้องขึ้นแนวหินแทนการ์เวน ส่วนหนังสือสวดส่งวิญญาณ {name}วางไว้บนโต๊ะ ไม่ได้เปิด

        การ์เวนเล่าเรื่องทั้งคืน เรื่องป้อมสามสมัยที่ยังมีผู้เฝ้าห้าสิบคน เรื่องนิ้วสองนิ้วที่หายไปในคืนเดียวกับเพื่อนสองคน เรื่องเตียงว่างทุกเตียงในห้องนอนรวม เขาจำชื่อเจ้าของเตียงได้ครบ ตอนสางเขาหยุดเล่าตรงชื่อที่สามสิบเอ็ด แล้วไม่ได้เล่าต่อ นักบวชหนุ่มลงจากแนวหินมาพร้อมตะเกียงที่ยังไม่ดับ
      effects: { alignment: { moral: 1 }, flags: [sat_with_garven] }
    - id: ask_about_stones
      label: ถามเขาเรื่องหินแนวผนึก เรื่องที่เขาไม่เคยเล่าให้ใครฟัง
      check: { stat: INT, dc: 13 }
      success:
        text: |
          การ์เวนไอเถ้าใส่ผ้าอยู่พักหนึ่ง แล้วเล่าว่าเขาเคยได้ยินเสียงเคาะครั้งเดียว ตอนยังหนุ่ม เคาะสามครั้งจากในหินก้อนหนึ่ง เขาเคาะตอบไปสามครั้งด้วยด้ามหอกเพราะไม่รู้จะทำอะไร แล้วจากในหินก็มีเสียงตอบกลับมา ไม่ใช่เสียงเคาะ เป็นเสียงพูด คำเดียว ภาษาที่เขาไม่เคยได้ยิน ตั้งแต่คืนนั้นเขายังตัดสินใจไม่ได้ว่าคำนั้นเป็นคำขู่หรือคำทัก

          เขาไม่เคยเล่าให้ภาคีฟัง เพราะคนที่เล่าเรื่องแบบนี้ให้ภาคีฟังจะได้ย้ายไปเฝ้าคลังเสบียงในเมือง เขาขอให้{name}ไม่เล่าเหมือนกัน จนกว่าจะเจอใครอีกคนที่ได้ยินเสียงนั้น
        effects: { stats: { INT: 1 }, flags: [garven_told_the_knock] }
      failure:
        text: |
          การ์เวนหัวเราะออกมาเป็นเถ้า บอกว่าหินก็คือหิน เฝ้ามาสี่สิบปีไม่เห็นมันทำอะไรนอกจากร้อน แล้วขอให้{name}ไปตักน้ำมาให้ พอ{name}กลับมาเขาหลับไปแล้ว และไม่ได้ตื่นอีก

          ตะเกียงกะดึกยังวางอยู่บนอกเขา {name}ไม่รู้ว่าเขาไม่รู้ หรือไม่อยากเล่า
        effects: { flags: [lost_garven] }
    - id: stone_thirty_six
      label: เล่าให้เขาฟังเรื่องหินก้อนที่สามสิบหก ที่รอสเวนเห็นก่อนตาย
      requires: { flag: knows_cracked_stone }
      text: |
        {name}เล่าเรื่องที่รอสเวนพูดในคืนนั้นให้การ์เวนฟังซ้ำทุกคำ รอยร้าวเท่านิ้วมือ ไออุ่น หมาเถ้าที่ออกมาจากตรงนั้น การ์เวนฟังจนจบ แล้วบอกว่ารายงานถึงภาคีฉบับนั้นเขาเขียนเอง แต่เช้าวันที่ไปดู หินเย็นเหมือนก้อนอื่น ในใจเขาจึงไม่เคยเชื่อเด็กคนนั้นจริงๆ

        เขาขอให้{name}พาไปดูหินก้อนนั้นอีกครั้ง {name}กับนักบวชหนุ่มช่วยกันหามเขาออกไปถึงแนวหินตอนเที่ยงคืน การ์เวนวางฝ่ามือสามนิ้วลงบนหินก้อนที่สามสิบหก บอกว่ามันอุ่น แล้วขอโทษใครสักคนที่ไม่ได้อยู่ตรงนั้น
      effects: { reputation: { wardens: 1 }, alignment: { moral: 1 }, flags: [garven_touched_stone] }

- id: adult.mid_switch_wizard
  stage: adult
  weight: 15
  when:
    age: [26, 31]
    class: wizard
  text: |
    จดหมายจากครูเวทคนแรกมาถึงในปีที่{name}เกือบลืมไปแล้วว่าเคยมีครู ครูแก่จนลายมือสั่น แต่ยังเขียนสูตรให้ตรวจไว้ท้ายจดหมายหนึ่งบรรทัดเหมือนทุกครั้ง เขียนผิดไว้หนึ่งตัว ดูว่าลูกศิษย์ยังจับได้ไหม

    ครูเล่าว่าโลกเวทเปลี่ยนเร็วเกินกว่าเขาจะตามทัน ร้านช่างเวทของฮาลเดนในถิ่นเก่าขาดคนอ่านสูตรเป็น เพราะลูกมือคนก่อนออกไปเปิดร้านเอง สถาบันเวทหลวงรับนักวิจัยที่ผ่านงานจริงมาแล้วโดยไม่ต้องสอบสามวัน ส่วนย่านโรงกลั่นริมแม่น้ำมีคนไข้ผิวแก้วมากขึ้นทุกเดือน และหมอที่ยอมขึ้นบันไดไปหาน้อยลงทุกเดือน

    ท้ายจดหมาย ครูสารภาพว่าสูตรกลั่นที่ตัวเองสอนลูกศิษย์มาสามสิบปี เพิ่งรู้เมื่อหน้าหนาวก่อนว่าผิดมาตลอดหนึ่งตัว
  choices:
    - id: stay
      label: วงตัวที่ครูเขียนผิด ส่งกลับไป แล้วทำงานเดิมต่อ
      text: |
        {name}หาตัวที่ผิดเจอก่อนอ่านจดหมายจบ วงหมึกแดงไว้ เขียนตัวที่ควรเป็นไว้ข้างๆ แล้วส่งกลับไปกับคนส่งจดหมายคนเดิม ไม่ได้เขียนอะไรเพิ่ม

        เดือนต่อมามีจดหมายตอบกลับมา สั้นกว่าเดิม ครูเขียนแค่ว่ายังจับได้ แล้วลงชื่อ ท้ายจดหมายฉบับนั้นไม่มีสูตร
      effects: { stats: { INT: 1 } }
    - id: to_artificer
      label: กลับไปทำงานที่ร้านช่างเวทของฮาลเดน
      requires: { not_flags: [job_artificer] }
      text: |
        ฮาลเดนจำได้ว่าเคยส่งคนไปถามหา{name}เมื่อสิบปีก่อน ตาข้างที่ขุ่นของเขาขุ่นกว่าเดิม ข้างที่ยังดีก็ยังดีพอจะเห็นว่าใครเดินเข้าร้าน เขายื่นแขนกลที่ข้อนิ้วหักมาให้หนึ่งข้าง เหมือนวันที่รับลูกมือทุกคน แล้วไปนั่งกินข้าวเที่ยง

        กินเสร็จ{name}ต่อข้อนิ้วได้ครบสามข้อ ฮาลเดนงอดูสามครั้ง ฟังเสียงเฟืองข้างใน วางเหรียญสองเหรียญไว้ข้างแขนกล แล้วบอกว่าพรุ่งนี้มาตอนไก่ขัน
      effects: { flags: [job_artificer], clear_flags: [job_researcher, job_hedge_doctor], stats: { DEX: 1 }, gold: 2 }
    - id: to_researcher
      label: ยื่นเรื่องเข้าสถาบันเวทหลวงที่เวนทราส
      requires: { min_stat: { INT: 15 }, not_flags: [job_researcher, race_tiefling] }
      text: |
        สถาบันไม่ให้{name}สอบสามวัน ให้ยืนตอบคำถามอาจารย์สามคนเรื่องงานที่ทำมาตลอดสิบปี {name}ตอบเรื่องที่รู้จนหมด แล้วตอบเรื่องที่ไม่รู้ว่าไม่รู้ อาจารย์คนกลางจดลงขอบกระดาษว่าคนนี้รู้ว่าตัวเองไม่รู้อะไร

        กุญแจห้องทำงานใต้หลังคาตึกตะวันตกมาถึงในสิบวัน ห้องข้างๆ เปิดประตูไว้ หญิงคนหนึ่งในห้องนั้นไม่เงยหน้าจากโต๊ะ แต่เลื่อนเก้าอี้มาให้{name}ตัวหนึ่ง
      effects: { flags: [job_researcher], clear_flags: [job_artificer, job_hedge_doctor], location_tag: ventras, reputation: { royal_institute: 1 } }
    - id: to_researcher_hidden
      label: ยื่นเรื่องเข้าสถาบันเวทหลวงที่เวนทราส
      requires: { flag: horns_sawn, min_stat: { INT: 15 }, not_flags: [job_researcher] }
      text: |
        สถาบันไม่ให้{name}สอบสามวัน ไม่พาเข้าห้องมืด ไม่มีใครถามว่าได้ยินเสียงอะไร ให้ยืนตอบคำถามอาจารย์สามคนเรื่องงานที่ทำมาตลอดสิบปี {name}สวมหมวกทรงสูงที่ใส่มาตั้งแต่เด็กตลอดเวลาที่ยืน ไม่มีอาจารย์คนไหนขอให้ถอด

        กุญแจห้องทำงานใต้หลังคาตึกตะวันตกมาถึงในสิบวัน ห้องข้างๆ เปิดประตูไว้ หญิงคนหนึ่งในห้องนั้นไม่เงยหน้าจากโต๊ะ แต่เลื่อนเก้าอี้มาให้{name}ตัวหนึ่ง
      effects: { flags: [job_researcher], clear_flags: [job_artificer, job_hedge_doctor], location_tag: ventras, reputation: { royal_institute: 1 } }
    - id: to_hedge_doctor
      label: ไปเช่าห้องรักษาในย่านโรงกลั่นริมแม่น้ำ
      requires: { not_flags: [job_hedge_doctor] }
      text: |
        ห้องเดียวที่ยังว่างในย่านโรงกลั่นอยู่ชั้นสองเหนือร้านขายปลาเค็ม ป้ายถ่านของหมอคนก่อนยังติดอยู่ที่บันได ลบไม่ออก {name}เขียนป้ายใหม่ทับลงไป รักษาแผล ไข้ และอาการเจ็บจากโรงกลั่น ราคาตามที่จ่ายไหว

        คนไข้คนแรกมาในคืนแรก เด็กชายอายุราวสิบขวบ ฝ่ามือพองจากการเช็ดหม้อกลั่น จ่ายเป็นปลาเค็มสองตัว
      effects: { flags: [job_hedge_doctor], clear_flags: [job_artificer, job_researcher], location_tag: ventras, alignment: { moral: 1, law: -1 }, stats: { CON: 1 } }

- id: adult.mid_switch_cleric
  stage: adult
  weight: 15
  when:
    age: [26, 31]
    class: cleric
  text: |
    นักบวชใหญ่ที่บวช{name}เมื่อสิบปีก่อนเดินทางผ่านมาในฤดูแล้ง ขาข้างหนึ่งเดินลากแล้ว แต่ยังไม่ยอมนั่งเกวียน ท่านนั่งดื่มน้ำกับ{name}ครึ่งบ่าย ถามเรื่องงานทีละเรื่องจนครบ แล้วบอกว่าวิหารของ{god}ทุกแห่งขาดคน

    วิหารในเมืองต้องการนักบวชประจำที่อยู่ได้นาน ไม่หนีไปเดินสายทุกฤดู เส้นทางเกวียนตะวันออกเพิ่งเสียนักบวชเดินสายไปหนึ่งคน สิบเอ็ดหมู่บ้านไม่มีใครไปถึงมาสองฤดูแล้ว ส่วนป้อมสามของผู้เฝ้าผนึกในแดนเถ้าขอนักบวชประจำป้อมมาสามรอบ ยังไม่มีใครรับ

    ก่อนลุก ท่านบอกว่า{god}ไม่สนว่า{name}จะคุกเข่าตรงไหน แต่คนที่อยากมีใครสักคนมาคุกเข่าข้างๆ สนใจ
  choices:
    - id: stay
      label: ส่งท่านขึ้นทาง แล้วกลับไปทำงานเดิม
      text: |
        {name}ส่งท่านขึ้นทางตอนเย็น เดินไปด้วยถึงหลักเขตหมู่บ้าน ท่านไม่ถามว่าตัดสินใจอย่างไร คงรู้แล้วจากที่{name}เดินกลับไปทางเดิม

        ดึกคืนนั้นมีคนมาเคาะประตูห้อง{name} ขอให้ไปนั่งข้างเตียงแม่ที่ไข้ขึ้นจนเพ้อ {name}คว้าเสื้อคลุมตัวเดิมแล้วออกไป
      effects: { stats: { CON: 1 }, alignment: { law: 1 } }
    - id: to_city_priest
      label: รับตำแหน่งนักบวชประจำวิหารในเมือง
      requires: { not_flags: [job_city_priest] }
      text: |
        วิหารในเมืองมีหลังคารั่วสิบสองจุด หญิงชราสองคนกวาดลาน และตะกร้าหวายใบหนึ่งวางอยู่ข้างประตูหลัง นักบวชใหญ่ของวิหารบอกว่าตะกร้าใบนั้นวางอยู่ตรงนั้นมาตั้งแต่ก่อนท่านจะมา ไม่ต้องถามว่ามีไว้ทำไม

        คืนแรก{name}นอนในห้องเล็กหลังแท่นของ{god} ได้ยินเสียงน้ำหยดลงถังทั้งสิบสองจุด สิบสองเสียงไม่ตรงจังหวะกันสักคู่
      effects: { flags: [job_city_priest], clear_flags: [job_road_healer, job_fort_priest], alignment: { law: 1 } }
    - id: to_road_healer
      label: รับเส้นทางเกวียนตะวันออก
      requires: { not_flags: [job_road_healer] }
      text: |
        เส้นทางเกวียนตะวันออกมีสิบเอ็ดหมู่บ้าน กับลาแก่ตัวหนึ่งที่นักบวชคนก่อนทิ้งไว้ที่หมู่บ้านแรก ลาตัวนั้นรู้ทางดีกว่าแผนที่ หยุดเองหน้าบ้านทุกหลังที่มีคนป่วย

        รอบแรก{name}ไปถึงหมู่บ้านที่สิบเอ็ดช้ากว่ากำหนดเก้าวัน เพราะลาหยุดหน้าบ้านเกือบทุกหลัง
      effects: { flags: [job_road_healer], clear_flags: [job_city_priest, job_fort_priest], stats: { CON: 1 } }
    - id: to_fort_priest
      label: ไปเป็นนักบวชประจำป้อมสามในแดนเถ้า
      requires: { not_flags: [job_fort_priest] }
      text: |
        ป้อมสามไม่มีนักบวชมาตั้งแต่ปลายหนาวก่อน ห้องสวดใช้เก็บถังน้ำมันชั่วคราว ชายมือซ้ายสามนิ้วชื่อการ์เวนยกถังออกเองทีละถัง ไม่ให้{name}ช่วย บอกว่าห้องนี้ควรว่างไว้ให้คนที่ต้องมานอนในนั้น

        คืนแรก{name}จุดเทียนหน้าแท่นของ{god}ที่ยังมีกลิ่นน้ำมัน หน้าต่างห้องสวดหันไปทางแนวหิน จุดแดงเล็กๆ ขึ้นมาหลังแนวหินทีละจุดจนถึงเที่ยงคืน
      effects: { flags: [job_fort_priest], clear_flags: [job_city_priest, job_road_healer], location_tag: ashland, reputation: { wardens: 1 } }
