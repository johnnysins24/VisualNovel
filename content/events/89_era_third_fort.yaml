# ชุด 5 ค ปีป้อมสาม 9 เรื่อง (ปี 361 ถึง 378) สัปดาห์ธรรมดาหลังคืนที่แนวหินขาด
# คนส่วนมากในปีเหล่านี้พ้นเกณฑ์แล้ว เรื่องจึงเป็นของคนที่จ่าย ลงชื่อ ซ่อน และยืนส่ง ไม่ใช่ของคนที่ไปรบ
# กลองเกณฑ์ (สามแดนของอาร์เวล): ตัวเองโดนสลาก (17 ถึง 45) · ลูกโดนสลาก (วัยปลาย ลูกตายได้ที่นี่ที่เดียวของชุด) · รับจ้างเป็นคนแทน
# ถ่านเฝ้าประตู: ตราร้อนขึ้นสองทาง (ถ่านของซอย กับถ่านใต้ชามที่สอง) ทั้งสองทางตั้ง set_a_door_coal ด้วย
#   ตราร้อนลงทางเดียว (เอาถ่านไปคืนที่วิหารเวรัส) ข้อความไม่บอกว่าตราหาย
# คนมีตรามีทางของตัวเองใน own_levy_drum, every_door_but_two, drill_with_brooms และ front_row_paper (ทั้งเรื่อง)
# every_door_but_two กับ soup_and_answers ไม่ผูกอาร์เวล จึงใช้นักบวชออสซาแทนนักบวชตะเกียง และกันแดนเถ้าเพราะไม่มีโต๊ะถุงมือขาวไปถึง

# ---------- กลองเกณฑ์ สลากตกที่ตัวเอง ----------
- id: adult.era_fort_own_levy_drum
  stage: adult
  weight: 24
  scene: market
  when:
    age: [17, 45]
    year: [361, 370]
    location_tag: [arvel_village, ventras, kardin]
  text: |
    กลองเกณฑ์มาถึงลานหน้าศาลาตอนสาย คนตีเป็นทหารแขนเดียว ตีด้วยแขนที่เหลือเป็นจังหวะเดียวซ้ำไปซ้ำมา จนนกพิราบบนหลังคาศาลาไม่ยอมลงมากินข้าวที่ใครโปรยไว้ ข้างกลองมีโต๊ะพับ หม้อดินใส่ไม้สลาก กับกระดานแผ่นหนึ่งพิงขาโต๊ะ เขียนราคาคนแทนด้วยชอล์ก ลบแก้มาแล้วสองหน หนหลังตัวเลขสูงขึ้น

    เสมียนอ่านกฎจากกระดาษแผ่นเดียวในลมหายใจเดียว บ้านสามเตาส่งหนึ่งคน อายุสิบเจ็ดถึงสี่สิบห้า แล้วจับบ้านเป็นกลุ่มละสามตามลำดับในสมุดเตา เตาของ{name}อยู่กลุ่มเดียวกับบ้านช่างหวายที่มีแต่ลูกสาวตัวเท่าเอว กับบ้านแม่ม่ายขายไข่ ลูกชายคนเดียวของนางขาข้างหนึ่งสั้นกว่าอีกข้าง นางถือใบหมอมาด้วย พับจนรอยพับขาด

    สลากไม่ต้องจับก็รู้ว่าจะออกที่ใคร เสมียนจับให้ครบตามธรรมเนียมอยู่ดี อ่านชื่อ{name} แล้วบอกว่ากลองจะตีอีกรอบเช้าวันที่สาม ตอนเกวียนออก
  choices:
    - id: go_with_the_cart
      label: ขึ้นเกวียนไปเมื่อกลองตีรอบสอง
      requires: { not_traits: [curse_brand] }
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ค่ายปิดช่องอยู่ห่างแนวหินที่ขาดครึ่งวันเดิน คนเกณฑ์ไม่ได้ถือหอก ได้พลั่ว ขุดคูยาวจนไม่มีใครในกองเห็นปลายอีกข้าง กลางคืนผลัดกันถือคบอยู่แถวที่สาม แถวหน้าเป็นคนมีตราทั้งแถว ส่วนมากมีเขา คุยกันด้วยสำเนียงแดนเถ้า หัวเราะเรื่องที่คนแถวหลังฟังไม่ทัน ตลอดฤดู{name}เห็นแต่แผ่นหลังของคนแถวนั้น

          ฝูงมาถึงขอบคูหลายคืน ทุกคืนหยุดที่แถวหน้า เดินเลียบไปมาแล้วกลับ พอกองส่งคนเกณฑ์ชุดใหม่ขึ้นมาผลัด {name}ได้เบี้ยสามเหรียญ ฝ่ามือด้านเป็นรูปด้ามพลั่ว กับชื่อคนแถวหน้าสองชื่อที่ออกเสียงได้ถูกแล้ว
        effects: { stats: { CON: 1 }, gold: 3, world: { gods: 1 }, flags: [served_the_fort_levy] }
      failure:
        text: |
          คืนหนึ่งฝูงไม่ได้มาทางหน้า ตัวหนึ่งลอดมาตามร่องคูช่วงที่ยังขุดไม่เสร็จ ขึ้นมาตรงแถวที่สาม {name}เอาด้ามพลั่วยันหัวมันไว้ได้จนคนแถวหน้าหันกลับมาทัน แต่ปากของตัวนั้นงับน่อง{name}ไปแล้วหนึ่งที

          แผลขอบไหม้เป็นวง หมอค่ายพันให้แล้วเขียนใบส่งกลับบ้านก่อนครบฤดู ในใบมีช่องให้เขียนว่าเพราะอะไร หมอเขียนว่าหมาเถ้า ใบของคนเจ็บที่ส่งกลับก่อนหน้า{name}ทั้งปึกเขียนช่องนั้นแบบเดียวกัน ลายมือเดียวกัน
        effects: { hp: -2, gold: 1, flags: [served_the_fort_levy, sent_home_with_a_hound_bite] }
    - id: go_to_the_front_row
      label: ขึ้นเกวียนไป แล้วเดินไปยืนแถวของคนมีตราเอง
      requires: { trait: curse_brand }
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          นายสิบที่ค่ายไม่ต้องถาม เห็นตราของ{name}แล้วชี้ไปทางแถวหน้า แถวนั้นได้ข้าวสองส่วน ได้ผ้าห่มผืนที่ไม่มีรู และได้ยืนหน้าสุดตอนกลางคืน ห่างขอบคูสิบก้าว ถือคบต่ำให้แสงตกที่พื้น

          ฝูงมาหลายคืน ทุกคืนตัวหน้าหยุดตรงขอบแสง ยืนนิ่งจนตราของ{name}ร้อนขึ้นทีละน้อย แล้วเลี้ยวกลับ ข้างหลัง{name}เป็นคนเกณฑ์จากถิ่นเดียวกันสองคน ปลายฤดูทั้งสองคนแบ่งยาสูบให้{name}ทุกคืนโดยไม่ต้องขอ
        effects: { stats: { WIS: 1 }, gold: 3, world: { gods: 1 }, flags: [served_the_fort_levy, stood_the_front_row_for_the_levy] }
      failure:
        text: |
          คืนที่ฝูงมาสองทาง {name}ยืนอยู่ตรงกลาง ตัวหน้าหยุดตามเคย ตัวที่สองไม่ได้หยุดที่ใคร พุ่งเข้าหาคบไฟ ไม่ใช่คนถือ เถ้าร้อนกระจายใส่แขน{name}เต็มแขนเสื้อ

          แผลหายทันฤดูถัดไป เบี้ยแถวหน้าจ่ายครบ นายสิบจดชื่อ{name}ลงสมุดอีกเล่มหนึ่ง เล่มที่จดว่าคนมีตราคนไหนยืนได้นานเท่าไรก่อนตัวหน้าจะเลี้ยว
        effects: { hp: -2, gold: 3, flags: [served_the_fort_levy, stood_the_front_row_for_the_levy] }
    - id: pay_my_own_stand_in
      label: จ่ายค่าคนแทนห้าเหรียญตามราคาบนกระดาน
      requires: { min_gold: 5 }
      text: |
        คนแทนที่ห้าเหรียญซื้อได้ในปีนี้มีแบบเดียว เสมียนกวักมือเรียกเด็กหนุ่มคนอพยพที่นั่งรออยู่ในเงาหลังโต๊ะ ชื่อทูเรค ตอเขาสองข้างโผล่พ้นผ้าโพกหัว ทูเรคได้สามเหรียญ อีกสองเหรียญเข้าถุงเสมียน เด็กอย่างทูเรคมานั่งรอหลังโต๊ะเกณฑ์ทุกถิ่นเพราะใบเว้นหน้าที่แถวหน้าได้เมื่อครบฤดู เงินเป็นของแถม

        เสมียนขีดชื่อ{name} เขียนชื่อทูเรคไว้ข้างๆ เช้าวันที่สามบนเกวียนมีเจ็ดคน มีเขาห้าคน ทั้งห้าเป็นคนแทนของบ้านอื่น ตอนเกวียนเลี้ยวพ้นศาลา ทูเรคหันมายกมือให้{name} มือข้างที่ถือถุงเงิน
      effects: { gold: -5, flags: [paid_a_stand_in_for_myself] }
    - id: be_away_when_the_drum_comes
      label: ไม่อยู่บ้านในเช้าที่กลองตีรอบสอง
      habit: faint_heart
      text: |
        {name}ออกทางหลังถิ่นก่อนไก่ขัน ไปนอนในโรงตากยาสูบร้างริมทุ่งสามคืน กินขนมปังที่ห่อไป เช้าวันที่สามเสียงกลองมาตามลม ตีนานกว่าทุกครั้ง แล้วหยุด

        กลับถึงถิ่น ทุกคนรู้แล้ว สลากของกลุ่มต้องได้คนหนึ่งคน เสมียนเลยเอาลูกชายแม่ม่ายขายไข่ ใบหมอของนางเสมียนพับเก็บใส่สมุด บอกว่าจะให้ถือหม้อข้าว ไม่ให้ถือพลั่ว สัปดาห์เดียวกันชื่อ{name}ขึ้นเสาหน้าศาลา ใต้หัวข้อหนีกลอง ตะกร้าไข่ของแม่ม่ายยังวางขายหน้าบ้านทุกเช้า นางเอาผ้าคลุมตะกร้าทุกครั้งที่{name}เดินผ่าน
      effects: { alignment: { law: -1 }, hunted: { crown: 1 }, flags: [hid_from_the_levy_drum] }

# ---------- กลองเกณฑ์ สลากตกที่ลูก ----------
- id: elder.era_fort_childs_levy_drum
  stage: elder
  weight: 24
  scene: home
  cast:
    kid: { kin: [child], min_age: 17, max_age: 45 }
  when:
    age: [60, 130]
    year: [361, 370]
    location_tag: [arvel_village, ventras, kardin]
  text: |
    {kid}เอาไม้สลากมาวางบนโต๊ะกินข้าวของ{name} ไม้ไผ่ยาวเท่านิ้วกลาง ปลายทาสีแดง เสมียนให้ถือกลับบ้านเพื่อให้คนในบ้านได้เห็นกับตา ไม่มีใครรู้ว่าธรรมเนียมนี้ใครคิด {kid}บอกว่าเกวียนออกเช้าวันที่สาม แล้วนั่งลงกินต่อ ตักซุปถั่วสองรอบเหมือนวันธรรมดา

    ชื่อของ{name}หลุดจากสมุดเกณฑ์ไปนานจนจำไม่ได้ว่าหลุดตอนไหน คนรุ่นเดียวกันทั้งถิ่นก็เหมือนกัน เมื่อเช้าพวกเขายืนดูกลองหน้าศาลาเอามือไพล่หลัง บางคนยกเก้าอี้มานั่ง และทุกคนรู้ทางเดียวกันสามทาง ราคาคนแทนเขียนอยู่บนกระดานพิงขาโต๊ะเสมียน นายสิบที่มากับเกวียนยอมฟังคนแก่ที่มีเรื่องจะขอ ส่วนทางข้ามเนินหลังถิ่นไม่มีใครเฝ้าตอนกลางคืน
  choices:
    - id: speak_to_the_sergeant
      label: "ให้{kid}ไป แล้วไปขอนายสิบเรื่องที่ลง (เสี่ยงเสียลูก)"
      habit: sweet_tongue
      check: { stat: CHA, dc: 11 }
      success:
        text: |
          นายสิบนั่งห้อยขาท้ายเกวียน แกะถั่วกิน ฟังคนแก่ทีละคน {name}ไม่ได้ขอให้ลูกอยู่แถวหลัง ทุกคนขอแบบนั้น {name}บอกว่า{kid}นับเลขเร็ว จดของได้ รู้ราคาข้าวทุกตลาดในระยะวันเดิน นายสิบหยุดแกะถั่ว เปิดสมุดไปหน้าคนคุมเสบียง แล้วเขียนชื่อ{kid}ลงไป

          {kid}กลับมาตอนหิมะละลาย ผอมลง ผมยาวลงมาปิดคอ เล่าเรื่องค่ายแต่เรื่องกระสอบข้าวกับหนูในโรงเสบียง คืนแรกที่กลับมานอนบ้าน {kid:เขา|เธอ}ไม่ยอมดับตะเกียง
        effects: { stats: { CHA: 1 }, people: [{ id: "@kid", closeness: 1 }], flags: [sent_a_child_to_the_fort_levy] }
      failure:
        text: |
          นายสิบฟัง{name}จนจบ แล้วบอกว่าคนแก่ทุกคนที่มาหาเขาวันนี้บอกว่าลูกตัวเองนับเลขเร็ว ชื่อ{kid}ไปลงหน้าคนขุดคู ตามลำดับที่สลากออก

          ข่าวมาถึงก่อนหิมะละลาย กระดาษจากค่ายมาพร้อมเบี้ยที่ค้างจ่ายครึ่งฤดู แบบเดียวกับที่อีกสามบ้านในถิ่นได้ ช่องชื่อเขียนด้วยลายมือ ช่องที่เหลือพิมพ์มาเสร็จจากโรงพิมพ์ {name}เก็บไม้สลากปลายแดงไว้ในกล่องเดียวกับกระดาษแผ่นนั้น
        effects: { gold: 2, people: [{ id: "@kid", dies: true }], flags: [sent_a_child_to_the_fort_levy, lost_a_child_to_the_fort_levy] }
    - id: pay_the_childs_stand_in
      label: "ซื้อคนแทนให้{kid} ห้าเหรียญตามราคาบนกระดาน"
      requires: { min_gold: 5 }
      text: |
        คนแทนปีนี้มีโต๊ะประจำในโรงเตี๊ยมหน้าศาลา ชายชื่อดอร์เมลนั่งโต๊ะริมสุด ไปมาแล้วสามฤดูในนามสามบ้าน ข้อเท้าข้างหนึ่งมีแผลไหม้เป็นวงซ้อนกันสองวง เขารับเหรียญจาก{name} นับซ้ำทีละเหรียญ แล้วพิจารณา{kid}ที่ยืนอยู่ข้างหลังตั้งแต่หัวจรดเท้า เหมือนคนดูม้าในคอกของคนอื่น

        เช้าวันที่สาม {kid}ไปยืนส่งเกวียนกับคนอื่นๆ บนเกวียนมีเพื่อนรุ่นเดียวกันสี่คน ดอร์เมลนั่งท้ายสุด ตั้งแต่ฤดูนั้นทุกครั้งที่{kid}มาหา จะวางเหรียญหนึ่งเหรียญไว้บนโต๊ะกินข้าวของ{name} ครบห้าเหรียญแล้วก็ยังวางต่อ
      effects: { gold: -5, flags: [paid_a_stand_in_for_a_child] }
    - id: over_the_ridge_by_night
      label: "พา{kid}ออกทางข้ามเนินในคืนที่สอง"
      text: |
        {name}เดินนำไปเองจนถึงสันเนิน หยุดพักสองหน {kid}รอทุกหนโดยไม่บ่น ในห่อมีขนมปัง ถุงเงินที่เย็บติดซับเสื้อ กับชื่อคนรู้จักคนหนึ่งในฟากโน้นที่ไม่ได้เห็นหน้ากันมานานจนไม่แน่ใจว่ายังอยู่ไหม บนสันเนินทั้งสองแยกกัน {name}ยืนอยู่จนเสียงฝีเท้าลงเนินไปหมด แล้วเดินกลับลงมาคนเดียวในความมืด

        สลากของกลุ่มไปตกที่บ้านถัดไป ชื่อ{name}ขึ้นเสาหน้าศาลาใต้หัวข้อใหม่ของปีนี้ ซ่อนคนจากกลอง คนเขียนสะกดชื่อถูกทุกตัว จดหมายจาก{kid}มาถึงสองฤดูต่อมา ไม่ลงชื่อ ไม่บอกถิ่น ในซองมีใบไม้แห้งใบเดียว เป็นใบไม้ที่ฝั่งนี้ไม่มีขึ้น
      effects: { alignment: { law: -1 }, hunted: { crown: 1 }, people: [{ id: "@kid", closeness: 1 }], flags: [sent_a_child_over_the_ridge] }

# ---------- รับจ้างเป็นคนแทน ----------
- id: adult.era_fort_stand_in_for_hire
  stage: adult
  weight: 24
  scene: home
  when:
    age: [17, 45]
    year: [361, 372]
    location_tag: [arvel_village, ventras, kardin]
  text: |
    บ้านของฮาลดิสคนขายถ่านมีหน้าต่างกระจกทุกบาน ตั้งแต่ถ่านขึ้นราคาเป็นสามเท่าเขาก็เปลี่ยนไม้เป็นกระจกปีละบาน ห้องที่เขาเรียก{name}มานั่งมีเตาก่ออิฐ ถ่านเต็มเตา ร้อนจนต้องแง้มหน้าต่างไว้ข้างหนึ่ง

    เมียของเขาเป็นคนพูด เสนอแปดเหรียญให้{name}ขึ้นเกวียนแทนลูกชายเมื่อกลองตีรอบสอง ลูกชายนั่งอยู่ริมหน้าต่างบานที่ปิด เอานิ้วเช็ดฝ้าบนกระจกเป็นวงกลม เช็ดแล้วเช็ดอีก ไม่หันมาทางโต๊ะเลยตั้งแต่{name}เข้ามา

    ฮาลดิสนับเหรียญแปดเหรียญออกมาวางเป็นสองกอง กองละสี่ บอกว่ากองแรกจ่ายก่อนไป กองหลังจ่ายเมื่อกลับ ถ้าไม่กลับ กองหลังจะไปถึงมือใครก็ได้ที่{name}บอกชื่อไว้ตอนนี้
  choices:
    - id: take_the_eight
      label: รับแปดเหรียญ แล้วขึ้นเกวียนแทนลูกชายเขา
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ที่ค่ายปิดช่องไม่มีใครถามว่า{name}เป็นลูกของใคร เสมียนค่ายเรียกชื่อลูกชายฮาลดิสทุกเช้า {name}ขานรับทุกเช้า จนคนในกองเรียก{name}ด้วยชื่อนั้นติดปาก ไม่มีคืนไหนที่ฝูงมาถึงช่วงคูที่{name}ยืน

          กลับมาถึงถิ่น ฮาลดิสจ่ายกองหลังครบสี่เหรียญ เมียของเขาแถมถ่านให้ครึ่งกระสอบ ไม่ได้บอกว่าแถมทำไม ตลอดเวลาที่{name}อยู่ในบ้านหลังนั้น ประตูห้องของลูกชายปิดอยู่
        effects: { stats: { CON: 1 }, gold: 8, flags: [stood_in_for_the_coal_mans_son] }
      failure:
        text: |
          งานของคนเกณฑ์ส่วนมากคือขุด คนเกณฑ์ส่วนมากที่เจ็บจึงเจ็บเพราะขุด ตอนหิมะละลาย ผนังคูช่วงที่{name}ยืนอยู่ทรุดลงมาทับถึงเข่า หมอค่ายดามขาด้วยด้ามพลั่วที่หักครึ่ง แล้วส่ง{name}กลับก่อนครบฤดู

          ฮาลดิสจ่ายกองหลังครบ ไม่หักสักเหรียญ วันที่{name}เดินไม้ค้ำไปรับเงิน ลูกชายของเขาเป็นคนเปิดประตู ยกเก้าอี้มาให้นั่งตั้งแต่ยังไม่ถึงห้อง
        effects: { hp: -2, gold: 8, flags: [stood_in_for_the_coal_mans_son] }
    - id: refuse_the_coal_man
      label: ไม่รับเงิน ลุกออกจากห้องที่ร้อนเกินไป
      text: |
        ฮาลดิสเก็บเหรียญคืนทีละกอง ไม่ต่อราคา ไม่ถามเหตุผล {name}ยังเดินไม่ถึงประตูรั้ว คนใช้ของบ้านนั้นก็วิ่งสวนออกไปทางชุมทาง ที่ที่คนอพยพมีเขานั่งรองานกันเป็นแถว

        เช้าวันที่กลองตีรอบสอง บนเกวียนมีเด็กหนุ่มมีเขาคนหนึ่งสวมเสื้อคลุมขนสัตว์ตัวใหญ่เกินตัว เป็นเสื้อของลูกชายฮาลดิส ชายเสื้อลากพื้นเกวียน กระดุมเงินยังครบทุกเม็ด
      effects: { flags: [refused_to_stand_in_for_hire] }
    - id: name_twelve_and_mean_it
      label: ขอสิบสองเหรียญ และตั้งใจไปจริงถ้าเขาจ่าย
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เมียของฮาลดิสหัวเราะ ฮาลดิสไม่หัวเราะ เขาถามว่าทำไมสิบสอง {name}ตอบว่าห้าเหรียญบนกระดานหน้าศาลาเป็นราคาของบ้านที่ไม่มีทางเลือก บ้านนี้มีทางเลือก และเลือกไปแล้วก่อนเรียก{name}มานั่ง ลูกชายหยุดเช็ดกระจก ฮาลดิสนับเพิ่มอีกสี่เหรียญ ไม่แบ่งกอง

          สองเหรียญในนั้นไปถึงมือนายสิบที่ค่าย {name}ได้ลงแถวขนหม้อถ่านให้กองครัวทั้งฤดู กลับมาพร้อมรอยพองที่ข้อนิ้วกับเงินที่เหลือครบ วันที่{name}กลับถึงถิ่น ลูกชายฮาลดิสวิ่งออกมารอที่ประตูรั้ว กระดุมเสื้อคลุมติดเหลื่อมกันหนึ่งเม็ด แล้วถามว่าที่นั่นเป็นอย่างไร
        effects: { stats: { CHA: 1 }, gold: 10, hp: -1, flags: [stood_in_for_twelve_coins] }
      failure:
        text: |
          ฮาลดิสฟังจนจบ แล้วบอกว่าสิบสองเหรียญซื้อคนแทนได้สองคน เขาจะทำแบบนั้น คนหนึ่งปีนี้ อีกคนจองไว้ปีหน้า ราคาจะได้ไม่ขึ้นอีก

          สัปดาห์นั้นฮาลดิสไปที่ชุมทางเอง กลับมาพร้อมพี่น้องคนอพยพมีเขาสองคน ให้นอนในโรงถ่านหลังบ้าน คนน้องยังไม่ถึงเกณฑ์ ฮาลดิสให้คนน้องช่วยตักถ่านไปพลางๆ ก่อน
        effects: { flags: [priced_myself_out_of_standing_in] }

# ---------- เพิงหลังบ้าน ----------
- id: adult.era_fort_the_shed_for_good
  stage: adult
  weight: 24
  scene: home
  when:
    age: [16, 130]
    year: [362, 370]
    not_location_tag: ashland
  text: |
    คนอพยพจากปีป้อมสามส่วนมากไปต่อตามแนวรางตั้งแต่หิมะละลาย ที่ยังอยู่ก็หาที่ของตัวเองได้ ใต้สะพาน ในโรงเก็บถ่านที่ว่างเพราะถ่านแพงเกินกว่าใครจะซื้อมาเก็บ ในห้องหลังร้านที่เจ้าของให้นอนแลกกับเฝ้าร้าน

    คอร์ดักเคยเป็นช่างล้อเกวียนในแดนเถ้า มือใหญ่ ซี่ฟันหน้าหักหนึ่งซี่ เขามายืนที่หน้าที่อยู่ของ{name}พร้อมเมียกับลูกสองคน ลูกคนเล็กมีตอเขาสองข้างเท่าหัวแม่มือ คอร์ดักขอเช่าเพิงหลังที่อยู่ของ{name}ไปเลย ไม่มีกำหนดออก จ่ายเป็นแรง ซ่อมทุกอย่างที่มีบานพับ เมียเขาเย็บผ้าเป็น

    ที่บ่อน้ำ ทั้งซอยรู้เรื่องก่อน{name}จะตอบ ปลายถนนอีกฟากมีซอยหนึ่งที่คนเรียกว่าซอยตอเขามาตั้งแต่หน้าหนาวที่แล้ว บ้านในซอยนั้นขายไม่ออก คนที่บ่อพูดเรื่องนี้เสียงดังพอให้คนตักน้ำทุกถังได้ยิน
  choices:
    - id: let_it_for_work
      label: ให้เช่า รับค่าเช่าเป็นแรง
      text: |
        คอร์ดักซ่อมบานพับทุกบาน ทั้งที่อยู่ของ{name}และของบ้านติดกันที่ไม่ได้ขอ ทำรางน้ำใหม่ ตอกลิ่มขาโต๊ะที่โยกมาตั้งแต่จำความได้ เมียของเขาปะเสื้อให้ทั้งตะกร้าในเย็นเดียว ลูกสองคนเล่นกับเด็กๆ ในซอยตั้งแต่สัปดาห์แรก ตั้งแต่สัปดาห์ที่สองก็ทะเลาะกันเหมือนเด็กทั่วไป

        ปลายฤดูมีคนเอาชอล์กเขียนคำว่าตอเขาไว้ใต้ชื่อซอยบนเสาหัวทาง ลายมือเด็ก ไม่มีใครลบ คนซอยข้างๆ เริ่มเรียกตาม คนในซอยเองเรียกตามด้วย ตอนบอกทางให้คนแปลกหน้า
      effects: { alignment: { moral: 1 }, flags: [let_the_shed_for_work] }
    - id: put_it_to_the_lane
      label: เรียกคนทั้งซอยมาตกลงกันที่บ่อน้ำก่อน
      habit: sweet_tongue
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เถียงกันจนตะวันตกดิน เรื่องราคาบ้าน เรื่องวิหาร เรื่องหมา {name}ปล่อยให้ทุกคนพูดจนหมดปาก แล้วเสนอข้อเดียว ครอบครัวคอร์ดักรับเวรยามกลางดึกของซอย ช่วงที่ไม่มีใครอยากเฝ้า ทุกคืนตลอดหน้าหนาว คนที่เถียงเสียงดังที่สุดเป็นคนแรกที่ยกมือ

          คอร์ดักเฝ้าเวรนั้นเองทุกคืน ถือตะเกียงนั่งบนถังคว่ำตรงปากซอย คืนที่หมาหอนไกลๆ คนในซอยเห็นแสงตะเกียงของเขาลอดบานเกล็ดเข้ามา แล้วก็หลับต่อ
        effects: { stats: { CHA: 1 }, flags: [put_the_shed_to_the_lane], city: { merit: 1, here: true } }
      failure:
        text: |
          ซอยยกมือไม่ให้ แพ้กันสองเสียง หนึ่งในสองเสียงนั้นเป็นคนที่{name}เคยให้ยืมเงินและยังไม่ได้คืน คอร์ดักยืนฟังอยู่ท้ายวง ขอบคุณทุกคนที่ยอมเสียเวลา แล้วพาครอบครัวไปโรงเก็บถ่านข้างราง

          ก่อนไปเขาซ่อมบานพับประตูของ{name}จนเปิดได้ไม่มีเสียง ตั้งแต่นั้นคนที่ยกมือไม่ให้ทุกคนทักทาย{name}ดีขึ้นกว่าเดิม
        effects: { flags: [put_the_shed_to_the_lane] }
    - id: keep_the_shed_empty
      label: บอกคอร์ดักว่าเพิงนั้นไม่ให้เช่า
      text: |
        คอร์ดักไม่ต่อรอง ขอบคุณ แล้วพาครอบครัวไปทางชุมทาง ลูกคนโตหันกลับมาดูเพิงสองหน คนเล็กไม่หัน เพราะพ่อจับมือไว้แน่น

        หน้าหนาวนั้นเพิงว่าง ฟืนกองเดิมแห้งดี ตอน{name}เข้าไปหยิบฟืนครั้งแรก บนผนังไม้ด้านในมีรูปแพะวาดด้วยถ่านไว้สามตัว สูงแค่เข่า ฝีมือเด็ก ตอนที่ครอบครัวนั้นนอนพักอยู่คืนเดียวก่อนจะมาขอ
      effects: { flags: [refused_the_shed_for_good] }
    - id: the_house_that_opened_before
      label: บอกคอร์ดักว่าหน้าหนาวปีป้อมสาม บ้านนี้เคยเปิดประตูมาแล้ว ครั้งนี้ก็ไม่ต้องจ่ายอะไร
      habit: soft_heart
      requires: { flag: took_in_ash_refugees }
      text: |
        คอร์ดักบอกว่ารู้แล้ว คนบนแนวรางเล่าต่อกันมาว่าถิ่นนี้มีบ้านที่คนขุดถ่านครอบครัวหนึ่งทิ้งแพะไว้ให้ ลูกคนโตของเขาท่องชื่อซอยมาตลอดทางเหมือนท่องบทสวด ที่เขามายืนหน้าบ้าน{name}ก่อนบ้านอื่นไม่ใช่เพราะบังเอิญ

        ครอบครัวคอร์ดักอยู่เพิงนั้นต่อมาอีกหลายฤดู ระหว่างนั้นมีคนแปลกหน้ามาถามหาบ้านของ{name}อีกสามครอบครัว ทุกครอบครัวท่องชื่อซอยมาถูก คอร์ดักเป็นคนพาไปหาที่นอนให้เองทุกครอบครัว ไม่ให้มาเคาะประตู{name}อีก
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [kept_the_shed_for_the_rail_families] }

# ---------- ทุกบ้านมีถ่าน ยกเว้นสองบ้าน ----------
- id: adult.era_fort_every_door_but_two
  stage: adult
  weight: 48
  when:
    age: [16, 130]
    year: [362, 374]
    not_location_tag: ashland
  text: |
    ถ่านเฝ้าประตูในซอยไม่ได้มาพร้อมกัน มาทีละก้อน ก้อนแรกตั้งแต่ปีป้อมสาม ก้อนหลังๆ มาหลังคืนที่ฝูงผ่านแล้วบ้านไหนเสียอะไรไป ตอนนี้ธรณีประตูทุกบ้านในซอยมีถ่านก้อนเท่ากำปั้นเด็กวางอยู่ ไม่มีใครเรียกว่าของลัทธิแล้ว เรียกว่าถ่าน เหมือนเรียกกลอนประตู

    ยกเว้นสองบ้าน บ้านหนึ่งเป็นของ{name} อีกบ้านเป็นของแม่ทหาร ลูกชายของนางอยู่ค่ายปิดช่อง นางบอกทุกคนที่ถามว่าลูกนางยืนอยู่หน้าหมาพวกนั้นทุกคืน นางจะเอาของของพวกมันมาวางหน้าบ้านตัวเองได้อย่างไร

    นักบวชหญิงของออสซาเดินมาถึงซอยวันเดียวกับที่ได้ยินเสียงหอนครั้งแรกของหน้าหนาว ถือชอล์กก้อนเดียว เสนอเขียนรูปประตูปิดลงบนบานประตูให้สองบ้านที่ไม่มีถ่าน ไม่คิดเงิน นางบอกตรงๆ ว่ารูปนี้ไม่กันหมา รูปนี้บอกออสซาว่าประตูบานนี้ยังปิดอยู่ ใครจะถือว่าสองอย่างนี้ต่างกันแค่ไหนก็แล้วแต่คนในบ้าน
  choices:
    - id: fetch_a_coal_like_the_rest
      label: ไปขอถ่านจากหม้อซุปของคนด้ายแดงมาวางเหมือนบ้านอื่น (ของแบบนี้ติดตัวไปนาน)
      requires: { not_traits: [curse_star_marks] }
      text: |
        หญิงผูกด้ายแดงที่หม้อซุปท้ายตลาดไม่ถามว่าทำไมมาช้า วางถ่านลงในมือ{name}แล้วพูดประโยคเดิมที่พูดกับทุกคน วางด้วยมือตัวเอง แล้วอย่าย้าย ถ่านอุ่นเท่าขนมปังเพิ่งออกจากเตา คืนนั้นฝ่ามือข้างที่วางอุ่นตามไปด้วย ไม่ร้อน แต่จุ่มน้ำเย็นแล้วก็ไม่ยอมเย็นลง

        คืนที่ฝูงผ่านซอย รอยเท้าขอบไหม้เลี้ยวอ้อมธรณีทีละบ้าน ไปหยุดหน้าบ้านแม่ทหาร คนทั้งซอยออกมาพร้อมคบไฟ ฝูงไปแล้ว นางไม่เป็นอะไร บานประตูของนางดำเป็นแนวสูงเท่าคนยืน ตั้งแต่เช้านั้นนางเดินผ่านหน้าบ้าน{name}ชิดฟากโน้นของซอย
      effects: { marks: { brand: 1 }, world: { demon: 1 }, flags: [set_a_door_coal, set_the_lanes_last_coal] }
    - id: take_the_chalk_door
      label: ให้นักบวชเขียนรูปประตูปิดลงบนบานประตู
      text: |
        นางเขียนช้า เส้นตรงทุกเส้น วงกลมตรงกลางบานเป็นลูกบิด แล้วข้ามไปเขียนให้บ้านแม่ทหาร ตอนเดินออกจากซอย นางไม่ได้หยุดดูถ่านบนธรณีบ้านไหนเลยสักบ้าน

        คืนที่ฝูงผ่าน {name}ได้ยินเสียงเล็บขูดธรณีไปมาสามรอบ ได้กลิ่นขนไหม้ แล้วก็หายไป เช้าขึ้นมาบานประตูดำจากพื้นถึงเข่า รูปประตูปิดอยู่กลางรอยดำ ขาวทุกเส้น ไม่ขาดสักเส้น แม่ทหารข้ามซอยมาดู แล้วกลับไปดูบานของตัวเอง บานนั้นก็เป็นแบบเดียวกัน
      effects: { world: { gods: 1 }, flags: [took_the_chalk_door] }
    - id: sit_up_with_a_lamp
      label: นั่งเฝ้าหลังประตูกับตะเกียงทุกคืนจนสิ้นหน้าหนาว
      habit: stubborn
      text: |
        น้ำมันตะเกียงหน้าหนาวนั้นกินเงินเท่าถ่านเฝ้าประตูถ้าต้องซื้อ {name}นั่งหลังบานประตูทุกคืน ห่มผ้าสองชั้น ตะเกียงหรี่ไว้ต่ำ ฟากโน้นของซอย แสงลอดบานเกล็ดบ้านแม่ทหารออกมาทุกคืนเหมือนกัน กลางหน้าหนาวสองบ้านตกลงกันเองโดยไม่ได้คุยสักคำ บ้านไหนจะงีบ หรี่ตะเกียงสองหน อีกบ้านเร่งไส้ขึ้นแทน

        ฝูงผ่านสองคืน ดมร่องประตูทั้งสองบ้านแล้วไป ปลายหน้าหนาว{name}ได้ไอแห้งๆ ติดคอมาด้วย ไอไปจนดอกไม้แรกบาน ส่วนแม่ทหารส่งขนมปังข้ามซอยมาให้ทุกวันตลาด
      effects: { stats: { WIS: 1 }, hp: -1, flags: [sat_up_with_a_lamp_all_winter] }
    - id: sit_the_soldiers_mothers_step
      label: ไปนั่งบนธรณีบ้านแม่ทหารในคืนที่ได้ยินเสียงหอน
      habit: soft_heart
      requires: { trait: curse_brand }
      text: |
        ทั้งซอยรู้ว่าฝูงลังเลต่อหน้าคนมีตรา ไม่มีใครรู้ว่าทำไม {name}เอาผ้าห่มไปนั่งบนธรณีบ้านแม่ทหาร หลังพิงบานประตู นางเปิดช่องบานเกล็ดส่งน้ำชาร้อนออกมาให้ แล้วปิด ไม่ถามอะไร ฝูงมาตอนดึกหนหนึ่ง หยุดอยู่ปากซอย ยืนอยู่นานจนชาในถ้วยเย็นหมด แล้วเลี้ยวออกไปทางทุ่ง

        เช้านั้นนางเอาขนมปังมาวางไว้หน้าบ้าน{name} ตั้งแต่นั้นคืนไหนได้ยินเสียงหอน จะมีคนในซอยมาเคาะเรียก{name} ไม่ใช่นางคนเดียว เด็กๆ ในซอยเรียก{name}ว่าถ่านเดินได้ ผู้ใหญ่ห้ามแล้ว แต่ผู้ใหญ่บางคนก็เผลอเรียกเอง
      effects: { stats: { CHA: 1 }, flags: [sat_the_soldiers_mothers_step], city: { merit: 1, here: true } }

# ---------- ซุปกับคำตอบ ----------
- id: adult.era_fort_soup_and_answers
  stage: adult
  weight: 48
  scene: market
  when:
    age: [16, 130]
    year: [361, 372]
    not_location_tag: ashland
  text: |
    ทุกวันตลาด ลานมีแถวสองแถว แถวหนึ่งยาวไปทางหม้อซุปของคนด้ายแดงที่ตั้งอยู่บนเตาก้อนเส้า ไอลอยขึ้นมาเป็นกลิ่นถั่วต้มกับกระดูก อีกแถวไปทางโต๊ะพับของคนถุงมือขาว บนโต๊ะมีบัตรหมึกน้ำเงินปึกหนึ่ง มุมบัตรวาดดาวเจ็ดแฉกดวงเล็ก กับกล่องไม้ใบหนึ่งเจาะช่องด้านบน

    สองแถวยืนหันข้างให้กัน ต่างฝ่ายต่างพูดถึงอีกแถวเสียงดังพอให้ได้ยิน คนแถวซุปว่าพวกนั้นเอาเรื่องในบ้านไปให้ฟ้าอ่าน คนแถวโต๊ะว่าพวกนี้กินข้าวหม้อเดียวกับหมา คนตักซุปไม่เคยหันไปทางโต๊ะ คนถุงมือขาวไม่เคยหันไปทางหม้อ ทั้งสองคนยิ้มให้ทุกคนในแถวของตัวเอง

    {name}มาตลาดด้วยธุระอื่น และยืนอยู่ตรงที่หางของสองแถวเกือบชนกัน
  choices:
    - id: queue_for_soup
      label: ต่อแถวซุป
      text: |
        หญิงตักซุปไม่ถามชื่อ ตักให้เต็มชามจนต้องถือสองมือ บอกประโยคเดิมกับทุกคน เจ้าของบ้านกำลังกลับมา ซุปข้นกว่าที่ร้านไหนในลานขาย เกลือพอดี กระดูกมีเนื้อติด {name}มาทุกวันตลาดจนสิ้นหน้าหนาว ประหยัดเงินค่าอาหารกลางวันไปได้หลายเหรียญ

        เจ้าของร้านขนมปังหัวลานขายได้น้อยลงทุกวันตลาด เขาเลิกทักคนในแถวซุปทีละคน ถึง{name}เป็นคนที่สิบสอง
      effects: { gold: 1, world: { demon: 1 }, flags: [ate_from_the_red_thread_pot] }
    - id: the_second_bowl
      label: ต่อแถวซุปเป็นรอบที่สอง รับชามที่มีถ่านห่อผ้าอยู่ข้างใต้ (ของแบบนี้ติดตัวไปนาน)
      requires: { not_traits: [curse_star_marks] }
      text: |
        หญิงตักซุปจำ{name}ได้ คนที่มาซ้ำในวันเดียวกันคือคนที่บ้านยังไม่มีถ่าน นางว่า ชามที่สองวางลงในมือ{name}บนห่อผ้าก้อนกลมที่อุ่นกว่าซุป นางกระซิบเท่านั้น วางด้วยมือตัวเอง แล้วอย่าย้าย

        คืนนั้นถ่านไปอยู่บนธรณีประตูของ{name} ฝ่ามือข้างที่วางอุ่นขึ้นและไม่ยอมเย็นลงอีก วันตลาดถัดมาคนถุงมือขาวยื่นบัตรให้ทุกคนที่เดินผ่านโต๊ะ ยกเว้น{name} เขามองไปที่มือข้างที่พันผ้าไว้ แล้วยื่นบัตรใบนั้นข้ามไปให้คนข้างหลัง
      effects: { marks: { brand: 1 }, world: { demon: 1 }, flags: [set_a_door_coal, took_the_coal_under_the_bowl] }
    - id: sit_at_the_table
      label: ต่อแถวโต๊ะ เขียนคำถามใส่บัตรหมึกน้ำเงิน
      habit: curious
      requires: { not_traits: [curse_brand] }
      text: |
        {name}เขียนถามถึงของชิ้นหนึ่งที่หายไปนานจนเลิกหาแล้ว พับบัตรหย่อนลงกล่อง คนถุงมือขาวบอกให้มาเอาคำตอบวันตลาดหน้า ไม่คิดเงิน วันตลาดหน้าบัตรใบเดิมกลับมา ลายมือเอนซ้าย บอกที่อยู่ของของชิ้นนั้นถูกจนถึงแผ่นไม้

        ใต้คำตอบมีอีกบรรทัดหนึ่ง เรื่องที่{name}ไม่ได้ถาม ไหน้ำบนหิ้งร้าวที่ก้น คืนนั้น{name}ยกไหลงมาดู รอยร้าวยาวเท่าเล็บมือ อยู่ตรงที่ต้องคว่ำไหดูถึงจะเห็น
      effects: { stats: { INT: 1 }, world: { star: 1 }, flags: [asked_at_the_white_glove_table] }
    - id: bread_between_the_queues
      label: ซื้อขนมปังก้อนใหญ่ ไปนั่งกินที่ขอบบ่อตรงกลางระหว่างสองแถว
      habit: stubborn
      text: |
        {name}หักขนมปังกินคนเดียวได้ไม่นาน คนจากแถวซุปคนหนึ่งเดินมาขอชิ้นหนึ่งระหว่างรอ แล้วคนจากแถวโต๊ะอีกคน ทั้งสองคนนั่งคนละฟากของ{name} คุยเรื่องราคาเกลือ เรื่องหลังคารั่ว เรื่องหัวเข่า ไม่มีใครเอ่ยถึงแถวที่ตัวเองเพิ่งเดินออกมา

        ปลายฤดู ขอบบ่อตรงนั้นมีคนมานั่งทุกวันตลาด ไม่มีใครนัด ร้านขนมปังหัวลานต้องอบเพิ่มวันละสองถาด หญิงตักซุปกับคนถุงมือขาวหันมาทางบ่อคนละหน ไม่ตรงกัน
      effects: { stats: { CHA: 1 }, gold: -1, flags: [broke_bread_between_the_queues] }

# ---------- ใบเว้นหน้า ----------
- id: adult.era_fort_front_row_paper
  stage: adult
  weight: 24
  when:
    age: [17, 59]
    year: [361, 372]
    trait: curse_brand
  text: |
    คนรับสมัครของกองทัพตั้งโต๊ะสองตัวที่ลาน โต๊ะหนึ่งสำหรับทุกคน อีกโต๊ะมีป้ายไม้เขียนว่าแถวหน้า คนที่โต๊ะแถวหน้าไม่ถามชื่อก่อน ถามว่ามีตราไหม อยู่ตรงไหน ขอดูได้ไหม

    บนโต๊ะแถวหน้ามีกระดาษปึกหนา ใบเว้นหน้า ประทับสองตราของศาลามาครบแล้ว ช่องชื่อเว้นว่างรอ ทั้งอาณาจักรมีกระดาษไม่กี่ชนิดที่ได้สองตราเร็วขนาดนี้ ใครยืนแถวหน้าครบฤดู ชื่อจะหลุดจากหน้าผู้ต้องตราของศาสนจักรไปตลอดชีวิต คนเสื้อคลุมขาวแนบเหล็กเย็นกับใครก็ได้ ยกเว้นคนที่ยื่นใบนี้ให้ดู

    คนรับสมัครเป็นชายท้วม ตาแดงเพราะนอนน้อย ไม่พูดเรื่องเกียรติ เขาบอกว่าข้าวสองส่วน เบี้ยสองเท่า เพราะหมาหยุดหน้าคนมีตรา กองรู้ ฝั่งโน้นก็รู้ เขาจ่ายตามของที่ซื้อได้ แล้วก้มลงนับห่อเสบียงต่อ
  choices:
    - id: sign_for_the_front_row
      label: ลงชื่อแถวหน้า
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ทั้งฤดูหน้าที่ของ{name}คือยืน ยืนหน้าคูตอนกลางคืน ถือคบต่ำ คืนหนึ่งแถวทหารเถ้าเดินผ่านทางถ่านหน้าค่าย ห่างไปไม่ถึงร้อยก้าว ไม่มีตัวไหนหันมาเลยสักตัว คนแถวหลังกลั้นหายใจกันทั้งแถว {name}ได้ยินเสียงคนข้างหลังสวดชื่อเทพทุกองค์ทีละองค์ ไม่ซ้ำ

          ปลายฤดูเสมียนเขียนชื่อ{name}ลงช่องว่างของใบเว้นหน้าต่อหน้า หมึกยังไม่แห้งก็ยื่นให้ บอกว่าอย่าพับตรงตรา {name}ได้กล่องสังกะสีใบเล็กไว้ใส่ใบนั้นด้วย เป็นของแถมของกอง ทุกคนในแถวหน้าได้กล่องแบบเดียวกัน
        effects: { stats: { CON: 1 }, gold: 4, world: { gods: 1 }, flags: [holds_a_front_row_pass] }
      failure:
        text: |
          ของที่ทำให้{name}เจ็บในแถวหน้าไม่ได้มาจากข้างหน้า คืนที่ฝูงมาถึงขอบคู เด็กเกณฑ์คนหนึ่งข้างหลังเห็นเงาตัวเองขยับ แล้วแทงหอกออกมาเต็มแรง ปลายหอกเข้าบ่า{name}ลึกครึ่งนิ้ว เด็กคนนั้นร้องไห้มากกว่าคนโดนแทง

          {name}ได้กลับบ้านก่อนครบฤดูสองสัปดาห์ เสมียนนับวันดูแล้ว ยอมเขียนชื่อลงใบเว้นหน้าให้ จ่ายเบี้ยตามวันที่ยืน ใบนั้นมีรอยเลือดแห้งที่มุมหนึ่งจุด ไม่ทับตรา
        effects: { hp: -2, gold: 2, flags: [holds_a_front_row_pass] }
    - id: refuse_the_front_row
      label: ไม่ลงชื่อ เดินผ่านโต๊ะไป
      text: |
        คนรับสมัครไม่เรียกตาม เขาเห็นคนเดินผ่านมาแล้วทั้งวัน เย็นนั้นที่บ่อน้ำ คนในถิ่นถามว่าทำไมไม่ไป เงินดีขนาดนั้น คนถามไม่มีตราสักคน

        เกวียนของกองออกจากลานตอนบ่าย บนเกวียนมีคนมีเขาหกคน ปึกใบเว้นหน้าบนโต๊ะบางลงหกใบ อีกสามวันต่อมาคนเสื้อคลุมขาวผ่านลานตลาด เดินช้าลงตอนผ่าน{name} แล้วก็เดินต่อ
      effects: { flags: [refused_the_front_row] }
    - id: ask_after_the_ones_who_came_back
      label: ถามว่าคนที่ยืนแถวหน้าครบฤดูแล้วกลับมา เดี๋ยวนี้อยู่กันอย่างไร
      habit: curious
      text: |
        คนรับสมัครชี้ไปที่โรงเตี๊ยม ชายชื่อทาเวสนั่งอยู่ที่นั่น กลับมาจากแถวหน้าได้สองฤดูแล้ว เขาเปิดกล่องสังกะสีให้ดูใบเว้นหน้าที่พับไว้เป็นสี่ทบ ไม่ทับตรา บอกว่าคนเสื้อคลุมขาวไม่เคยแตะต้องเขาอีก ใบนี้ใช้ได้จริง

        ส่วนที่คนรับสมัครไม่ได้บอก ชื่อของทาเวสหลุดจากหน้าหนึ่งแล้วไปอยู่ในอีกหลายหน้า หน้าของธนาคารที่จ้างคนคุมเกวียนถ่านค่าแรงสามเท่า หน้าของเพื่อนบ้านที่มาเคาะประตูทุกคืนที่หมาหอน หน้าของนายสิบที่ส่งจดหมายมาถามทุกฤดูว่าจะกลับไปยืนอีกไหม เขาวางจดหมายฉบับล่าสุดไว้บนโต๊ะ ยังไม่ได้แกะ
      effects: { stats: { WIS: 1 }, flags: [asked_after_the_front_row] }

# ---------- ฝึกด้วยด้ามไม้กวาด ----------
- id: elder.era_fort_drill_with_brooms
  stage: elder
  weight: 24
  scene: market
  when:
    age: [60, 130]
    year: [361, 372]
    any_flags: [war_veteran, job_mercenary]
  text: |
    ฤดูนี้คนที่จะต้องไปเมื่อหิมะละลายมีสิบสามคน เด็กหนุ่มสิบเอ็ดกับเด็กสาวสอง มายืนเรียงที่ลานตลาดหลังแผงเลิก ถือด้ามไม้กวาดแทนหอก หอกจริงจะได้ที่ค่าย คนที่เรียกพวกเขามาฝึกคือเจ้าของโรงเตี๊ยม ชายที่ไม่เคยถืออะไรแหลมกว่าส้อม เขามาดักรอ{name}ที่บ่อน้ำ เพราะทั้งถิ่นรู้ว่า{name}เคยยืนในแถวที่คนฆ่ากันจริงมาแล้ว

    พวกเขาแย่มาก คนหนึ่งถือไม้กวาดกลับหัว เอาฝั่งขนไว้ข้างหน้า สองคนหันไปดูว่าเด็กสาวมองอยู่ไหมทุกครั้งที่ได้ยินคำสั่ง คนตัวโตที่สุดสะดุ้งทุกครั้งที่หมาข้างบ้านเห่า มีคนเดียวที่เก่ง เก่งจนพุ่งไปข้างหน้าทุกครั้งแล้วล้มเอง

    แม่ค้าที่เก็บแผงยังไม่เสร็จหยุดมือดู เจ้าของโรงเตี๊ยมยื่นไม้กวาดด้ามที่ดีที่สุดให้{name}
  choices:
    - id: drill_by_the_book
      label: สอนตามตำราฝึกของกอง ท่ายืน ท่าแทง ท่าเปลี่ยนแถว
      text: |
        {name}นับเสียงดังจนคอแหบ ทุกเย็นจนสิ้นฤดู แม่ค้าที่เก็บแผงช้าเริ่มนับตาม ปลายฤดูสิบสามคนก้าวเท้าพร้อมกัน หันพร้อมกัน แทงพร้อมกัน เสียงเท้ากระทบลานดังเป็นเสียงเดียว คนทั้งถิ่นออกมายืนดูตอนพลบเหมือนออกมาดูงานเทศกาล

        เช้าที่เกวียนออก ทั้งสิบสามคนเดินไปขึ้นเกวียนตามจังหวะที่{name}สอน ไม่มีใครสั่ง ไม้กวาดสิบสามด้ามพิงขอบบ่อเรียงกันไว้ ขนกุดเหลือครึ่งเพราะกระทืบลานมาทั้งฤดู
      effects: { stats: { CHA: 1 }, alignment: { law: 1 }, flags: [drilled_the_levy_by_the_book] }
    - id: teach_what_is_true
      label: สอนเรื่องที่ตำราไม่มี
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}สอนให้ล้มแล้วลุกในความมืด สอนให้แทงด้วยปลาย อย่าฟัน หมาพวกนั้นไม่กลัวไฟ อย่าเอาคบไปไล่ ให้ถือคบไว้ให้คนข้างๆ เห็นหน้ากัน ใครวิ่งก่อนคือคนที่โดนก่อน นอนอย่าถอดรองเท้า ถ้าแถวหน้าเป็นคนมีตรา ให้ยืนชิดหลังคนแถวนั้นไว้ และอย่าอายที่ยืนตรงนั้น

          เจ้าของโรงเตี๊ยมบ่นว่าไม่เห็นเหมือนทหาร แม่ค้าหัวเราะทุกครั้งที่เด็กล้ม ปลายฤดูเด็กทั้งสิบสามคนล้มแล้วลุกได้โดยไม่ทำไม้กวาดหลุดมือ ในความมืดสนิท คนที่สะดุ้งเวลาหมาเห่ายังสะดุ้งอยู่ แต่สะดุ้งแล้วไม่ถอย
        effects: { stats: { WIS: 1 }, flags: [taught_the_levy_what_is_true] }
      failure:
        text: |
          วันที่สามแม่ของเด็กสองคนมาหา บอกว่า{name}สอนลูกนางให้ล้ม ให้วิ่งหนี ให้ไปหลบหลังคนอื่น เจ้าของโรงเตี๊ยมเห็นด้วยกับแม่ๆ เพราะแม่ๆ เป็นลูกค้า

          {name}สาธิตท่าล้มให้ดูอีกรอบตรงนั้น ล้มแล้วลุกช้ากว่าที่ตั้งใจ สะโพกเคล็ดไปครึ่งเดือน ระหว่างนั้นเด็กๆ กลับไปเดินเท้าพร้อมกันตามเสียงนับของเจ้าของโรงเตี๊ยม มีคนเดียวที่แอบมาถามเรื่องรองเท้าที่หน้าบ้าน{name}ทุกเย็น
        effects: { hp: -1, flags: [taught_the_levy_what_is_true] }
    - id: drill_them_behind_me
      label: ให้เด็กๆ ฝึกยืนแถวหลังตัวเอง แบบที่จะต้องยืนหลังแถวหน้าที่ค่าย
      requires: { trait: curse_brand }
      text: |
        {name}ยืนหน้าแถวเอง หันหลังให้เด็กทั้งสิบสามคน บอกว่าที่ค่ายพวกเขาจะไม่ได้ยืนหน้าสุด คนที่ยืนหน้าสุดจะเป็นคนมีตราแบบ{name} งานของแถวหลังคือยืนให้ชิด ถือคบให้คนข้างหน้าเห็นพื้น อย่าแทงข้ามไหล่ใคร และอย่าจ้องตราของคนข้างหน้า คนแถวหน้าเกลียดการโดนจ้องมากกว่าเกลียดหมา

        ทุกเย็นจนสิ้นฤดู เด็กสิบสามคนยืนชิดหลัง{name}เป็นแถว ถือไม้กวาดตั้งตรง ไม่ให้ปลายข้ามไหล่ใคร เช้าที่เกวียนออก เด็กคนที่เคยสะดุ้งทุกครั้งที่หมาเห่าเดินมาขอจับมือ{name}ก่อนขึ้นเกวียน จับแน่นจนข้อนิ้วขาว
      effects: { stats: { CHA: 1 }, flags: [drilled_the_levy_behind_me] }
    - id: decline_to_drill
      label: คืนไม้กวาด ให้เจ้าของโรงเตี๊ยมฝึกกันเอง
      text: |
        เจ้าของโรงเตี๊ยมฝึกเอง เขานับช้า ให้เดินเป็นวงรอบลาน ยกไม้กวาดขึ้นลงตามจังหวะ เหมือนขบวนแห่เจ้าบ่าว แม่ค้าชอบ ปรบมือทุกเย็น

        {name}ดูจากหน้าต่างทุกเย็นจนสิ้นฤดู ตะโกนแก้ไปหนเดียว คนที่ถือไม้กวาดกลับหัวหันมามอง แล้วกลับหัวไม้กวาดให้ถูก ที่เหลือไม่มีใครได้ยิน
      effects: { flags: [declined_to_drill_the_levy] }

# ---------- เอาถ่านไปคืน ----------
- id: adult.era_fort_bring_the_coal_back
  stage: adult
  weight: 120
  scene: temple
  when:
    age: [16, 130]
    year: [362, 400]
    flags: [set_a_door_coal]
    not_flags: [race_tiefling]
    marks: { brand: [1, 3] }
  text: |
    ข่าวไปตามบ่อน้ำแบบเดียวกับข่าวราคาเกลือ ที่วิหารเวรัสแห่งที่ใกล้ที่สุด มีนักบวชแก่คนหนึ่งลบตราบนฝ่ามือให้คนที่เอาถ่านเฝ้าประตูมาคืน ไม่เก็บเงิน ไม่เทศน์ ไม่มีอะไรให้กัดหรือให้ดื่มก่อน ตะเกียงแขวนดวงเดียว เปลวไฟเปลวเดียว คนที่ไปมาแล้วเล่าได้เท่านี้ แล้วกำมือข้างนั้นซ่อนไว้ในแขนเสื้อ

    ถ่านบนธรณีของ{name}อยู่ตรงที่วางมาตั้งแต่วันแรก ไม่เคยขยับ ฝุ่นไม่จับ หิมะตกลงมาก็ละลายเป็นวง ฝ่ามือข้างที่วางยังอุ่นขึ้นมาก่อนทุกเช้า ก่อนเตาในบ้านจะติด

    คนด้ายแดงบอกไว้ตั้งแต่วันแรกว่าอย่าย้าย ไม่ได้บอกว่าถ้าย้ายแล้วจะเป็นอะไร
  choices:
    - id: take_it_to_the_priest
      label: ใช้คีมคีบถ่านใส่หม้อดิน เดินไปวิหารเวรัส แล้วยื่นมือให้นักบวช
      text: |
        นักบวชรับหม้อไปวางบนชั้นหลังแท่น เขียนชื่อซอยไว้บนฝาด้วยชอล์ก บนชั้นมีหม้อมีฝาแบบเดียวกันอีกยี่สิบกว่าใบ ทุกใบอุ่นเท่ากัน แล้วเขาให้{name}ใช้มืออีกข้างกำขอบโต๊ะไว้ เอียงตะเกียงลงจนเปลวเลียฝ่ามือ ไล่ช้าๆ จากขอบเข้าหาตรงกลาง กลิ่นที่ลอยขึ้นมาไม่ใช่กลิ่นเนื้อไหม้ เป็นกลิ่นถ่าน

        ฝ่ามือพองอยู่ครึ่งเดือน แล้วหายเป็นผิวสีชมพูเรียบ ความอุ่นตอนเช้าลดลงจากที่เคยเป็น คืนแรกที่ธรณีประตูว่าง {name}นอนฟังเสียงลมอยู่จนสาง เช้าขึ้นมาตรงที่เคยวางถ่านมีรอยวงกลมสีซีดบนไม้ ขัดยังไงก็ไม่ออก
      effects: { marks: { brand: -1 }, hp: -1, world: { gods: 1 }, flags: [brought_the_door_coal_back] }
    - id: keep_the_coal
      label: ปล่อยถ่านไว้บนธรณีตามเดิม
      text: |
        {name}ไม่ได้ไป หน้าหนาวนั้นฝูงผ่านถิ่นสามคืน ทุกคืนรอยเท้าขอบไหม้เลี้ยวอ้อมธรณีของ{name}เป็นครึ่งวงกลมเท่ากันทุกรอย ฝ่ามืออุ่นจนถือถ้วยน้ำเย็นแล้วน้ำในถ้วยอุ่นตามช้าๆ

        เพื่อนบ้านสองบ้านที่เอาถ่านไปคืนที่วิหารแล้ว คืนไหนได้ยินเสียงหอนก็หอบผ้าห่มมานอนในบ้านของ{name} พื้นห้องหน้าเต็มทุกคืนที่หมาหอน ไม่มีใครพูดถึงวิหาร และไม่มีใครถามว่ามือ{name}เป็นอย่างไรบ้าง
      effects: { world: { demon: 1 }, flags: [kept_the_door_coal] }
    - id: pass_it_to_a_neighbour
      label: ยกถ่านให้เพื่อนบ้านที่มาขอ ให้เขาวางที่ธรณีบ้านตัวเองด้วยมือของเขาเอง
      text: |
        เพื่อนบ้านคนนั้นเพิ่งมีลูกอ่อน มาขอสามหน หนที่สามยืนรอที่ประตูตั้งแต่ก่อนเช้า {name}ใช้คีมคีบถ่านใส่มือเขา เขาเดินถือไปเหมือนถือไข่ แล้ววางลงบนธรณีบ้านตัวเองด้วยมือข้างขวา คืนนั้นฝ่ามือขวาของเขาอุ่นขึ้น

        ฝ่ามือของ{name}ไม่ได้อุ่นน้อยลงเลยแม้แต่น้อย อุ่นขึ้นมาก่อนเตาติดทุกเช้าเหมือนเดิม แต่ธรณีของ{name}ว่างแล้ว วันตลาดถัดมาหญิงผูกด้ายแดงเดินผ่านซอย หยุดดูธรณีบ้านเพื่อนบ้านคนนั้น แล้วหันมาดูธรณีบ้าน{name} นางยิ้มให้ทั้งสองบ้านเท่ากัน
      effects: { world: { demon: 1 }, flags: [passed_the_door_coal_on] }
