# ชุด 3 อายุ 41 ถึง 64: ขั้นงานของชาวนา คนงานโรงกลั่น คนแบกของท่าเรือ คนงานเหมือง งานละสามเรื่อง
# ขั้นกลาง (41–48) ขั้นสูง (49–56) วันวางมือ (57–64)
# วันวางมือ: ทุกตัวเลือกตั้ง retired หรือ still_working อย่างใดอย่างหนึ่ง กับ flag เฉพาะของตัวเลือก

# ---------- ชาวนา ----------
- id: adult.career_farmer_cow_mound
  stage: adult
  weight: 45
  when:
    age: [41, 48]
    flags: [job_farmer]
  text: |
    กลางทุ่งผืนใหญ่ของหมู่บ้านมีเนินดินเตี้ยๆ เนินหนึ่ง สูงแค่เข่า กว้างเท่าลานนวด อยู่ในแปลงที่{name}เช่ามาตั้งแต่หนุ่ม ไม่มีใครในหมู่บ้านไถข้ามเนินนั้น รอยไถทุกรอยโค้งอ้อมเป็นวงเหมือนน้ำไหลอ้อมหิน หญ้าบนเนินเขียวทั้งปี แม้หน้าแล้งที่หญ้าคันนาเหลืองหมดแล้ว

    ปีนี้ออสรินส่งคนแบกตาชั่งมาบอกว่าให้ไถเนินนั้นทิ้ง ปลูกข้าวให้เต็มแปลง บ้านใหญ่ติดหนี้วิหารเบเลคมาสามปี ดอกขึ้นทุกฤดู ทุกศอกต้องให้ข้าว แปลงไหนไม่ไถ ค่าเช่าปีนี้ขึ้นอีกหนึ่งกระสอบ

    คนแก่ในหมู่บ้านไม่มีใครบอกได้ว่าห้ามไถเพราะอะไร บอกได้แค่ว่าไม่ไถ {name}ยืนอยู่หัวคันนา มือกดเอวข้างซ้าย หลังปีนี้ก้มไถได้ทีละครึ่งเช้า แล้วต้องนั่งพัก
  choices:
    - id: plow_the_mound
      label: เทียมควาย ไถข้ามเนินตามที่บ้านใหญ่สั่ง
      text: |
        {name}ไถข้ามเนินในเช้าวันเดียว ดินบนเนินร่วนกว่าดินรอบข้าง สีดำ กลิ่นเหมือนฟางที่เพิ่งเปียกฝน ควายเดินช้าลงทุกครั้งที่ผานลากขึ้นเนิน แต่ไม่หยุด ตกเย็นแปลงของ{name}มีรอยไถตรงเป็นเส้นเป็นครั้งแรกตั้งแต่มีหมู่บ้าน

        คืนนั้นเด็กเลี้ยงควายวิ่งมาบอกว่ามีวัวตัวเท่าเกวียน ขนฟูสีฟาง เดินอยู่ในนาของ{name} เดินทวนรอยไถทีละรอย ช้าๆ จากเนินไปจนสุดแปลง แล้วย้อนกลับมาเริ่มรอยใหม่ เช้ามากล้าในแปลงราบเป็นแผ่น ส่วนรอยไถบนเนินกลบเรียบเหมือนไม่เคยมีผานผ่าน
      effects: { gold: -2, alignment: { law: 1 }, taboo: { field: break }, flags: [plowed_the_cow_mound] }
    - id: plow_around_it
      label: ไถอ้อมเนินเหมือนทุกปี แล้วยอมจ่ายค่าเช่าเพิ่ม
      text: |
        {name}ไถอ้อมเนินอย่างที่คนเช่าแปลงนี้ทุกรุ่นไถ รอยไถโค้งเป็นวงเดิม ตอนเกี่ยว{name}แบกกระสอบเพิ่มหนึ่งกระสอบไปบ้านใหญ่เอง คนแบกตาชั่งของออสรินจดตัวเลข แล้วถามว่าบนเนินนั้นมีอะไร {name}บอกว่ามีหญ้า

        หน้าแล้งปีนั้นหญ้าบนเนินยังเขียว ควายของ{name}ยืนเล็มหญ้าอยู่ตรงขอบเนินทุกเย็น ไม่เคยเหยียบขึ้นไป
      effects: { stats: { WIS: 1 }, gold: -3, taboo: { field: keep }, flags: [plowed_around_the_mound] }
    - id: bring_osrin_to_it
      label: พาออสรินมานั่งบนเนินตอนเย็นด้วยตัวเอง
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          ออสรินไม่ได้เดินบนคันนามาหลายปี รองเท้าหนังเปื้อนโคลนถึงตาตุ่มกว่าจะถึงเนิน {name}ไม่พูดเรื่องข้อห้าม ให้เขานั่งลงบนหญ้าเขียวกลางหน้าแล้ง แล้วนับให้ฟังว่าเนินนี้ไถแล้วจะได้ข้าวกี่กระสอบ เทียบกับดอกเบี้ยวิหารเบเลคเดือนเดียว

          ออสรินนั่งอยู่จนตะวันลับ ลุกขึ้นปัดหญ้าออกจากก้น บอกว่าเนินนี้ไม่คุ้มค่าผาน ค่าเช่าของ{name}ปีนั้นไม่ขึ้น และไม่มีใครส่งคนมาพูดเรื่องเนินอีก
        effects: { stats: { CHA: 1 }, taboo: { field: keep }, flags: [osrin_left_the_mound] }
      failure:
        text: |
          ออสรินมาถึงเนินแล้วไม่ยอมนั่ง ยืนอยู่บนคันนา บอกว่าเขาไม่ได้เลี้ยงบ้านด้วยหญ้า วันรุ่งขึ้นเขาส่งคนรับจ้างจากหมู่บ้านอื่นสองคนมาไถเนินแทน คืนนั้นวัวขนสีฟางตัวเท่าเกวียนลุกขึ้นจากเนิน เดินทวนรอยไถไปจนสุดแปลง เหยียบกล้าของ{name}ไปทั้งแถบ

          ค่าเช่าขึ้นหนึ่งกระสอบตามที่ประกาศไว้ เพราะ{name}ไม่ได้ไถเอง
        effects: { gold: -3, taboo: { field: learn }, flags: [mound_plowed_by_strangers] }
    - id: renters_pay_for_it
      label: เรียกคนเช่านาทั้งสิบเอ็ดแปลงมานั่งใต้ต้นมะขาม
      requires: { flag: renters_man }
      text: |
        คนเช่านาทั้งสิบเอ็ดแปลงมานั่งใต้ต้นมะขามหัวหมู่บ้าน ตรงที่ตาชั่งตั้งอยู่มาหลายปี {name}ไม่ถามว่าใครกลัวอะไร ถามแค่ว่าใครยอมให้ข้าวเพิ่มคนละกระบุง แทนหนึ่งกระสอบที่บ้านใหญ่จะได้จากเนินนั้น ได้สิบเอ็ดกระบุงก่อนตะวันตก

        {name}ชั่งสิบเอ็ดกระบุงต่อหน้าคนของออสรินใต้ต้นมะขาม เกินหนึ่งกระสอบไปครึ่งกระบุง คนของออสรินจดตัวเลขแล้วกลับไป หญ้าบนเนินยังเขียวตลอดหน้าแล้ง
      effects: { gold: -1, alignment: { moral: 1 }, taboo: { field: keep }, flags: [renters_paid_for_the_mound] }

- id: adult.career_farmer_star_dishes
  stage: adult
  weight: 45
  when:
    age: [49, 56]
    flags: [job_farmer]
  text: |
    คนของโรงกลั่นจากเวนทราสมาพร้อมเกวียนบรรทุกจานทองแดงขนาดเท่าล้อเกวียน จานพวกนี้ตั้งเรียงกันกลางทุ่งเพื่อรับน้ำค้างดาวตอนดึก โรงกลั่นจะเช่าทุ่งเหนือของหมู่บ้านทั้งทุ่ง สิบปี จ่ายบ้านใหญ่ปีละสามสิบเหรียญ มากกว่าที่ข้าวทั้งทุ่งเคยให้ออสรินในปีที่ดีที่สุด

    ทุ่งเหนือมีนาเช่าเจ็ดแปลง รวมแปลงของ{name} ออสรินเรียก{name}ไปที่บ้านใหญ่ บอกว่าคนเช่านาฟังคนที่เกี่ยวข้าวข้างกันมามากกว่าฟังเขา ถ้า{name}พาเจ็ดครอบครัวย้ายลงไปเช่านาทุ่งใต้ที่น้ำไม่ค่อยถึงได้โดยไม่มีเรื่อง แปลงของ{name}จะได้อยู่ที่เดิม เป็นแปลงเดียวในทุ่งเหนือที่ยังปลูกข้าว และค่าเช่าลดลงครึ่งหนึ่ง

    {name}เคยเห็นทุ่งที่ตั้งจานแล้วในหมู่บ้านใกล้กำแพงเมือง กลางคืนแสงฟ้าจากจานสว่างจนไก่ขันผิดเวลา
  choices:
    - id: move_the_seven
      label: พาเจ็ดครอบครัวลงไปทุ่งใต้ตามที่ออสรินขอ
      text: |
        {name}เดินไปทีละบ้าน ไม่ขู่ ไม่สัญญาอะไรที่ให้ไม่ได้ บอกตัวเลขตามจริง ทุ่งใต้น้ำไม่ถึงสองปีในห้า ค่าเช่าเท่าเดิม หกครอบครัวย้ายก่อนฝนแรก ครอบครัวที่เจ็ด ยายคนหนึ่งไม่ยอมลุกจากแคร่หน้าบ้าน ลูกชายต้องอุ้มยายขึ้นเกวียน

        ฤดูต่อมาแปลงของ{name}เป็นแปลงเดียวที่มีข้าวในทุ่งเหนือ กลางคืนรวงข้าวสะท้อนแสงฟ้าจากจานรอบด้าน ค่าเช่าลดลงครึ่งหนึ่งตามที่ออสรินพูด คนเช่านาทุ่งใต้ไม่มีใครเดินผ่านคันนาของ{name}อีก
      effects: { gold: 4, alignment: { law: 1, moral: -1 }, flags: [moved_the_north_renters] }
    - id: stand_at_the_big_house
      label: พาคนเช่านาทั้งสิบเอ็ดแปลงไปยืนหน้าบ้านใหญ่อีกครั้ง
      requires: { flag: renters_man }
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          คนเช่านาสิบเอ็ดคนไปยืนหน้าบ้านใหญ่ตอนสาง ถือกระบุงเปล่าคนละใบเหมือนเมื่อหลายปีก่อน ครั้งนี้ไม่ได้ขอให้ลดค่าเช่า {name}ยื่นข้อเดียว ถ้าทุ่งเหนือเป็นของจาน ทุ่งใต้จะไม่มีใครเกี่ยวให้ ทั้งสิบเอ็ดแปลงจะไปเช่านาบ้านอื่น

          ออสรินนับในใจว่าสามสิบเหรียญจากโรงกลั่นจ่ายดอกเบี้ยวิหารได้กี่เดือน แล้วนับข้าวทุ่งใต้ เขาให้โรงกลั่นเช่าแค่เนินหินหัวทุ่งที่ไม่มีใครปลูกอะไรได้ จานสิบสองใบตั้งเรียงอยู่บนเนินนั้น นาทั้งเจ็ดแปลงยังเป็นนา
        effects: { stats: { CHA: 1 }, flags: [renters_kept_the_north_field] }
      failure:
        text: |
          คนเช่านามาถึงหน้าบ้านใหญ่แค่เจ็ดคน อีกสี่คนอยู่ทุ่งใต้ ไม่อยากเสี่ยงนาของตัวเองเพื่อทุ่งที่ไม่ใช่ของตัว ออสรินนับคนหน้าประตูแล้วปิดประตู

          โรงกลั่นได้ทุ่งเหนือทั้งทุ่ง ส่วนแปลงของ{name}ย้ายลงไปทุ่งใต้พร้อมคนอื่น ค่าเช่าเท่าเดิม น้ำน้อยกว่าเดิม
        effects: { gold: -3, flags: [lost_the_north_field] }
    - id: offer_the_stony_rise
      label: เสนอให้ตั้งจานบนเนินหินหัวทุ่งที่น้ำไม่เคยขึ้นถึง
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}พาคนของโรงกลั่นเดินขึ้นเนินหินหัวทุ่งตอนเที่ยงคืน ให้นอนหงายบนหินดูฟ้า ที่นั่นสูงกว่าทุ่งทั้งทุ่ง ไม่มีต้นไม้บัง ไม่มีหมอกลงตอนดึกเหมือนในนา น้ำค้างบนหินหนากว่าบนหญ้าคันนา คนของโรงกลั่นลองรองเองด้วยจานเล็กที่พกมา

          โรงกลั่นเช่าเนินหินแทนทุ่ง จ่ายบ้านใหญ่ปีละสิบสองเหรียญ ออสรินได้น้อยกว่าที่หวัง แต่ไม่ต้องย้ายใคร ปลายปีเขาส่งคนเอาเงินมาให้{name}สองเหรียญ ไม่บอกว่าค่าอะไร
        effects: { stats: { INT: 1 }, gold: 2, flags: [dishes_on_the_stony_rise] }
      failure:
        text: |
          คนของโรงกลั่นเดินขึ้นเนินหินแล้วส่ายหัว จานต้องตั้งบนดินเรียบ ปักขาลงได้ลึก หินเอียงแบบนี้ลมพัดทีเดียวจานก็ล้ม โรงกลั่นได้ทุ่งเหนือทั้งทุ่งตามที่ตกลงกับออสรินไว้แต่แรก

          แปลงของ{name}ย้ายลงทุ่งใต้ ค่าเช่าเท่าเดิม น้ำน้อยกว่าเดิม
        effects: { gold: -2, flags: [lost_the_north_field] }
    - id: kori_shows_his_hand
      label: ให้โครีแก้ผ้าพันมือซ้ายให้ออสรินดู
      requires: { flag: took_glass_kid }
      text: |
        โครีไม่ใช่เด็กที่นอนขดในกองฟางแล้ว แต่ผ้าพันมือซ้ายยังพันอยู่ทุกวัน เขาไปที่บ้านใหญ่กับ{name} คลายผ้าออกทีละรอบต่อหน้าออสริน หลังมือเป็นแก้วใสสีฟ้าจางๆ ไปถึงข้อนิ้ว เห็นเส้นเลือดอยู่ข้างใน แล้วเล่าว่าในเวนทราส เขานอนใต้ตะเกียงฟ้ามาตั้งแต่จำความได้

        ออสรินมีลูกเล็กสองคน บ้านใหญ่อยู่ห่างทุ่งเหนือไม่ถึงสองร้อยก้าว เขาให้โรงกลั่นเช่าแค่ครึ่งทุ่งที่ไกลบ้านที่สุด และไม่ให้ตั้งจานใกล้หมู่บ้านกว่าสามคันนา นาของ{name}อยู่ในครึ่งที่เหลือ
      effects: { alignment: { moral: 1 }, flags: [kori_showed_his_hand] }

- id: adult.career_farmer_last_sheaf
  stage: adult
  weight: 45
  mark: วางเคียว
  when:
    age: [57, 64]
    flags: [job_farmer]
  text: |
    เคียวเล่มที่{name}ใช้มาตั้งแต่หนุ่มเปลี่ยนด้ามมาสามครั้ง ใบเคียวสึกจนโค้งแคบเหมือนจันทร์คืนท้ายเดือน ปีนี้{name}เกี่ยวได้วันละไม่ถึงครึ่งแปลง ที่เหลือคนเช่านาแปลงข้างๆ มาช่วยโดยไม่มีใครขอ

    ออสรินส่งคนมาถามว่าปีหน้าแปลงนี้จะให้ใครเช่าต่อ ธรรมเนียมของบ้านใหญ่ คนเช่าที่เกี่ยวไม่ไหวแล้วเลือกคนเช่าต่อเองได้หนึ่งคน ถ้าบ้านใหญ่ไม่ค้าน

    ข้าวกำสุดท้ายของแปลงยังยืนอยู่ตรงมุมนาที่ใกล้เนินที่สุด คนแก่บางบ้านยังผูกกำสุดท้ายทิ้งไว้ในนาทุกปี ไม่มีใครจำได้ว่าผูกไว้ให้ใคร
  choices:
    - id: tie_the_last_sheaf
      label: ผูกข้าวกำสุดท้ายทิ้งไว้ในนา แล้ววางเคียวบนคันนา
      text: |
        {name}มัดรวงข้าวกำสุดท้ายด้วยตอกไม้ไผ่ ปล่อยให้ยืนอยู่ในนาทั้งกอ แล้ววางเคียวลงบนคันนาข้างกอนั้น ไม่ได้หยิบกลับบ้าน คนแปลงข้างๆ เห็นแต่ไม่ถาม

        เช้าวันต่อมา ข้าวกำนั้นหายไปทั้งกอ ตอข้าวเหลือเรียบเสมอดิน รอบตอมีรอยกีบใหญ่เท่าฝาหม้อสี่รอย เดินออกจากนาไปทางเนิน เคียวยังวางอยู่บนคันนาที่เดิม {name}ปล่อยไว้ตรงนั้นจนสนิมกินถึงด้าม
      effects: { stats: { WIS: 1 }, taboo: { field: keep }, flags: [retired, tied_the_last_sheaf] }
    - id: plot_to_kori
      label: บอกบ้านใหญ่ว่าขอให้แปลงนี้เป็นของโครี
      requires: { flag: took_glass_kid }
      text: |
        คนของออสรินถามว่าเด็กผิวแก้วจากเมืองจะเกี่ยวข้าวเป็นหรือ {name}พาไปดูกระสอบข้าวในยุ้ง ครึ่งหนึ่งโครีเกี่ยวเองมาหลายปีแล้ว ผ้าพันมือซ้ายไม่เคยทำให้เคียวในมือขวาช้าลง

        บ้านใหญ่ไม่ค้าน ฤดูไถปีต่อมา {name}นั่งบนตอไม้หัวคันนาตั้งแต่เช้า บอกโครีว่าตรงไหนน้ำขังนาน ตรงไหนต้องไถลึก และให้ไถอ้อมเนินเหมือนเดิม โครีไถอ้อมเนินเป็นวงโค้งเท่ากับรอยเก่าทุกรอย
      effects: { alignment: { moral: 1 }, flags: [retired, kori_took_the_plot] }
    - id: keep_half_the_plot
      label: คืนนาครึ่งแปลง เก็บครึ่งที่ใกล้บ้านไว้ทำเอง
      check: { stat: CON, dc: 13 }
      effects: { flags: [still_working, farms_half_a_plot] }
      success:
        text: |
          ครึ่งแปลงที่เหลือ{name}ไถเองทั้งหมด ไถทีละแถบ แถบละครึ่งเช้า แล้วนั่งพักใต้เพิงที่สร้างขึ้นใหม่หัวคันนา ข้าวในครึ่งแปลงนั้นขึ้นงามกว่าครึ่งที่คืนไป เพราะไม่มีกอไหนที่{name}ไม่ได้เดินผ่านทุกวัน

          ปลายปี{name}แบกกระสอบส่วนของบ้านใหญ่ไปเองไม่ไหวแล้ว แต่ข้าวในกระสอบเต็มทุกใบ
        effects: { stats: { CON: 1 } }
      failure:
        text: |
          เดือนที่สองของฤดูไถ หลังของ{name}แข็งค้างอยู่กลางนา ก้มอยู่อย่างนั้นจนคนแปลงข้างๆ เดินมาพยุงกลับบ้าน ครึ่งแปลงที่เหลือคนเช่านาสามบ้านผลัดกันมาไถให้ ไม่คิดค่าแรง

          {name}นอนคว่ำอยู่บนแคร่หน้าบ้านทั้งฤดู ฟังเสียงควายของคนอื่นลากผานผ่านนาของตัวเอง
        effects: { hp: -2 }
    - id: plot_to_the_neighbours_boy
      label: ยกแปลงให้ลูกชายบ้านข้างๆ ที่มาช่วยเกี่ยวทุกปี
      text: |
        เด็กหนุ่มบ้านข้างๆ มาช่วยเกี่ยวโดยไม่ขออะไรมาสามหน้าเกี่ยวแล้ว ไถเป็น เกี่ยวเป็น ยังไม่มีแปลงของตัวเอง {name}บอกคนของออสรินชื่อเดียว แล้วเดินไปบอกเด็กเองที่ลานนวด

        เด็กหนุ่มเอาข้าวมาให้{name}ทุกปีหลังเกี่ยว กระบุงหนึ่ง ไม่มากไม่น้อยกว่านั้น ปีแรกเขาถามว่าเนินกลางแปลงไถได้ไหม {name}บอกว่าไม่ไถ และไม่ต้องถามว่าทำไม
      effects: { alignment: { moral: 1 }, flags: [retired, plot_to_the_neighbours_boy] }

# ---------- คนงานโรงกลั่น ----------
- id: adult.career_refinery_dead_needle
  stage: adult
  scene: refinery
  weight: 45
  when:
    age: [41, 48]
    flags: [job_refinery_hand]
  text: |
    สมาคมโรงกลั่นตั้งหม้อใบใหม่ในโรงริมแม่น้ำ ใหญ่กว่าหม้อเบอร์สิบสี่สามเท่า ทองแดงยังเงา ไม่มีรอยมือ เข็มทองเหลืองบนหน้าปัดไม่ขยับเลยสักขีดตั้งแต่จุดไฟมาสามคืน คนงานกะดึกรุ่นใหม่บอกว่าหม้อดีๆ ก็นิ่งแบบนี้ หัวหน้ากะคนใหม่ส่งเด็กวิ่งข้ามสามโรงมาตาม{name}ตอนตีหนึ่ง

    {name}ยืนหน้าหม้อใบนั้น เอียงหูซ้ายเข้าหา หูข้างนี้ได้ยินเสียงสูงไม่ชัดมาตั้งแต่หน้าหนาวก่อน เสียงหม้อที่คนงานรุ่นเก่าเรียกว่าเสียงหายใจ ถ้ามี{name}ก็ไม่ได้ยินแล้ว ท้องหม้อเย็นเกินกว่าหม้อที่จุดไฟมาสามคืน

    หัวหน้ากะยืนรออยู่ข้างหลัง มือกำพวงกุญแจลิ้นท่อ ถามว่าจะให้ทำอะไร
  choices:
    - id: listen_with_the_hand
      label: ถอดถุงมือ แนบหลังมือกับท้องหม้อ ฟังด้วยมือแทนหู
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ไล่หลังมือไปตามท้องหม้อทีละคืบ จากล่างขึ้นบน ส่วนใหญ่เย็นเท่ากัน ตรงข้อต่อท่อเข็ม หลังมือรู้สึกถึงอะไรสั่นเบาๆ เหมือนแมลงติดอยู่ในกำปั้น ท่อเล็กที่ต่อเข้าเข็มอุดตัน น้ำค้างดาวตกผลึกเป็นแก้วอยู่ข้างในจนเข็มไม่รับแรงดันมาสามวัน

          {name}สั่งลดไฟลงครึ่งหนึ่ง แล้วค่อยๆ เปิดลิ้นระบายข้างหม้อ ไอสีฟ้าพุ่งออกมานานจนคนงานกะดึกนับได้ถึงสองร้อย หัวหน้ากะจดลงสมุดว่าท่อเข็มหม้อใบใหม่ต้องเคาะทุกต้นกะ
        effects: { stats: { WIS: 1 }, flags: [read_the_dead_needle] }
      failure:
        text: |
          ผิวหม้อเย็นจนหลังมือเกาะติด {name}ดึงออกมา หนังหลังมือลอกติดทองแดงไปแผ่นหนึ่ง แต่ไม่ได้ความอะไรเลย หัวหน้ากะต้องส่งคนวิ่งไปตามช่างเวทของสมาคม ช่างมาถึงตอนสาง เจอท่อเข็มอุดตันในเวลาไม่ถึงครึ่งชั่วยาม

          แผลที่หลังมือ{name}หายช้า หายแล้วมีจุดสีฟ้าจางๆ เท่าเมล็ดถั่วอยู่กลางแผล
        effects: { hp: -2, flags: [needle_burn_spot] }
    - id: kill_the_fire
      label: สั่งดับไฟใต้หม้อใบใหม่ทั้งเตา ไม่รอคำอนุญาตจากสมาคม
      text: |
        {name}สั่งดับไฟทั้งเตาใต้หม้อ คนงานกะดึกหันมองหน้ากันแต่ทำตาม ไฟดับไปได้ครึ่งชั่วยาม ท่อเล็กที่ต่อเข็มก็ปริ ไอสีฟ้าพุ่งออกเป็นเส้นเดียวไปกระทบเพดาน ทิ้งรอยแก้วไว้บนคานไม้ยาวเท่าแขน ถ้าไฟยังอยู่ใต้หม้อ รอยนั้นจะไม่หยุดอยู่แค่คาน

        สมาคมปรับโรงที่ดับหม้อโดยไม่ขออนุญาตสี่เหรียญ หัวหน้ากะคนใหม่จ่ายครึ่ง {name}จ่ายครึ่ง รอยแก้วบนคานไม่มีใครขูดออก
      effects: { stats: { WIS: 1 }, gold: -2, alignment: { law: -1 }, flags: [killed_the_new_pot_fire] }
    - id: the_fourth_valve
      label: ปีนท่อขึ้นไปปิดลิ้นตัวที่สี่บนเพดาน ตัวที่เมอร์ดอนเคยสอนชื่อไว้
      requires: { flag: knows_the_valves }
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          หม้อใบใหม่ต่อเข้าท่อเก่าบนเพดาน ท่อที่เคยส่งไปหม้อเบอร์สิบสี่เมื่อหลายปีก่อน ลิ้นตัวที่สี่ยังชื่อเดิม ยังหมุนทวนเข็มเหมือนเดิม {name}ปีนท่อขึ้นไปช้ากว่าสมัยหนุ่มครึ่งหนึ่ง เข่าซ้ายสั่นทุกข้อต่อ แต่ไม่ลื่น

          พอลิ้นตัวที่สี่ปิด แรงดันในหม้อใบใหม่หาทางออกไม่ได้นอกจากท่อเข็ม เข็มทองเหลืองดีดขึ้นจากศูนย์ไปค้างที่ขีดแดงทีเดียว คนงานกะดึกได้เห็นเข็มหม้อใบนี้ขยับเป็นครั้งแรก สมาคมจ่ายค่าตาให้{name}สามเหรียญ
        effects: { stats: { DEX: 1 }, gold: 3, flags: [closed_the_fourth_valve] }
      failure:
        text: |
          ครึ่งทาง ข้อต่อท่อร้อนกว่าที่จำได้ {name}ปล่อยมือ ร่วงลงมาค้างอยู่บนราวเหล็กข้างหม้อ สะโพกกระแทกขอบราว หัวหน้ากะต้องปีนขึ้นไปปิดลิ้นตัวที่สี่เอง ตามชื่อที่{name}ตะโกนบอกจากข้างล่าง
        effects: { hp: -3, flags: [closed_the_fourth_valve] }
    - id: olben_listens
      label: เรียกโอลเบนมาฟังแทน แล้วบอกว่าต้องฟังหาอะไร
      requires: { flag: kept_kid_awake }
      text: |
        โอลเบนไม่ใช่เด็กสิบสี่ที่บิดตัวอยู่บนกระสอบแล้ว ไหล่กว้าง เฝ้าหม้อสองใบในโรงข้างๆ หูยังดีเหมือนหูของ{name}เมื่อยี่สิบปีก่อน {name}บอกให้ฟังหาเสียงหายใจ เสียงฟู่บางๆ ทุกสิบนับ ถ้าไม่มี ให้ฟังหาเสียงที่ไม่ควรมี

        โอลเบนเอาหูแนบท้องหม้อ ไล่ไปรอบใบ หยุดที่ข้อต่อท่อเข็ม บอกว่าข้างในมีเสียงเหมือนเล็บขูดแก้ว {name}สั่งเปิดลิ้นระบาย ท่อเข็มมีน้ำค้างดาวตกผลึกอุดอยู่เต็ม เช้านั้นโอลเบนขอให้{name}สอนชื่อลิ้นท่อทุกตัวบนเพดาน
      effects: { alignment: { moral: 1 }, flags: [olben_heard_the_pot] }

- id: adult.career_refinery_inspector
  stage: adult
  scene: refinery
  weight: 45
  when:
    age: [49, 56]
    flags: [job_refinery_hand]
  text: |
    สมาคมโรงกลั่นเลิกให้หัวหน้ากะเขียนชื่อคนงานผิวแก้วเองแล้ว เพราะหน้านั้นในสมุดกะของหลายโรงว่างเกินไป ปีนี้สมาคมตั้งผู้ตรวจแขนขึ้นมาใหม่ แถวโรงกลั่นละหนึ่งคน ทุกต้นสัปดาห์ผู้ตรวจจะยืนหน้าประตูโรงก่อนกะเข้า ให้คนงานทุกคนถลกแขนเสื้อถึงศอก ยื่นข้อมือทั้งสองข้าง แล้วกรีดเครื่องหมายลงบัตร

    ผู้ตรวจแถวริมแม่น้ำต้องเป็นคนที่คนงานยอมยื่นแขนให้ดูโดยไม่ต้องจับ สมาคมเลือก{name} ค่าจ้างสองเท่าของหัวหน้ากะ ไม่ต้องเข้ากะดึกอีก

    คนงานแถวริมแม่น้ำมีสองร้อยกว่าคน {name}รู้จักครึ่งหนึ่ง และรู้ว่าอย่างน้อยเจ็ดคนพันผ้ารอบข้อมือทุกวันโดยไม่มีแผลไฟลวก
  choices:
    - id: inspect_by_the_rule
      label: รับตำแหน่ง ตรวจตามระเบียบทุกแขน
      text: |
        ต้นสัปดาห์แรก {name}ยืนหน้าประตูโรงแรก ให้คนงานถลกแขนทีละคน คนงานยื่นแขนให้โดยไม่ต้องจับจริงอย่างที่สมาคมว่า เพราะคนที่ขอดูเคยยืนเฝ้าเข็มข้างพวกเขามาสิบกว่าปี เดือนแรกบัตรมีเครื่องหมายแก้วสามใบ สามคนนั้นเดินออกจากแถวโรงกลั่นในสัปดาห์เดียวกัน

        ค่าจ้างเดือนแรกแปดเหรียญ คนงานในแถวยังทักทาย{name}ทุกเช้า แต่ไม่มีใครชวนนั่งกินข้าวด้วย
      effects: { gold: 8, alignment: { law: 1, moral: -1 }, reputation: { distillers: 1 }, flags: [became_glass_inspector] }
    - id: inspect_by_lamplight
      label: รับตำแหน่ง แล้วตรวจให้เห็นแค่ที่ควรเห็น
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}ตรวจทุกแขน ทุกต้นสัปดาห์ แต่ตรวจตอนตีห้า ก่อนตะวันขึ้น ใต้ตะเกียงน้ำมันดวงเดียว ไม่ใช่ตะเกียงฟ้า ผิวแก้วจุดเล็กๆ ใต้แสงไฟเหลืองดูไม่ต่างจากแผลพุพองจากไอร้อน และบัตรของสมาคมก็มีช่องให้กรีดแผลพุพองด้วย

          ปีแรกแถวริมแม่น้ำมีคนงานผิวแก้วบนบัตรหนึ่งคน คือคนที่แก้วขึ้นถึงคอแล้ว ค่าจ้างมาครบทุกเดือน สมาคมชมว่าแถวริมแม่น้ำสะอาดที่สุดในเวนทราส
        effects: { stats: { INT: 1 }, gold: 6, alignment: { law: -1 }, flags: [inspector_by_lamplight] }
      failure:
        text: |
          เดือนที่สอง สมาคมส่งผู้ตรวจอีกคนมาตรวจซ้ำโดยไม่บอกล่วงหน้า ตรวจกลางวัน ใต้ตะเกียงฟ้า บัตรของเขามีเครื่องหมายแก้วเก้าใบ บัตรของ{name}มีหนึ่ง

          สมาคมปลด{name}ออกจากตำแหน่ง เรียกค่าจ้างคืนสี่เหรียญ เก้าคนนั้นเดินออกจากแถวในวันเดียวกัน
        effects: { gold: -4, reputation: { distillers: -1 }, flags: [inspector_caught_looking_away] }
    - id: refuse_to_inspect
      label: ไม่รับ บอกสมาคมว่ามือคู่นี้ยังต้องเฝ้าเข็ม
      text: |
        สมาคมไม่ถามซ้ำ ตำแหน่งตกไปที่หัวหน้ากะโรงถัดไป ชายอายุน้อยกว่า{name}สิบปีที่ไม่เคยเฝ้าหม้อกะดึก ต้นสัปดาห์แรกเขาจับข้อมือคนงานทุกคนพลิกดูใต้ตะเกียงฟ้า

        {name}ยังเฝ้าเข็มกะดึกเหมือนเดิม เจ็ดคนที่พันผ้ารอบข้อมือเหลือสี่คนในปีนั้น สามคนที่หายไปไม่ได้บอกลาใคร
      effects: { alignment: { moral: 1 }, flags: [refused_glass_inspector] }
    - id: show_the_glass_again
      label: ถลกแขนเสื้อตัวเองให้คนของสมาคมดูก่อน
      requires: { flag: showed_own_glass }
      text: |
        จุดแก้วที่ข้อมือ{name}เคยเท่าเล็บก้อย ตอนนี้เท่าเหรียญ ขอบหยักเหมือนน้ำค้างแข็งเกาะกระจก {name}ถลกแขนให้คนของสมาคมดูต่อหน้าคนงานที่ยืนรอเข้ากะ แล้วถามว่าผู้ตรวจที่มีแก้วอยู่ที่ข้อมือตัวเองจะกรีดบัตรคนอื่นอย่างไร

        คนของสมาคมเก็บกระดาษแต่งตั้งเข้าแขนเสื้อ ปีนั้นแถวริมแม่น้ำไม่มีผู้ตรวจ ปีต่อมาสมาคมส่งคนมาจากแถวอื่น แต่คนงานที่ยืนรอเข้ากะเช้าวันนั้นจำได้ว่า{name}ถลกแขนข้างไหน
      effects: { reputation: { distillers: -1 }, alignment: { moral: 1 }, flags: [showed_the_glass_again] }

- id: adult.career_refinery_key_ring
  stage: adult
  scene: refinery
  weight: 45
  mark: ส่งพวงกุญแจลิ้นท่อ
  when:
    age: [57, 64]
    flags: [job_refinery_hand]
  text: |
    พวงกุญแจลิ้นท่อหนักขึ้นทุกปี เพราะสมาคมเพิ่มลิ้นท่อทุกปี ตอนรับมามีสิบเก้าดอก ตอนนี้มีสามสิบเอ็ด {name}รู้จักทุกดอกด้วยมือโดยไม่ต้องดู สมุดบัญชีกะปกหนังสีดำเปลี่ยนเล่มมาสามเล่มแล้ว เล่มแรกยังอยู่ในหีบใต้เตียง

    หน้าหนาวนี้นิ้วมือข้างขวาของ{name}เริ่มสั่นตอนเช้า ไขกุญแจลิ้นท่อต้องใช้สองมือ สมาคมแจ้งมาว่าหัวหน้ากะที่อยู่มาเกินสามสิบปีขอเงินก้อนแล้วพักได้ ให้ส่งกุญแจกับสมุดคืนภายในสิ้นฤดู

    ทุกเล่มของสมุดสี่เล่มมีหน้าคนงานผิวแก้ว ทุกหน้ามีชื่อ สมาคมส่งรายชื่อจากหน้านั้นไปทุกแถวโรงกลั่นในเวนทราส ใครมีชื่อจะไม่ได้เข้าโรงไหนอีก
  choices:
    - id: keys_to_the_guild
      label: ส่งกุญแจกับสมุดคืนสมาคมตามระเบียบ รับเงินก้อน
      text: |
        คนของสมาคมนับกุญแจทีละดอกบนโต๊ะในห้องหัวหน้ากะ ครบสามสิบเอ็ด จ่ายเงินก้อนหกเหรียญ แล้วยื่นกุญแจทั้งพวงให้ชายหนุ่มที่สมาคมส่งมาคุมกะแทน ชายคนนั้นไม่เคยเข้ากะดึกโรงนี้มาก่อน

        คืนแรกที่ไม่ได้เข้ากะ {name}ตื่นตอนตีหนึ่งเหมือนทุกคืน นั่งอยู่บนเตียง ได้ยินเสียงระฆังเปลี่ยนกะลอยมาจากริมแม่น้ำ
      effects: { gold: 6, alignment: { law: 1 }, flags: [retired, returned_keys_to_the_guild] }
    - id: keys_to_olben
      label: สอนชื่อลิ้นท่อทุกตัวให้โอลเบน แล้วยกพวงกุญแจให้
      requires: { flag: kept_kid_awake }
      text: |
        {name}พาโอลเบนปีนท่อทีละเส้นตลอดสามคืนสุดท้าย บอกชื่อลิ้นท่อทุกตัว ตัวไหนส่งไปหม้อเบอร์ไหน ตัวไหนฝืด ตัวไหนเคยแตก คืนที่สามโอลเบนบอกชื่อกลับมาได้ครบสามสิบเอ็ดตัวโดยไม่ต้องเปิดสมุด

        สมาคมไม่ชอบที่หัวหน้ากะเลือกคนแทนเอง แต่ในสมาคมไม่มีใครจำชื่อลิ้นท่อได้ครบเท่าโอลเบน พวงกุญแจห้อยอยู่ที่เข็มขัดของเขาตั้งแต่กะต่อมา ใต้พวงกุญแจมีผ้าสีเทาพันรอบข้อมือซ้ายไว้สองรอบ {name}ไม่ได้ถาม
      effects: { gold: 4, flags: [retired, gave_olben_the_keys] }
    - id: burn_the_glass_pages
      label: ฉีกหน้าคนงานผิวแก้วออกจากสมุดทุกเล่มก่อนส่งคืน
      text: |
        หน้าคนงานผิวแก้วในสมุดสี่เล่มมีชื่อรวมกันสิบเอ็ดชื่อ บางชื่อเป็นลายมือหัวหน้ากะก่อนหน้า บางชื่อเป็นลายมือของ{name}เอง {name}ฉีกออกทั้งสี่หน้า พับเป็นแถบยาว แล้วหย่อนลงเตาใต้หม้อเบอร์หนึ่งตอนเปลี่ยนกะ

        คนของสมาคมนับหน้าสมุดตอนรับคืน หายไปสี่หน้า เขาหักเงินก้อนไปครึ่งหนึ่ง เขียนหมายเหตุไว้ในทะเบียนว่าหัวหน้ากะคนนี้ส่งสมุดคืนไม่ครบ สิบเอ็ดชื่อนั้นยังไม่ได้อยู่ในรายชื่อของแถวไหน
      effects: { gold: 3, alignment: { law: -1, moral: 1 }, flags: [retired, burned_the_glass_pages] }
    - id: watch_the_needles
      label: ขอสมาคมเฝ้าเข็มกะดึกต่อในฐานะคนงาน ไม่ถือกุญแจ
      text: |
        {name}ส่งกุญแจคืน แต่ไม่รับเงินก้อน ขอเฝ้าเข็มกะดึกต่อในโรงเดิม ค่าแรงเท่าคนงานใหม่ สมาคมไม่มีเหตุให้ปฏิเสธ คนที่เฝ้าเข็มเป็นมีน้อยลงทุกปี

        ทุกคืน{name}นั่งเก้าอี้ตัวเดิมหน้าหม้อแถวกลาง หัวหน้ากะคนใหม่เดินมาถามเรื่องเข็มก่อนเรื่องอื่น คนงานกะดึกรุ่นใหม่เรียกเก้าอี้ตัวนั้นว่าเก้าอี้เข็ม และไม่มีใครนั่งแทนตอน{name}ลุกออกไปข้างนอก
      effects: { gold: 2, flags: [still_working, watches_the_needles] }

# ---------- คนแบกของท่าเรือ ----------
- id: adult.career_docker_rope
  stage: adult
  weight: 45
  when:
    age: [41, 48]
    flags: [job_docker]
  text: |
    รอกไม้ที่ท่าสามยกลังหินอ่อนขึ้นจากท้องเรือบรรทุก ลังละน้ำหนักเท่าคนห้าคน เชือกป่านเส้นเท่าข้อมือพันรอบรอก คนแบกของสิบสองคนดึงอยู่ปลายเชือก {name}ยืนคุมจังหวะอยู่ที่ขอบท่า ไหล่ขวายกเกินหัวไม่ได้มาตั้งแต่ต้นปี งานคุมจังหวะเป็นงานเดียวที่ยังทำได้เต็มวัน

    ลังที่สี่ขึ้นไปค้างกลางอากาศสูงเท่าหลังคาโกดัง {name}ได้ยินเสียงเปาะเล็กๆ จากเชือก เหมือนเสียงหักตะเกียบ แล้วอีกครั้ง คนดึงเชือกไม่มีใครได้ยิน เจ้าของเรือยืนนับลังอยู่บนดาดฟ้า ค่าจ้างวันนี้คิดเป็นลัง ไม่ใช่เป็นวัน

    ใต้ลังที่ค้างอยู่ คนแบกหนุ่มสองคนยืนรอรับอยู่บนท้องเรือ
  choices:
    - id: lower_it_slow
      label: ไล่คนออกจากท้องเรือ แล้วนับจังหวะหย่อนลังกลับลงทีละศอก
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ตะโกนไล่สองคนนั้นออกจากท้องเรือก่อน แล้วนับจังหวะช้ากว่าที่เคยนับ คนดึงเชือกปล่อยทีละศอกตามเสียง ระหว่างทางลงได้ยินเสียงเปาะอีกสามครั้ง ลังแตะท้องเรือตอนเกลียวเชือกตรงนั้นเหลือไม่ถึงครึ่ง

          เจ้าของเรือลงมาดูเชือกเอง เกลียวที่ขาดชุ่มน้ำมันดำ เชือกเส้นนี้ซื้อมาจากเรือที่จมแล้วกู้ขึ้นมา เขาจ่ายค่าจ้างวันนั้นเต็มวันโดยไม่นับลัง แล้วสั่งเชือกใหม่จากร้านในเมือง
        effects: { stats: { WIS: 1 }, gold: 3, flags: [heard_the_rope_go] }
      failure:
        text: |
          ลังลงมาได้ครึ่งทาง เชือกขาดก่อนถึงท้องเรือสองช่วงตัว ลังหินอ่อนตกกระแทกขอบเรือ แตกครึ่ง ครึ่งหนึ่งจมลงแม่น้ำ คนแบกหนุ่มสองคนอยู่บนท่าแล้วเพราะ{name}ไล่ขึ้นมาตั้งแต่แรก

          เจ้าของเรือหักค่าลังที่จมจากค่าจ้างทั้งแถว และหักส่วนของ{name}มากกว่าคนอื่น เพราะเป็นคนคุมจังหวะ
        effects: { gold: -4, flags: [heard_the_rope_go] }
    - id: take_the_strain
      label: วิ่งไปพันปลายเชือกรอบเสาท่า เอาตัวรับน้ำหนักช่วงที่เปื่อย
      check: { stat: STR, dc: 14 }
      success:
        text: |
          {name}พันเชือกสองรอบรอบเสาท่าที่ใกล้ที่สุด แล้วเอาหลังพิงเสา มือทั้งสองกำเชือกเหนือรอยเปื่อย น้ำหนักลังส่งผ่านเชือกมาถึงฝ่ามือ แล้วถึงไหล่ขวาที่ยกไม่ขึ้น {name}ไม่ยกไหล่ แค่ไม่ปล่อย

          ลังหย่อนลงท้องเรือได้โดยไม่มีใครต้องกระโดดหนี ฝ่ามือทั้งสองข้างของ{name}ถลอกเป็นรอยเกลียวเชือก เจ้าของเรือจ่ายค่าลังนั้นให้{name}คนเดียวสองเหรียญ
        effects: { stats: { STR: 1 }, gold: 2, flags: [held_the_rope_on_the_post] }
      failure:
        text: |
          พันเชือกรอบเสาได้รอบเดียว เชือกขาดตรงรอยเปื่อย ปลายเชือกที่เหลือกระชากผ่านมือ{name}ไปจนหนังฝ่ามือหลุดเป็นแผ่น ลังตกลงท้องเรือ คนแบกหนุ่มสองคนกระโดดลงน้ำทันเพราะได้ยินเสียง{name}ร้อง

          ไหล่ขวาของ{name}หลุดจากเบ้า หมอในตรอกหลังท่าดึงเข้าที่ด้วยเท้าข้างหนึ่งยันซี่โครง สองเดือนต่อมา{name}ยังคุมจังหวะด้วยแขนข้างเดียว
        effects: { hp: -3, flags: [rope_tore_the_shoulder] }
    - id: dogal_clears_the_hold
      label: ตะโกนเรียกดอกัลให้ไล่คนออกจากท้องเรือ
      requires: { flag: dogal_walks_ahead }
      text: |
        ดอกัลเดินนำหน้าหุ่นยามมาหลายปีจนเสียงของเขาเป็นเสียงที่ทุกคนบนท่าหันไปหาก่อนเสียงอื่น {name}ตะโกนชื่อเขาคำเดียว ดอกัลแหงนขึ้นไปเห็นลังที่ค้าง แล้วตะโกนลงท้องเรือคำเดียวเหมือนกัน

        คนแบกหนุ่มสองคนกระโดดลงน้ำก่อนเชือกขาดหนึ่งลมหายใจ ลังหินอ่อนตกลงบนท้องเรือตรงที่สองคนนั้นเพิ่งยืน ทะลุพื้นเรือลงไปครึ่งลัง เจ้าของเรือด่าทั้งท่า แต่วันนั้นไม่มีใครต้องหามขึ้นจากท้องเรือ
      effects: { alignment: { moral: 1 }, flags: [dogal_cleared_the_hold] }
    - id: keep_hauling
      label: ปล่อยให้ยกต่อ เชือกเส้นนี้ยกมาทั้งเช้าแล้ว
      text: |
        {name}นับจังหวะต่อ ลังที่สี่ขึ้นถึงท่า ลังที่ห้า หก เจ็ด เสียงเปาะไม่ดังขึ้นอีก หรือดังแต่{name}ไม่ได้ยินในเสียงคนตะโกน ลังที่แปดเชือกขาดตอนลังอยู่สูงแค่เข่า ลังหล่นทับเท้าซ้ายของคนแบกหนุ่มคนหนึ่ง

        เจ้าของเรือจ่ายค่าจ้างครบแปดลัง ส่วนของ{name}ห้าเหรียญ คนแบกหนุ่มคนนั้นไม่ได้ลงท่าอีกจนสิ้นปี
      effects: { gold: 5, alignment: { moral: -1 }, flags: [kept_the_rope_hauling] }

- id: adult.career_docker_common_jar
  stage: adult
  weight: 45
  when:
    age: [49, 56]
    flags: [job_docker]
  text: |
    ไหดินเผาใบนั้นวางอยู่บนหิ้งในโรงข้าวต้มท้ายท่ามาตั้งแต่ก่อน{name}จะได้เป็นหัวแถว คนในแถวหยอดเงินลงไปคนละเศษเหรียญทุกสิ้นสัปดาห์ ใครตกน้ำ ใครหลังหัก ใครต้องจ่ายหมอ หยิบจากไหนั้น เมื่อวานไหมีเงินสิบเอ็ดเหรียญกับเศษอีกกำมือ เช้านี้ไหว่าง

    {name}ไม่ต้องถามใคร เด็กหนุ่มที่เข้าแถวมาได้ปีเดียวไม่มาลงท่าเช้านี้ แม่ของเขาไอเป็นเลือดมาตั้งแต่ต้นหนาว เย็นวันนั้นคนในแถวเจอเขานั่งอยู่หน้าร้านหมอในตรอกหลังท่า ห่อยาสามห่อวางอยู่บนตัก เงินที่เหลือไม่ถึงสามเหรียญ

    คนในแถวสิบเก้าคนยืนรออยู่ในโรงข้าวต้ม บางคนหยอดเงินลงไหนั้นมาสิบกว่าปี
  choices:
    - id: hand_him_to_the_watch
      label: จูงแขนเด็กไปส่งยามด่านเอง
      text: |
        {name}จูงแขนเด็กหนุ่มไปป้อมยามด่าน ไม่ให้คนในแถวแตะตัว ยามด่านจดชื่อ จดจำนวนเงิน แล้วขังเด็กไว้สามสิบวัน เงินที่เหลือสามเหรียญยามคืนให้แถว ห่อยาสามห่อเด็กขอให้{name}เอาไปส่งแม่

        เด็กหนุ่มไม่ได้กลับมาลงท่าอีก ไหใบนั้นมีกุญแจคล้องฝาตั้งแต่เดือนนั้น กุญแจห้อยอยู่ที่คอของ{name}
      effects: { alignment: { law: 1, moral: -1 }, flags: [handed_the_jar_thief_in] }
    - id: refill_it_quietly
      label: เอาเงินของตัวเองใส่ไหคืนให้ครบ ไม่บอกใครว่ามาจากไหน
      text: |
        {name}ขายตะขอเกี่ยวลังเล่มสำรองกับเสื้อหนาวตัวหนึ่ง รวมกับเงินใต้ฟูก ได้แปดเหรียญ เอาสามเหรียญที่เหลือจากเด็กมารวม ใส่ลงไหคืนนั้นก่อนคนในแถวมาถึง แล้วบอกทุกคนว่าเด็กเอาเงินมาคืนแล้ว

        เด็กหนุ่มกลับมาลงท่าเช้าวันรุ่งขึ้น ไม่มีใครถามว่าทำไมเงินครบ เขาแบกลังมากกว่าคนอื่นวันละสองเที่ยวไปจนสิ้นหนาว ไม่รับค่าแรงเที่ยวที่เกินมา
      effects: { gold: -8, alignment: { moral: 1 }, flags: [refilled_the_jar_quietly] }
    - id: the_row_votes
      label: ให้คนทั้งแถวหย่อนหินลงไหดำไหขาว
      requires: { flag: gang_votes }
      text: |
        ไหดำกับไหขาวใบเดิมยังวางอยู่บนหิ้งข้างไหกองกลาง {name}บอกให้ทุกคนหย่อนหิน ไหดำส่งเด็กให้ยามด่าน ไหขาวให้เด็กแบกใช้คืนไหทีละเที่ยว เด็กหนุ่มยืนอยู่หน้าหิ้ง ทุกคนเดินผ่านหน้าเขาไปทีละคน

        ไหขาวได้สิบสี่ก้อน ไหดำได้ห้า เด็กหนุ่มแบกลังเกินวันละสามเที่ยวไปสี่เดือน ค่าแรงเที่ยวเกินลงไหกองกลางจนครบสิบเอ็ดเหรียญ ห้าคนที่หย่อนลงไหดำไม่พูดถึงเรื่องนี้อีก แต่ไม่มีใครในห้าคนนั้นนั่งข้างเด็กตอนกินข้าวต้ม
      effects: { stats: { CHA: 1 }, flags: [row_voted_on_the_jar] }
    - id: make_him_carry_it_back
      label: ไม่ถามใคร สั่งให้เด็กแบกใช้คืนไหเอง แล้วแบกเที่ยวแรกไปด้วยกัน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ยืนบนลังหน้าโรงข้าวต้ม บอกทั้งแถวว่าเด็กจะแบกเที่ยวเกินจนเงินครบ แล้วเดินลงท่าไปแบกเที่ยวเกินเที่ยวแรกกับเด็กเอง ลังเกลือ บ่าซ้าย สิบเจ็ดขั้นบันได คนในแถวไม่มีใครเถียงคนที่เพิ่งแบกลังเกลือขึ้นบันไดด้วยไหล่ที่ยกไม่ขึ้น

          สี่เดือนต่อมาไหกองกลางมีเงินสิบเอ็ดเหรียญเท่าเดิม แม่ของเด็กหายไอทันหน้าร้อน
        effects: { stats: { CON: 1 }, flags: [boy_carried_back_the_jar] }
      failure:
        text: |
          คนในแถวสามคนเดินออกจากโรงข้าวต้มก่อน{name}พูดจบ คนหนึ่งบอกว่าเงินในไหเป็นของทุกคน ไม่ใช่ของหัวแถวคนเดียวจะยกให้ใคร สัปดาห์ต่อมาสามคนนั้นย้ายไปแถวอื่น พร้อมเงินที่เคยหยอดลงไหคนละครึ่งเหรียญที่{name}ต้องคืนให้

          เด็กหนุ่มแบกใช้คืนจนครบ แถวของ{name}เหลือสิบเจ็ดคน
        effects: { gold: -2, flags: [row_split_over_the_jar] }

- id: adult.career_docker_last_carry
  stage: adult
  weight: 45
  mark: แบกเที่ยวสุดท้าย
  when:
    age: [57, 64]
    flags: [job_docker]
  text: |
    ตะขอเกี่ยวลังของ{name}ด้ามไม้ดำเป็นมันตรงที่มือจับ ปลายเหล็กสึกจนแหลมน้อยกว่าตะขอของคนหนุ่ม ทุกเช้า{name}ยังเดินลงท่าก่อนระฆังเปิดท่า แต่ปีนี้แบกได้แค่ลังเบา ลังผ้า ลังใบชา ลังที่เด็กสิบห้าก็แบกได้ ไหล่ขวายกไม่ขึ้นแล้ว เข่าซ้ายลั่นทุกขั้นบันไดท่า

    เจ้าของเรือสามรายถามมาในเดือนเดียวกันว่าปีหน้าจะส่งงานให้แถวนี้ผ่านใคร คนในแถวยี่สิบคนรอคำตอบเดียวกัน
  choices:
    - id: one_heavy_crate
      label: แบกลังเกลือขึ้นบันไดท่าเป็นเที่ยวสุดท้าย แล้วแขวนตะขอ
      check: { stat: STR, dc: 14 }
      effects: { flags: [retired, carried_the_last_crate] }
      success:
        text: |
          {name}เลือกลังเกลือ ลังที่หนักที่สุดที่แถวแบกเป็นประจำ ยกขึ้นบ่าซ้ายแทนบ่าขวา เดินขึ้นบันไดท่าสิบเจ็ดขั้นช้าๆ คนในแถวยืนสองข้างบันได ไม่มีใครช่วย เพราะ{name}สั่งไว้

          ลังเกลือวางลงบนลานหน้าโกดังสิบสอง {name}แขวนตะขอไว้บนตะปูในโรงข้าวต้ม เหนือไหกองกลาง เจ้าของเรือรายหนึ่งจ่ายค่าเที่ยวนั้นสามเหรียญ แทนเศษเหรียญเหมือนทุกเที่ยว
        effects: { stats: { STR: 1 }, gold: 3 }
      failure:
        text: |
          ขั้นที่สิบสอง เข่าซ้ายพับ ลังเกลือไถลจากบ่ากลิ้งลงบันไดห้าขั้น แตกตรงมุม เกลือไหลเป็นทางขาว {name}นั่งอยู่บนขั้นที่สิบสองจนคนในแถวมาพยุงขึ้น เข่าข้างนั้นบวมไปทั้งหน้าหนาว

          ตะขอแขวนอยู่บนตะปูในโรงข้าวต้มตั้งแต่เย็นนั้น
        effects: { hp: -3 }
    - id: row_to_dogal
      label: พาดอกัลไปหาเจ้าของเรือทีละราย ยกแถวให้เขา
      requires: { flag: dogal_walks_ahead }
      text: |
        ดอกัลแขนเดียว แต่เสียงของเขาสั่งคนได้ทั้งท่า เจ้าของเรือทุกรายรู้จักเขาจากหลายปีที่เดินนำหน้าหุ่นยาม {name}พาเขาไปหาเจ้าของเรือสามรายทีละราย บอกว่าปีหน้าส่งงานให้แถวนี้ผ่านดอกัล

        เจ้าของเรือรายหนึ่งถามว่าหัวแถวแขนเดียวจะแบกของอย่างไร ดอกัลตอบเองว่าหัวแถวไม่ได้มีไว้แบก มีไว้นับ {name}ยกตะขอเกี่ยวลังให้ ดอกัลแขวนไว้ที่เข็มขัดข้างซ้าย
      effects: { alignment: { moral: 1 }, flags: [retired, gave_the_row_to_dogal] }
    - id: punch_the_plates
      label: ยกแถวให้คนที่แถวเลือก แล้วไปนั่งเจาะแผ่นคำสั่งหุ่นยามทั้งวัน
      requires: { flag: golem_operator }
      text: |
        หุ่นยามที่ท่ามีเก้าตัวแล้ว ทุกตัวต้องการแผ่นคำสั่งใหม่ทุกเช้า เจ้าของเรือยังจ้าง{name}เจาะแผ่น เพราะแผ่นของ{name}มีรูหนึ่งรูที่แผ่นของช่างเวทไม่มี รูที่สั่งให้หุ่นหยุดเมื่อมีอะไรอุ่นอยู่ใต้มือ

        {name}ย้ายไปนั่งโต๊ะเจาะแผ่นในโกดังเจ็ด ตอกเหล็กเจาะทีละรูตั้งแต่ตีห้า ค่าเจาะเดือนละสี่เหรียญ ไม่ต้องขึ้นบันไดท่าอีก ทุกเช้าหุ่นเก้าตัวเดินออกจากโกดังพร้อมรูที่{name}เจาะไว้ที่หลังคอ
      effects: { gold: 4, flags: [still_working, punches_the_golem_plates] }
    - id: count_by_ear
      label: ให้แถวเลือกหัวแถวคนใหม่ ตัวเองขอนั่งนับลังที่หัวท่า
      text: |
        คนในแถวเลือกหัวแถวคนใหม่กันเองในโรงข้าวต้ม {name}ไปขอเจ้าท่านั่งโต๊ะนับลังที่หัวท่า งานที่ไม่มีใครอยากทำเพราะต้องนั่งตากลมตั้งแต่ระฆังเปิดท่าจนปิด

        {name}นับลังด้วยการฟัง ลังเกลือเสียงทึบ ลังผ้าเสียงเบา ลังที่ของข้างในไม่ตรงกับตราที่ข้างลังเสียงผิดจากลังอื่น เดือนแรก{name}เจอลังเสียงผิดเจ็ดลัง เจ้าท่าขึ้นค่าจ้างให้หนึ่งเหรียญ
      effects: { stats: { WIS: 1 }, gold: 2, flags: [still_working, counts_crates_by_ear] }

# ---------- คนงานเหมือง ----------
- id: adult.career_miner_no_rats
  stage: adult
  scene: mine
  weight: 45
  when:
    age: [41, 48]
    flags: [job_miner]
  text: |
    ผู้จัดการเหมืองคนใหม่มาจากเวนทราส ไม่ชอบหนู สัปดาห์แรกที่มาถึงก็สั่งโรยข้าวคลุกยาเบื่อทุกชั้น หนูเหมืองที่กินเปลือกขนมปังของคนงานมาทุกรุ่นตายเป็นกองตามซอกอุโมงค์ คนงานรุ่นเก่าเก็บซากไปฝังที่ลานปากเหมืองโดยไม่บอกผู้จัดการ

    สามสัปดาห์ต่อมา อุโมงค์ชั้นสี่เงียบผิดปกติ ไม่มีเสียงตะกุยในผนัง ไม่มีเสียงแหลมเล็กๆ ตอนตะเกียงผ่าน {name}ลงไปตอนเปลี่ยนกะ ยืนนิ่งกลางอุโมงค์ ไอแห้งๆ สามครั้งจนต้องเอามือยันผนัง พอไอหยุด ก็ได้ยินเสียงที่ตาไอเคยสอนให้ฟัง คานค้ำหลังที่เจ็ดลั่นเบาๆ ทุกครั้งที่รถถ่านวิ่งผ่าน ลั่นนานกว่าหลังอื่นนิดเดียว

    ถ้าหนูยังอยู่ หนูจะวิ่งก่อน คนจะรู้ก่อน
  choices:
    - id: ring_the_floor_up
      label: ตีระฆังเรียกคนทั้งชั้นสี่ขึ้น ไม่รอผู้จัดการ
      text: |
        {name}ตีระฆังชั้นสี่เอง สามครั้งยาว สัญญาณที่ไม่มีใครตีมาหลายปี คนงานสามสิบคนวางพลั่ว ขึ้นบันไดโดยไม่ถาม ผู้จัดการรออยู่ที่ปากเหมือง หักค่าแรงทั้งชั้นครึ่งวัน ส่วนของ{name}หักทั้งวัน

        คืนนั้นคานหลังที่เจ็ดทรุดลงเงียบๆ พร้อมหลังที่หกกับแปด หินทับรางรถถ่านยาวสามช่วงตัว เช้ามาผู้จัดการลงไปดูเอง แล้วสั่งซื้อไม้ค้ำใหม่ทั้งชั้น ไม่คืนค่าแรงที่หัก
      effects: { stats: { WIS: 1 }, gold: -2, alignment: { law: -1 }, flags: [rang_the_fourth_floor_up] }
    - id: shore_by_ear
      label: เดินฟังคานทีละหลัง แล้วค้ำเสริมหลังที่ลั่นผิดเสียงเอง
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}เดินฟังคานทีละหลังตลอดกะ เคาะด้วยด้ามพลั่ว ฟังเสียงที่สะท้อนกลับ หลังที่เจ็ดเสียงทึบเหมือนเคาะต้นไม้ผุ หลังที่หกกับแปดเริ่มทึบ {name}กับคนงานสี่คนค้ำเสริมทั้งสามหลังด้วยไม้หมอนรางเก่า เสร็จก่อนกะเช้าเข้า

          สองเดือนต่อมาผู้จัดการให้ช่างไม้ตรวจคานทั้งชั้น ช่างไม้ดึงหลังที่เจ็ดออกมาดู เนื้อไม้ข้างในเป็นผงตั้งแต่โคนถึงหัว ผู้จัดการจ่ายค่าไม้หมอนรางที่{name}ใช้คืนให้สามเหรียญ
        effects: { stats: { WIS: 1 }, gold: 3, flags: [shored_by_ear] }
      failure:
        text: |
          หลังที่เจ็ดทรุดตอน{name}กำลังตอกลิ่มเสริม ไม่ทรุดทั้งหลัง ทรุดแค่ปลายคานข้างเดียว หินก้อนเท่าหัวคนหล่นลงบนเท้าซ้ายของ{name} นิ้วเท้าแตกสองนิ้ว

          คนงานสี่คนค้ำต่อจนเสร็จ ส่วน{name}นั่งพิงผนังกำเท้าอยู่ข้างราง เดินกะเผลกไปจนสิ้นฤดู
        effects: { hp: -3, flags: [shored_by_ear] }
    - id: call_the_rats_back
      label: เก็บเปลือกขนมปังจากทุกคน ไปวางเป็นทางล่อหนูจากเหมืองร้างข้างเนิน
      text: |
        เหมืองร้างอีกฝั่งเนินยังมีหนู คนงานรุ่นเก่ารู้ {name}เก็บเปลือกขนมปังจากคนงานทุกคนทุกวัน ไปวางเป็นทางจากปากเหมืองร้างข้ามเนินมาถึงปากเหมืองนี้ กำมือหนึ่งทุกร้อยก้าว เช้าเย็นอยู่สามสัปดาห์ ผู้จัดการเห็นแล้วหัวเราะ บอกว่าคนเหมืองบ้านนอกเลี้ยงหนูแทนแมว

        เช้าวันที่ยี่สิบสอง มีเสียงตะกุยในผนังชั้นสี่ แล้วก็ถี่ขึ้นทุกวัน วันที่สามสิบ หนูฝูงหนึ่งวิ่งออกจากชั้นสี่พร้อมกันตอนสาย คนงานวิ่งตามโดยไม่ต้องมีใครสั่ง คานหลังที่เจ็ดทรุดตามหลังคนสุดท้ายไปไม่ถึงสิบลมหายใจ
      effects: { alignment: { moral: 1 }, flags: [called_the_rats_back] }
    - id: crew_sits_down
      label: เรียกคนงานชุดที่เคยวางพลั่วพร้อมกันมาอีกครั้ง
      requires: { flag: crew_refused_together }
      text: |
        คนงานชุดที่เคยวางพลั่วพร้อมกันหน้ากำแพงชั้นห้ายังอยู่ในเหมืองเกินครึ่ง {name}เล่าเรื่องคานหลังที่เจ็ด แล้วบอกว่าจะไม่ลงชั้นสี่จนกว่าผู้จัดการจะเลิกโรยยาเบื่อ และซื้อไม้ค้ำใหม่ ตอนระฆังเข้ากะ คนงานสามสิบคนนั่งลงบนลานปากเหมืองพร้อมกัน

        ผู้จัดการทนได้สองวัน วันที่สามเขาส่งเกวียนขนไม้ค้ำมาเต็มเกวียน แล้วสั่งเก็บข้าวคลุกยาออกจากทุกชั้น เดือนนั้นค่าแรงหายไปสองวัน ไม่มีใครบ่น
      effects: { gold: -2, alignment: { law: -1 }, flags: [crew_sat_down_for_the_rats] }

- id: adult.career_miner_hand_wall
  stage: adult
  scene: mine
  weight: 45
  when:
    age: [49, 56]
    flags: [job_miner]
  text: |
    ตั้งแต่บริษัทให้{name}คุมคนงานชั้นห้า {name}เดินไปปลายอุโมงค์ทุกเย็นหลังเลิกกะ ไปดูกำแพงมือ ไม่มีใครสั่ง คืนนี้ตะเกียงที่ปลายอุโมงค์ยังไม่ดับ

    คนงานหนุ่มในชุดของ{name}คนหนึ่งคุกเข่าอยู่หน้ากำแพง ถือสิ่วกับค้อนไม้ หินก้อนหนึ่งตรงระดับเข่ามีรอยสกัดลึกครึ่งนิ้ว รูปฝ่ามือบนก้อนนั้นแหว่งไปสองนิ้ว ที่นิ้วกลางของเด็กหนุ่มมีแหวนเหล็กดำ

    เด็กหนุ่มไม่วิ่ง วางสิ่วลงช้าๆ บอกว่ามีคนจ่ายให้ก้อนละสิบเหรียญ แค่ให้สกัดรูปมือออก ไม่ต้องรื้อกำแพง แม่ของเขาติดหนี้วิหารเบเลคมาตั้งแต่พ่อตายในเหมืองนี้
  choices:
    - id: up_to_the_manager
      label: พาตัวขึ้นไปส่งผู้จัดการเหมือง
      text: |
        {name}เดินนำเด็กหนุ่มขึ้นบันไดร้อยสิบสองขั้น ไม่ผูก ไม่จับ เด็กเดินตามมาเอง ผู้จัดการไล่เด็กออกคืนนั้น ส่งชื่อไปยามของราชสำนักในวันรุ่งขึ้น แล้วสั่งให้ช่างปูนฉาบทับรอยสกัดให้เรียบ

        ปูนฉาบทับรูปมือที่แหว่งไปด้วย ก้อนนั้นจึงเป็นก้อนเดียวในกำแพงที่ไม่มีรูปมือ แม่ของเด็กหนุ่มมาหา{name}ที่ปากเหมืองครั้งหนึ่ง ยืนอยู่ตรงนั้นจนระฆังเข้ากะ แล้วกลับไป
      effects: { alignment: { law: 1 }, flags: [turned_in_the_wall_chipper] }
    - id: word_to_the_wardens
      label: ส่งข่าวไปป้อมผู้เฝ้าผนึก ให้คนที่รู้เรื่องกำแพงมาเอง
      text: |
        {name}เก็บเด็กไว้ในห้องเก็บเครื่องมือหนึ่งคืน ส่งข่าวไปกับเกวียนขนถ่านเที่ยวแรก ผู้เฝ้าผนึกสองคนมาถึงในสามวัน คนหนึ่งลงไปปลายอุโมงค์ชั้นห้า คุกเข่าหน้าก้อนที่แหว่ง ไล้นิ้วไปตามรอยสกัด แล้วจดลงสมุด อีกคนนั่งคุยกับเด็กหนุ่มในห้องเก็บเครื่องมือจนค่ำ

        ผู้เฝ้าผนึกพาเด็กหนุ่มไปด้วย ไม่มีใครในเหมืองรู้ว่าไปที่ไหน ตั้งแต่เดือนนั้นมีผู้เฝ้าผนึกหนึ่งคนลงมานั่งที่ปลายอุโมงค์ชั้นห้าทุกคืน บริษัทจ่ายค่าข้าวให้
      effects: { reputation: { wardens: 1 }, alignment: { law: 1 }, flags: [wardens_took_the_wall_chipper] }
    - id: talk_him_down
      label: ไม่บอกใคร อุดรอยสกัดด้วยปูนเถ้า แล้วนั่งคุยกับเด็กจนสาง
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ผสมปูนเถ้ากับน้ำจากรางระบาย อุดรอยสกัดจนเรียบ แล้วเอาปลายนิ้วกดรูปนิ้วที่แหว่งกลับลงไปในปูนเปียก สองนิ้ว ไม่สวยเท่าของเดิม จากนั้นนั่งลงข้างเด็กหนุ่ม คุยเรื่องหนี้ เรื่องพ่อของเขา เรื่องคนงานที่{name}เห็นตายในเหมืองนี้ ไม่พูดเรื่องแหวน

          ก่อนสาง เด็กหนุ่มถอดแหวนเหล็กดำออกวางบนหินข้างตะเกียง {name}หย่อนแหวนลงเตาหลอมของบริษัทตอนขึ้นไปข้างบน เด็กลงเหมืองตามปกติในกะต่อมา
        effects: { stats: { CHA: 1 }, world: { demon: -1 }, flags: [talked_the_boy_off_the_wall] }
      failure:
        text: |
          เด็กหนุ่มฟังทุกคำ ไม่เถียงสักคำ ตอนสางเขาขึ้นบันไดไปพร้อม{name} แล้วไม่ลงมาอีก สัปดาห์ต่อมา{name}เจอก้อนที่สองที่รูปมือแหว่ง ห่างก้อนแรกสามก้อน รอยสกัดลึกกว่าเดิม และไม่มีใครเห็นว่าใครทำ
        effects: { world: { demon: 1 }, flags: [wall_chipper_ran] }
    - id: vessan_keeps_watch
      label: ขอให้เวสซันมานั่งเฝ้ากำแพงทุกคืน ค่าจ้างออกจากกระเป๋าตัวเอง
      requires: { flag: saved_vessan }
      text: |
        เวสซันเดินในเหมืองไม่คล่องเท่าคนอื่นมาตั้งแต่วันที่คานทับ บริษัทให้ทำได้แค่งานกวาดถ่านที่ปากเหมือง ค่าแรงครึ่งเดียว {name}ส่งเด็กหนุ่มกลับบ้านคืนนั้น แล้วไปหาเวสซัน ขอให้มานั่งที่ปลายอุโมงค์ชั้นห้าทุกคืน จ่ายเดือนละสองเหรียญจากค่าแรงของ{name}เอง

        เวสซันเอาเก้าอี้ไม้เตี้ยลงมาตั้งหน้ากำแพงมือ ตะเกียงหนึ่งดวง ข้าวห่อหนึ่งห่อ เขาไม่เคยเจอใครถือสิ่วมาอีก แต่บอก{name}ว่าบางคืนหินก้อนที่แหว่งอุ่นกว่าก้อนอื่น
      effects: { gold: -2, alignment: { moral: 1 }, flags: [vessan_guards_the_wall] }

- id: adult.career_miner_last_ladder
  stage: adult
  scene: mine
  weight: 45
  mark: ขึ้นจากเหมืองครั้งสุดท้าย
  when:
    age: [57, 64]
    flags: [job_miner]
  text: |
    บันไดไม้จากปากเหมืองลงชั้นหนึ่งมีร้อยสิบสองขั้น {name}นับมาทั้งชีวิตโดยไม่ได้ตั้งใจนับ ปีนี้ขาขึ้นต้องหยุดพักสามครั้ง ครั้งละสิบลมหายใจ ทุกครั้งที่หยุดก็ไอ เสมหะสีเทาเข้มขึ้นทุกหนาว

    บริษัทไม่ไล่คนงานเก่าออก แต่ลดค่าแรงคนที่ไอจนต้องหยุดกลางกะ ปีนี้ค่าแรงของ{name}เหลือสองในสาม คนงานหนุ่มในชุดเรียก{name}ว่า{ลุง|ป้า} แต่ยังเดินมาถามทุกครั้งที่คานลั่นเสียงแปลก
  choices:
    - id: last_walk_to_the_wall
      label: ลงไปชั้นห้าครั้งสุดท้าย แตะกำแพงมือ แล้วขึ้นมาไม่ลงอีก
      check: { stat: CON, dc: 13 }
      effects: { flags: [retired, last_walk_to_the_hand_wall] }
      success:
        text: |
          {name}ลงทีละขั้น ช้ากว่าคนแบกถ่านทุกคนที่สวนขึ้นมา ปลายอุโมงค์ชั้นห้า{name}กางมือขวาวางทาบรูปฝ่ามือบนหินก้อนที่ใกล้ที่สุด นิ้วทั้งห้าลงร่องพอดี ข้อนิ้วบวมจนใหญ่กว่าร่องนิดหนึ่ง

          ขาขึ้น{name}หยุดพักห้าครั้ง ไม่ใช่สาม ถึงลานปากเหมืองตอนตะวันบ่าย หินลานร้อนเหมือนทุกวัน {name}นั่งลงบนหินจนตะวันตก แล้วเดินกลับบ้าน
        effects: { stats: { CON: 1 } }
      failure:
        text: |
          ขาขึ้น ขั้นที่เจ็ดสิบกว่า {name}ไอจนมือหลุดจากราวบันได คนงานหนุ่มที่เดินตามหลังรับไว้ทัน แล้วผลัดกันแบก{name}ขึ้นสี่สิบขั้นที่เหลือ เปลี่ยนคนแบกทุกสิบขั้น

          {name}นอนไออยู่บนลานหินปากเหมืองจนหายใจปกติ เสมหะคราวนี้มีเลือดปน
        effects: { hp: -2 }
    - id: teach_the_beams
      label: ขึ้นมาสอนเด็กใหม่ฟังเสียงคานที่ลานปากเหมือง
      requires: { flag: held_the_beam }
      text: |
        คานที่{name}เคยเอาหลังรับไว้ไม่ให้ทับเวสซันยังวางอยู่ข้างโรงเก็บเครื่องมือ บริษัทเอาออกมาเปลี่ยนตั้งแต่ปีนั้นแล้วไม่ได้ทิ้ง {name}ขอบริษัทให้ตั้งคานนั้นขึ้นบนลานปากเหมือง ค้ำด้วยเสาสองต้นเหมือนในอุโมงค์ แล้วสอนเด็กใหม่ทุกคนก่อนลงเหมืองวันแรก เคาะ ฟัง เคาะซ้ำ

        บริษัทจ่ายค่าสอนครึ่งค่าแรง ไม่ต้องลงบันไดอีก คนงานรุ่นใหม่เรียกคานบนลานว่าคานครู ไม่มีใครสั่ง แต่ทุกเช้าก่อนลงเหมือง ทุกคนเคาะคานครูคนละหนึ่งครั้ง
      effects: { gold: 3, flags: [still_working, teaches_the_beams] }
    - id: come_up_for_good
      label: ขึ้นจากเหมืองวันนี้ แล้วไม่ลงอีก
      text: |
        {name}ขึ้นบันไดร้อยสิบสองขั้นเป็นครั้งสุดท้ายตอนเลิกกะ เหมือนทุกวัน ไม่บอกใคร วางหมวกบนหิ้งในโรงเก็บเครื่องมือ ส่งพลั่วคืนคนเฝ้าโรง แล้วเดินออกไปนั่งบนลานหินปากเหมือง

        บริษัทจ่ายค่าแรงเดือนสุดท้ายสองเหรียญ ไม่มีเงินก้อน คนงานในชุดรู้กันเองในวันต่อมาเมื่อ{name}ไม่มายืนรอที่หัวบันได บางคนเดินมาถามเรื่องคานที่บ้าน
      effects: { gold: 2, flags: [retired, came_up_for_good] }
    - id: stay_below
      label: ลงต่อ จนกว่าปอดจะไม่ยอม
      text: |
        {name}ลงเหมืองต่อทุกวัน รับค่าแรงสองในสามโดยไม่เถียง ทำงานที่คนหนุ่มไม่อยากทำ ตรวจคาน เติมน้ำมันตะเกียง นั่งเฝ้ารางตอนรถถ่านวิ่ง ขาขึ้นหยุดพักสี่ครั้ง แล้วห้าครั้ง

        หน้าหนาวนั้นไอจนนอนราบไม่ได้ ต้องนอนพิงกระสอบทั้งคืน แต่เช้ามา{name}ก็ไปยืนรออยู่ที่หัวบันไดก่อนระฆังเข้ากะ
      effects: { hp: -2, gold: 4, flags: [still_working, stays_below] }
