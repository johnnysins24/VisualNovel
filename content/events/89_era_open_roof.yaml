# ยุคดาวเร่ง ชุด B ไฟล์ 2: หลังคาเปิด (9 เรื่อง ปี 349 ถึง 362) ยืนรอบหมุดปี 349 ปีที่หอฟังเปิด
# ช่วงวัย: ทุกวัย 4 (คำตอบที่ถูกเกินไป คู่ครองไปลานฟัง รถน้ำมัน บ้านข้างๆ ราคาตก) · วัยทำงาน 3 (โรงกลั่นวางมือ คนตรวจปล่อง ชานนับ) · วัยชรา 2 (ลูกถือบัตร คนที่ไม่ได้ข่าว)
# เรื่องที่ต้องมีคนในบ้าน: partner_goes_listening (has_partner) · white_gloves_child (kid) สองในเก้า
# ดันรอยดาว 3 ทาง (ทั้งชุด B มีแค่นี้): answer_came_true/ask_the_second_question · white_gloves_child/send_a_question · question_for_the_lost/ask ทุกทางปิดด้วย not_traits: [curse_brand]
# เรื่องที่อ่าน flag ของหมุด: answer_came_true (asked_the_open_roof) เรื่องเดียวในไฟล์
# คนที่มีแต่ในข้อความ: คนรับฝากคำถาม (คนเดิมจากหมุด 349) · ช่างถังไม้กับครอบครัวมีเขา · เบลนดา คนนำวางมือที่โรงกลั่น แขนพันผ้า
#   เรมิค คนคุมงาน ลูกพี่ลูกน้องของเบลนดา · ช่างสกัดหินแก่ที่ฟังปล่อง · หญิงค้าผ้าจากนอกป่า · ยายพอลดา ตาบาสทิน เดสซี เพื่อนม้านั่งหน้าร้านเกลือ
# ของที่คิดขึ้นในไฟล์นี้: จุกหูตะกั่ว (ข้อเรียกร้องของคนโรงกลั่น) · กะห้องกลั่นชั้นในสำหรับคนที่ไม่ต้องอุดหู · คนตรวจไม้หัวทองเหลืองของสภาตระกูลกับค่าปรับที่สลักข้างประตู

# ---------- ทุกวัย ----------
- id: adult.era_roof_answer_came_true
  stage: adult
  weight: 100
  when:
    age: [16, 130]
    year: [350, 360]
    flags: [asked_the_open_roof]
  text: |
    กระดาษคำตอบแผ่นนั้นพับเก็บอยู่ในกล่องเข็มมาหลายฤดู {name}ไม่ได้ตั้งใจจะเปิดอีก แต่ทุกครั้งที่มีเรื่องให้ตัดสินใจ มือก็ไปเปิดกล่องเข็มเอง แล้วบรรทัดครึ่งที่ลายมือเอนซ้ายนั้นก็อ่านได้ว่าพูดถึงเรื่องตรงหน้าพอดี

    หน้าฝนก่อน{name}ขายแพะตามที่อ่าน ได้ราคาดีที่สุดในรอบหลายปี คนซื้อเสียลูกแพะไปทั้งคอกในสัปดาห์เดียวกัน ตอนต้องเดินทางไกล {name}อ่านอีก แล้วไปทางอ้อม เกวียนที่ออกจากถิ่นทางเดิมเช้าวันเดียวกันเพลาหักกลางลำธาร เรื่องรั้วกับบ้านติดกันก็จบตามที่อ่าน บ้านนั้นเสียแปลงผักไปครึ่งแปลง ไม่มีครั้งไหนที่{name}ลงมือทำอะไรใครเลย

    เช้านี้คนรับฝากคนเดิมแวะมาถึงหน้าบ้าน ตอนนี้เขาสวมถุงมือหนังสีขาวแล้ว เขาบอกว่าหอฟังให้คนที่เคยได้คำตอบถามได้อีกข้อหนึ่ง ไม่คิดเงิน ไม่ต้องเข้าแถว เขาจะรอคำถามถึงวันอัสเทล
  choices:
    - id: ask_the_second_question
      label: เขียนคำถามข้อที่สองฝากไป (ของแบบนี้ติดตัวไปนาน)
      habit: curious
      requires: { not_traits: [curse_brand] }
      text: |
        {name}ใช้เวลาสามคืนเลือกคำถาม คำตอบกลับมาในวันอัสเทลถัดไป สั้นกว่าครั้งแรก ครึ่งบรรทัด ถูกอีก กระดาษแผ่นที่สองลงไปนอนในกล่องเข็มข้างแผ่นแรก

        คืนนั้นหลังใบหูคันจนตื่น คันลึกกว่าคราวก่อน เช้าขึ้นมา{name}คิดราคาแพะที่ขายไปเทียบกับราคาลูกแพะที่คนซื้อเสียไป ได้ตัวเลขก่อนจะทันตั้งใจคิด แล้วตัวเลขนั้นก็ไม่ยอมออกไปจากหัวทั้งวัน
      effects: { marks: { star: 1 }, world: { star: 1 }, flags: [asked_a_second_question_free] }
    - id: burn_it_at_the_temple
      label: เอากระดาษแผ่นแรกไปให้นักบวชเผา
      text: |
        นักบวชไม่ถามว่าในกระดาษเขียนอะไร เขาถือมุมกระดาษจ่อเปลวตะเกียงหน้าแท่น หมึกน้ำเงินไหม้เป็นไฟสีเขียวอยู่ครู่หนึ่ง กลิ่นเหมือนผมไหม้ เขาให้{name}ล้างมือในอ่างหน้าประตูก่อนกลับ ล้างสองครั้ง

        ฤดูนั้นเรื่องที่ต้องตัดสินใจ{name}ตัดสินเอง ผิดบ้างถูกบ้าง ขายไก่ได้ราคาต่ำกว่าเพื่อนบ้าน คนซื้อไก่ยังกลับมาซื้อซ้ำ
      effects: { world: { gods: 1 }, stats: { WIS: 1 }, flags: [burned_the_first_answer] }
    - id: sell_the_answer
      label: ขายกระดาษแผ่นนั้นให้หญิงม่ายที่มาขอซื้อมาหลายหน
      text: |
        หญิงม่ายบ้านหลังตลาดได้ยินมาว่ากระดาษของ{name}ไม่เคยผิด นางจ่ายสี่เหรียญ นับใส่มือทีละเหรียญ แล้วพับกระดาษใส่อกเสื้อ ไม่กี่วันต่อมา{name}นึกไม่ออกว่าคำถามข้อแรกถามว่าอะไร นึกได้แต่ว่าตอนเขียนมือสั่น

        นางถือกระดาษแผ่นนั้นไปตลาดทุกเช้า อ่านก่อนซื้อทุกอย่าง ปลายปีนางซื้อแพะทั้งฝูงของคนที่เสียลูกแพะไปทั้งคอก ได้ราคาถูกที่สุดที่ตลาดเคยเห็น
      effects: { gold: 4, alignment: { moral: -1 }, flags: [sold_the_first_answer] }

- id: adult.era_roof_partner_goes_listening
  stage: adult
  weight: 24
  time: night
  when:
    age: [16, 130]
    year: [350, 362]
    flags: [has_partner]
    not_location_tag: ashland
  text: |
    ทุกคืนวันอัสเทล{partner}ออกจากบ้านหลังมื้อเย็น ไปนั่งที่ลานฟัง กลับมาตอนดึก เสื้อชื้นน้ำค้าง {p:เขา|เธอ}ไม่เคยเล่าว่าที่นั่นมีอะไร แต่ตั้งแต่เริ่มไป ของในบ้านไม่เคยหายอีก กุญแจ กรรไกร เข็มที่ตกร่องพื้น {partner}เดินไปหยิบได้ทุกครั้งโดยไม่ต้องหา

    เช้าวันหนึ่ง{partner}บอกว่ากระดุมเสื้อที่{name}ทำหายเมื่อหลายหน้าหนาวก่อนอยู่ใต้ตู้ถ้วยชาม ขยับตู้ดู อยู่ตรงนั้นจริง ฝุ่นจับหนา

    คืนนี้เป็นคืนวันอัสเทลอีกคืน {partner}ยืนผูกเชือกรองเท้าอยู่ที่ประตู ถามโดยไม่เงยหน้าว่าจะไปด้วยกันไหม
  choices:
    - id: go_along_once
      label: ไปด้วยครั้งหนึ่ง
      habit: curious
      requires: { not_traits: [curse_brand] }
      text: |
        ลานฟังเป็นลานนวดข้าวเก่า ม้านั่งตั้งเป็นวงซ้อนกัน คนนั่งเงยหน้า ไม่มีใครคุยกัน คนถือบัตรสวมถุงมือขาวยืนอยู่ที่ขอบลาน คอยเติมน้ำชาให้คนวงนอก {name}นั่งข้าง{partner} เงยหน้าตามคนอื่น ได้ยินเสียงต่ำๆ แบบเดียวกับที่ได้ยินอยู่ทุกคืน ที่นี่ชัดกว่าหน่อย ไม่มีอะไรมากกว่านั้น นั่งจนเท้าชา

        หน้า{partner}ตอนเงยขึ้นฟ้าเรียบเหมือนคนหลับ ขากลับ{p:เขา|เธอ}จับมือ{name}เดิน เลี้ยวถูกทุกโค้งในความมืดโดยไม่มีตะเกียง
      effects: { world: { star: 1 }, flags: [went_listening_with_partner] }
    - id: forbid_it
      label: บอก{partner}ว่าไม่อยากให้ไปอีก
      habit: stubborn
      text: |
        {partner}ฟังจนจบ แก้เชือกรองเท้าออก วางรองเท้าเข้าที่ แล้วไปนั่งที่ข้างหน้าต่าง หันหน้าออกไปทางลาน คืนวันอัสเทลหลังจากนั้น{p:เขา|เธอ}อยู่บ้านทุกคืน

        เดือนต่อมากุญแจบ้านหายเป็นครั้งแรกในรอบหลายเดือน {partner}ช่วยหาจนเจอในกระเป๋าเสื้อตัวที่{name}ใส่อยู่ หาช้ากว่าที่{name}หาเองเสียอีก
      effects: { alignment: { law: 1 }, people: [{ id: partner, closeness: -1 }], flags: [forbade_the_listening_yard] }
    - id: wait_up
      label: ไม่ไป ไม่ห้าม ต้มน้ำรอข้างเตาจนกว่า{p:เขา|เธอ}จะกลับ
      habit: cool_headed
      text: |
        {name}นั่งรอข้างเตาทุกคืนวันอัสเทล น้ำในกาเดือดสองรอบก่อนประตูจะเปิด {partner}กลับมามือเย็น {name}ยื่นถ้วยให้ {p:เขา|เธอ}จับถ้วยด้วยสองมือจนมืออุ่น

        {p:เขา|เธอ}ไม่เคยเล่าว่าคืนนั้นได้ยินอะไร แต่เล่าทุกอย่างที่เห็นระหว่างทาง ไก่บ้านไหนหลุดออกมานอนนอกเล้า ใครเดินกลับบ้านผิดเวลา ไม่นานคืนวันอัสเทลก็เป็นคืนที่สองคนคุยกันนานที่สุดในสัปดาห์
      effects: { people: [{ id: partner, closeness: 1 }], flags: [waited_up_on_astel_nights] }
    - id: sit_beside_unheard
      label: ไปนั่งข้าง{partner}ที่ลานฟัง
      requires: { trait: curse_brand }
      text: |
        {name}นั่งลงได้ไม่นาน คนวงเดียวกันก็ขยับห่างออกไปทีละคน ม้านั่งข้าง{name}ว่างไปสองช่วงตัวทั้งสองข้าง คนถือบัตรเดินมาย่อตัวลงข้างๆ ถามอย่างสุภาพว่าคืนนี้ไปนั่งวงนอกสุดได้ไหม ตรงนั้นลมโกรกน้อยกว่า

        {partner}นั่งจนลานเลิก ขากลับเดินช้า กุญแจที่หายในสัปดาห์นั้นหาไม่เจอจนสิ้นเดือน คืนวันอัสเทลต่อมา{partner}ออกจากบ้านคนเดียว ปิดประตูเบามือกว่าเคย
      effects: { stats: { WIS: 1 }, flags: [sat_in_the_listening_yard_branded] }

- id: adult.era_roof_oil_cart_night
  stage: adult
  weight: 24
  when:
    age: [16, 130]
    year: [350, 362]
    location_tag: [arvel_village, ventras, kardin]
  text: |
    เกวียนน้ำมันจอดอยู่ท้ายซอยทั้งคืน ล้อหนุนด้วยก้อนหิน ถังไม้โอ๊กสองแถวคลุมผ้าใบ ล่อยืนหลับ ไม่เห็นคนขับ เช้าขึ้นมาเกวียนไปแล้ว เหลือรอยล้อกับน้ำมันหยดเป็นจุดๆ หน้าบ้านสามหลังท้ายซอย

    บ้านสามหลังนั้นตื่นสาย แล้วออกมาเล่าให้ใครก็ได้ฟังว่าเพิ่งหายไข้ ไข้แบบที่หลับยาว คนทั้งสามบ้านจำสัปดาห์ที่แล้วไม่ได้ และไม่เดือดร้อนสักนิด หญิงบ้านกลางถามคนขายผักว่าวันนี้วันอะไร ได้ยินคำตอบแล้วหัวเราะจนต้องพิงรั้ว

    ทั้งซอยจำได้ว่าสัปดาห์ที่แล้วบ้านสามหลังนั้นมีแขกทุกคืน คนแปลกหน้าเสื้อผ้าดี มาหลังมืด กลับก่อนสว่าง ใครๆ เรียกเกวียนแบบนั้นว่ารถน้ำมัน และไม่มีใครถามว่าของใคร
  choices:
    - id: ask_around
      label: เดินถามว่าสัปดาห์ที่แล้วใครมาบ้านสามหลังนั้น
      habit: curious
      text: |
        คนในซอยตอบเหมือนกันหมด ไม่รู้ ไม่ได้สังเกต คนขายผักที่เล่าให้{name}ฟังเองเมื่อวาน วันนี้ตอบว่าจำไม่ได้แล้ว ที่วิหาร นักบวชตะเกียงฟัง{name}ถามจนจบ แล้วเขียนชื่อ{name}ลงสมุด บอกว่าจะสวดให้เรื่องที่ค้างใจหายไป

        สัปดาห์ถัดมาเกวียนน้ำมันเข้าซอยอีกตอนกลางวัน เติมน้ำมันตะเกียงหน้าวิหารตามรอบเดือน ตอนผ่านหน้าบ้าน{name} คนขับดึงล่อให้เดินช้าลง
      effects: { stats: { WIS: 1 }, reputation: { lamp_church: -1 }, flags: [asked_about_the_oil_cart] }
    - id: say_nothing
      label: ไม่ถาม ไม่เล่า ทักบ้านสามหลังนั้นเหมือนทุกวัน
      habit: faint_heart
      text: |
        {name}ทักหญิงบ้านกลางว่าหายไข้แล้วหรือ นางว่าหายแล้ว หายสนิท บ่ายนั้นนางเอาขนมไปแจกทุกบ้านในซอยเป็นค่าที่ทำให้เป็นห่วง บ้าน{name}ได้สองชิ้น นางว่าเพราะ{name}ไม่ถามให้นางปวดหัว

        ขนมสองชิ้นนั้นอร่อย ห่อมาด้วยกระดาษหนาสีน้ำเงิน มุมกระดาษมีดาวเจ็ดแฉกดวงเล็ก
      effects: { alignment: { law: 1 }, flags: [kept_quiet_about_the_oil_cart] }
    - id: write_the_week_down
      label: นั่งจดทุกอย่างที่ตัวเองเห็นในสัปดาห์นั้น ก่อนจะลืมไปอีกคน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}จดได้สองหน้าเต็ม ทุกคืนของสัปดาห์นั้น แขกมากี่คน มาทางไหน ใครถือตะเกียงเดินนำ ใครเดินกะเผลก กระดาษสองแผ่นพับเก็บไว้ในปกหนังสือสวด

          ฤดูต่อมาคนเดินกะเผลกคนนั้นผ่านมาในตลาด สวมถุงมือขาว {name}จำเขาได้ เขาจำ{name}ไม่ได้
        effects: { stats: { INT: 1 }, flags: [wrote_down_the_forgotten_week] }
      failure:
        text: |
          {name}จดได้ครึ่งหน้าแล้วต้องหยุด คืนที่สี่ของสัปดาห์นั้นว่างไปทั้งคืน นั่งนึกจนเที่ยงก็ไม่ได้อะไรกลับมา

          บรรทัดล่างสุดของหน้ามีประโยคหนึ่งที่{name}จำไม่ได้ว่าเขียน ลายมือของ{name}เอง เขียนว่าอย่าจด
        effects: { flags: [wrote_down_the_forgotten_week] }
    - id: remind_the_debtor
      label: ไปทวงเงินที่บ้านกลางยืมไปเมื่อสัปดาห์ก่อน บวกเพิ่มอีกนิด
      text: |
        หญิงบ้านกลางฟังจำนวนแล้วหัวเราะ บอกว่าสัปดาห์ที่แล้วนางคงใจใหญ่ จ่ายครบ ไม่ต่อสักเหรียญ

        เย็นนั้นนางเอาแกงมาให้ถ้วยหนึ่ง ขอบใจที่{name}ให้ยืมเงินตอนนางป่วย
      effects: { gold: 2, alignment: { moral: -1 }, flags: [billed_the_forgetful_neighbour] }

- id: adult.era_roof_bought_out
  stage: adult
  weight: 24
  when:
    age: [16, 130]
    year: [349, 360]
    location_tag: [arvel_village, ventras, kardin]
  text: |
    คนสวมถุงมือขาวสามคนเดินวัดลานนวดข้าวเก่าที่ถนนถัดไปอยู่สองวัน ขึงเชือกกับหมุดไม้ ไม่มีใครถามว่าวัดไปทำอะไร ทุกคนรู้ ลานฟังกำลังจะมา ม้านั่งเป็นวงจะตั้งตรงที่เคยตากข้าว

    วันที่สามพวกเขาเริ่มไปตามบ้าน ไม่ใช่ทุกบ้าน เฉพาะบ้านที่มีคนมีเขา บ้านช่างถังไม้ข้างบ้าน{name}มีเมียกับลูกสองคนที่มีเขาสองข้าง ช่างถังได้ราคาบ้านเกินที่ใครในถนนเคยขายได้ เงินสด ขอให้ย้ายก่อนสิ้นเดือน คนสวมถุงมือขาวพูดสุภาพจนช่างถังไม่รู้จะโกรธตรงไหน

    ตกเย็นช่างถังมานั่งที่ครัวบ้าน{name} ถือถุงเงินไว้บนตัก เขาบอกว่าราคานี้ซื้อบ้านที่อื่นได้ใหญ่กว่าเดิม บ้านหลังเก่าก็ยังขายต่อได้อีก แล้วถามว่าทำไมมือเขาสั่น
  choices:
    - id: help_bargain
      label: ไปต่อรองกับคนสวมถุงมือขาวแทนช่างถัง
      habit: sweet_tongue
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ขอเวลาเพิ่มถึงหลังเก็บเกี่ยว กับค่าขนย้ายอีกถุงหนึ่ง คนสวมถุงมือขาวตอบตกลงทุกข้อ ไม่ต่อสักคำ ยิ่งตกลงง่าย{name}ยิ่งรู้ว่าขอน้อยไป

          ช่างถังย้ายออกหลังเก็บเกี่ยว ทิ้งถังไม้ใบหนึ่งไว้หน้าบ้าน{name} ถังที่ดีที่สุดที่เขาเคยทำ ขอบไม่มีรอยต่อให้เห็นสักรอย
        effects: { stats: { CHA: 1 }, reputation: { star_listeners: -1 }, flags: [bargained_for_the_cooper], city: { merit: 1, here: true } }
      failure:
        text: |
          {name}พูดยาว คนสวมถุงมือขาวฟังจนจบ ขอบคุณที่{name}เป็นห่วงเพื่อนบ้าน ไม่ขยับราคาสักเหรียญ ไม่ขยับวันสักวัน ก่อนกลับเขาถามชื่อ{name} จดลงสมุด

          สิ้นเดือนช่างถังขนของขึ้นเกวียน ลูกคนเล็กนั่งบนกองฟูก หันหลังให้ทางที่เกวียนไป โบกมือให้บ้าน{name}จนเลี้ยวพ้นหัวถนน
        effects: { flags: [bargained_for_the_cooper] }
    - id: buy_the_coopers_house
      label: ซื้อบ้านช่างถังต่อ ราคาที่วันนี้ไม่มีใครแข่ง
      requires: { not_traits: [curse_brand], min_gold: 4 }
      text: |
        ช่างถังขายให้ครึ่งราคาที่เคยตั้ง ดีใจที่ได้ขายให้คนรู้จัก {name}ปล่อยเช่า คนเช่ารายแรกมาตั้งแต่ลานฟังยังตั้งม้านั่งไม่ครบวง สองคน ถุงมือขาว จ่ายค่าเช่าล่วงหน้าทั้งปี

        ค่าเช่าเข้าตรงวันทุกเดือน บ้านหลังนั้นไม่เคยจุดตะเกียงตอนกลางคืน
      effects: { gold: -2, world: { star: 1 }, flags: [bought_the_coopers_house_cheap] }
    - id: pack_the_dishes
      label: ไปนั่งห่อถ้วยชามให้บ้านช่างถัง
      habit: soft_heart
      text: |
        {name}นั่งห่อถ้วยชามด้วยฟางทีละใบอยู่ในครัวบ้านช่างถังทั้งบ่าย เมียช่างถังเล่าเรื่องรอยบิ่นทุกใบ ใบนี้ลูกคนโตทำตกวันฝนแรก ใบนี้แม่ผัวขว้างใส่ผัวตอนแต่งงานใหม่ เล่าไปหัวเราะไป

        ใบสุดท้ายนางไม่ห่อ ยื่นให้{name} ถ้วยดินเผาขอบบิ่นสองที่ บอกว่าใบนี้เรื่องยาวเกินจะขนไปเล่าที่บ้านใหม่
      effects: { alignment: { moral: 1 }, flags: [packed_the_coopers_dishes] }
    - id: take_the_moving_money
      label: รับเงินย้ายบ้านที่คนสวมถุงมือขาวมาเสนอให้{name}ด้วย
      requires: { trait: curse_brand }
      text: |
        เช้าวันต่อมาคนสวมถุงมือขาวมายืนที่ประตูบ้าน{name} เขาพูดกับ{name}เหมือนที่พูดกับช่างถัง ราคาเท่ากัน ความสุภาพเท่ากัน {name}รับถุงเงิน ย้ายออกก่อนช่างถังสามวัน ได้ห้องเช่าใกล้ตลาด กว้างกว่าเดิม

        คืนแรกในห้องใหม่ เพื่อนบ้านใหม่มาทักที่ประตู ถามว่าย้ายมาจากถนนไหน ได้ยินชื่อถนนแล้วเขาก็ไม่ถามต่อ
      effects: { gold: 5, flags: [took_the_listeners_moving_money] }
    - id: stay_put
      label: ไม่รับเงิน อยู่บ้านเดิม
      habit: stubborn
      requires: { trait: curse_brand }
      text: |
        คนสวมถุงมือขาวรับคำปฏิเสธด้วยรอยยิ้มเท่าเดิม สามวันต่อมามีดาวเจ็ดแฉกวาดด้วยชอล์กบนประตูบ้าน{name} สูงแค่เข่า {name}เช็ดออก วันต่อมามีอีกดวง ตรงที่เดิม เส้นเท่าเดิม

        ลานฟังเปิดในเดือนนั้น คนที่เดินไปลานตอนหัวค่ำข้ามไปเดินอีกฝั่งถนนตอนผ่านหน้าบ้าน{name} ส่วนมากไม่รู้ว่าเลี่ยงอะไร เดินเลี่ยงตามคนข้างหน้า
      effects: { stats: { CON: 1 }, flags: [stayed_under_the_chalk_star] }

# ---------- วัยทำงาน ----------
- id: adult.era_roof_refinery_strike
  stage: adult
  weight: 24
  scene: refinery
  when:
    age: [16, 59]
    year: [350, 362]
    location_tag: [ventras, kardin]
  text: |
    คนโรงกลั่นวางมือมาสี่วันแล้ว ข้อเรียกร้องมีข้อเดียว ทาสีขาวบนแผ่นไม้ปักไว้หน้าประตู จุกหูตะกั่ว คนละคู่ ห้องกลั่นหึ่งดังจนคนกะดึกเลือดกำเดาไหลแทบทุกคืน สมาคมจ่ายค่าเรือนไม่มีหลังคาได้ทั้งหลัง แต่บอกว่าตะกั่วแพง

    คนนำชื่อเบลนดา แขนซ้ายพันผ้าตั้งแต่ข้อมือถึงศอก ใครในย่านก็รู้ว่าใต้ผ้าเป็นอะไร นางยืนหน้าประตูตั้งแต่ก่อนกะเช้า คนคุมงานที่ยืนอยู่หลังประตูเหล็กชื่อเรมิค ลูกพี่ลูกน้องของนาง สองคนนี้กินข้าววันเกิดยายโต๊ะเดียวกันมาทั้งชีวิต ตอนนี้คุยกันผ่านซี่ประตู

    เช้านี้สมาคมให้คนมาประกาศ จ่ายค่าแรงสองเท่าให้ทุกคนที่เข้ากะ เคยทำโรงกลั่นหรือไม่เคยก็ได้ เรมิคถือใบประกาศมายืนที่ประตู ยื่นผ่านซี่เหล็กออกมาให้{name}
  choices:
    - id: stand_with_them
      label: ไปยืนแถวหน้าประตูกับเบลนดา
      habit: stubborn
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ยืนตั้งแต่ก่อนสว่างจนค่ำ ทั้งสัปดาห์ ฝนตกสองวัน ไม่มีใครถอย วันที่หก สมาคมส่งเกวียนมาหน้าประตู ลังไม้ใบเล็กสี่ใบ จุกหูตะกั่วห่อกระดาษน้ำมันคู่ละห่อ เรมิคเปิดประตูเอง แจกเองทีละคน แจกเบลนดาเป็นคนสุดท้าย

          คืนนั้นกะดึกไม่มีใครเลือดกำเดาไหล จุกหูหนักจนคนทั้งกะเดินเอียงคอ
        effects: { stats: { CON: 1 }, reputation: { distillers: -1 }, flags: [stood_with_the_refinery_strike] }
      failure:
        text: |
          วันที่สามคนของสมาคมพาคนแปลกหน้ามาเข้ากะ ดันผ่านแถว {name}โดนศอกเข้าซี่โครง ล้มลงบนกรวด ลุกขึ้นมายืนต่อได้ แต่หายใจลึกไม่ได้ไปทั้งสัปดาห์

          การวางมือจบวันที่เก้า ไม่มีใครได้จุกหูจากสมาคม เบลนดาลอกแผ่นตะกั่วจากหลังคาโรงพัสดุลงมาทุบแบน ม้วนแจกกันเองคนละคู่
        effects: { hp: -2, reputation: { distillers: -1 }, flags: [stood_with_the_refinery_strike] }
    - id: cross_the_line
      label: รับค่าแรงสองเท่า เข้ากะ
      requires: { not_traits: [curse_brand] }
      text: |
        เรมิคเปิดประตูแง้มพอให้ตัวลอด เบลนดาไม่ตะโกน นางเรียกชื่อ{name}ครั้งเดียว ในห้องกลั่นเสียงหึ่งดังจนฟันสั่น คนแปลกหน้าที่เข้ากะด้วยกันเอาขี้ผึ้งอุดหู ไม่ช่วยอะไร ตกค่ำได้เงินสองเท่าจริง

        ขากลับ{name}ต้องเดินผ่านแถวหน้าประตู ไม่มีใครด่า เบลนดายื่นผ้าชุบน้ำให้เช็ดเลือดกำเดาที่ไหลลงถึงคาง
      effects: { gold: 3, reputation: { distillers: 1 }, flags: [crossed_the_refinery_line] }
    - id: carry_soup_to_both
      label: ต้มซุปหม้อใหญ่ แบ่งให้คนหน้าประตูครึ่ง หลังประตูครึ่ง
      habit: soft_heart
      text: |
        {name}หิ้วหม้อซุปไปตั้งหน้าประตูทุกเที่ยง ตักให้คนในแถว แล้วยื่นถ้วยผ่านซี่เหล็กให้คนข้างใน เรมิคได้ถ้วยแรกข้างใน เบลนดาได้ถ้วยแรกข้างนอก ไม่มีใครในสองฝั่งปฏิเสธซุป

        วันที่เจ็ด สองลูกพี่ลูกน้องยืนกินซุปคนละฝั่งประตู เถียงกันว่าซุปหม้อนี้ใส่ขิงมากกว่าของยายหรือน้อยกว่า ไม่มีใครเอ่ยถึงตะกั่วสักคำ
      effects: { gold: -1, alignment: { moral: 1 }, stats: { CHA: 1 }, flags: [carried_soup_to_both_sides], city: { merit: 1, here: true } }
    - id: take_the_quiet_shift
      label: รับกะที่เรมิคบอกว่ามีไว้สำหรับคนที่ไม่ต้องอุดหู
      requires: { trait: curse_brand }
      text: |
        เรมิคไม่ได้ประกาศกะนี้ เขามากระซิบที่ข้างกำแพง กะห้องกลั่นชั้นใน ค่าแรงสองเท่าครึ่ง ไม่ต้องใช้ตะกั่ว ไม่ต้องใช้ขี้ผึ้ง ห้องนั้นสำหรับ{name}เงียบเหมือนห้องเก็บของ ในห้องมีคนแบบเดียวกันอีกสองคน กลั่นได้เท่ากะเต็มของคนสิบคน

        สัปดาห์ถัดมาชื่อ{name}ขึ้นกำแพงหน้าโรงกลั่น เขียนด้วยถ่าน ตัวโต ข้างชื่อคนอีกสองคนที่เข้าห้องเดียวกัน
      effects: { gold: 4, reputation: { distillers: 1 }, flags: [took_the_shift_for_those_who_need_no_lead] }

- id: adult.era_roof_roof_inspectors
  stage: adult
  weight: 24
  when:
    age: [16, 59]
    year: [349, 362]
    location_tag: hordun
  text: |
    สภาตระกูลสลักคำสั่งลงแผ่นหินหน้าโถงใหญ่ ห้ามเปิดหลังคา ห้ามเปิดช่องควันกว้างเกินขนาดที่ช่างตระกูลกำหนด ห้ามนั่งใต้ช่องแสงหลังมืด ไม่มีคำอธิบาย สภาตระกูลไม่เคยสลักคำอธิบายลงหิน

    คนตรวจมาเป็นคู่ ถือไม้ยาวหัวทองเหลือง เคาะทุกช่องควันทุกช่องแสงของชั้น เคาะแล้วเอียงหูฟัง ช่องไหนฝาหลวมหรือมีรอยงัด คนตรวจสลักเลขค่าปรับลงข้างประตูบ้านนั้นด้วยสิ่วเล็ก

    ช่างสกัดหินแก่บ้านติดกับ{name}นั่งอยู่ใต้ปล่องควันของตัวเองทุกคืน ประตูแง้ม เมื่อคืน{name}เห็นเขาเงยหน้าตรงเข้าไปในปล่อง ตาลืม ปากขยับ เช้านี้เขาออกไปตลาด ประตูไม่ได้ลงกลอน พื้นใต้ปล่องมีวงน้ำค้างกลมเท่าถาด เย็นเฉียบ คนตรวจเคาะถึงบ้านหัวชั้นแล้ว
  choices:
    - id: wipe_and_wedge
      label: เข้าไปเช็ดวงน้ำค้าง อัดลิ่มฝาปล่องให้แน่นก่อนคนตรวจถึง
      habit: craft_hands
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}เช็ดพื้นด้วยแขนเสื้อ น้ำค้างเย็นจนแขนชาถึงข้อศอก ตอกลิ่มไม้สองตัวเข้าขอบฝา ออกจากบ้านนั้นตอนคนตรวจเคาะบ้านถัดไปพอดี คนตรวจเคาะปล่องบ้านช่างสกัดหินสามที เสียงทึบ ผ่าน

          ตกค่ำช่างสกัดหินกลับมาเห็นลิ่มไม้ในฝาปล่อง เขาเอาหินลับมีดก้อนที่ดีที่สุดในร้านมาวางไว้บนธรณีบ้าน{name} ลิ่มสองตัวนั้นเขาไม่เคยถอด
        effects: { stats: { DEX: 1 }, flags: [hid_the_neighbours_flue], city: { merit: 1, here: true } }
      failure:
        text: |
          ลิ่มตัวที่สองเข้าไม่สุด คนตรวจเดินเข้ามาเจอ{name}ยืนอยู่ในบ้านที่ไม่ใช่ของตัวเอง แขนเสื้อเปียก ไม้หัวทองเหลืองเคาะฝาปล่องทีเดียว ลิ่มกระเด็น

          เขาสลักเลขค่าปรับข้างประตูบ้านช่างสกัดหิน แล้วเดินไปสลักอีกเลขข้างประตูบ้าน{name} เลขเล็กกว่า ลึกเท่ากัน
        effects: { gold: -1, flags: [hid_the_neighbours_flue] }
    - id: tell_the_inspectors
      label: บอกคนตรวจเรื่องปล่องบ้านติดกัน
      text: |
        คนตรวจเปิดฝาปล่องบ้านช่างสกัดหิน ขอบหินด้านในขัดมันเหมือนมีคนลูบทุกคืน เขาสลักค่าปรับ แล้วปิดผนึกปล่องด้วยปูน ช่างสกัดหินกลับจากตลาดตอนปูนยังไม่แห้ง

        ตั้งแต่นั้นเขาก่อไฟในบ้านไม่ได้ ต้องไปหุงข้าวที่เตารวมของชั้น ทุกเย็นเขาเดินผ่านหน้าบ้าน{name}พร้อมหม้อข้าว เดินช้าลงหน่อยตรงหน้าประตู
      effects: { reputation: { dwarf_council: 1 }, alignment: { law: 1 }, flags: [reported_the_listening_flue] }
    - id: warn_him
      label: ไปดักช่างสกัดหินที่ทางขึ้นตลาด บอกให้รู้ก่อน
      text: |
        เขาฟังแล้วไม่รีบกลับ เดินกลับช้าๆ ไปยืนรอคนตรวจที่หน้าประตูตัวเอง บอกคนตรวจว่าปล่องนี้เปิดทุกคืน เขาเปิดเอง แล้วขอจ่ายค่าปรับเป็นหินลับมีดสามก้อน คนตรวจรับไว้เพราะคมกว่าเหรียญ

        คืนต่อมาประตูบ้านช่างสกัดหินปิดสนิท แสงตะเกียงลอดใต้ประตูออกมาจนเช้า
      effects: { alignment: { moral: 1 }, flags: [warned_the_flue_listener] }

- id: adult.era_roof_not_up_the_boughs
  stage: adult
  weight: 24
  scene: star_hall
  when:
    age: [16, 59]
    year: [350, 362]
    location_tag: ileth
  text: |
    คนถือบัตรมายืนรอที่โคนต้นไม้ใหญ่ทุกวันตลาด ถุงมือขาว บัตรหมึกน้ำเงินปึกหนา ยืนได้แค่โคนต้น เอลฟ์ไม่ให้คนถือบัตรขึ้นกิ่ง ไม่มีใครบอกพวกเขาว่าทำไม พวกเขาก็ไม่ถาม ยืนรออย่างสุภาพ ใครเดินผ่านก็ยื่นบัตรให้

    หญิงค้าผ้าจากนอกป่าลงจากเกวียนแล้วไม่เดินไปหาคนถือบัตร นางเดินมาหา{name}ที่ตีนบันไดเชือก วางเหรียญห้าเหรียญบนขั้นล่างสุด บอกว่าได้ยินว่าบนชานนับมีคนนับฟ้ามานานกว่าที่อาณาจักรตั้งชื่อดาวได้ นางมีคำถามข้อหนึ่ง ไม่อยากให้กล่องตอบ อยากให้คนตอบ ขอให้{name}ถือขึ้นไปให้

    ทางขึ้นชานนับกินเวลาครึ่งคืน บันไดเชือกกับกิ่งที่เดินได้ คนที่เคยขึ้นไปรู้ว่าบนชานไม่ตอบคำถามใคร ให้แค่สองจำนวน ดาวเก่า 6,248 ดวง กับส่วนที่เกิน
  choices:
    - id: climb_with_it
      label: รับเหรียญ ถือคำถามของนางขึ้นชานนับ
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ครึ่งคืน มือแตกตรงง่ามนิ้ว บนชานนับ ผู้นับรับกระดาษไปอ่านใต้โคมดวงเล็ก แล้วคืนให้ บอกสองจำนวนช้าๆ ชัดๆ ดาวเก่า 6,248 กับส่วนที่เกินของคืนนี้ แล้วเขียนสองจำนวนนั้นลงหลังกระดาษคำถาม ลายมือตั้งตรง ไม่เอนไปทางไหน

          {name}ลงมาถึงโคนต้นตอนฟ้าสาง หญิงค้าผ้าอ่านหลังกระดาษ อ่านอีกรอบ แล้วจ่ายเพิ่มอีกสามเหรียญ บอกว่าลายมือแบบนี้แหละที่นางอยากเห็น
        effects: { gold: 3, stats: { CON: 1 }, reputation: { star_hall: 1 }, flags: [carried_a_question_up_the_boughs] }
      failure:
        text: |
          ครึ่งทาง เชือกขั้นหนึ่งเปียกน้ำค้าง {name}ลื่นห้อยแขนเดียวอยู่ชั่วอึดใจ ไหล่ร้าวขึ้นไปถึงคอ ขึ้นถึงชานตอนผู้นับเลิกนับแล้ว ได้แค่สองจำนวนของเมื่อคืนที่ผู้นับจดไว้ เขียนลงหลังกระดาษด้วยมือที่สั่น

          หญิงค้าผ้าจ่ายตามที่ตกลง ไม่เพิ่ม ไม่ลด แล้วถามว่า{name}จะให้นางช่วยพันไหล่ไหม
        effects: { hp: -2, gold: 2, flags: [carried_a_question_up_the_boughs] }
    - id: take_her_to_the_box
      label: พานางไปหาคนถือบัตรที่โคนต้น
      text: |
        คนถือบัตรรับคำถามของนางด้วยมือทั้งสองข้าง บอกว่าคำตอบจะกลับมาวันอัสเทลถัดไป หญิงค้าผ้าให้{name}หนึ่งเหรียญเป็นค่าพาเดิน แล้วไปพักโรงเตี๊ยมรอ

        ตั้งแต่วันตลาดถัดไปคนถือบัตรเรียกชื่อ{name}ถูกทุกครั้ง ยื่นบัตรให้ด้วยมือทั้งสองข้าง ไม่ต้องถามชื่ออีก
      effects: { gold: 1, world: { star: 1 }, flags: [walked_the_trader_to_the_white_gloves] }
    - id: refuse
      label: บอกนางตรงๆ ว่าบนชานนับให้แค่สองจำนวน ไม่มีคำตอบ
      text: |
        นางไม่เชื่อ {name}เล่าให้ฟังว่าคนบนชานนับทำอะไรทั้งคืนทุกคืน นับ จด แล้วนับใหม่ นางฟังจบแล้วเก็บเหรียญคืนใส่ถุง ขึ้นเกวียน

        ก่อนเกวียนออก นางฉีกกระดาษคำถามเป็นชิ้นเล็กๆ โปรยลงข้างทาง ลมพัดเศษกระดาษลอยขึ้นไปติดกิ่งชั้นล่าง สูงกว่าที่คนถือบัตรเคยขึ้นไปได้
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [told_the_trader_the_deck_gives_numbers] }

# ---------- วัยชรา ----------
- id: elder.era_roof_white_gloves_child
  stage: elder
  weight: 24
  cast:
    kid: { kin: [child], min_age: 17, max_age: 45, horned: false }
  when:
    age: [60, 130]
    year: [351, 362]
  text: |
    {kid}กลับมาบ้านวันตลาด สวมถุงมือหนังสีขาวทั้งสองข้าง ถอดออกตอนกินข้าวเท่านั้น พับวางไว้ข้างจาน ปลายนิ้วชนกันพอดี เสื้อเทาตัวนี้ดีกว่าทุกตัวที่{kid:เขา|เธอ}เคยมี {kid:เขา|เธอ}เป็นคนถือบัตรแล้ว เดินแจกบัตรหมึกน้ำเงินในตลาดสามถิ่น ได้ค่าจ้างเดือนละเท่ากับที่{name}เคยหาได้ในครึ่งปี

    {kid}ใจดีขึ้น เรื่องนี้ทั้งบ้านเห็น ฟังคนอื่นพูดจนจบ ไม่เถียง ขอบคุณทุกครั้งที่มีคนส่งถ้วยน้ำให้ ล้างจานเองโดยไม่ต้องบอก ตอนที่{name}บ่นเรื่องเข่า {kid:เขา|เธอ}ถามว่าข้างไหน เป็นมาตั้งแต่เมื่อไร แล้วจดลงสมุดเล่มเล็ก

    ก่อนกลับ{kid}วางถุงเงินไว้บนโต๊ะ ถุงหนัก แล้วถามว่า{name}มีอะไรอยากรู้ไหม {kid:เขา|เธอ}ฝากถามให้ได้ ไม่ต้องเข้าแถว
  choices:
    - id: take_the_money
      label: เก็บถุงเงินไว้ ขอบใจ ไม่ถามอะไร
      text: |
        เงินในถุงพอจ่ายหนี้ร้านขนมปัง ซ่อมหลังคา แล้วยังเหลือ {kid}กลับมาทุกวันตลาด ถุงเงินหนักเท่ากันทุกถุง

        {kid:เขา|เธอ}ไม่ถามอีกว่า{name}อยากรู้อะไร ถามแต่เรื่องเข่า ข้างไหน ดีขึ้นไหม แล้วจดลงสมุดเล่มเล็กทุกครั้ง สมุดเล่มที่สองแล้ว
      effects: { gold: 3, flags: [took_the_card_bearers_money] }
    - id: ask_them_to_quit
      label: ขอให้{kid}เลิกถือบัตร
      text: |
        {kid}ฟังจนจบ ไม่เถียง บอกว่าเข้าใจ แล้วสวมถุงมือทีละข้าง ถุงเงินวางอยู่บนโต๊ะ {kid:เขา|เธอ}ไม่หยิบคืน

        วันตลาดถัดมา{kid}ไม่กลับมา วันตลาดที่สามมีบัตรหมึกน้ำเงินใบหนึ่งสอดอยู่ใต้ประตู เขียนว่า ข้างซ้าย ประคบน้ำอุ่นก่อนนอน ลายมือของ{kid}
      effects: { people: [{ id: "@kid", closeness: -1 }], flags: [asked_the_child_to_quit_the_cards] }
    - id: send_a_question
      label: ฝากคำถามของตัวเองไปกับ{kid}ข้อหนึ่ง (ของแบบนี้ติดตัวไปนาน)
      requires: { not_traits: [curse_brand] }
      text: |
        {name}เขียนคำถามด้วยมือที่สั่นกว่าที่คิด พับสองทบ ยื่นให้ {kid}ไม่อ่าน เก็บใส่กระเป๋าในเสื้อ วันตลาดถัดมาคำตอบมากับ{kid:เขา|เธอ} หมึกน้ำเงิน ลายมือเอนซ้ายทุกตัว ถูกทุกคำ {name}ยื่นให้{kid}อ่านด้วย {kid:เขา|เธอ}ส่ายหน้า บอกว่าคำตอบเป็นของคนถาม

        หลังจากนั้นทุกครั้งที่{kid}กลับบ้าน {kid:เขา|เธอ}จะจับมือ{name}ไว้นานกว่าเดิม ถามว่าคืนก่อนๆ นอนหลับดีไหม ฝันอะไร แล้วจดคำตอบลงสมุดเล่มเล็ก
      effects: { marks: { star: 1 }, world: { star: 1 }, flags: [sent_a_question_with_the_child] }
    - id: ask_what_they_call_us
      label: ถาม{kid}ว่าที่หอฟังเรียกคนแบบ{name}ว่าอะไร
      habit: curious
      requires: { trait: curse_brand }
      text: |
        {kid}ไม่ตอบทันที ล้างถ้วยในมือจนเสร็จ เช็ดแห้ง แล้วบอกว่ารูเงียบ รูเงียบบนหลังคาเมือง ในวงไม่มีใครพูดคำนี้ให้ร้าย พูดเหมือนพูดถึงหลุมบนถนนที่คนเดินทางต้องรู้ว่าอยู่ตรงไหน

        ตอนจะกลับ{kid}กอด{name}นานกว่าทุกครั้ง แล้วออกไปยืนนอกประตู สวมถุงมือทีละข้าง ช้าๆ
      effects: { stats: { WIS: 1 }, flags: [asked_the_child_what_the_circle_calls_us] }

- id: elder.era_roof_question_for_the_lost
  stage: elder
  weight: 24
  when:
    age: [60, 130]
    year: [350, 362]
  text: |
    ม้านั่งหน้าร้านขายเกลือมีคนนั่งประจำสี่คน ยายพอลดา ตาบาสทิน เดสซี กับ{name} ทั้งสี่คนพูดเรื่องเดียวกันมาสามวันแล้ว ตาบาสทินฝากคำถามไปกับคนถือบัตรเรื่องลูกชายที่ไปทะเล ได้คำตอบว่ายังอยู่ ชื่อเรือ ท่าที่จอด ถูกหมด เดสซีถามว่าใครขโมยไก่ของนาง ได้ชื่อเด็กบ้านตรงข้าม ถูกตัว

    ยายพอลดาไม่เคยถามอะไร แต่นางเร่ง{name}มากที่สุด นางรู้เรื่องคนคนนั้นของ{name} คนที่ไม่ได้ข่าวมาครึ่งชีวิต รู้เพราะ{name}เคยเล่าตอนเมาครั้งหนึ่ง แล้วนางก็จำรายละเอียดได้แม่นกว่า{name}เอง

    คนถือบัตรจะมาวันตลาดพรุ่งนี้ ตาบาสทินวางดินสอผูกเชือกไว้บนม้านั่งข้างมือ{name}
  choices:
    - id: ask
      label: เขียนชื่อคนนั้นฝากไป (ของแบบนี้ติดตัวไปนาน)
      habit: curious
      requires: { not_traits: [curse_brand] }
      text: |
        คำตอบกลับมาวันตลาดถัดไป หมึกน้ำเงิน ลายมือเอนซ้าย สองบรรทัด ชื่อหมู่บ้านที่{name}ไม่เคยได้ยิน กับชื่อคน ไม่ใช่ชื่อที่{name}เขียนไป คืนนั้น{name}นอนไม่หลับ เสียงต่ำๆ ใต้เสียงอื่นชัดกว่าทุกคืน และ{name}รู้ว่าหมู่บ้านนั้นอยู่ทางไหน ห่างไปกี่วันเดิน โดยไม่ต้องถามใคร

        ยายพอลดาอ่านกระดาษแผ่นนั้นแล้วถามว่าจะไปไหม {name}พับกระดาษใส่กระเป๋าเสื้อตัวที่ใส่ทุกวัน
      effects: { marks: { star: 1 }, world: { star: 1 }, flags: [asked_the_box_about_the_lost_one] }
    - id: dont_ask
      label: วางดินสอคืน ไม่ถาม
      text: |
        ตาบาสทินเก็บดินสอคืนโดยไม่บ่น ยายพอลดาบ่นแทนทั้งบ่าย ว่า{name}ขี้ขลาด ว่า{name}หัวแข็ง ว่า{name}จะตายไปโดยไม่รู้อะไรเลย

        พลบค่ำนางเลิกบ่น เอาผ้าคลุมไหล่อีกผืนในตะกร้ามาคลุมให้{name} แล้วนั่งอยู่ด้วยจนร้านเกลือปิด
      effects: { stats: { WIS: 1 }, flags: [left_the_lost_one_unasked] }
    - id: let_a_friend_ask
      label: ให้ยายพอลดาฝากถามแทน แต่ไม่อ่านคำตอบ
      text: |
        ยายพอลดาเขียนคำถามด้วยลายมือตัวเอง ชื่อคนนั้นสะกดถูกทุกตัว วันตลาดถัดไปนางได้คำตอบ พับไว้ในผ้าเช็ดหน้า ไม่ยื่นให้ {name}ก็ไม่ขอดู ทุกวันที่นั่งม้านั่งด้วยกัน มุมผ้าเช็ดหน้าโผล่จากกระเป๋าเสื้อของนาง

        ปลายหน้าหนาว ยายพอลดาคิดเงินทอนที่ร้านเกลือได้เร็วกว่าคนขาย
      effects: { flags: [let_a_friend_ask_for_the_lost_one] }
    - id: ask_anyway
      label: เขียนชื่อคนนั้นฝากไปกับคนถือบัตรเหมือนคนอื่น
      habit: curious
      requires: { trait: curse_brand }
      text: |
        วันตลาดถัดไปคนถือบัตรแจกคำตอบจนหมดปึก แล้วยื่นกระดาษของ{name}คืนมา ยังพับแบบที่{name}พับ ไม่มีหมึกน้ำเงินสักจุด เขาคืนเหรียญให้ด้วย ขอโทษอย่างสุภาพ ตาบาสทินคว้ากระดาษไปส่องแดด พลิกดูสองด้าน

        ยายพอลดาเอาดินสอเขียนชื่อคนนั้นลงใต้ชื่อที่{name}เขียน ลายมือของนางเอง แล้วยื่นคืน บอกว่าทีนี้ชื่อนี้ก็มีคนจำได้สองคนแล้ว
      effects: { flags: [got_a_blank_sheet_for_the_lost_one] }
