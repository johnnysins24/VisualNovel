# เรื่องเติมช่องว่าง วัยรุ่น อายุ 12 ถึง 13 เกิดซ้ำได้ (once: false) น้ำหนักต่ำ
# ทุกตัวเลือกให้ lean_X หนึ่งทาง ห้ามใช้ {father} {mother} ในเรื่องที่เด็กวิหารเจอได้ (arvel_village และเรื่องไม่ระบุถิ่น)
# เวนทราสมีทั้งลูกคนงานโรงกลั่นและเด็กที่ซ่อนอยู่ในบ้านขุนนาง เรื่องของเวนทราสจึงต้องเป็นเรื่องที่ทั้งเมืองเห็นพร้อมกัน

- id: youth.filler_arvel
  stage: youth
  scene: tavern
  weight: 1
  once: false
  when:
    age: [12, 13]
    location_tag: arvel_village
  text: |
    หน้าหนาวปีนี้คลองหลังโรงสีแข็งหนาเป็นคืบ เจ้าของโรงเตี๊ยมในเมืองตลาดส่งคนมาจ้างตัดน้ำแข็งเป็นก้อน ขนไปเก็บไว้ในห้องใต้ดิน กลบด้วยขี้เลื่อย ให้มีน้ำแข็งใส่เหล้าหมักไปจนกลางหน้าร้อน

    ผู้ชายในหมู่บ้านลงไปยืนบนคลองตั้งแต่เช้า เลื่อยเสียงดังครืดๆ ไปทั้งคุ้ง เด็กที่อายุครบสิบสองแล้วลงไปช่วยได้
  choices:
    - id: cut_ice
      label: ลงไปเลื่อยน้ำแข็งกับผู้ใหญ่
      text: |
        เลื่อยน้ำแข็งด้ามยาวกว่าตัว ต้องใช้สองคนชักคนละฝั่ง {name}ยืนชักอยู่ฝั่งตรงข้ามชายหนวดแดงที่พูดแต่เรื่องหมาของตัวเอง ตกเย็นได้น้ำแข็งสิบสองก้อน มือชาจนจับช้อนกินข้าวไม่อยู่
      effects: { stats: { STR: 1 }, flags: [lean_warrior] }
    - id: ice_fishing
      label: เจาะรูน้ำแข็งตรงที่ผู้ใหญ่ไม่ไปยืน แล้วนั่งตกปลา
      text: |
        ปลาใต้น้ำแข็งว่ายช้าเหมือนยังไม่ตื่น {name}นั่งนิ่งจนหิมะเกาะไหล่ มือข้างที่ถือสายเบ็ดไม่ขยับเลย พอสายกระตุกครั้งแรก ก็ดึงขึ้นมาได้ปลาไหลตัวยาวเท่าแขน ตลอดหน้าหนาวนั้นไม่มีใครในหมู่บ้านตกได้ตัวที่ยาวกว่า
      effects: { stats: { DEX: 1 }, flags: [lean_ranger] }
    - id: sell_chips
      label: เก็บเศษน้ำแข็งที่แตกจากก้อนใหญ่ ไปขายเองที่ตลาด
      text: |
        เศษน้ำแข็งที่เลื่อยแตกไม่มีใครนับ {name}เก็บใส่ตะกร้าคลุมฟาง แบกไปขายแม่ค้าน้ำหวานที่ตลาดก่อนคนของโรงเตี๊ยมจะไปถึง ได้เหรียญทองแดงหนึ่งเหรียญ กับคำเตือนจากแม่ค้าว่าอย่าให้เจ้าของโรงเตี๊ยมรู้ว่าน้ำแข็งของเขาไปถึงตลาดก่อนตัวเขา
      effects: { stats: { DEX: 1 }, gold: 1, flags: [lean_rogue] }

- id: youth.filler_ventras
  stage: youth
  weight: 1
  once: false
  when:
    age: [12, 13]
    year: [289, 313]
    location_tag: ventras
  text: |
    วันเฉลิมพระชนม์ เรือเหาะของราชนาวีบินขบวนผ่านเวนทราสสิบสองลำ บินต่ำจนเงาของมันพาดผ่านหลังคาทุกหลังทีละลำ ทั้งเมืองหยุดงานครึ่งวัน โรงกลั่นดับหม้อ ร้านค้าปิดประตู คนออกมายืนเต็มถนนจนรถม้าผ่านไม่ได้

    ตามเสาไฟทุกต้นมีประกาศพระราชโองการติดไว้ ตัวหนังสือสีทองบนกระดาษแดง คนส่วนใหญ่อ่านไม่ออก แต่ทุกคนรู้ว่าวันนี้ห้ามขายเหล้าก่อนเที่ยง
  choices:
    - id: climb_roof
      label: ปีนขึ้นหลังคาไปดูให้ใกล้ที่สุด
      text: |
        {name}ปีนขึ้นไปนั่งบนสันหลังคาที่สูงที่สุดที่ปีนไหว ลำที่เจ็ดบินต่ำจนเห็นทหารยืนเรียงที่ราวดาดฟ้า ทหารคนหนึ่งทำหมวกหล่น หมวกใบนั้นลอยวนลงมาตกในรางน้ำฝนห่างไปสามหลังคา {name}ไต่ไปเก็บได้ก่อนใคร
      effects: { stats: { DEX: 1 }, flags: [lean_ranger] }
    - id: crowd_hands
      label: แทรกตัวไปในฝูงคนที่แหงนคอมองฟ้า
      text: |
        คนที่แหงนคอมองฟ้าไม่มีใครมองกระเป๋าตัวเอง {name}ไม่ได้ล้วงใคร แค่เดินแทรกไปจนสุดถนน แล้วนับดูว่าตลอดทางมีกี่มือที่ล้วงคนอื่น นับได้เจ็ดมือ สองมือในนั้นเป็นมือของคนที่{name}รู้จักชื่อ
      effects: { stats: { DEX: 1 }, flags: [lean_rogue] }
    - id: read_decree
      label: อ่านประกาศให้คนที่ยืนอยู่ใต้เสาไฟฟัง
      text: |
        คำในประกาศยาวและเก่ากว่าที่คนพูดกัน {name}อ่านติดๆ ขัดๆ ทีละบรรทัด คนที่ยืนฟังเพิ่มขึ้นเรื่อยๆ จนเต็มหัวมุม บรรทัดสุดท้ายประกาศลดภาษีเกลือ คนฟังปรบมือเหมือนคนอ่านเป็นคนลดให้เอง
      effects: { stats: { INT: 1 }, flags: [lean_wizard] }

- id: youth.filler_hordun
  stage: youth
  weight: 1
  once: false
  when:
    age: [12, 13]
    location_tag: hordun
  text: |
    ทุกต้นหนาว โรงหลอมชั้นล่างดับเตาเจ็ดวัน ให้ช่างลงไปซ่อมปล่องกับท่อลมที่ร้าว ไอร้อนที่ปกติลอยขึ้นมาตามผนังจนทุกห้องในเมืองใต้เขาอุ่น เจ็ดวันนั้นหายไปหมด ผนังห้องนอนเย็นจนน้ำค้างเกาะ คนแคระนอนรวมกันเป็นห้องๆ ห่มผ้าทุกผืนที่มีในบ้าน

    ช่างมีไม่พอ ใครอายุครบสิบสองแล้วต้องลงไปช่วย
  choices:
    - id: haul_bricks
      label: ขนอิฐทนไฟลงไปให้ช่างถึงปากเตา
      text: |
        อิฐทนไฟก้อนหนึ่งหนักเท่าเด็กห้าขวบ รถรางขนแร่ไม่ลงไปถึงชั้นนั้น ต้องแบกลงบันไดทีละก้อน เจ็ดวันนั้น{name}ขนได้สองร้อยก้อน ช่างคนหนึ่งเอาถ่านเขียนเลขสองร้อยไว้บนหลังมือ{name} ล้างสามวันกว่าจะออก
      effects: { stats: { STR: 1 }, flags: [lean_warrior] }
    - id: crawl_duct
      label: มุดเข้าท่อลมเส้นที่ช่างตัวใหญ่เข้าไม่ได้
      text: |
        ท่อลมเส้นที่ร้าวแคบจนช่างทุกคนมุดไม่เข้า {name}มุดเข้าไปพร้อมตะเกียงกับก้อนชอล์ก คลานไปขีดชอล์กไว้ตรงรอยร้าวทุกรอยที่เจอ ออกมาอีกฝั่งตอนเย็น ดำไปทั้งตัวเหมือนเพิ่งคลานออกมาจากเตา ช่างให้ขนมปังกับเนยแข็งเป็นค่าจ้าง {name}กินหมดก่อนจะได้ล้างมือ
      effects: { stats: { DEX: 1 }, flags: [lean_rogue] }
    - id: duct_plans
      label: นั่งเฝ้าห้องเก็บแผนผังของโรงหลอมแทนคนเฝ้าที่ลงไปซ่อม
      text: |
        ห้องเก็บแผนผังหนาวที่สุดในชั้น ไม่มีอะไรทำนอกจากเปิดแผนผังท่อลมดู เจ็ดวันนั้น{name}ไล่นิ้วตามท่อลมทุกเส้นจนจำได้ว่าเส้นไหนวิ่งผ่านห้องนอนของบ้านไหน วันที่เตาติดใหม่ {name}วิ่งกลับไปนั่งในห้องนอนตัวเอง นับในใจว่าไอร้อนจะมาถึงเมื่อไหร่ ผนังเริ่มอุ่นตอนนับได้เก้าสิบเอ็ด ตามความยาวท่อในแผนผัง ควรจะอุ่นตั้งแต่แปดสิบ วันรุ่งขึ้น{name}กลับไปห้องแผนผังอีก หาว่าสิบเอ็ดที่หายไปนั้นไปหายอยู่ตรงไหนของท่อ
      effects: { stats: { INT: 1 }, flags: [lean_wizard] }

- id: youth.filler_ileth
  stage: youth
  weight: 1
  once: false
  when:
    age: [12, 13]
    location_tag: ileth
  text: |
    ปลายฤดูฝน ลมระหว่างเสาสองต้นเปลี่ยนทิศ พัดจากทางใต้มาแทนทางเหนือ เอลฟ์บ้านกิ่งลมเรียกช่วงนี้ว่าลมกลับหัว กิ่งไม้ทุกกิ่งต้องมัดเชือกใหม่ บันไดเชือกต้องเปลี่ยนเส้นที่เปื่อย

    ไกลออกไปทางใต้ ลมพัดเสียงเครื่องเลื่อยไอน้ำจากค่ายตัดไม้มาให้ได้ยิน ปีนี้ได้ยินชัดกว่าทุกปี
  choices:
    - id: retie_ladders
      label: ปีนลงไปเปลี่ยนเชือกบันไดเส้นที่เปื่อย
      text: |
        บันไดเชือกเส้นที่สามยาวสามสิบช่วงคน {name}ปีนลงไปทีละขั้น ตัดเชือกเก่า ผูกเชือกใหม่ ตัดเชือกเก่า ผูกเชือกใหม่ ลงถึงพื้นป่าตอนเย็น แขนสั่นจนต้องนั่งพักบนรากไม้ แล้วค่อยปีนกลับขึ้นไปตามบันไดที่ผูกเอง
      effects: { stats: { STR: 1 }, flags: [lean_warrior] }
    - id: watch_saw
      label: แอบลงไปดูเครื่องเลื่อยไอน้ำที่ค่ายตัดไม้
      text: |
        {name}ไปหมอบอยู่บนกิ่งต้นสุดท้ายก่อนเขตค่าย มองลงไปเห็นเครื่องเลื่อยตัวใหญ่เท่าบ้าน กินถ่านมารเป็นกระสอบ ตัดต้นไม้ที่อายุมากกว่าบ้านกิ่งลมขาดในเวลาที่เอลฟ์ร้องเพลงยังไม่จบหนึ่งเพลง คนคุมเครื่องเงยหน้าขึ้นมาทางกิ่งนั้นครั้งหนึ่ง แต่ไม่เห็นอะไร
      effects: { stats: { DEX: 1 }, flags: [lean_rogue] }
    - id: copy_books
      label: ช่วยคัดสมุดนับดาวเล่มที่ความชื้นกินจนหมึกซีด
      text: |
        สมุดนับดาวรุ่นแรกๆ เก็บไว้ในโพรงไม้ใต้หอ ฤดูฝนปีนี้ความชื้นเข้าไปถึง {name}นั่งคัดตัวเลขลงสมุดใหม่ทีละหน้า ตัวเลขเรียงเป็นแถวยาวเท่ากันทุกปีมาหลายร้อยปี แล้วก็เริ่มยาวขึ้นในหน้าท้ายๆ
      effects: { stats: { INT: 1 }, flags: [lean_wizard] }

- id: youth.filler_ashland
  stage: youth
  weight: 1
  once: false
  when:
    age: [12, 13]
    location_tag: ashland
  text: |
    ฝนในแดนเถ้าตกปีละไม่กี่ครั้ง ตกทีไรเถ้ากลายเป็นโคลนเทาลื่นเหมือนสบู่ แผ่นไม้ที่ปูทางไปป้อมสามจมหายไปครึ่งหนึ่ง ทางไปหลุมเก้าขาดเป็นสองช่วง

    พอฝนหยุด ผู้ใหญ่ยังต้องลงหลุม งานที่เหลือจึงเป็นของเด็ก
  choices:
    - id: relay_planks
      label: ขุดแผ่นไม้ที่จมขึ้นมาปูทางใหม่
      text: |
        แผ่นไม้ที่จมอยู่ใต้โคลนหนักกว่าตอนแห้งสามเท่า {name}ใช้ไม้คานงัดขึ้นมาทีละแผ่น ล้างโคลนออก แล้ววางใหม่บนเถ้าที่แน่นกว่า ทำอยู่สี่วันกว่าทางไปหลุมเก้าจะต่อกันอีกครั้ง
      effects: { stats: { STR: 1 }, flags: [lean_warrior] }
    - id: probe_ash
      label: ตามคนแก่ไปเอาไม้ยาวจิ้มหาหลุมยุบหลังฝน
      text: |
        หลังฝน เถ้าที่ข้างใต้กลวงจะยุบเป็นแอ่งก่อนที่อื่น คนแก่ให้{name}เดินนำ เอาไม้ยาวจิ้มเถ้าข้างหน้าทุกสามก้าว ไม้จมลงไปทั้งด้ามสองครั้ง ทั้งสองครั้ง{name}ถอยกลับมาก่อนที่คนแก่จะทันตะโกน
      effects: { stats: { DEX: 1 }, flags: [lean_ranger] }
    - id: trade_news
      label: เอาหญ้าเงินดองไปแลกข่าวกับคนขับเกวียนถ่าน
      text: |
        คนขับเกวียนถ่านติดฝนอยู่ที่ลานพักสองคืน ไม่มีอะไรทำนอกจากกินกับคุย {name}เอาหญ้าเงินดองไปให้ แลกกับข่าวจากเวนทราสกับทุนดาร์ ขากลับจำมาเล่าให้คนในหมู่บ้านฟังได้ทุกเรื่อง เล่าเรื่องเดียวกันซ้ำให้คนละบ้าน แต่ละบ้านได้ฟังไม่เหมือนกันนิดหนึ่ง
      effects: { stats: { CHA: 1 }, flags: [lean_bard] }

- id: youth.filler_quiet_year
  stage: youth
  weight: 1
  once: false
  when:
    age: [12, 13]
  text: |
    ปีนี้ไม่มีเรื่องอะไรให้คนพูดถึง แต่{name}สังเกตว่าตัวเองสูงกว่าผู้ใหญ่บางคนแล้ว เสื้อตัวเดิมรัดจนต้องปล่อยตะเข็บ เสียงตัวเองตอนพูดดังๆ ฟังแปลกหูจนบางทีก็ไม่อยากพูด

    ผู้ใหญ่เริ่มเรียกไปช่วยงานที่เมื่อปีก่อนยังไม่ให้แตะ แล้วก็ยังไล่ไปนอนตอนหัวค่ำเหมือนเดิม
  choices:
    - id: arm_wrestle
      label: งัดข้อกับเด็กที่โตกว่าทุกคนที่ยอมงัดด้วย
      text: |
        {name}แพ้สิบเอ็ดครั้งแรก ชนะครั้งที่สิบสอง คนที่แพ้เป็นเด็กที่โตกว่าสามปี มันขอแก้มือทันที แล้วก็ชนะไป แต่หลังจากวันนั้นไม่มีใครในละแวกนั้นกล้าท้า{name}ต่อหน้าคนอื่นอีก
      effects: { stats: { STR: 1 }, flags: [lean_warrior] }
    - id: night_walks
      label: แอบออกไปเดินคนเดียวตอนที่ผู้ใหญ่หลับ
      text: |
        กลางคืนทุกที่ไม่เหมือนกลางวัน ทางที่เดินทุกวันยาวขึ้น บ้านที่รู้จักทุกหลังมีเสียงที่ไม่เคยได้ยิน {name}เรียนรู้ว่าประตูบานไหนลั่นเอี๊ยด หมาบ้านไหนหลับลึก ทั้งปีไม่มีใครรู้ว่า{name}ออกไปเลยสักคืน
      effects: { stats: { DEX: 1 }, flags: [lean_rogue] }
    - id: listen_adults
      label: นั่งฟังผู้ใหญ่คุยกันหลังมื้อเย็นจนเขาลืมว่ามีเด็กอยู่
      text: |
        ไม่กี่คืนผู้ใหญ่ก็ลืมว่ามีเด็กนั่งอยู่ {name}นั่งอยู่มุมเดิมทุกคืน จนได้ยินเรื่องหนี้ เรื่องคนที่หนีไป เรื่องที่พูดต่อหน้ากับเรื่องที่พูดลับหลังไม่ตรงกัน ปลายปีเล่าเรื่องพวกนั้นซ้ำได้ด้วยน้ำเสียงของคนพูดทุกคน
      effects: { stats: { CHA: 1 }, flags: [lean_bard] }
