# วัยกลางคน ลูกหลานของเจ้าเดิม (ชุด 4) การปะทะ 12 ฉาก
# ชนะด้วยการทำให้สงบ ไม่ได้ฆ่า วิธีที่ได้ผลคือพูด อ่านทาง ตั้งรับ และพิธีขอขมาเอง การบุกมีให้เลือกและออกมาไม่ดี
# เจ็ดฉากแรก (_comes) มาหาคนที่ฝืนซ้ำ ไม่ได้มาแก้แค้น มาเพราะกลิ่นของคนฝืนเหมือนกลิ่นของสิ่งที่ปลุกมัน
#   ข้อความ win เล่าต่อว่าตัวละครทำพิธีขอขมาจนจบ เพราะชนะได้ตั้งแต่จังหวะไหนก็ได้
# ห้าฉากหลัง (_stands) ตัวละครเป็นคนเดียวในที่นั้นที่รู้ข้อห้าม ยืนขวางระหว่างของที่ตื่นกับคนที่ปลุกมัน
# ประเพณีใหม่ในไฟล์นี้: วางรวงข้าวบนปากบ่อและบอกดินก่อนถมบ่อเก่า (ทุ่งอาร์เวล)

# ---------- มาหาคนที่ฝืนซ้ำ ----------

- id: adult.enc_land_river_comes
  stage: adult
  weight: 35
  scene: home
  time: night
  when:
    age: [20, 64]
    taboo: { id: river, defies: true }
  text: |
    {name}ตื่นเพราะเท้าเย็น ชายผ้าห่มเปียกชุ่มทั้งแถบ พื้นห้องมีน้ำขังถึงข้อตาตุ่ม ข้างนอกไม่มีฝน หลังคาไม่รั่ว น้ำไหลเข้ามาทางช่องใต้ประตูเป็นแผ่นเดียว เรียบและช้า เหมือนผ้าที่มีคนค่อยๆ คลี่เข้ามา

    ที่ปลายเตียง น้ำยืนอยู่ สูงเท่าคนตัวเล็ก ข้างในตัวมันมีของหมุนวนช้าๆ เปลือกหัวหอม ก้นหม้อที่ขูดทิ้ง ผ้าขี้ริ้วสีขุ่น เหรียญทองแดงเหรียญหนึ่งลอยวนอยู่ตรงกลางอก บางชิ้น{name}จำได้ บางชิ้นจำไม่ได้แล้ว

    มันไม่ได้มาเอาคืน มันเดินตามกลิ่นมา คนที่เทของลงน้ำตอนมืด หรือกำเหรียญที่ควรเป็นของน้ำไว้ ซ้ำแล้วซ้ำอีก ตัวจะมีกลิ่นเดียวกับสิ่งที่ปลุกมันขึ้นมา
  encounter:
    foe: walking_water
    beats:
      - text: น้ำเดินโน้มตัวเข้ามาเหนือเตียง ดมไปตามแขนของ{name}ช้าๆ อย่างหมาดมมือคนแปลกหน้า ทุกที่ที่มันดมผ่านเปียกและเย็นจนกระดูกปวด
        moves:
          - id: rcome_tell
            label: บอกมันตรงๆ ว่าเคยทำอะไรลงไป ที่ไหน คืนไหนบ้าง
            kind: talk
            success: "{name}นับให้มันฟังทีละครั้ง เท่าที่จำได้ ครั้งไหนจำไม่ได้ก็บอกว่าจำไม่ได้ น้ำเดินหยุดดม ของในตัวมันหมุนช้าลงทีละชิ้นเหมือนคนฟังแล้วพักมือ"
          - id: rcome_read
            label: ดูว่ามันดมหาอะไรบนตัว
            kind: read
            stat: WIS
            success: มันดมแต่มือ ไม่แตะหน้า มือข้างที่เคยคว่ำถังหรือเคยกำเหรียญไว้ น้ำเดินไม่ได้มาหาตัว{name} มันมาหากลิ่นบนมือ กลิ่นที่น้ำในบ้านล้างเท่าไรก็ไม่ออก
          - id: rcome_stool
            label: คว้าม้านั่งข้างเตียงฟาดเข้าไป
            kind: attack
            tags: [blunt]
            failure: ม้านั่งผ่านตัวมันไปเหมือนฟาดคลอง แล้วค้างอยู่ข้างใน หมุนวนไปกับเปลือกหอมและก้นหม้อ น้ำดูดแขนของ{name}ที่ตามเข้าไปครึ่งศอก บิดจนข้อศอกลั่น
          - id: rcome_still
            label: นั่งนิ่งบนเตียง ยื่นมือออกไปให้มันดม
            kind: guard
          - id: rcome_door
            label: กระโดดลงจากเตียง ลุยน้ำไปหาประตู
            kind: flee
      - text: น้ำในห้องสูงขึ้นถึงขอบเตียง รองเท้าลอยออกมาจากใต้เตียง ตะเกียงที่หัวนอนล้มลงน้ำ ดับเสียงฉ่า ตัวน้ำเดินแผ่ออกจนชิดผนังทั้งสี่ด้าน
        answer: talk
        moves:
          - id: rcome_promise
            label: บอกมันว่าจะหาบน้ำบ่อไปเทคืนคลองเอง ตรงที่เคยทำผิด ก่อนรุ่งคืนนี้
            kind: talk
          - id: rcome_bail
            label: ตักน้ำในห้องสาดออกไปทางหน้าต่าง
            kind: quick
            failure: น้ำที่สาดออกไปตกลงลาน แล้วไหลย้อนกลับเข้ามาทางใต้ประตูพร้อมใบไม้กับเศษกระเบื้อง สาดของลงน้ำกลางดึกอีกครั้งต่อหน้ามัน ห้องลึกขึ้นอีกคืบ {name}ลื่นล้ม หัวฟาดขอบเตียง
          - id: rcome_post
            label: กอดเสาเตียงไว้ ชูหน้าให้พ้นน้ำ
            kind: guard
          - id: rcome_window
            label: ปีนหน้าต่างออกไปทางหลังคา
            kind: flee
      - text: ของในตัวน้ำเดินลอยออกมาทีละชิ้น มาหยุดตรงหน้า{name} เปลือกหัวหอม ก้นหม้อ ผ้าขี้ริ้ว เหรียญทองแดงเหรียญนั้นลอยมาหยุดเป็นชิ้นสุดท้าย ใกล้จนเห็นรอยตอกบนหน้าเหรียญ
        moves:
          - id: rcome_take
            label: รับของทุกชิ้นไว้ในมือ ไม่ทิ้งสักชิ้น
            kind: guard
          - id: rcome_name_each
            label: บอกมันว่าชิ้นไหนลงน้ำไปเมื่อไร
            kind: talk
          - id: rcome_rite
            label: นึกให้ออกว่าคนเรือแก่เคยบอกวิธีขอขมาน้ำว่าอย่างไร
            kind: read
            stat: INT
            success: น้ำบ่อเจ็ดถัง เทคืนตรงที่เคยทำผิด ให้ทันก่อนรุ่ง แล้วเหรียญแรกที่หามาได้ลงน้ำ {name}จำคำของคนเรือได้ทุกคำ น้ำเดินเอียงตัวไปทางหน้าต่าง ทางที่มองเห็นบ่อกลางลาน
          - id: rcome_grab
            label: คว้าเหรียญไว้ แล้วหนีออกประตู
            kind: flee
      - text: น้ำเดินไหลออกทางประตู ช้าๆ ไปทางลาน ไม่ได้ไปทางคลอง มันไปหยุดข้างบ่อน้ำกลางลาน ยืนรออย่างวัวรอคนมาจูง ฟ้าทางตะวันออกยังดำสนิท
        answer: guard
        moves:
          - id: rcome_pails
            label: หิ้วถังตักน้ำบ่อ เดินไปเทคืนคลองทีละถังจนครบเจ็ด
            kind: guard
          - id: rcome_run_pails
            label: วิ่งหิ้วทีละสองถัง ให้ทันก่อนไก่ขัน
            kind: quick
          - id: rcome_sorry
            label: ยืนข้างบ่อ ขอโทษมันเสียงดังให้ทั้งลานได้ยิน
            kind: talk
            tags: [noise]
          - id: rcome_back_in
            label: กลับเข้าห้อง ลงกลอนประตู
            kind: flee
    win:
      text: |
        น้ำเดินยุบตัวลงช้าๆ เหมือนคนนั่งลงพัก ไหลออกไปทางคลองเป็นแผ่นเดียว ทิ้งของทุกชิ้นกองไว้เป็นแถวบนพื้นลาน เรียงจากเก่าไปใหม่ ห้องนอนแห้งเหลือแต่คราบน้ำเป็นวงรอบขาเตียง

        ก่อนรุ่งคืนนั้น{name}หาบน้ำบ่อลงไปเทคืนคลองครบเจ็ดถัง ค่าแรงวันต่อมา เหรียญแรกลงน้ำที่ท่า ไม่มีเสียงจ๋อม
      effects: { stats: { WIS: 1 }, taboo: { river: mend }, flags: [calmed_the_walking_water_that_came] }
    lose:
      text: |
        น้ำปิดหน้า เย็นและหนัก {name}จำได้ว่ามีเปลือกหัวหอมลอยผ่านตา แล้วก็ไอเอาน้ำคลองออกมาอยู่บนพื้นห้อง ตัวเปียกทั้งตัว ฟ้าสว่างแล้ว

        ห้องแห้งเกือบหมด เหลือแอ่งน้ำแอ่งเดียวตรงปลายเตียง ข้างในแอ่งมีเหรียญทองแดงจมอยู่หนึ่งเหรียญ
      effects: { flags: [woke_on_a_wet_floor] }
    stalemate:
      text: |
        ไก่ตัวแรกขัน น้ำเดินชะงักเหมือนคนนึกได้ว่ามีธุระ ไหลกลับออกทางใต้ประตู ทิ้งของทุกชิ้นกองไว้กลางห้อง

        {name}ใช้เวลาทั้งเช้าขนของกองนั้นออกไปทิ้งที่กองขยะของละแวก ผ้าห่มตากอยู่สามวันยังไม่แห้ง
      effects: { flags: [the_water_left_at_cockcrow] }
    flee:
      text: |
        {name}ไปหยุดหอบอยู่หัวถนน ตัวเปียกถึงเอว ข้างหลังได้ยินเสียงน้ำไหลออกจากบ้านเป็นสาย ไหลไปทางคลองทั้งคืน

        เช้ามาห้องนอนแห้ง ของในห้องอยู่ครบ เว้นแต่เหรียญสองเหรียญที่วางไว้บนหิ้งข้างประตู หายไปทั้งคู่
      effects: { gold: -2, flags: [fled_the_walking_water_at_home] }
    death:
      text: |
        น้ำปิดเข้ามาเหนือหัว ข้างในเย็นและเงียบกว่าที่คิด ของทุกชิ้นที่{name}เคยเทลงไปลอยผ่านหน้าทีละชิ้น ช้าๆ

        ชิ้นสุดท้ายคือเหรียญทองแดงเหรียญนั้น หมุนอยู่ตรงหน้า ไม่มีเสียง

- id: adult.enc_land_field_comes
  stage: adult
  weight: 35
  time: dusk
  when:
    age: [20, 64]
    taboo: { id: field, defies: true }
  text: |
    ทางเดินกลับบ้านตอนโพล้เพล้ผ่านที่ดินว่างแปลงหนึ่ง หญ้าขึ้นถึงเข่า {name}เดินมาเกือบสุดแปลงจึงได้ยินเสียงหายใจข้างหลัง ลมหายใจยาว อุ่น มีกลิ่นดินใต้ราก

    เนินดินที่เช้านี้ยังไม่มีอยู่ ตอนนี้เดินตามมาห่างไม่ถึงสามช่วงตัว ดินร่วงจากหลังเป็นก้อน ข้างใต้เป็นขนฟูสีฟาง ตัวโตเท่าเกวียนบรรทุกข้าว หน้าเป็นหน้าลูกวัว ตาปิดอยู่ครึ่งหนึ่ง จมูกชื้นยื่นมาดุนหลัง{name}เบาๆ ครั้งหนึ่ง {name}เซไปสามก้าว

    ลูกวัวไม่ได้โกรธ มันตามกลิ่นดินมา ดินตรงที่มันนอน ตรงที่มีคนไถข้ามหรือเกี่ยวสิ่งที่ไม่ควรเกี่ยวซ้ำแล้วซ้ำอีก กลิ่นนั้นติดส้นเท้าของ{name}มาตลอดทาง
  encounter:
    foe: earth_calf
    morale: 3
    beats:
      - text: ลูกวัวใต้ทุ่งเดินตามติดหลัง ดุนทีละครั้ง ทุกครั้งที่ดุน {name}ต้องก้าวเร็วขึ้นสามก้าว ทางข้างหน้าผ่านรั้วไม้ของบ้านหลังแรกในละแวก
        moves:
          - id: fcome_sniff
            label: ดูว่ามันดมหาอะไรบนตัว
            kind: read
            stat: WIS
            success: มันดมเท้า ดมชายกางเกง ดมมือข้างที่เคยจับเคียวหรือคันไถ มันไม่ได้ตาม{name} มันตามกลิ่นดินจากที่นอนของมันที่ติดตัว{name}มา
          - id: fcome_calf_talk
            label: พูดกับมันเสียงต่ำๆ อย่างที่คนเลี้ยงพูดกับลูกวัวหลงแม่
            kind: talk
          - id: fcome_hurry
            label: เดินเร็วขึ้น ทิ้งระยะ
            kind: quick
          - id: fcome_stick
            label: เก็บไม้ข้างทางขึ้นมาไล่
            kind: attack
            tags: [blunt]
            failure: ไม้หักครึ่งบนจมูกที่นุ่มเหมือนกองฟาง ลูกวัวใต้ทุ่งจามครั้งเดียว ลมจามพัด{name}ล้มหงายลงข้างทาง ก้อนดินร่วงจากหลังมันลงมาทับขา
          - id: fcome_run
            label: วิ่งเข้าบ้าน
            kind: flee
      - text: ถึงหน้าบ้าน ลูกวัวใต้ทุ่งพับขาลงนอนขวางหน้าประตูเหมือนลูกวัวนอนเฝ้าแม่ ตัวมันกินที่ไปครึ่งลาน ประตูรั้วล้มอยู่ใต้สีข้าง
        answer: read
        moves:
          - id: fcome_tracks
            label: ไล่ดูรอยกีบที่มันเดินมา
            kind: read
            stat: INT
            success: รอยกีบทับรอยเท้าของ{name}ทุกรอย ตั้งแต่ที่ดินว่างมาจนถึงหน้าบ้าน ไม่เบี่ยงสักรอย มันจะเดินตามทางนี้กลับก็ได้ ถ้ามีใครเดินนำ
          - id: fcome_push
            label: เอาไหล่ดันมันออกจากหน้าประตู
            kind: guard
            failure: เหมือนเอาไหล่ดันเนินดิน ลูกวัวใต้ทุ่งไม่ขยับ แค่หายใจออกครั้งเดียว อกที่ขยายขึ้นดัน{name}กระเด็นไปชนเสารั้ว
          - id: fcome_hay
            label: ขนฟางทั้งกองในลานมาวางให้มันกิน
            kind: quick
          - id: fcome_window
            label: ปีนหน้าต่างเข้าบ้าน ปิดทุกบาน
            kind: flee
      - text: ลูกวัวใต้ทุ่งเริ่มขยับตัวหาท่านอน ดินใต้ตัวมันยุบลงทีละน้อย ลานบ้านเอียงไปทางมัน เสาเรือนต้นหน้าลั่นเปรี๊ยะ ทั้งบ้านเหมือนจะไหลลงไปนอนด้วย
        moves:
          - id: fcome_barefoot
            label: ถอดรองเท้า เดินเท้าเปล่าวนรอบตัวมันสามรอบ
            kind: read
            stat: WIS
            success: คนถือคันไถรุ่นก่อนจูงไถเปล่าวนรอบเนินสามรอบ เท้าเปล่า {name}ทำตามที่เคยได้ยิน รอบที่สองลูกวัวใต้ทุ่งเลิกขุด รอบที่สามมันเงยหัวขึ้นจากดิน หูกระดิกตามเสียงเท้า
          - id: fcome_song
            label: ร้องเพลงไถนาที่คนรุ่นก่อนร้องตอนไถอ้อมเนิน
            kind: talk
          - id: fcome_prop
            label: เอาไม้ไปค้ำเสาเรือนต้นที่ลั่น
            kind: guard
            failure: ไม้ค้ำจมลงไปในดินที่ยุบทั้งท่อน เสาเรือนเอียงต่อไม่หยุด คานหล่นลงมาหนึ่งท่อน ฟาดไหล่{name}จนทรุด
          - id: fcome_leave_house
            label: ขนของเท่าที่ขนได้ออกจากบ้าน
            kind: flee
      - text: ลูกวัวใต้ทุ่งลุกขึ้นยืน ดินร่วงจากสีข้างเป็นแผ่น มันหันหัวไปมา หาทางกลับไปที่นอนของตัวเอง ทางที่ใกล้ที่สุดผ่านกลางละแวก ผ่านรั้วสามแนวกับเล้าไก่สองเล้า
        answer: read
        moves:
          - id: fcome_lead
            label: ลากไถเปล่าเดินนำหน้า พามันกลับทางที่มา
            kind: read
            stat: WIS
          - id: fcome_call
            label: เรียกมันด้วยเสียงที่คนไถเรียกวัว
            kind: talk
          - id: fcome_gates
            label: วิ่งไปเปิดประตูรั้วทุกบานตลอดทาง
            kind: quick
          - id: fcome_let_go
            label: ปล่อยให้มันไปทางของมัน
            kind: flee
    win:
      text: |
        ลูกวัวใต้ทุ่งก้มหัวลงต่ำ หูสองข้างกระดิกไปทาง{name} แล้วเดินกลับไปตามทางที่มา ช้า ไม่แวะ ไม่เบี่ยง ที่ดินว่างตรงที่มันลุกขึ้นมามีแอ่งใหญ่เท่าเกวียน มันลงไปนอนขดตัวในแอ่งนั้นอย่างลูกวัวขดหนาว แล้วดินก็ปิดลงมาทับเป็นเนิน

        เช้าวันต่อมา{name}จูงไถเปล่าเดินเท้าเปล่าวนรอบเนินใหม่นั้นสามรอบ ไม่มีใครบอกให้ทำ ดินบนเนินอุ่นอยู่ใต้ฝ่าเท้า
      effects: { stats: { INT: 1 }, taboo: { field: mend }, flags: [calmed_the_earth_calf_that_came] }
    lose:
      text: |
        {name}ล้มลงในดินร่วนเป็นครั้งสุดท้าย ลุกไม่ขึ้น ได้ยินเสียงหายใจยาวๆ อยู่เหนือหัวครู่หนึ่ง แล้วก็ไม่ได้ยินอะไร

        ตื่นมาตอนฟ้าสาง นอนอยู่กลางลาน ข้างตัวมีรอยกีบเป็นวง ลูกวัวไปแล้ว ลานบ้านเอียงไปข้างหนึ่งจนน้ำในโอ่งเทออกครึ่งโอ่ง
      effects: { flags: [knocked_flat_by_the_earth_calf] }
    stalemate:
      text: |
        ฟ้าสาง ลูกวัวใต้ทุ่งหลับไปตรงที่มันนอน หายใจช้าลงทุกที ดินจากที่ไหนไม่รู้ไหลมาคลุมหลังมันทีละชั้น

        สายวันนั้นกลางลานบ้าน{name}มีเนินดินเนินหนึ่ง สูงเท่าเอว หญ้าเริ่มขึ้นแล้ว คนในบ้านเดินอ้อมเนินนั้นตั้งแต่วันแรก ไม่มีใครต้องสั่ง
      effects: { flags: [a_mound_in_the_yard] }
    flee:
      text: |
        {name}ไปค้างบ้านคนอื่นทั้งคืน นอนไม่หลับ ได้ยินเสียงไม้หักเป็นระยะจากทางบ้านตัวเอง

        กลับไปตอนเช้า รั้วล้มเป็นแนวเดียวกันหมด ทุกต้นล้มไปทางที่ดินว่าง ลานบ้านมีรอยกีบเดินวนอยู่หลายสิบรอบ
      effects: { flags: [ran_from_the_earth_calf] }

- id: adult.enc_land_fire_comes
  stage: adult
  weight: 35
  scene: home
  time: night
  when:
    age: [20, 64]
    taboo: { id: fire, defies: true }
  text: |
    เช้ามืด{name}ลงมาจุดเตา ขี้เถ้าในเตามีไอขาวลอยขึ้นมาเป็นเส้น เตาที่ดับไปตั้งแต่หัวค่ำส่งเสียงฉ่ายาวๆ เบาๆ เหมือนกาที่ใกล้เดือด

    บนถ่านดำมีลูกเสือตัวหนึ่งนั่งอยู่ ตัวเท่าแมวโต ขนเป็นเปลวไฟสีส้ม ลายบนหลังเป็นถ่านแดงเรียงเป็นแถบ มันก้มเขี่ยขี้เถ้า หาอะไรสักอย่างในเตาที่ไม่มีไฟเหลือ แล้วเงยหน้าขึ้นมาดมมือ{name}

    มันหิว ไม่ได้โกรธ ไฟในเตานี้ตายก่อนเวลามาหลายครั้งเกินไป ด้วยน้ำบ้าง ด้วยรุ่งเช้าที่มาถึงก่อนไฟยืมได้กลับบ้านบ้าง มือที่ทำให้มันตายยังมีกลิ่นนั้นติดอยู่
  encounter:
    foe: fire_cub
    beats:
      - text: ลูกเสือไฟกระโดดลงจากเตา เดินวนรอบขา{name}อย่างแมวหาของกิน ทุกที่ที่หางมันปัดผ่าน พื้นไม้เป็นรอยไหม้สีน้ำตาล
        moves:
          - id: ccome_fat
            label: โยนมันหมูที่เหลือจากมื้อเย็นให้
            kind: quick
            tags: [bait]
            success: มันหมูยังไม่ทันถึงพื้น ลูกเสือไฟงับกลางอากาศ เคี้ยวเสียงกรอบ น้ำมันหยดลงพื้นเป็นเปลวเล็กๆ แล้วดับ มันเลียปากแล้วนั่งลง หางยังตวัด
          - id: ccome_read
            label: ดูว่ามันเขี่ยหาอะไรในเตา
            kind: read
            stat: WIS
            success: มันเขี่ยหาถ่านที่ยังมีไฟ ไม่ได้หาของกิน ไฟในเตานี้เป็นของมันมาตั้งแต่ก่อนบ้านนี้มีหลังคา และมีคนดับไฟนั้นก่อนเวลา
          - id: ccome_broom
            label: เอาไม้กวาดตะปบไล่
            kind: attack
            failure: ไม้กวาดติดไฟตั้งแต่ปลายจนถึงด้าม ลูกเสือไฟกระโจนงับปลายไม้กวาดเล่นอย่างลูกแมวงับเชือก ไฟลามขึ้นมาถึงข้อมือ{name}ก่อนจะสะบัดทิ้งทัน
          - id: ccome_talk
            label: พูดกับมันเสียงต่ำๆ แบบที่คนเฝ้าเตาพูดกับไฟตอนเช้า
            kind: talk
          - id: ccome_out
            label: ออกไปยืนนอกบ้าน ปิดประตูขังมันไว้
            kind: flee
      - text: ลูกเสือไฟเห็นม่านผ้าที่หน้าต่าง กระโจนขึ้นเกาะ ปีนขึ้นไปทีละตะปบ ม่านไหม้เป็นทางขึ้นไปหาหลังคา ไฟสีส้มเลียขื่อแล้ว
        answer: guard
        moves:
          - id: ccome_relight
            label: กวาดขี้เถ้าเปียกออก ใส่ฟืนแห้งลงเตา ให้มันมีที่กลับ
            kind: guard
            success: "{name}ใส่ฟืนแห้งเป็นกองสูง ยังไม่ทันตีเหล็กไฟ ลูกเสือไฟก็ไต่ลงจากม่าน เดินกลับเข้าเตาไปนั่งบนกองฟืน ฟืนลุกพรึบขึ้นรอบตัวมัน มันหรี่ตาลงครึ่งหนึ่งอย่างแมวได้ที่อุ่น"
          - id: ccome_pull
            label: กระชากม่านลงมาเหยียบไฟให้ดับ
            kind: quick
          - id: ccome_hand
            label: ยื่นมือเปล่าออกไป เรียกมันลงมาเล่นกับมือแทนม่าน
            kind: talk
          - id: ccome_neighbours
            label: วิ่งไปตะโกนเรียกคนข้างบ้าน
            kind: flee
      - text: ลูกเสือไฟกลับมานั่งอยู่หน้าเตา ตาเป็นถ่านแดงสองเม็ดไม่ละจาก{name} เปลวที่ขนหรี่ลงทีละน้อยอย่างไฟที่ฟืนใกล้หมด ข้างนอกฟ้ายังมืด ไก่ยังไม่ขัน
        moves:
          - id: ccome_neighbour_hearth
            label: คีบไฟจากเตาตัวเองไปจุดเตาบ้านข้างๆ ที่ดับอยู่
            kind: guard
            success: เตาบ้านข้างๆ ดับมาตั้งแต่หัวค่ำ {name}คีบถ่านใส่หม้อเดินไป ลูกเสือไฟเดินตามติดส้นเท้า พอถ่านลงเตาบ้านนั้น มันกระโดดตามลงไปนั่งบนถ่าน เตาที่ไม่มีใครจุดลุกขึ้นพร้อมกันทั้งเตา
          - id: ccome_meat
            label: เอาเนื้อเค็มชิ้นสุดท้ายในบ้านมาวางไว้หน้าเตา
            kind: quick
            tags: [bait]
          - id: ccome_sit
            label: นั่งลงหน้าเตาเป็นเพื่อนมันจนไก่ขัน
            kind: talk
          - id: ccome_away
            label: หนีไปขออาศัยบ้านคนอื่น
            kind: flee
    win:
      text: |
        ลูกเสือไฟหาวกว้างจนเห็นลิ้นเป็นถ่านแดง เดินวนสามรอบ แล้วขดตัวลงตรงที่ไฟอุ่นที่สุด เปลวที่ขนกลืนไปกับเปลวในเตาจนแยกไม่ออก พอ{name}เขี่ยดูอีกที ในเตามีแต่ไฟ

        เย็นวันต่อมา{name}คีบไฟจากเตาตัวเองไปจุดเตาบ้านหนึ่งในละแวกที่ดับอยู่ แล้วปล่อยเตาตัวเองให้มอดไปเองทั้งคืน ไม่ราดน้ำ ไม่เติมฟืน คืนนั้น{name}นอนห่มผ้าสามผืนก็ยังหนาว
      effects: { stats: { CON: 1 }, taboo: { fire: mend }, flags: [calmed_the_fire_cub_that_came] }
    lose:
      text: |
        {name}ตบไฟที่ชายเสื้อดับเป็นรอบที่เท่าไรก็ไม่รู้ แล้วล้มลงหน้าเตา ควันเต็มห้อง

        ตื่นมาตอนแดดส่องเข้าประตู ลูกเสือไฟไปแล้ว ขื่อไหม้ดำเป็นแนว รอยเท้าแมวไหม้เป็นทางจากเตาออกไปทางประตูหลัง
      effects: { flags: [scorched_by_the_fire_cub] }
    stalemate:
      text: |
        ไก่ขัน ลูกเสือไฟหาว แล้วมุดลงไปใต้ขี้เถ้าในเตา เหลือแต่ปลายหางโผล่อยู่ครู่หนึ่ง แล้วก็หายไป

        ตั้งแต่วันนั้นเตาบ้าน{name}มีถ่านก้อนหนึ่งแดงอยู่ใต้ขี้เถ้าตลอดเวลา ขี้เถ้าคลุมเท่าไรก็ไม่มอด
      effects: { flags: [a_coal_that_will_not_die] }
    flee:
      text: |
        {name}ยืนอยู่หน้าบ้านจนสว่าง ควันลอดชายคาออกมาเป็นเส้นบางๆ ไม่ได้มากพอให้ใครในละแวกเห็น

        เข้าไปดูตอนสาย ม่านไหม้หมดแล้ว เตาเย็นสนิท ขี้เถ้าในเตาแห้งสนิทเป็นครั้งแรกในรอบหลายเดือน
      effects: { flags: [ran_from_the_fire_cub] }

- id: adult.enc_land_stone_comes
  stage: adult
  weight: 35
  scene: home
  time: dusk
  when:
    age: [20, 64]
    taboo: { id: stone, defies: true }
  text: |
    ฝุ่นหินร่วงลงในชามข้าวเย็นเป็นเกล็ดสีเทา {name}เงยหน้าขึ้นดูเพดาน แล้วได้ยินเสียงหินครูดหิน ช้า หนัก เหมือนโม่หินที่มีคนหมุนทีละครึ่งรอบ

    ผนังด้านที่ติดเตาแยกตัวออกมา ก้อนหินที่ก่อเรียงกันมาตั้งแต่ก่อนใครในบ้านจำได้เลื่อนออกมาทีละก้อน ต่อกันเป็นไหล่ เป็นแขนสองข้าง เป็นหัวที่ไม่มีหน้า แผ่นหินหน้าเตาลุกขึ้นเป็นเท้าข้างหนึ่ง ร่างทั้งร่างสูงจนหัวครูดเพดาน

    หินตื่นหันหัวไม่มีหน้ามาทาง{name} แล้วนิ่งไปเหมือนฟัง มันไม่ได้มาลงโทษใคร มันจำเสียงสิ่วที่ไม่มีเสียงเคาะนำหน้า จำเสียงเท้าที่ลงเหมืองในเดือนที่ควรปล่อยให้หินนอน และจำได้ว่าเป็นของใคร
  encounter:
    foe: waking_stone
    morale: 2
    beats:
      - text: หินตื่นชูกำปั้นขึ้นช้าๆ จนข้อหินลั่น กำปั้นใหญ่เท่าครกตำข้าว ยกค้างอยู่เหนือโต๊ะกินข้าว ชามข้าวสั่นจนเลื่อนออกไปหาขอบ
        answer: quick
        moves:
          - id: scome_roll
            label: ม้วนตัวลงใต้โต๊ะตอนกำปั้นยังค้างอยู่
            kind: quick
          - id: scome_knock
            label: เคาะผนังที่เหลือสามครั้งด้วยข้อนิ้ว
            kind: read
            stat: WIS
            success: ก๊อก ก๊อก ก๊อก กำปั้นค้างอยู่กลางอากาศ หัวไม่มีหน้าเอียงไปทางเสียงเคาะ ฝุ่นร่วงจากข้อศอกของมันเป็นสาย
          - id: scome_chisel
            label: คว้าสิ่วกับค้อนข้างประตู สกัดเข้าที่ข้อเท้ามัน
            kind: attack
            tags: [edge]
            failure: สิ่วกระเด้งออกจากข้อเท้าหินเหมือนตอกลงทั่ง ค้อนสะท้อนกลับมาฟาดสันมือตัวเอง หินตื่นยกเท้าข้างนั้นขึ้นแล้ววางลงใหม่ พื้นกระเด้ง{name}ล้มฟาดขอบโต๊ะ
          - id: scome_door
            label: วิ่งออกประตูไปที่ถนน
            kind: flee
      - text: หินตื่นเดินไปทางผนังห้องข้างๆ หนึ่งก้าว พื้นยุบลงเป็นรอยเท้า ห้องข้างๆ มีคนอยู่ ได้ยินเสียงช้อนกระทบชามลอดผนังมา
        moves:
          - id: scome_warn
            label: ทุบผนังปลุกคนห้องข้างๆ ให้ออกไปก่อน
            kind: quick
            tags: [noise]
          - id: scome_beam
            label: เอาเสาไม้ค้ำเพดานตรงที่มันจะเดินผ่าน
            kind: guard
          - id: scome_tell
            label: บอกมันเสียงดังว่าหน้าหินไหนที่เคยเจาะโดยไม่เคาะ เดือนไหนที่เคยลง
            kind: talk
          - id: scome_window
            label: ออกทางหน้าต่าง ปล่อยให้เป็นเรื่องของผนัง
            kind: flee
      - text: หินตื่นหันกลับมาหา{name} ยืนค้ำอยู่กลางห้อง กำปั้นยกขึ้นอีกครั้ง ช้ากว่าครั้งแรก หัวไม่มีหน้าก้มลงต่ำจนเกือบถึงหน้า{name}
        answer: quick
        moves:
          - id: scome_tools
            label: เอาเครื่องมือทุกชิ้นในบ้านมากองไว้ที่เท้ามัน
            kind: guard
            success: ค้อน สิ่ว เหล็กงัด ลิ่ม {name}วางลงทีละชิ้นที่เท้าหิน กำปั้นของหินตื่นลดลงช้าๆ ตามจำนวนชิ้นที่วาง จนพักอยู่บนเข่าของมันเอง
          - id: scome_duck
            label: ลอดใต้แขนมันไปอยู่ข้างหลัง
            kind: quick
          - id: scome_breathe
            label: ยืนนิ่ง หายใจให้ช้าเท่าที่มันหายใจ
            kind: read
            stat: WIS
          - id: scome_out
            label: วิ่งออกไปนอกบ้าน ไม่หันกลับ
            kind: flee
    win:
      text: |
        หินตื่นนั่งลงพิงที่ว่างบนผนังตรงที่มันลุกออกมา ก้อนหินเลื่อนกลับเข้าที่ทีละก้อน ช้า ไม่ตรงแนวเดิมนัก ผนังด้านนั้นเบี้ยวออกมาทางห้องนิดหนึ่ง แผ่นหินหน้าเตากลับไปนอนที่เดิม มีรอยร้าวใหม่หนึ่งเส้น

        ก่อนเดือนที่หนาวที่สุดจะมา {name}ลงไปมือเปล่าถึงหน้าหินที่เคยทำผิด เคาะสามครั้ง แล้ววางเครื่องมือทั้งชุดไว้ตรงนั้นจนเดือนนั้นผ่านไป ผนังที่เบี้ยวในบ้านไม่ขยับอีกเลย
      effects: { stats: { DEX: 1 }, taboo: { stone: mend }, flags: [calmed_the_waking_stone_that_came] }
    lose:
      text: |
        กำปั้นหินลงมาข้างตัว แรงสะเทือนส่ง{name}ไปกระแทกผนังอีกด้าน ฝุ่นปิดตา แล้วทุกอย่างก็มืด

        คนข้างบ้านขุด{name}ออกมาจากกองหินตอนดึก ผนังด้านเตาพังลงมาทั้งแถบ ไม่มีหินก้อนไหนขยับเองอีก
      effects: { flags: [buried_by_the_waking_stone] }
    stalemate:
      text: |
        หินตื่นหยุดนิ่งกลางห้อง กำปั้นค้างอยู่ระดับอก แล้วไม่ขยับอีก ทั้งคืน ทั้งเช้า

        ช่างหินสามคนใช้เวลาสองวันสกัดมันออกจากบ้านทีละก้อน ทุกคนเคาะสามครั้งก่อนสิ่วจะแตะ ไม่มีใครต้องบอก
      effects: { flags: [a_stone_stood_in_the_house] }
    flee:
      text: |
        {name}ยืนอยู่กลางถนนกับคนในละแวกที่ออกมาดู เสียงหินครูดหินดังอยู่ในบ้านจนเกือบสาง แล้วก็หยุด

        เข้าไปตอนเช้า ผนังด้านเตากลับเข้าที่ครบทุกก้อน เรียงกลับหัวกลับหาง ก้อนที่เคยอยู่ล่างสุดขึ้นไปอยู่บนสุด
      effects: { flags: [fled_the_waking_stone_at_home] }
    death:
      text: |
        กำปั้นลงมาช้า ช้าจน{name}เห็นลายของหินทุกเส้น เห็นเกล็ดแร่ที่สะท้อนแสงตะเกียง

        เสียงสุดท้ายที่ได้ยินคือเสียงเคาะสามครั้ง ไม่รู้ว่าดังมาจากในหินหรือจากในอกตัวเอง

- id: adult.enc_land_forest_comes
  stage: adult
  weight: 35
  time: day
  when:
    age: [20, 64]
    taboo: { id: forest, defies: true }
  text: |
    {name}ผ่าฟืนอยู่หลังบ้านตอนสาย ขวานลงกลางท่อนไม้ แล้วติด ดึงไม่ออก จากรอยผ่าที่เพิ่งเปิด รากเส้นเล็กๆ งอกออกมาพันหัวขวาน สีขาวเหมือนรากถั่วงอก

    กองฟืนทั้งกองขยับ ท่อนไม้ลุกขึ้นยืนทีละท่อน ปลายที่ตัดแตกรากออกมาเกาะกันเป็นลำต้น เป็นกิ่ง รากเส้นใหญ่ปักลงดินในลาน ร่างนั้นสูงกว่าชายคา ไม้ในกองนั้นมาจากไหนบ้าง {name}ไม่เคยถาม เสาบ้านต้นที่ใกล้ที่สุดแตกใบอ่อนออกมาตามรอยตะปู

    ไม้เฒ่าไม่ได้มาทวงอะไร ยางของไม้ที่ตายก่อนเวลากับเลือดของแม่ที่ยังมีลูกต้องเลี้ยง ติดมือคนที่ทำซ้ำแล้วซ้ำอีกนานกว่าที่คนคิด มันตามกลิ่นนั้นมาถึงลานบ้าน
  encounter:
    foe: old_wood
    morale: 2
    beats:
      - text: ไม้เฒ่าก้าวรากแรกเข้ามาในลาน ดินแตกเป็นแนวไปถึงบันไดบ้าน กิ่งของมันกวาดหลังคา กระเบื้องไหลลงมาทีละแผ่น
        moves:
          - id: wcome_torch
            label: คว้าดุ้นไฟจากเตามายืนถือกั้นไว้ ไม่จ่อเข้าไป
            kind: guard
            tags: [fire]
            success: ไม้เฒ่าหยุดรากไว้กลางอากาศ ใบตรงที่ใกล้เปลวไฟที่สุดม้วนเข้า {name}ยืนนิ่ง ไม่ก้าวเข้าไป ไม่ถอย ดุ้นไฟในมือร้อนจนข้อนิ้วแดง
          - id: wcome_read
            label: ดูว่ามันประกอบขึ้นจากไม้อะไรบ้าง
            kind: read
            stat: WIS
            success: ไม้ทุกท่อนในตัวมันเป็นไม้ที่ยังมีใบตอนโดนตัด แก่นยังชื้น ฟืนแห้งที่ซื้อจากตลาดกองอยู่ข้างผนังครบทุกท่อน ไม่มีท่อนไหนขยับ
          - id: wcome_axe
            label: กระชากขวานออกมาฟันรากที่ปักลงมา
            kind: attack
            tags: [edge]
            failure: ขวานจมเข้าไปในรากครึ่งใบ แล้วรากก็ดึงขวานพร้อมแขนของ{name}ลงดิน ข้อไหล่ลั่น รากอีกเส้นตวัดกวาดขาจนล้มหงาย
          - id: wcome_run
            label: ปลุกทุกคนในบ้าน วิ่งออกทางหน้า
            kind: flee
      - text: เสาบ้านทุกต้นตอบมัน ไม้ลั่นทั้งหลัง เสาต้นหน้าแตกกิ่งเขียวออกมาตามรอยตะปู คานเอียงไปทางลาน ทางที่ไม้เฒ่ายืนอยู่ บ้านทั้งหลังจะลุกเดินตามมันไป
        moves:
          - id: wcome_names
            label: บอกมันทีละท่อนว่าไม้ท่อนไหนมาจากต้นไหน
            kind: talk
            tags: [name]
          - id: wcome_brace
            label: เอาหลังค้ำคานต้นที่เอียงที่สุดไว้
            kind: guard
          - id: wcome_drag
            label: ลากของสำคัญออกมาก่อนหลังคาลง
            kind: quick
          - id: wcome_run2
            label: ปล่อยบ้าน วิ่งไปที่โล่งริมถนน
            kind: flee
      - text: ไม้เฒ่าเอนลำต้นลงมาหา{name} เปลือกตรงรอยขวานเปิดออกเป็นร่องลึก ข้างในชื้นและหอมยาง กิ่งเล็กกิ่งหนึ่งหักร่วงลงมาตรงหน้าเท้า
        moves:
          - id: wcome_plant
            label: ขุดหลุมกลางลานด้วยมือ แล้วปักกิ่งนั้นลงไป
            kind: guard
            success: "{name}คุกเข่าขุดดินด้วยมือจนเล็บดำ ปักกิ่งลงไป กลบดิน กดรอบโคน ไม้เฒ่าก้มลงต่ำจนใบปลายกิ่งแตะหลัง{name} เบาเหมือนมือคนแก่ตบหลังเด็ก"
          - id: wcome_kneel
            label: คุกเข่าลง วางขวานไว้ข้างหน้า
            kind: talk
          - id: wcome_roll
            label: กลิ้งหลบลำต้นที่เอนลงมา
            kind: quick
          - id: wcome_run3
            label: วิ่งออกไปทางถนน ไม่หันกลับ
            kind: flee
    win:
      text: |
        ไม้เฒ่าคลายตัวลงทีละท่อน รากหดกลับเข้าปลายไม้ กิ่งพับลงแนบลำ ท่อนไม้ทั้งหมดล้มลงกองกลางลาน เรียงกันเป็นตับเหมือนมีคนจัด ใบอ่อนบนเสาบ้านเหี่ยวเป็นสีน้ำตาลก่อนตะวันตก

        ท่อนหนึ่งในกองแตกหน่อเขียว {name}เอาไปปลูกที่ชายป่า ไปดูทุกเย็นจนต้นนั้นสูงท่วมหัว ฟืนกองนั้นไม่มีใครในบ้านเอาไปเผาเลย
      effects: { stats: { STR: 1 }, taboo: { forest: mend }, flags: [calmed_the_old_wood_that_came] }
    lose:
      text: |
        รากเส้นหนึ่งกวาดขา{name}ลอยขึ้นจากพื้น แล้วโลกก็หมุนหนึ่งรอบ ฟ้า ใบไม้ ดิน

        ตื่นมาในลานบ้านตอนเย็น กองฟืนกองอยู่ที่เดิมเหมือนไม่มีอะไรเกิดขึ้น เว้นแต่ทุกท่อนหันปลายตัดไปทางป่า
      effects: { flags: [thrown_by_the_old_wood] }
    stalemate:
      text: |
        ตะวันตกดิน ไม้เฒ่าหยุดนิ่งกลางลาน รากปักลงดินลึกทุกเส้น กิ่งกางเต็มหลังคา แล้วไม่ขยับอีก

        ตั้งแต่วันนั้นกลางลานบ้าน{name}มีต้นไม้ต้นหนึ่ง ลำต้นเป็นท่อนฟืนต่อกัน ใบเขียวทั้งปี คนในละแวกเรียกบ้านนี้ว่าบ้านต้นฟืน
      effects: { flags: [a_tree_of_firewood_in_the_yard] }
    flee:
      text: |
        {name}วิ่งไปหยุดอยู่ปลายถนน หันกลับไปดู หลังคาบ้านตัวเองยุบลงไปครึ่งหนึ่ง มีกิ่งไม้เขียวโผล่ออกมาจากช่องกระเบื้อง

        ตอนกลับไปเย็นนั้น ไม้เฒ่าไม่อยู่แล้ว เสาบ้านต้นหน้ามีกิ่งเขียวแตกออกมาสามกิ่ง ตัดเท่าไรก็งอกใหม่
      effects: { flags: [fled_the_old_wood_at_home] }
    death:
      text: |
        ลำต้นเอนลงมาช้า กลิ่นยางสดเต็มจมูก ใบไม้สีเขียวอ่อนปิดฟ้าทั้งผืน

        ดินในลานนุ่มกว่าที่{name}เคยรู้ รากเส้นเล็กๆ ที่แตกออกมาตอนเช้าเกาะอยู่ที่ข้อมือ เหมือนจับมือไว้

- id: adult.enc_land_wind_comes
  stage: adult
  weight: 35
  scene: home
  time: night
  when:
    age: [20, 64]
    taboo: { id: wind, defies: true }
  text: |
    คืนนั้นมีคนตายในละแวก บ้านทุกหลังรอบๆ เปิดหน้าต่างไว้คนละบาน แสงตะเกียงลอดออกมาเป็นช่องสี่เหลี่ยมเรียงไปตามถนน บ้าน{name}ปิดทุกบาน ลงกลอนทุกบาน

    ใกล้เที่ยงคืนมีอะไรกระแทกบานไม้ด้านเหนือ ครั้งเดียว หนักเท่าคนเอาไหล่ชน แล้วบานด้านตะวันออก แล้วบานในครัว นกตัวหนึ่ง ตัวโตกว่าห่าน ขนสีเทาพายุ บินวนรอบบ้านชนหน้าต่างทีละบาน ไม่ได้พยายามพัง มันหาบานที่เปิด

    นกตัวนั้นไม่ได้มาหาใคร มันมาหาทางลม บ้านที่ขังนกป่าหรือปิดลมไว้ในคืนที่ควรเปิดซ้ำแล้วซ้ำอีก มีกลิ่นอับของลมที่ไม่มีทางออก
  encounter:
    foe: stray_bird
    beats:
      - text: นกหลงฝูงชนบานหน้าต่างบานที่ใกล้{name}ที่สุด บานไม้โก่งเข้ามา กลอนเหล็กงอ ลมลอดช่องเข้ามาพัดตะเกียงจนเปลวเอนราบ
        answer: guard
        moves:
          - id: bcome_open
            label: ถอดกลอน เปิดบานนั้นออก แล้วยืนนิ่งอยู่ข้างๆ
            kind: guard
            success: "{name}เปิดบานออกแล้วถอยไปยืนพิงผนัง ลมหอบหนึ่งพัดเข้ามาเต็มห้อง กระดาษปลิวว่อน นกหลงฝูงไม่ได้บินเข้ามา มันร่อนผ่านหน้าต่างบานนั้นไปช้าๆ ตาสีเหลืองมองเข้ามาครั้งเดียว"
          - id: bcome_read
            label: ดูว่ามันชนบานไหนก่อนบานไหน
            kind: read
            stat: INT
            success: มันชนตามทิศลม เหนือ ตะวันออก ครัว แล้ววนกลับไปเหนือ ทุกบานที่ชนเป็นบานที่บ้านอื่นเปิดไว้คืนนี้ มันไม่ได้หาทางเข้า มันหาทางให้ลมผ่าน
          - id: bcome_throw
            label: ขว้างจานใส่มันตอนมันโฉบผ่านช่อง
            kind: attack
            tags: [ranged]
            failure: จานลอยออกไปนอกช่อง ลมหอบเดียวพัดกลับเข้ามาแตกกลางห้อง เศษจานกระเด็นบาดหน้าแข้ง ข้างนอกนกหลงฝูงไม่แม้แต่จะเบี่ยงปีก
          - id: bcome_hide
            label: มุดลงใต้โต๊ะ ปิดหูไว้
            kind: flee
      - text: ลมในบ้านแรงขึ้นทุกครั้งที่นกกระพือปีกนอกหน้าต่าง ม่าน กระดาษ ผ้าปูโต๊ะลอยวนกลางห้อง ตะเกียงดับไปหนึ่งดวง ของบนหิ้งเลื่อนออกมาหาขอบ
        moves:
          - id: bcome_hold
            label: กอดของบนหิ้งไว้กับอก ยืนนิ่งให้ลมผ่านไป
            kind: guard
          - id: bcome_name
            label: เอ่ยชื่อคนที่ตายคืนนี้ออกมาดังๆ
            kind: talk
            tags: [name]
          - id: bcome_catch
            label: กระโดดคว้าตัวมันตอนโฉบผ่านช่อง
            kind: quick
          - id: bcome_cellar
            label: หนีลงห้องเก็บของ ลงกลอน
            kind: flee
      - text: นกหลงฝูงลงเกาะขอบหน้าต่างด้านเหนือ ตัวใหญ่จนกินกรอบไปทั้งกรอบ ขนเปียกน้ำค้าง หอบ ปีกครึ่งหนึ่งยังกางค้าง ข้างหลังมัน บ้านทุกหลังในละแวกเปิดหน้าต่างส่องไฟเป็นแถว
        answer: guard
        moves:
          - id: bcome_all_windows
            label: เดินไปเปิดหน้าต่างทุกบานของบ้านจนครบ
            kind: guard
          - id: bcome_step_back
            label: ถอยไปยืนชิดผนังอีกฝั่ง ให้ทางในห้องโล่ง
            kind: read
            stat: WIS
          - id: bcome_shoo
            label: โบกผ้าไล่ให้มันไปเสีย
            kind: attack
            failure: นกหลงฝูงกระพือปีกครั้งเดียวรับผ้า ผ้าปลิวหลุดมือไปพันหน้า{name}เอง ลมหอบเดียวผลักทั้งตัวไปกระแทกตู้ชาม
          - id: bcome_out
            label: ออกไปขออาศัยบ้านคนอื่นจนสว่าง
            kind: flee
    win:
      text: |
        นกหลงฝูงกางปีกเต็มกรอบหน้าต่าง แล้วถีบตัวออกไปทางลม ลมในบ้านตามมันออกไปทางเดียวกัน ม้วนเดียวหมดห้อง กระดาษที่ลอยวนตกลงพื้นพร้อมกันทุกแผ่น

        หน้าหนาวนั้น{name}ไปซื้อนกในกรงจากตลาดมาสองตัว ปล่อยที่ชายถนน แล้วคืนหนึ่งเปิดหน้าต่างทุกบานของบ้านไว้จนสว่าง เช้าขึ้นน้ำในโอ่งในครัวเป็นแผ่นน้ำแข็ง
      effects: { stats: { CHA: 1 }, taboo: { wind: mend }, flags: [calmed_the_stray_bird_that_came] }
    lose:
      text: |
        ลมหอบสุดท้ายยก{name}ขึ้นจากพื้นแล้ววางลงแรงๆ ข้างตู้ชาม ทุกอย่างหมุนอยู่ครู่หนึ่ง แล้วก็นิ่ง

        ตื่นมาตอนสาง หน้าต่างทุกบานในบ้านเปิดอ้า กลอนเหล็กงอทุกตัว ขนนกสีเทาตกอยู่บนหมอนหนึ่งเส้น
      effects: { flags: [the_bird_opened_every_window] }
    stalemate:
      text: |
        ใกล้รุ่ง นกหลงฝูงบินขึ้นจากขอบหน้าต่างไปเฉยๆ ไม่ได้รีบ ลมข้างนอกสงบลงพร้อมกับเสียงปีก

        บานหน้าต่างด้านเหนือปิดไม่สนิทอีกเลย {name}ซ่อมสามครั้ง ลมก็ยังลอดเข้ามาเป็นเส้นทุกคืน
      effects: { flags: [a_window_that_will_not_shut] }
    flee:
      text: |
        {name}นั่งอยู่บ้านคนอื่นจนสว่าง ได้ยินเสียงปีกวนรอบบ้านตัวเองเป็นระยะ สลับกับเสียงบานไม้กระแทก

        กลับไปตอนเช้า ไม่มีบานไหนพัง บานด้านเหนือเปิดอ้าอยู่บานเดียว กลอนหักคาที่
      effects: { flags: [ran_from_the_stray_bird] }

- id: adult.enc_land_night_comes
  stage: adult
  weight: 35
  scene: home
  time: night
  when:
    age: [20, 64]
    taboo: { id: night, defies: true }
  text: |
    {name}เดินกลับบ้านคนเดียวตอนดึก ฟ้าเปิดทั้งผืน ดาวขึ้นหนาจนเห็นเงาตัวเองบนดิน ตลอดทางได้ยินเสียงเหมือนผ้าเปียกลากตามหลังมาห่างๆ หันไปดูทีไรก็ไม่เห็นอะไร มีแต่ที่มืดตรงที่ไม่ควรมีเงา

    พอปิดประตูบ้าน จุดตะเกียงได้ มุมห้องด้านที่แสงไปไม่ถึงก็มืดกว่าที่มุมห้องควรจะมืด ที่มืดตรงนั้นมีขอบ ขาดวิ่นเหมือนผ้าเก่า ตรงกลางมีตาคู่เดียว กะพริบช้าๆ

    มันไม่ได้มาทำร้ายใคร มันเป็นเศษของกลางคืนที่ขาดหลุดออกมาตอนมีคนชี้ดาว นับดาว หรือเงยหน้าในคืนเดือนดับ คนที่ทำอย่างนั้นซ้ำแล้วซ้ำอีก ตัวมีกลิ่นของรอยขาด
  encounter:
    foe: night_scrap
    beats:
      - text: เศษกลางคืนไหลลงจากมุมเพดานมาตามผนัง ทุกที่ที่มันผ่าน เปลวตะเกียงหรี่ลงครึ่งหนึ่ง
        moves:
          - id: ncome_lamp
            label: จุดตะเกียงอีกดวงวางไว้ตรงมุมนั้น
            kind: guard
            tags: [light]
            success: แสงตะเกียงดวงที่สองตกลงตรงมุม เศษกลางคืนหดตัวขึ้นไปเกาะใต้ขื่อ ขอบขาดวิ่นม้วนเข้าเหมือนใบไม้แห้งใกล้เปลวไฟ
          - id: ncome_read
            label: ดูว่ามันขาดออกมาจากตรงไหน
            kind: read
            stat: WIS
            success: ขอบด้านหนึ่งของมันขาดเป็นแนวตรง เหมือนผ้าที่โดนนิ้วจิกแล้วกระชาก รอยแบบที่คนแก่ว่ากลางคืนขาดเวลามีคนชี้หรือนับดาว มันไม่ได้มาหา{name} มันมาหารอยขาดของมันเอง
          - id: ncome_broom
            label: เอาไม้กวาดปัดมันลงจากผนัง
            kind: attack
            tags: [blunt]
            failure: ไม้กวาดผ่านตัวมันไปเหมือนกวาดควัน ปลายไม้กวาดเย็นเฉียบขึ้นมาถึงมือ นิ้วสองนิ้วชาจนกำไม้ไม่อยู่ ไม้กวาดหล่นลงไปกระแทกหน้าแข้ง
          - id: ncome_out
            label: ออกไปนอนนอกบ้านใต้ชายคา
            kind: flee
      - text: เศษกลางคืนไหลลงมาตามพื้น ลอดใต้เตียง โผล่อีกทีที่ปลายเท้าของ{name} เท้าข้างนั้นเย็นและชาขึ้นมาถึงเข่า
        moves:
          - id: ncome_fire
            label: เขี่ยถ่านในเตาให้ลุกขึ้นส่องพื้น
            kind: quick
            tags: [fire]
            success: ถ่านลุกเป็นเปลวสูงคืบหนึ่ง แสงส้มตกเต็มพื้น เศษกลางคืนถอยจากปลายเท้าไปขดอยู่ใต้เตียง ขอบมันหดเข้าทุกครั้งที่เปลวไฟไหว
            failure: ถ่านแดงขึ้นวูบหนึ่งแล้วมอดลงเหมือนโดนลมดูด ในความมืดที่ตามมา ผิวตรงข้อเท้าของ{name}เย็นแล้วเขียวช้ำเป็นวง ไม่มีอะไรกระแทก
          - id: ncome_sit
            label: นั่งลงกับพื้น ก้มหน้า ไม่มองมัน
            kind: guard
            success: "{name}นั่งลงก้มหน้าจนคางชิดอก ความเย็นที่เท้าหยุดอยู่แค่ข้อเท้า ไม่ขึ้นมาอีก เศษกลางคืนวนรอบตัวช้าๆ หนึ่งรอบ แล้วนิ่ง"
            failure: "{name}นั่งลงได้ครู่เดียวก็เผลอเงยหน้าตามเสียงผ้าเปียกที่ลากผ่านหัว ตาคู่เดียวอยู่ห่างแค่คืบ ความเย็นวิ่งขึ้นจากเท้าถึงเอวในอึดใจเดียว ขาทั้งสองข้างไม่มีแรง"
          - id: ncome_talk
            label: พูดกับมันเบาๆ ว่าจะไม่ทำอย่างนั้นอีก
            kind: talk
            success: เสียงของ{name}สั่นแต่ไม่หยุด เศษกลางคืนเลื้อยออกจากปลายเท้า ขยับไปอยู่ห่างหนึ่งช่วงแขน ตาคู่เดียวหรี่ลงครึ่งหนึ่ง
            failure: คำแรกออกจากปากเป็นไอขาว คำที่สองไม่ออกมาเลย เศษกลางคืนพันขึ้นมารอบแข้ง ฝ่าเท้าเย็นจนปวดแสบเหมือนเหยียบน้ำแข็ง
          - id: ncome_door
            label: เปิดประตูวิ่งออกไปที่ลาน
            kind: flee
            success: "{name}กระชากประตูเปิด วิ่งออกไปกลางลาน ข้างนอกมีดาวเต็มฟ้า ไม่มีอะไรตามออกมา"
            failure: กลอนประตูเย็นจนมือติด กระชากสามทีก็ไม่ออก พอหันกลับ เศษกลางคืนพาดอยู่บนไหล่แล้ว ไหล่ข้างนั้นช้ำเขียวเป็นรูปฝ่ามือ
      - text: ใกล้รุ่ง เศษกลางคืนลอยขึ้นไปค้างอยู่กลางห้อง ตาคู่เดียวลืมกว้างอยู่เหนือหัว{name} ห่างแค่ช่วงแขน ขอบขาดวิ่นของมันสั่นเหมือนผ้าที่ตากลม
        answer: guard
        moves:
          - id: ncome_head_down
            label: นั่งก้มหน้าให้ถึงเช้า ไม่นับอะไรเลย
            kind: guard
            success: "{name}ก้มหน้าลงจนคางชิดอก ไม่นับลมหายใจ ไม่นับเสียงไก่ ไม่นับอะไร ความเย็นเหนือหัวค่อยๆ จางลงเหมือนน้ำค้างที่โดนแดด"
          - id: ncome_light_all
            label: จุดไฟทุกดวงที่มีในบ้าน
            kind: quick
            tags: [light, fire]
          - id: ncome_tell
            label: บอกมันว่าข้างนอกยังมีกลางคืนรอมันกลับไปอีกทั้งผืน
            kind: talk
          - id: ncome_run
            label: วิ่งไปหาไฟที่บ้านอื่น
            kind: flee
    win:
      text: |
        ฟ้าทางตะวันออกเริ่มเทา เศษกลางคืนบางลงทีละชั้น ขอบขาดวิ่นจางไปก่อน ตาคู่เดียวจางไปทีหลัง ตอนไก่ตัวแรกขัน มุมห้องมืดเท่ามุมห้องทั่วไป

        คืนเดือนดับถัดมา {name}ออกไปนั่งก้มหน้าอยู่กลางลานจนสว่าง ไม่นับดาว ไม่นับลมหายใจ ไม่นับอะไรเลย ตอนลุกขึ้น เข่าสองข้างแข็งจนต้องเกาะรั้ว
      effects: { stats: { WIS: 1 }, taboo: { night: mend }, flags: [calmed_the_night_scrap_that_came] }
    lose:
      text: |
        ความเย็นขึ้นมาถึงอก {name}ล้มตะแคงลงกับพื้น มองไม่เห็นแม้แต่มือตัวเอง

        ตื่นมาตอนแดดส่องผ่านประตู ผิวตามแขนขามีรอยช้ำเขียวเป็นดวงๆ หลายสิบดวง เรียงกันเหมือนดาวบนฟ้า
      effects: { flags: [bruised_by_the_night_scrap] }
    stalemate:
      text: |
        ไก่ขัน เศษกลางคืนลอยขึ้นไปทางปล่องเตา ขาดออกเป็นริ้วตามเขม่า แล้วหายไป

        แต่ตั้งแต่คืนนั้นมุมห้องด้านนั้นมืดกว่ามุมอื่นเสมอ จุดตะเกียงไว้ตรงนั้นก็ยังมืดกว่า
      effects: { flags: [a_corner_darker_than_it_should_be] }
    flee:
      text: |
        {name}ไปนั่งอยู่หน้าเตาบ้านคนอื่นจนสว่าง เจ้าของบ้านไม่ถามอะไร เติมฟืนให้สองครั้ง

        กลับไปตอนเช้า บ้านเย็นเฉียบเหมือนเปิดประตูทิ้งไว้ทั้งคืน ตะเกียงทั้งสองดวงดับ น้ำมันยังเต็มถ้วย
      effects: { flags: [ran_from_the_night_scrap] }

# ---------- ยืนขวางระหว่างของที่ตื่นกับคนที่ปลุก ----------

- id: adult.enc_land_river_stands
  stage: adult
  weight: 14
  scene: land_river
  time: night
  when:
    age: [22, 62]
    location_tag: ventras
    taboo: { id: river, taught: true }
  text: |
    บริษัทขุดลอกเอาแพปั้นจั่นมาจอดหน้าท่าน้ำหลังตลาดตอนดึก หัวหน้าคนงานบอกว่ากลางวันคนพลุกพล่าน ทำกลางคืนเร็วกว่า เขาไม่ได้มาลอกโคลน ใต้ขั้นบันไดท่านี้มีเหรียญที่คนเรือโยนลงไปทุกต้นปี สะสมมาตั้งแต่ก่อนมีถนนสายนี้ บริษัทซื้อสิทธิ์งมไว้หมดแล้ว

    ถังเหล็กใบแรกขึ้นมาพร้อมโคลนดำกับเหรียญทองแดงเขียวคล้ำครึ่งถัง คนงานเฮกันลั่น ถังใบที่สองขึ้นมาได้ครึ่งทาง แล้วโคลนในถังก็ลุกขึ้นยืน

    คนงานสิบกว่าคนบนแพไม่มีใครรู้ว่าทำไมคนเรือถึงโยนเหรียญพวกนั้นลงไปตั้งแต่แรก {name}รู้ คนเดียวบนท่า
  encounter:
    foe: walking_water
    beats:
      - text: น้ำเดินล้นออกจากถังเหล็ก ไหลลงมาตามโซ่ปั้นจั่น ข้างในตัวมันมีเหรียญหมุนวนเป็นร้อยเหรียญ กระทบกันเสียงกรุ๊งกริ๊งเหมือนกระดิ่งใต้น้ำ คนงานบนแพถอยไปติดราว
        moves:
          - id: rstand_shout
            label: ตะโกนบอกคนงานให้เทเหรียญที่ได้คืนลงน้ำทั้งหมด
            kind: talk
            tags: [noise]
          - id: rstand_read
            label: ดูว่ามันจะไปทางไหน
            kind: read
            stat: WIS
            success: มันไม่ได้ไปหาคน มันไปหาเหรียญ ทางที่มันไหลชี้ตรงไปที่ถังใบแรกที่วางอยู่ท้ายแพ ใครยืนขวางระหว่างมันกับถังใบนั้น คนนั้นเปียก
          - id: rstand_hook
            label: คว้าไม้ขอเกี่ยวเรือแทงเข้าไป
            kind: attack
            tags: [pierce]
            failure: ไม้ขอเกี่ยวจมหายเข้าไปในตัวมันทั้งด้าม น้ำเดินดึงไม้ไว้แล้วกระชากกลับ {name}ปลิวตามไม้ไปกระแทกเสาท่า ไหล่ชาไปทั้งแถบ
          - id: rstand_own_coin
            label: โยนเหรียญของตัวเองลงน้ำไปก่อน แบบที่คนเรือทำทุกต้นปี
            kind: talk
            requires: { taboo: { id: river, keeps: true } }
            success: เหรียญของ{name}ลงน้ำไปโดยไม่มีเสียงจ๋อม น้ำเดินหยุดไหล เอียงตัวมาทางท่าอย่างคนแก่ที่ได้ยินเสียงคนรู้จักเรียก
          - id: rstand_run
            label: ขึ้นถนน ปล่อยให้บริษัทจัดการกันเอง
            kind: flee
      - text: น้ำเดินขึ้นไปบนแพ คนงานสองคนตกน้ำ อีกคนติดอยู่ใต้ถังเหล็กที่ล้มทับขา น้ำในคลองรอบแพกระเพื่อมเป็นวงใหญ่ขึ้นเรื่อยๆ
        moves:
          - id: rstand_pull
            label: ลงไปดึงคนที่ตกน้ำขึ้นท่าทีละคน
            kind: quick
          - id: rstand_warm_step
            label: ลงไปยืนในน้ำตรงขั้นที่อุ่น ยื่นมือให้คนในน้ำจับ
            kind: guard
            requires: { trait: old_river }
            success: น้ำตรงขั้นนั้นอุ่นเหมือนทุกเช้า คนงานสองคนที่ตกน้ำว่ายมาหามือ{name}ได้ทั้งคู่ น้ำเดินไม่ตามมาถึงตรงที่{name}ยืน มันวนอยู่รอบขั้นนั้นเหมือนหมาวนรอบคนที่มันไม่กัด
          - id: rstand_lever
            label: งัดถังเหล็กออกจากขาคนงาน
            kind: guard
          - id: rstand_plead
            label: ตะโกนบอกน้ำเดินว่าคนพวกนี้ไม่รู้
            kind: talk
          - id: rstand_run2
            label: วิ่งหนีขึ้นถนน
            kind: flee
      - text: หัวหน้าคนงานกอดถุงเหรียญใบแรกไว้กับอก ถอยไปจนสุดแพ น้ำเดินไหลตามเขาไปช้าๆ ตัวมันสูงขึ้นจนท่วมปั้นจั่นไปครึ่งหนึ่ง
        answer: talk
        moves:
          - id: rstand_bag
            label: บอกหัวหน้าคนงานให้ส่งถุงมา ถ้าไม่อยากลงไปอยู่ในถุงเอง
            kind: talk
          - id: rstand_grab
            label: แย่งถุงจากมือเขา
            kind: attack
          - id: rstand_between
            label: ไปยืนขวางระหว่างน้ำเดินกับเขา
            kind: guard
          - id: rstand_run3
            label: ปล่อยเขาไว้กับถุงของเขา
            kind: flee
      - text: เหรียญกองอยู่บนแพทั้งถุงทั้งถัง น้ำเดินหยุดอยู่ริมแพ สูงเท่าหลังคาโรงตลาด ของทุกชิ้นในตัวมันหยุดหมุน คลองทั้งสายนิ่ง เหมือนรอ
        answer: guard
        moves:
          - id: rstand_pour_back
            label: เทเหรียญคืนลงน้ำทีละกำ จนหมดทุกเหรียญ
            kind: guard
          - id: rstand_vow
            label: บอกมันเสียงดังว่าท่านี้จะไม่มีใครมางมอีก
            kind: talk
          - id: rstand_tip
            label: ถีบถังทั้งถังลงคลองทีเดียว
            kind: quick
          - id: rstand_run4
            label: ถอยขึ้นถนนไปเงียบๆ
            kind: flee
    win:
      text: |
        น้ำเดินยุบลงตรงขั้นล่างสุดของท่า ช้าๆ เหมือนคนนั่งลง ไหลกลับลงคลองโดยไม่มีวงน้ำ เหรียญทุกเหรียญที่เหลือบนแพจมตามลงไป ไม่มีเหรียญไหนลอยขึ้นมาอีก

        หัวหน้าคนงานนั่งเปียกอยู่บนแพจนสว่าง ทิ้งกระดาษสิทธิ์งมไว้บนขั้นบันได แล้วถอนแพไปตอนสาย คนเรือแก่สองคนเดินมาดูรอยโซ่บนท่า ถามว่าใครอยู่ด้วยเมื่อคืน แล้วจำชื่อ{name}ไว้
      effects: { taboo: { river: keep }, world: { land: -1 }, reputation: { dock_rats: 1 }, flags: [stood_for_the_water_steps] }
    lose:
      text: |
        {name}จำได้ว่าน้ำหนักเท่าเกวียนกดลงมาบนอก จำเสียงเหรียญกระทบกันข้างหู แล้วก็มาไอน้ำคลองออกอยู่บนขั้นบันได คนเรือคนหนึ่งตบหลังให้

        แพปั้นจั่นถอนออกไปแล้ว ถังเหล็กใบแรกหายไปกับแพ
      effects: { flags: [dragged_under_at_the_water_steps] }
    stalemate:
      text: |
        ฟ้าเริ่มสาง น้ำเดินหยุดกลางคลองเหมือนคนนึกได้ว่ามีธุระ แล้วจมลงไปพร้อมเหรียญครึ่งหนึ่ง อีกครึ่งค้างอยู่บนแพ

        บริษัทขุดลอกเก็บเหรียญครึ่งที่เหลือใส่ถุง แล้วไม่กลับมาที่ท่านี้อีก คนเรือเล่ากันว่าคืนต่อมาเขาไปงมที่ท่าอื่น
      effects: { flags: [the_dredgers_kept_half] }
    flee:
      text: |
        {name}ไปหยุดอยู่ปากตรอก ได้ยินเสียงโซ่ปั้นจั่นขาดดังเป๊าะ แล้วเสียงคนร้องสลับกับเสียงน้ำ

        เช้ามาแพปั้นจั่นคว่ำอยู่กลางคลอง คนงานรอดทุกคน เหรียญไม่เหลือบนแพสักเหรียญ
      effects: { flags: [left_the_dredgers_to_the_water] }
    death:
      text: |
        น้ำปิดเข้ามาเหนือหัว เสียงเหรียญเป็นร้อยหมุนรอบตัว ดังเหมือนกระดิ่งที่ใครแขวนไว้ใต้น้ำ

        เหรียญที่เคยโยนลงมาตั้งแต่ก่อนมีถนนสายนี้ลอยผ่านหน้า{name}ไปทีละเหรียญ ไม่มีเหรียญไหนเร่ง

- id: adult.enc_land_field_stands
  stage: adult
  weight: 14
  scene: land_field
  time: day
  when:
    age: [22, 62]
    location_tag: arvel_village
    taboo: { id: field, taught: true }
  text: |
    กองสำรวจทางรถไฟตั้งเต็นท์อยู่ท้ายหมู่บ้านมาสามสัปดาห์ ปักหลักไม้ทาสีแดงเป็นแนวตรงข้ามทุ่ง แนวหลักนั้นผ่านบ่อน้ำเก่าที่ไม่มีใครใช้มาหลายรุ่น บ่อที่ทุกบ้านเคยตักกินก่อนจะมีบ่อในลานของตัวเอง

    เช้านี้คนงานเข็นดินมาถมบ่อทีละรถ ไม่มีใครวางรวงข้าวบนปากบ่อ ไม่มีใครบอกดินก่อนถม คนงานไม่รู้ หัวหน้ากองสำรวจไม่รู้ ในบรรดาคนที่ยืนอยู่ริมบ่อ {name}รู้อยู่คนเดียว

    รถดินคันที่เก้าเทลงไป ดินในบ่อไม่ยุบลงเหมือนแปดคันก่อน ดินดันกลับขึ้นมา ปากบ่อแยกออก ไหล่ขนฟูสีฟางโผล่ขึ้นมาก่อน แล้วหัวลูกวัวที่ตายังปิดอยู่ครึ่งหนึ่ง
  encounter:
    foe: earth_calf
    morale: 2
    beats:
      - text: ลูกวัวใต้ทุ่งปีนขึ้นจากบ่อ ดินร่วงจากหลังเป็นแผ่น มันหันหัวไปตามแนวหลักไม้สีแดง แล้วเริ่มเดิน หลักที่มันเดินผ่านล้มราบทีละหลัก รถเข็นดินคว่ำ คนงานวิ่งกระจาย
        moves:
          - id: fstand_stakes
            label: ดูว่าแนวหลักพามันไปไหน
            kind: read
            stat: INT
            success: แนวหลักตรงไปจนสุดทุ่ง ข้ามเนินที่ทุกรอยไถอ้อม แล้วไปจบที่เต็นท์ของกองสำรวจ ลูกวัวใต้ทุ่งเดินตามแนวที่คนปักไว้ ไม่ใช่แนวของมันเอง
          - id: fstand_lead_round
            label: เดินนำหน้ามัน ไปตามรอยไถอ้อมเนินที่ตัวเองไถมาทุกปี
            kind: read
            stat: WIS
            requires: { taboo: { id: field, keeps: true } }
            success: เท้าของ{name}รู้ทางเองโดยไม่ต้องมอง ลูกวัวใต้ทุ่งเบนตามมาหนึ่งร่อง แล้วอีกหนึ่ง จมูกชื้นดมรอยเท้าทุกรอย หลักไม้สีแดงที่เหลือยืนอยู่นอกทางของมันแล้ว
          - id: fstand_shove
            label: เอาไหล่ดันสีข้างมันให้เบนจากแนว
            kind: guard
            failure: เหมือนเอาไหล่ดันกองฟางที่หนักเท่าบ้าน ลูกวัวใต้ทุ่งเดินต่อไปโดยไม่รู้ว่าโดนดัน {name}ไถลไปตามสีข้างมันแล้วล้มลงในร่องดินที่เพิ่งถม
          - id: fstand_shout
            label: ตะโกนให้คนงานหลบออกจากแนวหลัก
            kind: talk
            tags: [noise]
          - id: fstand_run
            label: ปล่อยให้กองสำรวจจัดการกันเอง
            kind: flee
      - text: ลูกวัวใต้ทุ่งเดินมาถึงเนิน เนินที่ทุกรอยไถในทุ่งอ้อม หลักไม้สีแดงสามหลักปักอยู่บนยอด มันหยุด ก้มดมหลัก แล้วดินทั้งเนินสะเทือนเบาๆ ใต้เท้า อะไรบางอย่างที่ใหญ่กว่ามันมากพลิกตัวอยู่ข้างใต้
        answer: read
        moves:
          - id: fstand_pull_stakes
            label: วิ่งขึ้นไปถอนหลักไม้ทั้งสามออกจากยอดเนิน
            kind: quick
          - id: fstand_walk_round
            label: เดินอ้อมเนินนำหน้ามัน ตามรอยที่ทุกคันไถเคยเดิน
            kind: read
            stat: WIS
          - id: fstand_leaning_sheaf
            label: ยืนให้มันดม ให้มันได้กลิ่นรวงที่เคยโน้มมาหา
            kind: talk
            requires: { trait: old_field }
            success: ลูกวัวใต้ทุ่งยื่นจมูกชื้นมาดมหน้าอก{name} หายใจออกยาวจนเสื้อปลิว แล้วถอยหลังไปสองก้าวอย่างวัวที่จำมือคนเลี้ยงได้ ดินบนเนินหยุดสะเทือน
          - id: fstand_run2
            label: หนีกลับบ้าน
            kind: flee
      - text: หัวหน้ากองสำรวจวิ่งมาพร้อมคนงานหกคน ถือเชือกกับไม้คาน จะคล้องคอมันลากกลับลงบ่อ ลูกวัวใต้ทุ่งหันมา หายใจออกแรงจนฝุ่นในทุ่งขึ้นเป็นม่าน
        moves:
          - id: fstand_stop_them
            label: ยืนขวางคนงาน บอกให้วางเชือกลง
            kind: talk
          - id: fstand_tell_the_soil
            label: เดินไปที่ปากบ่อ วางรวงข้าว แล้วบอกดินเสียงดังว่าบ่อนี้ไม่ถมแล้ว
            kind: read
            stat: WIS
            success: "{name}เด็ดรวงข้าวจากแปลงข้างทางมาวางบนปากบ่อ บอกดินอย่างที่คนรุ่นก่อนบอก ใครถมอะไร ถมเพราะอะไร แล้วบอกว่าไม่ถมแล้ว ลูกวัวใต้ทุ่งหันหัวมาทางบ่อ หูสองข้างกระดิก"
          - id: fstand_rope
            label: ช่วยคนงานคล้องเชือก
            kind: attack
            failure: เชือกคล้องคอมันได้รอบหนึ่ง ลูกวัวใต้ทุ่งสะบัดหัวครั้งเดียว คนงานหกคนกับ{name}ปลิวไปคนละทาง เชือกขาดเหลือแต่ท่อนในมือ
          - id: fstand_run3
            label: ปล่อยให้คนงานกับลูกวัวว่ากันเอง
            kind: flee
    win:
      text: |
        ลูกวัวใต้ทุ่งเดินกลับไปที่บ่อ ช้าๆ ไม่แวะ พับขาลงนอนในปากบ่อที่ถมไปครึ่งหนึ่ง ขดตัวจนพอดี แล้วดินที่คนงานเข็นมาทั้งเช้าก็ไหลกลับมาคลุมหลังมันเอง ตอนเย็นตรงที่เคยเป็นบ่อมีเนินเตี้ยๆ หนึ่งเนิน

        หัวหน้ากองสำรวจย้ายแนวหลักไปอ้อมทางตะวันออก แนวใหม่โค้งเป็นวงกว้าง เขาบ่นว่าต้องเขียนแผนที่ใหม่ทั้งแผ่น ก่อนไปเขาถามชื่อ{name} จดไว้มุมแผนที่ ใต้คำว่าถามคนนี้ก่อนขุด
      effects: { taboo: { field: keep }, world: { land: -1 }, stats: { WIS: 1 }, flags: [stood_for_the_old_well] }
    lose:
      text: |
        ลูกวัวใต้ทุ่งเดินผ่าน{name}ไปเหมือนเดินผ่านกอหญ้า {name}นอนอยู่ในร่องดิน มองฟ้าที่ฝุ่นลอยเป็นม่าน ลุกไม่ไหว

        เย็นนั้นคนงานกลับมาปักหลักแนวเดิม บ่อเก่าถมเต็มแล้ว ไม่มีใครรู้ว่าลูกวัวไปไหน รั้วของหมู่บ้านล้มไปทางเดียวกันหมดทั้งแนว
      effects: { flags: [the_survey_line_went_through] }
    stalemate:
      text: |
        ตะวันตกดิน ลูกวัวใต้ทุ่งพับขาลงนอนกลางแนวหลัก ห่างจากบ่อร้อยก้าว แล้วหลับ ดินคลุมตัวมันทีละชั้นจนมืด

        เช้าขึ้นกลางแนวหลักมีเนินใหม่หนึ่งเนิน กองสำรวจปักหลักข้ามไปไม่ได้ ปักอ้อมก็ไม่ลง หัวหน้ากองเขียนจดหมายไปถามเมืองว่าจะเอาอย่างไร
      effects: { flags: [a_new_mound_on_the_survey_line] }
    flee:
      text: |
        {name}กลับบ้านปิดประตู ได้ยินเสียงไม้หลักหักเป็นระยะทั้งบ่าย กับเสียงคนตะโกนสั่งกันไม่เป็นภาษา

        สองวันต่อมากองสำรวจย้ายเต็นท์ไปตั้งที่อื่น บ่อเก่าถมไปครึ่งเดียว ปากบ่อแยกเป็นร่องยาว
      effects: { flags: [left_the_survey_crew_to_the_calf] }

- id: adult.enc_land_stone_stands
  stage: adult
  weight: 14
  scene: mine
  time: night
  when:
    age: [22, 62]
    location_tag: hordun
    taboo: { id: stone, taught: true }
  text: |
    เดือนที่หนาวที่สุดมาพร้อมใบประกาศของบริษัทเหมือง ใครลงกะดึกเดือนนี้ได้ค่าแรงสามเท่า แร่ราคาดี เตาหลอมข้างล่างรอไม่ได้ คนหนุ่มต่อแถวลงกรงชักตั้งแต่หัวค่ำ หลายคนมาจากถิ่นอื่น ไม่เคยได้ยินว่าเดือนนี้ห้ามขุด {name}ไม่ลง ยืนผิงไฟอยู่ที่ปากปล่อง

    เลยเที่ยงคืนไปได้ไม่นาน กระดิ่งสัญญาณจากข้างล่างดังผิดจังหวะ เด็กถือตะเกียงคนหนึ่งปีนบันไดฉุกเฉินขึ้นมาหอบ บอกว่าหน้าหินลุกขึ้นยืน คนกะดึกเจ็ดคนติดอยู่ปลายอุโมงค์

    คนที่เหลือบนปากปล่องเป็นคนของบริษัทกับเด็กคนนั้น ไม่มีใครรู้ว่าหินชนิดนั้นฟังอะไร {name}คว้าตะเกียงลงไป
  encounter:
    foe: waking_stone
    morale: 2
    beats:
      - text: หินตื่นยืนเต็มอุโมงค์ หัวครูดเพดาน ข้างหลังมันคนกะดึกเจ็ดคนเบียดกันอยู่ปลายทางตัน ตะเกียงในมือสั่น มันชูกำปั้นขึ้นช้าๆ
        answer: quick
        moves:
          - id: sstand_dodge
            label: ชิงลอดใต้แขนมันไปอยู่ฝั่งเดียวกับคนกะดึก
            kind: quick
          - id: sstand_knock
            label: เคาะผนังอุโมงค์สามครั้งด้วยข้อนิ้ว ก่อนทำอย่างอื่น
            kind: read
            stat: WIS
            success: ก๊อก ก๊อก ก๊อก หินตื่นหยุดกำปั้นค้าง หัวไม่มีหน้าหันมาหาเสียงเคาะ คนกะดึกเจ็ดคนเงียบกริบ มีคนหนึ่งยกข้อนิ้วขึ้นเคาะผนังตามบ้าง เคาะผิดจังหวะ
          - id: sstand_pick
            label: เอาอีเต้อจามที่ข้อเข่ามัน
            kind: attack
            tags: [pierce]
            failure: ปลายอีเต้อกระดอนออกจากเข่าหินจนด้ามหักคามือ หินตื่นกระทืบเท้าข้างนั้นลง พื้นอุโมงค์ยุบเป็นแอ่ง {name}ล้มเข่ากระแทกก้อนหินที่เพิ่งร่วงลงมา
          - id: sstand_answer
            label: เคาะตามจังหวะที่หน้าหินเคยเคาะตอบ
            kind: talk
            requires: { trait: old_stone }
            success: ก๊อก ก๊อก ก๊อก ช้าเท่าที่หินเคยเคาะตอบทุกเช้า หินตื่นค้างกำปั้นไว้กลางอากาศ แล้วเสียงเคาะสามครั้งก็ดังตอบมาจากในอกของมันเอง
          - id: sstand_back
            label: วิ่งกลับขึ้นกรงชัก
            kind: flee
      - text: หินตื่นหันไปทางคนกะดึก พื้นอุโมงค์ใต้เท้ามันร้าวเป็นแฉก ค้ำยันไม้สองต้นหักกลาง เพดานเหนือหัวคนงานพ่นฝุ่นลงมาเป็นสาย
        moves:
          - id: sstand_lead_out
            label: พาคนงานลอดออกมาทีละคนตอนมันหันหลัง
            kind: quick
          - id: sstand_prop
            label: ยกค้ำยันต้นใหม่เข้าที่แทนต้นที่หัก
            kind: guard
          - id: sstand_tools_down
            label: บอกคนงานให้วางเครื่องมือทุกชิ้นลงกับพื้น แล้วถอยออกมามือเปล่า
            kind: talk
          - id: sstand_kept_knock
            label: บอกมันว่าตัวเองเคาะทุกหน้าหินมาตลอดชีวิต แล้วจะพาคนพวกนี้ขึ้นไปเดี๋ยวนี้
            kind: talk
            requires: { taboo: { id: stone, keeps: true } }
            success: หินตื่นหยุดก้าว หันหัวไม่มีหน้ามาทาง{name} ฝุ่นที่พ่นลงมาจากเพดานซาลงเป็นเส้นบาง คนงานคนแรกลอดผ่านขาหินไปได้โดยไม่มีอะไรขยับ
          - id: sstand_back2
            label: ปล่อยคนงานไว้ วิ่งกลับไปที่กรงชัก
            kind: flee
      - text: หินตื่นยืนค้ำอยู่ตรงทางแยกไปกรงชัก กำปั้นชูขึ้นอีกครั้ง ช้ากว่าเดิม ข้างล่างลึกลงไปมีเสียงหายใจช้าๆ ดังขึ้นมาตามปล่อง ใหญ่กว่าเสียงของมันหลายเท่า
        answer: quick
        moves:
          - id: sstand_slip
            label: ชิงจังหวะตอนกำปั้นชู พาคนสุดท้ายลอดไปถึงกรงชัก
            kind: quick
          - id: sstand_promise
            label: บอกมันว่าเดือนนี้จะไม่มีใครลงมาอีก
            kind: talk
          - id: sstand_leave_tools
            label: เอาเครื่องมือทุกชิ้นที่คนงานทิ้งไว้มาวางเรียงที่เท้ามัน
            kind: guard
          - id: sstand_back3
            label: วิ่งขึ้นกรงชัก ดึงเชือกส่งสัญญาณ
            kind: flee
    win:
      text: |
        หินตื่นนั่งลงพิงผนังอุโมงค์ ก้อนหินเลื่อนกลับเข้าหาหน้าหินทีละก้อน จนเหลือแค่หน้าหินเบี้ยวๆ หน้าหนึ่งกับกองเครื่องมือที่เท้า เสียงหายใจช้าๆ จากข้างล่างเงียบลงตอนกรงชักเที่ยวสุดท้ายขึ้นถึงปากปล่อง

        เช้านั้นเจ็ดคนขึ้นมาครบ หัวหน้ากะของบริษัทฉีกใบประกาศทิ้งเองกับมือ สัปดาห์ต่อมาผู้อาวุโสของสภาคนแคระส่งคนมาถามชื่อคนที่ลงไปคืนนั้น
      effects: { taboo: { stone: keep }, world: { land: -1 }, reputation: { dwarf_council: 1 }, flags: [stood_for_the_coldest_month] }
    lose:
      text: |
        กำปั้นหินลงมาข้างตัว แรงสะเทือนส่ง{name}ไปกระแทกผนังอุโมงค์ ตะเกียงดับ เสียงคนตะโกนอยู่ไกลๆ แล้วก็ไม่ได้ยินอะไร

        ตื่นมาบนเปลที่ปากปล่อง คนกะดึกขึ้นมาได้ห้าคน อีกสองคนยังอยู่ข้างล่าง บริษัทปิดชั้นนั้นจนพ้นเดือน
      effects: { flags: [struck_down_in_the_coldest_month] }
    stalemate:
      text: |
        หินตื่นนิ่งค้างอยู่ตรงทางแยก กำปั้นยกค้างอยู่อย่างนั้น ไม่ลงมา ไม่ขยับ คนงานคลานลอดใต้แขนมันออกมาได้ทีละคนจนครบ

        ทางแยกนั้นปิดตาย บริษัทต้องเจาะอุโมงค์ใหม่อ้อมไปอีกทาง กว่าจะเสร็จเดือนที่หนาวที่สุดก็ผ่านไปแล้ว
      effects: { flags: [a_stone_fist_at_the_junction] }
    flee:
      text: |
        {name}ขึ้นมาถึงปากปล่องคนเดียว ดึงเชือกส่งสัญญาณจนมือพอง กรงชักลงไปเปล่าสองเที่ยว เที่ยวที่สามขึ้นมาพร้อมคนสามคน

        ที่เหลือขึ้นมาตอนสาย ทางบันไดฉุกเฉิน ไม่มีใครพูดถึงคนที่ขึ้นมาก่อน
      effects: { flags: [climbed_out_before_the_shift] }
    death:
      text: |
        กำปั้นลงมาช้า ช้าจน{name}เห็นสายแร่สีเงินที่พาดผ่านข้อนิ้วหิน

        ข้างล่างลึกลงไป เสียงหายใจช้าๆ หยุดไปครั้งหนึ่ง เหมือนคนที่ได้ยินอะไรในความฝันแล้วพลิกตัว

- id: adult.enc_land_forest_stands
  stage: adult
  weight: 14
  time: day
  when:
    age: [22, 62]
    location_tag: ileth
    taboo: { id: forest, taught: true }
  text: |
    คนของอู่เรือเหาะมาตั้งค่ายที่ชายป่าด้านใต้ เขาบอกทุกคนที่ถามว่าไม่ได้มาโค่นสักต้น เขาแค่ควั่นเปลือกรอบโคนต้นสนใหญ่เป็นวงกว้างหนึ่งคืบ ให้ต้นตายยืนต้นแห้งไปเองหนึ่งฤดู ไม้ที่ตายยืนต้นเบา ไม่บิด อู่เรือเหาะจ่ายราคาสองเท่า

    ต้นที่สามสิบเอ็ดเป็นต้นใหญ่ที่สุดในแนว คนงานควั่นเปลือกไปได้ครึ่งวง ยางไหลลงมาตามร่องเป็นทาง แล้วรากของต้นนั้นก็ถอนขึ้นจากดิน

    คนงานยี่สิบคนเป็นคนเมือง ไม่มีใครเคยได้ยินว่าป่าไม่ได้นับว่าไม้ตายเพราะขวานหรือเพราะมีดควั่น คนเดียวที่ยืนอยู่ตรงนั้นแล้วรู้ คือ{name}
  encounter:
    foe: old_wood
    morale: 2
    beats:
      - text: ไม้เฒ่าถอนรากทีละเส้น รอบลำต้นมีแผลควั่นเปิดเป็นวงขาวเหมือนเข็มขัด มันก้าวรากแรกไปทางกระโจมคนงาน
        moves:
          - id: wstand_torch
            label: คว้าคบไฟจากกองไฟค่ายมาถือกั้นทางไว้ ไม่จ่อเข้าไป
            kind: guard
            tags: [fire]
          - id: wstand_read
            label: ดูว่ามันจะไปหาอะไร
            kind: read
            stat: WIS
            success: รากทุกเส้นชี้ไปทางกองเปลือกไม้ที่ลอกออกมาจากสามสิบต้น เปลือกกองสูงเท่าคน มันไม่ได้ไปหาคน มันไปหาเปลือกของพี่น้องมัน
          - id: wstand_crossbow
            label: ร้องให้คนงานยิงหน้าไม้ใส่
            kind: attack
            tags: [ranged]
            failure: ลูกหน้าไม้สิบดอกปักลำต้นไม้เฒ่าเหมือนปักต้นไม้ มันไม่แม้แต่ชะงัก กิ่งใหญ่กวาดลงมาตามทางลูกหน้าไม้ {name}ยกแขนรับ ได้ยินเสียงลั่นที่ไม่ใช่เสียงกิ่ง
          - id: wstand_bare_hands
            label: ถอดมีดเหล็กดำออกจากเอว วางกับดิน แล้วเดินเข้าไปหามันมือเปล่า
            kind: talk
            requires: { trait: old_forest }
            success: ไม้เฒ่าชะงักรากไว้กลางอากาศ ใบตรงปลายกิ่งที่ต่ำที่สุดลู่ลงมาแตะผม{name} แบบเดียวกับกวางที่ตาน้ำก้มลงกินน้ำต่อเมื่อเห็นมือเปล่า
          - id: wstand_run
            label: ถอยกลับไปที่หมู่บ้าน
            kind: flee
      - text: คนงานสามคนติดอยู่ในกระโจมที่รากไม้เฒ่าพันรอบไว้ ผ้ากระโจมตึงจนเสาไม้ลั่น ต้นที่โดนควั่นอีกสามสิบต้นในแนวสั่นใบพร้อมกัน ลมไม่มีสักแผ่ว
        moves:
          - id: wstand_cut_free
            label: กรีดผ้ากระโจมปล่อยคนงานออกมา
            kind: quick
          - id: wstand_bark_back
            label: เอาเปลือกที่ลอกออกมาพันกลับรอบแผลของมัน
            kind: guard
          - id: wstand_kept
            label: บอกมันว่าตัวเองไม่เคยโค่นไม้เป็นสักต้น แล้วขอเวลาให้คนพวกนี้ออกจากป่า
            kind: talk
            requires: { taboo: { id: forest, keeps: true } }
            success: รากที่พันกระโจมคลายออกทีละเส้น ช้าเหมือนมือคนแก่คลายกำ คนงานสามคนคลานออกมาทางชายกระโจม ไม่มีใครหันหลังกลับไปดู
          - id: wstand_shout
            label: ตะโกนให้คนงานทิ้งมีดควั่นทุกเล่มลงกับดิน
            kind: talk
            tags: [noise]
          - id: wstand_run2
            label: หนีไปตามทางเกวียน
            kind: flee
      - text: ไม้เฒ่าหยุดอยู่กลางค่าย เอนลำต้นลงมาหา{name} ยางไหลไม่หยุดตรงแผลรอบโคน กิ่งเล็กกิ่งหนึ่งหักร่วงลงมาตรงหน้าเท้า
        moves:
          - id: wstand_plant
            label: ขุดหลุมกลางค่ายด้วยมือ ปักกิ่งนั้นลงไป
            kind: guard
          - id: wstand_vow
            label: บอกมันว่าค่ายนี้จะถอนออกไปภายในพรุ่งนี้
            kind: talk
          - id: wstand_roll
            label: กลิ้งหลบลำต้นที่เอนลงมา
            kind: quick
          - id: wstand_run3
            label: วิ่งออกจากค่าย
            kind: flee
    win:
      text: |
        ไม้เฒ่าถอยกลับไปที่หลุมของตัวเองทีละราก ปักรากลงดินตรงที่เคยยืน ลำต้นตั้งตรง แผลควั่นครึ่งวงปิดด้วยยางสีอำพันหนาเท่านิ้ว ต้นอื่นในแนวหยุดสั่นพร้อมกัน

        ค่ายของอู่เรือเหาะถอนออกไปตอนสาย หัวหน้าคนงานบอกว่าไม้ที่ควั่นไปแล้วสามสิบต้นจะกลับมาเอาปีหน้า {name}เอาเปลือกจากกองนั้นไปพันรอบแผลทีละต้น รู้อยู่ว่าไม่ช่วยอะไร ปีต่อมามีสองต้นแตกใบ
      effects: { taboo: { forest: keep }, world: { land: -1 }, stats: { WIS: 1 }, flags: [stood_for_the_ringed_pines] }
    lose:
      text: |
        รากเส้นหนึ่งเกี่ยวข้อเท้า{name}แล้วกระชาก โลกพลิกหนึ่งรอบ ฟ้า ใบสน ดิน

        ตื่นมาในกระโจมพยาบาลของค่าย คนงานเก็บของกันวุ่น ไม้เฒ่ากลับไปยืนที่เดิมแล้ว ครึ่งวงที่ควั่นไว้ยังเปิดอ้า
      effects: { flags: [thrown_at_the_ringing_camp] }
    stalemate:
      text: |
        ตะวันตกดิน ไม้เฒ่ายืนนิ่งอยู่กลางค่าย รากปักลงดินลึก กิ่งกางคลุมกระโจมทั้งหมด แล้วไม่ขยับอีก

        คนของอู่เรือเหาะย้ายค่ายไปตั้งห่างออกไปครึ่งวันเดิน ต้นสนใหญ่ต้นหนึ่งยืนอยู่กลางวงกระโจมร้าง ไม่มีใครกล้าแตะ
      effects: { flags: [a_pine_in_the_empty_camp] }
    flee:
      text: |
        {name}ไปหยุดหอบอยู่ชายหมู่บ้าน ได้ยินเสียงไม้ลั่นกับเสียงคนร้องดังมาจากชายป่าจนบ่าย

        ค่ำนั้นคนงานเดินผ่านหมู่บ้านกลับเมือง สองคนต้องหามมา ไม่มีใครแวะถามทาง
      effects: { flags: [left_the_ringing_camp] }
    death:
      text: |
        ลำต้นเอนลงมาช้า กลิ่นยางสนสดเต็มจมูก ร่มเงาของมันเย็นกว่าที่คิด

        ใบสนร่วงลงมาคลุม{name}ทีละใบ เหมือนป่ากำลังห่มผ้าให้

- id: adult.enc_land_fire_stands
  stage: adult
  weight: 14
  time: day
  when:
    age: [22, 62]
    taboo: { id: fire, taught: true }
  text: |
    ถนนร้านขนมปังที่{name}เดินผ่านทุกเช้าตื่นก่อนทุกถนน เตาเรียงกันสองฟาก กลิ่นแป้งไหม้ก้นลอยออกมาตั้งแต่ฟ้ายังดำ เด็กฝึกงานร้านหัวถนนไปยืมไฟจากเตาถนนถัดไปตั้งแต่ดึก แล้วไม่ได้เอากลับไปคืน เจ้าของร้านบอกเด็กว่าไฟยืมไม่ต้องเสียค่าถ่าน เก็บไว้ใช้ทั้งวันก็ได้

    แดดแรกส่องถึงหัวถนน ไฟยืมในเตาร้านหัวถนนยังลุกอยู่ คนทั้งถนนไม่มีใครเห็นว่าเป็นเรื่องอะไร ไฟก็คือไฟ {name}เห็น คนเดียว

    แล้วเปลวในเตานั้นก็กระโดดออกมา
  encounter:
    foe: fire_cub
    beats:
      - text: ลูกเสือไฟกระโดดออกจากปากเตา ลงบนถาดขนมปังที่วางพักไว้หน้าร้าน ขนมปังไหม้ทีละก้อนตามรอยเท้ามัน มันวิ่งไปตามถนน เตาร้านอื่นลุกพรึบขึ้นทีละเตาตามทางที่มันผ่าน
        moves:
          - id: cstand_bait
            label: โยนเนื้อเค็มจากแผงหน้าร้านให้มัน
            kind: quick
            tags: [bait]
          - id: cstand_read
            label: ดูว่ามันวิ่งไปทางไหน
            kind: read
            stat: INT
            success: มันวิ่งไปทางถนนถัดไป ทางที่ไฟยืมมา มันกำลังกลับบ้าน ช้าไปหนึ่งเช้า และกินทุกอย่างที่ขวางระหว่างทาง
          - id: cstand_peel
            label: เอาพลั่วอบขนมปังตบมันลงกับพื้น
            kind: attack
            tags: [blunt]
            failure: พลั่วไม้ติดไฟตั้งแต่ใบถึงด้าม ลูกเสือไฟงับปลายพลั่วไว้เล่นแล้วกระชาก {name}เสียหลักล้มทับถาดขนมปังร้อน
          - id: cstand_keeper
            label: ทักมันด้วยเสียงต่ำๆ แบบที่คนเฝ้าเตาทักไฟตอนเช้า
            kind: talk
            requires: { taboo: { id: fire, keeps: true } }
            success: ลูกเสือไฟหยุดวิ่ง หันหน้ามาหา{name} หูตั้งขึ้นสองข้างเหมือนแมวที่ได้ยินเสียงคนที่ให้ข้าวทุกเช้า แล้วนั่งลงกลางถนน หางพันเท้า
          - id: cstand_run
            label: ถอยไปยืนพ้นถนน
            kind: flee
      - text: ลูกเสือไฟปีนขึ้นกองฟืนหน้าร้านที่สี่ กองสูงเท่าหลังคา คนอบขนมปังทั้งถนนคว้าถังน้ำจากรางรินมาเรียงแถว จะสาดพร้อมกัน
        answer: talk
        moves:
          - id: cstand_stop_water
            label: ยืนขวางถังน้ำ บอกทุกคนว่าห้ามสาด
            kind: talk
          - id: cstand_pot
            label: เอาหม้อดินไปรองใต้กองฟืน ให้มันลงมาอยู่ในหม้อ
            kind: guard
          - id: cstand_firehand
            label: ยื่นแขนเข้าไปให้มันเดินขึ้นมา
            kind: guard
            requires: { trait: old_fire }
            success: ไฟไม่ลวกแขน{name} ลูกเสือไฟเดินลงจากกองฟืนมาตามแขนอย่างแมวเดินบนราวรั้ว ขนเปลวไฟอุ่นเท่าผ้าห่มที่เพิ่งตากแดด
          - id: cstand_pull_wood
            label: ดึงฟืนออกจากกอง ไม่ให้มันมีที่ปีน
            kind: quick
          - id: cstand_run2
            label: ปล่อยให้คนอบขนมปังสาดน้ำ
            kind: flee
      - text: ลูกเสือไฟลงมาหมอบอยู่กลางถนน ระหว่างร้านหัวถนนกับทางไปถนนถัดไป หางตวัด เปลวที่ขนหรี่ลงเป็นสีส้มหม่น ฟ้าสว่างเต็มที่แล้ว
        moves:
          - id: cstand_return
            label: คีบไฟที่เหลือในเตาร้านหัวถนนใส่หม้อ เดินเอาไปคืนเตาถนนถัดไป ให้มันเดินตาม
            kind: guard
          - id: cstand_apprentice
            label: ลากเด็กฝึกงานมาขอโทษเตาที่ไฟมาจาก
            kind: talk
          - id: cstand_bait2
            label: ล่อมันด้วยขนมปังไส้เนยก้อนที่ร้อนที่สุด
            kind: quick
            tags: [bait]
          - id: cstand_run3
            label: หนีก่อนไฟจะลามมาถึงตัว
            kind: flee
    win:
      text: |
        ลูกเสือไฟเดินตามหม้อไฟไปถึงถนนถัดไปเหมือนแมวเดินตามคนถือปลา กระโดดลงเตาที่ไฟมาจาก หมุนตัวสามรอบแล้วนั่งลงบนถ่าน เตานั้นลุกพรึบทีเดียวแล้วเบาลงเป็นไฟอบขนมปังธรรมดา

        เจ้าของร้านหัวถนนจ่ายค่าถ่านคืนให้ถนนถัดไปเองโดยไม่มีใครขอ ตั้งแต่เช้านั้นคนอบขนมปังทั้งถนนทัก{name}ก่อนทุกครั้งที่เดินผ่าน บางเช้ามีขนมปังไหม้ก้นห่อกระดาษวางรออยู่หนึ่งก้อน
      effects: { taboo: { fire: keep }, world: { land: -1 }, stats: { CHA: 1 }, flags: [stood_for_the_borrowed_fire] }
    lose:
      text: |
        {name}ตบไฟที่ชายเสื้อจนมือพอง ล้มลงข้างรางริน ควันขาวคลุมไปทั้งถนน

        ตื่นมานั่งพิงผนังร้านหัวถนน มีคนเอาผ้าเปียกพันมือให้ ข้างหลังได้ยินเสียงน้ำสาดลงกองฟืน เตาครึ่งถนนดับ คนอบขนมปังบ่นกันว่าวันนี้ทั้งวันจุดไม่ติด
      effects: { flags: [burned_on_the_bakers_street] }
    stalemate:
      text: |
        สายแล้ว ลูกเสือไฟหาว มุดเข้าเตาร้านหัวถนนไปนอนขดอยู่หลังถ่าน ไม่ออกมาอีก

        ตั้งแต่วันนั้นเตาร้านหัวถนนร้อนเกินไปทุกวัน ขนมปังไหม้ก้นทุกถาด เจ้าของร้านเปลี่ยนคนอบสามคนแล้วก็ยังไหม้
      effects: { flags: [a_cub_in_the_corner_oven] }
    flee:
      text: |
        {name}ไปยืนอยู่หัวถนนอีกฝั่ง ได้ยินเสียงน้ำสาดพร้อมกันเป็นแถว เสียงฉ่ายาว แล้วควันขาวลอยขึ้นเหนือหลังคาทั้งถนน

        เย็นนั้นเตาในถนนร้านขนมปังดับครึ่งหนึ่ง คืนต่อมาหลายบ้านในละแวกเล่าว่าเตาที่ดับไปแล้วลุกขึ้นมาเองกลางดึก
      effects: { flags: [left_the_bakers_to_their_water] }
