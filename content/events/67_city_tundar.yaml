# ชุด ม เมือง: ทุนดาร์ (tundar ถิ่น hordun) แปดเรื่องตามแบบ "แปดเรื่องของหนึ่งเมือง"
# ย่าน: lower_gate ลานประตูล่าง (คนนอกลงที่นี่ และอยู่ได้ที่นี่ที่เดียว) · forge_levels ชั้นโรงหลอม
#       clan_levels ถนนวนของตระกูล (คนเกิดในตระกูล) · council_ring วงสภา
# หน้าเดิมของเมือง: บรูดา ตระกูลสิ่วยาว ผู้ถือค้อนสภา (หญิง)
# หนี้สงครามกับกำแพงที่สลักหนี้มีตั้งแต่ปี 302 เรื่องที่เอ่ยถึงจึงกันด้วย when.year (เรื่อง e) เรื่อง d ไม่มีปีกัน
# คนแคระทุกคนในเกมเกิดในตระกูลของทุนดาร์ ฉากของคนมาใหม่ (native: false) จึงเป็นคนจากข้างล่างเสมอ

# ---------- a ฤดูแรกของคนมาใหม่ ----------
- id: adult.city_tundar_first_season
  stage: adult
  weight: 30
  scene: station
  people: [{ id: kunda, name: กุนดา ตระกูลขอบเตา, gender: f, race: dwarf, bond: friend, closeness: 0, age: 46 }]
  when:
    age: [19, 64]
    city: { id: tundar, native: false, max_years: 2 }
    not_flags: [institute_student]
  text: |
    ลานประตูล่างคือที่สุดทางของทุกอย่างที่ขึ้นมาจากข้างล่าง รถไฟไต่เขาเทียบชานหินตอนเที่ยง เกวียนถ่านเลี้ยวกลับตรงนี้ คนแบกของของถนนวนมารับของต่อจากตรงนี้ ห้องของคนนอกเจาะเรียงเป็นชั้นในหน้าผาที่ล้อมลานไว้สามด้าน ลมจากหุบเขาพัดขึ้นมาตามรางทั้งวันทั้งคืน พาฝุ่นสีสนิมจากปล่องข้างบนลงมาเกาะขอบประตูทุกบาน

    ไม่มีใครเขียนกฎของลานนี้ไว้ให้อ่าน แต่ทุกคนรู้ ระฆังค่ำของชั้นโรงหลอมดังเมื่อไร ประตูเหล็กหัวถนนวนก็ปิด คนที่ไม่มีชื่อบนหินของตระกูลไหนนอนข้างล่างจนเช้า ห้องในหน้าผาไม่มีแผ่นหินข้างวงกบอย่างห้องข้างบน ยามประตูเขียนชื่อคนเช่าด้วยดินขาวบนบานประตู ลมลบเมื่อไรก็เขียนใหม่

    กุนดา ตระกูลขอบเตา ขายถ่านมารให้คนนอกจากแผงใต้หน้าผาฝั่งตะวันตก ตัวเตี้ยกว่าคนแคระส่วนใหญ่ แต่แขนท่อนบนใหญ่เท่าน่องคน ผมเปียสองข้างพันลวดเหล็กกันไฟ ห้องเหนือแผงของนางว่างมาตั้งแต่คนเช่าคนก่อนขึ้นรถไฟลงเขาแล้วไม่กลับ นางบอก{name}ว่าห้องนั้นอุ่นที่สุดในหน้าผา เพราะอยู่เหนือกองถ่าน ค่าเช่าจ่ายเมื่อครบรอบสัญญา แต่ถ่านของหน้าหนาวต้องจ่ายตั้งแต่วันนี้ คนนอกซื้อถ่านแพงกว่าคนในตระกูลสามเท่า นางบอกตัวเลขนี้ด้วยเสียงเดียวกับที่บอกราคาเกลือ
  choices:
    - id: pay_for_the_coal
      label: จ่ายค่าถ่านหน้าหนาวล่วงหน้า แล้วขนของขึ้นห้องเหนือแผงของกุนดา
      text: |
        กุนดานับเหรียญบนฝ่ามือที่ดำด้วยฝุ่นถ่านจนลายมือหายไปหมด แล้วเดินนำขึ้นบันไดหินแคบที่ต้องเอียงไหล่ขึ้น ห้องลึกเข้าไปในหินสี่ก้าว พื้นอุ่นจนถอดรองเท้าเดินได้ทั้งหน้าหนาว ตามรอยแยกของพื้นมีแสงแดงเรื่อๆ ลอดขึ้นมาจากกองถ่านข้างล่าง

        นางเขียนชื่อ{name}บนบานประตูด้วยดินขาวเป็นอักษรคนแคระ ตัวหนังสือเหลี่ยมเหมือนรอยเกาของนก คืนแรก{name}ฝันว่ามีเสียงทุ้มๆ เรียกชื่อตัวเองจากใต้พื้น เรียกช้าๆ ทีละพยางค์ ตื่นมาตอนสายก็จำไม่ได้แล้วว่าเสียงนั้นออกเสียงชื่อถูกหรือผิด
      effects: { gold: -2, city: { home: room }, people: [{ id: kunda, closeness: 1 }], flags: [rents_over_kundas_coal] }
    - id: carry_her_sacks
      label: ขอแบกกระสอบถ่านขึ้นบันไดหน้าผาให้แผงของนางทุกเช้า แทนค่าถ่านหน้าหนาว
      check: { stat: STR, dc: 13 }
      success:
        text: |
          ลูกค้าของกุนดาอยู่ทุกชั้นของหน้าผา ห้องบนสุดอยู่สูงกว่าลานแปดช่วงบันได {name}รัดกระสอบไว้กับหน้าผากด้วยสายหนังแบบคนแบกของคนแคระ ขึ้นวันละสิบสองเที่ยวตั้งแต่ก่อนสาง ถ่านในกระสอบร้อนทะลุผ้ากระสอบมาถึงหลัง ขณะที่ลมจากหุบเขาตีหน้าจนชา

          ปลายเดือนกุนดาเลิกนับเที่ยว นางเริ่มเรียก{name}ว่าคนแบกของนาง ไม่ได้เรียกว่าคนนอก ห้องเหนือแผงได้ถ่านส่วนเดียวกับห้องของนางเอง
        effects: { stats: { STR: 1 }, city: { home: room }, people: [{ id: kunda, closeness: 2 }], flags: [carried_kundas_coal] }
      failure:
        text: |
          เช้าที่สามบันไดหินมีน้ำแข็งเกาะเป็นแผ่นบาง เท้าของ{name}ไถลไปสองขั้น กระสอบหลุดจากสายหนัง ถ่านมารกลิ้งลงบันไดทีละก้อน แต่ละก้อนเรืองแดงอยู่บนน้ำแข็งเหมือนถ่านในเตาที่ใครเพิ่งเขี่ยกระจาย เข่าของ{name}ถลอกจนเห็นเนื้อ

          กุนดาเก็บถ่านคืนด้วยคีมทีละก้อนโดยไม่บ่น แล้วบอกว่าห้องยังให้เช่า แต่ค่าถ่านต้องจ่ายเป็นเหรียญเหมือนคนอื่น
        effects: { hp: -2, gold: -1, city: { home: room }, flags: [dropped_kundas_coal] }
    - id: carters_hall
      label: ไม่เช่าห้อง ไปนอนโรงพักคนขับเกวียนกับคนจากข้างล่าง
      text: |
        โรงพักคนขับเกวียนอยู่ติดประตูลาน หลังคาไม้ พื้นปูฟาง คนที่นอนเป็นคนอาร์เวลทั้งโรง ขึ้นมากับเกวียนถ่านแล้วนอนรอขากลับ พวกเขาเล่าให้{name}ฟังตั้งแต่คืนแรกว่าตระกูลไหนจ่ายตรงวัน ตระกูลไหนให้รอสามสัปดาห์ และอย่ายืนบนขั้นแรกของถนนวนตอนระฆังค่ำดัง ยามประตูเคยปิดประตูเหล็กทับเท้าคนมาแล้ว

        ทั้งฤดู{name}ได้งานจากคนในโรงนั้นพอเลี้ยงตัว ทุกเช้าฟางที่นอนมีฝุ่นสีสนิมเกาะอยู่ชั้นหนึ่ง ต้องตบออกก่อนพับเก็บ ชื่อของ{name}ไม่ได้ขึ้นบานประตูไหนทั้งฤดู
      effects: { gold: 1, flags: [slept_in_the_carters_hall] }

# ---------- b ย่าน: ชั้นโรงหลอม ----------
- id: adult.city_tundar_back_walls
  stage: adult
  weight: 22
  scene: smithy
  when:
    age: [19, 64]
    city: tundar
  text: |
    เดือนที่หนาวที่สุดของปี ทุนดาร์ไม่เจาะหิน ไม่มีตระกูลไหนลงเหมืองในเดือนนี้ ธรรมเนียมนี้เก่ากว่าถนนวนชั้นบนสุด แต่เตาไม่เคยดับ ชั้นโรงหลอมอยู่ล่างสุดของเมือง หลังเตาทุกเตามีทางเดินแคบที่ผนังหินร้อนจนแนบมือได้ไม่นาน เดือนนี้ทุกปี ชั้นโรงหลอมเปิดทางเดินหลังเตาให้ใครก็ได้ที่ไม่มีถ่านลงมานอนพิงผนัง คนแก่จากลานประตูล่าง เด็กที่ตระกูลเลี้ยงไม่ไหว คนงานเหมืองที่ไม่มีงานในเดือนห้ามขุด

    ปีนี้ขบวนถ่านขาขึ้นติดอยู่ที่ขั้นที่สามของทางรถไฟ หินกับหิมะไหลลงมาทับรางไว้ช่วงหนึ่ง นายเตาสั่งหรี่เตาครึ่งชั้นเพื่อให้ถ่านที่เหลือพอถึงขบวนหน้า ทางเดินหลังเตาที่หรี่เย็นลงจนคนที่นอนพิงผนังต้องเบียดกันไปอยู่หลังเตาที่ยังเปิด คืนที่สอง มีชายแก่คนหนึ่งไม่ตื่น

    เช้าวันที่สาม นายเตายืนที่ปากทางรถไฟ เรียกคนที่ยังมีแรง ขบวนถ่านอยู่ห่างไปครึ่งวันเดินตามราง ถ้าแบกกระสอบกลับมาด้วยหลังคนได้มากพอ เตาครึ่งชั้นที่หรี่ไว้จะเปิดได้อีกคืนนี้
  choices:
    - id: haul_from_the_train
      label: เดินตามรางไปที่ขบวนถ่าน แล้วแบกกระสอบกลับมาด้วยหลัง
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ไม้หมอนรางมีน้ำแข็งเกาะทุกท่อน คนแบกเดินเรียงหนึ่งไปตามขอบราง เอาไหล่ซ้ายแนบผนังเขาไว้ตลอดทาง {name}แบกกลับมาได้สามเที่ยวก่อนมืด กระสอบละหนักเท่าเด็กห้าขวบ ถ่านข้างในร้อนจนหลังเปียกเหงื่อ ส่วนหน้าแข้งแข็งจนไม่รู้สึกว่าเหยียบอะไร

          ตกค่ำเตาครึ่งชั้นที่หรี่ไว้กลับมาเปิด ทางเดินหลังเตาอุ่นขึ้นจนคนที่นอนเบียดกันขยับแยกออกได้ นายเตาเดินไล่นับคนแบกจากรอยดำของถ่านบนหลังเสื้อ นับทีละคน ไม่ได้ถามชื่อใคร แต่ปีต่อมาเขาทัก{name}ก่อนทุกครั้งที่สวนกันบนบันได
        effects: { stats: { CON: 1 }, city: { merit: 1 }, flags: [hauled_coal_in_the_still_month] }
      failure:
        text: |
          เที่ยวที่สอง{name}เหยียบไม้หมอนท่อนที่น้ำแข็งหนาที่สุด กระสอบดึงตัวเอียงออกจากผนังเขา {name}ปล่อยกระสอบเพื่อคว้าราง ถ่านทั้งกระสอบกลิ้งลงหุบไปเป็นสายแสงแดงเส้นยาว แล้วดับหายในหิมะข้างล่าง

          {name}กลับถึงชั้นโรงหลอมมือเปล่า ปลายนิ้วสองนิ้วซีดขาวเหมือนเทียนไข ต้องแช่น้ำอุ่นทั้งคืนจนเลือดกลับมา ตอนเลือดกลับมาเจ็บกว่าตอนชา
        effects: { hp: -2, flags: [frostnipped_on_the_coal_rail] }
    - id: open_your_furnace
      label: เปิดประตูเตาของตัวเองทิ้งไว้ทั้งคืน เผาถ่านส่วนของตัวเองให้ทางเดินหลังเตา
      requires: { city: { district: [forge_levels] } }
      text: |
        {name}ยกสลักประตูเตาขึ้นทั้งคืน ไฟแดงในเตาส่องทะลุไปถึงทางเดินด้านหลัง ถ่านส่วนที่เก็บไว้ทั้งเดือนหมดไปในสามคืน ผนังหลังเตาของ{name}อุ่นกว่าผนังไหนในชั้น คนที่นอนพิงย้ายมารวมกันตรงนั้นเป็นแถวยาว เท้าของคนหนึ่งชนหัวอีกคน

        เตาของ{name}ต้องหรี่ไปอีกครึ่งเดือนหลังจากนั้น งานที่รับไว้ส่งช้า คนจ้างบ่นทุกคน แต่ไม่มีใครบ่นต่อหน้าคนที่เคยลงไปนอนพิงผนังหลังเตานั้น
      effects: { gold: -2, city: { merit: 1 }, flags: [burned_own_share_for_the_back_walls] }
    - id: sleep_at_the_wall
      label: เก็บถ่านของตัวเองไว้ หอบผ้าห่มลงไปนอนพิงผนังหลังเตากับคนอื่น
      text: |
        ทางเดินหลังเตามีกลิ่นผ้าเปียกกับเหงื่อ คนนอนเรียงกันตามผนังหัวชนเท้า คนแคระกับคนจากข้างล่างนอนติดกันโดยไม่มีใครเลือกที่ ตอนเช้านายเตาเดินมาพร้อมไม้นับ เอาปลายไม้แตะหัวคนทีละคน แล้วบากไม้หนึ่งรอยต่อหนึ่งหัว

        เช้าวันหนึ่ง{name}เห็นเขาหยุดที่ร่างหนึ่งนานกว่าร่างอื่น เขาไม่ได้บากไม้ตรงนั้น เขาเอามีดขูดรอยบากของเมื่อวานออกหนึ่งรอยแทน ถ่านที่{name}เก็บไว้ได้ ขายต่อให้ห้องข้างๆ ในราคาของเดือนห้ามขุด
      effects: { gold: 1, flags: [slept_at_the_back_walls] }
    - id: send_a_sack
      label: ซื้อถ่านหนึ่งกระสอบส่งลงไปที่ทางเดินหลังเตา แล้วกลับไปทำงานของตัวเอง
      requires: { min_gold: 1 }
      text: |
        คนขายถ่านที่ลานประตูล่างขึ้นราคาไปแล้วตั้งแต่ข่าวขบวนติดหิมะมาถึง {name}จ่ายตามราคานั้น จ้างเด็กแบกของคนหนึ่งให้แบกลงไปส่ง เด็กกลับมาบอกว่านายเตารับไว้ แล้วโยนลงเตาทั้งกระสอบโดยไม่แกะเชือก

        คืนนั้นทั้งชั้นโรงหลอมยังหนาว กระสอบเดียวไม่ได้ทำให้อะไรต่างไปเท่าไร แต่ชายแก่ที่นอนใกล้เตานั้นที่สุดตื่นขึ้นมาตอนเช้า
      effects: { gold: -1, alignment: { moral: 1 }, flags: [paid_a_sack_for_the_back_walls] }

# ---------- c ย่าน: ถนนวนของตระกูล ----------
- id: adult.city_tundar_six_bearers
  stage: adult
  weight: 22
  scene: clan_hall
  when:
    age: [19, 64]
    city: tundar
  text: |
    ตระกูลโซ่ยาวบนถนนวนชั้นสิบสองเหลือคนอยู่สามคน ห้องโถงของตระกูลกว้างพอให้คนสี่สิบคนนั่งกินข้าว กำแพงชื่อสลักไล่ลงมาจากเพดานจนถึงแถวล่างสุด แถวนั้นยังว่างอยู่ครึ่งแถว

    ผู้เฒ่าคนสุดท้ายของโซ่ยาวตายเมื่อสามวันก่อน ร่างของแกนอนบนแคร่หินกลางห้องโถง ห่อผ้าสีเทาพันด้วยโซ่เส้นเล็กตามชื่อตระกูล ธรรมเนียมของถนนวนบอกว่าคนในตระกูลหกคนต้องหามแคร่ลงไปฝังในผนังเสาของออสซาก่อนระฆังค่ำของวันที่สาม ห้องศพของโซ่ยาวอยู่ลึกเข้าไปในเสา ทางลงเป็นบันไดหินแคบที่หินเย็นตลอดปี คนหามต้องเดินเรียงหนึ่งแล้วยกแคร่ไว้บนบ่า คนที่เหลือของโซ่ยาวคือหลานสาวของผู้ตาย ลุงที่ขาขวาเป็นเหล็กตั้งแต่เหมืองถล่ม กับเด็กชายที่ยังยกค้อนของผู้ใหญ่ไม่พ้นเข่า

    ตระกูลอื่นไม่หามศพให้กันฟรี คนที่หามศพตระกูลอื่นลงผนังเสา ตระกูลของคนตายต้องสลักหนี้หนึ่งบรรทัดให้ตระกูลของคนหาม คนนอกที่ลานประตูล่างหามได้โดยไม่มีหนี้ เพราะไม่มีหินให้สลักชื่อ หลานสาวเดินถามมาตั้งแต่ชั้นสิบสองตอนเช้า ตอนบ่ายนางได้คนนอกมาสองคน ยังขาดหนึ่ง นางมาหยุดที่{name} มือยังเปื้อนผงหินจากการขัดแคร่
  choices:
    - id: shoulder_the_bier
      label: รับหามมุมหนึ่งของแคร่หิน ลงบันไดในผนังเสา
      check: { stat: CON, dc: 13 }
      success:
        text: |
          พ้นประตูผนังเสาไปสิบขั้น ลมหายใจของทุกคนกลายเป็นควันขาว หินสีกระดูกของเสาดูดความอุ่นออกจากฝ่ามือที่แตะ หลานสาวเดินหน้าสุด ถือตะเกียงไว้ต่ำ นับขั้นออกเสียงทีละขั้นให้คนข้างหลังก้าวพร้อมกัน นับไปถึงสามร้อยสิบเอ็ดจึงหยุด

          ห้องศพของโซ่ยาวเจาะไว้เป็นช่องเรียงกันสามแถว ช่องว่างช่องเดียวอยู่แถวล่างสุด ทุกคนดันแคร่เข้าไปพร้อมกัน แล้วหลานสาวเอามือแตะหินกับหน้าผากตัวเอง ขากลับขึ้นมา{name}ก้าวตามเสียงนับที่ไม่มีแล้วจนถึงขั้นบนสุด อีกหลายเดือนต่อมา คนบนถนนวนชั้นสิบสองยังหยุดทัก{name}ตอนเดินสวนกัน
        effects: { stats: { CON: 1 }, city: { merit: 1 }, flags: [bore_the_long_chain_dead] }
      failure:
        text: |
          ครึ่งทางลง ไหล่ของ{name}ล้าจนมุมแคร่ด้านนั้นทรุดลงก่อนมุมอื่น ขอบแคร่กระแทกขั้นบันได เศษหินชิ้นเท่าเล็บกระเด็นไปกระทบผนัง เสียงดังก้องไปทั้งช่องบันได ทุกคนหยุด หลานสาวเดินย้อนขึ้นมาสองขั้น ก้มเก็บเศษหินชิ้นนั้นใส่กระเป๋าเสื้อ แล้วนับต่อ

          ที่ห้องศพ นางวางเศษหินชิ้นนั้นลงในช่องพร้อมร่างของผู้เฒ่า ไหล่ของ{name}เขียวช้ำอยู่ครึ่งเดือน
        effects: { hp: -2, flags: [dipped_the_long_chain_bier] }
    - id: bring_clan_hands
      label: กลับไปเรียกคนในตระกูลของตัวเองมาหามให้ครบหก แล้วรับหนี้หนึ่งบรรทัด
      requires: { flag: race_dwarf, city: { district: [clan_levels] } }
      text: |
        ผู้เฒ่าในห้องโถงของ{name}บ่นตั้งแต่ได้ยินชื่อโซ่ยาว ตระกูลที่เหลือสามคนจะใช้หนี้แรงหกบ่าคืนได้เมื่อไร แต่แกก็ส่งหลานชายสองคนออกมากับ{name} ทั้งสามหามแคร่ลงผนังเสาพร้อมคนนอกอีกสองคนกับหลานสาวของผู้ตาย

        เย็นนั้นหลานสาวสลักหนี้บรรทัดใหม่ลงกำแพงห้องโถงโซ่ยาวด้วยมือของนางเอง ใต้ชื่อของผู้เฒ่าที่เพิ่งตาย ตัวอักษรเล็กกว่าชื่อครึ่งหนึ่ง เป็นชื่อตระกูลของ{name} กับคำว่า ยืมบ่า
      effects: { city: { merit: 1 }, reputation: { dwarf_council: 1 }, flags: [lent_clan_bearers] }
    - id: send_to_the_council
      label: บอกนางให้ขึ้นไปขอคนหามจากวงสภา
      text: |
        วงสภามีคนหามของตัวเอง คนพวกนั้นหามศพของคนที่ไม่มีตระกูลเหลือ และศพของคนที่ตระกูลสกัดชื่อออกจากหิน หลานสาวฟัง{name}พูดจนจบ มือที่เปื้อนผงหินกำเข้าหากันช้าๆ แล้วนางก็เดินต่อลงไปทางลานประตูล่าง ไม่ได้เลี้ยวขึ้นบันไดไปวงสภา

        ตอนระฆังค่ำดัง ขบวนหกคนเดินผ่านหัวถนนวนลงไปทางผนังเสา คนหามมุมสุดท้ายเป็นคนขับเกวียนจากอาร์เวลที่ยังไม่ได้ล้างฝุ่นถ่านออกจากหน้า
      effects: { flags: [sent_the_long_chain_to_the_council] }

# ---------- d เรื่องเริ่มตึง: ชั้นที่ก่อปิดตาย ----------
- id: adult.city_tundar_bright_lead
  stage: adult
  weight: 14
  scene: home
  when:
    age: [19, 64]
    city: { id: tundar, mood: [calm] }
  text: |
    เด็กชายคนแคระที่ทาไขล้อรถรางขนแร่สายเก่ามาหา{name}ตอนเย็น กำมือแน่นจนข้อนิ้วขาว พอแบมือใต้ตะเกียง ในมือมีเศษตะกั่วบิดเป็นเส้นสิบกว่าเส้น ผิวด้านหนึ่งหมองเทาแบบตะกั่วที่ฝังอยู่ในหินมานาน อีกด้านเงาวาว เพิ่งโดนขูด

    รางสายเก่าวิ่งลงไปถึงอุโมงค์ชั้นยี่สิบสาม สุดอุโมงค์มีกำแพงที่ก่อปิดตายตั้งแต่สงครามจอมมาร หินแต่ละก้อนใหญ่กว่าตัวคน รอยต่อเทตะกั่วไว้ทุกเส้น บนหินสลักอักษรที่ไม่มีใครในทุนดาร์อ่านออก เด็กทำหม้อไขหล่นตรงนั้นเมื่อวาน ก้มลงเก็บแล้วเห็นว่ารอยต่อเส้นล่างสุดโดนขูดตะกั่วออกไปยาวหนึ่งช่วงแขน คนขูดเอาดินโคลนทาปิดไว้ คนที่เดินผ่านเร็วๆ จะไม่เห็น

    เด็กไม่กล้าบอกตระกูลตัวเอง ไม่รู้ว่าคนขูดเป็นคนของตระกูลไหน และช่วงนี้ลุงของเขาพูดเรื่องชั้นนั้นที่โต๊ะกินข้าวบ่อยขึ้นทุกเดือน เขามาหา{name} เพราะ{name}จ่ายค่าส่งของให้เขาครบทุกครั้งโดยไม่เคยต่อ และเพราะไม่เคยได้ยิน{name}พูดถึงชั้นนั้นที่โต๊ะไหนเลย
  choices:
    - id: lay_it_on_the_table
      label: เอาเศษตะกั่วไปวางกลางโต๊ะยาวของโรงกินข้าว ให้ทุกคนเห็น
      text: |
        เศษตะกั่วผ่านมือคนในโรงกินข้าวไปจนครบโต๊ะ ตกดึกคนพูดกันไปถึงชั้นโรงหลอม พอสายวันต่อมาก็ไปถึงถนนวนทุกชั้น ไม่มีตระกูลไหนยอมรับว่ารู้เรื่อง ทุกตระกูลส่งคนไปยืนเฝ้าปากบันไดลงเหมืองเก่า คนเฝ้าของแต่ละตระกูลไม่ได้เฝ้ากำแพง พวกเขาเฝ้ากันเอง

        ลานวงสภาเริ่มมีคนมายืนตั้งแต่เช้า ยืนเฉยๆ ไม่มีใครนั่ง เด็กทาไขล้อไม่มาหา{name}อีก ได้ข่าวว่าลุงของเขาเลิกพูดที่โต๊ะกินข้าวไปทั้งเรื่อง
      effects: { city: { mood: tense }, flags: [showed_the_scraped_lead] }
    - id: carry_it_up_quietly
      label: ห่อเศษตะกั่วใส่ผ้า เอาขึ้นไปให้คนของวงสภาโดยไม่บอกชื่อเด็ก
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ไม่ไปหาเสมียนหนุ่มที่โต๊ะหน้าวงสภา ไปหาคนเฝ้าประตูห้องเก็บค้อน ชายแก่ที่ถือกุญแจห้องนั้นมาสี่สิบปีและพูดวันละไม่ถึงสิบคำ เขารับห่อผ้าไปโดยไม่เปิดดู ถามคำเดียวว่าชั้นไหน

          สามคืนต่อมา เด็กทาไขล้อลงไปที่ชั้นยี่สิบสามอีกครั้ง รอยต่อเส้นล่างสุดมีตะกั่วเทใหม่ทับไว้ ยังเงาอยู่ ข้างกำแพงมีหม้อไขใบใหม่วางไว้หนึ่งใบ ไม่มีใครบอกว่าใครวาง
        effects: { stats: { WIS: 1 }, city: { merit: 1 }, flags: [brought_the_lead_to_the_hammer] }
      failure:
        text: |
          คนเฝ้าประตูห้องเก็บค้อนไม่อยู่ {name}จำใจฝากห่อผ้าไว้กับเสมียนหนุ่มที่โต๊ะหน้าวง เขาแกะห่อออกดูตรงนั้นต่อหน้าคนที่นั่งรอยื่นเรื่องอีกหกคน แล้วถามเสียงดังว่าไปเอามาจากไหน

          ตกเย็นเรื่องตะกั่วเงาวาวก็ไปถึงทุกชั้นของถนนวน ไปพร้อมกับเรื่องเด็กทาไขล้อสายเก่า คนสามตระกูลมายืนเฝ้าปากบันไดลงเหมืองเก่า เด็กคนนั้นโดนย้ายไปทาไขรถรางสายใหม่ตั้งแต่สัปดาห์ต่อมา
        effects: { city: { mood: tense }, flags: [lead_spilled_at_the_council] }
    - id: keep_it_in_a_jar
      label: เก็บเศษตะกั่วใส่โถดินปิดฝาไว้ใต้เตียง แล้วบอกเด็กว่าอย่าลงไปอีก
      text: |
        เด็กรับคำแล้วกลับไปโดยไม่ถามอะไรต่อ {name}ซ่อนโถดินไว้ใต้เตียง ไม่ได้เปิดดูอีกจนปลายปี เรื่องในทุนดาร์เป็นปกติดี ตลาดเปิด ระฆังค่ำดังตรงเวลา ไม่มีใครพูดถึงเหมืองเก่า

        ปลายปีเด็กคนนั้นมาที่ประตูอีกครั้ง กำมือแน่นเหมือนครั้งก่อน เขาไม่ได้ลงไปเอง คนที่ลงไปคือเพื่อนของเขา เศษตะกั่วในมือคราวนี้เงาวาวทั้งสองด้าน {name}เปิดโถ เทเศษใหม่ลงไปรวมกับเศษเก่า แล้วปิดฝา
      effects: { flags: [kept_the_scraped_lead] }

# ---------- e เดือด: ใบสั่งของราชนาวี (มีกำแพงหนี้ จึงกันปี) ----------
- id: adult.city_tundar_navy_order
  stage: adult
  weight: 35
  scene: council_hall
  when:
    age: [19, 64]
    year: [302, 364]
    city: { id: tundar, mood: [tense] }
  text: |
    เสมียนของราชนาวีขึ้นมาถึงวงสภาชั้นห้าทุกต้นเดือน ยืนบนขั้นหินหน้ากำแพงที่สลักหนี้สงคราม แล้วอ่านใบสั่งแขนกลของเดือนนั้นออกเสียง จำนวนแขน จำนวนขา ราคาต่อชิ้นตามที่อาร์เวลตั้ง ทหารเรือหกนายยืนหลังเขา ปืนดินดำพาดบ่า

    เดือนนี้เขาอ่านจำนวนแขนเป็นสองเท่าของเดือนก่อน ราคาต่อชิ้นต่ำลงหนึ่งในห้า ช่างหลอมขึ้นมายืนเต็มลานก่อนเขาอ่านจบ ผ้ากันไฟยังผูกอยู่ที่เอว บางคนยังถือคีม ข้างหลังพวกเขาคือคนจากถนนวนทุกชั้น กับคนจากลานประตูล่างที่ขึ้นมาดูว่าเสียงดังเรื่องอะไร

    ช่างหลอมหนุ่มคนหนึ่ง แขนท่อนล่างมีแผลไฟไหม้เป็นมันเงา เดินออกจากแถว ดึงใบสั่งออกจากมือเสมียน แล้วโยนลงกระถางถ่านที่ตั้งไว้ให้คนยืนรอผิงมือ กระดาษลุกวูบเดียวก็เหลือแต่ขอบดำ ทหารเรือหกนายลดปืนลงจากบ่าพร้อมกัน เสียงง้างนกดังทีละกระบอก ทั้งลานเงียบจนได้ยินถ่านในกระถางปริ

    {name}ยืนอยู่ห่างกระถางถ่านไม่ถึงสิบก้าว
  choices:
    - id: stand_with_the_forges
      label: ก้าวเข้าไปยืนแถวเดียวกับช่างหลอม
      text: |
        นัดแรกยิงขึ้นฟ้า เสียงก้องไปตามถนนวนจนคนชั้นบนสุดชะโงกลงมาดู แถวช่างหลอมไม่ถอย ดันเข้าไปทีละก้าว พาคนข้างหลังเข้าไปด้วย ทหารเรือถอยลงบันไดไปทางลานประตูล่าง พอถึงลานล่างก็เจอเกวียนของราชนาวีที่ขนแขนกลที่ประกอบเสร็จแล้วรอส่ง คนที่ตามลงไปคว่ำเกวียนทั้งสามเล่ม แขนกลทองเหลืองกระจายเต็มลาน นิ้วกางขึ้นฟ้าทุกข้อ

        พานท้ายปืนกระแทกซี่โครงของ{name}ตอนบันไดช่วงที่แคบที่สุด ทั้งคืนนั้นทุนดาร์ไม่มีใครตีระฆังค่ำ ประตูเหล็กหัวถนนวนเปิดค้างอยู่จนเช้า
      effects: { hp: -2, reputation: { dwarf_council: 1, crown: -1 }, city: { mood: riot }, flags: [stood_with_the_forges_on_order_day] }
    - id: pull_the_clerk_out
      label: ฝ่าคนเข้าไปลากเสมียนออกจากวง พาลงบันไดไปทางลานประตูล่าง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ลอดใต้แขนช่างหลอมสองคน คว้าคอเสื้อเสมียนแล้วดึงลงขั้นหินด้านข้างที่คนไม่ได้ยืน ทหารเรือเห็นว่านายของตัวหายไปจากวง ก็ถอยตามลงมาทีละคน ปืนยังไม่ลั่นสักนัด หน้ากำแพงหนี้เหลือแต่ช่างหลอมกับกระถางถ่าน ไม่มีใครให้ดันแล้ว

          ผู้ถือค้อนสภาตีค้อนลงบนหินหนึ่งครั้ง ประกาศว่าวงสภาจะเขียนถึงราชนาวีเอง ช่างหลอมทยอยกลับลงชั้นโรงหลอมก่อนค่ำ ที่ลานประตูล่าง เสมียนนั่งตัวสั่นอยู่บนขอบชานรถไฟ ขอน้ำ{name}ดื่ม แล้วขึ้นขบวนแรกลงเขาโดยไม่ได้เก็บเงินค่าแขนกลของเดือนนั้น
        effects: { stats: { DEX: 1 }, reputation: { crown: 1, dwarf_council: -1 }, city: { mood: calm }, flags: [pulled_the_navy_clerk_out] }
      failure:
        text: |
          {name}คว้าแขนเสื้อเสมียนได้ แต่มีคนเห็นก่อน มือหนึ่งกระชากตัว{name}กลับเข้าไปในฝูงคน ก้อนหินลูกแรกลอยข้ามหัวไป ทหารเรือยิงนัดแรกขึ้นฟ้า นัดที่สองยิงต่ำกว่านั้น

          วงสภาแตกเป็นสามทาง {name}ออกมาจากลานได้ด้วยคิ้วแตก เลือดไหลเข้าตาซ้าย เกวียนแขนกลของราชนาวีที่ลานประตูล่างไหม้อยู่ทั้งคืน
        effects: { hp: -2, reputation: { crown: 1, dwarf_council: -1 }, city: { mood: riot }, flags: [seen_dragging_the_navy_clerk] }
    - id: call_for_the_hammer
      label: ตะโกนเรียกให้ผู้ถือค้อนสภาตีค้อนเปิดวง
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          ธรรมเนียมของวงสภาเก่ากว่าหนี้ทุกบรรทัดบนกำแพง ค้อนสภาดังเมื่อไร ทุกคนในวงต้องนั่ง {name}ตะโกนคำเรียกค้อนซ้ำจนคนรอบตัวตะโกนตาม เสียงไล่ไปทั่วลานจนถึงขั้นหินบนสุด บรูดา ตระกูลสิ่วยาว ลุกขึ้นจากที่นั่งของผู้ถือค้อน แล้วตีหัวค้อนลงบนหินดังจนหูอื้อ

          ช่างหลอมนั่งลงบนพื้นหินเย็นทีละคน ทหารเรือเห็นทั้งลานนั่งลงก็ลดปืน วงสภาเปิดกลางลานนั้นเลย ไม่มีใบสั่ง ไม่มีใครยืน ตกค่ำระฆังของชั้นโรงหลอมดังตรงเวลา
        effects: { stats: { CHA: 1 }, city: { mood: calm }, flags: [called_the_hammer_on_order_day] }
      failure:
        text: |
          เสียงของ{name}จมหายไปในเสียงคน ไม่มีใครตะโกนตาม บรูดาลุกขึ้นถือค้อน แต่ยังไม่ทันตี ก้อนหินลูกแรกก็ลอยข้ามหัวคนไปกระทบกำแพงหนี้ ทหารเรือยิงขึ้นฟ้า แล้วฝูงคนก็ดันเข้าหากัน

          {name}ล้มทับขั้นหิน ข้อมือซ้นจนบวม คืนนั้นควันจากลานประตูล่างลอยขึ้นมาตามถนนวน ไม่มีใครตีระฆังค่ำ
        effects: { hp: -1, city: { mood: riot }, flags: [called_and_no_one_answered] }
    - id: go_down_before
      label: ถอยออกจากลาน ลงบันไดกลับไปปิดประตูห้องตัวเอง
      text: |
        {name}เดินสวนคนที่กำลังขึ้นมา บันไดแน่นจนต้องเบียดผนัง ยังลงไม่ถึงชั้นถัดไปก็ได้ยินนัดแรก แล้วเสียงคนทั้งลานร้องขึ้นมาพร้อมกัน

        คืนนั้น{name}นั่งอยู่หลังประตูที่ลงกลอนสองชั้น ได้ยินเสียงเหล็กกระทบหินดังลงมาตามถนนวนเป็นระยะจนเกือบสาง ตอนเช้าทุกขั้นบันไดหน้าห้องมีฝุ่นเถ้าเกาะ
      effects: { city: { mood: riot }, flags: [left_the_ring_on_order_day] }

# ---------- f ไข้มาถึง: มากับเรือเหาะ ----------
- id: adult.city_tundar_airship_fever
  stage: adult
  weight: 6
  scene: ship_deck
  when:
    age: [19, 64]
    city: { id: tundar, mood: [calm, tense] }
  text: |
    เรือเหาะของราชนาวีลอยลงมาผูกเสาเหล็กที่ลานประตูล่างตอนสาย มารับลังแขนกลที่สั่งไว้ ทั้งลานออกมายืนดู เรือเหาะขึ้นมาถึงทุนดาร์ไม่กี่ครั้งต่อปี ลมหุบเขาทำให้ผูกเสายาก ท้องเรือแกว่งไปมาเหนือหัวคนจนเงาของเรือกวาดไปทั่วลาน

    ลูกเรือไต่บันไดเชือกลงมาสี่คน คนหนึ่งไอแห้งๆ ตั้งแต่ยังไม่ถึงพื้น อีกคนหน้าแดงจัดอยู่ในลมหนาว พอเท้าแตะลานก็นั่งลงบนลังเปล่าหายใจหอบ นายท้ายเรือบอกยามประตูว่าไม่มีอะไร ไข้ท่าเรือที่ติดมาจากหอท่าข้างล่าง บนเรือมีอีกสามคนตัวร้อนมาห้าวันแล้ว พวกเขาต้องการน้ำ ขนมปัง ที่นอนบนพื้นที่ไม่แกว่งหนึ่งคืน แล้วจะออกเรือพรุ่งนี้เช้า

    ยามประตูหันมาถามคนที่ยืนอยู่ใกล้ที่สุด {name}ยืนอยู่ตรงนั้น
  choices:
    - id: keep_them_aboard
      label: บอกยามประตูให้กันลูกเรือไว้บนเรือ แล้วส่งของขึ้นไปทางเชือก
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ไม่เถียงกับนายท้ายเรือ ไปพูดกับยามประตูกับคนแก่ในโรงพักเกวียนที่เคยเห็นไข้ท่าเรือมาแล้ว ไม่ถึงเที่ยงลานประตูล่างก็ตกลงกันได้ คนบนเรืออยู่บนเรือ ลูกเรือสี่คนที่ลงมาแล้วต้องไต่กลับขึ้นไป น้ำกับน้ำแกงส่งขึ้นไปในตะกร้าผูกเชือก ลังแขนกลโยงขึ้นไปทางรอกโดยไม่มีใครขึ้นเรือ

          เรือเหาะแขวนอยู่ที่เสาเจ็ดวัน ทุกเช้าตะกร้าเปล่าหย่อนลงมาพร้อมผ้าขาวผูกที่หูตะกร้า นับได้กี่ผืนก็คือคนบนเรือที่ยังตัวร้อนอยู่ วันที่แปดไม่มีผ้าผูกมา เรือแก้เชือกออกจากเสา ปลายเดือนนั้นที่ลานประตูล่างไม่มีใครไอ
        effects: { city: { merit: 2 }, flags: [kept_the_airship_crew_aboard] }
      failure:
        text: |
          นายท้ายเรือหัวเราะใส่หน้า{name} บอกว่าคนของราชนาวีจะนอนที่ไหนก็ได้ในแผ่นดินที่ราชนาวีรับซื้อของ ยามประตูมอง{name} แล้วมองปืนที่เอวนายท้ายเรือ แล้วเปิดโรงพักเกวียนให้ลูกเรือนอน

          เรือออกจากเสาตอนเช้าตามที่บอก สัปดาห์ต่อมาคนขับเกวียนในโรงพักไอแห้งๆ สามคน สัปดาห์ถัดไปห้องในหน้าผามีผ้าขาวผูกหน้าประตูหกบาน
        effects: { city: { mood: plague }, flags: [could_not_hold_the_airship_crew] }
    - id: load_the_crates
      label: รับจ้างขนลังแขนกลขึ้นเรือ ค่าแรงดีกว่างานไหนในเดือนนี้
      text: |
        นายท้ายเรือจ่ายค่าแรงเป็นเหรียญของอาร์เวล นับให้ทีละเหรียญบนฝาลัง {name}กับคนขนของอีกห้าคนโยงลังขึ้นทางรอก แล้วไต่บันไดเชือกขึ้นไปจัดลังเรียงในท้องเรือ ในนั้นมืดและอุ่น กลิ่นน้ำมันเครื่องปนกลิ่นเหงื่อคนป่วย ลูกเรือสามคนนอนบนเปลผ้าแขวน ไอสลับกันไม่หยุด

        เรือออกไปตอนเช้า เงินค่าแรงยังอยู่ในถุงของ{name}ครบ สิบวันต่อมาคนขนของสองคนในห้าคนนั้นนอนซมอยู่ในห้อง ไข้ขึ้นวันละนิด จนห้องข้างๆ ต้องผูกผ้าขาวไว้หน้าประตูตามกัน
      effects: { gold: 2, city: { mood: plague }, flags: [loaded_the_fever_ship] }
    - id: take_the_ropeman_in
      label: พาลูกเรือหนุ่มที่ไอจนยืนไม่ไหวไปนอนห้องของตัวเอง
      text: |
        ลูกเรือคนนั้นอายุไม่ถึงยี่สิบ ตัวร้อนจนเสื้อชื้น {name}ประคองเขาขึ้นบันไดหน้าผา ให้นอนบนเตียงตัวเอง ป้อนน้ำทุกครั้งที่เขาตื่น ตลอดคืนเขาเรียกชื่อเรือ เรียกชื่อแม่ แล้วเรียกชื่อถนนสายหนึ่งในเมืองท่าที่{name}ไม่รู้จัก

        เช้าวันต่อมาเขาเดินกลับไปที่เสาเองได้ ขอบใจ{name}ด้วยสำเนียงของคนท่าเรือ แล้วไต่บันไดเชือกขึ้นไป ห้าวันหลังจากนั้นเด็กห้องข้างๆ เริ่มไอ ปลายเดือนหน้าห้องในหน้าผามีผ้าขาวผูกอยู่ครึ่งแถว
      effects: { alignment: { moral: 1 }, city: { mood: plague }, flags: [nursed_a_navy_ropeman] }

# ---------- g คนมีหน้ามีตา: ผู้ถือค้อนสภาขอที่นั่ง ----------
- id: adult.city_tundar_back_stool
  stage: adult
  weight: 30
  scene: council_hall
  when:
    age: [25, 64]
    city: { id: tundar, min_rank: 3 }
  text: |
    บรูดา ตระกูลสิ่วยาว ผู้ถือค้อนสภา ให้คนมาตาม{name}ไปที่วงสภาก่อนสาง ลานใหญ่ชั้นห้ายังว่าง ตะเกียงบนเสาหินดับไปครึ่งหนึ่ง นางนั่งอยู่บนขั้นหินขั้นล่างสุดของวง ค้อนสภาพาดอยู่บนตัก หัวค้อนเป็นเหล็กดำสึกจนขอบมน ด้ามไม้ดำมันด้วยมือของผู้ถือค้อนสิบกว่าคนก่อนนาง ผมของนางขาวทั้งหัว ถักเป็นเปียเดียวยาวเลยเอว

    หลังที่นั่งของหัวหน้าตระกูลมีม้าหินเปล่าแถวหนึ่ง ไม่มีลายสลัก ไม่มีชื่อ คนที่นั่งแถวนั้นไม่มีเสียงเวลาวงสภาลงมติ แต่ผู้ถือค้อนเรียกให้ลุกขึ้นพูดได้ทุกเมื่อที่อยากรู้ว่าข้างล่างคิดอย่างไร นายเตาของชั้นโรงหลอมนั่งแถวนั้น ยามประตูลานล่างนั่งแถวนั้น ม้าหินตัวที่สามว่างมาตั้งแต่หน้าหนาวที่แล้ว บรูดาเอาหัวค้อนเคาะม้าหินตัวนั้นเบาๆ สองที

    วงสภาครั้งหน้าจะตัดสินส่วนแบ่งถ่านหน้าหนาว ทุกปีคนนอกที่ลานประตูล่างซื้อถ่านแพงกว่าคนในตระกูลสามเท่า บรูดาอยากให้เรื่องนี้มีคนพูดในวง แต่ไม่อยากให้เป็นปากของผู้ถือค้อน ถ้าค้อนพูดเอง ตระกูลที่ขายถ่านจะบอกทั้งภูเขาว่าผู้ถือค้อนขายภูเขาให้คนข้างล่าง นางต้องการให้คำนี้ออกมาจากแถวหลัง จากปากของคนที่ทั้งถนนวนกับลานประตูล่างรู้จักชื่อ
  choices:
    - id: take_it_and_speak
      label: รับม้าหินตัวนั้น แล้วลุกขึ้นพูดเรื่องราคาถ่านของลานประตูล่างในวง
      text: |
        วันวงสภา{name}ลุกขึ้นจากม้าหินตัวที่สามตอนบรูดาเรียก แล้วบอกตัวเลขทั้งสองตัวช้าๆ ราคาที่ตระกูลซื้อ ราคาที่ลานประตูล่างซื้อ ทั้งวงเงียบไปนานพอให้ได้ยินเสียงรถรางไต่ผ่านอยู่ไกลๆ หัวหน้าตระกูลขอบเตาหัวเราะออกมาครั้งเดียว ไม่ได้หัวเราะต่อ

        มติของวันนั้นลดราคาถ่านของลานประตูล่างลงเหลือสองเท่า ไม่ถึงเท่ากันอย่างที่{name}พูด แผงถ่านของตระกูลขอบเตาเลิกขายให้{name} ทั้งหน้าหนาวนั้น{name}ต้องซื้อถ่านจากเกวียนที่ขึ้นมาจากตีนเขาในราคาที่แพงกว่าเดิม แต่ที่ลานประตูล่าง คนทักชื่อ{name}ก่อนทักชื่อยามประตู
      effects: { gold: -2, city: { merit: 1 }, reputation: { dwarf_council: -1 }, flags: [holds_a_back_stool_in_tundar, spoke_for_the_lower_gate_coal] }
    - id: take_it_and_listen
      label: รับม้าหินตัวนั้น แต่บอกนางว่าจะนั่งฟัง ไม่พูดแทนใคร
      text: |
        บรูดาฟังคำตอบแล้วลุกขึ้น ยกค้อนพาดบ่า บอกว่าคนนั่งฟังก็ต้องมี แล้วเดินขึ้นบันไดไป วันวงสภานางพูดเรื่องราคาถ่านเองจากที่นั่งของผู้ถือค้อน ตระกูลที่ขายถ่านพูดตามที่นางกลัวไว้ทุกคำ และพูดต่อไปอีกครึ่งปี

        {name}นั่งอยู่บนม้าหินตัวที่สามตลอดวงสภาครั้งนั้น และครั้งต่อๆ มา หินเย็นจนต้องเอาผ้ามารองนั่ง มติเรื่องถ่านไม่ผ่าน แต่มีคนนับว่าคนบนม้าหินตัวที่สามไม่ได้ลุกขึ้นค้านผู้ถือค้อน
      effects: { reputation: { dwarf_council: 1 }, flags: [holds_a_back_stool_in_tundar, sits_silent_on_the_back_stool] }
    - id: turn_it_down
      label: ปฏิเสธม้าหิน แล้วบอกชื่อคนอื่นที่ลานประตูล่างให้นางไปถาม
      text: |
        {name}บอกชื่อคนแก่คนหนึ่งในโรงพักเกวียน คนที่อยู่ลานประตูล่างมานานกว่าใคร บรูดาฟังจนจบ ลุกขึ้น ปัดผงหินออกจากชายเสื้อ แล้วเดินขึ้นบันไดไปโดยไม่หันกลับมา

        วงสภาครั้งหน้า ม้าหินตัวที่สามยังว่าง คนแก่คนนั้นไม่ได้ขึ้นมา ทั้งวงไม่มีใครเอ่ยเรื่องราคาถ่านของลานประตูล่าง
      effects: { flags: [refused_brudas_stool] }

# ---------- h หลังคา: บ้านกับร้าน ----------
- id: adult.city_tundar_roof
  stage: adult
  weight: 10
  once: false
  scene: home
  when:
    age: [22, 62]
    city: { id: tundar, home: [none, room, family], min_years: 2 }
  text: |
    ทุนดาร์ไม่มีใครติดป้ายขายบ้าน บนถนนวน บ้านที่ตระกูลจะขายหันแผ่นหินชื่อข้างวงกบเข้าหาผนัง รอจนกว่าจะมีคนซื้อแล้วสลักชื่อใหม่ลงด้านหลัง ที่ลานประตูล่างไม่มีแผ่นหินให้หัน ห้องในหน้าผาที่เจ้าของจะขาย ยามประตูแค่ลบชื่อดินขาวบนบานประตูออกแล้วไม่เขียนอะไรแทน

    ทุกปีมีประตูว่างแบบนั้นบานสองบาน ปีนี้{name}เดินผ่านห้องสองห้องต่อกันในหน้าผาฝั่งตะวันออก เจ้าของเดิมลงเขาไปแล้ว ราคาสิบสองเหรียญ และหน้าร้านติดลานที่มีบานเฟี้ยมเหล็กกับเตาเล็กหนึ่งเตา สิบหกเหรียญ บนถนนวนก็มีแผ่นหินหันเข้าผนังอยู่หนึ่งแผ่น บ้านของตระกูลที่คนสุดท้ายย้ายไปอยู่กับตระกูลอื่น สิบสองเหรียญเท่ากัน ขายให้คนแคระเท่านั้น

    ห้องในหน้าผาที่ซื้อขาดยังเป็นห้องในหน้าผา ลมยังขึ้นมาตามรางเหมือนเดิม คนนอกที่ซื้อ ชื่อจะไม่ได้ขึ้นหินของตระกูลไหน แต่ไม่มีใครมาเอากุญแจคืนได้อีก
  choices:
    - id: buy_the_cliff_rooms
      label: นับสิบสองเหรียญให้ยามประตู แล้วรับกุญแจห้องในหน้าผา
      requires: { not_flags: [race_dwarf], min_gold: 12 }
      text: |
        ยามประตูนับเหรียญสองรอบ แล้วเขียนชื่อ{name}ด้วยดินขาวบนบานประตูเหมือนที่เขียนให้ทุกคน ครั้งนี้เขาเปิดประตูออก เขียนชื่อเดียวกันซ้ำอีกครั้งที่ด้านในของบาน ตรงที่ลมพัดไม่ถึง

        คืนแรก{name}ปิดประตู นั่งดูชื่อตัวเองด้านในบานใต้ตะเกียง ตัวหนังสือดินขาวเริ่มจางตั้งแต่ปีที่สอง แต่ยังอ่านออก
      effects: { gold: -12, city: { district: lower_gate, home: house }, mark: ซื้อบ้านในทุนดาร์, flags: [owns_a_house_in_tundar] }
    - id: buy_on_the_winding_street
      label: ขึ้นไปซื้อบ้านที่แผ่นหินหันเข้าผนังบนถนนวน
      requires: { flag: race_dwarf, min_gold: 12 }
      text: |
        ช่างสลักของสภาตอกลิ่มงัดแผ่นหินออกจากข้างวงกบ ชื่อของเจ้าของเดิมยังอยู่ด้านหน้า ลึกและคม เขาสลักชื่อ{name}ลงด้านหลังแผ่น แล้วฝังกลับเข้าที่ หันชื่อใหม่ออกสู่ทางเดิน ชื่อเก่าหันเข้าหาผนังไปตลอด

        คนแคระในทางเดินเดียวกันมายืนดูตอนสลัก คนหนึ่งเอานิ้วลูบรอยสิ่วตัวสุดท้ายแล้วบอกว่าลึกพอ คืนนั้นมีคนเอาถ่านส่วนแรกของหน้าหนาวมาวางไว้หน้าประตู ไม่บอกว่าใคร
      effects: { gold: -12, city: { district: clan_levels, home: house }, mark: ซื้อบ้านในทุนดาร์, flags: [owns_a_house_in_tundar] }
    - id: open_the_iron_shutter
      label: ซื้อหน้าร้านติดลาน เลื่อนบานเฟี้ยมเหล็กเปิดรับคนขึ้นลง
      requires: { min_gold: 16 }
      text: |
        บานเฟี้ยมเหล็กฝืดจนต้องใช้ไหล่ดัน ข้างในเป็นห้องลึกเข้าไปในหิน มีเตาเล็กกับโต๊ะหินที่ใครสักคนเคยวางของหนักไว้จนกลางโต๊ะเป็นแอ่ง ข้างบนมีห้องนอนที่หน้าต่างมองลงไปเห็นชานรถไฟ

        ทุกคนที่ขึ้นมาจากข้างล่างต้องเดินผ่านหน้าร้านนี้ก่อนถึงถนนวน และทุกคนที่ลงไปก็เดินผ่านอีกครั้ง เช้าวันแรกที่เปิดบานเฟี้ยม{name}เห็นฝุ่นสีสนิมเกาะโต๊ะหน้าร้านไปแล้วชั้นหนึ่ง
      effects: { gold: -16, city: { district: lower_gate, home: shop }, mark: เปิดร้านในทุนดาร์, flags: [owns_a_shop_in_tundar] }
    - id: pass_the_blank_doors
      label: เดินผ่านประตูที่ว่างไป เก็บเงินไว้ก่อน
      text: |
        {name}เดินผ่านประตูว่างบานนั้นไปทุกวันจนสิ้นเดือน วันหนึ่งบนบานมีชื่อใหม่เขียนด้วยดินขาว เป็นชื่อที่{name}ไม่รู้จัก ตัวหนังสือยังขาวสด

        เงินยังอยู่ในถุงเท่าเดิม ระฆังค่ำยังดังตรงเวลาเหมือนทุกคืน
      effects: { flags: [passed_the_blank_doors] }
