# ชุด 6 วัยปลาย: วางมือจากองค์กร (must อายุ 65 ถึง 68 องค์กรละฉาก) กับเรื่องของคนเก่าที่เลือกอยู่ต่อ
# ทุกฉากต้องอ่านได้กับทุกยศ (1 ถึง 4) และทุกปีที่คนอายุนี้มีชีวิตอยู่ (335 ถึง 368): ไม่บอกเลขป้อม ไม่เอ่ยชื่อคนที่เคยเป็นนายในฉากเก่า
#   (คนพวกนั้นอาจไม่อยู่แล้ว) ของประจำยศเรียกรวมว่า "ของที่ถือตามยศ"
# ทางออกใช้ flag กับผลชุดเดียวกับฉากออกจากองค์กรเดิมในไฟล์ 88_* · ทางอยู่ต่อตั้ง elder_of_<องค์กร> (ชุด 7 กับชุด 8 อ่าน flag นี้)
# ตัวเลือกยศ 4 (requires.org.min_rank: 4) คือทางส่งต่อตำแหน่งให้คนที่ตัวละครเลือกเอง
# สายงานของอาณาจักรที่มีวันครบสัญญา (min_years) ทางอยู่ต่อใส่ term: true ไม่ให้ฉากครบสัญญาตามมาในปีถัดไป
# ลัทธิเถ้ากับผู้ฟังดาว: มีฉากเฉพาะสมาชิกที่ยังไม่มีใครรู้ (secret: true) คนที่เรื่องแตกไปแล้วโดนกองหรือวงตัดขาดตั้งแต่คืนนั้น

# ===================== ภาคีผู้เฝ้าผนึก =====================

- id: elder.wardens_lays_down
  stage: elder
  scene: fort
  time: night
  must: true
  when:
    age: [65, 68]
    org: wardens
  text: |
    คืนแรกของฤดูหนาวป้อมขานชื่อสองบัญชี บัญชีแรกคือคนที่ตายบนแนวในปีนั้น บัญชีที่สองสั้นกว่า บางปีไม่มีสักชื่อ เป็นชื่อของคนที่ป้อมให้ลงจากแนว ปีนี้บัญชีที่สองมีชื่อเดียว

    คนอ่านบัญชีอ่านชื่อของ{name}ด้วยเสียงเดียวกับที่อ่านบัญชีแรก ทั้งห้องกินข้าวเคาะชามกับโต๊ะหนึ่งครั้ง เด็กกะดึกที่นั่งปลายโต๊ะรินเหล้าลงจอกดีบุกตรงหน้า{name} รินจนล้น ไหลไปถึงขอบโต๊ะแล้วยังไม่หยุดจนคนข้างๆ ตีมือ ธรรมเนียมมีเท่านั้น ไม่มีใครลุกขึ้นกล่าวอะไร

    เกวียนถ่านขาลงออกจากประตูพรุ่งนี้เที่ยง ห้องเล็กข้างครัวที่ผนังอุ่นจากเตาทั้งคืนว่างมาตั้งแต่ปลายฝน สมุดเวรของหนาวนี้ยังเขียนไม่ครบทุกช่อง และเข่าของ{name}ลงบันไดหอระฆังได้วันละเที่ยวเดียว
  choices:
    - id: ride_the_coal_cart_down
      label: คืนของของป้อม แล้วขึ้นเกวียนถ่านขาลงตอนเที่ยง
      text: |
        {name}วางของของป้อมบนโต๊ะนายคลังทีละชิ้น ผ้าห่มขนแพะ รองเท้าหนาว ของที่ป้อมให้ถือตามยศ นายคลังขีดชื่อของแต่ละชิ้นในสมุด แล้วเลื่อนผ้าห่มคืนมา บอกว่าผืนนี้ป้อมตัดบัญชีไปหลายหนาวแล้ว

        หมู่บ้านใต้แนวมีคนที่ลงจากป้อมอยู่ก่อนสามคน นั่งม้านั่งหน้าร้านเหล้าตั้งแต่เที่ยง ทั้งสามเขยิบให้โดยไม่ถามชื่อ ถามแค่ว่าอยู่บนนั้นกี่หนาว พอ{name}ตอบ คนหนึ่งผิวปาก อีกคนบอกว่าของตัวเองมากกว่าสอง แล้วสั่งเหล้าให้ ถ้วยนี้ไม่มีใครรินจนล้น ข้างล่างนี่เหล้าต้องจ่ายเอง
      effects:
        mark: ลงจากแนวหิน
        clear_flags: [job_wardens, job_fort_priest]
        lose_items: [wardens_fort_key]
        location_tag: ashland
        gold: 2
        flags: [retired, left_the_fort, called_down_from_the_line]
    - id: room_by_the_kitchen
      label: ขอห้องเล็กข้างครัว อยู่ในป้อมต่อ
      text: |
        ห้องข้างครัวกว้างพอวางเตียงกับหีบ ผนังด้านที่ติดเตาอุ่นจนพิงหลังได้ทั้งคืน ป้อมไม่เขียนชื่อของ{name}ในสมุดเวรอีก แต่ก็ไม่มีใครขีดออกจากบัญชีข้าว

        เช้าไหนกะดึกกลับลงมา {name}นั่งรออยู่ที่หัวโต๊ะแล้ว ถามทีละคนว่าเห็นอะไร คนที่ตอบว่าไม่เห็นอะไรต้องตอบซ้ำอีกรอบ ช้าๆ เด็กใหม่บ่นกันว่าลงจากแนวมาแล้วยังต้องยืนเวรอีกกะที่โต๊ะข้าว บ่นเบาพอไม่ให้ถึงหัวโต๊ะ {name}ได้ยินทุกคำ
      effects:
        mark: อยู่ป้อมต่อในห้องข้างครัว
        reputation: { wardens: 1 }
        flags: [elder_of_wardens, kept_the_room_by_the_kitchen]
    - id: one_more_winter
      label: บอกคนอ่านบัญชีว่าอ่านผิดปี แล้วขึ้นไปอยู่เวรคืนนี้
      habit: stubborn
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ดื่มเหล้าที่ล้นจอกจนหมด คว่ำจอก แล้วขึ้นบันไดไปที่แนวก่อนกะดึกจะตั้งแถว ลมคืนแรกของหนาวพัดเถ้าขึ้นถึงเอว จุดแดงสองจุดขึ้นมาหลังแนวหินก่อนเที่ยงคืน เดินเลียบไปมา แล้วมาหยุดตรงหน้า{name}จนเกือบสาง {name}ไม่ได้ขยับเท้าสักครั้ง ขยับไม่ไหวด้วย เรื่องหลังนี้ไม่มีใครรู้

          เช้ามาคนอ่านบัญชีขีดชื่อของ{name}ออกจากบัญชีที่สอง เขียนกลับลงสมุดเวรในช่องท้ายสุด ลายมือกดแรงกว่าชื่ออื่นทั้งหน้า
        effects:
          mark: อยู่เวรเกินวัย
          stats: { CON: 1 }
          reputation: { wardens: 1 }
          flags: [elder_of_wardens, stood_the_line_past_the_calling]
      failure:
        text: |
          ลมคืนแรกของหนาวพัดเถ้าขึ้นถึงเอว {name}ยืนได้ถึงตีสอง แล้วเข่าซ้ายก็พับลงเองโดยไม่บอกก่อน เด็กกะดึกสองคนหิ้วปีกลงบันได อีกคนเดินถือตะเกียงนำหน้า ตลอดทางไม่มีใครเอ่ยถึงบัญชี

          ห้องข้างครัวมีคนปูเตียงไว้แล้วตอนไปถึง ผนังอุ่น บนหีบปลายเตียงมีจอกดีบุกใบเมื่อคืนวางคว่ำอยู่ ใครสักคนล้างมาให้
        effects:
          mark: อยู่ป้อมต่อในห้องข้างครัว
          hp: -1
          flags: [elder_of_wardens, kept_the_room_by_the_kitchen, knee_gave_on_the_last_watch]
    - id: name_the_next_elder
      label: ขานอีกชื่อหนึ่งต่อท้ายชื่อตัวเอง ชื่อของคนที่จะนั่งเก้าอี้ผู้เฒ่าแทน
      requires: { org: { id: wardens, min_rank: 4 } }
      text: |
        {name}ลุกขึ้นโดยไม่แตะจอก ขอบัญชีจากมือคนอ่าน แล้วขานอีกชื่อหนึ่งต่อท้ายชื่อตัวเอง ผู้ถือกุญแจที่นั่งกลางโต๊ะวางช้อนลงกลางคำ ห้องกินข้าวเคาะชามอีกครั้ง ดังกว่าครั้งแรก

        เช้ามา{name}ส่งกุญแจให้คนคนนั้นที่ประตูป้อม สั่งไว้เรื่องเดียว เบาะหนังแกะบนเก้าอี้ผู้เฒ่ายุบเป็นรูปคนอื่นมาตั้งแต่ก่อนสมัยของ{name} อย่าเปลี่ยน แล้วขึ้นเกวียนถ่านขาลง นั่งหันหน้าเข้าหาแนวหินไปจนพ้นโค้ง
      effects:
        mark: ส่งเก้าอี้ผู้เฒ่าป้อมต่อ
        clear_flags: [job_wardens, job_fort_priest]
        lose_items: [wardens_fort_key]
        location_tag: ashland
        reputation: { wardens: 1 }
        flags: [retired, left_the_fort, called_down_from_the_line, named_the_next_fort_elder]

# ===================== โรงรับเขี้ยว =====================

- id: elder.fang_house_lays_down
  stage: elder
  scene: market
  must: true
  when:
    age: [65, 68]
    org: fang_house
  text: |
    เช้านี้ตรงที่นั่งประจำของ{name}ในโรงรับเขี้ยวมีตะปูวางอยู่ตัวหนึ่ง ตะปูหัวเหลี่ยมตีมือ ยาวเท่านิ้วก้อย เด็กยกน้ำที่เอามาวางวิ่งหายไปหลังกระดานใบก่อนจะมีใครเห็นหน้า ธรรมเนียมนี้ไม่เว้นยศ คนของโรงคนไหนเดินจากประตูถึงโต๊ะชั่งช้ากว่าเด็กยกน้ำสามเช้าติดกัน เช้าที่สี่ได้ตะปู

    ตะปูไปได้สองที่ ที่แรกคือลิ้นชักใต้โต๊ะชั่ง หย่อนลงไปพร้อมป้าย แล้วเดินออกประตูเป็นคนที่โรงไม่ตาม ที่ที่สองคือไม้กระดานหลังโต๊ะ ตอกตะปูลงไป แขวนป้ายไว้บนนั้น กระดานแผ่นนั้นมีป้ายแขวนอยู่ไม่ถึงสิบแผ่น เจ้าของป้ายพวกนั้นไม่รับใบแล้ว แต่ยังมีที่บนม้านั่งริมเตา เวลานักล่าหนุ่มสาวเอาเขี้ยวที่ไม่มีใครรู้จักมาวาง คนที่โต๊ะชั่งจะหันไปทางม้านั่งตัวนั้น

    บนกระดานใบเช้านี้มีห้าใบ ใบล่างสุดเป็นงานเบา หมาจรจัดฝูงหนึ่งที่ท้ายตลาดปลา ค่าหัวสองเหรียญ
  choices:
    - id: into_the_drawer
      label: หย่อนตะปูกับป้ายลงลิ้นชักใต้โต๊ะชั่ง แล้วเดินออกประตู
      text: |
        ลิ้นชักเปิดได้ครึ่งเดียวเพราะป้ายข้างในแน่น ทองเหลือง เหล็กดำ บางแผ่นงอ บางแผ่นมีรอยเขี้ยว {name}ต้องเอามือกดป้ายเก่าลงก่อนถึงจะวางของตัวเองได้ คนที่โต๊ะชั่งดันลิ้นชักปิดด้วยเข่า แล้วชั่งของชิ้นต่อไป

        ออกจากโรงมาได้สามซอย มือของ{name}ยังเลื่อนไปแตะเข็มขัดตรงที่ป้ายเคยห้อย เย็นนั้นหมาเห่าอยู่ท้ายตลาดปลาทั้งฝูง {name}เดินอ้อมไปอีกทาง ซื้อปลากลับบ้านหนึ่งตัว จ่ายราคาเต็ม คนขายปลาไม่ลดให้คนไม่มีป้าย
      effects:
        mark: คืนป้ายให้โรงรับเขี้ยว
        org: { id: fang_house, leave: true }
        lose_items: [fang_brass_tag, fang_black_iron_tag]
        flags: [returned_the_fang_tag, laid_the_nail_in_the_drawer]
    - id: nail_the_board
      label: ตอกตะปูลงไม้กระดานหลังโต๊ะ แขวนป้ายไว้บนนั้น
      text: |
        {name}ยืมค้อนหัวเล็กของโต๊ะชั่งมาตอกเอง สามทีตะปูถึงเข้า เมื่อก่อนทีเดียว ป้ายแกว่งอยู่บนกระดานครู่หนึ่งแล้วนิ่ง อยู่ระหว่างป้ายของหญิงตาเดียวที่ไม่มีใครเคยเห็นหลับ กับป้ายของชายที่หลับอยู่ริมเตาตลอดวัน

        ม้านั่งริมเตามีเบาะฟาง คนที่นั่งอยู่ก่อนเขยิบให้กว้างกว่าที่ต้องเขยิบ ก่อนเที่ยงมีเด็กหนุ่มเอาเขี้ยวซี่หนึ่งมาวางบนโต๊ะ คนที่โต๊ะชั่งพลิกดูสองด้าน แล้วหันมาทางม้านั่ง {name}รอให้คนข้างๆ ตอบผิดก่อน
      effects:
        mark: แขวนป้ายบนกระดานตะปู
        reputation: { fang_house: 1 }
        flags: [elder_of_fang_house, hung_the_tag_on_the_nail_board]
    - id: one_light_paper
      label: เก็บตะปูใส่กระเป๋า แล้วปลดใบหมาจรจัดลงจากกระดาน
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          หมาฝูงนั้นมีเจ็ดตัว จ่าฝูงเป็นตัวเมียหูแหว่ง {name}ไม่ได้ไล่ ไปนั่งท้ายตลาดปลาตั้งแต่ก่อนสาง ดูว่าใครเทเศษปลาให้กิน คนเทคือยายขายปลาเค็มแผงสุดท้าย เทเพราะไม่อยากเสียค่าเกวียนขยะ {name}บอกราคาค่าเกวียน บอกราคาค่าหัวบนใบที่ตลาดต้องลงขันกัน แล้วให้นางคิดเอง

          สามวันต่อมาหมาย้ายไปเองทั้งฝูง หัวหน้าตลาดมาถอนใบที่โรง จ่ายสองเหรียญตามที่ลงชื่อไว้ คนที่โต๊ะชั่งจดลงสมุดว่าไม่มีซาก ไม่มีเขี้ยว เลื่อนเหรียญมาให้ แล้วเลื่อนค้อนหัวเล็กตามมา {name}ตอกตะปูลงกระดานหลังโต๊ะในบ่ายนั้น
        effects:
          mark: แขวนป้ายบนกระดานตะปู
          stats: { WIS: 1 }
          gold: 2
          flags: [elder_of_fang_house, hung_the_tag_on_the_nail_board, closed_a_paper_without_a_fang]
      failure:
        text: |
          หมาฝูงนั้นมีเจ็ดตัว {name}เห็นหกตัวก่อนตัวที่เจ็ดจะออกมาจากใต้แผงข้างหลัง หมาไม่ได้กัด แค่วิ่งชนเข่าข้างที่บวมอยู่แล้ว {name}ลงไปนั่งกับพื้นเปียกท้ายตลาดปลา คนขายปลาสองคนช่วยกันพยุงขึ้น คนหนึ่งถามว่าป้ายที่เข็มขัดนั่นของจริงหรือ

          นักล่าป้ายทองเหลืองคนหนึ่งปลดใบนั้นไปทำต่อในวันรุ่งขึ้น เสร็จก่อนเที่ยง {name}ตอกตะปูลงกระดานหลังโต๊ะเย็นวันเดียวกัน ตอกสี่ที เข่าบวมอยู่อีกครึ่งเดือน
        effects:
          mark: แขวนป้ายบนกระดานตะปู
          hp: -1
          flags: [elder_of_fang_house, hung_the_tag_on_the_nail_board]
    - id: hand_over_the_scale_seal
      label: ถอดตราตาชั่งจากคอ วางลงในมือคนที่จะนั่งโต๊ะแทน
      requires: { org: { id: fang_house, min_rank: 4 } }
      text: |
        ตราทองเหลืองรูปตาชั่งสึกจนลายเรียบลงไปอีกชั้นตั้งแต่วันที่{name}รับมา {name}วางตราลงในมือคนที่เลือกไว้ ตามด้วยกุญแจสองดอกของตู้สองชั้น เรื่องสมุดเขี้ยวในชั้นล่าง{name}บอกเท่าที่เคยได้ฟังมาเอง เปิดคนเดียว ปิดคนเดียว

        แล้ว{name}ก็ตอกตะปูของตัวเองลงกระดานหลังโต๊ะ แขวนป้าย ไปนั่งม้านั่งริมเตา เช้านั้นตาชั่งเอียงค้างอยู่ทางซ้ายนิดหนึ่งตั้งแต่ก่อนวางของชิ้นแรก {name}เห็นจากตรงที่นั่ง และรอดูว่าเจ้าโต๊ะคนใหม่จะเห็นเองไหม
      effects:
        mark: ส่งตราตาชั่งต่อ
        reputation: { fang_house: 1 }
        flags: [elder_of_fang_house, hung_the_tag_on_the_nail_board, handed_over_the_scale_seal]

# ===================== หน่วยไส้ตะเกียง =====================

- id: elder.wick_lays_down
  stage: elder
  time: night
  must: true
  when:
    age: [65, 68]
    org: wick
  text: |
    คืนนี้ชุดออกงานโดยไม่มี{name} ไม่มีใครบอกไว้ก่อน ตอนหัวค่ำที่ห้องถังใต้โรงน้ำมัน ถังที่{name}เคยแบกมีคนอื่นแบกขึ้นบันไดไปแล้ว บนฝาถังใบแรกมีเบาะฟางใบหนึ่งวางรออยู่

    หน่วยไม่มีธรรมเนียมวางมือ คนของหน่วยที่ขึ้นบันไดสิบเอ็ดขั้นตามชุดไม่ทันมีทางให้เลือกเท่ากับคนอื่น กับอีกทางหนึ่งที่มีให้เฉพาะคนแก่ ถังใบที่สามแถวซ้ายไม่เคยมีใครย้าย รอยชอล์กรูปประตูปิดบนฝาเลือนจนต้องเพ่ง ใครนั่งในควันจากถังนั้นทั้งคืน ตื่นมาจะไม่มีหน่วยอยู่ในหัว จำได้แค่ว่าป่วยนาน ส่วนเบาะฟางเป็นของคนเฝ้าห้องถัง คนที่นั่งอยู่ข้างล่างนี้ทุกคืน เติมน้ำมัน ขีดชอล์กซ้ำบนฝาที่เลือน และฟังว่าชุดกลับลงมาครบกี่คน

    ผู้ดับคนหนึ่งนั่งอยู่บนบันไดขั้นล่างสุด ช้อนกระดูกวางพาดเข่า รอโดยไม่เร่ง
  choices:
    - id: breathe_the_chalk_cask
      label: ขอน้ำมันจากถังใบที่สาม (คืนไม่ได้)
      text: |
        ผู้ดับตวงเถ้าด้วยช้อนกระดูก ปาดขอบให้เสมอ แล้วตวงอีกช้อน คนที่อยู่มานานต้องใช้มากกว่าคนที่อยู่มาไม่กี่หนาว ตะเกียงดวงเล็กตั้งบนฝาถัง ควันลงมาถึงไหล่ตอนที่{name}ยังนึกชื่อบ้านหลังแรกออก ลงถึงพื้นตอนนึกไม่ออกแล้ว

        {name}ตื่นในห้องคนไข้ของวิหารแห่งหนึ่ง หมอบอกว่าป่วยนาน {name}ถามว่านานแค่ไหน หมอดูผมขาวบนหมอน แล้วตอบว่านาน ออกจากวิหารมา{name}ไปหาห้องเช่า เจ้าของห้องถามว่าเมื่อก่อนทำงานอะไร {name}ดูมือตัวเอง ฝ่ามือด้านเป็นแนวตรง ไหล่เป็นร่องสายสะพาย แล้วตอบว่าแบกของ เจ้าของห้องคิดค่าเช่าราคาคนแบกของ
      effects:
        mark: ออกจากหน่วยไส้ตะเกียง
        org: { id: wick, leave: true }
        lose_traits: [oath_wick]
        lose_items: [wick_black_lamp]
        flags: [left_the_wick, woke_as_one_who_never_served]
    - id: take_the_straw_cushion
      label: หยิบเบาะฟางไปวางข้างถังใบแรก นั่งเฝ้าห้องถัง
      text: |
        เบาะฟางยุบเป็นรูปคนที่นั่งก่อนหน้า {name}ขยับอยู่ครึ่งคืนกว่าจะเข้าที่ งานของคนเฝ้าห้องถังไม่มีใครสอน เติมน้ำมันถังที่พร่อง ขีดชอล์กซ้ำบนฝาที่เลือน ทุกฝายกเว้นฝาใบที่สาม ใบนั้นปล่อยให้เลือนเอง

        ใกล้สางชุดกลับลงมา {name}ฟังเสียงเท้าบนบันไดสิบเอ็ดขั้นโดยไม่เงยหน้า ขึ้นไปห้าคน ลงมาห้าคน คนสุดท้ายวางถังเปล่าลงข้างเบาะ มือยังสั่น {name}เลื่อนถ้วยน้ำไปให้ และไม่ถามว่าบ้านหลังไหน
      effects:
        mark: ลงไปเฝ้าห้องถัง
        flags: [elder_of_wick, keeps_the_cask_room]
    - id: half_a_spoon
      label: ขอครึ่งช้อน ให้ลืมบ้านหลังเดียว แล้วอยู่เฝ้าห้องถัง
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          ผู้ดับถามว่าบ้านหลังไหน {name}บอกชื่อซอย บอกสีประตู บอกว่าในบ้านมีใครบ้างจนครบทุกคน ผู้ดับว่าคนที่ยังเล่าได้ครบขนาดนี้ต้องนั่งใกล้ตะเกียงกว่าปกติ แล้วตวงครึ่งช้อน ปาดขอบสองรอบ

          เช้ามา{name}จำซอยนั้นได้ จำสีประตูได้ จำไม่ได้ว่าเคยเข้าไปข้างใน คืนต่อมา{name}หลับก่อนเที่ยงคืนเป็นคืนแรกในรอบหลายหนาว หลับบนเบาะฟางข้างถังใบแรก ชุดกลับลงมาตอนสางต้องปลุก
        effects:
          mark: ลงไปเฝ้าห้องถัง
          hp: 1
          flags: [elder_of_wick, keeps_the_cask_room, forgot_one_house_by_half_a_spoon]
      failure:
        text: |
          ผู้ดับถามว่าบ้านหลังไหน {name}เริ่มเล่า แล้วเล่าปนกับบ้านอีกหลัง แล้วอีกหลัง บ้านพวกนั้นต่อกันเป็นถนนเดียวมานานแล้ว ผู้ดับฟังจนจบ ตวงครึ่งช้อน และบอกตรงๆ ว่าเถ้าเลือกไม่เป็น

          เช้ามาบ้านหลังนั้นยังครบทุกห้อง ที่หายไปคือฤดูหนาวหนึ่งฤดู หายทั้งฤดู {name}รู้ว่าหายเพราะรองเท้าคู่ที่ใส่อยู่ไม่เคยเห็นมาก่อน และคนในชุดคนหนึ่งทักเรื่องที่{name}ไม่รู้ว่าเคยทำ {name}หยิบเบาะฟางไปวางข้างถังใบแรก ไม่ขออีกครึ่งช้อน
        effects:
          mark: ลงไปเฝ้าห้องถัง
          flags: [elder_of_wick, keeps_the_cask_room, lost_a_winter_to_half_a_spoon]
    - id: measure_for_oneself
      label: ตวงเถ้าจากถังใบที่สามให้ตัวเอง แล้วเขียนแถบผ้าเส้นนอกสุดก่อนจุดตะเกียง (คืนไม่ได้)
      requires: { org: { id: wick, min_rank: 4 } }
      text: |
        เรื่องของคนที่ต้องลืมมากกว่าหนึ่งคืนไม่มีขนาด ผู้ดับตัดสินเอง คืนนี้{name}ตัดสินของตัวเอง ผู้ดับอีกคนนั่งดูจากบันไดโดยไม่ทักสักช้อน {name}ตวงสามช้อน ปาดขอบทุกช้อน แล้วตัดแถบผ้าเส้นใหม่ เขียนด้วยดินสอไขมัน ตัวโตพอให้คนตาแก่อ่านออก พันทับไว้นอกสุด

        {name}ตื่นในห้องคนไข้ของวิหารแห่งหนึ่ง ข้อมือซ้ายมีแถบผ้าพันหนาจนแขนเสื้อปิดไม่มิด เส้นในสุดบอกชื่อ เส้นนอกสุดเขียนว่า เจ้าป่วยนาน เจ้าไม่ได้ติดค้างใคร ลายมือเป็นของ{name}เอง {name}อ่านสองเส้นนั้นทุกเช้า เส้นที่อยู่ระหว่างกลางไม่เคยแกะออกดู
      effects:
        mark: ตวงเถ้าให้ตัวเอง
        org: { id: wick, leave: true }
        lose_traits: [oath_wick]
        lose_items: [wick_black_lamp]
        flags: [left_the_wick, woke_as_one_who_never_served, measured_own_forgetting]

# ===================== ภาคีเหล็กเย็น =====================

- id: elder.cold_iron_lays_down
  stage: elder
  scene: smithy
  time: night
  must: true
  when:
    age: [65, 68]
    org: cold_iron
  text: |
    เกวียนเหล็กเข้ามาถึงโรงไม้หลังร้านตีเกือกม้าตอนค่ำ {name}ยกแท่งเหล็กเย็นลงจากเกวียนได้สามแท่ง แท่งที่สี่ต้องวางพักกับพื้นก่อน เด็กมือเปล่าสองคนเข้ามายกต่อโดยไม่มีใครเรียก พอเกวียนว่าง บนลังไม้ข้างเตามีผ้ากระสอบพับรองไว้สองชั้น

    เตาไม่มีคำว่าวางมือ เตามีแต่วางของ กับนั่งลัง คนที่วางของของเตาลงบนทั่งแล้วเดินออกประตูโรงไม้ไป เตาไม่ตาม และเตาไม่รับกลับ ชื่อบนแผ่นเหล็กของคนนั้นได้รอยค้อนทับหนึ่งรอย ส่วนคนที่นั่งลัง เตาไม่เรียกออกงานอีก แต่คนที่กลับจากงานทุกคนต้องมายืนเล่าให้คนบนลังฟังก่อนจะได้นอน ว่าคืนนี้มือไปแตะอะไรมาบ้าง

    คนเฝ้าไฟคืนนี้โยนถ่านเข้าเตาอีกพลั่ว แล้วถอยไปยืนข้างประตู ทางระหว่าง{name}กับทั่งว่าง
  choices:
    - id: lay_it_on_the_anvil
      label: วางของของเตาลงบนทั่งทีละชิ้น แล้วเดินออกประตูโรงไม้ (คืนไม่ได้)
      text: |
        ของของเตาที่อยู่กับ{name}มีไม่กี่ชิ้น วางบนทั่งแล้วดังกว่าที่คิดทุกชิ้น คนเฝ้าไฟหยิบตัวตอกกับค้อนเล็ก พลิกห่วงแผ่นเหล็กไปที่แผ่นของ{name} ตอกลงหนึ่งที ไม่มีใครลา เตาไม่มีธรรมเนียมนั้นเหมือนกัน

        ข้างนอกยังไม่สาง {name}เดินผ่านร้านขายยาที่ตั้งขวดเรืองแสงไว้ในตู้หน้าร้าน ขวดแบบที่เคยเดินข้ามถนนหนีมาครึ่งชีวิต ยืนอยู่หน้าตู้จนคนขายออกมาถามว่าจะรับอะไร {name}ถามราคา แล้วเดินต่อ แพงไปสำหรับของที่ยังไม่รู้ว่าอยากได้จริงหรือเปล่า
      effects:
        mark: วางของคืนเตา
        org: { id: cold_iron, leave: true }
        lose_traits: [oath_cold_iron]
        lose_items: [iron_clapperless_bell, iron_halvins_hammer]
        flags: [left_the_cold_iron, laid_the_lodge_iron_down]
    - id: sit_on_the_crate
      label: นั่งลงบนลังข้างเตา
      text: |
        ผ้ากระสอบสองชั้นยังบางไปสำหรับสะโพกคนแก่ {name}บอกเด็กมือเปล่าให้ไปหามาอีกผืน เด็กไปทันที ไม่มีใครในเตาเคยวิ่งให้{name}เร็วเท่านี้

        ใกล้สางชุดกลับมา คนถือค้อนคนแรกมายืนตรงหน้าลัง เล่าว่าคืนนี้แตะอะไรมาบ้าง ประตูหนึ่งบาน ขวดสองใบ มือเด็กคนหนึ่งที่ร้อนผิดคน เล่าจบก็ยืนรอ {name}ปล่อยให้รอจนคนที่สองเริ่มขยับเท้า แล้วถามเรื่องมือเด็กซ้ำอีกรอบ
      effects:
        mark: นั่งลังข้างเตา
        reputation: { cold_iron: 1 }
        flags: [elder_of_cold_iron, sits_the_crate_by_the_forge]
    - id: keep_the_oath_alone
      label: วางของลงบนทั่ง แต่บอกเตาว่าคำสาบานจะเอาไปด้วย (คืนไม่ได้)
      habit: stubborn
      text: |
        คนเฝ้าไฟบอกว่าเตาไม่รับฝากคำสาบาน และไม่ทวงคืน ใครจะถืออะไรออกไปในหัวเป็นเรื่องของคนนั้น เขาตอกรอยค้อนลงบนแผ่นของ{name}เหมือนของทุกคน แรงเท่ากัน

        {name}กลับไปอยู่บ้านที่ไม่มีของอาบเวทสักชิ้น หนาวนั้นไอหนัก เพื่อนบ้านเอายาหม้อที่หญิงรู้ยาประจำซอยเป่าคาถาใส่มาให้ {name}เทลงรางน้ำต่อหน้า แล้วไออยู่อย่างนั้นจนสิ้นหนาว ไม่มีใครในซอยเอาอะไรมาให้อีก รวมทั้งซุป
      effects:
        mark: วางของคืนเตา
        org: { id: cold_iron, leave: true }
        lose_items: [iron_clapperless_bell, iron_halvins_hammer]
        hp: -1
        alignment: { law: 1 }
        flags: [left_the_cold_iron, laid_the_lodge_iron_down, kept_the_cold_iron_oath_alone]
    - id: pass_the_name_ring
      label: ปลดห่วงแผ่นเหล็กจากเอว วางบนทั่งให้คนที่จะถือต่อ แล้วไปนั่งลัง
      requires: { org: { id: cold_iron, min_rank: 4 } }
      text: |
        ห่วงหนักกว่าวันที่รับมาเท่ากับแผ่นที่{name}ตอกเพิ่มเอง {name}วางลงบนทั่ง คนที่{name}เลือกไม่ได้หยิบทันที พลิกหาแผ่นที่มีชื่อตัวเองก่อน เจอแล้วจึงร้อยห่วงเข้าเอว

        {name}ไปนั่งลัง เกวียนเหล็กเที่ยวถัดมา คนขับยื่นห่อผ้าเข้ามาในโรงไม้ให้ผู้เฒ่าคนใหม่ คนรับหันมาทางลังก่อนจะแก้ปม {name}ทำเป็นกำลังเขี่ยถ่าน
      effects:
        mark: ส่งห่วงชื่อของเตาต่อ
        reputation: { cold_iron: 1 }
        flags: [elder_of_cold_iron, sits_the_crate_by_the_forge, passed_the_name_ring]

# ===================== ห้องบัญชีหาย =====================

- id: elder.reclaimers_lays_down
  stage: elder
  scene: library
  time: dusk
  must: true
  when:
    age: [65, 68]
    org: reclaimers
  text: |
    ห้องบัญชีหายเขียนใบรับให้ทุกอย่างที่กลับเข้ามา หนังสือ ตรา กุญแจ ซากปกที่เหลือแต่สัน เย็นนี้บนโต๊ะของ{name}มีใบรับสีงาช้างเขียนไว้ครึ่งใบ ช่องรายการเป็นชื่อของ{name} ช่องสภาพเว้นว่าง ช่องลายมือชื่อผู้คืนเว้นว่าง

    คนของห้องเขียนใบแบบนี้ให้กันเมื่อถึงวัยที่ลงบันไดหินมาห้องใต้หอสมุดแล้วต้องพักทั้งสองชานพัก ไม่มีใครเซ็นแทนได้ และไม่มีกำหนดว่าต้องเซ็นเมื่อไร ใบของบางคนค้างอยู่ในลิ้นชักจนกระดาษเหลือง

    โต๊ะคัดบัญชีตัวในสุดว่างมาตั้งแต่ต้นปี โต๊ะนั้นไม่ต้องเดินตามรอยของ ไม่ต้องเคาะประตูบ้านใคร มีแต่สมุดบัญชีหายเล่มเก่าที่หมึกซีดจนต้องคัดใหม่ทั้งเล่ม ในสมุดพวกนั้นมีบรรทัดที่ยังไม่ปิดอยู่หลายร้อยบรรทัด บรรทัดหนึ่งเป็นลายมือของ{name}เอง
  choices:
    - id: sign_own_receipt
      label: กรอกช่องสภาพ เซ็นชื่อ แล้วขึ้นไปขอบัตรยืมข้างบน
      text: |
        ช่องสภาพ{name}เขียนว่าใช้งานมานาน สันหลวม หน้าครบ คนรับใบอ่านแล้วไม่ขำ ประทับตรา ฉีกต้นขั้วเก็บ ยื่นปลายขั้วคืนมา ของที่ห้องให้ถือตามยศคืนลงกล่องทีละชิ้น ทุกชิ้นได้ใบรับของตัวเอง

        บัตรยืมของหอสมุดข้างบนยืมได้ครั้งละสองเล่ม {name}ยืมเล่มที่เคยตามคืนมากับมือเมื่อหลายปีก่อน อ่านอยู่สองสัปดาห์ แล้วเอาไปคืนช้ากว่ากำหนดหนึ่งวัน ค่าปรับหนึ่งเหรียญ {name}จ่ายโดยไม่ต่อ และเก็บใบรับค่าปรับไว้ในกระเป๋าเสื้อ
      effects:
        mark: คืนตัวให้ห้องบัญชีหาย
        org: { id: reclaimers, leave: true }
        lose_items: [reclaim_brass_seal]
        gold: -1
        flags: [left_the_reclaimers, handed_everything_back, signed_own_receipt]
    - id: the_copying_desk
      label: พับใบรับเก็บเข้าลิ้นชัก แล้วย้ายไปนั่งโต๊ะคัดบัญชี
      text: |
        โต๊ะคัดบัญชีอยู่ติดผนังด้านที่ปล่องเตาของหอสมุดวิ่งผ่าน อุ่นกว่าโต๊ะไหนในห้อง {name}คัดวันละสิบหน้า เลขทะเบียนทุกตัวต้องตรง คนตามรอยรุ่นใหม่เดินมาถามที่โต๊ะทุกวันว่าบรรทัดนี้ใครเขียน บรรทัดนั้นแปลว่าอะไร

        {name}ตอบทุกข้อ ตอบช้า และให้คนถามจดเอง ลิ้นชักที่เก็บใบรับครึ่งใบ{name}ใส่กุญแจไว้ แล้วทำกุญแจหายเองภายในเดือนเดียว ไม่ได้ลงบัญชีหาย
      effects:
        mark: นั่งโต๊ะคัดบัญชี
        flags: [elder_of_reclaimers, took_the_copying_desk]
    - id: close_own_open_line
      label: ขอปิดบรรทัดที่เป็นลายมือตัวเองก่อน แล้วค่อยเซ็น
      check: { stat: INT, dc: 12 }
      success:
        text: |
          บรรทัดนั้นเป็นหนังสือเล่มบางเล่มหนึ่งที่{name}ตามไม่เจอตั้งแต่ปีแรกๆ จดไว้ว่ารอยขาดที่ท่าเรือ {name}นั่งอ่านบัญชีรับของปีเดียวกันทั้งเล่ม เจอเลขทะเบียนเดียวกันอยู่ในช่องรับ ลายมืออีกคน หมึกอีกสี เล่มนั้นกลับมาถึงห้องเองตั้งแต่ฤดูถัดไป คนรับไม่ได้เดินมาขีดฝั่งนี้

          {name}ขีดปิดบรรทัดด้วยหมึกของวันนี้ เขียนวันที่กำกับ แล้วเซ็นใบรับของตัวเองด้วยปากกาด้ามเดียวกัน ช่องสภาพเขียนว่าครบ
        effects:
          mark: คืนตัวให้ห้องบัญชีหาย
          org: { id: reclaimers, leave: true }
          lose_items: [reclaim_brass_seal]
          stats: { INT: 1 }
          flags: [left_the_reclaimers, handed_everything_back, signed_own_receipt, closed_own_open_line]
      failure:
        text: |
          บรรทัดนั้นเป็นหนังสือเล่มบางเล่มหนึ่งที่{name}ตามไม่เจอตั้งแต่ปีแรกๆ {name}นั่งอ่านบัญชีรับของปีเดียวกันได้ครึ่งเล่ม ตัวเลขเริ่มสลับที่กันเองตอนตะเกียงดวงที่สองหมดน้ำมัน เลขทะเบียนที่ท่องขึ้นใจมาตั้งแต่ปีนั้นหายไปสองหลักกลางบรรทัด

          ใกล้เที่ยงคืน{name}เซ็นใบรับของตัวเอง ช่องสภาพเขียนว่าขาดหนึ่งบรรทัด คนรับใบประทับตราให้ตามนั้น บรรทัดที่เปิดอยู่ตกไปอยู่ในกองของคนตามรอยรุ่นใหม่ เด็กคนนั้นปิดได้ในสามวัน แล้วเดินมาบอกถึงบ้าน
        effects:
          mark: คืนตัวให้ห้องบัญชีหาย
          org: { id: reclaimers, leave: true }
          lose_items: [reclaim_brass_seal]
          flags: [left_the_reclaimers, handed_everything_back, signed_own_receipt, left_one_line_open]
    - id: sign_the_chest_key_over
      label: เขียนใบรับกุญแจห้องหีบให้คนที่จะปิดหีบแทน แล้วเซ็นใบของตัวเอง
      requires: { org: { id: reclaimers, min_rank: 4 } }
      text: |
        {name}เขียนทีละใบ ใบแรก ได้รับกุญแจห้องหีบหนึ่งดอก ช่องลายมือชื่อเว้นไว้ให้คนที่{name}เลือก คนนั้นเซ็นโดยมือไม่สั่น แล้วถามว่าในห้องหีบมีอะไรบ้าง {name}ตอบว่าบัญชีห้องหีบมีช่องเข้าช่องเดียว ไปอ่านเอา

        ใบที่สองเป็นของ{name}เอง ช่องสภาพเขียนว่าปิดแล้ว เช้าวันรุ่งขึ้น{name}ขึ้นบันไดหินไปที่โต๊ะหน้าหอสมุด เสมียนถามชื่อ ถามที่อยู่ ถามว่าเคยมีบัตรยืมมาก่อนไหม
      effects:
        mark: ส่งกุญแจห้องหีบต่อ
        org: { id: reclaimers, leave: true }
        lose_items: [reclaim_brass_seal]
        flags: [left_the_reclaimers, handed_everything_back, signed_own_receipt, signed_the_chest_key_over]

# ===================== ลัทธิเถ้า (เฉพาะคนที่ยังไม่มีใครรู้) =====================

- id: elder.ash_cult_lays_down
  stage: elder
  scene: home
  must: true
  when:
    age: [65, 68]
    org: { id: ash_cult, secret: true }
  text: |
    ถ่านก้อนเดียวบนธรณีประตูคือนัด สองก้อนคือหนี เช้านี้บนธรณีประตูบ้าน{name}มีถ่านหนึ่งก้อน ห่อผ้าเปียกเหมือนทุกครั้ง แกะออกมาแล้วเย็น มอดสนิทถึงไส้ บีบแล้วแตกเป็นผงติดร่องนิ้ว ถ่านมอดไม่มีใครในกองเคยสอน และไม่มีใครในกองต้องถาม

    กองไม่ไล่คนแก่ กองแค่เลิกปลุก คนที่ได้ถ่านมอดไม่ต้องไปนัดอีก ไม่มีห่อมัดด้ายแดงมาถึงมืออีก เดินสวนคนของกองในตลาดก็ไม่มีใครขยับนิ้ว คืนที่เหลือทั้งหมดเป็นของตัวเอง ไม่มีเสียงทุ้มเรียกชื่อกลางฝัน

    นัดคืนนี้ยังมีตามเดิม ที่เดิม เวลาเดิม ไม่มีใครห้ามคนที่ได้ถ่านมอดเดินเข้าไป และยังไม่เคยมีใครลอง
  choices:
    - id: keep_the_dead_coal
      label: เก็บถ่านมอดใส่กระป๋องบนหิ้ง แล้วไม่ไปนัด
      text: |
        คืนนั้น{name}เข้านอนตั้งแต่หัวค่ำ แล้วตื่นกลางดึกตรงเวลานัดเองโดยไม่มีอะไรปลุก นอนฟังถนนจนสาง ไม่มีใครมาเคาะ ก่อนฟ้าสว่าง{name}ห่อของของกองที่อยู่กับตัวด้วยผ้าเปียก เอาไปวางคืนบนธรณีประตูที่รู้กัน

        เดือนต่อมาคนขายผักของกองทอนเงินให้ครบทุกเหรียญ วางบนแผง ไม่แตะมือ ในฝันก็ไม่มีใครเรียกชื่ออีก {name}ฝันเรื่องธรรมดาเป็นคืนแรกในรอบหลายปี ฝันว่าหาแกะไม่เจอ ตื่นมาโมโหอยู่ครึ่งเช้า
      effects:
        mark: ได้ถ่านมอดจากกอง
        org: { id: ash_cult, leave: true }
        lose_items: [ashcult_coal_tin]
        flags: [left_the_ash_cult, kept_the_dead_coal]
    - id: carry_it_to_the_meeting
      label: ถือถ่านมอดไปนัด วางคืนลงในชามไฟต่อหน้าทุกคน
      text: |
        ไม่มีใครในห้องหันมาตอน{name}เดินเข้าไป คนที่กำลังพูดหยุดกลางประโยค {name}เดินไปถึงชามไฟกลางวง วางถ่านมอดลงบนถ่านแดง แล้วนั่งลงบนกระสอบใบเดิม ถ่านก้อนนั้นไม่ติด ควันขึ้นเป็นเส้นตรงอยู่พักหนึ่ง แล้วก็ติด

        จบนัดมีคนยื่นไม้กวาดมือมาให้โดยไม่มีใครสั่ง {name}กวาดอยู่คนเดียวจนห้องดูเหมือนไม่เคยมีใครมา ตั้งแต่คืนนั้นกองเรียก{name}ว่าคนเฝ้าชาม คนเฝ้าชามมาก่อนทุกคน กลับหลังทุกคน และถ่านบนธรณีประตูบ้าน{name}อุ่นทุกก้อน
      effects:
        mark: กลับไปนั่งเฝ้าชามไฟของกอง
        world: { demon: 1 }
        flags: [elder_of_ash_cult, carried_the_dead_coal_back]
    - id: ask_who_laid_it
      label: ตามหาคนที่วางถ่านก้อนนี้ ถามตรงๆ ว่าทำไม
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          คนวางคือหญิงขายไข่ท้ายตลาด นางไม่ปฏิเสธ ชั่งไข่ไปพูดไป คนแก่ละเมอ อีกไม่กี่หนาว{name}จะต้องมีคนนอนเฝ้าไข้ คนเฝ้าไข้ได้ยินทุกคำ กองเสียคนไปแบบนั้นมาแล้วสองกอง {name}ถามว่าถ้ามีทางไม่ให้ละเมอล่ะ นางหยุดชั่ง

          {name}บอกทางเท่าที่คิดออกตรงนั้น นอนคว่ำ ขบผ้าไว้ในปาก ลงกลอนประตูจากข้างใน ไม่รับใครเข้าบ้านหลังมืด นางฟังจนจบ แล้วหยิบไข่ฟองหนึ่งจากก้นตะกร้าวางใส่มือ{name} ไข่ฟองนั้นอุ่นกว่าที่ไข่ควรอุ่น คืนนั้นที่นัดมีกระสอบใบเดิมวางรอ
        effects:
          mark: กลับไปนั่งเฝ้าชามไฟของกอง
          world: { demon: 1 }
          flags: [elder_of_ash_cult, bargained_back_into_the_cell]
      failure:
        text: |
          คนวางคือหญิงขายไข่ท้ายตลาด {name}ถามตรงๆ นางชั่งไข่ต่อ ถามซ้ำ นางบอกราคาไข่ ถามครั้งที่สาม นางเงยหน้าขึ้น ถามดังพอให้แผงข้างๆ ได้ยินว่าตกลงจะเอากี่ฟอง คนทั้งแถวหันมา

          {name}ซื้อไข่หกฟองที่ไม่ได้อยากได้ กลับถึงบ้านตอกดูทีละฟอง เป็นไข่ธรรมดาทั้งหก ก่อนสาง{name}ห่อของของกองที่อยู่กับตัวด้วยผ้าเปียก เอาไปวางคืนบนธรณีประตูที่รู้กัน
        effects:
          mark: ได้ถ่านมอดจากกอง
          org: { id: ash_cult, leave: true }
          lose_items: [ashcult_coal_tin]
          gold: -1
          flags: [left_the_ash_cult, kept_the_dead_coal]
    - id: let_the_voice_move_on
      label: ไปนัดคืนนี้ ยืนขึ้นกลางวงเหมือนทุกนัด แล้วรอดูว่าเสียงทุ้มจะมาทางปากของใคร
      requires: { org: { id: ash_cult, min_rank: 4, secret: true } }
      text: |
        {name}ยืนขึ้นกลางวง อ้าปากรอเหมือนทุกนัด ไม่มีอะไรมา ชามไฟแตกเปรี๊ยะหนึ่งที แล้วหญิงคนเก็บเถ้าที่นั่งริมประตูก็พูดขึ้นด้วยเสียงที่ต่ำกว่าเสียงของนางสองช่วง เรียกชื่อคนในกองทีละคน ชื่อของ{name}ไม่อยู่ในนั้น

        {name}ปลดด้ายแดงจากข้อมือตัวเอง พันให้ที่ข้อมือของนางสามรอบ แล้วเดินออกจากห้องก่อนทุกคนเป็นคืนแรกตั้งแต่ขึ้นเป็นปาก ถึงบ้าน{name}เอาถ่านมอดออกจากกระเป๋าเสื้อ ใส่เตา ก้อนนั้นติดไฟเหมือนถ่านทั่วไป ต้มน้ำได้หนึ่งกา
      effects:
        mark: ส่งเสียงทุ้มให้ปากใหม่
        org: { id: ash_cult, leave: true }
        lose_items: [ashcult_coal_tin]
        world: { demon: 1 }
        flags: [left_the_ash_cult, kept_the_dead_coal, the_voice_took_another_mouth]

# ===================== ผู้ฟังดาว (เฉพาะคนที่ยังไม่มีใครรู้) =====================

- id: elder.star_listeners_lays_down
  stage: elder
  time: night
  must: true
  when:
    age: [65, 68]
    org: { id: star_listeners, secret: true }
  text: |
    คืนวันอัสเทลนี้มีเก้าอี้ตัวหนึ่งตั้งชิดผนังห้องใต้หลังคา เก้าอี้มีเท้าแขน เบาะนวมเย็บมือ ผ้าห่มพับพาดพนัก ห้องนี้ไม่เคยมีเก้าอี้ตัวไหนอยู่นอกวงโต๊ะ ไม่มีใครบอกว่าใครยกมา และไม่มีใครบอกว่าของใคร

    วันอัสเทลก่อน ตอนหลังคาปิด คนในวงสองคนต้องดึงแขน{name}คนละข้างกว่าจะลุกจากพื้นไม้ได้ สะโพกลั่นดังจนคนที่กำลังพับเบาะหันมา วงไม่เคยบอกให้ใครเลิกมา และวงไม่เคยชวนใครซ้ำสองครั้ง ระหว่างสองอย่างนั้นวงมีเก้าอี้

    คนที่นั่งเก้าอี้ไม่ได้นอนหัวชนกับใคร อยู่ห่างช่องหลังคาสามก้าว ได้ยินเท่าที่มาถึงผนัง แต่เป็นคนเดียวในห้องที่เห็นทั้งวง เห็นว่าคืนนั้นปากของใครขยับ ตะเกียงดวงแรกกำลังจะหรี่
  choices:
    - id: take_the_chair
      label: นั่งเก้าอี้ คลี่ผ้าห่มคลุมตัก
      text: |
        เก้าอี้สูงพอดีเข่า ใครสักคนในวงวัดไว้ {name}นั่งลง ตะเกียงดับทีละดวง ช่องหลังคายกขึ้น คนอื่นนอนหงายหัวชนกันบนพื้น จากเก้าอี้เห็นหน้าทุกคนกลับหัว

        เสียงหึ่งมาถึงผนังเบากว่าที่กลางห้อง ใกล้สางชายขายเชือกที่นอนฝั่งหน้าต่างพูดขึ้นหนึ่งประโยคด้วยเสียงที่ไม่ใช่ของเขา คนจดคำตอบจดในความมืด เช้ามาชายคนนั้นไม่รู้ว่าเป็นตัวเอง ถามไปรอบวงว่าใครพูด ทุกคนหันมาทางเก้าอี้
      effects:
        mark: นั่งเก้าอี้ริมวงของผู้ฟังดาว
        world: { star: 1 }
        flags: [elder_of_star_listeners, sits_the_chair_by_the_wall]
    - id: lie_down_in_the_ring
      label: เดินผ่านเก้าอี้ ไปนอนลงในวงที่เดิม
      check: { stat: CON, dc: 12 }
      success:
        text: |
          พื้นไม้แข็งเท่าเดิม {name}นอนนิ่งจนหลังชา หายชา แล้วชาใหม่ ฟ้าในช่องหลังคาเลื่อนไปหนึ่งฝ่ามือ ใกล้สางมีมือสองข้างยื่นมาจะดึงแขน {name}บอกว่าไม่ต้อง พลิกตัวคว่ำ ชันเข่าทีละข้าง เกาะขอบโต๊ะ ลุกเอง ใช้เวลาเท่ากับที่คนอื่นพับเบาะเสร็จทั้งห้อง

          วันอัสเทลถัดมาเก้าอี้ตัวนั้นลงไปอยู่ที่ชานบันได มีคนเอากระถางต้นไม้มาวางบนเบาะ
        effects:
          mark: นอนฟังในวงเกินวัย
          world: { star: 1 }
          flags: [elder_of_star_listeners, lay_in_the_ring_past_the_chair]
      failure:
        text: |
          พื้นไม้แข็งเท่าเดิม ราวเที่ยงคืนหลังของ{name}ล็อกอยู่ในท่านั้น ขยับไม่ได้ทั้งซ้ายทั้งขวา {name}นอนฟังต่อจนสางเพราะไม่มีทางอื่น และไม่ยอมเรียกใคร พอหลังคาปิด คนในวงสี่คนช่วยกันยก หนึ่งในนั้นหัวเราะจนต้องปล่อยมือ

          {name}ลงบันไดด้วยการนั่งถัดลงทีละขั้น วันอัสเทลถัดมาเก้าอี้ตัวนั้นมีเบาะเพิ่มอีกใบ {name}นั่งลงโดยไม่เอ่ยถึงเรื่องพื้น
        effects:
          mark: นั่งเก้าอี้ริมวงของผู้ฟังดาว
          hp: -1
          flags: [elder_of_star_listeners, sits_the_chair_by_the_wall]
    - id: hand_back_the_blue_card
      label: วางบัตรหมึกน้ำเงินคืนบนหัวโต๊ะ แล้วลงบันไดก่อนตะเกียงดวงแรกจะดับ
      text: |
        บัตรหมึกน้ำเงินใบแรกอยู่ในกระเป๋าเสื้อตัวในมาตลอด มุมเปื่อยจนดาวเจ็ดแฉกเหลือห้า {name}วางบนหัวโต๊ะ ของที่วงให้ถือตามยศวางไว้ข้างกัน ทับทั้งหมดด้วยถ้วยชาของตัวเอง แล้วลงบันได ไม่มีใครตามลงมา วงไม่เคยตามใคร

        คนในวงที่เดินสวนกันในตลาดยังยกมือทักเหมือนเดิมทุกคน ไม่มีใครถามว่าทำไมไม่มา {name}รอให้มีคนชวนอยู่สามเดือน แล้วเลิกรอ คืนวันอัสเทล{name}เปิดบานเกล็ดไว้บานหนึ่งเสมอ บอกตัวเองว่าเพราะอากาศ
      effects:
        mark: คืนบัตรให้วงของผู้ฟังดาว
        org: { id: star_listeners, leave: true }
        lose_items: [listeners_blue_notebook]
        flags: [left_the_star_listeners, handed_back_the_blue_card]
    - id: hand_on_the_roof_hooks
      label: จับมือคนที่เลือกไว้วางลงบนตะขอเหล็ก ให้เป็นคนเปิดหลังคาคืนนี้ แล้วไปนั่งเก้าอี้
      requires: { org: { id: star_listeners, min_rank: 4, secret: true } }
      text: |
        ตะขอเหล็กสองตัวต้องดึงพร้อมกัน แรงเท่ากัน ไม่อย่างนั้นแผ่นหลังคาเอียงแล้วค้าง {name}จับมือคนที่เลือกไว้วางบนตะขอ มือของ{name}ทับอยู่ข้างบนตอนดึงครั้งแรก ครั้งที่สองปล่อย แผ่นหลังคายกขึ้นตรง ลมเย็นไหลลงมา

        {name}เดินไปนั่งเก้าอี้ คลี่ผ้าห่ม คืนนั้นคนเปิดหลังคาคนใหม่ลืมดับตะเกียงดวงที่อยู่หลังกาน้ำชา {name}เห็นตั้งแต่ต้น ปล่อยให้เขาหาเองอยู่ครู่หนึ่ง แล้วจึงกระแอม
      effects:
        mark: ส่งตะขอเปิดหลังคาต่อ
        world: { star: 1 }
        flags: [elder_of_star_listeners, sits_the_chair_by_the_wall, handed_on_the_roof_hooks]

# ===================== ศาลา (สายราชการ) =====================

- id: elder.crown_office_lays_down
  stage: elder
  scene: council_hall
  must: true
  when:
    age: [65, 68]
    org: crown_office
  text: |
    ใบวางปากกาของศาลามีช่องให้เขียนเหตุผลห้าช่อง ช่องละคำ แม่พิมพ์ตีเส้นไว้อย่างนั้นมาตั้งแต่ก่อนใครในศาลาจะเกิด เสมียนเล่าต่อกันมาว่าเคยมีหกช่อง แล้วมีคนเขียนคำที่หกได้เจ็บจนต้องแกะแม่พิมพ์ใหม่

    เช้านี้ใบแบบนั้นวางอยู่บนโต๊ะของ{name} มีคนกรอกชื่อ ตำแหน่ง และจำนวนปีที่รับเบี้ยไว้ให้ครบแล้ว ลายมือเด็กฝึกงาน เลขปีต้องเขียนเบียดกันเพราะช่องไม่พอ ช่องเหตุผลเว้นไว้ทั้งห้า ข้างใบมีถุงเบี้ยคนเก่าผูกเชือกรอ กับข่าวจากเด็กคนเดียวกันว่ามีคนยกม้านั่งตัวหนึ่งไปตั้งไว้ปลายระเบียงคำร้อง ตรงที่แดดเช้าถึง

    ชาวบ้านที่มายื่นคำร้องครึ่งหนึ่งอ่านแบบพิมพ์ไม่ออก เสมียนหนุ่มสาวไม่มีเวลาอ่านให้ ม้านั่งตัวนั้นมีไว้ให้คนที่มีเวลา
  choices:
    - id: five_words
      label: เขียนห้าคำ แล้วรับถุงเบี้ย
      text: |
        {name}เขียนว่า อ่านตัวเลขไม่ออกแล้ว เสมียนรับใบแตะปลายปากกานับทีละช่อง ครบห้า ประทับตรา แล้วขอของที่ศาลาให้ถือตามตำแหน่งคืนลงกล่อง ถุงเบี้ยเบากว่าที่ตาชั่งให้ {name}แก้เชือกนับตรงนั้น ขาดหนึ่งเหรียญ เสมียนเติมให้โดยไม่เถียง ศาลาหักทุกคนที่ไม่นับ

        บ่ายนั้น{name}เดินผ่านระเบียงคำร้องขาออก หญิงคนหนึ่งยื่นแบบพิมพ์มาขอให้ช่วยอ่าน {name}อ่านให้ทั้งใบ ทุกตัวเลข ชัดทุกตัว แล้วรีบเดินก่อนเสมียนรับใบจะหันมา
      effects:
        mark: วางปากกาคืนศาลา
        org: { id: crown_office, leave: true }
        lose_items: [office_second_key, office_district_seal]
        gold: 4
        flags: [left_the_crown_office, retired, wrote_five_words_for_the_hall]
    - id: the_bench_on_the_porch
      label: พับใบเก็บ แล้วไปนั่งม้านั่งปลายระเบียงคำร้อง
      habit: soft_heart
      text: |
        ม้านั่งตัวนั้นไม่มีชื่อตำแหน่ง ไม่มีเบี้ยเพิ่ม มีแต่คนต่อแถว {name}อ่านแบบพิมพ์ให้ฟังทีละใบ บอกว่าช่องไหนต้องเขียนอะไร ช่องไหนเขียนแล้วจะโดนเก็บเพิ่ม ช่องไหนเว้นไว้ได้โดยไม่มีใครว่า เรื่องสุดท้ายนี้{name}พูดเบาลง

        ภายในฤดูเดียวคำร้องที่โดนตีกลับลดลงครึ่งหนึ่ง นายของศาลาเดินมาดูม้านั่งด้วยตัวเองครั้งหนึ่ง ยืนฟังอยู่สองใบ แล้วกลับเข้าไปโดยไม่ได้สั่งให้ย้าย
      effects:
        mark: นั่งอ่านคำร้องให้ชาวบ้านที่ระเบียงศาลา
        org: { id: crown_office, term: true }
        city: { merit: 1, here: true }
        flags: [elder_of_crown_office, reads_forms_on_the_petition_porch]
    - id: two_pages_behind_the_form
      label: เขียนเหตุผลจริงยาวสองหน้า แนบท้ายใบ
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          เสมียนรับใบตีกลับตั้งแต่ยังไม่อ่าน แบบพิมพ์ไม่มีช่องให้แนบ {name}ไม่เถียง ถามเขาว่าใบร้องเรื่องเตาที่ชาวบ้านแนบแผนที่ซอยมาด้วย ศาลารับไหม เขาว่ารับ ถามว่าแผนที่อยู่ช่องไหนของแบบ เขาคิดอยู่ครู่ใหญ่ แล้วหยิบเข็มหมุดจากกล่อง

          สองหน้านั้นไปกับใบถึงโต๊ะนายของศาลา ไม่มีใครรู้ว่ามีคนอ่านไหม แต่ฤดูถัดมาใบวางปากกาของเสมียนอีกคนมีกระดาษแนบท้ายสามหน้า ของคนถัดไปห้า โรงพิมพ์ส่งคนมาถามว่าจะให้แกะแม่พิมพ์ใหม่หรือเปล่า
        effects:
          mark: วางปากกาคืนศาลา
          org: { id: crown_office, leave: true }
          lose_items: [office_second_key, office_district_seal]
          gold: 4
          stats: { CHA: 1 }
          flags: [left_the_crown_office, retired, pinned_two_pages_to_the_form]
      failure:
        text: |
          เสมียนรับใบตีกลับตั้งแต่ยังไม่อ่าน แบบพิมพ์ไม่มีช่องให้แนบ {name}ยื่นใหม่ ตีกลับ พับสองหน้านั้นให้เล็กลงแล้วยื่นอีก ตีกลับ ครั้งที่สี่{name}เขียนลงในช่องว่า ถามเอาเองก็แล้วกัน เสมียนแตะปลายปากกานับ ครบห้า ประทับตรา

          สองหน้านั้น{name}เอากลับบ้าน ใช้รองก้นหม้ออยู่พักหนึ่ง แล้วเปลี่ยนใจ เอาไปสอดใต้ประตูห้องเก็บสมุดของศาลาตอนไม่มีคน
        effects:
          mark: วางปากกาคืนศาลา
          org: { id: crown_office, leave: true }
          lose_items: [office_second_key, office_district_seal]
          gold: 4
          flags: [left_the_crown_office, retired, wrote_five_words_for_the_hall, slid_two_pages_under_the_record_door]
    - id: name_the_fourth_key
      label: เสนอชื่อคนนั่งเก้าอี้โต๊ะคลังแทน วางกุญแจดอกที่สี่ทับกระดาษไว้ แล้วค่อยเขียนใบของตัวเอง
      requires: { org: { id: crown_office, min_rank: 4 } }
      text: |
        โต๊ะคลังไม่ให้ขุนคลังตั้งคนแทนตัวเอง โต๊ะให้เสนอได้หนึ่งชื่อ {name}เขียนชื่อนายอำเภอคนหนึ่งที่ส่งสมุดเตามาตรงทุกปี รวมทั้งปีที่ตัวเลขออกมาน่าเกลียด แล้ววางกุญแจดอกที่สี่ทับกระดาษไว้ โต๊ะรับชื่อนั้นในเดือนเดียว เร็วกว่าที่โต๊ะเคยรับเรื่องไหน

        {name}เขียนห้าคำลงใบของตัวเองในวันที่คนนั้นมาถึง เบาะบนเก้าอี้ตัวที่สี่ยุบเป็นรูปของ{name}แล้ว คนมาใหม่นั่งลงไปโดยไม่ขยับหาที่
      effects:
        mark: ส่งกุญแจโต๊ะคลังต่อ
        org: { id: crown_office, leave: true }
        lose_items: [office_second_key, office_district_seal]
        gold: 5
        reputation: { crown: 1 }
        flags: [left_the_crown_office, retired, wrote_five_words_for_the_hall, named_the_next_treasury_seat]

# ===================== กองทัพ =====================

- id: elder.crown_army_lays_down
  stage: elder
  scene: fort
  must: true
  when:
    age: [65, 68]
    org: crown_army
  text: |
    เช้าวันแรกของหนาว เสมียนกองขีดบัญชีไล่ลงมาทีละชื่อ ชื่อละขีด ถึงชื่อของ{name}เขาไม่ขีด วางปากกาขวางบรรทัดไว้ แล้วออกไปยืนหน้ากระโจม ธรรมเนียมนี้ใช้กับทุกยศ ตั้งแต่พลทหารถึงคนที่นั่งโต๊ะแผนที่ ชื่อไหนที่ขีดท้ายชื่อยาวล้นขอบกระดาษลงไปถึงบรรทัดล่าง เจ้าของชื่อต้องเป็นคนขีดขีดถัดไปเอง หรือไม่ขีด

    ข้างสมุดมีใบปลดห่อผ้าน้ำมันกับถุงเบี้ยก้อน เตรียมไว้ให้คนที่ไม่ขีด

    สำหรับคนที่ขีด เสมียนพูดเข้ามาจากหน้ากระโจมโดยไม่หันหน้า เรือนกลองท้ายค่ายขาดคนเฝ้า คนเฝ้าเรือนกลองไม่ต้องตั้งแถว ไม่ต้องเดินทางไกล ขึงหนังกลองใหม่ปีละครั้ง ตีกลองเช้ากลองค่ำ กินข้าวหม้อเดียวกับกอง
  choices:
    - id: leave_the_stroke_undrawn
      label: ไม่ขีด รับใบปลดกับเบี้ยก้อน
      text: |
        เสมียนกลับเข้ามาลากเส้นปิดท้ายชื่อให้ นับเหรียญต่อหน้า แล้วยื่นใบปลดมาทั้งห่อ {name}คืนของของกองที่คลัง ผ้าห่ม กระติก เข็มขัด รองเท้าคู่ที่ดีกว่ายกให้พลทหารที่เท้าเท่ากัน คู่ที่ใส่อยู่กองไม่เอาคืน

        คืนแรกในห้องเช่า {name}ตื่นก่อนสางตรงเวลากลอง นั่งรอบนเตียงจนแดดขึ้น ไม่มีกลอง เจ้าของห้องเคาะฝามาบอกให้เลิกเดินไปเดินมา วันที่สาม{name}ซื้อไก่ตัวผู้มาหนึ่งตัว วันที่สี่เจ้าของห้องขึ้นค่าเช่า
      effects:
        mark: ได้ใบปลดจากกองทัพ
        org: { id: crown_army, leave: true }
        gold: 6
        flags: [discharged_from_the_army, retired, left_the_stroke_undrawn]
    - id: the_drum_house
      label: ขีดเอง แล้วย้ายย่ามไปเรือนกลอง
      text: |
        เรือนกลองมีกลองสามใบ ใบใหญ่หนังหย่อนมาสองหนาวเพราะคนเฝ้าคนก่อนมือไม่มีแรงดึงเชือก {name}ก็ไม่มี จึงเรียกพลทหารที่โดนกักบริเวณมาดึงแทน สอนให้ดึงไล่รอบวงทีละช่วงนิ้ว หนังตึงเสมอกันในเย็นเดียว

        กลองเช้าวันแรกดังกว่าที่ค่ายเคยได้ยินมาหลายปี ทั้งกองตื่นก่อนเวลาครึ่งชั่วยาม มีเสียงด่าลอยมาจากกระโจมสามหลัง {name}ตีต่อจนครบ
      effects:
        mark: ย้ายไปเฝ้าเรือนกลอง
        org: { id: crown_army, term: true }
        flags: [elder_of_crown_army, keeps_the_drum_house]
    - id: march_one_more_road
      label: ขีดเอง แล้วขอเดินทางสายไกลกับกองอีกหนาว
      habit: stubborn
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ทางสายไกลใช้เวลาเก้าวัน {name}เดินท้ายแถวทั้งเก้าวัน ไม่มีใครต้องแบกย่ามให้ วันที่หกพลทหารหนุ่มคนหนึ่งเท้าแตกจนเดินกะเผลก {name}สอนให้พันผ้าแบบที่คนรุ่นสงครามถ่านหินพันกัน แล้วเดินนำเขาไปจนถึงที่ตั้งกระโจม ช้ากว่ากองหนึ่งชั่วยาม

          ขากลับเสมียนกองเปิดบัญชีรอไว้ที่ประตูค่าย ขีดท้ายชื่อของ{name}ยาวลงไปถึงบรรทัดที่สาม เขาเลิกวางปากกาขวางบรรทัดนั้น
        effects:
          mark: เดินทางสายไกลเกินวัย
          org: { id: crown_army, merit: 1, term: true }
          reputation: { crown: 1 }
          flags: [elder_of_crown_army, marched_past_the_long_stroke]
      failure:
        text: |
          วันที่สี่ขาขวาของ{name}ไม่ยกแล้ว นายแถวไม่ถาม ชี้ไปที่เกวียนเสบียง {name}นั่งไประหว่างกระสอบถั่วจนสุดทาง คนขับเกวียนยื่นบังเหียนสำรองให้ถือไว้ จะได้ดูเหมือนมีงาน

          ขากลับย่ามของ{name}ไปอยู่ที่เรือนกลองก่อนตัวจะถึง มีคนขึงหนังกลองใบใหญ่ไว้ให้แล้ว หย่อนไปข้างหนึ่ง {name}ต้องแก้ใหม่ทั้งใบ
        effects:
          mark: ย้ายไปเฝ้าเรือนกลอง
          org: { id: crown_army, term: true }
          hp: -1
          flags: [elder_of_crown_army, keeps_the_drum_house, rode_the_supply_cart]
    - id: hand_on_the_map_pin
      label: ถอนหมุดของกองตัวเองออกจากแผนที่ วางในมือคนที่จะนั่งเก้าอี้แทน แล้วรับใบปลด
      requires: { org: { id: crown_army, min_rank: 4 } }
      text: |
        {name}ถอนหมุดหัวทองเหลืองของกองตัวเองออกจากแผนที่ กระดาษรอบรูเป็นวงสนิม วางหมุดลงในมือนายร้อยที่{name}ส่งชื่อขึ้นไปเอง บอกให้ปักกลับลงรูเดิมไปก่อน อย่าเพิ่งขยับจนกว่าจะนั่งโต๊ะนี้ครบหนึ่งหนาว เขาปักเบี้ยวไปครึ่งเล็บ {name}ไม่ได้แก้ให้

        ใบปลดของ{name}มาถึงพร้อมเบี้ยก้อนในห่อผ้าน้ำมันเหมือนของพลทหารทุกคน หนาเท่ากัน ตราเท่ากัน ต่างกันที่มีคนมายืนส่งที่ประตูค่าย
      effects:
        mark: ส่งหมุดของกองต่อ
        org: { id: crown_army, leave: true }
        gold: 6
        reputation: { crown: 1 }
        flags: [discharged_from_the_army, retired, left_the_stroke_undrawn, handed_on_the_map_pin]

# ===================== ราชสำนัก =====================

- id: elder.crown_court_lays_down
  stage: elder
  scene: noble_hall
  must: true
  when:
    age: [65, 68]
    org: crown_court
  text: |
    เช้านี้หีบของ{name}ไม่อยู่ในห้อง คนยกของสองคนแบกไปไว้ที่ปีกสวนครัวตั้งแต่ก่อนระฆังเช้า ไม่มีกระดาษสั่ง ไม่มีใครลงชื่อ ในวังเรื่องแบบนี้ไม่เคยมีกระดาษ

    ปีกสวนครัวมีสิบสองห้อง หน้าต่างทุกบานเห็นแปลงหัวหอม อุ่นที่สุดในวังเพราะอยู่เหนือครัว และไกลประตูชั้นในที่สุดเท่าที่ยังนับว่าอยู่ในวัง คนที่ย้ายมาอยู่ปีกนี้ไม่มีกระดาษผ่านมืออีก แต่ใครในวังอยากรู้ว่าธรรมเนียมข้อไหนมาจากไหน บันไดไหนใครใช้ได้ ใครเคยเป็นคนของใครมาก่อน ต้องเดินมาถามที่นี่ และต้องถือของมาด้วย

    อีกทางคือประตูข้างฝั่งโรงม้า ประตูที่คนออกจากวังใช้กัน คนเฝ้าประตูนั้นไม่ถามชื่อคนขาออก ที่หัวบันไดมีคนยืนรอ{name}อยู่สองคน ไม่ได้มาด้วยกัน และทำเป็นไม่เห็นกัน
  choices:
    - id: out_the_stable_gate
      label: ไปยกหีบกลับ ออกทางประตูโรงม้า ไม่หยุดคุยกับใคร
      text: |
        คนที่ยืนรอทั้งสองเดินตามมาคนละฝั่งระเบียง คนหนึ่งเอ่ยชื่อบ้านใหญ่บ้านหนึ่ง อีกคนเอ่ยตัวเลข {name}ทำหูตึง หูตึงเป็นของที่คนแก่ในวังใช้ได้โดยไม่มีใครกล้าพิสูจน์ ทั้งสองเลิกตามที่ประตูโรงม้า

        ห้องเช่าในเมืองแคบกว่าห้องในวังครึ่งหนึ่ง และไม่มีใครยกน้ำร้อนมาให้ เดือนแรกมีคนแปลกหน้ามาเคาะประตูสี่คน เดือนที่สองสองคน เดือนที่สามไม่มี {name}นั่งรออยู่ทั้งเดือน แล้วโมโหที่ไม่มีใครมา
      effects:
        mark: ออกจากราชสำนัก
        org: { id: crown_court, leave: true }
        alignment: { law: 1 }
        flags: [left_the_court, retired, left_the_court_with_a_shut_mouth]
    - id: sell_what_the_court_taught
      label: ออกทางประตูโรงม้า แล้วหยุดฟังว่าคนไหนให้มากกว่า (ของแบบนี้ติดตัวไปนาน)
      habit: cold_blood
      text: |
        คนที่เอ่ยตัวเลขให้มากกว่าคนที่เอ่ยชื่อบ้าน {name}ขายไปสามเรื่อง เรื่องแรกใครในวังก็รู้อยู่แล้ว เรื่องที่สองเก่าจนคนในเรื่องตายหมด เรื่องที่สามเรื่องเดียวที่เป็นของจริง คนซื้อจ่ายเท่ากันทั้งสามเรื่องเพราะแยกไม่ออก

        ปลายฤดูนั้นมหาดเล็กคนหนึ่งโดนย้ายไปเฝ้าคลังเทียนโดยไม่มีใครบอกเหตุ เขาเคยยกน้ำร้อนให้{name}ทุกเช้าอยู่หลายปี {name}เอาเงินจากเรื่องที่สามจ่ายค่าเช่าห้องล่วงหน้าทั้งปี
      effects:
        mark: ออกจากราชสำนัก
        org: { id: crown_court, leave: true }
        gold: 6
        alignment: { moral: -1 }
        reputation: { crown: -1 }
        flags: [left_the_court, retired, sold_what_the_court_taught]
    - id: the_kitchen_garden_wing
      label: เดินไปปีกสวนครัว เลือกห้องที่เห็นประตูครัว
      text: |
        {name}เลือกห้องที่สามจากหัวระเบียง หน้าต่างเห็นประตูครัวกับทางที่คนยกน้ำร้อนทุกคนต้องผ่าน ใครขึ้นไปชั้นไหน ถือถาดของใคร กลับลงมาเร็วหรือช้า เห็นหมดโดยไม่ต้องลุกจากเก้าอี้

        คนแรกมาถามในสัปดาห์นั้น ข้ารับใช้ใหม่ที่ไม่รู้ว่าบันไดเวียนฝั่งเหนือห้ามใช้หลังระฆังค่ำ เด็กถือส้มเชื่อมมาหนึ่งกระปุก {name}ตอบเรื่องบันได แล้วบอกว่าคำถามหน้าให้เอาของที่ไม่ติดฟันมา
      effects:
        mark: ย้ายไปปีกสวนครัวของวัง
        org: { id: crown_court, term: true }
        flags: [elder_of_crown_court, keeps_a_window_on_the_kitchen_door]
    - id: leave_the_river_stone
      label: ลุกจากเก้าอี้ที่ปรึกษาเอง ทิ้งของไว้บนโต๊ะหนึ่งชิ้นให้คนที่จะมานั่ง แล้วย้ายไปปีกสวนครัว
      requires: { org: { id: crown_court, min_rank: 4 } }
      text: |
        ที่ปรึกษาตั้งคนแทนตัวเองไม่ได้ ทำได้แค่ลุก กับทิ้งของ {name}ลุกในเช้าที่ปากกาของโต๊ะเวียนมาถึงมือพอดี เขียนกระดาษของเวรจนจบแผ่น แล้ววางกรวดแม่น้ำก้อนหนึ่งไว้ตรงหน้าเก้าอี้ ก้อนที่ใช้ทับกระดาษแผ่นที่อยากให้โต๊ะอ่านซ้ำก่อนตราจะลง

        คนที่มานั่งเก้าอี้ตัวนั้นเดินมาถึงปีกสวนครัวในเดือนที่สอง ถือกรวดมาด้วย ถามว่าต้องทับแผ่นไหน {name}รับขนมที่เขาถือมาอีกมือก่อน แล้วตอบว่าแผ่นที่อ่านรอบแรกแล้วเห็นด้วยทันที
      effects:
        mark: ลุกจากเก้าอี้ที่ปรึกษา
        org: { id: crown_court, term: true }
        reputation: { crown: 1 }
        flags: [elder_of_crown_court, keeps_a_window_on_the_kitchen_door, left_the_river_stone_on_the_table]

# ===================== คนเก่าที่อยู่ต่อ: เรื่องที่มีแต่คนบนม้านั่ง หัวโต๊ะ กับเบาะฟาง ตอบได้ =====================
# ออกเฉพาะกับคนที่เลือกอยู่ต่อในฉากวางมือ (elder_of_<องค์กร>) สามองค์กรที่มีคนถึงวัยนี้มากที่สุด

- id: elder.fang_old_hand_six_sided_tooth
  stage: elder
  scene: market
  weight: 20
  when:
    age: [66, 84]
    flags: [elder_of_fang_house]
  text: |
    เขี้ยวที่วางอยู่บนโต๊ะชั่งยาวเท่าฝ่ามือ โค้งกลับหลังอย่างเขี้ยวหมูป่า แต่โคนเป็นเหลี่ยม หกเหลี่ยม เรียบเหมือนมีคนตะไบ คนที่โต๊ะชั่งพลิกดูจนครบทุกด้าน เปิดสมุดเขี้ยวสองรอบ แล้วหันมาทางม้านั่งริมเตา

    คนที่เอามาวางเป็นนักล่าป้ายทองเหลืองที่หนวดยังขึ้นไม่เต็มปาก แขนเสื้อขวาขาดถึงศอก เขาว่าแทงได้ที่ปากเหมืองร้าง ตัวนั้นเดินกลับเข้าไปข้างในเองโดยมีหอกของเขาคาสีข้างไปด้วย เขาจะกลับไปเอาอีกสามซี่พรุ่งนี้ ถ้าโรงตั้งราคาให้

    {name}เคยเห็นเขี้ยวโคนเหลี่ยมมาครั้งเดียว บนโต๊ะตัวนี้ สมัยที่ยังไม่มีใครวางตะปูให้ คนที่เอามาวางคราวนั้นกลับเข้าไปเอาซี่ที่สอง ป้ายของเขาอยู่ในลิ้นชัก
  choices:
    - id: price_it_for_three_hunters
      label: บอกชื่อที่คนรุ่นก่อนใช้เรียก แล้วตั้งราคาให้สูงพอที่โรงต้องส่งป้ายเหล็กดำไปสามคน
      check: { stat: INT, dc: 12 }
      success:
        text: |
          {name}นึกชื่อออกตอนเอานิ้วลูบเหลี่ยมที่โคน คนรุ่นก่อนเรียกว่าหมูหิน ไม่ใช่หมู และไม่มีใครรู้ว่าเกี่ยวอะไรกับหิน ราคาที่{name}บอกทำให้คนที่โต๊ะชั่งวางปากกา แต่เขาก็เขียนใบตามนั้น ใบเดียว สามชื่อ เด็กหนุ่มได้ค่าชี้รูสองเหรียญกับคำสั่งให้อยู่ปากเหมือง

          ป้ายเหล็กดำสามคนกลับมาในหกวัน ครบสามคน เขี้ยวสี่ซี่ กับหอกของเด็กหนุ่มที่งอเป็นตะขอ คนที่โต๊ะชั่งเขียนชื่อหมูหินลงสมุดเขี้ยวด้วยหมึกใหม่ เว้นช่องคนบอกชื่อไว้ {name}บอกให้เขียนว่าม้านั่ง
        effects: { stats: { INT: 1 }, gold: 1, reputation: { fang_house: 1 }, flags: [named_the_six_sided_tooth] }
      failure:
        text: |
          ชื่อนั้นอยู่ที่ปลายลิ้น{name}ทั้งบ่าย ไม่ยอมออกมา {name}เลยบอกราคาเท่าที่จำได้ว่าเคยจ่ายคราวก่อน ราคาของสมัยที่ขนมปังก้อนละครึ่งของวันนี้ คนที่โต๊ะชั่งเขียนใบตามนั้น ราคาต่ำพอให้เด็กหนุ่มรับไปทำคนเดียว

          เขากลับมาในสี่วัน ไม่มีเขี้ยว ไม่มีหอก เดินกะเผลกมานั่งลงบนม้านั่งริมเตาโดยไม่มีใครเชิญ คนบนม้านั่งเขยิบให้ ชื่อนั้นกลับมาหา{name}ตอนนั้นเอง หมูหิน {name}บอกเขา เขาว่าเรียกอะไรก็ได้
        effects: { reputation: { fang_house: -1 }, flags: [underpriced_the_six_sided_tooth] }
    - id: tell_of_the_tag_in_the_drawer
      label: บอกว่าไม่รู้จัก แล้วเล่าเรื่องป้ายในลิ้นชักให้ฟัง
      habit: soft_heart
      text: |
        {name}เล่าเท่าที่เห็นมากับตา เขี้ยวซี่แรกบนโต๊ะ คนที่กลับเข้าไป ถุงผ้าที่ชาวเหมืองส่งมาทีหลัง เด็กหนุ่มถามว่าคนนั้นไปคนเดียวหรือ {name}ว่าคนเดียว เขาหยิบเขี้ยวคืนจากโต๊ะ บอกว่าจะเอาไปขายสถาบันหลวงเป็นของแปลกแทน ได้มากกว่าค่าหัวสามเท่า

        ใบเหมืองร้างยังไม่มีใครเขียน ชาวบ้านปากเหมืองส่งคนมาถามที่โรงทุกเดือนว่าแพะที่หายจะมีใครรับไปดูไหม คนที่โต๊ะชั่งชี้มาทางม้านั่งทุกครั้ง
      effects: { alignment: { moral: 1 }, reputation: { fang_house: -1 }, flags: [talked_a_hunter_out_of_the_shaft] }
    - id: call_it_an_old_boar
      label: บอกว่าหมูป่าแก่ โคนเขี้ยวสึกเพราะขุดหิน ราคาสองเหรียญ
      habit: tight_fist
      text: |
        คนที่โต๊ะชั่งจดตามนั้น หมูป่า แก่ สองเหรียญ เด็กหนุ่มมองเขี้ยว มองเหรียญ แล้วว่าสองเหรียญไม่คุ้มค่าหอกเล่มใหม่ ทิ้งเขี้ยวไว้บนโต๊ะ ไปรับใบหมาจรจัดแทน

        เขี้ยวซี่นั้นลงลิ้นชักของไม่มีราคา ไม่มีใครกลับไปที่เหมืองร้าง คนที่โต๊ะชั่งไม่หันมาทางม้านั่งอีกทั้งฤดู ครั้งแรกที่เขาหันมาอีก เขาถามเรื่องอื่น และไม่ได้จดคำตอบ
      effects: { alignment: { moral: -1 }, flags: [called_the_six_sided_tooth_a_boar] }

- id: elder.wardens_old_hand_one_stone_over
  stage: elder
  scene: fort
  weight: 20
  when:
    age: [66, 84]
    flags: [elder_of_wardens]
  text: |
    สมุดนับหินสองเล่มกางอยู่บนโต๊ะข้าวตรงหน้า{name}ตั้งแต่ยังไม่สาง ผู้นับหินสองคนยืนอยู่คนละฝั่งโต๊ะ ไม่ยอมนั่ง กะหัวค่ำนับหินในช่วงของป้อมได้จำนวนหนึ่ง กะดึกนับได้เกินมาหนึ่งก้อน ทั้งสองคนนับคนละสามรอบ ได้เท่าเดิมทั้งสามรอบ

    หินบนแนวไม่มีทางเพิ่ม มีแต่แตก ทรุด หรือหาย {name}นั่งหัวโต๊ะห้องนี้มานานพอจะรู้ว่านับเกินเกิดได้สามแบบ คนนับหลับใน มีคนเอาหินมาตั้งแทรกให้สมุดสวยก่อนคนจากป้อมอื่นมาตรวจ หรือมีอะไรที่ไม่ใช่หินไปอยู่ในแถว แบบที่สาม{name}เคยได้ยินครั้งเดียว และคนเล่าก็ฟังมาอีกทอด

    ฟ้ายังไม่สว่างพอจะเห็นแนวจากหน้าต่าง เด็กกะเช้ายืนถือหอกรออยู่ที่ประตู ยังไม่มีใครสั่งให้ออก
  choices:
    - id: go_and_knock_every_stone
      label: ออกไปที่แนวเอง เคาะทีละก้อน
      check: { stat: CON, dc: 12 }
      success:
        text: |
          {name}เดินไปกับไม้เท้ากับเด็กกะเช้าสองคน เคาะหินทีละก้อนด้วยโคนไม้ ก้อนไหนก็ดังแน่น จนถึงช่วงกลางแนว ก้อนหนึ่งเตี้ยกว่าเพื่อนหนึ่งคืบ เถ้าเกาะหนาเท่ากัน เคาะแล้วทึบ {name}ถอยหนึ่งก้าว เอาปลายไม้เขี่ยเถ้าออก ก้อนนั้นลืมตา แดงสองจุด

          เด็กสองคนแทงพร้อมกันก่อนมันจะลุก แตกเป็นถ่านคุกองเดียว ไม่ลาม ผู้นับหินทั้งสองแก้สมุดด้วยมือตัวเองต่อหน้า{name} เล่มกะดึกเขียนเพิ่มหนึ่งบรรทัด ว่านับถูก
        effects: { stats: { CON: 1 }, reputation: { wardens: 1 }, flags: [found_the_thing_lying_in_the_line] }
      failure:
        text: |
          {name}ไปได้ถึงตีนบันไดชั้นนอก เข่าไม่ยอมลงขั้นสุดท้าย เลยสั่งจากตรงนั้น เคาะทุกก้อนด้วยโคนหอก ก้อนไหนทึบให้ถอยก่อนแล้วค่อยแทง เด็กกะเช้าสองคนออกไป {name}นั่งรออยู่บนขั้นบันไดจนก้นชา

          ทั้งสองกลับมาตอนแดดขึ้น คนหนึ่งคิ้วไหม้ไปข้าง ก้อนที่ทึบอยู่ช่วงกลางแนว เขาเคาะแล้วลืมถอย ผู้นับหินแก้สมุดทั้งสองเล่ม เด็กคิ้วไหม้มายืนที่หัวโต๊ะเช้าวันรุ่งขึ้นโดยไม่ต้องเรียก เล่าทุกขั้น รวมทั้งขั้นที่ลืม
        effects: { hp: -1, flags: [sent_the_boys_to_knock_the_stones] }
    - id: ask_who_comes_to_inspect
      label: ถามก่อนว่าสัปดาห์นี้ป้อมไหนจะส่งคนมาตรวจสมุด
      text: |
        ผู้นับหินกะหัวค่ำตอบช้าไปครึ่งลมหายใจ {name}ไม่ถามต่อ รอ เขาเล่าเองว่าหินก้อนหนึ่งในช่วงของเขาร้าวจนล้มไปตั้งแต่ต้นเดือน เขาไม่ได้ลงสมุดเพราะคนตรวจจะมา คืนก่อนเขาเลยกลิ้งหินจากกองซ่อมมาตั้งแทน ลืมไปว่าในสมุดตัวเองหักก้อนที่ล้มไว้แล้วตั้งแต่วันแรก

        {name}ให้เขากลิ้งก้อนนั้นกลับกองซ่อมคนเดียวก่อนกินข้าวเช้า แล้วเขียนเรื่องทั้งหมดลงสมุดด้วยลายมือตัวเอง คนตรวจมาถึงปลายสัปดาห์ อ่านหน้านั้นสองรอบ ถาม{name}ว่าป้อมนี้ลงสมุดกันแบบนี้ทุกเรื่องหรือ {name}ตอบว่าตั้งแต่เช้าวันนั้น
      effects: { alignment: { law: 1 }, reputation: { wardens: 1 }, flags: [made_the_counter_write_the_fallen_stone] }
    - id: swap_their_watches
      label: ให้สองคนสลับกะกันคืนนี้ แล้วนับใหม่
      text: |
        คืนนั้นคนกะดึกไปยืนหัวค่ำ คนหัวค่ำไปยืนดึก เช้ามาสมุดสองเล่มตรงกันทุกช่อง ไม่มีใครอธิบาย {name}ก็ไม่ถาม สามวันต่อมาคนกะหัวค่ำเดิมมาขอย้ายไปอยู่กะเช้าเอง ให้เหตุผลว่าตาไม่ดีตอนโพล้เพล้

        {name}ให้ย้าย แล้วให้เขาเป็นคนแรกที่ต้องยืนตอบที่หัวโต๊ะทุกเช้าไปจนสิ้นหนาว เขาตอบยาวขึ้นทุกวัน ปลายหนาวไม่มีใครในป้อมนับหินได้ละเอียดเท่าเขา
      effects: { stats: { WIS: 1 }, flags: [swapped_the_two_counters] }

- id: elder.wick_old_hand_the_one_who_came_down
  stage: elder
  time: night
  weight: 20
  when:
    age: [66, 84]
    flags: [elder_of_wick]
  text: |
    กลางดึก ชุดยังไม่กลับ มีเสียงเท้าคนเดียวลงบันไดสิบเอ็ดขั้นมา ไส้คนหนึ่งของชุด อยู่กับหน่วยมาไม่กี่หนาว ถังบนหลังยังเต็ม เขาวางถังลงข้างเบาะฟางของ{name} นั่งลงบนบันไดขั้นล่างสุด แล้วถามว่าถังใบที่สามแถวซ้ายคือใบไหน

    เขารู้อยู่แล้วว่าใบไหน ทุกคนในหน่วยรู้ รอยชอล์กบนฝาใบนั้นเลือนจนเหลือแค่เงาของรูปประตู เขาเล่าว่าบ้านคืนนี้มีเด็กสามคน คนเล็กถามเขาว่าพรุ่งนี้จะยังจำพี่ได้ไหม เขาตอบไม่ได้ แล้วเดินออกมากลางงาน

    เถ้าเป็นของผู้ดับ ผู้ดับตวง ผู้ดับตัดสิน คนเฝ้าห้องถังมีแต่กุญแจตู้ตะเกียงกับชอล์กหนึ่งแท่ง ผู้ดับของชุดจะกลับลงมาตอนสาง ถึงตอนนั้นหน่วยจะรู้ว่าไส้คนหนึ่งทิ้งงานกลางบ้าน
  choices:
    - id: chalk_the_door_again
      label: หยิบชอล์ก ขีดรูปประตูบนฝาใบที่สามให้ชัด แล้วบอกให้เขานั่งรอผู้ดับ
      text: |
        ชอล์กลากผ่านร่องเก่าได้ง่ายเหมือนมีคนขีดนำไว้ รูปประตูกลับมาขาวทั้งบาน ไส้คนนั้นดูอยู่จนเส้นสุดท้าย แล้วนั่งรอโดยไม่ถามอะไรอีก ตอนสางผู้ดับลงมา เห็นรอยชอล์กใหม่ก่อนเห็นคน ไม่ถาม{name}สักคำ ล้วงช้อนกระดูกจากกระเป๋าเสื้อ

        สามวันต่อมามีเด็กหนุ่มคนหนึ่งเดินผ่านหน้าโรงน้ำมัน ถามทางไปตลาดจากคนขับเกวียน เดินกะย่องกะแย่งแบบคนเพิ่งหายป่วย ในห้องถัง ถังใบที่สามพร่องไปสองช้อน {name}เติมน้ำมันให้เต็ม และปล่อยให้รอยชอล์กเลือนไปเองเหมือนเดิม
      effects: { alignment: { law: 1 }, flags: [sent_a_wick_to_the_chalk_cask] }
    - id: sit_with_him_till_the_set_returns
      label: เลื่อนถ้วยน้ำไปให้ แล้วถามว่าเด็กคนเล็กชื่ออะไร
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          เขาบอกชื่อเด็ก แล้วบอกชื่อพี่ แล้วเล่าว่าบ้านนั้นปลูกถั่วไว้ริมรั้ว {name}ให้เขาเล่าจนหมด แล้วบอกเรื่องเดียวที่คนเฝ้าห้องถังรู้ ชุดขึ้นไปห้าคนต้องลงมาห้าคน คืนไหนลงมาสี่ บ้านหลังนั้นมีคนลืมไม่ครบ เด็กคนเล็กจะตื่นมาจำได้อยู่คนเดียวในบ้านว่ามีอะไรตกลงมาจากฟ้า

          เขาแบกถังกลับขึ้นไปก่อนถ้วยน้ำจะหมด ใกล้สางชุดกลับลงมา {name}ฟังเสียงเท้าโดยไม่เงยหน้า ห้าคน ผู้ดับเดินผ่านเบาะฟาง ชะลอเท้าครู่หนึ่ง แล้วเดินต่อ
        effects: { stats: { WIS: 1 }, flags: [sent_a_wick_back_up_the_steps] }
      failure:
        text: |
          เขาบอกชื่อเด็ก แล้วไม่พูดต่อ {name}พูดแทนอยู่พักใหญ่ เรื่องห้าคนขึ้นห้าคนลง เรื่องบ้านที่ลืมไม่ครบ เขาฟังจนจบ ลุกขึ้น แล้วเดินขึ้นบันไดสิบเอ็ดขั้นไปมือเปล่า ถังยังอยู่ข้างเบาะ ตะเกียงที่หัวบันไดวูบหนึ่งทีตอนเขาผ่าน

          ใกล้สางชุดกลับลงมา สี่คน ผู้ดับดูถังที่วางทิ้งไว้ ดู{name} แล้วให้คนในชุดแบกถังนั้นกลับขึ้นไปบ้านหลังเดิมก่อนฟ้าสว่าง ชื่อของไส้คนนั้นไม่มีใครในห้องถังเอ่ยอีก
        effects: { flags: [watched_a_wick_walk_up_remembering] }
    - id: light_the_third_cask_yourself
      label: ไขตู้ตะเกียง ตวงเถ้าจากถังใบที่สามให้เขาเองด้วยช้อนตักน้ำมัน (คืนไม่ได้)
      habit: soft_heart
      text: |
        ช้อนตักน้ำมันใหญ่กว่าช้อนกระดูกเท่าไร{name}ไม่รู้ ปาดขอบให้เสมอตามที่เคยเห็น จุดตะเกียงดวงเล็กบนฝาถัง ปิดประตูหัวบันได แล้วนั่งลงข้างเขาตามกติกา คนตวงต้องนั่งอยู่ในควันด้วยจนครบ

        {name}ตื่นบนเบาะฟางตอนชุดกลับลงมา ไม่รู้ว่าทำไมชอล์กในมือหักเป็นสองท่อน ไม่รู้ว่าเด็กหนุ่มที่หลับพิงถังใบที่สามเป็นใคร ผู้ดับดูช้อนตักน้ำมันที่เปื้อนเถ้า ดูทั้งสองคน แล้วนั่งลงบนบันไดขั้นล่างสุด ถอนใจยาว ก่อนจะเริ่มเล่าให้{name}ฟังว่าเมื่อคืน{name}ทำอะไร
      effects: { alignment: { law: -1, moral: 1 }, flags: [measured_ash_without_the_bone_spoon] }
