# ชุด 3 วัยกลางคน อายุ 41 ถึง 64: เหตุการณ์ประจำสายนักบวช พราน กวีเร่ สายละ 4 เรื่อง
# 41–52 สองเรื่อง 53–64 สองเรื่อง แต่ละสายมีการปะทะหนึ่งเรื่องที่ชนะได้โดยไม่ต้องใช้แรง
# ข้อความหลักไม่ถือว่าเรื่องช่วง 25–40 เกิดแล้ว คนเก่าและเรื่องเก่ากลับมาในตัวเลือกที่ต้องมี flag ของติดตัว หรือคนเข้าบท

# ---------- นักบวช ----------
- id: adult.path_cleric_quiet_winter
  stage: adult
  scene: temple
  weight: 30
  when:
    age: [41, 52]
    class: cleric
  text: |
    ต้นฤดูหนาวปีนี้{god}ไม่ตอบ {name}สวดคำเดิมในเวลาเดิมทุกเช้า กลางอกยังว่าง วันที่สามคนขายเนื้อเอามือที่มีดสับบาดมาให้ปิด คาถาปิดได้แค่ปลายแผลยาวเท่าเล็บ ที่เหลือ{name}ต้องเย็บด้วยเข็มกับด้ายแบบหมอ คนขายเนื้อกัดผ้าไว้ตลอดเวลาที่เย็บ แล้วถามว่าปีนี้วิหารเปลี่ยนวิธีหรือ

    สัปดาห์ต่อมาไข้หน้าหนาวก็มาถึงถิ่น ทุกปีเป็นแบบนี้ ไข้ขึ้นในบ้านที่มีเด็กก่อน แล้วลามไปบ้านคนแก่ กระดานหน้าวิหารมีชื่อบ้านที่มีคนไข้เขียนด้วยดินสอพอง วันแรกสามบ้าน วันที่สองเจ็ดบ้าน ทุกบ้านรอให้นักบวชเดินมาวางมือบนหน้าผากเหมือนทุกหนาว

    ค่ำนั้น{name}ยืนอ่านกระดานหน้าวิหาร ชื่อบ้านที่สิบเอ็ดเขียนไว้ล่างสุด ตัวหนังสือเบี้ยว เป็นลายมือเด็ก
  choices:
    - id: heal_with_hands
      label: เดินไปทุกบ้านอย่างหมอ ผ้าเย็น เปลือกหลิว น้ำต้มสุก ไม่ต้องรอ{god}
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ต้มเปลือกหลิวเต็มหม้อใหญ่ของวิหาร กรอกใส่ขวดเรียงในตะกร้า แล้วเดินทีละบ้านตามรายชื่อบนกระดาน ไม่วางมือบนหน้าผากใคร เปิดหน้าต่างให้ลมเข้า เช็ดตัวเด็กด้วยผ้าชุบน้ำเย็น สอนแม่ให้ป้อนน้ำลูกทีละช้อนทุกครั้งที่ระฆังบอกชั่วโมง

          ไข้หน้าหนาวปีนั้นไม่มีใครในถิ่นตาย ยายขายถั่วต้มเล่าไปทั่วตลาดว่านักบวชปีนี้มือเย็นกว่าทุกปี เย็นแต่หาย
        effects: { stats: { WIS: 1 }, flags: [healed_without_the_god] }
      failure:
        text: |
          บ้านที่สิบเอ็ดเป็นบ้านคนขายถ่าน ลูกชายคนเล็กไข้ขึ้นจนตัวสั่นใต้ผ้าห่มสามผืน น้ำเปลือกหลิวลงคอแล้วอาเจียนออกมาหมด {name}ห่อเด็กด้วยผ้าห่มของวิหาร อุ้มเดินฝ่าลมหนาวไปบ้านหมออีกฝั่งลำธารตอนเที่ยงคืน

          เด็กรอด หมอบอกว่ามาทันพอดี {name}เดินกลับวิหารตอนสาง แล้วนอนไข้ต่ออีกครึ่งเดือน ไข้ตัวเดียวกับเด็ก
        effects: { hp: -2, flags: [drove_the_fever_to_the_doctor] }
    - id: pray_anyway
      label: นั่งสวดข้างเสื่อของเด็กที่ไข้หนักที่สุดทั้งคืน สวดจนกว่า{god}จะได้ยิน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          บ้านที่สิบเอ็ดเป็นบ้านคนขายถ่าน ลูกชายคนเล็กไข้หนักที่สุดในรายชื่อ {name}คุกเข่าข้างเสื่อตั้งแต่หัวค่ำ สวดบทเดิมซ้ำจนนับรอบไม่ได้ เข่าชาตั้งแต่เที่ยงคืน ตีสามกลางอกอุ่นขึ้นมาเท่าปลายนิ้วแตะ หายไป แล้วกลับมาอีก

          รุ่งสางเหงื่อเด็กออกจนเสื่อเปียก ไข้ลง แม่ของเด็กไม่รู้ว่าตอนตีสามเกิดอะไรขึ้น นางเห็นแค่นักบวชที่ลุกขึ้นยืนเองไม่ได้ ต้องให้พ่อของเด็กพยุงไปนั่งข้างเตา
        effects: { stats: { CON: 1 }, flags: [prayed_the_fever_down] }
      failure:
        text: |
          {name}สวดจนเสียงแหบ กลางอกไม่อุ่นสักครั้งตลอดคืน ไข้ของเด็กขึ้นสูงสุดตอนตีสี่ แล้วลงเองตอนสาย ด้วยผ้าเย็นที่แม่ของเด็กเปลี่ยนให้ทั้งคืนอยู่ข้างหลัง{name}

          {name}กลับวิหารด้วยเข่าที่บวมทั้งสองข้าง บ้านอีกหกบ้านบนกระดานไม่มีใครไปหาเลยในคืนนั้น
        effects: { hp: -1, flags: [the_god_did_not_come] }
    - id: pay_the_doctor
      label: เขียนบอกทุกบ้านตามตรงว่าหนาวนี้{god}ไม่ตอบ แล้วออกค่าหมอให้บ้านที่ไม่มีเงิน
      requires: { min_gold: 2 }
      text: |
        {name}เขียนลงบนกระดานหน้าวิหารใต้รายชื่อบ้าน ด้วยดินสอพองแท่งเดียวกัน ว่าหน้าหนาวนี้มือของนักบวชรักษาไข้ไม่ได้ ให้ไปหาหมอ บ้านไหนไม่มีค่าหมอให้มาเอาที่วิหาร แล้วเอาเหรียญสองเหรียญไปวางไว้กับหมอเป็นค่ามัดจำ

        คนในถิ่นยืนอ่านกระดานกันเป็นกลุ่ม บางคนอ่านออกเสียงให้คนที่อ่านไม่ออกฟัง ปลายหนาว แม่ของเด็กบ้านที่สิบเอ็ดเอาผ้าห่มทอมือมาวางไว้หน้าประตูวิหาร ลายทอเป็นตราของ{god} ทอผิดไปหนึ่งเส้น
      effects: { gold: -2, alignment: { moral: 1 }, flags: [admitted_the_quiet_season] }
    - id: know_why_it_is_quiet
      label: นับดูว่า{name}เดินห่างจาก{god}มาตั้งแต่เรื่องไหน แล้วเลิกเรื่องนั้นหนึ่งเรื่อง
      requires: { flag: cleric_drift }
      text: |
        {god}ไม่ได้เงียบไปเอง {name}รู้ {name}เดินออกห่างมาทีละก้าวหลายปีแล้ว ห่างจนคำสวดตอนเช้าส่งไปไม่ถึง คืนนั้น{name}ไม่สวดขอให้{god}กลับมา {name}เลือกเรื่องเดียวจากเรื่องที่ทำมาตลอดหลายปีนั้น เรื่องที่{god}ไม่มีวันทำ แล้วเลิกตั้งแต่เช้าวันรุ่งขึ้น

        ไข้หน้าหนาวปีนั้นยังต้องรักษาด้วยเปลือกหลิวกับผ้าเย็นไปจนจบฤดู กลางอกยังว่าง ทุกเช้า{name}ยังคุกเข่าบนพื้นกระดานแผ่นเดิม ไม่ได้ขออะไร บอกแค่ว่าเรื่องนั้นเลิกมาได้กี่วันแล้ว
      effects: { stats: { WIS: 1 }, flags: [promised_one_thing_back] }

- id: adult.path_cleric_dwarf_grave
  stage: adult
  scene: temple
  time: night
  weight: 30
  when:
    age: [41, 52]
    class: cleric
  text: |
    คนขุดหลุมของวิหารในถิ่นมาหา{name}ก่อนสวดเช้า เจ็ดคืนแล้วที่มีเสียงอ่านชื่อในลานหลุมศพหลังวิหาร เสียงเบา ต่ำ ไล่อ่านชื่อบนแผ่นหินทีละแผ่นทีละแถว เขาเดินไปดูสองครั้ง ไม่เห็นใคร เห็นแต่น้ำค้างแข็งเกาะแผ่นหินแผ่นหนึ่งในแถวที่สิบเจ็ด แผ่นที่ไม่มีชื่อ

    แผ่นนั้นเป็นของช่างกุญแจคนแคระหัวสะพาน ตายไปตั้งแต่คนขุดหลุมยังไม่มีหนวด ญาติลงมาจากภูเขาครั้งเดียว จ่ายค่าฝังครบ แล้วสั่งไว้ว่าห้ามสลักชื่อ คนขุดหลุมจำได้ว่าพวกนั้นไม่ยอมก้าวเข้ามาในวิหารแม้แต่ก้าวเดียว

    คืนนั้น{name}ถือตะเกียงออกไปที่แถวที่สิบเจ็ด เสียงอ่านชื่อหยุดตอนแสงตะเกียงไปถึง คนตัวเตี้ยซีดจนเห็นแผ่นหินข้างหลังทะลุตัว คุกเข่าอยู่หน้าแผ่นหินเปล่า เขาอ่านมาครบทุกแผ่นในลานแล้ว เหลือแผ่นนี้แผ่นเดียว เขาหันมาหา{name} แล้วรอ เหมือนแผ่นนี้ถึงตาคนอื่นอ่าน
  encounter:
    foe: nameless_ghost
    name: ผีแถวที่สิบเจ็ด
    morale: 2
    beats:
      - text: ผีคนแคระลุกขึ้นจากหน้าแผ่นหิน เดินเข้ามาหาแสงตะเกียงทีละก้าว ปากยังขยับอ่านชื่อบนแผ่นหินที่เดินผ่าน ลมหายใจของ{name}เป็นควันขาว เปลวตะเกียงเอนไปทางเขา
        moves:
          - id: grave_read_stone
            label: ยกตะเกียงส่องแผ่นหินเปล่า หาว่าช่างหินทิ้งรอยอะไรไว้บ้าง
            kind: read
            stat: INT
            success: หน้าแผ่นหินเรียบสนิท ไม่เคยมีใครสลักอะไรลงไป แต่ที่สันหินด้านล่าง ช่างหินตอกเลขเล็กๆ ไว้สองตัว เลขแถวกับเลขหลุม แบบที่วิหารใช้จดในสมุดฝังศพ ชื่อที่ญาติห้ามสลักบนหิน มีคนต้องเขียนไว้ที่ไหนสักแห่ง
          - id: grave_names_around
            label: อ่านชื่อบนแผ่นหินรอบๆ ให้เขาฟัง บอกว่าใครนอนอยู่ข้างเขาบ้าง
            kind: talk
            tags: [name]
            success: "{name}อ่านชื่อแผ่นซ้ายมือ แผ่นขวามือ แผ่นข้างหลัง คนทำรองเท้า ยายขายปลาเค็ม เด็กผู้หญิงที่ตายตอนเจ็ดขวบ ผีคนแคระหยุดเดินตั้งแต่ชื่อแรก ชื่อพวกนั้นเขาอ่านเองมาทุกคืน แต่ยังไม่เคยมีใครอ่านให้เขาฟัง"
          - id: grave_pray
            label: ยืนให้มั่น สวดบทส่งคนตายที่สวดมาทั้งชีวิต
            kind: guard
          - id: grave_lamp_pole
            label: เหวี่ยงไม้แขวนตะเกียงไล่เขากลับไป
            kind: attack
            tags: [blunt]
            failure: ไม้ผ่านตัวเขาไปเหมือนผ่านหมอก แล้วฟาดเข้าแผ่นหินของยายขายปลาเค็มจนมุมบิ่น ผีคนแคระก้มดูมุมที่บิ่น แล้วเงยขึ้นดูมือของ{name} มือเย็นของเขาลงมาที่ข้อมือของ{name}ก่อนจะชักกลับทัน
          - id: grave_leave
            label: ถอยกลับเข้าวิหาร ลงกลอนประตูหลัง
            kind: flee
      - text: ผีคนแคระมาหยุดตรงหน้า สูงแค่อกของ{name} เขาจับมือขวาของ{name}ขึ้นมาพลิกดู นิ้วกลางมีรอยด้านตรงที่ปากกาวาง ปลายนิ้วมีหมึกติด "เจ้าเป็นคนจดชื่อ" เขาว่า เสียงเหมือนลมลอดช่องหิน
        answer: talk
        moves:
          - id: grave_register
            label: รับปากว่าจะไปเอาสมุดฝังศพของวิหารมาเปิดให้เขาดูเดี๋ยวนี้
            kind: talk
            parley: true
          - id: grave_clans
            label: ไล่ชื่อตระกูลคนแคระทุกตระกูลที่เคยได้ยิน ดูว่าชื่อไหนเขาสะดุ้ง
            kind: talk
            tags: [name]
            success: ตระกูลที่สี่ มือที่จับอยู่กระตุก ผีคนแคระปล่อยมือของ{name} แล้วเอามือนั้นปิดหูไว้ข้างหนึ่ง อีกข้างยังเปิดอยู่
          - id: grave_hold_still
            label: ยืนนิ่ง ปล่อยให้เขาพลิกมือดูจนพอใจ
            kind: guard
          - id: grave_leave2
            label: ดึงมือกลับ เดินเร็วๆ ไปทางประตูหลังวิหาร
            kind: flee
      - text: ผีคนแคระกลับไปคุกเข่าหน้าแผ่นหินเปล่า เอาเล็บขูดหน้าหิน ขูดเป็นรอยตัวอักษรที่ไม่ลงสักตัว รอยเล็บกลายเป็นเส้นน้ำค้างแข็ง ความเย็นไหลออกมาตามพื้นหญ้าถึงเท้าของ{name} เปลวตะเกียงหดลงเหลือเท่าเมล็ดข้าว
        answer: talk
        moves:
          - id: grave_call_trade
            label: เรียกเขาด้วยชื่อที่คนในถิ่นเคยเรียก ช่างกุญแจหัวสะพาน
            kind: talk
            tags: [name]
            success: เล็บหยุดขูดกลางเส้น เขาหันมาช้าๆ แล้วพลิกมือตัวเองดูทั้งสองข้าง หัวแม่มือขวายังมีรอยด้านของคนจับตะไบ
          - id: grave_shield_lamp
            label: เอาตัวบังลม ประคองเปลวตะเกียงไว้ไม่ให้ดับ
            kind: guard
          - id: grave_pull_hands
            label: คว้ามือเขาออกจากแผ่นหิน
            kind: quick
          - id: grave_leave3
            label: ทิ้งตะเกียงไว้ วิ่งกลับไปทางวิหาร
            kind: flee
    win:
      text: |
        ผีคนแคระนั่งลงพิงแผ่นหินเปล่า หันหน้าออกไปทางแถวแผ่นหินของเพื่อนบ้าน ร่างจางลงทีละน้อยจนเหลือแค่น้ำค้างแข็งเป็นรอยนั่งบนพื้นหญ้า พอฟ้าสาง รอยนั้นก็ละลาย

        เช้านั้น{name}เปิดสมุดฝังศพเล่มเก่าของวิหาร แถวที่สิบเจ็ด หลุมที่เก้า ช่องชื่อมีหมึกดำป้ายทับจนเป็นแผ่น ข้างๆ มีลายมือนักบวชรุ่นก่อนเขียนไว้ว่าตามคำขอของญาติ {name}ปิดสมุดโดยไม่ยกหน้านั้นขึ้นส่องไฟ ตั้งแต่คืนนั้นลานหลุมศพไม่มีเสียงอ่านชื่ออีก
      effects: { stats: { CHA: 1 }, flags: [quieted_the_dwarf_grave] }
    parley:
      text: |
        ผีคนแคระรออยู่หน้าแผ่นหิน {name}กลับไปเอาสมุดฝังศพเล่มเก่าที่สุดจากหีบในห้องเก็บของ เปิดหาแถวที่สิบเจ็ด หลุมที่เก้า ช่องชื่อมีหมึกดำป้ายทับจนเป็นแผ่น ข้างๆ มีลายมือนักบวชรุ่นก่อนเขียนไว้ว่าตามคำขอของญาติ

        {name}ยกหน้านั้นขึ้นทาบเปลวตะเกียง ใต้หมึกป้าย รอยปากกาที่กดลงบนกระดาษยังเห็นเป็นเงา ทอร์ลิก {name}อ่านออกเสียงสามครั้ง ช้าๆ ครั้งที่สามผีคนแคระอ่านตามไปด้วย แล้วไม่อยู่ตรงนั้นอีก เช้าวันต่อมา{name}จ่ายช่างหินสองเหรียญให้สลักชื่อนั้นลงบนแผ่นหิน ช่างหินถามว่าญาติจะว่าอย่างไร {name}บอกว่าญาติไม่เคยก้าวเข้ามาในวิหารนี้
      effects: { gold: -2, stats: { WIS: 1 }, flags: [found_the_dwarfs_name] }
    lose:
      text: |
        คนขุดหลุมเจอ{name}ตอนสาง นั่งพิงแผ่นหินแถวที่สิบเจ็ด ตะเกียงดับ มือทั้งสองข้างจับขอบแผ่นหินเปล่าไว้แน่นจนเขาต้องไปเอาน้ำอุ่นจากครัวมาราด ข้อนิ้วจึงยอมคลาย

        สวดเช้าวันนั้น{name}ขึ้นต้นบทแล้วค้างอยู่ตรงคำที่สาม คำที่ต้องเอ่ยชื่อ{god} ชื่อนั้นหายไปจากหัวหนึ่งอึดใจเต็มๆ แล้วกลับมาเอง คนที่คุกเข่าอยู่แถวหน้าเงยหน้าขึ้นพร้อมกัน
      effects: { flags: [forgot_a_name_at_the_grave] }
    stalemate:
      text: |
        แสงแรกขึ้นพ้นกำแพงวิหาร คนขุดหลุมเดินเข้าลานมาพร้อมพลั่ว วันนี้มีหลุมใหม่ต้องขุดหนึ่งหลุม ผีคนแคระเงยหน้าดูพลั่วในมือเขา แล้วถอยเข้าไปในแถวแผ่นหิน จางหายไปตรงช่องระหว่างแผ่นที่แปดกับแผ่นที่สิบ

        คืนต่อมาเสียงอ่านชื่อกลับมา เบากว่าเดิม ช้ากว่าเดิม อ่านไปจนถึงแถวที่สิบเจ็ดแล้วหยุดทุกคืน
      effects: { flags: [dwarf_grave_still_reading] }
    flee:
      text: |
        {name}ลงกลอนประตูหลังวิหาร นั่งพิงประตูจนสาง เสียงอ่านชื่อลอดเข้ามาตลอดคืน อ่านครบทุกแถว แล้วเริ่มใหม่ตั้งแต่แถวแรก

        ปลายเดือนคนขุดหลุมขอย้ายไปขุดที่วิหารอื่น {name}เลื่อนเวลาสวดค่ำให้เสร็จก่อนตะวันตก
      effects: { flags: [fled_the_dwarf_grave] }

- id: adult.path_cleric_the_dying_question
  stage: adult
  scene: healer
  weight: 30
  cast:
    old_friend: { id: loven, optional: true }
  when:
    age: [53, 64]
    class: cleric
  text: |
    คนแจวเรือข้ามฟากนอนอยู่บนเสื่อผืนสุดท้ายในบ้านหมอ ข้างหน้าต่าง น้ำท่วมปอด หมอบอกว่าคืนนี้หรือคืนพรุ่งนี้ ห้าสิบปีที่เขาแจวเรือข้ามแม่น้ำ คนครึ่งถิ่นเคยนั่งเรือของเขา {name}ก็เคยนั่ง เขาเก็บค่าข้ามจากนักบวชครึ่งราคาทุกครั้ง บอกว่าเผื่อไว้

    หมอเรียก{name}มาสวดส่ง {name}นั่งลงข้างเสื่อ เปิดสมุดบทสวด คนแจวเรือยกมือขึ้นปิดหน้าสมุดไว้ มือใหญ่ ด้านทั้งฝ่ามือเพราะด้ามแจว เขาถามว่า{god}รออยู่ข้างหน้าจริงไหม อย่าตอบจากสมุด ตอบจากที่{name}เคยเห็นเอง
  choices:
    - id: tell_him_yes
      label: บอกเขาว่าจริง {god}รออยู่
      text: |
        {name}บอกว่าจริง พูดด้วยเสียงเดียวกับที่ใช้บอกคนไข้ว่าแผลนี้หายได้ คนแจวเรือหลับตา ถอนใจยาว แล้วขอให้{name}สวดบทที่เขาจำได้ตั้งแต่เด็ก บทที่แม่ของเขาสวดตอนส่งพ่อ

        เขาตายตอนใกล้รุ่ง หน้าเรียบ มือยังวางทับสมุดบทสวดอยู่ {name}ต้องยกมือเขาออกเองทีละนิ้ว นิ้วชี้ยังงออยู่ในท่าจับด้ามแจว
      effects: { alignment: { moral: 1 }, flags: [told_the_ferryman_yes] }
    - id: tell_him_you_do_not_know
      label: บอกเขาตามจริงว่า{name}ไม่รู้
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}บอกว่าไม่รู้ ทุกเช้าตั้งแต่ปฏิญาณตน บางเช้ามีอะไรอุ่นตอบกลับมาที่กลางอก บางฤดูไม่มีเลย สิ่งที่อุ่นนั้นรออยู่ข้างหน้าหรือไม่ {name}ไม่เคยเห็น เห็นแค่ว่ามันเคยมาหาถึงตรงนี้

          คนแจวเรือหัวเราะ แล้วไอจนต้องพยุงตัวขึ้นนั่ง เขาบอกว่าห้าสิบปีบนแม่น้ำ เขาก็ไม่เคยเห็นอีกฝั่งตอนหมอกลง เห็นแค่เชือกที่ขึงข้ามน้ำไว้ แล้วดึงเรือไปตามเชือก คืนนั้นเขาขอให้{name}จับมือไว้แทนสวด พอใกล้รุ่ง มือนั้นคลายเอง
        effects: { stats: { CHA: 1 }, flags: [told_the_ferryman_the_truth] }
      failure:
        text: |
          {name}บอกว่าไม่รู้ แล้วพยายามอธิบายต่อ อธิบายยาวเกินไป ยิ่งพูดยิ่งฟังเหมือนเทศน์ คนแจวเรือหันหน้าไปทางหน้าต่าง ขอให้หมอไปตามนักบวชอีกวิหารหนึ่งมาแทน คนที่จะตอบว่าจริงโดยไม่ต้องคิด

          นักบวชคนนั้นมาถึงตอนดึก ตอบว่าจริงคำเดียว คนแจวเรือหลับไปโดยมุมปากยังยกอยู่ {name}นั่งรออยู่ที่ระเบียงบ้านหมอจนสาง ไม่มีใครเรียกเข้าไป
        effects: { flags: [ferryman_asked_another_priest] }
    - id: pray_with_him
      label: ไม่ตอบ สอนบทสวดที่สั้นที่สุดให้เขา ให้เขาถามเอง
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          บทนั้นมีสี่คำ เป็นบทแรกที่นักบวชฝึกหัดทุกคนท่องได้ {name}พูดทีละคำ คนแจวเรือพูดตาม ผิดคำที่สาม พูดใหม่ ผิดอีก รอบที่ห้าเขาพูดครบ แล้วพูดต่อเองไปเรื่อยๆ ตามจังหวะหายใจ ช้าลงทุกรอบ

          ใกล้รุ่ง เสียงสวดเหลือแค่ปากขยับ ข้างหน้ามีใครรอฟังอยู่หรือไม่ {name}ไม่รู้ รู้แค่ว่าคำที่สามเขาพูดถูกทุกรอบไปจนรอบสุดท้าย
        effects: { stats: { WIS: 1 }, flags: [taught_the_ferryman_to_pray] }
      failure:
        text: |
          คนแจวเรือหายใจไม่พอจะพูดครบสี่คำ พูดได้สองคำก็ไอ เขาโบกมือให้{name}เลิก บอกว่าแก่เกินจะเรียนอะไรใหม่ แล้วหันไปทางหน้าต่าง

          {name}นั่งอยู่ข้างเสื่อทั้งคืน ฟังเสียงลมผ่านปอดของเขาสั้นลงทีละนิด ตอนเขาหยุดหายใจ แสงแรกเพิ่งขึ้นที่อีกฝั่งแม่น้ำ
        effects: { flags: [sat_silent_with_the_ferryman] }
    - id: loven_answers
      label: ให้โลเวนที่นั่งอยู่ห้องข้างๆ เข้ามาตอบแทน
      requires: { cast: [old_friend] }
      text: |
        โลเวนมาบ้านหมอทุกคืนวันอัสเทล มานั่งกับคนผิวแก้วที่นอนอยู่ห้องข้างๆ คืนนี้นางได้ยินคำถามลอดฝามา แล้วเดินเข้ามานั่งอีกฝั่งของเสื่อ แผ่นใสที่หลังมือซ้ายของนางลามขึ้นไปถึงข้อศอกแล้ว ข้างใต้มีแสงฟ้าเต้นเบาๆ นางบอกคนแจวเรือว่านางก็ไม่รู้ แต่จะนั่งอยู่ตรงนี้จนกว่าเขาจะรู้เอง

        คนแจวเรือบีบมือนาง มือข้างที่เป็นแก้ว แล้วบอกว่าเย็นดี เหมือนน้ำตอนเช้า ทั้งคืนนั้น{name}กับนางนั่งคนละฝั่งเสื่อ ไม่มีใครเปิดสมุดบทสวด ใกล้รุ่ง แสงใต้ผิวของนางเต้นช้าลงพร้อมลมหายใจของเขา
      effects: { stats: { WIS: 1 }, people: [{ id: loven, closeness: 1 }], flags: [sat_the_ferryman_out_with_loven] }

- id: adult.path_cleric_last_vow
  stage: adult
  scene: temple
  time: night
  weight: 30
  when:
    age: [53, 64]
    class: cleric
  text: |
    วิหารของ{god}มีธรรมเนียมข้อหนึ่งที่นักบวชหนุ่มสาวไม่ค่อยรู้ ใครปฏิญาณตนมาเกินสามสิบปี ต้องคุกเข่าเฝ้าหน้าแท่นหนึ่งคืนเต็ม แล้วเลือกตอนรุ่งสาง จะปฏิญาณใหม่ไปจนตาย หรือถอดตราวางไว้บนแท่น กลับไปเป็นคนธรรมดาโดยไม่มีใครถามเหตุผล ปีนี้ถึงรอบของ{name}

    นักบวชฝึกหัดที่วิหารส่งมาเติมน้ำมันตะเกียงให้ทั้งคืนชื่ออิลมา อายุสิบเจ็ด ปฏิญาณตนมาได้สองเดือน ตอนดึกนางนั่งลงบนขั้นบันไดแท่น ข้างตะเกียงที่เพิ่งเติม แล้วถามเสียงเบาว่าตลอดสามสิบปีนั้น{god}ตอบจริงๆ กี่ครั้ง นางถามแบบคนที่ถามคนอื่นมาแล้ว และได้คำตอบจากสมุดทุกครั้ง

    พื้นกระดานหน้าแท่นสึกเป็นรอยเข่าสองแอ่ง นักบวชรุ่นก่อนๆ ทำไว้ เข่าของ{name}ลงไปพอดีแอ่ง
  choices:
    - id: renew_the_vow
      label: คุกเข่าให้ครบคืน แล้วปฏิญาณใหม่ไปจนตาย
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ตอบอิลมาว่าไม่ได้นับ แล้วคุกเข่าต่อ ตีสามขาทั้งสองข้างชาจนไม่รู้ว่ายังอยู่ ตีสี่ชาเลยขึ้นไปถึงสะโพก ตอนแสงแรกส่องเข้ามาทางหน้าต่างหลังแท่น {name}พูดคำปฏิญาณเดิมทุกคำ คำเดียวกับคืนที่ปฏิญาณตนครั้งแรก เสียงแหบกว่า ช้ากว่า

          อิลมาต้องช่วยพยุงให้ลุก นางพยุงไปถึงประตูวิหาร แล้วถามอีกครั้งว่าตกลงกี่ครั้ง {name}บอกว่ามากพอให้กลับมาคุกเข่าทุกเช้า อีกหลายสิบปีต่อมา นางใช้คำนั้นตอบนักบวชฝึกหัดทุกรุ่นที่ถามนาง
        effects: { stats: { CON: 1 }, people: [{ id: ilma, name: อิลมา, gender: f, bond: friend, closeness: 1, age: 17 }], flags: [renewed_the_last_vow] }
      failure:
        text: |
          ตีสี่{name}หน้ามืด ล้มไปข้างหน้า หน้าผากกระแทกขอบแท่น อิลมาวิ่งไปเอาน้ำ กว่า{name}จะลืมตา ฟ้าสางแล้ว เลยเวลาที่ต้องพูดคำปฏิญาณ

          นักบวชอาวุโสที่มาดูบอกว่าตามธรรมเนียม คนที่ไม่ได้อยู่บนเข่าตอนแสงแรกต้องเฝ้าใหม่ปีหน้า {name}คุกเข่าลงในแอ่งเดิมอีกครั้ง เลือดยังซึมจากหน้าผาก แล้วพูดคำปฏิญาณทีละคำ นักบวชอาวุโสฟังจนจบ แล้วเขียนชื่อ{name}ลงสมุดปฏิญาณ ช่องวันที่เขียนว่าวันนี้
        effects: { hp: -2, people: [{ id: ilma, name: อิลมา, gender: f, bond: friend, closeness: 1, age: 17 }], flags: [renewed_the_last_vow] }
    - id: lay_the_symbol_down
      label: ถอดตรา{god}วางไว้บนแท่นตอนรุ่งสาง
      text: |
        ตอนแสงแรกเข้ามา {name}ถอดตราออกจากคอ วางลงบนแท่น ตรงกลางระหว่างตราอีกสามอันที่คนรุ่นก่อนวางไว้ ไม่มีใครถามเหตุผล ตามธรรมเนียม อิลมาก็ไม่ถาม นางเก็บถังน้ำมันตะเกียง แล้วเดินตามออกมาส่งถึงประตู

        {name}ยังตื่นก่อนแดดขึ้นทุกเช้าเหมือนเดิม ยังเดินผ่านพื้นกระดานแผ่นที่สึกเป็นรอยเข่าในห้องนอนของตัวเอง หยุดตรงนั้นครู่หนึ่ง แล้วเดินต่อไปต้มน้ำ
      effects: { people: [{ id: ilma, name: อิลมา, gender: f, bond: friend, closeness: 1, age: 17 }], flags: [laid_down_the_symbol] }
    - id: give_ilma_the_symbol
      label: ปฏิญาณใหม่ แล้วยื่นตราเก่าที่ลูบจนลายเลือนให้อิลมา
      text: |
        ตราของ{name}ลายเลือนจนเกือบเรียบ ขอบมนเพราะนิ้วโป้งลูบมาเกินสามสิบปี ตอนรุ่งสาง{name}พูดคำปฏิญาณใหม่ แล้วถอดตราเก่าออกจากคอ คล้องตราใหม่ที่วิหารเตรียมไว้ให้คนที่ปฏิญาณรอบสอง ตราเก่าวางลงในมือของอิลมา

        นางถามว่าตกลง{god}ตอบกี่ครั้ง {name}บอกให้นางนับเอาจากรอยบนตรานั้น นางพลิกตราดูในแสงตะเกียงทั้งสองด้าน ด้านหลังเรียบกว่าด้านหน้า ตรงกลางมีแอ่งตื้นๆ ขนาดพอดีหัวแม่มือ
      effects: { alignment: { moral: 1 }, people: [{ id: ilma, name: อิลมา, gender: f, bond: friend, closeness: 2, age: 17 }], flags: [renewed_the_last_vow, gave_ilma_your_symbol] }
    - id: tell_her_about_the_knife_marks
      label: เล่าให้อิลมาฟังเรื่องรอยมีดสองแถวบนขอบหน้าต่าง
      requires: { flag: prayed_through_silence }
      text: |
        {name}เล่าเรื่องปีนั้นให้นางฟัง สามเดือนที่กลางอกว่าง รอยมีดบนขอบหน้าต่างวันละรอย วันที่เก้าสิบสามที่อุ่นขึ้นมาเท่าปลายนิ้วแตะแล้วหายไป วันที่เก้าสิบสี่ที่ไม่มีอะไรเลย {name}บอกว่าขอบหน้าต่างนั้นยังอยู่ รอยมีดยังอยู่ครบสองแถว ใครจะไปนับก็ได้

        ตอนรุ่งสาง{name}ปฏิญาณใหม่ อิลมาไม่ได้กลับไปห้องนอนนักบวชฝึกหัด นางเดินไปบ้านของ{name}ก่อน ไปยืนนับรอยมีดบนขอบหน้าต่างทีละรอยจนครบ แล้วจึงกลับไปกินข้าวเช้า
      effects: { stats: { WIS: 1 }, people: [{ id: ilma, name: อิลมา, gender: f, bond: friend, closeness: 2, age: 17 }], flags: [renewed_the_last_vow, told_ilma_about_the_silence] }

# ---------- พราน ----------
- id: adult.path_ranger_lost_flocks
  stage: adult
  weight: 30
  when:
    age: [41, 52]
    class: ranger
  text: |
    ปลายฤดูฝนห่านป่าบินผ่านถิ่นนี้ทุกปี ฝูงแล้วฝูงเล่า บินลงใต้ไปหาหนองน้ำที่ไม่แข็งตัว เสียงร้องดังลงมาจากฟ้าตั้งแต่ก่อนรุ่งสาง ปีนี้ฝูงแรกมาตรงเวลา แต่บินขึ้นเหนือ

    {name}ยืนดูอยู่บนสันเขาสามเช้าติดกัน ฝูงที่สองบินขึ้นเหนือ ฝูงที่สามวนอยู่เหนือหุบสองรอบ แตกฝูง ครึ่งหนึ่งบินขึ้นเหนือตามไป อีกครึ่งร่อนลงหนองตื้นตีนเขา ตรงที่น้ำไม่ลึกพอให้ห่านตัวไหนพ้นหน้าหนาว ห่านหาทางลงใต้ด้วยดาว พรานรุ่นพ่อสอนกันมาอย่างนั้น และตอนกลางคืนฟ้าทางทิศเหนือมีดาวที่พรานรุ่นพ่อไม่เคยเห็น

    หนองตื้นตีนเขามีห่านเหนื่อยร่อนลงมาเพิ่มทุกเช้า คนดักนกในถิ่นเริ่มขึงตาข่ายรอบหนองแล้ว
  choices:
    - id: read_the_flocks
      label: ขึ้นไปนอนบนสันเขาสามคืน ดูว่าฝูงที่หลงเลี้ยวผิดตรงไหน
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          คืนที่สอง{name}เห็นสิ่งที่ตอนกลางวันไม่มีทางเห็น ฝูงที่ยกตัวขึ้นจากหนองตอนหัวค่ำบินลงใต้ถูกทางทุกฝูง ฝูงที่ยกตัวหลังเที่ยงคืนเลี้ยวขึ้นเหนือทุกฝูง

          {name}ลงมาบอกคนในถิ่นว่าทุกปีพอดอกกกริมหนองแก่ ให้ไปตีเกราะไล่ห่านที่ลงหนองตั้งแต่หัวค่ำ อย่าปล่อยให้นอนถึงดึก คนเลี้ยงแพะหัวเราะกันทั้งตลาด ปีต่อมาสามบ้านทำตาม ห่านที่ตายในหนองตื้นปีนั้นนับได้ไม่ถึงสิบตัว
        effects: { stats: { WIS: 1 }, flags: [read_the_lost_flocks] }
      failure:
        text: |
          คืนที่สองลมเหนือพัดลงมาทั้งคืน {name}นอนอยู่บนสันเขาโดยไม่ก่อไฟ กลัวห่านเห็น นับฝูงได้สิบเอ็ดฝูง จดไม่ทันว่าฝูงไหนบินไปทางไหน คืนที่สามไข้ขึ้น

          {name}ลงเขาไม่ไหว ต้องนอนอยู่ในเพิงเลี้ยงแพะบนไหล่เขาอีกสี่วัน คนเลี้ยงแพะต้มน้ำร้อนให้กิน แล้วบอกว่าห่านก็หลงได้ คนก็หลงได้ ปีนี้หลงกันทั้งฟ้าทั้งดิน
        effects: { hp: -2, flags: [lay_sick_on_the_ridge] }
    - id: light_southern_fires
      label: จุดไฟบนสันเขาด้านใต้ทุกคืน ให้ฝูงที่ออกเดินทางตอนดึกเห็นทาง
      check: { stat: CON, dc: 14 }
      success:
        text: |
          {name}แบกฟืนขึ้นสันเขาด้านใต้ทุกบ่าย จุดกองไฟสามกองเรียงกันตอนหัวค่ำ เฝ้าไว้ไม่ให้ดับจนรุ่งสาง ทำอยู่สิบเก้าคืน ฝูงที่ยกตัวขึ้นจากหนองตอนดึกวนเหนือหุบรอบหนึ่ง เห็นไฟ แล้วเลี้ยวลงใต้ ไม่ทุกฝูง แต่มากกว่าครึ่ง

          ปลายฤดูหนองตื้นตีนเขาไม่เหลือห่านสักตัว คนดักนกม้วนตาข่ายกลับบ้านมือเปล่า {name}นอนหลับยาวสองวันเต็ม ตื่นมามือทั้งสองข้างยังมีกลิ่นควันฟืน
        effects: { stats: { CON: 1 }, flags: [lit_the_southern_fires] }
      failure:
        text: |
          คืนที่หก{name}เผลอหลับข้างกองไฟ ลมเปลี่ยนทิศตอนตีสอง สะเก็ดไฟปลิวลงหญ้าแห้งบนไหล่เขา กว่า{name}จะตื่นเพราะควัน ไฟลามไปแล้วครึ่งเนิน {name}เอาเสื้อคลุมตีไฟจนรุ่งสาง ไฟไปดับเองที่ลำธาร

          ทุ่งหญ้าเลี้ยงแพะครึ่งเนินด้านใต้ดำไปทั้งฤดูหนาว คนเลี้ยงแพะไม่ได้ทวงค่าเสียหาย เขาแค่ต้อนแพะอ้อมไปกินหญ้าอีกฝั่ง ผ่านหน้าบ้าน{name}ทุกเช้า
        effects: { hp: -2, flags: [burned_the_southern_ridge] }
    - id: net_the_tired_birds
      label: ไปขึงตาข่ายกับคนดักนก ห่านที่ลงหนองตื้นไม่พ้นหน้าหนาวอยู่แล้ว
      habit: cold_blood
      text: |
        ห่านที่ลงหนองตื้นบินไม่ไหวแล้วครึ่งฝูง คนดักนกไม่ต้องขึงตาข่ายสูง แค่เดินต้อนเข้ามุม {name}รู้ว่าห่านจะหนีไปทางไหนก่อนห่านจะรู้เอง ทั้งฤดูได้ห่านสามสิบกว่าตัว แบ่งได้สี่เหรียญ

        ตลาดปีนั้นมีเนื้อห่านขายทุกแผง ราคาถูกจนคนจนก็ซื้อได้ ขนห่านยัดหมอนกันทั้งถิ่น ปีต่อมาฝูงที่บินผ่านมีน้อยลง และไม่มีฝูงไหนร่อนลงหนองตีนเขาอีก
      effects: { gold: 4, alignment: { moral: -1 }, flags: [netted_the_lost_flocks] }
    - id: lead_them_to_the_new_spring
      label: ต้อนฝูงที่ลงหนองตื้นข้ามเนินไปหาน้ำซับหลังกองดินของค่าย
      requires: { flag: relearned_home_ground, not_flags: [moved_midlife] }
      text: |
        น้ำซับหลังกองดินของค่ายผุดขึ้นมาตั้งแต่ปีที่{name}เดินถิ่นของตัวเองใหม่ทีละทาง ปีละกว้างขึ้น ปีนี้กว้างเท่าลานนวดข้าว น้ำไหลออกจากดินตลอดเวลา ขอบแข็งตัวแต่ตรงกลางไม่แข็งแม้กลางหน้าหนาว {name}ใช้ไม้ยาวสองอันกับเสียงจุ๊ปากแบบคนเลี้ยงห่าน ต้อนฝูงที่ลงหนองตื้นข้ามเนินไปทีละฝูง สามวัน

        ห่านไม่บินลงใต้อีกเลยในปีนั้น อยู่ที่น้ำซับตลอดหน้าหนาว พอต้นฤดูฝนปีต่อมาก็ยังอยู่ วางไข่ที่นั่น คนในถิ่นเริ่มเรียกที่ตรงนั้นว่าหนองห่าน แผนที่ของค่ายก็เขียนชื่อนั้นตาม
      effects: { alignment: { moral: 1 }, flags: [birds_found_the_new_spring] }

- id: adult.path_ranger_netted_storm_bird
  stage: adult
  scene: road
  weight: 30
  when:
    age: [41, 52]
    class: ranger
  text: |
    {name}ขึ้นสันเขาไปดูบ่วงดักกระต่ายตั้งแต่เช้ามืด ลมบนสันเขาวันนี้ไม่ไปทางเดียวกัน ใบไม้ตรงหน้าปลิวไปทางซ้าย ใบไม้ห่างไปยี่สิบก้าวปลิวไปทางขวา ตรงกลางระหว่างสองฝั่งมีเสียงตาข่ายกระชากหลักไม้

    คนดักนกสามพี่น้องจากหมู่บ้านล่างขึงตาข่ายไว้ที่ช่องเขาตั้งแต่ต้นฤดู หวังได้เหยี่ยวไปขายคนเลี้ยงนกในเมือง สิ่งที่ติดตาข่ายเมื่อคืนตัวใหญ่กว่าเหยี่ยวสามเท่า ขนสีหม่นแบบฟ้าก่อนพายุเข้า ปีกข้างหนึ่งพันตาข่ายอยู่สองชั้น ทุกครั้งที่ปีกอีกข้างกระพือ ลมทั้งช่องเขากระพือตาม พี่ชายคนโตกับคนกลางยืนห่างออกไป ขึ้นสายหน้าไม้ไว้แล้วทั้งคู่ คนน้องนั่งกอดเข่าอยู่ใต้หิน แขนเลือดออก

    พรานรุ่นก่อนเล่าถึงนกแบบนี้ให้{name}ฟังตั้งแต่ยังเด็ก นกแบบนี้ไม่ได้ลงมาล่าใคร มันหลงลมมา และลมจะไม่ไปจากช่องเขานี้จนกว่ามันจะไป
  encounter:
    foe: stray_bird
    name: นกหลงฝูงในตาข่าย
    beats:
      - text: นกหลงฝูงสะบัดปีกข้างที่ว่าง ลมกระโชกลงมาตามช่องเขา หลักไม้ที่ตรึงตาข่ายเอนไปครึ่งหนึ่ง เชือกตาข่ายเส้นหนึ่งพันข้อเท้าคนน้องที่นั่งอยู่ใต้หิน ลากไปทางขอบผา
        answer: guard
        moves:
          - id: storm_stand
            label: คว้าเชือกเส้นนั้นไว้ ยืนย่อเข่า ให้ลมผ่านไปก่อน
            kind: guard
            success: "{name}พันเชือกรอบแขนสองรอบ ทิ้งน้ำหนักลงส้นเท้า ลมกระชากอยู่สามอึดใจ แล้วคลาย คนน้องหยุดไถลห่างจากขอบผาสองช่วงตัว นกหลงฝูงหันหัวมาทาง{name} ตาสีเทาของมันกะพริบครั้งเดียว"
          - id: storm_crossbows
            label: ตะโกนบอกสองพี่น้องให้ลดหน้าไม้ลง
            kind: talk
          - id: storm_shoot_rope
            label: ยิงธนูตัดเชือกที่พันข้อเท้าคนน้อง
            kind: attack
            tags: [ranged]
            failure: ลมจากปีกพัดลูกธนูออกนอกทางไปหนึ่งศอก ไปปักหลักไม้ต้นที่ยังตั้งอยู่ หลักนั้นแตก ตาข่ายหย่อนลงข้างหนึ่ง นกหลงฝูงได้ปีกคืนมาครึ่งข้าง แล้วใช้มันทันที
          - id: storm_back_off
            label: ถอยลงจากสันเขา ไปตามคนในหมู่บ้านมาช่วย
            kind: flee
      - text: นกหลงฝูงหยุดดิ้น ยืนหอบอยู่ในตาข่าย ปีกข้างที่ยังพันกางค้างเป็นมุมแปลกๆ พี่ชายคนกลางวางหน้าไม้ลง ชักมีดออกมาแทน แล้วเริ่มย่องเข้าไปทางหลังมัน
        moves:
          - id: storm_read_knots
            label: ดูว่าปมไหนของตาข่ายที่รัดปีกไว้จริงๆ
            kind: read
            stat: WIS
            success: ตาข่ายพันสองชั้นแต่รัดอยู่ปมเดียว ปมใต้ข้อพับปีก ทุกครั้งที่นกดิ้น ปมนั้นยิ่งรูดแน่น คลายปมนั้นได้ ที่เหลือจะหลุดเอง ขอแค่นกนิ่งพอให้มือเข้าไปถึง
          - id: storm_stop_the_knife
            label: บอกคนกลางว่าถ้าเข้าไปจากข้างหลัง ลมจะพาเขาลงผา
            kind: talk
          - id: storm_cut_line
            label: วิ่งเข้าไปตัดเชือกหลักให้ขาดก่อนคนกลางจะถึงตัวมัน
            kind: quick
          - id: storm_back_off2
            label: ปล่อยให้พี่น้องจัดการกันเอง ลงเขาไป
            kind: flee
      - text: นกหลงฝูงยืดคอขึ้นสูง ขนทั้งตัวพองออก ลมรอบช่องเขาหยุดนิ่งไปหนึ่งอึดใจ แบบลมก่อนพายุ พี่ชายคนโตยกหน้าไม้ขึ้นเล็งอีกครั้ง มือสั่น
        answer: guard
        moves:
          - id: storm_stand_between
            label: เดินไปยืนระหว่างนกกับหน้าไม้ กอดอก ยืนนิ่งรับลมที่จะมา
            kind: guard
            success: ลมมาทีเดียว แรงจนเสื้อคลุมของ{name}ตีหลังดังเหมือนแส้ {name}ไม่ขยับ ลมแยกผ่านไปทั้งสองข้างเหมือนน้ำผ่านหิน พอลมหมด นกหลงฝูงลดคอลง พี่ชายคนโตลดหน้าไม้ลงตาม
          - id: storm_hood
            label: ถอดเสื้อคลุมโยนคลุมหัวนก นกที่มองไม่เห็นฟ้าจะนิ่ง
            kind: item
            stat: DEX
          - id: storm_reach
            label: สอดมือเข้าไปปลดปมใต้ปีกตอนที่มันยังพองขน
            kind: quick
          - id: storm_back_off3
            label: หมอบลงหลังหิน ปล่อยให้ลมกับหน้าไม้ตัดสินกันเอง
            kind: flee
    win:
      text: |
        นกหลงฝูงยืนนิ่งให้{name}ปลดตาข่ายออกทีละชั้น ลมรอบช่องเขาตกลงจนได้ยินเสียงตาข่ายครูดหิน ปมสุดท้ายหลุด นกกางปีกทั้งสองข้างช้าๆ ยาวกว่าช่วงแขนคนสองคนต่อกัน แล้วกระโดดลงจากขอบผาให้ลมรับ

        ลมทั้งช่องเขาไปกับมัน ขึ้นเหนือ ใบไม้บนสันเขาปลิวไปทางเดียวกันอีกครั้ง สามพี่น้องเก็บตาข่ายที่ขาดสองผืนลงเขาโดยไม่มีใครบ่น คนน้องเดินตาม{name}มาถึงทางแยก ถามว่านกแบบนั้นมาจากไหน {name}ชี้ขึ้นฟ้าทางทิศเหนือ คนน้องแหงนตามนิ้วจนลืมเดิน
      effects: { stats: { WIS: 1 }, flags: [freed_the_storm_bird] }
    lose:
      text: |
        {name}ลืมตาขึ้นมาบนหญ้าข้างขอบผา คนน้องเอาน้ำในกระบอกราดหน้าให้ ตาข่ายบนช่องเขาเหลือแต่หลักไม้หักกับเชือกขาดปลิวตามลม นกไปแล้ว ไปตอนไหน{name}ไม่เห็น

        พี่ชายคนโตนั่งนับหน้าไม้ที่เหลืออยู่ ได้คันเดียว อีกคันลมพาลงผาไปพร้อมตาข่ายทั้งสามผืน เขาบอกว่าปีหน้าจะไปดักปลาแทน
      effects: { flags: [knocked_down_by_the_storm_bird] }
    stalemate:
      text: |
        นกหลงฝูงกระพือปีกครั้งสุดท้ายแรงจนหลักไม้ต้นสุดท้ายถอนขึ้นจากดิน ตาข่ายขาดกลาง นกบินขึ้นไปพร้อมเชือกสองเส้นที่ยังพันข้อขา เชือกสะบัดอยู่ใต้ตัวมันจนลับสันเขาไปทางเหนือ

        สามพี่น้องยืนดูตาข่ายที่ขาดครึ่ง ไม่มีใครเจ็บเพิ่ม ไม่มีใครได้อะไร ทั้งหน้าหนาวนั้นมีคนเล่าว่าเห็นนกสีพายุลากเชือกบินผ่านหอเรือเหาะอีกสองครั้ง
      effects: { flags: [storm_bird_tore_loose] }
    flee:
      text: |
        {name}ลงจากสันเขาไปได้ครึ่งทาง ลมข้างหลังก็หยุด หยุดทีเดียว เหมือนประตูปิด

        ตกเย็นสามพี่น้องลงมาถึงหมู่บ้าน คนน้องแขนห้อยผ้า คนกลางหน้าไม้หายไปหนึ่งคัน ตาข่ายเหลือผืนเดียว ไม่มีใครเล่าว่าบนนั้นจบอย่างไร และไม่มีใครถาม{name}ว่าลงมาก่อนทำไม
      effects: { flags: [left_the_storm_bird] }

- id: adult.path_ranger_the_bench
  stage: adult
  scene: tavern
  weight: 30
  cast:
    old_hunter: { id: hasken, optional: true }
  when:
    age: [53, 64]
    class: ranger
  text: |
    ม้านั่งยาวหน้าโรงเตี๊ยมเป็นที่ของพรานที่ไม่ขึ้นเขาแล้ว ทุกเช้ามีคนแก่สามสี่คนนั่งเรียงกัน ถือถ้วยชาร้อน ดูเมฆ ด่าลม {name}เริ่มมานั่งตั้งแต่ต้นหนาวปีนี้ ไม่ได้ตั้งใจ เข่าเลือกให้

    เช้านี้พรานหนุ่มสาวสามคนเดินผ่านหน้าม้านั่ง สะพายธนู แบกเชือก ถือเสบียงสำหรับสองวัน จะขึ้นไปล่ากวางที่ทุ่งหญ้าบนสันเขาใหญ่ คนนำเป็นลูกสาวคนเลี้ยงแพะ ยิงแม่นที่สุดในรุ่น {name}เคยเห็นนางยิงกระต่ายที่กำลังวิ่งจากระยะห้าสิบก้าว

    ฟ้าทางตะวันตกเฉียงเหนือมีเมฆเป็นเส้นบางๆ ยาวเหมือนหางม้าโดนลมหวี เส้นพวกนั้นเลื่อนเร็วกว่าเมฆข้างล่าง {name}เห็นเมฆแบบนี้มาสี่ครั้งในชีวิต สามครั้งหิมะลงก่อนบ่าย ครั้งที่สี่ลงก่อนเที่ยง
  choices:
    - id: call_them_back
      label: ลุกไปดักหน้าพวกเขา ชี้เมฆให้ดู
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ไม่ได้ตะโกน {name}เดินไปยืนขวางทาง แล้วถามคนนำว่ากวางบนทุ่งนั้นจะหนีไปไหนตอนหิมะลง นางตอบว่าลงไปหุบทางใต้ {name}ถามว่าแล้วคนล่ะ นางเงยหน้าดูเมฆที่{name}ชี้ ดูอยู่จนเส้นเมฆเลื่อนไปได้หนึ่งช่วงนิ้ว

          สามคนนั้นวางเสบียงลงข้างม้านั่ง นั่งดื่มชากับคนแก่ ทำหน้าเบื่อจนถึงบ่ายโมง หิมะลงตอนบ่ายสอง หนาจนมองไม่เห็นโรงตีเหล็กฝั่งตรงข้าม คนนำนั่งดูหิมะผ่านหน้าต่างโรงเตี๊ยม ไม่ได้ทำหน้าเบื่ออีก
        effects: { stats: { CHA: 1 }, flags: [called_the_young_hunters_back] }
      failure:
        text: |
          คนนำดูเมฆตามนิ้วของ{name} แล้วบอกว่าเมฆหางม้ากว่าจะลงก็พรุ่งนี้ พ่อของนางสอนมาอย่างนั้น นางขอบคุณอย่างสุภาพ แล้วพาอีกสองคนขึ้นเขาไป

          หิมะลงตอนเที่ยง สามคนนั้นกลับลงมาถึงหมู่บ้านตอนเช้ามืดวันต่อมา เดินคลำรั้วหินของคอกแพะลงมาทีละช่วง คนหนึ่งนิ้วเท้าดำไปสองนิ้ว ตลอดหน้าหนาวนั้นคนนำไม่เดินผ่านหน้าม้านั่งอีก นางอ้อมไปใช้ทางหลังโรงตีเหล็ก
        effects: { flags: [the_young_hunters_did_not_listen] }
    - id: go_with_them
      label: คว้าธนูขึ้นเขาไปกับพวกเขา จะได้พากลับลงมาทันเวลา
      check: { stat: CON, dc: 14 }
      success:
        text: |
          สามคนนั้นเดินเร็ว {name}ตามไม่ทันตั้งแต่ครึ่งชั่วโมงแรก แต่{name}รู้ทางลัดขึ้นทุ่ง ทางที่หินลื่นและไม่มีคนหนุ่มสาวคนไหนอยากเดิน ไปถึงทุ่งก่อนพวกเขาครึ่งชั่วโมง นั่งรอบนหิน เมฆหางม้าข้างบนหนาขึ้นจนกลายเป็นแผ่น

          คนนำเห็นแผ่นเมฆก่อนเห็นกวาง นางหันมาหา{name}เอง {name}นำลงทางลัดเดิม หิมะไล่หลังมาตั้งแต่กลางทาง ถึงม้านั่งหน้าโรงเตี๊ยมตอนหิมะเริ่มเกาะหลังคา เข่าทั้งสองข้างของ{name}บวมไปสามวัน
        effects: { stats: { CON: 1 }, flags: [led_the_young_hunters_home] }
      failure:
        text: |
          ครึ่งทางขึ้นเข่าซ้ายของ{name}เริ่มไม่ยอมงอ สามคนนั้นต้องหยุดรอทุกร้อยก้าว ถึงทุ่งช้ากว่าที่ตั้งใจไปครึ่งเช้า แล้วหิมะก็ลงพอดี คนนำต้องเลือกระหว่างกวางกับคนแก่ นางเลือกคนแก่

          ขาลงสองคนผลัดกันพยุง{name} อีกคนเดินนำ หิมะลงหนาจนต้องผูกเชือกต่อกันทั้งสี่คน ถึงหมู่บ้านตอนค่ำ ไม่มีใครได้กวาง ไม่มีใครนิ้วเท้าดำ เช้าวันต่อมาคนนำเอาเชือกเส้นนั้นมาคืน ม้วนเรียบร้อย วางไว้ข้างถ้วยชาของ{name}บนม้านั่ง
        effects: { hp: -2, flags: [slowed_the_young_hunters] }
    - id: stay_on_the_bench
      label: นั่งอยู่ที่เดิม สั่งเจ้าของโรงเตี๊ยมให้ตั้งกาน้ำรอไว้
      text: |
        {name}ไม่ลุก บอกเจ้าของโรงเตี๊ยมให้ตั้งกาน้ำไว้บนเตาตลอดวัน แล้วนั่งดูเมฆต่อไปจนเส้นบางๆ กลายเป็นแผ่น หิมะลงตอนเที่ยง คนแก่บนม้านั่งย้ายเข้าไปนั่งในโรงเตี๊ยมทีละคน {name}เข้าไปเป็นคนสุดท้าย

        สามคนนั้นกลับลงมาตอนค่ำ หนาวจนพูดไม่เป็นคำ มือเปล่า ไม่มีกวาง ถ้วยชาสามถ้วยรออยู่บนโต๊ะข้างเตา ยังร้อน ไม่มีใครถามว่าใครสั่งไว้ คนนำดื่มหมดถ้วยแล้วเดินมานั่งข้าง{name}โดยไม่ต้องมีใครชวน ถามว่าเมฆแบบเมื่อเช้าเรียกว่าอะไร
      effects: { flags: [let_the_young_hunters_learn] }
    - id: two_benches
      label: ขอให้ฮัสเกนที่นั่งอยู่ปลายม้านั่งเป็นคนเรียก
      requires: { cast: [old_hunter] }
      text: |
        ฮัสเกนนั่งอยู่ปลายม้านั่งทุกเช้ามาก่อน{name}หลายปี แก่จนหลานต้องจูงมาส่งแล้วจูงกลับ ตาเห็นแค่แสงกับเงา {name}บรรยายเมฆให้ฟัง เส้นบาง ยาว เลื่อนเร็ว มาจากตะวันตกเฉียงเหนือ ฮัสเกนฟังจบแล้วตะโกนเรียกคนนำว่าลูกสาวของคนเลี้ยงแพะ เสียงดังเท่าสมัยที่ยังขึ้นเขาไหว

        สามคนนั้นหยุด ไม่มีพรานคนไหนในถิ่นเดินผ่านเสียงนั้นไปได้ ฮัสเกนบอกให้วางเสบียง นั่ง แล้วรอดูกับเขาว่าหิมะจะลงตอนไหน หิมะลงก่อนเที่ยง ฮัสเกนหัวเราะจนไอ แล้วสั่งชาให้ทุกคนบนม้านั่ง ใช้เงินของ{name}
      effects: { gold: -1, people: [{ id: hasken, closeness: 1 }], flags: [shared_the_bench_with_hasken] }
    - id: send_the_brown_dog
      label: ผิวปากสองเสียงเรียกหมาสีน้ำตาลหูพับที่นอนอยู่ใต้ม้านั่ง
      requires: { flag: has_haskens_dog }
      text: |
        หมาสีน้ำตาลหูพับใต้ม้านั่งเป็นหลานของหมาที่เดินตาม{name}กลับบ้านจากหุบหินเมื่อหลายปีก่อน หูพับข้างเดียวกัน วิ่งไปสิบก้าวแล้วหันกลับมาเห่าแบบเดียวกัน {name}ผิวปากสองเสียงแบบที่ฮัสเกนเคยใช้ แล้วชี้ขึ้นไปทางสันเขา มันวิ่งตามสามคนนั้นไป

        ใกล้เที่ยงหมาวิ่งลงมาก่อน สามคนนั้นลงมาตามหลังมัน ทันหิมะเกล็ดแรกพอดี คนนำบอกว่ามันไม่ยอมให้พวกเขาเดินไปทางทุ่ง ยืนขวางเห่าทุกครั้งที่เลี้ยว จนพวกเขายอมตามมันลงมา ตกค่ำนางเอาเศษเนื้อมาให้มันถึงใต้ม้านั่ง
      effects: { stats: { WIS: 1 }, flags: [haskens_dogs_line_brought_them_home] }

- id: adult.path_ranger_last_hunt
  stage: adult
  weight: 30
  when:
    age: [53, 64]
    class: ranger
    not_flags: [moved_midlife]
  text: |
    ประกาศตราหลวงติดอยู่ที่เสาหน้าโรงเตี๊ยมตั้งแต่ต้นฤดู ป่าทั้งไหล่เขาด้านเหนือเป็นป่าหลวงตั้งแต่ปีหน้า ใครจะล่าในนั้นต้องมีใบอนุญาต ปีละสี่เหรียญ ไม่มีใบ จับได้ปรับสิบเหรียญ ยึดธนู เสมียนที่มาติดประกาศอ่านให้คนที่อ่านไม่ออกฟังสามรอบ แล้วรีบกลับก่อนจะมีใครถามอะไร

    ฤดูนี้จึงเป็นฤดูสุดท้ายที่ไหล่เขาด้านเหนือเป็นของใครก็ได้ {name}ขึ้นไปตั้งแต่ก่อนรุ่งสาง ตามทางที่เดินมาทั้งชีวิต ผ่านหินก้อนที่นั่งกินข้าวเที่ยงมาทุกปี จนถึงลานโป่งดินเค็ม

    กวางเฒ่าตัวผู้ยืนเลียโป่งอยู่ตัวเดียวในหมอกเช้า เขาสิบสองกิ่ง กิ่งปลายข้างซ้ายหัก ซี่โครงเห็นเป็นร่องใต้หนัง {name}เห็นกวางตัวนี้ครั้งแรกเมื่อสิบกว่าปีก่อน ตอนยังเป็นกวางหนุ่มเขาหกกิ่ง และปล่อยไปทุกครั้งที่เจอ ด้วยเหตุผลที่ไม่ซ้ำกันสักปี ระยะตอนนี้สี่สิบก้าว ลมพัดจากกวางมาหา{name}
  choices:
    - id: take_the_old_stag
      label: ยิง ฤดูสุดท้าย ตัวสุดท้าย
      habit: hunter_eye
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          ลูกธนูดอกเดียวเข้าหลังขาหน้า ตรงที่หัวใจอยู่ กวางเฒ่ากระโดดไปสองก้าว แล้วคุกเข่าลงข้างโป่ง ช้าๆ แบบคนแก่ลงนั่ง {name}เดินเข้าไปถึงตอนที่มันยังหายใจได้อีกสามครั้ง

          {name}ใช้เวลาทั้งวันแบกเนื้อลงไหล่เขา สองเที่ยว เนื้อครึ่งหนึ่งแบ่งให้บ้านที่มีเด็ก อีกครึ่งตากแห้งเก็บไว้ทั้งหน้าหนาว เขาสิบสองกิ่งแขวนอยู่เหนือประตูบ้าน กิ่งปลายข้างซ้ายยังหักเหมือนเดิม
        effects: { stats: { DEX: 1 }, flags: [took_the_old_stag] }
      failure:
        text: |
          มือไม่นิ่งเท่าเมื่อก่อน ลูกธนูเฉียดหลังกวางไปปักต้นไม้ กวางเฒ่าไม่วิ่ง หันมาทาง{name} แล้วเดินหายเข้าหมอกไป ช้าๆ ไม่รีบ {name}ลุกขึ้นตามเร็วเกินไป เท้าลื่นบนโป่งดินเปียก ล้มลงไปทั้งตัว ข้อมือข้างที่ถือธนูกระแทกหิน

          {name}เดินลงไหล่เขาด้วยข้อมือพันผ้า ลูกธนูดอกนั้นยังปักอยู่ที่ต้นไม้ข้างโป่ง สูงเท่าหลังกวาง {name}ไม่ได้กลับขึ้นไปถอน
        effects: { hp: -2, flags: [missed_the_old_stag] }
    - id: let_the_old_stag_be
      label: ลดธนูลง ปล่อยไปอีกครั้ง ครั้งสุดท้าย
      text: |
        {name}ลดธนูลง นั่งลงบนหินเปียกน้ำค้าง ปล่อยให้กวางเฒ่าเลียโป่งจนพอ กวางเงยหน้าขึ้นดมลม หันมาทางที่{name}นั่งอยู่ แล้วเดินกลับเข้าป่าไปตามทางด่านเดิม ทางที่จะเป็นป่าหลวงในอีกไม่กี่เดือน

        ฤดูนั้น{name}ขึ้นไหล่เขาด้านเหนืออีกหลายครั้ง ไม่ได้เอาธนูขึ้นไปสักครั้ง ไปนั่งที่หินก้อนเดิม กินข้าวเที่ยง แล้วลงมา
      effects: { flags: [let_the_old_stag_be] }
    - id: buy_the_paper
      label: ปล่อยไปก่อน ลงไปจ่ายสี่เหรียญซื้อใบอนุญาตปีหน้าไว้
      requires: { min_gold: 4 }
      text: |
        {name}ลงไปต่อแถวที่ห้องเสมียนตั้งแต่บ่าย ใบอนุญาตเป็นกระดาษแข็งพับสองทบ มีตราหลวงกับชื่อ{name}เขียนด้วยลายมือเสมียน ข้างหลังพิมพ์รายชื่อสัตว์ที่ล่าได้กับฤดูที่ห้ามล่า กวางตัวผู้เขาเกินสิบกิ่งอยู่ในรายชื่อห้ามล่าตลอดปี

        {name}พับใบอนุญาตเก็บไว้ในกระเป๋าเสื้อ ปีต่อมาก็จ่ายอีกสี่เหรียญ ปีต่อไปก็จ่ายอีก กวางเฒ่ายังลงมาเลียโป่งทุกเช้าหน้าแล้ง คนที่เดินผ่านไปมาในป่าหลวงมีแต่คนที่มีกระดาษพับสองทบอยู่ในกระเป๋า
      effects: { gold: -4, alignment: { law: 1 }, flags: [bought_the_forest_paper] }
    - id: haskens_bow_last_time
      label: ปลดธนูยาวของฮัสเกนลงจากข้างเตา เอาขึ้นมาเป็นครั้งสุดท้าย
      requires: { item: hasken_longbow }
      text: |
        คันธนูยาวของฮัสเกนดำเพราะมือคนสองคน {name}ใส่ลูกธนู ง้างสาย ง้างได้สามส่วนจากสี่ ไหล่ขวาไม่ยอมไปต่อ สามส่วนพอสำหรับสี่สิบก้าว ถ้ามือนิ่ง

        {name}ค้างสายไว้อย่างนั้นจนแขนเริ่มสั่น กวางเฒ่าเงยหน้าขึ้นดมลมหนึ่งครั้ง แล้วก้มลงเลียโป่งต่อ {name}ผ่อนสายกลับช้าๆ ไม่ให้มีเสียง ขากลับลงไหล่เขา{name}ปลดสายธนูออก ถึงบ้านก็แขวนคันธนูไว้เหนือประตู ไม่ใช่ข้างเตา
      effects: { stats: { WIS: 1 }, flags: [hung_up_haskens_bow] }

# ---------- กวีเร่ ----------
- id: adult.path_bard_cracked_note
  stage: adult
  scene: tavern
  weight: 30
  when:
    age: [41, 52]
    class: bard
  text: |
    เพลงเรือกลับฝั่งเป็นเพลงที่คนในโรงเตี๊ยมนี้ขอทุกคืน ท่อนสุดท้ายขึ้นเสียงสูงแล้วลากยาว เสียงที่คนฟังรอมาตั้งแต่ต้นเพลง และ{name}ร้องถึงมาตลอดโดยไม่เคยต้องคิด

    คืนนี้เสียงแตกกลางท่อน แตกเหมือนไม้ไผ่แห้งโดนเหยียบ ดังพอให้ทั้งห้องได้ยินชัด คนโต๊ะริมประตูหัวเราะก่อน แล้วรีบหยุด หยุดเร็วจนแย่กว่าหัวเราะต่อ

    {name}จบเพลงด้วยเสียงต่ำกว่าเดิมหนึ่งขั้น เสียงปรบมือบางๆ เจ้าของโรงเตี๊ยมยกน้ำมาวางให้แก้วหนึ่ง แล้วถามเบาๆ ว่าพรุ่งนี้ยังร้องเพลงนี้อยู่ไหม คนขอทุกคืน
  choices:
    - id: drop_it_lower
      label: ลดทั้งเพลงลงสามขั้น แต่งท่อนสุดท้ายใหม่ให้พอดีกับเสียงที่เหลือ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}นั่งแก้เพลงอยู่สามคืน ลดทั้งเพลงลงสามขั้น ท่อนสุดท้ายที่เคยขึ้นสูงแล้วลากยาว เปลี่ยนเป็นลงต่ำแล้วหยุดสั้นๆ เหมือนหัวเรือชนตลิ่ง คืนแรกที่ร้องแบบใหม่ คนในโรงเตี๊ยมฟังจนจบเพลง ไม่มีใครรู้ว่าต้องปรบมือตรงไหน

          คืนที่สามมีคนปรบมือตรงที่เรือชนตลิ่ง คืนที่สิบคนทั้งห้องตบโต๊ะพร้อมกันตรงนั้น ปลายฤดูมีกวีเร่หนุ่มจากเมืองอื่นมาร้องเพลงเรือกลับฝั่งที่นี่ ร้องแบบเสียงสูงลากยาว พอถึงท้ายเพลง ครึ่งห้องตบโต๊ะลงไปก่อนเขาร้องจบ เขาหยุดกลางเสียง ไม่รู้ว่าตัวเองผิดตรงไหน
        effects: { stats: { INT: 1 }, flags: [sang_it_lower] }
      failure:
        text: |
          {name}ลดเพลงลงสามขั้น แต่ท่อนสุดท้ายที่แต่งใหม่ไม่ลงสักแบบ คืนแรกคนฟังรอเสียงสูงที่ไม่มา คืนที่สอง{name}เผลอขึ้นสูงตามความเคยชิน เสียงแตกอีก ตรงเดิม แตกยาวกว่าคราวก่อน

          เจ้าของโรงเตี๊ยมยังยิ้มให้เหมือนเดิม สัปดาห์ต่อมาเขาลดค่าร้องลงสองเหรียญ แล้วจ้างเด็กสาวที่ร้องเสียงสูงได้มาร้องเพลงเรือกลับฝั่งคืนละรอบ ก่อน{name}ขึ้น
        effects: { gold: -2, flags: [cracked_twice] }
    - id: laugh_with_them
      label: หัวเราะไปกับคนโต๊ะริมประตู แล้วแต่งเพลงไม้ไผ่แตกไว้ร้องคืนพรุ่งนี้
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          คืนต่อมา{name}เปิดด้วยเพลงใหม่ เพลงสั้นๆ ว่าด้วยกวีเร่คนหนึ่งที่เสียงแตกกลางโรงเตี๊ยม แล้วคนทั้งห้องได้ยินเสียงไม้ไผ่ ทุกท่อนจบด้วยเสียงแตกแบบเดียวกับเมื่อคืน แตกตั้งใจ แตกตรงจังหวะ คนโต๊ะริมประตูหัวเราะจนตกเก้าอี้

          เพลงไม้ไผ่แตกกลายเป็นเพลงที่คนขอคู่กับเพลงเรือกลับฝั่ง ร้องต่อกันทุกคืน ไม้ไผ่ก่อน เรือทีหลัง พอถึงท่อนสูงของเพลงเรือ ทั้งห้องแหกปากร้องเสียงแตกแทน{name}ให้เอง
        effects: { stats: { CHA: 1 }, flags: [laughed_at_the_crack] }
      failure:
        text: |
          {name}หัวเราะ ไม่มีใครหัวเราะด้วย คนโต๊ะริมประตูก้มหน้าลงดูแก้ว {name}ร้องเพลงไม้ไผ่แตกที่แต่งขึ้นสดๆ ได้สองท่อนก็รู้ว่าไม่ตลก คนฟังไม่ได้อยากหัวเราะใส่คนที่ร้องให้พวกเขาฟังมาสิบปี

          คืนนั้น{name}กลับห้องพักไปนั่งกลั้วคอด้วยน้ำเกลือจนดึก คอแสบไปสามวัน
        effects: { hp: -1, flags: [laughed_alone] }
    - id: rest_the_voice
      label: พักเสียงหนึ่งเดือน ขึ้นเวทีเล่นพิณอย่างเดียว
      requires: { min_gold: 3 }
      text: |
        เดือนนั้น{name}ขึ้นเวทีทุกคืนเหมือนเดิม แต่ไม่ร้องสักคำ เล่นพิณอย่างเดียว ค่าเล่นเหลือครึ่งเดียว บางโต๊ะลุกกลับตั้งแต่เพลงที่สอง นิ้วของ{name}ได้ทำงานแทนคอ ไล่สายพิณไปในทางที่ไม่เคยมีเวลาลองตอนต้องร้องไปด้วย

        ปลายเดือนคนโต๊ะริมประตูขอเพลงเรือกลับฝั่งแบบไม่มีคำ {name}เล่นท่อนสุดท้ายด้วยสายเส้นที่สูงที่สุดของพิณ ลากยาวแทนเสียงที่ไม่ได้ร้อง
      effects: { gold: -3, stats: { DEX: 1 }, flags: [rested_the_voice] }
    - id: lirans_remedy
      label: ต้มน้ำผึ้งกับขิง แล้วร้องจากใต้ซี่โครงแบบที่เคยสอนลีราน
      requires: { flag: fixed_lirans_voice }
      text: |
        ตำรับนั้น{name}เคยต้มให้ลีรานในบ่ายวันที่นางไม่มีเสียง น้ำผึ้งสองช้อน ขิงทุบหนึ่งแง่ง เกลือหยิบมือ แล้วร้องจากใต้ซี่โครงแทนลำคอ {name}สอนคนอื่นมาแล้ว แต่ไม่เคยต้องใช้เอง

        คืนต่อมาเพลงเรือกลับฝั่งออกมาต่ำกว่าเดิมสามขั้น หยาบกว่าเดิม ท่อนสุดท้ายไม่แตก เป็นเสียงแบบเดียวกับที่ลีรานใช้ร้องมาตั้งแต่บ่ายวันนั้น ชายแก่ที่นั่งโต๊ะหลังสุดทุกคืนลุกขึ้นยืนก่อนเพลงจบ แล้วหันไปดูประตูโรงเตี๊ยม
      effects: { stats: { CON: 1 }, flags: [sang_in_lirans_voice] }

- id: adult.path_bard_ford_toll
  stage: adult
  scene: road
  weight: 30
  when:
    age: [41, 52]
    class: bard
  text: |
    ท่าข้ามลำน้ำเป็นทางเดียวระหว่างสองเมืองที่{name}รับร้องประจำ หน้าแล้งน้ำลึกแค่เข่า เดินลุยข้ามได้ ปีนี้มีคนสี่คนมาตั้งเพิงอยู่ฝั่งนี้ เก็บค่าข้ามคนละสามเหรียญ ใครไม่จ่าย เดินกลับไปทางเดิม

    {name}มาถึงตอนบ่าย สะพายซองพิณ คนหัวหน้ายืนขวางทางลงน้ำ ถือกระบองไม้มะขาม บอกว่าค่าข้ามของคนถือพิณคือพิณ อีกสองคนเดินอ้อมมาข้างหลัง{name}ช้าๆ คนที่สี่อายุน้อยที่สุด นั่งอยู่บนตอไม้หน้าเพิง ใช้นิ้วเคาะด้ามกระบองของตัวเองเป็นจังหวะ

    จังหวะนั้น{name}จำได้ก่อนจะรู้ตัวว่าจำได้ เป็นจังหวะเพลงเกี่ยวข้าว เพลงที่{name}แต่งให้คนเกี่ยวข้าวทางเหนือร้องตอนเย็นเมื่อหลายปีก่อน
  encounter:
    foe: bandit
    name: โจรท่าข้าม
    morale: 2
    beats:
      - text: คนหัวหน้ายื่นมือออกมาขอซองพิณ สองคนข้างหลังขยับเข้ามาอีกก้าว บนตอไม้หน้าเพิง คนที่อายุน้อยที่สุดยังเคาะด้ามกระบองเป็นจังหวะเพลงเกี่ยวข้าว ไม่เร็วไม่ช้า ไม่รู้ตัว
        moves:
          - id: ford_watch_youngest
            label: ดูคนบนตอไม้ ว่าเขารู้ไหมว่าตัวเองเคาะเพลงของใคร
            kind: read
            stat: WIS
            success: เขาไม่รู้ เขาเคาะไปมองน้ำไป ปากขยับตามคำท่อนที่สอง ผิดไปคำหนึ่ง ผิดแบบเดียวกับที่คนเกี่ยวข้าวทางเหนือร้องผิดกันทั้งถิ่น คนหัวหน้าหันไปมองเขาครั้งหนึ่ง แล้วหันกลับมาด้วยหน้าตึงกว่าเดิม เหมือนคนที่โดนขัดจังหวะตอนนับเงิน
          - id: ford_sing_toll
            label: ถามว่าจ่ายค่าข้ามเป็นเพลงได้ไหม คนละเพลง เลือกเอาเอง
            kind: talk
            parley: true
          - id: ford_bluff
            label: บอกว่ากองเกวียนเกลือของพ่อค้าเมืองท่าตามมาข้างหลังไม่เกินครึ่งชั่วโมง
            kind: talk
          - id: ford_stick
            label: ฟาดไม้เท้าใส่มือที่ยื่นมา
            kind: attack
          - id: ford_run
            label: ถอยกลับไปตามทางเดิม อ้อมไปข้ามที่สะพานไม้
            kind: flee
      - text: คนหัวหน้าเลิกรอ คว้าสายสะพายซองพิณแล้วกระชาก อีกสองคนเข้ามาประกบซ้ายขวา คนหนึ่งยกกระบองขึ้นระดับไหล่
        answer: guard
        moves:
          - id: ford_hold_case
            label: กอดซองพิณไว้กับอก ก้มตัวรับ ไม่ปล่อย
            kind: guard
            success: กระบองลงที่หลังหนึ่งที ไม่หนักเท่าที่คิด คนถือยั้งมือไว้ครึ่งหนึ่ง {name}ไม่ปล่อยซอง ไม่เงยหน้า คนหัวหน้ากระชากอีกสองครั้งจนสายสะพายบาดมือตัวเอง เขาสบถ แล้วปล่อย
          - id: ford_tell_worth
            label: บอกว่าพิณตัวนี้ขายที่ไหนก็ไม่ได้ ร้านรับซื้อของทุกร้านริมน้ำรู้ว่าเป็นของใคร
            kind: talk
          - id: ford_slip_strap
            label: ปลดหัวเข็มขัดสายสะพาย ปล่อยให้เขากระชากได้แต่สาย
            kind: quick
          - id: ford_run2
            label: สะบัดหลุด วิ่งกลับไปตามทางเดิม
            kind: flee
      - text: คนหัวหน้ายกกระบองขึ้นอีกครั้ง แต่ยังไม่ลง รอให้อีกสองคนเข้ามาพร้อมกัน บนตอไม้หน้าเพิง คนที่อายุน้อยที่สุดยังเคาะอยู่ เคาะดังขึ้นจนทุกคนได้ยิน คนที่ประกบซ้ายเหลือบไปทางตอไม้ แล้วเหลือบกลับมาที่{name}
        answer: talk
        moves:
          - id: ford_sing_now
            label: ร้องเพลงเกี่ยวข้าวขึ้นมาตรงนั้น ตามจังหวะที่เขาเคาะ
            kind: talk
            success: "{name}ร้องท่อนแรกด้วยเสียงที่เหลือ ถึงตรงที่ต้องขึ้นสูง เสียงของ{name}ไปไม่ถึง คนบนตอไม้ร้องท่อนนั้นขึ้นมาเอง เสียงหนุ่ม ใส ขึ้นถึงโดยไม่ต้องพยายาม ร้องจบท่อนแล้วเขาจึงรู้ตัว ยกมือขึ้นปิดปาก"
          - id: ford_give_coins
            label: เทเหรียญในถุงลงบนฝ่ามือ ยื่นให้ แต่กอดพิณไว้ข้างตัว
            kind: guard
          - id: ford_ask_name
            label: ถามคนบนตอไม้ว่าชื่ออะไร ได้เพลงนี้มาจากไหน
            kind: talk
            success: เขาตอบก่อนจะทันคิด ชื่อของเขาเป็นชื่อทางเหนือ ได้เพลงมาจากแม่ แม่ร้องตอนเกี่ยวข้าวทุกปี จนถึงปีที่นาผืนนั้นกลายเป็นลานกองดินของเหมือง คนหัวหน้าตะคอกให้เขาเงียบ ช้าไปหนึ่งคำ คนที่ประกบซ้ายลดกระบองลงไปครึ่งศอก
          - id: ford_run3
            label: สะบัดหลุด วิ่งกลับไปทางเดิม
            kind: flee
    win:
      text: |
        คนหัวหน้าลดกระบองลง หันไปดูคนบนตอไม้ ดูซองพิณ แล้วเตะตอไม้ทีหนึ่งให้เสียงเคาะหยุด เขาหลีกทางลงท่าข้ามให้ครึ่งตัว พอให้คนหนึ่งเดินผ่าน ไม่ขอค่าข้าม ไม่ขอพิณ

        {name}ลุยน้ำไปถึงกลางลำ ข้างหลังมีเสียงเคาะด้ามกระบองตามมาอีก จังหวะเพลงเกี่ยวข้าว ช้ากว่าเดิม คราวนี้เคาะตั้งใจ {name}ร้องท่อนสุดท้ายส่งกลับไปข้ามน้ำ ร้องจนขึ้นฝั่งตรงข้าม
      effects: { stats: { CHA: 1 }, flags: [sang_past_the_ford] }
    parley:
      text: |
        คนหัวหน้าหัวเราะออกมาเสียงหนึ่ง แล้วบอกว่าได้ คนละเพลง เพลงไหนไม่ดีต้องจ่ายเป็นเงินแทน {name}นั่งลงบนตอไม้ข้างคนที่อายุน้อยที่สุด เปิดซองพิณ ร้องสี่เพลงตามที่สี่คนขอ คนที่อายุน้อยที่สุดขอเป็นคนสุดท้าย ขอเพลงเกี่ยวข้าว แล้วร้องตามทั้งเพลงโดยไม่มีใครห้าม

        ไม่มีเพลงไหนต้องจ่ายเป็นเงิน คนหัวหน้าลุยน้ำมาส่ง{name}ถึงกลางลำ บอกว่าคราวหน้ามาอีก ค่าข้ามเท่าเดิม
      effects: { stats: { CHA: 1 }, flags: [paid_the_ford_in_song] }
    lose:
      text: |
        {name}ลืมตาขึ้นมาบนกรวดริมน้ำ แดดบ่ายแรงขึ้นแล้ว ถุงเงินที่เอวหายไป เพิงหน้าท่าข้ามว่าง ไฟในเตายังมีควันลอย

        ซองพิณวางอยู่ข้างตัว ปิดฝาเรียบร้อย ตะขอสองตัวคล้องไว้ครบ วางอยู่ในเงาของตอไม้ ไม่ใช่กลางแดด
      effects: { gold: -5, flags: [robbed_at_the_ford] }
    stalemate:
      text: |
        เสียงกระดิ่งวัวดังมาจากโค้งถนน แล้วเกวียนเกลือคันแรกก็โผล่ออกมา ตามด้วยคันที่สอง สาม สี่ คนคุมเกวียนถือหอกเดินข้างวัวคันละสองคน คนหัวหน้าดูกองเกวียน แล้วพาคนของเขาถอยเข้าพงอ้อหลังเพิงไปโดยไม่หันกลับมา

        {name}ข้ามน้ำไปพร้อมกองเกวียนเกลือ เดินข้างวัวคันสุดท้าย คนคุมเกวียนถามว่ารู้จักพวกนั้นหรือ {name}บอกว่ารู้จักแค่คนเดียว รู้จักจากจังหวะมือ
      effects: { flags: [crossed_with_the_salt_carts] }
    flee:
      text: |
        {name}ไปข้ามที่สะพานไม้ทางเหนือ อ้อมไปสองวัน ถึงโรงเตี๊ยมที่รับร้องไว้ช้าไปหนึ่งคืน เจ้าของจ้างคนอื่นไปแล้ว

        ตลอดทางอ้อม เพลงเกี่ยวข้าวติดอยู่ในหัวตามจังหวะนิ้วของคนบนตอไม้ เร็วกว่าที่{name}แต่งไว้นิดหนึ่ง
      effects: { gold: -2, flags: [fled_the_ford] }

- id: adult.path_bard_printed_songs
  stage: adult
  scene: market
  weight: 30
  when:
    age: [53, 64]
    class: bard
  text: |
    แผงหนังสือในตลาดวางสมุดเล่มใหม่ไว้หน้าสุด ปกกระดาษแข็งสีน้ำตาล หัวปกพิมพ์ว่าเพลงที่คนร้องกันทั่วถิ่น สี่สิบเพลง เล่มละหนึ่งเหรียญ ร้านพิมพ์หลังท่าเรือพิมพ์ออกมาสามร้อยเล่ม คนขายบอกว่าขายไปครึ่งหนึ่งแล้ว ส่วนใหญ่เป็นแม่ที่ซื้อไปให้ลูกหัดอ่าน

    {name}เปิดดูทีละหน้า สิบเอ็ดเพลงในสี่สิบเป็นเพลงของ{name} ใต้ชื่อเพลงพิมพ์ว่าไม่ทราบผู้แต่งทุกเพลง คำผิดไปหลายที่ บางที่ผิดแบบคนจดตามเสียงร้องในโรงเตี๊ยมตอนเมา บางที่ผิดแบบคนแก้ให้คล้องจองกว่าเดิม เพลงเกี่ยวข้าวหายไปทั้งท่อนที่สาม

    คนขายถามว่าจะซื้อไหม สมุดในมือของ{name}เริ่มยับตรงสันแล้ว
  choices:
    - id: claim_the_songs
      label: ไปที่ร้านพิมพ์ บอกว่าสิบเอ็ดเพลงนั้นมีคนแต่ง
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          เจ้าของร้านพิมพ์ไม่เชื่อ จนกระทั่ง{name}ร้องเพลงที่สามในสมุดให้ฟังด้วยคำเดิม คำที่ไม่มีในสมุด แล้วร้องเพลงที่เจ็ด แล้วเพลงที่สิบเอ็ด ลูกมือในร้านหยุดเรียงตัวพิมพ์มาฟังกันทั้งร้าน

          พิมพ์ครั้งที่สองออกมาตอนปลายฤดู ใต้ชื่อเพลงสิบเอ็ดเพลงมีชื่อ{name}พิมพ์ตัวเล็กๆ ร้านพิมพ์จ่ายค่าเพลงย้อนหลังห้าเหรียญ บอกว่าเป็นธรรมเนียมใหม่ ยังไม่เคยจ่ายใคร คำที่ผิดในเล่มใหม่ยังผิดอยู่เกือบทุกที่ เพราะตัวพิมพ์เรียงไว้แล้ว ไม่มีใครอยากรื้อ
        effects: { stats: { CHA: 1 }, gold: 5, flags: [name_under_the_printed_songs] }
      failure:
        text: |
          เจ้าของร้านพิมพ์ฟัง{name}ร้องจบเพลงหนึ่ง แล้วหัวเราะ บอกว่าเดือนนี้มีคนมาบอกว่าเป็นคนแต่งเพลงในเล่มนี้แล้วเจ็ดคน สามคนร้องได้ดีกว่า{name} คนหนึ่งร้องเพลงเดียวกันนี้มา

          {name}เดินกลับผ่านแผงหนังสือในตลาด สมุดสีน้ำตาลเหลือไม่ถึงสิบเล่ม เด็กผู้หญิงคนหนึ่งยืนอ่านเพลงเกี่ยวข้าวออกเสียงให้แม่ฟัง อ่านขาดท่อนที่สามไปทั้งท่อน
        effects: { flags: [the_printer_laughed] }
    - id: correct_the_words
      label: ซื้อมาเล่มหนึ่ง แก้คำผิดทั้งสิบเอ็ดเพลงด้วยหมึกแดง แล้วส่งไปให้ร้านพิมพ์
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}นั่งแก้อยู่สามคืน ไม่แก้ชื่อผู้แต่ง แก้แต่คำ ท่อนที่สามของเพลงเกี่ยวข้าวเขียนเติมไว้ที่ขอบกระดาษ ตัวเล็กจนต้องเอียงหน้ากระดาษอ่าน แล้วฝากพ่อค้าปลาเค็มที่ขึ้นล่องท่าเรือทุกสัปดาห์เอาไปส่งที่ร้านพิมพ์

          พิมพ์ครั้งที่สองคำถูกทุกคำ ท่อนที่สามกลับมาอยู่ที่เดิม ใต้ชื่อเพลงยังพิมพ์ว่าไม่ทราบผู้แต่ง เด็กในตลาดร้องเพลงเกี่ยวข้าวครบสามท่อนเป็นครั้งแรก ท่อนที่สามช้ากว่าท่อนอื่นนิดหนึ่ง เพราะยังต้องก้มดูสมุด
        effects: { gold: -1, stats: { INT: 1 }, flags: [corrected_the_printed_songs] }
      failure:
        text: |
          {name}แก้ไปได้สามเพลงก็เริ่มไม่แน่ใจ คำที่แต่งไว้เดิมกับคำที่คนร้องกันมาหลายปีปนกันอยู่ในหัว บางท่อนแก้แล้วแก้กลับ หมึกแดงทับกันสามชั้นจนอ่านไม่ออก

          ร้านพิมพ์ส่งสมุดเล่มนั้นกลับมากับพ่อค้าปลาเค็ม ข้างในเหน็บกระดาษแผ่นเล็กเขียนว่าอ่านไม่ออก ถ้าจะแก้ให้มาร้องให้ฟังเอง
        effects: { gold: -1, flags: [ruined_the_correction] }
    - id: let_them_sing_it_wrong
      label: ซื้อหนึ่งเล่มกลับบ้าน ไม่แก้อะไรสักคำ
      text: |
        {name}จ่ายหนึ่งเหรียญ เอาสมุดกลับไปวางบนชั้นข้างซองพิณ บางคืนเปิดอ่านเพลงของตัวเองในแบบที่คนอื่นจำ คำที่ผิดบางคำฟังดีกว่าคำเดิม บางคำไม่

        ปลายฤดู{name}ร้องเพลงเกี่ยวข้าวในโรงเตี๊ยมแบบสองท่อน ตามสมุด ไม่มีใครในห้องถามหาท่อนที่สาม
      effects: { gold: -1, stats: { WIS: 1 }, flags: [let_the_printed_songs_be] }
    - id: the_first_ending_in_print
      label: เปิดหาเพลงที่ท่อนแรกเป็นของ{name} ท่อนจบเป็นของลีราน
      requires: { flag: sang_own_ending }
      text: |
        เพลงนั้นอยู่หน้าที่สามสิบ ใต้ชื่อเพลงพิมพ์ว่าไม่ทราบผู้แต่ง ท่อนแรกเป็นของ{name} แต่ท่อนจบไม่ใช่ท่อนที่ทั้งเมืองร้อง เป็นท่อนจบเดิมที่{name}แต่งไว้ตั้งแต่ยังเด็ก ยาวไปหนึ่งบรรทัด สัมผัสไม่ลงสองที่ ท่อนที่{name}ร้องให้ลีรานฟังครั้งเดียวบนขอบเตียงคืนนั้น และคิดว่าเหลืออยู่ในหัวของตัวเองคนเดียว

        เจ้าของร้านพิมพ์บอกว่าคนจดเพลงนี้มาให้เป็นคนงานโรงเตี๊ยมหลังนั้น ตอนเด็กเขาเป็นคนวิ่งไปตาม{name}มา คืนนั้นเขานั่งฟังอยู่หลังประตูห้องชั้นบนจนจบ แล้วจำไว้ทั้งท่อนมาตั้งแต่นั้น
      effects: { stats: { INT: 1 }, flags: [found_own_ending_in_print] }
    - id: lirans_name_in_print
      label: จ่ายร้านพิมพ์ให้ใส่ชื่อลีรานไว้ใต้เพลงที่ทั้งเมืองร้อง
      requires: { flag: sang_lirans_ending }
      text: |
        เพลงนั้นอยู่หน้าที่สามสิบ ท่อนแรกของ{name} ท่อนจบของลีราน แบบที่ทั้งเมืองร้อง ใต้ชื่อเพลงพิมพ์ว่าไม่ทราบผู้แต่ง {name}ไปที่ร้านพิมพ์ จ่ายหนึ่งเหรียญ ขอให้พิมพ์ครั้งหน้าใส่ชื่อคนแต่งไว้ใต้เพลงนั้นเพลงเดียว ชื่อเดียว

        เจ้าของร้านถามว่าแล้วท่อนแรกล่ะ {name}บอกว่าคนร้องจำท่อนจบ พิมพ์ครั้งที่สองออกมาตอนปลายฤดู ใต้ชื่อเพลงหน้าที่สามสิบมีชื่อลีรานพิมพ์ตัวเล็กๆ เป็นชื่อคนแต่งชื่อเดียวในสมุดทั้งเล่ม
      effects: { gold: -1, alignment: { moral: 1 }, flags: [left_liran_her_name] }

- id: adult.path_bard_last_song
  stage: adult
  scene: tavern
  weight: 30
  when:
    age: [53, 64]
    class: bard
  text: |
    โรงเตี๊ยมหัวสะพานจะปิดสิ้นเดือนนี้ เจ้าของแก่จนยกถังเหล้าไม่ไหว ลูกหลานขายตึกให้พ่อค้าผ้า คืนสุดท้ายเจ้าของขอให้{name}ร้อง {name}ร้องที่นี่เกือบทุกคืนวันเบเลคมาตั้งแต่ยังมีเสียงเต็ม

    เสียงของ{name}ทุกวันนี้ร้องได้สามเพลงก่อนแหบ เพลงที่สี่ต้องเลือกว่าจะร้องท่อนไหน ข้ามท่อนไหน คืนนี้คนเต็มร้านตั้งแต่ก่อนตะวันตก ยืนเบียดกันไปถึงประตู

    นีวาล นักร้องสาวอายุสิบเก้าที่ขึ้นร้องก่อน{name}ทุกคืนมาสองปี นั่งรออยู่ข้างเวที เสียงของนางขึ้นถึงทุกที่ที่เสียงของ{name}เคยถึง นางนั่งเช็ดสายพิณของตัวเองเส้นเดิมซ้ำไปซ้ำมา
  choices:
    - id: sing_it_broken
      label: ร้องทุกเพลงที่คนขอ เสียงแตกตรงไหนก็ให้แตกตรงนั้น
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          เพลงที่สี่เสียงแหบ เพลงที่หก{name}ร้องท่อนสูงไม่ถึง แล้วไม่พยายามให้ถึง ปล่อยให้เสียงแตกตรงนั้น คนในร้านร้องท่อนนั้นขึ้นมาเองทั้งห้อง ดังจนแก้วบนชั้นสั่น เพลงที่เจ็ด แปด เก้า เป็นแบบนั้นทุกเพลง {name}ร้องครึ่ง คนในร้านร้องอีกครึ่ง

          เพลงสุดท้าย{name}ร้องไม่ออกแล้ว ทำได้แค่เล่นพิณ คนทั้งร้านร้องเพลงนั้นจนจบเอง เจ้าของโรงเตี๊ยมยืนอยู่หลังโต๊ะยาว ร้องตามไปด้วย เพี้ยนทั้งเพลง ไม่มีใครบอกให้หยุด
        effects: { stats: { CHA: 1 }, people: [{ id: nival, name: นีวาล, gender: f, bond: friend, closeness: 1, age: 19 }], flags: [the_room_sang_your_last_note] }
      failure:
        text: |
          เพลงที่ห้าเสียงหายกลางคำ ไม่แตก หายไปเฉยๆ {name}อ้าปากค้างอยู่หน้าคนทั้งร้าน มีแต่ลมผ่านคอออกมา ไม่มีเสียงตาม ลองอีกครั้ง ไอจนต้องก้มตัว คนแถวหน้ายื่นน้ำให้ ทั้งร้านรอ

          เจ้าของโรงเตี๊ยมพาขึ้นไปนั่งพักห้องชั้นบน ข้างล่างนีวาลขึ้นร้องต่อ ร้องเพลงของ{name}ทีละเพลงตามลำดับที่{name}จดไว้บนกระดาษข้างเวที เสียงลอดพื้นไม้ขึ้นมาถึงห้องที่{name}นั่งอยู่จนร้านปิด
        effects: { hp: -1, people: [{ id: nival, name: นีวาล, gender: f, bond: friend, closeness: 1, age: 19 }], flags: [the_last_night_broke] }
    - id: give_the_night_to_nival
      label: ร้องเพลงเดียว แล้วยกเวทีที่เหลือทั้งคืนให้นีวาล
      text: |
        {name}ร้องเพลงเดียว เพลงที่ร้องเป็นเพลงแรกในร้านนี้เมื่อหลายสิบปีก่อน แล้วหันไปเรียกนีวาลขึ้นเวที บอกคนทั้งร้านว่าเพลงที่เหลือคืนนี้ให้นางร้อง ร้านเงียบไปครู่หนึ่ง มีคนโห่ แล้วมีคนตบโต๊ะให้คนที่โห่หุบปาก

        นีวาลร้องจนตีสอง เพลงของ{name}ครึ่งหนึ่ง เพลงของนางเองครึ่งหนึ่ง {name}นั่งที่โต๊ะริมประตู ดื่มชาที่เจ้าของโรงเตี๊ยมชงให้ ตอนร้านปิด นางเดินลงจากเวทีมาวางพิณลงข้างพิณของ{name} สองตัวพิงกันอยู่อย่างนั้นจนเจ้าของโรงเตี๊ยมดับตะเกียงดวงสุดท้าย
      effects: { alignment: { moral: 1 }, people: [{ id: nival, name: นีวาล, gender: f, bond: friend, closeness: 2, age: 19 }], flags: [gave_the_last_night_to_nival] }
    - id: teach_nival_every_song
      label: ใช้เดือนสุดท้ายของร้าน สอนนีวาลทุกเพลงที่เคยร้องที่นี่
      check: { stat: INT, dc: 13 }
      success:
        text: |
          เดือนนั้น{name}มาที่ร้านทุกบ่ายก่อนเปิด สอนนีวาลวันละสองเพลง สอนคำ สอนตรงที่ต้องหายใจ สอนว่าโต๊ะไหนจะขอเพลงไหนในคืนไหน และเพลงไหนห้ามร้องถ้าคนเลี้ยงวัวจากฝั่งตะวันออกนั่งอยู่ในร้าน นางจดลงสมุดทุกอย่าง ลายมือตัวกลมๆ

          คืนสุดท้าย{name}ร้องสามเพลงแรก นีวาลร้องที่เหลืออีกหกสิบเอ็ดเพลง ตามลำดับในสมุดของนาง ไม่ผิดสักเพลง ตอนร้านปิดนางยังร้องต่อเบาๆ คนเดียว ขณะที่เจ้าของโรงเตี๊ยมยกเก้าอี้ขึ้นวางบนโต๊ะทีละตัว
        effects: { stats: { INT: 1 }, people: [{ id: nival, name: นีวาล, gender: f, bond: friend, closeness: 2, age: 19 }], flags: [taught_nival_every_song] }
      failure:
        text: |
          นีวาลจำเพลงได้เร็ว แต่{name}สอนช้ากว่าที่คิด ทุกเพลงมีเรื่องที่ต้องเล่าก่อนร้อง ใครขอเพลงนี้เป็นคนแรก ทำไมท่อนนี้ต้องช้า เล่าไปเล่ามาครึ่งบ่ายหมดไปกับเพลงเดียว ครบเดือนสอนได้สิบเจ็ดเพลง

          คืนสุดท้ายนีวาลร้องสิบเจ็ดเพลงนั้นครบ แล้วต้องหยุด มีคนขอเพลงที่สิบแปด นางไม่รู้จัก {name}ลุกขึ้นร้องเพลงนั้นเองด้วยเสียงที่เหลือ เพลงที่สิบเก้าก็ร้องเอง
        effects: { people: [{ id: nival, name: นีวาล, gender: f, bond: friend, closeness: 1, age: 19 }], flags: [nival_left_half_taught] }
    - id: the_folded_words
      label: หยิบกระดาษที่พับเก็บไว้ในซองพิณให้นีวาล
      requires: { flag: let_the_song_go }
      text: |
        กระดาษแผ่นนั้นอยู่ในซองพิณมาตั้งแต่วันที่{name}เดินผ่านบ่อน้ำหมู่บ้านนั้น คำเดิมของเพลงที่เด็กๆ ร้องเปลี่ยนไปครึ่งเพลง ท่อนแม่น้ำยังเป็นแม่น้ำ ท่อนความรักยังเป็นความรัก ไม่มีแมว ตั้งแต่วันนั้น{name}ไม่ได้ร้องเพลงนี้อีกเลย

        {name}ยื่นกระดาษให้นีวาลก่อนเปิดร้าน คืนนั้นนางร้องเพลงนั้นเป็นเพลงสุดท้ายของโรงเตี๊ยมหัวสะพาน ด้วยคำเดิมทุกคำ คนครึ่งร้านจำทำนองได้ทันที แล้วร้องตามด้วยคำที่ตัวเองรู้ ท่อนแม่น้ำมีคนร้องว่าบ่อน้ำ ท่อนความรักมีคนร้องถึงแมว นีวาลร้องคำบนกระดาษทับเสียงพวกนั้นไปจนจบ
