# ชุด 5 ยุคดาวเร่ง แพ็ก ก: วันที่ยังไม่มา คนเรียกว่า "มาก่อนตัว" (8 เรื่อง) สิ่งติดตัว curse_not_yet (เมื่อวานปนพรุ่งนี้ ไม่มีขั้น)
# 1 สัญญาณแรกที่ฮอร์ดุน ชื่อที่มาก่อนบนผนังเสา (ทุกวัย คนมีตรามีทางของตัวเอง) · 2 สมุดวันข้างประตู (ทุกวัย ไม่ผูกถิ่น)
# 3 ของที่ยื่นให้ ดันรอยดาว (ทุกวัย) · 4 อุบัติเหตุใต้รอก (วัยทำงาน) · 5 ฟังไกลหาเด็กหาย ข้อตกลงที่สอง ดันรอยดาว (ทุกวัย)
# 6 งานศพที่ร้องไห้ไปแล้ว (ทุกวัย) · 7 กระดานชนวนหัวเตียง (วัยปลาย เกิดซ้ำได้) · 8 ทางออกสองทาง (ทุกวัย)
# คนที่มีแต่ในข้อความ: เกดรา ตระกูลกุญแจคด หญิงคนแคระขายไส้ตะเกียงตามสถานีรางไต่เขา · ตาโคเรน ชายแก่บ้านติดกันที่อ่านสมุดวันทุกเช้า
#   หญิงขายด้ายที่มาถึงก่อนแล้วค่อยออกเดินทาง · บาเดน ช่างซ่อมรองเท้า กับเมีย · ยายบ้านปากซอยที่เคยเป็นแบบนี้แล้วหาย
# ข้อความไม่อธิบายว่าเสียงที่มาก่อนคืออะไร คนมีตราไม่ได้ยินเสียงสิ่วที่ผนังเสา

# ---------- 1 สัญญาณแรก: ชื่อที่มาก่อน ----------
- id: adult.sky_notyet_name_before
  stage: adult
  weight: 28
  scene: home
  when:
    age: [16, 130]
    year: [344, 352]
    location_tag: hordun
  text: |
    เกดรา ตระกูลกุญแจคด เดินขายไส้ตะเกียงตามสถานีรางไต่เขามาตั้งแต่สถานียังไม่มีหลังคา ทุกบ้านบนเขาเคยซื้อไส้จากย่ามของนาง วันนี้นางวางขนมปังดำก้อนกลมลงบนโต๊ะของ{name}สองก้อน ก้อนบนกดลายประตูปิดไว้กลางก้อน ขนมปังงานศพ นางบอกว่าช่วยกินหน่อย ตู้ที่บ้านปิดไม่ลงแล้ว

    หลังเดือนหนาว คนถือสิ่วขึ้นไปซ้ำร่องชื่อบนผนังเสาของออสซาตามธรรมเนียม แล้วเจอชื่อนางอยู่ในแถวของตระกูล ชื่อตัวกับชื่อตระกูลครบ ร่องคมจนบาดนิ้ว ฝุ่นหินยังไม่ทันลงร่อง ไม่มีใครในตระกูลสั่งสลัก สภาตระกูลห้ามสกัดออก เพราะการสกัดชื่อเป็นโทษของคนทรยศ ตั้งแต่วันนั้นเพื่อนบ้านทยอยมาหานาง ยกขนมปังมาให้ จับมือนาง เล่าเรื่องดีๆ ของนางให้นางฟังเอง คนที่อยู่ใต้ผนังเสาเล่าว่าได้ยินเสียงสิ่วเคาะหินแว่วลงมาทุกคืนจนใกล้สาง ขึ้นไปดูก็ไม่เจอใคร

    เกดราบิขนมปังของตัวเองกินคำหนึ่ง บอกว่าแป้งหนักมือไปหน่อย แล้วถามว่าถ้าเป็น{name} จะทำอย่างไรกับชื่อนั้น
  choices:
    - id: read_the_strokes
      label: ขึ้นไปดูร่องชื่อกับนาง ดูให้ออกว่าเป็นฝีสิ่วของใคร
      habit: curious
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ผนังเสาเย็นเฉียบทั้งที่แดดส่องเต็มหน้า คนถือสิ่วคนที่เจอชื่อยืนรออยู่ตรงแถวของตระกูลกุญแจคด มือกำด้ามสิ่วเหมือนกลัวใครจะมาขอยืม {name}ไล่ปลายนิ้วตามร่องทีละตัวอักษร ช่างหินทุกคนลากหางสิ่วออกตอนจบเส้นในแบบของตัวเอง ร่องชื่อเกดราลากหางขึ้นแล้วตวัดกลับนิดหนึ่ง แบบเดียวกับชื่อที่คนถือสิ่วเพิ่งซ้ำร่องให้ใหม่ทั้งแถวเมื่อเช้า

          {name}ชี้ให้ดูทั้งสองชื่อ คนถือสิ่วก้มดูมือตัวเอง แล้วเอามือไพล่หลัง เขาเก็บสิ่วเข้าซองหนัง บอกเกดราว่าปีนี้เขาจะไม่ขึ้นมาซ้ำร่องแถวนี้อีก
        effects: { stats: { INT: 1 }, flags: [read_the_strokes_of_a_name_before] }
      failure:
        text: |
          ร่องบนผนังเสาเหมือนกันไปหมดในสายตา{name} ร่องเก่าร้อยปีกับร่องใหม่ต่างกันแค่ฝุ่น ลมที่ไหลลงตามผนังเสาเย็นจนน้ำตาเล็ด {name}ไล่นิ้วจนปลายนิ้วถลอก ก็ยังไม่ได้อะไรมากกว่าที่คนบนเขารู้กันอยู่แล้ว

          ขาลงเกดราซื้อน้ำต้มขิงให้คนละถ้วย นางบอกว่าที่ของนางบนกำแพงอยู่สูงกว่าห้องเช่าตอนนี้ตั้งสามชั้น ลมโกรกดี
        effects: { hp: -1, flags: [read_the_strokes_of_a_name_before] }
    - id: eat_the_bread
      label: กินขนมปังงานศพกับนาง แล้วเล่าเรื่องดีๆ ของนางให้นางฟังเหมือนคนอื่น
      text: |
        {name}เล่าเรื่องปีที่หิมะปิดราง เกดราแบกไส้ตะเกียงเดินเลียบรางขึ้นไปถึงสถานีบนสุด เพราะรู้ว่าข้างบนมืดกันมาสามคืน เกดราฟังจนจบแล้วแก้ให้สองที่ ไม่ใช่สามคืน สองคืน และนางไม่ได้ไปคนเดียว นางจูงล่อไปด้วยตัวหนึ่ง ล่อตัวนั้นตายไปนานแล้ว ไม่มีใครที่มาเยี่ยมเล่าถึงมันสักคน

        ก่อนกลับนางห่อขนมปังที่เหลือให้{name}ครึ่งก้อน บอกว่าพรุ่งนี้มีอีกสามบ้านนัดมาเล่าเรื่องของนาง นางต้องเก็บท้องไว้ฟัง
      effects: { alignment: { moral: 1 }, flags: [ate_the_early_funeral_bread] }
    - id: clay_the_groove
      label: หาดินเหนียวขึ้นไปอุดร่องชื่อนางตอนกลางคืน
      habit: craft_hands
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}นวดดินเหนียวผสมผงหินจนสีเท่าผนัง กดลงร่องทีละตัวอักษร แล้วเกลี่ยด้วยสันมีดจนเรียบ ไม่มีใครเห็นนอกจากนกพิราบสองตัวบนหิ้งเสา ตอนเช้าชื่อนางหายไปจากแถว เหลือแต่รอยหินที่เรียบเกินไปนิดเดียว

          ขนมปังงานศพยังมาถึงบ้านเกดราทุกวันเท่าเดิม คนที่ยกมารู้กันหมดแล้วว่าชื่ออยู่ตรงไหน ไม่ต้องเห็นอีกก็รู้
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [clayed_over_a_name_before] }
      failure:
        text: |
          ดินเหนียวยังกดไม่ครบตัวอักษรที่สอง ยามของตระกูลก็ยกตะเกียงขึ้นมาถึงหิ้ง เขาไม่ด่า ไม่ตะโกน เขาแคะดินออกจากร่องทีละก้อนด้วยปลายเล็บจนหมด แล้วให้{name}จ่ายค่าล้างผนังสองเหรียญตามกฎของเสา

          ขาลงยามคนนั้นเดินตามมาจนถึงประตูล่าง ดูให้แน่ว่า{name}ลงไปจริง
        effects: { gold: -2, alignment: { law: -1 }, flags: [clayed_over_a_name_before] }
    - id: sit_the_chisel_night
      label: ไปนอนเฝ้าห้องเกดราคืนหนึ่ง ฟังว่าเสียงสิ่วมาจากไหน
      requires: { trait: curse_brand }
      text: |
        ห้องของเกดราอยู่ชั้นล่างสุดใต้ผนังเสา {name}ปูเสื่อนอนข้างประตู เกดรานอนไม่หลับ ทุกครู่ถามว่าได้ยินไหม {name}ได้ยินเสียงถ่านในเตาแตก เสียงลมไหลผ่านช่องหิน เสียงนางพลิกตัว เสียงสิ่วไม่มี ใกล้สางนางบอกว่ามันเคาะช้าลงแล้ว เคาะทีละที เหมือนคนกำลังลากหางตัวอักษรตัวสุดท้าย

        พอสว่าง เกดราเล่าให้คนทั้งลานฟังว่ามีคนเฝ้าให้ทั้งคืนแล้วไม่ได้ยินอะไรเลย คนฟังหันมาดู{name}พร้อมกันทุกคน ตั้งแต่วันนั้นไม่มีใครบนลานชวน{name}ไปเฝ้าไข้บ้านไหนอีก
      effects: { stats: { WIS: 1 }, flags: [watched_the_chisel_night_unhearing] }

# ---------- 2 สมุดวัน ----------
- id: adult.sky_notyet_day_book
  stage: adult
  weight: 24
  scene: home
  when:
    age: [16, 130]
    year: [350, 364]
  text: |
    บ้านติดกันตั้งสมุดวันไว้ข้างประตูมาตั้งแต่ต้นปี สมุดปกผ้าเล่มหนา ผูกเชือกกับตะปูที่วงกบ ดินสอห้อยอยู่ปลายเชือกอีกเส้น ใครในบ้านตื่นก่อนต้องเขียนวันที่ลงหน้าใหม่ แล้วเขียนเรื่องของเมื่อวานไว้ข้างใต้ ฝนตกหรือเปล่า ใครแวะมา กินอะไร ตาโคเรนของบ้านนั้นอ่านทุกเช้าก่อนล้างหน้า นิ้วไล่ทีละบรรทัด อ่านจบแล้วถึงยอมเชื่อว่าวันนี้คือวันนี้

    ตาโคเรนทักคนด้วยเรื่องที่ยังไม่เกิดมาตั้งแต่หน้าแล้ง แกถามคนส่งนมว่าแผลที่มือหายหรือยัง อีกสามวันคนส่งนมโดนเศษขวดบาด แกเคยไปยืนรอหน้าบ้านหลังหนึ่งแต่เช้า บอกว่ามางานศพ คนในบ้านนั้นยังนั่งกินข้าวกันครบ เจ้าของบ้านเชิญแกเข้าไปดื่มชา ทุกคนในละแวกรู้ธรรมเนียมกันหมดแล้ว เจอแกเมื่อไร ให้บอกวันที่ก่อนทักเรื่องอื่น

    สัปดาห์นี้ลูกสะใภ้ของบ้านนั้นต้องไปเฝ้าไข้แม่ตัวเองที่ถิ่นอื่น นางวางดินสอลงในมือ{name} บอกว่าตาตื่นตีห้า ขอให้ใครสักคนเขียนก่อนตาตื่น ไม่ต้องสวย ขอให้ถูก
  choices:
    - id: write_it_true
      label: ตื่นก่อนตีห้าทุกวัน เขียนวันที่กับเรื่องเมื่อวานให้ตรงทุกบรรทัด
      text: |
        {name}เขียนเจ็ดเช้า ลายมือเล็กให้พอหน้า เมื่อวานต้มถั่ว เมื่อวานหลังคารั่วมุมครัว เมื่อวานไม่มีใครมา เช้าที่สี่ตาโคเรนอ่านจบแล้วเอานิ้วเคาะบรรทัดสุดท้าย บอกว่าผิด เมื่อวานฝนตกทั้งบ่าย ผ้าในราวเปียกหมด {name}ชี้ให้ดูผ้าบนราวที่แห้งกรอบ แกขอดินสอไปเขียนต่อท้ายเองตัวโย้ไปทางขวา ฝน

        บ่ายวันนั้นฝนตกจริง {name}เก็บผ้าทันก่อนเม็ดแรก ตอนลูกสะใภ้กลับมา นางเปิดสมุดอ่านทั้งเจ็ดหน้า แล้วถามว่าคำว่าฝนในหน้าที่สี่ใครเขียน
      effects: { stats: { WIS: 1 }, flags: [kept_a_neighbours_day_book] }
    - id: ossa_seal
      label: เอาสมุดไปให้นักบวชออสซาประทับตราประตูปิดที่ปก
      text: |
        นักบวชออสซาที่มาประจำงานศพของถิ่นเปิดสมุดดูทีละหน้า อ่านเรื่องเมื่อวานของบ้านคนอื่นอย่างตั้งใจ ไม่ข้ามแม้แต่หน้าที่เขียนไว้แค่ว่ากินถั่ว แล้วกดตราประตูปิดลงบนปกด้วยครั่งสีดำ เขาบอกว่าความทรงจำเป็นของออสซา สมุดที่ถือของของท่านไว้ก็ควรมีตราของท่าน ค่าครั่งเขาไม่เก็บ

        ตาโคเรนลูบตราบนปกทุกเช้าก่อนเปิดอ่าน ลูบจนครั่งขึ้นเงา เดือนต่อมามีอีกสามบ้านในละแวกหอบสมุดไปหานักบวชคนเดียวกัน
      effects: { world: { gods: 1 }, flags: [had_ossa_seal_the_day_book] }
    - id: kinder_yesterday
      label: เขียนให้เมื่อวานดีกว่าที่เป็นสักหน่อย
      text: |
        เมื่อวานในสมุดของ{name}ไม่มีหลังคารั่ว ไม่มีถั่วไหม้ก้นหม้อ มีแต่ลูกชายของตาที่แวะมานั่งคุยจนค่ำ ตาโคเรนอ่านแล้วยิ้มทั้งเช้า ใส่เสื้อตัวดีออกมานั่งหน้าบ้าน

        ตกบ่ายลูกชายแกมาจริง มาเอาเลื่อยที่ฝากไว้ ตาโคเรนจับมือลูกแน่นแล้วบอกว่าเมื่อวานคุยกันสนุกดี ลูกชายแกหันมาทาง{name}ช้าๆ แล้วหันกลับไปหาพ่อ วางเลื่อยลงข้างประตู นั่งคุยต่ออยู่จนค่ำ
      effects: { alignment: { law: -1, moral: 1 }, flags: [wrote_a_kinder_yesterday] }
    - id: rule_and_sell
      label: ตีเส้นสมุดวันเปล่าขายให้บ้านอื่นในละแวก
      text: |
        {name}ซื้อกระดาษหยาบมาหนึ่งปึก พับเย็บเป็นเล่ม ตีเส้นด้วยไม้บรรทัดกับถ่าน หัวกระดาษเว้นช่องวันที่ไว้ทุกหน้า ขายได้สี่เล่มในสัปดาห์เดียว

        เล่มที่ห้า{name}ขยันเขียนวันที่ล่วงหน้าไว้ให้ครบเดือน หญิงที่ซื้อไปเอามาคืนในวันต่อมา นางบอกว่าคนป่วยที่บ้านอ่านวันที่ทั้งเดือนในคืนเดียว ตื่นมาทวงเงินที่คนยืมไปบอกว่าจะคืนสิ้นเดือน
      effects: { gold: 2, flags: [sold_ruled_day_books] }

# ---------- 3 ของที่ยื่นให้ ----------
- id: adult.sky_notyet_cup_before
  stage: adult
  weight: 24
  scene: tavern
  when:
    age: [16, 130]
    year: [348, 366]
    not_traits: [curse_brand, curse_not_yet]
  text: |
    {name}ได้ยินเสียงถ้วยแตกข้างหลัง หันไปดู ถ้วยบนโต๊ะยังดีอยู่ทุกใบ ครึ่งลมหายใจต่อมาแมวของโรงเตี๊ยมกระโดดขึ้นโต๊ะ ปัดถ้วยใบริมสุดตกแตก เสียงแตกเหมือนที่ได้ยินไปแล้วทุกเสียง ทั้งร้านไม่มีใครเงยหน้า นอกจากหญิงขายด้ายที่นั่งโต๊ะติดหน้าต่าง

    นางมาถึงเมื่อวานตอนพลบ รองเท้าเปื้อนฝุ่นทางทั้งคู่ กินข้าวเย็นเสร็จก็สั่งเจ้าของร้านว่าพรุ่งนี้ให้ปลุกตีสี่ นางจะออกเดินทาง ไปทางที่เพิ่งมา เจ้าของร้านเล่าให้{name}ฟังเสียงเบา ว่าแขกแบบนี้ปีนี้มาพักสามคนแล้ว มาถึงก่อนแล้วค่อยไป จ่ายเงินครบทุกคน

    หญิงขายด้ายยกถ้วยของตัวเองมานั่งตรงข้าม{name} นางบอกว่าคนส่วนมากได้ยินเสียงแบบนี้แล้วสะดุ้งหันหนี หันสองสามทีเสียงก็เลิกมาเอง ถ้าไม่หัน ฟังต่อไปเรื่อยๆ จะได้ยินไกลขึ้นทีละนิด นางว่าตอนแรกก็แค่ถ้วย
  choices:
    - id: listen_on
      label: ไม่หัน ฟังเสียงที่มาก่อนต่อไป (ของแบบนี้ติดตัวไปนาน)
      text: |
        เสียงต่อไปมาตอนเจ้าของร้านยกกาน้ำร้อนผ่านโต๊ะ เสียงกาตกกระแทกพื้นดังชัดอยู่ในหู {name}ไม่หัน ยื่นมือออกไปเฉยๆ หูกาหลุดจากนิ้วเจ้าของร้านมาลงในมือ{name}พอดี น้ำร้อนไม่หกสักหยด หญิงขายด้ายดื่มชาจนหมดถ้วยแล้วขึ้นไปนอน ตีสี่นางออกเดินทาง

        เดือนนั้น{name}รับของได้ก่อนตกทุกอย่าง ไข่ ช้อน เด็กข้างบ้านที่สะดุดขั้นบันได ต้นเดือนถัดมา{name}ไปจับมือคนอบขนมปัง บอกว่าเสียใจด้วยเรื่องแม่ เขาขอบคุณแล้วห่อขนมปังให้ก้อนหนึ่งโดยไม่ถามอะไร แม่ของเขากำลังรดน้ำผักอยู่หลังร้าน เช้าต่อมา{name}ตื่นขึ้นพร้อมเข่าที่ปวดแบบปวดหลังหน้าหนาวผ่านไปหนึ่งหน้า แดดหน้าร้อนส่องเข้าหน้าต่างเต็มเตียง
      effects: { traits: [curse_not_yet], marks: { star: 1 }, world: { star: 1 }, flags: [listened_on_to_the_cup_before] }
    - id: turn_away
      label: สะดุ้งหันหนีเหมือนคนอื่น แล้วไปช่วยเก็บเศษถ้วย
      text: |
        {name}นั่งยองเก็บเศษถ้วยใส่ผ้ากันเปื้อนของเจ้าของร้านทีละชิ้น เศษชิ้นเล็กบาดปลายนิ้วเป็นเส้น เลือดซึมออกมาหยดเดียว ระหว่างนั้นเสียงถ้วยแตกดังอีกครั้งทางหลังร้าน {name}ก้มหน้าเก็บต่อ หลังร้านไม่มีอะไรแตก

        ตีสี่หญิงขายด้ายออกเดินทาง เจ้าของร้านเล่าทีหลังว่านางทิ้งด้ายไว้ให้{name}หนึ่งม้วน ฝากบอกว่าเผื่อเปลี่ยนใจ ด้ายสีเทาเหมือนฝุ่นทาง ไม่มีใครในร้านอยากได้
      effects: { hp: -1, flags: [turned_away_from_the_cup_before] }
    - id: ask_her_road
      label: ถามหญิงขายด้ายว่าทางที่นางเพิ่งมา พรุ่งนี้มีอะไรรออยู่
      habit: curious
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          นางหัวเราะ บอกว่าถามแบบนี้ดีกว่าถามว่านางเป็นใคร ทางที่นางมามีสะพานไม้สองสะพาน สะพานที่สองไม้แผ่นที่เจ็ดผุ นางเหยียบพังไปแล้วเมื่อวาน พรุ่งนี้นางจะเหยียบมันอีก แล้วมันจะพังอีก นางไม่แน่ใจว่าครั้งไหนมาก่อน

          ปลายเดือนมีคนเดินทางเล่าที่โรงเตี๊ยมว่าสะพานไม้บนทางนั้นไม้แผ่นที่เจ็ดหลุด หญิงขายด้ายคนหนึ่งตกน้ำแล้วปีนขึ้นมาได้เอง ย่ามไม่หาย ด้ายเปียกทั้งย่าม
        effects: { stats: { CHA: 1 }, flags: [asked_the_thread_seller_her_road] }
      failure:
        text: |
          นางยิ้ม แล้วถามกลับว่าพรุ่งนี้{name}จะตื่นตอนไหน {name}ตอบไม่ได้ นางบอกว่าเห็นไหม แล้วยกถ้วยกลับไปนั่งโต๊ะเดิม ไม่หันมาอีกจนเจ้าของร้านดับตะเกียง

          ตีสี่มีเสียงประตูโรงเตี๊ยมเปิดแล้วปิด ดังสองครั้ง ห่างกันครึ่งลมหายใจ ตอนเช้าเจ้าของร้านบอกว่าแขกห้องริมออกไปคนเดียว
        effects: { flags: [asked_the_thread_seller_her_road] }

# ---------- 4 อุบัติเหตุ (วัยทำงาน) ----------
- id: adult.sky_notyet_rope_before
  stage: adult
  weight: 20
  scene: workshop
  when:
    age: [16, 59]
    year: [348, 366]
    not_traits: [curse_brand, curse_not_yet]
  text: |
    โรงเก็บของหลังนั้นจ้างคนชักรอกวันละหกคน กระสอบข้าวโพดขึ้นชั้นบนวันละสองร้อยกระสอบ {name}ยืนเชือกเส้นท้าย คนข้างล่างคล้องปากกระสอบกับขอแล้วถอยไปยืนแค่ขอบเงา ไม่มีใครยืนใต้รอกนาน นายโรงตะโกนนับทุกกระสอบให้ตัวเลขตรงกับสมุด

    กระสอบที่สามสิบกว่าขึ้นไปได้ครึ่งทาง {name}ได้ยินเสียงเชือกขาด เส้นใยแตกทีละเส้นจนดังพัวะ แล้วกระสอบกระแทกพื้นไม้ข้างล่าง ชัดเหมือนเกิดตรงหน้า เชือกในมือยังตึงดี กระสอบยังลอยขึ้นช้าๆ เด็กชายคนหนึ่งเดินเข้ามาใต้รอกเพื่อเก็บเมล็ดที่หก

    ไม่มีใครในโรงหันมา คนชักรอกข้างๆ ยังฮัมเพลงไปตามจังหวะดึง
  choices:
    - id: shout_and_grab
      label: ตะโกนให้เด็กหลบ แล้วปล่อยเชือกกระโดดลงไปกระชากตัวออก
      habit: hot_headed
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}กระโดดลงจากแท่นชัก ฉวยคอเสื้อเด็กกระชากถอยไปสองก้าว ครึ่งลมหายใจต่อมาเชือกขาดตรงที่เสียงบอกไว้ เส้นใยแตกทีละเส้นจนพัวะ กระสอบกระแทกพื้นไม้ ข้าวโพดกระจายเต็มลาน เด็กร้องไห้เพราะตกใจ ไม่ได้เจ็บตรงไหน

          นายโรงเดินมาดูปลายเชือกที่ขาดรุ่ย หันมาถามว่า{name}รู้ได้อย่างไร {name}บอกว่าได้ยิน คนชักรอกที่เหลือได้ยินแค่ตอนที่มันขาด
        effects: { stats: { DEX: 1 }, flags: [pulled_a_boy_from_under_the_hoist] }
      failure:
        text: |
          {name}ตะโกนก่อนกระโดด เด็กหันมาหาเสียงแล้วยืนนิ่ง {name}คว้าตัวเด็กได้แต่เท้าลื่นเมล็ดข้าวโพด ล้มลงทั้งคู่ใต้รอก แล้วนอนรอ เสียงเชือกขาดดังซ้ำในหูอีกครั้ง อีกครั้ง ชัดขึ้นทุกครั้ง {name}นอนฟังจนรู้ว่าเส้นใยเส้นไหนแตกก่อน เชือกขาดจริงตอนคนอื่นกำลังดึงสองคนขึ้นจากพื้น กระสอบลงห่างไปหนึ่งช่วงแขน

          ตั้งแต่วันนั้น ของอะไรจะตก {name}ได้ยินก่อนครึ่งลมหายใจ และไม่เคยหันหนีเสียงพวกนั้นทันสักครั้ง
        effects: { traits: [curse_not_yet], flags: [lay_listening_under_the_hoist] }
    - id: hold_the_rope
      label: พันเชือกรอบเสาค้ำ แล้วยึดกระสอบไว้ด้วยแรงตัวเอง
      check: { stat: STR, dc: 13 }
      success:
        text: |
          {name}กระชากเชือกพันเสาค้ำสองรอบแล้วทิ้งน้ำหนักทั้งตัวลงไป กระสอบหยุดกลางอากาศ เชือกช่วงเหนือรอกขาดดังพัวะ ปลายเชือกฟาดหลังคา กระสอบห้อยค้างอยู่ด้วยช่วงที่{name}ยึดไว้ คนข้างล่างวิ่งเข้ามาช่วยหย่อนลงทีละศอก เด็กชายยืนดูอยู่ข้างประตู ไม่รู้ว่าเกิดอะไรขึ้น

          ฝ่ามือ{name}แดงเป็นรอยเชือกไปจนค่ำ นายโรงจ่ายค่าแรงวันนั้นเพิ่มให้หนึ่งเหรียญ แล้วสั่งเปลี่ยนเชือกทุกเส้นในโรง
        effects: { stats: { STR: 1 }, gold: 1, flags: [held_the_hoist_rope] }
      failure:
        text: |
          เชือกครูดผ่านฝ่ามือเร็วกว่าที่มือจะกำทัน หนังลอกเป็นแถบ กระสอบลงกระแทกพื้นห่างจากเด็กไปสองก้าว ข้าวโพดกระเด็นใส่หน้าแข้งเด็กจนแดง เด็กวิ่งร้องไห้ออกไปหาแม่

          {name}พันมือด้วยผ้าชุบน้ำมันหมูอยู่หลายวัน ค่าแรงวันนั้นนายโรงหักค่ากระสอบขาดไปครึ่งหนึ่ง
        effects: { hp: -1, gold: -1, flags: [held_the_hoist_rope] }
    - id: stop_the_hoist
      label: สั่งหยุดรอกทั้งโรง แล้วไม่ยอมดึงต่อจนกว่าจะเปลี่ยนเชือก
      habit: stubborn
      text: |
        {name}หย่อนกระสอบกลับลงพื้นแล้วตะโกนให้ทุกคนหยุด นายโรงเดินมาหน้าแดง ตรวจเชือกตั้งแต่ปลายถึงรอก ไม่เจออะไร เชือกดีทุกศอก เขาหักค่าแรงวันนั้นของ{name}ทั้งวัน แล้วเปลี่ยนคนยืนเชือกเส้นท้าย

        คนที่มาแทนใช้เชือกเส้นเดิมชักรอกต่ออีกครึ่งเดือน จนเช้าหนึ่งมีคนเห็นว่าใยกลางเส้นแตกเป็นพู่ ไม่มีกระสอบตกสักใบ
      effects: { gold: -2, flags: [stopped_the_hoist_for_a_sound] }

# ---------- 5 ลึกขึ้น: ข้อตกลงที่สอง ----------
- id: adult.sky_notyet_lost_boy
  stage: adult
  weight: 80
  when:
    age: [16, 130]
    year: [350, 376]
    trait: curse_not_yet
    not_traits: [curse_brand]
  text: |
    ลูกชายคนเล็กของบ้านช่างสานตะกร้าหายไปตั้งแต่ก่อนพลบ คนทั้งละแวกถือตะเกียงออกเรียกตามคันนา ตามคูน้ำ ตามกองฟืนหลังบ้านทุกหลัง เสียงเรียกชื่อเด็กดังซ้อนกันจนฟังไม่ออกว่าใครเรียก แม่ของเด็กไม่ออกไปไหน นั่งอยู่ที่ธรณีประตู เผื่อลูกกลับมาแล้วไม่เจอใคร

    {name}นั่งอยู่กับนาง เสียงที่มาก่อนตัวแวะมาให้ได้ยินอยู่ตลอด ฝาหม้อในครัวบ้านตรงข้ามจะหล่น กิ่งไม้หลังรั้วจะหัก เสียงพวกนี้เคยมาก่อนแค่ครึ่งลมหายใจ ช่วงหลังมาก่อนนานขึ้น บางเสียงมาก่อนเป็นวัน

    {name}รู้ว่าถ้านั่งนิ่งแล้วตั้งใจฟังไปข้างหน้าให้ไกลกว่านั้น จะได้ยินไปถึงตอนที่เด็กกลับบ้าน เสียงแม่เขาหัวเราะ เสียงฝาไม้ที่เปิดออกที่ไหนสักแห่ง และ{name}ก็รู้ด้วยว่าทุกครั้งที่ฟังไกล ร่างกายต้องจ่ายเป็นหน้าหนาวที่ยังมาไม่ถึง
  choices:
    - id: listen_far
      label: หลับตา ฟังไปข้างหน้าจนถึงตอนที่เด็กกลับบ้าน (ของแบบนี้ติดตัวไปนาน)
      text: |
        {name}ฟังผ่านเสียงเรียกชื่อ ผ่านเสียงหมาเห่า ผ่านเสียงไก่ขันของเช้าวันที่ยังไม่มา จนได้ยินเสียงฝาไม้หนักครูดกับขอบหิน แล้วเสียงเด็กไอ ไอแบบคนสำลักฝุ่นแป้ง {name}ลืมตา บอกแม่เด็กให้ไปเปิดฝาบ่อแห้งหลังโรงสีเก่า คนสามคนวิ่งไปพร้อมตะเกียง เด็กนั่งอยู่ก้นบ่อ ข้อเท้าแพลง ตัวขาวโพลนเพราะฝุ่นแป้งที่ค้างก้นบ่อมาหลายปี

        เช้าต่อมา{name}ลุกจากเตียงด้วยเข่าที่จำหน้าหนาวได้หนึ่งหน้า ผมหลุดติดหวีมากกว่าทุกวัน แม่ของเด็กหิ้วไข่มาให้ตะกร้าหนึ่ง นางยื่นให้ด้วยสองมือ แล้วถอยออกไปเร็วกว่าที่เคย
      effects: { marks: { star: 1 }, world: { star: 1 }, flags: [listened_far_for_the_lost_boy] }
    - id: search_by_lamp
      label: ถือตะเกียงออกค้นตามซอกที่คนอื่นยังไม่ได้ไป
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ไม่ไปทางคันนาที่คนส่วนมากไป เดินเลาะหลังโรงสีเก่า ที่ที่เด็กในละแวกโดนห้ามเข้าและเข้ากันทุกคน ฝาบ่อแห้งหลังโรงสีเลื่อนเปิดค้างไว้ครึ่งเดียว ข้างในมีเสียงไอ {name}ส่องตะเกียงลงไป เด็กนั่งอยู่ก้นบ่อ ข้อเท้าแพลง ตัวขาวเพราะฝุ่นแป้ง

          ขากลับเด็กเกาะแขน{name}เดินกะเผลกมาจนถึงบ้าน ถามว่าทำไมรู้ว่าอยู่ตรงนั้น {name}บอกว่าเด็กทุกคนชอบที่ที่โดนห้าม เด็กหัวเราะทั้งน้ำตา
        effects: { stats: { WIS: 1 }, flags: [found_the_lost_boy_by_lamp] }
      failure:
        text: |
          {name}เดินค้นจนตะเกียงหมดน้ำมัน ข้อเท้าพลิกบนคันนาเปียก ต้องนั่งพักอยู่ข้างทาง ใกล้สางมีเสียงเรียกต่อกันมาว่าเจอแล้ว เด็กอยู่ในบ่อแห้งหลังโรงสีเก่า ข้อเท้าแพลงข้างเดียวกับ{name}

          ตอนตะวันขึ้นทั้งสองเดินกะเผลกเข้าบ้านคนละหลัง แม่ของเด็กยกน้ำต้มขิงมาให้{name}ถ้วยหนึ่ง
        effects: { hp: -1, flags: [searched_for_the_lost_boy] }
    - id: stop_the_ears
      label: อุดหูด้วยขี้ผึ้ง นั่งเฝ้าธรณีกับแม่เด็ก ไม่ฟังอะไรไปข้างหน้า
      text: |
        ขี้ผึ้งเทียนอุ่นๆ อุดหูได้ไม่มิด เสียงที่มาก่อนยังลอดเข้ามาเป็นเสียงอู้อี้ {name}กุมมือแม่เด็กไว้จนเช้า ไม่ตั้งใจฟังอะไรให้ชัด ตอนเที่ยงคนเลี้ยงแพะได้ยินเสียงไอจากบ่อแห้งหลังโรงสีเก่า เด็กตัวเย็นเฉียบ ไข้ขึ้นอีกสามวัน

        ค่าหมอ{name}ออกให้ครึ่งหนึ่ง แม่ของเด็กไม่ได้ขอ {name}ยื่นให้เอง
      effects: { gold: -2, flags: [stopped_ears_while_the_boy_was_lost] }

# ---------- 6 ราคาที่จ่ายไปแล้วมาถึง ----------
- id: adult.sky_notyet_wept_already
  stage: adult
  weight: 80
  scene: home
  when:
    age: [16, 130]
    year: [352, 378]
    trait: curse_not_yet
  text: |
    ต้นหน้าฝน{name}ไปบ้านบาเดนช่างซ่อมรองเท้า นั่งลงข้างเตียงของเขาแล้วร้องไห้จนผ้าเช็ดหน้าเปียกสองผืน บาเดนนั่งอยู่ที่โต๊ะริมหน้าต่าง กำลังเย็บรองเท้าให้ลูกค้า เขาวางเข็ม ชงชาให้ แล้วนั่งฟัง{name}เล่าเรื่องงานศพของเขาจนจบ เมียเขาเอาผ้าห่มมาคลุมไหล่{name} ไม่มีใครในบ้านนั้นพูดคำว่าบ้าแม้แต่คำเดียว

    เมื่อคืนบาเดนตายจริง หลับไปตอนพลบแล้วไม่ตื่น งานศพเป็นพรุ่งนี้

    {name}รู้หมดแล้วว่างานจะเป็นอย่างไร ฝนจะตกตอนยกโลง ฝาโลงจะติดที่มุมซ้าย คนเป่าขลุ่ยจะมาช้า เมียบาเดนจะยืนข้างโลงในผ้าคลุมสีเทาที่ยืมเขามา น้ำตาของ{name}ใช้ไปหมดแล้วตั้งแต่ต้นหน้าฝน ข้างในว่างเหมือนตุ่มที่เพิ่งล้าง
  choices:
    - id: stand_dry
      label: ไปยืนแถวหน้าของงาน น้ำตาไม่มาก็ไม่ต้องมา
      text: |
        ฝนตกตอนยกโลง ฝาโลงติดที่มุมซ้าย คนเป่าขลุ่ยมาถึงตอนทุกคนกลับเข้าชายคากันหมดแล้ว {name}ยืนแถวหน้าตาแห้ง ได้ยินเสียงกระซิบข้างหลังเป็นพักๆ เมียบาเดนเดินมาจับมือ{name}ไว้ครู่หนึ่ง บอกว่า{name}ร้องให้เขาไปแล้วตอนที่เขายังนั่งฟังได้ เขาชอบใจที่ได้รู้ว่าตัวเองมีคนรักขนาดนั้น

        เย็นนั้นนางเอารองเท้าคู่สุดท้ายที่บาเดนเย็บค้างไว้มาให้ เหลือแค่ตอกส้นอีกข้างเดียว
      effects: { alignment: { moral: 1 }, flags: [stood_dry_eyed_at_a_known_funeral] }
    - id: warn_the_widow
      label: ไปบอกเมียบาเดนให้ไสขอบฝาโลงมุมซ้ายไว้ก่อน
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          {name}บอกแค่เรื่องฝาโลงกับเรื่องคนเป่าขลุ่ย เรื่องฝนไม่บอก นางไม่ถามว่ารู้ได้อย่างไร ส่งลูกชายไปไสขอบฝาตั้งแต่หัวค่ำ แล้วส่งคนไปตามคนเป่าขลุ่ยถึงบ้าน วันงานฝาโลงปิดสนิทในครั้งเดียว เพลงขึ้นตรงเวลา ฝนตกตอนยกโลงตามเดิม

          หลังงาน คนในละแวกเลิกบอกวันที่ให้{name}ก่อนทัก หันมาถามว่าพรุ่งนี้ฝนจะตกไหมแทน
        effects: { stats: { WIS: 1 }, flags: [eased_a_funeral_already_seen] }
      failure:
        text: |
          {name}บอกเรื่องฝาโลงด้วยเสียงมั่นใจ ลูกชายบาเดนไสขอบฝามุมซ้ายจนบางเฉียบ วันงานฝาโลงไม่ติดที่มุมไหนเลย ปิดหลวมจนต้องหาเชือกมามัด ฟ้าโปร่งทั้งวัน คนเป่าขลุ่ยมาก่อนเวลา เมียบาเดนถาม{name}ช้าๆ ว่างานที่{name}เห็นมานั้นเป็นงานของใคร

          {name}ตอบไม่ได้ งานที่จำได้มีฝาโลงติด มีฝน มีผ้าคลุมสีเทา ทุกอย่างตรงกับบ้านนี้มาจนถึงเมื่อวาน
        effects: { gold: -1, flags: [remembered_someone_elses_funeral] }
    - id: send_bread
      label: อยู่บ้าน ฝากขนมปังกับเทียนไปแทนตัว
      text: |
        {name}ฝากขนมปังสองก้อนกับเทียนสี่เล่มไปกับเด็กข้างบ้าน แล้วนั่งอยู่ในครัว เสียงงานศพมาถึงก่อนงานเริ่มครึ่งเช้า เสียงฝาโลงครูดไม้ เสียงขลุ่ยที่เป่าช้ากว่าจังหวะ พอถึงเวลาจริง เสียงเดียวกันมาอีกรอบจากปลายซอย ช้ากว่าที่ได้ยินในครัวแค่นิดเดียว

        เดือนต่อมาเมียบาเดนแวะมาคืนตะกร้าขนมปัง นางนั่งได้ไม่นาน ไม่ได้ถามว่าทำไม{name}ไม่ไป ก่อนกลับนางบอกว่าวันงานฝนตกพอดีตอนยกโลง
      effects: { gold: -1, flags: [sent_bread_to_a_known_funeral] }

# ---------- 7 อยู่กับมัน (วัยปลาย เกิดซ้ำได้) ----------
- id: elder.sky_notyet_slate_by_the_bed
  stage: elder
  weight: 60
  once: false
  scene: home
  cast:
    kid: { kin: [child], min_age: 17, optional: true }
  when:
    age: [60, 130]
    year: [350, 410]
    trait: curse_not_yet
  text: |
    กระดานชนวนแผ่นเท่าสองฝ่ามือแขวนอยู่ที่หัวเตียงของ{name} เด็กหญิงบ้านถัดไปมาเขียนวันที่ให้ทุกเช้าก่อนไปตักน้ำ เขียนตัวโต วงไว้หนึ่งวง ค่าจ้างไข่สัปดาห์ละฟอง เด็กคนนี้เขียนเลขเจ็ดหางตวัดแบบคนแก่ ได้ลายมือมาจากยายของตัวเอง

    เช้านี้{name}ตื่นมาด้วยความแน่ใจเต็มอก วันนี้วันตลาด ต้องไปซื้อเกลือ เข่ารู้ ท้องรู้ หมาข้างบ้านยังเห่าแบบวันตลาด แต่กระดานบอกอีกวัน ตลาดยังอีกสองวัน
  choices:
    - id: believe_the_slate
      label: เชื่อกระดาน ทำงานของวันนี้ไปตามที่กระดานบอก
      text: |
        {name}ต้มน้ำ ซักผ้าสองผืน นั่งตากแดดหน้าบ้านตอนสาย ทั้งวันเหมือนลืมของไว้ที่ไหนสักแห่ง ตกเย็นเด็กหญิงแวะมาถามว่าวันนี้กินข้าวหรือยัง {name}บอกว่ากินแล้ว แล้วนึกขึ้นได้ว่ากินจริง

        คืนนั้น{name}หลับยาวไปจนถึงเสียงไก่ตัวที่สอง
      effects: { hp: 1, flags: [trusted_the_slate] }
    - id: go_to_market
      label: หยิบตะกร้าไปตลาด เผื่อกระดานเขียนผิด
      text: |
        ลานตลาดว่าง มีแต่คนกวาดใบไม้กับแผงผักแผงเดียวที่ขายทุกวัน {name}ซื้อหัวไชเท้าที่ไม่ได้อยากกินมาสองหัว ไม่อยากเดินกลับมือเปล่า ระหว่างทางกลับเข่าเริ่มบ่น

        สองวันต่อมาตลาดเปิดจริง {name}จำได้แม่นว่าซื้อเกลือไปแล้ว ไปถึงแผงเกลือ คนขายบอกว่าไม่เห็นหน้า{name}มาเกือบเดือน
      effects: { gold: -1, hp: -1, flags: [went_to_market_on_the_wrong_day] }
    - id: kid_writes_the_slate
      label: ให้{kid}เขียนกระดานเองทุกครั้งที่มาเยี่ยม
      requires: { cast: [kid] }
      text: |
        {kid}เขียนวันที่ตัวใหญ่กว่าเด็กข้างบ้าน ใต้วันที่เขียนอีกบรรทัดว่าวันนี้มาเยี่ยม แล้วจะมาอีกเมื่อไร {name}อ่านบรรทัดล่างทุกเช้า ไม่ยอมให้ใครลบ วันที่ข้างบนเปลี่ยนไปหลายรอบแล้วก็ตาม

        เด็กข้างบ้านเขียนวันที่ใหม่เบียดไว้ที่มุมบน ระวังไม่ให้ชอล์กโดนบรรทัดของ{kid}
      effects: { people: [{ id: "@kid", closeness: 1 }], flags: [kid_wrote_on_the_slate] }

# ---------- 8 ทางออก ----------
- id: adult.sky_notyet_salt_jar
  stage: adult
  weight: 150
  once: false
  scene: home
  when:
    age: [16, 130]
    year: [352, 410]
    trait: curse_not_yet
    not_flags: [kept_hearing_before]
  text: |
    ไหเกลือเคลือบน้ำตาลใบนั้นอยู่กับ{name}มาตั้งแต่บ้านแรก ปากบิ่นนิดหนึ่ง ฝาไม้ทำใหม่ไปแล้วสามฝา เป็นของใบเดียวในบ้านที่ไม่เคยแตก เช้านี้{name}ได้ยินมันแตก เสียงดินเผาแยกเป็นสามชิ้นบนพื้นหิน เสียงเกลือกระจายเหมือนฝนเม็ดเล็ก ไหยังตั้งอยู่บนหิ้ง ห่างขอบไม่ถึงนิ้ว

    ยายบ้านปากซอยเคยเป็นแบบ{name}มาก่อน วันนี้ยายตื่นมาไม่ต้องถามวันที่ใครแล้ว ยายบอกไว้ว่ามีสองทาง ทางแรก ปล่อยให้ของชิ้นหนึ่งตกแตกต่อหน้าทั้งที่ได้ยินก่อน แล้วไม่ฟังเสียงแบบนั้นอีกเลย ยายเลือกทางนี้ ของของยายคือกระจกบานเดียวในบ้าน ทางที่สอง จดทุกวันลงสมุด อ่านย้อนทุกเช้าให้ครบปี ยายว่าทางที่สองยาวกว่า แต่ไม่มีอะไรต้องแตก

    เสียงไหแตกดังอีกรอบ ชัดกว่าเดิม มือ{name}ยกขึ้นไปเองได้ครึ่งทางแล้ว
  choices:
    - id: let_it_fall
      label: เอามือลง ปล่อยให้ไหตก
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}เอามือไพล่หลัง ประตูหลังบ้านปิดตามลมดังปัง ไหเลื่อนพ้นขอบหิ้ง ตกลงพื้นหิน แตกเป็นสามชิ้นตรงตามเสียง เกลือกระจายเต็มพื้นครัว {name}กวาดเกลือรวมเป็นกองด้วยมือ ไม่ได้ตักกลับใส่อะไร

          หลายสัปดาห์ต่อมาเสียงที่มาก่อนตัวยังแวะมาบ้าง {name}ปล่อยให้ผ่านไปเหมือนเสียงคนคุยกันในบ้านอื่น ปลายปีเสียงพวกนั้นมาช้าลง จนมาพร้อมกับของ แล้วก็ไม่มาก่อนอีก เศษไหชิ้นที่ใหญ่ที่สุด{name}ใช้รองก้นตะเกียง
        effects: { lose_traits: [curse_not_yet], marks: { star: -1 }, flags: [let_the_salt_jar_fall] }
      failure:
        text: |
          {name}ไพล่มือไว้ได้จนไหเลื่อนพ้นขอบหิ้ง แล้วมือก็ออกไปรับเอง ไวกว่าความคิด ไหลงมาอยู่ในอุ้งมือพอดี เกลือไม่หกสักเม็ด ปากไหบิ่นเพิ่มอีกนิดตรงที่กระแทกเล็บ

          {name}วางไหกลับขึ้นหิ้ง เลื่อนเข้าไปชิดผนังกว่าเดิม คืนนั้นได้ยินมันแตกอีกสองครั้ง
        effects: { flags: [caught_the_salt_jar_again] }
    - id: keep_the_day_book
      label: ซื้อสมุดมาตั้งข้างประตู เขียนทุกค่ำ อ่านย้อนทุกเช้าจนครบปี
      check: { stat: CON, dc: 13 }
      success:
        text: |
          สมุดเล่มแรกหมดก่อนหน้าฝน {name}ซื้อเล่มที่สอง เขียนทุกค่ำ ฝนตกตอนไหน ใครยืมจอบ หน้าหนาวมือสั่นก็เขียนตัวโย้ไป ทุกเช้าอ่านย้อนตั้งแต่หน้าแรก อ่านนานขึ้นทุกวัน จนบางเช้าหมดไปครึ่งเช้า

          พอครบปี{name}เปิดหน้าแรกอีกครั้ง เรื่องในหน้านั้นเป็นของเมื่อต้นปีจริงๆ ไม่ปนกับอะไร เสียงของตกมาพร้อมกับของตก ช้าไปนิดเหมือนที่คนอื่นได้ยิน
        effects: { gold: -2, lose_traits: [curse_not_yet], marks: { star: -1 }, flags: [kept_a_day_book_a_full_year] }
      failure:
        text: |
          {name}เขียนได้สี่เดือนเต็ม แล้วไข้หน้าหนาวมาเอาไปสิบวัน ตื่นมาสมุดเว้นว่างสิบหน้า {name}นั่งเขียนย้อนให้ครบ เรื่องที่ลงไปในสิบหน้านั้นครึ่งหนึ่งยังไม่เกิด

          สมุดเล่มนั้น{name}ยังเขียนต่อ แต่เลิกอ่านย้อนจากหน้าแรกแล้ว
        effects: { gold: -2, hp: -1, flags: [lost_days_from_the_day_book] }
    - id: keep_hearing
      label: ย้ายไหลงไปไว้หลังเตา แล้วฟังต่อไป
      text: |
        {name}ย้ายไหเกลือลงไปวางบนพื้นหลังเตา ที่ที่ไม่มีอะไรให้ตก แล้วใช้ชีวิตต่อไปกับเสียงที่มาก่อน รับไข่ได้ก่อนไข่หล่น ทักคนผิดวันบ้าง คนในละแวกบอกวันที่ให้ก่อนทักเรื่องอื่นจนชินปาก

        เสียงไหแตกไม่มาอีก มาแต่เสียงอื่นที่{name}ยังไม่รู้ว่าเป็นของอะไร
      effects: { flags: [kept_hearing_before] }
