# วัยรุ่น 12–13 ลูกเอลฟ์บ้านกิ่งลม ป่าไอเลธ (origin_elf_bough)
# ก่อนอายุ 18 เอลฟ์โตเท่ามนุษย์ (Q1) ทางประจำถิ่นคือพราน เปิดเสมอในพิธีคืนช่องนับดาว
# เหตุการณ์ในไฟล์นี้จึงไม่ให้ lean_ranger

- id: youth.elf_orival_raid
  stage: youth
  weight: 10
  when:
    age: [12, 13]
    flags: [origin_elf_bough]
    not_flags: [told_on_orival]
  text: |
    ปีนี้ทูตจากราชสำนักมาพร้อมทหารสิบสองนาย ไม่ใช่สองนายเหมือนทุกปี ทุกนายถือปืนดินดำยาวกว่าแขนคน ทหารไม่ได้ขึ้นบันไดเชือก ตั้งค่ายอยู่ข้างค่ายตัดไม้ที่ขยับเข้ามาใกล้บ้านกิ่งลมอีกสองเนิน กลางคืนเห็นไฟของพวกเขาจากกิ่งบนสุด

    โอรีวัลกลับมาหมู่บ้านตอนพลบค่ำ ผมยาวลงมาถึงกลางหลัง ถักรวบไว้ด้วยเชือกป่าน ผู้ใหญ่ที่เคยเบือนหน้าตอนเขาเดินผ่าน ปีนี้ไม่เบือนแล้ว บางคนแอบยื่นน้ำเต้าใส่น้ำมันสนให้เขา

    เขามาหา{name}ที่กิ่งนอกบ้าน นั่งลงข้างๆ ห้อยขาลงไปในความมืด

    "ทหารพวกนั้นเฝ้ายามสองคนต่อกะ" เขาว่า "ข้าต้องการคนหนึ่งคนนั่งบนต้นสนต้นที่สามจากลำธาร คอยผิวปากถ้ามีใครเดินออกจากเต็นท์"
  choices:
    - id: lookout
      label: ขึ้นไปนั่งบนต้นสนต้นที่สามตามที่เขาขอ
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}เห็นทหารคนหนึ่งเดินออกจากเต็นท์ไปปัสสาวะตอนตีสอง ผิวปากสองจังหวะตามที่ตกลงกัน เงาของโอรีวัลหยุดนิ่งอยู่ในหมู่ตอไม้จนทหารคนนั้นกลับเข้าเต็นท์

          ไฟลุกขึ้นกลางกองซุงตอนตีสาม เสียงปืนดังตามมาหกนัด ยิงเข้าไปในความมืดตรงไหนก็ไม่รู้ โอรีวัลกลับถึงกิ่งก่อน{name}ครึ่งชั่วยาม นั่งรออยู่ที่บันไดเชือก ผมไหม้ไปหนึ่งปอย เขาไม่ได้ชม แค่ยื่นมีดใบดำเล่มเล็กให้เล่มหนึ่ง
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, reputation: { crown: -1 }, flags: [lean_rogue, orival_lookout] }
      failure:
        text: |
          {name}ผิวปากช้าไปหนึ่งอึดใจ ทหารคนนั้นเห็นเงาในหมู่ตอไม้ก่อน แล้วยิง

          ไฟลุกขึ้นกลางกองซุงอยู่ดี แต่ตอนโอรีวัลกลับมาถึงต้นสนต้นที่สาม เขาเอามือกดไหล่ซ้ายไว้ เลือดไหลลอดนิ้ว {name}พยุงเขาปีนกลับขึ้นบ้านกิ่งลมทั้งคืน ผู้เฒ่าเย็บแผลให้จนรุ่ง ระหว่างเย็บแกพูดถึงแต่เรื่องอากาศ
        effects: { stats: { WIS: 1 }, alignment: { law: -1 }, flags: [lean_rogue, orival_wounded] }
    - id: block_way
      label: ไปยืนขวางบันไดเชือก ไม่ให้เขาลงไป
      check: { stat: STR, dc: 13 }
      success:
        text: |
          {name}เอาเชือกบันไดทั้งสองเส้นพันรอบเอวตัวเองสองรอบ ผูกปมไว้ข้างหลัง แล้วยืนอยู่หัวบันได โอรีวัลเดินมาถึง หยุดอยู่ตรงหน้า สูงกว่าหนึ่งหัวครึ่ง

          เขาจับไหล่{name}จะยกออก ยกได้ก็ต้องยกบันไดขึ้นมาทั้งบันได เขาก้มลงแกะปม {name}บิดตัวหนี บันไดเชือกฟาดกิ่งดังไปทั้งต้น ประตูบ้านรอบๆ เปิดออกทีละบาน ผู้ใหญ่ออกมายืนกันเต็มกิ่ง ถือตะเกียงบ้าง ถือมีดบ้าง โอรีวัลมองหน้าพวกเขาทีละคน แล้วปล่อยมือจากปม

          ค่ายตัดไม้ไม่ไหม้ในคืนนั้น แต่ผู้ใหญ่บางคนที่เคยยื่นน้ำเต้าให้เขา เช้านั้นเดินผ่าน{name}ไปโดยไม่ทัก
        effects: { stats: { STR: 1 }, reputation: { crown: 1 }, flags: [lean_warrior, stopped_orival] }
      failure:
        text: |
          โอรีวัลแกะมือ{name}ออกจากเชือกทีละนิ้ว ไม่รีบ ไม่แรง เหมือนผู้ใหญ่แกะมือเด็กที่ไม่ยอมปล่อยของเล่น แล้วยก{name}ไปวางไว้ข้างบันได

          "เจ้าจำไว้ว่าคืนนี้เจ้าแพ้" เขาว่า "แล้วไปกินให้มากขึ้น" เขาไต่ลงไปในความมืด ใกล้รุ่งท้องฟ้าทางลำธารเป็นสีส้ม
        effects: { stats: { STR: 1, CON: 1 }, flags: [lean_warrior] }
    - id: warn_camp
      label: ลงไปเตือนคนในค่ายตัดไม้เป็นภาษามนุษย์
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          หัวหน้าค่ายเป็นชายแก่หนวดเหลืองที่สูบกล้องยาไม่หยุด เขาฟัง{name}จนจบ แล้วเคาะกล้องยากับรองเท้า "คืนไหน" เขาถามคำเดียว

          คืนนั้นค่ายไหม้เหมือนที่โอรีวัลตั้งใจ แต่เต็นท์ที่ลูกเมียคนงานนอนอยู่ว่างหมดตั้งแต่หัวค่ำ หัวหน้าค่ายพาไปนอนที่ค่ายทหาร ไม่มีใครเจ็บสักคน เช้าวันต่อมาโอรีวัลขึ้นมาหา{name}ที่กิ่งนอกบ้าน นั่งลงข้างๆ ไม่ได้พูดถึงเรื่องนั้นสักคำ เขาแค่ถามว่าภาษามนุษย์ คำว่า ขอบใจ ออกเสียงอย่างไร
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [lean_bard, warned_logging_camp] }
      failure:
        text: |
          คนในค่ายหัวเราะกันลั่น เด็กเอลฟ์ตัวกะเปี๊ยกเดินลงมาจากต้นไม้เพื่อบอกว่าค่ายจะไหม้ คนหนึ่งยื่นขนมปังให้ คนหนึ่งขว้างลูกสนใส่

          ค่ายไหม้ตอนตีสาม คนงานวิ่งออกมาจากเต็นท์กันทั้งค่าย มีคนแขนพองไปทั้งแขน แต่ไม่มีใครตาย เช้าวันต่อมาคนที่ขว้างลูกสนใส่{name}ยืนอยู่ที่โคนต้นไม้บ้าน ตะโกนขึ้นมาถามว่าเด็กเอลฟ์คนเมื่อวานชื่ออะไร
        effects: { stats: { CHA: 1 }, flags: [lean_bard] }

- id: youth.elf_keeper_eye
  stage: youth
  weight: 10
  when:
    age: [12, 13]
    flags: [origin_elf_bough]
  text: |
    ผู้คุมหอนับดาวเสียตาข้างที่เหลือไปทีละนิด เริ่มจากมองดาวดวงเล็กไม่เห็น แล้วดวงกลาง ปีนี้ต่อให้ฟ้าเปิดทั้งคืน เขาก็เห็นแค่ดวงที่สว่างที่สุดไม่กี่ดวง

    เขาไม่ได้นับดาวเอง ทุกคนนับช่องของตัวเอง หน้าที่ของเขาคือดูแลสมุด สมุดของทุกช่องตั้งแต่ปีแรกที่เอลฟ์เริ่มนับ เล่มเก่าที่สุดเขียนด้วยอักษรที่ไม่มีใครใช้มาสามร้อยปีแล้ว และคนที่ยังอ่านออกในป่าไอเลธเหลืออยู่ไม่ถึงสิบคน

    เขาให้คนมาตาม{name}ขึ้นหอในคืนเดียวกับที่ผู้เฒ่าจะลงไปทำพิธีส่งฤดูให้อุลเวนที่ลำธาร ผู้เฒ่าเองก็ขอให้{name}ไปช่วยแบกเขากวาง
  choices:
    - id: learn_script
      label: ขึ้นหอ ให้ผู้คุมหอสอนอ่านอักษรเก่า
      check: { stat: INT, dc: 12 }
      success:
        text: |
          ผู้คุมหอสอนด้วยนิ้ว จับนิ้วของ{name}ลากไปตามร่องหมึกที่แห้งจนนูน ทีละตัว คืนแรกได้สิบตัว คืนที่เจ็ด{name}อ่านบรรทัดแรกของสมุดเล่มแรกได้เอง

          ไม่ใช่ตัวเลข เป็นรายชื่อ ดาวทุกดวงในช่องของคนนับคนแรกมีชื่อ สิบสี่ดวง สิบสี่ชื่อ ชื่อสั้นๆ สองพยางค์เหมือนชื่อเทพ

          "อัสเทลตั้งชื่อให้ทุกดวง" ผู้คุมหอว่า "ดวงที่ขึ้นมาหลังจากนั้น ไม่มีใครตั้งให้"
        effects: { stats: { INT: 1 }, flags: [lean_wizard, reads_old_script] }
      failure:
        text: |
          อักษรเก่าแต่ละตัวเปลี่ยนความหมายตามตัวที่อยู่ข้างหน้า {name}จำได้วันนี้ พรุ่งนี้ก็สลับกันหมด ครบเดือนอ่านได้แค่สามคำ ไม่แน่ใจว่าถูกสักคำ

          ผู้คุมหอไม่ว่าอะไร ให้{name}ขึ้นมาอ่านให้ฟังต่อทุกคืนที่ฟ้าปิด อ่านผิดก็ให้อ่าน
        effects: { stats: { WIS: 1 }, flags: [lean_wizard] }
    - id: ulwen_rite
      label: ลงไปกับผู้เฒ่า แบกเขากวางไปที่ลำธาร
      text: |
        เขากวางคู่นั้นหนักจนต้องแบกพาดบ่าสลับข้างทุกร้อยก้าว เป็นเขาที่กวางตัวผู้แก่ที่สุดในป่าสลัดทิ้งเมื่อต้นปี กิ่งแตกออกเป็นสองแบบเดียวกับที่แกะไว้บนประตูทุกบ้าน ผู้เฒ่าเดินนำไปช้าๆ ไม่ใช้ไม้เท้า

        ที่ริมลำธาร แกให้{name}วางเขากวางลงในน้ำตื้น หันกิ่งไปทางทิศที่ลมพัดมา แล้วนั่งรอ ไม่มีบทสวด ไม่มีเพลง แค่นั่งรอจนน้ำค้างแรกของฤดูเกาะบนกิ่งเขากวาง

        "อุลเวนไม่ฟังคำพูด" แกว่าตอนเดินกลับ "ท่านดูว่าเราอดทนรอเป็นไหม"
      effects: { stats: { WIS: 1, CON: 1 }, flags: [lean_cleric, ulwen_rite_seen] }
    - id: counting_song
      label: ขึ้นหอ แต่ขอให้ผู้คุมหอสอนเพลงนับแทน
      text: |
        ก่อนจะมีสมุด เอลฟ์นับดาวด้วยเพลง แต่ละช่องมีเพลงของตัวเอง ร้องหนึ่งคำต่อหนึ่งดวง ร้องจบเพลงก็นับจบช่อง ทุกวันนี้มีแต่คนนับรุ่นเก่าไม่กี่คนที่ยังร้อง ผู้คุมหอจำได้ทุกช่อง

        เขาร้องเพลงของช่อง{name}ให้ฟัง เพลงสั้นมาก สิบสี่คำ {name}ร้องตามได้ตั้งแต่รอบที่สอง รอบที่สามถามว่าดาวที่เพิ่มขึ้นมาต้องร้องอย่างไร

        ผู้คุมหอวางมือลงบนราวหอ แล้วบอกว่าคนนับรุ่นหลังร้องเพลงเดิมจนจบ แล้วฮัมต่อไปเฉยๆ ฮัมไม่มีคำ ดวงละหนึ่งเสียง
      effects: { stats: { CHA: 1 }, flags: [lean_bard, knows_counting_song] }

- id: youth.elf_noric_tree
  stage: youth
  weight: 12
  when:
    age: [12, 13]
    flags: [origin_elf_bough, elf_human_friend]
  text: |
    โนริคไม่ได้ติดพ่อขึ้นมาแลกเกลือแล้ว ตั้งแต่ปีกลายเขาไปทำงานที่ค่ายตัดไม้ ปีนต้นไม้เก่งขึ้นเพราะงานบังคับ ขึ้นไปผูกเชือกบนกิ่งสูงให้คนข้างล่างดึง

    เช้าวันหนึ่ง{name}ได้ยินเสียงไม้หักดังข้ามป่ามาถึงบ้านกิ่งลม ไม่ใช่เสียงต้นไม้ล้มอย่างที่ได้ยินทุกวัน เป็นเสียงกิ่งหักกลางคัน แล้วเสียงคนร้อง

    {name}ไปถึงก่อนคนในค่าย โนริคนอนอยู่บนรากไม้ ขาขวาหักผิดรูปลงไปตั้งแต่ใต้เข่า หน้าซีดจนปากเป็นสีเดียวกับหน้า เขาเห็น{name}แล้วยิ้ม ฟันหน้าที่หลุดตอนเด็กขึ้นมาใหม่ครบแล้ว

    "ข้างบนนั้นมีส้วมไหม" เขาถาม แล้วหัวเราะจนต้องกัดฟัน
  choices:
    - id: carry_up
      label: แบกเขาขึ้นบ้านกิ่งลมไปให้ผู้เฒ่าดู
      text: |
        บ้านกิ่งลมไม่รักษาคนนอกบนกิ่ง ไม่มีใครเขียนเป็นกฎ แต่ไม่มีใครเคยทำ {name}ผูกโนริคไว้กับหลังด้วยเชือกของเขาเอง แล้วปีนบันไดเชือกทีละขั้น

        ผู้เฒ่ายืนรออยู่ที่หัวบันได มองโนริค มอง{name} แล้วหลีกทางให้ แกดึงกระดูกเข้าที่เอง ดามด้วยกิ่งสน แล้วต้มน้ำใบไม้ที่กลิ่นเหมือนดินหลังฝนให้กินจนหลับ

        โนริคนอนอยู่บนกิ่งเจ็ดวัน ตอนพ่อเขาขึ้นมารับ ผู้ใหญ่บ้านกิ่งลมครึ่งหมู่บ้านออกมายืนดูมนุษย์คนแรกที่ได้ลงบันไดเชือกด้วยขาที่ดามไม้สน
      effects: { stats: { WIS: 1 }, alignment: { law: -1, moral: 1 }, flags: [lean_cleric, noric_healed] }
    - id: splint_carry
      label: ดามขาเขาด้วยกิ่งไม้ แล้วแบกกลับบ้านตีนไม้เอง
      check: { stat: STR, dc: 13 }
      success:
        text: |
          {name}หักกิ่งตรงๆ สองกิ่ง ฉีกแขนเสื้อตัวเองมัด แล้วแบกโนริคขึ้นหลัง เดินลงเนินไปทางบ้านตีนไม้ ทางที่ปกติเดินครึ่งวัน วันนั้นเดินจนมืด

          พ่อของโนริควิ่งออกมารับที่ปากหมู่บ้าน เขาพูดภาษาเอลฟ์ขอบคุณยาวเหยียด แล้วพูดภาษามนุษย์ด่าลูกตัวเองอีกยาวกว่านั้น
        effects: { stats: { STR: 1, CON: 1 }, flags: [lean_warrior, noric_carried] }
      failure:
        text: |
          ไปได้ครึ่งเนิน ขา{name}ก็สั่นจนต้องวางโนริคลง วางแล้วยกใหม่ไม่ขึ้น โนริคร้องไห้ไม่มีเสียงเพราะกัดแขนเสื้อตัวเองไว้

          คนในค่ายตามมาเจอตอนบ่าย หามโนริคไปบนแคร่ไม้ ขาเขาหายช้ากว่าที่ควร เดินกะเผลกไปตลอด แต่ทุกครั้งที่ขึ้นมาแลกเกลือกับพ่อ เขาเดินขึ้นบันไดเชือกเองโดยไม่ให้ใครช่วย
        effects: { stats: { STR: 1 }, flags: [lean_warrior] }
    - id: demand_doctor
      label: เดินเข้าค่าย บอกหัวหน้าว่าถ้าไม่จ้างหมอ ค่ายนี้จะไหม้
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          หัวหน้าค่ายรู้ว่าค่ายที่ไหม้ทุกปีไหม้เพราะใคร และรู้ว่าคนทำมีหน้าตาอย่างไร เขามองหูยาวของ{name} มองมีดที่เอว แล้วส่งคนขี่ม้าออกไปตามหมอจากเมืองทันที

          โนริคได้หมอเมืองมาดามขา ได้ค่าแรงครึ่งเดือนโดยไม่ต้องทำงาน คืนนั้นค่ายไม่ไหม้ แต่หัวหน้าค่ายนั่งเฝ้ากองซุงอยู่ทั้งคืน ถือปืนไว้บนตัก
        effects: { stats: { CHA: 1 }, reputation: { crown: -1 }, flags: [lean_rogue, threatened_camp] }
      failure:
        text: |
          หัวหน้าค่ายหัวเราะ บอกว่าค่ายไหม้ปีละครั้งอยู่แล้ว ไม่ต้องให้เด็กเอลฟ์มาบอก แล้วสั่งคนสองคนหามโนริคไปไว้ในเต็นท์ ไม่ได้ตามหมอ

          {name}นั่งเฝ้าเต็นท์นั้นจนมืด พอเขาหลับก็ปีนกลับไปบ้านกิ่งลม เล่าให้โอรีวัลฟังทุกคำที่หัวหน้าค่ายพูด โอรีวัลฟังจบแล้วยิ้ม เป็นยิ้มที่{name}ไม่เคยเห็นมาก่อน
        effects: { stats: { WIS: 1 }, flags: [lean_rogue] }
