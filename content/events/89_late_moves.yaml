# ชุด 3 อายุ 41 ถึง 64: ย้ายถิ่นกลางชีวิต
# เฉพาะงานที่พาไปได้ (ช่างจักรกล หมอเดินทาง นักล่าค่าหัว คนนำทาง นักสำรวจ คณะละคร คนร้องข่าว ช่างตีเหล็ก พ่อค้า)
# ข้อเสนอให้ย้าย 6 เรื่อง (41–56 น้ำหนัก 12) ทางไปคือ location_tag ปลายทาง กับ flag moved_midlife และ moved_to_<ปลายทาง>
# ปีแรกในถิ่นใหม่ 5 เรื่อง (42–60 น้ำหนัก 25) ถิ่นละหนึ่งเรื่อง มีคนใหม่ที่มีชื่อเข้ามาในชีวิตเรื่องละหนึ่งคน
# ข่าวจากถิ่นเดิม 1 เรื่อง (45–64)

# ---------- ข้อเสนอให้ย้าย ----------
- id: adult.move_village_to_ventras
  stage: adult
  weight: 12
  scene: market
  when:
    age: [41, 56]
    location_tag: arvel_village
    not_flags: [left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter]
    not_orgs: [wick, crown_office, crown_army, crown_court]
  text: |
    วันตลาดของหมู่บ้านเคยมีทุกเจ็ดวัน ปีนี้เหลือเดือนละครั้ง คนหนุ่มสาวเข้าเมืองไปทำงานโรงกลั่นจนบางบ้านเหลือแต่คนแก่กับหมา งานที่เคยมาหา{name}ทุกสัปดาห์ ตอนนี้มาเดือนละสองสามงาน ส่วนใหญ่คนจ้างขอผัดค่าแรงไปหลังเกี่ยว

    คนขับเกวียนที่ขนของจากเวนทราสมาหมู่บ้านทุกเดือนบอกว่า น้องสาวของเขามีห้องว่างหนึ่งห้องในตึกแถวใกล้หอท่าเรือเหาะ ค่าเช่าจ่ายเป็นรายสัปดาห์ ในเมืองนั้นคนที่มีมือแบบ{name}ได้งานทุกวัน ไม่มีใครขอผัด เขาจะออกเกวียนกลับเมืองในอีกสามวัน ท้ายเกวียนมีที่ว่างพอสำหรับข้าวของของบ้านหนึ่งหลัง

    บ้านของ{name}มีลูกชายเจ้าของโรงสีมาถามซื้อตั้งแต่ปีก่อน เขารู้ว่าในหมู่บ้านนี้ไม่มีใครมีเงินซื้อบ้านแข่งกับเขา
  choices:
    - id: sell_and_ride
      label: ต่อราคาบ้านกับลูกชายเจ้าของโรงสี แล้วขึ้นเกวียนเข้าเมือง
      check: { stat: CHA, dc: 13 }
      effects: { location_tag: ventras, flags: [moved_midlife, moved_to_ventras] }
      success:
        text: |
          {name}ไม่ต่อราคาที่บ้าน ไปต่อที่ลานโรงสีตอนคนมาสีข้าวเต็มลาน บอกราคาของตัวเองดังพอให้ทุกคนได้ยิน แล้วบอกราคาที่เขาเสนอดังเท่ากัน ลูกชายเจ้าของโรงสียอมขึ้นราคาก่อนจะมีใครหัวเราะ ได้เงินเจ็ดเหรียญ น้อยกว่าราคาบ้านในปีที่ข้าวดี แต่ไม่ใช่ครึ่งเดียว

          สามวันต่อมาเกวียนออกจากหมู่บ้านตอนสาง ตกค่ำ{name}เห็นแสงฟ้าของเวนทราสลอยอยู่บนขอบฟ้าก่อนจะเห็นกำแพง ห้องของน้องสาวคนขับเกวียนอยู่ชั้นสาม หน้าต่างหันไปทางหอท่าเรือเหาะ ทั้งคืนมีเงาเรือเหาะเลื่อนผ่านกระจก
        effects: { stats: { CHA: 1 }, gold: 7, flags: [sold_the_village_house] }
      failure:
        text: |
          ลูกชายเจ้าของโรงสีรู้ว่าเกวียนจะออกในอีกสามวัน เขาไม่ต่อ ยื่นราคาเดิมแล้วรอ คืนที่สอง{name}ไปหาเขาถึงบ้านเอง ได้เงินสี่เหรียญ ครึ่งหนึ่งของราคาบ้านในปีที่ข้าวดี

          เกวียนออกจากหมู่บ้านตอนสาง {name}นั่งท้ายเกวียนบนกองข้าวของตัวเอง หันกลับไปเห็นลูกชายเจ้าของโรงสีเดินรอบบ้านหลังนั้นเป็นรอบที่สอง ก้าวนับระยะรั้วไปทีละก้าว
        effects: { gold: 4, flags: [sold_the_village_house_cheap] }
    - id: lock_and_ride
      label: ใส่กุญแจบ้านไว้ ไม่ขาย แล้วขึ้นเกวียนเข้าเมือง
      text: |
        {name}ปิดหน้าต่างทุกบาน เอาไม้ตีขวางประตูหลัง แล้วฝากกุญแจไว้กับบ้านข้างๆ ค่าเช่าห้องในเมืองต้องจ่ายจากเงินที่เก็บไว้จนกว่างานในเมืองจะเลี้ยงตัวได้ ส่วนบ้านในหมู่บ้านไม่ได้ทำเงินให้สักเหรียญ

        ห้องในเวนทราสอยู่ชั้นสาม คืนแรกแสงฟ้าลอดผ้าม่านเข้ามาจนนอนไม่หลับ {name}นอนนับเงาเรือเหาะที่เลื่อนผ่าน กุญแจบ้านในหมู่บ้านอยู่ในมือคนอื่น ส่วนกุญแจห้องนี้ยังเย็นอยู่ในกระเป๋าเสื้อ
      effects: { gold: -3, location_tag: ventras, flags: [moved_midlife, moved_to_ventras, kept_the_village_house] }
    - id: walk_to_the_next_villages
      label: บอกคนขับเกวียนว่าไม่ไป แล้วเริ่มเดินไปหางานถึงหมู่บ้านข้างเคียง
      text: |
        {name}เดินไปหางานถึงหมู่บ้านถัดไปทั้งสองทาง ไปเช้ากลับค่ำ วันละครึ่งวันอยู่บนทาง เดือนแรกได้งานเพิ่มสามงาน เดือนที่สองห้างาน ทุกบ้านจ่ายช้า แต่จ่าย

        ลูกชายเจ้าของโรงสีมาถามซื้อบ้านอีกครั้งในหน้าหนาว {name}เชิญเขานั่งกินน้ำชาข้างเตา แล้วไม่ได้พูดเรื่องบ้านสักคำ
      effects: { stats: { CON: 1 }, flags: [walks_to_the_next_villages] }

- id: adult.move_ventras_to_village
  stage: adult
  weight: 12
  scene: home
  when:
    age: [41, 56]
    location_tag: ventras
    not_flags: [left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter]
    not_orgs: [wick, crown_office, crown_army, crown_court]
  text: |
    ตึกแถวที่{name}เช่าอยู่มาหลายปีขายให้โรงกลั่นแล้ว โรงกลั่นจะรื้อผนังกั้นห้องทั้งตึกทำห้องนอนรวมให้คนงานกะดึก คนเช่าทุกห้องได้เวลาหนึ่งเดือน เงินมัดจำไม่คืน เพราะสัญญาเช่าเขียนว่าคืนเมื่อออกตามกำหนด ไม่ได้เขียนว่าคืนเมื่อเจ้าของขาย

    ห้องใหม่ที่หาได้ในเมืองค่าเช่าแพงกว่าเดิมครึ่งหนึ่ง และอยู่ใต้ลมของปล่องโรงกลั่น ช่วงนี้ตอนเช้า{name}ไอจนต้องนั่งพักที่ขอบเตียง หมอข้างถนนบอกว่าอากาศในเมืองไม่ทำร้ายใครในวันเดียว แต่กินปอดคนทีละปี

    คนที่เคยจ้าง{name}คนหนึ่งเป็นหัวหน้าหมู่บ้านนอกกำแพง เดินครึ่งวัน บ้านที่ช่างไม้ของหมู่บ้านทิ้งไว้ตอนตายยังว่าง ลูกสาวเขาอยากให้คนที่ไม่ทำบ้านพังเช่าอยู่ หมู่บ้านนั้นยังจุดเทียน และในระยะหนึ่งวันเดินไม่มีใครทำงานแบบที่{name}ทำ
  choices:
    - id: rent_the_carpenters_house
      label: เช่าบ้านของช่างไม้ ขนของออกจากเมืองก่อนครบเดือน
      text: |
        เงินมัดจำห้องในเมืองหายไปตามสัญญา {name}จ้างเกวียนขนของออกจากเมืองหนึ่งเที่ยว ของที่ขนไม่ไหวขายให้คนเช่าห้องข้างๆ ในราคาที่เขาให้ ตกค่ำเกวียนพ้นประตูเมือง แสงฟ้าข้างหลังบางลงเหลือเป็นแถบเดียว ข้างหน้ามืดจนคนขับต้องจุดตะเกียงน้ำมันแขวนหน้าวัว

        บ้านของช่างไม้มีกลิ่นขี้กบไม้อยู่ในเนื้อไม้ทุกแผ่น คืนแรก{name}จุดเทียนเล่มเดียว นอนฟังกบร้องในนาจนหลับไปก่อนเทียนหมด
      effects: { gold: -3, location_tag: arvel_village, flags: [moved_midlife, moved_to_arvel_village, rented_the_carpenters_house] }
    - id: buy_the_carpenters_house
      label: ขอซื้อบ้านของช่างไม้ขาดจากลูกสาวเขา แล้วย้ายออกจากเมือง
      requires: { min_gold: 8 }
      text: |
        ลูกสาวช่างไม้ขายให้แปดเหรียญ เงินเท่านี้ในเมืองจ่ายได้แค่ค่าเช่าห้องปีเดียว {name}นับเงินให้นางบนโต๊ะไสไม้ของพ่อนาง โต๊ะที่นางไม่ยอมขนไป บอกว่าหนักเกินกว่าจะพาไปไหน เงินมัดจำห้องในเมืองหายไปตามสัญญา คนที่เคยจ้าง{name}ในเมืองต้องหาคนใหม่

        คนในหมู่บ้านเห็นเกวียนของ{name}มาจอดหน้าบ้านช่างไม้ตอนบ่าย ไม่มีใครรู้ชื่อ{name} พวกเขาเรียก{name}ว่าคนจากเมือง คืนนั้นมีคนเอาไข่ไก่สามฟองมาวางไว้หน้าประตู ไม่บอกว่าใคร
      effects: { gold: -8, location_tag: arvel_village, flags: [moved_midlife, moved_to_arvel_village, bought_the_carpenters_house] }
    - id: stay_downwind
      label: อยู่ในเมืองต่อ ย้ายไปห้องใต้ลมปล่อง
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ย้ายเข้าห้องใหม่ เอาผ้าชุบน้ำแขวนขวางหน้าต่างทุกคืน ผ้าขาวกลายเป็นสีเทาภายในสัปดาห์เดียว ต้องซักทุกเจ็ดวัน อาการไอตอนเช้าเหลือแค่ไม่กี่ครั้ง แล้วหายไปในหน้าฝน

          งานในเมืองยังมีทุกวันเหมือนเดิม ค่าเช่ากินเงินเพิ่มไปครึ่งหนึ่ง คนในย่านใหม่เริ่มเรียกชื่อ{name}ได้ในเดือนที่สาม
        effects: { stats: { CON: 1 }, gold: -2, flags: [stayed_under_the_chimney] }
      failure:
        text: |
          ห้องใต้ลมปล่องมีเขม่าเกาะขอบหน้าต่างหนาเท่าเล็บ ผ้าชุบน้ำกันไม่อยู่ เดือนที่สอง{name}ไอจนมีเลือดติดผ้าเช็ดปาก หมอข้างถนนคิดค่ายาสามเหรียญ ยาขมจนต้องกลั้นหายใจกลืน

          {name}ยังอยู่ห้องนั้น ไอน้อยลงในหน้าฝน แล้วกลับมาไอใหม่ตอนหน้าแล้ง
        effects: { hp: -2, gold: -3, flags: [stayed_under_the_chimney, chimney_cough] }

- id: adult.move_village_to_ileth
  stage: adult
  weight: 12
  scene: road
  when:
    age: [41, 56]
    location_tag: arvel_village
    not_flags: [left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter, race_elf]
    not_orgs: [wick, crown_office, crown_army, crown_court]
  text: |
    คนส่งข่าวจากหมู่บ้านชายป่าไอเลธมาถึงพร้อมลาตัวหนึ่ง เขาพูดภาษาอาร์เวลปนคำที่ไม่มีใครในหมู่บ้านรู้จัก ทุกประโยคลงท้ายด้วยเสียงสูงเหมือนคำถาม

    หมู่บ้านของเขาอยู่ใต้ต้นไม้ที่แก่กว่าราชอาณาจักร ห่างจากที่นี่หกวันเดิน คนที่ทำงานแบบ{name}คนสุดท้ายของหมู่บ้านนั้นตายไปเมื่อหน้าหนาว เขาได้ยินชื่อ{name}จากคนเดินทางที่เคยจ้าง{name} หมู่บ้านจะให้บ้านอยู่โดยไม่คิดค่าเช่า ให้ข้าวทุกเดือน แต่ไม่มีเหรียญ หมู่บ้านชายป่าจ่ายกันด้วยผ้าทอใยไม้ที่แลกมาจากเอลฟ์ข้างบน กับของป่าที่เอลฟ์หย่อนลงมาในตะกร้า

    ป่าไอเลธที่{name}เคยเห็นมีแค่เสาฟ้าสองต้นบนขอบฟ้าทางตะวันตก
  choices:
    - id: walk_after_the_mule
      label: เก็บของเท่าที่ลาตัวหนึ่งแบกไหว แล้วเดินตามคนส่งข่าวไป
      text: |
        ของที่ลาแบกไม่ไหว{name}ขายให้คนในหมู่บ้านในวันเดียว ได้เงินไม่ถึงครึ่งของที่ควรได้ เพราะทุกคนรู้ว่า{name}ต้องออกเดินพรุ่งนี้เช้า บ้านให้หลานของบ้านข้างๆ เข้าไปอยู่เฝ้า ไม่คิดค่าเช่า

        วันที่หก{name}เดินเข้าเงาของต้นไม้ต้นแรก อากาศเย็นลงทันทีเหมือนก้าวเข้าถ้ำ คนส่งข่าวชี้ขึ้นข้างบน {name}ต้องเงยจนคอตึงถึงจะเห็นบันไดเชือกห้อยลงมาจากกิ่ง และบ้านที่อยู่บนนั้น
      effects: { gold: -3, location_tag: ileth, flags: [moved_midlife, moved_to_ileth, walked_to_the_forest_edge] }
    - id: learn_the_words_first
      label: ขอให้คนส่งข่าวพักทั้งหน้าหนาว สอนคำของหมู่บ้านชายป่าให้ก่อนออกเดิน
      check: { stat: INT, dc: 13 }
      effects: { location_tag: ileth, flags: [moved_midlife, moved_to_ileth] }
      success:
        text: |
          คนส่งข่าวพักอยู่บ้าน{name}จนหิมะละลาย จ่ายค่าที่พักด้วยการสอนคำวันละสิบคำหลังมื้อเย็น ภาษาชายป่าคือภาษาอาร์เวลที่ยืมคำเอลฟ์มาครึ่งหนึ่ง คำที่ยืมมาส่วนใหญ่เป็นคำเรียกต้นไม้ ลม และของที่หย่อนลงมาจากข้างบน ปลายหน้าหนาว{name}ต่อราคาค่าลากับเขาเป็นภาษานั้นได้ บ้านในหมู่บ้านขายให้คนบ้านข้างๆ ในราคาที่เขามี

          ต้นฤดูไถทั้งสองออกเดินพร้อมลาสองตัว วันที่หกคนส่งข่าวพาเข้าหมู่บ้าน คนแรกที่ทัก{name}เป็นยายคนหนึ่งที่ตักน้ำอยู่ริมบ่อ {name}ตอบนางเป็นภาษาของนางเอง นางวางถังลง
        effects: { stats: { INT: 1 }, gold: -1, flags: [learned_the_edge_words] }
      failure:
        text: |
          คำเอลฟ์ที่ปนอยู่ในภาษาชายป่าออกเสียงด้วยลมผ่านฟันแบบที่ปากของ{name}ทำไม่ได้ ทั้งหน้าหนาวจำได้แค่คำทักทาย คำขอบใจ กับคำนับเลขถึงสิบ คนส่งข่าวกินข้าวบ้าน{name}จนยุ้งพร่องไปครึ่งหนึ่ง

          ต้นฤดูไถทั้งสองออกเดิน วันที่หกเข้าหมู่บ้าน {name}ทักยายที่ตักน้ำริมบ่อด้วยคำที่จำมา ยายหัวเราะจนต้องวางถัง คนส่งข่าวบอกทีหลังว่า{name}พูดคำขอบใจด้วยเสียงที่แปลว่าหม้อรั่ว
        effects: { gold: -3, flags: [mangled_the_edge_words] }
    - id: send_another
      label: ส่งคนส่งข่าวกลับไปพร้อมชื่อคนอื่นที่ทำงานแบบเดียวกัน
      text: |
        {name}รู้จักคนหนึ่งในหมู่บ้านข้างเคียง อายุน้อยกว่า งานยังไม่ดีเท่า แต่มีเวลาให้ป่าอีกหลายสิบปี {name}เขียนชื่อเขาให้คนส่งข่าว ด้านหลังวาดทางไปบ้านเขา

        ปลายปีคนส่งข่าวผ่านมาอีกครั้งในขากลับจากเมือง เขาเอาผ้าทอใยไม้ผืนเล็กมาให้{name}หนึ่งผืน บอกว่าคนที่{name}ส่งไปอยู่ได้ และสั่งมาว่าให้เอาผ้านี้มาให้
      effects: { alignment: { moral: 1 }, flags: [sent_another_to_the_forest] }

- id: adult.move_ventras_to_hordun
  stage: adult
  weight: 12
  scene: tavern
  when:
    age: [41, 56]
    location_tag: ventras
    not_flags: [left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter, race_dwarf]
    not_orgs: [wick, crown_office, crown_army, crown_court]
  text: |
    หัวหน้าคนงานคนแคระคนหนึ่งนั่งโต๊ะมุมโรงเตี๊ยมใกล้สถานีรถไฟมาสามคืนแล้ว เคราถักเป็นเปียสามเส้น ปลายเปียผูกด้วยลวดทองแดง เขามาจากฮอร์ดุน ตระกูลรางเหล็กของเขาเปิดทางรถไฟสายใหม่ขึ้นเขาด้านตะวันออก เมืองใหม่ข้างรางต้องการคนจากข้างล่างทุกแบบ งานแบบที่{name}ทำก็อยู่ในรายชื่อ

    ค่าแรงเป็นสองเท่าของในเวนทราส ได้ห้องเจาะในหินกับถ่านมารสำหรับหน้าหนาว ข้อแม้มีข้อเดียว สัญญาของตระกูลไม่เขียนบนกระดาษ สลักบนแผ่นหินที่ผนังห้องโถงของตระกูล ใครรับงานต้องให้สลักชื่อลงไปข้างชื่อของคนในตระกูล ใครผิดสัญญา ตระกูลจะสกัดชื่อนั้นออกจากหิน

    เขาวางแผ่นหินจำลองขนาดเท่าฝ่ามือไว้บนโต๊ะของ{name} ตัวอักษรคนแคระเรียงเป็นแถวแน่นจนดูเหมือนรอยเกาของนก
  choices:
    - id: carve_the_name
      label: ตกลงให้สลักชื่อลงหินของตระกูลรางเหล็ก แล้วขึ้นรถไฟไปกับเขา
      text: |
        หัวหน้าคนงานจ่ายค่ารถไฟให้ล่วงหน้า กับเงินอีกสามเหรียญเป็นค่าขนของ ของที่ขนไม่ไหว{name}ทิ้งไว้กับเจ้าของห้องเช่าในราคาที่เจ้าของห้องให้ คนที่เคยจ้าง{name}ในเวนทราสได้ยินข่าวทีหลัง จากคนอื่น

        รถไฟไต่เขาไปสองวัน วันที่สามประตูหินของตระกูลรางเหล็กเปิดรับ ช่างสลักคนแคระสลักชื่อ{name}ลงหินด้วยอักษรของคนแคระ เสียงสิ่วกระทบหินดังไปทั้งห้องโถง ในอักษรนั้น ชื่อของ{name}หน้าตาไม่เหมือนชื่อของใครที่{name}เคยรู้จัก
      effects: { gold: 3, location_tag: hordun, flags: [moved_midlife, moved_to_hordun, name_on_the_rail_clan_stone] }
    - id: read_the_stone
      label: ขอให้หัวหน้าคนงานอ่านแผ่นหินจำลองให้ฟังทีละแถว ก่อนตกลง
      check: { stat: INT, dc: 14 }
      effects: { location_tag: hordun, flags: [moved_midlife, moved_to_hordun, name_on_the_rail_clan_stone] }
      success:
        text: |
          หัวหน้าคนงานอ่านให้ฟังทีละแถว {name}ให้เขาอ่านแถวที่หกซ้ำสองรอบ แถวนั้นบอกว่าคนนอกตระกูลที่รับงานต้องทำงานให้ตระกูลจนกว่ารางสายนั้นจะเสร็จ ไม่ได้บอกว่ากี่ปี {name}ถามว่ารางสายตะวันออกยาวเท่าไร เขาตอบว่ายังไม่มีใครรู้

          เขาหัวเราะ ตบโต๊ะ แล้วยอมให้ช่างสลักเติมคำว่าสิบปีลงท้ายแถวที่หก ก่อนสลักชื่อ{name}ลงหินจริงที่ฮอร์ดุน คนแคระที่นั่งโต๊ะข้างๆ ยกจอกให้{name}หนึ่งครั้ง ของที่ขนไม่ไหว{name}ทิ้งไว้ในห้องเช่า
        effects: { stats: { INT: 1 }, gold: 3, flags: [ten_years_on_the_stone] }
      failure:
        text: |
          หัวหน้าคนงานอ่านเร็วจนแถวที่สามกับแถวที่สี่ต่อกันเป็นประโยคเดียว {name}ฟังไม่ทัน ไม่กล้าขอให้อ่านซ้ำเป็นครั้งที่สาม แล้วตกลงไปตามที่ฟังได้ ค่ารถไฟเขาจ่ายให้ ค่าขนของ{name}จ่ายเอง

          ปีที่สองในฮอร์ดุน คนแคระห้องข้างๆ อ่านแถวที่หกให้ฟังช้าๆ ตามที่สลักไว้จริง คนนอกตระกูลที่รับงานต้องทำงานให้ตระกูลจนกว่ารางสายตะวันออกจะเสร็จ รางสายนั้นวางไปได้ไม่ถึงหนึ่งในสิบ
        effects: { gold: -2, flags: [bound_until_the_rail_is_done] }
    - id: stay_in_ventras
      label: เลื่อนแผ่นหินจำลองคืนให้เขา อยู่เวนทราสต่อ
      text: |
        หัวหน้าคนงานเก็บแผ่นหินใส่ย่าม ไม่ถามเหตุผล เขาไปนั่งโต๊ะมุมเดิมอีกสองคืน ได้คนไปเจ็ดคน

        ปลายปี รถไฟสายตะวันออกของตระกูลรางเหล็กเปิดเที่ยวแรก แผ่นข่าวในเวนทราสลงข่าวพร้อมรายชื่อคนจากข้างล่างที่ไปทำงานนั้น เจ็ดชื่อ {name}รู้จักสองชื่อ
      effects: { flags: [stayed_off_the_clan_stone] }

- id: adult.move_hordun_to_ashland
  stage: adult
  weight: 12
  scene: road
  when:
    age: [41, 56]
    location_tag: hordun
    not_flags: [left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter]
    not_orgs: [wick, crown_office, crown_army, crown_court]
  text: |
    บริษัทเหมืองที่ขุดถ่านมารในแดนเถ้าฝังแผ่นหินประกาศไว้ที่ปากสถานีรถไฟทุกสถานีในฮอร์ดุน อักษรคนแคระกับอักษรอาร์เวลคู่กัน รายชื่องานที่บริษัทต้องการยาวสิบแปดแถว งานของ{name}อยู่แถวที่เก้า ค่าแรงสองเท่าครึ่ง รถไฟขนถ่านเที่ยวขากลับไปแดนเถ้าทุกสามวัน ใครจะไปนั่งบนกองกระสอบเปล่าได้โดยไม่เสียค่ารถ

    ห้องเจาะหินที่{name}เช่าอยู่ปีนี้ขึ้นค่าเช่าสองครั้ง ปล่องเตาของเมืองพ่นควันสีสนิมหนาขึ้นตั้งแต่ถึงกำหนดส่งถ่านใช้หนี้สงครามรอบใหม่ คนในเมืองทำงานหนักขึ้นและจ่ายช้าลง

    คนที่ลงจากรถไฟเที่ยวขากลับมีฝุ่นเทาติดอยู่ในร่องเล็บทุกคน ล้างไม่ออก
  choices:
    - id: ride_the_empty_sacks
      label: ขายของหนักที่ขนไม่ไหว แล้วนั่งรถไฟขนถ่านไปแดนเถ้า
      check: { stat: CON, dc: 13 }
      effects: { location_tag: ashland, flags: [moved_midlife, moved_to_ashland] }
      success:
        text: |
          ของหนักที่ขนไม่ไหว{name}ขายให้คนในทางเดินหินเดียวกันในวันเดียว ได้ราคาครึ่งเดียว รถไฟขนถ่านวิ่งลงเขาสามวันสามคืน กระสอบเปล่าเหม็นถ่านมาร ฝุ่นดำเกาะทุกรูขุมขน {name}นอนบนกองกระสอบ มัดข้าวของไว้ใต้ตัว ไม่หลับลึกสักคืน

          วันที่สี่ ดินข้างรางเปลี่ยนเป็นสีเทา เถ้าลึกถึงล้อรถ หญ้าสีเงินลู่ตามลมไปจนสุดตา ตอเสาของอัสเทลกินขอบฟ้าไปครึ่งหนึ่ง {name}ลงจากรถไฟพร้อมของครบทุกชิ้น
        effects: { stats: { CON: 1 }, gold: 2, flags: [rode_the_coal_train_east] }
      failure:
        text: |
          คืนที่สองรถไฟกระตุกตอนเข้าทางโค้ง ลังของ{name}ใบหนึ่งกลิ้งตกจากกองกระสอบลงไปในหุบข้างราง ไม่มีใครหยุดรถไฟให้ {name}กระโจนคว้าลังใบที่สองไว้ได้ ข้อมือซ้นจนบวมม่วง

          {name}ลงจากรถไฟที่แดนเถ้าพร้อมลังใบเดียว ของที่ขายไปก่อนออกเดินทางได้ราคาครึ่งเดียว ส่วนของที่ตกหุบไม่ได้อะไรเลย
        effects: { hp: -2, gold: -2, flags: [lost_a_crate_on_the_coal_train] }
    - id: sign_with_the_company
      label: ลงชื่อกับบริษัทเหมือง ทำงานให้เหมืองหนึ่งปีแลกค่าเดินทางกับห้องพัก
      text: |
        คนของบริษัทจดชื่อ{name}ลงสมุด ให้ตั๋วรถไฟโดยสาร ไม่ต้องนั่งบนกระสอบถ่าน ห้องพักเป็นห้องไม้ในค่ายคนงานข้างปากเหมือง ปีแรกงานของ{name}ทั้งหมดเป็นของบริษัท ราคาก็เป็นของบริษัท คนที่เคยจ้าง{name}ในฮอร์ดุนไม่มีใครได้ข่าว

        จากหน้าต่างห้องไม้มองเห็นหมู่บ้านทีฟลิ่งอยู่ถัดไปไม่ไกล หลังคาทุกหลังมีเถ้าหนาเท่าฝ่ามือ ตอนค่ำมีคนปีนขึ้นไปกวาดทีละหลัง
      effects: { gold: 3, alignment: { law: 1 }, location_tag: ashland, flags: [moved_midlife, moved_to_ashland, signed_a_year_to_the_mine] }
    - id: stay_in_the_rock
      label: อยู่ฮอร์ดุนต่อ จ่ายค่าเช่าที่ขึ้นแลกกับสัญญาเช่ายาว
      text: |
        {name}จ่ายค่าเช่าที่ขึ้น แลกกับให้เจ้าของห้องยอมต่อสัญญาเช่าออกไปสามปี หินที่สลักสัญญาเช่ามีชื่อ{name}อยู่แถวล่างสุด

        รถไฟขนถ่านเที่ยวขากลับยังผ่านสถานีทุกสามวัน ปลายปี{name}เริ่มจำหน้าคนที่ลงจากรถได้บางคน คนที่เคยยืนอ่านแผ่นประกาศแผ่นเดียวกันที่ปากสถานี
      effects: { gold: -3, flags: [stayed_in_the_rock_rooms] }

- id: adult.move_ashland_to_village
  stage: adult
  weight: 12
  scene: home
  when:
    age: [41, 56]
    location_tag: ashland
    not_flags: [left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter]
    not_orgs: [wick, crown_office, crown_army, crown_court]
  text: |
    จดหมายมาจากหมู่บ้านในอาร์เวล คนเขียนเคยจ้าง{name}เมื่อหลายปีก่อน ลายมือเอียงขวาเหมือนคนที่ไม่ได้เขียนบ่อย หมู่บ้านนั้นอยู่ห่างกำแพงเวนทราสครึ่งวัน ยังจุดเทียน ในระยะหนึ่งวันเดินไม่มีใครทำงานแบบ{name} ถ้า{name}มา หมู่บ้านมีบ้านว่างหลังหนึ่งข้างลานนวดข้าว

    ปีนี้เถ้าลอยขึ้นมาสูงกว่าทุกปี ทุกเช้า{name}ต้องเคาะเถ้าออกจากรองเท้าก่อนสวม หญ้าสีเงินรอบบ้านขมขึ้นจนแพะไม่ยอมกิน เหมืองที่อยู่ใกล้ที่สุดปิดไปหนึ่งปล่อง คนงานทีฟลิ่งครึ่งหมู่บ้านย้ายไปขุดเหมืองที่ลึกเข้าไปทางตอเสา

    บ้านของ{name}ในแดนเถ้าไม่มีใครซื้อ คนที่จะซื้อย้ายไปหมดแล้ว
  choices:
    - id: leave_it_to_the_ash
      label: ทิ้งบ้านไว้ให้เถ้ากลบ ขนของขึ้นเกวียนไปอาร์เวล
      text: |
        {name}ปิดประตูบ้าน ไม่ใส่กุญแจ เพราะไม่มีใครจะมาเปิด เกวียนที่จ้างได้เป็นเกวียนบริษัทเหมืองขากลับ ค่าเกวียนสามเหรียญ วันที่ห้าพื้นใต้ล้อเปลี่ยนจากเถ้าเป็นดิน มีต้นไม้ต้นแรก ต้นเล็กแกร็นริมลำธาร {name}ขอให้คนขับหยุดเกวียน แล้วลงไปแตะเปลือกต้นไม้

        บ้านข้างลานนวดข้าวมุงฟาง มีหน้าต่างสองบาน ตอนค่ำทั้งหมู่บ้านจุดเทียน แสงเหลืองเล็กๆ เป็นจุดๆ ไปทั้งทุ่ง
      effects: { gold: -3, location_tag: arvel_village, flags: [moved_midlife, moved_to_arvel_village, left_the_house_to_the_ash] }
    - id: sell_to_the_mine
      label: ไปเสนอขายบ้านให้นายเหมืองทำโรงเก็บของ ก่อนออกเดินทาง
      check: { stat: CHA, dc: 14 }
      effects: { location_tag: arvel_village, flags: [moved_midlife, moved_to_arvel_village] }
      success:
        text: |
          นายเหมืองไม่ต้องการบ้าน ต้องการผนังที่เถ้าเข้าไม่ได้ ไว้เก็บตะเกียงน้ำมันกับเชือกสำรองของเหมือง {name}พาเขาเดินดูหลังคาหินที่เพิ่งกวาด ผนังที่ฉาบดินเหนียวสองชั้น และประตูที่ปิดสนิทจนเถ้าไม่ลอดเข้าแม้วันลมแรง นายเหมืองจ่ายสี่เหรียญ

          {name}นั่งท้ายเกวียนบริษัทขากลับ เงินสี่เหรียญเย็บไว้ในตะเข็บเสื้อ เถ้าที่ติดล้อเกวียนร่วงหายไปทีละน้อยตลอดทางจนถึงอาร์เวล
        effects: { stats: { CHA: 1 }, gold: 4, flags: [sold_the_ash_house_to_the_mine] }
      failure:
        text: |
          นายเหมืองให้หนึ่งเหรียญ บอกว่าบ้านในแดนเถ้าปีนี้ไม่มีใครซื้อนอกจากเขา {name}รับ เพราะเกวียนบริษัทขากลับจะออกพรุ่งนี้ ค่าเกวียนสองเหรียญ เงินค่าบ้านไม่พอจ่าย

          ตอนเกวียนออก คนของเหมืองกำลังขนลังเชือกเข้าบ้าน{name} คนหนึ่งเหยียบกระถางหญ้าสีเงินหน้าประตูแตก
        effects: { gold: -1, flags: [gave_the_ash_house_to_the_mine] }
    - id: follow_the_village
      label: ย้ายตามคนทั้งหมู่บ้านไปอยู่ข้างเหมืองที่ลึกเข้าไปทางตอเสา
      text: |
        หมู่บ้านใหม่อยู่ใกล้ตอเสาจนตอนเย็นเงาของตอเสาทาบมาถึงหลังคา เถ้าลึกกว่าที่เดิมหนึ่งฝ่ามือ {name}ช่วยคนในหมู่บ้านขนแผ่นหินมุงหลังคาจากบ้านเก่ามาเรียงใหม่ทีละแผ่น ค่าเกวียนหารกันทุกบ้าน

        คืนแรกในบ้านใหม่ {name}เอาจดหมายจากอาร์เวลมาจุดไฟในเตา กระดาษไหม้หมดก่อนถ่านจะติด ต้องจุดใหม่อีกครั้ง
      effects: { gold: -1, flags: [followed_the_village_deeper] }

# ---------- ปีแรกในถิ่นใหม่ ----------
- id: adult.move_settle_ventras
  stage: adult
  weight: 25
  scene: market
  people: [{ id: talmas, name: ทัลมาส เบรนดิส, gender: m, bond: rival, closeness: -1, age: 52 }]
  when:
    age: [42, 60]
    flags: [moved_to_ventras]
    location_tag: ventras
    not_flags: [left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter]
  text: |
    ปีแรกในเวนทราส ชื่อของ{name}ไม่มีความหมายสำหรับใคร คนในย่านเรียก{name}ว่าคนบ้านนอก ตามสำเนียงที่ลากท้ายคำยาวกว่าคนเมือง งานที่มาถึงมือ{name}เป็นงานที่คนอื่นไม่รับ หรืองานที่คนจ้างหาใครไม่ได้แล้วตอนดึก

    คนที่ทั้งย่านไปหาก่อนคือทัลมาส เบรนดิส ทำงานแบบเดียวกับ{name}อยู่ในย่านนี้มายี่สิบปี มีป้ายไม้ทาสีตอกไว้ที่หัวบันไดทุกตึก ชื่อตัวเขียนใหญ่กว่าชื่องาน ใส่เสื้อกั๊กสีน้ำเงินที่รีดทุกเช้า คนในย่านเชื่อเขา เพราะเขาไม่เคยบอกว่าทำไม่ได้

    เดือนที่สาม ทัลมาสเดินมาถึงหน้าห้องของ{name} ยิ้มกว้าง บอกว่าย่านนี้มีงานพอสำหรับสองคน ถ้าแบ่งกันให้ดี ฝั่งตึกริมแม่น้ำ ที่คนงานโรงกลั่นจ่ายช้า ยกให้{name} ฝั่งหอท่าเรือเหาะเป็นของเขา
  choices:
    - id: take_the_river_side
      label: รับฝั่งริมแม่น้ำ
      text: |
        คนงานโรงกลั่นจ่ายช้าจริง บางคนจ่ายเป็นข้าว บางคนจ่ายเป็นหลอดน้ำค้างดาวที่ขโมยมาจากโรงกลั่น {name}รับข้าว ไม่รับหลอด ปลายปีห้องของ{name}มีกระสอบข้าวกองถึงเอว เงินในถุงน้อยกว่าที่เคยมี

        ตึกริมแม่น้ำทั้งแถวเรียกชื่อ{name}ได้แล้ว เด็กในตึกจำทางขึ้นห้องของ{name}ได้โดยไม่ต้องถามใคร
      effects: { gold: -1, alignment: { moral: 1 }, flags: [took_the_river_side] }
    - id: take_the_towers
      label: ไม่แบ่ง ไปตอกป้ายของตัวเองถึงหัวบันไดตึกฝั่งหอท่าเรือเหาะ
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ทำป้ายไม้เล็กกว่าของทัลมาสครึ่งหนึ่ง ตอกไว้ใต้ป้ายของเขาทุกแผ่น เขียนราคาไว้ข้างชื่อ ต่ำกว่าราคาของเขาหนึ่งในสี่ ไม่ถึงสามเดือน คนจ้างฝั่งหอท่าเรือเหาะครึ่งหนึ่งขึ้นบันไดมาหา{name}

          ทัลมาสไม่ยิ้มอีก เช้าวันหนึ่งป้ายไม้ของ{name}ใต้ป้ายของเขาหายไปสามแผ่น {name}ตอกแผ่นใหม่ในบ่ายวันเดียวกัน
        effects: { stats: { CHA: 1 }, gold: 4, people: [{ id: talmas, closeness: -1 }], flags: [took_the_tower_side] }
      failure:
        text: |
          คนจ้างฝั่งหอท่าเรือเหาะอ่านป้ายของ{name}แล้วถามว่าชื่อนี้คือใคร คนในตึกตอบว่าคนบ้านนอก ไม่มีใครขึ้นบันไดมา ทัลมาสเดินผ่านป้ายของ{name}ทุกเช้า ไม่แกะทิ้ง ปล่อยให้ฝุ่นจับ

          ปลายปี{name}ยังได้งานแค่ฝั่งริมแม่น้ำที่ทัลมาสยกให้ตั้งแต่แรก ค่าไม้กับค่าสีของป้ายเสียไปเปล่าๆ
        effects: { gold: -2, flags: [talmas_kept_the_towers] }
    - id: work_his_overflow
      label: เสนอทัลมาสว่าจะรับงานที่เขาทำไม่ทันทั้งสองฝั่ง แบ่งเงินให้เขาหนึ่งในห้า
      text: |
        ทัลมาสหัวเราะ บอกว่าไม่เคยมีใครเสนอแบบนี้ แล้วรับ งานที่เขาทำไม่ทันมีมากกว่าที่ใครในย่านรู้ เพราะเขาไม่เคยบอกใครว่าทำไม่ได้ เขาแค่รับไว้แล้วทำช้า

        ปีนั้น{name}ทำงานใต้ชื่อของทัลมาสครึ่งหนึ่ง คนจ้างไม่รู้ว่าใครทำ ทัลมาสรู้ ปลายปีเขาเอาป้ายไม้แผ่นหนึ่งมาให้ ชื่อ{name}ตัวเล็กเขียนอยู่ใต้ชื่อเขา
      effects: { gold: 3, people: [{ id: talmas, closeness: 2 }], flags: [works_under_talmas_name] }

- id: adult.move_settle_village
  stage: adult
  weight: 25
  scene: home
  people: [{ id: odil, name: ออดิล ลูกบาสเตน, gender: f, bond: friend, closeness: 1, age: 50 }]
  when:
    age: [42, 60]
    flags: [moved_to_arvel_village]
    location_tag: arvel_village
    not_flags: [left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter]
  text: |
    คนในหมู่บ้านเรียก{name}ว่าคนนอก ไม่เรียกชื่อ เด็กๆ เดินอ้อมหน้าบ้าน{name}เป็นวงกว้างกว่าบ้านอื่น ร้านขายของในหมู่บ้านขายเทียนให้{name}แพงกว่าที่ขายคนในหมู่บ้าน

    บ้านติดกันเป็นของออดิล ลูกบาสเตน หญิงม่ายตัวสูงที่อบขนมปังขายทั้งหมู่บ้านจากเตาหลังบ้าน ทุกเช้าก่อนสางกลิ่นขนมปังลอยข้ามรั้วมา นางพูดกับ{name}วันละประโยค ประโยคเดียวกันทุกวัน ว่าเช้านี้หนาว หรือเช้านี้ไม่หนาว

    ปลายฤดูเกี่ยว หมู่บ้านจะยกคานยุ้งข้าวกลางลานนวดใหม่ ทุกบ้านต้องส่งคนมาช่วย ตามธรรมเนียม คนที่ช่วยยกคานได้นั่งม้านั่งยาวในงานกินข้าวใหม่ คนจัดที่นั่งคือออดิล
  choices:
    - id: lift_the_beam
      label: ไปช่วยยกคานยุ้งข้าวตั้งแต่สาง
      check: { stat: STR, dc: 13 }
      success:
        text: |
          คานยาวสิบสองศอก ต้องใช้คนสิบสองคนยกขึ้นพร้อมกัน {name}ได้ปลายคานฝั่งที่ไม่มีใครอยากจับ ฝั่งที่ต้องยกสูงกว่าคนอื่นครึ่งตัวตอนวางลงบนเสา คานลงร่องเดือยพอดีในครั้งเดียว มีคนตบหลัง{name}สองครั้งโดยไม่หันมาดูว่าใคร

          คืนกินข้าวใหม่ ออดิลชี้ม้านั่งยาวตัวที่สามให้{name} ระหว่างคนเลี้ยงเป็ดกับคนตีเกือกม้า เช้าวันต่อมานางพูดกับ{name}สองประโยค
        effects: { stats: { STR: 1 }, people: [{ id: odil, closeness: 1 }], flags: [sat_on_the_harvest_bench] }
      failure:
        text: |
          ตอนวางคานลงบนเสา มือของ{name}ลื่น ปลายคานฝั่งนั้นตกลงก่อนฝั่งอื่น กระแทกไหล่{name}เต็มแรง คนข้างๆ คว้าไว้ได้ก่อนคานจะหล่นทั้งท่อน คานต้องยกใหม่อีกรอบ รอบนี้ไม่มี{name}

          คืนกินข้าวใหม่ ออดิลชี้ม้านั่งปลายสุดให้{name} ติดกับคนเฝ้าวัว ไหล่ของ{name}บวมจนยกจอกด้วยมือข้างนั้นไม่ได้
        effects: { hp: -2, flags: [dropped_the_granary_beam] }
    - id: ask_odil
      label: ไปยืนรอหน้าเตาขนมปังของออดิลตอนสาง ถามตรงๆ ว่าที่นี่ต้องการอะไรจากคนนอก
      text: |
        ออดิลทำขนมปังต่อจนเสร็จถาดที่สาม ไม่หยุดมือ แล้วตอบว่าคนนอกที่มาอยู่หมู่บ้านนี้ส่วนใหญ่อยู่ไม่ถึงสามหน้าหนาว คนในหมู่บ้านรอดูว่า{name}จะอยู่ถึงไหม ก่อนจะเปลืองแรงจำชื่อ

        นางยื่นขนมปังก้อนเล็กที่ไหม้ก้นให้{name}หนึ่งก้อน บอกว่าก้อนที่ไหม้ไม่มีใครซื้อ ตั้งแต่วันนั้น ทุกเช้าจะมีขนมปังไหม้ก้นหนึ่งก้อนวางอยู่บนรั้วระหว่างสองบ้าน
      effects: { people: [{ id: odil, closeness: 2 }], flags: [told_to_last_three_winters] }
    - id: show_odil_the_horns
      label: แก้ผ้าโพกหัวออกต่อหน้าออดิล ก่อนที่คนในหมู่บ้านจะรู้เอง
      requires: { flag: race_tiefling, not_flags: [horns_sawn] }
      text: |
        ออดิลหยุดนวดแป้ง มือยังจมอยู่ในแป้งถึงข้อมือ นางบอกว่าเมื่อก่อนหมู่บ้านนี้เอาเด็กแบบ{name}ไปวางไว้ที่ทางสามแพร่ง นางเองก็เคยเดินผ่านทางสามแพร่งนั้นตอนสาง แล้วไม่ได้หยุด

        นางกลับไปนวดแป้งต่อ ไม่บอกใคร แต่ก็ไม่ได้ห้ามใครรู้ ปลายฤดูคนในหมู่บ้านรู้กันหมด ครึ่งหมู่บ้านเลิกซื้อขนมปังของออดิล นางอบน้อยลงครึ่งหนึ่ง แล้วยังส่งขนมปังข้ามรั้วมาให้{name}ทุกเช้า
      effects: { stats: { CHA: 1 }, people: [{ id: odil, closeness: 2 }], flags: [showed_odil_the_horns] }
    - id: keep_to_the_work
      label: ไม่ไปยกคาน ทำงานของตัวเองต่อ
      text: |
        วันยกคาน{name}ทำงานอยู่ในบ้านตั้งแต่สางถึงค่ำ ได้เงินสองเหรียญจากงานของคนหมู่บ้านถัดไป เสียงคนโห่ตอนคานลงเสาดังมาถึงหน้าต่าง

        คืนกินข้าวใหม่ไม่มีใครมาตาม ออดิลยังพูดกับ{name}วันละประโยคเหมือนเดิม ว่าเช้านี้หนาว หรือเช้านี้ไม่หนาว
      effects: { gold: 2, flags: [kept_out_of_the_beam_raising] }

- id: adult.move_settle_ileth
  stage: adult
  weight: 25
  scene: market
  people: [{ id: athel, name: อาเธล, gender: m, bond: mentor, closeness: 1, age: 70 }]
  when:
    age: [42, 60]
    flags: [moved_to_ileth]
    location_tag: ileth
    not_flags: [left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter, race_elf]
  text: |
    หมู่บ้านชายป่าตั้งอยู่ใต้ร่มไม้ที่หนาจนเที่ยงวันยังต้องจุดเทียนในบ้าน คนที่นี่พูดภาษาอาร์เวลกับคนนอก พูดภาษาชายป่ากันเอง และพูดภาษาเอลฟ์กับตะกร้าที่หย่อนลงมาจากกิ่งตอนเช้า {name}ฟังออกแค่อย่างแรก

    ทุกเช้าที่ลานตะกร้าใต้ต้นใหญ่ เอลฟ์หย่อนตะกร้าลงมาพร้อมผ้าทอใยไม้กับยางสน คนหมู่บ้านใส่ข้าว เกลือ และเหล็กกลับขึ้นไป คนที่ยืนคุมเชือกและพูดกับข้างบนคืออาเธล ชายแก่หลังตรงที่เอลฟ์ตั้งชื่อให้ตั้งแต่ยังเป็นเด็ก ชื่อเดิมของเขาไม่มีใครจำได้แล้ว รวมทั้งตัวเขาเอง

    เดือนแรก ของที่{name}ใส่ตะกร้าขึ้นไปกลับลงมาครบทุกครั้ง ไม่มีอะไรแลกกลับมา อาเธลบอกว่าข้างบนไม่รับของจากคนที่ไม่มีชื่อในภาษาของพวกเขา
  choices:
    - id: learn_from_athel
      label: ยืนข้างอาเธลที่ลานตะกร้าทุกเช้า ฟังว่าเขาพูดอะไรกับข้างบน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          อาเธลไม่สอนเป็นคำ เขาให้{name}จับเชือกข้างเขา ฟังเสียงตะกร้ากระทบกิ่ง ฟังเขาพูดขึ้นไป แล้วฟังเสียงตอบลงมา ปลายหน้าฝน{name}รู้ว่าคำตอบที่ลงท้ายเสียงสูงคือรับ ลงท้ายเสียงต่ำคือยังไม่รับ และคำที่ข้างบนใช้เรียก{name}มาหลายเดือนแปลว่าคนที่ยืนผิดที่

          วันหนึ่งอาเธลยื่นปลายเชือกให้{name}ถือคนเดียว แล้วพูดชื่อหนึ่งขึ้นไป เสียงข้างบนพูดชื่อนั้นซ้ำ ตะกร้าลงมาพร้อมผ้าทอหนึ่งผืน อาเธลบอกว่าชื่อนั้นคือชื่อของ{name}จากนี้ไป แปลว่าคนที่มาทีหลัง
        effects: { stats: { INT: 1 }, people: [{ id: athel, closeness: 1 }], flags: [named_by_the_branches] }
      failure:
        text: |
          {name}จับเสียงได้แต่จับความหมายไม่ได้ วันหนึ่งอาเธลไม่อยู่ {name}พูดขึ้นไปเองตามที่จำมา ตะกร้าที่ลงมามีกิ่งไม้หักวางอยู่ก้นตะกร้ากิ่งเดียว

          อาเธลกลับมาเห็นกิ่งนั้นแล้วหัวเราะจนไอ เขาบอกว่า{name}เพิ่งขอให้ข้างบนส่งฟืนลงมา ข้าวสารที่{name}ใส่ขึ้นไปเช้านั้นไม่ได้กลับลงมา
        effects: { gold: -2, flags: [asked_the_branches_for_firewood] }
    - id: trade_through_athel
      label: จ่ายอาเธลให้พูดแทน แบ่งของที่แลกได้ให้เขาหนึ่งในสี่
      text: |
        อาเธลรับ เขาพูดขึ้นไปสามประโยค ตะกร้าของ{name}ลงมาพร้อมผ้าทอผืนใหญ่ในเช้าวันต่อมา หลังจากนั้นทุกเช้าอาเธลคุมเชือกให้{name}เหมือนให้คนในหมู่บ้าน และเก็บผ้าทอผืนที่สี่ของทุกสี่ผืนไป

        ข้างบนรู้จัก{name}ผ่านเสียงของอาเธลเท่านั้น วันที่อาเธลป่วยนอนอยู่บ้าน ตะกร้าของ{name}ลงมาว่าง
      effects: { gold: -1, people: [{ id: athel, closeness: 1 }], flags: [trades_through_athel] }
    - id: climb_up
      label: ไต่บันไดเชือกขึ้นไปหาข้างบนเอง
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          ไม่มีใครในหมู่บ้านเคยไต่ขึ้นไป อาเธลเองก็ไม่เคย บันไดเชือกแกว่งตามลมทุกขั้น ครึ่งทาง{name}ก้มลงไปเห็นลานตะกร้าเล็กเท่าฝ่ามือ แล้วไม่ก้มอีก

          ข้างบนมีชานไม้กว้างเท่าลานบ้าน เอลฟ์สามคนยืนรอ คนหนึ่งยื่นน้ำในถ้วยไม้ให้ ไม่มีใครพูดภาษาที่{name}รู้ {name}ดื่มจนหมดถ้วย วางถ้วยคืน แล้วไต่ลงไป เช้าวันต่อมาตะกร้าของ{name}ลงมาก่อนตะกร้าของคนอื่น
        effects: { stats: { DEX: 1 }, flags: [climbed_to_the_branches] }
      failure:
        text: |
          ขั้นที่สามสิบ เชือกเส้นข้างหนึ่งบิดตามลม เท้าของ{name}หลุดทั้งสองข้าง ห้อยอยู่ด้วยมือแล้วลื่นลงมาทีละขั้น ถึงพื้นด้วยฝ่ามือที่เชือกบาดเป็นแผลยาว

          คนหมู่บ้านยืนล้อมลานตะกร้า อาเธลพันมือให้ บอกว่าข้างบนไม่ชอบคนที่ขึ้นไปโดยไม่ได้เรียก เดือนนั้นตะกร้าของ{name}ลงมาว่างทุกเช้า
        effects: { hp: -2, flags: [fell_from_the_rope_ladder] }

- id: adult.move_settle_hordun
  stage: adult
  weight: 25
  scene: home
  people: [{ id: kromda, name: ครอมดา ตระกูลรางเหล็ก, gender: f, bond: friend, closeness: 0, age: 48 }]
  when:
    age: [42, 60]
    flags: [moved_to_hordun]
    location_tag: hordun
    not_flags: [left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter, race_dwarf]
  text: |
    ห้องที่{name}ได้ในฮอร์ดุนเจาะเข้าไปในหิน อยู่ในทางเดินของตระกูลรางเหล็ก ผนังอุ่นตลอดปีเพราะปล่องเตาของตระกูลวิ่งอยู่หลังหิน ทุกชั่วโมงมีรถไฟวิ่งผ่านใต้ทางเดิน ถ้วยบนชั้นสั่นเดินไปชนกันเองถ้าไม่หันหูถ้วยเข้าหาผนัง

    ประตูทุกห้องในทางเดินมีแผ่นหินเท่าฝ่ามือฝังอยู่ข้างวงกบ สลักชื่อคนในห้อง แผ่นหินข้างประตูห้องของ{name}ยังว่าง ครอมดา ตระกูลรางเหล็ก ผู้คุมทางเดิน ผมเปียหนาเท่าข้อมือ เสียงต่ำจนคนนอกนึกว่านางโมโหอยู่ตลอด นางเอาข้อนิ้วเคาะแผ่นหินว่างนั้นสามครั้ง บอกว่าหน้าหนาว ถ่านของทางเดินแบ่งตามแผ่นหิน ห้องที่ไม่มีชื่อไม่ได้ส่วน

    ถ้าจะสลักชื่อ ต้องให้คำต่อหน้าทางเดินสามข้อ จะไม่เปิดประตูหลังระฆังค่ำ จะไม่ทำเสียงดังเกินเสียงรถไฟ และจะช่วยแบกคนตายของทางเดินลงไปถึงผนังเสาเมื่อถึงคราว
  choices:
    - id: give_the_word
      label: ให้คำต่อหน้าทางเดิน แล้วให้ครอมดาสลักชื่อลงแผ่นหิน
      text: |
        คนในทางเดินยี่สิบเจ็ดคนมายืนเรียงหน้าประตูห้อง{name} ฟัง{name}พูดคำสามข้อตามที่ครอมดาบอกทีละคำ ครอมดาสลักชื่อ{name}ลงแผ่นหินด้วยอักษรคนแคระ สิ่วเคาะสิบสี่ครั้ง แล้วเป่าฝุ่นหินออก

        หน้าหนาวนั้นถ่านส่วนของ{name}มาวางหน้าประตูทุกเจ็ดวัน เท่ากับห้องอื่น ปลายหน้าหนาวคนแก่ในห้องสุดทางเดินตาย {name}เป็นหนึ่งในหกคนที่แบกร่างลงบันไดไปถึงผนังเสา
      effects: { alignment: { law: 1 }, people: [{ id: kromda, closeness: 1 }], flags: [name_on_the_corridor_stone] }
    - id: buy_own_coal
      label: ไม่ให้คำ ซื้อถ่านเองทั้งหน้าหนาว
      text: |
        ถ่านมารในตลาดฮอร์ดุนขายคนนอกแพงกว่าส่วนแบ่งของทางเดินสามเท่า {name}ซื้อทีละกระสอบ แบกขึ้นบันไดหินสี่ร้อยขั้นเอง ทุกครั้งที่ผ่านประตูห้องอื่น แผ่นหินข้างวงกบมีชื่อ แผ่นของ{name}ยังว่าง

        ครอมดาไม่ว่าอะไร นางทัก{name}ทุกเช้าด้วยเสียงต่ำเท่ากับที่ทักคนอื่น แต่ไม่เคยเรียกชื่อ
      effects: { stats: { CON: 1 }, gold: -4, flags: [bought_own_coal_in_hordun] }
    - id: carve_it_yourself
      label: ให้คำต่อหน้าทางเดิน แล้วขอสิ่วมาสลักชื่อเอง ด้วยอักษรคนแคระที่หัดมาทั้งเดือน
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}หัดอักษรคนแคระจากแผ่นหินข้างประตูห้องอื่นทุกคืน ลอกด้วยถ่านลงเศษไม้ วันให้คำ{name}ขอสิ่วจากครอมดา นางยื่นให้ด้วยหน้าที่ไม่เชื่อ คนทั้งทางเดินยืนดู {name}เคาะสิ่วทีละครั้ง ช้า ตัวอักษรตัวสุดท้ายลึกเท่าตัวแรก

          ครอมดาไล้นิ้วไปตามรอยสลัก แล้วบอกคนทั้งทางเดินว่าชื่อนี้สลักด้วยมือของเจ้าของชื่อ คนแคระสองคนที่ยืนหลังสุดเดินมาไล้นิ้วตามบ้าง
        effects: { stats: { DEX: 1 }, people: [{ id: kromda, closeness: 2 }], flags: [name_on_the_corridor_stone, carved_own_name] }
      failure:
        text: |
          ตัวอักษรตัวที่สองสลักเอียง สิ่วลื่นออกนอกร่องกินเนื้อหินไปเท่าเล็บ คนทั้งทางเดินหายใจเข้าพร้อมกัน ครอมดาเอาสิ่วคืน ขูดแผ่นหินจนเรียบ แล้วสลักชื่อ{name}ใหม่เองทั้งชื่อ

          แผ่นหินข้างประตูห้อง{name}บางกว่าแผ่นอื่นนิดหนึ่ง ใครเดินผ่านก็รู้ ครอมดาคิดค่าแผ่นหินที่เสียไปหนึ่งเหรียญ
        effects: { gold: -1, flags: [name_on_the_corridor_stone, scraped_doorstone] }

- id: adult.move_settle_ashland
  stage: adult
  weight: 25
  scene: home
  people: [{ id: fa_thiang, name: ฟ้าเที่ยง, gender: f, bond: friend, closeness: 1, age: 46 }]
  when:
    age: [42, 60]
    flags: [moved_to_ashland]
    location_tag: ashland
    not_flags: [left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter]
  text: |
    หมู่บ้านในแดนเถ้าที่{name}มาอยู่ชื่อบ้านหญ้าขม หลังคาทุกหลังมุงแผ่นหินบาง ลาดชัน เพราะหลังคาฟางรับน้ำหนักเถ้าไม่ไหว คนในหมู่บ้านเกือบทุกคนมีเขาบนหัว บางคนโค้งไปข้างหลัง บางคนชี้ขึ้นตรงๆ เด็กๆ เดินตาม{name}เป็นแถว ดูว่าคนนอกเดินในเถ้าลึกถึงเข่าได้อย่างไร

    ฟ้าเที่ยงอยู่บ้านถัดไป ชื่อนี้วิหารอีเซลในอาร์เวลตั้งให้ ตามฟ้าตอนเที่ยงของวันที่มีคนเจอนางในตะกร้าหน้าประตูวิหาร นางมาแดนเถ้าตั้งแต่ยังสาว ตอนนี้เป็นคนคุมเวรกวาดเถ้าของหมู่บ้าน ทุกครั้งที่เถ้าตกลงมาจากฟ้าทางตอเสา คนทั้งหมู่บ้านต้องขึ้นกวาดหลังคาให้หมดก่อนค่ำ หลังคาที่เถ้าค้างข้ามคืนจะทรุด

    เช้าวันที่เก้าที่{name}มาอยู่ ฟ้าทางตะวันออกเป็นสีเทาตั้งแต่สาง ฟ้าเที่ยงเดินมาหยุดหน้าบ้าน{name} ยื่นไม้กวาดด้ามยาวให้หนึ่งอัน
  choices:
    - id: sweep_the_roofs
      label: ขึ้นกวาดหลังคากับคนทั้งหมู่บ้านจนค่ำ
      check: { stat: CON, dc: 13 }
      success:
        text: |
          เถ้าตกลงมาเหมือนหิมะสีเทา เบาจนลอยกลับขึ้นทุกครั้งที่ไม้กวาดปัด {name}พันผ้าปิดปากสองชั้นตามที่ฟ้าเที่ยงบอก กวาดหลังคาบ้านตัวเอง แล้วกวาดต่อไปทีละหลังตามแถว จนถึงหลังคาบ้านที่มีแต่คนแก่ ตกค่ำหลังคาทุกหลังในหมู่บ้านกลับเป็นสีหินอีกครั้ง

          คืนนั้นฟ้าเที่ยงเอาซุปหญ้าสีเงินมาให้หนึ่งชาม ขมจนลิ้นชา นางบอกว่าคนที่กวาดถึงหลังคาของคนแก่ ได้กินซุปจากหม้อเดียวกับคนในหมู่บ้าน
        effects: { stats: { CON: 1 }, people: [{ id: fa_thiang, closeness: 1 }], flags: [swept_the_ash_roofs] }
      failure:
        text: |
          ผ้าปิดปากชั้นเดียวของ{name}กันเถ้าไม่อยู่ ครึ่งบ่ายเถ้าเข้าไปเกาะในคอ {name}ไอจนต้องนั่งลงบนสันหลังคา ฟ้าเที่ยงขึ้นมาพาลงบันได แล้วให้เด็กสองคนขึ้นไปกวาดหลังคาบ้าน{name}แทน

          {name}ไอเป็นเถ้าอยู่สามวัน ทุกครั้งที่ไอ ผ้าเช็ดปากมีรอยเทา
        effects: { hp: -2, flags: [ash_in_the_lungs] }
    - id: pay_the_children
      label: จ่ายเด็กในหมู่บ้านสองคนให้กวาดหลังคาบ้าน{name}แทน แล้วทำงานของตัวเองต่อ
      text: |
        เด็กสองคนรับเงินคนละหนึ่งในสี่เหรียญ กวาดหลังคาบ้าน{name}เสร็จก่อนบ่าย แล้วไปกวาดหลังคาบ้านคนแก่ต่อโดยไม่มีใครจ้าง ไม้กวาดที่ฟ้าเที่ยงยื่นให้ยังพิงอยู่ข้างประตูบ้าน{name}ทั้งวัน

        ตกค่ำนางมาเอาไม้กวาดคืน ไม่ได้ถามอะไร หลังจากวันนั้นเวรกวาดเถ้าของหมู่บ้านมีชื่อทุกบ้าน ยกเว้นบ้านของ{name}
      effects: { gold: -1, flags: [paid_children_to_sweep] }
    - id: temple_years
      label: บอกฟ้าเที่ยงว่า{name}ก็เคยเห็นประตูวิหารอีเซลจากด้านใน
      requires: { flag: origin_marked_foundling }
      text: |
        ฟ้าเที่ยงวางไม้กวาดพิงผนัง ถามว่าตอนนั้นใครคุมครัว ใครตีระฆังเช้า ใครเป็นคนตัดผมให้เด็กทุกต้นเดือน ชื่อที่{name}ตอบไม่ตรงกับชื่อที่นางจำได้สักชื่อ ต่างรุ่นกันเกินไป แต่ระฆังใบเดียวกัน ร้าวตรงขอบเหมือนกัน เสียงแตกพร่าตอนตีครั้งที่สามเหมือนกัน

        บ่ายนั้นทั้งสองกวาดหลังคาด้วยกันจนค่ำ ฟ้าเที่ยงนับครั้งที่ไม้กวาดปัดเป็นจังหวะเดียวกับระฆังวิหาร {name}นับตามได้โดยไม่ต้องหัด
      effects: { stats: { WIS: 1 }, people: [{ id: fa_thiang, closeness: 2 }], flags: [shared_the_temple_bell] }

# ---------- ข่าวจากถิ่นเดิม ----------
- id: adult.move_word_from_the_old_place
  stage: adult
  weight: 20
  scene: home
  when:
    age: [45, 64]
    flags: [moved_midlife]
    not_flags: [left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter]
  text: |
    คนขับเกวียนคนหนึ่งถามหาบ้านของ{name}มาตั้งแต่ปากทาง เขามาจากถิ่นที่{name}จากมา ผ่านมาทางนี้ด้วยงานของตัวเอง แต่รับฝากของมาด้วยห่อหนึ่ง ห่อผ้าเก่า มัดเชือกสามรอบ ข้างในเป็นเครื่องมือชิ้นหนึ่งที่{name}ลืมไว้ตอนย้าย คนที่เข้าไปในบ้านหลังเดิมเจอในซอกผนัง

    เขาเล่าข่าวถิ่นเดิมระหว่างกินน้ำ คนที่รับงานแบบ{name}ต่อจาก{name}ทำได้ไม่ถึงปีก็เลิก คนที่นั่นยังเอ่ยชื่อ{name}เวลามีงานแบบนั้น แล้วนึกขึ้นได้ว่า{name}ไม่อยู่แล้ว ส่วนคนแก่คนหนึ่งที่{name}รู้จักดีที่สุดในถิ่นนั้นกำลังจะตาย ฝากถามว่า{name}จะกลับไปทันไหม
  choices:
    - id: go_back_in_time
      label: ฝากงานไว้กับคนแถวบ้าน แล้วรีบเดินทางกลับถิ่นเดิม
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}เดินทางทั้งกลางวันและกลางคืน เปลี่ยนเกวียนสามเล่ม ไปถึงก่อนคนแก่คนนั้นสิ้นใจสองวัน เขาจำ{name}ได้ตอนเช้า ตอนบ่ายจำไม่ได้ ตอนค่ำจำได้อีกครั้ง และถามว่า{name}ไปอยู่ไหนมา

          {name}อยู่ช่วยงานศพจนเสร็จ บ้านหลังเดิมยังอยู่ที่เดิม {name}เดินผ่านหนึ่งครั้งตอนขาไป หนึ่งครั้งตอนขากลับ ไม่ได้หยุดทั้งสองครั้ง
        effects: { stats: { CON: 1 }, gold: -3, flags: [went_back_in_time] }
      failure:
        text: |
          เกวียนเล่มที่สองล้อหักกลางทาง {name}เดินเท้าต่ออีกสองวัน ไปถึงหลังงานศพเสร็จไปแล้วหนึ่งวัน ของที่ใช้ในงานยังกองอยู่หน้าบ้าน ยังไม่มีใครเก็บ

          คนที่ถิ่นเดิมให้{name}นอนที่บ้านของคนตายหนึ่งคืน ข้าวของของเขายังวางอยู่ที่เดิมทุกชิ้น ขากลับเท้าของ{name}พองทั้งสองข้าง
        effects: { hp: -2, gold: -3, flags: [went_back_too_late] }
    - id: send_the_tool_back
      label: ส่งเครื่องมือชิ้นนั้นกลับไปกับคนขับเกวียน ให้คนแก่คนนั้นถือไว้
      text: |
        {name}ห่อเครื่องมือกลับในผ้าผืนเดิม มัดเชือกสามรอบเหมือนเดิม ฝากเงินไปสองเหรียญเป็นค่าเดินทางของคนขับเกวียน เขารับ ไม่ถามว่าทำไมไม่ไปเอง

        สองเดือนต่อมาเกวียนเล่มเดิมผ่านมาอีก คนขับเกวียนบอกว่าคนแก่คนนั้นถือห่อผ้าไว้ในมือตอนสิ้นใจ ไม่ได้แก้ปมเชือกออก
      effects: { gold: -2, alignment: { moral: 1 }, flags: [sent_the_tool_back] }
    - id: hang_it_and_stay
      label: แขวนเครื่องมือไว้ข้างประตู ฝากคำกลับไปว่าไปไม่ได้
      text: |
        {name}แขวนเครื่องมือชิ้นนั้นไว้บนผนังข้างประตู ไม่ได้ใช้ งานที่นี่ใช้ของคนละแบบแล้ว คนขับเกวียนกินน้ำหมดถ้วย ออกเดินทางต่อตอนบ่าย พร้อมคำฝากสั้นๆ ของ{name}

        ปลายปีมีคนจากถิ่นเดิมผ่านมาอีกคน {name}ไม่ได้ถามเรื่องคนแก่คนนั้น คนที่มาก็ไม่ได้เล่า
      effects: { flags: [let_the_old_place_go] }
