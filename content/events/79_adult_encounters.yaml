# การปะทะของวัยผู้ใหญ่ 18–60 (ชุดแรก)
# ทุกเรื่องในไฟล์นี้เป็นการปะทะ (encounter) ไม่มี choices ตัวเลขของศัตรูอยู่ใน content/foes.yaml
# เรื่องที่เกิดซ้ำได้ (once: false) ให้ผลเป็นเงินหรือชื่อเสียง ไม่ให้ค่าพลัง เพื่อไม่ให้ค่าพลังไหลขึ้นจากการเจอซ้ำ
# การปะทะที่เอาถึงตายมีทางหนีทุกจังหวะ ลูกหลานของเจ้าเดิม (น้ำเดิน หินตื่น ไม้เฒ่า ลูกวัวใต้ทุ่ง นกหลงฝูง ลูกเสือไฟ) ชนะได้ด้วยการทำให้สงบ
# ข้อความของทางจบ (win lose stalemate flee parley) ต้องอ่านได้ไม่ว่าผู้เล่นใช้วิธีไหนมา
# ศัตรูฝ่ายดาว (side: star) มองไม่เห็นคนที่มีตราจอมมาร (ใบ้ไว้ในเรื่องเก่า ยังไม่เฉลย) ฉากของฝ่ายดาวจึงใส่ not_traits: [curse_brand] ทุกเรื่อง
# แรงใจกับจำนวนจังหวะ (วัดจากชีวิตจำลอง): 4 จังหวะแรงใจ 3 ชนะได้ราว 60% · 3 จังหวะแรงใจ 2 ราว 80% · 2 จังหวะแรงใจ 2 ราว 60%
#   ถ้าแรงใจเท่าจำนวนจังหวะในฉาก 3 จังหวะ ต้องสำเร็จทุกจังหวะ ชนะได้ราว 40% ใช้เฉพาะฉากที่มีทางเจรจาเป็นทางออกอีกทาง
# ฉากประจำงาน (flags: job_*) ให้น้ำหนักสูง (ครั้งเดียว 40 เกิดซ้ำได้ 10 ถึง 20) คนในงานนั้นจะได้เจอ ระบบเว้นช่วงการปะทะให้เองตาม ENCOUNTER.gap

# ---------- ทั่วไปและตามถิ่น ----------
- id: adult.enc_road_bandits
  stage: adult
  weight: 6
  once: false
  scene: road
  when:
    age: [18, 60]
  text: |
    ต้นไม้ล้มขวางทางเกวียนอยู่ตรงโค้ง รอยขวานที่โคนยังขาว ไม่ใช่ลมล้ม

    ชายสามคนเดินออกมาจากพุ่มไม้ข้างทาง คนหนึ่งถือกระบองตอกตะปู คนหนึ่งถือเคียว คนที่สามมือเปล่า และเป็นคนเดียวที่พูด

    "ทางนี้มีค่าบำรุง" เขาว่า เสียงเหนื่อยๆ แบบคนที่พูดประโยคนี้มาทั้งวัน "จ่ายแล้วพวกข้ายกต้นไม้ให้"
  encounter:
    foe: bandit
    name: โจรดักทาง
    beats:
      - text: คนถือกระบองเดินอ้อมไปข้างหลัง คนถือเคียวยืนเฉยๆ ตามองที่ย่ามของ{name} ไม่ได้มองหน้า
        moves:
          - id: road_deal
            label: ต่อราคาค่าบำรุงทาง จ่ายสามเหรียญแล้วเดินต่อ
            kind: talk
            parley: true
            requires: { min_gold: 3 }
          - id: road_bluff
            label: บอกว่าข้างหลังมีเกวียนของป้อมตามมาอีกสองเล่ม
            kind: talk
            success: คนพูดหันไปมองทางโค้งข้างหลัง{name} มองนานเกินไปสำหรับคนที่ไม่เชื่อ คนถือเคียวขยับเท้าถอยหลังไปครึ่งก้าวโดยไม่รู้ตัว
          - id: road_rush
            label: พุ่งชนคนมือเปล่าก่อนที่อีกสองคนจะตั้งตัว
            kind: attack
          - id: road_size
            label: ดูมือ ดูรองเท้า ดูว่าสามคนนี้เป็นโจรมานานแค่ไหน
            kind: read
            stat: WIS
            success: มือของทั้งสามด้านแบบคนจับคันไถ รองเท้าคนถือเคียวขาดจนเห็นนิ้ว กระบองตอกตะปูก็ตอกเบี้ยว พวกนี้เป็นชาวนาที่นาโดนยึด เพิ่งหัดปล้นได้ไม่กี่วัน และกลัวคนที่ไม่กลัวพวกเขา
          - id: road_bolt
            label: หันหลังวิ่งกลับไปทางเดิม
            kind: flee
      - text: คนถือกระบองเงื้อขึ้นจากข้างหลัง เงื้อช้าและสูง เหมือนจะผ่าฟืน
        answer: quick
        moves:
          - id: road_step
            label: เบี่ยงตัวออก ให้กระบองฟาดลงบนต้นไม้ที่ล้ม
            kind: quick
            success: กระบองลงบนลำต้นเต็มแรง ตะปูจมเนื้อไม้จนดึงไม่ออก คนถือยืนกระชากอยู่สองที แล้วเงยหน้าขึ้นมาเจอ{name}ยืนรออยู่ตรงหน้า
          - id: road_catch
            label: หันไปรับ จับด้ามกระบองไว้ทั้งสองมือ
            kind: guard
          - id: road_roar
            label: ตะคอกใส่หน้าคนพูด ถามว่าอยากให้เมียมารับศพที่นี่หรือ
            kind: talk
          - id: road_bolt2
            label: มุดลอดใต้ต้นไม้ที่ล้ม วิ่งต่อไปข้างหน้า
            kind: flee
      - text: คนถือเคียวตัดสินใจได้เสียที เขาเดินเข้ามา แขนเหยียดตรง ปลายเคียวสั่น
        answer: attack
        moves:
          - id: road_disarm
            label: ฟาดข้อมือข้างที่ถือเคียว
            kind: attack
          - id: road_talkdown
            label: บอกเขาว่าวางเคียวลงเถอะ ยังไม่มีใครเจ็บ ยังกลับบ้านได้
            kind: talk
          - id: road_trip
            label: เตะกรวดใส่หน้า แล้วเกี่ยวขา
            kind: quick
          - id: road_bolt3
            label: โยนย่ามทิ้งไปทางหนึ่ง แล้ววิ่งไปอีกทาง
            kind: flee
    win:
      text: |
        ทั้งสามคนหายเข้าพุ่มไม้ไปเร็วกว่าตอนออกมา คนหนึ่งทิ้งกระสอบป่านไว้ข้างทาง ข้างในมีเหรียญที่เก็บได้จากคนก่อนหน้า กับขนมปังแข็งครึ่งก้อน

        ต้นไม้ที่ขวางทาง{name}ต้องลากออกเอง
      effects: { gold: 4 }
    lose:
      text: |
        {name}ฟื้นขึ้นมาข้างทาง หัวปวดตุบๆ ตรงที่โดนฟาด ย่ามโดนเทคว่ำ ของที่ขายไม่ได้ยังอยู่ครบ เหรียญไม่อยู่

        รองเท้ายังอยู่ที่เท้า โจรที่ยังเหลือรองเท้าไว้ให้คือโจรที่ยังใหม่
      effects: { gold: -8 }
    stalemate:
      text: |
        เสียงกระดิ่งล่อดังมาจากทางโค้ง ทีนี้มีเกวียนมาจริง ทั้งสามคนมองหน้ากัน แล้วถอยเข้าพุ่มไม้โดยไม่มีใครสั่ง

        คนขับเกวียนช่วยลากต้นไม้ออก บ่นว่าเดือนนี้เจอต้นไม้ล้มตรงโค้งนี้สามหนแล้ว
    flee:
      text: |
        {name}วิ่งจนเสียงตะโกนข้างหลังเงียบไป ไม่มีใครตามมาไกล คนที่ปล้นเพราะหิวไม่มีแรงวิ่งนาน

        ทางอ้อมกินเวลาเพิ่มอีกครึ่งวัน
    parley:
      text: |
        คนพูดรับเหรียญไปนับสองรอบ พยักหน้า แล้วทั้งสามช่วยกันยกต้นไม้ออกให้จริงตามที่บอก คนถือเคียวยังพูดขอบคุณด้วยซ้ำ ก่อนโดนอีกคนถองสีข้าง

        ไปได้สักพัก{name}หันกลับมามอง พวกเขากำลังยกต้นไม้กลับมาวางที่เดิม
      effects: { gold: -3 }

- id: adult.enc_coal_road_hounds
  stage: adult
  weight: 8
  once: false
  time: night
  when:
    age: [18, 60]
    location_tag: ashland
  text: |
    ทางขนถ่านปูแผ่นไม้ทับเถ้าไว้ทั้งเส้น คืนนี้{name}เดินตามขบวนเกวียนกลับจากหลุมถ่าน เกวียนเล่มท้ายล้อตกขอบไม้ จมลงไปถึงดุม ขบวนข้างหน้าไปต่อโดยไม่รู้

    ระหว่างที่คนขับกับ{name}ช่วยกันงัดล้อ ล่อหยุดเคี้ยว หูตั้ง

    เสียงมาก่อนตัว ลมเข้าออกหนักๆ ช้าๆ เหมือนมีคนชักสูบเตาอยู่หลังเนินเถ้า แล้วแสงแดงสี่จุดก็ขึ้นมาพ้นสันเนิน
  encounter:
    foe: ash_hound
    name: ฝูงหมาเถ้า
    beats:
      - text: หมาเถ้าลงจากเนินมาโดยไม่รีบ แยกเป็นสองข้างของเกวียน ไม่เห่า ไม่ขู่ จมูกย่นๆ ไล่ดมไปทางล่อก่อน
        moves:
          - id: hound_spear
            label: คว้าเหล็กงัดล้อ แทงตัวที่เข้ามาใกล้ล่อ
            kind: attack
            tags: [pierce]
          - id: hound_cart
            label: ปีนขึ้นไปยืนบนกองถ่าน ให้มันต้องกระโดดขึ้นมาหา
            kind: guard
          - id: hound_cut
            label: ตัดสายล่อให้มันวิ่งไปตามขบวน แล้วตะโกนเรียกยามหัวขบวน
            kind: quick
          - id: hound_plank
            label: ทิ้งเกวียน วิ่งไปตามแผ่นไม้ให้ทันขบวน
            kind: flee
      - text: ตัวหนึ่งกระโจนขึ้นท้ายเกวียน กรงเล็บขูดไม้ดังครืด ถ่านในอกมันสว่างจ้าตอนอ้าปาก
        answer: attack
        moves:
          - id: hound_gut
            label: แทงสวนเข้าใต้ซี่โครงตอนมันยังทรงตัวไม่ได้
            kind: attack
            tags: [pierce]
            success: ปลายเหล็กชนของแข็งและร้อนอยู่ในอกมัน {name}บิดข้อมือ ถ่านก้อนเท่ากำปั้นหลุดออกมากลิ้งไปบนกองถ่านในเกวียน หมาเถ้าทั้งตัวยุบลงเป็นเถ้าเหมือนใครเตะกองไฟ
          - id: hound_shove
            label: ถีบมันตกจากเกวียน
            kind: quick
          - id: hound_oil
            label: สาดน้ำมันตะเกียงใส่แล้วจุด
            kind: item
            stat: DEX
            tags: [fire]
            failure: ไฟลุกท่วมหลังมัน และมันไม่สะดุ้งเลย หมาเถ้าเดินฝ่าเปลวเข้ามาทั้งอย่างนั้น ขนที่ไม่มีก็ไม่ไหม้ มีแต่เสื้อของ{name}ที่ติดไฟตอนมันงับ
          - id: hound_plank2
            label: กระโดดลงอีกฝั่ง วิ่งไปทางขบวน
            kind: flee
      - text: ตัวที่เหลือถอยออกไปตั้งแถว ตัวหน้าสุดย่อขาหลัง เสียงปืนนัดแรกดังมาจากหัวขบวน ยังไกลอยู่
        answer: guard
        moves:
          - id: hound_hold
            label: ยืนขวางหน้าล่อ ตั้งเหล็กงัดรับ
            kind: guard
            tags: [pierce]
          - id: hound_strike
            label: ชิงเข้าไปแทงตัวหน้าสุดก่อน
            kind: quick
            tags: [pierce]
          - id: hound_yell
            label: ตะโกนบอกทิศให้ยามที่กำลังวิ่งมา
            kind: talk
          - id: hound_plank3
            label: วิ่งสวนไปหาเสียงปืน
            kind: flee
    win:
      text: |
        ฝูงที่เหลือถอยกลับขึ้นเนิน ตัวสุดท้ายยืนอยู่บนสันครู่หนึ่ง แสงในอกหรี่ลงสองครั้ง แล้วก็ไม่มีอะไรบนสันเนินอีก

        ยามหัวขบวนมาถึงตอนทุกอย่างจบแล้ว เขานับรอยไหม้บนแผ่นไม้ แล้วหักค่าคุ้มกันเที่ยวนี้ของตัวเองแบ่งให้{name}ครึ่งหนึ่ง
      effects: { gold: 4, reputation: { wardens: 1 } }
    lose:
      text: |
        ยามหัวขบวนมาถึงทันก่อนที่ฝูงจะลาก{name}ลงจากแผ่นไม้ ปืนดังสองนัด แล้วมีคนหิ้วปีกขึ้นไปโยนบนกองถ่าน

        ล่อไม่รอด เกวียนเล่มนั้นทิ้งไว้ตรงนั้นจนเช้า ค่าล่อหักจากคนขับ ไม่ได้หักจาก{name} แต่คนขับไม่พูดด้วยไปตลอดทาง
      effects: { flags: [hounds_dragged] }
    stalemate:
      text: |
        ยามจากหัวขบวนมาถึงพร้อมตะเกียงกับปืน ฝูงหมาเถ้าถอยออกไปนอกแสง เดินขนานไปกับขบวนอยู่ไกลๆ จนถึงประตูป้อม แล้วจึงหันกลับ

        ไม่มีใครในขบวนนอนหลับคืนนั้น
    flee:
      text: |
        {name}วิ่งทันท้ายขบวนตอนที่เสียงล่อร้องดังขึ้นข้างหลัง แล้วเงียบ

        เช้ามามีคนกลับไปดู เกวียนยังอยู่ ถ่านอยู่ครบ ล่อเหลือแต่สายบังเหียน คนขับรอดมาได้ และจำได้แม่นว่าใครวิ่งก่อน
      effects: { reputation: { wardens: -1 } }
    death:
      text: |
        ตัวที่ห้ามาจากทางขวา พวกมันชอบให้คนนับผิด น้ำหนักของมันกดลงบนอกของ{name} ร้อนทะลุเสื้อ

        แผ่นไม้ใต้หลังเย็น เถ้าที่ปลิวขึ้นมาตกลงบนหน้าเบาเหมือนหิมะ

- id: adult.enc_glass_one
  stage: adult
  weight: 10
  time: night
  when:
    age: [20, 55]
    location_tag: ventras
    not_traits: [curse_brand]
  text: |
    ตรอกหลังโรงกลั่นเป็นทางลัดที่คนย่านนี้เลิกใช้ตอนกลางคืนมาพักใหญ่ คืนนี้{name}รีบ

    กลางตรอกมีคนยืนอยู่ ผิวของเขาใสไปทั้งตัวเหมือนขวดยา ข้างในมีแสงฟ้าเต้นเป็นจังหวะตรงที่ควรเป็นหัวใจ เสื้อคนงานโรงกลั่นยังติดอยู่กับตัว ป้ายชื่อบนอกอ่านไม่ออกแล้ว

    "ฝนจะตกตอนเขาหามแกออกไป" คนแก้วพูด เสียงเหมือนเคาะแก้วเปล่า "แกจะไม่เปียก มีคนถือผ้าใบให้" แล้วเขาก็ยกมือสองข้างขึ้น เดินเข้ามา
  encounter:
    foe: glass_one
    beats:
      - text: คนแก้วเดินช้าแต่ไม่หยุด นิ้วทั้งสิบกางออก ทุกก้าวมีเสียงกริ๊กเบาๆ จากข้อเข่า เขายังพูดอยู่ เรื่องงานศพที่ยังไม่มีใครจัด
        moves:
          - id: glass_listen
            label: ยืนฟังเขาพูดให้จบ ถามว่าใครถือผ้าใบ
            kind: talk
            parley: true
          - id: glass_brick
            label: คว้าอิฐจากกองข้างผนัง ทุ่มใส่หัวไหล่
            kind: attack
            tags: [blunt]
            success: อิฐโดนไหล่ซ้าย เสียงเหมือนถ้วยตกพื้น รอยร้าวแตกแขนงลงไปถึงศอก แสงฟ้าข้างในรั่วออกมาตามรอยเป็นเส้นบางๆ คนแก้วหยุดเดิน ก้มมองแขนตัวเองเหมือนเพิ่งเห็นเป็นครั้งแรก
          - id: glass_pan
            label: เคาะฝาถังขยะกับผนังให้ดังก้องทั้งตรอก
            kind: talk
            tags: [noise]
          - id: glass_wall
            label: แนบหลังกับผนัง ปล่อยให้เขาเดินผ่าน
            kind: guard
          - id: glass_back
            label: ถอยออกจากตรอก ไปทางถนนใหญ่
            kind: flee
      - text: มือแก้วคว้าได้คอเสื้อ เย็นและเรียบ แรงบีบไม่ใช่แรงของคน มันเท่ากันทุกนิ้วเหมือนคีม หน้าของเขาเข้ามาใกล้จนเห็นแสงฟ้าเต้นอยู่หลังลูกตา
        answer: attack
        moves:
          - id: glass_elbow
            label: กระแทกศอกลงบนข้อมือเขา
            kind: attack
            tags: [blunt]
          - id: glass_slip
            label: ถอดเสื้อนอกทิ้งไว้ในมือเขา
            kind: quick
          - id: glass_name
            label: อ่านป้ายบนอกเขาเท่าที่อ่านออก เรียกชื่อนั้น
            kind: talk
            success: '"ฮาร์" {name}อ่านได้แค่นั้น คนแก้วชะงัก แรงบีบคลายลงครึ่งหนึ่ง "ฮาร์วิน" เขาพูดต่อให้เอง ช้าๆ เหมือนคนลองออกเสียงคำที่ไม่ได้ใช้นาน "กะดึก ถังสาม"'
          - id: glass_back2
            label: ดิ้นให้หลุด แล้ววิ่ง
            kind: flee
      - text: คนแก้วโยกตัว แสงข้างในเต้นถี่ขึ้น เขาพูดเร็วขึ้นด้วย ชื่อคน ชื่อถนน วันที่ที่ยังมาไม่ถึง มือสองข้างกวาดหาอะไรสักอย่างในอากาศ
        moves:
          - id: glass_bar
            label: ฟาดท่อนเหล็กข้างผนังเข้าที่หัวเข่า
            kind: attack
            tags: [blunt]
          - id: glass_duck
            label: มุดลอดใต้แขน ไปให้พ้นปากตรอก
            kind: quick
          - id: glass_bell
            label: ตีระฆังเตือนไฟที่แขวนอยู่หัวตรอก
            kind: talk
            tags: [noise]
          - id: glass_back3
            label: ถอยกลับไปทางที่มา
            kind: flee
    win:
      text: |
        คนแก้วถอยไปจนหลังชนผนังโรงกลั่น ยืนนิ่ง แสงข้างในเต้นช้าลงเท่าเดิม เขาเลิกพูดกลางประโยค แล้วเดินตะแคงเข้าไปในช่องประตูที่โดนตอกไม้ปิดไว้ครึ่งบาน

        {name}ออกจากตรอกได้ พอถึงถนนใหญ่จึงรู้ตัวว่ากำลังนึกถึงเรื่องผ้าใบ และไม่ชอบที่ตัวเองนึก
      effects: { stats: { STR: 1 }, flags: [met_glass_one] }
    lose:
      text: |
        คนกะดึกของโรงกลั่นเจอ{name}นอนอยู่กลางตรอกตอนเปลี่ยนเวร คอเสื้อขาด รอบคอมีรอยนิ้วสิบรอย เย็นกว่าผิวตรงอื่นไปอีกหลายวัน

        ไม่มีใครเห็นคนแก้ว คนกะดึกบอกว่าไม่เคยเห็น พูดเร็วไปหน่อยสำหรับคนที่ไม่เคยเห็น
      effects: { flags: [met_glass_one], reputation: { distillers: -1 } }
    stalemate:
      text: |
        ตะเกียงฟ้าหัวตรอกสว่างขึ้นตามเวลา คนแก้วหันไปหาแสงนั้นเหมือนมีคนเรียก แล้วเดินไปยืนใต้โคม เงยหน้า ไม่สนใจ{name}อีก

        {name}เดินอ้อมเขาไปชิดผนังอีกฝั่ง เขายังพูดอยู่ตอนที่เดินพ้นตรอก พูดกับตะเกียง
      effects: { flags: [met_glass_one] }
    flee:
      text: |
        {name}ออกมาถึงถนนใหญ่ที่มีคนเดิน หันกลับไปมอง ในตรอกมีแสงฟ้าจุดหนึ่งเต้นอยู่ ไม่ได้ตามออกมา

        ทางอ้อมไกลขึ้นสิบตรอก คืนนั้น{name}ถึงที่หมายช้า และไม่ได้บอกใครว่าเพราะอะไร
      effects: { flags: [met_glass_one] }
    parley:
      text: |
        "ลูกสาวคนขายถ่าน" คนแก้วตอบ "ตอนนี้ยังไม่เกิด" เขาพูดต่ออีกพักใหญ่ เรื่องสีของผ้าใบ เรื่องคนที่มาไม่ทัน {name}ฟังจนจบ ไม่ขัด

        พอไม่มีอะไรจะพูดแล้ว เขาก็ลดมือลง หลีกทางให้เหมือนคนสุภาพ {name}เดินผ่านไปได้ ทุกคำที่ได้ฟังยังอยู่ในหัว และไม่มีทางรู้ได้เลยว่าคำไหนจริง
      effects: { stats: { WIS: 1 }, flags: [met_glass_one, glass_prophecy_heard], world: { star: 1 } }
    death:
      text: |
        มือแก้วไม่คลายเลย คนแก้วยังพูดอยู่ตอนที่ขอบตาของ{name}เริ่มมืด เรื่องฝน เรื่องผ้าใบ

        เขาพูดถูกครึ่งเดียว ฝนตกจริง แต่ไม่มีใครถือผ้าใบให้

- id: adult.enc_walking_water
  stage: adult
  weight: 10
  time: night
  when:
    age: [22, 58]
    location_tag: ventras
  text: |
    โรงฟอกหนังท้ายคลองจ้างคนเทถังตอนดึก เพราะกลางวันมีคนของเมืองเดินตรวจ คืนนี้คนเทถังไม่มา เจ้าของโรงยื่นเหรียญให้{name}ที่บังเอิญเดินผ่าน ถังเดียว เทแล้วก็ไป

    คนแก่ริมน้ำสอนกันมาว่าไม่เทของเสียลงน้ำตอนกลางคืน ไม่มีใครจำได้แล้วว่าทำไม

    น้ำในคลองรับของในถังไว้เงียบๆ แล้วน้ำก็ลุกขึ้นยืน อ้วน เตี้ย สูงแค่อกคน ในตัวมันมีของลอยอยู่ เศษหนัง ขวดแตก รองเท้าข้างเดียว มันก้าวขึ้นมาบนตลิ่ง
  encounter:
    foe: walking_water
    beats:
      - text: น้ำเดินยื่นแขนออกมา ปลายแขนมีของที่{name}เพิ่งเทลงไปเมื่อครู่ ครบทุกชิ้น มันกำลังเอามาคืน และไม่ได้ตั้งใจจะวางเบาๆ
        moves:
          - id: water_coin
            label: โยนเหรียญที่เพิ่งได้ลงคลอง กล่าวขอโทษแม่น้ำเสียงดัง
            kind: talk
            success: เหรียญตกน้ำเสียงดังจ๋อม น้ำเดินหยุด ของที่ลอยอยู่ในตัวมันหมุนช้าลง มันเอียงตัวไปทางเสียงเหรียญ เหมือนคนแก่เงี่ยหูฟังว่าเด็กพูดว่าอะไร
          - id: water_recall
            label: นึกให้ออกว่าคนเรือทำอะไรกันทุกต้นปี
            kind: read
            stat: WIS
            success: คนเรือโยนเหรียญแรกของปีลงน้ำ และพูดกับน้ำเหมือนพูดกับเจ้าหนี้ที่ใจดี น้ำไม่ได้อยากได้เงิน มันอยากให้มีคนบอกว่ารู้ตัวว่าติดค้าง ของที่มันถืออยู่คือใบทวง
          - id: water_pole
            label: คว้าไม้ถ่อฟาดให้มันแตกกระจาย
            kind: attack
            tags: [blunt]
            failure: ไม้ถ่อผ่านตัวมันไปเหมือนฟาดคลอง น้ำกระจายแล้วรวมกลับในอึดใจเดียว ทีนี้ไม้ถ่อก็เข้าไปลอยอยู่ในตัวมันด้วย พร้อมกับ{name}ครึ่งแขน ขวดแตกในนั้นบาดลึก
          - id: water_take
            label: ยืนรับของที่มันโยนคืนไว้ทั้งหมด
            kind: guard
          - id: water_run
            label: วิ่งขึ้นถนน ไปให้ไกลจากคลอง
            kind: flee
      - text: น้ำเดินโป่งขึ้นจนสูงเท่าคน ของในตัวมันเพิ่มขึ้นเรื่อยๆ ของเก่ากว่าของคืนนี้มาก ล้อเกวียนหัก ถังไม้ผุ กระดูกสัตว์ ทั้งหมดหมุนเร็วขึ้น
        answer: talk
        moves:
          - id: water_promise
            label: บอกมันว่าจะขนของพวกนี้ไปทิ้งบนบกเอง ทุกชิ้น คืนนี้
            kind: talk
          - id: water_bucket
            label: คว่ำถังครอบหัวตัวเอง หมอบลงหลังเสาท่า
            kind: guard
          - id: water_dodge
            label: หลบของที่มันเหวี่ยงออกมาทีละชิ้น
            kind: quick
          - id: water_run2
            label: ปีนข้ามรั้วโรงฟอกหนังหนีไป
            kind: flee
      - text: มันหันไปทางโรงฟอกหนัง ที่ประตูหลังโรงมีถังอีกสิบสองใบตั้งรออยู่ น้ำเดินเริ่มไหลไปทางนั้น ทิ้งรอยเปียกกว้างเท่าเกวียน
        moves:
          - id: water_kick
            label: ถีบถังทั้งแถวให้ล้มเข้าไปในโรง ไม่ให้ลงคลองสักใบ
            kind: attack
          - id: water_owner
            label: ตะโกนเรียกเจ้าของโรงออกมาดูสิ่งที่ตัวเองจ้าง
            kind: talk
            tags: [noise]
          - id: water_stand
            label: ไปยืนขวางระหว่างมันกับประตู กางแขน
            kind: guard
          - id: water_run3
            label: ปล่อยให้เป็นเรื่องของโรงฟอกหนัง
            kind: flee
      - text: น้ำเดินหยุดอยู่หน้าประตูโรงฟอกหนัง สูงขึ้นจนถึงชายคา ของทุกชิ้นในตัวมันหยุดหมุน คลองข้างหลังเงียบไปทั้งสาย เหมือนรอฟังว่าใครจะพูดอะไร
        answer: talk
        moves:
          - id: water_vow
            label: บอกมันเสียงดังว่าคลองช่วงนี้จะไม่มีใครเทอะไรลงตอนกลางคืนอีก และจะมาเฝ้าเอง
            kind: talk
          - id: water_haul
            label: เริ่มขนของกองแรกขึ้นจากตลิ่งให้มันเห็น ทีละชิ้น ไม่หยุดมือ
            kind: guard
          - id: water_sluice
            label: วิ่งไปปิดรางน้ำทิ้งของโรงฟอกหนังก่อนมันไหลเข้าไป
            kind: quick
          - id: water_run4
            label: ถอยขึ้นถนนไปเงียบๆ
            kind: flee
    win:
      text: |
        น้ำเดินยุบลงช้าๆ เหมือนคนนั่ง ของทั้งหมดในตัวมันกองอยู่บนตลิ่งเป็นแถว เรียงจากเก่าไปใหม่ แล้วน้ำก็ไหลกลับลงคลองไปเฉยๆ ผิวคลองเรียบเหมือนไม่เคยมีอะไร

        {name}ขนของกองนั้นไปทิ้งที่ลานขยะของเมืองจนเกือบสาง ไม่มีใครจ้าง เช้ามาคนเรือที่ผ่านคลองช่วงนั้นบอกว่าน้ำวันนี้ไม่มีกลิ่น
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [calmed_walking_water] }
    lose:
      text: |
        {name}จำได้ว่าน้ำเย็นและหนัก จำได้ว่ามีรองเท้าข้างเดียวลอยผ่านหน้า แล้วก็ไอเอาน้ำคลองออกมาอยู่บนตลิ่ง มีคนเรือสองคนช่วยกันตบหลัง

        คนเรือไม่ถามว่าเกิดอะไรขึ้น ถามแค่ว่าเทอะไรลงไป พอได้คำตอบก็เดินกลับเรือโดยไม่ช่วยพยุง
      effects: { reputation: { dock_rats: -1 } }
    stalemate:
      text: |
        ฟ้าเริ่มสาง น้ำเดินชะงักเหมือนคนนึกได้ว่ามีธุระ มันทิ้งของทั้งหมดกองไว้หน้าประตูโรงฟอกหนัง สูงท่วมลูกบิด แล้วไหลกลับลงคลอง

        เจ้าของโรงต้องจ้างคนขนสามวัน และขึ้นค่าแรงคนเทถังเป็นสองเท่า เพราะไม่มีใครรับ
    flee:
      text: |
        {name}ไปถึงถนนที่สูงกว่าคลองสามช่วงตึกจึงหยุดวิ่ง ข้างหลังมีเสียงของหนักๆ กระแทกประตูไม้ซ้ำๆ แล้วก็เสียงคนร้อง

        เหรียญที่ได้มายังอยู่ในกระเป๋า ทั้งคืน{name}รู้สึกว่ามันเปียก
      effects: { alignment: { moral: -1 } }
    death:
      text: |
        น้ำปิดเข้ามาเหนือหัว ข้างในนั้นเงียบกว่าที่คิด ของทุกชิ้นที่เมืองนี้เคยทิ้งลอยผ่านหน้าไปช้าๆ

        ชิ้นสุดท้ายที่{name}เห็นคือถังใบที่ตัวเองเพิ่งเท

- id: adult.enc_nameless_ghost
  stage: adult
  weight: 10
  scene: mine
  when:
    age: [20, 60]
    location_tag: hordun
  text: |
    อุโมงค์สายเก่ามีผนังด้านหนึ่งสลักชื่อคนของตระกูลไว้ตั้งแต่พื้นถึงเพดาน ชื่อละช่อง คนที่ผ่านไปมาเอามือแตะช่องของปู่ย่าตัวเองจนหินตรงนั้นมัน

    วันนี้มีคนยืนอยู่หน้าผนัง ตัวเท่าคนแคระ ซีดจนมองทะลุเห็นรอยสิ่วข้างหลัง นิ้วของเขาไล่ไปตามชื่อทีละช่อง ทีละแถว ปากขมุบขมิบตาม พอถึงช่องที่โดนสกัดจนเรียบ นิ้วนั้นหยุด

    เขาหันมา "อันไหนของข้า" แล้วมือเย็นๆ ก็คว้าข้อมือของ{name}ไว้
  encounter:
    foe: nameless_ghost
    morale: 2
    beats:
      - text: ผีไร้ชื่อลากมือของ{name}ไปแตะผนัง ช่องแล้วช่องเล่า เขาถามคำเดิมทุกช่อง ความเย็นไต่จากข้อมือขึ้นมาถึงศอก
        moves:
          - id: name_read
            label: อ่านชื่อบนผนังออกเสียงให้เขาฟังทีละชื่อ
            kind: talk
            tags: [name]
            success: "{name}อ่านไปได้สิบสองชื่อ เขาส่ายหน้าทุกชื่อ แต่มือที่จับอยู่คลายลงทุกครั้งที่ได้ยินเสียงคนอ่าน เหมือนคนที่ไม่ได้ยินใครเรียกชื่ออะไรเลยมานานเกินไป"
          - id: name_gap
            label: ดูช่องที่โดนสกัด หาว่ายังเหลือรอยอักษรตรงขอบไหม
            kind: read
            stat: INT
            success: ตรงมุมล่างของช่องเรียบยังเหลือหางของอักษรตัวสุดท้าย กับรอยสิ่วที่ลึกกว่าช่องอื่น คนที่สกัดชื่อนี้ออกทำด้วยความโกรธ ผีตนนี้ไม่ได้ต้องการทำร้ายใคร เขาต้องการให้มีคนเรียก
          - id: name_pull
            label: กระชากมือออก
            kind: quick
          - id: name_hammer
            label: เหวี่ยงค้อนใส่เขา
            kind: attack
            tags: [blunt]
            failure: ค้อนผ่านตัวเขาไปชนผนัง สะเก็ดหินกระเด็นออกจากชื่อของใครสักคน ผีไร้ชื่อร้องออกมาเป็นครั้งแรก เสียงเหมือนลมลอดรอยแตก มือของเขากำแน่นขึ้นจนแขนของ{name}ชาไปทั้งท่อน
          - id: name_leave
            label: สะบัดให้หลุด เดินกลับไปทางปากอุโมงค์
            kind: flee
      - text: เขาปล่อยข้อมือ แต่ยืนขวางทางไว้ มือสองข้างยกขึ้นมาคลำหน้าของ{name} คลำคิ้ว จมูก คาง เหมือนช่างหาแบบ "หน้าแบบนี้ ตระกูลไหน"
        answer: talk
        moves:
          - id: name_clan
            label: บอกชื่อตระกูลตัวเอง แล้วบอกชื่อตระกูลอื่นทุกตระกูลที่รู้จัก
            kind: talk
            tags: [name]
          - id: name_vow
            label: รับปากว่าจะไปถามสภาตระกูลให้ ว่าช่องนั้นเคยเป็นชื่อใคร
            kind: talk
            parley: true
          - id: name_still
            label: ยืนนิ่ง ให้เขาคลำจนพอใจ
            kind: guard
          - id: name_leave2
            label: ก้มหลบมือ วิ่งผ่านเขาไป
            kind: flee
      - text: ผีไร้ชื่อหันกลับไปที่ผนัง เล็บขูดหินตรงช่องเรียบ ขูดแรงขึ้นเรื่อยๆ ฝุ่นหินร่วงลงมา ค้ำยันเหนือหัวลั่นเสียงหนึ่ง
        moves:
          - id: name_give
            label: เรียกเขาด้วยชื่อที่ตั้งให้เดี๋ยวนั้น ชื่ออะไรก็ได้ที่ฟังเป็นคนแคระ
            kind: talk
            tags: [name]
            success: เล็บหยุดขูด เขาทวนชื่อนั้นช้าๆ สองครั้ง ไม่ใช่ชื่อของเขา ทั้งคู่รู้ แต่เขาพยักหน้ารับไว้เหมือนคนรับเสื้อที่ไม่พอดีตัวในวันที่หนาว
          - id: name_brace
            label: วิ่งไปค้ำไม้ยันที่ลั่นไว้ก่อน
            kind: guard
          - id: name_drag
            label: ดึงเขาออกห่างจากผนัง
            kind: attack
          - id: name_leave3
            label: ออกจากอุโมงค์ก่อนเพดานจะลง
            kind: flee
    win:
      text: |
        ผีไร้ชื่อถอยออกจากผนัง จางลงจนเหลือแค่ความเย็นวูบหนึ่งที่ผ่านไหล่ของ{name}ไปทางอุโมงค์ลึก นิ้วของเขาทิ้งรอยน้ำค้างแข็งไว้บนช่องเรียบ เป็นเส้นห้าเส้น

        คนเฝ้าอุโมงค์ที่ได้ฟังเรื่องตอนเย็นเงียบไปนาน แล้วบอกว่าช่องนั้นโดนสกัดก่อนแกเกิด และพ่อของแกสั่งไว้ว่าอย่าถาม
      effects: { stats: { CHA: 1 }, flags: [faced_nameless_ghost] }
    lose:
      text: |
        คนกะเช้าเจอ{name}นั่งอยู่หน้าผนังชื่อ ตัวเย็นเฉียบ ปากขมุบขมิบอ่านชื่อทีละช่องโดยไม่ออกเสียง ต้องเขย่าสามทีกว่าจะหันมา

        ตอนโดนถามชื่อตัวเอง{name}ตอบช้ากว่าที่ควรไปหนึ่งอึดใจ ทุกคนในกะเห็น
      effects: { flags: [faced_nameless_ghost] }
    stalemate:
      text: |
        เสียงระฆังเปลี่ยนกะดังมาตามอุโมงค์ ผีไร้ชื่อเงยหน้าฟัง เหมือนยังจำได้ว่าเสียงนั้นแปลว่าต้องไปที่ไหน แล้วเดินทะลุผนังหายไปตรงช่องเรียบ

        {name}ออกมาทันแถวรับค่าแรง มือข้างที่โดนจับยังกำเหรียญไม่ถนัดไปจนค่ำ
      effects: { flags: [faced_nameless_ghost] }
    flee:
      text: |
        {name}ออกมาถึงปากอุโมงค์ ข้างหลังยังมีเสียงถามคำเดิมไล่มา เบาลงทีละช่วง อันไหนของข้า อันไหนของข้า

        ตั้งแต่วันนั้น{name}เดินอ้อมไปใช้อุโมงค์สายใหม่ ไกลกว่าเดิมหนึ่งร้อยก้าว
      effects: { flags: [faced_nameless_ghost] }
    parley:
      text: |
        ผีไร้ชื่อมองหน้า{name}นาน แล้วปล่อยมือ "ข้าจะรอตรงนี้" เขาว่า และกลับไปยืนหน้าช่องเรียบ ไม่ขูด ไม่ถามใครอีก

        ตลอดทางกลับ{name}นึกรายชื่อคนแก่ในสภาที่อายุมากพอจะจำช่องนั้นได้ นับได้สามคน สองในสามไม่ชอบให้ใครถามเรื่องเก่า
      effects: { stats: { WIS: 1 }, flags: [faced_nameless_ghost, promised_nameless_ghost] }

- id: adult.enc_waking_stone
  stage: adult
  weight: 10
  scene: mine
  when:
    age: [20, 58]
    location_tag: hordun
  text: |
    บริษัทจากอาร์เวลเช่าอุโมงค์สายตะวันตกไว้เจาะทางใหม่ หัวหน้างานของบริษัทจ่ายค่าแรงสองเท่าให้คนที่เจาะเร็ว และไม่ยอมเสียเวลากับธรรมเนียมที่เขาเรียกว่าเรื่องของคนแก่

    คนแคระทุกคนเคาะหินสามครั้งก่อนลงเหล็ก วันนี้ไม่มีใครเคาะ

    {name}เดินผ่านปากทางใหม่ตอนที่ผนังด้านในขยับ หินกับดินก่อตัวขึ้นเป็นไหล่ เป็นแขนสองข้าง เป็นหัวที่ไม่มีหน้า คนงานของบริษัทวิ่งสวนออกมา ทิ้งคนหนึ่งไว้ข้างในที่ขาติดอยู่ใต้รถราง
  encounter:
    foe: waking_stone
    morale: 3
    beats:
      - text: หินตื่นยืนเต็มความสูง หัวครูดเพดาน มันชูกำปั้นขวาขึ้นช้าๆ ค้างไว้เหนือรถรางที่ทับขาคนงานอยู่
        answer: quick
        moves:
          - id: stone_drag
            label: พุ่งเข้าไปลากคนงานออกมาก่อนกำปั้นจะลง
            kind: quick
            success: "{name}คว้าใต้รักแร้คนงานแล้วดึงสุดตัว ขาของเขาหลุดออกมาพร้อมรองเท้าที่เหลือครึ่งเดียว กำปั้นหินลงบนรถรางในอึดใจถัดมา เหล็กทั้งคันแบนเหมือนกระดาษ"
          - id: stone_prop
            label: ยัดไม้ค้ำเข้าไปขวางใต้กำปั้น
            kind: guard
          - id: stone_pick
            label: ฟันอีเต้อเข้าที่ข้อเข่าหิน
            kind: attack
            tags: [pierce]
          - id: stone_out
            label: วิ่งออกไปกับคนอื่น
            kind: flee
      - text: มันหันมาทางปากอุโมงค์ ทุกก้าวทำให้ฝุ่นร่วงจากเพดาน กำปั้นซ้ายเริ่มยกขึ้น ช้าเหมือนเดิม มันชูก่อนทุบเสมอ
        answer: quick
        moves:
          - id: stone_knock
            label: คว้าค้อน เคาะผนังสามครั้งให้ดังชัด แบบที่ควรทำตั้งแต่แรก
            kind: quick
            success: เคาะครั้งที่หนึ่ง กำปั้นหยุดกลางอากาศ ครั้งที่สอง ฝุ่นเลิกร่วง ครั้งที่สาม หัวที่ไม่มีหน้าหันมาทางเสียง นิ่งอยู่นานเหมือนคนแก่ที่มีคนเพิ่งนึกได้ว่าต้องไหว้
          - id: stone_roll
            label: กลิ้งหลบเข้าไปหลังเสาค้ำ
            kind: quick
          - id: stone_recall
            label: นึกให้ออกว่ายายสอนว่าต้องทำอย่างไรเมื่อหินโกรธ
            kind: read
            stat: WIS
            success: ยายไม่เคยสอนให้สู้ ยายสอนว่าหินช้า หินชูมือก่อนเสมอ คนที่ตายคือคนที่ยืนดู และยายสอนให้เคาะ ไม่ใช่เคาะขออนุญาต เคาะบอกให้รู้ว่ามีคนอยู่ตรงนี้
          - id: stone_out2
            label: หันหลังวิ่ง
            kind: flee
      - text: เสาค้ำต้นแรกหักเพราะไหล่มันเบียด เพดานช่วงนั้นทรุดลงมาหนึ่งคืบ หินตื่นไม่ได้สนใจ มันยกกำปั้นทั้งสองข้างขึ้นพร้อมกัน
        answer: quick
        moves:
          - id: stone_between
            label: วิ่งลอดหว่างขามันไปอีกฝั่ง ให้มันทุบพื้นเปล่า
            kind: quick
          - id: stone_brace
            label: ดันเสาค้ำสำรองขึ้นรับเพดาน
            kind: guard
          - id: stone_shout
            label: ตะโกนขอโทษแทนคนที่ไม่ได้เคาะ
            kind: talk
          - id: stone_out3
            label: ลากคนเจ็บออกไปให้พ้นปากอุโมงค์
            kind: flee
      - text: ฝุ่นหนาจนตะเกียงเหลือแค่วงสีส้ม หินตื่นยืนอยู่กลางวงนั้น กำปั้นค้างอยู่ครึ่งทาง เหมือนลังเล หรือเหมือนเหนื่อย
        moves:
          - id: stone_knock2
            label: วางค้อนลง เอาฝ่ามือเคาะหินตรงเท้ามันสามครั้ง
            kind: quick
          - id: stone_wait
            label: นั่งลงตรงนั้น ไม่ขยับ รอ
            kind: guard
          - id: stone_wedge
            label: ตอกลิ่มเข้ารอยแยกที่เอวมัน
            kind: attack
            tags: [pierce]
          - id: stone_out4
            label: ถอยออกมาทีละก้าว
            kind: flee
    win:
      text: |
        หินตื่นลดแขนลง นั่ง แล้วก็เป็นแค่กองหินกับดินกองหนึ่งที่ขวางอุโมงค์อยู่ครึ่งทาง ฝุ่นค่อยๆ ลงมาเกาะบนมัน

        สภาตระกูลสั่งปิดทางใหม่ในเย็นวันนั้น หัวหน้างานจากอาร์เวลโวยว่าเป็นแค่หินถล่ม ไม่มีคนแคระคนไหนเถียง ไม่มีคนไหนกลับไปเจาะให้เขาด้วย
      effects: { stats: { DEX: 1 }, reputation: { dwarf_council: 1 }, flags: [calmed_waking_stone] }
    lose:
      text: |
        คนของตระกูลขุด{name}ออกมาจากใต้เศษไม้ค้ำตอนค่ำ ยังหายใจ ซี่โครงร้าวสองซี่ ทางใหม่ทั้งสายถล่มปิดไปแล้ว

        หัวหน้างานของบริษัทส่งเงินค่าทำขวัญมาให้ถุงหนึ่ง คนที่เอามาส่งวางไว้หน้าประตูแล้วรีบเดินกลับ
      effects: { gold: 5, flags: [stone_buried] }
    stalemate:
      text: |
        เพดานทรุดลงมาปิดระหว่างทั้งสองฝ่าย เสียงทุบจากอีกฟากดังอยู่อีกสามครั้ง ห่างกันครั้งละนาน แล้วเงียบ

        คนแคระที่มามุงฟังผนังอยู่จนค่ำ ก่อนกลับทุกคนเคาะหินตรงนั้นคนละสามครั้ง หัวหน้างานจากอาร์เวลยืนดู ไม่พูดเรื่องคนแก่อีก
      effects: { reputation: { dwarf_council: 1 } }
    flee:
      text: |
        {name}ออกมาถึงอุโมงค์สายหลักพร้อมฝุ่นที่พุ่งตามหลัง ทางใหม่ถล่มปิดไปทั้งสาย คนงานที่ขาติดอยู่ข้างในไม่มีใครได้เห็นอีก

        บริษัทจ่ายค่าทำขวัญให้เมียของเขาตามสัญญา ครบทุกเหรียญ
      effects: { flags: [left_stone_tunnel] }
    death:
      text: |
        กำปั้นหินชูขึ้นช้าๆ เหมือนทุกครั้ง {name}เห็นมันชู เห็นทั้งหมด ขาแค่ไม่ไปไหน

        ภูเขาทั้งลูกลงมาพร้อมกัน

- id: adult.enc_old_wood
  stage: adult
  weight: 10
  when:
    age: [20, 58]
    location_tag: ileth
  text: |
    ค่ายตัดไม้ของอู่เรือเหาะรุกเข้ามาถึงชายป่าด้านนี้เมื่อต้นฤดู หลังค่ายมีลานตอไม้กว้างกว่าลานตลาด ตอทุกตอยังมียางซึม คนชายป่าไม่มีใครรับจ้างโค่น แต่มีคนรับจ้างส่งเสบียง วันนี้เป็นเวรของ{name}

    ตอนบ่าย พื้นค่ายสั่นเป็นจังหวะ ช้า ห่างกันครั้งละหลายอึดใจ คนตัดไม้คิดว่าเป็นเกวียนซุง จนต้นไม้ต้นหนึ่งที่ขอบป่าขยับออกมาจากแถว

    มันเดินด้วยราก รากแต่ละเส้นถอนขึ้นจากดินแล้วปักลงใหม่ เปลือกแตกเป็นร่องลึกเท่าฝ่ามือ มันมุ่งหน้ามาทางลานตอไม้ และระหว่างมันกับลานมีกระโจมคนงานเรียงอยู่สิบสองหลัง
  encounter:
    foe: old_wood
    morale: 3
    beats:
      - text: ไม้เฒ่าก้าวอีกก้าว รากเส้นหนึ่งปักลงกลางกองขวาน หัวหน้าคนตัดไม้ตะโกนสั่งให้เอาเลื่อยมา ในกระโจมหลังแรกยังมีคนกะกลางคืนนอนอยู่
        moves:
          - id: wood_path
            label: ดูให้ออกว่ามันจะเดินไปที่ไหน และผ่านอะไรบ้าง
            kind: read
            stat: WIS
            success: มันไม่ได้มองคน ไม่ได้มองกระโจม ทุกก้าวของมันเล็งไปที่ตอไม้ตอในสุดของลาน ตอที่ใหญ่ที่สุด ที่เพิ่งโค่นเมื่อวาน มันจะเดินเป็นเส้นตรง และของทุกอย่างบนเส้นนั้นคือของที่ขวางทาง
          - id: wood_wake
            label: วิ่งไปกระชากเชือกกระโจม ปลุกคนกะกลางคืนออกมา
            kind: quick
          - id: wood_torch
            label: คว้าคบไฟจากเตาต้มยาง ชูขวางหน้ามัน
            kind: item
            stat: CON
            tags: [fire]
          - id: wood_axe
            label: คว้าขวานฟันรากเส้นที่ใกล้ที่สุด
            kind: attack
            tags: [edge]
          - id: wood_away
            label: ทิ้งเกวียนเสบียง เดินออกจากค่าย
            kind: flee
      - text: รากเส้นใหญ่ยกขึ้นสูงเหนือกระโจมหลังที่สอง ดินร่วงจากรากลงบนผ้าใบเสียงเหมือนฝน มันค้างอยู่อย่างนั้นก่อนจะปักลง
        answer: quick
        moves:
          - id: wood_pull
            label: ลากคนในกระโจมออกมาทั้งที่นอน
            kind: quick
            success: "{name}คว้าขอบฟูกฟางลากออกมาทั้งผืน คนบนฟูกตื่นมาด่าได้ครึ่งคำ รากไม้ก็ปักลงตรงที่หัวเขาเคยอยู่ ลึกจนเสากระโจมหายลงไปในดิน"
          - id: wood_prop
            label: เอาซุงท่อนสั้นค้ำรับรากไว้
            kind: guard
          - id: wood_shot
            label: ยิงหน้าไม้ของยามค่ายใส่ลำต้น
            kind: attack
            tags: [ranged, pierce]
            failure: ลูกหน้าไม้ปักเข้าเปลือกแล้วก็อยู่ตรงนั้น เหมือนปักต้นไม้ธรรมดา ไม้เฒ่าไม่ชะงักเลย รากที่ค้างอยู่ฟาดลงมาเฉียดไหล่ของ{name} แค่เฉียดก็พอให้ลอยไปชนกองซุง
          - id: wood_away2
            label: วิ่งออกไปทางถนนเกวียน
            kind: flee
      - text: หัวหน้าคนตัดไม้ราดน้ำมันยางลงบนพื้นเป็นแนว มือถือคบไฟ ไม้เฒ่าก้าวมาถึงขอบแนวนั้นแล้วหยุด ใบบนยอดสั่นทั้งต้นทั้งที่ไม่มีลม
        moves:
          - id: wood_burn
            label: ช่วยเขาจุดแนวไฟ
            kind: item
            stat: DEX
            tags: [fire]
          - id: wood_clear
            label: ลากกระโจมกับเกวียนออกจากเส้นทางของมัน เปิดทางให้ถึงลานตอ
            kind: quick
          - id: wood_stop
            label: แย่งคบไฟจากมือหัวหน้า บอกว่าไฟในป่านี้ไม่มีใครดับได้
            kind: talk
          - id: wood_away3
            label: ถอยออกไปก่อนที่ไฟหรือรากจะมาถึง
            kind: flee
      - text: มันอยู่ห่างตอไม้ใหญ่อีกสิบก้าว รากเดินช้าลง ลำต้นเอนไปข้างหน้าเหมือนคนแก่ที่เห็นประตูบ้าน คนตัดไม้สามคนยืนถือเลื่อยขวางอยู่ ไม่มีใครแน่ใจว่าจะทำอะไร
        answer: talk
        moves:
          - id: wood_aside
            label: ตะโกนบอกสามคนนั้นให้หลีก ให้มันไปถึงตอ
            kind: talk
            success: สามคนนั้นมองหน้ากัน แล้วถอยออกไปคนละทาง ไม้เฒ่าเดินผ่านกลางระหว่างพวกเขา ใกล้จนใบล่างสุดกวาดหมวกคนหนึ่งตก มันไม่ได้หันมา
          - id: wood_last
            label: ยืนขวางเองอีกคน
            kind: guard
          - id: wood_fire4
            label: โยนคบไฟใส่โคนมัน
            kind: item
            stat: DEX
            tags: [fire]
          - id: wood_away4
            label: หันหลังเดินกลับหมู่บ้าน
            kind: flee
    win:
      text: |
        ไม้เฒ่าหยุดเดิน รากทุกเส้นปักลงดินพร้อมกันแล้วไม่ถอนขึ้นอีก ใบบนยอดเลิกสั่น พอถึงเย็นมันก็เป็นแค่ต้นไม้ต้นหนึ่งที่ยืนอยู่ในที่ที่เมื่อเช้าไม่มีต้นไม้

        ค่ายตัดไม้ย้ายออกไปตั้งที่อื่นภายในเจ็ดวัน คนงานไม่ยอมนอนใกล้ต้นนั้น เอลฟ์สองคนลงมาจากกิ่งมาดู ยืนอยู่นาน ก่อนกลับคนหนึ่งพยักหน้าให้{name}ครั้งเดียว
      effects: { stats: { WIS: 1 }, reputation: { star_hall: 1 }, flags: [old_wood_stilled] }
    lose:
      text: |
        {name}ฟื้นขึ้นมาใต้ผ้าใบกระโจมที่ล้มทับ มีคนกำลังยกซุงออกจากขา ค่ายครึ่งหนึ่งราบ ไม้เฒ่ายืนอยู่กลางลานตอ นิ่งแล้ว

        หมอของค่ายเข้าเฝือกให้โดยไม่คิดเงิน บอกว่าคนส่งเสบียงไม่ควรต้องมาเจ็บแทนคนโค่น
      effects: { flags: [old_wood_crushed] }
    stalemate:
      text: |
        ไม้เฒ่าไปถึงตอไม้ใหญ่ตอนตะวันตก ยืนค้ำอยู่เหนือตอนั้นทั้งคืน เช้ามารากของมันลงดินไปแล้ว พันรอบตอไว้เหมือนมือกำ

        ค่ายเสียกระโจมไปเจ็ดหลัง ไม่มีใครตาย หัวหน้าคนตัดไม้เขียนรายงานถึงอู่ว่าพายุ
    flee:
      text: |
        {name}เดินกลับถึงหมู่บ้านตอนค่ำ เสียงไม้หักกับเสียงคนตะโกนไล่หลังมาครึ่งทาง แล้วเงียบ

        เสบียงเที่ยวนั้นไม่ได้ค่าจ้าง และค่ายไม่จ้างคนจากหมู่บ้านนี้อีก ซึ่งคนแก่ในหมู่บ้านบอกว่าดีแล้ว
      effects: { gold: -2 }
    death:
      text: |
        รากเส้นนั้นไม่ได้เล็ง{name} มันแค่ปักลงตรงที่มันจะปัก และ{name}อยู่ตรงนั้น

        ดินชื้น กลิ่นยางไม้ เหนือขึ้นไปใบไม้ยังสั่นอยู่ทั้งต้น

- id: adult.enc_earth_calf
  stage: adult
  weight: 10
  when:
    age: [20, 58]
    location_tag: arvel_village
  text: |
    เพื่อนบ้านเช่าคันไถไอน้ำมาจากเมืองเป็นปีแรก มันไถได้วันละเท่ากับวัวหกคู่ และคนขับจากเมืองไม่รู้ว่าทำไมแปลงนี้ถึงมีเนินเตี้ยๆ ที่ทุกรอยไถเก่าอ้อมผ่าน เขาไถตรงข้ามไปเลย

    รุ่งเช้า เนินนั้นลุกขึ้น ดินร่วงออกจากหลังของมันเป็นแผ่น ข้างใต้เป็นขนฟูสีฟาง ตัวมันใหญ่เท่าเกวียนบรรทุกข้าว หน้าเป็นหน้าลูกวัว ตาปิดอยู่ครึ่งหนึ่งเหมือนยังไม่ตื่นดี

    มันหันหัวไปตามรอยไถใหม่ แล้วเริ่มเดินทวนกลับ รอยนั้นตัดผ่านรั้วของ{name} แปลงกล้า และมุมยุ้งข้าว
  encounter:
    foe: earth_calf
    morale: 3
    beats:
      - text: ลูกวัวใต้ทุ่งเดินช้าเท่าคนแก่ แต่ไม่เบี่ยงเลยสักนิ้ว เสารั้วต้นแรกของเพื่อนบ้านล้มไปใต้อกมันเหมือนต้นหญ้า
        moves:
          - id: calf_line
            label: วิ่งไปดูรอยไถ ว่ามันจะพาผ่านอะไรบ้างกว่าจะสุดแปลง
            kind: read
            stat: INT
            success: รอยไถตรงเป็นเส้นเดียว ผ่านรั้วสองแนว แปลงกล้า แล้วเฉียดมุมยุ้งไปสองศอก ถ้าเปิดประตูรั้วทั้งสองบานกับย้ายเกวียนที่จอดขวาง มันจะผ่านไปได้โดยไม่ต้องพังอะไรนอกจากกล้าหนึ่งแถว
          - id: calf_gate
            label: วิ่งไปเปิดประตูรั้วก่อนมันถึง
            kind: quick
          - id: calf_stand
            label: ยืนกางแขนขวางหน้ามัน
            kind: guard
            failure: มันไม่ได้ชน มันแค่เดินต่อ อกที่นุ่มเหมือนกองฟางดัน{name}ถอยหลังไปสิบก้าวก่อนที่ขาจะพันกัน แล้วกีบข้างหนึ่งก็เหยียบลงข้างตัว ใกล้พอให้ซี่โครงรู้ว่ามันหนักเท่าไร
          - id: calf_hoe
            label: เอาจอบฟาดจมูกมัน
            kind: attack
            tags: [blunt]
          - id: calf_house
            label: กลับเข้าบ้าน ปิดประตู
            kind: flee
      - text: มันมาถึงรั้วของ{name} หยุดหายใจเข้าครั้งหนึ่ง ลมจากจมูกมันพัดฟางบนลานปลิวเป็นวง กีบหน้ายกขึ้น
        answer: quick
        moves:
          - id: calf_cart
            label: ลากเกวียนที่จอดขวางรอยไถออกให้พ้น
            kind: quick
          - id: calf_rope
            label: คล้องเชือกที่คอมัน ผูกกับเสายุ้ง
            kind: attack
          - id: calf_lead
            label: ถือกำหญ้าแห้งเดินนำหน้า ให้มันเดินตามรอยโดยไม่แวะ
            kind: read
            stat: WIS
          - id: calf_house2
            label: ปล่อยรั้วไว้ ถอยไปยืนดูจากชานบ้าน
            kind: flee
      - text: มุมยุ้งข้าวอยู่ห่างจากไหล่มันสองศอก ข้างในมีข้าวทั้งปี ลูกวัวใต้ทุ่งเอียงหัวนิดหนึ่ง เหมือนได้กลิ่น
        moves:
          - id: calf_sheaf
            label: วางรวงข้าวฟ่อนสุดท้ายของปีไว้บนรอยไถข้างหน้ามัน
            kind: read
            stat: WIS
            success: คนแก่สอนให้เว้นรวงสุดท้ายไว้ในนา ปีนี้{name}เก็บมาไว้ในยุ้งเพราะเสียดาย ลูกวัวใต้ทุ่งก้มลงดมฟ่อนข้าวบนรอยไถ ลิ้นสีดินตวัดทีเดียวหมด แล้วมันเดินต่อ ตรงกว่าเดิม ไม่เอียงหัวไปทางยุ้งอีก
          - id: calf_push
            label: เอาไหล่ดันสีข้างมันให้เบนออกจากยุ้ง
            kind: guard
          - id: calf_board
            label: รื้อฝายุ้งมุมนั้นออกเองก่อน ให้มันผ่านโดยเสาไม่ล้ม
            kind: quick
          - id: calf_house3
            label: ขนข้าวเท่าที่แบกไหวออกจากยุ้ง แล้วถอย
            kind: flee
      - text: สุดแปลงคือที่ที่คันไถไอน้ำจอดอยู่ คนขับจากเมืองยืนเกาะคันไถ หน้าซีด ลูกวัวใต้ทุ่งเดินตรงไปหาทั้งคนทั้งเครื่อง
        answer: read
        moves:
          - id: calf_furrow
            label: บอกคนขับให้ถอยออก แล้วใช้จอบกลบรอยไถช่วงที่ข้ามเนินด้วยมือ
            kind: read
            stat: WIS
          - id: calf_yank
            label: กระชากคนขับออกมาจากทาง
            kind: quick
          - id: calf_block
            label: เข็นคันไถไปขวางมันไว้
            kind: guard
          - id: calf_house4
            label: เรื่องของคนเมือง ให้คนเมืองจัดการ
            kind: flee
    win:
      text: |
        ลูกวัวใต้ทุ่งเดินถึงสุดรอยไถ หมุนตัวช้าๆ กลับมาที่ที่เนินเคยอยู่ ทรุดขาหน้าลงก่อน แล้วขาหลัง ดินรอบตัวมันขยับขึ้นมาคลุมหลังเองทีละน้อย ถึงเย็นก็เป็นเนินเตี้ยๆ เหมือนเดิม มีหญ้าขึ้นแล้วด้วย

        เพื่อนบ้านคืนคันไถไอน้ำก่อนกำหนด ปีนั้นทั้งหมู่บ้านไถอ้อมเนินโดยไม่มีใครต้องเตือน และมีคนเอาหมุดไม้ทาสีแดงมาปักไว้รอบเนินให้คนเมืองเห็น
      effects: { stats: { WIS: 1 }, flags: [walked_earth_calf_home] }
    lose:
      text: |
        {name}นอนอยู่ในร่องไถ มองท้องสีฟางเคลื่อนผ่านไปข้างบน ช้าและนานเหมือนเมฆ มันไม่ได้เหยียบ แต่ก็ไม่ได้ระวัง

        ยุ้งข้าวเสียมุมไปหนึ่งมุม ข้าวไหลออกมากองบนลาน คนทั้งหมู่บ้านมาช่วยกันโกยก่อนฝนจะลง
      effects: { gold: -3, flags: [earth_calf_trampled] }
    stalemate:
      text: |
        ลูกวัวใต้ทุ่งเดินไปจนสุดแปลงของมันเอง ผ่านทุกอย่างที่ขวาง แล้วกลับไปนอนที่เดิม รั้วของ{name}ต้องปักใหม่สองแนว กล้าเสียไปครึ่งแปลง

        เพื่อนบ้านเอาข้าวมาชดใช้ให้กระสอบหนึ่ง วางไว้หน้าบ้านตอนเช้ามืดโดยไม่เคาะประตู
      effects: { gold: -2 }
    flee:
      text: |
        จากชานบ้าน{name}เห็นมันเดินผ่านรั้ว ผ่านแปลงกล้า ผ่านมุมยุ้ง ไม่เร็วขึ้น ไม่ช้าลง จนสุดแปลงแล้วเดินกลับไปนอน

        ค่าซ่อมยุ้งกับรั้วกินเงินเก็บของหน้าเกี่ยวไปเกือบหมด
      effects: { gold: -4 }

- id: adult.enc_stray_bird
  stage: adult
  weight: 8
  scene: market
  when:
    age: [20, 58]
  text: |
    แผงขายนกอยู่ท้ายตลาด กรงหวายสี่สิบใบซ้อนกันสามชั้น ข้างในเป็นนกป่าตัวสีเทาอกจุด ชนิดที่ร้องเพราะและเลี้ยงยาก คนขายบอกราคาตัวละสองเหรียญ ลดได้ถ้าเอาสามตัว

    ลมกระโชกมาทีเดียว แรงพอให้ผ้าใบทุกแผงตีพร้อมกัน ลมนั้นมีนกมาด้วยตัวหนึ่ง สีเดียวกับเมฆก่อนฝน ปีกกว้างกว่าช่วงแขนคน มันไม่ได้ร้อง

    กรงใบบนสุดหลุดจากแผง แตกกลางอากาศก่อนถึงพื้น
  encounter:
    foe: stray_bird
    beats:
      - text: นกหลงฝูงวนกลับมารอบที่สอง ลมที่ตามมันหอบเอากระจาดผัก ผ้าคลุมไหล่ กับเด็กคนหนึ่งที่ตัวเบาเกินไป แผงขายนกเอียงทั้งแผง
        answer: guard
        moves:
          - id: bird_post
            label: กอดเสาแผงไว้ ยื่นมืออีกข้างคว้าเด็ก
            kind: guard
            success: "{name}ได้ข้อเท้าเด็กไว้ทัน แขนอีกข้างรัดเสาจนไม้ลั่น ลมดึงทั้งสองคนอยู่สามอึดใจ แล้วคลาย นกหลงฝูงเลี้ยวขึ้นไปตั้งหลักใหม่เหนือหลังคา"
          - id: bird_open
            label: ปลดสลักกรงทีละใบ ปล่อยนกข้างในออกไปเอง
            kind: quick
          - id: bird_stone
            label: คว้าหินถ่วงผ้าใบขว้างใส่มัน
            kind: attack
            tags: [ranged]
          - id: bird_under
            label: มุดเข้าไปใต้โต๊ะแผงเนื้อ
            kind: flee
      - text: มันดิ่งลงมาตรงแถวกรงชั้นล่าง กรงเล็บกางออก ไม่ได้เล็งคน แต่คนขายนกวิ่งเข้าไปกางแขนบังกรงของตัวเอง
        moves:
          - id: bird_tell
            label: ตะโกนบอกคนขายให้เปิดกรง มันมาเอาแค่นั้น
            kind: talk
          - id: bird_cover
            label: กระโจนเข้าไปกดคนขายให้หมอบลง เอาหลังรับ
            kind: guard
          - id: bird_cages
            label: ถีบแผงให้ล้ม กรงทั้งแถวจะได้แตกพร้อมกัน
            kind: attack
            success: แผงล้มลงทั้งแถบ กรงหวายแตกออกเหมือนไข่ นกสีเทาสี่สิบตัวพุ่งขึ้นพร้อมกันเป็นก้อนเดียว นกหลงฝูงเปลี่ยนทางกลางอากาศ บินนำก้อนนั้นขึ้นไป ลมในตลาดหยุดเหมือนมีคนปิดประตู
          - id: bird_under2
            label: หลบเข้าไปในร้านที่มีผนัง
            kind: flee
      - text: กรงเหลืออยู่ไม่กี่ใบ นกหลงฝูงเกาะอยู่บนคานแผง ปีกกางครึ่งหนึ่ง มองกรงใบที่คนขายกอดไว้กับอก
        answer: guard
        moves:
          - id: bird_wait
            label: ยืนนิ่งอยู่ระหว่างมันกับคนขาย ไม่ยกมือ ไม่หลบตา
            kind: guard
          - id: bird_buy
            label: วางสองเหรียญบนแผง รับกรงจากมือคนขาย แล้วเปิดมันเอง
            kind: talk
            requires: { min_gold: 2 }
          - id: bird_snatch
            label: แย่งกรงจากคนขายแล้วเปิดสลัก
            kind: quick
          - id: bird_under3
            label: เดินออกจากตลาด
            kind: flee
    win:
      text: |
        นกหลงฝูงขึ้นไปกับลมลูกสุดท้าย นกป่าสีเทาบินตามเป็นสาย ครู่เดียวก็เหลือแค่จุดบนฟ้าทางทิศที่ไม่มีเมือง

        คนขายนกนั่งอยู่กลางซากกรง นับได้สี่สิบใบ ว่างทุกใบ แม่ค้าแผงข้างๆ เอาน้ำมาให้แกดื่ม แล้วบอกว่ายายของนางเคยเตือนเรื่องขังนกป่ามาตั้งนานแล้ว ไม่มีใครซื้อนกจากแผงนั้นอีกเลย เพราะไม่มีนกให้ซื้อ
      effects: { stats: { CON: 1 }, flags: [stray_bird_freed] }
    lose:
      text: |
        {name}ลุกขึ้นมาจากกองกระจาด มีเลือดไหลเข้าตา หนังศีรษะโดนกรงเล็บเกี่ยวเป็นทางยาว ลมหยุดแล้ว กรงแตกหมดทุกใบ

        แม่ค้าผักเอาผ้าสะอาดมากดแผลให้ ไม่คิดค่าผ้า แต่คิดค่าผักที่{name}ล้มทับ
      effects: { gold: -1 }
    stalemate:
      text: |
        ลมซาลงเอง นกหลงฝูงขึ้นไปวนอยู่สูงจนเห็นเป็นขีดเดียว วนอยู่อย่างนั้นทั้งบ่าย คนขายนกเก็บกรงที่เหลือใส่เกวียนแล้วออกจากเมืองก่อนค่ำ

        ขีดบนฟ้านั้นเคลื่อนตามเกวียนไป
    flee:
      text: |
        {name}ออกมายืนอยู่อีกถนนหนึ่ง ผมยุ่ง ของที่ตั้งใจมาซื้อยังไม่ได้ซื้อ จากตรงนี้ได้ยินเสียงผ้าใบตีกับเสียงคนร้องอยู่อีกพักใหญ่

        ตลาดเปิดอีกทีวันรุ่งขึ้น แผงขายนกไม่อยู่แล้ว

- id: adult.enc_house_servitor
  stage: adult
  weight: 8
  scene: noble_hall
  when:
    age: [20, 58]
  text: |
    เจ้าของคฤหาสน์ตายไปตั้งแต่หน้าหนาว ทายาทอยู่คนละเมืองและอยากได้แต่เงิน คนของธนาคารจึงจ้างคนรายวันมาขนของออกไปขายทอดตลาด ค่าแรงดี เพราะสองชุดก่อนหน้านี้ลาออกตั้งแต่วันแรก

    เหตุผลยืนอยู่ที่เชิงบันได หุ่นรับใช้ทองเหลือง แขนขายาวเกินคน กำลังยกหีบใบหนึ่งขึ้นจากห้องใต้ดินไปห้องใต้หลังคา วางลง แล้วยกหีบใบเดิมกลับลงมา คำสั่งสุดท้ายของนายมันคือย้ายหีบ ไม่มีใครอยู่บอกให้หยุด

    คนงานคนแรกที่เดินตัดหน้ามัน โดนยกขึ้นด้วยสองมือ แล้ววางไว้นอกหน้าต่างชั้นสอง
  encounter:
    foe: house_servitor
    morale: 2
    beats:
      - text: หุ่นเรือนร้างเดินลงบันไดมา หีบในมือ ตาแก้วสองดวงกวาดไปตามทางเดินประจำของมัน ทางนั้นผ่านกลางโถงที่{name}ยืนถือเก้าอี้อยู่พอดี
        moves:
          - id: serv_route
            label: ถอยไปชิดผนัง ดูให้ครบรอบว่ามันเดินทางไหน หยุดตรงไหน
            kind: read
            stat: INT
            success: บันได โถง ประตูห้องใต้ดิน แล้วย้อนกลับ ทุกรอบเท่ากัน และทุกครั้งที่วางหีบ มันหยุดนิ่งสามอึดใจ ตอนนั้นหลังของมันเปิด ตรงกลางหลังมีกุญแจไขลานเสียบคาอยู่ ใหญ่เท่าฝ่ามือ
          - id: serv_dodge
            label: หลบออกจากทางของมันให้ทัน
            kind: quick
          - id: serv_chair
            label: ตั้งเก้าอี้ขวางทางไว้ ยืนยันอยู่ข้างหลัง
            kind: guard
            failure: มันวางหีบลง หยิบเก้าอี้ออกไปวางข้างประตูอย่างเรียบร้อย แล้วกลับมาหยิบ{name} มือทองเหลืองไม่ได้บีบ แค่ไม่ปล่อย ระเบียงชั้นสองสูงกว่าที่เห็นจากข้างล่าง
          - id: serv_order
            label: สั่งมันให้หยุด ด้วยเสียงแบบที่เจ้าบ้านใช้
            kind: talk
          - id: serv_quit
            label: วางเก้าอี้ เดินออกประตูหน้า ไม่เอาค่าแรง
            kind: flee
      - text: มันวางหีบลงที่ปากประตูห้องใต้ดิน ยืนนิ่ง เฟืองข้างในเดินดังติ๊กๆ กุญแจไขลานกลางหลังหมุนช้าๆ
        answer: quick
        moves:
          - id: serv_key
            label: พุ่งเข้าไปดึงกุญแจไขลานออกจากหลังมัน
            kind: quick
            success: กุญแจหลุดออกมาทั้งดอก หนักและอุ่น เฟืองข้างในหุ่นเดินต่ออีกสี่ติ๊ก ช้าลงทุกติ๊ก แขนยาวสองข้างค่อยๆ ตกลงข้างตัว ตาแก้วดับทีละดวง
          - id: serv_hide
            label: เอาหีบไปซ่อนในตู้ ให้มันไม่มีอะไรให้ยก
            kind: quick
          - id: serv_tie
            label: เอาเชือกขนของมัดขามันกับราวบันได
            kind: attack
          - id: serv_quit2
            label: ออกไปรอข้างนอกจนกว่าลานจะหมดเอง
            kind: flee
      - text: หุ่นหันกลับมา ไม่มีหีบในมือ ตาแก้วกวาดหาของที่ต้องยก แล้วหยุดที่ตู้ลายครามใบใหญ่ที่คนของธนาคารจดราคาไว้สูงที่สุดในบ้าน
        moves:
          - id: serv_swap
            label: ยัดหีบเปล่าใส่มือมันแทน
            kind: quick
          - id: serv_catch
            label: เข้าไปรับตู้ไว้อีกด้าน ประคองไปกับมัน
            kind: guard
          - id: serv_talk
            label: บอกมันว่านายสั่งให้พัก ชี้ไปที่เก้าอี้ข้างเตาผิง
            kind: talk
            success: หุ่นเรือนร้างนิ่งไปนาน เฟืองเดินเร็วขึ้นเหมือนกำลังคิด แล้วมันเดินไปที่เก้าอี้ข้างเตาผิง ไม่ได้นั่ง มันยืนอยู่ข้างเก้าอี้ มือประสานกันข้างหน้า รอคนที่เคยนั่งตรงนั้น
          - id: serv_quit3
            label: ปล่อยตู้ไว้ ไม่ใช่ของตัวเอง
            kind: flee
    win:
      text: |
        หุ่นเรือนร้างยืนนิ่งอยู่ในโถง ไม่ยกอะไรอีก คนงานที่เหลือขนของออกได้หมดก่อนค่ำ โดยเดินอ้อมมันทุกเที่ยวทั้งที่ไม่จำเป็นแล้ว

        คนของธนาคารจ่ายค่าแรงสองเท่าตามที่ตกลง แล้วจดหุ่นลงในบัญชีของขายเป็นรายการสุดท้าย ราคาประเมินต่ำกว่าตู้ลายคราม
      effects: { gold: 6, stats: { DEX: 1 }, reputation: { belek_bank: 1 }, flags: [servitor_stilled] }
    lose:
      text: |
        {name}โดนวางไว้ในพุ่มกุหลาบนอกหน้าต่างชั้นสอง วางเบากว่าที่คิด แต่พุ่มกุหลาบไม่ได้เบาด้วย หลังยอกจนลุกเองไม่ได้ คนงานอีกสองคนมาช่วยกันดึงออก

        คนของธนาคารจ่ายค่าแรงให้ครึ่งวัน แล้วไปติดประกาศรับคนชุดที่สี่
      effects: { gold: 2 }
    stalemate:
      text: |
        ถึงค่ำลานของมันก็ยังไม่หมด หุ่นเรือนร้างยังยกหีบใบเดิมขึ้นลงบันได คนงานขนของออกได้เฉพาะห้องที่ไม่อยู่บนทางของมัน

        คนของธนาคารจ่ายค่าแรงตามชิ้นที่ขนได้ แล้วถามว่าพรุ่งนี้มาอีกไหม
      effects: { gold: 3 }
    flee:
      text: |
        {name}เดินออกจากประตูรั้วคฤหาสน์มือเปล่า ข้างหลังมีเสียงเท้าทองเหลืองขึ้นบันไดดังสม่ำเสมอ

        ประกาศรับคนของธนาคารยังติดอยู่ที่ตลาดไปอีกเดือน ค่าแรงขึ้นทุกเจ็ดวัน

- id: adult.enc_wolves_night
  stage: adult
  weight: 6
  once: false
  time: night
  scene: road
  when:
    age: [18, 60]
  text: |
    ที่พักแรมข้างทางมีแต่เพิงไม้กับหลุมไฟ คืนนี้ไม่มีคนเดินทางอื่น {name}ผูกล่อไว้กับเสา ก่อไฟ แล้วล้มตัวลงนอนโดยยังไม่ถอดรองเท้า

    ล่อเป็นฝ่ายรู้ก่อน มันกระทืบเท้า ดึงเชือกจนเสาสั่น

    นอกวงแสงมีตาสองคู่ ต่ำ อยู่ห่างกัน หมาป่าสองตัวที่ผอมพอจะเข้ามาใกล้ไฟขนาดนี้
  encounter:
    foe: wolf
    name: หมาป่าคู่ผอม
    morale: 2
    beats:
      - text: ตัวหนึ่งเดินวนไปทางล่อ อีกตัวนั่งลงตรงข้าม{name} จ้องเฉยๆ ตัวที่นั่งคือตัวที่คอยให้อีกตัวได้งาน
        moves:
          - id: nwolf_fire
            label: โยนฟืนทั้งกองลงไฟ ให้เปลวสูงท่วมหัว
            kind: item
            stat: WIS
            tags: [fire]
          - id: nwolf_pot
            label: เคาะหม้อกับทัพพีให้ดังที่สุด
            kind: talk
            tags: [noise]
          - id: nwolf_mule
            label: ไปยืนข้างล่อ หันหน้าออก
            kind: guard
          - id: nwolf_go
            label: ปลดเชือกล่อ ขึ้นขี่แล้วออกจากที่นี่กลางดึก
            kind: flee
      - text: ตัวที่วนไปข้างล่อเข้ามาใกล้พอให้เห็นซี่โครง มันย่อตัว หางนิ่ง
        answer: attack
        moves:
          - id: nwolf_brand
            label: คว้าฟืนติดไฟ ฟาดใส่หน้ามัน
            kind: attack
            tags: [fire]
            success: ฟืนท่อนนั้นแตกเป็นสะเก็ดไฟตรงจมูกมันพอดี หมาป่าร้องเสียงแหลมครั้งเดียว กลิ้งถอยไปในความมืด กลิ่นขนไหม้อยู่ต่ออีกพักใหญ่
          - id: nwolf_meat
            label: โยนเนื้อเค็มทั้งห่อไปไกลๆ
            kind: item
            stat: DEX
            tags: [bait]
          - id: nwolf_kick
            label: ปล่อยให้ล่อจัดการเอง คอยดึงเชือกไม่ให้มันพันขา
            kind: guard
          - id: nwolf_go2
            label: ทิ้งล่อ ปีนขึ้นหลังคาเพิง
            kind: flee
      - text: ตัวที่นั่งอยู่ลุกขึ้นเป็นครั้งแรก เดินเข้ามาในแสงไฟหนึ่งก้าว ลองดูว่า{name}จะถอยไหม
        answer: talk
        moves:
          - id: nwolf_step
            label: เดินเข้าหามันหนึ่งก้าวเหมือนกัน ตะโกนใส่
            kind: talk
            tags: [noise]
          - id: nwolf_knife
            label: ชักมีด รอให้มันเข้ามาก่อน
            kind: guard
            tags: [edge]
          - id: nwolf_throw
            label: ขว้างฟืนติดไฟใส่
            kind: quick
            tags: [fire, ranged]
          - id: nwolf_go3
            label: ถอยขึ้นหลังคาเพิง รอเช้า
            kind: flee
    win:
      text: |
        ตาสองคู่ถอยห่างออกไปจนแยกไม่ออกจากความมืด ล่อเลิกกระทืบเท้า แต่หูยังตั้งอยู่จนฟ้าสาง

        เช้ามารอบที่พักมีรอยเท้าวนอยู่สามรอบ รอบนอกสุดเดินจากไปทางเขา {name}ออกเดินทางต่อได้ตามเวลา
      effects: { gold: 1 }
    lose:
      text: |
        {name}ลงเอยบนหลังคาเพิง ขาข้างหนึ่งโดนกัดลึก ผ้าพันแผลคือแขนเสื้อที่ฉีกออกมา ข้างล่างล่อเงียบไปนานแล้ว

        คนเดินทางกลุ่มแรกของเช้าวันรุ่งขึ้นช่วยพยุงไปถึงหมู่บ้านถัดไป ของบนหลังล่อยังอยู่ แต่ไม่มีล่อแบก ต้องจ้างเกวียน
      effects: { gold: -5 }
    stalemate:
      text: |
        ทั้งสองฝ่ายเฝ้ากันอยู่จนฟ้าสาง หมาป่าไม่เข้ามา {name}ไม่ได้นอน พอแดดแรกถึงพื้น ตาสองคู่ก็หายไปเฉยๆ

        ล่อเดินได้ครึ่งวันก็หลับยืน คนขี่ก็เหมือนกัน
    flee:
      text: |
        {name}ออกจากที่พักกลางดึก เดินทางในความมืดจนถึงสาง ไม่มีอะไรตามมา หรือถ้ามี ก็ตามมาเงียบพอ

        ของที่ทิ้งไว้ข้างหลุมไฟมีผ้าห่มกับหม้อหนึ่งใบ ราคาไม่มาก แต่คืนต่อไปหนาว
      effects: { gold: -2 }
    death:
      text: |
        ตัวที่นั่งจ้องอยู่ไม่ใช่ตัวที่ต้องระวัง {name}รู้เรื่องนี้ตอนที่น้ำหนักของอีกตัวลงมาจากข้างหลัง

        ไฟในหลุมยังลุกอยู่อีกนาน ไม่มีใครเติมฟืน

- id: adult.enc_witch_hunter
  stage: adult
  weight: 12
  scene: road
  mark: เจอนักล่าแม่มดบนทางหลวง
  when:
    age: [18, 55]
    flags: [race_tiefling]
  text: |
    ด่านตรวจบนทางหลวงเมื่อเดือนก่อนยังไม่มี วันนี้มีไม้กั้นกับเพิงผ้าใบ ธงรูปตะเกียงปักอยู่ข้างทาง คนเดินทางเข้าแถวรอ ถอดหมวกทีละคน

    คนที่ยืนตรวจใส่เสื้อคลุมสีขี้เถ้าของศาสนจักรตะเกียง ที่เอวมีตะเกียงเหล็กกับขอเกี่ยว ไม่มีดาบ นักล่าแม่มดไม่ใช้ดาบ ข้างหลังเขามีเกวียนกรงหนึ่งเล่ม ยังว่าง

    {name}ดึงผ้าคลุมหัวลงต่ำ แถวขยับไปข้างหน้าอีกหนึ่งคน นักล่าเงยหน้าขึ้นมองข้ามหัวคนในแถว ตรงมาที่{name} เขายิ้มเหมือนคนที่นับของครบ
  encounter:
    foe: witch_hunter
    morale: 3
    beats:
      - text: '"คนที่ห้าจากท้ายแถว" เขาพูดเสียงดังพอให้ทุกคนได้ยิน "ออกมา เปิดหัว" คนในแถวแหวกออกเป็นช่องทันที ไม่มีใครอยากยืนใกล้'
        moves:
          - id: hunt_coin
            label: เดินเข้าไปใกล้ ยัดถุงเหรียญใส่มือเขา บอกเบาๆ ว่าค่าตรวจ
            kind: talk
            parley: true
            requires: { min_gold: 6 }
          - id: hunt_crowd
            label: ถามคนในแถวเสียงดัง ว่าใครเคยเห็นคนโดนพาขึ้นเกวียนนั้นแล้วได้กลับบ้าน
            kind: talk
            success: ไม่มีใครตอบ แต่หญิงแก่คนหนึ่งถ่มน้ำลายลงพื้นทางเกวียนกรง ชายสองคนขยับมายืนขวางระหว่างนักล่ากับ{name}โดยทำเป็นก้มผูกเชือกรองเท้า นักล่าต้องเดินอ้อม
          - id: hunt_sling
            label: ถอยออกมาให้ได้ระยะ คว้าหินข้างทางขว้างใส่ตะเกียงที่เอวเขา
            kind: attack
            tags: [ranged]
          - id: hunt_read
            label: มองให้ออกว่าเขาพกอะไร และมีพวกซ่อนอยู่ไหม
            kind: read
            stat: WIS
          - id: hunt_break
            label: แหวกแถว วิ่งลงข้างทางเข้าป่าละเมาะ
            kind: flee
      - text: นักล่าปลดขอเกี่ยวออกจากเอว สายโซ่ยาวสามช่วงแขนคลี่ลงพื้น เขาแกว่งมันเป็นวงช้าๆ ข้างตัว ยังยิ้มอยู่
        answer: quick
        moves:
          - id: hunt_in
            label: พุ่งเข้าไปประชิดตัวก่อนโซ่จะได้ระยะ
            kind: quick
            success: "{name}เข้าไปถึงในวงโซ่ก่อนขอจะเหวี่ยงมา ใกล้จนได้กลิ่นน้ำมันตะเกียงจากเสื้อเขา ขอเกี่ยวที่ไม่มีระยะก็เป็นแค่เหล็กหนักๆ ชิ้นหนึ่ง นักล่าต้องถอยเองสองก้าว รอยยิ้มหายไปเป็นครั้งแรก"
          - id: hunt_cart
            label: หลบหลังเกวียนของพ่อค้า ให้โซ่พันล้อ
            kind: guard
          - id: hunt_rock
            label: ขว้างหินใส่มือข้างที่แกว่งโซ่
            kind: attack
            tags: [ranged]
          - id: hunt_break2
            label: กระโดดข้ามคูข้างทาง วิ่ง
            kind: flee
      - text: ขอเกี่ยวพุ่งมาเกี่ยวผ้าคลุมหัว กระชากจนหลุด เขาสองข้างของ{name}ออกมาอยู่กลางแดด ทั้งแถวเงียบ นักล่าดึงโซ่กลับ ม้วนเก็บ เหมือนงานส่วนที่ยากจบแล้ว
        answer: talk
        moves:
          - id: hunt_face
            label: ยืนให้ทุกคนเห็นเต็มตา ถามเขาว่าเขาสองข้างนี้ทำอะไรใครในแถวนี้
            kind: talk
          - id: hunt_lamp
            label: ขว้างหินใส่ตะเกียงเหล็กที่เอวเขาให้แตก
            kind: attack
            tags: [ranged]
            success: หินโดนตะเกียงเต็มใบ น้ำมันอวยพรไหลเปื้อนเสื้อคลุมสีขี้เถ้าเป็นทางยาว นักล่าก้มมองตะเกียงที่ไม่มีไฟ ตะเกียงที่เขาต้องถือกลับไปรายงานวิหาร คนในแถวบางคนหัวเราะ สั้นๆ แล้วรีบเงียบ
          - id: hunt_chain
            label: เหยียบโซ่ที่ยังม้วนไม่เสร็จ กระชากให้เขาเสียหลัก
            kind: quick
          - id: hunt_break3
            label: วิ่งทั้งที่หัวเปิดอยู่อย่างนั้น
            kind: flee
      - text: นักล่าเป่านกหวีดเหล็ก จากเพิงผ้าใบมีผู้ช่วยสองคนเดินออกมา ถือตรวนคนละคู่ เกวียนกรงเปิดประตูรอไว้แล้ว
        moves:
          - id: hunt_mule
            label: ฟาดก้นล่อเทียมเกวียนกรง ให้มันลากเกวียนเตลิดไปทั้งเล่ม
            kind: quick
          - id: hunt_stand
            label: ยืนหลังชิดต้นไม้ ไม่ยอมให้ใครเข้าข้างหลังได้
            kind: guard
          - id: hunt_stone4
            label: ขว้างหินใส่ผู้ช่วยคนหน้า
            kind: attack
            tags: [ranged]
          - id: hunt_break4
            label: หนีไปทางที่แถวคนเดินทางเปิดช่องให้
            kind: flee
    win:
      text: |
        นักล่าแม่มดถอยไปยืนข้างเพิง ม้วนโซ่เก็บช้าๆ ตาไม่ละจาก{name} เขาไม่ได้กลัว เขากำลังจำหน้า

        ไม้กั้นไม่มีใครยกให้ {name}ยกเอง เดินผ่านไป คนในแถวมองตามจนลับโค้ง หญิงแก่คนหนึ่งทำมือเป็นสัญลักษณ์อวยพรทางให้ แบบเก่า แบบที่ศาสนจักรเลิกสอนไปแล้ว
      effects: { stats: { CHA: 1 }, reputation: { lamp_church: -2 }, flags: [beat_witch_hunter] }
    lose:
      text: |
        ตรวนเย็นและหนัก เกวียนกรงออกจากด่านตอนบ่าย {name}นั่งอยู่ในนั้นคนเดียว

        คืนนั้นเกวียนติดหล่มกลางทาง ผู้ช่วยสองคนลงไปงัดล้อ สลักประตูกรงที่ใครสักคนในแถวเมื่อกลางวันแอบถอดหมุดไว้ หลุดออกมาเองตอนเกวียนเอียง {name}ไม่ได้รอดูว่าใครจะสังเกตก่อน
      effects: { gold: -5, reputation: { lamp_church: -1 }, flags: [caged_by_hunter] }
    stalemate:
      text: |
        ขบวนเกวียนถ่านของบริษัทเหมืองมาถึงด่านพอดี คนคุมขบวนตะโกนถามว่าจะให้ถ่านหลวงรอคนของวิหารอีกนานไหม นักล่าต้องยกไม้กั้นให้ขบวนผ่าน

        {name}เดินไปกับฝุ่นของเกวียนเล่มสุดท้าย ไม่มีใครเรียกให้หยุด ครั้งนี้
      effects: { reputation: { lamp_church: -1 } }
    flee:
      text: |
        ป่าละเมาะข้างทางหนาพอให้คนหนึ่งคนหายเข้าไปได้ {name}วิ่งจนเสียงนกหวีดเหล็กอยู่ไกลข้างหลัง แล้วเดินต่ออีกทั้งคืนโดยไม่ใช้ทางหลวง

        ของในย่ามหล่นหายระหว่างทางไปครึ่งหนึ่ง ชื่อกับรูปพรรณไปถึงวิหารก่อนตัวจะถึงเมืองถัดไป
      effects: { gold: -3, reputation: { lamp_church: -1 } }
    parley:
      text: |
        นักล่าชั่งถุงเหรียญในมือโดยไม่ก้มมอง แล้วพูดเสียงดังให้ทั้งแถวได้ยินว่าคนนี้ตรวจแล้ว ผ่าน

        ตอนที่{name}เดินผ่านไม้กั้น เขาพูดเบาๆ อีกประโยค ว่าด่านนี้ตั้งทุกต้นเดือน และค่าตรวจขึ้นทุกครั้ง
      effects: { gold: -6, flags: [paid_witch_hunter] }
    death:
      text: |
        ขอเกี่ยวเข้าที่ข้างคอ โซ่ตึง พื้นทางหลวงขึ้นมารับ {name}กดมือไว้ตรงนั้น ของอุ่นๆ ไหลผ่านร่องนิ้วไม่หยุด เสียงสุดท้ายที่ได้ยินคือนักล่าบ่นกับผู้ช่วยว่าวิหารจ่ายน้อยลงครึ่งหนึ่งถ้าไม่เป็น กับเสียงคนในแถวที่เริ่มเดินต่อ

        ธงรูปตะเกียงสะบัดอยู่ข้างบน

# ---------- ตามอาชีพ (class) ----------
- id: adult.enc_yard_duel
  stage: adult
  weight: 14
  scene: tavern
  when:
    age: [18, 45]
    class: warrior
  text: |
    นายกองเกวียนต้องการยามคุ้มกันหนึ่งคนสำหรับเที่ยวไปคาร์ดิน ค่าจ้างสิบสองเหรียญ มีคนมาสมัครสองคน คือ{name}กับชายไหล่กว้างที่มีรอยดาบพาดคิ้ว เขาเป็นทหารรับจ้าง คิดค่าตัวแพงกว่า แต่ยอมลดลงมาเท่ากันเพราะหน้านี้งานน้อย

    นายกองขี้เกียจเลือก "ไปตกลงกันเองที่ลานหลังร้าน" แกว่า "ถึงเลือดแรก ใครเดินกลับเข้ามาก่อนได้งาน"

    ทหารรับจ้างถอดเสื้อนอกพาดรั้ว ชักดาบออกมาเช็ดกับแขนเสื้อ "ไม่มีอะไรส่วนตัวนะ" เขาว่า "ข้ามีลูกสาม"
  encounter:
    foe: mercenary
    deadly: false
    beats:
      - text: เขาตั้งท่าต่ำ ดาบชี้พื้น เท้ากว้าง ท่าของคนที่ผ่านแนวรบมาจริง ไม่ใช่ท่าโรงฝึก เขารอให้{name}เข้าก่อน
        moves:
          - id: duel_wait
            label: ไม่เข้า ยืนรอเหมือนกัน ดูว่าเขาถนัดข้างไหน
            kind: read
            stat: WIS
            success: เขาลงน้ำหนักขาซ้ายมากกว่าขวา เข่าขวาคงเคยเจ็บ และตาของเขาเหลือบไปทางประตูหลังร้านสองครั้ง เขาไม่ได้อยากสู้ เขาอยากได้เงิน คนแบบนี้คุยรู้เรื่องกว่าฟัน
          - id: duel_split
            label: เสนอให้รับงานด้วยกันสองคน แบ่งค่าจ้างคนละครึ่ง แล้วไปขอเพิ่มจากนายกอง
            kind: talk
            parley: true
          - id: duel_cut
            label: บุกเข้าไปฟันก่อน
            kind: attack
            tags: [edge]
          - id: duel_feint
            label: หลอกบน แล้วลงต่ำ
            kind: quick
          - id: duel_walk
            label: เก็บดาบ บอกว่างานนี้ยกให้
            kind: flee
      - text: เขาเปลี่ยนเป็นฝ่ายบุก ฟันสั้นๆ สามครั้งติดกัน หนักทุกครั้ง แต่ครั้งที่สามช้ากว่าสองครั้งแรก
        answer: guard
        moves:
          - id: duel_parry
            label: รับทั้งสามดาบ ยืนให้มั่น รอครั้งที่สาม
            kind: guard
            success: สองดาบแรกสะเทือนถึงไหล่ ดาบที่สามมาช้าอย่างที่เห็น {name}รับไว้แล้วดันกลับ เขาเซไปก้าวหนึ่งบนเข่าข้างที่ไม่ดี หน้าเบ้
          - id: duel_slip
            label: ถอยฉากออกข้าง ให้เขาฟันลม
            kind: quick
          - id: duel_trade
            label: ฟันสวนไม่สนรับ
            kind: attack
            tags: [edge]
          - id: duel_taunt
            label: ถามเขาว่าลูกคนไหนสอนให้ฟันช้าแบบนี้
            kind: talk
          - id: duel_walk2
            label: ถอยออกจากลาน ยกมือ
            kind: flee
      - text: ทั้งคู่หอบ คนในร้านออกมายืนดูเต็มประตู มีคนเริ่มรับพนัน ทหารรับจ้างปาดเหงื่อ เหลือบมองคนดูแล้วยิ้มแห้งๆ
        moves:
          - id: duel_nick
            label: เข้าเร็ว เอาแค่ปลายดาบสะกิดท่อนแขน
            kind: quick
            tags: [edge]
          - id: duel_bind
            label: เข้าคลุกวงใน ล็อกดาบเขาไว้กับตัว
            kind: attack
          - id: duel_offer
            label: พูดเบาๆ ให้เขาได้ยินคนเดียว ว่ายอมตอนนี้ยังไม่มีใครเสียหน้า
            kind: talk
          - id: duel_walk3
            label: ปักดาบลงพื้น เดินกลับเข้าร้านไปสั่งเหล้า
            kind: flee
    win:
      text: |
        เลือดแรกเป็นของเขา เส้นบางๆ บนท่อนแขน ทหารรับจ้างมองมันแล้วหัวเราะ เก็บดาบ ยื่นมือมาให้จับ มือนั้นด้านและแห้ง

        {name}เดินกลับเข้าร้านก่อน ได้งาน นายกองจ่ายล่วงหน้าครึ่งหนึ่ง ทหารรับจ้างนั่งดื่มอยู่โต๊ะมุม ก่อนออกจากร้านเขาบอกชื่อโรงเตี๊ยมที่คาร์ดินที่ไม่โกงค่าห้องให้
      effects: { gold: 6, stats: { STR: 1 }, flags: [won_yard_duel] }
    lose:
      text: |
        เลือดแรกเป็นของ{name} ลึกกว่าที่กติกาต้องการไปหน่อย ทหารรับจ้างขอโทษจริงใจ ฉีกชายเสื้อตัวเองมาพันให้ แล้วเดินกลับเข้าร้านไปรับงาน

        คนที่พนันข้าง{name}ไม่มองหน้าตอนเดินผ่าน
      effects: { flags: [lost_yard_duel] }
    stalemate:
      text: |
        นายกองเกวียนเดินออกมาเอง บ่นว่ารอจนเหล้าหมดไหแล้ว แกชี้ทั้งสองคน "เอาทั้งคู่ คนละแปด ถ้าใครบ่นก็เอาคนเดียวหก"

        ไม่มีใครบ่น เที่ยวนั้นไม่มีโจรที่ไหนเข้าใกล้ขบวนที่มียามสองคนซึ่งไม่ค่อยพูดกัน
      effects: { gold: 4 }
    flee:
      text: |
        {name}เดินออกจากลาน คนดูโห่ไล่หลังนิดหน่อยตามมารยาท ทหารรับจ้างไม่ได้โห่ เขาพยักหน้าให้เหมือนคนที่เข้าใจเลขในกระเป๋าของกันและกัน

        งานคุ้มกันเที่ยวถัดไปมาอีกทีครึ่งเดือนให้หลัง
    parley:
      text: |
        ทหารรับจ้างคิดเลขในใจครู่หนึ่ง แล้วเก็บดาบ ทั้งสองเดินกลับเข้าร้านพร้อมกัน นายกองโวยว่าไม่ได้บอกให้ไปเป็นเพื่อนกัน แต่ก็ยอมเพิ่มให้อีกสี่เหรียญ เพราะยามสองคนถูกกว่าเกวียนหนึ่งเล่ม

        ระหว่างทางไปคาร์ดิน เขาเล่าเรื่องลูกทั้งสามคนจนจบ ไม่มีใครถาม
      effects: { gold: 5, stats: { CHA: 1 }, flags: [shared_guard_job] }

- id: adult.enc_mad_sentry
  stage: adult
  weight: 14
  time: night
  mark: หนีหุ่นยามในโกดังร้าง
  when:
    age: [18, 50]
    class: rogue
  text: |
    โกดังหมายเลขเก้าปิดมาสองปี ตั้งแต่บริษัทเจ้าของล้ม คนของหนูท่าบอกว่าข้างในยังมีลังเครื่องเทศที่ธนาคารลืมยึด และบอกด้วยว่าหุ่นยามของโกดังโดนถอดลานไปนานแล้ว

    ข้อแรกจริง ลังอยู่ครบ ซ้อนกันถึงขื่อ

    ข้อสองไม่จริง ตอนที่{name}งัดลังแรก เสียงเฟืองก็ดังขึ้นจากมุมมืด หุ่นยามทรงหนาเท่าตู้เดินออกมา ตาเลนส์ข้างเดียวหมุนปรับระยะ มันไม่ได้ขวางตอนเข้า คำสั่งสุดท้ายของมันคือห้ามของออก และตอนนี้{name}ถือของอยู่
  encounter:
    foe: mad_sentry
    morale: 3
    beats:
      - text: หุ่นยามเดินมาหยุดระหว่าง{name}กับประตู แขนเหล็กสองข้างกางออกช้าๆ จนเกือบชนลังทั้งสองฝั่ง ข้อศอกมันพ่นไอน้ำค้างออกมาทีละฟอด
        moves:
          - id: sentry_drop
            label: วางของลง ดูว่ามันทำอย่างไรกับคนมือเปล่า
            kind: read
            stat: INT
            success: พอมือว่าง เลนส์ของมันเลิกตาม{name} หันไปจ้องห่อเครื่องเทศบนพื้นแทน มันเฝ้าของ ไม่ได้เฝ้าคน และตอนที่มันก้ม แผ่นเหล็กหลังคอเผยอขึ้น เห็นสายลานเส้นหนึ่งพาดอยู่ บางพอให้เหล็กแหลมสอดเข้าไปได้
          - id: sentry_eye
            label: ปาเหล็กงัดใส่ตาเลนส์
            kind: attack
            tags: [pierce, ranged]
          - id: sentry_climb
            label: ปีนกองลังขึ้นไปบนขื่อ
            kind: quick
          - id: sentry_cmd
            label: ตะโกนคำสั่งยามแบบที่เคยได้ยินนายโกดังใช้
            kind: talk
          - id: sentry_window
            label: ทิ้งของ มุดออกทางช่องลมที่เข้ามา
            kind: flee
      - text: แขนขวาของมันเหวี่ยงมาเป็นแนวราบ สูงระดับอก กวาดลังไม้แตกไปสองใบระหว่างทาง
        answer: quick
        moves:
          - id: sentry_duck
            label: ทรุดตัวลงให้แขนผ่านเหนือหัว แล้วเข้าไปข้างหลังมัน
            kind: quick
            success: แขนเหล็กผ่านเหนือผมไปนิ้วเดียว {name}กลิ้งผ่านหว่างขามันไปอยู่ข้างหลัง หุ่นยามหมุนตัวตามได้ช้ากว่าคนมาก ทุกครั้งที่หมุน เอวมันดังเหมือนประตูสนิม
          - id: sentry_pick
            label: สอดเหล็กแหลมเข้าข้อศอกมันตอนแขนเหยียดสุด
            kind: attack
            tags: [pierce]
          - id: sentry_crate
            label: ดันลังล้มใส่มัน
            kind: guard
          - id: sentry_window2
            label: วิ่งไปที่ช่องลม
            kind: flee
      - text: หุ่นยามหยุดนิ่ง เลนส์หมุนกลับไปกลับมาเหมือนฟังอะไร แล้วมันพูดเป็นครั้งแรก เสียงแผ่นโลหะสั่น "ของ ห้าม ออก" หยุด "คน ห้าม ออก"
        moves:
          - id: sentry_neck
            label: ปีนขึ้นหลังมัน สอดเหล็กงัดเข้าใต้แผ่นหลังคอ
            kind: quick
            tags: [pierce]
            success: เหล็กงัดเข้าไปถึงสายลานเส้นนั้น {name}บิดจนมันขาดดังเปรี๊ยะ หุ่นยามค้างอยู่ในท่ายกแขนครึ่งทาง เลนส์ค่อยๆ หมุนจนสุดแล้วหยุด ไอน้ำค้างรั่วออกจากข้อต่อทุกข้อเป็นสายบางๆ
          - id: sentry_lamp
            label: ทุ่มตะเกียงใส่ตามัน
            kind: item
            stat: DEX
            tags: [fire]
          - id: sentry_hide
            label: ซ่อนในลังเปล่า กลั้นหายใจ
            kind: guard
          - id: sentry_window3
            label: พุ่งไปที่ช่องลมก่อนมันจะหันมา
            kind: flee
      - text: มันเริ่มเดินไล่ปิดทางทีละช่อง เอาลังมากองทับช่องลม เอาคานมาขัดประตู ทำอย่างเป็นระเบียบ ไม่รีบ เหลือช่องแสงบนหลังคาช่องเดียว
        answer: quick
        moves:
          - id: sentry_roof
            label: ไต่เชือกรอกขึ้นไปที่ช่องแสง พร้อมของหนึ่งห่อ
            kind: quick
          - id: sentry_knee
            label: ตอกลิ่มไม้เข้าข้อเข่ามันตอนมันก้มยกลัง
            kind: attack
            tags: [pierce]
          - id: sentry_bluff
            label: โยนห่อเครื่องเทศไปอีกมุม ให้มันเดินไปเก็บ
            kind: item
            stat: CHA
            tags: [bait]
          - id: sentry_window4
            label: ขึ้นช่องแสงมือเปล่า
            kind: flee
    win:
      text: |
        หุ่นยามยืนนิ่งอยู่กลางโกดัง ไม่มีเสียงเฟือง ไม่มีไอ {name}ขนของออกไปได้เท่าที่แบกไหว แล้วกลับมาเอาอีกเที่ยว

        คนของหนูท่ารับซื้อเครื่องเทศทั้งหมดในราคาที่ไม่เลว พอได้ฟังเรื่องหุ่นยามก็ทำหน้าเหมือนเพิ่งรู้ ทำได้ไม่แนบเนียนเท่าไร แล้วจ่ายเพิ่มให้อีกนิดโดยไม่ต้องทวง
      effects: { gold: 10, stats: { DEX: 1 }, reputation: { dock_rats: 1 }, flags: [beat_mad_sentry] }
    lose:
      text: |
        {name}ตื่นขึ้นมาในลังไม้ ฝาปิด มีคนตอกตะปูไว้เรียบร้อยสี่มุม หุ่นยามเก็บ{name}เข้าที่เหมือนเก็บของ

        กว่าจะถีบฝาออกได้ก็เกือบเช้า นิ้วมือข้างหนึ่งที่โดนแขนเหล็กหนีบตอนนั้นไม่มีความรู้สึกแล้ว
      effects: { flags: [crated_by_sentry] }
    stalemate:
      text: |
        ลานของมันหมดเอาตอนฟ้าเริ่มสาง หุ่นยามหยุดเดินกลางก้าว ลังที่ยกอยู่ค้างในมือ {name}ลงมาจากขื่อ ขาชาไปทั้งสองข้าง

        ไม่มีเวลาขนอะไรแล้ว คนกะเช้าของท่าเริ่มเดินผ่านหน้าโกดัง {name}ออกไปพร้อมห่อเดียวในเสื้อ
      effects: { gold: 3 }
    flee:
      text: |
        {name}ออกมาถึงหลังคาโกดังข้างๆ มือเปล่า หายใจเป็นไอ ข้างล่างยังมีเสียงลังไม้โดนลากไปกองเป็นระเบียบ

        คนของหนูท่าที่ให้งานยักไหล่ตอนได้ฟัง บอกว่าคราวหน้าจะหาคนที่ไม่กลัวตู้เหล็ก
      effects: { reputation: { dock_rats: -1 } }
    death:
      text: |
        แขนเหล็กปิดเข้ามาจากสองข้าง ช้า สม่ำเสมอ เหมือนคนปิดหีบ {name}ได้ยินเสียงซี่โครงตัวเองก่อนจะรู้สึก

        "ของ ห้าม ออก" หุ่นยามพูด แล้ววาง{name}ลงบนกองลัง จัดให้ตรงแนว

- id: adult.enc_star_listener
  stage: adult
  weight: 14
  scene: institute
  time: night
  when:
    age: [18, 50]
    class: wizard
  text: |
    อาจารย์รุ่นพี่ที่{name}นับถือชวนขึ้นไปดูเครื่องมือใหม่บนห้องใต้หลังคา แกบอกว่าเป็นงานวัดความสั่นของแสง ต้องทำตอนดึก และต้องมีพยานที่คิดเลขเป็น

    เครื่องมือเป็นกรวยทองเหลืองปากกว้างเท่าอ่างน้ำ ปลายเรียวต่อเข้ากับหูฟังสองข้าง ปากกรวยเล็งผ่านช่องหลังคาไปที่ดาวดวงใหม่ บนโต๊ะมีสมุดที่เขียนเลขจนเต็ม แล้วเขียนทับ แล้วเขียนทับอีก

    อาจารย์หมุนกุญแจประตูจากข้างใน เก็บเข้ากระเป๋าเสื้อ "ฟังแค่ครู่เดียว" แกยื่นหูฟังให้ ยิ้มเหมือนคนที่รู้อะไรที่{name}ยังไม่รู้ "แล้วเธอจะไม่อยากถอด"
  encounter:
    foe: star_listener
    morale: 2
    beats:
      - text: แกเดินเข้ามาพร้อมหูฟังในมือ สุภาพ ไม่รีบ เสื้อคลุมสีกรมท่ามีแว่นส่องดาวห้อยอยู่ที่อก จากกรวยทองเหลืองมีเสียงต่ำๆ รั่วออกมา เบาจนเกือบไม่ใช่เสียง
        moves:
          - id: listen_drop
            label: ปัดถาดเครื่องแก้วบนโต๊ะลงพื้นทั้งถาด
            kind: attack
            tags: [noise]
            success: แก้วแตกพร้อมกันสิบกว่าใบ เสียงนั้นกลบเสียงต่ำจากกรวยไปชั่วขณะ อาจารย์สะดุ้งเหมือนคนโดนปลุก มองไปรอบห้อง มองมือตัวเอง ครู่หนึ่งแกดูเหมือนคนที่{name}รู้จัก
          - id: listen_argue
            label: ชี้สมุดบนโต๊ะ ถามว่าเลขหน้าที่เขียนทับสามชั้นนั้นได้คำตอบว่าอะไร
            kind: read
            stat: INT
          - id: listen_hands
            label: เอามือสองข้างปิดหู ยืนพิงประตู
            kind: guard
          - id: listen_later
            label: รับปากว่าจะมาฟังคืนอื่น คืนนี้ขอกลับไปเตรียมสมุดจดก่อน
            kind: talk
            parley: true
          - id: listen_door
            label: กระแทกไหล่ใส่ประตู
            kind: flee
      - text: แกสวมหูฟังข้างหนึ่งให้ตัวเอง อีกข้างยื่นมาจนเกือบถึงหูของ{name} มืออีกข้างจับไหล่ไว้ แรงกว่าที่คนวัยแกควรมี
        answer: quick
        moves:
          - id: listen_twist
            label: บิดตัวออกจากมือ ไปยืนอีกฟากของโต๊ะ
            kind: quick
          - id: listen_bell
            label: คว้ากระดิ่งเรียกภารโรงบนโต๊ะ เขย่าไม่หยุด
            kind: item
            stat: DEX
            tags: [noise]
            success: กระดิ่งทองเหลืองใบเล็กดังแหลมไปทั้งชั้น อาจารย์ปล่อยมือจากไหล่ไปกดหูฟังของตัวเองให้แน่น หน้าเบ้เหมือนคนฟังเพลงแล้วโดนขัด ข้างล่างมีเสียงประตูเปิด กับเสียงภารโรงบ่นขึ้นบันไดมา
          - id: listen_shove
            label: ผลักอกแกออกไป
            kind: attack
          - id: listen_door2
            label: ล้วงกุญแจจากกระเป๋าเสื้อแก แล้ววิ่งไปที่ประตู
            kind: flee
      - text: อาจารย์เลิกยิ้ม แกหมุนกรวยทองเหลืองทั้งตัวหันปากมาทาง{name} เสียงต่ำนั้นไม่ต้องใช้หูฟังแล้ว มันอยู่ในฟัน ในกระดูกหลังหู
        moves:
          - id: listen_kick
            label: ถีบขาตั้งกรวยให้ล้ม
            kind: attack
            tags: [noise]
          - id: listen_recite
            label: ท่องตารางธาตุออกเสียง ดังๆ ไม่หยุด
            kind: guard
          - id: listen_cover
            label: คว้าผ้าคลุมกล้องส่องดาวยัดเข้าปากกรวย
            kind: quick
          - id: listen_door3
            label: ปีนออกทางช่องหลังคา
            kind: flee
    win:
      text: |
        อาจารย์นั่งลงบนพื้นกลางเศษแก้ว ถอดหูฟังออกวางบนตัก มองมันเหมือนไม่แน่ใจว่าเป็นของใคร แกขอโทษ ขอโทษซ้ำ แล้วหยิบกุญแจออกมาวางบนพื้น เลื่อนมาให้

        เช้าวันรุ่งขึ้นห้องใต้หลังคาล็อกจากข้างนอก อาจารย์ลาป่วย สมุดเล่มนั้นหายไปจากโต๊ะ {name}ไม่ได้เป็นคนเอาไป
      effects: { stats: { INT: 1 }, reputation: { star_listeners: -1 }, flags: [refused_listening] }
    lose:
      text: |
        {name}จำได้ว่าหูฟังเย็น จำได้ว่ามีอะไรบางอย่างที่เกือบเป็นคำพูด แล้วก็เป็นเช้า นั่งอยู่บนเก้าอี้ในห้องใต้หลังคา คนเดียว ประตูเปิดอยู่

        บนสมุดตรงหน้ามีเลขสามหน้าเป็นลายมือตัวเอง จำไม่ได้ว่าเขียนตอนไหน และไม่กล้าตรวจว่าถูกไหม
      effects: { world: { star: 1 }, reputation: { star_listeners: 1 }, flags: [listened_once] }
    stalemate:
      text: |
        ภารโรงทุบประตูจากข้างนอก ถามว่าใครทำอะไรแตก อาจารย์ชะงัก จัดเสื้อคลุม เดินไปไขกุญแจ แล้วอธิบายเรื่องอุบัติเหตุกับเครื่องแก้วด้วยเสียงปกติทุกอย่าง

        {name}เดินลงบันไดตามหลังภารโรง อาจารย์เรียกไล่หลังว่าคราวหน้าค่อยมาใหม่ เหมือนชวนกินข้าว
    flee:
      text: |
        {name}ลงมาถึงลานสถาบัน หอบ เสื้อขาดตรงไหล่ ข้างบน ช่องหลังคาห้องนั้นยังเปิด กรวยทองเหลืองยังเล็งไปที่เดิม

        วันต่อมาอาจารย์ทักทายในโถงเหมือนไม่มีอะไรเกิดขึ้น และ{name}พบว่าตัวเองตอบรับไปเหมือนไม่มีอะไรเกิดขึ้นเช่นกัน
    parley:
      text: |
        อาจารย์มอง{name}อยู่นาน แล้วพยักหน้า "คนที่เตรียมตัวมาฟังได้ไกลกว่า" แกว่า ไขกุญแจให้ ยังยิ้มอยู่ "คืนเดือนมืดหน้า ฉันจะรอ"

        แกจะรอจริง {name}รู้ และคนที่รับปากกับผู้ฟังดาวไว้ มักได้รับจดหมายเตือนความจำ
      effects: { reputation: { star_listeners: 1 }, flags: [promised_listening] }

- id: adult.enc_ash_cultist
  stage: adult
  weight: 14
  scene: temple
  time: night
  when:
    age: [18, 55]
    class: cleric
  text: |
    หญิงม่ายคนหนึ่งมาขอให้{name}ไปสวดให้บ้านของนาง ไฟในเตาลุกเองตอนดึกมาเจ็ดคืนแล้ว ทั้งที่ไม่มีใครเติมฟืน

    ต้นเหตุไม่ได้อยู่ที่เตา มันอยู่ในห้องเก็บของใต้บ้าน พื้นดินโดนขุดเป็นวง กลางวงมีชามเหล็กใส่ถ่านมารที่คุแดง ควันสีสนิมลอยต่ำ ชายในเสื้อคลุมดำขลิบแดงเลือดหมูคุกเข่าอยู่หน้าชาม เป็นลูกชายของหญิงม่ายเอง คนที่นางบอกว่าไปทำงานเหมืองแล้วไม่ส่งข่าว

    เขาเงยหน้าขึ้น ไม่ตกใจ "ท่านมาสวดให้ใคร" เขาถาม "เทพของท่านกันดาวได้ไหม ของข้ากันได้"
  encounter:
    foe: ash_cultist
    morale: 2
    beats:
      - text: เขาลุกขึ้นยืน ประคองชามไฟไว้สองมือ ถ่านมารในชามสว่างขึ้นตามลมหายใจของเขา ความร้อนแผ่มาถึงหน้าของ{name}ทั้งที่ยืนห่างกันครึ่งห้อง
        moves:
          - id: cult_water
            label: คว้าถังน้ำข้างบันได สาดใส่ชามไฟ
            kind: item
            stat: DEX
            tags: [water]
            success: น้ำทั้งถังลงกลางชาม ถ่านมารร้องเสียงเหมือนเหล็กชุบ ไอสีสนิมพุ่งขึ้นเต็มห้อง พอจางลง ถ่านครึ่งชามกลายเป็นหินสีเทาด้านๆ สาวกมองมันเหมือนคนมองขนมปังที่ตกโคลน
          - id: cult_pray
            label: สวดบทคุ้มบ้านเสียงดัง เดินเข้าไปหา
            kind: guard
          - id: cult_mother
            label: บอกเขาว่าแม่ยืนฟังอยู่บนบันได
            kind: talk
            parley: true
          - id: cult_mace
            label: ฟาดตะบองใส่ชามให้คว่ำ
            kind: attack
            tags: [blunt]
          - id: cult_up
            label: ถอยขึ้นบันได พาหญิงม่ายออกจากบ้าน
            kind: flee
      - text: เขาเป่าลงไปในชาม ถ่านคุพุ่งออกมาเป็นสาย ตกลงบนพื้นไม้ บนกระสอบ บนชายเสื้อคลุมของ{name} ทุกจุดที่ตกเริ่มมีควัน
        answer: quick
        moves:
          - id: cult_stamp
            label: ถอดเสื้อคลุมตบไฟบนกระสอบก่อนมันลาม
            kind: quick
          - id: cult_soak
            label: จุ่มเสื้อคลุมลงโอ่งน้ำฝน เหวี่ยงคลุมทั้งเขาทั้งชาม
            kind: item
            stat: STR
            tags: [water]
          - id: cult_bless
            label: ยืนกลางควัน สวดต่อ ไม่ถอย
            kind: guard
          - id: cult_up2
            label: วิ่งขึ้นบันไดก่อนห้องจะติดไฟ
            kind: flee
      - text: เสียงของเขาเปลี่ยน ทุ้มลง ช้าลง ไม่ใช่เสียงของคนหนุ่ม "เขารักษาคำพูดทุกคำ" เสียงนั้นว่า "ถามแม่ข้าสิ ว่าหน้าหนาวนี้ใครเป็นคนส่งฟืนมาให้"
        moves:
          - id: cult_name
            label: เรียกชื่อเขา ชื่อที่แม่ตั้งให้ ซ้ำๆ จนเขาหันมา
            kind: talk
          - id: cult_dump
            label: เตะชามไฟลงโอ่งน้ำฝน
            kind: attack
            tags: [water]
            success: ชามเหล็กจมลงไปทั้งใบ น้ำในโอ่งเดือดพล่านอยู่สามอึดใจแล้วนิ่ง เสียงทุ้มขาดไปกลางคำ ชายหนุ่มทรุดลงนั่งกับพื้น ไอออกมาเป็นเถ้า
          - id: cult_symbol
            label: ชูสัญลักษณ์เทพขึ้นระหว่างตัวเองกับเขา ยืนให้มั่น
            kind: guard
          - id: cult_up3
            label: ออกจากห้องนี้ ปิดฝาห้องใต้ดิน เอาของหนักทับ
            kind: flee
    win:
      text: |
        ถ่านมารในห้องดับหมดทุกก้อน ชายหนุ่มนั่งพิงผนัง เสื้อคลุมเปียก ตัวสั่นเหมือนคนไข้ลด หญิงม่ายลงบันไดมาทีละขั้น นั่งลงข้างลูก ไม่พูดอะไร

        {name}สวดให้บ้านจนจบบทตามที่รับปากไว้ ก่อนกลับ หญิงม่ายยัดไข่ใส่มือให้หกฟอง กับถามเบาๆ ว่าวิหารต้องรู้เรื่องนี้ไหม
      effects: { stats: { WIS: 1 }, world: { gods: 1 }, reputation: { ash_cult: -1 }, flags: [doused_ash_rite] }
    lose:
      text: |
        {name}ฟื้นขึ้นมาบนพื้นครัว หญิงม่ายกำลังเอาผ้าเปียกวางบนแผลพุพองที่แขน ห้องใต้ดินว่าง ชามไฟไม่อยู่ ลูกชายของนางก็ไม่อยู่

        บนพื้นดินกลางวงที่ขุดไว้มีฟืนมัดหนึ่งวางอยู่ มัดเรียบร้อย ผูกด้วยเชือกสีแดงเลือดหมู
      effects: { world: { demon: 1 }, flags: [ash_rite_finished] }
    stalemate:
      text: |
        ควันหนาจนไม่มีใครเห็นใคร พอ{name}คลำไปถึงผนังอีกด้าน ก็เจอช่องที่ขุดทะลุออกไปหลังบ้าน ชายหนุ่มไปแล้ว ทิ้งชามไฟที่ดับไว้กลางห้อง

        หญิงม่ายขอให้{name}เอาชามนั้นไปด้วย นางไม่อยากให้มันอยู่ในบ้าน และไม่อยากเป็นคนแตะ
      effects: { reputation: { ash_cult: -1 } }
    flee:
      text: |
        {name}พาหญิงม่ายออกมายืนกลางถนน ข้างหลัง ปล่องเตาของบ้านพ่นควันสีสนิมขึ้นฟ้าทั้งที่ไม่มีใครจุดไฟ

        นางไปนอนบ้านน้องสาวคืนนั้น เช้ามาบ้านยังอยู่ ไม่ไหม้ ในห้องใต้ดินไม่มีใคร และเพื่อนบ้านสามหลังบอกว่าเตาของตัวเองก็ลุกเองเมื่อคืน
      effects: { world: { demon: 1 } }
    parley:
      text: |
        ชายหนุ่มหันไปทางบันได แม่ของเขายืนอยู่ตรงนั้นจริง มือกำผ้ากันเปื้อน เขาวางชามไฟลงกับพื้นช้าๆ เหมือนเด็กโดนจับได้ว่าเล่นของมีคม

        "ข้าแค่ไม่อยากให้แม่หนาว" เขาพูดเสียงของตัวเอง {name}เป็นคนคว่ำชามลงโอ่ง ไม่มีใครห้าม ส่วนเรื่องที่ว่าใครเป็นคนสอนเขาขุดวงนั้น เขาไม่ยอมบอก
      effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [doused_ash_rite] }
    death:
      text: |
        ถ่านคุสายนั้นตกลงบนอก ไม่ได้ร้อนอย่างที่คิด มันหนัก หนักเหมือนมีคนเอามือกดไว้ บทสวดขาดกลางคำ

        เสียงทุ้มพูดอะไรอีกประโยคหนึ่ง สุภาพ เหมือนขอโทษที่รบกวน

- id: adult.enc_bear
  stage: adult
  weight: 14
  mark: เจอหมีที่ซากกวาง
  when:
    age: [18, 55]
    class: ranger
  text: |
    กวางที่{name}ตามรอยมาสองวันนอนตายอยู่ริมลำธาร ลูกธนูยังปักอยู่ที่สีข้าง มันวิ่งมาได้ไกลกว่าที่ควร

    {name}คุกเข่าลงเริ่มชำแหละ มีดเพิ่งลงได้ครึ่งท้อง กลิ่นก็มาถึงก่อนเสียง กลิ่นสาบหนักๆ ของสัตว์ที่กินปลามาทั้งหน้าร้อน

    หมีตัวเมียยืนอยู่อีกฝั่งลำธาร ขนที่คอตั้ง มันมองกวาง แล้วมอง{name} ชั่งน้ำหนักอยู่ว่าอย่างไหนขวางอย่างไหน
  encounter:
    foe: bear
    beats:
      - text: หมียืนขึ้นสองขา สูงกว่าคนหนึ่งช่วงแขน จมูกสูดลมเสียงดัง ยังไม่ข้ามน้ำมา มันกำลังดูว่า{name}จะทำอะไร
        moves:
          - id: bear_talk
            label: ลุกขึ้นช้าๆ พูดกับมันเสียงดังและต่ำ ถอยทีละก้าว
            kind: talk
            tags: [noise]
            success: "{name}พูดเรื่อยๆ เรื่องอะไรก็ได้ เสียงทุ้ม ไม่หยุด หมีหมุนหูตาม มันลงมายืนสี่ขาเหมือนเดิม คนที่ส่งเสียงคือคนที่ไม่ได้ย่องมาหา มันรู้เรื่องนี้ดีกว่าพรานหลายคน"
          - id: bear_haunch
            label: ตัดขาหลังกวางโยนข้ามลำธารไปให้
            kind: item
            stat: STR
            tags: [bait]
          - id: bear_bow
            label: ขึ้นสายธนู เล็งไว้ ไม่ยิง
            kind: guard
          - id: bear_tree
            label: วิ่งไปที่ต้นไม้
            kind: quick
          - id: bear_leave
            label: ทิ้งกวางทั้งตัว เดินถอยหลังออกไป
            kind: flee
      - text: มันข้ามลำธารมาแล้ว น้ำกระจายสูงถึงอก หูลู่ไปข้างหลัง ปากอ้าครึ่งหนึ่ง มีเสียงฟันกระทบกันดังเป็นจังหวะ
        answer: talk
        moves:
          - id: bear_roar
            label: กางเสื้อคลุมออกให้กว้าง ตะโกนสุดเสียง ไม่ถอยแม้ก้าวเดียว
            kind: talk
            tags: [noise]
          - id: bear_pot
            label: เคาะกระทะกับมีดรัวๆ
            kind: item
            stat: CON
            tags: [noise]
          - id: bear_spear
            label: ปักโคนหอกลงดิน หันปลายรับ
            kind: guard
            tags: [pierce]
          - id: bear_run
            label: หันหลังวิ่ง
            kind: quick
            failure: ไม่มีอะไรบนสองขาวิ่งหนีหมีพ้น ครูพรานพูดประโยคนี้มาร้อยครั้ง อุ้งตีนของมันตบเข้ากลางหลังของ{name}หลังจากวิ่งได้หกก้าว ลอยไปตกในลำธาร
          - id: bear_leave2
            label: ถอยช้าๆ ไม่หันหลัง ปล่อยกวางไว้
            kind: flee
      - text: หมีหยุดห่างไปสามก้าว เอาตีนหน้าตบดินสองที ฝุ่นฟุ้ง ลมหายใจมันพ่นออกมาเป็นจังหวะสั้นๆ นี่คือครั้งสุดท้ายที่มันจะเตือน
        answer: talk
        moves:
          - id: bear_hold
            label: ยืนที่เดิม ตะโกนตอบทุกครั้งที่มันตบดิน
            kind: talk
            tags: [noise]
          - id: bear_gut
            label: เขี่ยเครื่องในกวางทั้งกองไปข้างหน้ามัน แล้วถอย
            kind: item
            stat: DEX
            tags: [bait]
            success: ตับกับไส้กองอยู่ระหว่างทั้งสองฝ่าย ยังอุ่น หมีก้มลงดม ตีนหน้าข้างหนึ่งเหยียบกองนั้นไว้เหมือนจองที่ มันเงยหน้ามองอีกครั้งเดียว แล้วเริ่มกิน เสียงเคี้ยวดังกว่าเสียงน้ำ
          - id: bear_shoot
            label: ยิงธนูดอกที่ขึ้นสายไว้
            kind: attack
            tags: [ranged, pierce]
          - id: bear_leave3
            label: ทิ้งทุกอย่าง ถอยไปจนพ้นสายตา
            kind: flee
      - text: มันเข้ามาถึงซากกวาง ยืนคร่อมไว้ น้ำลายยืดลงบนขนกวาง มีดชำแหละของ{name}ยังปักอยู่ที่ท้องซาก อยู่ใต้คางมันพอดี
        moves:
          - id: bear_knife
            label: เอื้อมไปดึงมีดคืน ช้าที่สุดเท่าที่มือจะช้าได้
            kind: guard
          - id: bear_yell
            label: ตะโกนไล่อีกครั้ง ทุบโล่ไม้กับต้นไม้
            kind: talk
            tags: [noise]
          - id: bear_roll
            label: กลิ้งเข้าไปคว้ามีดแล้วกลิ้งออก
            kind: quick
          - id: bear_leave4
            label: ยกมีดให้มันไปด้วย
            kind: flee
    win:
      text: |
        หมีเป็นฝ่ายถอย มันคาบขาหลังกวางไปข้างหนึ่งเหมือนเก็บค่าผ่านทาง ข้ามลำธารกลับไป ไม่รีบ ไม่หันมามอง

        {name}ชำแหละส่วนที่เหลือด้วยมือที่ยังสั่น แบกกลับได้สามในสี่ของตัว คืนนั้นที่วงไฟไม่ได้เล่าเรื่องนี้ให้ใครฟัง พรานที่เล่าเรื่องไล่หมีมักเป็นพรานที่ยังไม่เคยเจอ
      effects: { stats: { CHA: 1, WIS: 1 }, flags: [stood_before_bear] }
    lose:
      text: |
        {name}นอนคว่ำอยู่ในลำธารตื้น แกล้งตายแบบที่ครูพรานสอน หรืออาจไม่ได้แกล้งทั้งหมด หมีดมที่ท้ายทอยอยู่นาน ลมหายใจมันร้อน แล้วมันก็ไปหากวาง

        กว่าจะกล้าขยับก็ค่ำ หนังศีรษะเปิดเป็นแผ่น ต้องเดินกลับเองครึ่งคืน เอามือกดไว้ตลอดทาง
      effects: { flags: [mauled_by_bear] }
    stalemate:
      text: |
        หมีลากซากกวางข้ามลำธารไปทั้งตัว ลากไปเรื่อยๆ จนลับพุ่มไม้ เหลือไว้แต่รอยเลือดกับลูกธนูหักหนึ่งดอก

        สองวันที่ตามรอยมา ได้กลับไปแค่เรื่องที่ไม่มีใครเชื่อ กับมีดที่ต้องซื้อใหม่
    flee:
      text: |
        {name}ถอยจนต้นไม้บังหมีมิดจึงหันหลังเดิน ไม่วิ่ง เสียงฉีกเนื้อดังตามหลังมาอีกไกล

        กวางตัวนั้นเป็นของหมีไปแล้ว ครูพรานเคยบอกว่าในป่า ของเป็นของคนที่ยังยืนอยู่ข้างมัน
    death:
      text: |
        น้ำหนักทั้งตัวของมันลงมาพร้อมกัน {name}ได้กลิ่นปลา กลิ่นดิน กลิ่นขนเปียก

        ลำธารยังไหลอยู่ข้างหู เสียงเท่าเดิมกับเมื่อครู่

- id: adult.enc_bad_crowd
  stage: adult
  weight: 14
  scene: tavern
  time: night
  when:
    age: [18, 55]
    class: bard
  text: |
    โรงเตี๊ยมริมทางขนถ่านจ่ายค่าเล่นเป็นข้าวหนึ่งมื้อกับหมวกที่เวียนไปตามโต๊ะ คืนนี้หมวกกลับมาเบา

    โต๊ะใหญ่กลางร้านเป็นคนคุมเกวียนสามคน ดื่มมาตั้งแต่บ่าย คนตัวโตที่สุดล้วงเหรียญออกจากหมวกแทนที่จะหย่อนลงไป แล้วบอกว่าเป็นค่าที่ต้องทนฟัง อีกคนคว้าคอเครื่องดนตรีของ{name}ไว้ ถามว่าไม้แบบนี้ติดไฟดีไหม

    เจ้าของร้านเช็ดแก้วใบเดิมอยู่หลังโต๊ะยาว มองไปทางอื่น
  encounter:
    foe: bandit
    name: คนคุมเกวียนเมา
    beats:
      - text: มือที่กำคอเครื่องดนตรีบิดช้าๆ สายเส้นหนึ่งตึงจนร้องเอง คนทั้งร้านเงียบลง รอดูว่ากวีเร่จะทำอย่างไร
        moves:
          - id: crowd_song
            label: ร้องเพลงคนขับเกวียน เพลงที่คนพวกนี้ร้องกันเองตอนเข็นล้อขึ้นเนิน
            kind: talk
            parley: true
          - id: crowd_joke
            label: บอกทั้งร้านว่าไม้นี้ติดไฟดีกว่าเหล้าที่เขาดื่มอยู่ แต่แพงกว่าเขาทั้งตัว
            kind: talk
            success: ทั้งร้านหัวเราะ ดังพอให้คนตัวโตหันไปมองรอบๆ ว่าใครหัวเราะบ้าง ปรากฏว่าทุกคน มือที่กำคอเครื่องดนตรีคลายออกครึ่งหนึ่ง คนเมายังรู้ว่าตอนไหนตัวเองเป็นตัวตลก
          - id: crowd_snatch
            label: กระชากเครื่องดนตรีคืน
            kind: quick
          - id: crowd_mug
            label: เอาเหยือกดีบุกฟาดข้อมือเขา
            kind: attack
            tags: [blunt]
          - id: crowd_out
            label: ปล่อยเครื่องดนตรีไว้ เดินออกจากร้าน
            kind: flee
      - text: คนตัวโตลุกขึ้นยืน เก้าอี้ล้ม เขาโงนเงนนิดหนึ่ง แล้วเหวี่ยงแขนมาทั้งท่อน กว้างเหมือนเหวี่ยงกระสอบ
        answer: quick
        moves:
          - id: crowd_duck
            label: ก้มหลบ ให้หมัดไปโดนเพื่อนเขาเอง
            kind: quick
            success: หมัดผ่านเหนือหัวของ{name}ไปลงที่หูของคนที่กำเครื่องดนตรีอยู่ คนนั้นปล่อยมือ กุมหู ด่าเพื่อนด้วยคำที่ใช้กับล่อ สองคนเริ่มเถียงกันเองว่าใครเมากว่าใคร
          - id: crowd_table
            label: พลิกโต๊ะขึ้นกั้น
            kind: guard
          - id: crowd_verse
            label: ด้นกลอนสดล้อท่าเหวี่ยงแขนของเขา ให้ทั้งร้านตบโต๊ะตาม
            kind: talk
          - id: crowd_out2
            label: มุดใต้โต๊ะคลานออกประตูหลัง
            kind: flee
      - text: คนที่สามซึ่งนั่งเงียบมาตลอดวางแก้วลง เขาไม่เมาเท่าสองคนแรก เขาลุกขึ้นช้าๆ มือล้วงไปที่มีดข้างเอว แต่ยังไม่ชัก
        moves:
          - id: crowd_round
            label: ประกาศเลี้ยงเหล้าโต๊ะนั้นหนึ่งรอบ ด้วยเหรียญที่เขาล้วงจากหมวกไปเมื่อครู่
            kind: talk
          - id: crowd_stare
            label: มองมือเขา มองตาเขา ส่ายหน้าช้าๆ ครั้งเดียว
            kind: guard
          - id: crowd_stool
            label: คว้าม้านั่งขึ้นมาถือ
            kind: attack
            tags: [blunt]
          - id: crowd_out3
            label: คว้าหมวกแล้วออกจากร้าน
            kind: flee
    win:
      text: |
        คนคุมเกวียนทั้งสามกลับไปนั่ง คนตัวโตหย่อนเหรียญคืนลงหมวก มากกว่าที่ล้วงไปหนึ่งเหรียญ โดยไม่มองหน้า

        {name}เล่นต่อจนร้านปิด หมวกเวียนอีกรอบและกลับมาหนัก เจ้าของร้านที่มองไปทางอื่นมาทั้งคืนบอกว่าพรุ่งนี้มาเล่นอีกได้ ข้าวสองมื้อ
      effects: { gold: 5, stats: { CHA: 1 }, flags: [held_bad_crowd] }
    lose:
      text: |
        {name}ลงไปนั่งอยู่บนพื้นขี้เลื่อย ปากแตก เครื่องดนตรีอยู่ข้างตัว คอหักเป็นสองท่อน สายยังติดกันอยู่เส้นเดียว

        เจ้าของร้านเอาข้าวมาให้ตามที่ตกลง วางบนโต๊ะมุม แล้วบอกว่าช่างไม้ในหมู่บ้านถัดไปซ่อมของแบบนี้ได้ ไม่ถูก
      effects: { gold: -4, flags: [instrument_broken] }
    stalemate:
      text: |
        เจ้าของร้านวางแก้วลงเสียที เดินออกมาพร้อมไม้ตีพริกยาวเท่าแขน บอกว่าใครจะต่อยกันให้ออกไปต่อยที่คอกล่อ คนคุมเกวียนสามคนเลือกนั่งลง

        {name}ไม่ได้เล่นต่อ หมวกคืนนั้นมีสี่เหรียญ พอค่าที่นอน
      effects: { gold: 1 }
    flee:
      text: |
        {name}ยืนอยู่หน้าร้านในความมืด มือว่าง ข้างในมีเสียงสายขาดทีละเส้น กับเสียงหัวเราะ

        เครื่องดนตรีชิ้นใหม่ต้องเก็บเงินอีกสามเดือน ระหว่างนั้นเล่นได้แต่ขลุ่ยไม้ที่ไม่มีใครอยากหย่อนเหรียญให้
      effects: { gold: -6, flags: [instrument_broken] }
    parley:
      text: |
        ท่อนแรกยังไม่ทันจบ คนตัวโตก็ร้องตามแล้ว ผิดเนื้อ ถูกทำนอง มือที่กำคอเครื่องดนตรีปล่อยออกมาตบโต๊ะเป็นจังหวะแทน ท่อนที่สามทั้งร้านร้องด้วยกัน รวมทั้งเจ้าของร้าน

        หมวกเวียนอีกรอบ คนคุมเกวียนหย่อนเหรียญหนักที่สุด แล้วบังคับให้{name}ร้องเพลงเดิมซ้ำอีกหกเที่ยว
      effects: { gold: 6, stats: { CHA: 1 }, flags: [held_bad_crowd] }

- id: adult.enc_field_boar
  stage: adult
  weight: 12
  time: night
  when:
    age: [18, 55]
    flags: [path_commoner]
  text: |
    หัวมันทั้งแปลงพร้อมขุดในอีกเจ็ดวัน เป็นของที่จะกินไปทั้งหน้าหนาว สองคืนที่ผ่านมามีอะไรบางอย่างเข้ามาขุดก่อน ขุดเป็นร่องลึก กินครึ่งทิ้งครึ่ง

    คืนนี้{name}นั่งเฝ้าที่ขอบแปลงกับจอบหนึ่งเล่ม เที่ยงคืน รั้วไม้ไผ่ด้านติดป่าหักดังเปรี๊ยะ

    หมูป่าตัวผู้ เขี้ยวเหลืองงอนขึ้นมาถึงตา ไหล่สูงกว่าเอว มันไม่ได้แอบเข้ามา มันเดินเข้ามาเหมือนแปลงนี้เป็นของมัน
  encounter:
    foe: boar
    beats:
      - text: มันก้มลงขุดร่องแรก ดินกระเด็นสูงเท่าหัวคน ทุกครั้งที่จมูกมันสะบัด หัวมันหายไปสามสี่หัว มันเห็น{name}แล้ว และยังไม่คิดว่าเป็นเรื่องต้องสนใจ
        moves:
          - id: fboar_spike
            label: ถอนหลักรั้วไม้ไผ่ปลายแหลมมาถือแทนจอบ
            kind: item
            stat: STR
            tags: [pierce]
          - id: fboar_pan
            label: ตีจอบกับถังน้ำ ตะโกนไล่
            kind: talk
            tags: [noise]
          - id: fboar_watch
            label: ดูให้นานอีกนิด ว่ามันขยับอย่างไรเวลาตกใจ
            kind: read
            stat: WIS
            success: ค้างคาวตัวหนึ่งบินเฉียดหลังมัน หมูป่าพุ่งไปข้างหน้าทันทีสิบก้าว ตรงเป็นเส้นไม้บรรทัด แล้วต้องหยุดทั้งตัวก่อนจะหันกลับได้ มันพุ่งตรงอย่างเดียว เลี้ยวไม่เป็น
          - id: fboar_home
            label: กลับเข้าบ้าน ยอมเสียมันแปลงนี้
            kind: flee
      - text: หมูป่าเงยหน้า ดินติดเต็มจมูก มันหันมาตรงๆ ก้มหัว เขี้ยวชี้มาที่ท้องของ{name}
        answer: quick
        moves:
          - id: fboar_step
            label: รอจนมันออกตัว แล้วก้าวออกข้างก้าวเดียว
            kind: quick
            success: มันพุ่งผ่านไปใกล้จนขนแข็งๆ ครูดขากางเกง แล้วไถลไปชนกองฟางท้ายแปลง กว่าจะถอยออกมาหันหัวได้ {name}ก็ไปยืนรออีกมุมแล้ว
          - id: fboar_brace
            label: ปักโคนไม้แหลมลงดิน หันปลายรับ
            kind: attack
            tags: [pierce]
          - id: fboar_stand
            label: ยืนขวาง ยกจอบขึ้นกัน
            kind: guard
            failure: จอบหักตั้งแต่ด้าม หัวไหล่ของมันกระแทกเข้าที่สะโพก {name}ลอยข้ามร่องมันไปสองร่อง เขี้ยวข้างหนึ่งเกี่ยวต้นขาระหว่างทาง
          - id: fboar_home2
            label: ปีนขึ้นคานยุ้ง
            kind: flee
      - text: มันหอบ ยืนอยู่กลางแปลงที่เละไปครึ่งหนึ่ง สีข้างหันมาทางนี้พอดี ทางรั้วที่หักยังเปิดโล่งอยู่ข้างหลังมัน
        answer: attack
        moves:
          - id: fboar_stab
            label: แทงไม้แหลมเข้าสีข้าง
            kind: attack
            tags: [pierce]
          - id: fboar_drive
            label: วิ่งอ้อมไปข้างหลัง ไล่ต้อนมันออกทางรั้วที่หัก
            kind: quick
          - id: fboar_fire
            label: จุดคบฟาง โบกไล่
            kind: item
            stat: CON
            tags: [fire]
          - id: fboar_home3
            label: ถอยขึ้นชานบ้าน ดูมันกินต่อ
            kind: flee
      - text: หมูป่าถอยไปถึงรั้วที่หัก แล้วหันกลับมาอีก กีบหน้าขุดดินสองที หัวก้มต่ำ จะมาอีกรอบหรือจะไป มันยังไม่ได้เลือก
        answer: guard
        moves:
          - id: fboar_own
            label: ยืนให้เต็มตัวกลางแปลง ไม่ถอยสักก้าว ให้มันเห็นว่าแปลงนี้มีเจ้าของ
            kind: guard
          - id: fboar_din
            label: ตะโกนสุดเสียง ฟาดไม้กับรั้วไม่หยุด
            kind: talk
            tags: [noise]
          - id: fboar_walk
            label: ถือไม้แหลมเดินเข้าหามันก่อน
            kind: attack
            tags: [pierce]
          - id: fboar_home4
            label: ถอยขึ้นชานบ้าน ปล่อยให้มันเลือกเอง
            kind: flee
    win:
      text: |
        หมูป่าออกไปทางรั้วที่มันพังเข้ามา เสียงวิ่งลงเนินไปทางป่า ไม่กลับมาอีกคืนนั้น หรือคืนไหน

        มันที่เหลือครึ่งแปลง{name}ขุดขึ้นเองตั้งแต่เช้ามืด ไม่รอเจ็ดวัน หัวที่โดนขุดทิ้งไว้ก็เก็บมาล้าง ตัดส่วนที่โดนกัดออก หน้าหนาวนั้นพอกิน
      effects: { stats: { CON: 1 }, flags: [kept_root_field] }
    lose:
      text: |
        {name}คลานกลับถึงชานบ้านได้ด้วยศอก ต้นขาข้างหนึ่งเปิดเป็นทางยาว เลือดออกมากจนต้องเอาเข็มขัดรัดเหนือแผล

        หมูป่ากินอยู่ในแปลงจนฟ้าสาง เช้ามาไม่เหลือมันหัวไหนที่ยังเป็นหัว
      effects: { gold: -3, flags: [lost_root_field] }
    stalemate:
      text: |
        หมูป่ากินจนพอใจแล้วเดินออกไปเอง ทางเดียวกับที่เข้ามา {name}ยืนถือด้ามจอบหักอยู่กลางแปลง มันเหลืออยู่ราวหนึ่งในสาม

        รั้วด้านติดป่าต้องทำใหม่ด้วยไม้จริง และหน้าหนาวนั้นต้องซื้อข้าวเพิ่ม
      effects: { gold: -2 }
    flee:
      text: |
        จากข้างบน{name}ดูมันขุดไปทีละร่อง เป็นระเบียบกว่าคน

        เช้ามาแปลงมันเป็นแปลงโคลน หน้าหนาวนั้นทั้งบ้านกินข้าวต้มใสกว่าทุกปี
      effects: { gold: -3, flags: [lost_root_field] }
    death:
      text: |
        เขี้ยวเข้าที่ขาหนีบ {name}รู้ทันทีจากความอุ่นที่ไหลลงขา ว่าแผลนี้ไม่ใช่แผลที่เข็มขัดรัดอยู่

        ดินในแปลงนุ่ม เพิ่งพรวนเมื่อเจ็ดวันก่อน หมูป่ากลับไปขุดต่อ

# ---------- ตามงาน (job) ----------
- id: adult.enc_ash_soldier
  stage: adult
  weight: 40
  scene: fort
  time: night
  mark: ยืนขวางทหารเถ้าที่แนวหิน
  when:
    age: [22, 50]
    flags: [job_wardens]
  text: |
    คืนที่หินผนึกเงียบที่สุดคือคืนที่คนป้อมสามไม่ชอบ {name}เดินตรวจแนวหินคนเดียวตามเวร ตะเกียงแขวนไว้ที่ขอเหล็กของหินก้อนที่สามสิบหก หอกอยู่ในมือ ข้างหินก้อนนั้นมีค้อนตอกลิ่มของช่างซ่อมหินพิงทิ้งไว้ตั้งแต่บ่าย

    เสียงมาจากฝั่งเถ้า เป็นเสียงเดิน ก้าวเท่ากันทุกก้าว หนักเท่ากันทุกก้าว แบบที่ครูฝึกใช้เวลาเป็นปีกว่าจะตีเข้าไปในขาคน

    สิ่งที่เดินออกมาจากความมืดสวมเกราะเหล็กดำทั้งตัว เกราะแบบที่ไม่มีโรงตีไหนทำมาสามร้อยปีแล้ว ในช่องตาของหมวกไม่มีตา มีแต่แสงแดงหม่นของเถ้าที่ยังไม่มอด มันเดินตรงมาที่ช่องระหว่างหินสองก้อน เว้นที่ทางซ้ายขวาไว้ให้เพื่อนร่วมแถวที่ไม่มีแล้ว
  encounter:
    foe: ash_soldier
    morale: 3
    beats:
      - text: ทหารเถ้ายังอยู่ห่างสิบก้าว จังหวะเดินไม่เปลี่ยน โล่ในมือซ้ายยกขึ้นระดับอก ดาบในมือขวาชี้ลงพื้น ระฆังเตือนอยู่บนป้อม ไกลออกไปสองร้อยก้าว
        moves:
          - id: sold_read
            label: ยกตะเกียงขึ้น ดูว่าเกราะชุดนั้นยึดกันอยู่ด้วยอะไร
            kind: read
            stat: INT
            success: สายหนังที่เคยร้อยแผ่นเกราะเปื่อยไปนานแล้ว แผ่นไหล่ แผ่นอก แผ่นหลัง เกาะกันอยู่ได้เพราะเถ้าร้อนข้างในดันไว้เท่านั้น ทุกก้าวที่มันเดิน เหล็กกระทบเหล็กดังกริ๊ก ของแบบนี้แทงไปก็เจอแต่เถ้า ต้องทุบให้แผ่นหลุดจากกัน
          - id: sold_spear
            label: แทงหอกเข้าช่องใต้รักแร้ ตรงที่เกราะทุกชุดมีรู
            kind: attack
            tags: [pierce]
            failure: หอกเข้าไปจนสุดคมแล้วไม่เจออะไรเลย เหมือนแทงกระสอบขี้เถ้า ทหารเถ้าเดินต่อเข้ามาตามด้ามหอกทั้งอย่างนั้น จนขอบโล่ของมันกระแทกเข้าที่ปากของ{name}
          - id: sold_maul
            label: ทิ้งหอก คว้าค้อนตอกลิ่มที่พิงหินอยู่ ฟาดโล่มันก่อน
            kind: item
            stat: STR
            tags: [blunt]
          - id: sold_gap
            label: ยืนขวางช่องหิน ตั้งด้ามหอกขวางรับโล่มัน
            kind: guard
          - id: sold_bell
            label: วิ่งขึ้นป้อมไปตีระฆัง ปล่อยช่องหินไว้
            kind: flee
      - text: มันถึงระยะแล้วไม่ฟัน มันยกโล่ขึ้นแล้วเดินชนทั้งตัว แบบที่แถวหน้าทั้งแถวเคยทำพร้อมกัน เกราะร้อนจนอากาศรอบตัวมันสั่น
        answer: guard
        moves:
          - id: sold_brace
            label: เอาหลังยันหินผนึก รับโล่มันไว้ทั้งแรง
            kind: guard
            success: โล่ของมันกระแทกเข้ามาแล้วหยุดอยู่ตรงนั้น หินผนึกข้างหลัง{name}ไม่ขยับมาสามร้อยปีและไม่ขยับคืนนี้ ทหารเถ้าดันอยู่สามอึดใจ แผ่นเกราะที่แขนซ้ายของมันเลื่อนหลุดจากกัน เถ้าไหลลงมาตามขอบโล่
          - id: sold_shoulder
            label: ฟาดแผ่นไหล่ข้างที่ถือโล่ให้หลุดจากตัว
            kind: attack
            tags: [blunt]
          - id: sold_slip
            label: เบี่ยงออกข้าง ให้มันเดินเลยไปชนหินเอง
            kind: quick
          - id: sold_bell2
            label: ถอยออกจากช่องหิน วิ่งไปทางป้อม
            kind: flee
      - text: ทหารเถ้าถอยหนึ่งก้าว ตั้งท่า แล้วฟันดาบเป็นวงกว้างจากขวาไปซ้าย ท่าเดียวกับในลานฝึกทุกแห่ง เพียงแต่ไม่มีใครสอนท่านี้แล้ว หลังฟันทุกครั้งมันหยุดนับหนึ่งจังหวะก่อนตั้งท่าใหม่
        answer: quick
        moves:
          - id: sold_duck
            label: ก้มลอดวงดาบ เข้าไปกระชากแผ่นหลังที่หลวมอยู่
            kind: quick
            success: "{name}เข้าไปอยู่ข้างหลังมันในจังหวะที่มันหยุดนับ นิ้วเกี่ยวขอบแผ่นหลังแล้วกระชาก เหล็กร้อนทะลุถุงมือ แผ่นเกราะหลุดออกมาทั้งแผ่น ข้างในไม่มีหลัง มีแต่เถ้าแดงที่เริ่มไหลออกเหมือนทรายจากถุงขาด"
          - id: sold_helm
            label: ทุบหมวกเหล็กตอนมันหยุดนับ
            kind: attack
            tags: [blunt]
          - id: sold_order
            label: ตะโกนสั่งแถวหยุด ด้วยเสียงแบบครูฝึก
            kind: talk
            success: ทหารเถ้าชะงักกลางก้าว เท้าซ้ายค้างอยู่เหนือพื้น มันย่ำเท้าอยู่กับที่สองครั้ง หมวกเหล็กหันซ้ายหันขวาหาคนสั่ง คำสั่งคำนั้นแก่กว่าป้อมทุกป้อมบนแนวหิน และมันยังฟังอยู่
          - id: sold_bell3
            label: ทิ้งทุกอย่าง วิ่งไปตีระฆัง
            kind: flee
      - text: ทหารเถ้าก้าวข้ามเส้นแนวหินเข้ามาครึ่งตัว หินผนึกสองข้างครางต่ำจนรู้สึกได้ที่ฟัน มันยกดาบขึ้นเหนือหัว ช้า เต็มท่า อกเปิดโล่งอยู่หนึ่งจังหวะ
        answer: attack
        moves:
          - id: sold_chest
            label: ทุบแผ่นอกตอนดาบยังอยู่เหนือหัว
            kind: attack
            tags: [blunt]
          - id: sold_push
            label: เอาไหล่ดันมันกลับออกไปนอกแนวหิน
            kind: guard
          - id: sold_legs
            label: กลิ้งเข้าไปเกี่ยวขาหลังของมัน
            kind: quick
          - id: sold_bell4
            label: ถอยให้พ้นวงดาบ แล้ววิ่งไปตีระฆัง
            kind: flee
    win:
      text: |
        เกราะทั้งชุดทรุดลงกองอยู่ในช่องหิน เถ้าแดงไหลออกมาจนหมดแล้วเย็นลงเป็นสีเทา หมวกเหล็กกลิ้งไปหยุดที่เท้าของ{name} ข้างในว่าง

        เช้าขึ้นมาหัวหน้ากะเอาหมวกใบนั้นไปแขวนในห้องกินข้าว เขียนชื่อ{name}ไว้ข้างใต้ด้วยถ่าน แล้วให้คนกวาดเถ้าในช่องหินไปเทคืนฝั่งโน้น ไม่ให้เหลือติดฝั่งนี้แม้แต่กำมือเดียว
      effects: { stats: { CON: 1 }, reputation: { wardens: 2 }, flags: [felled_ash_soldier] }
    lose:
      text: |
        ระฆังบนป้อมดังขึ้นเอง มีคนบนกำแพงเห็นแสงตะเกียงที่แนวหินส่ายผิดจังหวะ กะดึกทั้งกะวิ่งลงมาพร้อมค้อนกับชะแลง {name}นอนอยู่ในช่องหิน เสื้อไหม้เป็นแถบ ยังหายใจ

        ทหารเถ้าล้มลงที่ก้าวที่สิบสองหลังข้ามแนวหิน ต้องใช้คนหกคน หัวหน้ากะบอกว่าสิบสองก้าวนั้นมากเกินไปสิบสองก้าว แล้วก็ไม่พูดเรื่องนี้อีก
      effects: { flags: [ash_soldier_crossed] }
    stalemate:
      text: |
        ระฆังบนป้อมดังขึ้น กะดึกทั้งกะวิ่งลงมาพร้อมค้อนกับชะแลง ทหารเถ้าหยุดเดินตอนคนที่เจ็ดมาถึง มันกลับหลังหันตามท่าฝึก สองจังหวะ เท้าชิด แล้วเดินกลับเข้าไปในเถ้าด้วยก้าวเดิม

        หัวหน้ากะให้เพิ่มเวรแนวหินเป็นคู่ไปจนสิ้นเดือน ไม่มีใครบ่น
      effects: { reputation: { wardens: 1 } }
    flee:
      text: |
        {name}ตีระฆังจนแขนล้า กะดึกทั้งกะลงไปที่แนวหินพร้อมค้อนกับชะแลง กว่าจะล้มมันได้ ทหารเถ้าเดินเข้ามาถึงโรงเก็บฟืน คนครัวที่ออกมาตักน้ำไม่ได้กลับเข้าครัว

        ไม่มีใครว่า{name}ต่อหน้า ระเบียบของป้อมเขียนไว้ว่าเจอแล้วให้ตีระฆัง ระเบียบไม่ได้เขียนว่าให้ทิ้งช่องหิน
      effects: { reputation: { wardens: -1 }, flags: [left_the_gap] }
    death:
      text: |
        ดาบเก่าลงมาตรงระหว่างคอกับไหล่ {name}ทรุดลงนั่งพิงหินผนึก ตะเกียงที่แขวนอยู่เหนือหัวยังติด

        ทหารเถ้าก้าวข้ามขาของ{name}ไปโดยไม่ก้มมอง จังหวะเดินไม่เปลี่ยน ระฆังบนป้อมเริ่มดังตอนมันไปได้สิบก้าว

- id: adult.enc_navy_boarding
  stage: adult
  weight: 10
  once: false
  scene: ship_deck
  time: night
  when:
    age: [20, 50]
    flags: [job_navy]
  text: |
    เรือตรวจชายฝั่งไล่เรือสองเสาลำหนึ่งมาตั้งแต่พลบค่ำ มันไม่ชักธง ไม่จุดไฟ และกินน้ำลึกกว่าเรือที่บรรทุกแค่ปลาเค็มตามที่ตะโกนตอบมา

    นายสิบสั่งเทียบ {name}เป็นคนแรกที่ข้ามกราบไป เชือกตะขอยังสั่นอยู่ในมือตอนเท้าแตะดาดฟ้าฝั่งโน้น ลูกเรือของมันถอยไปรวมกันที่ท้ายเรือ เหลือคนเดียวยืนขวางฝาระวาง ชายร่างหนา มือหนึ่งถือดาบสั้นแบบคนเรือ อีกมือถือตะขอเกี่ยวลัง

    เขาไม่ได้ดูเหมือนคนที่จะวางของในมือเพราะมีคนสั่ง
  encounter:
    foe: mercenary
    name: นายท้ายเรือเถื่อน
    morale: 2
    beats:
      - text: นายท้ายยืนกางขา รับจังหวะโคลงของเรือได้โดยไม่ต้องคิด ข้างหลัง{name}เพื่อนทหารยังข้ามกราบมาไม่ถึง คลื่นดันเรือสองลำห่างออกจากกันอีกช่วงแขน
        moves:
          - id: board_count
            label: บอกเขาว่าเรือตรวจมีปืนดินดำหัวเรือหนึ่งกระบอกกับคนสิบสองคน ให้นับเอาเอง
            kind: talk
            success: นายท้ายเหลือบไปทางเรือตรวจ ปากกระบอกปืนดินดำหันมาทางนี้อยู่จริง เขาขยับเท้าออกจากฝาระวางครึ่งก้าว ครึ่งก้าวนั้นเขาไม่ได้ตั้งใจให้ใครเห็น
          - id: board_price
            label: ถามเขาเบาๆ ว่าระวางนี้มีค่าเท่าไรสำหรับคนที่มองไม่เห็น
            kind: talk
            parley: true
          - id: board_rush
            label: พุ่งเข้าฟันก่อนเขาตั้งหลัก
            kind: attack
          - id: board_rope
            label: เหวี่ยงเชือกตะขอพันขาเขา กระตุกตอนเรือโคลง
            kind: quick
          - id: board_back
            label: กระโดดกลับเรือตรวจ ให้ปืนดินดำจัดการ
            kind: flee
      - text: เขาเข้ามาพร้อมกับคลื่น ตะขอเกี่ยวลังเหวี่ยงต่ำหาข้อเท้า ดาบสั้นตามมาข้างบน สองจังหวะติดกันแบบคนที่ทำมาแล้วหลายดาดฟ้า
        answer: guard
        moves:
          - id: board_parry
            label: ถอยหลังชนเสากระโดง รับทั้งสองจังหวะด้วยดาบกับฝักดาบ
            kind: guard
            success: ตะขอเกี่ยวได้แต่ฝักดาบ ดาบสั้นของเขาลงมาโดนสันดาบของ{name}เต็มแรง แล้วเรือก็โคลงกลับ นายท้ายที่ทุ่มน้ำหนักมาข้างหน้าเซไปเกาะราวกราบ หอบ
          - id: board_jump
            label: กระโดดข้ามตะขอ ถีบอกเขาตอนลงพื้น
            kind: quick
          - id: board_shout
            label: ตะโกนข้ามหัวเขาไปหาลูกเรือท้ายเรือ ว่าคนที่วางมือตอนนี้ไม่ติดโซ่
            kind: talk
            success: ลูกเรือท้ายเรือคนหนึ่งวางขอเกี่ยวลงบนดาดฟ้า เสียงเหล็กกระทบไม้ดังชัดกว่าเสียงคลื่น อีกสองคนวางตาม นายท้ายไม่ได้หันไปดู แต่ไหล่ของเขาตกลงเท่าหนึ่งนิ้ว
          - id: board_back2
            label: ปีนราวกราบกลับฝั่งเรือตรวจ
            kind: flee
      - text: เพื่อนทหารสองคนข้ามกราบมาถึงแล้ว นายท้ายถอยไปยืนคร่อมฝาระวาง ยกตะเกียงน้ำมันขึ้นเหนือช่องระวางที่เปิดอยู่ กลิ่นที่ขึ้นมาจากข้างล่างไม่ใช่ปลาเค็ม เป็นกลิ่นถ่านมาร
        answer: quick
        moves:
          - id: board_lamp
            label: คว้าข้อมือข้างที่ถือตะเกียงก่อนเขาปล่อย
            kind: quick
          - id: board_calm
            label: บอกเขาว่าถ้าถ่านมารทั้งระวางติดไฟ ลูกเรือของเขาไหม้ก่อนทหาร
            kind: talk
          - id: board_cut
            label: ฟันแขนข้างที่ถือตะเกียง
            kind: attack
          - id: board_back3
            label: ถอยกลับเรือตรวจ ตะโกนให้นายสิบใช้ปืน
            kind: flee
    win:
      text: |
        นายท้ายวางดาบสั้นลงบนฝาระวาง วางเบาๆ เหมือนวางของที่ยังจะกลับมาเอา แล้วยื่นข้อมือสองข้างออกมาเอง

        ในระวางมีถ่านมารสี่สิบกระสอบ ไม่มีตราภาษีสักใบ นายสิบจดชื่อ{name}ไว้หัวรายงาน ส่วนแบ่งค่าปรับตกถึงมือปลายเดือน
      effects: { gold: 5, reputation: { crown: 1 } }
    lose:
      text: |
        {name}ลืมตาขึ้นมาบนดาดฟ้าเรือตรวจ มีคนเอาผ้าใบพันซี่โครงให้แน่นจนหายใจได้ทีละครึ่ง เพื่อนทหารเล่าว่านายท้ายคนนั้นโยน{name}ข้ามกราบกลับมาเอง ก่อนตัดเชือกตะขอ

        เรือสองเสาหายไปในความมืดทางใต้ นายสิบเขียนรายงานว่าคลื่นจัด เทียบไม่ติด
    stalemate:
      text: |
        คลื่นลูกใหญ่ยกเรือสองลำขึ้นไม่พร้อมกัน เชือกตะขอขาดดังเหมือนปืน นายสิบตะโกนเรียกทุกคนกลับ {name}กระโดดข้ามช่องน้ำที่กว้างขึ้นทุกอึดใจมาได้ทันพอดี

        เรือสองเสากางใบหนีไปทางใต้ นายท้ายยืนอยู่ที่ท้ายเรือ ยกตะขอเกี่ยวลังขึ้นแตะหน้าผาก แบบที่คนเรือทักกัน
    flee:
      text: |
        ปืนดินดำหัวเรือยิงนัดเดียว ลูกเหล็กเข้าใต้แนวน้ำ เรือสองเสาเอียงแล้วจมไปพร้อมของในระวาง ลูกเรือของมันว่ายมาเกาะกราบเรือตรวจทีละคน

        นายสิบไม่ชอบให้ของกลางจม ค่าปรับที่ควรได้แบ่งกันทั้งลำกลายเป็นรายงานสามหน้า และเขาจำได้ว่าใครเป็นคนถอยกลับมา
      effects: { reputation: { crown: -1 } }
    parley:
      text: |
        ถุงหนังใบเล็กลอยข้ามดาดฟ้ามาตกที่เท้าของ{name} หนักกว่าขนาด {name}ก้มเก็บ แล้วตะโกนกลับไปที่เรือตรวจว่าระวางมีแต่ปลาเค็ม เค็มจนแสบจมูก

        นายสิบสั่งปลดเชือก เรือสองเสาแล่นต่อไปทางใต้โดยไม่จุดไฟเหมือนเดิม คืนนั้น{name}นับเหรียญในเปลใต้ท้องเรือ นับด้วยนิ้ว ไม่ให้มีเสียง
      effects: { gold: 7, alignment: { law: -1 }, flags: [took_smuggler_coin] }
    death:
      text: |
        ดาบสั้นเข้าใต้ซี่โครงตอนเรือโคลง {name}ถอยไปชนราวกราบ แล้วราวกราบก็ไม่ได้อยู่ตรงนั้น

        น้ำทะเลกลางคืนเย็นกว่าที่คิด ข้างบนมีแสงตะเกียงของเรือสองลำส่ายไปมา เล็กลงเรื่อยๆ

- id: adult.enc_bounty_runner
  stage: adult
  weight: 10
  once: false
  when:
    age: [20, 55]
    flags: [job_bounty_hunter]
  text: |
    ประกาศค่าหัวราคาถูกมีติดกระดานอยู่ทุกฤดู คนหนีหนี้ คนขโมยล่อ คนที่ชกเสมียนด่านแล้วหายตัว งานแบบนี้ไม่มีใครเอาไปเล่าต่อในโรงเตี๊ยม แต่มันจ่ายค่าห้อง

    แผ่นของเที่ยวนี้ค่าหัวหกเหรียญ จับเป็น {name}ตามรอยอยู่สี่วัน ไปเจอตัวที่ท่าแพข้ามฟาก ชายคนนั้นนั่งรอแพอยู่บนกระสอบของตัวเอง กินขนมปังกับหัวหอม

    พอเห็นกระดาษในมือของ{name} เขาเลิกเคี้ยว
  encounter:
    foe: bandit
    name: คนมีค่าหัว
    morale: 2
    beats:
      - text: เขาลุกขึ้นช้าๆ มือหนึ่งยังถือขนมปัง อีกมือเลื่อนไปหาไม้ถ่อสำรองที่พิงเสาท่าอยู่ แพยังอยู่กลางน้ำ อีกนานกว่าจะถึงฝั่ง
        moves:
          - id: run_paper
            label: อ่านประกาศให้เขาฟัง จับเป็นหกเหรียญ แล้วถามว่าจะเดินไปเองหรือให้ลาก
            kind: talk
          - id: run_sack
            label: ถามเขาว่าในกระสอบมีอะไรที่มีค่ามากกว่าหกเหรียญไหม
            kind: talk
            parley: true
          - id: run_grab
            label: เข้าถึงตัวก่อนมือเขาถึงไม้ถ่อ
            kind: quick
          - id: run_look
            label: ดูก่อนว่าคนคนนี้จะสู้หรือจะวิ่ง
            kind: read
            stat: WIS
            success: ตาของเขาไม่ได้มองมาที่{name} มองไปที่พงอ้อเหนือท่าแพ สองครั้ง รองเท้าข้างซ้ายไม่ได้ผูกเชือก คนคนนี้วิ่งมาทั้งชีวิต และไม่เคยชนะด้วยการสู้เลยสักครั้ง ถ้าเขารู้ว่าวิ่งไม่พ้น เขาจะยอม
          - id: run_leave
            label: พับประกาศเก็บ เดินกลับ หกเหรียญไม่คุ้มเจ็บตัว
            kind: flee
      - text: เขาขว้างขนมปังใส่หน้าแล้วออกวิ่งไปทางพงอ้อ กระสอบทิ้งไว้ทั้งใบ
        answer: quick
        moves:
          - id: run_chase
            label: วิ่งตัดหน้า ไปดักที่ปากทางพงอ้อ
            kind: quick
          - id: run_rope
            label: เหวี่ยงเชือกบ่วงพันขา
            kind: item
            stat: DEX
            tags: [ranged]
          - id: run_call
            label: ตะโกนว่าในพงอ้อมีแต่โคลนดูด เชิญวิ่งเข้าไป จะรอเก็บรองเท้า
            kind: talk
            success: เขาหยุดที่ขอบพงอ้อ ก้มมองโคลนสีดำที่ฟองผุดขึ้นมาช้าๆ แล้วมองรองเท้าข้างที่ไม่ได้ผูกเชือก ไหล่ทั้งสองข้างตกลงพร้อมกัน
          - id: run_leave2
            label: ปล่อยเขาวิ่งไป
            kind: flee
      - text: เขาหันกลับมาพร้อมไม้ถ่อ ยาวเท่าคนสองคนต่อกัน เหวี่ยงมั่วแบบคนที่ไม่เคยถือไม้แบบนี้ แต่ยาวพอจะไม่ต้องเล็ง
        answer: guard
        moves:
          - id: run_catch
            label: รับไม้ถ่อไว้ใต้รักแร้ แล้วเดินไล่เข้าไปตามด้าม
            kind: guard
          - id: run_tackle
            label: ก้มลอดวงไม้ เข้าชนกลางตัว
            kind: attack
          - id: run_tired
            label: บอกเขาว่าเหนื่อยแล้ว ทางนี้ก็เหนื่อย นั่งลงเถอะ
            kind: talk
          - id: run_leave3
            label: ถอยออกนอกระยะไม้ แล้วเดินกลับ
            kind: flee
    win:
      text: |
        เขานั่งลงบนตลิ่ง ยื่นข้อมือมาให้ผูก ถามว่าขอกินขนมปังที่เหลือก่อนได้ไหม {name}ไปเก็บมาให้ เปื้อนทรายไปครึ่งก้อน เขากินจนหมด

        คนติดประกาศนับหกเหรียญใส่มือโดยไม่เงยหน้า แล้วดึงกระดาษอีกแผ่นออกมาจากใต้แผ่นเดิม
      effects: { gold: 6 }
    lose:
      text: |
        {name}นอนหงายอยู่ในโคลนริมตลิ่ง ฟ้าหมุนช้าๆ เสียงแพกระทบท่าดังมาจากที่ไกล แล้วเสียงไม้ถ่อค้ำน้ำก็ห่างออกไป

        คนแพเล่าทีหลังว่าผู้โดยสารคนนั้นจ่ายค่าแพสองเท่า และฝากขอโทษใครสักคนที่ยังนอนอยู่ฝั่งโน้น
    stalemate:
      text: |
        แพเทียบท่าพอดี คนแพไม่ถามอะไรทั้งนั้น เขารับเหรียญจากคนมีค่าหัว ค้ำถ่อออก แล้วน้ำก็กว้างขึ้นระหว่างสองฝั่ง

        {name}ยืนถือกระดาษอยู่บนท่า ประกาศแผ่นนี้ต้องเอากลับไปติดที่เดิม
    flee:
      text: |
        หกเหรียญไม่ใช่เงินที่คุ้มกับฟันหน้า {name}เอาประกาศกลับไปติดกระดานที่เดิม คนติดประกาศมองแล้วไม่ว่าอะไร

        สัปดาห์ต่อมาแผ่นนั้นหายไป มีคนอื่นฉีกไปแล้ว
    parley:
      text: |
        ในกระสอบมีเหรียญแปดเหรียญห่อผ้า เขานับใส่มือ{name}ทีละเหรียญ ช้า เหมือนนับนิ้วตัวเอง แล้วขึ้นแพไปโดยไม่หันกลับมา

        {name}กลับไปบอกคนติดประกาศว่ารอยหายที่ท่าแพ เขามองรองเท้าของ{name}ซึ่งไม่เปื้อนโคลนเลย พยักหน้า แล้วจดอะไรบางอย่างลงสมุด
      effects: { gold: 8, alignment: { law: -1 }, flags: [took_runner_coin] }

- id: adult.enc_merc_contract
  stage: adult
  weight: 10
  once: false
  time: night
  when:
    age: [20, 50]
    flags: [job_mercenary]
  text: |
    สัญญาเที่ยวนี้สั้น เฝ้าโกดังผ้าของพ่อค้าคนหนึ่งสามคืน ระหว่างที่เขากับหุ้นส่วนเก่าตกลงกันไม่ได้ว่าผ้าในโกดังเป็นของใคร

    คืนที่สองหุ้นส่วนเก่าส่งคนมา ไม่ได้ส่งทนาย ชายคนนั้นเดินมาตามตรอกคนเดียว เกราะหนังขัดมัน ดาบแขวนต่ำแบบคนที่ชักบ่อย เขาหยุดห่างประตูโกดังสิบก้าว มองกุญแจ มอง{name} แล้วถอนใจ

    "เขาจ่ายเจ้าเท่าไร" เขาถาม
  encounter:
    foe: mercenary
    name: ดาบรับจ้างอีกฝ่าย
    morale: 2
    beats:
      - text: เขายังไม่ชักดาบ ยืนถ่ายน้ำหนักไปมาระหว่างเท้าสองข้าง ตามองระยะ ไม่ได้มองหน้า คนที่ถามเรื่องค่าจ้างก่อนสู้คือคนที่กำลังคิดเลขอยู่
        moves:
          - id: merc_math
            label: บอกตัวเลขตามจริง แล้วถามของเขา ถ้าต่างกันไม่ถึงค่าหมอ ก็ไม่มีใครควรเจ็บ
            kind: talk
            parley: true
          - id: merc_bluff
            label: บอกตัวเลขสูงกว่าจริงสามเท่า ให้เขารู้ว่าฝั่งนี้จ้างของแพง
            kind: talk
          - id: merc_first
            label: ชักดาบเข้าฟันก่อน ขณะเขายังคิดเลข
            kind: attack
          - id: merc_door
            label: ถอยเข้าช่องประตู ให้เขาเข้ามาได้ทางเดียว
            kind: guard
          - id: merc_walk
            label: วางกุญแจไว้บนลัง เดินออกทางท้ายตรอก
            kind: flee
      - text: ดาบของเขาออกจากฝักโดยไม่มีเสียง เขาเข้ามาด้วยท่าตัดสั้นๆ สามครั้งติด ทุกครั้งลงที่เดิม หาข้อมือ
        answer: guard
        moves:
          - id: merc_bind
            label: รับทั้งสามครั้งด้วยโคนดาบ ไม่ถอย
            kind: guard
          - id: merc_feint
            label: ทำทีจะถอย แล้วก้าวเข้าในจังหวะที่สาม
            kind: quick
          - id: merc_cost
            label: พูดระหว่างรับดาบ ว่าแผลที่ข้อมือหายช้า แล้วเดือนหน้าเขาจะรับงานอะไร
            kind: talk
          - id: merc_walk2
            label: ถอยเข้าโกดัง ออกทางหน้าต่างหลัง
            kind: flee
      - text: เขาถอยไปหนึ่งก้าว เช็ดเหงื่อที่คิ้วด้วยหลังมือ ปลายดาบตกลงมาหนึ่งคืบ จะด้วยล้าหรือด้วยตั้งใจก็ดูไม่ออก
        answer: quick
        moves:
          - id: merc_take
            label: เข้าเร็ว ตีดาบเขาให้หลุดมือ
            kind: quick
          - id: merc_press
            label: ฟันเต็มแรงใส่ช่องที่เปิด
            kind: attack
            failure: ช่องนั้นเขาเปิดไว้ให้ ดาบของ{name}ฟันลม ส่วนดาบของเขากลับขึ้นมาจากข้างล่าง เปิดแผลตั้งแต่สะโพกถึงซี่โครงซี่ล่าง
          - id: merc_enough
            label: บอกเขาว่าพอแค่นี้ ทั้งสองคนสู้คุ้มค่าจ้างแล้ว
            kind: talk
          - id: merc_walk3
            label: โยนกุญแจให้เขา แล้วเดินออกจากตรอก
            kind: flee
    win:
      text: |
        เขาเก็บดาบเข้าฝักก่อน แล้วค่อยยกมือสองข้างขึ้นระดับไหล่ บอกว่านายจ้างของเขาจ่ายพอสำหรับลองดู ไม่ได้จ่ายพอสำหรับตาย

        เช้ามาพ่อค้าได้ยินเรื่องจากคนในตรอก เขาจ่ายครบสามคืนทั้งที่ยังเฝ้าไม่ครบ กับเพิ่มให้อีกนิดเป็นค่าที่ผ้าไม่เปื้อนเลือด
      effects: { gold: 6 }
    lose:
      text: |
        {name}ลืมตามาเจอเพดานโกดัง มีคนเอาผ้าลินินอย่างดีทั้งม้วนมารองหัวให้ ม้วนที่เหลือหายไปหมดทั้งโกดัง

        พ่อค้าไม่จ่ายค่าจ้างคืนที่สอง แต่ก็ไม่ได้ทวงค่าผ้าม้วนที่เปื้อนเลือด
    stalemate:
      text: |
        ยามเมืองสองคนเดินเข้ามาปากตรอกพร้อมตะเกียง ถามว่าใครทำอะไรกันดึกดื่น ชายคนนั้นเก็บดาบ ตอบว่าถามทาง แล้วเดินสวนยามออกไป ไม่รีบ

        คืนที่สามไม่มีใครมา เช้าวันที่สี่พ่อค้ากับหุ้นส่วนเก่าตกลงกันได้ที่โต๊ะทนาย ผ้าแบ่งคนละครึ่ง
      effects: { gold: 3 }
    flee:
      text: |
        เช้ามาโกดังว่าง เหลือแต่กลิ่นลูกเหม็นกันมอด พ่อค้ายืนดูชั้นเปล่าอยู่นาน แล้วหันมาถามว่ากุญแจอยู่ไหน

        ข่าวไปถึงโรงเตี๊ยมที่พวกรับจ้างนั่งกันก่อน{name}จะเดินไปถึงเสียอีก เดือนนั้นไม่มีใครเรียกไปคุยเรื่องงาน
      effects: { gold: -2 }
    parley:
      text: |
        ตัวเลขของสองฝ่ายต่างกันสองเหรียญ เขาหัวเราะสั้นๆ ทีเดียว แล้วนั่งลงบนลังข้างประตู บอกว่าจะนั่งตรงนี้จนเช้า แล้วกลับไปรายงานว่าโกดังมีคนเฝ้าแน่นหนา เข้าไม่ได้ ซึ่งก็จริง

        ทั้งคืนเขาเล่าเรื่องนายจ้างที่เบี้ยวเงินให้ฟังสามคน {name}จำชื่อไว้ทั้งสาม
      effects: { gold: 4 }
    death:
      text: |
        ดาบของเขาเข้าตรงใต้ราวนม สะอาด ครั้งเดียว เขาประคอง{name}ลงนั่งพิงประตูโกดังเอง เหมือนช่วยคนเมา

        "ไม่ได้มีอะไรกับเจ้า" เขาว่า แล้วปลดกุญแจไปจากเข็มขัด

- id: adult.enc_deep_smoke
  stage: adult
  weight: 40
  scene: mine
  mark: เจอควันเดินที่อุโมงค์ชั้นสี่
  when:
    age: [22, 50]
    flags: [job_miner]
  text: |
    ระฆังเลิกกะดังไปแล้ว {name}ยังอยู่ที่อุโมงค์ชั้นสี่ เก็บเครื่องมือที่คนงานใหม่ลืมทิ้งไว้ ตะเกียงที่หมวกเหลือน้ำมันอีกครึ่ง

    ควันในเหมืองลอยขึ้นหาปล่องลมเสมอ ควันสายนี้ไม่ลอย มันไหลออกมาจากรอยแยกของผนังถ่าน ลงมากองที่พื้น แล้วก่อตัวขึ้นเป็นรูปหลังค่อมสูงเท่าคน มีถ่านแดงสองจุดอยู่ตรงที่ควรเป็นหน้า

    มันเดินมาทางบันไดลิง ทวนลมจากปล่อง ระหว่างมันกับ{name}มีรางรถถ่าน ถังน้ำดับฝุ่นสองใบ กับประตูกันไฟที่ยังเปิดอยู่
  encounter:
    foe: walking_smoke
    beats:
      - text: ควันเดินยังไม่รีบ ทุกก้าวของมันทิ้งรอยเขม่าไว้บนรางเหล็ก อากาศในอุโมงค์เริ่มแสบคอ ตะเกียงที่หมวกหรี่ลงเองทั้งที่น้ำมันยังมี
        moves:
          - id: smoke_pick
            label: เหวี่ยงอีเต้อเข้ากลางตัว
            kind: attack
            tags: [pierce]
            failure: อีเต้อผ่านตัวมันไปเหมือนผ่านไอน้ำ แรงเหวี่ยงพา{name}เซเข้าไปในร่างนั้นทั้งตัว ลมหายใจถัดมาเป็นเขม่าล้วนๆ
          - id: smoke_bucket
            label: สาดน้ำจากถังดับฝุ่นใส่
            kind: item
            stat: DEX
            tags: [water]
            success: น้ำโดนมันเต็มอก ควันตรงนั้นกลายเป็นโคลนดำหล่นเผละลงบนราง ร่างหลังค่อมยุบไปข้างหนึ่ง มันหยุดเดิน ก้มมองส่วนที่หล่นของตัวเอง
          - id: smoke_read
            label: ดูว่ามันไหลไปทางไหน หลบอะไร
            kind: read
            stat: WIS
            success: ตรงที่น้ำจากเพดานหยดลงราง ควันเดินอ้อม อ้อมกว้างกว่าที่จำเป็น เขม่าที่มันทิ้งไว้ก็ขาดช่วงตรงแอ่งน้ำทุกแอ่ง คนโรงหลอมพูดถูก ของแบบนี้ไม่ต้องตี ต้องทำให้เปียก
          - id: smoke_door
            label: ปิดประตูกันไฟ เอาเสื้อชุบน้ำอุดร่องใต้บาน
            kind: guard
          - id: smoke_ladder
            label: ปีนบันไดลิงขึ้นชั้นสาม
            kind: flee
      - text: มันถึงตัวเร็วกว่าที่ดู แขนควันยืดออกมายาวกว่าแขนคน หาคอ
        answer: quick
        moves:
          - id: smoke_roll
            label: กลิ้งลอดใต้แขนมัน ไปอีกฝั่งของรถถ่าน
            kind: quick
          - id: smoke_scarf
            label: จุ่มผ้าพันคอลงถัง ปิดจมูกปิดปาก แล้วยืนรับ
            kind: item
            stat: CON
            tags: [water]
          - id: smoke_bellows
            label: ชักสูบลมมือที่ผนังอุโมงค์ เป่าให้ร่างมันแตก
            kind: attack
          - id: smoke_ladder2
            label: คว้าบันไดลิง ปีนขึ้นไม่หยุด
            kind: flee
      - text: ควันเดินแผ่ตัวออกเต็มหน้าตัดอุโมงค์ จากผนังถึงผนัง จากพื้นถึงคาน แล้วเคลื่อนเข้ามาทั้งแผง ไม่มีช่องให้ลอด
        answer: guard
        moves:
          - id: smoke_low
            label: นอนราบกับพื้นราง หน้าแนบแอ่งน้ำ กลั้นหายใจจนมันผ่าน
            kind: guard
            success: มันผ่านไปเหนือหลัง หนักและร้อนเหมือนผ้าห่มเปียกที่เพิ่งยกจากหม้อต้ม แอ่งน้ำใต้หน้าของ{name}กินควันชั้นล่างสุดไปทั้งแถบ พอมันก่อร่างกลับที่อีกฝั่ง ขาสองข้างของมันหายไปถึงเข่า
          - id: smoke_cart
            label: ดันรถถ่านพุ่งใส่มันทั้งคัน
            kind: attack
            tags: [blunt]
            failure: รถถ่านวิ่งทะลุมันไปชนประตูกันไฟดังสนั่น ควันปิดกลับเข้าหากันเหมือนไม่มีอะไรผ่าน แล้วก็ปิดลงบนหน้าของ{name}ด้วย
          - id: smoke_pour
            label: ยกถังใบที่สองขึ้นเทราดเป็นม่านขวางอุโมงค์
            kind: item
            stat: STR
            tags: [water]
          - id: smoke_ladder3
            label: ถอยไปที่บันไดลิง ปีนขึ้นก่อนมันมาถึง
            kind: flee
      - text: ถ่านแดงสองจุดหันไปทางบันไดลิง ข้างบนนั้นมีเสียงคนกะดึกกำลังเดินลงมา หัวเราะกันเรื่องอะไรสักอย่าง ควันเดินเริ่มไหลไปทางเสียง
        answer: quick
        moves:
          - id: smoke_cut
            label: วิ่งตัดหน้ามัน เตะถังน้ำให้ล้มขวางตีนบันได
            kind: quick
            tags: [water]
          - id: smoke_shout
            label: ตะโกนขึ้นบันไดให้คนข้างบนเทน้ำลงมาทั้งถัง
            kind: talk
            tags: [water]
            success: ข้างบนเงียบไปอึดใจหนึ่ง แล้วน้ำก็ลงมาทั้งถัง ตามด้วยอีกถัง คนเหมืองไม่ถามเหตุผลของคนที่ตะโกนขอน้ำ ควันเดินที่ตีนบันไดยุบลงเป็นโคลนไหลไปตามร่องราง
          - id: smoke_block
            label: เอาตัวขวางตีนบันได กางเสื้อเปียกกันไว้
            kind: guard
          - id: smoke_ladder4
            label: ปีนขึ้นไปก่อนมัน ตะโกนให้ทุกคนหันหลังกลับ
            kind: flee
    win:
      text: |
        สิ่งที่เหลือบนรางเป็นกองเขม่าเปียกกองหนึ่ง กับถ่านก้อนเล็กสองก้อนที่ยังอุ่น {name}ตักทั้งหมดใส่ถัง เทน้ำทับจนเต็ม แล้วหิ้วขึ้นไปเองทั้งสี่ชั้น

        หัวหน้าเหมืองมองในถัง มองหน้า{name} แล้วให้ช่างก่ออิฐลงไปอุดรอยแยกบนผนังชั้นสี่ตั้งแต่คืนนั้น บริษัทจ่ายค่าล่วงเวลาให้หนึ่งกะ เขียนในใบว่าค่าเก็บเครื่องมือ
      effects: { stats: { CON: 1 }, gold: 3, flags: [put_out_walking_smoke] }
    lose:
      text: |
        คนกะดึกเจอ{name}นอนอยู่ตีนบันไดลิง หน้าดำทั้งหน้า เหลือขาวแต่ร่องน้ำตา พวกเขาแบกขึ้นไปถึงปากเหมืองก่อนจะรู้ว่ายังหายใจ

        ชั้นสี่ปิดอยู่เก้าวัน บริษัทให้คนเทน้ำลงปล่องวันละสี่สิบถัง วันที่สิบจึงมีคนกล้าลงไปดู
    stalemate:
      text: |
        ระฆังปากเหมืองดังขึ้นสามครั้ง สัญญาณเปิดปล่องลมใหญ่ ลมเย็นกรูลงมาตามอุโมงค์ ควันเดินเอนไปทั้งร่าง แล้วไหลกลับเข้ารอยแยกที่มันออกมา เร็วกว่าตอนออก

        {name}ขึ้นไปรายงาน หัวหน้าเหมืองให้ก่ออิฐอุดรอยแยกนั้น อิฐชั้นเดียว ทุกคนที่ลงชั้นสี่หลังจากนั้นเดินผ่านตรงนั้นโดยไม่หันไปมอง
    flee:
      text: |
        {name}ขึ้นมาถึงชั้นสาม ปิดฝาบันได เอากระสอบเปียกทับ แล้ววิ่งต่อจนถึงปากเหมือง เสียงระฆังเตือนภัยดังตามหลังมาเอง มีคนอื่นเห็นควันแล้วเหมือนกัน

        คืนนั้นคนกะดึกขึ้นมาไม่ครบ ขาดไปสองคน บริษัทเขียนในสมุดว่าควันพิษจากชั้นลึก ซึ่งถ้าจะว่าไปก็ไม่ผิด
      effects: { flags: [smoke_took_night_shift] }
    death:
      text: |
        ลมหายใจสุดท้ายที่เข้าไปไม่มีอากาศอยู่เลย {name}ทรุดลงข้างราง ตะเกียงที่หมวกดับก่อน

        ถ่านแดงสองจุดก้มลงมาใกล้ ดูอยู่ครู่หนึ่งเหมือนคนดูเตาที่มอดแล้ว จากนั้นก็เดินต่อไปทางบันได

- id: adult.enc_mine_rats
  stage: adult
  weight: 20
  once: false
  scene: mine
  when:
    age: [18, 55]
    flags: [job_miner]
  text: |
    หนูเหมืองกับคนเหมืองอยู่กันได้ด้วยข้อตกลงที่ไม่มีใครเขียน คนไม่ตีหนู หนูวิ่งออกก่อนเมื่ออุโมงค์จะถล่ม เปลือกขนมปังที่คนทิ้งถือเป็นค่าจ้าง

    วันนี้ฝูงหนึ่งทำผิดข้อตกลง พวกมันเจาะเข้าห้องเก็บของชั้นสอง ที่ไว้ไขมันหล่อรางกับเทียนไขสำรองของทั้งกะ {name}เปิดประตูเข้าไปเจอสามสิบกว่าตัว ตัวเท่าแมว กำลังกินเทียน

    พวกมันเงยหน้าขึ้นพร้อมกัน แล้วไม่หนี
  encounter:
    foe: mine_rat
    name: ฝูงหนูเหมือง
    morale: 2
    beats:
      - text: ตัวใหญ่สุดยืนสองขาบนลังเทียน ฟันหน้าสีส้มยาวเท่าข้อนิ้ว ตัวอื่นเริ่มไต่ลงจากชั้น มาทางประตู ไม่ได้มาแบบหนี
        moves:
          - id: rat_clang
            label: เคาะจอบกับรางเหล็กหน้าห้อง ให้ดังไปทั้งอุโมงค์
            kind: item
            stat: STR
            tags: [noise]
          - id: rat_lamp
            label: ชูตะเกียงจ่อหน้าตัวใหญ่ ไล่ด้วยแสง
            kind: guard
            tags: [light]
            failure: ตัวใหญ่ไม่กะพริบตาด้วยซ้ำ หนูที่เกิดในเหมืองโตมากับตะเกียง มันกระโดดขึ้นเกาะแขนข้างที่ชูไฟ แล้วไต่ต่อขึ้นมาถึงไหล่ ฟันถึงใบหูก่อน{name}จะปัดออก
          - id: rat_crust
            label: โยนห่อข้าวกลางวันทั้งห่อไปทางอุโมงค์ร้าง
            kind: item
            stat: DEX
            tags: [bait]
          - id: rat_boot
            label: เตะตัวที่ลงมาถึงพื้นก่อน
            kind: attack
          - id: rat_shut
            label: ปิดประตู ไปตามคนมาเพิ่ม
            kind: flee
      - text: ฝูงที่ลงถึงพื้นแล้ววิ่งเข้าหาขา ไม่ได้กัดทันที พวกมันไต่ ขากางเกงทั้งสองข้างหนักขึ้นพร้อมกัน
        answer: guard
        moves:
          - id: rat_scrape
            label: ยืนให้มั่น รูดมันลงทีละตัวด้วยด้ามจอบ
            kind: guard
          - id: rat_crate
            label: กระโดดขึ้นลังไขมัน สะบัดขาให้หลุด
            kind: quick
          - id: rat_bang
            label: ฟาดจอบลงบนถังเหล็กเปล่า
            kind: item
            stat: STR
            tags: [noise]
            success: ถังเหล็กดังก้องจนฝุ่นร่วงจากคาน ฝูงหนูชะงักทั้งห้อง ตัวที่เกาะขาอยู่ปล่อยมือร่วงลงพื้นเอง เสียงเหล็กในเหมืองแปลว่าอย่างเดียวสำหรับพวกมัน และไม่ใช่ข่าวดี
          - id: rat_shut2
            label: ถอยออกประตู สลัดตัวที่เกาะมาด้วยข้างนอก
            kind: flee
      - text: ตัวใหญ่ลงจากลังเทียนเสียที มันเดินมาช้าๆ กลางฝูง ตัวอื่นแหวกทางให้ ในปากคาบเทียนไขแท่งหนึ่ง
        answer: quick
        moves:
          - id: rat_tail
            label: คว้าหางตัวใหญ่ ยกขึ้นให้ทั้งฝูงเห็น
            kind: quick
          - id: rat_trail
            label: วางเปลือกขนมปังเป็นแถวจากประตูไปถึงปากอุโมงค์ร้าง แล้วถอยให้ทาง
            kind: item
            stat: WIS
            tags: [bait]
          - id: rat_sweep
            label: เหวี่ยงจอบแบนๆ กวาดไปทั้งพื้น
            kind: attack
          - id: rat_shut3
            label: ออกจากห้อง ปิดประตูขังไว้ทั้งฝูง
            kind: flee
    win:
      text: |
        ฝูงหนูไหลออกทางรูที่มันเจาะเข้ามา ตัวใหญ่ไปเป็นตัวสุดท้าย คาบเทียนไปด้วยหนึ่งแท่ง {name}ปล่อยให้เอาไป ถือเป็นค่าจ้างเดือนนี้

        รูนั้นอุดด้วยเศษเหล็กกับปูน หัวหน้ากะนับเทียนที่เหลือได้เกินครึ่งลัง แล้วจ่ายเบี้ยขยันให้โดยไม่ต้องขอ
      effects: { gold: 2 }
    lose:
      text: |
        คนกะเดียวกันมาเจอ{name}นั่งอยู่นอกประตูห้องเก็บของ นิ้วพันเศษผ้าไว้หกนิ้ว ใบหูมีเลือดซึม ข้างในห้องยังมีเสียงเคี้ยว

        เย็นนั้นทั้งกะต้องขึ้นจากเหมืองด้วยตะเกียงสองดวง เดินเกาะไหล่กันเป็นแถว เทียนสำรองไม่เหลือสักแท่ง
    stalemate:
      text: |
        ระฆังเปลี่ยนกะดัง คนกะใหม่สิบกว่าคนเดินลงมาพร้อมเสียงรองเท้าเหล็กบนราง ฝูงหนูเงยหน้าฟัง แล้วค่อยๆ ถอยกลับเข้ารู ไม่รีบ เหมือนกินอิ่มพอดี

        เทียนเหลือครึ่งลัง ไขมันหล่อรางมีรอยฟันทั้งก้อน หัวหน้ากะหักค่าเทียนจากทั้งกะเท่าๆ กัน
      effects: { gold: -1 }
    flee:
      text: |
        กว่าจะตามคนมาได้สี่คนพร้อมจอบ ห้องเก็บของก็เงียบแล้ว ลังเทียนเหลือแต่ไส้ ไขมันหล่อรางหายไปทั้งก้อน รูที่ผนังกว้างพอให้แมวลอด

        หัวหน้ากะหักค่าเทียนจากทั้งกะเท่าๆ กัน ไม่มีใครว่า{name} ทุกคนเคยเจอฝูงแบบนั้นมาแล้วคนละครั้ง
      effects: { gold: -1 }

- id: adult.enc_chimney_imp
  stage: adult
  weight: 10
  scene: home
  time: night
  when:
    age: [20, 58]
    location_tag: ashland
  text: |
    ในแดนเถ้าถ่านมารถูกกว่าฟืน ทุกบ้านจึงเผามัน และทุกบ้านรู้ว่าต้องกวาดปล่องให้บ่อยกว่าที่อื่นสามเท่า ปีนี้{name}กวาดช้าไปเดือนเดียว

    คืนนี้เป็นคืนที่สามติดกันที่ไฟในเตาลุกขึ้นเองตอนตีสอง {name}ลุกมาดู ฝาเตาเปิดอ้าอยู่ บนชั้นหินเหนือเตามีของตัวเท่าเด็กอ่อนนั่งห้อยขา สีเดียวกับถ่านคุ ปีกหนังพับอยู่ข้างตัว มันกำลังสูดควันจากเตาเข้าจมูกยาวๆ แบบคนแก่สูดยานัตถุ์

    พอเห็น{name} มันยิ้ม ฟันเป็นถ่านแดงทั้งปาก
  encounter:
    foe: chimney_imp
    beats:
      - text: ภูตปล่องเอื้อมมือลงไปในเตา หยิบถ่านติดไฟขึ้นมาก้อนหนึ่ง โยนเล่นจากมือซ้ายไปมือขวา ตามองม่านหน้าต่าง
        moves:
          - id: imp_jug
            label: คว้าเหยือกน้ำข้างเตียง สาดใส่
            kind: item
            stat: DEX
            tags: [water]
            success: น้ำโดนมันเต็มหน้า ภูตปล่องร้องเสียงกาน้ำเดือด ถ่านในมือร่วงลงพื้นหินดับฉ่า ไอน้ำขึ้นจากตัวมันทั้งตัว
          - id: imp_lid
            label: ปิดฝาเตา ตัดควันของมัน
            kind: quick
          - id: imp_rag
            label: โยนผ้าเปียกลงเตาให้ควันโขมง รมมันออกไป
            kind: item
            stat: CON
            tags: [smoke]
            failure: ควันขาวทะลักออกมาเต็มห้อง ภูตปล่องสูดเข้าไปจนอกพอง ตาหยี แล้วพ่นถ่านคุออกมาเป็นสายใส่หลังมือของ{name} ในห้องนี้มีคนเดียวที่ไอจนตัวงอ
          - id: imp_curse
            label: ด่ามันด้วยคำที่ยายใช้ไล่ของในปล่อง
            kind: talk
          - id: imp_out
            label: ออกไปขอนอนบ้านเพื่อนบ้าน
            kind: flee
      - text: มันโฉบลงจากชั้นหิน บินวนใต้ขื่อ ทุกรอบที่ผ่านเตามันคว้าถ่านขึ้นมาอีกก้อน แล้วปล่อยลงมาเหมือนเด็กทิ้งก้อนกรวดลงบ่อ ก้อนแรกตกบนฟูก
        answer: quick
        moves:
          - id: imp_stamp
            label: ตามเหยียบถ่านทุกก้อนก่อนอะไรจะติดไฟ
            kind: quick
          - id: imp_blanket
            label: เอาผ้าห่มชุบน้ำคลุมฟูก แล้วกางอีกผืนรอรับ
            kind: guard
          - id: imp_bucket
            label: ยกถังน้ำล้างเท้าหน้าประตู สาดขึ้นขื่อทั้งถัง
            kind: item
            stat: STR
            tags: [water]
          - id: imp_out2
            label: คว้าของมีค่าเท่าที่อุ้มไหว ออกจากบ้าน
            kind: flee
      - text: ภูตปล่องมองเตา แล้วพุ่งลงมาหาปากเตาที่ยังแดงอยู่ ถ้ามันเข้าไปนอนในถ่านได้ มันจะอยู่ทั้งหน้าหนาว
        answer: guard
        moves:
          - id: imp_block
            label: เอาตัวบังปากเตา รับมันไว้กับอก
            kind: guard
          - id: imp_slam
            label: กระแทกฝาเตาปิดใส่หน้ามัน
            kind: quick
          - id: imp_douse
            label: เทน้ำที่เหลือลงเตาให้ดับทั้งเตา ยอมหนาวคืนนี้
            kind: item
            stat: CON
            tags: [water]
          - id: imp_out3
            label: ปล่อยมันเข้าเตา ออกไปนอนข้างนอก
            kind: flee
    win:
      text: |
        ภูตปล่องร้องลั่นแล้วพุ่งขึ้นปล่อง เขม่าร่วงกราวลงมาตามหลังมันเป็นกอง เสียงปีกดังห่างออกไปบนหลังคา แล้วไปเกาะปล่องบ้านอื่น

        เช้ามา{name}กวาดปล่องตั้งแต่ฟ้ายังไม่สว่าง ได้เขม่าสองถัง เพื่อนบ้านที่เดินผ่านถามว่าเมื่อคืนเสียงอะไร แล้วกลับไปกวาดปล่องบ้านตัวเองโดยไม่รอคำตอบ
      effects: { flags: [chased_chimney_imp] }
    lose:
      text: |
        {name}นั่งอยู่บนพื้นหินหน้าเตา หลังมือพองสองข้าง ภูตปล่องนอนขดอยู่ในเตาบนกองถ่านแดง หลับ กรนเป็นเสียงไฟปะทุ

        มันอยู่ต่ออีกสิบวัน จนถ่านในบ้านหมดจึงย้ายไปเอง หน้าหนาวนั้นฟูกมีรูไหม้เจ็ดรู
      effects: { gold: -2, flags: [imp_wintered] }
    stalemate:
      text: |
        ไก่บ้านไหนสักบ้านขันขึ้นก่อนเวลา ภูตปล่องสะดุ้ง มองช่องหน้าต่างที่เริ่มเป็นสีเทา แล้วมุดกลับขึ้นปล่องไปเอง ทิ้งรอยมือดำไว้บนชั้นหิน ห้านิ้วครบ

        มันกลับมาอีกสองคืน จน{name}กวาดปล่อง แล้วยอมเผาฟืนราคาแพงอยู่ครึ่งเดือน
      effects: { gold: -1 }
    flee:
      text: |
        {name}กลับมาตอนสาย บ้านยังอยู่ ม่านไม่อยู่ ฟูกเหลือครึ่งผืน บนผนังเหนือเตามีรอยมือเล็กๆ สีดำไล่ขึ้นไปจนถึงขื่อ

        ภูตปล่องไปแล้ว ถ่านในถังก็ไปด้วย
      effects: { gold: -3 }

# ---------- วัยกลางคน ----------
- id: adult.enc_float_eye
  stage: adult
  weight: 10
  scene: home
  time: night
  when:
    age: [28, 60]
    not_traits: [curse_brand]
  text: |
    หน้าต่างห้องนอนหันไปทางดาวดวงใหม่ดวงที่ขึ้นเมื่อต้นปี หลายคืนมานี้{name}นอนไม่หลับ และคนนอนไม่หลับก็มองออกหน้าต่าง

    คืนนี้พอหันกลับมา ในห้องมีของเพิ่มมาหนึ่งอย่าง ลูกตาขนาดเท่ากำปั้นลอยอยู่ระดับหน้า ห่างออกไปหนึ่งช่วงแขน ตาขาวชื้น รูม่านตากว้าง ไม่มีเปลือกตา มันไม่ขยับ ไม่ส่งเสียง มันมองอย่างเดียว

    {name}หลบไปทางซ้าย มันหันตาม
  encounter:
    foe: float_eye
    beats:
      - text: ผ่านไปนานเท่าไรไม่รู้ เทียนสั้นลงหนึ่งข้อนิ้ว ตาลอยยังอยู่ที่เดิม {name}เริ่มรู้ตัวว่ากำลังกะพริบตาแทนมัน ถี่ขึ้นเรื่อยๆ
        moves:
          - id: eye_rag
            label: เผาเศษผ้าชุบน้ำมันในจานรองเทียน ให้ควันขึ้น
            kind: item
            stat: INT
            tags: [smoke]
            success: ควันดำลอยขึ้นเป็นเส้นตรง แล้วแผ่ออกใต้เพดาน ตาลอยไม่มีเปลือกตาให้หลับหนี น้ำใสเอ่อขึ้นมาทั้งลูก มันถอยขึ้นไปจนชิดขื่อ รูม่านตาหดเหลือเท่าปลายเข็ม
          - id: eye_stare
            label: จ้องกลับ ไม่กะพริบ ดูว่าใครทนได้นานกว่า
            kind: guard
          - id: eye_ask
            label: ถามมันว่าต้องการอะไร
            kind: talk
            failure: คำถามออกจากปากไปแล้วไม่มีอะไรรับ ตาลอยมองปากที่ขยับ มองคอที่กลืนน้ำลาย มองทุกอย่างที่คำถามนั้นเผยออกมา {name}พูดต่ออีกสามประโยคโดยไม่ได้ตั้งใจ แล้วจำไม่ได้ว่าพูดอะไรไป ขมับปวดตุบ
          - id: eye_cloth
            label: คว้าผ้าห่มโยนคลุมมัน
            kind: quick
          - id: eye_door
            label: ออกจากห้อง ไปนั่งในครัวจนเช้า
            kind: flee
      - text: มันเลื่อนเข้ามาใกล้อีกคืบหนึ่ง รูม่านตาหดแล้วขยายเหมือนปรับระยะ ในหัวของ{name}มีความคิดหนึ่งที่ไม่ใช่ของตัวเอง ความคิดนั้นกำลังนับของในห้อง
        answer: guard
        moves:
          - id: eye_shut
            label: หลับตา เอามือปิดทับอีกชั้น นับลมหายใจของตัวเองให้ถูก
            kind: guard
          - id: eye_wick
            label: เป่าเทียนให้ดับ แล้วจ่อไส้ที่ยังคุควันเข้าไปใกล้มัน
            kind: item
            stat: DEX
            tags: [smoke]
          - id: eye_book
            label: ตบมันด้วยหนังสือเล่มหนา
            kind: attack
          - id: eye_door2
            label: ถอยออกประตู ปิดตามหลัง
            kind: flee
      - text: ตาลอยขึ้นไปอยู่เหนือหัวเตียง ตรงที่{name}ต้องนอนหงายมองมันพอดี ถ้ายังคิดจะนอนในห้องนี้
        answer: quick
        moves:
          - id: eye_pot
            label: คว้าหม้อมีฝา ครอบมันจากข้างล่าง
            kind: quick
          - id: eye_censer
            label: สุมกระถางกำยานตั้งไว้ใต้มัน แล้วปิดหน้าต่าง
            kind: item
            stat: WIS
            tags: [smoke]
          - id: eye_turn
            label: หันเตียงไปอีกทาง นอนตะแคงหันหลังให้ ทนสายตาที่ท้ายทอยให้ได้
            kind: guard
          - id: eye_door3
            label: หอบที่นอนไปนอนห้องอื่น
            kind: flee
    win:
      text: |
        ตาลอยลอยออกทางหน้าต่างไปเหมือนฟองสบู่ที่ลมพัด เล็กลงเรื่อยๆ ไปทางดาวดวงใหม่ แล้วก็แยกไม่ออกว่าจุดไหนเป็นมัน จุดไหนเป็นดาว

        {name}ตอกแผ่นไม้ปิดหน้าต่างบานนั้นครึ่งล่างตั้งแต่เช้า คืนนั้นหลับได้เป็นคืนแรกในรอบครึ่งเดือน
      effects: { stats: { WIS: 1 }, flags: [sent_float_eye_off] }
    lose:
      text: |
        เช้ามาคนข้างห้องมาเคาะประตูเพราะได้ยินเสียงนับเลข {name}นั่งอยู่บนพื้นกลางห้อง นับลมหายใจตัวเองมาตั้งแต่ตีสอง ถึงสี่พันกว่าแล้ว และไม่กล้าหยุด

        ตาลอยไม่อยู่แล้ว มันไปตอนฟ้าสาง อีกหลายวันกว่า{name}จะเลิกเหลียวมองมุมเพดาน
      effects: { flags: [float_eye_watched] }
    stalemate:
      text: |
        ฟ้าเริ่มสาง ดาวดวงใหม่จางไปก่อนดาวดวงอื่น ตาลอยจางตามไปด้วย เหมือนรอยนิ้วมือบนกระจกที่ค่อยๆ ระเหย

        คืนถัดมามันไม่มา คืนถัดไปก็ไม่มา {name}ยังนอนหันหลังให้หน้าต่างอยู่อีกนาน
    flee:
      text: |
        {name}ย้ายที่นอนไปอยู่ห้องที่ไม่มีหน้าต่าง อับ ร้อน และหลับสนิท

        ห้องเดิมไม่มีใครเข้าไปอีกเป็นเดือน พอเปิดประตูเข้าไป ฝุ่นจับทุกอย่างในห้องเท่ากันหมด ยกเว้นวงกลมขนาดเท่ากำปั้นบนพื้นกระดานกลางห้อง ตรงนั้นสะอาด
      effects: { flags: [float_eye_watched] }

- id: adult.enc_great_eye
  stage: adult
  weight: 10
  time: night
  mark: ยืนหน้าตาร้อยดวงที่ลานนวดข้าว
  when:
    age: [30, 60]
    location_tag: arvel_village
    not_traits: [curse_brand]
  text: |
    ลานนวดข้าวท้ายหมู่บ้านว่างมาตั้งแต่เก็บเกี่ยวเสร็จ คืนนี้ดาวดวงใหม่ดวงล่าสุดอยู่เหนือลานพอดี และหมาทั้งหมู่บ้านไม่เห่า

    {name}ออกมาตามแพะที่เชือกหลุด เจอมันยืนนิ่งอยู่ขอบลาน หันหน้าเข้าหากลางลาน ไม่เคี้ยว กลางลานมีก้อนกลมก้อนหนึ่งที่เมื่อเย็นยังไม่มี ใหญ่กว่ากองฟาง ผิวเป็นเนื้อ เป็นร่องเป็นเบ้าทั้งก้อน

    เบ้าหนึ่งเปิดออก ข้างในเป็นตา มองแพะ อีกเบ้าเปิด มองรั้ว เบ้าที่สามเปิดมาทาง{name}
  encounter:
    foe: great_eye
    morale: 3
    beats:
      - text: ตาเปิดเพิ่มทีละดวง ไม่รีบ ดวงที่เปิดใหม่มองมาทางนี้ทุกดวง {name}นึกจะเรียกแพะ แล้วนึกชื่อแพะไม่ออก
        moves:
          - id: geye_straw
            label: จุดฟางชื้นกองแรกที่ขอบลาน
            kind: item
            stat: DEX
            tags: [smoke]
            success: ฟางชื้นไม่ลุก มันคุ ควันขาวข้นไหลเตี้ยๆ ไปตามพื้นลาน พอถึงก้อนเนื้อ ตาแถวล่างสุดหยีลงทีละดวง น้ำใสไหลออกจากเบ้าเป็นทาง
          - id: geye_know
            label: มองกลับ พยายามดูให้ออกว่ามันคืออะไร
            kind: read
            stat: INT
            failure: "{name}มองนานพอจะเริ่มเข้าใจ และนั่นคือส่วนที่ผิด ตาสิบกว่าดวงเปิดพร้อมกันเหมือนมีคนเรียกชื่อพวกมัน {name}ยกมือขึ้นมาดู แล้วไม่แน่ใจว่ามือนี้ของใคร"
          - id: geye_down
            label: ก้มหน้า มองแต่ดิน เดินอ้อมไปหาแพะ
            kind: guard
          - id: geye_goat
            label: วิ่งไปคว้าเชือกแพะ ลากออกจากขอบลาน
            kind: quick
          - id: geye_run
            label: หันหลังเดินกลับบ้าน ไม่วิ่ง ไม่เหลียว
            kind: flee
      - text: ตาเปิดแล้วเกือบครึ่งก้อน {name}รู้สึกว่าหน้าตัวเองหนักขึ้น เหมือนมีมือมาลูบหาโครง ชื่อของคนในบ้านเริ่มหลุดไปทีละคน เริ่มจากคนที่เพิ่งรู้จัก
        answer: guard
        moves:
          - id: geye_names
            label: ท่องชื่อตัวเอง ชื่อพ่อ ชื่อแม่ ซ้ำไปเรื่อยๆ ไม่ให้ขาด
            kind: guard
          - id: geye_pile
            label: ลากฟางชื้นมาสุมเพิ่ม เป็นแนวยาวเหนือลม
            kind: item
            stat: STR
            tags: [smoke]
          - id: geye_argue
            label: ตะโกนไล่มัน บอกว่าที่นี่ไม่มีอะไรให้ดู
            kind: talk
            failure: ทุกคำที่ตะโกนออกไป ตาอีกดวงเปิดขึ้นมารับ มันชอบให้พูดด้วย {name}ตะโกนถึงคำที่สี่ แล้วลืมว่ากำลังไล่อะไร
          - id: geye_run2
            label: ถอยออกจากลาน หันหน้าไปทางบ้าน
            kind: flee
      - text: ลมเปลี่ยนทิศ ควันจากปล่องบ้านท้ายหมู่บ้านลอยต่ำมาทางลาน ก้อนเนื้อเริ่มกลิ้ง ช้าๆ หนีไปทางที่ลมยังสะอาด ทางนั้นมีบ้านคน
        answer: quick
        moves:
          - id: geye_cut
            label: วิ่งอ้อมไปดักหน้า จุดกองฟางริมรั้วขวางทางมัน
            kind: quick
            tags: [smoke]
          - id: geye_torch
            label: ถือคบฟางเข้าไปจี้ตาดวงที่ใกล้ที่สุด
            kind: attack
            tags: [fire]
          - id: geye_wall
            label: ไปยืนขวางระหว่างมันกับบ้านหลังนั้น หลับตาแน่น
            kind: guard
          - id: geye_run3
            label: วิ่งไปเคาะประตูบ้านหลังนั้น แล้วพากันหนี
            kind: flee
      - text: ก้อนเนื้อหยุด ตาที่ยังลืมอยู่ทั้งหมดหันมารวมที่จุดเดียว ที่หน้าของ{name} เบ้าที่ใหญ่ที่สุดตรงกลางก้อนยังปิดอยู่ และเริ่มขยับ
        answer: guard
        moves:
          - id: geye_under
            label: เอาเสื้อคลุมหัว เดินเข้าไปสุมฟางคุไว้ใต้เบ้าใหญ่
            kind: item
            stat: CON
            tags: [smoke]
          - id: geye_close
            label: หลับตา หันหลัง เอามืออุดหู ยืนให้อยู่จนกว่ามันจะเลิก
            kind: guard
          - id: geye_stone
            label: ขว้างหินใส่เบ้าใหญ่ก่อนมันเปิด
            kind: attack
            tags: [ranged]
          - id: geye_run4
            label: ก้มหน้าเดินออกจากลาน นับก้าวตัวเองไปจนถึงบ้าน
            kind: flee
    win:
      text: |
        ตาหลับลงทีละดวง จากล่างขึ้นบน ดวงสุดท้ายที่หลับเป็นดวงที่มองแพะ พอหลับครบ ก้อนเนื้อก็ยุบลงช้าๆ เหมือนขนมปังที่ยกออกจากเตาเร็วไป ก่อนฟ้าสางเหลือแต่รอยชื้นเป็นวงบนลานดิน

        แพะกลับมาเคี้ยวเอื้อง ชาวบ้านไม่ยอมนวดข้าวบนลานนั้นอีก ปีต่อมาย้ายลานไปอยู่อีกฟากของหมู่บ้าน แต่ทุกคนจำได้ว่าคืนนั้นใครออกไปยืนอยู่ที่นั่นคนเดียว
      effects: { stats: { WIS: 1 }, flags: [closed_hundred_eyes] }
    lose:
      text: |
        ชาวบ้านมาเจอ{name}ตอนเช้า นั่งอยู่ขอบลาน ลูบหน้าตัวเองไปมาเหมือนคนคลำหาของในที่มืด ถามชื่อก็ตอบได้ แต่ต้องคิดก่อน

        ก้อนเนื้อไม่อยู่แล้ว แพะก็ไม่อยู่ ตลอดเดือนนั้น{name}เลี่ยงอ่างน้ำ เลี่ยงกระจก เลี่ยงทุกอย่างที่มีหน้าตัวเองอยู่ข้างใน
      effects: { world: { star: 1 }, flags: [seen_by_hundred_eyes] }
    stalemate:
      text: |
        เมฆก้อนใหญ่เคลื่อนมาบังดาวดวงใหม่ ตาทุกดวงบนก้อนเนื้อเหลือกขึ้นฟ้าพร้อมกัน แล้วหลับลงทีเดียวทั้งก้อน เหมือนมีคนเป่าเทียน

        เช้ามามันไม่อยู่ที่ลานแล้ว ไม่มีรอยลาก ไม่มีรอยกลิ้ง คืนฟ้าเปิดคืนต่อมา ทั้งหมู่บ้านปิดหน้าต่างด้านที่หันไปทางลาน
    flee:
      text: |
        {name}กลับถึงบ้านโดยไม่เหลียวเลยสักครั้ง ปิดประตู ลงกลอน แล้วนั่งหันหลังให้หน้าต่างจนเช้า

        แพะตัวนั้นเดินกลับมาเองในอีกสามวัน ผอมลง และไม่ยอมมองหน้าคนอีกเลย ใครเดินเข้าใกล้ มันหันหัวไปทางอื่น
      effects: { flags: [seen_by_hundred_eyes] }

- id: adult.enc_glass_walker
  stage: adult
  weight: 10
  time: night
  mark: ขวางแก้วเดินในตรอกห้องแถว
  when:
    age: [28, 60]
    location_tag: ventras
    not_traits: [curse_brand]
  text: |
    โรงกลั่นเบอร์สิบสี่ปิดตายมาหกปี ตั้งแต่ถังใบใหญ่รั่ว คนย่านนั้นเดินอ้อมกำแพงของมันจนเป็นนิสัย คืนนี้ประตูเหล็กด้านตรอกเปิดอยู่ เปิดจากข้างใน บานพับบิดเป็นเกลียว

    สิ่งที่ออกมาเดินอยู่กลางตรอกสูงเท่าคน รูปร่างพอเรียกได้ว่าคน ทั้งตัวเป็นแก้วสีเขียวอมฟ้าแบบก้นขวด หนา ขุ่น ตรงที่ควรเป็นอกมีแสงฟ้าเต้นช้าๆ มันไม่มีหน้า มันเดินไปหาตะเกียงฟ้าหัวตรอก ทุกก้าวพื้นหินร้าว

    ระหว่างมันกับตะเกียงมีห้องแถวเจ็ดห้อง ห้องที่สามเป็นห้องของ{name}
  encounter:
    foe: glass_walker
    beats:
      - text: แก้วเดินยังอยู่ห่างสี่ห้อง มันเดินชิดผนังฝั่งนี้ ไหล่ครูดอิฐเป็นทาง หน้าต่างห้องแรกแตกไปแล้วโดยที่มันไม่ได้ตั้งใจ คนในห้องแถวเริ่มจุดไฟดูกันทีละห้อง
        moves:
          - id: glass_read
            label: ดูให้ออกว่ามันตามอะไร และสะดุ้งกับอะไร
            kind: read
            stat: WIS
            success: ห้องไหนจุดเทียน มันไม่หัน ตะเกียงน้ำมันก็ไม่หัน มันหันแต่ตอนลมพัดตะเกียงฟ้าหัวตรอกให้กะพริบ แล้วตอนเด็กห้องสองทำหม้อหล่น มันชะงักทั้งตัว รอยร้าวเส้นหนึ่งแล่นขึ้นที่ต้นแขน เสียงดังๆ ทำอะไรบางอย่างกับมันได้
          - id: glass_knife
            label: เอามีดอีโต้ฟันข้อเข่ามัน
            kind: attack
            tags: [edge]
            failure: คมมีดลื่นออกจากผิวแก้วเหมือนฟันน้ำแข็งเปียก ไม่ทิ้งแม้แต่รอยขีด แก้วเดินไม่ได้หันมา มันแค่เดินต่อ และ{name}ยืนอยู่ระหว่างมันกับผนัง ขอบไหล่ของมันบาดเข้ามาถึงเนื้อ
          - id: glass_pot
            label: ตีกระทะกับฝาหม้อ เดินเข้าไปหา
            kind: item
            stat: STR
            tags: [noise]
          - id: glass_hammer
            label: คว้าค้อนปอนด์ของช่างห้องข้างๆ ทุบเข่ามัน
            kind: attack
            tags: [blunt]
          - id: glass_roof
            label: ปีนออกทางหลังคา
            kind: flee
      - text: มันถึงห้องที่สอง แขนที่แกว่งตามจังหวะเดินฟาดประตูห้องนั้นหลุดจากบานพับ ข้างในมีเสียงเด็กร้อง
        answer: quick
        moves:
          - id: glass_lamp
            label: วิ่งไปปีนเสา หมุนปิดตะเกียงฟ้าหัวตรอก
            kind: quick
            success: แสงฟ้าหัวตรอกดับ แก้วเดินหยุดกลางก้าว ยืนโงนเงนเหมือนคนลืมว่าลุกมาทำอะไร แสงในอกมันเต้นถี่ขึ้น
          - id: glass_bell
            label: ดึงเชือกระฆังเตือนไฟประจำตรอก ดึงไม่หยุด
            kind: item
            stat: DEX
            tags: [noise]
          - id: glass_beam
            label: เอาคานไม้ขัดขวางตรอก ยันไว้ด้วยตัว
            kind: guard
          - id: glass_roof2
            label: ถอยขึ้นหลังคา ดูจากข้างบน
            kind: flee
      - text: แก้วเดินหันทั้งตัวมาทาง{name}เป็นครั้งแรก มันไม่มีตา แต่แสงในอกย้ายมาอยู่ด้านที่หันมา มันยกแขนขึ้น ช้า หนัก เหมือนปั้นจั่นท่าเรือ
        answer: attack
        moves:
          - id: glass_brick
            label: คว้าอิฐทั้งก้อน ทุบเข้าที่อกตรงแสง
            kind: attack
            tags: [blunt]
          - id: glass_duck
            label: ลอดใต้แขน ให้มันฟาดผนังเอง
            kind: quick
            success: แขนแก้วลงบนผนังอิฐเต็มน้ำหนัก ผนังไม่เป็นอะไร แขนหักตั้งแต่ศอก ท่อนที่หลุดตกแตกบนพื้นหิน เสียงเหมือนโคมระย้าหล่น แก้วเดินก้มมองตอแขนตัวเอง
          - id: glass_oil
            label: สาดน้ำมันตะเกียงใส่ แล้วจุด
            kind: item
            stat: DEX
            tags: [fire]
            failure: ไฟลุกท่วมตัวมัน และแก้วก็แค่อุ่นขึ้น แสงข้างในสว่างกว่าเดิมเสียอีก มันเดินฝ่าเปลวมาทั้งอย่างนั้น แขนร้อนแดงฟาดเข้าที่บ่าของ{name}
          - id: glass_roof3
            label: วิ่งเข้าห้อง ปีนออกช่องหลังคา
            kind: flee
      - text: คนทั้งตรอกออกมายืนที่ประตูแล้ว บางคนถือกระทะ บางคนถือค้อน ยังไม่มีใครกล้าเป็นคนแรก แก้วเดินก้าวต่ออีกก้าว ไปทางตะเกียง
        answer: guard
        moves:
          - id: glass_count
            label: ตะโกนให้ทั้งตรอกตีทุกอย่างที่ถืออยู่พร้อมกัน นับสาม
            kind: talk
            tags: [noise]
            success: กระทะ ฝาหม้อ ค้อน ราวเหล็ก ระฆังไฟ ทั้งตรอกดังขึ้นทีเดียว แก้วเดินหยุด รอยร้าวแตกกิ่งไปทั่วตัวเหมือนน้ำแข็งบนบ่อ แสงข้างในรั่วออกมาตามรอยทุกเส้น
          - id: glass_last
            label: เข้าไปทุบเองให้จบ
            kind: attack
            tags: [blunt]
          - id: glass_hold
            label: ยืนขวางหน้าประตูห้องตัวเอง ไม่ให้มันเฉียดเข้ามา
            kind: guard
          - id: glass_roof4
            label: ถอยขึ้นหลังคา ปล่อยให้มันไปหาตะเกียง
            kind: flee
    win:
      text: |
        มันแตกจากข้างในออกมา ไม่ดังอย่างที่คิด เสียงเหมือนคนถอนใจยาวๆ แล้วทั้งร่างก็ทรุดลงเป็นกองเศษแก้วสูงถึงเข่า แสงฟ้าที่เคยอยู่ในอกลอยขึ้นไปช้าๆ ผ่านหลังคา หายไปทางดาว

        เช้ามาคนของสมาคมโรงกลั่นเอาเกวียนมาตักเศษแก้วไปทั้งกอง จ่ายค่าปิดปากห้องละสองเหรียญ ห้องของ{name}ได้ห้า เด็กในตรอกยังเก็บเศษที่ตกร่องหินมาเล่นกันอยู่อีกเป็นเดือน
      effects: { gold: 5, stats: { CON: 1 }, flags: [broke_glass_walker] }
    lose:
      text: |
        {name}ลืมตาขึ้นมาในห้องของเพื่อนบ้าน มีผ้าพันตั้งแต่ไหล่ถึงศอก หมอคีบเศษแก้วออกมาได้สิบเจ็ดชิ้น วางเรียงไว้ในจานให้ดู

        แก้วเดินไปถึงตะเกียงฟ้าหัวตรอก ยืนอยู่ใต้โคมจนฟ้าสาง แล้วก็หยุดเดินไปเฉยๆ ตอนนี้มันยังยืนอยู่ตรงนั้น สมาคมโรงกลั่นเอาผ้าใบมาคลุมไว้ และไม่มีใครตอบว่าจะมาเอาไปเมื่อไร
      effects: { flags: [glass_walker_stands] }
    stalemate:
      text: |
        แก้วเดินไปถึงตะเกียงฟ้าหัวตรอก มันยืนอยู่ใต้โคม เงยส่วนที่ควรเป็นหน้าขึ้นหาแสง แล้วก็ไม่ขยับอีกเลย

        ตอนนี้มันยังยืนอยู่ตรงนั้น สมาคมโรงกลั่นเอาผ้าใบมาคลุม ตั้งป้ายห้ามแตะ และไม่มีใครตอบว่าจะมาเอาไปเมื่อไร ห้องแถวทั้งเจ็ดห้องซ่อมหน้าต่างด้วยเงินตัวเอง
      effects: { gold: -1, flags: [glass_walker_stands] }
    flee:
      text: |
        จากบนหลังคา{name}เห็นมันเดินผ่านห้องแถวทั้งเจ็ดห้อง ไหล่ครูดไปตลอดแนว ประตูหน้าต่างด้านตรอกไม่เหลือสักบาน ห้องที่สามก็เหมือนห้องอื่น

        มันไปหยุดอยู่ใต้ตะเกียงฟ้า แล้วไม่ขยับอีก เช้ามา{name}ลงไปเก็บของที่ยังใช้ได้ ได้ไม่เต็มหีบ
      effects: { gold: -4, flags: [glass_walker_stands] }
    death:
      text: |
        แขนแก้วลงมาครั้งเดียว {name}ไม่ได้ยินเสียงอะไรหลังจากนั้น มีแต่แสงฟ้าที่เต้นช้าๆ อยู่ตรงหน้า ใกล้มาก แล้วก็ไกลออกไป

        แก้วเดินก้าวข้ามไป ไปหาตะเกียง

- id: adult.enc_extra_shadow
  stage: adult
  weight: 10
  scene: road
  time: night
  mark: เจอเงาที่สามบนสะพานหิน
  when:
    age: [28, 60]
    not_traits: [curse_brand]
  text: |
    ทางกลับบ้านคืนนี้ไม่มีเมฆ ดาวดวงใหม่ดวงหนึ่งขึ้นสูงพอจะให้เงา {name}เดินคนเดียว ตะเกียงน้ำมันในมือเหลือไส้อีกไม่มาก

    ตรงสะพานหิน{name}หยุดผูกเชือกรองเท้า ก้มลงแล้วเห็นเงาของตัวเองบนพื้นสะพานสองเงา เงาหนึ่งจากตะเกียง ทอดไปข้างหลัง อีกเงาจากดาว ทอดไปทางซ้าย

    เงาที่สามทอดไปข้างหน้า ทางที่ไม่มีแสงอะไรส่องมา มันยาวกว่าสองเงาแรก และตอน{name}ยืนขึ้น มันยืนขึ้นช้ากว่า
  encounter:
    foe: extra_shadow
    beats:
      - text: เงาเกินลุกขึ้นจากพื้นทั้งตัว แบนอยู่ครู่หนึ่งเหมือนกระดาษที่ตัดเป็นรูปคน แล้วค่อยหนาขึ้น มันยืนขวางปลายสะพานฝั่งบ้าน ทำท่าผูกเชือกรองเท้าตาม ช้าไปหนึ่งจังหวะ
        moves:
          - id: shade_wick
            label: หมุนไส้ตะเกียงขึ้นสุด ชูเข้าหามัน
            kind: item
            stat: WIS
            tags: [light]
          - id: shade_blade
            label: ชักมีดฟันกลางตัว
            kind: attack
            tags: [edge]
            failure: มีดผ่านมันไปโดยไม่ติดอะไรเลย เหมือนฟันเงาบนผนัง ซึ่งมันก็เป็นอย่างนั้น มือของมันผ่านกลับเข้ามาในอกของ{name}บ้าง ไม่มีแผล แต่ลมหายใจหายไปครึ่งหนึ่ง
          - id: shade_look
            label: ดูขอบของมันตรงที่แสงตะเกียงตกถึง
            kind: read
            stat: INT
            success: ตรงที่แสงตะเกียงเลียถึง ขอบของมันขาดเป็นริ้วเหมือนผ้าเก่า และมันขยับเท้าหนีวงแสงทุกครั้งที่ตะเกียงแกว่ง มันไม่กลัวเหล็ก มันกลัวไฟ และกลัวที่สุดเมื่อไฟมาจากหลายทาง
          - id: shade_still
            label: ยืนนิ่ง ไม่ให้มันมีอะไรเลียนแบบ
            kind: guard
          - id: shade_back
            label: ถอยกลับไปทางที่มา ไปขอนอนโรงเตี๊ยมริมทาง
            kind: flee
      - text: มันเลิกเลียนแบบ ไหลลงไปแบนกับพื้นสะพานแล้วพุ่งเข้ามาตามร่องหิน เร็วเท่าเงาเมฆ จะมาทาบทับเงาจริงที่เท้าของ{name}
        answer: quick
        moves:
          - id: shade_rail
            label: กระโดดขึ้นยืนบนราวสะพาน ให้เงาจริงตกลงไปในน้ำ
            kind: quick
            success: เงาเกินไหลมาถึงที่ที่เท้าของ{name}เคยอยู่ แล้วไม่เจออะไรให้ทาบ มันวนอยู่ตรงนั้นสองรอบเหมือนหมาหาไม่เจอกลิ่น ข้างล่าง เงาจริงของ{name}สั่นอยู่บนผิวน้ำ มันไม่ลงไปตาม
          - id: shade_ring
            label: เทน้ำมันตะเกียงเป็นวงรอบเท้า แล้วจุด
            kind: item
            stat: DEX
            tags: [fire]
          - id: shade_straddle
            label: วางตะเกียงลงระหว่างเท้า ยืนคร่อมแสงไว้
            kind: guard
            tags: [light]
          - id: shade_back2
            label: หันหลังวิ่งกลับไปทางโรงเตี๊ยม
            kind: flee
      - text: ไส้ตะเกียงเริ่มสั้น เปลวหดลงมาครึ่งหนึ่ง เงาเกินยืนรออยู่ตรงขอบวงแสง ทุกครั้งที่เปลววูบ มันก้าวเข้ามาเท่านั้น
        answer: guard
        moves:
          - id: shade_cup
            label: เอามือป้องเปลว หันหลังบังลม ถือให้นิ่งที่สุด
            kind: guard
          - id: shade_torch
            label: ฉีกแขนเสื้อพันปลายไม้ จุ่มน้ำมัน ทำคบอีกดวง
            kind: item
            stat: STR
            tags: [fire]
          - id: shade_dash
            label: วิ่งฝ่ามันไปทั้งอย่างนั้น ถือตะเกียงนำหน้า
            kind: quick
            tags: [light]
          - id: shade_back3
            label: ถอยไปตามทางเดิมทีละก้าว ไม่หันหลังให้
            kind: flee
      - text: ปลายสะพานฝั่งบ้านมีกองหญ้าแห้งที่คนเลี้ยงวัวทิ้งไว้ เงาเกินยืนอยู่หน้ากองนั้นพอดี ข้างหลังมันคือทางกลับบ้าน
        answer: quick
        moves:
          - id: shade_hay
            label: วิ่งอ้อมไปจุดกองหญ้าข้างหลังมัน
            kind: quick
            tags: [fire]
            success: หญ้าแห้งลุกพรึบทั้งกอง เงาเกินอยู่ระหว่างไฟสองทาง ตะเกียงข้างหน้า กองหญ้าข้างหลัง มันไม่มีด้านไหนให้ทอดไป ขอบของมันม้วนเข้าหากันเหมือนกระดาษโดนเปลว
          - id: shade_glass
            label: ถอดกระจกครอบตะเกียง หันสะท้อนแสงเข้าหามันอีกด้าน
            kind: item
            stat: INT
            tags: [light]
          - id: shade_sit
            label: นั่งลงกลางวงแสง กอดตะเกียงไว้ รอฟ้าสาง
            kind: guard
          - id: shade_back4
            label: ถอยกลับไปทางโรงเตี๊ยม เดินหันหน้าเข้าหามันตลอดทาง
            kind: flee
    win:
      text: |
        เงาเกินหดลงทุกครั้งที่แสงแตะ เหลือเท่าเด็ก เท่าหมา เท่าฝ่ามือ สุดท้ายเป็นรอยดำรูปคนบนพื้นสะพานหิน ไม่ขยับอีก {name}ก้าวข้ามไปโดยไม่เหยียบ

        รอยนั้นยังอยู่บนสะพาน ฝนชะไม่ออก คนเดินผ่านนึกว่าเป็นคราบน้ำมัน หลังคืนนั้น{name}ไม่เคยออกเดินกลางคืนโดยไม่มีไฟสองดวง
      effects: { stats: { WIS: 1 }, flags: [killed_extra_shadow] }
    lose:
      text: |
        คนขับเกวียนนมเจอ{name}ตอนเช้ามืด นอนอยู่กลางสะพาน ตัวเย็นเหมือนคนตกน้ำ ตะเกียงดับอยู่ข้างมือ เขาเอาผ้าคลุมล่อมาห่มให้ แล้วพาไปส่งถึงบ้าน

        ตลอดวันนั้น{name}ยืนที่ไหนก็ก้มลงนับเงาตัวเองก่อน
    stalemate:
      text: |
        ขอบฟ้าตะวันออกเป็นสีเทา ดาวดวงใหม่จางลง เงาเกินจางตาม มันยืนอยู่ที่ปลายสะพานจนบางเท่าไอน้ำ ยกมือขึ้นข้างหนึ่งเลียนแบบท่าที่{name}ยกตะเกียง แล้วก็ไม่มีอะไรตรงนั้น

        {name}ถึงบ้านตอนไก่ขัน นอนไม่หลับทั้งวัน
    flee:
      text: |
        {name}กลับไปถึงโรงเตี๊ยมริมทาง ทุบประตูจนเจ้าของลงมาเปิด ขอนั่งข้างเตาผิงจนเช้า จ่ายค่าฟืนสองเท่าให้เขาเติมไฟทั้งคืน

        เช้ามาเดินข้ามสะพานเดิมกลางแดด มีเงาเดียว {name}นับสามรอบ
      effects: { gold: -1 }
    death:
      text: |
        ตะเกียงดับ {name}ได้ยินเสียงไส้ตะเกียงขาด เสียงเล็กมาก

        ในความมืดมีมือที่ไม่มีน้ำหนักวางลงบนอก แล้วกดผ่านเข้าไป เช้ามาคนขับเกวียนนมเจอตะเกียงเปล่าบนสะพาน กับเงารูปคนบนพื้นหินสองเงา ไม่มีเจ้าของทั้งคู่

- id: adult.enc_fire_cub
  stage: adult
  weight: 10
  scene: smithy
  when:
    age: [26, 60]
  text: |
    {name}เอาใบจอบที่บิ่นไปให้โรงตีเหล็กต่อคม ช่างไม่อยู่ ไปงานแต่งหลานที่หมู่บ้านถัดไป เหลือแต่ลูกมือเด็กคนหนึ่งที่กำลังปิดร้าน

    เด็กคนนั้นดับเตาด้วยน้ำ ทั้งถัง ทีเดียว แบบที่ช่างตีเหล็กทุกคนสอนลูกมือว่าอย่าทำ และไม่เคยบอกว่าทำไม

    ไอน้ำขาวพุ่งขึ้นถึงขื่อ พอจางลง ในเตามีของนั่งอยู่บนถ่านเปียก ตัวเท่าหมา สี่ขา ขนเป็นเปลวไฟสีส้มที่ลุกทวนน้ำ มันสะบัดตัวแบบแมวเปียก ละอองไฟกระเด็นไปติดผ้ากันเปื้อนหนังบนตะปู แล้วมันก็เห็นเชือกที่ห้อยจากสูบลม
  encounter:
    foe: fire_cub
    beats:
      - text: ลูกเสือไฟกระโจนตะปบเชือกสูบลม เชือกไหม้ขาดในทีเดียว มันผิดหวัง หันไปมองกองถ่านไม้ในมุมร้าน แล้วมองเสาเรือนซึ่งเป็นไม้ทั้งต้น หางตวัดไปมา ลูกมือยืนตัวแข็งอยู่หลังทั่ง
        moves:
          - id: cub_milk
            label: ถามลูกมือว่าชามนมของช่างอยู่ไหน แล้วเอามาวางข้างเตา
            kind: item
            stat: CHA
            tags: [bait]
            success: ลูกเสือไฟดมก่อน จามออกมาเป็นประกายไฟ แล้วก้มลงเลีย นมเดือดปุดทุกครั้งที่ลิ้นแตะ มันหมอบลงข้างชาม เปลวที่ขนเตี้ยลงเหลือสีส้มหม่นแบบถ่านใกล้มอด
          - id: cub_tongs
            label: คว้าคีมยาว กันมันไว้ไม่ให้ออกจากลานหินหน้าเตา
            kind: guard
          - id: cub_chain
            label: แกว่งโซ่เหล็กล่อให้มันเล่น ลากห่างออกจากเสา
            kind: quick
            tags: [bait]
          - id: cub_axe
            label: คว้าขวานที่แขวนผนัง ไล่ฟัน
            kind: attack
            tags: [edge]
            failure: คมขวานผ่านขนเปลวไปเหมือนฟันกองไฟ ลูกเสือไฟคิดว่าเป็นเกม มันกระโจนเกาะด้ามขวาน ไต่ขึ้นมาถึงมือ ด้ามไม้ติดไฟทั้งด้าม
          - id: cub_leave
            label: ลากลูกมือออกจากร้าน ปล่อยให้เป็นเรื่องของช่าง
            kind: flee
      - text: มันเบื่อเร็ว กระโจนขึ้นไปกลิ้งเล่นบนกองถ่านไม้ ถ่านทั้งกองเริ่มแดงจากข้างใต้ ควันขึ้นถึงหลังคาจาก
        answer: quick
        moves:
          - id: cub_apron
            label: เอาผ้ากันเปื้อนหนังตะครุบมันจากข้างหลัง
            kind: quick
          - id: cub_splash
            label: ตักน้ำจากรางชุบเหล็กสาดใส่
            kind: item
            stat: DEX
            tags: [water]
            success: น้ำโดนมันครึ่งตัว ลูกเสือไฟร้องแง้วเสียงแหลม กระโดดสูงเท่าทั่ง ขนฝั่งที่เปียกดับเป็นสีขี้เถ้า มันถอยไปยืนเลียตัวเองอยู่บนลานหิน มองมาอย่างคนโดนหักหลัง
          - id: cub_scatter
            label: เตะกองถ่านให้กระจายออกบนพื้นหิน แล้วยืนขวางเสา
            kind: guard
          - id: cub_leave2
            label: ออกไปตะโกนเรียกคนทั้งหมู่บ้าน
            kind: flee
      - text: ลูกเสือไฟง่วง มันหาวออกมาเป็นเปลว เดินวนหาที่นอน แล้วเลือกกองฟางรองลังข้างฝา
        answer: guard
        moves:
          - id: cub_block
            label: นั่งขวางหน้ากองฟาง กางผ้าหนังกันไว้ ให้มันหาที่อื่นเอง
            kind: guard
          - id: cub_bed
            label: ยกกระทะเหล็กใส่ถ่านอุ่นๆ ไปวางบนลานหิน ทำที่นอนที่ดีกว่าให้
            kind: item
            stat: STR
            tags: [bait]
          - id: cub_soak
            label: ราดน้ำกองฟางให้ชุ่มก่อนมันไปถึง
            kind: item
            stat: CON
            tags: [water]
          - id: cub_leave3
            label: ถอยออกจากร้านก่อนฟางติดไฟ
            kind: flee
    win:
      text: |
        ลูกเสือไฟขดตัวบนลานหินหน้าเตา หางพันจมูก เปลวที่ขนเตี้ยลงเรื่อยๆ จนเป็นแค่ไอร้อน แล้วมันก็จมลงไปในหินเหมือนถ่านมอด เหลือรอยไหม้รูปแมวนอนไว้บนพื้น

        ช่างกลับมาเห็นรอยนั้นก็รู้ทันทีว่าเกิดอะไร เขาต่อคมจอบให้{name}โดยไม่คิดเงิน และให้ลูกมือขัดพื้นร้านคนเดียวทั้งเดือน เว้นรอยนั้นไว้
      effects: { stats: { WIS: 1 }, flags: [calmed_fire_cub] }
    lose:
      text: |
        {name}นั่งอยู่นอกร้านกับลูกมือ มือสองข้างจุ่มอยู่ในรางน้ำม้า ขากางเกงไหม้ถึงเข่า ข้างในร้านมีเสียงของหล่นเป็นระยะ กับเสียงแง้วพอใจ

        มันเล่นอยู่จนเที่ยงคืนแล้วหายไปเอง ร้านยังอยู่ เพราะผนังเป็นหิน ส่วนของที่เป็นไม้ในร้านไม่เหลือสักชิ้น รวมทั้งด้ามจอบของ{name}
      effects: { gold: -1 }
    stalemate:
      text: |
        ช่างตีเหล็กกลับมาถึงพอดี ยังเมานิดๆ จากงานแต่ง เขามองเข้าไปในร้าน ถอนใจ แล้วเดินไปที่เตา ผิวปากต่ำๆ เสียงเดียว แบบที่คนเรียกแมว

        ลูกเสือไฟหูตั้ง เดินตามเสียงกลับเข้าไปในเตา ขดตัวลงบนถ่าน ช่างบิดหูลูกมือ แล้วหันมาบอก{name}ว่าจอบพรุ่งนี้มาเอา
    flee:
      text: |
        ไฟไหม้หลังคาจากก่อน แล้วลามลงขื่อ คนทั้งหมู่บ้านมาช่วยกันส่งถังน้ำ ซึ่งทำให้ทุกอย่างแย่ลงอยู่พักหนึ่ง จนคนแก่คนหนึ่งตะโกนให้ใช้ทรายแทน

        ช่างกลับมาเจอร้านที่เหลือแต่ผนังหินกับทั่ง เขาไม่ได้ว่าอะไร{name} เขาว่าลูกมือ แต่จอบเล่มนั้นไม่มีใครต่อคมให้แล้ว
      effects: { gold: -1 }

- id: adult.enc_break_in
  stage: adult
  weight: 10
  scene: home
  time: night
  when:
    age: [26, 60]
  cast:
    mate: { id: partner, optional: true }
  text: |
    เสียงที่ปลุก{name}ไม่ใช่เสียงดัง เป็นเสียงเบาที่ผิดที่ กลอนหน้าต่างครัวขยับทีละนิด แบบที่มีคนเอาใบมีดสอดงัดจากข้างนอก

    {name}ลุกจากที่นอนโดยไม่จุดไฟ ในครัวมีเงาคนหนึ่งคร่อมขอบหน้าต่างอยู่ ขาข้างหนึ่งเข้ามาแล้ว มือถือชะแลงสั้น ถุงผ้าเปล่าพาดบ่า เขายังไม่เห็นว่ามีคนยืนอยู่ในความมืด

    หีบเก็บเงินอยู่ใต้ตู้กับข้าว ห่างจากเขาสามก้าว
  encounter:
    foe: bandit
    name: ขโมยงัดบ้าน
    morale: 2
    beats:
      - text: ขโมยลงมายืนบนพื้นครัวได้ทั้งตัว หยุดฟัง หายใจทางปาก กลิ่นเหล้าถูกๆ ลอยมาถึงนี่ เขาเริ่มคลำไปตามชั้น
        moves:
          - id: thief_voice
            label: พูดขึ้นจากความมืด เสียงเรียบๆ ว่าหน้าต่างบานเดิมยังเปิดอยู่
            kind: talk
            success: เขาสะดุ้งจนชะแลงกระแทกหม้อ ยืนตัวแข็ง หันหาเสียงไม่เจอ คนที่มองไม่เห็นว่าเจ้าของบ้านยืนตรงไหน ถืออะไร มีกี่คน คิดเลขออกมาได้คำตอบเดียว เขาถอยไปทางหน้าต่างครึ่งก้าว
          - id: thief_jump
            label: พุ่งเข้าชนจากข้างหลังตอนเขาหันไปทางตู้
            kind: attack
          - id: thief_pans
            label: ปัดกระทะทั้งราวลงพื้น ให้ทั้งซอยตื่น
            kind: item
            stat: DEX
            tags: [noise]
          - id: thief_mate
            label: ปลุก{mate}ให้ไปยืนขวางประตูหลัง ส่วนตัวเองขวางหน้าต่าง
            kind: guard
            ally: mate
            success: "{mate}ไม่ถามสักคำ ลุกไปยืนที่ประตูหลังพร้อมไม้คานหาบน้ำ ขโมยหันไปเจอเงาหนึ่ง หันกลับมาเจออีกเงาหนึ่ง ถุงผ้าบนบ่าเขาร่วงลงพื้นเอง"
          - id: thief_hide
            label: ถอยกลับเข้าห้องนอน ลงกลอน ปล่อยให้เขาเอาไป
            kind: flee
      - text: เขาตัดสินใจสู้เพื่อหาทางออก ชะแลงเหวี่ยงมาในความมืด กว้าง สูง ไม่ได้เล็งอะไร
        answer: guard
        moves:
          - id: thief_stool
            label: ยกม้านั่งขึ้นรับ
            kind: guard
          - id: thief_sweep
            label: ย่อตัวลง กวาดขาเขา
            kind: quick
          - id: thief_face
            label: บอกเขาว่าเห็นหน้าแล้ว และรู้ด้วยว่าบ้านอยู่ไหน
            kind: talk
          - id: thief_hide2
            label: ถอยกลับเข้าห้องนอน ดันตู้ขวางประตู
            kind: flee
      - text: เขาคว้าหีบเก็บเงินได้ หนีบไว้ใต้รักแร้ ขาข้างหนึ่งขึ้นขอบหน้าต่างแล้ว
        answer: quick
        moves:
          - id: thief_collar
            label: คว้าคอเสื้อ กระชากกลับลงมา
            kind: quick
          - id: thief_shutter
            label: กระแทกบานหน้าต่างปิดใส่
            kind: attack
          - id: thief_deal
            label: บอกว่าวางหีบลง แล้วจะไม่มีใครตะโกนเรียกยาม
            kind: talk
          - id: thief_hide3
            label: ปล่อยเขาไป หีบใบหนึ่งไม่คุ้มกับชะแลงที่หัว
            kind: flee
    win:
      text: |
        ขโมยออกไปทางที่เข้ามา เร็วกว่าขาเข้ามาก ทิ้งถุงผ้าเปล่ากับชะแลงสั้นไว้บนพื้นครัว รองเท้าข้างหนึ่งค้างอยู่ที่ขอบหน้าต่าง หีบยังอยู่ในบ้าน

        เช้ามา{name}เปลี่ยนกลอนหน้าต่างครัวเป็นเหล็ก ชะแลงเล่มนั้นเหล็กดี เก็บไว้ใช้งัดฝาหีบ
      effects: { flags: [kept_thief_crowbar] }
    lose:
      text: |
        {name}นั่งพิงตู้กับข้าว คิ้วแตก เลือดไหลเข้าตาข้างหนึ่ง หน้าต่างครัวเปิดอ้า ลมกลางคืนพัดม่านเข้าพัดม่านออก

        ที่ใต้ตู้เหลือรอยสี่เหลี่ยมบนฝุ่น ตรงที่หีบเคยวาง
      effects: { gold: -8 }
    stalemate:
      text: |
        หมาบ้านข้างๆ เห่าขึ้นก่อน แล้วไฟก็ติดทีละบ้านตลอดซอย ขโมยทิ้งทุกอย่างในมือ ปีนออกหน้าต่างไปได้พร้อมถุงเปล่า

        ของในครัวแตกไปครึ่งชั้น หีบยังอยู่ เพื่อนบ้านมายืนดูกันที่รั้วจนเกือบสว่าง ทุกคนมีคำแนะนำเรื่องกลอน
      effects: { gold: -1 }
    flee:
      text: |
        ชะแลงเล่มนั้นเป็นเหล็ก หัวของ{name}ไม่ใช่ เช้ามาหีบเก็บเงินหายไป เนื้อเค็มที่แขวนไว้ก็หาย ขโมยยังอุตส่าห์ปิดหน้าต่างให้ก่อนไป

        {name}เปลี่ยนกลอนเป็นเหล็กในวันนั้น ช้าไปหนึ่งคืน
      effects: { gold: -8 }
