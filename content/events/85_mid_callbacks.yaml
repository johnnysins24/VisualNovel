# ชุด 3b–3c วัยผู้ใหญ่ อายุ 25 ถึง 40: ปมเก่าจากวัยเด็กและวัยรุ่นกลับมา
# 3b (25–32) เด็กที่ทางสามแพร่ง โอรีวัล กล่องดนตรี บัญชีเบเลค นักล่าแม่มด โนริค
# 3c (33–40) ปิดปม เวลน์ ลูกชายคนใต้โครงเรือเหาะ เลื่อยเงิน กระสอบแป้ง สงครามถ่าน นักล่าแม่มด
# แม่ชีโทเรนกับท่านย่าปรากฏได้แค่ในความจำหรือในของ ไม่บอกว่ายังอยู่หรือไม่

# ---------- 3b ----------
- id: adult.mid_crossroads_grown
  stage: adult
  weight: 10
  when:
    age: [25, 32]
    flags: [saved_crossroads_baby]
  text: |
    ขบวนเกวียนที่{name}เดินทางไปด้วยหยุดกลางทางเขาตอนบ่าย ต้นไม้ล้มขวางทางอยู่ต้นหนึ่ง รอยขวานที่โคนยังใหม่ คนเจ็ดคนลงมาจากเนินทั้งสองข้าง หัวหน้าเป็นผู้หญิงอายุไม่ถึงยี่สิบ บนหัวมีเขาสองข้างยาวเท่านิ้วกลาง โค้งไปข้างหลัง ไม่ได้ซ่อน ไม่ได้เลื่อย นางเดินเลียบขบวนเก็บเงินทีละเกวียน พูดเก่ง พูดไม่หยุด

    นางบอกคนขับเกวียนคันหน้าว่าชื่อแดดแรก แม่ชีวิหารอีเซลตั้งให้ เพราะมีคนเอานางไปส่งที่ช่องส่งขนมปังตอนเช้า ก่อนหน้านั้นนางนอนอยู่ในตะกร้าหวายกลางทางสามแพร่งหลังโรงสีบ้านเงาเสา ใครทิ้งไว้นางไม่รู้ ใครเก็บไปนางก็ไม่รู้ นางหัวเราะตอนเล่า เหมือนเล่าเรื่องของคนอื่น

    นางมาถึงเกวียนของ{name}แล้ว ยื่นมือออกมา บอกว่าเกวียนละสามเหรียญ
  choices:
    - id: tell_her
      label: บอกนางว่าใครเป็นคนอุ้มนางไปวิหารเช้าวันนั้น
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          แดดแรกหยุดหัวเราะ ถามว่ารู้ได้ยังไง {name}เล่าเรื่องวัวที่หลุดคอก ตะกร้าหวาย ผิวเด็กที่เขียวคล้ำเพราะหนาว ตุ่มแข็งสองตุ่มเท่าเม็ดถั่ว และขนมปังค้างคืนที่แม่ชียื่นออกมาให้ นางฟังโดยที่มือยังยื่นค้างอยู่ คนของนางเริ่มขยับเท้า

          นางสั่งให้ยกต้นไม้ออกจากทาง ก่อนขบวนจะออก นางเดินกลับมาถามว่าภาคีผู้เฝ้าผนึกรับคนมีเขาจริงไหม {name}บอกว่าจริง ปลายปีนั้นได้ข่าวว่าทางเขาสายนั้นไม่มีโจรอีก และป้อมของภาคีที่ชายแดนเถ้ามีทหารใหม่คนหนึ่งที่พูดไม่หยุด
        effects: { alignment: { moral: 1 }, flags: [crossroads_child_good] }
      failure:
        text: |
          แดดแรกฟังได้ครึ่งเดียวแล้วหัวเราะดังกว่าเดิม นางบอกว่าทุกเมืองบนทางนี้มีคนบอกว่าเป็นคนอุ้มนาง ทุกคนอยากได้ส่วนลด ปีที่แล้วมีถึงสามคน

          นางเก็บเงินสามเหรียญจากเกวียนของ{name}เต็มราคา ตบไหล่{name}หนึ่งที แล้วเดินไปเกวียนคันต่อไป เล่าเรื่องตะกร้าหวายให้คนขับคันนั้นฟังอีกรอบ
        effects: { gold: -3, flags: [crossroads_child_bandit] }
    - id: pay_and_go
      label: จ่ายสามเหรียญตามที่นางขอ แล้วปล่อยนางไป
      requires: { min_gold: 3 }
      text: |
        {name}วางเหรียญสามเหรียญลงบนฝ่ามือนาง นางนับด้วยนิ้วโป้ง แล้วยิ้มให้เหมือนยิ้มให้ลูกค้า

        ขบวนผ่านไปได้ตอนตะวันคล้อย {name}หันกลับไปมองครั้งหนึ่ง นางยืนอยู่บนต้นไม้ที่ล้ม เขาสองข้างรับแดดบ่ายจนเป็นสีทองแดง กำลังนับเงินของทั้งขบวนให้คนของนางฟังทีละเกวียน
      effects: { gold: -3, flags: [crossroads_child_bandit] }
    - id: fight_her
      label: คว้าข้อมือนางไว้ ไม่ให้เก็บเงินขบวนนี้
      habit: hot_headed
      check: { stat: STR, dc: 14, foe: human }
      success:
        text: |
          {name}คว้าข้อมือนางไว้แน่น นางเหวี่ยงหัว เขาข้างหนึ่งเฉี่ยวคาง{name}จนปากแตก แต่มือไม่หลุด คนขับเกวียนสามคนลงมาจากเกวียนพร้อมไม้คาน คนของนางมองหัวหน้า แล้วมองไม้คาน

          แดดแรกบิดข้อมือหลุดได้ในที่สุด ถอยขึ้นเนินไปพร้อมคนของนาง ถุงเงินที่เอวนางขาดตกอยู่บนทาง ข้างในมีสองเหรียญ กับเศษผ้าสีซีดผืนเท่าฝ่ามือ พับเป็นสี่เหลี่ยมเรียบร้อย ลายเดียวกับผ้าที่{name}เคยเห็นในตะกร้าหวายกลางทางสามแพร่ง
        effects: { stats: { STR: 1 }, gold: 2, flags: [fought_crossroads_child, crossroads_child_bandit] }
      failure:
        text: |
          {name}คว้าข้อมือนางได้ นางไม่ดึงหนี นางก้าวเข้ามาแทน เข่าของนางขึ้นมาที่ท้อง{name}ทีเดียว ลมหายใจหายไปหมด {name}ทรุดลงข้างล้อเกวียน

          นางเก็บเงินสามเหรียญจากเกวียนของ{name} บวกค่าเหนื่อยอีกนิดหน่อยจากคันอื่น แล้วบอกคนขับว่าคราวหน้าให้เลือกคนคุมขบวนที่ไม่ตื่นเต้นง่าย
        effects: { hp: -3, gold: -3, flags: [crossroads_child_bandit] }
    - id: tell_her_the_house
      label: บอกนางว่ารอยเท้าข้างตะกร้าเดินกลับไปที่บ้านหลังไหนในบ้านเงาเสา
      requires: { flag: knows_crossroads_mother }
      text: |
        {name}ไม่ได้บอกว่าตัวเองเป็นใคร บอกแค่ว่าหลายปีต่อมามีตะกร้าใบเดียวกันวางอยู่ที่เดิม รอยเท้าผู้ใหญ่รอยเดียว ส้นสึก เดินเลี่ยงถนนใหญ่ ข้ามรั้วไม้ตรงที่ไม้ผุ ไปหยุดที่ประตูหลังของบ้านหลังที่สามจากบ่อน้ำ

        แดดแรกไม่เก็บเงินจากเกวียนที่เหลือ นางขึ้นม้า ขี่ออกไปทางทิศที่บ้านเงาเสาอยู่ คนของนางยืนอยู่กลางทาง มองต้นไม้ที่ล้ม แล้วมองหน้ากันเอง
      effects: { flags: [crossroads_child_seeks_mother] }
    - id: tell_her_the_sister
      label: บอกนางว่าที่บ้านป้าโรเสนคนเลี้ยงห่านมีเด็กอีกคนจากทางสามแพร่งเดียวกัน
      requires: { flag: crossroads_baby_kept }
      text: |
        {name}เล่าเรื่องตะกร้าใบที่สอง ที่วางอยู่ที่เดิมหลายปีต่อมา และเด็กที่ร้องเสียงดังกว่าคนแรก ป้าโรเสนถักหมวกไหมพรมใบเล็กให้ใส่ทุกวัน ไม่ว่าแดดจะร้อนแค่ไหน ใครถามป้าก็ตอบว่าหลานจากหมู่บ้านอื่น

        แดดแรกเอามือแตะเขาตัวเองข้างหนึ่งโดยไม่รู้ตัว นางถามว่าเด็กคนนั้นมีเขาไหม {name}บอกว่าหมวกไหมพรมใบนั้นไม่เคยถอด นางไม่เก็บเงินจากเกวียนของ{name} แล้วเดินไปถามทางไปบ้านเงาเสาจากคนขับเกวียนคันหน้า หมู่บ้านที่นางเกิด และไม่เคยรู้ทางกลับ
      effects: { alignment: { moral: 1 }, flags: [crossroads_child_seeks_sister] }

- id: adult.mid_orival_bounty
  stage: adult
  weight: 10
  when:
    age: [25, 32]
    flags: [origin_elf_bough]
  text: |
    ประกาศจับติดอยู่ที่ประตูบ้านตีนไม้ ประตูค่ายทหาร และเสาทุกต้นในตลาดชายป่า รูปวาดเอลฟ์ผมยาวถักรวบด้วยเชือกป่าน ข้อหาเผาค่ายตัดไม้ของบริษัทเจ็ดค่ายในห้าปี ค่ายที่เจ็ดมีคนงานตายสองคน ราชสำนักให้ค่าหัวยี่สิบเหรียญ คนบ้านตีนไม้ยืนอ่านกันเป็นกลุ่ม บางคนอ่านจบแล้วเงยหน้ามองขึ้นไปบนกิ่ง

    คืนนั้นโอรีวัลมาเคาะประตูบ้านของ{name} ผมยังยาวลงมาถึงกลางหลัง หน้าไม่แก่ขึ้นสักวันตั้งแต่{name}จำความได้ เขาอายุมากกว่า{name}เกือบร้อยปี แต่คืนนี้ตาของเขาเหนื่อยเหมือนคนแก่ เขาขอนอนที่นี่สามคืน ทหารขึ้นบันไดเชือกมาค้นทุกบ้านบนกิ่งตั้งแต่เมื่อวาน ยกเว้นบ้านที่ไม่มีใครคิดว่าเขาจะมา
  choices:
    - id: hide_him
      label: ซ่อนเขาไว้ในห้องเก็บเมล็ดใต้หลังคาสามคืน
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ทหารขึ้นมาวันที่สอง สองนาย {name}เปิดประตูให้ค้นทุกห้อง ยกฟูก เปิดหีบ เคาะผนังทีละแผ่น ห้องเก็บเมล็ดอยู่เหนือหัวพวกเขาพอดี ทหารคนหนึ่งเงยหน้ามองเพดาน ฝุ่นเปลือกสนร่วงลงมาบนบ่าเขาเม็ดหนึ่ง เขาปัดออก แล้วเดินลงบันไดไป

          คืนที่สามโอรีวัลลงบันไดไปก่อนสาง ไม่ได้ปลุก{name} บนหมอนในห้องเก็บเมล็ดมีเชือกป่านเส้นหนึ่งที่เขาใช้ถักผมวางไว้ ขดเป็นวงเรียบร้อย
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [hid_orival] }
      failure:
        text: |
          ทหารเห็นรอยนิ้วบนฝุ่นใต้ช่องหลังคา คนหนึ่งเอาปืนยาวกระทุ้งแผ่นไม้ โอรีวัลกระโดดออกทางหน้าต่างด้านหลัง ลงไปบนกิ่งต่ำแล้วหายไปในความมืด เสียงปืนดังตามไปสองนัด

          ทหารจดชื่อ{name}ลงกระดาษก่อนลงบันไดไป ตั้งแต่เดือนนั้นทุกครั้งที่{name}ลงไปบ้านตีนไม้ จะมีทหารคนหนึ่งยืนอยู่ที่ตีนบันได ไม่ถามอะไร แค่ยืน
        effects: { alignment: { law: -1 }, reputation: { crown: -1 }, flags: [hid_orival, crown_suspects_you] }
    - id: turn_him_in
      label: ลงไปบอกทหารตอนเขาหลับ รับค่าหัวยี่สิบเหรียญ
      text: |
        ทหารขึ้นบันไดมาตอนตีสาม โอรีวัลตื่นตอนคนแรกเหยียบบันไดขั้นที่สาม เขาไม่หนี เขาลุกขึ้นนั่งบนฟูก มองหน้า{name}ที่ยืนอยู่ข้างประตู แล้วยื่นข้อมือทั้งสองข้างออกไปให้ทหารมัด

        ทหารนับเหรียญยี่สิบเหรียญวางบนโต๊ะ ตั้งแต่วันนั้นคนบนกิ่งเลิกทัก{name} เด็กๆ ยังทักอยู่จนกว่าผู้ใหญ่จะดึงแขนไป
      effects: { gold: 20, alignment: { law: 1, moral: -1 }, reputation: { crown: 1 }, flags: [turned_in_orival] }
    - id: ask_him_to_stop
      label: ถามเขาว่าจะเผาต่อไปจนถึงเมื่อไร
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          โอรีวัลนั่งเงียบจนเทียนสั้นลงครึ่งนิ้ว แล้วบอกว่าคนสองคนในค่ายที่เจ็ดเขาไม่ได้ตั้งใจ เขานับไม่ได้ว่าต้นไม้ล้มไปกี่ต้นในห้าปีนั้น แต่คนสองคนนั้นเขานับได้ นับทุกคืน

          เขาบอกว่าจะหยุด ไม่ใช่เพราะ{name}ขอ แต่เพราะเขานับต่อไม่ไหว คืนที่สามเขาลงบันไดไปก่อนสาง ทิ้งน้ำเต้าใบหนึ่งไว้ที่หัวเตียง กลิ่นน้ำมันสนยังติดอยู่ ข้างในว่างเปล่า
        effects: { alignment: { moral: 1 }, flags: [orival_stopped_burning] }
      failure:
        text: |
          โอรีวัลหัวเราะในคอ บอกว่าคนตัดไม้ไม่เคยถามต้นไม้ว่าจะตัดไปถึงเมื่อไร เขาจะตอบคำถามนี้ในวันที่มีคนไปถามคนตัดไม้ก่อน

          คืนที่สามเขาลงบันไดไปก่อนสาง เดือนต่อมาประกาศจับฉบับใหม่ติดทับฉบับเก่าที่ประตูบ้านตีนไม้ ค่าหัวขึ้นเป็นสามสิบ ค่ายที่แปด
        effects: { flags: [orival_kept_burning] }
    - id: tell_him_about_the_eldest
      label: บอกเขาว่าคนที่ปีนไปบอกผู้เฒ่าเรื่องน้ำเต้าเมื่อตอนเด็กคือ{name}
      requires: { flag: told_on_orival }
      text: |
        โอรีวัลบอกว่าเขารู้มาตั้งแต่เช้าวันนั้น เขามาหา{name}คืนนี้ก็เพราะเรื่องนั้น คนที่ยอมปีนไปบอกผู้เฒ่าตอนเจ็ดขวบ คือคนที่จะไม่โกหกเขาตอนนี้ แล้วเขาก็ถามว่า{name}คิดว่าเขาควรหยุดไหม

        {name}ตอบตามที่คิด เขาฟังโดยไม่เถียง คืนที่สามเขาลงบันไดไปก่อนสาง ฤดูนั้นไม่มีค่ายไหนไหม้ ฤดูถัดไปก็ไม่มี
      effects: { alignment: { moral: 1 }, flags: [orival_forgave, orival_stopped_burning] }

- id: adult.mid_music_box_owner
  stage: adult
  scene: market
  weight: 10
  when:
    age: [25, 32]
    flags: [bought_music_box]
  text: |
    ช่างซ่อมนาฬิกาแผงท้ายตลาดเปิดฝากล่องดนตรีไม้ดำของ{name}ดู แล้วบอกว่าซ่อมได้ ฟันหวีเหล็กซี่ที่เจ็ดบิ่นไปครึ่งซี่ เปลี่ยนใหม่ได้ในสามวัน สองเหรียญ เขาหมุนลานให้ฟังหนึ่งรอบ เพลงสะดุดที่เสียงที่เจ็ดเหมือนทุกครั้งที่{name}เคยได้ยิน

    หญิงชราคนหนึ่งที่นั่งขายพริกแห้งอยู่แผงข้างๆ เงยหน้าขึ้นตอนเพลงสะดุด นางลุกขึ้นช้าๆ เดินมาด้วยไม้เท้า มองกล่องในมือช่าง แล้วมอง{name} {name}รับกล่องคืนมา เคาะมุมบิ่นสองครั้งก่อนปิดฝา เป็นนิสัยที่ทำมาตั้งแต่ได้กล่องมา ไม่เคยคิดว่าทำไม

    หญิงชราบอกว่าเขาก็เคาะแบบนั้น สองครั้ง ก่อนปิดฝาทุกครั้ง กระดาษแผ่นเล็กในช่องลับใต้ฐาน นางเป็นคนเขียนเองเมื่อห้าสิบกว่าปีก่อน
  choices:
    - id: give_her_the_box
      label: ยื่นกล่องให้นางถือ
      text: |
        หญิงชรากดมุมบิ่นด้วยนิ้วที่สั่น ฐานกล่องเลื่อนออกมาครึ่งนิ้ว นางดึงกระดาษพับแผ่นนั้นออกมา ไม่ได้คลี่อ่าน นางรู้ว่าในนั้นเขียนว่าอะไร แล้วเก็บมันใส่อกเสื้อ

        นางยื่นกล่องคืนให้{name} บอกว่ากล่องเป็นของคนที่เคาะมุมบิ่นสองครั้ง กระดาษเป็นของนาง ทั้งสองอย่างกลับไปอยู่กับเจ้าของแล้ว นางกลับไปนั่งที่แผงพริกแห้ง หันหน้าไปทางถนน
      effects: { items: [black_music_box], flags: [returned_the_note] }
    - id: ask_about_him
      label: ถามนางว่าเจ้าของกล่องเป็นคนแบบไหน
      text: |
        เขาเป็นช่างทำแผนที่ของราชสำนัก เดินทางไปทุกที่ที่ยังไม่มีใครวาด กลับบ้านปีละครั้งในเดือนเกี่ยวข้าว ทุกครั้งที่กลับ เขาจะเข้าร้านรับจำนำท้ายตลาด ถามหากล่องดนตรีเพลงเดียวกันที่ไม่สะดุด ร้านไม่เคยมี ไม่มีร้านไหนเคยมี

        ปีสุดท้ายนางเขียนกระดาษแผ่นนั้นใส่ช่องลับก่อนเขาออกเดินทาง เขาไม่เคยรู้ว่ากล่องมีช่องลับ เขาตายบนเขาทางเหนือในฤดูหนาวปีนั้น นางบอกให้{name}เก็บกล่องไว้ อย่าซ่อมเสียงที่เจ็ด แล้วถามว่า{name}เกิดเดือนไหน {name}บอก นางไม่ได้ถามอะไรต่อ
      effects: { items: [black_music_box], flags: [knows_music_box_story] }
    - id: fix_the_seventh
      label: จ่ายสองเหรียญ ให้ช่างเปลี่ยนฟันซี่ที่เจ็ด
      requires: { min_gold: 2 }
      text: |
        สามวันต่อมาเพลงในกล่องเล่นไปจนจบโดยไม่สะดุด ช่างหมุนลานให้ฟังสองรอบ ภูมิใจกับงานของตัวเอง {name}ฟังจนจบรอบที่สอง เพลงเพราะกว่าเดิม และไม่ใช่เพลงเดิมอีกแล้ว

        แผงพริกแห้งข้างๆ ว่าง ช่างบอกว่าหญิงชราไม่ได้มาตั้งแต่วันนั้น
      effects: { gold: -2, flags: [fixed_music_box] }
    - id: keep_quiet
      label: บอกนางว่าได้กล่องมาจากร้านรับจำนำ ไม่รู้จักเจ้าของ
      text: |
        หญิงชราบอกว่าเข้าใจ แล้วเดินกลับไปที่แผงพริกแห้งด้วยไม้เท้า ไม่หันกลับมา

        ตั้งแต่วันนั้น ทุกครั้งที่{name}เดินผ่านแผงนั้น นางจะฮัมเพลงเพลงหนึ่งเบาๆ ไม่มองขึ้นจากพริกที่กำลังคัด และทุกครั้ง นางฮัมสะดุดที่เสียงที่เจ็ด
      effects: { items: [black_music_box], flags: [kept_music_box_quiet] }

- id: adult.mid_belek_ledger_day
  stage: adult
  scene: market
  weight: 10
  when:
    age: [29, 32]
  text: |
    เสมียนวิหารเบเลคตั้งโต๊ะผ้าสีเทาในตลาดวันแรกของเดือนเหมือนทุกเดือน คนต่อแถวยาวถึงร้านขายปลาเหมือนทุกเดือน วันนี้ตาฮาลวินข้างบ้านของ{name}ยืนอยู่หน้าโต๊ะ ถือแผ่นไม้ประทับตราเบเลคไว้สองมือ แกกู้แปดเหรียญเมื่อสองปีก่อน จ่ายเดือนละครึ่งเหรียญครบยี่สิบสี่เดือน วันนี้มารับคำว่าครบ

    เสมียนเปิดสมุดเล่มหนา ชี้บรรทัดหนึ่งด้วยปลายปากกา เดือนที่เก้าตาฮาลวินจ่ายช้าสิบเอ็ดวัน ปีนั้นแกป่วยไข้ทั้งเดือน บรรทัดสุดท้ายของหน้าสามในสัญญาเขียนว่าจ่ายช้าเกินสิบวัน ดอกที่ยังไม่ได้จ่ายทั้งหมดกลายเป็นเงินต้นใหม่ ตั้งแต่วันนั้นมาดอกก็งอกบนดอก วันนี้แกยังค้างอยู่สามเหรียญ และเดือนหน้าจะค้างมากกว่านั้น

    ตาฮาลวินหันมามองคนในแถว เห็น{name}เป็นคนแรก
  choices:
    - id: read_for_him
      label: ขอสัญญาของตาฮาลวินมาอ่านทุกบรรทัดต่อหน้าเสมียน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          เบเลคไม่เคยขีดฆ่าบรรทัดไหนในสัญญา และไม่เคยลืมบรรทัดไหน หน้าสองมีบรรทัดหนึ่งที่ไม่มีใครอ่าน วิหารต้องแจ้งผู้กู้ภายในหนึ่งเดือนว่าดอกกลายเป็นเงินต้นแล้ว ถ้าไม่แจ้ง ดอกที่งอกหลังเดือนนั้นไม่นับ {name}ถามเสมียนว่าวิหารแจ้งตาฮาลวินวันไหน เสมียนเปิดสมุดหาอยู่ครู่หนึ่ง แล้ววางปากกาลง

          ตาฮาลวินค้างอยู่หนึ่งเหรียญ แกจ่ายได้ เสมียนเขียนคำว่าครบท้ายบรรทัดด้วยหมึกสีเดียวกับบรรทัดอื่น แล้วมอง{name}ด้วยสีหน้าเดิม คนในแถวสามคนยื่นสัญญาของตัวเองมาให้{name}อ่านก่อนตลาดวาย
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, reputation: { belek_bank: -1 }, flags: [read_for_haldwin] }
      failure:
        text: |
          {name}อ่านจนถึงกลางหน้าสอง คนในแถวข้างหลังก็เริ่มดัน เสมียนบอกว่าถ้าจะอ่านให้ไปอ่านข้างๆ แล้วต่อแถวใหม่ ตาฮาลวินไม่มีเวลาต่อแถวใหม่ แกต้องไปทำงานตอนสาย

          แกลงชื่อในสัญญาฉบับใหม่ ใต้ฉบับเดิม เงินต้นสามเหรียญ จ่ายเดือนละครึ่ง ปลายนิ้วของแกเย็นตอนวางมือบนสมุด แกบอก{name}ว่าไม่เป็นไร อีกหกเดือนก็หมด แล้วเดินออกจากตลาดไปทางเดิม
        effects: { stats: { INT: 1 }, flags: [haldwin_resigned] }
    - id: pay_for_him
      label: จ่ายสามเหรียญแทนแก ให้จบวันนี้
      requires: { min_gold: 3 }
      text: |
        {name}นับเหรียญวางบนผ้าสีเทาสามเหรียญ เสมียนนับซ้ำ แล้วเขียนคำว่าครบท้ายบรรทัดของตาฮาลวิน ไม่ได้ถามว่าเงินเป็นของใคร เบเลคไม่ถาม เบเลคนับ

        ตาฮาลวินบอกว่าจะคืนให้เดือนละครึ่งเหรียญ {name}บอกว่าไม่ต้อง แกไม่ฟัง แต่แกก็ไม่มีเงินจะคืน วันแรกของทุกเดือนหลังจากนั้น มีห่อใบตองวางอยู่หน้าประตูบ้าน{name} ไข่ไก่สองฟองบ้าง ปลาเค็มตัวหนึ่งบ้าง ผักกาดหัวใหญ่บ้าง จนครบหกห่อ
      effects: { gold: -3, alignment: { moral: 1 }, flags: [paid_haldwins_interest] }
    - id: step_out
      label: ไม่ใช่เรื่องของตัวเอง ยืนต่อแถวต่อไป
      text: |
        ตาฮาลวินหันกลับไปหาเสมียน ลงชื่อในสัญญาฉบับใหม่ใต้ฉบับเดิม เงินต้นสามเหรียญ จ่ายเดือนละครึ่ง แล้วเดินออกจากแถวโดยไม่มองใคร

        ถึงคิวของ{name} เสมียนเงยหน้าขึ้นมองเหมือนมองทุกคน แล้วถามว่าวันนี้มาทำอะไร
      effects: { alignment: { law: 1 }, flags: [watched_haldwin_resign] }
    - id: close_the_savings
      label: ถึงกำหนดห้าปี เบิกบัญชีออมที่ฝากไว้
      requires: { flag: belek_savings }
      text: |
        เสมียนนับเจ็ดเหรียญวางเรียงบนผ้าสีเทา ไม่ขาดไม่เกิน ห้าเหรียญที่ฝากไว้ กับอีกสองเหรียญที่งอกขึ้นมาในห้าปี เบเลคทำตามสัญญาทุกบรรทัด

        {name}กวาดเหรียญทั้งเจ็ดลงถุง ตาฮาลวินยืนดูอยู่ข้างโต๊ะ แกบอกว่าสัญญาของแกก็ทำตามทุกบรรทัดเหมือนกัน
      effects: { gold: 7, flags: [belek_savings_closed] }
    - id: check_own_ledger
      label: ขอดูบรรทัดของตัวเองในสมุด ว่าเงินกู้แปดเหรียญจบแล้วจริงไหม
      habit: tight_fist
      requires: { flag: belek_loan }
      check: { stat: INT, dc: 13 }
      success:
        text: |
          บรรทัดของ{name}มีจุดหมึกเล็กๆ จุดหนึ่งที่เดือนที่สิบสี่ จ่ายช้าหนึ่งวัน {name}นับย้อนวัน วันแรกของเดือนนั้นตรงกับวันอัสเทล วันว่าง โต๊ะสีเทาไม่ได้ตั้ง วันที่{name}มาจ่ายคือวันแรกที่โต๊ะเปิด

          เสมียนนับวันตามแล้ววางปากกาลง เขียนคำว่าครบท้ายบรรทัดของ{name} ข้างจุดหมึกนั้น จุดหมึกยังอยู่ที่เดิม
        effects: { stats: { INT: 1 }, flags: [belek_loan_closed] }
      failure:
        text: |
          เดือนที่สิบสี่{name}จ่ายช้าสิบเอ็ดวัน {name}จำไม่ได้ว่าเพราะอะไร เสมียนจำได้ ปีนั้นฝนตกหนัก ทางเข้าตลาดเป็นโคลน ตั้งแต่เดือนนั้นดอกก็งอกบนดอกเหมือนของตาฮาลวิน

          {name}นับสามเหรียญวางบนผ้าสีเทาให้จบวันนั้น เสมียนเขียนคำว่าครบ ตาฮาลวินยืนดูอยู่ข้างๆ แกบอกว่าอย่างน้อยไม่ได้โง่อยู่คนเดียว
        effects: { gold: -3, flags: [belek_loan_closed] }
    - id: point_out_the_line
      label: พลิกสัญญาของตาฮาลวินกลับไปหน้าสอง ชี้บรรทัดที่วิหารต้องแจ้งผู้กู้
      requires: { flag: read_belek_account_terms }
      text: |
        {name}เคยอ่านสัญญานี้ครบทั้งสามหน้าเมื่อหลายปีก่อน จำได้ว่าบรรทัดที่วิหารต้องแจ้งผู้กู้อยู่หน้าไหน เสมียนเห็นนิ้วของ{name}ไปหยุดตรงนั้นก่อนจะเปิดถึง แล้ววางปากกาลงก่อนที่{name}จะถาม

        ตาฮาลวินค้างอยู่หนึ่งเหรียญ แกจ่ายครบตรงนั้น ตอนเดินออกจากตลาด แกถามว่า{name}อ่านหนังสือเก่งขนาดนี้ทำไมไม่ไปเป็นเสมียน {name}บอกว่าเพราะอ่านเก่ง
      effects: { alignment: { moral: 1 }, reputation: { belek_bank: -1 }, flags: [read_for_haldwin] }

- id: adult.mid_hunter_horned_son
  stage: adult
  scene: home
  weight: 10
  when:
    age: [25, 32]
    trait: curse_brand
    not_flags: [horns_sawn]
  text: |
    มีคนเคาะประตูตอนดึก {name}เปิดออกไปเจอนักล่าแม่มดของศาสนจักรตะเกียง คนที่ถือรายชื่อผู้ต้องตราของย่านนี้ คนที่มาถามเรื่องความฝันตามรอบห้าปี คืนนี้เขาไม่ใส่เสื้อคลุมขาว ไม่ใส่ถุงมือ ในอ้อมแขนมีผ้าห่อหนึ่งห่อ

    เขาเปิดผ้าที่หัว เด็กแรกเกิดสามวัน หลับอยู่ บนหัวมีตุ่มแข็งสองตุ่มเท่าเม็ดถั่ว ลูกชายของเขา เขาบอกว่าภรรยาให้เขามาที่นี่ ในสมุดของเขามีชื่อผู้ต้องตราหลายร้อยชื่อ นางบอกให้มาหาคนที่ยังอยู่ในเมืองนี้ และยังอยู่ดี

    เขายืนอยู่หน้าประตู ไม่ขอเข้ามา เขาถามว่าลูกเขาควรไปที่ไหน
  choices:
    - id: to_isel
      label: บอกทางไปวิหารอีเซลที่โคนเสา ห้องเด็กที่นั่นมีเด็กมีเขาหลายสิบคน
      text: |
        {name}บอกเรื่องที่คนมีเขาทุกคนเคยได้ยิน ช่องส่งขนมปัง ห้องเด็กยาวเหมือนโรงนา เตียงไม้เรียงสองแถว แม่ชีที่ไม่ถามอะไรนอกจากว่ากินข้าวมาหรือยัง เขาฟังทุกคำเหมือนจดลงสมุดในหัว แล้วถามว่าพ่อจะได้เข้าไปเยี่ยมไหม {name}บอกว่าไม่รู้

        เขาขอบใจ แล้วเดินออกไปในความมืดทางทิศที่เสาของอีเซลอยู่ ห่อผ้าแนบอก ตอนเลี้ยวมุมถนน เขาก้มลงดูหน้าลูกครั้งหนึ่ง
      effects: { alignment: { moral: 1 }, flags: [hunter_child_horned, hunter_child_to_isel] }
    - id: raise_him_open
      label: บอกให้เลี้ยงลูกไว้เอง ให้โตมาพร้อมเขาสองข้าง ไม่ต้องซ่อน
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}เล่าว่าโตมาพร้อมเขาเป็นยังไง ร้านที่ไม่ขายของให้ เด็กที่ปาหิน ผู้ใหญ่ที่ข้ามถนนหนี และคนที่ไม่ข้ามถนน คนที่ยังอยู่ในเมืองนี้ได้ เพราะมีคนแบบนั้นอยู่ไม่กี่คน เขาฟังจนเด็กในห่อผ้าตื่นขึ้นมาร้อง

          เขาถอดตะเกียงแขวนรูปเล็กที่ห้อยคอออกมา วางไว้บนโต๊ะข้างประตู แล้วอุ้มลูกกลับบ้าน เดือนต่อมามีนักล่าแม่มดคนใหม่มาตรวจ{name}ตามรายชื่อ อายุน้อยกว่าคนเดิมสิบปี ถามคำถามเดิมทุกคำ
        effects: { alignment: { moral: 1 }, flags: [hunter_child_horned, hunter_quit_church] }
      failure:
        text: |
          เขาฟังได้ครึ่งเดียว แล้วบอกว่า{name}ไม่รู้ว่าศาสนจักรทำอะไรกับคนที่เลี้ยงเด็กมีเขาไว้ในบ้านโดยไม่แจ้ง เขารู้ เพราะเขาเป็นคนทำ

          เขาห่อผ้ากลับคลุมหัวลูก แล้วเดินออกไปโดยไม่ลา {name}ไม่รู้ว่าเขาพาลูกไปทางไหน ตะเกียงแขวนรูปเล็กยังห้อยอยู่ที่คอเขาตอนเลี้ยวมุมถนน
        effects: { flags: [hunter_child_horned, hunter_walked_off] }
    - id: shut_the_door
      label: ปิดประตู คนที่จดชื่อ{name}ลงสมุดไม่มีสิทธิ์มาขออะไรจากที่นี่
      habit: cold_blood
      text: |
        {name}ปิดประตู ลงกลอน เขาไม่เคาะอีก เขายืนอยู่หน้าประตูจนเด็กในห่อผ้าเริ่มร้อง แล้วเสียงร้องก็ค่อยๆ ห่างออกไปทีละก้าว

        {name}นั่งพิงประตูจนฟ้าสาง โคนเขาทั้งสองข้างร้อนผ่าวอยู่ตลอด
      effects: { alignment: { moral: -1 }, flags: [hunter_child_horned, turned_hunter_away] }
    - id: ask_his_dream
      label: ถามเขาว่ายังฝันถึงบ้านหลังนั้นอยู่ไหม
      requires: { flag: hunter_told_his_dream }
      text: |
        เขาบอกว่าฝันทุกคืน และตอนนี้เขารู้แล้วว่าเด็กในบ้านหลังนั้นตายยังไง วันที่เขาไปเคาะประตูบ้านนั้น ครอบครัวนั้นซ่อนเด็กไว้ใต้พื้นบ้านจนเขากลับไป แล้วซ่อนต่อทุกครั้งที่ได้ยินเสียงเท้าบนถนน จนถึงฤดูหนาว เขาเพิ่งรู้เมื่อปีก่อน จากเพื่อนบ้านที่ช่วยยกพื้นขึ้น

        ลูกของเขาจะไม่อยู่ใต้พื้น เขาพูดประโยคนั้นเหมือนพูดกับตัวเอง แล้วถอดตะเกียงแขวนรูปเล็กออกจากคอ วางลงในมือ{name} คืนนั้นเขาอุ้มลูกกลับบ้านทางถนนใหญ่ ถนนที่มีตะเกียงฟ้าทุกสิบก้าว
      effects: { alignment: { moral: 1 }, flags: [hunter_child_horned, hunter_quit_church] }

- id: adult.mid_noric_farewell
  stage: adult
  weight: 10
  when:
    age: [25, 32]
    flags: [elf_human_friend]
  text: |
    โนริคปีนบันไดเชือกขึ้นมาถึงบ้านของ{name}ตอนบ่าย ขาขวายังลากนิดหนึ่ง บนหลังมีเด็กผู้หญิงอายุห้าขวบผูกผ้าไว้ ลูกสาวของเขา ชื่อทิลดา ผมสีฟางเหมือนแม่ ฟันหน้าหลุดสองซี่เหมือนพ่อตอนอายุเท่านาง นางลงจากหลังพ่อ ยืนบนกิ่ง มองรอบตัว แล้วถามคำแรก ข้างบนนี้มีส้วมไหม

    โนริคหัวเราะจนต้องนั่งลงกับพื้น แล้วบอกว่ามาลา เดือนหน้าเขาจะพาครอบครัวไปอยู่เมืองหลวง ค่ายตัดไม้ปิดไปแล้ว บ้านตีนไม้ไม่มีงาน ในเมืองหลวงมีงานผูกเชือกที่ท่าเรือ ค่าแรงดีกว่าที่นี่สองเท่า

    เขาพูดเรื่องนี้เร็วเหมือนซ้อมมาตลอดทางขึ้นบันได
  choices:
    - id: show_her
      label: พาทิลดาไปดูส้วมบนกิ่ง แบบที่เคยพาพ่อนางไป
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}จูงมือนางเดินไปตามกิ่งจนถึงปลายกิ่งที่ยื่นออกไปเหนือหุบ ทิลดาเห็นแล้วหัวเราะ หัวเราะเสียงเดียวกับพ่อเมื่อยี่สิบกว่าปีก่อน หัวเราะจนต้องนั่งลงกับพื้นเหมือนพ่อ โนริคยืนอยู่ข้างหลัง ไม่ได้หัวเราะตาม

          ขากลับนางขอเดินเองไม่ต้องจูง {name}เดินถอยหลังนำหน้านาง มือยื่นรอไว้ตลอดทาง นางไม่ลื่นสักก้าว พอถึงบันได นางบอกพ่อว่าเมืองหลวงไม่มีส้วมแบบนี้แน่
        effects: { stats: { DEX: 1 }, flags: [showed_tilda_the_bough] }
      failure:
        text: |
          กิ่งยังเปียกจากฝนเมื่อเช้า ทิลดาลื่นตอนเดินถึงกลางกิ่ง {name}คว้าข้อมือนางไว้ทัน แต่ข้อเท้าตัวเองพลิกจนได้ยินเสียง นางห้อยต่องแต่งอยู่ครู่หนึ่ง แล้ว{name}ก็ดึงขึ้นมาได้

          นางไม่ร้องไห้ นางถามว่าทำอีกได้ไหม โนริคอุ้มนางกลับไปที่บ้าน {name}เดินกะเผลกตามหลัง สองคนเดินลากขาข้างหนึ่งเหมือนกัน โนริคหันมาเห็นแล้วหัวเราะจนต้องหยุดเดิน
        effects: { hp: -1, flags: [showed_tilda_the_bough] }
    - id: give_the_seed
      label: เอาเมล็ดสนห่อใบไม้ที่ได้ตอนเกิดให้ทิลดา
      text: |
        คนที่ให้เมล็ดนี้ในคืนที่{name}เกิดบอกว่าอีกร้อยปีมันจะสูงพอให้เด็กนั่งดูดาวได้ {name}บอกทิลดาแบบเดียวกัน นางถามว่าร้อยปีนานเท่าไร {name}บอกว่านานเท่าพ่อของนางสามคนต่อกัน

        โนริคบอกว่าเมืองหลวงไม่มีดินให้ปลูก ทิลดาบอกว่าจะหาเอง นางกำห่อใบไม้ไว้ในมือข้างเดียวตลอดทางลงบันได ใช้มืออีกข้างจับเชือก ไม่ยอมให้พ่ออุ้ม
      effects: { alignment: { moral: 1 }, flags: [gave_birth_seed] }
    - id: ask_him_to_stay
      label: ขอให้เขาอยู่ บอกว่าจะหางานให้ที่นี่
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}บอกว่าการแลกเกลือระหว่างบ้านบนกิ่งกับบ้านตีนไม้ต้องมีคนพูดสองภาษา คนที่ทำอยู่ตอนนี้แก่จนปีนบันไดไม่ไหว ผู้เฒ่าไม่ชอบมนุษย์ แต่ผู้เฒ่ารู้จักโนริคมาตั้งแต่ขาหัก

          ผู้เฒ่าตอบรับในอีกสามวัน โนริคไม่ได้ไปเมืองหลวง ทุกเดือนที่คนบ้านตีนไม้ขึ้นมาแลกเกลือ เขาจะขึ้นมาด้วย ทิลดาขึ้นมาด้วยทุกครั้ง และถามทุกครั้งว่าส้วมยังอยู่ไหม
        effects: { stats: { CHA: 1 }, flags: [noric_stayed] }
      failure:
        text: |
          โนริคฟังแล้วบอกว่าขอบใจ แต่เขาตัดสินใจไปแล้ว ภรรยาเขาเป็นคนเมือง อยากกลับบ้าน ทิลดาจะได้ไปโรงเรียน

          เดือนต่อมา{name}ลงไปยืนส่งที่บ้านตีนไม้ เกวียนของเขาออกตอนแดดขึ้น ทิลดานั่งอยู่ท้ายเกวียน โบกมือจนเกวียนเลี้ยวพ้นชายป่า
        effects: { flags: [noric_left_for_city] }
    - id: ask_why_he_stopped
      label: ถามเขาว่าทำไมไม่ขึ้นมาบนกิ่งอีกเลยตั้งแต่ค่ายไหม้
      requires: { flag: noric_distant }
      text: |
        โนริคเกาท้ายทอย หันไปทางตีนบันได บอกว่าเขาโกรธ ไม่ได้โกรธ{name} โกรธตัวเองที่มาขอให้{name}เลือกระหว่างเขากับคนบนกิ่ง เหมือนเด็กที่ขอให้เพื่อนเลือกข้าง เขาไม่รู้จะขึ้นมาพูดเรื่องนี้ยังไง เลยไม่ขึ้นมาเลย

        ทิลดาเดินกลับมาจากปลายกิ่ง ถามว่าพ่อกับ{name}ทะเลาะกันหรือ โนริคบอกว่าเปล่า เคยทะเลาะ ตอนนี้ไม่แล้ว เขาอยู่จนตะวันตกดิน เล่าเรื่องสิบปีที่ผ่านมาจนครบ ก่อนลงบันไดเขาถามว่าในเมืองหลวงจะมีใครถามเขาว่าข้างล่างนั้นมีส้วมไหม
      effects: { alignment: { moral: 1 }, flags: [noric_reconciled] }

# ---------- 3c ----------
- id: adult.mid_welen_returns
  stage: adult
  scene: home
  weight: 10
  when:
    age: [33, 40]
    flags: [belek_guarantor]
  text: |
    เวลน์มายืนที่ประตูบ้านของ{name}ตอนเย็นวันอัสเทล ผมบางลงจนเห็นหนังหัว แขนเสื้อพับขึ้นถึงศอก มือมีรอยน้ำมันเครื่องฝังอยู่ในร่องเล็บ เขาเปิดร้านซ่อมของเล็กๆ อยู่ปลายตลาดเมืองท่า เพิ่งเปิดได้สองปี

    เขาถือถุงผ้าใบหนึ่งไว้ในมือ บอกว่ามาใช้หนี้ หนี้ที่{name}ไม่เคยทวง และวิหารเบเลคไม่เคยลืม ชื่อ{name}ยังอยู่ในสมุดเล่มหนาบนโต๊ะสีเทา ในบรรทัดผู้ค้ำใต้ชื่อของเขา บรรทัดที่ไม่มีใครขีดฆ่าได้
  choices:
    - id: take_the_six
      label: รับหกเหรียญที่{name}เคยวางบนโต๊ะสีเทาแทนเขา
      requires: { flag: paid_welens_debt }
      text: |
        เวลน์นับหกเหรียญวางบนโต๊ะในบ้าน ทีละเหรียญ ช้าเหมือนเสมียน บอกว่าเงินเก็บทั้งปีของ{name}หายไปในเช้าเดียวเพราะเขา เขารู้มาตลอด และเก็บเงินก้อนนี้มาสามปี

        เขาไม่ได้อธิบายว่าปีที่หายไปเขาไปอยู่ไหน {name}ไม่ได้ถาม ก่อนกลับเขาขอแก้วน้ำหนึ่งแก้ว ดื่มจนหมด แล้ววางแก้วคว่ำไว้ข้างกองเหรียญ
      effects: { gold: 6, alignment: { law: 1 }, flags: [welen_repaid] }
    - id: take_the_seven
      label: รับเจ็ดเหรียญ หกเหรียญค่าหนี้ บวกค่าปรับของสิบวันที่ออกตามหาเขา
      habit: tight_fist
      requires: { flag: welen_vanished }
      text: |
        เวลน์บอกว่าตอนที่{name}ออกตามหาเขาสิบวัน เขาอยู่ในเหมืองทางตะวันออกจริงอย่างที่คนลือ ลงไปลึกจนไม่เห็นแดดทั้งเดือน ไม่รู้ว่ามีใครตามหา รู้ทีหลังสามปี จากคนบ้านเดียวกันที่ลงเหมืองตามมา

        เขานับเจ็ดเหรียญวางบนโต๊ะ เหรียญที่เจ็ดเขาวางแยกไว้ห่างจากกองหนึ่งคืบ บอกว่าเหรียญนั้นสำหรับสิบวัน ส่วนสิบวันจริงๆ เขาไม่รู้จะคืนยังไง
      effects: { gold: 7, alignment: { law: 1 }, flags: [welen_repaid] }
    - id: go_to_the_gray_table
      label: พาเขาไปดูสมุดที่โต๊ะสีเทา หน้าที่ผู้ค้ำกลายเป็นผู้กู้
      requires: { flag: owes_welens_debt }
      text: |
        วันแรกของเดือนต่อมา ทั้งสองไปยืนต่อแถวด้วยกัน เสมียนคนใหม่อายุน้อยกว่าคนเดิมยี่สิบปี แต่สีหน้าเหมือนกันทุกอย่าง เขาเปิดสมุดถึงหน้าที่มีชื่อ{name}เป็นผู้กู้ ใต้ชื่อของเวลน์ ทุกเดือนมีคำว่าจ่ายแล้วหนึ่งเหรียญ ครบหกเดือน ท้ายบรรทัดเขียนว่าครบ

        เวลน์นับหกเหรียญใส่มือ{name}ต่อหน้าเสมียน เสมียนมองดูแต่ไม่จดอะไร เพราะเงินที่เปลี่ยนมือนอกสัญญาไม่ใช่ธุระของเบเลค ตอนเดินออกจากตลาด เวลน์บอกว่าปลายนิ้วของเขาหายเย็นแล้ว ตั้งแต่วันที่{name}ลงชื่อแทน
      effects: { gold: 6, clear_flags: [owes_welens_debt], flags: [welen_repaid] }
    - id: take_the_three
      label: รับสามเหรียญ ส่วนที่{name}จ่ายแทนตอนเจอเขาที่โรงพยาบาลคนจน
      requires: { flag: welen_friend }
      text: |
        เวลน์บอกว่าเงินสามเหรียญนี้มาจากร้านซ่อมแขนเหล็กของเขา เขาเปิดร้านนั้นเพราะอยากซื้อแขนเหล็กของพ่อคืน แขนที่ขายไปเป็นค่าฝังศพ ทุกแขนที่เข้ามาซ่อม เขาพลิกดูรอยสลักใต้ข้อศอกก่อนทุกครั้ง ยังไม่เจอ

        เขานับสามเหรียญวางบนโต๊ะ {name}ถามว่าจะรับแขนซ่อมไปถึงเมื่อไร เขาบอกว่าจนกว่าจะเจอ หรือจนกว่ามือจะไม่ไหว อันไหนมาก่อนก็อันนั้น
      effects: { gold: 3, alignment: { moral: 1 }, flags: [welen_repaid] }
    - id: never_needed
      label: ถามเขาว่าหนี้อะไร
      requires: { not_flags: [paid_welens_debt, welen_vanished, owes_welens_debt, welen_friend] }
      text: |
        เวลน์หัวเราะ บอกว่า{name}ไม่รู้เพราะไม่เคยมีใครมาเรียก เขาจ่ายครบเองทุกเดือน ยี่สิบสี่เดือน บางเดือนต้องอดข้าวเย็นสามวันให้ทันวันแรกของเดือน เพราะรู้ว่าถ้าช้า เสมียนจะเรียกชื่อคนในบรรทัดผู้ค้ำ

        ในถุงผ้ามีขนมปังก้อนใหญ่จากร้านหน้าร้านเขา ยังอุ่น เขาบอกว่านี่คือค่าดอกของการที่{name}ไม่เคยรู้เรื่องนี้ ทั้งสองนั่งกินขนมปังกันที่ขั้นบันไดหน้าบ้านจนมืด
      effects: { alignment: { moral: 1 }, flags: [welen_paid_himself] }
    - id: refuse_it
      label: บอกเขาว่าเก็บไว้ ไม่มีอะไรต้องใช้คืน
      text: |
        เวลน์ถือถุงผ้าค้างไว้อย่างนั้น แล้วบอกว่า{name}พูดเหมือนคนที่ไม่เคยติดหนี้ใคร เขาเก็บถุงกลับเข้าอกเสื้อ ไม่เถียง

        ตั้งแต่เดือนนั้น ทุกเย็นวันอัสเทลเวลน์มากินข้าวที่บ้าน{name} เอาขนมปังจากร้านหน้าร้านเขามาด้วยทุกครั้ง ก้อนใหญ่ขึ้นทุกเดือนจนกินไม่หมด
      effects: { alignment: { moral: 1 }, flags: [welen_friend_for_life] }

- id: adult.mid_airship_son
  stage: adult
  scene: home
  weight: 10
  when:
    age: [33, 40]
    flags: [looted_airship]
  text: |
    ชายหนุ่มคนนั้นอายุราวยี่สิบ สวมเสื้อคลุมของบริษัทเดินเรือ ผ้าใหม่ยังไม่มีรอยพับ ที่อกปักเลขประจำตัวลูกเรือสามตัว เขาบอกว่าพ่อของเขาคือคนที่ติดอยู่ใต้โครงเหล็กห้องบังคับเรือของเรือเหาะลำนั้น ตอนพ่อตาย เขาอายุยังไม่ถึงสามขวบ

    ลูกเรือขากะเผลกคนนั้นตายเมื่อฤดูหนาว ก่อนตายบอกชื่อ{name}ให้เขาฟัง บอกว่าเป็นคนแรกๆ ที่ไปถึงซากเรือวันนั้น ชายหนุ่มเดินทางมาสองวัน เขาไม่ได้มาถามเรื่องขวดน้ำค้างดาว เขามาถามคำเดียว พ่อของเขาพูดอะไรเป็นอย่างสุดท้าย
  choices:
    - id: tell_all
      label: เล่าทุกอย่าง ตั้งแต่เสียงตะโกนใต้โครงเหล็กจนถึงขวดที่{name}เก็บก่อน
      text: |
        {name}เล่าทุกอย่าง เสียงตะโกนใต้โครงเหล็ก ไฟเล็กๆ ที่ถุงลม ขวดที่กลิ้งอยู่ห่างจากซาก กอหญ้า ก้อนหิน และสิ่งที่เลือกทำก่อน ชายหนุ่มฟังโดยที่มือวางนิ่งบนเข่าตลอด

        พอจบเขาลุกขึ้น ไม่ได้โกรธให้เห็น ไม่ได้ให้อภัยให้เห็น ตอนถึงประตู เขาบอกว่าพรุ่งนี้เขาต้องขึ้นเรือเหาะลำใหม่ ขนน้ำค้างดาวสามร้อยขวด เขาจะนับทุกขวด
      effects: { alignment: { moral: 1 }, flags: [told_airship_son] }
    - id: tell_last_words
      label: นึกให้ออกว่าวันนั้นคนใต้โครงเหล็กตะโกนว่าอะไร
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}หลับตา นึกย้อนไปถึงเสียงนั้น ไม่ใช่เสียงร้องให้ช่วย ไม่ใช่เสียงด่า เป็นชื่อ ชื่อเดียว ตะโกนซ้ำไปซ้ำมาจนเสียงแหบ {name}พูดชื่อนั้นออกมา

          ชายหนุ่มกำมือบนเข่าแน่น บอกว่านั่นคือชื่อของเขา เขานั่งอยู่บนม้านั่งหน้าบ้าน{name}จนตะวันลับ ไม่ได้ถามอะไรต่อ ก่อนไปเขาบอกว่าเขาเคยคิดว่าพ่อตายโดยไม่ได้นึกถึงใคร
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [told_last_words] }
      failure:
        text: |
          {name}นึกได้แต่เสียง ไม่ได้คำ เสียงผู้ชายตะโกนอยู่ข้างใต้ เสียงไม้ลั่น เสียงไฟ และเสียงขวดกระทบกันในมือของตัวเอง {name}บอกเขาว่าจำไม่ได้

          ชายหนุ่มบอกว่าเข้าใจ คนส่วนใหญ่ที่เขาไปถามก็จำไม่ได้ เขาขอบคุณแล้วเดินกลับทางเดิม เหลืออีกสองชื่อในกระดาษที่ลูกเรือขากะเผลกให้ไว้
        effects: { flags: [forgot_last_words] }
    - id: return_the_bottle
      label: ยื่นขวดเปล่าที่ก้นสลักเลขสามตัว ที่ลูกเรือขากะเผลกทิ้งไว้บนโต๊ะเมื่อหลายปีก่อน
      requires: { flag: lied_to_airship_crew }
      text: |
        ชายหนุ่มพลิกขวดดูก้น เลขสามตัวนั้นคือเลขประจำตัวของพ่อเขาในบริษัท ลูกเรือทุกคนสลักเลขตัวเองไว้ที่ขวดที่ตัวเองบรรจุ เขาไม่เคยมีของของพ่อสักชิ้น บริษัทไม่ได้คืนอะไรให้ครอบครัว

        เขาไม่ถามว่าทำไมขวดนี้อยู่ที่บ้าน{name} เขาอาจรู้ อาจไม่รู้ เขาห่อขวดด้วยผ้าเช็ดหน้า ใส่อกเสื้อข้างที่ปักเลขของตัวเอง แล้วบอกว่าเลขของเขาต่างจากพ่อตัวเดียว
      effects: { alignment: { moral: 1 }, flags: [returned_the_bottle] }
    - id: ask_about_the_bag
      label: ถามเขาว่าถุงผ้าแปดเหรียญเมื่อหลายปีก่อนไปถึงมือแม่เขาไหม
      requires: { flag: paid_airship_family }
      text: |
        ชายหนุ่มบอกว่าถึง แม่ของเขาเก็บถุงผ้าใบนั้นไว้จนวันนี้ ใช้เงินในนั้นซื้อแพะสองตัวกับผ้าห่มหนึ่งผืน แม่ไม่เคยรู้ว่าใครให้ ลูกเรือขากะเผลกบอกแค่ว่ามีคนฝากมา

        เขาถามว่าทำไม{name}ถึงให้ {name}ตอบไม่ได้ทั้งหมด ตอบได้ครึ่งหนึ่ง เขาฟังครึ่งนั้นจนจบ แล้วบอกว่าแพะสองตัวนั้นตายไปนานแล้ว ผ้าห่มยังอยู่
      effects: { flags: [airship_son_thanked] }
    - id: he_already_knew
      label: ถามเขาว่าลูกเรือขากะเผลกเล่าให้ฟังแค่ไหน
      requires: { flag: confessed_airship_loot }
      text: |
        เขาเล่าหมด ชายหนุ่มบอก ทั้งเสียงตะโกน ทั้งขวด ทั้งวันที่{name}ไปให้ปากคำกับบริษัท บริษัทจ่ายเงินชดเชยให้แม่ของเขาในปีนั้นเพราะคำให้การของ{name} มีเรื่องเดียวที่ลูกเรือคนนั้นไม่รู้ คือพ่อตะโกนว่าอะไร เขาบอกว่าตอนนั้น{name}อยู่ตรงที่ขวดกลิ้งไป ไกลเกินกว่าจะได้ยินคำ

        {name}บอกว่าจริง ได้ยินแต่เสียง ชายหนุ่มบอกว่าเขามาเพราะอยากถามเอง และอยากเห็นหน้า เขามองหน้า{name}อยู่ครู่หนึ่งแล้วลุกขึ้น บอกว่าหน้าเหมือนคนธรรมดา
      effects: { flags: [airship_son_knew] }

- id: adult.mid_silver_saw_cousin
  stage: adult
  scene: noble_hall
  weight: 10
  when:
    age: [33, 40]
    flags: [origin_marked_hidden]
  text: |
    รถม้าของตระกูลมารับ{name}ถึงที่พักตอนค่ำ คนขับบอกว่าลูกพี่ลูกน้องของ{name}คลอดลูกชายเมื่อคืน หมอตำแยที่ตระกูลจ้างมาสามชั่วคนออกจากห้องคลอดแล้วไม่พูดกับใคร เด็กมีเขา

    ห้องโถงของคฤหาสน์มีญาติยืนอยู่สิบกว่าคน ไม่มีใครนั่ง ธรรมเนียมของตระกูลบอกว่าต้องทำให้เสร็จก่อนหมอของศาสนจักรจะมาจดชื่อเด็กลงสมุด อีกสองคืน ทุกคนในห้องรู้ว่า{name}เป็นคนเดียวในรุ่นที่เคยผ่านคืนแบบนั้นมาแล้ว จึงเรียกมา

    ตอเขาสองตอของ{name}ใต้ผมเริ่มคันตั้งแต่ก้าวเข้าห้อง {name}จำได้ว่าท่านย่าเคยพูดว่าวิธีนี้เจ็บน้อยที่สุดเมื่อทำเร็วที่สุด
  choices:
    - id: stop_them
      label: บอกทุกคนในห้องว่าเด็กคนนี้จะโตมาพร้อมเขาสองข้าง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ไม่ได้ตะโกน {name}แหวกผมให้ทุกคนดูตอเขาของตัวเอง สองตอ เรียบเหมือนหินขัด แล้วเล่าว่าตอนอายุเท่าไรที่มันเริ่มปวดทุกครั้งที่ฝนจะตก และตอนอายุเท่าไรที่รู้ว่ามันเคยเป็นอะไร ห้องโถงเงียบจนได้ยินเสียงเด็กร้องลงมาจากชั้นบน

          ลูกพี่ลูกน้องลงบันไดมาเอง มือข้างหนึ่งเกาะราว อีกข้างเกาะไหล่หมอตำแย นางบอกว่าลูกของนางจะมีเขา คนที่ไม่ชอบก็ไม่ต้องมาเยี่ยม ครึ่งห้องกลับไปตั้งแต่คืนนั้น อีกครึ่งยังยืนอยู่
        effects: { alignment: { moral: 1 }, flags: [cousin_kept_horns] }
      failure:
        text: |
          ญาติผู้ใหญ่คนหนึ่งฟัง{name}ได้ครึ่งเดียวแล้วถามว่า{name}เคยเห็นคนในตลาดทำอะไรกับเด็กมีเขาบ้างไหม ตลาดในเมืองนี้ ไม่ใช่ในนิทาน {name}ตอบได้ เพราะเคยเห็น แต่คำตอบนั้นไม่ได้ช่วยเด็กคนนี้

          คืนที่สองญาติอีกคนเป็นคนทำ {name}ไม่ได้อยู่ในห้อง ได้ยินแค่เสียงเด็กร้องลงมาจากชั้นบน ร้องจนเสียงแหบ แล้วเงียบไปทีเดียว
        effects: { flags: [cousin_sawed_horns] }
    - id: do_it_the_old_way
      label: เปิดกล่องเลื่อยเงินที่ได้จากท่านย่า ทำเองด้วยมือที่เบาที่สุดในห้อง
      requires: { item: silver_saw_case }
      text: |
        ใบเลื่อยเงินบางเท่าเส้นผม ฟันละเอียดจนมองไม่เห็นด้วยตาเปล่า {name}ไม่เคยใช้มันมาก่อน แต่ด้ามเงินมีรอยสึกสองรอยตรงที่นิ้วของคนรุ่นก่อนเคยวาง นิ้วของ{name}วางลงตรงนั้นพอดี ลูกพี่ลูกน้องอุ้มลูกไว้แน่นแนบอก หันหน้าไปทางอื่น

        เร็วที่สุด เบาที่สุด เด็กร้องจนหน้าแดง แล้วหลับไปบนอกแม่ {name}เช็ดใบเลื่อยด้วยผ้ากำมะหยี่ในกล่อง ปิดฝา คืนนั้นฟ้าโปร่งไม่มีเมฆสักก้อน แต่ตอเขาของ{name}ปวดไปจนเช้า
      effects: { alignment: { law: 1 }, flags: [sawed_cousins_child] }
    - id: tell_her_and_let_her_choose
      label: ขึ้นไปเล่าให้ลูกพี่ลูกน้องฟังว่าโตมากับตอเขาเป็นยังไง แล้วให้นางเลือกเอง
      text: |
        {name}นั่งข้างเตียงคลอด เล่าทุกอย่าง ทั้งส่วนที่ดีกว่าและส่วนที่แย่กว่าเด็กมีเขาที่เดินในตลาดได้ ส่วนที่ดีคือไม่มีใครข้ามถนนหนี ส่วนที่แย่คือรู้ทั้งชีวิตว่าตัวเองต้องซ่อนอะไรอยู่ใต้ผม และมีคนเลือกให้ตั้งแต่ยังลืมตาไม่ได้

        ลูกพี่ลูกน้องฟังจนเด็กในอ้อมแขนหลับ แล้วบอกว่าขอคิดอีกคืน {name}ลงไปนั่งรอในห้องโถงจนเช้า ไม่รู้ว่านางเลือกอะไร จนหมอของศาสนจักรมาถึงในอีกสองวัน
      effects: { stats: { INT: 1 }, flags: [let_cousin_choose] }
    - id: no_saw_left
      label: บอกทุกคนว่าเลื่อยเงินของบ้านนี้ดำอยู่ในเตาผิงมาหลายปีแล้ว
      requires: { flag: burned_the_silver_saw }
      text: |
        ญาติผู้ใหญ่ไปเปิดกล่องบุกำมะหยี่ในห้องเก็บของ กล่องว่าง ไม่มีใครในห้องรู้ว่าเลื่อยไปอยู่ไหน {name}รู้ เลื่อยอันนั้นดำทั้งใบ ฟันทื่อไปครึ่งหนึ่งตั้งแต่วันที่{name}โยนมันลงเตาผิงหน้าเก้าอี้ของท่านย่า

        เลื่อยแบบนั้นไม่มีช่างในเมืองไหนทำขายแล้ว ช่างเงินที่ทำได้คนสุดท้ายตายไปก่อน{name}เกิด หมอของศาสนจักรมาถึงในอีกสองวัน จดชื่อเด็กลงสมุด ข้างชื่อมีคำว่าผู้ต้องตรา เขียนด้วยหมึกแดง
      effects: { alignment: { law: -1 }, flags: [cousin_kept_horns, no_saw_in_house] }

- id: adult.mid_flour_sack_mill
  stage: adult
  scene: market
  weight: 10
  when:
    age: [33, 40]
    flags: [origin_marked_foundling]
  text: |
    ร้านขายแป้งในตลาดรับกระสอบแป้งชุดใหม่มาจากโรงสีต้นน้ำ กระสอบทุกใบมีตราประทับสีน้ำตาลที่มุม รูปกงล้อน้ำ ข้างใต้มีอักษรสองตัว {name}หยุดอยู่หน้าร้าน แม่ชีโทเรนเคยเล่าว่า{name}มาถึงช่องส่งขนมปังในตะกร้า ห่อด้วยกระสอบแป้งที่มีตราโรงสีเลือนอยู่ครึ่งหนึ่ง

    คนขายแป้งบอกว่าโรงสีนั้นชื่อโรงสีท่าน้ำวน อยู่ขึ้นไปตามแม่น้ำครึ่งวัน เป็นโรงสีเก่าที่สุดในถิ่น ใช้ตรานี้มาตั้งแต่ก่อนเขาเกิด
  choices:
    - id: go_to_the_mill
      label: เดินขึ้นไปตามแม่น้ำครึ่งวัน ไปดูโรงสีนั้น
      text: |
        กงล้อน้ำของโรงสีท่าน้ำวนหมุนช้าๆ เสียงไม้ลั่นทุกรอบ ภรรยาคนสีข้าวเป็นหญิงชราชื่อยายบาเนส นั่งเย็บกระสอบอยู่หน้าประตู นางบอกว่าโรงสีนี้ส่งกระสอบออกไปปีละหลายพันใบ ใบไหนไปไหนไม่มีใครรู้

        {name}ถามว่าเคยมีใครในโรงสีหายไปไหม นางวางเข็มลงบนตัก บอกว่าเมื่อสามสิบกว่าปีก่อนมีเด็กสาวคนหนึ่งมาทำงานหน้าหนาว ไปก่อนหน้าร้อนโดยไม่บอกใคร เอาไปแค่กระสอบใบหนึ่งกับผ้าคลุมไหล่ แต่เด็กสาวที่มาทำงานหน้าหนาวแล้วไปก่อนหน้าร้อน โรงสีนี้มีทุกปี {name}เดินกลับลงมาตามแม่น้ำตอนตะวันคล้อย กงล้อยังลั่นตามหลังมาจนพ้นโค้งน้ำ
      effects: { stats: { CON: 1 }, flags: [visited_the_mill] }
    - id: leave_it
      label: ไม่ไป ปล่อยให้โรงสีนั้นอยู่ที่เดิม
      text: |
        {name}ซื้อแป้งกระสอบเล็กจากร้านนั้น เอากลับไปทำขนมปัง ขนมปังออกมาเหมือนขนมปังทุกก้อนที่เคยทำ

        พอแป้งหมด {name}นั่งดูกระสอบเปล่าที่พับไว้บนโต๊ะ ตรากงล้อน้ำอยู่ที่มุม อักษรสองตัวข้างใต้ชัดกว่าตราบนกระสอบที่ห่อ{name}มาเมื่อสามสิบกว่าปีก่อนมาก เช้าวันต่อมา{name}ใช้มันเป็นผ้าเช็ดมือ
      effects: { flags: [left_the_mill_alone] }
    - id: hold_the_scrap_against_it
      label: เอาเศษกระสอบที่ได้จากแม่ชีโทเรนมาทาบกับกระสอบในร้าน
      requires: { item: flour_sack_scrap }
      text: |
        ตราบนเศษกระสอบเก่าเลือนจนเหลือแค่วงกลมกับเส้นซี่ล้อสามเส้น ตราบนกระสอบใหม่มีซี่ล้อแปดเส้น {name}นับซ้ำ วางเส้นทั้งสามทับลงไปบนกระสอบใหม่ ทั้งสามเส้นวางลงบนซี่ล้อพอดี ไม่เหลื่อมสักเส้น

        คนขายแป้งเลิกคิ้ว ถามว่าจะซื้อไหม {name}ซื้อกระสอบเปล่ามาหนึ่งใบ พับเก็บไว้ในหีบคู่กับเศษกระสอบเก่า สองผืนวางทับกัน ตรากงล้อหันไปทางเดียวกัน
      effects: { stats: { INT: 1 }, flags: [matched_the_sack] }
    - id: ask_about_the_shawl
      label: ถามคนขายแป้งว่าผู้หญิงที่โรงสีนั้นเย็บผ้าคลุมไหล่จากกระสอบกันไหม
      requires: { flag: saw_hatch_mother }
      text: |
        คนขายแป้งหัวเราะ บอกว่าผู้หญิงทุกคนแถวต้นน้ำเย็บผ้าคลุมไหล่จากกระสอบแป้ง กระสอบโรงสีท่าน้ำวนเนื้อแน่น ใส่ได้สามหน้าหนาว ภรรยาของเขาเองก็มีผืนหนึ่ง สีเทา ตราโรงสีอยู่ที่มุม

        {name}นึกถึงหลังของผู้หญิงคนหนึ่งในผ้าคลุมไหล่สีเทา เดินเร็วไปทางทุ่ง ไม่หันกลับมา คนขายแป้งถามว่าจะสั่งผืนหนึ่งไหม ภรรยาเขาเย็บขาย {name}บอกว่าไม่ แล้วยืนอยู่หน้าร้านจนเขาเริ่มเก็บของ
      effects: { flags: [asked_about_the_shawl] }

- id: adult.mid_war_comrades_child
  stage: adult
  scene: home
  weight: 10
  when:
    age: [33, 40]
    flags: [war_veteran]
  text: |
    หญิงสาวคนนั้นอายุราวยี่สิบ เดินทางมาสามวัน ถือจดหมายเก่าซองหนึ่ง กระดาษเหลืองจนเป็นสีชา พ่อของนางตายในสงครามถ่านตอนนางยังไม่ถึงขวบ จดหมายฉบับนี้พ่อเขียนถึงแม่ก่อนตายไม่กี่วัน ในนั้นมีชื่อคนในหน่วยเดียวกันอยู่สามชื่อ ชื่อหนึ่งคือ{name} อีกสองชื่อนางตามไปแล้ว คนหนึ่งตาย อีกคนจำพ่อนางไม่ได้

    นางนั่งลงบนเก้าอี้ที่{name}ยกมาให้ วางจดหมายบนตัก แล้วถามคำเดียว พ่อของนางทำอะไรในวันสุดท้าย

    {name}จำชื่อนั้นได้ หน้าจำได้ลางๆ เสียงจำได้ชัดกว่าหน้า
  choices:
    - id: white_lie
      label: บอกนางว่าพ่อของนางเป็นคนกล้าที่สุดในวันนั้น
      text: |
        {name}เล่าเรื่องที่ไม่ได้เกิด ผู้ชายคนหนึ่งยืนอยู่หน้าสุด ไม่ถอย ไม่ร้อง ช่วยเพื่อนไว้สองคนก่อนจะล้ม เรื่องที่ลูกทุกคนอยากได้ยินเกี่ยวกับพ่อ

        หญิงสาวร้องไห้ตั้งแต่ครึ่งเรื่อง พอจบนางขอบคุณสามครั้ง แล้วพับจดหมายเก็บ ตอนเดินกลับ นางเดินเร็วขึ้นกว่าตอนมา {name}ยืนดูจนนางเลี้ยวพ้นถนน แล้วเข้าบ้านไปนั่งในที่มืด
      effects: { alignment: { moral: 1, law: -1 }, flags: [told_comrades_child_hero] }
    - id: only_voices
      label: บอกตามจริงว่าวันนั้นจำได้แต่เสียง
      text: |
        {name}บอกว่าในสงครามนั้นไม่มีใครเห็นอะไรชัด จำได้แต่เสียง เสียงของพ่อนางจำได้ เขาร้องเพลงตอนเดินแถว ร้องเสียงต่ำกว่าคนอื่น และหัวเราะเสียงดังเกินไปทุกครั้งที่หัวหน้าหน่วยพูดอะไรที่ไม่ตลก

        หญิงสาวฟังแล้วยิ้มออกมา ตายังแดงอยู่ นางบอกว่าไม่เคยมีใครเล่าเรื่องพ่อที่ไม่ใช่เรื่องตาย นางขอให้{name}ร้องเพลงที่พ่อร้องให้ฟัง {name}จำได้แค่ท่อนเดียว ร้องเพี้ยน นางหัวเราะเสียงดังเกินไป
      effects: { alignment: { moral: 1 }, flags: [told_comrades_child_truth] }
    - id: at_the_hole
      label: เล่าว่าพ่อนางวิ่งมายืนข้าง{name}ที่ปากหลุมในคืนนั้น
      requires: { flag: held_the_hole }
      text: |
        คืนที่พื้นเถ้าใต้กระโจมพยาบาลยุบลง {name}ไปถึงปากหลุมเป็นคนแรก คนที่สองคือพ่อของนาง วิ่งมาเท้าเปล่าถือพลั่ว ไม่ได้ถือดาบ เขายืนอยู่ข้าง{name}จนทหารคนอื่นมาถึง แล้วเป็นคนโยนตะเกียงน้ำมันลงไป

        สามวันต่อมาคนแคระขึ้นมาอีกทางหนึ่ง ตอนนั้น{name}อยู่อีกฝั่งของค่าย หญิงสาวเอาจดหมายของพ่อออกมาคลี่ ชี้บรรทัดหนึ่งที่เขียนว่ามีคนหนึ่งในหน่วยที่ไปถึงก่อนเขาเสมอ นางถามว่าคนนั้นคือ{name}ใช่ไหม
      effects: { alignment: { moral: 1 }, flags: [comrades_child_hole] }
    - id: from_the_tent
      label: เล่าว่าพ่อนางเป็นหนึ่งในสิบสี่คนที่{name}ลากออกจากกระโจมพยาบาล
      requires: { flag: saved_the_wounded }
      text: |
        พ่อของนางนอนอยู่ที่เปลที่เก้าจากประตู ขาหักทั้งสองข้าง {name}ลากเขาออกมาเป็นคนที่แปด เขาหนักกว่าคนอื่น ด่า{name}ตลอดทางว่าลากแรงเกินไป แล้วขอบใจตอนถึงหลังกองลังเสบียง สามวันต่อมาเขาตายในกระโจมหมอ ไข้ขึ้นจากแผล

        หญิงสาวฟังแล้วบอกว่าในจดหมายพ่อเขียนว่าขาหักทั้งสองข้าง ไม่ได้เขียนว่าใครลากออกมา {name}บอกว่าคงเพราะเขากำลังด่าอยู่ ลืมถามชื่อ นางหัวเราะออกมาครั้งแรก
      effects: { alignment: { moral: 1 }, flags: [comrades_child_tent] }
    - id: at_the_gate
      label: พานางไปดูชื่อพ่อบนกำแพงสภา ในแถวเดียวกับชื่อ{name}
      requires: { flag: held_the_iron_gate }
      text: |
        กำแพงสภาตระกูลมีตัวเลขหนี้สงครามสลักไว้บนสุด ข้างใต้เป็นชื่อสิบสองชื่อของคนที่ยืนหลังประตูเหล็กวันนั้น ชื่อของพ่อนางอยู่ข้างชื่อ{name} {name}เล่าว่าเขายืนดันคานกลอนอยู่ไหล่ชิดไหล่ ทุกนัดที่ปืนใหญ่ยิง เขานับเลขออกเสียง นับถึงสี่ก็หยุด

        หญิงสาวลูบชื่อพ่อด้วยปลายนิ้ว แล้วลูบชื่อ{name}ที่อยู่ข้างกัน นางบอกว่าวันที่หนี้บนกำแพงครบกำหนด นางจะกลับมายืนตรงนี้ ชื่อพวกนี้ควรมีคนมาบอกข่าว
      effects: { alignment: { moral: 1 }, reputation: { dwarf_council: 1 }, flags: [comrades_child_gate] }
    - id: show_the_tag
      label: เอาป้ายไม้ประจำกองให้นางจับดู
      requires: { item: unit_tag, not_flags: [held_the_hole, saved_the_wounded] }
      text: |
        ป้ายไม้ประจำกองสึกจนชื่อกองเลือนครึ่งหนึ่ง หญิงสาวรับไว้สองมือ พลิกดูทั้งสองด้าน พ่อของนางไม่ได้ป้ายนี้ เพราะตายก่อนนายกองจะแจก แต่ชื่อกองเดียวกัน สลักด้วยมีดเล่มเดียวกัน

        นางจับป้ายไว้นานจนไม้อุ่นเท่ามือ แล้วคืนให้{name} บอกว่ามันควรอยู่กับคนที่ได้ ไม่ใช่คนที่อยากได้ ตอนลุกขึ้นกลับ นางเอานิ้วโป้งลูบตรงที่ชื่อกองเลือน เหมือนจำรอยไว้
      effects: { alignment: { moral: 1 }, flags: [showed_comrades_child_tag] }

- id: adult.mid_hunter_court
  stage: adult
  scene: home
  weight: 10
  when:
    age: [33, 40]
    flags: [hunter_child_horned]
  text: |
    นักล่าแม่มดคนนั้นมาเคาะประตูอีกครั้ง หลายปีหลังคืนที่อุ้มลูกมายืนตรงนี้ ผมของเขาขาวไปครึ่งหัว ไม่ได้ใส่เสื้อคลุมขาว ศาสนจักรตะเกียงรู้แล้วว่าลูกชายของเขามีเขา พรุ่งนี้เช้าศาลของศาสนจักรจะเรียกเขาขึ้นไปถามว่ารู้มาตั้งแต่เมื่อไร และใครอีกบ้างที่รู้

    เขาบอกว่าเขาจะไม่บอกชื่อ{name} แต่ในสมุดรายชื่อของศาสนจักร ชื่อ{name}อยู่ในหน้าเดียวกับวันที่ลูกเขาเกิด ลายมือของเขาเอง ศาลอ่านสมุดเป็น

    เขามาเพื่อบอกเรื่องนี้ และเพื่อขอหนึ่งอย่าง ถ้าพรุ่งนี้เขาไม่ได้กลับบ้าน ให้มีใครสักคนรู้ว่าลูกของเขาอยู่ที่ไหน
  choices:
    - id: go_to_court
      label: ไปศาลกับเขาพรุ่งนี้ เป็นพยานว่าเด็กมีเขาไม่ได้ทำผิดอะไร
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          ศาลของศาสนจักรไม่เคยมีผู้ต้องตราเดินเข้ามาเอง โดยไม่มีใครลากมา นักบวชสามคนหลังโต๊ะมองเขาบนหัวของ{name}ตั้งแต่ประตูจนถึงที่นั่งพยาน {name}พูดเรื่องเดียว ตั้งแต่วันแรกที่ชื่อ{name}ลงสมุด ไม่มีบรรทัดไหนบอกว่า{name}ทำอะไรผิด มีแต่บรรทัดที่บอกว่า{name}มีเขา

          ศาลปล่อยเขากลับบ้าน ไม่ขัง ลูกของเขาอยู่ที่เดิม ตอนเดินออกจากศาล เขาบอกว่าไม่เคยมีใครพูดประโยคนั้นในห้องนี้ ยี่สิบปีที่เขาเข้าออกห้องนี้
        effects: { reputation: { lamp_church: -1 }, alignment: { moral: 1 }, flags: [hunter_spared] }
      failure:
        text: |
          นักบวชคนกลางฟัง{name}ได้สองประโยค แล้วขอให้{name}บอกชื่อเต็มกับที่อยู่ให้เสมียนจด ไม่ได้ถามอะไรเรื่องเด็ก ไม่ได้ถามอะไรเรื่องเขา ถามแต่เรื่อง{name}

          ศาลขังเขาไว้ใต้ศาลหนึ่งปี {name}ไปเยี่ยมได้ครั้งเดียว ผ่านช่องเหล็กเท่าฝ่ามือ เขาบอกว่าลูกยังปลอดภัย แล้วบอกว่า{name}ไม่ควรมาอีก ชื่อ{name}ขึ้นหน้าใหม่ในสมุดแล้ว หน้าที่มีหมึกแดง
        effects: { reputation: { lamp_church: -2 }, flags: [saw_hunter_in_cell, on_lamp_list] }
    - id: promise_the_son
      label: รับปากว่าถ้าเขาไม่ได้กลับ จะไปหาลูกเขาทุกเดือน
      text: |
        เขาบอกที่อยู่ของลูกให้ฟังครั้งเดียว ไม่เขียน {name}จำไว้ เขาขอบใจ แล้วเดินกลับไปในความมืด

        เขาไม่ได้กลับจากศาลในวันนั้น ทุกเดือนหลังจากนั้น{name}ไปหาเด็กชายคนหนึ่งตามที่อยู่ที่จำไว้ เด็กชายมีเขาสองข้างยาวเท่านิ้วก้อย ถามทุกครั้งว่าพ่อจะกลับเมื่อไร และทุกครั้งถามว่าเขาของ{name}เคยเจ็บไหมตอนมันงอก
      effects: { alignment: { moral: 1 }, flags: [promised_hunters_son] }
    - id: send_to_the_rats
      label: บอกให้เขาพาลูกไปหาหนูท่าคืนนี้ หนูท่าพาเด็กมีเขาออกนอกเมืองโดยไม่คิดเงิน
      text: |
        เขาไม่รู้เรื่องนี้ ยี่สิบปีที่ล่าคนมีเขา ไม่มีใครเคยบอกเขา {name}บอกชื่อโรงเตี๊ยมหลังท่าเรือ กับคำที่ต้องพูดกับคนเฝ้าประตูหลัง เขาท่องตามสองรอบ

        คืนนั้นเรือขนปลาลำหนึ่งออกจากท่าโดยไม่จุดตะเกียง เช้าวันต่อมาศาลของศาสนจักรรอเขาจนสาย แล้วส่งคนมาเคาะประตูบ้าน{name} ถามว่าเห็นเขาครั้งสุดท้ายเมื่อไร {name}ตอบว่าห้าปีก่อน ตอนเขามาตรวจตามรอบ
      effects: { alignment: { law: -1, moral: 1 }, reputation: { dock_rats: 1 }, flags: [hunter_fled_with_son] }
    - id: say_sorry_for_the_door
      label: ขอโทษเขาเรื่องคืนที่ปิดประตูใส่
      requires: { flag: turned_hunter_away }
      text: |
        เขาบอกว่าคืนนั้นเขายืนอยู่หน้าประตูจนลูกร้อง แล้วเดินไปที่วิหารอีเซลเอง ถามทางจากคนเมาสองคน แม่ชีที่ช่องส่งขนมปังรับลูกเขาไป ไม่ถามอะไรนอกจากว่าเขากินข้าวมาหรือยัง

        เขาบอกว่าไม่ต้องขอโทษ ประตูบานนั้นเขาเป็นคนสอนให้{name}ปิดมาตั้งแต่ก่อนลูกเขาเกิด ยี่สิบปีที่เคาะประตูบ้านคนมีเขา เขาเพิ่งรู้ว่าคนข้างในได้ยินเสียงเคาะเป็นยังไง ก่อนไปเขาบอกที่อยู่ของลูกให้{name}ฟังครั้งเดียว
      effects: { alignment: { moral: 1 }, flags: [apologized_to_hunter, promised_hunters_son] }
