# ชุด 5 ยุคดาวเร่ง แพ็ก ก: ความหิว คนเรียกว่า "ข้าวเบา" (8 เรื่อง) สิ่งติดตัว curse_hunger (ท้องกลวง มีสามขั้น)
# 1 สัญญาณแรกที่ลานนวดของหมู่บ้านในอาร์เวล (ทุกวัย คนมีตรามีทางของตัวเอง) · 2 ชั่งสองหนกับกำมือท้ายโอ่ง (ทุกวัย ไม่ผูกถิ่น)
# 3 ผลไม้ที่เบาเหมือนโคมกระดาษ ดันรอยดาว (วัยปลาย) · 4 ขนมปังของเจ้าของยุ้ง (วัยทำงาน)
# 5 คัดข้าวทั้งซอยในคืนเดียว ข้อตกลงที่สอง ดันรอยดาว (ทุกวัย) · 6 ครัวตอนดึก (ทุกวัย) · 7 จานครึ่งเดียว (เกิดซ้ำได้) · 8 ทางออก
# คนที่มีแต่ในข้อความ: ยายเมลดา คนนวดข้าวที่เก่าที่สุดของลาน · โยรัน ลูกชายคนเช่านา · ฮิลเด หญิงชาวนาที่สอนให้เว้นกำมือท้ายโอ่ง
#   เปตรา หญิงกะดึกโรงสีที่ไม่ได้นอนมาตั้งแต่หน้าเกี่ยว · ออสวิน เจ้าของยุ้งที่จ้างคนขนกระสอบ
# ข้อความไม่อธิบายว่าทำไมข้าวเบา คนมีตราได้ยินเสียงเคี้ยวในยุ้ง แต่ไม่มีอะไรเข้ามาใกล้

# ---------- 1 สัญญาณแรก: ลานนวด ----------
- id: adult.sky_hunger_threshing_floor
  stage: adult
  weight: 28
  when:
    age: [16, 130]
    year: [368, 374]
    location_tag: arvel_village
  text: |
    หน้าเกี่ยวปีนี้กระสอบข้าวบนลานนวดของหมู่บ้านตั้งเรียงไปจนถึงรั้ว ข้าวเต็มทุกกระสอบ มัดปากแน่น รอเกวียนขนเข้าลานโรงชั่งในเมือง โยรัน ลูกชายคนเช่านา ยกกระสอบขึ้นบ่าด้วยมือข้างเดียวแล้วหัวเราะ บอกว่าปีนี้ข้าวเบาเหมือนแกลบ คนบนลานไม่หัวเราะตาม กระสอบขนาดนี้เคยต้องสองคนหาม

    ยายเมลดา คนนวดข้าวบนลานนี้มาตั้งแต่ยังสาว ใช้เล็บโป้งแกะเมล็ดหนึ่ง ข้างในไม่มีอะไร เปลือกบางห่อลมไว้เม็ดหนึ่ง แกแกะอีกเม็ด อีกเม็ด แล้วปัดเปลือกทิ้งจากตัก คนเช่านาบอกว่าคนในเมืองต้องหาว่าหมู่บ้านโกงน้ำหนักแน่ๆ อีกคนว่าเอาไปขายแบบตวงถังสิ ตวงถังไม่มีใครชั่ง ยายเมลดาว่าข้าวแบบนี้ต้องไถกลบคืนนา ไม่ควรเข้าปากใคร เด็กๆ บนลานเคี้ยวข้าวดิบกันเล่นทั้งบ่าย กินทีละกำมือ แล้วบอกว่ายังหิว

    ตกค่ำ คนเฝ้ายุ้งของหมู่บ้านเดินมาบอกว่าในยุ้งมีเสียงเหมือนอะไรเคี้ยวอยู่ใต้กองข้าว เขาไม่ยอมเฝ้าคืนนี้ ทุกคนบนลานหันมาทาง{name}
  choices:
    - id: sell_by_the_bucket
      label: ขนไปขายในเมืองแบบตวงถัง ไม่ให้ใครชั่ง
      text: |
        {name}ไปกับเกวียนเล่มแรก ตั้งแผงขายท้ายตลาดแบบตวงถัง ถังละเท่าราคาปีก่อน แม่ครัวโรงเตี๊ยมซื้อไปสี่ถัง ไม่ได้ยก ไม่ได้ชั่ง ขายหมดก่อนเที่ยง หมู่บ้านแบ่งส่วนให้{name}ตามที่ตกลง

        เดือนต่อมาแม่ครัวคนนั้นมาตามหาแผงท้ายตลาด ไม่ได้มาด่า นางมาซื้อเพิ่ม บอกว่าแขกกินข้าวหุงจากข้าวนี้ไม่รู้จักอิ่ม สั่งเพิ่มกันทุกโต๊ะ ขายดีกว่าทุกปี
      effects: { gold: 2, alignment: { law: -1 }, flags: [sold_hollow_grain_by_the_bucket] }
    - id: sort_by_thumbnail
      label: นั่งแกะเมล็ดคัดข้าวดีออกจากข้าวกลวงกับยายเมลดา
      habit: craft_hands
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          สองคนนั่งแกะกันใต้ตะเกียงจนดึก เมล็ดดีหนักปลายนิ้ว เมล็ดกลวงแกะแล้วมีแต่ลม คัดไปได้ครึ่งกระสอบ{name}ก็สังเกตเห็นว่าข้าวดีมาจากกระสอบเดียวกันเกือบทั้งหมด กระสอบที่ผูกเชือกแดง ข้าวจากนาแปลงริมเนิน แปลงที่ไถอ้อมเนินตามข้อเก่า และเว้นรวงท้ายไว้ทุกปี

          ยายเมลดาฟังแล้วหยิบเมล็ดจากกระสอบเชือกแดงขึ้นมาแกะดูเอง เต็มทุกเม็ด แกไม่ได้บอกว่าทำไม แกเอากระสอบนั้นไปเก็บไว้ใต้เตียงตัวเอง
        effects: { stats: { DEX: 1 }, flags: [sorted_hollow_grain_by_thumbnail] }
      failure:
        text: |
          เล็บโป้ง{name}ฉีกถึงเนื้อตั้งแต่ยังคัดไม่ถึงชาม เมล็ดดีกับเมล็ดกลวงดูเหมือนกันทุกเม็ดใต้ตะเกียง ยายเมลดาแกะได้สามชาม{name}ได้ครึ่งชาม แถมผสมเม็ดกลวงปนไปอีกหลายเม็ด

          สางแล้วสองคนยังนั่งแกะกันไม่เลิก ตาแดง นิ้วบวม ยายเมลดาเทชามของ{name}ลงกองเดิมทั้งชาม บอกว่าปีหน้าค่อยหัดใหม่
        effects: { hp: -1, flags: [sorted_hollow_grain_by_thumbnail] }
    - id: back_the_old_woman
      label: ยืนข้างยายเมลดา พูดให้ทั้งลานยอมไถกลบข้าวกลวงคืนนา
      habit: sweet_tongue
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ไม่พูดเรื่องโกงหรือไม่โกง พูดเรื่องเด็กบนลานที่เคี้ยวข้าวดิบกันทั้งบ่ายแล้วยังหิว คนเช่านาหันไปดูลูกตัวเองที่ยังเคี้ยวอยู่ แล้วเป็นคนแรกที่ยกกระสอบเทลงนา

          สัปดาห์นั้นหมู่บ้านไถกลบข้าวกลวงคืนนาเกือบครึ่ง เหลือแต่กระสอบที่แกะดูแล้วเต็ม เข้าเมืองน้อยกว่าทุกปี ขายได้น้อยกว่าทุกปี นายโรงชั่งในเมืองชั่งกระสอบของหมู่บ้านนี้สองรอบ แล้วจดลงสมุดว่าน้ำหนักตรง
        effects: { stats: { CHA: 1 }, flags: [ploughed_the_hollow_grain_back], city: { merit: 1, here: true } }
      failure:
        text: |
          คนเช่านาถามว่าใครจะจ่ายค่านาให้นายที่ดินถ้าเทข้าวทิ้ง {name}ตอบไม่ได้ คนบนลานแยกย้ายไปมัดปากกระสอบต่อ ยายเมลดาเทกระสอบของตัวเองลงนาคนเดียว เทเสร็จแล้วนั่งพักบนคันนา

          เกวียนออกจากหมู่บ้านตอนสาง เด็กๆ นั่งบนกองกระสอบไปด้วย เคี้ยวข้าวดิบกันไปตลอดทาง
        effects: { flags: [ploughed_the_hollow_grain_back] }
    - id: sit_the_granary_night
      label: เข้าไปนั่งเฝ้ายุ้งแทนคืนนี้
      requires: { trait: curse_brand }
      text: |
        {name}ปูกระสอบนั่งพิงประตูยุ้ง ตะเกียงดวงเดียววางข้างตัว ตอนดึกเสียงเคี้ยวดังขึ้นจากใต้กองข้าว ช้า เปียก เคี้ยวไม่หยุด กองข้าวยุบลงไปทีละน้อยตรงกลางกอง {name}ยกตะเกียงสูง เห็นอะไรสีมืดกว่ากลางคืนขยับอยู่ข้างใต้ ขยับไปทางมุมโน้น ไม่เคยขยับมาทางนี้ ทั้งคืนเสียงเคี้ยวไม่มาใกล้ประตูเกินสามช่วงแขน

        เช้ามาคนเฝ้ายุ้งเดินมาดู เห็น{name}นั่งพิงประตูยุ้ง ไม่เป็นอะไร เขาถามว่าได้ยินไหม {name}บอกว่าได้ยิน แต่เสียงนั้นไม่สนใจ{name} คนเฝ้ายุ้งเอามือลูบหลังคอตัวเอง แล้วขอให้{name}มาเฝ้าต่ออีกคืน ให้ค่าจ้างเป็นข้าวจากกระสอบเชือกแดง
      effects: { stats: { CON: 1 }, flags: [sat_the_granary_unheeded] }

# ---------- 2 ชั่งสองหน ----------
- id: adult.sky_hunger_weigh_twice
  stage: adult
  weight: 24
  scene: market
  when:
    age: [16, 130]
    year: [370, 379]
  text: |
    ร้านข้าวสารในตลาดตั้งตาชั่งไว้หน้าร้านสองตัว ตัวหนึ่งของคนขาย ตัวหนึ่งของคนซื้อหิ้วมาเอง กระสอบที่ชั่งตอนรุ่งต้องปิดปากด้วยครั่ง กดนิ้วโป้งทั้งสองฝ่าย ตั้งไว้ในร้านจนค่ำแล้วชั่งอีกหน จ่ายตามน้ำหนักตอนค่ำ ใครไม่รอถือว่ายอมเอง กระสอบที่เช้าเต็มตาชั่ง ตกค่ำบางทีเหลือสองส่วนสาม บางทีเหลือครึ่ง

    ฮิลเด หญิงชาวนาที่หอบข้าวมาขายเองทุกสัปดาห์ ขายไปด้วยสอนคนไปด้วย นางว่าในนาของนาง รวงท้ายที่เว้นไว้ตามข้อเก่าไม่เคยเบาสักปี นาบ้านอื่นก็เหมือนกัน ถามชาวนาคนไหนก็ได้ นางเลยให้ทุกบ้านที่ซื้อข้าวนางเว้นข้าวกำมือสุดท้ายไว้ก้นโอ่ง ไม่ตัก ไม่กิน ไม่เท นักบวชที่มาเทศน์ที่หัวลานตลาดเรียกนางไปพูดด้วยสองหนแล้ว บอกว่าอย่าเอาเรื่องแบบนี้มาพูดกลางตลาด นางก็ยังพูด

    เช้านี้{name}มาซื้อข้าวที่ร้านนาง กระสอบเพิ่งขึ้นตาชั่งตัวแรก
  choices:
    - id: leave_the_last_handful
      label: ทำตามข้อของนาง เว้นข้าวกำมือสุดท้ายไว้ก้นโอ่ง
      text: |
        {name}เทข้าวลงโอ่งที่บ้าน ตักกินไปทั้งเดือนจนเหลือก้นโอ่ง แล้วหยุด ข้าวกำมือสุดท้ายนอนอยู่ก้นโอ่ง ข้าวสารกระสอบใหม่เทลงทับ กำมือเดิมก็ยังอยู่ข้างใต้ ไม่มีใครตักถึง

        เดือนต่อมา{name}ลองล้วงขึ้นมาดู เมล็ดเต็มทุกเม็ด หนักมือ ข้าวกระสอบเดียวกันที่ตักกินไปเบาลงทุกสัปดาห์ แต่กำมือนี้ไม่เบา บ้านติดกันมาขอดูโอ่ง แล้วกลับไปเว้นกำมือท้ายในโอ่งของตัวเองบ้าง ไม่มีใครในซอยถามว่าทำไม ถามไปก็ไม่มีใครตอบได้
      effects: { world: { land: 1 }, flags: [left_the_last_handful_in_the_jar] }
    - id: wait_for_the_dusk_weigh
      label: ปิดครั่งกดนิ้ว แล้วนั่งรอชั่งหนที่สองตอนค่ำ
      habit: cool_headed
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}นั่งรออยู่ร้านตรงข้ามทั้งวัน มองกระสอบของตัวเองอยู่เรื่อยๆ ตกบ่ายเห็นเด็กร้านข้างๆ เอาน้ำพรมกระสอบของลูกค้าอีกคนให้หนักขึ้นก่อนชั่งค่ำ {name}เดินไปบอกเจ้าของกระสอบ แล้วกลับมานั่งต่อ

          ค่ำนั้นกระสอบของ{name}เหลือเกือบเต็ม ฮิลเดบอกว่าข้าวจากนาที่ไถอ้อมเนินมาเบาน้อยกว่าที่อื่น นางคิดราคาตามน้ำหนักค่ำ ไม่ปัดขึ้น ลูกค้าอีกคนที่{name}บอกเดินมาจ่ายค่าชาให้
        effects: { stats: { WIS: 1 }, flags: [waited_for_the_dusk_weigh] }
      failure:
        text: |
          {name}ไปทำธุระระหว่างวัน กลับมาไม่ทันเวลาชั่งค่ำ ร้านปิดไปแล้ว ฮิลเดฝากกระสอบไว้กับร้านข้างๆ พร้อมกระดาษจดน้ำหนักเช้า ตามข้อของตลาด คนไม่รอถือว่ายอมเอง

          {name}จ่ายตามน้ำหนักเช้า แบกกลับบ้านแล้วยืมตาชั่งบ้านติดกันมาชั่ง เหลือไม่ถึงสองส่วนสาม
        effects: { gold: -1, flags: [waited_for_the_dusk_weigh] }
    - id: rent_out_a_scale
      label: ตั้งตาชั่งตัวที่สองให้คนซื้อเช่าใช้ที่หัวลาน
      text: |
        {name}ไปยืมตาชั่งเก่าจากคนรู้จัก ตั้งไว้ที่หัวลานตลาด ใกล้ที่นักบวชเทศน์ คิดค่าเช่าชั่งหนละเศษเหรียญ คนซื้อที่ไม่มีตาชั่งของตัวเองต่อแถวกันตั้งแต่เช้าถึงค่ำ ได้เงินกว่าค่าข้าวที่มาซื้อเสียอีก

        นักบวชเทศน์ไปมองตาชั่งไป ตอนเลิกเทศน์เขาเดินมาขอชั่งข้าวในย่ามตัวเองสองหน จ่ายค่าชั่งครบ ไม่ขอลด
      effects: { gold: 2, flags: [rented_out_a_second_scale] }

# ---------- 3 ของที่ยื่นให้: ผลไม้เบา (วัยปลาย) ----------
- id: elder.sky_hunger_light_fruit
  stage: elder
  weight: 24
  scene: home
  when:
    age: [60, 130]
    year: [370, 378]
    not_traits: [curse_brand, curse_hunger]
  text: |
    เปตรา หญิงกะดึกของโรงสี เดินผ่านหน้าบ้าน{name}ทุกรุ่งตอนเลิกงาน ตั้งแต่หน้าเกี่ยวนางไม่ได้นอน นางบอกเองกับทุกคนอย่างร่าเริง ทำกะดึกแล้วต่อกะเช้า แล้วต่อกะดึกอีก ไม่เหนื่อย แก้มนางตอบลงไปทุกสัปดาห์ แต่ตาใสแจ๋ว คนโรงสีเล่าว่านางเคี้ยวปลายเทียนไขระหว่างกะ แบ่งให้คนอื่นด้วย

    เช้านี้{name}นั่งนวดเข่าอยู่หน้าบ้าน เข่าปวดมาสามคืนแล้ว เปตราหยุดเดิน หยิบผลไม้ลูกหนึ่งออกจากย่าม ผิวแดงสวยไม่มีรอยช้ำ วางลงในมือ{name} ผลไม้เบาจนเหมือนถือโคมกระดาษ นางบอกว่ากินแล้วเข่าจะไม่ปวด หลังจะไม่ปวด จะไม่ต้องเหนื่อยอีกเลย นางเองกินมาตั้งแต่หน้าเกี่ยว แล้วผ่าอีกลูกให้ดู ข้างในไม่มีเนื้อ ไม่มีเมล็ด มีแต่กลิ่นหวานลอยออกมา
  choices:
    - id: eat_the_light_fruit
      label: กัดผลไม้ลูกนั้น (ของแบบนี้ติดตัวไปนาน)
      text: |
        เปลือกกรอบ ข้างในไม่มีอะไรให้เคี้ยว มีแต่ความหวานที่ละลายไปก่อนจะถึงคอ {name}กินจนหมดลูก ท้องยังว่างเท่าเดิม เปตรายิ้มให้แล้วเดินต่อไปทำกะเช้า

        ตกบ่าย{name}ลุกขึ้นกวาดลานบ้าน กวาดเสร็จแล้วกวาดบ้านติดกันให้ด้วย ตกค่ำล้างหม้อทุกใบในครัว ตีสองยังนั่งปะเสื้อทุกตัวที่ขาด เข่าไม่ปวด หลังไม่ปวด ไม่ง่วง กินข้าวเย็นไปสองจานแล้วลุกมาหาขนมปังกินต่อ กินเสร็จก็ยังหิว แต่ไม่เหนื่อย ไม่เหนื่อยเลย
      effects: { traits: [curse_hunger], marks: { star: 1 }, world: { star: 1 }, flags: [ate_the_millwomans_fruit] }
    - id: give_it_back
      label: วางผลไม้คืนในมือนาง
      text: |
        เปตราไม่ถือ นางเก็บผลไม้ใส่ย่าม บอกว่าเข่าคนแก่ก็ต้องปวดบ้างเป็นธรรมดา แล้วเดินต่อไปทำกะเช้า

        หน้าหนาวปีนั้นคนโรงสีหามนางกลับบ้านตอนเช้าวันหนึ่ง นางหลับกลางกะ หลับไปสามวันสามคืน ตื่นมาก็ร้องขอข้าว กินไปร้องไห้ไป ตั้งแต่นั้นเปตราเดินผ่านหน้าบ้าน{name}ช้าลง และทักทุกเช้า
      effects: { flags: [gave_back_the_millwomans_fruit] }
    - id: ask_when_she_slept
      label: ถามนางว่าหลับครั้งสุดท้ายเมื่อไร
      habit: curious
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          เปตรานับนิ้ว นับไปได้สองมือแล้วหัวเราะ บอกว่าจำไม่ได้ จำได้แต่ว่าคืนนั้นฝันถึงแม่ {name}จับข้อมือนางไว้ ข้อมือเล็กจนนิ้วโป้งกับนิ้วกลางชนกัน ผิวเย็นเหมือนแป้งที่ลืมนวดทิ้งไว้

          {name}ไม่กินผลไม้ ให้นางนั่งพักบนแคร่หน้าบ้าน เปตราบอกว่าไม่เหนื่อย นั่งได้ไม่นานก็ลุกไปกวาดลานบ้านให้{name}จนสะอาด แล้วเดินไปทำกะเช้า ผลไม้ลูกนั้นวางทิ้งไว้บนแคร่ ตกบ่ายเปลือกยุบลงไปเหมือนถุงลมรั่ว
        effects: { stats: { WIS: 1 }, flags: [asked_the_millwoman_about_sleep] }
      failure:
        text: |
          เปตราตอบว่าเมื่อคืนนี้เอง แล้วเปลี่ยนเรื่องไปถามเรื่องเข่า ถามจนเข่า{name}ปวดขึ้นมาอีก {name}ถือผลไม้ไว้ในมือไม่กล้ากิน ไม่กล้าคืน

          คืนนั้น{name}วางผลไม้ไว้ข้างหมอน นอนไม่หลับทั้งคืน กลิ่นหวานลอยอยู่ทั้งห้อง ตอนสางเอาไปฝังโคนรั้ว เข่าปวดทั้งวัน
        effects: { hp: -1, flags: [asked_the_millwoman_about_sleep] }

# ---------- 4 อุบัติเหตุ: ขนมปังของเจ้าของยุ้ง (วัยทำงาน) ----------
- id: adult.sky_hunger_granary_bread
  stage: adult
  weight: 20
  when:
    age: [16, 59]
    year: [370, 378]
    not_traits: [curse_brand, curse_hunger]
  text: |
    ออสวินเจ้าของยุ้งจ้างคนขนกระสอบขึ้นยุ้งหนึ่งวันเต็ม ให้เสร็จก่อนเจ้าพนักงานมาชั่งภาษีพรุ่งนี้ ค่าแรงดี มีขนมปังเลี้ยงกลางวัน {name}รับงาน ตกเที่ยงออสวินยกตะกร้าขนมปังมาวาง ก้อนใหญ่ สีสวย อบใหม่จากเตาร้านเดียวกับที่คนในละแวกเลิกซื้อกันไปหลายบ้านแล้ว เพราะกินหมดก้อนแล้วยังหิว

    คนขนกระสอบสองคนที่กินเมื่อวาน ทำงานต่อจนดึกโดยไม่มีใครสั่ง ร้องเพลงกันทั้งคืน เช้านี้ยังร้องอยู่ ตอนนี้กำลังแย่งขนมปังก้อนที่สามกัน
  choices:
    - id: eat_the_bread
      label: กินขนมปังของออสวิน งานยังเหลืออีกครึ่งวัน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          คำที่สามท้อง{name}บิดขึ้นมาเอง {name}เดินไปหลังยุ้ง อาเจียนออกมาหมด ขนมปังที่ออกมาไม่เปียก ไม่เละ แห้งเป็นแผ่นเหมือนกระดาษ {name}ไปซื้อขนมปังดำก้อนหนักจากร้านที่ชั่งสองหนมากินแทน กินแล้วอิ่ม อิ่มแบบที่ท้องรู้

          ตกเย็นงานเสร็จ{name}เหนื่อยจนขาสั่น สองคนนั้นยังร้องเพลงอยู่บนกองกระสอบ ขนกระสอบเปล่ากลับไปกลับมา ไม่มีใครบอกให้หยุด
        effects: { stats: { CON: 1 }, flags: [threw_up_the_granary_bread] }
      failure:
        text: |
          ขนมปังนุ่ม หวานนิดๆ กินหมดก้อนท้องยังว่าง {name}กินก้อนที่สอง แล้วกลับไปขนกระสอบต่อ ตกบ่ายกระสอบเบาลงทุกกระสอบ หรือไม่แขนก็แรงขึ้น {name}แยกไม่ออก ตกค่ำงานเสร็จ {name}ไม่กลับบ้าน ช่วยสองคนนั้นขนกระสอบจากยุ้งหนึ่งไปอีกยุ้งจนสาง ร้องเพลงไปด้วย

          เช้ามา{name}กินข้าวต้มบ้านไปสามชาม ยังหิว ทั้งตัวไม่มีตรงไหนบอกว่าเหนื่อยเลยสักนิด
        effects: { traits: [curse_hunger], flags: [ate_the_granary_bread] }
    - id: buy_twice_weighed_bread
      label: ไม่กิน ควักเงินไปซื้อขนมปังจากร้านที่ชั่งสองหนมากินเอง
      text: |
        ขนมปังร้านที่ชั่งสองหนแพงกว่าครึ่งเท่า ก้อนเล็ก ดำ แข็ง หนักมือ {name}กินหมดก้อนแล้วอิ่มจนเย็น ตกเย็นเหนื่อยแบบคนทำงานมาทั้งวัน ค่าขนมปังกินค่าแรงไปเกือบครึ่ง

        ขากลับ{name}เดินผ่านยุ้ง สองคนนั้นยังร้องเพลงอยู่ข้างใน
      effects: { gold: -1, flags: [bought_twice_weighed_bread] }
    - id: work_on_empty
      label: ไม่กินอะไรเลย ขนต่อจนเสร็จ
      habit: stubborn
      check: { stat: STR, dc: 13 }
      success:
        text: |
          ท้องร้องตั้งแต่บ่ายต้น {name}ดื่มน้ำบ่อแทน ขนกระสอบต่อทีละใบ ไหล่ร้อน มือสั่นตอนใกล้ค่ำ งานเสร็จทันก่อนตะวันตก ออสวินจ่ายเต็มแล้วถามว่าทำไมไม่กินขนมปัง {name}ชี้ไปที่สองคนบนกองกระสอบ
        effects: { stats: { STR: 1 }, flags: [worked_the_granary_on_empty] }
      failure:
        text: |
          ตกบ่ายตาลาย {name}ทรุดลงข้างกองกระสอบ หน้าแขนครูดกับเชือกจนถลอก ออสวินหักค่าแรงส่วนที่ไม่ได้ขน สองคนนั้นขนส่วนที่เหลือต่อให้เองโดยไม่ขอค่าแรงเพิ่ม ร้องเพลงไปด้วย
        effects: { hp: -1, flags: [worked_the_granary_on_empty] }

# ---------- 5 ลึกลง: คัดข้าวทั้งซอย ข้อตกลงที่สอง ----------
- id: adult.sky_hunger_sort_the_lane
  stage: adult
  weight: 80
  scene: home
  time: night
  when:
    age: [16, 130]
    year: [370, 379]
    trait: curse_hunger
    not_traits: [curse_brand]
  text: |
    เจ้าพนักงานจะมาชั่งข้าวส่วนที่ซอยต้องส่งพรุ่งนี้ตอนสาย ข้าวกองกลางซอยต้องแกะคัดเม็ดกลวงออกให้หมดก่อน ไม่อย่างนั้นน้ำหนักไม่ถึง แล้วทุกบ้านต้องควักเงินจ่ายส่วนที่ขาด คนทั้งซอยนั่งล้อมกองข้าวใต้ตะเกียงตั้งแต่หัวค่ำ เล็บโป้งฉีก ตาแดง พอดึกก็เริ่มหลับคาที่ไปทีละคน

    {name}ไม่ง่วง ไม่ได้ง่วงมาหลายคืนแล้ว ท้องหิวเท่าทุกคืน มือแกะเร็วกว่าทุกคนในซอย หัวหน้าซอยมองกองข้าวที่เหลืออีกครึ่งกอง แล้วมองมือ{name}
  choices:
    - id: sort_your_share
      label: คัดส่วนของตัวเองจนเสร็จ แล้วช่วยบ้านที่หลับไปก่อนอีกหน่อย
      habit: soft_heart
      text: |
        {name}คัดส่วนของตัวเองเสร็จก่อนเที่ยงคืน แล้วย้ายไปนั่งข้างหญิงบ้านท้ายซอยที่หลับคากองข้าว คัดส่วนของนางต่อ มือไม่ช้าลงเลย ท้องร้องทุกครั้งที่เม็ดดีหล่นลงชาม {name}เอาเม็ดกลวงเข้าปากเคี้ยวเล่นไปด้วย เคี้ยวแล้วไม่มีอะไร หยุดไม่ได้

        เช้ามาหญิงบ้านท้ายซอยตื่นมาเห็นชามของตัวเองเต็ม แบ่งเงินค่าแรงให้{name}ส่วนหนึ่ง แก้มของ{name}ตอบลงไปอีกนิด เข็มขัดต้องเจาะรูใหม่
      effects: { gold: 1, trait_step: { curse_hunger: 1 }, flags: [sorted_a_neighbours_share_too], city: { merit: 1, here: true } }
    - id: sort_it_all_tonight
      label: บอกทุกคนให้ไปนอน คัดทั้งกองให้เสร็จคืนนี้คนเดียว (ของแบบนี้ติดตัวไปนาน)
      text: |
        คนทั้งซอยกลับไปนอน หัวหน้าซอยทิ้งตะเกียงไว้ให้ดวงหนึ่ง {name}นั่งลงกลางกอง มือแกะไม่หยุด เม็ดดีลงชามซ้าย เม็ดกลวงลงชามขวา ไม่ได้นับว่าผ่านไปนานเท่าไร ตะเกียงหมดน้ำมัน {name}ก็แกะต่อในแสงดาว ระหว่างนั้นเอาปลายไส้ตะเกียงที่ไหม้เหลือเข้าปากเคี้ยว เคี้ยวแล้วท้องเงียบไปครู่หนึ่ง

        ไก่ขัน กองข้าวคัดเสร็จทั้งกอง เจ้าพนักงานมาชั่ง น้ำหนักเกินที่ต้องส่ง หัวหน้าซอยประกาศกลางซอยว่าปีนี้บ้าน{name}ไม่ต้องควักค่าส่วนที่ขาดอีกหลายเดือน แล้วเอาเงินที่ทุกบ้านลงขันกันไว้มาให้{name}ทั้งถุง คนในซอยขอบคุณ{name}ทุกคน ไม่มีใครถามว่าเมื่อคืนเห็นอะไรบ้าง
      effects: { gold: 3, trait_step: { curse_hunger: 1 }, marks: { star: 1 }, world: { star: 1 }, flags: [sorted_the_whole_lane_in_a_night], city: { merit: 1, here: true } }
    - id: lie_down_anyway
      label: เลิกแกะ กลับไปนอนเหมือนคนอื่น ถึงจะหลับไม่ลงก็ตาม
      text: |
        {name}นอนหงายลืมตาทั้งคืน มือกำผ้าห่มไว้ไม่ให้ลุกกลับไปที่กองข้าว ได้ยินเสียงเพื่อนบ้านแกะเมล็ดอยู่ข้างนอกจนสาง

        กองข้าวคัดไม่ทัน น้ำหนักขาด ทุกบ้านต้องควักเงินจ่ายส่วนที่ขาด บ้าน{name}ก็ต้องจ่ายเท่ากัน หัวหน้าซอยเดินผ่านหน้าบ้าน{name}ไปโดยไม่ทัก
      effects: { gold: -2, flags: [lay_awake_instead_of_sorting] }

# ---------- 6 ลึกอีกชั้น: ครัวตอนดึก ----------
- id: adult.sky_hunger_night_kitchen
  stage: adult
  weight: 80
  scene: home
  time: night
  when:
    age: [16, 130]
    year: [370, 379]
    trait: curse_hunger
  text: |
    เทียนบนหิ้งสั้นลงทุกคืนเร็วกว่าที่จุด {name}ตื่นขึ้นกลางดึกหลายหนแล้ว ตื่นมาเจอตัวเองยืนอยู่ในครัว ปากมีของอยู่เต็มปาก ครั้งหนึ่งเป็นปลายเทียน ครั้งหนึ่งเป็นชอล์กที่ลูกบ้านติดกันลืมไว้บนขอบหน้าต่าง ครั้งหนึ่งเป็นดินจากกระถางกุยช่าย ข้าวเย็นกินไปแล้วสามจาน

    คืนนี้ก็ตื่นขึ้นมาในครัวอีก ถ่านในเตาที่มอดแล้วอุ่นอยู่ในมือ ท้องร้องดังกว่าเสียงจิ้งหรีดนอกบ้าน
  choices:
    - id: eat_what_calls
      label: กินถ่านก้อนนั้น แล้วกลับไปนอน
      text: |
        ถ่านกรอบ ขม ดำติดฟันไปถึงเหงือก ท้องเงียบลงจนเกือบสาง {name}นอนหลับได้ครู่หนึ่ง ครั้งแรกในรอบหลายคืน

        เช้ามาบ้านติดกันมาขอยืมถ่านไปก่อไฟ เพราะถ่านบ้านตัวเองหายไปครึ่งกระบุง {name}ยื่นให้ทั้งกระบุง ล้างปากไปสามรอบ ฟันยังดำ
      effects: { trait_step: { curse_hunger: 1 }, flags: [ate_the_coal_from_the_stove] }
    - id: work_instead
      label: ไม่กิน ออกไปหางานทำให้มือไม่ว่างจนสาง
      text: |
        {name}หยิบเสื้อผ้าของทั้งบ้านมาปะ ปะหมดก็ตอกตะปูบานพับที่หลวม ตอกหมดก็เดินไปช่วยคนเวรยามซอยถือตะเกียงเดินรอบซอย ไม่เหนื่อย ท้องร้องไปตลอดทาง คนเวรยามจ่ายค่าตะเกียงให้คืนหนึ่ง แล้วบอกว่าพรุ่งนี้มาอีกก็ได้

        เช้ามาเข็มขัดหลวมอีกรู ใต้ตาดำ แต่ตาใส ลูกบ้านติดกันถามว่า{name}ยังไม่ได้นอนแล้วยิ้มทำไม
      effects: { gold: 1, trait_step: { curse_hunger: 1 }, flags: [worked_through_the_hungry_night] }
    - id: lock_the_kitchen
      label: ลงกลอนครัว เอากุญแจไปฝากบ้านติดกัน แล้วนอนหิวทั้งคืน
      text: |
        บ้านติดกันรับกุญแจไปโดยไม่ถาม {name}กลับมานอน ท้องร้องจนผนังสั่น ลุกไปดึงกลอนครัวสามรอบ ทุกรอบกลอนลงอยู่ ตอนเกือบสาง{name}เคี้ยวมุมหมอนจนผ้าขาด ปากเจ็บ

        เช้ามาบ้านติดกันเอากุญแจมาคืนพร้อมข้าวต้มหม้อหนึ่ง บอกว่าเมื่อคืนได้ยินเสียง แต่ไม่ได้ออกมาดู
      effects: { hp: -1, flags: [locked_the_kitchen_and_went_hungry] }

# ---------- 7 อยู่กับมัน: จานครึ่งเดียว ----------
- id: adult.sky_hunger_half_plate
  stage: adult
  weight: 60
  once: false
  scene: home
  cast:
    pal: { bond: [friend], optional: true }
  when:
    age: [16, 130]
    year: [370, 410]
    trait: curse_hunger
  text: |
    ข้าวเย็นวันนี้ตักไว้ครึ่งจานตามที่ตั้งใจ ท้องร้องตั้งแต่ยังไม่ได้ตักคำแรก ข้างนอกยังมีงานค้างอยู่สองอย่าง ตัวไม่เหนื่อยเลยสักนิด และตัวไม่เหนื่อยเลยสักนิดคือสิ่งที่ห้ามเชื่อ
  choices:
    - id: stop_at_dusk
      label: กินครึ่งจาน แล้วเลิกงานตอนตะวันตก ถึงตัวจะยังไม่เหนื่อย
      text: |
        {name}วางช้อนตอนข้าวหมดครึ่งจาน เก็บเครื่องมือเข้าที่ แล้วนอนลงตั้งแต่ฟ้ายังไม่มืดสนิท ตาไม่ยอมปิดจนดึก แต่ตัวได้พัก เช้ามาลุกขึ้นได้แบบคนลุก
      effects: { hp: 1, flags: [stopped_work_at_dusk] }
    - id: second_plate
      label: ตักเพิ่มอีกจาน
      text: |
        จานที่สองหมดเร็วกว่าจานแรก ท้องยังร้องเท่าเดิม {name}ลุกไปซื้อขนมปังที่ร้านหัวซอยมาอีกก้อน กินหมดก้อนระหว่างเดินกลับ ค่าข้าวสัปดาห์นี้หมดไปตั้งแต่วันที่สาม
      effects: { gold: -1, flags: [ate_a_second_plate] }
    - id: work_the_night
      label: ทำงานที่ค้างให้เสร็จ ทำต่อไปจนสาง
      text: |
        งานค้างสองอย่างเสร็จก่อนเที่ยงคืน {name}หางานที่สามที่สี่ทำต่อ รับจ้างคัดถั่วให้ร้านหัวซอยได้เงินมาหนึ่งเหรียญ พอสางมือเริ่มสั่นเองโดยที่ตัวยังไม่รู้ว่าเหนื่อย
      effects: { gold: 1, hp: -1, flags: [worked_the_hungry_night_through] }
    - id: pal_takes_the_plate
      label: ให้{pal}มากินข้าวเย็นด้วย แล้วยกจานไปเก็บเมื่อครบครึ่ง
      requires: { cast: [pal] }
      text: |
        {pal}นั่งตรงข้าม เล่าเรื่องที่ไม่ได้ฟังกันมานาน พอข้าวในจานของ{name}หมดไปครึ่ง {pal}ก็ยกจานไปล้างเลยโดยไม่ถาม แล้วนั่งคุยต่อ คุยจนท้องที่ร้องเสียงเบาลงไปเอง
      effects: { people: [{ id: "@pal", closeness: 1 }], flags: [a_friend_took_the_plate_away] }

# ---------- 8 ทางออก ----------
- id: adult.sky_hunger_way_out
  stage: adult
  weight: 150
  once: false
  scene: road
  when:
    age: [16, 130]
    year: [370, 410]
    trait: curse_hunger
    not_flags: [kept_the_hollow_belly]
  text: |
    ครอบครัวชาวนาครอบครัวหนึ่งตั้งเพิงพักอยู่ริมทาง ยุ้งที่บ้านเบาลงจนไม่เหลืออะไร ทิ้งนามา แม่นั่งป้อนน้ำข้าวให้ลูกคนเล็กทีละช้อน ลูกคนโตนั่งเฝ้าหม้อเปล่า หญิงจากศาลอีเซลที่หาบหม้อน้ำข้าวมาแจกริมทางทุกเช้า ตักให้ครอบครัวนั้นแล้วหันมาดู{name}อยู่ครู่หนึ่ง นางเห็นคนแบบ{name}มามากแล้ว นางบอกว่าทางออกมีสองทาง ทางแรก อดอาหารสามวันสามคืนข้างคนที่หิวจริง แล้วให้เขากินก่อน ทางที่สอง ทำงานที่เหนื่อยที่สุดในชีวิตให้จบด้วยมือตัวเอง จนเหนื่อยกลับมาหา

    นางบอกว่าทางแรกยากตรงที่ต้องเห็นเขากินก่อน ทางที่สองยากตรงที่เหนื่อยไม่ยอมมา ทำเท่าไรก็ไม่มา จนวันที่มาจริงๆ
  choices:
    - id: fast_beside_them
      label: นั่งอดอาหารข้างเพิงนั้นสามวันสามคืน เอาอาหารที่ซื้อมาให้ครอบครัวนั้นกินก่อน
      habit: soft_heart
      text: |
        {name}ซื้อข้าว ถั่ว กับขนมปังดำที่ชั่งสองหนมาวางไว้หน้าเพิง ไม่แตะเอง วันแรกท้องร้องจนครอบครัวนั้นหันมาดู วันที่สองมือหยิบขนมปังขึ้นมาถึงปาก แล้ววางลงในมือลูกคนโตแทน คืนที่สามนอนคดอยู่ข้างเพิง ฟังแม่ป้อนลูกคนเล็กทีละช้อน ฟังลูกคนโตกินคำสุดท้ายจนเกลี้ยงหม้อ

        เช้าวันที่สี่แม่ยื่นน้ำข้าวถ้วยหนึ่งให้{name} {name}ดื่มไปครึ่งถ้วยก็อิ่ม อิ่มจนต้องวาง แล้วความเหนื่อยของสามวันสามคืนก็มาทับลงทั้งตัวพร้อมกัน {name}หลับไปข้างเพิงจนเที่ยง ไม่ฝันอะไรเลย
      effects: { lose_traits: [curse_hunger], marks: { star: -1 }, gold: -2, hp: -1, flags: [fasted_beside_the_truly_hungry] }
    - id: grind_the_sack
      label: ซื้อข้าวรวงท้ายหนึ่งกระสอบ โม่ด้วยโม่มือของตัวเองจนเป็นแป้งทั้งกระสอบ
      habit: craft_hands
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ข้าวรวงท้ายหนึ่งกระสอบต้องรวบรวมจากนาหลายบ้าน ราคาแพงกว่าข้าวสารสามเท่า {name}นั่งโม่ตั้งแต่เช้า โม่ไม่หยุด ไม่เหนื่อย จนค่ำ จนดึก จนรุ่งอีกวัน แป้งเหลืองนวลกองขึ้นรอบโม่ วันที่สองฝ่ามือพองแล้วแตก วันที่สามตอนบ่าย กำมือสุดท้ายลงโม่ {name}หมุนรอบสุดท้ายจนเม็ดสุดท้ายแตก

          แล้วเหนื่อยก็มา มาทีเดียวทั้งหมด แขนตกลงข้างตัว ยกไม่ขึ้น {name}นอนลงข้างโม่ หิว หิวแบบคนเหนื่อย กินขนมปังแผ่นบางที่อบจากแป้งของตัวเองไปแผ่นเดียวก็อิ่ม แป้งที่เหลือเอาไปแจกครอบครัวริมทาง
        effects: { lose_traits: [curse_hunger], marks: { star: -1 }, gold: -2, flags: [ground_the_last_sheaf_to_the_end] }
      failure:
        text: |
          {name}โม่ไปได้สองวันสองคืน ไม่เหนื่อยเลย วันที่สามแป้งเหลือในกระสอบอีกครึ่ง เพื่อนบ้านมาเรียกไปช่วยยกเกวียนที่ล้อตกร่อง {name}ลุกไปช่วย กลับมาคิดว่าจะโม่ต่อพรุ่งนี้

          พรุ่งนี้กลายเป็นอีกวัน แล้วอีกวัน ข้าวครึ่งกระสอบข้างโม่หนักเท่าวันที่ซื้อมา ไม่เบาลงสักนิด
        effects: { gold: -2, flags: [left_the_quern_half_done] }
    - id: keep_the_hunger
      label: ขอบคุณนาง แล้วกลับไปตักข้าวครึ่งจานตามเดิม
      text: |
        {name}ทิ้งเหรียญไว้หน้าเพิงหนึ่งเหรียญ แล้วเดินกลับบ้าน ตกค่ำตักข้าวครึ่งจาน กินหมด ท้องยังร้อง ลุกไปทำงานที่ค้าง ตัวไม่เหนื่อย และ{name}ไม่เชื่อตัวเองเรื่องนั้น
      effects: { flags: [kept_the_hollow_belly] }
