# วัยกลางคน พร คำสาป และการขอขมา (ชุด 4)
# พรมาโดยไม่มีพิธีและไม่มีพยาน เช้าวันหนึ่งของบางอย่างทำกับคนคนนี้ไม่เหมือนเดิม ตัวเลือกคือคนนั้นทำอะไรกับมัน:
#   รับไว้ (ได้พร) ลองของเพื่อเงิน (ทอย พลาดคือเผลอฝืนข้อห้ามข้อเดียวกันและไม่ได้พร) หรือเดินหนี (flag)
# คำสาปไฟไม่ติด: ทุกตัวเลือกให้คำสาป ตัวเลือกคือใครจุดเตาให้ ทางแก้สองทางอยู่ท้ายไฟล์
# คำสาปคนตัดไม้: ป่าจำหน้า แล้วเลือกทาง (ปลูกร้อยต้น คืนขวาน หรือหนีไปที่ที่ต้นไม้น้อย) ทางแก้สองทางใช้ years
# ขอขมาสามถิ่น ทำตามพิธีในคัมภีร์ (ข้อห้ามตามถิ่น) โดยคนที่ฝืนเอง ไม่มีใครทำแทนได้

# ---------- พร ----------

- id: adult.land_boon_river
  stage: adult
  scene: land_river
  weight: 40
  time: day
  when:
    age: [22, 62]
    location_tag: ventras
    taboo: { id: river, keeps: true }
    not_traits: [old_river]
  text: |
    {name}ลงบันไดท่าน้ำไปตามเคย ถังห้อยมือหนึ่ง อีกมือเอาด้ามไม้กระทุ้งแผ่นน้ำแข็งบางๆ ที่จับตามขอบขั้นล่าง ต้นหนาวปีนี้คลองแข็งเร็ว คนในซอยบ่นกันมาตั้งแต่สัปดาห์ก่อนว่าล้างหน้าทีไรฟันกระทบกันทุกที

    {name}วักน้ำขึ้นลูบหน้า แล้วหยุดมือค้างไว้ น้ำอุ่น อุ่นเท่าน้ำในอ่างที่ผสมทิ้งไว้ตั้งแต่หัวค่ำ ลองจุ่มห่างออกไปอีกศอกก็ยังอุ่น ไอบางๆ ลอยขึ้นจากผิวน้ำวงเดียว วงขนาดเสื่อผืนหนึ่ง พอตักใส่ถังหิ้วขึ้นไปถึงขั้นบนสุด น้ำในถังเย็นเฉียบเหมือนน้ำคลองทุกถังที่เคยหิ้ว

    รอยมีดบาดที่สันมือเมื่อวานซืน ตกเย็นวันนั้นปิดสนิท เหลือเส้นสีชมพูเส้นเดียว เช้าวันต่อมา และเช้าต่อจากนั้น น้ำตรงขั้นเดิมยังอุ่นรอมือของ{name}อยู่มือเดียว ท่าน้ำตอนนั้นไม่มีใครอื่น ไม่มีใครเอ่ยอะไรสักคำ
  choices:
    - id: wash_at_the_warm_step
      label: ล้างหน้าที่ขั้นนั้นทุกเช้า แล้วไม่เล่าให้ใครฟัง
      text: |
        {name}ลงไปทุกเช้าจนหมดหนาว ล้างหน้า ล้างมือ บางวันนั่งแช่เท้าจนหัวเรือลำแรกโผล่ที่โค้งคลอง หน้าหนาวนั้นมือของคนทั้งซอยแตกเป็นร่องเลือดซิบ มือของ{name}ไม่แตกสักรอย

        ปลายหนาว คนเรือที่จอดประจำหน้าท่าขยับเรือออกไปเว้นที่ให้ขั้นนั้นขั้นเดียว ไม่มีใครสั่ง เขาบอกว่าตรงนั้นน้ำวนแปลกๆ ผูกเชือกเท่าไรก็ไม่อยู่
      effects: { traits: [old_river], flags: [land_boon_taken, washed_at_the_warm_step], mark: น้ำอุ่นที่ท่าน้ำ }
    - id: dive_for_hire
      label: รับจ้างงมของในคลองหน้าหนาว งานที่ไม่มีใครยอมลง
      check: { stat: CON, dc: 13 }
      success:
        text: |
          โรงกลั่นต้นคลองทำกุญแจประตูน้ำหล่นลงไปในโคลน จ้างวันละสองเหรียญก็ไม่มีใครยอมลง {name}ลงไปสี่วัน มิดคอ น้ำรอบตัวอุ่นตามไปทุกที่ที่ตัวไป พอโผล่ขึ้นมาหายใจ ลมหนาวกัดใบหูจนแดงก่ำ

          โคลนที่ขุดขึ้นมา หัวหน้าคนงานสั่งให้เทกลับลงคลองตอนค่ำจะได้ไม่ต้องหาบ {name}หาบไปเทบ่อหลังลานทุกเข่ง ทำจนดึกทุกคืน วันที่สี่กุญแจขึ้นมาพร้อมเหรียญทองแดงเขียวคล้ำอีกกำมือหนึ่ง เหรียญกำนั้น{name}โยนคืนลงคลองไปทั้งหมด
        effects: { gold: 4, traits: [old_river], flags: [land_boon_taken, dived_the_canal_for_hire], mark: น้ำอุ่นที่ท่าน้ำ }
      failure:
        text: |
          วันที่สามความหนาวตามลงไปถึงใต้น้ำ น้ำรอบตัวอุ่นก็จริง แต่พอขึ้นจากน้ำ ขาสองข้างสั่นจนยืนไม่อยู่ กองโคลนข้างท่าสูงขึ้นทุกชั่วยาม หัวหน้าคนงานบอกว่าถ้าเช้าพรุ่งนี้นายช่างมาเห็นกองนี้ ค่าแรงทั้งสามวันไม่ต้องมาเอา

          ตกดึก{name}คว่ำเข่งโคลนลงคลองทีละเข่งจนหมดกอง โคลนลงน้ำเสียงทึบๆ เช้าวันต่อมาน้ำที่ขั้นเดิมเย็นจนนิ้วชา เย็นเท่าทุกขั้นในคลอง
        effects: { gold: 3, hp: -1, taboo: { river: break }, flags: [tipped_the_spoil_by_night] }
    - id: fetch_water_elsewhere
      label: เลี่ยงไปตักน้ำที่ท่าหัวซอยแทน
      text: |
        น้ำอุ่นกลางหน้าหนาวมีที่มาทางเดียวที่{name}นึกออก คือท่อน้ำร้อนของโรงกลั่น และน้ำจากท่อนั้นทำผ้าขาวเหลืองได้ในคืนเดียว {name}หิ้วถังไปตักที่ท่าหัวซอยแทน ไกลกว่าเดิมสองร้อยก้าว น้ำที่นั่นเย็นอย่างที่น้ำหน้าหนาวควรเย็น

        สัปดาห์ต่อมา{name}เดินผ่านท่าเดิม ขั้นนั้นจับน้ำแข็งหนาเท่าขั้นอื่น มีรอยด้ามถังของใครสักคนกระทุ้งไว้เป็นหลุม
      effects: { flags: [avoided_the_warm_step] }

- id: adult.land_boon_field
  stage: adult
  scene: land_field
  weight: 40
  time: day
  when:
    age: [22, 62]
    location_tag: arvel_village
    taboo: { id: field, keeps: true }
    not_traits: [old_field]
  text: |
    เกี่ยวเสร็จทั้งแปลงแล้ว เหลือรวงสุดท้ายยืนอยู่หัวคันนาตามเคย {name}เว้นไว้เองกับมือเหมือนทุกปี คืนนั้นลมตะวันออกพัดแรง ประตูยุ้งตีกรอบแกรบอยู่ทั้งคืน

    เช้าขึ้นรวงนั้นโน้มมาทางบ้าน ทุกรวงโน้มไปทางเดียว ทวนลมที่พัดมาทั้งคืน ส่วนรวงที่นาข้างๆ เว้นไว้ล้มราบไปทางตะวันตกตามลม

    สัปดาห์นั้นล้อเกวียนจมคูข้างทาง {name}มุดลงไปยกเพลาขึ้นเองคนเดียว มานึกได้ตอนเกวียนพ้นคูแล้วว่าวัวยังไม่ทันออกแรง หลังที่ปวดทุกหน้าเกี่ยวมาหลายปีก็หายไปเฉยๆ เหมือนลืมไปเองว่าเคยปวด
  choices:
    - id: let_the_sheaf_lean
      label: ปล่อยรวงไว้ตามเดิม แล้วกลับไปทำงานในนา
      text: |
        {name}ไม่แตะรวงนั้น ไม่เล่าให้ใครฟัง หน้าหนาวนั้นขนฟืนวันละสองหาบโดยไม่ต้องวางพัก ไข้หวัดที่เดินทั่วหมู่บ้านผ่านบ้าน{name}ไปเฉยๆ

        พอหิมะละลาย หัวคันนาตรงนั้นมีรวงเปล่ายืนเหลือแต่ก้าน เมล็ดร่วงหมดแล้ว นกไม่แตะสักเมล็ด ต้นข้าวอ่อนงอกขึ้นเป็นวงรอบโคน กว้างเท่าวงแขน
      effects: { traits: [old_field], flags: [land_boon_taken, let_the_last_sheaf_lean], mark: รวงสุดท้ายโน้มมาทางบ้าน }
    - id: plough_for_the_parish
      label: รับจ้างไถนาให้ทั้งตำบล ในเมื่อแรงไม่หมดสักที
      check: { stat: STR, dc: 13 }
      success:
        text: |
          หน้าไถปีนั้น{name}ไถให้เก้าบ้าน ออกก่อนไก่ขัน กลับเมื่อมืด ทุกแปลงมีเนินของตัวเอง บางเนินสูงเท่าเอว บางเนินเหลือแค่ดินนูนกับกอหญ้าที่เจ้าของรุ่นหลังลืมไปแล้วว่าเป็นอะไร {name}เดินหาเนินก่อนลงผาลทุกแปลง แล้วไถอ้อมทุกเนิน

          ค่าจ้างเก้าบ้านรวมได้ห้าเหรียญกับข้าวสารสองกระสอบ วัวของ{name}ผอมลงจนเห็นซี่โครง ตัว{name}เองไม่ผอมลงเลย
        effects: { gold: 5, traits: [old_field], flags: [land_boon_taken, ploughed_the_parish_round], mark: รวงสุดท้ายโน้มมาทางบ้าน }
      failure:
        text: |
          บ้านสุดท้ายเป็นของคนจากเมืองที่ซื้อนามาเมื่อหน้าแล้ง เขาถางทุกอย่างจนเรียบ ถอนหลักหินหัวเนินไปทำขอบบ่อ {name}ลงผาลตอนตะวันจะตก ตาพร่าเพราะไถมาทั้งวัน ร่องแรกลากตรงไปจนสุดแปลง

          กลางร่อง คันไถกระตุกขึ้นในมือครั้งหนึ่ง ผาลขึ้นเนินเตี้ยๆ แล้วลงอีกที วัวหยุดเดินเอง {name}ตวาดให้มันเดินต่อ เช้าวันต่อมา{name}ลุกจากที่นอนไม่ขึ้น หลังปวดแบบที่เคยปวดทุกหน้าเกี่ยว
        effects: { gold: 3, taboo: { field: break }, flags: [ploughed_over_a_levelled_mound] }
    - id: keep_away_from_the_sheaf
      label: อ้อมไปเข้านาทางอื่น ไม่เดินผ่านหัวคันนานั้นจนหิมะตก
      text: |
        {name}อ้อมไปเข้านาทางคูน้ำ ไกลกว่าเดิมครึ่งทาง คนในหมู่บ้านนี้โตมากับคำว่าของที่ได้มาโดยไม่ได้ลงแรง เดี๋ยวก็มีคนมาทวง {name}ไม่อยากรู้ว่าคนที่จะมาทวงคือใคร

        หิมะแรกลงคืนหนึ่ง เช้าขึ้นทั้งทุ่งขาวราบ หัวคันนาตรงนั้นไม่มีอะไรนูนขึ้นมาให้เห็นสักนิด
      effects: { flags: [kept_away_from_the_leaning_sheaf] }

- id: adult.land_boon_fire
  stage: adult
  weight: 40
  scene: home
  time: day
  when:
    age: [22, 62]
    taboo: { id: fire, keeps: true }
    not_traits: [old_fire]
  text: |
    {name}ตื่นเพราะเสียงฟืนแตก เสียงเปาะเบาๆ แบบที่ไฟเพิ่งกินดุ้นแรก ทั้งบ้านยังไม่มีใครลุก ฟ้านอกหน้าต่างยังดำ

    เตาที่{name}เกลี่ยขี้เถ้าคลุมไว้เมื่อคืนตามเคย ตอนนี้ลุกเป็นเปลวสูงเท่าฝ่ามือ กาน้ำบนเตามีไอขึ้นเป็นเส้น ห้องอุ่นไปถึงมุมที่ปกติหนาวที่สุด ประตูเหล็กหน้าเตาปิดสนิท ไม่มีถ่านหล่นออกมานอกเตาสักก้อน

    เช้าวันนั้น{name}ผ่าฟืนกองที่ค้างมาสามวันจนหมดก่อนกินข้าว ขวานเบามือเหมือนมีคนช่วยยกอีกแรง เช้าต่อมาเตาก็ติดรออยู่ก่อนอีก
  choices:
    - id: let_the_hearth_wake_first
      label: ตั้งหม้อบนไฟที่ติดรออยู่ แล้วคลุมขี้เถ้าทุกคืนเหมือนเดิม
      text: |
        {name}ทำทุกอย่างเหมือนเดิมทุกคืน เกลี่ยขี้เถ้า ปิดประตูเตา ไม่ราดน้ำ ไม่ปล่อยให้มอด เช้าขึ้นไฟติดรอทุกวัน บางวันกาน้ำเดือดแล้ว

        หน้าหนาวนั้นทั้งบ้านไม่มีใครต้องลุกมาเป่าถ่านตอนไก่ขันรอบแรก ผ้าห่มผืนหนาที่สุดไม่ได้ออกจากหีบเลยทั้งหนาว
      effects: { traits: [old_fire], flags: [land_boon_taken, let_the_hearth_wake_first], mark: เตาติดเองก่อนรุ่ง }
    - id: bake_through_the_night
      label: รับงานอบขนมปังทั้งคืน ยืมไฟจากเตาร้านหัวถนนมาเสริม
      check: { stat: CON, dc: 13 }
      success:
        text: |
          บ้านปลายถนนจะแต่งลูกสาว ต้องการขนมปังหกสิบก้อนก่อนเที่ยง {name}ไปยืมไฟจากเตาร้านขนมปังหัวถนนใส่หม้อดินมาสุมเตาบ้านตัวเองให้ร้อนพอ แล้วอบทั้งคืน ถาดแล้วถาดเล่า แขนไม่ล้าสักครั้ง

          ตอนฟ้าเริ่มเทา{name}คีบถ่านก้อนที่ร้อนที่สุดใส่หม้อ เดินกลับไปเทคืนลงเตาร้านหัวถนนก่อนคนอบจะตื่น ได้ค่าแรงสี่เหรียญ กับขนมปังไหม้ก้นอีกเจ็ดก้อน
        effects: { gold: 4, traits: [old_fire], flags: [land_boon_taken, baked_through_the_night_for_hire], mark: เตาติดเองก่อนรุ่ง }
      failure:
        text: |
          ขนมปังหกสิบก้อนออกจากเตาครบตอนเลยเที่ยงคืนไปนาน {name}นั่งพิงผนังรอถาดสุดท้ายเย็น หนังตาหนักลงทีละน้อย

          ไก่ตัวที่สามปลุก{name}ขึ้นมา หม้อถ่านที่ยืมมาวางอยู่ข้างเตา ถ่านข้างในยังแดง แดดส่องเต็มถนนแล้ว เช้าวันต่อมาเตาบ้าน{name}เย็นสนิท ต้องตีเหล็กไฟจนนิ้วถลอกกว่าเชื้อจะติด
        effects: { gold: 4, taboo: { fire: break }, flags: [kept_borrowed_fire_past_dawn] }
    - id: light_it_first_by_hand
      label: ลุกก่อนไก่ขันทุกเช้า แล้วจุดเตาเองด้วยมือ
      text: |
        {name}ตั้งใจตื่นก่อนไก่ทุกเช้า เขี่ยขี้เถ้าออก เป่าถ่านจนแดง เติมเชื้อด้วยมือตัวเองก่อนเตาจะทันติด ไฟในบ้านต้องมีคนจุด คนเฝ้าเตาที่บ้านเก่าสอนไว้อย่างนั้นตั้งแต่{name}ยังเตี้ยกว่าโต๊ะ

        สองสามเช้าแรก ตื่นมาเตาก็ติดรออยู่ก่อนทุกที พอเช้าที่สี่ถ่านใต้ขี้เถ้าเย็นอย่างถ่านธรรมดา รอให้มือ{name}มาเป่า
      effects: { flags: [lit_the_hearth_by_hand_first] }

- id: adult.land_boon_stone
  stage: adult
  weight: 40
  scene: mine
  when:
    age: [22, 62]
    location_tag: hordun
    taboo: { id: stone, keeps: true }
    not_traits: [old_stone]
  text: |
    หน้าหินท้ายชั้นเป็นหินดำเนื้อแน่น สกัดทั้งกะได้ไม่ถึงครึ่งเข่ง {name}กลับค้อนเอาสันเคาะสามครั้งตามเคย ก๊อก ก๊อก ก๊อก แล้วยกสิ่วขึ้นจ่อ

    ก่อนค้อนจะลง เสียงเคาะตอบมาจากข้างในหิน สามครั้งเหมือนกัน ช้ากว่า หนักกว่า เว้นห่างกันเท่าลมหายใจของอะไรสักอย่างที่ตัวโตกว่าเหมืองทั้งเหมือง ฝุ่นหินร่วงจากเพดานเป็นสายบางๆ เปลวตะเกียงไม่ไหวสักนิด

    สิ่วที่จ่ออยู่จมเข้าไปในหินเองครึ่งนิ้ว หน้าหินปริออกตามแนวเส้นเดียว ตรงจากบนลงล่าง เข่าที่ปวดทุกหน้าหนาวไม่ปวดตอนก้มลงเก็บก้อนแรก คนกะเดียวกันอยู่ปลายอุโมงค์อีกฝั่ง ตอกของตัวเองต่อไปไม่หยุดมือ
  choices:
    - id: knock_back
      label: เคาะตอบอีกสามครั้ง แล้วทำงานตามจังหวะเดิม
      text: |
        {name}เคาะตอบสามครั้ง ช้าเท่าที่ได้ยิน แล้วก้มหน้าสกัดต่อ หินปริออกทีละแผ่นตามมือ กะนั้นได้สามเข่งเต็ม หัวหน้ากะชั่งซ้ำสองรอบเพราะไม่เชื่อตาชั่ง

        ตั้งแต่วันนั้น หน้าหินไหนที่{name}เคาะ หินตอบทุกครั้ง บางครั้งดังจนนิ้วชา บางครั้งเบาเหมือนคนเคาะฝาห้องข้างๆ ตอนดึก
      effects: { traits: [old_stone], flags: [land_boon_taken, knocked_back_to_the_stone], mark: หินเคาะตอบ }
    - id: three_shifts_running
      label: รับงานสามกะติดกัน เคาะทุกหน้าหินที่ไปถึง
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ค่าแรงกะดึกเป็นสองเท่า {name}ลงไปตอนเช้า ขึ้นมาอีกทีเช้าวันต่อมา สามกะ สิบสี่หน้าหิน เคาะทุกหน้าก่อนสิ่วจะแตะ บางหน้านับดังๆ ในใจให้ตัวเองได้ยิน หนึ่ง สอง สาม หินตอบทุกหน้า

          หัวหน้ากะนับเข่งแล้วจ่ายห้าเหรียญโดยไม่ซักอะไร ถามแค่ว่าพรุ่งนี้จะลงอีกไหม {name}หลับไปทั้งชุดทำงานบนม้านั่งหน้าห้องชั่ง
        effects: { gold: 5, traits: [old_stone], flags: [land_boon_taken, worked_three_shifts_knocking], mark: หินเคาะตอบ }
      failure:
        text: |
          กะที่สามมือ{name}ทำงานไปเอง ตาลืมอยู่แต่ไม่ได้เห็นอะไร หน้าหินที่สิบสามเคาะแล้ว หินตอบ หน้าที่สิบสี่{name}จ่อสิ่วแล้วตอกลงไปทันที

          ค้อนสะท้อนกลับขึ้นมาจนข้อมือเคล็ด หินไม่ปริ หินไม่ตอบ ตลอดกะนั้นหน้าหินทุกหน้าที่{name}เคาะเงียบอย่างหินทั่วไปในเหมือง
        effects: { gold: 3, hp: -1, taboo: { stone: break }, flags: [struck_the_last_face_unknocked] }
    - id: move_up_to_the_sorting_yard
      label: ขอย้ายขึ้นไปทำงานลานคัดแร่ข้างบน
      text: |
        {name}ขอย้ายตั้งแต่กะต่อมา ค่าแรงลานคัดแร่น้อยกว่าในเหมืองหนึ่งในสาม แดดส่องหลังทั้งวัน ฝุ่นแร่เข้าตาแทนฝุ่นหิน หัวหน้ากะถามว่าทำไม {name}ตอบว่าเข่าไม่ดี เข่าดีกว่าที่เคยดีมาทั้งชีวิต

        กลางสัปดาห์ คนที่ลงไปทำหน้าหินท้ายชั้นแทนกลับขึ้นมาบ่นว่าหินแข็งยังกับเหล็ก สกัดทั้งกะได้ไม่ถึงครึ่งเข่ง
      effects: { flags: [moved_off_the_answering_face] }

- id: adult.land_boon_forest
  stage: adult
  scene: land_forest
  weight: 40
  when:
    age: [22, 62]
    location_tag: ileth
    taboo: { id: forest, keeps: true }
    not_traits: [old_forest]
  text: |
    ที่ตาน้ำหลังแนวสนมีกวางตัวเมียตัวหนึ่งก้มกินน้ำ {name}เดินเข้าไปจนห่างกันแค่ช่วงไม้พาย มันไม่เงยหน้า หูกระดิกไล่แมลงสองที แล้วกินต่อ นกกระจิบตัวหนึ่งลงมาเกาะขอบถังของ{name} จิกน้ำในถังแทนน้ำในตาน้ำ

    {name}ก้าวเข้าไปอีกก้าว กวางเงยหน้าทันที ตาดำสนิทคู่นั้นไม่ได้มองหน้า{name} มันมองต่ำลงไปที่เอว ที่มีดเหล็กดำเล่มที่ซื้อจากพ่อค้าคนแคระเมื่อต้นปีเสียบอยู่ในฝักหนังข้างเข็มขัด

    มันถอยหลังไปสามก้าวพอดี แล้วยืนรอ
  choices:
    - id: hang_the_knife_outside
      label: ปลดมีดแขวนไว้ที่กิ่งไม้ชายป่า แล้วเข้าไปมือเปล่า
      text: |
        {name}ปลดฝักมีดแขวนไว้บนกิ่งสนต้นแรกที่ชายป่า เดินกลับไปที่ตาน้ำ กวางก้มลงกินน้ำต่อเหมือนไม่เคยเงยหน้า

        ตั้งแต่นั้นมีดเล่มนั้นแขวนอยู่บนกิ่งสนทุกครั้งที่{name}เข้าป่า และกลับมาอยู่ที่เอวทุกครั้งที่ออกมา พงหนามที่เคยเกี่ยวแขนเสื้อแหวกเป็นช่องพอดีตัว หมาจิ้งจอกเดินตัดหน้าไปเฉยๆ ไม่หันมาดูสักครั้ง
      effects: { traits: [old_forest], flags: [land_boon_taken, left_the_black_iron_outside], mark: กวางไม่หนี }
    - id: hunt_with_the_old_hunter
      label: ชวนพรานชายป่าออกล่า ในเมื่อสัตว์ไม่หนีแล้ว
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          พรานชายป่าตามหลัง{name}เข้าไปสามวัน กวางกับหมูป่ายืนให้เห็นทุกตัว {name}ชี้ให้ยิงแต่ตัวผู้แก่ที่เขาสองข้างเริ่มผุ ตัวไหนมีลูกตามหลัง ตัวไหนท้องหย่อน {name}เอามือกดคันธนูของพรานลงทุกครั้ง พรานบ่นจนเสียงแหบ

          ขายเนื้อกับหนังได้แปดเหรียญ แบ่งกันคนละครึ่ง พรานบอกว่าล่ามาตั้งแต่ยังไม่มีหนวด ไม่เคยเห็นป่ายืนนิ่งให้แบบนี้ แล้วก็ไม่อยากเห็นอีก
        effects: { gold: 4, traits: [old_forest], flags: [land_boon_taken, hunted_only_the_old_bucks], mark: กวางไม่หนี }
      failure:
        text: |
          วันที่สอง แสงเย็นลอดใบไม้ลงมาเป็นริ้ว กวางตัวเมียตัวหนึ่งยืนอยู่หลังกอผักกูด ตัวใหญ่ ขนเป็นมัน {name}ชี้ให้พรานยิงก่อนจะทันเห็นว่าหลังกอผักกูดมีอีกตัวหนึ่ง ตัวเท่าหมา ขาลายจุด

          ลูกกวางยืนอยู่ข้างแม่จนพรานเดินเข้าไปถึง แล้วจึงวิ่งหายเข้าพง ขากลับ หนามเกี่ยวแขนเสื้อ{name}ขาดเป็นริ้วตลอดทาง
        effects: { gold: 3, taboo: { forest: break }, flags: [shot_a_doe_with_a_fawn] }
    - id: keep_off_the_spring_path
      label: เลิกเข้าป่าทางตาน้ำ ไปตักน้ำบ่อในหมู่บ้านแทน
      text: |
        คนแก่ชายป่าพูดกันว่าสัตว์ที่ไม่หนีคนคือสัตว์ที่ป่าส่งมาดูหน้า {name}ไม่อยากให้ใครมาดูหน้า ต่อให้เป็นป่าก็ตาม ตั้งแต่วันนั้นตักน้ำจากบ่อกลางหมู่บ้าน น้ำบ่อมีกลิ่นสนิมกับกลิ่นเชือก

        ปลายเดือน{name}เห็นกวางตัวเมียตัวหนึ่งยืนอยู่ชายป่าตอนโพล้เพล้ ไกลเกินกว่าจะรู้ว่าตัวเดิมหรือไม่ พอ{name}หยุดเดิน มันก็หันหลังเข้าป่าไป
      effects: { flags: [kept_off_the_spring_path] }

# ---------- คำสาป ----------

- id: adult.land_curse_dead_fire
  stage: adult
  weight: 40
  scene: home
  time: day
  when:
    age: [20, 64]
    taboo: { id: fire, defies: true }
    not_traits: [curse_dead_fire, old_fire]
  text: |
    เหล็กไฟกระทบหินเป็นประกายลงบนเชื้อ ประกายตกแล้วดับ {name}ตีอีกครั้ง อีกสิบครั้ง ประกายมีทุกครั้ง เชื้อไม่ไหม้สักครั้ง เชื้อห่อเดียวกับที่ใช้มาทั้งเดือน แห้งดีเหมือนเมื่อวาน

    {name}ไปขอถ่านแดงจากบ้านข้างๆ ใส่หม้อดินมา คีบลงเตา ถ่านแดงอยู่ตราบที่คีมยังจับ พอปล่อยคีม ถ่านก็หมองลงเป็นสีเทาต่อหน้า เหมือนถ่านที่ทิ้งไว้นอกบ้านทั้งคืน {name}หยิบก้อนหนึ่งขึ้นมาด้วยนิ้วโดยไม่ทันคิด ถ่านไม่ลวกมือ ดับเป็นสีดำอยู่ในกำมือ

    ข้างนอกลมหนาวเริ่มพัดแล้ว กาน้ำเย็น ข้าวเมื่อคืนแข็งเป็นก้อนอยู่ในหม้อ
  choices:
    - id: pay_a_child_to_light_it
      label: จ้างเด็กบ้านตรงข้ามมาจุดเตาให้ทุกเช้า
      text: |
        เด็กบ้านตรงข้ามตีเหล็กไฟครั้งเดียว เชื้อลุกพรึบ เด็กหันมามอง{name}แบบที่เด็กมองผู้ใหญ่ที่ทำเรื่องง่ายๆ ไม่เป็น แล้วแบมือขอเหรียญ

        ตกลงกันเช้าละเหรียญทองแดงจนหมดหนาว ก่อนสิ้นสัปดาห์เด็กทั้งซอยรู้กันหมดว่าบ้าน{name}จุดไฟเองไม่ได้ บางเช้ามีเด็กยืนรอหน้าประตูสามคน
      effects: { gold: -1, traits: [curse_dead_fire], flags: [paid_a_child_to_light_the_stove] }
    - id: partner_lights_it
      label: ให้{partner}จุดให้
      requires: { flag: has_partner }
      text: |
        {partner}จุดเตาให้ตั้งแต่เช้านั้น ทำหน้าเหมือนจะถามแต่ไม่ถาม จุดครั้งเดียวติด เติมฟืน แล้วยื่นถ้วยน้ำร้อนให้{name}ก่อนตัวเอง

        ตั้งแต่นั้นเตาบ้านนี้เป็นงานของ{partner}คนเดียว คืนไหน{p:เขา|เธอ}ไปค้างที่อื่น {name}นอนห่มผ้าสองผืนกับถุงน้ำร้อนที่{p:เขา|เธอ}ต้มทิ้งไว้ให้ก่อนออกจากบ้าน
      effects:
        traits: [curse_dead_fire]
        flags: [partner_lights_the_stove]
        people: [{ id: partner, closeness: 1 }]
    - id: eat_by_the_bakers_oven
      label: ไปยืนผิงหน้าร้านขนมปังหัวถนน ซื้อขนมปังร้อนกินแทน
      text: |
        ร้านขนมปังหัวถนนเปิดเตาตั้งแต่ก่อนรุ่ง {name}ไปยืนรอหน้าร้านทุกเช้าพร้อมคนทำงานกะเช้า ซื้อขนมปังร้อนหนึ่งก้อน ยืนพิงผนังร้านที่อุ่นจากเตาข้างใน จนขนมปังในมือเย็นลงเท่ามือ

        คนอบขนมปังเริ่มจำหน้าได้ วันที่หิมะลงหนัก แกเปิดประตูหลังร้านให้{name}เข้าไปนั่งข้างเตา คิดค่านั่งเท่าขนมปังอีกก้อน
      effects: { gold: -2, traits: [curse_dead_fire], flags: [ate_by_the_bakers_oven] }
    - id: live_cold
      label: กินของเย็น แล้วนอนห่มผ้าทุกผืนที่มี
      text: |
        {name}กินข้าวแข็งกับปลาเค็มที่ไม่ได้ปิ้ง ดื่มน้ำเย็นจากโอ่ง ใส่เสื้อสองชั้นนอน ห่มผ้าทุกผืนในบ้านทับกันจนพลิกตัวไม่ได้

        กลางหนาว ไอที่ติดคอมาตั้งแต่ต้นเดือนกลายเป็นไอแห้งๆ ทั้งคืน เตาในบ้านไม่มีไฟมาหลายสัปดาห์ ขี้เถ้าก้นเตาจับตัวเป็นแผ่นแข็ง
      effects: { hp: -1, traits: [curse_dead_fire], flags: [lived_cold_through_the_curse] }

- id: adult.land_woodcutter_known
  stage: adult
  weight: 40
  when:
    age: [20, 64]
    trait: curse_woodcutter
  text: |
    หมูป่าตัวหนึ่งพุ่งออกจากพงข้างทาง ตอนคนห้าคนเดินกลับจากตลาด มันวิ่งผ่านคนแรก ผ่านคนที่สอง ผ่านเด็กที่หิ้วตะกร้าไข่ แล้วตรงมาหา{name}คนเดียว {name}กระโดดข้ามรั้วทันแค่ช่วงลมหายใจ เขี้ยวเฉือนขากางเกงขาดไปแถบหนึ่ง

    ตลอดสัปดาห์ต่อมา ตัวต่อทำรังใต้ชายคาบ้าน{name}หลังเดียวในละแวก กวางที่เคยเดินผ่านหน้าเฉยๆ มายืนขวางทางเข้าป่า กระทืบเท้าหน้าใส่ ไม่ยอมถอย กาบินมาเกาะหลังคาทุกเช้าตั้งแต่ไก่ยังไม่ขัน นับได้สิบเจ็ดตัว

    พรานแก่คนหนึ่งในละแวกยืนดูหลังคาบ้าน{name}แล้วถ่มน้ำลายลงดิน ป่ามันจำคนที่มันเคยให้ได้ แกว่า จำแม่นกว่าคนที่มันไม่เคยให้อะไร แกรู้ทางแก้อยู่สองทาง ทางที่สามแกบอกว่าไม่ใช่ทางแก้ เป็นทางหนี
  choices:
    - id: plant_the_hundred
      label: ซื้อกล้าไม้ร้อยต้น แล้วเริ่มปลูกด้วยมือตัวเอง
      text: |
        กล้าไม้ร้อยต้นราคาสองเหรียญ {name}ขนใส่เกวียนไปลงที่เนินร้างหลังหมู่บ้าน ขุดหลุมด้วยมือกับไม้แหลมวันละสิบหลุม พ้นวันที่สามเล็บดำทุกเล็บ

        พรานแก่ขึ้นมาดูวันที่สิบ นับหลุม นับกล้า แล้วหักกิ่งไม้มาปักไว้ข้างต้นแรกหนึ่งกิ่ง สูงเท่าหัว{name}พอดี
      effects: { gold: -2, flags: [planting_the_hundred] }
    - id: give_the_axe_back
      label: เอาขวานไปปักคืนไว้ที่ตอ แล้วไม่แตะของมีคมอีก
      text: |
        {name}แบกขวานเข้าป่าเป็นครั้งสุดท้าย ไปถึงตอที่ตัวเองโค่น ขอบตอแตกหน่อเขียวขึ้นมาสามหน่อ {name}สับขวานลงกลางตอจนด้ามตั้ง แล้วเดินออกมามือเปล่า

        คืนนั้น{name}ฉีกขนมปังด้วยมือ เนื้อแห้งชิ้นใหญ่กัดเอาทีละคำแทนหั่น มีดเล่มประจำบ้านย้ายขึ้นไปอยู่บนหิ้งสูงเกินมือเอื้อม
      effects: { flags: [gave_the_axe_back] }
    - id: go_where_trees_are_few
      label: ไปอยู่ที่ที่ต้นไม้น้อย ไม่มีอะไรจำหน้าได้
      text: |
        {name}ย้ายไปเช่าห้องแถวติดลานจอดเกวียนริมถนนหลวง พื้นลานเป็นดินอัดแน่นกับขี้ม้า ต้นไม้ที่ใกล้ที่สุดคือมะเดื่อแคระในกระถางหน้าร้านช่างตีเกือก ค่าเช่าเดือนละเหรียญ

        ตัวต่อไม่มา กาไม่มา หมาประจำลานจอดเกวียนเห่าทุกคนเท่ากันหมด ไม่เว้น{name} และไม่เลือก{name}
      effects: { gold: -1, flags: [went_where_trees_are_few] }

# ---------- ทางแก้คำสาป ----------

- id: adult.land_cure_hundred_trees
  stage: adult
  weight: 40
  years: 6
  min_years: 4
  when:
    trait: curse_woodcutter
    flags: [planting_the_hundred]
  text: |
    {years}ปีบนเนินร้างหลังหมู่บ้าน ร้อยต้นไม่เคยครบร้อยพร้อมกันสักวัน หน้าแล้งแรกตายไปสิบเอ็ด กวางลงมาแทะยอดอีกเจ็ด {name}ปลูกแทนทุกต้นที่ตาย หาบน้ำขึ้นเนินทุกเย็นที่ฝนไม่ตก จนไหล่ขวาต่ำกว่าไหล่ซ้าย

    กิ่งไม้ที่พรานแก่ปักไว้ข้างต้นแรกผุไปแล้วหนึ่งกิ่ง {name}ปักกิ่งใหม่แทน สูงเท่าหัวตัวเองพอดี เช้านี้ยอดต้นแรกขึ้นมาถึงคาง

    งานจ้างปลายหุบมาถึงพอดีในหน้านี้ ค่าแรงดีที่สุดที่{name}เคยได้ยินมาหลายปี ต้องไปค้างที่นั่นทั้งฤดู และกวางยังลงมาจากป่าทุกคืน ตรงมาที่เนินนี้ก่อนเนินไหน
  choices:
    - id: wait_for_the_first_tree
      label: ไม่ไป อยู่รอจนยอดแรกพ้นหัว
      text: |
        {name}ปฏิเสธงานปลายหุบ ทั้งหน้านั้นขึ้นเนินทุกเช้า วัดยอดต้นแรกกับกิ่งไม้ข้างต้น วัดด้วยฝ่ามือ ด้วยนิ้ว ด้วยเส้นด้ายที่ผูกปมไว้วันละปม ข้าวในยุ้งหมดกลางหน้า ต้องขายแพะตัวเมียไปตัวหนึ่ง

        เช้าวันหนึ่งปลายหน้าฝน {name}ยืนชิดลำต้นแล้วเงยหน้า ใบอ่อนคู่บนสุดอยู่เหนือหัวหนึ่งนิ้ว ตอนเดินลงเนิน กวางตัวหนึ่งเล็มหญ้าอยู่ริมทาง ไม่เงยหน้าขึ้นมาดู{name}เลย
      effects: { gold: -3, stats: { WIS: 1 }, lose_traits: [curse_woodcutter], taboo: { forest: mend }, flags: [waited_for_the_first_tree], mark: ต้นแรกสูงท่วมหัว }
    - id: work_by_day_guard_by_night
      label: รับงานปลายหุบตอนกลางวัน กลับมานอนเฝ้าเนินทุกคืน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ทางจากปลายหุบถึงเนินเดินครึ่งคืน {name}เดินทุกคืน นอนพิงต้นแรกห่มผ้าผืนเดียว ได้ยินเสียงกีบกวางย่ำใบไม้ทีไรก็ลุกขึ้นยืน ไม่ถือไม้ ไม่ขว้างอะไร แค่ยืนให้เห็น กวางยืนดูอยู่ชายป่าแล้วถอยกลับไปทุกคืน

          ปลายฤดู{name}ได้ค่าแรงสามเหรียญ กับตาที่ลึกลงไปจนคนที่ลานจ้างงานทักว่าป่วยหรือเปล่า เช้าวันที่กลับมาวัด ใบอ่อนคู่บนสุดของต้นแรกพ้นหัวไปแล้วหนึ่งฝ่ามือ
        effects: { gold: 3, stats: { CON: 1 }, lose_traits: [curse_woodcutter], taboo: { forest: mend }, flags: [guarded_the_hundred_by_night], mark: ต้นแรกสูงท่วมหัว }
      failure:
        text: |
          คืนที่สิบเก้า{name}ตั้งใจจะลืมตาไว้ทั้งคืน แต่หลับไปพิงต้นแรกตั้งแต่หัวค่ำ ตื่นมาตอนน้ำค้างลง กวางสามตัวยืนอยู่กลางเนิน ตัวหนึ่งยืดคอเล็มยอดต้นแรกอยู่

          ยอดหักเหลือแค่ระดับอก รอยฟันกวางเป็นรอยเฉียงสีน้ำตาลบนกิ่งอ่อน {name}ปักกิ่งไม้วัดหัวใหม่ข้างต้นที่สองแทน ต้นที่สองสูงแค่ไหล่
        effects: { gold: 3, hp: -2, flags: [deer_took_the_first_tree] }
    - id: leave_the_hundred
      label: ปล่อยเนินให้ป่าดูแลเอง แล้วไปรับงานทั้งฤดู
      text: |
        {name}ลงจากเนินไปพร้อมห่อผ้ากับรองเท้าคู่ใหม่ ค่าแรงทั้งฤดูได้ห้าเหรียญ มากกว่าที่ทำได้ในสองหน้าเกี่ยวรวมกัน

        กลับมาหน้าหนาว เนินร้างเขียวครึ่งเนิน อีกครึ่งเป็นตอกิ่งที่กวางเล็มจนเหลือแค่ระดับเข่า กิ่งไม้วัดหัวล้มอยู่ในหญ้า กาสิบกว่าตัวบินมาเกาะหลังคาบ้าน{name}ก่อนไก่ขัน
      effects: { gold: 5, flags: [left_the_hundred_unfinished] }

- id: adult.land_cure_axe_returned
  stage: adult
  weight: 40
  years: 7
  min_years: 5
  when:
    trait: curse_woodcutter
    flags: [gave_the_axe_back]
  text: |
    {years}ปีที่มือ{name}ไม่ได้แตะของมีคม ขนมปังฉีกด้วยมือ เชือกแก้ด้วยนิ้วกับฟัน ผมให้คนอื่นตัด เล็บกัดเอา งานที่เคยทำได้ทุกอย่างต้องใช้มีดหรือขวาน {name}เลยไปแบกกระสอบที่ลานโกดัง ค่าแรงครึ่งเดียวของที่เคยได้ หลังปวดสองเท่า

    ปีท้ายๆ ที่ต้องนับ ลูกวัวของบ้านข้างๆ มุดหัวเข้ารั้วเชือกแล้วดิ้นจนเชือกรัดคอ ลิ้นห้อยออกมาเป็นสีม่วง เจ้าของอยู่กลางนา ไกลสุดเสียงตะโกน

    เคียวเล่มหนึ่งแขวนอยู่ที่เสารั้ว ห่างมือ{name}แค่เอื้อม
  choices:
    - id: untie_it_by_hand
      label: แกะปมเชือกด้วยนิ้ว ไม่แตะเคียว
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ปมเชือกเปียกน้ำค้างแน่นจนนิ้วแทรกไม่เข้า {name}ใช้ฟันกัดดึงปลายเชือกทีละเกลียว เล็บฉีกไปสองเล็บ ปมคลายตอนลูกวัวเลิกดิ้นแล้ว มันล้มลงหอบอยู่บนหญ้า แล้วลุกขึ้นได้เอง ร้องหาแม่

          พอครบปีสุดท้าย {name}เข้าป่าไปที่ตอ ขวานปักอยู่กลางตอ ด้ามดำผุ หน่อสามหน่อรอบขอบตอสูงท่วมหัวไปแล้ว กาตัวหนึ่งบินผ่านหัว{name}ไปเกาะกิ่งอื่น
        effects: { hp: -1, stats: { DEX: 1 }, lose_traits: [curse_woodcutter], taboo: { forest: mend }, flags: [freed_the_calf_with_bare_hands], mark: คืนขวานให้ป่าจนครบ }
      failure:
        text: |
          นิ้วแกะปมไม่ออก ลูกวัวดิ้นแรงขึ้นแล้วค่อยๆ อ่อนลง {name}คว้าเคียวจากเสารั้วตวัดทีเดียว เชือกขาด ลูกวัวล้มลงหอบอยู่บนหญ้า

          ด้ามเคียวอุ่นจากแดดเช้า น้ำหนักในมือคุ้นเหมือนไม่เคยวางไปไหน ตกเย็นวันนั้นตัวต่อกลับมาทำรังใต้ชายคาบ้าน{name}อีกรัง
        effects: { alignment: { moral: 1 }, flags: [took_up_the_sickle_for_the_calf] }
    - id: hold_it_up_and_shout
      label: โอบลูกวัวยกไว้ให้เชือกหย่อน แล้วตะโกนเรียกเจ้าของ
      text: |
        {name}โอบลำตัวลูกวัวยกขึ้นให้เชือกหย่อน แล้วตะโกนจนเสียงแตก ลูกวัวถีบไม่เป็นท่า กีบโดนหน้าแข้ง{name}สามครั้ง เจ้าของวิ่งมาจากกลางนา หอบจนพูดไม่เป็นคำ ปลดเคียวจากเสาตัดเชือกเอง แล้วถามว่าทำไมไม่ตัดเสียเอง

        พอครบปีสุดท้าย {name}ยืมมีดบ้านข้างๆ มาหั่นขนมปัง หั่นเบี้ยวไปข้างหนึ่งทุกแผ่น
      effects: { hp: -1, lose_traits: [curse_woodcutter], taboo: { forest: mend }, flags: [held_the_calf_till_help_came], mark: คืนขวานให้ป่าจนครบ }
    - id: cut_the_rope_now
      label: ปลดเคียวตัดเชือกทันที
      text: |
        {name}ปลดเคียวจากเสาแล้วตัดเชือกโดยไม่ต้องคิด เชือกขาดตั้งแต่ครั้งแรก ลูกวัวไอเสียงแหบแล้ววิ่งไปหาแม่

        เจ้าของวัวเอาขนมปังกับเนยมาให้ตอนเย็น {name}ยืมมีดที่วางอยู่บนโต๊ะทาเนยเอง ทาจนทั่วแผ่นไปถึงขอบ
      effects: { alignment: { moral: 1 }, flags: [cut_the_rope_and_the_vow] }

- id: adult.land_cure_seven_fires
  stage: adult
  weight: 25
  time: night
  when:
    age: [20, 66]
    trait: curse_dead_fire
  text: |
    เจ็ดบ้าน หญิงแก่ที่เฝ้าเตาบ้านหัวมุมนับนิ้วให้ดู ยืมไฟบ้านละก้อน เอามากองรวมในเตาตัวเองจนติด แล้วคีบไฟจากเตาตัวเองกลับไปคืนให้ครบทุกบ้านก่อนไก่ขัน ขาดบ้านเดียวก็เท่ากับไม่ได้ทำ เตาที่ไฟไม่ติด แกว่า ถ้ามีไฟของคนอื่นมากองรวมกันพอ ก็ติดได้คืนหนึ่ง

    {name}ไปขอไว้ครบเจ็ดบ้านตั้งแต่บ่าย บ้านที่เจ็ดอยู่ปลายทางเกวียน ข้ามสะพานไม้ไปอีกฝั่งคู เป็นบ้านคนสีข้าวที่หลับเร็วที่สุดในละแวก

    คืนนี้เดือนมืด ลมพัดมาจากทางเหนือ หม้อดินมีหูจับอยู่ใบเดียว
  choices:
    - id: run_the_seven
      label: วิ่ง ให้ทันก่อนรุ่ง
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          {name}วิ่งยืมไฟหกบ้านจนหมดตั้งแต่หัวค่ำ ข้ามสะพานไปบ้านที่เจ็ดแล้วกลับมาก่อนดึก ถ่านเจ็ดก้อนกองรวมกันในเตา ควันขึ้นอยู่พักหนึ่ง แล้วเปลวไฟสีส้มลุกขึ้นจากกลางกอง เป็นไฟแรกในเตานี้ตั้งแต่ต้นหนาว

          ขากลับ{name}วิ่งย้อนทางเดิม คีบไฟจากเตาตัวเองไปคืนทีละบ้าน ก้อนสุดท้ายลงเตาบ้านคนสีข้าวตอนฟ้าตะวันออกยังเป็นสีหมึก เดินกลับมาถึงหัวมุม ไก่ตัวแรกเพิ่งขัน หน้าต่างบ้านทั้งเจ็ดมีแสงไฟลอดออกมาเป็นแถว
        effects: { stats: { DEX: 1 }, lose_traits: [curse_dead_fire], taboo: { fire: mend }, flags: [returned_the_seven_fires], mark: คืนไฟเจ็ดบ้านก่อนรุ่ง }
      failure:
        text: |
          บนสะพานไม้ขากลับ {name}เหยียบแผ่นที่ผุ ขาข้างหนึ่งจมลงไปถึงเข่า หม้อดินหลุดมือตกคูไปทั้งใบ ถ่านดับเสียงฉ่าเบาๆ อยู่ข้างล่าง

          {name}กลับไปขอไฟบ้านคนสีข้าวใหม่ คนในบ้านหลับไปแล้ว เคาะจนบ้านข้างๆ จุดตะเกียง พอได้ไฟมากองในเตาบ้านตัวเองจนติด ไก่ตัวแรกก็ขันพอดี ถ่านในเตาดับลงทีละก้อนตามเสียงขัน
        effects: { hp: -2, flags: [lost_the_seven_fires_at_the_bridge] }
    - id: walk_the_seven
      label: เดินช้าๆ ประคองหม้อ ไม่ให้ถ่านดับสักก้อน
      check: { stat: CON, dc: 14 }
      success:
        text: |
          {name}เดินทั้งคืนไม่วิ่งสักก้าว ถอดเสื้อนอกคลุมหม้อกันลม ตัวเองเหลือเสื้อชั้นเดียว ลมเหนือกัดเข้าซี่โครงทุกครั้งที่เลี้ยวหัวมุม ถ่านในหม้อแดงอยู่ตลอดทาง ไปเจ็ดบ้าน กลับเจ็ดบ้าน

          ก้อนสุดท้ายลงเตาบ้านคนสีข้าวตอนฟ้ายังไม่เปลี่ยนสี {name}กลับมานั่งยองๆ หน้าเตาตัวเอง ยื่นมือเข้าไปผิง แล้วชักมือกลับ ไฟลวกปลายนิ้วเป็นครั้งแรกในรอบหลายเดือน
        effects: { stats: { CON: 1 }, lose_traits: [curse_dead_fire], taboo: { fire: mend }, flags: [walked_the_seven_fires_home], mark: คืนไฟเจ็ดบ้านก่อนรุ่ง }
      failure:
        text: |
          ช้าเกินไป บ้านที่ห้าในขากลับ{name}ยังไปไม่ถึงดี ไก่ตัวแรกก็ขัน เสียงขันต่อกันไปทั้งละแวก ทีละบ้าน ทีละเล้า

          {name}ยืนถือหม้อไฟอยู่กลางถนน ถ่านในหม้อยังแดง มือสองข้างชาจนแทบจับหูหม้อไม่อยู่ ไม่รู้จะเอาไฟไปคืนบ้านไหนก่อน
        effects: { hp: -2, flags: [dawn_caught_the_seven_fires] }
    - id: put_it_off
      label: คืนนี้ยังไม่ทำ รอให้ลมสงบกว่านี้
      text: |
        {name}เก็บหม้อดินขึ้นหิ้ง ลมเหนือพัดทั้งคืนจริงอย่างที่กลัว เช้าขึ้นหญิงแก่บ้านหัวมุมเดินผ่านหน้าบ้าน เห็นหม้อบนหิ้ง แล้วบอกว่าคืนที่ลมสงบน่ะ หน้าหนาวไม่มีหรอก

        ตลอดหนาวนั้นลมเหนือไม่หยุดพัดสักคืน
      effects: { flags: [put_off_the_seven_fires] }

- id: adult.land_cure_winter_hearth
  stage: adult
  weight: 25
  when:
    age: [20, 66]
    trait: curse_dead_fire
  text: |
    หญิงม่ายบ้านท้ายซอยตกบันไดหลังบ้าน สะโพกหัก หมอกระดูกบอกว่าต้องนอนจนหิมะละลาย ลูกชายคนเดียวไปทำงานต่างถิ่น ส่งข่าวมาว่ากลับไม่ได้ก่อนหิมะละลายเหมือนกัน

    เตาบ้านแกต้องมีคนเฝ้าทั้งหนาว เติมฟืนตอนดึก คลุมขี้เถ้าตอนเช้า ต้มน้ำร้อนเปลี่ยนผ้าประคบ คนในซอยต่างก็มีเตาของตัวเองต้องดู {name}จำได้ว่าคนเฝ้าเตารุ่นก่อนพูดกันว่าเตาของคนอื่นที่เฝ้าไว้ไม่ให้ดับตลอดหนาวหนึ่งหนาว ใช้แทนไฟเจ็ดบ้านได้

    ติดอยู่อย่างเดียว ถ้าเตาบ้านนั้นดับลงสักคืน {name}จุดใหม่เองไม่ได้
  choices:
    - id: sleep_by_her_hearth
      label: ย้ายไปนอนข้างเตาบ้านนั้นจนหิมะละลาย
      text: |
        {name}ขนผ้าห่มไปปูข้างเตาบ้านท้ายซอย ทั้งหนาวไม่รับงานที่ไหน ตื่นทุกครั้งที่เสียงไฟเบาลง เติมฟืนทีละดุ้น หญิงม่ายเล่าเรื่องผัวที่ตายไปให้ฟังทุกคืน เรื่องเดิม ตอนจบเดิม {name}รู้ตอนจบตั้งแต่สัปดาห์ที่สอง

        วันที่หิมะละลาย หญิงม่ายลุกเดินได้สองก้าว {name}กลับบ้านตัวเอง ตีเหล็กไฟครั้งเดียว เชื้อติด
      effects: { gold: -4, lose_traits: [curse_dead_fire], taboo: { fire: mend }, flags: [kept_the_widows_hearth_all_winter], mark: เฝ้าเตาคนอื่นจนพ้นหนาว }
    - id: work_days_watch_nights
      label: ทำงานกลางวันตามเดิม กลับมาเฝ้าเตาบ้านนั้นทุกคืน
      text: |
        กลางวันทำงาน กลางคืนนอนข้างเตาคนอื่น หลับทีละช่วงสั้นๆ เท่าฟืนหนึ่งดุ้นไหม้หมด คืนหนึ่งกลางหนาว {name}สะดุ้งตื่นตอนเตาเหลือถ่านแดงก้อนเดียว ก้มลงเป่าจนหน้ามืด จนเปลวเล็กๆ ลุกขึ้นมาเลียฟืน

        พอหิมะละลาย ตาของ{name}ลึกลงไปจนคนที่ทำงานด้วยกันทักทุกวัน เช้าวันแรกที่กลับไปนอนบ้านตัวเอง เตาติดตั้งแต่ประกายแรก
      effects: { hp: -2, stats: { CON: 1 }, lose_traits: [curse_dead_fire], taboo: { fire: mend }, flags: [kept_the_widows_hearth_by_night], mark: เฝ้าเตาคนอื่นจนพ้นหนาว }
    - id: hand_it_on_midwinter
      label: เฝ้าถึงกลางหนาว แล้วฝากบ้านข้างๆ ดูต่อ
      text: |
        กลางหนาวมีงานเข้ามาทางอื่น ค่าแรงดีพอจะซื้อฟืนให้บ้านท้ายซอยได้อีกสองเดือน {name}ซื้อฟืนกองไว้ข้างเตาจนท่วมหน้าต่าง แล้วฝากลูกสาวบ้านติดกันให้แวะมาเติมเช้าเย็น

        ปลายหนาวหญิงม่ายลุกเดินได้ เตาบ้านแกไม่เคยดับสักคืน ส่วนเตาบ้าน{name}ยังต้องให้คนอื่นมาจุดทุกเช้า
      effects: { gold: -2, flags: [left_the_widows_hearth_midwinter] }

# ---------- ขอขมา ----------

- id: adult.land_amends_river
  stage: adult
  scene: land_river
  weight: 30
  time: night
  when:
    age: [18, 64]
    location_tag: ventras
    taboo: { id: river, unbroken: false }
  text: |
    คนเรือแก่ว่าไว้อย่างนี้ น้ำบ่อเจ็ดถัง หาบไปเทคืนลงคลองตรงที่เคยทำผิดต่อน้ำ ให้เสร็จก่อนรุ่ง แล้วเหรียญแรกที่หามาได้หลังจากนั้นต้องลงน้ำ ไม่มีใครรู้ว่าทำไมต้องเป็นน้ำบ่อ ในเมื่อคลองมีน้ำอยู่แล้วทั้งคลอง

    บ่อกลางลานอยู่ห่างท่าน้ำสี่ร้อยก้าว เชือกบ่อสั้น ต้องสาวทีละศอก ไม้คานบ้าน{name}หักไปตั้งแต่ต้นปี คืนนี้ไม่มีเดือน คนยามของโรงกลั่นเดินตรวจริมคลองทุกชั่วยาม ถือตะเกียงกับไม้ตะพด

    {name}วางถังสองใบไว้ข้างขอบบ่อ ถังหนึ่งรั่วนิดๆ ที่ตะเข็บก้น
  choices:
    - id: seven_pails_one_by_one
      label: หิ้วทีละถัง เดินให้ครบเจ็ดเที่ยว
      text: |
        ถังเดียวหนักพอให้ไหล่เอียง เที่ยวที่สามฝ่ามือพอง เที่ยวที่ห้าน้ำจากถังรั่วหยดใส่เท้าจนรองเท้าแฉะ คนยามส่องตะเกียงมาครั้งหนึ่ง เห็นเป็นน้ำใสก็เดินต่อ ถังที่เจ็ดเทลงตอนฟ้าตะวันออกเริ่มจาง น้ำบ่อลงคลองเสียงเบาจนแทบไม่ได้ยิน

        ค่าแรงวันต่อมาได้สามเหรียญ {name}แยกเหรียญแรกออกจากกอง เดินไปโยนที่ท่า เหรียญลงน้ำไปเฉยๆ ไม่มีเสียงจ๋อม
      effects: { hp: -2, gold: -1, taboo: { river: mend }, flags: [carried_seven_pails_to_the_canal] }
    - id: two_pails_on_a_borrowed_pole
      label: ยืมไม้คานบ้านข้างๆ มาหาบทีละสองถัง
      check: { stat: STR, dc: 13 }
      success:
        text: |
          ไม้คานบ้านข้างๆ ยาวกว่าที่ไหล่{name}คุ้น ถังสองข้างแกว่งสวนกันจนต้องเดินเป็นจังหวะ สี่เที่ยวก็ครบเจ็ดถัง ถังที่แปดที่ตักเกินมา{name}เทคืนลงบ่อ

          ยังไม่ทันได้ยินไก่ ไม้คานก็คืนไปพิงหน้าบ้านข้างๆ แล้ว ค่าแรงวันต่อมา เหรียญแรกลงน้ำที่ท่าเดิม ไหล่ของ{name}ปวดไปสามวัน
        effects: { stats: { STR: 1 }, gold: -1, taboo: { river: mend }, flags: [carried_the_pails_two_by_two] }
      failure:
        text: |
          เที่ยวที่สามคนยามโรงกลั่นเห็นคนหาบถังลงคลองกลางดึก เป่านกหวีดเรียกพวก จับ{name}ไว้ที่ท่าจนหัวหน้ายามมาเปิดฝาถังดมเอง น้ำบ่อธรรมดา ไม่มีกลิ่นอะไร หัวหน้ายามบ่นว่าเสียเวลาแล้วปล่อยตัว

          {name}หาบเที่ยวที่สี่เสร็จตอนไก่ขันรอบแรก ถังที่เจ็ดยังว่างอยู่ข้างบ่อ
        effects: { hp: -1, flags: [the_watch_stopped_the_pails] }
    - id: pails_but_not_the_coin
      label: หาบครบเจ็ดถัง แต่เหรียญแรกต้องเอาไว้จ่ายค่าเช่าก่อน
      text: |
        เจ็ดถังลงคลองครบก่อนรุ่ง {name}กลับมานอนได้ครู่เดียวก็ต้องออกไปทำงาน ตกเย็นได้ค่าแรงสามเหรียญ คนเก็บค่าเช่ายืนรออยู่หน้าประตูแล้ว ค้างมาสองเดือน

        เหรียญแรกเข้ากระเป๋าคนเก็บค่าเช่าพร้อมอีกสองเหรียญ {name}ตั้งใจจะโยนเหรียญถัดไปแทน เหรียญถัดไปก็มีที่ไปของมันอีก
      effects: { hp: -2, flags: [poured_the_pails_kept_the_coin] }

- id: adult.land_amends_field
  stage: adult
  scene: land_field
  weight: 30
  time: day
  when:
    age: [18, 64]
    location_tag: arvel_village
    taboo: { id: field, unbroken: false }
  text: |
    ข้าวทั้งทุ่งสุกพร้อมกัน คนบ้านอื่นลงเกี่ยวตั้งแต่เช้า เสียงเคียวดังซ่าต่อกันไปตามคันนา แปลงหัวเนินของ{name}ไม่มีใครลง รวงหนักจนก้มต่ำกว่าแปลงไหนในทุ่ง

    {name}ตั้งใจไว้ตั้งแต่ต้นปีว่าจะเว้นแปลงนี้ทั้งแปลง ไม่เกี่ยวสักรวง ให้ข้าวยืนตายคาต้นจนหิมะลง แล้วเดินเท้าเปล่าจูงไถอ้อมเนินสามรอบ คนถือคันไถรุ่นก่อนสอนกันมาแบบนี้ สำหรับคนที่ไถข้ามเนินหรือเกี่ยวรวงที่ไม่ควรเกี่ยว

    ข้าวแปลงนี้ขายได้ห้าเหรียญ เพื่อนบ้านยืนพักเคียวข้ามคันนามาถามว่าป่วยหรือ บ่ายวันนั้นคนเก็บส่วยหลวงขี่ม้ามาถึงหัวทุ่ง กางสมุดวัดแปลง
  choices:
    - id: leave_it_and_walk
      label: ไม่เกี่ยว ปล่อยให้ยืนจนหิมะลง แล้วเดินสามรอบ
      text: |
        ข้าวแปลงนั้นยืนอยู่ทั้งหนาว นกลงกินจนรวงโหรง หนูทำรังในกอ ส่วยหลวงคิดตามแปลงไม่ใช่ตามรวง {name}จ่ายเต็ม หิมะแรกลงเมื่อไร {name}ถอดรองเท้าวางไว้หัวคันนา จูงไถเปล่าเดินอ้อมเนินรอบหนึ่ง สองรอบ สามรอบ

        รอยเท้าเปล่ากับรอยผาลเป็นวงซ้อนกันสามวงบนหิมะ ไม่ทับกันตรงไหนเลย กว่าจะเดินถึงบ้าน นิ้วเท้าสองข้างแดงเป็นสีเนื้อดิบ
      effects: { gold: -4, hp: -1, taboo: { field: mend }, flags: [left_the_mound_plot_standing] }
    - id: argue_the_tithe
      label: เดินไปเถียงกับคนเก็บส่วย ว่าแปลงที่ไม่เกี่ยวไม่ควรเสีย
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          คนเก็บส่วยเป็นคนจากเมือง ไม่เคยเห็นใครเว้นนาทั้งแปลง {name}พาเดินไปดูถึงหัวเนิน ชี้ให้ดูรวงที่ก้มลงหาดิน เล่าเรื่องคนถือคันไถรุ่นก่อนให้ฟังจนเขาหาวสองรอบ เขาขีดชื่อแปลงนั้นออกจากสมุดให้ปีหนึ่ง บอกว่าปีหน้าไม่รับปาก

          หิมะแรกลง{name}เดินอ้อมเนินเท้าเปล่าสามรอบ รอยผาลเป็นวงซ้อนกันสามวง ข้าวที่ไม่ได้เกี่ยวโผล่พ้นหิมะเป็นหย่อมสีทองหม่น
        effects: { gold: -2, stats: { CHA: 1 }, taboo: { field: mend }, flags: [argued_the_amends_plot_off_the_tithe] }
      failure:
        text: |
          คนเก็บส่วยฟังไม่จบ บอกว่าหลวงไม่ได้เก็บส่วยจากรวง หลวงเก็บจากดิน แล้วปรับเพิ่มอีกสองเหรียญฐานขวางงานหลวง เพื่อนบ้านที่ยืนดูอยู่หันกลับไปเกี่ยวข้าวต่อ

          {name}จ่ายส่วยเต็มกับค่าปรับ ข้าวแปลงนั้นยืนจนหิมะลง {name}เดินอ้อมเนินเท้าเปล่าครบสามรอบ ค่าข้าวที่ไม่ได้ขายกับค่าปรับรวมกัน เท่ากับหมูหนึ่งตัวที่บ้านไม่ได้ซื้อ
        effects: { gold: -6, taboo: { field: mend }, flags: [paid_a_fine_for_the_amends_plot] }
    - id: cut_it_in_midwinter
      label: เว้นไว้ถึงกลางหนาว แล้วลงเกี่ยวตอนข้าวในยุ้งหมด
      text: |
        ข้าวในยุ้งหมดเร็วกว่าที่คิด กลางหนาว{name}ลงเกี่ยวแปลงหัวเนินที่ยืนตายคาต้นมาสองเดือน รวงเปราะ เมล็ดลีบไปครึ่งหนึ่ง นกกินไปอีกส่วน ที่เหลือพอหุงกินได้สามสัปดาห์

        ตอซังแปลงนั้นหักเป็นแนวเฉียง ไม่ตรงเป็นแถวอย่างแปลงที่เกี่ยวตอนข้าวยังมีน้ำ
      effects: { gold: 1, flags: [cut_the_amends_plot_in_winter] }

- id: adult.land_amends_stone
  stage: adult
  weight: 30
  scene: mine
  when:
    age: [18, 64]
    location_tag: hordun
    taboo: { id: stone, unbroken: false }
  text: |
    ค้อน สิ่วสามขนาด เหล็กงัด ลิ่มหนึ่งถุง ตะเกียงก้นลึก {name}วางเรียงไว้บนโต๊ะทีละชิ้น ด้ามทุกชิ้นสลักเครื่องหมายของตัวเองไว้ เครื่องมือชุดนี้ซื้อมาด้วยค่าแรงหลายเดือน

    หัวหน้ากะคนเก่าบอกวิธีไว้ ลงไปมือเปล่าถึงหน้าหินที่เคยทำผิด เคาะสามครั้งด้วยข้อนิ้ว แล้ววางเครื่องมือของตัวเองทั้งชุดไว้ตรงนั้น จนเดือนที่หนาวที่สุดผ่านไป ไม่มีเครื่องมือก็ไม่มีงาน อีกสัปดาห์เดียวก็ถึงเดือนนั้นแล้ว

    หน้าหินนั้นอยู่ชั้นเก่าที่ปิดไปแล้ว ไปได้สองทาง ทางอ้อมผ่านอุโมงค์ที่ยังทำงานกินเวลาทั้งคืนกับค่าแรงหนึ่งกะ ทางลัดเป็นบันไดไม้ในปล่องเก่าที่ไม่มีใครลงมาหลายปี
  choices:
    - id: the_long_way_round
      label: ไปทางอ้อม แบกเครื่องมือลงไปวางไว้ทั้งชุด
      text: |
        {name}เดินอุโมงค์ทั้งคืน ถุงเครื่องมือผูกหลัง มือว่าง ตะเกียงแขวนเข็มขัด ถึงหน้าหินชั้นเก่าตอนกะเช้าเริ่มตอกอยู่ไกลๆ เหนือหัว {name}เคาะด้วยข้อนิ้วสามครั้ง ข้อนิ้วถลอก หินเย็นเฉียบ

        เครื่องมือทั้งชุดวางเรียงไว้ที่โคนหน้าหินเหมือนที่วางบนโต๊ะเมื่อคืน เดือนที่หนาวที่สุดนั้น{name}รับจ้างกวาดลานคัดแร่ ได้ค่าแรงวันละครึ่งของที่เคยได้
      effects: { gold: -4, taboo: { stone: mend }, flags: [left_the_tools_at_the_old_face] }
    - id: the_old_ladder
      label: ลงบันไดปล่องเก่า ไปให้ถึงก่อนกะเช้า
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ขั้นบันไดผุไปทุกสามขั้น {name}ไต่ลงโดยเหยียบแต่ข้างที่ติดตะปู ถุงเครื่องมือถ่วงหลังจนไหล่ร้าว ถึงก้นปล่องตอนเปลวตะเกียงยังไม่สั้นลงเลย เคาะหน้าหินสามครั้งด้วยข้อนิ้ว วางเครื่องมือเรียงไว้ทีละชิ้น

          ขากลับมือเปล่า ไต่ขึ้นเร็วกว่าตอนลงครึ่งหนึ่ง เดือนที่หนาวที่สุดนั้น{name}ยืมค้อนเก่าของคนอื่นตอกหมุดรั้ว เพราะค้อนของตัวเองไม่อยู่ให้ใช้
        effects: { gold: -3, stats: { DEX: 1 }, taboo: { stone: mend }, flags: [went_down_the_old_shaft_to_make_amends] }
      failure:
        text: |
          ขั้นที่สิบเจ็ดหักใต้เท้า {name}ไถลลงไปสามขั้นกว่ามือจะคว้าราวไว้ได้ ถุงเครื่องมือหลุดจากหลังตกลงก้นปล่อง เสียงเหล็กกระทบหินดังขึ้นมาเป็นทอดๆ

          {name}ไต่กลับขึ้นมามือเปล่า ฝ่ามือมีเสี้ยนไม้ฝังอยู่หลายสิบเสี้ยน เครื่องมือทั้งชุดอยู่ก้นปล่อง ไกลจากหน้าหินที่ต้องเคาะหลายสิบก้าว
        effects: { hp: -2, gold: -3, flags: [dropped_the_tools_down_the_old_shaft] }
    - id: knock_and_keep_the_tools
      label: เคาะสามครั้ง แต่แบกเครื่องมือกลับขึ้นมาด้วย
      text: |
        {name}ลงไปทางอ้อม เคาะหน้าหินสามครั้งด้วยข้อนิ้ว แล้วยืนอยู่ตรงนั้นพักใหญ่ ถุงเครื่องมือหนักอยู่บนหลัง อีกสามวันมีงานเหมาเจาะหินให้ตระกูลข้างบนที่ตกลงกันไว้แล้ว ต้องเสร็จก่อนเดือนที่หนาวที่สุดมาถึง

        ขากลับ{name}แบกถุงขึ้นมาด้วย งานเหมาเสร็จทันกำหนด ได้ค่าแรงครบ หน้าหินชั้นเก่ามีแต่รอยข้อนิ้วสามรอยบนฝุ่น
