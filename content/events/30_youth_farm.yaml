# วัยรุ่น 12–13 ลูกชาวนาบ้านเงาเสา (origin_farm)
# ตัวเลือกส่วนใหญ่ให้ความโน้มเอียงหนึ่งทาง (lean_*) ไว้เปิดตัวเลือกในพิธีเลือกทางตอนอายุ 14
# ทางประจำถิ่นของบ้านเงาเสาคือนักรบ (ยามคุมเกวียนถ่าน) เปิดเสมอ เหตุการณ์ในไฟล์นี้จึงไม่ให้ lean_warrior

- id: youth.farm_east_field
  stage: youth
  weight: 10
  when:
    age: [12, 13]
    flags: [origin_farm]
    not_flags: [father_away, father_lost]
  text: |
    ทุ่งฝั่งตะวันออกเลิกปลูกข้าวสาลีมาสองปีแล้ว ตอนนี้ปลูกเสาเหล็ก เสาแต่ละต้นสูงกว่าต้นไม้ทุกต้นในหมู่บ้าน ปักห่างกันเท่าระยะโซ่ที่คนแปลกหน้าลากมาวันนั้น บนยอดเสามีจานโลหะหงายรับฟ้า คืนไหนฟ้าเปิด จานทั้งทุ่งเรืองฟ้าจางๆ น้ำค้างดาวไหลลงท่อทองแดงไปรวมกันที่โรงไม้กลางทุ่ง เช้าวันเบเลคมีเกวียนจากเวนทราสมาขนไป

    คนบ้านเงาเสาครึ่งหมู่บ้านไปรับจ้างที่นั่น เช็ดจาน ขัดท่อ เฝ้ายามกลางคืน ได้ค่าแรงมากกว่าเกี่ยวข้าวสามเท่า {father}ไม่ไป เขาว่าไม่ทำงานบนนาที่เคยเป็นของเพื่อนบ้าน แต่คืนไหนฟ้าเปิด เขาก็ไปยืนที่หัวคันนา ดูจานพวกนั้นสว่างขึ้นทีละใบ

    ปลายหนาวปีนั้น ท่อใหญ่ในโรงกลางทุ่งแตกตอนดึก น้ำค้างดาวทะลักออกมานองพื้นเป็นแอ่งสีฟ้า ช่างเวทตัวใหญ่ที่บริษัทส่งมาจากเมือง แขนหนาเกินกว่าจะสอดเข้าช่องใต้หม้อรวม เขาสบถเป็นสำเนียงเมืองที่คนแถวนี้ฟังออกครึ่งเดียว แล้วตะโกนถามว่าแถวนี้มีเด็กมือเล็กที่ไม่กลัวหนาวไหม

    {name}ยืนอยู่ตรงรั้วพอดี แอบออกมาดูกระต่าย กระต่ายป่าทั้งเนินมาออกันอยู่ใต้เสา เลียหญ้าที่ชุ่มน้ำค้างสีฟ้า ตาทุกคู่วาวแสงเดียวกับจาน
  choices:
    - id: help_tech
      label: มุดเข้าไปในโรง สอดแขนเข้าช่องตามที่ช่างบอก
      check: { stat: INT, dc: 12 }
      success:
        text: |
          ช่างพูดเร็ว แต่บอกเป็นขั้น หมุนซ้ายครึ่งรอบ ดันเข้า นับถึงห้า แล้วหมุนกลับ {name}ทำตามได้โดยไม่ต้องให้บอกซ้ำ ความเย็นกัดขึ้นมาถึงศอก นิ้วชาจนไม่รู้แล้วว่าจับอะไรอยู่ แต่เสียงน้ำไหลหยุดตอนนับครบห้าพอดี

          ช่างดึงแขน{name}ออกมา เอาผ้าขนสัตว์ถูให้จนแดง แล้วถามชื่อ ถามว่าอ่านหนังสือออกไหม ก่อนกลับเข้าเมือง เขาทิ้งกระดาษไว้ให้แผ่นหนึ่ง เป็นรูปหม้อรวมวาดด้วยดินสอ ทุกท่อมีลูกศรกำกับว่าต้องหมุนอันไหนก่อน
        effects: { stats: { INT: 1 }, flags: [lean_wizard, star_tech_sketch] }
      failure:
        text: |
          {name}หมุนผิดทาง น้ำค้างดาวพุ่งใส่ข้อมือ ชาขึ้นไปถึงไหล่ในพริบตา ช่างกระชากแขน{name}ออกมา แล้วยัดแขนตัวเองเข้าไปแทน ถลอกเลือดซิบไปทั้งท่อนแขน แต่ก็ปิดได้

          เขาไม่ดุสักคำ เอาถ่านวาดรูปหม้อรวมไว้บนฝาโรง ชี้ให้ดูทีละท่อจนฟ้าสาง ข้อมือของ{name}เย็นอยู่อีกสามวัน
        effects: { stats: { INT: 1, CON: -1 }, flags: [lean_wizard] }
    - id: snare_hares
      label: กลับไปเอาบ่วงลวดของพ่อมาวางใต้เสา
      text: |
        {name}วางบ่วงไว้ตามช่องรั้วที่กระต่ายมุดเข้าออก ช่องเดียวกับที่เด็กในหมู่บ้านใช้แอบเข้าไปเล่น ก่อนรุ่งได้มาสามตัว

        ตัวหนึ่งยังไม่ตาย มันไม่ดิ้น ไม่ร้อง ตาสีฟ้าเรืองจ้องขึ้นมานิ่งๆ {name}หักคอมันตามที่{father}สอน แล้วหิ้วกลับบ้านทั้งสามตัว {mother}ไม่ยอมให้เข้าครัว {father}ถลกหนังดูที่ลานหลังบ้าน เนื้อข้างในแดงดีเหมือนกระต่ายทั่วไป เขาก็ยังขุดหลุมฝัง แล้วบอกว่าคราวหน้าไปวางที่ป่าเหนือ ให้ไกลจากเสาพวกนั้น
      effects: { stats: { DEX: 1 }, flags: [lean_ranger] }
    - id: steal_dew
      label: ฉวยตอนคนมุงช่าง เอาขวดยาเปล่าไปตักน้ำค้างดาวจากแอ่ง
      check: { stat: DEX, dc: 11 }
      success:
        text: |
          ไม่มีใครหันมามอง ทุกคนมุงดูช่างสบถอยู่หน้าหม้อรวม {name}จุ่มขวดลงแอ่งจนเต็ม ปากขวดเย็นจนนิ้วติด กลับถึงบ้านก็ซ่อนไว้ในถุงเท้าใต้ฟูก แสงฟ้าลอดผ้าออกมาทั้งคืน

          วันตลาด พ่อค้าเร่ที่มาทุกเดือนรับขวดไปส่องกับแดด แล้วนับเหรียญทองแดงลงบนมือ{name}ห้าเหรียญ บอกว่าเดือนหน้าถ้ามีอีกก็เอามา
        effects: { stats: { DEX: 1 }, gold: 5, flags: [lean_rogue, stole_dew] }
      failure:
        text: |
          มือหนึ่งคว้าคอเสื้อ{name}ไว้ตั้งแต่ขวดยังเต็มไม่ถึงครึ่ง เป็นลูกชายป้าบ้านท้ายคลอง เขารับจ้างเฝ้ายามที่นี่มาตั้งแต่ปีกลาย

          เขาแย่งขวดไป ส่องดูกับแสงจาน แล้วเก็บใส่กระเป๋าเสื้อตัวเอง "คืนนี้ข้าไม่เห็นเอ็ง" เขาว่า "เอ็งก็ไม่เห็นข้า"
        effects: { stats: { WIS: 1 }, flags: [lean_rogue] }

- id: youth.farm_hetel_bell
  stage: youth
  scene: home
  weight: 10
  when:
    age: [12, 13]
    flags: [origin_farm]
  text: |
    ยายเฮเทลแก่จนเข่าไม่ยอมงอ ปีนี้แกเดินไปทำคลอดเองไม่ไหวแล้ว ต้องมีคนช่วยแบกย่ามกับพยุงข้ามคันนา คืนที่หิมะลงหนักที่สุดของปี มีคนมาเคาะประตูบ้าน{name} บอกว่าเมียช่างตีเหล็กเจ็บท้องมาตั้งแต่หัวค่ำ ยายเฮเทลส่งคนมาตาม{name}คนเดียว ไม่ได้ตามใครอื่น

    บ้านช่างตีเหล็กอยู่ท้ายหมู่บ้าน ในห้องอุ่นเพราะเตาถ่านไม้ ยายเฮเทลผูกกระดิ่งทองเหลืองลูกเล็กไว้ที่หัวเตียงก่อนทำอย่างอื่น แล้วล้างมือ คลำท้องวนไปรอบหนึ่ง คลำซ้ำอีกรอบ คิ้วขมวดเข้าหากัน

    "เด็กเอาก้นลง" แกบอก{name}เบาๆ ไม่ให้แม่เด็กได้ยิน ส่วนช่างตีเหล็กนั่งอยู่นอกห้อง เอาหน้าผากพิงประตู
  choices:
    - id: hold_lamp
      label: ถือตะเกียงให้นิ่ง ทำตามที่ยายสั่งทุกคำ
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          ยายเฮเทลสั่งทีละคำ ยกตะเกียงสูง ต่ำลงอีก ส่องตรงนี้ จับขาตรงนี้ไว้ อย่าเพิ่งดึง {name}ทำตามทุกคำ มือไม่สั่นจนกระทั่งเด็กร้องออกมา ร้องดังกว่าลมข้างนอก

          ตอนเก็บย่าม ยายเฮเทลหยิบกระดิ่งออกจากหัวเตียง ยื่นให้{name}ถือกลับบ้าน "เอาไว้ก่อน" แกว่า "ข้าแก่แล้ว ลืมของบ่อย"
        effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [hetel_bell] }
      failure:
        text: |
          เด็กคลอดออกมาตอนตีสาม ตัวเขียว ไม่ร้อง ยายเฮเทลเป่าปาก ตบหลัง จุ่มน้ำเย็นสลับน้ำอุ่น ทำซ้ำจนตะเกียงในมือ{name}เริ่มหรี่ แกถึงยอมวางลง

          แกล้างตัวเด็กเอง ห่อผ้าเอง แล้วให้{name}ถือกระดิ่งเดินนำออกไปบอกช่างตีเหล็ก ขากลับแกไม่ร้องไห้ แต่เดินช้ากว่าตอนมาครึ่งหนึ่ง และไม่ยอมให้{name}พยุงตลอดทาง
        effects: { stats: { WIS: 1 }, flags: [lean_cleric, saw_birth_death] }
    - id: fetch_doctor
      label: ลุยหิมะไปตามหมอบริษัทที่โรงกลางทุ่ง
      check: { stat: CON, dc: 12 }
      success:
        text: |
          หิมะสูงถึงเข่า {name}เดินตามแนวเสาจานไปเรื่อยๆ เพราะเสาเป็นของอย่างเดียวที่ยังมองเห็นในพายุ หมอบริษัทเป็นชายหนุ่มใส่แว่น เปิดประตูมาทั้งชุดนอน แต่คว้ากระเป๋ามาได้ภายในสามอึดใจ

          พอไปถึง ยายเฮเทลมองคีมเหล็กในกระเป๋าหมอแวบเดียว แล้วหลีกที่ให้ เด็กรอด ตอนหมอกลับไปแล้ว แกถาม{name}ว่าเดินมาทางไหน พอรู้ว่าเดินตามแนวเสา แกก็ว่า "ฉลาด" แล้วไม่พูดถึงหมออีกเลย
        effects: { stats: { CON: 1 }, flags: [lean_ranger] }
      failure:
        text: |
          ครึ่งทาง หิมะกลบแนวเสาจนหมด {name}หลงอยู่กลางทุ่งจนเท้าหมดความรู้สึก ต้องหาทางกลับด้วยการฟังเสียงกระดิ่งวัวจากคอกบ้านท้ายหมู่บ้าน กลับมาถึงก็ฟ้าสางแล้ว

          เด็กคลอดเสร็จไปตั้งแต่ตีสาม ยายเฮเทลทำของแกเองได้ แกนั่งถูเท้าให้{name}ข้างเตาของช่างตีเหล็ก ถูจนนิ้วเท้ากลับมาแดง แล้วบอกว่าคราวหน้าก่อนออกจากบ้าน ให้ดูก่อนว่าลมพัดมาทางไหน
        effects: { stats: { WIS: 1 }, flags: [lean_ranger] }
    - id: sing
      label: ร้องเพลงให้แม่เด็กฟัง ตามที่ยายกระซิบสั่ง
      check: { stat: CHA, dc: 11 }
      success:
        text: |
          "ร้องอะไรก็ได้ที่ยาวๆ" ยายเฮเทลกระซิบ "ให้หายใจตาม"

          {name}ร้องเพลงหว่านข้าว เพลงที่คนบ้านเงาเสาร้องตอนหัวคันไถจมขอบฟ้า เพลงยาวสิบสองท่อน ท่อนละสองลมหายใจ {name}ร้องวนจนครบสองรอบ แม่เด็กหายใจตามได้ตั้งแต่รอบแรก เด็กออกมาตอนรอบที่สาม ท่อนที่สิบเอ็ด ยายเฮเทลบอกให้ร้องต่อจนจบ เพราะร้องค้างไว้มันไม่เป็นมงคล
        effects: { stats: { CHA: 1 }, flags: [lean_bard] }
      failure:
        text: |
          {name}ร้องผิดคำตั้งแต่ท่อนแรก ผิดอีกในท่อนที่สอง พอถึงท่อนที่สามก็จำไม่ได้แล้วว่าต่ออย่างไร เลยแต่งเอาเองสดๆ แต่งเรื่องลูกวัวที่ลุกไม่ขึ้น

          แม่เด็กเจ็บจนหน้าซีด แต่ก็หลุดหัวเราะออกมา หัวเราะแล้วเบ่ง เบ่งแล้วหัวเราะ ยายเฮเทลบอกว่าทำคลอดมาห้าสิบปี เพิ่งเคยเจอเด็กที่เกิดมาพร้อมเสียงหัวเราะ
        effects: { stats: { CHA: 1 }, flags: [lean_bard] }
