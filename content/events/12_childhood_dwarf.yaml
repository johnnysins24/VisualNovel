# วัยเด็ก ลูกตระกูลคนแคระ ถนนวนชั้นสิบเอ็ด ทุนดาร์ (origin_dwarf_clan)
# หนี้ค้อนของตระกูลทั่งเก่า (clan_debt_hammer) ห้ามบอกว่าในชั้นปิดตายมีอะไร

- id: childhood.dwarf_nameless
  stage: childhood
  weight: 8
  when:
    age: [3, 9]
    flags: [origin_dwarf_clan]
  text: |
    คนแคระฝังศพไว้ในผนังเสาของออสซา ห้องศพเจาะลึกเข้าไปในหินสีกระดูกเป็นชั้นๆ ทางเดินในนั้นเย็นทั้งปี ต่อให้เตาถ่านมารลุกอยู่ทั้งเมือง

    ปีนั้นป้าทวดตาย ทั้งตระกูลเดินขบวนถือตะเกียงเข้าไปในผนังเสา {name}เดินรั้งท้าย มัวนับห้องศพที่เดินผ่าน พอเงยหน้าขึ้น ขบวนเลี้ยวหายไปแล้ว เหลือแต่เสียงสวดก้องมาจากที่ไหนสักแห่ง

    ตรงทางแยกมีคนแคระคนหนึ่งยืนหันหน้าเข้าผนัง ผิวซีดเหมือนไม่เคยโดนแดด เคราขาวยาวถึงเข่า เขาเอานิ้วไล่ไปตามชื่อบนฝาห้องศพทีละชื่อ ปากขมุบขมิบ ไล่จบห้องหนึ่งก็ย้ายไปห้องถัดไป

    นิ้วของเขาไม่มีเงา ทั้งที่{name}ถือตะเกียงอยู่ห่างไปแค่สามก้าว

    เขาหยุด แล้วหันมา ตาสองข้างขาวขุ่นเหมือนตาปลาต้ม

    "เจ้าอ่านออกไหม" เขาถาม เสียงแห้งเหมือนกระดาษ "ข้าหาชื่อข้าไม่เจอ"
  choices:
    - id: read_names
      label: ยกตะเกียงขึ้น อ่านชื่อบนผนังให้ฟังทีละชื่อ
      text: |
        {name}อ่านให้ฟังทีละชื่อ ชื่อตัว ชื่อตระกูล ปีเกิด ปีตาย ทุกชื่อเขาส่ายหน้า อ่านไปได้สามสิบกว่าชื่อ เขาก็ยกมือห้าม

        "ไม่ต้องแล้ว ไม่มีหรอก เขาสกัดออกไปนานแล้ว" เขาว่า "ข้ารู้ ข้าแค่ลืมทุกที"

        แล้วเขาก็หันกลับไปไล่นิ้วต่อ จากชื่อที่{name}อ่านค้างไว้ ตอนที่{father}วิ่งย้อนกลับมาเจอ ทางแยกนั้นเหลือ{name}ยืนอยู่คนเดียว
      effects: { stats: { WIS: 1 }, flags: [helped_nameless] }
    - id: give_name
      label: บอกชื่อตัวเองให้เขาฟัง
      text: |
        "{name} {surname}"

        เขาทวนตามช้าๆ ทีละพยางค์ เหมือนคนชิมอาหารที่ไม่ได้กินมานาน "ชื่อดี" เขาว่า "เก็บไว้ให้ดี อย่าทำหล่นที่ไหน"

        ตอนที่{father}วิ่งย้อนกลับมาเจอ ทางแยกนั้นเหลือ{name}ยืนอยู่คนเดียว คืนนั้น{name}ฝันว่ามีใครเอานิ้วไล่ไปตามชื่อของตัวเองบนกำแพงตระกูล ไล่ไปกลับ ไปกลับ จนเช้า
      effects: { stats: { CHA: 1 }, flags: [gave_name_to_nameless] }
    - id: run
      label: วิ่งตามเสียงสวดกลับไปหาขบวน
      text: |
        {name}วิ่งตามเสียงสวด เลี้ยวผิดสองครั้ง ตะเกียงเกือบหลุดมือ แล้วก็ชนเข้ากับหลังของ{father}พอดี

        ไม่มีใครถามว่าทำไมหน้าซีด ในผนังเสาของออสซา เด็กทุกคนหน้าซีดอยู่แล้ว
      effects: { stats: { DEX: 1 } }

- id: childhood.dwarf_the_unsaid
  stage: childhood
  weight: 8
  when:
    age: [5, 8]
    flags: [origin_dwarf_clan]
  text: |
    พ่อค้าผ้าจากอาร์เวลขึ้นมาขายของที่ตลาดชั้นเก้าทุกต้นเดือน เขาพาลูกชายมาด้วย เด็กคนนั้นอายุพอๆ กับ{name} แต่ตัวสูงกว่าครึ่งหัว

    ระหว่างที่ผู้ใหญ่ต่อราคากัน เด็กสองคนนั่งห้อยขาอยู่บนขอบถนนวน มองลงไปเห็นปล่องเตาถ่านมารพ่นควันสีสนิมอยู่ข้างล่าง

    "ทำไมคนแคระชอบขุดลึกๆ" เด็กคนนั้นถาม "พ่อฉันบอกว่าเมื่อก่อนพวกแกขุดลึกจนไปเจออะไรเข้า"

    เด็กคนแคระทุกคนรู้เรื่องนี้ ครูในห้องเรียนใต้วิหารออสซาเล่าให้ฟังทุกปี บรรพบุรุษขุดลงไปจนทะลุถึงเบื้องล่าง แล้วจอมมารก็เดินขึ้นมาตามทางนั้น

    และเด็กคนแคระทุกคนก็รู้อีกเรื่องหนึ่ง ว่าเรื่องนี้ไม่เล่าต่อหน้าคนนอก
  choices:
    - id: tell
      label: เล่าตามที่ครูสอนทุกคำ
      text: |
        เด็กคนนั้นฟังจนปากอ้า ถามว่าแล้วรูนั้นยังอยู่ไหม {name}กำลังจะตอบ ก็เห็นคนแคระเจ้าของแผงข้างๆ หยุดมือ หันมามอง

        ตกค่ำ{father}รู้เรื่อง คืนนั้นเขานั่งซ่อมรองเท้าอยู่หน้าเตาจนดึก ไม่เรียก{name}ไปนั่งตักเหมือนทุกคืน เช้าวันต่อมา ตอนเดินผ่านกำแพงตระกูล เขาจับมือ{name}ไปวางบนชื่อบรรพบุรุษชื่อแรกสุด แล้วกดไว้จนมือลูกเย็นเท่าหิน
      effects: { stats: { INT: 1 }, flags: [told_outsider] }
    - id: lie
      label: บอกว่าคนแคระขุดหาทอง
      text: |
        "หาทอง" {name}ตอบ "ลึกๆ มีทองเยอะ"

        เด็กคนนั้นเชื่อ แล้วถามว่าเจอแล้วเอาไปไว้ไหน {name}โกหกต่อได้อีกสามเรื่องก่อนพ่อค้าจะเรียกลูกกลับ เดือนต่อมาเด็กคนนั้นขึ้นมาพร้อมพลั่วอันเล็ก
      effects: { stats: { CHA: 1 } }
    - id: point_tram
      label: ชี้ให้ดูรถรางขนแร่ที่กำลังไต่ผ่าน
      text: |
        {name}ชี้ไปที่รถรางขนแร่ที่ลากโซ่ไต่ขึ้นมาตามผนังเขา เด็กคนนั้นลืมคำถามไปทันที นั่งนับตู้แร่กันจนพ่อค้าเรียก

        ตอนเดินกลับบ้าน {name}นึกถึงคำถามนั้นอยู่ตลอดทาง
      effects: { stats: { WIS: 1 } }

- id: childhood.dwarf_debt_wall
  stage: childhood
  scene: clan_hall
  weight: 9
  when:
    age: [3, 11]
    year: [301, 311]
    flags: [origin_dwarf_clan]
  text: |
    หนี้สงครามถ่านสลักอยู่บนกำแพงสภาตระกูล หน้าลานใหญ่ชั้นห้า คนทั้งทุนดาร์เดินผ่านทุกวัน ตัวอักษรแต่ละตัวสูงเท่าเด็กห้าขวบ จำนวนถ่านที่ต้องส่ง ราคาที่อาร์เวลตั้ง จำนวนปี และชื่อทุกตระกูลที่ลงนามยอมแพ้

    ใต้ตัวหนังสือมีแถวขีดสั้นๆ ทุกปีในวันที่สงครามจบ สภาจะสลักเพิ่มหนึ่งขีด หนึ่งขีดคือหนึ่งปีที่จ่ายครบ ถัดจากขีดสุดท้ายเป็นหินเรียบยาวไปจนสุดกำแพง

    ปีนี้{father}พา{name}ไปยืนดูการสลักขีดเป็นครั้งแรก คนแคระยืนเต็มลาน ไม่มีใครพูด ได้ยินแต่เสียงสิ่วกระทบหินเป็นจังหวะ ช่างสลักแขนซ้ายเป็นเหล็ก ฝีมือโรงช่างของตระกูลเขาเอง

    ผู้ใหญ่ข้างๆ นับขีดออกเสียงเบาๆ แล้วนับหินเรียบที่เหลือ
  choices:
    - id: count
      label: นับช่องที่ยังว่างอยู่ทีละช่อง
      text: |
        {name}นับจนสุดกำแพง แล้วคิดในใจว่าตอนช่างสลักขีดสุดท้าย ตัวเองจะอายุเท่าไหร่ คิดได้แล้วก็พูดออกมาดังๆ

        ผู้ใหญ่รอบๆ หันมามอง {father}วางมือบนหัวลูก "อย่านับ" เขาว่า "นับแล้วนอนไม่หลับ"
      effects: { stats: { INT: 1 } }
    - id: spit
      label: ถุยน้ำลายใส่ชื่อราชอาณาจักรบนกำแพง
      text: |
        น้ำลายไปไม่ถึงกำแพง ตกอยู่บนพื้นลานห่างไปสองก้าว ผู้ใหญ่รอบๆ ไม่มีใครห้าม คนแคระแก่ๆ คนหนึ่งหัวเราะในคอ

        {father}ตีมือ{name}หนึ่งที ตีเบาจนแทบไม่รู้สึก
      effects: { stats: { CHA: 1 }, alignment: { law: -1 }, reputation: { dwarf_council: 1 } }
    - id: find_clan
      label: หาชื่อตระกูลตัวเองในแถวที่ลงนาม
      text: |
        ชื่อ{surname}อยู่แถวที่สามจากล่าง สลักตื้นกว่าชื่ออื่นนิดหนึ่ง เหมือนคนสลักมือไม่หนัก {name}ชี้ให้พ่อดู

        {father}บอกว่าตอนลงนาม ทวดเป็นคนจับปากกา แกถือปากกาค้างไว้เหนือกระดาษ จนหมึกหยดลงโต๊ะสภาไปสามหยด
      effects: { stats: { WIS: 1 }, flags: [found_clan_signature] }

- id: childhood.dwarf_arm_order
  stage: childhood
  weight: 8
  when:
    age: [6, 11]
    year: [301, 311]
    flags: [origin_dwarf_clan]
  text: |
    หลังสงครามถ่าน ราชนาวีอาร์เวลส่งใบสั่งขึ้นมาที่ทุนดาร์ทุกเดือน แขนกลสี่สิบแขน ขาสิบสองขา สำหรับนายทหารที่เสียแขนขาในสงคราม ราคาตามที่อาร์เวลตั้ง

    โรงช่างของตระกูลรับไปสิบแขน คนในบ้านต้องช่วยกันทุกคน {name}ได้งานขัดข้อนิ้ว ข้อนิ้วทองเหลืองเล็กเท่าเม็ดถั่วเหลือง แขนหนึ่งข้างใช้สามสิบเอ็ดข้อ ต้องขัดจนส่องเห็นหน้า

    {father}ประกอบแขนอยู่ที่โต๊ะใต้ตะเกียงแขวนต่ำ ใบสั่งติดอยู่บนผนัง ทุกแขนมีชื่อทหารเขียนกำกับไว้ มีชื่อหนึ่งที่{father}หยุดอ่านนานกว่าชื่ออื่น แล้วหยิบแขนข้างนั้นมาประกอบเป็นข้างสุดท้าย
  choices:
    - id: polish
      label: ขัดทุกข้อจนเงาวับ
      text: |
        {name}ขัดจนนิ้วดำไปทั้งสิบ ข้อนิ้วสามร้อยสิบข้อวางเรียงบนผ้าเหมือนลูกปัด {father}หยิบขึ้นมาส่องทีละข้อ ไม่มีข้อไหนต้องขัดใหม่

        "นายทหารพวกนี้จะขยับนิ้วได้ลื่นทุกข้อ" เขาว่า ฟังไม่ออกว่าพูดอย่างภูมิใจหรืออย่างอื่น
      effects: { stats: { WIS: 1 } }
    - id: scratch_mark
      label: แอบขูดเครื่องหมายตระกูลไว้ใต้ข้อนิ้วข้อหนึ่ง
      text: |
        {name}เอาปลายเหล็กแหลมขูดเครื่องหมายตระกูลลงใต้ข้อนิ้วชี้ของแขนข้างหนึ่ง เล็กจนไม่มีใครเห็น ถ้าไม่รู้ว่าต้องหาตรงไหน

        แขนข้างนั้นเป็นแขนที่มีชื่อที่{father}อ่านนานกว่าชื่ออื่น
      effects: { stats: { DEX: 1 }, flags: [marked_an_arm] }
    - id: ask_father
      label: ถามพ่อว่าคนชื่อนั้นเป็นใคร
      text: |
        {father}วางไขควงลง

        "แขนซ้ายของเขา พ่อทำให้ตั้งแต่ก่อนสงคราม" เขาว่า "จ่ายครบทุกเหรียญ แล้วยังส่งเหล้ามาให้อีกไหหนึ่ง"

        แล้วก็หยิบไขควงขึ้นมาประกอบต่อ คืนนั้นเขาไม่ได้บอกว่าแขนขวาของคนคนนั้นหายไปที่ไหน แต่แขนข้างนั้นเขาประกอบช้ากว่าข้างอื่นเกือบเท่าตัว
      effects: { stats: { INT: 1 } }

- id: childhood.dwarf_elder_burial
  stage: childhood
  scene: home
  weight: 8
  when:
    age: [6, 11]
    flags: [origin_dwarf_clan]
  text: |
    หน้าหนาวปีนั้นทวดล้มป่วย ไม่ลุกจากเตียงมาสิบวัน วันที่สิบเอ็ดแกให้คนไปตาม{name}เข้าไปในห้อง คนเดียว

    มือของทวดเย็นและแข็งเหมือนหินขัด แกคลำหาหน้า{name}อยู่พักหนึ่งจนเจอ

    "ทั่งเก่าจะมาอีก" แกว่า "ไม่ใช่ปีนี้ อาจไม่ใช่สิบปีนี้ แต่มาแน่ ใครในบ้านนี้ยังอยู่ คนนั้นต้องตอบ"

    "ตอบว่าอะไร{ครับ|คะ}ทวด"

    "ตอบตามจริง ค้อนยังอยู่ข้างล่าง ตระกูลนี้ยังไม่ลืม" แกหยุดหายใจ "สองครั้งที่ข้าตอบ ข้าพูดแค่นั้น ทั่งเก่าก็กลับไป ครั้งหน้าเขาอาจไม่ยอมกลับ"

    สามวันต่อมา ทั้งตระกูลแบกร่างทวดเข้าไปในผนังเสาของออสซา
  choices:
    - id: promise
      label: สัญญากับทวดว่าจะจำทุกคำ
      text: |
        "จำได้แล้ว" {name}บอก แล้วทวนให้ฟังทุกคำ ทวดพยักหน้าครั้งเดียว ปล่อยมือ แล้วหันหน้าเข้าผนัง

        วันฝังศพ {name}เป็นคนถือตะเกียงนำขบวน ตามธรรมเนียม คนที่ได้ยินคำสุดท้ายของผู้ตายต้องเดินหน้าสุด
      effects: { stats: { WIS: 1 }, flags: [elder_passed, promised_elder_debt] }
    - id: ask_inside
      label: ถามทวดว่าในชั้นปิดตายมีอะไร
      text: |
        ทวดหายใจออกยาว มีเสียงครืดอยู่ในอก จน{name}นึกว่าแกหลับไปแล้ว

        "คนที่ก่อหินปิด ไม่ได้บอกใคร" แกว่าในที่สุด "ข้าเคยถามพ่อข้า พ่อข้าก็ถามพ่อเขา ไม่มีใครรู้ รู้แต่ว่าตอนก่อ เขาก่อจากข้างนอก"

        วันฝังศพ {name}เดินถือตะเกียงอยู่หน้าขบวน ตามธรรมเนียม คนที่ได้ยินคำสุดท้ายของผู้ตายต้องเดินหน้าสุด
      effects: { stats: { INT: 1 }, flags: [elder_passed] }
    - id: hold_hand
      label: จับมือทวดไว้เงียบๆ จนแกหลับ
      text: |
        {name}ไม่ถามอะไร จับมือเย็นๆ นั้นไว้ทั้งสองมือ จนมือของทวดอุ่นขึ้นนิดหนึ่ง แกหลับไป มือยังไม่ปล่อย

        วันฝังศพ {name}เดินถือตะเกียงอยู่หน้าขบวน ตามธรรมเนียม คนที่ได้ยินคำสุดท้ายของผู้ตายต้องเดินหน้าสุด
      effects: { stats: { CHA: 1 }, flags: [elder_passed] }

- id: childhood.dwarf_sealed_level
  stage: childhood
  weight: 9
  when:
    age: [8, 11]
    flags: [origin_dwarf_clan]
  text: |
    ลุงพา{name}ลงเหมืองเก่าเป็นครั้งแรก เดินลงบันไดหินที่เจาะไว้ตั้งแต่ยุคเจ็ดเสา ขั้นบันไดสึกเป็นแอ่งตรงกลางเพราะเท้าคนแคระนับไม่ถ้วนที่เดินผ่าน ลงไปจนเสียงรถรางข้างบนเงียบหาย เหลือแต่เสียงน้ำหยด

    สุดทางของอุโมงค์ชั้นยี่สิบสาม มีกำแพงก่อปิดตาย ก้อนหินแต่ละก้อนใหญ่กว่าตัวคน รอยต่อเทตะกั่วไว้ บนหินสลักอักษรเป็นแถวลึก ไม่ใช่อักษรคนแคระที่{name}เรียนมา ลุงก็อ่านไม่ออก ไม่มีใครในทุนดาร์อ่านออก

    "ข้างหลังนั่นคือชั้นที่ค้อนของทั่งเก่าอยู่" ลุงว่า "ทวดของทวดของเอ็งเป็นคนยกหินก้อนบนสุด"

    "แล้วข้างในมีอะไร{ครับ|คะ}ลุง"

    ลุงไม่ตอบ เขาเอามือแตะหิน แล้วแตะหน้าผากตัวเอง คนแคระทำอย่างนี้เวลาเดินผ่านห้องศพ

    ตอนลุงหันไปเติมน้ำมันตะเกียง {name}ได้ยินเสียงจากหลังกำแพง เหมือนเหล็กแตะหิน ช้าๆ เป็นจังหวะ หรืออาจเป็นแค่น้ำหยด
  choices:
    - id: knock
      label: เคาะกำแพงสามที
      text: |
        ก๊อก ก๊อก ก๊อก เสียงก้องหายเข้าไปในหิน

        เสียงหลังกำแพงหยุด ลุงหันขวับมาคว้าข้อมือ{name}ไว้แน่นจนเจ็บ ทั้งสองคนยืนนิ่งอยู่อย่างนั้นจนเปลวตะเกียงหยุดสั่น ไม่มีเสียงอะไรตอบกลับมา และเสียงที่เคยได้ยินก็ไม่กลับมาอีก

        ขากลับ ลุงเดินเร็วกว่าขาลงเกือบเท่าตัว
      effects: { stats: { CHA: 1 }, flags: [sealed_wall_knocked] }
    - id: copy_runes
      label: เอาถ่านลอกลายอักษรใส่ผ้าเช็ดหน้า
      text: |
        {name}ขึงผ้าเช็ดหน้าทาบหิน เอาถ่านถูจนลายอักษรแถวล่างสุดขึ้นมาบนผ้าครบสามตัว ลุงเห็นแต่ไม่ห้าม

        "อย่าให้ใครในสภาเห็น" เขาบอกตอนเดินขึ้นบันได "แล้วอย่าพยายามอ่าน"
      effects: { stats: { INT: 1 }, flags: [copied_sealed_runes, lean_wizard] }
    - id: back_away
      label: ถอยออกมายืนข้างลุง
      habit: faint_heart
      text: |
        {name}ถอยออกมายืนชิดลุง ไม่ได้บอกว่าได้ยินอะไร ลุงมองหน้าแล้วก็รู้

        "ดี" เขาว่า "เด็กที่รู้จักถอย ถึงจะได้อยู่จนแก่"
      effects: { stats: { WIS: 1 } }

- id: childhood.dwarf_first_hammer
  stage: childhood
  weight: 8
  when:
    age: [3, 6]
    flags: [origin_dwarf_clan]
    not_flags: [elder_passed]
  text: |
    หน้าหนาวปีนั้นถึงคราวที่{name}จะได้ค้อนอันแรก เด็กคนแคระได้ค้อนเมื่อยกค้อนของพ่อขึ้นพ้นเข่าได้ ค้อนเล็กเท่าฝ่ามือผู้ใหญ่ หัวเหล็ก ด้ามไม้ ช่างของตระกูลตีให้เอง และเด็กต้องตั้งชื่อให้ค้อนก่อนจะได้จับ

    {father}วางค้อนลงบนโต๊ะ หัวค้อนยังอุ่นจากเตา มีเครื่องหมายตระกูลตอกไว้ที่ด้านข้าง

    "ตั้งชื่อดีๆ" เขาว่า "ตระกูลเรายืมค้อนของคนอื่นมาแล้วครั้งหนึ่ง ยังไม่ได้คืนจนทุกวันนี้ เล่มนี้เป็นของเราเอง"
  choices:
    - id: name_strong
      label: ตั้งชื่อว่า หินแตก
      text: |
        "หินแตก" {name}ว่า แล้วคว้าค้อนไปทุบโต๊ะทีหนึ่ง โต๊ะไม่แตก แต่ถ้วยน้ำกระโดด

        {father}หัวเราะ คืนนั้นเขาเล่าให้ทุกคนในบ้านฟังสามรอบ เล่ารอบหนึ่ง โต๊ะก็ใกล้แตกขึ้นอีกนิด
      effects: { stats: { STR: 1 } }
    - id: name_elder
      label: ตั้งชื่อตามชื่อทวด
      text: |
        {name}ตั้งชื่อค้อนตามชื่อทวด ทวดได้ยินจากห้องข้างๆ แกเงียบไปพักหนึ่ง แล้วตะโกนออกมาว่าชื่อข้าเอาไปตั้งให้ค้อนได้ แต่ห้ามเอาไปตอกตะปูคด

        ตั้งแต่นั้นทุกครั้งที่ตอกตะปูคด {name}จะกระซิบขอโทษค้อนก่อน
      effects: { stats: { CHA: 1 } }
    - id: name_debt
      label: ตั้งชื่อว่า ค้อนที่ต้องคืน
      text: |
        {father}วางมือลงบนโต๊ะทั้งสองข้าง

        "ไม่มีใครเคยตั้งชื่อนี้" เขาว่า "แต่ก็ไม่มีกฎห้าม" เขาตอกชื่อนั้นลงบนด้ามให้เองด้วยเหล็กแหลม ตัวเล็กๆ ทีละตัว จนเกือบเที่ยงคืน
      effects: { stats: { WIS: 1 }, flags: [hammer_named_for_debt] }
