# วัยกลางคน: ครอบครัว ชุด A (batch 4 package A)
# รักที่มาช้า งานแต่งช้า ลูกคนแรกที่มาช้า เด็กที่รับมาเลี้ยงสามแบบ คู่ครองห้าเรื่อง พ่อกับแม่ที่แก่ลง
# ทุกเรื่องในไฟล์นี้ไม่มีใครตาย

- id: adult.fam_late_love_first
  stage: adult
  scene: market
  weight: 14
  when:
    age: [34, 46]
    not_flags: [has_partner, partner_died]
  text: |
    หม้อแกงใบที่{name}ใช้มาหลายปีรั่วตรงก้น รูเท่าเม็ดถั่วเขียว แกงหยดลงไฟดังฉ่าทุกครั้งที่ตั้งเตา แผงปะหม้อปลายซอยเป็นของหญิงม่ายคนหนึ่ง เธอเคาะก้นหม้อสองที บอกว่าปะได้ สามเหรียญทองแดง แต่ไม่คุ้ม เหล็กบางแล้ว ซื้อใหม่ดีกว่า ลูกค้าคนไหนต่อราคาลงเธอไม่ว่า ลูกค้าคนไหนจะจ่ายมากกว่าที่เธอขอ เธอเถียงจนอีกฝ่ายยอมแพ้

    วันเดียวกันมีผู้ชายคนหนึ่งถือกาต้มน้ำบุบๆ มาต่อคิวหลัง{name} เป็นกาแบบที่แจกกันตามป้อม ทาสีเขียวทับไว้หลายชั้น เขาเพิ่งกลับจากไปประจำป้อมชายแดนหลายปี จำราคาของในเมืองไม่ได้สักอย่าง ใครบอกเท่าไรก็จ่ายเท่านั้น เด็กขายส้มในซอยรู้กันหมดแล้ว ขึ้นราคาเป็นสองเท่าเฉพาะตอนเขาเดินผ่าน

    หญิงม่ายบอกเขาว่าปะกาสองเหรียญ เขาวางให้ห้า เธอโยนสามเหรียญที่เกินคืนใส่อกเขา แล้วทั้งสองคนก็หันมาทาง{name} คล้ายรอให้คนที่ยืนอยู่ตรงกลางตัดสิน
  choices:
    - id: argue_the_pot
      label: เถียงกับเธอว่าหม้อใบนี้ยังคุ้มปะ
      text: |
        {name}เถียงว่าหม้อใบนี้ต้มแกงมาหลายปี รสแกงซึมเข้าเนื้อเหล็กไปแล้ว ซื้อใบใหม่ต้องเริ่มกันใหม่หมด เธอเถียงกลับว่ารสแกงไม่ได้ติดหม้อ ติดมือคนทำ สองคนเถียงกันจนผู้ชายถือกาต้องย้ายไปยืนรอที่แผงข้างๆ

        สุดท้ายเธอปะให้โดยไม่คิดเงิน บอกว่าสามเหรียญไม่คุ้มเวลาที่เสียไปเถียง แล้วบอกชื่อว่า{partner} เธอยังทำกับข้าวทีละหม้อเท่าตอนที่บ้านมีสองคน ทำมาหลายปีแล้วแก้มือไม่หาย ส่วนที่เหลือแมวในซอยกินหมดทุกคืน เธอถาม{name}ว่าจะมาแย่งส่วนของแมวไหม
      effects: { partner: { gender: f }, stats: { CHA: 1 }, flags: [has_partner, partner_pot_mender] }
    - id: teach_the_prices
      label: พาเขาเดินตลาด บอกราคาของทีละแผง
      text: |
        {name}พาเขาเดินตั้งแต่ต้นซอยถึงท่าน้ำ บอกราคาไข่ ราคาฟืน ราคาเกลือ ราคาตัดผม แผงไหนต่อได้ แผงไหนต่อแล้วโดนด่า เขาจดลงสมุดเล่มเล็กปกหนังกลับ ตัวหนังสือเหลี่ยมแบบเสมียนป้อม พอถึงแผงส้ม เด็กขายส้มเห็น{name}เดินมาด้วยก็ลดราคาลงเองครึ่งหนึ่ง

        ตอนแยกกันเขาฉีกสมุดให้หน้าหนึ่ง เป็นรายการราคาที่เพิ่งจด ท้ายหน้าเซ็นชื่อไว้ว่า{partner} บรรทัดล่างสุดเขียนเพิ่มว่า ข้าวเย็นร้านริมท่า สองคน ราคายังไม่รู้
      effects: { partner: { gender: m }, stats: { WIS: 1 }, flags: [has_partner, partner_back_from_the_fort] }
    - id: buy_a_new_pot
      label: ซื้อหม้อใบใหม่ แล้วกลับไปต้มแกงเองที่บ้าน
      text: |
        {name}ตัดสินว่าทั้งสองคนพูดถูก เธอพูดถูกเรื่องหม้อ เขาพูดถูกเรื่องที่ควรให้คนทำงานมากกว่าที่ขอ แล้วเดินไปซื้อหม้อเหล็กหล่อใบใหม่ที่หัวตลาด หนักจนต้องหิ้วสองมือ

        แกงหม้อแรกในหม้อใหม่มีรสเหล็ก หม้อที่สองค่อยดีขึ้น หม้อเก่าใบที่รั่ว{name}เอามาปลูกต้นหอมไว้ริมหน้าต่าง รดน้ำลงไปเท่าไรก็ซึมออกรูก้นพอดี
      effects: { gold: -1, flags: [stayed_alone_at_forty, bought_the_iron_pot] }

- id: adult.fam_late_love_second
  stage: adult
  scene: healer
  weight: 12
  when:
    age: [45, 60]
    not_flags: [has_partner]
  text: |
    หมอดัดกระดูกท้ายถนนรับคนไข้สามวันต่อสัปดาห์ ไม่รับนัด ใครมาก่อนได้ก่อน ม้านั่งยาวหน้าบ้านหมอนั่งได้หกคนถ้าไม่มีใครตัวใหญ่ {name}มานั่งตรงนี้ทุกสัปดาห์ตั้งแต่เข่าซ้ายเริ่มลั่นเวลาลงบันได

    คนที่มาตรงวันกันเป็นประจำมีสองคน ผู้หญิงคนหนึ่งจำได้ว่าใครมาก่อนใครทุกคน ใครแอบลัดคิว เธอจะเรียกชื่อเต็มพร้อมชื่อพ่อของคนนั้นดังไปถึงหัวถนน ไหล่ขวาของเธอยกได้ไม่เกินหู อีกคนเป็นผู้ชายที่แบกเก้าอี้ไม้ของตัวเองมานั่ง บอกว่าม้านั่งของหมอทำหลังพังกว่าตอนมา เขาอ่านป้ายราคาหน้าประตูออกเสียงทุกครั้ง ทีละบรรทัด แล้วบ่นทีละบรรทัด

    สัปดาห์นี้หมอเปิดประตูช้าไปครึ่งวัน ทั้งสามคนนั่งรอจนเงาหลังคาย้ายจากฝั่งหนึ่งของถนนไปอีกฝั่ง
  choices:
    - id: back_the_queue
      label: ช่วยเธอไล่คนลัดคิว
      text: |
        เด็กหนุ่มคนหนึ่งพาตาของตัวเองมาแทรกตรงหัวม้านั่ง ผู้หญิงคนนั้นยังไม่ทันอ้าปาก {name}ลุกขึ้นไล่ชื่อทุกคนบนม้านั่งตามลำดับที่มา จากหัวไปท้าย ไม่ผิดสักคน เด็กหนุ่มพาตาไปต่อท้าย ตาหันมาขอโทษสองรอบ

        เธอหันมาถามว่าจำได้ยังไง {name}บอกว่านั่งฟังเธอไล่คนมาทั้งหน้าฝน ฟังจนจำได้เอง เธอบอกว่าชื่อ{partner} สัปดาห์หน้าใครมาก่อนให้จองที่ไว้ให้อีกคน ส่วนใครมาก่อนจริง เธอจะเป็นคนจำเอง
      effects: { partner: { gender: f }, stats: { CHA: 1 }, flags: [has_partner, partner_kept_the_queue] }
    - id: argue_the_prices
      label: อ่านป้ายราคาไปกับเขา แล้วเถียงว่าค่าดัดเข่าแพงเกินจริงไหม
      text: |
        เขาว่าค่าดัดเข่าสองเหรียญแพงเกิน {name}ว่าถูกไปด้วยซ้ำ คิดดูว่าหมอต้องจับเข่าคนแปลกหน้าวันละยี่สิบเข่า เขาบอกว่าถ้าคิดแบบนั้น หมอต้องจ่ายคนไข้ด้วย เถียงกันจนคนบนม้านั่งเลือกข้าง สามต่อสอง ฝั่ง{name}ชนะ

        เขาจ่ายเดิมพันหนึ่งเหรียญอย่างไม่เต็มใจ สัปดาห์ต่อมาเขาแบกเก้าอี้มาสองตัว ตัวที่สองวางไว้ข้างตัวเอง บอกว่าชื่อ{partner} ทำเก้าอี้ขายมาทั้งชีวิต ตัวนี้ยังไม่ได้ตั้งราคา
      effects: { partner: { gender: m }, gold: 1, flags: [has_partner, partner_brought_a_stool] }
    - id: speak_of_the_gone
      label: บอกเธอว่าเมื่อก่อนเคยมีอีกคนมานั่งรอด้วย
      requires: { flag: partner_died }
      text: |
        ผู้หญิงคนนั้นถามขึ้นมาเองว่าคนที่เคยนั่งข้าง{name}หายไปไหน คนที่ชอบนั่งริมสุดเพราะจะได้เหยียดขา เธอจำได้ ที่ริมสุดว่างมาหลายหน้าฝนแล้ว ไม่มีใครกล้านั่ง {name}บอกว่าไม่มาแล้ว จะไม่มาอีก

        เธอบอกว่าคนของเธอก็ไม่มาแล้วเหมือนกัน เมื่อก่อนเขาเป็นคนจำว่าใครมาก่อนใคร เธอแค่ทำต่อ แล้วเลื่อนตัวไปนั่งที่ริมสุด เหยียดขาจนเท้าโผล่พ้นเงาหลังคา บอกว่าชื่อ{partner} ที่ตรงนี้นั่งสบายจริงอย่างที่ว่า
      effects: { partner: { gender: f }, alignment: { moral: 1 }, flags: [has_partner, partner_took_the_end_seat] }
    - id: see_the_doctor_alone
      label: เข้าไปให้หมอดัดเข่าให้เสร็จ แล้วกลับก่อนใคร
      text: |
        หมอดึงเข่าซ้ายของ{name}ทีเดียว เสียงดังกร๊อบจนคนบนม้านั่งข้างนอกสะดุ้งกันทั้งแถว แล้วสั่งว่าเดือนนี้อย่าขึ้นบันไดถ้าไม่จำเป็น คิดเงินสองเหรียญ

        ขากลับ{name}ลงเนินได้โดยไม่ต้องจับราว สัปดาห์ต่อมาไม่ต้องไปนั่งม้านั่งยาวอีก ได้ยินจากแม่ค้าข้าวต้มว่าผู้หญิงจำคิวกับผู้ชายแบกเก้าอี้ยังมาทุกสัปดาห์ เถียงกันว่าที่ว่างที่{name}ทิ้งไว้ควรเป็นของใคร
      effects: { gold: -2, stats: { CON: 1 }, flags: [stayed_alone_later] }

- id: adult.fam_after_the_mourning
  stage: adult
  scene: home
  weight: 16
  cast:
    gone: { id: partner, alive: false }
  when:
    age: [38, 60]
    flags: [partner_died]
    not_flags: [has_partner]
  text: |
    เสื้อคลุมตัวหนาของ{gone}แขวนบนตะขอหลังประตูมาหลายหน้าหนาว จนพี่สาวของ{gone}มาขอเอาไปผึ่งแดด บอกว่ากลิ่นอับลอยมาถึงหน้าบ้าน แล้วไม่เคยเอามาคืน ตะขอว่างได้ไม่นาน ประตูหลังบ้านก็พัง

    ผู้ชายบ้านถัดไปสองหลังมาซ่อมให้ ซ่อมแล้วพังอีก เขามาซ่อมอีก รอบที่สามเขาเปลี่ยนบานพับทั้งชุด ไม่คิดเงิน แต่ยังแวะมาโยกบานประตูดูทุกเย็นว่าแน่นดีไหม ส่วนที่บ่อโยกท้ายถนน มีผู้หญิงคนหนึ่งมาตักน้ำเวลาเดียวกับ{name}ทุกเย็น เธอโยกให้ก่อนเสมอ บอกว่าแขนเธอยังดีกว่า แล้วเล่าเรื่องคนในถนนให้ฟังจนถังเต็มทั้งสองใบ

    แม่ค้าบ้านหัวมุมพูดดังที่สุดในถนน ว่าบ้านที่อยู่คนเดียวไม่น่าต้องเปลี่ยนบานพับบ่อยขนาดนั้น
  choices:
    - id: tea_for_the_hinge
      label: ต้มน้ำชารอไว้ก่อนเขามาโยกประตูเย็นนี้
      text: |
        เย็นนั้นเขามาโยกประตูตามเคย เห็นถ้วยชาสองถ้วยบนโต๊ะ ยืนอยู่ตรงธรณีจนชาหายร้อนถึงยอมเข้ามานั่ง แล้วสารภาพว่าบานพับรอบแรกเขาซ่อมลวกๆ ไว้เอง จะได้มีเหตุให้มาอีก รอบที่สองก็เหมือนกัน รอบที่สามเกรงใจ เลยซ่อมจริง

        เขาชื่อ{partner} หลังเย็นนั้นก็ไม่ต้องหาเหตุมาอีก บานพับประตูหลังบ้านไม่พังอีกเลยหลายปี แม่ค้าหัวมุมบ่นว่าถนนนี้ไม่มีเรื่องให้พูดแล้ว
      effects: { partner: { gender: m }, alignment: { moral: 1 }, flags: [has_partner, partner_fixed_the_hinge] }
    - id: pump_for_her
      label: ไปถึงบ่อก่อนเธอ แล้วโยกน้ำให้เธอบ้าง
      check: { stat: STR, dc: 13 }
      success:
        text: |
          {name}ไปถึงบ่อก่อนเวลา โยกจนถังของเธอเต็มทั้งสองใบก่อนเธอเดินมาถึงหัวถนน เธอยืนดูถังที่เต็มแล้ว บอกว่าเรื่องคนในถนนวันนี้ยาวกว่าทุกวัน ถังเต็มเร็วไป แล้วเทน้ำทิ้งลงร่องหน้าบ่อทั้งสองใบ ให้โยกใหม่

          เธอชื่อ{partner} เล่าจนฟ้ามืด ถังเต็มเป็นรอบที่สาม ไม่มีใครรีบหิ้วกลับ
        effects: { partner: { gender: f }, stats: { STR: 1 }, flags: [has_partner, partner_at_the_pump] }
      failure:
        text: |
          คันโยกบ่อนี้ฝืดกว่าที่คิด โยกไปได้ครึ่งถังไหล่ของ{name}ลั่นดังกึก ปล่อยมือไม่ทัน คันเหล็กตีกลับมาโดนข้อมือ เธอเดินมาถึงพอดี ฉีกชายผ้ากันเปื้อนพันข้อมือให้ แล้วโยกน้ำเต็มทั้งสี่ถังคนเดียว บอกว่าแขนเธอยังดีกว่าจริงอย่างที่บอก

          เธอชื่อ{partner} หิ้วถังของ{name}ไปส่งถึงบ้าน ระหว่างทางเล่าเรื่องคนในถนนต่อจากเมื่อวาน แม่ค้าหัวมุมยืนดูทั้งสองคนจนลับประตู
        effects: { partner: { gender: f }, hp: -1, flags: [has_partner, partner_at_the_pump] }
    - id: fetch_the_coat
      label: ไปขอเสื้อคลุมของ{gone}คืนจากพี่สาว
      text: |
        พี่สาวของ{gone}ซักเสื้อคลุมตัวนั้นไว้แล้ว พับวางบนหีบ ไม่ได้ยกให้ใคร ไม่ได้ทิ้ง เธอยื่นคืนให้โดยไม่ถามว่าเอาไปทำไม เสื้อหอมสบู่ก้อนเหลืองแบบที่บ้านเธอใช้ ไม่ใช่กลิ่นเดิมแล้ว

        {name}แขวนเสื้อกลับขึ้นตะขอหลังประตู เย็นวันต่อมาไม่มีใครมาโยกบานประตูหลังบ้าน ส่วนบ่อท้ายถนน{name}ย้ายไปตักน้ำตอนเช้าแทน
      effects: { stats: { WIS: 1 }, flags: [keeps_one_place_empty] }

- id: adult.fam_late_wedding
  stage: adult
  scene: temple
  weight: 22
  when:
    age: [35, 60]
    flags: [has_partner]
    not_flags: [married, stays_unwed]
  text: |
    หน้าหนาวที่แล้ว{partner}ล้มป่วยอยู่ห้าวัน หมอยาจะให้ยาขวดใหญ่ไปกินที่บ้านได้ก็ต่อเมื่อคนในบ้านลงชื่อรับ {name}ยื่นมือไปจะจับปากกา หมอยาถามว่าเป็นอะไรกับคนป่วย ภรรยา สามี หรือญาติ {name}ตอบไม่ได้สักข้อ สุดท้ายต้องวิ่งไปตามญาติของ{partner}จากอีกฝั่งถิ่นมาลงชื่อแทน

    {partner}หายนานแล้ว ลุกมาต้มข้าวได้ตั้งแต่วันที่หก แต่ใบรับยาใบนั้นยังไม่ได้ทิ้ง เช้านี้ใบนั้นไปโผล่อยู่ใต้กระปุกเกลือบนโต๊ะกินข้าว ตรงที่{name}ต้องเห็นทุกมื้อ

    สองคนอยู่ด้วยกันมาจนคนในถิ่นเลิกถามแล้วว่าเมื่อไร ป้าที่เคยถามทุกครั้งที่เจอหน้าก็ย้ายไปอยู่กับลูกที่อื่นนานแล้ว งานแต่งในถิ่นยังทำแบบเดิม คนสองคนถือชามไฟดินเผาใบเดียวกันคนละข้าง เดินจากแท่นในวิหารไปจนถึงประตู แขกคอยดูว่าน้ำมันจะหกไหม แต่แขกของงานแต่งรุ่นนี้ส่วนมากลุกจากม้านั่งเองยังลำบาก
  choices:
    - id: wed_on_a_workday
      label: ไปวิหารเช้าวันทำงาน สองคนกับนักบวชคนเดียว
      text: |
        นักบวชของอีเซลเปิดประตูวิหารให้ทั้งปากยังเคี้ยวขนมปังเช้า ถามว่าแขกอยู่ไหน {partner}บอกว่ามาครบแล้ว นักบวชจุดไฟในชามใบที่ซื้อจากแผงหม้อเมื่อวาน ชามใบเล็กกว่าที่เห็นในงานคนอื่น เพราะไม่มีใครต้องอวดใคร

        ไม่มีแขกคอยดู น้ำมันหกลงพื้นหินหยดหนึ่งกลางทาง สองคนหยุดเดินพร้อมกัน ก้มดูหยดนั้น แล้วหัวเราะกันเองแทนคนทั้งวิหาร นักบวชยืนรอที่ประตู ขนมปังในมือหมดพอดีตอนชามมาถึง
      effects: { mark: "แต่งงานกับ{partner}", items: [wedding_clay_bowl], alignment: { law: 1 }, flags: [married, wed_on_a_workday] }
    - id: walk_it_home
      label: ถือชามไฟจากวิหารไปให้ถึงประตูบ้านตัวเอง เลยประตูวิหารออกไป
      check: { stat: CON, dc: 13 }
      success:
        text: |
          จากวิหารถึงบ้านไกลเกือบครึ่งถิ่น ขึ้นเนินหนึ่ง ลงบันไดสองช่วง คนตามทางออกมายืนดู เด็กวิ่งตามเป็นขบวน แม่ค้าน้ำอ้อยตะโกนว่าหกแล้วหกแล้วทุกครั้งที่ชามเอียง ชามไม่หกสักหยด

          ถึงหน้าบ้าน{partner}ตั้งชามลงบนธรณี ไฟยังติด สองคนนั่งลงบนขั้นบันได หอบจนพูดไม่ออก เด็กทั้งขบวนยืนรอว่าจะมีอะไรต่อ ไม่มี เด็กก็แยกย้ายกลับบ้าน
        effects: { mark: "แต่งงานกับ{partner}", stats: { CON: 1 }, items: [wedding_clay_bowl], flags: [married, walked_the_bowl_home] }
      failure:
        text: |
          บันไดช่วงที่สอง เข่าของ{name}ทรุดลงไปหนึ่งขั้น ชามเอียง น้ำมันหกไปครึ่งชาม ไฟวูบขึ้นมาเลียข้อมือแล้วดับ {partner}ไม่ยอมปล่อยขอบชาม ประคอง{name}ลุกขึ้นทั้งที่ชามยังอยู่ในมือสองคน

          ถึงบ้าน น้ำมันเหลือติดก้นชาม ไฟเล็กเท่าเม็ดถั่ว {partner}เป่าดับเอง บอกว่าน้ำมันที่เหลือพอเอาไว้ทาเข่า
        effects: { mark: "แต่งงานกับ{partner}", hp: -1, items: [wedding_clay_bowl], flags: [married, walked_the_bowl_home, spilled_on_the_stairs] }
    - id: bowl_at_our_stove
      label: ซื้อชามใบเท่าถ้วยแกง จุดไฟที่เตาในบ้าน แล้วถือไปถึงประตูบ้าน
      text: |
        {partner}บอกว่าอีเซลอยู่ที่เตาบ้านไหนก็ได้ ไม่ต้องเดินไปถึงวิหาร {name}จ่ายหนึ่งเหรียญซื้อชามใบเล็ก จุดไส้จากไฟในเตา สองคนถือชามคนละข้าง เดินจากเตาถึงประตูบ้านได้ห้าก้าว ก้าวที่สามแมวเดินตัดหน้า ต้องกลับไปเริ่มที่เตาใหม่

        รอบที่สองไม่มีแมว ถึงประตูแล้วไม่มีใครรู้ว่าต้องทำอะไรต่อ {partner}เปิดประตูออกไปให้ถนนเห็นชาม ชาวบ้านที่เดินผ่านเห็นแต่คนสองคนยืนถือชามไฟอยู่ที่ประตูตอนเที่ยงวัน
      effects: { mark: "แต่งงานกับ{partner}", gold: -1, items: [wedding_clay_bowl], flags: [married, wed_at_own_stove] }
    - id: carer_paper
      label: ไปขอใบผู้ดูแลจากหมอยามาลงชื่อกันไว้ แค่นั้นพอ
      text: |
        หมอยามีกระดาษแบบนั้นอยู่ปึกหนึ่งในลิ้นชัก ไว้ให้คนที่ดูแลกันแต่ไม่ได้เป็นญาติ ลงชื่อสองคน ตีตราหมอยาหนึ่งดวง คิดค่าหมึกครึ่งเหรียญ หมอยาบอกว่าคนวัยนี้มาขอใบนี้มากกว่าคนหนุ่มสาวมาขอแต่งงานเสียอีก

        {name}พับใบผู้ดูแลเก็บไว้ในหีบ {partner}เอาใบรับยาใบเก่าที่ทับอยู่ใต้กระปุกเกลือไปจุดเตา กระปุกเกลือกลับไปตั้งบนชั้นอย่างที่เคย
      effects: { alignment: { law: -1 }, flags: [stays_unwed, signed_a_carers_paper] }

- id: adult.fam_late_child
  stage: adult
  scene: home
  weight: 22
  when:
    age: [34, 44]
    flags: [married, has_partner]
    not_flags: [has_child]
  text: |
    ป้าร้านผ้าเคยแนะ{name}ให้ไปจุดตะเกียงที่วิหารอีเซลทุกคืนเดือนเพ็ญ แนะอยู่หลายปี แล้วเปลี่ยนไปถามเรื่องเข่าแทน คนทั้งถนนเลิกถามเรื่องลูกไปพร้อมกับป้า จนคืนที่เสียงเด็กร้องดังทะลุหน้าต่างบ้าน{name}กับ{partner}ไปถึงหัวถนน ป้าร้านผ้าเดินมาเคาะประตูถามว่าเด็กบ้านไหน

    บ้านนี้จัดไว้สำหรับคนสองคนมาหลายปี มีดแขวนต่ำ ตะเกียงตั้งริมโต๊ะ บันไดชันไม่มีราว ทุกอย่างวางตรงที่มือผู้ใหญ่หยิบง่าย และอีกไม่กี่หน้าฝนจะเป็นตรงที่มือเด็กหยิบง่ายด้วย

    คืนแรก{name}ก้มลงอุ้มเด็กขึ้นจากเปลสิบกว่าครั้ง ครั้งที่สิบสองหลังส่งเสียงดังกว่าเด็ก
  choices:
    - id: rocking_chair
      label: จ่ายสามเหรียญซื้อเก้าอี้โยก นั่งโยกแทนยืนโยก
      requires: { min_gold: 3 }
      text: |
        ช่างไม้ท้ายถนนมีเก้าอี้โยกตัวหนึ่งที่ลูกค้าสั่งแล้วไม่มารับ {name}แบกกลับมาเอง เก้าอี้ส่งเสียงเอี๊ยดทุกครั้งที่โยกไปข้างหลัง {child}หลับไปกับเสียงนั้นตั้งแต่คืนแรก

        สัปดาห์ต่อมา{partner}หยอดน้ำมันที่ขาเก้าอี้ เสียงเอี๊ยดหายไป {child}ตื่นทั้งคืน วันรุ่งขึ้น{partner}เช็ดน้ำมันออกจนหมด
      effects: { mark: "{child}เกิด", gold: -3, child: {}, flags: [has_child, rocked_from_a_chair] }
    - id: write_it_down
      label: จดทุกอย่างลงสมุด กินกี่ครั้ง นอนกี่ชั่วยาม ร้องแบบไหน
      text: |
        {name}จดตั้งแต่คืนแรก ตีเส้นเป็นช่อง ช่องกิน ช่องนอน ช่องร้อง ช่องผ้าอ้อม ครบเดือนก็เห็นว่า{child}ร้องหนักทุกครั้งที่ฝนจะตก ก่อนฟ้าจะร้องเสียอีก

        {partner}เริ่มเขียนเพิ่มลงในสมุดด้วยลายมืออีกแบบ เขียนแต่สิ่งที่ไม่มีช่องให้ เช่น วันนี้จับนิ้วไว้นาน วันนี้จามแล้วตกใจเสียงจามตัวเอง พอถึงเดือนที่สาม หน้าสมุดมีลายมือของ{partner}มากกว่าตัวเลขของ{name}
      effects: { mark: "{child}เกิด", stats: { INT: 1 }, child: {}, flags: [has_child, kept_a_baby_ledger] }
    - id: back_on_the_third_day
      label: กลับไปทำงานวันที่สาม ให้มีเงินเข้าบ้านเท่าเดิม
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ออกจากบ้านตอนฟ้ายังมืด กลับมาตอนฟ้ามืดอีกรอบ กลางคืนผลัดกับ{partner}ลุกคนละครึ่ง ที่ทำงานไม่มีใครรู้ว่าบ้าน{name}มีเด็กเกิดใหม่ จนนายงานเห็นรอยนมบูดเปื้อนบ่าเสื้อ

          ครบเดือน{name}ไม่ขาดงานสักวัน ค่าแรงเดือนนั้นซื้อผ้าอ้อมได้สองโหลกับนมแพะอีกหนึ่งไห {child}ยังจำหน้า{name}ได้แค่ตอนกลางคืน
        effects: { mark: "{child}เกิด", stats: { CON: 1 }, child: {}, flags: [has_child, back_at_work_on_day_three] }
      failure:
        text: |
          วันที่ห้า{name}หลับยืนพิงเสาที่ทำงาน ล้มลงไปโดนขอบโต๊ะเป็นแผลแตกที่คิ้ว นายงานสั่งให้กลับบ้านไปนอนสามวัน ไม่หักค่าแรง บอกว่าเสียค่าแรงสามวันยังถูกกว่าเสียคนทั้งคน

          สามวันนั้น{name}ไม่ได้นอน {child}รู้ว่ามีคนอยู่บ้านทั้งวันก็ร้องให้อุ้มทั้งวัน {partner}ได้หลับเต็มคืนสามคืนติด
        effects: { mark: "{child}เกิด", hp: -1, child: {}, flags: [has_child, back_at_work_on_day_three] }
    - id: ask_the_old_mothers
      label: เดินไปถามคนแก่ทุกบ้านในถนนว่าเลี้ยงกันยังไง
      text: |
        บ้านแรกว่าห่อตัวให้แน่น บ้านที่สองว่าห่อแน่นแล้วขาจะโก่ง บ้านที่สามว่าให้แขวนกระดิ่ง บ้านที่สี่ว่ากระดิ่งทำให้เด็กติดเสียง ป้าร้านผ้าว่าอย่าฟังใคร แล้วพูดต่ออีกครึ่งวัน

        {name}จดทุกคำ กลับมาอ่านให้{partner}ฟังหมดทุกบ้าน {partner}ฟังจบแล้วห่อ{child}แบบที่ตัวเองห่อมาตั้งแต่คืนแรก {child}หลับ
      effects: { mark: "{child}เกิด", child: {}, flags: [has_child, asked_every_house_on_the_street] }

- id: adult.fam_ward_of_kin
  stage: adult
  weight: 9
  when:
    age: [36, 56]
    not_flags: [has_ward]
  text: |
    คนขับเกวียนขนเกลือเคาะประตูตอนพลบค่ำ ถามว่าที่นี่บ้าน{name}ใช่ไหม ถามสองรอบ รอบที่สองอ่านชื่อจากกระดาษที่กางอยู่ในมือ ข้างหลังเขามีเด็กผู้หญิงคนหนึ่งนั่งบนกระสอบเกลือ กอดห่อผ้าไว้กับอก รองเท้าคนละสี

    กระดาษนั้นเป็นจดหมายของลูกพี่ลูกน้องคนหนึ่งของ{name} คนที่ไม่ได้เจอหน้ากันตั้งแต่ยังเด็ก เธอเขียนไว้ตั้งแต่ต้นหน้าหนาว ว่าถ้าเธอไปก่อนลูก ขอให้ส่งลูกไปหา{name} พ่อของเด็กไปก่อนเธอนานแล้ว ที่อยู่ของ{name}เขียนไว้สามแบบ ขีดฆ่าสองแบบ แบบที่สามเขียนด้วยหมึกอีกสี คนขับเกวียนบอกว่าตามหามาสามเมือง ค่าเกวียนมีคนจ่ายไว้ตั้งแต่ต้นทาง

    เด็กชื่อเมเรน ไม่ยอมลงจากกระสอบเกลือจนกว่าจะมีคนบอกว่าลงได้
  choices:
    - id: lift_her_down
      label: ยื่นมือไปอุ้มเมเรนลงจากกระสอบเกลือ
      text: |
        เมเรนตัวหนักกว่าที่เห็น กลิ่นเกลือติดผมติดเสื้อ ห่อผ้าใบนั้นมีเสื้อสองตัว หวีหนึ่งอัน กับผ้าคลุมไหล่ผู้หญิงหนึ่งผืนที่พับไว้เล็กเท่าฝ่ามือ คืนแรกเธอนอนกอดห่อผ้าทั้งห่อ ไม่ยอมแกะ

        เช้าวันรุ่งขึ้นเธอถามว่ารองเท้าหนูวางตรงไหนได้ {name}ชี้ที่ข้างประตู ข้างรองเท้าของตัวเอง เมเรนวางรองเท้าคนละสีคู่นั้นเรียงไว้ ชิดกันจนปลายเท้าแตะ
      effects:
        alignment: { moral: 1 }
        flags: [has_ward, raised_a_ward, took_in_a_cousins_child]
        mark: รับเมเรนมาเลี้ยง
        people: [{ id: ward_kin, name: เมเรน, gender: f, kin: child, bond: kin, closeness: 2, age: 8 }]
    - id: decide_with_the_house
      label: เรียกคนที่อยู่ด้วยกันออกมาดูก่อน ให้ตัดสินใจด้วยกัน
      requires: { flag: has_partner }
      text: |
        คนในบ้านออกมายืนที่ประตู อ่านจดหมายจบก่อน{name} แล้วเดินผ่านคนขับเกวียนไปยื่นมือให้เด็กเอง เมเรนไม่จับ ถามว่าบ้านนี้มีกี่คน พอได้คำตอบว่าสอง เธอถึงยอมลง

        คืนนั้นบ้านมีชามข้าวสามใบเป็นครั้งแรกในรอบหลายปี ชามใบที่สามเป็นใบบิ่นที่ไม่มีใครใช้ เมเรนกินจนเกลี้ยง แล้วถือไปล้างเอง ไม่ให้ใครแย่ง
      effects:
        stats: { WIS: 1 }
        flags: [has_ward, raised_a_ward, took_in_a_cousins_child, ward_chosen_by_two]
        mark: รับเมเรนมาเลี้ยง
        people: [{ id: ward_kin, name: เมเรน, gender: f, kin: child, bond: kin, closeness: 2, age: 8 }]
    - id: find_her_aunt
      label: ถามคนขับเกวียนว่าฝั่งพ่อของเด็กยังมีญาติเหลือไหม แล้วออกตามหา
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          คนขับเกวียนจำได้ว่าตอนรับเด็กมา มีผู้หญิงคนหนึ่งตามมาร้องไห้ถึงหัวสะพาน บอกว่าเป็นน้าฝั่งพ่อ {name}ตามไปถึงบ้านเธอในอีกสองวัน ผู้หญิงคนนั้นมีลูกสี่คน ห้องเดียว แต่บอกว่าห้าคนก็นอนได้ ถ้ามีคนช่วยค่าข้าวสักหน้าหนาว

          {name}จ่ายค่าข้าวไปสองเหรียญ เมเรนลงจากเกวียนหน้าบ้านน้าโดยไม่ต้องรอใครบอก ลูกสี่คนในบ้านนั้นมายืนดูรองเท้าคนละสีของเธอเรียงแถว
        effects: { gold: -2, stats: { CHA: 1 }, flags: [found_the_ward_an_aunt] }
      failure:
        text: |
          ไม่มีใครในเกวียนรู้ว่าฝั่งพ่อมีใคร {name}ถามคนในตลาดเกลือสองวัน ได้ชื่อมาสามชื่อ ทุกชื่อย้ายไปแล้วหรือไม่ก็ตายไปแล้ว วันที่สามเมเรนเลิกถามว่าจะได้ไปบ้านใคร

          {name}พาเธอไปส่งที่ห้องยาวของวิหารอีเซล ให้ผ้าห่มไปหนึ่งผืน แม่ชีเขียนชื่อเมเรนลงกระดานชนวนต่อท้ายชื่อเด็กอีกยี่สิบกว่าชื่อ
        effects: { gold: -1, flags: [left_the_ward_at_the_temple] }
    - id: send_to_the_temple
      label: พาเมเรนไปฝากไว้กับแม่ชีที่วิหารอีเซลพรุ่งนี้เช้า
      text: |
        คืนนั้นเมเรนนอนบนกระสอบเกลือในเกวียน ไม่ยอมเข้าบ้าน เช้ามา{name}เดินนำไปวิหาร เธอเดินตามห่างสามก้าวตลอดทาง แม่ชีรับห่อผ้าไปถือให้ เมเรนแย่งคืน

        หลังจากนั้น{name}เห็นเธอกวาดบันไดหน้าวิหารทุกเช้าวันพักงาน รองเท้าคู่ใหม่สีเดียวกันทั้งสองข้าง เป็นของบริจาค
      effects: { alignment: { law: 1 }, flags: [sent_a_cousins_child_to_the_temple] }

- id: adult.fam_ward_from_the_temple
  stage: adult
  scene: temple
  weight: 14
  when:
    age: [40, 60]
    not_flags: [has_child, has_ward, raised_a_ward]
  text: |
    ทุกต้นหน้าหนาว แม่ชีของอีเซลเขียนชื่อบ้านที่ไม่มีเด็กลงกระดานชนวนแผ่นหนึ่ง แขวนไว้ข้างประตูวิหาร ชื่อของ{name}อยู่บนกระดานนั้นมาหลายปี ทุกปี{name}ใช้นิ้วโป้งลบออกตอนเดินผ่าน ทุกปีชื่อนั้นกลับขึ้นไปใหม่ในลายมือเดิม

    ปีนี้แม่ชีคนเขียนยืนรออยู่ข้างกระดาน ผ้าคลุมผมเปื้อนฝุ่นขาวจากดินสอหิน นางไม่ห้ามให้ลบ บอกแค่ว่าห้องยาวมีเด็กยี่สิบเจ็ดคน มีเตียงสิบเก้าเตียง ขอให้คืนนี้หลังสวดเย็นมาดูห้องยาวสักครั้ง ดูแล้วจะลบชื่อก็ลบ

    คืนนั้นห้องยาวมีตะเกียงดวงเดียวที่ปลายห้อง เด็กนอนเตียงละสองคน หัวทางหนึ่ง เท้าทางหนึ่ง ข้างเตามีเด็กผู้ชายตัวเล็กนอนบนเสื้อคลุมพับ แม่ชีบอกว่าเขาเตะคนข้างๆ ตกเตียงทุกคืน เลยต้องนอนพื้น เด็กยังไม่หลับ นอนนับคานเพดานอยู่ในคอ แม่ชีบอกว่าชื่อหมอกสาง ตามเช้าที่มีคนพบเขาบนขั้นบันไดวิหาร
  choices:
    - id: count_the_beams
      label: นั่งลงข้างหมอกสาง ถามว่านับคานได้ถึงไหนแล้ว
      text: |
        หมอกสางบอกว่าสิบสี่ นับทุกคืน บางคืนได้สิบห้าเพราะนับซ้ำ {name}บอกว่าบ้านมีคานแค่เก้าอัน หมอกสางคิดอยู่นาน แล้วถามว่าคานบ้านนั้นใหญ่ไหม ถ้าใหญ่ เก้าก็พอ

        สัปดาห์ต่อมาแม่ชีลบชื่อ{name}ออกจากกระดานเอง หมอกสางนอนบนเตียงเตี้ยที่ลากมาตั้งกลางห้อง ตรงใต้คานอันที่ห้า เตะผ้าห่มตกทุกคืน {name}เก็บขึ้นมาห่มให้ใหม่ทุกเช้า ก่อนตัวเองจะได้ล้างหน้า
      effects:
        flags: [has_ward, raised_a_ward, took_a_temple_child]
        mark: รับหมอกสางมาเลี้ยง
        people: [{ id: ward_temple, name: หมอกสาง, gender: m, kin: child, bond: kin, closeness: 2, age: 6 }]
    - id: bring_the_house_back
      label: กลับไปห้องยาวอีกคืนพร้อมคนที่อยู่ด้วยกัน
      requires: { flag: has_partner }
      text: |
        คืนที่สองหมอกสางเตะผ้าห่มใส่ขาคนแปลกหน้าสองคนที่นั่งอยู่ข้างเตา แล้วแกล้งหลับ คนในบ้านของ{name}หยิบผ้าห่มขึ้นมาห่มให้ใหม่ หมอกสางเตะออกอีก ห่มใหม่อีก เล่นกันจนตะเกียงปลายห้องต้องเติมน้ำมัน

        ขากลับมีคนสามคนเดินออกจากประตูวิหาร คนตัวเล็กที่สุดเดินตรงกลาง ถามว่าบ้านนั้นมีเตาไหม แล้วถามว่าเตาร้อนกว่าเตาวิหารไหม
      effects:
        stats: { CHA: 1 }
        flags: [has_ward, raised_a_ward, took_a_temple_child, ward_chosen_by_two]
        mark: รับหมอกสางมาเลี้ยง
        people: [{ id: ward_temple, name: หมอกสาง, gender: m, kin: child, bond: kin, closeness: 2, age: 6 }]
    - id: build_a_bed
      label: ไม่รับเด็ก แต่ต่อเตียงให้ห้องยาวเองหนึ่งเตียง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ซื้อไม้สองเหรียญ ต่อเตียงอยู่สามวันในลานหลังวิหาร เด็กในห้องยาวมายืนดูกันเป็นแถว หมอกสางยืนหน้าสุด คอยบอกว่าตะปูตัวไหนเอียง เตียงเสร็จ แข็งแรงพอให้เด็กสองคนกระโดดเล่นโดยไม่ลั่น

          แม่ชีให้หมอกสางนอนเตียงนั้นคนเดียว จะเตะใครตกก็ไม่มีใครให้เตะ ชื่อ{name}บนกระดานชนวนนางลบออกเอง แล้วเขียนไว้ที่หัวเตียงแทน
        effects: { gold: -2, stats: { DEX: 1 }, flags: [built_a_bed_for_the_long_room] }
      failure:
        text: |
          ขาเตียงข้างหนึ่งสั้นกว่าอีกสามข้าง {name}เลื่อยแก้สองรอบ เตียงเตี้ยลงทุกรอบ จนสุดท้ายเหลือสูงแค่หน้าแข้ง แม่ชีบอกว่าดีแล้ว เด็กตกเตียงจะได้ไม่เจ็บ

          หมอกสางได้นอนเตียงเตี้ยนั้นคนเดียว ตกลงมาทุกคืนเหมือนเดิม แต่ตกจากที่ต่ำลง {name}เสียค่าไม้ไปสองเหรียญ กับนิ้วโป้งที่ตอกพลาดอีกหนึ่งนิ้ว
        effects: { gold: -2, hp: -1, flags: [built_a_bed_for_the_long_room] }
    - id: wipe_the_name
      label: ลบชื่อออกจากกระดานเหมือนทุกปี แล้วกลับบ้าน
      text: |
        {name}เดินออกจากห้องยาวก่อนแม่ชีจะดับตะเกียง ผ่านกระดานชนวนข้างประตู ลบชื่อตัวเองออกด้วยนิ้วโป้ง ฝุ่นหินติดนิ้วเป็นสีเทา

        ปีนั้นชื่อของ{name}ไม่กลับขึ้นไปบนกระดานอีก มีเด็กอีกคนนอนบนเสื้อคลุมพับข้างเตาไปจนหมดหน้าหนาว
      effects: { flags: [wiped_the_name_off_the_slate] }

- id: adult.fam_ward_left_behind
  stage: adult
  weight: 9
  when:
    age: [42, 60]
    not_flags: [has_ward]
  text: |
    ห้องเช่าชั้นล่างของบ้านหัวถนนว่างตั้งแต่ก่อนไก่ขัน ประตูเปิดอ้า หม้อยังแขวนอยู่บนตะปู ผ้าห่มหายหมด ครอบครัวที่อยู่ห้องนั้นค้างค่าเช่ามาสามเดือน ค้างร้านข้าวอีกเท่าไรไม่มีใครรู้ คนในถนนรู้กันแต่ว่าคนทวงหนี้นัดมาวันนี้

    หน้าประตูห้องว่าง ลูกสาวคนโตของบ้านนั้นนั่งอยู่บนขั้นบันได ชื่อเคสลิน ตัวสูงเกือบเท่าผู้ใหญ่แต่แขนยังเป็นแขนเด็ก เธอรับจ้างล้างไหที่โรงเหล้าตอนกลางคืน กลับมาถึงบ้านก็ไม่เหลือใคร มีแต่ห่อผ้าของเธอวางไว้ที่ธรณี ผูกเชือกไว้สองรอบ ข้างในมีเหรียญทองแดงสามเหรียญ

    เจ้าของบ้านมาถึงพร้อมกุญแจใหม่ ถามเคสลินว่าพ่อแม่ไปไหน เคสลินบอกว่าไม่รู้ ทั้งถนนรู้ว่าเธอโกหก เจ้าของบ้านหันมาถาม{name} คนที่ยืนอยู่ใกล้ที่สุด ว่าคืนนี้เด็กจะไปนอนที่ไหน
  choices:
    - id: sleep_here_tonight
      label: บอกว่าคืนนี้นอนบ้าน{name}ก่อน แล้วค่อยว่ากัน
      text: |
        เคสลินปูเสื่อนอนข้างประตู ห่อผ้าวางไว้ใต้หัว รองเท้าไม่ถอด นอนแบบนั้นทุกคืนอยู่หนึ่งสัปดาห์ เหมือนพร้อมจะลุกไปเมื่อมีคนเรียก เช้าทุกเช้าเธอตื่นก่อน{name} ตักน้ำเต็มโอ่งแล้วกลับไปนั่งที่เสื่อ

        คืนที่แปด{name}กลับมาเห็นเสื่อผืนนั้นย้ายไปอยู่มุมข้างเตา รองเท้าถอดวางไว้ปลายเสื่อ ห่อผ้าแกะออกแล้ว เสื้อสองตัวพับไว้บนหิ้งที่เคยวางขวดน้ำมัน
      effects:
        flags: [has_ward, raised_a_ward, kept_the_girl_from_the_corner_house]
        mark: รับเคสลินมาเลี้ยง
        people: [{ id: ward_street, name: เคสลิน, gender: f, kin: child, bond: kin, closeness: 2, age: 12 }]
    - id: second_bowl
      label: กลับไปบอกคนในบ้านว่าคืนนี้มีคนกินข้าวเพิ่มหนึ่ง
      requires: { flag: has_partner }
      text: |
        ยังไม่ทันพูดจบ คนในบ้านก็วางชามใบที่สามบนโต๊ะไว้แล้ว ห้องหัวถนนอยู่ใกล้พอให้ได้ยินเสียงเจ้าของบ้านเปลี่ยนกุญแจตั้งแต่เช้า เคสลินกินข้าวช้าๆ นับเม็ดไปด้วย กินเสร็จก็ลุกไปล้างชามทั้งสามใบ

        คนทวงหนี้มาบ่ายวันนั้น เคาะประตูห้องว่างแล้วเดินมาเคาะบ้าน{name}ต่อ ถามหาครอบครัวหัวถนน คนในบ้านของ{name}ยืนขวางประตูไว้ บอกว่าบ้านนี้มีแต่คนที่ไม่ได้ติดเงินใคร
      effects:
        stats: { CHA: 1 }
        flags: [has_ward, raised_a_ward, kept_the_girl_from_the_corner_house, ward_chosen_by_two]
        mark: รับเคสลินมาเลี้ยง
        people: [{ id: ward_street, name: เคสลิน, gender: f, kin: child, bond: kin, closeness: 2, age: 12 }]
    - id: walk_her_to_the_temple
      label: พาเคสลินไปห้องยาวของวิหารอีเซล
      text: |
        แม่ชีรับเด็กที่โตขนาดนี้ไว้ได้ไม่นาน แต่มีงานซักผ้าในวิหารให้ทำแลกข้าวสองมื้อ เคสลินไม่ยอมเข้าไปข้างใน ยืนอยู่หน้าประตูจนแม่ชีต้องออกมารับห่อผ้าเอง

        หน้าหนาวนั้น{name}เห็นเธอตากผ้าปูเตียงของวิหารทุกเช้า ผ้าขาวเป็นแถวยาวสุดลาน แขนเธอแดงจากน้ำด่างขึ้นมาถึงศอก
      effects: { alignment: { law: 1 }, flags: [took_the_corner_house_girl_to_the_temple] }
    - id: pay_her_fare
      label: ถามว่าครอบครัวไปทางไหน แล้วจ่ายค่าเกวียนให้ตามไป
      text: |
        เคสลินบอกชื่อเมืองริมแม่น้ำเมืองหนึ่ง ที่ป้าของเธออยู่ บอกแล้วเอามือปิดปากเหมือนพูดเกิน {name}จ่ายค่าเกวียนสามเหรียญ ซื้อขนมปังให้อีกสองก้อน เดินไปส่งถึงลานเกวียนตอนฟ้ายังไม่สาง

        คนทวงหนี้มาถึงถนนนั้นตอนสาย เคาะห้องว่าง เคาะบ้านข้างๆ เคาะบ้าน{name} ทุกบ้านบอกว่าไม่รู้ ทุกบ้านพูดจริง ยกเว้นบ้านเดียว
      effects: { gold: -3, alignment: { law: -1 }, flags: [paid_the_corner_house_girls_fare] }

- id: adult.fam_partner_work_ends
  stage: adult
  scene: home
  weight: 16
  when:
    age: [41, 54]
    flags: [has_partner]
  text: |
    {partner}กลับบ้านตอนเที่ยง วางห่อเครื่องมือลงบนโต๊ะ เชือกที่มัดห่อผูกเงื่อนตายสองชั้น แน่นกว่าทุกวัน

    เจ้าของที่ทำงานคนเก่าขายกิจการให้คนหนุ่มจากถิ่นอื่น เช้านี้คนใหม่เรียกคนงานมายืนเรียงแถว คนหนุ่มได้ค่าแรงเต็ม คนที่ทำงานที่นั่นมาตั้งแต่ก่อนนายคนใหม่เกิดได้ครึ่งเดียว บอกว่ามือช้าลงแล้ว จะอยู่ต่อก็ได้ จะไปก็ได้ วันนี้ให้กลับไปคิด

    {partner}ทำงานที่นั่นมาตั้งแต่ก่อนสองคนจะรู้จักกัน เงินครึ่งที่หายไปเท่ากับค่าเช่าบ้านพอดี
  choices:
    - id: take_the_half
      label: ให้{partner}ทนรับครึ่งค่าแรงไปก่อน แล้วรัดเข็มขัดทั้งบ้าน
      text: |
        บ้านกินเนื้อสัปดาห์ละครั้ง จุดตะเกียงดวงเดียว เลิกซื้อขนมจากเตาอบหัวถนน {partner}ไปทำงานทุกเช้าเหมือนเดิม กลับมาเล่าว่าคนหนุ่มที่ได้ค่าแรงเต็มมาถามวิธีทำงานจากคนที่ได้ครึ่งเดียวทั้งวัน

        ปลายปีนายคนใหม่ขึ้นค่าแรงให้คนเก่าเป็นสามส่วนสี่ โดยไม่บอกเหตุผล {partner}ซื้อขนมจากเตาอบหัวถนนกลับมาหนึ่งชิ้น ผ่าครึ่ง
      effects: { gold: -2, alignment: { law: 1 }, flags: [partner_took_half_wage] }
    - id: take_extra_work
      label: รับงานเพิ่มเอง ให้{partner}ได้เลือกว่าจะทนหรือจะลาออก
      check: { stat: CON, dc: 14 }
      success:
        text: |
          {name}รับงานกะดึกเพิ่มสี่คืนต่อสัปดาห์ ได้เงินแทนครึ่งที่หายไปพอดี {partner}ลาออกในสัปดาห์นั้น ไปรับงานจากคนที่เคยเป็นลูกค้าเก่า ทีละงาน ได้บ้างไม่ได้บ้าง

          สองคนเจอกันวันละครั้ง ตอนคนหนึ่งออกจากบ้าน อีกคนเพิ่งกลับ ส่งห่อข้าวกันที่ธรณีประตูทุกวัน ห่อของ{partner}มีไข่ต้มเพิ่มมาหนึ่งฟองทุกครั้ง
        effects: { gold: 2, stats: { CON: 1 }, flags: [took_extra_work_for_partner] }
      failure:
        text: |
          สัปดาห์ที่สามของกะดึก {name}เป็นไข้ทั้งที่ยืนอยู่หน้างาน ต้องนอนเจ็ดวัน ค่าหมอยากินเงินกะดึกที่หามาได้หมด {partner}ไม่ได้ลาออก กลับไปรับครึ่งค่าแรงต่อเพราะบ้านต้องมีคนทำงาน

          ระหว่างที่{name}นอนซม {partner}เอาห่อเครื่องมือออกมาวางบนโต๊ะ แกะเงื่อนตายสองชั้นนั้นออกทีละชั้น
        effects: { hp: -2, flags: [took_extra_work_for_partner, partner_took_half_wage] }
    - id: rent_a_stall
      label: เอาเงินเก็บหกเหรียญเช่าแผงให้{partner}รับงานเอง
      requires: { min_gold: 6 }
      text: |
        แผงที่ได้อยู่ปลายตลาด ใกล้ร่องน้ำ หน้าฝนน้ำท่วมถึงข้อเท้า {partner}ตอกชั้นวางเครื่องมือเอง แขวนป้ายเขียนชื่อตัวเองตัวใหญ่ เดือนแรกมีลูกค้าเก้าคน ห้าคนเป็นลูกค้าเก่าที่ตามมาจากที่ทำงานเดิม

        เดือนที่สามนายคนใหม่มายืนหน้าแผง ถือของที่คนงานหนุ่มทำเสียมาให้ซ่อม {partner}คิดราคาเต็ม ไม่ลดให้สักเหรียญ
      effects: { gold: -6, stats: { WIS: 1 }, flags: [rented_partner_a_stall] }
    - id: keep_the_house
      label: บอก{partner}ว่าลาออกเถอะ อยู่บ้านดูแลบ้านไปก่อน
      text: |
        {partner}ลาออกวันรุ่งขึ้น แล้วจัดครัวใหม่ทั้งครัวภายในสามวัน ย้ายเกลือไปไว้ชั้นบน ย้ายมีดไปไว้ลิ้นชัก ย้ายกระทะไปแขวนในที่ที่{name}ไม่เคยรู้ว่ามีตะปูอยู่

        เดือนแรก{name}หาเกลือไม่เจอทุกเย็น เดือนที่สองเริ่มเจอ เงินในบ้านน้อยลงหนึ่งในสาม แต่หลังคาที่รั่วมาหลายหน้าฝนได้ซ่อม รั้วที่เอียงได้ตั้ง ไก่ที่หายไปสองตัวกลับมาพร้อมลูกห้าตัว
      effects: { gold: -1, flags: [partner_keeps_the_house] }

- id: adult.fam_partner_hidden_purse
  stage: adult
  scene: home
  weight: 16
  when:
    age: [41, 58]
    flags: [has_partner]
  text: |
    หนูขุดใต้พื้นครัวมาทั้งหน้าฝน คืนนี้{name}ทนเสียงไม่ไหว งัดกระดานแผ่นที่สามจากเตาขึ้นมาดู ไม่เจอหนู เจอไหดินเผาใบเท่ากำปั้นสองกำ ปากไหปิดผ้า มัดเชือก

    ในไหมีเหรียญทองแดงปนเหรียญเงิน หนักพอให้รู้ว่าเก็บมาหลายปี บนผ้าปิดปากไห{partner}เขียนด้วยถ่านไว้คำเดียว ว่า หลัง กับรูปคนก้มตัวงอเป็นตะขอ ลายเส้นของคนที่วาดรูปไม่เป็น

    ทั้งบ้านมีคนเดียวที่ตัวงอเป็นตะขอเวลาลุกจากเตียงตอนเช้า คือ{name} ส่วน{partner}นอนกรนอยู่ในห้อง ไม่รู้ว่ามีคนงัดกระดานแผ่นที่สามแล้ว
  choices:
    - id: count_and_return
      label: นับเหรียญให้รู้ แล้ววางไหคืนใต้กระดานเหมือนเดิม
      text: |
        สามสิบเอ็ดเหรียญทองแดง สี่เหรียญเงิน {name}นับสองรอบ มัดเชือกคืนแบบเงื่อนเดิม ปิดกระดาน กดตะปูลงรูเดิม

        เดือนต่อมา{name}งัดดูอีก มีเพิ่มสามเหรียญ เดือนต่อไปเพิ่มสอง จากนั้นทุกต้นเดือน{name}มีงานลับของตัวเองหนึ่งอย่าง งานที่ทำเสร็จทุกครั้งแล้วต้องเกาะขอบเตาลุกขึ้นจากพื้น
      effects: { stats: { INT: 1 }, flags: [counted_the_back_jar] }
    - id: add_to_it
      label: หยอดเหรียญของตัวเองลงไปสองเหรียญ แล้ววางไหคืน
      text: |
        {name}หยอดเหรียญลงไปสองเหรียญ มัดเชือกคืน ปิดกระดานเงียบที่สุดเท่าที่ทำได้ ในห้อง{partner}ยังกรนเสียงเดิม

        เดือนต่อมา{name}แอบงัดดูอีกครั้ง รูปบนผ้าปิดปากไหมีเพิ่มมาอีกรูป คนก้มตัวงอเป็นตะขออีกคน ยืนข้างคนแรก ถ่านยังใหม่
      effects: { gold: -2, alignment: { moral: 1 }, flags: [added_to_the_back_jar] }
    - id: go_to_the_bonesetter_now
      label: เอาเงินในไหไปหาหมอดัดกระดูกเสียตั้งแต่ปีนี้
      text: |
        หมอดัดกระดูกกดหลัง{name}สามจุด จุดที่สามร้องลั่นจนหมาข้างบ้านเห่า หมอบอกว่ามาเร็วดีแล้ว อีกสองหน้าหนาวคงต้องหามมา ให้ยาทากับไม้ค้ำหลังเวลานั่งทำงาน คิดเงินไปเกือบครึ่งไห

        เย็นนั้น{partner}งัดกระดานเจอไหที่เบาลง ถือออกมาวางบนโต๊ะ ถามว่าปีนี้แล้วหรือ {name}บอกว่าปีนี้แล้ว {partner}เขียนคำว่าหลังบนผ้าปิดปากไหใหม่ ตัวเล็กลงกว่าเดิม
      effects: { stats: { CON: 1 }, flags: [spent_the_back_jar_early] }
    - id: ask_at_supper
      label: วางไหไว้บนโต๊ะกินข้าว แล้วรอดูว่า{partner}จะว่ายังไง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {partner}เห็นไหแล้ววางช้อน หัวเราะจนต้องเอามือปิดหน้า บอกว่าเก็บมาตั้งแต่เห็น{name}ลุกจากเตียงครั้งแรกแล้วร้องโอย แต่ไหนี้ไม่ได้มีใบเดียว ใต้ขั้นบันไดยังมีอีกใบ เขียนว่าฟัน

          คืนนั้นสองคนนั่งเปิดไหทุกใบในบ้าน ได้สี่ใบ ใบสุดท้ายอยู่ในหีบผ้า เขียนว่าศพ ไม่มีใครกล้านับ
        effects: { stats: { CHA: 1 }, flags: [found_the_four_jars] }
      failure:
        text: |
          {partner}เห็นไหแล้วเลิกคิ้ว บอกว่าไม่รู้ ไม่เคยเห็น หนูคงขนมา แล้วกินข้าวต่อ {name}ไม่ได้เถียง

          สัปดาห์ต่อมาไหหายไปจากใต้กระดานแผ่นที่สาม ค่ำหนึ่ง{name}ได้ยินเสียงงัดพื้นเบาๆ ดังมาจากอีกฝั่งของบ้าน ไหย้ายไปอยู่ที่ใหม่ หลัง{name}ยังงอเป็นตะขอทุกเช้าเหมือนเดิม
        effects: { flags: [the_back_jar_moved] }

- id: adult.fam_partner_kin_at_the_door
  stage: adult
  scene: home
  weight: 14
  when:
    age: [43, 60]
    flags: [has_partner]
  text: |
    {partner}กลับจากไปเยี่ยมบ้านเดิมพร้อมพี่ชายคนโต พี่ชายเดินช้า หอบทุกสิบก้าว ถือหีบไม้ใบเดียวที่ปะมุมด้วยแผ่นดีบุก ภรรยาของเขาไปตั้งแต่ต้นปี ลูกแยกไปคนละทิศ เจ้าของบ้านเก่าขึ้นค่าเช่า

    เขาไอทั้งคืนแรกที่นั่งอยู่ในครัว ไอแล้วขอโทษ ขอโทษแล้วไอ {partner}ต้มน้ำขิงให้ไม่หยุด ไม่ได้ขออะไรสักคำ แต่ห้องหลังบ้าน ห้องที่ใช้เก็บของ มีหน้าต่างหันรับแดดเช้า และ{partner}เปิดหน้าต่างบานนั้นไว้ตั้งแต่บ่าย
  choices:
    - id: clear_the_back_room
      label: ขนของออกจากห้องหลังบ้าน ปูที่นอนให้พี่ชาย
      text: |
        {name}ขนหีบ ขนกระสอบ ขนเก้าอี้ขาหักสามตัวที่ไม่มีใครจำได้ว่าเก็บไว้ทำไม จนห้องโล่งพอปูที่นอนได้หนึ่งผืน พี่ชายนั่งดูอยู่ที่ประตู บอกว่าเก้าอี้สามตัวนั้นยังซ่อมได้

        หน้าหนาวนั้นเขาซ่อมเก้าอี้ครบสามตัว ซ่อมรั้ว ซ่อมด้ามมีด ไอทุกคืนแต่เบาลง บ้านมีเสียงไอแทรกเสียงกรนจนกลายเป็นเสียงประจำบ้าน คืนไหนเงียบ {partner}ลุกไปดู
      effects: { stats: { STR: 1 }, flags: [partners_brother_moved_in] }
    - id: rent_near_the_healer
      label: จ่ายค่าเช่าห้องใกล้บ้านหมอยาให้เขาหนึ่งหน้าหนาว
      requires: { min_gold: 4 }
      text: |
        ห้องที่ได้อยู่ชั้นสองเหนือร้านขายสมุนไพร กลิ่นการบูรลอยขึ้นมาทั้งวัน หมอยาเดินขึ้นบันไดมาฟังปอดให้สัปดาห์ละครั้ง ไม่คิดเงินเพราะขี้เกียจให้คนไข้เดินลง

        {partner}แวะไปทุกเย็น หิ้วน้ำขิงไปหนึ่งกระบอก กลับมาเล่าว่าพี่ชายไอน้อยลง แต่บ่นเรื่องกลิ่นการบูรมากขึ้น ถ้าบ่นได้ก็แปลว่าหายใจได้
      effects: { gold: -4, alignment: { moral: 1 }, flags: [rented_a_room_for_partners_brother] }
    - id: until_the_thaw
      label: ตกลงกับพี่ชายตรงๆ ว่าอยู่ได้ถึงหน้าร้อน แล้วหางานที่นั่งทำได้ให้
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}พูดตรงๆ ตั้งแต่มื้อเช้าวันแรก พี่ชายฟังจบแล้วบอกว่าดี เขาไม่ชอบอยู่บ้านคนอื่นโดยไม่รู้ว่าเมื่อไรต้องออก {name}หางานสานตะกร้าจากร้านหัวถนนให้ทำ ได้ค่าแรงทีละตะกร้า

          พอหน้าร้อนเขาสานตะกร้าได้ร้อยกว่าใบ เก็บเงินพอเช่าห้องเอง ย้ายออกวันที่บอกไว้ไม่ขาดไม่เกิน วางตะกร้าใบหนึ่งไว้บนโต๊ะครัวก่อนไป ใบที่สานดีที่สุด
        effects: { stats: { CHA: 1 }, flags: [partners_brother_stayed_till_spring] }
      failure:
        text: |
          พี่ชายฟังแล้วไออยู่นาน พอหายไอก็ลืมว่า{name}พูดว่าอะไร หรือทำเป็นลืม งานสานตะกร้าเขาทำได้วันละครึ่งใบ ที่เหลือของวันนั่งบอก{name}ว่าหุงข้าวผิดวิธี

          หน้าร้อนมาแล้ว หน้าร้อนผ่านไปแล้ว หีบไม้ปะมุมดีบุกยังวางอยู่ปลายที่นอนในห้องหลังบ้าน มีผ้าคลุมกันฝุ่นให้ด้วย
        effects: { gold: -2, flags: [partners_brother_stayed_on] }
    - id: say_no
      label: บอก{partner}ตรงๆ ว่าบ้านนี้รับไม่ไหว
      text: |
        {partner}ปิดหน้าต่างห้องหลังบ้าน ปิดเองโดยไม่บ่น เช้าวันต่อมาพาพี่ชายข้ามถิ่นไปบ้านน้องสาวคนเล็ก บ้านที่มีลูกเจ็ดคนกับแพะสองตัว

        หลังจากนั้น{partner}ข้ามถิ่นไปทุกสามวัน หิ้วน้ำขิงไปหนึ่งกระบอก กลับมาตอนมืด ขิงในครัวหมดเร็วกว่าที่เคยหมดสามเท่า {name}ซื้อมาเติมโดยไม่ต้องมีใครขอ
      effects: { flags: [refused_partners_brother] }

- id: adult.fam_year_of_two_tables
  stage: adult
  scene: home
  weight: 12
  when:
    age: [42, 58]
    flags: [married, has_partner]
  text: |
    ปีนั้นกะงานของ{name}เปลี่ยน ของ{partner}ก็เปลี่ยน สวนทางกัน {name}ออกจากบ้านตอนฟ้ายังมืด {partner}กลับถึงบ้านตอนฟ้ามืดอีกรอบ ข้าวที่ต้มไว้ให้กันบางวันอุ่น บางวันเย็นชืด อยู่ใต้ฝาหม้อใบเดียวกัน

    สองคนคุยกันด้วยกระดาษที่เสียบไว้บนตะปูข้างประตู ต้นปีกระดาษเขียนเต็มหน้า ใครในถนนทะเลาะกับใคร ไก่บ้านไหนหลุด กลางปีเหลือสองบรรทัด ซื้อเกลือ ค่าน้ำมันตะเกียง ปลายปีเหลือคำเดียว เกลือ

    เช้านี้{name}ดึงกระดาษลงจากตะปู ใต้คำว่าเกลือมีอีกบรรทัดหนึ่ง เขียนแล้วขีดฆ่าจนดำทั้งบรรทัด
  choices:
    - id: change_my_shift
      label: ไปขอนายงานย้ายกะ แลกกับค่าแรงที่ลดลง
      text: |
        นายงานให้ย้ายได้ แต่กะใหม่ค่าแรงน้อยกว่าเดิมสามเหรียญต่อเดือน เย็นแรกที่สองคนกินข้าวพร้อมกัน ต่างคนต่างนั่งอยู่หน้าชาม ไม่รู้จะเริ่มเรื่องไหน จนแมวกระโดดขึ้นโต๊ะไปคาบปลา สองคนลุกไล่พร้อมกัน

        หลังจากนั้นกระดาษบนตะปูก็ไม่มีใครเขียนอีก ตะปูตัวนั้นใช้แขวนกุญแจแทน
      effects: { gold: -3, alignment: { moral: 1 }, flags: [changed_shift_for_the_table] }
    - id: write_a_long_note
      label: เขียนกระดาษเต็มหน้าเหมือนต้นปี แล้วเสียบไว้บนตะปู
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}เขียนเรื่องไก่บ้านหัวมุมที่ขึ้นไปนอนบนหลังคา เรื่องแม่ค้าปลาที่ขึ้นราคาแล้วโดนด่าทั้งตลาด เขียนจนหมดหน้า ไม่ได้ถามเรื่องบรรทัดที่ขีดฆ่า

          เช้าวันต่อมากระดาษบนตะปูมีสองแผ่น แผ่นของ{partner}ยาวกว่า เล่าว่าไก่ตัวนั้นลงจากหลังคาไม่ได้ ต้องเอาบันไดไปรับ ท้ายแผ่นเขียนว่า บรรทัดที่ขีดไป ช่างมันเถอะ
        effects: { stats: { WIS: 1 }, flags: [wrote_the_long_notes] }
      failure:
        text: |
          {name}เขียนเต็มหน้า เขียนดีกว่าทุกแผ่นที่เคยเขียน แล้วถามท้ายแผ่นตรงๆ ว่าบรรทัดที่ขีดฆ่านั้นเขียนว่าอะไร

          เช้าวันต่อมากระดาษบนตะปูมีแผ่นเดียว เขียนว่าเกลือ ต่อจากนั้นไม่มีอะไรอีก {name}ไปซื้อเกลือมาสองถุง วางไว้บนโต๊ะทั้งสองถุง
        effects: { flags: [wrote_the_long_notes, came_near_to_parting] }
    - id: wake_at_midnight
      label: ตื่นกลางดึกวันละครั้ง ลุกมากินข้าวมื้อดึกกับ{partner}
      check: { stat: CON, dc: 14 }
      success:
        text: |
          {name}ผูกเชือกที่ข้อเท้าตัวเองกับขาเตียง ให้{partner}กระตุกปลุกตอนกลับถึงบ้าน สองคนกินข้าวต้มอุ่นๆ ในครัวที่มีตะเกียงดวงเดียว คุยกันเบาๆ เหมือนกลัวบ้านข้างๆ จะตื่น

          เกือบทั้งปีเป็นแบบนั้น ครึ่งชั่วยามทุกคืน {name}หาวทั้งวัน {partner}เลิกขีดฆ่าบรรทัดไหนบนกระดาษอีก เพราะไม่ต้องเขียนแล้ว
        effects: { stats: { CON: 1 }, flags: [shared_the_midnight_meal] }
      failure:
        text: |
          ผ่านไปสองสัปดาห์ {name}หลับคางานตอนบ่าย นายงานหักค่าแรงครึ่งวัน กลับบ้านมาก็หงุดหงิด กลางดึกนั้นนั่งกินข้าวกับ{partner} แล้วทะเลาะกันเรื่องฝาหม้อที่ปิดไม่สนิท ทะเลาะกันดังจนบ้านข้างๆ เคาะผนัง

          เช้ามากระดาษบนตะปูว่างเปล่า สองคนไม่ได้เขียนอะไรถึงกันอีกจนกะงานเปลี่ยนกลับ
        effects: { hp: -1, flags: [shared_the_midnight_meal, came_near_to_parting] }
    - id: let_the_year_run
      label: ปล่อยให้ปีนี้ผ่านไปเอง เดี๋ยวกะก็เปลี่ยนอีก
      text: |
        กะเปลี่ยนกลับในปีต่อมาตามที่คิด เย็นแรกสองคนนั่งกินข้าวพร้อมกันที่โต๊ะ กินจนหมดชามแล้วต่างคนต่างล้างชามของตัวเอง เย็นที่สองก็เหมือนกัน

        บรรทัดที่ขีดฆ่าบนกระดาษแผ่นนั้น{name}ไม่เคยถาม {partner}ก็ไม่เคยบอก กระดาษแผ่นนั้นไปอยู่ในเตาตั้งแต่เช้าวันที่อ่าน
      effects: { flags: [let_the_two_tables_year_run, came_near_to_parting] }

- id: adult.fam_plain_evening
  stage: adult
  scene: home
  weight: 14
  when:
    age: [48, 62]
    flags: [has_partner]
  text: |
    ทุกคืนก่อนนอน{partner}ลงกลอนหน้าต่าง แล้ว{name}เดินตามไปเปิดกลอนออก ลงใหม่ให้แน่นกว่าเดิม ทำแบบนี้มาตั้งแต่ปีแรกที่อยู่ด้วยกัน หลายปีหลัง{partner}รู้แล้วว่า{name}จะตามมาลงใหม่ เลยลงไว้หลวมๆ ประหยัดแรง

    เรื่องน้ำผึ้งก็เป็นแบบเดียวกัน ปีแรก กระปุกน้ำผึ้งบนชั้นหมดไปในคืนเดียว ไม่มีใครยอมรับว่าเป็นคนกิน ตั้งแต่นั้นทุกครั้งที่น้ำผึ้งในบ้านหมด คนหนึ่งจะพูดขึ้นมาว่าปีแรก อีกคนต้องตอบว่าไม่ใช่ฉัน คืนนี้กระปุกหมดอีกแล้ว

    ข้างนอกฝนตกปรอย ไม่มีแขก ไม่มีงานค้าง {partner}นั่งปอกหอมเตรียมไว้ทำกับข้าวพรุ่งนี้ ฮัมเสียงสามเสียงเดิมที่ฮัมทุกครั้งที่ปอกหอม
  choices:
    - id: confess_the_honey
      label: สารภาพเรื่องน้ำผึ้งปีแรก
      text: |
        {partner}วางมีดปอกหอม บอกว่าเป็นไปไม่ได้ เพราะคนกินคือ{partner}เอง กินตอนดึกที่{name}หลับ กินจนหมดแล้วเอาน้ำล้างกระปุกดื่มต่อ {name}เถียงว่าคนกินคือ{name} กินตอนเช้ามืด กินจนต้องเลียนิ้ว

        เถียงกันจนหอมปอกไม่เสร็จ ตั้งแต่คืนนั้นทุกครั้งที่น้ำผึ้งหมด คนหนึ่งพูดว่าปีแรก อีกคนตอบว่าฉันเอง แล้วเถียงต่อกันว่าใครเป็นคนกินจริง กระปุกในปีแรกนั้นหมดสองรอบในเรื่องเล่าของบ้านนี้
      effects: { alignment: { law: -1 }, flags: [confessed_to_the_honey] }
    - id: leave_the_latch
      label: คืนนี้ปล่อยกลอนหน้าต่างไว้ตามที่{partner}ลง ไม่ลุกไปลงใหม่
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          {name}นอนฟังเสียงลมโยกบานหน้าต่างกระทบกลอนหลวมทั้งคืน ไม่ลุก นับเสียงกระทบไปจนหลับตอนเสียงที่สองร้อยกว่า

          เช้ามากลอนหน้าต่างลงแน่นสนิท แน่นกว่าที่{name}เคยลงเอง {partner}ล้างหน้าอยู่ที่โอ่ง บอกว่ากลางดึกลุกมาลงให้ใหม่ เพราะไม่มีเสียง{name}เดินไปลงกลอนแล้วนอนไม่หลับ
        effects: { stats: { WIS: 1 }, flags: [left_the_latch_alone] }
      failure:
        text: |
          ตอนดึก{name}ลุกเงียบที่สุดเท่าที่เข่าจะยอม ย่องไปที่หน้าต่าง เอื้อมมือไปในความมืดหากลอน มือไปแตะมือ{partner}ที่อยู่บนกลอนก่อนแล้ว

          {partner}บอกว่าลุกมาดูว่าคืนนี้{name}จะทนได้ไหม ต่างคนต่างไม่ยอมปล่อยมือจากกลอน ลงกลอนพร้อมกันสองมือ กลอนติดแน่นจนเช้าต้องเอาค้อนเคาะ
        effects: { flags: [got_up_for_the_latch] }
    - id: ask_about_the_humming
      label: ถามว่าเสียงสามเสียงที่ฮัมตอนปอกหอมคือเพลงอะไร
      text: |
        {partner}บอกว่าไม่ได้ฮัม {name}ฮัมให้ฟัง {partner}บอกว่าไม่ใช่ แล้วฮัมแก้ให้ถูก เป็นเสียงเดียวกันทุกเสียง แล้วหยุด ไม่รู้ว่าเพลงอะไร ไม่รู้ว่าได้มาจากไหน ไม่รู้ว่าฮัมมาตั้งแต่เมื่อไร

        ที่เหลือของคืนนั้น{partner}ปอกหอมเงียบๆ เกร็งปากไว้ไม่ให้ฮัม ปอกได้สามหัว หัวที่สี่เสียงสามเสียงนั้นออกมาเอง {name}นับในใจ หัวที่ห้าก็ออกมาอีก
      effects: { alignment: { moral: 1 }, flags: [asked_about_the_humming] }
    - id: light_the_wedding_bowl
      label: ยกชามไฟวันแต่งงานลงมาจุด โดยไม่มีเหตุอะไร
      requires: { item: wedding_clay_bowl }
      text: |
        ชามดินเผาใบนั้นอยู่บนชั้นสูงสุด ฝุ่นจับหนาเท่าเล็บ {name}เช็ดฝุ่น เติมน้ำมัน จุดไส้ วางกลางโต๊ะ {partner}เงยหน้าจากหอมถามว่าวันอะไร {name}บอกว่าวันน้ำผึ้งหมด

        สองคนกินข้าวเย็นกันใต้แสงชามไฟ ควันน้ำมันเหม็นกว่าที่จำได้ ชามก็ใบเล็กกว่าที่จำได้ {partner}บอกว่าวันนั้นทำไมหนักนัก {name}บอกว่าวันนั้นมือสั่น
      effects: { flags: [lit_the_wedding_bowl_again] }

- id: adult.fam_father_stops_work
  stage: adult
  scene: home
  weight: 12
  cast:
    dad: { id: father, min_age: 58 }
  when:
    age: [36, 58]
    not_flags: [father_away, father_lost, origin_marked_hidden]
  text: |
    มีดทุกเล่มในครัวของ{dad}ทื่อ มีดหั่นผักกดลงบนมะเขือเทศแล้วผิวมะเขือเทศแค่บุบ หินลับมีดก้อนที่วางไว้บนขอบโอ่งแห้งสนิท ผิวหินขึ้นฝ้า

    หินก้อนนี้{dad}ลับมีดทุกเย็นตั้งแต่{name}จำความได้ ลับไปเล่าเรื่องไป เรื่องเดิมสามเรื่องสลับกัน ตอนนี้มือของ{dad}ยังใหญ่ แต่นิ้วชี้กับนิ้วกลางงอไม่เข้าหากัน จับด้ามมีดได้ จับให้ตรงไม่ได้ ใครถาม{dad}บอกว่ามีดยังคมพอ คนสมัยนี้ใจร้อนเอง

    มื้อเย็นวันนั้น{dad}หั่นเนื้อไม่ขาด ดึงจนเนื้อหลุดจากจาน แล้วบอกว่าเนื้อร้านนี้เหนียว
  choices:
    - id: sharpen_while_he_watches
      label: หยิบหินมาลับมีดเองตรงหน้า{dad} ให้เขาติไปทุกเล่ม
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}จุ่มหินลงโอ่ง ลับมีดเล่มแรก {dad}บอกว่าเอียงเกิน เล่มที่สองบอกว่าเร็วเกิน เล่มที่สามบอกว่าจับหินผิดมือ เล่มที่สี่ไม่ได้ติ ยื่นนิ้วโป้งมาลูบคมแล้วบอกว่าพอใช้

          ตั้งแต่นั้นทุกเย็นวันพักงาน{name}มานั่งลับมีดที่ขอบโอ่ง {dad}นั่งเก้าอี้ข้างๆ เล่าเรื่องเดิมสามเรื่องสลับกัน ติทุกเล่มเหมือนเดิม
        effects: { stats: { DEX: 1 }, flags: [sharpened_fathers_knives] }
      failure:
        text: |
          มีดเล่มที่สองลื่นจากหิน บาดสันมือ{name}เป็นแผลยาวเท่านิ้วก้อย {dad}คว้าผ้ามากดแผลให้ทันที นิ้วที่งอไม่เข้ากันกดได้แน่นกว่าที่คิด แล้วบ่นว่าสอนมาตั้งแต่เด็กยังจับหินไม่เป็น

          {dad}ลับมีดที่เหลือเอง ช้า เบี้ยว ทีละเล่ม {name}นั่งกดแผลดูอยู่ข้างๆ มีดคมไม่เท่าเดิม แต่หั่นมะเขือเทศขาด
        effects: { hp: -1, flags: [sharpened_fathers_knives] }
    - id: say_it_plainly
      label: บอก{dad}ตรงๆ ว่ามือเขาไม่เหมือนเดิมแล้ว
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}พูดตอนล้างจาน หันหลังให้กัน ไม่ต้องมองหน้า {dad}เงียบไปนาน แล้วถามว่าเห็นตั้งแต่เมื่อไร {name}บอกว่าตั้งแต่มะเขือเทศ {dad}หัวเราะในคอ บอกว่ามะเขือเทศมันฟ้อง

          วันรุ่งขึ้น{dad}ยกหินลับมีดให้{name}ห่อผ้ากลับบ้านไป บอกว่าเอาไปใช้ แล้ววันพักงานเอามีดมาลับที่นี่ให้ดูด้วย จะได้รู้ว่าหินยังทำงานอยู่
        effects: { stats: { CHA: 1 }, flags: [told_father_about_his_hands] }
      failure:
        text: |
          {dad}ฟังจบแล้ววางจานลงแรงจนบิ่น บอกว่ามือเขายังเลี้ยงคนทั้งบ้านมาได้ ไม่ต้องให้ใครมาบอกว่าเหมือนเดิมหรือไม่เหมือน แล้วเดินออกไปนั่งหน้าบ้านจนมืด

          สัปดาห์ต่อมา{name}มาเยี่ยม มีดทุกเล่มในครัวคมกริบ ไม่มีใครบอกว่าใครลับ หินลับมีดบนขอบโอ่งยังเปียก
        effects: { flags: [told_father_about_his_hands, father_took_it_badly] }
    - id: take_the_plough
      label: ชวน{dad}ออกไปไถแปลงหลังบ้านด้วยกัน ให้เขาเดินนำวัว ส่วนตัวเองจับคันไถ
      requires: { flag: origin_farm }
      text: |
        {dad}จับคันไถมาทั้งชีวิต ปีนี้ยกคันไถขึ้นได้ แต่กดลงไม่ถึงดิน {name}ไม่ได้ขอ ยืนจับคันไถไว้เฉยๆ {dad}เดินไปจูงเชือกวัวเอง บอกว่าวัวตัวนี้ไม่ฟังใครนอกจากเขา

        ไถกันจนหมดแปลง ร่องเบี้ยวทุกร่องเพราะวัวเดินตามเสียงบ่นไม่ใช่ตามเชือก ตกเย็น{dad}ยืนดูร่องเบี้ยวทั้งแปลงจากริมรั้ว แล้วบอกว่าปีหน้าค่อยไถให้ตรง
      effects: { stats: { STR: 1 }, flags: [ploughed_with_father] }
    - id: lighter_hammer
      label: ตีค้อนเล่มใหม่ให้{dad} หัวเล็กกว่าเดิมครึ่งหนึ่ง แขวนไว้ในราวแทนเล่มเก่า
      requires: { flag: origin_dwarf_clan }
      text: |
        ค้อนเล่มเก่าของ{dad}หนักขนาดที่{name}ตอนเด็กยกไม่ขึ้น ปีนี้{dad}ยกได้แค่ระดับเอว {name}ตีค้อนเล่มใหม่ หัวเล็กครึ่งหนึ่ง ด้ามยาวขึ้นหนึ่งฝ่ามือ สลักเครื่องหมายตระกูลไว้ที่โคนด้ามแบบเดียวกับเล่มเก่า แล้วแขวนสลับที่ตอนเขาไม่อยู่

        {dad}กลับมาเห็นแล้วด่าอยู่ครึ่งวันว่าใครมายุ่งกับราวของเขา บ่ายนั้นมีเสียงค้อนดังจากห้องตีเหล็กเป็นจังหวะช้าๆ ไม่หยุดจนตะวันตก ค้อนเล่มเก่าวางพาดอยู่บนตักของเขาตอนกินข้าวเย็น
      effects: { stats: { STR: 1 }, flags: [forged_father_a_lighter_hammer] }

- id: adult.fam_mother_gives_things_away
  stage: adult
  scene: home
  weight: 12
  cast:
    mom: { id: mother, min_age: 60 }
  when:
    age: [38, 60]
    not_flags: [origin_marked_hidden]
  text: |
    หม้อทองเหลืองใบใหญ่ของ{mom}ไปอยู่ที่บ้านคนหาบน้ำ ผ้าคลุมไหล่หน้าหนาวไปอยู่บนไหล่เด็กสาวที่บ่อน้ำ เก้าอี้ตัวที่{mom}นั่งทุกเย็นไปอยู่หน้าร้านตัดผม คนตัดผมเอาไว้ให้ลูกค้านั่งรอ

    {name}ถามว่าทำไม {mom}บอกว่าของพวกนี้วันหนึ่งก็ต้องไปอยู่กับใครสักคน ไปตอนนี้ดีกว่า จะได้เห็นเองว่าใครได้ไป ได้ไปแล้วใช้ยังไง คนหาบน้ำเอาหม้อทองเหลืองไปต้มน้ำร้อนขาย {mom}เดินไปซื้อมาดื่มทุกเช้า บอกว่าน้ำต้มหม้อนี้หวานกว่าที่อื่น

    เช้านี้{mom}ยืนอยู่หน้าหีบไม้ใบที่อยู่ปลายเตียงมาตลอดชีวิตของ{name} ฝาหีบเปิดอยู่ ข้างในพับผ้าไว้เป็นกองๆ แต่ละกองมีเศษกระดาษเขียนชื่อคนวางอยู่ข้างบน
  choices:
    - id: ask_for_one_thing
      label: ขอของจาก{mom}หนึ่งอย่าง ก่อนกองไหนจะมีชื่อคนอื่น
      text: |
        {name}ชี้ทัพพีไม้ด้ามดำที่แขวนอยู่ข้างเตา ทัพพีที่{mom}ใช้ตีมือ{name}ตอนเด็กแอบจิ้มแกง {mom}ยกให้ทันที แล้วบอกว่าเลือกของถูก ด้ามนี้เปลี่ยนมาสามด้ามแล้ว หัวยังเป็นหัวเดิม

        เศษกระดาษบนกองผ้ากองหนึ่งในหีบ{mom}ขีดชื่อทิ้ง เขียนชื่อ{name}ลงไปแทน แล้วปิดฝาหีบ บอกว่ากองนี้ยังไม่ได้ ไว้ทีหลัง
      effects: { alignment: { moral: 1 }, flags: [asked_mother_for_the_ladle] }
    - id: buy_back_the_shawl
      label: ไปขอซื้อผ้าคลุมไหล่คืนจากเด็กสาวที่บ่อน้ำ
      text: |
        เด็กสาวคนนั้นยอมขายคืนสองเหรียญ ลังเลอยู่นาน ผ้าคลุมผืนนั้นอุ่นกว่าเสื้อทุกตัวที่เธอมี {name}ถือผ้ากลับมาวางบนเตียงของ{mom}

        {mom}คลี่ผ้าออกดู พับกลับ แล้วบอกว่าคืนให้เด็กคนนั้นไป ถ้าจะซื้ออะไรคืน ไปซื้อผ้าคลุมผืนใหม่ให้เด็กมันดีกว่า เพราะผืนนี้แม่ให้ไปแล้ว ไม่ได้ให้ยืม {name}เดินกลับไปที่บ่อน้ำอีกรอบ ถือผ้าผืนเดิม
      effects: { gold: -2, flags: [bought_back_mothers_shawl] }
    - id: carry_for_her
      label: ช่วย{mom}แบกของไปส่งตามชื่อบนกระดาษทุกกอง
      text: |
        กองแรกไปบ้านหมอตำแย กองที่สองไปร้านซ่อมรองเท้า กองที่สามไปบ้านผู้หญิงที่{name}ไม่เคยเห็นหน้า {mom}บอกว่าเคยแย่งผู้ชายคนเดียวกันตอนสาว ตอนนี้เป็นเพื่อนกันแล้ว ผู้ชายคนนั้นไปแต่งกับคนที่สาม

        แบกจนครบทุกกองก็ตกเย็น หลัง{name}ปวดจนต้องนั่งพักกลางทาง {mom}เดินนำไปไกลแล้ว หันกลับมาบอกว่าคนแบกของยังอายุน้อยกว่าคนให้ของตั้งเยอะ
      effects: { stats: { STR: 1 }, flags: [carried_mothers_gifts] }
    - id: ask_her_why
      label: นั่งลงข้างหีบ ถาม{mom}ตรงๆ ว่าทำไมต้องรีบให้
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {mom}นั่งลงบนขอบเตียง บอกว่าไม่ได้รีบ ของมันเยอะ คนตายไปแล้วลูกหลานต้องมาแบ่งกันทะเลาะกัน ทะเลาะเรื่องหม้อ เรื่องผ้า เรื่องเก้าอี้ แม่เห็นมาหลายบ้านแล้ว บ้านนี้จะไม่มีเรื่องให้ทะเลาะ

          แล้ว{mom}ก็หยิบเศษกระดาษบนกองผ้ากองล่างสุดให้ดู กระดาษเขียนว่าเก็บไว้ ไม่ให้ใคร {mom}บอกว่ากองนี้ของแม่เอง ใครมาถามก็บอกว่าแม่สั่งไว้
        effects: { stats: { CHA: 1 }, flags: [asked_mother_why_she_gives] }
      failure:
        text: |
          {mom}ฟังแล้วตีหลังมือ{name}เบาๆ บอกว่าถามมาก แล้วหันไปหยิบแจกันดินเผาลายดอกบัวสีส้มใบใหญ่จากบนหีบมายัดใส่มือ{name} แจกันที่ทั้งบ้านเกลียดมาตั้งแต่{name}ยังเด็ก

          {mom}บอกว่าชิ้นนี้ไม่มีชื่อใครเพราะไม่มีใครอยากได้ ให้{name}ไปก็แล้วกัน {name}ถือแจกันกลับบ้าน ใบใหญ่จนต้องกอดด้วยสองแขน
        effects: { flags: [asked_mother_why_she_gives, got_the_ugly_vase] }
