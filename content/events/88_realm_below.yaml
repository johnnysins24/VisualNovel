# ชุด อ อาณาจักรจากข้างล่าง 6 เรื่อง กับเรื่องที่ราชสำนักตามล่า 2 เรื่อง
# หกเรื่องแรกสำหรับคนธรรมดาในสามแดนของอาร์เวล ไม่อยู่ในสายงานของอาณาจักร อายุ 20 ถึง 64 น้ำหนัก 22 เกิดครั้งเดียว
#   ค่าอาณาจักรต่ำค่าละสองเรื่อง อ่านอย่างเดียว ไม่ขยับ และไม่บอกเหตุผลจากชั้นบน คนข้างล่างเห็นแค่สิ่งที่มาถึงหัวซอย
#   บัลลังก์ต่ำสองเรื่องเอ่ยถึงสองตรา จึงกัน year: [318, 410] · คลังต่ำกับความสงบต่ำไม่ผูกปี ไม่เอ่ยถึงกษัตริย์หรือตรา
#   ไม่เขียนถึงประตู ห้อง หรือเพื่อนบ้านของตัวละคร (คนในเมืองที่ยังไม่มีที่อยู่มีจริง) เรื่องเกิดที่บ่อน้ำ หัวซอย ตลาด และทาง
#   ฝืนราชสำนัก (hunted: { crown: 1 }) สามทาง: ไม่จ่ายโต๊ะภาษีตัวที่สอง · ซ่อนเด็กหนุ่มคนขับเกวียน · ซ่อนคนจากใบเกณฑ์
# เรื่องตามล่า: ชื่อบนเสาประกาศ (กันสามแดนของอาร์เวล เพราะแดนเถ้าไม่มีศาลาอำเภอ) · คนรับจ้างถือหมาย (การปะทะ ไม่ผูกที่ ไม่เอาถึงตาย)
#   ทางที่ลดภัยตามล่า: ค่าปรับ กองซ่อมทางหนึ่งฤดู ปากกาของเสมียน และห้องขังกับค่าปรับเมื่อแพ้

# ---------- บัลลังก์ต่ำ ก โต๊ะภาษีตัวที่สอง ----------
- id: adult.realm_arvel_second_tax_table
  stage: adult
  weight: 22
  when:
    age: [20, 64]
    location_tag: [arvel_village, ventras, kardin]
    not_orgs: [crown_office, crown_army, crown_court]
    year: [318, 410]
    not_flags: [throne_white, throne_grey]
    world: { throne: [-8, -2] }
  text: |
    ต้นฤดู คนเก็บภาษีเตามาตามรอบ เสมียนหนุ่มหนึ่งคน ทหารสองคน กับโต๊ะพับหนึ่งตัวที่ตั้งข้างบ่อน้ำหัวซอย เขาเรียกชื่อตามสมุดเตา ใครจ่ายแล้วได้ใบรับหนึ่งแผ่น มุมใบรับประทับตราขาวรูปตะเกียงแขวน คนในซอยพับใบรับเก็บไว้กับของสำคัญ ใต้หมอนบ้าง ในกระปุกเกลือบ้าง ในรองเท้าคู่ดีที่ไม่ค่อยได้ใส่บ้าง

    ฤดูยังไม่ทันหมด โต๊ะพับตัวที่สองก็มาตั้งข้างบ่อน้ำเดิม เสมียนเป็นหญิงสูงวัย สวมแว่นที่ขาข้างหนึ่งพันด้าย คนคุ้มกันเป็นชายรับจ้างคนเดียว ถือกระบองแทนหอก นางเปิดสมุดเตาที่หน้าตาเหมือนเล่มแรกทุกอย่าง แล้วเรียกชื่อตั้งแต่บรรทัดแรก ใบรับของนางประทับตราเทารูปตาชั่งคล้องโซ่

    คนแรกที่โดนเรียกยื่นใบรับตราขาวให้ดู นางอ่านแล้ววางคืนบนโต๊ะ บอกว่ากระดาษที่มีตราเดียวใช้ไม่ได้ ข้อนี้ทุกคนรู้ ใบของท่านก็มีตราเดียว คนแรกว่า นางบอกว่าใช่ แล้วเรียกชื่อถัดไป ชื่อของ{name}อยู่บรรทัดที่เจ็ด
  choices:
    - id: pay_twice
      label: จ่ายอีกสองเหรียญ รับใบรับตราเทามาอีกใบ
      requires: { min_gold: 2 }
      text: |
        นางนับเหรียญ ประทับตรา ยื่นใบรับมาให้ ตราเทาประทับเอียงไปทางมุมซ้าย ตราขาวในใบแรกอยู่มุมขวา คืนนั้น{name}เอาใบรับสองใบมาวางซ้อนกันส่องกับตะเกียง ตราสองสีอยู่คนละมุม ไม่ทับกันสักนิด

        ปลายฤดู คนที่จ่ายสองรอบเอาใบรับมาเย็บติดกันเป็นคู่ด้วยด้ายเย็บกระสอบ ทั้งซอยมีกระดาษคู่แบบนี้สามสิบกว่าคู่ ไม่มีคู่ไหนใช้ได้สักคู่
      effects: { gold: -2, alignment: { law: 1 }, flags: [paid_the_second_tax_table] }
    - id: refuse_the_second
      label: ยื่นใบรับตราขาวให้ดู บอกว่าจ่ายไปแล้วรอบหนึ่ง ไม่จ่ายซ้ำ
      text: |
        หญิงเสมียนไม่เถียง นางพลิกสมุดไปหน้าหลังสุด เขียนชื่อ{name}ไว้ใต้หัวข้อที่เขียนรอไว้ก่อนมาถึงซอยนี้ ค้างหลวง ชายถือกระบองพิจารณาหน้า{name}ทีละส่วน เหมือนคนจำทาง

        หลัง{name} คนในแถวอีกสี่คนก็ไม่จ่าย ปลายเดือนกระดาษแผ่นใหม่ขึ้นเสาประกาศหน้าศาลาอำเภอ ห้าชื่อเรียงกัน ชื่อ{name}อยู่บนสุด
      effects: { alignment: { law: -1 }, hunted: { crown: 1 }, flags: [refused_the_second_tax_table] }
    - id: ask_for_both_seals
      label: ขอให้นางประทับตราเทาลงบนใบรับตราขาวใบเดิม กระดาษที่มีสองตราใช้ได้ ข้อนี้ทุกคนรู้
      check: { stat: INT, dc: 13 }
      success:
        text: |
          นางบอกว่านางมาเก็บเงิน ไม่ได้มาประทับตราให้กระดาษของคนอื่น {name}ถามว่านางจะหอบกระดาษตราเดียวกลับไปกี่แผ่น แล้วกระดาษพวกนั้นจะใช้ได้ที่ไหน นางนิ่งไปจนชายถือกระบองต้องกระแอม

          นางประทับตราเทาลงบนใบรับของ{name} มุมตรงข้ามกับตราขาว แล้วประทับให้คนถัดไปที่ยื่นใบตราขาวมาอีกสามคน พอถึงคนที่สี่ นางปิดตลับหมึก บอกว่าหมึกหมดแล้ว
        effects: { stats: { INT: 1 }, flags: [got_both_seals_on_one_receipt] }
      failure:
        text: |
          นางบอกว่านางไม่ได้มาประทับตราให้กระดาษของคนอื่น แล้วเรียกชื่อถัดไป {name}ยืนถือใบรับอยู่หน้าโต๊ะ จนชายถือกระบองเอาปลายกระบองเขี่ยไหล่ให้หลีก

          ตอนนางเก็บโต๊ะ ชื่อของ{name}ในสมุดมีวงดินสอล้อมไว้ ข้างวงเขียนว่ายังไม่จ่าย
        effects: { flags: [argued_with_the_grey_clerk] }

# ---------- บัลลังก์ต่ำ ข ใบตัดสินสองตรา ----------
- id: adult.realm_arvel_two_judgements
  stage: adult
  weight: 22
  when:
    age: [20, 64]
    location_tag: [arvel_village, ventras, kardin]
    not_orgs: [crown_office, crown_army, crown_court]
    year: [318, 410]
    not_flags: [throne_white, throne_grey]
    world: { throne: [-8, -2] }
  text: |
    ใบตัดสินในกรอบไม้แขวนอยู่ที่เพิงขายถั่วต้มหัวซอยมาสามสัปดาห์แล้ว ลูกชายของแม่ค้าถั่วต้มเป็นคนขับเกวียนรับจ้าง เขาโดนจับเมื่อต้นเดือน ข้อหาทำกระสอบน้ำตาลของโกดังท่าเรือหายไปสามกระสอบระหว่างทาง ศาลตัดสินว่าเขาไม่ผิด กระสอบหายไปตั้งแต่ก่อนขึ้นเกวียน กระดาษแผ่นนั้นประทับตราขาวรูปตะเกียงแขวน แม่ของเขาแขวนไว้ให้ทุกคนที่มาซื้อถั่วได้อ่าน

    เช้านี้คนถือหมายของอำเภอมายืนหน้าเพิง ในมือมีกระดาษอีกแผ่น ตราเทารูปตาชั่งคล้องโซ่ ความว่าเด็กหนุ่มต้องใช้ค่าน้ำตาลสามกระสอบ ระหว่างยังไม่ใช้ให้อยู่ในห้องขังของอำเภอ คนถือหมายอ่านจบแล้วพับกระดาษ เขาไม่เงยดูกรอบไม้ที่แขวนอยู่เหนือหัว เขารู้ว่าในนั้นเขียนว่าอะไร

    เด็กหนุ่มยืนอยู่หลังหม้อถั่ว แม่ของเขายืนขวางหน้าหม้อ คนในซอยออกมายืนดูสองฟากทาง {name}ยืนใกล้พอให้เด็กหนุ่มหันมาหา เขาไม่ได้หันไปหาแม่ เขาหันมาหา{name}
  choices:
    - id: hide_the_carter
      label: ดึงเด็กหนุ่มออกทางหลังเพิง ไปซ่อนใต้ฟางในเกวียนที่จอดรอออกเดินทางตอนสาย
      text: |
        ทั้งสองลอดออกหลังเพิงระหว่างที่คนถือหมายยังเถียงกับแม่ค้า {name}กดเขาลงใต้ฟาง โกยฟางทับจนมิดหัว คนขับเกวียนเห็นแต่ไม่ถาม ตอนสายเกวียนออก ล้อเอียดผ่านหน้าเพิงถั่วต้ม คนถือหมายถอยหลบให้ทาง

        ตกเย็นคนถือหมายมาเจอ{name}ที่บ่อน้ำ เขาไม่พูดเรื่องเด็กหนุ่มสักคำ เขาถามชื่อเต็มของ{name} แล้วจดลงหลังกระดาษตราเทาแผ่นนั้น
      effects: { alignment: { moral: 1 }, hunted: { crown: 1 }, flags: [hid_the_carters_boy] }
    - id: read_both_aloud
      label: ปลดกรอบไม้ลงมา อ่านกระดาษทั้งสองแผ่นออกเสียงให้คนทั้งซอยฟัง แผ่นละตรา
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}อ่านใบตราขาวก่อน แล้วขอใบตราเทาจากมือคนถือหมายมาอ่านต่อ เขายื่นให้ คนทั้งซอยได้ยินครบทั้งสองแผ่น กระดาษแผ่นละตรา ตามธรรมเนียมใช้ไม่ได้ทั้งคู่ {name}ถามคนถือหมายว่าเขาจะใช้แผ่นไหน

          คนถือหมายรับกระดาษคืน พับใส่อกเสื้อ บอกว่าจะกลับไปถามอำเภอ เดือนนั้นเขาไม่กลับมาอีก เด็กหนุ่มขับเกวียนต่อทุกวัน แต่ไม่รับขนของจากท่าเรืออีกเลย
        effects: { stats: { CHA: 1 }, flags: [read_both_seals_aloud] }
      failure:
        text: |
          {name}อ่านใบตราขาวจบ ยังไม่ทันขอใบตราเทา คนถือหมายก็คล้องเชือกที่ข้อมือเด็กหนุ่มแล้ว เขาบอกว่าเขาอ่านหนังสือออกเหมือนกัน และค่าจ้างของเขามาจากแผ่นที่อยู่ในมือเขา

          เด็กหนุ่มเดินตามเชือกไปทางศาลาอำเภอ แม่ของเขาปลดกรอบไม้ลงมา เดินตามหลังห่างสิบก้าว กอดกรอบไว้กับอก
        effects: { flags: [read_too_slow_for_the_bailiff] }
    - id: pass_the_hat
      label: บอกเด็กหนุ่มให้ไปกับคนถือหมาย แล้วรับปากแม่เขาว่าจะเรี่ยไรค่าน้ำตาล
      text: |
        เด็กหนุ่มก้าวออกมาจากหลังหม้อเอง ยื่นข้อมือให้ผูก คนถือหมายผูกหลวมๆ แค่ให้ครบตามหมาย {name}ถือหมวกเดินขอเงินไปตามซอย ได้เศษเหรียญครึ่งหมวก

        ค่าน้ำตาลสามกระสอบเท่ากับเงินสามหมวก เด็กหนุ่มออกจากห้องขังตอนปลายฤดู ผอมลงจนต้องเจาะรูเข็มขัดใหม่ สองรู
      effects: { alignment: { law: 1 }, flags: [passed_the_hat_for_the_carter] }
    - id: pay_for_the_sugar
      label: จ่ายค่าน้ำตาลสามกระสอบให้คนถือหมายเดี๋ยวนั้น ห้าเหรียญ
      requires: { min_gold: 5 }
      text: |
        คนถือหมายนับเหรียญสองรอบ เขียนใบรับให้ด้วยลายมือตัวเอง ไม่มีตรา เขาบอกว่าตราอยู่ที่อำเภอ จะประทับให้ทีหลัง แล้วเดินกลับไปโดยไม่ได้แตะตัวเด็กหนุ่ม

        เดือนต่อมาใบรับยังไม่ได้ประทับตรา แม่ค้าถั่วต้มเอาไปใส่กรอบไม้อีกกรอบ แขวนไว้ข้างใบตัดสินตราขาว ใบละกรอบ
      effects: { gold: -5, alignment: { moral: 1 }, flags: [paid_for_the_sugar_sacks] }

# ---------- คลังต่ำ ก คนนับเตานอกปี ----------
- id: adult.realm_arvel_counter_out_of_season
  stage: adult
  weight: 22
  time: night
  when:
    age: [20, 64]
    location_tag: [arvel_village, ventras, kardin]
    not_orgs: [crown_office, crown_army, crown_court]
    world: { treasury: [-8, -2] }
  text: |
    ปีนี้ไม่ใช่ปีนับเตา คนที่นี่จำปีนับเตาครั้งก่อนได้แม่น ใครลืมดับไฟก่อนสางแล้วโดนนับเกินไปหนึ่งเตา ใครดับไฟแล้วนั่งหนาวจนตะวันขึ้น เรื่องพวกนั้นยังเล่ากันในร้านเหล้าไม่จบ

    เย็นวานคนนับเตามาถึงโดยไม่มีใครบอกล่วงหน้า เป็นเสมียนหนุ่มหน้าซีดจากที่ไหนสักแห่ง สมุดเตาในย่ามยังใหม่ สันสมุดเพิ่งเย็บ เขาต้องเดินนับให้ครบก่อนตะวันขึ้น ปล่องไหนมีควันตอนสาง นับเป็นหนึ่งเตา เขาไม่รู้ทางในซอย ไม่รู้ว่าปล่องไหนเป็นของใคร จึงยื่นเหรียญทองแดงหนึ่งเหรียญให้{name} ขอให้ถือตะเกียงนำทางกับบอกชื่อเจ้าของปล่อง

    ก่อนสาง ข่าวไปถึงทุกหลังก่อนตะเกียงของ{name} ปล่องหลายปล่องเย็นเฉียบ แต่ทั้งซอยหอมกลิ่นขนมปังที่เพิ่งออกจากเตาเมื่อชั่วโมงก่อน เสมียนหนุ่มคัดจมูก หายใจทางปาก เขายกตะเกียงส่องปล่องแรก แล้วหันมาถาม{name} ปล่องนี้ไฟติดไหม
  choices:
    - id: count_true
      label: บอกตามจริงทุกปล่อง ปล่องไหนเพิ่งดับก็บอกว่าเพิ่งดับ
      text: |
        เสมียนหนุ่มจดตามที่{name}บอกทีละปล่อง ปล่องเย็นที่เพิ่งดับนับเป็นเตาเหมือนปล่องที่มีควัน ตอนตะวันขึ้น สมุดของเขาเต็มสองหน้า มากกว่าปีนับเตาครั้งก่อนสิบเอ็ดเตา เขาขอบใจ{name} แล้วให้เหรียญเพิ่มอีกหนึ่ง

        สายวันนั้น หญิงเจ้าของเตาขนมปังหัวซอยขายขนมปังให้{name}ราคาเดิม ห่อด้วยกระดาษแบบเดิม แต่ไม่ทอนเศษให้เหมือนทุกเช้า
      effects: { gold: 2, alignment: { law: 1 }, flags: [counted_every_chimney_true] }
    - id: cold_since_winter
      label: บอกว่าปล่องพวกนี้เย็นมาตั้งแต่หน้าหนาว เจ้าของย้ายไปบ้าง ตายไปแล้วบ้าง
      text: |
        เสมียนหนุ่มจดว่าเย็นทีละปล่อง ไม่ถามซ้ำ เขาหนาวและอยากกลับไปนอน ปล่องของคนที่{name}บอกว่าตายไปแล้ว มีคนตายคนนั้นยืนดูอยู่หลังหน้าต่าง ห่มผ้าห่มถึงคาง

        ตอนตะวันขึ้นสมุดของเขามีไม่ถึงหน้า เขาจ่ายเหรียญทองแดงตามที่ตกลง แล้วออกไปกับเกวียนเที่ยวเช้า สมุดเตาเล่มใหม่ในย่ามยังสันขาว
      effects: { gold: 1, alignment: { law: -1 }, flags: [counted_the_lane_cold] }
    - id: drown_the_lantern
      label: ทำตะเกียงหล่นลงร่องน้ำหัวซอย ให้มืดไปจนกว่าจะหาไฟใหม่ได้
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ตะเกียงจมลงร่องน้ำ ไส้ดับดังฉ่า เสมียนหนุ่มยืนอยู่ในความมืดกับสมุดที่ยังไม่ได้จดสักบรรทัด กว่า{name}จะไปขอไฟจากเตาขนมปังมาได้ ฟ้าก็สว่าง ปล่องทุกปล่องในซอยพ่นควันขึ้นพร้อมกันเหมือนนัดกันไว้ ปล่องที่มีควันตอนฟ้าสว่างไม่ใช่ปล่องที่มีควันตอนสาง เสมียนหนุ่มว่า สมุดของเขาเขียนไว้แบบนั้น

          เขาออกไปกับเกวียนเที่ยวเช้า สมุดเตาเล่มใหม่ไม่มีชื่อซอยนี้สักบรรทัด
        effects: { gold: 1, stats: { DEX: 1 }, flags: [drowned_the_counters_lantern] }
      failure:
        text: |
          ตะเกียงตกไม่ถึงร่องน้ำ กลิ้งไปค้างบนขอบหิน ไฟยังติด เสมียนหนุ่มก้มลงเก็บ แล้วยกขึ้นส่องหน้า{name}ก่อนส่องปล่องถัดไป

          ปล่องที่เหลือเขาไม่ถาม{name}อีก เขาจดว่ามีไฟทุกปล่อง ทั้งปล่องที่มีควันและปล่องที่ไม่มี
        effects: { gold: 1, flags: [fumbled_the_counters_lantern] }

# ---------- คลังต่ำ ข ตำแหน่งนายตลาดขาย ----------
- id: adult.realm_arvel_market_post_for_sale
  stage: adult
  weight: 22
  scene: market
  when:
    age: [20, 64]
    location_tag: [arvel_village, ventras, kardin]
    not_orgs: [crown_office, crown_army, crown_court]
    world: { treasury: [-8, -2] }
  text: |
    นายตลาดคนเก่าเป็นชายหลังโกงที่ถือตาชั่งหลวงมาตั้งแต่สมัยหลังยังตรง ใครโกงตาชั่ง เขาจับได้ด้วยการยกของขึ้นมือ ใครทะเลาะเรื่องที่ตั้งแผง เขาตัดสินด้วยการเดินนับก้าว ค่าแผงที่เขาเก็บไม่เคยขึ้น เช้านี้เขาพับผ้าคลุมตาชั่งเป็นครั้งสุดท้าย ตาชั่งไม่ใช่ของเขาแล้ว

    กระดาษบนเสาหน้าตลาดเขียนว่าตำแหน่งนายตลาดว่าง ผู้ใดจ่ายเงินเข้าหลวงตามราคาที่เขียนไว้ข้างล่าง ได้ตำแหน่งไปจนกว่าจะขายต่อ ราคานั้นมากกว่าค่าแผงที่นายตลาดคนเก่าเก็บได้ทั้งชีวิต คนที่อ่านกระดาษแผ่นนั้นซ้ำสามรอบคือเจ้าของโรงรับจำนำ ปากขยับเหมือนคนบวกเลข

    บ่ายนั้นคนขายผักสองคนเอาหมวกใบหนึ่งมาตั้งกลางตลาด บอกทุกคนที่ผ่านว่าถ้าเงินในหมวกถึงราคาบนกระดาษ ตาชั่งจะกลับไปอยู่ในมือคนเดิม หมวกใบนั้นยังเบาหวิว {name}ยืนอยู่ระหว่างหมวกกับโรงรับจำนำ
  choices:
    - id: coins_in_the_hat
      label: หยอดสามเหรียญลงหมวก
      requires: { min_gold: 3 }
      text: |
        สามเหรียญของ{name}ทำให้คนอื่นหยอดตาม ก่อนตะวันตก หมวกใบนั้นต้องเอาผ้ารองก้นกันขาด เงินในหมวกขาดราคาไปเหรียญเดียว คนขายผักควักกระเป๋าตัวเองเติมให้ครบ นายตลาดคนเก่าได้ตาชั่งคืน

        เช้าวันแรกของตำแหน่งที่เขาซื้อเอง เขาขึ้นค่าแผงหนึ่งเหรียญทองแดง บอกทุกแผงว่าเอาไว้ใช้คืนหมวก แล้วเขียนชื่อคนที่หยอดหมวกไว้บนกระดานข้างตาชั่ง ชื่อ{name}อยู่บรรทัดที่สาม
      effects: { gold: -3, flags: [bought_back_the_old_scale] }
    - id: ask_the_pawnbroker
      label: เดินไปถามเจ้าของโรงรับจำนำต่อหน้าคนทั้งตลาด ว่าได้ตำแหน่งแล้วค่าแผงจะขึ้นเท่าไร
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เจ้าของโรงรับจำนำไม่อยากตอบต่อหน้าคนทั้งตลาด แต่ยิ่งไม่อยากเป็นคนที่ไม่ตอบ เขาบอกว่าค่าแผงจะไม่ขึ้นสักเหรียญจนสิ้นฤดู คนขายผักให้เขาพูดซ้ำอีกรอบดังๆ

          เขาได้ตำแหน่งในสัปดาห์นั้น ค่าแผงไม่ขึ้นจนสิ้นฤดูจริง วันแรกของฤดูใหม่ค่าแผงขึ้นสองเท่า กระดานข้างตาชั่งเขียนตัวเลขใหม่ด้วยดินขาว ใต้ตัวเลขมีอีกบรรทัด ตามที่พูดไว้
        effects: { stats: { CHA: 1 }, flags: [made_the_pawnbroker_promise] }
      failure:
        text: |
          เจ้าของโรงรับจำนำหัวเราะ ถามกลับว่า{name}จะมาเช่าแผงหรือเปล่า ถ้าไม่เช่า ค่าแผงก็ไม่ใช่เรื่องของ{name} คนแถวนั้นหัวเราะตามสองสามคน

          เขาได้ตำแหน่งในสัปดาห์นั้น เช้าวันแรกค่าแผงขึ้นสองเท่า
        effects: { flags: [laughed_off_by_the_pawnbroker] }
    - id: walk_past_the_hat
      label: เดินผ่านไป เรื่องตาชั่งของหลวงไม่ใช่เรื่องของตัวเอง
      text: |
        เจ้าของโรงรับจำนำได้ตำแหน่งในสัปดาห์นั้น เช้าวันแรกค่าแผงขึ้นสองเท่า แผงที่จ่ายไม่ไหวสามแผงย้ายไปตั้งริมทางนอกตลาด ตรงที่ไม่ต้องจ่ายค่าแผง และไม่มีตาชั่งหลวงให้ใครเชื่อ

        นายตลาดคนเก่ามีแผงเล็กๆ ขายหัวมันอยู่ท้ายตลาด เขาจ่ายค่าแผงสองเท่าให้คนที่นั่งเก้าอี้ของเขา ตรงเวลาทุกเช้า
      effects: { flags: [walked_past_the_hat] }

# ---------- ความสงบต่ำ ก ป้อมยามว่าง ----------
- id: adult.realm_arvel_empty_patrol_hut
  stage: adult
  weight: 22
  scene: road
  when:
    age: [20, 64]
    location_tag: [arvel_village, ventras, kardin]
    not_orgs: [crown_office, crown_army, crown_court]
    world: { peace: [-8, -2] }
  text: |
    ป้อมยามริมทางหลวงเป็นเพิงไม้หลังเดียว มีม้านั่งยาว ตะขอแขวนหมวกเหล็กสี่ตะขอ กับกลองใบเล็กไว้ตีเรียกคน ทหารลาดตระเวนผลัดกันมานั่งที่นี่มาตั้งแต่ก่อนใครแถบนี้จะจำความได้ ฤดูนี้ไม่มีทหารมานั่ง ตะขอแขวนหมวกตะขอหนึ่งมีรังนกกระจาบ ไข่สามใบ

    สัปดาห์ก่อนมีคนสามคนเอาท่อนไม้มาวางขวางทางที่ท่าข้ามน้ำตื้น ห่างป้อมยามครึ่งชั่วโมงเดิน เก็บค่าผ่านทางคนละเหรียญ เกวียนละสามเหรียญ จ่ายแล้วได้ก้อนกรวดทาสีแดงหนึ่งก้อน ขากลับยื่นกรวดคืนไม่ต้องจ่ายซ้ำ พวกเขาทำเหมือนด่านหลวงทุกอย่าง ยกเว้นไม่มีใบรับ

    วันนี้{name}ต้องใช้ทางสายนั้น ที่ท่าข้ามน้ำมีคนรออยู่หน้าท่อนไม้แล้วห้าหกคน หญิงแก่กับไก่สองตัวในตะกร้า ชายหนุ่มเข็นรถใส่กระถางดิน คนหน้าสุดกำลังนับเหรียญให้คนเก็บค่าผ่านทางทีละเหรียญ ช้าๆ
  choices:
    - id: pay_the_pebble_toll
      label: จ่ายหนึ่งเหรียญ รับกรวดแดงมาหนึ่งก้อน
      requires: { min_gold: 1 }
      text: |
        คนเก็บค่าผ่านทางรับเหรียญ ยกกรวดแดงขึ้นส่องแดดก่อนยื่นให้ เหมือนคนตรวจเหรียญปลอม สีแดงบนกรวดเป็นสีเดียวกับที่ทาประตูยุ้งฉาง ขากลับ{name}ยื่นกรวดคืน เขาโยนลงกระสอบ ในกระสอบมีกรวดแดงอยู่ครึ่งกระสอบแล้ว

        ปลายฤดู คนแถบนั้นเรียกท่าข้ามน้ำนั้นว่าด่านกรวด ชื่อเดิมของท่าเหลือแต่คนแก่ที่ยังเรียก
      effects: { gold: -1, flags: [paid_the_pebble_toll] }
    - id: wade_upstream
      label: อ้อมขึ้นไปข้ามทางต้นน้ำ ตรงที่น้ำลึกถึงอก
      check: { stat: CON, dc: 13 }
      success:
        text: |
          น้ำเย็นจนขาชาตั้งแต่ก้าวที่สิบ พื้นเป็นหินมนลื่น {name}ข้ามถึงฝั่งโดยไม่ล้ม เสื้อผ้าเปียกถึงอก ขึ้นฝั่งแล้วได้ยินเสียงคนเก็บค่าผ่านทางหัวเราะลอยมาตามน้ำ เขาไม่ได้หัวเราะ{name} เขาหัวเราะหญิงแก่ที่ต่อราคาค่าผ่านทางของไก่

          หลังจากวันนั้น ทางเดินริมตลิ่งต้นน้ำมีรอยเท้าเพิ่มขึ้นทุกวัน จนหญ้าตายเป็นทางยาว
        effects: { stats: { CON: 1 }, flags: [waded_round_the_pebble_toll] }
      failure:
        text: |
          ก้าวที่ยี่สิบ เท้าลื่นบนหินมน กระแสน้ำพา{name}ไปไกลสิบกว่าก้าวกว่าจะคว้ารากไม้ริมตลิ่งได้ ข้อศอกถลอกจนเลือดซิบ ของในย่ามเปียกหมด

          {name}เดินกลับมาทางท่าข้ามน้ำทั้งตัวเปียกโชก คนเก็บค่าผ่านทางยกท่อนไม้ให้ผ่านฟรี บอกว่าคนที่ลงน้ำมาแล้วถือว่าจ่ายแล้ว
        effects: { hp: -2, flags: [nearly_drowned_round_the_toll] }
    - id: walk_in_a_crowd
      label: รอจนคนที่ท่าข้ามน้ำมีมากพอ แล้วชวนทุกคนข้ามท่อนไม้ไปพร้อมกัน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ตอนสายคนรอเพิ่มเป็นยี่สิบกว่าคน {name}ชวนทีละคน หญิงแก่กับตะกร้าไก่ยอมเป็นคนแรก ทุกคนยกขาข้ามท่อนไม้ไปพร้อมกัน คนเก็บค่าผ่านทางสามคนยืนถือไม้กระบองดู แต่เลือกไม่ได้ว่าจะตีใครก่อน

          สัปดาห์ต่อมาคนแถบนั้นนัดกันเดินไปตลาดเป็นกลุ่มทุกวันตลาด ด่านที่ท่าข้ามน้ำย้ายไปตั้งที่สะพานไม้ทางเหนือ ตรงที่คนต้องเดินข้ามทีละคน
        effects: { stats: { CHA: 1 }, flags: [walked_the_crowd_past_the_toll] }
      failure:
        text: |
          คนส่วนใหญ่ไม่อยากเสี่ยงเพื่อเหรียญเดียว สุดท้ายเหลือ{name}กับชายหนุ่มเข็นรถสองคนที่เดินเข้าไปหาท่อนไม้ คนเก็บค่าผ่านทางคนหนึ่งเอาไม้กระบองฟาดรถเข็น กระถางดินแตกสามใบ

          {name}ช่วยชายหนุ่มเก็บเศษกระถางใส่รถ แล้วเดินกลับทางเดิมด้วยกัน วันนั้นไปตลาดไม่ทัน
        effects: { flags: [crowd_would_not_follow] }
    - id: sit_in_the_patrol_hut
      label: เอาเสื้อคลุมทหารตัวเก่าออกมาใส่ แล้วไปนั่งตีกลองที่ป้อมยาม
      requires: { flag: discharged_from_the_army }
      text: |
        เสื้อคลุมตัวเก่ายังพอใส่ได้ถ้าไม่ติดกระดุมเม็ดล่าง {name}นั่งลงบนม้านั่งยาวในป้อมยาม ตีกลองใบเล็กตามจังหวะเรียกเปลี่ยนเวรที่มือยังจำได้ เสียงกลองไปถึงท่าข้ามน้ำพอดี

        ตอนสาย ท่อนไม้ที่ขวางทางหายไปพร้อมคนเก็บค่าผ่านทาง {name}นั่งต่อจนค่ำ วันต่อมาก็มานั่งอีก ข้างม้านั่งมีของวางไว้ให้ทุกเช้า ไข่ต้มบ้าง ขนมปังบ้าง จากคนที่เดินผ่าน รังนกบนตะขอหมวกฟักเป็นตัวในสัปดาห์นั้น
      effects: { alignment: { law: 1 }, flags: [sat_in_the_empty_patrol_hut] }

# ---------- ความสงบต่ำ ข ใบเกณฑ์คน ----------
- id: adult.realm_arvel_levy_paper
  stage: adult
  weight: 22
  when:
    age: [20, 64]
    location_tag: [arvel_village, ventras, kardin]
    not_orgs: [crown_office, crown_army, crown_court]
    world: { peace: [-8, -2] }
  text: |
    เด็กหนุ่มแบกน้ำของซอยไม่มีใครเรียกชื่อจริง ทุกคนเรียกเขาว่าไหล่เอียง เพราะเขาแบกคานน้ำบนบ่าขวาข้างเดียวมาตั้งแต่ตัวยังเท่าถัง บ่าขวาจึงต่ำกว่าบ่าซ้ายหนึ่งนิ้ว เขาตักน้ำส่งทุกร้านในซอยก่อนตะวันขึ้น ไม่เคยขาดสักวัน

    เช้านี้คนของอำเภอมาตอกกระดาษเกณฑ์คนไว้ที่เสาข้างบ่อน้ำ ชายที่อายุถึงเกณฑ์ ชื่อเรียงกันสิบสองชื่อ ให้ไปรายงานตัวที่ศาลาอำเภอภายในสามวัน ไม่บอกว่าจะไปที่ไหน ไม่บอกว่ากี่ฤดู ชื่อจริงของไหล่เอียงอยู่บรรทัดที่เก้า คนในซอยเพิ่งได้รู้ชื่อจริงของเขาก็วันนี้

    ไหล่เอียงอ่านหนังสือไม่ออก เขาวางคานน้ำลง ยืนฟังคนอ่านชื่อให้ฟังจนถึงบรรทัดที่เก้า แล้วยกคานขึ้นบ่า ส่งน้ำครบทุกร้านเหมือนทุกเช้า ร้านสุดท้ายในรอบของเขาคือร้านที่{name}ยืนอยู่ เขาวางถังลง ถามเสียงเบาว่าถ้าไม่ไป จะเป็นอย่างไร
  choices:
    - id: hide_him_with_the_goatherd
      label: พาเขาออกไปตอนกลางคืน ฝากไว้กับคนต้อนแพะที่จะขึ้นทุ่งสูงไปจนปลายฤดู
      text: |
        ไหล่เอียงเดินตามคนต้อนแพะออกไปก่อนไก่ขัน คานน้ำพิงไว้ข้างบ่อ ถังสองใบคว่ำอยู่ข้างๆ วันที่สี่คนของอำเภอมาขีดชื่อคนที่ไม่ไปรายงานตัว ชื่อบรรทัดที่เก้าโดนขีดด้วยหมึกแดง ข้างชื่อเขียนว่าหนีเกณฑ์

        คนของอำเภอถามไปทั่วซอยว่าใครเห็นเขาเป็นคนสุดท้าย มีคนชี้มาที่{name} ไม่รู้ว่าใครชี้ คนของอำเภอจดชื่อ{name}ไว้ใต้ชื่อที่ขีดแดง
      effects: { alignment: { law: -1 }, hunted: { crown: 1 }, flags: [hid_a_man_from_the_levy] }
    - id: walk_him_to_the_hall
      label: บอกเขาตามจริงว่าคนที่ไม่ไปจะมีชื่อขึ้นเสาประกาศ แล้วเดินไปส่งเขาที่ศาลาอำเภอ
      text: |
        วันที่สามไหล่เอียงอาบน้ำ หวีผม ใส่เสื้อตัวที่ไม่มีรอยปะ {name}เดินไปส่งถึงหน้าศาลา เสมียนเรียกชื่อจริงของเขาสองรอบ เขาไม่ขาน รอบที่สาม{name}ต้องสะกิดแขน

        เช้าวันต่อมาคนในซอยต้องเดินไปตักน้ำกันเอง คานน้ำของเขาพิงอยู่ข้างบ่อทั้งฤดู ไม่มีใครหยิบไปใช้ จนปลายฤดูมีคนเอาไปพาดทำราวตากผ้า
      effects: { alignment: { law: 1 }, flags: [walked_the_water_carrier_to_the_levy] }
    - id: pay_the_substitute
      label: จ่ายค่าคนแทนตัวหกเหรียญที่ศาลาอำเภอ ให้ชื่อบรรทัดที่เก้าหลุดจากกระดาษ
      requires: { min_gold: 6 }
      text: |
        ค่าคนแทนตัวมีราคาเขียนไว้ข้างโต๊ะเสมียนชัดเจน เหมือนราคาเกลือ เสมียนรับหกเหรียญ ขีดชื่อบรรทัดที่เก้าออกด้วยหมึกดำ แล้วเปิดสมุดอีกเล่ม ไล่นิ้วลงไปหาชื่อใหม่มาเติมให้ครบสิบสอง

        อีกสองวันกระดาษแผ่นใหม่ขึ้นเสาข้างบ่อน้ำ ชื่อบรรทัดที่เก้าเป็นชื่อลูกชายคนเผาถ่านท้ายซอย คนในซอยไม่เคยรู้ชื่อจริงของเขามาก่อนเหมือนกัน
      effects: { gold: -6, flags: [paid_the_levy_substitute] }
    - id: argue_the_spelling
      label: เดินไปศาลาอำเภอกับเขา ให้เสมียนฟังว่าชื่อบนกระดาษกับชื่อที่เขาพูดต่างกันหนึ่งเสียง
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          เสมียนอ่านชื่อบนกระดาษออกเสียง แล้วให้ไหล่เอียงพูดชื่อตัวเอง เสียงสระไม่ตรงกัน {name}บอกว่าคนบนกระดาษไม่ใช่คนที่ยืนอยู่ตรงนี้ เสมียนเกาหัวด้วยปลายปากกา คนต่อแถวข้างหลังเริ่มบ่น เขาขีดชื่อนั้นออก เขียนไว้ข้างๆ ว่าหาตัวไม่พบ

          ไหล่เอียงกลับไปแบกน้ำตั้งแต่บ่าย ตั้งแต่นั้นเวลามีคนถามชื่อ เขาพูดชื่อตัวเองชัดทุกเสียงสระ ช้าๆ ให้คนถามได้ยินครบ
        effects: { stats: { CHA: 1 }, flags: [argued_the_levy_spelling] }
      failure:
        text: |
          เสมียนฟังทั้งสองเสียง แล้วแก้ตัวสะกดบนกระดาษให้ตรงกับเสียงที่ไหล่เอียงพูด ด้วยปลายปากกาตรงนั้นเลย เขาขอบใจ{name}ที่ช่วยให้กระดาษไม่ผิด

          ไหล่เอียงเดินเข้าไปหลังศาลากับคนอีกสามคนตอนบ่าย {name}แบกคานน้ำของเขากลับมาพิงไว้ข้างบ่อ
        effects: { flags: [corrected_the_levy_paper_by_mistake] }

# ---------- ตามล่า ก ชื่อบนเสาประกาศ ----------
- id: adult.hunted_crown_name_on_the_post
  stage: adult
  weight: 15
  hunt: crown
  when:
    age: [20, 64]
    location_tag: [arvel_village, ventras, kardin]
    not_orgs: [crown_office, crown_army, crown_court]
  text: |
    เสาประกาศหน้าศาลาอำเภอมีกระดาษแผ่นใหม่ ลายมือเสมียนตัวเอียง ชื่อเรียงกันเจ็ดชื่อ ใต้รายชื่อเขียนไว้บรรทัดเดียว ให้มาแสดงตัวที่ศาลาอำเภอก่อนวันที่เจ็ด ไม่บอกว่าเพราะอะไร ชื่อของ{name}อยู่บรรทัดที่สาม สะกดไม่ผิดสักตัว

    ค่ำนั้นคนถือหมายของอำเภอเดินมาหา{name}คนเดียว ไม่ถือไม้ ไม่คาดผ้าแถบ เขากับ{name}รู้จักหน้ากันมาหลายหน้าหนาวพอที่จะทักกันในตลาด รองเท้าของเขาสึกจนส้นเอียง เขาไม่นั่ง บอกตรงๆ ว่าถ้ามาเองก่อนวันที่เจ็ด ก็เสียค่าปรับ หรือไปทุบหินกับกองซ่อมทางหนึ่งฤดู ถ้าเขาต้องพาคนมา ก็เข้าห้องขังก่อน แล้วค่อยเสียค่าปรับเหมือนเดิม

    ก่อนกลับเขาบอกอีกเรื่องหนึ่ง เสมียนที่คัดกระดาษขึ้นเสาทุกสัปดาห์ชอบเหล้าองุ่นจากทางใต้ แล้วเขาก็เดินกลับไป ไม่ได้รอคำตอบ
  choices:
    - id: pay_the_fine
      label: ไปแสดงตัวที่ศาลาอำเภอ จ่ายค่าปรับสี่เหรียญ
      requires: { min_gold: 4 }
      text: |
        เสมียนที่ศาลาอำเภอรับเหรียญ นับสองรอบ เขียนใบรับ แล้วลุกไปที่เสาประกาศเอง ขีดชื่อ{name}ด้วยหมึกดำเส้นเดียว ชื่อยังอ่านออกใต้เส้นหมึก

        กระดาษแผ่นนั้นอยู่บนเสาจนฝนแรกของฤดูลง ชื่อที่ยังไม่โดนขีดเหลือสี่ชื่อ
      effects: { gold: -4, alignment: { law: 1 }, hunted: { crown: -1 }, flags: [paid_the_crown_fine] }
    - id: serve_the_road_gang
      label: ไปแสดงตัว แล้วไปทุบหินกับกองซ่อมทางหนึ่งฤดู
      text: |
        กองซ่อมทางนอนในเต็นท์ผ้าใบเก่าริมทางที่ซ่อม ตื่นตอนสาง ทุบหินจนเที่ยง ขนหินจนค่ำ ข้าวต้มสองมื้อ ผู้คุมกองเป็นชายพุงพลุ้ยที่ไม่เคยแตะค้อน แต่นับหินในกองทุกเย็นไม่เคยพลาดสักก้อน

        ปลายฤดูฝ่ามือของ{name}ด้านทั้งสองข้าง ทางช่วงที่กองซ่อมเรียบพอให้เกวียนแล่นได้โดยคนบนเกวียนไม่ต้องจับขอบ ชื่อ{name}บนเสาประกาศมีเส้นหมึกดำขีดทับ
      effects: { hp: -1, hunted: { crown: -1 }, flags: [served_a_season_on_the_road_gang] }
    - id: leave_before_the_seventh_day
      label: เก็บของออกเดินทางก่อนวันที่เจ็ด
      text: |
        {name}ออกเดินตอนสางของวันที่หก ของที่เอาไปได้มีเท่าที่ย่ามใบเดียวรับไหว ขาออกผ่านศาลาอำเภอ กระดาษบนเสาเปียกน้ำค้าง หมึกชื่อบรรทัดที่สามซึมเป็นวง แต่ยังอ่านออก

        หลายสัปดาห์ต่อมา ที่ร้านน้ำชาริมทางห่างออกไปสามวันเดิน {name}ได้ยินคนแปลกหน้าถามเจ้าของร้านว่ารู้จักคนชื่อนี้ไหม ชื่อที่ถามคือชื่อของ{name}
      effects: { flags: [left_before_the_seventh_day] }
    - id: wine_for_the_clerk
      label: ซื้อเหล้าองุ่นจากทางใต้หนึ่งไห ฝากคนถือหมายไปให้เสมียนคนคัดกระดาษ
      requires: { min_gold: 2 }
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เหล้าองุ่นไหนั้นราคาสองเหรียญ คนถือหมายรับไปโดยไม่บอกว่าจะเอาไปให้ใคร สัปดาห์ต่อมากระดาษแผ่นใหม่ขึ้นเสาแทนแผ่นเก่า ลายมือตัวเอียงแบบเดิม ชื่อหกชื่อ ไม่มีชื่อ{name}

          ไม่มีเส้นหมึก ไม่มีรอยขูด เสมียนคัดตกไปหนึ่งบรรทัด แบบที่คนเหนื่อยคัดตกกันได้ทุกวัน
        effects: { gold: -2, alignment: { law: -1 }, hunted: { crown: -1 }, flags: [a_clerks_pen_dropped_the_name] }
      failure:
        text: |
          คนถือหมายรับไหไป สัปดาห์ต่อมากระดาษแผ่นใหม่ขึ้นเสา เจ็ดชื่อเหมือนเดิม ชื่อ{name}ยังอยู่บรรทัดที่สาม ลายมือเอียงกว่าเดิมนิดหนึ่ง

          คนถือหมายบอกทีหลังว่าเสมียนดื่มเหล้าไหนั้นหมดในคืนเดียว แล้วจำไม่ได้ว่าใครให้มา
        effects: { gold: -2, flags: [wine_for_a_clerk_who_forgot] }

# ---------- ตามล่า ข คนรับจ้างถือหมาย (การปะทะ ไม่ผูกที่ ไม่เอาถึงตาย) ----------
- id: adult.hunted_crown_warrant_men
  stage: adult
  weight: 15
  once: false
  time: dusk
  hunt: crown
  when:
    age: [20, 64]
    not_orgs: [crown_office, crown_army, crown_court]
  text: |
    คนสองคนเดินตามหลัง{name}มาตั้งแต่เที่ยง ห่างไว้พอให้ดูเหมือนคนเดินทางสายเดียวกัน คนหนึ่งร่างใหญ่ สะพายขดเชือกไว้บนไหล่ อีกคนตัวเล็ก เดินกะเผลกนิดๆ ถือกระดาษพับไว้ในมือตลอดทาง ตะวันใกล้ลับ ทางแคบลงช่วงหนึ่ง ทั้งสองเร่งฝีเท้าขึ้นมาพร้อมกัน

    คนตัวเล็กคลี่กระดาษให้ดู หมายของหลวง มีชื่อ{name} มีรูปพรรณสามบรรทัดที่ตรงกับตัวจริงสองบรรทัด เขาบอกว่าหลวงจ่ายค่าตัวเฉพาะคนที่ยังเดินได้ เขาจึงอยากให้{name}เดินได้ คนร่างใหญ่ปลดขดเชือกลงจากไหล่
  encounter:
    foe: mercenary
    name: คนรับจ้างถือหมายหลวง
    deadly: false
    beats:
      - text: คนตัวเล็กยืนขวางทางข้างหน้า คนร่างใหญ่ยืนข้างหลัง ขดเชือกคล้องแขน ปลายเชือกผูกเป็นห่วงไว้แล้ว ทั้งสองยังไม่ขยับ รอให้{name}เลือกว่าจะหันไปทางไหน
        moves:
          - id: wm_ask_the_fee
            label: ถามคนตัวเล็กว่าหลวงจ่ายค่าตัวเขาเท่าไร
            kind: talk
            parley: true
          - id: wm_side_step
            label: ก้าวเฉียงลงข้างทาง ไม่ให้สองคนอยู่หน้ากับหลังพอดี
            kind: quick
          - id: wm_back_to_rock
            label: ถอยไปพิงหินก้อนใหญ่ริมทาง ให้หลังไม่ว่าง
            kind: guard
          - id: wm_read_the_leader
            label: ดูว่าใครในสองคนเป็นคนตัดสินใจ
            kind: read
            stat: WIS
            success: คนร่างใหญ่เหลือบดูคนตัวเล็กทุกครั้งก่อนขยับเท้า ขาที่กะเผลกของคนตัวเล็กเป็นขาขวา เขาลงน้ำหนักที่ขาซ้ายเสมอ
          - id: wm_run_back
            label: วิ่งกลับไปทางที่มา
            kind: flee
      - text: ห่วงเชือกลอยมาทางหัวไหล่ คนร่างใหญ่โยนแบบคนคล้องวัว ไม่เร็ว แต่ไม่พลาดง่าย
        answer: quick
        moves:
          - id: wm_duck_the_loop
            label: ก้มให้ห่วงข้ามหัวไป
            kind: quick
          - id: wm_catch_the_rope
            label: คว้าเชือกไว้ก่อนห่วงจะรัด
            kind: guard
          - id: wm_yank_the_rope
            label: จับเชือกกระชากเข้าหาตัว ให้คนโยนเสียหลัก
            kind: attack
            tags: [blunt]
          - id: wm_wrong_line
            label: บอกว่ารูปพรรณในหมายผิดไปหนึ่งบรรทัด หลวงจะจ่ายค่าคนผิดตัวหรือเปล่า
            kind: talk
          - id: wm_drop_the_pack
            label: ทิ้งย่ามไว้ให้เขาก้มเก็บ แล้ววิ่ง
            kind: flee
      - text: คนตัวเล็กเก็บหมายเข้าอกเสื้อ ชักดาบสั้นออกจากฝัก บอกว่าจะใช้สันดาบ แขนหักหนึ่งข้างยังนับเป็นคนที่เดินได้
        answer: attack
        moves:
          - id: wm_close_in
            label: เข้าไปถึงตัวเขาก่อนดาบจะเงื้อสุด
            kind: attack
          - id: wm_block_with_pack
            label: ยกย่ามที่ม้วนไว้ขึ้นรับดาบ
            kind: guard
          - id: wm_not_worth_it
            label: บอกเขาว่าค่าตัวของ{name}ไม่พอค่าหมอของเขาเอง
            kind: talk
          - id: wm_throw_dust
            label: กอบฝุ่นข้างทางสาดหน้าคนตัวเล็ก
            kind: item
            stat: DEX
          - id: wm_slide_down
            label: กระโดดลงข้างทางที่ลาดชัน ไถลลงไปให้พ้นมือ
            kind: flee
    win:
      text: |
        คนร่างใหญ่นั่งกุมข้อมืออยู่ข้างทาง คนตัวเล็กยืนพิงหินหอบ ทั้งสองไม่ตามมาอีก ตอน{name}เดินผ่าน คนตัวเล็กบอกว่าหมายยังอยู่ในอกเสื้อเขา และเสมียนคัดหมายได้อีกหลายแผ่น

        คืนนั้น{name}นอนห่างทางเกวียนไกลกว่าทุกคืน ห่วงเชือกที่หลุดมือคนร่างใหญ่ติดข้อเท้ามาด้วยครึ่งทาง กว่าจะรู้ตัว
      effects: { flags: [beat_off_the_warrant_men] }
    lose:
      text: |
        {name}ตื่นขึ้นบนพื้นเกวียน ข้อมือผูกไว้กับขอบเกวียน ทั้งคืนเกวียนแล่นช้าๆ คนร่างใหญ่ขับ คนตัวเล็กนอนหลับ เช้าวันต่อมาเป็นห้องขังของศาลาแห่งหนึ่ง พื้นดินอัด หน้าต่างเท่าฝ่ามือ สามวันกว่าเสมียนจะว่าง

        เสมียนอ่านหมาย คิดค่าปรับ หยิบเหรียญจากย่ามของ{name}ไปจนครบ แล้วจดลงสมุดว่าเรื่องนี้จบไปหนึ่งเรื่อง คนตัวเล็กรับค่าตัวที่โต๊ะถัดไป นับเหรียญต่อหน้า{name}
      effects: { gold: -3, hp: -1, hunted: { crown: -1 }, flags: [locked_up_and_fined] }
    stalemate:
      text: |
        ฟ้ามืดจนมองไม่เห็นปลายเชือก คนตัวเล็กเรียกคนร่างใหญ่ถอย บอกว่าคนที่จับได้ตอนมืดมักเป็นคนผิดตัว ทั้งสองไปก่อไฟห่างออกไปร้อยก้าว ไฟกองนั้นสว่างอยู่ทั้งคืน

        ตอนสาง{name}ออกเดินตั้งแต่ยังมองทางไม่ชัด กองไฟข้างหลังมอดเหลือแต่ควัน ข้างกองไฟไม่มีใครนั่งอยู่แล้ว
      effects: { flags: [warrant_men_waited_in_the_dark] }
    flee:
      text: |
        {name}วิ่งไม่หยุดจนเสียงฝีเท้าข้างหลังห่างออกไปแล้วหายไป คืนนั้นนอนในที่ที่ไม่มีใครรู้ ไม่จุดไฟ

        หลายสัปดาห์ต่อมา{name}ได้ยินว่ามีคนรับจ้างคู่หนึ่งเที่ยวถามหาคนตามรูปพรรณสามบรรทัด คนที่ฟังแล้วเล่าต่อจำได้แค่สองบรรทัด
      effects: { flags: [ran_from_the_warrant_men] }
    parley:
      text: |
        คนตัวเล็กบอกค่าตัวมาตรงๆ สามเหรียญ หักค่าเชือก ค่ากิน ค่าเกวียน เหลือเหรียญเดียว {name}ถามว่าเหรียญเดียวคุ้มกับการลากคนที่ยังเดินได้ไปไกลแค่ไหน เขาคิดครู่หนึ่ง แล้วหันไปถามคนร่างใหญ่ คนร่างใหญ่ม้วนเชือกกลับขึ้นไหล่

        ทั้งสองเดินกลับไปทางที่มา ก่อนลับตา คนตัวเล็กตะโกนบอกว่าหมายยังไม่หมดอายุ คราวหน้าคนถือหมายอาจไม่ขี้เกียจเท่าเขา
      effects: { flags: [talked_down_the_warrant_men] }
