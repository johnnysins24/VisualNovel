# ชุด 3a วัยผู้ใหญ่ อายุ 19 ถึง 24: เหตุการณ์ประจำงานชาวบ้าน งานละ 1 เรื่อง
# งานชาวบ้านไม่ผูกกับ class จึงไม่มีพลังพิเศษ ปัญหาของแต่ละงานคือเงิน นาย และร่างกาย

- id: adult.job_farmer_share
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_farmer]
  text: |
    ปีนั้นหนอนกอลงนาตั้งแต่ข้าวเริ่มตั้งท้อง {name}เดินถอนต้นที่ใบเหลืองทิ้งทุกเช้าจนนิ้วเขียว ก็ยังเกี่ยวได้ไม่ถึงครึ่งของปีก่อน ข้าวทั้งหมดกองบนลานนวดได้สูงแค่เข่า

    วันที่นวดเสร็จ ออสริน ลูกชายเจ้าของที่ ขี่ม้ามาพร้อมตาชั่งกับคนแบกสองคน เขาไม่ชั่งกองบนลาน เขากางกระดาษออกอ่าน บอกว่าพ่อของเขากู้เงินวิหารเบเลคไว้ โดยเอาข้าวที่นาทุกแปลงจะต้องได้ปีนี้ไปค้ำ ตัวเลขในกระดาษจึงคิดจากข้าวเต็มปี ส่วนแบ่งปีนี้คือหนึ่งในสามของข้าวที่ไม่ได้เกิดขึ้นจริง

    ถ้าจ่ายตามกระดาษ ข้าวที่เหลือบนลานจะพอกินถึงปลายหนาว แล้วหลังจากนั้นก็ไม่เหลืออะไร
  choices:
    - id: pay_the_paper
      label: ตักข้าวให้ตามตัวเลขในกระดาษ
      text: |
        คนแบกตักข้าวใส่กระสอบไปจนลานนวดเหลือแค่วงข้าวตรงกลางวงเดียว ออสรินลงชื่อรับให้ เขียนตัวสวย แล้วบอกว่าปีหน้าคงดีขึ้น เขาพูดแบบนี้กับทุกแปลงที่ผ่านมา

        หน้าหนาวปีนั้น{name}กินข้าวต้มวันละมื้อ ใส่ผักริมคลองให้ข้นขึ้น ต้นเดือนสุดท้ายของหนาว เข็มขัดต้องเจาะรูใหม่สองรู แต่ตลอดหน้าหนาวไม่มีใครมาเคาะประตูทวงอะไร
      effects: { hp: -2, stats: { CON: 1 }, alignment: { law: 1 }, flags: [farm_hungry_winter] }
    - id: hide_the_sacks
      label: แอบขนข้าวครึ่งหนึ่งไปซ่อนใต้หลังคากระท่อมก่อนเขามา
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ขนข้าวขึ้นใต้หลังคากระท่อมตั้งแต่ตีสาม ทีละกระบุง วางเรียงบนคานไม้แล้วเอาฟางกองทับ ตอนเช้าลานนวดเหลือข้าวกองเดียวที่สูงไม่ถึงตาตุ่ม ออสรินดูกองข้าว ดูกระดาษ แล้วดูหน้า{name}

          เขาตักไปทั้งกองนั้น เขียนลงกระดาษว่าค้างส่วนแบ่ง แล้วขี่ม้าออกไป ข้าวบนคานพอให้{name}กินถึงต้นฤดูฝน ส่วนที่เหลือแบ่งขายได้อีกสองเหรียญ
        effects: { gold: 2, alignment: { law: -1 }, stats: { DEX: 1 }, flags: [hid_the_share] }
      failure:
        text: |
          กระบุงสุดท้ายหลุดมือตอนส่งขึ้นคาน ข้าวสาดลงพื้นกระท่อมเป็นทาง ไปจนถึงหน้าประตู {name}กวาดได้ไม่หมดก่อนเสียงม้าดังมาจากปากทาง

          ออสรินเห็นเมล็ดข้าวบนธรณีประตูก่อนเห็นลานนวด เขาให้คนแบกปีนขึ้นไปขนลงมาหมด บวกค่าปรับอีกหนึ่งกระสอบ แล้วบอกว่าปีหน้า{name}ได้นาแปลงริมทางเกวียน แปลงที่น้ำไม่เคยถึง
        effects: { gold: -2, hp: -1, alignment: { law: -1 }, flags: [landlord_distrusts] }
    - id: go_together
      label: ไปชวนคนเช่านาทุกแปลง ไปยืนหน้าบ้านเจ้าของที่พร้อมกัน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          คนเช่านาทั้งสิบเอ็ดแปลงได้กระดาษแบบเดียวกันหมด {name}เดินไปเคาะประตูทีละบ้านตั้งแต่หัวค่ำ เช้าวันต่อมาทั้งสิบเอ็ดคนไปยืนอยู่หน้าประตูบ้านเจ้าของที่ ไม่มีใครถือเคียว ไม่มีใครถือไม้ ทุกคนถือกระบุงข้าวของตัวเองมาคนละใบ

          เจ้าของที่ออกมาเอง เขาแก่กว่าที่{name}คิดไว้มาก เขาดูกระบุงทีละใบ แล้วบอกให้ลูกชายชั่งข้าวจริงบนลาน หนี้กับวิหารเบเลคเป็นหนี้ของเขาเอง ไม่ใช่หนี้ของนา
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [renters_stood_together] }
      failure:
        text: |
          คนเช่านาส่วนใหญ่ฟัง{name}จนจบแล้วบอกว่าคิดดูก่อน เช้าวันต่อมามีคนมายืนหน้าบ้านเจ้าของที่สามคน รวม{name}ด้วย อีกแปดคนตักข้าวให้ออสรินไปตั้งแต่ก่อนสาย

          ออสรินให้ทั้งสามคนชั่งข้าวจริงตามที่ขอ แต่พอฤดูไถรอบใหม่ เจ้าของที่ขึ้นค่าเช่านาของทั้งสามแปลงเป็นข้าวครึ่งหนึ่งของที่เกี่ยวได้ คนที่ตักข้าวให้ไปตั้งแต่ก่อนสายยังจ่ายหนึ่งในสามเหมือนเดิม
        effects: { gold: -2, alignment: { moral: 1 }, flags: [landlord_marked_you] }

- id: adult.job_refinery_crack
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_refinery_hand]
  text: |
    เสียงแรกเหมือนคนเคาะแก้วด้วยเล็บ เสียงที่สองดังกว่า คนงานทั้งกะหันไปทางหม้อกลั่นเบอร์สิบสี่พร้อมกัน ท้องหม้อมีรอยร้าวยาวเท่านิ้วมือ ไอสีฟ้าซึมออกมาเป็นเส้นบาง ลอยต่ำเลียพื้น ไปทางห้องเก็บขวด

    ทุกคนในโรงรู้ว่าไอแบบนี้แตะผิวแล้วเป็นอะไร เมอร์ดอน หัวหน้ากะ ตะโกนให้ทุกคนถอยไปชิดประตู แต่ประตูโรงลงกลอนจากข้างนอก เป็นกฎของสมาคม จะเปิดก็ต่อเมื่อหมดกะ อีกสามชั่วโมงข้างหน้า
  choices:
    - id: plug_the_crack
      label: เอาผ้าชุบน้ำกับถุงมือหนังไปอุดรอยร้าว
      check: { stat: CON, dc: 14 }
      success:
        text: |
          {name}พันผ้าเปียกรอบถุงมือสองชั้น ก้มหัวต่ำกว่าไอ แล้วกดฝ่ามือลงบนรอยร้าวทั้งสองข้าง ไอเย็นจนกระดูกข้อมือปวด ต้องกดอยู่อย่างนั้นจนเมอร์ดอนปิดลิ้นท่อบนเพดานได้ครบทุกตัว หม้อเบอร์สิบสี่ค่อยๆ เงียบลง

          ตอนหมดกะ ถุงมือคู่นั้นแข็งเป็นแผ่นแก้วสีฟ้าจางๆ {name}ทิ้งมันลงถังขยะแก้ว แล้วดูมือตัวเองที่ยังเป็นผิวคนอยู่ทุกนิ้ว เมอร์ดอนยื่นเหรียญให้สามเหรียญ บอกว่าสมาคมไม่มีค่าตอบแทนเรื่องแบบนี้ เงินนี้เป็นเงินของเขาเอง
        effects: { stats: { CON: 1 }, gold: 3, reputation: { distillers: 1 }, flags: [plugged_pot_fourteen] }
      failure:
        text: |
          ผ้าเปียกกดลงไปได้ครึ่งรอยร้าว แล้วหม้อก็ร้าวต่ออีกคืบหนึ่งใต้มือ ไอพุ่งขึ้นมาทางข้อมือ เข้าไปในแขนเสื้อ {name}ไม่ยอมถอยจนเมอร์ดอนปิดลิ้นท่อได้ แต่พอยกมือออก ผิวด้านในแขนซ้ายเย็นชาไปทั้งแถบ

          สามวันต่อมา แถบนั้นมีจุดใสขึ้นมาเจ็ดจุด เรียงกันเป็นทางจากข้อมือถึงข้อศอก แข็งเหมือนเมล็ดแก้ว สมาคมให้ลาสองวันโดยไม่หักค่าแรง คนงานในโรงไม่เคยมีใครได้แบบนี้มาก่อน
        effects: { hp: -3, stats: { CON: 1 }, reputation: { distillers: 1 }, flags: [glass_spot_adult] }
    - id: break_the_door
      label: เอาชะแลงงัดกลอนประตูโรงจากข้างใน
      check: { stat: STR, dc: 14 }
      success:
        text: |
          บานประตูไม้หนาสองฝ่ามือ กลอนเหล็กอยู่ข้างนอก แต่บานพับอยู่ข้างใน {name}เสียบชะแลงเข้าใต้บานพับตัวบน งัดจนหมุดหลุด แล้วงัดตัวล่าง ประตูทั้งบานล้มออกไปข้างนอก คนงานยี่สิบสามคนวิ่งออกไปสูดลมหน้าโรงกลั่น ก่อนไอสีฟ้าจะเลื้อยมาถึงประตู

          สมาคมปรับ{name}ค่าประตูสามเหรียญ แต่หลังจากคืนนั้น คนงานโรงนี้ไม่มีใครเรียก{name}ด้วยเบอร์หม้ออีก
        effects: { stats: { STR: 1 }, gold: -3, alignment: { law: -1, moral: 1 }, reputation: { distillers: -1 }, flags: [broke_refinery_door] }
      failure:
        text: |
          ชะแลงงัดหมุดบานพับตัวบนออกได้ ตัวล่างไม่ยอมขยับ {name}งัดจนชะแลงงอ ข้อมือพลิกตอนชะแลงลื่นหลุดจากร่อง ระหว่างนั้นเมอร์ดอนปีนขึ้นไปปิดลิ้นท่อได้ทีละตัว ไอค่อยๆ จางลงเอง

          หมดกะ คนเฝ้าข้างนอกเปิดกลอนเจอประตูห้อยอยู่บนบานพับตัวเดียว สมาคมปรับ{name}ค่าบานพับสองเหรียญ ข้อมือบวมไปทั้งสัปดาห์
        effects: { hp: -2, gold: -2, alignment: { law: -1 }, flags: [broke_refinery_door] }
    - id: climb_to_valve
      label: ปีนท่อขึ้นไปช่วยเมอร์ดอนปิดลิ้นท่อบนเพดาน
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          ลิ้นท่อบนเพดานมีเก้าตัว เมอร์ดอนจำได้ว่าตัวไหนส่งไปหม้อเบอร์ไหน แต่ปีนได้ทีละท่อ {name}ปีนท่ออีกฝั่ง ฟังเขาตะโกนเบอร์มาทีละตัว ปิดได้สี่ตัวก่อนเขาปิดได้ห้า ไอสีฟ้าหยุดซึมตอนเหลือแค่เส้นบางเท่าเส้นผม

          หลังจากคืนนั้น เมอร์ดอนให้{name}ขึ้นไปเรียนชื่อลิ้นท่อทุกตัว
        effects: { stats: { DEX: 1 }, reputation: { distillers: 1 }, flags: [knows_the_valves] }
      failure:
        text: |
          ท่อที่{name}ปีนขึ้นไปร้อนจัดตรงข้อต่อ มือหลุดตอนปีนได้ครึ่งทาง {name}ร่วงลงมากระแทกถังน้ำค้างดาวเปล่า เสียงดังทั่วโรง ส่วนเมอร์ดอนปิดลิ้นท่อจนครบคนเดียว ช้ากว่าที่ควรครึ่งชั่วโมง

          ไอที่ซึมออกมาในครึ่งชั่วโมงนั้นไปถึงเท้าของคนงานแก่คนหนึ่งที่นั่งพิงผนังอยู่ใกล้ห้องเก็บขวด เดือนต่อมาเขาเดินกะเผลก
        effects: { hp: -2, flags: [fell_from_pipes] }

- id: adult.job_docker_coin
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_docker]
  text: |
    เช้าวันนั้นเบอร์ริก หัวหน้าท่า ไม่ชี้นิ้ว เขายืนบนลังไม้หน้าลาน ประกาศว่าตั้งแต่สัปดาห์นี้ ใครอยากให้เขาชี้ ต้องจ่ายให้เขาหนึ่งเหรียญทุกต้นสัปดาห์ คนไม่จ่ายก็ยืนรอไปจนกว่าคนจ่ายจะไม่พอ

    คนแบกของในลานเช้านั้นมีหกสิบกว่าคน ค่าแรงทั้งวันได้สองเหรียญ เบอร์ริกยืนรอบนลังไม้ ถุงหนังเปิดปากรออยู่ในมือ คนแรกที่เดินไปหยอดเหรียญเป็นชายแก่ที่ลูกเพิ่งตาย มีหลานต้องเลี้ยงสามคน
  choices:
    - id: pay_the_coin
      label: หยอดเหรียญลงถุงเหมือนคนอื่น
      requires: { min_gold: 3 }
      text: |
        {name}หยอดเหรียญลงไปเป็นคนที่สิบสอง เบอร์ริกจำหน้าคนจ่ายเหรียญได้ทุกคนโดยไม่ต้องจด เช้านั้นเขาชี้คนที่จ่ายครบทั้งยี่สิบคน แล้วชี้ต่ออีกสิบคนจากคนที่ไม่จ่าย ให้เห็นว่าไม่จ่ายก็ยังได้งานบางวัน

        สิ้นเดือน{name}นับเงินได้น้อยกว่าเดือนก่อนสามเหรียญ แต่ไม่มีวันไหนที่ต้องเดินกลับบ้านมือเปล่า
      effects: { gold: -3, alignment: { law: 1 }, flags: [paid_the_pick] }
    - id: stand_together
      label: เดินไปยืนแถวหน้า ชวนทุกคนไม่จ่ายพร้อมกัน
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ไม่ได้ตะโกน เดินไปยืนหน้าลังไม้ หันหน้ามาทางลาน แล้วถามดังพอให้แถวหลังได้ยินว่า เรือที่จอดท่าวันนี้มีกี่ลำ เบอร์ริกตอบไม่ได้ คนแบกของรู้กันหมดว่าเจ็ดลำ เจ็ดลำต้องใช้คนหกสิบคนถึงจะขนทันน้ำขึ้น

          ไม่มีใครเดินไปหยอดเหรียญอีก เบอร์ริกยืนอยู่บนลังจนเจ้าของเรือลำแรกเดินมาถามว่าทำไมยังไม่มีใครขึ้นเรือ เขาลงจากลัง แล้วเริ่มชี้นิ้วเหมือนทุกเช้า ชายแก่คนแรกได้เหรียญของตัวเองคืน เบอร์ริกยื่นให้เองต่อหน้าทุกคน
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [docker_stood_together] }
      failure:
        text: |
          {name}พูดจบ มีคนพึมพำเห็นด้วยสองสามคน แล้วคนข้างหลังก็เริ่มเดินอ้อมไปหยอดเหรียญทีละคน ไม่มีใครมองหน้า{name}ตอนเดินผ่าน เบอร์ริกรอจนถุงหนังหนักแล้วชี้นิ้ว ชี้ทุกคนยกเว้น{name}

          ตั้งแต่วันนั้น{name}ต้องเดินไปท่าปลายสุด ท่าที่รับแต่เรือเกลือ ค่าแรงต่ำกว่าครึ่งเหรียญ แต่ไม่มีใครถามหาเหรียญต้นสัปดาห์
        effects: { gold: -2, alignment: { moral: 1 }, flags: [blacklisted_pier] }
    - id: tell_ship_owner
      label: ไปบอกเจ้าของเรือว่าหัวหน้าท่าเก็บเงินคนแบก
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ไม่ได้ไปบอกว่าเบอร์ริกเก็บเงินใคร เจ้าของเรือไม่สนเรื่องนั้น {name}บอกแค่ว่าเบอร์ริกเลือกคนจากเหรียญ ไม่ได้เลือกจากแรง เรือลำนี้จึงได้คนแบกที่แก่ที่สุดในลาน ขนช้าที่สุด และเรือจะเสียน้ำขึ้นรอบเย็น

          สัปดาห์ต่อมาเจ้าของเรือส่งคนของตัวเองมายืนข้างเบอร์ริกทุกเช้า คนนั้นชี้นิ้วเอง ถุงหนังของเบอร์ริกหายไปจากลาน
        effects: { stats: { INT: 1 }, gold: 1, flags: [outfoxed_dock_boss] }
      failure:
        text: |
          เจ้าของเรือฟัง{name}พูดจบ แล้วถามว่าคนแบกของคนนี้ชื่ออะไร {name}บอกชื่อตัวเองไป เขาจดลงสมุดบัญชีเรือ แล้วบอกว่าเขาจะดู

          เช้าวันต่อมาเบอร์ริกรู้ชื่อนั้นแล้ว ทั้งสัปดาห์เขาชี้นิ้วผ่านหน้า{name}ไปทุกเช้า คนที่ได้งานแทนคือคนที่จ่ายเหรียญเพิ่มเป็นสองเหรียญ
        effects: { gold: -2, flags: [dock_boss_grudge] }

- id: adult.job_miner_ghost
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_miner]
  text: |
    ตาไอ คู่หูคนเก่าที่สอน{name}ฟังเสียงคาน นั่งอยู่ข้างเตาพักในอุโมงค์ชั้นสาม เตาร้อนจนเหล็กขอบเตาแดง แต่เขาสั่นทั้งตัว ฟันกระทบกันดังกว่าเสียงไอ ริมฝีปากเขียว

    ที่หลังคอเขามีก้อนเถ้าก้อนหนึ่งเกาะอยู่ ก้อนเท่าแมว สีเทาด้าน ขยับขึ้นลงช้าๆ ตามจังหวะลมหายใจของตาไอ คนงานเหมืองเรียกมันว่าผีถ่าน มันกินความร้อนจากตะเกียงกับจากคน ไม่มีใครในอุโมงค์อยากเข้าไปใกล้ ทุกคนถอยไปยืนห่างจากเตาพักห้าก้าว
  choices:
    - id: pry_it_off
      label: เอาพลั่วงัดมันออกจากคอตาไอ
      check: { stat: STR, dc: 13, foe: demon }
      success:
        text: |
          {name}สอดปลายพลั่วเข้าใต้ก้อนเถ้าตรงที่มันเกาะผิวคอ แล้วงัดขึ้นทีเดียว ผีถ่านหลุดออกมาเป็นก้อนเดียว ตกลงพื้น แตกเป็นเถ้าผงสองกำมือ ผงเถ้ายังขยับเข้าหากันอยู่ครู่หนึ่ง แล้วนิ่ง

          ตาไอนั่งข้างเตาต่อจนสีปากกลับมา เขาไม่ขอบใจ แต่วันต่อมาเขาเอาข้าวห่อมาให้{name}สองห่อ แล้วทำแบบนั้นทุกวันจนสิ้นเดือน
        effects: { stats: { STR: 1 }, alignment: { moral: 1 }, flags: [killed_coal_ghost] }
      failure:
        text: |
          ปลายพลั่วงัดผีถ่านหลุดจากคอตาไอได้ แต่มันไม่ตก มันไถลขึ้นมาตามด้ามพลั่ว เร็วกว่าที่{name}จะปล่อยมือ แล้วเกาะลงที่ข้อมือ ความหนาวแล่นจากข้อมือลึกลงไปถึงกระดูก

          คนงานสองคนวิ่งมาเอาตะเกียงทั้งดวงทุบใส่มือ{name} น้ำมันลุกไหม้บนมือครู่หนึ่ง ผีถ่านถึงยอมปล่อยไปกินเปลวไฟแทน แผลไหม้กับแผลหนาวอยู่บนผิวเดียวกันจนสิ้นฤดู
        effects: { hp: -3, stats: { CON: 1 }, alignment: { moral: 1 }, flags: [coal_ghost_cold] }
    - id: lure_with_lamp
      label: จุดตะเกียงให้แรงที่สุด ถือล่อมันออกมาจากตัวตาไอ
      check: { stat: DEX, dc: 13, foe: demon }
      success:
        text: |
          {name}หมุนไส้ตะเกียงขึ้นจนสุด เปลวไฟสูงเกินแก้วครอบ แล้วถือไปจ่อไว้ห่างคอตาไอหนึ่งศอก ผีถ่านค่อยๆ คลายตัวออกจากผิวคอ ยื่นส่วนหน้าออกมาหาแสง ยื่นจนครึ่งตัวลอยอยู่กลางอากาศ

          {name}ถอยออกช้าๆ ทีละก้าว มันตามมาจนหลุดจากคอทั้งตัว แล้วตกลงบนตะเกียงที่{name}วางทิ้งไว้กลางอุโมงค์ ตะเกียงดับในเวลาไม่ถึงลมหายใจ ผีถ่านนอนนิ่งอยู่บนแก้วครอบ อิ่ม หนัก จนคนงานทั้งอุโมงค์เอาพลั่วมาตีจนแหลกได้สบาย
        effects: { stats: { DEX: 1 }, alignment: { moral: 1 }, flags: [killed_coal_ghost] }
      failure:
        text: |
          ผีถ่านไม่ตามแสง มันเกาะคอตาไอแน่นขึ้น {name}ถือตะเกียงจ่อเข้าไปใกล้กว่าเดิม ใกล้จนเปลวไฟเลียผมหลังคอของตาไอ เขาร้องขึ้นมา ผีถ่านกระโดดออกจากคอเขามาหาแสงพร้อมกับเสียงร้อง

          มันเกาะลงบนแขน{name}ที่ถือตะเกียง กินไฟจากตะเกียงจนดับ แล้วเริ่มกินต่อจากแขน คนงานสามคนต้องช่วยกันตีจนมันแตก แขนข้างนั้นชาไปทั้งเดือน
        effects: { hp: -3, flags: [coal_ghost_cold] }
    - id: carry_him_up
      label: แบกตาไอทั้งผีถ่านบนคอขึ้นไปหาแดดข้างบน
      check: { stat: CON, dc: 14 }
      success:
        text: |
          {name}แบกตาไอขึ้นหลัง ผีถ่านอยู่ห่างจากหูตัวเองแค่คืบ ความหนาวที่ออกจากตัวมันทำให้ใบหูข้างนั้นแสบ บันไดไม้จากชั้นสามขึ้นปากเหมืองมีสองร้อยขั้น {name}ไม่ได้นับ แต่จำได้ว่าหยุดพักสามครั้ง

          ลานหินหน้าปากเหมืองตากแดดเที่ยงมาทั้งวัน ร้อนกว่าตัวตาไอที่เย็นลงทุกขั้นบันได ผีถ่านคลายจากคอเขา ไต่ลงไปหมอบบนหินที่ร้อนที่สุด คนงานคนหนึ่งเอาพลั่วตบซ้ำสองครั้งจนมันแตกเป็นเถ้า คนแก่ที่ปากเหมืองบอกว่ารู้มานานแล้วว่ามันชอบหินตากแดด แต่ไม่เคยมีใครแบกคนขึ้นมาทันก่อนจะหนาวตาย
        effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [carried_miner_to_sun] }
      failure:
        text: |
          ขั้นที่ร้อยกว่า ขาของ{name}เริ่มสั่นเหมือนตาไอ ความหนาวจากผีถ่านไหลลงมาจากไหล่ทั้งสองข้าง {name}ต้องวางตาไอลงบนชานพักบันได คนงานที่ตามขึ้นมาช่วยแบกต่อ

          ตาไอถึงลานหินช้าไปนิดเดียว ผีถ่านคลายออกไปหาหินร้อนเหมือนกัน แต่นิ้วเท้าทั้งสองข้างของเขาดำและไม่ฟื้น ตาไอยังกลับมาลงเหมือง แต่ต้องใส่รองเท้าที่ยัดผ้าไว้ข้างหน้า
        effects: { hp: -2, alignment: { moral: 1 }, flags: [carried_miner_to_sun] }

- id: adult.job_smith_shackles
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_smith]
  text: |
    คนมาสั่งงานเป็นเสมียนของศาสนจักรตะเกียง เสื้อคลุมขาว ที่อกปักรูปตะเกียงแขวน ดวงเล็กกว่าของนักล่าแม่มด เขาวางแบบที่วาดบนกระดาษไขลงบนทั่ง เป็นกุญแจมือหกคู่ วงข้อมือเล็กเท่าข้อมือเด็กสิบขวบ ต่อกับโซ่สั้นที่ร้อยเข้าหากันได้ทั้งหกคู่

    เขาบอกว่าศาสนจักรจะพาเด็กมีเขาหกคนจากหมู่บ้านทางเหนือไปลงทะเบียนที่วิหารใหญ่ในเวนทราส ทางไกล เด็กชอบหนี จ่ายสามเท่าของราคาตีเหล็กทั่วไป จ่ายก่อนครึ่งหนึ่ง มารับพรุ่งนี้เย็น
  choices:
    - id: forge_them
      label: ตีให้ตามแบบ
      text: |
        กุญแจมือหกคู่ใช้เหล็กไม่ถึงครึ่งแท่ง {name}ตีเสร็จก่อนค่ำ ตะไบขอบในให้เรียบ เพราะช่างทุกคนรู้ว่าขอบในที่คมทำให้ข้อมือเป็นแผลเน่า เป็นเรื่องเดียวที่{name}ทำได้

        เสมียนมารับตามเวลา ลองล็อกกุญแจคู่หนึ่งเข้ากับด้ามค้อนบนโต๊ะ แล้วบอกว่างานดี ศาสนจักรจะกลับมาสั่งอีก
      effects: { gold: 6, alignment: { moral: -1, law: 1 }, reputation: { lamp_church: 1 }, flags: [forged_child_shackles] }
    - id: refuse_order
      label: คืนกระดาษไขกับเงินมัดจำให้เขา
      text: |
        {name}พับกระดาษไขวางลงบนเหรียญมัดจำ แล้วเลื่อนกลับไปหาเขาทั้งสองอย่าง บอกว่าร้านนี้รับแต่งานเกือกม้ากับงานคันไถ เสมียนไม่ถามเหตุผล เขาเก็บเหรียญใส่ถุงทีละเหรียญ แล้วเขียนอะไรสักอย่างลงสมุดก่อนเดินออกไป

        สองวันต่อมาร้านตีเหล็กอีกร้านในถิ่นเดียวกันได้งานนั้นไป เสียงค้อนจากร้านนั้นดังข้ามถนนมาจนถึงค่ำ
      effects: { alignment: { moral: 1 }, reputation: { lamp_church: -1 }, flags: [refused_lamp_order] }
    - id: weak_rivet
      label: ตีให้ แต่แอบทำหมุดในตัวกุญแจให้เปราะ ดึงแรงๆ แล้วหัก
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          {name}ตีกุญแจทั้งหกคู่ด้วยเหล็กดีเหมือนงานปกติ ยกเว้นหมุดตัวเดียวในกลไกล็อก หมุดตัวนั้นจุ่มน้ำเย็นเร็วไปครึ่งจังหวะ ข้างนอกดูแข็งเหมือนหมุดทุกตัว ข้างในเปราะเหมือนน้ำตาลกรอบ เด็กสิบขวบที่บิดข้อมือแรงพอจะได้ยินเสียงมันหัก

          เสมียนมารับ ลองล็อกกุญแจกับด้ามค้อนแล้วกระตุกดูสามครั้ง หมุดไม่หัก เพราะด้ามค้อนไม่ได้บิด เขาจ่ายครบแล้วเดินออกไป
        effects: { gold: 6, alignment: { moral: 1, law: -1 }, stats: { DEX: 1 }, flags: [weak_shackles] }
      failure:
        text: |
          หมุดตัวที่จุ่มน้ำเย็นเร็วไปแตกตั้งแต่ตอนตอกเข้ากลไก เสียงแตกดังพอให้ช่างฝึกหัดร้านข้างๆ หันมา {name}ต้องทำใหม่ทั้งคู่ ทำไม่ทันก่อนเย็น

          เสมียนมาถึงเห็นกุญแจห้าคู่วางเรียงกับเศษหมุดแตกบนทั่ง เขาหยิบเศษหมุดขึ้นมาดูใกล้ๆ แล้วถามว่าช่างที่ตีเหล็กมาสี่ปีทำหมุดแตกได้อย่างไร เขาเอาเงินมัดจำคืนไปทั้งหมด จดชื่อร้านลงสมุด ขีดเส้นใต้สองเส้น
        effects: { gold: -2, reputation: { lamp_church: -1 }, flags: [lamp_noted_smith] }
    - id: show_own
      label: ถอดผ้าโพกหัวออก ถามเขาว่าจะเริ่มวัดข้อมือจากใคร
      requires: { trait: demon_mark, not_flags: [horns_sawn] }
      text: |
        {name}แก้ผ้าโพกหัวที่พันไว้กันประกายไฟ วางลงบนทั่งข้างกระดาษไข เขาทั้งสองข้างโค้งขึ้นมาจากผมที่ชุ่มเหงื่อ แล้ววางข้อมือตัวเองลงบนแบบ ถามว่าข้อมือแบบนี้ใหญ่ไปไหม หรือต้องเล็กกว่านี้

        เสมียนยืนนิ่ง ปากเปิดค้าง เขาเก็บกระดาษไขกลับโดยไม่เก็บเงินมัดจำ แล้วเดินออกจากร้านเร็วกว่าตอนเดินเข้ามา เย็นนั้นชื่อร้านกับชื่อ{name}อยู่ในสมุดของศาสนจักรแล้ว ส่วนเหรียญมัดจำยังวางอยู่บนทั่ง
      effects: { gold: 3, stats: { CHA: 1 }, reputation: { lamp_church: -1 }, flags: [on_lamp_list] }
    - id: show_stumps
      label: ถอดผ้าโพกหัวออก ให้เขาเห็นตอเขาที่เลื่อยทิ้ง
      requires: { flag: horns_sawn }
      text: |
        {name}แก้ผ้าโพกหัวออก ใต้ผ้าคือตอเขาสองตอที่เลื่อยจนเรียบตั้งแต่ยังเป็นทารก ผิวตรงรอยเลื่อยขาวกว่าผิวรอบๆ เสมียนมองตอเขา แล้วมองกุญแจมือในแบบ

        {name}บอกว่าบ้านที่เลี้ยงมาเลื่อยให้ตั้งแต่คืนที่เกิด ถ้าเด็กหกคนนั้นมีคนเลื่อยให้ ก็ไม่ต้องใช้กุญแจ เสมียนเก็บกระดาษไขกลับไป ทิ้งเหรียญมัดจำไว้บนทั่ง ไม่มีใครกลับมาเอา ความลับที่บ้านเก็บมาทั้งชีวิตของ{name}ออกไปจากร้านพร้อมเขา
      effects: { gold: 3, alignment: { moral: 1 }, reputation: { lamp_church: -1 }, flags: [on_lamp_list, showed_stumps_to_lamp] }

- id: adult.job_merchant_hail
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_merchant]
  text: |
    เกวียนข้าวสารของ{name}ไปถึงหมู่บ้านนั้นหลังลูกเห็บตกได้สามวัน ทุ่งข้าวที่รอเกี่ยวอีกสิบวันล้มราบเหมือนหญ้าที่ฝูงควายเพิ่งเดินผ่าน หลังคาฟางทุกหลังมีรู ผู้คนในหมู่บ้านยืนดูเกวียนผ่านเข้ามาโดยไม่มีใครถามราคา เพราะไม่มีใครมีเงิน

    ที่ปากทางออกอีกฝั่ง คนของบริษัทเหมืองนั่งรออยู่บนม้า เขาจะซื้อข้าวทั้งเกวียนในราคาสามเท่าของตลาด เอาไปเลี้ยงคนงานเหมืองที่ต้องส่งถ่านให้ทันกำหนด จ่ายเป็นเหรียญเงินเดี๋ยวนี้ ส่วนหัวหน้าหมู่บ้าน หญิงแก่ที่หลังค่อม ขอซื้อเชื่อครึ่งเกวียน จะจ่ายหลังเกี่ยวรอบหน้า ถ้ารอบหน้ามี
  choices:
    - id: sell_company
      label: ขายทั้งเกวียนให้คนของบริษัท
      text: |
        คนของบริษัทนับเหรียญเงินให้บนหลังม้า ไม่ลงมาด้วยซ้ำ คนงานสองคนของเขาขับเกวียนของ{name}ออกจากหมู่บ้านไปเลย เกวียนเปล่าจะคืนให้ที่ปากทางเหมือง

        {name}เดินตามเกวียนออกไปทางเดียวกับที่เข้ามา หญิงแก่หลังค่อมยังยืนอยู่ตรงเดิม พอ{name}เดินมาใกล้ นางก็หันกลับเข้าบ้าน ไม่ว่าอะไรสักคำ
      effects: { gold: 12, alignment: { moral: -1 }, flags: [sold_grain_to_mine] }
    - id: sell_on_credit
      label: ขายเชื่อครึ่งเกวียนให้หมู่บ้าน อีกครึ่งขายบริษัท
      text: |
        {name}แบ่งข้าวสองกอง กองหนึ่งให้หัวหน้าหมู่บ้าน นางให้คนเขียนชื่อ{name}กับจำนวนกระสอบลงบนแผ่นไม้ แล้วตอกแผ่นไม้ติดเสากลางลาน ให้คนทั้งหมู่บ้านเห็นว่าติดใคร ติดเท่าไร อีกกองขายให้คนของบริษัทในราคาสามเท่าเหมือนเดิม

        เงินที่ได้พอทุนเที่ยวหน้า แต่ไม่เหลือกำไร ตอนออกจากหมู่บ้าน เด็กกลุ่มหนึ่งวิ่งตามเกวียนเปล่าไปจนถึงปากทาง
      effects: { gold: 4, alignment: { moral: 1 }, flags: [hail_village_credit] }
    - id: play_them_off
      label: บอกคนของบริษัทว่ามีคนให้ราคาดีกว่า แล้วต่อราคาให้หมู่บ้าน
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}บอกคนของบริษัทว่าโรงสีในถิ่นถัดไปให้ราคาสี่เท่า ถ้าเขาอยากได้ ต้องซื้อข้าวครึ่งเกวียนในราคานั้น อีกครึ่งเกวียนต้องจ่ายค่าข้าวแทนหมู่บ้านนี้ ข้าวเก็บไว้ที่หมู่บ้าน ไม่อย่างนั้น{name}จะขับเกวียนไปถิ่นถัดไป

          ที่ถิ่นถัดไปไม่มีโรงสี คนของบริษัทไม่รู้ เขาคิดอยู่ครู่หนึ่งแล้วนับเงินให้ หัวหน้าหมู่บ้านให้หลานชายตักข้าวครึ่งเกวียนลงยุ้ง แล้วยืนดูคนของบริษัทขี่ม้าจากไปด้วยหน้าตาของคนที่ไม่เคยเห็นใครทำแบบนี้มาก่อน
        effects: { gold: 8, stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [outbid_the_mine] }
      failure:
        text: |
          คนของบริษัทถามชื่อโรงสีในถิ่นถัดไป {name}นึกชื่อไม่ทัน เขายิ้ม แล้วลดราคาลงเหลือสองเท่า บอกว่าขายเดี๋ยวนี้หรือเข็นเกวียนไปขายลมที่ถิ่นถัดไปก็ได้

          {name}ขายให้เขาครึ่งเกวียนในราคานั้น อีกครึ่งขายเชื่อให้หมู่บ้าน แผ่นไม้ที่ตอกติดเสากลางลานมีชื่อ{name}อยู่บรรทัดแรก
        effects: { gold: 2, alignment: { moral: 1 }, flags: [hail_village_credit] }

- id: adult.job_clerk_child_debt
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_clerk]
  text: |
    งานเช้านั้นเป็นงานคัดหนี้โอนชื่อ ทอมลิน คนขายถ่านในตลาดล่าง ตายไปเมื่อเดือนก่อน ทิ้งหนี้วิหารไว้สี่สิบเอ็ดเหรียญ สัญญาเขียนไว้ว่าหนี้ของคนตายตกเป็นของลูกคนโต เมื่อลูกคนนั้นอายุครบสิบหก

    ลูกคนโตของทอมลินชื่อมีลา อายุหกขวบ วันนี้นางมากับแม่ ยืนเกาะขอบโต๊ะ มองปากกาของ{name}ไล่ตัวหนังสือไปทีละบรรทัด แม่ของนางอ่านหนังสือไม่ออก นางถามว่าลูกต้องลงชื่อตรงไหน

    เสมียนใหญ่นั่งอยู่โต๊ะถัดไป {name}รู้ว่าเบเลคไม่ขีดอะไรทิ้ง แต่ทุกสัญญาในวิหารต้องผ่านมือเสมียน และเสมียนเป็นคนเก็บเข้าลิ้นชัก
  choices:
    - id: copy_it_true
      label: คัดตามสัญญาทุกตัวอักษร
      text: |
        {name}คัดจบในหน้าเดียว ไม่ผิดสักจุด แล้วหันสมุดให้แม่ของมีลาประทับนิ้วโป้ง นางกดนิ้วลงไปแรงจนหมึกซึมทะลุกระดาษ มีลาขอประทับด้วย {name}บอกว่ายังไม่ต้อง อีกสิบปีค่อยมา

        เสมียนใหญ่ตรวจหน้านั้นตอนเย็น แล้วบอกว่าลายมือของ{name}เป็นลายมือที่วิหารวางใจได้
      effects: { stats: { INT: 1 }, alignment: { law: 1, moral: -1 }, reputation: { belek_bank: 1 }, flags: [copied_child_debt] }
    - id: misfile_it
      label: คัดให้ครบ แล้วเก็บหน้านั้นเข้าลิ้นชักผิดปี
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          ลิ้นชักสัญญาในห้องหลังเรียงตามปีที่หนี้ครบกำหนด {name}คัดหนี้ของมีลาครบทุกตัวอักษร แล้วเก็บหน้านั้นเข้าลิ้นชักปีที่ห้าสิบเอ็ดนับจากวันนี้ ในวิหารไม่มีเสมียนคนไหนเปิดลิ้นชักที่ไกลขนาดนั้น

          หนี้ไม่ได้หายไปไหน ยังอยู่ครบทุกบรรทัด เบเลคจะได้คืนทุกเหรียญ แต่ใบทวงจะไปถึงมือมีลาตอนนางอายุห้าสิบเจ็ด ไม่ใช่สิบหก
        effects: { stats: { DEX: 1 }, alignment: { law: -1, moral: 1 }, flags: [misfiled_child_debt] }
      failure:
        text: |
          เสมียนใหญ่เดินเข้ามาในห้องหลังตอนที่{name}ยังจับลิ้นชักปีที่ห้าสิบเอ็ดค้างอยู่ เขาไม่ถาม เขาเอื้อมมือมาหยิบหน้านั้นจากมือ{name} แล้วเก็บเข้าลิ้นชักที่ถูกต้องเอง

          เดือนนั้นค่าแรงของ{name}หายไปสองเหรียญ ในสมุดเสมียนมีบรรทัดใหม่หนึ่งบรรทัดใต้ชื่อ{name} เขียนว่าเก็บเอกสารผิดที่ครั้งที่หนึ่ง เบเลคไม่ขีดบรรทัดนี้ทิ้งเหมือนกัน
        effects: { gold: -2, reputation: { belek_bank: -1 }, flags: [clerk_on_warning] }
    - id: find_the_clause
      label: อ่านสัญญาทั้งฉบับหาช่องที่ให้จ่ายหนี้ด้วยแรงงาน
      check: { stat: INT, dc: 15 }
      success:
        text: |
          สัญญาของทอมลินยาวสิบเก้าหน้า บรรทัดที่{name}ต้องการอยู่หน้าสิบสี่ ตัวหนังสือเล็กกว่าบรรทัดอื่น เขียนว่าทายาทที่ยังไม่บรรลุนิติภาวะ ให้ผู้ปกครองชำระแทนด้วยแรงงานในวิหารได้ คิดวันละครึ่งเหรียญ

          {name}อ่านบรรทัดนั้นให้แม่ของมีลาฟังสองรอบ นางเริ่มมาขัดพื้นวิหารตั้งแต่เช้าวันต่อมา สามเดือนจบ เสมียนใหญ่ถามว่า{name}รู้จักหน้าสิบสี่ได้อย่างไร ทั้งวิหารเหลือคนอ่านถึงหน้านั้นอยู่สองคน
        effects: { stats: { INT: 1 }, alignment: { moral: 1, law: 1 }, flags: [found_belek_clause] }
      failure:
        text: |
          {name}อ่านสัญญาทั้งสิบเก้าหน้าจนเที่ยงคืน แล้วอ่านซ้ำอีกรอบ ไม่มีบรรทัดไหนเปิดช่องให้ใคร ทุกบรรทัดปิดตายเหมือนกำแพงหินที่ก่อไว้ไม่ให้ลมผ่าน

          เช้าวันต่อมา{name}คัดหนี้ของมีลาตามสัญญา แม่ของนางประทับนิ้วโป้ง ส่วน{name}จำสัญญาฉบับนั้นได้ทั้งฉบับ ตั้งแต่บรรทัดแรกถึงบรรทัดสุดท้าย
        effects: { stats: { WIS: 1 }, flags: [copied_child_debt] }

- id: adult.job_bough_cut
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_bough_crafter]
  text: |
    พ่อค้าไม้จากเวนทราสขึ้นมาถึงหมู่บ้านตีนไม้พร้อมเกวียนสามเล่ม เขาซื้อไม้ที่ป่าทิ้งลงมาในฤดูลมทุกปี ปีนี้ให้ราคาดีกว่าทุกปี เพราะอู่ต่อเรือในเมืองต้องการไม้ไอเลธ ไม้ที่เบาและไม่ผุ

    ไม้ที่กองรอขายบนลานมีกิ่งหนึ่งที่{name}หยุดดู ปลายกิ่งเรียบเกินไป เส้นไม้ไม่ฉีกเหมือนกิ่งที่หักเอง เป็นรอยเลื่อย ทาดินทับไว้ให้ดูเก่า ข้างกิ่งนั้น เอลริน เอลฟ์หนุ่มบ้านถัดไป ยืนนับเหรียญที่พ่อค้าจ่ายล่วงหน้าอยู่ บ้านของเขาติดหนี้คนตีนไม้มาตั้งแต่ปีที่แม่เขาป่วย
  choices:
    - id: tell_the_elders
      label: ไปบอกผู้เฒ่าว่ามีคนเลื่อยกิ่ง
      text: |
        ผู้เฒ่าลงมาดูกิ่งนั้นด้วยตัวเอง แตะปลายกิ่งด้วยนิ้วเดียว แล้วสั่งให้พ่อค้าคืนกิ่งนั้นกับไม้ทุกท่อนที่ซื้อจากบ้านของเอลริน พ่อค้ายอมทำตามเพราะยังอยากซื้อไม้จากหมู่บ้านนี้ปีหน้า

        เอลรินต้องลงไปช่วยงานบ้านตีนไม้หนึ่งฤดู ไม่ได้ขึ้นกิ่ง ก่อนลงไปเขาเดินผ่านบ้านของ{name} หยุดตรงบันไดเชือกครู่หนึ่ง แล้วลงไปโดยไม่ได้เรียกใคร
      effects: { alignment: { law: 1 }, stats: { WIS: 1 }, flags: [reported_branch_cutter] }
    - id: talk_to_him
      label: ดึงเอลรินไปคุยหลังลาน ให้เขาเอาเงินคืนเอง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ไม่พูดเรื่องรอยเลื่อย พูดเรื่องหนี้ของบ้านเขา ถามว่าติดเท่าไร เอลรินตอบตัวเลขที่ไม่มากเท่าที่{name}คิด แล้วเงียบ {name}บอกว่าถ้าเขาเอาเงินคืนพ่อค้าแล้วเก็บกิ่งนั้นไว้ {name}จะช่วยทำกี่ทอผ้าขายให้ทั้งฤดู ได้เงินมาเท่าไรเอาไปใช้หนี้

          เอลรินเดินไปคืนเงินเอง ฤดูนั้นทั้งสองทำกี่ได้สี่ตัว ขายได้ราคาดี กิ่งที่มีรอยเลื่อยกลายเป็นคานกี่ตัวที่สี่ ตัวที่เอลรินเก็บไว้ใช้เอง
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [helped_sithran] }
      failure:
        text: |
          เอลรินบอกว่า{name}ไม่รู้ว่าหนี้ของบ้านเขาเป็นอย่างไร ป่าไม่เคยทิ้งกิ่งลงมาพอให้บ้านไหนใช้หนี้ได้ แล้วเดินกลับไปที่เกวียน

          กิ่งนั้นลงไปเวนทราสพร้อมไม้ท่อนอื่น {name}ไม่ได้บอกใคร ปีต่อมามีกิ่งที่ปลายเรียบเกินไปบนลานเพิ่มเป็นสามกิ่ง
        effects: { stats: { WIS: 1 }, flags: [sithran_kept_cutting] }
    - id: buy_it_quiet
      label: ซื้อกิ่งนั้นจากพ่อค้าไว้เอง ไม่ให้มันลงไปเมือง
      requires: { min_gold: 3 }
      text: |
        {name}จ่ายพ่อค้าไปสามเหรียญ มากกว่าที่เขาจ่ายเอลรินสองเหรียญ พ่อค้าไม่ถามว่าจะเอาไปทำอะไร กิ่งนั้นอยู่ใต้บ้านของ{name}จนแห้งสนิท ปลายที่มีรอยเลื่อยค่อยๆ ซีดลงจนเหมือนกิ่งที่หักเอง

        เอลรินรู้ว่าใครซื้อไป เขามาช่วย{name}ไสกิ่งนั้นเป็นคานโดยไม่มีใครขอ ไสอยู่สามวัน ไม่ได้พูดถึงรอยเลื่อยสักคำ
      effects: { gold: -3, alignment: { moral: 1, law: -1 }, flags: [bought_cut_branch] }
