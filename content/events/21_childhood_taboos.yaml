# วัยเด็ก ข้อห้ามของแผ่นดิน (ชุด 4)
# เจ้าเดิมเจ็ดตน ตนละสองเรื่อง: เรื่องที่คนแก่สอน (อายุ 5–9) กับเรื่องที่ไม่มีใครเห็น (อายุ 7–11)
# เด็กไม่รู้ว่าห้ามเพราะอะไร คนสอนก็ไม่รู้ ไม่มีเจ้าเดิมโผล่มา มีได้แค่ลางที่เล็กพอให้สงสัย
# ห้ามใช้ {father} {mother}: เด็กวิหาร เด็กที่บ้านซ่อนไว้ และเด็กที่พ่อไปรบ ต้องอ่านเรื่องเดียวกันได้
# ไฟ: ทุกบ้านที่มีเตา ยกเว้นบ้านบนกิ่งของเอลฟ์ คนเฝ้าเตาสอนข้อหน้าต่างของคนตายไปพร้อมกัน (wind: learn)
#   เพื่อให้เรื่องทดสอบข้อหน้าต่าง (ไม่ผูกถิ่น) ออกได้กับเด็กทุกถิ่น ไม่ใช่แค่เด็กไอเลธ
# คนใหม่ในไฟล์นี้: ยายเมลวา (ท่าน้ำเวนทราส) ตาฮอบเรน (คนไถนาทุ่งอาร์เวล) ย่าทวดบาร์กา (ตระกูลคนแคระ)
#   ท่านซาลิเวน กับท่านอิลเรีย (บ้านกิ่งลม) ตาคัสเวล (คนนำเกวียนกลางคืนของบ้านหญ้าเงิน)

# ---------- แม่น้ำเฒ่า (เวนทราส) ----------

- id: childhood.taboo_river_first_coin
  stage: childhood
  scene: land_river
  weight: 20
  when:
    age: [5, 9]
    location_tag: ventras
  text: |
    เช้ามืดวันแรกของปี บันไดหินที่ลงไปถึงน้ำยังเปียกน้ำค้าง ตะเกียงตามหัวเรือแขวนเป็นจุดเหลืองเรียงไปตลอดคลอง ไม่มีใครพูดเสียงดัง คนเรือแก่ๆ ลงไปยืนกันที่ขั้นล่างสุดทีละคน แต่ละคนกำเหรียญไว้คนละเหรียญ

    ยายเมลวาซักผ้าอยู่บนขั้นที่สามมาตั้งแต่ก่อนคนในละแวกนี้ครึ่งหนึ่งจะเกิด แกกดเหรียญทองแดงลงในมือ{name}หนึ่งเหรียญ เหรียญยังอุ่นจากกระเป๋าเสื้อของแก "เหรียญแรกของหนูปีนี้" แกว่า "โยนลงน้ำ"

    {name}ถามว่าทำไม ยายเมลวาเช็ดมือเปียกกับผ้ากันเปื้อนซ้ำไปซ้ำมา แล้วบอกว่าแม่ของแกก็สั่งแกอย่างนี้ แกก็ไม่เคยถาม ส่วนเหรียญหนึ่งเหรียญ แกบอกเองว่าซื้อขนมปังได้สองก้อน
  choices:
    - id: throw_it
      label: เหวี่ยงเหรียญลงน้ำให้ไกลเท่าคนเรือ
      text: |
        {name}เหวี่ยงแขนสุดแรง เหรียญลอยข้ามหัวเรือลำหน้าไปตกกลางคลอง น้ำรับไปเฉยๆ ไม่มีเสียงจ๋อม ไม่มีวงกระเพื่อม {name}ชะโงกหาจนยายต้องดึงคอเสื้อไว้

        คนเรือแก่ที่ขั้นล่างหันขึ้นมาดู แล้วโยนเหรียญของตัวเองตาม เขาโยนเบากว่า ใกล้กว่า เหรียญของเขาดังจ๋อมเหมือนเหรียญทั่วไป
      effects: { taboo: { river: keep }, flags: [threw_the_first_coin] }
    - id: palm_it
      label: ทำท่าโยน แต่ไม่คลายนิ้ว
      text: |
        {name}เหวี่ยงแขนเท่ากับคนเรือ นิ้วยังกำแน่น ยายเมลวาก้มลงขยี้ผ้าอยู่ไม่ทันเห็น คนเรือแก่ที่ขั้นล่างเห็น เขาไม่ว่าอะไร แค่หันหลังให้จนพายเรือออกไป

        สายวันนั้น{name}ซื้อขนมปังได้สองก้อนจริงอย่างที่ยายบอก นั่งกินบนขั้นที่ยายซักผ้า น้ำซึมขึ้นมาเปียกก้นกางเกงทั้งแผ่น ตอนที่คนเรือคุยกันว่าเช้านี้น้ำลงต่ำกว่าทุกปี
      effects: { taboo: { river: break }, flags: [kept_the_first_coin] }
    - id: give_it_back
      label: ยื่นเหรียญคืน ขอให้ยายโยนแทน แล้วยืนดู
      text: |
        ยายเมลวารับเหรียญไปชั่งในมือ แล้วโยนลงน้ำโดยไม่ลุกจากขั้นบันได เหรียญตกห่างไปแค่ช่วงแขน จมลงตรงที่แกซักผ้ามาทั้งชีวิต

        {name}ยืนดูคนเรือโยนกันจนฟ้าสาง นับได้สิบเจ็ดเหรียญ บางคนพึมพำอะไรกับน้ำก่อนโยน บางคนไม่ คนที่พึมพำพูดเบาจนได้ยินแค่ท่อนท้าย ฟังเหมือนคนบอกเจ้าของบ้านว่าค่าเช่าเดือนนี้มาแล้ว
      effects: { taboo: { river: learn }, stats: { WIS: 1 }, flags: [watched_the_coin_steps] }

- id: childhood.taboo_river_night_pail
  stage: childhood
  weight: 20
  time: night
  when:
    age: [7, 11]
    location_tag: ventras
    taboo: { id: river, taught: true }
  text: |
    ฝนตกมาตั้งแต่หัวค่ำ คนที่ต้องเอาถังน้ำล้างหม้อไปเททิ้งคืนนี้นอนเป็นไข้ งานนั้นจึงตกมาถึง{name} ถังไม้หนักเกือบเท่าตัว ในถังมีน้ำมันลอยหน้า เศษผัก กากชา กับกลิ่นที่ต้องหันหน้าหนีตอนยก

    บ่อเกรอะอยู่สุดลานหลังบ้าน ทางไปเป็นดินเหนียว มืดทั้งทาง ส่วนหน้าต่างครัวเปิดออกไปเหนือร่องน้ำที่ไหลลงคลองพอดี ฝนตกใส่ร่องดังซู่ เทตรงนี้ไม่มีใครได้ยิน พรุ่งนี้เช้าน้ำในร่องก็พาไปหมดแล้ว

    ทุกคนในบ้านหลับ {name}ยืนถือหูถังอยู่ข้างหน้าต่าง ละอองฝนสาดเข้ามาเกาะแขนเป็นเม็ด
  choices:
    - id: carry_to_the_pit
      label: หิ้วถังฝ่าฝนไปเทที่บ่อเกรอะสุดลาน
      text: |
        ครึ่งทาง{name}ลื่นล้มลงในดินเหนียว ถังไม่คว่ำ แต่น้ำกระฉอกออกมารดขากางเกงทั้งสองข้าง ไปถึงบ่อ เทเสร็จ เดินกลับมาก็เปียกถึงเนื้อทั้งตัว

        คืนนั้น{name}นอนตัวสั่นอยู่ใต้ผ้าห่มผืนเดียว กลิ่นน้ำล้างหม้อไม่ยอมออกจากซอกเล็บ เช้ามาจามติดกันจนแม่ครัวบ้านข้างๆ ถามว่าเมื่อคืนไปลอยคออยู่ที่ไหนมา
      effects: { hp: -1, taboo: { river: keep }, flags: [carried_the_pail_in_rain] }
    - id: tip_it_out
      label: เทลงร่องน้ำทางหน้าต่าง
      text: |
        น้ำล้างหม้อลงร่องไปเสียงเดียวกับฝน {name}คว่ำถังไว้ที่เดิม ปิดหน้าต่าง กลับไปมุดผ้าห่มที่ยังอุ่น

        ก่อนหลับ{name}ได้ยินร่องน้ำใต้หน้าต่างครางขึ้นมาทีหนึ่ง ต่ำและยาว เสียงของคนกลืนของชิ้นใหญ่เกินคอ แล้วก็ไหลต่อตามปกติ
      effects: { hp: 1, taboo: { river: break }, flags: [tipped_the_pail_in_the_drain] }
    - id: run_between_gusts
      label: ถอดรองเท้า รอฝนซา แล้ววิ่งไปให้ถึงบ่อในรวดเดียว
      check: { stat: DEX, dc: 11 }
      success:
        text: |
          ฝนซาลงชั่วอึดใจ {name}วิ่งเท้าเปล่าข้ามลาน ดินเหนียวดูดเท้าทุกก้าวแต่ไม่ได้ล้ม เทถังลงบ่อแล้ววิ่งกลับมาถึงชายคาพอดีกับที่ฝนกระหน่ำลงมาอีกรอบ

          เปียกแค่หัวกับไหล่ กับเท้าที่ดำถึงข้อ {name}ล้างเท้าในน้ำฝนจากรางแล้วขึ้นนอน ไม่มีใครในบ้านรู้ว่าคืนนั้นมีคนออกไปข้างนอก
        effects: { stats: { DEX: 1 }, taboo: { river: keep }, flags: [carried_the_pail_in_rain] }
      failure:
        text: |
          ก้าวที่สามเท้าลื่น {name}ล้มคว่ำ ถังหลุดมือกลิ้งไปทางร่องน้ำ น้ำในถังไหลลงร่องหมดก่อนจะคลานไปคว้าทัน แล้วไหลต่อลงคลอง

          {name}หิ้วถังเปล่ากลับเข้าบ้าน เข่าถลอกทั้งสองข้าง ไม่บอกใคร ตีสามร่องน้ำใต้หน้าต่างครางขึ้นมาทีหนึ่ง ตอนนั้น{name}ยังไม่หลับ
        effects: { hp: -1, taboo: { river: break }, flags: [tipped_the_pail_in_the_drain] }

# ---------- วัวใต้ทุ่ง (ทุ่งอาร์เวล) ----------

- id: childhood.taboo_field_round_the_mound
  stage: childhood
  scene: land_field
  weight: 20
  when:
    age: [5, 9]
    location_tag: arvel_village
  text: |
    ตาฮอบเรนถือคันไถมานานกว่าใครในละแวก มือแกด้านจนหยิบถ่านแดงออกจากเตาได้ เลยหน้าเกี่ยวทุกปี แกให้เด็กที่ตัวโตพอจะจูงวัวมาช่วยจูง ค่าจ้างคือมันเผาหนึ่งหัวตอนเที่ยง ปีนี้ถึงตา{name}

    {name}จูงเชือกจมูกวัวเดินนำไปตามร่อง ดินหลังผาลไถเป็นสีน้ำตาลเข้ม กลิ่นเหมือนห้องใต้ดินที่เพิ่งเปิด กลางแปลงมีเนินเตี้ยๆ สูงไม่ถึงเข่า หญ้าคลุมเต็ม พอไถมาถึงเนิน ตาฮอบเรนดึงคันไถให้เลี้ยวอ้อม ร่องโค้งรอบเนินแล้วกลับมาตรงอีกฝั่ง

    ทุกแปลงในละแวกที่มีเนินแบบนี้ ร่องไถโค้งอ้อมทุกแปลง {name}ถามว่าทำไมไม่ไถข้ามไปเลย ตาฮอบเรนถ่มน้ำลายลงดิน เช็ดปาก แล้วบอกว่าพ่อแกก็อ้อม ปู่แกก็อ้อม แกไม่เคยถาม ถ้าไถข้ามแล้วจะเป็นอย่างไรแกก็ไม่รู้ ไม่เคยมีใครในละแวกนี้ลอง
  choices:
    - id: lead_round
      label: เลี้ยววัวอ้อมเนินเองในรอบถัดไป
      text: |
        รอบถัดไป{name}เลี้ยววัวก่อนตาฮอบเรนจะดึงคันไถ เลี้ยวกว้างไปหน่อย ร่องไถเลยโค้งออกเป็นพุง ตาฮอบเรนหัวเราะจนไอ บอกว่าพุงแบบนี้ใครผ่านมาก็รู้ว่าเด็กไถ

        จนตะวันคล้อย{name}อ้อมเนินได้เจ็ดรอบ รอบหลังๆ โค้งทับรอยของปีก่อนพอดี มันเผาที่ได้ตอนเที่ยงหัวใหญ่กว่าที่ตกลงกันไว้
      effects: { taboo: { field: keep }, flags: [led_the_plough_round] }
    - id: pull_straight
      label: ตอนตาก้มลงแกะผาล ดึงวัวให้เดินตรงขึ้นเนินไป
      text: |
        ตาฮอบเรนก้มลงแกะหินออกจากผาลไถ {name}ดึงเชือกจมูกตรงไปข้างหน้า วัวเดินขึ้นเนินได้สามก้าวแล้วหยุด ขาหน้าเกร็ง ดึงเท่าไรก็ไม่ไป ผาลที่ลากตามมากรีดหญ้าบนเนินเป็นทางยาวช่วงหนึ่ง ดินใต้หญ้าอุ่นเหมือนหลังวัวที่นอนแดดมาทั้งวัน

        ตาฮอบเรนเงยหน้ามาเห็น แกไม่ดุ แกเดินมาเอาส้นเท้าเกลี่ยดินกลบรอยนั้นจนเรียบ แล้วจูงวัวลงจากเนินเอง บ่ายนั้นแกไม่ชวนคุยอีก มันเผาตอนเที่ยงแกก็ยังให้ครบหัว
      effects: { taboo: { field: break }, flags: [ploughed_over_the_mound] }
    - id: sit_and_watch
      label: ขอนั่งดูบนคันนาหนึ่งรอบก่อน
      text: |
        {name}นั่งบนคันนาดูตาฮอบเรนไถอ้อมเนินคนเดียว รอบแล้วรอบเล่า ไม่มีรอบไหนที่ผาลเข้าใกล้เนินเกินหนึ่งช่วงเท้า ร่องใหม่ทับรอยปีก่อน รอยปีก่อนทับรอยปีก่อนนั้นอีกที

        ใกล้เที่ยง{name}เห็นว่าบนเนินไม่มีรอยเท้าวัว ไม่มีรอยคน รอยกระต่ายก็ไม่มี หญ้าบนนั้นไม่เคยมีใครหว่าน แต่สูงกว่าหญ้าที่อื่นในแปลงทุกกอ
      effects: { taboo: { field: learn }, stats: { WIS: 1 }, flags: [watched_the_plough_go_round] }

- id: childhood.taboo_field_last_sheaf
  stage: childhood
  weight: 20
  time: dusk
  when:
    age: [7, 11]
    location_tag: arvel_village
    taboo: { id: field, taught: true }
  text: |
    ปีนี้ข้าวลีบ ฝนมาช้าแล้วก็มาไม่พอ รวงที่เกี่ยวได้เบาจนหอบได้ทีละสามฟ่อน ทุกบ้านในละแวกต้มข้าวต้มใส่น้ำมากกว่าข้าว ผู้ใหญ่บ่นเรื่องภาษีกับราคาเกลือกันทุกมื้อ

    เย็นวันสุดท้ายของหน้าเกี่ยว งานเก็บรวงตกตามร่องในแปลงริมคลองเป็นของ{name} ปลายแปลงมีข้าวกอสุดท้ายยืนอยู่กอเดียว เป็นกอที่ทุกแปลงเว้นไว้ทุกปี ปีอื่น{name}เดินผ่านไม่เคยหันไปดู ปีนี้รวงทั้งแปลงลีบ แต่รวงในกอนั้นอ้วนจนโน้มลงแตะดิน เมล็ดเต็มทุกเมล็ด

    ในถุงมีรวงตกที่เก็บมาทั้งเย็นแค่ครึ่งกำมือ เคียวเล่มเล็กเหน็บอยู่ที่เอว ตะวันลงไปครึ่งดวงแล้ว ทั่วทุ่งไม่มีใครเหลือนอกจากอีกาสองตัวบนคันนา
  choices:
    - id: leave_it_standing
      label: ปล่อยกอนั้นไว้ เดินกลับบ้านพร้อมถุงที่แทบเปล่า
      text: |
        ครึ่งกำมือในถุงได้ข้าวต้มแค่หม้อเล็ก คนที่บ้านถามว่าเก็บมาทั้งเย็นได้แค่นี้หรือ {name}ไม่ตอบ คืนนั้นข้าวต้มแบ่งกันกินทั้งบ้าน ชามของ{name}มีแต่น้ำเกือบทั้งชาม

        เช้ามา{name}แอบเดินไปดูอีกที อีกาสองตัวเดินวนรอบกอนั้นอยู่ทั้งเช้า วนแคบเข้ามาแล้วถอยออกไป ไม่มีตัวไหนลงจิกสักเม็ด
      effects: { hp: -1, taboo: { field: keep }, flags: [left_the_thin_years_sheaf] }
    - id: cut_it
      label: เกี่ยวกอนั้นใส่ถุง
      text: |
        เคียวเล่มเล็กตัดสามทีก็ขาด รวงหนักจน{name}ต้องหอบด้วยสองแขน ข้าวในกอเดียวได้มากกว่ารวงตกทั้งแปลง คนที่บ้านเห็นถุงแล้วไม่ถามสักคำ หุงข้าวสวยกินกันได้สองมื้อ เป็นมื้อแรกตั้งแต่ต้นหน้าเกี่ยวที่ในชามไม่มีน้ำ

        ปีต่อมาตรงที่กอนั้นเคยยืน ข้าวไม่ขึ้นไม่ว่าหว่านซ้ำกี่รอบ ดินเป็นวงเกลี้ยงกว้างเท่าโต๊ะกินข้าว คนเก่าแก่ในละแวกเดินผ่านแล้วหันมองหน้ากันเอง
      effects: { hp: 1, taboo: { field: break }, flags: [cut_the_thin_years_sheaf] }
    - id: glean_harder
      label: คลานเก็บรวงตกตามคันนาจนกว่าจะมืด ถ้าได้พอก็ไม่ต้องแตะกอนั้น
      check: { stat: WIS, dc: 11 }
      success:
        text: |
          {name}เลิกเดินตามร่อง เปลี่ยนไปคลานตามคันนาที่คนแบกฟ่อนเดินผ่าน รวงตกตรงนั้นมากกว่า เพราะคนแบกเหนื่อยจนไม่ก้มเก็บ ตะวันตกดินพอดีกับที่ถุงเต็มครึ่ง

          ข้าวต้มคืนนั้นข้นกว่าทุกคืนในหน้าเกี่ยว คนที่บ้านถามว่าไปได้มาจากแปลงไหน {name}บอกว่าจากคันนา ไม่มีใครเชื่อ แต่ทุกคนกินจนหมดหม้อ
        effects: { stats: { WIS: 1 }, taboo: { field: keep }, flags: [left_the_thin_years_sheaf] }
      failure:
        text: |
          มืดเร็วกว่าที่คิด {name}คลำหารวงตกจนตอซังบาดนิ้วเลือดซิบ ได้เพิ่มมาไม่ถึงกำมือ ขากลับตกคันนาลงไปในโคลนครึ่งตัว

          จากหัวสะพาน{name}หันกลับไปดู กลางทุ่งที่มืดหมดแล้วมีรวงขาวๆ โน้มอยู่เป็นจุดเดียว ถุงที่หิ้วกลับบ้านเบาเกือบเท่าตอนออกไป
        effects: { hp: -1, taboo: { field: keep }, flags: [left_the_thin_years_sheaf] }

# ---------- ยายหมีหิน (ฮอร์ดุน) ----------

- id: childhood.taboo_stone_three_knocks
  stage: childhood
  weight: 20
  when:
    age: [5, 9]
    location_tag: hordun
  text: |
    เด็กตระกูลคนแคระได้สิ่วเล่มแรกเมื่อมือใหญ่พอจะกำด้ามได้รอบ ไม่มีพิธีอะไร คนแก่ที่สุดของตระกูลพาไปที่ห้องหินท้ายสุดของบ้าน ตรงผนังที่เว้นไว้ให้เด็กหัดสกัด ผนังนั้นเป็นหลุมเป็นบ่อจากมือเด็กมาหลายรุ่น

    ย่าทวดบาร์กาแก่จนต้องมีหลานคอยประคองเวลาลงบันได แต่มือที่จับค้อนยังไม่สั่น แกยื่นสิ่วกับค้อนเล็กให้{name} แล้วจับมืออีกข้างของ{name}กำเป็นหมัด เคาะผนังสามครั้ง ช้าๆ ห่างกันเท่าลมหายใจ ก๊อก ก๊อก ก๊อก แล้วจึงให้วางสิ่ว

    "ทุกครั้ง ก่อนเหล็กแตะหิน สามครั้ง ไม่ต้องดัง ให้ชัด" {name}ถามว่าเคาะบอกใคร ย่าทวดหัวเราะในคอ บอกว่าตอนแกตัวเท่านี้แกก็ถามคำนี้ คนที่สอนแกตอบว่าไม่รู้ คนที่สอนคนนั้นก็ตอบว่าไม่รู้ ย้อนขึ้นไปทุกรุ่นตอบเหมือนกันหมด
  choices:
    - id: knock_properly
      label: กำหมัด เคาะสามครั้งตามจังหวะของย่าทวด แล้วค่อยลงสิ่ว
      text: |
        {name}เคาะช้าๆ ครั้งที่สามเสียงทุ้มกว่าสองครั้งแรก ผนังตรงนั้นเป็นหินตันทั้งก้อน {name}จะเคาะซ้ำอีกทีเพื่อฟัง ย่าทวดตีหลังมือเบาๆ บอกว่าสามพอ

        สิ่วแรกที่ลงไปได้สะเก็ดหินแผ่นใหญ่กว่าที่ค้อนเล็กขนาดนี้ควรได้ หลุดออกมาเรียบตามแนวที่จ่อไว้ ย่าทวดหยิบไปพลิกดูสองด้าน แล้วเก็บใส่กระเป๋าเสื้อของแกเอง
      effects: { taboo: { stone: keep }, flags: [knocked_before_the_first_chisel] }
    - id: just_strike
      label: จ่อสิ่วแล้วตอกเลย
      text: |
        {name}ตอกทีเดียว สะเก็ดหินกระเด็นโดนแก้ม ผนังตรงนั้นร้าวเป็นทางยาวเกินกว่าค้อนเล็กขนาดนี้จะทำได้ ย่าทวดบาร์กาไม่ดุ แกเอานิ้วไล่ตามรอยร้าวจนสุด แล้วเคาะสามครั้งเองตรงปลายรอย

        คืนนั้นตอนกินข้าว แกเล่าให้ทั้งตระกูลฟังว่า{name}ลงสิ่วครั้งแรกโดยไม่เคาะ เล่าเหมือนเล่าว่าเด็กทำชามแตก ไม่มีใครหัวเราะ ลุงคนหนึ่งเคาะโต๊ะสามครั้งก่อนตักแกง
      effects: { taboo: { stone: break }, flags: [struck_without_knocking] }
    - id: watch_her_knock
      label: ขอดูย่าทวดสกัดหนึ่งรอบก่อน
      text: |
        ย่าทวดเคาะสามครั้งทุกครั้งที่ย้ายจุด ไม่เคยข้าม ไม่เคยเคาะเป็นสี่ แกสกัดช้ากว่าที่{name}คิด แต่ไม่มีสะเก็ดไหนกระเด็นผิดทาง หินหลุดออกมาเป็นแผ่นบางเท่ากันทุกแผ่น วางเรียงไว้บนพื้นเป็นแถว

        {name}นับได้ว่าแกเคาะทั้งหมดสามสิบหกครั้ง ได้หินสิบสองแผ่น พอบอกตัวเลขให้แกฟัง แกยื่นค้อนให้แล้วบอกว่าคนที่นับเป็นก็เคาะเป็น
      effects: { taboo: { stone: learn }, stats: { INT: 1 }, flags: [watched_the_eldest_knock] }

- id: childhood.taboo_stone_cold_month_dare
  stage: childhood
  weight: 20
  when:
    age: [7, 11]
    location_tag: hordun
    taboo: { id: stone, taught: true }
  text: |
    เดือนที่หนาวที่สุดของปี เหมืองทุกสายของฮอร์ดุนปิด คนแคระไม่ขุดในเดือนนี้มาตั้งแต่ก่อนมีเมือง ผู้ใหญ่นั่งซ่อมเครื่องมืออยู่ในห้องหิน เด็กไม่มีที่ไปนอกจากถนนวนกับบันไดที่น้ำแข็งเกาะทุกขั้น

    ข้างบันไดลงชั้นล่างมีปากอุโมงค์เก่า แผ่นไม้ตอกปิดไว้แค่ครึ่ง ข้างในเป็นทางเจาะสั้นๆ ที่เลิกใช้ไปก่อนพ่อแม่ของใครจะเกิด สุดทางมีสายแร่ใสเส้นหนึ่งเรืองขึ้นมาเวลาเอาตะเกียงส่อง เด็กโตห้าคนยืนล้อมปากอุโมงค์อยู่ คนที่ตัวใหญ่ที่สุดชูน้ำตาลกรวดก้อนเท่านิ้วโป้งขึ้นให้ดู

    "ใครลงไปสกัดแร่ใสขึ้นมาได้ เอาไปเลยทั้งก้อน" เขาว่า แล้วหันมาที่{name} เพราะ{name}ตัวเล็กที่สุด มุดแผ่นไม้ได้คนเดียว แถวนั้นไม่มีผู้ใหญ่สักคน
  choices:
    - id: refuse_the_dare
      label: บอกว่าไม่ลง เดือนนี้ไม่ลง
      text: |
        เด็กโตหัวเราะกันทั้งวง คนตัวใหญ่ดึงหมวกขนสัตว์ออกจากหัว{name}โยนข้ามราวบันไดลงไปชั้นล่าง แล้วผลักให้ล้มลงกองหิมะข้างทาง

        {name}เดินกลับห้องหินโดยไม่มีหมวก ใบหูแดงจนจับไม่ได้ไปสามวัน หมวกใบนั้นไม่มีใครเก็บมาคืน
      effects: { hp: -1, taboo: { stone: keep }, flags: [refused_the_cold_month_dare] }
    - id: go_down
      label: มุดแผ่นไม้ ลงไปให้ถึงหน้าหิน
      text: |
        ข้างในหนาวกว่าข้างนอก ลมจากข้างล่างพัดขึ้นมาเป็นจังหวะ ช้า ยาว พัดขึ้นแล้วหยุด พัดขึ้นแล้วหยุด {name}คลำผนังไปจนถึงหน้าหิน สายแร่ใสเรืองอยู่ใต้น้ำแข็งบางๆ สกัดสองทีก็ได้ชิ้นเท่าเล็บ

        ขึ้นมาถึงปากอุโมงค์ เด็กโตเงียบกันทั้งวง คนตัวใหญ่ส่งน้ำตาลกรวดให้กับเหรียญทองแดงอีกเหรียญ บอกว่าเหรียญนี้ไม่ได้ท้าไว้ แต่ให้ ชิ้นแร่ใสในกำมือของ{name}ไม่ยอมอุ่นขึ้นเลยจนถึงเย็น
      effects: { gold: 1, taboo: { stone: break }, flags: [went_down_in_the_cold_month] }
    - id: counter_dare
      label: ท้ากลับด้วยเรื่องที่ทำได้บนดิน
      check: { stat: CHA, dc: 11 }
      success:
        text: |
          {name}ชี้ราวเหล็กของบันไดวนที่น้ำแข็งเกาะเป็นเงา ท้าว่าใครไถลจากชั้นนี้ลงไปถึงชั้นล่างได้โดยไม่ตก คนนั้นได้น้ำตาล แล้วขึ้นไปนั่งคร่อมราวเป็นคนแรก

          ไถลลงไปถึงชั้นล่างจนก้นชาไปหมด เด็กโตห้าคนตามลงมาทีละคน ตกกลางทางสองคน ตอนเย็นน้ำตาลกรวดก้อนนั้นแตกเป็นหกชิ้น ไม่มีใครพูดถึงอุโมงค์อีก
        effects: { stats: { CHA: 1 }, taboo: { stone: keep }, flags: [refused_the_cold_month_dare] }
      failure:
        text: |
          ไม่มีใครฟัง คนตัวใหญ่ล้อว่าเด็กที่กลัวรูไม่ต้องมาเล่นที่ปากรู แล้วผลัก{name}ล้มลงกองหิมะ หัวโขกขั้นบันไดไปหนึ่งที

          {name}นั่งกุมหัวอยู่บนหิมะจนพวกนั้นเบื่อแล้วเดินไป ไม่มีใครลงอุโมงค์วันนั้น ตะเกียงที่พวกเขาวางไว้ปากรูดับเองตอนบ่าย น้ำมันในถ้วยยังเหลืออีกครึ่ง
        effects: { hp: -1, taboo: { stone: keep }, flags: [refused_the_cold_month_dare] }

# ---------- กวางไม่มีเขา (ป่าไอเลธ) ----------

- id: childhood.taboo_forest_dead_wood
  stage: childhood
  weight: 20
  when:
    age: [5, 9]
    location_tag: ileth
  text: |
    ก่อนหน้าหนาว เด็กบ้านกิ่งลมลงไปเก็บฟืนกับผู้ใหญ่ ปีนี้{name}ได้ไปกับท่านซาลิเวน ผู้เฒ่าที่แก่รองจากคนที่แก่ที่สุดในหมู่บ้าน ท่านถือตะกร้าหวายลงมาสองใบ ใบใหญ่ยื่นให้{name}

    ท่านสอนวิธีเดียว จับกิ่งแล้วงอ กิ่งที่หักดังเป๊าะ ข้างในแห้ง เอาได้ กิ่งที่งอตามมือ มีน้ำในเปลือก ห้ามแตะ ใบร่วงหมดแล้วก็ห้าม ไม้ที่ล้มลงมานอนบนดินเอาได้ทั้งต้น ไม้ที่ยังยืน ตายแล้วก็ต้องรอให้ล้มเอง

    {name}ถามว่าทำไม ท่านซาลิเวนนิ่งไปจนนกบินผ่านหัวไปสองตัว แล้วตอบว่าท่านเคยถามผู้เฒ่าคนก่อน ผู้เฒ่าคนนั้นก็เคยถามคนก่อนหน้า ย้อนไปจนถึงคนที่ไม่มีใครจำชื่อได้แล้ว ไม่มีใครได้คำตอบ "ตะกร้าเต็มแล้วค่อยกลับ" ท่านว่า
  choices:
    - id: only_the_fallen
      label: งอทีละกิ่ง เก็บแต่กิ่งที่หักดังเป๊าะ
      text: |
        กิ่งแห้งที่หักได้มีน้อยกว่าที่คิด ส่วนใหญ่ล่อตาว่าแห้งแต่พองอแล้วงอตาม {name}งอกิ่งไปเป็นร้อย จนฝ่ามือแดงและเปลือกไม้ฝังอยู่ใต้เล็บ ตะกร้าเต็มตอนแดดเริ่มเหลือง

        ท่านซาลิเวนวางกิ่งแห้งลงบนยอดตะกร้าของ{name}อีกกิ่งหนึ่ง เป็นกิ่งที่{name}เดินผ่านไปแล้วไม่ได้งอ ท่านไม่บอกว่าเจอที่ไหน
      effects: { taboo: { forest: keep }, flags: [gathered_only_dead_wood] }
    - id: snap_a_green_one
      label: บิดกิ่งเขียวที่ห้อยต่ำลงมาใส่ตะกร้าให้เต็มเร็วๆ
      text: |
        กิ่งนั้นไม่ยอมหัก {name}บิดจนเปลือกฉีกเป็นริ้วถึงได้ขาด ยางใสไหลออกมาเปื้อนมือ เหนียวและหอมเหมือนน้ำผึ้งที่เก็บไว้นานเกินไป ท่านซาลิเวนเห็น ท่านหยิบกิ่งนั้นออกจากตะกร้า แล้วเอาเปลือกเส้นที่ฉีกพันปิดแผลบนต้นไว้อย่างพันแผลให้คน

        ยางบนมือ{name}ล้างไม่ออกอยู่สามวัน กลิ่นติดหมอน ติดผ้าห่ม คืนแรกนกตัวเล็กๆ มาเกาะราวหน้าต่างห้องนอนเรียงกันเป็นแถว เกาะเฉยๆ ไม่ร้อง
      effects: { taboo: { forest: break }, flags: [snapped_a_green_branch] }
    - id: watch_the_testing
      label: เดินตามท่าน ดูว่าท่านงอกิ่งไหน ยังไม่เก็บเอง
      text: |
        ท่านซาลิเวนงอกิ่งไปทั่ว บางกิ่งดูตายแล้วแต่งอตามมือ บางกิ่งยังมีใบติดแต่หักดังเป๊าะ ท่านไม่เคยดูด้วยตาก่อนจับ ท่านจับก่อนทุกครั้ง

        ขากลับ{name}ลองงอเองสิบกิ่ง ทายถูกเจ็ด ท่านบอกว่าตอนท่านเท่านี้ท่านทายถูกห้า
      effects: { taboo: { forest: learn }, stats: { WIS: 1 }, flags: [watched_the_wood_testing] }

- id: childhood.taboo_forest_snared_doe
  stage: childhood
  weight: 20
  when:
    age: [7, 11]
    location_tag: ileth
    taboo: { id: forest, taught: true }
  text: |
    หน้าหนาวปีนี้คนแลกเกลือจากบ้านตีนไม้ไม่ขึ้นมาสองเดือนแล้ว ที่บ้านกิ่งลมกินขนมปังลูกโอ๊กกับเห็ดตากแห้ง พรานลงไปทุกวันแต่ได้แค่กระต่ายผอมๆ บางวันไม่ได้อะไรเลย เด็กโตสอนให้วางบ่วงริมลำธาร {name}วางไว้สามบ่วง

    เช้านี้บ่วงที่สามไม่ได้กระต่าย บ่วงได้ขาหลังของแม่กวางตัวหนึ่ง แม่กวางดิ้นจนดินริมลำธารเป็นร่อง แล้วเลิกดิ้น ยืนหอบ ในพุ่มเฟิร์นห่างออกไปมีลูกกวางตัวลายจุดยืนนิ่งอยู่ ขายังเก้งก้าง

    ไม่มีใครอยู่แถวนั้น บนกิ่งข้างบนคนทั้งหมู่บ้านกำลังกินข้าวเช้าที่ไม่พอ
  choices:
    - id: cut_her_loose
      label: ค่อยๆ เข้าไปตัดบ่วงให้แม่กวาง
      text: |
        พอเชือกขาด แม่กวางถีบทีเดียวเต็มต้นขาของ{name} แล้วกระโดดข้ามลำธารไป ลูกกวางวิ่งตามโดยไม่ต้องเรียก {name}นั่งกุมขาอยู่ริมน้ำจนเลิกเจ็บพอจะเดิน

        ขึ้นไปถึงบ้าน{name}บอกว่าบ่วงขาด เย็นนั้นขนมปังลูกโอ๊กแบ่งได้คนละครึ่งชิ้น รอยกีบเขียวช้ำอยู่ที่ต้นขาจนหิมะแรกตก
      effects: { hp: -1, taboo: { forest: keep }, flags: [cut_the_doe_loose] }
    - id: fetch_the_hunters
      label: ขึ้นไปบอกพรานว่าบ่วงได้กวาง ไม่พูดถึงลูกของมัน
      text: |
        พรานสองคนลงไปกับ{name} ไม่ถามอะไรมาก คนหนึ่งเห็นลูกกวางในพุ่มเฟิร์น แล้วหันไปทางอื่น คืนนั้นทั้งบ้านกิ่งลมได้กินเนื้อ ส่วนที่ดีที่สุดตกถึง{name} เพราะเป็นบ่วงของ{name}

        สองวันต่อมาลูกกวางตัวนั้นยังมายืนอยู่ใต้ต้นของหมู่บ้าน ยืนตอนเช้า ยืนตอนเย็น ผู้ใหญ่บอกเด็กให้ใช้บันไดอีกด้าน
      effects: { hp: 1, taboo: { forest: break }, flags: [led_the_hunters_to_the_doe] }
    - id: ask_the_elder
      label: ขึ้นไปตามท่านซาลิเวนลงมาดู แล้วเล่าให้ครบทุกอย่าง
      check: { stat: CHA, dc: 11 }
      success:
        text: |
          ท่านซาลิเวนลงมากับ{name}โดยไม่กินข้าวเช้าให้หมด ท่านยืนดูลูกกวางในพุ่มเฟิร์นพักหนึ่ง แล้วยื่นมีดให้{name}ตัดบ่วงเอง ท่านจับขาแม่กวางไว้ไม่ให้ถีบ

          ขากลับท่านแบ่งขนมปังลูกโอ๊กของท่านให้{name}ครึ่งหนึ่ง แล้วบอกว่าบ่วงที่วางริมลำธาร พรุ่งนี้ให้ย้ายขึ้นไปวางบนเนิน
        effects: { stats: { CHA: 1 }, taboo: { forest: keep }, flags: [cut_the_doe_loose] }
      failure:
        text: |
          ระหว่างทางขึ้นบันได{name}เจอพรานของหมู่บ้านก่อน เล่าได้แค่คำว่าบ่วงได้กวาง เขาก็วิ่งลงไปแล้ว พอ{name}พาท่านซาลิเวนลงมาถึง ทุกอย่างจบไปแล้ว

          ท่านซาลิเวนยืนดูลูกกวางที่ยังไม่ยอมไปจากพุ่มเฟิร์น ท่านถามว่าบ่วงนี้ของใคร {name}ตอบว่าของตัวเอง เย็นนั้น{name}ได้ส่วนที่ดีที่สุดของเนื้อ เพราะเป็นบ่วงของ{name}
        effects: { taboo: { forest: break }, flags: [led_the_hunters_to_the_doe] }

# ---------- เค้ากลางคืน (แดนเถ้า) ----------

- id: childhood.taboo_night_dont_point
  stage: childhood
  weight: 20
  time: night
  when:
    age: [5, 9]
    location_tag: ashland
  text: |
    ตาคัสเวลนำเกวียนข้ามทุ่งเถ้ามาตั้งแต่ก่อนมีหลุมเก้า ทางบนแผ่นไม้ตอนกลางคืนไม่มีใครเดินเป็นเท่าแก แกดูทางจากดาว ไม่ใช่จากตะเกียง คนขับเกวียนเสบียงจากป้อมจ่ายแกเป็นถ่านทุกเที่ยว

    คืนฟ้าเปิดคืนหนึ่ง{name}ปีนไปนั่งข้างแกบนชานบ้านผู้ใหญ่บ้าน แล้วยกนิ้วชี้ขึ้นจะถามถึงดวงที่สว่างที่สุด นิ้วยังไปไม่ถึงครึ่งทาง มือแห้งๆ ของตาคัสเวลก็จับไว้ พับนิ้วกลับเข้าไปในกำมือ เร็ว แต่ไม่แรง

    "ไม่ชี้" แกว่า แล้วยกคางขึ้นช้าๆ "ดวงที่อยู่เหนือปล่องหลุมเก้าไปสองฝ่ามือ ใช่ดวงนั้นไหม" {name}ถามว่าทำไมชี้ไม่ได้ แกบอกว่าไม่รู้ คนที่สอนแกก็ไม่รู้ รู้แต่ว่าในบ้านหญ้าเงินไม่มีใครชี้
  choices:
    - id: fold_the_finger
      label: กำนิ้วไว้ แล้วลองบอกดาวด้วยคางกับคำพูดอย่างตา
      text: |
        {name}ยกคางขึ้น บอกว่าดวงที่อยู่ขวามือของตอเสา ต่ำลงมาหนึ่งกำปั้น ตาคัสเวลหาเจอในทีเดียว บอกว่าบอกได้ดีกว่าคนขับเกวียนครึ่งหนึ่งที่แกเคยนำทาง

        คืนนั้นสองคนผลัดกันบอกดาวด้วยคางจนดึก ทายถูกบ้างผิดบ้าง ไม่มีนิ้วไหนยกขึ้นเกินเข่า
      effects: { taboo: { night: keep }, flags: [shows_stars_with_the_chin] }
    - id: point_again
      label: รอตาหันไปทางอื่น แล้วชี้อีกที
      text: |
        ตาคัสเวลหันไปเรียกคนขับเกวียน {name}ยกนิ้วชี้ดวงนั้นค้างไว้นานกว่าเดิม ตะเกียงที่แขวนใต้ชานบ้านหรี่วูบลงจนเกือบดับ แล้วสว่างคืนเท่าเดิม

        ตาคัสเวลไม่ได้หันมา แต่แกเห็นเงานิ้วบนแผ่นไม้ แกลุกขึ้น จูงมือ{name}ไปส่งถึงบันไดบ้าน ไม่บอกว่าเพราะอะไร คืนหลังๆ แกไม่ชวนขึ้นไปนั่งด้วยอีก
      effects: { taboo: { night: break }, flags: [pointed_at_a_star_again] }
    - id: watch_him_guide
      label: นั่งฟังตาบอกทางคนขับเกวียน ไม่ถามอะไรอีก
      text: |
        คนขับเกวียนคนใหม่มาถามทางไปป้อมสาม ตาคัสเวลบอกด้วยคางกับคำพูดอย่างเดียว ดาวดวงไหนอยู่เหนือหัวม้า ดวงไหนต้องอยู่ข้างหูซ้าย คนขับเกวียนทวนตามจนจำได้แล้วออกเดินทาง ไม่มีใครยกมือขึ้นสักครั้ง

        {name}ไม่เคยไปป้อมสามสักครั้ง แต่จำทางนั้นได้หมดตั้งแต่ฟังรอบแรก ตาคัสเวลทดสอบด้วยการถามย้อนกลับ ถามสามรอบ ถูกทั้งสามรอบ
      effects: { taboo: { night: learn }, stats: { INT: 1 }, flags: [watched_the_night_walker] }

- id: childhood.taboo_night_dark_moon_lost
  stage: childhood
  scene: land_night
  weight: 20
  time: night
  when:
    age: [7, 11]
    location_tag: ashland
    taboo: { id: night, taught: true }
  text: |
    คืนเดือนดับ คนบ้านหญ้าเงินชักบันไดขึ้นก่อนตะวันตกดิน ปิดหน้าต่างด้านตะวันออกทุกบาน คนที่ติดอยู่ข้างนอกให้นั่งลงตรงไหนก็ได้ ก้มหน้าจนเห็นแต่เข่าตัวเอง แล้วรอฟ้าสาง เด็กในบ้านหญ้าเงินรู้ข้อนี้ก่อนรู้ชื่อเทพครบเจ็ดองค์

    เย็นนั้น{name}ไปเก็บหญ้าเงินที่เนินทางใต้แล้วกลับช้า แผ่นไม้ที่ปูทางขาดตอนตรงไหนสักแห่ง {name}ก้าวลงไปในเถ้าลึกถึงเอว ปีนขึ้นมาได้ก็มืดแล้ว ไม่มีจันทร์ ไม่มีตะเกียงสักดวง หมู่บ้านอยู่ทางไหนสักทาง

    ถ้าเงยหน้า เส้นตอเสาบนฟ้าจะบอกทางได้ในทีเดียว เหนือหัวมีลมพัดผ่านไปทางตะวันตก ลมนั้นไม่แตะเถ้าบนพื้นเลยสักเม็ด
  choices:
    - id: sit_head_down
      label: นั่งลงบนเถ้า ก้มหน้า รอจนฟ้าสาง
      text: |
        {name}นั่งกอดเข่า ก้มหน้าจนหน้าผากชนเข่า เถ้าเย็นซึมเข้ากางเกงทีละชั้น ลมเหนือหัวพัดผ่านไปครั้งหนึ่ง แล้วอีกครั้ง ช้ากว่าครั้งแรก จากนั้นก็ไม่มีอีก

        ฟ้าสาง{name}เงยหน้าขึ้น บ้านหญ้าเงินอยู่ห่างไปไม่ถึงร้อยก้าว ควันจากเตาแรกเพิ่งลอยขึ้น {name}ไอจนถึงเย็น เสียงแหบไปทั้งสัปดาห์
      effects: { hp: -1, taboo: { night: keep }, flags: [sat_out_a_dark_moon] }
    - id: look_up_for_the_way
      label: เงยหน้าหาเส้นตอเสาบนฟ้า จะได้รู้ทางกลับ
      text: |
        ฟ้าเดือนดับมีดาวเต็มจนขาว เส้นดำของตอเสาตั้งอยู่ทางตะวันออกเฉียงเหนือ บอกทางได้ในทีเดียว แต่ดาวแถบหนึ่งเหนือตอเสาหายไปทีละแถว แล้วกลับมาทีละแถว ไล่จากตะวันออกไปตะวันตก คืนนั้นไม่มีเมฆสักก้อน

        {name}ก้มหน้าลงแล้วเดินตามทางที่เพิ่งเห็น ถึงใต้บ้านก็ผิวปากสามจังหวะ มีคนหย่อนบันไดลงมาโดยไม่จุดไฟ บนบ้านมีแกงอุ่นเหลืออยู่ครึ่งหม้อ ไม่มีใครถามว่ากลับมาได้อย่างไร
      effects: { hp: 1, taboo: { night: break }, flags: [looked_up_on_a_dark_moon] }
    - id: whistle_and_wait
      label: ก้มหน้าไว้ ผิวปากสามจังหวะเรียกบันได แล้วผิวไปเรื่อยๆ
      check: { stat: CON, dc: 11 }
      success:
        text: |
          {name}ผิวจนปากแห้งแตก สั้น สั้น ยาว ทุกครั้งเว้นช่วงนับถึงสิบ ใกล้เที่ยงคืนมีเสียงผิวตอบกลับมาจากทางซ้าย แล้วแสงตะเกียงที่ห่อผ้าไว้ครึ่งดวงก็มาหยุดตรงหน้า คนที่ถือตะเกียงก้มหน้าลงต่ำเท่ากัน

          ทั้งสองเดินกลับบ้านโดยไม่มีใครเงยหน้า คนถือตะเกียงบอกว่าได้ยินเสียงผิวตั้งแต่หัวค่ำ แต่ต้องรอให้ลมข้างบนผ่านไปก่อน
        effects: { stats: { CON: 1 }, taboo: { night: keep }, flags: [sat_out_a_dark_moon] }
      failure:
        text: |
          {name}ผิวจนปากแข็ง ไม่มีใครผิวตอบ ลมเหนือหัวพัดผ่านไปอีกหลายรอบ ความหนาวขึ้นมาถึงอก ฟันกระทบกันจนผิวต่อไม่ได้

          ใกล้ตีสาม{name}เงยหน้า หาเส้นตอเสาเจอ แล้วเดินกลับบ้านทั้งตัวสั่น ดาวแถบหนึ่งเหนือตอเสาหายไปแล้วกลับมา {name}ไม่ได้บอกใครเรื่องนี้
        effects: { hp: -1, taboo: { night: break }, flags: [looked_up_on_a_dark_moon] }

# ---------- แม่เสือไฟ (ทุกบ้านที่มีเตา) ----------

- id: childhood.taboo_fire_no_water
  stage: childhood
  weight: 12
  time: night
  when:
    age: [5, 9]
    not_flags: [origin_elf_bough]
  text: |
    ทุกบ้านมีคนเฝ้าเตาหนึ่งคน ไม่มีใครตั้ง ไม่มีใครประกาศ คือคนที่ตื่นก่อนทุกคนเพื่อเขี่ยถ่านให้ติด และนอนหลังทุกคนเพราะต้องกลบเถ้า ที่ที่{name}โตมา คนเฝ้าเตาเป็นหญิงแก่ที่ทุกคนเรียกว่ายาย

    คืนนี้ยายให้{name}กลบเตาเองเป็นครั้งแรก ท่อนฟืนท่อนหนึ่งกลิ้งหลุดออกมาบนพื้น ไฟยังลุกอยู่ปลายท่อน {name}คว้ากระบวยน้ำจากโอ่ง ยังไม่ทันยกขึ้น ยายก็จับข้อมือไว้ แล้วใช้คีมเหล็กเขี่ยท่อนฟืนกลับเข้าเตา ตักเถ้าจากหม้อข้างเตามากลบทีละช้อนจนไฟเหลือแต่แสงแดงใต้ขี้เถ้า

    "เตาไม่ดับด้วยน้ำ" ยายว่า "อีกข้อหนึ่ง คืนไหนมีคนในบ้านตาย หน้าต่างต้องเปิดไว้บานหนึ่งจนสว่าง" {name}ถามว่าทำไม ยายบอกว่าสองข้อนี้มาด้วยกัน ยายของยายสอนมาด้วยกัน ไม่มีใครบอกว่าทำไม
  choices:
    - id: bank_it_with_ash
      label: ขอคีมกับช้อนเถ้ามากลบเตาเองต่อจากยาย
      text: |
        {name}ตักเถ้ามากลบทีละช้อนอย่างที่ยายทำ หนาเกินไปตรงหนึ่ง บางเกินไปอีกตรง ยายเกลี่ยให้ใหม่ด้วยนิ้วโป้ง บอกว่าถ่านต้องหายใจได้นิดหนึ่ง ไม่อย่างนั้นเช้ามาจะตายหมด

        เช้าวันต่อมา{name}ตื่นก่อนยาย เขี่ยเถ้าออก ถ่านใต้ขี้เถ้ายังแดง เป่าสองทีไฟก็ลุก
      effects: { taboo: { fire: keep, wind: learn }, flags: [banked_the_fire_with_ash] }
    - id: splash_it_anyway
      label: รอยายเข้านอน แล้วราดน้ำดับถ่านให้เสร็จเร็วๆ
      text: |
        น้ำกระบวยเดียวลงไปในเตา ไอขาวพุ่งขึ้นพร้อมเสียงฟ่อดังจนแมวกระโดดลงจากหลังตู้ เถ้าเปียกฟุ้งขึ้นมาเกาะหน้า{name}เป็นจุดดำ

        เช้ามายายจุดเตาไม่ติด ฟืนแห้งก็ไม่ติด ต้องไปยืมไฟจากบ้านข้างๆ ยายไม่ถามว่าเมื่อคืนเกิดอะไรขึ้น ยายเห็นเถ้าที่แข็งเป็นก้อนอยู่ก้นเตาแล้ว
      effects: { taboo: { fire: break, wind: learn }, flags: [put_the_hearth_out_with_water] }
    - id: watch_her_bank
      label: นั่งดูยายกลบเตาจนเสร็จ
      text: |
        ยายกลบเตาเหมือนห่มผ้าให้เด็ก ตรงไหนแดงมากเถ้าหนา ตรงไหนใกล้มอดเถ้าบาง เสร็จแล้วยายวางมือแบไว้เหนือเตาครู่หนึ่ง เหมือนวัดไข้

        {name}ถามว่ายายทำแบบนี้มากี่คืนแล้ว ยายนับไม่ได้ บอกแค่ว่าไม่เคยขาดสักคืน ตั้งแต่ก่อนแข้งขายายจะปวด
      effects: { taboo: { fire: learn, wind: learn }, stats: { WIS: 1 }, flags: [watched_the_hearth_banked] }

- id: childhood.taboo_fire_borrowed_ember
  stage: childhood
  weight: 12
  time: night
  when:
    age: [7, 11]
    not_flags: [origin_elf_bough]
    taboo: { id: fire, taught: true }
  text: |
    คืนนั้นคนเฝ้าเตาไม่สบาย หลับลึกจนไม่ได้ลุกมาเติมถ่าน เตาที่บ้านดับตอนดึก {name}ตื่นเพราะหนาวจนนิ้วเท้าชา ไม่มีหินเหล็กไฟ ไม่มีชนวน มีแต่หม้อดินใบเล็กที่ทุกบ้านแขวนไว้ข้างประตูไว้ยืมไฟ

    บ้านถัดไปยังมีแสงแดงลอดใต้ประตู คนบ้านนั้นตื่นมาเปิดให้ทั้งตาปรือ ตักถ่านแดงใส่หม้อดินให้สามก้อน "ก่อนสว่างเอามาคืนด้วยนะ" แล้วปิดประตูกลับไปนอน

    ตอนนี้เตาที่บ้านลุกดีแล้ว ห้องอุ่น ฟ้ายังมืดแต่ไก่ตัวแรกจะขันอีกไม่นาน คืนไฟคือตักถ่านจากเตาบ้านตัวเองกลับไปใส่เตาบ้านนั้น ข้างนอกน้ำค้างแข็งเกาะรั้วเป็นเกล็ด ทุกคนหลับหมด ไม่มีใครรู้ว่าคืนหรือไม่คืน
  choices:
    - id: carry_it_back
      label: ตักถ่านใส่หม้อดิน เดินฝ่าน้ำค้างแข็งไปคืนเดี๋ยวนี้
      text: |
        {name}เดินเท้าเปล่าเพราะหารองเท้าไม่เจอในความมืด น้ำค้างแข็งบาดฝ่าเท้าทุกก้าว เปิดประตูบ้านนั้นเงียบๆ เทถ่านลงในเตาที่ใกล้มอด ถ่านใหม่ติดของเก่าในทีเดียว

        กลับมาถึงบ้าน ผ้าห่มเย็นไปหมดแล้ว {name}นอนไม่หลับจนสว่าง เช้านั้นจามติดกันจนคนเฝ้าเตาที่เพิ่งหายไข้ต้องลุกมาต้มน้ำขิงให้
      effects: { hp: -1, taboo: { fire: keep }, flags: [returned_the_borrowed_fire] }
    - id: sleep_through
      label: มุดผ้าห่มต่อ เช้าค่อยไปขอบคุณ
      text: |
        {name}หลับไปพร้อมเสียงถ่านแตกเปาะแปะในเตา หลับยาวจนสาย อุ่นทั้งคืน

        เช้านั้นเตาบ้านข้างๆ จุดไม่ติด ฟืนแห้งก็ไม่ติด ชนวนก็ไม่ติด คนบ้านนั้นต้องเดินไปยืมไฟจากบ้านที่ไกลออกไปอีกสองหลัง เขาเดินผ่านหน้าบ้าน{name}ทั้งไปและกลับ
      effects: { hp: 1, taboo: { fire: break }, flags: [kept_the_borrowed_fire_past_dawn] }
    - id: race_the_dawn
      label: นั่งผิงไฟรอข้างเตา พอได้ยินไก่ตัวแรกค่อยวิ่งไปคืน
      check: { stat: DEX, dc: 11 }
      success:
        text: |
          ไก่ตัวแรกขันตอนที่{name}เกือบหลับ {name}ตักถ่านใส่หม้อแล้ววิ่งออกไปทั้งผ้าห่มยังคลุมไหล่ ถึงประตูบ้านนั้นตอนฟ้าเพิ่งเทาเป็นเส้น เทถ่านลงเตาของเขาทันก่อนแสงแรก

          วิ่งกลับมาถึงบ้าน หน้าแดง หอบ หัวเราะอยู่คนเดียวในครัว ไม่มีใครตื่นมาเห็น
        effects: { stats: { DEX: 1 }, taboo: { fire: keep }, flags: [returned_the_borrowed_fire] }
      failure:
        text: |
          {name}นั่งพิงผนังแล้วเผลอหลับไป ไก่ขันตัวที่สามถึงสะดุ้งตื่น วิ่งออกไปก็สะดุดธรณีประตู หม้อดินกลิ้ง ถ่านกระจายบนน้ำค้างแข็งดับไปสองก้อน

          ตักก้อนที่เหลือไปถึงบ้านนั้นตอนขอบฟ้าแดงแล้ว เตาของเขามอดสนิท ถ่านก้อนเดียวที่เทลงไปควันขึ้นนิดหนึ่งแล้วก็ดำ
        effects: { taboo: { fire: break }, flags: [kept_the_borrowed_fire_past_dawn] }

# ---------- ฝูงนกไม่มีรัง (สอนที่ไอเลธ ทดสอบได้ทุกถิ่น) ----------

- id: childhood.taboo_wind_caged_bird
  stage: childhood
  weight: 20
  scene: market
  when:
    age: [5, 9]
    location_tag: ileth
  text: |
    ทุกต้นเดือนผู้ใหญ่บ้านกิ่งลมหย่อนตะกร้าลงไปแลกของที่ลานตะกร้าของบ้านตีนไม้ น้ำผึ้งลงไป เกลือกับผ้าขึ้นมา ปีนี้{name}ได้ลงไปด้วยกับท่านอิลเรีย ท่านเป็นคนที่เฝ้าคนตายของหมู่บ้าน ใครสิ้นใจบนกิ่งไหน ท่านไปนั่งอยู่ที่นั่นจนสว่าง

    ที่ลานตะกร้ามีพ่อค้าจากเมืองมาตั้งแผงเป็นครั้งแรก กรงไม้ไผ่ซ้อนกันสามชั้น ข้างในเป็นนกป่าตัวสีน้ำตาลปีกลาย ชนิดที่ร้องเป็นเพลงสามท่อนตอนเช้ามืด พ่อค้ายื่นกรงใบหนึ่งให้{name}ดูใกล้ๆ บอกเป็นภาษาปากชายป่าว่าแลกน้ำผึ้งกระบอกเดียวก็ได้

    ท่านอิลเรียวางมือบนไหล่{name} "บ้านเราไม่ขังของที่บินได้" {name}ถามว่าทำไม ท่านบอกว่าท่านรู้แค่สองข้อที่มาด้วยกัน ข้อหนึ่งคือเปิดหน้าต่างให้คนตาย อีกข้อคือข้อนี้ ส่วนทำไม ไม่มีใครบอกท่าน
  choices:
    - id: trade_and_open
      label: แลกน้ำผึ้งของตัวเองกับกรงใบนั้น แล้วเปิดกรงตรงนั้นเลย
      text: |
        พ่อค้ารับกระบอกน้ำผึ้งไปเขย่าฟัง {name}ปลดสลักกรง นกเกาะขอบประตูกรงอยู่อึดใจหนึ่ง แล้วบินขึ้นตรงไปบนยอดไม้ หายไปในใบ พ่อค้าหัวเราะ บอกว่าเด็กเอลฟ์ซื้อของแพงที่สุดที่เคยขาย

        เช้ามืดวันต่อมามีเสียงร้องเป็นเพลงสามท่อนอยู่นอกหน้าต่างห้องนอนของ{name} ร้องครั้งเดียวแล้วเงียบ
      effects: { taboo: { wind: keep }, flags: [freed_a_market_bird] }
    - id: take_it_home
      label: แลกน้ำผึ้งกับกรงใบนั้น แล้วถือขึ้นไปแขวนที่บ้าน
      text: |
        {name}แขวนกรงไว้ที่ขื่อหน้าต่าง นกร้องเพลงสามท่อนทุกเช้ามืดอย่างที่พ่อค้าบอก ท่านอิลเรียเดินผ่านบ้านแล้วไม่หยุด

        คืนแรกลมบนกิ่งพัดบานหน้าต่างของบ้าน{name}ตีกรอบทั้งคืน บ้านอื่นลมนิ่ง ต้องเอาเชือกผูกบานไว้ถึงได้นอน คืนที่สองก็เหมือนเดิม
      effects: { taboo: { wind: break }, flags: [caged_a_wild_bird] }
    - id: watch_her_trade
      label: ยืนดูท่านอิลเรียทำอะไรต่อ
      text: |
        ท่านอิลเรียแลกน้ำผึ้งกระบอกของท่านเองกับกรงใบล่างสุด ใบที่นกขนร่วงจนเห็นหนังคอ ท่านไม่เปิดตรงนั้น ท่านหิ้วกรงเดินกลับขึ้นไปจนถึงกิ่งที่สูงที่สุดที่เด็กขึ้นได้ แล้วเปิดสลัก

        นกตัวนั้นไม่บินทันที มันเดินออกมาเกาะกิ่ง สะบัดขน แล้วค่อยกระโดดขึ้นไปทีละกิ่ง ท่านอิลเรียดูจนลับใบไม้ แล้วม้วนกรงไม้ไผ่ทิ้งลงเตา
      effects: { taboo: { wind: learn }, stats: { WIS: 1 }, flags: [watched_a_bird_let_go] }

- id: childhood.taboo_wind_open_window
  stage: childhood
  weight: 12
  time: night
  when:
    age: [7, 11]
    taboo: { id: wind, taught: true }
  text: |
    คนแก่บ้านถัดไปสิ้นใจตอนหัวค่ำ ข่าวมาถึงก่อนข้าวเย็น ที่นี่เวลามีคนตาย บ้านของคนตายเปิดหน้าต่าง บ้านที่อยู่ติดกันก็เปิดไว้คนละบานด้วย ปีนี้บานที่ต้องเปิดคือหน้าต่างห้องที่{name}นอน

    ลมคืนนั้นพัดมาจากทางเหนือ หนาวจนน้ำในเหยือกข้างที่นอนเป็นแผ่นบางๆ ผ้าห่มผืนเดียวกันลมไม่อยู่ ทุกคนในบ้านหลับหมดแล้ว

    บานหน้าต่างอยู่ห่างที่นอนแค่เอื้อมแขน ปิดตอนนี้ แล้วตื่นมาเปิดก่อนคนอื่นตื่น ก็ไม่มีใครรู้
  choices:
    - id: leave_it_open
      label: ปล่อยหน้าต่างเปิดไว้จนสว่าง
      text: |
        {name}นอนขดอยู่ใต้ผ้าห่มจนตัวกลม ฟังลมพัดผ้าม่านเข้าพัดออก ใกล้ตีสามลมเปลี่ยนทาง พัดออกจากห้องไปทางหน้าต่างครั้งเดียว ยาว แรงพอให้ผ้าม่านลอยออกไปนอกบาน แล้วก็นิ่ง

        ห้องหนาวจนเช้า {name}ตื่นมาคอแห้ง เสียงแหบ ตัวรุมๆ ไปสามวัน
      effects: { hp: -1, taboo: { wind: keep }, flags: [left_the_window_for_the_dead] }
    - id: shut_it
      label: เอื้อมไปปิดหน้าต่าง ไว้ตื่นก่อนคนอื่นค่อยเปิด
      text: |
        พอปิดบาน ห้องอุ่นขึ้นทันที {name}หลับสนิทจนไก่ขันตัวที่สาม ตื่นมาเปิดหน้าต่างทันก่อนคนในบ้านจะลุก

        ที่ร่องบานหน้าต่าง ด้านในห้อง มีขนนกสีเทาเส้นหนึ่งเสียบติดอยู่ เส้นยาวเท่านิ้วมือ ในบ้านไม่มีใครเลี้ยงนก
      effects: { hp: 1, taboo: { wind: break }, flags: [shut_the_window_on_the_dead] }
    - id: wrap_up_and_sit
      label: ดึงผ้าห่มทุกผืนที่หาได้มาห่ม แล้วนั่งพิงผนังข้างหน้าต่างทั้งคืน
      check: { stat: CON, dc: 11 }
      success:
        text: |
          {name}ขโมยผ้าห่มจากตู้มาสามผืน พันตัวเองจนเหลือแต่ตา นั่งพิงผนังข้างหน้าต่าง ใกล้ตีสามลมพัดออกจากห้องไปทางหน้าต่างครั้งเดียว ยาว ผ่านหน้า{name}ไปเบาๆ แล้วนิ่ง

          เช้ามาคนในบ้านเจอ{name}หลับอยู่ในกองผ้าห่มตรงมุมห้อง หน้าต่างยังเปิด จมูกแดง ไม่มีใครดุเรื่องผ้าห่ม
        effects: { stats: { CON: 1 }, taboo: { wind: keep }, flags: [left_the_window_for_the_dead] }
      failure:
        text: |
          ผ้าห่มสามผืนกันลมได้ถึงเที่ยงคืน หลังจากนั้นความหนาวลอดเข้ามาทางคอ ทางข้อเท้า ฟันกระทบกันจนเจ็บกราม ใกล้รุ่ง{name}ทนไม่ไหว ลุกไปปิดบาน

          ตื่นมาอีกทีคนในบ้านเปิดหน้าต่างให้แล้ว ที่ร่องบานด้านในมีขนนกสีเทาเส้นหนึ่งเสียบติดอยู่ คนที่เปิดหยิบออกไปทิ้งโดยไม่ได้สนใจ
        effects: { hp: -1, taboo: { wind: break }, flags: [shut_the_window_on_the_dead] }
