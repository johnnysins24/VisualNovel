# วัยหนุ่มสาว 15–17 ทางคนธรรมดา (flags: path_commoner)
# คนธรรมดาไม่ย้ายถิ่นตอนพิธี จึงแยกด้วย origin_ ได้ตรง
# เสมียนวิหารเบเลคตั้งโต๊ะรับสัญญาตามตลาด สัญญาผูกด้วยเวท คนผิดสัญญาหนาวเข้ากระดูกทีละนิด และหนี้ไม่ลบเมื่อลูกหนี้ตาย (คัมภีร์)
# เรื่องนัดหยุดงานใช้ได้แค่โรงกลั่นเวนทราสกับหลุมในแดนเถ้า ที่มีบริษัทเป็นเจ้าของ
# เรื่องขายนาใช้ได้ทุกบ้านในอาร์เวล ทั้งนาเช่า นาของโรงสี และนาของวิหาร
# งานเลี้ยงปลายปีอายุ 17 ไม่ใช้กับเด็กที่ซ่อนเขาในบ้านขุนนางเวนทราส เพราะไม่มีโต๊ะผู้ใหญ่แบบชาวบ้านให้นั่ง

- id: youth.commoner_belek_guarantor
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    flags: [path_commoner]
    not_flags: [origin_elf_bough]
  text: |
    เสมียนวิหารเบเลคมาตั้งโต๊ะที่ตลาดเดือนละครั้ง ผ้าปูโต๊ะสีเทา ตาชั่งทองเหลืองหนึ่งอัน กับสมุดสัญญาเล่มหนาที่ขอบกระดาษเป็นสีเงิน

    เวลน์ คนที่{name}รู้จักมาตั้งแต่เด็ก อายุมากกว่ากันสามปี จูงมือ{name}มาถึงหน้าโต๊ะ เขาจะกู้สามสิบเหรียญ ไปซื้อแขนกลมือสองให้พ่อที่เสียแขนไปเมื่อหน้าหนาวก่อน ผ่อนเดือนละเหรียญครึ่ง สองปีจบ เสมียนบอกว่าคนกู้ไม่มีที่ดินไม่มีบ้าน ต้องมีคนค้ำ

    เวลน์หันมามอง{name} ทั้งชีวิตเขาไม่เคยขออะไรใคร
  choices:
    - id: sign_it
      label: ลงชื่อค้ำให้เขา
      text: |
        เสมียนให้{name}วางมือบนสมุด แล้วอ่านคำสาบานให้ว่าตาม ตอนพูดคำสุดท้าย ปลายนิ้วของ{name}เย็นวาบขึ้นมาทีเดียว เหมือนจับเหล็กตอนเช้ามืด แล้วก็หายไป

        พ่อของเวลน์ได้แขนกลข้างหนึ่ง เป็นขอเหล็กกับสายหนัง ใส่ไปวันแรกก็ยกถังน้ำได้แล้ว ทุกต้นเดือนเวลน์เอาเหรียญไปจ่ายที่โต๊ะสีเทาตรงเวลา และทุกต้นเดือน {name}ก็พบว่าตัวเองนับวันอยู่ด้วย
      effects: { alignment: { law: 1 }, reputation: { belek_bank: 1 }, flags: [belek_guarantor] }
    - id: read_every_line
      label: ขออ่านสัญญาทุกบรรทัดก่อนลงชื่อ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          เสมียนยิ้มเหมือนคนที่ไม่ค่อยมีใครขอแบบนี้ แล้วหมุนสมุดให้ ตัวหนังสือเล็กจน{name}ต้องเอานิ้วไล่ทีละบรรทัด บรรทัดที่สามจากท้ายเขียนว่า ถ้าผู้ค้ำตายก่อนหนี้หมด หนี้ตกไปถึงลูกของผู้ค้ำ ตกไปจนกว่าจะหมด

          {name}ชี้บรรทัดนั้นให้เวลน์ดู เวลน์อ่านไม่ออก {name}เลยอ่านให้ฟังดังๆ เวลน์ขอให้ขีดบรรทัดนั้นทิ้ง เสมียนบอกว่าบรรทัดนี้ขีดไม่ได้ เบเลคไม่ขีดอะไรทิ้ง ไม่ว่าบรรทัดไหน เวลน์ยืนเงียบไปนาน {name}จับปากกา แล้วลงชื่อใต้บรรทัดนั้น รู้ครบทุกคำว่ากำลังลงชื่อให้อะไร
        effects: { stats: { INT: 1 }, alignment: { law: 1 }, reputation: { belek_bank: 1 }, flags: [belek_guarantor, read_belek_fine_print] }
      failure:
        text: |
          เสมียนหมุนสมุดให้ แล้วพลิกหน้าไปทุกครั้งที่{name}อ่านได้ครึ่งหน้า บอกว่าหน้านี้เหมือนหน้าที่แล้ว หน้าถัดไปก็เหมือนกัน คนต่อแถวข้างหลังเริ่มบ่น เวลน์ยืนบิดมืออยู่ข้างๆ

          ถึงหน้าสุดท้าย{name}ยังไม่รู้ว่าอ่านผ่านอะไรมาบ้าง แต่ก็ลงชื่อไป ตอนพูดคำสาบานคำสุดท้าย ปลายนิ้วเย็นวาบทีเดียวแล้วหายไป
        effects: { stats: { INT: 1 }, reputation: { belek_bank: 1 }, flags: [belek_guarantor] }
    - id: refuse
      label: ไม่ค้ำ บอกเขาตรงๆ ว่าไม่กล้า
      text: |
        เวลน์ไม่เถียง พยักหน้าครั้งเดียว แล้วเดินออกจากแถวไป สามวันต่อมา{name}ได้ยินว่าน้องสาวเขาอายุสิบสี่ไปลงชื่อค้ำให้แทน เสมียนไม่ได้ถามอายุ

        พ่อของเวลน์ได้แขนกลข้างหนึ่ง เวลน์ยังทักทาย{name}ทุกเช้าเหมือนเดิม คุยเรื่องฝนเรื่องฟ้าเหมือนเดิม ไม่เคยพูดถึงเรื่องนั้นอีกเลย
      effects: { stats: { WIS: 1 }, flags: [refused_guarantor] }

- id: youth.commoner_beam_falls
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    flags: [path_commoner]
    not_flags: [origin_marked_hidden, origin_elf_bough]
  text: |
    คานไม้ที่ค้ำกองกระสอบในโกดังที่{name}รับจ้างแบกของหักตอนบ่ายแก่ เสียงดังเหมือนฟ้าผ่าลงหลังคา กระสอบที่ซ้อนสูงเกินหัวสองช่วงตัวพังลงมาทั้งกอง

    ข้างใต้มีเด็กชายคนที่อายุน้อยที่สุดในโกดัง อายุสิบเอ็ด คานท่อนหนึ่งพาดขาเขาไว้ กระสอบทับอยู่บนคานอีกสามสี่ใบ เขาไม่ร้อง ไม่ขยับ ตาเบิกมองมาที่{name} คนเดียวที่อยู่ใกล้พอจะได้ยินเสียงหายใจของเขา
  choices:
    - id: lift_it
      label: มุดลงไปใต้คาน แล้วยกขึ้นด้วยหลัง
      check: { stat: STR, dc: 14 }
      success:
        text: |
          {name}ดันหลังเข้าไปใต้คาน วางมือบนเข่า แล้วยืดตัวขึ้น คานขยับขึ้นมาทีละนิ้ว กระสอบข้างบนไหลลงไปด้านข้างทีละใบ พอคานลอยพ้นขาพอเห็นแสงลอด เด็กชายก็ถัดตัวออกมาด้วยศอก

          ขาเขาไม่หัก แค่ช้ำดำไปทั้งแข้ง คืนนั้น{name}นอนคว่ำทั้งคืน หลังร้อนเหมือนมีคนเอาอิฐเผาวางไว้ เช้ามาหัวหน้างานเรียกไปหา หักค่ากระสอบที่ขาดจากค่าแรงของ{name}สองใบ แล้วยื่นขนมปังให้ก้อนหนึ่ง
        effects: { stats: { STR: 1, CON: 1 }, gold: -1, alignment: { moral: 1 }, flags: [lifted_the_beam] }
      failure:
        text: |
          คานขยับขึ้นมาครึ่งนิ้ว แล้วมีอะไรบางอย่างในหลังของ{name}ดังกึก ขาทั้งสองข้างอ่อนลง คานลงไปทับที่เดิม เด็กชายร้องเป็นครั้งแรก

          คนอื่นวิ่งมาถึง สี่คนช่วยกันยกคานออก เด็กชายขาหัก หมอบอกว่าจะเดินได้ แต่ไม่ตรง {name}ลุกขึ้นยืนไม่ไหวไปสามวัน หลังจากนั้นทุกเช้าที่อากาศเย็น หลังส่วนล่างจะเตือนให้{name}จำบ่ายวันนั้นได้
        effects: { hp: -3, stats: { CON: 1 }, flags: [hurt_back] }
    - id: dig_out
      label: ดึงกระสอบออกจากด้านข้าง ทีละใบให้เร็วที่สุด
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}ดึงกระสอบใบที่ไม่ได้ทับคานออกก่อน ทีละใบ ระวังไม่ให้กองที่เหลือเอียงลงมาอีก พอกระสอบบนคานเหลือใบเดียว คานก็เบาพอให้ดันออกไปด้านข้างได้ด้วยเท้า เด็กชายคลานออกมาเอง

          หัวหน้างานมาถึงตอนทุกอย่างเสร็จแล้ว ยืนดูกองกระสอบที่{name}เรียงไว้ข้างทางอย่างเป็นระเบียบ แล้วถามว่าใครสอนให้เรียงแบบนี้ {name}บอกว่าไม่มีใครสอน เขาให้{name}ไปคุมการซ้อนกระสอบตั้งแต่วันรุ่งขึ้น ได้ค่าแรงเพิ่มสัปดาห์ละเหรียญ
        effects: { stats: { DEX: 1 }, gold: 2, flags: [freed_the_boy] }
      failure:
        text: |
          ใบที่สามดึงผิดใบ กองที่เหลือเอียงลงมาทั้งแถบ กระสอบใบหนึ่งกระแทกไหล่{name}จนล้มกลิ้งไปกับพื้น เด็กชายยังติดอยู่ที่เดิม

          คนอื่นวิ่งมาช่วยกันยกออก เด็กชายขาหัก {name}ไหล่บวมยกแขนไม่ขึ้นไปครึ่งเดือน แต่ยังต้องมาทำงานทุกวัน ทำแขนเดียว
        effects: { hp: -2, stats: { DEX: 1 }, flags: [tried_to_free_boy] }
    - id: run_for_help
      label: บอกเขาว่ารออยู่นิ่งๆ แล้ววิ่งไปตามคน
      text: |
        {name}วิ่งจนลมหายใจบาดคอ ตะโกนจนเสียงแหบ กลับมาพร้อมคนหกคน เด็กชายยังมองมาที่ทางเดิมที่{name}วิ่งออกไป เหมือนไม่ได้ละสายตาไปไหนเลย

        คนหกคนยกคานออกในทีเดียว ขาเด็กชายหักสองท่อน หมอบอกว่าถ้ามีคนพยายามยกคนเดียว คานอาจเลื่อนลงมาทับเข่า ขาข้างนั้นคงไม่เหลือให้ต่อ
      effects: { stats: { DEX: 1, CON: 1 }, flags: [ran_for_help] }

- id: youth.commoner_strike
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    flags: [path_commoner]
    not_flags: [origin_farm, origin_marked_kept, origin_marked_foundling, origin_marked_hidden, origin_elf_bough, origin_dwarf_clan]
  text: |
    อาทิตย์ก่อนมีคนตายในกะดึกหนึ่งคน ชายที่ทำงานมายี่สิบปี ไม่เคยลาสักวัน บริษัทส่งศพกลับบ้าน แล้วหักค่าแรงอาทิตย์สุดท้ายของเขาเป็นค่าเครื่องมือที่พังไปพร้อมกับตัวเขา เมียเขามารับเงินที่ช่องจ่ายค่าแรง ได้กลับไปเศษเหรียญเดียว

    เช้าวันนี้ไม่มีใครเข้ากะ คนงานทั้งสามกะนั่งลงหน้าประตูใหญ่ วางเครื่องมือไว้บนพื้นตรงหน้าตัวเอง ไม่มีใครตะโกน ไม่มีใครพูดอะไร {name}นั่งอยู่แถวที่สาม

    สายๆ บริษัทส่งยามมาสามสิบคน ถือไม้พลองยาวทุกคน กับคนงานใหม่อีกเกวียนหนึ่ง หน้าตาซีดเหมือนคนไม่ได้กินข้าวมาหลายวัน ยืนรออยู่ข้างหลังยาม
  choices:
    - id: hold_the_line
      label: ลุกขึ้นไปยืนแถวหน้า คล้องแขนกับคนข้างๆ
      check: { stat: STR, dc: 13 }
      success:
        text: |
          ยามเดินเข้ามาเป็นแถว ใช้ไม้พลองดันแทนตี แถวหน้าเซไปครึ่งก้าว แล้วหยุด {name}ยันเท้ากับพื้นจนส้นรองเท้าจม แขนซ้ายคล้องกับชายแก่ที่ไม่รู้จักชื่อ แขนขวาคล้องกับเด็กสาวที่อายุน้อยกว่าตัวเอง

          ยามดันอยู่ครึ่งชั่วยาม ไม่มีใครยอมถอย จนหัวหน้ายามโบกมือให้หยุด เย็นนั้นบริษัทส่งคนมาบอกว่าจะคืนค่าแรงอาทิตย์สุดท้ายให้เมียของคนที่ตาย เต็มจำนวน แต่ไม่ได้บอกเรื่องอื่น และพรุ่งนี้ทุกคนต้องเข้ากะ
        effects: { stats: { STR: 1 }, alignment: { law: -1, moral: 1 }, flags: [held_picket_line] }
      failure:
        text: |
          ยามดันครั้งแรก แถวหน้าก็แตก ไม้พลองท่อนหนึ่งฟาดเข้าซี่โครง{name}จนหายใจไม่ออก ล้มลงไปให้คนข้างหลังเหยียบ คนงานใหม่ในเกวียนเดินผ่านประตูใหญ่เข้าไปทีละคน ก้มหน้าทุกคน

          สามวันต่อมาคนงานเก่าค่อยๆ กลับเข้ากะทีละกลุ่ม {name}กลับเข้าไปพร้อมรอยช้ำเป็นแถบยาวข้างตัว ค่าแรงเท่าเดิม กะยาวเท่าเดิม
        effects: { hp: -2, stats: { CON: 1 }, alignment: { law: -1 }, flags: [broke_strike_line] }
    - id: steal_ledger
      label: คืนนั้นแอบเข้าไปเอาสมุดบัญชีหักค่าแรงออกมา
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ห้องบัญชีอยู่ชั้นสอง หน้าต่างไม่ได้ลงกลอนเพราะไม่มีใครคิดว่าจะมีคนปีนขึ้นมา {name}ปีนรางน้ำขึ้นไป กลับลงมาพร้อมสมุดเล่มหนาสีน้ำตาล ข้างในมีชื่อคนงานทุกคน กับยอดที่หักทุกอาทิตย์ หักค่าน้ำ หักค่าตะเกียง หักค่าหมวก หักค่ารองเท้าที่บริษัทไม่เคยแจก

          เช้ามามีคนอ่านออกเสียงหน้าประตูใหญ่ทีละหน้า ยามสามสิบคนก็ยืนฟังด้วย ครึ่งหนึ่งเป็นพี่น้องของคนที่นั่งอยู่ บ่ายนั้นบริษัทยอมคืนค่าแรงให้เมียของคนที่ตาย และยกเลิกค่ารองเท้า
        effects: { stats: { DEX: 1 }, alignment: { law: -1, moral: 1 }, flags: [stole_strike_ledger] }
      failure:
        text: |
          หน้าต่างลงกลอนแล้ว {name}ห้อยอยู่บนรางน้ำ ทุบกระจกด้วยศอก เสียงดังพอให้หมาเฝ้าโกดังเห่าลั่นทั้งแถบ {name}ปล่อยมือลงมาก่อนยามจะถือตะเกียงมาถึง ข้อมือแตกเลือดซิบ

          เช้ามามียามยืนเฝ้าห้องบัญชีสองคน และบริษัทบอกว่าคนนัดหยุดงานพังทรัพย์สินของบริษัท ใครไม่เข้ากะพรุ่งนี้ไม่ต้องมาอีก
        effects: { hp: -1, stats: { DEX: 1 }, alignment: { law: -1 }, flags: [broke_strike_line] }
    - id: go_back_in
      label: เก็บเครื่องมือ เดินเข้าประตูไปกับคนงานใหม่
      text: |
        {name}ลุกขึ้นจากแถวที่สาม หยิบเครื่องมือขึ้นมา แล้วเดินผ่านคนที่นั่งอยู่ไปทีละแถว ไม่มีใครพูดอะไร ไม่มีใครถ่มน้ำลายใส่ แค่ไม่มีใครมอง

        บริษัทจ่ายค่าแรงสองเท่าให้คนที่เข้ากะวันนั้น อาทิตย์ต่อมาทุกคนกลับเข้ากะ ค่าแรงเท่าเดิม แต่ตอนพักกินข้าว ม้านั่งข้าง{name}ว่างอยู่ทั้งสองฝั่งไปอีกนาน
      effects: { gold: 4, alignment: { law: 1 }, flags: [crossed_strike_line] }

- id: youth.commoner_field_sold
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    flags: [path_commoner]
    location_tag: arvel_village
  text: |
    เจ้าของที่ขายนาผืนที่{name}ทำมาตั้งแต่เด็กให้บริษัทจากเวนทราส ขายพร้อมเนินทั้งเนินทางตะวันออก ไม่มีใครในหมู่บ้านรู้จนวันที่เกวียนบริษัทมาถึง

    เกวียนขนจานรับดาวมาสิบสองเล่ม จานแต่ละใบกว้างเท่าลานนวดข้าว คนงานบริษัทถอนต้นข้าวที่ยังไม่ออกรวงทิ้งไว้ข้างคันนา แล้วปักเสาเหล็กลงไปแทนเป็นแถว ระยะห่างเท่ากันทุกต้น

    ปลายเดือน เนินตะวันออกเป็นทุ่งจานโลหะหงายรับฟ้า คืนแรกที่จานรับแสง นกทั้งฝูงที่เคยลงนอนบนเนินนั้นทุกค่ำบินวนอยู่ข้างบนจนมืด แล้วไปลงที่อื่น บริษัทติดป้ายรับคนงานไว้ที่ทางเข้าหมู่บ้าน
  choices:
    - id: work_the_dishes
      label: ไปสมัครเป็นคนปีนเช็ดจาน
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          งานคือปีนขึ้นไปบนจานตอนสาง ก่อนแดดจะแรง เช็ดฝุ่นกับขี้นกออกด้วยผ้าชุบน้ำส้มให้เงาทั้งใบ จานโค้งลื่นเหมือนกระทะทาน้ำมัน คนงานบริษัทให้ผูกเชือกที่เอว แต่เชือกสั้นกว่าจาน

          {name}ทำได้ดีตั้งแต่อาทิตย์แรก ค่าแรงเท่าทำนาสองเท่า คนในหมู่บ้านบางคนพูดด้วยน้อยลง บางคนมาถามว่าบริษัทรับคนเพิ่มไหม คนงานบนจานอีกสามคนที่นอนเพิงเดียวกับ{name}ตื่นมาเล่าฝันเรื่องเดียวกันแทบทุกเช้า ฝันว่ายืนอยู่กลางจานใบใหญ่ แหงนมองดาวที่ไม่กะพริบ ทั้งสามคนเล่าตรงกันจนถึงสีของดาว แล้วหันมามอง{name} รอให้เล่าบ้าง
        effects: { stats: { DEX: 1 }, gold: 6, world: { star: 1 }, flags: [dish_field_worker] }
      failure:
        text: |
          วันที่สาม{name}ลื่นจากขอบจาน ไถลลงไปตามความโค้งจนสุดเชือก แล้วเชือกก็สุดก่อนพื้น {name}ห้อยกระแทกขาเสาเหล็กอยู่ตรงนั้นจนคนงานบริษัทปีนลงมาตัดเชือก

          บริษัทจ่ายค่าแรงสามวันให้ครบ แล้วบอกว่าไม่ต้องมาอีก ข้อเท้าข้างที่กระแทกเสาบวมจนใส่รองเท้าไม่ได้ไปครึ่งเดือน
        effects: { hp: -2, stats: { DEX: 1 }, gold: 1, flags: [fell_off_dish] }
    - id: turn_them_down
      label: คืนเดือนมืด แอบขึ้นไปพลิกจานคว่ำลงทีละใบ
      check: { stat: STR, dc: 13 }
      success:
        text: |
          จานแต่ละใบหมุนได้บนหัวเสา ต้องใช้แรงสองคน แต่{name}ใช้คนเดียว เอาไหล่ดันขอบจานจนหมุนลงทีละนิ้ว ทำทีละใบจนเกือบสาง คว่ำได้สิบเจ็ดใบ ทุกใบหันหน้าลงดิน

          เช้ามาคนงานบริษัทยืนดูทุ่งจานที่คว่ำอยู่ครึ่งทุ่ง ด่ากันเองว่าใครลืมลงกลอน คืนนั้นทั้งทุ่งไม่ได้น้ำค้างดาวสักหยด และนกฝูงเดิมก็ลงมานอนบนเนินอีกครั้ง คืนเดียว คืนต่อมาบริษัทจ้างยามเฝ้าทุ่งพร้อมหมา
        effects: { stats: { STR: 1 }, alignment: { law: -1 }, world: { star: -1 }, flags: [turned_the_dishes] }
      failure:
        text: |
          ใบที่สามหมุนกลับขึ้นมาเองตอน{name}ปล่อยมือ ขอบจานกวาดเข้าที่หน้าอกจนล้มหงายลงไปกลางร่องเสา เสียงโลหะดังก้องไปทั้งเนิน หมาของบ้านท้ายหมู่บ้านเห่าลั่น ตามมาด้วยหมาทุกบ้าน

          {name}คลานกลับบ้านทางคันนา หายใจทีไรเจ็บแปลบใต้นมทุกที เช้ามาบริษัทจ้างยามเฝ้าทุ่งพร้อมหมา และติดป้ายใหม่ ใครรู้ว่าใครขึ้นมาบนเนินเมื่อคืน ได้เงินห้าเหรียญ
        effects: { hp: -2, stats: { STR: 1 }, alignment: { law: -1 }, flags: [tried_to_turn_dishes] }
    - id: harvest_road
      label: ไปรับจ้างเกี่ยวข้าวหมู่บ้านอื่น ตามฤดูไปเรื่อยๆ
      text: |
        {name}เดินตามฤดูเกี่ยวข้าวไปทางตะวันตก หมู่บ้านละสิบวัน นอนในยุ้งของคนอื่น กินข้าวหม้อเดียวกับคนแปลกหน้า หลังมือด้านจนเคียวไม่บาด

        ทุกหมู่บ้านที่ผ่าน มีคนถามว่าบริษัทจานมาถึงหมู่บ้าน{name}แล้วหรือ ถามแบบคนที่รู้ว่าอีกไม่นานก็คงถึงหมู่บ้านตัวเองเหมือนกัน ปลายฤดู{name}กลับบ้านพร้อมเหรียญในถุงผ้า
      effects: { stats: { CON: 1, STR: 1 }, gold: 4, flags: [harvest_walker] }

- id: youth.commoner_last_young_night
  stage: youth
  weight: 30
  when:
    age: [17, 17]
    flags: [path_commoner]
    not_flags: [origin_marked_hidden]
  text: |
    งานเลี้ยงปลายปีครั้งนั้นเป็นครั้งแรกที่คนแก่เรียก{name}ไปนั่งโต๊ะผู้ใหญ่ ปีหน้า{name}จะได้ค่าแรงผู้ใหญ่ เสียภาษีผู้ใหญ่ และถ้ามีใครมาขอ ก็แต่งงานได้

    เพื่อนรุ่นเดียวกันที่ออกไปจากบ้านตั้งแต่ปีที่สิบสี่กลับมาสองสามคน คนหนึ่งมีแผลเป็นยาวพาดคิ้ว อีกคนแต่งเครื่องแบบที่ไม่มีใครในงานรู้จัก ทั้งคู่ดื่มเร็วกว่าคนอื่นในงาน และเล่าเรื่องที่ฟังแล้วไม่แน่ใจว่าควรหัวเราะ ส่วนคนที่สามที่ทุกคนรออยู่ไม่ได้กลับมา และไม่มีใครถามถึงก่อนเที่ยงคืน

    ที่โต๊ะผู้ใหญ่ ชายที่ตัวใหญ่ที่สุดในถิ่นวางศอกลงบนโต๊ะ ยื่นมือมาตรงหน้า{name}
  choices:
    - id: arm_wrestle
      label: วางศอกลง จับมือเขา
      check: { stat: STR, dc: 14 }
      success:
        text: |
          มือเขาใหญ่จนกุมมือ{name}ได้มิด แต่ข้อมือ{name}ไม่ยอมเอียง ทั้งโต๊ะเงียบลง แล้วก็ทั้งงาน หน้าเขาแดงขึ้นทีละนิด {name}กัดฟันจนเจ็บกราม ข้อมือของเขาค่อยๆ เอียงลงไปหาโต๊ะ เอียงลงไปจนหลังมือแตะไม้

          เขาหัวเราะเสียงดังที่สุดในงาน สั่งเหล้าให้{name}หนึ่งแก้ว แล้วบอกทุกคนที่โต๊ะว่าปีหน้าใครจะจ้างคนแบก ให้มาจ้างคนนี้
        effects: { stats: { STR: 1 }, gold: 2, flags: [won_the_table] }
      failure:
        text: |
          ข้อมือ{name}ล้มลงแตะโต๊ะก่อนนับถึงสาม ทั้งโต๊ะหัวเราะ ชายตัวใหญ่ไม่หัวเราะ เขาจับมือ{name}ไว้ต่ออีกพัก พลิกดูหลังมือที่ด้านเป็นแถบ แล้วบอกว่ามือแบบนี้ทำงานมาแล้วหลายปี อีกสองปีค่อยมาใหม่

          ทั้งคืนนั้น คนที่โต๊ะผู้ใหญ่ผลัดกันมาตบไหล่{name} เหมือนตบไหล่คนในโต๊ะเดียวกัน
        effects: { stats: { CON: 1 }, flags: [lost_the_table] }
    - id: dance_till_dawn
      label: ไม่นั่งโต๊ะผู้ใหญ่ ลุกไปเต้นกลางลานจนเช้า
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}เต้นทุกเพลงที่วงเล่น เต้นกับเพื่อนที่มีแผลเป็นพาดคิ้วจนเขาหัวเราะออกมาจริงๆ เป็นครั้งแรกในคืนนั้น เต้นกับคนแก่ที่ไม่ได้เต้นมาสิบปี เต้นกับคนที่{name}ไม่เคยกล้ามองหน้าตรงๆ จนวงดนตรีวางเครื่อง

          ฟ้าสางแล้ว{name}ยังยืนหอบอยู่กลางลาน พื้นลานมีแต่รอยเท้า คนที่{name}ไม่เคยกล้ามองหน้ายืนหอบอยู่ข้างๆ ไม่มีใครรีบกลับบ้าน
        effects: { stats: { DEX: 1, CHA: 1 }, flags: [danced_till_dawn] }
      failure:
        text: |
          เพลงที่สามเท้า{name}พันกับเท้าคนเต้นข้างๆ ล้มลงไปทั้งคู่ ทับโต๊ะขนมทั้งโต๊ะ เด็กๆ หัวเราะจนต้องนั่งลงกับพื้น {name}ลุกขึ้นมาทั้งที่เสื้อเลอะน้ำเชื่อม แล้วเต้นต่อ เต้นผิดจังหวะไปจนเช้า

          ทั้งปีหลังจากนั้น เด็กในถิ่นเรียก{name}ว่าคนโต๊ะขนม {name}ไม่ได้ห้าม
        effects: { stats: { CON: 1 }, flags: [danced_till_dawn] }
    - id: sit_with_elders
      label: นั่งฟังคนแก่ที่โต๊ะผู้ใหญ่คุยกันจนงานเลิก
      text: |
        {name}ไม่ยื่นมือออกไป ชายตัวใหญ่ไม่ได้ว่าอะไร หันไปท้าคนอื่น ส่วนคนแก่ที่นั่งหัวโต๊ะเล่าเรื่องปีที่น้ำท่วม ปีที่ข้าวยากหมากแพง ปีที่มีคนแปลกหน้าเดินผ่านมาแล้วไม่มีใครเห็นเดินกลับไป เล่าเหมือนเล่าให้กันเองฟัง ไม่ได้เล่าให้{name}

        ใกล้เที่ยงคืน มีคนเอ่ยชื่อเพื่อนคนที่สามที่ไม่ได้กลับมา คนแก่หัวโต๊ะเทเหล้าลงพื้นข้างเก้าอี้หนึ่งหยด แล้วเล่าเรื่องอื่นต่อ {name}เทตาม
      effects: { stats: { WIS: 1 }, flags: [sat_with_elders] }
