# วัยกลางคน: ครอบครัว ชุด B (batch 4 package A)
# ลูกแต่ละวัย (ใช้ได้ทั้งลูกที่เกิดเองและเด็กที่รับมาเลี้ยง จึงไม่บอกว่าเกิดจากใคร ไม่บอกอายุ ไม่บอกว่าหน้าเหมือนใคร)
# แม่ที่อยากมาอยู่ด้วยหรือไม่ยอมมา และชีวิตของคนที่อยู่คนเดียวหรือไม่มีลูก ทุกเรื่องไม่มีใครตาย

- id: adult.fam_kid_fever_night
  stage: adult
  scene: home
  weight: 18
  cast:
    kid: { kin: [child], min_age: 3, max_age: 6, pick: youngest }
  when:
    age: [30, 64]
    not_flags: [child_horned]
  text: |
    {kid}ตื่นมาร้องตอนดึก ตัวร้อนจนผ้าปูตรงที่นอนทับชื้นเป็นรูปเด็กคนหนึ่ง ร้องว่าหนูหนาว แล้วถีบผ้าห่มออกเพราะร้อน แล้วร้องว่าหนาวอีก

    {name}เพิ่งกลับจากงานได้ไม่ถึงชั่วยาม รองเท้ายังไม่ได้ถอดข้างหนึ่ง บ้านหมอยาอยู่สุดถนนอีกฝั่ง ป่านนี้คงลงกลอนนอนแล้ว ในบ้านมีน้ำในโอ่งครึ่งโอ่ง ผ้าขนหนูสองผืน น้ำผึ้งติดก้นกระปุก

    {kid}จับนิ้ว{name}ไว้แน่น บอกว่าเพดานหมุน
  choices:
    - id: carry_to_the_healer
      label: ห่อ{kid}ด้วยผ้าห่ม แบกวิ่งไปเคาะบ้านหมอยา
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ถนนมืด ตะเกียงหน้าบ้านดับไปเกือบหมด {name}วิ่งจนลมหายใจขาดเป็นท่อน {kid}ซบคอร้อนผ่าวอยู่บนบ่า หมอยาเปิดประตูตอนเคาะรอบที่สาม ผ้าคลุมหัวใส่กลับด้าน ต้มน้ำเปลือกหลิวให้จิบ เช็ดตัวด้วยน้ำผสมน้ำส้มสายชู กลิ่นเปรี้ยวคลุ้งทั้งห้อง

          ไข้ลดตอนไก่ขันรอบสอง {kid}หลับบนเตียงคนไข้ {name}หลับนั่งบนเก้าอี้ข้างเตียง หมอยาไม่คิดเงิน บอกว่าจะคิดค่าปลุกทีหลัง
        effects: { stats: { CON: 1 }, flags: [ran_the_kid_to_the_healer] }
      failure:
        text: |
          กลางถนน{name}สะดุดรากไม้ที่โผล่พ้นดิน ล้มเข่ากระแทกพื้น แขนยังกอด{kid}ไว้ไม่ให้แตะดิน ลุกขึ้นวิ่งต่อทั้งเลือดซึมกางเกง หมอยาดูเด็กก่อน แล้วค่อยดูเข่า

          หมอยาบอกว่าไข้แบบนี้เช็ดตัวที่บ้านก็หาย เข่าแบบนี้สิต้องเย็บ {kid}นอนดูหมอยาเย็บเข่า{name}จนจบ แล้วหลับไปก่อนเข็มสุดท้าย
        effects: { hp: -1, flags: [ran_the_kid_to_the_healer] }
    - id: sponge_all_night
      label: ตักน้ำเช็ดตัว{kid}ทั้งคืน นับลมหายใจไปด้วย
      text: |
        ผ้าผืนหนึ่งแช่น้ำ อีกผืนวางบนหน้าผาก สลับกันทุกครั้งที่ผ้าอุ่น {name}นับลมหายใจของ{kid} นับได้เร็วเกินก็นับใหม่ นับจนรู้ว่าเร็วเกินไม่ได้แปลว่าอะไร แค่ตัวเองนับเร็ว

        ตอนฟ้าสาง ผ้าบนหน้าผากเย็นอยู่ได้นานขึ้น {kid}ลืมตา บอกว่าหนูหิวข้าวต้ม {name}หลับไปตรงขอบเตียงก่อนจะได้ลุกไปต้ม
      effects: { stats: { WIS: 1 }, flags: [sponged_the_kid_all_night] }
    - id: steam_bowl
      label: ต้มน้ำใส่ชาม คลุมผ้าให้{kid}สูดไอ แบบที่เคยมีคนทำให้{name}ตอนเด็ก
      requires: { flag: weak_chest }
      text: |
        {name}จำกลิ่นนี้ได้ ชามน้ำร้อน ใบมะนาวสามใบ ผ้าผืนใหญ่คลุมหัว ตอนเด็ก{name}นั่งใต้ผ้าแบบนี้ทุกหน้าหนาว หายใจไม่ออกทั้งคืนจนกว่าไอน้ำจะเข้าไปถึงอก

        {kid}ไม่ยอมอยู่ใต้ผ้า ดิ้นออกมาสามรอบ รอบที่สี่{name}มุดเข้าไปด้วย สองหัวชิดกันเหนือชามน้ำร้อน เหงื่อหยดลงชามทั้งสองคน ไข้แตกก่อนเช้า {name}ลมพิษขึ้นทั้งหน้าเพราะใบมะนาว
      effects: { alignment: { moral: 1 }, flags: [steamed_the_fever_out] }

- id: adult.fam_kid_first_lie
  stage: adult
  scene: home
  weight: 18
  cast:
    kid: { kin: [child], min_age: 6, max_age: 10, pick: eldest }
  when:
    age: [30, 64]
    not_flags: [child_horned]
  text: |
    ลูกมะเดื่อเชื่อมสองลูกโผล่ออกมาจากกระเป๋าเสื้อของ{kid}ตอน{name}จะเอาเสื้อไปซัก ห่อใบตองไว้ น้ำเชื่อมซึมจนกระเป๋าแข็ง มะเดื่อเชื่อมแบบนี้ขายแผงเดียวในตลาด ลูกละครึ่งเหรียญทองแดง {kid}ไม่มีเงินสักครึ่งเหรียญ

    {name}ถามว่าได้มาจากไหน {kid}บอกว่าเพื่อนให้ ถามว่าเพื่อนคนไหน {kid}บอกชื่อเด็กที่ย้ายไปอยู่ถิ่นอื่นตั้งแต่หน้าฝน แล้วเอานิ้วที่ยังเหนียวน้ำเชื่อมขึ้นเกาหัว
  choices:
    - id: pay_back_together
      label: จูงมือ{kid}ไปที่แผงมะเดื่อ ให้จ่ายคืนด้วยมือตัวเอง
      text: |
        {name}ให้ยืมเหรียญทองแดงหนึ่งเหรียญ {kid}กำไว้จนเหงื่อซึม ยืนหน้าแผงอยู่นานกว่าจะยื่นออกไป แม่ค้ามะเดื่อรับเหรียญโดยไม่ดุ บอกว่ารู้ตั้งแต่เมื่อวาน มะเดื่อหายสองลูก ขาโต๊ะมีรอยนิ้วเหนียวเท่านิ้วเด็ก

        แล้วนางให้{kid}มานั่งคัดมะเดื่อลูกเสียทุกเช้าวันพักงานจนครบเดือน ค่าแรงเป็นมะเดื่อลูกเสีย {kid}กลับบ้านมือเหนียวทุกสัปดาห์ และบอกได้ทุกครั้งว่าได้มาจากไหน
      effects: { gold: -1, alignment: { law: 1 }, flags: [kid_paid_back_the_figs] }
    - id: claim_you_did_it_too
      label: เล่าให้{kid}ฟังว่าตอนเด็ก{name}ก็เคยขโมยของจากแผงในตลาด
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}เล่าเรื่องขโมยลูกพลับจากแผงยายหูตึง โดนจับได้เพราะลูกพลับยังไม่สุก กินแล้วฝาดจนลิ้นชา ต้องเดินกลับไปขอน้ำจากยายคนที่เพิ่งขโมยมา {kid}ฟังตาโต ถามว่าจริงหรือ {name}บอกว่าจริง

          เช้าวันรุ่งขึ้น{kid}เดินไปแผงมะเดื่อคนเดียว เอามะเดื่อลูกที่ยังไม่ได้กินไปวางคืน แล้วกลับมาถามว่าลูกพลับฝาดขนาดไหน ฝาดกว่ามะเดื่อไหม
        effects: { stats: { CHA: 1 }, flags: [told_the_kid_a_theft_story] }
      failure:
        text: |
          {name}เล่าเรื่องขโมยลูกพลับจากแผงยายหูตึง เล่าไปเรื่องก็ยาวขึ้น มีหมาไล่ มีปีนรั้ว มีแพะ {kid}ฟังจนจบ แล้วบอกว่าตอนต้นบอกว่าลูกท้อ ไม่ใช่ลูกพลับ แล้วหมากลายเป็นแพะตอนไหน

          {name}ตอบไม่ทัน {kid}เก็บมะเดื่อลูกที่เหลือกลับเข้ากระเป๋า บอกว่าถ้าอย่างนั้นหนูก็ยังไม่ต้องคืน ต้องรอฟังเรื่องที่จริงก่อน
        effects: { flags: [told_the_kid_a_theft_story, kid_caught_the_story] }
    - id: leave_it_on_the_table
      label: วางมะเดื่อไว้บนโต๊ะ ไม่ถามอะไรอีก แล้วรอดู
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          มะเดื่อสองลูกวางอยู่บนโต๊ะสามวัน มดขึ้นตั้งแต่วันแรก {kid}เดินผ่านทีไรก็ปัดมดออก ไม่กิน ไม่เอาไปไหน เช้าวันที่สี่มะเดื่อหายไปจากโต๊ะ ใบตองพับเก็บไว้ข้างครัว

          สายวันนั้น{name}เดินผ่านแผงมะเดื่อ แม่ค้าบ่นว่ามีคนเอามะเดื่อเชื่อมสองลูกมาวางคืนบนแผงตั้งแต่ก่อนนางมาเปิดร้าน มดขึ้นจนขายไม่ได้ ไม่รู้ว่าใคร
        effects: { stats: { WIS: 1 }, flags: [left_the_figs_on_the_table] }
      failure:
        text: |
          มะเดื่อวางอยู่บนโต๊ะได้ครึ่งวัน ตกเย็นเหลือแต่ใบตอง {kid}บอกว่ามดขนไปหมดแล้ว หนูเห็นกับตา

          ใบตองแผ่นนั้นสะอาดเอี่ยม ไม่เหลือน้ำเชื่อมสักหยด ไม่มีมดตัวไหนเลียได้สะอาดขนาดนั้น
        effects: { flags: [left_the_figs_on_the_table, kid_ate_the_figs] }
    - id: sticky_fingers
      label: สอน{kid}ว่าคนที่โดนจับคือคนที่นิ้วยังเหนียว
      requires: { class: rogue }
      text: |
        {name}พาไปล้างมือที่โอ่ง สอนให้ล้างซอกเล็บ สอนว่าของที่เอามาไม่อยู่ในกระเป๋าเสื้อตัวที่จะส่งซัก {kid}ตั้งใจฟังกว่าทุกเรื่องที่เคยสอน แล้วถามต่อว่าถ้าแม่ค้าหันมาเห็น ต้องวิ่งไปทางไหน {name}อ้าปากจะตอบ แล้วหุบ

        คืนนั้น{name}เดินไปแผงมะเดื่อคนเดียว วางเหรียญทองแดงไว้ใต้ตาชั่ง ไม่ได้บอก{kid} ขากลับล้างมือที่บ่อหัวถนน ล้างซอกเล็บด้วย
      effects: { gold: -1, alignment: { law: -1 }, flags: [taught_the_kid_about_sticky_fingers] }

- id: adult.fam_kid_asks_about_you
  stage: adult
  scene: home
  weight: 18
  cast:
    kid: { kin: [child], min_age: 9, max_age: 13, pick: youngest }
  when:
    age: [30, 64]
    not_flags: [child_horned]
  text: |
    {kid}กลับจากบ่อน้ำพร้อมถังที่ตักมาได้ครึ่งเดียว แล้วถามขึ้นมาตอนเทน้ำลงโอ่ง ว่าทำไมยายร้านด้ายหัวมุมต้องข้ามถนนทุกครั้งที่เห็น{name}เดินมา เด็กที่บ่อน้ำพูดกันว่ายายรู้อะไรบางอย่าง เรื่องที่{name}เคยทำก่อนมาอยู่ถนนนี้

    {kid}ถามโดยไม่หันมา เทน้ำจนหมดถัง แล้วยืนรอ ถังเปล่าห้อยอยู่ในมือ
  choices:
    - id: show_the_brand
      label: ถลกแขนเสื้อขึ้นให้{kid}ดูตรา แล้วเล่าว่าคนแปลกหน้าเห็นอะไร
      requires: { trait: curse_brand }
      text: |
        {name}บอกว่ายายไม่ได้รู้อะไร ยายเห็นตรานี้ตอน{name}ถลกแขนเสื้อตักน้ำครั้งหนึ่ง แล้วคิดเอาเองว่ารู้ คนแปลกหน้าส่วนมากก็คิดแบบนั้น {kid}เอานิ้วแตะตรา บอกว่าอุ่นจริงอย่างที่เด็กที่บ่อพูด แล้วถามว่าเจ็บไหม {name}บอกว่าไม่ อุ่นเฉยๆ

        วันต่อมา{kid}เดินไปยืนหน้าร้านด้ายหัวมุม ถลกแขนเสื้อขึ้นทั้งสองข้างให้ยายดูว่าข้อมือไม่มีอะไร ยายเรียกเข้าไปในร้าน ให้ด้ายแดงม้วนหนึ่ง แล้วยังข้ามถนนเหมือนเดิมเวลา{name}เดินมา
      effects: { alignment: { moral: 1 }, flags: [showed_the_kid_the_brand] }
    - id: tell_the_scar
      label: บอก{kid}ว่าแผลเป็นใต้คางได้มาจากหลานของยาย คืนที่{name}รับจ้างเฝ้าร้านเหล้า
      requires: { class: warrior }
      text: |
        หลานชายของยายเมาแล้วไม่ยอมจ่ายเหล้า {name}จับคอเสื้อลากออกประตู หลานยายคว้าขวดเปล่าฟาดสวนมา ขวดแตกที่คาง {name}ยังลากต่อจนถึงร่องน้ำหน้าร้าน แล้วเย็บแผลเองที่โต๊ะหลังร้าน เย็บเบี้ยว

        {kid}ถามว่ายายกลัว{name}หรือ {name}บอกว่าไม่ ยายอาย ทุกครั้งที่เห็นแผลนี้ยายเห็นหลานตัวเอง ตั้งแต่วันนั้น{kid}เดินผ่านร้านด้ายแล้วทักยายเสียงดังทุกเช้า ยายรับด้วยเสียงดังกว่า
      effects: { stats: { CHA: 1 }, flags: [told_the_kid_about_the_scar] }
    - id: tell_about_the_stones
      label: เล่าเรื่องเวรเฝ้าแนวหินผนึกที่ป้อมสาม ตามจริงทุกอย่าง
      requires: { flag: job_wardens }
      text: |
        คนรุ่นยายเชื่อว่าคนที่เคยยืนเวรที่แนวหินพาเถ้ากลับมาด้วยในรอยพับเสื้อ ยายจึงข้ามถนน {name}เล่าที่เหลือ ตะเกียงที่ต้องเติมน้ำมันทุกสองชั่วยาม หินที่อุ่นตอนกลางคืน ความหนาวจนเล็บม่วง กับเพื่อนกะที่กรนเสียงดังกว่าหมาเถ้า

        {kid}ถามว่ามีปีศาจไหม {name}บอกว่ามีแต่หมาเถ้า {kid}ผิดหวังจนเห็นได้ชัด แล้วคืนนั้นก็ฝันร้ายถึงหมาเถ้าจนต้องย้ายมานอนข้าง{name} ตัวเท่านี้แล้วยังมานอนเบียด
      effects: { flags: [told_the_kid_about_the_watch] }
    - id: ask_her_together
      label: จูงมือ{kid}ไปถามยายร้านด้ายด้วยกันเลย
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ยายเห็นสองคนเดินตรงเข้าร้านก็ทำท่าจะลุกหนี แต่หนีไม่ทัน {name}ถามตรงๆ ยายเงียบไปพักหนึ่ง แล้วบอกว่าติดเงิน{name}สามเหรียญ ยืมไปซื้อยาให้ผัวตั้งแต่ปีที่{name}ย้ายมา ยังไม่มีคืน เลยไม่กล้าสู้หน้า

          {name}จำเรื่องนั้นไม่ได้เลยสักนิด ยายจ่ายคืนเป็นด้ายสามม้วน สีแดง สีคราม สีดำ {kid}ถือกลับบ้าน บอกว่าทีนี้ยายคงไม่ข้ามถนนแล้ว
        effects: { stats: { CHA: 1 }, flags: [asked_the_thread_woman] }
      failure:
        text: |
          ยายเห็นสองคนเดินมาแต่ไกล ลุกจากเก้าอี้ ข้ามถนนไปหลบในร้านขนมปัง เร็วกว่าที่คนวัยนั้นควรจะเดินได้ {name}รอหน้าร้านขนมปัง ยายออกประตูหลัง

          {kid}หัวเราะจนต้องนั่งลงข้างทาง ตั้งแต่วันนั้นเวลาสองคนเดินด้วยกันแล้วเห็นยายแต่ไกล {kid}จะจูงมือ{name}ข้ามถนนไปก่อน บอกว่าให้ยายได้เดินฝั่งที่มีร่มเงา
        effects: { flags: [asked_the_thread_woman, the_thread_woman_ran] }
    - id: teach_to_greet
      label: บอก{kid}ว่าไม่รู้เหมือนกัน แล้วสอนให้ทักยายทุกครั้งที่เดินผ่าน
      text: |
        {kid}ทักยายทุกเช้าตามที่สอน ยายไม่ตอบ ทักต่ออีกสัปดาห์ ยายไม่ตอบ ปลายเดือน{kid}กลับมาบอกว่าวันนี้ยายตอบแล้ว ตอบว่าเช้า แค่คำเดียว

        ยายยังข้ามถนนเวลา{name}เดินมา {kid}ยังเดินฝั่งเดียวกับยาย
      effects: { alignment: { moral: 1 }, flags: [taught_the_kid_to_greet_her] }

- id: adult.fam_kid_before_the_choosing
  stage: adult
  scene: market
  weight: 18
  cast:
    kid: { kin: [child], min_age: 12, max_age: 14, pick: eldest }
  when:
    age: [30, 64]
    not_flags: [child_horned]
  text: |
    คณะละครเร่ผ่านถิ่นมาปีละสองหน ปีนี้ตั้งเวทีท้ายตลาดนานกว่าทุกปี และ{kid}ไปนั่งดูทุกคืน กลับบ้านทีหลังเวลาที่สั่งทุกคืน เช้ามาก็ยืนท่องบทหน้าโอ่งน้ำ ท่องทั้งบทของขุนนาง บทของคนรับใช้ และบทของม้า

    วันเลือกทางของถิ่นจะมาถึงในปีหน้า โต๊ะของคณะละครมีทุกปี โต๊ะของช่างที่มีหลังคาให้นอนก็มีทุกปี {name}รู้จักช่างคนหนึ่งที่ยังขาดลูกมือ ทำงานในร่ม ค่าแรงไม่มาก แต่มาทุกเดือน

    คืนนี้{kid}กลับมาพร้อมรอยสีทาหน้าที่ล้างไม่ออกตรงไรผม แล้วบอกว่าหัวหน้าคณะให้ลองเล่นบทม้าหนึ่งคืน
  choices:
    - id: go_watch_the_horse
      label: ไปดู{kid}เล่นบทม้าคืนนั้น แล้วปล่อยให้เลือกเอง
      text: |
        บทม้ามีเสียงร้องสามครั้ง กับวิ่งข้ามเวทีหนึ่งรอบ {kid}ร้องครั้งที่สองแล้วเสียงแตก คนดูหัวเราะ ครั้งที่สามร้องให้แตกกว่าเดิมแบบตั้งใจ คนดูหัวเราะจนหัวหน้าคณะต้องรอ

        ขากลับ{kid}ถามว่าเป็นยังไง {name}บอกว่าเป็นม้าที่เสียงแตกดีที่สุดที่เคยเห็น เรื่องโต๊ะในปีหน้า{name}ไม่พูดถึงอีกเลย
      effects: { alignment: { moral: 1 }, flags: [child_road_own_choice, watched_the_kid_play_the_horse] }
    - id: the_master_with_a_roof
      label: พา{kid}ไปหาช่างที่ขาดลูกมือ ให้ลองทำงานในร่มสักเดือน
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ไม่ได้ห้ามเรื่องละคร บอกแค่ว่าลองเดือนเดียว ช่างคนนั้นใจดีกว่าที่คิด ให้{kid}ท่องบทได้ระหว่างขัดของ เดือนแรกผ่านไป {kid}ขอลองต่ออีกเดือน

          ปีต่อมา{kid}ลงชื่อที่โต๊ะของช่าง คณะละครผ่านถิ่นอีกครั้ง {kid}ไปดูทุกคืน ท่องบทม้าเบาๆ ตามจากแถวหลังสุด
        effects: { stats: { CHA: 1 }, flags: [child_road_parents_choice, sent_the_kid_to_a_master] }
      failure:
        text: |
          {kid}ไปทำงานกับช่างครบเดือน ไม่ขาดสักวัน ไม่บ่นสักคำ ทุกคืนกลับมากินข้าวเสร็จแล้วออกไปท้ายตลาด ครบเดือน{kid}วางค่าแรงทั้งหมดไว้บนโต๊ะ บอกว่าลองแล้ว ตามที่ขอ

          ปีต่อมา{kid}ลงชื่อที่โต๊ะของคณะละคร ไม่ได้ถาม{name}ก่อน {name}รู้จากหัวหน้าคณะ ที่มายืนยันว่าเด็กจะได้กินข้าวครบสามมื้อ
        effects: { flags: [child_road_own_choice, sent_the_kid_to_a_master, quarrel_over_the_road] }
    - id: strike_a_bargain
      label: ต่อรองกับ{kid} กลางวันทำงานกับช่าง กลางคืนไปท้ายตลาดได้
      text: |
        {kid}ตกลงเร็วกว่าที่คิด ทำงานกับช่างตั้งแต่เช้าถึงบ่าย กินข้าวเย็นสองคำแล้ววิ่งไปท้ายตลาด กลับมาตอนดึก หลับคาโต๊ะช่างทุกบ่าย ช่างบ่นแต่ไม่ไล่

        ปีต่อมา{kid}ลงชื่อที่โต๊ะของช่าง ตามที่ต่อรองกันไว้ แต่ท่องบทได้ทั้งเรื่อง รวมถึงบทที่ไม่มีใครเล่น
      effects: { alignment: { law: 1 }, flags: [child_road_parents_choice, struck_a_bargain_on_the_road] }
    - id: teach_the_road
      label: สอน{kid}ส่วนที่คณะละครไม่เล่าให้ฟัง นอนเกวียน กินข้าวเย็น ร้องตอนไข้ขึ้น
      requires: { class: bard }
      text: |
        {name}เคยกินนอนบนเกวียนมาหลายหน้าฝน รู้ว่าเสียงที่ดีที่สุดของคณะคือเสียงที่ยังร้องได้ตอนคอแห้ง {name}พา{kid}ไปร้องกลางตลาดตอนเที่ยงวัน แดดเปรี้ยง คนเดินผ่านไม่หยุดฟัง ให้เหรียญมาหนึ่งเหรียญตอนจะเก็บของ

        {kid}ถามว่าทุกวันเป็นแบบนี้ไหม {name}บอกว่าวันดีเป็นแบบนี้ ปีต่อมา{kid}ยังลงชื่อที่โต๊ะคณะละคร พกเหรียญเหรียญนั้นติดตัวไปด้วย
      effects: { stats: { WIS: 1 }, flags: [child_road_own_choice, sang_at_noon_with_the_kid] }

- id: adult.fam_kid_first_wage
  stage: adult
  scene: home
  weight: 18
  cast:
    kid: { kin: [child], min_age: 15, max_age: 19, pick: youngest }
  when:
    age: [30, 64]
    not_flags: [child_horned]
  text: |
    {kid}กลับบ้านช้ากว่าทุกวัน ห่อผ้าเล็กๆ ไว้ในมือ วางลงบนโต๊ะแล้วแกะทีละมุม ข้างในเป็นเหรียญทองแดงเจ็ดเหรียญ เหรียญเงินหนึ่งเหรียญ กับถั่วเชื่อมถุงหนึ่งที่ถูกแกะกินไปครึ่งถุงระหว่างทาง

    ค่าแรงเดือนแรก {kid}นับให้ดูต่อหน้า นับสองรอบ รอบที่สองหยิบเหรียญทองแดงเหรียญหนึ่งกลับคืนกระเป๋า แล้วหยิบออกมาวางใหม่ ถั่วเชื่อมเลื่อนมาไว้ตรงหน้า{name} บอกว่าซื้อมาให้ แต่ทางมันไกล

    หลายบ้านในถิ่นถือว่าค่าแรงเดือนแรกต้องเข้าบ้านทั้งหมด หลายบ้านไม่ถือ บ้านนี้ยังไม่เคยต้องตัดสิน
  choices:
    - id: into_the_house_jar
      label: รับเหรียญทั้งหมดใส่ไหของบ้าน แล้วกินถั่วเชื่อม
      text: |
        {name}กวาดเหรียญลงไหทีละเหรียญ ให้{kid}ได้ยินเสียงเหรียญกระทบก้นไหทุกเหรียญ เหรียญเงินลงเป็นเหรียญสุดท้าย เสียงต่างจากเหรียญอื่น

        เดือนต่อมา{kid}ซื้อรองเท้าคู่ใหม่ให้ตัวเองด้วยค่าแรงเดือนที่สอง ไม่ได้ถามใคร ถั่วเชื่อมครึ่งถุงนั้นแข็งจนต้องอมให้นิ่มก่อนเคี้ยว
      effects: { gold: 2, alignment: { law: 1 }, flags: [kid_first_wage_to_the_house] }
    - id: keep_it_yourself
      label: ผลักเหรียญคืนไปตรงหน้า{kid} บอกว่าเก็บไว้เอง
      text: |
        {kid}ไม่ได้หยิบเหรียญที่กลับมากองอยู่ตรงหน้าทันที ถามว่าแน่ใจไหม {name}บอกว่าแน่ใจ ให้เก็บไว้ ถ้าจะใช้ก็ใช้ ถ้าจะเก็บก็เก็บ

        เหรียญทั้งหมดหายเข้ากระเป๋า{kid}ภายในครึ่งวัน เย็นนั้นมีปลาเค็มหนึ่งตัวกับน้ำมันตะเกียงหนึ่งขวดวางอยู่บนชั้นในครัว ไม่มีใครบอกว่าใครซื้อมา
      effects: { alignment: { moral: 1 }, flags: [gave_back_the_first_wage] }
    - id: one_coin_on_a_nail
      label: ขอไว้เหรียญเดียว เจาะรูแขวนตะปูข้างประตู
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}เจาะรูเหรียญทองแดงด้วยเหล็กแหลมกับค้อน ช้าๆ จนเหรียญไม่บิด ร้อยเชือก แขวนไว้บนตะปูข้างประตู ตรงระดับสายตา{kid} เหรียญที่เหลือให้{kid}เก็บ

          เหรียญนั้นแกว่งทุกครั้งที่ประตูเปิดปิด {kid}แตะมันทุกเช้าก่อนออกจากบ้าน ทำเป็นไม่ได้ตั้งใจ
        effects: { stats: { DEX: 1 }, flags: [kept_one_coin_of_the_first_wage] }
      failure:
        text: |
          ค้อนลงทีสุดท้ายแรงเกิน เหรียญงอเป็นรูปช้อน รูเบี้ยวไปติดขอบ {kid}หัวเราะจนถั่วเชื่อมติดคอ {name}ร้อยเชือกแขวนเหรียญงอนั้นไว้ข้างประตูอยู่ดี

          เหรียญงอแขวนตรงนั้นหลายหน้าฝน แขกที่มาบ้านถามทุกคนว่าคืออะไร {kid}เป็นคนตอบทุกครั้ง เรื่องยาวขึ้นทุกครั้ง
        effects: { flags: [kept_one_coin_of_the_first_wage, bent_the_first_coin] }
    - id: spend_it_together
      label: ชวน{kid}ออกไปตลาดด้วยกันเดี๋ยวนี้ ใช้เงินก้อนนั้นซื้อของที่{kid}อยากได้
      text: |
        {kid}อยากได้มีดพับด้ามเขาสัตว์ที่แผงเหล็กหัวตลาด ราคาเท่าค่าแรงทั้งเดือนพอดี {name}ยืนข้างหลังเฉยๆ ให้{kid}ต่อราคาเอง {kid}ต่อจนแม่ค้าเหล็กลดให้หนึ่งเหรียญ แล้วเอาเหรียญนั้นซื้อขนมให้{name}

        ขากลับ{kid}กางมีดหุบมีดทุกสิบก้าว ถึงบ้านนิ้วโป้งมีแผลบางๆ หนึ่งรอย ไม่ยอมให้{name}ทายา บอกว่าแม่ค้าเหล็กบอกไว้ มีดใหม่ทุกเล่มต้องได้เลือดเจ้าของก่อนถึงจะเชื่อง
      effects: { alignment: { moral: 1 }, flags: [spent_the_first_wage_together] }

- id: adult.fam_kid_leaves
  stage: adult
  scene: road
  weight: 18
  cast:
    kid: { kin: [child], min_age: 17, max_age: 24, pick: eldest }
  when:
    age: [30, 64]
    not_flags: [child_lives_away]
  text: |
    {kid}ได้งานที่ค่ายวางรางรถไฟสายใหม่ทางตะวันออก ค่าแรงเป็นสองเท่าของงานในถิ่น กินนอนในค่าย กลับบ้านได้หน้าหนาวละครั้งถ้าโชคดี เกวียนรับคนงานออกจากลานหน้าตลาดตอนฟ้าสางพรุ่งนี้

    ห่อของของ{kid}ผูกไว้ตั้งแต่บ่าย วางอยู่ข้างประตู เล็กกว่าที่{name}คิดไว้มาก ผ้าห่มผืนหนึ่ง เสื้อสองตัว รองเท้าสำรองหนึ่งคู่ ของที่เหลือในห้อง{kid}บอกว่าให้ทิ้งก็ได้ หรือเก็บไว้ก็ได้ แล้วแต่

    คืนนั้นบ้านกินข้าวเย็นเร็วกว่าทุกวัน แล้วไม่มีใครลุกจากโต๊ะ
  choices:
    - id: carry_the_bundle
      label: ตื่นก่อนฟ้าสาง แบกห่อของไปส่งถึงเกวียน
      text: |
        {name}แบกห่อไปตลอดทาง {kid}ขอแบกเองสามรอบ ไม่ได้ ลานหน้าตลาดมีเกวียนสี่เล่ม คนงานยืนเบียดกันคนละห่อ แม่คนหนึ่งร้องไห้เสียงดัง พ่อคนหนึ่งตะโกนสั่งเรื่องถุงเท้า

        {name}ยื่นห่อขึ้นไปให้ตอนเกวียนออกแล้ว ต้องวิ่งตามสี่ห้าก้าว {kid}รับห่อไว้ แล้วตะโกนอะไรบางอย่างกลับมา เสียงล้อเกวียนกลบไปหมด
      effects: { stats: { STR: 1 }, flags: [child_left_home, parted_at_the_cart] }
    - id: bake_for_the_road
      label: ไม่นอนทั้งคืน อบขนมปังแข็งให้พอกินถึงค่าย
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ขนมปังแบบที่เก็บได้นานต้องอบสองรอบ {name}นวดแป้งตั้งแต่ตะเกียงดวงแรกในถนนดับ อบจนไก่ขัน ได้สิบสองก้อน แข็งจนเคาะโต๊ะได้ยินเสียง ห่อผ้ามัดไว้กับห่อของ

          {kid}แบกขึ้นเกวียนไปทั้งห่อ ปลายหน้าหนาวมีจดหมายกลับมาฉบับหนึ่ง บรรทัดเดียวเรื่องขนมปัง บอกว่าก้อนสุดท้ายกินตอนถึงค่ายได้สิบวันแล้ว แบ่งเพื่อนในเต็นท์ทั้งเต็นท์ ทุกคนฟันโยก
        effects: { stats: { CON: 1 }, flags: [child_left_home, parted_with_bread] }
      failure:
        text: |
          {name}หลับไปตอนรอบที่สองของการอบ ตื่นมาเพราะกลิ่นไหม้ ขนมปังดำไปครึ่งเตา ที่เหลือแข็งจนเคาะแตก ฟ้าสางพอดี เกวียนจะออกแล้ว

          {kid}เก็บก้อนที่ไหม้น้อยที่สุดสามก้อนใส่ห่อ บอกว่าที่ค่ายมีข้าวให้กิน ก้อนนี้ไว้เคี้ยวเล่น แล้ววิ่งไปขึ้นเกวียน {name}ล้างเตาที่ดำทั้งเตาอยู่จนเที่ยง
        effects: { hp: -1, flags: [child_left_home, parted_with_bread] }
    - id: stay_home
      label: ไม่ไปส่งที่ลาน บอกลากันที่ประตูบ้าน
      text: |
        {name}บอกว่าไม่ชอบลานเกวียน คนเยอะ เสียงดัง บอกลากันที่นี่ก็พอ {kid}ยืนอยู่ที่ธรณีกับห่อของ บอกว่าก็ได้ แล้วยังยืนอยู่ตรงนั้นอีกพักหนึ่ง

        พอ{kid}เดินลับหัวถนน{name}ก็ออกไปยืนกลางถนน ยืนจนได้ยินเสียงเกวียนออกจากลานไกลๆ ยืนอีกพักหนึ่งหลังเสียงนั้นเงียบไป แล้วเข้าบ้านไปหุงข้าวน้อยกว่าเมื่อวานหนึ่งกำมือ
      effects: { flags: [child_left_home, parted_at_the_door] }
    - id: sew_the_coins
      label: เย็บเหรียญสี่เหรียญซ่อนไว้ในชายเสื้อของ{kid}
      requires: { min_gold: 4 }
      text: |
        {name}เลาะตะเข็บชายเสื้อตัวที่{kid}จะใส่เดินทาง สอดเหรียญลงไปทีละเหรียญ เย็บปิดด้วยด้ายสีเดียวกับเสื้อ ห่างกันเท่าฝ่ามือ จะได้ไม่กระทบกันเป็นเสียง

        เช้านั้น{kid}ใส่เสื้อตัวนั้นขึ้นเกวียนไปโดยไม่รู้ หน้าหนาวถัดมามีจดหมายกลับมาบอกว่าเสื้อขาด เลยรู้ ใช้ไปสามเหรียญตอนเป็นไข้ อีกเหรียญยังเย็บไว้ที่เดิม จะไม่ใช้
      effects: { gold: -4, flags: [child_left_home, parted_with_sewn_coins] }

- id: adult.fam_kid_comes_back_owing
  stage: adult
  scene: home
  weight: 18
  cast:
    kid: { kin: [child], min_age: 20, max_age: 30, pick: youngest }
  when:
    age: [30, 64]
    not_flags: [child_lives_away]
  text: |
    {kid}กลับมาถึงบ้านบ่ายวันธรรมดา ไม่ใช่วันพักงาน มือขวาพันผ้าหนาเท่ากำปั้นสองกำ ห่อของบนหลังเล็กกว่าตอนไป ก่อนพูดอะไรวางกระดาษพับสี่ไว้บนโต๊ะก่อน

    กระดาษเป็นของนายช่างที่{kid}ไปฝึกงานด้วย มือขวาโดนแท่นอัดหนีบนิ้วสองนิ้ว หมอค่ายจัดกระดูกให้แล้ว แต่นายช่างเขียนว่าทำงานต่อไม่ได้ เครื่องมือที่ยืมไปเสียหายสองชิ้น สัญญาฝึกงานยังเหลืออีกปีครึ่ง รวมแล้ว{kid}ติดนายช่างเจ็ดเหรียญ ขอให้ส่งภายในหน้าฝน

    {kid}นั่งลงบนเก้าอี้ตัวเดิม วางมือที่พันผ้าไว้บนตัก บอกว่าจะหาเงินใช้คืนเอง ไม่ต้องห่วง แล้วก็นั่งอยู่ตรงนั้นทั้งบ่าย
  choices:
    - id: sign_for_it
      label: ไปลงชื่อรับหนี้กับนายช่างแทน{kid} ผ่อนเป็นเดือน
      text: |
        นายช่างให้ผ่อนเดือนละเหรียญ ลงชื่อสองคน{name}เป็นคนแรก ลายมือ{kid}ด้วยมือซ้ายเบี้ยวจนอ่านไม่ออกอยู่ข้างใต้ นายช่างไม่ว่าอะไร ยัดกระดาษเข้าลิ้นชักไปทั้งอย่างนั้น

        ทุกต้นเดือน{kid}เดินไปส่งเงินเอง เหรียญที่ส่งบางเดือนเป็นเหรียญของ{name} บางเดือนไม่ใช่ {name}ไม่เคยถามว่าเดือนไหนเป็นของใคร
      effects: { gold: -7, debt: true, alignment: { law: 1 }, flags: [signed_for_the_kids_debt] }
    - id: argue_with_the_master
      label: เดินทางไปหานายช่าง เถียงว่าเครื่องที่หนีบมือใครกันแน่ที่ต้องจ่าย
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ไปยืนดูแท่นอัดเครื่องนั้นเองก่อนเข้าไปหานาย สลักกันมือหลุดหายไปตั้งแต่ก่อน{kid}มา คนงานคนอื่นใช้เศษไม้ขัดไว้แทน {name}บอกนายช่างว่าค่าเครื่องมือสองชิ้นจะจ่าย สัญญาที่เหลือไม่จ่าย เพราะมือ{kid}ไม่ได้หายไปเอง

          นายช่างเถียงอยู่ครึ่งวัน ลูกมือคนอื่นมายืนฟังกันเต็มประตู สุดท้ายนายช่างฉีกสัญญาฝึกงาน รับเงินค่าเครื่องมือสามเหรียญ แล้วเอาสลักใหม่มาใส่แท่นอัดตอนที่{name}ยังยืนอยู่ตรงนั้น
        effects: { gold: -3, stats: { CHA: 1 }, flags: [argued_down_the_kids_debt] }
      failure:
        text: |
          นายช่างฟังจบแล้วยื่นสัญญาให้อ่าน มีชื่อ{kid}ลงไว้ชัด ข้อที่สี่เขียนว่าลูกมือรับผิดชอบเครื่องมือที่ใช้ทุกชิ้น {name}เถียงต่อ นายช่างเรียกลูกมือสองคนมายืนข้างประตู

          {name}จ่ายเจ็ดเหรียญเต็มตรงนั้น เพื่อให้กระดาษฉบับนั้นจบ ขากลับเข่าเริ่มปวดตั้งแต่ครึ่งทาง ยังเดินไม่ถึงบ้านดี
        effects: { gold: -7, hp: -1, flags: [argued_down_the_kids_debt, lost_to_the_kids_master] }
    - id: teach_the_left_hand
      label: ให้{kid}มาช่วยงานของ{name}เอง ด้วยมือซ้าย
      text: |
        งานของ{name}ไม่เหมือนงานที่{kid}ฝึกมา {kid}ทำช้า ทำผิด ทำของเสียไปสองชิ้นในสัปดาห์แรก หงุดหงิดจนเตะเก้าอี้ {name}ไม่ช่วย ให้ทำใหม่ทุกครั้ง

        พอหน้าฝน มือซ้ายของ{kid}จับเครื่องมือได้นิ่งกว่ามือขวาของคนที่ทำมาครึ่งชีวิต เงินที่ทำได้{kid}เก็บใส่ไหใบเล็กใต้เตียง ส่งนายช่างทีละเหรียญจนครบเจ็ด
      effects: { stats: { WIS: 1 }, flags: [taught_the_kid_a_left_handed_trade] }
    - id: reset_the_fingers
      label: แกะผ้าพันออกดูกระดูกที่หมอค่ายจัดไว้ แล้วจัดใหม่ถ้าจำเป็น
      requires: { any_flags: [job_hedge_doctor, job_road_healer] }
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          หมอค่ายจัดนิ้วกลางผิดข้อ ปล่อยไว้จะติดงอไปตลอดชีวิต {name}ให้{kid}กัดผ้า ดึงทีเดียว เสียงกระดูกเข้าที่ดังพร้อมเสียง{kid}ร้อง แล้วดามด้วยไม้ไผ่สองซีก

          ปลายหน้าฝนนิ้วทั้งสองงอได้ ไม่สุด แต่จับด้ามค้อนได้ {kid}กลับไปหานายช่างคนเดิม ขอทำงานใช้หนี้ นายช่างรับ เพราะลูกมือที่มือหายแล้วกลับมาได้ไม่ค่อยมี
        effects: { stats: { WIS: 1 }, flags: [reset_the_kids_fingers] }
      failure:
        text: |
          กระดูกติดกันไปแล้วครึ่งหนึ่ง {name}ดึงแล้วไม่เข้า ดึงอีกครั้ง{kid}เป็นลม {name}ตัดสินใจหยุด ดามกลับไว้อย่างเดิม แล้วนั่งเฝ้าจน{kid}ฟื้น

          นิ้วสองนิ้วนั้นงอติดไปตลอด {kid}หัดถือช้อนด้วยมือซ้าย หัดเขียนด้วยมือซ้าย ส่วนหนี้เจ็ดเหรียญ{name}จ่ายแทนไปก่อนครึ่งหนึ่ง
        effects: { gold: -3, flags: [reset_the_kids_fingers, the_fingers_stayed_bent] }

- id: adult.fam_kid_own_house
  stage: adult
  scene: home
  weight: 18
  cast:
    kid: { kin: [child], min_age: 22, max_age: 34, pick: eldest }
  when:
    age: [30, 64]
    not_flags: [child_lives_away]
  text: |
    {kid}เช่าบ้านได้แล้วหลังหนึ่ง อีกฝั่งถิ่น สองห้อง มีเตาของตัวเอง กับคนที่{kid}ยังไม่ยอมพามาให้รู้จักเต็มตัว เคยพามาครั้งเดียว ยืนอยู่หน้าบ้าน ไม่ยอมเข้า บอกว่าแค่ผ่านมา

    บ้านใหม่ยังไม่มีโต๊ะ {kid}พูดเรื่องนี้ตอนกินข้าว พูดแบบไม่มองโต๊ะที่กินข้าวอยู่ โต๊ะไม้ตัวใหญ่ตัวนี้อยู่ในบ้าน{name}มานานกว่าที่{kid}จำความได้ ขาข้างหนึ่งมีรอยฟันเด็กกัด ผิวโต๊ะมีรอยมีดสลักตัวอักษรที่เคยโดนดุ

    {kid}ขอแค่อย่างเดียว ถ้าให้ได้
  choices:
    - id: give_the_table
      label: ยกโต๊ะตัวนั้นให้ แล้วช่วยแบกข้ามถิ่นไปเอง
      text: |
        โต๊ะหนักกว่าที่คิด สองคนแบกกันคนละหัว หยุดพักทุกหัวมุม คนในถิ่นเดินผ่านทักว่าย้ายบ้านหรือ {name}บอกว่าย้ายโต๊ะ ไปถึงบ้านใหม่ คนที่{kid}ไม่ยอมพามาให้รู้จักเปิดประตูรอ ช่วยยกโต๊ะเข้าห้องเป็นคนที่สาม

        คืนนั้นบ้าน{name}ไม่มีโต๊ะ {name}กินข้าวบนเขียงที่วางพาดเก้าอี้สองตัว เขียงกว้างพอวางชามได้ใบเดียวพอดี
      effects: { stats: { STR: 1 }, flags: [child_settled, gave_the_kid_the_table] }
    - id: build_a_new_one
      label: เก็บโต๊ะตัวเก่าไว้ แต่ต่อโต๊ะตัวใหม่ให้ด้วยมือตัวเอง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ซื้อไม้ ไสไม้ทุกเย็นจนครบเดือน ต่อโต๊ะออกมาตัวเล็กกว่าตัวเก่า พอดีห้องสองห้อง ก่อนส่ง{name}เอามีดสลักตัวอักษรตัวหนึ่งไว้ใต้โต๊ะ ตรงที่ไม่มีใครเห็นถ้าไม่มุดลงไปดู

          {kid}ไม่ได้มุดลงไปดูจนอีกหลายปีต่อมา วันที่ทำช้อนตกแล้วต้องคลานตามไป
        effects: { stats: { DEX: 1 }, flags: [child_settled, built_the_kid_a_table] }
      failure:
        text: |
          โต๊ะตัวใหม่ออกมาโยก ขาข้างหนึ่งสั้นกว่าเท่าเล็บ {name}เลื่อยขาอีกสามข้างตามจนโต๊ะเตี้ยลงหนึ่งฝ่ามือ ไสพลาดโดนนิ้วไปอีกหนึ่งรอย

          {kid}รับโต๊ะเตี้ยตัวนั้นไป เอาเศษไม้หนุนขาข้างหนึ่งไว้ บอกว่าดีแล้ว เตี้ยแบบนี้นั่งพื้นกินข้าวได้ บ้านใหม่ยังไม่มีเก้าอี้อยู่แล้ว
        effects: { hp: -1, flags: [child_settled, built_the_kid_a_table] }
    - id: money_instead
      label: เก็บโต๊ะไว้ แล้วให้เงินห้าเหรียญไปซื้อตัวใหม่
      requires: { min_gold: 5 }
      text: |
        {kid}รับเงินไป ขอบคุณ แล้วไม่ได้พูดเรื่องโต๊ะอีก สัปดาห์ต่อมา{name}แวะไปบ้านใหม่ โต๊ะที่ซื้อมาเป็นโต๊ะไม้ใหม่เอี่ยม ผิวเรียบ ไม่มีรอยอะไรเลย

        {kid}ตั้งชามไว้ให้{name}ที่หัวโต๊ะ ส่วนเงินที่เหลือจากค่าโต๊ะ{kid}ซื้อผ้าม่านมาหนึ่งผืน สีเหลืองเข้ม ยังไม่ได้ขึ้นราว
      effects: { gold: -5, flags: [child_settled, gave_money_not_the_table] }
    - id: soup_on_the_first_night
      label: ไม่ให้โต๊ะ แต่หิ้วหม้อแกงไปถึงบ้านใหม่ในคืนแรก
      text: |
        {name}หิ้วหม้อแกงข้ามถิ่นไปตอนพลบค่ำ บ้านใหม่ยังไม่มีโต๊ะจริงๆ ตั้งหม้อบนลังไม้ สามคนนั่งพื้นล้อมลัง กินจากหม้อเดียวกัน คนที่{kid}ไม่ยอมพามาให้รู้จักกินเก่งกว่าที่คิด ขอเติมสองรอบ

        ขากลับ{name}หิ้วหม้อเปล่ากลับบ้าน โต๊ะตัวใหญ่ที่บ้านมีชามเหลือใบเดียว {name}ย้ายไปนั่งหัวโต๊ะฝั่งที่{kid}เคยนั่ง เห็นรอยมีดสลักชัดกว่าเดิม
      effects: { alignment: { moral: 1 }, flags: [child_settled, brought_soup_to_the_new_house] }

- id: adult.fam_parent_wants_to_come
  stage: adult
  scene: home
  weight: 12
  cast:
    mom: { id: mother, min_age: 62 }
  when:
    age: [40, 60]
    not_flags: [origin_marked_hidden]
  text: |
    หน้าหนาวนี้{mom}ล้มที่ขั้นบันไดหลังบ้านสองครั้ง ไม่บอกใคร {name}รู้จากเพื่อนบ้านของ{mom} คนที่ได้ยินเสียงล้มทั้งสองครั้งแล้วข้ามรั้วมาช่วยพยุง ครั้งที่สอง{mom}นอนอยู่บนพื้นครัวจนเกือบค่ำ

    {name}ไปถึงบ้าน{mom}ตอนเช้า{mom}กำลังโปรยข้าวให้ไก่ แขนซ้ายมีรอยช้ำสีม่วงอมเขียวเท่าฝ่ามือ บอกว่าชนประตู {name}บอกว่าบ้าน{name}มีห้องว่าง {mom}บอกว่าไก่ไม่มีใครเลี้ยง บอกว่าบ้าน{name}เสียงดัง บอกว่าเพื่อนบ้านที่นี่รู้ว่าวันไหนต้องเอาแกงมาให้ ที่นั่นไม่มีใครรู้ แล้วโปรยข้าวต่อ

    ขั้นบันไดหลังบ้านมีสามขั้น ขั้นกลางผุตรงขอบ
  choices:
    - id: bring_her_home
      label: ไม่ถามอีก ขนข้าวของของ{mom}ขึ้นเกวียน พาไปอยู่บ้าน{name}
      text: |
        {mom}บ่นตั้งแต่ของชิ้นแรกขึ้นเกวียนจนชิ้นสุดท้าย บ่นว่าหม้อใบนี้ไม่ต้องเอาไป บ่นว่าทำไมไม่เอาใบนั้นไป ไก่หกตัวมาในเข่ง ไก่บ่นพอๆ กับ{mom}

        สามสัปดาห์แรก{mom}ไม่ยอมแตะครัวของ{name} สัปดาห์ที่สี่เปลี่ยนที่วางเกลือ สัปดาห์ที่ห้าเปลี่ยนที่วางมีด พอหน้าร้อนครัวบ้าน{name}เป็นครัวของ{mom}ทั้งครัว ไก่หกตัวไข่ทุกวัน
      effects: { stats: { STR: 1 }, flags: [mother_lives_with_me, moved_mother_in_with_her_hens] }
    - id: talk_her_round
      label: นั่งลงข้าง{mom}บนขั้นบันได แล้วค่อยๆ เกลี้ยกล่อม
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ไม่พูดเรื่องล้ม พูดแต่เรื่องไก่ ว่าบ้าน{name}มีลานหลังบ้านกว้างกว่านี้ มีแมวข้างบ้านแค่ตัวเดียว ขี้เกียจ พูดเรื่องร้านแกงหัวถนนที่ทำแกงไม่เป็น ต้องมีคนไปสอน

          {mom}ฟังจนไก่กินข้าวหมดลาน แล้วบอกว่าไปก็ได้ แต่ไปเพราะร้านแกง ไม่ใช่เพราะขั้นบันได เดือนต่อมาร้านแกงหัวถนนเปลี่ยนสูตร คนแน่นร้านทุกเที่ยง
        effects: { stats: { CHA: 1 }, flags: [mother_lives_with_me] }
      failure:
        text: |
          {name}พูดเรื่องล้ม {mom}บอกว่าคนแก่ทุกคนล้ม ล้มแล้วก็ลุก ถ้าล้มแล้วต้องย้ายบ้าน คนแก่ทั้งถิ่นคงต้องย้ายกันหมด แล้วลุกขึ้นเข้าครัวไปต้มน้ำ เลิกคุย

          {name}กลับบ้านมือเปล่า สัปดาห์ต่อมาเพื่อนบ้านของ{mom}ส่งข่าวมาว่าไม่ได้ล้มอีก แต่{mom}ย้ายไปนอนห้องหน้า จะได้ไม่ต้องใช้บันไดหลังบ้าน
        effects: { flags: [mother_stayed_in_her_house] }
    - id: fix_the_step
      label: ซ่อมขั้นบันไดกับทำราวจับให้ แล้วจ้างเด็กข้างบ้านมาดูทุกเย็น
      text: |
        {name}ถอดขั้นบันไดที่ผุออก ตอกขั้นใหม่ ทำราวไม้ไผ่จับได้ทั้งสองข้าง แล้วจ่ายเด็กสาวรั้วติดกันสองเหรียญต่อเดือน ให้แวะมาตอนพลบค่ำทุกวัน แค่ตะโกนถามข้ามรั้วว่ายังอยู่ดีไหม

        {mom}บ่นว่าราวไม้ไผ่บังทางเดินไก่ แต่จับราวทุกครั้งที่ลงบันได เด็กสาวข้างบ้านตะโกนถามทุกเย็น {mom}ตะโกนตอบว่ายังไม่ตาย
      effects: { gold: -2, alignment: { moral: 1 }, flags: [mother_stayed_in_her_house, built_mother_a_rail] }
    - id: sleep_over_three_nights
      label: บอก{mom}ว่าถ้าไม่ไป{name}จะมานอนที่นี่สัปดาห์ละสามคืนแทน
      text: |
        {mom}บอกว่าไม่ต้อง แล้วปูที่นอนให้ในห้องเล็กตั้งแต่คืนแรก ที่นอนผืนเดิมที่{name}เคยนอนตอนเด็ก เตียงสั้นจนเท้าโผล่พ้นขอบ

        สัปดาห์ละสามคืน{name}เดินข้ามถิ่นไปนอนบ้าน{mom} ตื่นเช้ามามีข้าวต้มรอ ไก่ร้องปลุกก่อนฟ้าสาง หลังของ{name}ปวดจากเตียงสั้น ส่วน{mom}ไม่ล้มอีกตลอดหน้าหนาวนั้น
      effects: { flags: [mother_stayed_in_her_house, slept_at_mothers_three_nights] }

- id: adult.fam_the_question
  stage: adult
  scene: market
  weight: 14
  when:
    age: [41, 55]
    not_flags: [has_partner, partner_died]
  text: |
    ป้าสะใภ้ของ{name}มีรายชื่อเขียนไว้บนหลังใบเสร็จร้านผ้า พับเก็บในกระเป๋าเสื้อ หยิบออกมาอ่านทุกครั้งที่เจอหน้ากัน ชื่อบนนั้นเปลี่ยนไปทุกปี บางชื่อขีดฆ่าเพราะแต่งงานไปแล้ว บางชื่อขีดฆ่าเพราะป้าไปเจอตัวจริงแล้วไม่ชอบ

    ไม่ใช่ป้าคนเดียวที่ถาม คนขายขนมปังถาม หมอดัดกระดูกถามระหว่างดึงไหล่ แม่ค้าปลาถามแล้วตอบเองว่าคงเพราะเลือกมาก วันนี้ป้าสะใภ้ดักรอหน้าแผงผัก ใบเสร็จร้านผ้าในมือ ชื่อใหม่สองชื่อเขียนไว้ด้วยหมึกที่ยังไม่แห้งดี
  choices:
    - id: meet_one_name
      label: ยอมไปกินน้ำชากับชื่อบนสุด ให้ป้าเลิกถามสักหน้าฝน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          คนที่มานั่งตรงข้ามโต๊ะน้ำชาสารภาพตั้งแต่ถ้วยแรกว่ามาเพราะป้าของตัวเองบังคับ สองคนหัวเราะจนเจ้าของร้านน้ำชาหันมาดู แล้วตกลงกันตรงนั้น ว่าจะบอกป้าของทั้งสองฝั่งว่ายังดูๆ กันอยู่

          สองคนนัดกินน้ำชาเดือนละครั้งต่อมาอีกหลายปี คุยเรื่องป้า เรื่องเข่า เรื่องราคาน้ำชาที่ขึ้นทุกปี ป้าทั้งสองฝั่งรอข่าวดีกันมาจนเลิกรอ
        effects: { stats: { CHA: 1 }, flags: [met_one_name_from_the_list, made_a_pact_against_the_aunts] }
      failure:
        text: |
          คนที่มานั่งตรงข้ามพูดเรื่องหมูที่เลี้ยงไว้ตั้งแต่ถ้วยแรกจนถ้วยที่สี่ หมูชื่ออะไร กินอะไร นอนท่าไหน {name}รู้จักหมูตัวนั้นดีกว่าคนที่นั่งอยู่ตรงหน้า

          ป้าสะใภ้ถามผลวันรุ่งขึ้น {name}บอกว่าหมูน่ารัก ป้าขีดชื่อนั้นทิ้งด้วยหมึกสองเส้น
        effects: { flags: [met_one_name_from_the_list] }
    - id: say_it_plainly
      label: บอกป้าตรงๆ ว่าอยู่อย่างนี้เพราะเลือกเอง ไม่ได้รอใคร
      text: |
        ป้าสะใภ้ฟังจบแล้วถามว่าแน่ใจไหม {name}บอกว่าแน่ใจ ป้าถามว่าแล้วแก่ไปใครจะดูแล {name}บอกว่าคนเดียวกับที่ดูแลป้าตอนนี้ ตัวป้าเอง

        ป้าหัวเราะเสียงดังกลางตลาด พับใบเสร็จเก็บเข้ากระเป๋า ปีต่อมาป้าไม่ได้หยิบรายชื่อออกมาอีก หยิบรายชื่อร้านผ้าที่ลดราคาออกมาอ่านให้ฟังแทน
      effects: { alignment: { law: 1 }, flags: [single_by_choice] }
    - id: a_list_for_her
      label: เขียนรายชื่อพ่อม่ายในถิ่นยื่นกลับให้ป้า
      text: |
        ป้าสะใภ้เป็นม่ายมาหลายปี {name}เขียนชื่อพ่อม่ายห้าชื่อบนหลังใบเสร็จร้านขนมปัง ยื่นให้ ป้าอ่านแล้วด่า ด่าไปอ่านไป ขีดฆ่าสองชื่อทันที ชื่อที่สามขีดครึ่งเส้นแล้วหยุด

        หน้าฝนนั้นป้าไม่ได้มาดักรอหน้าแผงผักอีก {name}เห็นป้ายืนคุยกับคนขายตะเกียงตรงหัวตลาดบ่อยกว่าที่จำเป็น ชื่อที่สามในรายชื่อ
      effects: { stats: { WIS: 1 }, flags: [gave_the_aunt_a_list] }
    - id: point_to_the_ward
      label: ชี้ไปที่เด็กในบ้าน แล้วบอกว่าบ้านนี้เต็มแล้ว
      requires: { flag: has_ward }
      text: |
        ป้าสะใภ้บอกว่าเด็กไม่ใช่คู่ {name}บอกว่าเด็กกินข้าวมากกว่าคู่ ทำผ้าขาดมากกว่าคู่ และตื่นกลางดึกบ่อยกว่าคู่ บ้านนี้ไม่มีที่ให้คนที่สามแล้ว

        ป้าสะใภ้คิดอยู่พักหนึ่ง แล้วฉีกใบเสร็จร้านผ้าเป็นสองท่อน ท่อนหนึ่งเขียนชื่อเด็กในบ้าน{name}ลงไปแทน บอกว่าอีกหลายปีเด็กก็โต ป้าจะเริ่มหาไว้ตั้งแต่ตอนนี้
      effects: { flags: [the_house_is_full_said_so] }

- id: adult.fam_whose_after_you
  stage: adult
  scene: home
  weight: 14
  when:
    age: [42, 60]
    not_flags: [has_child, has_ward]
  text: |
    เสมียนทะเบียนบ้านของถิ่นเดินมาตามถนนพร้อมสมุดเล่มหนาใต้แขน ปีนี้ต้องทำทะเบียนใหม่ทุกหลัง ช่องท้ายสุดของหน้าเป็นช่องที่{name}ไม่เคยเห็นมาก่อน ผู้รับช่วง ถ้าเจ้าของบ้านไม่อยู่แล้ว ห้อง ข้าวของ เครื่องมือ จะตกกับใคร

    บ้านอื่นในถนนกรอกช่องนั้นเร็ว ลูกคนโต ลูกคนเล็ก หลานชาย เสมียนเขียนไปหาวไป ถึงบ้าน{name}ปลายปากกาหยุดค้างอยู่เหนือช่องว่าง หมึกหยดลงหน้ากระดาษหนึ่งหยด

    เครื่องมือของ{name}แขวนเรียงอยู่บนผนังข้างประตู ใช้มาหลายปี ด้ามสึกเป็นรอยนิ้วมือของคนคนเดียว
  choices:
    - id: name_the_helper
      label: บอกชื่อโบรเดน เด็กหนุ่มที่มาช่วยงานทุกเช้าวันพักงาน
      text: |
        โบรเดนมาช่วยแบกของ กวาดที่ทำงาน ล้างเครื่องมือมาหลายหน้าฝน ไม่เคยขอค่าแรงมากกว่าข้าวเที่ยงหนึ่งมื้อ ถามเรื่องงานมากกว่าที่{name}อยากตอบ เสมียนถามว่าเป็นญาติหรือ {name}บอกว่าไม่ใช่ เสมียนเขียนลงไปอยู่ดี

        เช้าวันพักงานต่อมาโบรเดนมาถึงก่อนเวลา ไม่รู้เรื่องทะเบียน ล้างเครื่องมือเหมือนทุกครั้ง {name}ยื่นเครื่องมือชิ้นที่ด้ามสึกที่สุดให้ใช้แทนชิ้นที่เขาเคยใช้ ไม่ได้บอกเหตุผล
      effects:
        stats: { WIS: 1 }
        flags: [named_broden_to_follow]
        people: [{ id: helper_broden, name: โบรเดน, gender: m, bond: friend, closeness: 1, age: 19 }]
    - id: leave_it_to_the_temple
      label: บอกให้เขียนว่ายกให้ห้องยาวของวิหารอีเซล
      text: |
        เสมียนเขียนลงไปโดยไม่ต้องถามซ้ำ บ้านแบบนี้หลายหลังเขียนแบบเดียวกัน ห้องยาวของวิหารอีเซลมีเด็กมากกว่าเตียงทุกหน้าหนาว เครื่องมือขายได้ ห้องเช่าต่อได้

        แม่ชีคนหนึ่งได้ข่าวจากเสมียน มาเคาะประตูขอบคุณ แล้วขอดูเครื่องมือบนผนังทีละชิ้น ถามราคาทุกชิ้น จดไว้ในสมุดเล่มเล็ก บอกว่าแค่อยากรู้ไว้ก่อน ไม่ได้รีบ
      effects: { alignment: { moral: 1 }, flags: [left_it_to_the_long_room] }
    - id: leave_it_blank
      label: บอกเสมียนให้เว้นช่องนั้นไว้ก่อน
      text: |
        เสมียนเว้นช่องไว้ ขีดเส้นเล็กๆ ตรงมุมให้รู้ว่ายังไม่ได้กรอก แล้วเดินไปบ้านถัดไป หยดหมึกหยดเดียวในช่องนั้นแห้งเป็นจุดดำ

        บ่ายวันนั้น{name}นั่งมองเครื่องมือบนผนังทีละชิ้น ชิ้นไหนใครยืมไปบ้าง ชิ้นไหนเคยซ่อมกี่ครั้ง ตกเย็นลุกไปลับใบมีดทุกเล่มจนคม เผื่อใครก็ตาม
      effects: { flags: [left_the_heir_line_blank] }
    - id: spend_it_all
      label: บอกเสมียนว่าไม่ต้องเขียน จะใช้ให้หมดก่อน
      text: |
        เสมียนหัวเราะ บอกว่าคนพูดแบบนี้ปีละสามสี่คน ไม่เคยมีใครทำได้จริง แล้วเขียนในช่องนั้นว่า เจ้าของจะใช้ให้หมด ลายมือตัวเล็กกว่าช่องอื่น

        เย็นนั้น{name}ขายเครื่องมือชิ้นที่ไม่ได้ใช้มาสามหน้าฝนให้ร้านรับซื้อของเก่า ได้มาสามเหรียญ ซื้อปลาตัวใหญ่ที่สุดในตลาด กินคนเดียวไม่หมด ต้องเรียกแมวข้างบ้านมาช่วย
      effects: { gold: 3, alignment: { law: -1 }, flags: [plans_to_spend_it_all] }

- id: adult.fam_festival_table
  stage: adult
  scene: home
  weight: 12
  when:
    age: [45, 62]
    not_flags: [has_partner]
  text: |
    คืนจุดชามของอีเซลมาพร้อมลมหนาวลูกแรก ทุกบ้านในถิ่นจุดชามไฟตั้งกลางโต๊ะ ชามละคน บ้านไหนคนเยอะโต๊ะก็สว่างจนต้องเปิดหน้าต่างระบายควัน เด็กวิ่งนับชามตามหน้าต่างทุกบ้าน นับแข่งกันว่าถนนไหนสว่างกว่า

    บ้าน{name}มีชามใบเดียว บ้านติดกันทางซ้ายมีสิบเอ็ดใบ แม่บ้านนั้นตะโกนข้ามรั้วมาตั้งแต่บ่ายว่าเหลือที่ปลายโต๊ะหนึ่งที่ ส่วนคนที่อยู่คนเดียวในถนนมีอีกสี่ห้าหลัง ปีที่แล้วแต่ละหลังจุดชามของตัวเอง ตั้งริมหน้าต่างให้เด็กนับ

    น้ำมันในขวดพอสำหรับชามเดียว ปลาที่ซื้อมาตัวใหญ่เกินคนเดียวกิน
  choices:
    - id: the_eleven_bowls
      label: ถือชามของตัวเองไปนั่งปลายโต๊ะบ้านที่มีสิบเอ็ดใบ
      text: |
        ชามของ{name}เป็นใบที่สิบสอง วางตรงปลายโต๊ะติดกับเด็กเล็กสุดของบ้าน เด็กทำแกงหกใส่ตัก{name}ตั้งแต่ช้อนแรก ผู้ใหญ่ทั้งโต๊ะเถียงกันเรื่องค่าเช่าที่นาจนลืมว่ามีแขก ปลาตัวใหญ่ของ{name}เหลือแต่ก้างก่อน{name}จะได้ตักสักคำ

        ขากลับ{name}ถือชามไฟที่ยังติดเดินข้ามรั้ว หูอื้อ กลิ่นแกงติดเสื้อ เด็กที่นับชามตะโกนว่าบ้าน{name}ไม่มีไฟ แล้วนับไฟในมือ{name}เป็นของบ้านข้างๆ
      effects: { alignment: { moral: 1 }, flags: [festival_at_the_big_table] }
    - id: gather_the_one_bowl_houses
      label: เดินเคาะบ้านที่มีชามใบเดียวทุกหลัง ชวนมาตั้งโต๊ะรวมที่บ้าน{name}
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          มาสี่คน หญิงม่ายร้านซ่อมร่ม ช่างทองเหลืองที่ไม่เคยพูดกับใคร ตาหูตึงท้ายถนน กับครูสอนหนังสือที่เพิ่งย้ายมา ทุกคนถือชามของตัวเองมา ชามห้าใบรวมกันกลางโต๊ะสว่างพอให้เห็นหน้ากันครบ

          ปลาตัวใหญ่พอดีห้าคน ช่างทองเหลืองพูดคำแรกตอนปลาหมด บอกว่าปีหน้าเขาจะเอาไก่มา เด็กที่นับชามวิ่งผ่านหน้าต่างแล้วหยุด ตะโกนเรียกเพื่อนให้มานับบ้านนี้ใหม่
        effects: { stats: { CHA: 1 }, flags: [gathered_the_one_bowl_houses] }
      failure:
        text: |
          ทุกบ้านขอบคุณ ทุกบ้านบอกว่าจุดชามไปแล้ว ไม่อยากย้ายไฟ มาคนเดียวคือตาหูตึงท้ายถนน ถือชามมาโดยไม่ได้จุด บอกว่าน้ำมันหมด

          สองคนนั่งคนละฝั่งโต๊ะ ใช้ไฟจากชามของ{name}ใบเดียว ตาหูตึงกินปลาไปครึ่งตัว ไม่ได้ยินอะไรที่{name}พูดสักคำ แล้วกลับบ้านไปพร้อมชามที่{name}เติมน้ำมันให้เต็ม
        effects: { flags: [gathered_the_one_bowl_houses] }
    - id: one_bowl_one_fish
      label: จุดชามของตัวเอง ทำปลาให้ดีที่สุด แล้วกินคนเดียวอย่างช้าๆ
      text: |
        {name}ย่างปลาช้าๆ บนไฟอ่อน ทาน้ำมันกับเกลือ กินกับข้าวใหม่ที่เพิ่งออกจากโรงสี ไม่ต้องแบ่งหัวปลาให้ใคร ไม่ต้องฟังใครเถียงเรื่องค่าเช่า บ้านทางซ้ายเสียงดังทะลุผนังมาทั้งคืน

        ชามไฟใบเดียวตั้งริมหน้าต่างตามธรรมเนียม เด็กที่นับชามวิ่งผ่านหน้าบ้าน{name}ไปแล้ว ถอยกลับมานับใหม่ ได้หนึ่ง แล้ววิ่งต่อ
      effects: { stats: { CON: 1 }, flags: [kept_the_festival_alone] }
    - id: two_bowls
      label: จุดชามสองใบเหมือนทุกปีที่ผ่านมา
      requires: { flag: partner_died }
      text: |
        น้ำมันพอแค่ชามเดียว {name}แบ่งครึ่งใส่สองชาม ไฟเล็กลงทั้งสองใบ ตั้งไว้คนละฝั่งโต๊ะ ปลาตัวใหญ่แบ่งครึ่ง ครึ่งหนึ่งกิน อีกครึ่งเก็บไว้กินพรุ่งนี้

        ชามใบที่สองดับก่อน น้ำมันน้อยกว่าเพราะเทไม่เท่ากัน {name}ไม่ได้จุดใหม่ เด็กที่นับชามนับหน้าต่างบ้านนี้ได้สองตอนหัวค่ำ ได้หนึ่งตอนดึก
      effects: { flags: [lit_the_second_bowl] }

- id: adult.fam_child_next_door
  stage: adult
  scene: home
  weight: 14
  when:
    age: [41, 60]
    not_flags: [has_child, has_ward]
  text: |
    ดิมาส ลูกชายคนกลางของบ้านติดกัน มาโผล่หน้าประตูบ้าน{name}ทุกเย็นตั้งแต่ต้นหน้าฝน ทีแรกมาขอยืมค้อน ต่อมามาคืนค้อน ต่อมาไม่มีเหตุอะไร มานั่งดู{name}ทำงาน ถามทุกอย่างที่เห็น ถามซ้ำสิ่งที่ถามไปแล้วเมื่อวาน กินข้าวเย็นเสร็จก่อน{name}ทุกครั้ง

    เมื่อวานแม่ของดิมาสตะโกนเรียกลูกข้ามรั้วเสียงดังกว่าที่จำเป็น สายตาไม่ได้มองลูก มองบ้าน{name} คืนนั้นได้ยินเสียงบ้านข้างๆ ทะเลาะกันเรื่องที่ลูกไม่ยอมกินข้าวบ้านตัวเอง

    เย็นนี้ดิมาสมายืนหน้าประตูเหมือนเดิม ถือค้อนมาด้วย บอกว่ามาคืน
  choices:
    - id: let_him_stay
      label: เปิดประตูให้เข้ามา สอนงานที่ดิมาสถามค้างไว้ตั้งแต่เมื่อวาน
      text: |
        ดิมาสนั่งที่เดิม ถามเรื่องเดิม {name}ตอบเหมือนเมื่อวาน แต่คราวนี้ยื่นของให้ลองทำเอง ดิมาสทำพัง ทำใหม่ ทำพังอีก พอค่ำส่งกลับบ้านก่อนข้าวเย็น ไม่ให้กินที่นี่

        แม่ของดิมาสยืนรอที่รั้ว เห็นลูกกลับมาก่อนข้าวเย็นก็ไม่ได้ตะโกนอะไร ดิมาสวิ่งเข้าบ้านพร้อมของที่ทำพังชิ้นสุดท้าย ยกให้แม่ดู
      effects:
        flags: [let_dimas_keep_coming]
        people: [{ id: neighbour_dimas, name: ดิมาส, gender: m, bond: friend, closeness: 1, age: 9 }]
    - id: talk_to_his_mother
      label: เดินไปคุยกับแม่ของดิมาสที่รั้ว
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          แม่ของดิมาสพูดก่อน ว่าไม่ได้โกรธ{name} โกรธที่ลูกถามคนอื่นทุกเรื่อง ไม่ถามแม่สักเรื่อง {name}บอกว่าที่ถามเพราะไม่มีใครรำคาญ ที่บ้าน{name}ไม่มีใครให้รำคาญ

          ตกลงกันที่รั้ว ดิมาสมาได้สามเย็นต่อสัปดาห์ กลับไปกินข้าวบ้าน แล้วเล่าเรื่องที่ได้มาให้แม่ฟังทุกครั้ง แม่ของดิมาสเริ่มส่งแกงข้ามรั้วมาให้ในเย็นวันที่สี่ บอกว่าค่าเลี้ยงเด็ก
        effects:
          stats: { CHA: 1 }
          flags: [let_dimas_keep_coming, made_terms_with_dimas_mother]
          people: [{ id: neighbour_dimas, name: ดิมาส, gender: m, bond: friend, closeness: 1, age: 9 }]
      failure:
        text: |
          แม่ของดิมาสฟังได้สามคำแล้วตัดบท บอกว่าลูกบ้านไหนก็ต้องอยู่บ้านนั้น คนไม่มีลูกไม่รู้หรอก แล้วเดินเข้าบ้าน ประตูปิดดังกว่าที่จำเป็น

          ตั้งแต่เย็นนั้นดิมาสไม่ได้มาเคาะประตูอีก {name}เห็นเขาปีนขึ้นไปนั่งบนรั้วทุกเย็น นั่งดูข้ามมาจากตรงนั้น ไม่ได้ข้ามลงมาสักครั้ง
        effects: { flags: [dimas_kept_at_home] }
    - id: send_him_home
      label: รับค้อนคืน แล้วบอกดิมาสว่ากลับไปกินข้าวบ้านตัวเอง
      text: |
        ดิมาสยื่นค้อนให้ ยืนอยู่ที่ประตูอีกพักหนึ่ง ถามว่าพรุ่งนี้มาขอยืมได้ไหม {name}บอกว่าพรุ่งนี้ค้อนไม่ว่าง

        ไม่กี่สัปดาห์ต่อมาบ้านติดกันซื้อค้อนใหม่ เสียงตอกตะปูดังข้ามรั้วมาทุกเย็น ตอกผิดจังหวะทุกครั้ง
      effects: { alignment: { law: 1 }, flags: [sent_dimas_home] }
    - id: work_the_bellows
      label: ให้ดิมาสมาช่วยชักเครื่องสูบลมเตา แลกกับค่าขนมรายสัปดาห์
      requires: { any_flags: [job_smith, job_artificer] }
      text: |
        {name}เดินไปขออนุญาตแม่ของดิมาสก่อน บอกว่าจ้าง ไม่ได้เลี้ยง สัปดาห์ละครึ่งเหรียญ เงินเข้ากระเป๋าแม่ แม่ของดิมาสต่อรองขึ้นเป็นหนึ่งเหรียญ แล้วตกลง

        ดิมาสชักเครื่องสูบลมได้นิ่งกว่าลูกมือผู้ใหญ่ภายในเดือนเดียว ถามน้อยลง ฟังเสียงไฟมากขึ้น วันหนึ่งบอก{name}ว่าไฟเตาวันนี้เสียงไม่เหมือนเมื่อวาน แล้วก็จริง
      effects:
        gold: -1
        stats: { INT: 1 }
        flags: [let_dimas_keep_coming, dimas_works_the_bellows]
        people: [{ id: neighbour_dimas, name: ดิมาส, gender: m, bond: friend, closeness: 1, age: 9 }]

- id: adult.fam_the_other_side_of_the_bed
  stage: adult
  scene: home
  weight: 14
  cast:
    gone: { id: partner, alive: false }
  when:
    age: [41, 62]
    flags: [partner_died]
    not_flags: [has_partner]
  text: |
    เครื่องมือทำงานของ{gone}อยู่ใต้เตียงฝั่งที่{gone}เคยนอน ห่อผ้าน้ำมันไว้ทั้งห่อ ทุกหน้าฝน{name}แกะออกมาเช็ดสนิมหนึ่งรอบ แล้วห่อกลับ ไม่เคยใช้ ไม่รู้วิธีใช้ครึ่งหนึ่ง

    สัปดาห์นี้มีคนหนุ่มคนหนึ่งมาถามซื้อ ทำงานแบบเดียวกับที่{gone}เคยทำ เพิ่งออกจากบ้านนาย ยังไม่มีเครื่องมือเป็นของตัวเอง ให้ราคาสี่เหรียญ ยุติธรรมกว่าที่ร้านรับซื้อของเก่าจะให้ เขาจะออกจากถิ่นวันตลาดนี้ ไปหางานที่อื่น

    วันเดียวกันญาติของ{gone}ส่งข่าวมาว่าหลานชายคนหนึ่งจะเริ่มฝึกงานหน้าฝน อยากได้เครื่องมือของ{gone}ไว้ให้หลาน ข่าวมาแบบไม่ได้ถาม
  choices:
    - id: sell_to_the_young_one
      label: ขายให้คนหนุ่มคนนั้นสี่เหรียญ ก่อนวันตลาด
      text: |
        คนหนุ่มแกะห่อผ้าน้ำมันบนโต๊ะ หยิบเครื่องมือขึ้นมาทีละชิ้น จับถูกด้ามทุกชิ้นโดยไม่ต้องมีใครบอก ชิ้นหนึ่งเขาพลิกดูสองรอบ ถามว่าใครทำรอยบากตรงนี้ไว้ {name}บอกว่าไม่รู้ {gone}ทำไว้เอง

        เขาวางเงินสี่เหรียญ ห่อเครื่องมือกลับแบบเดียวกับที่{name}ห่อทุกหน้าฝน แล้วแบกออกไปทางลานเกวียน ใต้เตียงฝั่งนั้นเหลือรอยฝุ่นเป็นสี่เหลี่ยม
      effects: { gold: 4, flags: [sold_the_tools_to_a_stranger] }
    - id: give_to_the_nephew
      label: ส่งเครื่องมือทั้งห่อไปให้หลานของ{gone}
      text: |
        {name}ห่อใหม่ด้วยผ้าน้ำมันผืนใหม่ เดินไปส่งเองถึงบ้านญาติ หลานชายตัวสูงกว่าที่คิด มือยังนุ่ม รับห่อไปแล้วไม่รู้จะถืออย่างไร ญาติของ{gone}ยกน้ำชามาให้ แล้วเล่าเรื่อง{gone}ตอนเด็กเรื่องหนึ่งที่{name}ไม่เคยได้ยิน

        ขากลับ{name}ไม่ได้เงินสักเหรียญ ได้เรื่องนั้นมาเรื่องหนึ่ง กับคำสัญญาว่าหลานจะเอางานชิ้นแรกมาให้ดู หลายหน้าฝนต่อมาหลานถือกล่องไม้ใบเล็กมาเคาะประตู ฝาปิดไม่สนิท มุมหนึ่งมีรอยบากแบบเดียวกับรอยบนด้ามเครื่องมือของ{gone}
      effects: { alignment: { moral: 1 }, flags: [gave_the_tools_to_the_nephew] }
    - id: learn_one
      label: เก็บไว้ชิ้นหนึ่ง แล้วขอให้คนหนุ่มสอนวิธีใช้ก่อนเขาไป
      check: { stat: INT, dc: 13 }
      success:
        text: |
          คนหนุ่มสอนให้สามเย็น ก่อนวันตลาด {name}เลือกชิ้นที่มีรอยบากที่ด้าม หัดจับ หัดใช้กับเศษไม้ เย็นที่สามทำของชิ้นเล็กได้ชิ้นหนึ่ง เบี้ยว แต่ใช้ได้ ชิ้นที่เหลือขายให้เขาไปสามเหรียญ

          ของชิ้นเล็กชิ้นนั้นวางอยู่บนหิ้งข้างเตียงฝั่งที่{gone}เคยนอน {name}ทำชิ้นที่สองต่อในหน้าฝนถัดมา เบี้ยวน้อยลง
        effects: { gold: 3, stats: { INT: 1 }, flags: [learned_one_of_the_tools] }
      failure:
        text: |
          สามเย็นผ่านไป {name}ยังจับด้ามผิดข้าง คนหนุ่มอดทนจนเย็นสุดท้าย แล้วบอกตรงๆ ว่าบางคนมือไม่ไปทางนี้ ไม่ใช่ความผิดใคร เศษไม้ที่หัดทำแตกไปสิบกว่าชิ้น นิ้วโป้ง{name}มีแผลตื้นๆ สองแผล

          {name}เก็บเครื่องมือชิ้นที่มีรอยบากไว้ ขายที่เหลือให้เขาไปสามเหรียญ ชิ้นนั้นไม่ได้ใช้อีก แต่ไม่ได้ห่อผ้าน้ำมันแล้ว แขวนไว้บนตะปูข้างเตียง
        effects: { gold: 3, hp: -1, flags: [learned_one_of_the_tools] }
    - id: split_them
      label: แบ่งครึ่ง ครึ่งหนึ่งขาย ครึ่งหนึ่งส่งให้หลาน
      text: |
        คนหนุ่มได้ชิ้นที่ใช้ทุกวัน หลานชายได้ชิ้นที่ใช้ปีละครั้งแต่แพงกว่า ทั้งสองฝ่ายไม่พอใจเท่ากัน คนหนุ่มจ่ายสองเหรียญ ญาติของ{gone}ส่งข่าวมาว่าเครื่องมือไม่ครบชุด

        {name}นับเงินสองเหรียญอยู่บนเตียง ฝั่งที่{gone}เคยนอน แล้วเอาเงินนั้นไปจ่ายค่าเช่าเดือนนี้
      effects: { gold: 2, alignment: { law: 1 }, flags: [split_the_tools] }

- id: adult.fam_sick_alone
  stage: adult
  scene: home
  weight: 12
  cast:
    pal: { bond: [friend], optional: true }
  when:
    age: [48, 64]
    not_flags: [has_partner, has_child, has_ward]
  text: |
    ไข้ขึ้นตอนเช้าวันพักงาน หลังลั่นตอนก้มลงหยิบรองเท้า พอสายก็ลุกไม่ไหว {name}นอนอยู่บนเตียงสองวันโดยไม่มีใครรู้ น้ำในเหยือกข้างเตียงหมดตั้งแต่คืนแรก แมวข้างบ้านเข้ามาทางหน้าต่าง กินข้าวที่เหลือในหม้อ แล้วออกไปทางเดิม

    วันที่สามคนหาบน้ำเห็นว่าถังหน้าบ้าน{name}ไม่ได้วางออกมาสามเช้าติดกัน จึงเคาะประตู {name}ตะโกนตอบได้ครึ่งคำ หมอยาบอกว่าต้องนอนอีกสิบวันเป็นอย่างน้อย ห้ามลุกไปไหนนอกจากไปส้วมหลังบ้าน และต้องมีคนเอาข้าวมาให้

    บ้านนี้ไม่มีคนที่สอง
  choices:
    - id: soup_from_the_cookshop
      label: จ้างร้านข้าวต้มหัวถนนส่งข้าวต้มวันละสองมื้อ
      text: |
        ร้านข้าวต้มคิดค่าส่งเพิ่มวันละครึ่งเหรียญทองแดง ลูกสาวเจ้าของร้านหิ้วหม้อมาวางที่ข้างเตียงเช้าเย็น เล่าข่าวในถนนให้ฟังทุกครั้ง ไม่ได้ตั้งใจ แค่พูดไม่หยุด สิบวันผ่านไป{name}รู้เรื่องในถนนมากกว่าตอนที่ยังเดินได้

        หายแล้ว{name}ตกลงกับร้านข้าวต้มไว้ ทุกเช้าจะแขวนผ้าแดงไว้ที่หน้าต่าง เช้าไหนไม่มีผ้าแดง ให้ลูกสาวร้านเคาะประตู ผ้าแดงผืนนั้นแขวนทุกเช้า ฝนตกก็แขวน
      effects: { gold: -2, flags: [soup_from_the_cookshop, hangs_a_red_cloth_each_morning] }
    - id: pal_with_a_key
      label: ฝากคนหาบน้ำไปบอก{pal}
      requires: { cast: [pal] }
      text: |
        {pal}มาถึงตอนบ่าย ถือหม้อแกงมาหนึ่งหม้อ บ่นว่าทำไมไม่บอกตั้งแต่วันแรก บ่นทุกวันจนครบสิบวัน มาทุกเย็น ล้างหม้อ เทกระโถน เติมน้ำในเหยือก แล้วนั่งเล่าเรื่องบ้าน{pal:เขา|เธอ}จนตะเกียงหมดน้ำมัน

        วันที่{name}ลุกได้ สองคนแลกกุญแจบ้านกัน {pal}บอกว่าคราวหน้าถ้าใครป่วยก่อน อีกคนจะได้ไม่ต้องรอคนหาบน้ำ กุญแจบ้าน{pal}แขวนอยู่บนตะปูข้างประตูบ้าน{name} ตะปูใหม่ ตอกเพิ่มวันนั้น
      effects:
        alignment: { moral: 1 }
        flags: [swapped_keys_with_a_friend]
        people: [{ id: "@pal", closeness: 1 }]
    - id: manage_alone
      label: ตั้งน้ำ ข้าว และกระโถนไว้รอบเตียง แล้วดูแลตัวเองให้รอด
      check: { stat: CON, dc: 14 }
      success:
        text: |
          {name}ให้คนหาบน้ำเติมโอ่งข้างเตียงให้เต็ม ซื้อข้าวตากแห้งกับปลาเค็มกองไว้บนเก้าอี้ จุดเตาถ่านเล็กตั้งไว้ปลายเตียง ต้มข้าวต้มเองโดยไม่ต้องลุก วันละหม้อ

          สิบเอ็ดวันก็ลุกได้ ลุกได้ก่อนที่หมอยาบอกหนึ่งวัน หลังยังลั่นทุกเช้า แต่{name}รู้แล้วว่าต้องลุกจากเตียงด้วยการพลิกตัวไปทางซ้ายก่อน
        effects: { stats: { CON: 1 }, flags: [nursed_myself_through] }
      failure:
        text: |
          คืนที่ห้าเตาถ่านปลายเตียงดับ {name}เอื้อมไปจุดใหม่ ตกเตียง นอนอยู่บนพื้นจนเช้า คนหาบน้ำมาเห็นตอนเติมโอ่ง ช่วยยกขึ้นเตียง แล้วไปตามหมอยามาอีกรอบ

          หมอยาเพิ่มเวลานอนอีกห้าวัน คนหาบน้ำแวะมาทุกเช้าโดยไม่ได้มีใครจ้าง {name}ให้เงินเขาตอนหายดี สองเหรียญ เขาไม่รับ เอาแต่ข้าวตากที่เหลือไปหนึ่งถุง
        effects: { hp: -2, flags: [nursed_myself_through, the_water_carrier_looked_in] }
    - id: bell_through_the_wall
      label: ขอให้บ้านข้างๆ ผูกกระดิ่งร้อยเชือกข้ามรั้วมาถึงหัวเตียง
      text: |
        เด็กบ้านข้างๆ ร้อยเชือกจากหัวเตียง{name}ออกทางหน้าต่าง ข้ามรั้ว ไปผูกกระดิ่งไว้ที่ขื่อครัวบ้านตัวเอง {name}ดึงหนึ่งทีแปลว่าน้ำ สองทีแปลว่าข้าว สามทีแปลว่ามาเดี๋ยวนี้ เด็กดึงเชือกเล่นตอบกลับมาจนแม่ที่บ้านโน้นต้องห้าม

        หายแล้วเชือกเส้นนั้นยังไม่มีใครแก้ ผ่านหน้าฝนมาเปื่อยครึ่งเส้น บางเย็น{name}ดึงหนึ่งทีเฉยๆ บ้านโน้นดึงตอบหนึ่งที
      effects: { alignment: { moral: 1 }, flags: [rigged_a_bell_to_next_door] }
