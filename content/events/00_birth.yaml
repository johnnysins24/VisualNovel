# ---------- B6 ลูกทีฟลิ่งในแดนเถ้า ชื่อจากฝัน ----------
- id: infancy.birth_ashland
  stage: infancy
  scene: home
  weight: 6
  when: { age: [0, 0] }
  text: |
    เรือนทุกหลังในบ้านหญ้าเงินยกพื้นสูงเท่าหัวคน บันไดพับเก็บขึ้นไปได้ทุกขั้น ตกค่ำทุกบ้านชักบันไดขึ้น เพราะหมาเถ้าออกหากินตอนมืด และไม่มีใครอยากรู้ว่ามันปีนเสาบ้านได้หรือเปล่า

    คืนนั้นแม่เจ็บท้องตั้งแต่หัวค่ำ ป้าบ้านติดกันมาช่วย พ่อยังไม่กลับ กะดึกของหลุมเก้าเลิกตอนเที่ยงคืน แล้วต้องเดินบนแผ่นไม้ปูเถ้ากลับมาอีกชั่วยาม

    เด็กเกิดก่อนพ่อกลับ เขาสองข้างเล็กเท่าเม็ดข้าวโพด ตาจับแสงตะเกียงเป็นสีแดง ในบ้านหญ้าเงินไม่มีใครตกใจ ครึ่งหมู่บ้านมีเขา พ่อเองก็มี

    ใกล้ตีสอง มีเสียงผิวปากสามจังหวะดังอยู่ใต้ถุน ป้าหย่อนบันไดลงไป พ่อปีนขึ้นมา ฝุ่นถ่านดำทั้งตัวจนเห็นแต่ตาสองข้าง เขายืนอยู่ที่ปลายเสื่อ ไม่ยอมอุ้มเพราะมือยังสกปรก

    "ฉันได้ยินอีกแล้ว" เขาบอกแม่ "ตอนพักกะ เผลอหลับไปแป๊บเดียว ได้ยินชื่อชัดเหมือนมีคนพูดข้างหู"

    ป้าลุกขึ้นทันที กอดผ้าห่มของตัวเองไว้แน่น "ไม่ต้องบอกฉัน" แกว่า "ฉันไม่อยากได้ยิน" แล้วรีบไต่บันไดกลับบ้าน

    ป้ากลับไปได้ไม่นาน ทุกคนในบ้านก็ได้ยินเสียงหายใจฟืดฟาดอยู่ใต้ถุน แสงแดงลอดร่องกระดานขึ้นมาวูบหนึ่ง ดับ แล้วสว่างขึ้นอีกตามจังหวะลมหายใจ ไก่ในเล้าใต้บ้านไม่มีตัวไหนส่งเสียง
  choices:
    - id: cry
      label: ร้องจ้า แข่งกับเสียงหายใจใต้ถุน
      text: |
        เด็กร้องดังขึ้นเรื่อยๆ แสงใต้กระดานหยุดเต้นไปพักหนึ่ง เหมือนสิ่งที่อยู่ข้างล่างกลั้นหายใจฟัง แม่กอดลูกไว้ พ่อนั่งพิงประตู มีดขุดถ่านวางบนเข่า ทั้งคืนไม่มีใครหลับ

        {father}พูดชื่อนั้นออกมาเบาๆ ตอนฟ้าเริ่มเทา {name} ชื่อที่ออกเสียงแข็งจนแม่ทวนตามไม่ถูกในครั้งแรก เช้านั้นบนเถ้ารอบเสาบ้านมีรอยเท้าเดินวนอยู่หลายสิบรอบ ไก่ในเล้ายังอยู่ครบทุกตัว
      effects:
        flags: [origin_ashland, race_tiefling, dream_name]
        location_tag: ashland
        name_pool: { self: tiefling_dream, parents: human }
        stats: { CHA: 1 }
    - id: red_eyes
      label: เงียบ ตาสะท้อนแสงแดงที่ลอดร่องกระดาน
      text: |
        เด็กไม่ร้อง นอนนิ่งในอ้อมแขนแม่ ตาเปิดอยู่ แสงแดงจากใต้กระดานวูบขึ้นทีไร ในตาเด็กก็มีจุดแดงวูบขึ้นตามทุกที พ่อเห็นแล้วเอามือปิดตาลูกไว้จนเช้า

