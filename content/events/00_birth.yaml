      text: |
        เด็กดิ้นหลุดจากผ้าห่อ แม่ห่อใหม่ หลุดอีก รอบที่สามแม่หัวเราะออกมาทั้งที่มือยังสั่น หางเส้นเล็กๆ ฟาดผ้าห่มดังแปะๆ เสียงนั้นกลบเสียงหายใจใต้ถุนไปได้บ้าง

