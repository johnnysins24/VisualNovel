# ฉากเกิด 8 ฉาก (อายุ 0) แต่ละฉากตั้งเผ่า ชาติกำเนิด ถิ่น และกลุ่มชื่อ
# ข้อความของเหตุการณ์ยังไม่มีชื่อ (ชื่อสุ่มหลังเลือก) จึงเรียกว่า พ่อ แม่ ส่วนข้อความหลังเลือกใช้ {name} {father} {mother} ได้
# ทุกตัวเลือกในฉากเดียวกันต้องตั้ง flag ชาติกำเนิด location_tag และ name_pool ชุดเดียวกัน ต่างกันแค่นิสัยแรกเกิด

# ---------- B1 ลูกชาวนา หมู่บ้านในอาร์เวล ----------
- id: infancy.birth_farm
  stage: infancy
  weight: 14
  when: { age: [0, 0] }
  text: |
    หิมะแรกลงมาตั้งแต่หัวค่ำ ฟืนในเพิงหลังบ้านเหลือสามท่อน ท่อนหนึ่งยังเปียก

    พ่อคว้ากระสอบเดินออกไปทางรางรถไฟ ขบวนถ่านวิ่งผ่านบ้านเงาเสาวันละสองเที่ยว ทุกเที่ยวมีถ่านหล่นทิ้งไว้ตามหินโรยราง คนในหมู่บ้านรู้กันทุกคน แต่ไม่มีใครเก็บ พ่อกลับมาตอนสองทุ่ม กระสอบห้อยต่ำจนเกือบลากดิน แสงแดงลอดเนื้อป่านออกมาเป็นจุดๆ เขาเทถ่านมารสิบกว่าก้อนลงเตา น้ำในหม้อยังไม่ทันเดือด ห้องที่เมื่อครู่ยังเห็นลมหายใจเป็นควันก็อุ่นจนแม่ต้องถีบผ้าห่มออก

    ยายเฮเทลมาถึงตอนนั้นพอดี แกยืนอยู่ที่ประตู หิมะยังเกาะไหล่ ตามองเตาไม่วาง

    "เอาออกไป"

    "ยาย หนาวขนาดนี้..."

    "ของที่ขุดขึ้นมาจากแดนเถ้า อย่าให้เป็นของอย่างแรกที่เด็กเห็น" แกว่า "ข้าทำคลอดกับเทียนเล่มเดียวมาทั้งชีวิต คืนนี้ก็ทำได้"

    พ่อใช้คีมคีบถ่านทีละก้อนออกไปวางเรียงบนลานหน้าบ้าน หิมะรอบถ่านแต่ละก้อนละลายเป็นวงกลม เห็นดินดำโผล่ขึ้นมาเป็นจุดๆ ยายเฮเทลผูกกระดิ่งทองเหลืองลูกเล็กไว้ที่หัวเตียง บอกว่าแม่อีเซลมาถึงจะได้รู้ว่าห้องไหน แล้วไล่พ่อออกไปนั่งข้างเตาที่ไม่มีไฟ

    เด็กเกิดตอนเลยเที่ยงคืนไปไม่นาน เป็น{ผู้ชาย|ผู้หญิง} ตัวเล็กแต่ครบ ยายเฮเทลเช็ดตัวให้แล้ววางลงบนอกแม่ ไอขาวลอยออกจากปากทั้งแม่และลูก

    ข้างนอก ถ่านสิบกว่าก้อนยังแดงอยู่บนหิมะจนเช้า
  choices:
    - id: cry_loud
      label: ร้องเสียงดังจนหมาบ้านข้างๆ เห่าตาม
      text: |
        เสียงร้องดังลั่นจนหมาบ้านข้างๆ เห่าตาม แล้วหมาบ้านถัดไปก็เห่าต่อ ยายเฮเทลว่า "ปอดดี หนาวแค่นี้ไม่ตายหรอก"

        พ่อเข้ามาตอนนั้น หน้ายังมอมฝุ่นถ่าน เขาเรียกลูกว่า{name}ตั้งแต่ยังไม่ได้อุ้ม ตั้งแต่วันนั้น คนในบ้านเงาเสาก็เรียกเด็กคนนี้ว่า{name} ลูก{father}
      effects:
        flags: [origin_farm, race_human]
        location_tag: arvel_village
        stats: { CON: 1 }
    - id: quiet_window
      label: เงียบ หันหน้าไปทางหน้าต่าง
      text: |
        เด็กไม่ร้อง ยายเฮเทลตีก้นไปทีหนึ่ง ได้เสียงสั้นๆ ออกมาเสียงเดียว แล้วก็เงียบอีก ตาที่ยังมองอะไรไม่เห็นหันไปทางหน้าต่าง ตรงที่แสงแดงจากลานหน้าบ้านลอดร่องบานไม้เข้ามา

        ยายเฮเทลลุกไปเอาผ้ามาขึงปิดร่องนั้น ขึงซ้อนกันสองชั้น

        {mother}ตั้งชื่อลูกว่า{name} ตามชื่อ{ตา|ยาย}ที่ตายไปก่อนหน้าหนาว คนในบ้านเงาเสาเรียกเด็กคนนี้ว่า{name} ลูก{father}
      effects:
        flags: [origin_farm, race_human]
        location_tag: arvel_village
        stats: { WIS: 1 }
    - id: grip_finger
      label: กำนิ้วยายหมอไว้ไม่ยอมปล่อย
      text: |
        มือเล็กๆ กำนิ้วชี้ของยายเฮเทลไว้แน่น แกต้องแกะออกทีละนิ้ว พอแกะได้ นิ้วที่เหลือก็กลับไปกำใหม่ "แรงเหมือนลูกวัว" แกบ่น แต่ไม่ได้ดึงมือออก

        ยายเฮเทลเป็นคนเสนอชื่อ{name} {father}ว่าดี {mother}ก็ว่าดี คนในบ้านเงาเสาเรียกเด็กคนนี้ว่า{name} ลูก{father}
      effects:
        flags: [origin_farm, race_human]
        location_tag: arvel_village
        stats: { STR: 1 }

# ---------- B2 ลูกคนงานโรงกลั่น เวนทราส ----------
- id: infancy.birth_refinery
  stage: infancy
  scene: refinery
  weight: 12
  when: { age: [0, 0] }
  text: |
    หม้อกลั่นเบอร์เก้าต้องมีคนเฝ้าตลอดคืน น้ำค้างดาวหยดลงขวดทีละหยด หยดเร็วไปแปลว่าหม้อร้อน หยดช้าไปแปลว่ามีนกไปเกาะจานรับดาวบนหลังคา แม่เฝ้าหม้อใบนี้มาหกปี นั่งเก้าอี้ไม้ตัวเดิม นับหยดได้โดยไม่ต้องหันไปมอง

    คืนนั้นน้ำเดินตอนขวดเต็มได้ครึ่งเดียว

    หัวหน้ากะไม่ให้ออก ประตูโรงลงกลอนจากข้างนอกจนกว่าจะหมดกะ เป็นกฎของสมาคม คนงานหญิงสองคนจึงพยุงแม่เข้าไปในห้องเก็บขวด ห้องเดียวในโรงที่มีพื้นพอให้นอน ขวดน้ำค้างดาวเรียงอยู่บนชั้นจนจรดเพดาน แสงฟ้าในขวดทำให้ทุกคนในห้องหน้าซีดเหมือนคนจมน้ำ ห้องนั้นเย็นจนลมหายใจเป็นควัน

    หมอตำแยประจำย่านมาถึงตอนตีสาม หัวหน้ากะไขกลอนให้แกเข้ามาคนเดียว แล้วลงกลอนตามหลัง แกสวมถุงมือหนังก่อนแตะตัวแม่ หลังมือซ้ายของแม่มีแผ่นใสขนาดเท่าเหรียญ ข้างใต้มีแสงฟ้าเต้นเบาๆ ไม่มีใครในห้องพูดถึง

    ใต้เสียงเบ่ง เสียงหมอสั่ง และเสียงขวดกระทบกันทุกครั้งที่มีใครเผลอเดินชนชั้นวางขวด มีเสียงหึ่งต่ำๆ ดังอยู่ตลอดเวลา คนที่ทำงานที่นี่นานพอจะไม่ได้ยินเสียงนั้นอีก เหมือนที่ไม่มีใครได้ยินเสียงหัวใจตัวเอง

    เด็กคลอดออกมาตอนหวูดเปลี่ยนกะดังขึ้นพอดี
  choices:
    - id: cry_whistle
      label: ร้องแข่งกับเสียงหวูด
      text: |
        หวูดลากเสียงยาวจนหมดลม เสียงเด็กยังไม่หยุด คนงานกะเช้าที่เพิ่งเดินเข้าประตูมาได้ยินกันทั้งโรง บางคนหัวเราะ บางคนเคาะกระป๋องข้าวให้

        {mother}ตั้งชื่อ{ลูกชาย|ลูกสาว}ว่า{name} ทะเบียนย่านเขียนไว้ว่า {name} {surname} เกิดที่โรงกลั่นริมแม่น้ำ ห้องเก็บขวด
      effects:
        flags: [origin_refinery, race_human]
        location_tag: ventras
        name_pool: { self: human_city, parents: human_city }
        stats: { CHA: 1 }
    - id: silent_hum
      label: เงียบ เหมือนกำลังฟังอะไรอยู่
      text: |
        หวูดจบไปแล้ว เด็กยังไม่ร้อง หมอตำแยตบหลังเบาๆ สองที เด็กหายใจ ตาเปิด แต่ไม่มีเสียง หน้าเล็กๆ เอียงไปทางผนังที่หม้อกลั่นเบอร์เก้าตั้งอยู่อีกฝั่ง เหมือนคนเอียงหูฟังเพลงจากบ้านข้างๆ

        "เด็กโรงกลั่นก็อย่างนี้แหละ" หมอว่า แล้วถอดถุงมือ

        {mother}ตั้งชื่อ{ลูกชาย|ลูกสาว}ว่า{name} ทะเบียนย่านเขียนไว้ว่า {name} {surname} เกิดที่โรงกลั่นริมแม่น้ำ ห้องเก็บขวด
      effects:
        flags: [origin_refinery, race_human, heard_the_hum]
        location_tag: ventras
        name_pool: { self: human_city, parents: human_city }
        stats: { INT: 1 }
    - id: grab_glass
      label: คว้าแผ่นใสบนหลังมือแม่
      text: |
        พอวางลงบนอก มือเล็กๆ ก็ควานไปเจอหลังมือซ้ายของแม่ แล้วกำแผ่นใสนั้นไว้ หมอตำแยร้องห้าม แต่{mother}ไม่ดึงมือออก แสงใต้แผ่นใสเต้นอยู่ใต้นิ้วเล็กๆ นั้นจนฟ้าสาง

        {mother}ตั้งชื่อ{ลูกชาย|ลูกสาว}ว่า{name} ทะเบียนย่านเขียนไว้ว่า {name} {surname} เกิดที่โรงกลั่นริมแม่น้ำ ห้องเก็บขวด
      effects:
        flags: [origin_refinery, race_human, touched_mothers_glass]
        location_tag: ventras
        name_pool: { self: human_city, parents: human_city }
        stats: { WIS: 1 }

# ---------- B3 ลูกตระกูลคนแคระ ทุนดาร์ ----------
- id: infancy.birth_dwarf
  stage: infancy
  weight: 10
  when: { age: [0, 0] }
  text: |
    บ้านอยู่บนถนนวนชั้นสิบเอ็ดของทุนดาร์ ห่างโคนเสาของออสซาสามร้อยก้าว ผนังห้องอุ่นทั้งคืนเพราะไอจากโรงหลอมชั้นล่าง และทุกสองชั่วยามจะมีเสียงรถรางขนแร่ลากผ่านเหนือเพดาน

    ตามธรรมเนียม ก่อนเด็กจะได้ดูดนมครั้งแรก คนที่แก่ที่สุดในตระกูลต้องอ่านกำแพงให้ฟัง

    ทวดอายุสองร้อยกว่าปี ตาฝ้าจนมองตัวอักษรไม่เห็นแล้ว แกจึงอ่านด้วยปลายนิ้ว เดินเลียบกำแพงหินในห้องโถง ไล่ชื่อบรรพบุรุษจากบนลงล่าง ทีละชื่อ ทีละปี เสียงแหบต่ำเท่ากันทุกชื่อ ไม่ช้าลงตรงชื่อคนที่แกเคยอุ้ม ไม่เร็วขึ้นตรงชื่อที่ไม่มีใครจำได้แล้ว เด็กร้องหิวอยู่ในอ้อมแขนแม่ แม่โยกตัวไปมา ไม่มีใครขัด

    ใกล้โคนกำแพง นิ้วของทวดหยุดที่บรรทัดหนึ่ง ร่องสลักลึกกว่าบรรทัดอื่น

    "ปีก่อนผนึกสองร้อยสามสิบ" แกอ่าน "ตระกูลนี้ยืมค้อนหนึ่งเล่มจากตระกูลทั่งเก่า สัญญาว่าจะคืนเมื่องานเสร็จ"

    แกหยุด นิ้วยังวางอยู่ตรงนั้น

    "งานไม่เสร็จ" แกพูดต่อ คราวนี้ไม่ได้อ่านจากหิน "ค้อนเล่มนั้นยังอยู่ในชั้นที่ก่อปิดตอนสงคราม ทั่งเก่ามาถามทุกร้อยปี ข้าตอบมาสองครั้งแล้ว ครั้งหน้าคงไม่ใช่ข้า"
  choices:
    - id: cry_at_debt
      label: ร้องขึ้นมาตรงบรรทัดหนี้พอดี
      text: |
        ทวดหันหน้ามาทางเสียงร้อง ตาฝ้าคู่นั้นมองเลยหัวเด็กไป "เออ" แกว่า "อย่างน้อยก็มีคนบ่น"

        แกวางมือบนหัวเด็ก แล้วพูดชื่อออกมาดังๆ ให้หินได้ยิน "{name} {surname}" ถ้าเด็กรอดหน้าหนาวแรก ช่างของตระกูลจะสลักชื่อนี้ลงกำแพง ต่อจากบรรทัดสุดท้าย
      effects:
        flags: [origin_dwarf_clan, race_dwarf, clan_debt_hammer]
        location_tag: hordun
        stats: { CHA: 1 }
    - id: sleep
      label: หลับไปก่อนทวดจะอ่านจบ
      text: |
        พอถึงชื่อสุดท้าย เด็กหลับไปแล้ว ปากยังดูดลมอยู่ ทวดได้ยินเสียงกรนเบาๆ ก็หัวเราะ เสียงเหมือนหินครูดกัน "หิวแล้วยังหลับได้ ทนดี"

        แกวางมือบนหัวเด็ก แล้วพูดชื่อออกมาดังๆ ให้หินได้ยิน "{name} {surname}" ถ้าเด็กรอดหน้าหนาวแรก ช่างของตระกูลจะสลักชื่อนี้ลงกำแพง ต่อจากบรรทัดสุดท้าย
      effects:
        flags: [origin_dwarf_clan, race_dwarf, clan_debt_hammer]
        location_tag: hordun
        stats: { CON: 1 }
    - id: touch_debt
      label: ปัดมือไปโดนร่องสลักบรรทัดหนี้
      text: |
        ตอนแม่ก้มตัวให้ทวดจับหัวเด็ก มือเล็กๆ ปัดไปโดนกำแพงพอดี นิ้วชี้จมลงในร่องของคำว่า ค้อน ทวดรู้สึกได้ แกกดมือนั้นแนบหินไว้จนแม่เริ่มขยับตัว "เออ" แกพูดเบาๆ "จำไว้"

        แล้วแกก็พูดชื่อออกมาดังๆ ให้หินได้ยิน "{name} {surname}" ถ้าเด็กรอดหน้าหนาวแรก ช่างของตระกูลจะสลักชื่อนี้ลงกำแพง ต่อจากบรรทัดสุดท้าย
      effects:
        flags: [origin_dwarf_clan, race_dwarf, clan_debt_hammer, touched_debt_line]
        location_tag: hordun
        stats: { WIS: 1 }

# ---------- B4 ลูกเอลฟ์ บ้านกิ่งลม ป่าไอเลธ ----------
- id: infancy.birth_elf
  stage: infancy
  weight: 6
  when: { age: [0, 0] }
  text: |
    เก้าสิบเจ็ดปีแล้วที่บ้านกิ่งลมไม่มีเด็กเกิด

    คืนนั้นเอลฟ์ทั้งหมู่บ้าน สามสิบเอ็ดคน ขึ้นไปนั่งบนกิ่งไม้รอบบ้านของพ่อกับแม่ ไม่มีใครพูด ลมที่พัดอยู่ระหว่างเสาของอุลเวนกับทาลิสลอดใบไม้มาเป็นสาย กิ่งใหญ่เท่าถนนโยกช้าๆ ไปทั้งต้น โคมน้ำมันสามสิบเอ็ดดวงแกว่งตาม

    พอเสียงเด็กร้องดังลงมาจากชั้นบน ไม่มีใครโห่ ไม่มีใครปรบมือ ทุกคนลุกขึ้นยืนบนกิ่งพร้อมกัน แล้วต่อแถวปีนบันไดเชือกขึ้นไปทีละคน

    ของขวัญวางเรียงตั้งแต่ข้างเปลไปจนถึงประตู ผ้าห่มที่ทอมาสามปี ขลุ่ยกระดูกนก เมล็ดสนห่อใบไม้ที่ผู้ให้บอกว่าอีกร้อยปีจะสูงพอให้เด็กนั่งดูดาวได้ ผู้เฒ่าที่แก่ที่สุดในหมู่บ้านให้ของที่ไม่มีใครเห็น แกก้มลงกระซิบข้างหูเด็กนานจนแม่ต้องกระแอม

    ใกล้รุ่ง มีคนปีนขึ้นมาเป็นคนสุดท้าย

    โอรีวัลเป็นเด็กคนก่อนของบ้านกิ่งลม เก้าสิบเจ็ดปีก่อน ทั้งหมู่บ้านก็มานั่งบนกิ่งแบบนี้เพื่อเขา หลายเดือนมานี้เขาไม่ได้อยู่ในหมู่บ้าน เสื้อของเขามีกลิ่นควันไม้ ไม่ใช่ควันจากเตาบ้านไหน ผู้ใหญ่หลายคนเบือนหน้าตอนเขาเดินผ่าน

    เขาวางมีดเล่มหนึ่งลงข้างเปล ด้ามไม้ไอเลธ ใบดำเพราะรมควัน

    "ข้าไม่มีของอย่างอื่น" เขาว่า
  choices:
    - id: coo
      label: ส่งเสียงอ้อแอ้ใส่ทุกคนที่ก้มมาดู
      text: |
        ใครก้มลงมาดู ก็ได้ยินเสียงอ้อแอ้ตอบกลับไปทุกคน เอลฟ์ที่ไม่ได้ยินเสียงเด็กมาเก้าสิบเจ็ดปีกลับไปต่อแถวใหม่ บางคนกลับไปสามรอบ

        พ่อกับแม่ตั้งชื่อแรกในชีวิตให้ว่า{name} อีกร้อยปีจะได้ชื่อที่สอง ไว้ต่อท้ายชื่อนี้
      effects:
        flags: [origin_elf_bough, race_elf]
        location_tag: ileth
        stats: { CHA: 1 }
    - id: watch_eldest
      label: จ้องหน้าผู้เฒ่าไม่วางตาตอนแกกระซิบ
      text: |
        ผู้เฒ่ากระซิบจบแล้วยืดตัวขึ้น เด็กยังจ้องหน้าแกอยู่ ตาไม่กะพริบ แกจ้องกลับอยู่ครู่หนึ่ง

        "ได้ยินสินะ" แกว่าเบาๆ ไม่ได้ถาม แล้วเดินลงบันไดไปโดยไม่หันกลับมา

        พ่อกับแม่ตั้งชื่อแรกในชีวิตให้ว่า{name} อีกร้อยปีจะได้ชื่อที่สอง ไว้ต่อท้ายชื่อนี้
      effects:
        flags: [origin_elf_bough, race_elf, eldest_whispered]
        location_tag: ileth
        stats: { WIS: 1 }
    - id: grab_knife
      label: คว้าด้ามมีดของโอรีวัล
      text: |
        ตอนแม่เอื้อมไปหยิบมีดออกห่างเปล มือเล็กๆ คว้าด้ามไว้ได้ก่อน กำแน่นจนแม่ต้องค่อยๆ แกะ

        โอรีวัลหัวเราะออกมา คนในห้องหันมองกันหมด หลายเดือนแล้วที่ไม่มีใครได้ยินเขาหัวเราะ "ของเจ้า" เขาบอกเด็ก แล้วปีนลงไปก่อนพระอาทิตย์ขึ้น

        พ่อกับแม่ตั้งชื่อแรกในชีวิตให้ว่า{name} อีกร้อยปีจะได้ชื่อที่สอง ไว้ต่อท้ายชื่อนี้
      effects:
        flags: [origin_elf_bough, race_elf, grabbed_orival_knife]
        location_tag: ileth
        stats: { DEX: 1 }

# ---------- B5a เด็กมีเขาที่พ่อแม่เก็บไว้ ไม่ปิดบัง ----------
- id: infancy.birth_marked_kept
  stage: infancy
  weight: 6
  when: { age: [0, 0] }
  text: |
    เด็กเกิดตอนบ่ายสาม แดดส่องเข้าหน้าต่างเต็มห้อง ไม่เหลือมุมไหนให้ซ่อนอะไรได้

    ในห้องมีห้าคน หมอตำแย ย่า ป้าสองคน และแม่ ทุกคนเห็นพร้อมกัน ตุ่มแข็งสองตุ่มใต้ผมที่ยังเปียก กับหางเส้นเล็กที่ขดอยู่ใต้ก้น ป้าคนหนึ่งยกมือปิดปาก แล้วเดินออกไปโดยไม่ปิดประตู

    ย่าเป็นคนแรกที่พูด

    "ทางสามแพร่งอยู่แค่หลังโรงสี" แกว่า เสียงไม่ได้ใจร้าย พูดเหมือนบอกว่าพรุ่งนี้ฝนจะตก "ข้าอุ้มไปเอง แม่มันนอนพักไป ไม่ต้องเห็นหน้ามันอีก"

    แม่ไม่ตอบ เธอรับเด็กมาวางบนตัก แกะผ้าออกทั้งผืน แล้วนับนิ้ว นิ้วมือสิบ นิ้วเท้าสิบ นับออกเสียงทีละนิ้ว นับจบแล้วนับใหม่อีกรอบ ย่ายืนรออยู่ที่ปลายเตียงจนจบรอบที่สอง แล้วเดินออกไป

    เช้าวันรุ่งขึ้น แม่อุ้มลูกเดินไปที่บ่อน้ำกลางบ้านโรงสีบน ไม่ได้คลุมหัวลูก ผู้หญิงที่มาตักน้ำตอนเช้ามีสิบกว่าคน ทุกคนหยุดมือ

    "ลูกฉัน" แม่พูด "ใครมีอะไรจะพูด พูดวันนี้ทีเดียว"

    ไม่มีใครพูด มีแต่เสียงถังไม้กระแทกขอบบ่อ
  choices:
    - id: cry_at_well
      label: ร้องจ้าขึ้นมากลางลานบ่อ
      text: |
        เสียงร้องดังลั่นลานบ่อ ผู้หญิงคนหนึ่งหลุดหัวเราะ แล้วรีบก้มหน้าตักน้ำต่อ ยายแก่ที่สุดในลานพูดขึ้นลอยๆ "ร้องเสียงก็เหมือนเด็กทั่วไปนั่นแหละ" แล้วหิ้วถังกลับบ้าน

        {mother}ตั้งชื่อลูกว่า{name} ท้ายเดือนนั้น สมุดวิหารลงชื่อ{name} ลูก{father} ไว้ในหน้าผู้ต้องตรา
      effects:
        flags: [origin_marked_kept, race_tiefling]
        location_tag: arvel_village
        name_pool: { self: human, parents: human }
        stats: { CHA: 1 }
    - id: stare_back
      label: ลืมตามองหน้าทุกคนทีละคน
      text: |
        เด็กลืมตา มองไปรอบลานช้าๆ เหมือนนับคน ผู้หญิงที่โดนมองหลบตาไปทีละคน จนเหลือคนสุดท้าย ป้าร้านขายด้ายจ้องกลับนานกว่าใคร แล้วถุยน้ำลายลงพื้น

        {mother}ตั้งชื่อลูกว่า{name} ท้ายเดือนนั้น สมุดวิหารลงชื่อ{name} ลูก{father} ไว้ในหน้าผู้ต้องตรา
      effects:
        flags: [origin_marked_kept, race_tiefling]
        location_tag: arvel_village
        name_pool: { self: human, parents: human }
        stats: { WIS: 1 }
    - id: sleep_through
      label: หลับสบายในอ้อมแขนแม่ ไม่สนใครทั้งลาน
      text: |
        เด็กหลับอยู่ตลอด ปากยังขมุบขมิบ ผู้หญิงสองสามคนค่อยๆ ขยับเข้ามาดูใกล้ๆ ทีละก้าว คนหนึ่งเผลอยิ้ม แล้วหน้าแดงเพราะคนอื่นเห็น

        {mother}ตั้งชื่อลูกว่า{name} ท้ายเดือนนั้น สมุดวิหารลงชื่อ{name} ลูก{father} ไว้ในหน้าผู้ต้องตรา
      effects:
        flags: [origin_marked_kept, race_tiefling]
        location_tag: arvel_village
        name_pool: { self: human, parents: human }
        stats: { CON: 1 }

# ---------- B5b เด็กมีเขาในบ้านขุนนาง เลื่อยเขาแล้วเลี้ยงแบบปิดบัง ----------
- id: infancy.birth_marked_hidden
  stage: infancy
  scene: noble_hall
  weight: 4
  when: { age: [0, 0] }
  text: |
    คฤหาสน์มีสี่สิบสองห้อง ปีนั้นเปิดใช้อยู่เก้าห้อง ห้องที่เหลือคลุมผ้าขาวไว้ทั้งตู้ทั้งกระจก ที่ดินทางใต้ขายให้เจ้าของโรงกลั่นไปตั้งแต่ปีก่อน เงินที่ได้มาพอจ้างคนรับใช้ได้อีกสองปี และยังพอเลี้ยงหมอประจำตระกูลไว้ได้อีกสองปีเหมือนกัน

    หมอคนนั้นทำคลอดอยู่ในห้องนอนชั้นสอง ไม่มีหมอตำแย ไม่มีญาติผู้หญิง มีแต่สาวใช้คนเดียวที่อยู่กับตระกูลมาตั้งแต่ยังเด็ก

    ท่านย่ารออยู่ในห้องสมุด นั่งเก้าอี้พนักสูงที่หันหน้าเข้าเตาผิง ชาในถ้วยเย็นไปนานแล้ว ข้างถ้วยมีกล่องไม้ใบเล็กเปิดฝาไว้ ข้างในบุกำมะหยี่สีหม่น ยุบเป็นร่องตามรูปของที่วางอยู่ เลื่อยเงินอันยาวเท่านิ้วมือ

    หมอเคาะประตูตอนเกือบเที่ยงคืน

    "ทารกแข็งแรงดีขอรับ"

    ท่านย่าไม่ถามว่าเด็กเป็นอย่างไร แกถามว่า "ใครเห็นบ้าง"

    "สาวใช้ กับกระผมขอรับ"

    "สาวใช้ข้าจัดการเอง แล้วเจ้าล่ะ"

    "ถ้ากระผมปากโป้ง ท่านก็คงไม่จ้างกระผมมายี่สิบปีขอรับ"

    ท่านย่าปิดฝากล่อง แล้วยื่นให้เขา

    "หางเก็บไว้ใต้เสื้อได้" แกว่า "เขาเก็บไม่ได้"
  choices:
    - id: scream
      label: ร้องจนสาวใช้ต้องเอามือปิดปาก
      text: |
        เสียงร้องดังลงไปถึงห้องสมุด ท่านย่าลุกไปปิดประตู แล้วกลับมานั่งที่เดิม รินชาเย็นใส่ถ้วยใหม่ ดื่มจนหมด

        รุ่งเช้า แกเขียนชื่อหลานลงสมุดตระกูลด้วยลายมือตัวเอง {name} {surname} ช่องเผ่าเขียนว่า มนุษย์
      effects:
        flags: [origin_marked_hidden, race_tiefling, horns_sawn]
        location_tag: ventras
        name_pool: { self: human_noble, parents: human_noble }
        stats: { CHA: 1 }
    - id: silent
      label: ไม่ร้องสักแอะตอนเลื่อยเงินแตะหัว
      text: |
        ไม่มีเสียงร้องลงมาถึงห้องสมุดเลยสักครั้ง ท่านย่านั่งฟังความเงียบนั้นจนฟืนในเตาผิงมอด

        สาวใช้เล่าให้คนในครัวฟังหลายปีต่อมาว่า เด็กลืมตาอยู่ตลอด มองหน้าหมอทั้งตอนเลื่อยข้างซ้ายและข้างขวา

        รุ่งเช้า ท่านย่าเขียนชื่อหลานลงสมุดตระกูลด้วยลายมือตัวเอง {name} {surname} ช่องเผ่าเขียนว่า มนุษย์
      effects:
        flags: [origin_marked_hidden, race_tiefling, horns_sawn]
        location_tag: ventras
        name_pool: { self: human_noble, parents: human_noble }
        stats: { CON: 1 }
    - id: bite
      label: งับนิ้วหมอด้วยเหงือก ไม่ยอมปล่อย
      text: |
        หมอต้องหยุดเลื่อยกลางคัน เพราะเด็กงับนิ้วชี้ของเขาไว้แน่นจนดึงไม่ออก เขารอจนเด็กเผลอหลับถึงได้ทำต่อ คืนนั้นเขากลับบ้านช้ากว่าที่บอกเมียไว้สองชั่วยาม

        รุ่งเช้า ท่านย่าเขียนชื่อหลานลงสมุดตระกูลด้วยลายมือตัวเอง {name} {surname} ช่องเผ่าเขียนว่า มนุษย์
      effects:
        flags: [origin_marked_hidden, race_tiefling, horns_sawn, bit_the_doctor]
        location_tag: ventras
        name_pool: { self: human_noble, parents: human_noble }
        stats: { STR: 1 }

# ---------- B5c เด็กมีเขาที่ถูกทิ้งไว้หน้าวิหารอีเซล ----------
- id: infancy.birth_marked_foundling
  stage: infancy
  scene: temple
  weight: 6
  when: { age: [0, 0] }
  text: |
    ไฟในชามหน้าแท่นของวิหารใหญ่อีเซล ที่โคนเสากลางทุ่ง ไม่เคยดับมาสามร้อยปี ช่องส่งขนมปังข้างกำแพงวิหารก็ไม่เคยลงกลอนมานานพอกัน ช่องนั้นกว้างพอให้ตะกร้าใบหนึ่งลอดเข้ามาได้ ใครจะเอาอะไรมาวางไว้ตอนกลางคืน วิหารไม่ถาม

    แม่ชีที่เข้าเวรเช้าเปิดช่องนั้นตอนตีห้าเหมือนทุกวัน ปกติจะเจอขนมปังค้างคืนที่ร้านในเมืองเอามาบริจาค เช้านี้มีตะกร้าหวายวางอยู่ข้างถุงขนมปัง

    ข้างในเป็นเด็กแรกเกิด ห่อด้วยกระสอบแป้งที่ยังเห็นตราโรงสีเลือนอยู่ครึ่งหนึ่ง ข้อมือผูกด้ายแดงร้อยกระดุมดีบุกไว้หนึ่งเม็ด แม่ชีไม่ต้องแกะผ้าดูก็รู้ ใต้ผ้าคลุมหัวมีอะไรนูนอยู่สองจุด

    เธออุ้มตะกร้าเข้าไปในวิหาร วางลงบนม้านั่งหน้าชามไฟ แล้วเปิดสมุดเล่มหนาบนแท่นอ่าน

    "ปีนี้เป็นคนที่สาม" เธอพูดกับใครสักคนที่ไม่อยู่ในห้อง แล้วจุ่มปากกา

    เด็กที่วิหารเก็บมาเลี้ยงจะได้ชื่อจากฟ้าเช้าวันที่พบตัว แม่ชีวางปากกา เดินไปเปิดหน้าต่างบานที่หันออกทุ่ง
  choices:
    - id: hoarse_cry
      label: ร้องเสียงแหบ เพราะร้องมาทั้งคืน
      text: |
        เสียงร้องแหบจนเหลือแต่ลม แม่ชีอีกสองคนตื่นมาดู คนหนึ่งไปอุ่นนมแพะ อีกคนเอาผ้าแห้งมาเปลี่ยนให้ กระสอบแป้งพับเก็บไว้ในหีบใต้แท่น พร้อมกระดุมดีบุกเม็ดนั้น

        แม่ชีมองฟ้าอยู่ครู่หนึ่ง แล้วเขียนลงสมุดว่า {name} ช่องพ่อกับช่องแม่ เธอขีดเส้นไว้ช่องละเส้น
      effects:
        flags: [origin_marked_foundling, race_tiefling, foundling_tin_button]
        location_tag: arvel_village
        name_pool: { self: temple_foundling, parents: none }
        stats: { CHA: 1 }
    - id: suck_thumb
      label: ดูดนิ้วตัวเองเงียบๆ
      text: |
        เด็กไม่ร้อง ดูดนิ้วโป้งตัวเองอยู่เงียบๆ แม่ชีดึงนิ้วออกมาดู นิ้วนั้นแดงช้ำ ดูดมาทั้งคืน

        แม่ชีมองฟ้าอยู่ครู่หนึ่ง แล้วเขียนลงสมุดว่า {name} ช่องพ่อกับช่องแม่ เธอขีดเส้นไว้ช่องละเส้น
      effects:
        flags: [origin_marked_foundling, race_tiefling, foundling_tin_button]
        location_tag: arvel_village
        name_pool: { self: temple_foundling, parents: none }
        stats: { CON: 1 }
    - id: stare_flame
      label: จ้องเปลวไฟในชามไม่กะพริบ
      text: |
        เด็กหันหน้าไปทางชามไฟ เปลวไฟสะท้อนอยู่ในตาคู่นั้นชัดกว่าในตาคนทั่วไป เปลวไฟสีส้ม แต่ในตาเด็กเป็นสีแดง แม่ชีเลื่อนตะกร้าออกห่างชามไปหนึ่งช่วงแขน แล้วเลื่อนกลับมาที่เดิม

        เธอมองฟ้าอยู่ครู่หนึ่ง แล้วเขียนลงสมุดว่า {name} ช่องพ่อกับช่องแม่ เธอขีดเส้นไว้ช่องละเส้น
