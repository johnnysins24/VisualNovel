# ชุด อ องค์กร: หน่วยไส้ตะเกียง (wick) ไฟล์ ข การปะทะยศ 2 สองเรื่อง เลื่อนยศ 4 ความลับ 4 ตามล่า รัก และทางออก 4
# คนในชุดเหมือนไฟล์ ก (ออสริค ไซเวล ทอร์เบน สิบเก้า) ไวเลน คนถ่อแพที่ท่าข้ามฟาก (ข้อความไม่ใช้สรรพนามเพศ เมื่อตัวละครผิดคำ ไวเลนขึ้นเป็นคู่ครองด้วยชื่อนี้ เพศตรงข้ามกับตัวละคร)
# ของประจำยศ: ตะเกียงดำ (wick_black_lamp) ได้ในฉากขึ้นเป็นผู้จุดทุกทาง วางคืนเมื่อออกจากหน่วยทุกทาง
# งานยศ 2 ขึ้นไปอาจออกกับผู้จุดหรือผู้ดับ ข้อความจึงไม่เขียนว่าใครถือตะเกียงดำ ตะเกียงดำอยู่ในวิธีที่กัน min_rank 3
# เลื่อนยศ: ถังเปลี่ยนเป็นขอเหล็ก (1→2) ขอเหล็กเปลี่ยนเป็นตะเกียงดำจากออสริค (2→3 มีทางของคนมีตรา คนเดินหน้าคนแรกที่ถือ) ไซเวลสอนตวงเถ้า (3→4)
# ผลงานเพิ่ม: secret_numbers 1 · secret_tin_boxes 1 · secret_wrong_burning 2 · secret_cloth_strip 1 รวม 5
# ตามล่า: hunt_white_gloves star_listeners +1 (สองทาง) · hunt_listener_on_the_stairs ชนะหรือเจรจา star_listeners −1 (กันคนมีตรา ข้อความพลาดใช้เสียงฮัมที่คนมีตราไม่ได้ยิน) · love_vow ผิดคำ lamp_church +2 · leave_chalk_cask เดินออกไปพร้อมความจำ lamp_church +2

# ---------- การปะทะ (ยศ 2 ขึ้นไป คนมีตราไม่ได้ฉากเหล่านี้) ----------
- id: adult.wick_duty_warehouse_shadow
  stage: adult
  weight: 20
  time: night
  duty: wick
  when:
    age: [20, 64]
    org: { id: wick, min_rank: 2 }
    not_traits: [curse_brand]
  text: |
    โกดังของพ่อค้าเกลือหลังนั้นปิดมาสิบวัน คนเฝ้าคนสุดท้ายลาออกหลังเห็นเงาของตัวเองเดินไปทางหนึ่ง ขณะที่ตัวเองยืนนิ่ง ชุดแขวนตะเกียงไว้รอบโกดังสิบสองดวงตั้งแต่หัวค่ำ จุดครบทุกดวง ไม่ถึงชั่วยาม ตะเกียงสามดวงที่มุมด้านในก็ดับเอง ไส้ยังชุ่มน้ำมัน ไม่มีลม

    คนที่เดินเข้าไปหาต้องมีขอเหล็กในมือ คืนนี้คือ{name} เหล็กไฟกับผ้าชุบน้ำมันอยู่ในย่ามที่เอว งานคือเดินเข้าไปจุดตะเกียงสามดวงนั้นใหม่ทีละดวง ให้แสงส่องถึงทุกซอก ระหว่างกองกระสอบเกลือ เงาของ{name}ทอดไปตามพื้นข้างหน้า และมีอีกเงาหนึ่งทอดอยู่ข้างกัน ตรงที่ควรมีคนยืนไม่มีใครยืนอยู่
  encounter:
    foe: extra_shadow
    name: เงาเกินในโกดังเกลือ
    morale: 2
    beats:
      - text: เงาที่ไม่มีเจ้าของเลื่อนจากพื้นขึ้นไปบนกองกระสอบ ยืดสูงขึ้นทีละช่วงแขน มุ่งไปหาตะเกียงดวงที่ยังติดอยู่ใกล้{name}ที่สุด
        moves:
          - id: shadow_relight_first
            label: วิ่งไปจุดตะเกียงดวงแรกที่ดับ ให้มุมนั้นสว่างก่อน
            kind: item
            stat: DEX
            tags: [light]
            success: ไส้ติดไฟตั้งแต่ประกายแรก แสงเหลืองแผ่ไปถึงกองกระสอบ เงาที่ไม่มีเจ้าของหดลงจากกองเกลือเหมือนผ้าที่โดนกระชากชาย ขอบขาดเป็นริ้ว
          - id: shadow_hook_swing
            label: ฟาดขอเหล็กลงกลางเงา
            kind: attack
            tags: [pierce]
          - id: shadow_back_to_post
            label: ถอยไปยืนหลังชนเสาที่แขวนตะเกียง ให้แสงอยู่เหนือหัว
            kind: guard
          - id: shadow_out_the_door
            label: ถอยออกทางประตูที่เข้ามา
            kind: flee
      - text: เงาเกินทาบลงบนเงาจริงของ{name}พอดี ขาสองข้างหนักขึ้นเหมือนลุยโคลน ตะเกียงดวงที่สองที่ดับอยู่ห่างไปอีกสิบก้าว
        answer: item
        moves:
          - id: shadow_lift_rag
            label: จุดผ้าชุบน้ำมันชูเหนือหัว ให้เงาจริงหดลงมาอยู่ใต้เท้า
            kind: item
            stat: CON
            tags: [fire, light]
          - id: shadow_drag_step
            label: ลากเท้าไปทีละก้าวจนถึงตะเกียงดวงที่สอง
            kind: guard
          - id: shadow_find_the_seam
            label: หาเส้นที่เงาสองเงาซ้อนกัน แล้วก้าวออกตรงนั้น
            kind: read
            stat: WIS
          - id: shadow_crawl_out
            label: ทิ้งขอเหล็ก คลานไปหาประตู
            kind: flee
      - text: เหลือมุมเดียวที่มืด ใต้ชายคาด้านในสุดที่ตะเกียงดวงที่สามแขวนอยู่ เงาเกินไปรวมตัวกันตรงนั้น หนาจนกองกระสอบเกลือข้างหลังหายไปทั้งกอง
        answer: item
        moves:
          - id: shadow_oil_the_corner
            label: ราดน้ำมันลงพื้นมุมนั้น แล้วโยนผ้าที่ติดไฟตามลงไป
            kind: item
            stat: DEX
            tags: [fire]
            success: ไฟวิ่งตามทางน้ำมันถึงมุมในชั่วกะพริบตา แสงส้มส่องขึ้นถึงชายคา เงาเกินไม่มีที่ไป ขาดเป็นชิ้นบางๆ แล้วหายเข้าไปในแสงทีละชิ้น เหมือนกระดาษเปียกละลายในน้ำ
          - id: shadow_black_lamp
            label: แกะผ้าห่อตะเกียงดำ ยกแสงแดงคล้ำส่องเข้ามุม
            kind: item
            stat: WIS
            tags: [light]
            requires: { org: { id: wick, min_rank: 3 } }
          - id: shadow_hook_the_lamp
            label: เอาขอเหล็กเกี่ยวตะเกียงดวงที่สามลงมาจุดกับพื้น
            kind: quick
          - id: shadow_stand_in_light
            label: ยืนกลางแสงที่จุดไว้แล้ว รอให้มันเข้ามาหาเอง
            kind: guard
          - id: shadow_last_door
            label: วิ่งออกประตู ปล่อยมุมนั้นให้คนข้างนอก
            kind: flee
    win:
      text: |
        ตะเกียงสิบสองดวงติดครบตอนตีสาม แสงส่องถึงทุกซอกระหว่างกองกระสอบ เงาของ{name}ทอดไปบนพื้นเงาเดียว ขยับตามจังหวะเดียวกับตัว คนในชุดข้างนอกร้องถามผ่านประตูสามครั้งก่อนจะเปิดเข้ามา

        เช้านั้นพ่อค้าเกลือถามว่าต้องจ่ายค่าน้ำมันไหม ไม่มีใครตอบ ชุดเก็บตะเกียงขึ้นเกวียนสิบเอ็ดดวง ทิ้งไว้ดวงเดียวที่มุมด้านใน ไส้ใหม่ น้ำมันเต็ม
      effects: { reputation: { lamp_church: 1 }, flags: [lit_out_the_warehouse_shadow] }
    lose:
      text: |
        ความเย็นซึมขึ้นจากเงาจนขาไม่ฟัง {name}ล้มลงข้างกองกระสอบ ข้างนอกคนในชุดเห็นตะเกียงดับเพิ่มอีกสองดวง จึงพังประตูเข้ามาพร้อมคบไฟสี่ดวง ลาก{name}ออกมาถึงแสงจันทร์

        จนเช้า{name}ยังหนาวสั่น ห่มผ้ากี่ผืนก็ไม่หาย
      effects: { flags: [chilled_by_the_warehouse_shadow] }
    stalemate:
      text: |
        ฟ้าสางก่อนตะเกียงดวงสุดท้ายจะติด แสงแรกลอดช่องลมเข้ามา เงาเกินบางลงจนเห็นกระสอบเกลือทะลุผ่าน แล้วไม่อยู่ตรงนั้นอีก ไม่มีใครรู้ว่ามันหายไป หรือย้ายไปอยู่ที่ที่มืดกว่า

        ชุดทิ้งตะเกียงไว้ในโกดังเจ็ดดวง ให้พ่อค้าเกลือจุดทุกคืนจนสิ้นเดือน ค่าน้ำมันศาสนจักรออกให้
      effects: { reputation: { lamp_church: 1 }, flags: [outlasted_the_warehouse_shadow] }
    flee:
      text: |
        {name}พ้นประตูออกมาถึงลานที่มีแสงจันทร์ เงาที่ตามออกมามีเงาเดียว คนในชุดปิดประตูโกดังแล้วตอกไม้กากบาททับ

        สามคืนต่อมาชุดกลับไปพร้อมตะเกียงยี่สิบดวง ต้องจุดให้สว่างเหมือนกลางวันถึงสองคืน น้ำมันหมดไปสี่ถัง ทอร์เบนจดลงสมุดพร้อมชื่อ{name}
      effects: { flags: [fled_the_warehouse_shadow] }
    death:
      text: |
        เงาเกินดึงข้อเท้าเงาจริงอีกครั้ง {name}ล้มหงาย ความเย็นไหลจากพื้นขึ้นมาในอก

        ตะเกียงดวงเดียวที่ยังติดอยู่ใกล้ประตูส่องเงาของ{name}ทอดยาวไปบนพื้น เงาที่ลุกขึ้นยืนได้เอง

- id: adult.wick_duty_salt_well
  stage: adult
  weight: 20
  time: night
  duty: wick
  when:
    age: [20, 64]
    org: { id: wick, min_rank: 2 }
    not_traits: [curse_brand]
  text: |
    หมู่บ้านริมทุ่งแห่งหนึ่งตักน้ำจากบ่อกลางลานมาทั้งชีวิต สองคืนก่อนน้ำในบ่อเค็มขึ้นมาเอง เค็มกว่าน้ำทะเล ถังที่หย่อนลงไปเช้านี้ขึ้นมาเปล่า เชือกขาดตรงปลาย รอยขาดเปียกเมือกสีน้ำลึก หมาในหมู่บ้านไม่ยอมเดินผ่านลาน

    ชุดปักคบไฟล้อมปากบ่อสี่ด้าน ในบ่อมืดสนิท มีเสียงน้ำกระเพื่อมช้าๆ เหมือนของที่ใหญ่กว่าบ่อขดตัวอยู่ข้างล่าง งานของ{name}คือยืนปากบ่อด้านที่ใกล้ที่สุด ล่อให้มันขึ้นมาหาของอุ่น และไม่ให้มันได้ของอุ่นที่เป็นคน
  encounter:
    foe: sky_spawn
    name: ลูกของทะเลข้างบนในบ่อเค็ม
    morale: 2
    beats:
      - text: หนวดเส้นแรกโผล่พ้นขอบบ่อ ยาวเท่าเสากระโดง สีเหมือนน้ำลึกตอนกลางคืน ปลายหนวดคลำขอบหินช้าๆ หาของที่อุ่น
        moves:
          - id: well_torch_bait
            label: หย่อนคบไฟลงไปตรงหน้าหนวด ให้มันรัดคบแทนขา
            kind: item
            stat: DEX
            tags: [fire, bait]
            success: หนวดรัดคบไฟทันทีที่ไออุ่นถึง รัดแน่นจนไฟพ่นเป็นฝอย เนื้อหนวดตรงที่รัดไหม้เป็นควันกลิ่นเค็ม หนวดสะบัดกลับลงบ่อ ทิ้งคบไฟที่ยังลุกไว้บนขอบหิน
          - id: well_step_back
            label: ถอยจากขอบบ่อหนึ่งก้าว ยืนนิ่งให้หนวดคลำผ่านไป
            kind: guard
          - id: well_hook_tip
            label: ใช้ขอเหล็กกดปลายหนวดตรึงไว้กับขอบหิน
            kind: attack
            tags: [pierce]
          - id: well_run_off
            label: วิ่งออกจากลาน ไปยืนหลังคบไฟของคนอื่น
            kind: flee
      - text: ลูกของทะเลข้างบนไต่ขึ้นพ้นปากบ่อทั้งตัวด้วยหนวดหกเส้น ตัวกลางนิ่มเหมือนถุงน้ำ หนวดสองเส้นพุ่งมาทางขาของ{name}
        answer: item
        moves:
          - id: well_oil_and_fire
            label: สาดน้ำมันทั้งถังลงตัวกลาง แล้วจุด
            kind: item
            stat: DEX
            tags: [fire]
            success: น้ำมันติดไฟทั้งถุงน้ำ ลุกเป็นเปลวสีน้ำเงินที่ไม่มีใครเคยเห็นในไฟธรรมดา กลิ่นทะเลไหม้ลอยไปทั่วลาน หนวดหกเส้นหดเข้าหาตัวพร้อมกัน แล้วทั้งตัวไถลกลับลงบ่อ ยังลุกอยู่ตอนตกถึงน้ำ
          - id: well_coat_bait
            label: ถอดเสื้อนอกที่ยังอุ่นโยนให้หนวดรัด แล้วกระโดดหลบ
            kind: item
            stat: DEX
            tags: [bait]
          - id: well_hook_drag
            label: เกี่ยวหนวดเส้นที่ใกล้ที่สุด ลากออกห่างจากคนอื่น
            kind: attack
            tags: [pierce]
          - id: well_into_the_field
            label: วิ่งหนีออกไปในทุ่ง
            kind: flee
    win:
      text: |
        ในบ่อมีเสียงฟู่ยาวครั้งเดียว แล้วไม่มีเสียงอะไรอีก ไอน้ำเค็มลอยขึ้นจากปากบ่อจนรุ่งเช้า คนในชุดหย่อนตะขอลงไปลากสิ่งที่เหลือขึ้นมา ได้ก้อนเนื้อดำไหม้เท่าหมอนหนึ่งใบ ใส่หีบตะกั่วปิดฝาบัดกรีก่อนตะวันขึ้น

        หมู่บ้านถมบ่อด้วยดินกับหินจนเต็มปากภายในสัปดาห์นั้น บ่อใหม่ต้องขุดห่างออกไปครึ่งวันเดิน ผู้หญิงในหมู่บ้านหาบน้ำกันวันละสองเที่ยว
      effects: { reputation: { lamp_church: 1 }, flags: [burned_the_spawn_in_the_salt_well] }
    lose:
      text: |
        หนวดรัดเอวจนหายใจได้ครึ่งอก คนในชุดสามคนช่วยกันเอาคบไฟจี้หนวดจนคลาย ลาก{name}ออกมานอนกลางลาน ขามีรอยรัดสีม่วงเป็นวงเรียงกัน

        ลูกของทะเลข้างบนกลับลงบ่อไป ชุดต้องเผาน้ำมันลงบ่ออีกสองคืนจึงไม่มีเสียงกระเพื่อม
      effects: { flags: [bound_by_the_well_spawn] }
    stalemate:
      text: |
        ลูกของทะเลข้างบนถอยกลับลงบ่อ ทิ้งรอยเมือกยาวไว้บนขอบหิน แล้วไม่ขึ้นมาอีกจนสาง คนในชุดเทน้ำมันลงบ่อสามถังแล้วโยนคบไฟตาม บ่อลุกเป็นปล่องไฟอยู่ครึ่งวัน

        หมู่บ้านถมบ่อด้วยดินกับหินในสัปดาห์เดียวกัน ไม่มีใครอยากรู้ว่าข้างล่างเหลืออะไร
      effects: { reputation: { lamp_church: 1 }, flags: [burned_out_the_salt_well] }
    flee:
      text: |
        {name}วิ่งจนพ้นแสงคบไฟ ข้างหลังมีเสียงคนในชุดตะโกนเรียกกันกับเสียงถังน้ำมันกลิ้ง กว่าจะกลับเข้าลานได้ ไฟลุกท่วมปากบ่อแล้ว

        ไม่มีใครในชุดถามว่า{name}ไปไหนมา ทอร์เบนจดถังน้ำมันที่หายไปห้าถังลงสมุด เท่ากับที่ชุดใช้ในสามเดือน
      effects: { flags: [fled_the_salt_well] }
    death:
      text: |
        หนวดเส้นที่สามรัดรอบอก ความเย็นของน้ำลึกไหลเข้ามาแทนลมหายใจ ขอบบ่อเลื่อนเข้ามาใกล้ทีละคืบ

        คบไฟที่ปักไว้สี่ด้านยังลุกอยู่ทุกดวง น้ำในบ่อกระเพื่อมครั้งเดียว แล้วนิ่ง

# ---------- เลื่อนยศ ----------
- id: adult.wick_rise_hook
  stage: adult
  weight: 60
  must: true
  when:
    age: [19, 80]
    org: { id: wick, min_rank: 1, max_rank: 1, ready: true }
  text: |
    งานจบตอนสางเหมือนทุกครั้ง ชุดเดินกลับเข้าลานโรงน้ำมันเป็นแถวเดิม {name}เดินท้ายแถว ถังน้ำมันอยู่บนหลัง สายสะพายหนังกดบ่าเป็นร่องตรงที่เดิม ระหว่างประตูลานกับห้องเก็บถัง ออสริคเดินย้อนลงมาท้ายแถว ปลดหัวเข็มขัดสายสะพายของ{name}โดยไม่บอกก่อน แล้วยกถังขึ้นบ่าตัวเอง

    ของที่เขายื่นให้แทนเป็นแท่งเหล็กยาวเท่าแขนช่วงล่าง ปลายหนึ่งงอเป็นขอ อีกปลายพันหนังเป็นด้าม หนังด้ามสึกเป็นรอยนิ้วของมือใครสักคนที่ไม่ใช่มือเขา ออสริคหันหูขวามา บอกว่าตั้งแต่คืนพรุ่งนี้ไม่ต้องเดินท้าย ไส้เดินเข้าไปหา ไม่ได้เดินตาม ส่วนที่ไหม้ของตะเกียงก็เรียกว่าไส้ หน่วยไม่มีคำอธิบายอื่นให้

    ทอร์เบนจดหนึ่งบรรทัดลงสมุด สิบเก้าที่นั่งถอดรองเท้าอยู่บนขั้นบันไดเงยหน้าขึ้นดูขอเหล็กในมือ{name}ครู่หนึ่ง แล้วก้มลงแกะเชือกรองเท้าต่อ ถังน้ำมันใบนั้นพรุ่งนี้จะไปอยู่บนหลังใคร ยังไม่มีใครพูดถึง
  choices:
    - id: ask_whose_hook
      label: ชั่งขอเหล็กในมือ แล้วถามว่าคนถือคนก่อนเป็นใคร
      text: |
        ออสริคบอกว่าขอเหล็กไม่มีเจ้าของ มีแต่คนถือ คนถือคนก่อนถือได้ไม่นาน คนก่อนหน้านั้นก็เหมือนกัน เขาบอกชื่อมาสองชื่อ แล้วบอกว่าจำชื่อที่สามไม่ได้ ไม่ใช่เพราะน้ำมัน เพราะไม่ได้ตั้งใจจำ

        {name}พันหนังที่ด้ามใหม่ทับรอยนิ้วเก่าคืนนั้น ใช้หนังจากสายสะพายถังเส้นเดิม พันแน่นจนด้ามหนาขึ้นเท่าความกว้างของนิ้ว
      effects:
        org: { id: wick, promote: true }
        mark: ขึ้นเป็นไส้
        stats: { STR: 1 }
        flags: [took_the_iron_hook]
    - id: carry_the_cask_once_more
      label: ขอถังคืนมาแบกเข้าห้องเก็บเองเป็นเที่ยวสุดท้าย
      text: |
        ออสริคส่งถังคืนโดยไม่ถามเหตุผล {name}แบกเข้าห้องเก็บ วางลงตรงรอยวงกลมบนพื้นที่ถังใบนั้นวางทุกเช้า ปลดสายสะพาย แขวนไว้ที่ตะปูข้างประตู ตะปูตัวที่สามจากซ้าย

        บ่าที่ไม่มีสายสะพายเบาจนเดินเอียงไปทั้งวัน ตกเย็น{name}ยังยกมือขึ้นจับสายที่ไม่อยู่แล้วสองครั้ง
      effects:
        org: { id: wick, promote: true }
        mark: ขึ้นเป็นไส้
        stats: { CON: 1 }
        flags: [carried_the_cask_last_time]
    - id: hook_wrapped_like_sibkao
      label: ยื่นขอเหล็กให้สิบเก้าพันหัวขอแบบที่คนเดินหน้าพัน
      requires: { trait: curse_brand }
      text: |
        สิบเก้าวางรองเท้าลง ฉีกผ้าจากชายเสื้อตัวเองเป็นแถบยาว พันหัวขอเหล็กทีละรอบจนปลายขอแตะหินแล้วไม่มีเสียง นางบอกว่าคนที่ถือแสงอยู่ข้างหลังได้ยินเสียงเหล็กกระทบหินแล้วสบายใจ คนเดินหน้าไม่มีใครให้สบายใจ

        นางยื่นขอคืนมาทางด้าม แล้วก้มลงแกะเชือกรองเท้าต่อจากเส้นที่ค้างไว้ ชายเสื้อนางสั้นกว่าเมื่อเช้าไปหนึ่งคืบ
      effects:
        org: { id: wick, promote: true }
        mark: ขึ้นเป็นไส้
        stats: { DEX: 1 }
        flags: [hook_wrapped_by_sibkao]

- id: adult.wick_rise_black_lamp
  stage: adult
  weight: 60
  must: true
  time: night
  when:
    age: [19, 80]
    org: { id: wick, min_rank: 2, max_rank: 2, ready: true }
  text: |
    สิ้นเดือน ทอร์เบนนับตะเกียงดำ เขานับทุกเดือนไม่เคยขาด สี่สิบเก้าดวงทั่วอาณาจักร แต่ละดวงมีหน้ากระดาษของตัวเองในสมุดปกเหล็กบางที่ล่ามโซ่ไว้กับโต๊ะ หน้าหนึ่งมีชื่อคนถือเรียงลงมาทีละบรรทัด ลายมือไม่ซ้ำกันสักบรรทัด บรรทัดสุดท้ายของหน้าที่เปิดอยู่เป็นชื่อออสริค

    คืนนั้นออสริควางตะเกียงดวงหนึ่งลงบนโต๊ะตรงหน้า{name} เหล็กรมดำจนไม่สะท้อนแสงอะไร ฝาครอบไส้มีรอยบุบสองรอย ไส้ข้างในดำสนิท ชุบผงที่ทั้งอาณาจักรห้ามพก เขาไม่จุดให้ดู ไม่อธิบาย เขาเลื่อนตะเกียงมาจนสุดโต๊ะ แล้วถอนมือตัวเองออก

    ไซเวลดึงแถบผ้าเส้นหนึ่งออกจากข้อมือ อ่าน แล้วพันกลับ สิบเก้ายืนอยู่ที่ประตู ไส้อีกคนในชุดลุกออกจากห้องไปก่อนทอร์เบนจะจุ่มปากกาลงหมึก เสียงประตูลานปิดดังกว่าที่ต้องดัง
  choices:
    - id: sign_below_osric
      label: เขียนชื่อตัวเองต่อจากชื่อออสริค
      text: |
        ปากกาของทอร์เบนหนักกว่าปากกาทั่วไป ปลายเป็นเหล็ก {name}เขียนช้ากว่าที่เคยเขียนชื่อตัวเองมาทั้งชีวิต ออสริคยื่นนิ้วชี้มาแตะบรรทัดชื่อตัวเองครั้งเดียว เหมือนแตะไหล่คนที่กำลังจะเดินสวนออกไป

        คืนแรกที่จุด แสงแดงคล้ำทำให้ทุกอย่างในห้องดูเก่าลง มือที่ถือด้ามร้อนขึ้นช้าๆ จนต้องหาผ้ามาพัน ผ้าผืนนั้น{name}พันไว้ที่ด้ามตลอดมา ไม่เคยแกะ
      effects:
        org: { id: wick, promote: true }
        mark: ขึ้นเป็นผู้จุด
        items: [wick_black_lamp]
        stats: { WIS: 1 }
        flags: [signed_for_the_black_lamp]
    - id: ask_osric_about_the_ear
      label: ถามออสริคว่าคืนที่โรงกลั่นคืนนั้นเกิดอะไรขึ้น
      text: |
        ออสริคตอบประโยคเดียว เขายืนผิดข้างของแสงไปครึ่งก้าว แล้วเขาจับไหล่{name}หมุนไปยืนหลังตะเกียงบนโต๊ะ ขยับไปซ้ายครึ่งก้าว ถอยหลังอีกครึ่งก้าว จนแสงแดงคล้ำตกลงพื้นตรงหน้าเท้าพอดี บอกว่าตรงนี้ จำที่ยืนไว้ ไม่ต้องจำเรื่องของเขา

        ทุกคืนที่จุดตะเกียงดำหลังจากนั้น{name}ขยับเท้าซ้ายครึ่งก้าวก่อนจะทำอย่างอื่น คนในชุดเห็นจนชิน
      effects:
        org: { id: wick, promote: true }
        mark: ขึ้นเป็นผู้จุด
        items: [wick_black_lamp]
        stats: { CON: 1 }
        flags: [learned_where_to_stand_from_osric]
    - id: name_not_number
      label: บอกทอร์เบนให้เขียนชื่อลงหน้าตะเกียง ไม่ใช่เลขในเล่มเล็ก
      requires: { trait: curse_brand }
      text: |
        ทอร์เบนวางปากกาลง เปิดสมุดปกเหล็กไล่ไปทีละหน้า สี่สิบเก้าหน้า เขาเปิดช้าพอให้{name}อ่านทันทุกบรรทัด ไม่มีบรรทัดไหนเป็นเลข ไม่มีบรรทัดไหนเป็นของคนเดินหน้า แล้วเขาจึงกลับมาหน้าที่มีชื่อออสริค จุ่มปากกาสองครั้ง เขียนชื่อ{name} ลายมือเขาที่ปกติเรียบเหมือนไม้บรรทัด บรรทัดนี้เอียงขึ้นทางขวา

        เช้าวันต่อมามีคนเอาถ่านเขียนคำหนึ่งไว้บนประตูห้องที่{name}นอน คำที่คนตามถนนใช้เรียกคนมีเขา สิบเก้าเอาผ้าชุบน้ำมันมาเช็ดออกก่อนใครจะตื่น นางไม่บอกว่าใครเขียน
      effects:
        org: { id: wick, promote: true }
        mark: ขึ้นเป็นผู้จุด
        items: [wick_black_lamp]
        stats: { CHA: 1 }
        flags: [first_walker_to_hold_the_black_lamp]
    - id: sibkao_trims_the_wick
      label: ยื่นตะเกียงให้สิบเก้าตัดไส้ให้ก่อนจุดครั้งแรก
      requires: { trait: curse_brand }
      text: |
        สิบเก้ารับตะเกียงไปโดยไม่พูด หยิบกรรไกรเล็กจากย่าม ตัดปลายไส้ให้เสมอ เป่าผงดำที่ติดใบกรรไกรทิ้ง แล้วส่งคืน นางบอกว่าต่อจากนี้ศาสนจักรจะถามว่าทำไมคนเดินหน้าที่เหลือยังต้องเดินหน้า ใครจะตอบก็ตอบไป ส่วนนางจะเดินหน้าตะเกียงดวงนี้เหมือนดวงอื่น

        คืนแรกที่จุด สิบเก้าเดินนำอยู่ข้างหน้าในระยะที่แสงแดงคล้ำส่องไม่ถึงพอดี ไม่ใกล้กว่าคืนอื่น ไม่ไกลกว่า
      effects:
        org: { id: wick, promote: true }
        mark: ขึ้นเป็นผู้จุด
        items: [wick_black_lamp]
        stats: { WIS: 1 }
        flags: [sibkao_trimmed_the_first_wick]

- id: adult.wick_rise_ash_measure
  stage: adult
  weight: 60
  must: true
  when:
    age: [19, 80]
    org: { id: wick, min_rank: 3, max_rank: 3, ready: true }
  text: |
    ไซเวลมาหา{name}ที่ห้องถังใต้โรงน้ำมันตอนบ่าย เวลาที่ไม่มีงาน นางวางของสามอย่างบนฝาถังที่ตีตราชอล์ก กล่องดีบุกใบเท่าฝ่ามือ ช้อนกระดูกด้ามยาวที่ปลายช้อนสึกจนบาง กับแถบผ้าว่างหนึ่งม้วน แล้วนั่งลงบนบันไดขั้นล่างสุด

    นางสอนโดยไม่อธิบาย เปิดกล่อง ตักเถ้าสีเทาอ่อนที่ละเอียดกว่าแป้ง ปาดช้อนกับขอบกล่องให้เสมอ โรยลงถังน้ำมัน ผู้ใหญ่หนึ่งคนหนึ่งช้อน เด็กครึ่งช้อน คนแก่ครึ่งช้อน คนที่ต้องลืมมากกว่าหนึ่งคืน นางหยุดตรงนั้น แล้วบอกว่าเรื่องนั้นไม่มีขนาด ผู้ดับตัดสินเอง ผู้ดับทั้งอาณาจักรมีเจ็ดคน ที่นั่งหนึ่งในเจ็ดว่างลงเมื่อต้นเดือน

    นางยื่นช้อนกระดูกมาทางด้าม ข้อมือซ้ายของนางมีแถบผ้าพันหนาจนแขนเสื้อปิดไม่มิด
  choices:
    - id: measure_one_spoon
      label: รับช้อน ตักเถ้าลงถังหนึ่งช้อนให้นางดู
      text: |
        ไซเวลดูช้อนแรกแล้วบอกว่าปาดหนาไปเท่าเส้นผม ช้อนที่สองบางไปเท่าเส้นผม ช้อนที่สามนางไม่ว่าอะไร {name}ตักต่ออีกเก้าช้อนโดยไม่ต้องมีใครดู มือเริ่มรู้น้ำหนักของเถ้าก่อนตาจะเห็น

        ช้อนกระดูกคันนั้นกลับไปอยู่ในกระเป๋าเสื้อของไซเวล นางบอกว่าผู้ดับทุกคนต้องหาช้อนของตัวเอง สัปดาห์ต่อมา{name}ได้ช้อนมาจากร้านขายของเก่า ด้ามเป็นกระดูกเหมือนกัน ไม่รู้ว่าของใครมาก่อน
      effects:
        org: { id: wick, promote: true }
        mark: ขึ้นเป็นผู้ดับ
        stats: { INT: 1 }
        flags: [learned_the_ash_measure]
    - id: ask_saiwels_first_name
      label: ถามไซเวลว่าก่อนหน่วยตั้งชื่อนี้ให้ นางชื่ออะไร
      text: |
        ไซเวลแกะแถบผ้าออกจากข้อมือทีละเส้น วางเรียงบนฝาถังจนถึงเส้นในสุด เส้นนั้นเก่าจนผ้าบางเป็นใยแมงมุม บนนั้นเขียนว่า ชื่อของเจ้าคือไซเวล ลายมือไม่ใช่ของนาง และไม่มีอะไรเขียนต่อจากนั้น

        นางพันทุกเส้นกลับเข้าข้อมือตามลำดับเดิมไม่ผิดสักเส้น ระหว่างพัน นางบอกว่าคนที่เขียนเส้นนั้นคงเป็นผู้ดับคนก่อนนาง นางจำหน้าไม่ได้ จำได้แต่ว่ามือเย็น
      effects:
        org: { id: wick, promote: true }
        mark: ขึ้นเป็นผู้ดับ
        stats: { WIS: 1 }
        flags: [read_saiwels_innermost_strip]
    - id: begin_own_strips
      label: ขอแถบผ้าว่างม้วนนั้นมาพันข้อมือตัวเอง
      text: |
        ไซเวลตัดแถบแรกให้ยาวพอพันข้อมือสามรอบ ยื่นดินสอไขมันให้ บอกว่าเส้นแรกให้เขียนชื่อตัวเอง เส้นที่สองให้เขียนงานของพรุ่งนี้ ที่เหลือเขียนอะไรก็ได้ที่กลัวว่าจะไม่อยู่ในหัวตอนตื่น

        {name}เขียนชื่อตัวเองลงเส้นแรก ตัวโตกว่าที่ต้องเขียน แล้วพันไว้ในสุด ชิดผิว
      effects:
        org: { id: wick, promote: true }
        mark: ขึ้นเป็นผู้ดับ
        alignment: { law: 1 }
        flags: [began_own_cloth_strips]
    - id: ask_who_kept_the_count
      label: ถามไซเวลว่าเคยมีผู้ดับคนไหนนับบ้านที่ตัวเองโรยเถ้าไหม
      requires: { flag: swore_to_keep_the_count }
      text: |
        ไซเวลบอกว่ามี คนหนึ่ง นับได้เยอะกว่าใคร จดไว้ในสมุดเล่มหนึ่งทุกบ้าน ทุกคืน นางจำได้ว่าสมุดเล่มนั้นปกสีเขียว จำไม่ได้ว่าผู้ดับคนนั้นเป็นใคร และไม่รู้ว่าสมุดไปอยู่ที่ไหน

        {name}ท่องบัญชีของตัวเองให้นางฟังตั้งแต่บ้านแรก ห้าคน หนึ่งคืน รูบนหลังคาเท่าบานหน้าต่าง ไล่มาจนถึงบ้านล่าสุด ไซเวลฟังจนจบ แล้วขอให้ท่องบ้านแรกซ้ำอีกครั้ง
      effects:
        org: { id: wick, promote: true }
        mark: ขึ้นเป็นผู้ดับ
        stats: { INT: 1 }
        flags: [asked_who_kept_the_count]

- id: adult.wick_passed_over
  stage: adult
  weight: 30
  when:
    age: [24, 64]
    org: { id: wick, max_rank: 3, min_refused: 3 }
  text: |
    ทอร์เบนไม่จดเรื่องปัดงานลงสมุด เขาผูกปม ข้างประตูห้องเก็บถังมีตะปูเรียงหนึ่งแถว ตะปูละคนในชุด แขวนเชือกป่านไว้ตะปูละเส้น ใครปัดงานหนึ่งครั้ง เชือกของคนนั้นได้ปมเพิ่มหนึ่งปม ไม่มีใครเคยเห็นทอร์เบนแก้ปมสักปม เชือกของ{name}ห้อยต่ำกว่าเส้นอื่นเพราะน้ำหนักของปม

    เช้านี้คนในชุดที่มาทีหลัง{name}ได้ของชิ้นถัดไปใส่มือ ไม่มีพิธี คนยื่นให้ยื่นระหว่างเดินเข้าลาน เหมือนยื่นขนมปัง ของในมือ{name}ยังเป็นชิ้นเดิม คนในหน่วยเรียกคนที่ถือของชิ้นเดิมไปจนแก่ว่าคนถือถัง ไม่ว่าในมือจะถืออะไรอยู่
  choices:
    - id: walk_past_the_cord
      label: เดินผ่านแถวตะปูไปทำงานต่อ ไม่หันไปดูเชือก
      text: |
        {name}เดินผ่านไปห้องเก็บถัง ทำงานเก็บกวาดของเมื่อคืนจนเที่ยง ขัดคราบเขม่าออกจากโป๊ะตะเกียงสิบสองดวง ล้างผ้าชุบน้ำมันจนน้ำในกะละมังดำ

        ตอนเดินกลับออกมา เชือกของ{name}ไกวเบาๆ ตามลมที่ประตู ปมล่างสุดแตะผนังเป็นจังหวะ เหมือนนิ้วเคาะโต๊ะรอใครสักคน
      effects: { stats: { CON: 1 }, flags: [walked_past_the_knotted_cord] }
    - id: ask_torben_to_untie
      label: ขอทอร์เบนแก้ปมให้สักปม
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          ทอร์เบนบอกว่าปมไม่มีใครแก้ แต่เชือกต่อได้ เขาตัดเชือกป่านเส้นใหม่ยาวหนึ่งศอก ผูกต่อจากปลายบนของเชือก{name} แล้วแขวนกลับขึ้นตะปูให้ปลายล่างห้อยเสมอเส้นอื่น ปมยังอยู่ครบทุกปม แค่ไม่มีใครเห็นแล้วว่าห้อยต่ำ

          เขาบอกว่าเชือกที่ต่อแล้วต่อได้ครั้งเดียว
        effects: { stats: { CHA: 1 }, flags: [torben_lengthened_my_cord] }
      failure:
        text: |
          ทอร์เบนไม่ตอบ เขาเอาเชือกของ{name}ลงจากตะปู ยื่นให้ถือ น้ำหนักของมันเท่ากำมือข้าวสาร แล้วเขาก็แขวนกลับที่เดิม

          คืนนั้น{name}เลี้ยงเหล้าคนในชุดทั้งโต๊ะเพื่อให้ไม่มีใครพูดเรื่องเชือก ไม่มีใครพูดจริงๆ
        effects: { gold: -2, flags: [torben_kept_the_knots] }
    - id: swear_off_passing
      label: บอกไซเวลว่างานหน้าไม่ว่าอะไรจะรับ
      text: |
        ไซเวลดึงแถบผ้าเส้นใหม่ เขียนชื่อ{name}กับคำว่ารับ แล้วพันเข้าข้อมือ นางบอกว่านางจะจำได้ไม่นาน แต่แถบผ้าจำได้นานกว่า

        ตั้งแต่นั้น ทุกครั้งที่ไซเวลแกะแถบผ้าออกมาอ่านงานของคืนไหน แถบเส้นนั้นโผล่ออกมาให้เห็นด้วยทุกครั้ง
      effects: { alignment: { law: 1 }, flags: [swore_off_passing_duties] }
    - id: count_sibkaos_knots
      label: ถามสิบเก้าว่าเชือกของนางมีกี่ปม
      requires: { trait: curse_brand }
      text: |
        สิบเก้าชี้ตะปูตัวสุดท้ายในแถว ไม่มีเชือกแขวน นางบอกว่าคนเดินหน้าไม่มีเชือก เพราะคนเดินหน้าที่ปัดงานไม่ได้กลับมานั่งในโรงน้ำมัน กลับไปยืนที่เสา คนในชุดจึงไม่ต้องนับ

        {name}มองไปที่เชือกของตัวเองที่ห้อยต่ำกว่าเส้นอื่น ปมทุกปมบนนั้นเป็นของคนที่ทอร์เบนเชื่อว่าจะยังกลับมา
      effects: { stats: { WIS: 1 }, flags: [sibkao_has_no_cord] }

# ---------- ความลับ ----------
- id: adult.wick_secret_numbers
  stage: adult
  weight: 28
  time: night
  when:
    age: [20, 64]
    org: { id: wick, min_rank: 2 }
  text: |
    สิ้นเดือน ทอร์เบนนับตะเกียงดำครบสี่สิบเก้าดวงในสมุดปกเหล็กแล้ว ยังเหลืออีกเล่มที่ต้องนับ เล่มเล็กที่ห้อยเชือกไว้ข้างเอวเขาตลอดเวลา คืนนี้ตาเขาไม่ดี ตะเกียงในห้องก็สว่างไม่พอ เขาจึงยื่นเล่มเล็กให้{name}อ่านออกเสียง ส่วนตัวเขาจดตาม

    ในเล่มไม่มีชื่อสักชื่อ มีแต่เลข หนึ่งเลขหนึ่งบรรทัด ต่อด้วยชื่อถิ่นที่จับได้ วันที่ แล้วคำสั้นๆ คำเดียว ยังเดิน กลับเสา หรือไม่กลับมา บรรทัดส่วนมากเป็นคำสุดท้าย หัวกระดาษแต่ละหน้าเป็นชื่อชุด ชุดของ{name}มีหน้าของตัวเอง เลขเรียงลงมาตั้งแต่หนึ่ง บรรทัดที่สิบเก้าเขียนว่ายังเดิน

    ทอร์เบนรอให้อ่านต่อ ปากกาค้างอยู่เหนือกระดาษ
  choices:
    - id: read_on_without_asking
      label: อ่านต่อจนจบเล่ม ไม่ถามอะไร
      text: |
        {name}อ่านจนจบเล่ม ออกเสียงเลขทุกเลข ชื่อถิ่นทุกชื่อ คำสุดท้ายทุกคำ ทอร์เบนจดตามจนนิ้วเปื้อนหมึก แล้วรวมยอดท้ายหน้า ยังเดินทั้งอาณาจักรมีไม่ถึงสองหน้ากระดาษ

        เขาเอาเล่มเล็กกลับไปห้อยเอว ขอบใจหนึ่งคำ แล้วรินน้ำมันจากกระบวยลงตะเกียงในห้องจนเต็ม ให้{name}มีแสงพอเดินกลับ
      effects: { org: { id: wick, merit: 1 }, alignment: { law: 1 }, flags: [read_the_walkers_book_aloud] }
    - id: ask_sibkao_her_mothers_name
      label: ไปถามสิบเก้าว่าแม่ตั้งชื่อนางว่าอะไร
      text: |
        สิบเก้านั่งซ่อมรองเท้าพื้นนุ่มอยู่ใต้บันได นางไม่ถามว่าทำไม{name}ถาม นางบอกชื่อ เซธริน ออกเสียงช้า เหมือนหยิบของที่ไม่ได้หยิบมานานจนต้องปัดฝุ่นก่อน แม่ตั้งให้ตอนหน้าหนาวที่เถ้าตกหนักที่สุดในแดนเถ้า

        นางบอกว่าเรียกได้ แต่อย่าเรียกต่อหน้าทอร์เบน เขาจะต้องคิดว่าจะเขียนลงช่องไหน แล้วเขาไม่ชอบคิดเรื่องที่ไม่มีช่อง
      effects: { stats: { WIS: 1 }, flags: [asked_sibkao_her_mothers_name] }
    - id: write_the_names_in
      label: ขอดินสอจากทอร์เบน เขียนชื่อที่รู้ลงข้างเลข
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          ทอร์เบนไม่ยอมให้ใช้ปากกา เขายื่นดินสอไขมันให้แทน บอกว่าเขียนได้ แต่ต้องลบได้ {name}เขียนชื่อที่รู้ได้สามชื่อ ตัวเล็กเท่ามด ข้างเลขของชุดตัวเองสามบรรทัด บรรทัดที่สิบเก้าเว้นไว้ เพราะยังไม่ได้ถามเจ้าของ

          สามเดือนต่อมา{name}เปิดดู ชื่อทั้งสามยังอยู่ ไม่มีใครลบ
        effects: { stats: { CHA: 1 }, flags: [wrote_names_in_the_walkers_book] }
      failure:
        text: |
          ทอร์เบนดึงเล่มเล็กกลับไปก่อน{name}จะเขียนจบชื่อแรก ฉีกหน้านั้นออก แล้วนั่งคัดใหม่ทั้งหน้าจนเกือบสาง ลายมือเรียบเหมือนไม้บรรทัด ไม่มีอะไรเกินมาจากเดิม

          เดือนนั้นเขาหักค่ากระดาษจากค่าจ้างของ{name}หนึ่งเหรียญ จดไว้ในสมุดค่าใช้จ่ายว่าหน้าเปื้อน
        effects: { gold: -1, flags: [torben_recopied_the_walkers_page] }
    - id: find_my_own_number
      label: หาบรรทัดของตัวเองในหน้าของชุด
      requires: { trait: curse_brand }
      text: |
        บรรทัดของ{name}อยู่ลงไปจากบรรทัดที่สิบเก้าไม่ไกล มีเลข ชื่อถิ่น วันที่ และคำว่ายังเดิน เหมือนบรรทัดอื่นทุกอย่าง ไม่มีอะไรบอกว่าตั้งแต่วันที่เขียน{name}ทำอะไรมาบ้าง บรรทัดนี้ไม่เคยเปลี่ยน

        {name}ขอให้ทอร์เบนเขียนชื่อไว้ข้างเลข ทอร์เบนบอกว่าไม่มีช่อง แล้วพลิกไปเขียนไว้ด้านในปกหลังแทน ตัวเล็กที่สุดที่ปลายปากกาเหล็กทำได้ ด้านในปกหลังไม่มีชื่ออื่นอยู่ก่อน
      effects: { flags: [my_name_inside_the_walkers_book] }

- id: adult.wick_secret_tin_boxes
  stage: adult
  weight: 26
  time: day
  when:
    age: [20, 64]
    org: { id: wick, min_rank: 2 }
  text: |
    เกวียนที่มาส่งเถ้าทุกต้นฤดูไม่ใช่เกวียนของศาสนจักร เป็นเกวียนของภาคีผู้เฝ้าผนึก ล้อหุ้มเหล็ก ผ้าใบสีเทา คนขับรอบนี้เป็นผู้เฝ้าหนุ่มที่เพิ่งได้เวรเกวียนเป็นครั้งแรก ลงจากเกวียนมาช่วยยกของด้วยความเกรงใจคนของวิหาร

    ของบนเกวียนเป็นกล่องดีบุกใบเท่าฝ่ามือ ฝาบัดกรีปิด เรียงอยู่ในลังไม้สามลัง ฝากล่องทุกใบขูดคำเดียวกันด้วยปลายตะปู เถ้าสำหรับพิธีส่ง ผู้เฝ้าหนุ่มยกลังด้วยสองมือ ระวังกว่ายกถังน้ำมัน เขาเล่าว่าป้อมของเขาเก็บเถ้าจากโคนตอเสาได้ปีละไม่กี่ลัง นักบวชประจำป้อมสวดให้ทุกกล่องก่อนบัดกรี ทั้งป้อมภูมิใจที่ได้ส่งเถ้าของอัสเทลมาให้คนตายทางนี้ใช้ส่งวิญญาณ

    ทอร์เบนยืนอยู่ที่ประตูห้องถัง ตาชั่งเล็กที่ใช้ตวงเถ้าอยู่ในมือ เขาไม่ได้บอกให้ใครหยุดยก
  choices:
    - id: carry_the_boxes_down
      label: ช่วยผู้เฝ้าหนุ่มยกลังลงห้องถัง ไม่พูดเรื่องอื่น
      text: |
        ผู้เฝ้าหนุ่มถามระหว่างลงบันไดว่าพิธีส่งทำกันที่วิหารไหน {name}ตอบชื่อวิหารเวรัสที่ใกล้ที่สุดไป เขาจำชื่อนั้นไว้ บอกว่าจะเล่าให้นักบวชประจำป้อมฟัง ทอร์เบนรินชาร้อนให้หนึ่งถ้วยก่อนเกวียนออก

        ลังสามลังวางเรียงอยู่ข้างถังที่ตีตราชอล์ก คืนนั้นไซเวลเปิดกล่องแรก ปาดเถ้าด้วยช้อนกระดูก คำที่ขูดไว้บนฝาหันขึ้นเพดาน
      effects: { org: { id: wick, merit: 1 }, flags: [carried_the_wardens_ash_down] }
    - id: ask_what_the_priest_prayed
      label: ถามผู้เฝ้าหนุ่มว่านักบวชประจำป้อมสวดอะไรให้กล่อง
      text: |
        ผู้เฝ้าหนุ่มท่องให้ฟังได้ทั้งบท สั้นแค่สามบรรทัด เขาได้ยินทุกเย็นที่บัดกรีกล่อง บทนั้นขอให้คนที่ได้เถ้านี้ไปจำทางกลับบ้านได้ ขอให้คนที่ยังอยู่จำชื่อเขาได้ ขอให้ไม่มีใครลืมใคร

        เขาท่องจบแล้วยิ้มอย่างคนที่ทำงานเสร็จ คืนนั้นตอนไซเวลปาดเถ้าจากกล่องแรก {name}ท่องบทนั้นอยู่ในใจจนนางปิดฝาถัง
      effects: { stats: { WIS: 1 }, flags: [heard_the_fort_prayer_for_the_ash] }
    - id: keep_back_one_box
      label: แอบเก็บกล่องไว้หนึ่งใบ ไม่ให้ลงถัง
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          {name}ซ่อนกล่องใบหนึ่งไว้ในแขนเสื้อระหว่างส่งลังต่อจากมือผู้เฝ้าหนุ่ม ทอร์เบนนับกล่องในลังได้ขาดหนึ่ง เขานับซ้ำอีกครั้ง แล้วจดว่าป้อมส่งมาขาด

          วันหยุดถัดมา{name}เดินจนพ้นหลังคาบ้านหลังสุดท้าย ไปถึงทุ่งร้าง ขุดหลุมเท่ากำปั้นใต้ต้นไม้ต้นเดียวในทุ่ง ฝังลงไปทั้งกล่อง ไม่ได้แกะฝา แล้วท่องบทสวดของป้อมที่ไม่รู้ว่าตรงบทหรือเปล่า
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [buried_a_box_of_stump_ash] }
      failure:
        text: |
          กล่องหลุดจากแขนเสื้อตกกระทบขั้นบันไดดังกริ๊ง ผู้เฝ้าหนุ่มก้มลงเก็บให้ ปัดฝุ่นที่ฝา แล้ววางคืนในลังอย่างระวัง ขอบคุณ{name}ที่ช่วยถือ

          ทอร์เบนนับกล่องครบ จดลงสมุด แล้วจดอีกบรรทัดลงสมุดอีกเล่มที่ไม่ได้เปิดให้ใครดู
        effects: { reputation: { lamp_church: -1 }, flags: [dropped_a_box_of_stump_ash] }
    - id: know_the_hand_on_the_manifest
      label: อ่านใบส่งของที่ผู้เฝ้าหนุ่มยื่นให้ทอร์เบนเซ็น
      requires: { flag: left_the_fort }
      text: |
        ลายมือบนใบส่งของเป็นลายมือที่{name}เคยเห็นทุกต้นเดือนตอนยังอยู่กับภาคี ลายมือแน่นจนแทบไม่เหลือขอบ คนเขียนเป็นคนที่นับทุกอย่างของป้อม นับน้ำมัน นับหัวหอก นับคน บรรทัดสุดท้ายของใบเขียนว่า ขอให้ใช้ให้ครบ ไม่เหลือทิ้ง

        ทอร์เบนเซ็นรับ ผู้เฝ้าหนุ่มพับใบส่งของใส่อกเสื้อ{name}ยืนอยู่หลังทอร์เบนตลอดเวลาที่เกวียนจอด ไม่ได้ออกไปให้ผู้เฝ้าหนุ่มเห็นหน้าเต็มตา
      effects: { flags: [knew_the_hand_on_the_ash_manifest] }

- id: adult.wick_secret_wrong_burning
  stage: adult
  weight: 26
  time: night
  when:
    age: [24, 64]
    org: { id: wick, min_rank: 3 }
  text: |
    ไซเวลกางแถบผ้าเส้นใหม่บนโต๊ะ ไม่ได้พันเข้าข้อมือ เส้นนี้ไม่ได้มาจากงานของชุด มาจากวิหารใหญ่ ปลายแถบมีตราตะเกียงประทับ ลายมือเสมียนเรียบร้อยกว่าลายมือนางมาก บนนั้นเขียนชื่อหมู่บ้านหนึ่งห่างออกไปสองวัน ทั้งหมู่บ้าน ทุกหลังคาเรือน

    {name}อ่านจนจบจึงรู้ว่าทำไมเรื่องนี้ไม่มีอะไรตกลงมาจากฟ้า เมื่อเดือนก่อน นักล่าแม่มดของศาสนจักรเผาหญิงทอผ้าคนหนึ่งที่เสาหน้าวิหารของหมู่บ้านนั้น สัปดาห์ต่อมาคนที่ส่งใบแจ้งไปสารภาพกับนักบวชประจำหมู่บ้าน ว่าแต่งเรื่องขึ้นเพราะทะเลาะกันเรื่องเขตนา ทั้งหมู่บ้านรู้แล้ว ทั้งหมู่บ้านเลิกไปวิหาร

    ผู้จุดเป็นคนจุดน้ำมัน เกวียนออกตอนตะวันตก ถังตีตราชอล์กสามถังอยู่ท้ายเกวียน
  choices:
    - id: light_every_house
      label: จุดน้ำมันทุกหลังตามแถบผ้า
      text: |
        สามคืน ทุกหลังคาเรือน {name}นั่งอยู่ในควันกับทุกบ้านจนครบ ตามกติกาของคนจุด คืนที่สามไข้ขึ้นจนมือสั่น จำไม่ได้แน่ว่าบ้านไหนจุดแล้ว ไซเวลต้องอ่านแถบผ้าให้ฟังทีละบ้าน

        เดือนต่อมาเกวียนน้ำมันผ่านหมู่บ้านนั้นตามรอบ คนในหมู่บ้านกลับไปวิหารกันแล้ว ในบ้านหลังหนึ่งมีกี่ทอผ้าตั้งอยู่ ผ้าค้างครึ่งผืน ลูกชายของบ้านถามแม่ค้าที่มาซื้อไข่ว่ากี่หลังนี้เป็นของใคร
      effects: { org: { id: wick, merit: 2 }, alignment: { law: 1, moral: -1 }, flags: [made_a_village_forget_a_burning] }
    - id: leave_one_house_dark
      label: จุดทุกหลัง แต่เว้นบ้านของลูกชายหญิงทอผ้าไว้หนึ่งหลัง
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          {name}จุดตะเกียงในบ้านหลังนั้นจริง แต่เทน้ำมันจากถังธรรมดา ไม่ใช่ถังตีตราชอล์ก ไซเวลนับบ้านบนแถบผ้าครบทุกหลัง ไม่ได้ดมกลิ่น

          ทั้งหมู่บ้านตื่นขึ้นมาพร้อมไข้ ยกเว้นคนเดียว ลูกชายหญิงทอผ้ายืนอยู่หน้าวิหารตอนสาย ดูคนในหมู่บ้านเดินเข้าไปสวดกันเหมือนไม่เคยมีอะไรเกิดขึ้น เขาไม่ได้เข้าไป และไม่ได้บอกใคร
        effects: { stats: { DEX: 1 }, alignment: { moral: 1 }, flags: [left_the_weavers_son_remembering] }
      failure:
        text: |
          ไซเวลดมกลิ่นจากปากตะเกียงบ้านหลังนั้นก่อนจะนั่งลง แล้วเทน้ำมันทิ้งลงดินหน้าบ้าน เติมใหม่จากถังตีตราชอล์กด้วยมือของนางเอง นางไม่ว่าอะไร{name}

          คืนนั้น{name}นั่งในควันซ้ำสองหน คืนที่ต้องนั่งอยู่แล้วกับคืนของบ้านหลังนั้น ตื่นมาไข้สูงจนต้องนอนบนเกวียนตลอดทางกลับ
        effects: { hp: -2, flags: [saiwel_relit_the_weavers_house] }
    - id: refuse_the_temples_strip
      label: เขียนในรายงานว่าหมู่บ้านนี้ไม่มีอะไรจากฟ้า แล้วไม่จุด
      text: |
        ไซเวลอ่านรายงานบรรทัดเดียวของ{name} แล้วพับเก็บไว้ในแขนเสื้อ ไม่ได้ฉีก คืนถัดมานางพาสิบเก้ากับไส้อีกคนในชุดไปที่หมู่บ้านนั้นเอง ไม่มี{name}ไปด้วย

        ทั้งหมู่บ้านลืมภายในสามคืนเหมือนที่แถบผ้าสั่ง ไซเวลกลับมาพร้อมไข้หนักกว่าที่เคยเห็น นอนอยู่สองวัน ตื่นมาถามว่าทำไมข้อมือนางมีแถบผ้าเส้นหนึ่งที่ไม่มีอะไรเขียน
      effects: { alignment: { moral: 1 }, reputation: { lamp_church: -1 }, flags: [refused_the_temples_forgetting] }
    - id: keep_the_weavers_name
      label: ถามชื่อหญิงทอผ้า แล้วท่องเพิ่มลงในบัญชีของตัวเองก่อนจุด
      requires: { flag: swore_to_keep_the_count }
      text: |
        ชื่อนางเขียนอยู่ท้ายแถบผ้าของวิหารใหญ่ ในวงเล็บ ตัวเล็กกว่าชื่อหมู่บ้าน เสมียนเขียนไว้เพื่อให้รู้ว่าเรื่องที่ต้องลืมคือเรื่องของใคร {name}ท่องชื่อนั้นต่อท้ายบัญชีที่ท่องมาตั้งแต่บ้านแรก ก่อนลงจากเกวียน

        แล้ว{name}ก็จุดน้ำมันทุกหลังตามแถบผ้า นั่งในควันกับทุกบ้านจนครบ ตื่นมาพร้อมไข้ จำหมู่บ้านไม่ได้ แต่ชื่อนั้นยังอยู่ท้ายบัญชี ตรงที่ท่องไว้
      effects: { org: { id: wick, merit: 1 }, stats: { WIS: 1 }, flags: [kept_the_weavers_name] }

- id: adult.wick_secret_cloth_strip
  stage: adult
  weight: 25
  when:
    age: [24, 64]
    org: { id: wick, min_rank: 3 }
  text: |
    แถบผ้าเส้นนั้นหล่นออกมาจากซับในย่ามใบเก่าที่{name}กำลังจะทิ้ง ม้วนแน่นเท่านิ้วก้อย น้ำมันซึมจนผ้าเป็นสีชา ลายมือบนนั้นเป็นของ{name}เอง ไม่ต้องเดา ตัวอักษรเอียงซ้ายแบบที่{name}เขียนเวลารีบ

    เขียนว่า โรงกลั่นริมคลองระบาย ห้องนอนคนงานชั้นสอง เด็กคนที่สาม ถามแม่ว่าไปไหน อย่าเชื่อคำตอบ

    {name}ไม่รู้จักโรงกลั่นริมคลองระบาย ไม่รู้ว่าเด็กคนที่หนึ่งกับคนที่สองคือใคร ไม่รู้ว่าเขียนเมื่อไร ทั้งชุดมีคนเดียวที่จดเรื่องลงแถบผ้า และคนนั้นไม่ใช่{name}
  choices:
    - id: go_and_ask
      label: ตามไปหาโรงกลั่นริมคลองระบาย
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          ห้องนอนคนงานชั้นสองมีครอบครัวเดียว แม่ตักข้าวเย็นใส่ชามสามใบทุกเย็น ลูกสองคนกินสองชาม ชามที่สามนางเทกลับลงหม้อก่อนนอน {name}ถามว่าชามที่สามของใคร นางตอบว่าตักเผื่อ ตั้งแต่จำความได้ก็ตักเผื่อแบบนี้ แม่ของนางก็ตัก

          ตรงขอบประตูห้องมีรอยตะปูเล็กๆ สามรอย ระดับความสูงไม่เท่ากัน เหมือนรอยที่พ่อแม่ขีดวัดความสูงลูก รอยที่สามอยู่ต่ำที่สุด ไม่มีใครในห้องจำได้ว่าใครขีด
        effects: { stats: { WIS: 1 }, flags: [followed_my_own_strip] }
      failure:
        text: |
          ริมคลองระบายมีโรงกลั่นสองโรง ทั้งสองโรงบอกว่าไม่เคยมีห้องนอนคนงานชั้นสอง คนเฝ้าประตูโรงหนึ่งรับเหรียญไปสองเหรียญ แล้วพาเดินดูทุกห้องที่มี ไม่มีห้องไหนมีเด็ก

          ขากลับ{name}ผ่านกองไม้เก่ากองหนึ่งข้างคลอง ไม้บันไดหักครึ่งพาดอยู่บนสุด ทาสีเดียวกับโรงกลั่นโรงที่สอง ไม่มีใครบอกได้ว่ามาจากตึกไหน
        effects: { gold: -2, flags: [found_nothing_at_the_drain_canal] }
    - id: burn_my_own_strip
      label: เผาแถบผ้าในเตาโรงน้ำมัน
      text: |
        แถบผ้าชุ่มน้ำมันติดไฟเร็ว ไหม้หมดในอึดใจเดียว ตัวอักษรเอียงซ้ายดำลงก่อนผ้ารอบๆ ตัวอักษรตัวสุดท้ายที่ไหม้คือคำว่าอย่า

        {name}ปิดฝาเตาแล้วกลับไปทำงาน ทอร์เบนที่ยืนตวงน้ำมันอยู่อีกฝั่งห้องไม่ได้หันมา แต่ตลอดบ่ายนั้นเขาฮัมเพลงที่ไม่มีใครในชุดเคยได้ยินเขาฮัม
      effects: { org: { id: wick, merit: 1 }, flags: [burned_my_own_strip] }
    - id: show_saiwel_the_strip
      label: เอาแถบผ้าไปให้ไซเวลดู
      text: |
        ไซเวลอ่านแล้วแกะแถบผ้าออกจากข้อมือตัวเองทีละเส้น จนเจอเส้นหนึ่งที่เขียนคำเดียวกันทุกคำ โรงกลั่นริมคลองระบาย ห้องนอนคนงานชั้นสอง เด็กคนที่สาม ลายมือของนางเอง

        ทั้งสองคนวางแถบผ้าคู่กันบนโต๊ะ ไม่มีใครจำได้ว่าเขียนในคืนเดียวกันหรือคนละคืน ไม่มีใครจำได้ว่าคืนนั้นใครจุดน้ำมัน ไซเวลพันเส้นของนางกลับเข้าข้อมือ แล้วยื่นมือมาขอเส้นของ{name}ไปพันด้วย
      effects: { flags: [saiwel_had_the_same_strip] }
    - id: search_my_count
      label: ท่องบัญชีที่ท่องมาตั้งแต่บ้านแรก หาคืนที่ขาดไป
      requires: { flag: swore_to_keep_the_count }
      text: |
        {name}ท่องบัญชีทีละบ้านช้าๆ ตั้งแต่บ้านแรก ห้าคน หนึ่งคืน รูบนหลังคาเท่าบานหน้าต่าง ไล่ลงมาจนถึงบ้านล่าสุด ไม่มีโรงกลั่นริมคลองระบายอยู่ในนั้น แต่ระหว่างบ้านช่างทำถังกับบ้านถัดไป มีช่องว่างที่ท่องข้ามมาทุกครั้งโดยไม่เคยสังเกต จังหวะของบัญชีสะดุดตรงนั้นทุกรอบ

        คืนนั้น{name}ท่องบัญชีเพิ่มหนึ่งบรรทัดตรงช่องว่างนั้น ไม่รู้ว่าเป็นบ้านไหน ท่องว่า ไม่รู้
      effects: { stats: { INT: 1 }, flags: [found_a_gap_in_my_count] }

# ---------- ตามล่า รัก และทางออก ----------
- id: adult.wick_hunt_white_gloves
  stage: adult
  weight: 15
  time: night
  hunt: star_listeners
  when:
    age: [20, 64]
    org: wick
    not_orgs: [star_listeners]
  text: |
    ห้องที่{name}เช่านอนคืนนั้นมีคนเข้ามานั่งรอ ไม่ได้งัดประตู ไม่ได้ปีนหน้าต่าง กุญแจห้องวางอยู่บนโต๊ะข้างตะเกียงที่จุดไว้ให้แล้ว ไส้ตัดเรียบร้อยกว่าที่{name}เคยตัดเอง ชายคนนั้นนั่งบนเก้าอี้ตัวเดียวในห้อง สวมถุงมือหนังสีขาว ผมหวีเรียบ ตัวมีกลิ่นห้องสมุดที่เพิ่งปัดฝุ่น

    เขาไม่ลุก เขาพูดเสียงเบาจนต้องเงี่ยหูฟัง ว่ารู้ว่า{name}ทำงานอะไร รู้ว่าเกวียนน้ำมันไปที่ไหนเมื่อคืนก่อน รู้ด้วยว่าบ้านหลังนั้นตื่นมาเป็นไข้กี่คน เขาไม่ได้มาขู่ เขามาซื้อ ของที่เขาอยากได้มีอย่างเดียว ทางที่หีบตะกั่วเดินต่อไปหลังพ้นมือชุดของ{name} ราคาแล้วแต่จะเรียก

    บนโต๊ะมีการ์ดกระดาษหนาวางอยู่ใบหนึ่ง หมึกสีน้ำเงิน มุมกระดาษมีดาวเจ็ดแฉกเล็กเท่าเมล็ดงา
  choices:
    - id: take_the_card_to_the_cell
      label: ไม่ตอบ เก็บการ์ดไว้ให้คนในชุดดูตอนเช้า
      text: |
        ชายในถุงมือขาวรอคำตอบจนตะเกียงไหม้ไปหนึ่งข้อนิ้ว แล้วลุกขึ้นจัดเก้าอี้ให้เข้าที่ ออกไปโดยปิดประตูเบากว่าตอนเปิด การ์ดยังอยู่บนโต๊ะ

        เช้านั้นออสริคอ่านการ์ดแล้วยื่นต่อให้ไซเวล ไซเวลพันการ์ดไว้ในแถบผ้าเส้นใหม่ คืนนั้นทั้งชุดย้ายที่นอน {name}ขนของทั้งหมดที่มีได้ในย่ามใบเดียว
      effects: { reputation: { lamp_church: 1 }, flags: [brought_the_blue_card_to_the_cell] }
    - id: throw_him_out
      label: ลากเขาออกจากเก้าอี้ แล้วโยนออกประตู
      check: { stat: STR, dc: 13 }
      success:
        text: |
          เขาไม่ขัดขืน ตัวเบากว่าที่เห็น {name}ลากเขาลงบันไดไปทั้งตัว จนพ้นประตูหน้าตึก เขาลุกขึ้นปัดฝุ่นที่เข่า จัดถุงมือให้ตึงทีละนิ้ว แล้วเดินจากไปโดยไม่หันมา

          การ์ดบนโต๊ะ{name}เอาไปเผาในเตาของตึก หมึกสีน้ำเงินไหม้เป็นเปลวสีเขียวอยู่ครู่หนึ่ง
        effects: { stats: { STR: 1 }, flags: [threw_out_the_white_gloves] }
      failure:
        text: |
          มือของ{name}คว้าได้แค่พนักเก้าอี้ เขาลุกหลบไปยืนข้างหน้าต่างแล้ว คล่องเหมือนหลบกิ่งไม้ {name}เสียหลักชนขอบโต๊ะจนสะโพกช้ำ ตะเกียงล้ม เขาเป็นคนตั้งขึ้น

          เขาออกไปทางประตู บอกว่าจะกลับมาเมื่อ{name}พร้อมคุย การ์ดยังอยู่บนโต๊ะ ด้านหลังมีลายมือเพิ่มมาหนึ่งบรรทัด ชื่อ{name} สะกดครบทุกตัว
        effects: { hp: -1, hunted: { star_listeners: 1 }, flags: [white_gloves_wrote_my_name] }
    - id: sell_him_a_false_road
      label: บอกทางผิดให้เขา แล้วเรียกราคา
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}เล่าทางที่หีบไม่เคยไป ช่วงละสองวัน หลักหินที่ไม่มีจริง โรงเตี๊ยมที่ปิดไปนานแล้ว เขาจดทุกคำลงสมุดเล่มเล็กด้วยหมึกสีน้ำเงิน จ่ายห้าเหรียญโดยไม่ต่อ แล้วขอบคุณเหมือนคนที่ได้ของดีกว่าที่จ่าย

          เดือนต่อมาไซเวลเล่าว่ามีคนแปลกหน้าสามคนไปนั่งรออยู่ที่โรงเตี๊ยมร้างแห่งหนึ่งจนหมดสัปดาห์ แล้วกลับไป
        effects: { stats: { CHA: 1 }, gold: 5, flags: [sold_white_gloves_a_false_road] }
      failure:
        text: |
          เขาฟังจนจบ แล้วบอกว่าหลักหินแบบที่{name}เล่าไม่มีบนทางสายนั้น เขาวางเหรียญหนึ่งเหรียญบนโต๊ะ ค่าเสียเวลาของ{name} เขาว่าอย่างนั้น

          ก่อนออกไป เขาจดบางอย่างลงสมุดเล่มเล็ก ไม่ใช่เรื่องทาง เป็นอย่างอื่น
        effects: { gold: 1, hunted: { star_listeners: 1 }, flags: [white_gloves_caught_the_lie] }
    - id: know_him_from_the_inn
      label: ทักว่าเขาคือแขกห้องข้างๆ ที่โรงเตี๊ยมกลางทาง
      requires: { any_flags: [kept_the_chest_from_white_gloves, white_gloves_retied_the_chest] }
      text: |
        ชายในถุงมือขาวหัวเราะออกมาเป็นครั้งแรก เสียงหัวเราะเบาเหมือนคนพลิกหน้ากระดาษ เขาบอกว่าคืนนั้นห้องติดกันผนังบาง {name}หายใจเป็นจังหวะเดียวกับคนที่ไม่ได้หลับ

        {name}บอกเขาว่าทอร์เบนผูกปมตะขอ ไม่เคยผูกปมพิรอด เขาจดคำว่าปมตะขอลงสมุด ขีดเส้นใต้สองเส้น แล้วลุกออกไปโดยไม่ทิ้งการ์ด
      effects: { stats: { WIS: 1 }, flags: [named_the_man_from_the_inn] }

- id: adult.wick_hunt_listener_on_the_stairs
  stage: adult
  weight: 15
  time: night
  hunt: star_listeners
  when:
    age: [20, 64]
    org: wick
    not_orgs: [star_listeners]
    not_traits: [curse_brand]
  text: |
    บันไดขึ้นห้องที่{name}นอนคืนนั้นมืดกว่าทุกคืน ตะเกียงที่ชานพักดับ ใครสักคนดับไว้ แล้วเช็ดเขม่าออกจากโป๊ะจนใส บนขั้นที่ห้ามีหญิงคนหนึ่งนั่งรอ สวมถุงมือหนังสีขาว กล่องไม้บนตักมีหลอดแก้วเรืองแสงสีฟ้าเรียงอยู่ในช่อง เหมือนหมอที่มาเยี่ยมไข้ตอนดึก

    นางยิ้ม ถามว่าชุดของ{name}เอาหีบตะกั่วเมื่อเดือนก่อนไปจากโรงกลั่นไหน นางไม่รีบ นางว่าคืนยังยาว หลอดในกล่องก็ยังมีอีกหลายหลอด
  encounter:
    foe: star_listener
    name: ผู้ฟังดาวบนบันได
    morale: 2
    beats:
      - text: หญิงในถุงมือขาวหยิบหลอดแก้วขึ้นมาหลอดหนึ่ง คีบไว้ระหว่างนิ้วชี้กับนิ้วกลางเหมือนคนถือปากกา น้ำค้างดาวข้างในส่องหน้านางเป็นสีฟ้าซีด
        moves:
          - id: stairs_kick_the_box
            label: ก้าวขึ้นไปเตะกล่องบนตักนางให้หลอดแก้วกระจาย
            kind: quick
            failure: นางยกกล่องหลบได้ในจังหวะเดียว หลอดในมือนางหล่นแตกตรงเท้า{name} ไอเย็นพุ่งขึ้นถึงเข่า ขาชาจนก้าวไม่ออก
          - id: stairs_bang_the_rail
            label: เอาด้ามขอทุบราวบันไดเหล็กให้เสียงก้องทั้งตึก
            kind: attack
            tags: [noise]
            success: เสียงเหล็กดังก้องขึ้นไปทั้งช่องบันได หญิงในถุงมือขาวยกมือข้างหนึ่งปิดหู รอยยิ้มหายไปครู่หนึ่ง หลอดแก้วในมือสั่นจนน้ำค้างดาวกระฉอก
            failure: เสียงเหล็กดังก้องขึ้นไป แต่นางไม่สะดุ้ง นางรอให้เสียงหาย แล้วโยนหลอดแก้วมาแตกที่ขั้นบันไดใต้เท้า{name} ไอเย็นเกาะข้อเท้าเป็นเกล็ด
          - id: stairs_ask_who_sent_her
            label: ถามชื่อนาง แล้วถามว่าใครส่งมา
            kind: talk
            failure: นางตอบชื่อมาชื่อหนึ่ง ชื่อที่{name}รู้ทันทีว่าไม่ใช่ชื่อนาง ระหว่างที่{name}ยังคิดหาคำถามถัดไป หลอดแก้วหลอดหนึ่งก็แตกอยู่ข้างเท้าแล้ว ขาชาขึ้นมาถึงเข่า
          - id: stairs_stand_at_the_foot
            label: ยืนนิ่งที่เชิงบันได ไม่ขึ้นไม่ลง
            kind: guard
            failure: นางลุกขึ้นช้าๆ ลงมาสองขั้น วางหลอดแก้วลงบนขั้นตรงหน้า{name}เบาๆ แล้วเอานิ้วดีด หลอดแตก ไอเย็นขึ้นมาถึงเข่า
      - text: นางวางหลอดแก้วคืนลงกล่อง โน้มตัวมาข้างหน้า พูดประโยคเดียวด้วยเสียงต่ำ ประโยคที่{name}ฟังรู้เรื่องทุกคำ แต่ไม่รู้ว่าแปลว่าอะไร
        answer: talk
        moves:
          - id: stairs_sing_over_her
            label: ร้องเพลงเสียงดังกลบเสียงนาง เพลงไหนก็ได้ที่จำเนื้อได้
            kind: talk
            tags: [noise]
            success: เพลงที่{name}ร้องเป็นเพลงขี้เมาร้องตามโรงเตี๊ยม เนื้อหยาบ จังหวะไม่ตรง ร้องดังจนมีคนชั้นบนตะโกนด่าลงมา หญิงในถุงมือขาวหยุดพูดกลางประโยค ยกมือปิดหูทั้งสองข้าง
            failure: เสียงของ{name}แหบก่อนจะทันกลบ ประโยคของนางเข้าหูแล้วหาทางออกไม่เจอ วนอยู่ข้างในจนภาพตรงหน้าเอียงไปทางหนึ่ง
          - id: stairs_cover_ears
            label: เอามืออุดหูสองข้าง ก้าวขึ้นไปหานาง
            kind: guard
            failure: มืออุดไม่สนิทพอ ประโยคของนางลอดเข้ามาครึ่งประโยค {name}ก้าวพลาดขั้นบันได เข่ากระแทกขอบไม้
          - id: stairs_grab_wrist
            label: คว้าข้อมือนางก่อนพูดจบ
            kind: quick
            failure: ข้อมือในถุงมือขาวลื่นหลุดจากมือ{name}ไปเหมือนปลา นางพูดจนจบประโยค ขมับของ{name}ปวดตุบจนต้องหลับตา
          - id: stairs_read_her_lips
            label: จับตาที่ริมฝีปากนาง หาว่าคำไหนที่นางเน้น
            kind: read
            stat: INT
            failure: ยิ่งอ่านปากนาง ประโยคยิ่งยาวขึ้น คำที่เน้นย้ายที่ไปทุกครั้งที่{name}คิดว่าจับได้ จนหัวหนักเหมือนอ่านหนังสือมาทั้งคืน
      - text: นางชี้นิ้วขึ้นไปทางหลังคา แล้วฮัมเสียงเดียวยาวๆ เสียงต่ำจนพื้นไม้ใต้เท้าสั่นตาม หลอดแก้วในกล่องเรืองแสงสว่างขึ้นพร้อมกันทุกหลอด
        answer: attack
        moves:
          - id: stairs_kick_the_lamp_over
            label: ถีบโป๊ะตะเกียงที่ชานพักให้ตกลงมาแตกเสียงดัง
            kind: attack
            tags: [noise]
            success: โป๊ะแก้วตกลงมาแตกดังเพล้งกลางเสียงฮัม เสียงฮัมขาดกลางลม หญิงในถุงมือขาวหลับตาแน่น กล่องไม้บนตักเอียงจนหลอดแก้วกลิ้งชนกัน
            failure: โป๊ะตกลงมากลิ้งตามขั้นบันไดโดยไม่แตก เสียงฮัมดำเนินต่อ ฟันของ{name}สั่นตามจนปวดเบ้าตา
          - id: stairs_tell_her_the_truth
            label: บอกนางตรงๆ ว่าไม่มีใครในหน่วยรู้ว่าหีบไปจบที่ไหน
            kind: talk
            parley: true
            failure: นางไม่เชื่อ นางฮัมต่อโดยไม่หยุดฟัง เสียงต่ำนั้นไล่ขึ้นมาตามกระดูกขาจนเข่าอ่อน
          - id: stairs_shoulder_past
            label: เบียดผ่านนางขึ้นไปห้องตัวเอง แล้วลงกลอน
            kind: guard
            failure: ไหล่ของ{name}ชนกล่องไม้บนตักนาง ไม่ชนตัวนาง หลอดแก้วสามหลอดแตกพร้อมกัน ไอเย็นลอยขึ้นมาทั้งช่องบันได
          - id: stairs_shout_for_neighbours
            label: ตะโกนเรียกคนทั้งตึกว่ามีขโมย
            kind: talk
            tags: [noise]
            failure: คนชั้นบนเปิดประตูออกมาดู เห็นแต่{name}ยืนตะโกนอยู่คนเดียวในความมืด แล้วปิดประตูกลับ เสียงฮัมยังอยู่ในหูอีกพักใหญ่
    win:
      text: |
        หญิงในถุงมือขาวปิดฝากล่อง ลุกขึ้นยืน ปัดชายกระโปรง แล้วเดินลงบันไดผ่าน{name}ไปโดยไม่หันมา เศษหลอดแก้วบนขั้นบันไดเรืองแสงจางลงทีละชิ้นจนมืด

        เช้านั้นเจ้าของตึกบ่นเรื่องโป๊ะตะเกียงกับรอยน้ำแข็งบนขั้นบันไดที่ละลายไม่ยอมแห้ง {name}จ่ายค่าโป๊ะให้ ไม่ได้อธิบาย
      effects: { hunted: { star_listeners: -1 }, flags: [drove_the_listener_off_the_stairs] }
    parley:
      text: |
        นางฟังจนจบ แล้วเอียงคอเหมือนคนฟังเสียงที่อยู่ไกลกว่าตึกนี้ นางบอกว่าเชื่อ เพราะเสียงของ{name}ไม่มีอะไรซ่อนอยู่ข้างหลังเลย แล้วนางก็หยิบการ์ดหมึกสีน้ำเงินออกมาเขียนสามคำ ไม่มีใครรู้ เก็บใส่กล่อง

        นางลงบันไดไปพร้อมกล่องหลอดแก้ว ตะเกียงที่ชานพักนางจุดให้ใหม่ก่อนไป
      effects: { hunted: { star_listeners: -1 }, flags: [told_the_listener_nobody_knows] }
    lose:
      text: |
        {name}นั่งลงบนขั้นบันไดตอนไหนไม่รู้ ลุกไม่ขึ้น ขาชาไปถึงสะโพก ตอนรู้ตัวอีกที ฟ้าสางแล้ว หญิงในถุงมือขาวไม่อยู่ กล่องหลอดแก้วไม่อยู่

        ย่ามที่สะพายอยู่มีคนเปิดดูแล้วผูกปากกลับให้เรียบร้อย ผูกด้วยปมที่{name}ไม่เคยผูกเป็น ของในย่ามอยู่ครบทุกชิ้น
      effects: { flags: [the_listener_went_through_my_bag] }
    stalemate:
      text: |
        ไก่ตัวแรกขันข้างนอก หญิงในถุงมือขาวปิดฝากล่อง ลุกขึ้นอย่างคนที่หมดเวลาเยี่ยมไข้ นางบอกว่าคืนนี้พอแค่นี้ แล้วเดินลงบันไดไป

        ตะเกียงที่ชานพักยังดับอยู่จนเจ้าของตึกตื่นมาจุด เขาถามว่าใครเช็ดโป๊ะให้ สะอาดกว่าที่เขาเคยเช็ดเอง
      effects: { flags: [sat_out_the_listener_on_the_stairs] }

- id: adult.wick_love_vow
  stage: adult
  weight: 12
  scene: home
  when:
    age: [20, 60]
    org: wick
    not_flags: [has_partner]
  text: |
    ท่าข้ามฟากที่เกวียนน้ำมันต้องผ่านทุกต้นเดือนมีบ้านคนข้ามฟากอยู่หลังเดียว ไวเลนเป็นคนถ่อแพ หลายคืนที่ฝนตกจนข้ามไม่ได้ ชุดนอนกองกันบนพื้นครัวบ้านไวเลน คืนอื่นที่ข้ามได้ {name}ก็ยังลงจากเกวียนไปนั่งดื่มน้ำร้อนที่โต๊ะนั้นก่อนข้ามอยู่ดี ไวเลนจำได้ว่า{name}ไม่กินหัวหอม และเก็บถ้วยใบที่ขอบบิ่นไว้ให้{name}ใบเดียว

    คืนนี้ฝนไม่ตก ข้ามได้ ไวเลนถ่อแพมาส่งเกวียนถึงฝั่งแล้วไม่ถ่อกลับ ยืนอยู่ที่หัวแพ มือยังจับถ่อ บอกว่าบ้านมีเก้าอี้สองตัว ตัวหนึ่งว่างมาตั้งแต่ก่อนรู้จักกัน ไม่ได้ขอให้ตอบคืนนี้ ขอให้ตอบก่อนเกวียนมาเที่ยวหน้า

    ออสริคได้ยินทั้งหมด หูขวาหันมาทางนี้ตั้งแต่ประโยคแรก เขาเดินไปตรวจเชือกมัดถังอีกรอบ ไม่ได้หันหน้ามา
  choices:
    - id: keep_the_chair_empty
      label: บอกไวเลนก่อนเกวียนออกว่าเก้าอี้ตัวนั้นต้องว่างต่อไป
      text: |
        ไวเลนฟังจนจบ แล้วถ่อแพกลับฝั่งโน้นไปคนเดียว ไม่ได้ถามว่าทำไม คนข้ามฟากรู้จักเกวียนน้ำมันดีพอจะไม่ถาม

        เดือนต่อมาบ้านคนข้ามฟากยังเปิดประตูให้ชุดนอนในครัวเหมือนเดิม น้ำร้อนยังมี ถ้วยที่วางให้{name}เป็นถ้วยใหม่ ขอบเรียบ ไม่บิ่น ใบที่ขอบบิ่นไม่อยู่บนชั้นแล้ว
      effects: { flags: [kept_the_vow_over_vailen] }
    - id: stay_at_the_ferry_house
      label: ลงจากเกวียน แล้วไม่ขึ้นกลับไปอีก
      text: |
        {name}ยกย่ามของตัวเองลงจากเกวียน ออสริคไม่ห้าม เขาเอื้อมมารับของของหน่วยที่{name}ถืออยู่ไปจากมือ แล้วขึ้นเกวียน สั่งล่อออกเดิน ไซเวลที่นั่งท้ายเกวียนดึงแถบผ้าเส้นหนึ่งออกจากข้อมือ ทิ้งลงน้ำ

        คืนแรกในบ้านคนข้ามฟาก ตะเกียงบนโต๊ะครัวดับเองตอนเที่ยงคืน ไม่มีลม น้ำมันยังเต็ม ไวเลนจุดใหม่ ดับอีก จุดใหม่ ดับอีก จนไวเลนเลิกจุด แล้วนั่งจับมือ{name}ในความมืดไปจนสาง
      effects:
        org: { id: wick, leave: true }
        lose_traits: [oath_wick]
        traits: [curse_lamp_out]
        hunted: { lamp_church: 2 }
        lose_items: [wick_black_lamp]
        partner: { gender: opposite, name: ไวเลน }
        mark: ผิดคำปฏิญาณ ออกจากหน่วยไส้ตะเกียง
        flags: [broke_the_wick_vow, left_the_wick, stayed_at_the_ferry_house, has_partner]
    - id: make_vailen_forget_the_asking
      label: ขอไซเวลจุดน้ำมันในบ้านไวเลนคืนนี้ ให้คำขอนั้นหายไป
      text: |
        ไซเวลไม่ถามเหตุผล นางตวงครึ่งช้อน คนเดียว คืนเดียว ไวเลนหลับบนเก้าอี้ตัวที่มีคนนั่งประจำ ไซเวลนั่งอยู่ในควันจนสาง {name}รออยู่ที่แพ ไม่ได้เข้าไป

        เดือนต่อมาไวเลนถ่อแพมาส่งเกวียนเหมือนทุกเดือน ทักทุกคนในชุดด้วยเสียงเดิม รินน้ำร้อนใส่ถ้วยขอบบิ่นวางตรงหน้า{name}เหมือนทุกครั้ง แล้วไม่พูดเรื่องเก้าอี้อีกเลย เพราะไม่มีเรื่องเก้าอี้อยู่ในหัวไวเลนให้พูด
      effects: { flags: [made_vailen_forget_the_asking] }

- id: adult.wick_leave_chalk_cask
  stage: adult
  weight: 10
  time: night
  when:
    age: [25, 64]
    org: wick
  text: |
    ไซเวลนั่งอยู่บนบันไดขั้นล่างสุดของห้องถังตอนไม่มีงาน พันแถบผ้าเส้นใหม่เข้าข้อมือ {name}ลงมาเอาถังเปล่า นางเลื่อนตัวให้นั่งข้างกัน แล้วพูดก่อน นางบอกว่านางพูดเรื่องนี้กับทุกคนในชุดครั้งหนึ่ง ไม่ช้าก็เร็ว คืนนี้ถึงตา{name}

    หน่วยไม่เคยห้ามใครออก หน่วยแค่ไม่ให้ใครออกไปพร้อมของที่เห็น นางชี้ถังใบที่สามแถวซ้าย รอยชอล์กรูปประตูปิดบนฝาเลือนจนต้องเพ่ง ถังนั้นเถ้ามากกว่าถังอื่น คนที่นั่งในควันจากถังนั้นทั้งคืน ตื่นมาจะไม่มีหน่วยอยู่ในหัว ไม่มีชุด ไม่มีคืนไหนสักคืน จำได้แค่ว่าป่วยนาน

    อีกทางคือขึ้นบันไดสิบเอ็ดขั้นไปพร้อมทุกอย่างที่จำได้ ทางนั้นไม่มีใครขวาง ตะเกียงจะขวางเอง นางพันแถบผ้าเส้นนั้นจนสุดปลาย แล้วนั่งรอ
  choices:
    - id: breathe_the_chalk_cask
      label: ขอให้ไซเวลจุดน้ำมันจากถังใบที่สาม
      text: |
        ไซเวลจุดตะเกียงดวงเล็กในห้องถัง ปิดประตูหัวบันได แล้วนั่งลงข้าง{name}เหมือนทุกบ้านที่นางเคยนั่ง นางนั่งอยู่ในควันจนครบตามกติกา คืนนั้นนางเองก็ต้องลืมอีกคืนหนึ่ง

        {name}ตื่นมาในห้องคนไข้ของวิหารแห่งหนึ่ง หมอบอกว่าป่วยนาน ไข้ขึ้นๆ ลงๆ จนญาติไม่มีใครมาเยี่ยม ฝ่ามือมีหนังด้านเป็นแนวตรงเท่าด้ามเหล็กที่ไม่รู้ว่าเคยถืออะไร ไหล่มีร่องเหมือนเคยแบกสายสะพายมานาน ตอนเดินออกจากวิหาร เกวียนน้ำมันคันหนึ่งจอดอยู่หลังกำแพง คนขับนิ้วโป้งดำ ไม่ได้มองมา
      effects:
        org: { id: wick, leave: true }
        lose_traits: [oath_wick]
        lose_items: [wick_black_lamp]
        mark: ออกจากหน่วยไส้ตะเกียง
        flags: [left_the_wick, woke_as_one_who_never_served]
    - id: walk_up_the_eleven_steps
      label: ลุกขึ้น เดินขึ้นบันไดสิบเอ็ดขั้นไปพร้อมทุกอย่างที่จำได้
      text: |
        ของของหน่วย{name}วางไว้บนบันไดขั้นล่างสุดข้างตัวไซเวล แล้วขึ้นไปมือเปล่า ไม่มีใครขวางจริงๆ ไซเวลไม่ลุก ทอร์เบนที่ตวงน้ำมันอยู่ข้างบนไม่วางกระบวย {name}เดินผ่านลานโรงน้ำมันออกประตูไปถึงถนน จำได้ทุกบ้าน ทุกคืน ทุกเสียงหลังประตู

        คืนแรกข้างนอก ตะเกียงในห้องเช่าดับเองตอนเที่ยงคืน คืนที่สองก็ดับ ไม่มีคืนไหนที่ไม่ดับ ปลายเดือนนักล่าแม่มดคนหนึ่งมานั่งกินข้าวที่โรงเตี๊ยมตรงข้ามห้องเช่าสามเย็นติดกัน นั่งโต๊ะที่เห็นหน้าต่างห้อง{name}
      effects:
        org: { id: wick, leave: true }
        lose_traits: [oath_wick]
        traits: [curse_lamp_out]
        hunted: { lamp_church: 2 }
        lose_items: [wick_black_lamp]
        mark: เดินออกจากหน่วยไส้ตะเกียง
        flags: [left_the_wick, broke_the_wick_vow, walked_out_of_the_wick_remembering]
    - id: stay_on_the_bottom_step
      label: นั่งอยู่บนบันไดขั้นล่างกับไซเวลต่อ แล้วกลับขึ้นไปทำงาน
      text: |
        ไซเวลดึงแถบผ้าเส้นใหม่ เขียนสามคำ ถามแล้ว ไม่ไป แล้วพันเข้าข้อมือ นางบอกว่าจะไม่ถามซ้ำ ถ้าจะถามอีกต้องเป็น{name}ถามเอง

        {name}ยกถังเปล่าขึ้นบันไดสิบเอ็ดขั้นไปตามที่ตั้งใจลงมาเอาตั้งแต่แรก ถังใบที่สามแถวซ้ายยังตั้งอยู่ในเงามืด ชอล์กบนฝาเลือนลงอีกนิดจากมือที่ปัดผ่าน
      effects: { flags: [stayed_by_the_chalk_cask] }
