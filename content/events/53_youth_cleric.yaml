# วัยหนุ่มสาว 15–17 ทางนักบวช (class: cleric)
# สองเรื่องแรกใช้ได้ทุกเทพ ไม่เอ่ยชื่อเทพ ไม่ระบุถิ่น
# เรื่องตามเทพ: god isel (ช่องส่งขนมปังของวิหาร), god ossa (ที่เก็บชื่อคนตาย ใช้ได้ทั้งผนังเสา หอเก็บบันทึก และแผ่นหินที่ป้อมสาม)
# path_talis_shrine คือศาลทาลิสใต้สะพานในเวนทราส นักบวชอุลเวนได้แค่สองเรื่องแรก
# สัญญาต่อหน้าเบเลคผูกด้วยเวท คนผิดสัญญาหนาวเข้ากระดูกทีละนิด (คัมภีร์ หัวข้อการนับถือ)

- id: youth.cleric_first_answer
  stage: youth
  weight: 30
  when:
    age: [15, 16]
    class: cleric
  text: |
    คนเจ็บคนแรกที่{name}ต้องดูแลคนเดียวเป็นคนแปลกหน้า ตกจากที่สูง ขาหักจนกระดูกทิ่มออกมานอกเนื้อ หมอยังมาไม่ถึง นักบวชที่สอน{name}ติดงานอยู่อีกที่หนึ่ง ในห้องมีแค่{name} คนเจ็บ กับเสียงร้องที่ค่อยๆ เบาลง เพราะคนร้องไม่เหลือแรงจะร้องต่อ

    {name}ท่องคำอธิษฐานมาเป็นร้อยรอบตั้งแต่วันแรก ทุกรอบเป็นแค่คำ ไม่เคยมีอะไรตอบกลับมา

    คนแปลกหน้าคว้ามือ{name}ไว้ แน่นจนข้อนิ้วขาว แล้วถามว่าจะตายไหม
  choices:
    - id: ask_to_live
      label: คุกเข่าลง ขอให้เขารอด
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ครั้งนี้มีอะไรตอบกลับมา {name}ไม่ได้ยินเป็นเสียง รู้สึกเป็นความอุ่นที่เริ่มจากกลางหลังแล้วไหลลงมาตามแขนจนถึงฝ่ามือ อุ่นเหมือนเอามือไปอังเตาตอนเช้ามืด เลือดที่ไหลไม่หยุดมาครึ่งชั่วยามหยุดลงใต้มือ{name}ทีละน้อย

          กระดูกไม่ได้กลับเข้าที่ ขาข้างนั้นต้องรอหมอ แต่คนแปลกหน้ายังหายใจอยู่ตอนหมอมาถึง หมอถามว่าใครห้ามเลือด {name}เปิดปากจะตอบ แล้วก็ไม่รู้ว่าจะตอบว่าใคร
        effects: { stats: { WIS: 1 }, world: { gods: 1 }, flags: [first_prayer_answered] }
      failure:
        text: |
          {name}อธิษฐานจนเสียงแหบ ไม่มีอะไรตอบกลับมา มีแต่มือของคนแปลกหน้าที่ค่อยๆ คลายออก คลายช้าจน{name}นึกว่ายังจับอยู่

          หมอมาถึงตอนที่ไม่มีอะไรต้องทำแล้ว นักบวชที่สอน{name}กลับมาตอนดึก นั่งลงข้าง{name}บนพื้น ไม่บอกว่าไม่ใช่ความผิดของใคร ไม่บอกอะไรเลย นั่งอยู่ด้วยจนเช้า
        effects: { stats: { WIS: 1, CON: 1 }, flags: [first_prayer_silent] }
    - id: ask_ease
      label: ขอให้เขาไม่เจ็บ ไม่ว่าจะไปทางไหน
      text: |
        คำอธิษฐานครั้งนี้สั้นกว่าทุกครั้งที่เคยท่อง และไม่ใช่คำที่ท่องจำมา {name}พูดออกไปเบาๆ ว่าขอให้เขาไม่เจ็บ แล้วรู้สึกว่ามีอะไรบางอย่างในห้องฟังอยู่

        มือที่กำแน่นอยู่คลายออกช้าๆ คนแปลกหน้าถอนหายใจยาวเหมือนคนที่เพิ่งวางของหนักลง แล้วหลับไป หน้าเรียบ ไม่มีรอยขมวดคิ้ว ตอนสางเขาหยุดหายใจในท่าเดิม หมอมาถึงทีหลัง ดูแล้วบอกว่าคนที่ตายแบบนี้ไม่ได้ตายเจ็บ
      effects: { stats: { WIS: 1 }, world: { gods: 1 }, flags: [first_prayer_answered, eased_a_death] }
    - id: set_by_hand
      label: เลิกอธิษฐาน แล้วจัดกระดูกเองด้วยมือ ตามที่เคยเห็นหมอทำ
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}ผูกผ้ารัดเหนือแผลให้แน่นก่อน แล้วจับข้อเท้าเขาดึงช้าๆ ตรงๆ อย่างที่เคยเห็นหมอทำกับขาม้า คนแปลกหน้าร้องจนสุดเสียง แล้วหมดสติไป กระดูกที่ทิ่มออกมาหายกลับเข้าไปใต้เนื้อ

          หมอมาถึง ดูขาแล้วบอกว่าคนจัดกระดูกมือหนักไป แต่ตรง เขาคงเดินกะเผลกไปตลอดชีวิต แต่เดินได้ คืนนั้น{name}ท่องคำอธิษฐานก่อนนอนเหมือนทุกคืน แล้วหยุดกลางคำ เพราะนึกไม่ออกว่าคืนนี้ควรขอบคุณใคร
        effects: { stats: { DEX: 1 }, alignment: { moral: 1 }, flags: [set_bone_by_hand] }
      failure:
        text: |
          ดึงครั้งแรกกระดูกไม่เข้า ครั้งที่สองมีเสียงดังที่{name}จะได้ยินในฝันไปอีกนาน หมอมาถึงทันเห็นมือ{name}ที่ยังจับข้อเท้าอยู่ แล้วผลัก{name}ออกไปทั้งตัว

          คนแปลกหน้ารอด ขาข้างนั้นหมอต้องตัดทิ้งใต้เข่า หมอบอกว่าไม่ใช่เพราะ{name} ขาข้างนั้นไม่รอดตั้งแต่ตกลงมาแล้ว {name}ไม่เชื่อ แต่ก็จำคำนั้นไว้
        effects: { stats: { DEX: 1, WIS: 1 }, flags: [set_bone_badly] }

- id: youth.cleric_last_confession
  stage: youth
  weight: 30
  when:
    age: [16, 17]
    class: cleric
  text: |
    คนแก่ที่{name}ไปนั่งเฝ้าทุกคืนในเดือนสุดท้ายของแก เรียก{name}ให้ก้มลงไปใกล้ในคืนที่เสียงหายใจดังที่สุด แล้วเล่าเรื่องหนึ่งที่ไม่เคยเล่าให้ใครฟัง

    สามสิบปีก่อน แกตัดเชือกเส้นหนึ่งทั้งที่รู้ว่ามีคนห้อยตัวอยู่ปลายเชือก คนคนนั้นยืมค่าแรงทั้งปีของแกไปแล้วไม่ยอมคืน ทุกคนเชื่อว่าเชือกขาดเอง แกก็ปล่อยให้ทุกคนเชื่ออย่างนั้น ลูกชายของคนที่ตายยังมีชีวิตอยู่ อยู่ไม่ไกล ทุกวันนี้ยังเดินผ่านที่นี่เกือบทุกวัน

    แกขอให้{name}อย่าบอกใคร แล้วหลับไปทั้งที่มือยังกำแขนเสื้อ{name}ไว้ ตอนสางแกไม่ตื่นอีก
  choices:
    - id: keep_secret
      label: เก็บเรื่องนี้ไว้ อย่างที่แกขอ
      text: |
        {name}แกะนิ้วของแกออกจากแขนเสื้อทีละนิ้ว ปิดตาให้ แล้วออกไปบอกคนอื่นว่าแกไปแล้ว ไม่ได้บอกอะไรมากกว่านั้น

        ลูกชายของคนที่ตายเดินผ่านมาวันนั้นตอนบ่าย ทักทาย{name}เหมือนทุกวัน ถามว่าคนแก่ที่นอนป่วยอยู่ไปสบายไหม {name}บอกว่าไปสบาย เขาพยักหน้า บอกว่าดีแล้ว แล้วเดินต่อ
      effects: { stats: { WIS: 1 }, alignment: { law: 1 }, flags: [kept_confession] }
    - id: tell_son
      label: ไปบอกลูกชายของคนที่ตาย
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          {name}ไปหาเขาตอนเย็น เล่าทุกอย่างตามที่ได้ยินมา ไม่เติม ไม่ตัด เขาฟังจนจบโดยไม่ขัดสักคำ แล้วบอกว่ารู้มาตลอด ตั้งแต่อายุสิบสอง รู้จากที่คนแก่คนนั้นไม่เคยมองหน้าเขาตรงๆ เลยสักครั้ง

          สิ่งที่เขาขอมีอย่างเดียว ขอรู้ว่าศพจะฝังที่ไหน วันฝัง เขามายืนอยู่ท้ายสุด ยืนจนคนอื่นกลับกันหมด แล้วกลับไปโดยไม่มีใครรู้ว่าเขามาทำไม นอกจาก{name}
        effects: { stats: { CHA: 1 }, alignment: { moral: 1, law: -1 }, flags: [told_confession] }
      failure:
        text: |
          เขาฟังได้ครึ่งเรื่องก็ลุกขึ้น ผลัก{name}ชนกำแพงแล้วตะโกนถามว่าทำไมต้องมาบอกตอนนี้ ตอนที่ไม่มีใครเหลือให้โกรธแล้ว {name}ตอบไม่ได้

          เขาไม่มางานศพ เดือนต่อมาเขาเลิกเดินผ่านทางนี้ เดินอ้อมไปอีกทางที่ไกลกว่า {name}เห็นเขาครั้งหนึ่งจากไกลๆ เขาเห็น{name}ด้วย แล้วหันหน้าไปทางอื่น
        effects: { stats: { CON: 1 }, hp: -1, alignment: { law: -1 }, flags: [told_confession] }
    - id: seal_it
      label: เขียนเรื่องนี้ลงกระดาษ ผนึกซอง เก็บไว้ในที่ของวิหาร
      text: |
        {name}เขียนทุกคำที่แกพูด ตามลำดับที่แกพูด รวมทั้งคำที่แกขอให้อย่าบอกใคร แล้วผนึกซองด้วยขี้ผึ้งของวิหาร หน้าซองเขียนแค่ชื่อแก กับปีที่แกตาย

        ซองนั้นไปอยู่ในหีบที่เก็บของที่คนตายทิ้งไว้ ไม่มีใครเปิดหีบนั้นนอกจากวันที่มีคนมาตามหา {name}ไม่รู้ว่าจะมีใครมาตามหาหรือเปล่า แต่ถ้ามี เรื่องนี้ก็จะยังอยู่
      effects: { stats: { INT: 1 }, flags: [sealed_confession] }

- id: youth.cleric_isel_hatch
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    god: isel
  text: |
    คืนที่หิมะตกหนักที่สุดของหน้าหนาว ระฆังเล็กที่ช่องส่งขนมปังดังขึ้นตอนตีสอง ดังครั้งเดียว ในตะกร้ามีเด็กอ่อนห่อผ้าเก่าผืนเดียว ตัวร้อนจนไอขึ้นจากผ้า ตุ่มเขาสองตุ่มเล็กเท่าเมล็ดถั่วอยู่ใต้ผมบางๆ

    คนที่เข้าเวรดึกคืนนั้นคือ{name} นักบวชคนอื่นมาช่วยได้ตอนเช้า แต่คืนนี้มีแค่{name} เด็ก และเตาไฟในห้องเด็กที่ต้องเติมฟืนทุกชั่วยาม

    พรุ่งนี้ต้องเขียนเด็กคนนี้ลงทะเบียนวิหาร ทะเบียนที่ศาสนจักรตะเกียงส่งคนมาขอดูทุกต้นปี ในทะเบียนมีช่องหนึ่งไว้กาว่าเด็กมีเขาหรือไม่มี
  choices:
    - id: nurse_fever
      label: กอดเด็กไว้ข้างเตาทั้งคืน ไม่วางลง
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ถอดเสื้อตัวนอกออก ให้เด็กนอนแนบอก แล้วห่มทับทั้งสองคน เช็ดตัวด้วยน้ำอุ่นทุกครั้งที่เติมฟืน ท่องคำอธิษฐานของอีเซลเบาๆ ตามจังหวะหายใจของเด็ก ท่องจนจำไม่ได้ว่ากี่รอบ

          ใกล้สาง ตัวเด็กเย็นลง เย็นแบบคนที่ไข้ลด ไม่ใช่แบบที่น่ากลัว เด็กลืมตาขึ้นมาครั้งแรก ตาสีอำพัน สะท้อนแสงเตาไฟ มองหน้า{name}อยู่ครู่หนึ่งแล้วร้องไห้เสียงดังลั่นห้อง แม่ชีคนแก่วิ่งเข้ามา เห็นแล้วก็หัวเราะ บอกว่าร้องดังขนาดนี้ไม่ตายง่ายๆ หรอก
        effects: { stats: { WIS: 1, CON: 1 }, world: { gods: 1 }, flags: [saved_hatch_child] }
      failure:
        text: |
          ไข้ไม่ลด เด็กหายใจถี่ขึ้นเรื่อยๆ แล้วช้าลง ช้าลง {name}กอดแน่นขึ้นเหมือนกอดแน่นแล้วจะเก็บอะไรไว้ได้ ก่อนแม่ชีคนอื่นจะตื่น เด็กก็หยุดหายใจ เบาจน{name}ไม่แน่ใจว่าหยุดตอนไหน

          ตอนเช้า{name}เป็นคนเขียนชื่อเด็กลงทะเบียนเอง ชื่อจากฟ้าเช้าวันนั้น แล้วเขียนวันตายไว้บรรทัดเดียวกัน ผ้าที่ห่อลงหลุมเป็นผ้าผืนที่ดีที่สุดในตู้ ไม่ใช่ผ้าเก่าที่มากับตะกร้า
        effects: { stats: { WIS: 1 }, flags: [lost_hatch_child] }
    - id: blank_box
      label: เขียนชื่อเด็กลงทะเบียน แต่เว้นช่องเขาไว้ว่าง
      text: |
        แม่ชีคนแก่มาเปลี่ยนเวรให้ตอนตีสี่ แกอุ้มเด็กไปนั่งข้างเตาแทน แล้วไล่{name}ไปนอน ตอนเช้าไข้ลดแล้ว

        {name}นั่งอยู่หน้าทะเบียนนานกว่าที่ต้องใช้เขียนชื่อเด็กสิบคน แล้วเขียนชื่อ วันที่พบ น้ำหนัก ส่วนช่องเขา ปล่อยว่างไว้ แม่ชีคนแก่เดินมาอ่านข้ามไหล่ เห็นช่องว่าง แล้วเดินกลับไปโดยไม่พูดอะไร ตอนต้นปีคนของศาสนจักรตะเกียงมาขอดูทะเบียน เขาพลิกผ่านหน้านั้นไปโดยไม่หยุด
      effects: { stats: { WIS: 1 }, alignment: { moral: 1, law: -1 }, flags: [left_horn_box_blank] }
    - id: true_box
      label: เขียนทะเบียนตามจริงทุกช่อง
      text: |
        แม่ชีคนแก่มาเปลี่ยนเวรให้ตอนตีสี่ ตอนเช้าไข้ลดแล้ว {name}เขียนชื่อเด็ก วันที่พบ น้ำหนัก แล้วกาช่องเขา หมึกซึมกระดาษเป็นจุดเล็กๆ ตรงปลายเส้น

        แม่ชีคนแก่บอกว่าเขียนถูกแล้ว วิหารอีเซลไม่โกหกในทะเบียน เพราะทะเบียนที่โกหกคือทะเบียนที่ศาสนจักรตะเกียงมีสิทธิ์ยึดไป ส่วนเด็กที่มีเขาในทะเบียนนี้ ทุกคนยังอยู่ครบในห้องเด็ก แกพูดเหมือนพูดมาหลายรอบแล้วกับหลายคน
      effects: { stats: { WIS: 1 }, alignment: { law: 1 }, flags: [registered_horned_child] }

- id: youth.cleric_ossa_erase
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    god: ossa
  text: |
    ผู้หญิงคนหนึ่งมาหา{name}ตอนที่นักบวชคนอื่นไม่อยู่ เธอมีเงินมาถุงหนึ่ง ขอให้ลบชื่อพ่อของเธอออกจากที่ที่เก็บชื่อคนตาย พ่อของแกฆ่าคน ทั้งบ้านต้องแบกชื่อนั้นมาสามสิบปี เธออยากให้ลูกของเธอโตมาโดยไม่ต้องเห็นชื่อนี้ทุกครั้งที่มาไหว้

    ออสซาดูแลประตูกับความทรงจำ นักบวชทุกคนรู้เรื่องผีไร้ชื่อ คนแคระที่โดนสกัดชื่อออกจากกำแพงแล้วไม่มีที่ไป เลยกลับมาตามหาชื่อตัวเองบนหิน แต่ทุกคนก็รู้ด้วยว่ามีนักบวชบางคนรับเงินแบบนี้

    ถุงเงินวางอยู่บนโต๊ะระหว่าง{name}กับเธอ ปากถุงเปิดไว้ให้เห็น
  choices:
    - id: refuse
      label: ปฏิเสธ ชื่อต้องอยู่ที่เดิม
      text: |
        {name}ดันถุงเงินคืนไปช้าๆ บอกว่าชื่อที่อยู่ในที่นี้ ไม่ได้อยู่เพื่อให้คนเป็นยกย่อง อยู่เพื่อให้คนตายมีประตูกลับ คนดีหรือคนเลวก็ต้องมีประตูเหมือนกัน

        เธอร้องไห้ เก็บถุงเงิน แล้วกลับไป เดือนต่อมา{name}เห็นเธอพาเด็กชายตัวเล็กคนหนึ่งมาไหว้ เธอยืนบังชื่อนั้นไว้ด้วยตัวเองตลอดเวลาที่เด็กไหว้ ไม่ขยับไปไหน
      effects: { stats: { WIS: 1 }, alignment: { law: 1 }, flags: [refused_name_erasure] }
    - id: erase
      label: รับเงิน แล้วลบชื่อให้
      text: |
        {name}ลบชื่อนั้นตอนดึกคนเดียว ใช้เวลาเกือบทั้งคืน เพราะมือไม่ยอมทำงานเร็ว ตอนเสร็จ ตรงนั้นเหลือแต่รอยว่างยาวเท่าชื่อหนึ่งชื่อ ระหว่างชื่ออื่นสองชื่อที่ยังอยู่ครบ

        คืนต่อมา{name}ได้ยินเสียงเคาะเบาๆ สามที ดังมาจากทางนั้น คืนที่สามก็ได้ยินอีก นักบวชคนแก่ที่นอนห้องข้างๆ บอกว่าไม่ได้ยินอะไร แล้วถามว่าทำไมถึงถาม
      effects: { gold: 8, alignment: { law: -1 }, flags: [erased_a_name] }
    - id: move_name
      label: ไม่ลบ แต่ย้ายชื่อไปไว้ในที่ที่ลูกของเธอมองไม่เห็น
      check: { stat: INT, dc: 12 }
      success:
        text: |
          {name}ไปค้นระเบียบเก่าของวิหารสามคืน จนเจอข้อหนึ่งที่ไม่มีใครใช้มาร้อยปี ชื่อของคนที่ญาติขอให้ย้าย ย้ายได้ ถ้ายังอยู่ในที่ของออสซา และนักบวชสองคนรับรู้ {name}ขอให้นักบวชคนแก่มาเป็นคนที่สอง แกอ่านระเบียบข้อนั้นแล้วหัวเราะในคอ

          ชื่อนั้นย้ายไปอยู่แถวล่างสุดในมุมที่ตะเกียงส่องไม่ถึง ยังอยู่ครบทุกตัวอักษร ผู้หญิงคนนั้นไม่ยอมรับเงินคืน {name}จึงเอาเงินไปซื้อน้ำมันตะเกียง แล้วเติมตะเกียงมุมนั้นก่อนมุมอื่นทุกคืน
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [moved_a_name] }
      failure:
        text: |
          {name}ย้ายชื่อเองคนเดียวตอนกลางคืน คิดว่าย้ายแล้วก็ยังอยู่ในที่ของออสซา ไม่น่าจะผิดอะไร นักบวชคนแก่มาเห็นตอนเช้า ยืนดูรอยใหม่อยู่นาน

          แกไม่ได้สั่งให้ย้ายกลับ แต่ให้{name}อ่านชื่อทุกชื่อในแถวนั้นออกเสียง ชื่อละหนึ่งลมหายใจ ตั้งแต่ชื่อบนสุดลงไปถึงชื่อที่เพิ่งย้าย อ่านจนเที่ยง แล้วบอกว่าคราวหน้าถ้าจะทำอะไรกับชื่อคนตาย ให้ปลุกคนเป็นอีกคนมาดูด้วย
        effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [moved_a_name] }

- id: youth.cleric_talis_runaway
  stage: youth
  scene: temple
  weight: 30
  when:
    age: [15, 17]
    flags: [path_talis_shrine]
  text: |
    ตีสามคืนหนึ่ง เด็กผู้หญิงอายุราวสิบขวบวิ่งเข้ามาซุกตัวอยู่หลังรูปสลักไม้ในศาลทาลิส เท้าเปล่า ฝ่ามือทั้งสองข้างเป็นแผลไหม้ลายตารางจากตะแกรงหม้อกลั่น ตัวสั่นทั้งที่ใต้สะพานคืนนี้ไม่หนาว

    นักบวชแก่ดูมือเด็กแล้วพูดเบาๆ ว่าเด็กคนนี้หนีสัญญา สัญญาที่พ่อแม่ลงชื่อแทนต่อหน้าเบเลค ผูกเด็กไว้กับสมาคมโรงกลั่นจนอายุสิบแปด คนที่หนีสัญญาแบบนี้จะหนาวเข้ากระดูกทีละนิด หนีไกลแค่ไหนก็หนาวตามไป

    ไม่ถึงครึ่งชั่วยาม หัวหน้าคนงานของโรงก็เดินตามมาถึงใต้สะพาน ถือตะเกียงมือหนึ่ง กระดาษสัญญาอีกมือหนึ่ง คนงานกะดึกที่นั่งร้องเพลงอยู่หยุดร้องพร้อมกัน
  choices:
    - id: hide_her
      label: บอกหัวหน้าคนงานว่าคืนนี้ไม่มีใครวิ่งเข้ามา
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ยืนขวางหน้ารูปสลักไว้ทั้งตัว บอกว่าคืนนี้มีแต่คนกะดึกมานั่งร้องเพลงเหมือนทุกคืน เขาเอาตะเกียงส่องหน้าทีละคน คนงานกะดึกมองตอบทุกคน ไม่มีใครหลบตา เขาสบถแล้วเดินกลับไปทางเดิม

          คืนนั้นเด็กนอนอยู่ข้างตะเกียงของศาล ห่มเสื้อของ{name}สองตัวซ้อนกัน แต่ฟันยังกระทบกันไม่หยุด นักบวชแก่นั่งมองอยู่ทั้งคืน แล้วพูดขึ้นมาครั้งเดียวว่าทาลิสหักโซ่ได้ทุกเส้น แต่สัญญาของเบเลคไม่ใช่โซ่
        effects: { stats: { CHA: 1 }, alignment: { moral: 1, law: -1 }, reputation: { distillers: -1 }, flags: [hid_runaway] }
      failure:
        text: |
          ตะเกียงของหัวหน้าคนงานส่องไปเจอเท้าเปล่าที่โผล่พ้นฐานรูปสลัก เขาเดินอ้อม{name}ไปเหมือนอ้อมเสา แล้วลากเด็กออกมาทั้งแขน {name}คว้าแขนเด็กอีกข้างไว้ เขาเลยเอาสันตะเกียงฟาดลงที่ข้อมือ{name}หนึ่งที

          เด็กไม่ร้องตอนโดนลากไป ร้องตอนเลยสะพานไปแล้ว เสียงไกลออกไปเรื่อยๆ คนงานกะดึกกลับมาร้องเพลงต่อ ร้องเพลงที่ช้าที่สุดที่มี ข้อมือของ{name}บวมเป็นสีม่วงอยู่ครึ่งเดือน
        effects: { stats: { CON: 1 }, hp: -1, alignment: { moral: 1 }, flags: [lost_runaway] }
    - id: read_contract
      label: ขอดูกระดาษสัญญาในมือเขา
      check: { stat: INT, dc: 12 }
      success:
        text: |
          หัวหน้าคนงานยื่นให้ดูอย่างภูมิใจ ตราเบเลคประทับครบ ลายมือพ่อแม่ครบ แต่{name}อ่านถึงบรรทัดวันที่ แล้วอ่านซ้ำ สัญญาลงวันที่ปีที่เด็กอายุห้าขวบ แต่ข้อหนึ่งในหน้าแรกเขียนว่าคนในสัญญาต้องอายุครบเจ็ดขวบตอนลงชื่อ

          {name}อ่านข้อนั้นออกเสียงช้าๆ ให้ทั้งใต้สะพานได้ยิน คนงานกะดึกหัวเราะออกมาก่อน หัวหน้าคนงานกระชากกระดาษกลับไปอ่านเอง อ่านจบแล้วก็ไม่รู้จะทำหน้าอย่างไร ตอนเช้าเด็กหยุดสั่น นักบวชแก่บอกว่าสัญญาที่เขียนผิดตั้งแต่ต้น เบเลคก็ไม่นับ
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, reputation: { distillers: -1 }, flags: [broke_bad_contract] }
      failure:
        text: |
          {name}อ่านทุกบรรทัด สองรอบ สัญญาถูกต้องทุกข้อ วันที่ถูก ตราถูก ลายมือพ่อแม่ถูก ไม่มีช่องให้แทรกตรงไหนเลย

          {name}ยื่นกระดาษคืนเอง เด็กเดินตามหัวหน้าคนงานไปโดยไม่ต้องให้ลาก เดินไปก็สั่นไป ก่อนลับมุมสะพาน เด็กหันกลับมามอง{name}ครั้งเดียว
        effects: { stats: { INT: 1 }, flags: [lost_runaway] }
    - id: sing_her_out
      label: ส่งสายตาให้คนงานกะดึกลุกขึ้นร้องเพลงล้อมเขาไว้
      text: |
        คนงานกะดึกเข้าใจตั้งแต่{name}ลุกขึ้น คนแรกเริ่มร้องเพลงหม้อหยด คนที่สองลุกตาม คนที่สาม แล้วทั้งใต้สะพานก็ลุกขึ้นยืน ร้องเพลงเดียวกัน เดินเข้ามาล้อมหัวหน้าคนงานเหมือนวงรำ ไม่มีใครแตะตัวเขาเลยสักคน แต่เขาก็เดินผ่านไปไหนไม่ได้

          ตอนเพลงจบ เด็กหายไปจากหลังรูปสลักแล้ว {name}เห็นแค่เงาเล็กๆ วิ่งขึ้นตลิ่งไปทางเหนือน้ำ หัวหน้าคนงานยืนนิ่งอยู่กลางวง แล้วจุดตะเกียงที่ดับไปตอนไหนไม่รู้ขึ้นใหม่ ส่วน{name}นึกถึงคำของนักบวชแก่ เรื่องคนที่หนีสัญญาแล้วหนาวตามไปทุกที่
      effects: { stats: { CHA: 1 }, alignment: { moral: 1, law: -1 }, reputation: { distillers: -1 }, flags: [talis_crowd] }
