# ชุด 4 เส้นเรื่องยาว ไฟล์ ก: relics (ลูกตุ้มไม่มีเลข) · debt (บรรทัดผู้สืบ) · horned_child (หน้าผู้ต้องตรา) · pupil (ศิษย์หนึ่งคน)
# ตอนที่ 1 มี when.age และน้ำหนักตามข้อกำหนด ตอนที่ 2 กับ 3 ไม่มี when.age น้ำหนัก 30 ข้อความไม่รู้ว่าห่างจากตอนก่อนกี่ปี ใช้คำว่า หลายปี
# ตอนที่ 3 คือที่พัก ไม่ใช่ตอนจบ ทุกตัวเลือกตั้ง flag ที่พักหนึ่งอันตามชื่อที่กำหนด (ชุด 6 อ่าน)
# เส้นเรื่องไม่ให้สิ่งติดตัว ไม่ให้ของ ไม่มีใครตาย ของที่ตายตัวเขียนเป็นของในเรื่อง แล้วตั้ง flag
# คนใหม่: เกรวิน (surety_for) คนขับเกวียนที่{name}ค้ำหนี้ให้ · ทิลวา (pupil) ศิษย์ · ตามาร์เทน คนชั่งเกลือที่ตายแล้ว (มีแต่ในข้อความ) · ยายเฟลดิส คนซ่อมตาชั่งเร่ (มีแต่ในข้อความ)

# ===================== relics ของของผู้กล้าทั้งหก =====================

- id: adult.arc_relics_1_numberless_weight
  stage: adult
  scene: market
  weight: 8
  arc: { id: relics, step: 1 }
  when:
    age: [26, 52]
  text: |
    ตามาร์เทนชั่งเกลือให้ด่านมาทั้งชีวิต ตายตอนต้นหน้าหนาว หลานชายมาจากถิ่นอื่น อยู่สามวัน แล้วยกข้าวของของตาออกมาวางขายบนขั้นบันไดหน้าบ้าน ทีละลัง ไม่แยกของ ลังละครึ่งเหรียญ ใครอยากเปิดดูก่อนจ่ายก็ได้ แต่หลานชายยืนกอดอกจ้องทุกมือที่ล้วงลงไป

    {name}ซื้อลังหนึ่งเพราะเห็นบานพับทองเหลืองโผล่ออกมาข้างบน บานพับใช้ได้สามคู่จากสี่ ใต้นั้นเป็นตะปูสนิมเกาะกันเป็นก้อน เศษเชือก กับลูกตุ้มเหล็กดำขนาดเท่ากำปั้นเด็ก ผิวเรียบ ไม่มีเลขตอกบอกน้ำหนักเหมือนลูกตุ้มทั่วไป หนักมือพอจะค้ำประตูที่ปิดเองทุกครั้งที่ลมเข้า {name}จึงเอาไปค้ำประตู

    ครึ่งเดือนต่อมา {name}ถือมันไปถามร้านขายเกลือว่าเหล็กก้อนนี้ขายเป็นเศษได้เท่าไร คนขายวางมันบนจานตาชั่งข้างซ้าย จานข้างขวาที่ว่างเปล่ายกขึ้นมาเสมอกันพอดี เขาขมวดคิ้ว ใส่ขนไก่ลงจานขวาหนึ่งเส้น ตาชั่งไม่ขยับ ใส่ลูกตุ้มทองเหลืองลูกใหญ่ที่สุดของร้าน ตาชั่งก็ยังเสมอ เขาหัวเราะแห้งๆ ว่าตาชั่งเสีย แล้วชั่งเกลือถุงหนึ่งกับลูกตุ้มของตัวเองให้ดู ตรงทุกขีด

    เขาวางเหรียญหนึ่งเหรียญลงข้างตาชั่ง บอกว่าเหล็กก้อนนี้ขายให้เขาก็แล้วกัน จะเอาไปทับสมุดหนี้
  choices:
    - id: back_to_the_door
      label: ขอคืน แล้วเอากลับไปค้ำประตูเหมือนเดิม
      text: |
        คนขายเกลือหยิบเหรียญคืนใส่กระเป๋าช้ากว่าตอนวาง {name}เดินกลับบ้านพร้อมลูกตุ้มในย่าม หนักกว่าตอนขามาอย่างไรก็บอกไม่ได้ อาจเป็นเพราะตอนนี้รู้แล้วว่าของในย่ามแปลก

        คืนนั้นลมเข้าแรง ประตูไม่ขยับ {name}นอนฟังลมผลักบานประตูอยู่ครึ่งคืน เช้ามาลูกตุ้มอยู่ตรงเดิม หญ้าแห้งที่ปลิวเข้ามากองชิดอยู่ด้านหนึ่งเป็นแนวตรง
      effects: { flags: [holds_the_numberless_weight, weight_holds_the_door] }
    - id: weigh_everything
      label: ขอยืมตาชั่งไปลองที่บ้านเองทั้งคืน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ชั่งทุกอย่างที่ยกขึ้นจานได้ ช้อน กาน้ำ ถุงแป้งครึ่งถุง รองเท้าข้างเดียว ทุกครั้งจานสองข้างเสมอกัน ไม่มีครั้งไหนแกว่งก่อนจะนิ่ง ตาชั่งของคนขายเกลือแกว่งทุกครั้งที่ชั่งของอื่น

          ใกล้รุ่ง {name}ลองวางลูกตุ้มบนโต๊ะที่ขาสั้นข้างหนึ่ง โต๊ะตัวนั้นไม่เคยวางอะไรกลมได้โดยไม่กลิ้ง ลูกตุ้มไม่กลิ้ง {name}จดทุกอย่างลงเศษกระดาษ แล้วพับเก็บไว้ใต้ลูกตุ้มนั่นเอง
        effects: { stats: { INT: 1 }, flags: [holds_the_numberless_weight, weighed_the_weight_all_night] }
      failure:
        text: |
          ชั่งไปได้สามอย่าง ตาชั่งยืมก็หลุดจากตะขอแขวน ลูกตุ้มเหล็กร่วงลงหลังเท้าของ{name}เต็มน้ำหนัก เล็บนิ้วโป้งดำไปทั้งเล็บ

          {name}คืนตาชั่งตอนเช้า คนขายเกลือดูตะขอที่งอแล้วไม่คิดเงิน ถามคำเดียวว่าลองแล้วเป็นอย่างไร {name}บอกว่าเหมือนที่ร้าน แล้วเดินกะเผลกกลับบ้าน
        effects: { hp: -1, flags: [holds_the_numberless_weight, dropped_the_weight_on_a_foot] }
    - id: sell_for_a_coin
      label: รับเหรียญ ปล่อยลูกตุ้มไว้กับร้านเกลือ
      text: |
        {name}เก็บเหรียญใส่กระเป๋า คนขายเกลือยกลูกตุ้มลงจากตาชั่งไปวางทับสมุดหนี้บนโต๊ะทันที เหมือนกลัวคนขายจะเปลี่ยนใจ

        หลายเดือนต่อมา{name}ยังเห็นมันอยู่ตรงนั้นทุกครั้งที่ไปซื้อเกลือ ลมพัดเข้าร้านแรงแค่ไหน สมุดหนี้ของร้านไม่เคยเปิดเองสักหน้า คนขายเกลือบอกใครต่อใครว่าเป็นเหล็กก้อนที่ดีที่สุดที่เคยจ่ายไปหนึ่งเหรียญ
      effects: { gold: 1, arc: { id: relics, close: true }, flags: [sold_the_numberless_weight] }
    - id: to_the_temple
      label: เอาไปวางในกล่องของถวายที่วิหาร ไม่ต้องบอกใครว่ามาจากไหน
      text: |
        กล่องไม้ข้างประตูวิหารอีเซลรับของที่คนไม่รู้จะเก็บไว้ที่ไหน เสื้อเด็กที่ตายแล้ว เข็มกลัดที่หาเจ้าของไม่เจอ ลูกตุ้มหล่นลงไปกระแทกก้นกล่องดังทึบ แม่ชีที่นั่งเติมน้ำมันชามไฟเงยหน้าขึ้นครู่หนึ่ง แล้วตักน้ำมันต่อ

        ตอนเดินออกจากลานวิหาร แขนข้างที่ถือย่ามเบาขึ้นจน{name}ต้องก้มลงดู ประตูบ้านคืนนั้นเปิดปิดตามลมทั้งคืน {name}ลุกไปหาหินก้อนใหม่มาค้ำ หินก้อนนั้นกลิ้งออกตอนลมกระโชกแรกพอดี
      effects: { alignment: { law: 1 }, arc: { id: relics, close: true }, flags: [gave_the_weight_to_the_temple] }
    - id: on_the_shop_scale
      label: เอาไปวางบนตาชั่งของร้านตัวเอง ลองกับของที่ขายทุกวัน
      requires: { flag: job_merchant }
      text: |
        ตาชั่งของร้าน{name}ชั่งของมาหลายพันถุง {name}รู้ว่ามันเอียงซ้ายเท่าเมล็ดถั่วหนึ่งเมล็ด และชดเชยให้ลูกค้าทุกครั้งโดยไม่ต้องคิด ลูกตุ้มเหล็กดำวางลงไป {name}ตักถั่วใส่อีกข้างทีละกำ กำแรกเสมอ กำที่สิบก็เสมอ ความเอียงเท่าเมล็ดถั่วหายไปด้วย

        ของชิ้นนี้ชั่งอะไรไม่ได้เลย พ่อค้ารู้ดีกว่าใครว่าตาชั่งที่ให้คำตอบเดียวกับทุกคำถามคือตาชั่งที่ไม่มีใครควรเชื่อ {name}เก็บมันไว้ในลิ้นชักใต้โต๊ะ ลิ้นชักที่ใส่ของที่ร้านไม่ขาย
      effects: { stats: { WIS: 1 }, flags: [holds_the_numberless_weight, weight_in_the_shop_drawer] }

- id: adult.arc_relics_2_two_who_asked
  stage: adult
  weight: 30
  arc: { id: relics, step: 2 }
  text: |
    หลายปีที่ลูกตุ้มไม่มีเลขอยู่กับ{name} ไม่มีใครถามถึงมันเลย จนฤดูนี้มีคนมาถามสองคน ห่างกันสามวัน

    คนแรกสวมเสื้อคลุมสีเทาของวิหารเบเลค ตาชั่งเหล็กอันเล็กเท่าฝ่ามือห้อยคอแทนสร้อย เขามีกระดาษแผ่นหนึ่ง เป็นรายการของที่หลานชายตามาร์เทนขายบนขั้นบันไดเมื่อหลายปีก่อน ลังที่สิบเอ็ดมีชื่อ{name}เขียนกำกับไว้ด้วยลายมือของหลานชาย เขาไม่ได้เอ่ยคำว่าลูกตุ้ม เขาบอกว่าวิหารรับซื้อของเก่าที่เกี่ยวกับการชั่ง ราคาดี บางชิ้นราคาดีมาก แล้วยืนรอคำตอบโดยไม่กะพริบตา

    คนที่สองนั่งรออยู่บนขั้นบันไดหน้าที่พักของ{name}ตอนเย็น ผ้าคลุมสีเถ้าของภาคีผู้เฝ้าผนึกพับเก็บไว้ในย่าม แต่ตะเข็บรองเท้ายังมีเถ้าติด กลางฝ่ามือขวามีหนังด้านเป็นวง ด้านแบบคนที่วางมือบนหินทุกเช้า เขาถามว่าคนเสื้อเทามาแล้วหรือยัง ไม่ได้ถามว่ามาหาอะไร
  choices:
    - id: deny_it
      label: บอกทั้งสองคนว่าเหล็กก้อนนั้นขายต่อไปนานแล้ว
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}บอกคนเสื้อเทาว่าขายให้คนเร่ผ่านทางไปตั้งแต่ปีแรก ได้สองเหรียญ จำหน้าคนซื้อไม่ได้ เขาจดลงกระดาษแผ่นนั้นทุกคำ ขอบคุณ แล้วไป สามวันต่อมาบอกคนผ้าคลุมเถ้าแบบเดียวกัน คำต่อคำ

          คนผ้าคลุมเถ้าฟังจนจบ แล้วบอกว่าคนเสื้อเทาจดคำตอบเดียวกันนี้ไว้ เขาเห็นกระดาษแผ่นนั้นที่โรงเตี๊ยมเมื่อวาน ลายมือสวยกว่าที่ควร เขาลุกเดินจากไปโดยไม่ทิ้งชื่อ
        effects: { stats: { CHA: 1 }, flags: [denied_having_the_weight] }
      failure:
        text: |
          ระหว่างที่{name}เล่าเรื่องคนเร่ผ่านทาง ตาของคนเสื้อเทาเลื่อนลงไปที่โคนประตู ตรงที่ลูกตุ้มเคยค้ำอยู่ พื้นตรงนั้นมีรอยกดกลมเป็นวงเรียบ ไม่มีฝุ่น เขาจดอะไรสั้นๆ ลงกระดาษ ขอบคุณ แล้วไป

          สามวันต่อมาคนผ้าคลุมเถ้าก็มองลงไปที่โคนประตูเหมือนกัน เขาไม่ได้ชี้ ไม่ได้ถามซ้ำ บอกแค่ว่าถ้าวันไหนอยากขาย อย่าขายให้คนที่ให้ราคาสูงที่สุด
        effects: { flags: [denied_having_the_weight, weight_ring_on_the_floor] }
    - id: show_it
      label: หยิบมาวางบนโต๊ะ ให้ดูทีละคน
      text: |
        คนเสื้อเทาปลดตาชั่งเล็กๆ จากคอ วางลูกตุ้มบนจานข้างหนึ่ง จานอีกข้างลอยขึ้นมาเสมอ มือที่ถือตาชั่งสั่นนิดเดียว เขาบอกราคาแปดเหรียญ {name}ไม่ตอบ เขาขึ้นเป็นสิบสอง {name}ยังไม่ตอบ เขาวางเหรียญหนึ่งเหรียญไว้บนโต๊ะเป็นค่าที่ให้ดู แล้วจดชื่อ{name}ลงสมุด ช่องที่เขียนหัวไว้ว่าผู้ถือ

        คนผ้าคลุมเถ้าไม่ได้ชั่ง เขาวางลูกตุ้มบนฝ่ามือข้างที่ด้าน หลับตานานเท่าหายใจสามครั้ง เหมือนนับหิน แล้วคืนให้ บอกว่าถ้าวันไหนจะปล่อยมือ ให้ส่งไปทางตะวันออก ไม่บอกว่าทำไม
      effects: { gold: 1, flags: [showed_the_weight] }
    - id: hide_it_elsewhere
      label: เอาไปซ่อนไว้ที่อื่นก่อนอีกคนจะมาถึง
      text: |
        คืนนั้น{name}ห่อลูกตุ้มด้วยผ้าน้ำมันสองชั้น หย่อนลงก้นโอ่งน้ำหลังบ้าน จมลงไปอยู่ใต้ตะกอนที่ไม่มีใครกวนมาหลายปี เช้าวันต่อมาลมตีประตูที่เคยมีอะไรค้ำดังปังทั้งวัน {name}ปล่อยให้มันตี

        สามวันต่อมาคนผ้าคลุมเถ้ามานั่งบนขั้นบันได {name}บอกว่าไม่มีของแบบนั้น เขาดูประตูที่ปิดเองตามลม แล้วถามว่าเมื่อก่อนประตูนี้มีอะไรค้ำ {name}บอกว่าหิน เขาบอกว่าหินก็ดี แล้วลุกไป
      effects: { flags: [hid_the_weight_elsewhere] }
    - id: cast_a_false_one
      label: หล่อเหล็กดำก้อนใหม่ขนาดเท่ากันไว้ให้คนเสื้อเทา
      requires: { flag: job_smith }
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          {name}หล่อเหล็กก้อนกลมในคืนเดียว ขัดผิวด้วยทรายจนเรียบ แล้วเอาขี้เถ้าเตาถูจนดำด้านเหมือนของเก่า คนเสื้อเทาวางมันบนตาชั่งเล็กของเขา จานข้างนั้นจมลงตามน้ำหนักเหล็กธรรมดา เขายิ้มบางๆ คืนให้ บอกว่าของปลอมทำดี เขาจะจำชื่อช่างไว้

          คนผ้าคลุมเถ้าไม่ได้ขอดูอะไรเลย ตอนลาเขาบอกว่าคนเสื้อเทาเล่าเรื่องเหล็กหล่อให้ทั้งโรงเตี๊ยมฟังแล้ว เล่าเหมือนเรื่องตลก
        effects: { stats: { DEX: 1 }, flags: [denied_having_the_weight, cast_a_false_weight] }
      failure:
        text: |
          เหล็กที่หล่อร้าวกลางก้อนตอนเย็นตัว {name}รีบจับออกจากแบบด้วยคีมที่ร้อนเกินไป ฝ่ามือพองสองตุ่ม คนเสื้อเทามาถึงตอนเช้า {name}บอกเขาว่าไม่มีของแบบนั้นในร้าน มือที่พันผ้าวางอยู่บนทั่ง

          เขาดูผ้าพันมือ ดูเหล็กก้อนร้าวบนพื้น แล้วจดอะไรบางอย่างลงกระดาษ
        effects: { hp: -1, flags: [denied_having_the_weight, cracked_the_false_weight] }

- id: adult.arc_relics_3_the_scale_mender
  stage: adult
  scene: market
  weight: 30
  arc: { id: relics, step: 3 }
  text: |
    ยายเฟลดิสซ่อมตาชั่งเร่ไปตามตลาด เดือนละถิ่น ตั้งร่มผ้าใบเก่าตรงมุมที่ลมไม่แรง แผ่ผ้าวางเครื่องมือเล็กๆ เรียงเป็นแถว คนในตลาดรู้กันว่าก่อนจะมาซ่อมตาชั่ง ยายเคยคัดสมุดเก่าให้หอจดหมายเหตุของวิหาร จนตาข้างหนึ่งขุ่น ตั้งแต่ลูกตุ้มไม่มีเลขมาอยู่กับ{name} มีคนมาถามหามันมากกว่าหนึ่งคน ปีนี้{name}ห่อมันใส่ผ้า เอาไปวางลงบนผ้าของยาย

    ยายไม่ได้วางมันบนตาชั่ง ยายพลิกด้านล่างขึ้น ใช้แว่นขยายส่องตรงที่ผิวเหล็กเรียบที่สุด มีร่องเล็กๆ ที่{name}ไม่เคยเห็นมาก่อน บางเท่าเส้นผม ยายเอาเล็บไล่ตามร่อง ปากขยับตามโดยไม่มีเสียง

    "ของที่คนหกคนนั้นพกติดตัว" ยายว่า แล้ววางลงบนผ้าเหมือนวางชามร้อน "ไม่ต้องถามว่าคนไหน ข้าอ่านได้แค่นี้ ของแบบนี้มีสิบสองชิ้น ธนาคารจะบอกว่าเป็นของค้ำสัญญาฉบับแรกของเขา ตะเกียงจะบอกว่าเป็นของวิหาร คนป้อมจะบอกว่าให้เอากลับไปไว้ใกล้ตอ ไม่มีใครบอกเหตุผลจริงหรอก" ยายเก็บแว่นขยายลงกล่อง ไม่คิดค่าดู
  choices:
    - id: keep_it_hidden
      label: ห่อกลับ ซ่อนไว้ที่ใหม่ แล้วไม่บอกใครอีก
      text: |
        {name}เปลี่ยนที่ซ่อนในคืนนั้น ที่ที่ไม่มีใครในบ้านรู้ ไม่จดไว้ที่ไหน ไม่บอกแม้แต่คนที่นอนใกล้ที่สุด ถ้า{name}ตายพรุ่งนี้ ลูกตุ้มก้อนนั้นจะอยู่ตรงนั้นไปอีกหลายชั่วคน เหมือนที่มันอยู่ใต้ตะปูสนิมในลังของตามาร์เทน

        ปลายฤดูมีคนมาถามหามันอีกคน ผู้หญิงที่เล็บดำเพราะเถ้า ไม่ใช่เพราะงาน {name}บอกว่าไม่รู้จัก นางไม่เชื่อ แต่ก็ไป
      effects: { stats: { WIS: 1 }, flags: [keeps_the_relic_hidden] }
    - id: carry_it_east
      label: เดินทางไปตะวันออกเอง ส่งถึงมือผู้เฒ่าของป้อม
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ขบวนถ่านไปถึงปลายรางตอนรุ่งสาง {name}เดินลุยเถ้าต่ออีกครึ่งวันจนถึงป้อมแรก ผู้เฒ่าของป้อมเป็นคนแคระหญิงตัวเตี้ย ไม้เท้าเหล็ก รับลูกตุ้มไปวางบนแนวหินก้อนที่ใกล้ที่สุด หลับตา วางมือบนหินข้างๆ อยู่นาน แล้วลืมตาขึ้น ไม่บอกว่ารู้อะไร

          นางจดชื่อ{name}ลงสมุดของป้อม ช่องผู้ส่งคืน แล้วให้คนครัวตักน้ำแกงให้หนึ่งชามก่อนเดินกลับ
        effects: { stats: { CON: 1 }, gold: -3, reputation: { wardens: 1 }, flags: [relic_given_to_the_wardens] }
      failure:
        text: |
          ครึ่งทางในเถ้า ลมหอบเถ้าขึ้นมาเป็นม่าน {name}ไอจนต้องคุกเข่า ผ้าปิดปากชั้นเดียวไม่พอ ผู้เฝ้าสองคนที่เดินตรวจแนวหินเห็นเข้า ลากมาถึงป้อมได้ก่อนค่ำ

          ผู้เฒ่าของป้อมรับลูกตุ้มไปจากมือที่ยังเปื้อนเถ้า จดชื่อลงสมุด {name}ไอเป็นสีเทาไปจนถึงบ้าน
        effects: { hp: -2, gold: -3, reputation: { wardens: 1 }, flags: [relic_given_to_the_wardens] }
    - id: to_the_lamp
      label: เอาไปวางบนแท่นวิหารเวรัส ต่อหน้านักบวชตะเกียง
      text: |
        นักบวชตะเกียงไม่ได้แปลกใจ เขาเปิดลิ้นชักโต๊ะ หยิบกระดาษที่พิมพ์หัวไว้แล้วออกมาหนึ่งแผ่น ใบรับของคืนวิหาร ช่องชื่อของมีอยู่แล้ว ว่างแค่ช่องชื่อผู้คืน เขายกลูกตุ้มขึ้นด้วยผ้าขาวสองชั้น ไม่ให้นิ้วแตะ

        {name}ลงชื่อ นักบวชอวยพรให้หนึ่งบท ยกตะเกียงขึ้นใกล้หน้าผาก ตอนเดินลงบันไดวิหาร มีคนเสื้อเทายืนอยู่ฝั่งตรงข้ามถนน มองขึ้นมาที่ประตูวิหาร แล้วหันหลังเดินไป
      effects: { alignment: { law: 1 }, reputation: { lamp_church: 1 }, flags: [relic_given_to_the_lamp] }
    - id: sell_to_belek
      label: เอาไปขายที่โต๊ะประเมินของวิหารเบเลค
      text: |
        ผู้ประเมินคนนั้นจำ{name}ได้ หรือจำชื่อในกระดาษของเขาได้ เขาวางลูกตุ้มบนตาชั่งใหญ่ของธนาคาร จานอีกข้างลอยขึ้นมาเสมอ เขาไม่ต่อราคา นับเหรียญสิบสองเหรียญเรียงเป็นแถวบนโต๊ะ แล้วเติมอีกหนึ่งเป็นค่าเดินทาง

        ใบรับซื้อเขียนว่าของค้ำสัญญาเก่า หนึ่งชิ้น ไม่ระบุสัญญา {name}เดินออกจากธนาคารด้วยกระเป๋าที่หนักที่สุดในชีวิต ตรงข้ามถนนมีผู้หญิงคนหนึ่งนั่งอยู่บนขอบบ่อ เล็บดำด้วยเถ้า นางจำหน้า{name}ไว้
      effects: { gold: 13, reputation: { belek_bank: 1 }, flags: [relic_sold_to_belek] }

# ===================== debt หนี้ที่ไม่ตายตามคน =====================

- id: adult.arc_debt_1_surety
  stage: adult
  scene: belek_bank
  weight: 8
  arc: { id: debt, step: 1 }
  people: [{ id: surety_for, name: เกรวิน, gender: m, bond: friend, closeness: 1, age: 36 }]
  when:
    age: [27, 50]
  text: |
    เกวียนของเกรวินพลิกตรงทางลงสะพานเมื่อต้นเดือน ม้าล้มทับขาหน้าตัวเอง ต้องฆ่าทิ้งข้างทาง เกรวินรับจ้างขนของทุกอย่างในถิ่นมาหลายปี ตรงเวลาจนแม่บ้านบางบ้านตั้งหม้อข้าวตามเสียงล้อ ลูกสามคน คนเล็กยังไม่หย่านม ตั้งแต่วันนั้นเกวียนของเขาจอดอยู่หลังบ้าน คานยกชี้ฟ้า

    วิหารเบเลคให้กู้สิบสองเหรียญซื้อม้าตัวใหม่ แต่คนที่ไม่มีบ้านไม่มีนาต้องมีคนค้ำ คนที่มีชื่อในถิ่นหนึ่งคน ลงชื่อใต้ชื่อของเขาต่อหน้าเสมียน เกรวินมาเคาะประตูบ้าน{name}ตั้งแต่ไก่ยังไม่ขัน ถือหมวกไว้ในมือ

    เช้านี้สองคนยืนหน้าโต๊ะยาวของเสมียน สัญญาสองหน้ากางอยู่ หมึกยังเปียกตรงตัวเลข ช่องผู้ค้ำอยู่ล่างสุดของหน้าสอง ใต้ช่องนั้นมีบรรทัดสุดท้ายที่ตัวเล็กกว่าบรรทัดอื่นจนต้องก้มดู เสมียนยื่นปากกาให้{name} ไม่อ่านบรรทัดไหนให้ฟัง เกรวินบิดหมวกอยู่ข้างๆ บอกว่าเดือนละเหรียญ ไม่ถึงปีก็หมด เขาไม่เคยส่งของช้าสักครั้ง
  choices:
    - id: sign
      label: รับปากกา แล้วลงชื่อตรงช่องผู้ค้ำ
      text: |
        ปลายปากกาแตะกระดาษ ปลายนิ้วทั้งห้าของ{name}เย็นวาบขึ้นมาถึงข้อมือ แล้วหายไป เสมียนโรยทรายซับหมึก เป่าทรายทิ้ง พับสัญญาเข้าแฟ้ม

        สามวันต่อมาเกรวินจูงม้าสีเทาตัวเมียมาให้ดูถึงหน้าบ้าน ฟันดี ขาตรง ขี้ตกใจนิดหน่อย เช้าวันต่อมาเสียงล้อเกวียนของเขาผ่านหน้าบ้าน{name}ตรงเวลาเดิม แม่บ้านฝั่งตรงข้ามยกหม้อข้าวขึ้นตั้งเตา
      effects: { alignment: { moral: 1 }, people: [{ id: surety_for, closeness: 1 }], flags: [signed_as_surety] }
    - id: read_the_last_line
      label: ก้มอ่านบรรทัดสุดท้ายให้จบก่อน แล้วค่อยลงชื่อ
      requires: { any_flags: [belek_loan, belek_home_loan, shop_on_belek_loan, artificer_belek_loan, entry_loan] }
      text: |
        {name}เคยลงชื่อในสัญญาของเบเลคมาก่อน รู้ว่าต้องก้มดูตรงไหน บรรทัดสุดท้ายเขียนว่าหนี้ที่ลูกหนี้ใช้ไม่หมดตกแก่ผู้ค้ำ หนี้ที่ผู้ค้ำใช้ไม่หมดตกแก่ชื่อถัดไปในบ้านของผู้ค้ำ {name}อ่านจนจบ อ่านซ้ำอีกรอบ เสมียนรออยู่โดยไม่ขัด ปากกายังยื่นค้าง เขาบอกว่าส่วนใหญ่ไม่มีใครก้มดู

        เกรวินถามว่าบรรทัดนั้นเขียนว่าอะไร {name}บอกว่าเขียนเรื่องคนที่ไม่ส่งของตรงเวลา แล้วลงชื่อ ปลายนิ้วเย็นวาบขึ้นมาถึงข้อมือ เสมียนโรยทรายลงบนลายมือชื่อนั้นหนากว่าที่ควร
      effects: { stats: { INT: 1 }, flags: [signed_as_surety, read_the_heirs_line] }
    - id: refuse
      label: วางปากกาลง บอกเกรวินว่าค้ำให้ไม่ได้
      text: |
        เกรวินบอกว่าไม่เป็นไร เขาเข้าใจ แล้วสวมหมวก ทั้งที่ยังอยู่ในห้อง เสมียนเก็บสัญญาเข้าแฟ้มโดยไม่เปลี่ยนสีหน้า

        เดือนต่อมาเกรวินขายเกวียน ไปรับจ้างยกของที่ลานสถานีวันละครึ่งเหรียญ เจอ{name}ในตลาดก็ยังยกมือทักเหมือนเดิม แต่ไม่หยุดคุย แม่บ้านฝั่งตรงข้ามซื้อนาฬิกาทรายมาตั้งไว้ข้างเตา
      effects: { people: [{ id: surety_for, closeness: -1 }], arc: { id: debt, close: true }, flags: [refused_surety] }
    - id: lend_from_the_purse
      label: ให้ยืมสี่เหรียญจากกระเป๋าตัวเองแทน ไม่ลงชื่อในสมุดของใคร
      requires: { min_gold: 4 }
      text: |
        {name}นับสี่เหรียญลงในหมวกของเกรวินตรงหน้าโต๊ะเสมียน แล้วเดินออกจากธนาคารไปด้วยกัน เงินสี่เหรียญกับที่เขาเก็บไว้เองซื้อม้าไม่พอ ได้ล่อแก่ตัวหนึ่งที่เดินช้ากว่าม้าครึ่งหนึ่ง แต่ไม่เคยตกใจอะไรเลย

        เกรวินใช้คืนเป็นเงินบ้าง เป็นฟืนบ้าง เป็นข้าวสารบ้าง สองหน้าหนาวถึงครบ เหรียญสุดท้ายห่อมาในใบตอง วางไว้บนขั้นประตู ล้อเกวียนของเขาผ่านหน้าบ้านช้ากว่าเดิม แม่บ้านฝั่งตรงข้ามตั้งหม้อข้าวช้าตาม
      effects: { gold: -4, stats: { WIS: 1 }, people: [{ id: surety_for, closeness: 1 }], arc: { id: debt, close: true }, flags: [lent_instead_of_surety] }

- id: adult.arc_debt_2_read_aloud
  stage: adult
  weight: 30
  arc: { id: debt, step: 2 }
  people: [{ id: surety_for, closeness: -1 }]
  text: |
    เกรวินขึ้นขบวนกลางคืนไปตั้งแต่ปลายหน้าฝน ไม่บอกใคร เมียกับลูกตามไปในเดือนเดียวกัน เกรวินขายม้าสีเทาตัวนั้นไปก่อนหน้าแล้วในตลาดถิ่นอื่น เกวียนยังจอดอยู่หลังบ้านเก่าของเขา ล้อข้างหนึ่งมีคนถอดไปแล้ว

    คนทวงหนี้ของวิหารเบเลคดักรอ{name}อยู่หน้าร้านขนมปังตอนเย็น ตรงที่คนต่อแถวยาวที่สุด เขากางสัญญาฉบับเดิมออก ลายมือชื่อของ{name}อยู่ตรงช่องผู้ค้ำ ลายมือเกรวินอยู่ข้างบน ยังค้างสิบห้าเหรียญรวมดอก แล้วเขาก็ทำสิ่งที่เสมียนไม่ได้ทำในวันลงชื่อ เขาอ่านบรรทัดสุดท้ายออกเสียง ทีละคำ ดังพอให้แถวหน้าร้านขนมปังได้ยินทั้งแถว

    หนี้ที่ลูกหนี้ใช้ไม่หมดตกแก่ผู้ค้ำ หนี้ที่ผู้ค้ำใช้ไม่หมดตกแก่ชื่อถัดไปในบ้านของผู้ค้ำ

    คนขายขนมปังหยุดห่อขนมปังค้างไว้ครึ่งก้อน
  choices:
    - id: pay_a_third
      label: นับห้าเหรียญให้ตรงนั้น เป็นงวดแรก
      requires: { min_gold: 5 }
      text: |
        {name}นับเหรียญบนฝ่ามือคนทวงหนี้ทีละเหรียญ ช้าพอให้แถวขนมปังนับตามได้ เขาเขียนตัวเลขลงท้ายสัญญา หักออกหนึ่งในสาม แล้วบอกว่าเดือนหน้าจะมาที่เดิม เวลาเดิม

        คนขายขนมปังห่อขนมปังที่ค้างไว้ต่อจนเสร็จ ยื่นให้{name}โดยไม่รับเงิน บอกว่าพรุ่งนี้ค่อยจ่าย คืนนั้น{name}กินขนมปังก้อนนั้นคนเดียวจนหมดก้อน
      effects: { gold: -5, alignment: { law: 1 }, flags: [paying_the_surety] }
    - id: dispute_the_page
      label: ขอเปิดสัญญาต่อหน้าพยานของวิหาร
      check: { stat: INT, dc: 14 }
      success:
        text: |
          พยานของวิหารสองคนนั่งม้านั่งยาวหน้าธนาคาร {name}ชี้ให้ดูบรรทัดกลางหน้าแรก ม้าคือของค้ำสัญญา ธนาคารต้องยึดม้าก่อนจะมาเอากับผู้ค้ำ แต่ม้าเดินออกจากถิ่นไปขายในตลาดอื่น ใต้จมูกเสมียนของธนาคารเอง และไม่มีใครในวิหารไปตาม

          พยานคนแก่อ่านบรรทัดนั้นซ้ำ แล้วกระแอม คนทวงหนี้ขีดตัวเลขเดิมทิ้ง เขียนตัวเลขใหม่ครึ่งหนึ่งของเดิม ลายมือแรงจนกระดาษขาด
        effects: { stats: { INT: 1 }, flags: [surety_halved] }
      failure:
        text: |
          พยานของวิหารฟังจนจบ แล้วชี้ให้{name}ดูบรรทัดที่สามของหน้าสอง ผู้ค้ำยินยอมให้ธนาคารเลือกตามหนี้จากผู้ใดก่อนก็ได้ ลายมือชื่อของ{name}อยู่ใต้บรรทัดนั้นพอดี

          ค่านั่งฟังของพยานคนละเหรียญ ธนาคารเติมลงท้ายหนี้ ส่วนที่{name}ต้องจ่ายวันนี้คือค่าพยาน
        effects: { gold: -2, flags: [disputed_the_surety_and_lost] }
    - id: refuse_to_pay
      label: บอกคนทวงว่าใครกู้ก็ไปตามเอากับคนนั้น
      text: |
        คนทวงหนี้พับสัญญาเก็บ ไม่เถียง เขาบอกว่าไม่ต้องรีบ สัญญาของเบเลครอได้ แล้วเดินไปต่อแถวซื้อขนมปังเหมือนลูกค้าคนอื่น

        คืนนั้นปลายนิ้วมือข้างที่ลงชื่อเย็นขึ้นมาเอง ไม่วาบแล้วหาย เย็นค้างอยู่ ผิงไฟก็ไม่อุ่น ปลายเดือนความเย็นขึ้นมาถึงข้อนิ้ว เช้าไหนลมแรง {name}ต้องซุกมือข้างนั้นไว้ในรักแร้ก่อนจะจับอะไรได้
      effects: { hp: -1, flags: [defaulted_on_surety] }
    - id: open_the_jar
      label: กลับไปเปิดไหที่หยอดเหรียญไว้ตั้งแต่วันลงชื่อ
      requires: { flag: read_the_heirs_line, min_gold: 3 }
      text: |
        ตั้งแต่วันที่อ่านบรรทัดสุดท้ายจบ {name}หยอดเหรียญลงไหใบเล็กหลังเตาทุกครั้งที่มีเหลือ ไม่บอกใคร ไหใบนั้นมีสามเหรียญ กับกระดุมที่ไม่รู้ว่ามาจากไหนหนึ่งเม็ด {name}เทเหรียญลงบนฝ่ามือคนทวงหนี้ต่อหน้าแถวขนมปัง เก็บกระดุมไว้

        คนทวงหนี้จดตัวเลข มองหน้า{name}นานกว่าที่มองลูกหนี้คนอื่น ถามว่ารู้มาก่อนหรือ {name}บอกว่าบรรทัดนั้นไม่ได้เขียนตัวเล็กขนาดนั้น
      effects: { gold: -3, stats: { WIS: 1 }, flags: [paying_the_surety, saved_for_the_surety] }

- id: adult.arc_debt_3_three_slips
  stage: adult
  scene: belek_bank
  weight: 30
  arc: { id: debt, step: 3 }
  text: |
    หลายปีที่สัญญาฉบับนั้นอยู่ในแฟ้มของวิหารเบเลค บางเดือน{name}ลืมไปเลย บางเดือนจำได้ทุกคืน ปีนี้ธนาคารเรียกตัว เสมียนคนที่นั่งโต๊ะวันนี้ไม่ใช่คนเดิม หนุ่มกว่า เล็บตัดสั้นเสมอกันทุกเล็บ

    เขาวางกระดาษสามใบเรียงบนโต๊ะ หันหัวกระดาษมาทาง{name} ใบแรกมีตัวเลขเดียว คือทุกเหรียญที่ยังค้างกับดอกที่งอกมาตั้งแต่วันที่เกวียนจอดนิ่ง ท้ายใบเขียนว่าครบ ใบที่สองเป็นแบบฟอร์มย้ายบรรทัด ธนาคารจะขีดชื่อ{name}ออกจากช่องผู้ค้ำ แล้วเขียนชื่อถัดไปในบ้านของ{name}ลงแทน ช่องชื่อยังว่าง ใบที่สามเป็นสัญญาจ้าง พยานรับจ้างนั่งม้านั่งหน้าธนาคาร ลงชื่อเป็นพยานให้สัญญาของคนอื่น ค่าแรงทั้งหมดหักเข้าหนี้จนกว่าจะครบ

    "ธนาคารไม่ชอบสัญญาที่ค้างนาน" เสมียนว่า "เหมือนชามที่วางทิ้งไว้ไม่ล้าง"
  choices:
    - id: pay_it_all
      label: จ่ายทั้งหมดตามใบแรก แล้วรอให้เขาเขียนคำว่าครบ
      requires: { min_gold: 9 }
      text: |
        เก้าเหรียญเรียงบนโต๊ะเป็นสามแถว เสมียนนับสองรอบ แล้วเขียนคำว่าครบท้ายสัญญาด้วยหมึกสีเดียวกับบรรทัดอื่น เขาพับสัญญาเป็นสี่ทบ ยื่นให้{name}เก็บ บอกว่าธนาคารไม่ต้องใช้แล้ว

        ตอนเดินออกจากธนาคาร แดดบ่ายตกลงบนหลังมือ ปลายนิ้วข้างที่เคยลงชื่ออุ่นทั่วถึงเล็บ {name}เอาสัญญาฉบับนั้นไปจุดไฟในเตาที่บ้าน ดูกระดาษงอเข้าหาตัวเองจนเหลือแต่ขี้เถ้าบาง
      effects: { gold: -9, stats: { CON: 1 }, mark: ใช้หนี้ที่ค้ำไว้จนหมด, arc: { id: debt, close: true }, flags: [surety_paid_in_full] }
    - id: pay_the_halved_page
      label: จ่ายครึ่งที่เหลือตามที่พยานขีดไว้
      requires: { flag: surety_halved, min_gold: 5 }
      text: |
        เสมียนหนุ่มเห็นตัวเลขที่มีคนขีดฆ่ากับตัวเลขใหม่ที่ลายมือแรงจนกระดาษขาด เขาคิดใบแรกใหม่ตามนั้นโดยไม่ต้องให้ใครเตือน ห้าเหรียญ ไม่ขาด ไม่เกิน

        เขาเขียนคำว่าครบ แล้วถามขึ้นมาเฉยๆ ว่าวันนั้นใครชี้บรรทัดเรื่องม้า {name}บอกว่าตัวเอง เสมียนจดชื่อ{name}ลงกระดาษอีกแผ่นที่ไม่ใช่สัญญา แล้วพับใส่ลิ้นชัก
      effects: { gold: -5, stats: { INT: 1 }, mark: ใช้หนี้ที่ค้ำไว้จนหมด, arc: { id: debt, close: true }, flags: [surety_paid_in_full, paid_the_halved_page] }
    - id: move_the_line
      label: บอกชื่อที่จะเขียนลงช่องว่างบนใบที่สอง
      text: |
        เสมียนถามว่าคนในบ้านมีใครบ้าง {name}ตอบทีละคน ถ้าบ้านนี้ไม่มีใครเลย เสมียนบอกว่าไม่เป็นไร ธนาคารเขียนว่าผู้อยู่บ้านหลังนี้คนถัดไป ใครจะได้บ้านไปก็ได้หนี้ไปด้วย ธนาคารเคยเก็บหนี้จากคนที่ไม่เคยรู้จักผู้ค้ำมาแล้วหลายราย

        เขาเขียนลงช่องด้วยลายมือที่สวยที่สุดในวันนั้น แล้วขีดชื่อของ{name}ออกด้วยเส้นตรงเส้นเดียว ปลายนิ้วของ{name}อุ่นขึ้นตั้งแต่ยังไม่ทันลุกจากเก้าอี้ ทั้งวันนั้น{name}จับอะไรก็อุ่น
      effects: { alignment: { moral: -1 }, flags: [debt_left_to_the_heir] }
    - id: sit_as_witness
      label: ลงชื่อในใบที่สาม ไปนั่งม้านั่งหน้าธนาคาร
      text: |
        ม้านั่งยาวหน้าธนาคารมีพยานรับจ้างนั่งอยู่แล้วสามคน คนหนึ่งหลับ คนหนึ่งกินถั่ว อีกคนนับนกพิราบบนหลังคาฝั่งตรงข้าม {name}นั่งลงปลายม้านั่ง ภายในวันแรกได้ลงชื่อเป็นพยานให้สัญญาเจ็ดฉบับ ไม่มีฉบับไหนที่คนกู้ก้มอ่านบรรทัดสุดท้าย

        ฉบับที่แปดเป็นของแม่ค้าผักที่{name}ซื้อของด้วยทุกตลาด นางยื่นปากกาให้{name}ลงชื่อเป็นพยาน แล้วยิ้มให้ เพราะอย่างน้อยพยานก็เป็นคนรู้จัก
      effects: { stats: { WIS: 1 }, alignment: { law: 1 }, reputation: { belek_bank: 1 }, flags: [working_off_the_surety] }

# ===================== horned_child ลูกมีเขา =====================

- id: adult.arc_horned_child_1_the_lamp_walk
  stage: adult
  weight: 30
  arc: { id: horned_child, step: 1 }
  cast:
    kid: { kin: [child], horned: true, pick: eldest, min_age: 6, max_age: 13 }
  when:
    age: [30, 50]
    flags: [child_horned]
  text: |
    ศาสนจักรตะเกียงเดินถนนทุกต้นปี นักบวชเวรัสสองคนถือตะเกียงแขวนนำหน้า เคาะประตูทีละบ้าน ยกตะเกียงอวยพรเตาของบ้าน แล้วเปิดสมุดเล่มหนาจดหน้าคนที่อยู่ในบ้าน ปีนี้มีคนที่สามเดินตามมาด้วย เสื้อคลุมสีเทาเข้ม ไม่ถือตะเกียง ถือแต่สมุดเล่มเล็ก บ้านไหนมีเด็ก เขาเป็นคนก้มลงไปดูหน้าเด็กเอง

    ขบวนเริ่มจากหัวถนนตั้งแต่สาย เสียงเคาะ เสียงสวด เสียงประตูปิด ลอยมาตามถนนทีละบ้าน อีกสามหลังจะถึงบ้านของ{name}

    {kid}โตพอจะรู้แล้วว่าคนเสื้อเทาคือใคร และโตพอที่คนเสื้อเทาจะเห็น{kid:เขา|เธอ}ชัดกว่าปีก่อนๆ {kid}ยืนอยู่ข้างหน้าต่าง มือข้างหนึ่งกำชายเสื้อ ถามเบาๆ ว่าปีนี้ต้องทำเหมือนปีที่แล้วไหม
  choices:
    - id: out_the_back
      label: ส่ง{kid}ออกประตูหลังไปอยู่บ้านคนที่ไว้ใจจนขบวนผ่านไป
      text: |
        {kid}ลอดรั้วหลังบ้านไปทางลานตากผ้า ก่อนเสียงเคาะจะมาถึงประตู คนเสื้อเทาก้าวเข้ามาในบ้าน ดูเตา ดูมุมห้อง ดูรองเท้าคู่เล็กข้างประตู แล้วเปิดสมุดเล่มเล็กของเขา พลิกหาหน้าบ้านนี้ ไล่นิ้วลงมาตามบรรทัด หยุดนิ้วไว้บรรทัดหนึ่ง แล้วปิดสมุด

        {kid}กลับมาตอนพลบค่ำ ผมมีแป้งติด เพราะซ่อนอยู่ในห้องเก็บแป้งของร้านขนมปังทั้งบ่าย ไม่ได้ถามว่าคนเสื้อเทาพูดอะไร ถามแค่ว่าปีหน้าเขาจะมาอีกไหม
      effects: { flags: [kept_child_out_of_sight] }
    - id: pack_and_go
      label: เก็บของขึ้นเกวียนตั้งแต่คืนนั้น ย้ายไปที่ที่ไม่มีใครรู้จัก
      text: |
        เกวียนเช่าออกจากถนนตอนตีสาม ของทั้งบ้านขึ้นได้เล่มเดียว เหลือที่ให้{kid}นอนบนกองผ้าห่ม เจ้าของเกวียนไม่ถามว่าทำไมต้องออกตอนมืด เขาคิดเงินเพิ่มหนึ่งเหรียญแทนการถาม

        ที่ใหม่อยู่ห่างไปสามวันเดิน ถนนแคบกว่า เตาเล็กกว่า ไม่มีใครรู้ชื่อของใครในบ้าน{name} คืนแรก{kid}นอนไม่หลับ ลุกขึ้นมานั่งนับเสียงคนเดินผ่านหน้าบ้าน ไม่มีเสียงไหนหยุด
      effects: { gold: -3, stats: { CON: 1 }, flags: [fled_with_the_horned_child] }
    - id: stand_at_the_door
      label: เปิดประตูรอ ให้{kid}ยืนข้างกันตอนขบวนมาถึง
      text: |
        {name}เปิดประตูกว้างก่อนนักบวชจะยกมือเคาะ {kid}ยืนชิดขาของ{name} ไม่มีผ้าคลุมหัว นักบวชตะเกียงสองคนชะงักไปครึ่งก้าว คนเสื้อเทาก้าวผ่านทั้งสองคนเข้ามา ย่อตัวลงจนหน้าอยู่ระดับเดียวกับหน้าเด็ก ดูนาน แล้วจดอะไรลงสมุดเล่มเล็ก

        ตลอดทางที่ขบวนเดินต่อไปท้ายถนน บ้านฝั่งตรงข้ามเปิดหน้าต่างค้างไว้ทุกบาน คืนนั้นมีคนเอาไข่มาวางหน้าประตูหกฟอง ไม่มีชื่อ เช้าวันต่อมามีคนเอาโคลนมาป้ายกรอบประตู ไม่มีชื่อเหมือนกัน
      effects: { alignment: { moral: 1 }, reputation: { lamp_church: -1 }, flags: [stood_at_the_door_with_child] }
    - id: send_east
      label: ส่ง{kid}ไปอยู่บ้านหญ้าขมในแดนเถ้า หมู่บ้านที่คนมีเขาอยู่กันทั้งหมู่บ้าน
      text: |
        ขบวนถ่านขากลับรับคนโดยสารท้ายขบวน ตั๋วถูกกว่าขบวนคน {name}จ่ายสองเหรียญ ห่อผ้าให้{kid}หนึ่งห่อ ฝากจดหมายไปถึงคนคุมเวรกวาดเถ้าของหมู่บ้านที่ไม่เคยเห็นหน้า ตอนขบวนออก{kid}ไม่ร้องไห้ โบกมือจนรถไฟพ้นโค้ง

        จดหมายฉบับแรกจากบ้านหญ้าขมมาถึงก่อนหน้าหนาว ลายมือของ{kid}เอง เบี้ยวทุกบรรทัด เขียนว่าที่นี่หลังคามุงแผ่นหิน เถ้าตกจากฟ้าเหมือนหิมะ ไม่มีใครในหมู่บ้านคลุมหัว ท้ายจดหมายวาดรูปคนสองคนยืนบนหลังคา ทั้งสองคนมีเขา
      effects: { gold: -2, arc: { id: horned_child, close: true }, flags: [sent_child_to_the_ash_village, child_lives_away] }
    - id: comb_over_the_stumps
      label: หวีผมให้ปิดตอเขา แล้วให้{kid}ยืนรับพรเหมือนเด็กคนอื่น
      requires: { flag: child_horns_sawn }
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ชวนนักบวชคุยเรื่องเตาที่ควันย้อนทั้งหน้าหนาว ชวนจนเขาหันไปดูปล่องเอง นักบวชยกตะเกียงอวยพรเตา อวยพร{name} แล้วยกขึ้นใกล้หน้าผากของ{kid}เท่าเด็กทุกคน ไม่ได้วางมือ คนเสื้อเทามองหน้าเด็กครั้งเดียว ไม่ได้มองหัว

          ขบวนออกไปแล้ว{kid}ยังยืนนิ่งตรงเดิม ผมที่หวีปิดไว้ไม่มีเส้นไหนเลื่อน {name}เพิ่งเห็นว่ามือของตัวเองกำหวีไว้แน่นจนฟันหวีหักไปสองซี่
        effects: { stats: { CHA: 1 }, flags: [kept_child_out_of_sight, passed_the_lamp_blessing] }
      failure:
        text: |
          คนเสื้อเทาไม่ได้มองหน้าเด็ก เขาวางฝ่ามือลงบนหัว{kid}เบาๆ เหมือนคนลูบหัวหลานชาวบ้าน นิ้วกลางของเขาหยุดอยู่ตรงตอเขาข้างซ้าย กดลงนิดหนึ่ง แล้วเลื่อนไปหาข้างขวา เจอเหมือนกัน

          เขาจดลงสมุดเล่มเล็กหนึ่งบรรทัด ไม่ถามอะไร ขบวนเดินต่อไป คืนนั้น{kid}ถามว่าคนเสื้อเทาจดว่าอะไร {name}บอกว่าไม่รู้
        effects: { reputation: { lamp_church: -1 }, flags: [kept_child_out_of_sight, lamp_hand_found_the_stumps] }
    - id: the_old_hiding_place
      label: ให้{kid}ลงไปในที่ซ่อนเดิมใต้พื้นครัว
      requires: { flag: child_hidden }
      text: |
        ช่องใต้พื้นครัวเคยใหญ่พอให้{kid}นอนเหยียดตัวได้ตอนยังเล็ก ปีนี้ต้องนั่งคุดเข่าชิดคาง {name}ปิดแผ่นกระดาน วางกระสอบหัวหอมทับ แล้วไปเปิดประตูให้ขบวน คนเสื้อเทาเดินวนในครัวช้าๆ หยุดยืนบนแผ่นกระดานแผ่นนั้นนานเท่าหายใจสามครั้ง ดูหม้อบนเตา แล้วเดินออกไป

        {kid}ขึ้นมาตอนขบวนพ้นท้ายถนน ขาชาจนยืนไม่ได้ นั่งถูเข่าอยู่บนพื้นครัว บอกว่าปีหน้าคงลงไปไม่ได้แล้ว พูดเหมือนเล่าเรื่องรองเท้าที่คับ
      effects: { flags: [kept_child_out_of_sight, outgrew_the_hiding_place] }
    - id: show_the_register
      label: บอกคนเสื้อเทาให้เปิดหน้าผู้ต้องตราดูเอง ชื่อ{kid}อยู่ในนั้นแล้ว
      requires: { flag: child_horns_kept }
      text: |
        คนเสื้อเทาเปิดสมุดเล่มเล็กไปหน้าท้ายเล่ม ไล่นิ้วจนเจอชื่อ{kid} เทียบกับหน้าเด็กที่ยืนอยู่ตรงหน้า แล้วถามหนึ่งในสามคำถาม ฝันถึงใคร {kid}ตอบว่าฝันถึงหมาบ้านข้างๆ ที่ตายไปเมื่อหน้าร้อน เขาจดคำตอบ

        นักบวชตะเกียงอวยพรเตาเหมือนบ้านอื่นทุกบ้าน ก่อนออกจากบ้าน คนเสื้อเทาบอกว่าบ้านที่ลงชื่อไว้ไม่ต้องรอหน้าประตูก็ได้ {name}บอกว่ารอเพราะอยากรอ
      effects: { alignment: { law: 1 }, flags: [stood_at_the_door_with_child, child_named_at_the_door] }

- id: adult.arc_horned_child_2_the_haircut
  stage: adult
  weight: 30
  arc: { id: horned_child, step: 2 }
  cast:
    kid: { kin: [child], horned: true, pick: eldest }
  text: |
    {kid}หายไปจากบ้านตั้งแต่เช้า กลับมาตอนเที่ยงพร้อมกรรไกรตัดผ้าของบ้านในมือ ผมของ{kid:เขา|เธอ}สั้นเกรียนจนเห็นหนังหัว ตัดเองหน้าโอ่งน้ำ ข้างซ้ายสั้นกว่าข้างขวา เศษผมยังติดคอเสื้อ ทุกอย่างที่ผมเคยปิดไว้ ไม่ว่าครึ่งหนึ่งหรือทั้งหมด ตอนนี้อยู่กลางแดด

    คนขายผักปากซอยมาถึงก่อน{kid}ครู่หนึ่ง เล่าว่าเห็นเดินผ่านตลาดไปสองรอบ ช้าๆ ไม่ก้มหน้า เด็กบางคนวิ่งตาม บางคนวิ่งหนี แม่ค้าผ้าคนหนึ่งดึงผ้าใบปิดแผงตัวเองลงมาครึ่งแผง

    {kid}วางกรรไกรลงบนโต๊ะ บอกว่าไม่ได้ทำเพราะใครท้า ทำเพราะเบื่อ เบื่อที่ต้องคิดเรื่องหัวตัวเองทุกครั้งที่ลมพัด
  choices:
    - id: even_it_out
      label: หยิบกรรไกรมาเล็มให้สองข้างเท่ากัน
      text: |
        {name}ให้{kid}นั่งบนเก้าอี้หน้าบ้าน ตรงที่คนเดินผ่านเห็น ปูผ้ารองบ่า แล้วเล็มทีละนิด ข้างขวาลงมาให้เท่าข้างซ้าย คนเดินผ่านชะลอฝีเท้า บางคนหยุด {name}ไม่หยุดเล็ม

        เสร็จแล้ว{kid}ลูบหัวตัวเองจากหน้าผากไปถึงท้ายทอย ผ่านทุกอย่างที่อยู่บนนั้น แล้วบอกว่าเย็นดี {name}สะบัดผ้ารองบ่า เศษผมปลิวไปตกกลางถนน
      effects: { stats: { DEX: 1 }, flags: [evened_the_childs_haircut] }
    - id: wrap_it_again
      label: ดุ แล้วพันผ้าโพกหัวให้ก่อนออกจากบ้านทุกครั้งจนกว่าผมจะยาว
      text: |
        {kid}ยืนให้พันโดยไม่เถียง ผ้าผืนเดิมที่ใช้มาหลายปีหลวมไปแล้วกับหัวที่ไม่มีผม ต้องพันสามรอบแทนสองรอบ ทุกเช้า{name}เป็นคนพัน ทุกเย็น{kid}เป็นคนแกะ แล้ววางผ้าพับไว้บนโต๊ะเรียบร้อยเกินไป

        ผมงอกกลับมาเต็มหัวในครึ่งปี เช้าวันที่ผมยาวพอปิดได้อีกครั้ง{kid}พันผ้าเอง พันแน่นกว่าที่{name}เคยพันให้ แล้วออกจากบ้านไปโดยไม่ได้ลา
      effects: { alignment: { law: 1 }, flags: [wrapped_the_child_again] }
    - id: shutters_closed
      label: ปิดหน้าต่างทุกบาน ให้{kid}อยู่ในบ้านจนถนนลืม
      requires: { flag: kept_child_out_of_sight }
      text: |
        บ้านปิดหน้าต่างอยู่ครึ่งเดือน ในบ้านมืดตั้งแต่บ่าย {kid}นั่งอยู่ข้างเตา ปะเสื้อทุกตัวในบ้าน ทั้งตัวที่ขาดและตัวที่ไม่ขาด คนขายผักปากซอยมาเคาะถามว่าเด็กไม่สบายหรือ {name}บอกว่าเป็นไข้

        ถนนลืมช้ากว่าที่คิด เดือนต่อมาเด็กในซอยยังเล่นเกมใหม่กันอยู่ เกมที่คนหนึ่งเอานิ้วชี้สองนิ้วตั้งบนหัวแล้ววิ่งไล่คนอื่น {kid}ได้ยินเสียงหัวเราะลอดหน้าต่างทุกบ่าย แล้วปะเสื้อตัวต่อไป
      effects: { stats: { WIS: 1 }, flags: [kept_the_shutters_closed] }
    - id: no_more_moving
      label: ถาม{kid}ว่าจะให้ย้ายอีกไหม
      requires: { flag: fled_with_the_horned_child }
      text: |
        {kid}บอกว่าไม่ ย้ายมาครั้งหนึ่งแล้วก็ยังต้องตัดผม ย้ายอีกก็ต้องตัดอีก ที่นี่อย่างน้อยรู้แล้วว่าร้านไหนดึงผ้าใบปิด ร้านไหนไม่ดึง

        {name}ไม่ได้ขนของลงจากหิ้ง หีบที่เคยเก็บไว้ใต้เตียงเผื่อต้องหนีอีก{name}เอาออกมาใส่ฟืนแทน ปลายเดือนแม่ค้าผ้าคนนั้นยกผ้าใบแผงตัวเองขึ้นตอนที่{kid}เดินผ่าน ยกขึ้นแค่ครึ่งเดียว
      effects: { alignment: { moral: 1 }, flags: [stopped_running_with_the_child] }
    - id: walk_the_market_together
      label: พรุ่งนี้เช้าเดินตลาดไปด้วยกัน ตามทางเดิมที่{kid}เดินมา
      requires: { flag: stood_at_the_door_with_child }
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}เดินช้ากว่าปกติ หยุดถามราคาทุกแผง ซื้อหัวหอมสามแผง ซื้อเกลือสองแผง {kid}ถือตะกร้าเดินข้างๆ แม่ค้าผ้าคนนั้นยังดึงผ้าใบลงครึ่งแผง {name}หยุดหน้าแผงนั้น ถามราคาผ้าฝ้ายสีเทาหนึ่งผืน นางตอบราคาโดยไม่ยกผ้าใบขึ้น {name}จ่ายตามราคาที่บอก

          รอบที่สองที่เดินผ่าน ผ้าใบแผงนั้นยกขึ้นแล้ว นางอาจยกเพราะแดดหมดเท่านั้นเอง
        effects: { stats: { CHA: 1 }, flags: [walked_the_market_with_child] }
      failure:
        text: |
          ครึ่งทางตลาด เด็กผู้ชายกลุ่มหนึ่งเดินตามมาข้างหลัง ร้องเพลงล้อที่แต่งเองเสร็จเมื่อวาน ท่อนเดียววนซ้ำ {name}หันไปดุ เด็กวิ่งหนีแล้ววนกลับมาร้องอีก {kid}ดึงแขนเสื้อ{name}ให้เดินต่อ

          ขากลับ{kid}ร้องเพลงนั้นเองเบาๆ ทั้งทาง จำได้ครบทุกคำ ร้องเพี้ยนไปจากที่เด็กกลุ่มนั้นร้องนิดหนึ่ง เพี้ยนตรงคำที่ด่า
        effects: { flags: [walked_the_market_with_child, market_song_about_the_child] }

- id: adult.arc_horned_child_3_the_shoe
  stage: adult
  weight: 30
  arc: { id: horned_child, step: 3 }
  cast:
    kid: { kin: [child], horned: true, pick: eldest, min_age: 13 }
  text: |
    {kid}เก็บค่าแรงไว้ในรองเท้าเก่าใต้เตียงมาหลายเดือน {name}รู้วันที่รองเท้าคู่นั้นหนักจนเตะแล้วไม่ขยับ แต่ไม่ได้ถาม

    คืนนี้{kid}เทเหรียญลงบนโต๊ะกินข้าว นับให้ดูทีละเหรียญ พอดีค่าตั๋วขบวนถ่านไปตะวันออกหนึ่งที่ ไปถึงบ้านหญ้าขม ที่ที่คนมีเขาอยู่กันทั้งหมู่บ้าน หลังคามุงแผ่นหิน และไม่มีใครต้องคิดเรื่องหัวตัวเองเวลาลมพัด

    "ยังไม่ได้ซื้อ" {kid}ว่า แล้วกวาดเหรียญเข้ากองกลางโต๊ะ "อยากให้บอกว่าซื้อ หรือบอกว่าอย่าซื้อ ไม่อยากให้บอกว่าแล้วแต่"
  choices:
    - id: buy_it_together
      label: ไปสถานีด้วยกันพรุ่งนี้เช้า ซื้อตั๋วให้เอง
      text: |
        คนขายตั๋วมองหัวของ{kid}แล้วมองเหรียญ ไม่ถามอะไร ขบวนถ่านออกตอนสาย ตู้โดยสารท้ายขบวนมีคนนั่งอยู่แล้วสองคน คนหนึ่งมีเขาโค้งไปข้างหลัง ยกมือทัก{kid}เหมือนคนรู้จักกันมานาน

        {name}ยืนอยู่บนชานชาลาจนขบวนพ้นโค้ง เหรียญที่{kid}นับให้ดูเมื่อคืนยังอยู่ในกระเป๋าของ{name}ครบ เพราะ{name}จ่ายค่าตั๋วด้วยเงินของตัวเอง แล้วแอบใส่ของ{kid}คืนลงในห่อผ้า ห่อนั้นไปถึงตะวันออกพร้อมเหรียญสองกอง
      effects: { gold: -2, alignment: { moral: 1 }, flags: [horned_child_went_east, child_lives_away] }
    - id: stay_and_be_seen
      label: บอกว่าอย่าซื้อ อยู่ที่นี่ แล้วไม่ต้องคลุมอะไรอีก
      text: |
        {kid}เก็บเหรียญกลับใส่รองเท้า ถามว่าไม่ต้องคลุมจริงๆ หรือ {name}บอกว่าจริง แล้วหยิบผ้าโพกหัวผืนเก่าที่พับไว้บนหิ้ง ใส่ลงเตาไปต่อหน้า

        เช้าวันต่อมา{kid}ไปทำงานโดยไม่มีอะไรบนหัว ตอนเย็นกลับมาเล่าว่าโดนคนเดินชนไหล่สองครั้ง ครั้งหนึ่งตั้งใจ ครั้งหนึ่งไม่ตั้งใจ แล้วกินข้าวหมดสองชาม
      effects: { reputation: { lamp_church: -1 }, flags: [horned_child_stays_and_is_seen] }
    - id: stay_as_before
      label: บอกว่าอยู่ แต่ให้อยู่แบบเดิม ปิดไว้อย่างที่ทำมา
      requires: { flag: kept_child_out_of_sight }
      text: |
        {kid}ฟังจนจบ ไม่เถียง กวาดเหรียญกลับใส่รองเท้า แล้ววางรองเท้าคืนใต้เตียงตรงรอยฝุ่นเดิม {name}เห็นว่า{kid:เขา|เธอ}จัดให้ปลายรองเท้าหันออก ไม่ได้หันเข้าผนังเหมือนเมื่อก่อน

        ทุกเช้าหลังจากนั้น{kid}ยังคลุมหัวก่อนออกจากบ้าน คลุมเร็วขึ้นทุกวันจนไม่ต้องดูกระจก แต่รองเท้าใต้เตียงคู่นั้นยังหนักขึ้นเรื่อยๆ
      effects: { alignment: { law: 1 }, flags: [horned_child_stays_hidden] }
    - id: the_check_alone
      label: พาไปถึงประตูห้องตรวจ แล้วยืนรอข้างนอกให้{kid}ตอบเอง
      requires: { flag: child_horns_kept }
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ปีนี้คือปีที่เด็กในหน้าผู้ต้องตราต้องเข้าไปตอบนักล่าแม่มดเองโดยไม่มีพ่อแม่ยืนข้าง {name}ยืนนอกประตูไม้หนา ได้ยินแต่เสียงพึมพำ ไม่ได้ยินคำ สามคำถาม ฝันถึงใคร ได้ยินเสียงอะไรตอนกลางคืน ไปที่ไหนมาบ้าง {name}ไม่ได้เดินไปเดินมา ไม่ได้แนบหูกับประตู

          {kid}ออกมาเร็วกว่าคนก่อนหน้า บอกว่าตอบไปหมดแล้ว ตอบตามจริง แล้วทิ้งเหรียญในรองเท้าลงกล่องของวิหารที่หน้าประตู ทีละเหรียญ จนหมด
        effects: { stats: { WIS: 1 }, flags: [horned_child_stays_and_is_seen, child_answered_alone] }
      failure:
        text: |
          {name}ยืนรอได้ไม่ถึงครึ่ง ก็ผลักประตูเข้าไป นักล่าแม่มดเงยหน้าขึ้นจากสมุด {kid}หันมาด้วยหน้าที่{name}ไม่เคยเห็นมาก่อน นักล่าแม่มดบอกให้ผู้ปกครองออกไป และจดลงสมุดว่าผู้ปกครองเข้ามากลางการตรวจ

          ขากลับ{kid}เดินนำหน้าไปตลอดทาง ห่างสิบก้าว คืนนั้นรองเท้าใต้เตียงหนักขึ้นอีกสองเหรียญ แต่{kid}บอกว่าจะอยู่ ไม่ไปไหน
        effects: { reputation: { lamp_church: -1 }, flags: [horned_child_stays_and_is_seen, walked_into_the_check] }

# ===================== pupil ศิษย์ =====================

- id: adult.arc_pupil_1_tilva
  stage: adult
  weight: 9
  arc: { id: pupil, step: 1 }
  when:
    age: [40, 58]
  text: |
    เด็กผู้หญิงคนหนึ่งมานั่งอยู่ตรงที่{name}ทำงานทุกเช้า ครึ่งเดือนแล้ว มาก่อน{name}ทุกวัน ไม่ขออะไร นั่งดูมือ ข้อมือยังเล็กกว่าด้ามไม้กวาด เล็บกัดจนกุด นิ้วโป้งข้างขวามีแผลพุพองที่ยังไม่หาย แผลแบบคนที่ลองทำอะไรเองที่บ้านด้วยของที่ไม่ใช่ของสำหรับงานนั้น

    วันที่สิบหก นางลุกขึ้นมายืนตรงหน้า บอกว่าชื่อทิลวา แม่ขายผักดองอยู่ท้ายตลาด นางเคยไปขอเรียนงานกับคนอื่นมาแล้วสามคน ทุกคนไล่กลับเพราะนางเถียง นางอยากเรียนงานของ{name} ไม่ใช่งานไหนก็ได้ งานนี้ แล้วนางก็ทำท่าที่{name}ทำทุกเช้าให้ดู ทีละขั้น ด้วยมือเปล่า ผิดสองขั้น ถูกหมดที่เหลือ

    ในถิ่นมีคนที่ทำงานแบบเดียวกับ{name}อีกคนหนึ่ง เก่งกว่า มีชื่อกว่า และรับศิษย์ปีละคน
  choices:
    - id: take_her
      label: บอกให้มาพรุ่งนี้ก่อนสาง ไม่ต้องนั่งดูแล้ว ให้มาทำ
      text: |
        ทิลวามาถึงตอนฟ้ายังมืด ยืนรออยู่ก่อนแล้ว {name}ให้งานที่น่าเบื่อที่สุดก่อน ทำซ้ำทั้งวัน นางทำจนมือแดง ไม่บ่น พอตกเย็นนางถามว่าทำไมต้องทำแบบนั้น ไม่ทำอีกแบบที่เร็วกว่า {name}ตอบไม่ได้ทันที

        คืนนั้น{name}นอนคิดอยู่นานว่าทำไมทำแบบนั้นมาทั้งชีวิต แล้วนึกออกตอนใกล้รุ่ง ว่ามีคนสอนมาแบบนั้น และคนนั้นก็คงไม่เคยถาม
      effects: { people: [{ id: pupil, name: ทิลวา, gender: f, bond: friend, closeness: 1, age: 14 }], stats: { INT: 1 }, flags: [took_a_pupil] }
    - id: one_small_job
      label: ให้ลองงานชิ้นเล็กชิ้นเดียวก่อน แล้วค่อยตัดสิน
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ทิลวาทำงานชิ้นนั้นผิดตั้งแต่ขั้นแรก ผิดแบบเดียวกับที่{name}เคยทำผิดในวันแรกของตัวเอง แล้วนางก็แก้เองโดยไม่มีใครบอก แก้ผิดไปอีกทาง แต่เป็นทางที่คนเคยดูมาแล้วเท่านั้นถึงจะคิดออก {name}เห็นว่านางไม่ได้นั่งดูมือเฉยๆ ตลอดครึ่งเดือน นางนั่งจำ

          {name}บอกให้มาพรุ่งนี้ ทิลวาไม่ขอบคุณ ถามว่ากี่โมง
        effects: { people: [{ id: pupil, name: ทิลวา, gender: f, bond: friend, closeness: 1, age: 14 }], stats: { WIS: 1 }, flags: [took_a_pupil, tested_the_pupil_first] }
      failure:
        text: |
          ทิลวาทำของชิ้นนั้นเสียทั้งชิ้น เสียแบบที่ต้องทิ้ง {name}บอกว่าเสียไปหนึ่งเหรียญ นางเถียงว่าเครื่องมือของ{name}ไม่ดี ไม่ใช่มือนาง เถียงจนเสียงแหบ

          {name}นึกถึงตัวเองในวันแรก วันที่เถียงครูของตัวเองด้วยประโยคเดียวกันนี้ แล้วบอกให้นางมาพรุ่งนี้ ทั้งที่ยังโกรธอยู่ ทิลวาเก็บเศษของที่เสียใส่กระเป๋าเสื้อกลับบ้านไปด้วย
        effects: { gold: -1, people: [{ id: pupil, name: ทิลวา, gender: f, bond: friend, closeness: 1, age: 14 }], flags: [took_a_pupil, pupil_ruined_the_first_piece] }
    - id: send_her_on
      label: พาไปฝากกับคนที่เก่งกว่าในถิ่น
      text: |
        {name}พาทิลวาไปยืนหน้าบ้านคนคนนั้นตั้งแต่เช้า คุยกันอยู่นาน เขาไม่อยากรับเด็กที่เถียงสามครูมาแล้ว {name}บอกว่าเด็กที่เถียงคือเด็กที่ถาม เขารับ

        หลายปีต่อมา{name}ได้ยินชื่อทิลวาจากปากคนอื่น ในฐานะคนที่ทำงานแบบเดียวกับ{name} เก่งกว่า มีชื่อกว่า ทุกครั้งที่มีคนเล่า{name}บอกว่ารู้จัก เคยเห็นนางนั่งดูมืออยู่ครึ่งเดือน แล้วไม่ได้เล่าต่อว่าตัวเองไม่ได้รับไว้
      effects: { alignment: { moral: 1 }, arc: { id: pupil, close: true }, flags: [sent_the_pupil_on] }
    - id: the_first_apprentice_vouches
      label: เรียกลูกมือคนแรกที่เคยรับไว้มาดูเด็กคนนี้
      requires: { any_flags: [took_horned_apprentice, took_lame_apprentice] }
      text: |
        ลูกมือคนแรกโตแล้ว มีงานของตัวเอง แต่ยังมาเมื่อ{name}เรียก มายืนดูทิลวาทำท่าด้วยมือเปล่าอยู่ครู่หนึ่ง แล้วบอก{name}เบาๆ ว่าตอนมานั่งหน้าบ้าน{name}วันนั้น ตัวเองก็ทำท่าแบบนี้อยู่ในหัวทั้งคืน

        {name}รับทิลวา ลูกมือคนแรกสอนนางผูกปมเชือกแบบที่{name}สอนตัวเองเมื่อหลายปีก่อน สอนผิดไปหนึ่งปม {name}ไม่ได้แก้
      effects: { people: [{ id: pupil, name: ทิลวา, gender: f, bond: friend, closeness: 1, age: 14 }], alignment: { moral: 1 }, flags: [took_a_pupil, first_apprentice_vouched] }
    - id: hammer_for_a_day
      label: ให้จับค้อนหน้าทั่งหนึ่งวันเต็ม
      requires: { flag: job_smith }
      text: |
        ค้อนเล่มเบาที่สุดในร้านยังหนักเกินข้อมือของทิลวา ครึ่งเช้านางตีเหล็กเส้นแรกจนงอผิดมุม ครึ่งบ่ายนางเลิกเหวี่ยงแรง เริ่มปล่อยให้น้ำหนักค้อนตกลงเอง ตกเย็นเหล็กเส้นที่สามตรงพอใช้ได้ ฝ่ามือนางพองทั้งสองข้าง

        {name}เอาน้ำมันหมูทาให้ บอกว่าพรุ่งนี้แผลจะแตก มะรืนจะด้าน ทิลวาถามว่าด้านแล้วจะไม่เจ็บอีกไหม {name}ชูฝ่ามือตัวเองให้ดู
      effects: { people: [{ id: pupil, name: ทิลวา, gender: f, bond: friend, closeness: 1, age: 14 }], stats: { STR: 1 }, flags: [took_a_pupil, pupil_at_the_anvil] }
    - id: sing_it_back
      label: ร้องท่อนหนึ่งให้ฟังครั้งเดียว แล้วให้ร้องกลับ
      requires: { flag: job_house_singer }
      text: |
        {name}ร้องท่อนที่ยากที่สุดที่ร้องอยู่ทุกคืน ท่อนที่เสียงต้องขึ้นแล้วค้างโดยไม่สั่น ทิลวาร้องกลับ ค้างไม่ถึงครึ่ง เสียงแตก แต่ทุกคำถูก ทุกจังหวะถูก รวมทั้งจังหวะหายใจที่{name}แอบเปลี่ยนเองเมื่อหลายปีก่อนและไม่เคยบอกใคร

        {name}ถามว่าได้ยินจังหวะหายใจนั้นจากไหน นางบอกว่านั่งฟังอยู่หลังร้านเหล้าทุกคืนตั้งแต่หน้าฝน หายใจตามจนชิน
      effects: { people: [{ id: pupil, name: ทิลวา, gender: f, bond: friend, closeness: 1, age: 14 }], stats: { CHA: 1 }, flags: [took_a_pupil, pupil_learns_the_songs] }
    - id: the_back_way
      label: พาเดินทางลับที่ใช้ขนของหนึ่งรอบ แล้วให้เดินกลับเองคนเดียว
      requires: { flag: job_smuggler }
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}พาเดินตอนดึก ผ่านรั้ว ผ่านรางน้ำ ผ่านหลังคาโรงเก็บของสองหลัง ไม่บอกว่าตรงไหนต้องระวัง ทิลวาเดินตามโดยไม่ถาม แล้วเดินกลับคนเดียว ถึงก่อน{name}ครึ่งชั่วยาม เพราะนางตัดผ่านลานซักผ้าที่{name}ไม่เคยรู้ว่าเดินผ่านได้

          {name}เดินผ่านลานซักผ้านั้นในคืนถัดมา เงียบกว่าทางเดิม เร็วกว่าทางเดิม แล้วรับทิลวาไว้
        effects: { people: [{ id: pupil, name: ทิลวา, gender: f, bond: friend, closeness: 1, age: 14 }], stats: { DEX: 1 }, flags: [took_a_pupil, pupil_found_a_shorter_way] }
      failure:
        text: |
          ครึ่งทางกลับ ทิลวาเหยียบแผ่นสังกะสีบนหลังคาโรงเก็บของ เสียงดังไปสามซอย หมาเห่าทั้งถนน {name}ต้องปีนลงไปลากนางหลบอยู่ในรางน้ำจนยามเดินผ่าน เข่าซ้ายของ{name}กระแทกขอบรางจนบวม

          ทิลวาขอโทษไม่หยุดตลอดทางกลับ {name}บอกให้หุบปาก แล้วบอกให้มาพรุ่งนี้ นางเงียบไปทันที
        effects: { hp: -1, people: [{ id: pupil, name: ทิลวา, gender: f, bond: friend, closeness: 1, age: 14 }], flags: [took_a_pupil, pupil_on_the_tin_roof] }

- id: adult.arc_pupil_2_the_deposit
  stage: adult
  weight: 30
  arc: { id: pupil, step: 2 }
  cast:
    pupil: { id: pupil }
  text: |
    หลายปีที่{pupil}ทำงานกับ{name} มือของ{pupil:เขา|นาง}เร็วขึ้นทุกฤดู ปากก็เร็วขึ้นด้วย คนที่มาจ้างบางคนเริ่มขอให้{pupil}ทำงานให้แทน{name}

    เช้านี้{name}เจอชายแก่คนหนึ่งนั่งรออยู่ตรงที่ทำงานตั้งแต่ฟ้ายังไม่สาง นั่งแบบคนที่มาหลายเช้าแล้ว เขาบอกว่าจ่ายมัดจำสองเหรียญให้{pupil}ไว้เมื่อครึ่งเดือนก่อน {pupil:เขา|นาง}รับปากว่างานจะเสร็จในสามวัน วันที่สี่ {pupil}บอกว่าเหลืออีกนิดเดียว วันที่แปดบอกอีกครั้ง เขาไม่ได้มาด่า เขามาถามว่าเงินสองเหรียญนั้นอยู่กับ{name}หรืออยู่กับเด็กคนนั้น

    {name}รู้คำตอบก่อนจะถาม{pupil} รู้เพราะเคยทำแบบเดียวกันตอนยังไม่โตเท่านี้ รับเงินของคนอื่นไว้ในมือด้วยคำสัญญาที่ใหญ่กว่างาน แล้วใช้เงินไปก่อนงานจะเสร็จ เพราะคิดว่าจะทำทัน {pupil}มาถึงพอดี เห็นชายแก่ แล้วหยุดเดิน
  choices:
    - id: tell_the_old_story
      label: เล่าเรื่องที่ตัวเองเคยทำให้{pupil}ฟัง ต่อหน้าชายแก่คนนั้น
      text: |
        {name}เล่าทุกอย่าง ชื่อของคนที่จ่ายมัดจำในวันนั้น ราคา จำนวนวันที่โกหก และวันที่ครูของ{name}รู้ {pupil}ฟังจนหน้าแดงถึงหู ชายแก่ฟังจนหัวเราะออกมาตรงตอนที่ครูของ{name}รู้

        {pupil}ทำงานของชายแก่ให้เสร็จภายในคืนนั้น ไม่ได้นอน ตอนเช้า{pupil:เขา|นาง}ถามว่าครูของ{name}ทำอะไรกับ{name}วันนั้น {name}บอกว่าให้ทำงานชิ้นนั้นฟรี แล้วให้ทำชิ้นต่อไปฟรีด้วย {pupil}ถามว่าแล้วตอนนี้ล่ะ {name}บอกว่าแค่ชิ้นเดียวก็พอ ยุคนี้ข้าวแพง
      effects: { stats: { WIS: 1 }, people: [{ id: pupil, closeness: 1 }], flags: [told_pupil_the_old_mistake] }
    - id: say_nothing_of_it
      label: ไม่เล่าเรื่องของตัวเอง สั่งให้{pupil}ใช้คืนจากค่าแรงทั้งเดือน
      text: |
        {name}จ่ายสองเหรียญคืนชายแก่ไปก่อน แล้วหักค่าแรงของ{pupil}ทั้งเดือน ไม่ด่า ไม่เทศน์ พูดแค่ว่าที่นี่ไม่รับเงินก่อนงาน {pupil}ฟังเหมือนฟังกฎที่ไม่มีใครเคยแหก

        เดือนนั้น{pupil}ทำงานเงียบกว่าปกติ กินข้าวกลางวันคนเดียว นั่งห่างออกไป ปลายเดือน{pupil:เขา|นาง}ถามขึ้นมาว่า{name}ไม่เคยทำอะไรแบบนี้เลยใช่ไหม {name}บอกว่าใช่ แล้วหยิบงานชิ้นต่อไปขึ้นมาทำ
      effects: { alignment: { law: 1 }, people: [{ id: pupil, closeness: -1 }], flags: [hid_the_old_mistake] }
    - id: pay_and_tell_later
      label: จ่ายคืนชายแก่จากกระเป๋าตัวเองก่อน แล้วเล่าให้{pupil}ฟังตอนค่ำ
      requires: { min_gold: 2 }
      text: |
        ชายแก่รับเงินคืน บอกว่าไม่ได้อยากได้เงิน อยากได้งาน แต่ก็เก็บเงินใส่กระเป๋า {name}รอจนเลิกงาน จุดตะเกียง แล้วเล่าเรื่องของตัวเองให้{pupil}ฟังสองต่อสอง เรื่องเดียวกัน ราคาเดียวกัน แต่ไม่มีคนนอกฟัง

        {pupil}ฟังแล้วถามว่าทำไมไม่เล่าตอนเช้า {name}บอกว่าตอนเช้าชายแก่คนนั้นยังไม่ได้เงินคืน {pupil}คิดอยู่นาน แล้วขอยืมกระดาษไปจดชื่อชายแก่ไว้ บอกว่าจะเอางานไปส่งให้ฟรีเมื่อทำเสร็จ
      effects: { gold: -2, stats: { CHA: 1 }, people: [{ id: pupil, closeness: 1 }], flags: [told_pupil_the_old_mistake, paid_back_the_deposit] }
    - id: make_them_tell_him
      label: ให้{pupil}อธิบายกับชายแก่เอง ต่อหน้า{name}
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ยืนอยู่ตรงนั้นไม่ช่วยพูด {pupil}เริ่มด้วยข้อแก้ตัวสองข้อ เห็นหน้า{name}แล้วหยุด เริ่มใหม่ด้วยความจริง เงินไปจ่ายค่าห้องของแม่ งานยังไม่ได้เริ่มเลย ชายแก่ฟังจนจบ ให้เวลาอีกสามวัน

          {pupil}ทำเสร็จในสองวัน ไม่เคยถาม{name}ว่าเคยทำแบบนี้ไหม {name}ก็ไม่เคยเล่า
        effects: { stats: { CHA: 1 }, flags: [hid_the_old_mistake, made_pupil_answer_for_it] }
      failure:
        text: |
          {pupil}พูดได้ไม่ถึงครึ่ง ข้อแก้ตัวก็กลายเป็นการเถียง ชายแก่ลุกขึ้นเอาไม้เท้าเคาะพื้น บอกว่าไม่ต้องทำแล้ว ขอเงินคืน แล้วไปเล่าให้ทั้งตลาดฟังว่า{name}เลี้ยงเด็กขี้โกง

          {name}จ่ายสองเหรียญคืนให้เอง สองเดือนต่อมายังมีคนที่จ้างกันมานานบางคนถามก่อนจ่ายเงินว่าใครจะเป็นคนทำ
        effects: { gold: -2, flags: [hid_the_old_mistake, old_man_told_the_market] }

- id: adult.arc_pupil_3_the_offer
  stage: adult
  weight: 30
  arc: { id: pupil, step: 3 }
  cast:
    pupil: { id: pupil }
  text: |
    หลายปีมานี้มีงานอย่างหนึ่งที่{pupil}ทำดีกว่า{name} ไม่ใช่ทุกอย่าง อย่างเดียว ตรงปลายงานที่ต้องใช้มือนิ่งและตาไว มือของ{name}เริ่มสั่นตรงนั้นตั้งแต่หน้าหนาวก่อน ส่วนมือของ{pupil}ไม่สั่น คนที่มาจ้างบางคนยอมรอสามวันเพื่อให้{pupil}เป็นคนทำส่วนนั้น

    บ่ายนี้มีคนแปลกหน้ามายืนดู{pupil}ทำงานอยู่ครึ่งบ่าย เสื้อผ้าดีกว่าคนที่มาจ้างทั่วไป รองเท้าไม่เปื้อนดินของถิ่นนี้ เขาทำงานอย่างเดียวกันนี้อยู่ในเมืองใหญ่ ที่ทางกว้างกว่า คนในมือมากกว่า เขาไม่ได้แอบ เขาพูดต่อหน้า{name}ว่ามาซื้อตัว ค่าแรงสามเท่า ห้องนอนของตัวเอง และภายในห้าปีคนทั้งเมืองจะเรียกหา{pupil}ด้วยชื่อ

    {pupil}วางเครื่องมือลง หันมาดู{name} ไม่ได้ดูคนจากเมืองคนนั้น
  choices:
    - id: ask_them_to_stay
      label: ขอให้อยู่ แล้วเสนอแบ่งรายได้ให้ครึ่งหนึ่ง
      text: |
        {name}พูดต่อหน้าคนจากเมืองว่าที่นี่ไม่มีห้องนอนให้ ไม่มีเมืองทั้งเมืองมาเรียกหา แต่ครึ่งหนึ่งของทุกเหรียญที่ได้ต่อจากวันนี้เป็นของ{pupil} คนจากเมืองหัวเราะ บอกว่าครึ่งหนึ่งของที่นี่ไม่เท่าค่าแรงเดือนเดียวที่เขาจ่าย

        {pupil}หยิบเครื่องมือขึ้นมาทำงานต่อจากตรงที่วางไว้ คนจากเมืองยืนดูอีกครู่หนึ่ง แล้วเดินไป ปลายเดือน{name}นับเงินแบ่งเป็นสองกองบนโต๊ะ กองของ{pupil}มากกว่าเพราะ{pupil:เขา|นาง}ทำงานมากกว่า
      effects: { gold: -2, people: [{ id: pupil, closeness: 1 }], flags: [pupil_stayed] }
    - id: bless_the_going
      label: บอกให้ไป แล้วยื่นเครื่องมือชิ้นที่ใช้มาทั้งชีวิตให้ติดมือไปด้วย
      text: |
        {pupil}ถามว่าแน่ใจหรือ {name}บอกว่าคนที่มือนิ่งกว่าครูควรได้ไปอยู่ที่ที่มีคนเห็นมือนั้น แล้วยื่นเครื่องมือชิ้นเก่าที่สุดที่มีให้ ด้ามสึกเป็นร่องตามนิ้วของ{name} นิ้วของ{pupil}ไม่ลงร่องสักนิ้ว

        {pupil}ไปกับเขาในเดือนนั้น ส่งของกินกลับมาทุกเทศกาล ไม่ได้เขียนอะไรแนบมา หลายปีต่อมามีคนเดินทางผ่านมาเล่าว่าได้ยินคนในเมืองเรียกหา{pupil}ด้วยชื่อ ยังไม่ทั้งเมือง แค่ถนนสองสามสาย
      effects: { stats: { WIS: 1 }, people: [{ id: pupil, closeness: 1 }], flags: [pupil_left_with_blessing] }
    - id: if_you_go_dont_come_back
      label: บอกว่าถ้าไป ไม่ต้องกลับมาที่นี่อีก
      text: |
        คนจากเมืองยิ้ม เหมือนได้ยินประโยคนี้มาหลายที่แล้ว {pupil}เก็บเครื่องมือของตัวเองใส่ห่อผ้า ห่อแน่น ทีละชิ้น ไม่หยิบของ{name}ไปสักชิ้น แล้วเดินออกไปโดยไม่หันกลับมา

        ตลอดหน้าหนาวนั้นงานส่วนปลายที่ต้องใช้มือนิ่ง{name}ต้องทำเอง มือสั่นตรงนั้นเหมือนเดิม คนที่เคยรอสามวันเลิกรอ บางคนถามว่า{pupil}ไปไหน {name}บอกว่าไปเมือง
      effects: { alignment: { law: 1 }, people: [{ id: pupil, closeness: -2 }], flags: [pupil_left_in_anger] }
    - id: show_what_is_left
      label: หยิบงานชิ้นที่ยากที่สุดออกมาวาง บอกว่ายังมีอีกหลายอย่างที่ยังไม่ได้สอน
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          งานชิ้นนั้น{name}เก็บไว้ใต้โต๊ะมาหลายปี ไม่เคยให้{pupil}แตะ ทั้งถิ่นมีแต่{name}ที่ทำได้ และทำได้แค่ครั้งเดียวในหลายเดือน {name}วางมันลงตรงหน้า{pupil} บอกว่าจะสอนให้หมด เริ่มพรุ่งนี้ ใช้เวลาเท่าไรก็ได้

          {pupil}ดูงานชิ้นนั้นนาน แล้วหันไปบอกคนจากเมืองว่ายังไม่ไป เขาทิ้งที่อยู่ไว้บนโต๊ะ เผื่อเปลี่ยนใจ {pupil}เอาแผ่นนั้นไปรองก้นหม้อ
        effects: { stats: { CHA: 1 }, people: [{ id: pupil, closeness: 1 }], flags: [pupil_stayed, showed_the_hardest_work] }
      failure:
        text: |
          {pupil}ดูงานชิ้นนั้น แล้วบอกเบาๆ ว่าเคยแอบทำตามเมื่อหน้าฝนก่อน ตอนที่{name}ไม่อยู่ ทำได้ครึ่งชิ้น ยังไม่ดีพอ แต่ทำได้ คนจากเมืองยิ้มกว้างขึ้น

          {pupil}ไปกับเขาในเดือนนั้น ก่อนไปมาขอโทษ ขอบคุณ แล้วขอโทษอีกครั้ง ที่ทำงานเงียบลงครึ่งหนึ่ง งานชิ้นที่ยากที่สุดยังอยู่ใต้โต๊ะ มีรอยมือของคนสองคน
        effects: { people: [{ id: pupil, closeness: 1 }], flags: [pupil_left_with_blessing, pupil_had_already_tried_it] }
