# ชุด อ องค์กร: หน่วยไส้ตะเกียง (wick) ไฟล์ ก ทางเข้า 4 เรื่อง กับงานของหน่วย 10 เรื่อง (งานเกิดซ้ำ 3 งานแบบตัวเลือก 5 การปะทะ 2)
# คนในชุดของตัวละคร (มีแต่ในข้อความ ไม่อยู่ในผังคน): ออสริค ผู้จุด หูซ้ายไม่ได้ยิน หันหูขวาให้คนพูด · ไซเวล ผู้ดับ หญิงชราที่จดงานไว้บนแถบผ้าพันข้อมือ
#   ทอร์เบน นายโรงน้ำมัน ตวงน้ำมัน ตวงเถ้า นับตะเกียงดำ · สิบเก้า คนเดินหน้าของชุด หญิงทีฟลิ่งจากแดนเถ้า (ชื่อเดิมเฉลยในไฟล์ ข)
# ข้อความไม่บอกว่าชุดประจำอยู่ถิ่นไหน งานที่ไม่กันยศต้องอ่านได้ตั้งแต่ผู้ถือน้ำมันถึงผู้ดับ จึงไม่มีตะเกียงดำตอนจุดต่อหน้าตัวละคร (ผู้ถือน้ำมันยังไม่เคยเห็น)
#   ยกเว้นตัวเลือกที่กัน min_rank 3 และไม่เขียนว่าออสริคถือตะเกียงดำอยู่ (ตัวละครรับต่อเมื่อขึ้นเป็นผู้จุด) คนตัดสินหน้างานเรียกว่า "ผู้จุด" ไม่เอ่ยชื่อ
# คนมีตรา (curse_brand) เป็นคนเดินหน้า สิ่งจากดาวมองไม่เห็น ฉากปะทะฝ่ายดาวกัน not_traits: [curse_brand] งานแบบตัวเลือกสามงานมีทางของคนมีตรา
# งานไม่ให้ผลงานเอง ระบบให้ +1 เมื่อทำ 0 เมื่อพลาด −1 เมื่อปัด · ตามล่า star_listeners +1: lead_chest (หลับที่โรงเตี๊ยม), refinery_night (ฟังเจอ)
# ตะเกียงดำ: lights_under_skin (hp −2), refinery_night (max_hp −1 ครั้งเดียวของชุด)
# คนที่มีแต่ในข้อความ: ลินนา ลูกสาวคนงานโรงกลั่น · โกเรล หัวหน้ากะโรงกลั่น · ยายแอมมิส ยายของบ้านช่างทำถัง · หญิงขาเป๋ที่หลักหินสามหลัก คนรับหีบตะกั่วช่วงถัดไป

# ---------- ทางเข้า ----------
- id: adult.wick_join_borrowed_priest
  stage: adult
  scene: home
  weight: 15
  time: night
  when:
    age: [20, 40]
    class: cleric
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [has_partner, has_child, has_ward, left_the_wick, broke_the_wick_vow]
    not_wears: [cold_iron]
  text: |
    กระดาษของวิหารใหญ่มีสองบรรทัด ยืมตัวนักบวชหนึ่งคืน คืนตัวตอนสาง ไม่มีชื่อบ้าน ไม่มีชื่อคนป่วย ตราตะเกียงที่มุมล่างหมึกยังเยิ้ม ชายที่ถือกระดาษมาหันหูขวาเข้าหา{name}ทุกครั้งที่รอคำตอบ หูซ้ายไม่เคยหันมาเลยตลอดทาง เขาชื่อออสริค

    บ้านหลังนั้นมีห้าคน พ่อ แม่ ยาย ลูกชายที่โตพอลงไร่ กับลูกสาวคนเล็กที่ยังนั่งตักแม่ได้ ทั้งห้านั่งเบียดกันที่โต๊ะครัว หลังคาเหนือเตามีรูเท่าบานหน้าต่าง อุดด้วยกระสอบเปียก ในครัวมีกลิ่นน้ำตาลไหม้ปนกลิ่นแก้วร้อน ข้างบนมีเสียงขอเหล็กลากไปบนไม้ เสียงถังวางลง แล้วก็ไม่มีเสียงอะไรอีก ลูกสาวคนเล็กดึงแขนเสื้อ{name} กระซิบว่าของที่ตกลงมามีมุมเยอะเกินไป นับเท่าไรก็ไม่ครบ

    ออสริคสั่งงานประโยคเดียว นั่งกับพวกเขา สวดอะไรก็ได้ที่{god}มี จนกว่าจะหลับครบทุกคน หญิงชราที่พันแถบผ้ารอบข้อมือหลายสิบรอบเทน้ำมันจากขวดฝาตีตราชอล์กลงตะเกียงดวงเล็กกลางโต๊ะ แล้วปิดหน้าต่างทีละบาน {name}สวดจนแม่ของบ้านหลับเป็นคนสุดท้าย หญิงชราแตะไหล่ให้ออกไปก่อนควันจะลงมาถึงระดับโต๊ะ ส่วนตัวนางนั่งอยู่ต่อ

    ตอนสาง ออสริควางตะเกียงสังกะสีดวงหนึ่งบนขั้นบันไดหน้าบ้าน ไส้ยังขาว ไม่เคยติดไฟ เขาบอกว่าคนนอกที่เห็นงานของคืนนี้มีสองทาง ลืม หรือตามมา
  choices:
    - id: swear_on_the_unlit_lamp
      label: วางมือบนตะเกียงที่ยังไม่จุด แล้วสาบาน
      text: |
        ออสริคพูดคำสาบานทีละข้อ ช้าพอให้{name}ทวนทัน ไปเมื่อหน่วยเรียก ไม่มีบ้านให้ใครตามไปถึง ไม่เล่าสิ่งที่เห็นให้ใครฟังนอกจากผู้จุดของตัวเอง สังกะสีใต้ฝ่ามือเย็นเหมือนเพิ่งยกขึ้นจากบ่อ หญิงชราที่ออกมาจากครัวตาแดงก่ำ ไอสองที แล้วขอชื่อ{name}ไปจดลงแถบผ้าเส้นใหม่

        นางบอกชื่อตัวเองว่าไซเวล หลังจากก้มอ่านจากแถบผ้าเส้นในสุดก่อน ตอนเกวียนน้ำมันออกจากหน้าบ้าน ยายของบ้านนั้นถือไม้กวาดออกมากวาดลาน ร้องบอกคนบนเกวียนว่าเมื่อคืนไข้ขึ้นกันทั้งบ้าน ถามว่าจะแวะกินน้ำร้อนก่อนไหม
      effects:
        org: { id: wick, join: true }
        traits: [oath_wick]
        mark: เข้าหน่วยไส้ตะเกียง
        reputation: { lamp_church: 1 }
        flags: [swore_as_a_borrowed_priest]
    - id: breathe_what_is_left
      label: กลับเข้าครัว นั่งในควันที่เหลือจนหลับ
      text: |
        ไซเวลเปิดประตูครัวแง้มพอให้ตัวลอด ควันเหลือเป็นชั้นบางใต้ขื่อ กลิ่นน้ำตาลไหม้หายไปแล้ว เหลือแต่กลิ่นน้ำมันตะเกียงธรรมดาที่มีในทุกบ้าน {name}นั่งลงข้างยายของบ้าน ก่อนตาจะปิด ได้ยินหญิงชราอ่านแถบผ้าที่ข้อมือเสียงเบา ทวนเป็นรายการ เหมือนคนจะไปตลาด

        {name}ตื่นมาตอนบ่าย ตัวร้อน คอแห้งผาก ในย่ามมีสองเหรียญที่จำไม่ได้ว่าได้มาจากใคร กับกระดาษของวิหารใหญ่ที่แถบล่างขาดหายไปครึ่งบรรทัด เหลือแต่คำว่ายืมตัว
      effects: { gold: 2, flags: [forgot_the_borrowed_night] }
    - id: hold_one_thing
      label: เข้าไปในควัน กำเครื่องหมายของ{god}ไว้แน่น ตั้งใจจำให้ได้สักอย่าง
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          {name}ตื่นมาพร้อมไข้ คืนนั้นหายไปทั้งคืนเหมือนน้ำซึมลงทราย เหลือประโยคเดียวติดอยู่ เสียงเด็กผู้หญิงที่ไม่รู้ว่าเป็นลูกใคร บอกว่ามีมุมเยอะเกินไป นับเท่าไรก็ไม่ครบ

          ตั้งแต่นั้น ทุกครั้งที่{name}นับของแล้วได้เลขไม่ตรงกับรอบก่อน ประโยคนั้นมาถึงก่อนตัวเลข
        effects: { stats: { WIS: 1 }, flags: [kept_one_thing_from_the_oil] }
      failure:
        text: |
          {name}ตื่นมาพร้อมไข้ กำมือแน่นจนนิ้วแข็ง กว่าจะแบออกได้ก็สาย ขอบเครื่องหมายของ{god}กดฝ่ามือเป็นรอยช้ำสีม่วง

          {name}ไม่รู้ว่ากำไว้ทำไม รอยช้ำหายในสามวัน ส่วนคืนที่หายไปไม่กลับมา
        effects: { hp: -1, flags: [forgot_the_borrowed_night] }
    - id: swear_to_keep_the_count
      label: สาบาน แล้วบอกออสริคว่าจะจำทุกบ้านที่หน่วยเอาคืนหนึ่งไป
      requires: { god: ossa }
      text: |
        นักบวชออสซาเรียกน้ำมันนี้ว่าการขโมยของจากประตู {name}รู้จักคำนี้ก่อนรู้ว่าน้ำมันแบบนี้มีอยู่จริง จึงบอกออสริคตรงๆ ว่าถ้าต้องมีคนขโมย ก็ต้องมีคนนับว่าขโมยอะไรไป ออสริคหันหูขวามาฟังจนจบ แล้วจับมือ{name}วางลงบนตะเกียงสังกะสีเอง ไม่ตอบสักคำ

        ห้าคน หนึ่งคืน รูบนหลังคาเท่าบานหน้าต่าง {name}ท่องสามอย่างนั้นบนเกวียนจนขึ้นใจ หญิงชราที่นั่งท้ายเกวียนฟังอยู่ตลอด คลายแถบผ้าเส้นหนึ่งออกจากข้อมือ ส่งให้{name}ไว้จดบ้านหลังถัดไป
      effects:
        org: { id: wick, join: true }
        traits: [oath_wick]
        mark: เข้าหน่วยไส้ตะเกียง
        stats: { INT: 1 }
        flags: [swore_to_keep_the_count]

- id: adult.wick_join_hold_the_door
  stage: adult
  scene: home
  weight: 15
  time: night
  when:
    age: [20, 40]
    any_flags: [war_veteran, job_mercenary, job_navy, job_bounty_hunter]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [has_partner, has_child, has_ward, left_the_wick, broke_the_wick_vow]
    not_wears: [cold_iron]
  text: |
    หญิงชราที่มาจ้างพูดเรื่องเงินก่อนเรื่องงาน สี่เหรียญต่อหนึ่งคืน จ่ายตอนสาง ข้อมือซ้ายของนางพันแถบผ้าหนาจนเป็นปลอก นางดึงปลายแถบเส้นหนึ่งขึ้นมาอ่าน แล้วถามว่า{name}เคยยืนในแถวที่ห้ามถอยไหม นางไม่ถามว่ายืนที่ไหน และไม่รอฟังว่ายืนกับใคร

    งานคือยืนหน้าประตูห้องเก็บของหลังบ้านหลังหนึ่งจนสาง ประตูไม้โอ๊กหนาสองนิ้ว กลอนเหล็กสองตัว ร่องใต้ประตูอุดผ้าชุบน้ำมัน ห้ามเปิด ห้ามตอบอะไรที่พูดออกมาจากข้างใน ใครผ่านมาถามให้บอกว่าข้างในมีคนเป็นไข้ หญิงชราบอกชื่อตัวเองว่าไซเวล ก่อนออกเสียงนางชะงักไปครึ่งจังหวะ เหมือนคนลองคำที่ไม่ค่อยได้ใช้

    ตีสาม เสียงหลังประตูเรียกชื่อ{name} เป็นเสียงของคนที่เคยยืนข้างกันในแถว ทุกพยางค์ตรง จังหวะหายใจก็ตรง เสียงนั้นขอน้ำ บอกว่าคอแห้ง ถามว่าทำไมคราวนั้นไม่หันมาดู {name}รู้แน่ว่าเจ้าของเสียงไม่ได้อยู่ในห้องนี้ และไม่มีทางอยู่ได้ เสียงพูดไปจนฟ้าเทา แล้วหยุดตอนคนสามคนเดินออกมาจากประตูอีกบาน หิ้วหีบตะกั่วใบเล็กมาด้วยใบหนึ่ง

    ไซเวลถือสี่เหรียญไว้ในมือ ยังไม่ส่งให้ นางบอกกติกาที่เหลือ คนนอกที่เฝ้าประตูนี้ได้จนสาง มีสองทาง ลืมคืนนี้ทั้งคืน หรือตามมา
  choices:
    - id: follow_the_old_woman
      label: บอกไซเวลว่าจะตามไป
      text: |
        คำสาบานเกิดขึ้นในห้องเก็บของห้องนั้นเอง หลังหีบตะกั่วขึ้นเกวียนเรียบร้อย ตะเกียงสังกะสีดวงหนึ่งวางบนกล่องไม้ ไส้ยังขาว ชายที่หันหูขวาเข้าหาทุกคนพูดทีละข้อให้{name}ทวน ไปเมื่อหน่วยเรียก ไม่มีบ้านให้ใครตามไปถึง ไม่เล่าให้ใครฟังนอกจากผู้จุดของตัวเอง ห้องนั้นไม่เหลืออะไร นอกจากรอยขีดบนผนังด้านใน รอยเล็บ ลึกพอให้เสียบเหรียญได้

        ไซเวลเก็บสี่เหรียญคืนเข้ากระเป๋า บอกว่าคนในหน่วยไม่รับค่าจ้างเป็นคืน ชายหูเดียวชื่อออสริค เขาให้{name}ยกถังน้ำมันขึ้นเกวียนเป็นงานแรก ถังหนักกว่าที่ตาเห็น หนักจนไหล่ที่พิงประตูมาทั้งคืนร้าวขึ้นไปถึงต้นคอ
      effects:
        org: { id: wick, join: true }
        traits: [oath_wick]
        mark: เข้าหน่วยไส้ตะเกียง
        stats: { CON: 1 }
        flags: [held_the_door_for_the_wick]
    - id: take_the_coin_and_forget
      label: รับสี่เหรียญ แล้วยอมนอนในห้องที่ไซเวลจุดน้ำมัน
      text: |
        ไซเวลจุดตะเกียงดวงเล็กในครัวของบ้านนั้น ปิดหน้าต่าง แล้วนั่งลงข้าง{name}เหมือนคนเฝ้าไข้ นางไม่ออกไปไหน ควันมีกลิ่นน้ำมันตะเกียงธรรมดา จางกว่าที่คิด และหนักกว่าที่คิด

        {name}ตื่นมาตอนเที่ยงพร้อมไข้ ในย่ามมีสี่เหรียญ ไหล่ขวาระบมเหมือนพิงของแข็งไว้ทั้งคืน ที่ไหล่เสื้อมีเสี้ยนไม้โอ๊กติดอยู่สองเสี้ยน
      effects: { gold: 4, flags: [forgot_the_door_night] }
    - id: slip_away_before_the_oil
      label: เดินออกทางหลังบ้านตอนไซเวลหันไปดูหีบ
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          {name}ข้ามรั้วไม้หลังบ้านโดยไม่มีไม้แผ่นไหนลั่น เดินเลียบคูน้ำไปจนพ้นหลังคาหลังสุดท้าย ไม่มีใครตาม ไม่มีเสียงเรียก จนตะวันขึ้นเต็มดวง{name}ยังจำเสียงหลังประตูได้ทุกพยางค์

          ในย่ามไม่มีเหรียญ ไซเวลยังไม่ทันจ่าย เดือนนั้นมีชายติดเข็มกลัดรูปตะเกียงที่ปกเสื้อแวะถามเจ้าของโรงเตี๊ยมถึงคนหน้าตาแบบ{name}สองครั้ง ครั้งที่สองเขาจดคำตอบลงสมุด
        effects: { stats: { DEX: 1 }, hunted: { lamp_church: 1 }, flags: [slipped_away_from_the_oil] }
      failure:
        text: |
          ไซเวลไม่ได้หันไปดูหีบอย่างที่{name}คิด นางยืนรออยู่ที่มุมรั้ว ผ้าชุบน้ำมันในมือมีควันขึ้นเป็นเส้น นางยกผ้าขึ้นช้าๆ ไม่รีบเลย

          {name}ตื่นข้างคูน้ำตอนบ่ายพร้อมไข้ เข่าถลอกทั้งสองข้าง ในย่ามไม่มีเหรียญ และไม่รู้ว่าทำไมต้องมีเหรียญ
        effects: { hp: -1, flags: [forgot_the_door_night] }
    - id: name_the_voice_behind_the_door
      label: บอกไซเวลว่าเสียงนั้นใช้ชื่อเล่นที่คนในหมวดเรียกกันตอนสงครามถ่าน
      requires: { flag: war_veteran }
      text: |
        ไซเวลดึงแถบผ้าเส้นหนึ่งออกจากข้อมือ อ่าน แล้วพันกลับ นางบอกว่าของในห้องนั้นเอาเสียงไปจากคนที่ได้ยินเสียงนั้นบ่อยที่สุด ไม่ได้เอาไปจากเจ้าของเสียง แล้วถามคำถามเดียวที่{name}ไม่คิดว่าจะมีใครถาม ว่าคนในหมวดคนนั้นยังอยู่ไหม

        {name}ตอบ แล้วยื่นมือไปหาตะเกียงสังกะสีที่วางบนกล่องไม้เองโดยไม่ต้องให้ใครชี้ ชายหูเดียวที่ชื่อออสริคพูดคำสาบานทีละข้อ {name}ทวนตามทุกคำ ข้อสุดท้าย{name}พูดจบก่อนเขา
      effects:
        org: { id: wick, join: true }
        traits: [oath_wick]
        mark: เข้าหน่วยไส้ตะเกียง
        stats: { WIS: 1 }
        flags: [named_the_voice_behind_the_door]

- id: adult.wick_join_temple_book
  stage: adult
  scene: temple
  weight: 25
  when:
    age: [18, 40]
    flags: [origin_marked_foundling]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [has_partner, has_child, has_ward, left_the_wick, broke_the_wick_vow]
    not_wears: [cold_iron]
  text: |
    เกวียนน้ำมันของวิหารเวรัสมาถึงตามรอบเดือน คนขับเป็นชายร่างหนา นิ้วโป้งสองข้างดำด้วยคราบน้ำมันที่ล้างไม่ออกแล้ว เดือนนี้เขาไม่ยกถังลงก่อนเหมือนทุกเดือน เขาส่งเด็กรับใช้วิหารไปตามตัว{name}มา แล้วนั่งรออยู่ท้ายเกวียน สมุดปกหนังสีดำวางบนเข่า

    สมุดแบบนั้น{name}จำได้ตั้งแต่ก่อนอ่านหนังสือออก ทุกปลายปีที่วิหารใหญ่อีเซล เสมียนศาสนจักรตะเกียงหอบเล่มแบบนี้มานั่งในห้องที่ปิดม่านทุกบาน เอาเชือกผูกปมทาบวัดเขาของเด็กทีละคน เล่มนี้เปิดค้างไว้ที่ช่องที่เสมียนไม่เคยกางให้เด็กดู ช่องขวาสุดของหน้า หัวช่องเขียนว่า ส่งต่อ

    ชายคนนั้นชื่อทอร์เบน เป็นนายโรงน้ำมัน เขาเล่าด้วยนิ้วมากกว่าปาก ชี้บรรทัดชื่อ{name} ชี้ตราตะเกียงที่มุมหน้า แล้วชี้ลายมือเล็กเอียงขวาที่เขียนเบียดไว้ในช่องหมายเหตุ ลายมือของแม่ชีโทเรน ให้กินข้าวอุ่น อย่าให้นอนห้องที่ไม่มีหน้าต่าง ถ้าจะดุ ดุครั้งเดียวแล้วจบ ทอร์เบนบอกว่าวิหารอีเซลเลี้ยงเด็กมีเขาได้เพราะศาสนจักรยอม และศาสนจักรยอมเพราะมีช่องนี้ แล้วเขาก็หุบปากรอ
  choices:
    - id: climb_up_beside_torben
      label: ขึ้นนั่งข้างทอร์เบนบนเกวียน
      text: |
        ทอร์เบนขีดเส้นเดียวลงในช่องส่งต่อของบรรทัดนั้น เป่าหมึกให้แห้ง แล้วปิดสมุด เขาไม่ถามว่า{name}จะเอาอะไรไปด้วย ถังน้ำมันสองถังที่ควรยกลงให้วิหารนี้ยังอยู่บนเกวียน เขาว่าเดือนหน้าค่อยเติมชดให้

        คำสาบานเกิดขึ้นคืนนั้นในโรงน้ำมัน ต่อหน้าตะเกียงที่ยังไม่เคยจุด ทอร์เบนเป็นคนเดียวที่ยืนดู มือข้างหนึ่งถือขวดตวงเปล่าไว้ตลอด เหมือนคนที่ยังตวงของค้างอยู่ครึ่งขวด
      effects:
        org: { id: wick, join: true }
        traits: [oath_wick]
        mark: เข้าหน่วยไส้ตะเกียง
        reputation: { lamp_church: 1 }
        flags: [handed_on_by_the_temple]
    - id: ask_the_temple_to_strike_it
      label: ไปขอให้วิหารอีเซลขีดชื่อออกจากช่องนั้น
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          แม่อธิการคนปัจจุบันของวิหารอีเซลฟังจนจบ แล้วเขียนจดหมายถึงศาสนจักรตะเกียงด้วยมือตัวเองสามหน้า เดือนต่อมาบรรทัดของ{name}มีเส้นหมึกแดงขีดทับตลอดบรรทัด ทอร์เบนเอาสมุดมาให้ดูเอง แล้วออกเกวียนต่อตามรอบ

          หน้าหนาวนั้นเกวียนน้ำมันเติมตะเกียงของวิหารอีเซลแค่ครึ่งถังทุกเดือน ห้องยาวข้างครัวที่เด็กเล็กนอนเรียงกัน จุดตะเกียงได้ดวงเดียวจากสามดวง
        effects: { stats: { CHA: 1 }, reputation: { lamp_church: -1 }, flags: [name_struck_from_the_hand_on] }
      failure:
        text: |
          แม่อธิการบอกว่าช่องนั้นไม่ใช่ของวิหารอีเซลจะขีด วิหารแค่ได้ยืมเด็กมาเลี้ยง นางพูดเสียงเบา ตาจับอยู่ที่มือตัวเอง

          {name}ไม่กลับไปหาเกวียน ทอร์เบนรอจนค่ำ แล้วออกเดินทางต่อตามรอบ ค่าเดินทางไปกลับวิหารอีเซลหมดไปสองเหรียญ บรรทัดของ{name}ในสมุดเล่มดำยังเปิดช่องส่งต่อค้างไว้ ไม่มีเส้นอะไรขีดทับ
        effects: { gold: -2, reputation: { lamp_church: -1 }, flags: [refused_the_hand_on] }
    - id: keep_torens_note
      label: ขอกรีดช่องหมายเหตุที่เป็นลายมือแม่ชีโทเรนเก็บไว้ ก่อนขึ้นเกวียน
      requires: { flag: sister_toren_bond }
      text: |
        ทอร์เบนชั่งใจนานพอจะตวงน้ำมันได้หนึ่งขวด แล้วยื่นมีดพับให้ {name}กรีดตามเส้นช่องให้ตรงที่สุด ได้แถบกระดาษกว้างไม่ถึงสองนิ้ว ลายมือเอียงขวาเขียนแน่นเต็มแถบ ช่องหมายเหตุในสมุดเหลือเป็นรูยาว

        บนเกวียน{name}พับแถบกระดาษสองทบ เก็บไว้ในซับในเสื้อตรงที่แนบอก คืนนั้นสาบานต่อหน้าตะเกียงที่ยังไม่เคยจุด ทอร์เบนจดบรรทัดของ{name}ลงสมุดของโรงน้ำมันว่า ส่งต่อแล้ว หมายเหตุ ไม่มี
      effects:
        org: { id: wick, join: true }
        traits: [oath_wick]
        mark: เข้าหน่วยไส้ตะเกียง
        stats: { WIS: 1 }
        flags: [kept_torens_note]

- id: adult.wick_join_cask_room
  stage: adult
  weight: 12
  time: night
  when:
    age: [18, 45]
    trait: curse_brand
    location_tag: [arvel_village, ventras, kardin]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [has_partner, has_child, has_ward, left_the_wick, broke_the_wick_vow, origin_marked_foundling]
    not_wears: [cold_iron]
  text: |
    นักล่าแม่มดสองคนหยุด{name}กลางถนนตอนเที่ยง ถามชื่อแล้วไม่ฟังคำตอบ คนหนึ่งอ่านใบแจ้งไม่ลงชื่อให้ฟัง มีคนเห็น{name}ยืนพูดกับอะไรบางอย่างที่มุมรั้วตอนตีสอง อีกคนคล้องโซ่เข้าข้อมือ คนบนถนนหลีกเป็นช่องกว้าง ไม่มีใครถามว่ามุมรั้วไหน

    บ่ายนั้นห้องขังหลังวิหารมีกลิ่นฟืนสด คนตัดฟืนกองไม้ที่โคนเสาหน้าวิหาร ตรงที่ทุกคนเดินผ่านแล้วต้องเห็น หลังเที่ยงคืนเกวียนน้ำมันมารับ {name}นั่งเบียดถังน้ำมันในความมืดจนเกวียนหยุด แล้วมีมือพาลงบันไดสิบเอ็ดขั้น

    ห้องข้างล่างมีถังไม้โอ๊กเรียงสองแถว ถังบางใบมีรอยชอล์กเป็นรูปประตูปิด ชายร่างหนาเดินนับถังโดยไม่หันมา อีกคนยืนพิงเสา เอียงหูขวาเข้าหา{name}ทุกครั้งที่{name}ขยับปาก บนถังใบหนึ่งมีหญิงมีเขานั่งกินขนมปัง ปลายเขาบิ่นทั้งสองข้าง นางเคี้ยวคำสุดท้ายจนหมด แล้วบอกสิ่งที่ห้องนี้มีให้ เดินนำหน้าชุดตอนกลางคืน หรือกลับไปที่เสา ประตูหัวบันไดแง้มอยู่ ไม่มีใครยืนเฝ้า
  choices:
    - id: walk_in_front
      label: บอกว่าจะเดินนำหน้า
      text: |
        หญิงมีเขาลุกจากถัง ปัดเศษขนมปังออกจากตัก หยิบรองเท้าหนังพื้นนุ่มคู่สำรองออกจากย่ามส่งให้ บอกว่าคนเดินหน้าต้องเดินเสียงเบากว่าคนอื่นในชุด คนอื่นมีแสงคุ้มหัว คนเดินหน้ามีแต่เท้าตัวเอง นางบอกว่าคนในชุดเรียกนางว่าสิบเก้า

        คำสาบานมีสามข้อ ชายที่พิงเสาพูดทีละข้อต่อหน้าตะเกียงที่ยังไม่เคยจุด ชายร่างหนานับถังจนครบแถว แล้วจดอะไรบางอย่างลงสมุดเล่มเล็กที่ห้อยเชือกไว้ข้างเอว สั้นกว่าชื่อของ{name}
      effects:
        org: { id: wick, join: true }
        traits: [oath_wick]
        mark: เข้าหน่วยไส้ตะเกียง
        flags: [walks_in_front]
    - id: run_the_eleven_steps
      label: วิ่งขึ้นบันไดสิบเอ็ดขั้นก่อนใครจะขยับ
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          ไม่มีใครขยับจริงๆ ชายที่พิงเสาไม่ลุก หญิงมีเขาไม่วางขนมปัง {name}ขึ้นพ้นขั้นที่สิบเอ็ด ผ่านโรงบีบที่หินบดยังหมุนช้าๆ ในความมืด ออกประตูลานไปทางคูน้ำ แล้วเดินต่อจนฟ้าสางโดยไม่เห็นใครตามมาสักคน

          ตลอดหน้าแล้งนั้น ฟืนยังกองอยู่ที่โคนเสาหน้าวิหาร ใบประกาศชื่อ{name}ตอกติดประตูตลาดสองแห่ง แห่งหนึ่งสะกดชื่อผิด
        effects: { stats: { DEX: 1 }, hunted: { lamp_church: 2 }, flags: [ran_from_the_cask_room] }
      failure:
        text: |
          ขั้นที่เก้าเปียกน้ำมัน {name}ลื่น หน้าแข้งฟาดขอบหิน ไถลลงไปสองขั้นแล้วตะกายขึ้นใหม่ ไม่มีใครลงมาจับ ไม่มีใครเรียก ชายร่างหนาข้างล่างนับถังต่อ เสียงนับดังตามขึ้นมาจนพ้นประตู

          {name}กะเผลกออกจากลานโรงน้ำมันไปทั้งคืน เลือดซึมรองเท้าข้างหนึ่งจนเหนียว ก่อนหน้าแล้งจะหมด มีใบประกาศชื่อ{name}ตอกอยู่ทุกประตูตลาดที่ผ่าน ใบหลังๆ เขียนเพิ่มบรรทัดหนึ่งว่าขาเจ็บ
        effects: { hp: -2, hunted: { lamp_church: 3 }, flags: [ran_from_the_cask_room] }
    - id: show_the_register_tag
      label: ล้วงแผ่นไม้สลักเลขของทะเบียนวิหารออกมาให้ชายที่นับถังดู
      requires: { flag: signed_lamp_register }
      text: |
        ชายร่างหนาหยุดนับเป็นครั้งแรก เดินมาพลิกแผ่นไม้ในมือ{name}ดูทั้งสองหน้า แล้วจดเลขที่สลักไว้ลงสมุดเล่มเล็กที่ห้อยเอว เขาบอกว่าศาสนจักรให้เลขมาแล้ว ไม่ต้องตั้งให้ใหม่ ประหยัดหมึก

        หญิงมีเขาหัวเราะคำเดียว แล้วส่งรองเท้าหนังพื้นนุ่มคู่สำรองให้ คำสาบานสามข้อพูดต่อหน้าตะเกียงที่ยังไม่เคยจุด ตอนพูดข้อสุดท้าย แผ่นไม้ยังอยู่ในกำมือ{name} ขอบคมกดเข้าเนื้อเป็นรอยเลขกลับด้าน
      effects:
        org: { id: wick, join: true }
        traits: [oath_wick]
        mark: เข้าหน่วยไส้ตะเกียง
        flags: [kept_the_register_number]

# ---------- งานเกิดซ้ำ (ไม่กันยศ ไม่ให้ค่าพลัง) ----------
- id: adult.wick_duty_oil_round
  stage: adult
  scene: road
  weight: 20
  once: false
  duty: wick
  when:
    age: [20, 64]
    org: wick
  text: |
    รอบน้ำมันออกจากโรงตอนตีห้าทุกต้นเดือน เกวียนหนึ่งคัน ล่อสองตัว ถังสิบสองถัง กับใบรายชื่อวิหารที่ทอร์เบนเขียนด้วยดินสอไขมัน ฝนตกก็ไม่ลบ เดือนนี้ชื่อ{name}อยู่หัวใบ ทอร์เบนตวงน้ำมันลงถังด้วยกระบวยทองเหลืองทีละกระบวย นับออกเสียง แล้วเอาไม้วัดขีดระดับไว้ข้างถังทุกใบ ไม้อันเดียวกันนั้นจะจุ่มลงถังเปล่าอีกครั้งตอนเกวียนกลับ

    รอบน้ำมันไม่มีอะไรนอกจากน้ำมัน วิหารแรกคนดูแลตะเกียงนับหยดตามทุกครั้งที่เท วิหารที่สามมีน้ำแกงถั่วรอไว้หนึ่งชามเสมอ วิหารที่ห้าเถียงเรื่องขีดบนถังทุกเดือนจนเป็นธรรมเนียม ที่วิหารสุดท้าย หญิงม่ายของนักบวชคนเก่ายืนรอข้างประตูหลังพร้อมโถดินเผาเปล่าใบเดิม สามีนางตายมาหลายหน้าหนาวแล้ว นางยังมาทุกต้นเดือน ใบรายชื่อของทอร์เบนไม่มีบรรทัดของนาง
  choices:
    - id: fill_by_the_marks
      label: เติมทุกวิหารตามขีดบนถัง ไม่ขาดไม่เกิน
      text: |
        {name}เติมวิหารสุดท้ายจนถึงขีด แล้วปิดฝาถัง หญิงม่ายรออยู่อีกพักหนึ่ง จนแน่ใจว่าฝาจะไม่เปิดอีก แล้วหอบโถเปล่ากลับไปทางเดิม เดินช้า ไม่หันมา

        ตอนเกวียนกลับถึงโรง ทอร์เบนจุ่มไม้วัดลงถังเปล่าทีละใบ ตรงขีดทุกใบ เขาจดลงสมุด แล้วกากบาทเล็กๆ ไว้ท้ายชื่อ{name} กากบาทเดียวกับที่ให้ทุกเดือนที่น้ำมันไม่หาย
      effects: { reputation: { lamp_church: 1 }, flags: [kept_the_oil_marks] }
    - id: pour_for_the_widow
      label: เทให้หญิงม่ายครึ่งโถ แล้วจ่ายค่าน้ำมันส่วนที่ขาดให้ทอร์เบนเอง
      requires: { min_gold: 2 }
      text: |
        หญิงม่ายประคองโถด้วยสองมือระหว่างที่{name}เท นางไม่ขอบใจ นางบอกว่าดวงที่จะจุดคือดวงหน้ารูปสามี จุดไว้ทุกคืนต้นเดือน ปลายเดือนก็ปล่อยให้ดับเอง

        ทอร์เบนจุ่มไม้วัดลงถังใบสุดท้าย ระดับขาดไปหนึ่งนิ้ว เขารับสองเหรียญจากมือ{name}โดยไม่ถามว่าน้ำมันไปไหน จดลงสมุดว่าถังรั่ว แล้วใช้เล็บขูดขีดบนถังใบนั้นให้ต่ำลงหนึ่งนิ้ว เผื่อเดือนหน้า
      effects: { gold: -2, alignment: { moral: 1 }, flags: [poured_for_the_widow] }
    - id: take_the_hill_road
      label: อ้อมขึ้นไปส่งวิหารบนเนินที่รอบน้ำมันมักข้ามไป
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ทางขึ้นเนินเป็นหินร่วน ล่อตัวหน้าไม่ยอมเดินจน{name}ต้องจูงขึ้นไปเองทีละช่วงตัว วิหารบนเนินมีนักบวชแก่คนเดียวกับไก่สามตัว ถ้วยตะเกียงบนแท่นแห้งมาสองสัปดาห์ เขาเปลี่ยนไส้ใหม่ทันทีที่น้ำมันลงถึงก้นถ้วย ยืนดูจนไฟติด แล้วห่อไข่สามฟองด้วยผ้าให้{name}

          เกวียนกลับถึงโรงช้ากว่าทุกเดือนครึ่งวัน ทอร์เบนวัดถังเปล่าครบทุกใบ แล้วเขียนวิหารบนเนินลงใบรายชื่อของเดือนหน้าด้วยดินสอไขมัน
        effects: { reputation: { lamp_church: 1 }, flags: [took_oil_up_the_hill] }
      failure:
        text: |
          ครึ่งทางขึ้นเนิน ล้อหลังตกร่องหิน ถังสองใบกระแทกกันจนฝาใบหนึ่งกระเด็น น้ำมันไหลลงหินเป็นทางยาวส่องแดด {name}เอาหลังดันล้อขึ้นจากร่องจนเอวเคล็ด แล้วจูงล่อลงเนินโดยไม่ได้ไปถึงวิหาร

          ทอร์เบนจุ่มไม้วัดลงถังที่ฝาหาย แล้วส่ายหัว เขาไม่หักค่าจ้าง เขาให้{name}ยืนล้างคราบน้ำมันบนเกวียนจนมืด
        effects: { hp: -1, flags: [spilled_oil_on_the_hill] }
    - id: pass_the_oil_round
      label: ฝากรอบนี้ให้คนอื่นในชุดขับแทน
      refuse: true
      text: |
        คนในชุดที่รับไปแทนขอแค่ให้{name}ตื่นมาช่วยยกถังขึ้นเกวียนตอนตีห้า {name}ยกครบสิบสองถัง แล้วกลับไปนอนต่อ

        ทอร์เบนขีดชื่อ{name}บนหัวใบรายชื่อทิ้ง เขียนชื่อใหม่ทับลงไป ดินสอไขมันลบไม่ออก รอยขีดจึงติดอยู่บนหัวใบนั้นไปทั้งเดือน
      effects: { flags: [passed_the_oil_round] }

- id: adult.wick_duty_hold_the_street
  stage: adult
  weight: 20
  once: false
  time: night
  duty: wick
  when:
    age: [20, 64]
    org: wick
  text: |
    งานบางคืนใช้คนน้อยกว่าที่ชุดมี คนที่เหลือต้องไปกั้นถนน คืนนี้ไซเวลแกะแถบผ้าเส้นหนึ่งออกจากข้อมือ ยื่นให้{name} บนแถบเขียนไว้แค่ หัวซอย ถึงสาง

    กั้นถนนมีวิธีของหน่วย วางม้าไม้สองตัวขวางหัวซอย เทน้ำมันตะเกียงครึ่งถังลงพื้นหิน โรยขี้เลื่อยทับบางๆ ให้กลิ่นฟุ้ง แล้วนั่งบนถังเปล่า ใครถามให้บอกว่าเกวียนน้ำมันคว่ำ ห้ามเดินผ่าน ห้ามถือไฟเข้ามา ไม่มีใครอยากถือคบไฟเข้าซอยที่น้ำมันนองพื้น บ้านหลังที่สามจากหัวซอยปิดหน้าต่างทุกบาน มีแสงลอดใต้ประตูเป็นเส้นเดียว

    ตีหนึ่งคนอบขนมปังมาบ่นเรื่องเตาที่ต้องจุดตอนตีสาม ตีสองหมาตัวหนึ่งเดินมาดมน้ำมันแล้วจาม ใกล้ตีสาม หญิงผดุงครรภ์หิ้วกระเป๋าหนังวิ่งมาถึงม้าไม้ หอบจนพูดไม่เป็นประโยค บ้านท้ายซอยเจ็บท้องมาตั้งแต่หัวค่ำ ทางอ้อมรอบตลาดไกลกว่าครึ่งชั่วยาม
  choices:
    - id: send_her_round
      label: บอกหญิงผดุงครรภ์ให้อ้อมไปทางตลาด
      text: |
        หญิงผดุงครรภ์ด่า{name}สามคำ แล้ววิ่งอ้อมไปทางตลาด เสียงรองเท้านางหายไปทางซ้าย แสงใต้ประตูบ้านหลังที่สามดับตอนตีสามครึ่ง เสียงผู้หญิงร้องจากท้ายซอยดังเป็นพักๆ จนเกือบสาง แล้วเสียงเด็กแรกเกิดก็ดังขึ้นแทน

        {name}เก็บม้าไม้ กวาดขี้เลื่อยชุ่มน้ำมันใส่กระสอบ ไม่มีใครในซอยถามอะไรอีก คนอบขนมปังจุดเตาช้าไปครึ่งชั่วยาม ขนมปังเช้านั้นมีแต่ก้อนเล็ก
      effects: { reputation: { lamp_church: 1 }, flags: [held_the_lane_shut] }
    - id: walk_her_along_the_fences
      label: พาหญิงผดุงครรภ์เลาะหลังรั้ว ให้พ้นหน้าต่างบ้านหลังที่สาม
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}จับข้อศอกนางไว้ตลอดทาง ก้มต่ำใต้แนวรั้ว เหยียบแต่ดินที่ไม่มีใบไม้แห้ง ผ่านหลังบ้านหลังที่สามตอนในบ้านไม่มีเสียงอะไรเลย หญิงผดุงครรภ์ไม่ถามว่าทำไมต้องก้ม นางเคยเดินในที่ที่ห้ามถามมาก่อน

          เด็กท้ายซอยเกิดก่อนสาง ร้องดังจนหมาตัวเดิมเห่าตาม {name}กลับไปนั่งบนถังเปล่าที่หัวซอยทันก่อนแสงใต้ประตูบ้านหลังที่สามจะดับ
        effects: { alignment: { moral: 1 }, flags: [walked_the_midwife_round] }
      failure:
        text: |
          ตะปูบนรั้วเกี่ยวแขน{name}เป็นแผลยาว {name}สะดุ้ง หญิงผดุงครรภ์เหยียบกิ่งไม้แห้งตรงหลังบ้านหลังที่สามพอดี แล้วหันไปตามเสียงที่ดังตอบกลับมาจากในบ้าน เสียงที่ไม่ใช่เสียงคน นางเห็นอะไรผ่านร่องหน้าต่างไม่เกินหนึ่งอึดใจ หนึ่งอึดใจก็พอ

          เด็กท้ายซอยเกิดก่อนสางเหมือนกัน คืนถัดมาไซเวลพันแถบผ้าเพิ่มอีกเส้น ชื่อหญิงผดุงครรภ์ เช้าวันต่อมานางตื่นมาพร้อมไข้ จำไม่ได้ว่าคืนก่อนทำคลอดให้บ้านไหน
        effects: { hp: -1, flags: [midwife_breathed_the_oil] }
    - id: leave_the_lane_to_another
      label: ส่งเสียงเรียกคนในชุดมาเฝ้าแทน แล้วกลับไปนอน
      refuse: true
      text: |
        คนที่มาแทนเดินมาถึงหัวซอยพร้อมผ้าห่มพันตัว หาวตั้งแต่ม้าไม้ตัวแรกถึงตัวที่สอง {name}ส่งแถบผ้าของไซเวลให้ แล้วเดินกลับ ไม่ทันได้ยินว่าคนมาแทนให้หญิงผดุงครรภ์ผ่านหรือไม่

        เช้าวันรุ่งขึ้นไซเวลรับแถบผ้าคืนจากมือคนที่มาแทน แล้วพันกลับเข้าข้อมือโดยไม่ดูว่าเป็นเส้นไหน
      effects: { flags: [left_the_lane_to_another] }

- id: adult.wick_duty_lead_chest
  stage: adult
  scene: road
  weight: 20
  once: false
  duty: wick
  when:
    age: [20, 64]
    org: wick
  text: |
    หีบตะกั่วใบเท่ากล่องขนมปัง แต่ยกด้วยมือเดียวไม่ขึ้น ฝาบัดกรีรอบทุกด้าน มัดเชือกชุบน้ำมันสองเส้นไขว้กันเป็นปมตะขอ ไม่มีใครในชุดรู้ว่าข้างในคืออะไร รู้แค่ว่ามาจากงานไหน และรู้ว่าห้ามเปิด หีบไม่เดินทางตรงไปที่ไหน หีบเดินทางทีละช่วง จากมือคนหนึ่งถึงมือคนถัดไป ไม่มีใครเคยเดินจนถึงปลายทาง

    ช่วงของชุดนี้คือสองวันเดินเท้า ถึงโรงเตี๊ยมริมทางที่หลักหินสามหลัก ทอร์เบนส่งกระเบื้องดินเผาครึ่งแผ่นให้{name}พร้อมหีบ อีกครึ่งอยู่กับคนที่รออยู่ปลายช่วง รอยแตกต้องต่อกันสนิทถึงจะส่งหีบได้ กลางทางมีโรงเตี๊ยมเล็กอยู่แห่งเดียว นอกนั้นเป็นทางเปลี่ยวที่ไม่มีใครเดินตอนกลางคืน
  choices:
    - id: walk_through_the_night
      label: เดินต่อทั้งคืน ไม่แวะ
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ทางกลางคืนมีแต่เสียงเท้าตัวเองกับเสียงหีบกระแทกสะบักทุกก้าว {name}นับก้าวไปเป็นร้อยแล้วเริ่มนับใหม่ ตีสามมีแสงสีฟ้าจางวาบขึ้นหนึ่งทีบนเนินทางซ้าย แล้วหายไปก่อนจะรู้ว่าเห็นจริงหรือเปล่า {name}ไม่หยุดดู

          ถึงหลักหินสามหลักก่อนเที่ยงวันที่สอง คนที่รออยู่เป็นหญิงขาเป๋ ชูกระเบื้องครึ่งแผ่นไว้ตั้งแต่เห็น{name}ไกลๆ รอยแตกต่อกันสนิท นางยกหีบขึ้นหลังลาโดยไม่ถามชื่อ แล้วจ่ายค่าข้าวให้สองเหรียญตามธรรมเนียมของช่วงทาง
        effects: { gold: 2, flags: [carried_the_chest_through_the_night] }
      failure:
        text: |
          ตีสี่ เข่าข้างหนึ่งทรุดลงกลางทางโดยไม่บอกก่อน {name}ล้มทับย่าม ขอบหีบกดซี่โครงจนหายใจไม่เต็มปอด ต้องนั่งรอฟ้าสางข้างหลักไม้บอกทาง

          ถึงหลักหินสามหลักช้าไปครึ่งวัน หญิงขาเป๋ที่รออยู่ต่อกระเบื้องสนิทดีทุกขอบ แต่ไม่จ่ายค่าข้าว นางบอกว่าคนรอช่วงถัดไปก็รอนางอยู่เหมือนกัน
        effects: { hp: -1, flags: [carried_the_chest_late] }
    - id: sleep_on_the_chest
      label: แวะนอนโรงเตี๊ยมกลางทาง หนุนหีบไว้ใต้หมอน
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ห้องข้างๆ มีแขกคนเดียว ชายวัยกลางคนที่ไม่ถอดถุงมือหนังสีขาวแม้ตอนกินน้ำแกง ตอนดึกเขาเดินผ่านหน้าห้อง{name}สามครั้ง ทุกครั้งหยุดนานพอนับถึงห้า {name}นอนตะแคงทับหีบ ตาลืมทั้งคืน

          ตีห้าออกจากโรงเตี๊ยมก่อนคนเลี้ยงม้าจะตื่น ถึงหลักหินสามหลักตรงเวลา หญิงขาเป๋ต่อกระเบื้อง แล้วจ่ายค่าข้าวสองเหรียญ
        effects: { gold: 2, flags: [kept_the_chest_from_white_gloves] }
      failure:
        text: |
          {name}หลับลึกกว่าที่ตั้งใจ ตื่นมาตอนสาย หีบยังอยู่ใต้หมอน เชือกสองเส้นยังไขว้กันอยู่ แต่ปมเปลี่ยนไป ปมของทอร์เบนเป็นปมตะขอ ปมนี้เป็นปมพิรอด ผูกเรียบร้อยกว่าเดิม

          เจ้าของโรงเตี๊ยมบอกว่าแขกห้องข้างๆ ที่ใส่ถุงมือขาวออกไปก่อนไก่ขัน จ่ายค่าห้องของ{name}ไว้ให้ด้วย ฝากบอกว่าขอบคุณที่นอนห้องติดกัน
        effects: { hunted: { star_listeners: 1 }, flags: [white_gloves_retied_the_chest] }
    - id: pass_the_lead_chest
      label: ขอให้คนอื่นในชุดแบกช่วงนี้แทน
      refuse: true
      text: |
        คนในชุดที่รับไปบ่นเรื่องไหล่ตั้งแต่ก่อนยกหีบขึ้นหลัง ทอร์เบนดึงกระเบื้องครึ่งแผ่นจากมือ{name}ไปส่งให้คนนั้นเอง

        หีบออกจากโรงน้ำมันตอนสาย ช้ากว่ากำหนดครึ่งวัน หญิงขาเป๋ที่หลักหินสามหลักจะรอนานขึ้นครึ่งวัน คนรอช่วงถัดไปก็เหมือนกัน
      effects: { flags: [passed_the_lead_chest] }

# ---------- งานแบบตัวเลือก (ครั้งเดียว) ----------
- id: adult.wick_duty_forgetting_house
  stage: adult
  scene: home
  weight: 20
  time: night
  duty: wick
  when:
    age: [20, 64]
    org: wick
  text: |
    บ้านคนเลี้ยงห่านหลังนั้นต้องลืมทั้งบ้าน ไซเวลบอกแค่นั้น เหตุผลอยู่ในแถบผ้าที่นางไม่คลายให้ใครอ่าน ห่านทั้งฝูงตายในคอกเมื่อคืนก่อน ไม่มีแผลสักตัว คอทุกตัวหันไปทางเดียวกัน ลูกชายคนโตเอาถ่านวาดอะไรบางอย่างไว้บนผนังข้างเตา วาดซ้ำทับกันจนผนังดำเป็นวง

    งานของ{name}คือประตู ไซเวลจะจุดน้ำมันลืมในครัวที่ปิดหน้าต่างทุกบาน แล้วนั่งอยู่ข้างในกับคนทั้งบ้านจนครบ ข้างนอก{name}ต้องยันประตู อุดร่องด้วยผ้าชุบน้ำ ไม่ให้ใครออก ไม่ให้ใครเข้า จนกว่าจะได้ยินเสียงเคาะสามครั้งจากข้างใน ควันลอดร่องประตูออกมาได้ทุกครั้ง มากบ้างน้อยบ้าง คนยันประตูจึงหายใจส่วนที่ลอดออกมาไปด้วยทุกครั้ง
  choices:
    - id: hold_and_breathe
      label: ยันประตูไว้ตามที่สั่ง หายใจตามปกติ
      text: |
        กลางดึกมีมือเล็กๆ ทุบประตูจากข้างในสองที แล้วหยุด ควันลอดร่องออกมาเป็นเส้นบางเท่าเส้นผม กลิ่นน้ำมันตะเกียงธรรมดา {name}ยันไหล่กับไม้จนเสียงเคาะสามครั้งดังขึ้น หรืออาจดังไปก่อนหน้านั้นแล้วก็ได้ {name}ไม่แน่ใจ

        {name}ตื่นบนเกวียนน้ำมันตอนสายพร้อมไข้ ไหล่ระบมเป็นรอยไม้ จำได้ว่าออกจากโรงน้ำมันเมื่อเย็นวาน จำไม่ได้ว่าไปไหน ไซเวลดึงแถบผ้าเส้นใหม่ออกจากข้อมือตัวเอง มาผูกที่ข้อมือ{name}แทน บนแถบเขียนว่า บ้านคนเลี้ยงห่าน ยันประตู ครบ
      effects: { reputation: { lamp_church: 1 }, flags: [lost_a_night_to_the_oil] }
    - id: wet_cloth_over_the_mouth
      label: ชุบผ้าน้ำผูกปิดจมูกปาก แล้วยันประตูไว้ตลอดคืน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ผ้าเปียกเย็นจนฟันกระทบ {name}หายใจผ่านผ้าทีละน้อย ช้าเท่าที่ปอดยอม เที่ยงคืนมีมือเล็กๆ ทุบประตูจากข้างในสองที ตีสองมีผู้ใหญ่คนหนึ่งร้องเพลงกล่อมเด็กจนจบเพลง ตีสามเสียงเคาะสามครั้งดังขึ้นชัดเจน

          {name}จำคืนนั้นได้ทุกอย่าง จำได้ว่าเพลงกล่อมเด็กเพลงนั้นร้องผิดคำท่อนที่สอง เช้านั้นแม่ของบ้านออกมาต้อนห่านเข้าคอก แล้วยืนงงอยู่หน้าคอกเปล่า ไม้ต้อนห่านยังอยู่ในมือ
        effects: { stats: { CON: 1 }, flags: [held_the_forgetting_door] }
      failure:
        text: |
          ผ้าแห้งเร็วกว่าที่คิด ตีสองมีเสียงเพลงกล่อมเด็กลอดประตูออกมา {name}ฟังจนหลับไปขณะยืนพิงประตู ไหล่ไถลลงตามไม้ ศีรษะกระแทกขอบวงกบ

          {name}ตื่นบนเกวียนพร้อมไข้กับหัวโน จำเพลงกล่อมเด็กได้ครึ่งท่อน จำไม่ได้ว่าใครร้อง และไม่รู้ว่าทำไมต้องจำ
        effects: { hp: -1, flags: [lost_a_night_to_the_oil] }
    - id: keep_the_charcoal_drawing
      label: ยันประตูจนสาง แล้วทาบกระดาษลอกภาพถ่านบนผนังเก็บไว้ก่อนขัดทิ้ง
      text: |
        ผนังข้างเตาต้องขัดด้วยทรายกับน้ำด่างจนเห็นเนื้อดินเดิม เป็นงานเก็บกวาดหลังทุกงาน ก่อนขัด{name}เอากระดาษห่อขนมปังทาบลงไป ถูด้วยสันมือ ได้ภาพกลับด้านมาหนึ่งแผ่น เส้นถ่านเลือนไปครึ่งหนึ่ง เส้นที่เหลือไม่เป็นรูปอะไรที่มีชื่อ มุมไม่บรรจบกันตรงไหนเลย

        {name}พับกระดาษเก็บไว้ใต้พื้นรองเท้า ไม่เคยกางดูอีก เปลี่ยนรองเท้าคู่ใหม่เมื่อไร กระดาษแผ่นนั้นก็ย้ายตามไปด้วย
      effects: { stats: { WIS: 1 }, alignment: { law: -1 }, flags: [kept_a_forgotten_drawing] }
    - id: let_another_hold_the_door
      label: ขอไปกั้นหัวถนนแทน ให้คนอื่นยันประตู
      refuse: true
      text: |
        คนในชุดที่มายันประตูแทนเป็นคนที่ยันมาแล้วเมื่อเดือนก่อน เขาไม่บ่น ชุบผ้าน้ำผูกปิดปากจมูก แล้วเอาไหล่พิงประตูเหมือนคนพิงเสารอเกวียน

        เช้านั้นเขานั่งท้ายเกวียนพร้อมไข้ ถาม{name}ว่าเมื่อคืนไปไหนกันมา {name}เป็นคนตอบ
      effects: { flags: [let_another_hold_the_door] }

- id: adult.wick_duty_lights_under_skin
  stage: adult
  scene: home
  weight: 20
  time: night
  duty: wick
  when:
    age: [20, 64]
    org: wick
  text: |
    ข่าวที่ส่งมาบอกว่าบนห้องใต้หลังคาบ้านคนงานโรงกลั่นหลังหนึ่งมีของเรืองแสง ร้องเป็นเสียงคนตอนดึก เพื่อนบ้านไม่กล้าเข้าใกล้มาสามคืน ชุดไปถึงพร้อมผ้าชุบน้ำมัน ขอเหล็ก และถังทรายสองถัง แม่ของบ้านยืนขวางบันไดจนสามีต้องดึงตัวออก

    ข้างบนเป็นเด็กผู้หญิงคนหนึ่ง ตัวร้อนจนผ้าห่มชื้น ใต้ผิวแขนกับลำคอมีจุดแสงสีฟ้าซีดเคลื่อนไปมาช้าๆ เหมือนปลาในน้ำขุ่น พอมีคนเดินเข้าใกล้ จุดแสงว่ายมารวมกันทางด้านนั้น พ่อของเด็กกลั่นน้ำค้างดาวมาตั้งแต่ก่อนแต่งงาน บนแขนเขามีจุดใสสองสามจุดเหมือนกัน แต่ไม่เคยเคลื่อน เด็กชื่อลินนา นางถามคนที่ยืนอยู่ปลายเท้าว่ามาพาไปไหน

    ธรรมเนียมของหน่วยมีสามทางกับของที่มาจากฟ้าแล้วยังอยู่ในบ้านคน พากลับวิหาร ดับ หรือปล่อย ผู้จุดเป็นคนตัดสินก่อนสาง คนอื่นในชุดทำให้การตัดสินนั้นง่ายขึ้นหรือยากขึ้น
  choices:
    - id: carry_her_to_the_cart
      label: ห่อตัวลินนาด้วยผ้าห่ม อุ้มลงไปขึ้นเกวียน
      text: |
        ลินนาตัวเบากว่าที่คิด จุดแสงใต้ผิวว่ายมารวมกันที่แก้มข้างที่แนบไหล่{name} แม่ของบ้านเดินตามเกวียนไปจนสุดถนน ถือห่อขนมปังที่ทำไว้ให้ลูก ไม่มีใครรับ นางจึงวางไว้ข้างล้อตอนเกวียนหยุดให้ล่อกินน้ำ แล้วยืนอยู่ตรงนั้น

        หมอของวิหารรับเด็กที่ประตูข้างตอนสาง ลงชื่อรับในสมุด แล้วให้{name}ลงชื่อเป็นคนส่ง ช่องสุดท้ายของบรรทัดคือช่องวันส่งกลับ หมอเว้นว่างไว้
      effects: { reputation: { lamp_church: 1 }, flags: [carried_the_lit_child_to_the_temple] }
    - id: turmeric_and_a_story
      label: ทาขมิ้นกลบแสงใต้ผิวเด็ก แล้วไปบอกเพื่อนบ้านว่าเป็นไข้ผื่น
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          ขมิ้นข้นๆ สามชั้นกลบแสงจนเหลือแต่ด่างเหลือง {name}พาเพื่อนบ้านที่ส่งข่าวขึ้นไปดูทีละคน ชี้รอยเหลืองบนแขนเด็ก บอกชื่อไข้ผื่นที่หมอตามถนนใช้เรียกไข้ทุกอย่างที่ไม่รู้จัก แล้วบอกว่าติดทางลมหายใจ คนสุดท้ายลงบันไดเร็วกว่าตอนขึ้น

          ถนนนั้นไม่มีใครเหลือเรื่องให้ลืม ผู้จุดเขียนรายงานบรรทัดเดียว ไข้ผื่น ปล่อย ก่อนเกวียนออก ลินนาขอขมิ้นเพิ่มอีกถ้วย นางชอบกลิ่น
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [hid_the_lights_with_turmeric] }
      failure:
        text: |
          เด็กชายบ้านตรงข้ามแอบปีนขึ้นมาดูตอนเกือบสาง ขมิ้นบนลำคอลินนาหลุดเป็นแผ่นตามรอยเหงื่อ จุดแสงใต้ผิวว่ายมารวมกันตรงหน้าเขาพอดี เด็กชายวิ่งลงบันไดไปปลุกแม่

          คืนถัดมาทั้งถนนต้องหายใจน้ำมันลืม ห้าหลังคาเรือน ไซเวลนั่งอยู่ในควันจนครบทุกหลัง ลินนาขึ้นเกวียนไปวิหาร กลิ่นขมิ้นยังติดผม
        effects: { reputation: { lamp_church: -1 }, flags: [turmeric_failed_the_lit_child] }
    - id: sit_with_her_unseen
      label: นั่งข้างลินนาทั้งคืน ให้พ่อแม่ลงไปนอน
      requires: { trait: curse_brand }
      text: |
        {name}นั่งลงข้างฟูก จุดแสงใต้ผิวเด็กไม่ว่ายมาหา ไม่ว่ายหนี ยังเคลื่อนไปมาเหมือนเดิม เหมือนข้างฟูกตรงนั้นไม่มีใครนั่ง ลินนารู้ก่อนใคร นางขยับมานอนชิด{name} เพราะเป็นด้านเดียวในห้องที่ผิวไม่แสบ

        เด็กหลับตอนตีสอง หลับครั้งแรกในรอบสามคืน ตอนสางคนในชุดอีกคนขึ้นมาดู นั่งลงอีกฝั่งของฟูก จุดแสงว่ายไปรวมกันทางนั้นทันที ลินนาสะดุ้งตื่น จับแขน{name}ไว้แน่น
      effects: { stats: { WIS: 1 }, flags: [sat_unseen_with_the_lit_child] }
    - id: test_with_the_black_lamp
      label: แกะผ้าห่อตะเกียงดำ จุดไว้ข้างฟูก แล้วถือไว้จนสาง
      requires: { org: { id: wick, min_rank: 3 } }
      text: |
        แสงแดงคล้ำของตะเกียงดำตกลงบนผ้าห่ม จุดฟ้าใต้ผิวลินนาหดหนีไปฝั่งตรงข้าม รวมเป็นก้อนเดียวหลังใบหูซ้าย เล็กเท่าเมล็ดถั่ว แล้วหรี่ลง เด็กหายใจยาวขึ้นทีละครั้ง {name}ถือตะเกียงไว้ในระยะแขนทั้งคืน ด้ามเหล็กร้อนขึ้นช้าๆ จนต้องสลับมือ แล้วก็ไม่เหลือมือไหนให้สลับ

        ตอนสาง{name}เขียนรายงานเอง ไข้ ปล่อย เมล็ดถั่วหลังใบหูยังเรืองจางๆ ถ้าดูในที่มืด ฝ่ามือสองข้างของ{name}พองเป็นแนวตรงตามรูปด้ามเหล็ก
      effects: { hp: -2, alignment: { moral: 1 }, flags: [lit_the_black_lamp_for_a_child] }
    - id: keep_the_cart_instead
      label: บอกคนในชุดว่าคืนนี้ขอเฝ้าเกวียน ไม่ขึ้นไปข้างบน
      refuse: true
      text: |
        {name}นั่งบนเกวียนทั้งคืน เสียงเด็กร้องเรียกแม่ลอดหน้าต่างห้องใต้หลังคาลงมาเป็นพักๆ ตีสามเสียงนั้นหยุด

        ตอนสางคนในชุดลงมา ไม่มีใครบอกว่าผู้จุดตัดสินว่าอะไร {name}ก็ไม่ถาม ล่อตัวซ้ายกินหญ้าแห้งในย่ามหมดไปตั้งแต่กลางคืน
      effects: { flags: [kept_the_cart_while_the_child_cried] }

- id: adult.wick_duty_refinery_night
  stage: adult
  scene: refinery
  weight: 20
  time: night
  duty: wick
  when:
    age: [20, 64]
    org: wick
  text: |
    โรงกลั่นน้ำค้างดาวหยุดหม้อกลั่นทั้งแถวตั้งแต่ตะวันตก คนงานกะดึกออกมานั่งกองกันที่ลานหน้าโรง บางคนเอานิ้วอุดหู บางคนเอามือปิดปากเพื่อนที่ฮัมตามเสียงที่ไม่มีใครเปิด หัวหน้ากะชื่อโกเรลบอกว่าเสียงหึ่งในห้องหม้อกลั่นดังขึ้นทุกคืนมาเจ็ดคืน คืนนี้ดังจนคนงานสองคนเดินเข้าไปเองโดยไม่มีใครสั่ง แล้วยังไม่ออกมา

    จานรับดาวบนหลังคาเอียงผิดมุม ขอบจานด้านหนึ่งบิดงอเหมือนมีของหนักทิ้งตัวลงมา ประตูห้องหม้อกลั่นแง้มอยู่ ข้างในมืด ไอเย็นของน้ำค้างดาวลอยออกมาเป็นแผ่นต่ำๆ ตามพื้น ที่หน้าต่างชั้นบนของสำนักงานโรงกลั่น เสมียนบัญชีคนหนึ่งยังไม่กลับบ้าน ยืนดูลานอยู่ในถุงมือหนังสีขาว

    คนในชุดแยกกันยืนทุกประตู งานคืนนี้คือพาคนสองคนนั้นออกมา และไม่ให้ใครเดินเข้าไปเพิ่ม
  choices:
    - id: count_them_at_the_door
      label: ยืนขวางประตูห้องหม้อกลั่น ไม่ให้ใครเข้าเพิ่ม
      text: |
        {name}ตั้งถังทรายขวางประตู คนงานสามคนพยายามเดินเข้าไปในชั่วยามแรก หน้าเรียบเฉยเหมือนคนลุกไปห้องน้ำกลางดึก {name}ผลักกลับทีละคน คนที่สามกัดแขน{name}จนเลือดซึม แล้วนั่งร้องไห้ที่ลานโดยไม่รู้ว่าร้องทำไม

        ใกล้สาง คนในชุดพาคนงานที่เข้าไปออกมาได้คนหนึ่ง อีกคนไม่ได้ออกมา โกเรลขีดเส้นทับชื่อหนึ่งในสมุดคุมกะ แล้วถาม{name}ว่าช่องสาเหตุควรเขียนว่าอะไร {name}บอกให้เขียนว่าไอน้ำค้างดาวรั่ว
      effects: { hp: -1, reputation: { lamp_church: 1 }, flags: [held_the_vat_room_door] }
    - id: listen_for_the_hum
      label: ยืนฟังที่ประตู หาว่าเสียงหึ่งดังมาจากตรงไหน แล้วชี้ให้คนในชุด
      requires: { not_traits: [curse_brand] }
      check: { stat: WIS, dc: 14, foe: star }
      success:
        text: |
          เสียงหึ่งไม่ได้ดังจากหม้อใบไหน ดังจากท่อทองแดงเส้นที่วิ่งขึ้นไปหาจานรับดาว ตรงข้องอที่สาม {name}ฟังจนแน่ใจแล้วถอยออกมาก่อนเสียงจะทันเข้ามาอยู่ในหัว คนในชุดตัดท่อตรงนั้นด้วยเลื่อยเหล็ก น้ำค้างดาวทะลักออกมาเป็นสีฟ้า มีบางอย่างไหลออกมาด้วย หนาและใส ม้วนตัวอยู่บนพื้นครู่หนึ่ง แล้วไม่เคลื่อนอีก

          คนงานสองคนเดินออกมาเองหลังจากนั้นไม่นาน ไม่มีใครจำได้ว่าเข้าไปทำไม เสมียนในถุงมือขาวที่หน้าต่างชั้นบนเขียนอะไรลงสมุดเล่มเล็ก ชี้ปลายปากกามาทาง{name}หนึ่งครั้ง แล้วดับตะเกียงในห้อง
        effects: { stats: { WIS: 1 }, hunted: { star_listeners: 1 }, flags: [found_the_hum_in_the_pipe] }
      failure:
        text: |
          เสียงหึ่งเข้ามาอยู่ในหัวก่อน{name}จะได้ยินว่ามาจากไหน {name}ก้าวเข้าประตูไปสามก้าว แล้วสี่ ก่อนคนในชุดจะกระชากคอเสื้อกลับออกมาได้ ฟันกรามข้างซ้ายปวดไปจนเช้า เลือดกำเดาไหลซึมลงคาง

          คนในชุดตัดท่อทองแดงทุกเส้นที่วิ่งขึ้นไปหาจานรับดาว เส้นละครั้ง จนเจอเส้นที่ใช่ คนงานสองคนเดินออกมาตอนสาง โรงกลั่นหยุดหม้อไปทั้งเดือนเพื่อรอท่อใหม่ คนงานกะดึกทั้งกะไม่ได้ค่าแรง
        effects: { hp: -2, flags: [the_hum_got_in_at_the_vat_room] }
    - id: walk_in_unheard
      label: เดินเข้าห้องหม้อกลั่นไปพาคนงานสองคนนั้นออกมาเอง
      requires: { trait: curse_brand }
      text: |
        ในห้องหม้อกลั่นไอเย็นสูงถึงเข่า คนงานสองคนยืนเรียงกันข้างหม้อใบที่สี่ เงยหน้าดูท่อทองแดงเหนือหัว ปากขยับตามจังหวะที่{name}ไม่ได้ยิน ไม่มีอะไรในห้องหันมาตาม{name}สักอย่าง {name}จูงมือออกมาทีละคนเหมือนจูงเด็ก ไม่มีใครขัดขืน มือทั้งคู่เย็นเหมือนแช่น้ำบ่อ

        พอพ้นประตู คนแรกถามว่าจานรับดาวซ่อมเสร็จหรือยัง คนที่สองถามว่า{name}ไม่ได้ยินเสียงนั้นเหรอ แล้วลืมคำถามของตัวเองไปก่อนจะได้คำตอบ
      effects: { stats: { CON: 1 }, flags: [walked_into_the_vat_room_unheard] }
    - id: burn_the_black_lamp_in_the_vat_room
      label: เข้าห้องหม้อกลั่นพร้อมตะเกียงดำ จุดไว้จนกว่าเสียงจะหยุด
      requires: { org: { id: wick, min_rank: 3 } }
      text: |
        แสงแดงคล้ำแผ่ไปบนไอเย็นเป็นวงกว้างเท่าโต๊ะ ทุกอย่างในห้องที่ไม่ใช่ทองแดงและไม่ใช่คนถอยออกจากวงนั้น บางอย่างถอยขึ้นเพดาน บางอย่างถอยเข้าไปในท่อ คนงานสองคนล้มลงตรงที่ยืนเหมือนเชือกเชิดขาด {name}ยืนถือตะเกียงอยู่กลางห้องจนเสียงหึ่งหยุด หยุดตอนเกือบสาง

        ถ่านในไส้หมดไปหนึ่งในสาม ทอร์เบนจะต้องจดลงสมุดเดือนนี้ ตั้งแต่คืนนั้น{name}หอบเร็วขึ้นเวลาขึ้นบันได เหมือนลมหายใจส่วนหนึ่งไหม้ไปพร้อมถ่านในไส้
      effects: { max_hp: -1, reputation: { lamp_church: 1 }, flags: [burned_the_black_lamp_at_the_vat_room] }
    - id: keep_the_refinery_yard
      label: ขอไปเฝ้าคนงานที่ลานหน้าโรงแทน
      refuse: true
      text: |
        ลานหน้าโรงมีคนงานนั่งอยู่สี่สิบกว่าคน {name}เดินวนรอบกองคนจนสาง แจกน้ำให้คนที่ปากแห้งเพราะฮัมมาทั้งคืน หญิงคนหนึ่งเอาหัวพิงไหล่{name}แล้วหลับไปตอนตีสาม

        ตอนสางคนในชุดพาคนงานออกมาจากห้องหม้อกลั่นได้คนเดียว โกเรลขีดเส้นทับชื่อหนึ่งในสมุดคุมกะ หญิงที่พิงไหล่{name}ยังไม่ตื่น
      effects: { flags: [kept_the_refinery_yard] }

- id: adult.wick_duty_grandmother_witness
  stage: adult
  scene: home
  weight: 20
  time: dusk
  duty: wick
  when:
    age: [20, 64]
    org: wick
  text: |
    พยานของงานคืนก่อนมีคนเดียว หญิงแก่ชื่อแอมมิส ยายของบ้านช่างทำถัง ตีสองนางลุกไปห้องน้ำหลังบ้าน แล้วเห็นสิ่งที่ชุดตามมาทั้งคืนเดินถอยหลังผ่านคอกหมูไป นางเล่าให้ลูกสะใภ้ฟังตั้งแต่เช้า ลูกสะใภ้เล่าให้ร้านขายเกลือฟังตอนสาย พอบ่ายทั้งตลาดรู้ว่ายายแอมมิสเห็นผีเดินถอยหลัง ไม่มีใครเชื่อ ทุกคนเล่าต่อ

    บนแถบผ้าเส้นใหม่ของไซเวลมีชื่อนางชื่อเดียว ไม่ต้องจุดทั้งบ้าน งานของ{name}คือตวงน้ำมันจากถังที่ตีตราชอล์ก ไซเวลบอกเสียงเรียบว่าน้ำมันลืมกับคนแก่ไม่เหมือนคนหนุ่มสาว น้ำมันหาคืนที่ต้องเอา แล้วบางทีก็หยิบคืนข้างๆ ไปด้วย คนแก่มีคืนข้างๆ เยอะกว่า

    ยายแอมมิสรู้ว่าคนแปลกหน้ามาทำไม นางนั่งรอบนเก้าอี้หวายหน้าเตา ผมหวีเรียบ คลุมไหล่ด้วยผ้าผืนดีที่สุด ถาม{name}ว่าจะเอาไปแค่คืนนั้นใช่ไหม คืนที่สามีนางตายก็เป็นคืนเดือนมืดเหมือนกัน นางขอให้เหลือคืนนั้นไว้
  choices:
    - id: measure_as_told
      label: ตวงน้ำมันเต็มขนาดตามที่ไซเวลสั่ง
      text: |
        ยายแอมมิสหลับก่อนตะเกียงจะไหม้ไปครึ่งไส้ หลับนั่งหลังตรงบนเก้าอี้หวาย ผ้าคลุมไหล่ไม่ยับสักรอย ไซเวลนั่งอยู่ในควันกับนางจนสาง

        บ่ายวันต่อมาเกวียนน้ำมันผ่านหน้าบ้านช่างทำถัง ยายแอมมิสนั่งอยู่หน้าบ้าน ร้องเรียกลูกชายให้ออกไปรับพ่อที่ท่าเกวียน บอกว่าป่านนี้พ่อคงเดินมาถึงหัวถนนแล้ว ลูกสะใภ้ยืนอยู่ข้างหลังนาง กำชายผ้ากันเปื้อนแน่น
      effects: { reputation: { lamp_church: 1 }, flags: [oil_took_more_from_ammis] }
    - id: measure_it_short
      label: ตวงให้น้อยกว่าขนาดหนึ่งในสาม หวังว่าน้ำมันจะเอาไปแค่คืนเดียว
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}ตวงทีละหยดในช่วงท้าย นับหยดเหมือนคนดูแลตะเกียงวิหารที่เคยเห็นตอนรอบน้ำมัน ตะเกียงไหม้หมดไส้ก่อนตีสาม ยายแอมมิสหลับ ไซเวลนั่งในควันกับนางจนหมดควัน

          สามวันต่อมาตลาดเลิกเล่าเรื่องผีเดินถอยหลัง เพราะยายแอมมิสเองบอกทุกคนว่าคืนนั้นนางเป็นไข้ ไม่ได้ลุกไปไหน ตอนเย็นนางยังไปนั่งหน้าหลุมศพสามีเหมือนทุกเย็นเดือนมืด
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [measured_ammis_oil_short] }
      failure:
        text: |
          ตะเกียงดับก่อนเที่ยงคืน ยายแอมมิสหลับไปครึ่งเดียว ตื่นมาตอนสายจำได้ครึ่งเรื่อง จำได้ว่ามีอะไรเดินถอยหลัง จำไม่ได้ว่าผ่านอะไร นางเอาถ่านวาดรอยเท้ากลับด้านไว้บนประตูหลังบ้าน

          คืนถัดมาไซเวลตวงเอง เต็มขนาด แล้วเติมอีกครึ่ง ทอร์เบนหักค่าน้ำมันที่เสียเปล่าจากค่าจ้างของ{name}สองเหรียญ ยายแอมมิสตื่นมาเรียกลูกสะใภ้ด้วยชื่อของลูกสาวที่แต่งออกไปนานแล้ว
        effects: { gold: -2, flags: [oil_took_more_from_ammis] }
    - id: sit_in_the_smoke_with_her
      label: นั่งในควันแทนไซเวล จับมือยายแอมมิสไว้จนหลับ
      requires: { flag: lost_a_night_to_the_oil }
      text: |
        {name}เคยตื่นมาบนเกวียนพร้อมไข้มาแล้ว รู้ว่าก่อนหลับควันน้ำมันลืมหนักเหมือนผ้าห่มเปียก และรู้ว่าตอนนั้นไม่อยากอยู่คนเดียว ยายแอมมิสจับมือ{name}ไว้ตั้งแต่ไส้ติดไฟ เล่าเรื่องสามีไปเรื่อยๆ จนเสียงเบาลงเอง

        {name}ตื่นบนเกวียนพร้อมไข้อีกครั้ง หลังมือมีรอยเล็บเล็กๆ สี่รอยเรียงกัน ไซเวลผูกแถบผ้าเส้นใหม่ไว้ที่ข้อมือ{name} บนแถบเขียนว่า บ้านช่างทำถัง นั่งในควัน มือ
      effects: { alignment: { moral: 1 }, flags: [lost_a_night_to_the_oil, held_ammis_hand_in_the_smoke] }
    - id: let_saiwel_measure
      label: บอกไซเวลว่าคืนนี้ไม่ขอแตะถังตีตราชอล์ก
      refuse: true
      text: |
        ไซเวลไม่ถามเหตุผล นางตวงเอง มือนางนิ่งกว่ามือ{name} ทุกหยดลงถ้วยตะเกียงตรงกลางพอดี {name}รออยู่หน้าบ้านกับเกวียนจนสาง

        ตอนเกวียนออก ยายแอมมิสยังหลับอยู่บนเก้าอี้หวาย ลูกสะใภ้เอาผ้าห่มมาคลุมตักให้ ไม่มีใครในชุดรู้ว่านางจะตื่นมาจำอะไรได้บ้าง ไซเวลก็ไม่รู้
      effects: { flags: [would_not_measure_for_ammis] }

- id: adult.wick_duty_day_late
  stage: adult
  weight: 20
  duty: wick
  when:
    age: [20, 64]
    org: wick
  text: |
    เกวียนของชุดถึงหมู่บ้านช้าไปหนึ่งวันเต็ม สะพานข้ามลำห้วยพังตั้งแต่ฝนต้นเดือน ต้องอ้อมไปข้ามที่ท่าน้ำตื้น ล่อตัวหนึ่งไม่ยอมลงน้ำจนต้องลากกันครึ่งเช้า พอไปถึงก็ไม่ต้องให้ใครบอกว่าเกิดอะไร เด็กสองคนนอนไข้ ฉางข้าวกลางหมู่บ้านตอกไม้กากบาทปิดประตู ไม่มีใครเข้าใกล้เกินระยะขว้างก้อนหิน

    คนเฒ่าที่ดูแลฉางลากกระสอบออกมาให้ดูหนึ่งใบ เมล็ดข้าวดูดีทุกเมล็ด แต่บีบแล้วยุบ ข้างในกลวง เปลือกบางใสเหมือนปีกแมลง ฉางนี้เก็บข้าวไว้ทั้งหมู่บ้านจนถึงเกี่ยวรอบหน้า ข้าวดีที่ยังเหลือก็ปนอยู่ในกองนั้น ยังไม่มีใครรู้ว่าของที่ผ่านฉางเมื่อคืนก่อนออกไปแล้วหรือยัง
  choices:
    - id: burn_the_granary
      label: ราดน้ำมันรอบฉาง แล้วจุดไฟทั้งหลัง
      text: |
        ไฟลุกเร็วกว่าที่ใครคิด ฉางไม้เก่าแห้งทั้งหลัง ตอนหลังคาทรุด มีเสียงแหลมเสียงหนึ่งดังขึ้นจากกลางกองไฟ สูงเกินหูจะรับ แล้วขาดหายไป คนในหมู่บ้านยืนดูจนไฟมอด ไม่มีใครดับ ไม่มีใครด่า

        คืนนั้นชุดแจกเหรียญจากหีบค่าเสียหายของศาสนจักร หลังคาเรือนละสองเหรียญ เดือนนั้นข้าวสารในตลาดที่ใกล้ที่สุดขึ้นราคาเป็นสามเท่า
      effects: { reputation: { lamp_church: 1 }, flags: [burned_a_village_granary] }
    - id: weigh_every_sack
      label: ลากกระสอบออกมาชั่งทีละใบ แยกข้าวดีออกก่อนเผา
      check: { stat: INT, dc: 14 }
      success:
        text: |
          ข้าวกลวงเบากว่าข้าวดีพอให้ตาชั่งของคนเฒ่าบอกได้ {name}ชั่งทั้งวันจนแขนสั่น ได้กระสอบดีสามสิบเอ็ดใบจากเก้าสิบ ที่เหลือกองรวมไว้ในฉางให้ไฟเผาพร้อมกันตอนพลบ ตอนลากกระสอบใบที่สี่สิบ ข้างในมีเสียงกรอบแกรบแบบของที่ไม่ใช่ข้าว {name}โยนกลับเข้าฉางทั้งใบโดยไม่แกะ แล้วล้างมือด้วยน้ำมันตะเกียงสองครั้ง

          ปีนั้นหมู่บ้านกินข้าวมื้อละครึ่งชามจนถึงเกี่ยวรอบหน้า ไม่มีบ้านไหนต้องกินเปลือก
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [saved_good_sacks_from_the_granary] }
      failure:
        text: |
          ตาชั่งของคนเฒ่าคลาดไปทีละนิดทุกครั้งที่ชั่ง {name}ชั่งสองรอบได้คำตอบไม่ตรงกัน สุดท้ายต้องเปิดปากกระสอบบีบดูทีละกำ ปลายนิ้วถลอกจนเลือดซึมติดเปลือกข้าว ได้กระสอบดีไม่ถึงสิบใบก่อนฟ้ามืด

          ไฟเผาฉางตอนพลบพร้อมกระสอบที่ยังไม่ได้ชั่งอีกห้าสิบกว่าใบ คนเฒ่านับกระสอบดีซ้ำสามรอบ ได้เก้าทุกรอบ
        effects: { hp: -1, flags: [weighed_the_hollow_grain] }
    - id: go_in_first_unseen
      label: เข้าไปในฉางก่อนคนอื่น ดูว่าของที่ผ่านมายังอยู่ไหม
      requires: { trait: curse_brand }
      text: |
        ในฉางมืดและอุ่น มีกลิ่นข้าวสุกลอยอยู่ ไม่มีใครหุง {name}เดินระหว่างกองกระสอบช้าๆ จนเห็นมันบนกองบนสุดใกล้ขื่อ ตัวบางใสเท่าลูกแมว นั่งกินอยู่ ข้าวทั้งเมล็ดหายเข้าไปในตัวแล้วไม่ออกมาอีกทางไหน {name}ยืนห่างแค่ช่วงแขน มันก็ยังไม่หันมา

        {name}ถอยออกมาชี้ที่ให้คนในชุด ไฟจุดเฉพาะมุมนั้นด้วยผ้าชุบน้ำมันผูกปลายขอเหล็ก ฉางไหม้ไปหนึ่งในสี่ กระสอบอีกสามในสี่ลากออกมาได้ก่อนไฟลาม คนเฒ่าดูแลฉางเดินมาจับแขน{name}ไว้ครู่หนึ่ง ไม่ได้บอกว่าทำไม
      effects: { stats: { DEX: 1 }, flags: [found_the_grain_eater_unseen] }
    - id: wait_by_the_ford
      label: บอกว่าจะเฝ้าล่อกับเกวียนไว้ที่ท่าน้ำ
      refuse: true
      text: |
        ท่าน้ำตื้นตอนบ่ายมีแต่เสียงน้ำกับเสียงล่อเคี้ยวหญ้า ควันจากกลางหมู่บ้านลอยขึ้นตอนพลบ ตั้งตรงเพราะไม่มีลม

        คนในชุดกลับมาที่เกวียนตอนสามทุ่ม เสื้อเหม็นควันข้าวไหม้ ไม่มีใครบอก{name}ว่าเหลือกระสอบกี่ใบ
      effects: { flags: [waited_by_the_ford] }

# ---------- การปะทะ (ไม่กันยศ คนมีตราไม่ได้ฉากเหล่านี้) ----------
- id: adult.wick_duty_moth_attic
  stage: adult
  scene: workshop
  weight: 20
  time: night
  duty: wick
  when:
    age: [20, 64]
    org: wick
    not_traits: [curse_brand]
  text: |
    บนจั่วโรงย้อมผ้าหลังนั้นมีจานรับดาวใบเล็ก เจ้าของติดเองไว้ขายน้ำค้างดาวให้โรงกลั่นเป็นรายได้เสริม สามคืนก่อนจานรับอะไรบางอย่างลงมามากกว่าที่ควร ตั้งแต่นั้นห้องใต้หลังคามีเสียงหึ่งทั้งคืน ผ้าย้อมที่ตากไว้ข้างบนเป็นรูพรุนเท่าปลายเข็มทุกผืน

    คนในชุดแบ่งกันขึ้นบันไดหน้ากับบันไดหลัง {name}ได้บันไดหลัง พร้อมถังน้ำมัน ผ้าชุบน้ำมัน และหม้อดินที่สุมฟางเปียกไว้ให้ควันขึ้น ฝาห้องใต้หลังคาเปิดได้ครึ่งเดียว ข้างบนมีแสงจางๆ เป็นร้อยจุด หมุนวนเป็นก้อน แต่ละจุดเล็กเท่าเล็บมือ ปีกใส
  encounter:
    foe: hum_moth
    name: ฝูงแมลงหึ่งใต้จั่ว
    morale: 2
    beats:
      - text: ฝูงแมลงหึ่งรู้ตัวตอนฝาเปิด ก้อนแสงคลายออกเป็นม่านบาง ลอยลงมาหาช่องบันได เสียงหึ่งไม่ได้ดังขึ้น แต่ใกล้ขึ้น
        moves:
          - id: moth_smoke_pot
            label: ยกหม้อฟางเปียกขึ้นวางขอบฝา ให้ควันเข้าห้องก่อนตัวเอง
            kind: item
            stat: DEX
            tags: [smoke]
            success: ควันฟางเปียกขึ้นเป็นลำหนา ม่านแสงตรงช่องบันไดขาดเป็นรู แมลงหึ่งที่โดนควันร่วงลงมาเป็นเม็ดๆ ตกใส่ไหล่{name}เหมือนเมล็ดงาที่ยังอุ่น
          - id: moth_oil_rag
            label: จุดผ้าชุบน้ำมันพันปลายไม้ ยื่นขึ้นไปก่อนหัว
            kind: item
            stat: DEX
            tags: [fire]
          - id: moth_knife
            label: ปีนขึ้นไปฟันม่านแสงด้วยมีดพก
            kind: attack
            tags: [edge]
          - id: moth_half_hatch
            label: ดึงฝาลงครึ่งหนึ่ง ให้ฝูงต้องเบียดลงมาทีละน้อย
            kind: guard
      - text: แมลงหึ่งส่วนหนึ่งลอดลงมาได้ เกาะผม เกาะคอเสื้อ เกาะหลังมือที่จับราวบันได เสียงหึ่งย้ายจากข้างหน้าเข้ามาอยู่ข้างหู
        answer: guard
        moves:
          - id: moth_wet_cloth
            label: ดึงผ้าเปียกที่คอขึ้นคลุมหัวทั้งหัว ก้มนิ่ง
            kind: guard
          - id: moth_smoke_self
            label: เอาหม้อควันมาถือไว้ใต้คาง ให้ควันขึ้นรอบตัว
            kind: item
            stat: CON
            tags: [smoke]
          - id: moth_slap_down
            label: ตบไล่ตามตัว เร็วที่สุดที่มือทำได้
            kind: quick
          - id: moth_step_down
            label: ถอยลงบันไดสองขั้น ให้ฝูงตามลงมาในช่องแคบ
            kind: read
            stat: WIS
      - text: กลางห้องใต้หลังคา ใต้รูที่ต่อขึ้นไปหาจานรับดาว แมลงหึ่งที่เหลือจับกันเป็นก้อนแน่นเท่าลูกมะพร้าว ส่องแสงสว่างกว่าทุกตัวรวมกัน ก้อนนั้นสั่นตามเสียงหึ่ง ผ้าย้อมที่แขวนอยู่ใกล้ที่สุดเริ่มเป็นรูพรุนต่อหน้าต่อตา
        answer: item
        moves:
          - id: moth_oil_the_heart
            label: สาดน้ำมันใส่ก้อนแสง แล้วโยนผ้าที่ติดไฟตาม
            kind: item
            stat: DEX
            tags: [fire]
            success: น้ำมันติดไฟทั้งก้อน แสงฟ้ากับแสงไฟพันกันอยู่ครู่หนึ่ง เสียงหึ่งแตกเป็นเสียงเล็กๆ นับไม่ถ้วน แล้วเงียบ เถ้าละเอียดสีเงินร่วงลงพื้นเป็นวงกลมเท่าถาด
          - id: moth_sack_the_dish
            label: เอากระสอบเปียกยัดอุดรูที่ต่อขึ้นไปหาจานรับดาว
            kind: read
            stat: INT
          - id: moth_smoke_corner
            label: เทฟางเปียกที่เหลือทั้งหม้อลงตรงใต้ก้อนแสง
            kind: item
            stat: WIS
            tags: [smoke]
          - id: moth_swing_rag
            label: ฟาดผ้าย้อมผืนยาวใส่ก้อนแสงจนแตก
            kind: attack
    win:
      text: |
        ก่อนสาง ห้องใต้หลังคาไม่มีเสียงอะไรนอกจากเสียงไม้หดตัว เถ้าสีเงินกองอยู่ตามพื้นเป็นหย่อมๆ คนในชุดกวาดใส่กระสอบตะกั่วจนเกลี้ยง ผ้าย้อมพรุนทุกผืนลงไปเข้ากองไฟหลังโรง

        เจ้าของโรงย้อมปีนขึ้นไปถอดจานรับดาวลงจากจั่วด้วยตัวเองตอนสาย แล้วเอาไปทิ้งลงบ่อหลังบ้าน
      effects: { reputation: { lamp_church: 1 }, flags: [burned_the_hum_moths_in_the_dye_loft] }
    lose:
      text: |
        {name}ตื่นมาบนพื้นโรงย้อม หูอื้อ ภาพซ้อนเป็นสองไปจนเที่ยง คนในชุดที่ขึ้นบันไดหน้าทำงานที่เหลือจนจบ แล้วลากตัว{name}ลงมาวางไว้ข้างอ่างย้อมคราม

        ตลอดสัปดาห์ เวลามีเสียงหึ่งของแมลงธรรมดาผ่านหู มือของ{name}จะยกขึ้นปัดเองก่อนรู้ตัว
      effects: { flags: [fell_in_the_dye_loft] }
    stalemate:
      text: |
        ฟ้าเริ่มสว่าง แสงจากหน้าต่างจั่วลอดเข้ามา แมลงหึ่งที่เหลือบินขึ้นไปเกาะรวมกันในจานรับดาว แสงของพวกมันจางลงจนแยกไม่ออกจากแสงเช้า

        คนในชุดปีนขึ้นหลังคา ถอดจานทั้งใบ ห่อผ้าชุบน้ำมันสามชั้น แล้วยกขึ้นเกวียนไปทั้งอย่างนั้น เจ้าของโรงย้อมถามว่าจะได้ค่าจานคืนไหม ไม่มีใครตอบ
      effects: { reputation: { lamp_church: 1 }, flags: [took_down_the_dye_house_dish] }

- id: adult.wick_duty_eye_in_the_bell_tower
  stage: adult
  scene: temple
  weight: 20
  duty: wick
  when:
    age: [20, 64]
    org: wick
    not_traits: [curse_brand]
  text: |
    คนตีระฆังของวิหารเล็กหลังนั้นนับไม่หยุดมาสองวันแล้ว นับขั้นบันได นับเม็ดข้าวในชาม นับลมหายใจตัวเอง นับผิดแล้วนับใหม่ เขาเห็นของบางอย่างในหอระฆังตอนขึ้นไปตีระฆังเย็น ลูกตาเท่าหัวคน ลอยนิ่งอยู่ใต้ระฆัง ไม่มีหนังตา ตั้งแต่นั้นระฆังของวิหารไม่ได้ตีอีกเลย

    หอระฆังสูงสามชั้น บันไดไม้วนตามผนังด้านใน ชั้นบนสุดมีช่องลมสี่ด้าน คนในชุดสุมฟางเปียกกับผ้าชุบน้ำมันไว้ที่โคนหอ รอสัญญาณจุด งานของ{name}คือขึ้นไปหาให้เจอว่ามันลอยอยู่ชั้นไหน แล้วต้อนให้ลอยออกทางช่องลม ห้ามสบตา ทุกคนในชุดพูดประโยคนี้กับ{name}ก่อนประโยคอื่น
  encounter:
    foe: float_eye
    name: ตาลอยใต้ระฆัง
    morale: 2
    beats:
      - text: ชั้นสอง ตาลอยอยู่ต่ำระหว่างคานสองตัว รูม่านตาขยายจนเกือบเต็มลูก แล้วค่อยๆ หมุนตามเสียงเท้าบนบันได ยังไม่ถึงหน้า{name} แต่ใกล้แล้ว
        moves:
          - id: eye_face_the_wall
            label: หันหน้าเข้าผนัง ก้าวขึ้นทีละขั้นโดยไม่เงย
            kind: guard
          - id: eye_signal_smoke
            label: ตะโกนลงไปให้คนข้างล่างจุดกองฟาง
            kind: item
            stat: CHA
            tags: [smoke]
            success: ข้างล่างจุดไฟทันทีที่ได้ยินคำแรก ควันฟางเปียกพุ่งขึ้นตามช่องบันไดเป็นปล่อง ตาลอยถอยขึ้นไปชิดเพดานชั้นสอง รูม่านตาหดเหลือเท่าปลายเข็ม
          - id: eye_count_turns
            label: นับจังหวะที่มันหมุนตามเสียง แต่นับจากเงาบนผนัง ไม่ใช่จากตัวมัน
            kind: read
            stat: WIS
          - id: eye_talk_low
            label: พูดกับมันเสียงต่ำ เหมือนพูดกับวัวตื่น
            kind: talk
      - text: ตาลอยลอยขึ้นตามมาถึงชั้นสาม ใต้ระฆังพอดี ระฆังสั่นเบาๆ เอง ไม่มีใครแตะ เสียงหึ่งต่ำๆ ไล่ขึ้นตามโลหะ {name}รู้ว่าลูกตาหันมาแล้ว รู้จากความเย็นที่ท้ายทอย
        answer: guard
        moves:
          - id: eye_close_and_climb
            label: หลับตา คลำราวบันไดขึ้นไปตามความจำ
            kind: guard
          - id: eye_rag_on_beam
            label: เหวี่ยงผ้าชุบน้ำมันที่ลุกเป็นควันขึ้นไปพาดบนคาน
            kind: item
            stat: DEX
            tags: [smoke]
          - id: eye_pole_push
            label: ใช้ไม้ค้ำระฆังดันมันออกห่างจากตัว
            kind: attack
            tags: [blunt]
          - id: eye_duck_under_bell
            label: มุดลงใต้ขอบระฆัง ให้โลหะบังสายตามันไว้
            kind: quick
      - text: ควันลอยขึ้นมาถึงชั้นบนสุดแล้ว ตาลอยลอยวนอยู่ระหว่างช่องลมสองด้าน ช่องหนึ่งเปิดออกไปหาฟ้า อีกช่องหันลงไปหาลานวิหาร ตรงที่คนตีระฆังยืนนับอยู่
        answer: item
        moves:
          - id: eye_block_the_yard_side
            label: เอาผ้าคลุมไหล่ปิดช่องลมด้านลานวิหาร
            kind: guard
          - id: eye_wave_smoke_out
            label: ใช้ฝาหม้อพัดควันไล่จากด้านหลัง ต้อนไปทางช่องที่เปิดหาฟ้า
            kind: item
            stat: DEX
            tags: [smoke]
            success: ควันก้อนสุดท้ายไล่หลังลูกตาออกไปทางช่องลม ตาลอยลอยขึ้นสูงเหนือหลังคาวิหาร เล็กลง เล็กลง จนเหลือจุดซีดหนึ่งจุด แล้วจุดนั้นก็ไม่อยู่ตรงนั้นอีก
          - id: eye_strike_bell
            label: ตีระฆังเต็มแรงหนึ่งครั้ง
            kind: attack
            tags: [noise]
          - id: eye_read_the_wind
            label: รอให้ลมเปลี่ยนทิศ ให้ควันพาไปเอง
            kind: read
            stat: INT
    win:
      text: |
        ตาลอยออกไปทางช่องลมด้านที่เปิดหาฟ้า คนตีระฆังที่ยืนอยู่กลางลานหยุดนับเป็นครั้งแรกในรอบสองวัน หยุดที่เลขเจ็ดร้อยกว่า แล้วถามคนข้างตัวว่าวันนี้วันอะไร

        เย็นนั้นระฆังของวิหารเล็กตีตรงเวลา คนในชุดเก็บฟางที่เหลือขึ้นเกวียน ส่วนคืนนี้คนตีระฆังต้องนอนในห้องที่ไซเวลจุดตะเกียงดวงเล็กไว้
      effects: { reputation: { lamp_church: 1 }, flags: [smoked_the_eye_from_the_bell_tower] }
    lose:
      text: |
        {name}จำไม่ได้ว่าลงจากหอระฆังมาได้อย่างไร คนในชุดเล่าว่า{name}ยืนนิ่งอยู่บนบันไดชั้นสามจนพวกเขาต้องขึ้นไปจูงลงมาเหมือนจูงคนละเมอ ส่วนตาลอยออกไปเองตอนควันขึ้นถึงยอด

        สองวันต่อจากนั้น{name}นับขั้นบันไดทุกขั้นที่เดินผ่าน นับผิดแล้วนับใหม่ เหมือนคนตีระฆัง
      effects: { flags: [counted_after_the_bell_tower] }
    stalemate:
      text: |
        ควันขึ้นถึงยอดหอพร้อมกับแสงแรกของวัน ตาลอยลอยออกทางช่องลมไปเองโดยไม่มีใครต้อน ช้าเหมือนคนเดินออกจากงานเลี้ยงที่ไม่มีใครรู้จัก

        คนในชุดปีนขึ้นไปขัดใต้ระฆังด้วยทรายกับน้ำด่างจนถึงเที่ยง ระฆังตีได้อีกครั้งตอนเย็น เสียงทุ้มกว่าเดิมนิดหนึ่ง คนตีระฆังบอกว่าเหมือนเดิมทุกอย่าง
      effects: { reputation: { lamp_church: 1 }, flags: [waited_out_the_eye_in_the_bell_tower] }
