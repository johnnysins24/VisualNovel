# ชุด อ สายงานของอาณาจักร: ราชการ (crown_office) 16 เรื่อง ทางเข้า 3 งานขั้นต้น 4 งานขั้นสูง 3 โต๊ะสี่กุญแจ 1 เลื่อนขั้น 3 วันเปิดสมุด 1 ใบลา 1
# ทางเข้าสองทางอยู่ที่ศาลาอำเภอ (คนในหมู่บ้านอาร์เวล) ทางที่สามคือโต๊ะของคลังที่ท่าเรือเหาะเวนทราส คนที่ลงชื่อขึ้นเกวียนคลังไปอยู่อำเภอ (location_tag: arvel_village)
# วันเปิดสมุดออกทุกแปดปีที่อยู่ในศาลาจนกว่าจะขึ้นขุนคลัง (must คู่กับ once: false แบบวันครบสัญญา ทุกทางต่อวาระหรือลาออก) ข้อความจึงไม่เอ่ยถึงวาร์เดล ซึ่งย้ายเข้าเวนทราสเมื่อตัวละครขึ้นนายอำเภอ
# คนของศาลา (มีแต่ในข้อความ ไม่อยู่ในผังคน): วาร์เดล นายอำเภอร่างท้วมที่เก็บสมุดเตาเล่มจริงไว้ในถังข้าวสาร ได้ใบตั้งเข้าเวนทราสในฉากขึ้นเป็นนายอำเภอ
#   เรื่องที่เขายังนั่งห้องนายอำเภออยู่จึงกัน max_rank: 2 · เทสมิน เสมียนใหญ่ จำได้ว่าบ้านไหนดับไฟหนีการนับและไม่เคยจดลงเล่มไหน
#   ฮอลริค คนขี่ม้าของคลัง ถือกุญแจดอกที่สาม ไม่เคยค้างคืน · โมเรส ขุนคลังที่อยู่โต๊ะนานที่สุด ถือสมุดหนี้ (ไฟล์นี้เขียนเป็นชายชรา)
# ทุกเรื่องในไฟล์นี้ไม่ผูกปี จึงไม่เอ่ยถึงกษัตริย์ ตรา หรือว่าสงครามถ่านจบหรือยัง ไม่บอกชื่ออำเภอ
# งานขั้นสูงสองเรื่องที่ตัดสินแทนอำเภอ (ยุ้งหลวง ใบเกณฑ์) กัน max_rank: 3 เพราะขุนคลังที่เวนทราสไม่ได้ถือตรายุ้งของอำเภอ
#   งานซ้ำขั้นสูง (กองกระดาษรอตรา) เขียนให้อ่านได้ทั้งนายอำเภอและขุนคลัง
# ขยับค่าอาณาจักร: ยุ้งหลวงกับใบเกณฑ์ ±1 (นายอำเภอ) · โต๊ะสี่กุญแจ ±2 (ขุนคลัง) ทางที่ปัดของทุกเรื่องไม่ขยับค่า
# ผลงานเพิ่มนอกงาน: แตะปล่องทุกหลัง 1 · หีบภาษี 1 (ขี่ม้ากลับ หรือคัดเล่มใหม่) · แจกข้าวตามชื่อของเทสมิน 1 · จับฉลากใบเกณฑ์ 1 · ฉีกใบลา 1
#   กับงานที่เวนทราสเห็นผล: ขายข้าวเติมหีบ 1 · ลงชื่อใบเกณฑ์ครบสิบสอง 1 · วัดเขตบ่อจากหมุดหิน 1 ต่อครั้ง · อ่านกองกระดาษทุกบรรทัด 1 ต่อครั้ง
#   ผลงานของสายนี้มาจากสิ่งที่คลังเห็น ทางที่เลี้ยงคนในอำเภอ (เปิดยุ้ง ส่งคนครึ่งเดียว) ไม่ได้ผลงานเพิ่ม ขั้นขุนคลังจึงถึงได้ในปลายอาชีพของคนที่ทำงานให้หีบ

# ---------- ทางเข้า ----------
- id: adult.office_porch_notice
  stage: adult
  scene: market
  weight: 16
  when:
    age: [20, 40]
    location_tag: arvel_village
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    max_hunted: { crown: 0 }
    not_flags: [job_wardens, job_fort_priest, left_the_crown_office]
  text: |
    ประกาศของศาลาอำเภอตอกอยู่บนเสาระเบียงคำร้องต้นที่สาม ใต้ประกาศหาวัวหาย ข้างประกาศขายลานตากข้าว กระดาษใหม่กว่าแผ่นอื่นจนขาวตา ศาลาต้องการเสมียนหนึ่งคน อ่านออก เขียนได้ บวกเลขได้ถึงหลักพันโดยไม่ใช้นิ้ว เบี้ยเป็นเหรียญกับข้าวสารทุกต้นเดือน ใครจะสอบให้มาที่ระเบียงก่อนตะวันตรงหัว

    ข้อสอบนั่งรออยู่บนม้านั่งยาวแล้ว เป็นยายคนหนึ่ง ผ้าพันหัวสีคราม ตะกร้าไข่วางบนตัก ยายมาขอให้ศาลาสั่งเพื่อนบ้านรื้อเล้าหมูที่สร้างทับรางน้ำ ยายเขียนหนังสือไม่เป็น หญิงผมสีดอกเลาที่นั่งโต๊ะข้างประตูศาลาเสียบปากกาขนนกไว้ในมวยผมสองด้าม นางชื่อเทสมิน เป็นเสมียนใหญ่ นางยื่นกระดาษเปล่ากับขวดหมึกให้คนมาสอบทุกคน ใครเขียนคำร้องของยายได้ตรงกับที่ยายพูด และศาลาอ่านแล้วรู้เรื่อง คนนั้นได้ม้านั่ง

    ก่อนถึง{name}มีคนสอบไปแล้วสองคน กระดาษสองแผ่นวางซ้อนกันอยู่ใต้ก้อนหิน แผ่นบนเขียนคำว่าเล้าหมูไว้สามครั้ง สะกดไม่เหมือนกันสักครั้ง
  choices:
    - id: write_the_pigsty_petition
      label: นั่งลงฟังยายเล่า แล้วเขียนคำร้องให้
      requires: { not_traits: [curse_brand] }
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ยายเล่ายาวตั้งแต่สมัยที่เพื่อนบ้านยังเป็นเด็กเลี้ยงควาย ไปจนถึงหมูตัวที่ชอบนอนแช่ในรางน้ำ {name}เขียนแค่สามบรรทัด ใครร้อง ร้องเรื่องอะไร ขอให้ศาลาทำอะไร เทสมินอ่านออกเสียงให้ยายฟัง ยายบอกว่า นั่นแหละ ที่พูดมาทั้งเช้าก็แค่นั้น แล้วหยิบไข่ใบหนึ่งวางข้างขวดหมึก

          เทสมินเลื่อนขวดหมึกไปไว้หน้าม้านั่งว่างตัวปลายโต๊ะ บอกให้มาก่อนไก่ขันพรุ่งนี้ ไข่ใบนั้นเป็นเบี้ยก้อนแรกของ{name} ต้มกินที่ระเบียงศาลาตอนเช้าวันรุ่งขึ้น
        effects:
          mark: เข้าเป็นเสมียนศาลาอำเภอ
          org: { id: crown_office, join: true }
          stats: { INT: 1 }
          flags: [wrote_the_pigsty_petition]
      failure:
        text: |
          {name}เขียนตามที่ยายพูดทุกคำ รวมถึงคำที่ยายเรียกแม่ของเพื่อนบ้าน เทสมินอ่านแล้วหัวเราะจนปากกาในมวยผมสั่น บอกว่าถ้าศาลาส่งฉบับนี้ไป คนที่ต้องโดนเรียกตัวก่อนคือยาย

          ม้านั่งตัวนั้นตกเป็นของเด็กหนุ่มลูกคนขายน้ำมันที่สอบเป็นคนที่สี่ ศาลาเก็บค่ากระดาษกับค่าหมึกจากคนสอบตก แผ่นละครึ่งเหรียญ ไม่มีข้อยกเว้น
        effects: { gold: -1, flags: [failed_the_clerks_test] }
    - id: start_at_the_ink
      label: ขอเริ่มจากล้างขวดหมึกกับกวาดระเบียงไปก่อน
      requires: { not_traits: [curse_brand] }
      text: |
        เทสมินชี้ไม้กวาดที่พิงเสาอยู่ แล้วชี้ถังน้ำใต้ระเบียง ขวดหมึกของศาลามียี่สิบเอ็ดขวด ก้นขวดทุกใบมีหมึกแห้งเป็นชั้นเหมือนดินตะกอนริมคลอง เดือนแรก{name}ล้างขวด กวาดระเบียง แล้วนั่งคัดใบรับภาษีเตาแบบเดียวกันวันละหลายสิบแผ่นจนลายมือเปลี่ยน

        เดือนที่สอง เทสมินยื่นคำร้องฉบับแรกให้เขียนเอง เป็นคำร้องเรื่องเล้าหมูทับรางน้ำของยายคนเดิม เพื่อนบ้านยังไม่รื้อ
      effects:
        mark: เข้าเป็นเสมียนศาลาอำเภอ
        org: { id: crown_office, join: true }
        alignment: { law: 1 }
        flags: [started_at_the_ink_bottles]
    - id: keep_the_hat_on
      label: เขียนคำร้องให้ยายโดยไม่ถอดหมวก
      requires: { flag: horns_sawn }
      text: |
        กฎของศาลาเขียนไว้ที่วงกบประตู ใต้ชายคาให้ถอดหมวก เทสมินอ่านคำร้องที่{name}เขียนจบ แล้วเงยหน้าดูหมวกสักหลาดใบเก่าบนหัว{name}อยู่ครู่หนึ่ง นางลุกขึ้นยกม้านั่งว่างตัวนั้นออกไปตั้งที่ปลายระเบียง ตรงที่ชายคายื่นไม่ถึง บอกว่าเสมียนที่นั่งตรงนี้โดนแดดบ่าย ใส่หมวกได้

        คนในศาลาเรียก{name}ว่าเสมียนกลัวแดดอยู่ทั้งฤดู ไม่มีใครถามต่อ ทุกบ่าย{name}เลื่อนม้านั่งตามเงาเสาไปทีละคืบ หมวกไม่เคยลงจากหัวจนกว่าจะถึงบ้าน
      effects:
        mark: เข้าเป็นเสมียนศาลาอำเภอ
        org: { id: crown_office, join: true }
        flags: [serves_the_crown_with_hidden_horns]
    - id: read_the_cow_notice
      label: อ่านประกาศจบแล้วเดินต่อไปตลาด
      pass: true
      text: |
        ตอนเดินลงบันไดระเบียง ยายเรียก{name}ให้อ่านประกาศหาวัวหายบนเสาต้นเดียวกันให้ฟังที วัวสีแดง เขาหักข้างหนึ่ง ใครพบให้แจ้งศาลา {name}อ่านจบ ยายบอกว่าวัวตัวนั้นเป็นของยายเอง หายไปตั้งแต่เดือนก่อน ศาลายังไม่เคยแจ้งอะไรกลับมาเลย

        {name}ซื้อไข่ยายไปสองฟอง ยายหยิบให้สามฟอง
      effects: { alignment: { moral: 1 }, flags: [read_the_porch_notices_aloud] }

- id: adult.office_queue_sum
  stage: adult
  scene: market
  weight: 28
  when:
    age: [20, 40]
    location_tag: arvel_village
    any_flags: [job_clerk, job_news_walker, job_merchant, institute_graduate]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    max_hunted: { crown: 0 }
    not_flags: [job_wardens, job_fort_priest, left_the_crown_office]
  text: |
    แถวหน้าระเบียงคำร้องยาวไปถึงบ่อน้ำกลางลาน {name}ถือกระดาษแผ่นเดียวมารอตรารับ ธุระครึ่งเช้ากลายเป็นธุระทั้งวัน เพราะเสมียนหนุ่มที่โต๊ะหน้าบวกเลขด้วยนิ้วมือ แล้วบวกซ้ำด้วยนิ้วมืออีกรอบเพื่อให้แน่ใจ

    พอถึงตา {name}เห็นตัวเลขในสมุดตรงหน้าเสมียนกลับหัว ยอดเตาของซอยหนึ่งบวกขาดไปสิบเจ็ด ปากบอกออกไปก่อนจะห้ามทัน เสมียนหนุ่มนับนิ้วใหม่ทีละนิ้ว หูแดงขึ้นทีละข้าง

    ชายร่างท้วมที่นั่งกินขนมข้าวเหนียวอยู่หลังโต๊ะลุกขึ้น ปัดแป้งออกจากหน้าอกเสื้อ เขาคือวาร์เดล นายอำเภอ เขาหยิบสมุดเล่มนั้นมาพลิกให้ดูหน้าถัดไป หน้าถัดไปอีก ทั้งเล่มบวกด้วยนิ้วมือ แล้วบอกว่าศาลามีม้านั่งว่างอยู่ตัวหนึ่ง ไม่ได้ว่างเพราะไม่มีใครอยากนั่ง ว่างเพราะคนที่นั่งได้ไม่มีใครทนเบี้ยไหว
  choices:
    - id: take_the_empty_stool
      label: เดินอ้อมโต๊ะไปนั่งม้านั่งตัวนั้น
      requires: { not_traits: [curse_brand] }
      text: |
        เสมียนหนุ่มย้ายไปยืนประทับตรารับที่ประตู ม้านั่งของเขายังอุ่น {name}นั่งลง บวกสมุดเล่มนั้นใหม่ตั้งแต่หน้าแรกจนตะวันตกดิน เจอที่ผิดอีกสิบเอ็ดแห่ง แห่งหนึ่งผิดมาตั้งแต่ลายมือของคนก่อนเสมียนหนุ่ม

        วาร์เดลวางขนมข้าวเหนียวครึ่งชิ้นที่เหลือไว้ที่มุมโต๊ะของ{name} เป็นธรรมเนียมรับคนของเขาเอง กระดาษที่{name}ถือมาตั้งแต่เช้ายังไม่ได้ตรา เสมียนหนุ่มเอามาประทับให้ตอนจะปิดศาลา
      effects:
        mark: เข้าเป็นเสมียนศาลาอำเภอ
        org: { id: crown_office, join: true, merit: 2 }
        flags: [joined_the_hall_from_the_queue]
    - id: name_the_pay
      label: ขอเบี้ยมากกว่าที่ประกาศเขียนไว้หนึ่งเหรียญ
      requires: { not_traits: [curse_brand] }
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          วาร์เดลหัวเราะ เสียงหัวเราะดังลงไปถึงปลายแถว เขาบอกว่าอำเภอนี้ไม่เคยมีเสมียนต่อเบี้ย มีแต่เสมียนที่บ่นว่าเบี้ยน้อย แล้วเขียนตัวเลขใหม่ลงในใบรับคน เขียนทับเลขเดิมจนหมึกซึมทะลุกระดาษ

          ต้นเดือนถัดมา เทสมินนับเหรียญใส่มือ{name}ช้ากว่าใส่มือคนอื่น นับเหรียญสุดท้ายสองรอบ
        effects:
          mark: เข้าเป็นเสมียนศาลาอำเภอ
          org: { id: crown_office, join: true, merit: 2 }
          stats: { CHA: 1 }
          gold: 2
          flags: [bargained_the_clerks_pay]
      failure:
        text: |
          วาร์เดลเลิกคิ้ว แล้วบอกว่าคนที่ต่อเบี้ยตั้งแต่ยังไม่ได้นั่ง ต้องเริ่มจากโต๊ะคัดสำเนาแถวหลังเหมือนเด็กที่มาจากไหนก็ไม่รู้ เขาไม่ได้โกรธ เขาพูดเหมือนอ่านกฎ

          {name}ได้ม้านั่งแถวหลัง ข้างหน้าต่างที่แดดบ่ายส่องเข้าตา ทั้งเดือนคัดใบรับภาษีเตาแบบเดียวกัน ส่วนสมุดที่บวกผิดเล่มนั้น เสมียนหนุ่มนั่งบวกใหม่เองด้วยนิ้วมือ
        effects:
          mark: เข้าเป็นเสมียนศาลาอำเภอ
          org: { id: crown_office, join: true }
          flags: [bargained_the_clerks_pay]
    - id: hand_back_the_book
      label: วางสมุดคืน รอตราแล้วกลับไปทำงานเดิม
      pass: true
      text: |
        วาร์เดลไม่ตื๊อ เขาประทับตราให้กระดาษของ{name}เอง ข้ามหัวคนในแถวไปสามคน แล้วกลับไปนั่งกินขนมต่อ เสมียนหนุ่มนับนิ้วแก้ยอดซอยนั้นจนตรงกับที่{name}บอก

        อีกหลายปีต่อมา ทุกครั้งที่{name}มีธุระที่ศาลา เสมียนหนุ่มคนนั้นเรียกออกจากแถวให้มาก่อนเสมอ เขายังบวกเลขด้วยนิ้วมือ แต่บวกเร็วขึ้นมาก
      effects: { reputation: { crown: 1 }, flags: [declined_vardels_stool] }

- id: adult.office_customs_house_table
  stage: adult
  scene: market
  weight: 12
  when:
    age: [20, 40]
    location_tag: ventras
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    max_hunted: { crown: 0 }
    not_flags: [job_wardens, job_fort_priest, left_the_crown_office]
  text: |
    คลังตั้งโต๊ะรับเสมียนไว้ใต้ชายคาโรงศุลกากรที่ท่าเรือเหาะ ตรงที่คนลงจากเรือรอบเช้าต้องเดินผ่านทุกคน โต๊ะเดียว เก้าอี้สองตัว ป้ายไม้เขียนด้วยชอล์กว่าศาลาอำเภอนอกเมืองขาดคนเขียนหนังสือ เบี้ยเป็นเหรียญกับข้าวสารทุกต้นเดือน มีที่นอนในศาลา เกวียนของคลังออกพรุ่งนี้ก่อนสาง

    คนของคลังที่นั่งโต๊ะเป็นชายหนุ่ม นิ้วเปื้อนหมึกขึ้นมาถึงข้อที่สอง เขาไม่ถามว่าใครเรียนมาจากไหน เขาเลื่อนถาดไม้มาให้ ในถาดมีถั่วแห้งกองหนึ่งกับกระดาษหนึ่งแผ่น ให้นับถั่ว เขียนจำนวนเป็นตัวหนังสือ แล้วบวกกับเลขที่เขาจะบอกทีหลัง คนที่ยืนดูมีมากกว่าคนที่นั่งลงสอบหลายเท่า

    หญิงขายปลาแผงติดกันพูดขึ้นโดยไม่เงยหน้าจากเขียง ปีก่อนคนขึ้นเกวียนคลังไปสามคน กลับมาเยี่ยมบ้านคนเดียว อีกสองคนส่งข้าวสารมาแทนตัว
  choices:
    - id: count_the_beans
      label: นั่งลงนับถั่ว
      requires: { not_traits: [curse_brand] }
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ถั่วมีสองร้อยสิบเจ็ดเมล็ด {name}นับสองรอบได้เท่ากัน เขียนเป็นตัวหนังสือ แล้วบวกกับเลขที่เขาบอกโดยไม่ขยับนิ้ว ชายนิ้วเปื้อนหมึกไม่ตรวจคำตอบ เขานับถั่วถาดนี้เองมาตั้งแต่เช้าจนจำได้ เขาเขียนชื่อ{name}ลงบรรทัดที่สี่ของกระดาษอีกแผ่น

          เกวียนของคลังไปสองวัน ศาลาปลายทางมีระเบียงคำร้องยาวตลอดหน้าตึก เสมียนใหญ่เป็นหญิงผมสีดอกเลาชื่อเทสมิน เสียบปากกาขนนกไว้ในมวยผมสองด้าม นางชี้ม้านั่งปลายโต๊ะให้ บอกว่านายอำเภอชื่อวาร์เดล วันไหนหาตัวไม่เจอให้ไปดูที่ร้านขนมข้าวเหนียว
        effects:
          mark: เข้าเป็นเสมียนศาลาอำเภอ
          org: { id: crown_office, join: true }
          location_tag: arvel_village
          stats: { INT: 1 }
          flags: [rode_the_treasury_cart_out]
      failure:
        text: |
          รอบแรกนับได้สองร้อยสิบห้า รอบที่สองได้สองร้อยสิบเก้า รอบที่สามมีถั่วเมล็ดหนึ่งกลิ้งตกร่องกระดานพื้น ชายนิ้วเปื้อนหมึกเทถั่วกลับลงถุง บอกว่าปีหน้าโต๊ะนี้มาตั้งที่เดิม

          หญิงขายปลาห่อปลาทูให้สองตัวทั้งที่{name}ยังไม่ได้สั่ง นางคิดราคาคนคุ้น
        effects: { gold: -1, flags: [failed_the_bean_count] }
    - id: sign_for_the_unchosen_district
      label: ถามว่าอำเภอไหนยังไม่มีใครเลือก แล้วลงชื่อไปที่นั่น
      requires: { not_traits: [curse_brand] }
      text: |
        เขาพลิกกระดาษให้ดู ทุกอำเภอมีชื่อคนลงไว้แล้วอย่างน้อยหนึ่งชื่อ เว้นบรรทัดล่างสุด อำเภอนั้นเกวียนไปถึงในสองวัน เสมียนคนก่อนเดินเท้ากลับเวนทราสเองตั้งแต่เดือนที่สาม เขาเก็บถาดถั่วลงใต้โต๊ะ อำเภอที่ไม่มีใครเลือกรับทุกคนที่เขียนชื่อตัวเองได้

        ศาลาปลายทางมีระเบียงคำร้องยาวตลอดหน้าตึก นายอำเภอร่างท้วมชื่อวาร์เดลออกมารับถึงเกวียน มือหนึ่งถือขนมข้าวเหนียว เขาถามคำถามเดียวว่าจะอยู่ถึงเดือนที่สี่ไหม เสมียนใหญ่ชื่อเทสมินยื่นขวดหมึกให้โดยไม่รอฟังคำตอบ
      effects:
        mark: เข้าเป็นเสมียนศาลาอำเภอ
        org: { id: crown_office, join: true }
        location_tag: arvel_village
        flags: [rode_the_treasury_cart_out, signed_for_the_unchosen_district]
    - id: count_with_the_hat_on
      label: นั่งลงนับถั่ว ไม่ถอดหมวก
      requires: { flag: horns_sawn }
      text: |
        ใต้ชายคาโรงศุลกากรไม่มีใครถอดหมวก ลมจากลานเรือเหาะพัดแรงเกินไป ชายนิ้วเปื้อนหมึกดูแต่ถั่วกับมือที่นับ {name}นับได้สองร้อยสิบเจ็ด เขาเขียนชื่อลงบรรทัดที่สี่

        ที่ศาลาปลายทาง กฎเขียนไว้ที่วงกบประตู ใต้ชายคาให้ถอดหมวก เสมียนใหญ่ชื่อเทสมินมองหมวกของ{name}อยู่ครู่หนึ่ง แล้วยกม้านั่งตัวปลายโต๊ะออกไปตั้งที่ปลายระเบียง ตรงที่ชายคายื่นไม่ถึง นางไม่ถามอะไร และไม่ให้ใครในศาลาถาม
      effects:
        mark: เข้าเป็นเสมียนศาลาอำเภอ
        org: { id: crown_office, join: true }
        location_tag: arvel_village
        flags: [rode_the_treasury_cart_out, serves_the_crown_with_hidden_horns]
    - id: buy_fish_and_walk_on
      label: ซื้อปลาแผงข้างๆ แล้วเดินต่อ
      pass: true
      text: |
        หญิงขายปลาชั่งให้เกินไปครึ่งขีด นางบอกว่าคนที่ไม่ขึ้นเกวียนคลังคือคนที่ยังจะกลับมาซื้อปลา

        เช้าวันรุ่งขึ้นโต๊ะใต้ชายคาหายไปแล้ว เหลือรอยชอล์กจากป้ายไม้ติดอยู่บนเสาเป็นฝุ่นขาว
      effects: { gold: -1, flags: [walked_past_the_treasury_table] }

# ---------- งานขั้นต้น (เสมียน ปลัดอำเภอ) ----------
- id: adult.office_duty_hearth_count
  stage: adult
  weight: 20
  time: night
  duty: crown_office
  when:
    age: [20, 64]
    org: { id: crown_office, max_rank: 2 }
  text: |
    ปีนับเตา ศาลาออกนับก่อนไก่ขัน เพราะควันที่ขึ้นปล่องตอนเช้ามืดคือควันหุงข้าว ควันหุงข้าวโกหกยากกว่าคน เทสมินเดินนำไปก่อนสองหลังคาเรือน ถือตะเกียงต่ำแค่เข่า ปากขยับนับเบาๆ สมุดเตาเล่มใหม่หนีบอยู่ใต้รักแร้ของ{name} กระดาษยังมีกลิ่นกาว

    บ้านหลังที่เก้าของซอยปล่องเย็น ไม่มีควัน ไม่มีแสงลอดฝา เทสมินเดินผ่านไปโดยไม่ชะลอ {name}เอื้อมมือแตะอิฐปากปล่องตามที่คนในศาลาสอนกันมา อิฐยังอุ่นเท่าหลังคนหลับ ใต้ชายคามีชามข้าวคว่ำซ้อนกันสี่ใบ ข้าวที่ติดขอบชามยังไม่แห้ง

    ในบ้าน เด็กคนหนึ่งถามว่าเมื่อไรจะได้จุดไฟ แล้วเสียงก็ขาดไปกลางคำ เหมือนมีมือมาปิดปาก
  choices:
    - id: write_it_warm
      label: จดบ้านหลังนี้ลงสมุดเป็นหนึ่งเตา
      text: |
        {name}ขีดเส้นลงช่องที่เก้า เสียงปลายปากกาครูดกระดาษดังกว่าที่คิด ประตูบ้านแง้มออกนิดหนึ่ง ตาคู่หนึ่งดูปากกาในมือ{name} แล้วประตูก็ปิดเบาๆ เท่ากับตอนเปิด

        ปลายฤดู หญิงเจ้าของบ้านหลังที่เก้าหอบข้าวเปลือกครึ่งกระสอบมาส่งที่ยุ้งหลวง ปากกระสอบมัดด้วยผ้าคาดผมเส้นที่นางคาดอยู่เมื่อเช้าวันนับ ผมของนางปล่อยลงมาถึงกลางหลัง
      effects: { alignment: { law: 1 }, flags: [counted_the_warm_chimney] }
    - id: walk_on_like_tesmin
      label: ปล่อยมือจากปล่อง เดินตามเทสมินไป
      text: |
        สุดซอย เทสมินหยุดใต้ต้นมะขาม เปิดสมุดของ{name}ดู ไล่นิ้วนับยอดทั้งซอย แล้วปิดสมุดคืนให้ ยอดของสองคนตรงกัน ทั้งสองยอดไม่มีบ้านหลังที่เก้า นางบอกว่าหลังนั้นไม่เคยอยู่ในเล่มไหนตั้งแต่นางเริ่มนับ แล้วเดินต่อไปซอยถัดไป

        ตกเที่ยง วาร์เดลบวกยอดทั้งตำบล ขาดจากปีนับเตาครั้งก่อนสองเตา เขาหักเบี้ยเดือนนั้นของคนนับซอยนั้นคนละเหรียญ เรียกว่าค่าตาฝ้าฟาง เทสมินจ่ายโดยไม่เถียงสักคำ
      effects: { gold: -1, alignment: { moral: 1 }, flags: [left_the_warm_chimney_out] }
    - id: palm_every_chimney
      label: ย้อนไปต้นซอย แตะปากปล่องทุกหลังให้ทันก่อนตะวันขึ้น
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}วิ่งย้อนไปถึงหลังแรก แตะอิฐทีละปล่องจนสุดซอยแล้วไปซอยถัดไป ฟ้าเริ่มเป็นสีเทาตอนแตะปล่องสุดท้าย ซอยนี้มีปล่องที่เพิ่งเย็นห้าปล่อง ไม่ใช่ปล่องเดียว {name}จดครบทั้งห้า มือดำด้วยเขม่าจนถึงข้อมือ

          ตอนสาย วาร์เดลรับสมุดไป คัดยอดลงสมุดอีกสองเล่มบนโต๊ะของเขา เล่มหนึ่งปกแดงมีตราศาลา อีกเล่มไม่มีปก มีเม็ดข้าวสารติดอยู่ตามสันเล่ม ยอดที่เขาเขียนลงสองเล่มนั้นไม่เท่ากัน เขาเห็นว่า{name}ดูอยู่ จึงเลื่อนเล่มไม่มีปกไปไว้ใต้เล่มปกแดง
        effects: { stats: { WIS: 1 }, org: { id: crown_office, merit: 1 }, flags: [counted_by_the_bricks] }
      failure:
        text: |
          ปล่องหลังที่สามร้อนจัด บ้านนั้นต้มรำหมูอยู่ข้างใน ไม่ใช่หุงข้าว {name}ชักมือกลับไม่ทัน ฝ่ามือพองเป็นแนวตามร่องอิฐ ต้องหนีบสมุดไว้ใต้รักแร้ข้างเดียวไปจนสุดซอย

          ยอดที่ได้ไม่ครบ เพราะตะวันขึ้นก่อนแตะถึงซอยสุดท้าย ควันหุงข้าวขึ้นพร้อมกันทั้งตำบล ปล่องเย็นกับปล่องที่เพิ่งเย็นดูเหมือนกันหมด
        effects: { hp: -1, flags: [counted_by_the_bricks] }
    - id: send_the_young_clerk
      label: ยื่นสมุดให้เสมียนหนุ่มนับแทน แล้วกลับไปนอนต่อที่ศาลา
      refuse: true
      text: |
        เสมียนหนุ่มนับทุกบ้านที่มีประตูเป็นหนึ่งเตา รวมถึงคอกแพะที่มีประตูไม้ไผ่ เจ้าของคอกแพะมายืนเถียงที่ระเบียงคำร้องตั้งแต่สายจนบ่าย ว่าแพะของเขาไม่เคยหุงข้าว

        เทสมินต้องเดินนับซอยนั้นใหม่ในเช้าวันรุ่งขึ้นคนเดียว ตอนกลับมาที่ศาลา นางวางสมุดเล่มนั้นลงบนโต๊ะของ{name}แรงกว่าที่ต้องวาง
      effects: { flags: [skipped_the_hearth_count] }

- id: adult.office_duty_tax_chest
  stage: adult
  scene: road
  weight: 20
  time: night
  duty: crown_office
  when:
    age: [20, 64]
    org: { id: crown_office, max_rank: 2 }
  text: |
    หีบภาษีออกจากศาลาปีละครั้ง เหล็กหนาเท่านิ้วโป้ง แม่กุญแจสามตัวห้อยเรียงที่หูหีบ ลูกกุญแจดอกหนึ่งอยู่กับวาร์เดลที่ศาลา ดอกหนึ่งห้อยคอคนที่นั่งเกวียนไปกับหีบ ดอกที่สามรออยู่ที่ทางสามแพร่งปลายทาง กับฮอลริค คนขี่ม้าของคลัง ปีนี้ดอกที่สองห้อยคอ{name} มีทหารเดินคุมสองคน คนหนึ่งเท้าพองตั้งแต่วันแรก

    คืนที่สองค้างที่ลานโรงเตี๊ยม {name}นอนบนเกวียน หนุนย่ามที่ใส่สมุดเตาเล่มที่ต้องส่งไปพร้อมหีบ กลางดึกย่ามมีกลิ่นแปลก ไม่ใช่กลิ่นหมึก เป็นกลิ่นข้าวสารเก่า {name}จุดตะเกียงเปิดดู สมุดในย่ามปกขาด มีเม็ดข้าวติดอยู่ตามรอยพับ ยอดเตาหน้าสุดท้ายมากกว่ายอดที่ศาลาท่องกันมาทั้งปีเกือบสองร้อยเตา

    วาร์เดลหยิบผิดเล่ม ฮอลริคจะถึงทางสามแพร่งตอนสายพรุ่งนี้ อ่านยอดในสมุดเทียบกับเหรียญในหีบ แล้วขี่ม้าออกไปก่อนตะวันตกเหมือนทุกปี
  choices:
    - id: ride_back_for_the_red_book
      label: ยืมม้าทหาร ขี่ย้อนกลับไปเปลี่ยนเล่มคืนนี้
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ถึงศาลาตอนตีสาม วาร์เดลออกมาเปิดประตูทั้งชุดนอน ไม่ถามสักคำว่ามาทำไม เขารับเล่มกลิ่นข้าวสารไป เปิดฝาถังข้าวที่มุมห้องหย่อนกลับลงไป แล้วหยิบเล่มปกแดงบนชั้นมาให้ ก่อนออกประตู เขายัดก้อนข้าวเหนียวห่อใบตองใส่มือ{name}มาด้วย

          {name}กลับถึงทางสามแพร่งก่อนฮอลริคครึ่งชั่วยาม ม้าทหารยืนหอบจนน้ำลายฟูมปาก ฮอลริคอ่านยอดเล่มปกแดง นับเหรียญ ไขกุญแจดอกที่สาม แล้วขี่ออกไปก่อนตะวันตกเหมือนทุกปี เขาไม่ได้มองม้าตัวนั้นเลย
        effects: { stats: { CON: 1 }, org: { id: crown_office, merit: 1 }, flags: [swapped_the_hearth_books_by_night] }
      failure:
        text: |
          ม้าทหารสะดุดรากไม้ในความมืด {name}ตกลงไปในร่องข้างทาง ไหล่กระแทกหิน กว่าจะได้เล่มปกแดงจากศาลาแล้วกลับมาถึงทางสามแพร่งก็เลยเที่ยง ฮอลริคยืนรออยู่ข้างม้าของเขา ไม่ได้นั่ง

          เขารับเล่มปกแดงไป อ่านยอด นับเหรียญ ไขกุญแจ แล้วเขียนบรรทัดหนึ่งลงสมุดเล่มเล็กของตัวเอง สองคำ ส่งช้า ปีนั้นอำเภอโดนปรับห้าเหรียญ ศาลาหักจากเบี้ยของ{name}ครึ่งหนึ่ง
        effects: { hp: -2, gold: -2, flags: [swapped_the_hearth_books_late] }
    - id: copy_a_lower_book
      label: นั่งคัดสมุดเล่มใหม่ใต้ตะเกียงจนสาง ใช้ยอดที่ศาลาท่องกัน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}คัดทีละซอย ลดตามยอดที่จำได้จากปากวาร์เดล ใช้กระดาษเปล่าที่พกไว้เขียนใบรับ เย็บสันด้วยด้ายที่ดึงจากชายย่าม ไก่ขันตอนคัดถึงซอยสุดท้าย ทหารเท้าพองตื่นมาเห็น แล้วหันหลังนอนต่อ

          ฮอลริคถือสมุดขึ้นดม บอกว่าหมึกปีนี้แห้งช้า แล้วอ่านยอด นับเหรียญ ไขกุญแจดอกที่สาม เล่มกลิ่นข้าวสาร{name}เก็บไว้ก้นย่ามจนกลับถึงศาลา วาร์เดลรับคืนไปโดยไม่ถามว่าเล่มที่ส่งไปนั้นหน้าตาเป็นอย่างไร
        effects: { stats: { INT: 1 }, org: { id: crown_office, merit: 1 }, flags: [copied_a_hearth_book_by_lamplight] }
      failure:
        text: |
          ตะเกียงหมดน้ำมันตอนคัดถึงซอยที่สิบ ที่เหลือ{name}คัดด้วยแสงไฟจากครัวโรงเตี๊ยม ตัวเลขของสามซอยสุดท้ายเพี้ยนไปจากที่ศาลาท่อง ฮอลริคนับเหรียญสองรอบ ยอดไม่ตรงกับสมุด

          เขาไม่ไขกุญแจดอกที่สาม เขาเขียนบันทึกแนบหีบ แล้วปล่อยให้หีบเดินทางต่อโดยล็อกไว้สองชั้นอย่างนั้น ปีนั้นวาร์เดลต้องเขียนจดหมายชี้แจงคลังสามฉบับ และเบี้ยของ{name}หายไปสองเดือนเป็นค่ากระดาษ
        effects: { gold: -3, flags: [copied_a_hearth_book_by_lamplight] }
    - id: hand_holric_the_rice_book
      label: ส่งเล่มที่มีกลิ่นข้าวสารให้ฮอลริคไปตามที่หยิบมา
      text: |
        ฮอลริคอ่านยอดหน้าสุดท้าย เลิกคิ้วขึ้นข้างเดียว นับเหรียญในหีบ แล้วเขียนตัวเลขส่วนต่างลงสมุดเล่มเล็กของเขา เขาเก็บเล่มกลิ่นข้าวสารเข้ากระเป๋าข้างอาน ไขกุญแจดอกที่สามตามปกติ แล้วขี่ออกไปก่อนตะวันตก

        ฤดูถัดมา จดหมายจากคลังมาถึงวาร์เดล ให้ส่งส่วนต่างตามยอดเตาจริง วาร์เดลเปิดยุ้งหลวง ขายข้าวที่เก็บไว้ผ่านปีข้าวยากออกไปเกือบครึ่งยุ้ง เกวียนข้าวออกจากหลังศาลาสามวันติด ทุกคันผ่านหน้าโต๊ะของ{name}
      effects: { alignment: { law: 1 }, reputation: { crown: 1 }, flags: [sent_the_true_hearth_book] }
    - id: turn_the_cart_home
      label: หันเกวียนกลับศาลา ให้วาร์เดลหาคนอื่นพาหีบไปกับเล่มที่ใช่
      refuse: true
      text: |
        เกวียนกลับถึงศาลาในสองวัน วาร์เดลเปลี่ยนเล่มให้ แล้วส่งหีบออกไปอีกรอบกับเสมียนอีกคน ทหารเท้าพองต้องเดินทางเดิมซ้ำเป็นรอบที่สอง ไปกลับรวมแปดวัน

        หีบถึงทางสามแพร่งช้าไปเจ็ดวัน ฮอลริคไม่รอ คลังส่งคนขี่ม้าคนใหม่มารับแทน และคิดค่าเที่ยวเพิ่มจากอำเภอ
      effects: { flags: [turned_the_tax_chest_back] }

- id: adult.office_duty_petition_bench
  stage: adult
  scene: market
  weight: 20
  once: false
  duty: crown_office
  when:
    age: [20, 64]
    org: { id: crown_office, max_rank: 2 }
  text: |
    วันตลาด ม้านั่งคำร้องตั้งที่ปลายระเบียง ห่างประตูศาลาสิบก้าว ห่างร้านน้ำอ้อยห้าก้าว คนที่เขียนหนังสือไม่เป็นมาต่อแถวตั้งแต่ร้านน้ำอ้อยยังไม่ยกหม้อขึ้นเตา ค่าเขียนคำร้องคือเหรียญทองแดงหนึ่งอัน ไข่หนึ่งฟอง หรือคำขอบใจ แล้วแต่ใครมีอะไร

    คำร้องทุกฉบับขึ้นต้นเหมือนกัน ข้าพเจ้าผู้มีนามข้างท้าย ขอเรียนศาลาให้ทราบ แล้วจากนั้นไม่มีฉบับไหนเหมือนกันอีกเลย แพะกินหลังคาแฝก ลูกเขยยืมเกวียนไม่คืน กิ่งมะขามยื่นไปให้ร่มนาคนอื่น เสียงคนพูดในบ่อน้ำตอนกลางคืน คำว่าขอเรียนศาลาให้ทราบติดมือ{name}จนบางเช้าเขียนลงไปก่อนได้ยินด้วยซ้ำว่าคนตรงหน้ามาเรื่องอะไร

    เช้านี้คนแรกในแถวเป็นชายแก่ที่พูดช้าจนน้ำอ้อยเคี่ยวเสร็จไปหนึ่งหม้อ เขามาขอให้ศาลาสั่งลูกชายกลับมาเยี่ยมบ้าน
  choices:
    - id: write_what_he_says
      label: เขียนตามที่เขาพูดทุกคำ แล้วหย่อนลงตะกร้าคำร้อง
      text: |
        คำร้องยาวหนึ่งหน้ากับอีกสองบรรทัด ชื่อลูกชาย ทางที่ลูกชายเดินออกไป สีเสื้อตัวที่ใส่วันนั้น ชายแก่ลงชื่อด้วยการกดนิ้วโป้งชุบหมึก กดแรงจนรอยนิ้วซึมไปถึงกระดาษแผ่นล่าง แล้ววางเหรียญทองแดงไว้บนโต๊ะ

        ตะกร้าคำร้องไปถึงห้องนายอำเภอทุกเย็น คำร้องที่ศาลาทำให้ไม่ได้ไปลงตะกร้าใบเล็กใต้โต๊ะ ใบเล็กหนักกว่าใบใหญ่มาหลายปีแล้ว
      effects: { gold: 1, alignment: { law: 1 }, flags: [wrote_the_old_mans_petition] }
    - id: write_a_letter_instead
      label: เขียนเป็นจดหมายถึงลูกชายแทน แล้วฝากไปกับคนเดินข่าว
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}อ่านจดหมายให้ฟังทีละบรรทัด ชายแก่ให้แก้สองที่ ที่หนึ่งตัดคำว่าคิดถึงออก อีกที่เติมว่าหลังคาโรงวัวรั่ว แล้วกดนิ้วโป้งลงท้ายจดหมายเหมือนลงชื่อในคำร้อง

          คนเดินข่าวรับจดหมายไปพร้อมข่าวสารอื่นหนึ่งมัด คิดค่าฝากครึ่งเหรียญ ชายแก่จ่ายเอง แล้วไม่ยอมให้{name}คืนเหรียญทองแดงค่าเขียน
        effects: { gold: 1, alignment: { moral: 1 }, flags: [wrote_a_letter_instead_of_a_petition] }
      failure:
        text: |
          ชายแก่ฟังจดหมายจบแล้วส่ายหัว เขาไม่ได้มาขอให้ใครเขียนจดหมาย จดหมายเขาจ้างเด็กที่ไหนเขียนก็ได้ เขามาขอให้ศาลาสั่ง คนข้างหลังในแถวเริ่มบ่น เพราะหม้อน้ำอ้อยหม้อที่สองเคี่ยวเสร็จแล้ว

          {name}ฉีกจดหมาย เขียนเป็นคำร้องใหม่ทั้งหมด กระดาษสองแผ่นหักจากเบี้ยตัวเอง
        effects: { gold: -1, flags: [wrote_a_letter_instead_of_a_petition] }
    - id: shut_the_inkwell
      label: ปิดขวดหมึก บอกแถวว่าวันนี้ม้านั่งคำร้องไม่เปิด
      refuse: true
      text: |
        แถวแตกเป็นสองสาย สายหนึ่งกลับบ้าน อีกสายเดินข้ามลานไปหาคนรับเขียนหนังสือหน้าโรงเตี๊ยม ที่นั่นคิดสามเหรียญทองแดง เขียนเร็ว และสะกดชื่อคนผิดเป็นประจำ

        ชายแก่นั่งรออยู่บนม้านั่งจนร้านน้ำอ้อยปิด แล้วเดินกลับไปทางที่มา
      effects: { flags: [closed_the_petition_bench] }

- id: adult.office_duty_well_line
  stage: adult
  weight: 20
  once: false
  duty: crown_office
  when:
    age: [20, 64]
    org: { id: crown_office, max_rank: 2 }
  text: |
    เรื่องรั้วกับบ่อน้ำไม่ต้องขึ้นไปถึงนายอำเภอ ศาลาส่งคนถือเชือกวัดไปแทน เชือกเส้นนั้นยาวยี่สิบวา ผูกปมทุกวา ปมที่สิบย้อมแดง ใช้กันมาจนปมแรกสึกเหลือแค่รอยนูน {name}พันมันไว้บนไหล่ เดินตามเด็กที่วิ่งมาตามไปถึงที่เกิดเรื่อง

    วันนี้เป็นบ่อน้ำที่สองบ้านใช้ร่วมกันมาตั้งแต่รุ่นปู่ บ้านหนึ่งปักรั้วไม้ไผ่ใหม่ ผ่ากลางปากบ่อพอดี อีกบ้านถอนทิ้งตอนกลางคืน บ้านแรกปักใหม่ตอนเช้า ไม้ไผ่กองอยู่ข้างบ่อสองกอง คนสองบ้านยืนอยู่คนละฝั่ง ถังตักน้ำใบเดียวที่ใช้ร่วมกันคว่ำอยู่ตรงกลาง ไม่มีใครยอมเอื้อมไปหยิบ

    หมุดหินเขตที่ศาลาฝังไว้แต่เก่าก่อนอยู่ใต้กองไม้ไผ่กองไหนสักกอง
  choices:
    - id: dig_for_the_stone
      label: รื้อกองไม้ไผ่หาหมุดหิน แล้ววัดจากหมุดตามสมุดเขต
      check: { stat: INT, dc: 13 }
      success:
        text: |
          หมุดหินอยู่ใต้กองที่สอง หัวหมุดสลักลูกศรชี้ทิศ {name}ขึงเชือกจากหมุดตามมุมที่สมุดเขตบอก ปมที่สิบสามตกกลางปากบ่อพอดี ศาลาตัดสินเรื่องนี้ไปแล้วตั้งแต่รุ่นปู่ บ่อเป็นของสองบ้าน รั้วต้องหยุดห่างขอบบ่อข้างละหนึ่งก้าว

          สองบ้านจ่ายค่าวัดคนละเหรียญ จ่ายช้าพอกัน คนที่หยิบถังขึ้นตักน้ำเป็นคนแรกคือเด็กที่วิ่งไปตาม{name}มา
        effects: { gold: 2, org: { id: crown_office, merit: 1 }, flags: [measured_the_well_line] }
      failure:
        text: |
          รื้อกองแรกไม่เจอ รื้อกองที่สองก็ไม่เจอ หนามไม้ไผ่ตำเข้าโคนนิ้วหัวแม่มือ ดึงออกไม่หมด หมุดหินหายไปตั้งแต่เมื่อไรไม่มีใครรู้ สองบ้านต่างบอกว่าอีกบ้านขโมยไป

          {name}จดเรื่องลงสมุดเขตว่าหาหมุดไม่พบ นัดวัดใหม่เดือนหน้า ขากลับ ได้ยินเสียงค้อนตอกไม้ไผ่ตามหลังมาทั้งทาง
        effects: { hp: -1, flags: [lost_the_boundary_stone] }
    - id: split_the_well_by_the_hour
      label: หยิบถังขึ้นตักน้ำดื่มเอง แล้วแบ่งเวลาตักให้สองบ้าน
      text: |
        {name}ตักน้ำขึ้นมาถังหนึ่ง ดื่มจากขอบถัง แล้วบอกว่าบ่อนี้ตักได้ทั้งวัน เช้าเป็นของบ้านตะวันออก เย็นเป็นของบ้านตะวันตก รั้วปักได้ถึงขอบบ่อแล้วหยุด ทั้งสองบ้านบ่น บ่นเรื่องเดียวกัน แต่ไม่มีใครเถียง

        เดือนต่อมา คนบ้านตะวันตกต้องหาบน้ำจากคลองมาหุงข้าวเช้าทุกวัน ไหล่ของลูกสาวบ้านนั้นด้านเป็นรอยไม้คาน
      effects: { alignment: { law: 1 }, flags: [split_the_well_by_the_hour] }
    - id: leave_it_for_next_month
      label: จดเรื่องลงสมุด บอกว่าศาลาจะตัดสินรอบหน้า
      refuse: true
      text: |
        {name}เดินกลับศาลาโดยไม่ได้คลายเชือกวัดจากไหล่ เดือนต่อมามีคนมาตามอีกครั้ง คราวนี้รอบบ่อมีรั้วสามแนว บ้านที่สามที่ไม่เคยใช้บ่อนี้ปักแนวที่สามไว้เผื่อ

        ถังตักน้ำใบนั้นหายไปแล้ว คนสามบ้านต่างคนต่างมีถังของตัวเอง
      effects: { flags: [left_the_well_quarrel_open] }

# ---------- งานขั้นสูง (นายอำเภอ ขุนคลัง) ----------
- id: adult.office_duty_lean_granary
  stage: adult
  scene: council_hall
  weight: 20
  duty: crown_office
  when:
    age: [25, 64]
    org: { id: crown_office, min_rank: 3, max_rank: 3 }
  text: |
    ปีข้าวยาก ฝนมาช้าไปครึ่งเดือนแล้วมาหนักจนนาริมแม่น้ำจมทั้งแถบ ตั้งแต่ต้นเดือนมีคนมานั่งรอหน้ายุ้งหลวงทุกเช้า ไม่มีใครเคาะประตู ไม่มีใครถือกระดาษ นั่งกันเป็นแถวบนคันดินหลังศาลา ตะกร้าเปล่าวางบนตัก ทุกเช้าแถวยาวขึ้นหนึ่งช่วงตัวคน

    ตรายุ้งหลวงอยู่ในลิ้นชักโต๊ะของ{name} ตราลงที่ไหนประตูยุ้งเปิดที่นั่น ในลิ้นชักเดียวกันมีจดหมายจากคลังที่เวนทราสหนึ่งฉบับ เขียนสั้นแบบจดหมายคลังทุกฉบับ หีบภาษีปีนี้ต้องเต็ม ปีก่อนขาด อำเภอที่หีบขาดสองปีติดจะมีคนมานับยุ้งเอง

    ข้าวในยุ้งพอให้คนบนคันดินกินถึงหน้าเกี่ยว หรือพอขายเติมหีบให้เต็ม ไม่พอทั้งสองอย่าง เทสมินวางลูกคิดไว้บนโต๊ะตั้งแต่เช้า ยังไม่มีใครแตะ
  choices:
    - id: open_the_granary
      label: ประทับตราที่ประตูยุ้ง เปิดให้คนบนคันดิน
      text: |
        ประตูยุ้งเปิดตอนสาย แถวบนคันดินลุกขึ้นพร้อมกันโดยไม่มีใครสั่ง เทสมินยืนตักข้าวด้วยกระบุงตวงของศาลา บ้านละหนึ่งตวง ตวงปาดด้วยไม้บรรทัดทุกครั้ง ไม่พูนให้ใคร แถวเดินได้ช้าแต่ไม่หยุดจนตะวันตกดิน

        หีบภาษีปีนั้นออกจากอำเภอไปขาดเกือบครึ่งหีบ ต้นปีถัดมา เสมียนจากคลังสองคนมาถึงศาลาพร้อมตาชั่งของตัวเอง นับยุ้งหลวงอยู่สามวัน แล้วจดยอดลงสมุดของคลังเป็นเลขตัวเดียว
      effects: { world: { peace: 1, treasury: -1 }, flags: [opened_the_royal_granary] }
    - id: sell_it_for_the_chest
      label: ขายข้าวในยุ้งเติมหีบภาษีให้เต็ม
      text: |
        เกวียนข้าวออกจากหลังศาลาตอนกลางคืน เลี่ยงคันดิน เช้าวันรุ่งขึ้นคนในแถวเห็นรอยล้อใหม่ลึกเป็นร่องผ่านหน้ายุ้ง ก่อนเที่ยงมีหินก้อนหนึ่งกระเด็นมากระทบบานเกล็ดหน้าต่างห้องนายอำเภอ บานเกล็ดหักไปสามซี่

        หีบออกจากอำเภอเต็มเป็นปีแรกในรอบหลายปี คราวนี้มีทหารคุมไปหกคน ไม่ใช่สองคน แถวบนคันดินบางลงทุกเช้าหลังจากนั้น ไม่มีใครในศาลาถามว่าคนที่หายไปไปไหน
      effects: { world: { treasury: 1, peace: -1 }, org: { id: crown_office, merit: 1 }, flags: [filled_the_chest_from_the_granary] }
    - id: feed_by_tesmins_names
      label: ให้เทสมินขานชื่อบ้านที่ดับไฟหนีการนับ แจกเฉพาะบ้านพวกนั้น แล้วเติมหีบด้วยเบี้ยของตัวเอง
      requires: { min_gold: 4 }
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          เทสมินยืนบนบันไดยุ้ง ขานชื่อบ้านทีละหลังโดยไม่เปิดสมุดสักเล่ม ชื่อที่นางขานไม่อยู่ในเล่มไหนเลย {name}ยืนข้างนาง ตักข้าวใส่ตะกร้าเอง คนที่ไม่ได้ยินชื่อตัวเองยืนดูอยู่ แต่ไม่มีใครเบียด บ้านที่ดับไฟหนีการนับคือบ้านที่ทุกคนบนคันดินรู้จัก

          ส่วนที่หีบขาด {name}เอาเบี้ยของตัวเองเติม นับเหรียญใส่หีบต่อหน้าเทสมิน นางดูจนเหรียญสุดท้าย แล้วลงชื่อเป็นพยานในใบรับ
        effects: { gold: -4, world: { peace: 1 }, org: { id: crown_office, merit: 1 }, flags: [fed_the_unwritten_houses] }
      failure:
        text: |
          เทสมินขานชื่อได้สิบกว่าบ้าน คนที่ไม่ได้ยินชื่อตัวเองเริ่มเบียดเข้ามา ตะกร้าใบหนึ่งกระแทกหน้าแข้ง{name}จนเลือดออก ประตูยุ้งต้องปิดก่อนเที่ยง ข้าวที่ตักออกไปแล้วหกเรี่ยราดอยู่บนบันได

          เบี้ยของ{name}ลงหีบไปแล้ว หีบก็ยังขาดอยู่ดี คืนนั้นเทสมินนั่งเก็บเม็ดข้าวจากร่องบันไดใส่ชามทีละเม็ด
        effects: { gold: -4, hp: -1, flags: [split_the_granary_by_name] }
    - id: write_to_ventras_first
      label: เขียนจดหมายขอคำสั่งจากคลังก่อน ปิดยุ้งไว้จนกว่าคำตอบจะมา
      refuse: true
      text: |
        คำตอบจากคลังมาถึงหลังเกี่ยวข้าวเสร็จ เขียนสั้นแบบจดหมายคลังทุกฉบับ ให้นายอำเภอใช้ดุลยพินิจตามสมควร

        แถวบนคันดินบางลงทุกเช้าก่อนคำตอบจะมาถึงนานแล้ว ตะกร้าเปล่าใบหนึ่งยังวางอยู่บนคันดิน ไม่มีใครมาเอากลับ
      effects: { flags: [waited_on_the_treasury_over_the_granary] }

- id: adult.office_duty_levy_paper
  stage: adult
  scene: council_hall
  weight: 20
  duty: crown_office
  when:
    age: [25, 64]
    org: { id: crown_office, min_rank: 3, max_rank: 3 }
  text: |
    ใบเกณฑ์คนมากับทหารม้าคนเดียว เขาไม่ลงจากหลังม้า ยื่นกระดาษลงมาให้ แล้วบอกว่าจะกลับมารับคนในสิบสี่วัน ใบเกณฑ์ขอชายสิบสองคนจากอำเภอนี้ แข็งแรงพอถือหอก ไม่พิการ ช่องรายชื่อสิบสองช่องเว้นว่าง ช่องลงชื่อของนายอำเภออยู่ล่างสุด

    เทสมินเอาสมุดเตาเล่มที่ไม่มีปกมาวางข้างใบเกณฑ์ เปิดค้างไว้ที่หน้าแรก ในสมุดเล่มนี้ทุกเตามีชื่อคน คนในเตามีแม่ มีเมีย และมีนาที่ต้องดำให้เสร็จก่อนสิ้นเดือน

    ไม่มีใครป่าวประกาศ แต่ตกเที่ยงคนรู้กันทั้งอำเภอ บ่ายวันนั้นไม่มีใครมาต่อแถวยื่นคำร้องที่ระเบียงเลยสักคน
  choices:
    - id: sign_twelve_names
      label: เลือกสิบสองชื่อจากสมุด แล้วลงชื่อท้ายใบเกณฑ์
      text: |
        {name}เลือกจากบ้านที่มีลูกชายมากกว่าหนึ่งคน บ้านละไม่เกินหนึ่ง เขียนชื่อลงช่องด้วยลายมือตัวเองทั้งสิบสองช่อง ไม่ให้เสมียนเขียนแทน วันที่สิบสี่ ทหารม้ากลับมาพร้อมเกวียนเปล่าหนึ่งคัน

        แม่ของชายคนที่เจ็ดเดินตามเกวียนไปจนถึงหลักเขตอำเภอ แล้วหยุดตรงนั้น ปีนั้นนาริมคลองสามแปลงไม่มีใครดำ หญ้าขึ้นสูงถึงเอว
      effects: { world: { peace: 1, treasury: -1 }, org: { id: crown_office, merit: 1 }, flags: [signed_the_full_levy] }
    - id: send_six_and_a_letter
      label: ส่งหกคน พร้อมจดหมายว่าอำเภอนี้คนดำนาไม่พอ
      text: |
        ทหารม้านับคนบนเกวียนได้หก อ่านจดหมายบนหลังม้าจนจบ แล้วพับเหน็บเข้าข้อรองเท้า เขาบอกว่าคนที่อ่านจดหมายแบบนี้ไม่ใช่เขา และคนที่อ่านก็ไม่ได้ดำนา

        ข้าวปีนั้นดำทันทุกแปลง หีบภาษีออกจากอำเภอเต็ม ปลายฤดูมีข่าวมาว่าทางหลวงสายตะวันตกไม่มีทหารเดินตรวจมาสองเดือนแล้ว ขบวนเกลือโดนปล้นที่ทางโค้งหน้าผา
      effects: { world: { treasury: 1, peace: -1 }, flags: [sent_the_levy_half] }
    - id: draw_lots_on_the_porch
      label: ใส่ชื่อทุกเตาลงหม้อดิน รวมชื่อคนในศาลา แล้วจับต่อหน้าคนทั้งอำเภอ
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          หม้อดินตั้งบนระเบียงคำร้อง เด็กหญิงคนหนึ่งที่ยังอ่านหนังสือไม่ออกเป็นคนล้วงมือลงไปหยิบ {name}อ่านออกเสียงทุกใบ ใบที่สามเป็นชื่อเสมียนหนุ่มของศาลาเอง คนในลานไม่มีใครส่งเสียง เสมียนหนุ่มลุกจากม้านั่ง ถอดปลอกแขนกันหมึก วางไว้บนโต๊ะ

          ไม่มีหินกระเด็นมาที่ศาลาเลยทั้งฤดู นาที่ขาดคนดำ เพื่อนบ้านลงไปดำให้กันเองสองแปลง
        effects: { stats: { CHA: 1 }, world: { peace: 1, treasury: -1 }, org: { id: crown_office, merit: 1 }, flags: [drew_the_levy_by_lots] }
      failure:
        text: |
          ชื่อที่ห้ากับชื่อที่หกมาจากบ้านเดียวกัน แม่ของบ้านนั้นตะโกนว่าหม้อมีก้นสองชั้น คนในลานดันกันขึ้นระเบียง หม้อดินตกแตก ชิ้นหนึ่งบาดสันมือ{name} ทหารม้ากลับมาในวันที่สิบสี่กับทหารอีกสิบคน เลือกสิบสองคนเองจากนาที่ใกล้ทางที่สุด

          ตั้งแต่นั้นมา คนในอำเภอเรียกหม้อดินทุกใบที่ตั้งบนระเบียงศาลาว่าหม้อก้นสองชั้น แม้จะเป็นแค่หม้อใส่น้ำดื่ม
        effects: { hp: -1, world: { peace: 1, treasury: -1 }, flags: [levy_lots_went_wrong] }
    - id: keep_the_paper_in_the_drawer
      label: เก็บใบเกณฑ์ไว้ในลิ้นชัก รอให้ทหารม้ามาถามเอง
      refuse: true
      text: |
        วันที่สิบสี่ ทหารม้ากลับมา ไม่ได้มาคนเดียว เขาไม่ขึ้นมาที่ระเบียง ไม่ถามหาใบเกณฑ์ ทหารสิบคนเดินลงนาที่อยู่ใกล้ทางที่สุด เลือกเอาคนที่ยืนหลังตรง จนได้ครบสิบสอง

        ใบเกณฑ์ยังอยู่ในลิ้นชักของ{name} ช่องรายชื่อว่างทั้งสิบสองช่อง ทหารไม่ได้ต้องการมัน
      effects: { flags: [left_the_levy_to_the_soldiers] }

- id: adult.office_duty_seal_piles
  stage: adult
  weight: 20
  once: false
  duty: crown_office
  when:
    age: [25, 64]
    org: { id: crown_office, min_rank: 3 }
  text: |
    กระดาษที่รอตรามาถึงโต๊ะก่อนตัว{name}ทุกเช้า เสมียนยกมาเรียงไว้สามกอง กองซ้ายรอตรา กองกลางรอคำตอบ กองขวาสูงที่สุด รอให้มีใครกล้าตอบ แท่นหมึกตราชุ่มอยู่เสมอ เพราะเสมียนเติมให้ตั้งแต่เช้ามืดก่อนไปกินข้าว

    คนที่ถือตรามานานรู้ว่ากระดาษบอกตัวเองตั้งแต่ยังไม่คลี่ แผ่นที่พับสามทบคือเรื่องเงิน แผ่นที่พับสองทบคือเรื่องคน แผ่นที่มีเม็ดทรายติดรอยพับมาจากคนที่เดินมาไกล แผ่นที่มีกลิ่นน้ำอบไม่เคยเป็นเรื่องเล็ก

    เช้านี้กองซ้ายสูงกว่าที่ควรครึ่งคืบ แผ่นบนสุดพับสามทบ มีเม็ดทรายติดอยู่ที่รอยพับ
  choices:
    - id: seal_by_the_last_line
      label: อ่านบรรทัดสุดท้ายของทุกแผ่น แล้วประทับไปทีละแผ่น
      text: |
        บรรทัดสุดท้ายของกระดาษราชการคือบรรทัดที่ขอ ที่เหลือคือเหตุผล {name}ประทับจนกองซ้ายหมดก่อนเที่ยง เสียงตราลงกระดาษเป็นจังหวะเดียวกันทั้งเช้า เสมียนที่นั่งหน้าห้องเคาะปลายปากกาตามโดยไม่รู้ตัว

        แผ่นที่มีเม็ดทรายผ่านไปพร้อมแผ่นอื่น บรรทัดที่สามของแผ่นนั้นไม่มีใครอ่าน
      effects: { alignment: { law: 1 }, flags: [sealed_the_left_pile] }
    - id: read_every_line
      label: อ่านทุกบรรทัดของทุกแผ่น ไม่ว่ากองจะสูงขึ้นอีกเท่าไร
      check: { stat: INT, dc: 13 }
      success:
        text: |
          แผ่นที่มีเม็ดทรายมาจากหมู่บ้านที่สะพานพัง ขอยกเว้นค่าผ่านทางหนึ่งฤดู เพราะทุกคนต้องอ้อมไปข้ามที่ท่าน้ำของหมู่บ้านอื่น บรรทัดที่สามบอกว่าสะพานพังเพราะเกวียนของทางการเอง {name}ประทับตรา แล้วเขียนเพิ่มอีกบรรทัดให้ช่างไม้ของทางการไปซ่อม

          กองซ้ายหมดตอนตะเกียงดวงแรกจุด กองกลางสูงขึ้นอีกหนึ่งคืบ เสมียนหน้าห้องกลับบ้านไปก่อนแล้ว
        effects: { reputation: { crown: 1 }, org: { id: crown_office, merit: 1 }, flags: [read_the_pile_line_by_line] }
      failure:
        text: |
          ตกค่ำ ตัวหนังสือเริ่มขยับเองบนกระดาษ {name}อ่านแผ่นเดียวกันซ้ำสามรอบโดยไม่รู้ว่าอ่านไปแล้ว ตาแสบจนต้องเอาผ้าชุบน้ำเย็นวางไว้บนเปลือกตาครึ่งชั่วยาม

          เช้าวันรุ่งขึ้นกองซ้ายสูงกว่าเมื่อวาน แผ่นที่มีเม็ดทรายยังรออยู่ในกองนั้น และคนส่งมานั่งรออยู่ที่ม้านั่งหน้าประตู
        effects: { hp: -1, flags: [read_the_pile_line_by_line] }
    - id: leave_the_piles
      label: ปิดลิ้นชักตรา ออกไปกินข้าวเที่ยงให้นานกว่าที่เคย
      refuse: true
      text: |
        ร้านข้าวแกงหัวมุมมีปลาทูทอดวันนี้ {name}กินช้า สั่งน้ำชาเพิ่มอีกกา กว่าจะเดินกลับก็บ่ายคล้อย

        ชายคนหนึ่งนั่งอยู่บนม้านั่งหน้าประตู รองเท้ามีทรายติดเป็นคราบ เขานั่งตรงนั้นมาตั้งแต่เช้า ยังไม่ได้กินอะไร
      effects: { flags: [left_the_seal_piles_waiting] }

# ---------- โต๊ะสี่กุญแจ (ขุนคลัง) ----------
- id: adult.office_duty_four_keys
  stage: adult
  scene: council_hall
  weight: 20
  duty: crown_office
  when:
    age: [25, 64]
    org: { id: crown_office, min_rank: 4 }
  text: |
    ห้องคลังของเวนทราสไม่มีหน้าต่าง โต๊ะกลางห้องเป็นไม้ดำ ขอบโต๊ะมีรอยสึกสี่รอย ตรงที่ข้อศอกของคนสี่คนวางมาหลายรุ่น ประตูมีรูกุญแจสี่รู ไขพร้อมกันได้ก็ต่อเมื่อคนทั้งสี่ยืนเบียดจนไหล่ชนกัน ทุกปลายปี โต๊ะนี้ตัดสินว่าเงินในห้องจะจ่ายอะไร และอะไรต้องรอ

    โมเรสเปิดสมุดหนี้ไปหน้าที่คั่นด้วยเชือกแดง วางนิ้วลงบนสามบรรทัด งวดของธนาคารเบเลค เงินที่ส่งไปป้อมของภาคีผู้เฝ้าผนึก และภาษีเตาที่คลังยอมคงอัตราเดิมไว้ให้ชาวบ้าน ไม่ได้ขึ้นมาหลายรอบนับเตาแล้ว เงินในห้องพอจ่ายสองบรรทัด เขาพูดเบาจนเสมียนที่จดอยู่มุมห้องต้องวางปากกา

    ขุนคลังอีกสามคน รวมโมเรส ลงเสียงไปแล้ว สามเสียง สามบรรทัด คนละบรรทัด เสียงของ{name}เป็นเสียงที่สี่ บรรทัดไหนได้สองเสียง บรรทัดนั้นโดนตัด
  choices:
    - id: skip_the_bank_instalment
      label: ลงเสียงงดงวดของธนาคารเบเลคปีนี้
      text: |
        ธนาคารไม่ส่งจดหมายทวง ธนาคารส่งคนมานั่งในห้องรับแขกของคลังทุกเช้า ชายแต่งตัวเรียบร้อย เอาสมุดบัญชีเล่มบางวางบนตัก ทุกเช้าเขาขอน้ำชาหนึ่งถ้วย ดื่มหมด แล้วกลับตอนเย็น ปลายปี ดอกของงวดที่งดไปทบเข้าเงินต้นด้วยตัวเลขที่โมเรสต้องอ่านสองรอบ

        ปีนั้นเบี้ยของป้อมทุกป้อมไปถึงครบ ภาษีเตาไม่ขึ้น ในอำเภอที่{name}เคยนั่งโต๊ะเสมียน ปล่องไฟมีควันขึ้นตอนเช้ามืดในปีนับเตามากกว่ารอบก่อน
      effects: { world: { treasury: -2, peace: 2 }, reputation: { belek_bank: -1 }, flags: [skipped_the_bank_instalment] }
    - id: cut_the_wardens_money
      label: ลงเสียงตัดเงินที่ส่งไปป้อมของภาคีผู้เฝ้าผนึก
      text: |
        หนังสือแจ้งไปถึงแดนเถ้ากับขบวนถ่าน สามเดือนต่อมามีจดหมายตอบมาฉบับเดียว ลายมือแน่นจนแทบไม่เหลือขอบ เป็นรายการของที่ป้อมหนึ่งป้อมขาด น้ำมันกี่ถัง หัวหอกกี่อัน คนกี่คน ท้ายจดหมายไม่มีคำขอ มีแต่ตัวเลข

        โมเรสอ่านจดหมายฉบับนั้นจบ แล้วเย็บเข้าสมุดหนี้ ตรงหน้าเดียวกับงวดของธนาคารที่จ่ายไปครบ
      effects: { world: { treasury: 2, demon: 1 }, reputation: { wardens: -2 }, flags: [cut_the_wardens_money] }
    - id: raise_the_hearth_tax
      label: ลงเสียงขึ้นภาษีเตา
      text: |
        อัตราใหม่ออกจากห้องคลังไปพร้อมใบตั้งเสมียนนับเตาชุดใหม่ ปีนับเตาต่อมา ศาลาทุกอำเภอส่งยอดเตามาน้อยลง ทั้งเล่มปกแดงและเล่มที่ไม่มีใครส่ง แต่เงินในหีบมากขึ้น เพราะอัตราขึ้นเร็วกว่าที่ปล่องดับ

        คนที่มายืนรอหน้าประตูคลังในเช้าวันจ่ายเบี้ยไม่ได้มาทวงเบี้ย เป็นหญิงคนหนึ่งจากอำเภอไกล ถือกระสอบข้าวเปลือกครึ่งกระสอบ นางมาถามว่าภาษีเตาของบ้านที่ไม่มีไฟจะจ่ายด้วยอะไร
      effects: { world: { treasury: 2, peace: -2 }, flags: [raised_the_hearth_tax] }
    - id: keep_the_pawned_chests
      label: วางรายชื่อสิบเก้าอำเภอลงกลางโต๊ะ ลงเสียงให้หีบของอำเภอพวกนั้นเข้าเวนทราส ไม่ไปคาร์ดิน
      requires: { flag: read_the_nineteen_districts }
      text: |
        โมเรสดูรายชื่อที่{name}คัดมาด้วยลายมือตัวเอง แล้วดูหน้าที่เขาเย็บไว้ท้ายเล่มนานพอให้ทั้งโต๊ะเห็นว่าเป็นหน้าเดียวกัน แล้วลบเสียงที่ตัวเองลงไว้ ลงใหม่ตาม{name} สองเสียงต่อหนึ่งต่อหนึ่ง ไม่มีใครค้าน

        ฤดูนั้น หีบสิบเก้าใบเลี้ยวเข้าเวนทราสแทนที่จะไปถนนสมุดบัญชี ธนาคารส่งคนของตัวเองไปเก็บเงินในสิบเก้าอำเภอนั้นเอง ถือใบสัญญาจำนำที่มีตราของอาณาจักร คนในอำเภอพวกนั้นจ่ายภาษีเตาสองรอบในปีเดียว แล้วจึงรู้ว่าตัวเองจ่ายให้ใครมาตลอด
      effects: { world: { treasury: 2, peace: -2 }, reputation: { belek_bank: -2 }, flags: [kept_the_pawned_chests] }
    - id: sign_last_years_sheet
      label: ขอให้โต๊ะจ่ายตามแผ่นของปีก่อน ไม่ตัดบรรทัดไหนเพิ่ม
      refuse: true
      text: |
        เสมียนมุมห้องคัดแผ่นของปีก่อนใหม่ทั้งแผ่น แก้แค่วันที่ ขุนคลังทั้งสี่ลงชื่อตามลำดับเก้าอี้ ส่วนที่จ่ายไม่ได้เขียนต่อท้ายสมุดหนี้อีกบรรทัด ลายมือของโมเรส ตัวเล็กเท่าเมล็ดงา

        คืนนั้นกุญแจสี่ดอกไขประตูห้องคลังพร้อมกัน ไหล่ทั้งสี่ชนกันตรงที่เดิม ไม่มีใครพูดถึงบรรทัดใหม่
      effects: { flags: [signed_last_years_sheet] }

# ---------- เลื่อนขั้น ----------
- id: adult.office_rise_deputy
  stage: adult
  scene: market
  weight: 60
  must: true
  once: true
  mark: ขึ้นเป็นปลัดอำเภอ
  when:
    age: [19, 80]
    org: { id: crown_office, min_rank: 1, max_rank: 1, ready: true }
  text: |
    ธรรมเนียมของศาลา ใบตั้งต้องอ่านออกเสียงบนระเบียงคำร้องตอนที่คนมารอยื่นเรื่องมากที่สุด ให้ทั้งอำเภอได้ยินว่าใครได้ขึ้นนั่งตรงไหน และต่อไปถ้าจะด่าต้องด่าใคร

    วาร์เดลยืนหัวระเบียง ใบตั้งในมือข้างหนึ่ง ขนมข้าวเหนียวในมืออีกข้าง อ่านช้าเหมือนอ่านใบรับข้าวเปลือก ชื่อ{name}ออกมาจากปากเขาพร้อมเศษแป้ง ตามด้วยคำว่าปลัดอำเภอ คนในแถวหันไปซุบซิบกัน หญิงคนหนึ่งที่ถือคำร้องเรื่องรั้วมาเป็นรอบที่สามพับกระดาษเก็บ บอกคนข้างๆ ว่าพรุ่งนี้ค่อยมาใหม่ คนตัดสินรั้วเพิ่งได้ตำแหน่ง ใจยังดีอยู่ รอให้หายดีก่อน

    กุญแจดอกที่สองของหีบภาษีห้อยเชือกหนังอยู่บนตะปูหลังโต๊ะของวาร์เดล เชือกเส้นนั้นดำเป็นมันเพราะผ่านคอปลัดมาหลายคน
  choices:
    - id: hang_the_second_key
      label: เดินไปปลดกุญแจลงจากตะปู คล้องคอเอง
      text: |
        เชือกหนังมีกลิ่นเหงื่อของคนอื่น {name}คล้องคอ ลูกกุญแจตกลงมาอยู่ตรงกระดูกอก เย็นอยู่ครู่หนึ่งแล้วก็อุ่นเท่าตัว วาร์เดลปรบมือสองที มือยังเปื้อนแป้ง

        คืนนั้น{name}นอนตะแคงทับกุญแจทั้งคืนโดยไม่ได้ตั้งใจ เช้ามามีรอยฟันกุญแจประทับอยู่บนหน้าอก
      effects: { org: { id: crown_office, promote: true }, items: [office_second_key], alignment: { law: 1 }, flags: [hung_the_second_key] }
    - id: judge_the_fence_today
      label: เรียกหญิงเรื่องรั้วกลับมา ตัดสินให้เสร็จวันนี้
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}เดินไปดูรั้วกับนางเดี๋ยวนั้น วัดด้วยเชือกของศาลา ตัดสินให้ถอยรั้วเข้าไปครึ่งศอก ฝั่งไหนก็ไม่ได้ทั้งหมด ฝั่งไหนก็ไม่เสียทั้งหมด หญิงคนนั้นบ่นตลอดทางกลับ แต่ไม่ได้มายื่นเรื่องเป็นรอบที่สี่

          วาร์เดลบอกคนในศาลาว่าปลัดคนใหม่ตัดสินเร็ว แล้วบอกว่าเร็วไม่ใช่คำชม
        effects: { org: { id: crown_office, promote: true }, items: [office_second_key], stats: { WIS: 1 }, flags: [judged_a_fence_on_appointment_day] }
      failure:
        text: |
          {name}ตัดสินให้นางได้รั้วคืนทั้งแนว เพื่อนบ้านของนางมายืนที่ระเบียงตอนเย็น พร้อมคำร้องของตัวเองที่จ้างคนหน้าโรงเตี๊ยมเขียน สะกดผิดสี่ที่ ขอให้ศาลาตัดสินใหม่

          เรื่องรั้วแนวนั้นกลายเป็นเรื่องแรกในสมุดของปลัดคนใหม่ และเป็นเรื่องที่สองด้วย
        effects: { org: { id: crown_office, promote: true }, items: [office_second_key], flags: [judged_a_fence_on_appointment_day] }
    - id: buy_the_queue_sugarcane
      label: ซื้อน้ำอ้อยแจกคนในแถวทั้งแถว
      requires: { min_gold: 2 }
      text: |
        ร้านน้ำอ้อยเทหมดหม้อ แล้วต้องเคี่ยวหม้อใหม่ คนในแถวถือกระบอกไม้ไผ่ยืนรอยื่นเรื่องกันต่อ ยาวกว่าเดิมเพราะคนที่ผ่านไปมาแวะเข้าแถวด้วย

        ทั้งเดือน คนเรียก{name}ว่าปลัดน้ำอ้อย ชื่อนั้นติดอยู่จนหลังจากที่ร้านน้ำอ้อยปิดไปแล้ว
      effects: { org: { id: crown_office, promote: true }, items: [office_second_key], gold: -2, reputation: { crown: 1 }, flags: [bought_the_queue_sugarcane] }

- id: adult.office_rise_district_head
  stage: adult
  scene: council_hall
  weight: 60
  must: true
  once: true
  time: dusk
  mark: ขึ้นเป็นนายอำเภอ
  when:
    age: [19, 80]
    org: { id: crown_office, min_rank: 2, max_rank: 2, ready: true }
  text: |
    วาร์เดลได้ใบตั้งเข้าเวนทราส เขาอ่านเองบนระเบียงคำร้องเมื่อเช้า อ่านเร็วกว่าที่เคยอ่านอะไรมาทั้งชีวิต แล้วอ่านใบที่สองต่อทันที ใบที่ตั้ง{name}เป็นนายอำเภอ คนในแถวปรบมือให้ใบแรกดังกว่าใบที่สอง เขาบอกว่าไม่ต้องคิดมาก คนอำเภอนี้ปรบมือให้คนที่กำลังจะไปเสมอ

    ตกค่ำ ห้องนายอำเภอเหลือแต่ของที่วาร์เดลไม่เอาไป โต๊ะ เก้าอี้ที่เบาะยุบเป็นรูปก้นเขา ตราอำเภอในกล่องไม้บุผ้าแดงที่ซีดจนเป็นสีชมพู กับถังข้าวสารใบหนึ่งที่มุมห้อง ฝาถังมีหินทับ เขายกหินออก ล้วงแขนลงไปถึงศอก ดึงสมุดปกขาดขึ้นมาจากข้าวสาร เม็ดข้าวร่วงจากสันสมุดลงพื้นเป็นทาง

    เขาบอกว่าเล่มนี้คือเล่มจริง เล่มที่ส่งเวนทราสอยู่บนชั้น ใครนั่งห้องนี้ต้องดูแลทั้งสองเล่ม แล้ววางสมุดลงบนโต๊ะ ปัดข้าวสารออกจากแขนเสื้อ
  choices:
    - id: keep_the_barrel_book
      label: ใส่สมุดกลับลงถังข้าวสาร เอาหินทับไว้อย่างเดิม
      text: |
        {name}กดสมุดลงไปจนข้าวสารปิดมิด วางหินกลับบนฝา วาร์เดลหยิบหมวกจากตะปู ยืนดูห้องอีกรอบหนึ่ง แล้วบอกว่าข้าวในถังต้องเปลี่ยนทุกปีนับเตา ไม่อย่างนั้นมอดจะกินสมุดก่อนกินข้าว

        เกวียนของเขาออกจากลานศาลาก่อนไก่ขัน ตอนสาย{name}เปิดลิ้นชักโต๊ะ เจอขนมข้าวเหนียวห่อใบตองหนึ่งห่อ ยังนิ่มอยู่
      effects: { org: { id: crown_office, promote: true }, items: [office_district_seal], alignment: { law: -1 }, flags: [kept_the_rice_barrel_book] }
    - id: ask_tesmin_whats_missing
      label: เรียกเทสมินมาถามว่าเล่มจริงยังขาดบ้านไหน
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          เทสมินมานั่งเก้าอี้ฝั่งตรงข้าม ไม่เปิดสมุด นางขานชื่อบ้านทีละหลัง ซอยไหน หลังที่เท่าไร ดับไฟตั้งแต่ปีนับเตาครั้งไหน ยาวจนตะเกียงต้องเติมน้ำมันรอบหนึ่ง ไม่มีบ้านไหนในนั้นอยู่ในสมุดเล่มไหนเลย

          จบแล้วนางบอกว่าอย่าจดลงที่ไหน แล้วลุกกลับบ้าน {name}นั่งท่องรายชื่อนั้นทวนอีกรอบในความมืด จนจำได้ครบทุกหลัง
        effects: { org: { id: crown_office, promote: true }, items: [office_district_seal], stats: { WIS: 1 }, flags: [heard_tesmins_unwritten_houses] }
      failure:
        text: |
          เทสมินดูถังข้าว ดูสมุด แล้วดูหน้า{name} นางบอกว่าข้าวในถังมอดขึ้นแล้ว ควรเปลี่ยนตั้งแต่ปีนับเตาที่แล้ว จากนั้นก็ลุกกลับบ้าน

          ตลอดฤดูนั้น ทุกเช้าที่{name}เดินผ่านโต๊ะเสมียนใหญ่ นางจะถามถึงมอดในถังข้าว ไม่เคยถามเรื่องอื่น
        effects: { org: { id: crown_office, promote: true }, items: [office_district_seal], flags: [asked_tesmin_too_soon] }
    - id: burn_the_barrel_book
      label: เผาเล่มจริงในเตาของศาลาก่อนวาร์เดลจะออกจากประตู
      text: |
        กระดาษเก่าติดไฟง่าย เม็ดข้าวในสันสมุดแตกเปาะในเปลวไฟเหมือนข้าวตอก วาร์เดลยืนดูจนหน้าสุดท้ายม้วนเป็นขี้เถ้า แล้วบอกว่าคนก่อนเขาก็เคยคิดจะเผาเหมือนกัน แต่หาไม้ขีดไม่เจอ

        ปีข้าวยากครั้งถัดมา {name}เปิดยุ้งหลวงโดยไม่มีเล่มไหนบอกว่าข้าวในยุ้งส่วนไหนเป็นของใคร มีแต่ตัวเลขในเล่มปกแดง กับเสียงของเทสมิน
      effects: { org: { id: crown_office, promote: true }, items: [office_district_seal], alignment: { law: 1 }, flags: [burned_the_rice_barrel_book] }
    - id: ask_about_the_wrong_book
      label: ถามวาร์เดลว่าปีนั้นเขาหยิบสมุดผิดเล่มจริงหรือ
      requires: { any_flags: [swapped_the_hearth_books_by_night, swapped_the_hearth_books_late, copied_a_hearth_book_by_lamplight, sent_the_true_hearth_book] }
      text: |
        วาร์เดลหัวเราะจนพุงสั่น เขาบอกว่าตั้งแต่นั่งห้องนี้มา ไม่เคยหยิบสมุดผิดเล่มสักครั้ง คนที่จะได้กุญแจดอกที่สองทุกคนได้นอนหนุนเล่มกลิ่นข้าวสารหนึ่งคืน คืนนั้นทำอะไรกับมัน คือเหตุที่ใบตั้งเขียนชื่อใครลงไป

        เขาไม่ได้บอกว่าคนอื่นที่เคยหนุนเล่มนั้นทำอะไรกับมันบ้าง {name}ก็ไม่ได้ถาม
      effects: { org: { id: crown_office, promote: true }, items: [office_district_seal], stats: { INT: 1 }, flags: [learned_vardels_wrong_book] }

- id: adult.office_rise_treasury_table
  stage: adult
  scene: council_hall
  weight: 60
  must: true
  once: true
  time: night
  mark: ขึ้นเป็นขุนคลัง
  when:
    age: [19, 80]
    org: { id: crown_office, min_rank: 3, max_rank: 3, ready: true }
  text: |
    ใบตั้งขุนคลังไม่ได้อ่านบนระเบียงคำร้อง คนของคลังสองคนมารับถึงศาลา ยืนรอที่ประตูขณะที่{name}เก็บของ ตราอำเภอคืนลงกล่อง กุญแจห้องคืนบนตะปู ของที่ติดตัวไปเวนทราสมีย่ามใบเดียวกับสมุดบันทึกส่วนตัวเล่มหนึ่ง เทสมินยืนส่งที่บันไดระเบียง ปากกาขนนกยังเสียบมวยผมอยู่สองด้าม

    เก้าอี้ตัวที่สี่ของโต๊ะคลังเคยเป็นของขุนคลังแก่คนหนึ่งที่ขอกลับไปตายในนาของตัวเอง เบาะยังยุบเป็นรูปคนอื่น โมเรสนั่งฝั่งตรงข้าม ผมขาวทั้งหัว นิ้วชี้ขวามีคราบหมึกที่ล้างไม่ออกแล้ว เขาเลื่อนกุญแจดอกที่สี่มาให้บนโต๊ะ แล้วเลื่อนสมุดเล่มหนาสีน้ำตาลเข้มตามมา สมุดหนี้

    คืนแรกโต๊ะไม่ได้ตัดสินอะไร โมเรสบอกว่าคืนแรกมีไว้อ่าน เขาเปิดเล่มให้ที่หน้าแรก แล้วกลับไปเขียนต่อในเล่มของตัวเอง เสียงปากกาของเขาเบากว่าเสียงไส้ตะเกียงไหม้
  choices:
    - id: read_to_the_last_page
      label: อ่านทุกหน้าจนถึงหน้าสุดท้าย
      check: { stat: INT, dc: 13 }
      success:
        text: |
          หน้าแรกถึงหน้าเกือบสุดท้ายเป็นงวดกับดอก ดอกกับงวด ปีหลังๆ มีแต่ดอก ไม่มีงวด หน้าสุดท้ายเย็บติดมาทีหลัง กระดาษคนละชนิด เป็นรายชื่ออำเภอสิบเก้าแห่ง ข้างแต่ละชื่อเขียนว่าหีบไปที่ถนนสมุดบัญชี คาร์ดิน ไม่ใช่เวนทราส

          {name}ไล่นิ้วลงไปทีละชื่อหาอำเภอของตัวเอง ไม่เจอ อำเภอที่อยู่ติดกันอยู่ลำดับที่เจ็ด ฮอลริคเคยขี่ม้าผ่านศาลาของอำเภอนั้นทุกปี ในวันเดียวกับที่มารับหีบของ{name} โมเรสยังเขียนอยู่ ไม่ได้เงยหน้า
        effects: { org: { id: crown_office, promote: true }, stats: { INT: 1 }, location_tag: ventras, flags: [read_the_nineteen_districts] }
      failure:
        text: |
          ตัวเลขเรียงกันลงมาเป็นแถวยาวจนตาลาย {name}ฟุบหลับไปบนหน้าที่สองร้อยกว่า ตื่นมาตอนเสมียนเปิดประตูห้องเช้า มุมสมุดกดเป็นรอยอยู่บนแก้ม

          สมุดปิดอยู่แล้ว วางกลับที่หน้าเก้าอี้ของโมเรส เขาไม่อยู่ในห้อง บนเก้าอี้ของ{name}มีผ้าห่มผืนบางพาดไว้ ไม่รู้ว่ามาตอนไหน
        effects: { org: { id: crown_office, promote: true }, location_tag: ventras, flags: [slept_on_the_debt_book] }
    - id: ask_moress_one_question
      label: ถามโมเรสว่าสมุดเล่มนี้เคยมียอดลดลงสักปีไหม
      text: |
        โมเรสวางปากกา ตอบเบาจนต้องเอนตัวข้ามโต๊ะไปฟัง เขาบอกว่าตั้งแต่เขานั่งเก้าอี้ตัวนี้ ยอดลดลงสองครั้ง ครั้งหนึ่งเพราะธนาคารเขียนผิด อีกครั้งเพราะเขาเขียนผิดเอง ทั้งสองครั้งแก้กลับภายในเดือนเดียว

        แล้วเขาก็หยิบปากกาขึ้นมาเขียนต่อ บรรทัดที่เขียนคืนนั้นเป็นดอกของเดือนนี้
      effects: { org: { id: crown_office, promote: true }, location_tag: ventras, flags: [asked_moress_about_the_debt] }
    - id: try_the_fourth_key_alone
      label: ลองไขกุญแจดอกที่สี่ที่ประตูห้องคลังคนเดียว
      text: |
        ลูกกุญแจเข้ารูได้ หมุนได้ครึ่งรอบ แล้วติด สลักข้างในรอให้อีกสามดอกหมุนไปพร้อมกัน {name}ดึงกุญแจออก ลองรูอื่น ทุกรูเหมือนกันหมด

        โมเรสไม่เงยหน้าจากสมุด เขาบอกว่าทุกคนลองคืนแรก ช่างทำกุญแจคนแรกของห้องนี้ตั้งใจให้ทุกคนลอง
      effects: { org: { id: crown_office, promote: true }, location_tag: ventras, flags: [tried_the_fourth_key_alone] }

# ---------- ใบลา ----------
# ---------- วันเปิดสมุด (ทุกแปดปีที่อยู่ในศาลา) ----------
- id: adult.office_open_book_day
  stage: adult
  scene: market
  must: true
  once: false
  when:
    age: [19, 75]
    org: { id: crown_office, max_rank: 3, min_years: 8 }
  text: |
    คนของศาลาที่ลงชื่อรับเบี้ยมาครบแปดปีต้องผ่านวันเปิดสมุดหนึ่งครั้ง ธรรมเนียมนี้ไม่มีในประกาศฉบับไหน ฮอลริคมาถึงก่อนเที่ยงพร้อมเชือกผูกปมเส้นหนึ่ง ปมหนึ่งคือชื่อหนึ่งที่ครบรอบในปีนี้ ปีนี้เชือกมีปมเดียว

    สมุดทุกเล่มที่มีลายมือของ{name}ในรอบแปดปีวางซ้อนกันบนม้านั่งยาวของระเบียงคำร้อง สูงเกือบถึงเอว ฮอลริคไม่ลงจากหลังม้า เขาให้เด็กที่มารอตักน้ำดึงออกมาสามเล่ม เปิดเล่มละหน้า แล้วอ่านชื่อซอยออกเสียงสามชื่อ คลังจะนับเตาสามซอยนั้นด้วยตาของคลังเอง เทียบกับตัวเลขในสมุด

    ชื่อที่สามคือซอยท้ายคลอง เทสมินเหลาปากกาอยู่ที่โต๊ะข้างประตู มีดของนางหยุดไปครู่หนึ่งตอนได้ยินชื่อนั้น แล้วเหลาต่อ
  choices:
    - id: lead_him_down_the_three_lanes
      label: เดินนำม้าของฮอลริคไปทั้งสามซอย ให้เขานับเอง
      text: |
        สองซอยแรกตรงกับสมุดทุกปล่อง ถึงซอยท้ายคลองตอนบ่ายคล้อย ปล่องเก้าปล่องมีควันขึ้นห้า อีกสี่ปล่องนิ่ง หน้าบ้านสี่หลังนั้นมีผ้าตากอยู่เต็มราว ฮอลริคนับจากหลังม้า นับได้ห้า ในสมุดเขียนว่าห้า

        เขาแก้ปมบนเชือกออก ผูกใหม่ที่ปลายอีกข้าง แล้วบอกว่าอีกแปดปีเจอกัน ขากลับ{name}เดินผ่านซอยท้ายคลองอีกรอบ ควันขึ้นครบเก้าปล่องแล้ว บนหลักรั้วต้นแรกมีคนวางไข่เป็ดไว้สี่ฟอง
      effects: { org: { id: crown_office, merit: 1, term: true }, flags: [passed_the_open_book_day] }
    - id: touch_the_cold_chimneys
      label: ถึงซอยท้ายคลอง ปีนขึ้นไปแตะปากปล่องที่ไม่มีควันให้ฮอลริคดู
      text: |
        ปล่องแรกอุ่น ปล่องที่สองอุ่น อิฐปากปล่องที่สี่ร้อนจนต้องชักมือกลับ ในบ้านหลังนั้นมีเสียงเด็กร้องขึ้นมาคำหนึ่ง แล้วเงียบไปเหมือนมีมือมาปิดปาก ฮอลริคแก้ตัวเลขในหน้านั้นเองด้วยดินสอของคลัง จากห้าเป็นเก้า เขียนชื่อ{name}กำกับไว้ข้างเลขใหม่ บอกว่าคลังจำชื่อคนที่นับด้วยมือ

        สี่บ้านนั้นจ่ายภาษีเตาย้อนหลังแปดปี บ้านหนึ่งจ่ายเป็นแม่หมู เดือนต่อมาที่บ่อน้ำกลางลาน คนที่ยืนรอตักน้ำเลื่อนถังหลีกให้{name}ก่อนทุกครั้ง ไม่มีใครทักสักคำ
      effects: { org: { id: crown_office, merit: 2, term: true }, reputation: { crown: 1 }, alignment: { law: 1, moral: -1 }, flags: [passed_the_open_book_day, counted_the_cold_chimneys_for_the_treasury] }
    - id: say_the_lane_is_flooded
      label: บอกฮอลริคว่าทางเข้าซอยท้ายคลองน้ำท่วมถึงท้องม้า ขอให้เด็กดึงเล่มใหม่
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ฮอลริคมองเมฆ แล้วมองกีบม้าของตัวเอง เขาไม่เคยค้างคืนที่อำเภอไหน และทางอ้อมคลองกินเวลาครึ่งบ่าย เด็กดึงเล่มใหม่ออกมา ซอยหลังโรงสี เตาตรงกับสมุดทุกปล่อง

          เขาผูกปมใหม่ที่ปลายเชือกอีกข้างก่อนตะวันคล้อย เทสมินเหลาปากกาเสร็จไปหกด้ามแล้ว นางวางด้ามที่เจ็ดลงบนโต๊ะของ{name}ตอนเดินผ่าน
        effects: { org: { id: crown_office, term: true }, stats: { CHA: 1 }, flags: [passed_the_open_book_day, kept_the_treasury_out_of_the_lane] }
      failure:
        text: |
          ฮอลริคบอกว่าม้าของคลังว่ายน้ำเป็น ทางเข้าซอยท้ายคลองแห้งจนฝุ่นขึ้น เขาไม่พูดถึงเรื่องนั้นสักคำ เขาลงจากหลังม้าเป็นครั้งแรกเท่าที่ใครในศาลาเคยเห็น แล้วเดินแตะปากปล่องเองทีละหลัง เก้าปล่อง อุ่นทั้งเก้า

          ศาลาเสียค่าปรับเท่าภาษีเตาของสี่บ้านแปดปี วาระของ{name}ได้ต่อ แต่ในสมุดของคลัง ข้างชื่อ{name}มีจุดหมึกแดงหนึ่งจุด
        effects: { org: { id: crown_office, term: true }, gold: -2, reputation: { crown: -1 }, flags: [passed_the_open_book_day, red_dot_in_the_treasury_book] }
    - id: lay_the_pen_on_the_pile
      label: วางปากกาลงบนกองสมุด บอกฮอลริคว่าปมนี้แก้ทิ้งได้เลย
      text: |
        ฮอลริคมองกองสมุด แล้วมอง{name} เขาแก้ปมออกโดยไม่ถามอะไร คนที่ลาออกในวันเปิดสมุด คลังไม่ตามไปนับซอยไหนทั้งนั้น ข้อนี้ก็ไม่มีในประกาศฉบับไหนเหมือนกัน เบี้ยก้อนสุดท้ายมาถึงพร้อมหีบภาษีของปีนั้น สองเหรียญกับข้าวสารหนึ่งกระสอบ

        เทสมินเก็บสมุดทั้งกองเข้าตู้เอง นางเสียบปากกาของ{name}ไว้ในมวยผม ข้างปากกาสองด้ามของนาง แล้วเรียกคนถัดไปในแถว
      effects: { org: { id: crown_office, leave: true }, mark: ออกจากราชการ, gold: 2, lose_items: [office_second_key, office_district_seal], flags: [left_the_crown_office, left_on_the_open_book_day] }

- id: adult.office_old_resignation
  stage: adult
  weight: 10
  when:
    age: [25, 64]
    org: crown_office
  text: |
    ใบลาออกจากราชการเป็นแผ่นแบบ หัวกระดาษเสมียนคัดไว้แล้ว เหลือช่องให้กรอกสามช่อง ชื่อ ตำแหน่ง และเหตุที่ลา ช่องเหตุที่ลาแคบจนเขียนได้ไม่เกินห้าคำ ราชการตั้งใจให้แคบอย่างนั้น

    {name}เจอใบลาแผ่นหนึ่งในลิ้นชักล่างของโต๊ะตัวเอง อยู่ใต้กระดาษซับหมึกที่ไม่ได้ใช้มานาน ช่องชื่อกรอกแล้วด้วยลายมือของ{name}เอง ช่องตำแหน่งก็กรอกแล้ว ช่องเหตุที่ลาว่าง หมึกซีดเป็นสีน้ำตาล จำไม่ได้ว่าเขียนไว้เมื่อไร จำได้แค่ว่าเป็นวันที่แย่

    ข้างนอกมีคนรอเรื่องอยู่ เสียงไอของเขาดังลอดประตูเข้ามาเป็นระยะ
  choices:
    - id: fill_the_five_words
      label: เขียนเหตุที่ลาห้าคำ แล้วส่งขึ้นไปตามสาย
      text: |
        ห้าคำนั้นเขียนได้ในรวดเดียว ไม่ต้องร่าง ใบลาเดินทางผ่านมือคนเดียวกับที่กระดาษอื่นผ่าน กลับมาในสามสัปดาห์ ตราประทับครบ ตำแหน่งของ{name}มีคนรอนั่งต่อแล้ว

        วันสุดท้าย {name}ล้างขวดหมึกของตัวเองจนก้นขวดใส แล้ววางไว้บนโต๊ะให้คนถัดไป ชายที่ไอเป็นคนสุดท้ายที่{name}รับเรื่อง เขามาขอใบรับรองว่าบ้านเขามีเตาเดียว
      effects: { org: { id: crown_office, leave: true }, mark: ออกจากราชการ, lose_items: [office_second_key, office_district_seal], flags: [left_the_crown_office] }
    - id: tear_it_and_call_him_in
      label: ฉีกใบลาทิ้ง แล้วเรียกคนข้างนอกเข้ามา
      text: |
        กระดาษเก่าฉีกง่ายกว่าที่คิด {name}ทิ้งเศษลงตะกร้า แล้วเปิดประตู ชายที่ไอเดินเข้ามาพร้อมคำร้องเรื่องหลังคาที่ศาลาสัญญาว่าจะซ่อมให้ตั้งแต่ปีนับเตาครั้งก่อน เขาไอจนต้องหยุดพูดทุกสามคำ

        เรื่องหลังคาเสร็จตอนตะวันตกดิน {name}ลงไปดูกับช่างไม้เอง ขากลับเปียกฝนทั้งตัว
      effects: { org: { id: crown_office, merit: 1 }, flags: [tore_up_the_old_resignation] }
    - id: put_it_back_under
      label: เก็บใบลาไว้ใต้กระดาษซับหมึกตามเดิม
      text: |
        {name}สอดใบลากลับใต้กระดาษซับหมึก ปิดลิ้นชัก แล้วเรียกคนข้างนอกเข้ามา ทั้งวันทำงานได้ตามปกติ ไม่มีใครรู้ว่าในลิ้นชักล่างมีอะไร

        ตั้งแต่นั้นมา ลิ้นชักล่างเป็นลิ้นชักเดียวในห้องที่{name}ไม่ให้เสมียนเปิด
      effects: { flags: [kept_a_blank_resignation] }
