# ชุด อ การเมืองของสองแดน 12 เรื่อง ฮอร์ดุน 6 ไอเลธ 6 สำหรับคนที่อยู่ในแดน (location_tag) อายุ 22 ถึง 64 น้ำหนัก 22 เกิดครั้งเดียว
# คนของแดน (มีแต่ในข้อความ ไม่อยู่ในผังคน)
#   ฮอร์ดุน: บรูดา ตระกูลสิ่วยาว ผู้ถือค้อนสภา (หญิง) · มาร์โดก ตระกูลลิ่มเหล็ก นายเตาหนุ่มของชั้นโรงหลอม (ชาย)
#            บรูกา ตระกูลตะเกียงต่ำ ตั้งหม้อข้าวต้มที่ลานประตูล่าง นิ้วดำดินสอ (ชาย) · นายราคาที่ลานถ่านของตลาดตีนเขา (ชาย ไม่มีชื่อ)
#   ไอเลธ: ผู้คุมหอที่ตากำลังบอด (ชาย ไม่มีชื่อ) · ลาเธีย (หญิง) · นาเวธ ผู้นำคนกิ่งล่าง (หญิง) · ซูเรล ข้าหลวงป่าไม้ ชายมนุษย์
# อ่านค่าอาณาจักรอย่างเดียว ไม่ขยับ: ขบวนที่สิบสาม (คลังต่ำ) · สองตราที่ตีนบันได (บัลลังก์ต่ำ) · หลักเขตที่ย้ายตอนกลางคืน (คลังต่ำ) · ทูตคนเดียวสองฉบับ (บัลลังก์ต่ำ)
# เรื่องที่เอ่ยถึงหนี้ ราคาถ่านของอาร์เวล หรือใบสั่งแขนกล กัน year: [302, 410] เรื่องที่เอ่ยถึงสองตรา เจ้าชาย เจ้าหญิง หรือทางเสมียน กัน year: [318, 410]
# ปิดสำหรับคนนอก: ฮอร์ดุน 1 (ค้อนของตระกูล race_dwarf) · ไอเลธ 2 (คืนนับของนาเวธ กับคนแปลของซูเรล race_elf)
# ไม่บอกว่าชั้นยี่สิบสามมีอะไร คนในเรื่องรู้แค่ว่าก่อปิดตาย และไม่มีหินชื่อของตระกูลไหนที่ปากอุโมงค์

# ---------- ฮอร์ดุน ก ขบวนที่สิบสาม (คลังต่ำ) ----------
- id: adult.realm_hordun_thirteenth_train
  stage: adult
  weight: 22
  scene: station
  when:
    age: [22, 64]
    location_tag: hordun
    year: [302, 410]
    world: { treasury: [-8, -2] }
  text: |
    ตู้ถ่านทุกตู้ที่ออกจากลานถ่านของตลาดตีนเขามีเลขดินขาวเขียนไว้ข้างตู้ เลขเดือนหนึ่งตัว เลขขบวนหนึ่งตัว เสมียนของวงสภานั่งลอกเลขลงแผ่นชนวนทุกครั้งที่ขบวนออก สิ้นปีแผ่นชนวนทั้งกองขึ้นเขาไปให้ช่างหินในทุนดาร์นับ ขบวนครบเมื่อไร ช่างหินก็สลักขีดใต้หนี้ได้อีกหนึ่งขีด เดือนหนึ่งสิบสองขบวน เป็นแบบนี้มาตั้งแต่กำแพงหนี้มีบรรทัดแรก

    ขบวนที่สิบสองของเดือนนี้ออกไปตั้งแต่สามวันก่อน เช้านี้ตู้เปล่าอีกขบวนหนึ่งถอยเข้ามาจอดข้างกองถ่าน นายราคาสั่งให้มา ชายจากอาร์เวลในเสื้อคลุมที่บางเกินกว่าลมบนเขา ยืนอยู่บนลังไม้ข้างโต๊ะเสมียน อ่านจากสมุดเล่มหนาว่าข้างล่างขอเพิ่มอีกหนึ่งขบวน ราคาตามปากเขา จ่ายเป็นเหรียญ ไม่เข้าบัญชีหนี้ ขบวนที่ขอเพิ่มไม่ใช่ขบวนใช้หนี้ เขาว่า เสมียนของวงสภาวางแท่งดินขาวลงบนโต๊ะ แล้วนั่งทับมือตัวเองไว้ทั้งสองข้าง

    คนแบกที่ปลายรางยังไม่ได้ค่าแรงของเดือนก่อน นายราคารู้ข้อนี้ดี เขาวางถุงเหรียญไว้บนลัง บอกว่าตักเต็มตู้หนึ่งได้หนึ่งเหรียญ จ่ายก่อนตะวันตก วันขบวนเข้า ลานถ่านจ้างทุกคนที่มีสองมือ {name}ยืนอยู่ในแถวคนแบกตั้งแต่เช้า พลั่วในมือยังไม่เปื้อน
  choices:
    - id: load_the_thirteenth
      label: ตักถ่านขึ้นตู้ เอาเหรียญของนายราคา
      text: |
        ถ่านมารก้อนใหญ่ตักยาก ต้องเอามือช่วยพลั่ว {name}ตักเต็มสามตู้ก่อนตะวันตก ฝุ่นสีสนิมเกาะขนตาจนกะพริบทีไรก็แสบ นายราคาจ่ายสามเหรียญตรงตามคำ นับใส่มือทีละเหรียญ แล้วเช็ดนิ้วตัวเองกับชายเสื้อคลุม

        ขบวนที่สิบสามออกจากลานตอนพลบค่ำ ข้างตู้ไม่มีเลขสักตัว เสมียนของวงสภาลุกจากโต๊ะเป็นครั้งแรกของวัน เดินไล่แถวคนแบก จดชื่อทุกคนที่ตักขึ้นตู้ลงหลังแผ่นชนวน ชื่อ{name}อยู่บรรทัดที่สี่
      effects: { gold: 3, reputation: { dwarf_council: -1 }, flags: [loaded_the_thirteenth_train] }
    - id: chalk_the_wagons
      label: หยิบแท่งดินขาวจากโต๊ะเสมียน เขียนเลขขบวนลงข้างตู้ทุกตู้ก่อนรถออก
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}อ้อมไปด้านที่หันเข้าหน้าผา ด้านที่คนยืนบนลังไม้มองไม่เห็น เขียนเลขเดือนกับเลขสิบสามลงข้างตู้ทีละตู้ ตัวใหญ่เท่าฝ่ามือ ตู้สุดท้ายเขียนเสร็จตอนหัวรถพ่นไอครั้งแรก

          เสมียนของวงสภาเห็นเลขตอนขบวนแล่นผ่านโต๊ะ เขาลอกลงแผ่นชนวนทีละตู้ด้วยมือที่สั่น แผ่นของเดือนนี้มีสิบสามบรรทัด เป็นแผ่นแรกบนโต๊ะตัวนั้นที่มีเกินสิบสอง
        effects: { stats: { DEX: 1 }, reputation: { dwarf_council: 1, crown: -1 }, flags: [chalked_the_thirteenth_train] }
      failure:
        text: |
          {name}เขียนได้สองตู้ คนของนายราคาก็เดินมาพร้อมกระสอบชุบน้ำ ลบเลขออกทีละตัว ดินขาวละลายเป็นทางไหลลงตามข้างตู้ เขาไม่ได้ด่าสักคำ ยื่นกระสอบให้{name}ลบตู้ที่สองเอง

          ขบวนที่สิบสามออกจากลานโดยไม่มีเลข ข้างตู้สองตู้มีรอยขาวเป็นทางยาวลงไปถึงล้อ คนแบกที่ปลายรางเรียกขบวนนั้นว่าขบวนร้องไห้ไปจนสิ้นเดือน
        effects: { reputation: { crown: -1 }, flags: [caught_chalking_the_wagons] }
    - id: sit_with_the_clerk
      label: วางพลั่ว ไปนั่งข้างเสมียนของวงสภา
      text: |
        ม้านั่งข้างโต๊ะเสมียนนั่งได้สองคน {name}นั่งเป็นคนที่สอง คนแบกอีกห้าหกคนวางพลั่วตามมานั่งบนกองหมอนรางข้างโต๊ะ นายราคาไม่ได้ไล่ใคร เขาส่งคนลงไปแถวโรงเตี๊ยม ขึ้นมาอีกทีพร้อมคนอาร์เวลยี่สิบคนที่ไม่เคยจับพลั่วตักถ่านมาร พวกนั้นตักกันจนมืดกว่าขบวนจะเต็ม

        ตอนขบวนออก เสมียนหยิบขนมปังแข็งก้อนหนึ่งออกจากย่าม หักแบ่งให้คนบนม้านั่งกับคนบนกองหมอนรางคนละชิ้น ขนมปังของเขามีฝุ่นถ่านติดทุกชิ้น
      effects: { reputation: { dwarf_council: 1 }, flags: [sat_with_the_council_clerk] }
    - id: call_the_kardin_price
      label: ถามนายราคาเสียงดังว่าถ่านตู้นี้ไปขายที่คาร์ดินราคาเท่าไร
      requires: { any_flags: [job_merchant, job_clerk, job_smuggler] }
      text: |
        นายราคาตอบราคาที่เขาซื้อ ไม่ตอบราคาที่คาร์ดิน {name}ตอบแทนเขา ราคาที่ร้านถ่านบนถนนสมุดบัญชีขายถ่านมารเมื่อเดือนก่อน ห่างกันสี่เท่า คนแบกทั้งแถวหัวเราะ บางคนหัวเราะจนต้องเอาด้ามพลั่วยันพื้น

        ก่อนเที่ยงนายราคาขึ้นค่าตักเป็นตู้ละสองเหรียญ ขบวนที่สิบสามออกจากลานเต็มทุกตู้เหมือนเดิม {name}ได้สองเหรียญจากตู้เดียว กับชื่อที่คนปลายรางเรียกกันไปอีกนาน คนถามราคา
      effects: { gold: 2, stats: { INT: 1 }, flags: [called_the_kardin_price] }

# ---------- ฮอร์ดุน ข สองตราที่ตีนบันได (บัลลังก์ต่ำ) ----------
- id: adult.realm_hordun_two_seals_one_stair
  stage: adult
  weight: 22
  when:
    age: [22, 64]
    location_tag: hordun
    year: [318, 410]
    not_flags: [throne_white, throne_grey]
    world: { throne: [-8, -2] }
  text: |
    ทูตสองคนลงจากรถไฟขบวนเดียวกันที่ลานประตูล่างของทุนดาร์ นั่งมาคนละตู้ คนหนึ่งเป็นนายทหารหนุ่ม รองเท้าขัดจนเงา ตราขาวรูปตะเกียงแขวนห้อยอยู่ที่อก อีกคนเป็นหญิงวัยกลางคน ข้อมือเสื้อเปื้อนหมึกทั้งสองข้าง ตราเทารูปตาชั่งคล้องโซ่ห้อยอยู่ที่เข็มขัด ในย่ามของทั้งสองมีกระดาษคนละแผ่น ข้อความเหมือนกันเกือบทุกคำ ถ่านใช้หนี้ของปีนี้ให้ส่งเข้าโกดังของฝ่ายตน และให้จดว่าจ่ายแก่ตราของตน กระดาษแต่ละแผ่นมีตราเดียว

    วงสภาจะฟังทูตตอนสาย ทางจากลานประตูล่างขึ้นไปถึงลานวงสภามีบันไดสายเดียว หัวเลี้ยวช่วงหนึ่งกว้างพอให้เดินได้ทีละคน ธรรมเนียมของวงสภาว่าเรื่องไหนขึ้นถึงวงก่อน ได้อ่านก่อน ตั้งแต่ระฆังเช้ายังไม่ดัง ทูตทั้งสองยืนอยู่ที่ตีนบันไดคนละข้าง ไม่มีฝ่ายไหนยอมก้าวขึ้นขั้นแรกตามหลังอีกฝ่าย

    คนเฝ้าประตูล่างเฝ้ามาทั้งคืน ตาแดงก่ำ เขายื่นตะเกียงมือให้{name} เพราะ{name}ยืนใกล้ที่สุด บอกว่าหัวเลี้ยวมืด ต้องมีคนถือไฟนำขึ้นไป และคนนั้นไม่ใช่เขา แล้วเขาก็นั่งลงหลับบนม้านั่งตรงนั้นเลย
  choices:
    - id: walk_them_side_by_side
      label: บอกทูตทั้งสองว่าหัวเลี้ยวนั้นต้องเดินตะแคงขึ้นไปพร้อมกัน ไม่มีใครก่อนใคร
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}เดินถอยหลังนำขึ้นไป ถือตะเกียงไว้ระดับอก ถึงหัวเลี้ยว นายทหารกับหญิงเสมียนหันข้างเข้าหากัน ไหล่ชนไหล่ ขยับทีละขั้นเหมือนคนสองคนยกหีบใบเดียวกัน ตราขาวกับตราเทากระทบกันดังกริ๊กทุกขั้น ไม่มีฝ่ายไหนถอย ไม่มีฝ่ายไหนแซง

          ทั้งสองก้าวเข้าลานวงสภาพร้อมกันพอดี บรูดา ตระกูลสิ่วยาว ให้เสมียนของวงสองคนอ่านกระดาษสองแผ่นพร้อมกัน เสียงอ่านทับกันจนฟังไม่ออกสักแผ่น คนแคระรอบลานหัวเราะกันลั่น บรูดาเคาะค้อนลงหินครั้งเดียว บอกว่าถ่านจะลงเขาไปที่ลานถ่านเหมือนทุกปี ใครจะเอาไปจากที่นั่นเป็นเรื่องของข้างล่าง
        effects: { stats: { CHA: 1 }, reputation: { dwarf_council: 1 }, flags: [walked_the_two_seals_up_together] }
      failure:
        text: |
          ถึงหัวเลี้ยว ด้ามกระบี่ของนายทหารเกี่ยวโซ่ตาชั่งของหญิงเสมียน ทั้งสองดึงกันคนละทาง กระดาษสองแผ่นหลุดมือ ปลิวลงช่องบันไดไปพร้อมกัน {name}วิ่งลงไปเก็บ เจอที่ขั้นล่างสุด แผ่นหนึ่งมีรอยรองเท้าเปื้อนฝุ่นถ่าน อีกแผ่นมีสองรอย

          วงสภาอ่านกระดาษทั้งสองแผ่นตอนบ่าย ทูตทั้งสองยืนห่างกันคนละขอบลาน เสมียนของวงจดลงแผ่นชนวนว่ากระดาษสองแผ่นมาถึงพร้อมรอยรองเท้าสามรอย
        effects: { reputation: { crown: -1 }, flags: [dropped_both_seals_down_the_stair] }
    - id: carry_both_papers
      label: ขอกระดาษทั้งสองแผ่น ถือขึ้นไปเอง ให้ทูตตามมาเมื่อตกลงกันได้
      text: |
        นายทหารไม่ยอมให้ หญิงเสมียนยื่นให้ก่อน เขาเห็นนางยื่นก็รีบยื่นตาม {name}ขึ้นบันไดคนเดียว ถึงลานวงสภาตอนเสมียนของวงกำลังจุดตะเกียงดวงสุดท้าย กระดาษสองแผ่นวางลงบนหินหน้ากำแพงหนี้พร้อมกัน จากมือของคนคนเดียว

        ทูตทั้งสองขึ้นมาถึงตอนวงสภาอ่านจบแล้ว ครึ่งเช้าหายไปกับการเถียงกันที่หัวเลี้ยวว่าใครควรขึ้นก่อน เสมียนของวงจดลงแผ่นชนวนว่ากระดาษสองแผ่นนี้มาถึงด้วยมือของ{name} ไม่ได้จดว่ามาจากตราไหน
      effects: { reputation: { dwarf_council: 1, crown: -1 }, flags: [carried_both_seal_papers_up] }
    - id: first_on_the_step
      label: นำคนที่นั่งอยู่บนขั้นแรกมาตั้งแต่ก่อนสางขึ้นไปก่อน
      text: |
        คนที่นั่งอยู่บนขั้นแรกคือหญิงเสมียน นางนั่งแกะไข่ต้มกินมาตั้งแต่ก่อนสาง เปลือกไข่กองอยู่ข้างเท้า นายทหารยืนมาทั้งคืนเพราะไม่อยากให้ใครเห็นว่านั่ง {name}ชูตะเกียงนำนางขึ้นไป นายทหารเดินตามหลังห่างสามขั้น นับขั้นด้วยเสียงกระซิบ

        วงสภาอ่านกระดาษตราเทาก่อน แล้วอ่านกระดาษตราขาว ทูตทั้งสองได้คำตอบเดียวกัน ถ่านจะลงเขาไปที่ลานถ่านเหมือนทุกปี ตอนเย็นหญิงเสมียนแวะที่ตีนบันไดก่อนขึ้นรถไฟ วางไข่ต้มไว้บนม้านั่งให้{name}หนึ่งฟอง ยังอุ่น
      effects: { flags: [led_the_grey_seal_up_first] }
    - id: read_the_debt_heading
      label: พาทูตทั้งสองขึ้นไปยืนหน้ากำแพงหนี้ก่อนวงสภาเปิด แล้วอ่านบรรทัดหัวให้ฟัง
      requires: { flag: race_dwarf }
      text: |
        บรรทัดหัวของกำแพงหนี้สลักตัวใหญ่กว่าบรรทัดอื่น เป็นอักษรคนแคระ ทูตทั้งสองอ่านไม่ออก {name}อ่านให้ฟังทีละคำ หนี้นี้ติดค้างแก่บัลลังก์อาร์เวล ไม่มีชื่อคน ไม่มีตราสีไหน

        นายทหารถามว่าแปลว่าอะไร หญิงเสมียนตอบก่อน{name} ว่าแปลว่าถ่านเป็นของเก้าอี้ แล้วนางก็หัวเราะ เสียงหัวเราะแบบคนที่นั่งรถไฟมาสามวันเพื่อมาได้ยินเรื่องนี้ วงสภาจดคำอ่านของ{name}ลงแผ่นชนวน ส่งลงเขาไปพร้อมทูตทั้งสองคน
      effects: { stats: { WIS: 1 }, reputation: { dwarf_council: 1 }, flags: [read_the_debt_heading_to_the_envoys] }

# ---------- ฮอร์ดุน ค ค้อนของตระกูล (คนแคระเท่านั้น) ----------
- id: adult.realm_hordun_clan_hammer
  stage: adult
  weight: 22
  scene: clan_hall
  time: night
  when:
    age: [22, 64]
    location_tag: hordun
    year: [302, 410]
    flags: [race_dwarf]
  text: |
    ค้อนของ{surname}แขวนอยู่บนหมุดสองตัวเหนือเตาในห้องโถงของตระกูล ด้ามดำเป็นมันจากมือหลายชั่วคน พรุ่งนี้วงสภาจะลงเสียงเรื่องที่ทูตของอาร์เวลขึ้นมาขอ ให้ช่างหินสลักงวดเพิ่มใต้หนี้อีกหนึ่งบรรทัด เป็นค่าถ่านที่ขบวนมาช้าเมื่อหน้าหนาวก่อน ตระกูลละหนึ่งค้อน เคาะหินซ้ายคือประตูปิด ยอมให้สลัก จ่ายต่อจนหมด แล้วเอาเหมืองคืนแบบที่ไม่มีใครเถียงได้ นั่นทางของบรูดา เคาะหินขวาคือค้อน ไม่ยอมให้สลัก และเลิกส่งถ่านในราคาที่อาร์เวลตั้ง นั่นทางของมาร์โดก

    คืนนี้คนในตระกูลที่อายุครบมานั่งเต็มห้องโถง ทีละคนลุกไปแตะด้ามค้อนแล้วพูดคำเดียว ประตู หรือ ค้อน ผู้เฒ่าของตระกูลนับด้วยการขีดเล็บลงโต๊ะ ซ้ายทีขวาที จนคนสุดท้ายนั่งลง สองแถวยาวเท่ากัน ผู้เฒ่าลุกขึ้นด้วยเข่าข้างเดียว อีกข้างงอไม่ได้มาตั้งแต่หน้าหนาวก่อน ยกค้อนลงจากหมุด ยื่นให้{name} คนเดียวในห้องที่ทั้งคืนยังไม่ได้ลุกไปแตะด้าม คนแบกค้อนขึ้นวงเป็นคนเคาะ แกว่า เคาะตามที่ห้องนี้พูด แล้วห้องนี้ก็พูดมาสองอย่าง

    คนทยอยกลับจนห้องว่าง {name}ยังถือค้อนอยู่ข้างเตา บนหินชื่อของตระกูล ใต้ชื่อเด็กคนล่าสุด มีคนเอาดินสอเขียนไว้ ตัวเล็กมาก เปิดชั้นยี่สิบสาม รอยดินสอดำสด ไม่มีฝุ่นเกาะ คนเขียนนั่งอยู่ในห้องนี้เมื่อครู่
  choices:
    - id: knock_the_door_stone
      label: ขึ้นวงสภา เคาะหินซ้าย ประตูปิด
      text: |
        หินซ้ายเสียงทุ้มกว่าหินขวา {name}เคาะครั้งเดียวเต็มแขน เสมียนของวงขีดดินขาวลงช่องประตูหลังชื่อ{surname} บรูดายืนอยู่ข้างหินซ้ายตลอดการลงเสียง ไม่ได้หันมาดูหน้าคนเคาะสักตระกูล

        ค่ำนั้นกลับถึงห้องโถง รอยดินสอบนหินชื่อโดนถูออกไปแล้ว เหลือเป็นปื้นเทาจางๆ ใต้ชื่อเด็ก กว้างเท่านิ้วโป้งหนึ่งนิ้ว
      effects: { alignment: { law: 1 }, reputation: { crown: 1 }, flags: [knocked_the_door_stone_for_the_clan] }
    - id: knock_the_hammer_stone
      label: ขึ้นวงสภา เคาะหินขวา ค้อน
      text: |
        {name}เคาะหินขวาแรงจนข้อมือชา เสียงสะท้อนกลับมาจากกำแพงหนี้ ที่ขอบลาน คนชั้นโรงหลอมกลุ่มหนึ่งยกกำปั้นขึ้นพร้อมกัน มาร์โดกยืนหน้าสุด ผ้ากันไฟยังผูกเอว เขาไม่ได้ยกกำปั้น เขานับ ปากขยับตามเสียงค้อนของทุกตระกูล

        ขากลับ ผู้เฒ่าของตระกูลรออยู่ที่ประตูห้องโถง รับค้อนคืนไปแขวนบนหมุด ถามคำเดียวว่าเสียงดังไหม {name}บอกว่าดัง แกบอกว่าดีแล้ว ค้อนของตระกูลนี้ไม่ได้ดังมาหลายหน้าหนาว
      effects: { stats: { STR: 1 }, reputation: { dwarf_council: 1, crown: -1 }, flags: [knocked_the_hammer_stone_for_the_clan] }
    - id: knock_the_rim
      label: ขึ้นวงสภา เคาะขอบหินระหว่างสองก้อน ห้องโถงพูดมาสองอย่าง ค้อนก็จะพูดสองอย่าง
      text: |
        ขอบระหว่างหินสองก้อนเป็นเนื้อเดียวกับพื้นลาน เสียงที่ออกมาแห้งและสั้น ไม่เหมือนเสียงไหนที่ลานนี้เคยได้ยิน เสมียนของวงยกแท่งดินขาวค้าง หาช่องจะขีดไม่เจอ สุดท้ายเขียนไว้ข้างชื่อ{surname}คำเดียว ขอบ

        ตระกูลที่เคาะต่อจาก{name}เป็นตระกูลเล็ก ผู้เฒ่าของตระกูลนั้นเงื้อค้อนค้างอยู่เหนือหินขวา แล้วลดลงมาเคาะขอบตาม ก่อนวงสภาปิด ขอบหินมีรอยค้อนใหม่สามรอย
      effects: { stats: { WIS: 1 }, flags: [knocked_the_rim_between_the_stones] }

# ---------- ฮอร์ดุน ง สลักทองแดงอ่อน (ใบสั่งแขนกลของราชนาวี) ----------
- id: adult.realm_hordun_soft_pins
  stage: adult
  weight: 22
  scene: workshop
  time: night
  when:
    age: [22, 64]
    location_tag: hordun
    year: [302, 364]
  text: |
    คืนก่อนวันส่งของทุกเดือน โรงช่างบนชั้นโรงหลอมจ้างทุกคนที่มือนิ่ง ใบสั่งแขนกลของราชนาวีติดอยู่บนผนังหลังโต๊ะยาว ราคาต่อชิ้นตามที่อาร์เวลตั้ง แขนทุกแขนมีป้ายผูกข้อมือ เขียนชื่อคนที่จะใส่ กับความยาวจากศอกลงไปเป็นคืบ {name}ได้โต๊ะริมสุด งานคือใส่สลักข้อศอก ขันให้แน่น แล้วส่งต่อ

    เกือบเที่ยงคืน มาร์โดก ตระกูลลิ่มเหล็ก นายเตาหนุ่มของชั้นนี้ เดินมาตามโต๊ะพร้อมถ้วยดินใบเล็ก ในถ้วยมีสลักข้อศอกหน้าตาเหมือนสลักในลังทุกอย่าง แต่หล่อจากทองแดงอ่อน ใช้ได้หนึ่งฤดู แล้วข้อศอกจะหลุด เขาวางถ้วยไว้ที่มุมโต๊ะของ{name} บอกเสียงเบาว่าแขนที่สิบทุกแขน แขนที่พังต้องขึ้นเขากลับมาซ่อม ค่าซ่อมไม่อยู่ในใบสั่ง ราคาซ่อมคนบนเขาตั้งเอง

    แขนที่วางอยู่ตรงหน้า{name}เป็นแขนที่สิบของคืนนี้ ป้ายที่ข้อมือเขียนว่าแขนซ้าย นายท้ายเรือ ยาวสองคืบ ใต้นั้นมีอีกบรรทัดด้วยลายมือคนละคน ใช้จับคันหางเสือ
  choices:
    - id: fit_the_soft_pin
      label: ใส่สลักทองแดงอ่อนในแขนที่สิบ ตามที่มาร์โดกขอ
      text: |
        สลักทองแดงลงรูพอดีเหมือนสลักจริง ขันแล้วแน่นเหมือนกัน มาร์โดกวางเหรียญไว้ข้างถ้วยหนึ่งเหรียญต่อสลักหนึ่งตัว ก่อนสาง ข้างถ้วยของ{name}มีเหรียญสามเหรียญ

        ปลายฤดูมีลังไม้ขึ้นเขามากับรถไฟ ข้างในเป็นแขนซ้ายข้างหนึ่ง ข้อศอกหลวมห้อยลงเป็นมุมแปลกๆ ป้ายเดิมยังผูกอยู่ที่ข้อมือ มาร์โดกเขียนราคาซ่อมด้วยดินขาวลงบนฝาลัง ตัวเลขสูงกว่าราคาแขนทั้งแขน
      effects: { gold: 3, alignment: { moral: -1 }, flags: [fitted_the_soft_pins] }
    - id: send_back_the_cup
      label: ส่งถ้วยคืนให้มาร์โดก แล้วใส่สลักจากลังเหมือนแขนอื่น
      text: |
        มาร์โดกรับถ้วยคืนไปโดยไม่เถียง เขาไม่จำเป็นต้องเถียง เขาวางถ้วยไว้ที่โต๊ะถัดไป คนที่นั่งโต๊ะนั้นเป็นเด็กหนุ่มที่ยังไม่ได้ค่าแรงมาตั้งแต่ต้นฤดู {name}ยังขันสลักตัวต่อไปไม่เสร็จ ถ้วยก็เลื่อนไปอีกสองโต๊ะแล้ว

        ก่อนสางคนคุมโต๊ะเดินเก็บแขนลงลัง แขนที่ผ่านมือ{name}มีสลักจริงทุกแขน {name}นับได้ แขนที่ผ่านโต๊ะอื่น {name}นับไม่ได้
      effects: { alignment: { moral: 1 }, flags: [sent_back_mardoks_cup] }
    - id: swap_the_cup
      label: รอมาร์โดกหันหลัง เทสลักทองแดงทั้งถ้วยลงรางขี้เถ้า แล้วตักสลักจริงจากลังใส่แทน
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          ตอนมาร์โดกเดินไปอีกฟากโรง {name}เทสลักทองแดงลงรางขี้เถ้าใต้โต๊ะ ขี้เถ้ากลบมิดในพริบตา ตักสลักจริงจากลังใส่ถ้วยจนพูนเท่าเดิม ถ้วยใบนั้นเลื่อนไปตามโต๊ะทั้งคืน ทุกโต๊ะหยิบสลักจากถ้วยไปใส่แขนที่สิบ ไม่มีสลักอ่อนในถ้วยแม้แต่ตัวเดียว

          เดือนต่อมามาร์โดกนั่งนับสลักในลังของโรงช่าง นับสองรอบ ขาดไปสี่สิบตัว เขาไม่ได้ถามใคร เขาไปนั่งยองๆ หน้ารางขี้เถ้า คุ้ยหาอยู่ครึ่งคืน
        effects: { stats: { DEX: 1 }, flags: [swapped_mardoks_soft_pins] }
      failure:
        text: |
          ถ้วยดินลื่นหลุดมือ สลักทองแดงกระจายเต็มพื้น เสียงดังเหมือนเหรียญหล่น คนทั้งโรงหันมา มาร์โดกเดินกลับมาช้าๆ ก้มเก็บสลักทีละตัวเอง ไม่ให้ใครช่วย แล้วบอกคนคุมโต๊ะว่าโต๊ะริมสุดคืนนี้ว่างแล้ว

          {name}ขึ้นบันไดออกจากชั้นโรงหลอมโดยไม่ได้ค่าแรงของคืนนั้น เดินไปยังไม่ถึงขั้นที่สิบ เสียงขันสลักก็ดังขึ้นอีกครั้งข้างล่าง
        effects: { flags: [dropped_mardoks_cup] }
    - id: show_the_nail_mark
      label: บอกมาร์โดกว่าช่างของราชนาวีจะรู้ตั้งแต่ถอดข้อศอกแรก
      requires: { any_flags: [job_artificer, job_smith] }
      text: |
        {name}หยิบสลักทองแดงขึ้นมาตัวหนึ่ง เอาเล็บกดลงที่หัวสลัก เล็บทิ้งรอยไว้ สลักจริงไม่มีวันมีรอยเล็บ ช่างที่ท่าเรือถอดแขนแรกก็จะเห็น แล้วใบสั่งเดือนหน้าจะไปลงที่โรงหลอมของคาร์ดิน ไม่ขึ้นเขามาอีก

        มาร์โดกกดเล็บลงสลักอีกตัวด้วยมือตัวเอง แล้วเทถ้วยทั้งถ้วยลงเบ้าหลอม เขาไม่ได้ขอบใจ เขาถามว่าทองแดงอ่อนแบบไหนที่เล็บกดไม่เข้า
      effects: { stats: { INT: 1 }, flags: [showed_mardok_the_nail_mark] }

# ---------- ฮอร์ดุน จ โซ่ที่ทางสลับราง ----------
- id: adult.realm_hordun_chained_switch
  stage: adult
  weight: 22
  scene: road
  when:
    age: [22, 64]
    location_tag: hordun
    year: [302, 410]
  text: |
    รางจากทุนดาร์ลงตลาดตีนเขามีสายเดียว ขาลงตู้เต็มถ่าน ขาขึ้นตู้เต็มข้าว เกลือ และน้ำมันตะเกียง หัวรถคันเดียวกันลากทั้งสองทาง บนเขาจะได้กินอะไรขึ้นอยู่กับว่าข้างล่างได้ถ่านหรือเปล่า

    สัปดาห์นี้คนชั้นโรงหลอมสี่สิบกว่าคนนั่งขวางรางอยู่ที่ทางสลับรางเหนือตลาดตีนเขา คันโยกของทางสลับมีโซ่พันสามรอบ คล้องกุญแจดอกเดียว มาร์โดก ตระกูลลิ่มเหล็ก นั่งบนกระสอบถ่านข้างคันโยก ลูกกุญแจห้อยคอด้วยเชือกหนัง ถ่านไม่ลงเขาสักก้อนในราคาที่อาร์เวลตั้ง ข้อนี้เขาบอกทุกคนที่เดินผ่าน บอกด้วยคำเดิมทุกครั้ง

    วันที่สาม ขบวนขาลงยังจอดเต็มถ่านอยู่เหนือทางสลับ ข้าวบนชานรถไฟข้างล่างเริ่มชื้น ขึ้นมาไม่ได้เพราะไม่มีหัวรถลงไปรับ ริมรางมีชายคนแคระร่างผอมนั่งอยู่ข้างหม้อดินใบใหญ่ที่ว่างเปล่า บรูกา ตระกูลตะเกียงต่ำ คนที่พูดแทนตระกูลที่จนที่สุดบนถนนวน หม้อใบนั้นเป็นหม้อข้าวต้มของลานประตูล่าง สามวันแล้วที่ไม่ได้ตั้งไฟ
  choices:
    - id: sit_on_the_rail
      label: นั่งลงบนรางกับคนชั้นโรงหลอม
      text: |
        หมอนรางเย็นจนต้องพับเสื้อคลุมรองนั่ง คนข้างๆ ส่งถ่านอุ่นห่อผ้ามาให้กำไว้คนละก้อน วันที่ห้านายราคาขึ้นมาถึงทางสลับเอง ยืนอ่านราคาใหม่ เพิ่มขึ้นตู้ละหนึ่งเหรียญ มาร์โดกฟังจนจบ แล้วบอกราคาของเขาซ้ำ ไม่ขาดไม่เกิน

        วันที่หก คนจากถนนวนลงมาแบกกระสอบข้าวขึ้นเขาด้วยหลังของตัวเอง เดินแถวยาวผ่านข้างรางตรงที่{name}นั่ง คนในแถวนั้นไม่หันมาดูคนนั่ง และไม่ด่าสักคำ
      effects: { stats: { CON: 1 }, reputation: { crown: -1 }, flags: [sat_on_the_chained_switch] }
    - id: carry_the_grain_up
      label: ลงไปที่ชานรถไฟข้างล่าง แบกกระสอบข้าวเดินขึ้นเขาตามราง
      check: { stat: STR, dc: 13 }
      success:
        text: |
          คนนั่งขวางรางหลีกทางให้คนแบกข้าวทุกคน พวกเขาขวางถ่าน ไม่ได้ขวางข้าว {name}แบกกระสอบแรกขึ้นถึงลานประตูล่างตอนเย็น บ่าเป็นรอยเชือก ขาสั่นจนต้องนั่งลงบนกระสอบที่เพิ่งวาง กว่าจะลุกได้ก็มีคนอีกสิบกว่าคนแบกตามขึ้นมา

          ค่ำนั้นบรูกาตั้งไฟใต้หม้อดินใบใหญ่เป็นครั้งแรกในรอบสี่วัน ข้าวต้มหม้อนั้นเค็มน้อยไป เกลือยังค้างอยู่ข้างล่าง
        effects: { stats: { STR: 1 }, reputation: { dwarf_council: 1 }, flags: [carried_grain_past_the_chain] }
      failure:
        text: |
          ครึ่งทางขึ้นเขา ข้อเท้าพลิกบนหินกรวดข้างราง กระสอบหล่นแตกที่มุม ข้าวไหลลงซอกหิน {name}กอบคืนได้ไม่ถึงครึ่ง ข้อเท้าบวมเป่งจนต้องเดินกะเผลกกลับลงไปทางเดิม

          ข้าวที่หกอยู่ในซอกหินข้างราง นกภูเขามาจิกกินจนสาง
        effects: { hp: -2, flags: [spilled_grain_on_the_rail_path] }
    - id: send_the_engine_down_alone
      label: ขอให้มาร์โดกปลดตู้ถ่านออก ปล่อยหัวรถลงไปตัวเปล่าแล้วลากตู้ข้าวขึ้นมา
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          มาร์โดกหัวเราะดังจนคนบนรางหันมาดู ถ่านอยู่บนเขา หัวรถลงไปตัวเปล่า ข้าวขึ้นมา ราคาของอาร์เวลไม่ได้แตะถ่านสักก้อน เขาไขกุญแจเองโดยไม่ถอดเชือกออกจากคอ ต้องก้มตัวลงจนหน้าเกือบชนคันโยก ปลดโซ่ให้คันโยกขยับได้ครั้งเดียว แล้วคล้องกลับ

          หัวรถลงไปตอนบ่าย ขึ้นมาตอนค่ำพร้อมตู้ข้าวสี่ตู้ ตู้ถ่านยังจอดเรียงอยู่เหนือทางสลับ หิมะเริ่มเกาะหลังคาตู้ตั้งแต่คืนนั้น
        effects: { stats: { CHA: 1 }, reputation: { dwarf_council: 1 }, flags: [sent_the_engine_down_alone] }
      failure:
        text: |
          มาร์โดกฟังจนจบ บอกว่าหัวรถที่ลงไปแล้ว จะได้ขึ้นมาอีกหรือเปล่าก็แล้วแต่ข้างล่าง แล้วหันไปบอกคำเดิมกับคนถัดไปที่เดินผ่าน {name}ได้ยินคำเดิมนั้นอีกเก้าครั้งก่อนตะวันตก

          ข้าวบนชานข้างล่างขึ้นราในวันที่หก
        effects: { flags: [mardok_kept_the_engine] }
    - id: tell_the_price_master
      label: ลงไปบอกนายราคาว่าโซ่คล้องกุญแจดอกเดียว และกุญแจห้อยอยู่ที่คอใคร
      text: |
        นายราคาจดลงสมุดเล่มหนา ไม่ถามชื่อ{name} สองคืนต่อมามีคนอาร์เวลห้าคนขึ้นมาถึงทางสลับพร้อมคีมตัดเหล็ก ตัดโซ่ตอนคนนั่งรางหลับ ขบวนถ่านแล่นลงเขาก่อนสาง ล้อดังผ่านหัวคนที่นอนข้างรางไปทีละตู้

        มาร์โดกตื่นมาพร้อมกุญแจที่ยังห้อยคอ ไม่มีโซ่ให้ไขแล้ว ไม่กี่วันคนที่ลานถ่านก็รู้ว่าใครลงไปหานายราคาตอนเย็นวันนั้น เพราะนายราคาจ่ายค่าบอกด้วยเหรียญใหม่ ยังเงาทั้งสองหน้า
      effects: { gold: 2, reputation: { crown: 1, dwarf_council: -1 }, flags: [told_the_price_master_about_the_chain] }

# ---------- ฮอร์ดุน ฉ ดินสอบนผนังลานประตูล่าง (ไม่มีหนี้ ไม่กันปี) ----------
- id: adult.realm_hordun_pencil_walls
  stage: adult
  weight: 22
  when:
    age: [22, 64]
    location_tag: hordun
  text: |
    เช้านี้ผนังหินทุกด้านของลานประตูล่างมีตัวหนังสือดินสอ ตัวเล็กเท่ากันทุกแห่ง เขียนไว้ระดับเอว ตรงที่คนยืนต่อแถวพิงหลังได้พอดี เปิดชั้นยี่สิบสาม บนเสาประตู บนขอบบ่อน้ำ บนหลังม้านั่งหน้าร้านขายหัวค้อน คนนับได้สามสิบกว่าแห่งก่อนแถวข้าวต้มจะยาวถึงบ่อน้ำ

    แถวข้าวต้มเป็นของบรูกา ตระกูลตะเกียงต่ำ หม้อดินใบใหญ่ของเขาตั้งอยู่มุมลานทุกเช้า ใครถือชามมาก็ได้หนึ่งทัพพี คนแคระจากตระกูลที่จนที่สุดบนถนนวน คนนอกที่ห้องเช่าไม่มีเตา คนงานที่เพิ่งขึ้นจากกะดึกและยังไม่ได้นอน บรูกาตักทัพพีเท่ากันให้ทุกคน นิ้วกลางข้างขวาของเขาดำเป็นปื้นถึงข้อแรก

    สายๆ คนของวงสภาลงมาหกคน ถือถังน้ำกับแปรงขนหมู บรูดาไม่ได้ลงมาเอง แต่ทั้งหกคนบอกทุกคนในแถวว่าบรูดาส่งมา พวกเขาเริ่มขัดจากเสาประตู ไล่มาตามผนัง ใกล้แถวข้าวต้มเข้ามาทุกที ตัวหนังสือบนผนังหลัง{name}เป็นแห่งสุดท้ายที่ยังไม่โดนขัด
  choices:
    - id: take_a_brush
      label: รับแปรงจากคนของวงสภามาขัดเองหนึ่งอัน
      text: |
        รอยดินสอบนหินออกง่ายกว่าที่คิด ขัดสามทีก็เหลือแค่ปื้นเทา คนของวงสภาจ่ายค่าแรงเป็นเหรียญทองแดงหนึ่งเหรียญ {name}ถือชามเข้าแถวรอบบ่าย บรูกาตักให้หนึ่งทัพพีเท่าทุกคน ไม่ได้ถามว่าเช้านี้ถือแปรงของใคร

        เช้าวันต่อมาตัวหนังสือกลับมาครบทุกแห่ง สูงขึ้นจากเดิมหนึ่งคืบ เลยระดับที่แปรงขนหมูด้ามสั้นจะเอื้อมถึง
      effects: { gold: 1, reputation: { dwarf_council: 1 }, flags: [scrubbed_the_pencil_walls] }
    - id: stand_in_front
      label: ยืนพิงผนังทับตัวหนังสือแห่งสุดท้ายไว้ ไม่ขยับจนแถวข้าวต้มหมด
      text: |
        คนของวงสภาขัดมาถึงไหล่ซ้ายของ{name} แล้วข้ามไปขัดต่อทางไหล่ขวา ขัดรอบตัวจนผนังสองข้างขาวสะอาด ไม่มีใครขอให้{name}หลีก เพราะไม่มีใครอยากเป็นคนขอ แถวข้าวต้มหมดตอนเที่ยง {name}ยังยืนอยู่ หม้อของบรูกาเหลือแค่ก้นหม้อ เขาขูดใส่ชามมาให้ถึงที่ยืน

        พอ{name}ขยับออก ผนังตรงนั้นมีตัวหนังสือดินสออยู่กลางกรอบหินสีหม่นรูปไหล่คน ล้อมด้วยหินที่โดนขัดจนขาว แห่งเดียวในลานประตูล่าง คนที่เดินผ่านตอนบ่ายหยุดอ่านกันทุกคน
      effects: { reputation: { dwarf_council: -1 }, flags: [kept_the_last_pencil_line] }
    - id: ask_bruga_why
      label: ถามบรูกาตอนเขาล้างหม้อ ว่าทำไมต้องเป็นชั้นยี่สิบสาม
      text: |
        บรูกาขัดหม้อด้วยทรายกับน้ำเย็น ตอบโดยไม่เงยหน้า ทุกชั้นที่ขุดได้บนเขานี้มีหินชื่อของตระกูลใดตระกูลหนึ่งตั้งอยู่ที่ปากอุโมงค์ ตระกูลตะเกียงต่ำได้ชั้นที่ไม่มีใครเอา ชั้นที่น้ำซึม ชั้นที่หินผุ ชั้นยี่สิบสามเป็นชั้นเดียวที่ปากอุโมงค์ไม่มีหินชื่อของใคร ตั้งแต่ก่อปิด ไม่มีตระกูลไหนได้ลงไปวางหินของตัวเอง

        {name}ถามว่าข้างในมีอะไร บรูกาคว่ำหม้อลงตากบนหิน บอกว่าไม่มีใครรู้ เขาก็ไม่รู้ แต่ของที่ไม่มีใครรู้ อย่างน้อยก็ยังไม่มีเจ้าของ
      effects: { stats: { WIS: 1 }, flags: [heard_bruga_on_the_twenty_third] }
    - id: tell_bruga_about_the_lead
      label: บอกบรูกาเรื่องรอยต่อตะกั่วที่มีคนขูดออกที่กำแพงชั้นยี่สิบสาม
      requires: { any_flags: [kept_the_scraped_lead, brought_the_lead_to_the_hammer, showed_the_scraped_lead, lead_spilled_at_the_council] }
      text: |
        ทัพพีในมือบรูกาหยุดกลางหม้อ เขาถามว่ารอยต่อเส้นไหน {name}บอกว่าเส้นล่างสุด เขาถามว่ายาวเท่าไร {name}กางแขนให้ดู เขาตักข้าวต้มให้คนถัดไปจนหมดแถว แล้วเดินไปที่เสาประตู เอาแขนเสื้อถูตัวหนังสือดินสอบนเสาออกด้วยตัวเอง

        เช้าวันต่อมาผนังทุกด้านของลานประตูล่างไม่มีตัวหนังสือใหม่ หม้อของบรูกาตั้งอยู่มุมลานเหมือนทุกเช้า นิ้วกลางข้างขวาของเขาสะอาด
      effects: { flags: [told_bruga_about_the_scraped_lead] }

# ---------- ไอเลธ ก หลักเขตที่ย้ายตอนกลางคืน (คลังต่ำ) ----------
- id: adult.realm_ileth_moved_stake
  stage: adult
  weight: 22
  scene: road
  when:
    age: [22, 64]
    location_tag: ileth
    world: { treasury: [-8, -2] }
  text: |
    หลักเขตตัดไม้เป็นเสาไม้สีซีดสูงระดับอก หัวเสามีตราเผาของข้าหลวงป่าไม้ ปักเรียงเป็นแนวยาวผ่านป่าทางใต้ของหอนับดาว คนแถวนี้จำหลักแต่ละต้นได้จากตะไคร่ด้านเหนือ หลักที่โค้งลำธารมีตะไคร่หนาเป็นแผ่นเหมือนผ้าห่ม ต้นนั้นปักอยู่ตรงนั้นมาตั้งแต่ก่อนเด็กส่วนใหญ่ในลานโคนต้นจะเกิด

    เช้านี้หลักต้นนั้นปักอยู่ลึกเข้ามาในป่าสี่สิบก้าว ดินรอบโคนยังร่วน ตะไคร่ด้านเหนือหายไปทั้งแผ่น หลุมเดิมที่โค้งลำธารมีน้ำค้างขังเต็ม กบตัวหนึ่งนั่งอยู่ในนั้น ระหว่างหลุมเดิมกับหลักใหม่มีต้นไม้แก่สามต้น

    ข่าวขึ้นไปถึงกิ่งตอนสาย ตอนบ่ายนาเวธพาคนกิ่งล่างห้าหกคนลงมายืนดู นางพูดเสียงดังให้ทุกคนได้ยินว่าคืนนี้หลักจะกลับไปอยู่ในหลุมเดิม ซูเรล ข้าหลวงป่าไม้ เดินมาจากลานโคนต้น สมุดใบอนุญาตหนีบอยู่ใต้แขน เขาเปิดหน้าที่คั่นไว้ บอกเป็นภาษาอาร์เวลว่าหลักปักอยู่ตรงที่สมุดบอก หน้านี้มากับถุงจดหมายเที่ยวล่าสุดจากเวนทราส {name}ยืนอยู่ระหว่างสองกลุ่ม เพราะ{name}เป็นคนเจอหลักนี้ก่อนใคร
  choices:
    - id: carry_the_stake_back
      label: ลงมาตอนดึกกับคนกิ่งล่าง ถอนหลักกลับไปปักในหลุมเดิม
      text: |
        หลักใหม่ถอนง่ายเพราะดินยังไม่แน่น {name}กับคนกิ่งล่างสามคนหามกลับไปถึงโค้งลำธารก่อนเที่ยงคืน กบในหลุมกระโดดหนีตอนปลายเสาจุ่มลงน้ำ นาเวธเหยียบดินรอบโคนให้แน่นด้วยส้นเท้า เดินวนสามรอบ

        สิบวันต่อมามีหลักต้นใหม่ปักอยู่ตรงที่สี่สิบก้าวนั้น ตราเผายังใหม่ ส่วนหลักต้นเดิมในหลุมริมลำธาร คนงานค่ายปล่อยไว้อย่างนั้น ตั้งแต่นั้นโค้งลำธารมีหลักเขตสองต้นห่างกันสี่สิบก้าว ฤดูล้มไม้ปีนั้น คนตัดไม้เลือกเชื่อต้นที่อยู่ลึกกว่า
      effects: { alignment: { law: -1 }, reputation: { star_hall: 1, crown: -1 }, flags: [carried_the_stake_back_by_night] }
    - id: read_surels_page
      label: ขอซูเรลอ่านหน้านั้นเอง
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ซูเรลยื่นสมุดให้โดยไม่ปล่อยมือจากสันสมุด หน้านั้นเขียนด้วยลายมือเสมียนเวนทราส บอกระยะเป็นก้าว นับจากลำธาร ท้ายหน้ามีอีกบรรทัดหนึ่ง หมึกคนละสี ลายมือคนละคน ตัวเล็กกว่า ไม่เกินต้นที่สามนับจากลำธาร

          ต้นที่สามจากลำธารคือต้นที่ยืนอยู่หน้าหลักใหม่พอดี {name}เงยหน้าจากสมุด ซูเรลดึงสมุดกลับไปหนีบใต้แขนแล้ว เขาบอกนาเวธเป็นภาษาอาร์เวลว่าหลักจะอยู่ตรงนี้ แล้วเดินกลับลานโคนต้นโดยไม่หันมา
        effects: { stats: { INT: 1 }, flags: [read_the_line_under_surels_page] }
      failure:
        text: |
          ซูเรลปิดสมุดก่อน{name}จะอ่านจบบรรทัดแรก ปลายนิ้วของ{name}ยังคาอยู่ในสมุด สันสมุดหนีบนิ้วจนเล็บเขียว เขาขอโทษเป็นภาษาอาร์เวล สำเนียงสุภาพมาก

          คืนนั้นหลักกลับไปอยู่ในหลุมเดิม คนถอนไม่ได้บอกใคร สิบวันต่อมามีหลักต้นใหม่ปักลงตรงที่สี่สิบก้าว
        effects: { hp: -1, flags: [pinched_in_surels_book] }
    - id: put_it_in_the_letter
      label: ปีนขึ้นกิ่งจดหมาย ขอให้ลาเธียใส่หลักต้นนี้ลงในจดหมายประจำปี
      text: |
        ลาเธียให้{name}เล่าทีละอย่าง สี่สิบก้าว ต้นไม้แก่สามต้น ตะไคร่ที่หายไปทั้งแผ่น นางจดลงกระดาษร่างทุกคำ แล้วขีดออกทีละคำจนเหลือบรรทัดเดียว หลักที่โค้งลำธารย้ายเข้ามาสี่สิบก้าว จดหมายประจำปีให้เรื่องหนึ่งได้บรรทัดเดียว นางบอก ปีนี้มีเรื่องที่ต้องใส่สิบเอ็ดเรื่องแล้ว

        ปลายปีกระบอกคำตอบจากเวนทราสกลับมาตามเคย ลาเธียเปิดอ่าน แล้วส่งต่อให้คนคัดคนถัดไปตามธรรมเนียม ประโยคข้างในเป็นประโยคเดิม
      effects: { reputation: { star_hall: 1 }, flags: [put_the_stake_in_the_letter] }
    - id: pace_from_the_old_stream
      label: เดินนับก้าวให้ซูเรลดู ว่าลำธารในสมุดคือลำธารสายไหน
      requires: { any_flags: [job_guide, job_scout] }
      text: |
        ป่าตรงนั้นมีลำธารสองสาย สายใหม่เกิดหลังน้ำหลากเมื่อหน้าฝนก่อน ไหลห่างสายเก่าสี่สิบก้าวพอดี {name}พาซูเรลไปยืนที่สายเก่า ตลิ่งมีหินที่คนสมัยก่อนวางเรียงไว้ข้ามน้ำ ชื่อลำธารในสมุดเป็นชื่อที่คนแถวนี้ใช้เรียกสายนี้มาตลอด สายใหม่ยังไม่มีชื่อ

        ซูเรลนับก้าวตามสมุดจากหินข้ามน้ำ ไปหยุดตรงหลุมเดิมที่มีกบ เขาสั่งคนงานค่ายให้ย้ายหลักกลับเอง ก่อนไปเขาถามชื่อลำธารสายใหม่ {name}บอกว่ายังไม่มี เขาจดลงสมุดว่ายังไม่มีชื่อ
      effects: { stats: { WIS: 1 }, reputation: { star_hall: 1 }, flags: [paced_the_stake_from_the_old_stream] }

# ---------- ไอเลธ ข ทูตคนเดียวสองฉบับ (บัลลังก์ต่ำ) ----------
- id: adult.realm_ileth_envoy_with_two_sleeves
  stage: adult
  weight: 22
  scene: star_hall
  when:
    age: [22, 64]
    location_tag: ileth
    year: [318, 410]
    not_flags: [throne_white, throne_grey]
    world: { throne: [-8, -2] }
  text: |
    ทูตจากเวนทราสเป็นชายร่างกลม เสื้อคลุมขุนนางชั้นล่างซักจนสีตก ในแขนเสื้อซ้ายมีกระดาษตราขาว ในแขนเสื้อขวามีกระดาษตราเทา สองแผ่นขอเรื่องเดียวกัน ให้หอนับดาวอ่านดาวว่าใครควรสวมมงกุฎ แผ่นหนึ่งเขียนว่าดาวน่าจะชี้เจ้าชายฮาลเวริน อีกแผ่นเขียนว่าดาวน่าจะชี้เจ้าหญิงเซลีมาร์ ทางเสมียนส่งเขามาคนเดียวพร้อมสองแผ่น เพราะไม่มีปีกไหนยอมออกค่าเดินทางให้คนที่สอง

    ผู้คุมหอให้อ่านทั้งสองแผ่นให้ฟัง ตาของเขาเหลือเห็นแค่ดวงที่สว่างที่สุดไม่กี่ดวง แต่หูยังดี เขาบอกทูตว่าหอนับดาวนับ ไม่เคยอ่าน ดาวไม่ได้ชี้ใคร ดาวมีกี่ดวงหอก็จดเท่านั้น แล้วให้คนพาทูตลงไปส่งที่ลานโคนต้น

    นั่นเป็นสามสัปดาห์ก่อน ทูตยังไม่กลับ เงินค่าเดินทางหมดไปกับค่าเรือนเช่าตั้งแต่สัปดาห์แรก ตอนนี้เขานอนใต้ชายคาโรงตะกร้า กินข้าวที่คนในลานแบ่งให้ ทุกเช้าเขาขอคนที่เดินผ่านเรื่องเดียว ช่วยเขียนอะไรก็ได้ที่ขึ้นต้นว่า ดาวบอกว่า กลับไปมือเปล่าไม่ได้ เขาว่า ตำแหน่งของเขาจะหายไปกับมือเปล่านั้น เช้านี้เขาขอ{name}
  choices:
    - id: take_him_up_to_count
      label: พาเขาปีนขึ้นชานนับในคืนนับ ให้เห็นเองว่าหอทำอะไร
      text: |
        ทูตปีนบันไดเชือกช้ากว่าคนแก่ที่สุดบนลำต้น หยุดพักทุกกิ่ง ถึงชานชั้นล่างสุดก็เกือบเที่ยงคืน เขานั่งดูคนนับขึงกรอบไม้ไผ่ ฟังเพลงนับที่ฟังไม่ออกสักคำไปจนสาง ตอนลงมาเขาขอตัวเลขของคืนนั้นจากคนนับคนหนึ่ง แล้วเขียนลงกระดาษทั้งสองแผ่น

        กระดาษตราขาวกับกระดาษตราเทากลับเวนทราสไปพร้อมเขา ในแต่ละแผ่นมีคำตอบเดียวกัน เป็นตัวเลขตัวเดียว ไม่มีชื่อใคร
      effects: { reputation: { star_hall: 1 }, flags: [took_the_envoy_up_to_count] }
    - id: write_him_a_reading
      label: เขียนคำอ่านดาวให้เขาหนึ่งหน้า
      text: |
        {name}เขียนให้หนึ่งหน้าเต็ม ดาวดวงใหญ่ทางเหนือ ดาวที่ขึ้นช้ากว่าทุกปี ดาวสองดวงที่อยู่ใกล้กันจนแยกไม่ออก เขียนให้อ่านได้ทั้งสองทาง ไม่ชี้ใคร ทูตอ่านสองรอบ รอบที่สองอ่านออกเสียง แล้วคัดลงกระดาษทั้งสองแผ่นด้วยลายมือของเขาเอง

        เขาออกเดินกลับเวนทราสตามทางเกวียนตั้งแต่เช้าวันต่อมา เดินเท้า คนลานโคนต้นเห็นเขาครั้งสุดท้ายตรงโค้งแรกของทางเกวียน แขนเสื้อสองข้างตุงกระดาษ
      effects: { stats: { CHA: 1 }, alignment: { law: -1 }, reputation: { star_hall: -1 }, flags: [wrote_the_envoy_a_reading] }
    - id: pay_his_cart_home
      label: จ่ายค่าเกวียนกลับเวนทราสให้สองเหรียญ บอกให้เขาเขียนตามที่ผู้คุมหอพูด
      requires: { min_gold: 2 }
      text: |
        ทูตนับเหรียญสองรอบ ขึ้นเกวียนขนเปลือกไม้ที่ออกตอนบ่าย นั่งบนกองเปลือกไม้ เขาบอก{name}ว่าจะเขียนรายงานตามคำของผู้คุมหอทุกคำ หอนับ ไม่เคยอ่าน แล้วพูดซ้ำเบาๆ อีกรอบ ให้ตัวเองจำ

        เขาโบกมือลงมาจากกองเปลือกไม้จนเกวียนเลี้ยวลับ มือที่โบกเป็นมือซ้าย มือขวากอดแขนเสื้อสองข้างไว้กับอก
      effects: { gold: -2, alignment: { moral: 1 }, flags: [paid_the_envoys_cart_home] }
    - id: let_him_wait
      label: ปล่อยเขารอต่อ
      text: |
        ทูตรอต่อไปอีกฤดูหนึ่ง พ้นสัปดาห์ที่ห้าเขาเลิกขอให้ใครเขียนอะไร หันมาช่วยคนโรงตะกร้าสาวเชือกตะกร้าขึ้นกิ่ง แลกข้าววันละสองมื้อ ปลายฤดูเขาสาวเชือกเร็วกว่าคนโรงตะกร้าครึ่งโรง

        กระดาษสองแผ่นนั้นเขาพับซ้อนกันเป็นแผ่นรองไหล่ กันเชือกตะกร้ากินเนื้อ
      effects: { flags: [let_the_envoy_wait] }

# ---------- ไอเลธ ค คืนนับของนาเวธ (เอลฟ์เท่านั้น) ----------
- id: adult.realm_ileth_naveths_count_night
  stage: adult
  weight: 22
  scene: star_hall
  time: night
  when:
    age: [22, 64]
    location_tag: ileth
    flags: [race_elf]
  text: |
    นาเวธนัดคืนนับเอง เรื่องเดียว ปีนี้กิ่งจดหมายไม่ต้องเขียนจดหมายไปเวนทราส ธรรมเนียมของหอไม่มีการยกมือ ใครเห็นด้วยก็ปีนขึ้นไปนั่งบนชานนับคืนนั้น ใครไม่เห็นด้วยก็อยู่บนกิ่งของตัวเอง ชานนับมีเจ็ดชั้น ชั้นละยี่สิบที่ ถ้าตอนสางที่นั่งเต็มเกินครึ่ง เรื่องนั้นเป็นของหอ

    คนกิ่งล่างเริ่มปีนกันตั้งแต่บ่าย เอลฟ์รุ่นหนุ่มสาวที่ผมยังมีกลิ่นควันจากคืนไหนก็ไม่รู้ ลาเธียไม่ปีน นางนั่งอยู่หน้าโต๊ะบนกิ่งจดหมาย จุดตะเกียงตั้งแต่ฟ้ายังสว่าง เขียนบรรทัดแรกของจดหมายปีนี้ บรรทัดเดียวกับทุกปี นางไม่ได้ขอให้ใครอยู่ข้างล่าง นางแค่นั่งเขียนให้ทุกคนที่ปีนผ่านกิ่งจดหมายได้เห็น

    ตะวันเหลือคืบเดียวเหนือยอดไม้ {name}ยืนอยู่ที่โคนบันไดเชือก ข้างบนมีเสียงคนกิ่งล่างนับกันเองว่าได้กี่ที่แล้ว
  choices:
    - id: climb_and_sit
      label: ปีนขึ้นไปนั่งหนึ่งที่
      text: |
        บันไดเชือกกินเวลาครึ่งคืน {name}ขึ้นถึงชานชั้นที่สี่ตอนดาวขึ้นเต็มฟ้า นั่งลงในที่ว่างข้างเอลฟ์หนุ่มคนหนึ่งที่ยื่นกระบอกน้ำมาให้โดยไม่ถามว่ามาจากกิ่งไหน ตอนสางผู้คุมหอเดินไล่ชานลงมาทีละชั้น ตาของเขาเห็นหน้าใครไม่ชัดแล้ว เขานับด้วยมือ แตะไหล่ทีละไหล่จนครบเจ็ดชั้น แล้วบอกตัวเลขออกมาคำเดียว

        นาเวธลุกเดินลงบันไดก่อนใคร ข้างล่าง ตะเกียงบนกิ่งจดหมายยังไม่ดับ ลาเธียเขียนถึงบรรทัดที่สามแล้ว
      effects: { stats: { CON: 1 }, reputation: { crown: -1 }, flags: [climbed_for_the_lower_bough] }
    - id: stay_on_own_bough
      label: อยู่บนกิ่งของตัวเอง ไม่ปีน
      text: |
        คืนนั้น{name}นอนฟังเสียงบันไดเชือกเสียดเปลือกไม้จนดึก คนปีนผ่านกิ่งนี้ไปเรื่อยๆ บางคนหยุดพักใกล้จนได้ยินเสียงหอบ ไม่มีเสียงไหนเรียกชื่อ{name} ใกล้สางเพลงนับแว่วลงมาจากข้างบน เป็นเสียงเดียว คืนนั้นผู้คุมหอนับไหล่แทนนับดาว

        ก่อนเที่ยง ลาเธียหย่อนตะกร้าลงมาตามกิ่งทุกกิ่งที่คนไม่ได้ปีน ในตะกร้ามีขนมเปลือกไม้หนึ่งชิ้นกับกระดาษร่างจดหมายหนึ่งแผ่น ขอลายมือชื่อ
      effects: { reputation: { star_hall: 1 }, flags: [stayed_down_on_the_count_night] }
    - id: climb_and_stand
      label: ปีนขึ้นไปถึงชานนับ แต่ยืนอยู่ที่ขอบชาน ไม่นั่ง
      text: |
        ไม่มีข้อไหนห้ามคนยืน และไม่มีข้อไหนนับคนยืน {name}ยืนพิงลำต้นที่ขอบชานชั้นที่เจ็ดทั้งคืน ลมบนยอดแรงจนต้องผูกเข็มขัดไว้กับเชือกราว คนกิ่งล่างที่นั่งใกล้ที่สุดหันมาดูทุกครั้งที่มีดาวตก หวังว่า{name}จะเมื่อยจนต้องนั่ง

        ตอนสางมือของผู้คุมหอแตะไหล่{name}ตอนนับ แล้วเลื่อนลงไปแตะเข่า เข่าตั้งตรง เขาไม่นับ เดินต่อไปที่ไหล่ถัดไป
      effects: { stats: { WIS: 1 }, flags: [stood_at_the_edge_of_the_count] }
    - id: haul_the_old_counter_to_the_vote
      label: ไปหาเอลฟ์หญิงแก่ที่นับช่องของนางมาตั้งแต่ก่อนใครเกิด ถามว่านางจะขึ้นไหม
      requires: { any_flags: [hauled_the_old_counter_up, kept_the_old_counters_book] }
      text: |
        นางบอกว่าจะขึ้น ไม่ได้บอกว่าขึ้นไปทำไม {name}พันผ้าที่มือ ดึงเก้าอี้เชือกของนางขึ้นไปทีละช่วงเหมือนคืนที่เคยดึง ถึงชั้นบนสุด นางไม่ยอมลงจากเก้าอี้ นั่งค้างอยู่บนที่นั่งไม้ที่แขวนกับรอก ห้อยอยู่เหนือชานพอดี ไม่ได้อยู่บนที่นั่งไหน

        ตอนสางผู้คุมหอนับมาถึงตรงนั้น มือของเขาแตะไหล่นางที่ลอยอยู่กลางอากาศ แล้วหัวเราะออกมาครั้งเดียว เสียงแหบ สั้น เขานับต่อไป คนบนชานเถียงกันไปถึงฤดูหน้าว่าไหล่นั้นนับหรือไม่นับ
      effects: { stats: { STR: 1 }, flags: [hauled_the_old_counter_to_the_vote] }

# ---------- ไอเลธ ง เสื้อคลุมที่ไม่มีตรา ----------
- id: adult.realm_ileth_coat_without_badges
  stage: adult
  weight: 22
  when:
    age: [22, 64]
    location_tag: ileth
  text: |
    เสื้อคลุมของเขาเป็นเสื้อทหารหลวง ผ้าหนาสีหม่น ตรงอกซ้ายกับต้นแขนทั้งสองข้างมีปื้นสีเข้มกว่าเนื้อผ้ารอบๆ ตรงที่เคยมีตราเย็บติด ด้ายที่ตัดออกยังค้างอยู่ตามขอบเป็นตอสั้นๆ เขานั่งอยู่บนรากใหญ่ข้างลานตะกร้ามาเจ็ดวัน กินแต่ของที่คนเดินผ่านวางไว้ให้

    เขาขอแค่อย่างเดียว ที่นอนใต้หลังคาสักแห่ง ที่ที่ไม่มีใครถามชื่อ ลานโคนต้นมีธรรมเนียมเก่ากว่าเรือนทุกหลังในลาน คนนอกที่จะนอนในลานเกินเจ็ดคืนต้องมีคนในลานรับรองไว้หนึ่งคน คืนนี้คือคืนที่แปด

    ซูเรลเดินผ่านรากใหญ่วันละสองรอบ เช้ากับเย็น สมุดใบอนุญาตหนีบใต้แขน เขาไม่เคยหยุด ไม่เคยถาม ชายในเสื้อคลุมไม่มีตราก้มหน้าทุกครั้งที่ซูเรลผ่าน เย็นนี้พอซูเรลเดินพ้นไป ชายคนนั้นหันมาหา{name}
  choices:
    - id: vouch_for_him
      label: รับรองเขาไว้ แล้วพาไปขอที่นอนในโรงตะกร้า
      text: |
        คนโรงตะกร้ายอมให้เขานอนบนกองเชือกเก่า เพราะ{name}เป็นคนรับรอง ถ้าเขาขโมยอะไรไป {name}ต้องใช้คืน ข้อนี้ทุกคนในลานรู้ เขาไม่ขโมย เขาสาวเชือกตะกร้าตั้งแต่ก่อนสางจนมือพอง ไม่บ่นสักคำ

        เย็นวันที่สิบ ซูเรลเดินผ่านโรงตะกร้าแล้วหยุดเป็นครั้งแรก เปิดสมุด จดอะไรสั้นๆ แล้วเดินต่อ คืนนั้นชายคนนั้นตัดตอด้ายเส้นสุดท้ายที่ต้นแขนออกจนเกลี้ยง
      effects: { alignment: { moral: 1 }, reputation: { crown: -1 }, flags: [vouched_for_the_man_without_badges] }
    - id: tell_surel
      label: เดินตามซูเรลไป บอกเขาว่าชายบนรากเป็นใคร
      text: |
        ซูเรลฟังโดยไม่ขัด เปิดสมุดจดลงหน้าหลังสุด รูปร่าง เสื้อคลุม ตรงไหนที่ด้ายยังค้าง แล้วถามว่าเขาจะไปทางไหนต่อ {name}ตอบไม่ได้ ซูเรลบอกว่าไม่เป็นไร หน้านี้จะไปกับถุงจดหมายเที่ยวหน้า

        ถุงจดหมายออกจากลานในอีกเก้าวัน ตอนนั้นรากใหญ่ข้างลานตะกร้าว่างมาสองวันแล้ว เหลือขนมปังแข็งที่ใครสักคนวางไว้ให้ก้อนหนึ่ง มดขึ้นเป็นสาย
      effects: { alignment: { law: 1 }, reputation: { crown: 1, star_hall: -1 }, flags: [told_surel_about_the_deserter] }
    - id: bread_and_the_stream_road
      label: ให้ขนมปังกับน้ำหนึ่งกระบอก แล้วชี้ทางที่ไม่ผ่านค่ายตัดไม้
      text: |
        ทางที่ไม่ผ่านค่ายตัดไม้ไม่มีทางเกวียน ต้องเดินตามลำธารขึ้นเหนือสี่วัน จนถึงหมู่บ้านชายป่าที่ไม่เคยมีทหารหลวงเดินผ่าน {name}วาดทางลงบนเปลือกไม้ด้วยถ่าน ลำธาร ต้นไม้ล้ม หินสามก้อน เขาพับเปลือกไม้เก็บใส่อกเสื้อ ตรงที่เคยมีตรา

        เช้าวันต่อมารากใหญ่ว่าง ซูเรลเดินผ่านตอนเช้าเหมือนทุกวัน ไม่ได้หยุด แต่ก้าวช้าลงหนึ่งก้าวตรงหน้ารากนั้น
      effects: { alignment: { moral: 1 }, flags: [sent_the_deserter_up_the_stream] }
    - id: teach_him_to_look_up
      label: บอกเขาว่าเคยข้ามรั้วหลังค่ายมาเหมือนกัน
      requires: { flag: deserted_the_army }
      text: |
        {name}เล่าเท่าที่จำเป็น รั้วหลังค่าย คืนไหน ชื่อบนเสาประกาศ เขาฟังแล้วถามคำเดียวว่าหลับได้หรือยัง {name}ตอบตามจริง ทั้งสองนั่งอยู่บนรากใหญ่จนดึก {name}สอนเรื่องที่ตัวเองต้องเรียนเอาเอง ตัดตอด้ายให้เกลี้ยง ย้อมเสื้อคลุมด้วยน้ำต้มเปลือกไม้ และอย่าก้มหน้าเวลาข้าหลวงเดินผ่าน คนที่ก้มหน้าคือคนที่มีเรื่อง

        เช้าวันต่อมาเขาเดินสวนซูเรลบนทางเกวียน เงยหน้า ทักทายตอนเช้าเป็นภาษาอาร์เวล ซูเรลทักตอบด้วยเสียงธรรมดาที่สุด แล้วเดินผ่านไป
      effects: { stats: { WIS: 1 }, flags: [taught_the_deserter_to_look_up] }

# ---------- ไอเลธ จ น้ำมันของคนกิ่งล่าง ----------
- id: adult.realm_ileth_oil_for_the_lower_bough
  stage: adult
  weight: 22
  time: dusk
  when:
    age: [22, 64]
    location_tag: ileth
  text: |
    ร้านขายน้ำมันตะเกียงในลานโคนต้นมีร้านเดียว เจ้าของเป็นหญิงอาร์เวลที่จดชื่อคนซื้อทุกคนลงสมุดหน้าร้าน ตั้งแต่ค่ายตัดไม้ไหม้ค่ายแรก ซูเรลมานั่งอ่านสมุดเล่มนั้นทุกสิ้นเดือน คนกิ่งล่างเลิกซื้อน้ำมันที่ร้านนี้มานานแล้ว

    ตอนพลบค่ำนาเวธลงมาจากกิ่งล่างพร้อมเด็กหนุ่มสองคน แต่ละคนหิ้วไหดินเปล่าสามใบ นางวางถุงเหรียญลงในมือ{name} นับไว้พอดีค่าน้ำมันหกไห บอกว่าไม่ต้องรีบ ร้านปิดตอนตะวันลับ ยังพอทัน นางไม่ได้บอกว่าจะเอาน้ำมันไปทำอะไร คนในลานรู้โดยไม่ต้องถาม

    ทางเกวียนสายเหนือมีค่ายตัดไม้ค่ายใหม่ ตั้งได้ไม่ถึงเดือน เรือนนอนยังเป็นไม้สด คนงานสามสิบกว่าคน หลายคนแวะลานโคนต้นตอนเดินทางมาถึง ซื้อขนมปังจากเรือนหลังเดียวกับที่{name}ซื้อ
  choices:
    - id: buy_the_oil
      label: เดินไปร้าน ซื้อน้ำมันหกไหในชื่อของตัวเอง
      text: |
        หญิงเจ้าของร้านจดชื่อ{name}ลงสมุด หกไห เติมให้ทีละไหโดยไม่ถามว่าจะเอาไปจุดตะเกียงกี่ดวง นาเวธรับไหไปตรงโคนต้นที่มืดที่สุดของลาน ไม่ขอบใจ ไม่ทอนเงิน

        สามคืนต่อมาฟ้าทางเหนือแดงตั้งแต่ก่อนเที่ยงคืนไปจนสาง ปลายเดือนซูเรลนั่งอ่านสมุดของร้านน้ำมันที่หน้าร้าน นิ้วของเขาหยุดที่บรรทัดหนึ่ง แล้วเขาก็ขอยืมปากกาของร้าน
      effects: { alignment: { law: -1 }, reputation: { crown: -1 }, flags: [bought_oil_for_the_lower_bough] }
    - id: give_back_the_purse
      label: คืนถุงเหรียญให้นาเวธ
      text: |
        นาเวธรับถุงคืนโดยไม่เถียง เด็กหนุ่มคนหนึ่งเตะไหเปล่าแตกไปใบหนึ่ง นางตบท้ายทอยเขาเบาๆ ให้เก็บเศษ คืนนั้นร้านน้ำมันปิดตามเวลา ไม่มีลูกค้าจากกิ่งล่าง

        ห้าคืนต่อมาฟ้าทางเหนือแดงเหมือนกัน คนที่ไปดูค่ายตอนเช้าบอกว่าไฟคราวนี้ควันมากผิดปกติ กลิ่นยางสนลอยมาถึงลานโคนต้นอยู่สองวัน ยางสนติดไฟช้ากว่าน้ำมัน คนงานค่ายจึงมีเวลาวิ่งออกมาได้ทุกคน
      effects: { flags: [gave_back_naveths_purse] }
    - id: warn_the_new_camp
      label: เดินทางเกวียนสายเหนือไปบอกยามของค่ายใหม่
      text: |
        ยามของค่ายใหม่เป็นเด็กหนุ่มอาร์เวลที่ยังไม่เคยเห็นเอลฟ์ใกล้กว่าระยะกิ่งไม้ เขาฟัง{name}แล้ววิ่งไปปลุกหัวหน้าค่าย คืนนั้นค่ายจุดคบไฟรอบรั้วทุกสิบก้าว คนงานนอนกอดขวาน

        เดือนนั้นทางเหนือไม่มีไฟ เช้าวันหนึ่งมีไหดินเปล่าหกใบวางเรียงอยู่บนรากที่{name}เดินผ่านทุกเช้า ปากไหหันมาทางทางเดิน
      effects: { reputation: { crown: 1, star_hall: -1 }, flags: [warned_the_new_camp] }
    - id: water_the_oil
      label: ซื้อน้ำมันหกไห แต่เทน้ำรองก้นไหละครึ่งก่อนเติมน้ำมัน
      requires: { any_flags: [job_refinery_hand, job_merchant] }
      text: |
        คนที่เคยจับน้ำมันมารู้ว่าน้ำนอนก้นไห น้ำมันลอยข้างบน ถ้าไม่เขย่า มองจากปากไหก็เห็นเป็นน้ำมันเต็มไห {name}รองน้ำครึ่งไหก่อนให้หญิงเจ้าของร้านเติม แล้ววางไหนิ่งๆ ไว้จนนาเวธมารับ

        สามคืนต่อมาฟ้าทางเหนือแดงอยู่ครู่เดียวแล้วดับ ไฟลุกได้แค่ครึ่งไหแรก ที่เหลือราดลงไปเป็นน้ำ ยามของค่ายได้ยินเสียงฉ่า ตะโกนปลุกคนทั้งค่ายทัน นาเวธกลับมาตอนสาง เอาไหใบหนึ่งที่ยังเหลือก้นน้ำมาเทลงโคนต้นต่อหน้า{name} ช้าๆ จนหยดสุดท้าย
      effects: { stats: { INT: 1 }, flags: [watered_the_lower_bough_oil] }

# ---------- ไอเลธ ฉ คนแปลของซูเรล (เอลฟ์เท่านั้น) ----------
- id: adult.realm_ileth_surels_translator
  stage: adult
  weight: 22
  scene: star_hall
  when:
    age: [22, 64]
    location_tag: ileth
    flags: [race_elf]
  text: |
    ซูเรลขอคนแปลทุกครั้งที่ต้องคุยกับผู้เฒ่าบนกิ่ง คนแปลประจำของเขาเป็นคนทำแผนที่ในลานโคนต้น เช้านี้คนทำแผนที่นอนซมด้วยไข้ ซูเรลยืนรออยู่ที่โคนบันไดเชือก ถามทุกคนที่ลงมาจากกิ่งเป็นภาษาอาร์เวล ช้าๆ ชัดๆ ว่าใครช่วยแปลได้บ้าง {name}เป็นคนที่สามที่ลงมา คนแรกกับคนที่สองแกล้งฟังไม่ออก

    เรื่องที่เขามาคุยคือไม้ล้ม ค่ายตัดไม้ขอเก็บต้นไม้ที่ล้มเองในเขตของหอ แลกกับหยุดหลักเขตไว้ที่แนวลำธารสามฤดู ไม้ล้มคือไม้ที่หอใช้สร้างทุกอย่าง ไม้ที่ป่าทิ้งลงมาเอง ผู้เฒ่าสามคนนั่งฟังอยู่บนแท่นไม้ที่กิ่งแรก

    ผู้เฒ่าคนกลางพูดก่อน ยาว เร็ว และมีประโยคหนึ่งที่แปลตรงๆ ได้ว่า คนใส่รองเท้าหนังเดินในป่าไม่ควรได้คุยเรื่องไม้ล้ม เพราะเสียงรองเท้าก็ทำให้ไม้ล้มแล้ว ผู้เฒ่าอีกสองคนหัวเราะ {name}เห็นมุมปากของซูเรลขยับ ก่อนที่{name}จะได้แปลแม้แต่คำแรก
  choices:
    - id: translate_every_word
      label: แปลทุกคำ รวมทั้งเรื่องรองเท้า
      text: |
        {name}แปลทุกคำ ช้าๆ เรื่องรองเท้าแปลให้ตรงที่สุดเท่าที่ภาษาอาร์เวลจะรับได้ ซูเรลฟังจนจบ ขอบใจ{name} แล้วตอบผู้เฒ่าผ่าน{name}ทีละประโยค ประโยคแรกของเขาคือเขาจะถอดรองเท้า

        เขาถอดจริง ปีนบันไดเชือกขึ้นไปนั่งบนแท่นไม้กับผู้เฒ่าในถุงเท้าขนแกะที่ส้นขาดทั้งสองข้าง วันนั้นคุยกันจนตะวันบ่าย ไม่มีเรื่องไหนตกลงกันได้ ตอนลงมาเขาลืมรองเท้าไว้ที่โคนบันได เช้าวันต่อมามีคนเอาไปแขวนไว้บนกิ่งแรก
      effects: { stats: { WIS: 1 }, reputation: { star_hall: 1 }, flags: [translated_every_word_for_surel] }
    - id: soften_the_elders
      label: แปลให้สุภาพลง ตัดเรื่องรองเท้าทิ้ง
      text: |
        {name}แปลว่าผู้เฒ่าขอบคุณที่มา และอยากรู้ว่าค่ายจะหยุดหลักเขตไว้ได้จริงแค่ไหน ซูเรลขอบคุณกลับไปผ่าน{name} สุภาพเท่ากัน การคุยเดินไปเรียบร้อยจนเที่ยง เสียงหัวเราะไม่กลับมาอีก

        ตอนแยกกัน ซูเรลพูดกับผู้เฒ่าคนกลางเป็นภาษาเอลฟ์หนึ่งประโยค สำเนียงกิ่งเก่า ชัดกว่าสำเนียงของ{name}เอง ขอบคุณสำหรับเรื่องรองเท้า แล้วเดินกลับลานโคนต้นไป ผู้เฒ่าทั้งสามหันมาหา{name}พร้อมกัน
      effects: { reputation: { crown: 1 }, flags: [softened_the_elders_for_surel] }
    - id: leech_on_his_neck
      label: แปลประโยคแรกให้ แล้วแทรกเป็นภาษาเอลฟ์ว่ามีทากเกาะอยู่ที่คอเขา
      text: |
        ซูเรลยกมือขึ้นปัดคอตัวเองก่อนจะทันรู้ตัวว่าทำอะไร ผู้เฒ่าทั้งสามเห็นพร้อมกัน ผู้เฒ่าคนกลางพูดต่อเป็นภาษาเอลฟ์โดยไม่รอใครแปล ซูเรลตอบเป็นภาษาเอลฟ์ ไม่ผิดสักคำ จากนั้นการคุยก็ไม่ต้องมีคนแปลอีก

        {name}นั่งอยู่บนแท่นไม้จนจบ เพราะไม่มีใครบอกให้ลง วันนั้นตกลงกันได้เรื่องหนึ่ง ค่ายจะเก็บไม้ล้มได้เฉพาะต้นที่ล้มขวางทางเกวียน ซูเรลจดลงสมุดใบอนุญาต เขียนเป็นภาษาเอลฟ์
      effects: { stats: { CHA: 1 }, reputation: { star_hall: 1 }, flags: [caught_surel_with_the_leech] }
    - id: tell_him_he_needs_none
      label: บอกซูเรลเบาๆ เป็นภาษาอาร์เวล ว่าเขาไม่ต้องใช้คนแปล
      text: |
        ซูเรลไม่ปฏิเสธ เขาบอกว่าผู้เฒ่าพูดกับคนแปลไม่เหมือนพูดกับข้าหลวง และวันนี้เขาอยากฟังแบบแรก {name}ส่ายหน้า ลงจากแท่นไม้ไป ซูเรลคุยต่อเป็นภาษาอาร์เวล ช้าๆ ชัดๆ ผู้เฒ่าทั้งสามแกล้งฟังไม่ออก ตอบกลับเป็นภาษาเอลฟ์ทุกประโยค

        สองฝ่ายนั่งพูดกันคนละภาษาจนตะวันบ่าย ต่างฝ่ายต่างเข้าใจอีกฝ่ายทุกคำ ไม่มีฝ่ายไหนยอมเป็นฝ่ายแรกที่ตอบให้ตรงคำถาม
      effects: { flags: [refused_to_translate_for_surel] }
