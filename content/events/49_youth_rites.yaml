# พิธีเลือกทาง อายุ 14 หนึ่งฉากต่อชาติกำเนิด (คำตอบ L12–L14 ที่ Phupha อนุมัติ 7 พ.ย. 2026)
# ทางประจำถิ่นเปิดเสมอ ทางอื่นต้องมี lean_X ของทางนั้น ทางที่เจ็ดคือไม่เป็นนักผจญภัย (path_commoner)
# L14: วิหารอีเซล วิหารออสซา และภาคีผู้เฝ้าผนึกรับเด็กมีเขา วิหารเวรัสกับศาสนจักรตะเกียงไม่รับเลย
#      สถาบันเวทหลวงรับเมื่อซ่อนเขาได้หรือมีคนจ่ายค่าเรียนเต็ม หนูท่ารับทุกคน
# ฉากที่เด็กวิหารหรือเด็กที่พ่ออาจหายไปในสงครามเจอได้ ห้ามใช้ {father}

# ---------- ไร่ บ้านเงาเสา ----------

- id: youth.rite_farm
  stage: youth
  weight: 1000
  when:
    age: [14, 14]
    flags: [origin_farm]
  text: |
    ตลาดจ้างงานปลายฤดูเก็บเกี่ยวจัดที่เมืองตลาดริมรางรถไฟ ห่างบ้านเงาเสาครึ่งวันเดิน เด็กที่อายุครบสิบสี่เดินไปกับผู้ใหญ่ในบ้าน คนแก่ว่าเดินไปเป็นเด็ก กลับมาเป็นคนมีงาน บางคนก็ไม่กลับมา

    ลานหน้าโรงชั่งข้าวตั้งโต๊ะเรียงเป็นสองแถว โต๊ะของบริษัทขนถ่านใหญ่ที่สุด มีกระสอบถ่านมารวางไว้ให้เด็กลองยก ถัดไปเป็นโต๊ะสถาบันเวทหลวง ปีนี้มาหาเด็กชนบทเข้าทุนเป็นปีแรก ช่างเวทหนุ่มแว่นสองชั้นนั่งเหงาอยู่หลังกองกระดาษ แม่ชีอีเซลสองคนจากโคนเสานั่งเย็บผ้าไปรอไป ท้ายลานมีชายถือปืนยาวขายหนังหมาป่า ข้างลานคณะละครเร่กำลังตอกเวที

    คนแปลกหน้าจากเวนทราสยืนพิงเสาอยู่หัวลาน ไม่มีโต๊ะ ไม่มีป้าย เด็กหลายคนรู้ว่าเขามาหาใคร

    ผู้ใหญ่ที่พามาบอกว่าจะรออยู่ที่บ่อน้ำหน้าลาน เลือกเสร็จเมื่อไหร่ให้ไปหา
  choices:
    - id: coal_guard
      label: ไปลองยกกระสอบที่โต๊ะบริษัทขนถ่าน ลงชื่อเป็นลูกมือยามคุมเกวียน
      text: |
        กระสอบหนักเกือบเท่าตัว{name} ยกขึ้นได้ถึงเอว แล้วค้างไว้ได้จนหัวหน้ายามนับถึงสิบ เขาบีบไหล่{name}ดูทั้งสองข้าง เขียนชื่อลงสมุด แล้วยื่นนกหวีดทองเหลืองห้อยเชือกหนังให้อันหนึ่ง ปากนกหวีดบุบเป็นรอยฟันของคนก่อน

        "เห็นใครเข้าใกล้เกวียนตอนกลางคืน เป่า" เขาว่า "อย่าวิ่งเข้าไปเอง ปีกลายมีลูกมือคนหนึ่งวิ่งเข้าไปเอง" อีกสามวันให้มาขึ้นเกวียนขบวนแรก ลูกมือได้ค่าแรงครึ่งหนึ่ง หอกจะได้ก็ต่อเมื่อหัวหน้ายามเห็นว่าเป่านกหวีดก่อนวิ่งเป็น
      effects: { class: warrior, flags: [path_coal_guard] }
    - id: dock_rats
      label: เดินไปหาคนแปลกหน้าที่พิงเสาอยู่หัวลาน
      requires: { flag: lean_rogue }
      text: |
        คนแปลกหน้าอยากรู้เรื่องเดียว ว่า{name}เคยเอาอะไรของใครไปแล้วไม่มีใครรู้บ้าง {name}เล่าเรื่องหนึ่ง เขาหัวเราะ แล้วยื่นตั๋วรถไฟเที่ยวเวนทราสให้ใบหนึ่ง ตั๋วชั้นสาม ไม่มีชื่อ

        เด็กอีกสองคนที่ยืนรอขึ้นรถไฟถือตั๋วแบบเดียวกัน ทั้งสามคนนั่งตู้เดียวกันจนถึงเวนทราส ไม่มีใครบอกชื่อตัวเองก่อน
      effects: { class: rogue, location_tag: ventras, reputation: { dock_rats: 1 }, flags: [path_dock_rats] }
    - id: institute
      label: ไปนั่งสอบที่โต๊ะสถาบันเวทหลวง
      requires: { flag: lean_wizard }
      text: |
        ข้อสอบมีข้อเดียว ช่างเวทหนุ่มวางรูปขดแก้วไว้ตรงหน้าให้ดูนับสิบ แล้วคว่ำรูป ยื่นถ่านให้วาดตามที่จำได้ {name}วาดได้ครบทุกเกลียว ขาดไปแค่รอยต่อตรงปลาย

        เขาพลิกรูปขึ้นมาเทียบ แล้วเขียนชื่อ{name}เป็นชื่อแรกในกระดาษที่ว่างมาทั้งวัน ทุนนี้ให้ที่นอน อาหาร และค่าเรียน แลกกับทำงานให้สถาบันสิบปีหลังเรียนจบ
      effects: { class: wizard, location_tag: ventras, reputation: { royal_institute: 1 }, flags: [path_institute] }
    - id: isel
      label: ไปนั่งลงข้างแม่ชีอีเซลสองคนนั้น
      requires: { flag: lean_cleric }
      text: |
        แม่ชีคนแก่กว่าถามว่ากลัวเลือดไหม {name}บอกว่าไม่กลัว เธอยื่นเข็มกับด้ายให้ แล้วชี้ผ้าอ้อมกองที่เย็บค้างไว้ อีกคนเลื่อนตะกร้าขนมปังมาให้โดยไม่เงยหน้าจากผ้า

        ตกเย็นกองผ้าอ้อมหมด ปลายนิ้ว{name}มีรอยเข็มตำเป็นจุดแดงทุกนิ้ว แม่ชีเขียนชื่อ{name}ลงบนชายผ้าผืนสุดท้าย บอกว่าที่วิหารใช้แบบนี้แทนสมุด ผ้าผืนนี้จะได้ห่อเด็กคนแรกที่มาถึงช่องส่งขนมปังในหน้าหนาวนี้ ถ้าเด็กคนนั้นไม่รอด ก็ห่อลงหลุมไปด้วยกัน
      effects: { class: cleric, god: isel, flags: [path_isel_temple] }
    - id: bounty_hunter
      label: ไปถามชายขายหนังหมาป่าว่ารับลูกมือไหม
      requires: { flag: lean_ranger }
      text: |
        เขาล่าหมาป่าตามหมู่บ้านในอาร์เวล หัวละสามเหรียญ ล่าของที่หมาป่าไม่กล้ากินได้หัวละสามสิบ เขาว่าอย่างนั้นแล้วยิ้มเห็นฟันหลอ

        เขาให้{name}ดูหนังสามผืนบนโต๊ะ แล้วถามว่าผืนไหนตายเพราะกระสุน ผืนไหนตายเพราะกับดัก {name}ตอบถูกสองผืน เขาบอกว่าผืนที่สามเขาก็จำไม่ได้แล้ว แล้วยื่นมีดถลกหนังให้เล่มหนึ่ง ชี้หมาป่าตัวที่ยังไม่ได้ถลกในกระสอบใต้โต๊ะ

        {name}ถลกต่อหน้าคนทั้งลาน ได้ครึ่งตัวก็ต้องลุกไปอาเจียนหลังกองฟาง แล้วกลับมาถลกต่อจนเสร็จ บ่ายนั้นหนังผืนนั้นขายได้ถูกกว่าผืนอื่นสองเหรียญ เพราะรอยมีดแหว่งตรงท้อง เขาหักสองเหรียญนั้นจากค่าแรงเดือนแรกของ{name}
      effects: { class: ranger, flags: [path_bounty_hunter] }
    - id: troupe
      label: ไปช่วยคณะละครเร่ตอกเวที
      requires: { flag: lean_bard }
      text: |
        หัวหน้าคณะเป็นหญิงอ้วนเสียงดังกว่าค้อน เธอให้{name}ถือเสาเวทีไว้ระหว่างที่คนอื่นตอก แล้วระหว่างถือ ให้ลองตะโกนบทของทหารยามในเรื่องให้ได้ยินไปถึงโต๊ะบริษัทขนถ่าน

        คนที่โต๊ะบริษัทขนถ่านหันมาทั้งโต๊ะ เย็นนั้น{name}ได้เล่นเป็นทหารยามจริง พูดสองประโยค ตายในฉากที่สาม แล้วลุกขึ้นมาเก็บของกับคณะ
      effects: { class: bard, flags: [path_troupe] }
    - id: stay_home
      label: ไม่ลงชื่อกับโต๊ะไหน เดินกลับไปทำไร่ที่บ้าน
      text: |
        {name}เดินผ่านโต๊ะทุกโต๊ะไปจนสุดลาน แล้วเดินกลับไปที่บ่อน้ำ ผู้ใหญ่ที่รออยู่ยื่นขนมให้ครึ่งชิ้น แล้วออกเดินกลับบ้านเงาเสาด้วยกัน

        ผู้ใหญ่บอกว่าปีหน้าตลาดจ้างงานก็ยังมี แต่{name}นึกไม่ออกว่าในหมู่บ้านมีใครบ้างที่ไม่เลือกปีนี้แล้วไปเลือกปีหน้า
      effects: { flags: [path_commoner] }

# ---------- โรงกลั่น ย่านริมแม่น้ำ เวนทราส ----------

- id: youth.rite_refinery
  stage: youth
  weight: 1000
  when:
    age: [14, 14]
    flags: [origin_refinery]
  text: |
    วันเปิดสมุดของสมาคมโรงกลั่นมีปีละครั้งตอนต้นหนาว เด็กในย่านริมแม่น้ำที่อายุครบสิบสี่ต้องไปเข้าแถวในโถงสมาคม ให้เสมียนเรียกชื่อ แล้วขานรับ ชื่อที่ขานแล้วจะอยู่ในสมุดของสมาคมไปจนตาย ไม่มีใครบังคับให้ขาน แต่ทั้งย่านมีไม่กี่คนที่ไม่ขาน

    ข้างนอกโถงมีคนอีกพวกมายืนรอเด็กที่ไม่ขาน ชายหน้าเรียบที่ท่าเรือยืนอยู่ฝั่งตรงข้ามถนน โต๊ะรับสมัครของราชนาวีตั้งอยู่หน้าโรงเตี๊ยม พรานจากชายป่าไอเลธที่ลงมาขายหนังทุกต้นหนาวปูผ้าอยู่หัวถนน ช่างเวทประจำโรงกลั่นยืนสูบกล้องอยู่ข้างประตูโถง ใต้สะพานมีเสียงเพลงจากศาลทาลิสลอยมาตั้งแต่เช้า

    เสมียนเรียกชื่อ{name} {name}ยังไม่ได้ขาน เสมียนเงยหน้าจากสมุด แล้วเรียกอีกหน
  choices:
    - id: dock_rats
      label: เดินออกจากแถว ข้ามถนนไปหาชายหน้าเรียบ
      text: |
        เสมียนไม่เรียกหนที่สาม เขาขีดเส้นทับชื่อ{name} แล้วเรียกชื่อถัดไป

        ชายหน้าเรียบไม่ได้แปลกใจ "ช้าไปหนหนึ่ง" เขาว่า แล้วเดินนำไปทางท่าเรือ ไม่หันมาดูว่า{name}ตามมาหรือเปล่า
      effects: { class: rogue, reputation: { dock_rats: 1 }, flags: [path_dock_rats] }
    - id: refinery_tech
      label: ไปยืนข้างช่างเวทที่ประตูโถง
      requires: { flag: lean_wizard }
      text: |
        ช่างเวทเคาะกล้องกับวงกบประตู ไม่หันมาดู "สมาคมจ่ายเอ็งเต็มค่าแรงไปจนตาย" เธอว่า "ข้าจ่ายไม่ถึงครึ่ง แต่สอนให้"

        เธอให้{name}แบกกล่องเครื่องมือกลับโรงด้วยกันวันนั้นเลย ระหว่างทางบอกว่าปีหน้าจะเอาชื่อ{name}ไปยื่นที่สถาบันเวทหลวง ถ้าถึงตอนนั้นยังไม่ทำขดแก้วแตกเกินสามขด
      effects: { class: wizard, reputation: { distillers: 1 }, flags: [path_refinery_tech] }
    - id: talis_shrine
      label: เดินตามเสียงเพลงไปขอรับใช้ศาลทาลิสใต้สะพาน
      requires: { flag: lean_cleric }
      text: |
        ศาลทาลิสเป็นแค่ซอกกำแพงใต้สะพาน มีรูปสลักไม้ที่ถูมือกันจนหน้าเรียบ กับตะเกียงหนึ่งดวง นักบวชเป็นชายแก่เสียงแหบ เขาถามว่า{name}ร้องเพลงเป็นไหม {name}บอกว่าไม่ค่อยเป็น

        "ดี" เขาว่า "ข้าต้องการคนฟัง ไม่ใช่คนร้อง" แล้วให้{name}นั่งลงข้างตะเกียง ฟังคนงานกะดึกที่มาร้องเพลงระบายจนเช้า
      effects: { class: cleric, god: talis, flags: [path_talis_shrine] }
    - id: navy
      label: ไปลงชื่อที่โต๊ะราชนาวีหน้าโรงเตี๊ยม
      requires: { flag: lean_warrior }
      text: |
        นายทหารที่โต๊ะให้{name}ยืนชิดไม้บรรทัดที่ตอกติดเสา เตี้ยไปครึ่งฝ่ามือ เขาเขียนลงไปว่าสูงพอ แล้วยื่นปากกาให้ลงชื่อ

        สามวันต่อมา{name}ได้เสื้อสีน้ำเงินที่ใหญ่กว่าตัวไปสองขนาด ได้ที่นอนในเรือนพักริมท่าเรือหลวง กับครูฝึกที่ใส่ขาเหล็กทั้งสองข้าง และเดินเร็วกว่าทุกคน
      effects: { class: warrior, reputation: { crown: 1 }, flags: [path_navy] }
    - id: ileth_hunter
      label: ไปถามพรานไอเลธว่าขากลับขึ้นป่าจะพาลูกมือไปด้วยไหม
      requires: { flag: lean_ranger }
      text: |
        พรานเป็นมนุษย์จากหมู่บ้านชายป่า พูดภาษาเมืองเหมือนคนเพิ่งหัด เขาจับมือ{name}พลิกดูเหมือนผู้จัดการโรงกลั่น แต่ดูคนละอย่าง ดูว่าปลายนิ้วยังรู้สึกหรือไม่

        "มือคนโรงกลั่นด้านหมดแล้ว" เขาว่า "มือเอ็งยังไม่ด้าน" ขากลับขึ้นป่า{name}นั่งอยู่บนกองหนังท้ายเกวียน มองปล่องเวนทราสเล็กลงจนเหลือเท่าก้านไม้ขีด
      effects: { class: ranger, location_tag: ileth, flags: [path_ileth_hunter] }
    - id: talis_singers
      label: ไปร้องกับวงใต้สะพาน แล้วตามวงไปร้องตามโรงเตี๊ยม
      requires: { flag: lean_bard }
      text: |
        วงใต้สะพานมีสี่คน ซอหนึ่ง กลองหนึ่ง กับคนร้องสองคนที่ร้องคนละเพลงได้พร้อมกัน {name}ร้องเพลงที่คนงานกะดึกร้องกันเบาๆ ตอนหม้อหยดช้า เพลงที่ไม่มีใครรู้ว่าใครแต่ง

        คนตีกลองหยุดตี แล้วถามว่าเพลงนั้นมีกี่ท่อน {name}บอกว่าไม่รู้ ร้องต่อไปเรื่อยๆ จนกว่าจะเลิกกะ คืนนั้นวงเอาเพลงหม้อหยดไปร้องที่โรงเตี๊ยมสามแห่ง ได้เหรียญมากกว่าเพลงไหนที่เคยร้อง
      effects: { class: bard, flags: [path_talis_singers] }
    - id: answer
      label: ขานรับ ให้ชื่อลงสมุดสมาคม
      text: |
        {name}ขานรับ เสียงดังกว่าที่ตั้งใจ ก้องไปทั้งโถง เสมียนจุดหมึกลงหลังชื่อหนึ่งจุด แล้วเรียกชื่อถัดไป

        วันรุ่งขึ้น{name}ได้หม้อของตัวเอง หม้อเบอร์สิบเอ็ด ได้ค่าแรงเต็มเป็นครั้งแรก ตกค่ำเอาไปวางบนโต๊ะที่บ้าน นับเองสองรอบ
      effects: { reputation: { distillers: 1 }, flags: [path_commoner] }

# ---------- คนแคระ ทุนดาร์ ----------

- id: youth.rite_dwarf
  stage: youth
  weight: 1000
  when:
    age: [14, 14]
    flags: [origin_dwarf_clan]
  text: |
    ทั่งของ{surname}ตั้งอยู่กลางห้องโถง ใต้กำแพงชื่อ เป็นเหล็กดำก้อนเดียวที่ตระกูลยกมาจากบ้านเก่าเมื่อสี่ร้อยปีก่อน ไม่มีใครตีเหล็กบนทั่งนี้แล้ว มีไว้ให้วางมืออย่างเดียว

    คนแคระที่อายุครบสิบสี่ต้องวางมือขวาบนทั่ง แล้วบอกคนทั้งตระกูลว่าจะเอามือนี้ไปทำอะไร คำที่พูดจะสลักไว้ใต้ชื่อบนกำแพง พูดแล้วถอนไม่ได้ ถอนได้อย่างเดียวคือตาย แล้วให้คนข้างหลังสลักทับ

    คืนนั้นทั้งตระกูลมายืนเต็มห้องโถง คนที่แก่ที่สุดในบ้านยืนอยู่ข้างทั่ง ถือสิ่วไว้ในมือ เหล็กยังเย็นจากเมื่อเช้า {name}วางมือลงไป
  choices:
    - id: ossa_wall
      label: สาบานว่าจะรับใช้ออสซาที่ผนังเสา
      text: |
        คนในห้องโถงพากันพึมพำรับคำพร้อมกัน เสียงต่ำเหมือนเสียงหินเลื่อน คนแก่ที่สุดในบ้านสลักคำสาบานลงใต้ชื่อ{name}ห้าคำ สั้นที่สุดในกำแพงทั้งแผ่น เพราะคำสาบานแบบนี้มีมาก่อนแล้วทุกรุ่น

        สามวันต่อมา{name}เดินขึ้นบันไดวนไปถึงโคนเสาของออสซา นักบวชที่รับตัวเป็นคนแคระหญิงแขนเหล็ก ยื่นตะเกียงให้หนึ่งดวง บอกว่าในผนังเสาไม่มีกลางวันกลางคืน มีแต่ตะเกียงที่ยังไม่ดับกับตะเกียงที่ดับแล้ว
      effects: { class: cleric, god: ossa, flags: [path_ossa_wall] }
    - id: clan_hammer
      label: สาบานเป็นค้อนของตระกูล ตีทุกอย่างที่มาทวงจากบ้านนี้
      requires: { flag: lean_warrior }
      text: |
        คนแก่ที่สุดในบ้านหยุดสิ่วไว้กลางอากาศ คำสาบานนี้ไม่มีใครพูดมาสามรุ่นแล้ว ตั้งแต่ตระกูลเลิกถือขวาน คนในห้องโถงเงียบจนได้ยินเสียงรถรางลากผ่านเหนือเพดาน แล้วลุงคนหนึ่งก็เคาะกำปั้นลงบนผนังสองที ทุกคนเคาะตาม

        เช้าวันต่อมา{name}ไปรายงานตัวที่ยามประตูชั้นสิบเอ็ด ยามประตูทุกคนเป็นลูกหลานของตระกูลที่สาบานคำเดียวกัน
      effects: { class: warrior, reputation: { dwarf_council: 1 }, flags: [path_clan_hammer] }
    - id: arm_smith
      label: สาบานว่าจะทำแขนให้คนที่เสียแขน
      requires: { flag: lean_wizard }
      text: |
        ป้าคนหนึ่งในตระกูลทำงานที่โรงแขนกลชั้นล่าง ป้าหัวเราะเสียงดังกลางพิธี ไม่เคยมีใครหัวเราะในห้องโถงนี้ตอนมีคนวางมือบนทั่ง แล้วป้าก็บอกว่าลูกค้าครึ่งโรงเป็นทหารอาร์เวล คนที่ตัดแขนพวกเขาคือพ่อของเรา ใครจะทำแขนให้ ต้องลืมเรื่องนี้ให้ได้ทุกเช้า

        {name}บอกว่าลืมได้ คนแก่ที่สุดในบ้านสลักคำสาบานลงไป คิ้วขมวดอยู่จนตัวสุดท้ายเสร็จ
      effects: { class: wizard, flags: [path_arm_smith] }
    - id: rail_runner
      label: สาบานว่าจะทำงานให้ตระกูลบนทางรถไฟ
      requires: { flag: lean_rogue }
      text: |
        บนกระดาษ ทางรถไฟเป็นงานของบริษัท แต่ทุกคนในห้องโถงรู้ว่าคนแคระที่สาบานทำงานให้ตระกูลบนทางรถไฟทำอะไร ถ่านมารที่ตระกูลส่งออกจากเขาไม่เคยครบจำนวนที่ชั่งตอนออกจากเหมือง

        คนแก่ที่สุดในบ้านสลักคำสาบานช้ากว่าคำอื่น ทุกตัวอักษรตรงเป๊ะ คืนนั้นลุงคนหนึ่งที่{name}ไม่ค่อยได้เห็นหน้ามาหาที่ห้อง ยื่นเสื้อคลุมมีซับลับให้ตัวหนึ่ง
      effects: { class: rogue, flags: [path_rail_runner] }
    - id: pass_guide
      label: สาบานว่าจะพาคนข้ามช่องเขาให้ถึงทุกคน
      requires: { flag: lean_ranger }
      text: |
        คำสาบานนี้มีอยู่บนกำแพงแค่ครั้งเดียว ชื่อข้างบนเป็นของคนที่ตายบนช่องเขาเมื่อร้อยกว่าปีก่อน คนแก่ที่สุดในบ้านเอานิ้วแตะชื่อนั้นก่อนสลักชื่อ{name}ลงข้างล่าง

        ปลายเดือนนั้นมีพรานช่องเขาแก่คนหนึ่งมารับตัว พรานคนนั้นพูดน้อย กลิ่นเหมือนแพะ และรู้ว่าหิมะชั้นไหนจะเลื่อนก่อนที่มันจะเลื่อน

        เที่ยวแรกแกให้{name}แบกเชือกกับเสบียงของคนสามคน พาพ่อค้าเกลือข้ามช่องเขาไปส่งฝั่งอาร์เวล บ่าถลอกจนเลือดซึมเสื้อ ขากลับแกหยุดที่โค้งหนึ่ง ริมผามีไม้ปักเล็กๆ เรียงอยู่เจ็ดอัน แกปัดหิมะออกจากหัวไม้ทีละอันช้าๆ ครบเจ็ดอันแล้วค่อยเดินต่อ
      effects: { class: ranger, flags: [path_pass_guide] }
    - id: wall_singer
      label: สาบานว่าจะจำกำแพงนี้ทั้งแผ่น แล้วเล่าให้คนนอกฟัง
      requires: { flag: lean_bard }
      text: |
        คนในห้องโถงหันมามองหน้ากัน คนแคระไม่เล่ากำแพงให้คนนอกฟัง แต่ป้าที่ทำงานโรงแขนกลก็พูดขึ้นมาว่า ข้างนอกทุกคนรู้แต่ว่าเราแพ้ ไม่มีใครรู้ว่าเราเป็นใครก่อนแพ้

        คนแก่ที่สุดในบ้านสลักคำสาบาน แล้วให้{name}อ่านกำแพงตั้งแต่ชื่อบนสุดลงมาจนถึงชื่อตัวเอง ด้วยเสียงของตัวเอง {name}อ่านจนเกือบรุ่งเช้า ไม่ผิดสักชื่อ
      effects: { class: bard, flags: [path_wall_singer] }
    - id: lower_forge
      label: สาบานว่าจะทำงานที่โรงหลอมชั้นล่างเหมือนคนอื่นในบ้าน
      text: |
        คนแก่ที่สุดในบ้านสลักคำสาบานนี้ได้โดยไม่ต้องดูตัวอย่าง มือเดินไปเองเหมือนเขียนชื่อตัวเอง คนในห้องโถงพึมพำรับคำ แล้วแยกย้ายไปกินข้าว

        เช้าวันต่อมา{name}ลงบันไดไปโรงหลอมชั้นล่าง ไอร้อนที่ทำให้ผนังห้องนอนอุ่นมาทั้งชีวิตมาจากตรงนี้ คนคุมเตาให้ถุงมือหนังที่ใหญ่กว่ามือหนึ่งคู่ บอกว่าอีกสองปีมือจะโตจนพอดี
      effects: { flags: [path_commoner] }

# ---------- เอลฟ์ บ้านกิ่งลม ----------

- id: youth.rite_elf
  stage: youth
  weight: 1000
  when:
    age: [14, 14]
    flags: [origin_elf_bough]
  text: |
    เด็กบ้านกิ่งลมได้ช่องฟ้าของตัวเองตั้งแต่ปีแรกที่ขึ้นหอนับดาว ใครได้ช่องไหนต้องนับช่องนั้นไปทั้งชีวิต คนนอกรู้กันแค่นั้น ที่คนนอกไม่รู้คือมีคืนเดียวที่คืนช่องได้ คือคืนฟ้าเปิดของปีที่สิบสี่ คืนนั้นเด็กที่อายุครบต้องขึ้นหอพร้อมกรอบไม้ไผ่ของตัวเอง แล้วเลือกว่าจะเก็บไว้นับต่อ หรือคืนให้หอ แล้วบอกว่าจะเอาชีวิตไปทำอะไรแทน พ้นคืนนี้ไปแล้ว คืนไม่ได้อีก

    ปีนี้ผู้คุมหอมองไม่เห็นดาวแล้ว เขานั่งอยู่ข้างกองกรอบไม้ไผ่ที่คืนแล้ว ฟังเสียงเด็กแต่ละคนพูด แล้วจดด้วยมือที่ยังจำทางของตัวอักษรได้

    ช่องของ{name}คือช่องเล็กที่สุดทางขอบฟ้าตะวันตก ปีนี้นับได้ยี่สิบสาม
  choices:
    - id: bough_hunter
      label: คืนช่องฟ้า บอกว่าจะเป็นพรานของบ้านกิ่งลม
      text: |
        ผู้คุมหอรับกรอบไม้ไผ่ไปวางบนกอง ลูบด้ายตารางทีละเส้น เหมือนนับว่าครบหรือเปล่า แล้วจดชื่อ{name}ไว้ใต้คำว่าพราน

        ลงจากหอตอนฟ้าสาง พรานแก่ของบ้านรออยู่ที่โคนบันได ยื่นคันธนูไม้ไอเลธให้คันหนึ่ง คันธนูนั้นเบาจนเหมือนถือกิ่งไม้แห้ง แต่ตอนขึ้นสายต้องใช้แรงทั้งตัว
      effects: { class: ranger, flags: [path_bough_hunter] }
    - id: keep_square
      label: เก็บช่องฟ้าไว้ นับไปทั้งชีวิต
      requires: { flag: lean_wizard }
      text: |
        ผู้คุมหอเอื้อมมือมาหากรอบไม้ไผ่ แตะแล้วชักมือกลับ เมื่อรู้ว่าไม่ได้ส่งมาให้ เขาจดชื่อ{name}ลงบรรทัดใหม่ ใต้ชื่อคนนับช่องตะวันตกคนก่อนๆ อีกสิบเอ็ดชื่อ

        "ยี่สิบสาม" เขาทวนตัวเลขของปีนี้ "คนแรกนับได้สิบสี่ ข้าอยากรู้ว่าถึงรุ่นที่เจ้าต้องสอนคนอื่นจะเป็นเท่าไหร่" แล้วเขาก็ยื่นกุญแจห้องเก็บสมุดของหอให้
      effects: { class: wizard, reputation: { star_hall: 1 }, flags: [path_star_counter] }
    - id: ulwen_pillar
      label: คืนช่องฟ้า บอกว่าจะไปรับใช้เสาของอุลเวน
      requires: { flag: lean_cleric }
      text: |
        เสาของอุลเวนอยู่ห่างบ้านกิ่งลมหนึ่งวันเดิน ลมรอบโคนเสาไม่เคยหยุดพัด นักบวชที่นั่นพูดกันเสียงกระซิบ หันหน้าเข้าหาเสา ตะโกนไปลมก็พาไปที่อื่น ต้องพูดชิดเสาเสียงถึงจะอยู่

        ผู้คุมหอฟังคำของ{name}จบ แล้วบอกว่าตอนเขาอายุเท่านี้ เขาก็อยากไป แต่กลัวว่าลมจะพัดเสียงตัวเองหายไปจนไม่มีใครได้ยิน "ไปเถอะ" เขาว่า "ข้าจะจดตัวโตๆ ไว้"
      effects: { class: cleric, god: ulwen, flags: [path_ulwen_pillar] }
    - id: camp_burners
      label: คืนช่องฟ้า แล้วไม่บอกว่าจะไปไหน
      requires: { flag: lean_rogue }
      text: |
        ผู้คุมหอรอฟังคำต่อไป ไม่มี เขารู้ว่าเด็กที่คืนช่องฟ้าแล้วไม่พูด หมายความว่าอะไร ทั้งป่าไอเลธ ปีนี้{name}เป็นคนที่สองแล้ว

        เขาจดชื่อ{name}ลงบรรทัดเปล่า ไม่จดอะไรตามหลัง คืนนั้นเอง ตอนลงจากหอ มีเอลฟ์หนุ่มคนหนึ่งยืนรออยู่ที่กิ่งแยกครึ่งทาง ผ้าคลุมหน้ามีกลิ่นควันไม้
      effects: { class: rogue, alignment: { law: -1 }, flags: [path_camp_burners] }
    - id: ladder_guard
      label: คืนช่องฟ้า บอกว่าจะเฝ้าบันไดเชือกของหมู่บ้าน
      requires: { flag: lean_warrior }
      text: |
        บ้านกิ่งลมมีบันไดเชือกขึ้นลงอยู่สามเส้น ตั้งแต่ค่ายตัดไม้รุกเข้าป่ามาถึงลำธารใต้หมู่บ้าน ทุกเส้นต้องมีคนเฝ้าทั้งคืน คนเฝ้าบันไดไม่ได้ล่าอะไร ไม่ได้นับอะไร แค่ยืนอยู่ตรงนั้น

        ผู้คุมหอจดชื่อ{name} แล้วควานเสื้อขนแกะเก่าตัวหนึ่งออกมาจากใต้ม้านั่งให้ เป็นของคนเฝ้าบันไดคนก่อน ไหล่ซ้ายมีรอยเย็บทับกันหลายชั้น ตรงที่เชือกบันไดเสียดสีทุกคืน
      effects: { class: warrior, flags: [path_ladder_guard] }
    - id: edge_singer
      label: คืนช่องฟ้า บอกว่าจะลงไปอยู่บ้านตีนไม้ เป็นเสียงระหว่างสองฝั่ง
      requires: { flag: lean_bard }
      text: |
        บ้านตีนไม้แลกเกลือกับบ้านกิ่งลมมาหลายรุ่น แต่สองฝั่งยังคุยกันผ่านคนแปลไม่กี่คน {name}บอกผู้คุมหอว่าจะลงไปอยู่ที่นั่น เรียนภาษามนุษย์ให้คล่องเท่าภาษาตัวเอง แล้วร้องเพลงของฝั่งหนึ่งให้อีกฝั่งฟัง

        ผู้คุมหอหัวเราะจนไอ ไอเสร็จก็ร้องเพลงที่เอลฟ์ร้องตอนส่งศพลงจากกิ่งให้ฟังท่อนหนึ่ง แล้วให้{name}แปลเป็นภาษามนุษย์ตรงนั้น {name}แปลได้ครึ่งท่อน ผู้คุมหอจดชื่อ{name}ลงไปใต้คำที่เขาเพิ่งคิดขึ้นเดี๋ยวนั้น เพราะในสมุดยังไม่มีคำไหนใช้ได้
      effects: { class: bard, flags: [path_edge_singer] }
    - id: bough_life
      label: คืนช่องฟ้า บอกว่าจะอยู่บนกิ่งอย่างที่ทุกคนอยู่
      text: |
        ผู้คุมหอวางกรอบไม้ไผ่ของ{name}ลงบนกอง แล้วจดว่าอยู่บ้าน

        ฤดูนั้น{name}เก็บน้ำผึ้งจากรังบนยอดไม้ แลกเกลือกับบ้านตีนไม้ ซ่อมบันไดเชือกเมื่อมันขาด คืนที่ฟ้าเปิด บางคืนก็เผลอเงยหน้าหาช่องฟ้าทางตะวันตก แล้วนับไปได้ครึ่งหนึ่ง
      effects: { flags: [path_commoner] }

# ---------- เด็กมีเขา เก็บไว้ บ้านโรงสีบน ----------

- id: youth.rite_kept
  stage: youth
  weight: 1000
  when:
    age: [14, 14]
    flags: [origin_marked_kept]
  text: |
    ตลาดจ้างงานปลายฤดูเก็บเกี่ยวจัดที่เมืองตลาดริมรางรถไฟเหมือนทุกปี ป้าคนเล็กพา{name}ไปถึงตอนบ่ายวันสุดท้าย ตอนที่โต๊ะใหญ่เก็บกันไปเกือบหมดแล้ว ป้าเลือกวันนี้เอง ก่อนถึงลานป้าบอกให้ถอดหมวก ถ้าจะให้ใครจ้าง คนจ้างต้องเห็นตั้งแต่วันแรก

    โต๊ะของวิหารเวรัสกับโต๊ะของศาสนจักรตะเกียงยังตั้งติดกันอยู่ คนหลังโต๊ะทั้งสองมองข้ามหัว{name}ไปหาเด็กข้างหลัง คนที่กำลังมัดกระสอบอยู่หลังโต๊ะบริษัทขนถ่านบอกโดยไม่เงยหน้า ว่าไม่ใช่คนที่โต๊ะไม่รับ บริษัทไม่รับ ช่างเวทหนุ่มที่โต๊ะสถาบันเวทหลวงกำลังเก็บกระดาษ บอกตามระเบียบว่าสถาบันรับนักเรียนมีตรา ถ้าซ่อนเขาบนหัวได้มิดทุกวัน หรือมีคนจ่ายค่าเรียนเต็มทั้งหกปี ช่างเวทหนุ่มพูดเสียงเบาจนเหมือนขอโทษ

    ที่ยังอยู่จนวันสุดท้ายคือคนที่ไม่สนเขาบนหัว จ่าผู้เฝ้าผนึกคนหนึ่งที่มาพักหน้าหนาวอยู่โรงเตี๊ยมตลาดยืนตะโกนอยู่หน้าประตูโรงเตี๊ยมว่าป้อมสามรับทุกคนที่มีสองแขน แม่ชีอีเซลสองคนนั่งเย็บผ้า คณะละครเร่ตอกเวที คนแปลกหน้าจากเวนทราสพิงเสาอยู่หัวลาน ข้างโต๊ะสถาบันมีช่างซ่อมจานรับดาวเร่นั่งกินขนมปังอยู่บนกล่องเครื่องมือ

    ท้ายลาน ตาพรานริมป่านั่งอยู่หลังกองหนังกระต่าย ทั้งวันไม่มีเด็กคนไหนเดินไปถึงโต๊ะแก
  choices:
    - id: old_trapper
      label: เดินไปจนสุดลาน ถามตาพรานว่ารับลูกมือไหม
      text: |
        ตาพรานเงยหน้าขึ้นจากหนังกระต่ายที่กำลังขูด ดูหน้า ดูเขา แล้วก้มลงขูดต่อ "ข้าไม่เคยมีลูกมือ" แกว่า "ไม่มีใครอยากนอนในป่ากับคนแก่ปากเหม็น"

        {name}บอกว่าไม่ได้อยากอยู่กับคนแก่ อยากอยู่ในป่า แกหัวเราะจนมีดหลุดมือ แล้วให้{name}ช่วยขนหนังขึ้นหลังลา ขากลับไม่ได้แวะบ้านโรงสีบน แกบอกว่าเดี๋ยวค่อยกลับไปเอาของทีหลัง ป่ารอไม่ได้
      effects: { class: ranger, flags: [path_old_trapper] }
    - id: wardens
      label: ไปหาจ่าผู้เฝ้าผนึกที่หน้าโรงเตี๊ยม
      requires: { flag: lean_warrior }
      text: |
        จ่าเป็นมนุษย์ ไม่มีเขา แต่หน้าซ้ายมีแผลไหม้เป็นแผ่นใหญ่ แกจับแขน{name}ทั้งสองข้าง บีบดูเหมือนบีบผลไม้ แล้วพูดว่าสองแขน ครบ

        "ที่ป้อม คนครึ่งหนึ่งมีเขา" แกว่า "อีกครึ่งก็เลิกนับไปนานแล้ว" ต้นหนาว{name}ขึ้นเกวียนเสบียงไปทางตะวันออกกับเด็กอีกสี่คน สองคนมีเขา สองคนไม่มี ไม่มีใครพูดถึงเรื่องนั้นจนถึงป้อม
      effects: { class: warrior, location_tag: ashland, reputation: { wardens: 1 }, flags: [path_wardens] }
    - id: dock_rats
      label: เดินไปหาคนแปลกหน้าที่พิงเสาอยู่หัวลาน
      requires: { flag: lean_rogue }
      text: |
        คนแปลกหน้าดูเขาบนหัว{name}แค่แวบเดียว แล้วไปดูมือนานกว่า "ที่ท่าเรือ ไม่มีใครดูหัว" เขาว่า "ดูแต่ว่ามือเร็วแค่ไหน" แล้วโยนเหรียญทองแดงมาเหรียญหนึ่ง {name}คว้าได้ก่อนมันตกถึงระดับอก เขาบอกว่ารถไฟเที่ยวค่ำออกตอนตะวันตกดิน ถ้ามาทันก็มา

        {name}มาทัน ป้าคนเล็กยืนส่งที่ชานชาลา ยื่นหมวกไหมพรมใบเก่าให้ บอกว่าเผื่อในเมืองหนาว
      effects: { class: rogue, location_tag: ventras, reputation: { dock_rats: 1 }, flags: [path_dock_rats] }
    - id: dish_tinker
      label: เดินไปหาช่างซ่อมจานรับดาวที่นั่งข้างโต๊ะสถาบัน
      requires: { flag: lean_wizard }
      text: |
        ช่างซ่อมได้ยินที่ช่างเวทหนุ่มพูดทุกคำ แกกลืนขนมปังคำสุดท้าย แล้วบอกว่าแกไม่มีค่าเรียนจะเก็บ ไม่มีระเบียบจะให้ทำตาม มีแต่จานรับดาวไม่กี่ใบตามบ้านผู้ใหญ่บ้านกับโรงสีในหมู่บ้านแถบนี้ ทุกใบรอคนปีนขึ้นไปซ่อม

        ช่างเวทหนุ่มที่โต๊ะสถาบันก็ได้ยิน ตอนเก็บโต๊ะเขาฉีกหน้าหนึ่งจากตำราของตัวเอง พับยื่นให้{name}ก่อนเดินออกจากลาน เป็นหน้าที่วาดขดแก้วไว้ทุกเกลียว
      effects: { class: wizard, flags: [path_dish_tinker] }
    - id: isel
      label: ไปนั่งลงข้างแม่ชีอีเซลสองคนนั้น
      requires: { flag: lean_cleric }
      text: |
        แม่ชีอีเซลสองคนกำลังเก็บผ้าอ้อมลงตะกร้า เตรียมกลับวิหาร พอเห็น{name}เดินมา แม่ชีคนแก่กว่าก็วางตะกร้าลง ตบม้านั่งข้างตัวสองที เธอบอกว่าห้องเด็กของวิหารมีเด็กมีเขาเกือบครึ่งห้อง แม่ชีที่มีอยู่เลี้ยงไม่ไหว ต้องการคนที่ไม่สะดุ้งเวลาเด็กมีเขาร้องกลางดึก

        {name}บอกว่าที่บ้านโรงสีบน คนที่เคยร้องกลางดึกดังที่สุดก็คือตัวเอง แม่ชีหัวเราะ ตกเย็นป้าคนเล็กมารับ แม่ชีบอกป้าว่าไม่ต้องรับกลับแล้ว เด็กจะกลับวิหารไปพร้อมตะกร้าผ้าอ้อม ป้าพยายามทำหน้าเหมือนเสียใจ แต่ทำได้ไม่นาน
      effects: { class: cleric, god: isel, flags: [path_isel_temple] }
    - id: troupe
      label: ไปช่วยคณะละครเร่ตอกเวที
      requires: { flag: lean_bard }
      text: |
        หัวหน้าคณะเห็นเขาบนหัว{name}ก่อนเห็นหน้า แล้วตบมือฉาดเดียว "จอมมาร" เธอว่า "ข้าหาจอมมารมาสามปี ใส่เขาปลอมทีไรหลุดกลางเรื่องทุกที"

        คืนนั้น{name}ได้เล่นเป็นจอมมาร มีบทพูดสามบรรทัด กับตายหนึ่งครั้งตอนจบ คนดูโห่ทุกครั้งที่{name}เดินออกมา และปรบมือดังที่สุดตอน{name}ล้มลง ตอนเก็บเวที หัวหน้าคณะบอกว่าคนดูโห่ดังขนาดนี้ แปลว่าเล่นดี
      effects: { class: bard, flags: [path_troupe] }
    - id: back_to_mill
      label: สวมหมวกกลับ เดินกลับบ้านโรงสีบนกับป้า
      text: |
        {name}สวมหมวกไหมพรมกลับก่อนออกจากลาน ป้าคนเล็กไม่ว่าอะไร ขากลับซื้อขนมทอดให้ห่อหนึ่ง ปกติป้าไม่เคยซื้อของกินที่ตลาด

        โรงสีบนยังต้องการคนแบกกระสอบ ต้องการคนเฝ้ารางน้ำตอนหน้าน้ำหลาก งานพวกนั้นสวมหมวกทำก็ได้
      effects: { flags: [path_commoner] }

# ---------- เด็กมีเขา ซ่อนไว้ในบ้านขุนนาง เวนทราส ----------

- id: youth.rite_hidden
  stage: youth
  weight: 1000
  when:
    age: [14, 14]
    flags: [origin_marked_hidden]
  text: |
    ท่านย่าเรียก{name}เข้าห้องสมุดในเช้าวันเกิดปีที่สิบสี่ บนโต๊ะไม้ดำที่ปกติวางแต่สมุดบัญชี มีกระดาษวางเรียงไว้สี่แผ่น ท่านย่าวางนิ้วลงบนกระดาษทีละแผ่น อธิบายด้วยเสียงเรียบเหมือนอ่านราคาที่ดิน

    แผ่นแรกเป็นหนังสือรับเข้าสถาบันเวทหลวง ใช้ชื่อตระกูล รับเพราะใต้ผมไม่มีอะไรให้ใครเห็น ใต้ผมต้องไม่มีอะไรให้ใครเห็นไปอีกหกปี แผ่นที่สองเป็นจดหมายแนะนำถึงหอเก็บบันทึกของวิหารออสซา บรรณารักษ์ที่นั่นรู้จักท่านย่ามาสี่สิบปี แผ่นที่สามเป็นจดหมายของอัศวินแก่ที่กระท่อมล่าสัตว์ ถึงผู้บัญชาการป้อมสาม แผ่นที่สี่เป็นกุญแจห้องบัญชีของตระกูล วางทับกระดาษเปล่า

    นอกหน้าต่าง พรานเก่าของตระกูลยืนอยู่ที่ประตูรั้วพร้อมย่ามใบเดียว กระท่อมขายไปแล้ว ตระกูลไม่มีเงินจ้างแกอีก
  choices:
    - id: institute
      label: หยิบแผ่นแรก
      text: |
        ท่านย่าไม่ได้ดูโล่งใจ ไม่ได้ดูผิดหวัง แกเลื่อนตะไบอันใหม่จากลิ้นชักมาวางทับหนังสือรับเข้า ตะไบอันนั้นเล็กพอใส่กระเป๋าเสื้อ ด้ามหุ้มหนังสีเดียวกับเสื้อนักเรียนสถาบัน

        "เดือนละครั้ง" ท่านย่าว่า "ห้องน้ำหอพักมีกลอน ข้าถามมาแล้ว"
      effects: { class: wizard, reputation: { royal_institute: 1 }, flags: [path_institute] }
    - id: ossa_archive
      label: หยิบแผ่นที่สอง
      requires: { flag: lean_cleric }
      text: |
        หอเก็บบันทึกของวิหารออสซาอยู่ใต้ดินสามชั้น ชั้นล่างสุดเก็บชื่อคนตายของเวนทราสตั้งแต่วันตั้งเมือง บรรณารักษ์เป็นหญิงแก่ตัวเล็กกว่า{name} รับจดหมายไปอ่านใต้ตะเกียง แล้วเงยหน้าขึ้นดูหัว{name}ตรงๆ เป็นคนแรกนอกบ้านที่ดูตรงนั้นโดยไม่หลบ

        "ข้างล่างนี้ไม่มีใครมาดูหัวใคร" เธอว่า "คนตายไม่สนใจ ส่วนคนเป็นที่ลงมาถึงชั้นนี้ ก็มาเพราะมีเรื่องของตัวเองพออยู่แล้ว"
      effects: { class: cleric, god: ossa, flags: [path_ossa_archive] }
    - id: wardens
      label: หยิบแผ่นที่สาม
      requires: { flag: lean_warrior }
      text: |
        ท่านย่ามองจดหมายในมือ{name}อยู่ครู่หนึ่ง แล้วบอกว่าในจดหมายเขียนชื่อจริง ไม่ได้เขียนชื่อตระกูล อัศวินแก่ขอไว้อย่างนั้น ที่ป้อมสามชื่อตระกูลไม่มีความหมาย และที่นั่นไม่ต้องใช้ตะไบ

        สามวันต่อมา{name}ขึ้นรถไฟขบวนถ่านเที่ยวกลับไปทางตะวันออก ตู้ท้ายขบวนว่าง มีแต่เถ้าติดพื้น
      effects: { class: warrior, location_tag: ashland, reputation: { wardens: 1 }, flags: [path_wardens] }
    - id: old_hunter
      label: ไม่หยิบแผ่นไหน ลงไปหาพรานเก่าที่ประตูรั้ว
      requires: { flag: lean_ranger }
      text: |
        พรานเก่าจะไปอยู่กับลูกสาวที่หมู่บ้านชายป่าไอเลธ แกบอกว่าที่นั่นไม่มีใครรู้จักตระกูลนี้ และคนชายป่าเห็นมาหมดแล้วทุกอย่าง ทั้งเอลฟ์ ทั้งคนเมือง ทั้งของที่เดินออกมาจากป่าตอนกลางคืน เขาบนหัวคนจะเป็นเรื่องเล็กที่สุดที่พวกเขาเคยเห็น

        ท่านย่ายืนดูอยู่ที่หน้าต่างห้องสมุด ไม่ลงมาส่ง แต่ตอนรถม้ารับจ้างออกจากหน้าบ้าน หน้าต่างบานนั้นยังเปิดอยู่
      effects: { class: ranger, location_tag: ileth, flags: [path_old_hunter] }
    - id: servants_stair
      label: ไม่หยิบแผ่นไหน ลงบันไดคนใช้ไปทางท่าเรือ
      requires: { flag: lean_rogue }
      text: |
        บันไดคนใช้ลงไปออกประตูหลังครัว ประตูหลังครัวออกไปตรอก ตรอกพาไปถึงแม่น้ำ {name}รู้ทางนี้มาตั้งแต่สิบขวบ แต่ไม่เคยเดินจนสุด

        คนรับงานที่ท่าเรือมองเสื้อผ้า{name}แวบเดียวก็รู้ว่ามาจากบ้านแบบไหน แต่ที่ถามคือเรื่องเดียว อ่านหนังสือออกไหม พออ่านออก ก็ให้ไปนั่งคัดบัญชีเรือเถื่อนในห้องหลังโกดังตั้งแต่คืนแรก ท่านย่ารู้เรื่องนี้ภายในสามวัน แต่ไม่ส่งใครมาตาม
      effects: { class: rogue, reputation: { dock_rats: 1 }, flags: [path_dock_rats] }
    - id: theater
      label: ไม่หยิบแผ่นไหน ไปโรงละครริมถนนสายตะเกียง
      requires: { flag: lean_bard }
      text: |
        โรงละครริมถนนสายตะเกียงกำลังคัดตัวคนเล่นเป็นปีศาจตัวที่สาม ผู้จัดการโรงแจกเขาปลอมให้ทุกคนที่ต่อแถว เขาไม้ทาสีดำ มีสายรัดใต้คาง {name}สวมลงไปทับตอเขาที่ตะไบไว้ ต้องรวบผมที่หวีปิดมาตลอดชีวิตขึ้นให้สายรัดอยู่ ในกระจกหลังเวที เขาไม้คู่นั้นดูเหมือนงอกออกมาจากหัวจริงๆ

        ผู้จัดการโรงบอกว่าไม่เคยเห็นใครใส่เขาคู่นี้แล้วเข้ากับหัวขนาดนี้ แล้วจ้างทันที คืนนั้นท่านย่านั่งอยู่แถวหลังสุดของโรง ดูจนจบ แล้วออกไปก่อนไฟจะเปิด
      effects: { class: bard, flags: [path_theater] }
    - id: account_keys
      label: หยิบกุญแจห้องบัญชี
      text: |
        กระดาษเปล่าใต้กุญแจคือรายชื่อหนี้ของตระกูล ท่านย่าบอกว่ายังไม่ได้เขียน เพราะเขียนลงไปแล้วจะเห็นว่ายาวแค่ไหน

        ตั้งแต่วันนั้น{name}นั่งโต๊ะไม้ดำในห้องสมุดทุกเช้า เขียนหนี้ลงไปทีละบรรทัด ท่านย่านั่งเก้าอี้ริมหน้าต่างตัวเดิม เหมือนตอนที่นั่งดูหมอตะไบเขาทุกเดือน
      effects: { flags: [path_commoner] }

# ---------- เด็กวิหารอีเซล ----------

- id: youth.rite_foundling
  stage: youth
  weight: 1000
  when:
    age: [14, 14]
    flags: [origin_marked_foundling]
  text: |
    วิหารเลี้ยงเด็กไว้จนอายุสิบสี่ ธรรมเนียมของแม่ชีโทเรนคือในวันที่วิหารถือว่าเป็นวันเกิดปีที่สิบสี่ แกจะเปิดหีบใต้แท่นเป็นครั้งสุดท้าย เอาของที่ติดตัวเด็กมาวางใส่มือ แล้วถามว่าจะไปไหน

    กระสอบแป้งที่พับไว้สิบสี่ปียังเห็นตราโรงสีเลือนอยู่ครึ่งหนึ่ง กระดุมดีบุกเม็ดนั้นมีรอยเขียวขึ้นตามร่องลาย แม่ชีโทเรนวางทั้งสองอย่างลงในมือ{name} แล้วนั่งลงบนม้านั่ง

    แกไล่ให้ฟังทีละอย่าง เหมือนอ่านรายการของในครัว อยู่ต่อเป็นผู้ฝึกหัดของอีเซลก็ได้ ป้อมสามในแดนเถ้ารับเด็กวิหารทุกปี แกเขียนจดหมายไปให้ได้ ช่างคนแคระเร่ที่ซ่อมของให้วิหารมาหลายปีตอบจดหมายมาว่าโรงซ่อมของเธอในเวนทราสขาดลูกมือ พรานที่หมู่บ้านรอบทุ่งลงขันกันจ้างมาล่าหมาป่า ตั้งแต่หน้าหนาวปีที่หมาป่าลงมาถึงคอกวิหาร พักอยู่โรงม้าของวิหาร บอกไว้ว่าไม่สนว่าลูกมือมีเขากี่ข้าง ขอแค่เดินเงียบ คณะละครที่มาเล่นที่ลานวิหารทุกปลายเก็บเกี่ยวก็มาถึงเมื่อวาน

    มีอย่างเดียวที่แกไม่ได้พูด เด็กวิหารรุ่นพี่ที่หนีไปเวนทราสเมื่อสองปีก่อนเขียนจดหมายกลับมาถึง{name}ฉบับหนึ่ง บอกว่าที่ท่าเรือมีคนรับทุกคน
  choices:
    - id: stay_novice
      label: ขออยู่ต่อเป็นผู้ฝึกหัดของอีเซล
      text: |
        แม่ชีโทเรนไม่ได้ยิ้ม แกลุกขึ้นไปหยิบผ้าคลุมสีเทาผืนหนึ่งจากตู้ ผ้าที่ผู้ฝึกหัดใส่ ยื่นให้ แล้วบอกว่าพรุ่งนี้เวรตักน้ำตอนตีสี่เป็นของ{name}

        คืนนั้น{name}เอากระดุมดีบุกร้อยด้ายแดงผูกข้อมือ เหมือนวันแรกที่มาถึง แม่ชีโทเรนเห็นแล้วไม่ว่าอะไร
      effects: { class: cleric, god: isel, flags: [path_isel_temple] }
    - id: wardens
      label: ขอให้แม่ชีโทเรนเขียนจดหมายไปป้อมสาม
      requires: { flag: lean_warrior }
      text: |
        แม่ชีโทเรนเขียนจดหมายคืนนั้นเลย เขียนสั้นกว่าที่{name}คิด สามบรรทัด ชื่อ อายุ กับประโยคสุดท้ายที่แกปิดไว้ไม่ให้ดู

        ป้อมสามตอบกลับมาในเดือนเดียว ส่งตั๋วเกวียนเสบียงมาให้หนึ่งใบ วันออกเดินทางแม่ชีโทเรนเดินมาส่งที่กำแพงข้างช่องส่งขนมปัง ไม่ใช่ประตูหน้า แกบอกว่าเด็กวิหารทุกคนออกไปจากตรงนี้ ตรงเดียวกับที่เข้ามา
      effects: { class: warrior, location_tag: ashland, reputation: { wardens: 1 }, flags: [path_wardens] }
    - id: dock_rats
      label: ไม่บอกใคร เก็บจดหมายของรุ่นพี่ใส่เสื้อ แล้วออกเดินไปทางเวนทราส
      requires: { flag: lean_rogue }
      text: |
        {name}ออกไปตอนตีสาม ระหว่างที่แม่ชีเวรดึกหลับ ทางไปเวนทราสคือทางรถไฟ เดินตามรางไปสามวันก็ถึง

        ที่ท่าเรือ รุ่นพี่พูดจริง คนรับงานถามชื่อ {name}บอกชื่อที่วิหารตั้ง เขาหัวเราะ บอกว่าชื่อตามฟ้าเช้าแบบนี้ที่ท่ามีอยู่สิบกว่าคนแล้ว ทุกคนมาจากวิหารเดียวกัน

        ครึ่งเดือนต่อมามีจดหมายจากแม่ชีโทเรนมาถึงท่าเรือ ไม่รู้ว่าแกรู้ได้อย่างไรว่าต้องส่งมาที่นี่ ในซองมีแต่ด้ายแดงเส้นหนึ่ง
      effects: { class: rogue, location_tag: ventras, reputation: { dock_rats: 1 }, flags: [path_dock_rats] }
    - id: tinker
      label: ขอไปเป็นลูกมือช่างคนแคระที่เวนทราส
      requires: { flag: lean_wizard }
      text: |
        โรงซ่อมของช่างคนแคระอยู่ใต้สะพานหินในย่านริมแม่น้ำ กว้างเท่าห้องยาวของวิหาร มีของรอซ่อมกองจนถึงเพดาน เครื่องสูบน้ำ ตะเกียงฟ้า นาฬิกา แขนกลของทหารผ่านศึกที่ไม่มีเงินไปหาช่างในทุนดาร์

        เธอไม่ทักทาย ยื่นตะเกียงฟ้าที่ขดแก้วร้าวมาให้ดวงหนึ่ง บอกว่าถ้าดูออกว่าร้าวตรงไหนก่อนเที่ยง ได้กินข้าวเที่ยง

        {name}หาเจอตอนบ่ายคล้อย ร้าวสองที่ ไม่ใช่ที่เดียว เธอบอกว่าข้าวเที่ยงหมดแล้ว แต่เพราะเจอสองที่ มื้อเย็นได้สองชาม
      effects: { class: wizard, location_tag: ventras, flags: [path_tinker_apprentice] }
    - id: return_fitting
      label: เอาข้อต่อทองเหลืองที่ซ่อนไว้ไปคืนช่างคนแคระที่เวนทราส
      requires: { flag: tinker_brass_fitting }
      text: |
        ข้อต่อทองเหลืองยังอยู่ในผ้ากระสอบแป้งที่แม่ชีโทเรนเพิ่งวางใส่มือ {name}รู้สึกถึงน้ำหนักของมันตั้งแต่แกยังพูดไม่จบ

        สามวันต่อมา{name}เดินตามรางรถไฟไปถึงเวนทราส หาโรงซ่อมใต้สะพานหินจนเจอ แล้ววางห่อผ้าลงบนโต๊ะช่าง ช่างคนแคระแกะผ้าออก มองข้อต่อ แล้วมองหน้า{name}

        "ข้านับของในกล่องทุกคืน" เธอว่า "ทุกคืนขาดชิ้นนี้ชิ้นเดียว" แล้วชี้กองของรอซ่อมที่สูงถึงเพดาน บอกว่าค่าเช่าข้อต่อต้องทำงานใช้ เริ่มจากกองนั้น
      effects: { class: wizard, location_tag: ventras, flags: [path_tinker_apprentice] }
    - id: wolf_hunter
      label: ไปหาพรานล่าหมาป่าที่พักอยู่โรงม้าของวิหาร
      requires: { flag: lean_ranger }
      text: |
        พรานคนนั้นพูดน้อยกว่าแม่ชีโทเรนอีก เขาให้{name}เดินรอบลานวิหารหนึ่งรอบ ฟังเสียงเท้าบนกรวด แล้วส่ายหัว ให้เดินใหม่ สามรอบกว่าเขาจะเลิกส่ายหัว

        ต้นหนาวเขาพา{name}ออกไปตั้งค่ายที่ป่าทางเหนือของทุ่ง ห่างเสาของอีเซลครึ่งวันเดิน จากหน้าค่ายยังเห็นเสาของอีเซลพุ่งหายเข้าเมฆ แต่ไม่ได้ยินระฆังวิหารแล้ว
      effects: { class: ranger, flags: [path_wolf_hunter] }
    - id: troupe
      label: ไปหาคณะละครที่มาถึงลานวิหารเมื่อวาน
      requires: { flag: lean_bard }
      text: |
        คณะละครคณะนี้มาเล่นที่วิหารทุกปี {name}ดูมาตั้งแต่จำความได้ รู้บททุกเรื่องที่พวกเขาเล่น รู้ด้วยว่าตรงไหนที่คนเล่นจำบทผิดทุกปี

        หัวหน้าคณะให้{name}ท่องบทที่ผิดทุกปีให้ฟัง {name}ท่องได้ทั้งแบบที่ถูกและแบบที่พวกเขาเล่นผิด หัวหน้าคณะหัวเราะ บอกว่าปีหน้าจะเล่นแบบผิดต่อไป เพราะคนดูชินแล้ว แต่จะจ้าง{name}ไว้กระซิบบทหลังม่าน
      effects: { class: bard, flags: [path_troupe] }
    - id: temple_worker
      label: ไม่บวช ไม่ไปไหน ขอทำงานในครัวและนาของวิหาร
      text: |
        แม่ชีโทเรนบอกว่าวิหารมีคนแบบนี้อยู่เจ็ดคน ทุกคนเคยเป็นเด็กในห้องยาว ไม่มีใครบวช ไม่มีใครไป แม่ครัวคนปัจจุบันก็เป็นหนึ่งในนั้น

        {name}ย้ายจากห้องยาวไปนอนห้องเล็กหลังครัว ห้องที่มีหน้าต่างหันออกทุ่ง ทุกเช้าเห็นฟ้าก่อนคนอื่นในวิหาร บางเช้าก็นึกว่าถ้าวันนี้มีตะกร้ามาที่ช่องส่งขนมปัง เด็กคนนั้นจะได้ชื่อว่าอะไร
      effects: { flags: [path_commoner] }

# ---------- แดนเถ้า บ้านหญ้าเงิน ----------

- id: youth.rite_ashland
  stage: youth
  weight: 1000
  when:
    age: [14, 14]
    flags: [origin_ashland]
  text: |
    เด็กบ้านหญ้าเงินที่อายุครบสิบสี่ต้องออกไปนอนบนเถ้าคนเดียวหนึ่งคืน ไกลจากแผ่นไม้ปูทางเกินเสียงตะโกน ไม่มีตะเกียง มีผ้าห่มหนึ่งผืนกับน้ำหนึ่งกระบอก ตอนเช้าเดินกลับมาเอง แล้วไปบอกผู้ใหญ่บ้านว่าจะทำอะไรต่อจากนี้ ผู้ใหญ่บ้านจดลงสมุด คนที่เดินกลับมาไม่ได้ก็ไม่ต้องจด

    คืนนั้นไม่มีลม {name}นอนหงายบนเถ้า ตอเสาของอัสเทลดำทึบอยู่ทางตะวันออก ดำกว่าฟ้าที่อยู่ข้างหลัง ใต้เถ้าลึกลงไปมีแสงแดงจางๆ ลอดขึ้นมาตามรอยแยกบางรอย อุ่นเหมือนนอนบนหลังสัตว์ใหญ่ที่หลับอยู่ ไกลออกไปมีหมาเถ้าเดินผ่านสองตัว ถ่านในอกสว่างตามจังหวะหายใจ ทั้งสองตัวไม่หันมา

    ตอนฟ้าสาง{name}เดินกลับมาตามรอยเท้าของตัวเอง ผู้ใหญ่บ้านนั่งรออยู่บนชาน สมุดเปิดค้างไว้บนเข่า
  choices:
    - id: fort_three
      label: บอกว่าจะไปป้อมสาม
      text: |
        ผู้ใหญ่บ้านจดลงไปทันที คำว่าป้อมสามในสมุดเล่มนี้มีเยอะจนกินไปครึ่งเล่ม เดือนนั้นจ่ามอร์เดนผ่านมารับจดหมาย แกให้{name}ซ้อนท้ายม้ากลับป้อมไปด้วย ไม่ต้องเดินบนแผ่นไม้ครึ่งวันเหมือนเด็กรุ่นก่อน {father}เดินมาส่งถึงปลายแผ่นไม้ ยื่นขวานด้ามสั้นของบ้านให้ ที่ป้อมไม่ใช้ขวาน แต่{name}รับไว้

        ที่ป้อม ผู้เฝ้าผนึกที่ประตูยื่นหอกยาวให้หนึ่งเล่ม กับลูกพลับแห้งหนึ่งลูก บอกว่าลูกพลับเป็นของคนมาใหม่ หอกต้องคืนตอนตาย
      effects: { class: warrior, reputation: { wardens: 1 }, flags: [path_wardens] }
    - id: crossing_crew
      label: บอกว่าจะไปทำงานกับคนที่พาเด็กมีเขาข้ามแดนมา
      requires: { flag: lean_rogue }
      text: |
        ผู้ใหญ่บ้านวางปากกา ไม่จดอะไร แล้วบอกว่าคำนี้ไม่ต้องจด ใครๆ ก็รู้ว่ามีคนทำงานแบบนั้นอยู่ ไม่มีใครรู้ว่าเป็นใคร และไม่มีใครอยากให้ศาสนจักรตะเกียงรู้ว่ามีชื่ออยู่ในสมุดของหมู่บ้านไหน

        เจ็ดวันต่อมามีเกวียนบรรทุกฟางผ่านบ้านหญ้าเงินตอนกลางคืน คนขับเกวียนจอดหน้าบ้าน{name} เคาะประตูสามที ใต้กองฟางมีที่ว่างพอให้คนนอนได้สี่คน
      effects: { class: rogue, alignment: { law: -1, moral: 1 }, flags: [path_crossing_crew] }
    - id: mine_tech
      label: บอกว่าจะไปเป็นลูกมือช่างเวทของบริษัทที่หลุมเก้า
      requires: { flag: lean_wizard }
      text: |
        ผู้ใหญ่บ้านจดช้าๆ แล้วเงยหน้าขึ้นมา บอกว่าช่างเวทของบริษัทรู้เรื่องผีถ่านมากกว่าใครในแดนเถ้า รู้เรื่องที่ไม่มีใครอยากรู้ด้วย แต่ไม่เคยบอกคนงานเลยสักเรื่อง

        ช่างเวทเป็นคนแคระแก่ที่ไม่ยอมลงหลุมเอง เขาให้{name}ถือตะเกียงลงไปแทน ตะเกียงดวงนั้นแปลกกว่าทุกดวงที่เคยเห็น ถ้ามีผีถ่านอยู่ในระยะสิบก้าว เปลวไฟจะเอนเข้าหามัน
      effects: { class: wizard, flags: [path_mine_tech] }
    - id: ossa_fort
      label: บอกว่าจะไปเป็นมือให้นักบวชออสซาที่ป้อมสาม
      requires: { flag: lean_cleric }
      text: |
        ผู้ใหญ่บ้านจดลงไป แล้วบอกว่านักบวชออสซาที่ป้อมสามเหลืออยู่สองคน คนหนึ่งมือสั่นจนจับสิ่วไม่อยู่ ทุกหมู่บ้านในแดนเถ้ามีชื่อรอสลักบนแผ่นหิน รอนานจนบางชื่อคนในหมู่บ้านเริ่มลืมแล้ว

        นักบวชมารับตัว{name}เอง ขี่ม้าตัวเดียวกับที่เคยขี่มาสลักชื่อ ขากลับแกแวะลานศพของบ้านหญ้าเงิน ให้{name}ลูบรอยประตูปิดที่หัวแผ่นหินหนึ่งที แล้วค่อยออกเดินทาง
      effects: { class: cleric, god: ossa, reputation: { wardens: 1 }, flags: [path_ossa_fort] }
    - id: ash_guide
      label: บอกว่าจะนำทางคนข้ามเถ้า
      requires: { flag: lean_ranger }
      text: |
        คนนำทางในแดนเถ้ามีไม่ถึงสิบคน ทุกคนรู้จักกัน ทุกคนเคยเสียใครสักคนให้เถ้า ผู้ใหญ่บ้านจดลงสมุด แล้วบอกชื่อคนนำทางแก่คนหนึ่งที่อยู่บ้านตอไหม้ ห่างไปสองวันเดิน

        คนนำทางแก่คนนั้นเดินเท้าเปล่าบนเถ้า ฝ่าเท้าด้านจนเหมือนพื้นรองเท้า เดินโดยไม่มองพื้น วันแรกแกให้{name}เดินนำ แล้วเดินตามหลังมาห่างๆ ทั้งวัน ตกเย็นถึงบอกว่า{name}เดินผิดไปสามครั้ง แต่ทั้งสามครั้งยังไม่ตาย
      effects: { class: ranger, flags: [path_ash_guide] }
    - id: news_walker
      label: บอกว่าจะเดินข่าวระหว่างหมู่บ้านในแดนเถ้า
      requires: { flag: lean_bard }
      text: |
        หมู่บ้านทีฟลิ่งในแดนเถ้ากระจายอยู่รอบตอเสา ห่างกันสองวันบ้าง ห้าวันบ้าง จดหมายที่จ่ามอร์เดนรับไปส่งออกไปนอกแดนเถ้า แต่ระหว่างหมู่บ้านด้วยกันไม่มีใครส่งอะไรให้ใคร เรื่องที่เหลือต้องมีคนเดินไปเล่า ใครคลอด ใครตาย หลุมไหนถล่ม ศาสนจักรตะเกียงไปล่าใครที่ไหน

        ผู้ใหญ่บ้านจด แล้วเล่าเรื่องแรกที่{name}ต้องเอาไปเล่าต่อให้ฟังเดี๋ยวนั้น เรื่องลุงโอเบนที่หลุมเก้า เรื่องคนแคระสามคนที่มาสำรวจเนินหินดำ เรื่องป้อมสามขอคนเพิ่มอีกสิบคนก่อนหน้าหนาว
      effects: { class: bard, flags: [path_news_walker] }
    - id: pit_nine
      label: บอกว่าจะลงหลุมเก้าเหมือนคนอื่น
      text: |
        ผู้ใหญ่บ้านจดลงไป คำนี้ในสมุดมีเกือบเท่าคำว่าป้อมสาม แกปิดสมุด บอกว่ากะเช้าเริ่มก่อนฟ้าสาง ให้ไปยืนรอที่ปากหลุมกับคนอื่น

        เช้าวันแรก{name}ยืนอยู่ปากหลุมเก้าในหมวกตะเกียงที่ใหญ่เกินหัว คนกะเช้าร้องเพลงลงหลุม ร้องท่อนแรกช้าๆ เหมือนรอให้คนมาใหม่จำได้ก่อนถึงก้นหลุม
      effects: { flags: [path_commoner] }
