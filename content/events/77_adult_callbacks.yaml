# ชุด 3a วัยผู้ใหญ่ อายุ 19 ถึง 24: ผลตามมาจากวัยเด็กและวัยรุ่น น้ำหนัก 10
# เวลน์ (ค้ำหนี้) เรือเหาะตก แม่ชีโทเรน ท่านย่า โนริค นักล่าแม่มด
# เบเลคไม่ขีดบรรทัดไหนในสัญญาทิ้ง คำสาบานของเบเลคทำให้ปลายนิ้วเย็นวาบ (จาก youth.commoner_belek_guarantor)
# เด็กวิหาร (origin_marked_foundling) ไม่เห็น {father} {mother}

- id: adult.welen_default
  stage: adult
  scene: market
  weight: 10
  when:
    age: [19, 22]
    flags: [belek_guarantor]
  text: |
    เสมียนวิหารเบเลคเรียกชื่อ{name}ข้ามหัวคนในตลาด เสียงไม่ดัง แต่คนที่ได้ยินหลีกทางให้ เพราะรู้ว่าเสียงแบบนี้เรียกใครแล้วแปลว่าอะไร

    เวลน์จ่ายหนี้ตรงเวลายี่สิบเดือน แล้วหยุดจ่ายไปตั้งแต่สี่เดือนก่อน ไม่มีใครเห็นเขาในถิ่นตั้งแต่นั้น หนี้เหลือหกเหรียญ เสมียนเปิดสมุดให้ดูลายมือของ{name}ใต้บรรทัดผู้ค้ำ ตอนที่{name}มองลายมือนั้น ปลายนิ้วที่เคยวางบนสมุดเล่มนี้เย็นวาบขึ้นมาอีกครั้ง
  choices:
    - id: pay_it_all
      label: จ่ายทั้งหมดเดี๋ยวนี้ ให้จบ
      requires: { min_gold: 6 }
      text: |
        {name}นับเหรียญวางบนผ้าปูโต๊ะสีเทาหกเหรียญ เสมียนนับซ้ำ แล้วเขียนคำว่าครบไว้ท้ายบรรทัดผู้ค้ำ ด้วยหมึกสีเดียวกับบรรทัดอื่น ปลายนิ้วของ{name}อุ่นกลับมาก่อนเสมียนจะปิดสมุด

        เงินที่เก็บไว้ทั้งปีหายไปในเช้าเดียว ส่วนเวลน์ยังไม่มีใครเห็น
      effects: { gold: -6, alignment: { law: 1 }, reputation: { belek_bank: 1 }, flags: [paid_welens_debt] }
    - id: find_welen
      label: ขอเวลาสิบวัน ออกไปตามหาเวลน์
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ตามข่าวไปจนเจอเวลน์ที่โรงพยาบาลคนจนท้ายเมือง เขานอนอยู่บนเสื่อ ขาข้างหนึ่งพันผ้า งานที่ใหม่ล้มทับขาเขาเมื่อสี่เดือนก่อน ระหว่างนั้นพ่อของเขาตาย แขนกลที่ซื้อด้วยเงินกู้ขายไปเป็นค่าฝังศพ เขาบอกว่าไม่กล้ากลับไปเจอหน้า{name} รอให้ขาหายก่อน จะได้มีงานทำแล้วค่อยกลับไปจ่าย

          {name}จ่ายเสมียนไปครึ่งหนึ่ง อีกครึ่งเวลน์จ่ายเองทีละครึ่งเหรียญตั้งแต่เดือนที่ขาเขาเดินได้ เขาจ่ายครบภายในปีนั้น และมานั่งกินข้าวเย็นกับ{name}ทุกวันที่จ่ายเสร็จ
        effects: { debt: true, gold: -3, stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [found_welen, welen_friend] }
      failure:
        text: |
          {name}ตามหาเวลน์ทั้งสิบวัน ถามทุกคนที่เคยทำงานกับเขา ทุกคนบอกว่าเขาไปทำงานที่ไหนสักแห่งทางตะวันออก บางคนว่าเหมือง บางคนว่าท่าเรือ ไม่มีใครรู้แน่

          วันที่สิบเอ็ด{name}กลับมาจ่ายเสมียนครบ บวกค่าปรับเพิ่มสำหรับสิบวันนั้นอีกหนึ่งเหรียญ เสมียนเขียนคำว่าครบท้ายบรรทัด แล้วบอกว่าคนที่หายไปส่วนใหญ่ไม่กลับมา ส่วนคนค้ำไม่เคยหายไปไหน
        effects: { debt: true, gold: -7, stats: { WIS: 1 }, flags: [welen_vanished] }
    - id: pay_monthly
      label: ขอจ่ายแทนเป็นรายเดือน เดือนละเหรียญ
      text: |
        เสมียนเปิดหน้าใหม่ในสมุด เขียนสัญญาใหม่ใต้สัญญาเดิม ผู้ค้ำกลายเป็นผู้กู้ ให้{name}วางมือบนสมุดอีกครั้ง ปลายนิ้วเย็นวาบขึ้นมาตอนคำสาบานคำสุดท้าย เหมือนเมื่อหลายปีก่อนทุกอย่าง

        ทุกต้นเดือนหลังจากนั้น{name}เดินไปโต๊ะสีเทาในตลาด จ่ายหนึ่งเหรียญ แล้วเดินกลับ แปลกตรงที่ไม่ได้คิดถึงเวลน์ด้วยความโกรธ คิดถึงแต่แขนเหล็กของพ่อเขาที่ยกถังน้ำได้ในวันแรก
      effects: { debt: true, gold: -1, alignment: { law: 1 }, reputation: { belek_bank: 1 }, flags: [owes_welens_debt] }

- id: adult.airship_vials
  stage: adult
  scene: home
  weight: 10
  when:
    age: [19, 24]
    flags: [looted_airship]
  text: |
    ชายคนนั้นเดินขากะเผลก ไม้ค้ำรักแร้ข้างหนึ่ง เสื้อคลุมของบริษัทเดินเรือ เขามาหา{name}ถึงที่พัก ในมือถือขวดน้ำค้างดาวเปล่าขวดหนึ่ง ก้นขวดสลักเลขสามตัว เขาบอกว่าขวดของบริษัททุกขวดสลักเลขแบบนี้ ขวดนี้ร้านรับซื้อของเก่าในตลาดตะวันตกจำได้ว่าใครเอามาขาย

    เขาเป็นหนึ่งในลูกเรือสองคนที่คลานออกมาจากซากเรือเหาะลำนั้นได้เอง เขาไม่ได้มาเอาขวดคืน เขาบอกว่าบริษัทจ่ายเงินชดเชยให้ครอบครัวลูกเรือที่ตายในหน้าที่ แต่บริษัทเขียนในรายงานว่าคนที่ติดอยู่ใต้โครงเหล็กตายตั้งแต่เรือกระแทกพื้น ไม่ใช่ตายในไฟ ครอบครัวของเขาจึงไม่ได้อะไร คนที่อยู่ตรงนั้นวันนั้นมีไม่กี่คน
  choices:
    - id: tell_the_truth
      label: บอกเขาว่าคนนั้นยังตะโกนอยู่ใต้โครงเหล็กตอนที่ตัวเองไปถึง
      text: |
        {name}เล่าทุกอย่าง เสียงตะโกนใต้โครงเหล็ก ไฟที่เริ่มลุกที่ถุงลม ขวดที่กลิ้งอยู่ห่างจากซาก และสิ่งที่{name}เลือกทำก่อน ชายคนนั้นฟังจนจบ ไม่ได้ขัด ไม่ได้จด

        สองเดือนต่อมาบริษัทส่งจดหมายเรียก{name}ไปให้ปากคำ {name}ไปตามนัด เล่าทั้งเรื่องเสียงตะโกนและเรื่องขวด บริษัทจ่ายเงินชดเชยให้ครอบครัวนั้นครบ แล้วส่งใบแจ้งหนี้ค่าขวดน้ำค้างดาวห้าขวดมาถึงที่พักของ{name}ในสัปดาห์เดียวกัน
      effects: { debt: true, gold: -5, alignment: { moral: 2, law: 1 }, flags: [confessed_airship_loot] }
    - id: deny_it
      label: บอกว่าไม่เคยไปที่นั่น ขวดนั้นซื้อต่อมาจากคนอื่น
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}เล่าเรื่องคนขายขวดที่ไม่มีอยู่จริง ผมสีอะไร พูดสำเนียงไหน ขายที่ตลาดไหน ชายคนนั้นฟังจนจบ แล้วพยุงตัวลุกขึ้นด้วยไม้ค้ำ บอกว่าเข้าใจ เขาจะไปตามหาคนนั้นต่อ

          เขาไม่กลับมาอีก {name}ไม่เคยรู้ว่าครอบครัวนั้นได้เงินชดเชยหรือไม่ ขวดเปล่าที่สลักเลขสามตัวเขาทิ้งไว้บนโต๊ะ
        effects: { stats: { CHA: 1 }, alignment: { moral: -1 }, flags: [lied_to_airship_crew] }
      failure:
        text: |
          ชายคนนั้นฟังเรื่องคนขายขวดได้ครึ่งเดียว แล้วบอกว่าร้านรับซื้อของเก่าจำได้ด้วยว่าคนที่เอาขวดมาขายชอบเอานิ้วเคาะขอบโต๊ะระหว่างรอเงิน {name}ก้มลงมอง นิ้วของตัวเองกำลังเคาะขอบโต๊ะอยู่

          เขาไม่ถามอะไรอีก ลุกขึ้นแล้วเดินออกไป เดือนต่อมาบริษัทส่งใบแจ้งหนี้ค่าขวดน้ำค้างดาวมาให้ ห้าขวด พร้อมจดหมายแจ้งว่าชื่อของ{name}อยู่ในบัญชีคนที่บริษัทไม่รับขึ้นเรือ
        effects: { gold: -5, alignment: { moral: -1 }, flags: [airship_company_blacklist] }
    - id: give_the_money
      label: ไม่ตอบเรื่องคนใต้โครงเหล็ก ให้เงินที่ขายขวดได้กับครอบครัวนั้นแทน
      requires: { min_gold: 8 }
      text: |
        {name}นับเหรียญใส่ถุงผ้าแปดเหรียญ ขาดจากที่ขายขวดได้แค่สองเหรียญ ยื่นให้ชายคนนั้น บอกว่าให้เอาไปให้ครอบครัวนั้น ไม่ต้องบอกว่ามาจากใคร

        เขาถือถุงผ้าไว้ในมือข้างที่ไม่ได้ถือไม้ค้ำ ชั่งน้ำหนักอยู่ครู่หนึ่ง แล้วบอกว่าครอบครัวนั้นจะได้เงินก้อนนี้ แต่ในรายงานของบริษัท คนคนนั้นจะตายตั้งแต่เรือกระแทกพื้นไปตลอด ไม่มีใครแก้
      effects: { gold: -8, alignment: { moral: 1 }, flags: [paid_airship_family] }

- id: adult.toren_old
  stage: adult
  scene: temple
  weight: 10
  when:
    age: [19, 24]
    flags: [origin_marked_foundling]
  text: |
    จดหมายจากวิหารอีเซลเขียนด้วยลายมือของแม่ชีอายุน้อยคนหนึ่ง แจ้งว่าแม่ชีโทเรนตาฝ้าจนอ่านหนังสือสวดไม่ได้แล้ว แกไม่ยอมให้ใครเขียนจดหมายแทน นอกจากฉบับนี้ ฉบับเดียว เรียก{name}กลับไปที่วิหาร

    {name}ไปถึงตอนค่ำ แม่ชีโทเรนนั่งเฝ้าไฟในชามหน้าแท่นอยู่บนม้านั่งตัวเดิม แกจำเสียงเท้าของ{name}ได้ตั้งแต่ประตู บอกให้มานั่งข้างๆ เหมือนตอนเด็ก แล้ววางห่อผ้าเก่าห่อหนึ่งลงบนตัก{name} เป็นกระสอบแป้งที่ห่อ{name}มาในตะกร้าเมื่อยี่สิบปีก่อน ตราโรงสียังเลือนอยู่ครึ่งหนึ่งเหมือนเดิม ตั้งแต่ตาเริ่มฝ้า แกย้ายมันจากหีบใต้แท่นมาเก็บในหีบใต้เตียงของแกเอง กลัวว่าวันหนึ่งจะคลำหาไม่เจอ
  choices:
    - id: ask_why
      label: ถามแกว่าเก็บไว้ทำไม
      text: |
        แม่ชีโทเรนไม่ตอบทันที แกเติมน้ำมันลงชามไฟก่อน มือสั่นจนน้ำมันหกลงขอบชาม แกบอกว่าเด็กทุกคนในวิหารนี้ไม่มีอะไรติดตัวมาเลย ยกเว้น{name} ที่มีกระสอบใบนี้กับกระดุมดีบุกหนึ่งเม็ด แกคิดมาตลอดว่าถ้าวันหนึ่ง{name}อยากรู้ว่ามาจากไหน ก็ควรมีอะไรให้เริ่ม ถ้าไม่อยากรู้ ก็เอาไว้ห่อของ

        คืนนั้นสองคนนั่งเฝ้าไฟด้วยกันจนสาง แม่ชีโทเรนหลับคอพับไปตอนตีสาม {name}เติมน้ำมันแทนทุกชั่วยาม
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, items: [flour_sack_scrap], flags: [toren_gave_sack, kept_toren_vigil] }
    - id: look_for_mill
      label: ถามว่าตราโรงสีบนกระสอบเป็นของโรงสีไหน
      habit: curious
      check: { stat: INT, dc: 13 }
      success:
        text: |
          แม่ชีโทเรนบอกว่าแกเคยเขียนจดหมายถามโรงสีทุกโรงในถิ่นเมื่อยี่สิบปีก่อน ไม่มีโรงไหนตอบ {name}เอากระสอบไปส่องกับไฟในชาม ตราครึ่งที่เหลืออยู่เป็นรูปกงล้อน้ำ มีตัวอักษรเลือนอยู่สองตัวใต้กงล้อ

          {name}จำตัวอักษรทั้งสองตัวไว้ แม่ชีโทเรนบอกว่าจะสวดให้ทุกเช้า ทั้งที่ไม่รู้ว่าจะสวดให้หาเจอหรือสวดให้หาไม่เจอ
        effects: { stats: { INT: 1 }, items: [flour_sack_scrap], flags: [toren_gave_sack, knows_mill_letters] }
      failure:
        text: |
          ตราบนกระสอบเลือนเกินจะอ่านได้ {name}ส่องกับไฟในชามจนตาแสบ เห็นแค่รูปวงกลมที่อาจเป็นกงล้อ หรืออาจเป็นอะไรก็ได้

          แม่ชีโทเรนบอกว่าแกก็ส่องมายี่สิบปี เห็นแค่นั้นเหมือนกัน แล้วหัวเราะออกมาครั้งแรกตั้งแต่{name}รู้จักแก
        effects: { stats: { WIS: 1 }, items: [flour_sack_scrap], flags: [toren_gave_sack] }
    - id: give_it_back
      label: วางกระสอบกลับลงบนตักแก บอกว่าบ้านของตัวเองคือที่นี่
      text: |
        แม่ชีโทเรนลูบกระสอบบนตักตัวเองอยู่นาน แล้วบอกว่าเด็กทุกคนในวิหารพูดแบบนี้ตอนอายุยี่สิบ พออายุสามสิบก็อยากรู้ขึ้นมา แกจะเก็บไว้ให้ในหีบใบเดิม ถ้าแกตายก่อน แม่ชีอายุน้อยที่เขียนจดหมายรู้ว่าหีบอยู่ที่ไหน

        ก่อนกลับ{name}เติมน้ำมันลงชามไฟให้เต็ม เปลวไฟยืดสูงขึ้นจนแสงถึงหน้าแก ตาของแกแทบมองไม่เห็นอะไรแล้ว แต่แกก็ยังหันหน้าเข้าหาแสง
      effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [left_sack_with_toren] }

- id: adult.grandmother_old
  stage: adult
  scene: noble_hall
  weight: 10
  when:
    age: [19, 24]
    flags: [origin_marked_hidden]
  text: |
    ท่านย่าส่งรถม้ามารับถึงที่พัก ตัวรถสีลอกไปครึ่งคัน ม้าตัวเดียว คนขับเป็นคนรับใช้คนสุดท้ายที่เหลืออยู่ในคฤหาสน์ ห้องที่เปิดใช้เหลือสามห้อง ห้องที่เหลือขายของออกไปหมดแล้วทั้งตู้ทั้งกระจก

    แกนั่งเก้าอี้พนักสูงตัวเดิมหน้าเตาผิง ตัวเล็กลงจนเก้าอี้ดูใหญ่ขึ้น ข้างถ้วยชาที่เย็นแล้วมีกล่องไม้ใบเล็กบุกำมะหยี่สีหม่น เปิดฝาไว้ ข้างในยังเป็นเลื่อยเงินอันยาวเท่านิ้วมือ แกเลื่อนกล่องมาทาง{name} บอกว่าเด็กที่มีเขาเกิดในบ้านที่ไม่มีเขามาตลอด สักวันหลานของ{name}หรือลูกของ{name}อาจเกิดมาแบบเดียวกัน
  choices:
    - id: take_the_saw
      label: รับกล่องไว้ ปิดฝา
      text: |
        {name}ปิดฝากล่อง กล่องเบาเหมือนกล่องเปล่า ท่านย่าดูจนฝาปิดสนิท แล้วหันหน้าไปทางเตาผิง บอกว่าวิธีที่ถูกคือทำคืนที่เกิด ก่อนเด็กจะจำอะไรได้ หมอที่ทำเป็นตายไปหมดแล้ว ต่อไปคนในตระกูลต้องทำเอง

        ระหว่างทางกลับ{name}วางกล่องไว้บนตักตลอดทาง ไม่ได้เปิดดูอีก
      effects: { stats: { WIS: 1 }, alignment: { law: 1 }, items: [silver_saw_case], flags: [took_the_silver_saw] }
    - id: refuse_the_saw
      label: เลื่อนกล่องกลับไปหาแก บอกว่าลูกของตัวเองจะเกิดมาพร้อมเขา
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}เลื่อนกล่องกลับไปจนชนถ้วยชา บอกว่าถ้าวันหนึ่งมีลูกที่มีเขา ลูกคนนั้นจะได้รู้ว่าหัวของตัวเองหนักแค่ไหน ไม่ต้องรอให้ใครเลื่อยมันทิ้งก่อนจะได้รู้

          ท่านย่าไม่โกรธ แกนั่งนิ่งจนชาในถ้วยเย็น แล้วปิดฝากล่องเอง บอกว่าตอนแกอายุเท่า{name} แกก็คิดแบบนี้ แต่แกไม่เคยพูดออกมาต่อหน้าใคร ก่อน{name}กลับ แกสั่งคนรับใช้คนสุดท้ายให้ขับรถม้าไปส่งถึงประตู ปกติแกให้ส่งแค่หัวถนน
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [refused_the_silver_saw, grandmother_softened] }
      failure:
        text: |
          ท่านย่าฟัง{name}พูดจบ แล้วบอกว่าเด็กที่มีเขาในเมืองนี้ ถ้าไม่ซ่อน มีทางไปไม่กี่ทาง แกเห็นมาหมดแล้วทุกทาง {name}ยังไม่เคยเห็นสักทาง

          แกปิดฝากล่อง เก็บไว้ข้างตัว แล้วบอกให้คนรับใช้ไปส่ง{name}ที่หัวถนน
        effects: { stats: { WIS: 1 }, flags: [refused_the_silver_saw] }
    - id: into_the_fire
      label: หยิบเลื่อยเงินขึ้นมา โยนลงเตาผิง
      text: |
        เลื่อยเงินตกลงบนถ่านในเตาผิงดังกริ๊ง ไฟในเตาผิงร้อนไม่พอจะหลอมเงิน เลื่อยนอนอยู่บนถ่านแดง ใบเลื่อยค่อยๆ ดำลงจากปลายเข้ามาหาด้าม

        ท่านย่าไม่ได้ลุกขึ้นไปเขี่ยมันออก แกนั่งดูอยู่จนถ่านมอด แล้วบอกว่าคืนที่{name}เกิด แกก็อยากทำแบบนี้ แต่ตอนนั้นหมอรออยู่ที่ประตู
      effects: { stats: { STR: 1 }, alignment: { law: -1, moral: 1 }, flags: [burned_the_silver_saw] }

- id: adult.noric_camp
  stage: adult
  weight: 10
  when:
    age: [19, 24]
    flags: [elf_human_friend]
  text: |
    โนริคปีนบันไดเชือกขึ้นมาถึงบ้านของ{name}ตอนดึก ขาขวาที่หักเมื่อหลายปีก่อนยังเดินลากนิดหนึ่ง เขาเป็นหัวหน้าคนผูกเชือกของค่ายตัดไม้แล้ว ค่ายที่ตั้งลึกเข้ามาในป่ามากกว่าทุกค่ายก่อนหน้า

    เขาได้ยินข่าวจากคนในบ้านตีนไม้ว่าเอลฟ์หนุ่มกลุ่มหนึ่งจะเผาค่ายของเขาในคืนเดือนมืดที่จะถึง คนงานในค่ายมีสามสิบเจ็ดคน หลายคนมีลูกอยู่ในบ้านตีนไม้ เขาไม่ได้มาขอให้{name}ห้ามใคร เขามาถามว่าคืนไหน
  choices:
    - id: tell_him_the_night
      label: บอกโนริคว่าคืนไหน
      text: |
        {name}รู้ว่าคืนไหน ทุกคนบนกิ่งที่อายุต่ำกว่าห้าสิบรู้ {name}บอกโนริค เขาขอบใจคำเดียว แล้วปีนลงไปก่อนสาง

        คืนเดือนมืด เอลฟ์หนุ่มไปถึงค่ายตัดไม้เจอแต่กระโจมว่างกับกองไฟที่ยังอุ่น พวกเขาเผาค่ายทั้งค่ายทิ้งตามที่ตั้งใจ ไม่มีใครตาย ตั้งแต่นั้นมาบนกิ่งมีคนถามกันว่าใครเป็นคนบอก ไม่มีใครถาม{name}ตรงๆ แต่มีคนหยุดคุยกันเวลา{name}เดินผ่าน
      effects: { alignment: { moral: 1, law: -1 }, flags: [warned_noric_camp, bough_suspects_you] }
    - id: talk_to_the_young
      label: ไปหาเอลฟ์หนุ่มกลุ่มนั้น ขอให้เผาตอนค่ายว่าง
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ไม่ได้ขอให้พวกเขาเลิก {name}บอกว่าค่ายที่ไม่มีคนตายจะไม่มีทหารของราชสำนักขึ้นมาตามหาคนเผา ค่ายที่มีคนตายจะมี คนที่นำกลุ่มเงียบไปนาน แล้วถามว่า{name}รู้ได้อย่างไรว่าค่ายจะว่างคืนไหน

          {name}บอกว่าจะทำให้ว่างเอง คืนเดือนมืดค่ายตัดไม้ไหม้ทั้งค่าย ไม่มีใครอยู่ข้างใน โนริคกับคนงานสามสิบเจ็ดคนนั่งดูไฟจากเนินฝั่งตรงข้าม เพราะ{name}บอกให้ไปนั่งตรงนั้น
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [brokered_camp_burning, noric_owes_you] }
      failure:
        text: |
          คนที่นำกลุ่มฟัง{name}จนจบ แล้วถามว่า{name}อยู่ข้างไหน ป่าหรือคนตัดป่า {name}ตอบไม่ได้ในคำเดียว พวกเขาเลื่อนวันเผาค่ายไปคืนอื่นที่{name}ไม่รู้

          ค่ายตัดไม้ไหม้สิบวันหลังจากนั้น คนงานสองคนแผลไฟไหม้ โนริคไม่ได้อยู่ในค่ายคืนนั้น เขาไม่ได้ขึ้นมาบนกิ่งอีกเลยทั้งปี
        effects: { stats: { WIS: 1 }, flags: [camp_burned_hurt, noric_distant] }
    - id: say_nothing
      label: บอกว่าไม่รู้
      text: |
        โนริครู้ว่า{name}รู้ เขาไม่ได้ถามซ้ำ นั่งอยู่ที่ขอบบ้านบนกิ่งจนเกือบสาง ห้อยขาข้างที่หักลงไปในความมืด แล้วบอกว่าคืนแรกที่ขึ้นมาบนนี้ เขาถามว่าข้างบนมีส้วมไหม ตอนนี้เขาไม่รู้จะถามอะไรแล้ว

        คืนเดือนมืดค่ายตัดไม้ไหม้ คนงานหนีออกมาได้หมดเพราะโนริคให้คนเฝ้ายามทุกคืนตั้งแต่คืนที่ขึ้นมาหา{name}
      effects: { stats: { WIS: 1 }, alignment: { law: 1 }, flags: [noric_distant] }

- id: adult.lamp_five_year
  stage: adult
  scene: temple
  weight: 10
  when:
    age: [19, 24]
    trait: curse_brand
    not_flags: [horns_sawn]
  text: |
    ศาสนจักรตะเกียงตรวจผู้ต้องตราทุกห้าปีตามรายชื่อในสมุดวิหาร ไม่ว่าคนนั้นจะย้ายไปอยู่ที่ไหน รอบนี้นักล่าแม่มดมาหา{name}ถึงที่ทำงาน อายุราวสามสิบ เสื้อคลุมขาวไม่มีรอยพับแล้ว ถุงมือหนังสีขาวสึกตรงปลายนิ้ว

    เขาเปิดสมุดตรงหน้าที่มีชื่อ{name} ถามคำถามเดิมที่ถามทุกคนในหน้านั้น ฝันถึงใครบ้าง ได้ยินเสียงอะไรตอนกลางคืนบ้าง เคยไปที่ไหนในห้าปีที่ผ่านมา แล้วรอคำตอบ ปลายปากกาค้างอยู่เหนือกระดาษ
  choices:
    - id: answer_smooth
      label: ตอบทุกคำถามให้เรียบที่สุด
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ตอบทุกข้อสั้นและเรียบ ฝันถึงงาน ได้ยินเสียงหมาเห่า ไปแต่ที่ที่งานพาไป นักล่าแม่มดจดทุกคำ แล้วปิดสมุด

          ก่อนไป เขาหยุดที่ประตู บอกว่าคนในหน้านี้ส่วนใหญ่ตอบเหมือนกันหมด คำตอบที่เรียบเกินไปก็เป็นคำตอบอย่างหนึ่ง แล้วเดินออกไป ห้าปีข้างหน้าเขาจะมาอีก
        effects: { stats: { CHA: 1 }, flags: [lamp_checked_adult] }
      failure:
        text: |
          ก่อนตอบเรื่องฝัน {name}กลืนน้ำลายหนึ่งที นักล่าแม่มดวางปากกาลง ถามซ้ำอีกรอบ ช้ากว่าเดิม แล้วถามต่ออีกเจ็ดคำถามที่ไม่มีในสมุด

          เขาจดยาวจนเต็มหน้า แล้วบอกว่ารอบหน้าไม่ต้องรอห้าปี เขาจะมาทุกปี คนที่ทำงานรอบตัว{name}ยืนดูอยู่ตลอด สัปดาห์ต่อมางานที่เคยได้หายไปส่วนหนึ่ง
        effects: { gold: -2, flags: [lamp_checked_adult, lamp_yearly_check] }
    - id: ask_his_dreams
      label: ถามกลับว่าเขาฝันถึงใครบ้าง
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          นักล่าแม่มดไม่ได้ตอบทันที เขามอง{name}อยู่ครู่หนึ่ง แล้วตอบว่าฝันถึงบ้านหลังหนึ่งที่เขาเคยไปเคาะประตูเมื่อสิบปีก่อน เด็กในบ้านนั้นตายตอนฤดูหนาวถัดมา ไม่เกี่ยวกับเขา แต่เขาฝันถึงทุกปี

          เขาจดคำตอบของ{name}สามบรรทัด สั้นกว่าที่จดให้คนอื่น แล้วปิดสมุด ตอนเดินออกไป เขาหยิบตะเกียงแขวนรูปเล็กที่คอขึ้นมากำไว้ในมือ ไม่ได้ปล่อยจนพ้นประตู
        effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [lamp_checked_adult, hunter_told_his_dream] }
      failure:
        text: |
          นักล่าแม่มดจดคำถามของ{name}ลงสมุด ทุกคำ แล้วเขียนใต้คำถามว่าผู้ต้องตราไม่ร่วมมือ บอกว่าคนที่ถามกลับแบบนี้ไม่เคยมีใครดีขึ้น

          สามเดือนต่อมา{name}เห็นเขายืนอยู่หัวถนนหน้าที่พักตอนเย็น ยืนอยู่อย่างนั้นไม่ทำอะไร แล้วก็ไป
        effects: { reputation: { lamp_church: -1 }, flags: [lamp_checked_adult, lamp_watching_you] }
    - id: refuse_to_answer
      label: ไม่ตอบ บอกว่าห้าปีที่ผ่านมาไม่เกี่ยวกับศาสนจักร
      text: |
        {name}บอกว่าไม่มีกฎหมายของราชสำนักข้อไหนบังคับให้ผู้ใหญ่เล่าฝันให้ใครฟัง นักล่าแม่มดบอกว่าถูก ไม่มี แล้วเขียนลงสมุดว่าผู้ต้องตราปฏิเสธการตรวจ ปิดสมุด เดินออกไป

        ตั้งแต่สัปดาห์ต่อมา ร้านค้าสามร้านในถิ่นเลิกขายของให้{name} ร้านที่สี่ขายให้ในราคาที่แพงขึ้นครึ่งหนึ่ง
      effects: { gold: -3, alignment: { law: -1 }, reputation: { lamp_church: -1 }, flags: [lamp_checked_adult, refused_lamp_check] }
