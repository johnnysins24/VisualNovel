# ชุด ม แพ็ก B: เวนทราสในฐานะที่อยู่ของคนเมือง แปดเรื่องตามแบบ "แปดเรื่องของหนึ่งเมือง" ในใบงาน
# ย่าน: sky_docks (คนมาใหม่ลง) refineries temple_hill institute · หน้าเดิมของเมือง: มาร์ธิส โคเวล หัวหน้าย่านท่าเรือเหาะ
# เรื่องตึง: ค่าแรงโรงกลั่น การล่าคนมีตราของศาสนจักรตะเกียง ราคาขนมปังในปีที่เรือข้าวมาช้า
# เวนทราสมีเรื่องเก่าอยู่มากแล้ว (location_tag: ventras) แปดเรื่องนี้เล่าแค่ชีวิตของคนเช่าห้อง ค่าเช่าตามรอบเรือ และสภาย่าน

- id: adult.city_ventras_first_season
  stage: adult
  scene: home
  weight: 30
  when:
    age: [19, 60]
    city: { id: ventras, native: false, max_years: 2, home: [none] }
    not_flags: [institute_student]
  text: |
    ตึกแถวห้องเช่าหลังหอท่าเรือเหาะสูงเจ็ดชั้น ทุกตึกมีบันไดไม้ขึ้นตรงกลาง กับคนเฝ้าบันไดหนึ่งคน คนเฝ้าบันไดตึกที่สองของมาร์ธิส โคเวล ชื่อดาลิส หญิงแก่ตัวเล็กที่นั่งบนเก้าอี้ไม้ตรงชานพักชั้นสาม จำได้ว่าห้องไหนจ่ายเมื่อไร ห้องไหนค้าง และห้องไหนมีคนนอนเกินจำนวนที่บอกเจ้าของ

    ฤดูแรกในเวนทราส{name}ยังนอนห้องรวมของโรงเตี๊ยมใต้หอท่า ทุกเช้าเสียงใบพัดเรือเหาะลำแรกปลุกคนทั้งห้องพร้อมกัน ค่าเตียงคืนละสองเหรียญทองแดง ผ้าห่มมีกลิ่นของคนนอนคืนก่อน

    ดาลิสเห็น{name}เดินผ่านบันไดตึกของเธอทุกวันมาสองสัปดาห์ วันที่สิบห้าเธอเรียกให้หยุด บอกว่าห้องใต้หลังคาชั้นเจ็ดว่าง คนเก่าขึ้นเรือรอบที่แล้วไปไม่กลับ ห้องนั้นหน้าต่างเห็นหอท่า ฤดูหนาวลมเข้าทางรอยกระเบื้อง ค่าเช่าเก็บตอนเรือรอบเข้าเทียบ เหมือนทุกห้องของมาร์ธิส
  choices:
    - id: take_the_attic
      label: วางเงินมัดจำ รับกุญแจห้องชั้นเจ็ด
      requires: { min_gold: 1 }
      text: |
        ดาลิสนับเหรียญแล้วจดลงกระดานชนวนที่ห้อยอยู่ข้างเก้าอี้ ชื่อ{name}อยู่บรรทัดล่างสุด ใต้ชื่อคนที่ขึ้นเรือไปไม่กลับ เธอยังไม่ได้ลบชื่อนั้นออก

        ห้องชั้นเจ็ดมีเตียงไม้หนึ่งเตียง ตะปูสามตัวบนผนัง และหน้าต่างที่เห็นเรือเหาะเทียบหอท่าทั้งวัน คืนแรก{name}นับเรือที่เข้าเทียบได้สี่ลำก่อนหลับ
      effects:
        gold: -1
        city: { home: room }
        people: [{ id: ventras_dalis, name: ดาลิส, gender: f, bond: friend, closeness: 1, age: 62 }]
        flags: [rents_under_dalis_stair]
    - id: carry_her_water
      label: เสนอแบกถังน้ำขึ้นเจ็ดชั้นให้ทุกเช้าแทนค่ามัดจำ
      check: { stat: CON, dc: 12 }
      success:
        text: |
          ถังน้ำสองถังต่อเช้า เจ็ดชั้น เดือนแรกขาของ{name}สั่นทุกครั้งที่ถึงชั้นห้า เดือนที่สองไม่สั่นแล้ว ดาลิสนับถังจากเก้าอี้ตรงชานพักชั้นสาม ไม่เคยนับผิด

          ปลายฤดูเธอเอาผ้าห่มขนแกะผืนหนึ่งขึ้นไปวางไว้บนเตียงห้องชั้นเจ็ด ผ้าห่มเก่า มีรอยปะสามที่ ไม่มีกลิ่นของใคร
        effects:
          stats: { CON: 1 }
          city: { home: room }
          people: [{ id: ventras_dalis, name: ดาลิส, gender: f, bond: friend, closeness: 2, age: 62 }]
          flags: [carries_water_for_dalis]
      failure:
        text: |
          เช้าที่สามถังน้ำหลุดมือที่ชั้นหก น้ำไหลลงบันไดไปถึงชานพักชั้นสาม เปียกถึงข้อเท้าของดาลิส {name}ลื่นตามลงไปห้าขั้น หลังกระแทกขอบบันไดจนหายใจไม่ออกไปครู่หนึ่ง

          ดาลิสเช็ดเท้า บอกว่าห้องยังว่างอยู่ ถ้ามีเงินมัดจำเมื่อไรก็มา {name}กลับไปนอนห้องรวมใต้หอท่า ทุกเช้ายังเดินผ่านบันไดของเธอ เธอยังยกมือทักจากเก้าอี้
        effects:
          hp: -2
          people: [{ id: ventras_dalis, name: ดาลิส, gender: f, bond: friend, closeness: 1, age: 62 }]
          flags: [spilled_dalis_water]
    - id: go_to_the_refineries
      label: ไปหาห้องที่ย่านโรงกลั่น ค่าเช่าครึ่งเดียวเพราะกลิ่น
      text: |
        ห้องที่ย่านโรงกลั่นอยู่ชั้นสองของบ้านคนเฝ้าหม้อ ลมจากปล่องพัดกลิ่นน้ำค้างดาวต้มเข้าทางหน้าต่างทั้งคืน ผ้าที่ตากไว้แห้งแล้วยังมีกลิ่นนั้นติด เจ้าของบ้านทำกะดึก นอนกลางวัน ไม่ถามอะไรนอกจากชื่อ

        สัปดาห์แรก{name}รู้ว่าคนในย่านนี้ทักกันด้วยการดูหลังมือ ดูว่ามีจุดแก้วขึ้นหรือยัง ก่อนจะดูหน้า
      effects: { city: { district: refineries, home: room }, flags: [took_a_room_by_the_stills] }
    - id: stay_in_the_bunk_room
      label: ขอบคุณเธอ แล้วนอนห้องรวมต่ออีกฤดู
      text: |
        ค่าเตียงคืนละสองเหรียญทองแดงยังถูกกว่าค่าห้องไหนในเมือง ทุกเช้าเสียงใบพัดยังปลุก{name}พร้อมคนอื่นอีกสิบสี่คน ทุกเย็นเตียงข้างๆ เป็นคนใหม่

        ดาลิสไม่ได้เรียกอีก ห้องชั้นเจ็ดว่างอยู่อีกสองรอบเรือ แล้วมีคนจากเรือรอบใหม่ขึ้นไปอยู่
      effects: { flags: [kept_a_bunk_under_the_dock_tower] }

- id: adult.city_ventras_rent_round
  stage: adult
  scene: home
  weight: 22
  when:
    age: [19, 64]
    city: { id: ventras, home: [room], district: [sky_docks] }
  text: |
    วันที่เรือรอบเข้าเทียบหอท่า โพลแดนลงมาพร้อมคนขนสัมภาระ ถือสมุดค่าเช่าของมาร์ธิส โคเวล ไล่เก็บทีละตึก ทีละชั้น เขาเก็บค่าเช่ามาตั้งแต่ยังหนุ่ม รู้ว่าใครจ่ายด้วยเหรียญอะไร ใครจ่ายช้าเพราะอะไร และใครจะไม่จ่ายเลย

    ชั้นสี่ของตึกแถวที่สามมีครอบครัวหนึ่ง พ่อเป็นคนขนของที่ท่าเรือเหาะ แขนขวาหักตั้งแต่ต้นฤดูฝน ลูกสามคน ค้างค่าเช่ามาแล้วหนึ่งรอบเรือ ตามธรรมเนียมของเวนทราส ค้างได้รอบเดียว รอบที่สองเจ้าของเอากุญแจคืน ไม่มีใครเป็นหนี้เพราะค่าเช่า มีแต่คนที่ไม่มีห้อง

    โพลแดนยืนอยู่หน้าประตูห้องนั้น เคาะสองครั้ง แล้วรอ คนทั้งชั้นสี่เปิดประตูห้องตัวเองแง้มไว้ครึ่งบาน
  choices:
    - id: pay_their_round
      label: จ่ายค่าเช่ารอบนี้ให้ครอบครัวนั้น
      requires: { min_gold: 2 }
      text: |
        โพลแดนรับเหรียญ นับสองรอบ แล้วจดลงสมุดในช่องของห้องนั้น ชื่อคนจ่ายเขาเขียนชื่อ{name} ไม่ใช่ชื่อพ่อของเด็ก เขาบอกว่าสมุดของมาร์ธิสจดคนจ่าย ไม่ได้จดคนอยู่

        ตกเย็นลูกคนโตของครอบครัวนั้นเอาขนมปังครึ่งก้อนมาวางหน้าประตูห้อง{name} ห่อผ้าเช็ดหน้าที่ซักจนบาง ทั้งชั้นสี่รู้ก่อนค่ำว่าใครจ่าย
      effects: { gold: -2, alignment: { moral: 1 }, city: { merit: 1 }, flags: [paid_a_round_for_the_fourth_floor] }
    - id: sign_for_them
      label: ลงชื่อในสมุดของโพลแดนว่ารอบหน้าจะจ่ายแทน
      text: |
        โพลแดนพลิกสมุดไปหน้าหลัง หน้าที่มีเส้นตีตารางต่างจากหน้าอื่น เขาให้{name}ลงชื่อใต้ข้อความว่ารับจ่ายค่าเช่าหนึ่งรอบของห้องชั้นสี่ตึกที่สาม หมึกยังไม่แห้งเขาก็ปิดสมุด

        ประตูห้องนั้นไม่ต้องคืนกุญแจ ส่วนเงินสองเหรียญที่{name}ลงชื่อรับไว้ อยู่ในสมุดของมาร์ธิสจนกว่าจะจ่ายครบ
      effects: { gold: -2, debt: true, city: { merit: 1 }, flags: [signed_for_the_fourth_floor] }
    - id: call_the_stair_down
      label: เคาะประตูทุกห้องในชั้น เรียกคนลงมายืนเต็มบันได
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          คนชั้นสี่ออกมาก่อน แล้วคนชั้นห้า ชั้นสาม จนบันไดแน่นตั้งแต่ชานพักชั้นสองถึงชั้นหก ไม่มีใครเอ่ยกับโพลแดนสักคำ ทุกคนแค่ยืน โพลแดนดูคนบนบันไดทีละขั้น นับเหมือนนับห้อง

          เขาปิดสมุด บอกว่าห้องนี้จะเก็บรอบหน้าทีเดียวสองรอบ แล้วเดินลงไปโดยต้องเบียดตัวผ่านคนทั้งบันได รอบนั้นตึกที่สามไม่มีใครคืนกุญแจ
        effects: { stats: { CHA: 1 }, city: { merit: 1 }, flags: [filled_the_stair_against_polden] }
      failure:
        text: |
          คนเปิดประตูแง้มอยู่ครึ่งบานเหมือนเดิม ไม่มีใครก้าวออกมา บางห้องปิดประตูลงช้าๆ ตอนได้ยินเสียง{name}เคาะ โพลแดนรอจนเสียงเคาะเงียบ แล้วจดชื่อ{name}ลงหลังสมุด ในหน้าที่ไม่มีเส้นตาราง

          ครอบครัวชั้นสี่คืนกุญแจตอนค่ำ ขนของลงบันไดเองสามรอบ ลูกคนเล็กอุ้มหม้อดินใบเดียวที่บ้านมี
        effects: { alignment: { law: -1 }, flags: [in_the_back_of_poldens_book] }
    - id: shut_the_door
      label: ปิดประตูห้องตัวเอง
      text: |
        ผ่านประตูไม้บางๆ {name}ได้ยินเสียงโพลแดนเคาะอีกสองครั้ง เสียงคนพูดเบาๆ แล้วเสียงพวงกุญแจ

        ตอนค่ำห้องชั้นสี่ว่าง ประตูเปิดทิ้งไว้ ตะปูบนผนังสามตัวยังมีเชือกผูกค้างอยู่ คนจากเรือรอบใหม่ขึ้นมาดูห้องตั้งแต่ก่อนพระจันทร์ขึ้น
      effects: { alignment: { moral: -1 }, flags: [shut_the_door_on_rent_day] }

- id: adult.city_ventras_lamp_blessing
  stage: adult
  scene: temple
  weight: 22
  when:
    age: [19, 64]
    city: ventras
  text: |
    ต้นปี ศาสนจักรตะเกียงอวยพรตะเกียงน้ำค้างดาวทุกบ้านบนย่านวิหาร นักบวชเวรัสสองคนเดินขึ้นเนินทีละซอย คนหนึ่งถือหม้อน้ำมนต์ อีกคนถือสมุด บ้านไหนเปิดประตูรับพร คนทั้งบ้านต้องออกมายืนใต้ตะเกียงที่อวยพรแล้ว ถอดหมวก ถอดผ้าคลุมหัว คนถือสมุดดูหน้าทีละคน

    วันนั้น{name}ยืนรอคนรู้จักอยู่หน้าบ้านหลังหนึ่งบนเนินตอนนักบวชเลี้ยวเข้าซอย หน้าต่างชั้นบนของบ้านข้างๆ มีเด็กผู้หญิงคนหนึ่งชะโงกดู ผ้าคลุมหัวพันแน่นเกินกว่าจะเป็นแค่กันแดด แม่ของเด็กดึงเธอกลับเข้าไป แล้วปิดหน้าต่าง

    บ้านหลังนั้นอยู่ถัดไปอีกสองประตู
  choices:
    - id: hold_them_at_the_door
      label: ยื่นตะเกียงมือของตัวเองขอรับพรตรงนั้น แล้วชวนนักบวชคุยให้นานที่สุด
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ถามเรื่องน้ำมนต์ เรื่องวันที่ดีของการเปลี่ยนไส้ตะเกียง เรื่องตะเกียงที่ย่าเคยได้รับพรเมื่อนานมาแล้วแต่ไม่เคยติดไฟ คนถือสมุดตอบทุกคำถามด้วยความยินดี ไม่ค่อยมีใครถามเขา จนระฆังเที่ยงของวิหารใหญ่ดัง ทั้งสองต้องรีบไปให้ทันซอยถัดไป

          บ้านที่อยู่ถัดไปสองประตูได้รับพรตอนบ่ายจากนักบวชอีกคู่ที่ไม่มีสมุด เย็นนั้นตะเกียงหน้าบ้านหลังนั้นจุดเร็วกว่าทุกบ้านในซอย
        effects: { stats: { CHA: 1 }, city: { merit: 1 }, flags: [talked_the_lamp_priests_past] }
      failure:
        text: |
          คนถือสมุดตอบคำถามแรกสั้นๆ คำถามที่สองไม่ตอบ เขาดู{name}ตั้งแต่หัวจรดเท้า แล้วบอกว่าคนที่ยืนคุยนานหน้าบ้านคนอื่นวันอวยพรมีอยู่ทุกปี {name}ต้องวางเหรียญลงในหม้อน้ำมนต์หนึ่งเหรียญเป็นค่าพรของตะเกียงที่ไม่อยู่ในสมุด

          เขาเดินต่อไปบ้านถัดไป แล้วบ้านถัดไปอีก บ้านหลังนั้นเปิดประตูช้ากว่าบ้านอื่น
        effects: { gold: -1, flags: [paid_for_an_unasked_blessing] }
    - id: hang_it_on_the_threshold
      label: บอกบ้านหลังนั้นให้แขวนตะเกียงไว้ที่ธรณี แบบที่บ้านเก่าบนเนินทำกัน
      requires: { city: { district: [temple_hill] } }
      text: |
        บ้านเก่าบนย่านวิหารมีสิทธิ์รับพรที่ธรณีโดยไม่ต้องเปิดประตู ธรรมเนียมนี้เก่ากว่าสมุดของนักบวช คนบนเนินรู้ คนมาใหม่ไม่รู้ {name}เคาะประตูบ้านหลังนั้นเบาๆ บอกแม่ของเด็กผ่านช่องประตู เธอเอาตะเกียงมาแขวนที่ตะขอเหนือธรณีก่อนนักบวชเลี้ยวมาถึงหนึ่งลมหายใจ

        นักบวชพรมน้ำมนต์ลงบนตะเกียง คนถือสมุดเขียนเลขบ้านแล้วเดินต่อ ประตูบ้านหลังนั้นไม่ได้เปิดเลยทั้งวัน
      effects: { city: { merit: 1 }, flags: [taught_the_threshold_blessing] }
    - id: keep_own_door_shut
      label: ไม่รอรับพร เดินออกจากซอยไปก่อน
      text: |
        นักบวชเคาะประตูบ้านที่{name}ยืนรออยู่ข้างหน้า ไม่มีใครเปิด เขาเอาเขม่าจากตะเกียงแต้มขีดหนึ่งขีดที่วงกบ แล้วเดินต่อไปบ้านถัดไป

        {name}เดินออกจากซอยโดยไม่หันกลับไปดูว่าบ้านที่อยู่ถัดไปสองประตูเปิดหรือเปล่า ขีดเขม่าที่วงกบบ้านนั้นยังอยู่อีกสองฤดู ไม่มีใครกล้าเช็ด
      effects: { reputation: { lamp_church: -1 }, flags: [walked_away_from_the_blessing] }
    - id: point_out_the_window
      label: บอกคนถือสมุดว่าบ้านถัดไปมีเด็กพันผ้าคลุมหัวแน่นผิดปกติ
      text: |
        คนถือสมุดขอบคุณ จดอะไรบางอย่างลงหน้าเดียวกับเลขบ้านหลังนั้น นักบวชอีกคนพรมน้ำมนต์ลงบนตะเกียงมือของ{name}หนึ่งครั้ง โดยไม่มีใครขอ

        บ่ายวันนั้นมีคนแปลกหน้าสามคนยืนอยู่หน้าบ้านหลังนั้นจนค่ำ ฤดูต่อมาบ้านหลังนั้นว่าง หน้าต่างชั้นบนตอกไม้กระดานปิดไว้ คนในซอยเลิกทัก{name}ทีละบ้าน
      effects: { reputation: { lamp_church: 1 }, alignment: { moral: -1 }, city: { merit: -1 }, flags: [pointed_out_a_hidden_child] }

- id: adult.city_ventras_late_grain
  stage: adult
  scene: market
  weight: 14
  when:
    age: [19, 64]
    city: { id: ventras, mood: [calm] }
  text: |
    เรือข้าวมาช้าไปสองสัปดาห์ น้ำในแม่น้ำลดจนเรือท้องแบนติดสันดอนกันเป็นแถว ขนมปังในเวนทราสขึ้นราคาเท่าตัวในสามวัน แถวหน้าร้านขนมปังยาวตั้งแต่ก่อนสาง

    ร้านของทีเบนอยู่ปากซอยที่{name}เดินผ่านทุกเช้า วันนี้ทีเบนปิดร้านครึ่งบาน ขายแค่ครึ่งเตา บอกคนในแถวว่าแป้งใกล้หมด {name}เห็นจากซอยข้างร้าน ประตูหลังเปิดอยู่ กระสอบแป้งวางซ้อนกันสูงถึงขื่อ กระสอบบนสุดยังมีตราโรงสีใหม่เอี่ยม

    ทีเบนออกมายืนสูบยาเส้นที่ประตูหลัง เห็น{name} แล้วไม่หลบสายตา
  choices:
    - id: talk_to_tiben
      label: เดินไปยืนข้างทีเบนที่ประตูหลัง แล้วคุยเรื่องกระสอบ
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ทีเบนบอกว่าถ้าขายราคาเดิมวันนี้ พอเรือข้าวมาถึง พ่อค้าแป้งจะขึ้นราคากับเขาก่อน {name}ถามว่าแถวหน้าร้านจะยังมาซื้อจากเขาไหมหลังเรือมาถึง ถ้าวันนี้ทุกคนรู้เรื่องกระสอบ เขาเคาะขี้ยาจากกล้องทิ้งที่ขอบประตู สามครั้ง

          เช้าวันต่อมาทีเบนเปิดสองกระสอบ ขายราคาก่อนเรือช้าให้แถวหน้าร้านจนถึงสาย ขนมปังหมดก่อนเที่ยง คนท้ายแถวได้คนละครึ่งก้อน ไม่มีใครบ่น
        effects: { stats: { CHA: 1 }, city: { merit: 1 }, flags: [talked_tiben_into_two_sacks] }
      failure:
        text: |
          ทีเบนฟังได้สองประโยค แล้วถามว่า{name}เป็นใครถึงมานับกระสอบหลังร้านเขา เสียงเขาดังพอให้คนท้ายแถวหันมา คนท้ายแถวเดินอ้อมมาที่ซอยข้างร้าน แล้วเห็นประตูหลังที่ยังเปิดอยู่

          ก่อนเที่ยงหน้าร้านมีคนยืนมากกว่าตอนเช้าสามเท่า ไม่มีใครยืนเป็นแถวแล้ว ทีเบนปิดร้านทั้งบาน ลงกลอนจากข้างใน
        effects: { city: { mood: tense }, flags: [tibens_sacks_seen_by_the_queue] }
    - id: tell_the_queue
      label: เดินไปบอกคนในแถวว่าหลังร้านมีกระสอบแป้งสูงถึงขื่อ
      text: |
        ข่าวเดินจากหัวแถวไปท้ายแถวเร็วกว่าคนเดิน คนท้ายแถวไปยืนที่ประตูหลังก่อน คนหัวแถวไม่ยอมออกจากที่ของตัวเอง ทีเบนดึงประตูหลังปิดทันก่อนมือแรกจะถึงกระสอบ

        ตอนเย็นร้านขนมปังอีกสี่ร้านในย่านปิดก่อนเวลา คนเฝ้าตลาดเดินคู่กันเป็นครั้งแรกในรอบปี
      effects: { alignment: { law: -1 }, city: { mood: tense }, flags: [told_the_queue_about_tibens_sacks] }
    - id: buy_a_sack_quietly
      label: ซื้อแป้งหนึ่งกระสอบจากประตูหลังในราคาที่ทีเบนตั้ง
      requires: { min_gold: 2, city: { home: [family, room, house, shop] } }
      text: |
        ทีเบนยกกระสอบส่งให้ทางประตูหลังโดยไม่ต้องคุยกันมาก ราคาสองเหรียญ แพงกว่าก่อนเรือช้าเท่าตัว {name}แบกกลับบ้านทางซอยหลัง ไม่ผ่านแถวหน้าร้าน

        แป้งกระสอบนั้นพอทำขนมปังแบ่งคนข้างบ้านได้จนเรือข้าวมาถึง คนข้างบ้านคนหนึ่งถามว่าได้แป้งมาจากไหน {name}บอกว่าจากคนที่ขายได้
      effects: { gold: -2, flags: [bought_a_back_door_sack] }

- id: adult.city_ventras_shift_bell
  stage: adult
  scene: refinery
  weight: 35
  when:
    age: [19, 64]
    city: { id: ventras, mood: [tense] }
  text: |
    ระฆังเปลี่ยนกะของย่านโรงกลั่นตีตอนสองทุ่มเหมือนทุกคืน คืนนี้ไม่มีใครเข้ากะ คนงานกะดึกของทุกโรงยืนอยู่ที่ลานหน้าสำนักงานสมาคมโรงกลั่นริมแม่น้ำ มือเปล่า หลังมือหลายคนมีจุดแก้ว สมาคมตัดค่ากะดึกลงหนึ่งในสี่ตั้งแต่รอบเงินนี้ ประกาศตอกไว้ที่ประตูสำนักงานตั้งแต่เช้า

    หน้าต่างชั้นบนของสำนักงานมีแสงตะเกียง คนของสมาคมสองคนลงมาที่บันได ถือกระดาษข้อเสนอแผ่นหนึ่ง ตัดน้อยลงครึ่งหนึ่ง จ่ายรอบหน้า ไม่มีใครในลานยื่นมือไปรับ ทหารรักษาเมืองยืนเป็นแถวอยู่ปลายถนน ยังไม่ขยับ

    {name}อยู่ในลานนั้นด้วย จะมาเพราะงาน เพราะบ้านอยู่ใกล้ หรือเพราะอยากรู้ก็ตาม หม้อกลั่นทุกโรงยังมีไฟ ไม่มีคนเฝ้า
  choices:
    - id: walk_with_them
      label: เดินไปกับคนงานถึงบันไดสำนักงาน
      check: { stat: STR, dc: 13 }
      effects: { reputation: { distillers: -1 }, city: { mood: riot } }
      success:
        text: |
          แถวหน้าดันขึ้นบันไดไปถึงประตู {name}ยืนอยู่ในแถวนั้น ไหล่ชนไหล่กับคนเฝ้าหม้อสองคน ทหารปลายถนนเริ่มเดิน ประตูสำนักงานแตกที่บานพับล่าง กระดาษข้อเสนอปลิวลงแม่น้ำ

          ก่อนเที่ยงคืนไฟไหม้โกดังหลอดของสมาคมหนึ่งหลัง ไม่มีใครรู้ว่าใครจุด {name}กลับถึงที่นอนตอนสาง มือมีรอยเสี้ยนบานประตู ไม่มีเลือดของใคร
        effects: { stats: { STR: 1 }, flags: [stood_at_the_guild_door] }
      failure:
        text: |
          ทหารปลายถนนมาถึงก่อนแถวหน้าจะถึงประตู ด้ามหอกฟาดลงมาเป็นแนว {name}โดนที่ไหล่กับหลังศีรษะ ล้มลงบนบันได มีคนลากออกมาทางซอยข้างโรงกลั่น ไม่รู้ว่าใคร

          ทั้งคืนย่านโรงกลั่นมีเสียงแก้วแตก {name}นอนอยู่ในบ้านคนแปลกหน้าจนสาง หัวพันผ้าที่ฉีกจากผ้ากันเปื้อนของคนเฝ้าหม้อ
        effects: { hp: -3, flags: [clubbed_at_the_guild_door] }
    - id: carry_the_offer
      label: รับกระดาษข้อเสนอจากคนของสมาคม แล้วอ่านให้ทั้งลานฟัง
      check: { stat: CHA, dc: 14 }
      effects: { reputation: { distillers: 1 } }
      success:
        text: |
          {name}อ่านช้าๆ ทีละบรรทัด แล้วอ่านบรรทัดที่สมาคมเขียนตัวเล็กไว้ท้ายแผ่นให้ดังเท่าบรรทัดบนสุด ว่าค่ากะที่ตัดไปครึ่งแรกจะคืนให้ในรอบเงินที่สาม คนในลานไม่เคยได้ยินบรรทัดนั้น คนของสมาคมก็ไม่ได้อ่านให้ฟังตอนเช้า

          คนกะดึกทยอยกลับเข้าโรง ทีละโรง หม้อกลั่นมีคนเฝ้าก่อนสามทุ่ม ทหารปลายถนนแยกย้ายตอนเที่ยงคืน ไม่มีใครในลานขอบใจ{name} แต่ไม่มีใครด่าด้วย
        effects: { stats: { CHA: 1 }, city: { mood: calm }, flags: [read_the_guild_offer_to_the_yard] }
      failure:
        text: |
          ไม่ทันจบบรรทัดแรก ก้อนถ่านก้อนหนึ่งก็ลอยมาโดนขมับ{name} คนในลานเห็นแค่ว่าใครถือกระดาษของสมาคม {name}ล้มลงบนบันได กระดาษหลุดมือ คนทั้งลานเดินขึ้นบันไดข้ามตัว{name}ไป

          ทหารปลายถนนเริ่มเดินตอนเสียงประตูสำนักงานแตก {name}คลานออกมาทางซอยข้างแม่น้ำ เลือดที่ขมับแห้งเป็นสะเก็ดก่อนพ้นย่านโรงกลั่น
        effects: { hp: -2, city: { mood: riot }, flags: [stoned_for_the_guild_offer] }
    - id: go_home_and_bar_the_door
      label: กลับบ้าน ลงกลอนประตู
      requires: { city: { home: [family, room, house, shop] } }
      text: |
        {name}เดินสวนแถวทหารปลายถนนกลับบ้าน ทหารไม่หยุดใครที่เดินออก ลงกลอนแล้วยังได้ยินเสียงจากริมแม่น้ำ เสียงคนตะโกน แล้วเสียงไม้แตก แล้วเสียงที่ฟังไม่ออก

        ตอนสางย่านโรงกลั่นมีควันขึ้นสองที่ หม้อกลั่นสามโรงแตกเพราะไม่มีคนเฝ้าทั้งคืน สมาคมตอกประกาศใหม่ที่ประตูสำนักงานที่เหลือบานเดียว
      effects: { city: { mood: riot }, flags: [barred_the_door_on_shift_bell_night] }
    - id: night_train
      label: ขึ้นรถไฟเที่ยวดึกไปคาร์ดิน ไม่กลับมาอีก
      requires: { not_flags: [left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter], not_orgs: [wick, crown_office, crown_army, crown_court] }
      text: |
        {name}เก็บของใส่ถุงได้ถุงเดียว ไม่บอกใคร รถไฟเที่ยวดึกออกจากสถานีตอนสี่ทุ่ม ตู้ชั้นสามมีคนหอบของมาแบบเดียวกันอยู่ครึ่งตู้ ไม่มีใครถามใครว่าทำไม

        จากหน้าต่างตู้ เห็นแสงไฟริมแม่น้ำของเวนทราสเป็นสีส้มสองสามจุด แล้วเนินเขาก็บังหมด ตอนสางรถไฟเข้าย่านชุมทางของคาร์ดิน เสียงเตาหลอมดังมาจากทุกทิศ
      effects:
        city: { move: kardin, mood: riot, of: ventras }
        mark: ย้ายไปคาร์ดิน
        flags: [moved_to_kardin, left_ventras_on_the_night_train]

- id: adult.city_ventras_fever_barge
  stage: adult
  scene: ship_deck
  weight: 6
  when:
    age: [19, 64]
    city: { id: ventras, mood: [calm, tense], home: [family, room, house, shop] }
  text: |
    เรือเกลือจากชายฝั่งใต้ทอดสมออยู่กลางแม่น้ำหน้าย่านโรงกลั่นมาสองวัน ไม่เทียบท่า ไม่ขนของลง เมื่อเช้าลูกเรือคนหนึ่งพายเรือเล็กขึ้นฝั่งมาซื้อน้ำ ไอแห้งตลอดเวลาที่ต่อราคา ตัวร้อนจนแม่ค้าน้ำไม่กล้ารับเหรียญจากมือเขา

    คนท่ารู้จักไอแบบนี้ ไข้ท่าเรือ ไอแห้ง ตัวร้อนเจ็ดวัน คนแก่กับเด็กตายก่อน นายเรือส่งคนมาบอกว่าเกลือในท้องเรือจะชื้นถ้ารออีกสามวัน เขาจะขนลงคืนนี้ จะมีคนท่ารับจ้างหรือไม่ก็ตาม

    เรือเล็กลำที่สองกำลังพายเข้าฝั่ง {name}ยืนอยู่บนท่าไม้ตรงที่เรือเล็กจะเทียบ
  choices:
    - id: hold_the_barge
      label: ยืนขวางท่า ไม่ให้ใครจากเรือขึ้นฝั่งจนครบเจ็ดวัน
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ไม่ไล่ คุยกับคนในเรือเล็กจากปลายท่า บอกว่าน้ำกับขนมปังจะส่งลงเรือเล็กทุกเช้า วางไว้ปลายท่าแล้วถอยออกมาให้เขาพายมารับ จนกว่าจะครบเจ็ดวัน คนท่าที่มายืนดูอยู่ข้างหลังเริ่มยืนเป็นแถวตาม ทีละคน

          เจ็ดวันต่อมาเรือเกลือขนของลงได้ ลูกเรือหายไข้ห้าคน ตายสองคน ศพสองศพห่อผ้าใบลงเรือเล็กไปฝังที่ฝั่งตรงข้าม ไม่มีใครในย่านโรงกลั่นไอแห้งในฤดูนั้น
        effects: { stats: { CHA: 1 }, city: { merit: 2 }, flags: [held_the_fever_barge_off] }
      failure:
        text: |
          คนในเรือเล็กไม่ฟัง เรือชนท่า ลูกเรือสามคนปีนขึ้นมาข้าง{name} คนหนึ่งไอใส่หน้า{name}ใกล้จนลมไอร้อนกระทบแก้ม คนท่าที่ยืนดูถอยกลับเข้าซอยหมด

          คืนนั้นเกลือขนลงครบ โกดังริมแม่น้ำรับไปทั้งหมด สัปดาห์ต่อมาย่านโรงกลั่นไอแห้งทั้งย่าน วิหารอีเซลริมแม่น้ำปูเสื่อลงถึงลานหน้าวิหาร
        effects: { city: { mood: plague }, flags: [could_not_hold_the_fever_barge] }
    - id: haul_the_salt
      label: รับจ้างขนเกลือลงจากเรือคืนนี้
      text: |
        นายเรือจ่ายค่าแรงสองเท่าของค่าขนปกติ จ่ายก่อนขน กระสอบเกลือเปียกชื้นหนักกว่ากระสอบแป้งครึ่งหนึ่ง {name}แบกจนเกือบสาง หลังเปียกทั้งเหงื่อทั้งน้ำเกลือ ลูกเรือไอตลอดเวลาที่ส่งกระสอบให้

        สัปดาห์ต่อมาคนขนเกลือคืนนั้นไอแห้งไปครึ่งหนึ่ง แล้วคนในบ้านของพวกเขา แล้วคนทั้งซอย {name}ไอวันที่ห้า ไอได้สามวันก็หยุด คนข้างบ้านไม่หยุด
      effects: { gold: 2, hp: -1, city: { mood: plague }, flags: [hauled_the_fever_salt] }
    - id: carry_broth_down
      label: ต้มน้ำซุปหม้อใหญ่ ส่งลงเรือเล็กให้ลูกเรือที่ไข้ขึ้น
      text: |
        {name}ต้มซุปกระดูกได้สองหม้อ ส่งลงเรือเล็กที่ปลายท่า คนในเรือรับไปแล้วพายกลับ คืนนั้นนายเรือก็ยังขนเกลือลงตามที่บอก คนท่าที่รับจ้างขนไม่ได้กินซุป

        สัปดาห์ต่อมาไข้ขึ้นทั้งย่าน นายเรือส่งหม้อซุปเปล่าสองใบกลับมาวางหน้าประตูของ{name} ล้างสะอาด ข้างในมีเกลือหนึ่งกำ
      effects: { alignment: { moral: 1 }, city: { mood: plague }, flags: [sent_broth_to_the_fever_barge] }
    - id: walk_away_from_the_quay
      label: เดินกลับจากท่า ปิดหน้าต่างทุกบาน
      text: |
        เรือเล็กลำที่สองเทียบท่าตอน{name}เลี้ยวพ้นซอย คืนนั้นได้ยินเสียงคนแบกเกลือร้องจังหวะกันจนเกือบสาง

        สัปดาห์ต่อมาเสียงไอแห้งดังมาจากหลังผนังทั้งสองฝั่ง {name}อุดรอยใต้ประตูด้วยผ้าชุบน้ำส้มสายชู ผ้าแห้งทุกเช้า ต้องชุบใหม่ทุกเช้า
      effects: { city: { mood: plague }, flags: [shut_the_windows_on_the_fever] }

- id: adult.city_ventras_marthis_seat
  stage: adult
  scene: council_hall
  weight: 30
  when:
    age: [25, 64]
    city: { id: ventras, min_rank: 3 }
  text: |
    สภาย่านของเวนทราสประชุมกันในห้องชั้นบนของหอท่าเรือเหาะ หัวหน้าย่านสี่คนนั่งโต๊ะเดียวกับคนของราชสำนักหนึ่งคน หลังเก้าอี้หัวหน้าย่านแต่ละคนมีเก้าอี้ตัวเตี้ยอีกตัว สำหรับคนที่หัวหน้าย่านพามานั่งฟัง คนในเมืองรู้ว่าใครนั่งเก้าอี้ตัวเตี้ยหลังใคร

    มาร์ธิส โคเวล หัวหน้าย่านท่าเรือเหาะ เจ้าของตึกแถวสามหลัง ส่งคนมาเชิญ{name}ไปนั่งเก้าอี้ตัวเตี้ยหลังเธอ เธอไม่ได้เชิญเพราะชอบหน้า เธอนับมาแล้วว่า{name}เป็นที่รู้จักในเมือง

    ประชุมครั้งนี้คนของราชสำนักเสนอให้สร้างป้อมยามที่หัวบันไดของตึกแถวทุกหลังในย่านท่าเรือเหาะ ราชสำนักออกค่าก่อสร้างเอง มาร์ธิสจะเห็นชอบ และอยากให้คนที่นั่งหลังเธอลงชื่อเป็นพยานต่อจากเธอ ให้ทุกคนในห้องเห็น
  choices:
    - id: sign_and_sit
      label: นั่งเก้าอี้ตัวเตี้ยหลังเธอ แล้วลงชื่อต่อจากเธอ
      text: |
        {name}ลงชื่อใต้ชื่อมาร์ธิส ลายมือของเธอใหญ่จนกินที่สองบรรทัด คนของราชสำนักพับกระดาษใส่กระบอกหนัง ขอบใจย่านท่าเรือเหาะทั้งย่าน

        ฤดูต่อมาป้อมยามสร้างเสร็จที่หัวบันไดตึกแถวทุกหลัง ป้อมละสองคน คนเช่าห้องเดินขึ้นบันไดผ่านทหารทุกเย็น บางคนทักทหาร บางคนเลิกกลับห้องหลังค่ำ เก้าอี้ตัวเตี้ยหลังมาร์ธิสเป็นของ{name}ทุกครั้งที่สภาประชุม
      effects: { reputation: { crown: 1 }, flags: [sits_behind_marthis, signed_for_the_stair_watch] }
    - id: sit_unsigned
      label: นั่งเก้าอี้ตัวเตี้ยหลังเธอ แต่ไม่ลงชื่อ
      text: |
        มาร์ธิสยื่นปากกาให้ข้ามไหล่ {name}ไม่รับ คนทั้งห้องเห็น คนของราชสำนักขอให้จดลงบันทึกว่าพยานคนที่สองของย่านท่าเรือเหาะไม่ลงชื่อ เสมียนสภาจดตามนั้น

        หลังประชุม มาร์ธิสบอกว่าเก้าอี้ยังเป็นของ{name} เธอไม่ไล่คนที่คนในย่านรู้จัก แต่ตั้งแต่รอบเรือถัดมา โพลแดนยกมือทัก{name}ช้ากว่าเคยหนึ่งจังหวะทุกครั้งที่เดินสวนกัน คนเช่าห้องในย่านเริ่มยกมือทัก{name}จากหัวบันได
      effects: { reputation: { crown: -1 }, city: { merit: 1 }, flags: [sits_behind_marthis, would_not_sign_for_the_stair_watch] }
    - id: move_the_watch
      label: เสนอในที่ประชุมให้ตั้งป้อมยามที่หอท่าแทนหัวบันได
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ลุกจากเก้าอี้ตัวเตี้ย พูดสั้นๆ ว่าคนขโมยของในย่านท่าเรือเหาะขโมยที่หอท่า ไม่ได้ขโมยบนบันได ป้อมยามที่หอท่าใช้ทหารน้อยกว่าครึ่ง หัวหน้าย่านโรงกลั่นหัวเราะ หัวหน้าย่านวิหารเห็นด้วยก่อนคนอื่น

          คนของราชสำนักแก้กระดาษเองต่อหน้าทุกคน ป้อมยามหนึ่งป้อมที่หอท่า มาร์ธิสลงชื่อ {name}ลงชื่อต่อ เย็นนั้นเธอบอกว่าเก้าอี้ตัวเตี้ยหลังเธอไม่มีใครนั่งได้อีกแล้ว นอกจาก{name}
        effects: { stats: { CHA: 1 }, flags: [sits_behind_marthis, moved_the_watch_to_the_tower] }
      failure:
        text: |
          {name}พูดได้ครึ่งประโยค คนของราชสำนักก็ถามว่าเก้าอี้ตัวเตี้ยมีสิทธิ์พูดในสภาตั้งแต่เมื่อไร เสมียนสภาหยุดปากกา มาร์ธิสไม่หันมา

          เธอลงชื่อคนเดียว หลังประชุมเธอบอกว่าคราวหน้าจะเชิญคนที่รู้ว่าเก้าอี้ตัวเตี้ยมีไว้นั่ง
        effects: { flags: [lost_the_seat_behind_marthis] }
    - id: decline_the_seat
      label: ส่งคนไปบอกเธอว่าไม่รับเชิญ
      text: |
        คนที่มาเชิญรับคำตอบกลับไปโดยไม่ถามเหตุผล วันประชุม เก้าอี้ตัวเตี้ยหลังมาร์ธิสมีคนอื่นนั่ง เป็นเจ้าของโกดังริมหอท่า ลงชื่อต่อจากเธอโดยไม่ต้องยื่นปากกา

        ฤดูต่อมาป้อมยามขึ้นที่หัวบันไดทุกตึก {name}เดินผ่านป้อมยามหน้าตึกแถวทุกครั้งที่ไปหอท่า เหมือนคนอื่นทั้งย่าน ทหารคนหนึ่งเริ่มจำหน้าได้
      effects: { flags: [declined_the_seat_behind_marthis] }

- id: adult.city_ventras_roof
  stage: adult
  scene: home
  weight: 10
  once: false
  when:
    age: [22, 62]
    city: { id: ventras, home: [none, room, family], min_years: 2 }
  text: |
    มิลลัส นายหน้าบ้านของเวนทราส ผูกป้ายไม้ไว้ที่ราวบันไดหลายตึกพร้อมกัน ข้างป้ายมีกระดาษบอกราคาเขียนด้วยลายมือของมิลลัสเอง บ้านแคบสองชั้นสิบสี่เหรียญ ร้านชั้นล่างริมถนนสิบแปดเหรียญ เจ้าของเดิมขึ้นเรือรอบไปแล้ว หรือกำลังจะขึ้น

    มิลลัสพา{name}ไปดูบ้านที่อยู่ในย่านเดิม หลังคาไม่รั่ว บันไดไม้เอียงไปทางซ้ายนิดหนึ่ง ผนังหลังเตาดำด้วยเขม่าของคนก่อน บ้านบนย่านวิหารมิลลัสก็มีอีกหลัง แต่บอกไว้ก่อนว่าคนบนเนินไม่ขายให้คนมีเขา เว้นแต่ไม่มีใครเคยเห็นเขาคู่นั้น

    ใบรับเงินของมิลลัสออกในวันเดียว ส่วนกุญแจจะได้เมื่อนับเหรียญครบสองรอบ
  choices:
    - id: buy_the_house
      label: ซื้อบ้าน สิบสี่เหรียญ
      requires: { min_gold: 14 }
      text: |
        มิลลัสนับเหรียญสองรอบ ยื่นกุญแจเหล็กดอกใหญ่ที่สนิมขึ้นตรงคอ ผนังหลังเตายังดำ {name}ทิ้งไว้อย่างนั้นอีกหนึ่งฤดูก่อนจะลงมือขัด

        คืนแรก{name}นั่งอยู่กลางห้องชั้นล่าง ไม่มีใครจะมาเก็บค่าเช่าตอนเรือรอบเข้าเทียบ เสียงใบพัดยังได้ยินจากที่นี่ เบากว่าที่เคย
      effects: { gold: -14, city: { home: house }, mark: ซื้อบ้านในเวนทราส, flags: [owns_a_house_in_ventras] }
    - id: buy_the_shop
      label: ซื้อร้านชั้นล่างริมถนน สิบแปดเหรียญ
      requires: { min_gold: 18 }
      text: |
        ร้านมีบานเฟี้ยมไม้หกบาน ข้างในมีแต่โต๊ะยาวตัวหนึ่งที่เจ้าของเดิมทิ้งไว้เพราะยกออกประตูไม่ได้ ชั้นบนเป็นห้องนอนห้องเดียว หน้าต่างเปิดออกไปเห็นถนน

        เช้าวันแรกที่{name}เปิดบานเฟี้ยม มีคนเดินผ่านหยุดถามว่าขายอะไร {name}ยังตอบไม่ได้ทันที
      effects: { gold: -18, city: { home: shop }, mark: เปิดร้านในเวนทราส, flags: [owns_a_shop_in_ventras] }
    - id: walk_on
      label: ขอบคุณมิลลัส แล้วเดินกลับ
      text: |
        มิลลัสไม่ตื๊อ บอกว่าป้ายไม้ของเขาผูกอยู่ที่ราวบันไดทั้งเมือง วันไหนอยากซื้อก็เดินไปดูป้าย

        ป้ายของบ้านหลังนั้นหายไปจากราวบันไดก่อนสิ้นเดือน มีคนจากเรือรอบใหม่ซื้อไป
      effects: { flags: [walked_past_millas_signs] }
