# วัยเด็ก เด็กมีเขาสามทางที่แยกตั้งแต่วันเกิด
#   origin_marked_kept      บ้านโรงสีบน พ่อแม่เก็บไว้ไม่ปิดบัง
#   origin_marked_hidden    คฤหาสน์ขุนนางในเวนทราส เลื่อยเขาแล้วเลี้ยงแบบปิดบัง
#   origin_marked_foundling วิหารใหญ่อีเซล ไม่มีพ่อแม่ ห้ามใช้ {father} {mother}
# ตรามารทำให้ไม่ได้ยินเสียงหึ่งและไม่ฝันร่วม ผู้ฟังดาวรู้เรื่องนี้

# ---------- เก็บไว้ ไม่ปิดบัง ----------
- id: childhood.kept_village_game
  stage: childhood
  weight: 9
  when:
    age: [3, 8]
    flags: [origin_marked_kept]
  text: |
    เด็กบ้านโรงสีบนมีเกมที่เล่นกันทุกเย็นหลังต้อนห่านเข้าคอก ชื่อเกมผู้กล้าหกคน เด็กหกคนเป็นผู้กล้า ถือไม้แทนดาบ อีกคนเป็นจอมมาร ต้องวิ่งหนีไปจนมุมที่กองฟางหลังโรงสี แล้วยอมให้ผนึก

    ไม่มีใครอยากเป็นจอมมาร จน{name}โตพอจะวิ่งตามพวกเขาทัน

    "แกเป็น" เด็กโตที่สุดในกลุ่มชี้มา ไม่ต้องจับไม้สั้นไม้ยาวเหมือนทุกที "แกมีเขาอยู่แล้ว ไม่ต้องแต่ง"

    เด็กบางคนหัวเราะ บางคนไม่หัวเราะ แต่ไม่มีใครค้าน
  choices:
    - id: be_demon
      label: รับเป็นจอมมาร แล้วเล่นให้น่ากลัวที่สุด
      text: |
        {name}คำรามจนเด็กเล็กร้องไห้ วิ่งไล่ผู้กล้าทั้งหกจนแตกกระเจิง ไม่ยอมไปจนมุมที่กองฟาง เกมเย็นนั้นจบเพราะฟ้ามืด ไม่ใช่เพราะจอมมารโดนผนึก

        วันรุ่งขึ้นเด็กๆ มาเรียกถึงหน้าบ้าน ถามว่าเย็นนี้เล่นอีกไหม
      effects: { stats: { CHA: 1 }, flags: [played_demon_lord, lean_bard] }
    - id: seventh_hero
      label: บอกว่าจะเป็นผู้กล้าคนที่เจ็ด
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          "ไม่มีคนที่เจ็ด" เด็กโตว่า

          "มีสิ คนที่ไม่มีใครเล่าถึงไง" {name}ตอบ "ถ้ามีคนเล่า แกก็คงรู้แล้ว"

          เด็กโตเถียงไม่ออก เกมเย็นนั้นมีผู้กล้าเจ็ดคน ไม่มีจอมมาร ทุกคนวิ่งไล่ฟันกันเองจนมืด
        effects: { stats: { CHA: 1 } }
      failure:
        text: |
          เด็กโตบอกว่าผู้กล้ามีหกคน ใครๆ ก็รู้ แล้วพาทุกคนไปเล่นที่ลานหลังวิหาร

          {name}ยืนอยู่หลังโรงสีคนเดียว ไม้ยังอยู่ในมือ จนเห็น{mother}เดินมาตาม
        effects: { stats: { WIS: 1 } }
    - id: go_home
      label: วางไม้ แล้วเดินกลับบ้าน
      text: |
        {mother}ถามว่าทำไมกลับเร็ว {name}บอกว่าเหนื่อย เธอไม่ถามต่อ

        คืนนั้นเธอเล่าเรื่องผู้กล้าหกคนให้ฟังจนจบ แต่เล่าไม่เหมือนที่เด็กๆ เล่นกัน ในเรื่องของแม่ จอมมารไม่มีเขา
      effects: { stats: { WIS: 1 } }

- id: childhood.kept_grandmother_hood
  stage: childhood
  weight: 8
  when:
    age: [4, 9]
    flags: [origin_marked_kept]
  text: |
    ย่าไม่เคยพูดกับ{name}ตรงๆ สักคำตั้งแต่เกิด เจอกันที่บ่อน้ำก็หันไปทางอื่น ไปกินข้าวบ้านย่าวันขึ้นปีใหม่ ย่าตักแกงให้ทุกคนยกเว้น{name} แล้ววางถ้วยไว้ใกล้ๆ ให้ตักเอง

    หน้าหนาวปีนั้น มีห่อผ้าวางอยู่หน้าประตูบ้านตอนเช้า ข้างในเป็นหมวกไหมพรมสีน้ำตาล ถักแน่นสองชั้น ขนาดพอดีหัวเด็ก ไม่มีใครบอกว่าใครเอามาวาง แต่ทั้งหมู่บ้านมีคนถักลายนี้อยู่คนเดียว

    หมวกใบนั้นยาวลงมาคลุมหู และหนาพอจะปิดเขาทั้งสองข้างได้มิด
  choices:
    - id: wear
      label: สวมไปเดินผ่านหน้าบ้านย่า
      text: |
        {name}สวมหมวกเดินผ่านหน้าบ้านย่าทุกเช้าตลอดหน้าหนาว ย่านั่งกะเทาะถั่วอยู่หน้าบ้าน ไม่เงยหน้า

        เช้าวันหนึ่งย่าพูดขึ้นลอยๆ ว่า "หนาวปีนี้มาเร็ว" แล้วก้มหน้ากะเทาะถั่วต่อ
      effects: { stats: { CON: 1 }, flags: [wore_grandmother_hood] }
    - id: cut_holes
      label: ขอแม่เจาะรูให้เขาโผล่ออกมา
      text: |
        {mother}ถามว่าแน่ใจหรือ ถามครั้งเดียว แล้วไปหยิบกรรไกร

        {name}สวมหมวกที่มีรูสองรูเดินผ่านหน้าบ้านย่า ย่าเงยหน้าขึ้นมอง ถั่วในมือร่วงลงตัก แล้วลุกเข้าบ้าน ปิดประตู

        สามวันต่อมามีห่อผ้าวางหน้าประตูอีก ข้างในเป็นไหมพรมสีน้ำตาลอีกม้วน สีเดียวกัน สำหรับเย็บขอบรูที่เริ่มลุ่ย
      effects: { stats: { CHA: 1 }, flags: [hood_with_holes] }
    - id: give_back
      label: เอาไปวางคืนหน้าบ้านย่า
      text: |
        {name}เอาห่อผ้าไปวางคืนหน้าประตูบ้านย่าตอนเช้ามืด ก่อนไก่ขัน

        ย่าไม่ส่งอะไรมาอีกเลย ปลายหนาวนั้น{name}เห็นหมวกใบเดิมสวมอยู่บนหัวหลานอีกคนของย่า
      effects: { stats: { WIS: 1 } }

- id: childhood.kept_hunter_visit
  stage: childhood
  weight: 9
  when:
    age: [5, 9]
    flags: [origin_marked_kept]
  text: |
    นักล่าแม่มดของศาสนจักรตะเกียงมาถึงบ้านโรงสีบนตอนสาย ขี่ม้าสีเทา เสื้อคลุมขาวปักรูปตะเกียงแขวนไว้ที่อก มีเสมียนเดินตามมาหนึ่งคน ถือสมุดวิหารเล่มเดียวกับที่ลงชื่อ{name}ไว้ตั้งแต่เกิด

    เขามาทุกห้าปี เปิดสมุดดูหน้าผู้ต้องตรา หมู่บ้านนี้มีชื่ออยู่ในหน้านั้นชื่อเดียว

    เขานั่งลงบนม้านั่งหน้าบ้าน ถอดถุงมือทีละนิ้ว แล้วให้{name}มายืนตรงหน้า {mother}ยืนอยู่ข้างหลัง มือวางบนไหล่ลูก แน่นกว่าทุกครั้ง

    เขาแหวกผมดูเขา วัดด้วยนิ้ว จับคางยกขึ้นมองตา แล้วถามด้วยน้ำเสียงเหมือนหมอถามคนไข้

    "เจ้าเคยฝันถึงเสียงทุ้มๆ เรียกชื่อเจ้าไหม"
  choices:
    - id: say_no
      label: ตอบว่าไม่เคย
      text: |
        "ไม่เคย{ครับ|ค่ะ}"

        เขาจับคาง{name}ค้างไว้อีกอึดใจหนึ่ง แล้วปล่อย เสมียนจดลงสมุดว่า ไม่ฝัน

        ก่อนขึ้นม้า เขาหันมาบอก{mother}ว่า ถ้าวันไหนลูกฝัน ให้พาไปวิหารเวรัสในเมือง อย่ารอให้ฝันครั้งที่สอง
      effects: { stats: { WIS: 1 }, flags: [lamp_inspected] }
    - id: ask_back
      label: ถามกลับว่าเสียงนั้นเรียกชื่อว่าอะไร
      text: |
        เสมียนหยุดเขียน นักล่าแม่มดยิ้มเป็นครั้งแรก ไม่ใช่ยิ้มแบบที่{mother}อยากเห็น

        "ถ้าได้ยินเมื่อไหร่ เจ้าจะรู้เอง" เขาว่า

        เขาให้เสมียนจดเพิ่มอีกบรรทัด แล้วบอกว่าปีหน้าจะมาอีก ไม่ต้องรอห้าปี
      effects: { stats: { CHA: 1 }, reputation: { lamp_church: -1 }, flags: [lamp_inspected, lamp_suspicion] }
    - id: stare
      label: ไม่ตอบ จ้องตาเขากลับ
      text: |
        {name}ไม่ตอบ จ้องตาเขากลับไป แดดสายส่องเข้าตาจนเห็นเป็นสีแดงจางๆ ที่ก้นตา

        เขาไม่หลบตา จ้องกลับจน{mother}บีบไหล่ลูกแรงขึ้น แล้วเขาก็หัวเราะสั้นๆ ทีหนึ่ง เหมือนคนเพิ่งชนะพนัน เสมียนจดลงสมุดว่า ไม่ตอบ
      effects: { stats: { CON: 1 }, flags: [lamp_inspected] }

# ---------- ซ่อนในบ้านขุนนาง ----------
- id: childhood.hidden_filing
  stage: childhood
  weight: 9
  when:
    age: [3, 8]
    flags: [origin_marked_hidden]
  text: |
    ทุกคืนเดือนดับ หมอประจำตระกูลมาที่คฤหาสน์ตอนสองทุ่ม เข้าทางประตูหลังที่คนส่งถ่านใช้ ถือกระเป๋าหนังใบเล็ก ทุกคนในบ้านรู้ว่าเขามาทำอะไร ไม่มีใครพูดถึง

    ตอเขาสองข้างที่เลื่อยไปตั้งแต่คืนแรกงอกกลับมาทุกเดือน ทีละนิด ปล่อยไว้สามเดือนก็ดันผมขึ้นมาเป็นตุ่ม หมอจึงต้องมาตะไบให้เรียบเสมอหนังหัว

    {name}นั่งบนเก้าอี้ตัวเตี้ยในห้องแต่งตัวของท่านย่า หันหน้าเข้ากระจกที่คลุมผ้าขาวไว้ หมอแหวกผม เสียงตะไบดังครืดๆ อยู่ข้างหู กลิ่นเหมือนเล็บไหม้ ท่านย่านั่งดูอยู่บนเก้าอี้ริมหน้าต่าง ไม่เคยขาดสักเดือน
  choices:
    - id: endure
      label: นั่งนิ่ง นับเสียงตะไบ
      text: |
        {name}นับได้สองร้อยสิบสามครั้งก่อนหมอจะเก็บตะไบ เดือนต่อมานับได้สองร้อยยี่สิบ

        ท่านย่าบอกว่าให้นับทุกเดือน แล้วมาบอกแกคนเดียว เดือนไหนนับได้มากขึ้น ให้บอกเร็วๆ
      effects: { stats: { CON: 1 }, flags: [counts_the_file] }
    - id: ask_doctor
      label: ถามหมอว่าทำไมต้องทำทุกเดือน
      text: |
        หมอเหลือบมองท่านย่าก่อนตอบ

        "เพราะของบางอย่างไม่ยอมแพ้ขอรับ" เขาว่า แล้วตะไบต่อ

        ท่านย่าไม่ว่าอะไร แต่เดือนต่อมาหมอไม่พูดกับ{name}อีกเลยสักคำ
      effects: { stats: { INT: 1 } }
    - id: uncover_mirror
      label: ดึงผ้าคลุมกระจกออก
      text: |
        ผ้าขาวไหลลงกองกับพื้น ในกระจก ตอเขาสองข้างโผล่พ้นผมขึ้นมา สีเทาด้านเหมือนเขาวัวที่ตัดแล้ว หมอชะงักตะไบค้างไว้กลางอากาศ

        ท่านย่าลุกขึ้นมาดึงผ้าคลุมกลับ แล้วทำสิ่งที่แกไม่เคยทำมาก่อน แกวางมือบนหัว{name} ตรงตอเขาพอดี

        "ของของเจ้า" แกว่า "ข้าไม่ได้บอกว่าน่าเกลียด ข้าบอกว่าต้องเก็บ"
      effects: { stats: { WIS: 1 }, flags: [saw_own_horns] }

- id: childhood.hidden_tail
  stage: childhood
  weight: 8
  when:
    age: [4, 9]
    flags: [origin_marked_hidden]
  text: |
    ลูกพี่ลูกน้องฝั่งแม่มาค้างที่คฤหาสน์ช่วงปีใหม่ อายุมากกว่า{name}สองปี ช่างพูด และชอบเปิดประตูห้องที่คลุมผ้าขาว

    บ่ายวันที่สาม เด็กสองคนเล่นซ่อนหากันในห้องที่ปิดไว้ {name}มุดเข้าไปซ่อนใต้โต๊ะคลุมผ้า ชายเสื้อเปิดขึ้นตอนคลาน พอลูกพี่ลูกน้องเลิกผ้าขึ้นมาเจอ ปลายหางกำลังขดอยู่บนพรม

    ลูกพี่ลูกน้องจ้องอยู่สามอึดใจ แล้วถามว่า "นั่นอะไร"
  choices:
    - id: bribe
      label: ยื่นเข็มกลัดเงินของแม่ให้ แลกกับการไม่พูด
      text: |
        ลูกพี่ลูกน้องรับเข็มกลัดไป พลิกดูด้านหลัง แล้วเก็บใส่กระเป๋า ตลอดปีใหม่นั้นไม่ปริปากกับใคร

        ปีใหม่ปีต่อมาก็มาค้างอีก และมาขอของชิ้นใหม่
      effects: { stats: { INT: 1 }, flags: [cousin_knows, cousin_blackmail, lean_rogue] }
    - id: threaten
      label: บอกว่าถ้าพูด จะมีของมาหาตอนกลางคืน
      check: { stat: CHA, dc: 11 }
      success:
        text: |
          ห้องที่ปิดไว้มืด ตาของ{name}ใต้โต๊ะจับแสงจากช่องประตูไว้เป็นจุดแดงสองจุด ลูกพี่ลูกน้องร้องไห้ ปล่อยผ้าคลุมโต๊ะแล้ววิ่งออกจากห้อง

          ตลอดปีใหม่ไม่พูดกับใครเรื่องนี้อีก ปีต่อมาไม่ยอมมาค้างที่คฤหาสน์
        effects: { stats: { CHA: 1 }, flags: [cousin_knows] }
      failure:
        text: |
          ลูกพี่ลูกน้องหัวเราะ บอกว่าโกหก แล้ววิ่งไปหาท่านย่า

          เย็นนั้นท่านย่าเรียกเด็กคนนั้นเข้าห้องสมุด ปิดประตูอยู่จนเลยเวลาอาหารเย็น ออกมาแล้วเด็กคนนั้นไม่พูดถึงหางอีกเลย และไม่มาค้างที่คฤหาสน์อีกเลยเหมือนกัน
        effects: { stats: { WIS: 1 }, flags: [cousin_knows] }
    - id: laugh_off
      label: หัวเราะ บอกว่าเป็นเชือกผูกเอว
      text: |
        {name}ดึงหางเข้าเสื้อเร็วจนลูกพี่ลูกน้องไม่แน่ใจว่าเห็นอะไร

        "เชือกผูกเอว ท่านย่าให้ผูกกันกางเกงหลุด" {name}ว่า แล้วหัวเราะ ลูกพี่ลูกน้องหัวเราะตาม ล้อเรื่องกางเกงหลุดจนลืมเรื่องอื่นไปหมด
      effects: { stats: { DEX: 1 } }

- id: childhood.hidden_no_dream
  stage: childhood
  weight: 8
  when:
    age: [5, 10]
    flags: [origin_marked_hidden]
  text: |
    เช้าวันนั้นทั้งคฤหาสน์ตื่นสาย คนครัวเล่าให้สาวใช้ฟัง สาวใช้เล่าให้คนสวนฟัง คนสวนต่อเรื่องให้ได้ทุกตอน เพราะทุกคนฝันเรื่องเดียวกัน

    ในฝันทุกคนยืนอยู่บนหลังคาคฤหาสน์ ฟ้าข้างบนเป็นผ้าดำขึงตึง มีอะไรกดลงมาจากอีกฝั่ง ผ้ายุบลงมาใกล้หลังคาทุกที คนครัวบอกว่าตรอกหลังบ้านก็ฝันแบบนี้กันทั้งตรอก ได้ยินว่าย่านโรงกลั่นฝันกันทั้งย่าน

    {mother}ฝัน {father}ก็ฝัน ท่านย่านั่งดื่มชาอยู่ที่โต๊ะอาหาร ไม่บอกว่าฝันหรือไม่ฝัน

    {name}ไม่ได้ฝันอะไรเลย หลับสนิททั้งคืน ตื่นมาก็ไม่รู้ว่าทุกคนพูดเรื่องอะไรกันอยู่
  choices:
    - id: pretend
      label: ทำเป็นว่าตัวเองก็ฝัน
      check: { stat: CHA, dc: 11 }
      success:
        text: |
          {name}เล่าตามที่ได้ยินคนครัวเล่ามาทุกรายละเอียด ผ้าดำ หลังคา แอ่งที่ยุบลงมา เติมเองอีกนิดว่าตื่นมาเหงื่อแตก สาวใช้ฟังแล้วขนลุกตามทุกประโยค

          ท่านย่ามองข้ามขอบถ้วยชามาครู่หนึ่ง แล้วดื่มต่อ
        effects: { stats: { CHA: 1 } }
      failure:
        text: |
          {name}เล่าผิดตรงที่บอกว่าฟ้าเป็นสีแดง ทุกคนในห้องหันมามอง สาวใช้คนใหม่ถามว่าทำไมเป็นสีแดง ของคนอื่นเป็นสีดำ

          ท่านย่าวางถ้วยลงบนจานรองเสียงดัง แล้วบอกให้ทุกคนไปทำงาน
        effects: { stats: { WIS: 1 }, flags: [servant_suspects] }
    - id: honest
      label: บอกว่าเมื่อคืนไม่ได้ฝันอะไรเลย
      text: |
        ห้องเงียบลง คนครัวทำช้อนหล่น

        คืนนั้นท่านย่าเรียก{name}เข้าห้องสมุด บอกว่าวันไหนคนทั้งบ้านฝันเรื่องเดียวกัน ให้ฝันด้วย

        "ฝันไม่เป็นก็โกหกให้เป็น" แกว่า "ข้าโกหกมาหกสิบปี ยังไม่มีใครจับได้"
      effects: { stats: { INT: 1 }, flags: [said_no_dream] }
    - id: ask_grandmother
      label: ถามท่านย่าว่าท่านฝันไหม
      text: |
        ท่านย่าวางถ้วยชาลงบนจานรองโดยไม่ให้มีเสียง

        "ฝัน" แกว่า แล้วเล่าฝันให้ฟังทั้งเรื่อง ตรงกับที่คนครัวเล่าทุกคำ เล่าจบแกถามว่า "เจ้าจำได้ไหม ข้าเล่าว่าอย่างไร"

        แกให้{name}ทวนให้ฟังจนคล่อง ทวนจนไม่ต้องนึก
      effects: { stats: { WIS: 1 }, flags: [learned_to_lie_dream] }

- id: childhood.hidden_ball
  stage: childhood
  weight: 9
  when:
    age: [8, 11]
    flags: [origin_marked_hidden]
  text: |
    งานเลี้ยงปีใหม่ที่คฤหาสน์ตระกูลโรแวนดิส ห้องโถงสว่างด้วยตะเกียงฟ้านับร้อยดวง แสงสีฟ้าทำให้ผิวทุกคนดูเย็น ผู้ใหญ่ต้อนเด็กๆ ของตระกูลขุนนางไปไว้ในห้องเล็กข้างโถง มีขนม มีครูดนตรีดีดพิณให้ฟัง

    ลูกชายคนโตของตระกูลโรแวนดิสอายุสิบเจ็ด เพิ่งกลับจากสถาบันเวทหลวง เขาเดินเข้ามาในห้องเด็ก นั่งลงบนพนักเก้าอี้ยาว ยิ้มให้ทุกคน แล้วฮัมเพลงเบาๆ เพลงไม่มีคำ เสียงต่ำลากยาว

    เด็กในห้องเงียบลงทีละคน บางคนเริ่มฮัมตาม บางคนนั่งตาลอย ครูดนตรีหยุดดีดพิณกลางเพลง

    {name}ไม่รู้สึกอะไรเลย ได้ยินแค่ผู้ชายคนหนึ่งฮัมเพลงไม่เพราะ และเห็นว่าเขาไม่ได้มองเด็กที่ฮัมตาม เขากวาดตามองหาเด็กที่ไม่ฮัม
  choices:
    - id: hum_along
      label: ฮัมตาม ทำตาลอยให้เหมือนคนอื่น
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ฮัมตาม ปล่อยตาลอยไปที่ตะเกียงฟ้าบนเพดาน เหมือนเด็กข้างๆ สายตาของเขากวาดผ่าน{name}ไปโดยไม่หยุด แล้วไปหยุดที่เด็กผู้หญิงคนหนึ่งตรงมุมห้อง ที่นั่งกินขนมอยู่เฉยๆ

          ปีใหม่ปีต่อมา {name}ไม่เห็นเด็กคนนั้นในงานอีก
        effects: { stats: { CHA: 1 }, flags: [fooled_star_listener, lean_bard] }
      failure:
        text: |
          {name}ฮัมตาม แต่ช้าไปครึ่งจังหวะ แล้วก็เพี้ยน

          เขาหยุดฮัม ยิ้มให้{name}คนเดียว แล้วถามชื่อ ถามสกุล ถามว่านอนหลับดีไหม ก่อนกลับเขาเดินไปคุยกับท่านย่าที่ประตู คุยกันจนแขกคนอื่นกลับไปเกือบหมด ท่านย่ายิ้มตลอด ขากลับในรถม้าแกไม่พูดสักคำ
        effects: { stats: { WIS: 1 }, flags: [star_listener_noticed] }
    - id: eat_cake
      label: ก้มหน้าก้มตากินขนมต่อ
      text: |
        {name}กินขนมชิ้นที่สาม เพลงหยุด เงาของเขาทาบลงบนจานขนม

        "อร่อยไหม" เขาถาม "เด็กที่กินเก่งอย่างนี้ คงนอนหลับสนิททุกคืน ไม่ฝันอะไรเลย"

        ท่านย่าส่งสาวใช้มาตามกลับก่อนงานเลิก
      effects: { stats: { CON: 1 }, flags: [star_listener_noticed] }
    - id: leave
      label: ขอตัวออกไปหาท่านย่า
      text: |
        {name}เดินออกจากห้องก่อนเขาจะฮัมจบท่อนแรก ไปกระซิบเล่าให้ท่านย่าฟัง

        ท่านย่าลุกขึ้นทันที บอกเจ้าของงานว่าหลานไม่สบาย ในรถม้าขากลับ แกจับมือ{name}ไว้แน่นตลอดทาง จนถึงคฤหาสน์ก็ยังไม่ปล่อย
      effects: { stats: { INT: 1 }, flags: [warned_grandmother] }

# ---------- เด็กวิหารอีเซล ----------
- id: childhood.foundling_night_fire
  stage: childhood
  weight: 9
  when:
    age: [3, 8]
    flags: [origin_marked_foundling]
  text: |
    ไฟในชามหน้าแท่นต้องมีคนเฝ้าทุกคืน แม่ชีผลัดกันนั่งเวรทีละคน เติมน้ำมันทุกชั่วยาม ห้ามหลับ ห้ามออกจากโถง สามร้อยปีมาแล้วไฟไม่เคยดับ

    คืนที่แม่ชีโทเรนเข้าเวร {name}แอบลุกจากห้องยาว เดินเท้าเปล่ามานั่งข้างแก แกไม่ไล่ แต่ก็ไม่พูดด้วย

    ดึกมาก ประตูข้างโถงเปิดผางออก ความหนาวพุ่งตรงเข้ามา เปลวไฟในชามเอนราบลงไปกับขอบ หรี่จนเหลือแค่สีน้ำเงินเล็กๆ ที่ไส้

    แม่ชีโทเรนหลับคอพับอยู่บนม้านั่ง
  choices:
    - id: shield
      label: ยืนกางแขนบังลมไว้
      check: { stat: CON, dc: 11 }
      success:
        text: |
          {name}ยืนกางแขนอยู่หน้าชาม ลมพัดหลังจนเสื้อปลิว หนาวจนฟันกระทบกัน เปลวไฟค่อยๆ ตั้งตัวขึ้นมาใหม่ สีน้ำเงินกลายเป็นสีส้ม

          แม่ชีโทเรนตื่นมาเห็นตอนนั้น แกลุกไปปิดประตู ลงกลอน เช้าวันนั้นแกตักข้าวต้มให้{name}เป็นคนแรกของห้องยาว
        effects: { stats: { CON: 1 }, flags: [kept_the_flame] }
      failure:
        text: |
          ลมแรงกว่าตัว{name} เปลวไฟหรี่ลงจนเหลือจุดเดียว {name}ร้องเรียกสุดเสียง แม่ชีโทเรนสะดุ้งตื่น คว้ากาน้ำมันเทลงชาม ไฟลุกพรึบขึ้นมาใหม่

          แกจับไหล่{name}ไว้ทั้งสองข้าง มือสั่น "อย่าบอกใคร" แกว่า
        effects: { stats: { WIS: 1 }, flags: [toren_secret] }
    - id: close_door
      label: วิ่งไปปิดประตู
      text: |
        ประตูหนักกว่าที่คิด {name}ต้องเอาไหล่ดันจนเท้าลื่นไปบนพื้นหิน ปิดได้ตอนที่ไฟเหลือแค่ปลายไส้ แล้วเปลวไฟก็ค่อยๆ ลุกขึ้นมาใหม่

        แม่ชีโทเรนตื่นเพราะเสียงกลอน แกมองไฟ มองประตู มอง{name} แล้วกลับไปนั่งตัวตรงจนเช้า
      effects: { stats: { DEX: 1 }, flags: [kept_the_flame] }
    - id: wake_toren
      label: เขย่าปลุกแม่ชีโทเรน
      text: |
        แกสะดุ้งตื่น คว้ากาน้ำมันได้ทันก่อนไฟจะดับ แล้วนั่งนิ่ง มือยังกำหูกาไว้จนข้อนิ้วขาว

        "ข้าเฝ้ามาสี่สิบปี ไม่เคยหลับ" แกพูดในที่สุด เป็นคำแรกที่แกพูดกับ{name}ในคืนนั้น "ปีนี้หลับครั้งแรก"
      effects: { stats: { CHA: 1 }, flags: [toren_secret] }

- id: childhood.foundling_hatch
  stage: childhood
  weight: 8
  when:
    age: [5, 10]
    flags: [origin_marked_foundling]
  text: |
    คืนนั้น{name}ลุกไปกินน้ำ เดินผ่านครัว ได้ยินเสียงไม้กระทบกันเบาๆ ตรงช่องส่งขนมปัง

    {name}มองลอดช่องประตูครัวออกไป เห็นแผ่นไม้ของช่องเปิดอยู่ครึ่งหนึ่ง มีมือคู่หนึ่งดันตะกร้าเข้ามา มือผู้หญิง นิ้วแตก เล็บดำ ตะกร้าวางลงข้างถุงขนมปัง มือคู่นั้นค้างอยู่ตรงนั้นอีกครู่ แตะผ้าห่อในตะกร้า แล้วถอนกลับไป

    ข้างนอกมีเสียงฝีเท้าเดินออกไปบนกรวด ช้าๆ แล้วเร็วขึ้น
  choices:
    - id: follow
      label: เปิดประตูข้าง วิ่งตามเสียงฝีเท้า
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}วิ่งไปถึงประตูรั้วทัน เห็นหลังผู้หญิงคนหนึ่งในผ้าคลุมไหล่สีเทา เดินเร็วไปทางทุ่ง ไม่หันกลับมา

          ไม่เห็นหน้า เห็นแค่ว่าผ้าคลุมไหล่ผืนนั้นเย็บจากกระสอบแป้ง ที่มุมผ้ายังเห็นตราโรงสีเลือนอยู่ครึ่งหนึ่ง
        effects: { stats: { DEX: 1 }, flags: [saw_hatch_mother, lean_rogue] }
      failure:
        text: |
          {name}สะดุดธรณีประตูข้าง ล้มเข่าถลอกบนกรวด พอลุกขึ้นได้ เสียงฝีเท้าก็หายไปแล้ว เหลือแต่เสียงจิ้งหรีด

          กลับเข้ามา เด็กในตะกร้าเริ่มร้อง
        effects: { stats: { WIS: 1 } }
    - id: take_baby
      label: อุ้มเด็กในตะกร้าขึ้นมา
      text: |
        เด็กในตะกร้าไม่มีเขา เป็นเด็กมนุษย์ธรรมดา ห่อด้วยผ้าขนหนูเก่าที่ซักจนบาง {name}อุ้มไว้ โยกไปมาแบบที่เห็นแม่ชีทำ ร้องเพลงที่เด็กโตสอน

        แม่ชีที่เข้าเวรเช้ามาเจอทั้งสองคนหลับอยู่ข้างช่องขนมปัง
      effects: { stats: { CHA: 1 }, flags: [held_hatch_baby] }
    - id: call_toren
      label: วิ่งไปเคาะห้องแม่ชีโทเรน
      text: |
        แม่ชีโทเรนออกมาในชุดนอน อุ้มเด็กไปที่ชามไฟ เปิดสมุด แล้วถาม{name}ว่าเห็นอะไรบ้าง {name}เล่าเรื่องมือคู่นั้น นิ้วแตก เล็บดำ

        แกฟังจบแล้วบอกว่าไม่ต้องเล่าให้ใครฟังอีก "คนที่มาช่องนี้ ไม่อยากให้ใครจำได้" แกว่า แล้วจุ่มปากกา
      effects: { stats: { INT: 1 } }

- id: childhood.foundling_gentleman
  stage: childhood
  weight: 9
  when:
    age: [6, 10]
    flags: [origin_marked_foundling]
  text: |
    สุภาพบุรุษคนนั้นมาที่วิหารในรถม้าสีดำ ล้อรถสะอาดเหมือนไม่เคยแตะถนนโคลน เขาบอกแม่ชีว่ามาจากโรงเรียนการกุศลในเวนทราส รับเด็กกำพร้าไปเลี้ยง ให้เรียนหนังสือ เรียนเวท โดยไม่คิดเงิน

    เขาขอดูแต่เด็กที่มีเขา

    แม่ชีพาเด็กมีเขามาเข้าแถวในห้องรับแขก สุภาพบุรุษยิ้มให้ทุกคน แจกลูกกวาด แล้วนั่งลงตรงหน้าเด็กทีละคน ถามคำถามเดียวกันทุกคน

    "เคยได้ยินเสียงหึ่งๆ ตอนกลางคืนไหม เสียงต่ำๆ ที่ดังอยู่ใต้เสียงอื่น"

    เด็กคนไหนตอบว่าไม่เคย เขาจะยิ้มกว้างขึ้นนิดหนึ่ง แล้วจดชื่อลงสมุดเล่มเล็ก ปกหนังสีเขียว

    ถึงคิวของ{name}
  choices:
    - id: say_no
      label: ตอบตามจริงว่าไม่เคย
      text: |
        เขายิ้ม จดชื่อ บอกแม่ชีว่าเดือนหน้าจะกลับมารับเด็กสามคน

        เดือนต่อมารถม้าสีดำกลับมาจริง แม่ชีโทเรนบอกเขาว่าเด็กสามคนนั้นมีคนรับไปเลี้ยงแล้ว ตอนนั้นทั้งสามคนนั่งกอดเข่าอยู่ในห้องใต้หลังคา หนึ่งในนั้นคือ{name}
      effects: { stats: { WIS: 1 }, flags: [star_listener_list, hidden_in_attic] }
    - id: lie_yes
      label: โกหกว่าได้ยินทุกคืน
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          "เสียงเหมือนอะไร" เขาถาม

          {name}ทำเสียงหึ่งในคอ ต่ำๆ ยาวๆ เหมือนที่เด็กในเมืองเล่าว่าได้ยิน เขาเคาะปากกากับสมุดสองที แล้วไม่จดชื่อ ยื่นลูกกวาดให้เพิ่มอีกเม็ด
        effects: { stats: { CHA: 1 }, flags: [fooled_star_listener, lean_bard] }
      failure:
        text: |
          "เสียงเหมือนอะไร" เขาถาม

          {name}ทำเสียงหึ่งในคอ แต่สูงเกินไป เหมือนเสียงแมลงวัน เขายิ้มกว้างขึ้น แล้วจดชื่อลงสมุด
        effects: { stats: { WIS: 1 }, flags: [star_listener_list] }
    - id: ask_school
      label: ถามว่าโรงเรียนอยู่ถนนไหน
      text: |
        เขาตอบชื่อถนนทันที คล่องเหมือนท่องมา แล้วจดชื่อ{name}ลงสมุด

        แม่ชีโทเรนยืนอยู่หลังห้อง แกจดชื่อถนนนั้นไว้ที่ขอบหนังสือสวด เดือนต่อมาแกเขียนจดหมายไปถามวิหารอีเซลในเวนทราส จดหมายตอบกลับมาว่าถนนนั้นมีแต่ร้านกาแฟกับหอสมุด ไม่มีโรงเรียน
      effects: { stats: { INT: 1 }, flags: [star_listener_list, toren_suspects_school] }

- id: childhood.foundling_tin_button
  stage: childhood
  weight: 8
  when:
    age: [8, 11]
    flags: [foundling_tin_button]
  text: |
    กระดุมดีบุกเม็ดนั้นยังอยู่ในหีบใต้แท่น กับกระสอบแป้งที่พับไว้ แม่ชีโทเรนเอาออกมาให้ดูปีละครั้ง ในวันที่วิหารถือว่าเป็นวันเกิด

    ปีนี้ วันรุ่งขึ้นหลังวันนั้น มีผู้หญิงคนหนึ่งมาที่วิหาร ไม่ได้มาสวด ไม่ได้มาขอยา เธอยืนดูเด็กๆ ช่วยกันตากผ้าอยู่ที่ลาน ยืนจนแม่ครัวทนไม่ไหว เดินไปถามว่ามาหาใคร

    เธอบอกว่ามาดูเฉยๆ แล้วเดินผ่านแถวเด็กไปช้าๆ มองข้อมือทุกคน ข้อมือของ{name}ว่างเปล่า กระดุมเม็ดนั้นอยู่ในหีบมาตั้งแต่วันแรก

    เธอหยุดตรงหน้า{name} มองหน้านานกว่าคนอื่น มือข้างหนึ่งกำอะไรไว้ใต้ผ้าคลุมไหล่
  choices:
    - id: fetch_button
      label: วิ่งไปเอากระดุมดีบุกมาให้ดู
      text: |
        {name}วิ่งไปขอแม่ชีโทเรนเปิดหีบ กว่าจะกลับมาถึงลาน ผู้หญิงคนนั้นไปแล้ว แม่ครัวบอกว่าเธอเดินออกประตูไปตอนเห็น{name}วิ่ง

        ตรงที่เธอเคยยืน มีกระดุมดีบุกตกอยู่หนึ่งเม็ด ขนาดเท่ากัน ลายเดียวกัน เหมือนเม็ดในหีบทุกอย่าง
      effects: { stats: { CHA: 1 }, flags: [tin_button_woman, second_tin_button] }
    - id: ask_name
      label: ถามชื่อเธอ
      text: |
        เธอไม่ตอบ ถามกลับว่า{name}ชื่ออะไร

        พอได้ยินชื่อ เธอทวนชื่อนั้นเบาๆ สองครั้ง "เช้าวันนั้นฟ้าเป็นอย่างนี้จริงๆ" เธอว่า

        แล้วเธอก็เดินออกประตูไป ไม่ได้หันกลับมา
      effects: { stats: { INT: 1 }, flags: [tin_button_woman] }
    - id: keep_working
      label: ก้มหน้าตากผ้าต่อ ทำเป็นไม่เห็น
      text: |
        {name}ตากผ้าต่อจนผืนสุดท้ายขึ้นราว ผู้หญิงคนนั้นยืนอยู่ตรงนั้นจนผ้าผืนสุดท้ายขึ้นราวเหมือนกัน แล้วเดินออกไป

        คืนนั้น{name}ขอให้แม่ชีโทเรนเปิดหีบให้ดูกระดุมอีกครั้ง ทั้งที่เพิ่งดูไปเมื่อวาน แกไม่ถามว่าทำไม
      effects: { stats: { WIS: 1 }, flags: [tin_button_woman] }

- id: childhood.hidden_lamp_blessing
  stage: childhood
  weight: 8
  when:
    age: [5, 11]
    flags: [origin_marked_hidden]
  text: |
    ทุกต้นปี ศาสนจักรตะเกียงทำพิธีอวยพรตะเกียงฟ้าที่วิหารเวรัส โคนเสาใจกลางเวนทราส ตระกูลขุนนางทุกตระกูลต้องไป นั่งตามที่ที่จัดให้ ตระกูลไหนไม่ไป ปีนั้นทั้งปีจะมีคนถามว่าทำไม

    วิหารสว่างจนแสบตา ตะเกียงฟ้านับพันดวงแขวนอยู่ใต้เพดานโค้ง นักล่าแม่มดในเสื้อคลุมขาวยืนเรียงตามเสาทุกต้น มือไขว้หลัง

    ปีนี้ท่านย่าให้{name}นั่งแถวหน้า ผมหวีเรียบ ตะไบเมื่อคืนเดือนดับที่ผ่านมา เรียบจนคลำไม่เจอ

    ตอนท้ายพิธี นักบวชใหญ่เดินลงมาตามแถว วางมือบนหัวเด็กทุกคนเพื่ออวยพร ทีละคน ทีละตระกูล ใกล้เข้ามาทุกที
  choices:
    - id: bow_low
      label: ก้มหัวต่ำ ให้มือแตะแค่หน้าผาก
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}ก้มต่ำจนคางชิดอก มือของนักบวชใหญ่แตะลงที่หน้าผาก ต่ำกว่าตอเขาไปสองนิ้ว อวยพรสั้นๆ แล้วเลื่อนไปคนถัดไป

          ขากลับท่านย่าบอกว่าก้มต่ำเกินไปหน่อย ปีหน้าให้ก้มน้อยกว่านี้ คนจะได้ไม่จำ
        effects: { stats: { DEX: 1 } }
      failure:
        text: |
          {name}ก้มเร็วเกินไป ศีรษะชนมือนักบวชใหญ่เข้าเต็มๆ ฝ่ามือของเขาวางลงบนกระหม่อมพอดี นิ้วกลางอยู่ห่างตอเขาข้างซ้ายแค่เส้นผม

          เขาหยุดไปครึ่งอึดใจ แล้วอวยพรต่อจนจบ เลื่อนไปคนถัดไป ขากลับท่านย่าไม่พูดอะไร คืนนั้นหมอมาที่คฤหาสน์ ยังไม่ถึงเดือนดับด้วยซ้ำ
        effects: { stats: { WIS: 1 }, flags: [lamp_priest_touched] }
    - id: sit_straight
      label: นั่งตัวตรง ปล่อยให้มือวางลงตามปกติ
      check: { stat: CON, dc: 11 }
      success:
        text: |
          มือของนักบวชใหญ่วางลงบนหัว หนักและอุ่น {name}นั่งนิ่ง ไม่ขยับแม้แต่ตา มือนั้นอยู่บนหัวนานเท่ากับเด็กทุกคน แล้วยกออก

          ขากลับในรถม้า ท่านย่าบีบมือ{name}ครั้งเดียว ไม่พูดอะไร
        effects: { stats: { CON: 1 } }
      failure:
        text: |
          มือของนักบวชใหญ่วางลงบนหัว {name}สะดุ้งเฮือกทั้งตัว นักบวชใหญ่ยิ้ม คิดว่าเด็กกลัว ลูบหัวซ้ำอีกที ตรงตอเขาพอดี แล้วอวยพรให้ยาวกว่าเด็กคนอื่น

          ไม่มีใครเห็นอะไร แต่{name}จำสัมผัสของนิ้วนักบวชบนตอเขาได้ไปอีกนาน
        effects: { stats: { WIS: 1 }, flags: [lamp_priest_touched] }
    - id: feign_sick
      label: ทำเป็นเวียนหัว ให้สาวใช้พาออกไปก่อน
      text: |
        {name}ทำเป็นเซ เอนพิงไหล่ท่านย่า สาวใช้รีบพาออกไปนั่งที่ระเบียงนอกวิหาร นั่งอยู่ตรงนั้นจนพิธีจบ

        ท่านย่าเดินออกมาตามทีหลัง แกบอกว่าเป็นลมได้ปีเดียว ปีหน้าคนจะเริ่มถาม
      effects: { stats: { INT: 1 } }

- id: childhood.hidden_old_maid
  stage: childhood
  weight: 7
  when:
    age: [6, 11]
    flags: [origin_marked_hidden]
  text: |
    สาวใช้คนเก่าอยู่กับตระกูลมาตั้งแต่ยังเด็ก เป็นคนเดียวนอกจากหมอที่อยู่ในห้องคืนที่{name}เกิด ทุกคืนเดือนดับเธอเป็นคนต้มน้ำให้หมอ และเป็นคนกวาดผงเขาใส่ผ้าไปเผาในเตา

    เช้าวันหนึ่งเธอแบกห่อผ้าลงบันไดหลัง ท่านย่าบอกทุกคนในบ้านว่าเธอแก่แล้ว ตระกูลให้เงินก้อนหนึ่ง กับบ้านหลังเล็กที่ชายทะเลทางใต้ ไกลจากเวนทราสสามวันเดิน

    ก่อนขึ้นเกวียน เธอเห็น{name}ยืนอยู่ที่หน้าต่างชั้นสอง เธอวางห่อผ้าลง แล้วเดินกลับเข้ามาในบ้าน
  choices:
    - id: run_down
      label: วิ่งลงไปหาเธอ
      text: |
        {name}วิ่งลงไปเจอเธอที่ห้องครัว เธอคุกเข่าลง จัดคอเสื้อให้เหมือนทุกเช้า แล้วกดอะไรเล็กๆ ใส่มือ เป็นตะไบเหล็กอันเท่านิ้วก้อย ด้ามพันด้ายแดง

        "เผื่อวันไหนหมอไม่มา" เธอกระซิบ แล้วเดินออกไปขึ้นเกวียน ไม่หันกลับมาอีก
      effects: { stats: { CHA: 1 }, flags: [maid_gave_file] }
    - id: watch_window
      label: ยืนมองอยู่ที่หน้าต่าง
      text: |
        เธอเดินเข้ามาครึ่งทาง แล้วท่านย่าก็ออกมายืนขวางที่ประตูครัว สองคนคุยกันเบาๆ ไม่กี่คำ เธอพยักหน้า แล้วเดินกลับไปขึ้นเกวียน

        เกวียนเลี้ยวพ้นประตูรั้ว ท่านย่าเงยหน้าขึ้นมองหน้าต่างชั้นสอง ตรงที่{name}ยืนอยู่ แล้วเข้าบ้านไป
      effects: { stats: { WIS: 1 } }
    - id: ask_grandmother
      label: ไปถามท่านย่าว่าเธอจะกลับมาไหม
      text: |
        ท่านย่าวางปากกา เช็ดปลายปากกากับผ้าจนสะอาดก่อนตอบ

        "ไม่กลับ" แกว่า "ที่ชายทะเลอากาศดี เธอจะได้พักเสียที" แล้วก็เขียนจดหมายต่อ

        ปลายปีนั้นมีจดหมายมาจากชายทะเลทางใต้ฉบับหนึ่ง ท่านย่าอ่านแล้วเผาทิ้งในเตาผิง {name}ไม่รู้ว่าในจดหมายเขียนว่าอะไร รู้แต่ว่าลายมือหน้าซองไม่ใช่ลายมือของสาวใช้
      effects: { stats: { INT: 1 }, flags: [maid_letter_burned] }
