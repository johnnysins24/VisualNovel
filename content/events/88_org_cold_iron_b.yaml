# ชุด อ องค์กรลับ: ภาคีเหล็กเย็น (cold_iron) ไฟล์ ข งานอีก 2 เรื่อง ขึ้นยศ 4 เรื่อง ความลับ 4 เรื่อง ถูกตามล่ากับการออก 4 เรื่อง
# คนของเตาดูหัวไฟล์ ก เพิ่มในไฟล์นี้: ซาเลีย หมอตำแยของถนนหนึ่ง · ฮัลวิน คนถือค้อนคนก่อน ทางการแขวนคอข้อหาปล้นฆ่า (เล่าถึงเท่านั้น)
#   ไพเลน หมอเถื่อนที่แก้อาการหนาวเข้ากระดูก (ชื่อบนกระดาษสีเทา)
# ของประจำยศ (อยู่ในข้อความเท่านั้น ไม่มีในรายการของ): กระดิ่งเหล็กไม่มีลูกตุ้ม ห่วงหนังเก่า (ยศ 2) ค้อนของฮัลวิน (ยศ 3) ห่วงแผ่นเหล็กบางที่เป็นสมุดชื่อ (ยศ 4)
# เกรดิสเป็นผู้เฒ่าจนตัวละครขึ้นยศ 4 เรื่องที่นางยังนั่งตำแหน่งกัน max_rank: 3 หลังจากนั้นนางนั่งบนลังข้างเตาต่อ
# ความลับเฉลยทีละชั้น เขียนให้อ่านเดี่ยวๆ ได้: โรงหลอมเดียวในคาร์ดิน (ยศ 2–3) กระดาษสีเทาพับสี่ (ยศ 3) คนจ่ายคือธนาคารเบเลค (ยศ 3) ครึ่งหนึ่งของชื่อคือคนที่ธนาคารอยากให้หาย (ยศ 4)
# ผลงานนอกงาน (merit) ในความลับ: ความลับ 1 ความลับ 2 ความลับ 3 ความลับ 4 อย่างละ +1 ในตัวเลือกเดียว รวม 4
# ตามล่า: สถาบันตามล่าสมาชิก (hunt: royal_institute) กันคนในห้องบัญชีหาย (not_orgs: [reclaimers]) การออกตั้ง left_the_cold_iron และถอด oath_cold_iron

# ---------- งานที่เตาส่ง ----------
- id: adult.iron_duty_midwife
  stage: adult
  weight: 20
  duty: cold_iron
  when:
    age: [25, 64]
    org: { id: cold_iron, min_rank: 3, max_rank: 3 }
  text: |
    ชื่อของซาเลียอยู่บนแผ่นเหล็กมาตั้งแต่ฤดูก่อน รอยบากบนวงกบห้องนางกลายเป็นสีเทาไปแล้ว นางเป็นหมอตำแยของถนนนี้ เด็กครึ่งถนนเกิดผ่านมือนาง เอดรินถือกระดิ่งเดินผ่านห้องนางสามครั้งในเดือนเดียว กระดิ่งสั่นทั้งสามครั้ง ครั้งที่สามตรงกับคืนที่เสียงเด็กร้องครั้งแรกดังออกมาจากชั้นบนของบ้านตรงข้าม

    เอดรินเล่าว่าเวลาคนคลอดเลือดไม่หยุด ซาเลียวางฝ่ามือบนท้อง พูดคำสั้นๆ คำหนึ่ง ฝ่ามือนางเรืองขึ้นเหมือนถ่านใต้ขี้เถ้า แล้วเลือดก็หยุด ตั้งแต่นางย้ายมาอยู่ ถนนนี้ไม่มีแม่คนไหนตายตอนคลอด

    ค้อนแขวนอยู่ที่เข็มขัดของ{name} คนถือค้อนเป็นคนตัดสินที่หน้าประตูว่าการเคาะครั้งต่อไปคืออะไร แล้วทำเลย ซาเลียเปิดประตูก่อน{name}จะทันยกมือ ผ้าคาดหัวยังชื้นเหงื่อจากงานเมื่อคืน
  choices:
    - id: second_knock_on_salia
      label: เคาะครั้งที่สอง หักเครื่องมือ เผาสมุดของนาง
      text: |
        เครื่องมือของซาเลียมีน้อยกว่าที่คิด กรรไกรเล่มหนึ่ง เข็มกับด้าย ผ้าสะอาดพับเป็นตั้ง กับหินแบนสีขาวก้อนหนึ่งบนหิ้งข้างประตู {name}หักหินก้อนนั้นบนขอบบ่อ หักกรรไกร เผาสมุดเล่มเดียวของนาง ผู้หญิงทั้งถนนออกมายืนดูตลอดเวลาที่ไฟลุก ไม่มีใครร้อง

        กลางหนาว แม่คนหนึ่งในถนนนั้นตายตอนคลอด ซาเลียอยู่ข้างเตียงจนเช้า ทำทุกอย่างที่มือเปล่าทำได้ ฤดูต่อมาใบประกาศค่าหัวของสถาบันที่ติดหน้าโรงเตี๊ยมมีหน้าใหม่เพิ่มขึ้นหน้าหนึ่ง วาดจากคำบอกของผู้หญิงในถนนนั้น
      effects: { alignment: { law: 1 }, hunted: { royal_institute: 1 }, flags: [burned_salias_book] }
    - id: break_only_the_stone
      label: หาของชิ้นเดียวที่ทำให้มือนางเรือง หักแค่ชิ้นนั้น
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ไม่ต้องใช้กระดิ่ง ของที่นางแตะทุกครั้งก่อนออกจากห้องมีชิ้นเดียว หินแบนสีขาวบนหิ้งข้างประตู {name}หักหินก้อนนั้นบนขอบบ่อต่อหน้านาง แล้ววางค้อนลง สมุดของนางเปิดทิ้งไว้บนโต๊ะ ทั้งเล่มเขียนแต่วันที่ ชื่อแม่ ชื่อเด็ก กับช่องท้ายบรรทัดว่าใครรอด

          ที่เตา {name}บอกว่าการเคาะครั้งที่สองจบแล้ว เครื่องมือหัก ตำราไม่มี เพราะที่นางมีไม่ใช่ตำรา ปลายหนาว สมุดของซาเลียมีบรรทัดแรกที่ช่องท้ายเขียนว่าแม่ไม่รอด
        effects: { stats: { WIS: 1 }, flags: [broke_only_salias_stone] }
      failure:
        text: |
          {name}เอื้อมไปหยิบหินแบนสีขาวบนหิ้ง ซาเลียคว้าข้อมือไว้ ฝ่ามือนางร้อนขึ้นจนผิวข้อมือของ{name}พอง นางไม่ได้ตั้งใจ มือนางทำเองเหมือนทุกครั้งที่จับคนเลือดออก หินหลุดจากมือทั้งสองคน ตกแตกบนพื้น

          {name}พันข้อมืออยู่ครึ่งเดือน ที่เตามีคนถามว่าตำราล่ะ {name}ตอบว่าไม่มี แล้วนั่งลงที่ลังของตัวเอง
        effects: { hp: -2, flags: [broke_only_salias_stone] }
    - id: teach_her_pressure
      label: สอนนางห้ามเลือดด้วยผ้ากับแรงกดก่อน แล้วค่อยหักหิน
      requires: { any_flags: [job_road_healer, job_hedge_doctor] }
      text: |
        {name}นั่งกับซาเลียทั้งบ่ายที่โต๊ะในห้องนาง สอนวิธีที่หมอตามทางใช้เมื่อไม่มีอะไรนอกจากผ้ากับมือ ผ้าพับให้แน่นแค่ไหน กดตรงไหน นานเท่าไร น้ำต้องร้อนแค่ไหน ซาเลียจดทุกคำลงสมุด ถามซ้ำสองหน แล้วหยิบหินแบนสีขาวจากหิ้งยื่นมาให้เอง

        หินแตกบนขอบบ่อด้วยค้อนทีเดียว ตำราที่ต้องเผาไม่มี สมุดของนางมีหน้าใหม่สามหน้าเป็นลายมือของ{name}
      effects: { alignment: { moral: 1 }, reputation: { cold_iron: 1 }, flags: [taught_salia_pressure] }
    - id: give_the_hammer_back
      label: บอกเตาว่าชื่อนี้ไม่ต้องเคาะอีก
      refuse: true
      text: |
        เกรดิสฟังจนจบ ไม่เถียง นางยื่นมือมาขอค้อนคืนคืนเดียว แล้วส่งให้โดเรค

        รุ่งเช้าโดเรคกลับมาพร้อมกลิ่นกระดาษไหม้ติดเสื้อ คืนค้อนให้{name}ด้วยขอเหล็ก ขอบคุณที่พูดออกมา
      effects: { flags: [refused_salias_knock] }

- id: adult.iron_duty_own_maker_mark
  stage: adult
  weight: 20
  duty: cold_iron
  when:
    age: [25, 64]
    org: cold_iron
    any_flags: [institute_graduate, unregistered_mage, job_artificer]
  text: |
    กระดิ่งของเตาสั่นหน้าบ้านหญิงทอผ้าคนหนึ่งท้ายตลาด การเคาะครั้งแรกตกเป็นของ{name} {name}ขอดูของที่ทำให้กระดิ่งสั่นก่อน หญิงทอผ้ายื่นให้โดยไม่ระแวง ตะเกียงพกขนาดเท่าฝ่ามือ ไม่มีไส้ ไม่มีน้ำมัน กดฝาทีเดียว แสงขาวนวลก็ขึ้นเอง ไม่สั่นตามลม

    นางซื้อมาจากแผงของเก่าในตลาด ใช้ส่องกี่ตอนกลางคืน ทอได้วันละสองผืนแทนผืนเดียว ลูกสาวสองคนของนางได้กินข้าวครบสามมื้อมาตั้งแต่ปลายฝน

    ใต้ก้นตะเกียงมีรอยขีดเล็กๆ สามขีดเรียงกัน รอยที่{name}ขีดไว้ใต้ทุกชิ้นที่ทำ สมัยที่ยังทำ
  choices:
    - id: lay_it_on_the_anvil
      label: เอาตะเกียงกลับไปวางบนทั่ง บอกเตาว่าเป็นงานของตัวเอง
      text: |
        {name}ยืมตะเกียงไปคืนเดียว วางลงบนทั่งในโรงไม้ แล้วบอกทุกคนที่นั่งอยู่บนลังว่าใครทำ ทำตอนไหน ขายให้ใคร ไม่มีใครขัด พอพูดจบ {name}ยกค้อนข้างทั่งขึ้นตีลงบนตะเกียงเอง สามที แสงดับตั้งแต่ทีแรก

        คืนนั้นชื่อของ{name}ขึ้นบนแผ่นเหล็กแผ่นหนึ่ง ตอกด้วยเหล็กนำศูนย์ทีละตัวอักษร แล้วได้รอยค้อนทับในลมหายใจเดียวกัน ชื่อที่จบตั้งแต่ก่อนจะเริ่ม วงกบประตูบ้านหญิงทอผ้าไม่มีรอยบาก นางกลับไปทอวันละผืน
      effects: { stats: { WIS: 1 }, alignment: { law: 1 }, flags: [struck_own_name_on_the_plates] }
    - id: notch_the_weaver
      label: บากวงกบบ้านหญิงทอผ้าเหมือนชื่ออื่น ไม่บอกใคร
      text: |
        {name}คืนตะเกียงให้นาง แล้วบากวงกบตอนนางหันหลังไปเก็บด้าย รอยบากสูงระดับไหล่ ตรง ลึกพอดี ฝีมือของคนที่บากมาหลายประตูแล้ว

        แม่บ้านในถนนเลิกเอาผ้ามาจ้างนางทอภายในเดือน ทุกคืนที่{name}เดินผ่านท้ายตลาด หน้าต่างบ้านนางยังมีแสงขาวนวลไม่สั่นตามลม ส่องกี่ที่ไม่มีผ้าให้ทอ
      effects: { alignment: { moral: -1 }, flags: [notched_the_weavers_door] }
    - id: take_it_back_at_night
      label: เข้าไปเอาตะเกียงคืนตอนกลางคืน ทุบทิ้งเอง ไม่ต้องมีรอยบาก
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          หน้าต่างบ้านนางไม่ลงกลอน ตะเกียงวางอยู่บนขอบกี่ {name}หยิบออกมาได้โดยไม่มีเสียง ทุบด้วยหินริมคูน้ำ ทิ้งเศษลงน้ำทีละชิ้น

          หญิงทอผ้าหาตะเกียงอยู่สามวัน ถามทุกบ้านในถนน กระดิ่งของเตาไม่สั่นหน้าบ้านนางอีก เตาขีดชื่อนางทิ้งว่ากระดิ่งสั่นผิด
        effects: { stats: { DEX: 1 }, flags: [stole_back_own_lamp] }
      failure:
        text: |
          เท้าของ{name}เกี่ยวขาตะกร้าด้ายใต้หน้าต่าง ตะกร้าล้ม หญิงทอผ้าลุกพรวดขึ้นจากเสื่อพร้อมกรรไกร {name}คว้าตะเกียงได้แล้ววิ่ง หัวเข่ากระแทกขอบหน้าต่างจนเลือดซึม นางเห็นหลัง เห็นด้านข้างของหน้า

          เช้ามานางไปบอกคนทั้งตลาดว่ามีขโมยเข้าบ้าน ขโมยของชิ้นเดียว ชิ้นที่ทำให้ลูกนางได้กินสามมื้อ
        effects: { hp: -2, flags: [stole_back_own_lamp] }
    - id: say_the_bell_was_wrong
      label: บอกเตาว่ากระดิ่งสั่นผิดบ้าน
      refuse: true
      text: |
        เตาส่งคนอื่นไปแทน การเคาะครั้งแรกกับครั้งที่สองมาถึงบ้านหญิงทอผ้าในฤดูเดียว

        โดเรคเป็นคนถือเศษตะเกียงกลับมาที่เตา เขาวางเศษชิ้นใหญ่ที่สุดไว้บนลังที่{name}นั่งประจำ หงายก้นตะเกียงขึ้น
      effects: { flags: [denied_own_lamp] }

# ---------- ขึ้นยศ ----------
- id: adult.iron_rise_bell
  stage: adult
  scene: smithy
  weight: 60
  must: true
  time: night
  mark: ได้ถือกระดิ่ง
  when:
    age: [19, 80]
    org: { id: cold_iron, min_rank: 1, max_rank: 1, ready: true }
  text: |
    เกรดิสเรียกชื่อ{name}ตอนเตาใกล้มอด คนอื่นกลับบ้านไปเกือบหมดแล้ว นางเปิดหีบไม้ใต้ทั่ง หยิบกระดิ่งเหล็กใบเล็กออกมา ไม่ใหญ่กว่ากำปั้น สีเทาด้านแบบเดียวกับแท่งเหล็กที่ทุกคนกำตอนสาบาน ข้างในกลวง ไม่มีลูกตุ้ม ห่วงหนังสำหรับร้อยเข็มขัดเก่าจนเป็นสีดำ

    เอดรินนั่งอยู่บนลังข้างเตา กระดิ่งของนางห้อยอยู่ที่สะโพก นางบอกว่ากระดิ่งจะสั่นเองเมื่ออยู่ห่างของมีเวทไม่ถึงสิบก้าว คนถือจะรู้สึกที่สะโพกก่อนได้ยิน กระดิ่งไม่บอกว่าเป็นของใคร ไม่บอกว่าดีหรือร้าย คนถือต้องเดินหาเอง แล้วเลือกเองว่าประตูไหน

    ก่อนยื่นให้ เกรดิสบอกว่าห่วงหนังเส้นนั้นเป็นของคนถือคนก่อน นางไม่บอกต่อว่าคนก่อนไปไหน
  choices:
    - id: walk_with_the_bell
      label: ห้อยกระดิ่งที่สะโพก แล้วเดินตามทางหลวงไปจนถึงหมู่บ้านถัดไป
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ครึ่งทาง สะโพกข้างซ้ายรู้สึกเหมือนมีแมลงเดินอยู่ใต้ผ้า ก่อนหูจะได้ยินขอบกระดิ่งกระทบหัวเข็มขัดเบาๆ เกวียนพ่อค้าเร่คันหนึ่งกำลังแซงขึ้นไป {name}เดินตามเกวียนไปสิบก้าว กระดิ่งสั่นถี่ขึ้น ถอยออกมา กระดิ่งช้าลง ท้ายเกวียนแขวนตะเกียงทองเหลืองดวงหนึ่ง ติดไฟกลางวันแสกๆ ไม่มีควัน

          {name}ไม่ได้ทำอะไรกับเกวียนคันนั้น กลับมาเล่าให้เอดรินฟังตามที่เห็น นางถามข้อเดียว ว่ารู้สึกที่สะโพกก่อนได้ยินใช่ไหม แล้วบอกว่าดี
        effects: { org: { id: cold_iron, promote: true }, items: [iron_clapperless_bell], stats: { WIS: 1 }, flags: [first_shiver_of_the_bell] }
      failure:
        text: |
          {name}เดินจนถึงหมู่บ้านถัดไปแล้วเดินกลับ กระดิ่งไม่สั่นสักครั้งตลอดทาง ทุกครั้งที่เกวียนแซง {name}ยกมือขึ้นกุมสะโพก ทุกครั้งไม่มีอะไร ส้นเท้าพองทั้งสองข้าง

          เอดรินบอกว่าเดือนแรกนางก็กุมสะโพกแบบนี้ กุมจนติดเป็นนิสัย บางวันทุกวันนี้ก็ยังกุม
        effects: { org: { id: cold_iron, promote: true }, items: [iron_clapperless_bell], hp: -1, flags: [walked_with_a_quiet_bell] }
    - id: ask_edrin_first_door
      label: ถามเอดรินว่าครั้งแรกที่กระดิ่งของนางสั่น สั่นที่ประตูไหน
      text: |
        เอดรินตอบเร็วกว่าที่{name}คิด ประตูบ้านแม่นาง ห้องครัว โถเกลือใบหนึ่งที่ไม่เคยชื้นแม้หน้าฝน แม่ได้มาจากยาย นางยืนอยู่ในครัวนั้นจนกระดิ่งหยุดสั่นเอง เพราะแม่ถือโถเกลือเดินออกไปหลังบ้าน

        {name}ถามว่านางบากวงกบประตูบ้านแม่หรือเปล่า เอดรินลุกไปเติมถ่านในเตา เติมจนเตาไม่ต้องเติมอีกแล้วก็ยังเติม จนถึงเวลากลับบ้าน
      effects: { org: { id: cold_iron, promote: true }, items: [iron_clapperless_bell], stats: { CHA: 1 }, flags: [heard_edrins_first_door] }
    - id: keep_the_old_loop
      label: ขอเก็บห่วงหนังเส้นเก่าไว้ ไม่เปลี่ยนเป็นเส้นใหม่
      text: |
        เกรดิสว่าห่วงเส้นนั้นใกล้ขาด {name}บอกว่าจะเย็บซ่อมเอง นางยื่นเข็มเย็บหนังให้เล่มหนึ่ง ด้านในห่วงหนังมีรอยตัวอักษรกดลงไปสามตัว ตัวที่สี่มีคนเอามีดขูดจนเหลือแค่ขาตัวอักษร

        คืนนั้น{name}เย็บห่วงจนแน่นพอจะห้อยกระดิ่งได้อีกหลายปี เย็บข้ามรอยตัวอักษรที่เหลือ ไม่เย็บทับ
      effects: { org: { id: cold_iron, promote: true }, items: [iron_clapperless_bell], flags: [kept_the_old_bell_loop] }

- id: adult.iron_rise_hammer
  stage: adult
  scene: smithy
  weight: 60
  must: true
  time: night
  mark: ได้ถือค้อน
  when:
    age: [19, 80]
    org: { id: cold_iron, min_rank: 2, max_rank: 2, ready: true }
  text: |
    ค้อนของเตามีสองเล่ม เล่มหนึ่งอยู่ที่เข็มขัดของโดเรคมาตลอด อีกเล่มแขวนบนตะปูเหนือประตูโรงไม้ ไม่มีใครหยิบลงมา ด้ามไม้ดำเพราะมือคน หัวค้อนเหล็กสีเทาด้าน เล็กกว่าค้อนตีเกือกม้า หนักกว่าที่ขนาดบอก

    คืนนั้นโดเรคใช้ขอเหล็กปลดค้อนเล่มนั้นลงจากตะปู ยื่นด้ามให้{name} เขาบอกว่าคนถือคนก่อนชื่อฮัลวิน ทางการของอาณาจักรแขวนคอเขาที่ประตูเมืองข้อหาปล้นฆ่า ป้ายไม้ที่ห้อยคอเขียนไว้แค่นั้น ค้อนเล่มนี้กลับถึงเตาเพราะเพชฌฆาตขายให้พ่อค้าเศษเหล็ก พ่อค้าเศษเหล็กขายต่อให้เกรดิสสองเหรียญ

    แล้วเขาก็สอนสิ่งที่คนถือค้อนต้องรู้ก่อนอย่างอื่น คำร่ายทุกคำมีจุดจบ ค้อนต้องลงที่มือ ที่ปาก หรือที่ของในมือ ก่อนคำนั้นจะจบ ช้าไปครึ่งคำก็คือช้า
  choices:
    - id: practice_the_cut
      label: ให้โดเรคท่องคำยาวๆ แล้วตีเสาไม้ให้ทันก่อนเขาจบ
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          โดเรคท่องรายชื่อสินค้าในร้านตีเกือกม้าด้วยเสียงเรียบๆ ตะปู เกือก ห่วงบังเหียน ทุกรอบเขาหยุดคนละคำ ไม่บอกก่อน รอบที่เจ็ด ค้อนลงเสาไม้ก่อนคำว่าห่วงจะจบพอดี เสียงไม้แตกกลบพยางค์สุดท้าย

          โดเรคขอบคุณ บอกว่าคนร่ายจริงไม่ท่องช้าแบบเขา แล้วท่องต่อเร็วกว่าเดิมจนเกือบสาง เสาไม้ต้นนั้นมีรอยค้อนเรียงกันเป็นแถวเท่าความสูงของปากคน
        effects: { org: { id: cold_iron, promote: true }, items: [iron_halvins_hammer], stats: { DEX: 1 }, flags: [learned_the_cut] }
      failure:
        text: |
          ค้อนลงเสาไม้ช้าทุกรอบ ช้าครึ่งคำบ้าง ช้าหนึ่งคำบ้าง รอบที่สิบ หัวค้อนดีดจากเสาลงหน้าแข้งตัวเองจนเข่าทรุด โดเรคหยุดท่อง รอจน{name}ลุกเองได้

          เขาบอกว่าฮัลวินก็ช้าในเดือนแรก แล้วท่องต่อ หน้าแข้งของ{name}ช้ำเป็นสีเขียวอยู่สองสัปดาห์
        effects: { org: { id: cold_iron, promote: true }, items: [iron_halvins_hammer], hp: -1, flags: [learned_the_cut] }
    - id: ask_what_halvin_did
      label: ถามว่าฮัลวินทำอะไรจริงๆ
      text: |
        โดเรคเล่าเรื่องการเคาะครั้งที่สามครั้งสุดท้ายของฮัลวิน บ้านของชายคนหนึ่งที่ติดใบอนุญาตของสถาบันไว้บนผนังห้องรับแขก ตราครั่งครบ ลายมือชื่อครบ กระดิ่งไม่ได้อ่านใบอนุญาต ฮัลวินก็ไม่ได้อ่าน

        เขาบอกว่าบนลานประหาร ฮัลวินขอบคุณเพชฌฆาตที่ผูกเชือกให้แน่น โดเรคเล่าตรงนี้เบากว่าทุกประโยคก่อนหน้า แล้วยื่นมือขวามาจับมือ{name}ที่ถือค้อนอยู่ จับแน่นครั้งเดียวแล้วปล่อย
      effects: { org: { id: cold_iron, promote: true }, items: [iron_halvins_hammer], alignment: { law: -1 }, flags: [heard_halvins_last_knock] }
    - id: hang_it_back_up
      label: แขวนค้อนกลับบนตะปูเหนือประตู ไม่เอาติดตัวกลับบ้าน
      text: |
        โดเรคบอกว่าฮัลวินเอาค้อนติดตัวกลับบ้านทุกคืน คนของทางการเจอค้อนใต้หมอนเขา ป้ายที่ห้อยคอเขาเขียนตามของที่เจอ

        ตั้งแต่คืนนั้น ค้อนแขวนอยู่บนตะปูเหนือประตูโรงไม้ทุกคืนที่ไม่มีงาน คืนที่มีงาน{name}ปลดลงมาเอง แล้วแขวนคืนก่อนสาง
      effects: { org: { id: cold_iron, promote: true }, flags: [hammer_stays_on_the_nail] }
    - id: rewedge_the_head
      label: ชั่งค้อนในมือแบบช่างตีเหล็ก แล้วตอกลิ่มที่หัวค้อนใหม่
      requires: { flag: job_smith }
      text: |
        หัวค้อนโยกในด้ามเล็กน้อย ลิ่มไม้เก่าหดตัวไปแล้ว คนที่ไม่ได้ตีเหล็กทุกวันไม่รู้สึก {name}ถอดหัวออก เหลาลิ่มใหม่จากเศษไม้โอ๊กข้างเตา ตอกลงจนหัวค้อนแน่นเหมือนหล่อติดด้าม

        โดเรคชั่งค้อนในมือข้างเดียวที่มี บอกว่าสมัยฮัลวินก็โยกแบบนี้ ไม่มีใครในเตาซ่อมเป็น ฮัลวินเองก็ไม่ซ่อม
      effects: { org: { id: cold_iron, promote: true }, items: [iron_halvins_hammer], stats: { STR: 1 }, flags: [rewedged_halvins_hammer] }

- id: adult.iron_rise_elder
  stage: adult
  scene: smithy
  weight: 60
  must: true
  time: night
  mark: ขึ้นเป็นผู้เฒ่าเตา
  when:
    age: [19, 80]
    org: { id: cold_iron, min_rank: 3, max_rank: 3, ready: true }
  text: |
    ปลายฝนนั้นเกรดิสเลิกตีเกือกม้า มือขวาสั่นจนตอกตะปูไม่ลงหัว ร้านหน้ายังเปิด ลูกมือตีแทน นางยังมานั่งบนลังข้างเตาหลังร้านทุกคืน คืนหนึ่งนางปลดห่วงเหล็กที่ห้อยเอวมาตลอดออกมาวางบนทั่ง ห่วงวงเดียว ร้อยแผ่นเหล็กบางขนาดฝ่ามือไว้เป็นตั้งหนาเท่าข้อมือ

    แผ่นเหล็กทุกแผ่นมีชื่อ ตอกด้วยตัวตอกเหล็กนำศูนย์ทีละตัวอักษร ชื่อที่จบแล้วมีรอยค้อนลงทับหนึ่งรอย ไม่มีชื่อไหนลบ แผ่นท้ายๆ ยังว่างครึ่งแผ่น นางบอกว่านี่คือสมุดชื่อของเตา เตาหนึ่งมีผู้เฒ่าคนเดียว คนนั้นถือห่วงนี้ รับเกวียนเหล็กจากเฮสทัน และรับห่อผ้าที่เขายื่นเข้ามาในโรงไม้ทุกหน ตั้งแต่หนหน้าไป เฮสทันจะยื่นให้{name}

    นางไม่ได้ถามว่า{name}จะรับหรือเปล่า
  choices:
    - id: read_every_plate
      label: นั่งอ่านทุกแผ่นจนเตามอด
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ชื่อทั้งหมดร้อยสามสิบเอ็ดชื่อ รอยค้อนทับไปแล้วร้อยสิบสอง {name}อ่านจนจำได้ว่าแผ่นไหนอยู่ตรงไหน แล้วเห็นสิ่งที่ไม่ได้ตั้งใจหา ชื่อบางชื่อตอกลึกกว่าชื่ออื่น ตัวอักษรตรงกว่า ห่างเท่ากันทุกตัว เหมือนลอกมาจากกระดาษที่เขียนไว้ก่อน ไม่ได้จำมาจากปากใคร

          เกรดิสนั่งดูจนเตามอด แล้วบอกว่าคนอ่านทุกแผ่นในคืนแรกมีสองคน นางกับ{name}
        effects: { org: { id: cold_iron, promote: true }, stats: { INT: 1 }, flags: [read_every_plate] }
      failure:
        text: |
          ขอบแผ่นเหล็กบางคมกว่าที่ตาเห็น แผ่นที่สามสิบกว่าบาดปลายนิ้ว{name}เป็นแผลยาว เลือดหยดลงบนชื่อหนึ่งที่ยังไม่มีรอยค้อน {name}เช็ดออกด้วยชายเสื้อ อ่านต่อจนตาพร่า แล้วจำได้แค่ว่าแผ่นท้ายสุดยังว่างอยู่ครึ่งแผ่น

          เกรดิสส่งผ้าพันแผลมาให้ บอกว่าทุกคนโดนบาดในคืนแรก นางก็โดน
        effects: { org: { id: cold_iron, promote: true }, hp: -1, flags: [read_every_plate] }
    - id: ask_for_the_first_plate
      label: ขอดูแผ่นแรกสุด
      text: |
        แผ่นแรกบางกว่าแผ่นอื่น ขอบมนเพราะมือ มีชื่อเดียว รอยค้อนทับลึกจนตัวอักษรตรงกลางจมหายลงไปในเนื้อเหล็ก เกรดิสบอกว่าเป็นชื่อคนที่เคยเช่าที่ดินข้างโรงไม้ แล้วหันไปทางผนังด้านที่ติดที่ดินว่าง หญ้าขึ้นสูงถึงเอว เสาไม้ดำสองต้นยังยืนอยู่กลางพง

        นางไม่เล่าต่อ {name}ก็ไม่ถาม แผ่นแรกร้อยกลับเข้าห่วงเป็นแผ่นแรกเหมือนเดิม
      effects: { org: { id: cold_iron, promote: true }, alignment: { moral: 1 }, flags: [saw_the_first_plate] }
    - id: ask_her_to_stay
      label: ขอให้นางนั่งข้างเตาต่อทุกคืน
      text: |
        เกรดิสว่าเตามีผู้เฒ่าคนเดียว แต่ลังข้างเตามีหลายใบ นางนั่งต่อ ลังใบเดิม ทุกคืน ไม่ออกความเห็นเรื่องไหนถ้าไม่มีใครถาม

        ทุกครั้งที่{name}ถาม นางตอบสั้นกว่าเดิม คืนที่นางไม่มา ลังใบนั้นว่างอยู่ทั้งคืน ไม่มีใครในเตานั่งแทน
      effects: { org: { id: cold_iron, promote: true }, reputation: { cold_iron: 1 }, flags: [kept_gredis_by_the_forge] }
    - id: find_own_plate
      label: หาแผ่นที่มีชื่อของตัวเอง
      requires: { flag: struck_own_name_on_the_plates }
      text: |
        ชื่อของ{name}อยู่บนแผ่นที่เก้าสิบกว่า ระหว่างชื่อเสมียนสัญญาคนหนึ่งกับชื่อคนเลี้ยงห่าน รอยค้อนลงทับเรียบร้อยเหมือนชื่ออื่น ไม่ลึกกว่า ไม่ตื้นกว่า

        เกรดิสบอกว่าในห่วงนี้มีชื่อคนของเตาเองสี่ชื่อ ผู้เฒ่าทุกคนต้องรู้ว่าสี่ชื่อนั้นอยู่แผ่นไหน แล้วชี้ให้ดูอีกสามแผ่นทีละแผ่น
      effects: { org: { id: cold_iron, promote: true }, stats: { WIS: 1 }, flags: [found_own_name_plate] }

- id: adult.iron_passed_over
  stage: adult
  scene: smithy
  weight: 30
  time: night
  when:
    age: [25, 64]
    org: { id: cold_iron, max_rank: 3, min_refused: 3 }
  text: |
    เกรดิสเรียกคนที่มาถึงเตาหลัง{name}ไปยืนข้างทั่ง ยื่นของชิ้นหนึ่งให้ คนในโรงไม้ไม่มีใครแปลกใจ ปีก่อนก็มีคนที่มาทีหลัง{name}ไปยืนตรงนั้น

    เกรดิสไม่รอให้ใครถาม นางชี้ขึ้นไปที่คานไม้เหนือลังที่{name}นั่งประจำ คานไม้มีรอยบากเล็กๆ เรียงกันเป็นแถว สูงระดับเดียวกันทุกรอย รอยหนึ่งต่องานหนึ่งที่{name}ไม่ได้ไป บางรอยเก่าจนเป็นสีเดียวกับเนื้อไม้ รอยล่าสุดยังขาว

    รอยแบบเดียวกับที่เตาบากบนวงกบประตูบ้านคนอื่น
  choices:
    - id: ask_for_three_names
      label: ขอให้เตาส่งชื่อสามชื่อถัดไปมาให้{name}คนเดียว
      text: |
        เกรดิสส่งให้ทั้งสามชื่อ สามคืนติดกัน ชื่อแรกเป็นช่างซ่อมเกวียนที่หล่อลื่นเพลาด้วยของที่ไม่ใช่น้ำมัน ชื่อที่สองเป็นแม่ค้าขนมที่เตาอบไม่เคยต้องเติมฟืน ชื่อที่สามไม่อยู่บ้านทั้งสามคืนที่{name}ไป

        คานไม้เหนือลังของ{name}ไม่มีรอยใหม่ตลอดฤดูนั้น รอยเก่ายังอยู่ครบทุกรอย
      effects: { reputation: { cold_iron: 1 }, flags: [took_three_names_alone] }
    - id: argue_each_notch
      label: ชี้ทีละรอย บอกว่าแต่ละครั้งมีเหตุผล
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เกรดิสฟังจนครบทุกรอย ไม่ขัด พอจบนางเอามีดพับมาให้ ให้{name}สลักตัวอักษรตัวเดียวไว้ข้างรอยที่จำเหตุผลได้ ตัวแรกของคำที่เป็นเหตุผล ไข้ ลูก หิมะ

          รอยบากบนคานยังเท่าเดิม แต่คานเหนือลังของ{name}กลายเป็นคานเดียวในโรงไม้ที่มีตัวหนังสือ
        effects: { stats: { CHA: 1 }, flags: [lettered_the_notches] }
      failure:
        text: |
          เกรดิสฟังถึงรอยที่ห้า แล้วยกมือขึ้นแตะคาน บอกว่าทุกรอยบนวงกบประตูบ้านคนอื่นก็มีเหตุผล คนในบ้านพวกนั้นเล่าให้เตาฟังได้ยาวกว่า{name}ทุกคน

          คืนนั้น{name}นั่งที่ลังเดิมจนเตามอด ถ่านไม้ที่เผาไปทั้งคืนเกรดิสหักจากค่าเดินถามรอบหน้า {name}แหงนดูคานครั้งเดียวตอนลุก
        effects: { alignment: { law: -1 }, gold: -1, flags: [argued_the_notches] }
    - id: sit_back_down
      label: นั่งลงที่ลังเดิมใต้คานนั้น
      text: |
        {name}นั่งลง เติมถ่านไม้ในเตาตามที่ทุกคืนเคยเติม คนที่เพิ่งได้ของจากเกรดิสเดินผ่านไปนั่งลังอีกใบ ไม่หันมา

        เกรดิสเก็บมีดพับเข้ากระเป๋าผ้ากันเปื้อน รอยล่าสุดบนคานยังขาวอยู่หลายวันกว่าจะเริ่มเป็นสีเทา
      effects: { flags: [sat_under_the_notched_beam] }
    - id: name_the_childs_door
      label: บอกนางว่ารอยหนึ่งในนั้นคือประตูบ้านเด็ก
      requires: { flag: refused_the_childs_door }
      text: |
        เกรดิสหาเจอโดยไม่ต้องให้ชี้ รอยที่สี่จากซ้าย นางวางนิ้วโป้งทับรอยนั้นไว้ นานพอที่ถ่านในเตาจะเปลี่ยนสี แล้วยกนิ้วออก

        นางบอกว่ารอยนั้นนับเหมือนรอยอื่น แต่นางจำได้ว่ารอยนั้นคือรอยไหน ผู้เฒ่าเตาไม่มีสิทธิ์ลืม
      effects: { alignment: { moral: 1 }, flags: [gredis_remembered_the_childs_door] }

# ---------- ความลับ ----------
- id: adult.iron_secret_one_foundry
  stage: adult
  scene: road
  weight: 25
  time: dusk
  when:
    age: [27, 64]
    org: { id: cold_iron, min_rank: 2, max_rank: 3 }
  text: |
    เพลาเกวียนเหล็กหักห่างจากเตาไปครึ่งวัน เกวียนเพิ่งออกจากเตาได้เช้าเดียว เตาส่ง{name}ไปช่วย ไปถึงตอนบ่าย เฮสทันนั่งอยู่บนหลักหินข้างทาง ถุงมือสีเทาข้างหนึ่งขาดที่ปลายนิ้วชี้ คนขับไปตามช่างล้อที่หมู่บ้านข้างหน้า

    รอช่างล้อจนพลบ ระหว่างนั้นเฮสทันเปิดหีบเหล็กใบเล็กใต้ที่นั่งคนขับ หยิบเหรียญออกมาเตรียมจ่ายค่าซ่อม ในหีบมีห่อผ้าผูกเชือกอีกสามห่อ ห่อแบบเดียวกับที่เขายื่นเข้าโรงไม้ทุกหน เหรียญที่เขาหยิบออกมาเป็นเหรียญใหม่เอี่ยม ขอบยังคมจนบาดนิ้วได้

    ผ้าใบคลุมเกวียนด้านในมีตราประทับสีแดงซีดซ้ำกันเป็นแถว ตราของโรงหลอม ไม่ใช่ตราของเตา ข้างตราเขียนชื่อย่านกำกับไว้ ย่านเตาหลอม คาร์ดิน
  choices:
    - id: ask_hestan_straight
      label: ถามเฮสทันตรงๆ ว่าเหล็กทุกแท่งมาจากที่เดียวหรือ
      text: |
        เฮสทันตอบเป็นตัวเลข โรงหลอมหนึ่งโรง เตาหลอมถ่านไม้หนึ่งเตา เตาเดียวในย่านที่ไม่เผาถ่านมาร เกวียนสี่คัน เกวียนคันนี้ส่งของให้เตาสี่เตา เขาไม่บอกว่าอีกสามเตาอยู่ที่ไหน

        เขาขอบคุณที่ถามเป็นคำถามที่ตอบเป็นตัวเลขได้ ช่างล้อมาถึงตอนตะเกียงจุด เฮสทันจ่ายด้วยเหรียญใหม่ ช่างล้อกัดเหรียญดูก่อนรับ
      effects: { stats: { INT: 1 }, flags: [learned_of_the_one_foundry] }
    - id: tell_gredis_what_you_saw
      label: กลับไปเล่าให้เกรดิสฟังทุกอย่างที่เห็น
      text: |
        เกรดิสฟังจนจบโดยไม่แปลกใจ นางบอกว่าเหล็กที่ตีจากถ่านไม้ล้วนในอาณาจักรนี้มีที่มาที่เดียว ถ้ามีสองที่ เตาก็ต้องเลือก ไม่มีใครในเตาอยากเลือก

        แล้วนางให้{name}ขึ้นเกวียนไปกับเฮสทันหนหน้า ไปนับมัดตั้งแต่ต้นทาง นางบอกว่าคนที่รู้แล้วควรเป็นคนนับ
      effects: { org: { id: cold_iron, merit: 1 }, alignment: { law: 1 }, flags: [learned_of_the_one_foundry] }
    - id: open_a_bundle
      label: แกะห่อผ้าห่อหนึ่งตอนเฮสทันเดินไปดูทาง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ปมเชือกเป็นปมของคนบัญชี แกะง่าย ผูกคืนง่าย ในห่อมีถุงหนังใส่เหรียญใหม่สามสิบเหรียญ กับที่ว่างข้างถุงขนาดเท่ากระดาษพับ ว่าง ยังไม่มีอะไรใส่ {name}ผูกคืนก่อนเฮสทันเดินกลับมาถึงล้อหลัง

          ค่าเหล็กหนึ่งเกวียนไม่ได้แพงถึงสามสิบเหรียญ ไม่มีโรงหลอมไหนจ่ายเงินคืนให้คนซื้อเหล็ก
        effects: { stats: { DEX: 1 }, flags: [learned_of_the_one_foundry, felt_the_new_coins] }
      failure:
        text: |
          ปมแรกยังไม่ทันหลุด เฮสทันก็ยืนอยู่ข้างหลังแล้ว เขาไม่ว่าอะไร เอื้อมมือมาผูกปมคืนด้วยมือที่ยังสวมถุงมือขาด แน่นกว่าเดิม แล้วปิดหีบ

          ตอนช่างล้อมาถึง เฮสทันบอกให้{name}จ่ายค่าซ่อม บอกว่าเตาจะได้คืนในห่อหนหน้า สองเหรียญ ห่อหนหน้าไม่มีอะไรคืนมา
        effects: { gold: -2, flags: [learned_of_the_one_foundry] }

- id: adult.iron_secret_grey_paper
  stage: adult
  scene: smithy
  weight: 25
  time: night
  when:
    age: [28, 64]
    org: { id: cold_iron, min_rank: 3, max_rank: 3 }
  text: |
    เกรดิสไข้ขึ้นคืนเดียวกับที่เกวียนเหล็กมาถึง นางนอนอยู่ในห้องหลังร้าน ส่งคนมาบอกว่าห่อผ้าของเฮสทันให้{name}รับไว้แทน ห้ามแกะ เอาไปวางไว้ข้างหมอนนาง

    เชือกที่ผูกห่อหนนี้หลวมกว่าทุกหน ระหว่างทางจากโรงไม้ไปห้องหลังร้าน ห่อคลายออกเอง ข้างในมีสองอย่าง ถุงหนังใส่เหรียญถุงหนึ่ง กับกระดาษสีเทาแผ่นหนึ่งพับสี่ กระดาษเนื้อหนาแบบกระดาษสัญญา

    กระดาษแผ่นนั้นมีเจ็ดชื่อ ลายมือคนบัญชี ตรงทุกตัว ห่างเท่ากันทุกตัว ข้างชื่อเขียนถนนกับงานไว้ เสมียนสัญญา คนแลกเงิน หมอ ช่างซ่อมโคม ไม่มีชื่อไหนเคยมีใครในเตาเดินถามถึง
  choices:
    - id: deliver_and_ask
      label: พับกลับตามรอยเดิม เอาไปวางข้างหมอน แล้วถามนาง
      text: |
        เกรดิสลืมตาแค่ครึ่งเดียว นางบอกว่าชื่อครึ่งหนึ่งมาจากปากคนในถนน อีกครึ่งมาแบบพับสี่ เตาไม่ถามว่าเหล็กดีมาจากไหน ไม่ถามว่าชื่อมาจากไหน เตาถามแค่ข้อเดียว ว่ากระดิ่งสั่นที่หน้าประตูนั้นหรือเปล่า ถ้าไม่สั่น ชื่อนั้นไม่ได้ขึ้นแผ่นเหล็ก

        แล้วนางก็หลับไป ห่อผ้ายังอยู่ในมือ เช้ามาไข้ลด ชื่อทั้งเจ็ดขึ้นแผ่นเหล็กภายในฤดูเดียว กระดิ่งสั่นทุกประตู
      effects: { org: { id: cold_iron, merit: 1 }, alignment: { law: 1 }, flags: [saw_the_grey_paper] }
    - id: memorise_the_seven
      label: จำชื่อทั้งเจ็ดไว้ก่อนพับคืน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}อ่านสองรอบ ชื่อ ถนน งาน ทีละบรรทัด แล้วพับคืนตามรอยพับเดิมทั้งสี่รอย ผูกเชือกหลวมเท่าเดิม เกรดิสรับห่อไว้ข้างหมอนโดยไม่ลืมตา

          ทั้งฤดูนั้น{name}นับชื่อทั้งเจ็ดตามที่ขึ้นแผ่นเหล็ก ขึ้นครบทุกชื่อ ชื่อเสมียนสัญญาได้รอยค้อนเป็นชื่อแรก เร็วกว่าชื่อที่มาจากรอบเดินถามทุกชื่อ
        effects: { stats: { INT: 1 }, flags: [saw_the_grey_paper, memorised_the_grey_names] }
      failure:
        text: |
          ชื่อทั้งเจ็ดปนกันในหัวตั้งแต่บรรทัดที่สี่ {name}พับคืนผิดรอยหนึ่งรอย เกรดิสรับห่อไว้ข้างหมอน นิ้วไล่ไปตามรอยพับ หยุดที่รอยที่ผิด คืนนั้น{name}นั่งท่องชื่อที่จำได้ครึ่งๆ กลางๆ ในโรงไม้จนรุ่งสาง ลมหนาวเข้าทางร่องฝา อีกสองวันไข้ของเกรดิสก็ข้ามมาถึง{name}

          เช้ามานางไข้ลด รอยพับนั้นนางไม่เอ่ยถึง หนต่อมาที่เกวียนมา ไข้นางยังขึ้นอยู่ นางก็ลุกจากที่นอนไปรับห่อเอง
        effects: { reputation: { cold_iron: -1 }, hp: -1, flags: [saw_the_grey_paper] }
    - id: check_the_asking_sheets
      label: เปิดหีบกระดาษรอบเดินถาม เทียบชื่อทีละชื่อ
      text: |
        หีบไม้ใต้ทั่งมีกระดาษรอบเดินถามเก็บไว้ทุกแผ่นตั้งแต่สมัยไหนไม่มีใครรู้ {name}ไล่หาเจ็ดชื่อนั้นจนถึงก้นหีบ ไม่เจอสักชื่อ ไม่มีใครในถนนไหนเคยให้ชื่อเหล่านี้กับคนของเตา

        {name}เทียบกลับอีกทาง ชื่อบนแผ่นเหล็กที่ตอกลึก ตัวตรง ห่างเท่ากัน ไม่มีสักชื่อในกระดาษรอบเดินถามเหมือนกัน
      effects: { stats: { WIS: 1 }, flags: [saw_the_grey_paper, matched_plates_to_asking_sheets] }

- id: adult.iron_secret_belek_payer
  stage: adult
  weight: 25
  when:
    age: [28, 64]
    org: { id: cold_iron, min_rank: 3, max_rank: 3 }
  text: |
    เหล็กหนนี้ร้าวสามมัด ร้าวตามยาวทั้งแท่ง ตีเย็นแล้วแตก เกรดิสให้{name}ขึ้นเกวียนไปกับเฮสทัน เอามัดร้าวไปคืนถึงโรงหลอม เป็นหนแรกที่เตาส่งคนไปถึงปลายทางของเกวียน

    โรงหลอมอยู่ในย่านเตาหลอมของคาร์ดิน หลังคาต่ำ ปล่องเดียว ควันขาวของถ่านไม้ลอยแยกจากควันสีน้ำตาลของปล่องอื่นทั้งย่าน นายโรงหลอมรับมัดร้าวไปโดยไม่ต่อว่าและไม่ขอโทษ บอกว่าเหล็กแทนจะออกกับเกวียนหน้า เรื่องเงินให้ไปคุยกับคนจ่าย แล้วชี้ไปทางถนนสมุดบัญชี

    เฮสทันเดินนำไปเอง ไม่อ้อม ไม่ปิดบัง เขาเข้าประตูข้างของอาคารหินหลังหนึ่งที่มีป้ายธนาคารเบเลคแขวนอยู่เหนือประตูใหญ่ ถอดเสื้อคลุม นั่งลงที่โต๊ะตัวหนึ่งในแถวโต๊ะยี่สิบตัว เสมียนทุกโต๊ะใส่ถุงมือสีเทา เขาเปิดสมุดเล่มหนึ่ง หันมาให้{name}ดูบรรทัดที่ต้องการ ค่าเหล็กของเตาสี่เตา ร้าวสามมัด หักออกจากงวดหน้า
  choices:
    - id: ask_why_the_bank_pays
      label: ถามเฮสทันว่าทำไมธนาคารจ่ายค่าเหล็กให้เตา
      text: |
        เฮสทันไม่ตอบเป็นคำ เขาพลิกสมุดไปหน้าท้ายเล่ม ตัวเลขสองแถว แถวซ้ายเป็นเงินที่จ่ายให้เตาสี่เตาตลอดปี แถวขวาเป็นเงินที่ธนาคารไม่ต้องเสียในปีเดียวกัน แถวขวายาวกว่าเจ็ดเท่า

        เขาปิดสมุด ขอบคุณ{name}ที่มาด้วยตัวเอง แล้วกลับไปเขียนบรรทัดต่อจากที่ค้างไว้ก่อนเดินทาง
      effects: { stats: { INT: 1 }, flags: [learned_the_bank_pays_the_forge] }
    - id: walk_home_alone
      label: เดินออกจากธนาคาร กลับเตาด้วยเท้าตัวเอง ไม่ขึ้นเกวียน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          หกวันบนทางหลวง {name}นอนข้างทางสองคืน นอนโรงเตี๊ยมสามคืน คืนที่หกเดินถึงร้านตีเกือกม้าตอนเตาหลังร้านยังไม่มอด ทั้งหกวันไม่ได้คิดเรื่องอื่น

          เกรดิสดูหน้า{name}ครั้งเดียวก็รู้ว่าไปถึงไหนมา นางเลื่อนลังใบหนึ่งมาไว้ข้างเตา ให้นั่งผิงไฟ ไม่ถามอะไรสักข้อ
        effects: { stats: { CON: 1 }, flags: [learned_the_bank_pays_the_forge] }
      failure:
        text: |
          วันที่สามรองเท้าขาด วันที่สี่เท้าพองจนต้องพันผ้า {name}ขึ้นเกวียนชาวนาขากลับได้ช่วงหนึ่งด้วยเงินที่เหลือในย่าม ถึงเตาช้ากว่าเกวียนเหล็กสองวัน

          เกวียนเหล็กมาถึงก่อนแล้ว มัดเหล็กใหม่สามมัดวางเรียงอยู่ข้างผนัง หนนั้นไม่ใช่หนของเฮสทัน เขามาส่งเอง
        effects: { hp: -2, gold: -1, flags: [learned_the_bank_pays_the_forge] }
    - id: tell_gredis_and_dorek
      label: กลับไปเล่าให้เกรดิสฟังต่อหน้าโดเรค
      text: |
        เกรดิสฟังโดยไม่ขัด แล้วบอกว่าเหล็กดีมีที่เดียว เงินก็มีที่เดียว นางพูดเหมือนพูดเรื่องราคาถ่าน โดเรคฟังจนจบ ขอบคุณ{name}ที่เล่า แล้วลุกออกไปข้างนอก

        คืนนั้นทั้งคืนมีเสียงค้อนลงบนเหล็กเย็นดังมาจากลานหลังโรงไม้ จังหวะเดียว ไม่หยุด จนฟ้าสาง โดเรคเข้ามาตอนเช้า ขอเหล็กของเขามีรอยบิ่นใหม่สองรอย
      effects: { org: { id: cold_iron, merit: 1 }, alignment: { law: 1 }, flags: [learned_the_bank_pays_the_forge, told_dorek_of_the_bank] }
    - id: read_the_column_with_hestan
      label: ช่วยเฮสทันไล่ตัวเลขในสมุดทีละบรรทัด
      requires: { flag: counted_with_hestan }
      text: |
        เฮสทันจำได้ว่า{name}นับมัดเหล็กตรง เขาเลื่อนสมุดมาให้อ่านเอง ทุกบรรทัดของเตานี้มีสามช่อง ค่าเหล็ก ค่าแรง แล้วช่องสุดท้ายที่เป็นจำนวนชื่อ ชื่อที่จบแล้ว คูณด้วยตัวเลขตัวเดียวกันทุกบรรทัด

        {name}ไล่นิ้วไปตามช่องสุดท้ายจนถึงบรรทัดล่าสุด ตัวเลขในช่องนั้นตรงกับจำนวนรอยค้อนที่ลงในฤดูก่อน
      effects: { stats: { WIS: 1 }, flags: [learned_the_bank_pays_the_forge, read_the_price_per_name] }

- id: adult.iron_secret_half_the_names
  stage: adult
  scene: smithy
  weight: 30
  time: night
  when:
    age: [30, 64]
    org: { id: cold_iron, min_rank: 4 }
  text: |
    {name}เอากระดาษสีเทาทุกแผ่นในหีบใต้ทั่งออกมาเรียงบนพื้นโรงไม้ ทุกแผ่นพับสี่ ทุกแผ่นมาพร้อมถุงเหรียญใหม่ในห่อผ้าของเฮสทัน ตั้งแต่สมัยเกรดิสถือห่วง แล้วเทียบกับแผ่นเหล็กในห่วงทีละชื่อ จนเตามอด

    ครึ่งหนึ่งเป็นคนที่ใช้เวทเกินตัวจริง ทำของที่ทำแล้วมีคนตาย กลั่นของที่กลั่นแล้วซอยไหม้ อีกครึ่งกระดิ่งก็สั่นเหมือนกัน แต่ของที่กระดิ่งได้ยินเป็นอีกแบบ เสมียนสัญญาที่ลบลายมือชื่อออกจากกระดาษได้ด้วยปลายนิ้ว คนแลกเงินที่ทำเหรียญหนึ่งเหรียญให้เป็นสองได้ หมอเถื่อนที่แก้อาการหนาวเข้ากระดูกให้คนผิดสัญญากับเบเลค คนพวกนี้ไม่ได้ทำให้ใครตาย ทำให้ธนาคารเสียเงิน

    ห่อผ้าหนล่าสุดยังไม่ได้แกะ กระดาษแผ่นใหม่มีเจ็ดชื่อ ชื่อที่สี่คือไพเลน หมอที่อยู่ห่างเตาไปครึ่งวัน รักษาคนหนาวเข้ากระดูกคนละเหรียญ คนทั้งอำเภอรู้จัก เกรดิสนั่งอยู่บนลังข้างเตา เห็นกระดาษเรียงเต็มพื้น นางบอกว่าถ้าเตาไม่มีเหล็ก ครึ่งแรกก็ไม่มีใครไปเคาะ นางคิดแบบนี้มาตลอด คิดจนนอนหลับได้
  choices:
    - id: stamp_all_seven
      label: ตอกชื่อทั้งเจ็ดลงแผ่นเหล็ก เหมือนผู้เฒ่าทุกคนก่อนหน้า
      text: |
        {name}ตอกทีละตัวอักษรด้วยเหล็กนำศูนย์ ชื่อไพเลนอยู่บรรทัดที่สี่ของแผ่น ตัวตรง ห่างเท่ากัน เหมือนลอกจากกระดาษ เพราะลอกจากกระดาษ กระดาษสีเทาทุกแผ่นกลับลงหีบตามเดิม

        เกวียนหนต่อมามาตรงเวลา มัดเหล็กครบ ถุงเหรียญหนักเท่าเดิม ปลายหนาวนั้นมีคนสาบานที่เตาเพิ่มสามคน ทุกคนกำแท่งเหล็กแท่งใหม่จนมือชา
      effects: { org: { id: cold_iron, merit: 1 }, alignment: { moral: -1, law: 1 }, flags: [stamped_the_banks_names] }
    - id: stamp_only_street_names
      label: ตอกเฉพาะชื่อที่กระดิ่งได้ยินของที่ทำให้คนตาย ที่เหลือพับคืนให้เฮสทัน
      text: |
        กระดาษสีเทาแผ่นใหม่เหลือสามชื่อบนแผ่นเหล็ก อีกสี่ชื่อรวมทั้งไพเลน {name}ขีดเส้นตรงทับด้วยถ่าน พับคืนตามรอยเดิม ยื่นให้เฮสทันตอนเกวียนหนหน้ามาถึง เฮสทันรับไว้ อ่าน แล้วเก็บเข้าอกเสื้อ

        เกวียนหนถัดมามีมัดเหล็กน้อยกว่าเดิมสามมัด ถุงเหรียญเบากว่าเดิมเกือบครึ่ง เฮสทันนับมัดที่ลงจากเกวียนสองรอบ ตัวเลขตรงกับที่ขีดไว้ในสมุดของเขา
      effects: { alignment: { moral: 1, law: -1 }, flags: [sent_back_the_banks_names] }
    - id: warn_pailen
      label: ไปหาหมอไพเลนเองก่อนตอกชื่อ บอกให้ย้ายไป
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ไพเลนเป็นชายตัวเล็กที่ห้องตรวจมีแต่เตียงเดียวกับหม้อต้มน้ำ เขาฟังจนจบ ไม่ถามว่า{name}เป็นใคร ถามแค่ว่ามีเวลากี่วัน สามวันต่อมาห้องนั้นว่าง คนไข้ที่มาเคาะประตูได้แต่กระดาษแผ่นเล็กที่เขียนชื่อหมู่บ้านไกลออกไปทางเหนือ

          ชื่อของเขาขึ้นแผ่นเหล็กตามกระดาษสีเทา แล้วได้รอยค้อนทับในคืนเดียวกัน ด้วยมือของ{name} เตานับว่าจบ ธนาคารนับว่าจบ
        effects: { stats: { CHA: 1 }, flags: [warned_pailen_away] }
      failure:
        text: |
          {name}จ่ายค่าตรวจสองเหรียญเพื่อได้นั่งตรงหน้าเขา ไพเลนฟังแล้วหัวเราะ บอกว่าคนแบบ{name}มาเตือนเขามาสองคนแล้ว เขายังอยู่ เพราะคนไข้ของเขาไม่มีที่อื่นให้ไป แล้วก็ขอให้{name}ออกไปก่อนคนไข้คนถัดไปจะเห็น

          สัปดาห์ต่อมา วงกบประตูห้องตรวจของไพเลนมีรอยบาก ไม่ใช่รอยของเตานี้ ลึกกว่า เอียงกว่า เตาอื่นก็ได้กระดาษแผ่นเดียวกัน
        effects: { reputation: { belek_bank: -1 }, gold: -2, flags: [warned_pailen_too_late] }

# ---------- ถูกตามล่า ข้อเสนอ และการออก ----------
- id: adult.iron_hunt_bounty_paper
  stage: adult
  scene: tavern
  weight: 15
  time: dusk
  hunt: royal_institute
  when:
    age: [25, 64]
    org: cold_iron
    not_orgs: [reclaimers]
  text: |
    ชายคนหนึ่งเดินเข้าโรงเตี๊ยม ไล่ดูหน้าคนทีละโต๊ะ มือซ้ายถือกระดาษม้วนหนึ่ง มือขวาหมุนเหรียญทองแดงไปมาบนหลังนิ้ว เหรียญมีตราของสถาบันเวทหลวงอยู่ด้านหนึ่ง เป็นเหรียญที่สถาบันให้คนรับจ้างตามหาคนไว้แสดงตัว

    เขามานั่งโต๊ะเดียวกับ{name}โดยไม่ขอ คลี่กระดาษออก ใบค่าหัว รูปวาดหน้าคนสามหน้า หน้าที่สองจมูกโด่งเกินไป คางเหลี่ยมเกินไป แต่ตากับคิ้วเป็นของ{name} ใต้รูปเขียนว่าคนของเตาเหล็กเย็น ยังไม่มีชื่อ

    เขาบอกว่าสถาบันจ่ายห้าเหรียญสำหรับชื่อ ยี่สิบเหรียญสำหรับตัว ตอนพูดเขาไม่ได้มองหน้า{name} เขาดูรูปที่สอง แล้วดูมือของ{name}บนโต๊ะ
  choices:
    - id: slip_out_the_kitchen
      label: ลุกไปทางครัว ออกประตูหลัง ไม่กลับที่พักคืนนั้น
      text: |
        คนครัวเห็น{name}เดินผ่านเตาไฟไปออกประตูหลังโดยไม่ทัก คืนนั้น{name}นอนบนกองกระสอบข้างเตาหลังร้านตีเกือกม้า ห่มเสื้อคลุมตัวเดียว

        เช้ามาเจ้าของห้องเช่าบอกว่ามีผู้ชายมาถามหา หมุนเหรียญอยู่หน้าประตูจนดึก {name}ย้ายที่พักภายในสัปดาห์ ค่าเช่าที่จ่ายล่วงหน้าไว้ไม่ได้คืน
      effects: { gold: -1, flags: [slipped_the_bounty_man] }
    - id: buy_the_second_face
      label: วางสี่เหรียญทับรูปหน้าที่สอง
      requires: { min_gold: 4 }
      text: |
        เขาหยุดหมุนเหรียญ นับเหรียญของ{name}ด้วยปลายนิ้ว แล้วฉีกใบค่าหัวตามแนวรอยพับ รูปหน้าที่สองหลุดออกมาเป็นแผ่นเล็กเท่าฝ่ามือ เขายื่นให้ บอกว่าใบเดียวกันนี้สถาบันพิมพ์ไว้หลายสิบใบ

        {name}เผาแผ่นนั้นในเตาไฟของโรงเตี๊ยม ตาที่วาดไว้ไหม้เป็นอย่างสุดท้าย
      effects: { gold: -4, hunted: { royal_institute: -1 }, flags: [bought_the_second_face] }
    - id: say_its_not_me
      label: บอกเขาว่ารูปนั้นไม่ใช่{name}
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ยกรูปขึ้นเทียบกับหน้าตัวเองให้เขาดูชัดๆ บอกว่าจมูกในรูปเป็นของพี่เขยคนขายเกลือที่ท่าน้ำ คางก็ใช่ เขาดูรูป ดูหน้า ดูรูปอีกครั้ง แล้วหัวเราะสั้นๆ

          เขาม้วนใบค่าหัวเก็บ ลุกไปนั่งโต๊ะถัดไป เริ่มดูหน้าคนใหม่ทีละโต๊ะ เหรียญทองแดงกลับไปหมุนอยู่บนหลังนิ้วเหมือนเดิม
        effects: { stats: { CHA: 1 }, hunted: { royal_institute: -1 }, flags: [talked_off_the_bounty_man] }
      failure:
        text: |
          เขาฟังจนจบ ยิ้ม แล้วหยิบถ่านจากกระเป๋าเสื้อ เขียนตัวหนังสือสั้นๆ ไว้ใต้รูปที่สอง ชื่อโรงเตี๊ยม ชื่อถนน แล้วม้วนเก็บ

          เขาดื่มเหล้าสองจอกที่{name}สั่งให้ระหว่างพูดจนหมด แล้วเดินออกไปโดยไม่รีบ เหรียญทองแดงยังหมุนอยู่บนหลังนิ้วจนลับประตู
        effects: { hunted: { royal_institute: 1 }, gold: -1, flags: [marked_by_the_bounty_man] }

- id: adult.iron_hunt_tracker
  stage: adult
  weight: 15
  time: night
  hunt: royal_institute
  when:
    age: [25, 64]
    org: cold_iron
    not_orgs: [reclaimers]
  text: |
    สามคืนติดกันมีคนเดินตาม{name}จากเตากลับที่พัก ห่างสามสิบก้าวเท่ากันทุกคืน รองเท้าบู๊ตส้นเหล็ก คืนที่สี่เสียงส้นเหล็กไม่ได้ดังตามหลัง เขารออยู่ในตรอกข้างหน้า ยืนขวางทาง ดาบสั้นยังอยู่ในฝัก มือซ้ายถือใบค่าหัวม้วนกลม

    เขาบอกว่าสถาบันจ่ายตามสภาพ ตัวเป็นได้ราคาเต็ม ตายได้ครึ่งเดียว เขาชอบราคาเต็ม แล้ววางใบค่าหัวลงบนฝาถังน้ำฝนข้างผนัง ชักดาบออกจากฝักช้าๆ ให้{name}เห็นทีละนิ้ว
  encounter:
    foe: mercenary
    name: นักตามรอยรับจ้างของสถาบัน
    morale: 2
    beats:
      - text: เขายืนเฉียงตัว ปลายดาบต่ำ เท้าหน้าห่างเท้าหลังพอดีช่วงก้าว ท่าของคนที่รับจ้างรบมานานกว่ารับจ้างตามหาคน ตรอกแคบพอให้เดินได้ทีละคน
        moves:
          - id: tr_price
            label: บอกเขาว่าค่าหัวคนของเตาไม่คุ้มกับแขนที่เขาจะเสียไป
            kind: talk
            parley: true
          - id: tr_barrel
            label: ผลักถังน้ำฝนให้ล้มกลิ้งใส่ขาเขา
            kind: quick
          - id: tr_read_feet
            label: ดูเท้า ดูมือ ดูว่าเขาจะเข้ามาทางไหน
            kind: read
            stat: WIS
            success: เขาลงน้ำหนักเท้าหน้าทุกครั้งที่หายใจออก ปลายดาบขยับตามไหล่ซ้ายของ{name} ไม่ได้ตามมือ คนที่ฝึกมาแบบนี้จะเข้ามาตอนคู่ต่อสู้หายใจเข้า
          - id: tr_back_alley
            label: หันหลังวิ่งกลับทางที่มา
            kind: flee
      - text: เขาเข้ามาจังหวะเดียว ดาบสั้นแทงต่ำ เล็งขา ไม่ได้เล็งชีวิต
        answer: quick
        moves:
          - id: tr_sidestep
            label: เบี่ยงตัวชิดผนัง ให้ดาบผ่านไป
            kind: quick
          - id: tr_cloak
            label: สะบัดเสื้อคลุมพันใบดาบ
            kind: guard
          - id: tr_lunge
            label: พุ่งเข้าชิดตัวก่อนเขาจะดึงดาบกลับ
            kind: attack
          - id: tr_over_wall
            label: ปีนข้ามกำแพงเตี้ยข้างตรอก
            kind: flee
      - text: เขาถอยไปครึ่งก้าว หอบ ตาเหลือบไปทางปากตรอกฝั่งที่มีแสงตะเกียง แล้วกลับมาที่{name} คนที่กำลังคิดเลขอยู่ในหัว
        answer: talk
        moves:
          - id: tr_count_it
            label: นับให้เขาฟังว่าค่าหัวยี่สิบเหรียญหารด้วยกี่คืนที่เขาเดินตาม
            kind: talk
            parley: true
            success: เขาหยุดคิดตามจริงๆ ปากขยับนับตาม ตัวเลขที่ออกมาไม่สวย ปลายดาบลดลงครึ่งหนึ่ง
          - id: tr_strike_wrist
            label: ฟาดเข้าข้อมือข้างที่ถือดาบ
            kind: attack
            tags: [blunt]
          - id: tr_hold_the_way
            label: ยืนขวางทางไว้ ไม่ให้เขาผ่านไปทางเตา
            kind: guard
          - id: tr_run_light
            label: วิ่งออกไปทางปากตรอกที่มีแสง
            kind: flee
    win:
      text: |
        เขานั่งพิงกำแพงตรอก มือกุมข้อมือ ดาบสั้นตกอยู่ในร่องน้ำ {name}หยิบใบค่าหัวจากฝาถังน้ำฝนมาคลี่ดู หน้าที่สองยังไม่มีชื่อ ใต้รูปมีรอยถ่านเขียนชื่อถนนที่{name}พัก

        คืนนั้นใบค่าหัวไหม้ในเตาหลังร้านตีเกือกม้า เช้ามาที่พักของ{name}ย้ายไปอยู่อีกถนนหนึ่ง
      effects: { hunted: { royal_institute: -1 }, flags: [beat_the_institute_tracker] }
    lose:
      text: |
        {name}ล้มลงในร่องน้ำ ส้นบู๊ตเหล็กกดข้อมือไว้กับหิน เขาค้นย่าม เอาเงินที่มีไปครึ่งหนึ่ง กำลังจะเอาเชือกออกมาตอนยามถนนเดินถือตะเกียงเข้ามาที่ปากตรอก เขาถอยออกไปอีกทางโดยไม่รีบ

        ใบค่าหัวยังวางอยู่บนฝาถังน้ำฝน เขาลืมไว้ หรือตั้งใจวางไว้ {name}ไม่รู้
      effects: { gold: -3, flags: [beaten_by_the_institute_tracker] }
    stalemate:
      text: |
        เขาเก็บดาบเข้าฝัก หยิบใบค่าหัวจากฝาถังน้ำฝนม้วนเก็บ บอกว่าจะกลับมาตอนราคาขึ้น แล้วเดินออกไปทางปากตรอกที่มีแสง เสียงส้นเหล็กหายไปตอนเลี้ยวหัวมุม

        สามคืนต่อมาไม่มีเสียงส้นเหล็กเดินตาม คืนที่สี่ก็ไม่มี {name}นับต่อทุกคืน
      effects: { flags: [held_off_the_institute_tracker] }
    flee:
      text: |
        {name}วิ่งไม่หยุดจนถึงโรงไม้หลังร้านตีเกือกม้า นอนข้างเตาจนสาง คืนต่อมาย้ายที่พัก ค่าเช่าเดิมที่จ่ายล่วงหน้าไม่ได้คืน

        ที่พักใหม่อยู่ชั้นบนของร้านขายเชือก หน้าต่างมองเห็นถนนทั้งสองทาง
      effects: { gold: -1, flags: [ran_from_the_institute_tracker] }
    parley:
      text: |
        เขาเก็บดาบเข้าฝักช้าเท่าตอนชัก บอกว่ายี่สิบเหรียญไม่คุ้มกับคนที่เดินกลับบ้านทางเดิมทุกคืนแล้วยังนับก้าวคนตามได้ เขาจะบอกสถาบันว่าหน้าที่สองย้ายไปแล้ว

        เขาหยิบใบค่าหัวจากฝาถัง ฉีกรูปหน้าที่สองออก ยื่นให้{name} แล้วเดินออกไปทางมืด
      effects: { hunted: { royal_institute: -1 }, flags: [talked_down_the_institute_tracker] }
    death:
      text: |
        ดาบสั้นไม่ได้เข้าที่ขาอย่างที่เขาตั้งใจ {name}ขยับผิดจังหวะไปครึ่งก้าว ใบดาบเข้าใต้ซี่โครง

        เขายืนดูอยู่ครู่หนึ่ง แล้วถอนหายใจเหมือนคนเสียเงิน ราคาครึ่งเดียว

- id: adult.iron_offer_name_book
  stage: adult
  scene: market
  weight: 12
  time: dusk
  when:
    age: [28, 64]
    org: { id: cold_iron, min_rank: 2 }
  text: |
    เจ้าของแผงข้าวต้มบอกว่าค่าข้าวมื้อนี้มีคนจ่ายไปแล้ว คนจ่ายนั่งอยู่ม้านั่งตัวถัดไป ชายหนุ่มผมหวีเรียบ เสื้อคลุมขลิบแขนด้วยสีของสถาบัน ข้างเขามีเจ้าหน้าที่ของอาณาจักรยืนอยู่อีกคน ตัวใหญ่ เชือกป่านขดหนึ่งพาดบ่า

    คนของสถาบันวางของสองอย่างบนโต๊ะ ใบอภัยโทษประทับครั่งแดงที่ช่องชื่อยังว่าง กับถุงเงินถุงหนึ่ง เขาบอกว่าสถาบันไม่ต้องการตัว{name} สถาบันต้องการห่วงแผ่นเหล็กที่มีชื่อ ทุกแผ่น ทุกชื่อ ทั้งชื่อที่จบแล้วและที่ยังไม่จบ เขารู้ว่าเตาหนึ่งมีห่วงเดียว และรู้ว่า{name}รู้ว่าห่วงนั้นอยู่ที่ไหนทุกคืน

    เจ้าหน้าที่ข้างโต๊ะพูดครั้งเดียว ว่าข้อเสนอของเขาเหมือนกันทุกคำ ต่างกันแค่ไม่มีถุงเงิน แล้วขยับขดเชือกบนบ่าให้เข้าที่
  choices:
    - id: sell_the_ring
      label: เอาห่วงแผ่นเหล็กมาแลกใบอภัยโทษกับถุงเงิน
      text: |
        เช้าวันต่อมา{name}วางห่วงแผ่นเหล็กลงบนโต๊ะแผงข้าวต้มตัวเดิม คนของสถาบันนับแผ่นทีละแผ่น อ่านชื่อแผ่นแรกออกเสียงเบาๆ แล้วเขียนชื่อ{name}ลงช่องว่างในใบอภัยโทษ ลายมือสวย เป่าหมึกให้แห้ง เจ้าหน้าที่ข้างโต๊ะไม่ได้ขยับเชือกอีกเลย

        สองสัปดาห์ต่อมา วงกบประตูที่พักของ{name}มีรอยบากเล็กๆ รอยหนึ่ง สูงระดับไหล่ เนื้อไม้ยังขาว
      effects:
        mark: ขายสมุดชื่อของเตา
        gold: 8
        org: { id: cold_iron, leave: true }
        lose_traits: [oath_cold_iron]
        hunted: { cold_iron: 2, royal_institute: -2 }
        flags: [left_the_cold_iron, sold_the_name_ring]
    - id: refuse_both_offers
      label: ลุกจากโต๊ะ บอกว่าห่วงนั้นไม่ใช่ของที่ใครขายได้
      text: |
        คนของสถาบันพับใบอภัยโทษเก็บเข้าอกเสื้อ ไม่ต่อรอง ไม่ขึ้นราคา เขาจ่ายค่าข้าวต้มของ{name}ไปแล้ว ไม่ทวงคืน

        เจ้าหน้าที่ข้างโต๊ะเดินตาม{name}ไปจนสุดตลาด ห่างสิบก้าว แล้วหยุดอยู่ตรงนั้น ฤดูต่อมาใบประกาศค่าหัวของสถาบันขึ้นราคาคนของเตาเหล็กเย็นอีกหนึ่งเท่า
      effects: { hunted: { royal_institute: 1 }, flags: [refused_to_sell_the_ring] }
    - id: tell_the_forge_that_night
      label: กลับไปเล่าให้คนในเตาฟังทุกคำคืนนั้น
      text: |
        คนในเตาฟังโดยไม่ขัด ห่วงแผ่นเหล็กย้ายที่เก็บในคืนเดียวกัน ไปอยู่ใต้แผ่นหินหน้าเตา ที่ที่ต้องยกทั่งออกก่อนถึงจะเปิดได้ คนที่รู้ว่าอยู่ตรงนั้นมีสองคน

        โดเรคขอบคุณ{name}ที่เล่า เขาบอกว่าคนที่สถาบันมาเสนอซื้อห่วง ไม่มีใครเล่าก่อน{name}
      effects: { alignment: { law: 1 }, reputation: { cold_iron: 1 }, flags: [warned_the_forge_of_the_offer] }

- id: adult.iron_walk_out
  stage: adult
  scene: smithy
  weight: 10
  time: night
  when:
    age: [25, 64]
    org: cold_iron
  text: |
    กลิ่นกระดาษไหม้ไม่ยอมออกจากเสื้อตัวนั้น ซักสามน้ำแล้วก็ยังอยู่ ใกล้สาง {name}ยืนอยู่หน้าประตูโรงไม้หลังร้านตีเกือกม้า ของของเตาทุกชิ้นที่อยู่กับตัวห่ออยู่ในผ้าผืนเดียว จะเป็นกระดิ่ง ค้อน ห่วงแผ่นเหล็ก หรือแค่สิ่วเล่มเล็กที่เตาให้ยืมไว้บากวงกบ

    โดเรคนั่งอยู่บนลังข้างเตา ไม่ได้นอน เขารู้ธรรมเนียมนี้ดีกว่าใคร คนที่วางของลงบนทั่งแล้วเดินออกไป เตาไม่ตาม และเตาไม่รับกลับ เพราะคนที่เดินออกไปส่วนใหญ่เดินไปหาสิ่งที่เคยสาบานว่าจะไม่แตะ เตาไม่รับคนที่ยังอยากได้สิ่งนั้นคืน
  choices:
    - id: lay_it_all_down
      label: วางของของเตาลงบนทั่งทีละชิ้น แล้วเดินออกไป
      text: |
        {name}วางทีละชิ้น เสียงเหล็กกระทบทั่งทื่อทุกครั้ง โดเรคขอบคุณเหมือนขอบคุณทุกคนที่ตอบคำถามเขา แล้วเอาขอเหล็กเกี่ยวของทั้งห่อไปวางในหีบใต้ทั่ง

        ทางหลวงช่วงเช้าว่าง มีแต่เสียงค้อนจากร้านหน้าดังตามหลังมาพักหนึ่ง เสียงตีเกือกม้า ไม่ใช่เสียงค้อนบนเหล็กเย็น
      effects:
        mark: ออกจากภาคีเหล็กเย็น
        org: { id: cold_iron, leave: true }
        lose_traits: [oath_cold_iron]
        lose_items: [iron_clapperless_bell, iron_halvins_hammer]
        flags: [left_the_cold_iron, laid_the_lodge_iron_down]
    - id: keep_one_bar
      label: วางทุกชิ้น เว้นแท่งเหล็กเย็นแท่งหนึ่งที่ซ่อนไว้ในย่าม
      text: |
        {name}วางทุกชิ้นที่เตารู้ว่าอยู่กับตัว แท่งเหล็กสีเทาด้านแท่งที่หยิบจากกองข้างทั่งเมื่อเดือนก่อนยังนอนอยู่ก้นย่าม เย็นจนผ้าย่ามตรงนั้นชื้น โดเรคขอบคุณ ดูย่ามบนบ่าของ{name}ครั้งเดียว

        สามวันต่อมา วงกบประตูที่พักของ{name}มีรอยบาก สูงระดับไหล่ เพื่อนบ้านที่เคยแวะมาขอยืมเกลือเลิกแวะตั้งแต่เย็นวันนั้น
      effects:
        mark: ออกจากภาคีเหล็กเย็น
        org: { id: cold_iron, leave: true }
        lose_traits: [oath_cold_iron]
        hunted: { cold_iron: 2 }
        lose_items: [iron_clapperless_bell, iron_halvins_hammer]
        flags: [left_the_cold_iron, kept_a_cold_iron_bar]
    - id: sit_back_down_inside
      label: เดินเข้าไปนั่งที่ลังเดิม วางห่อผ้าไว้ข้างเท้า
      text: |
        โดเรคเลื่อนถ้วยน้ำร้อนมาให้ถือ ไม่ถามว่าห่อผ้าข้างเท้ามีอะไร {name}นั่งจนฟ้าสาง แล้วแกะห่อ แขวนของทุกชิ้นกลับที่เดิมของมัน

        เย็นวันนั้นมีงาน {name}ไปตามที่เตาส่ง กลิ่นกระดาษไหม้ติดเสื้อตัวใหม่
      effects: { alignment: { law: 1 }, flags: [turned_back_at_the_forge_door] }
