# ชุด 1 คนรอบตัวจากไป และลูกคนที่สอง
# ทุกเรื่องใช้ตัวแสดง (cast) เลือกคนที่มีอยู่จริงในชีวิตนั้น ไม่มีใครเข้าบท เรื่องไม่ออก เด็กวิหารจึงไม่เจอเรื่องพ่อแม่เอง
# คนที่ตายในเรื่องตายด้วย people ระดับเหตุการณ์ (ไม่ว่าจะเลือกทางไหน) ตัวเลือกคือสิ่งที่ตัวละครทำในเวลาที่เหลือหรือหลังจากนั้น
# พ่อแม่: มีเรื่องที่สุ่มออกได้ก่อน (น้ำหนักต่ำ) กับเรื่องปิดท้ายที่ต้องออก (must) เมื่อคนนั้นแก่มาก จะได้ไม่มีใครตายเป็นแค่ประโยคข่าว
# คู่ครอง (แต่งหรือไม่แต่งก็ตาม): ไม่ตายด้วยการทอยประจำปีของระบบ จากไปก่อนได้ด้วยสามเรื่องในไฟล์นี้เท่านั้น (น้ำหนักต่ำ ราวครึ่งหนึ่งของคู่ที่อยู่ถึงวัยชรา)
#   คู่ที่ไม่มีเรื่องไหนออก คู่ครองอยู่จนถึงฉากตายของตัวละคร (death.age_partner)
# ข้อความห้ามผูกกับถิ่นหรืออาชีพ ห้ามเอ่ยถึงพ่อหรือแม่อีกคน (อาจไม่อยู่แล้ว) คู่ครองที่ตายใช้ {gone} ไม่ใช้ {partner}
# คู่ครองจากไป: ล้าง has_partner กับ married แล้วตั้ง partner_died ให้ตรงกับ adult.life_partner_gone

# ===================== พ่อ =====================

- id: adult.passing_father_ill
  stage: adult
  scene: home
  weight: 6
  mark: "{dad}จากไป"
  cast:
    dad: { id: father, min_age: 62 }
  people: [{ id: "@dad", dies: true }]
  when:
    age: [30, 75]
    not_flags: [father_away, father_lost, origin_marked_hidden]
  text: |
    คนส่งข่าวมาบอกว่า{dad}ไม่ลุกจากเตียงมาสามวันแล้ว และถามหา{name}ตั้งแต่วันแรก

    {name}ไปถึงตอนเย็น {dad}นอนหนุนหมอนสองใบ ตัวเล็กลงกว่าครั้งก่อนที่เจอกัน มือที่วางอยู่บนผ้าห่มยังใหญ่เท่าเดิม ใหญ่เกินข้อมือที่ผอมลง เขาลืมตาขึ้นมอง แล้วถามเป็นคำแรกว่ากินข้าวมาหรือยัง

    หมอมาแล้วเมื่อเช้า ทิ้งยาไว้ขวดเดียว เป็นยาให้หลับ
  choices:
    - id: eat_beside_him
      label: ตักข้าวมานั่งกินข้างเตียงให้เขาเห็น
      text: |
        {name}ตักข้าวต้มในหม้อมาหนึ่งชาม นั่งลงบนม้านั่งข้างเตียง กินทีละช้อน {dad}มองทุกช้อน เหมือนตอนที่{name}ยังเด็กแล้วไม่ยอมกินผัก

        พอชามเกลี้ยง เขาพยักหน้าทีหนึ่ง แล้วหลับตา ลมหายใจยาวขึ้นและห่างขึ้นตลอดคืน ครั้งสุดท้ายมาตอนไก่ยังไม่ขัน {name}ล้างชามใบนั้น คว่ำไว้ที่เดิม แล้วจึงออกไปบอกคนข้างบ้าน
      effects: { hp: 2, flags: [buried_father] }
    - id: ask_him
      label: ถามเรื่องที่ไม่เคยถาม ว่าตอนหนุ่มเขาเคยอยากเป็นอะไร
      text: |
        {dad}นิ่งไปนานจน{name}คิดว่าหลับ แล้วเขาก็ตอบว่าอยากเห็นทะเลสักครั้ง ไม่ได้อยากเป็นอะไร แค่อยากไปยืนดู ตอนอายุสิบเจ็ดเก็บเงินได้ครึ่งทางแล้วด้วย

        {name}ถามว่าแล้วทำไมไม่ไป เขาหัวเราะในคอ บอกว่าคนที่เคยไปเห็นกลับมาเล่าว่าก็แค่น้ำ เขาหลับไปหลังประโยคนั้น และไม่ได้ตื่นขึ้นมาเล่าว่าเงินครึ่งทางนั้นเอาไปทำอะไร
      effects: { stats: { WIS: 1 }, flags: [buried_father, father_wanted_the_sea] }
    - id: unbuckle_the_hook
      label: ปลดสายหนังแขนเหล็กให้ อย่างที่เขาขอ
      requires: { flag: father_iron_arm }
      text: |
        สายหนังรัดไหล่ข้างนั้นมาหลายสิบปี จนเนื้อเป็นร่องที่ไม่มีวันเต็ม {name}ปลดหัวเข็มขัดทีละเม็ด สามเม็ด แล้วดึงขอเหล็กออก วางไว้บนโต๊ะข้างเตียง หันด้านที่ตะไบมนออกมา

        {dad}ขยับไหล่ข้างนั้นขึ้นลงสองที บอกว่าเบาดี เหมือนตอนก่อนไปรบ เขาหลับไปทั้งที่ตอแขนยังยกค้างอยู่บนผ้าห่ม เช้ามา{name}เป็นคนวางลงให้
      effects: { flags: [buried_father, kept_fathers_hook] }
    - id: sit_and_watch
      label: นั่งเฝ้าเฉยๆ ปล่อยให้เขาหลับ
      text: |
        {name}หรี่ตะเกียงลง นั่งฟังเสียงหายใจ เสียงเดียวกับที่เคยได้ยินผ่านฝาห้องทุกคืนตอนเด็ก ตอนนั้นดังกว่านี้ และไม่เคยขาดช่วง

        ใกล้รุ่ง{dad}พูดขึ้นมาทั้งที่ตายังปิด เขาเรียกแม่ ไม่ได้เรียกชื่อใคร เรียกว่าแม่ เสียงเด็กกว่าที่{name}เคยได้ยินจากเขาทั้งชีวิต แล้วก็ไม่มีเสียงอะไรอีก
      effects: { flags: [buried_father] }

- id: adult.passing_father_last
  stage: adult
  scene: home
  must: true
  mark: "{dad}จากไป"
  cast:
    dad: { id: father, min_age: 80 }
  people: [{ id: "@dad", dies: true }]
  when:
    not_flags: [father_away, father_lost, origin_marked_hidden]
  text: |
    {dad}แก่กว่าทุกคนในถิ่นเกิดมาหลายปีแล้ว แก่จนคนเลิกถามอายุ เปลี่ยนไปถามว่ากินอะไร

    เช้าวันหนึ่งเขาไม่ได้ออกมานั่งที่ม้านั่งหน้าบ้านตามเวลา เพื่อนบ้านรอจนสายแล้วเข้าไปดู เขานอนอยู่บนเตียง ผ้าห่มเรียบ รองเท้าวางคู่อยู่ข้างเตียงหันหัวออกเหมือนทุกคืน

    กว่า{name}จะไปถึง งานทุกอย่างก็เสร็จแล้ว คนในถิ่นทำกันเองตามที่เขาสั่งไว้ล่วงหน้าหลายปี เหลือแต่ของในบ้านที่รอให้ลูกมาตัดสิน มีไม่กี่ชิ้น
  choices:
    - id: take_the_stick
      label: เอาไม้เท้าของเขากลับไป
      text: |
        ไม้เท้าพิงอยู่ข้างประตู หัวไม้สึกเป็นร่องตามรูปอุ้งมือ {name}ลองจับ ร่องนั้นใหญ่กว่ามือตัวเองไปหนึ่งนิ้ว

        {name}ถือกลับไปโดยไม่ได้ใช้ค้ำ วางพิงไว้ข้างประตูบ้านตัวเอง ตรงที่เดียวกับที่เขาเคยวาง
      effects: { flags: [buried_father, kept_fathers_stick] }
    - id: leave_the_bench
      label: ไม่เอาอะไร ขอแค่ให้ม้านั่งหน้าบ้านอยู่ที่เดิม
      text: |
        {name}ยกของในบ้านให้เพื่อนบ้านที่ช่วยงานศพทุกชิ้น ขอไว้อย่างเดียว ว่าใครมาอยู่บ้านนี้ต่อก็อย่ายกม้านั่งตัวนั้นไปไหน

        ปีต่อมามีคนเล่าให้ฟังว่าตาแก่อีกคนในถิ่นมานั่งแทนที่ทุกเช้า ตรงเวลาเดียวกัน คนเริ่มถามตาแก่คนนั้นแล้วว่ากินอะไร
      effects: { alignment: { moral: 1 }, flags: [buried_father] }
    - id: count_what_he_left
      label: เปิดไหที่เขาซ่อนเงินไว้ แล้วนับ
      habit: tight_fist
      text: |
        ไหอยู่หลังถังแป้ง ที่เดียวกับที่เขาซ่อนมาตั้งแต่{name}ยังเด็ก และคิดมาตลอดว่าไม่มีใครรู้ ข้างในมีสี่เหรียญ กับกระดุมอีกเม็ดหนึ่งที่ไม่รู้ว่าของเสื้อตัวไหน

        {name}เก็บเหรียญใส่ถุง เก็บกระดุมใส่กระเป๋าเสื้ออีกข้าง
      effects: { gold: 4, flags: [buried_father] }

# ===================== แม่ =====================

- id: adult.passing_mother_ill
  stage: adult
  scene: home
  weight: 6
  mark: "{mom}จากไป"
  cast:
    mom: { id: mother, min_age: 62 }
  people: [{ id: "@mom", dies: true }]
  when:
    age: [33, 75]
    not_flags: [origin_marked_hidden]
  text: |
    {mom}ส่งคนมาตาม ไม่ได้บอกว่าป่วย บอกแค่ว่ามีของจะให้ และให้มาก่อนสิ้นเดือน

    {name}ไปถึงก็รู้ว่าทำไมต้องก่อนสิ้นเดือน นางนั่งอยู่บนเตียง หลังพิงฝา ผอมจนไหปลาร้าเป็นขอบชัด แต่ผมยังหวีเรียบ มวยยังแน่น บนผ้าห่มมีของวางเรียงไว้เป็นกองๆ แต่ละกองมีเศษผ้าผูกติดไว้ สีไม่ซ้ำกัน

    "นั่ง" นางว่า "ข้าจะบอกทีเดียว ไม่บอกซ้ำ"
  choices:
    - id: learn_the_handful
      label: ขอสูตรแกงที่นางไม่เคยยอมบอกใคร
      text: |
        นางบอกโดยไม่ต้องคิด หัวหอมสอง กระดูกหนึ่งท่อน เกลือหนึ่งกำมือ {name}ถามว่ากำมือของใคร นางชูมือขึ้น เล็กกว่ามือ{name}เกือบครึ่ง

        {name}ไปหยิบถ้วยมา ให้นางกำเกลือเทลงไป แล้วขีดรอยไว้ข้างถ้วยด้วยปลายมีด นางตายหลังจากนั้นหกวัน ตอนบ่าย ระหว่างงีบ ถ้วยใบนั้นยังอยู่ในครัวของ{name} ไม่เคยใช้ใส่อย่างอื่น
      effects: { flags: [buried_mother, mothers_handful] }
    - id: comb_her_hair
      label: ฟังจนจบ แล้วขอหวีผมให้นาง
      habit: soft_heart
      text: |
        กองผ้าแดงให้หลานของเพื่อน กองผ้าเขียวให้วิหาร กองที่ไม่มีผ้าผูกคือของ{name} นางบอกครบแล้วจึงยอมให้แก้มวย

        ผมของนางยาวถึงเอวและบางจนเห็นหวีลอดผ่าน {name}หวีจากปลายขึ้นไปหาโคนอย่างที่นางเคยสอน นางหลับไปทั้งที่ยังนั่ง สี่วันต่อมานางไม่ตื่น คนที่มาแต่งตัวให้เป็นครั้งสุดท้ายบอกว่ามวยผมยังแน่นอยู่ ไม่ต้องทำใหม่
      effects: { flags: [buried_mother] }
    - id: confess
      label: สารภาพเรื่องที่โกหกนางไว้ตั้งแต่เด็ก
      text: |
        {name}เล่าเรื่องไหน้ำผึ้งที่แตกเมื่ออายุเก้าขวบ ที่บอกว่าแมวทำ นางฟังจนจบโดยไม่ขัด แล้วบอกว่าบ้านเราไม่เคยมีแมว

        นางรู้มาตลอด รู้เรื่องอื่นด้วยอีกสี่เรื่อง นางไล่ให้ฟังทีละเรื่อง นับนิ้วไปด้วย {name}หัวเราะจนต้องเช็ดตา นางตายปลายสัปดาห์นั้น เรื่องที่ห้า{name}ยังไม่ทันได้ถามว่าคือเรื่องอะไร
      effects: { stats: { CHA: 1 }, flags: [buried_mother] }

- id: adult.passing_mother_last
  stage: adult
  scene: home
  must: true
  mark: "{mom}จากไป"
  cast:
    mom: { id: mother, min_age: 80 }
  people: [{ id: "@mom", dies: true }]
  when:
    not_flags: [origin_marked_hidden]
  text: |
    หลายปีหลังมานี้{mom}เรียก{name}ผิดชื่อบ่อยขึ้น บางวันเป็นชื่อพี่น้องของนางที่ตายไปนานแล้ว บางวันเป็นชื่อที่{name}ไม่เคยได้ยิน มีวันเดียวที่นางเรียกถูก แล้วถามต่อว่าทำไมแก่เร็วนัก

    นางตายตอนต้นหน้าหนาว ในเก้าอี้ข้างเตา มือยังกำไหมพรมอยู่ก้อนหนึ่ง ถักค้างไว้ได้ยาวสองคืบ ไม่มีใครรู้ว่านางจะถักเป็นอะไร และถักให้ใคร

    {name}ไปถึงตอนที่เพื่อนบ้านกำลังจะแกะไหมพรมออกจากมือนาง
  choices:
    - id: leave_the_yarn
      label: บอกให้ปล่อยไว้ในมือนางอย่างนั้น
      text: |
        เพื่อนบ้านถอยออกมา นางไปทั้งที่ยังกำไหมพรมก้อนนั้น ปลายเส้นที่ถักค้างพับเก็บไว้ใต้ฝ่ามือ

        ไม่มีใครได้รู้ว่าของชิ้นนั้นจะกลายเป็นอะไร {name}คิดว่าเป็นผ้าพันคอ คนข้างบ้านว่าเป็นถุงเท้า ทั้งสองคนไม่ได้เถียงกันนาน
      effects: { flags: [buried_mother] }
    - id: finish_it
      label: เอากลับมาถักต่อให้จบ
      habit: craft_hands
      text: |
        {name}ถักไม่เป็น ต้องไปให้หญิงข้างบ้านสอนตั้งแต่วิธีจับไม้ ห่วงของ{name}หลวมบ้างแน่นบ้าง ดูออกทันทีว่าตรงไหนที่เปลี่ยนมือ

        ถักจบตอนปลายหน้าหนาว ได้ผ้าพันคอที่ครึ่งหนึ่งเรียบ อีกครึ่งเป็นคลื่น {name}พันออกจากบ้านทุกเช้าที่ลมแรง เอาครึ่งที่เรียบไว้ด้านใน
      effects: { flags: [buried_mother, finished_mothers_knitting] }
    - id: answer_the_question
      label: นั่งลงข้างเก้าอี้ แล้วตอบคำถามที่นางเคยถาม
      text: |
        {name}บอกนางว่าไม่ได้แก่เร็วหรอก แค่ไม่ได้มาหาบ่อยพอให้นางเห็นว่าค่อยๆ แก่ พูดออกมาดังๆ ในห้องที่มีเพื่อนบ้านยืนอยู่สามคน ไม่มีใครทำเป็นไม่ได้ยิน

        เพื่อนบ้านคนหนึ่งเล่าว่าเดือนสุดท้ายนางพูดถึง{name}ทุกวัน เรียกผิดชื่อทุกครั้ง แต่เรื่องที่เล่าถูกทุกเรื่อง
      effects: { stats: { WIS: 1 }, flags: [buried_mother] }

# ===================== คู่ครอง =====================

- id: elder.passing_partner_winter
  stage: elder
  scene: home
  weight: 0.3
  mark: "{partner}จากไป"
  cast:
    mate: { id: partner, min_age: 60 }
  people: [{ id: partner, dies: true }]
  when:
    flags: [has_partner]
  text: |
    {partner}เป็นไข้ตั้งแต่คืนที่น้ำแข็งจับขอบถังเป็นครั้งแรกของปี ทีแรกก็แค่ไอ แล้วก็เลิกลุกไปเติมไฟตอนดึก ซึ่งเป็นงานที่{p:เขา|เธอ}ไม่เคยยอมให้{name}ทำมาตั้งแต่ปีแรกที่อยู่ด้วยกัน

    หมอมาสองครั้ง ครั้งที่สองไม่รับเงิน

    คืนนี้{partner}ตื่นขึ้นมาตอนไฟใกล้มอด ตาใสกว่าทุกวันในเดือนนี้ {p:เขา|เธอ}มองเตา แล้วมอง{name} แล้วถามว่าใครเป็นคนเติมไฟมาตลอดเดือน
  choices:
    - id: tell_the_truth
      label: บอกว่าเติมเอง และไฟดับไปสามคืน
      text: |
        {partner}หัวเราะจนไอ แล้วสอนจากบนเตียง ต้องวางท่อนใหญ่ไว้ล่าง ท่อนเล็กขัดไว้บน เว้นช่องให้ลมเข้าทางซ้าย เพราะเตานี้ดูดลมทางซ้าย {name}ทำตามทีละท่อน ไฟติดขึ้นมาเป็นเปลวตรง

        {p:เขา|เธอ}ดูอยู่จนแน่ใจ แล้วบอกว่าใช้ได้ คืนนั้นไฟอยู่ถึงเช้า {partner}อยู่ไม่ถึง
      effects: { clear_flags: [has_partner, married], flags: [partner_died, learned_the_fire] }
    - id: share_the_bed
      label: ขึ้นไปนอนเตียงเดียวกันเหมือนทุกคืน ทั้งที่หมอห้าม
      text: |
        ตัวของ{partner}ร้อนเหมือนหินอังไฟ {name}สอดแขนเข้าไปใต้คออย่างที่ทำมาหลายสิบปี แขนชาตั้งแต่ยังไม่ถึงเที่ยงคืนเหมือนทุกครั้ง และไม่ได้ดึงออกเหมือนทุกครั้ง

        ใกล้รุ่งตัวที่ร้อนเริ่มเย็นลง {name}รู้ก่อนจะลืมตา นอนอยู่อย่างนั้นจนแดดส่องถึงเตียง แขนข้างนั้นชาไปถึงเที่ยง
      effects: { hp: -1, clear_flags: [has_partner, married], flags: [partner_died] }
    - id: ask_what_they_want
      label: ถามว่าอยากให้ทำอะไรกับของของ{p:เขา|เธอ}
      text: |
        {partner}บอกว่าเสื้อให้ใครก็ได้ที่ใส่ได้ รองเท้าเผาทิ้ง เพราะกลิ่นนั้นไม่ควรตกเป็นภาระของใคร ส่วนช้อนไม้คันที่ด้ามไหม้ให้เก็บไว้ อย่าให้ใคร เพราะคนอื่นจะไม่รู้ว่าต้องจับตรงไหน

        {p:เขา|เธอ}หลับไปหลังสั่งเรื่องช้อน และไม่ได้ตื่นอีก {name}ทำตามทุกข้อ เว้นข้อรองเท้า คู่นั้นยังอยู่ใต้เตียง
      effects: { clear_flags: [has_partner, married], flags: [partner_died, kept_partners_things] }

- id: elder.passing_partner_sudden
  stage: elder
  scene: home
  weight: 0.2
  mark: "{partner}จากไป"
  cast:
    mate: { id: partner, min_age: 55 }
  people: [{ id: partner, dies: true }]
  when:
    age: [55, 100]
    flags: [has_partner]
  text: |
    {name}ตื่นก่อนเหมือนทุกเช้า ลุกไปต้มน้ำ ตั้งถ้วยสองใบ แล้วกลับมาเรียก

    {partner}นอนตะแคงหันหน้าเข้าฝาเหมือนทุกคืน ผ้าห่มดึงขึ้นถึงหู {name}เรียกสองครั้ง ครั้งที่สามเอามือแตะไหล่ ไหล่เย็น และไม่ได้เย็นแบบคนที่ผ้าห่มหลุด

    น้ำในกาเริ่มเดือดอยู่ในครัว
  choices:
    - id: pour_both_cups
      label: กลับไปรินชาสองถ้วยเหมือนทุกเช้า
      text: |
        {name}รินชาถ้วยของตัวเอง แล้วรินอีกถ้วย เข้มกว่า ไม่ใส่น้ำผึ้ง ยกทั้งสองถ้วยมาวางที่โต๊ะข้างเตียง นั่งดื่มของตัวเองจนหมด

        ถ้วยที่สองเย็นลงเอง ตอนสาย{name}จึงลุกไปเคาะประตูบ้านข้างๆ เพื่อนบ้านถามทีหลังว่าตายตอนไหน {name}ตอบว่าไม่รู้ รู้แต่ว่าเมื่อคืนก่อนนอน{p:เขา|เธอ}ยังบ่นเรื่องหมอนอยู่
      effects: { clear_flags: [has_partner, married], flags: [partner_died] }
    - id: sit_till_noon
      label: นั่งลงที่ขอบเตียง ยังไม่บอกใคร
      text: |
        น้ำเดือดจนแห้งกา กาไหม้ กลิ่นลอยเข้ามาถึงห้องนอน {name}ไม่ได้ลุก

        เที่ยงแล้วเพื่อนบ้านได้กลิ่นจึงมาเคาะ พอเข้ามาเห็นก็ไม่ได้ถามอะไร เดินไปยกกาออกจากเตา เปิดหน้าต่าง แล้วกลับมานั่งลงที่ขอบเตียงอีกฝั่ง เป็นสามคนในห้องนั้นอยู่อีกพักใหญ่
      effects: { clear_flags: [has_partner, married], flags: [partner_died, burned_the_kettle] }
    - id: tell_the_street
      label: ออกไปบอกเพื่อนบ้านทันที ก่อนที่มือจะสั่น
      text: |
        {name}ยกกาลงจากเตา ใส่รองเท้า เดินไปเคาะสามบ้าน บอกด้วยประโยคเดียวกันทั้งสามบ้าน เสียงไม่สั่น ภายในครึ่งชั่วยามมีคนมาเต็มบ้าน มีคนต้มน้ำ มีคนไปตามสัปเหร่อ

        มือเริ่มสั่นตอนค่ำ ตอนที่คนสุดท้ายกลับไปแล้ว และบนโต๊ะยังมีถ้วยชาตั้งอยู่สองใบ สะอาดทั้งคู่ มีคนล้างให้แล้วเก็บผิดที่
      effects: { clear_flags: [has_partner, married], flags: [partner_died] }

- id: elder.passing_partner_last
  stage: elder
  scene: home
  weight: 0.45
  mark: "{partner}จากไป"
  cast:
    mate: { id: partner, min_age: 80 }
  people: [{ id: partner, dies: true }]
  when:
    flags: [has_partner]
  text: |
    สองคนแก่จนคนในถิ่นเลิกแยกว่าใครเป็นใคร เรียกรวมกันว่าบ้านนั้น เดินไปตลาดก็ไปด้วยกัน คนหนึ่งเป็นตาให้ อีกคนเป็นขาให้

    ทั้งหน้าใบไม้ร่วงนี้{partner}กินน้อยลงทุกวัน ไม่ได้เจ็บตรงไหน แค่บอกว่าอิ่มแล้วตั้งแต่ช้อนที่สาม หมอตรวจแล้วไม่เจออะไรให้รักษา บอกว่าบางคนก็แค่ถึงเวลา

    บ่ายนี้{p:เขา|เธอ}ขอออกมานั่งที่ม้านั่งหน้าบ้าน ห่มผ้าสองผืน แดดอ่อน {p:เขา|เธอ}เอนหัวมาพิงไหล่{name} แล้วบอกว่า ไปก่อนนะ เสียงเหมือนคนจะลุกไปซื้อเกลือ
  choices:
    - id: say_go_ahead
      label: ตอบว่าไปเถอะ เดี๋ยวตามไป
      text: |
        {partner}ยิ้ม บอกว่าไม่ต้องรีบ แล้วไม่ได้พูดอะไรอีก น้ำหนักของหัวบนไหล่ค่อยๆ มากขึ้น อย่างคนที่หลับสนิท

        {name}นั่งอยู่อย่างนั้นจนแดดหมด เด็กข้างบ้านเดินผ่านสองรอบ รอบที่สองหยุดมอง แล้ววิ่งไปตามแม่
      effects: { clear_flags: [has_partner, married], flags: [partner_died] }
    - id: say_wait
      label: บอกว่ายังไปไม่ได้ ผ้ายังตากอยู่บนราว
      text: |
        {partner}หัวเราะ ถามว่าผ้าของใคร {name}ว่าของ{p:เขา|เธอ}นั่นแหละ สองตัว ยังไม่แห้ง {p:เขา|เธอ}ว่างั้นก็เก็บให้ด้วย อย่าปล่อยค้างคืน น้ำค้างจะลง

        เย็นนั้น{name}เก็บผ้า พับ แล้ววางไว้บนเตียงฝั่งของ{partner} คนที่ควรจะใส่ผ้าสองตัวนั้นยังนั่งอยู่บนม้านั่งหน้าบ้าน ห่มผ้าสองผืน ไม่หนาวแล้ว
      effects: { clear_flags: [has_partner, married], flags: [partner_died, kept_partners_things] }
    - id: say_nothing
      label: ไม่ตอบ จับมือ{p:เขา|เธอ}มาวางไว้บนตัก
      text: |
        มือนั้นเบากว่าที่เคย ผิวบางจนเห็นเส้นเลือดเป็นสีเดียวกับผ้าห่ม {name}เอาสองมือประกบไว้ เหมือนอุ่นไข่

        ไม่มีใครพูดอะไรอีก ตอนที่มือในอุ้งมือเย็นลงกว่าอากาศ แดดยังไม่หมดด้วยซ้ำ
      effects: { clear_flags: [has_partner, married], flags: [partner_died] }

# ===================== เพื่อน คู่แค้น ครู =====================

- id: elder.passing_friend
  stage: elder
  scene: tavern
  weight: 4
  mark: "{pal}จากไป"
  cast:
    pal: { bond: [friend], min_age: 70, min_closeness: 1 }
  people: [{ id: "@pal", dies: true }]
  when:
    age: [62, 100]
  text: |
    {pal}ตายเมื่อสามวันก่อน ข่าวมาถึงพร้อมคำเชิญ ญาติของ{pal:เขา|นาง}จัดเลี้ยงส่งที่ร้านเหล้า ตามที่เจ้าตัวสั่งไว้ว่าห้ามจัดที่วิหาร เพราะม้านั่งแข็ง

    ในร้านมีคนราวยี่สิบ ส่วนใหญ่{name}ไม่รู้จัก ทุกคนมีเรื่องของ{pal}มาเล่าคนละเรื่อง เล่าวนกันไปทีละโต๊ะ บางเรื่อง{name}อยู่ในเหตุการณ์ และจำได้ไม่เหมือนที่เขาเล่ากัน

    ญาติคนหนึ่งเดินมาเติมเหล้าให้ แล้วบอกว่าถึงตาโต๊ะนี้แล้ว
  choices:
    - id: tell_the_true_one
      label: เล่าเรื่องวันแรกที่เจอกัน เรื่องที่สองคนจำไม่ตรงกันมาตลอด
      text: |
        {name}เล่าว่าวันนั้นใครพูดอะไรกับใครก่อน คำต่อคำ ทั้งร้านเงียบฟัง แล้วญาติคนที่แก่ที่สุดก็ตบโต๊ะหัวเราะ บอกว่า{pal}เล่าเรื่องนี้ให้ฟังทุกปี และในเรื่องของ{pal:เขา|นาง} คนที่พูดประโยคนั้นก่อนคือ{name}

        {name}บอกว่าไม่จริง ทั้งร้านยกจอกให้คนที่ไม่ได้อยู่เถียง
      effects: { hp: 1, flags: [spoke_for_a_friend] }
    - id: correct_the_story
      label: แก้เรื่องที่โต๊ะข้างๆ เล่าผิด
      habit: stubborn
      text: |
        เรื่องนั้นเกิดตอนหน้าหนาว ไม่ได้เกิดหน้าเกี่ยว และ{pal}ไม่ได้เป็นคนจ่ายค่าเหล้าคืนนั้น คนจ่ายคือ{name} โต๊ะข้างๆ ไม่ยอม บอกว่าฟังมาจากปากเจ้าตัว

        เถียงกันอยู่สองจอก จนญาติต้องมาห้าม แล้วบอกว่าถ้า{pal}ยังอยู่ก็คงนั่งดูอยู่ตรงมุมนั้น ไม่ห้ามใคร และไม่บอกว่าใครถูก
      effects: { flags: [argued_at_the_wake] }
    - id: drink_and_listen
      label: ส่ายหน้า ยกจอกขึ้น แล้วฟังของคนอื่นต่อ
      text: |
        ญาติไม่คะยั้นคะยอ เดินไปโต๊ะถัดไป {name}นั่งฟังจนร้านปิด ได้ยินเรื่องของ{pal}ที่ไม่เคยรู้มาก่อนสี่เรื่อง สองเรื่องในนั้นไม่น่าจะจริง

        ขากลับ{name}เดินอ้อมไปทางที่เคยเดินกลับด้วยกัน ช้ากว่าทางตรงอยู่ร้อยกว่าก้าว
      effects: { flags: [listened_at_the_wake] }

- id: elder.passing_rival
  stage: elder
  weight: 4
  mark: "{foe}จากไป"
  cast:
    foe: { bond: [rival], min_age: 68 }
  people: [{ id: "@foe", dies: true }]
  when:
    age: [60, 100]
  text: |
    ข่าวว่า{foe}ตายแล้วมาถึงโดยไม่มีใครตั้งใจส่ง {name}ได้ยินจากคนที่คุยกันอยู่ในตลาด สองคนนั้นไม่รู้ด้วยซ้ำว่าคนที่ยืนเลือกหัวหอมอยู่ข้างๆ เคยเป็นอะไรกับคนตาย

    งานศพมีพรุ่งนี้เช้า ห่างไปไม่ถึงครึ่งวันเดิน

    {name}ถือหัวหอมหัวเดิมอยู่ในมือนานจนคนขายถามว่าจะเอาหรือไม่เอา
  choices:
    - id: go_and_stand_back
      label: ไป แล้วยืนอยู่หลังสุด
      text: |
        ไม่มีใครในงานจำ{name}ได้ หรือถ้าจำได้ก็ไม่มีใครเดินมาทัก {name}ยืนพิงเสาอยู่หลังสุดจนคนเริ่มกลับ แล้วจึงเดินไปที่หลุม ดินยังไม่ทันยุบ

        {name}ยืนอยู่ตรงนั้นนานเท่ากับที่คนคนหนึ่งจะพูดอะไรได้สักสองสามประโยค ถ้ามีอะไรจะพูด แล้วก็กลับ
      effects: { flags: [stood_at_rivals_grave] }
    - id: go_and_say_it
      label: ไป แล้วบอกหน้าหลุมว่าเรื่องนั้น{foe:เขา|นาง}เป็นฝ่ายผิด
      habit: hot_headed
      text: |
        {name}รอจนคนกลับหมด แล้วพูดออกมาดังพอให้คนในหลุมได้ยินถ้ายังได้ยิน ว่าเรื่องนั้น{foe:เขา|นาง}ผิด ผิดตั้งแต่วันแรก และ{name}จำได้ทุกคำ

        สัปเหร่อที่กำลังเก็บพลั่วอยู่เงยหน้าขึ้นมอง แล้วบอกว่าเมื่อสองวันก่อน คนในหลุมก็ฝากไว้ประโยคเดียวกันนี้ ให้บอกถ้ามีใครมา
      effects: { alignment: { law: -1 }, flags: [had_the_last_word] }
    - id: buy_the_onion
      label: จ่ายค่าหัวหอม แล้วกลับบ้าน
      habit: cold_blood
      text: |
        {name}ไม่ได้ไป เช้าวันงานก็ทำอย่างที่ทำทุกเช้า

        แต่หลายปีที่ผ่านมา มีเรื่องอยู่เรื่องหนึ่งที่{name}เล่าให้คนอื่นฟังทุกครั้งที่มีโอกาส เรื่องที่{foe}ทำไว้ หลังวันนั้น{name}ก็ไม่ได้เล่าเรื่องนั้นอีก ไม่มีใครถามว่าทำไม
      effects: { flags: [skipped_rivals_funeral] }

- id: adult.passing_mentor
  stage: adult
  weight: 5
  mark: "{teacher}จากไป"
  cast:
    teacher: { bond: [mentor], min_age: 65 }
  people: [{ id: "@teacher", dies: true }]
  when:
    age: [41, 80]
  text: |
    คนเดินจดหมายเอาห่อผ้าเล็กๆ มาส่งให้{name} พร้อมข่าวที่เขาบอกด้วยปาก เพราะไม่มีใครเขียนมา {teacher}ตายแล้วเมื่อต้นเดือน ไปอย่างสงบ ของในห่อนี้แกสั่งไว้ว่าให้ส่งถึงมือ

    ในห่อมีเหรียญทองแดงเหรียญเดียว กับกระดาษพับสี่ทบ ลายมือของ{teacher}เอียงขวาเหมือนเดิม แต่สั่นขึ้น

    "ที่ยืมไว้ ปีนั้น ค่าขนมปัง ข้าไม่ได้ลืม ข้าแค่รอดูว่าเอ็งจะกล้าทวงไหม"
  choices:
    - id: keep_the_coin
      label: เก็บเหรียญนั้นไว้ ไม่ใช้
      text: |
        {name}จำไม่ได้ด้วยซ้ำว่าปีไหน หรือขนมปังอะไร แต่{teacher}จำได้ และจำมาตลอดหลายสิบปี

        เหรียญนั้นอยู่ในกระเป๋าเสื้อด้านในของ{name} แยกจากเหรียญอื่น มีอยู่หลายครั้งที่เงินขาดไปหนึ่งเหรียญพอดี {name}ก็ยังไม่ได้ควักออกมา
      effects: { flags: [kept_teachers_coin] }
    - id: buy_bread
      label: เอาไปซื้อขนมปัง กินให้แก
      text: |
        หนึ่งเหรียญทองแดงเดี๋ยวนี้ซื้อได้แค่ครึ่งก้อน {name}บอกคนขายว่าเมื่อก่อนได้ทั้งก้อน คนขายว่าเมื่อก่อนของ{ลุง|ป้า}นั่นกี่สิบปีแล้ว

        {name}นั่งกินตรงขั้นบันไดหน้าร้าน ทีละคำ จนหมดครึ่งก้อน หนี้ก้อนนี้นับว่าใช้กันแล้ว ทั้งสองฝ่าย
      effects: { hp: 1, flags: [ate_teachers_bread] }
    - id: return_it
      label: ฝากคนเดินจดหมายเอาเหรียญไปวางคืนที่หลุมของแก
      habit: stubborn
      text: |
        {name}เขียนกลับไปด้านหลังกระดาษแผ่นเดิม "ไม่ได้ให้ยืม ให้เลย" พับสี่ทบตามรอยเดิม ห่อกลับไปพร้อมเหรียญ จ่ายค่าเดินจดหมายไปสองเหรียญ เพื่อส่งคืนหนึ่งเหรียญ

        คนเดินจดหมายกลับมาบอกทีหลังว่าวางให้แล้ว บนหินหัวหลุม เดือนต่อมาเขาผ่านไปอีกรอบ เหรียญยังอยู่ที่เดิม ไม่มีใครกล้าหยิบ
      effects: { gold: -2, flags: [returned_teachers_coin] }

# ===================== คนในละแวก คนรุ่นเดียวกัน =====================

- id: adult.passing_neighbor_aunt
  stage: adult
  scene: home
  weight: 8
  when:
    age: [41, 58]
    flags: [married]
  text: |
    ป้าข้างบ้านตายเมื่อคืน คนที่เคยถามทุกครั้งที่เจอหน้าว่าเมื่อไรจะแต่ง พอแต่งแล้วก็หาเรื่องอื่นมาถามแทนได้ทุกปี ไม่เคยหมด

    นางไม่มีลูก ไม่มีหลาน คนทั้งถนนช่วยกันจัดงาน ร่างของนางนอนอยู่บนโต๊ะในห้องหน้าบ้าน ห้องที่นางใช้นั่งมองถนนมาสี่สิบปี หน้าต่างบานนั้นยังเปิดอยู่

    บนหิ้งเหนือหัวนางมีขวดน้ำมันเรียงกันเจ็ดขวด แต่ละขวดผูกป้ายชื่อคู่แต่งงานของถนนนี้ไว้ที่คอ ขวดที่สามเป็นชื่อของ{name}กับ{partner} นางเก็บน้ำมันที่เหลือจากชามไฟวันแต่งของทุกคู่ไว้ โดยไม่เคยบอกใคร
  choices:
    - id: light_her_way
      label: เอาชามไฟวันแต่งมาจุดให้นาง ด้วยน้ำมันขวดนั้น
      requires: { item: wedding_clay_bowl }
      text: |
        {partner}เป็นคนถือชาม {name}เป็นคนเท น้ำมันเก่าจนข้น ติดไฟช้า แต่ติด เปลวสีเข้มกว่าน้ำมันใหม่

        สองคนวางชามไว้ที่ปลายเท้านาง คู่อื่นในถนนเห็นเข้าก็กลับไปเอาชามของตัวเองมาบ้าง ก่อนเที่ยงคืนมีชามไฟเรียงอยู่รอบโต๊ะหกใบ คู่ที่เจ็ดเลิกกันไปแล้ว แต่ก็มาทั้งคู่ ยืนคนละฝั่งห้อง
      effects: { alignment: { moral: 1 }, flags: [lit_the_aunts_way] }
    - id: answer_her
      label: บอกนางเรื่องที่นางถามค้างไว้ครั้งสุดท้าย
      text: |
        สัปดาห์ก่อนนางถามข้ามรั้วมาว่าหลังคาบ้านที่รั่วซ่อมหรือยัง {name}ตอบส่งๆ ไปว่าเดี๋ยวซ่อม คืนนี้{name}ยืนอยู่ข้างโต๊ะ แล้วบอกนางว่าซ่อมแล้ว เมื่อวานซืน ใช้กระเบื้องสี่แผ่น

        หญิงที่นั่งเฝ้าอยู่อีกฝั่งโต๊ะเงยหน้าขึ้นมอง แล้วบอกเรื่องของตัวเองบ้าง ว่าลูกสาวหายไข้แล้ว นางถามถึงเมื่อสามวันก่อน คืนนั้นคนทั้งถนนผลัดกันเข้ามารายงาน
      effects: { flags: [answered_the_aunt] }
    - id: take_her_window
      label: รับขวดน้ำมันทั้งเจ็ดมาเก็บต่อ
      habit: soft_heart
      text: |
        ไม่มีใครในถนนอยากได้ ทุกคนบอกว่าเป็นของที่ต้องมีคนเก็บ แต่ไม่ใช่ตัวเอง {name}ยกลงมาทีละขวด เอาไปเรียงไว้บนหิ้งที่บ้าน

        ปีถัดมาลูกสาวคนทำขนมปังแต่งงาน เช้าวันรุ่งขึ้น{name}เดินไปเคาะประตูบ้านคู่นั้น ถือขวดเปล่าไปด้วยใบหนึ่ง แล้วถามว่าน้ำมันในชามเมื่อวานเหลือไหม
      effects: { flags: [keeps_the_seven_bottles] }

- id: elder.passing_age_mates
  stage: elder
  scene: tavern
  weight: 8
  when:
    age: [66, 92]
  text: |
    ม้านั่งยาวหน้าร้านเหล้าเคยนั่งกันหกคน ทุกบ่ายวันตลาด คนรุ่นเดียวกับ{name}ทั้งนั้น นั่งเรียงตามลำดับที่มาถึงครั้งแรกเมื่อหลายสิบปีก่อน และไม่เคยมีใครสลับที่

    ปีก่อนเหลือสี่ ปีนี้เหลือสอง บ่ายนี้{name}มาถึงแล้วเห็นว่าเหลือหนึ่ง คือตัวเอง อีกคนลูกหลานมารับไปอยู่ถิ่นอื่นเมื่อต้นเดือน ไม่ได้ตาย แต่สำหรับม้านั่งตัวนี้ก็ไม่ต่างกัน

    เจ้าของร้านยังยกเหล้ามาวางให้ตรงที่เดิม ที่ของ{name}คือที่ที่สามนับจากประตู ซ้ายขวาว่างข้างละสองที่กับสามที่
  choices:
    - id: keep_the_seat
      label: นั่งที่เดิม ที่ที่สามนับจากประตู
      habit: stubborn
      text: |
        {name}นั่งลงตรงที่ของตัวเอง ไม่ขยับไปชิดประตู ไม่ขยับไปชิดผนัง ดื่มช้าเท่าเดิม มองถนนมุมเดิม

        คนหนุ่มสามคนเดินมาจะนั่ง เห็นที่ว่างซ้ายขวาก็ชะงัก แล้วไปนั่งโต๊ะข้างใน เจ้าของร้านไม่ได้ว่าอะไร ร้านนี้ขาดทุนค่าม้านั่งหนึ่งตัวทุกบ่ายวันตลาดมาตั้งแต่วันนั้น
      effects: { flags: [keeps_the_bench] }
    - id: wave_them_over
      label: กวักมือเรียกคนหนุ่มโต๊ะข้างในมานั่งด้วย
      text: |
        คนหนุ่มสามคนมานั่งอย่างเกรงๆ คนหนึ่งนั่งลงตรงที่ของคนที่ตายไปเมื่อสองปีก่อน {name}ไม่ได้บอก

        สามคนนั้นคุยกันเรื่องที่{name}ฟังไม่ทันครึ่งหนึ่ง แต่ทุกคนหันมาถามความเห็นเป็นระยะตามมารยาท พอถึงจอกที่สองก็เลิกถามตามมารยาท เริ่มถามจริง วันตลาดถัดมาสามคนนั้นมาก่อน{name} และเว้นที่ที่สามไว้ให้
      effects: { hp: 1, flags: [shares_the_bench] }
    - id: carve_the_names
      label: ขอยืมมีดเจ้าของร้าน สลักชื่อทั้งหกลงบนม้านั่ง
      habit: craft_hands
      text: |
        {name}สลักทีละชื่อ ตรงที่ของแต่ละคน ชื่อละครึ่งบ่าย มือไม่นิ่งเหมือนก่อน ตัวอักษรจึงเบี้ยว แต่อ่านออก ชื่อตัวเองสลักเป็นชื่อสุดท้าย ตรงที่ที่สาม

        เจ้าของร้านมายืนดูตอนเสร็จ แล้วถามว่าของตัวเองไม่ใส่ปีหรือ {name}ว่ายัง ให้คนอื่นมาใส่
      effects: { flags: [carved_the_bench] }

# ===================== รำลึก =====================

- id: elder.remember_parent
  stage: elder
  scene: home
  weight: 6
  cast:
    gone: { kin: [father, mother], alive: false }
  when:
    age: [45, 85]
  text: |
    {name}กำลังพับผ้าอยู่ แล้วก็หยุดมือ

    ผ้าพับเป็นสามส่วน แล้วทบครึ่ง แล้วใช้สันมือรีดตามรอยพับหนึ่งที แบบเดียวกับที่{gone}ทำ ทุกขั้น รวมทั้งทีที่ใช้สันมือรีด ซึ่งไม่ได้ช่วยอะไร {name}ไม่เคยตั้งใจเรียน และจำไม่ได้ว่าเริ่มทำแบบนี้ตั้งแต่เมื่อไร

    ในกระจกบานเล็กบนฝา คนที่ยืนพับผ้าอยู่อายุมากกว่า{gone}ในความทรงจำแรกของ{name}ไปหลายปีแล้ว
  choices:
    - id: fold_it_their_way
      label: พับต่อให้เสร็จ แบบเดิมทุกขั้น
      text: |
        {name}พับจนหมดตะกร้า ทุกผืนรีดด้วยสันมือหนึ่งที กองผ้าออกมาเท่ากันทุกผืน ขอบตรงกันเหมือนอิฐ

        ถ้า{gone}มาเห็นคงจะรื้อออกมาพับใหม่สักสองผืน แล้วบอกว่ายังไม่ตรง {gone:เขา|นาง}เป็นคนแบบนั้น
      effects: { flags: [folds_like_them] }
    - id: say_their_words
      label: พูดประโยคที่{gone}ชอบพูดออกมาดังๆ ดูว่าเสียงเหมือนไหม
      text: |
        ประโยคนั้น{name}เคยรำคาญที่สุดตอนอายุสิบห้า ว่าของที่ทำครึ่งเดียวคือของที่ต้องทำสองรอบ พูดออกมาในบ้านที่ไม่มีใครฟัง เสียงเหมือนกว่าที่คิด เหมือนจนต้องหันไปดูข้างหลัง

        วันต่อมา{name}พูดประโยคนี้ใส่เด็กข้างบ้านที่กวาดถนนไว้ครึ่งเดียว เด็กทำหน้าแบบเดียวกับที่{name}เคยทำ
      effects: { flags: [speaks_like_them] }
    - id: fold_it_wrong
      label: คลี่ออก แล้วพับใหม่ให้ไม่เหมือน
      habit: stubborn
      text: |
        {name}พับเป็นสี่ส่วน ไม่ทบครึ่ง ไม่รีด กองผ้าออกมาเอียง สูงไม่เท่ากัน ล้มไปหนึ่งกองตอนยกไปเก็บ

        สัปดาห์ถัดมามือก็กลับไปพับเป็นสามส่วนเองโดยไม่ได้ถามเจ้าของ ไปรู้ตัวเอาตอนสันมือรีดลงบนรอยพับ
      effects: { flags: [folds_like_them] }

- id: elder.remember_partner
  stage: elder
  scene: home
  weight: 6
  cast:
    gone: { id: partner, alive: false }
  when:
    age: [42, 92]
    flags: [partner_died]
  text: |
    {name}ตักแกงใส่ชามสองใบ ยกมาวางบนโต๊ะ นั่งลง หยิบช้อน แล้วจึงเห็นชามใบที่สอง

    {gone}ตายไปนานพอที่เรื่องแบบนี้ควรจะเลิกเกิดแล้ว ส่วนใหญ่ก็เลิกแล้ว แต่มือยังจำได้ดีกว่าหัว ชามใบที่สองตักมาน้อยกว่า ไม่ใส่ผักชี อย่างที่{gone:เขา|เธอ}กิน

    ไอขึ้นจากชามทั้งสองใบเท่ากัน
  choices:
    - id: eat_both
      label: กินของตัวเองหมด แล้วกินชามนั้นต่อ
      text: |
        แกงที่ไม่ใส่ผักชีจืดกว่าที่{name}ชอบ จืดแบบที่เคยเถียงกันมาหลายสิบปีว่าใครลิ้นเสีย {name}กินจนหมด เช็ดก้นชามด้วยขนมปัง อย่างที่{gone}ทำ ทั้งที่{name}เคยบอกว่าน่าเกลียด

        อิ่มเกินไปจนนอนไม่หลับ ต้องลุกมาเดินรอบบ้านตอนดึก เดินผ่านเตียงฝั่งที่ว่างสองรอบ
      effects: { hp: 1, flags: [ate_for_two] }
    - id: take_it_next_door
      label: ยกชามนั้นไปให้บ้านข้างๆ
      habit: soft_heart
      text: |
        บ้านข้างๆ มีลูกห้าคน ชามเดียวหายไปก่อนที่{name}จะเดินกลับถึงประตู เด็กคนเล็กสุดวิ่งเอาชามเปล่ามาคืน ล้างมาแล้วด้วย ล้างไม่สะอาด

        ตั้งแต่วันนั้น ถ้าเผลอตักมาสองชามอีก {name}ก็รู้ว่าต้องเอาไปไหน เดือนหนึ่งเผลอสักสองครั้ง เด็กบ้านนั้นเริ่มมายืนรอที่รั้วตอนได้กลิ่น
      effects: { alignment: { moral: 1 }, flags: [second_bowl_next_door] }
    - id: leave_it
      label: ปล่อยไว้บนโต๊ะอย่างนั้นจนเย็น
      text: |
        {name}กินของตัวเองช้าๆ ตรงข้ามชามใบนั้น ไม่ได้พูดอะไรกับชามใบนั้น คนแก่ที่พูดกับชามแกงคือคนที่เพื่อนบ้านจะเริ่มแวะมาดูบ่อยขึ้น

        แกงเย็นจนไขมันจับเป็นแผ่น ตอนล้างชาม{name}ล้างใบนั้นก่อน เก็บเข้าที่เดิมบนชั้น ซ้อนอยู่ใต้ใบของตัวเอง
      effects: { flags: [set_two_bowls] }

# ===================== ลูกคนที่สอง =====================

- id: adult.life_second_child
  stage: adult
  scene: home
  weight: 30
  mark: "{newborn}เกิด"
  cast:
    first: { kin: [child], min_age: 2, max_age: 9, pick: eldest }
  when:
    age: [28, 42]
    flags: [married, has_child]
    not_flags: [child_horned]
  text: |
    หมอตำแยมาตั้งแต่หัวค่ำ ไล่ทุกคนออกจากห้อง ยกเว้นคนที่ต้องอยู่ {first}ถูกส่งไปนอนบ้านข้างๆ แล้วก็เดินกลับมาเองสามรอบ รอบที่สามไม่มีใครมีแรงพากลับไปอีก

    ลูกคนที่สองออกมาตอนใกล้รุ่ง เร็วกว่าคนแรกครึ่งคืน ร้องดังกว่าด้วย หมอตำแยห่อผ้าแล้วส่งให้ บอกว่าแข็งแรงดี ปอดดี จะไม่มีใครในบ้านนี้ได้นอนไปอีกครึ่งปี

    {first}ยืนเกาะขอบประตู ยังไม่ยอมเข้ามา มองห่อผ้าเหมือนมองของที่มีคนเอามาวางผิดบ้าน
  choices:
    - id: let_first_hold
      label: "เรียก{first}มานั่ง แล้ววางน้องลงบนตัก"
      text: |
        {first}นั่งตัวแข็ง แขนสองข้างกางรับเหมือนถือถาดน้ำ ทารกหยุดร้องไปชั่วอึดใจ ลืมตามองหน้าคนที่อุ้ม แล้วร้องต่อ ดังกว่าเดิม

        "น้องไม่ชอบหนู" {first}ว่า {name}บอกว่าตอน{first:เขา|เธอ}เกิดก็ร้องแบบนี้ใส่ทุกคน {first}คิดอยู่นาน แล้วถามว่าร้องนานแค่ไหน
      effects:
        child: {}
        flags: [second_child]
        people: [{ id: "@first", closeness: 1 }]
    - id: name_by_first
      label: "ถาม{first}ว่าอยากให้น้องชื่ออะไร"
      text: |
        {first}เสนอชื่อหมาของบ้านข้างๆ ก่อน แล้วก็ชื่อคนขายขนม แล้วก็ชื่อตัวเอง {partner}หัวเราะจนหมอตำแยต้องดุว่าเดี๋ยวแผลแตก

        ชื่อที่ใช้จริงสองคนเลือกกันเองตอนเช้า แต่{first}เรียกน้องด้วยชื่อหมาไปอีกเกือบปี จนน้องหันตามชื่อนั้นก่อนชื่อตัวเอง
      effects: { child: {}, flags: [second_child] }
    - id: sleep_at_last
      label: ส่งทารกให้{partner} แล้วพา{first}ไปนอน
      text: |
        {first}ไม่ยอมนอนเตียงตัวเอง ต้องนอนเบียดกันบนเตียงเล็ก ขาห้อยออกไปครึ่งแข้ง ก่อนหลับ{first:เขา|เธอ}ถามว่าของเล่นต้องแบ่งด้วยไหม {name}บอกว่ายังไม่ต้อง น้องยังจับอะไรไม่เป็น

        "งั้นซ่อนไว้ก่อนได้ใช่ไหม" {first}ว่า แล้วก็หลับไปก่อนจะได้คำตอบ เช้ามาม้าไม้ตัวเล็กหายไปจากหิ้ง ไปเจออีกทีในถังแป้ง
