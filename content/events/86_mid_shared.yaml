# ชุด 3b–3c วัยผู้ใหญ่ อายุ 25 ถึง 40: เหตุการณ์ชีวิตร่วมทุกต้นกำเนิด น้ำหนัก 10
# ครอบครัว (L16): คนรักใหม่ตั้ง has_partner · ขอแต่งตั้ง married (แต่งได้ครั้งเดียว) · ลูกคนแรกตั้ง has_child
#   ลูกธรรมดา (น้ำหนัก 25) กับลูกมีเขา (น้ำหนัก 5) แข่งกัน ลูกมีเขาตั้ง child_horned และทางที่เลือก
#   child_horns_sawn (เลื่อยเขา) child_hidden (ซ่อน ไม่ลงสมุดวิหาร) child_horns_kept (ลงสมุดตามที่เห็น)
# ลูกคนแรกเป็นคนจริงในผัง (effects.child) ชื่อและเพศสุ่ม ใช้ {child} {c:เขา|เธอ} ได้ในเหตุการณ์ที่มี has_child ลูกเรียกตัวเองว่า หนู
# คู่ครองเพศใดก็ได้ ใช้ {partner} {p:เขา|เธอ} เท่านั้น
# คู่ครองจากไป (adult.life_partner_gone) ล้าง has_partner กับ married แล้วตั้ง partner_died ไม่ได้ตายเพราะการทอยของผู้เล่น
# งานศพคนที่เลี้ยงมา: เด็กวิหารคือแม่ชีโทเรน · origin_marked_hidden คือท่านย่า · ที่เหลือคือ {mother} แยกฉบับคนแคระกับเอลฟ์
# ห้ามใช้ {father} ในไฟล์นี้ ไฟล์นี้ไม่มี die

# ===================== 3b อายุ 25 ถึง 32 =====================

- id: adult.life_new_love
  stage: adult
  scene: market
  weight: 35
  when:
    age: [25, 38]
    not_flags: [has_partner]
  text: |
    เตาอบรวมของถิ่นเปิดให้ใช้ทุกเช้าวันพักงาน ใครมีแป้งก็เอามาอบ ค่าฟืนหารกันตามจำนวนถาด คนมาต่อคิวตั้งแต่ฟ้ายังไม่สาง ส่วนใหญ่เป็นคนที่ไม่มีเตาในห้องเช่า {name}อบขนมปังที่นี่มาหลายปี ปีนี้เพิ่งสังเกตว่ามีสองคนที่มาตรงกับ{name}ทุกเช้า

    คนหนึ่งเป็นผู้ชายที่แบกแป้งมาเยอะจนคนคนเดียวกินไม่หมด อบเสร็จแล้วเอาก้อนที่เกินห่อผ้า ไปวางไว้หน้าประตูบ้านคนแก่ตามทางกลับ อีกคนเป็นผู้หญิงที่ไม่ได้มาอบอะไรเลย เธอมาตอกบานพับประตูเตาที่หลุดทุกสัปดาห์ หน้ามอมเขม่าตั้งแต่จมูกลงไปถึงคาง ไม่มีใครจ้าง เธอบอกว่ารำคาญเสียงประตูเอี๊ยด
  choices:
    - id: carry_loaves
      label: ช่วยเขาแบกขนมปังที่เหลือไปวางตามประตูบ้าน
      habit: soft_heart
      text: |
        ขนมปังที่เกินมามีเจ็ดก้อน ห่อผ้าเจ็ดห่อ บ้านคนแก่เจ็ดหลังตามทางที่เขาเดินกลับ {name}แบกสี่ห่อ เขาแบกสาม ทุกประตูเขาเคาะสองที แล้วรีบเดินต่อก่อนคนข้างในจะทันเปิด

        ประตูสุดท้ายเป็นบ้านของเขาเอง เขาหยุดตรงนั้น บอกว่าชื่อ{partner} บ้านนี้ก็มีคนแก่อยู่หนึ่งคน คือแม่ของเขา แล้วถามว่าวันพักงานหน้า{name}จะมาอบตอนฟ้ายังมืดเหมือนเดิมไหม
      effects: { partner: { gender: m }, stats: { STR: 1 }, flags: [has_partner, partner_oven_bread] }
    - id: hold_the_door
      label: ยกประตูเตาค้างไว้ให้เธอตอกบานพับ
      habit: craft_hands
      text: |
        ประตูเตาเป็นเหล็กหล่อ ร้อนจนต้องจับผ่านผ้าเปียก {name}ยกไว้ให้ตรงร่อง เธอตอกหมุดทีละตัว ตอกไปบ่นไป ว่าคนที่ทำบานพับแบบนี้ควรมายืนยกประตูเองสักเช้า

        หมุดตัวสุดท้ายลง เธอเปิดปิดประตูเตาสามรอบ ไม่มีเสียงเอี๊ยด แล้วเช็ดมือกับผ้ากันเปื้อน ยื่นมือที่ยังดำอยู่มาให้จับ บอกว่าชื่อ{partner} บานพับนี้จะหลุดอีกในสามสัปดาห์ ถ้าอยากรู้ว่าทำไม มายกให้อีกก็ได้
      effects: { partner: { gender: f }, stats: { DEX: 1 }, flags: [has_partner, partner_oven_hinge] }
    - id: bake_alone
      label: อบของตัวเองให้เสร็จ แล้วกลับก่อนคิวหลังจะมา
      text: |
        {name}อบเสร็จก่อนแดดออก ห่อขนมปังกลับบ้าน ไม่ได้รอดูว่าใครจะแบกอะไรไปวางหน้าประตูไหน หรือใครจะตอกหมุดตัวไหน

        ขนมปังเช้านั้นสุกพอดีทั้งก้อน กินคนเดียวได้สามวัน วันที่สามแข็งจนต้องจุ่มน้ำแกง
      effects: { stats: { CON: 1 }, flags: [chose_alone_mid] }

- id: adult.life_proposal
  stage: adult
  scene: home
  weight: 60
  when:
    age: [23, 40]
    flags: [has_partner]
    not_flags: [married, stays_unwed]
  text: |
    {name}กับ{partner}อยู่ด้วยกันมาหลายปี จนชามสองใบบนชั้นในครัววางซ้อนกันเป็นตั้งเดียวโดยไม่มีใครต้องคิด คนรอบบ้านเลิกถามแล้วว่าเมื่อไร เหลือแต่ป้าข้างบ้านที่ยังถามทุกครั้งที่เจอหน้า

    งานแต่งทำกันแบบเดียวกันมาตั้งแต่ก่อนมีตะเกียงฟ้า คนสองคนถือชามไฟดินเผาใบเดียวกันคนละข้าง เดินจากหน้าแท่นในวิหารไปจนถึงประตู ถ้าน้ำมันในชามหกระหว่างทาง แขกจะหัวเราะ แล้วบอกว่าบ้านนี้จะแย่งผ้าห่มกันไปจนแก่ เย็นนั้น{partner}ล้างชามอยู่ข้างๆ {name} แล้วถามขึ้นมาเฉยๆ ว่าชามดินเผาที่ตลาดใบหนึ่งราคาเท่าไร
  choices:
    - id: one_bowl
      label: บอกราคา แล้วถามกลับว่าจะซื้อใบเดียวหรือสองใบ
      text: |
        {partner}เช็ดมือกับผ้า หันมาตอบว่าใบเดียว ใบใหญ่หน่อย จะได้ไม่หก

        งานแต่งจัดที่วิหารประจำถิ่นเช้าวันพักงานถัดมา แขกสิบกว่าคน ชามใบนั้นหนักจนต้องประคองด้วยสองมือทั้งสองคน น้ำมันหกลงขั้นบันไดหน้าประตูหยดเดียว ป้าข้างบ้านเห็นเป็นคนแรก หัวเราะลั่นวิหาร แล้วร้องไห้ต่อทันที
      effects: { mark: "แต่งงานกับ{partner}", items: [wedding_clay_bowl], alignment: { law: 1 }, flags: [married] }
    - id: big_feast
      label: จ่ายแปดเหรียญ จัดเลี้ยงทั้งถิ่นหลังพิธี
      requires: { min_gold: 8 }
      text: |
        แปดเหรียญซื้อหมูได้หนึ่งตัว เหล้าสองไห กับขนมปังจากเตาอบรวมพอแจกทุกบ้าน งานเลี้ยงต่อจากพิธีไปจนดึก คนที่{name}ไม่รู้จักชื่อมาจับมืออวยพรหลายสิบคน บางคนจับสองรอบเพราะจำไม่ได้ว่าจับแล้ว

        ชามไฟใบนั้นวางอยู่กลางโต๊ะยาวทั้งคืน ไฟไม่ดับ เพราะมีคนเติมน้ำมันให้ทุกครั้งที่เดินผ่าน ตอนฟ้าสาง{partner}หลับคาโต๊ะ มือข้างหนึ่งยังจับขอบชามไว้
      effects: { mark: "แต่งงานกับ{partner}", gold: -8, items: [wedding_clay_bowl], flags: [married, wedding_feast] }
    - id: carry_steady
      label: แต่งที่วิหาร แล้วตั้งใจถือชามให้ถึงประตูโดยไม่หกสักหยด
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}เดินช้าจน{partner}ต้องกระซิบให้เร็วขึ้น ไม่มีน้ำมันหยดไหนเลยขอบชาม จากหน้าแท่นถึงประตูวิหาร แขกยืนรอให้หกตลอดทาง พอถึงประตูแล้วชามยังเต็ม ทั้งวิหารเงียบไปพักหนึ่ง

          ป้าข้างบ้านบ่นเสียงดังว่าบ้านนี้จะเงียบจนน่าเบื่อไปถึงแก่ {partner}หัวเราะจนชามเอียง น้ำมันหกลงบนรองเท้าของ{name}ตรงหน้าประตูพอดี แขกปรบมือกันทั้งวิหาร
        effects: { mark: "แต่งงานกับ{partner}", stats: { DEX: 1 }, items: [wedding_clay_bowl], flags: [married] }
      failure:
        text: |
          ก้าวที่สามจากแท่น {name}เหยียบชายเสื้อตัวเอง น้ำมันหกออกครึ่งชาม ไฟเลียแขนเสื้อขึ้นมาวูบหนึ่งก่อนจะดับเอง แขกหัวเราะจนนักบวชต้องรอให้เงียบถึงจะพูดต่อได้

          ป้าข้างบ้านบอกว่าหกครึ่งชามแปลว่าแย่งผ้าห่มกันครึ่งคืน อีกครึ่งคืนกอดกันนอน {partner}เติมน้ำมันลงชามให้เต็มใหม่ แล้วเดินที่เหลือไปจนถึงประตูโดยจับมือ{name}ไว้แทนขอบชาม
        effects: { mark: "แต่งงานกับ{partner}", items: [wedding_clay_bowl], flags: [married, spilled_wedding_bowl] }
    - id: no_bowl
      label: บอกว่าอยู่กันแบบนี้ก็พอ ไม่ต้องมีชาม ไม่ต้องมีวิหาร
      text: |
        {partner}ล้างชามใบสุดท้ายจนเสร็จ วางคว่ำบนชั้น แล้วบอกว่าก็ได้ ถามเฉยๆ ไม่ได้อยากรู้ราคาจริงจัง

        หน้าหนาวปีนั้นสองคนยังแย่งผ้าห่มผืนเดียวกันเหมือนเดิม ป้าข้างบ้านยังถามเหมือนเดิม {partner}เป็นคนตอบแทนทุกครั้ง ว่ารอให้ป้าตายก่อน จะได้ไม่ต้องเชิญ
      effects: { alignment: { law: -1 }, flags: [stays_unwed] }

- id: adult.life_first_child
  stage: adult
  scene: home
  weight: 70
  when:
    age: [24, 41]
    flags: [married]
    not_flags: [has_child]
  text: |
    ลูกคนแรกของ{name}กับ{partner}มาถึงบ้านตอนปลายหน้าฝน ตัวเท่าแมวโต ร้องเสียงแหลมจนผนังบ้านกั้นไม่อยู่ คนบ้านติดกันเคาะผนังคืนแรก คืนที่สองเคาะเบาลง คืนที่สามเอาซุปไก่หม้อหนึ่งมาวางไว้หน้าประตู

    เปลในบ้านยืมมาจากบ้านที่ลูกโตไปแล้ว โยกได้ข้างเดียว อีกข้างขาสั้นกว่า ต้องหนุนด้วยรองเท้าเก่า สามคืนแรกไม่มีใครในบ้านได้หลับเกินครั้งละชั่วยาม
  choices:
    - id: split_nights
      label: ผลัดกับ{partner}คนละครึ่งคืน
      text: |
        {name}เอาครึ่งคืนหลัง ตั้งแต่ไก่ขันรอบแรกจนสว่าง ช่วงนั้น{child}ร้องน้อยที่สุดแต่ตื่นบ่อยที่สุด ไม่ถึงเจ็ดคืน{name}ก็แยกได้ว่าเสียงร้องแบบไหนคือหิว แบบไหนคือเปียก แบบไหนคืออยากให้มีคนอุ้มเฉยๆ

        กลางวันไปทำงาน {name}ยืนโยกตัวไปมาตอนรอคำสั่ง คนข้างๆ ทักว่าโยกอะไร {name}ก้มลงดูตัวเอง แล้วหยุดโยก
      effects: { mark: "{child}เกิด", stats: { CON: 1 }, child: {}, flags: [has_child] }
    - id: fix_cradle
      label: เลื่อยขาเปลข้างที่ยาวให้เท่ากัน
      habit: craft_hands
      text: |
        {name}กะความยาวขาเปลสามรอบ ขีดเส้นด้วยถ่าน แล้วเลื่อยครั้งเดียว ขาที่เคยยาวกลายเป็นสั้นกว่าอีกข้างเท่าเล็บมือ {name}เลื่อยอีกข้างตาม แล้วก็ต้องเลื่อยข้างแรกอีกรอบ

        พอโยกได้เท่ากันทั้งสองข้าง เปลเตี้ยลงหนึ่งฝ่ามือ {child}หลับในเปลนั้นได้ครั้งละสองชั่วยามเป็นครั้งแรก {partner}เก็บรองเท้าเก่าคู่นั้นไปทิ้ง
      effects: { mark: "{child}เกิด", stats: { DEX: 1 }, child: {}, flags: [has_child] }
    - id: buy_bell
      label: จ่ายสองเหรียญซื้อกระดิ่งทองเหลืองลูกเล็กมาแขวนหัวเปล
      requires: { min_gold: 2 }
      text: |
        คนแก่บอกกันมาว่ากระดิ่งหัวเปลทำให้แม่อีเซลรู้ว่าห้องไหนมีเด็กเกิดใหม่ {name}ไม่แน่ใจว่าเชื่อ แต่จ่ายสองเหรียญให้ร้านทองเหลืองหลังตลาด ได้กระดิ่งลูกเท่าหัวแม่มือ ผูกเชือกแดง

        กระดิ่งดังทุกครั้งที่เปลโยก {child}ชอบเสียงนั้นจนต้องโยกให้ดังตลอด คืนไหนลมพัดเข้าหน้าต่าง กระดิ่งดังเอง ลูกหลับต่อได้โดยไม่มีใครต้องลุก
      effects: { mark: "{child}เกิด", gold: -2, items: [cradle_bell], child: {}, flags: [has_child] }
    - id: name_for_carer
      label: เขียนชื่อลูกลงแผ่นไม้ ตอกไว้เหนือเปล
      text: |
        {partner}ถามว่าแน่ใจไหม ชื่อนี้คนในถิ่นจะเรียกลูกไปทั้งชีวิต {name}บอกว่าแน่ใจ แล้วเขียนคำว่า {child} ลงบนแผ่นไม้ ตอกไว้เหนือเปล ลายมือเบี้ยวเพราะมือยังสั่นจากที่อดนอน

        เดือนแรก{name}เรียกชื่อนั้นแล้วสะดุ้งเองทุกครั้ง เดือนที่สามเรียกได้โดยไม่สะดุ้ง {child}หันมาตามเสียงเรียกเป็นครั้งแรก
      effects: { mark: "{child}เกิด", alignment: { moral: 1 }, child: {}, flags: [has_child, child_name_board] }

- id: adult.life_first_child_horned
  stage: adult
  scene: home
  weight: 14
  when:
    age: [24, 41]
    flags: [married]
    not_flags: [has_child]
  text: |
    ลูกคนแรกของ{name}กับ{partner}มาถึงบ้านตอนปลายหน้าฝน ตัวเล็ก ร้องเสียงดี กินเก่ง สองวันแรกบ้านทั้งหลังมีแต่เสียงร้องกับกลิ่นนมเปรี้ยว

    เช้าวันที่สาม {partner}อาบน้ำให้ลูกในกะละมังแล้วเงียบไป มือที่ลูบหัวลูกหยุดค้างอยู่ที่เดิม {name}เดินไปดู ใต้ผมอ่อนที่เปียกแนบหนังหัว มีตุ่มแข็งสองตุ่มเท่าปลายนิ้วก้อย ในน้ำอุ่นมีหางเส้นเล็กๆ ส่ายไปมาใต้ผิวน้ำ

    ท้ายเดือนนี้วิหารประจำถิ่นจะเปิดสมุดลงชื่อเด็กเกิดใหม่ ศาสนจักรตะเกียงไม่รับเด็กมีเขาเข้าพิธีอวยพร และส่งคนมาอ่านหน้าผู้ต้องตราในสมุดเล่มนั้นทุกห้าปี
  choices:
    - id: open_the_case
      label: เปิดกล่องเลื่อยเงินของท่านย่า
      requires: { item: silver_saw_case }
      text: |
        เลื่อยเงินยังนอนอยู่ในร่องกำมะหยี่ ร่องนั้นยุบตามรูปของมันมาหลายสิบปี {name}ทำตามที่ท่านย่าบอกไว้ ทำก่อนเด็กจะจำอะไรได้ {partner}อุ้ม{child}ไว้บนตัก จับหัวไว้ให้นิ่ง ลูกร้องตอนข้างซ้าย แล้วหลับไปก่อนข้างขวาจะเสร็จ

        ท้ายเดือน{name}บอกเสมียนวิหารว่าลูกเป็นมนุษย์ เสมียนเขียนตามนั้นโดยไม่เงยหน้า คืนนั้น{name}เอานิ้วลูบตอเขาของตัวเองใต้ผมจนนิ้วร้อน
      effects: { mark: "{child}เกิด", alignment: { law: 1 }, child: { horned: true }, flags: [has_child, child_horned, child_horns_sawn] }
    - id: back_room_saw
      label: จ่ายสี่เหรียญให้หมอหลังร้านเกลือที่รับเลื่อยเขาเด็กโดยไม่ลงสมุด
      requires: { min_gold: 4 }
      text: |
        หมอคนนั้นทำงานในห้องหลังร้านขายเกลือ ไม่ถามชื่อ ไม่ถามที่อยู่ ล้างมือในชามน้ำส้มสายชูก่อนจับเด็ก เลื่อยของเขาเป็นเหล็กธรรมดา ฟันละเอียด ทำเสร็จก่อนน้ำในกาจะเดือด

        เขาพันผ้ารอบหัวลูก บอกว่าสามวันอย่าให้แผลเปียก ผมยาวเมื่อไรจะคลำไม่เจอ แล้วรับสี่เหรียญใส่กระป๋องเกลือ {name}อุ้ม{child}แนบอกเดินกลับบ้านตลอดทาง ลูกหลับตลอดทางเหมือนกัน
      effects: { mark: "{child}เกิด", gold: -4, child: { horned: true }, flags: [has_child, child_horned, child_horns_sawn] }
    - id: keep_hidden
      label: ไม่ไปลงสมุด เลี้ยงไว้ในบ้าน คลุมหัวทุกครั้งที่ออกไปข้างนอก
      text: |
        ท้ายเดือนวิหารเปิดสมุด {name}ไม่ไป ไม่มีใครมาตาม เด็กที่ไม่มีชื่อในสมุดมีอยู่ทุกถิ่น ส่วนใหญ่ตายก่อนครบขวบ

        {partner}เย็บหมวกผ้าใบเล็กสามใบ ผูกเชือกใต้คาง {child}ดึงทิ้งทุกครั้งที่ผูก ทั้งบ้านหัดผูกปมสองชั้นได้ก่อนลูกจะหัดแกะ
      effects: { mark: "{child}เกิด", alignment: { law: -1 }, child: { horned: true }, flags: [has_child, child_horned, child_hidden] }
    - id: write_as_seen
      label: พาไปลงชื่อ ให้เสมียนเขียนตามที่เห็น
      text: |
        เสมียนวิหารเปิดผ้าคลุมหัวเด็กดูเองตามระเบียบ แล้วพลิกสมุดไปหน้าท้ายเล่ม หน้าผู้ต้องตรา หน้านั้นปีนี้มีเจ็ดชื่อแล้ว {child}เป็นชื่อที่แปด

        ขากลับ แม่คนหนึ่งที่มาลงชื่อลูกวันเดียวกันเดินสวนมา เห็นผ้าคลุมหัวที่หลวมของลูก นางเดินชิดไปอีกฝั่งของทาง แล้วหันกลับมาบอกว่าลูกหน้าตาน่ารัก
      effects: { mark: "{child}เกิด", alignment: { moral: 1 }, child: { horned: true }, flags: [has_child, child_horned, child_horns_kept] }
    - id: show_own_horns
      label: ก้มหัวลงให้ลูกจับเขาของตัวเอง
      requires: { trait: curse_brand, not_flags: [horns_sawn] }
      text: |
        {name}ก้มหัวลงจนเขาของตัวเองอยู่ระดับเดียวกับมือลูก มือเล็กๆ คว้าไว้ได้ทันที กำแน่น ดึงแรงจน{name}ต้องร้องออกมา {partner}หัวเราะจนต้องนั่งลงกับพื้น

        ท้ายเดือน{name}พาลูกไปลงชื่อเอง เปิดผ้าคลุมหัวทั้งของตัวเองและของลูกก่อนเสมียนจะขอดู เสมียนเขียนคำว่า {child} ลงหน้าผู้ต้องตรา ถามชื่อผู้ปกครอง {name}บอกชื่อตัวเอง เสมียนหยุดปากกาไว้ เงยหน้าขึ้นดูเขาบนหัว{name} แล้วเขียนต่อจนจบบรรทัด
      effects: { mark: "{child}เกิด", alignment: { moral: 1 }, child: { horned: true }, flags: [has_child, child_horned, child_horns_kept] }

# ----- งานศพคนที่เลี้ยงมา (5 ฉบับ นับเป็นเรื่องเดียว) -----

- id: adult.life_funeral_toren
  stage: adult
  scene: temple
  weight: 10
  mark: แม่ชีโทเรนจากไป
  people: [{ id: toren, dies: true }]
  when:
    age: [26, 32]
    flags: [origin_marked_foundling]
  text: |
    จดหมายจากวิหารอีเซลมาถึงตอนต้นหน้าหนาว ลายมือแม่ชีอายุน้อย เขียนมาแค่สามบรรทัด แม่ชีโทเรนตายแล้ว คืนก่อนวันว่าง นั่งหลับไปบนม้านั่งหน้าชามไฟตัวเดิม เช้ามาคนเข้าเวรเจอแกยังนั่งอยู่ ทัพพีตักน้ำมันวางอยู่บนตัก ไฟในชามยังไม่ดับ

    {name}ไปถึงวิหารตอนเย็น ม้านั่งทุกตัวมีคนนั่ง ส่วนใหญ่อายุไล่เลี่ยกับ{name} บางคนแก่กว่า บางคนยังเป็นวัยรุ่น เกือบทุกคนเคยนอนในตะกร้าที่ลอดเข้ามาทางช่องส่งขนมปัง ครึ่งหนึ่งคลุมหัว {name}จำหน้าได้ไม่ถึงสิบคน แต่ทุกคนจำเสียงแกได้เหมือนกัน

    ธรรมเนียมของวิหารนี้ ทัพพีของแม่ชีที่ตายต้องตักน้ำมันเติมชามไฟเป็นครั้งสุดท้าย ด้วยมือของคนที่แกเลี้ยงมา
  choices:
    - id: pour_last
      label: รับทัพพีไปตักน้ำมันเติมชามเป็นทัพพีสุดท้ายของแก
      text: |
        แม่ชีอายุน้อยยื่นทัพพีให้{name}โดยไม่ถามใครในวิหารก่อน ด้ามไม้สึกเป็นร่องตามนิ้วของแก นิ้วของ{name}ไม่ลงร่องสักนิ้ว {name}ตักน้ำมันจากไห เทลงชามช้าๆ เปลวไฟยืดขึ้นจนแสงถึงคานหลังคา

        หลังพิธี แม่ชีอายุน้อยบอกว่าแกสั่งไว้ตั้งแต่ตาเริ่มฝ้า ให้ทัพพีอันนี้ไปอยู่กับเด็กคนที่ตักให้ ใครก็ได้ ขอให้ตักไม่หก
      effects: { items: [toren_oil_ladle], alignment: { moral: 1 }, flags: [buried_toren] }
    - id: sack_back
      label: ขอกระสอบแป้งที่ฝากแกไว้ในหีบคืน
      requires: { flag: left_sack_with_toren }
      text: |
        หีบใต้เตียงของแกเปิดด้วยกุญแจที่แม่ชีอายุน้อยห้อยคอไว้ ข้างในเป็นของที่เด็กสามสิบกว่าคนฝากแกไว้ตอนออกจากวิหาร ผูกป้ายชื่อไว้ทุกชิ้น กำไลด้าย ตุ๊กตาไม้ที่หัวหลุด ฟันน้ำนมห่อผ้า กระสอบแป้งของ{name}อยู่ชั้นบนสุด ป้ายเขียนด้วยลายมือที่สั่นมากแล้ว

        ใต้กระสอบมีกระดุมดีบุกเม็ดนั้นห่อกระดาษไว้ บนกระดาษเขียนว่า ถ้ามาขอคืนก่อนข้าตาย ข้าจะบอกว่าข้ารู้อยู่แล้ว
      effects: { items: [flour_sack_scrap], flags: [buried_toren, took_back_the_sack] }
    - id: last_vigil
      label: นั่งเฝ้าชามไฟทั้งคืนกับคนอื่นที่แกเลี้ยงมา
      text: |
        คืนนั้นไม่มีใครกลับบ้าน ผลัดกันลุกไปเติมน้ำมันทีละคนโดยไม่ต้องนัด ตอนดึกคนที่คลุมหัวเริ่มเปิดผ้าออกทีละคน จนไม่เหลือใครคลุม เงาเขาของคนสิบกว่าคนทอดอยู่บนผนังวิหาร ในแสงไฟชามเดียว

        ใกล้สาง ชายคนหนึ่งที่นั่งข้าง{name}เล่าว่าแกตีหลังมือเขาด้วยทัพพีอันนั้นตอนเจ็ดขวบ เพราะเอานิ้วจุ่มน้ำมันในไห แล้วเขาก็หัวเราะ คนทั้งแถวม้านั่งหัวเราะตาม
      effects: { stats: { CON: 1 }, flags: [buried_toren, kept_last_vigil] }

- id: adult.life_funeral_grandmother
  stage: adult
  scene: temple
  weight: 10
  mark: ท่านย่าจากไป
  people: [{ id: grandma, dies: true }]
  when:
    age: [26, 32]
    flags: [origin_marked_hidden]
  text: |
    คนรับใช้คนสุดท้ายมาบอกข่าวเอง ขับรถม้าคันสีลอกมาจอดหน้าที่พักของ{name} ม้าตัวเดียว เขาไม่ลงจากที่นั่งคนขับ บอกจากตรงนั้นว่าท่านย่าสิ้นแล้วเมื่อคืน บนเก้าอี้พนักสูงหน้าเตาผิง ชาในถ้วยยังไม่ทันเย็น

    พิธีจัดที่วิหารเวรัสตามธรรมเนียมของตระกูลเก่า นักบวชตะเกียงยืนหัวโลง ถือตะเกียงแขวนดวงเล็ก อวยพรญาติทีละคน ยกตะเกียงขึ้นใกล้หน้าผาก แล้ววางมือที่สวมถุงมือขาวลงบนกลางหัว ญาติที่เหลืออยู่มีหกคน เสมียนเบเลคยืนรออยู่ข้างประตูวิหาร ถือแฟ้มหนังสีดำ ญาติห้าคนในหกหันไปดูแฟ้มเล่มนั้นบ่อยกว่าดูโลง
  choices:
    - id: take_blessing
      label: ต่อแถวรับพรตะเกียง ให้นักบวชวางมือบนหัวเหมือนญาติคนอื่น
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ถุงมือขาววางลงบนหัวของ{name} หนักและเย็น นิ้วหัวแม่มือของนักบวชอยู่ห่างตอเขาข้างซ้ายไม่ถึงข้อนิ้ว {name}ยืนนิ่ง หายใจเท่าเดิม นักบวชพึมพำคำอวยพรจนจบ แล้วยกมือไปวางบนหัวของญาติคนถัดไป

          หลังพิธี ญาติห้าคนเดินตามเสมียนเบเลคออกไป {name}ยืนอยู่หน้าโลงคนเดียว ปัดผมให้ท่านย่าที่หลุดลงมาปรกหน้าผาก ผมของแกเหลือน้อยจนเห็นหนังหัว
        effects: { stats: { CON: 1 }, flags: [buried_grandmother] }
      failure:
        text: |
          นิ้วในถุงมือขาวกดลงตรงตอเขาข้างซ้ายพอดี แล้วหยุดอยู่ตรงนั้น นักบวชพึมพำคำอวยพรต่อจนจบ เสียงเรียบเท่าเดิม แต่มือไม่ยกขึ้นจนกว่าจะคลำไปเจอตอข้างขวา

          หลังพิธีเขาเดินมาถามชื่อเต็มของ{name} ถามตามระเบียบเหมือนถามญาติทุกคน แล้วจดลงกระดาษแผ่นหนึ่ง พับใส่แขนเสื้อ ไม่ได้ถามอะไรต่อ
        effects: { reputation: { lamp_church: -1 }, flags: [buried_grandmother, lamp_felt_the_stumps] }
    - id: stand_at_back
      label: ยืนท้ายวิหาร ไม่เข้าแถวรับพร
      text: |
        ญาติห้าคนหันมามอง{name}ครั้งหนึ่ง แล้วหันกลับไปดูนักบวช หลังพิธีเสมียนเบเลคเปิดแฟ้มอ่านให้ทุกคนฟังตรงหน้าประตู คฤหาสน์ ที่ดินที่เหลือ และเก้าอี้พนักสูงตัวนั้น ตกเป็นของวิหารเบเลคทั้งหมดตามสัญญาที่ท่านย่าลงชื่อไว้เมื่อสิบเอ็ดปีก่อน ญาติห้าคนเดินออกไปโดยไม่ลาใคร

        เสมียนปิดแฟ้มแล้วยื่นซองปิดผนึกให้{name}ซองหนึ่ง จ่าหน้าด้วยลายมือของแก ข้างในเป็นหน้ากระดาษที่ฉีกออกมาจากสมุดตระกูล หน้าที่มีชื่อของ{name} ช่องเผ่าเขียนว่า มนุษย์ ใต้นั้นมีลายมือเดียวกันเขียนเพิ่มทีหลัง หมึกใหม่กว่า ว่าแก้เองได้ถ้าอยากแก้
      effects: { stats: { INT: 1 }, flags: [buried_grandmother, has_family_page] }
    - id: take_saw_box
      label: รับกล่องไม้ที่คนรับใช้ถือมาจากคฤหาสน์
      requires: { flag: refused_the_silver_saw }
      text: |
        คนรับใช้คนสุดท้ายยื่นกล่องบุกำมะหยี่ให้ตอนที่ญาติเดินออกไปหมดแล้ว บอกว่าท่านย่าสั่งไว้ ไม่ให้กล่องนี้ตกไปถึงเสมียนเบเลค เพราะของที่อยู่ในนั้นไม่เคยเป็นของคฤหาสน์

        ในกล่อง เลื่อยเงินยังนอนอยู่ในร่องเดิม ข้างใบเลื่อยมีกระดาษพับไว้แผ่นหนึ่ง เขียนว่า ข้าไม่ได้ใช้มันอีกเลยหลังคืนนั้น ถ้าเจ้าจะไม่ใช้ ก็ให้มันอยู่กับคนที่ไม่ใช้
      effects: { items: [silver_saw_case], flags: [buried_grandmother] }
    - id: black_saw
      label: รับห่อผ้าเล็กๆ ที่คนรับใช้ยื่นให้
      requires: { flag: burned_the_silver_saw }
      text: |
        ในห่อผ้าคือเลื่อยเงินอันนั้น ดำทั้งใบ ฟันเลื่อยเรียบไปครึ่งหนึ่งเพราะความร้อน คนรับใช้คนสุดท้ายบอกว่าเช้าวันรุ่งขึ้นหลังจาก{name}โยนมันลงเตาผิง ท่านย่าให้เขาเขี่ยมันออกจากขี้เถ้าตั้งแต่ไก่ยังไม่ขัน แล้วเก็บไว้ในลิ้นชักโต๊ะเขียนหนังสือ ไม่เคยให้ขัด

        {name}ถือเลื่อยดำอันนั้นไว้จนพิธีจบ หลังพิธีเอามันใส่ลงในโลงข้างมือของแก ก่อนช่างจะตอกฝา
      effects: { stats: { STR: 1 }, flags: [buried_grandmother, buried_the_black_saw] }

- id: adult.life_funeral_mother
  stage: adult
  scene: home
  weight: 10
  mark: "{mother}จากไป"
  people: [{ id: mother, dies: true }]
  when:
    age: [26, 32]
    not_flags: [origin_marked_foundling, origin_marked_hidden, origin_elf_bough, origin_dwarf_clan]
  text: |
    ข่าวมาถึงตอนเที่ยง คนส่งข่าวเป็นเด็กจากถิ่นเกิดที่วิ่งมาทั้งเช้า รองเท้าขาดไปข้างหนึ่ง {mother}ล้มลงในครัวตั้งแต่เมื่อวานเย็น มือยังเปื้อนแป้ง แล้วไม่ได้ลืมตาขึ้นมาอีก

    {name}ไปถึงบ้านตอนค่ำ ร่างของ{mother}นอนอยู่บนโต๊ะกินข้าวตัวยาว ปูผ้าขาว ข้างหัวจุดเทียนสองเล่ม เพื่อนบ้านนั่งกันแน่นหน้าบ้าน ต้มน้ำ หุงข้าว เล่ากันเบาๆ ว่าเมื่อวานนางยังเดินไปตลาด ยังต่อราคาหัวหอมกับร้านเดิม

    ธรรมเนียมของถิ่นนี้ ลูกต้องเป็นคนล้างตัวและแต่งตัวให้เป็นครั้งสุดท้าย ก่อนไก่ขันรุ่งเช้า
  choices:
    - id: wash_her
      label: ล้างตัว{mother}เองทีละส่วนตามธรรมเนียม
      text: |
        น้ำในกะละมังอุ่นพอดีมือ {name}ล้างแป้งออกจากมือ{mother}ก่อน ทีละนิ้ว ใต้เล็บยังมีแป้งติด ต้องใช้ไม้แคะ ฝ่ามือหยาบกว่าที่{name}จำได้มาก นิ้วนางข้างซ้ายคดไปทางนิ้วก้อย เหมือนเคยหักแล้วไม่มีใครดามให้

        ตอนแต่งตัว {name}หยิบผ้าคลุมไหล่ผืนที่{mother}ใส่ไปตลาดทุกหน้าหนาวขึ้นมาจะคลุมให้ แล้วเปลี่ยนใจ พับเก็บใส่ย่ามตัวเอง เอาผืนใหม่ที่นางเก็บไว้ไม่เคยใช้คลุมให้แทน
      effects: { items: [mother_shawl], flags: [buried_mother] }
    - id: buy_coffin
      label: จ่ายห้าเหรียญซื้อโลงไม้หนาที่ฝาปิดสนิท
      requires: { min_gold: 5 }
      text: |
        ช่างไม้ในถิ่นมีโลงที่ทำเสร็จแล้วอยู่สองใบ ใบบางราคาสองเหรียญ ใบหนาห้าเหรียญ {name}จ่ายห้าเหรียญ ช่างแบกมาส่งเองตอนเกือบเที่ยงคืน ลูบฝาโลงให้ดูว่าไสเรียบทุกด้าน

        ตอนเช้าเพื่อนบ้านหกคนแบกโลงไปที่ฝังศพท้ายถิ่น ไม่มีใครบ่นว่าหนัก ป้าที่ขายหัวหอมเดินตามหลังมาจนถึงหลุม ยืนอยู่ห่างๆ ถือหัวหอมไว้ในมือสองหัว
      effects: { gold: -5, alignment: { moral: 1 }, flags: [buried_mother] }
    - id: coin_in_hand
      label: วางเหรียญที่{mother}เคยแอบแถมใส่ห่อเสบียง ไว้ในมือนาง
      requires: { flag: mother_returned_money, min_gold: 1 }
      text: |
        เหรียญนั้น{name}ไม่เคยใช้ เก็บแยกไว้ในกระเป๋าเสื้อด้านใน ขอบสึกจนเรียบ {name}กำมือ{mother}ให้รอบเหรียญ แล้วพันผ้าขาวทับไว้ไม่ให้หลุด

        เพื่อนบ้านคนหนึ่งเห็น ถามว่าใส่เงินให้คนตายทำไม ที่ที่นางไปไม่มีตลาด {name}บอกว่าไม่ได้ให้ใช้ ให้คืน
      effects: { gold: -1, alignment: { moral: 1 }, flags: [buried_mother] }
    - id: well_water
      label: ไปตักน้ำที่บ่อกลางบ้านโรงสีบนมาล้างตัว{mother}
      requires: { flag: origin_marked_kept }
      text: |
        บ่อกลางบ้านโรงสีบนยังอยู่ที่เดิม ถังไม้ใบใหม่ เชือกเส้นใหม่ {name}ตักน้ำถังแรกตอนตีสาม ตอนจะหิ้วกลับ มีผู้หญิงแก่สามคนยืนอยู่หลังบ่อแล้ว ถือถังมาคนละใบ

        {name}จำได้คนเดียว ป้าร้านขายด้าย นางไม่พูดถึงเรื่องเมื่อสามสิบปีก่อน นางตักน้ำเต็มถังแล้วเดินนำไปทางบ้าน{mother} อีกสองคนเดินตาม จนสว่าง สี่คนผลัดกันหิ้วน้ำจากบ่อมาที่บ้านนั้น
      effects: { stats: { STR: 1 }, flags: [buried_mother, well_women_came] }

- id: adult.life_funeral_mother_dwarf
  stage: adult
  scene: clan_hall
  weight: 10
  mark: "{mother}จากไป"
  people: [{ id: mother, dies: true }]
  when:
    age: [26, 32]
    flags: [origin_dwarf_clan]
  text: |
    {mother}ไอมาสามหน้าหนาว ไอแบบคนที่ยืนหน้าเตาถ่านมารมาทั้งชีวิต เสมหะเป็นสีสนิม หน้าหนาวที่สี่นางไม่ไอแล้ว หมอของตระกูลบอกว่าปอดของนางกลายเป็นหินไปครึ่งหนึ่งก่อนหัวใจจะหยุด ก่อนวัยของคนแคระไปมาก

    ทั้งตระกูลแบกร่างนางขึ้นไปตามถนนวน เข้าไปฝังในผนังเสาของออสซา ช่องที่ตระกูลจองไว้อยู่สูงกว่าช่องของทวดสองชั้น หินสีกระดูกเย็นเท่าเดิม ตะเกียงถ่านมารที่ถือไปส่องได้ไม่เกินสามก้าว

    ที่ห้องโถงของตระกูล กำแพงชื่อรออยู่ ข้างชื่อของ{mother}ยังมีที่ว่างสำหรับปีตาย ช่างหินถือสิ่วรออยู่ แต่ธรรมเนียมเปิดให้ลูกสลักเองได้
  choices:
    - id: carve_it
      label: รับสิ่วมาสลักปีตายของ{mother}เอง
      habit: craft_hands
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}สลักทีละเส้น ช้าจนช่างหินเริ่มขยับเท้า ตัวเลขออกมาลึกเท่ากันทุกตัว ร่องตรงเท่ากับชื่อของ{mother}ที่สลักไว้ตั้งแต่นางยังเป็นเด็ก

          ช่างหินเอานิ้วลูบร่องจนสุดแถว แล้วยื่นสิ่วกลับมาให้{name}อีกรอบ บอกว่าเก็บไว้ ตระกูลนี้ยังมีปีตายรอสลักอีกหลายช่อง
        effects: { stats: { DEX: 1 }, flags: [buried_mother, carved_mothers_year] }
      failure:
        text: |
          สิ่วแฉลบตอนตัวเลขตัวสุดท้าย ร่องเฉออกนอกแนวไปครึ่งนิ้ว {name}วางสิ่วลง ช่างหินก้มลงดู แล้วบอกว่าหินไม่ลบให้ใคร ร่องนี้จะอยู่ตรงนี้ไปอีกสามร้อยปี

          ทุกเช้าหลังจากนั้น คนในตระกูลที่เดินผ่านกำแพงชื่อจะเห็นตัวเลขตัวนั้น {name}เองก็เห็น หลายปีต่อมา{name}เลิกเห็นว่ามันเฉ เห็นแต่ว่าเป็นลายมือของใคร
        effects: { stats: { CON: 1 }, flags: [buried_mother, crooked_death_year] }
    - id: pay_carver
      label: จ่ายสามเหรียญให้ช่างหินของตระกูลสลักให้
      requires: { min_gold: 3 }
      text: |
        ช่างหินสลักเสร็จในเวลาไม่ถึงต้มน้ำหนึ่งกา ร่องลึกและตรง เหมือนตัวเลขทุกตัวบนกำแพงที่เขาสลักมาสี่สิบปี เขารับสามเหรียญแล้วโยนลงกล่องเหล็กของสภาตระกูล ไม่ได้เก็บเข้ากระเป๋าตัวเอง

        เขาบอกว่าเงินค่าสลักปีตายเข้ากองหนี้สงคราม ทุกเหรียญ ตั้งแต่ปีที่แพ้มา
      effects: { gold: -3, reputation: { dwarf_council: 1 }, flags: [buried_mother] }
    - id: sit_in_the_wall
      label: นั่งเฝ้าในช่องผนังเสาจนตะเกียงหมดถ่าน
      text: |
        คนอื่นลงไปกันหมดแล้ว {name}นั่งอยู่ในช่องหินหน้าร่างของ{mother} ตะเกียงถ่านมารวางบนพื้น แสงแดงหรี่ลงทีละน้อย ความเย็นของเสาซึมเข้ามาทางหลังจนถึงกระดูก

        ตะเกียงดับตอนไหน{name}ไม่รู้ตัว รู้แต่ว่ามืดสนิทแล้ว และผ้าคลุมไหล่ขนแพะที่{mother}ใส่ยืนหน้าเตามาทั้งชีวิตยังพาดอยู่บนตักของ{name} ตอนเดินลงมา{name}คลุมมันไว้ทั้งทาง
      effects: { stats: { CON: 1 }, items: [mother_shawl], flags: [buried_mother] }

- id: adult.life_funeral_mother_elf
  stage: adult
  weight: 10
  mark: "{mother}จากไป"
  people: [{ id: mother, dies: true }]
  when:
    age: [26, 32]
    flags: [origin_elf_bough]
  text: |
    บ้านกิ่งลมไม่มีงานศพมาสองร้อยกว่าปี เอลฟ์ที่อายุน้อยกว่านั้นไม่มีใครเคยเห็นว่าต้องทำอะไรบ้าง ต้องไปถามผู้เฒ่าทีละขั้น

    {mother}จากไปในหน้าหนาว ก่อนวัยของเอลฟ์ไปหลายร้อยปี หมอบนกิ่งบอกว่านางหลับไปตรงหน้ากี่ แล้วไม่ตื่นอีก กระสวยยังค้างอยู่กลางผืน ทั้งหมู่บ้านขึ้นมานั่งบนกิ่งรอบบ้านเหมือนคืนที่{name}เกิด จุดโคมน้ำมันคนละดวง ลมระหว่างสองเสายังพัดไม่หยุด โคมทุกดวงแกว่งไปทางเดียวกัน

    ก่อนหย่อนร่างลงไปหาราก ผู้เฒ่าอ่านชื่อเต็มของ{mother}ให้ทั้งหมู่บ้านฟัง ทุกชื่อที่นางเคยใช้ต่อกันตั้งแต่ชื่อแรก เป็นครั้งเดียวที่เอลฟ์ยอมให้คนอื่นได้ยินชื่อเต็ม สองชื่อแรก{name}ไม่เคยได้ยินมาก่อน
  choices:
    - id: hold_the_rope
      label: จับเชือกหย่อนร่าง{mother}ลงไปหารากด้วยมือตัวเอง
      check: { stat: STR, dc: 12 }
      success:
        text: |
          เชือกเส้นนั้นยาวกว่าต้นไม้ทั้งต้นจากกิ่งถึงพื้น {name}ปล่อยทีละช่วงแขน ช้าเท่ากันทุกช่วง ร่างที่ห่อผ้าทอสีเทาค่อยๆ ลงไปในความมืดใต้ใบไม้ จนเชือกหย่อนเบามือ แปลว่าถึงรากแล้ว

          {name}ไม่ได้ปล่อยเชือกทันที ถือไว้อีกพักหนึ่ง จนผู้เฒ่าเอื้อมมือมาแตะหลังมือเบาๆ ถึงได้คลายนิ้ว
        effects: { stats: { STR: 1 }, flags: [buried_mother] }
      failure:
        text: |
          ครึ่งทางลงไป ลมระหว่างสองเสากระโชกมาทีหนึ่ง ร่างที่ห่อผ้าแกว่งออก เชือกรูดผ่านฝ่ามือของ{name}จนหนังถลอก {name}กำแน่นกว่าเดิม ไม่ยอมปล่อย จนร่างหยุดแกว่ง แล้วหย่อนต่อจนถึงราก

          ฝ่ามือทั้งสองข้างเป็นแผลไปครึ่งเดือน เอลฟ์ที่ทอผ้ากับ{mother}มาร้อยปีเอาน้ำมันสนมาทาให้ทุกเย็น ไม่ได้พูดถึงแผลสักครั้ง พูดแต่เรื่อง{mother}
        effects: { hp: -1, stats: { CON: 1 }, flags: [buried_mother, rope_scarred_hands] }
    - id: ask_the_names
      label: ขอให้ผู้เฒ่าบอกสองชื่อแรกของ{mother}อีกครั้ง
      text: |
        ผู้เฒ่าบอกว่าชื่อเต็มอ่านครั้งเดียว ไม่อ่านซ้ำ แล้วก้มลงกระซิบข้างหู{name}แทน ช้าๆ ทีละชื่อ เหมือนคืนที่{name}ยังนอนอยู่ในเปล

        ชื่อแรกของ{mother}เป็นชื่อเด็ก ชื่อที่สองเป็นชื่อของคนที่เดินทางไปไกล {name}ไม่เคยรู้มาก่อนว่านางเคยไปไหน คืนนั้น{name}นั่งท่องสองชื่อนั้นบนกิ่งจนจำได้ เผื่อวันหนึ่งจะต้องเลือกชื่อที่สองของตัวเอง
      effects: { stats: { INT: 1 }, flags: [buried_mother, knows_mothers_old_names] }
    - id: finish_weaving
      label: ทอผ้าผืนที่{mother}ค้างไว้ต่อจนจบ
      text: |
        กระสวยยังค้างอยู่ตรงที่{mother}วางไว้ {name}นั่งลงหน้ากี่ ทอต่อจากแถวสุดท้ายของนาง ลายแรกๆ ที่{name}ทอแน่นไม่เท่า ดูออกทันทีว่าเปลี่ยนมือตรงไหน

        ผ้าผืนนั้นเสร็จในเจ็ดคืน กลายเป็นผ้าคลุมไหล่ครึ่งหนึ่งแน่น อีกครึ่งหนึ่งหลวม {name}ใส่มันลงจากกิ่งไปทำงานทุกวันที่ลมแรง
      effects: { items: [mother_shawl], flags: [buried_mother] }

# ----- เรื่องชีวิตอื่นในช่วง 3b -----

- id: adult.life_house_for_sale
  stage: adult
  scene: home
  weight: 10
  when:
    age: [26, 32]
  text: |
    เจ้าของที่ที่{name}อาศัยอยู่มาหลายปีตายในหน้าร้อน ลูกชายของเขาย้ายไปทำงานที่อื่นนานแล้ว กลับมางานศพวันเดียว แล้วติดป้ายขายทุกอย่างที่พ่อทิ้งไว้ รวมถึงห้องที่{name}นอนอยู่ทุกคืน ราคายี่สิบเหรียญ คนมีเงินสดต่อรองได้

    วันต่อมาเสมียนเบเลคมาตั้งโต๊ะหน้าบ้าน รู้ข่าวก่อนกาวที่ติดป้ายจะแห้ง เสนอให้กู้ซื้อ วางมัดจำสี่เหรียญ ที่เหลือจ่ายเดือนละเหรียญจนครบ สัญญาสองหน้า ตัวหนังสือเล็กเท่าเดิม
  choices:
    - id: buy_cash
      label: จ่ายยี่สิบเหรียญ ซื้อขาด
      requires: { min_gold: 20 }
      text: |
        ลูกชายเจ้าของนับเหรียญสองรอบบนขั้นบันไดหน้าบ้าน แล้วยื่นกุญแจให้พร้อมกระดาษโอนที่พ่อของเขาลงชื่อไว้ตั้งแต่ยังมีชีวิต เขาบอกว่าพ่อเคยพูดถึง{name} ว่าจ่ายค่าเช่าตรงวันที่สุดในบรรดาคนเช่าทุกคน

        เย็นนั้น{name}ตอกตะปูลงบนวงกบประตูหนึ่งตัว ไว้แขวนเสื้อ ไม่ต้องขออนุญาตใคร
      effects: { gold: -20, alignment: { law: 1 }, flags: [owns_home] }
    - id: belek_loan
      label: วางมัดจำสี่เหรียญ ลงชื่อกู้เบเลคส่วนที่เหลือ
      requires: { min_gold: 4 }
      text: |
        เสมียนให้{name}วางมือบนสมุด อ่านคำสาบานให้ฟังทีละวรรค ตอนคำสุดท้าย ปลายนิ้วของ{name}เย็นวาบขึ้นมาถึงข้อมือ แล้วหายไป เสมียนบอกว่าความเย็นนั้นจะกลับมาเมื่อไรก็ได้ ถ้าวันแรกของเดือนไหนไม่มีเหรียญวางบนโต๊ะ

        ห้องนั้นเป็นของ{name}แล้ว ส่วนในสมุดของเบเลค ห้องนั้นเป็นของเบเลคจนกว่าจะจ่ายครบ เสมียนพับสัญญาฉบับของ{name}เป็นสี่ทบ ยื่นให้ แล้วบอกว่าเก็บไว้ในที่แห้ง
      effects: { gold: -4, alignment: { law: 1 }, reputation: { belek_bank: 1 }, flags: [owns_home, belek_home_loan] }
    - id: haggle
      label: ชี้ให้ดูหลังคารั่วกับคานผุ แล้วต่อราคาลงเหลือสิบสองเหรียญ
      habit: tight_fist
      requires: { min_gold: 12 }
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}พาลูกชายเจ้าของปีนขึ้นไปดูคานใต้หลังคา เอานิ้วกดเนื้อไม้ให้ดูว่ายุบลงไปเท่าไร แล้วชี้รอยน้ำบนเพดานอีกเจ็ดรอย เขาฟังจนจบ บอกว่าไม่อยากกลับมาที่นี่อีกเป็นรอบที่สาม

          เขารับสิบสองเหรียญ ยื่นกุญแจให้ แล้วขึ้นเกวียนออกจากถิ่นไปก่อนเที่ยง ฝนแรกของปีนั้น{name}ปีนขึ้นไปอุดรอยรั่วเองทั้งเจ็ดรอย
        effects: { gold: -12, stats: { INT: 1 }, flags: [owns_home] }
      failure:
        text: |
          ลูกชายเจ้าของฟังเรื่องคานผุแล้วบอกว่าคนที่จะซื้อไม่ได้ซื้อคาน ซื้อที่ดิน สองวันต่อมาเขาขายให้นายโรงงานคนหนึ่งในราคาเต็ม นายคนใหม่ขึ้นค่าเช่าเท่าตัวตั้งแต่เดือนแรก

          {name}ขนของย้ายออกในเดือนนั้น แบกหีบใบเดียวกับฟูกหนึ่งผืนไปห้องใหม่ที่เล็กกว่าเดิม ไกลจากที่ทำงานกว่าเดิม
        effects: { stats: { STR: 1 }, flags: [moved_house] }
    - id: move_out
      label: ขนของย้ายไปเช่าที่อื่น
      text: |
        ของทั้งหมดของ{name}ใส่เกวียนยืมได้เล่มเดียว เหลือที่ว่างให้นั่งด้วย ห้องใหม่อยู่ห่างไปสามถนน หน้าต่างหันไปทางทิศที่ไม่เคยได้เห็นตอนเช้า

        คืนแรก{name}นอนไม่หลับ เพราะห้องใหม่ไม่มีเสียงอะไรที่คุ้น ไม่มีพื้นกระดานแผ่นที่ลั่น ไม่มีหมาบ้านตรงข้ามที่เห่าตอนตีสี่ เดือนที่สอง{name}เริ่มตื่นตอนตีห้าเพราะเสียงล้อเกวียนขนน้ำที่ผ่านใต้หน้าต่างทุกเช้า
      effects: { stats: { CON: 1 }, flags: [moved_house] }

- id: adult.life_winter_fever
  stage: adult
  scene: home
  weight: 10
  when:
    age: [25, 32]
  text: |
    หน้าหนาวปีนั้นไข้คอบวมเดินมาตามถนน บ้านละคนสองคน เริ่มที่เด็ก แล้วไปที่คนแก่ คอบวมจนกลืนน้ำไม่ลง หายใจเสียงหวีดเหมือนกาน้ำใกล้เดือด หมอประจำถิ่นเดินได้วันละรอบ ไม่พอ บ้านติดกับ{name}มีเด็กป่วยสามคน แม่ของเด็กทำงานกะกลางคืน

    ที่ตลาดมีคนขายยาเร่ตั้งแผงขายขวดยาสีเขียว ขวดละสามเหรียญ บอกว่าต้มจากรากไม้ที่หาได้แต่ในป่าลึก แถวหน้าแผงยาวกว่าแถวหน้าบ้านหมอ
  choices:
    - id: nurse_the_kids
      label: ไปนอนเฝ้าเด็กป่วยสามคนบ้านติดกันตอนแม่ของเด็กไปทำงาน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ต้มน้ำให้ไอขึ้นเต็มห้อง ชุบผ้าเย็นวางคอเด็กทีละคน ผลัดกันทั้งคืน เด็กคนเล็กกลืนน้ำซุปไม่ลงสามวัน วันที่สี่กลืนได้ครึ่งชาม วันที่ห้ากินหมดชามแล้วขอเพิ่ม

          ไข้ผ่านไปทั้งสามคน แม่ของเด็กเอาผ้าห่มขนแกะผืนหนาที่สุดในบ้านมาวางไว้หน้าประตูของ{name} พับไว้เรียบร้อย ไม่ได้เคาะประตู
        effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [nursed_fever_kids] }
      failure:
        text: |
          คืนที่สี่ คอของ{name}เริ่มบวมเอง กลืนน้ำลายแล้วเจ็บเหมือนกลืนเศษกระเบื้อง แม่ของเด็กต้องลาออกจากกะกลางคืนมาเฝ้าทั้งลูกสามคนกับ{name} นอนบนเสื่อเรียงกันสี่ผืน

          ทั้งสี่คนรอด เด็กหายก่อน{name}สิบวัน หลังหน้าหนาวนั้น เสียงของ{name}แหบไปตลอด ตอนเช้าแหบมาก ตอนเย็นแหบน้อย คนที่เพิ่งรู้จักนึกว่า{name}เจ็บคอ
        effects: { hp: -2, alignment: { moral: 1 }, flags: [nursed_fever_kids, fever_hoarse_voice] }
    - id: buy_green_bottle
      label: จ่ายสามเหรียญซื้อยาขวดเขียวไปให้บ้านติดกัน
      requires: { min_gold: 3 }
      text: |
        ยาขมจนเด็กคนเล็กพ่นใส่หน้า{name} คนโตกลืนได้ครึ่งช้อน ไข้ของทั้งสามคนลดในวันที่ห้า หมอประจำถิ่นบอกว่าไข้คอบวมลดเองวันที่ห้าทุกราย ไม่ว่ากินอะไร

        {name}กลับไปที่ตลาดเพื่อถามคนขายยาว่าต้มจากรากอะไร แผงนั้นไม่อยู่แล้วตั้งแต่วันที่สี่ ตรงที่เคยตั้งแผงมีขวดสีเขียวแตกอยู่ใบหนึ่ง ก้นขวดยังเหลือน้ำอยู่นิดหนึ่ง กลิ่นเหมือนน้ำต้มใบชาเก่า
      effects: { gold: -3, stats: { INT: 1 }, flags: [bought_green_bottle] }
    - id: shut_the_door
      label: ปิดประตูหน้าต่างบ้านตัวเอง ไม่ให้ใครเข้าออกจนไข้ผ่านไป
      text: |
        {name}ปิดบ้านอยู่ยี่สิบวัน ออกไปตักน้ำตอนตีสี่ตอนที่ถนนยังไม่มีคน กินแต่ของที่ตุนไว้ ทุกคืนได้ยินเสียงไอลอดผนังจากบ้านติดกัน เสียงเด็กสามคนผลัดกันไอ ไม่มีคืนไหนเงียบ

        วันที่ยี่สิบเอ็ด{name}เปิดประตู แม่ของเด็กนั่งผ่าฟืนอยู่หน้าบ้าน ไม่ได้หันมา จากในบ้านมีเสียงเด็กเล่นกันลอดออกมา {name}ยืนนับเสียงจนแน่ใจว่าได้ยินกี่เสียง
      effects: { stats: { CON: 1 }, alignment: { moral: -1 }, flags: [shut_door_on_fever] }

- id: adult.life_old_friend_cold
  stage: adult
  scene: home
  weight: 10
  when:
    age: [27, 32]
  text: |
    กลางหน้าร้อนมีคนมาเคาะประตูบ้าน{name}ตอนเที่ยงวัน สวมเสื้อขนแกะซ้อนกันสองตัว มือซุกอยู่ในแขนเสื้อ ปากซีดเหมือนคนเพิ่งขึ้นจากน้ำ {name}จำไม่ได้จนเขายิ้ม ฟันหน้าซี่ที่บิ่นตอนตกจากหลังคาด้วยกันตอนเก้าขวบยังบิ่นอยู่ตรงเดิม

    เพื่อนคนนี้เคยกู้เงินวิหารเบเลคมาเปิดร้าน ร้านเจ๊งตั้งแต่ปีแรก เขาหนีหนี้มาสองปี ย้ายถิ่นมาสามครั้ง แต่สัญญาที่ลงชื่อต่อหน้าเบเลคไม่ย้ายตาม ความหนาวเริ่มที่ปลายนิ้ว ไล่ขึ้นมาเดือนละนิด ตอนนี้ขึ้นมาถึงไหล่แล้ว หนี้ที่ค้างอยู่เก้าเหรียญ เขาไม่ได้มาขอเงิน เขามาขอนอนข้างเตาบ้าน{name}สักคืน
  choices:
    - id: pay_it_off
      label: พาไปโต๊ะเสมียนเบเลค จ่ายเก้าเหรียญให้ครบ
      requires: { min_gold: 9 }
      text: |
        เสมียนนับเหรียญเก้าเหรียญ แล้วเขียนคำว่าครบไว้ท้ายบรรทัดด้วยหมึกสีเดียวกับบรรทัดอื่น เพื่อนถอดเสื้อขนแกะออกตัวหนึ่งตรงหน้าโต๊ะนั้นเลย แล้วอีกตัว เหงื่อแตกเต็มหน้า หัวเราะเสียงดังจนเสมียนต้องเงยหน้า

        เย็นนั้นเพื่อนนั่งตากแดดอยู่หน้าบ้าน{name}จนแดดหมด บอกว่าลืมไปแล้วว่าหน้าร้อนร้อนแบบนี้
      effects: { gold: -9, alignment: { moral: 1 }, flags: [paid_friends_cold_debt] }
    - id: warm_by_stove
      label: ให้นอนข้างเตา ต้มน้ำร้อนให้ทั้งคืน
      text: |
        {name}ใส่ฟืนเตาจนห้องร้อนเหงื่อซึม เพื่อนนอนขดอยู่ข้างเตา ยังสวมเสื้อทั้งสองตัว จิบน้ำร้อนไปเล่าเรื่องร้านที่เจ๊งไป ร้านขายหมวก ขายได้สิบเอ็ดใบในปีแรก ใบที่สิบเอ็ดคนซื้อเอามาคืน

        ตอนเช้าเพื่อนไปก่อน{name}ตื่น ทิ้งเสื้อขนแกะตัวนอกพับไว้บนเก้าอี้ ไม่ได้เขียนอะไรไว้ ในกระเป๋าเสื้อมีหมวกผ้าใบเล็กใบหนึ่ง ขนาดหัวเด็ก
      effects: { alignment: { moral: 1 }, flags: [sheltered_cold_friend] }
    - id: work_it_off
      label: พาไปทำงานด้วยกัน ให้นายเห็นว่าแรงยังดี จะได้หาเงินใช้หนี้เอง
      check: { stat: STR, dc: 12 }
      success:
        text: |
          {name}ยกของหนักให้นายเห็นสองเที่ยว แล้วให้เพื่อนยกเที่ยวที่สามด้วยกัน มือเพื่อนเย็นจนจับเชือกไม่ค่อยติด แต่ไหล่ยังรับน้ำหนักได้ นายรับเขาเข้าทำงานแบบรายวัน

          เดือนแรกเพื่อนจ่ายหนี้ได้หนึ่งเหรียญ ความเย็นถอยลงจากไหล่ไปถึงข้อศอก ปลายปีถอยลงไปถึงข้อมือ เขาเริ่มถอดเสื้อตัวนอกได้ตอนเที่ยง
        effects: { stats: { STR: 1 }, alignment: { moral: 1 }, flags: [got_cold_friend_work] }
      failure:
        text: |
          เพื่อนยกได้เที่ยวเดียว เที่ยวที่สองนิ้วที่เย็นเฉียบปล่อยเชือกเอง ลังตกแตกต่อหน้านาย นายบอกให้กลับไปตั้งแต่ยังไม่เที่ยง

          เพื่อนบอก{name}ว่าไม่เป็นไร เขาชินแล้ว ขอแค่นอนข้างเตาคืนเดียวตามที่ขอแต่แรก ตอนเช้าเขาไปก่อน{name}ตื่น
        effects: { stats: { CON: 1 }, flags: [sheltered_cold_friend] }
    - id: give_blanket
      label: ยื่นผ้าห่มให้ผืนหนึ่ง บอกว่าช่วยได้เท่านี้
      text: |
        เพื่อนรับผ้าห่มไว้ด้วยสองมือ ขอบใจ แล้วเดินกลับไปตามทางที่มา กลางแดดเที่ยง คลุมผ้าห่มไว้ทั้งตัว เด็กที่เล่นอยู่ข้างทางหัวเราะใส่ เขาหัวเราะกลับ

        สองปีต่อมามีคนเล่าให้{name}ฟังว่าเห็นเขานั่งขายหมวกอยู่ในตลาดถิ่นถัดไป ในหน้าร้อน สวมเสื้อสามตัว
      effects: { flags: [turned_away_cold_friend] }

- id: adult.life_neighbor_letter
  stage: adult
  scene: home
  weight: 10
  when:
    age: [25, 32]
  text: |
    หญิงแก่บ้านติดกันอ่านหนังสือไม่ออก ทุกสามเดือนนางจะมาเคาะประตูบ้าน{name} ถือซองสีน้ำตาลของบริษัทเหมืองมาฉบับหนึ่ง ลูกชายคนเดียวของนางขุดถ่านมารอยู่ที่หลุมสิบสอง ไกลจากที่นี่หลายวันเดิน แปดปีมาแล้ว ส่งเงินแนบมาทุกฉบับ ฉบับละนิดหน่อย นางขอให้{name}อ่านให้ฟัง แล้วเขียนตอบตามที่นางบอก

    ฉบับนี้ไม่มีเงินแนบ ลายมือเอียงกว่าทุกฉบับ ย่อหน้าแรกเขียนเรื่องอากาศกับอาหารเหมือนเดิม ย่อหน้าที่สองเขียนว่าสามเดือนมานี้เขาฝันทุกคืน มีเสียงทุ้มๆ เรียกชื่อเขาจากใต้พื้นหลุม เรียกช้าๆ ทีละพยางค์ เพื่อนในหลุมฝันกันหลายคน เขาอยากลาออกกลับบ้าน ถ้าแม่ไม่ว่าอะไร

    นางนั่งรอฟังอยู่ข้างเตา มือกำผ้ากันเปื้อนไว้ข้างหนึ่ง
  choices:
    - id: read_it_all
      label: อ่านให้ฟังทุกบรรทัดตามที่เขียน
      text: |
        {name}อ่านจนจบ นางไม่ถามเรื่องเสียงในฝัน นางถามว่าลูกยังกินข้าวครบมื้อไหม {name}อ่านย่อหน้าแรกให้ฟังอีกรอบ นางฟังเรื่องอาหารจนจบ แล้วบอกให้เขียนตอบไปคำเดียว กลับมา

        {name}เขียนคำนั้นตัวโตกลางกระดาษ นางถือกระดาษไปส่งที่ร้านรับฝากจดหมายเอง สองเดือนต่อมามีผู้ชายตัวผอมผิวคล้ำฝุ่นถ่านมานั่งผ่าฟืนอยู่หน้าบ้านหลังนั้น ทุกเช้า
      effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [read_miner_letter_true] }
    - id: skip_the_dream
      label: ข้ามย่อหน้าที่สองไป อ่านแต่เรื่องอากาศกับอาหาร
      text: |
        นางฟังเรื่องอากาศกับอาหารจนจบ ยิ้ม แล้วบอกให้เขียนตอบไปว่าแม่สบายดี ทำงานต่อไป อย่าลืมกินข้าว เงินเดือนนี้ไม่ต้องห่วง {name}เขียนตามนั้นทุกคำ

        ฉบับต่อมามาตรงเวลา มีเงินแนบมาเหมือนเดิม ลายมือตรงขึ้น ไม่มีเรื่องฝัน {name}อ่านให้นางฟังทุกบรรทัด แล้วนั่งดูนางนับเหรียญอยู่ข้างเตา
      effects: { alignment: { law: 1, moral: -1 }, flags: [skipped_miner_dream] }
    - id: warn_him
      label: เขียนตามที่นางบอก แล้วเติมบรรทัดของตัวเองไว้ท้ายจดหมาย
      requires: { trait: curse_brand }
      text: |
        นางบอกให้เขียนว่ากลับมาได้ {name}เขียนตาม แล้วเติมอีกบรรทัดไว้ท้ายกระดาษด้วยตัวหนังสือเล็ก ว่าถ้าเสียงนั้นถามอะไร อย่าตอบ ถ้ามันเสนออะไร อย่ารับ ต่อให้ฟังดูเล็กแค่ไหน

        สามเดือนต่อมาลูกชายของนางกลับมาจริง มาเคาะประตูบ้าน{name}ตั้งแต่วันแรก ถือจดหมายฉบับนั้นมาด้วย ชี้บรรทัดสุดท้าย ถามว่า{name}รู้ได้อย่างไร {name}ปลดผ้าคลุมหัวให้เขาดู แล้วรินน้ำชาให้หนึ่งถ้วย
      effects: { alignment: { moral: 1 }, flags: [warned_miner_voice] }

# ===================== 3c อายุ 33 ถึง 40 =====================

- id: adult.life_child_grows
  stage: adult
  scene: home
  weight: 10
  # ลูกต้องโตพอจริง (6 ถึง 13 ขวบ) เหตุการณ์จึงเลื่อนตามปีเกิดของลูก ไม่ใช่ตามอายุของ{name}อย่างเดียว
  cast:
    kid: { kin: [child], min_age: 6, max_age: 13, pick: eldest }
  when:
    age: [33, 47]
    flags: [has_child]
    not_flags: [child_horned]
  text: |
    {kid}โตพอจะเดินตาม{name}ไปทำงานได้ทั้งวันโดยไม่ต้องอุ้มกลับ ถามทุกอย่างที่เห็น ทำไมคนแก่หลังค่อม ทำไมบางคนไม่จ่ายเงิน ทำไมดาวคืนนี้มากกว่าคืนก่อน คำถามสุดท้าย{name}ตอบไม่ได้ เลยบอกให้ไปถามคนอื่น ลูกไปถามมาครบทั้งถนน ได้คำตอบกลับมาเจ็ดแบบ

    วันเลือกทางของถิ่นยังอีกหลายปี แต่เด็กโตในถนนเดียวกันเริ่มคุยกันแล้วว่าจะไปฝากตัวกับใคร ปีนี้เสมียนเบเลคมาที่ถิ่นพร้อมสัญญาแบบใหม่ รับเด็กไปฝึกเป็นเสมียนตั้งแต่ยังไม่ถึงวันเลือกทาง จ่ายให้บ้านล่วงหน้าสามเหรียญ ส่วนครูหนังสือในเมืองรับลูกศิษย์ปีละหกเหรียญ
  choices:
    - id: take_to_work
      label: พาไปทำงานด้วยทุกวัน สอนทุกอย่างที่ตัวเองรู้
      text: |
        {name}สอนแบบที่คนอื่นเคยสอนตัวเอง ทำให้ดูหนึ่งรอบแล้วให้ลองเอง ลูกถามว่าทำไมทุกขั้น ขั้นที่{name}ตอบไม่ได้มีมากจนต้องกลับไปนอนคิดตอนกลางคืน ว่าที่ทำมาทั้งชีวิตทำแบบนั้นเพราะอะไร

        สิ้นปี {kid}ทำงานง่ายๆ ได้เองครึ่งวันโดยไม่ต้องมีใครดู แล้วเริ่มทำบางอย่างไม่เหมือน{name} ไม่เหมือนตรงที่เร็วกว่า
      effects: { stats: { INT: 1 }, flags: [child_learns_your_trade] }
    - id: send_to_school
      label: จ่ายหกเหรียญส่งไปเรียนหนังสือกับครูในเมือง
      requires: { min_gold: 6 }
      text: |
        ครูหนังสือเป็นชายแก่ใส่แว่นสองชั้น สอนเด็กสิบสองคนในห้องเดียว เอาไม้เรียวเคาะโต๊ะแทนตีมือ ลูกกลับบ้านมาอ่านป้ายร้านออกเสียงทุกป้ายตลอดทาง อ่านผิดป้ายเดียว ร้านขายโลงศพ อ่านเป็นร้านขายกล่อง

        คืนหนึ่ง{kid}หยิบจดหมายเก่าจากก้นหีบขึ้นมาอ่านให้{name}ฟัง สะกดทีละพยางค์ อ่านชื่อคนผิดไปสองที่ {name}ไม่ได้แก้ นั่งฟังจนลูกอ่านจบหน้า
      effects: { gold: -6, flags: [child_schooled] }
    - id: belek_apprentice
      label: รับสามเหรียญ ลงชื่อให้ลูกไปฝึกกับเสมียนเบเลค
      text: |
        ตอนลงชื่อ เสมียนให้{kid}วางมือบนสมุดด้วย ลูกสะดุ้ง หันมาบอก{name}ว่านิ้วเย็น เสมียนบอกว่าเย็นแค่ครั้งแรก แล้วนับสามเหรียญวางบนโต๊ะเป็นแถวตรง

        เดือนแรกลูกส่งจดหมายกลับมา ลายมือตรงเป็นแถวเหมือนทหาร ไม่มีตัวไหนเบี้ยว ท้ายจดหมายเขียนว่าคิดถึงบ้าน สองคำนั้นตัวเล็กกว่าคำอื่นในหน้า
      effects: { gold: 3, alignment: { law: 1 }, reputation: { belek_bank: 1 }, flags: [child_to_belek] }
    - id: no_hurry
      label: บอกลูกว่ายังไม่ต้องรีบ ถึงวันนั้นค่อยเลือกเอง
      text: |
        {kid}ถามว่าถ้าวันนั้นมาถึงแล้วยังเลือกไม่ได้ล่ะ {name}บอกว่าก็รออีกปี ลูกกินข้าวต่อจนหมดชาม แล้วออกไปนั่งหน้าบ้าน

        ตอนค่ำ{name}ออกไปตาม เจอลูกนั่งอยู่กับชายแก่ที่นับดาวทุกคืนตรงหัวถนน ทั้งสองคนแหงนหน้า นับกันคนละดวง เถียงกันเสียงดังว่าดวงไหนนับไปแล้ว
      effects: { alignment: { law: -1 }, flags: [child_choose_own_path] }

- id: adult.life_child_grows_horned
  stage: adult
  scene: home
  weight: 10
  cast:
    kid: { kin: [child], horned: true, min_age: 5, max_age: 12, pick: eldest }
  when:
    age: [32, 46]
    flags: [child_horned]
    not_flags: [child_lives_away]
  text: |
    {kid}โตพอจะถามคำถามที่{name}รอมาตั้งแต่เช้าวันที่สามหลังลูกมาถึงบ้าน ถามตอนกินข้าวเย็น ระหว่างคำ เหมือนถามเรื่องฝน

    "ทำไมหัวหนูไม่เหมือนหัวคนอื่น"

    บ่ายวันนั้นลูกกลับมาจากริมน้ำ ผมเปียก มือข้างหนึ่งกดอยู่บนหัวตลอดทาง ไม่ร้องไห้ แต่ไม่ยอมบอกว่าเด็กคนอื่นพูดว่าอะไร ข้าวในชามของลูกยังไม่ได้แตะ
  choices:
    - id: tell_about_saw
      label: เล่าความจริงเรื่องคืนที่เลื่อยเขา
      requires: { flag: child_horns_sawn }
      text: |
        {name}เล่าทุกอย่าง เช้าวันที่สาม กะละมังน้ำอุ่น ตุ่มแข็งสองตุ่มใต้ผมเปียก แล้วก็คืนนั้น {kid}ฟังจนจบ เอานิ้วคลำหาตอเขาใต้ผมของตัวเองจนเจอทั้งสองข้าง กดเบาๆ เหมือนกดรอยช้ำ

        แล้วถามว่าถ้าไม่เลื่อย ตอนนี้จะยาวเท่าไหน {name}ชูนิ้วให้ดูหนึ่งข้อ ลูกชูนิ้วชี้ขึ้นมาวางไว้บนหัวตัวเอง ตรงตอเขาทั้งสองข้าง ดูเงาตัวเองบนผนังอยู่พักหนึ่ง แล้วกินข้าวต่อจนหมดชาม
      effects: { alignment: { moral: 1 }, flags: [told_child_about_saw] }
    - id: teach_the_wrap
      label: สอนลูกพันผ้าโพกหัวแบบที่วิ่งแล้วไม่หลุด
      requires: { flag: child_hidden }
      text: |
        พันรอบแรกให้ตึงที่หน้าผาก รอบที่สองให้ทับตรงตุ่มสองตุ่มพอดี แล้วผูกปมสองชั้นไว้ท้ายทอย ไม่ใช่ใต้คาง เพราะปมใต้คางเด็กข้างหลังกระตุกทีเดียวก็หลุด {name}สอนสามคืน {kid}พันเองได้ในคืนที่สาม

        ลูกถามว่าต้องพันไปจนโตไหม {name}บอกว่าไม่รู้ วันต่อมาลูกวิ่งแข่งกับเด็กข้างบ้านจากริมน้ำไปจนถึงสะพาน ผ้าไม่หลุด ลูกชนะ
      effects: { stats: { DEX: 1 }, flags: [taught_child_the_wrap] }
    - id: lamp_check_together
      label: พาลูกไปรับการตรวจห้าปีของศาสนจักรตะเกียงด้วยกัน
      requires: { flag: child_horns_kept }
      text: |
        นักล่าแม่มดถาม{kid}สามคำถามเดียวกับที่ถามผู้ใหญ่ทุกคนในหน้าผู้ต้องตรา ฝันถึงใคร ได้ยินเสียงอะไรตอนกลางคืน ไปที่ไหนมาบ้าง ลูกตอบทีละข้อ ฝันถึงปลาตัวใหญ่ ได้ยินเสียงหนูวิ่งในฝ้า ไปริมน้ำ เขาจดทุกคำ

        ก่อนปิดสมุด ลูกถามกลับว่าแล้วเขาฝันถึงใคร ปากกาของนักล่าแม่มดค้างอยู่เหนือกระดาษ เขาไม่ได้จดคำถามนั้น ขากลับลูกจูงมือ{name}เดินทั้งทาง ปกติลูกไม่ยอมจูงแล้ว
      effects: { alignment: { law: 1 }, flags: [child_lamp_checked] }
    - id: touch_my_head
      label: ก้มหัวลงข้ามโต๊ะ ให้ลูกเอามือวางบนหัวของ{name}
      requires: { trait: curse_brand }
      text: |
        {kid}เอื้อมมือข้ามชามข้าวมาวาง นิ้วเล็กๆ คลำผ่านผมของ{name}ไปช้าๆ จนเจอของแบบเดียวกับที่อยู่บนหัวตัวเอง แล้วหยุด กดดู ลูบดู กดอีกที

        ลูกบอกว่าของ{name}ใหญ่กว่า {name}บอกว่ามีมานานกว่า ลูกถามว่าเด็กริมน้ำรู้ไหมว่าผู้ใหญ่ก็มี {name}บอกว่าไม่รู้ ลูกหัวเราะ แล้วเริ่มกินข้าว
      effects: { alignment: { moral: 1 }, flags: [child_touched_your_horns] }
    - id: not_their_business
      label: บอกว่าหัวของลูกไม่ใช่เรื่องของเด็กริมน้ำ แล้วตักข้าวเติมให้
      text: |
        {kid}กินข้าวที่เติมให้จนหมดชาม ไม่ถามอีก วันต่อมาไม่ไปริมน้ำ วันต่อไปก็ไม่ไป

        วันที่สี่{name}เห็นลูกเดินออกจากบ้านไปทางริมน้ำอีกครั้ง หลังตรง มือข้างหนึ่งกำก้อนหินกลมไว้ก้อนหนึ่ง อีกข้างว่าง ไม่ได้กดอยู่บนหัว
      effects: { stats: { STR: 1 }, flags: [child_went_back_to_river] }

- id: adult.life_old_bully
  stage: adult
  weight: 10
  when:
    age: [33, 40]
  text: |
    คนทวงหนี้คนใหม่ของวิหารเบเลคเดินถนนสายนี้ทุกวันแรกของเดือน ตัวใหญ่ เสื้อคลุมสีเทา ถือสมุดดำ เคาะประตูทีละบ้านด้วยหัวไม้เท้าเหล็ก {name}จำเสียงหัวเราะได้ก่อนจำหน้า เด็กคนนั้นเคยดักรอ{name}ที่หัวทางทุกเย็นตอนเด็ก แย่งของ ผลักลงโคลน แล้วหัวเราะเสียงนี้

    เช้านี้เขาหยุดหน้าบ้านหญิงม่ายที่อยู่ถัดไปสองหลัง นางค้างสามเหรียญ เขาจะยึดจักรปั่นด้ายของนางไปแทน นางยืนกอดจักรไว้ทั้งตัว {name}เห็นว่ามือที่ถือสมุดของเขาสั่น ปลายนิ้วขาวซีดกลางแดด
  choices:
    - id: pay_widow
      label: จ่ายสามเหรียญแทนหญิงม่าย
      requires: { min_gold: 3 }
      text: |
        เขารับสามเหรียญ เขียนคำว่าครบท้ายบรรทัดของหญิงม่าย แล้วเงยหน้าขึ้นมาเห็นหน้า{name}เต็มๆ เป็นครั้งแรก หัวเราะเสียงเดิม บอกว่าจำได้ เด็กที่วิ่งไม่เคยพ้นหัวทาง

        เขาเดินไปเคาะประตูบ้านถัดไปโดยไม่หันกลับมา บ่ายวันนั้นเสียงจักรปั่นด้ายดังลอดหน้าต่างบ้านหญิงม่ายออกมาจนค่ำ
      effects: { gold: -3, alignment: { moral: 1 }, flags: [paid_widows_debt] }
    - id: block_the_door
      label: ไปยืนขวางระหว่างเขากับจักรปั่นด้าย
      check: { stat: STR, dc: 13 }
      success:
        text: |
          {name}ยืนอยู่ตรงนั้น ไม่ขยับ เขาตัวใหญ่กว่า แต่มือที่ถือไม้เท้าสั่นจนหัวเหล็กเคาะพื้นเป็นจังหวะ เขาดูหน้า{name} แล้วดูมือตัวเอง

          เขาบอกว่าเดือนหน้าจะมาใหม่ แล้วหันหลังเดินไป ตอนเดินไป{name}เห็นว่าเขาซุกมือทั้งสองข้างไว้ใต้รักแร้ ไม้เท้าเหล็กหนีบไว้ใต้แขน
        effects: { stats: { STR: 1 }, reputation: { belek_bank: -1 }, flags: [faced_old_bully] }
      failure:
        text: |
          เขาเอาหัวไม้เท้าดันอก{name}ทีเดียว {name}ถอยหลังไปสะดุดขอบทาง ล้มลงในรางน้ำข้างถนน น้ำเย็นซึมเข้าเสื้อถึงหลัง เขาหัวเราะเสียงเดิม เหมือนเย็นวันหนึ่งเมื่อสามสิบปีก่อน

          แล้วยกจักรปั่นด้ายขึ้นบ่า เดินไปตามถนน หญิงม่ายยื่นมือมาดึง{name}ขึ้นจากราง ดึงไม่ขึ้นในครั้งแรก
        effects: { hp: -1, reputation: { belek_bank: -1 }, flags: [faced_old_bully] }
    - id: ask_his_cold
      label: ถามเขาว่าปลายนิ้วหนาวมากี่เดือนแล้ว
      check: { stat: INT, dc: 13 }
      success:
        text: |
          เขาหยุดมือที่กำลังจะยกจักร ถามว่ารู้ได้อย่างไร {name}ชี้ปลายนิ้วของเขา เขาซุกมือเข้าแขนเสื้อ แล้วบอกว่าเก้าเดือน เขาติดหนี้วิหารสี่สิบเหรียญตั้งแต่ร้านไม้ของเขาไฟไหม้ งานทวงหนี้ได้ส่วนแบ่งทุกบ้านที่ทวงได้

          เขาเปิดสมุดดำ เขียนเพิ่มไว้ใต้บรรทัดของหญิงม่ายว่าผ่อนผันหนึ่งเดือน บรรทัดเดิมยังอยู่ครบ ไม่ได้ขีดทิ้ง แล้วเขาก็เดินไปเคาะประตูบ้านถัดไป
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [bully_gave_a_month] }
      failure:
        text: |
          เขาหันมาถามว่าเรื่องของใคร แล้วยกจักรปั่นด้ายขึ้นบ่า ตอนเดินผ่าน{name} เขาเอาไหล่กระแทกเหมือนตอนเด็ก แรงไม่เท่าตอนเด็กแล้ว

          {name}ยืนอยู่ที่เดิม หญิงม่ายนั่งลงบนขั้นบันไดหน้าบ้าน มือสองข้างวางบนตักตรงที่จักรเคยอยู่
        effects: { alignment: { moral: 1 }, flags: [faced_old_bully] }

- id: adult.life_body_aches
  stage: adult
  scene: home
  weight: 10
  when:
    age: [34, 40]
    not_flags: [race_elf, race_dwarf]
  text: |
    เช้าวันหนึ่ง{name}ก้มลงผูกเชือกรองเท้า แล้วยืดตัวกลับขึ้นมาไม่ได้ หลังค้างอยู่ตรงนั้นเหมือนบานพับขึ้นสนิม ต้องเอามือยันเข่าทีละข้าง ไต่ขึ้นมาทีละคืบ พอยืนตรงได้ น้ำในกาที่ตั้งไว้ก็เดือดจนแห้ง

    ช่วงนี้ร่างกายเริ่มทวงของคืน เข่าลั่นเวลาขึ้นบันได ตัวหนังสือต้องยื่นห่างจากตาขึ้นทุกปี แผลเก่าที่หายไปนานปวดก่อนฝนตก งานวันนี้ยังรออยู่เหมือนทุกวัน
  choices:
    - id: push_through
      label: ไปทำงานตามปกติ ปล่อยให้หลังหายเอง
      habit: stubborn
      check: { stat: CON, dc: 12 }
      success:
        text: |
          หลังคลายเองก่อนเที่ยง ทีละข้อ จนบ่ายก้มเก็บของได้โดยไม่ต้องคิดก่อน เย็นนั้น{name}เดินกลับบ้านตัวตรง

          คืนนั้นนอนหงายบนพื้นกระดาน ไม่ได้นอนบนฟูก หนุนหมอนใต้เข่า ท่านอนนี้{name}ใช้ต่อมาทุกคืน ไม่บอกใครว่าเพราะอะไร
        effects: { stats: { CON: 1 } }
      failure:
        text: |
          บ่ายนั้น{name}ก้มลงยกของชิ้นหนึ่ง หลังลั่นดังจนคนข้างๆ หันมา แล้ว{name}ก็ล้มลงคุกเข่าอยู่ตรงนั้น ยืนไม่ขึ้น คนสองคนต้องช่วยหามกลับบ้าน

          ตั้งแต่นั้นหลังของ{name}ลั่นทุกครั้งที่อากาศเปลี่ยน ก่อนจะยกอะไรขึ้นจากพื้นต้องย่อเข่าก่อน ไม่ก้ม เด็กข้างบ้านทำท่าตามแล้วหัวเราะ
        effects: { hp: -2, flags: [bad_back] }
    - id: bonesetter
      label: จ่ายสามเหรียญให้หมอนวดกระดูกหลังตลาด
      requires: { min_gold: 3 }
      text: |
        หมอนวดกระดูกเป็นหญิงร่างเล็กแขนใหญ่ ให้{name}นอนคว่ำบนแคร่ไม้ ใช้นิ้วโป้งไล่กระดูกสันหลังขึ้นมาทีละข้อ จนถึงข้อที่ทำให้{name}ร้อง แล้วเอาเข่ากดลงตรงนั้นทีเดียว เสียงดังกร๊อบไปทั้งห้อง

        นางรับสามเหรียญ แล้วยื่นสายรัดเอวหนังวัวสองชั้นให้หนึ่งเส้น บอกว่าใส่ตอนยกของ ไม่ต้องใส่ตอนนอน หลังของ{name}จะไม่หายขาด แค่จะลืมไปพักหนึ่ง
      effects: { gold: -3, items: [back_brace] }
    - id: lie_flat
      label: นอนพักบนพื้นกระดานแข็งสามวัน ไม่ไปทำงาน
      text: |
        สามวันนั้น{name}นอนดูเพดาน นับรอยแตกได้สี่สิบเอ็ดรอย นับซ้ำได้สี่สิบสาม ฟังเสียงถนนข้างนอกจนแยกได้ว่าเสียงเท้าไหนเป็นของใคร ค่าแรงสามวันนั้นหายไป

        เช้าวันที่สี่{name}ลุกขึ้นได้ในครั้งเดียว ผูกเชือกรองเท้าโดยนั่งลงบนเก้าอี้ก่อน
      effects: { hp: 2, flags: [rested_the_back] }
    - id: partner_walks
      label: ให้{partner}ถอดรองเท้าขึ้นไปเหยียบหลังให้
      requires: { flag: married }
      text: |
        {partner}เกาะขอบโต๊ะ ขึ้นไปยืนบนหลัง{name}ทีละเท้า เดินจากเอวขึ้นไปถึงสะบักช้าๆ หลังลั่นสามครั้ง ครั้งที่สามดังจน{partner}สะดุ้งเกือบตก แล้วหัวเราะจนต้องลงมานั่งกับพื้น

        หลังจากวันนั้น ทุกเช้าวันพักงาน{partner}ถามว่าจะเหยียบไหม {name}ตอบว่าไม่ต้องทุกครั้ง แล้วก็นอนคว่ำลงทุกครั้ง
      effects: { hp: 1, flags: [partner_walks_your_back] }

- id: adult.life_partner_sick
  stage: adult
  scene: home
  weight: 10
  when:
    age: [33, 40]
    flags: [married]
    not_flags: [partner_died]
  text: |
    {partner}เริ่มไอตอนปลายหน้าฝน ไอแห้งๆ ทีละสองสามที ใครถามก็บอกว่าฝุ่น พอหน้าหนาวมาถึง ไอกลายเป็นไอลึก ตื่นกลางดึกมานั่งหอบอยู่ขอบเตียง ผ้าเช็ดหน้ามีจุดแดงเล็กๆ ที่{p:เขา|เธอ}พับซ่อนไว้ในกระเป๋า {name}เจอตอนซักผ้า

    หมอในเมืองคิดค่าดูหกเหรียญ บอกไว้ก่อนว่ายาที่ดีที่สุดคือพักกับอากาศอุ่น หมอยาในถิ่นมีน้ำมันห่านไว้ทาอก ไม่คิดเงิน ส่วน{partner}ยังลุกไปทำงานทุกเช้า
  choices:
    - id: town_doctor
      label: จ่ายหกเหรียญพา{partner}ไปหาหมอในเมือง
      requires: { min_gold: 6 }
      text: |
        หมอในเมืองเอาท่อทองเหลืองแนบอก{partner}ฟังทีละข้าง ฟังข้างขวานานกว่าข้างซ้าย แล้วบอกว่าปอดยังดี แค่เหนื่อยเกิน ให้หยุดงานจนหมดหน้าหนาว ให้ยาขวดเล็กมาสองขวด ขมจน{partner}ทำหน้าเหมือนกินมะนาวทั้งลูก

        พอหน้าร้อน{partner}กลับไปทำงานได้ ไอเหลือแต่ตอนเช้า เสียงไอนั้นกลายเป็นเสียงที่{name}ใช้ปลุกตัวเองแทนไก่ขัน
      effects: { gold: -6, flags: [partner_recovered] }
    - id: nurse_all_winter
      label: ลางานมาเฝ้าเองทั้งหน้าหนาว ต้มน้ำ ทาอก ไม่ให้ลุกจากเตียง
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ต้มน้ำให้ไอขึ้นทั้งห้องทุกคืน ทาน้ำมันห่านที่อกกับหลัง{partner}เช้าเย็น ห่มผ้าสามผืน ไม่ให้ลุกแม้แต่ไปตักน้ำ {partner}บ่นทุกวันว่าเหม็นห่าน บ่นว่าเบื่อเพดาน บ่นว่า{name}ทำอาหารเค็ม

          ปลายหน้าหนาวไอหาย บ่นยังไม่หาย {name}ฟังเสียงบ่นนั้นทั้งวันโดยไม่ต่อว่าสักคำ
        effects: { stats: { CON: 1 }, flags: [partner_recovered] }
      failure:
        text: |
          เดือนที่สอง{name}เริ่มไอตาม สองคนนอนไอแข่งกันคนละฟากเตียง ผลัดกันลุกไปต้มน้ำ เพื่อนบ้านเอาซุปมาวางไว้หน้าประตูวันเว้นวัน ไม่ยอมเข้ามา

          หน้าร้อนทั้งคู่ลุกได้ {partner}หายก่อนหนึ่งเดือน แล้วเป็นฝ่ายบังคับให้{name}นอนต่อ ทาน้ำมันห่านให้ทุกเย็น บ่นว่าเหม็น
        effects: { hp: -2, flags: [partner_recovered] }
    - id: extra_shift
      label: รับงานเพิ่มอีกกะ ให้{partner}ได้หยุดทั้งหน้าหนาว
      text: |
        {name}ทำสองกะทั้งหน้าหนาว ได้นอนวันละสี่ชั่วยาม ค่าแรงกะเพิ่มหักค่าฟืนกับค่าน้ำมันห่านแล้วยังเหลือสองเหรียญ {name}วางมันไว้ใต้หมอนของ{partner} บอกว่าเป็นค่าจ้างให้นอน

        {partner}หายไอตอนต้นหน้าร้อน เอาสองเหรียญนั้นมาคืนบนโต๊ะ บอกว่านอนจนเบื่อ ไม่อยากได้ค่าจ้าง
      effects: { gold: 2, stats: { STR: 1 }, flags: [partner_recovered] }

- id: adult.life_partner_gone
  stage: adult
  scene: home
  weight: 4
  mark: "{partner}จากไป"
  when:
    age: [34, 40]
    flags: [married]
    not_flags: [partner_recovered]
  text: |
    เย็นวันพักงาน{partner}ออกไปซื้อเกลือที่ร้านหัวมุม บอกว่าเดี๋ยวเดียว หม้อแกงบนเตายังเดือดอยู่ตอนที่{name}เริ่มรู้สึกว่านานเกินไป

    คนในถนนเจอ{p:เขา|เธอ}นั่งพิงกำแพงอยู่ไม่ไกลจากร้าน ห่อเกลือวางอยู่บนตัก ตาปิด หน้าตาเหมือนคนนั่งพักเหนื่อย หมอที่มาดูบอกว่าหัวใจหยุดไปเฉยๆ ไม่ได้เจ็บนาน ต่อให้ใครอยู่ข้างๆ ก็ทำอะไรไม่ทัน

    หลังงานศพ ห่อเกลือห่อนั้นยังวางอยู่บนโต๊ะในครัว {name}ยังไม่ได้แกะ
  choices:
    - id: keep_their_things
      label: เก็บของของ{partner}ไว้ที่เดิมทุกชิ้น
      text: |
        เสื้อของ{partner}แขวนอยู่บนตะปูข้างประตูตัวเดิม รองเท้าวางอยู่ใต้เตียงฝั่งเดิม ชามใบที่{p:เขา|เธอ}ชอบยังวางซ้อนอยู่บนชั้น ทุกเช้า{name}เดินผ่านเสื้อตัวนั้นก่อนออกจากบ้าน

        หน้าหนาวที่สอง เสื้อของ{name}เองขาดที่ข้อศอก {name}หยิบเสื้อบนตะปูลงมาใส่ไปทำงาน แขนยาวไปนิดหนึ่ง พับขึ้นสองทบก็พอดี
      effects: { stats: { CON: 1 }, clear_flags: [has_partner, married], flags: [partner_died, kept_partners_things] }
    - id: open_the_salt
      label: แกะห่อเกลือ ใส่ลงในหม้อแกงหม้อต่อไป
      text: |
        {name}แกะห่อเกลือในเย็นวันที่เจ็ดหลังงานศพ ตักใส่หม้อแกงหนึ่งช้อน แล้วอีกครึ่งช้อน เพราะ{partner}ชอบเค็ม กินคนเดียวจนหมดหม้อ

        เกลือห่อนั้นหมดในสองเดือน {name}เดินไปซื้อห่อใหม่ที่ร้านหัวมุมร้านเดิม เจ้าของร้านใส่เกลือเพิ่มให้หนึ่งกำมือ ไม่ได้บอกว่าทำไม
      effects: { stats: { CON: 1 }, clear_flags: [has_partner, married], flags: [partner_died] }
    - id: sell_and_go
      label: ขายของที่ใช้ร่วมกัน แล้วย้ายไปอยู่ที่อื่น
      text: |
        เตียงกับโต๊ะขายได้สองเหรียญ ชามสองใบที่วางซ้อนกันบนชั้น{name}ไม่ได้ขาย ห่อผ้าใส่ย่ามไปด้วยทั้งสองใบ

        ห้องใหม่เล็กกว่า อยู่อีกฝั่งของถิ่น ไม่มีร้านหัวมุม ไม่มีกำแพงที่ต้องเดินผ่านทุกเย็น ชามสองใบวางซ้อนกันบนชั้นห้องใหม่ ใบบนใช้ทุกวัน ใบล่างไม่ได้ใช้
      effects: { gold: 2, stats: { STR: 1 }, clear_flags: [has_partner, married], flags: [partner_died, moved_house] }

- id: adult.life_back_home
  stage: adult
  weight: 10
  when:
    age: [33, 40]
    not_flags: [job_farmer, job_bough_crafter]
  text: |
    ปีนั้น{name}กลับไปถิ่นที่เกิดเป็นครั้งแรกในรอบหลายปี ไม่มีงานศพหรืองานประจำปีให้ไป แค่ตื่นมาเช้าวันหนึ่งแล้วอยากไป

    ทางเข้าถิ่นเปลี่ยนไปหมด ร้านขายเชือกหัวทางกลายเป็นโกดัง บ้านที่เคยมีหมาดุกลายเป็นที่ว่าง คนที่เดินสวนมาเป็นหน้าใหม่ทั้งนั้น คนที่{name}รู้จักก็จำไม่ได้จนต้องบอกชื่อ เด็กกลุ่มหนึ่งเล่นอยู่ตรงที่{name}เคยเล่น เล่นเกมเดียวกัน กติกาเพี้ยนไปหนึ่งข้อ
  choices:
    - id: farm_rails
      label: เดินไปที่รางรถไฟหลังบ้านเงาเสา
      requires: { flag: origin_farm }
      text: |
        ขบวนถ่านยังวิ่งผ่านบ้านเงาเสา แต่วันละสี่เที่ยวแล้ว ไม่ใช่สองเที่ยว เด็กสามคนเดินไล่เก็บถ่านที่หล่นตามหินโรยรางใส่กระสอบ เดินกันกลางวันแสกๆ ไม่มีใครห้าม

        {name}ยืนดูจนขบวนต่อไปผ่านมา ลมจากหัวรถจักรพัดฝุ่นถ่านขึ้นมาถึงหน้า เด็กคนเล็กที่สุดยื่นถ่านก้อนหนึ่งให้{name} บอกว่าอุ่นดี
      effects: { stats: { STR: 1 }, flags: [went_back_home] }
    - id: refinery_pot
      label: ไปยืนหน้าโรงกลั่นที่มีหม้อเบอร์เก้า
      requires: { flag: origin_refinery }
      text: |
        ประตูโรงกลั่นยังลงกลอนจากข้างนอกระหว่างกะเหมือนเดิม {name}ยืนอยู่หน้าประตู ได้ยินเสียงขวดกระทบกันลอดออกมา ใต้เสียงนั้นมีเสียงต่ำอีกเสียงหนึ่ง เสียงเดียวกับที่ดังอยู่ใต้ทุกเสียงในย่านนี้มาตั้งแต่{name}จำความได้

        ตอนหวูดเปลี่ยนกะดัง คนงานเดินออกมาเป็นแถว เด็กหญิงอายุราวสิบขวบคนหนึ่งเดินอยู่ท้ายแถว หลังมือซ้ายพันผ้าไว้ทั้งมือ ถาม{name}ว่ามาหางานหรือ
      effects: { stats: { INT: 1 }, world: { star: 1 }, flags: [went_back_home] }
    - id: dwarf_name_wall
      label: ไปหาชื่อตัวเองบนกำแพงชื่อของตระกูล
      requires: { flag: origin_dwarf_clan }
      text: |
        ชื่อของ{name}อยู่ที่เดิม ร่องสลักเริ่มมีฝุ่นเขม่าจับเป็นเส้นดำ ใต้ชื่อของ{name}มีชื่อใหม่เพิ่มขึ้นมาอีกเก้าชื่อ ชื่อเด็กที่เกิดหลัง{name}ออกจากบ้าน {name}ไล่นิ้วอ่านทีละชื่อ รู้จักแค่สองชื่อ

        ทุกชื่อในแถวนั้นมีที่ว่างข้างๆ ไว้สลักปีตาย เหมือนชื่อของ{name} {name}เอาแขนเสื้อเช็ดเขม่าออกจากร่องชื่อตัวเอง แล้วเช็ดให้ชื่อที่อยู่ข้างล่างอีกเก้าชื่อด้วย
      effects: { stats: { CON: 1 }, flags: [went_back_home] }
    - id: elf_pine
      label: ไต่ลงไปดูต้นสนที่ปลูกไว้โคนต้นแม่ในวันที่ตัวเองเกิด
      requires: { flag: origin_elf_bough }
      text: |
        ต้นสนของ{name}อยู่ที่โคนต้นแม่ ปลูกไว้ตั้งแต่วันที่{name}เกิด ใต้ร่มกิ่งใหญ่ที่แดดลงมาไม่ถึงพื้น สามสิบกว่าปีจึงโตได้แค่สูงกว่าหัวของ{name}ช่วงแขนเดียว ลำต้นเท่าข้อมือ

        {name}นั่งพิงต้นสนจนมืด ดาวลอดช่องใบไม้ของต้นแม่ลงมาเป็นจุดเล็กๆ แน่นจนหาความมืดระหว่างดวงไม่เจอ ยอดสนของ{name}ยังอยู่ต่ำกว่ากิ่งล่างสุดของต้นแม่อีกหลายสิบช่วงตัว
      effects: { stats: { DEX: 1 }, flags: [went_back_home] }
    - id: kept_well
      label: ไปนั่งที่ขอบบ่อน้ำกลางบ้านโรงสีบน
      requires: { flag: origin_marked_kept }
      text: |
        ผู้หญิงที่มาตักน้ำตอนเช้ายังมีสิบกว่าคนเหมือนเดิม คนละรุ่นกับเมื่อก่อน ไม่มีใครหยุดมือตอน{name}เดินเข้ามา คนรุ่นนี้จำไม่ได้แล้วว่าเมื่อสามสิบกว่าปีก่อนเคยมีคนอุ้มเด็กมายืนตรงนี้แล้วถามว่าใครมีอะไรจะพูด

        มีเด็กเล็กคนหนึ่งเกาะขอบบ่ออยู่ข้างแม่ ผ้าคลุมหัวหลวม เขาสองตุ่มเล็กโผล่ออกมาตรงขอบผ้า แม่ของเด็กไม่ได้จัดผ้าให้ ตักน้ำต่อไปเหมือนไม่มีอะไร
      effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [went_back_home] }
    - id: mansion_gate
      label: ไปยืนหน้าประตูเหล็กของคฤหาสน์
      requires: { flag: origin_marked_hidden }
      text: |
        คฤหาสน์เปลี่ยนเจ้าของแล้ว ป้ายที่ประตูเป็นชื่อเจ้าของโรงกลั่น หลังคาทุกด้านมีจานรับดาวหงายรับฟ้า สี่สิบสองห้องจุดตะเกียงฟ้าทุกห้อง ไม่มีห้องไหนคลุมผ้าขาว

        คนเฝ้าประตูถามว่ามาหาใคร {name}บอกว่าเคยอยู่ที่นี่ เขาหัวเราะ บอกว่าที่นี่ไม่เคยมีใครอยู่ก่อนนายคนนี้ แล้วปิดประตูเหล็กลงกลอน
      effects: { stats: { DEX: 1 }, flags: [went_back_home] }
    - id: bread_hatch
      label: เดินไปที่ช่องส่งขนมปังข้างกำแพงวิหาร
      requires: { flag: origin_marked_foundling }
      text: |
        ช่องส่งขนมปังยังไม่ลงกลอนเหมือนเดิม ขอบไม้สึกเป็นมันเพราะมือคนที่ยื่นอะไรต่ออะไรเข้าไปมาสามร้อยปี {name}ยื่นมือเข้าไปในช่องนั้นได้แค่ถึงข้อศอก ตะกร้าใบหนึ่งลอดเข้าไปได้พอดี

        {name}ซื้อขนมปังจากร้านในเมืองมาก้อนหนึ่ง วางลงในช่อง แล้วเดินกลับก่อนเช้า เหมือนคนที่เคยมาวางของไว้ตรงนี้ทุกคน
      effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [went_back_home] }
    - id: stilt_house
      label: ปีนบันไดเรือนเก่าในบ้านหญ้าเงิน
      requires: { flag: origin_ashland }
      text: |
        เรือนหลังเดิมยังยกพื้นสูงเท่าหัวคน บันไดยังพับเก็บได้ทุกขั้น คนที่อยู่ตอนนี้เป็นครอบครัวคนขุดถ่านที่เพิ่งย้ายมา ลูกสามคน มีเขาสองคน เขายอมหย่อนบันไดให้{name}ขึ้นไปดู เพราะในบ้านหญ้าเงิน ใครบอกว่าเคยเกิดในเรือนไหน คนในเรือนนั้นต้องให้ขึ้น

        ร่องกระดานที่แสงแดงเคยลอดขึ้นมาตอนกลางคืนยังอยู่ตรงเดิม มีคนเอาผ้าอุดไว้แล้ว {name}นั่งลงบนพื้นตรงนั้นพักหนึ่ง ก่อนลงบันไดตอนแดดยังไม่หมด
      effects: { stats: { DEX: 1 }, flags: [went_back_home] }
    - id: buy_a_sweet
      label: ซื้อขนมจากร้านเดียวที่ยังเปิดอยู่ แล้วนั่งกินตรงที่เคยนั่ง
      requires: { min_gold: 1 }
      text: |
        ร้านขนมร้านเดียวที่ยังเปิดอยู่เป็นของลูกสาวคนขายคนเดิม หนึ่งเหรียญได้ขนมห่อเดียว ตอนเด็กหนึ่งเหรียญได้สามห่อ รสเหมือนเดิมทุกอย่าง ยกเว้นหวานน้อยลงนิดหนึ่ง

        {name}นั่งแกะห่อบนขั้นบันไดหน้าร้าน เด็กที่เล่นอยู่ตรงนั้นเดินมายืนดู {name}แบ่งให้คนละก้อน เหลือก้อนสุดท้ายไว้กินเอง
      effects: { gold: -1, flags: [went_back_home] }
    - id: walk_back
      label: เดินกลับก่อนมืด ไม่แวะที่ไหน
      text: |
        {name}เดินผ่านถิ่นจากปลายด้านหนึ่งไปถึงอีกด้าน ไม่ได้หยุดคุยกับใคร ไม่ได้แวะบ้านไหน ตรงที่เคยเป็นบ้านหมาดุ มีหมาตัวใหม่นอนอยู่ ไม่เห่า

        ขากลับเดินเร็วกว่าขาไป ถึงที่พักตอนค่ำ เท้าพองข้างหนึ่ง
      effects: { stats: { CON: 1 }, flags: [went_back_home] }

- id: adult.life_apprentice
  stage: adult
  weight: 10
  when:
    age: [33, 40]
  text: |
    หลังวันเลือกทางของถิ่นปีนั้น มีเด็กสองคนมานั่งรอ{name}หน้าบ้านตั้งแต่ฟ้ายังไม่สาง ทั้งสองคนไม่มีใครเลือกในวันนั้น คนหนึ่งตัวเล็ก ขาเป๋ข้างหนึ่ง ยกของหนักไม่ไหว อีกคนตัวสูงแข็งแรง ผ้าโพกหัวพันแน่นจนเห็นรอยนูนสองจุดใต้ผ้า

    ทั้งคู่ขอตามไปทำงานด้วย ไม่ขอค่าแรง ขอแค่ข้าวกับที่นอน เด็กขาเป๋พูดเก่ง พูดแทนทั้งสองคน เด็กที่พันผ้าโพกหัวไม่พูดสักคำ ยืนจับสายย่ามแน่น
  choices:
    - id: take_horned
      label: รับเด็กที่พันผ้าโพกหัว
      text: |
        เด็กคนนั้นเงียบมาจนถึงเย็นวันที่สาม ทำทุกอย่างที่บอก ทำซ้ำเองจนมือจำได้โดยไม่ต้องสั่งซ้ำ เย็นวันที่สามถามคำแรกว่าพรุ่งนี้ต้องมากี่โมง

        ปลายปีมีคนในถิ่นมาถามว่า{name}เลี้ยงลูกมารไว้ในบ้านทำไม {name}บอกว่าไม่ได้เลี้ยง จ้าง เด็กคนนั้นได้ยิน คืนนั้นพันผ้าโพกหัวหลวมลงหนึ่งรอบ
      effects: { alignment: { moral: 1 }, flags: [took_horned_apprentice] }
    - id: take_the_talker
      label: รับเด็กขาเป๋ที่พูดเก่ง
      text: |
        เด็กขาเป๋ยกของหนักไม่ไหวจริง แต่จำได้หมดว่าใครติดเงินเท่าไร ใครสั่งของวันไหน ใครพูดว่าจะมาแล้วไม่มา ไม่ถึงครึ่งปีงานของ{name}เป็นระเบียบกว่าเดิม เพราะมีคนจำแทน

        {name}ต้องหัดอธิบายทุกอย่างเป็นคำพูด เพราะเด็กคนนี้ไม่ยอมทำอะไรที่ไม่รู้ว่าทำไปทำไม
      effects: { stats: { INT: 1 }, flags: [took_lame_apprentice] }
    - id: show_my_horns
      label: แกะผ้าคลุมหัวของตัวเองออกให้เด็กที่พันผ้าโพกหัวดู
      requires: { trait: curse_brand }
      text: |
        เด็กคนนั้นจ้องหัวของ{name}ไม่วางตา แล้วค่อยๆ แกะผ้าโพกหัวของตัวเองออกทีละรอบ เขาสองข้างยาวเกือบเท่านิ้วก้อย มีรอยมีดขูดอยู่ที่โคน เหมือนมีคนพยายามจะเอาออกแล้วเลิกกลางคัน

        {name}รับทั้งสองคน เด็กขาเป๋พูดแทนทั้งคู่เหมือนเดิม เด็กมีเขาพันผ้าโพกหัวกลับเหมือนเดิมทุกเช้า แต่ถอดวางไว้บนตะปูข้างประตูทุกครั้งที่เข้าบ้าน{name}
      effects: { alignment: { moral: 1 }, flags: [took_horned_apprentice, took_lame_apprentice] }
    - id: no_room
      label: บอกว่างานของตัวเองยังไม่มีที่ให้ใคร
      text: |
        เด็กสองคนลุกขึ้นพร้อมกัน เด็กขาเป๋ขอบคุณที่ฟัง เด็กที่พันผ้าโพกหัวเดินไปก่อน ไม่หันกลับมา

        เดือนต่อมา{name}เห็นเด็กขาเป๋นั่งจดของให้ร้านขายเกลือในตลาด ส่วนเด็กอีกคน{name}ไม่เห็นอีกเลยในถิ่นนี้
      effects: { stats: { CON: 1 }, flags: [turned_away_apprentices] }

- id: adult.life_street_fire
  stage: adult
  weight: 10
  when:
    age: [33, 40]
  text: |
    ไฟลุกขึ้นตอนตีสองที่บ้านหลังที่สามถัดไป ตะเกียงล้มใส่กองผ้าหรือเตาลืมดับ ถามกันทีหลังก็ไม่ได้คำตอบเดียวกัน เสียงคนตะโกนปลุกทั้งถนน ลมพัดมาทางบ้าน{name} สะเก็ดไฟลอยข้ามหลังคาบ้านหลังที่สองมาแล้ว

    บ้านที่ไฟไหม้ยังมีเสียงคนเรียกอยู่ชั้นบน เสียงหญิงแก่ เรียกชื่อแมว น้ำอยู่ห่างไปห้าสิบก้าว ถังในถนนนับได้ไม่ถึงสิบใบ
  choices:
    - id: run_in
      label: ถีบประตูเข้าไปหาคนที่ยังเรียกอยู่ชั้นบน
      habit: hot_headed
      check: { stat: STR, dc: 13 }
      success:
        text: |
          ประตูหลุดจากบานพับในทีเดียว ควันข้างในหนาจนต้องคลานขึ้นบันได หญิงแก่นั่งอยู่หัวบันได กอดแมวไว้ในผ้าห่ม {name}แบกทั้งคนทั้งแมวลงมาโดยไม่ได้ถาม ข้างหลังมีเสียงคานหลังคาหักลงมาตอนเท้าแตะพื้นล่าง

          หญิงแก่ไม่ยอมปล่อยแมวจนเช้า แมวไม่ยอมปล่อยนาง ผมของ{name}ไหม้ไปครึ่งหัว ทั้งถนนเรียก{name}ว่าคนหัวไหม้ไปอีกหลายเดือน
        effects: { stats: { STR: 1 }, alignment: { moral: 1 }, flags: [saved_fire_neighbor] }
      failure:
        text: |
          {name}ขึ้นไปได้ครึ่งบันได คานไม้ลุกไฟร่วงลงมาพาดแขนซ้าย ร้อนเหมือนคว้าเหล็กออกจากเตา {name}ร่วงกลับลงมาถึงพื้น คลานออกจากประตูได้เอง

          คนข้างนอกพาดบันไดขึ้นทางหน้าต่างชั้นบน ลากหญิงแก่ออกมาได้พร้อมแมว แผลไฟไหม้ที่แขนของ{name}หายในสองเดือน ทิ้งรอยหนังย่นยาวเท่าฝ่ามือไว้ตลอดไป
        effects: { hp: -2, alignment: { moral: 1 }, flags: [fire_scar_arm] }
    - id: bucket_line
      label: ตะโกนให้คนเข้าแถวส่งถังน้ำต่อกัน
      text: |
        {name}จับแขนคนที่วิ่งผ่านทีละคน ดันให้ไปยืนเป็นแถวตั้งแต่ที่น้ำถึงหน้าบ้านที่ไหม้ ถังเก้าใบส่งต่อกันไปจากมือถึงมือ ขากลับส่งถังเปล่าทางแถวที่สอง จนไม่มีใครต้องวิ่ง

        ไฟไม่ลามไปถึงบ้านหลังที่สอง คนข้างบนออกมาได้ทางหน้าต่าง ตอนสางทั้งแถวนั่งลงกับพื้นตรงที่ยืน มือทุกคนพองเหมือนกันหมด
      effects: { stats: { STR: 1 }, flags: [led_bucket_line] }
    - id: wet_own_roof
      label: ปีนขึ้นราดน้ำหลังคาบ้านตัวเองก่อนไฟจะลามมา
      text: |
        {name}ส่งถังขึ้นหลังคาเองทีละใบ ราดจนหลังคาเปียกโชก ตบสะเก็ดไฟที่ปลิวมาตกด้วยผ้าเปียกทีละสะเก็ด จนมือดำ

        บ้านหลังที่สามไหม้หมดทั้งหลัง บ้านหลังที่สองไหม้ไปครึ่งหลัง บ้านของ{name}ไม่เป็นอะไร เช้านั้นเจ้าของบ้านหลังที่สองยืนมองหลังคาเปียกของ{name}อยู่พักหนึ่ง แล้วเดินกลับไปขนของที่เหลือ
      effects: { stats: { DEX: 1 }, flags: [saved_own_roof] }

- id: adult.life_pillar_visit
  stage: adult
  weight: 10
  when:
    age: [33, 40]
    not_flags: [origin_dwarf_clan]
  text: |
    คนพูดกันมาแต่ไหนแต่ไรว่าทุกคนควรได้ไปแตะเสาฟ้าสักครั้งก่อนตาย ปีนี้{name}ได้ไป ไปถึงเสาต้นที่ใกล้ที่สุดในบรรดาเสาที่ยังยืนเต็มต้น ทางช่วงสุดท้ายมีคนเดินไปทางเดียวกันเป็นสาย บางคนเดินมาครึ่งเดือน บางคนเดินมาครึ่งวัน คนแก่ถือไม้เท้า แม่อุ้มลูก คนป่วยนอนมาบนแคร่หาม

    เสาฟ้าใกล้ๆ ไม่เหมือนเสาที่เห็นบนขอบฟ้า เสากว้างจนเดินรอบไม่หมดในวันเดียว ผิวหินสีกระดูกขึ้นเงาเฉพาะตรงระดับมือ เพราะมือคนแตะตรงนั้นมาหลายพันปี ส่วนยอดหายเข้าไปในเมฆ แถวคนที่ต่อคิวรอแตะยาวจนต้องรอถึงบ่าย
  choices:
    - id: touch_it
      label: ต่อคิวจนถึงตา แล้ววางฝ่ามือลงบนหิน
      text: |
        หินเย็นกว่าน้ำในลำธารหน้าหนาว แดดบ่ายส่องอยู่บนหลังมือก็ไม่ช่วย {name}วางมือไว้จนนิ้วชา ไม่มีอะไรเกิดขึ้น ไม่มีเสียง ไม่มีแสง มีแต่หินที่เย็นอยู่อย่างนั้นมาก่อนจะมีใครเกิด

        ชายแก่ที่ต่อคิวข้างหลังร้องไห้ตั้งแต่ยังไม่ทันแตะ ฝ่ามือของ{name}เย็นอยู่สามวัน กินข้าวก็เย็น จับมือใครก็เย็น
      effects: { world: { gods: 1 }, stats: { CON: 1 }, flags: [touched_a_pillar] }
    - id: touch_bareheaded
      label: ถอดผ้าคลุมหัว แล้ววางฝ่ามือลงบนหินแบบเดียวกับคนอื่น
      requires: { trait: curse_brand }
      text: |
        คนในแถวข้างหน้าหันมาเห็นหัวของ{name} แล้วขยับห่างออกไปหนึ่งช่วงแขน แม่คนหนึ่งดึงลูกไปไว้อีกฝั่ง แต่ไม่มีใครบอกให้ออกจากแถว {name}รอจนถึงตา แล้ววางฝ่ามือลงบนหิน

        หินเย็นเท่าเดิม เย็นเหมือนที่ทุกคนบอก ตอนยกมือออก รอยฝ้าจากฝ่ามือของ{name}จางหายไปจากผิวหิน พร้อมกับรอยมือของหญิงที่แตะอยู่ข้างๆ เร็วเท่ากัน
      effects: { world: { gods: 1 }, alignment: { moral: 1 }, flags: [touched_a_pillar] }
    - id: leave_a_candle
      label: จ่ายหนึ่งเหรียญซื้อเทียนจากแผงข้างทาง ปักไว้ที่โคนเสาแทนการต่อคิว
      requires: { min_gold: 1 }
      text: |
        แผงข้างทางขายเทียนเล่มละหนึ่งเหรียญ แพงกว่าในตลาดสิบเท่า ที่โคนเสามีเทียนปักไว้เป็นพันเล่ม ขี้ผึ้งที่ละลายทับถมกันมาหลายร้อยปีกลายเป็นเนินแข็งสูงถึงเข่า

        {name}ปักเทียนของตัวเองไว้บนเนินนั้น จุดไฟ แล้วยืนดูจนเปลวไฟนิ่ง ลมที่โคนเสาไม่แรง เทียนเล่มนั้นยังไม่ดับตอน{name}เดินกลับ
      effects: { gold: -1, alignment: { law: 1 }, flags: [left_pillar_candle] }
    - id: look_up
      label: นอนลงบนพื้นที่โคนเสา มองตามเสาขึ้นไปจนสุดตา
      text: |
        {name}นอนหงายบนหญ้าห่างจากแถวไปหน่อย มองตามผิวหินขึ้นไปจนเสาเรียวเล็กลงเหลือเท่าเส้นด้ายแล้วหายเข้าไปในเมฆ ดูนานจนเวียนหัว รู้สึกเหมือนพื้นเอียง

        ค่ำนั้นเมฆเปิด ดาวขึ้นรอบเมฆตรงที่เสาหายเข้าไป {name}พยายามดูว่ายอดเสาไปแตะฟ้าตรงไหน ดูจนหลับไปบนหญ้า ตื่นมาตอนสางยังไม่เห็น
      effects: { stats: { INT: 1 }, flags: [looked_up_the_pillar] }

# ปลายวัยสามสิบ เรื่องร่วมที่ไม่ผูกกับงานหรือถิ่น เติมช่วงก่อนถึงสี่สิบ

- id: adult.life_called_uncle
  stage: adult
  weight: 8
  when:
    age: [36, 40]
    not_flags: [race_elf]
  text: |
    เด็กหนุ่มคนนั้นไม่ได้ตั้งใจจะทำร้ายใคร เขาแค่อยากขอทาง

    "{ลุง|ป้า}ครับ ขอผ่านหน่อย"

    {name}หันไปดูข้างหลังก่อน ว่าเขาพูดกับใคร ข้างหลังไม่มีใคร

    เด็กหนุ่มแบกลังผ่านไปแล้ว ผิวปากไปด้วย ไม่รู้ตัวเลยว่าเพิ่งทำอะไรลงไป {name}ยังยืนอยู่ที่เดิม เมื่อเช้าตอนล้างหน้าก็ยังเป็นคนเดิมกับเมื่อวาน อย่างน้อยก็เท่าที่เห็นในน้ำ
  choices:
    - id: laugh
      label: หัวเราะออกมาดังๆ
      text: |
        {name}หัวเราะจนคนขายของข้างทางหันมามอง แล้วก็เอาไปเล่าให้ใครต่อใครฟังทั้งเดือน เล่าทีไร เด็กหนุ่มในเรื่องก็หน้าทะเล้นขึ้นอีกนิด ลังที่แบกก็ใหญ่ขึ้นอีกหน่อย

        คนฟังหัวเราะด้วยทุกคน คนที่อายุมากกว่า{name}หัวเราะนานกว่าเพื่อน
      effects: { stats: { CHA: 1 } }
    - id: look_closer
      label: กลับไปดูหน้าตัวเองให้ชัดกว่าในน้ำ
      text: |
        {name}ยืมกระจกเงาบานเล็กมาส่องตรงที่แดดลงเต็ม รอยที่หางตาไม่หายไปตอนเลิกยิ้มแล้ว ร่องข้างปากลึกพอให้เงาลงได้ หลังมือมีเส้นเลือดนูนเหมือนมือของคนที่{name}เคยเรียกว่า{ลุง|ป้า}เองเมื่อนานมาแล้ว

        {name}คืนกระจก ขอบคุณเจ้าของ แล้วเดินกลับช้ากว่าขามา ตลอดทางคอยมองหน้าคนที่เดินสวน ลองเดาอายุทีละคน
      effects: { stats: { WIS: 1 } }
    - id: outwork_him
      label: เดินตามไปคว้าลังอีกใบ แบกแข่งกับเด็กนั่น
      habit: stubborn
      check: { stat: STR, dc: 13 }
      success:
        text: |
          {name}แบกลังใบที่ใหญ่กว่าขึ้นบ่า เดินแซงเด็กหนุ่มไปถึงเกวียนก่อนสามช่วงตัว วางลงโดยไม่หอบให้เห็น เหงื่อไหลเข้าตาก็ไม่เช็ด

          เด็กหนุ่มมองลัง มองหน้า{name} แล้วยิ้มกว้าง "{ลุง|ป้า}แรงดีนะครับ"

          คำนั้นยังอยู่ที่เดิม แต่คราวนี้มีคำว่าแรงดีต่อท้าย
        effects: { stats: { STR: 1 } }
      failure:
        text: |
          ลังขึ้นถึงบ่าได้ แต่ก้าวที่สี่มีอะไรบางอย่างในเอวขยับผิดที่ {name}วางลังลงช้าๆ ทำเป็นว่าตั้งใจวางตรงนั้น

          เด็กหนุ่มวิ่งกลับมายกต่อให้โดยไม่ต้องขอ แถมถามว่านั่งพักก่อนไหมครับ {name}นั่ง
        effects: { hp: -1, stats: { WIS: 1 } }

- id: adult.life_asked_for_advice
  stage: adult
  weight: 8
  when:
    age: [37, 40]
  text: |
    เด็กสาวคนนั้นอายุสิบเจ็ด มายืนรอตั้งแต่{name}ยังไม่เลิกงาน ไม่ใช่ญาติ ไม่ใช่ลูกศิษย์ แค่เด็กแถวนี้ที่เห็นหน้ากันมาตั้งแต่เธอยังต้องเขย่งมองข้ามโต๊ะ

    เรื่องที่จะถามใช้เวลาอ้อมอยู่นาน เธอถามเรื่องงานก่อน ถามเรื่องฝนฟ้า แล้วจึงหลุดออกมาว่ามีคนชวนไปทำงานที่อื่น ไกล ไปแล้วคงไม่ได้กลับมาอีกหลายปี ที่บ้านไม่ให้ไป

    "ถ้าเป็นตอนอายุเท่าหนู จะไปไหมคะ"

    ไม่มีใครเคยถาม{name}ด้วยน้ำเสียงแบบนี้มาก่อน เสียงของคนที่จะเอาคำตอบไปใช้จริง
  choices:
    - id: say_go
      label: บอกว่าไป
      text: |
        เด็กสาวไปในเดือนถัดมา ออกเดินทางก่อนสาง ไม่ได้ลาใคร แม่ของเธอเลิกทักทาย{name}ไปทั้งปี

        ปีต่อมามีห่อผ้าฝากมากับคนเดินทาง ข้างในเป็นมีดปอกผลไม้ด้ามกระดูกจากเมืองที่{name}ไม่เคยไป กับกระดาษแผ่นเดียว ลายมือโย้ไปทางขวาเหมือนเขียนบนเข่า ที่นี่ฝนตกทุกวัน ไม่เสียใจ
      effects: { stats: { CHA: 1 }, flags: [told_youth_to_go] }
    - id: say_stay
      label: บอกว่าอยู่
      text: |
        เด็กสาวพยักหน้าช้าๆ เหมือนได้ยินคำที่เดาไว้แล้ว ขอบคุณ แล้วเดินกลับไปทางบ้าน

        เธออยู่ ปีถัดมาแต่งงานกับคนแถวนี้ ทุกครั้งที่เจอกันเธอยังยิ้มให้เหมือนเดิม {name}ไม่เคยถามว่าคิดถูกไหม เธอก็ไม่เคยบอก
      effects: { stats: { WIS: 1 }, flags: [told_youth_to_stay] }
    - id: tell_own_story
      label: ไม่ตอบ เล่าเรื่องตอนตัวเองอายุสิบเจ็ดให้ฟังแทน
      text: |
        {name}เล่าตามที่เกิด ไม่ได้ตัดตอนที่น่าอายออก ไม่ได้เติมตอนที่ฟังดูดี เล่าจนตะเกียงต้องเติมน้ำมัน เด็กสาวฟังโดยไม่ขัดสักคำ

        พอเล่าจบเธอถามคำเดียวว่า แล้วเสียใจไหม {name}ตอบไปตามจริง เธอขอบคุณ แล้วเดินกลับ

        อีกหลายเดือน{name}จึงรู้ว่าเธอเลือกทางไหน และจนเดี๋ยวนี้ก็ยังไม่แน่ใจว่าคำตอบคืนนั้นดันเธอไปทางนั้น หรือทางตรงข้าม
      effects: { stats: { INT: 1 } }

- id: adult.life_small_thief
  stage: adult
  weight: 8
  when:
    age: [36, 40]
  text: |
    มือที่ล้วงเข้ามาในย่ามของ{name}เล็กกว่าที่ควร และยังไม่ชำนาญ นิ้วไปเกี่ยวเชือกรูดปากถุงเงินแล้วติดอยู่ตรงนั้น

    {name}คว้าข้อมือไว้ได้ เจ้าของมือเป็นเด็กอายุราวแปดเก้าขวบ ผอมจนกำข้อมือได้รอบแล้วนิ้วยังเหลือ ไม่ดิ้น ไม่ร้อง ยืนนิ่งแบบคนที่เคยโดนจับมาแล้ว รู้ว่าดิ้นไปก็เท่านั้น ตาจ้องอยู่ที่ถุงเงิน ไม่ได้มองหน้า{name}เลย

    คนรอบข้างยังไม่ทันสังเกต
  choices:
    - id: feed
      label: ไม่ปล่อยมือ จูงไปซื้อข้าวให้กินก่อน
      habit: soft_heart
      requires: { min_gold: 1 }
      text: |
        เด็กกินข้าวสองชามโดยไม่เงยหน้า ชามที่สามกินช้าลง มือซ้ายกำขอบชามไว้ตลอดเหมือนกลัวมีคนมาเอาคืน {name}ถามชื่อ เด็กไม่บอก ถามว่าอยู่ที่ไหน เด็กชี้ไปทางที่ไม่มีบ้านคน

        กินเสร็จ เด็กยืนขึ้น มอง{name}อยู่อึดใจหนึ่ง แล้ววิ่งหายไป หลังจากวันนั้น ย่ามของ{name}ไม่เคยมีใครล้วงอีก ทั้งที่ของคนอื่นแถวนี้ยังหายกันอยู่เรื่อยๆ
      effects: { gold: -1, alignment: { moral: 1 }, flags: [fed_small_thief] }
    - id: show_how
      label: กระซิบบอกว่าพลาดตรงไหน แล้วล้วงให้ดูหนึ่งที
      requires: { trait: light_fingers }
      text: |
        {name}ไม่ได้ปล่อยข้อมือ แค่ก้มลงพูดเบาๆ ว่าเชือกรูดต้องใช้สองนิ้วถ่างออกก่อน ไม่ใช่เกี่ยว แล้วอย่าจ้องถุง ให้มองไปทางอื่นเหมือนกำลังหาคน

        เด็กไม่เชื่อ {name}จึงยื่นของชิ้นหนึ่งให้ดู เป็นเชือกผูกผมของเด็กเอง ที่เมื่อครู่ยังอยู่บนหัว ตาของเด็กโตขึ้นเท่าตัว

        "อย่าล้วงคนที่มือเปื้อนเท่าเรา" {name}ว่า แล้วปล่อยมือ เด็กหายเข้าไปในฝูงคนเงียบกว่าตอนมา
      effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [taught_small_thief] }
    - id: let_go
      label: ปล่อยมือ ทำเป็นไม่เห็น
      text: |
        {name}คลายนิ้ว ข้อมือเล็กๆ นั้นหลุดออกไปเร็วกว่าปลา เด็กไม่ได้วิ่ง เดินถอยหลังสองก้าวก่อน ตายังจับอยู่ที่{name} เหมือนรอดูว่าเป็นกลลวงหรือเปล่า แล้วจึงหันหลัง

        ถุงเงินยังอยู่ครบ {name}รูดเชือกให้แน่นขึ้น แล้วย้ายย่ามมาสะพายไว้ข้างหน้า
      effects: { stats: { WIS: 1 } }
    - id: call_watch
      label: ตะโกนเรียกยาม
      habit: cold_blood
      text: |
        ยามมาถึงเร็วกว่าที่คิด คว้าคอเสื้อเด็กยกขึ้นจนปลายเท้าลอย ถามว่าหายไปเท่าไร {name}ตอบว่ายังไม่หาย ยามว่าก็ดีแล้ว แล้วลากเด็กไปทางหอยาม

        เด็กไม่ร้องสักคำตลอดทาง หันมามอง{name}ครั้งเดียวก่อนเลี้ยวมุม สายตานั้นไม่ได้โกรธ แค่จำ
      effects: { alignment: { law: 1, moral: -1 }, flags: [turned_in_small_thief] }

- id: adult.life_storm_guest
  stage: adult
  scene: home
  time: night
  weight: 8
  when:
    age: [38, 40]
  text: |
    เสียงเคาะประตูมาตอนฝนหนักที่สุดของคืน เคาะสามที เว้น แล้วอีกสามที แบบคนที่ยังมีมารยาทเหลืออยู่ทั้งที่เปียกถึงกระดูก

    ชายที่ยืนอยู่ใต้ชายคาไม่ใช่คนแถวนี้ เสื้อคลุมยาวกรอมเท้า โคลนขึ้นมาถึงเข่า สะพายกล่องไม้ทรงยาวที่ห่อผ้าชุบน้ำมันไว้แน่นหนากว่าที่ห่อตัวเอง เขาขอแค่พื้นแห้งข้างเตาจนกว่าฟ้าจะสาง บอกว่ามีเงินจ่าย แล้วแบมือให้ดูเหรียญสามเหรียญที่เปียกพอๆ กับเขา

    ข้างนอกมืดจนมองไม่เห็นว่ามีใครมากับเขาอีกหรือเปล่า
  choices:
    - id: let_in
      label: เปิดประตูให้เข้ามา
      text: |
        ชายคนนั้นนอนขดข้างเตา กอดกล่องไม้ไว้ทั้งคืน ไม่ถอดรองเท้า ไม่ขออะไรเพิ่ม

        ก่อนสางฝนหยุด {name}ตื่นมาเจอที่ข้างเตาว่าง ประตูแง้ม เขาอยู่ข้างนอก ตั้งท่อทองเหลืองบนขาตั้งสามขา ตาขวาแนบปลายท่อ มือซ้ายรูดลูกปัดไม้บนเชือกไปทีละเม็ด ปากไม่ขยับ

        พอฟ้าเริ่มซีดเขาก็เก็บของ วางสามเหรียญไว้บนขอบเตา ก่อนไปเขาบอกว่าฟ้าทางนี้มืดดี ในเมืองนับไม่ได้แล้ว
      effects: { gold: 3, alignment: { moral: 1 }, flags: [hosted_star_counter] }
    - id: sit_up
      label: ให้เข้ามา แต่นั่งเฝ้าทั้งคืนไม่หลับ
      check: { stat: CON, dc: 12 }
      success:
        text: |
          ราวตีสามฝนหยุด ชายคนนั้นลุกขึ้นเงียบๆ แบกกล่องออกไป {name}ตามไปยืนที่ประตู เขาประกอบท่อทองเหลืองยาวเท่าแขนเข้ากับขาตั้ง เล็งขึ้นไปตรงช่องที่เมฆขาด แล้วรูดลูกปัดบนเชือกไปทีละเม็ด ไม่ออกเสียงสักคำ

          เขารู้ว่ามีคนดูอยู่ รูดจนสุดเชือกแล้วจึงถอยออกมา ผายมือให้ {name}แนบตาลงไป ในวงกลมเล็กๆ นั้นมีดาวมากกว่าที่เคยเห็นทั้งชีวิตรวมกัน

          "พวกที่ริบหรี่นั่นเพิ่งมา" เขาว่า "ยังไม่มีใครตั้งชื่อให้"
        effects: { gold: 3, stats: { INT: 1 }, flags: [hosted_star_counter, looked_through_the_tube] }
      failure:
        text: |
          {name}จำได้ว่านั่งพิงผนัง มือวางบนด้ามมีด ตาจับอยู่ที่คนแปลกหน้าข้างเตา แล้วก็จำได้ว่าแดดส่องหน้า

          ที่ข้างเตาว่างแล้ว พื้นตรงนั้นเช็ดจนแห้ง สามเหรียญวางเรียงกันบนขอบเตา ประตูลงกลอนจากข้างในเรียบร้อย {name}เดินดูทั้งบ้านสองรอบ ไม่มีอะไรหาย และหาไม่เจอว่าเขาออกไปทางไหน
        effects: { gold: 3, stats: { WIS: 1 } }
    - id: read_him
      label: ดูโคลนที่รองเท้ากับมือของเขาก่อนตอบ
      requires: { trait: hunter_eye }
      text: |
        โคลนที่เข่าเป็นดินแดงของทางสันเขา เดินมาอย่างน้อยสามวัน มือไม่มีหนังด้านของคนใช้แรง ปลายนิ้วกลางเปื้อนหมึกจนล้างไม่ออก รอบตาขวามีรอยกดเป็นวงจางๆ เหมือนเอาปากถ้วยครอบไว้ทุกคืน

        โจรไม่มีรอยอย่างนั้น {name}เปิดประตูกว้าง แล้วถามว่านับได้เท่าไรแล้ว

        ชายคนนั้นชะงัก แล้วหัวเราะเป็นครั้งแรก คืนนั้นไม่มีใครได้นอน เขาเล่าเรื่องฟ้าของแต่ละถิ่นที่เดินผ่าน ที่ไหนมืดพอ ที่ไหนสว่างจนนับไม่ได้ ก่อนไปเขาจ่ายสามเหรียญ แล้วบอกตัวเลขหนึ่งตัวที่ขอให้{name}อย่าเอาไปพูดดังๆ
      effects: { gold: 3, stats: { WIS: 1 }, flags: [hosted_star_counter, knows_the_count] }
    - id: refuse
      label: ชี้ทางไปที่พักคนเดินทาง แล้วปิดประตู
      text: |
        ชายคนนั้นพยักหน้า กล่าวขอบคุณทั้งที่ไม่ได้อะไร แล้วเดินกลับเข้าไปในฝน {name}ลงกลอน ยืนฟังเสียงฝีเท้าจนกลืนหายไปกับเสียงน้ำ

        เช้ามาบนเนินหลังบ้านมีรูเล็กๆ สามรูในโคลน ห่างเท่ากันเป็นสามเหลี่ยม กับลูกปัดไม้ตกอยู่เม็ดหนึ่ง
      effects: { alignment: { law: 1 }, flags: [turned_away_star_counter] }
