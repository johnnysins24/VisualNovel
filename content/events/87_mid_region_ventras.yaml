# วัยกลางคน: ถิ่นเวนทราส (batch 4 package A)
# ห้าเรื่องของคนวัยสี่สิบถึงหกสิบที่อยู่เมืองหลวง ส่วนใหญ่อยู่ริมคลองของย่านโรงกลั่น ข้อห้ามของแม่น้ำเฒ่า (river)
# อ่านได้ทั้งคนที่โตในย่านและคนที่ย้ายมาทีหลัง ตัวเลือกที่ต้องรู้จักย่านแต่เด็กกันด้วย origin_refinery

- id: adult.region_ventras_night_dye
  stage: adult
  weight: 22
  when:
    age: [41, 56]
    location_tag: ventras
  text: |
    คลองหลังตึกแถวของ{name}เปลี่ยนสีทุกเช้า เมื่อวานเขียวขี้ม้า วันก่อนสีสนิม เช้านี้ม่วงจนมองไม่เห็นปลา สีมาจากโรงย้อมผ้าหัวคลอง ติดผ้าในมือคนซักแล้วล้างไม่ออก ยายที่ซักผ้าที่ท่าน้ำย้ายกระดานซักหนีไปแล้วสามบันได

    นายโรงย้อมเป็นเจ้าของตึกแถวทั้งแถวด้วย สภาย่านเพิ่งส่งคนมาตักน้ำตรงปากท่อของโรงย้อมไปตรวจ ตรวจเจอสีเมื่อไรจะปรับ เขาจึงเลิกเทจากท่อของตัวเอง แล้วเดินบอกลูกบ้านทีละห้อง ห้องไหนรับน้ำย้อมไปเทจากบันไดหลังห้องตัวเองคืนละถัง หลังตะวันตกดิน ห้องนั้นไม่ต้องจ่ายค่าเช่าทั้งฤดู

    บันไดหลังห้องของ{name}อยู่ตรงคุ้งที่น้ำไหลแรงที่สุด สีจะไปไกลก่อนเช้า เขาจึงมาห้องนี้เป็นห้องแรก ยืนพิงกรอบประตูรอคำตอบ มือทั้งสองข้างม่วงไปถึงข้อศอก
  choices:
    - id: refuse_the_dye_vats
      label: ไม่รับ จ่ายค่าเช่าเต็มฤดูเหมือนเดิม
      text: |
        นายโรงย้อมยักไหล่ บอกว่าห้องข้างๆ รับแล้ว แล้วเดินไปห้องถัดไป ตกค่ำ{name}ได้ยินเสียงถังเหล็กกระทบบันไดห้องข้างๆ ตามด้วยเสียงน้ำเทลงคลองครั้งเดียว ยาวเท่าลมหายใจหนึ่ง

        ปลายฤดูทั้งแถวมีแค่สองห้องที่ยังจ่ายค่าเช่าเต็ม เช้าวันหนึ่งยายซักผ้าย้ายกระดานกลับมาที่บันไดหลังห้อง{name} บอกว่าน้ำตรงนี้ใสอยู่ได้ยาวเท่าแขน พอซักปลอกหมอนได้หนึ่งใบ
      effects:
        gold: -3
        taboo: { river: keep }
        flags: [refused_the_dye_vats]
    - id: pour_the_dye
      label: รับ คืนละถัง ไม่ต้องจ่ายค่าเช่าทั้งฤดู
      text: |
        ถังน้ำย้อมมาวางหน้าห้องทุกเย็น ตัวถังยังอุ่น {name}รอจนตะเกียงฟ้าทั้งแถวติด แล้วแบกถังลงบันได เทหมดในครั้งเดียว น้ำย้อมแผ่ออกไปในคลองเป็นปื้นสีเข้ม คุ้งน้ำพาไปเร็วอย่างที่นายโรงย้อมบอกจริง

        ทั้งฤดู{name}ไม่ได้จ่ายค่าเช่าสักเหรียญ บันไดขั้นล่างสุดหลังห้องติดสีม่วงล้างไม่ออก ฝ่ามือของ{name}ก็เหมือนกัน ทุกเช้ายายซักผ้าเดินผ่านบันไดนั้นไปโดยไม่หยุด ไม่หันมาทางบันได ไม่หันมาทางคน
      effects:
        gold: 4
        taboo: { river: break }
        flags: [poured_dye_after_dark]
    - id: pour_before_sunset
      label: ขอเทตอนตะวันยังไม่ตก ในช่วงที่เรือตรวจของสภาย่านพายไปพ้นคุ้ง
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          {name}นั่งจดรอบเรือตรวจอยู่สามวัน เรือมาตอนบ่ายแก่ แล้วพายย้อนกลับมาอีกทีตอนตะวันจะตก ระหว่างนั้นมีช่องว่างยาวเท่าเวลาต้มน้ำหนึ่งกา {name}แบกถังลงบันไดในช่องนั้นทุกวัน เทหมดก่อนเรือโผล่พ้นคุ้ง ไม่เคยพลาด นายโรงย้อมบอกว่าเทกลางวันเขาเสี่ยงกว่า ลดค่าเช่าให้ได้แค่ครึ่ง

          ยายซักผ้าเห็นทุกครั้ง แล้วก้มหน้าซักผ้าต่อ ตะวันยังไม่ตก ยายไม่มีข้อไหนจะว่า
        effects:
          stats: { DEX: 1 }
          gold: 2
          flags: [poured_dye_before_sunset]
      failure:
        text: |
          วันที่สามเรือตรวจมาเร็วกว่าทุกวัน โผล่พ้นคุ้งตอนถังยังเอียงค้างอยู่ในมือ{name} คนตรวจชี้ปื้นสีในน้ำ แล้วชี้ขึ้นมาที่บันได เขาปรับคนที่ถือถัง ไม่ได้ปรับโรงย้อม

          นายโรงย้อมไม่ช่วยจ่ายค่าปรับสักเหรียญ บอกว่าเขาไม่เคยสั่งให้ใครเทตอนกลางวัน ถังเปล่าใบนั้นไม่มีใครมาเก็บ ฝนตกลงไปครึ่งถัง น้ำในถังเป็นสีม่วงอ่อน
        effects:
          gold: -2
          flags: [poured_dye_before_sunset, fined_on_the_canal]
    - id: sell_the_dye_dregs
      label: บอกนายโรงย้อมให้พักน้ำย้อมไว้ในถังข้ามคืน แล้วขายตะกอนให้ร้านหมึกท้ายย่าน
      requires: { flag: origin_refinery }
      text: |
        ตอนเด็ก{name}เคยวิ่งส่งของให้ร้านหมึกท้ายย่าน ร้านนั้นซื้อตะกอนสีจากก้นถังทุกชนิดไปต้มทำหมึก นายโรงย้อมไม่เคยรู้ เขาไม่ได้โตในย่านนี้ {name}พาเขาไปถึงหน้าร้าน คนแก่ในร้านเอานิ้วจุ่มน้ำย้อมสีม่วง คลึงกับนิ้วโป้ง แล้วบอกราคาเป็นถัง นายโรงย้อมต่อราคาอยู่ครึ่งวัน ได้ไม่เท่าค่าเช่าที่จะยกให้ลูกบ้าน แต่ไม่ต้องกลัวเรือตรวจอีก

        ถังน้ำย้อมเรียงพักอยู่หลังโรงย้อมทั้งคืน เช้ามาน้ำใสข้างบนตักเทลงคลองตอนสาย ตะกอนข้างล่างขึ้นเกวียนไปร้านหมึก ค่าเช่าของ{name}เต็มเหมือนเดิม ฤดูนั้นประกาศของสภาย่านที่ติดหัวท่าพิมพ์ด้วยหมึกม่วงเข้มทุกแผ่น
      effects:
        stats: { INT: 1 }
        taboo: { river: keep }
        flags: [sold_the_dye_dregs]

- id: adult.region_ventras_wash_pipe
  stage: adult
  weight: 22
  when:
    age: [44, 60]
    location_tag: ventras
  text: |
    ช่างของโรงกลั่นเจาะผนังด้านคลองมาตั้งแต่เช้า เสียงสว่านเหล็กดังทะลุมาถึงห้องของ{name} ตกบ่ายท่อเหล็กหัวงอท่อนหนึ่งโผล่ออกมาจากผนัง ปากท่อก้มลงหาน้ำ ห่างจากบันไดท่าน้ำไม่ถึงสิบก้าว

    ยายที่ซักผ้าที่ท่าน้ำนั่งดูกันครบทุกคน ไม่มีใครต้องถาม หม้อกลั่นต้องล้างทุกคืนหลังกะสุดท้าย น้ำล้างหม้อเคยตักใส่ถังขึ้นเกวียนไปเทที่ปากแม่น้ำตอนเช้า ต่อไปนี้จะไหลลงคลองตรงนี้ ตอนกลางคืน ตอนที่ไม่มีใครเห็น

    ตกเย็นหัวหน้าช่างมายืนที่หัวบันได ขอคนช่วยขันข้อต่อท่อตอนกลางคืนสองคืน จ่ายดี ถามมาทาง{name}เพราะ{name}ยืนอยู่ใกล้ที่สุด ยายคนหนึ่งบนบันไดหันมาทาง{name}ด้วย ไม่ได้หันไปทางหัวหน้าช่าง
  choices:
    - id: plug_the_wash_pipe
      label: รอจนสองยาม แล้วเอาดินเหนียวอุดปากท่อ
      text: |
        {name}ยืมเรือบดของยายซักผ้า พายไปถึงใต้ปากท่อก่อนน้ำล้างหม้อจะมา เอาดินเหนียวยัดจนแน่น ขอบท่อเหล็กบาดนิ้วไปสองนิ้ว พอกะสุดท้ายเลิก น้ำร้อนดันดินเหนียวหลุดออกมาเป็นก้อน {name}อุดใหม่อีกสองรอบจนรุ่ง

        เช้ามาหัวหน้าช่างเจอรอยดินเหนียวที่ปากท่อ เจอรอยเลือดด้วย ทั้งย่านรู้ว่าใครเดินนิ้วพันผ้า ผู้จัดการโรงกลั่นส่งชื่อ{name}ไปบอกโรงอื่นในสมาคม ส่วนยายซักผ้าตั้งถังดินเหนียวไว้ที่หัวบันไดหนึ่งถัง ใครผ่านไปตอนสองยามก็หยิบไปได้
      effects:
        hp: -1
        reputation: { distillers: -1 }
        taboo: { river: keep }
        flags: [plugged_the_wash_pipe]
    - id: fit_the_wash_pipe
      label: รับงานขันข้อต่อท่อสองคืน
      text: |
        งานไม่ยาก ข้อต่อสามจุด ประเก็นหนังสองแผ่น หัวหน้าช่างถือตะเกียงให้ {name}ขันจนน้ำไม่ซึม คืนที่สองท่อเปิดใช้ น้ำล้างหม้อไหลลงคลองเป็นสายสีเทา ไอขึ้นจางๆ กลิ่นหวานติดจมูก{name}ไปจนถึงเช้า

        ค่าแรงจ่ายครบตอนเช้า ยายซักผ้าย้ายกระดานขึ้นไปซักที่บันไดเหนือน้ำ ไกลออกไปอีกสองท่า หน้าบันไดเดิมเหลือแต่หลักผูกเรือที่ไม่มีเรือผูก
      effects:
        gold: 2
        taboo: { river: break }
        flags: [fitted_the_wash_pipe]
    - id: let_the_pipe_run
      label: ไม่รับงาน แต่ก็ไม่ไปยุ่ง
      text: |
        หัวหน้าช่างได้คนจากโรงอื่นมาขันข้อต่อแทน คืนที่สามท่อเปิดใช้ {name}ได้ยินเสียงน้ำไหลแรงลงคลองตอนสองยาม ไหลอยู่เท่าเวลาหุงข้าวหนึ่งหม้อ แล้วหยุด

        ไม่นานปลาไหลในคลองแถวนั้นก็หายไป เด็กที่เคยตกปลาไหลจากบันไดไปตกที่อื่น ยายซักผ้ามาที่บันไดนั้นทุกเช้าเหมือนเดิม ซักบนขั้นที่สูงขึ้นไปอีกขั้น ไม่ให้น้ำโดนมือ
      effects:
        world: { land: 1 }
        flags: [let_the_wash_pipe_run]
    - id: speak_for_the_steps
      label: ยายท่าน้ำมาขอให้{name}เป็นคนไปพูดกับผู้จัดการโรงกลั่น
      requires: { taboo: { id: river, keeps: true } }
      text: |
        ยายซักผ้ารู้ว่า{name}ไม่เคยเทอะไรลงคลองหลังตะวันตกดิน ไม่เคยเก็บเหรียญแรกของปีไว้กับตัว ยายรู้เพราะเห็นมาทุกปี ยายสามคนเดินตาม{name}ไปที่ห้องผู้จัดการ ยืนเรียงอยู่ข้างหลัง มือยังเปียกน้ำซักผ้า ปล่อยให้{name}พูดคนเดียว {name}ไม่ขอให้ถอดท่อ ขอแค่ให้ล้างหม้อรอบสุดท้ายให้เสร็จก่อนตะวันตกดิน เลื่อนกะไปครึ่งกะ

        ผู้จัดการบ่นเรื่องกะที่ต้องเลื่อน เรื่องค่าแรงที่ต้องจ่ายเพิ่ม แต่แม่ของเขาก็เคยซักผ้าที่ท่าน้ำ เขายอม ท่อเหล็กหัวงอไม่ได้ถอดออก ทุกบ่ายแก่น้ำสีเทาไหลจากปากท่อเท่าเวลาหุงข้าวหนึ่งหม้อ แล้วแห้ง พอตะวันตก ปากท่อมีดินเหนียวอุดไว้ก้อนหนึ่ง ยายซักผ้าเป็นคนปั้น
      effects:
        stats: { CHA: 1 }
        taboo: { river: keep }
        flags: [pipe_runs_before_sunset]

- id: adult.region_ventras_amends
  stage: adult
  weight: 22
  when:
    age: [42, 60]
    location_tag: ventras
  text: |
    เชือกผูกเรือแถวท่าน้ำเปื่อยขาดภายในเจ็ดวัน เชือกป่านเส้นใหม่ก็เปื่อย ปลาไหลลอยหงายท้องขาวอยู่ใต้บันไดทุกเช้า เด็กที่ลงเล่นน้ำขึ้นมามีผื่นแดงตามขา ตะไคร่บนบันไดขั้นล่างสุดเปลี่ยนจากเขียวเป็นเหลือง ผู้ตรวจของสภาย่านมาตักน้ำใส่ขวดไปสามขวด ไม่มีคำตอบกลับมา

    คนที่จำวิธีแก้แบบเก่าได้เหลืออยู่คนเดียว ตาไวเรน คนเรือแก่ที่เลิกพายเรือตั้งแต่มือเริ่มสั่น ตานั่งอยู่บนบันไดขั้นบนสุดทุกวัน บอกใครก็ได้ที่ยอมฟัง ว่าคนที่เคยเทอะไรลงคลองหลังตะวันตกดิน หรือเคยเก็บเหรียญแรกของปีไว้กับตัว ต้องหาบน้ำบ่อเจ็ดถังมาเทคืนตรงที่ตัวเองเคยเท ให้เสร็จก่อนรุ่ง แล้วเหรียญแรกที่หาได้หลังจากนั้นต้องโยนลงน้ำ ถ้าไม่มีใครยอมรับ ก็ต้องมีใครสักคนหาบแทนทั้งคลอง

    บ่อน้ำที่ใกล้ที่สุดคือบ่อหินเก่าที่ลานหัวย่าน เดินไปกลับถังละหลายร้อยก้าว คนที่ผ่านไปมาฟังตาแล้วก็เดินต่อ บางคนหัวเราะ บางคนเดินเร็วกว่าเดิม
  choices:
    - id: carry_my_seven_buckets
      label: หาบน้ำบ่อเจ็ดถังด้วยตัวเอง ไปเทคืนตรงที่{name}เคยเท
      requires: { taboo: { id: river, unbroken: false } }
      text: |
        {name}ออกจากห้องตอนสองยาม ไม้คานยืมมาจากคนขายน้ำ ถังแรกกับถังที่สองยังเดินตัวตรง ถังที่สี่ไหล่เริ่มถลอก ถังที่หกต้องหยุดพักกลางทางสองหน ถังที่เจ็ดเทลงคลองตรงที่{name}เคยเท ตอนฟ้าด้านตะวันออกเริ่มเปลี่ยนสี ตาไวเรนนั่งนับถังอยู่บนบันไดทั้งคืน ไม่ได้หลับ

        สายวันนั้นคนแรกที่จ่ายเงินให้{name}จ่ายเป็นเหรียญทองแดงเหรียญเดียว {name}เดินกลับมาที่ท่าน้ำ โยนเหรียญลงตรงที่เทถังที่เจ็ด เหรียญจมหายไปในน้ำสีขุ่น ตาไวเรนบอกว่าครบแล้ว แล้วขอยืมไหล่{name}ลุกขึ้นจากบันได
      effects:
        hp: -1
        gold: -1
        taboo: { river: mend }
        flags: [carried_the_seven_buckets]
    - id: carry_for_the_canal
      label: ไม่มีใครรับ {name}หาบแทนทั้งคลองเอง
      text: |
        ตาไวเรนให้{name}เทถังละท่า เจ็ดถังเจ็ดท่า เพราะไม่มีใครรู้ว่าใครเคยเทตรงไหน {name}หาบจนรุ่ง ท่าสุดท้ายอยู่หน้าประตูโรงกลั่น ยามเฝ้าประตูถามว่าทำอะไร {name}บอกว่าเทน้ำ ยามว่าคลองก็มีน้ำเยอะอยู่แล้ว สายวันนั้นเหรียญแรกที่{name}ได้ลงไปอยู่ก้นคลองหน้าประตูโรงกลั่น

        ไม่กี่วันต่อมาปลาไหลตัวหนึ่งกลับมาว่ายอยู่ใต้บันได เด็กๆ เห็นก่อนผู้ใหญ่ ตะโกนเรียกกันทั้งแถว เชือกผูกเรือเส้นที่เปลี่ยนใหม่หลังคืนนั้นยังไม่เปื่อยจนถึงปลายฤดู ตาไวเรนลูบเชือกทุกเช้าเหมือนลูบหัวหลาน
      effects:
        stats: { CON: 1 }
        gold: -1
        taboo: { river: keep }
        world: { land: -1 }
        flags: [carried_buckets_for_the_canal]
    - id: trace_the_canal_upstream
      label: เดินทวนคลองขึ้นไป ดูว่ามีอะไรไหลลงมาจากต้นทาง
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}เดินตามสีตะไคร่ขึ้นไป บันไดไหนตะไคร่เหลือง บันไดไหนยังเขียว จนเจอเส้นแบ่งหลังโรงหลอมแก้วแห่งหนึ่ง ใต้กองถ่านมีท่อดินเผาท่อนใหม่โผล่ปากลงคลอง น้ำในท่อเป็นสีเหลืองใสเหมือนน้ำชาอ่อน {name}พาผู้ตรวจของสภาย่านมาดูถึงที่ ผู้ตรวจจดลงสมุด แล้วสั่งให้โรงหลอมปิดปากท่อในเจ็ดวัน

          ตาไวเรนฟังเรื่องท่อจนจบ แล้วถามว่าคนที่ต่อท่อนั้นเคยหาบน้ำคืนหรือยัง {name}ตอบไม่ได้ ตาก็นั่งรอคนหาบต่อไปบนบันไดขั้นเดิม
        effects:
          stats: { INT: 1 }
          flags: [traced_the_canal_upstream]
      failure:
        text: |
          {name}ไต่ไปตามขอบคลองหลังโรงกลั่น ขอบหินลื่นตะไคร่เหลือง {name}ลื่นลงคลองทั้งตัว กลืนน้ำไปอึกใหญ่ ขึ้นมาได้ก็อาเจียนอยู่ครึ่งคืน ผื่นแดงขึ้นตามแขนตามขาแบบเดียวกับเด็กๆ

          ไม่เจอท่ออะไร เจอแต่ประตูเหล็กของโรงกลั่นที่ปิดอยู่ทุกบาน หลานของตาไวเรนเอาใบไม้ต้มมาให้ทาผื่นหม้อหนึ่ง ตาฝากมาบอกว่าคลองรู้ ว่าใครลงไปหาอะไร
        effects:
          hp: -2
          flags: [traced_the_canal_upstream]
    - id: refuse_the_bucket_rite
      label: บอกตาไวเรนว่าน้ำบ่อเจ็ดถังแก้เชือกเปื่อยไม่ได้
      text: |
        ตาไวเรนไม่เถียง บอกว่าก็จริง น้ำบ่อแก้เชือกไม่ได้ เชือกต้องซื้อใหม่ แล้วตาก็นั่งต่อบนบันไดขั้นบนสุด เล่าเรื่องเดิมให้คนถัดไปที่เดินผ่าน

        ปลายฤดูสภาย่านติดป้ายห้ามลงเล่นน้ำที่ท่าแถวนั้น เด็กๆ ไปเล่นท่าอื่นที่ไกลออกไป คนเรือเปลี่ยนไปผูกเรือด้วยโซ่เหล็กแทนเชือก โซ่ขึ้นสนิมสีเหลืองภายในเจ็ดวัน
      effects: { flags: [refused_the_bucket_rite] }

- id: adult.region_ventras_step_rent
  stage: adult
  weight: 22
  when:
    age: [41, 56]
    location_tag: ventras
  text: |
    ป้ายไม้แผ่นใหม่ตอกไว้ที่หัวบันไดท่าน้ำ ตัวหนังสือดำบนพื้นขาว สียังไม่แห้งดี สภาย่านจะเก็บค่าท่าจากทุกห้องที่มีบันไดลงคลอง เก็บตามรอบเรือเหาะที่เข้าหอท่าในเดือนนั้น เดือนไหนเรือเข้ามาก ค่าท่าก็ขึ้นตาม ป้ายไม่ได้บอกว่าบันไดหลังห้องเกี่ยวอะไรกับเรือเหาะ

    คนหนุ่มสาวของแถวยืนอ่านกันเป็นกลุ่ม ช่างย้อม คนงานกะดึก เด็กส่งของ แม่ลูกอ่อนอุ้มลูกมายืนอ่านด้วย อ่านจบทุกคนก็หันมาทางเดียวกัน ทาง{name} คนที่จ่ายค่าเช่ามาหลายแบบกว่าใครในแถว ทั้งแบบรายเดือน แบบรายกะ แบบขึ้นลงตามราคาขนมปัง

    {name}เพิ่งสังเกตตอนนั้นว่าไม่มีใครในกลุ่มนั้นรุ่นเดียวกับตัวเอง คนรุ่นเดียวกันย้ายออกไปจนหมดแถว ไปอยู่เหนือน้ำ ไปอยู่กับลูก ไปอยู่ใต้ดิน
  choices:
    - id: read_the_step_rule
      label: ไปขอดูข้อบังคับฉบับเต็มที่ห้องเสมียนสภาย่าน อ่านเองทุกข้อ
      check: { stat: INT, dc: 14 }
      success:
        text: |
          ข้อบังคับมีสิบเอ็ดข้อ ข้อเจ็ดเขียนว่าบันไดที่ใช้ร่วมกันตั้งแต่สี่ห้องขึ้นไปนับเป็นท่าของย่าน ไม่เก็บค่าท่า เสมียนบอกว่าข้อนี้เขียนไว้ให้ท่าใหญ่หน้าตลาดปลา ไม่ได้เขียนไว้ให้ตึกแถว {name}ถามว่าในข้อเขียนไว้อย่างนั้นหรือเปล่า เสมียนบอกว่าไม่ได้เขียน

          แถวของ{name}ตกลงกันในคืนนั้น ปิดบันไดส่วนตัวห้าบันได ใช้บันไดหลังห้อง{name}ร่วมกันทั้งแถว เช้ามาบันไดหลังห้อง{name}มีคนต่อแถวลงซักผ้า ตักน้ำ ล้างปลา เสียงคุยกันดังขึ้นมาถึงหน้าต่างตั้งแต่ก่อนสาง {name}ตื่นก่อนระฆังกะทุกเช้าโดยไม่ต้องให้ใครปลุก
        effects:
          stats: { INT: 1 }
          flags: [found_the_common_step_rule]
      failure:
        text: |
          ข้อบังคับมีสิบเอ็ดข้อ เขียนด้วยภาษาแบบที่เสมียนเขียนให้เสมียนอ่าน {name}อ่านจบสามรอบ จับความได้ข้อเดียวว่าต้องจ่ายก่อนวันที่สิบของเดือน เสมียนคิดค่าคัดสำเนาอีกหนึ่งเหรียญ คนหนุ่มสาวจ่ายตามป้าย {name}ก็จ่าย

          หลายเดือนต่อมาตึกแถวฝั่งตรงข้ามคลองปิดบันไดส่วนตัวกันทั้งแถว ใช้บันไดเดียวร่วมกัน ไม่ต้องจ่ายค่าท่าอีก {name}กลับไปเปิดสำเนาที่จ่ายเงินคัดมา ข้อเจ็ดอยู่กลางหน้า ไม่ได้ซ่อนไว้ที่ไหนเลย
        effects:
          gold: -2
          flags: [read_the_step_rule]
    - id: speak_at_the_council
      label: พาคนหนุ่มสาวไปยืนฟังสภาย่านวันประชุม แล้วขอพูด
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          หัวหน้าย่านสี่คนกับคนของราชสำนักหนึ่งคนนั่งเรียงหลังโต๊ะยาว {name}ไม่ถามว่าบันไดเกี่ยวอะไรกับเรือเหาะ ถามว่าเรือเหาะลำไหนเคยมาจอดที่บันไดหลังตึกแถวของย่านโรงกลั่น หัวหน้าย่านท่าเรือเหาะหัวเราะเป็นคนแรก คนที่เหลือหัวเราะตาม

          สภาย่านเลื่อนค่าท่าของย่านโรงกลั่นไปปีหน้า แล้วก็ลืม คนหนุ่มสาวที่ไปยืนฟังวันนั้นเล่าเรื่องนี้ซ้ำกันอยู่หลายหน้าหนาว เล่าทีไรคำถามของ{name}ก็สั้นลงทุกที คมขึ้นทุกที
        effects:
          stats: { CHA: 1 }
          flags: [spoke_at_the_district_council]
      failure:
        text: |
          {name}พูดยาวเกินไป เริ่มจากเรื่องบันได ไปเรื่องเรือเหาะ ไปเรื่องราคาขนมปัง ประธานเคาะค้อนตัดบทตอนยังพูดไม่ถึงครึ่ง เสมียนจดชื่อ{name}ลงช่องผู้พูดเกินเวลา ปรับหนึ่งเหรียญ

          คนหนุ่มสาวช่วยกันออกค่าปรับให้คนละนิด ยื่นให้{name}ที่หน้าห้องประชุม เงินเกินค่าปรับมาอีกนิดหนึ่ง พวกเขาไม่ยอมรับคืน
        effects:
          gold: -1
          flags: [spoke_at_the_district_council]
    - id: keep_the_ship_table
      label: สอนคนหนุ่มสาวจดตารางเรือเหาะล่วงหน้า แล้วหยอดค่าท่าลงโถกลางไว้ทุกเดือน
      text: |
        {name}ไปขอตารางเรือเข้าเดือนหน้าจากเสมียนหอท่า จดลงกระดานดำแผ่นเล็กแขวนไว้ที่หัวบันได เดือนไหนเรือเข้ามาก ทั้งแถวหยอดเงินลงโถกลางมากหน่อย เดือนไหนเรือน้อยก็หยอดน้อย ถึงวันเก็บค่าท่า เงินในโถพอทุกเดือน ไม่มีห้องไหนต้องวิ่งยืมใคร

        ถึงหน้าหนาว ลายมือบนกระดานดำเปลี่ยนเป็นลายมือของเด็กส่งของ ตัวเลขเอียงไปทางขวาทุกตัว
      effects:
        stats: { WIS: 1 }
        flags: [kept_the_ship_table]
    - id: ask_the_washerwomen
      label: พาไปหายายท่าน้ำ ถามว่าบันไดไหนเป็นท่าของทุกคนมาตั้งแต่ก่อนมีสภาย่าน
      requires: { flag: origin_refinery }
      text: |
        {name}โตมากับเสียงยายซักผ้าเถียงกันเรื่องท่า ท่าไหนของใคร ท่าไหนของทุกคน ยายสามคนจำได้ตรงกันว่าบันไดหลังห้อง{name}กับบันไดถัดไปอีกสองบันไดเคยเป็นท่าเดียวกัน ก่อนเจ้าของตึกจะก่อกำแพงกั้น เสมียนสภาย่านไม่เชื่อปากยาย จนยายคนหนึ่งพาลงไปชี้รอยต่อของกำแพงกั้นบันได อิฐคนละสี ปูนคนละเนื้อ

        เสมียนจดบันไดทั้งสามลงทะเบียนเป็นท่าของย่าน ค่าท่าของสามห้องเป็นศูนย์ เย็นนั้นคนหนุ่มสาวในแถวช่วยกันทุบกำแพงกั้นออกด้วยค้อนยืม ยายซักผ้านั่งดูอยู่บนบันได บอกว่าทุบตรงนี้ก่อน ตรงนั้นทีหลัง เหมือนจำได้ว่าก่อไว้อย่างไร
      effects: { flags: [named_the_old_common_step] }

- id: adult.region_ventras_drowned_names
  stage: adult
  weight: 22
  when:
    age: [46, 60]
    location_tag: ventras
  text: |
    ยายเนสซาเสียงหายไปตั้งแต่ต้นหน้าหนาว พูดได้แค่กระซิบ หมอบอกว่าคอยายไม่ได้เป็นอะไร ใช้มามากแล้วก็เท่านั้น

    ทุกปีในคืนแรกที่น้ำลดหลังหน้าฝน คนแถวท่าน้ำมายืนเรียงกันบนบันไดถือตะเกียง คนหนึ่งลงไปยืนบนขั้นล่างสุด น้ำท่วมถึงแข้ง อ่านชื่อคนที่จมน้ำในคลองกับในแม่น้ำปีนั้นทุกชื่อที่รู้ คนเรือ เด็กที่ลงเล่นน้ำ คนเมาที่เดินพลาดตอนกลับจากโรงเหล้า ลูกเรือเหาะที่ตกจากหอท่า อ่านจบชื่อหนึ่ง คนบนบันไดเอ่ยชื่อนั้นซ้ำพร้อมกัน แล้วรอชื่อถัดไป ยายเนสซาอ่านมานานจนไม่มีใครจำได้ว่าก่อนหน้ายายเป็นใคร

    บ่ายนั้นหลานสาวของยายเอากระดาษรายชื่อมาให้{name} ลายมือหลานสาวเอง ชื่อแรกสะกดผิด ยายฝากมาบอกว่าคืนนี้ขอให้{name}เป็นคนลงไปยืนบนขั้นนั้น ไม่ได้ฝากเหตุผลมาด้วย
  choices:
    - id: read_every_name
      label: ลงไปยืนบนขั้นล่างสุด อ่านให้ครบทุกชื่อด้วยเสียงของ{name}เอง
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}แก้ชื่อแรกไว้ในหัวก่อนลงน้ำ ชื่อที่เก้าเป็นชื่อลูกเรือเหาะคนต่างแคว้น ยาวสามพยางค์ {name}ไปถามเพื่อนร่วมเรือของเขาที่หอท่าไว้ตั้งแต่บ่ายว่าออกเสียงอย่างไร พอถึงชื่อนั้น ชายสองคนท้ายบันไดเอ่ยตามเป็นคนแรก เสียงดังกว่าใคร

          อ่านจบชื่อสุดท้าย คนบนบันไดเอ่ยตามพร้อมกัน แล้วปล่อยเทียนลอยลงน้ำทีละบ้าน ยายเนสซายืนอยู่หัวบันได ขยับปากตามทุกชื่อโดยไม่มีเสียง
        effects:
          stats: { CHA: 1 }
          flags: [read_the_drowned_names]
          people: [{ id: washer_nessa, name: เนสซา, gender: f, bond: friend, closeness: 1, age: 86 }]
      failure:
        text: |
          น้ำปลายหน้าฝนเย็นจนแข้งชา อ่านไปได้ครึ่งกระดาษเสียงของ{name}ก็สั่นตามตัว ชื่อหนึ่งหลุดออกไปผิด เมียของคนเรือคนนั้นยืนอยู่บนบันไดขั้นที่สาม เอ่ยชื่อจริงของผัวขึ้นมาแทน คนบนบันไดเอ่ยตามเสียงของนาง ไม่ได้เอ่ยตาม{name}

          {name}อ่านจนจบ ขึ้นจากน้ำมาก็ไอ ไอไปอีกครึ่งเดือน ยายเนสซาส่งหลานเอาน้ำผึ้งมาให้โถหนึ่ง ฝากมาบอกว่าปีแรกที่ยายอ่าน ยายก็อ่านผิดชื่อหนึ่ง เมียของคนนั้นก็แก้ให้แบบนี้
        effects:
          hp: -1
          flags: [read_the_drowned_names]
          people: [{ id: washer_nessa, name: เนสซา, gender: f, bond: friend, closeness: 1, age: 86 }]
    - id: read_with_nessa
      label: ขอให้ยายเนสซาลงไปยืนข้างกัน กระซิบทีละชื่อ แล้ว{name}พูดตามให้ดัง
      text: |
        {name}ประคองยายลงบันไดทีละขั้น ยายไม่ถือกระดาษ ยายจำได้ทุกชื่อ รวมทั้งชื่อที่หลานสาวลืมเขียน ยายกระซิบข้างหู{name} {name}ส่งเสียงออกไปให้ถึงบันไดขั้นบนสุด จังหวะช้าเร็วตามลมหายใจของยาย

        ชื่อสุดท้ายที่ยายกระซิบไม่มีในกระดาษ ไม่มีใครบนบันไดรู้จัก {name}เอ่ยออกไปเหมือนชื่ออื่น คนบนบันไดเอ่ยตามพร้อมกันโดยไม่มีใครถาม
      effects:
        stats: { WIS: 1 }
        flags: [read_the_names_with_nessa]
        people: [{ id: washer_nessa, name: เนสซา, gender: f, bond: friend, closeness: 1, age: 86 }]
    - id: add_the_rope_boy
      label: เติมชื่อที่ไม่มีในกระดาษ เด็กขายเศษเชือกที่หายไปจากท่าตั้งแต่กลางหน้าฝน
      text: |
        เด็กคนนั้นมานั่งขายเศษเชือกที่หัวบันไดทุกเช้า ไม่มีใครรู้ชื่อจริง ทั้งแถวเรียกว่าไอ้ปมตามของที่ขาย กลางหน้าฝนเขาไม่มาอีก ไม่มีพ่อแม่มาแจ้งใคร ไม่มีใครรู้ว่าเขาจมน้ำหรือย้ายไปขายที่อื่น {name}อ่านชื่อในกระดาษจนหมด แล้วเอ่ยชื่อนั้นเพิ่มอีกชื่อ

        คนบนบันไดเงียบไปอึดใจหนึ่ง แล้วเอ่ยตามพร้อมกัน ไอ้ปม ไม่มีใครถามว่าเขาจมน้ำจริงหรือเปล่า ปีต่อมาชื่อนั้นไม่มีในกระดาษ และไม่มีใครเห็นเขากลับมานั่งที่หัวบันไดอีก
      effects:
        alignment: { moral: 1 }
        flags: [added_the_rope_boy_to_the_names]
    - id: give_it_to_the_granddaughter
      label: ส่งกระดาษคืนให้หลานสาวของยาย บอกให้หลานลงไปอ่านเอง
      text: |
        หลานสาวอ่านช้า อ่านชื่อแรกผิดตามที่ตัวเองเขียน คนบนบันไดเอ่ยตามชื่อผิดนั้นพร้อมกัน ไม่มีใครแก้ ชื่อถัดๆ ไปเสียงของหลานสาวดังขึ้นทีละชื่อ จนถึงชื่อสุดท้ายเสียงนั้นก้องไปถึงตึกแถวฝั่งตรงข้าม

        ยายเนสซายืนอยู่ข้าง{name}ที่หัวบันได จับแขน{name}ไว้แน่นตลอดเวลาที่หลานอ่าน พอหลานสาวขึ้นจากน้ำ ยายจึงปล่อยมือ รอยนิ้วยายเป็นสีแดงอยู่บนแขน{name}ไปจนถึงเช้า
      effects:
        flags: [let_nessas_granddaughter_read]
        people: [{ id: washer_nessa, name: เนสซา, gender: f, bond: friend, closeness: 1, age: 86 }]
