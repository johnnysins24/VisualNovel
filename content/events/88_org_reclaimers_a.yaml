# ชุด อ องค์กรลับ: ผู้ทวงตำรา (reclaimers) ไฟล์ ก ทางเข้า 4 ทาง กับงานที่ห้องบัญชีหายส่งมา 10 เรื่อง
# คนของห้อง (มีแต่ในข้อความ ไม่อยู่ในผังคน): เวลดิส ผู้ปิดหีบ หญิงผมขาวที่เขียนได้สองมือพร้อมกัน · ลีเซน คนถือตราทวง เรียกชื่อคนถูกก่อนเขาจะบอก
#   โอเวส เสมียนแก่ผู้คัดสำเนาสมุดบัญชีหาย จำเลขทะเบียนได้มากกว่าจำหน้า · เพนดิส พ่อค้าของหลุดที่ห้องจับไม่ได้สักครั้งและซื้อของจากเขาเรื่อยๆ
# เวลดิสเป็นผู้ปิดหีบจนตัวละครขึ้นยศ 4 เรื่องที่นางยังถือกุญแจกัน max_rank: 3
# ห้องอยู่ใต้หอสมุดของสถาบัน แต่ผู้ทวงตำราเดินทาง งานเกิดที่ไหนก็ได้ ไม่บอกว่าตัวละครอยู่เมืองไหน และไม่เอ่ยชื่อเวนทราสในเรื่องที่ไม่กันถิ่น
# งานเกิดซ้ำ 3 เรื่อง (เดินแผงหนังสือมือสอง เขียนใบรับที่บ้านคนตาย วันเทียบเลขกับโอเวส) ให้แค่เงิน ชื่อเสียง flag
# hunted: { star_listeners: 1 } อยู่ในผลที่ผู้ฟังดาวรู้ว่าตัวละครแตะของที่พวกเขาอยากอ่าน: อ่านก่อนเข้าหีบ เผาสมุดของเงาเกิน (ไฟล์นี้) เผาหน้างาน (ไฟล์ ข)

# ---------- ทางเข้า ----------
- id: adult.reclaim_join_open_line
  stage: adult
  scene: home
  weight: 20
  when:
    age: [24, 50]
    any_flags: [institute_graduate, institute_left]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [left_the_reclaimers]
  text: |
    หญิงในเสื้อคลุมเรียบไม่มีขอบสีเคาะประตู แล้วเรียกชื่อ{name}ก่อน{name}จะทันถามว่ามาหาใคร นางชื่อลีเซน ผู้ทวงตำราของสถาบัน นางไม่ขอเข้าบ้าน ยืนอยู่ที่ธรณี เปิดสมุดเล่มบางปกผ้าใบไปหน้าที่คั่นไว้ด้วยเส้นด้าย

    บรรทัดหนึ่งในหน้านั้นเป็นเรื่องของ{name} ตำราของหอสมุดสถาบันเล่มหนึ่ง แบบหัดอ่านอักษรเก่าสำหรับปีหนึ่ง เลขทะเบียนสี่พันหนึ่งร้อยเก้าสิบ ยืมออกไปในปีที่{name}ยังใส่เสื้อคลุมขอบเทา ช่องคนยืมเป็นลายมือของ{name} ช่องวันคืนว่าง

    ลีเซนบอกว่าห้องบัญชีหายไม่ได้มาทวงเงิน ไม่ได้มาลงโทษ บรรทัดนี้เปิดค้างมานานแล้ว นางอยากปิดมัน วิธีปิดมีสองวิธี เอาเล่มมาคืน หรือเขียนว่าหายแล้วลงชื่อกำกับ ทั้งสองวิธีปิดได้เท่ากัน
  choices:
    - id: search_the_old_trunk
      label: ค้นหีบเก่าจนเจอ แล้วเอาไปคืนที่ห้องเอง
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          เล่มนั้นอยู่ก้นหีบ ใต้เสื้อคลุมขอบเทาที่ใส่ไม่ได้แล้ว ขอบกระดาษมีลายมือของ{name}ตอนยังเขียนตัวกลม ที่คั่นหนังสือเป็นจดหมายของเพื่อนร่วมห้องที่ไม่เคยตอบ

          ห้องบัญชีหายอยู่ใต้หอสมุด บันไดหินสิบเก้าขั้น เสมียนแก่ที่โต๊ะหน้าห้องพูดเลขทะเบียนออกมาก่อน{name}จะวางเล่มเสร็จ หญิงผมขาวหลังโต๊ะใหญ่เขียนใบรับด้วยมือขวา มือซ้ายขีดปิดบรรทัดในสมุดเล่มหนาพร้อมกัน แล้วเลื่อนสำเนาสมุดบัญชีมาให้หนึ่งเล่ม นางบอกว่าคนที่ปิดบรรทัดของตัวเองได้ ปิดของคนอื่นได้
        effects: { org: { id: reclaimers, join: true }, mark: เข้าห้องบัญชีหาย, stats: { WIS: 1 }, flags: [closed_own_line] }
      failure:
        text: |
          {name}รื้อหีบจนถึงก้น บานพับสนิมบาดสันมือเป็นแผลยาว เล่มนั้นไม่อยู่ในหีบ ไม่อยู่ที่ไหนทั้งบ้าน คงหายไปตั้งแต่ปีที่ย้ายออกจากหอพัก

          ลีเซนยื่นปากกาให้ {name}เขียนว่าหาย ลงชื่อกำกับ นางฉีกใบรับสีงาช้างจากเล่มให้หนึ่งใบ ใบรับของเล่มที่ไม่มีใครได้รับ แล้วปิดสมุดเดินจากไปโดยไม่ทิ้งคำชวนไว้
        effects: { hp: -1, flags: [signed_own_line_lost] }
    - id: sign_it_lost
      label: เขียนว่าหาย แล้วลงชื่อกำกับต่อหน้านาง
      text: |
        {name}เขียนคำเดียวลงในช่องวันคืน ลงชื่อกำกับ ลายมือชื่อวันนี้เอียงกว่าลายมือชื่อในช่องคนยืมเล็กน้อย ลีเซนเป่าหมึกให้แห้ง เทียบลายมือสองบรรทัดอยู่ครู่หนึ่ง

        นางบอกว่าคนส่วนใหญ่เถียงก่อนสามครั้ง แล้วนางก็ยื่นสมุดเล่มหนาปกผ้าใบอีกเล่มให้ สำเนาสมุดบัญชีหาย ขอบกระดาษนุ่มเพราะมือคนก่อนหน้า ห้องบัญชีหายต้องการคนที่ลงชื่อรับของตัวเองได้โดยไม่ต้องให้ใครยื่นหลักฐาน
      effects: { org: { id: reclaimers, join: true }, mark: เข้าห้องบัญชีหาย, alignment: { law: 1 }, flags: [signed_own_line_lost] }
    - id: deny_the_hand
      label: บอกว่าลายมือนั้นไม่ใช่ของ{name} แล้วปิดประตู
      text: |
        ลีเซนเขียนคำหนึ่งไว้ข้างบรรทัดนั้นก่อนประตูจะปิดสนิท {name}ได้ยินเสียงปากกาขูดกระดาษผ่านช่องประตู

        สามวันต่อมามีกระดาษสีงาช้างแผ่นเล็กสอดเข้ามาใต้ประตู ไม่ใช่ใบรับ เป็นสำเนาลายมือชื่อในช่องคนยืม คัดมาเท่าตัวจริงทุกเส้น
      effects: { flags: [denied_own_line] }
    - id: left_with_it_in_the_bag
      label: บอกนางตรงๆ ว่า{name}ออกจากสถาบันพร้อมเล่มนั้นในย่าม
      requires: { flag: institute_left }
      text: |
        ลีเซนไม่ถามว่าทำไมออก นางถามว่าเล่มนั้นยังอยู่ไหม {name}บอกว่าขายให้แผงหนังสือมือสองไปตอนเงินหมด ได้ค่าข้าวสามมื้อ นางจดชื่อแผง จดราคา จดว่าสามมื้อ

        นางบอกว่าห้องบัญชีหายมีคนที่ออกกลางคันมากกว่าคนที่จบ คนที่ออกกลางคันรู้ว่าของในย่ามไปจบที่แผงไหน แล้วยื่นสำเนาสมุดบัญชีให้หนึ่งเล่ม บอกว่าแผงนั้นอยู่ในหน้าที่สามสิบ
      effects: { org: { id: reclaimers, join: true }, mark: เข้าห้องบัญชีหาย, stats: { CHA: 1 }, flags: [told_lisen_about_the_bag] }

- id: adult.reclaim_join_three_objects
  stage: adult
  scene: workshop
  weight: 15
  when:
    age: [24, 50]
    any_flags: [job_researcher, job_artificer]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [left_the_reclaimers]
  text: |
    ชายแก่หลังค่อมกับหญิงในเสื้อคลุมเรียบไม่มีขอบสีวางของสามชิ้นลงบนโต๊ะทำงานของ{name} วงเวียนทองเหลืองอันหนึ่ง สมุดจดเล่มบางปกหนังหมูเล่มหนึ่ง โหลแก้วเปล่าก้นหนาใบหนึ่ง ชายแก่ชื่อโอเวส บอกเลขทะเบียนของทั้งสามชิ้นด้วยเสียงเรียบ ไม่ต้องเปิดสมุดดู

    หญิงคนนั้นชื่อลีเซน นางบอกว่าสถาบันไม่ซื้อของของตัวเองคืน ห้องบัญชีหายก็ไม่ซื้อ ยกเว้นจากพ่อค้าคนเดียว ชื่อเพนดิส เพราะของที่เขาเอามาขายเป็นของจริงเสมอ เกือบเสมอ สามชิ้นบนโต๊ะห้องซื้อจากเขาทั้งหมด นางอยากรู้ว่าชิ้นไหนไม่จริง และอยากรู้ว่าคนที่ใช้มือทำงานทุกวันจะดูออกไหม
  choices:
    - id: read_the_three
      label: หยิบขึ้นมาดูทีละชิ้น หาว่าชิ้นไหนไม่ได้ออกจากมือคนของสถาบัน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          สมุดจดยกขึ้นส่องแสงแล้วเห็นลายน้ำรูปตะเกียงที่มุมล่าง โหลแก้วมีรอยบัดกรีเล็กเท่าเมล็ดงาที่ก้นด้านใน วงเวียนดูดีที่สุดในสามชิ้น ขัดเงาที่สุด หมุดตัวที่สามตอกจากด้านผิด ช่างของสถาบันตอกจากด้านล่างทุกชิ้น ชิ้นนี้ตอกจากด้านบน

          โอเวสพูดเลขทะเบียนของวงเวียนอีกครั้ง แล้วเติมคำว่าปลอมต่อท้าย ลีเซนเลื่อนสำเนาสมุดบัญชีหายข้ามโต๊ะมาให้ บอกว่าห้องจะซื้อจากเพนดิสต่อไป แต่ต่อจากนี้ห้องจะมีคนดูก่อนจ่าย
        effects: { org: { id: reclaimers, join: true }, mark: เข้าห้องบัญชีหาย, stats: { INT: 1 }, flags: [found_pendis_forgery] }
      failure:
        text: |
          {name}ชี้สมุดจด เพราะปกหนังหมูดูใหม่เกินไป โอเวสส่ายหัวช้าๆ บอกว่าปกเปลี่ยนได้ ลายน้ำเปลี่ยนไม่ได้ แล้วชี้วงเวียน ตอนวางโหลคืน ขอบปากโหลบิ่นบาดนิ้ว{name}เป็นแผลเล็ก

          ลีเซนขอบคุณ ห่อของทั้งสามชิ้นกลับลงย่าม ทั้งสองเดินออกไปพร้อมกัน ที่โต๊ะทำงานเหลือหยดเลือดหยดหนึ่งตรงที่วางโหล
        effects: { hp: -1, flags: [missed_pendis_forgery] }
    - id: ask_for_a_fee
      label: บอกว่าดูให้ได้ ถ้าห้องจ่ายค่าดูเหมือนที่จ่ายพ่อค้า
      text: |
        ลีเซนบอกว่าห้องไม่มีเงินสำหรับเรื่องนี้ โอเวสล้วงกระเป๋าตัวเอง นับสองเหรียญวางบนโต๊ะ {name}ชี้วงเวียน หมุดตัวที่สามตอกผิดด้าน

        โอเวสเก็บวงเวียนใส่ย่าม จดอะไรสั้นๆ ลงบนหลังมือตัวเองด้วยถ่าน แล้วขอบคุณด้วยการพูดเลขทะเบียนซ้ำ ทั้งสองไม่ได้ทิ้งอะไรไว้นอกจากสองเหรียญ
      effects: { gold: 2, flags: [charged_the_claimers] }
    - id: not_my_work
      label: บอกว่า{name}ไม่ดูของที่ไม่ได้ทำเอง
      text: |
        ลีเซนไม่เถียง นางเก็บของคืนลงย่ามทีละชิ้น ห่อผ้าให้ทุกชิ้น วงเวียนห่อหนากว่าชิ้นอื่น

        เดือนต่อมา{name}เห็นวงเวียนอันเดียวกันวางขายอยู่บนแผงของเก่าท้ายตลาด ราคาแพงขึ้นสองเท่า หมุดตัวที่สามยังตอกผิดด้านเหมือนเดิม
      effects: { flags: [turned_away_the_claimers] }
    - id: pull_the_third_rivet
      label: ถอดหมุดตัวที่สามของวงเวียนออกดูข้างใน
      requires: { flag: job_artificer }
      text: |
        หมุดตัวที่สามออกง่ายเกินไป ข้างในวงเวียนมีแหวนรองทองเหลืองที่สถาบันไม่ใช้ เกลียวละเอียดกว่างานของสถาบัน แข็งแรงกว่า วงเวียนปลอมอันนี้วัดได้แม่นกว่าของจริงที่มันเลียนแบบ

        {name}บอกตามนั้น ลีเซนหัวเราะเป็นเสียงสั้นๆ ครั้งเดียว โอเวสจดลงสมุดว่าปลอม แล้วจดต่อท้ายว่าดีกว่า ลีเซนวางสำเนาสมุดบัญชีลงบนโต๊ะทำงาน ข้างวงเวียนที่ยังถอดค้างอยู่
      effects: { org: { id: reclaimers, join: true }, mark: เข้าห้องบัญชีหาย, stats: { DEX: 1 }, flags: [found_pendis_forgery] }

- id: adult.reclaim_join_met_before
  stage: adult
  weight: 25
  time: dusk
  when:
    age: [24, 50]
    any_flags: [helped_the_book_claimers, kept_dorgas_rubbing]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [left_the_reclaimers]
  text: |
    หญิงในเสื้อคลุมเรียบนั่งรออยู่บนม้านั่งหน้าที่พักของ{name} พอ{name}เดินมาถึง นางลุกขึ้นเรียกชื่อ{name}ถูกทั้งชื่อ นางชื่อลีเซน ในกระเป๋าเสื้อมีตราทองเหลืองของสถาบัน โผล่ออกมาให้เห็นแค่ขอบ

    นางบอกว่าห้องบัญชีหายมีสมุดสองแบบ แบบหนึ่งจดของที่หาย อีกแบบจดคนที่ห้องเคยเจอ ชื่อของ{name}อยู่ในแบบที่สอง หน้าเดียวกับอีกสี่คน สองคนทำงานให้ห้องอยู่ตอนนี้ คนหนึ่งตายแล้ว อีกคนเป็นพ่อค้าที่ห้องยังจับไม่ได้

    นางยื่นสมุดเล่มหนาปกผ้าใบมาให้ สำเนาสมุดบัญชีหายเล่มหนึ่ง ขอบกระดาษนุ่มเพราะผ่านมือคนมาหลายมือ
  choices:
    - id: take_the_copy
      label: รับสำเนาสมุดบัญชีจากมือนาง
      text: |
        สมุดหนักกว่าที่ขนาดบอก หน้าแรกมีชื่อคนถือคนก่อนห้าชื่อ ขีดทับทุกชื่อด้วยเส้นเดียว เว้นบรรทัดล่างสุดไว้ว่าง ลีเซนยื่นปากกาให้ {name}เขียนชื่อตัวเองลงไป

        นางบอกว่าพรุ่งนี้เช้ามีแผงหนังสือมือสองยี่สิบสามแผงที่ต้องเดิน แล้วเดินจากไปก่อนหมึกจะแห้ง
      effects: { org: { id: reclaimers, join: true }, mark: เข้าห้องบัญชีหาย, flags: [took_lisens_copy] }
    - id: hand_it_back
      label: ยื่นสมุดคืน บอกว่าไม่ใช่งานของ{name}
      text: |
        ลีเซนรับสมุดคืน ไม่ถามว่าทำไม นางบอกว่าชื่อของ{name}จะอยู่ในเล่มที่สองต่อไป ห้องไม่ขีดชื่อใครทิ้งเพราะเขาปฏิเสธ

        แล้วนางก็เดินไปทางตลาด เสื้อคลุมเรียบกลืนไปกับคนเดินถนนก่อนถึงหัวมุม
      effects: { flags: [refused_lisens_copy] }
    - id: ask_after_the_widow
      label: ถามถึงหญิงม่ายเจ้าของแผงหนังสือมือสองท้ายตลาด
      requires: { flag: helped_the_book_claimers }
      text: |
        ลีเซนบอกว่าหญิงม่ายคนนั้นยังเก็บใบรับไว้ใต้ตาชั่ง และทุกครั้งที่ของที่มีเลขผ่านตาชั่งของนาง นางส่งเด็กไปบอกห้อง ทุกครั้ง ไม่เคยขอเงิน นางเป็นตาที่ดีที่สุดที่ห้องมีในตลาดนั้น

        แล้วลีเซนก็บอกว่าแผงนั้นต้องมีคนไปเดินทุกเดือน เพื่อให้นางรู้ว่าเด็กที่นางส่งไปไม่ได้วิ่งเปล่า {name}รับสมุดไว้ เดือนแรกที่ไป หญิงม่ายจำหน้าได้ก่อนจะทันทัก
      effects: { org: { id: reclaimers, join: true }, mark: เข้าห้องบัญชีหาย, stats: { CHA: 1 }, flags: [walks_the_widows_stall] }
    - id: lift_the_creaking_board
      label: งัดกระดานพื้นแผ่นที่มีเสียงเอี๊ยด ยื่นกระบอกหนังให้นาง
      requires: { flag: kept_dorgas_rubbing }
      text: |
        ลีเซนคลี่ม้วนแบบแขนกลบนโต๊ะในห้อง ไล่นิ้วไปถึงมุมล่างใต้ภาพข้อศอก ตรงที่ลายเส้นไม่ใช่หมึก นับบากได้สามบาก นางไม่ถามว่าได้มาอย่างไร ฉีกใบรับสีงาช้างให้หนึ่งใบ เลขทะเบียนของแบบม้วนนั้น วันที่ ลายมือชื่อของนาง

        นางม้วนกระดาษใส่ย่ามของตัวเอง แล้วยื่นกระบอกหนังเปล่าคืนให้ กระบอกไม่มีเลขทะเบียน ห้องไม่เก็บ จากนั้นนางวางสำเนาสมุดบัญชีลงบนโต๊ะ ข้างกระบอกเปล่า
      effects: { org: { id: reclaimers, join: true }, mark: เข้าห้องบัญชีหาย, stats: { INT: 1 }, flags: [gave_up_dorgas_rubbing] }

- id: adult.reclaim_join_dead_neighbour
  stage: adult
  weight: 5
  when:
    age: [24, 50]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [left_the_reclaimers]
  text: |
    ชายแก่ห้องข้างๆ ตายตอนกลางหนาว ไม่มีญาติมารับ เจ้าของที่พักขนของของเขาออกมาวางบนลานในวันเดียว ผ้าห่ม กาน้ำ แว่นตาสองอัน รองเท้าที่ส้นสึกข้างเดียว กองหนังสือที่ไม่มีใครซื้อ ใครให้เท่าไรก็ขาย

    ตกเย็นของที่เหลือบนลานมีชิ้นเดียวที่ไม่มีใครให้ราคา เครื่องวัดทองเหลืองขนาดเท่ากำปั้น หน้าปัดมีเข็มสามเข็ม เข็มหนึ่งยังขยับเองช้าๆ ไม่มีใครแตะ ใต้ฐานตอกตัวเลขไว้แถวหนึ่ง กับคำว่า ทรัพย์สินของสถาบันเวทหลวง ห้ามนำออก เจ้าของที่พักยัดใส่มือ{name}ให้เปล่าๆ บอกว่าตาแก่ได้มาจากไหนไม่รู้ อยู่ในห้องนั้นมาก่อนเขาจะซื้อตึกเสียอีก
  choices:
    - id: carry_it_back
      label: เอาเครื่องวัดไปคืนหอสมุดของสถาบันเอง ไม่มีใครขอ
      text: |
        เสมียนหน้าหอสมุดชี้ลงบันได ห้องใต้ดินมีโต๊ะสองตัวกับหิ้งสมุดเล่มหนาเรียงยาวไปจนสุดแสงตะเกียง ชายแก่ที่โต๊ะแรกอ่านตัวเลขใต้ฐานแล้วพูดบรรทัดนั้นออกมาทั้งบรรทัด ชื่อเครื่อง ปีที่ออกไปกับใคร ปีที่ลงว่าหาย ก่อน{name}จะเล่าเรื่องห้องข้างๆ จบ

        หญิงผมขาวที่โต๊ะตัวที่สองเขียนใบรับด้วยมือขวา มือซ้ายขีดปิดบรรทัดในสมุดเล่มหนาพร้อมกัน แล้วถามว่ามีใครขอให้{name}มาไหม {name}บอกว่าไม่มี นางเลื่อนสำเนาสมุดบัญชีมาให้หนึ่งเล่ม บอกว่าห้องนี้รับคนนอกแบบเดียว
      effects: { org: { id: reclaimers, join: true }, mark: เข้าห้องบัญชีหาย, alignment: { law: 1 }, flags: [returned_the_neighbours_gauge] }
    - id: keep_the_gauge
      label: เก็บไว้เอง วางบนหิ้งข้างเตียง
      text: |
        เข็มที่ขยับได้หมุนช้าๆ ทุกคืน เร็วขึ้นในคืนที่ฟ้าโปร่ง ช้าลงในคืนที่ฝนตก {name}ไม่รู้ว่ามันวัดอะไร แต่ตื่นมาดูมันก่อนดูฟ้าทุกเช้า

        ปลายหนาวนั้นมีหญิงในเสื้อคลุมเรียบเดินผ่านหน้าที่พักสองครั้ง ครั้งที่สองนางหยุดเงยหน้าดูหน้าต่างห้อง{name}อยู่ชั่วลมหายใจเดียว แล้วเดินต่อ
      effects: { flags: [kept_the_neighbours_gauge] }
    - id: sell_to_the_dealer
      label: เอาไปขายให้พ่อค้าของเก่าในตลาด
      text: |
        พ่อค้าของเก่าเสียงนุ่มคนหนึ่งพลิกเครื่องวัดดูใต้ฐานแวบเดียว แล้วจ่ายสามเหรียญ มากกว่าที่{name}คิดไว้สองเท่า เขาบอกชื่อตัวเองโดยไม่มีใครถาม เพนดิส

        เขาห่อเครื่องวัดด้วยผ้ากำมะหยี่ บอกว่าอีกไม่นานจะมีคนมาซื้อต่อในราคาที่ดีกว่านี้ คนพวกนั้นไม่เคยต่อราคา
      effects: { gold: 3, flags: [sold_the_gauge_to_pendis] }
    - id: learn_what_it_measures
      label: แกะฝาหลังดูก่อนว่ามันวัดอะไร แล้วค่อยเอาไปคืน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ใต้ฝาหลังมีกระเปาะแก้วเล็กเท่าเมล็ดถั่ว ข้างในมีหยดของเหลวสีฟ้าซีดหยดเดียว เข็มที่ขยับเองต่อกับกระเปาะนั้น เครื่องวัดนี้วัดไอของน้ำค้างดาวในอากาศ ห้องข้างๆ ไม่ได้มีหม้อกลั่น แต่ทุกคืนที่ฟ้าโปร่ง เข็มก็ขึ้น

          {name}ปิดฝาคืน เอาไปถึงห้องใต้หอสมุดเอง หญิงผมขาวที่เขียนได้สองมือพร้อมกันฟังจนจบ แล้วถามว่าเปิดดูทำไม {name}ตอบตามจริง นางเลื่อนสำเนาสมุดบัญชีมาให้ บอกว่าห้องอยากได้คนที่อยากรู้ก่อนคืน แต่ยังคืน
        effects: { org: { id: reclaimers, join: true }, mark: เข้าห้องบัญชีหาย, stats: { INT: 1 }, flags: [returned_the_neighbours_gauge] }
      failure:
        text: |
          สปริงข้างในดีดออกตอนฝาหลังหลุด เฉียดริมฝีปาก{name}เป็นแผล เข็มทั้งสามหยุดนิ่ง ไม่ขยับอีก {name}เก็บชิ้นส่วนทุกชิ้นใส่ผ้า เอาไปคืนที่ห้องใต้หอสมุดในสภาพนั้น

          หญิงผมขาวเขียนใบรับ มือซ้ายเขียนว่ารับคืนในสภาพไม่ครบ มือขวาเขียนชื่อ{name} แล้วเลื่อนสำเนาสมุดบัญชีมาให้ นางบอกว่าห้องรับของพังมากกว่าของดีมาตลอด
        effects: { org: { id: reclaimers, join: true }, mark: เข้าห้องบัญชีหาย, hp: -1, flags: [returned_the_neighbours_gauge] }

# ---------- งานที่ห้องส่ง: งานเกิดซ้ำ ----------
- id: adult.reclaim_duty_stall_round
  stage: adult
  scene: market
  weight: 20
  once: false
  duty: reclaimers
  when:
    age: [24, 64]
    org: reclaimers
  text: |
    งานเดินแผงทำเหมือนกันทุกรอบ เดินจากหัวตลาดถึงท้ายตลาด หยุดทุกแผงที่มีหนังสือมือสอง โหลเก่า เครื่องวัด พลิกดูก้น ดูสัน ส่องลายน้ำ แผงหนึ่งในยี่สิบแผงมีของที่มีเลข แผงหนึ่งในร้อยแผงมีเลขที่อยู่ในสำเนาสมุดบัญชีที่{name}ถือ

    รอบนี้แผงที่สิบสี่ คนขายเป็นเด็กหนุ่มที่นั่งกินถั่วต้ม หนังสือปกผ้าสีน้ำตาลเล่มหนาวางอยู่ใต้กองนิทาน สันมีรอยมีดขูดตรงที่เคยมีตัวเลข ขูดไม่หมด เด็กหนุ่มบอกว่าเล่มนั้นสองเหรียญ ซื้อมาจากคนเก็บของบ้านคนตาย
  choices:
    - id: match_the_spine
      label: เทียบรอยตัวเลขที่เหลือกับสำเนาบัญชีทีละบรรทัด
      check: { stat: INT, dc: 12 }
      success:
        text: |
          ตัวเลขที่เหลือบนสันมีสามตัว ลายน้ำหน้าแรกเป็นรูปตะเกียง {name}ไล่สำเนาบัญชีจนเจอบรรทัดที่ตัวเลขสามตัวท้ายตรงกัน ชื่อเล่มตรงกัน ขนาดตรงกัน เขียนใบรับสีงาช้างให้เด็กหนุ่มหนึ่งใบ เด็กหนุ่มอ่านใบรับสองรอบ ถามว่าเอาไปแลกเงินที่ไหนได้

          ไม่มีที่ไหน {name}บอกตามนั้น เด็กหนุ่มเก็บใบรับใส่ถุงถั่วต้ม หันไปขายนิทานให้คนอื่นต่อ
        effects: { reputation: { royal_institute: 1 }, flags: [claimed_from_a_stall] }
      failure:
        text: |
          {name}เทียบจนแน่ใจ เขียนใบรับ เอาเล่มมา แม่ของเด็กหนุ่มกลับมาจากตลาดปลาพอดี นางอ่านใบรับ แล้วชี้ตัวเลขบนสันที่ขูดไม่หมด เลขตัวกลางไม่ใช่เจ็ด เป็นหนึ่ง

          {name}คืนเล่ม ฉีกใบรับทิ้ง แล้วซื้อนิทานหนึ่งเล่มสองเหรียญให้นางหายโกรธ นิทานเรื่องนั้นเกี่ยวกับลิงที่ขโมยตะเกียง
        effects: { gold: -2, flags: [misread_a_stall_book] }
    - id: write_and_pay_his_lunch
      label: เขียนใบรับ แล้วจ่ายค่าข้าวเด็กหนุ่มจากกระเป๋าตัวเอง
      text: |
        สถาบันไม่ซื้อของคืน ห้องไม่ซื้อ แต่ไม่มีกฎไหนห้ามคนของห้องซื้อถั่วต้ม {name}เขียนใบรับ แล้ววางเหรียญหนึ่งเหรียญไว้ข้างหม้อถั่ว

        เด็กหนุ่มรับเหรียญไว้ ใบรับเหน็บไว้ใต้กองนิทาน รอบหน้าที่{name}มาถึงแผงนี้ เขายกมือทักก่อน แล้วยกหนังสือเล่มหนึ่งที่สันมีตัวเลขขึ้นให้ดูจากไกลๆ
      effects: { gold: -1, reputation: { royal_institute: 1 }, flags: [paid_for_the_stall_boys_lunch] }
    - id: read_the_watermark
      label: ส่องลายน้ำทุกหน้า ดูว่าเป็นเล่มของสถาบันหรือเล่มคัดลอก
      requires: { org: { id: reclaimers, min_rank: 2 } }
      text: |
        ลายน้ำรูปตะเกียงมีอยู่แค่หน้าแรกกับหน้าท้าย หน้ากลางเป็นกระดาษอีกแบบ เส้นใยหยาบกว่า เล่มนี้เป็นเล่มคัดลอก มีคนแกะปกเล่มจริงมาหุ้มเล่มคัดลอก แล้วเอาเล่มจริงไปขายที่อื่น

        {name}จดลักษณะการเย็บลงในสำเนาบัญชีข้างบรรทัดนั้น เย็บแบบนี้ห้องเคยเห็นมาแล้วสามครั้ง ครั้งไหนก็เป็นของที่ผ่านมือคนคนเดียวกัน
      effects: { reputation: { royal_institute: 1 }, flags: [traced_a_rebound_book] }
    - id: pass_the_stall
      label: ผ่านแผงนี้ไป ไม่หยุด
      refuse: true
      text: |
        {name}เดินผ่านแผงที่สิบสี่ไปถึงท้ายตลาด แผงที่เหลือไม่มีอะไร

        เดือนต่อมาเล่มปกผ้าสีน้ำตาลไม่อยู่ใต้กองนิทานแล้ว เด็กหนุ่มบอกว่ามีคนเสียงนุ่มมาซื้อไปสามเหรียญ ไม่ต่อราคา
      effects: { flags: [passed_a_numbered_stall] }

- id: adult.reclaim_duty_dead_scholar
  stage: adult
  scene: home
  weight: 20
  once: false
  duty: reclaimers
  when:
    age: [24, 64]
    org: reclaimers
  text: |
    บ้านคนตายที่มีของของสถาบันมีกลิ่นเหมือนกันทุกบ้าน กลิ่นกระดาษชื้นกับน้ำมันตะเกียงที่ไม่มีใครเติม บ้านรอบนี้เป็นของอาจารย์เกษียณคนหนึ่ง ลูกชายสองคนกับลูกสะใภ้ยืนรออยู่ในห้องหนังสือ ทุกคนกอดอก

    ของที่มีเลขทะเบียนมีสิบเอ็ดชิ้น {name}ต้องเขียนใบรับทุกชิ้น ใบละหนึ่งชิ้น เลขทะเบียน วันที่ ลายมือชื่อคนเอาไป ใบรับทุกใบต้องยื่นให้คนที่ถือของอยู่ ลูกชายคนโตกับลูกชายคนเล็กยื่นมือออกมาพร้อมกันตั้งแต่ใบแรก
  choices:
    - id: write_all_eleven
      label: เขียนใบรับให้ครบสิบเอ็ดใบก่อนพลบ
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}เขียนเร็วจนหมึกไม่ทันแห้ง วางใบรับเรียงบนโต๊ะเป็นสองกอง กองละคน ตามที่สองพี่น้องตกลงกันเองตอนใบที่สาม ใบที่สิบเอ็ดเป็นโหลแก้วที่ลูกสะใภ้ใช้ใส่น้ำตาล นางเทน้ำตาลออกใส่ชามก่อนส่งให้

          ตอนเดินออกจากบ้าน ลูกชายสองคนนั่งนับใบรับอยู่คนละมุมห้อง ใบรับนับเป็นมรดกไม่ได้ แต่ทั้งสองนับ
        effects: { reputation: { royal_institute: 1 }, flags: [wrote_a_dead_scholars_receipts] }
      failure:
        text: |
          ใบที่เจ็ดเขียนเลขทะเบียนผิดหนึ่งตัว ลูกชายคนโตเห็นก่อน เขาไม่ยอมรับใบนั้น ใบรับฉีกจากเล่มแล้วทิ้งไม่ได้ ต้องเขียนว่าเสีย ลงชื่อกำกับ แล้วเขียนใหม่ {name}เขียนใบใหม่ใต้ตาของคนสามคน ช้ากว่าเดิมจนตะเกียงในห้องต้องจุด

          ใบรับใบที่เสียกลับไปถึงห้องพร้อม{name} โอเวสเห็นแล้วพูดเลขทะเบียนที่ถูกออกมาโดยไม่ต้องดูของ แล้วหักค่ากระดาษสีงาช้างหนึ่งแผ่นจากค่าเดินทางของ{name}
        effects: { reputation: { royal_institute: -1 }, gold: -1, flags: [spoiled_a_receipt] }
    - id: leave_the_sugar_jar
      label: เขียนสิบใบ เว้นโหลน้ำตาลไว้ให้ลูกสะใภ้ ลงว่าไม่พบ
      text: |
        {name}เขียนใบรับสิบใบ ใบที่สิบเอ็ดไม่เขียน ในสำเนาบัญชีลงไว้ว่าไม่พบ ลูกสะใภ้ไม่รู้ว่าโหลน้ำตาลของนางมีตัวเลขอยู่ใต้ก้น

        สองพี่น้องแบ่งใบรับกันคนละห้าใบ ไม่มีใครเถียง โหลน้ำตาลวางอยู่บนชั้นในครัว ตัวเลขใต้ก้นหันลงหาไม้
      effects: { alignment: { law: -1, moral: 1 }, flags: [left_a_numbered_jar] }
    - id: know_the_hand
      label: จำลายมือในสมุดจดของผู้ตายได้ บอกลูกชายว่าเคยเรียนกับเขา
      requires: { any_flags: [institute_graduate, institute_left, job_researcher] }
      text: |
        ลายมือในสมุดจดเล่มบนสุดเป็นลายมือที่{name}เคยเห็นบนกระดานดำทุกเช้า ตัวอักษรเอียงขวา หางยาว {name}บอกลูกชายทั้งสองว่าพ่อของพวกเขาสอนให้คนห้องหนึ่งเขียนเลขทะเบียนแบบนี้ ทุกคนในห้องนั้นยังเขียนแบบนี้

        ลูกชายคนเล็กขอเก็บหน้าสุดท้ายของสมุดจดเล่มนั้นไว้หน้าหนึ่ง หน้านั้นไม่มีอะไรนอกจากรายการซื้อของตลาด {name}ฉีกให้ แล้วเขียนในใบรับว่าขาดหนึ่งหน้า
      effects: { reputation: { royal_institute: 1 }, flags: [knew_the_dead_scholars_hand] }
    - id: send_someone_else
      label: ขอให้ห้องส่งคนอื่นไปเขียนแทน
      refuse: true
      text: |
        โอเวสจดชื่อคนแทนลงในสมุดเวรของห้อง ลายมือเล็กเท่ามด ไม่ถามเหตุผล

        สัปดาห์ต่อมาใบรับสิบเอ็ดใบของบ้านนั้นกลับมาที่ห้องเป็นสำเนา ลายมือของคนอื่น ใบที่สิบเอ็ดเป็นโหลน้ำตาล
      effects: { flags: [skipped_a_dead_scholars_house] }

- id: adult.reclaim_duty_matching_day
  stage: adult
  scene: library
  weight: 20
  once: false
  duty: reclaimers
  when:
    age: [24, 64]
    org: reclaimers
  text: |
    สมุดบัญชีหายมีหนึ่งร้อยสิบสองเล่ม เรียงบนหิ้งไม้ยาวตลอดผนังห้องใต้หอสมุด เล่มแรกบางเท่านิ้วก้อย เล่มหลังๆ หนาจนต้องใช้สองมือยก วันเทียบเลขเริ่มตอนตะเกียงดวงแรกจุด จบตอนตะเกียงดวงสุดท้ายหมดน้ำมัน

    โอเวสนั่งโต๊ะเดียวกับ{name} ตรงหน้าเขาเป็นบัญชีขายของจากพ่อค้าของเก่าสามเจ้า ตรงหน้า{name}เป็นสมุดบัญชีหายเล่มที่หกสิบถึงเจ็ดสิบ เขาอ่านเลขจากบัญชีขายออกเสียงทีละเลข {name}ไล่หา เขาไม่เคยรอนานกว่าสามลมหายใจก่อนอ่านเลขถัดไป
  choices:
    - id: keep_up_with_oves
      label: ไล่เลขให้ทันเสียงของโอเวสจนตะเกียงดวงสุดท้ายดับ
      check: { stat: INT, dc: 12 }
      success:
        text: |
          เลขที่สองร้อยสี่สิบสามของวันตรงกับบรรทัดหนึ่งในเล่มที่หกสิบเจ็ด โหลกลั่นของสำนักกลั่น หายตั้งแต่ก่อน{name}เกิด ตอนนี้อยู่บนหิ้งของพ่อค้าของเก่าในตลาดปลา ราคาสามเหรียญ

          โอเวสพูดเลขนั้นซ้ำอีกครั้ง เป็นครั้งเดียวทั้งวันที่เขาพูดเลขเดิมสองหน แล้วอ่านเลขถัดไปต่อ
        effects: { reputation: { royal_institute: 1 }, flags: [matched_a_number_with_oves] }
      failure:
        text: |
          ตาพร่าตั้งแต่ตะเกียงดวงที่สาม {name}จับคู่เลขผิดสองคู่ โอเวสไม่ทักตอนนั้น เช้าวันต่อมาบนโต๊ะของ{name}มีกระดาษแผ่นเล็กวางอยู่ เลขสองคู่ที่ผิดกับเลขที่ถูก ลายมือเล็กเท่ามด

          คืนนั้น{name}กลับมานั่งเทียบใหม่คนเดียว ค่าน้ำมันตะเกียงห้องไม่จ่าย ห้องจ่ายแค่น้ำมันของวันเทียบเลข
        effects: { gold: -1, flags: [mismatched_with_oves] }
    - id: ask_about_volume_one
      label: ถามโอเวสว่ารายการเดียวในเล่มแรกคืออะไร
      text: |
        โอเวสตอบเป็นเลขทะเบียน ไม่ใช่ชื่อของ เลขสามตัว น้อยที่สุดในห้อง เขาบอกว่าเลขนี้ไม่มีชื่อของกำกับ ช่องชื่อเว้นว่างไว้ตั้งแต่วันที่เขียน คนเขียนเป็นผู้ปิดหีบคนแรก

        แล้วเขาก็อ่านเลขถัดไปจากบัญชีขาย ทุกคนในห้องเคยถามข้อนี้ ทุกคนได้คำตอบเดียวกัน
      effects: { flags: [asked_oves_about_volume_one] }
    - id: read_the_new_arrivals
      label: อ่านตราของที่เพิ่งเข้าห้องเมื่อวาน ระหว่างรอเลขถัดไป
      requires: { org: { id: reclaimers, min_rank: 2 } }
      text: |
        ของบนโต๊ะรับเข้ามีห้าชิ้น {name}อ่านตราได้สี่ รอยบัดกรีใต้โหล หมุดตัวที่สามของเครื่องชั่ง ลายน้ำในสมุดสองเล่ม ชิ้นที่ห้าเป็นแว่นขยายที่ไม่มีตราตรงไหนเลย ไม่มีตราเลยแปลว่าไม่ได้ออกจากมือคนของสถาบัน หรือออกจากมือคนที่ไม่อยากให้ใครรู้ว่าทำ

        โอเวสฟังแล้วจดแว่นขยายนั้นไว้ในหน้าที่เขาเก็บไว้สำหรับของที่ห้องยังไม่ตัดสิน หน้านั้นหนากว่าหน้าอื่น
      effects: { reputation: { royal_institute: 1 }, flags: [read_the_arrival_table] }
    - id: ask_for_the_stalls
      label: ขอไปเดินแผงแทนวันนี้
      refuse: true
      text: |
        โอเวสไม่เงยหน้า บอกเลขถัดไปให้โต๊ะว่าง แล้วไล่หาเอง ช้ากว่าที่ไล่คู่กับ{name}ครึ่งหนึ่ง

        ตอนเย็น{name}กลับมาพร้อมของหนึ่งชิ้นจากตลาด โอเวสบอกเลขทะเบียนของมันก่อน{name}จะวางลงบนโต๊ะ
      effects: { flags: [skipped_matching_day] }

# ---------- งานที่ห้องส่ง: งานครั้งเดียว ----------
- id: adult.reclaim_duty_widows_receipt
  stage: adult
  scene: home
  weight: 20
  duty: reclaimers
  when:
    age: [24, 64]
    org: reclaimers
  text: |
    บ้านของอาจารย์มาเธนขายทอดใช้หนี้ธนาคารเบเลค คนประเมินของธนาคารเดินจดของทุกชิ้นไว้ตั้งแต่วันที่สองหลังงานศพ โต๊ะ เตียง ช้อน หนังสือ ในรายการบรรทัดที่สี่สิบมีหนังสือเล่มหนึ่ง ตีราคาไว้เก้าเหรียญ เล่มนั้นมีเลขทะเบียนของสถาบันที่สันปก

    ภรรยาม่ายของมาเธนรู้ว่าห้องบัญชีหายจะมา นางรอ{name}อยู่หน้าประตู มือถือรายการของธนาคาร นางไม่ได้ขอให้ทิ้งหนังสือไว้ นางขอใบรับ ถ้าหนังสือหายจากบ้านโดยไม่มีใบรับ ธนาคารจะนับว่านางแอบขาย แล้วทวงเก้าเหรียญจากนาง
  choices:
    - id: write_the_widows_receipt
      label: เขียนใบรับให้นาง ชัดทุกตัว แล้วเอาเล่มไป
      text: |
        {name}เขียนช้ากว่าทุกใบที่เคยเขียน เลขทะเบียน วันที่ ลายมือชื่อ เขียนชื่อมาเธนในช่องหมายเหตุว่าเป็นผู้ยืมคนสุดท้าย ภรรยาม่ายอ่านใบรับสามรอบ แล้วพับเป็นสี่ เก็บไว้ในถุงผ้าที่ห้อยคอ

        สามวันต่อมาคนประเมินกลับมา นางหยิบใบรับออกจากถุงผ้าให้เขาดู เขาขีดบรรทัดที่สี่สิบทิ้งด้วยเส้นเดียว หนี้ของนางเท่าเดิม ไม่ได้มากขึ้นเก้าเหรียญ
      effects: { alignment: { law: 1 }, flags: [gave_the_widow_her_receipt] }
    - id: sign_the_bank_list
      label: เขียนใบรับ แล้วรอคนประเมินมาลงชื่อกำกับในรายการของธนาคารต่อหน้า
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          คนประเมินมาถึงตอนบ่าย ไม่พอใจที่มีคนรอ เขาอ่านใบรับ อ่านกฎของสถาบันที่{name}ท่องให้ฟังทีละข้อ แล้วยอมขีดบรรทัดที่สี่สิบทิ้งต่อหน้า ลงชื่อกำกับ {name}ลงชื่อกำกับต่อใต้ชื่อเขา

          ภรรยาม่ายขอให้{name}ลงชื่อในใบรับอีกครั้ง บนด้านหลัง เผื่อใครถาม {name}ลงให้ นางเก็บทั้งใบรับกับรายการไว้ในถุงผ้าที่ห้อยคอ
        effects: { stats: { CHA: 1 }, flags: [gave_the_widow_her_receipt] }
      failure:
        text: |
          คนประเมินอ่านใบรับแล้ววางคืน บอกว่าใบรับของคนถือบัญชีไม่ใช่ตราของสถาบัน ธนาคารรับเฉพาะตรา เขาไม่ขีดบรรทัดที่สี่สิบ แล้วเดินไปจดของในห้องครัวต่อ

          ก่อนออกจากบ้าน{name}วางสองเหรียญไว้ใต้ถ้วยบนโต๊ะ ภรรยาม่ายเห็น ไม่ได้คืน ไม่ได้ขอบคุณ นางเอาเหรียญใส่ถุงผ้าที่ห้อยคอ คู่กับใบรับ
        effects: { gold: -2, flags: [widow_still_owed_the_bank] }
    - id: stamp_the_bank_list
      label: ประทับตราทองเหลืองของสถาบันลงในรายการของธนาคาร
      requires: { org: { id: reclaimers, min_rank: 3 } }
      text: |
        ตราทองเหลืองลงบนกระดาษรายการของธนาคารตรงบรรทัดที่สี่สิบ ครั่งสีแดงซึมลงไปจนถึงบรรทัดที่สี่สิบเอ็ด คนประเมินกลับมาตอนเย็น เห็นตรานั้นแล้วไม่ถามอะไรสักคำ ขีดทิ้งเอง

        ภรรยาม่ายเอานิ้วแตะครั่งที่แห้งแล้วเบาๆ เหมือนแตะของที่ยังร้อน บรรทัดที่สี่สิบเอ็ดเป็นเตียงของมาเธน ตีราคาไว้สี่เหรียญ ครั่งเปื้อนตัวเลขไปครึ่งตัว
      effects: { reputation: { royal_institute: 1 }, flags: [stamped_the_widows_list] }
    - id: leave_it_on_the_list
      label: ไม่ทวงเล่มนี้ ปล่อยไว้ในรายการของธนาคาร
      refuse: true
      text: |
        ภรรยาม่ายยืนดู{name}เดินจากไปจนถึงหัวถนน มือยังถือรายการของธนาคาร

        เล่มนั้นขึ้นโต๊ะขายทอดในเดือนต่อมา พ่อค้าเสียงนุ่มคนหนึ่งให้สิบเหรียญ ไม่ต่อราคา ปลายปีห้องบัญชีหายซื้อคืนจากเขาสิบสองเหรียญ
      effects: { flags: [left_the_widows_book] }

- id: adult.reclaim_duty_pawnshop
  stage: adult
  weight: 20
  duty: reclaimers
  when:
    age: [24, 64]
    org: { id: reclaimers, max_rank: 3 }
  text: |
    โรงรับจำนำของวิลเมสมีกล้องส่องดาวพับได้ตัวหนึ่งวางอยู่บนหิ้งหลังโต๊ะรับของ ทองเหลืองขัดเงา เลขใต้ฐานตรงกับบรรทัดหนึ่งในสำเนาบัญชีของ{name} วิลเมสไม่เถียง เขาเปิดลิ้นชัก หยิบกระดาษสีงาช้างแผ่นหนึ่งออกมาวาง

    ใบรับของห้องบัญชีหาย ลงวันที่เมื่อสองฤดูก่อน เลขทะเบียนตรง ลายมือชื่อเป็นชื่อเวลดิส วิลเมสเล่าว่าคนที่เอากล้องมาจำนำยื่นใบนี้ให้ดูว่าห้องเอาไปแล้วครั้งหนึ่งแล้วคืนให้ เขาจ่ายไปสี่เหรียญ ใบรับนั้นสีถูก ขอบฉีกถูก ลายมือชื่อสวยกว่าลายมือชื่อของเวลดิสทุกใบที่{name}เคยเห็น
  choices:
    - id: take_it_and_write_true
      label: เอากล้องไป เขียนใบรับจริงให้ บอกเขาว่าใบเดิมปลอม
      text: |
        วิลเมสอ่านใบรับจริงเทียบกับใบปลอม วางคู่กันบนโต๊ะ ใบจริงลายมือแย่กว่า เขาถามว่าใครทำใบปลอม {name}บอกว่าพ่อค้าเสียงนุ่ม เขาบอกชื่อออกมาเองก่อน{name}จะพูดจบ เพนดิส

        เขาตอกตะปูแขวนใบปลอมไว้บนผนังหลังโต๊ะรับของ ข้างใบรับจริง ใต้ทั้งสองใบเขียนด้วยถ่านว่าสี่เหรียญ
      effects: { alignment: { law: 1 }, flags: [took_the_pawned_scope] }
    - id: read_the_forgery
      label: อ่านใบรับปลอมให้ออกว่าเป็นฝีมือใคร
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ขอบฉีกของใบปลอมตรงกับเล่มใบรับเล่มที่สามสิบเอ็ด เล่มที่สามสิบเอ็ดยังไม่ได้แกะห่อในห้อง วางอยู่ในหีบใต้โต๊ะของเวลดิส ห่อยังผูกเชือกอยู่ คนที่ปลอมได้เห็นกระดาษเล่มนั้นก่อนห้อง แปลว่าได้กระดาษมาจากที่เดียวกับที่ห้องซื้อ

          {name}เอาใบปลอมกลับไปด้วย เขียนใบรับจริงให้วิลเมส ในห้องใต้หอสมุด เวลดิสเอาใบปลอมไปวางข้างใบจริงของนาง สองมือเขียนบันทึกพร้อมกันคนละเรื่อง มือหนึ่งเขียนเรื่องใบปลอม อีกมือเขียนจดหมายถึงร้านขายกระดาษ
        effects: { stats: { INT: 1 }, flags: [traced_the_forged_receipt] }
      failure:
        text: |
          {name}ดูไม่ออกว่าผิดตรงไหนนอกจากลายมือที่สวยเกินไป วิลเมสไม่ยอมให้เอากล้องไปจนกว่าจะมีคนที่ลงชื่อเดียวกับใบนั้นมาบอกเอง {name}ต้องวางเงินมัดจำสองเหรียญไว้บนโต๊ะเขา เป็นประกันว่าห้องจะกลับมา

          สัปดาห์ต่อมาเขาส่งจดหมายร้องเรียนถึงสถาบัน ถามว่าทำไมห้องบัญชีหายเอาของเดียวกันไปสองครั้ง จดหมายฉบับนั้นวนกลับลงมาถึงโต๊ะของเวลดิส นางอ่านด้วยมือซ้าย ตอบด้วยมือขวา
        effects: { reputation: { royal_institute: -1 }, gold: -2, flags: [fooled_by_the_forged_receipt] }
    - id: pay_him_back
      label: จ่ายสี่เหรียญที่วิลเมสเสียไปจากกระเป๋าตัวเอง
      requires: { min_gold: 4 }
      text: |
        ห้องไม่ซื้อของคืน กฎไม่ได้พูดถึงคนของห้อง {name}นับสี่เหรียญวางบนโต๊ะรับของ เขียนใบรับจริง แล้วเอากล้องไป วิลเมสนับเหรียญสองรอบ

        เขาฉีกใบปลอมเป็นสี่ชิ้นต่อหน้า{name} ทิ้งลงเตา เดือนต่อมาโรงรับจำนำของวิลเมสติดกระดาษแผ่นเล็กไว้ที่ประตู ไม่รับของที่มีเลขทะเบียน
      effects: { gold: -4, alignment: { moral: 1 }, stats: { CHA: 1 }, flags: [paid_the_pawnbroker] }
    - id: leave_it_on_the_shelf
      label: ปล่อยกล้องไว้บนหิ้งไปก่อน
      refuse: true
      text: |
        วิลเมสเก็บใบปลอมเข้าลิ้นชักตามเดิม กล้องส่องดาวยังวางอยู่บนหิ้ง เลนส์หันออกหน้าต่าง

        ฤดูต่อมาคนที่มาไถ่กล้องคืนเป็นพ่อค้าเสียงนุ่ม จ่ายห้าเหรียญ เอาใบปลอมคืนไปด้วย
      effects: { flags: [left_the_pawned_scope] }

- id: adult.reclaim_duty_village_healer
  stage: adult
  weight: 20
  duty: reclaimers
  when:
    age: [24, 64]
    org: { id: reclaimers, min_rank: 2 }
  text: |
    รอยของเล่มนี้ยาวสี่บรรทัดในสำเนาบัญชี ร้านหนังสือในเมือง พ่อค้าเร่ หมู่บ้านริมลำธาร แล้วก็ว่าง คนตามรอยตามบรรทัดที่ว่างเอง {name}ตามคนเดียว เดินถามจากบ้านแรกของหมู่บ้านถึงบ้านสุดท้าย ทุกบ้านชี้ไปทางเดียวกัน

    บ้านหลังสุดท้ายเป็นของยายอาเดล หมอยาของหมู่บ้าน ตำราเล่มนั้นวางอยู่บนหิ้งข้างหม้อต้มยา ตำรายาของสำนักรักษา ปกหลุดไปแล้วครึ่งหนึ่ง ทุกหน้าที่ใช้มีด้ายสีแดงผูกคั่นไว้ ยายอาเดลอ่านได้ไม่หมด นางดูรูปเอา จำว่าใบไหนต้มกับอะไร เด็กทั้งหมู่บ้านไข้ลดเพราะหน้าที่มีด้ายแดง ตำราเล่มนี้ไม่เคยทำให้ใครตาย

    กฎของห้องว่าของที่ไม่เคยทำให้ใครตายกลับขึ้นชั้น ชั้นของหอสมุดอยู่ห่างจากหมู่บ้านนี้หลายวันเดิน
  choices:
    - id: take_with_receipt
      label: เขียนใบรับให้ยายอาเดล แล้วเอาเล่มไป
      text: |
        ยายอาเดลไม่ห้าม นางขอเวลาดึงด้ายแดงออกทีละเส้น เก็บใส่ถ้วยกระเบื้อง ด้ายสิบเจ็ดเส้น {name}เขียนใบรับ นางรับไว้ วางในถ้วยเดียวกับด้าย

        กลางหนาวนั้น{name}ได้ข่าวจากพ่อค้าเร่ที่ผ่านมาว่าหมู่บ้านริมลำธารมีเด็กไข้ไม่ลดสองคน คนหนึ่งหายเอง ตำราเล่มนั้นขึ้นชั้นของหอสมุดไปแล้ว อยู่ระหว่างเล่มที่ไม่มีใครยืมมาหลายปี
      effects: { alignment: { law: 1 }, flags: [took_the_village_herbal] }
    - id: copy_the_red_pages
      label: นั่งคัดหน้าที่มีด้ายแดงให้ครบก่อนเอาเล่มไป
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          สิบเจ็ดหน้า คัดทั้งรูปทั้งตัวหนังสือ สี่คืนเต็มบนโต๊ะในครัวของยายอาเดล ตะเกียงน้ำมันหมูควันขึ้นตาจนแสบ รูปใบไม้วาดด้วยถ่านแล้วระบายด้วยน้ำใบไม้จริง นางชี้สีให้ทีละใบ

          ตอนออกเดินทาง กระดาษสิบเจ็ดแผ่นวางอยู่บนหิ้งข้างหม้อต้มยาแทนตำรา ผูกด้ายแดงคั่นไว้ทุกแผ่น ตำราเล่มจริงอยู่ในย่ามของ{name} พร้อมใบรับที่ยายอาเดลขอให้เขียนว่าคัดแล้ว
        effects: { stats: { DEX: 1 }, flags: [copied_the_red_thread_pages] }
      failure:
        text: |
          คืนที่สามน้ำมันตะเกียงหมด {name}คัดต่อด้วยแสงเตาไฟ หน้าที่สิบสองตัวเลขปริมาณยาเลือนไปครึ่งตัว คัดออกมาเป็นสาม ไม่ใช่แปด ยายอาเดลไม่รู้หนังสือพอจะเห็น

          {name}เห็นเองตอนเดินออกจากหมู่บ้านไปได้ครึ่งวัน ต้องเดินย้อนกลับไปแก้ ค่าข้าวกับค่าที่นอนอีกสองคืนจ่ายจากกระเป๋าตัวเอง
        effects: { gold: -2, flags: [copied_the_red_thread_pages] }
    - id: teach_her_the_pages
      label: สอนยายอาเดลอ่านหน้าที่นางใช้ จนนางจำตัวหนังสือได้เอง
      requires: { any_flags: [job_road_healer, job_hedge_doctor] }
      text: |
        คนรักษาคนอ่านตำรายาเร็วกว่าคนอื่น {name}สอนยายอาเดลอ่านชื่อสมุนไพรทีละชื่อ ตัวเลขปริมาณยาทีละตัว นางท่องตามเสียงดัง เด็กในหมู่บ้านมานั่งฟังที่หน้าต่างจนท่องได้ก่อนนาง

        สามวันต่อมา{name}เขียนใบรับแล้วเอาเล่มไป ยายอาเดลไม่ต้องดูรูปอีกแล้ว เด็กคนที่ท่องได้ก่อนนางมานั่งข้างหม้อต้มยาทุกเย็น
      effects: { alignment: { moral: 1 }, reputation: { royal_institute: 1 }, stats: { WIS: 1 }, flags: [taught_the_village_healer] }
    - id: write_not_found
      label: เขียนในสำเนาบัญชีว่าตามไม่พบ
      refuse: true
      text: |
        {name}เขียนสามคำในบรรทัดที่ว่าง ตามไม่พบ ลงชื่อกำกับ ตำรายังอยู่บนหิ้งข้างหม้อต้มยา ด้ายแดงสิบเจ็ดเส้นยังผูกอยู่ทุกเส้น

        ในห้องใต้หอสมุด โอเวสอ่านบรรทัดนั้นแล้วพูดเลขทะเบียนออกมาครั้งหนึ่ง คนที่ได้ยินรู้ว่าเลขนั้นจะกลับไปอยู่ในกองที่ต้องตามใหม่
      effects: { alignment: { moral: 1, law: -1 }, flags: [left_the_village_herbal] }

- id: adult.reclaim_duty_read_first
  stage: adult
  weight: 20
  time: night
  duty: reclaimers
  when:
    age: [24, 64]
    org: { id: reclaimers, max_rank: 3 }
  text: |
    กล่องตะกั่วใบเล็กเท่าหมอน ฝาบัดกรีปิดไว้แค่สามจุด ข้างในเป็นสมุดจดของอาจารย์สำนักกลั่นคนหนึ่ง คนอ่านตายไปแล้วห้าคน คนสุดท้ายเป็นลูกศิษย์ของเขาเอง ห้าเกินสาม ไม่ต้องมีใครตัดสิน เล่มนี้เข้าหีบ งานของ{name}คือแบกกล่องไปส่งถึงห้องใต้หอสมุด สามวันเดิน

    คืนที่สอง ในห้องโรงเตี๊ยม กล่องวางอยู่บนโต๊ะข้างตะเกียง ป้ายกระดาษที่ผูกกับกล่องเขียนชื่อสมุดไว้ ลายมือของคนที่เก็บมา สิ่งที่ตอบกลับจากโหล

    {name}รู้ว่าบัดกรีสามจุดนั้นแงะออกได้ด้วยมีดเล่มเดียว แล้วบัดกรีกลับได้ด้วยตะเกียงดวงนี้ ห้องจะไม่รู้
  choices:
    - id: read_one_page
      label: แงะฝาออก อ่านหน้าแรกหน้าเดียว แล้วบัดกรีคืน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          หน้าแรกมีแค่สิบสองบรรทัด อาจารย์คนนั้นเขียนว่าโหลที่กลั่นแล้วใบหนึ่งตอบเขาเป็นคำ คำเดียว ซ้ำทุกคืน แล้วเขาก็เขียนคำนั้นไว้บรรทัดสุดท้าย {name}อ่านจบก่อนตาจะไปถึงคำนั้น หลับตาทัน ปิดสมุด เลือดกำเดาไหลลงบนแขนเสื้อสองหยด

          บัดกรีคืนตรงรอยเดิมได้เรียบร้อย ไม่มีใครในห้องเห็น สามวันต่อมาที่ตลาดหน้าหอสมุด ชายยิ้มคนหนึ่งเดินสวน{name} ฮัมเสียงเดียวยาวๆ เสียงเดียวกับที่ดังอยู่ในหัว{name}ตั้งแต่คืนนั้น
        effects: { stats: { INT: 1 }, hp: -1, hunted: { star_listeners: 1 }, flags: [read_the_jar_notebook_first] }
      failure:
        text: |
          ตาไปถึงบรรทัดสุดท้ายก่อนใจจะสั่งให้หยุด คำนั้นไม่ได้ยาก เป็นคำธรรมดาที่ทุกคนรู้จัก แต่หลังจากอ่าน เสียงตะเกียงที่ลุกเงียบๆ ดังขึ้นเป็นคำนั้นทุกครั้งที่เปลวไฟไหว {name}ปิดสมุด เลือดกำเดาไหลไม่หยุดจนผ้าเช็ดหน้าชุ่มสองผืน

          บัดกรีคืนเบี้ยวไปจากรอยเดิม ที่ห้องใต้หอสมุด เวลดิสเห็นรอยนั้นตั้งแต่กล่องยังอยู่ในมือ{name} นางเซ็นรับด้วยมือขวา มือซ้ายเขียนชื่อ{name}ลงในหน้าที่ไม่มีใครอยากมีชื่อ
        effects: { hp: -2, flags: [read_the_jar_notebook_first, veldis_saw_the_solder] }
    - id: carry_it_sealed
      label: เอาผ้าคลุมกล่องไว้ แล้วนอนหันหลังให้โต๊ะ
      text: |
        {name}คลุมกล่องด้วยเสื้อคลุม นอนหันหน้าเข้าผนัง ได้ยินเสียงตะเกียงลุกอยู่ข้างหลังจนน้ำมันหมด วันรุ่งขึ้นเดินเร็วขึ้น ถึงห้องใต้หอสมุดก่อนกำหนดครึ่งวัน

        เวลดิสเซ็นรับด้วยมือขวา มือซ้ายลงบรรทัดในสมุดเล่มหนาว่าเข้าหีบ บัดกรีสามจุดไม่มีรอยแงะ นางดูรอยบัดกรีนานกว่าดูหน้าคนส่ง
      effects: { alignment: { law: 1 }, stats: { CON: 1 }, flags: [carried_the_jar_notebook_sealed] }
    - id: ask_what_it_says
      label: ส่งข่าวถามคนถือตราทวงว่าในสมุดเขียนอะไร
      text: |
        คำตอบมาถึงก่อน{name}จะออกจากโรงเตี๊ยม ลายมือของลีเซน บรรทัดเดียว ห้าคน

        {name}พับกระดาษแผ่นนั้นเก็บไว้ในเสื้อ แบกกล่องต่อจนถึงห้องใต้หอสมุด กระดาษแผ่นนั้นอยู่ในเสื้อตลอดทาง
      effects: { flags: [asked_lisen_about_the_box] }
    - id: hand_the_box_on
      label: ฝากกล่องให้คนของห้องคนอื่นแบกต่อ
      refuse: true
      text: |
        {name}ส่งข่าวไปถึงห้อง รอสองวันในโรงเตี๊ยมจนคนของห้องอีกคนมารับ เขาไม่ถามเหตุผล แบกกล่องขึ้นบ่าแล้วออกเดินทางทันที

        ห้องคิดค่าโรงเตี๊ยมสองคืนนั้นเป็นของ{name}เอง
      effects: { gold: -1, flags: [handed_off_the_jar_notebook] }

- id: adult.reclaim_duty_dead_makers_house
  stage: adult
  weight: 20
  duty: reclaimers
  when:
    age: [24, 64]
    org: reclaimers
  text: |
    อาจารย์เบลดันตายมาสามฤดูแล้ว โรงช่างหลังบ้านของเขามีของที่มีเลขทะเบียนเก้าชิ้นตามสำเนาบัญชี ทายาทเปิดประตูหน้าให้ แต่ไม่ยอมเดินเข้าไปด้วย บอกว่าคนรับใช้ของอาจารย์ยังทำงานอยู่

    คนรับใช้เป็นหุ่นทองเหลืองสูงเท่าประตู เดินวนรอบโรงช่างตามทางเดิมทุกรอบ ยกของที่วางผิดที่ไปวางคืนที่เดิม เช็ดโต๊ะที่ไม่มีฝุ่น ของเก้าชิ้นที่ห้องต้องเอาไปวางอยู่บนชั้นที่ทางเดินของหุ่นผ่านทุกรอบ
  encounter:
    foe: house_servitor
    name: หุ่นรับใช้ของอาจารย์เบลดัน
    morale: 2
    beats:
      - text: หุ่นเดินผ่านประตู หยุดตรงหน้า{name} หัวทองเหลืองหมุนไปมาเหมือนนับของ แล้วยื่นแขนยาวออกมาจะยก{name}ไปวางนอกประตู แบบที่ยกหีบที่วางผิดที่
        moves:
          - id: bs_duck
            label: ก้มลอดใต้แขนไปยืนอีกฝั่งของโต๊ะ
            kind: quick
          - id: bs_ledger
            label: ยกสำเนาบัญชีขึ้นอ่านเลขทะเบียนของหุ่นให้มันฟัง
            kind: talk
          - id: bs_watch_route
            label: ดูทางเดินของมันให้ครบหนึ่งรอบ
            kind: read
            stat: WIS
            success: ทางเดินของหุ่นมีสิบสองจุด จุดที่เจ็ดมันหันหลังให้ชั้นนานเท่าเช็ดโต๊ะหนึ่งตัว ของเก้าชิ้นอยู่บนชั้นนั้นพอดี
      - text: หุ่นเห็นมือของ{name}แตะของบนชั้น มันหันขวับ ก้าวยาวสองก้าวมาถึง มือเหล็กยื่นมาจะกดหัวลงให้พ้นทาง
        answer: quick
        moves:
          - id: bs_slip
            label: ลื่นตัวหลบไปข้างหลังมัน
            kind: quick
          - id: bs_brace
            label: ยกม้านั่งขึ้นรับมือเหล็ก
            kind: guard
          - id: bs_swap
            label: วางของอย่างอื่นขนาดเท่ากันไว้แทนที่บนชั้น
            kind: read
            stat: INT
            success: หุ่นหยุดกลางทาง หัวหมุนไปที่ชั้น นับของ ครบเก้า มันลดแขนลง เดินกลับเข้าทางเดิมของมัน ของบนชั้นตอนนี้เป็นอิฐเก้าก้อน
      - text: หุ่นเริ่มรอบใหม่ เร็วกว่าเดิม เหมือนรู้ว่ามีอะไรผิด แขนยาวกวาดชั้นทุกชั้นที่ผ่าน
        answer: quick
        moves:
          - id: bs_last_dash
            label: รอให้มันผ่านจุดที่เจ็ด แล้ววิ่งเข้าไปคว้าของที่เหลือ
            kind: quick
            success: หุ่นเลี้ยวที่จุดที่เจ็ด หันหลังให้ชั้นพอดีกับที่{name}คว้าชิ้นสุดท้ายลงย่าม มันเช็ดโต๊ะต่อ ไม่หันกลับมา
          - id: bs_shove
            label: ผลักมันให้เสียหลักชนผนัง
            kind: attack
            tags: [blunt]
          - id: bs_hold_door
            label: ยืนขวางประตูไว้ ไม่ให้มันเดินออกไปข้างนอก
            kind: guard
    win:
      text: |
        ของเก้าชิ้นอยู่ในย่าม หุ่นยังเดินวนต่อในโรงช่าง เช็ดโต๊ะ ยกอิฐที่วางผิดที่ไปวางคืนที่เดิม {name}เขียนใบรับเก้าใบให้ทายาท ทายาทถามว่าหุ่นจะทำอย่างไร

        หุ่นไม่มีเลขทะเบียน ไม่ใช่ของของสถาบัน เป็นของอาจารย์เบลดัน และตอนนี้เป็นของทายาท {name}บอกตามนั้น ทายาทปิดประตูโรงช่างลงกลอน ข้างในเสียงเท้าทองเหลืองยังเดินวนไม่หยุด
      effects: { stats: { DEX: 1 }, flags: [cleared_beldans_shelf] }
    lose:
      text: |
        {name}นอนอยู่บนหญ้าหน้าโรงช่าง หลังระบมจากตอนโดนวางลงพื้นแรงกว่าที่ควรวางหีบ ประตูโรงช่างปิดเอง ข้างในเสียงเท้าทองเหลืองเดินวนต่อ

        ทายาทยื่นน้ำมาให้ บอกว่าเขาก็โดนแบบเดียวกันเมื่อฤดูก่อน ของเก้าชิ้นยังอยู่บนชั้น
      effects: { flags: [set_outside_by_beldans_servant] }
    stalemate:
      text: |
        {name}ได้ของมาห้าชิ้นก่อนหุ่นจะยืนขวางชั้นไว้ไม่ขยับ ไม่เดินวนต่อ หัวเหล็กรู้แล้วว่าของหายไปครึ่ง ยืนนับของที่เหลืออยู่อย่างนั้น

        ใบรับห้าใบให้ทายาท ในสำเนาบัญชีเขียนว่าอีกสี่ชิ้นยังอยู่ในความดูแลของคนรับใช้ ลีเซนอ่านบรรทัดนั้นแล้วบอกว่าเป็นบรรทัดที่ถูกต้องที่สุดที่นางเคยอ่าน
      effects: { flags: [took_half_of_beldans_shelf] }

- id: adult.reclaim_duty_read_aloud
  stage: adult
  weight: 20
  time: night
  duty: reclaimers
  when:
    age: [24, 64]
    org: reclaimers
    not_traits: [curse_brand]
  text: |
    นักเรียนคนหนึ่งเช่าห้องใต้หลังคาบ้านแม่ค้าขนมปัง อ่านหน้าหนึ่งในสมุดที่ไม่ควรอ่านออกเสียง อ่านออกเสียงเพราะห้องมืดและเขากลัว ตั้งแต่คืนนั้นห้องใต้หลังคามีเงาเกินมาหนึ่งเงา นักเรียนหนีกลับบ้านไปแล้ว สมุดยังอยู่บนโต๊ะในห้องนั้น เลขทะเบียนตรงกับบรรทัดในสำเนาบัญชี

    แม่ค้าขนมปังจุดตะเกียงไว้บนขั้นบันไดทุกขั้นตั้งแต่ชั้นล่างถึงประตูห้อง นางไม่ขึ้นไปเอง บอกว่าเงานั้นไม่เคยลงมาข้างล่าง ตราบที่ตะเกียงยังติด แต่ตะเกียงบนขั้นบนสุดดับไปเมื่อคืน
  encounter:
    foe: extra_shadow
    name: เงาเกินในห้องใต้หลังคา
    morale: 2
    beats:
      - text: ประตูห้องใต้หลังคาเปิดเอง ห้องมืดจนแสงตะเกียงในมือ{name}ส่องไปได้แค่ครึ่งห้อง สมุดอยู่บนโต๊ะริมหน้าต่าง ฝั่งที่มืด บนผนังข้างโต๊ะมีเงาของคนยืนอยู่ ไม่มีคน
        moves:
          - id: ra_light_all
            label: จุดตะเกียงทุกดวงที่แม่ค้าวางไว้บนบันไดแล้วยกขึ้นมาวางรอบห้อง
            kind: guard
            tags: [light]
          - id: ra_lamp_forward
            label: ชูตะเกียงขึ้นสูง เดินตรงไปที่โต๊ะ
            kind: attack
            tags: [light]
          - id: ra_count_shadows
            label: นับเงาในห้องทีละเงา หาว่าเงาไหนเกิน
            kind: read
            stat: WIS
            success: เงาของโต๊ะ เงาของเก้าอี้ เงาของ{name}เอง เงาที่สี่ไม่มีอะไรทอดลงมา และเงาที่สี่ไม่ขยับตามแสงตะเกียง มันขยับตามเสียง
          - id: ra_back_down
            label: ถอยลงบันได
            kind: flee
      - text: เงาเกินยืดตัวขึ้นตามผนังจนสูงเท่าเพดาน แล้วทิ้งตัวลงมาทับเงาจริงของ{name}บนพื้น ขาทั้งสองข้างหนักขึ้นทันที
        answer: guard
        moves:
          - id: ra_ring_of_light
            label: วางตะเกียงลงรอบเท้าให้แสงส่องทุกด้าน
            kind: guard
            tags: [light]
          - id: ra_cut
            label: ฟันมีดลงตรงที่เงาทับ
            kind: attack
            tags: [edge]
          - id: ra_burn_page
            label: จุดไฟเผามุมกระดาษหน้าที่นักเรียนอ่าน
            kind: item
            stat: DEX
            tags: [fire]
          - id: ra_back_down2
            label: ลากขาที่หนักถอยไปทางประตู
            kind: flee
      - text: เงาหดลงไปอยู่ใต้โต๊ะ ตรงที่มืดที่สุดในห้อง สมุดอยู่บนโต๊ะเหนือมันพอดี
        answer: attack
        moves:
          - id: ra_lamp_under
            label: ยื่นตะเกียงลงไปใต้โต๊ะ
            kind: attack
            tags: [light]
            success: แสงตะเกียงลงไปถึงใต้โต๊ะทุกมุม เงาเกินขาดเป็นริ้ว หดเล็กลงจนเท่าเงาของแมว แล้วก็ไม่มีอะไรเหลือ ห้องใต้หลังคามีเงาเท่ากับของในห้อง
          - id: ra_grab_book
            label: คว้าสมุดบนโต๊ะแล้วกระโดดถอยเข้าแสง
            kind: quick
          - id: ra_hold_light
            label: ยืนนิ่งกลางวงแสง รอให้มันออกมาเอง
            kind: guard
          - id: ra_back_down3
            label: วิ่งลงบันไดไปหาแสงตะเกียงข้างล่าง
            kind: flee
    win:
      text: |
        สมุดอยู่ในมือ{name} หน้าที่นักเรียนอ่านมีรอยนิ้วเปื้อนเหงื่อ ห้องนี้ไม่มีเรื่องต้องตัดสิน คนอ่านยังไม่ตาย แต่{name}เผาหน้านั้นทิ้งบนขั้นบันไดต่อหน้าแม่ค้าขนมปัง แล้วเขียนในใบรับว่าขาดหนึ่งหน้า

        สามคืนต่อมามีคนเคาะประตูร้านขนมปังตอนดึก ถามหาสมุดที่มีหน้าขาด ยิ้มตลอดเวลาที่ถาม แม่ค้าบอกว่าคนของสถาบันเอาไปแล้ว เขาจดชื่อที่นางจำได้จากใบรับ
      effects: { stats: { WIS: 1 }, hunted: { star_listeners: 1 }, flags: [burned_the_read_aloud_page] }
    lose:
      text: |
        {name}ล้มลงตรงหน้าประตูห้อง ลมหายใจหายไปครึ่งหนึ่งเหมือนมีใครเอาไป แม่ค้าขนมปังได้ยินเสียง ถือตะเกียงสามดวงขึ้นมาถึงขั้นบนสุด แสงพอให้ลาก{name}ลงมาข้างล่าง

        สมุดยังอยู่บนโต๊ะในห้องใต้หลังคา แม่ค้าจุดตะเกียงบนบันไดทุกขั้นอีกครั้ง คืนนั้นทั้งคืนนางนั่งเฝ้าเติมน้ำมัน
      effects: { flags: [lost_to_the_extra_shadow] }
    stalemate:
      text: |
        น้ำมันในตะเกียงของ{name}เหลือก้นดวง เงาเกินไม่ออกจากใต้โต๊ะ {name}คว้าสมุดได้ตอนเงาหดตัวหนีแสง แล้วถอยลงบันได ห้องใต้หลังคายังมีเงาที่สี่อยู่

        แม่ค้าขนมปังตอกตะปูปิดประตูห้องใต้หลังคาตั้งแต่เช้า ห้องนั้นไม่มีใครเช่าอีก
      effects: { flags: [took_the_book_left_the_shadow] }
    flee:
      text: |
        {name}ถอยลงมาถึงชั้นล่างที่ตะเกียงยังติดทุกดวง ขาทั้งสองข้างยังหนักเหมือนลุยโคลนไปจนสาง

        สมุดยังอยู่บนโต๊ะในห้องใต้หลังคา ในสำเนาบัญชี{name}เขียนว่ายังไม่ได้ทวง ตามด้วยคำว่าต้องใช้ตะเกียงมากกว่านี้
      effects: { flags: [fled_the_extra_shadow] }
    death:
      text: |
        เงาเกินทาบลงบนเงาจริงของ{name}จนเหลือเงาเดียว ตะเกียงหลุดมือกลิ้งไปใต้โต๊ะ ส่องสมุดจากข้างล่าง

        แม่ค้าขนมปังขึ้นมาตอนสาง เห็น{name}นอนอยู่ข้างโต๊ะ ไม่มีแผล บนพื้นมีเงาของโต๊ะ เงาของเก้าอี้ แต่ไม่มีเงาของ{name}

- id: adult.reclaim_duty_fifth_year_sentry
  stage: adult
  weight: 20
  duty: reclaimers
  when:
    age: [24, 64]
    org: reclaimers
  text: |
    งานปีห้าของเคลรินผ่านการสอบด้วยคะแนนสูงสุดของรุ่น หุ่นยามที่จำหน้าคนได้ห้าสิบหน้า ไม่ให้หน้าอื่นผ่าน สถาบันขึ้นทะเบียนแล้วให้ยืมไปทดลองที่โกดังเครื่องเทศริมทาง เคลรินจบไปอยู่ไกลอีกฟากอาณาจักร หุ่นยังอยู่ที่โกดัง และไม่มีใครในโกดังมีหน้าอยู่ในห้าสิบหน้านั้น เจ้าของโกดังก็ไม่มี

    เจ้าของโกดังเข้าโกดังตัวเองไม่ได้มาสองเดือนแล้ว เครื่องเทศในโกดังเริ่มขึ้นรา หุ่นยืนอยู่หน้าประตู สูงกว่าคนครึ่งตัว ไฟที่ช่องตาสว่างทุกครั้งที่มีคนเข้าใกล้เกินสิบก้าว ห้องต้องการหุ่นกลับขึ้นชั้น
  encounter:
    foe: mad_sentry
    name: หุ่นยามงานปีห้าของเคลริน
    morale: 2
    beats:
      - text: '{name}ก้าวเข้าเขตสิบก้าว ไฟที่ช่องตาสว่าง หุ่นหมุนตัวมาทางนี้ เสียงเฟืองข้างในดังเหมือนคนกระแอม'
        moves:
          - id: fy_read_neck
            label: ดูตราที่หลังคอมัน หาช่องไขลาน
            kind: read
            stat: INT
            success: หลังคอมีช่องไขลานรูปสี่เหลี่ยม ข้างช่องสลักตัวอักษรเล็กๆ ชื่อเคลริน กับเลขทะเบียน ช่องนั้นกว้างพอให้เหล็กแหลมขัดเข้าไปได้ เฟืองที่หมุนอยู่ข้างในจะกินกันเอง
          - id: fy_circle
            label: เดินวนรอบเขตสิบก้าว ให้มันหมุนตามจนเสียจังหวะ
            kind: quick
          - id: fy_show_face
            label: ยืนนิ่งให้มันส่องหน้า
            kind: guard
          - id: fy_step_out
            label: ถอยออกนอกเขตสิบก้าว
            kind: flee
      - text: หุ่นเดินเข้ามาสามก้าวยาว แขนทองเหลืองเหวี่ยงตัดอากาศเป็นแนวราบระดับซี่โครง
        answer: quick
        moves:
          - id: fy_drop
            label: ทิ้งตัวลงต่ำให้แขนผ่านเหนือหัว
            kind: quick
          - id: fy_crate
            label: ดึงลังเครื่องเทศมาขวางรับแขนเหล็ก
            kind: guard
          - id: fy_slash
            label: ฟันข้อศอกมัน
            kind: attack
            tags: [edge]
          - id: fy_step_out2
            label: วิ่งออกนอกเขตสิบก้าว
            kind: flee
      - text: แขนข้างหนึ่งของหุ่นค้างกลางอากาศ มันหมุนตัวหันหลังให้{name}ครึ่งหนึ่งเพื่อเหวี่ยงแขนอีกข้าง หลังคอเปิด
        answer: attack
        moves:
          - id: fy_spike
            label: ขัดเหล็กแหลมเข้าช่องไขลานหลังคอ
            kind: attack
            tags: [pierce]
            success: เหล็กแหลมเข้าช่องไขลานจนสุดด้าม เสียงเฟืองข้างในขูดกันดังเหมือนฟันกัดกรวด ไฟที่ช่องตากะพริบถี่ แล้วดับ หุ่นยืนนิ่งอยู่หน้าประตูโกดัง แขนข้างหนึ่งยังค้างกลางอากาศ
          - id: fy_talk
            label: เรียกชื่อเคลรินให้มันฟัง
            kind: talk
          - id: fy_shield
            label: ยกลังเครื่องเทศขึ้นบังตัวไว้ก่อน
            kind: guard
          - id: fy_step_out3
            label: ทิ้งทุกอย่าง วิ่งออกไปทางถนน
            kind: flee
    win:
      text: |
        คนยกของสี่คนช่วยกันยกหุ่นขึ้นเกวียน หนักจนเพลาเกวียนแอ่น เจ้าของโกดังเปิดประตูโกดังตัวเองเป็นครั้งแรกในสองเดือน เครื่องเทศครึ่งโกดังขึ้นราเขียว

        {name}เขียนใบรับให้เจ้าของโกดัง เขาอ่านแล้วถามว่าใครจ่ายค่าเครื่องเทศที่เสีย ใบรับไม่มีช่องสำหรับเรื่องนั้น ในห้องใต้หอสมุด งานปีห้าของเคลรินขึ้นชั้นตามเดิม ไฟที่ช่องตาไม่สว่างอีก
      effects: { stats: { DEX: 1 }, flags: [shelved_clerins_sentry] }
    lose:
      text: |
        {name}ฟื้นขึ้นบนกองกระสอบพริกนอกเขตสิบก้าว ซี่โครงข้างหนึ่งระบมทุกครั้งที่หายใจ เจ้าของโกดังลากออกมาได้ตอนหุ่นหันไปทางอื่น

        หุ่นยังยืนอยู่หน้าประตู ไฟที่ช่องตาสว่างตามจังหวะคนเดินผ่าน เจ้าของโกดังเริ่มขายเครื่องเทศที่ยังเหลือจากเกวียนหน้าโกดังแทน
      effects: { flags: [beaten_by_clerins_sentry] }
    stalemate:
      text: |
        หุ่นถอยกลับไปยืนหน้าประตูโกดังตามเดิม แขนข้างหนึ่งค้างอยู่ครึ่งทาง ไม่เดินออกมาไกลกว่าสามก้าวอีก เจ้าของโกดังเข้าโกดังได้ทางหน้าต่างหลัง ทีละคน

        {name}เขียนในสำเนาบัญชีว่าของยังเฝ้าโกดังอยู่ ทำงานได้ดีกว่าที่ออกแบบไว้ ต้องมีคนที่หน้าอยู่ในห้าสิบหน้ามาพาไป
      effects: { flags: [left_clerins_sentry_standing] }
    flee:
      text: |
        {name}วิ่งออกมาจนพ้นเขตสิบก้าว หุ่นหยุดทันทีตรงเส้นที่มองไม่เห็น หันกลับไปยืนหน้าประตูเหมือนไม่มีอะไรเกิดขึ้น

        เจ้าของโกดังยืนดูอยู่ฝั่งตรงข้ามถนน ถามว่าสถาบันจะส่งใครมาอีก {name}ไม่มีคำตอบ ในสำเนาบัญชีเขียนไว้แค่ว่ายังไม่ได้ทวง
      effects: { flags: [fled_clerins_sentry] }
    death:
      text: |
        แขนทองเหลืองลงตรงซี่โครงเต็มแรง เสียงดังเหมือนค้อนตีถัง {name}ล้มลงบนลานหน้าโกดัง

        ไฟที่ช่องตาของหุ่นส่องลงมาที่หน้า{name}ครู่หนึ่ง หาหน้านี้ในห้าสิบหน้า ไม่เจอ แล้วหันกลับไปยืนหน้าประตูตามเดิม
