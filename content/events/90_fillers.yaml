# เรื่องเติมช่องว่าง วัยเด็ก อายุ 3 ถึง 11 เกิดซ้ำได้ (once: false) น้ำหนักต่ำ
# มีไว้กันชีวิตจบเพราะไม่มีเหตุการณ์ให้เลือก ห้ามใช้ {father} {mother} ในเรื่องที่เด็กวิหารเจอได้ (arvel_village และเรื่องไม่ระบุถิ่น)

- id: childhood.filler_arvel
  stage: childhood
  weight: 1
  once: false
  when:
    age: [3, 11]
    location_tag: arvel_village
  text: |
    ฤดูเก็บเกี่ยวมาถึงอีกปี ทุ่งรอบเสาของอีเซลเหลืองไปจนสุดตา คนทั้งหมู่บ้านลงนาตั้งแต่ฟ้ายังไม่สาง เด็กที่เดินได้ก็ต้องลงด้วย

    ตกบ่ายแดดแรงจนเคียวร้อนมือ ผู้ใหญ่พักใต้ต้นไม้ริมคันนา เปิดห่อข้าวกินกัน แล้วแบ่งงานบ่ายให้เด็กๆ
  choices:
    - id: carry
      label: แบกฟ่อนข้าวไปกองที่ลาน
      text: |
        {name}แบกฟ่อนข้าวทีละฟ่อน เดินไปกลับระหว่างนากับลานจนไหล่แดง ตกเย็นนับได้สามสิบสองเที่ยว มากกว่าปีก่อน
      effects: { stats: { STR: 1 } }
    - id: geese
      label: ต้อนห่านไม่ให้ลงนา
      text: |
        ห่านสิบสองตัวกับเด็กหนึ่งคน ห่านชนะไปสามรอบ {name}ชนะไปสองรอบ ตกเย็นห่านอยู่ในคอกครบทุกตัว แต่ขาของ{name}มีรอยห่านจิกเป็นดวงๆ
      effects: { stats: { DEX: 1 } }
    - id: listen
      label: นั่งฟังคนแก่เล่าเรื่องใต้ต้นไม้
      text: |
        คนแก่ใต้ต้นไม้เล่าเรื่องเดิมที่เล่าทุกปี ปีที่หิมะตกกลางหน้าร้อน ปีที่วัวทั้งหมู่บ้านล้มตายในคืนเดียว ปีที่มีคนเห็นดาวตกลงกลางทุ่ง ปีนี้{name}สังเกตว่าตอนจบของบางเรื่องไม่เหมือนปีก่อน
      effects: { stats: { WIS: 1 } }

- id: childhood.filler_ventras
  stage: childhood
  weight: 1
  once: false
  when:
    age: [3, 11]
    location_tag: ventras
  text: |
    ฝนตกทั้งสัปดาห์ เวนทราสเปียกไปทั้งเมือง น้ำในรางไหลเป็นสีเทาเพราะเขม่าจากปล่อง จานรับดาวบนหลังคาทุกหลังคว่ำหน้าหลบฝน ตะเกียงฟ้าตามถนนยังสว่างอยู่ทั้งกลางวันเพราะฟ้ามืด

    {name}นั่งอยู่ริมหน้าต่าง มองหลังคาเปียกที่เรียงซ้อนกันไปจนถึงแม่น้ำ
  choices:
    - id: count_ships
      label: นับเรือที่จอดอยู่ริมแม่น้ำ
      text: |
        {name}นับเรือที่จอดอยู่ริมแม่น้ำ ได้สิบเจ็ดลำ แล้วนับใหม่ได้สิบแปด เพราะเพิ่งมีลำหนึ่งโผล่ออกมาจากม่านฝน แล่นเข้ามาจอดต่อท้ายแถวพอดี ตะเกียงฟ้าที่หัวเรือเรืองอยู่ในสายฝน
      effects: { stats: { INT: 1 } }
    - id: catch_rain
      label: ยื่นมือออกไปรองน้ำฝน
      text: |
        น้ำฝนในเมืองนี้มีรสขมนิดๆ กับกลิ่นเหมือนเหล็กร้อน {name}รองจนเต็มอุ้งมือแล้วเทลงรางทุกครั้ง ทำอยู่อย่างนั้นจนมือเย็นเฉียบ
      effects: { stats: { CON: 1 } }
    - id: watch_street
      label: มองคนที่เดินผ่านถนนข้างล่าง
      text: |
        {name}มองคนเดินผ่านถนนข้างล่าง ตั้งชื่อให้ทุกคน เดาว่าใครจะไปไหน คนถือร่มสีเขียวคงไปหาคนรัก คนที่เดินเร็วๆ ไม่มีร่มคงหนีหนี้ คนแขนเหล็กที่ยืนนิ่งใต้ชายคาคงไม่มีที่ไป
      effects: { stats: { CHA: 1 } }

- id: childhood.filler_hordun
  stage: childhood
  weight: 1
  once: false
  when:
    age: [3, 11]
    location_tag: hordun
  text: |
    หน้าหนาวในทุนดาร์ไม่หนาว ผนังหินอุ่นจากเตาถ่านมารของโรงหลอมชั้นล่าง แต่ถนนวนชั้นนอกที่หันออกหน้าผามีลมจากยอดเขาพัดผ่านจนหน้าชา เด็กคนแคระทุกคนต้องช่วยงานบ้านตามชั้นที่บ้านตัวเองอยู่

    งานของ{name}คือหิ้วน้ำมันตะเกียงจากชั้นเก้าขึ้นมาชั้นสิบเอ็ด วันละสองเที่ยว
  choices:
    - id: carry_oil
      label: หิ้วสองถังพร้อมกันให้เสร็จเร็ว
      text: |
        {name}หิ้วสองถังพร้อมกัน เดินไต่ถนนวนขึ้นมาโดยไม่พัก แขนสั่นตั้งแต่ชั้นสิบ ถึงบ้านแล้วนิ้วกางไม่ออกไปพักใหญ่ {father}เห็นแล้วตักน้ำส่งให้ขันหนึ่ง ไม่ถามว่ารีบไปไหน
      effects: { stats: { STR: 1 } }
    - id: forge
      label: แวะยืนดูช่างตีเหล็กที่ชั้นสิบ
      text: |
        ช่างที่ชั้นสิบตีขวานเล่มเดียวมาสามวันแล้ว ตีแล้วเผา เผาแล้วตี {name}ยืนดูจนลืมว่าถือถังน้ำมันอยู่ นับจังหวะค้อนได้แม่นจนรู้ว่าครั้งไหนช่างจะหยุดเช็ดเหงื่อ
      effects: { stats: { WIS: 1 } }
    - id: race_tram
      label: วิ่งแข่งกับรถรางขนแร่
      text: |
        รถรางขนแร่ไต่ผนังเขาขึ้นไปช้าๆ {name}วิ่งแข่งบนถนนวน ถังน้ำมันแกว่งไปมา ถึงชั้นสิบเอ็ดก่อนรถรางสามช่วงตัว น้ำมันหกไปครึ่งถัง
      effects: { stats: { DEX: 1 } }

- id: childhood.filler_ileth
  stage: childhood
  weight: 1
  once: false
  when:
    age: [3, 11]
    location_tag: ileth
  text: |
    ปลายฤดูฝน ลูกสนแก่ร่วงจากกิ่งสูงลงมาทั้งวันทั้งคืน ดังตุบๆ อยู่บนหลังคาบ้าน เอลฟ์บ้านกิ่งลมลงไปเก็บที่โคนต้นทุกเช้า เมล็ดใช้กิน เปลือกใช้ก่อไฟ ยางใช้อุดรอยรั่ว

    {name}ได้ตะกร้าใบเล็กหนึ่งใบกับกิ่งไม้สำหรับเขี่ย
  choices:
    - id: climb_high
      label: ปีนขึ้นไปเขย่าลูกที่ยังไม่ร่วง
      text: |
        {name}ปีนขึ้นไปถึงกิ่งที่ไม่มีใครในวัยเดียวกันเคยขึ้น เขย่าจนลูกสนร่วงลงมาเป็นฝน ผู้ใหญ่ข้างล่างวิ่งหลบกันวุ่น แล้วหัวเราะ แล้วตะโกนให้ลงมาเดี๋ยวนี้
      effects: { stats: { DEX: 1 } }
    - id: learn_song
      label: ร้องเพลงเก็บลูกสนตามผู้ใหญ่
      text: |
        เพลงเก็บลูกสนมีสี่สิบท่อน ร้องจบท่อนหนึ่งต้องได้ลูกสนครบหนึ่งกำมือ ปีนี้{name}ร้องได้ถึงท่อนที่สิบเก้า ผู้ใหญ่บอกว่าท่อนหลังๆ ไม่ค่อยมีใครร้องแล้ว เพราะคนแต่งตายไปตั้งแต่ยุคเจ็ดเสา
      effects: { stats: { CHA: 1 } }
    - id: sort_seeds
      label: นั่งแยกเมล็ดดีออกจากเมล็ดลีบ
      text: |
        {name}นั่งแยกเมล็ดอยู่ทั้งบ่าย เมล็ดดีหนัก เมล็ดลีบเบา เขย่าในมือแล้วรู้ได้โดยไม่ต้องมอง ตกเย็นเมล็ดลีบไม่เหลือปนในตะกร้าสักเมล็ด
      effects: { stats: { INT: 1 } }

- id: childhood.filler_ashland
  stage: childhood
  weight: 1
  once: false
  when:
    age: [3, 11]
    location_tag: ashland
  text: |
    พายุเถ้าพัดมาจากทางตอเสาสามวันสามคืน ฟ้าเป็นสีเทาตลอดทั้งวัน ทุกบ้านในบ้านหญ้าเงินปิดหน้าต่างด้วยผ้าชุบน้ำ แต่เถ้าก็ยังลอดเข้ามาเกาะทุกอย่าง ในปาก ในผม ในข้าว

    พอพายุสงบ งานแรกของเด็กทุกบ้านคือขึ้นไปกวาดเถ้าบนหลังคา ก่อนน้ำค้างจะทำให้เถ้าจับตัวเป็นปูน
  choices:
    - id: sweep
      label: กวาดหลังคาบ้านตัวเองให้เกลี้ยง
      text: |
        {name}กวาดจนหลังคาเห็นไม้ทุกแผ่น เถ้าที่กวาดลงไปกองข้างเสาบ้านสูงเกือบถึงชาน ทั้งตัวเทาเหมือนรูปปั้น ตอนเย็นต้องอาบน้ำสามรอบถึงจะเห็นสีผิว
      effects: { stats: { CON: 1 } }
    - id: help_neighbor
      label: ไปช่วยกวาดหลังคาบ้านป้าข้างๆ
      text: |
        ป้าบ้านข้างๆ แก่จนปีนหลังคาไม่ไหว {name}ปีนขึ้นไปกวาดให้ ป้ายืนชี้อยู่ข้างล่างว่าตรงนั้นยังไม่เกลี้ยง ตรงนี้ยังไม่เกลี้ยง กวาดเสร็จได้หญ้าเงินดองหนึ่งโถ ขมน้อยกว่าที่บ้านทำ
      effects: { stats: { CHA: 1 } }
    - id: look_east
      label: นั่งบนสันหลังคา มองไปทางตอเสา
      text: |
        จากสันหลังคา เห็นตอเสาของอัสเทลตั้งอยู่บนขอบฟ้าตะวันออก สูงเท่าภูเขา ยอดหักเป็นรอยหยัก หลังพายุเถ้าทุกครั้ง ตอเสาดูใกล้กว่าเดิมนิดหนึ่ง ใครๆ ก็รู้ว่าไม่ได้ใกล้ขึ้น แต่ก็ไม่มีใครพูด
      effects: { stats: { WIS: 1 } }

- id: childhood.filler_quiet_year
  stage: childhood
  weight: 1
  once: false
  when:
    age: [3, 11]
  text: |
    ปีนั้นไม่มีเรื่องอะไรให้คนพูดถึง ฝนตกตามฤดู หนาวมาตามฤดู ไม่มีใครเกิด ไม่มีใครตาย ผู้ใหญ่บอกว่าปีอย่างนี้หายาก ให้รีบจำไว้

    {name}โตขึ้นอีกหนึ่งปี แขนเสื้อสั้นขึ้นอีกนิ้ว
  choices:
    - id: run
      label: วิ่งเล่นจนมืดทุกวัน
      text: |
        ทั้งปี{name}วิ่งเล่นจนมืดทุกวัน กลับบ้านมาเข่าถลอกทุกวัน ปลายปีวิ่งเร็วกว่าเด็กที่โตกว่าสองปี
      effects: { stats: { DEX: 1 } }
    - id: watch_adults
      label: คอยดูว่าผู้ใหญ่ทำอะไรกันบ้าง
      text: |
        {name}คอยดูผู้ใหญ่ทั้งปี ดูว่าใครพูดอะไรต่อหน้า พูดอะไรลับหลัง ใครยิ้มแต่ไม่ได้อยากยิ้ม ปลายปีรู้เรื่องในบ้านมากกว่าที่ผู้ใหญ่คิดว่ารู้
      effects: { stats: { WIS: 1 } }
    - id: eat
      label: กินเยอะๆ นอนเยอะๆ
      text: |
        {name}กินเก่งจนโดนแซว นอนหลับไม่เคยตื่นกลางดึก ปีนั้นไม่ป่วยสักครั้ง ไม่เป็นหวัดแม้แต่ตอนที่ทั้งบ้านเป็น
      effects: { stats: { CON: 1 } }
