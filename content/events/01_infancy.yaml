# วัยทารก อายุ 1 ถึง 2 ทุกชาติกำเนิดต้องมีอย่างน้อยสองเรื่องในช่วงนี้
# เด็กวิหาร (origin_marked_foundling) ไม่มีพ่อแม่ ห้ามใช้ {father} {mother} ในเรื่องที่เด็กวิหารเจอได้

- id: infancy.fever_winter
  stage: infancy
  weight: 8
  when:
    age: [1, 2]
    not_flags: [origin_marked_foundling, origin_marked_hidden]
  text: |
    หน้าหนาวปีนั้นมาเร็ว แล้ว{name}ก็ตัวร้อนขึ้นมากลางดึก ร้อนจน{mother}เอาหลังมือแตะแล้วต้องชักกลับ

    สามวันแรกยังร้องได้ วันที่สี่เงียบ หายใจถี่ ทุกครั้งที่อกยุบลงมีเสียงหวีดเล็กๆ ตามออกมา {father}ต้มยาที่ใครๆ บอกว่าดีจนหมดทุกห่อในบ้าน ห่อที่ไม่มีใครบอกก็ต้มด้วย

    {mother}ไม่ได้นอน เธอนั่งนับลมหายใจลูกทั้งคืน นับถึงร้อยแล้วขึ้นต้นใหม่ กลัวว่าถ้าหยุดนับ ลมหายใจนั้นจะหยุดตอนไหนเธอก็จะไม่รู้
  choices:
    - id: suckle
      label: ดูดนมทั้งที่ไม่มีแรง
      check: { stat: CON, dc: 10 }
      success:
        text: |
          {name}ดูดนมได้ทีละนิด หลับไป ตื่นมาดูดอีก เช้าวันที่ห้าเหงื่อแตกจนผ้าปูเปียก ไข้ลงตอนสาย

          {mother}หลับคาเก้าอี้ มือยังวางอยู่บนอกลูก
        effects: { stats: { CON: 1 } }
      failure:
        text: |
          ไข้ลงในวันที่เจ็ด แต่หลังจากหน้าหนาวนั้น ทุกครั้งที่อากาศเปลี่ยน {name}จะไอมีเสียงหวีดเล็กๆ แบบเดียวกับคืนที่สี่

          {mother}จำเสียงนั้นได้ และสะดุ้งตื่นทุกครั้งที่ได้ยิน
        effects: { stats: { CON: -1 }, flags: [weak_chest] }
    - id: cry
      label: ร้องออกมาได้อีกครั้งในคืนที่สี่
      text: |
        เที่ยงคืนของคืนที่สี่ {name}ร้องออกมา เสียงแหบเหมือนลูกแมว แต่ดังพอให้{father}ที่ฟุบหลับข้างเตาสะดุ้งตื่น {mother}ร้องไห้ไปพร้อมกับลูก ไข้ลงในอีกสองวันต่อมา
      effects: { stats: { CHA: 1 } }
    - id: lie_still
      label: นอนนิ่ง ลืมตามองแม่
      text: |
        {name}นอนนิ่ง ไม่ร้อง ไม่ดิ้น ตาแดงก่ำเพราะพิษไข้ แต่ลืมตามอง{mother}อยู่ทั้งคืน ไม่ยอมหลับ {mother}ก็ไม่ยอมหลับ สองแม่ลูกจ้องกันอยู่อย่างนั้นจนไข้ลงในวันที่หก
      effects: { stats: { WIS: 1 } }

- id: infancy.first_word
  stage: infancy
  weight: 8
  when:
    age: [1, 2]
    not_flags: [origin_marked_foundling]
  text: |
    {father}กับ{mother}พนันกันว่าคำแรกของ{name}จะเป็นคำไหน ใครแพ้ต้องยอมให้อีกฝ่ายตั้งชื่อลูกคนต่อไป

    ตั้งแต่วันนั้น ทั้งสองคนก็แอบสอนกันคนละที {mother}ชี้ตัวเองแล้วพูดว่า แม่ ทุกครั้งที่ป้อนข้าว {father}รอให้เมียคลาดสายตา แล้วอุ้มลูกขึ้นนั่งบนเข่า พูดว่า พ่อ พ่อ พ่อ จนลูกหลับคาอก

    เช้าวันหนึ่งปลายฤดู {name}นั่งอยู่บนพื้น มองหน้าทั้งสองคน แล้วอ้าปาก
  choices:
    - id: say_mother
      label: เรียกแม่ก่อน
      text: |
        แม่ คำเดียว ชัดทุกเสียง {mother}ชูกำปั้นขึ้นทั้งสองข้าง ร้องเสียงดังจนลูกสะดุ้ง {father}ยอมแพ้แต่โดยดี แต่คืนไหนเมียหลับ เขาก็ยังกระซิบสอนคำว่าพ่อต่อ
      effects: { stats: { CHA: 1 } }
    - id: say_father
      label: เรียกพ่อก่อน
      text: |
        พ่อ คำเดียว ชัดทุกเสียง {father}หัวเราะจนต้องนั่งลง {mother}บอกว่าเขาโกง เพราะแอบสอนตอนกลางคืน {father}ไม่เถียง แค่ถามว่าลูกคนต่อไปชื่ออะไรดี {mother}ไม่ยอมพูดกับเขาไปสามวัน
      effects: { stats: { STR: 1 } }
    - id: unknown_word
      label: พูดคำที่ไม่มีใครสอน
      text: |
        คำแรกของ{name}ไม่ใช่ทั้งแม่และพ่อ เป็นคำสองพยางค์ที่ไม่มีใครในบ้านเคยได้ยิน ออกเสียงชัดทุกตัว เหมือนผู้ใหญ่พูด แล้วก็ไม่พูดคำนั้นอีกเลย

        {father}กับ{mother}มองหน้ากัน ไม่มีใครพูดถึงเรื่องพนันอีก หลายเดือนต่อมา ทั้งสองคนตื่นขึ้นมาดูลูกกลางดึกพร้อมกันบ่อยกว่าที่ควร
      effects: { stats: { INT: 1 }, flags: [first_word_unknown] }

- id: infancy.grab_future
  stage: infancy
  weight: 10
  when:
    age: [1, 1]
    not_flags: [origin_elf_bough, origin_dwarf_clan, origin_ashland, origin_marked_foundling, origin_marked_hidden]
  text: |
    ครบขวบ ผู้ใหญ่ปูเสื่อกลางบ้าน วางของสี่อย่างไว้สี่มุมตามธรรมเนียมของคนอาร์เวล มีดพร้าเล่มเล็ก เหรียญทองแดง กระดิ่งทองเหลือง และช้อนไม้ แล้ววาง{name}ลงตรงกลาง ของชิ้นแรกที่เด็กคว้าบอกได้ว่าโตขึ้นจะหากินด้วยอะไร อย่างน้อยคนแก่ก็เชื่อกันอย่างนั้น

    คนที่มาดูนั่งล้อมเสื่อ ป้าคนหนึ่งแอบเขี่ยเหรียญเข้ามาใกล้อีกนิด {father}เห็นแล้วเขี่ยกลับ

    แมวของบ้านเดินมานั่งเลียขาอยู่ข้างเสื่อ
  choices:
    - id: knife
      label: คว้ามีดพร้า
      text: |
        {name}คลานตรงไปที่มีดพร้า คว้าด้ามได้ก่อนใครจะห้ามทัน คนรอบเสื่อร้องเสียงหลงพร้อมกัน {mother}ดึงมีดออกจากมือ {name}ร้องลั่นบ้าน คนหนึ่งว่าโตขึ้นได้เป็นทหาร อีกคนว่าได้เป็นคนฆ่าหมู เถียงกันจนข้าวเย็นชืด
      effects: { stats: { STR: 1 } }
    - id: coin
      label: คว้าเหรียญทองแดง
      text: |
        {name}คว้าเหรียญแล้วยัดเข้าปาก ป้าคนที่แอบเขี่ยเหรียญตบมือดังกว่าใคร {father}ต้องง้างปากลูกเอาเหรียญออกมา ทุกคนว่าเด็กคนนี้โตขึ้นจะรวย {father}ว่าขอแค่อย่ากลืนเหรียญก็พอ
      effects: { stats: { INT: 1 } }
    - id: bell
      label: คว้ากระดิ่งมาเขย่า
      text: |
        {name}เขย่ากระดิ่งไม่หยุดจนแมวลุกหนี เขย่าจนคนรอบเสื่อต้องเอามือปิดหู แล้วก็ยังเขย่าต่อ ทุกคนว่าโตขึ้นจะเป็นนักร้องเร่ ในบ้านนี้ไม่มีใครนับว่าเป็นคำชม
      effects: { stats: { CHA: 1 } }
    - id: spoon
      label: คว้าช้อนไม้เข้าปาก
      text: |
        {name}คว้าช้อนไม้เข้าปาก ดูดอยู่อย่างนั้นด้วยหน้าตาพอใจ ไม่สนของอย่างอื่นบนเสื่อเลย คนแก่ว่าโตขึ้นไม่อดตายแน่ คนอื่นหัวเราะ แต่{mother}ยิ้มเหมือนได้ยินคำอวยพรที่ดีที่สุดของวัน
      effects: { stats: { CON: 1 } }
    - id: cat
      label: คลานข้ามเสื่อไปหาแมว
      text: |
        {name}ไม่มองของบนเสื่อสักชิ้น คลานข้ามมีดพร้าไปจับหางแมว แมวสะบัดหนี {name}คลานตามไปถึงใต้โต๊ะ ทั้งบ้านต้องก้มลงไปดู คนแก่ที่สุดในวงว่า เด็กคนนี้โตไปคงหากินด้วยการไม่ฟังใคร
      effects: { stats: { DEX: 1 } }

- id: infancy.name_on_wall
  stage: infancy
  weight: 10
  when:
    age: [1, 2]
    flags: [origin_dwarf_clan]
  text: |
    หน้าหนาวแรกผ่านไป {name}ยังอยู่ ช่างของตระกูลจึงมาสลักชื่อลงกำแพง

    เขาใช้สิ่วเล่มเล็กที่สุดในกล่อง นั่งทำอยู่ครึ่งวัน เศษหินร่วงเป็นผงลงบนผ้าที่ปูไว้ใต้กำแพง {mother}กวาดผงหินนั้นใส่ถุงผ้าใบเล็ก ผูกไว้ที่หัวเปล อย่างที่แม่ของเธอเคยทำให้เธอ

    ชื่อ{name} {surname}อยู่บรรทัดล่างสุด เหนือขึ้นไปหนึ่งบรรทัดมีช่องว่างขนาดเท่าชื่อหนึ่งชื่อ หินตรงนั้นเรียบและมันกว่าหินรอบข้าง

    คนแคระไม่สลักชื่อเด็กที่ไม่รอดหน้าหนาวแรก แต่ก็ไม่สลักชื่อคนต่อไปทับที่ของเด็กคนนั้น ช่องว่างนั้นเป็นของพี่ที่เกิดก่อน{name}สองปี ในบ้านไม่มีใครพูดถึง

    ช่างเป่าผงออกจากร่องชื่อ แล้วอุ้ม{name}ขึ้นให้ดูใกล้ๆ
  choices:
    - id: touch_own
      label: ลูบร่องชื่อตัวเอง
      text: |
        {name}เอานิ้วลูบไปตามร่องชื่อตัวเองช้าๆ ผงหินติดปลายนิ้วขาวเป็นแป้ง ช่างหัวเราะ บอกว่าลูบมากๆ เดี๋ยวชื่อตื้น ต้องมาสลักใหม่ แล้วก็ปล่อยให้ลูบต่อจนพอใจ
      effects: { stats: { WIS: 1 }, flags: [name_on_wall] }
    - id: touch_blank
      label: ตบหินเรียบตรงช่องว่างข้างบน
      text: |
        มือเล็กๆ ตบลงบนหินเรียบตรงช่องว่างนั้นดังแปะ แล้วตบอีกที {father}ที่ยืนอยู่ข้างหลังวางมือทับมือลูกไว้บนหินครู่หนึ่ง แล้วรับลูกไปอุ้มเอง คืนนั้นเขานั่งอยู่หน้ากำแพงจนตะเกียงหมดน้ำมัน
      effects: { stats: { CHA: 1 }, flags: [name_on_wall, touched_blank_stone] }
    - id: grab_chisel
      label: คว้าสิ่วจากมือช่าง
      text: |
        {name}คว้าสิ่วไว้ทั้งกำมือ ช่างไม่แย่ง เขาจับมือเล็กๆ นั้นเคาะสิ่วลงบนหินใต้ชื่อเบาๆ หนึ่งที ได้รอยขีดสั้นๆ หนึ่งรอย {mother}จะขัดออก ช่างห้ามไว้ "ปล่อยไว้" เขาว่า "หินมันจำได้"
      effects: { stats: { STR: 1 }, flags: [name_on_wall] }

- id: infancy.elf_turns
  stage: infancy
  weight: 10
  when:
    age: [1, 2]
    flags: [origin_elf_bough]
  text: |
    ฤดูใบไม้ผลิแรกของ{name} บ้านกิ่งลมทำพิธีส่งมือ เอลฟ์ทุกคนในหมู่บ้านนั่งล้อมวงบนกิ่งที่ใหญ่ที่สุด อุ้มเด็กต่อกันคนละหนึ่งเพลง จนครบทั้งสามสิบเอ็ดคนแล้วกลับมาถึงอกแม่ เชื่อกันว่าเด็กจะจำกลิ่นของทุกคนที่อุ้มได้ไปจนตาย และเอลฟ์ตายช้ามาก

    วงนั้นยาวตั้งแต่เช้าถึงบ่าย บางคนร้องเพลงที่แต่งไว้เมื่อพันปีก่อน บางคนแค่ฮัม ผู้เฒ่าที่แก่ที่สุดไม่ร้อง แกอุ้มเด็กไว้เงียบๆ จนหมดเวลาของเพลงหนึ่งเพลง

    โอรีวัลนั่งอยู่ท้ายวง เขากลับมาหมู่บ้านเพราะพิธีนี้ เสื้อยังมีกลิ่นควัน

    ใกล้จบวง {name}เริ่มบิดตัวในอ้อมแขนของใครคนหนึ่ง แล้วยื่นมือออกไปหาอีกคน
  choices:
    - id: reach_eldest
      label: ยื่นมือหาผู้เฒ่า
      text: |
        ในพิธีนี้ไม่เคยมีใครได้อุ้มสองรอบ ไม่มีใครค้าน ผู้เฒ่ารับ{name}ไปอุ้มอีกครั้ง คราวนี้นานจนแดดหมดกิ่ง แล้วกระซิบอะไรสั้นๆ ที่ไม่มีใครได้ยิน
      effects: { stats: { WIS: 1 }, flags: [eldest_held] }
    - id: reach_orival
      label: ยื่นมือหาโอรีวัลที่ท้ายวง
      text: |
        คนที่อุ้มอยู่ต้องลุกเดินไปส่งถึงท้ายวง โอรีวัลรับไปอย่างงุ่มง่าม เหมือนไม่เคยอุ้มอะไรที่หายใจได้ {name}กระชากผมเขาจนหลุดติดมือมาสามเส้น เขาไม่ว่าอะไร ผู้ใหญ่หลายคนที่เบือนหน้าตอนเขามาถึงหันกลับมามอง
      effects: { stats: { DEX: 1 }, flags: [orival_bond] }
    - id: reach_mother
      label: ร้องหาแม่
      text: |
        {name}ร้องหาแม่จนวงต้องหยุดกลางคัน ยังเหลืออีกหกคนที่ไม่ได้อุ้ม เอลฟ์ทั้งวงหัวเราะ บอกว่าไม่เป็นไร ยังเหลือเวลาอีกตั้งหกร้อยกว่าปี
      effects: { stats: { CHA: 1 } }

- id: infancy.ash_under_floor
  stage: infancy
  weight: 10
  when:
    age: [1, 2]
    flags: [origin_ashland]
  text: |
    {name}หัดคลานบนพื้นกระดาน แล้วก็ชอบนอนเอาหูแนบพื้น

    กระดานบ้านนี้{father}ปูเองทุกแผ่น ตอนกลางวัน ใครเดินมาใต้ถุน กระดานก็บอกได้หมด ป้าบ้านติดกันเดินลากส้นแตะ คนส่งน้ำเดินหนักเพราะแบกถังสองข้าง {father}เดินเร็ว ก้าวยาวสามก้าวแล้วหยุด เท่ากับเสียงผิวปากที่ใช้เรียกให้หย่อนบันได {name}จำเสียงเท้าได้ทุกคนก่อนจะเรียกชื่อใครได้สักคน

    แต่ตกค่ำ ทั้งหมู่บ้านชักบันไดขึ้นหมดแล้ว ข้างล่างไม่ควรมีเสียงเท้าของใครอีก

    คืนหนึ่ง {mother}ตื่นขึ้นมาเห็น{name}นอนคว่ำ หูแนบกระดาน ยิ้มอยู่คนเดียว ข้างล่างมีเสียงเดิน ช้า สี่ขา มาหยุดตรงใต้ที่ลูกนอนพอดี
  choices:
    - id: giggle
      label: หัวเราะคิกคักใส่พื้นกระดาน
      text: |
        {name}หัวเราะคิกคัก เหมือนมีใครจั๊กจี้อยู่ข้างล่าง {mother}คว้าลูกขึ้นมากอดจนแน่น เสียงเดินข้างล่างไม่ได้วิ่งหนี มันเดินจากไปช้าๆ ทางป่าหญ้าเงิน ทีละก้าว เหมือนคนที่มาเยี่ยมแล้วถึงเวลากลับบ้าน
      effects: { stats: { CHA: 1 } }
    - id: fall_asleep
      label: หลับไปตรงนั้น หูยังแนบกระดาน
      text: |
        {name}หลับไปตรงนั้น {mother}ไม่กล้าอุ้มขึ้น กลัวกระดานลั่น เธอเลยค่อยๆ นอนลงข้างลูก แล้วแนบหูลงไปบ้าง

        เธอได้ยินเสียงเล็บแตะเถ้าเบาๆ ทุกครั้งที่ของข้างล่างขยับน้ำหนักตัว ได้ยินอยู่อย่างนั้นจนฟ้าเทา แล้วเสียงนั้นก็เดินจากไป วันรุ่งขึ้นเธอเอาเสื่ออีกผืนมาปูซ้อนตรงที่ลูกชอบนอน ไม่ได้บอกใครว่าทำไม
      effects: { stats: { CON: 1 } }
    - id: knock
      label: เคาะพื้นกระดานสามที
      text: |
        {name}เอากำปั้นเล็กๆ เคาะกระดานสามที ป๊อก ป๊อก ป๊อก แล้วนิ่ง ใต้พื้นก็นิ่ง

        แล้วมีเสียงตอบขึ้นมาจากข้างล่าง ไม่ใช่เสียงเคาะ เป็นเสียงเล็บครูดเสาบ้านสามครั้ง

        {mother}ไม่ได้เล่าให้{father}ฟัง
      effects: { stats: { INT: 1 }, flags: [knocked_floor] }

- id: infancy.hidden_portrait
  stage: infancy
  weight: 10
  when:
    age: [1, 2]
    flags: [origin_marked_hidden]
  text: |
    ตามธรรมเนียมของตระกูลเก่าในเวนทราส ทายาทต้องมีรูปเขียนแขวนในโถงบันไดตั้งแต่ยังเล็ก ต่อจากรูปของพ่อ รูปของปู่ และรูปของคนก่อนหน้านั้นอีกสิบเอ็ดรูป ปีนั้นตระกูลไม่มีเงินจ้างช่างจากราชสำนัก ท่านย่าจึงจ้างช่างเขียนป้ายร้านมาจากย่านท่าเรือ ค่าจ้างถูกกว่ากันเจ็ดเท่า และต่อให้กลับไปพูดอะไร ก็ไม่มีใครฟัง

    ช่างมาสามวันติด วันละสองชั่วยาม {name}นั่งบนตัก{mother}ในชุดกำมะหยี่ที่ตัดจากผ้าม่านของห้องที่ปิดไว้ห้องหนึ่ง สวมหมวกลูกไม้คลุมลงมาถึงคิ้ว ท่านย่ายืนอยู่หลังช่างตลอดเวลา ไม่นั่งสักครั้ง

    วันที่สาม ช่างวางพู่กัน ขอให้ถอดหมวกสักครู่ เขาว่าลูกไม้เขียนยาก และเด็กในรูปทุกรูปบนโถงบันไดก็ไม่มีใครสวมหมวก
  choices:
    - id: pull_hat
      label: ดึงหมวกออกเอง
      text: |
        {name}ไม่รอให้ใครตอบ คว้าชายลูกไม้ดึงจนหมวกหลุดลงมากองบนตัก ผมยังบางจนเห็นหนังหัว ตรงที่หมอตะไบตอเขาจนเรียบไปเมื่อคืนเดือนดับมีวงสีเทาอยู่สองวง ขนาดเท่าเหรียญ

        ช่างมองอยู่แค่อึดใจเดียว ท่านย่าเดินอ้อมมาสวมหมวกคืนให้หลานด้วยมือตัวเอง แล้วหยิบถุงเงินออกจากแขนเสื้อ วางลงบนกล่องสีของช่าง ถุงนั้นหนักกว่าค่าจ้างสามวันรวมกัน

        รูปบนโถงบันไดเป็นรูปเด็กสวมหมวกลูกไม้ ช่างเขียนลูกไม้ไว้ละเอียดทุกเส้น
      effects: { stats: { DEX: 1 }, flags: [painter_saw_horns] }
    - id: sit_still
      label: นั่งนิ่งจนช่างเขียนเสร็จ
      text: |
        ท่านย่าตอบแทนทุกคนว่าให้เขียนลูกไม้ไป จ้างมาก็เพื่อการนั้น ช่างหยิบพู่กันขึ้นมาใหม่ {name}นั่งนิ่งอยู่บนตักแม่จนหมดสองชั่วยาม ไม่ดิ้น ไม่ร้อง มือวางบนเข่าตามที่จัดไว้

        เย็นนั้นช่างไปนั่งร้านเหล้าย่านท่า เล่าให้ใครก็ได้ที่ยอมฟังว่าเพิ่งไปเขียนรูปเด็กที่นั่งนิ่งเหมือนตุ๊กตา ไม่มีใครในร้านสนใจ
      effects: { stats: { CON: 1 } }
    - id: cry
      label: ร้องจนช่างต้องเลิกกลางคัน
      text: |
        {name}ร้องตั้งแต่ช่างเอ่ยปาก ร้องจน{mother}ต้องลุกเดินโยกไปรอบห้อง ร้องจนช่างเก็บพู่กัน ท่านย่าสั่งให้เขาเขียนหน้าที่เหลือจากความจำ แล้วจ่ายเงินให้ครบ

        รูปบนโถงบันไดไม่เหมือน{name}เลยสักนิด แขกที่มาบ้านชมกันว่าเหมือนพ่อ
      effects: { stats: { CHA: 1 } }

- id: infancy.foundling_many_hands
  stage: infancy
  weight: 10
  when:
    age: [1, 2]
    flags: [origin_marked_foundling]
  text: |
    วิหารใหญ่อีเซลมีเด็กกำพร้าสามสิบกว่าคน สิบเอ็ดคนมีเขา มีแม่ชีเก้าคน แม่ครัวหนึ่งคน กับวัวนมอีกหนึ่งตัวที่เด็กๆ ตั้งชื่อให้ว่านางเหม็น เด็กเล็กนอนเรียงกันในห้องยาวข้างครัว เพราะเป็นห้องเดียวที่ไออุ่นจากเตาลอดมาถึงตลอดคืน

    ที่นี่ไม่มีใครเป็นแม่ของใคร ใครว่างก็อุ้ม ใครเดินผ่านก็ป้อน เด็กโตอุ้มเด็กเล็ก เด็กเล็กอุ้มเด็กที่เล็กกว่า

    ขวบปีที่สอง {name}เริ่มเลือกเองว่าจะคลานไปหาใคร
  choices:
    - id: old_sister
      label: คลานไปหาแม่ชีแก่ที่ไม่เคยยิ้ม
      text: |
        แม่ชีโทเรนอายุมากที่สุดในวิหาร ไม่เคยยิ้มให้เด็กคนไหน เด็กทุกคนกลัวแก {name}คลานไปเกาะชายกระโปรงแกทุกวัน แกไม่เคยอุ้ม แต่ก็ไม่เคยสะบัดออก ผ่านไปหนึ่งหน้าหนาว แกเดินช้าลงทุกครั้งที่มี{name}เกาะอยู่
      effects: { stats: { WIS: 1 }, flags: [sister_toren_bond] }
    - id: older_kids
      label: คลานตามพวกเด็กโต
      text: |
        {name}คลานตามเด็กโตไปทุกที่ ทั้งลานซักผ้า ทั้งหลังคอกวัว เด็กโตสอนให้ร้องเพลงที่ห้ามร้องในวิหาร {name}ร้องได้ก่อนพูดชื่อตัวเองชัด แล้วร้องดังที่สุดตอนแม่ชีสวดเช้า
      effects: { stats: { CHA: 1 } }
    - id: cook
      label: คลานเข้าครัวไปหาแม่ครัว
      text: |
        แม่ครัวยัดเปลือกขนมปังใส่มือ{name}ทุกครั้งที่คลานเข้ามาในครัว แล้วทุกครั้งก็คลานเข้ามา ปลายปี{name}ตัวกลมที่สุดในห้องยาว แม่ครัวบอกแม่ชีว่าเด็กมันกินเก่ง แม่ชีบอกว่าแม่ครัวนั่นแหละให้เก่ง
      effects: { stats: { CON: 1 } }

- id: infancy.foundling_register
  stage: infancy
  weight: 10
  when:
    age: [1, 2]
    flags: [origin_marked_foundling]
  text: |
    ทุกปลายปี เสมียนของศาสนจักรตะเกียงมาที่วิหารพร้อมสมุดปกหนังสีดำ เสมียนไม่ได้มานับเด็กทุกคน มานับแต่เด็กที่มีเขา

    แม่ชีต้องพาเด็กมีเขามาเข้าแถวในห้องที่ปิดม่านทุกบาน เสมียนเอาเชือกผูกปมทาบวัดเขาบนหัวเด็ก ส่องตาด้วยเทียน แล้วจดลงสมุด ชื่อ อายุ ความยาวเขากี่ปม ตาสะท้อนไฟเป็นสีอะไร

    ปีนี้{name}อยู่ในแถวเป็นครั้งแรก แม่ชีโทเรน แม่ชีที่แก่ที่สุดในวิหาร เดินอยู่หลังแถว วางมือบนไหล่เด็กทีละคน คนละไม่กี่อึดใจ

    เสมียนจับหัว{name}เอียงเข้าหาแสงเทียน แล้วเอาเชือกมาทาบ
  choices:
    - id: bite_string
      label: งับเชือกวัดเขาไว้
      text: |
        {name}งับเชือกไว้แล้วไม่ยอมคาย เสมียนดึง {name}ดึงกลับ เด็กทั้งแถวหัวเราะจนแม่ชีต้องจุ๊ปาก สุดท้ายเสมียนยอมเปลี่ยนเชือกเส้นใหม่ แล้วเขียนในช่องหมายเหตุว่า ดุ

        แม่ชีโทเรนชะโงกดูคำนั้น แล้วบีบไหล่{name}แรงกว่าเด็กคนอื่นนิดหนึ่ง
      effects: { stats: { STR: 1 }, flags: [registered_by_lamp, lamp_noted_fierce] }
    - id: hide
      label: มุดไปหลบหลังกระโปรงแม่ชี
      text: |
        {name}มุดหลบไปอยู่หลังกระโปรงแม่ชีโทเรน เกาะแน่นจนเสมียนดึงไม่ออก แกไม่ช่วยดึง เสมียนรอจนเทียนสั้นลงไปข้อนิ้วหนึ่ง แล้วเขียนความยาวเขาเอาตามที่เห็นจากไกลๆ
      effects: { stats: { DEX: 1 }, flags: [registered_by_lamp] }
    - id: stare_candle
      label: จ้องเปลวเทียนไม่กะพริบ
      text: |
        ตาของ{name}สะท้อนแสงเทียนเป็นสีแดงเข้มกว่าเด็กคนอื่นในแถว เสมียนจดสีลงสมุด แล้วเขียนซ้ำอีกครั้งข้างคำเดิม ก่อนกลับ เขาถามแม่ชีโทเรนว่าเด็กคนนี้ใครเอามาไว้

        "ช่องส่งขนมปัง" แกตอบ "เหมือนทุกคน"
      effects: { stats: { WIS: 1 }, flags: [registered_by_lamp] }
