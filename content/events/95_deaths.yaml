# ชุด 1 ฉากตาย (stage: death) ออกเฉพาะตอนตัวละครกำลังจะตาย ฉากจบแล้วชีวิตจบ ทุกตัวเลือกให้ประโยคสุดท้าย (epitaph) ไว้ใต้ชื่อในหน้าชีวประวัติ
# เหตุมีสี่แบบ: age สิ้นอายุขัย (ฤดูหนาว) · wound แผลหรือไข้ · fight การปะทะ · sacrifice เลือกสละเอง
# told: false = ยังไม่มีข้อความไหนเล่าความตาย ฉากต้องเล่าเอง · told: true = ผลของตัวเลือกก่อนหน้าเล่าความตายกับเรื่องหลังจากนั้นไปแล้ว
#   ฉากจึงย้อนกลับไปชั่วอึดใจสุดท้าย เล่าจากข้างในว่าสิ่งสุดท้ายที่ตัวละครรู้คืออะไร ห้ามเล่าเหตุซ้ำ ห้ามบอกว่ามีใครรอดหรือไม่รอด
# ฉากที่มีเงื่อนไข (คู่ครอง ลูก เพื่อน คู่แค้น อาชีพ เผ่า) น้ำหนักสูงกว่าฉากสำรองที่ออกได้เสมอ
# ฉากไม่รู้ว่าเหตุการณ์ก่อนหน้าคืออะไร ห้ามบอกชนิดของแผล ที่เกิดเหตุ หรือคู่ต่อสู้
# death.age_voice: ข้อเสนอของเสียงใต้พื้น (ฉากตั้งต้น "ความตาย" ในคัมภีร์โลก) รับได้ครั้งเดียวต่อชีวิต รับแล้วอยู่ต่อ (survive) คะแนนโลกเอียงไปทางจอมมาร
#   เรื่องเล็กน้อยที่เสียงนั้นจะมาทวงยังไม่เขียน (ชุด 8) ห้ามบอกว่าคืออะไร

# ===================== สิ้นอายุขัย =====================

- id: death.age_partner
  stage: death
  mark: ฤดูหนาวสุดท้าย
  scene: home
  weight: 30
  when:
    dying: [age]
    told: false
    flags: [has_partner]
  text: |
    หน้าหนาวปีนี้{name}ไม่ได้ลุกจากเตียงอีกตั้งแต่ลมเปลี่ยนทิศ {partner}ลากเก้าอี้มาตั้งข้างเตียง แล้วไม่ได้ลากกลับ ผ้าห่มผืนที่สองคนแย่งกันมาตั้งแต่ปีแรกคลุมอยู่บนตัว{name}ทั้งผืน คืนนี้ไม่มีใครดึง

    หมอมาเมื่อบ่าย จับข้อมืออยู่นาน แล้วออกไปคุยกับ{partner}หน้าประตู เสียงเบาจนฟังไม่ออก แต่{name}ไม่ต้องฟังก็รู้ หมอไม่ได้ทิ้งยาไว้ให้

    ตกดึก{partner}ยังนั่งอยู่ที่เดิม มือข้างหนึ่งวางอยู่บนผ้าห่ม ตรงที่เป็นมือของ{name} น้ำในกาบนเตาเดือดจนแห้งไปแล้วรอบหนึ่ง ไม่มีใครลุกไปยก
  choices:
    - id: cold_feet
      label: บ่นว่าเท้าเย็น เหมือนที่บ่นทุกคืนมาทั้งชีวิต
      text: |
        {partner}ลุกไปหยิบถุงเท้าขนแกะคู่หนาจากหีบ สวมให้ทีละข้าง ช้ากว่าที่เคย แล้วบ่นกลับเหมือนทุกคืน ว่าเท้าคู่นี้เย็นมาตั้งแต่คืนแรกที่มานอนเตียงเดียวกัน ไม่เห็นจะอุ่นขึ้นสักปี

        {name}หัวเราะได้ครึ่งเสียง แล้วหลับไปทั้งที่มุมปากยังยกอยู่ ใกล้รุ่ง{partner}เอื้อมมือไปจับเท้าคู่นั้นผ่านถุงเท้า จับอยู่นาน แล้วดึงผ้าห่มขึ้นคลุมให้ถึงคาง ยกให้ทั้งผืนโดยไม่เหลือชายไว้ฝั่งตัวเอง
      effects:
        epitaph: จากไปบนเตียงตัวเอง เท้าอุ่นเป็นคืนแรก
    - id: light_the_bowl
      label: ขอให้{partner}จุดชามไฟใบนั้นอีกครั้ง
      requires: { item: wedding_clay_bowl }
      text: |
        ชามดินเผาใบนั้นอยู่บนชั้นในครัวมาตั้งแต่วันแต่ง ขอบบิ่นไปสองที่ {partner}เช็ดฝุ่นออก เทน้ำมันลงไปครึ่งชาม มือสั่นจนหกลงพื้นหยดหนึ่ง {name}เห็น แล้วบอกว่าป้าข้างบ้านคงกำลังหัวเราะอยู่ที่ไหนสักแห่ง

        {partner}วางชามไว้บนเก้าอี้ข้างเตียง ไฟดวงเล็กนิ่งอยู่ทั้งคืนเพราะไม่มีใครเดินผ่าน {name}มองไฟดวงนั้นจนตาปิด เช้าแล้วน้ำมันยังเหลือค่อนชาม {partner}ไม่ได้ดับ ปล่อยให้ติดอยู่อย่างนั้นจนหมดเอง สามวัน
      effects:
        epitaph: จากไปข้างชามไฟใบที่ถือด้วยกันในวันแต่ง
    - id: hold_hand
      label: ไม่พูดอะไร จับมือ{partner}ไว้เฉยๆ
      text: |
        มือของ{partner}หยาบกว่าตอนที่จับครั้งแรก ข้อนิ้วโตขึ้น โคนนิ้วโป้งมีรอยด้านที่{name}รู้จักดีกว่ามือตัวเอง {name}เอานิ้วลูบรอยนั้นไปมา

        ไม่มีใครพูดอะไรจนไก่ขัน ตอนนั้นนิ้วของ{name}หยุดลูบแล้ว {partner}ไม่ได้ดึงมือออก นั่งอยู่อย่างนั้นจนแดดเข้ามาถึงขาเตียง จึงลุกไปเปิดประตูบอกเพื่อนบ้าน
      effects:
        epitaph: "จากไปโดยมือยังอยู่ในมือของ{partner}"

- id: death.age_child
  stage: death
  mark: ฤดูหนาวสุดท้าย
  scene: home
  weight: 28
  cast:
    kid: { kin: [child], min_age: 16 }
  when:
    dying: [age]
    told: false
  text: |
    {kid}กลับมาบ้านตั้งแต่ต้นหน้าหนาว บอกว่ามาช่วยผ่าฟืน ฟืนผ่าหมดไปตั้งแต่สัปดาห์แรก {kid:เขา|เธอ}ก็ยังไม่กลับ

    เตียงของ{name}ย้ายมาอยู่ข้างเตา ข้าวต้มในชามบนเก้าอี้เย็นไปแล้ว ตักไปได้สามช้อน {kid}ไม่ได้คะยั้นคะยอให้กินต่อ เอาผ้ามาคลุมชามไว้ แล้วนั่งลงที่ปลายเตียง ตรงที่{name}เคยนั่งตอน{kid:เขา|เธอ}เป็นไข้เมื่อยังเล็ก

    ข้างนอกลมแรงจนบานหน้าต่างสั่น ลมหายใจของ{name}ดังกว่าเสียงลมอยู่พักหนึ่ง แล้วก็เบาลง
  choices:
    - id: ask_story
      label: ขอให้{kid}เล่าเรื่องตอนเด็กที่ตัวเองจำไม่ได้แล้ว
      text: |
        {kid}เล่าเรื่องวันที่หนีออกจากบ้านตอนเจ็ดขวบ ไปได้ไกลสุดแค่พ้นสายตาจากประตู แล้วนั่งรออยู่ตรงนั้นจนมืด เพราะอยากรู้ว่าจะมีใครออกมาตามไหม {name}ออกมาตาม ถือขนมปังมาด้วยครึ่งก้อน ไม่ได้ดุ นั่งกินด้วยกันจนหมด แล้วเดินกลับบ้านโดยไม่มีใครพูดถึงเรื่องนี้อีก

        {name}จำไม่ได้สักตอน แต่ฟังจนจบ แล้วบอกว่าขนมปังครึ่งก้อนนั่นคงเป็นมื้อเย็นของตัวเอง {kid}หัวเราะ พอหันกลับมาอีกที {name}หลับไปแล้ว และไม่ได้ตื่นขึ้นมาฟังเรื่องถัดไป
      effects:
        epitaph: "จากไประหว่างฟัง{kid}เล่าเรื่องที่ตัวเองลืมไปแล้ว"
    - id: tell_where
      label: บอก{kid}ว่าของแต่ละอย่างในบ้านเก็บไว้ตรงไหน
      text: |
        กุญแจหีบอยู่ในไหเกลือ เงินอยู่ใต้กระดานแผ่นที่สามนับจากเตา มีดเล่มที่คมที่สุดไม่ใช่เล่มที่แขวนอยู่ แต่เป็นเล่มที่ห่อผ้าไว้หลังตู้ {name}บอกทีละอย่าง หยุดหายใจเป็นช่วงๆ {kid}ไม่ได้จด พยักหน้ารับทุกข้อ

        ข้อสุดท้าย{name}บอกว่าหลังคาตรงมุมเหนือรั่วทุกปี อย่าไปจ้างใครซ่อม เอาถังรองไว้ก็พอ แล้วก็ไม่มีข้อต่อไป หน้าฝนปีถัดมา{kid}เอาถังไปรองไว้ตรงมุมนั้น น้ำหยดลงถังเป็นจังหวะเดียวกับที่ได้ยินมาตั้งแต่เด็ก
      effects:
        epitaph: จากไปหลังบอกลูกครบทุกอย่าง จนถึงหลังคาที่รั่ว
    - id: send_to_bed
      label: ไล่{kid}ไปนอน บอกว่าพรุ่งนี้ค่อยคุยกัน
      text: |
        {kid}ไม่ยอมไปในทีแรก {name}ต้องใช้เสียงแบบที่เคยใช้ตอน{kid:เขา|เธอ}ไม่ยอมเข้านอนเมื่อหลายสิบปีก่อน เสียงนั้นแหบไปมากแล้ว แต่ยังได้ผล {kid}ลุกไปเติมฟืน ห่มผ้าให้ แล้วเดินไปนอนที่มุมห้องอีกฟาก

        {name}นอนฟังเสียงลูกพลิกตัวอยู่พักใหญ่ จนเสียงนั้นกลายเป็นเสียงหายใจยาวของคนหลับ จึงหลับตาบ้าง เช้าวันต่อมา{kid}ตื่นก่อน เติมฟืน ต้มน้ำ แล้วเดินมาปลุก
      effects:
        epitaph: จากไปตอนลูกหลับ อย่างที่ตั้งใจ

- id: death.age_friend
  stage: death
  mark: ฤดูหนาวสุดท้าย
  scene: home
  weight: 20
  cast:
    friend: { bond: [friend], min_closeness: 2 }
  when:
    dying: [age]
    told: false
  text: |
    {friend}มาถึงตอนบ่าย หอบมาตลอดทาง ถือไหเหล้ามาด้วยไหหนึ่ง ทั้งที่หมอห้ามทั้งสองคนมาหลายปีแล้ว

    {name}นอนอยู่บนเตียงข้างหน้าต่าง ผอมลงจนผ้าห่มแทบไม่นูน {friend}ไม่ได้ทักเรื่องนั้น {friend:เขา|นาง}ลากม้านั่งมาตั้ง วางไหลงบนพื้น แล้วเริ่มบ่นเรื่องราคาเหล้าที่ขึ้นทุกปี เหมือนที่บ่นทุกครั้งที่เจอกัน

    แดดบ่ายเลื่อนจากปลายเตียงขึ้นมาถึงอก
  choices:
    - id: one_cup
      label: ขอเหล้าจอกหนึ่ง
      text: |
        {friend}รินให้ครึ่งจอก ประคองหัว{name}ขึ้นให้จิบ เหล้าแรงจน{name}ไอ {friend}ว่าของถูกก็แบบนี้ แล้วรินให้ตัวเองเต็มจอก สองคนชนจอกกันเบาๆ จอกหนึ่งอยู่ในมือ อีกจอกวางอยู่บนอก

        เรื่องที่คุยกันบ่ายนั้นไม่มีเรื่องไหนสำคัญ ใครโกงไพ่ใครเมื่อสามสิบปีก่อน ใครเดินแพ้ใครตอนขายังดี ตะวันตกดิน{name}หลับไปกลางประโยคของตัวเอง {friend}นั่งรอให้พูดต่ออยู่จนมืด แล้วดื่มเหล้าครึ่งจอกที่เหลือบนอกนั้นแทน
      effects:
        epitaph: จากไปกลางประโยค ค้างเหล้าเพื่อนไว้ครึ่งจอก
    - id: old_debt
      label: ทวงสองเหรียญที่{friend}ยืมไปแล้วไม่เคยคืน
      text: |
        {friend}ทำหน้าเหมือนโดนใส่ร้าย บอกว่าคืนแล้วตั้งแต่ปีที่น้ำท่วม {name}บอกว่าปีนั้นน้ำไม่ได้ท่วม เถียงกันอยู่อย่างนั้นจนคนข้างบ้านต้องชะโงกมาดูว่ามีเรื่องอะไร

        สุดท้าย{friend}ล้วงเหรียญออกมาสองเหรียญ วางลงในมือ{name}ทีละเหรียญ เสียงดังกว่าที่จำเป็น {name}กำไว้ทั้งคืน เช้าวันต่อมามือนั้นยังกำอยู่ {friend}เป็นคนแกะนิ้วออกทีละนิ้ว ดูเหรียญสองเหรียญนั้นอยู่ครู่หนึ่ง แล้วพับนิ้วปิดกลับให้เหมือนเดิม
      effects:
        epitaph: จากไปพร้อมเงินสองเหรียญที่ทวงคืนได้ในวันสุดท้าย
    - id: stay_till_sleep
      label: ขอให้{friend}นั่งอยู่จนกว่าจะหลับ
      text: |
        {friend}บอกว่าก็ไม่ได้จะไปไหนอยู่แล้ว ขาแบบนี้กว่าจะเดินกลับถึงบ้านก็เช้า {friend:เขา|นาง}เล่าเรื่องเดิมที่{name}ฟังมาเป็นร้อยรอบ เล่าผิดตรงเดิมทุกครั้ง {name}แก้ให้ตรงเดิมทุกครั้ง

        รอบนี้{friend}เล่าผิด แล้วไม่มีใครแก้ {friend:เขา|นาง}หยุดเล่า มองหน้าคนบนเตียงอยู่นาน แล้วเล่าต่อจนจบเรื่อง เล่าถูกเป็นครั้งแรก
      effects:
        epitaph: "จากไประหว่างฟังเรื่องเดิมของ{friend}เป็นรอบสุดท้าย"

- id: death.age_rival
  stage: death
  mark: ฤดูหนาวสุดท้าย
  scene: home
  weight: 18
  cast:
    foe: { bond: [rival] }
  when:
    dying: [age]
    told: false
  text: |
    คนที่มาเคาะประตูเช้านี้คือ{foe}

    ไม่มีใครกล้าบอกว่าไม่ให้เข้า {foe:เขา|นาง}เดินเข้ามาเอง ไม้เท้ากระทบพื้นทีละก้าว หยุดยืนที่ปลายเตียง มอง{name}ตั้งแต่หัวจรดเท้าเหมือนตีราคาของในตลาด

    "นึกว่าเจ้าจะทนกว่านี้" {foe:เขา|นาง}ว่า แล้วนั่งลงบนเก้าอี้โดยไม่มีใครเชิญ

    สองคนแก่พอกันแล้ว แก่จนเรื่องที่เคยแย่งกันไม่เหลืออะไรให้แย่ง {name}หายใจแต่ละครั้งมีเสียงเหมือนลมลอดช่องประตู
  choices:
    - id: i_won
      label: บอก{foe}ว่าครั้งนั้นตัวเองเป็นฝ่ายชนะ
      text: |
        {foe}หัวเราะเสียงแห้ง บอกว่าคนใกล้ตายพูดอะไรก็ได้ ไม่มีใครเถียงด้วยหรอก แล้ว{foe:เขา|นาง}ก็เถียงทันที ไล่ตั้งแต่วันแรกที่เจอกัน ใครทำอะไรก่อน ใครโกงตรงไหน จำได้ทุกเม็ด ดีกว่าที่{name}จำได้เอง

        {name}ฟังไปยิ้มไป ไม่ได้เถียงกลับสักคำ {foe}เถียงอยู่คนเดียวไปได้ครึ่งเรื่องจึงรู้ตัวว่าอีกฝ่ายไม่หายใจแล้ว {foe:เขา|นาง}นั่งนิ่งไปพักหนึ่ง แล้วพูดกับคนบนเตียงว่า เออ ครั้งนั้นเจ้าชนะก็ได้ ก่อนจะยันไม้เท้าลุกออกไป
      effects:
        epitaph: "จากไปตอน{foe}ยังเถียงไม่จบ"
    - id: why_come
      label: ถาม{foe}ว่ามาทำไม
      text: |
        {foe}ไม่ตอบในทีแรก มองออกไปนอกหน้าต่าง แล้วบอกว่าคนรุ่นเดียวกันเหลืออยู่ไม่กี่คน คนที่จำได้ว่าสมัยก่อนตัวเองเก่งแค่ไหนเหลืออยู่คนเดียว นอนอยู่ตรงนี้ ถ้าคนนี้ไปอีกคน ก็ไม่เหลือใครยืนยันให้

        {name}บอกว่างั้นก็ต้องอยู่ต่อให้นานๆ คนเดียว {foe}ว่าจะพยายาม แล้วนั่งอยู่จนเย็น ไม่ได้คุยอะไรกันอีก ตอน{foe:เขา|นาง}ลุกกลับ {name}หลับไปแล้ว ตกค่ำจึงมีคนมาพบว่าไม่ใช่แค่หลับ
      effects:
        people: [{ id: "@foe", closeness: 1 }]
        epitaph: จากไปหลังคู่แค้นมานั่งด้วยทั้งบ่าย
    - id: turn_away
      label: หันหน้าเข้าผนัง ไม่พูดด้วย
      text: |
        {foe}นั่งอยู่อย่างนั้นอีกครู่ใหญ่ ไม่ได้พูดอะไรกับแผ่นหลังที่หันให้ แล้ววางของบางอย่างลงบนเก้าอี้ ก่อนจะเดินออกไป เสียงไม้เท้าห่างออกไปทีละก้าวจนพ้นประตู

        {name}ไม่ได้หันกลับมาดู คืนนั้นลมหายใจหยุดไปตอนไหนไม่มีใครรู้ เช้าขึ้นคนที่มาพบเห็นของบนเก้าอี้ก่อนเห็นคนบนเตียง เป็นแอปเปิลลูกหนึ่ง ปอกเปลือกไว้ให้แล้วครึ่งลูก
      effects:
        epitaph: "จากไปโดยไม่ได้หันมาดูว่า{foe}ทิ้งอะไรไว้ให้"

- id: death.age_voice
  stage: death
  mark: ฤดูหนาวสุดท้าย
  scene: home
  weight: 60
  when:
    dying: [age]
    told: false
    flags: [race_tiefling]
    not_flags: [took_demon_winters]
  text: |
    คืนนี้เสียงนั้นมาตอน{name}ยังตื่นอยู่

    ที่ผ่านมา{name}ได้ยินมันแค่ในฝัน เสียงทุ้มต่ำจากที่ไหนสักแห่งใต้ดิน เรียกชื่อช้าๆ ทีละพยางค์ ตื่นมาแล้วจำได้แค่ว่ามีคนเรียก คืนนี้เสียงเดียวกันดังขึ้นมาจากใต้พื้นห้อง ชัดเท่าคนนั่งอยู่ข้างเตียง ใต้ผมที่บางลงมากแล้ว {name}รู้สึกอุ่นขึ้นมาสองจุด

    "ข้าให้เจ้าได้อีกหลายฤดูหนาว" เสียงนั้นว่า "ขากลับมาเดินได้ ตากลับมาชัด แลกกับเรื่องเล็กน้อยเรื่องเดียว"

    ตะเกียงข้างเตียงหรี่ลงเองจนเหลือไส้แดง ลมหายใจของ{name}สั้นจนนับได้ ข้างนอกไม่มีเสียงอะไรเลย แม้แต่หมา
  choices:
    - id: too_late
      label: หัวเราะ แล้วบอกเสียงนั้นว่ามาช้าไปหลายสิบปี
      text: |
        เสียงหัวเราะของ{name}แหบจนเหมือนไอ ตอนยังมีแรงเดิน ยังมีเรื่องให้อยากได้ เสียงนี้ไม่เคยเสนออะไร รอจนคนเหลือแต่ลมหายใจจึงค่อยมาต่อราคา {name}บอกมันว่าพ่อค้าแบบนี้ที่ตลาดเรียกว่าพวกรับซื้อของหลุดจำนำ

        เสียงใต้พื้นไม่โกรธ มันเงียบไปเฉยๆ เหมือนคนที่ยังมีเวลาเหลือเฟือ ไออุ่นสองจุดใต้ผมจางไปพร้อมกัน {name}หลับตา ลมหายใจครั้งถัดไปไม่มา
      effects:
        world: { demon: -1 }
        epitaph: จากไปหลังหัวเราะใส่ข้อเสนอสุดท้าย
    - id: ask_the_price
      label: ถามว่าเรื่องเล็กน้อยนั้นคืออะไร
      text: |
        เสียงนั้นบอกว่าถึงเวลาแล้วจะบอกเอง {name}ถามว่าเวลาไหน มันว่าเวลาที่เหมาะ ถามว่าใครเป็นคนบอกว่าเหมาะ มันว่ามันเอง {name}ถามต่อไปทีละข้อ มันตอบทุกข้ออย่างใจเย็น และไม่มีข้อไหนเป็นคำตอบ

        ถามไปได้เก้าข้อ {name}ก็บอกว่าไม่เอา ของที่คนขายไม่ยอมบอกราคา ที่ตลาดไม่มีใครซื้อ เสียงนั้นเงียบไปนานกว่าทุกครั้ง ก่อนฟ้าสาง{name}ใช้เล็บขีดผนังข้างเตียงไว้เก้าขีด ขีดเส้นขวางทับ แล้วจึงยอมหลับตา
      effects:
        epitaph: จากไปหลังถามเสียงใต้พื้นเก้าข้อ แล้วไม่รับ
    - id: take_the_winters
      label: ตอบตกลง
      text: |
        คำว่าตกลงยังไม่ทันพ้นปาก ไออุ่นสองจุดใต้ผมก็ร้อนวาบขึ้นมาเหมือนมีคนเอาถ่านมาแตะ แล้วไหลลงตามสันหลังไปถึงปลายเท้า ลมหายใจครั้งถัดไปเข้าได้เต็มอกเป็นครั้งแรกในรอบหลายเดือน

        เช้าวันนั้น{name}ลุกขึ้นนั่งเอง เพื่อนบ้านที่แวะมาเพราะคิดว่าจะได้ช่วยงานศพยืนค้างอยู่ที่ประตู เรื่องเล็กน้อยเรื่องเดียวที่เสียงนั้นขอ มันยังไม่ได้บอกว่าคืออะไร บอกแค่ว่าถึงเวลาแล้วจะมาบอกเอง
      effects:
        survive: true
        max_hp: 6
        world: { demon: 2 }
        flags: [took_demon_winters]
        mark: รับฤดูหนาวเพิ่มจากเสียงใต้พื้น

- id: death.age_cleric
  stage: death
  mark: ฤดูหนาวสุดท้าย
  scene: home
  weight: 25
  when:
    dying: [age]
    told: false
    class: cleric
  text: |
    นักบวชหนุ่มจากวิหารมานั่งเฝ้าตั้งแต่เมื่อวาน ถือหนังสือสวดส่งวิญญาณมาด้วย เปิดค้างไว้ที่หน้าแรก ยังไม่กล้าเริ่ม เพราะคนบนเตียงสวดบทนี้ให้คนอื่นมามากกว่าที่เขาเคยอ่าน

    {name}นอนฟังเสียงเขาพลิกหน้ากระดาษไปมา มือที่เคยวางบนหน้าผากคนใกล้ตายมานับไม่ถ้วนวางอยู่บนอกตัวเอง เบาจนผ้าห่มไม่ยุบ

    "ท่านอยากให้เริ่มตอนไหนขอรับ" เขาถาม
  choices:
    - id: correct_him
      label: ให้เขาเริ่มเลย แล้วคอยแก้ตรงที่อ่านผิด
      text: |
        เขาอ่านผิดตั้งแต่บรรทัดที่สาม เว้นวรรคผิดที่จนความหมายกลับกัน {name}ยกนิ้วขึ้นนิ้วหนึ่ง เขาหยุด อ่านใหม่ ผิดอีกในบรรทัดที่เจ็ด {name}ยกนิ้วอีก เป็นอย่างนั้นไปทั้งบท เหงื่อเขาหยดลงบนหน้ากระดาษ

        บรรทัดสุดท้ายเขาอ่านถูกทั้งบรรทัด เงยหน้าขึ้นมารอดูนิ้ว นิ้วนั้นไม่ได้ยกขึ้นอีก ปีต่อๆ มาเขาสวดบทนี้ให้คนทั้งถิ่น ไม่เคยเว้นวรรคผิดอีกสักครั้ง
      effects:
        epitaph: จากไประหว่างสอนนักบวชหนุ่มสวดส่งวิญญาณ ด้วยบทของตัวเอง
    - id: the_old_question
      label: ถามเขาว่า{god}อยู่ที่ไหน ตอนที่คนตายโดยไม่มีใครช่วย
      text: |
        นักบวชหนุ่มอ้าปากจะตอบ แล้วหุบ คำถามนี้ไม่มีในหนังสือเล่มไหนที่เขาเรียนมา เขาคิดอยู่นาน แล้วตอบว่าไม่รู้ขอรับ แต่คืนนี้ท่านไม่ได้ตายโดยไม่มีใคร กระผมอยู่ตรงนี้

        {name}มองหน้าเขา แล้วบอกว่าสอบผ่าน เขาไม่รู้ว่าสอบอะไร รู้แต่ว่าหลังจากนั้นคนบนเตียงหลับตาลงด้วยหน้าที่คลายกว่าตลอดสองวันที่ผ่านมา เขาเริ่มสวดตอนไก่ขัน สวดจนจบบทโดยไม่มีใครฟัง
      effects:
        epitaph: จากไปหลังได้คำตอบของคำถามที่ถามมาทั้งชีวิตนักบวช
    - id: open_window
      label: บอกว่าไม่ต้องสวด ขอแค่ให้เปิดหน้าต่าง
      text: |
        นักบวชหนุ่มลังเล หนังสือสวดไม่ได้เขียนไว้ว่าทำแบบนี้ได้ แต่เขาลุกไปดันบานไม้ออก อากาศเย็นไหลเข้ามาพร้อมเสียงของถิ่นตอนกลางคืน หมาเห่าไกลๆ ใครสักคนกล่อมเด็ก ประตูบานหนึ่งปิด

        {name}ฟังเสียงพวกนั้นทีละเสียง คนที่อยู่หลังแต่ละเสียงเคยมาขอพร มาขอยา มาแต่งงาน มาฝังพ่อแม่ ครบแทบทุกบ้าน ใกล้รุ่งเสียงสุดท้ายที่ดังเข้ามาคือเสียงไก่ {name}ไม่ได้อยู่ฟัง
      effects:
        epitaph: จากไปตอนฟังเสียงของถิ่นที่ตัวเองดูแลมาทั้งชีวิต

- id: death.age_alone
  stage: death
  mark: ฤดูหนาวสุดท้าย
  scene: home
  weight: 6
  when:
    dying: [age]
    told: false
  text: |
    หน้าหนาวปีนี้มาเร็ว {name}เตรียมฟืนไว้ไม่ทัน ที่มีอยู่ต้องเผาทีละท่อน

    เช้าวันหนึ่ง{name}ตื่นมาแล้วรู้ว่าวันนี้ลุกไม่ไหว ไม่ได้เจ็บตรงไหนมากกว่าทุกวัน ร่างทั้งร่างหนักเหมือนเป็นของคนอื่นที่ฝากไว้ ไฟในเตามอดไปตั้งแต่กลางดึก บนโต๊ะมีขนมปังเหลืออยู่ครึ่งก้อน กับน้ำในเหยือกที่ผิวเริ่มจับเป็นแผ่นบางๆ

    แดดเช้าส่องเข้ามาทางช่องหน้าต่าง ตกลงบนผ้าห่มเป็นสี่เหลี่ยมเล็กๆ อุ่นอยู่แค่ตรงนั้น
  choices:
    - id: watch_the_light
      label: นอนดูแดดสี่เหลี่ยมนั้นเลื่อนไปตามผ้าห่ม
      text: |
        สี่เหลี่ยมนั้นเลื่อนจากเข่าขึ้นมาถึงมือตอนสาย {name}หงายมือรับ อุ่นเท่ามือคนมาจับ ตอนเที่ยงมันขึ้นมาถึงหน้า ตอนบ่ายเลื่อนเลยไปอยู่บนผนัง แล้วไต่ขึ้นไปช้าๆ จนถึงขื่อ

        {name}มองตามไปจนสี่เหลี่ยมนั้นหายออกจากห้อง สามวันต่อมาเพื่อนบ้านสังเกตว่าปล่องไฟหลังนี้ไม่มีควัน จึงมาผลักประตูดู
      effects:
        epitaph: จากไปคนเดียว ในวันที่แดดดี
    - id: finish_the_bread
      label: เอื้อมไปหยิบขนมปังครึ่งก้อนนั้นมากินให้หมด
      text: |
        กว่ามือจะไปถึงโต๊ะใช้เวลานานเท่าเดินไปตลาดสมัยก่อน ขนมปังแข็งจนต้องอมไว้ให้นิ่มทีละคำ {name}กินช้าๆ จนหมดครึ่งก้อน ไม่เหลือเศษให้หนู ปัดผ้าห่มให้เรียบ แล้วเอามือสองข้างวางซ้อนกันบนอก

        คนที่มาพบเล่าต่อกันว่าบ้านหลังนี้เรียบร้อยผิดกับบ้านคนตายทั่วไป จานบนโต๊ะว่าง ไม่มีของกินค้าง ผ้าห่มไม่มีรอยยับ เหมือนเจ้าของบ้านจัดทุกอย่างไว้ก่อนออกไปธุระ แล้วตั้งใจว่าจะไม่กลับมา
      effects:
        epitaph: จากไปหลังกินขนมปังครึ่งก้อนสุดท้ายจนหมด
    - id: count_names
      label: ไล่ชื่อคนที่เคยรู้จักทีละคน ดูว่ายังจำได้กี่คน
      text: |
        {name}เริ่มจากคนที่ตายไปแล้ว เพราะมีมากกว่า ไล่ไปตามลำดับปีที่จากกัน บางชื่อมาพร้อมหน้า บางชื่อมาพร้อมเสียง บางชื่อมาแต่ชื่อ ไม่เหลือทั้งหน้าทั้งเสียง นับได้เกินห้าสิบก็เลิกนับ ไล่ชื่อต่ออย่างเดียว

        ชื่อท้ายๆ {name}ไม่ได้ออกเสียงแล้ว ริมฝีปากขยับอย่างเดียว เพื่อนบ้านที่มาพบสองวันต่อมาเล่าว่าปากของคนตายยังเผยออยู่ เหมือนกำลังจะเรียกใครสักคน
      effects:
        epitaph: จากไประหว่างไล่ชื่อคนที่เคยรู้จัก ยังไม่ถึงคนสุดท้าย

- id: death.age_bench
  stage: death
  mark: แดดแรกหลังฤดูหนาวสุดท้าย
  weight: 6
  when:
    dying: [age]
    told: false
  text: |
    วันแรกที่อากาศอุ่นพอ {name}ให้เด็กข้างบ้านช่วยยกม้านั่งออกมาตั้งหน้าประตู ตรงที่แดดลง หน้าหนาวที่ผ่านมาเอาไปเกือบทุกอย่าง เหลือแรงไว้ให้พอเดินจากเตียงมาถึงม้านั่งตัวนี้ วันละเที่ยว

    คนเดินผ่านไปมาเหมือนทุกวัน คนที่รู้จักยกมือทัก คนที่ไม่รู้จักมองแวบหนึ่งแล้วมองทางต่อ เด็กสามสี่คนเล่นอะไรกันอยู่กลางถนน เสียงดังจนผู้ใหญ่ต้องตะโกนปราม

    {name}เอาหลังพิงผนังบ้าน ไม้กระดานอุ่นแดดแล้ว อุ่นทะลุเสื้อเข้ามาถึงสันหลัง
  choices:
    - id: watch_children
      label: นั่งดูเด็กเล่น
      text: |
        กติกาของเกมนั้น{name}ดูไม่ออก รู้แต่ว่าเด็กตัวเล็กที่สุดโดนโกงทุกรอบ และยังไม่รู้ตัว {name}ตั้งใจว่ารอบหน้าจะตะโกนบอก

        รอบหน้ามาถึง เด็กตัวเล็กโดนโกงอีก ไม่มีใครตะโกนบอก เด็กเล่นกันต่อจนเย็น ตอนแม่ของเด็กคนหนึ่งมาตามลูกกลับบ้าน นางหันมาจะทักคนบนม้านั่ง แล้วบอกให้ลูกวิ่งไปตามผู้ใหญ่มาอีกคน
      effects:
        epitaph: จากไปบนม้านั่งหน้าบ้าน ระหว่างดูเด็กเล่น
    - id: close_eyes_in_sun
      label: หลับตา ให้แดดลงเต็มหน้า
      text: |
        หลังเปลือกตาเป็นสีส้ม เสียงของถนนยังอยู่ครบ ล้อเกวียน ฝีเท้า คนต่อราคา แต่ค่อยๆ ไกลออกไปเหมือน{name}นั่งอยู่บนเกวียนที่กำลังออกจากถิ่น ทั้งที่ม้านั่งไม่ได้ขยับ

        แดดเลื่อนพ้นหน้าไปตอนบ่ายแก่ คนที่เดินผ่านเห็นคนแก่นั่งหลับยิ้มอยู่หน้าบ้าน ไม่มีใครปลุก จนตะเกียงถนนเริ่มติด จึงมีคนมาแตะไหล่
      effects:
        epitaph: จากไปกลางแดด หน้ายังยิ้ม
    - id: greet_everyone
      label: ทักทุกคนที่เดินผ่าน เรียกชื่อให้ถูกทุกคน
      text: |
        คนแรกเป็นลูกของเพื่อนเก่า คนที่สองเป็นหลานของคนที่เคยทะเลาะกัน คนที่สาม{name}จำชื่อไม่ได้ จึงเรียกด้วยชื่อพ่อของเขาแทน เขาหัวเราะ บอกว่าคนเรียกผิดแบบนี้เหลืออยู่คนเดียวในถิ่นแล้ว

        ทักไปได้สิบกว่าคนเสียงก็หมด {name}ยกมือแทน คนท้ายๆ ได้แค่พยักหน้า คนสุดท้ายที่เดินผ่านยกมือทักก่อน รออยู่ครู่หนึ่ง ไม่มีมือไหนยกตอบ เขาจึงเดินเข้ามาดูใกล้ๆ
      effects:
        epitaph: จากไปหลังทักคนทั้งถนน เรียกชื่อถูกเกือบทุกคน

# ===================== แผลหรือไข้ (พลังชีวิตหมด) =====================

- id: death.wound_kin
  stage: death
  mark: ล้มลงแล้วไม่ได้ลุกอีก
  scene: home
  weight: 25
  when:
    dying: [wound]
    told: false
    flags: [has_partner]
  text: |
    {name}ไม่ได้ลุกจากเตียงอีกหลังวันนั้น {partner}เช็ดตัวให้ เปลี่ยนผ้าให้ ป้อนน้ำทีละช้อน สามวันแรกยังกลืนได้ วันที่สี่น้ำไหลออกมุมปาก

    หมอมาสองครั้ง ครั้งที่สองไม่ได้เปิดกระเป๋ายา ยืนคุยกับ{partner}หน้าประตูอยู่นาน แล้วกลับไปโดยไม่เก็บเงิน

    คืนนี้{name}ลืมตาขึ้นมาได้ช่วงหนึ่ง เห็นขื่อบ้านตัวเอง เห็น{partner}นั่งหลับคอพับอยู่บนเก้าอี้ มือยังกำช้อนไว้
  choices:
    - id: wake
      label: เรียก{partner}ให้ตื่น
      text: |
        เสียงที่ออกมาเบากว่าที่ตั้งใจ แต่{partner}ตื่นทันที เหมือนคนที่ไม่ได้หลับจริงมาหลายคืน {p:เขา|เธอ}ถามว่าเอาน้ำไหม {name}ส่ายหน้า ถามว่าเจ็บไหม {name}ส่ายหน้าอีก แล้วบอกว่าอยากเห็นหน้าตอนตื่น

        {partner}วางช้อนลง ขยับเก้าอี้เข้ามาจนเข่าชนขอบเตียง สองคนมองหน้ากันอยู่อย่างนั้นโดยไม่มีใครหาเรื่องพูด ไก่ขันรอบแรก{name}ยังมองอยู่ รอบที่สองตายังเปิด แต่ไม่ได้มองอะไรแล้ว
      effects:
        epitaph: "จากไปโดยเห็นหน้า{partner}เป็นอย่างสุดท้าย"
    - id: let_sleep
      label: ปล่อยให้{partner}หลับต่อ
      text: |
        {name}มอง{partner}หลับอยู่นาน ผมยุ่ง ปากเผยอ ช้อนในมือค่อยๆ เอียงจนเกือบหลุด เหมือนทุกครั้งที่{p:เขา|เธอ}เผลอหลับตอนนั่งรอ{name}กลับบ้านดึก {name}เคยปลุกทุกครั้ง คืนนี้ไม่ปลุก

        ช้อนหลุดจากมือตกลงพื้นตอนใกล้รุ่ง {partner}สะดุ้งตื่น ก้มลงเก็บ เงยขึ้นมาจะขอโทษที่เผลอหลับ แล้วก็ไม่ได้พูด
      effects:
        epitaph: "จากไปเงียบๆ เพราะไม่อยากปลุก{partner}"
    - id: promise
      label: ขอให้{partner}สัญญาว่าจะไม่อยู่คนเดียวนานเกินไป
      text: |
        {partner}ตื่นเพราะมือของ{name}แตะเข่า ฟังคำขอจนจบ แล้วบอกว่าเรื่องแบบนี้ไม่มีใครสัญญาได้ {name}ว่างั้นก็โกหกหน่อย {p:เขา|เธอ}สูดจมูกทีหนึ่ง บอกว่าได้ สัญญา จะรีบหาคนใหม่ให้ทันก่อนสิ้นปีเลย

        {name}บอกว่าไม่ต้องรีบขนาดนั้นก็ได้ แล้วหลับไปทั้งที่ยังยิ้ม {partner}จับมือนั้นไว้จนมันเย็น สิ้นปีนั้น{p:เขา|เธอ}ยังอยู่คนเดียว ปีถัดไปก็ยัง
      effects:
        epitaph: "จากไปหลังให้{partner}สัญญาเรื่องที่ไม่มีใครรักษาได้"

- id: death.wound_parent
  stage: death
  mark: ไข้ที่ไม่ยอมลด
  scene: home
  weight: 25
  when:
    dying: [wound]
    told: false
    age: [12, 24]
    not_flags: [origin_marked_hidden, married]
  text: |
    {mother}ไม่ได้นอนมาสามคืน

    นางนั่งอยู่ข้างที่นอน บิดผ้าชุบน้ำวางบนหน้าผากของ{name} ผ้าร้อนเร็วจนต้องเปลี่ยนทุกครู่ ปากขยับเป็นคำสวดที่จำได้ครึ่งๆ กลางๆ สลับกับคำด่าทุกคนที่มีส่วนทำให้ลูกเป็นแบบนี้ ไล่ชื่อไปทีละคน รวมทั้งชื่อของนางเอง

    หมอมาดูตอนหัวค่ำ เปิดผ้าออก แล้วปิดกลับ ไม่ได้พูดอะไรกับ{mother} แต่ก่อนกลับ เขาจุดเทียนไว้ให้เล่มหนึ่งที่หัวนอน
  choices:
    - id: call_mother
      label: เรียกแม่
      text: |
        คำนั้นออกมาเหมือนตอนยังเล็ก {mother}ก้มลงมาจนหน้าผากชนกัน บอกว่าอยู่นี่ แม่อยู่นี่ พูดซ้ำอยู่อย่างนั้นเหมือนกล่อม มือลูบผมที่เปียกเหงื่อไปข้างหลังทีละปอย

        {name}หลับไปทั้งที่ยังได้ยินคำนั้น เทียนที่หัวนอนไหม้ไปจนถึงโคนตอนฟ้าสาง {mother}ยังพูดคำเดิมอยู่ พูดกับหน้าผากที่ไม่ร้อนแล้ว
      effects:
        epitaph: จากไปตอนอายุยังน้อย หน้าผากแนบหน้าผากแม่
    - id: not_your_fault
      label: บอกแม่ว่าไม่ใช่ความผิดของใคร
      text: |
        {mother}หยุดไล่ชื่อ มองหน้าลูก แล้วบอกว่าเด็กอายุเท่านี้ไม่ต้องมาปลอบแม่ ให้เก็บแรงไว้หายใจ {name}บอกอีกรอบ ช้าๆ ทีละคำ ว่าไม่ใช่ความผิดของใคร แม่ด้วย

        นางไม่ได้ตอบ บิดผ้าผืนใหม่มาวางให้ มือสั่นจนน้ำหยดลงบนเปลือกตาของ{name} นั่นเป็นอย่างสุดท้ายที่{name}รู้สึก หลายปีหลังจากนั้น{mother}ยังไล่ชื่อคนพวกนั้นอยู่ในคำสวดทุกคืน แต่ไม่มีชื่อตัวเองอยู่ในนั้นอีก
      effects:
        epitaph: จากไปหลังบอกแม่ว่าไม่ใช่ความผิดของใคร
    - id: pretend_sleep
      label: ทำเป็นหลับ ให้แม่ได้พักบ้าง
      text: |
        {name}หลับตา หายใจให้ยาวและเสมอที่สุดเท่าที่ทำได้ ทั้งที่แต่ละครั้งเหมือนมีใครเอาเข่ากดอก ครู่ใหญ่{mother}จึงเชื่อ นางเอนหลังพิงผนัง หลับไปทันทีทั้งที่ผ้ายังอยู่ในมือ

        {name}ลืมตาขึ้นมองแม่หลับ เปลวเทียนทำให้เงาของนางบนผนังใหญ่กว่าตัวจริงสองเท่า ลมหายใจที่แกล้งทำให้ยาวค่อยๆ สั้นลงเอง เช้าขึ้น{mother}ตื่นมาพบว่าผ้าบนหน้าผากลูกเย็นแล้ว เย็นเท่าน้ำในอ่าง
      effects:
        epitaph: จากไปตอนแกล้งหลับ ให้แม่ได้นอนสักคืน

- id: death.wound_road
  stage: death
  mark: จากไปไกลบ้าน
  scene: healer
  weight: 2
  when:
    dying: [wound]
    told: false
  text: |
    ห้องนี้ไม่ใช่ห้องของ{name}

    เพดานเป็นไม้กระดานคนละแบบกับที่บ้าน ผ้าห่มมีกลิ่นของคนอื่น ข้างเตียงมีอ่างน้ำสีสนิม กับหญิงแก่คนหนึ่งที่{name}ไม่เคยเห็นหน้า นางนั่งปั่นด้ายไปด้วยเฝ้าไปด้วย ไม่ได้มองมาทางเตียงบ่อยนัก เหมือนคนที่เฝ้าแบบนี้มาหลายคนแล้ว

    "ตื่นแล้วรึ" นางว่า มือยังปั่นด้ายอยู่ "หมอบอกว่าคืนนี้ ไม่ก็พรุ่งนี้เช้า อยากให้ไปตามใครไหม"
  choices:
    - id: no_one
      label: บอกว่าไม่ต้องตามใคร
      text: |
        หญิงแก่พยักหน้าเหมือนได้คำตอบนี้บ่อย นางถามชื่อ {name}บอก นางทวนชื่อนั้นสองรอบให้แน่ใจว่าออกเสียงถูก จะได้บอกสัปเหร่อถูก คนที่ตายในห้องนี้โดยไม่มีชื่อมีมาแล้วสามคน นางต้องตั้งให้เองทุกคน

        กงล้อปั่นด้ายหมุนต่อไปทั้งคืน เสียงของมันเสมอกันจน{name}หลับ เช้าขึ้นหญิงแก่ตัดด้ายที่ปั่นได้คืนนั้นออกมาท่อนหนึ่ง ผูกไว้ที่ข้อมือของ{name}ก่อนสัปเหร่อจะมา ป้ายไม้บนหลุมสะกดชื่อถูกทุกตัว
      effects:
        epitaph: จากไปในห้องของคนแปลกหน้า แต่ป้ายบนหลุมสะกดชื่อถูก
    - id: send_word
      label: ฝากข้อความถึงบ้าน
      text: |
        นางวางด้าย บอกว่าเขียนหนังสือไม่เป็น แต่จำเก่ง ให้พูดมา {name}พูดได้สามประโยค ประโยคแรกบอกว่าอยู่ที่ไหน ประโยคที่สองบอกว่าไม่ต้องมา ประโยคที่สามยาวกว่าสองประโยคแรกรวมกัน

        หญิงแก่ทวนให้ฟังครบทุกคำ ไม่ตกสักคำ {name}พยักหน้า แล้วไม่ได้พูดอะไรอีก สิบวันต่อมานางเดินทางไปถึงประตูบานนั้นด้วยตัวเอง ยืนอยู่ข้างหน้า แล้วพูดสามประโยคนั้นด้วยน้ำเสียงเดียวกับที่ได้ฟังมา
      effects:
        epitaph: จากไปไกลบ้าน ฝากไว้สามประโยค
    - id: ask_her_name
      label: ถามชื่อของนาง
      text: |
        นางหยุดมือเป็นครั้งแรก บอกว่าไม่มีใครถามมานานแล้ว คนที่นอนเตียงนี้ส่วนมากถามหาหมอ ถามหาแม่ ไม่ก็ถามว่าตัวเองจะรอดไหม นางบอกชื่อ เป็นชื่อเก่าแบบที่ไม่มีใครตั้งให้ลูกแล้ว

        {name}เรียกชื่อนั้นหนึ่งครั้ง แล้วขอบใจ นางว่ายังไม่ได้ทำอะไรให้เลย {name}ไม่ได้ตอบ เพราะหลับไปแล้ว หญิงแก่ปั่นด้ายต่อจนสว่าง พอสัปเหร่อมาถามว่าคนตายเป็นใคร นางตอบว่า คนที่ถามชื่อข้า
      effects:
        epitaph: จากไปหลังถามชื่อคนที่นั่งเฝ้า

# ----- คนแก่ที่ร่างไม่ฟื้นแล้ว (ล้ม ไข้ หรือแผลเล็กที่ไม่หาย) น้ำหนักสูงกว่าฉากไกลบ้าน -----

- id: death.wound_old_child
  stage: death
  mark: ล้มลงแล้วไม่ได้ลุกอีก
  scene: home
  weight: 30
  cast:
    kid: { kin: [child], min_age: 16 }
  when:
    dying: [wound]
    told: false
    age: [60, 130]
  text: |
    {kid}ย้ายเข้ามาอยู่ด้วยตั้งแต่วันที่{name}ลุกเองไม่ได้ เอาที่นอนมาปูไว้ข้างเตียง ตื่นทุกครั้งที่ได้ยินเสียงขยับ

    หลายวันมานี้{name}หลับมากกว่าตื่น ตื่นขึ้นมาแต่ละครั้งต้องถามว่าตอนนี้เช้าหรือเย็น {kid}ตอบทุกครั้ง ไม่เคยบอกว่าเพิ่งถามไป

    ครั้งนี้ตื่นมากลางดึก หัวโล่งกว่าทุกวัน เห็นทุกอย่างในห้องชัด {kid}นั่งอยู่บนที่นอนข้างล่าง กอดเข่า ยังไม่หลับ
  choices:
    - id: come_up
      label: บอกให้ขึ้นมานอนบนเตียงด้วยกัน เหมือนคืนที่ฝันร้ายตอนยังเล็ก
      text: |
        {kid}ตัวใหญ่เกินเตียงนี้ไปนานแล้ว ต้องนอนตะแคง ขาห้อยออกไปครึ่งแข้ง {name}เอามือวางบนหัว{kid:เขา|เธอ} ผมหยาบกว่าตอนเด็ก มีเส้นขาวแซมแล้วด้วย

        มือนั้นค้างอยู่บนหัวจนเช้า {kid}ไม่ได้ขยับออก ทั้งที่รู้ตั้งแต่ก่อนฟ้าสางว่ามือไม่อุ่นแล้ว
      effects:
        epitaph: จากไปโดยมือยังวางอยู่บนหัวลูก
    - id: ask_if_afraid
      label: "ถาม{kid}ว่ากลัวไหม"
      text: |
        {kid}ตอบว่ากลัว ตอบทันที ไม่ได้ทำเป็นเข้มแข็ง {name}บอกว่าไม่ต้องกลัวแทนกัน คนที่นอนอยู่บนเตียงไม่ได้กลัว แค่เหนื่อย {kid}ถามว่าเหนื่อยมากไหม {name}ว่าเหนื่อยแบบวันที่ทำงานเสร็จ

        {kid:เขา|เธอ}พยักหน้า เอาหน้าผากมาวางบนขอบเตียง {name}หลับไปก่อน เหมือนทุกคืนสมัยที่{kid}ยังเล็กและเป็นฝ่ายถูกกล่อม คืนนี้สลับกัน
      effects:
        epitaph: จากไปแบบคนที่ทำงานของวันนั้นเสร็จแล้ว
    - id: send_home
      label: ไล่ให้กลับไปดูบ้านตัวเองบ้าง
      text: |
        {kid}ไม่ไป บอกว่าบ้านไม่หนีไปไหน {name}ว่าคนแก่ก็ไม่หนีไปไหนเหมือนกัน {kid}หัวเราะทั้งที่ตาแดง บอกว่าคนแก่คนนี้หนีเก่งจะตาย ตั้งแต่จำความได้ก็หนีงานเลี้ยง หนีหมอ หนีคนมาทวงของ

        เช้ามา{name}ก็หนีไปได้จริงๆ ตอนที่{kid}ลุกไปต้มน้ำ
      effects:
        epitaph: จากไปตอนลูกลุกไปต้มน้ำ

- id: death.wound_old_alone
  stage: death
  mark: ล้มลงแล้วไม่ได้ลุกอีก
  scene: home
  weight: 24
  when:
    dying: [wound]
    told: false
    age: [60, 130]
  text: |
    ร่างของคนอายุเท่านี้ไม่ซ่อมตัวเองแล้ว เรื่องที่คนหนุ่มนอนพักสามวันก็ลุก {name}นอนมาครึ่งเดือน และแย่ลงทุกเช้า

    เพื่อนบ้านผลัดกันมาเฝ้าวันละบ้าน ไม่มีใครนัดกัน แต่ก็ไม่เคยว่างสักวัน คืนนี้เป็นเวรของหญิงบ้านตรงข้าม นางเอางานเย็บมานั่งทำข้างเตียง เข็มขึ้นลงเป็นจังหวะเดียวกับที่{name}หายใจ

    หมอบอกนางไว้ตั้งแต่บ่ายว่าคืนนี้ นางยังไม่ได้บอก{name} แต่เย็บช้าลงกว่าทุกคืน
  choices:
    - id: ask_what_she_sews
      label: ถามนางว่าเย็บอะไร
      text: |
        เสื้อของลูกชายคนเล็ก ขาดที่ศอกเป็นครั้งที่สามของเดือน นางบ่นเรื่องลูกไปเย็บไป เรื่องศอกเสื้อ เรื่องปีนรั้ว เรื่องที่เด็กคนนี้กินเท่าผู้ใหญ่สองคนแล้วยังผอม

        {name}หลับไประหว่างเรื่องที่สาม นางเย็บจนเสร็จ กัดด้ายขาด พับเสื้อ แล้วจึงเอื้อมมือมาปิดตาให้
      effects:
        epitaph: จากไประหว่างฟังเรื่องเสื้อที่ขาดตรงศอก
    - id: tell_her_to_go
      label: บอกนางว่ากลับไปนอนเถอะ รู้แล้วว่าคืนนี้
      text: |
        นางวางเข็ม ถามว่ารู้ได้อย่างไร {name}ว่าคนเราจะเย็บช้าขนาดนั้นก็ต่อเมื่อไม่อยากให้เสร็จ

        นางไม่กลับ ขยับเก้าอี้เข้ามาชิดเตียง เลิกเย็บ แล้วจับมือ{name}ไว้แทน ปลายนิ้วของนางมีรอยเข็มตำเป็นจุดแข็งๆ ทุกนิ้ว {name}นับรอยพวกนั้นได้ไม่ครบ
      effects:
        epitaph: จากไปโดยมีเพื่อนบ้านจับมือ คนที่ไม่ยอมกลับไปนอน
    - id: give_things_out
      label: ฝากนางเอาของในบ้านแจกคนที่มาเฝ้า บ้านละอย่าง
      text: |
        หม้อใบใหญ่ให้บ้านที่มีลูกห้าคน ผ้าห่มผืนหนาให้ตาแก่หัวมุม เก้าอี้ตัวนี้ให้นางเอง เพราะนั่งมาหลายคืนจนรู้แล้วว่าขาไหนโยก {name}ไล่ให้ฟังทีละบ้าน นางทวนตามทุกอย่าง

        เช้ามาทุกบ้านได้ของตามนั้น ไม่มีใครเถียงว่าใครควรได้อะไร
      effects:
        epitaph: จากไปหลังแจกของครบทุกบ้านที่มาเฝ้า

# ===================== การปะทะ (พลังชีวิตหมดระหว่างสู้) =====================

- id: death.fight_field
  stage: death
  mark: ล้มในการต่อสู้
  weight: 6
  when:
    dying: [fight]
    told: false
  text: |
    {name}นอนหงายอยู่ตรงที่ล้ม

    ฟ้าข้างบนกว้างกว่าที่เคยสังเกต ของที่เพิ่งสู้กันเมื่อครู่ไปแล้วหรือยังอยู่ {name}ไม่รู้ และยกหัวขึ้นดูไม่ได้ เสียงรอบตัวเบาลงเรื่อยๆ เหมือนมีคนค่อยๆ ปิดประตูทีละบาน

    มือขวายังกำอยู่ แต่ในมือไม่มีอะไรแล้ว พื้นใต้หลังอุ่นและเปียก ความเจ็บที่ควรจะมียังมาไม่ถึง
  choices:
    - id: look_at_sky
      label: มองฟ้า
      text: |
        เมฆก้อนหนึ่งเลื่อนผ่านไปช้าๆ รูปร่างไม่เหมือนอะไรเลย {name}พยายามนึกให้มันเหมือนอะไรสักอย่างแบบที่เคยทำตอนเด็ก นึกไม่ออก มันเป็นแค่เมฆ

        หลังเมฆก้อนนั้นฟ้าเป็นสีเดิมกับทุกวัน คนที่มาพบศพเล่าว่าตาของคนตายยังเปิดอยู่ มองตรงขึ้นไป เขาเงยหน้ามองตามอยู่ครู่หนึ่ง ไม่เห็นมีอะไร จึงเอื้อมมือไปปิดตาให้
      effects:
        epitaph: จากไปตรงที่ล้ม ตายังมองฟ้า
    - id: crawl_home
      label: พยายามคลานกลับไปทางที่มา
      text: |
        {name}พลิกตัวคว่ำได้ในครั้งที่สาม เล็บจิกพื้นลากตัวไปข้างหน้าได้ทีละคืบ ทุกคืบต้องหยุดหายใจ ทางที่เดินมาตอนขามาใช้เวลาไม่กี่อึดใจ ขากลับมันยาวออกไปเรื่อยๆ

        รอยลากบนพื้นยาวสิบสองก้าว คนที่มาพบวัดดูทีหลัง ปลายรอยนั้นหันไปทางบ้าน
      effects:
        epitaph: จากไปหลังคลานได้สิบสองก้าว ไปทางบ้าน
    - id: open_the_hand
      label: คลายมือที่กำอยู่
      text: |
        นิ้วไม่ยอมคลายเอง {name}ต้องสั่งทีละนิ้ว นิ้วก้อยก่อน แล้วนิ้วนาง นิ้วกลาง นิ้วชี้ นิ้วโป้งเป็นนิ้วสุดท้าย พอฝ่ามือหงายออกรับอากาศ ไหล่ทั้งสองข้างก็ทิ้งลงกับพื้นตามไปด้วย

        ลมพัดผ่านฝ่ามือนั้น เย็น {name}หลับตา คนที่มาพบบอกว่าไม่เคยเห็นคนตายจากการสู้กันที่หน้าตาไม่ได้โกรธใครแบบนี้
      effects:
        epitaph: จากไปหลังคลายมือ ไม่ได้กำอะไรติดไปด้วย

- id: death.fight_warrior
  stage: death
  mark: ล้มในหน้าที่
  weight: 22
  when:
    dying: [fight]
    told: false
    class: warrior
  text: |
    คนที่ลาก{name}ออกมาจากตรงนั้นคือเด็กใหม่ คนที่{name}ด่าเมื่อเช้าเรื่องผูกสายรัดเกราะผิด

    เขาวาง{name}ลงตรงที่พื้นแห้ง มือสองข้างกดแผลไว้แน่นเกินไปและผิดที่ {name}บอกเขาไม่ได้เพราะในปากมีแต่รสเหล็ก อาวุธของ{name}ยังอยู่ตรงที่ทำหล่น ห่างออกไปสิบก้าว ใบของมันสะท้อนแสง

    "อย่าเพิ่งหลับนะ" เด็กคนนั้นพูดซ้ำๆ "อย่าเพิ่งหลับ เขาว่ากันว่าถ้าหลับคือจบ"
  choices:
    - id: fix_his_strap
      label: ชี้สายรัดเกราะของเขาที่ยังผูกผิดอยู่
      text: |
        นิ้วของ{name}ยกขึ้นได้แค่คืบเดียว แต่เด็กคนนั้นมองตาม เห็นปมที่ไหล่ซ้ายของตัวเอง ปมเดียวกับที่โดนด่าเมื่อเช้า เขาปล่อยมือข้างหนึ่งจากแผลมาแก้ปม ผูกใหม่ ดึงจนแน่น แล้วหันมาดูว่าถูกหรือยัง

        {name}พยักหน้าทีเดียว เป็นอย่างสุดท้ายที่ทำ เด็กคนนั้นจับอาวุธต่อมาอีกยี่สิบปี ไม่เคยผูกสายรัดผิดอีก และด่าเด็กใหม่ทุกคนที่ผูกผิด ด้วยคำเดียวกับที่ตัวเองเคยโดน
      effects:
        epitaph: จากไปหลังสอนเด็กใหม่ผูกสายรัดเกราะให้ถูก
    - id: weapon_in_hand
      label: ให้เขาไปเก็บอาวุธมาวางไว้ในมือ
      text: |
        เด็กคนนั้นไม่อยากปล่อยมือจากแผล {name}ต้องมองหน้าเขาจนเขายอม เขาวิ่งไปสิบก้าว วิ่งกลับมาสิบก้าว วางด้ามลงในฝ่ามือ แล้วพับนิ้วของ{name}ให้กำทีละนิ้ว เพราะนิ้วไม่ยอมกำเอง

        น้ำหนักในมือเท่าเดิมกับวันแรกที่ได้ถือ {name}หลับตาได้โดยไม่มีใครห้าม ตอนคนมาเก็บศพ ไม่มีใครแกะด้ามนั้นออกจากมือได้ เขาฝังไปด้วยกันทั้งอย่างนั้น
      effects:
        epitaph: จากไปโดยอาวุธยังอยู่ในมือ
    - id: send_him_back
      label: ไล่เขากลับไปเข้าแถว
      text: |
        คำที่ออกมามีแต่ลมกับเลือด แต่เด็กคนนั้นเข้าใจ เขาส่ายหน้า บอกว่าไม่ไป {name}รวบรวมแรงที่เหลือทั้งหมดด่าเขาด้วยคำที่หยาบที่สุดเท่าที่รู้จัก เขาร้องไห้ แล้วลุก วิ่งกลับไปทางเสียงตะโกน

        {name}มองหลังเขาจนลับ สายรัดยังผูกผิดอยู่ข้างหนึ่ง วิ่งเหมือนคนไม่เคยวิ่ง แต่วิ่งไปถูกทาง หลังจากนั้นก็ไม่มีอะไรให้ต้องมองอีก
      effects:
        epitaph: จากไปหลังไล่เด็กใหม่กลับไปเข้าแถว

# ===================== ความตายที่เล่าไปแล้ว: ชั่วอึดใจสุดท้าย =====================

- id: death.last_wound
  stage: death
  mark: ลมหายใจสุดท้าย
  weight: 10
  when:
    dying: [wound]
    told: true
  text: |
    ก่อนหน้านั้นชั่วอึดใจ ตอนที่ทุกอย่างยังไม่ดับ มีช่วงหนึ่งที่ยาวกว่าที่ควร

    ไม่เจ็บ ไม่หนาว ไม่มีเสียง {name}รู้ว่าเกิดอะไรขึ้นกับตัวเอง รู้เท่ากับที่รู้ว่าฝนกำลังจะตกจากกลิ่นของลม ในช่วงนั้นมีของอย่างเดียวที่ยังขยับได้ คือความคิด และมันเลือกเองว่าจะไปที่ไหน
  choices:
    - id: the_door
      label: ประตูบ้านที่โตมา
      text: |
        บานประตูนั้นฝืดตรงบานพับล่าง ต้องยกขึ้นนิดหนึ่งตอนผลัก ใครไม่รู้จะผลักไม่ออก {name}รู้มาตั้งแต่ตัวยังสูงไม่ถึงกลอน ในความคิด มือยื่นออกไป ยกนิดหนึ่ง ผลัก

        ข้างในมีกลิ่นของมื้อเย็น มีคนหันมามอง หน้าของคนคนนั้นยังไม่ทันชัด แสงทั้งหมดก็ดับลง
      effects:
        epitaph: สิ่งสุดท้ายที่นึกถึงคือประตูบ้านที่ต้องยกก่อนผลัก
    - id: the_unfinished
      label: งานที่ทำค้างไว้
      text: |
        ของชิ้นนั้นยังวางอยู่ตรงที่วางทิ้งไว้ ทำไปได้ครึ่งเดียว ตั้งใจว่ากลับไปจะทำต่อให้เสร็จ {name}เห็นมันชัดทุกส่วน เห็นแม้แต่ตรงที่ทำพลาดไว้ และรู้ว่าจะแก้อย่างไร

        จะไม่มีใครรู้ว่าต้องแก้ตรงนั้น คนที่มารับช่วงต่อจะมองอยู่นาน แล้วรื้อทำใหม่ทั้งชิ้น ความคิดนี้กวนใจ{name}อยู่จนถึงตอนที่ไม่เหลืออะไรให้กวน
      effects:
        epitaph: สิ่งสุดท้ายที่นึกถึงคืองานที่ยังทำไม่เสร็จ
    - id: nothing
      label: ไม่นึกถึงอะไรเลย
      text: |
        {name}ปล่อยให้ช่วงนั้นว่างไว้ ไม่เรียกหน้าใครขึ้นมา ไม่ทวนเรื่องไหน ความคิดที่วิ่งวุ่นมาทั้งชีวิตหยุดอยู่กับที่เป็นครั้งแรก เหมือนน้ำในอ่างที่ไม่มีใครแตะ

        ในความนิ่งนั้นมีเสียงหนึ่งดังขึ้นมาเอง เป็นเสียงหายใจของตัวเอง เข้าครั้งหนึ่ง ออกครั้งหนึ่ง {name}ฟังมันเหมือนฟังของคนอื่น แล้วมันก็ไม่เข้าอีก
      effects:
        epitaph: จากไปโดยไม่ได้นึกถึงอะไร นอกจากลมหายใจของตัวเอง

- id: death.last_fight
  stage: death
  mark: ล้มในการต่อสู้
  weight: 10
  when:
    dying: [fight]
    told: true
  text: |
    ก่อนหน้านั้นชั่วอึดใจ ตอนที่ยังไม่ล้ม {name}เห็นทุกอย่างช้าลง

    ของที่พุ่งเข้ามาช้าลง เสียงช้าลง ฝุ่นที่ลอยอยู่ในอากาศนิ่งจนนับได้ทีละเม็ด ร่างกายรู้ก่อนหัวแล้วว่าหลบไม่ทัน ในช่วงที่เหลืออยู่นั้น มีเวลาพอให้ทำได้อีกอย่างเดียว
  choices:
    - id: eyes_open
      label: ลืมตาไว้ ดูให้เห็นจนจบ
      text: |
        {name}ไม่หลับตา ไม่หันหน้าหนี มองสิ่งที่กำลังมาถึงเหมือนมองคนที่เดินเข้ามาทัก เห็นทุกส่วนของมัน เห็นแม้แต่รายละเอียดที่ไม่มีประโยชน์อะไรแล้ว

        คนที่ล้มทั้งที่ตายังเปิดมีไม่มาก คนที่มาพบทีหลังเล่าเรื่องนี้ต่อกันไปอีกหลายปี ว่าบนหน้าของคนตายไม่มีความตกใจอยู่เลย
      effects:
        epitaph: ล้มทั้งที่ตายังเปิด
    - id: step_in
      label: ก้าวเข้าไปอีกก้าว แทนที่จะถอย
      text: |
        เท้าซ้ายขยับไปข้างหน้าได้ครึ่งก้าว ไม่ได้เปลี่ยนผลอะไร แต่ตอนล้ม ร่างของ{name}ล้มไปข้างหน้า

        คนที่ตายเพราะหนีกับคนที่ตายเพราะเดินเข้าหา แผลอยู่คนละด้าน คนเก็บศพดูออก เขาบอกเรื่องนี้กับคนที่มารับศพ โดยไม่มีใครถาม
      effects:
        epitaph: ล้มไปข้างหน้า แผลอยู่ด้านหน้า
    - id: call_a_name
      label: เรียกชื่อใครสักคน
      text: |
        ชื่อนั้นออกมาเองโดยไม่ได้เลือก {name}ได้ยินเสียงตัวเองเรียก แล้วจึงรู้ว่าเป็นชื่อของใคร ไม่ใช่คนที่คิดว่าจะเรียก

        คนคนนั้นอยู่ไกลเกินจะได้ยิน คืนนั้นคนคนนั้นสะดุ้งตื่นขึ้นมากลางดึกโดยไม่รู้สาเหตุ นั่งอยู่บนเตียงพักใหญ่ แล้วลุกไปดูว่าประตูลงกลอนหรือยัง
      effects:
        epitaph: คำสุดท้ายคือชื่อของคนที่ไม่ได้อยู่ตรงนั้น

- id: death.last_sacrifice
  stage: death
  mark: ไม่ถอย
  weight: 10
  when:
    dying: [sacrifice]
    told: true
  text: |
    ก่อนหน้านั้นชั่วอึดใจ ตอนที่ยังถอยได้ {name}รู้แล้วว่าจะไม่ถอย

    ไม่ได้ตัดสินใจ เหมือนมีใครตัดสินไว้ให้นานแล้ว ตั้งแต่ก่อนวันนี้ ก่อนปีนี้ {name}เพิ่งมาถึงตรงที่ต้องทำตามนั้น ขาไปก่อน มือไปก่อน ความกลัวตามมาถึงทีหลัง ตอนที่ไม่มีอะไรให้มันเปลี่ยนได้แล้ว
  choices:
    - id: who_hears_first
      label: นึกถึงคนที่จะได้ยินข่าวนี้เป็นคนแรก
      text: |
        หน้าของคนคนนั้นขึ้นมาเอง ทั้งที่ไม่ได้เรียก {name}เห็นตอนที่ข่าวไปถึง เห็นมือที่กำลังทำอะไรสักอย่างค้างอยู่ เห็นว่าคนคนนั้นจะนั่งลงก่อน แล้วค่อยถามว่าเกิดขึ้นอย่างไร

        คนส่งข่าวจะตอบได้ไม่หมด เขาไม่ได้อยู่ตรงนี้ เขาจะเล่าได้แค่ว่ามีทางให้ถอย และ{name}ไม่ได้ถอย คนฟังจะพยักหน้า เหมือนได้ยินเรื่องที่รู้อยู่แล้ว
      effects:
        epitaph: มีทางให้ถอย แล้วไม่ได้ถอย
    - id: count_regrets
      label: นับดูว่าเสียดายอะไรบ้าง
      text: |
        นับได้สามอย่าง อย่างแรกเป็นเรื่องเล็กจนน่าขำ ของกินอย่างหนึ่งที่ตั้งใจว่าปีนี้จะลอง อย่างที่สองคือคำพูดที่ค้างไว้กับคนคนหนึ่ง อย่างที่สามนึกไม่ออกว่าคืออะไร รู้แต่ว่ามี

        สามอย่างรวมกันแล้วยังเบากว่าของที่วางอยู่อีกข้างของตาชั่ง {name}หยุดนับแค่นั้น
      effects:
        epitaph: เสียดายอยู่สามอย่าง แล้วก็ทำอยู่ดี
    - id: swear
      label: สบถ
      text: |
        คำที่หลุดออกมาเป็นคำที่แม่ชีได้ยินต้องเอามือปิดหู ยาวสามพยางค์ ลงท้ายด้วยชื่อเทพองค์หนึ่ง {name}พูดเต็มเสียง ไม่ได้พูดกับใคร

        ถ้ามีเทพองค์ไหนฟังอยู่ ท่านคงได้ยินคำแบบนี้มามากแล้ว จากคนที่ทำอย่างเดียวกัน และไม่เคยถือ
      effects:
        epitaph: จากไปทั้งที่ปากยังสบถ
