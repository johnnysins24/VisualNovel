# ชุด ม เมือง: หอนับดาว (star_hall ถิ่น ileth) แปดเรื่องตามแบบ "แปดเรื่องของหนึ่งเมือง"
# ย่าน: root_camp ลานโคนต้น (คนมาใหม่ลงที่นี่ เป็นของคนนอก) · letter_boughs กิ่งจดหมาย · count_deck ชานนับ (ปีนขึ้นครึ่งคืน)
# หน้าเดิมของเมือง: ผู้คุมหอที่ตากำลังบอด (ไม่มีชื่อ) กับลาเธีย ผู้เขียนจดหมายประจำปี
# เอลฟ์ไม่ขายกิ่ง คนนอกซื้อได้แค่เรือนบนลานโคนต้น ไม้ทุกชิ้นของหอต้องเป็นไม้ที่ป่าทิ้งลงมาเอง
# จลาจลที่นี่คือค่ายไฟไหม้กับขวานที่ราก ห้ามเปิดเรื่องตัวเลขดาวสองชุด (ความลับของสำนักดาราศาสตร์)

# ---------- a ข้อเสนอให้ย้าย: แผ่นเปลือกไม้ที่ลานตะกร้า ----------
- id: adult.city_star_hall_offer
  stage: adult
  weight: 12
  scene: market
  when:
    age: [19, 56]
    location_tag: ileth
    city: none
    not_flags: [institute_student, left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter]
    # คนของไส้ตะเกียงกับคนในสายงานของอาณาจักรไม่ย้ายเมืองไปหางาน (ชุด อ)
    not_orgs: [wick, crown_office, crown_army, crown_court]
  text: |
    ทุกต้นฤดูลม หอนับดาวส่งแผ่นเปลือกไม้ลงมาตามหมู่บ้าน ถึงลานตะกร้าที่คนบนกิ่งกับคนบนดินแลกของกัน แผ่นเปลือกไม้เป็นรายการของที่หอต้องการปีนี้ ใครอ่านออกก็อ่านให้คนอื่นฟัง เกลือ น้ำมันตะเกียง ด้าย เชือกป่าน แล้วก็คน ปีนี้บรรทัดคนยาวกว่าทุกปี คนแบกตะกร้าขึ้นชาน คนผูกเชือก คนต้มข้าวให้คนนับในฤดูฟ้าเปิด คนคัดจดหมายที่อ่านอักษรเก่าออก

    ตะกร้าใบที่พาแผ่นเปลือกไม้ลงมามีถั่วอบแห้งอยู่ก้นตะกร้าหนึ่งกำ เป็นของคนที่อ่าน ปีนี้{name}เป็นคนอ่าน คนรอบลานฟังจนจบแล้วแยกย้าย บางคนเดินไปตามบรรทัดที่ตัวเองทำได้ในใจ บางคนหัวเราะ บอกว่าคนที่ขึ้นไปอยู่ใต้หอไม่ค่อยลงมา

    ท้ายแผ่นเขียนไว้ว่าใครรับงาน ให้ขึ้นไปลงชื่อที่ลานโคนต้นก่อนเดือนเต็มดวง
  choices:
    - id: carry_baskets_up
      label: รับงานแบกตะกร้าขึ้นชาน แล้วเดินไปลงชื่อที่ลานโคนต้น
      check: { stat: STR, dc: 13 }
      success:
        text: |
          ลานโคนต้นอยู่ระหว่างรากของต้นหอ รากแต่ละรากสูงกว่าหลังคาเรือน คนนอกสร้างเรือนไว้ในซอกราก ผนังเรือนพิงราก หลังคาอยู่ใต้ร่มใบที่สูงจนมองไม่เห็นกิ่ง {name}ได้ที่นอนในเรือนรวมของคนแบก ห้องยาวที่มีฟูกเรียงสิบสองผืน

          คืนแรกคนแบกรุ่นเก่าพาขึ้นไปลองครึ่งทาง ตะกร้าเกลือบนหลัง{name}ไม่ได้หนักที่สุดในแถว แต่{name}ขึ้นถึงชั้นที่สามโดยไม่หยุดพัก คนแบกที่อยู่มาก่อนผูกเชือกสีแดงไว้ที่สายตะกร้าของ{name} สีเดียวกับเชือกที่สายตะกร้าของเขาเอง
        effects: { stats: { STR: 1 }, city: { move: star_hall, district: root_camp, home: room }, mark: ย้ายไปหอนับดาว, flags: [moved_to_star_hall, hauled_baskets_for_the_hall] }
      failure:
        text: |
          คืนแรกคนแบกรุ่นเก่าพาขึ้นไปลองครึ่งทาง ถึงชั้นที่สองขาของ{name}เริ่มสั่น ตะกร้าเกลือดึงไหล่ไปทางหนึ่ง {name}ไถลลงบันไดเชือกไปสามขั้นก่อนมือจะจับได้ เกลือไม่หก แต่ฝ่ามือถลอกเป็นทางทั้งสองข้าง

          คนแบกที่อยู่มาก่อนให้{name}หาบน้ำในลานโคนต้นไปก่อนจนกว่ามือจะหาย ที่นอนในเรือนรวมของคนแบกยังเป็นของ{name} ฟูกผืนที่สิบสอง ติดประตู
        effects: { hp: -1, city: { move: star_hall, district: root_camp, home: room }, mark: ย้ายไปหอนับดาว, flags: [moved_to_star_hall, hauled_baskets_for_the_hall] }
    - id: copy_on_the_letter_boughs
      label: ขึ้นไปขอที่นั่งคัดจดหมายบนกิ่งจดหมาย
      requires: { flag: race_elf }
      text: |
        กิ่งจดหมายเป็นกิ่งใหญ่สามกิ่งทางทิศตะวันตกของต้นหอ เรือนคัดสร้างด้วยไม้ร่วงทั้งหลัง ผนังบางจนลมผ่านได้ กระดาษทุกแผ่นบนโต๊ะต้องมีหินแม่น้ำทับไว้ คนคัดรุ่นเก่าให้{name}คัดอักษรเก่าลงแผ่นเปลือกไม้บรรทัดเดียว แล้วเอาไปส่องกับแสงที่ลอดใบลงมา ดูว่าเส้นหนาบางตรงที่ควรหนาบางไหม

        เอลฟ์ไม่ขายกิ่ง ที่นั่งบนกิ่งจดหมายจึงไม่มีราคา มีแต่คำถามว่าจะอยู่นานแค่ไหน {name}ตอบว่ายังไม่รู้ คนคัดรุ่นเก่าเอาหินแม่น้ำก้อนหนึ่งมาวางไว้หน้าที่นั่งว่างข้างหน้าต่าง
      effects: { city: { move: star_hall, district: letter_boughs, home: room }, mark: ย้ายไปหอนับดาว, flags: [moved_to_star_hall, copies_on_the_letter_boughs] }
    - id: stay_below
      label: แบ่งถั่วในก้นตะกร้าให้เด็กที่ยืนฟัง แล้วอยู่ที่หมู่บ้านต่อ
      text: |
        เด็กรับถั่วไปคนละสามสี่เม็ด แผ่นเปลือกไม้ขึ้นตะกร้ากลับไปกับของแลกอื่นตอนบ่าย {name}ยืนดูเชือกดึงตะกร้าขึ้นไปจนหายเข้าไปในใบ

        ต้นฤดูลมปีต่อมา แผ่นเปลือกไม้ลงมาอีก บรรทัดคนยาวขึ้นกว่าปีก่อนอีกสองบรรทัด คนที่อ่านเป็นเด็กคนหนึ่งที่เคยรับถั่วจาก{name}
      effects: { flags: [stayed_below_the_hall] }

# ---------- b ย่าน: ลานโคนต้น ----------
- id: adult.city_star_hall_blue_lamp
  stage: adult
  weight: 33
  when:
    age: [19, 64]
    city: star_hall
  text: |
    กฎของลานโคนต้นมีข้อเดียวที่คนนอกต้องจำ คืนไหนฟ้าเปิด ไฟทุกดวงบนลานต้องมีฝาครอบ เตาต้องปิดฝา ตะเกียงต้องคลุมผ้า แสงจากข้างล่างลอยขึ้นไปถึงชานได้ คนนับที่นั่งหลังกรอบไม้ไผ่จะเห็นดาวดวงเล็กไม่ครบ กฎข้อนี้สลักไว้บนรากใหญ่ที่ทางเข้าลาน สามภาษา

    พ่อค้าจากเวนทราสคนหนึ่งขึ้นมากับเกวียนเมื่อบ่าย มาซื้อเชือกเปลือกไม้กับน้ำผึ้งป่า หน้าเรือนพักที่เขาเช่ามีตะเกียงน้ำค้างดาวแขวนอยู่ดวงหนึ่ง แสงสีฟ้าเย็นสว่างกว่าไฟทุกดวงบนลานรวมกัน เขาไม่รู้จักกฎ หรือรู้แล้วไม่ถือ คืนนี้ฟ้าเปิดตั้งแต่หัวค่ำ

    ข้างบนมีเสียงเพลงนับลอยลงมาแผ่วๆ แล้วเงียบไปกลางท่อน คนในลานโคนต้นเงยหน้าพร้อมกัน แล้วหันไปทางตะเกียงดวงนั้น
  choices:
    - id: talk_him_round
      label: ไปนั่งคุยกับพ่อค้าหน้าเรือนพัก จนเขายอมคลุมตะเกียงเอง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ไม่ได้เริ่มจากกฎ เริ่มจากถามราคาน้ำผึ้ง แล้วถามว่าเขาเคยขึ้นชานหรือยัง เขาไม่เคย {name}เล่าว่าข้างบนนั่งกันเจ็ดชั้น ทุกคนนับดาวช่องเดียวไปทั้งชีวิต และคืนนี้ทั้งเจ็ดชั้นกำลังนับดาวที่หายไปเพราะตะเกียงของเขา พ่อค้าหัวเราะครั้งหนึ่ง แล้วเงยหน้าขึ้นหากิ่งที่มืดสนิท

          เขาถอดผ้าพันคอคลุมตะเกียงเอง ไม่ถึงอึดใจเพลงนับก็ลอยลงมาใหม่ เช้าวันต่อมาเขาซื้อเชือกเปลือกไม้มากกว่าที่ตั้งใจไว้สองขด
        effects: { stats: { CHA: 1 }, city: { merit: 1 }, flags: [talked_down_the_blue_lamp] }
      failure:
        text: |
          พ่อค้าฟัง{name}จนจบ แล้วบอกว่าเขาจ่ายค่าเรือนแล้ว ตะเกียงเป็นของเขา {name}เอื้อมไปจับผ้าคลุม ลูกจ้างของเขาผลัก{name}ตกจากชานเรือน ศอกกระแทกรากไม้

          ตะเกียงสีฟ้าส่องอยู่ทั้งคืน เพลงนับไม่กลับมา ตอนสางมีคนเห็นว่าเชือกที่แขวนตะเกียงขาด ตะเกียงตกแตกอยู่บนราก น้ำค้างดาวซึมลงดินเป็นวงสีฟ้าจางๆ ไม่มีใครบอกว่าใครตัด
        effects: { hp: -1, flags: [could_not_dim_the_blue_lamp] }
    - id: read_him_the_root
      label: พาพ่อค้าเดินไปอ่านกฎบนรากใหญ่ บรรทัดที่เป็นภาษาของเขาเอง
      requires: { city: { district: [root_camp] } }
      text: |
        คนลานโคนต้นรู้ว่ากฎบนรากสลักไว้สามภาษา บรรทัดล่างสุดเป็นภาษาอาร์เวล ร่องตื้นที่สุดเพราะสลักทีหลัง {name}พาพ่อค้าเดินไปถึงรากใหญ่ในความมืด ยื่นตะเกียงสีฟ้าของเขาเองให้เขาถือส่องอ่าน

        ใต้บรรทัดภาษาอาร์เวลมีชื่อคนสลักไว้ ชื่อพ่อค้าจากเวนทราสอีกคนที่เคยแขวนตะเกียงแบบเดียวกันเมื่อหลายปีก่อน ข้างชื่อมีขีดสั้นๆ เรียงกันแทนจำนวนคืนที่คนนับเสียไป พ่อค้าอ่านจบ ดับตะเกียงตรงนั้น แล้วเดินกลับเรือนพักในความมืด
      effects: { city: { merit: 1 }, flags: [showed_the_trader_the_root_rule] }
    - id: buy_the_lamp
      label: ขอซื้อตะเกียงดวงนั้นจากพ่อค้า
      requires: { min_gold: 2 }
      text: |
        พ่อค้าขายให้สองเหรียญ หัวเราะว่าที่เวนทราสตะเกียงแบบนี้ราคาครึ่งเดียว {name}เอาเสื้อตัวเองคลุมตะเกียงทันทีที่ได้มา เพลงนับข้างบนลอยลงมาใหม่ก่อน{name}จะเดินถึงเรือน

        ตะเกียงสีฟ้าแขวนอยู่ในเรือนของ{name}โดยไม่เคยได้จุดในคืนฟ้าเปิด คืนที่ฟ้าปิด เด็กของลานโคนต้นมานั่งล้อมดูแสงสีฟ้ากันจนดึก
      effects: { gold: -2, flags: [bought_the_blue_lamp] }

# ---------- c ย่าน: ชานนับ ----------
- id: adult.city_star_hall_rope_chair
  stage: adult
  weight: 33
  scene: star_hall
  when:
    age: [19, 64]
    city: star_hall
  text: |
    คืนฟ้าเปิดคืนแรกของฤดู ชานนับต้องพร้อมก่อนตะวันตกดิน คนนับขึ้นกันตั้งแต่บ่าย ปีนบันไดเชือกไปตามลำต้นครึ่งคืน กรอบไม้ไผ่ขึงด้ายเป็นตารางขึ้นตามไปทีหลังในตะกร้า ชานเจ็ดชั้นเรียงลงมาตามลำต้น ชั้นละยี่สิบที่

    เอลฟ์หญิงแก่คนหนึ่งนับช่องของนางมาตั้งแต่ก่อนคนในลานโคนต้นคนไหนจะเกิด ปีนี้ขาของนางขึ้นบันไดเชือกไม่ไหวแล้ว ชานนับมีเก้าอี้เชือกไว้สำหรับคนแบบนี้ ที่นั่งไม้แขวนกับรอกที่ชั้นบนสุด ต้องมีคนดึงเชือกจากชั้นล่างขึ้นไปทีละช่วง ช่วงหนึ่งสูงเท่าเรือนสิบหลังซ้อนกัน

    นางนั่งรออยู่บนเก้าอี้เชือกแล้ว กรอบไม้ไผ่ของนางวางบนตัก ตะวันเหลือไม่ถึงคืบเหนือยอดไม้
  choices:
    - id: haul_the_rope_chair
      label: พันผ้าที่มือ แล้วจับเชือกดึงเก้าอี้ของนางขึ้นไปทีละช่วง
      check: { stat: STR, dc: 13 }
      success:
        text: |
          {name}ดึงเชือกจากชั้นแรกขึ้นไปจนถึงชั้นที่เจ็ด ผ้าพันมือขาดตั้งแต่ช่วงที่สาม เอลฟ์หญิงแก่ไม่ได้ร้องเพลงนับระหว่างทาง นางนับมือของ{name}ที่สาวเชือกแทน แล้วบอกลงมาทุกช่วงว่าเหลืออีกกี่มือ

          นางนั่งลงหลังกรอบไม้ไผ่ของนางก่อนดาวดวงแรกจะขึ้น คืนนั้นสมุดของช่องนางมีตัวเลขเหมือนทุกปี กับบรรทัดเล็กๆ ท้ายหน้าอีกหนึ่งบรรทัด เป็นชื่อของ{name}
        effects: { stats: { STR: 1 }, city: { merit: 1 }, flags: [hauled_the_old_counter_up] }
      failure:
        text: |
          ช่วงที่ห้า เชือกลื่นในมือ{name} เก้าอี้ตกลงไปช่วงตัวหนึ่งก่อน{name}จะกำได้อีกครั้ง เชือกกินเนื้อฝ่ามือไปเป็นแถบ เอลฟ์หญิงแก่กอดกรอบไม้ไผ่บนตักไว้ทั้งสองแขน ไม่ได้ร้อง

          คนชานนับสองคนลงมาช่วยดึงช่วงที่เหลือ นางขึ้นถึงชั้นบนก่อนดาวดวงแรก {name}นั่งอยู่บนชั้นที่ห้าทั้งคืน ฝ่ามือพันใบไม้ชุบน้ำ ได้ยินเพลงนับจากข้างบนแต่นับตามไม่ทัน
        effects: { hp: -2, flags: [rope_burned_on_the_count_night] }
    - id: write_her_count
      label: ขึ้นไปนั่งข้างนาง ถือสมุดจดตัวเลขให้ เพราะมือนางสั่นจนจับปากกาไม่อยู่
      requires: { city: { district: [count_deck] } }
      text: |
        คนชานนับรู้ว่าช่องของใครก็ต้องนับเอง ใครจะนับแทนไม่ได้ แต่ไม่มีข้อไหนห้ามจดแทน {name}นั่งข้างนาง ถือสมุดของช่องนางไว้บนตัก นางกระซิบตัวเลขทีละแถวของตาราง {name}จดตาม

        ใกล้สาง นางให้{name}อ่านทวนทั้งหมด แล้วชี้แถวหนึ่งที่{name}จดผิด นางนับไว้ในหัวสองรอบตั้งแต่แรก ฤดูต่อมานางส่งคนลงมาบอกว่าที่ข้างนางว่างไว้ให้{name}ตั้งแต่คืนแรก
      effects: { stats: { WIS: 1 }, city: { merit: 1 }, flags: [kept_the_old_counters_book] }
    - id: carry_frames_up
      label: แบกตะกร้ากรอบไม้ไผ่ขึ้นบันไดเชือกให้ทันก่อนตะวันตกดิน
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          ตะกร้ากรอบไม้ไผ่ไม่หนัก แต่กว้างกว่าบันได ต้องเอียงทุกครั้งที่ผ่านกิ่ง {name}ขึ้นไปโดยหันข้าง หลังแนบลำต้น ตะกร้าเฉียดกิ่งไปทีละคืบ ด้ายตารางไม่ขาดสักเส้น

          ถึงชั้นที่เจ็ดตอนขอบฟ้ายังแดง คนนับแต่ละคนมารับกรอบของตัวเองจากตะกร้า จำได้จากรอยมือที่ขอบไม้ ไม่มีใครหยิบผิดกรอบ
        effects: { stats: { DEX: 1 }, flags: [carried_frames_to_the_count_deck] }
      failure:
        text: |
          ตะกร้ากระแทกกิ่งที่ชั้นที่สาม กรอบหนึ่งหลุดออกจากปากตะกร้า หมุนตกหายไปในความมืดข้างล่าง {name}คว้าไม่ทัน เข่ากระแทกขั้นบันไดจนชาไปทั้งขา

          คืนนั้นคนนับช่องหนึ่งบนชั้นที่สี่นับโดยไม่มีกรอบ ใช้นิ้วทั้งสิบขึงแทนด้าย ตอนสางคนลานโคนต้นเจอกรอบนั้นค้างอยู่บนรากใหญ่ ด้ายขาดสามเส้น
        effects: { hp: -1, flags: [dropped_a_counting_frame] }
    - id: listen_from_the_roots
      label: อยู่ข้างล่าง นั่งฟังเพลงนับจากลานโคนต้น
      text: |
        ไฟทุกดวงบนลานครอบฝาตั้งแต่ตะวันตกดิน เพลงนับลงมาถึงลานโคนต้นเป็นเสียงแผ่วๆ หลายเสียงซ้อนกัน แต่ละเสียงนับช่องของตัวเอง เป็นตัวเลขภาษาเอลฟ์ที่ร้องเป็นทำนอง ไม่มีเสียงไหนตรงกับเสียงอื่น

        {name}นั่งฟังอยู่บนรากจนสาง ใกล้รุ่งเสียงหนึ่งหยุดก่อนเสียงอื่น แล้วเริ่มใหม่จากต้น
      effects: { flags: [listened_to_the_count_from_below] }

# ---------- d เรื่องเริ่มตึง: รอยถากของค่ายตัดไม้ ----------
- id: adult.city_star_hall_red_blazes
  stage: adult
  weight: 21
  scene: road
  when:
    age: [19, 64]
    city: { id: star_hall, mood: [calm] }
  text: |
    ครึ่งวันเดินจากลานโคนต้นมีต้นไม้แก่เจ็ดต้นยืนเป็นวง เปลือกหนาจนคนสองคนโอบไม่รอบ {name}ไปเก็บเห็ดตามที่คนในลานบอกทาง แล้วเจอรอยขวานบนต้นแรก เปลือกถากออกเป็นสี่เหลี่ยมเท่าฝ่ามือ ทาสีแดง ทุกต้นในวงมีรอยแบบเดียวกัน หันไปทางเดียวกัน

    คนลานโคนต้นที่เคยทำงานค่ายบอกได้ว่ารอยแบบนี้คืออะไร ค่ายตัดไม้ทำเครื่องหมายต้นที่จะล้มฤดูหน้า สีแดงคือต้นที่ยาวพอทำกระดูกงูเรือเหาะ ค่ายที่ใกล้ที่สุดอยู่ห่างออกไปอีกครึ่งวัน ปีกลายยังห่างหนึ่งวัน

    ระหว่างทางกลับ{name}ผ่านกิ่งต่ำที่เอลฟ์รุ่นหนุ่มนั่งกันอยู่ห้าหกคน พวกเขาพูดเรื่องค่ายตัดไม้กันดังๆ ทุกคืนที่ฟ้าปิด
  choices:
    - id: show_the_young
      label: พาเอลฟ์รุ่นหนุ่มไปดูรอยสีแดงก่อนค่ำ
      text: |
        เอลฟ์หนุ่มคนหนึ่งเอานิ้วลูบรอยสีแดงแล้วดมนิ้วตัวเอง อีกคนนับต้นที่มีรอยครบเจ็ดแล้วนับซ้ำ ระหว่างทางกลับไม่มีใครพูด พอถึงลานโคนต้นพวกเขาไม่พูดเรื่องค่ายดังๆ อีก ขึ้นไปพูดกันบนกิ่งที่คนนอกขึ้นไม่ถึง

        ตั้งแต่สัปดาห์นั้น ทุกคืนที่ฟ้าปิดมีคบไฟสามสี่ดวงเดินออกจากโคนต้นหอไปทางค่าย แล้วกลับมาก่อนสาง
      effects: { city: { mood: tense }, flags: [showed_the_blazes_to_the_young_elves] }
    - id: walk_to_the_camp
      label: เดินต่อไปอีกครึ่งวัน ขอพบหัวหน้าค่ายตัดไม้
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          หัวหน้าค่ายเป็นชายร่างผอมที่ไอเพราะขี้เลื่อย นั่งคุยกับ{name}บนตอไม้หน้าเรือนนอน {name}ไม่ได้ขอให้เขาเลิกตัด บอกเขาแค่ว่าเอลฟ์รุ่นหนุ่มยังไม่เห็นรอยสีแดง แล้วถามว่าค่ายของเขามีคนเฝ้ากลางคืนกี่คน เขานับนิ้วตัวเอง แล้วหยุดนับ

          ฤดูล้มไม้ปีนั้นค่ายล้มต้นไม้ไปทางเหนือแทน วงต้นไม้แก่ทั้งเจ็ดยังมีรอยถากสี่เหลี่ยม แต่ไม่มีสีแดงแล้ว
        effects: { stats: { CHA: 1 }, city: { merit: 1 }, flags: [talked_the_camp_off_the_old_ring] }
      failure:
        text: |
          หัวหน้าค่ายไม่ได้ออกมาเอง ส่งคนมาบอกว่าค่ายมีหนังสืออนุญาตจากราชสำนัก ต้นไหนอยู่ในเขตหนังสือ ค่ายล้มได้ทุกต้น คนงานที่ยืนฟังอยู่หัวเราะ คนหนึ่งเอาด้ามขวานเคาะตอไม้สองที เหมือนเคาะประตูเรียกคน

          เสียงหัวเราะกลับมาถึงลานโคนต้นก่อน{name} เอลฟ์รุ่นหนุ่มได้ยินจากคนขายเกลือที่เดินผ่านค่าย คืนนั้นบนกิ่งที่คนนอกขึ้นไม่ถึงมีเสียงคุยกันจนสาง
        effects: { city: { mood: tense }, flags: [turned_away_at_the_logging_camp] }
    - id: scrape_the_blazes
      label: กลับไปตอนเช้ามืดพร้อมมีดกับถังน้ำ ขูดสีแดงออกจากเปลือกทุกต้น
      text: |
        สีแดงของค่ายผสมน้ำมัน ต้องขูดลึกถึงเนื้อไม้ {name}ขูดจนครบเจ็ดต้นตอนตะวันขึ้นสูง เนื้อไม้ใต้เปลือกขาวซีดเป็นสี่เหลี่ยมเจ็ดช่อง

        ฤดูล้มไม้ปีนั้นคนตัดไม้มาถึงวงต้นไม้แก่ หาเครื่องหมายไม่เจอ หัวหน้าทีมยืนเกาหัวครู่หนึ่ง แล้วพาคนเดินต่อไปหาวงที่มีสีแดง สามวงถัดไปทางเหนือล้มลงในฤดูนั้นแทน
      effects: { alignment: { law: -1 }, flags: [scraped_the_logger_blazes] }
    - id: tell_the_keeper
      label: ขึ้นไปบอกผู้คุมหอ
      text: |
        ตาของผู้คุมหอเหลือเห็นแค่ดวงที่สว่างที่สุดไม่กี่ดวง เขาให้{name}วาดรอยถากลงบนแผ่นเปลือกไม้ขนาดเท่าจริง แล้วลูบแผ่นนั้นช้าๆ ด้วยปลายนิ้ว ตามขอบสี่เหลี่ยมทีละด้าน

        ปีนั้นจดหมายประจำปีที่ไปเวนทราสมีรูปสี่เหลี่ยมขนาดเท่าฝ่ามืออยู่ท้ายหน้า ลาเธียคัดลงไปเอง ใต้รูปเขียนไว้บรรทัดเดียวว่าครึ่งวันจากหอ
      effects: { flags: [told_the_keeper_about_the_blazes] }

# ---------- e เดือด: ขวานที่ราก ----------
- id: adult.city_star_hall_axes_at_the_roots
  stage: adult
  weight: 35
  when:
    age: [19, 64]
    city: { id: star_hall, mood: [tense] }
  text: |
    คืนก่อน ค่ายตัดไม้ที่ใกล้ที่สุดไหม้ทั้งค่าย คนงานหนีออกมาได้หมด แต่เรือนนอน กองไม้ เลื่อยยาวสองปื้น กับรถลากไม้หายไปในไฟ ไม่มีใครในลานโคนต้นต้องถามว่าใครจุด เอลฟ์รุ่นหนุ่มกลุ่มที่นั่งบนกิ่งต่ำกลับมาก่อนสาง ผมมีกลิ่นควัน

    สายวันนั้นคนงานค่ายสามสิบกว่าคนเดินเข้ามาตามทางเกวียน ถือขวาน หัวหน้าค่ายเดินหน้า เขาไม่ได้มาตามหาคนจุด เขาตะโกนตั้งแต่ทางเข้าลานว่าจะเอาค่าค่ายคืนจากต้นไม้ที่เผาค่ายเขา ต้นที่ใหญ่ที่สุดในป่า

    บนชานนับไม่มีใครลงมา เอลฟ์บนกิ่งจดหมายวางปากกา คนลานโคนต้นออกมายืนหน้าเรือนของตัวเอง ระหว่างรากต้นหอกับทางเกวียน
  choices:
    - id: stand_at_the_roots
      label: ไปยืนเรียงกับคนอื่นหน้ารากใหญ่
      text: |
        เอลฟ์รุ่นหนุ่มลงจากกิ่งต่ำมายืนแถวหน้า คนลานโคนต้นยืนแถวสอง {name}ยืนตรงรากที่สลักกฎไว้ ขวานเล่มแรกไม่ได้ฟันราก ด้ามขวานกระแทกท้อง{name}จนหายใจไม่ออก แถวหน้าแตกไปทางซ้าย แถวสองแตกไปทางขวา

        ก่อนเที่ยงคนงานค่ายถอยออกไป ทิ้งรอยขวานสามรอยไว้บนรากใหญ่ ลึกเท่าข้อนิ้ว ยางสีอำพันไหลออกมาจนค่ำ คืนนั้นค่ายที่สองทางเหนือมีไฟขึ้นก่อนสาง
      effects: { hp: -2, reputation: { star_hall: 1, crown: -1 }, city: { mood: riot }, flags: [stood_at_the_hall_roots] }
    - id: meet_the_loggers
      label: เดินออกไปรับหน้าคนงานค่ายบนทางเกวียน ก่อนพวกเขาจะถึงราก
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}หยุดหัวหน้าค่ายไว้กลางทางเกวียน ห่างรากใหญ่ร้อยก้าว ไม่ได้ขอให้เขากลับ ขอให้เขานับ ค่าเรือนนอน ค่ากองไม้ ค่าเลื่อยสองปื้น ค่ารถลาก ทีละอย่าง ต่อหน้าคนงานทุกคน ยิ่งนับไปเสียงเขายิ่งเบา คนงานข้างหลังเริ่มนับตาม

          ตอนเที่ยงผู้เฒ่าเอลฟ์สองคนลงมานั่งกับหัวหน้าค่ายบนตอไม้ข้างทางเกวียน คนงานนั่งพัก ขวานวางพิงเข่า ก่อนค่ำพวกเขาเดินกลับไปทางค่าย บนรากใหญ่ไม่มีรอยขวานสักรอย
        effects: { stats: { CHA: 1 }, city: { mood: calm }, flags: [met_the_loggers_on_the_cart_road] }
      failure:
        text: |
          หัวหน้าค่ายเดินผ่าน{name}เหมือนเดินผ่านตอไม้ คนงานข้างหลังไม่ได้เดินผ่าน เดินชน ไหล่ของ{name}โดนด้ามขวานจนล้มลงข้างทางเกวียน มีเท้าเหยียบข้อมือหนึ่งที

          รอยขวานสามรอยลึกเท่าข้อนิ้วอยู่บนรากใหญ่ก่อนผู้เฒ่าเอลฟ์จะลงมาถึง คืนนั้นค่ายที่สองทางเหนือมีไฟขึ้นก่อนสาง
        effects: { hp: -2, city: { mood: riot }, flags: [knocked_down_on_the_cart_road] }
    - id: name_the_burners
      label: บอกหัวหน้าค่ายว่าเอลฟ์คนไหนจุดไฟ
      text: |
        หัวหน้าค่ายฟังชื่อทีละชื่อ แล้วสั่งคนงานลดขวาน เขาไม่ได้ฟันราก เขาส่งคนไปเวนทราสแทน สามวันต่อมาคนของราชสำนักขี่ม้ามาถึงลานโคนต้นหกคน

        เอลฟ์รุ่นหนุ่มสามคนลงจากกิ่งต่ำ มือผูกเชือก เดินไปตามทางเกวียนกับคนของราชสำนัก บนรากใหญ่ไม่มีรอยขวาน ตั้งแต่วันนั้นไม่มีตะกร้าจากกิ่งไหนหย่อนลงมาหน้าเรือนของ{name}อีก
      effects: { reputation: { crown: 1, star_hall: -2 }, city: { mood: calm }, flags: [named_the_camp_burners] }

# ---------- f ไข้มาถึง: มากับคนส่งคำตอบ ----------
- id: adult.city_star_hall_answer_fever
  stage: adult
  weight: 9
  scene: road
  when:
    age: [19, 64]
    city: { id: star_hall, mood: [calm, tense] }
  text: |
    ทุกปลายฤดูฝน คนส่งจดหมายของราชสำนักขี่ม้าขึ้นมาถึงลานโคนต้นพร้อมกระบอกหนังใบเดียว ข้างในคือคำตอบของจดหมายประจำปี คนในลานรู้ว่าข้างในเขียนว่าอะไร เอลฟ์บนกิ่งจดหมายก็รู้ ทุกคนยังมายืนรอ

    ปีนี้เขามาช้าไปสี่วัน หน้าแดง ตาแฉะ ไอแห้งทุกสามสี่คำ เขาบอกว่าโรงเตี๊ยมแห่งสุดท้ายบนทางมาไอกันทั้งห้อง คนที่ไอก่อนใครเป็นคนเดินทางที่มาจากเมืองหลวง เขาลงจากม้า ยื่นกระบอกหนังให้คนที่ยืนใกล้ที่สุด คนนั้นคือ{name}

    เด็กของลานโคนต้นสามสี่คนวิ่งมาจากข้างหลัง อยากจับม้า
  choices:
    - id: keep_him_apart
      label: ไม่รับกระบอก พาคนส่งจดหมายกับม้าไปพักที่เรือนรอท้ายลานจนครบเจ็ดวัน
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          {name}บอกให้เขาวางกระบอกหนังไว้บนตอไม้ ไล่เด็กกลับก่อนจะได้แตะม้า แล้วจูงม้าเดินนำเขาไปเรือนรอท้ายลาน เรือนของคนที่มาขอคำตอบแล้วต้องรอ ห่างพอให้เสียงไอไปไม่ถึงเรือนอื่น เขาบ่นตลอดทาง แต่เดินตาม

          เจ็ดวันนั้นข้าวต้มไปวางที่หน้าประตูเรือนรอวันละสองหน เขาไอจนวันที่ห้าแล้วหยุด ฤดูนั้นไม่มีใครในลานโคนต้นไอ กระบอกหนังวางอยู่บนตอไม้ครบเจ็ดวัน ข้างในยังเขียนเหมือนเดิม
        effects: { city: { merit: 2 }, flags: [kept_the_letter_carrier_apart] }
      failure:
        text: |
          คนส่งจดหมายบอกว่าเขาต้องได้ลายมือชื่อคนรับก่อนจะไปไหน แล้วต้องได้นอนในเรือนพักกลางลานเหมือนทุกปี เพราะราชสำนักจ่ายค่าเรือนไว้แล้ว เด็กคนหนึ่งได้จับม้า อีกคนได้ขี่

          สิบวันต่อมาผ้าขาวผูกหน้าเรือนสามหลังบนลานโคนต้น เสียงไอขึ้นไปถึงกิ่งต่ำ เรือนพักกลางลานปิดประตูทั้งฤดู
        effects: { city: { mood: plague }, flags: [could_not_keep_the_carrier_apart] }
    - id: carry_the_answer_up
      label: รับกระบอกหนังขึ้นไปส่งที่กิ่งจดหมายเอง
      text: |
        ลาเธียรับกระบอกจากมือ{name} เปิดอ่าน แล้วส่งให้คนคัดคนถัดไปอ่านต่อตามธรรมเนียม ทุกคนบนกิ่งจดหมายจับกระดาษแผ่นนั้นคนละครั้ง แล้ววางกระบอกเรียงต่อท้ายแถวบนชั้น

        สิบวันต่อมาบันไดเชือกที่ขึ้นกิ่งจดหมายมีผ้าขาวผูกไว้ เรือนคัดเงียบไปทั้งฤดู โต๊ะทุกตัวมีหินแม่น้ำทับกระดาษเปล่าไว้
      effects: { city: { mood: plague }, flags: [carried_the_fevered_answer_up] }
    - id: read_it_aloud
      label: เปิดกระบอกอ่านคำตอบให้คนที่รออยู่ฟังตรงนั้นเลย
      text: |
        คำตอบมีบรรทัดเดียว ราชสำนักรับทราบ และขอบใจหอนับดาวที่ห่วงใย คนที่ยืนฟังเบียดกันเข้ามาดูลายมือ คนหนึ่งบอกว่าลายมือปีนี้สวยกว่าปีก่อน แล้วทุกคนก็หัวเราะ คนส่งจดหมายหัวเราะด้วย ไอไปด้วย

        เขานอนในเรือนพักกลางลานสามคืนก่อนกลับ สิบวันต่อมาผ้าขาวผูกหน้าเรือนสี่หลังบนลานโคนต้น
      effects: { city: { mood: plague }, flags: [read_the_answer_at_the_roots] }

# ---------- g คนมีหน้ามีตา: ลาเธียขอลายมือชื่อ ----------
- id: adult.city_star_hall_yearly_letter
  stage: adult
  weight: 45
  scene: star_hall
  when:
    age: [25, 64]
    city: { id: star_hall, min_rank: 3 }
  text: |
    ลาเธียเขียนจดหมายประจำปีมาแล้วเก้าสิบกว่าฉบับ ทุกฉบับขึ้นต้นเหมือนกัน ลงท้ายเหมือนกัน ตรงกลางเปลี่ยนแค่บรรทัดเดียว นางเป็นเอลฟ์ที่หลังยังตรง นิ้วกลางข้างขวามีตุ่มด้านจากปากกาใหญ่เท่าเมล็ดถั่ว กระบอกหนังที่ใส่คำตอบของเวนทราสเรียงอยู่บนชั้นข้างโต๊ะนาง เก้าสิบกว่ากระบอก ข้างในเขียนประโยคเดียวกันทุกใบ

    ปีนี้นางอยากให้มีอีกชื่อหนึ่งอยู่ท้ายจดหมาย ใต้ลายมือของผู้คุมหอ ชื่อของคนที่ไม่ได้นั่งนับดาว ชื่อที่ลานโคนต้นรู้จัก และถ้าไปถึงเวนทราสแล้ว อาจมีคนในเวนทราสเคยได้ยิน นางวางจดหมายไว้บนโต๊ะเรือนคัด ทับด้วยหินแม่น้ำ แล้วยื่นปากกาให้{name}

    ข้างนอกเรือนคัด ลมผ่านกิ่งจดหมายเสียงเหมือนคนพลิกกระดาษ
  choices:
    - id: sign_it
      label: ลงชื่อใต้ลายมือของผู้คุมหอ
      text: |
        ลายมือของ{name}ตัวใหญ่กว่าลายมือของผู้คุมหอ หมึกเข้มกว่า ลาเธียเป่าหมึกให้แห้ง ม้วนจดหมายใส่กระบอก ผูกเชือกเปลือกไม้สามรอบเหมือนทุกปี

        ปลายฤดูฝนคำตอบกลับมา ประโยคเดียวกับเก้าสิบกว่าใบบนชั้น ลาเธียวางกระบอกใบใหม่ต่อท้ายแถว ห่างจากใบก่อนเท่าความกว้างของนิ้วหนึ่งนิ้ว
      effects: { reputation: { star_hall: 1 }, flags: [signed_the_yearly_letter] }
    - id: sign_and_carry
      label: ลงชื่อ แล้วขอถือจดหมายไปยื่นที่เวนทราสเอง
      requires: { min_gold: 3 }
      text: |
        ค่าเดินทางไปกลับกินเงินไปสามเหรียญ ที่เวนทราส{name}ยื่นจดหมายด้วยมือตัวเองที่โต๊ะเสมียนในตึกของราชสำนัก เสมียนประทับตรารับ แล้ววางกระบอกลงในตะกร้าข้างโต๊ะ ในตะกร้ามีกระบอกหนังกองอยู่แล้วครึ่งตะกร้า มาจากที่อื่น

        ปลายฤดูฝนคำตอบกลับมากับคนส่งจดหมายคนเดิม ประโยคเดิม แต่บรรทัดขึ้นต้นปีนี้มีชื่อของ{name}อยู่ด้วย สะกดถูกทุกตัว
      effects: { gold: -3, city: { merit: 1 }, flags: [signed_the_yearly_letter, carried_the_yearly_letter] }
    - id: bind_the_old_answers
      label: ขอให้ลาเธียคัดคำตอบเก่าทุกใบแนบไปกับจดหมายปีนี้ ก่อนจะลงชื่อ
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          ลาเธียฟังจนจบ วางปากกาลง แล้วหยิบกระบอกใบแรกลงจากชั้น คนคัดทั้งกิ่งจดหมายช่วยกันคัดอยู่เจ็ดคืน คำตอบเก้าสิบกว่าใบ ประโยคเดียวกันเรียงลงมาทีละบรรทัด ยาวจนต้องม้วนเป็นสองม้วน {name}ลงชื่อไว้ท้ายม้วนที่สอง

          ปลายฤดูฝนคำตอบกลับมา ประโยคเดิม คำเดิม แต่ลายมือไม่เหมือนปีไหน และประทับตราของห้องที่ไม่เคยประทับมาก่อน
        effects: { stats: { WIS: 1 }, flags: [signed_the_yearly_letter, bound_the_old_answers_to_the_letter] }
      failure:
        text: |
          ลาเธียบอกว่าคำตอบเก่าเป็นของหอ ส่งคืนไปก็เหมือนบอกเวนทราสว่าหอเก็บไว้ไม่ได้อ่าน {name}ซื้อแผ่นเปลือกไม้จากคนคัดหนึ่งเหรียญ คัดเองคืนเดียวได้สิบสองบรรทัด แล้วลงชื่อในจดหมายตามเดิม

          ลาเธียไม่ได้ใส่แผ่นนั้นลงกระบอก นางเก็บไว้ในลิ้นชักโต๊ะ ใต้ปากกาสำรอง
        effects: { gold: -1, flags: [signed_the_yearly_letter] }
    - id: refuse_to_sign
      label: วางปากกาคืนบนหินแม่น้ำ
      text: |
        ลาเธียไม่ได้ถาม นางเรียกคนคัดอีกคนมาลากเส้นลายมือของผู้คุมหอให้ชัดขึ้นแทน ช่องว่างใต้ชื่อเขาเหลืออยู่เท่าเดิม

        ปลายฤดูฝนคำตอบกลับมา ประโยคเดิม ลาเธียวางกระบอกใบใหม่ต่อท้ายแถว ห่างจากใบก่อนเท่าความกว้างของนิ้วหนึ่งนิ้ว
      effects: { flags: [refused_to_sign_the_letter] }

# ---------- h หลังคา: เรือนบนลานโคนต้น ----------
- id: adult.city_star_hall_roof
  stage: adult
  weight: 10
  once: false
  scene: home
  when:
    age: [22, 62]
    city: { id: star_hall, home: [none, room, family], min_years: 2 }
  text: |
    เรือนบนลานโคนต้นไม่มีใครสร้างใหม่ ไม้ทุกชิ้นในหอนับดาวต้องเป็นไม้ที่ป่าทิ้งลงมาเอง คนนอกก็ถือกฎข้อเดียวกัน เรือนจึงเปลี่ยนมือจากคนนอกถึงคนนอก ปีละหลังสองหลัง เมื่อพ่อค้าแก่จนขึ้นเกวียนไม่ไหว หรือคนที่มาขอคำตอบได้คำตอบแล้ว

    ปีนี้มีสองหลัง หลังหนึ่งซุกอยู่ในซอกรากทางทิศเหนือ ผนังสองด้านเป็นรากของต้นหอ ห้องเดียว เตาดินหนึ่งเตา สิบเหรียญ อีกหลังอยู่ตรงทางเข้าลาน ข้างรากที่สลักกฎ ด้านหน้าเปิดเป็นแผงขายของได้ทั้งแผง ข้างหลังมีห้องนอน สิบสี่เหรียญ เจ้าของเป็นคนทำแผนที่ที่จะกลับเวนทราสพร้อมแผนที่ป่าที่วาดมาตลอดชีวิต

    บนกิ่งไม่มีอะไรขาย ห้องเช่าในลานโคนต้นจ่ายเมื่อครบรอบสัญญาเหมือนที่อื่น
  choices:
    - id: buy_the_root_house
      label: ซื้อเรือนในซอกรากทางทิศเหนือ สิบเหรียญ
      requires: { min_gold: 10 }
      text: |
        เจ้าของเดิมเป็นพ่อค้าเกลือที่ขาไม่ดีแล้ว เขาส่งกุญแจไม้ให้{name}จากบนเกวียน ไม่ได้ลงมาเดินดูเรือนด้วยกันอีกรอบ บอกแค่ว่าเตาดินต้องพอกใหม่ทุกต้นฤดูฝน

        ผนังที่เป็นรากอุ่นกว่าผนังไม้ คืนฟ้าเปิดเพลงนับลงมาตามรากถึงในเรือน ชัดกว่าตอนนั่งฟังกลางลาน
      effects: { gold: -10, city: { district: root_camp, home: house }, mark: ซื้อบ้านในหอนับดาว, flags: [owns_a_house_in_star_hall] }
    - id: buy_the_stall_house
      label: ซื้อเรือนแผงที่ทางเข้าลาน สิบสี่เหรียญ
      requires: { min_gold: 14 }
      text: |
        คนทำแผนที่ม้วนแผนที่ทุกแผ่นใส่กระบอก ทิ้งไว้ให้แผ่นเดียว ตอกไว้บนผนังหลังแผง เป็นแผนที่ป่าตอนที่เขาขึ้นมาถึงครั้งแรก ค่ายตัดไม้ที่ใกล้ที่สุดในแผ่นนั้นอยู่ห่างจากต้นหอสามวัน

        วันแรกที่{name}เปิดแผง ลูกค้าคนแรกเป็นเด็กเอลฟ์ที่ลงมาจากกิ่ง ถือถั่วอบแห้งมาแลกด้ายหนึ่งขด
      effects: { gold: -14, city: { district: root_camp, home: shop }, mark: เปิดร้านในหอนับดาว, flags: [owns_a_shop_in_star_hall] }
    - id: keep_the_coins
      label: เก็บเงินไว้ แล้วนอนที่เดิมต่อ
      text: |
        เรือนในซอกรากเปลี่ยนมือก่อนสิ้นเดือน คนซื้อเป็นหญิงจากเวนทราสที่มาขอคำตอบเรื่องลูกชาย นางจ่ายครบสิบเหรียญโดยไม่ต่อ

        เรือนแผงที่ทางเข้าลานยังว่างจนฤดูฝน แผนที่บนผนังหลังแผงชื้นจนเส้นหมึกเริ่มซึม
      effects: { flags: [kept_renting_under_the_hall] }
