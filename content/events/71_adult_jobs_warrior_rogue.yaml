# ชุด 3a วัยผู้ใหญ่ อายุ 19 ถึง 24: เหตุการณ์ประจำงานสายนักรบและนักย่อง งานละ 1 เรื่อง (ราชนาวีแยกปีก่อนและหลังเรือเหาะมีมาก)
# น้ำหนัก 45 (มากกว่าเรื่องตามทาง 30 เพราะงานละเรื่องเดียว ไม่ให้ชีวิตผ่านหกปีโดยไม่เจอเรื่องของงานตัวเอง) เรื่องเกี่ยวกับคนมีเขามีตัวเลือกของคนมีเขาเองด้วย
# ความตายมีเฉพาะตัวเลือกเสี่ยงที่บอกชัดว่าเสี่ยง: ผู้เฝ้าผนึกออกไปลากเพื่อนกลับคนเดียว

- id: adult.job_navy_storm
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    year: [298, 330]
    flags: [job_navy]
  text: |
    พายุลูกนั้นมาจากทะเลใต้ตอนเรือหลวงลำที่สิบสองลาดตระเวนอยู่เหนือน้ำ ห่างฝั่งครึ่งวันบิน ฟ้ามืดลงในเวลาที่นายท้ายนับเลขถึงร้อย แล้วฝนก็ตีลงมาด้านข้าง ไม่ใช่จากข้างบน

    เชือกโยงถุงลมเส้นหน้าขาดเป็นเส้นแรก ถุงลมยักษ์บิดตัวไปทางขวา ทั้งเรือเอียงตาม ของทุกอย่างที่ไม่ได้ผูกไหลไปกองที่กราบเดียวกัน นายเรือตะโกนสั่งให้คนขึ้นไปผูกเชือกเส้นนั้นใหม่บนหลังถุงลม ไม่มีใครขยับ

    ที่ตาข่ายข้างกราบ ทหารใหม่คนหนึ่งที่ขึ้นเรือมาพร้อม{name}ห้อยอยู่ด้วยมือข้างเดียว ใต้เท้าเขาเป็นทะเลกับเมฆ ส่วนเสียงนายท้ายสั่งให้ทุกคนอยู่ประจำที่ ใครทิ้งที่ตัวเองไป เรือจะหมุนจนคว่ำ
  choices:
    - id: climb_the_bag
      label: ปีนขึ้นหลังถุงลมไปผูกเชือกเส้นนั้นใหม่
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          ผิวถุงลมลื่นเหมือนท้องปลา {name}คลานขึ้นไปตามตาข่ายทีละช่อง ลมพยายามดึงตัวออกไปทุกช่วงลมหายใจ ปลายเชือกที่ขาดฟาดไปมาอยู่บนยอด {name}คว้าได้ในครั้งที่สาม พันเข้ากับห่วงเหล็กสามรอบ แล้วผูกปมที่นายสิบสอนไว้ตั้งแต่วันแรก ปมที่ยิ่งดึงยิ่งแน่น

          ถุงลมค่อยๆ หมุนตัวกลับ เรือตั้งลำได้ก่อนพายุจะผ่านไป พอเรือเข้าอู่ นายเรือเรียก{name}ไปพบ ยื่นดาบสั้นประจำตัวเล่มหนึ่งให้ ด้ามหุ้มหนังปลาฉลาม พูดแค่ชื่อของ{name}คำเดียว
        effects: { stats: { DEX: 1 }, reputation: { crown: 1 }, flags: [navy_storm_climber], items: [navy_saber] }
      failure:
        text: |
          มือที่เกาะตาข่ายหลุดตอนลมกระโชกครั้งใหญ่ที่สุดมาถึง {name}ไถลลงตามผิวถุงลมไปทั้งตัว ร่วงลงไปค้างอยู่ที่ตาข่ายใต้ท้องเรือ ซี่โครงกระแทกห่วงเหล็กดังจนได้ยินเสียงตัวเองข้างใน

          ทหารเก่าอีกสองคนปีนขึ้นไปผูกเชือกแทน ใช้เวลานานกว่าเท่าตัว แต่ก็ผูกได้ {name}นอนเจ็บอยู่ในห้องหมอบนเรือสิบสองวัน ทุกครั้งที่หายใจลึกต้องกลั้นไว้ครึ่งทาง
        effects: { hp: -4, stats: { CON: 1 }, flags: [navy_storm_fall] }
    - id: haul_the_boy
      label: ทิ้งที่ประจำ ไปดึงทหารใหม่คนนั้นขึ้นมา
      check: { stat: STR, dc: 13 }
      success:
        text: |
          {name}คว้าข้อมือเขาได้ตอนนิ้วสุดท้ายหลุดจากตาข่าย แขนที่จับอยู่ทั้งสองคนยืดจนรู้สึกเหมือนจะหลุดออกจากบ่า {name}เอาเท้ายันกราบเรือ ดึงทีละคืบ จนเขาล้มลงมานอนบนพื้นเรือ ตัวสั่นไม่หยุด

          พายุผ่านไปตอนสาง นายท้ายเขียนชื่อ{name}ลงสมุดโทษข้อหาทิ้งที่ประจำการ หักเบี้ยเลี้ยงสามเหรียญ ทหารใหม่คนนั้นแอบเอาเหรียญของตัวเองสามเหรียญมาวางไว้ใต้หมอนของ{name}ในคืนเดียวกัน
        effects: { stats: { STR: 1 }, alignment: { moral: 1, law: -1 }, flags: [saved_navy_mate] }
      failure:
        text: |
          เชือกตาข่ายเปียกลื่นจนจับไม่อยู่ {name}คว้าข้อมือเขาได้ครั้งหนึ่ง แล้วมือเขาก็ลื่นออกไปจากมือ{name}ทีละนิ้ว เขาไม่ได้ร้อง ปากเปิดอยู่แต่ไม่มีเสียงออกมา แล้วเมฆก็กลืนเขาไป

          นายท้ายไม่ได้เขียนชื่อ{name}ลงสมุดโทษ บอกว่าโทษที่ได้ไปแล้วหนักกว่าที่สมุดจะเขียนให้ได้ ฝ่ามือของ{name}เป็นรอยไหม้จากเชือกอยู่หนึ่งเดือน
        effects: { hp: -1, stats: { STR: 1 }, flags: [lost_navy_mate] }
    - id: hold_the_crank
      label: อยู่ประจำที่ ยันคันหมุนใบพัดไว้ตามคำสั่ง
      text: |
        คันหมุนใบพัดดิ้นอยู่ในมือเหมือนสัตว์ที่ไม่อยากโดนจับ {name}เอาไหล่ยันไว้ทั้งคืน ไม่เห็นว่าข้างบนเกิดอะไรขึ้น ได้ยินแต่เสียง เสียงเชือกขาด เสียงนายเรือตะโกน และเสียงหนึ่งที่ขาดหายไปกลางคำ

        พายุผ่านไปตอนสาง เรือยังลอยอยู่ นายท้ายเดินมาตบไหล่ทุกคนที่อยู่ประจำที่ครบทั้งคืน {name}ถามถึงทหารใหม่ที่ห้อยอยู่ตรงตาข่าย นายท้ายไม่ตอบ เดินไปตบไหล่คนถัดไป
      effects: { stats: { CON: 1 }, alignment: { law: 1 } }

- id: adult.job_navy_coast
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    year: [288, 297]
    flags: [job_navy]
  text: |
    ปีนั้นราชนาวียังเป็นทหารเรือในน้ำมากกว่าบนฟ้า งานของ{name}คือเรือตรวจชายฝั่งลำเล็ก ใบเรือสองผืน ปืนดินดำหัวเรือหนึ่งกระบอก ลาดตระเวนตามอ่าวชายฝั่งใต้ จับเรือที่ไม่จ่ายภาษีท่า

    คืนเดือนมืดคืนหนึ่ง เรือของ{name}ไล่ตามเรือพายลำหนึ่งที่ไม่จุดไฟ จนมันเกยหาด คนพายกระโดดหนีหายเข้าไปในป่าชายหาด ทิ้งเรือไว้ใต้ผ้าใบเปียก ใต้ผ้าใบเป็นเด็กห้าคน ตัวเล็กสุดยังไม่หย่านม ทุกคนมีเขา

    ชาวประมงเล่าว่าคืนเดือนมืดดาวในน้ำมีมากกว่าดาวบนฟ้า คืนนั้น{name}ก้มลงมองน้ำทะเลรอบเรือพาย แล้วเชื่อ นายสิบคุมเรือถามว่าใครเห็นอะไรบ้าง
  choices:
    - id: report_it
      label: รายงานตามจริงว่าเจอเด็กมีเขาห้าคน
      text: |
        นายสิบจดลงสมุดตามคำของ{name} เด็กทั้งห้าคนไปกับเรือของศาสนจักรตะเกียงที่มารับตอนสาย เด็กโตที่สุดหันกลับมามองเรือตรวจครั้งเดียวก่อนขึ้นเรือ ไม่ได้มอง{name} มองทะเล

        {name}ได้ชื่อเป็นทหารที่รายงานครบ ไม่ปิดบัง นายสิบเขียนแบบนั้นไว้ในใบประเมิน ใบประเมินใบนั้นยังอยู่ในหีบของ{name}จนทุกวันนี้
      effects: { alignment: { law: 1, moral: -1 }, reputation: { crown: 1, lamp_church: 1 }, flags: [reported_horned_boat] }
    - id: say_empty
      label: บอกว่าเรือว่าง แล้วหาทางให้เด็กไปต่อ
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}บอกนายสิบว่าใต้ผ้าใบมีแต่อวนขาด นายสิบมองหน้า{name}นานกว่าที่ควร แล้วสั่งให้ถอยเรือออก บอกว่าคืนนี้ไม่มีเวลาสำหรับอวนขาด

          ก่อนเรือตรวจจะถอยออก {name}โยนห่อข้าวของตัวเองลงไปในเรือพาย ตอนสางเรือพายลำนั้นหายไปจากหาด ไม่มีใครในเรือตรวจพูดถึงคืนนั้นอีก นายสิบเองก็ไม่
        effects: { stats: { CHA: 1 }, alignment: { moral: 1, law: -1 }, reputation: { dock_rats: 1 }, flags: [let_horned_boat_go] }
      failure:
        text: |
          เสียงเด็กเล็กร้องขึ้นมาใต้ผ้าใบตอน{name}พูดคำว่าว่าง นายสิบไม่ต้องลงไปดู เขาเดินมาหยุดตรงหน้า{name} บอกว่าครั้งนี้เขาจะเขียนว่า{name}พูดไม่ชัด เพราะลมแรง ถ้ามีครั้งหน้าลมจะไม่แรงแล้ว

          เด็กทั้งห้าไปกับเรือของศาสนจักรตะเกียงตอนสาย {name}เฝ้ากะดึกเพิ่มอีกสิบคืนตามคำสั่ง ไม่มีใครบอกว่าเป็นโทษ
        effects: { stats: { CON: 1 }, alignment: { moral: 1 }, reputation: { crown: -1 }, flags: [lied_for_horned_boat] }
    - id: show_the_stumps
      label: ถอดหมวกให้เด็กโตที่สุดเห็นตอเขาบนหัวตัวเอง
      requires: { flag: horns_sawn }
      text: |
        {name}ลงไปในเรือพายคนเดียว บอกนายสิบว่าจะไปนับหัว แล้วถอดหมวกออกในความมืด ให้เด็กโตที่สุดเอามือคลำตอเขาที่เลื่อยไว้ เด็กคลำอยู่นาน แล้วดึงมือกลับไปจับเขาของตัวเอง

        {name}ขึ้นมาบอกนายสิบว่าเด็กห้าคน ตามจริง แต่ก่อนขึ้นเรือของศาสนจักรตอนสาย เด็กคนนั้นรู้แล้วว่าคนมีเขาใส่เสื้อทหารได้ ใส่หมวกให้แน่น แล้วอยู่ต่อไปได้ เด็กคนนั้นไม่ร้องไห้เลยตอนเดินขึ้นเรือ
      effects: { stats: { WIS: 1 }, flags: [showed_horns_to_child] }

- id: adult.job_wardens_night
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_wardens]
  text: |
    หินผนึกรอบตอเสาเรียงเป็นวงยาวจนมองไม่เห็นหัวท้าย แต่ละก้อนสูงเท่าคนสองคนต่อกัน สลักอักษรที่ไม่มีใครอ่านออกแล้ว ป้อมสามเฝ้าหินช่วงที่สามสิบสองถึงสามสิบเก้า คืนปกติหินพวกนี้เงียบ คืนนั้นมันหึ่งต่ำๆ จนรู้สึกได้ที่ฟัน

    กะดึกคืนนั้นมีห้าคน การ์เวนเป็นหัวหน้า ราวเที่ยงคืนจุดแดงเล็กๆ ขึ้นมาในความมืดหลังแนวหิน ทีละจุด สองจุด สิบจุด เป็นถ่านในอกของหมาเถ้า สว่างขึ้นทีหนึ่งดับลงทีหนึ่งตามจังหวะหายใจ ไม่มีเสียงเห่า

    เพื่อนกะคนหนึ่งชื่อเทลิค ออกไปเติมน้ำมันตะเกียงที่หินก้อนที่สามสิบห้าก่อนจุดแดงพวกนั้นจะขึ้นมา ตอนนี้ตะเกียงของเขาตกอยู่บนเถ้า ส่องให้เห็นรองเท้าข้างหนึ่งของเขา ขายังขยับอยู่
  choices:
    - id: hold_line
      label: ถือหอกยืนแนวหน้าข้างการ์เวน
      check: { stat: STR, dc: 13, foe: demon }
      success:
        text: |
          ตัวแรกพุ่งเข้ามาที่ช่องระหว่างหินสองก้อน {name}แทงหอกเข้ากลางอก ปลายหอกโดนถ่านในตัวมัน ไฟแดงพุ่งออกมาตามด้ามหอกจนแสบมือ หมาเถ้าตัวนั้นทรุดลงไปเป็นกองเถ้า ตัวที่สองชะงักอยู่ตรงขอบแสงตะเกียง แล้วถอยกลับไปในความมืด

          จุดแดงที่เหลือหายไปทีละจุดก่อนฟ้าสาง การ์เวนเก็บหัวหอกที่ไหม้ดำของ{name}ไปแขวนไว้บนผนังห้องกินข้าว ข้างหัวหอกอีกสามสิบกว่าอันที่แขวนอยู่ก่อนแล้ว ใต้แต่ละอันเขียนชื่อคนไว้
        effects: { stats: { STR: 1 }, reputation: { wardens: 1 }, flags: [warden_held_night] }
      failure:
        text: |
          หอกของ{name}แทงพลาดถ่านไปครึ่งฝ่ามือ หมาเถ้าไม่หยุด หนังดำย่นของมันครูดผ่านต้นขา{name}ไปทั้งแถบ ร้อนเหมือนโดนเหล็กเผาไฟ การ์เวนแทงซ้ำให้ตัวนั้นล้มลงข้างเท้า{name}

          แผลที่ต้นขาเป็นรอยไหม้ลายย่นเหมือนหนังของตัวที่ทำ หายแล้วก็ยังเป็นลายแบบนั้น เดินไกลทีไรขาข้างนั้นจะร้อนขึ้นมาก่อนข้างอื่น
        effects: { hp: -4, stats: { CON: 1 }, flags: [ash_hound_burn] }
    - id: fetch_telik
      label: วิ่งออกไปลากเทลิคกลับมาคนเดียว
      check: { stat: DEX, dc: 10, foe: demon }
      success:
        text: |
          {name}ข้ามแนวหินออกไปในความมืด เถ้าลึกถึงหน้าแข้ง จุดแดงสองจุดหันมาทาง{name}พร้อมกัน แล้วหยุดนิ่ง {name}ไม่รอดูว่าทำไม คว้าคอเสื้อเทลิคได้ ลากถอยหลังกลับมาทีละก้าวจนหลังชนหินก้อนที่สามสิบสี่

          เทลิคเสียขาข้างหนึ่งใต้เข่า แต่ยังหายใจ การ์เวนช่วยกันลากเขาขึ้นป้อม แล้วหันมาถามว่า{name}ไม่กลัวหรือ {name}ตอบไม่ได้ เพราะยังไม่ทันได้กลัว
        effects: { stats: { DEX: 1 }, alignment: { moral: 1 }, reputation: { wardens: 2 }, flags: [carried_warden_home] }
      failure:
        text: |
          {name}ไปถึงตัวเทลิค จับข้อมือเขาได้ แล้วจุดแดงสามจุดก็ปิดทางกลับ {name}ได้ยินเสียงการ์เวนตะโกนเรียกชื่อจากแนวหินสองครั้ง ครั้งที่สามเสียงนั้นไกลออกไปมาก

          ตอนสาง ผู้เฝ้าผนึกออกไปเก็บของที่เหลือบนเถ้าได้ทั้งสองคน หัวหอกของ{name}ไปแขวนอยู่บนผนังห้องกินข้าว ใต้หัวหอกเขียนชื่อไว้ ตัวอักษรยังใหม่กว่าทุกชื่อบนผนังนั้น
        effects: { die: true }
    - id: light_the_trench
      label: ตีระฆัง แล้วจุดน้ำมันในคูหน้าแนวหิน
      check: { stat: INT, dc: 12 }
      success:
        text: |
          {name}จำได้ว่าคูน้ำมันหน้าแนวหินเติมไว้เต็มตั้งแต่ต้นเดือน แค่ไม่มีใครเคยจุด เพราะน้ำมันแพง {name}โยนตะเกียงลงไปในคู ไฟลุกเป็นแนวยาวไปตามหินทั้งเจ็ดก้อน จุดแดงทั้งหมดถอยออกจากแสงไฟ

          ไฟแนวนั้นส่องให้เห็นเทลิคชัดพอให้สองคนวิ่งออกไปลากกลับมาได้ พรุ่งนี้เช้าป้อมต้องเขียนจดหมายขอค่าน้ำมันไปที่ภาคี เขียนมาสามครั้งแล้วยังไม่เคยได้ การ์เวนบอกให้{name}เป็นคนเขียนครั้งนี้
        effects: { stats: { INT: 1 }, reputation: { wardens: 1 }, flags: [lit_the_trench] }
      failure:
        text: |
          ตะเกียงที่{name}โยนตกลงผิดที่ ไม่ลงคู ไปตกลงบนกองฟางที่ใช้ห่อหินผนึกจากลมหนาว ไฟลุกไปทางป้อม ไม่ใช่ทางหมาเถ้า ทั้งกะดึกต้องหันมาดับไฟข้างหลังแทนดูข้างหน้า

          ไฟดับได้ก่อนลามถึงห้องดินปืน หมาเถ้าถอยไปเองก่อนสาง ไม่มีใครรู้เพราะอะไร เทลิคตายบนเถ้าตรงที่ตะเกียงของเขาตก การ์เวนไม่ได้โทษ{name} แต่ไม่ให้{name}ถือตะเกียงในกะดึกอีกหนึ่งฤดู
        effects: { hp: -1, stats: { WIS: 1 }, flags: [warden_fire_blunder] }

- id: adult.job_mercenary_blockade
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_mercenary]
  text: |
    ขบวนถ่านหยุดกลางทางตอนบ่าย ตู้ขนถ่านคันแรกเกือบชนเกวียนเก่าสามเล่มที่มีคนลากมาจอดขวางรางไว้ บนเกวียนไม่มีอะไร ข้างเกวียนมีคนยืนอยู่สามสิบกว่าคน ผู้หญิง คนแก่ เด็ก หน้าซีดเป็นสีเดียวกับเถ้า

    หญิงคนที่ยืนหน้าสุดตะโกนบอกว่าหมู่บ้านไม่มีถ่านเผาหน้าหนาวมาสองปี ขอแค่ตู้เดียว ไม่ขอทั้งขบวน ถ่านมารที่ขุดขึ้นมาจากใต้เท้าพวกเขาเอง

    โดรัคลงจากตู้คันหน้า เดินมาตามแนวขบวน ตะโกนสั่งยามทุกคนให้ขึ้นนกปืน บอกว่านับถึงสิบแล้วคนพวกนั้นยังไม่หลีก ให้ยิง ยิงจริง ไม่ใช่ยิงขู่ บริษัทไม่จ่ายค่าถ่านที่หายไป
  choices:
    - id: fire_high
      label: ยิงข้ามหัวไปแทน
      text: |
        {name}เล็งปลายปืนสูงกว่าหัวคนที่สูงที่สุดหนึ่งช่วงแขน แล้วลั่นไก ยามอีกสองคนเห็น{name}ยิงสูงก็ทำตาม เสียงปืนสามนัดดังก้องไปทั้งทุ่งเถ้า คนพวกนั้นแตกฮือ ทิ้งเกวียนไว้ให้ยามช่วยกันลากออก

        โดรัครู้ว่าใครยิงสูง เขาไม่ด่า หักค่าจ้างเดือนนั้นของ{name}ไปสองเหรียญ ตอนขบวนแล่นผ่านหมู่บ้านนั้นในขาออก มีเด็กคนหนึ่งยืนอยู่ข้างราง ชูมือขึ้นสูงเหนือหัว นิ้วชี้กับนิ้วโป้งทำเป็นรูปปืน
      effects: { alignment: { moral: 1 }, gold: -2, flags: [fired_over_blockade] }
    - id: fire_true
      label: ยิงตามคำสั่ง
      text: |
        นับถึงเก้า คนพวกนั้นยังไม่หลีก นับถึงสิบ {name}ลั่นไก ควันดินดำบังทุกอย่างอยู่ครู่หนึ่ง พอควันจาง เกวียนเก่าสามเล่มยังจอดอยู่ที่เดิม คนพวกนั้นวิ่งหายไปในทุ่งเถ้าหมดแล้ว เหลือคนหนึ่งนอนอยู่บนเถ้า ไม่รู้ว่าเป็นนัดของใคร

        โดรัคเพิ่มค่าจ้างเดือนนั้นให้ยามทุกคนที่ยิงคนละสามเหรียญ คืนนั้นในตู้นอน ยามคนอื่นหลับกันหมด {name}นั่งทำความสะอาดลำกล้องปืนจนสว่าง ทำซ้ำทั้งที่สะอาดแล้ว
      effects: { alignment: { moral: -2, law: 1 }, gold: 3, flags: [shot_at_blockade] }
    - id: kick_a_sack
      label: แอบถีบกระสอบถ่านลงจากตู้ท้ายตอนโดรัคหันหลัง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ขณะที่โดรัคยังนับเลขอยู่หน้าขบวน {name}ปีนขึ้นตู้ท้ายสุด ถีบกระสอบถ่านลงไปบนเถ้าฝั่งที่มองไม่เห็นจากหัวขบวนสองกระสอบ แล้วโบกมือให้หญิงคนที่ยืนหน้าสุด นางเห็น

          คนพวกนั้นลากเกวียนหลีกให้ก่อนโดรัคจะนับถึงสิบ ไม่มีใครต้องยิง ตอนขบวนแล่นผ่าน กระสอบสองใบหายไปจากเถ้าแล้ว โดรัคนับตู้ครบ ไม่ได้นับกระสอบ
        effects: { stats: { DEX: 1 }, alignment: { moral: 1, law: -1 }, flags: [gave_convoy_coal] }
      failure:
        text: |
          กระสอบใบแรกตกลงบนรางเสียงดังโครม โดรัคหันมาทันเห็น{name}ยืนอยู่บนหลังคาตู้ท้าย ขาข้างหนึ่งยังยกค้าง เขาไม่สั่งยิงคนพวกนั้นแล้ว เขาเดินกลับมาหา{name}แทน

          ค่าจ้างเดือนนั้นหายไปห้าเหรียญ คือค่าถ่านกระสอบหนึ่งบวกค่าเสียเวลา คนพวกนั้นได้กระสอบใบนั้นไป เพราะโดรัคไม่อยากให้ใครลงไปเก็บ เดินลงไปบนเถ้าใกล้คนหิวสามสิบคน
        effects: { gold: -5, alignment: { moral: 1 }, flags: [gave_convoy_coal, doraq_watches_you] }

- id: adult.job_smuggler_crate
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_smuggler]
  text: |
    งานคืนนั้นเป็นลังไม้ใบเดียว ยาวเท่าคน เจาะรูไว้ที่ฝาสามรู หนูท่าให้ค่าจ้างสามเท่าของงานปกติ บอกว่าลังใบนี้ต้องออกนอกกำแพงเมืองทางประตูโรงฟอกหนังก่อนไก่ขัน และห้ามเปิด

    ที่ประตูโรงฟอกหนังคืนนั้นมีคนยืนเพิ่มจากยามปกติหนึ่งคน เสื้อคลุมสีขาวขลิบทอง ตะเกียงแขวนห้อยอยู่ที่เข็มขัด เป็นคนของศาสนจักรตะเกียง เขาไม่ได้ตรวจเกวียน เขาแค่ยืนดู

    ระหว่างที่{name}เข็นเกวียนเข้าไปต่อคิว ในลังมีเสียงสะอื้นเบาๆ ดังขึ้นครั้งหนึ่ง แล้วเงียบไปเหมือนมีมือปิดปาก
  choices:
    - id: talk_past
      label: เข็นเข้าไปต่อคิว แล้วคุยกับยามเหมือนคนส่งหนังทุกคืน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}บ่นเรื่องกลิ่นโรงฟอกหนังกับยามจนยามหัวเราะ แล้วถามถึงเมียยามที่ไม่เคยเจอหน้า ยามเล่าว่าเมียเพิ่งคลอดลูกคนที่สาม คนของศาสนจักรฟังอยู่ข้างๆ หันไปมองทางอื่นตอนยามเล่าเรื่องรกเด็ก

          เกวียนผ่านประตูไปได้ เลยกำแพงไปสองร้อยก้าว มีคนสองคนยืนรออยู่ใต้ต้นมะเดื่อ เปิดฝาลังออกก่อน{name}จะได้ถาม ในลังเป็นเด็กหญิงอายุสักแปดขวบ มีเขาสั้นๆ คู่หนึ่ง เธอหลับไปแล้ว มือยังกำปากตัวเองไว้
        effects: { stats: { CHA: 1 }, reputation: { dock_rats: 1 }, gold: 6, flags: [smuggled_horned_child] }
      failure:
        text: |
          คนของศาสนจักรเดินมาหยุดข้างเกวียนตอนยามกำลังจะโบกมือให้ผ่าน เขาเคาะฝาลังสองครั้ง เบาๆ แล้วเอียงหูฟัง ในลังเงียบ {name}เงียบ ยามก็เงียบ

          เขาสั่งให้เปิด {name}ไม่เปิด เขาสั่งยามให้จับ{name}ไปขังในห้องยามทั้งคืน ส่วนลังใบนั้นเขาให้คนของเขาเข็นไปเอง ตอนสาง หนูท่าส่งคนมาจ่ายค่าไถ่ตัว{name}ครบโดยไม่ต่อรอง ไม่มีใครพูดถึงลังใบนั้นอีกเลย
        effects: { hp: -1, stats: { CON: 1 }, reputation: { dock_rats: 1, lamp_church: -1 }, flags: [smuggler_caught] }
    - id: sewer_route
      label: ออกจากคิว ไปเข็นลังลอดท่อน้ำทิ้งใต้กำแพงแทน
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ท่อน้ำทิ้งใต้กำแพงสูงแค่อก น้ำครำเย็นเฉียบถึงเข่า {name}แบกลังขึ้นบ่าแทนเข็นเกวียน ก้มตัวเดินไปทีละก้าว ลังหนักขึ้นทุกครั้งที่ก้าว และในลังเริ่มสั่น {name}เคาะฝาลังเบาๆ เป็นจังหวะเพลงกล่อมเด็กที่ร้องได้ท่อนเดียว ลังหยุดสั่น

          พ้นปากท่อไปอีกฝั่งกำแพง มีคนรอรับอยู่สองคน คนหนึ่งเปิดลังให้ดูว่าข้างในเป็นอะไร{name}จะได้ไม่ต้องถามคนอื่น เด็กหญิงมีเขาคนหนึ่งยื่นมือออกมาจับฝาลัง แล้วเคาะเป็นจังหวะเดียวกับที่{name}เคาะ
        effects: { stats: { DEX: 1 }, reputation: { dock_rats: 1 }, gold: 6, flags: [smuggled_horned_child, knows_sewer_route] }
      failure:
        text: |
          ครึ่งทางในท่อ {name}ลื่นล้มลงไปทั้งตัว ลังกระแทกผนังท่อจนฝาเปิด น้ำครำทะลักเข้าไปในลัง เด็กในลังกรีดร้องขึ้นมาทีเดียว {name}เอามือปิดปากเด็กไว้ ทั้งคู่นั่งแช่น้ำครำในความมืดฟังเสียงเท้ายามเดินผ่านปากท่อไปและกลับ

          สองคนคลานออกจากท่อได้ตอนฟ้าสาง เด็กไม่เป็นอะไร นอกจากไข้ที่ขึ้นมาในตอนบ่าย {name}ไข้ขึ้นนานกว่า สิบวัน
        effects: { hp: -2, stats: { CON: 1 }, reputation: { dock_rats: 1 }, gold: 3, flags: [smuggled_horned_child] }
    - id: show_her_horns
      label: เปิดฝาลังนิดหนึ่ง ให้คนข้างในเห็นว่าคนเข็นก็มีเขา
      requires: { trait: demon_mark }
      text: |
        {name}หยุดเกวียนในเงาโรงฟอกหนัง แง้มฝาลังขึ้นนิ้วเดียว แล้วก้มหัวลงไปให้คนข้างในเห็นเขาบนหัวตัวเองในแสงจันทร์ ในลังเป็นเด็กหญิงอายุราวแปดขวบ เธอหยุดสะอื้น ยื่นนิ้วออกมาแตะปลายเขาของ{name}แล้วชักกลับ

        ตลอดทางที่เหลือในลังไม่มีเสียงอีก ผ่านประตูไปได้เพราะคนของศาสนจักรหันไปดูเกวียนเหล้าที่ล้อหลุด ไม่ใช่เพราะฝีมือใคร เลยกำแพงไปมีคนรอรับ ก่อนฝาลังจะปิด เด็กคนนั้นถามชื่อ{name} แล้วท่องตามสามครั้ง
      effects: { stats: { WIS: 1 }, reputation: { dock_rats: 1 }, gold: 6, flags: [smuggled_horned_child] }

- id: adult.job_bank_spy_cooper
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_bank_spy]
  text: |
    ชื่อที่ชายเสื้อเทาส่งมาให้คราวนี้เป็นช่างทำถังไม้ชื่อเบรนดัล เมียตายเมื่อหน้าหนาว ลูกสองคนอายุห้ากับเจ็ดขวบ ติดหนี้วิหารเบเลคสี่สิบเหรียญจากค่ายาของเมีย ผ่อนมาไม่เคยขาดจนถึงเดือนที่แล้ว

    {name}เฝ้าดูร้านถังไม้มาสิบสองวัน เห็นเบรนดัลขายเครื่องมือไปทีละชิ้น ขายกบไสไม้ ขายสิ่ว ขายเลื่อย เมื่อวานเขาไปถามคนเกวียนว่าขบวนไหนออกไปทางป่าไอเลธ คืนพรุ่งนี้ขบวนนั้นออก

    ชายเสื้อเทานัดเจอ{name}พรุ่งนี้ตอนเที่ยง ที่โต๊ะเดิมในโรงเตี๊ยม ชาถ้วยเดียวเหมือนเดิม
  choices:
    - id: report_cooper
      label: รายงานครบทุกอย่างตามที่เห็น
      text: |
        {name}เล่าเรื่องเครื่องมือที่ขายทีละชิ้น เรื่องขบวนเกวียน และเรื่องคืนพรุ่งนี้ ชายเสื้อเทาฟังจบแล้วเลื่อนเหรียญมาให้ห้าเหรียญ ไม่มีคำชม ไม่มีคำถาม

        คืนต่อมา คนของวิหารไปยืนรอเบรนดัลกับลูกที่ลานขบวนเกวียน ไม่มีใครต้องใช้แรง เบรนดัลเดินกลับร้านเองพร้อมลูกทั้งสอง หนี้ของเขาไม่ได้ขึ้นแม้แต่เหรียญเดียว แต่วันหลังจากนั้น{name}เห็นเขานั่งข้างเตาในร้านทั้งที่แดดร้อน มือสองข้างกุมไว้ที่อก เหมือนคนหนาว
      effects: { alignment: { law: 1, moral: -1 }, reputation: { belek_bank: 1 }, gold: 5, flags: [reported_the_cooper] }
    - id: warn_cooper
      label: ไปหาเบรนดัลคืนนี้ บอกว่าธนาคารรู้แล้ว
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ไปเคาะประตูหลังร้านตอนเที่ยงคืน บอกเบรนดัลว่าขบวนคืนพรุ่งนี้มีคนรู้แล้ว ให้ไปคืนนี้กับคนเลี้ยงแพะที่ออกจากประตูตะวันตกตอนสาง ไม่ต้องบอกใคร เบรนดัลไม่ถามว่า{name}เป็นใคร

          ตอนเที่ยง{name}นั่งรายงานชายเสื้อเทาว่าเบรนดัลยังอยู่ในร้าน เพิ่งเห็นตอนเช้า ชายเสื้อเทาจดลงสมุด แล้วกวาดตามองหน้า{name}ครั้งเดียว ตอนบ่ายคนของวิหารไปที่ร้านถังไม้ ร้านว่าง ประตูหลังไม่ได้ลงกลอน
        effects: { stats: { CHA: 1 }, alignment: { moral: 1, law: -1 }, flags: [warned_the_cooper] }
      failure:
        text: |
          เบรนดัลไปจากร้านคืนนั้นตามที่{name}บอก แต่ชายเสื้อเทารู้ก่อนเที่ยงว่ามีคนบอก เขาไม่ต้องมีใครมาเล่า เขาแค่รู้ว่าเบรนดัลไม่มีเหตุให้เปลี่ยนแผนกลางคัน นอกจากมีคนไปเคาะประตู

          ตอนเที่ยงเขาไม่ได้เลื่อนเหรียญมาให้ เขาเลื่อนกระดาษมาแผ่นหนึ่ง เป็นสัญญาค่าปรับสิบเหรียญ ลงชื่อแล้วงานยังเป็นของ{name} ไม่ลงชื่อก็ไม่ต้องมาอีก {name}ลงชื่อ ปลายนิ้วเย็นวาบขึ้นมาทีหนึ่งตอนวางปากกา
        effects: { gold: -10, alignment: { moral: 1 }, reputation: { belek_bank: -1 }, flags: [warned_the_cooper, belek_suspects_you] }
    - id: report_late
      label: รายงานตามจริงทุกอย่าง แต่เลื่อนวันขบวนออกไปหนึ่งวัน
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}บอกชายเสื้อเทาว่าขบวนออกคืนมะรืน ไม่ใช่คืนพรุ่งนี้ พูดช้าๆ เหมือนคนที่ไม่ค่อยแน่ใจเรื่องวันเวลา เขาจดลงสมุด คืนมะรืนคนของวิหารไปรอที่ลานขบวนเกวียน ขบวนไปตั้งแต่คืนก่อนแล้ว

          ชายเสื้อเทาเรียก{name}ไปพบ บอกว่าคนที่จำวันผิดหนึ่งครั้ง ธนาคารถือว่าจำวันผิด ถ้าผิดครั้งที่สอง ธนาคารจะถือว่าไม่ได้ผิด แล้วยังจ่ายค่าจ้างให้ครบเหมือนทุกเดือน
        effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, gold: 3, flags: [warned_the_cooper] }
      failure:
        text: |
          {name}บอกว่าขบวนออกคืนมะรืน ชายเสื้อเทาไม่จด เขาบอกว่าคนเกวียนของขบวนป่าไอเลธกินข้าวที่ร้านของน้องเมียเขาทุกคืน ขบวนออกคืนพรุ่งนี้ เขารู้มาตั้งแต่เมื่อวาน อยากรู้แค่ว่า{name}จะพูดว่าอะไร

          คืนพรุ่งนี้คนของวิหารไปยืนรอที่ลานขบวนเกวียนตามเวลาที่ถูก ค่าจ้างเดือนนั้นของ{name}ไม่มา และจากนั้นมา งานทุกชิ้นที่ชายเสื้อเทาส่งมาจะมีอีกคนเฝ้าคนเดียวกันอยู่ด้วยเสมอ
        effects: { alignment: { moral: -1 }, reputation: { belek_bank: -1 }, flags: [reported_the_cooper, belek_suspects_you] }

- id: adult.job_swindler_widow
  stage: adult
  weight: 45
  when:
    age: [19, 24]
    flags: [job_swindler]
  text: |
    บ้านหลังนั้นอยู่ปลายถนนสายที่เคยเป็นย่านขุนนางเก่า ก่อนเจ้าของโรงงานจะมาซื้อบ้านฝั่งตรงข้ามไปทีละหลัง เจ้าของบ้านเป็นหญิงม่ายชื่อเลดีอิสเวล อายุเจ็ดสิบกว่า อยู่คนเดียวกับคนรับใช้แก่หนึ่งคน ขายเครื่องเงินในตู้ไปแล้วสองในสาม

    เรื่องที่{name}เตรียมมาคือหุ้นทุ่งจานรับดาวทางเหนือ กระดาษหุ้นพิมพ์ตราหัวสิงห์ซื้อมาจากร้านพิมพ์หลังท่าเรือ ใครซื้อหุ้นก็ได้ส่วนแบ่งน้ำค้างดาวทุกคืนฟ้าเปิด ทุ่งนั้นไม่มีอยู่จริง

    นั่งคุยกันมาสามบ่าย เลดีอิสเวลรินชาให้เองทุกครั้ง ถามเรื่องครอบครัวของ{name}ที่{name}แต่งขึ้น และจำทุกชื่อที่{name}พูดได้แม่นกว่า{name}เอง วันนี้นางบอกว่าพร้อมจะซื้อ ยี่สิบหุ้น
  choices:
    - id: close_it
      label: ปิดการขาย รับเงิน แล้วไม่กลับมาอีก
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          เลดีอิสเวลนับเหรียญจากกล่องไม้ใต้เตียงให้สิบสองเหรียญ เหรียญเงินแท้ทุกเหรียญ ตราเก่ารุ่นพระเจ้าตาของกษัตริย์องค์นี้ นางยื่นให้ด้วยมือทั้งสองข้าง แล้วขอบคุณที่{name}มานั่งคุยด้วยสามบ่าย

          {name}เดินออกจากถนนสายนั้นโดยไม่หันกลับ ขายเหรียญเงินตราเก่าได้ราคาดีกว่าเหรียญใหม่ในร้านรับซื้อของเก่าย่านท่าเรือ คนรับซื้อถามว่าได้มาจากไหน {name}บอกว่าเป็นมรดกยาย
        effects: { stats: { CHA: 1 }, alignment: { moral: -1 }, gold: 12, flags: [conned_the_widow] }
      failure:
        text: |
          เลดีอิสเวลวางกระดาษหุ้นลงบนโต๊ะ ใช้นิ้วชี้กดตรงตราหัวสิงห์ บอกว่าร้านพิมพ์หลังท่าเรือใช้หมึกแบบนี้มาตั้งแต่สามีนางยังมีชีวิต สามีนางก็เคยซื้อหุ้นทุ่งทางเหนือมาสองครั้ง

          นางไม่เรียกยาม นางให้คนรับใช้ไปเปิดประตูหน้า ระหว่างที่{name}เดินลงบันไดหน้าบ้าน นางพูดตามหลังมาว่าเรื่องแม่ที่ป่วยของ{name}เป็นเรื่องที่แต่งได้ดีที่สุด ถ้าเป็นเรื่องจริงนางจะซื้อให้ห้าสิบหุ้น
        effects: { stats: { WIS: 1 }, gold: -2, flags: [widow_saw_through] }
    - id: just_tea
      label: บอกว่าทุ่งนั้นน้ำท่วม หุ้นขายไม่ได้แล้ว แล้วนั่งดื่มชาต่อ
      text: |
        {name}บอกว่าเมื่อวานได้ข่าวว่าทุ่งจานรับดาวทางเหนือโดนน้ำป่าพัดไปครึ่งทุ่ง ใครซื้อตอนนี้ขาดทุนแน่ เลดีอิสเวลวางถ้วยชาลง บอกว่าเสียดาย แล้วรินชาให้อีกถ้วย

        บ่ายนั้นนางเล่าเรื่องสามีที่ตายไปยี่สิบปีให้ฟังจนตะวันตก ก่อน{name}กลับ นางถอดเครื่องรางเงินรูปโล่ใบเท่าเล็บออกจากคอ บอกว่าสามีพกติดตัวทุกครั้งที่ออกรบ กระสุนไม่เคยโดนเขาสักนัด นางไม่ต้องใช้มันแล้ว เพราะไม่มีใครยิงหญิงแก่
      effects: { alignment: { moral: 1 }, items: [bullet_charm], flags: [kept_the_widow_company] }
    - id: rival_con
      label: บอกนางตรงๆ ว่ามีนักต้มตุ๋นอีกคนกำลังจะมาที่บ้านนี้
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}รู้มาตั้งแต่บ่ายแรกว่ามีอีกคนเล็งบ้านนี้อยู่ เป็นชายผมทาน้ำมันที่มาคุยกับคนรับใช้แก่ทุกเช้าเรื่องที่ดินหลังบ้าน {name}เล่าให้เลดีอิสเวลฟังทั้งหมด เรื่องหุ้นของตัวเองด้วย ไม่ปิดบังสักบรรทัด

          นางฟังจนจบ แล้วหัวเราะจนต้องวางถ้วยชา บอกว่าอายุเจ็ดสิบกว่าแล้ว เพิ่งมีคนมาแย่งกันโกงนางเป็นครั้งแรก พรุ่งนี้เช้า{name}ไปยืนรอชายผมทาน้ำมันที่ประตูหลังบ้าน เขาไม่กลับมาที่ถนนสายนั้นอีก เลดีอิสเวลส่งคนไปเรียก{name}มาดื่มชาทุกบ่ายวันอีเซล
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [widow_tea_friend] }
      failure:
        text: |
          {name}เล่าเรื่องชายผมทาน้ำมันให้นางฟัง แต่เล่าข้ามเรื่องหุ้นของตัวเองไป นางฟังจนจบ แล้วถามว่าทำไม{name}ถึงรู้เรื่องนักต้มตุ๋นดีนัก {name}ตอบช้าไปครึ่งลมหายใจ

          นางไม่ได้ไล่ แต่ไม่ได้ซื้อหุ้น บ่ายวันต่อมาคนรับใช้แก่บอกที่ประตูว่านายหญิงไม่สบาย บ่ายวันต่อมาก็ไม่สบาย {name}ไม่ได้เข้าบ้านหลังนั้นอีก ชายผมทาน้ำมันก็ไม่ได้เข้าเหมือนกัน
        effects: { stats: { WIS: 1 }, flags: [widow_closed_door] }
