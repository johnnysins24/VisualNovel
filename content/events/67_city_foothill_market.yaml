# ชุด ม เมือง: ตลาดตีนเขา (foothill_market ถิ่น hordun) แปดเรื่องตามแบบ "แปดเรื่องของหนึ่งเมือง"
# ย่าน: inn_row แถวโรงเตี๊ยม (คนมาใหม่ลงที่นี่ เป็นของคนอาร์เวล) · coal_yard ลานถ่าน (ของพ่อค้าถ่านมาร) · rail_end ปลายราง (ของคนงานที่ลงมาจากเหมือง)
# หน้าเดิมของเมือง: เวอร์นา เจ้าของโรงเตี๊ยมสามปล่อง
# ทุกอย่างในเมืองมีฝุ่นสีสนิมเกาะ คนแคระกับคนอาร์เวลนั่งโต๊ะเดียวกันโดยไม่ต้องชอบหน้ากัน

# ---------- a ข้อเสนอให้ย้าย: คนจากทุนดาร์ลงเขามาแล้วขึ้นไม่ได้ ----------
- id: adult.city_foothill_market_offer
  stage: adult
  weight: 12
  scene: station
  when:
    age: [19, 56]
    city: tundar
    not_flags: [institute_student, left_the_fort, deserted_the_fort, sold_the_fort, job_navy, job_wardens, job_fort_priest, job_mercenary, job_smuggler, job_bank_spy, job_swindler, job_researcher, job_house_singer, job_hedge_doctor, job_city_priest, job_farmer, job_miner, job_refinery_hand, job_docker, job_clerk, job_bough_crafter]
    # คนของไส้ตะเกียงกับคนในสายงานของอาณาจักรไม่ย้ายเมืองไปหางาน (ชุด อ)
    not_orgs: [wick, crown_office, crown_army, crown_court]
  text: |
    รถไฟไต่เขาลงถึงตลาดตีนเขาตอนบ่าย {name}ลงมาด้วยธุระที่ตั้งใจให้จบในวันเดียว แล้วขึ้นขบวนเย็นกลับ ขบวนเย็นไม่ออก ฟันเฟืองรางช่วงขั้นที่สามหักไปสองซี่ นายสถานีปลายรางเขียนบนกระดานว่าซ่อมสามวัน แล้วเขียนเพิ่มข้างล่างตัวเล็กกว่าว่าอาจห้า

    ตลาดตีนเขามีฝุ่นสีสนิมเกาะทุกอย่าง ขอบหน้าต่าง ขนล่อ ขนตาคน ผ้าปูที่นอนของโรงเตี๊ยมซักแล้วยังเป็นสีชมพูซีด ตอนค่ำคนแคระที่ขนถ่านลงมากับคนอาร์เวลที่ขนข้าวขึ้นไปนั่งโต๊ะยาวตัวเดียวกัน ต่างคนต่างกิน หันไหล่เข้าหากัน ไม่มีใครย้ายโต๊ะ เพราะโรงเตี๊ยมมีโต๊ะยาวตัวเดียว

    วันที่สาม พ่อค้าถ่านคนหนึ่งในลานถ่านถาม{name}ว่าหางานอยู่หรือเปล่า เขาต้องการคนนอนเฝ้ากองถ่านกลางคืน ห้องใต้หลังคาโรงชั่งถ่านว่างมาตั้งแต่คนเก่าไอจนต้องลงไปอยู่กับลูกที่ราบ ส่วนหญิงที่ทำบัญชีให้โรงเตี๊ยมบอก{name}ตอนเก็บชามว่าห้องหลังบ้านนางก็ว่าง นางเก็บค่าเช่าเมื่อครบรอบสัญญา ข้างบนกับข้างล่างไม่ต่างกันในเรื่องนี้
  choices:
    - id: loft_over_the_coal_yard
      label: รับห้องใต้หลังคาโรงชั่งถ่าน แลกกับนอนเฝ้ากองถ่านกลางคืน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          คืนแรกพ่อค้าถ่านพา{name}เดินรอบลาน สอนให้ฟังเสียงกอง กองที่เงียบคือกองดี กองที่มีเสียงแตกเปาะเบาๆ จากข้างในต้องเขี่ยก่อนรุ่ง {name}นั่งบนลังไม้หน้าโรงชั่งจนสาง ควันสีสนิมผ่านหน้าไปทั้งคืน ไม่ไอสักครั้ง

          ของจากห้องข้างบนลงมากับขบวนแรกที่ซ่อมเสร็จ ค่าขนเที่ยวเดียวหนึ่งเหรียญ ห้องใต้หลังคามีหน้าต่างบานเดียวหันไปทางเขา กลางคืนมองเห็นไฟเตาของเมืองข้างบนเรียงขึ้นไปเป็นขั้นจนถึงปล่องสุดท้าย
        effects: { stats: { CON: 1 }, gold: -1, city: { move: foothill_market, district: coal_yard, home: room }, mark: ย้ายไปตลาดตีนเขา, flags: [moved_to_foothill_market, took_the_coal_yard_loft] }
      failure:
        text: |
          คืนที่ลมนิ่ง ควันจากกองถ่านไม่ลอยขึ้น ควันนอนต่ำอยู่ระดับเข่า แล้วค่อยๆ ขึ้นมาถึงคอ {name}ไอจนต้องลุกไปยืนที่ประตูลาน ตอนสางพ่อค้าถ่านเอาผ้าชุบน้ำมาให้ผืนหนึ่ง บอกว่าทุกคนไอเดือนแรก แล้วจ้างต่อ

          ของจากห้องข้างบนลงมากับขบวนแรกที่ซ่อมเสร็จ ค่าขนเที่ยวเดียวหนึ่งเหรียญ ผ้าชุบน้ำผืนนั้นแขวนอยู่ที่ขอบหน้าต่างห้องใต้หลังคา กลายเป็นสีสนิมภายในสามวัน
        effects: { hp: -1, gold: -1, city: { move: foothill_market, district: coal_yard, home: room }, mark: ย้ายไปตลาดตีนเขา, flags: [moved_to_foothill_market, took_the_coal_yard_loft] }
    - id: room_on_inn_row
      label: เช่าห้องหลังบ้านหญิงทำบัญชีในแถวโรงเตี๊ยม
      text: |
        ค่าขนของลงเขากินเงินไปสองเหรียญ เพราะเที่ยวแรกนายสถานีวางลังของ{name}ผิดตู้ ลังไปถึงปลายรางก่อน แล้วต้องจ้างคนลากกลับมาแถวโรงเตี๊ยมอีกเที่ยว ห้องหลังบ้านมีหน้าต่างหันเข้าหาลานหลังโรงเตี๊ยม ทุกเช้าเสียงล้างหม้อดังขึ้นมาก่อนไก่

        หญิงทำบัญชีจดตัวเลขที่โต๊ะในครัว ตัวเลขของคนแคระกับตัวเลขของคนอาร์เวลอยู่คนละหน้า ใช้หมึกคนละสี {name}ถามว่าทำไม นางบอกว่าทั้งสองฝั่งชอบให้เป็นแบบนั้น
      effects: { gold: -2, city: { move: foothill_market, district: inn_row, home: room }, mark: ย้ายไปตลาดตีนเขา, flags: [moved_to_foothill_market, took_the_inn_row_room] }
    - id: ride_back_up
      label: รอจนรางซ่อมเสร็จ แล้วขึ้นขบวนแรกกลับข้างบน
      text: |
        ขบวนแรกออกในวันที่ห้า ตู้แน่นด้วยคนที่ติดอยู่ข้างล่างเหมือนกัน รถไฟไต่ขึ้นทีละขั้น ทุกครั้งที่ฟันเฟืองขบรางช่วงที่เพิ่งซ่อม ทั้งตู้เงียบฟัง

        ถึงข้างบนตอนค่ำ แขนเสื้อของ{name}ยังมีฝุ่นสีสนิมของตลาดตีนเขาติดมา ปัดไม่ออก ต้องรอซัก
      effects: { flags: [rode_back_up_the_mountain] }

# ---------- b ย่าน: ลานถ่าน ----------
- id: adult.city_foothill_market_smoulder
  stage: adult
  weight: 33
  when:
    age: [19, 64]
    city: foothill_market
  text: |
    ลานถ่านคือที่ที่ถ่านมารจากเหมืองบนเขาลงมาพักก่อนขึ้นรถไฟไปที่ราบ กองถ่านสูงเท่าหลังคาบ้านเรียงเป็นแถว พ่อค้าแต่ละคนปักป้ายไม้ชื่อตัวเองไว้ที่ตีนกอง คนลานถ่านรู้ว่าถ่านมารที่กองไว้นานเกินไปจะอุ่นขึ้นเองจากข้างใน ไม่มีใครจุด ไม่มีลมพาไฟมา ถ่านแค่จำได้ว่าเคยร้อน

    เช้านี้กองที่สี่จากประตูลานมีควันบางๆ ออกจากยอด หินที่โรยรอบตีนกองอุ่นจนแมวของลานมานอนเรียงกัน พ่อค้าเจ้าของกองลงไปที่ราบตั้งแต่สัปดาห์ก่อน ลูกจ้างที่ทิ้งไว้เฝ้าเป็นเด็กหนุ่มคนเดียว ยืนถือคราดเหล็กด้ามยาวอยู่หน้ากอง ไม่รู้จะเริ่มตรงไหน

    ถ้ากองลุก ไฟจะวิ่งไปตามผงถ่านบนพื้นถึงกองข้างๆ ทั้งแถวมีแปดกอง
  choices:
    - id: rake_it_open
      label: รับคราดจากเด็กหนุ่ม ปีนขึ้นไปเปิดยอดกองให้ความร้อนออก
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}เปิดยอดกองทีละคราด ถ่านข้างในยิ่งลึกยิ่งแดง ตรงกลางมีก้อนหนึ่งแดงจนเห็นแสงตอนกลางวัน เด็กหนุ่มลากถ่านที่{name}คราดลงมาเกลี่ยบางๆ บนลานหินให้ลมเลีย ตกบ่ายกองที่เคยสูงเท่าหลังคาเหลือสูงแค่อก ควันหยุด

          ตอนค่ำพ่อค้ากองข้างๆ เดินมาดูรอยคราด แล้วไปบอกพ่อค้าคนอื่นในแถว เช้าวันต่อมามีคราดของคนอื่นพิงอยู่หน้าห้องของ{name}สองอัน เจ้าของขอให้ช่วยดูกองของเขาด้วย
        effects: { stats: { CON: 1 }, city: { merit: 1 }, flags: [raked_the_smouldering_pile] }
      failure:
        text: |
          ยอดกองยุบลงใต้เท้า{name}ตอนคราดเที่ยวที่สาม ขาข้างหนึ่งจมลงไปถึงเข่าในถ่านที่อุ่นจนพื้นรองเท้าเริ่มมีกลิ่น เด็กหนุ่มดึง{name}ออกมาได้ก่อนขากางเกงจะติดไฟ

          คนลานถ่านมากันครบตอนเที่ยง เกลี่ยกองจนเย็นก่อนค่ำ หน้าแข้งของ{name}แดงพองเป็นแถบยาว ต้องพันผ้าชุบไขสัตว์อยู่ครึ่งเดือน
        effects: { hp: -2, flags: [scorched_on_the_coal_pile] }
    - id: yard_rakes
      label: เคาะประตูคนลานถ่านทีละห้อง ให้ทุกคนเอาคราดของตัวเองออกมาแบ่งกอง
      requires: { city: { district: [coal_yard] } }
      text: |
        คนลานถ่านเปิดประตูให้{name} เพราะ{name}เป็นคนลานถ่าน ไม่ถึงชั่วโมงหน้ากองที่สี่มีคราดสิบสองอัน ทุกคนรู้หน้าที่ สี่คนเปิดยอด สี่คนลาก สี่คนเกลี่ย กองเดียวแตกเป็นแปดกองเตี้ยๆ บนลานหินก่อนเที่ยง

        ธรรมเนียมของลานคือคนที่เรียกคนมาช่วยต้องเลี้ยงเหล้า {name}จ่ายค่าเหล้าที่แถวโรงเตี๊ยมไปหนึ่งเหรียญ พ่อค้าเจ้าของกองกลับจากที่ราบในสัปดาห์ต่อมา ไม่ได้ขอบใจใคร แต่มีเหล้าข้าวโพดหนึ่งไหวางอยู่หน้าห้องของ{name}ตอนเช้า ฝาไหมีฝุ่นสีสนิมเกาะแล้ว
      effects: { gold: -1, city: { merit: 1 }, flags: [split_the_pile_with_yard_rakes] }
    - id: buy_the_hot_core
      label: ขอซื้อก้อนแดงกลางกองจากเด็กหนุ่มในราคาถ่านเสีย
      text: |
        เด็กหนุ่มขายให้หนึ่งเหรียญ ดีใจที่ไม่ต้องอธิบายให้พ่อค้าฟังเรื่องก้อนที่หายไป {name}ใช้คีมคีบใส่หม้อเหล็กหิ้วกลับห้อง ก้อนเดียวต้มน้ำได้ทั้งเดือนโดยไม่ต้องเติม กองที่สี่ไม่มีควันอีก

        ตั้งแต่หม้อเหล็กใบนั้นวางข้างเตียง {name}ฝันเรื่องเดียวซ้ำทุกคืน ห้องมืดไม่มีผนัง กับเสียงทุ้มจนพื้นสั่นอยู่ข้างใต้ พูดคำเดียวซ้ำเหมือนคนที่เหนื่อยแล้วแต่ยังไม่ยอมหยุด ทุกเช้าที่ตื่น ถ่านในหม้อยังแดง
      effects: { gold: -1, flags: [kept_a_hot_core_coal] }

# ---------- c ย่าน: ปลายราง ----------
- id: adult.city_foothill_market_dead_mans_slate
  stage: adult
  weight: 33
  scene: tavern
  when:
    age: [19, 64]
    city: foothill_market
  text: |
    ปลายรางเป็นของคนที่ลงมาจากเหมือง ขบวนสุดท้ายของวันพาคนงานกะเช้าลงมาถึงตอนค่ำ หน้าดำ มือดำ ไอเป็นสีสนิม โรงข้าวของปลายรางมีห้าโรง ทุกโรงมีแผ่นหินชนวนแขวนเรียงบนหมุดที่ผนังหลังเตา คนละแผ่น ชื่อเขียนด้วยดินขาวไว้หัวแผ่น ข้างล่างเป็นขีดค่าข้าวที่ติดไว้ จ่ายเมื่อบริษัทเหมืองจ่ายค่าแรง

    บริษัทไม่ได้จ่ายมาสามเดือน แผ่นหินในโรงข้าวหลังที่สองขีดจนดินขาวไม่มีที่ลง เจ้าของโรงเป็นหญิงอาร์เวลแขนอ้วน ขีดใหม่ทับขีดเก่าเป็นตารางเล็กๆ

    เมื่อวานคนงานคนหนึ่งตกปล่องลมที่ชั้นแปด แผ่นหินของเขายังแขวนอยู่แถวที่สี่ ธรรมเนียมของปลายรางคือแผ่นหินของคนตายต้องแตก คนที่อยู่ใต้หลังคาเดียวกับเขาเอาไปทุบที่บันไดหน้าโรง หนี้ไปกับคน แต่เจ้าของโรงยังไม่ยกลง นางยืนเช็ดมือกับผ้ากันเปื้อนอยู่หน้าผนัง คนงานที่กินอยู่เต็มโรงก้มหน้ากินต่อ
  choices:
    - id: put_a_coin_on_it
      label: วางเหรียญหนึ่งเหรียญบนโต๊ะใต้แผ่นหินของเขา
      requires: { min_gold: 1 }
      text: |
        เหรียญของ{name}ลบขีดได้ไม่ถึงครึ่ง เจ้าของโรงหยิบเหรียญไป แล้วยกแผ่นหินลงจากหมุดด้วยมือตัวเอง คนงานโต๊ะใกล้ประตูลุกขึ้นทีละคน วางของไว้ข้างที่เหรียญของ{name}เคยอยู่ ทองแดงบ้าง ตะปูบ้าง ยาเส้นครึ่งห่อบ้าง จนขีดหมด

        แผ่นหินแตกบนบันไดหน้าโรงก่อนรถไฟกะดึกขึ้นเขา เศษชิ้นที่มีตัวอักษรตัวแรกของชื่อมีคนเก็บใส่กระเป๋าไป
      effects: { gold: -1, city: { merit: 1 }, flags: [paid_on_a_dead_miners_slate] }
    - id: break_it_on_the_step
      label: ยกแผ่นหินลงจากหมุดเอง ถือออกไปทุบที่บันไดตามธรรมเนียมของปลายราง
      requires: { city: { district: [rail_end] } }
      text: |
        คนปลายรางรู้ว่าใครมีสิทธิ์แตะแผ่นหินของคนตาย ทุกคนที่นอนใต้หลังคาปลายรางเดียวกับเขา เจ้าของโรงเห็นมือของ{name}เอื้อมขึ้นไปที่หมุด แล้วถอยออกไปหนึ่งก้าว ไม่ได้ห้าม

        แผ่นหินแตกเป็นสามชิ้นบนบันไดหน้าโรง คนงานทั้งโรงถือชามออกมายืนดู คืนนั้นผนังหลังเตามีหมุดว่างหนึ่งหมุด เจ้าของโรงไม่ได้แขวนแผ่นใหม่แทน
      effects: { city: { merit: 1 }, flags: [broke_the_dead_miners_slate] }
    - id: take_it_to_the_clerk
      label: ถือแผ่นหินไปวางบนโต๊ะเสมียนบริษัทเหมือง ให้บริษัทจ่ายแทนคนที่ตายในงานของบริษัท
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          เสมียนบริษัทนั่งหลังลูกกรงเหล็กในโรงไม้ข้างสถานี {name}วางแผ่นหินลงบนโต๊ะแรงพอให้หมึกกระฉอก แล้วอ่านขีดให้ฟังทีละขีด คนงานที่ตามมามุงที่ประตูนับตามเสียงดังจนเสมียนต้องยกมือ

          เขาจ่ายจากหีบบริษัทเท่าจำนวนขีด แล้วจดลงสมุดว่าค่าทำศพ คนงานถือแผ่นหินกลับไปทุบที่บันไดโรงข้าว เศษชิ้นหนึ่งกระเด็นไปตกบนราง
        effects: { stats: { CHA: 1 }, flags: [made_the_company_pay_the_slate] }
      failure:
        text: |
          เสมียนบริษัทไม่ก้มดูแผ่นหิน บอกว่าบริษัทไม่มีบัญชีกับโรงข้าว แล้วเรียกยามสองคนจากหลังโรง ยามพา{name}ออกทางบันได ขั้นสุดท้ายเท้าไม่ถึงพื้น

          แผ่นหินแตกไปเองตอน{name}ล้ม ไม่ได้แตกบนบันไดโรงข้าวตามธรรมเนียม เจ้าของโรงข้าวเก็บเศษไปใส่ถ้วยไว้บนหิ้งหลังเตา
        effects: { hp: -1, flags: [thrown_out_of_the_company_office] }
    - id: walk_past
      label: กินข้าวให้หมดชาม จ่ายของตัวเองเป็นเหรียญ แล้วกลับก่อนรถไฟกะดึก
      text: |
        เจ้าของโรงรับเหรียญของ{name} แล้วเช็ดมือกับผ้ากันเปื้อนต่อ ตอน{name}เดินออกจากโรง แผ่นหินแถวที่สี่ยังแขวนอยู่บนหมุด

        สามวันต่อมาแผ่นหินแผ่นนั้นยังอยู่ที่เดิม ใต้ขีดสุดท้ายมีขีดใหม่เพิ่มขึ้นอีกหนึ่งขีด ดินขาวยังสด
      effects: { flags: [walked_past_the_dead_mans_slate] }

# ---------- d เรื่องเริ่มตึง: ราคาถ่านบนกระดาน (ไม่มีกรอบปี) ----------
- id: adult.city_foothill_market_price_slate
  stage: adult
  weight: 21
  scene: market
  when:
    age: [19, 64]
    city: { id: foothill_market, mood: [calm] }
  text: |
    ป้ายราคาถ่านของลานถ่านเป็นกระดานหินดำแผ่นใหญ่ตอกไว้ที่ผนังโรงชั่งถ่าน ทุกต้นเดือนเสมียนของพ่อค้าถ่านเขียนราคาที่ฝั่งอาร์เวลรับซื้อลงไปด้วยดินขาว คนลานถ่านอ่านก่อนใคร คนปลายรางอ่านทีหลัง เพราะค่าแรงเหมืองขึ้นลงตามบรรทัดนั้น

    ต้นเดือนนี้เสมียนนอนไข้ ใบสั่งราคามากับขบวนเช้าจากที่ราบ ประทับตราหลวง ราคาลดลงอีกหนึ่งในหก พ่อค้าถ่านที่ถือใบสั่งอยู่อ่านหนังสือไม่คล่อง หันมาเห็น{name}ยืนใกล้ที่สุด ก็ยื่นใบสั่งกับดินขาวก้อนหนึ่งมาให้

    คนงานกะเช้ากำลังเดินผ่านลานไปขึ้นรถไฟเหมือง หลายคนชะลอฝีเท้า
  choices:
    - id: write_it_as_sent
      label: เขียนราคาใหม่ลงกระดานตามใบสั่งทุกตัว
      text: |
        ดินขาวลงกระดานเสียงแห้ง ตัวเลขใหม่อยู่ใต้ตัวเลขเก่าที่ยังลบไม่หมด ใครอ่านก็เห็นว่าลดไปเท่าไร คนงานคนแรกที่อ่านจบไม่ขึ้นรถไฟ คนที่สองก็ไม่ขึ้น รถไฟเหมืองออกจากปลายรางช้าไปครึ่งชั่วโมง ตู้ว่างไปสามตู้

        บ่ายวันนั้นมีคนเอาถ่านเขียนคำหนึ่งไว้ข้างราคา คำที่คนแคระใช้เรียกคนอาร์เวลเวลาไม่อยากให้คนอาร์เวลได้ยิน พ่อค้าถ่านลบออก เช้าวันต่อมาคำเดิมกลับมาอีก ลายมือคนละคน
      effects: { city: { mood: tense }, flags: [wrote_the_new_coal_price] }
    - id: stand_by_the_board
      label: เขียนราคาใหม่ แล้วยืนข้างกระดานอ่านใบสั่งทั้งใบให้คนที่ผ่านมาฟัง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}อ่านใบสั่งทั้งใบ รวมบรรทัดเล็กข้างล่างที่พ่อค้าถ่านไม่เคยอ่านให้ใครฟัง ราคาลดเพราะถ่านจากแดนเถ้าลงที่ราบได้มากขึ้นปีนี้ ไม่ใช่เพราะพ่อค้าในลานนี้หักกำไรเพิ่ม คนงานกะเช้าฟังจบแล้วด่า ด่าที่ราบ ด่าแดนเถ้า ไม่ได้ด่าคนที่ยืนข้างกระดาน แล้วก็ขึ้นรถไฟ

          ตกเย็นพ่อค้าถ่านเจ้าของใบสั่งตอกตะปูข้างกระดานเพิ่มหนึ่งดอก ตั้งแต่เดือนนั้นใบสั่งทุกใบแขวนไว้ตรงนั้นให้ใครก็อ่านได้เอง
        effects: { stats: { CHA: 1 }, city: { merit: 1 }, flags: [read_the_coal_order_aloud] }
      failure:
        text: |
          {name}อ่านไปได้สองบรรทัด คนงานคนหนึ่งตะโกนถามว่า{name}เป็นคนของใคร อีกคนถามว่าได้ค่าอ่านเท่าไร เสียงหัวเราะกลบบรรทัดที่สาม ก้อนดินเปียกก้อนหนึ่งปะทะกระดานข้างหัว{name} ดินขาวที่เพิ่งเขียนเลอะเป็นทางยาว

          รถไฟเหมืองออกช้าไปครึ่งชั่วโมงเหมือนวันที่ไม่มีใครอ่าน ตอนบ่ายใบสั่งหายไปจากมือพ่อค้าถ่าน ไม่มีใครรู้ว่าใครเอาไป
        effects: { city: { mood: tense }, flags: [shouted_down_at_the_coal_board] }
    - id: write_last_months_price
      label: เขียนราคาเดือนก่อนลงไปแทน แล้วคืนใบสั่งให้พ่อค้าถ่านแบบพับไว้
      text: |
        ตัวเลขบนกระดานเหมือนเดือนก่อนทุกตัว คนงานกะเช้าอ่านแล้วเดินผ่านไปขึ้นรถไฟ ไม่มีใครชะลอ พ่อค้าถ่านเอาใบสั่งกลับไปให้ลูกสาวอ่านที่ห้อง แล้วกลับมายืนหน้ากระดานจนเกือบค่ำ ไม่ได้ลบ

        สิบวันต่อมาเสมียนหายไข้ ลบกระดานแล้วเขียนราคาตามใบสั่ง บอกทุกคนว่าตัวเลขเดือนก่อนเป็นความผิดของคนเขียนแทน เขาไม่ได้บอกชื่อ ทั้งลานถ่านรู้อยู่แล้ว
      effects: { alignment: { law: -1 }, flags: [wrote_the_old_coal_price] }

# ---------- e เดือด: ทหารผ่านศึกสองฝั่งในคืนเดียวกัน (มีหนี้สงคราม ต้องมีกรอบปี) ----------
- id: adult.city_foothill_market_two_veterans
  stage: adult
  weight: 35
  scene: tavern
  when:
    age: [19, 64]
    year: [302, 338]
    city: { id: foothill_market, mood: [tense] }
  text: |
    คืนนี้ครบรอบคืนที่สงครามถ่านจบ คนอาร์เวลเรียกว่าคืนสงบศึก คนแคระไม่เรียกว่าอะไร ทุกปีคืนนี้โรงเตี๊ยมในแถวหน้ามีทหารผ่านศึกสองฝั่งมานั่งโต๊ะยาวตัวเดียวกัน เพราะโต๊ะยาวในแถวนี้มีไม่กี่ตัว ทหารอาร์เวลห้าคนนั่งหัวโต๊ะ สองคนใส่แขนกลที่ช่างคนแคระทำ คนแคระหกคนนั่งท้ายโต๊ะ คนหนึ่งเดินด้วยขาไม้ {name}นั่งตรงกลาง เพราะเหลือที่ว่างตรงนั้นที่เดียว

    หัวค่ำทั้งสองฝั่งดื่มกันเงียบๆ ใกล้เที่ยงคืนทหารอาร์เวลคนหนึ่งยกแขนกลขึ้นชนแก้ว บอกคนแคระท้ายโต๊ะว่าแขนนี้ดีกว่าแขนที่คนแคระตัดไป คนแคระขาไม้วางแก้วลง ถามว่าช่างตระกูลไหนทำ ทหารบอกชื่อตระกูล

    คนแคระขาไม้ลุกขึ้นยืน ตระกูลนั้นคือตระกูลของเขา ม้านั่งล้มไปหนึ่งตัว คนในโรงเตี๊ยมที่ไม่ใช่ทหารเริ่มถอยไปชิดผนัง
  choices:
    - id: stand_with_arvel_veterans
      label: ลุกไปยืนข้างทหารแขนกล
      text: |
        หมัดแรกมาจากฝั่งคนแคระ โดนไหล่{name}แทนคนที่ตั้งใจจะโดน แล้วโต๊ะยาวก็พลิกตะแคง แก้วกระเบื้องแตกทั้งแถว คนแคระที่ขนถ่านกะดึกวางคราดแล้ววิ่งมา คนอาร์เวลที่ขนข้าวกะดึกก็วิ่งมา ก่อนรุ่งหน้าต่างแถวหน้าแตกไปครึ่งแถว

        ตอนสาง{name}นั่งอยู่บนบันไดหลังโรงเตี๊ยม ซี่โครงข้างหนึ่งเจ็บทุกครั้งที่หายใจเข้า ทหารแขนกลนั่งข้างๆ ถอดแขนวางบนตัก นิ้วเหล็กข้อหนึ่งงอผิดทาง เขาบอกว่าต้องเอาขึ้นไปซ่อมข้างบน ที่ร้านเดิม
      effects: { hp: -2, reputation: { crown: 1, dwarf_council: -1 }, city: { mood: riot }, flags: [stood_with_the_arvel_veterans] }
    - id: stand_with_clan_veterans
      label: ลุกไปยืนข้างคนแคระขาไม้
      text: |
        คนแคระขาไม้ไม่ได้ขอให้ใครมายืนข้าง เขาจับไหล่{name}ไว้ทรงตัวตอนก้าวแรก แล้วไม่ปล่อย ทหารคนที่ยกแขนกลเหวี่ยงแขนข้างนั้นมาก่อน {name}ยกแขนกันได้ แต่เหล็กหนักกว่ากระดูก

        ก่อนรุ่งหน้าต่างแถวหน้าแตกไปครึ่งแถว คนลานถ่านกับคนแถวโรงเตี๊ยมยืนกันคนละฝั่งถนน ตอนสาง{name}ถลกแขนเสื้อดู ท่อนแขนเขียวช้ำเป็นรอยข้อนิ้วเหล็กสี่ข้อเรียงกัน
      effects: { hp: -2, reputation: { crown: -1, dwarf_council: 1 }, city: { mood: riot }, flags: [stood_with_the_clan_veterans] }
    - id: start_the_rail_song
      label: ขึ้นยืนบนม้านั่ง ตบโต๊ะเป็นจังหวะเพลงคนวางรางที่ทั้งสองฝั่งร้องได้
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          เพลงคนวางรางเป็นเพลงที่คนแคระกับคนอาร์เวลร้องตอนตอกหมุดรางไต่เขาด้วยกัน ตั้งแต่ก่อนมีสงคราม ท่อนหนึ่งภาษาคนแคระ ท่อนหนึ่งภาษาอาร์เวล จังหวะเท่าค้อนตอกหมุด {name}ร้องท่อนแรกเสียงไม่ดัง แต่ตบโต๊ะให้จังหวะดัง คนแคระขาไม้ร้องท่อนที่สองก่อนจะทันคิด แล้วทหารแขนกลก็เคาะนิ้วเหล็กลงบนโต๊ะตามจังหวะ ดังกว่าทุกคน

          เพลงยาวเก้าท่อน ร้องจบท่อนสุดท้ายก็เกือบรุ่ง ทั้งสองฝั่งนั่งลงคนละที่กับที่เคยนั่ง ม้านั่งตัวที่ล้มมีคนยกขึ้นตั้งแล้ว
        effects: { stats: { CHA: 1 }, city: { mood: calm }, flags: [sang_the_rail_builders_song] }
      failure:
        text: |
          {name}ร้องท่อนแรกได้ครึ่งเดียว ทหารอาร์เวลคนหนึ่งขว้างแก้วมาโดนหน้าผาก ตะโกนว่าเพลงนั้นร้องในคืนนี้ไม่ได้ ท่อนภาษาคนแคระที่ควรตามมาไม่มีใครร้อง

          แก้วใบที่สองลอยไปทางท้ายโต๊ะ ก่อนรุ่งหน้าต่างแถวหน้าแตกไปครึ่งแถว {name}เช็ดเลือดที่คิ้วด้วยแขนเสื้อ แขนเสื้อเป็นสีสนิมอยู่แล้วก่อนเลือดจะลง
        effects: { hp: -1, city: { mood: riot }, flags: [song_broke_on_the_war_night] }
    - id: out_the_back
      label: ออกประตูหลังไปทางลานถ่านก่อนใครจะขยับ
      text: |
        ประตูหลังโรงเตี๊ยมเปิดออกไปหาลานล้างหม้อ ถังน้ำวางเรียง {name}เดินผ่านไปจนถึงถนน ได้ยินเสียงม้านั่งล้มตัวที่สองตอนเลี้ยวเข้าซอย

        ตอนเช้า{name}เดินผ่านแถวหน้า หน้าต่างแตกไปครึ่งแถว คนลานถ่านกับคนแถวโรงเตี๊ยมยังยืนกันคนละฝั่งถนน เศษกระจกบนพื้นมีฝุ่นสีสนิมเกาะแล้ว
      effects: { city: { mood: riot }, flags: [left_by_the_inns_back_door] }

# ---------- f ไข้มาถึง: มากับขบวนล่อ ----------
- id: adult.city_foothill_market_mule_fever
  stage: adult
  weight: 9
  scene: road
  when:
    age: [19, 64]
    city: { id: foothill_market, mood: [calm, tense] }
  text: |
    ของกินที่ขึ้นเขาทั้งหมดผ่านตลาดตีนเขา ข้าว ถั่ว หัวหอม เนื้อเค็ม รถไฟไต่เขาขนขึ้นไปได้ไม่พอ ที่เหลือขึ้นไปบนหลังล่อ ขบวนล่อจากที่ราบมาถึงทุกสองสัปดาห์ ล่อสามสิบตัว คนต้อนห้าหกคน พักคืนหนึ่งที่แถวโรงเตี๊ยมก่อนเปลี่ยนของ

    ขบวนนี้มาช้าไปสองวัน ล่อครบ คนต้อนขาดไปหนึ่ง คนที่เหลือบอกว่าทิ้งเขาไว้ที่หมู่บ้านกลางทาง ตัวร้อน ไอแห้ง พูดจบหัวหน้าขบวนก็ไอเอง เสียงเดียวกัน แห้งเหมือนกัน เขาเอามือป้องปากแล้วหัวเราะ บอกว่าฝุ่นของเมืองนี้

    คนแถวโรงเตี๊ยมเปิดประตูรับเหมือนทุกครั้ง ล่อยืนรอให้ปลดของ ข้าวของเมืองข้างบนทั้งเมืองอยู่บนหลังล่อสามสิบตัวนี้
  choices:
    - id: shed_them_at_rail_end
      label: ขอให้คนต้อนไปนอนในโรงถ่านเปล่าที่ปลายรางเจ็ดวัน ให้คนในเมืองปลดของเอง
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          ปลายรางมีโรงเก็บถ่านเปล่าหลังหนึ่ง หลังคาดี ประตูปิดได้ {name}ไม่ได้ขอหัวหน้าขบวนก่อน ไปขอเจ้าของโรงเตี๊ยมทุกโรงในแถวหน้าให้ปิดประตูพร้อมกัน คนต้อนไม่มีที่นอนอื่น ก็ต้องไป

          เจ็ดวันนั้นคนลานถ่านปลดของจากหลังล่อ ส่งข้าวต้มไปวางหน้าโรงถ่านวันละสองหน หัวหน้าขบวนไอถึงวันที่ห้าแล้วหยุด คนต้อนคนอื่นไม่ไอเลย ในเดือนนั้นไม่มีใครในตลาดตีนเขาไอ ล่อสามสิบตัวกินหญ้าแห้งของเมืองหมดไปหนึ่งกอง
        effects: { city: { merit: 2 }, flags: [kept_the_muleteers_in_the_coal_shed] }
      failure:
        text: |
          หัวหน้าขบวนหัวเราะเสียงแห้ง บอกว่าเขาต้อนล่อมาตั้งแต่ยังไม่มีหนวด ไม่เคยนอนโรงถ่าน เจ้าของโรงเตี๊ยมในแถวหน้าไม่มีใครอยากเสียลูกค้าประจำ คืนนั้นคนต้อนนอนที่เดิม กินที่โต๊ะยาวตัวเดิม

          สิบวันต่อมาผ้าขาวผูกหน้าประตูในแถวโรงเตี๊ยมสามหลัง ล่อสามสิบตัวขึ้นเขาไปพร้อมข้าวกับไข้
        effects: { city: { mood: plague }, flags: [could_not_shed_the_caravan] }
    - id: unload_the_mules
      label: รับจ้างปลดของจากหลังล่อ ค่าแรงเป็นเหรียญ จ่ายทันที
      text: |
        กระสอบถั่วใบหนึ่งหนักเท่าคนหนึ่งคน {name}ปลดจนครบสิบล่อ หัวหน้าขบวนช่วยยกอยู่ข้างๆ ไอใส่กระสอบทุกครั้งที่ก้ม แล้วจ่ายค่าแรงเป็นเหรียญจากถุงที่คอ

        สัปดาห์ต่อมาคนที่ปลดล่อด้วยกันวันนั้นไม่มาลานถ่านไปสองคน ถั่วจากกระสอบเหล่านั้นขึ้นเขาไปแล้ว
      effects: { gold: 1, city: { mood: plague }, flags: [unloaded_the_fever_mules] }
    - id: buy_first
      label: ซื้อหัวหอมกับเนื้อเค็มจากหลังล่อก่อนพ่อค้าจะมาแย่ง
      text: |
        หัวหอมของขบวนนี้หัวใหญ่ เนื้อเค็มแห้งดี คนต้อนขายให้ในราคาต่ำเพราะอยากรีบไปนอน {name}หิ้วกลับห้องได้เต็มตะกร้า พอกินได้ทั้งเดือน

        คืนที่เก้า{name}ได้ยินเสียงไอจากห้องข้างล่าง เสียงเดียวกับของหัวหน้าขบวน ตะกร้าหัวหอมยังวางอยู่ข้างประตู เหลือเกือบครึ่ง
      effects: { gold: -1, city: { mood: plague }, flags: [bought_first_from_the_fever_caravan] }

# ---------- g คนมีหน้ามีตา: เวอร์นากับม้านั่งเตากลาง ----------
- id: adult.city_foothill_market_middle_chimney
  stage: adult
  weight: 45
  scene: tavern
  when:
    age: [25, 64]
    city: { id: foothill_market, min_rank: 3 }
  text: |
    โรงเตี๊ยมสามปล่องของเวอร์นามีเตาสามเตา ปล่องสามปล่อง เตาฝั่งตะวันออกเป็นของคนแคระ เตาฝั่งตะวันตกเป็นของคนอาร์เวล ใครนั่งผิดฝั่งไม่มีใครไล่ แต่จะไม่มีใครยกเหล้ามาให้ เตากลางมีม้านั่งหินตัวเดียว คนที่นั่งตัวนั้นคือคนที่ตัดสินว่าใครจ่ายค่าของที่แตก แก้ว ม้านั่ง หน้าต่าง ฟัน คนเมืองนี้ยอมฟังม้านั่งตัวนั้นมากกว่าศาล เพราะศาลอยู่ที่ราบ

    เวอร์นาเป็นหญิงอาร์เวลตัวสูง ผมเคยขาว ตอนนี้เป็นสีชมพูซีดเหมือนผ้าปูที่นอนของทุกโรงเตี๊ยมในเมือง นางไม่เคยนั่งม้านั่งกลางเอง แต่ใครจะได้นั่ง นางเป็นคนเลือก

    คนนั่งคนเก่าขึ้นเขาไปอยู่กับลูกหลานตั้งแต่หน้าหนาว ม้านั่งว่างมาสามเดือน ค่าของแตกที่ยังไม่มีใครจ่ายจดด้วยถ่านไว้บนขอบเตากลาง ยาวจนถึงโคนปล่อง แก้วที่แตกฝั่งคนแคระจดราคาแพงกว่าแก้วฝั่งอาร์เวลหนึ่งในสี่ ไม่มีใครเขียนไว้ว่าทำไม วันนี้เวอร์นาเอาผ้าเช็ดม้านั่งหิน แล้วเรียก{name}มานั่งข้างเตากลาง
  choices:
    - id: take_the_middle_stool
      label: นั่งลงบนม้านั่งหิน แล้วจ่ายค่าของแตกบรรทัดแรกบนขอบเตาเอง
      text: |
        ธรรมเนียมของเตากลางคือคนนั่งคนใหม่ต้องเริ่มด้วยเงินของตัวเอง {name}จ่ายค่าหน้าต่างที่แตกเมื่อหน้าหนาวไปสองเหรียญ แล้วเอานิ้วลบบรรทัดแรกบนขอบเตา บรรทัดที่เหลือ{name}ตัดสินทีละบรรทัดจนค่ำ ทั้งสองฝั่งของโรงเตี๊ยมฟัง บางคนจ่าย บางคนด่าแล้วจ่าย

        ตั้งแต่คืนนั้น ใครทำแก้วแตกในโรงเตี๊ยมสามปล่องจะหันไปทางเตากลางก่อนจะหันไปหาคนที่ชนแก้ว
      effects: { gold: -2, city: { merit: 1 }, flags: [sits_at_the_middle_chimney] }
    - id: even_the_glass
      label: บอกเวอร์นาว่าจะนั่ง ถ้าแก้วฝั่งคนแคระกับฝั่งอาร์เวลราคาเท่ากัน
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          เวอร์นาเงียบไปพักหนึ่ง แล้วบอกว่าราคานั้นเป็นของคนนั่งคนก่อน ไม่ใช่ของนาง นางเอาผ้าเปียกมาเช็ดตัวเลขฝั่งคนแคระออกทั้งแถว ให้{name}เขียนใหม่เองด้วยถ่านจากเตากลาง

          คืนต่อมา เตาฝั่งตะวันออกมีคนแคระนั่งมากกว่าทุกคืน คนหนึ่งยกเหล้ามาวางข้างม้านั่งหินโดยไม่ได้บอกว่าใครส่งมา
        effects: { stats: { CHA: 1 }, reputation: { dwarf_council: 1 }, flags: [sits_at_the_middle_chimney, evened_the_chimney_prices] }
      failure:
        text: |
          เวอร์นาบอกว่าราคาแก้วเป็นเรื่องของโรงเตี๊ยม ไม่ใช่เรื่องของม้านั่ง {name}นั่งลงอยู่ดี แล้วจ่ายส่วนที่แพงเกินของแก้วฝั่งคนแคระที่ค้างอยู่เองไปหนึ่งเหรียญ

          บรรทัดใหม่บนขอบเตากลางยังจดราคาแก้วสองฝั่งไม่เท่ากัน แต่ทุกบรรทัดฝั่งคนแคระมีขีดเล็กๆ ต่อท้าย ลายมือของ{name}
        effects: { gold: -1, flags: [sits_at_the_middle_chimney] }
    - id: turn_down_the_stool
      label: ลุกจากข้างเตากลาง บอกเวอร์นาว่าไม่นั่ง
      text: |
        เวอร์นาพับผ้าเช็ดม้านั่งใส่กระเป๋าผ้ากันเปื้อน ไม่ได้ถามเหตุผล คืนนั้นนางยกเหล้ามาให้{name}เหมือนลูกค้าทุกคน คิดราคาเท่าเดิม

        ม้านั่งหินว่างต่อไปจนถึงหน้าร้อน บรรทัดบนขอบเตากลางยาวเลยโคนปล่องขึ้นไปบนผนัง แล้วคนแคระคนหนึ่งจากลานถ่านก็นั่งลง
      effects: { flags: [refused_vernas_middle_seat] }

# ---------- h หลังคา: บ้านกับร้าน ----------
- id: adult.city_foothill_market_roof
  stage: adult
  weight: 10
  once: false
  scene: tavern
  when:
    age: [22, 62]
    city: { id: foothill_market, home: [none, room, family], min_years: 2 }
  text: |
    บ้านในตลาดตีนเขาเปลี่ยนมือกันที่โต๊ะยาวของโรงเตี๊ยม คนขายวางกุญแจไว้ข้างแก้วตัวเอง คนที่สนใจนั่งลงตรงข้าม ถ้าเหล้าหมดแก้วแล้วกุญแจยังอยู่บนโต๊ะ คนขายเก็บกลับ แล้วมาวางใหม่คืนต่อไป

    คืนนี้มีกุญแจสองพวง พวงหนึ่งเป็นของบ้านหินหลังเล็กที่ปลายราง หัวหน้ากะคนแคระสร้างไว้เอง ผนังหนาหนึ่งศอก ประตูเหล็ก เขาจะขึ้นเขาไปอยู่กับตระกูล ขายสิบเหรียญ อีกพวงเป็นของหน้าร้านในแถวโรงเตี๊ยม ห้องหน้ากว้างพอวางโต๊ะขายของสองตัว ข้างหลังมีห้องนอนกับบ่อน้ำ หญิงอาร์เวลเจ้าของเดิมจะลงไปอยู่ที่ราบ ขายสิบสี่เหรียญ

    ห้องเช่าในเมืองนี้จ่ายเมื่อครบรอบสัญญา บ้านที่ซื้อขาดไม่ต้องจ่ายใคร คนขายทั้งสองดื่มช้าๆ
  choices:
    - id: buy_the_stone_house
      label: นั่งลงตรงข้ามหัวหน้ากะ นับสิบเหรียญวางข้างกุญแจ
      requires: { min_gold: 10 }
      text: |
        หัวหน้ากะดื่มจนหมดแก้วก่อนจะเลื่อนกุญแจมา บอกว่าประตูเหล็กต้องยกขึ้นนิดหนึ่งก่อนบิด ไม่อย่างนั้นลิ้นไม่เข้า

        บ้านหินหลังเล็กเย็นตลอดหน้าร้อน อุ่นตลอดหน้าหนาว ผนังข้างเตามีรอยมือของหัวหน้ากะประทับไว้ในปูนตอนยังเปียก ข้างกันเป็นรอยมือเด็กเล็กอีกสองรอย
      effects: { gold: -10, city: { district: rail_end, home: house }, mark: ซื้อบ้านในตลาดตีนเขา, flags: [owns_a_house_in_foothill_market] }
    - id: buy_the_inn_row_shop
      label: นั่งลงตรงข้ามหญิงอาร์เวล นับสิบสี่เหรียญซื้อหน้าร้าน
      requires: { min_gold: 14 }
      text: |
        หญิงเจ้าของเดิมนับเหรียญสองรอบ แล้วพา{name}ไปดูบ่อน้ำหลังร้านก่อนจะให้กุญแจ น้ำในบ่อใส แต่ถังตักต้องปิดฝาทุกครั้ง ไม่อย่างนั้นฝุ่นสีสนิมจะลงไปนอนก้นถัง

        วันแรกที่{name}เปิดร้าน ลูกค้าคนแรกเป็นคนแคระจากลานถ่าน คนที่สองเป็นคนอาร์เวลจากโรงเตี๊ยมข้างๆ สองคนยืนรอคนละฝั่งของประตู
      effects: { gold: -14, city: { district: inn_row, home: shop }, mark: เปิดร้านในตลาดตีนเขา, flags: [owns_a_shop_in_foothill_market] }
    - id: leave_the_keys
      label: ดื่มจนหมดแก้ว ปล่อยกุญแจสองพวงไว้บนโต๊ะ
      text: |
        กุญแจทั้งสองพวงกลับเข้ากระเป๋าคนขายตอนดึก แล้วกลับมาวางใหม่คืนต่อมา คืนที่สี่พวงของบ้านหินหายไป ตกเป็นของคนแคระจากลานถ่านที่ไม่มีใครเห็นว่านั่งลงตอนไหน

        พวงของหน้าร้านอยู่บนโต๊ะจนสิ้นเดือน ใครวางแก้วใกล้ก็ขยับออกให้
      effects: { flags: [left_the_foothill_keys_on_the_table] }
