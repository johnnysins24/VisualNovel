# ชุด 3b–3c วัยผู้ใหญ่ อายุ 25 ถึง 40: เหตุการณ์ประจำงานสายนักรบและนักย่อง งานละ 2 เรื่อง
# เรื่องแรก (25–32) ชื่อเสียงและหนี้: ได้ตำแหน่ง มีลูกน้อง มีศัตรูในงาน เงินกับอำนาจ
# เรื่องที่สอง (33–40) ฟ้าที่เปลี่ยนไป: คนเก่าเห็นสิ่งที่คนใหม่ไม่เห็น ร่างกายเริ่มไม่ไหว สอนรุ่นต่อไป
# น้ำหนัก 45 ไม่ผูกปี (คนย้ายงานกลางทางต้องเจอได้ทั้งสองเรื่อง) ข้อความหลักไม่ถือว่าเรื่อง 3a เกิดแล้ว เรื่องย้อนอยู่ในตัวเลือกที่ต้องมี flag
# ตายได้สองจุด: ผู้เฝ้าผนึกอุดหินแตกเอง (STR 11) กับคนลักลอบไต่โซ่สะพานยก (DEX 11) label บอกชัดว่าเสี่ยงถึงชีวิต
# เปลี่ยนงานกลางทาง (26–31 น้ำหนัก 15) อยู่ท้ายไฟล์ ราชนาวีไม่รับคนมีเขาเว้นเลื่อยเขาแล้ว (horns_sawn) ตาม L14

- id: adult.mid_navy_tubes
  stage: adult
  scene: ship_deck
  weight: 45
  when:
    age: [25, 32]
    flags: [job_navy]
  text: |
    ปีที่{name}ได้แถบนายสิบเย็บติดแขนเสื้อ ราชนาวีส่งทหารใหม่แปดคนมาอยู่ใต้คำสั่ง แปดคนที่ยังติดกระดุมผิดรู ยังเรียกเชือกผิดชื่อ และยังเชื่อว่าปืนพกประจำตัวทุกกระบอกยิงออก

    ปืนพกรุ่นใหม่ของราชนาวีใช้หลอดน้ำค้างดาวแทนดินดำ หลอดแก้วยาวเท่านิ้วกลาง ข้างในเรืองฟ้าอ่อนแม้ในที่มืด ลังที่ขึ้นเรือมาเมื่อวานมียี่สิบสี่หลอด {name}หยิบหลอดหนึ่งขึ้นส่องกับตะวัน แล้วเอามือป้องแสงไว้ น้ำข้างในไม่เรือง เป็นแค่น้ำย้อมผ้าสีฟ้า {name}ไล่ป้องดูจนครบลัง ของจริงเหลือเก้าหลอด

    ใบรับของลงชื่อร้อยโทลอริก ทาเรนดิส นายคลังประจำอู่ หลานชายขุนนางคนหนึ่งในสภา ทหารทั้งอู่รู้ว่าลังของเขาเบากว่าที่ใบรับของเขียนไว้ทุกลัง และยังไม่เคยมีใครเปิดลังต่อหน้าเขา
  choices:
    - id: to_the_captain
      label: เอาหลอดปลอมไปเรียงบนโต๊ะกัปตัน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ไม่ไปมือเปล่า หลอดปลอมสิบห้าหลอดเรียงเป็นแถวหนึ่ง หลอดจริงเก้าหลอดเรียงอีกแถว ข้างกันเป็นใบรับของย้อนหลังสามเดือนที่ขอคัดมาจากเสมียนอู่ ทุกใบเขียนยี่สิบสี่ ทุกใบลงชื่อคนเดียวกัน กัปตันอ่านจนครบทุกใบโดยไม่นั่ง

          สิ้นเดือนนั้นร้อยโทลอริกย้ายไปคุมประภาคารบนแหลมตะวันออก ที่นั่นมีคนเฝ้าสองคนกับแพะฝูงหนึ่ง ปืนพกที่เขาเก็บไว้ใช้เองตกมาอยู่ในซองของ{name} ลำกล้องสลักลายดาว หลอดในรังเพลิงเรืองอยู่ทั้งกลางวัน
        effects: { stats: { INT: 1 }, reputation: { crown: 1 }, items: [navy_star_pistol], flags: [exposed_navy_quartermaster] }
      failure:
        text: |
          กัปตันฟังจนจบ เปิดลังดูเอง แล้วสั่งให้ยกกลับไปเปลี่ยนที่คลัง ไม่เรียกชื่อใคร ไม่ถามว่าใครลงชื่อรับ เรื่องจบลงที่ลังใบนั้นลังเดียว

          สามวันต่อมาตารางเวรของ{name}เปลี่ยนเป็นกะดึกบนยอดเสากระโดงทุกคืน ลมทะเลตอนตีสามกัดเข้าข้อนิ้วจนกำเชือกไม่สนิท คนลงชื่อสั่งเวรคือร้อยโทลอริก
        effects: { stats: { CON: 1 }, flags: [quartermaster_grudge] }
    - id: buy_real_tubes
      label: ควักเงินตัวเองสี่เหรียญ ซื้อหลอดจริงจากหลังโกดังมาเติม
      requires: { min_gold: 4 }
      text: |
        คนขายของหลังโกดังเจ็ดมีหลอดจริงห่อผ้ามันไว้เป็นมัด สิบห้าหลอดสี่เหรียญ ต่อราคาไม่ได้ เขานับเงินแล้วบอกว่าหลอดชุดนี้ออกจากประตูหลังอู่ราชนาวีเองเมื่อคืนก่อน ขายคืนให้ทหารเรือในราคาพิเศษ

        คืนนั้น{name}นั่งบรรจุหลอดใส่ปืนของลูกน้องทีละกระบอกใต้ตะเกียงจนครบแปดกระบอก เช้าวันตรวจแถว กัปตันเดินผ่านแปดคนนั้นไปโดยไม่หยุด
      effects: { gold: -4, reputation: { dock_rats: 1 }, alignment: { law: -1 }, flags: [bought_back_navy_dew] }
    - id: see_the_quartermaster
      label: ไปหาร้อยโทลอริกที่คลัง ขอส่วนแบ่งแลกกับการปิดปาก
      text: |
        ร้อยโทลอริกไม่ปฏิเสธ และไม่โกรธ เขาเปิดลิ้นชักหยิบถุงผ้าออกมา นับเหรียญวางบนโต๊ะจนครบห้าเหรียญ แล้วบอกว่าหลอดจริงที่หายไปไม่ได้หายไปไหน หลอดพวกนั้นไปอยู่ในเรือของคนที่จ่ายได้ เหมือนของทุกอย่างในโลก

        {name}เก็บเงินห้าเหรียญนั้น ลังต่อๆ มาที่ขึ้นเรือของ{name}มีหลอดจริงครบทุกหลอด ส่วนลังของเรือลำอื่น {name}ไม่เปิดดูอีก
      effects: { gold: 5, alignment: { moral: -1 }, flags: [took_quartermaster_cut] }
    - id: ask_the_saved_mate
      label: ไปหาทหารที่เคยดึงขึ้นมาจากตาข่าย ตอนนี้เขาเป็นเสมียนคลังอาวุธ
      requires: { flag: saved_navy_mate }
      text: |
        ทหารใหม่ที่{name}ดึงขึ้นมาจากตาข่ายในคืนพายุ ตอนนี้ผมบางลงแล้ว นั่งโต๊ะเสมียนในคลังอาวุธ ยังห่อเหรียญเก็บเป็นห่อละสามเหรียญเหมือนสมัยวางไว้ใต้หมอนของ{name} เขาฟังจนจบ แล้วไขหีบใต้โต๊ะ หยิบสมุดคลังเล่มที่สองออกมา เล่มที่เขาจดเองทุกคืนตั้งแต่ปีแรก

        สองเล่มวางคู่กันบนโต๊ะกัปตัน ตัวเลขไม่ตรงกันสักหน้า ร้อยโทลอริกย้ายไปคุมประภาคารบนแหลมตะวันออกก่อนสิ้นเดือน ปืนพกที่เขาเก็บไว้ใช้เองตกมาอยู่ในซองของ{name} ลำกล้องสลักลายดาว
      effects: { stats: { INT: 1 }, reputation: { crown: 1 }, items: [navy_star_pistol], flags: [exposed_navy_quartermaster] }

- id: adult.mid_navy_pillars
  stage: adult
  scene: ship_deck
  weight: 45
  when:
    age: [33, 40]
    flags: [job_navy]
  text: |
    แผนที่ดาวที่หอดูดาวหลวงส่งขึ้นเรือทุกต้นปี ปีนี้หนาขึ้นอีกสองแผ่น ร้อยตรีหนุ่มที่เพิ่งออกจากโรงเรียนนายเรือกางมันบนโต๊ะเดินเรือ จิ้มนิ้วลงที่ดาวนำทางดวงที่คนเรือเรียกว่าตาเหนือ แล้วบอกอย่างมั่นใจว่าคืนนี้จะนำเรือกลับอ่าวด้วยดาวดวงนี้

    {name}ออกเรือมาหลายปี จำได้ว่าเมื่อก่อนรอบตาเหนือมีแต่ความมืด ตอนนี้มีดาวใหม่เบียดอยู่รอบๆ เจ็ดแปดดวง สว่างพอกันจนแยกไม่ออก คนเรือรุ่นเก่าเลิกนำเรือด้วยดาวมาหลายปีแล้ว ใช้เสาของเวรัสที่ยืนอยู่กลางเวนทราสแทน เสาสูงพอให้เห็นจากทะเลไกลครึ่งวันเรือ

    คืนนั้นเมฆลงต่ำ เสาของเวรัสหายเข้าไปในเมฆทั้งต้น แต่ฟ้าข้างบนเปิด ดาวเต็มฟ้า ร้อยตรีสั่งหันหัวเรือไปทางดวงที่เขาคิดว่าเป็นตาเหนือ เข่าซ้ายของ{name}ปวดตื้อมาตั้งแต่หัวค่ำ ทุกครั้งที่ปวดแบบนี้ ฝนจะตกก่อนสาง
  choices:
    - id: take_the_wheel
      label: ขอพวงมาลัยเรือมาถือเอง นำเรือด้วยความจำ
      check: { stat: CON, dc: 12 }
      success:
        text: |
          {name}นับจังหวะคลื่นที่กระแทกหัวเรือ นับเวลาตั้งแต่หัวแหลมสุดท้ายที่เห็นก่อนมืด จำได้ว่ากระแสน้ำเดือนนี้ดึงไปทางตะวันตกแรงแค่ไหน แล้วยืนถือพวงมาลัยจนเข่าซ้ายไม่รู้สึกอะไรอีก

          สางวันรุ่งขึ้นเมฆยกตัว เสาของเวรัสโผล่ขึ้นมาตรงหัวเรือพอดี ร้อยตรีหนุ่มยืนอยู่ข้างหลัง{name}มาตั้งแต่ตอนไหนไม่รู้ แผนที่ดาวพับอยู่ในมือ
        effects: { stats: { CON: 1 }, reputation: { crown: 1 }, flags: [held_course_by_memory] }
      failure:
        text: |
          ตีสาม เข่าซ้ายทรุดลงเอง {name}ล้มกระแทกพวงมาลัย มันหมุนกลับไปครึ่งรอบก่อนจะมีใครคว้าไว้ทัน เรือเลยแนวไปทางหินใต้น้ำนอกอ่าวเกือบชั่วยาม กว่าเสียงคลื่นแตกจะบอกให้รู้ตัว

          หมอเรือพันเข่าให้ด้วยผ้าชุบน้ำส้ม บอกว่าเข่านี้จะไม่กลับมาเหมือนเดิม ตั้งแต่นั้น{name}ขึ้นบันไดดาดฟ้าทีละขั้น ก้าวข้างขวาก่อนเสมอ
        effects: { hp: -2, flags: [navy_bad_knee] }
    - id: teach_the_ensign
      label: พาร้อยตรีขึ้นหัวเรือ สอนให้หาแสงเมืองใต้ท้องเมฆ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ชี้ให้ร้อยตรีดูท้องเมฆด้านหนึ่งที่สีจางกว่าด้านอื่น ตรงนั้นคือแสงตะเกียงสีฟ้าของเวนทราสที่สะท้อนขึ้นไปจากข้างล่าง เมืองที่สว่างทั้งคืนซ่อนตัวจากทะเลไม่ได้ ต่อให้เสาจะหายเข้าไปในเมฆ

          ร้อยตรีจดลงขอบแผนที่ดาวด้วยดินสอ ลายมือตัวเล็ก เอียงขวา เรือเข้าอ่าวตอนสาง ช้ากว่ากำหนดไม่ถึงครึ่งชั่วยาม
        effects: { stats: { INT: 1 }, flags: [taught_the_ensign] }
      failure:
        text: |
          เมฆคืนนั้นหนาจนไม่มีแสงเมืองลอดขึ้นไปเลย ท้องเมฆดำเท่ากันทุกด้าน {name}ชี้ผิดทาง ร้อยตรีรู้ว่าผิด และไม่ว่าสักคำ

          เรือทอดสมอลอยรอสางอยู่นอกอ่าวทั้งคืน {name}ยืนเฝ้าเชือกสมอบนหัวเรือจนเช้า ข้าวต้มที่ครัวส่งขึ้นมาให้เย็นชืดอยู่ข้างเท้า
        effects: { stats: { CON: 1 } }
    - id: let_him_steer
      label: ปล่อยให้ร้อยตรีนำเรือตามแผนที่ของเขา แล้วจดดาวใหม่ลงสมุดเรือ
      text: |
        ร้อยตรีนำเรือออกนอกทางไปครึ่งคืน กว่าจะรู้ว่าดาวที่ตามอยู่ไม่ใช่ตาเหนือ เป็นดวงใหม่ที่ไม่มีในแผนที่ปีที่แล้ว เขาแก้ทิศได้เองตอนตีสี่ เรือเข้าอ่าวสายไปหนึ่งเช้า

        {name}ใช้คืนนั้นจดตำแหน่งดาวใหม่ทุกดวงรอบตาเหนือลงสมุดเรือ พร้อมเวลาที่เห็น ปลายปี หอดูดาวหลวงส่งคนมาขอคัดหน้านั้นไป
      effects: { alignment: { law: 1 }, flags: [logged_new_stars] }
    - id: climb_high
      label: ปีนขึ้นยอดเสากระโดง หาเสาของเวรัสเหนือเมฆ
      requires: { flag: navy_storm_climber }
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ยอดเสากระโดงสูงพ้นเมฆชั้นล่างอยู่ศอกเดียว {name}ปีนขึ้นไปด้วยสองมือกับเข่าข้างที่ยังดี ดึงตัวขึ้นพ้นหมอก ปลายเสาของเวรัสโผล่อยู่เหนือทะเลเมฆทางทิศเหนือ สีขาวเหมือนกระดูก

          {name}ตะโกนทิศลงมาทีละคำ นายท้ายหมุนพวงมาลัยตาม ลูกเรือรุ่นใหม่ยืนแหงนคออยู่ข้างล่าง คืนนั้นพวกเขาเพิ่งรู้ว่าทำไมคนเก่าในเรือเรียก{name}ว่าคนผูกถุงลม
        effects: { stats: { DEX: 1 }, reputation: { crown: 1 }, flags: [held_course_by_memory] }
      failure:
        text: |
          บ่าขวาที่เคยรับแรงตอนผูกเชือกถุงลมในคืนพายุลั่นขึ้นมากลางทาง {name}ห้อยอยู่ด้วยมือข้างเดียวจนลูกเรือสองคนปีนขึ้นมาช่วยพาลง

          ตั้งแต่นั้น{name}ยกแขนขวาขึ้นเหนือหัวได้ไม่สุด ตอนแต่งตัวต้องสวมแขนเสื้อข้างขวาก่อน
        effects: { hp: -3, flags: [old_shoulder_navy] }

- id: adult.mid_wardens_permit
  stage: adult
  scene: fort
  weight: 45
  when:
    age: [25, 32]
    flags: [job_wardens]
  text: |
    ปีที่{name}ได้เป็นหัวหน้ากะดึกของป้อมสาม ภาคีผู้เฝ้าผนึกส่งจดหมายมาแจ้งว่าเงินอุดหนุนจากราชสำนักลดลงครึ่งหนึ่ง น้ำมันตะเกียงสำหรับหน้าหนาวมีพอแค่ถึงกลางฤดู หัวหอกเหล็กในคลังเหลือสิบเอ็ดอัน ผู้เฝ้ามียี่สิบหกคน

    สัปดาห์เดียวกัน วิศวกรของบริษัทเหมืองถ่านมารขี่ม้ามาถึงประตูป้อม เสื้อนอกสะอาดเกินกว่าใครในแดนเถ้าจะกล้าใส่ เขามีข้อเสนอ น้ำมันสิบถังกับหัวหอกเหล็กคนแคระยี่สิบอัน แลกกับหนังสือรับรองของป้อมสามฉบับเดียว ว่าพื้นดินรอบแนวหินก้อนที่สามสิบสองถึงสามสิบเก้านิ่งพอให้ขุดหน้าดินได้

    ดอร์วัล หัวหน้ากะกลางวัน ลงชื่อในกระดาษไปก่อนแล้ว เหลือช่องว่างให้หัวหน้ากะดึกอีกช่องเดียว
  choices:
    - id: sign_it
      label: ลงชื่อ รับน้ำมันกับหัวหอกมาให้ป้อมผ่านหนาวนี้
      text: |
        {name}ลงชื่อในช่องที่เหลือ น้ำมันสิบถังมาถึงก่อนเถ้าแรกของหนาว หัวหอกเหล็กคนแคระคมจนแทงทะลุหนังหมาเถ้าได้ในครั้งเดียว คนในกะดึกไม่ต้องผลัดกันถือตะเกียงดวงเดียวอีก

        ต้นฤดูใหม่ เสียงเครื่องเจาะดังมาจากทางหินก้อนที่สามสิบห้าทุกวัน ตอนกลางคืน เถ้าแถบนั้นอุ่นจนน้ำค้างไม่เกาะ
      effects: { world: { demon: 1 }, alignment: { moral: -1 }, flags: [signed_mine_permit] }
    - id: measure_the_heat
      label: ปักเหล็กลงเถ้าข้างหินทุกคืน จดความร้อนให้ตัวเลขตอบแทน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ให้คนกะดึกปักแท่งเหล็กยาวศอกลงในเถ้าข้างหินทุกก้อน ตั้งแต่ก้อนที่สามสิบสองถึงสามสิบเก้า เช้ามืดถอนขึ้นมาจับ จดว่าลึกแค่ไหนที่เริ่มอุ่นมือ สามสิบคืนติดกัน ตัวเลขไต่ขึ้นเป็นขั้นบันได

          หญิงชราจากภาคีที่ขึ้นมาตรวจป้อมต้นฤดูอ่านตารางของ{name}จนจบ แล้วฉีกหนังสือรับรองของดอร์วัลต่อหน้าวิศวกร ก่อนกลับ เธอแกะผ้าพันคอทอจากหญ้าสีเงินที่พันคอตัวเองมาตลอดทาง วางไว้บนโต๊ะของ{name}
        effects: { stats: { INT: 1 }, reputation: { wardens: 1 }, items: [warden_grass_scarf], flags: [stone_heat_ledger] }
      failure:
        text: |
          แท่งเหล็กบอกได้แค่ว่าอุ่น บอกไม่ได้ว่าอุ่นแค่ไหนถึงอันตราย ตัวเลขของ{name}ขึ้นๆ ลงๆ ตามลม วิศวกรอ่านแล้วยิ้ม ดอร์วัลยื่นกระดาษฉบับของตัวเองไปถึงภาคีก่อน ภาคีรับรองตามลายมือเดียว

          {name}ยังปักเหล็กทุกคืนจนจบฤดู มือชาเพราะเหล็กเย็นตอนตีสี่ ไม่มีใครขอดูตาราง
        effects: { stats: { CON: 1 }, flags: [dorval_signed] }
    - id: move_the_stakes
      label: ออกไปตอนตีสาม ถอนหลักเขตของบริษัทไปปักให้ห่างแนวหิน
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ออกไปกับคนกะดึกสองคน ถอนหลักเหล็กทาสีแดงของบริษัททีละหลัก เดินถอยห่างแนวหินออกไปสองร้อยก้าวแล้วปักใหม่ ตรงรูเดิมเกลี่ยเถ้าทับ ลมพัดสามชั่วยามรอยก็หายไปหมด

          บริษัทขุดตามหลักที่ปักใหม่ ไม่มีใครในบริษัทเดินนับก้าวเอง ดอร์วัลเห็นหลุมขุดอยู่ไกลกว่าในแผนที่ แล้วไม่ถาม
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [moved_mine_stakes] }
      failure:
        text: |
          หลักเหล็กของบริษัทตอกลงไปถึงชั้นหินแข็ง ถอนได้สามหลักก็สาง ยามของบริษัทเจอรอยเท้ากับรูว่างสามรู ส่งเรื่องถึงภาคี ภาคีส่งจดหมายตำหนิกลับมา จ่าหน้าถึงหัวหน้ากะดึกของป้อมสาม

          ดอร์วัลอ่านจดหมายฉบับนั้นออกเสียงในห้องกินข้าว ชัดทุกคำ ตั้งแต่นั้นกะกลางวันกับกะดึกไม่นั่งโต๊ะเดียวกันอีก
        effects: { alignment: { law: -1 }, flags: [dorval_signed, dorval_rival] }
    - id: telik_log
      label: ไปขอสมุดของเทลิค ที่เขาจดความร้อนของเถ้ามาทุกคืน
      requires: { flag: carried_warden_home }
      text: |
        เทลิค คนที่{name}ลากกลับมาจากทุ่งเถ้าในคืนนั้น ทุกวันนี้นั่งซ่อมสายหนังอยู่ในโรงเก็บของ ขาไม้ข้างหนึ่งพาดอยู่บนม้านั่ง เขาจดความร้อนของเถ้าข้างหินมาตั้งแต่ก่อนเสียขา ตอนนี้ยังให้เด็กกะดึกถือแท่งเหล็กมาให้จับทุกเช้า

        {name}เอาสมุดของเขาทุกเล่มมาเรียงต่อหน้าวิศวกร ทุกปี ทุกคืน ลายมือเดียวกัน ตัวเลขข้างหินก้อนที่สามสิบหกขึ้นทุกปีไม่เคยลง วิศวกรเก็บกระดาษใส่กระเป๋าแล้วขี่ม้ากลับไปเอง ปลายเดือนภาคีส่งน้ำมันมาเพิ่มห้าถัง ชื่อในใบส่งของเป็นชื่อเทลิค
      effects: { reputation: { wardens: 2 }, alignment: { law: 1 }, flags: [stone_heat_ledger] }

- id: adult.mid_wardens_crack
  stage: adult
  weight: 45
  when:
    age: [33, 40]
    flags: [job_wardens]
  text: |
    เถ้าบนแนวหินอุ่นขึ้นทุกปี และอุ่นเร็วขึ้นทุกปี ปีนี้อุ่นตั้งแต่ปลายฝน เร็วกว่าที่สมุดเวรของป้อมเคยจดไว้เดือนครึ่ง เข่ากับหลังของ{name}รู้ก่อนสมุด

    คืนหนึ่งปลายฤดู หินก้อนที่สามสิบหกแตก รอยร้าวยาวจากโคนขึ้นไปถึงกลางก้อน กว้างพอให้สอดนิ้วเข้าไปได้ ไออุ่นพ่นออกมาจากรอยนั้นเป็นจังหวะ แล้วมีเสียงดังขึ้นมาจากข้างในลึกลงไป เคาะสามครั้ง เงียบ เคาะสามครั้ง เงียบ จุดแดงหลังแนวหินขึ้นมาทีละจุดเหมือนทุกคืน แต่คืนนี้นับไม่ทัน

    ซาธิล ผู้เฝ้าอายุสิบเจ็ดจากบ้านหญ้าเงิน เขาคู่เล็กบนหัวยังโผล่ไม่พ้นแนวผม ยืนถือถังปูนผสมเถ้าอยู่ข้าง{name} มือที่กำหูถังขาวซีด เขาไม่ถามว่าจะทำอย่างไร เขารอ
  choices:
    - id: pack_it_yourself
      label: ปีนขึ้นไปอุดรอยร้าวเองใต้จมูกหมาเถ้า (เสี่ยงถึงชีวิต)
      check: { stat: STR, dc: 11, foe: demon }
      success:
        text: |
          {name}คว้าถังปูนจากมือซาธิล ปีนขึ้นฐานหิน กอบปูนอัดเข้าไปในรอยร้าวทีละกำมือ ปูนร้อนจนหนังฝ่ามือลอก จุดแดงจุดแรกมาถึงโคนหินตอนกำมือสุดท้ายเข้าไป {name}ฟาดด้ามหอกลงไปข้างหลังโดยไม่หันดู ได้ยินเสียงถ่านแตก

          เสียงเคาะในหินเงียบลงตอนสาง ปูนแห้งเป็นรอยมือของ{name}เต็มรอยร้าว หนาวปีต่อมา ผู้เฝ้ารุ่นใหม่ที่ป้อมสามเรียกหินก้อนที่สามสิบหกด้วยชื่อของ{name}
        effects: { hp: -2, stats: { STR: 1 }, reputation: { wardens: 2 }, flags: [sealed_stone_36] }
      failure:
        text: |
          ฐานหินลื่นด้วยไอน้ำที่พ่นออกมา {name}อัดปูนเข้าไปได้ครึ่งรอย แล้วจุดแดงสามจุดก็ขึ้นมาถึงพร้อมกัน

          ซาธิลอุดรอยที่เหลือจนเสร็จตอนฟ้าสาง ปูนที่แห้งอยู่ในรอยร้าวมีรอยมือสองคู่ คู่หนึ่งใหญ่กว่า เช้าวันนั้นมีหัวหอกขึ้นไปแขวนบนผนังห้องกินข้าวเพิ่มอีกอัน ข้างหัวหอกของคนรุ่นก่อนอีกหลายสิบอัน
        effects: { die: sacrifice }
    - id: send_the_young
      label: สอนซาธิลอุดรอย ส่วนตัวเองถือหอกยืนกันอยู่ข้างล่าง
      check: { stat: STR, dc: 13, foe: demon }
      success:
        text: |
          {name}บอกวิธีทีละคำ กำมือแรกให้อัดลึก กำมือต่อไปให้ทับ อย่ารีบปิดปากรอยก่อนข้างในเต็ม แล้วหันหลังให้หิน ยืนคร่อมทางขึ้น จุดแดงมาถึงสองจุด {name}แทงจุดแรกแตกในครั้งเดียว จุดที่สองหยุดอยู่ห่างออกไปสามก้าว แล้วไม่ขยับเข้ามาอีก

          ซาธิลลงจากหินตอนสาง ฝ่ามือพองทั้งสองข้าง ปูนในรอยร้าวเรียบเหมือนปาดด้วยเกรียง ปีต่อมาเขาสอนเด็กใหม่แบบเดียวกันทุกคำ
        effects: { stats: { STR: 1 }, reputation: { wardens: 1 }, flags: [taught_sathil] }
      failure:
        text: |
          หมาเถ้าตัวหนึ่งมาทางด้านที่{name}ไม่ได้มอง หนังร้อนของมันครูดผ่านแขนซ้ายก่อนหอกจะแทงเข้าอกมันได้ ซาธิลอุดรอยจนเสร็จ แล้วลงมาพันแผลให้{name}ด้วยผ้าพันคอของตัวเอง มือเขายังไม่หยุดสั่น แต่พันได้แน่น
        effects: { hp: -3, flags: [taught_sathil, ash_hound_burn] }
    - id: ring_and_fall_back
      label: ตีระฆังเรียกทั้งป้อม แล้วถอยมาตั้งแนวที่กำแพง
      text: |
        ระฆังป้อมสามดังสามชุด ตามธรรมเนียมเมื่อหินในแนวแตก ผู้เฝ้าทั้งป้อมออกมาตั้งแนวบนกำแพงก่อนปูนในถังจะทันแห้ง แล้วยืนกันจนสาง จุดแดงวนอยู่รอบหินก้อนที่สามสิบหกทั้งคืน แต่ไม่ข้ามแนว

        เช้านั้นทั้งป้อมช่วยกันอุดรอยทีละกะ ไม่มีใครเจ็บ {name}เขียนรายงานส่งภาคี บรรทัดสุดท้ายเขียนว่าได้ยินเสียงเคาะจากในหิน สามครั้ง เงียบ สามครั้ง ภาคีตอบกลับมาเรื่องค่าปูน ไม่เอ่ยถึงบรรทัดนั้น
      effects: { stats: { CON: 1 }, alignment: { law: 1 }, flags: [reported_the_knock] }
    - id: stand_at_the_crack
      label: เอาหลังพิงรอยร้าว ยืนขวางหมาเถ้าไว้คนเดียว ให้ซาธิลอุด
      requires: { trait: curse_brand }
      check: { stat: CON, dc: 12, foe: demon }
      success:
        text: |
          {name}ยืนหันหน้าออกไปทางความมืด หลังพิงหินที่ร้อนจนเสื้อไหม้ จุดแดงเข้ามาใกล้จนเห็นหนังดำย่น แล้วหยุดทีละตัว ยืนห่างออกไปสามก้าวเหมือนรอคำสั่งจากใครสักคน

          ตลอดคืนนั้นมีเสียงทุ้มพูดขึ้นครั้งเดียว ใกล้มาก เป็นเสียงแบบที่{name}เคยได้ยินในฝัน เรียกชื่อของ{name}ครบทุกพยางค์ {name}ไม่ตอบ ฟ้าสาง หมาเถ้าถอยกลับไปทีละตัว ซาธิลลงจากหินมายืนข้าง{name} และไม่ถามว่าเมื่อคืนได้ยินอะไร
        effects: { stats: { CON: 1 }, reputation: { wardens: 1 }, world: { demon: 1 }, flags: [stood_at_the_crack, taught_sathil] }
      failure:
        text: |
          หินร้อนเกินกว่าหลังคนจะทนได้ทั้งคืน {name}ยืนได้ถึงเที่ยงคืนก็ทรุดลง จุดแดงจุดหนึ่งเข้ามาเลียแผ่นหลังที่เสื้อไหม้ไปแล้ว ก่อนซาธิลจะฟาดถังปูนใส่มันจนถ่านในอกแตก

          รอยไหม้บนหลังของ{name}หายเป็นแผลเป็นสีเทาเงิน รูปร่างเหมือนรอยร้าวบนหิน แผลนั้นไม่เคยอุ่นขึ้นหรือเย็นลงตามอากาศ
        effects: { hp: -3, flags: [stood_at_the_crack, warden_back_scar] }

- id: adult.mid_merc_head
  stage: adult
  weight: 45
  when:
    age: [25, 32]
    flags: [job_mercenary]
  text: |
    โดรัคเลิกนั่งตู้หัวขบวนในปีที่หลังเขาปีนบันไดตู้ไม่ไหว บริษัทเหมืองให้เขานั่งโต๊ะในสำนักงานปลายรางฝั่งเมือง แล้วส่งบัญชีขบวนถ่านเล่มหนามาให้{name} ตำแหน่งหัวหน้าขบวน ยามใต้คำสั่งสิบสองคน เงินเดือนขึ้นสองเท่า และทุกกระสอบที่หายระหว่างทางหักจากเงินเดือนนั้น

    หน้าหนาวปีนั้นยาวกว่าทุกปี หมู่บ้านริมรางที่ขบวนผ่านทุกเที่ยวไม่มีควันขึ้นจากปล่องมาสามวัน เช้าวันที่สี่ เด็กผู้ชายอายุราวสิบห้ายืนอยู่บนกองหินกลางราง ถือปืนคาบศิลาที่อายุมากกว่าตัวเขาหลายเท่า ปากกระบอกชี้มาที่หัวขบวน

    ข้างหลังเด็กคนนั้นมีชาวบ้านยืนรออยู่สิบกว่าคน มือเปล่า คนแก่คนหนึ่งพับกระสอบป่านเปล่าไว้ใต้รักแร้
  choices:
    - id: stop_and_talk
      label: สั่งหยุดขบวน ลงไปคุยกับเด็กคนนั้น
      text: |
        {name}ปีนลงจากตู้หัวขบวน เดินไปจนปากกระบอกปืนห่างอกไม่ถึงสองศอก แล้วถามชื่อเด็ก เขาบอกชื่อ บอกว่าน้องสาวสองคนไอมาสามคืนแล้ว {name}สั่งให้ทิ้งกระสอบสองใบลงข้างราง แล้วจดลงบัญชีว่าตกรางตรงโค้งหิน

        สิ้นเดือน บริษัทหักเงินเดือน{name}ไปสี่เหรียญ ค่าถ่านสองกระสอบ ไม่มีใครถามว่าโค้งหินตรงนั้นขบวนอื่นผ่านได้อย่างไร
      effects: { gold: -4, alignment: { moral: 1 }, flags: [convoy_spill_ledger] }
    - id: fire_warning
      label: ยิงขึ้นฟ้าหนึ่งนัด แล้วสั่งขบวนเดินต่อ
      habit: cool_headed
      text: |
        เสียงปืนของ{name}สะท้อนไปตามรางไกลถึงเนินเถ้า เด็กคนนั้นกระโดดลงจากกองหิน ชาวบ้านแหวกทางให้ ขบวนผ่านไปครบทุกกระสอบ บริษัทจ่ายรางวัลเที่ยวที่ไม่หายสักกระสอบห้าเหรียญ

        เที่ยวกลับ กองหินกลางรางยังอยู่ที่เดิม มีรองเท้าเด็กข้างหนึ่งวางอยู่บนยอด ตั้งตรง หันหน้ามาทางขบวน
      effects: { gold: 5, alignment: { moral: -1 }, flags: [ran_the_rail_village] }
    - id: cook_the_ledger
      label: เกลี่ยบัญชีให้ถ่านหายไปเองระหว่างทาง
      check: { stat: INT, dc: 13 }
      success:
        text: |
          บริษัทยอมให้ถ่านมารหายระหว่างทางได้ร้อยละหนึ่งทุกเที่ยว เพราะถ่านมารคุตัวเองช้าๆ อยู่ในกระสอบแม้ไม่มีใครจุด สำนักงานปลายรางเชื่อตัวเลขนี้มาสิบปีโดยไม่เคยยกตาชั่งออกมาชั่งสักครั้ง {name}คิดเลขทั้งคืน เกลี่ยสองกระสอบออกเป็นเศษเล็กๆ ไปตามเที่ยวทั้งเดือน ไม่มีเที่ยวไหนหายเกินร้อยละหนึ่ง

          เด็กคนนั้นได้ถ่านสองกระสอบทุกเดือนจนหมดหนาว ปืนคาบศิลากระบอกนั้นไปแขวนอยู่บนผนังบ้านเขา ไม่ได้ลงมาอีก
        effects: { stats: { INT: 1 }, alignment: { law: -1, moral: 1 }, flags: [convoy_spill_ledger] }
      failure:
        text: |
          บัญชีของ{name}ไปวางบนโต๊ะโดรัคเป็นเล่มแรกของเดือน เขาเปิดอ่านหน้าเดียว แล้วหยิบบัญชีเก่าของตัวเองจากลิ้นชักมาวางคู่กัน ตัวเลขเหมือนกันทุกตัว เขาเขียนแบบนี้มาสิบปี

          โดรัคหักเงินเดือน{name}สามเหรียญตามระเบียบ แล้วบอกว่าคนที่จะเกลี่ยตัวเลข ต้องเกลี่ยให้เหมือนคนขี้เกียจ ไม่ใช่เหมือนคนฉลาด
        effects: { gold: -3, flags: [doraq_knows_ledger] }
    - id: gun_sign
      label: ชูมือขึ้นเหนือหัว ทำนิ้วเป็นรูปปืนให้เด็กคนนั้นดู
      requires: { flag: fired_over_blockade }
      text: |
        {name}ชูมือขึ้นสูงเหนือหัว นิ้วชี้กับนิ้วโป้งทำเป็นรูปปืน เด็กบนกองหินนิ่งไป แล้วปากกระบอกปืนก็ค่อยๆ ลดลง เขาจำมือนี้ได้ หลายปีก่อนเขาเป็นเด็กตัวเล็กที่ยืนชูมือแบบเดียวกันอยู่ข้างราง ให้ยามคนที่ยิงข้ามหัวคนในหมู่บ้าน

        คืนนั้น{name}กับคนแก่ของหมู่บ้านตกลงกันด้วยตะเกียง ไฟสองดวงที่ปลายรางแปลว่าเที่ยวนี้จะมีกระสอบตกตรงโค้งหิน ไฟดวงเดียวแปลว่ายามบริษัทขึ้นขบวนมาด้วย หนาวนั้นถ่านตกรางตรงโค้งหินทุกเดือน ไม่เคยเกินที่บัญชีจะกลืนได้
      effects: { alignment: { moral: 1 }, flags: [rail_village_pact, convoy_spill_ledger] }

- id: adult.mid_merc_ash_line
  stage: adult
  weight: 45
  when:
    age: [33, 40]
    flags: [job_mercenary]
  text: |
    รางถ่านทอดลึกเข้าไปในแดนเถ้าทุกปี ปีนี้ปลายรางอยู่ห่างตอเสาของอัสเทลแค่สองวันเดิน ตู้ที่กลับมาจากปลายรางร้อนจนเถ้าที่เกาะล้อหลอมเป็นแก้ว ยามรุ่นใหม่ในขบวนของ{name}ถือปืนเวทกระบอกละสิบเหรียญ หลอดน้ำค้างดาวเรืองฟ้าอยู่ในรังเพลิง ยังไม่มีใครเคยยิงคนจริง และไม่มีใครเคยเห็นของที่ไม่ใช่คน

    คืนหนึ่งขบวนจอดพักที่ปลายราง หลังของ{name}ปวดจนต้องนอนบนแผ่นไม้แข็ง ตีสอง เฟเดน ยามอายุสิบเก้า มาเขย่าเท้าปลุก ชี้ออกไปในทุ่ง มีแถวคนเดินตัดรางมาจากทางตอเสา ห้าสิบกว่าคน ก้าวเท้าตรงกันทุกก้าว สวมเกราะแบบที่ไม่มีช่างคนไหนตีกันแล้ว ใต้หมวกเหล็กไม่มีหน้า มีแต่เถ้า

    ทหารเถ้า {name}เคยได้ยินแต่ในเรื่องเล่าของคนคุมขบวนรุ่นก่อน พวกมันเดินตามคำสั่งที่ไม่มีใครสั่ง แถวหน้าสุดห่างตู้ท้ายไม่ถึงร้อยก้าว และยังเดินตรงมา
  choices:
    - id: lamps_out
      label: สั่งดับตะเกียงทั้งขบวน นอนราบ ให้มันเดินผ่านไป
      habit: cool_headed
      check: { stat: CON, dc: 12 }
      success:
        text: |
          ตะเกียงทุกดวงในขบวนดับในเวลาไม่ถึงสิบลมหายใจ ยามสิบสองคนนอนราบอยู่ใต้ตู้ เถ้าเข้าจมูก {name}เอาตัวทับปืนของเฟเดนไว้ เพราะมือเขาสั่นจนนิ้วอยู่บนไก

          แถวทหารเถ้าเดินผ่านรางไปห่างตู้ท้ายแค่สามสิบก้าว เสียงเกราะกระทบกันเป็นจังหวะเดียว ไม่หยุด ไม่เลี้ยว สางวันรุ่งขึ้นบนเถ้าข้างรางไม่มีรอยเท้าสักรอย หลังของ{name}ยืดตรงไม่ได้ไปสามวัน
        effects: { stats: { CON: 1 }, flags: [let_ash_line_pass] }
      failure:
        text: |
          ยามคนหนึ่งในตู้กลางจุดไฟสูบกล้องเพราะทนนอนนิ่งไม่ไหว แถวทหารเถ้าหยุด แล้วหันมาพร้อมกันทั้งห้าสิบตัว {name}ลากยามคนนั้นลงจากตู้ วิ่งหนีไปตามรางกับคนที่เหลือ มือเกราะของมันตัวหนึ่งกวาดผ่านหลัง{name}ตอนกระโดดข้ามราง ร้อนเหมือนเหล็กเพิ่งออกจากเตา

          เช้ามาตู้ท้ายของขบวนพังยับ ถ่านในตู้หายไปทั้งตู้ ที่เหลืออยู่บนพื้นเป็นเถ้าเย็นกองหนึ่ง
        effects: { hp: -3, flags: [ash_soldier_burn] }
    - id: open_fire
      label: สั่งยิงแถวหน้าก่อนมันถึงขบวน
      habit: cold_blood
      check: { stat: DEX, dc: 14, foe: demon }
      success:
        text: |
          ปืนเวทสิบสองกระบอกยิงพร้อมกัน แสงฟ้าสาดเข้ากลางแถว ทหารเถ้าแถวหน้าแตกเป็นฝุ่นทีละตัว แถวหลังเดินข้ามฝุ่นของแถวหน้ามาโดยไม่ช้าลง {name}สั่งยิงจนหลอดหมดลัง แถวสุดท้ายแตกห่างตู้ท้ายแค่สิบก้าว

          บริษัทจ่ายรางวัลป้องกันขบวนหกเหรียญ เฟเดนเก็บเศษหมวกเหล็กชิ้นหนึ่งไว้ หลังเที่ยวนั้นเขาลาออก กลับไปช่วยพ่อจับปลา
        effects: { stats: { DEX: 1 }, gold: 6, flags: [shot_ash_line] }
      failure:
        text: |
          ยามครึ่งขบวนยิงพลาดเพราะมือสั่น แถวทหารเถ้าถึงตู้ท้ายก่อนแสงปืนจะหยุดมันได้ {name}ดึงยามสองคนออกมาจากใต้ล้อทัน คนที่สาม เฟเดน ไม่ทัน

          บริษัทส่งศพเขากลับบ้านไปกับขบวนถ่านเที่ยวถัดไป ในตู้เดียวกับถ่าน เพราะไม่มีตู้ว่าง
        effects: { hp: -4, flags: [lost_a_guard] }
    - id: back_it_up
      label: ถอยขบวนกลับทั้งคืน แล้วไปแจ้งผู้เฝ้าผนึก
      text: |
        หัวขบวนถอยหลังทั้งคืน ช้ากว่าคนเดิน ทหารเถ้าไม่ตามมา แถวของมันเดินตัดรางไปทางตะวันตก แล้วหายไปในทุ่ง สางวันรุ่งขึ้น{name}ลุยเถ้าไปป้อมสามเอง เล่าให้หัวหน้ากะฟังว่าเห็นอะไร กี่ตัว ไปทางไหน

        บริษัทหักเงินเดือน{name}สามเหรียญ เป็นค่าถ่านที่เผาเพิ่มตอนถอยขบวน ผู้เฝ้าผนึกเขียนเส้นทางที่{name}เล่าลงแผนที่ในห้องเวรด้วยหมึกสีแดง
      effects: { gold: -3, alignment: { law: 1 }, reputation: { wardens: 1 }, flags: [warned_wardens_of_line] }
    - id: village_lamps
      label: ไปเคาะประตูหญิงคนเฝ้าถังน้ำที่ปลายราง คนที่เคยได้กระสอบถ่านจากตู้ท้าย
      requires: { flag: gave_convoy_coal }
      text: |
        หญิงคนที่เคยยืนหน้าสุดในวันขวางราง ทุกวันนี้เฝ้าถังน้ำให้บริษัทอยู่ที่ปลายราง นางจำ{name}ได้ตั้งแต่วันแรกที่ขบวนของ{name}มาถึง จำได้ว่าใครถีบกระสอบถ่านลงมาบนเถ้าให้หมู่บ้าน นางออกมาก่อน{name}จะเคาะประตูเสียอีก บอกว่าพวกมันเดินทางนี้ทุกสิบสองคืน เส้นเดิม ไม่เคยเลี้ยว คนที่อยู่แดนเถ้ามานานรู้ว่าต้องหลบไปทางไหน

        นางถือตะเกียงเดินนำหัวขบวนเข้ารางเก่าสายร้าง ห่างออกไปสามร้อยก้าว ทั้งขบวนนั่งดูแถวทหารเถ้าเดินผ่านปลายรางไปในระยะที่ไม่มีใครต้องกลั้นหายใจ ก่อนกลับ นางขอถ่านกระสอบเดียว ไม่ขอทั้งตู้
      effects: { alignment: { moral: 1 }, flags: [rail_village_signal] }

- id: adult.mid_smuggler_chain
  stage: adult
  weight: 45
  when:
    age: [25, 32]
    flags: [job_smuggler]
  text: |
    ทางพาเด็กมีเขาออกจากเมือง ทุกวันนี้{name}เป็นคนคุมเอง ห้องใต้ร้านขายเชือกริมคลองเจ็ดมีกระดานดำแผ่นหนึ่ง ชื่อคนนำทางเขียนด้วยปูนขาวเรียงกันลงมา ชื่อที่ขีดฆ่ามีมากกว่าชื่อที่เหลือ ชื่อบนสุดที่ยังไม่ขีดคือชื่อของ{name}

    คืนนี้มีเด็กสามพี่น้องรออยู่ในห้องนั้น คนโตอายุสิบเอ็ด คนเล็กสี่ขวบ ห่อหัวด้วยผ้าพันคอคนละผืน เรือที่จะรับไปฝั่งใต้จอดรอที่ท่าเก่าอีกฝั่งคลอง แต่สัปดาห์นี้ศาสนจักรตะเกียงส่งนักล่าแม่มดคนใหม่มาประจำย่านท่าเรือ ชื่อปาเดรน เขาพาหมาดมกลิ่นมาสองตัว ตั้งยามไว้ที่ปากซอยทุกซอยริมคลอง

    ทางที่ยังว่างเหลือทางเดียว คือโซ่ของสะพานยก สะพานยกค้างไว้ทั้งคืน โซ่เส้นใหญ่สองเส้นขึงข้ามคลองจากหอฝั่งนี้ไปหอฝั่งโน้น สูงจากน้ำสิบช่วงตัวคน
  choices:
    - id: chain_crossing
      label: พาเด็กไต่โซ่สะพานยกข้ามคลองทีละคน (เสี่ยงถึงชีวิต)
      check: { stat: DEX, dc: 11 }
      success:
        text: |
          {name}ผูกเด็กคนเล็กไว้กับหลังด้วยผ้าพันคอสองผืน ให้คนกลางกับคนโตไต่ตามมาทีละข้อโซ่ มือต่อมือ ลมจากทะเลแกว่งโซ่ทั้งเส้นไปมาเหมือนราวตากผ้า กลางคลอง เด็กคนโตหยุด ไม่ยอมไต่ต่อ {name}ร้องเพลงกล่อมเด็กที่คนท่าเรือร้องกันเบาๆ จนมือของเขาขยับได้อีกครั้ง

          ถึงหอฝั่งโน้นตอนตีสี่ เรือออกก่อนสาง หนูท่าส่งค่าคุมทางมาให้สี่เหรียญ กับข่าวว่าหมาของปาเดรนนั่งดมอยู่ที่ปากซอยจนเช้า
        effects: { stats: { DEX: 1 }, reputation: { dock_rats: 1 }, gold: 4, flags: [crossed_the_chain] }
      failure:
        text: |
          ข้อโซ่กลางคลองเปียกน้ำค้าง มือของ{name}ลื่นตอนลมกระโชก {name}ยังเกาะโซ่ด้วยมือข้างเดียวได้นานพอให้เด็กคนโตปลดผ้าพันคอ ดึงน้องคนเล็กออกจากหลัง{name}มากอดไว้กับโซ่ แล้วมือข้างนั้นก็หลุด

          เด็กสามคนไปถึงเรือ เช้าวันรุ่งขึ้นคนเก็บขยะริมคลองเจอรองเท้าข้างหนึ่งลอยติดอยู่ที่เสาท่า ในห้องใต้ร้านขายเชือก มีคนขีดเส้นทับชื่อบนสุดบนกระดานดำ แล้วไม่มีชื่อใหม่ขึ้นแทนอยู่หลายเดือน
        effects: { die: sacrifice }
    - id: wait_a_night
      label: รอไว้อีกคืน นั่งบนหลังคานับจังหวะยามของปาเดรนก่อน
      habit: cool_headed
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ให้เด็กสามคนนอนในห้องใต้ร้านเชือกอีกคืน ตัวเองนั่งบนหลังคาร้านทั้งคืน นับเวลาที่หมาสองตัวเดินจากปากซอยหนึ่งไปอีกซอย ปาเดรนเป็นคนตรงเวลา เปลี่ยนยามทุกครั้งที่ระฆังหอท่าตีบอกชั่วยาม และทุกครั้งที่เปลี่ยน ปากซอยริมคลองเจ็ดว่างอยู่ช่วงหนึ่ง นานพอให้เด็กสี่ขวบเดินผ่าน

          คืนต่อมาเด็กสามคนเดินผ่านปากซอยนั้นตอนระฆังตีเที่ยงคืน ไม่มีใครต้องวิ่ง เช้าวันรุ่งขึ้นที่วงกบประตูร้านเชือกมีรอยน้ำมันดินป้ายเป็นวงกลม ปาเดรนป้ายไว้ทุกประตูในย่าน เพราะไม่รู้ว่าประตูไหนใช่
        effects: { stats: { INT: 1 }, reputation: { dock_rats: 1 }, flags: [outwaited_the_hunter] }
      failure:
        text: |
          คืนที่สอง หมาของปาเดรนมาดมอยู่หน้าประตูร้านเชือกจนเจ้าของร้านต้องออกมาสาดน้ำล้างกลิ่น {name}พาเด็กหนีออกทางหลังคาตอนตีสาม เด็กคนกลางทำผ้าพันคอหลุดกลางทาง ไม่มีใครกล้าย้อนไปเก็บ

          เด็กไปถึงเรือครบสามคน ผ้าพันคอผืนนั้นไปอยู่ในมือปาเดรนตอนสาย หนูท่าไม่ส่งเด็กมาที่ห้องของ{name}อีกสองเดือน
        effects: { reputation: { dock_rats: -1 }, flags: [hunter_has_the_scarf] }
    - id: old_sewer
      label: พาลงท่อระบายน้ำ ทางเก่าที่เคยลากลังผ่าน
      requires: { flag: knows_sewer_route }
      text: |
        ในท่อระบายน้ำใต้ย่านท่าเรือไม่มีหมาตัวไหนดมกลิ่นใครออก กลิ่นในท่อกลบทุกอย่าง {name}จำทางได้ทุกแยก เลี้ยวซ้ายสามครั้ง ก้มหัวลอดซุ้มอิฐที่เตี้ยที่สุด ลุยน้ำถึงเอวอีกช่วงสั้นๆ เด็กคนเล็กขี่คอ{name}ไปตลอดทาง หลับไปตั้งแต่แยกที่สอง

        ขึ้นจากท่อที่ท่าเก่าตอนฟ้ายังมืด เสื้อผ้าทุกคนเหม็นจนคนเรือให้ไปนั่งท้ายลำ เด็กคนโตหัวเราะออกมาเป็นครั้งแรกตั้งแต่ออกจากห้องใต้ร้านเชือก
      effects: { stats: { CON: 1 }, reputation: { dock_rats: 1 }, flags: [ran_the_sewer_again] }
    - id: draw_the_dogs
      label: ออกไปให้หมาของปาเดรนได้กลิ่นตัวเอง แล้ววิ่งล่อไปอีกทาง
      requires: { trait: curse_brand }
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          หมาดมกลิ่นของศาสนจักรฝึกด้วยผ้าห่อตัวของเด็กมีเขา กลิ่นของ{name}จึงเป็นกลิ่นเดียวกับที่มันตามหา {name}เดินออกไปยืนใต้ตะเกียงปากซอยฝั่งตะวันออก ปลดผ้าพันคอออก รอจนหมาตัวแรกเงยจมูก แล้ววิ่ง

          หมาสองตัวกับคนของปาเดรนไล่ตาม{name}ข้ามหลังคาโกดังเกลือไปจนถึงตลาดปลา ระหว่างนั้นเด็กสามพี่น้องเดินผ่านปากซอยฝั่งตะวันตกที่ว่างอยู่ไปขึ้นเรือ {name}กลับห้องใต้ร้านเชือกตอนสาง ขาสั่นจนต้องนั่งพักบนบันไดขั้นแรก
        effects: { stats: { DEX: 1 }, reputation: { dock_rats: 1 }, flags: [drew_the_hunter_dogs] }
      failure:
        text: |
          หมาตัวที่สองไม่วิ่งตามตัวแรก มันอ้อมมาดักที่ท้ายซอย เขี้ยวของมันจมเข้าน่อง{name}ก่อนที่{name}จะสะบัดหลุดแล้วปีนขึ้นรางน้ำทัน เด็กสามคนผ่านไปได้ เพราะยามทั้งย่านวิ่งตามเสียงหมาเห่า

          แผลที่น่องหายช้า กลายเป็นรอยเขี้ยวสี่รูเรียงกัน หน้าหนาว รอยนั้นปวดก่อนฝนจะตกทุกครั้ง
        effects: { hp: -3, reputation: { dock_rats: 1 }, flags: [witch_dog_bite] }

- id: adult.mid_smuggler_cricket
  stage: adult
  scene: home
  weight: 45
  when:
    age: [33, 40]
    flags: [job_smuggler]
  text: |
    ทุกวันนี้ทางพาเด็กออกจากเมืองเหลือเดือนละเที่ยว ศาสนจักรตะเกียงตั้งยามทุกท่า {name}เลิกปีนหลังคามาสองปีแล้ว เพราะเข่าไม่ยอม ห้องเช่าเหนือร้านซ่อมแหกลายเป็นที่นัดของคนนำทางรุ่นใหม่ ทุกคนเคาะประตูแบบเดียวกัน สามครั้ง เว้น สองครั้ง

    คืนหนึ่งปลายฝน คนที่เคาะเป็นหญิงสาวมีเขาอายุราวยี่สิบ ผมตัดสั้นเกรียน เขาโค้งสองข้างไม่ได้ซ่อน คนท่าเรือเรียกนางว่าจิ้งหรีด เพราะนางกระโดดจากหลังคาหนึ่งไปอีกหลังคาโดยไม่มีเสียงเท้า นางขอเรียนทาง ทุกแยก ทุกท่อ ทุกคนที่ต้องจ่ายและต้องจ่ายเท่าไร นางบอกว่าเด็กที่ยังรออยู่มีมากกว่าคนนำทางที่เหลือ

    ระหว่างที่นางพูด {name}นับรอยเท้าเปียกบนพื้นห้องได้คู่เดียว นางเดินขึ้นบันไดไม้เก่ามาโดยไม่มีขั้นไหนลั่นสักขั้น
  choices:
    - id: teach_the_sewer
      label: พานางลงท่อเองทุกคืน จนนางจำได้ทุกแยก
      check: { stat: CON, dc: 12 }
      success:
        text: |
          สิบสองคืนติดกัน {name}ลุยน้ำในท่อนำจิ้งหรีดไปทีละแยก ให้นางท่องชื่อแยกถอยหลังจากท่าเก่ากลับมาถึงร้านเชือก คืนที่สิบสาม{name}ให้นางเดินนำ ตัวเองตามหลังห่างสิบก้าว นางไม่เลี้ยวผิดสักแยก

          คืนที่สิบสี่ นางพาเด็กออกไปสองคนโดยไม่มี{name}ไปด้วย ตอนสาง{name}ได้ยินเสียงเคาะประตู สามครั้ง เว้น สองครั้ง
        effects: { stats: { CON: 1 }, reputation: { dock_rats: 1 }, flags: [taught_cricket] }
      failure:
        text: |
          คืนที่หก น้ำในท่อขึ้นเพราะฝนตกทางต้นน้ำ {name}ลื่นล้มตรงแยกที่สาม ข้อเท้าลั่นดังในความมืด จิ้งหรีดลากตัว{name}กลับมาเองทั้งทาง โดยไม่ร้องเรียกให้ใครช่วย

          {name}สอนทางที่เหลือจากบนเตียง วาดด้วยถ่านบนผนังห้อง จิ้งหรีดจำได้หมดในสามคืน รอยถ่านบนผนังนั้นไม่มีใครลบ
        effects: { hp: -2, flags: [taught_cricket] }
    - id: keep_the_route
      label: ไม่สอน คุมทางเองต่อไปจนกว่าเข่าจะไม่ไหวจริงๆ
      text: |
        {name}บอกนางว่าทางนี้มีคนตายมามากพอแล้ว ไม่จำเป็นต้องมีชื่อใหม่บนกระดาน จิ้งหรีดไม่เถียง ยืนฟังจนจบ แล้วลงบันไดไปโดยไม่มีขั้นไหนลั่น

        เดือนต่อๆ มา{name}ยังพาเด็กออกเดือนละเที่ยว เดินช้าลงทุกเที่ยว แต่ยังเดิน หน้าหนาวปีนั้นหนูท่าเล่าว่ามีเด็กมีเขาสองคนออกจากเมืองไปทางหลังคาฝั่งตะวันออก ไม่มีใครเห็นว่าใครพาไป
      effects: { stats: { DEX: 1 }, flags: [kept_the_route] }
    - id: hand_it_over
      label: เขียนทางทั้งหมดลงกระดาษให้นาง แล้วรับเงินก้อนสุดท้ายจากหนูท่า
      text: |
        {name}เขียนทางทั้งหมดลงกระดาษแผ่นเดียว ทุกแยก ทุกท่อ ทุกยามที่ต้องจ่ายและจ่ายเท่าไร แล้วยื่นให้นาง จิ้งหรีดอ่านจบในคืนเดียว แล้วเผากระดาษแผ่นนั้นในเตาของ{name}เอง

        หนูท่าส่งเงินก้อนสุดท้ายมาให้หกเหรียญ เป็นค่าทางที่ส่งต่อครบ หลายเดือนหลังจากนั้น{name}ยังตื่นตอนตีสี่ทุกคืน นอนฟังเสียงประตูที่ไม่มีใครเคาะ
      effects: { gold: 6, reputation: { dock_rats: 1 }, flags: [gave_route_to_cricket] }
    - id: ask_where_from
      label: ถามนางว่ามาจากไหน
      requires: { flag: smuggled_horned_child }
      text: |
        จิ้งหรีดนั่งลงบนเก้าอี้ตัวเดียวในห้อง แล้วเล่าว่าตอนแปดขวบนางออกจากเมืองนี้ในลังไม้ใบหนึ่ง ฝาลังเจาะรูไว้สามรู ออกนอกกำแพงก่อนไก่ขัน นางจำได้แค่ความมืดในลัง กลิ่นเหม็นแสบจมูก และว่าคนคนนั้นไม่ได้ทิ้งลังไว้กลางทาง

        {name}จำคืนนั้นได้ทุกอย่าง ทั้งน้ำหนักของลัง และเสียงสะอื้นเสียงเดียวที่เงียบไปเหมือนมีมือปิดปาก {name}ไม่ได้บอกนาง คืนนั้น{name}เริ่มสอนนางทุกอย่าง ตั้งแต่แยกแรกของท่อ
      effects: { alignment: { moral: 1 }, reputation: { dock_rats: 1 }, flags: [taught_cricket, cricket_was_the_crate_girl] }

- id: adult.mid_bankspy_envelope
  stage: adult
  scene: belek_bank
  weight: 45
  when:
    age: [25, 32]
    flags: [job_bank_spy]
  text: |
    ปีที่{name}ได้แผ่นทองเหลืองแผ่นที่สอง ตราตาชั่งสองชั้น ธนาคารเลิกส่งชื่อลูกหนี้มาให้เฝ้า ชื่อที่มาในซองตอนนี้เป็นชื่อของคนเฝ้าด้วยกัน เบเลคจ้างคนให้ดูลูกหนี้ แล้วต้องมีอีกคนดูคนที่ดู

    ซองที่หัวหน้าเสมียนห้องใต้ดินยื่นให้เดือนนี้ปิดผนึกด้วยครั่งดำ นางยื่นให้ด้วยปลายนิ้วสองนิ้ว ข้างในเป็นชื่อเดียว คาเดล แทลเลส ชายเสื้อเทาที่นั่งโต๊ะเดิมในโรงเตี๊ยม สั่งชาถ้วยเดียวทุกครั้งที่นัด{name} และไม่เคยบอกชื่อ

    {name}ตามเขามาสามสัปดาห์ เห็นเขาเข้าประตูข้างของโบสถ์ศาสนจักรตะเกียงทุกคืนวันที่เจ็ดของเดือน ออกมาพร้อมนักบวชเสื้อขาวขลิบทองคนเดิม แล้วยืนคุยกันใต้ตะเกียงประตูนานพอให้เทียนสั้นลงหนึ่งข้อนิ้ว ธนาคารเบเลคกับศาสนจักรตะเกียงไม่เคยเป็นมิตรกันมาตั้งแต่ก่อน{name}เกิด
  choices:
    - id: report_him
      label: เขียนรายงานตามที่เห็นทุกคืน
      text: |
        {name}เขียนรายงานสามหน้า วันที่ เวลา หน้าตานักบวช ความยาวของเทียน ส่งคืนในซองครั่งดำ หัวหน้าเสมียนรับไปด้วยสองนิ้วเหมือนเดิม

        เดือนต่อมาโต๊ะเดิมในโรงเตี๊ยมว่าง ไม่มีใครเอ่ยชื่อคาเดล แทลเลสอีก ซองที่มาถึง{name}ต้นเดือนมีเหรียญหกเหรียญ กับกระดาษแผ่นเล็กบอกว่าโต๊ะนั้นเป็นของ{name}แล้ว เจ้าของโรงเตี๊ยมยกชาถ้วยเดียวมาวาง บอกว่าค่าชาจ่ายล่วงหน้าไว้หนึ่งปี
      effects: { gold: 6, reputation: { belek_bank: 1 }, alignment: { law: 1 }, flags: [took_the_grey_seat] }
    - id: warn_him
      label: ไปนั่งรอที่โต๊ะเดิม แล้วเลื่อนซองครั่งดำไปให้เขา
      check: { stat: INT, dc: 13 }
      success:
        text: |
          พอเขามาถึง {name}เลื่อนซองที่ยังไม่แกะไปไว้ข้างถ้วยชาของเขา แล้วพูดแค่คำว่าวันที่เจ็ด เขาอ่านชื่อบนหน้าซองโดยไม่แตะ แล้วสั่งชาเพิ่มอีกถ้วยมาวางตรงหน้า{name} เป็นครั้งแรก รายงานที่{name}ส่งคืนเดือนนั้นเขียนว่าคนในซองไม่มีอะไรผิดปกติ

          ก่อนลุก เขาวางกุญแจทองเหลืองดอกหนึ่งลงบนโต๊ะ เป็นกุญแจตู้ฝากของในร้านรับจำนำหลังตลาดปลา ในตู้มีแผ่นทองเหลืองแผ่นแรกของเขา กับรายชื่อคนเฝ้าของเบเลคทั้งเมือง ชื่อของ{name}อยู่บรรทัดที่สิบเก้า หลังจากวันนั้นเขาไม่มาที่โต๊ะนั้นอีก
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [grey_man_owes_you] }
      failure:
        text: |
          {name}เลื่อนซองไปให้ เขาไม่แตะ ไม่อ่าน บอกว่าซองที่ส่งให้คนเฝ้าคนหนึ่งไปเฝ้าอีกคน บางทีก็ไม่มีชื่อจริงอยู่ข้างใน เบเลคอยากรู้แค่ว่าคนถือซองจะเอาซองไปให้ใคร

          เขาลุกไปก่อนชาจะเย็น เดือนต่อมาค่าจ้างของ{name}มาครบ แต่ไม่มีซองงานมาอีกสามเดือน หัวหน้าเสมียนห้องใต้ดินเลิกยื่นของให้{name}กับมือ วางไว้บนโต๊ะแทน
        effects: { reputation: { belek_bank: -1 }, flags: [belek_suspects_you] }
    - id: read_the_drawer
      label: ลงห้องใต้ดินตอนกลางคืน ดูว่าในลิ้นชักหัวหน้าเสมียนมีซองชื่อใครอีก
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          หุ่นยามเฝ้าบันไดห้องใต้ดินนับเสียงฝีเท้า ไม่นับคน {name}เดินลงไปตามจังหวะเท้าของยามกะดึกทีละขั้น ไขลิ้นชักโต๊ะหัวหน้าเสมียนด้วยปิ่นปักผม ในลิ้นชักมีซองครั่งดำเรียงอยู่สามสิบกว่าซอง ซองหนึ่งเขียนชื่อ{name} ลงวันที่ไว้ตั้งแต่วันที่{name}ได้แผ่นทองเหลืองแผ่นแรก

          {name}อ่านซองของตัวเองจนจบใต้แสงเทียน ลายมือเป็นของคาเดล แทลเลส ทุกบรรทัดตรงกับที่{name}ทำจริง ไม่มีบรรทัดไหนเกินจริงแม้แต่บรรทัดเดียว {name}ปิดผนึกคืนด้วยครั่งจากเทียนบนโต๊ะ แล้วเดินขึ้นบันไดตามจังหวะเดิม
        effects: { stats: { DEX: 1 }, flags: [read_the_watchers_drawer] }
      failure:
        text: |
          หุ่นยามเฝ้าบันไดนับเท้าได้เกินกะไปหนึ่งคู่ แล้วหันมา แขนเหล็กปัดกลางอก{name}จนกลิ้งลงบันไดไปครึ่งช่วง {name}หนีออกทางช่องลมได้ก่อนยามจะจุดตะเกียงครบห้อง ซี่โครงร้าวไปสองซี่

          เช้าวันรุ่งขึ้น หัวหน้าเสมียนเปลี่ยนกุญแจลิ้นชัก แล้วถามทุกคนที่มาทำงานว่าทำไมเดินท่าแปลก ถาม{name}ด้วย
        effects: { hp: -3, flags: [failed_the_drawer, belek_suspects_you] }
    - id: tell_her_straight
      label: เอารายงานไปให้หัวหน้าเสมียน พร้อมรายชื่อคนที่ธนาคารเคยส่งมาตามตัวเอง
      requires: { flag: belek_suspects_you }
      text: |
        {name}วางรายงานเรื่องคาเดลลงบนโต๊ะของนาง พร้อมกระดาษอีกแผ่น เป็นรายชื่อทุกคนที่ธนาคารส่งมาตาม{name}ตั้งแต่ปีที่มีเรื่องช่างทำถังไม้ ห้าชื่อ วันที่ครบ หัวหน้าเสมียนอ่านกระดาษแผ่นที่สองช้ากว่าแผ่นแรก

        เดือนต่อมาโต๊ะในโรงเตี๊ยมเป็นของ{name} ชาจ่ายล่วงหน้าหนึ่งปี ค่าจ้างขึ้นหกเหรียญ คนตามห้าคนนั้นหายไปจากถนนที่{name}เดินทุกวัน เหลือแต่คนที่หก คนที่{name}ยังไม่เคยเห็นหน้า
      effects: { gold: 6, reputation: { belek_bank: 1 }, alignment: { law: 1 }, flags: [took_the_grey_seat] }

- id: adult.mid_bankspy_sky_contracts
  stage: adult
  scene: tavern
  weight: 45
  when:
    age: [33, 40]
    flags: [job_bank_spy]
  text: |
    สิบปีหลังมานี้ธนาคารเบเลคออกสัญญาแบบใหม่ คนในห้องใต้ดินเรียกว่าสัญญาฟ้าหน้า เจ้าของโรงกลั่นกู้เงินไปสร้างจานรับดาว โดยเอาน้ำค้างของดาวที่ยังไม่ขึ้นมาค้ำ ดาวขึ้นใหม่ทุกปี และมากขึ้นทุกปี คนในห้องใต้ดินมองไม่เห็นว่าจะเสียตรงไหน

    งานของ{name}ปีนี้คือเฝ้าหญิงเอลฟ์คนหนึ่ง ชื่อนิเรธ มาจากหอนับดาวไอเลธ นางมาอยู่เวนทราสสามเดือนแล้ว นั่งโรงเตี๊ยมแถวโรงกลั่นทุกเย็น นั่งกับเจ้าของโรงกลั่นทีละคน วาดเส้นโค้งเส้นหนึ่งบนโต๊ะด้วยน้ำชาที่หยดจากปลายนิ้ว แล้วเช็ดทิ้งก่อนลุก ไม่มีใครเห็นทันนอกจาก{name}

    ตาของ{name}ไม่ดีเหมือนเมื่อก่อน ต้องย้ายมานั่งใกล้ขึ้นสองโต๊ะถึงจะเห็นเส้นนั้น คืนนี้นางนั่งอยู่คนเดียว
  choices:
    - id: report_every_word
      label: จดเส้นโค้งกับชื่อทุกคนที่นางนั่งด้วย ส่งห้องใต้ดิน
      text: |
        {name}วาดเส้นโค้งของนางลงกระดาษเท่าที่จำได้ ส่งไปห้องใต้ดินพร้อมรายชื่อเจ้าของโรงกลั่นทุกคนที่นางไปนั่งด้วย ธนาคารจ่ายหกเหรียญ

        ฤดูต่อมา สัญญาฟ้าหน้าทุกฉบับมีข้อใหม่ต่อท้ายหนึ่งบรรทัด ตัวเลขในบรรทัดนั้นมาจากเส้นโค้งของนิเรธ นางกลับไอเลธไปก่อนหนาว เจ้าของโรงกลั่นในเวนทราสไม่มีใครยอมนั่งโต๊ะเดียวกับเอลฟ์อีก
      effects: { gold: 6, reputation: { belek_bank: 1, star_hall: -1 }, flags: [reported_nireth] }
    - id: count_with_her
      label: ไปนั่งโต๊ะนาง ขอให้วาดเส้นนั้นให้ดูอีกครั้ง
      check: { stat: INT, dc: 13 }
      success:
        text: |
          นางไม่ถามว่า{name}เป็นใคร นางจุ่มนิ้วในถ้วยชาแล้ววาดอีกครั้ง ช้าลง เส้นแรกเป็นจำนวนดาวที่หอนับดาวนับได้ในแต่ละปีย้อนหลังไปห้าสิบปี แล้วนางวาดเส้นที่สองให้ทับลงไป {name}คิดดอกทบต้นให้ห้องใต้ดินมาหลายปี จึงรู้เองโดยไม่ต้องให้ใครบอก เส้นที่สองคือดอกเบี้ยของสัญญาฟ้าหน้า และมันโค้งขึ้นแบบเดียวกับเส้นแรกทุกจุด

          {name}ถามว่าถ้าดาวหยุดเพิ่ม เส้นไหนจะหยุดก่อน นิเรธเช็ดโต๊ะจนแห้ง แล้วบอกว่านั่นคือคำถามที่นางเดินทางมาไกลขนาดนี้เพื่อถาม รายงานเดือนนั้นของ{name}เขียนว่าเอลฟ์คนนั้นมาดื่มชา
        effects: { stats: { INT: 1 }, reputation: { star_hall: 1 }, flags: [counted_with_nireth] }
      failure:
        text: |
          นางยิ้มเมื่อ{name}นั่งลง แล้วชี้ปลายนิ้วเปียกน้ำชาไปที่ปกเสื้อของ{name} ขอบแผ่นทองเหลืองตราตาชั่งโผล่ออกมาให้เห็นครึ่งแผ่น นางบอกว่าชาวไอเลธไม่วาดเส้นให้คนนับเงินดู แล้วลุกไปจ่ายค่าชาของ{name}ด้วย

          {name}รายงานได้แค่ว่านางรู้ตัว ห้องใต้ดินชมว่ารายงานตรงดี หลังจากคืนนั้นนิเรธเปลี่ยนโรงเตี๊ยมทุกคืน
        effects: { reputation: { belek_bank: 1 }, flags: [nireth_saw_your_plate] }
    - id: note_under_cup
      label: เขียนกระดาษสอดไว้ใต้ถ้วยชาของนาง แล้วทิ้งค่าชาไว้ให้สองเหรียญ
      requires: { min_gold: 2 }
      text: |
        {name}เขียนบนกระดาษพับครึ่งแผ่นเดียวว่า ห้องใต้ดินอ่านโต๊ะนี้ทุกคืน สอดไว้ใต้ถ้วยตอนเดินผ่าน แล้ววางสองเหรียญไว้กับเจ้าของร้าน เป็นค่าชาของนางทั้งสัปดาห์

        นิเรธไม่มาโรงเตี๊ยมนั้นอีก แต่เจ้าของโรงกลั่นสามคนที่นางเคยนั่งด้วยเลิกกู้สัญญาฟ้าหน้าในปีนั้น ปลายฤดู{name}เจอใบไม้แห้งใบหนึ่งเสียบอยู่ที่ช่องประตูห้อง ใบเรียวยาวแบบไม้ในป่าไอเลธ ไม่มีชื่อ
      effects: { gold: -2, alignment: { moral: 1, law: -1 }, flags: [warned_nireth] }
    - id: west_gate_goatherd
      label: ส่งนางออกจากเมืองไปกับคนเลี้ยงแพะประตูตะวันตก
      requires: { flag: warned_the_cooper }
      text: |
        คนเลี้ยงแพะที่ออกจากประตูตะวันตกตอนสางยังเดินทางเดิมทุกเช้า ผมขาวทั้งหัวแล้ว แพะฝูงเดิมเหลือครึ่งเดียว ตั้งแต่ปีที่ช่างทำถังไม้หนีหนี้ {name}ก็รู้ว่าลูกหนี้ของเบเลคออกจากเมืองทางไหน และรู้ว่าคนเลี้ยงแพะคนนี้ไม่เคยถามชื่อใคร

        นิเรธออกจากเวนทราสไปกับฝูงแพะ ก่อนห้องใต้ดินจะส่งคนมาถามว่าเส้นโค้งบนโต๊ะเป็นเส้นอะไร นางฝากกระดาษไว้กับคนเลี้ยงแพะแผ่นหนึ่ง วาดเส้นสองเส้นด้วยหมึก ไม่มีตัวหนังสือ คนเลี้ยงแพะเอามาให้{name}โดยไม่รู้ว่ามันคืออะไร
      effects: { alignment: { moral: 1 }, flags: [warned_nireth] }

- id: adult.mid_swindler_title
  stage: adult
  scene: noble_hall
  weight: 45
  when:
    age: [25, 32]
    flags: [job_swindler]
  text: |
    ทุกวันนี้{name}มีชื่อปลอมสามชื่อ เสื้อผ้าสามชุดสำหรับแต่ละชื่อ และเจ้าของบ้านเช่าสามหลังที่ไม่รู้จักกัน งานใหญ่ที่สุดของปีมาทางชื่อที่สอง เจ้าของโรงกลั่นคนหนึ่งชื่อฮอบรัน รวยจากน้ำค้างดาวมาสิบปี ซื้อบ้านขุนนางเก่าไปได้ครึ่งถนน เขาซื้อได้ทุกอย่าง ยกเว้นคำว่าท่านหน้าชื่อตัวเอง

    ตระกูลกาเรดอสสูญไปสามชั่วคนแล้ว ไม่มีทายาท และยังไม่มีใครเข้าไปค้นทะเบียนในวิหารออสซาว่าสายเลือดนั้นหมดจริงหรือยัง ฮอบรันจะจ่ายสิบห้าเหรียญให้คนที่หาเชือกเส้นนั้นเจอ

    ในห้องรับแขกของฮอบรันมีอีกคนนั่งรออยู่ก่อนแล้ว ชายผมทาน้ำมันเรียบติดหนังหัว เสื้อดำแบบทนายของสภาขุนนาง เขายิ้มให้{name}เหมือนคนรู้จักกันมานาน เขามาขายเรื่องเดียวกัน
  choices:
    - id: forge_the_line
      label: เข้าไปค้นทะเบียนในวิหารออสซา หาเชือกสายเลือดมาต่อให้ฮอบรัน
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}นั่งอยู่ในห้องทะเบียนของวิหารออสซาสิบเอ็ดวัน อ่านทะเบียนเกิดตายลายมือคนที่ตายไปนานแล้ว จนเจอหลานสาวคนหนึ่งของตระกูลกาเรดอสที่หนีตามคนเลี้ยงม้าไปตอนอายุสิบหก ทะเบียนเขียนว่านางสิ้นชื่อจากตระกูล ไม่ได้เขียนว่านางสิ้นใจ ช่องว่างตรงนั้นกว้างพอให้เติมชื่อปู่ของฮอบรันลงไปได้หนึ่งชื่อ ด้วยหมึกผสมเถ้าให้ดูเก่า

          สภาขุนนางรับรองเชือกสายนั้นในฤดูต่อมา ฮอบรันจ่ายสิบห้าเหรียญ แล้วจ้างช่างแกะตรากาเรดอสติดประตูบ้านทุกบาน ชายผมทาน้ำมันมางานเลี้ยงฉลองด้วย ยกแก้วให้{name}จากอีกฟากห้อง
        effects: { stats: { INT: 1 }, gold: 15, alignment: { moral: -1 }, flags: [sold_a_title] }
      failure:
        text: |
          ทะเบียนของวิหารออสซาหายไปสามเล่ม พอดีกับช่วงปีที่{name}ต้องการ สามเล่มนั้นอยู่ในกระเป๋าเสื้อดำมาตั้งแต่สัปดาห์ก่อน {name}เขียนเชือกสายเลือดจากความจำของทะเบียนเล่มอื่น ทนายของสภาอ่านแค่สองหน้าก็เจอรุ่นที่แม่อายุน้อยกว่าลูก

          ฮอบรันไม่เรียกยาม เขาให้คนรับใช้สองคนพา{name}ออกทางประตูหลัง และสองคนนั้นไม่ได้แค่พาออก {name}เดินกะเผลกไปอีกหลายวัน ชื่อปลอมชื่อที่สองใช้ในย่านนั้นไม่ได้อีก
        effects: { hp: -2, flags: [hobran_grudge] }
    - id: lift_his_papers
      label: ล้วงแฟ้มเอกสารจากเสื้อของชายผมทาน้ำมัน แล้วขายเรื่องของเขาแทน
      habit: light_fingers
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ชนไหล่เขาที่บันไดหน้าบ้านฮอบรัน ขอโทษสองครั้ง ช่วยเก็บหมวกให้ แฟ้มหนังในเสื้อดำย้ายมาอยู่ในเสื้อของ{name}ก่อนหมวกจะถึงมือเขา ในแฟ้มเป็นเชือกสายเลือดที่เขาเขียนไว้เสร็จแล้ว งานดีจน{name}แก้แค่ลายมือ

          {name}ขายให้ฮอบรันแปดเหรียญ ต่ำกว่าราคาที่ชายผมทาน้ำมันตั้งไว้ครึ่งหนึ่ง ฮอบรันชอบคนที่ขายของไม่แพง สัปดาห์ต่อมาชายผมทาน้ำมันมาเคาะประตูบ้านเช่าหลังที่สองของ{name} {name}ย้ายออกไปตั้งแต่สามวันก่อน
        effects: { stats: { DEX: 1 }, gold: 8, flags: [beat_the_oiled_man] }
      failure:
        text: |
          มือของ{name}เข้าไปในเสื้อดำได้ครึ่งทาง แล้วมือของเขาก็จับข้อมือ{name}ไว้ เบา ไม่แรง เขาเอียงตัวมากระซิบว่าคนเก่งสองคนแย่งกันจะได้คนละครึ่ง คนเก่งสองคนช่วยกันจะได้ทั้งหมด

          งานนั้นจบที่ฮอบรันได้คำว่าท่าน ชายผมทาน้ำมันได้เงิน {name}ได้ห้าเหรียญที่เขาบอกว่าเป็นครึ่งหนึ่ง กับได้คู่หูที่รู้ที่อยู่บ้านเช่าทั้งสามหลังของ{name}
        effects: { gold: 5, alignment: { law: -1 }, flags: [oiled_man_partner] }
    - id: walk_away
      label: ทิ้งงานนี้ ไม่แย่งกับใคร
      text: |
        {name}ลุกจากห้องรับแขกของฮอบรันก่อนน้ำชาจะมา บอกคนรับใช้ว่าลืมของไว้ที่อื่น ชายผมทาน้ำมันยกถ้วยขึ้นเหมือนจะส่ง

        ปลายปี ประตูบ้านฮอบรันมีตราตระกูลกาเรดอสติดอยู่ทุกบาน {name}เดินผ่านทุกวันตอนไปตลาด ตราแกะเป็นนกกระสายืนขาเดียว ผิดไปจากตราเดิมในทะเบียนตรงที่นกหันหน้าผิดข้าง คนที่รู้มีอยู่คนเดียวในเมือง
      effects: { alignment: { law: 1 }, flags: [let_the_title_go] }
    - id: widow_as_aunt
      label: ขอให้ท่านหญิงอิสเวลมาเล่าว่าเคยรู้จักตระกูลนั้น
      habit: sweet_tongue
      requires: { flag: widow_tea_friend }
      text: |
        ท่านหญิงอิสเวลอายุแปดสิบแล้ว ยังรินชาเองทุกครั้ง นางฟังเรื่องฮอบรันจนจบ แล้วหัวเราะเหมือนวันที่ได้ยินว่ามีคนแย่งกันโกงนาง บอกว่านางเคยเต้นรำกับหลานชายคนสุดท้ายของตระกูลกาเรดอสตอนอายุสิบห้า เขาเหยียบเท้านางสามครั้ง

        ในห้องรับแขกของฮอบรัน นางเล่าเรื่องงานเต้นรำนั้นต่อหน้าทนายของสภา เล่าว่าหลานชายคนนั้นมีลูกนอกสมรสกับคนเลี้ยงม้า เล่าถึงสีขนของม้าด้วย ชายผมทาน้ำมันลุกออกไปก่อนนางจะเล่าจบ ฮอบรันจ่ายสิบเหรียญ {name}แบ่งให้นางครึ่งหนึ่ง นางไม่รับ บอกว่าบ่ายนี้สนุกที่สุดในรอบสิบปีแล้ว
      effects: { gold: 10, alignment: { moral: -1 }, flags: [sold_a_title, widow_partner] }

- id: adult.mid_swindler_believers
  stage: adult
  scene: noble_hall
  weight: 45
  when:
    age: [33, 40]
    flags: [job_swindler]
    not_orgs: [star_listeners]
  text: |
    งานเก่าตายไปทีละงาน หุ้นทุ่งจานรับดาวขายไม่ได้แล้วเพราะทุ่งจริงมีขึ้นใหม่ทุกเดือน ตระกูลขุนนางที่สูญไปแล้วมีคนขุดขึ้นมาขายหมด ตาของ{name}ต้องหรี่ทุกครั้งที่อ่านตัวเลขเล็ก และหน้าของ{name}มีคนในเวนทราสจำได้มากเกินไป

    งานใหม่มาจากที่ที่{name}ไม่คาด กลุ่มผู้ฟังดาวในเวนทราสเช่าห้องโถงในบ้านขุนนางเก่าหลังหนึ่งไว้นั่งฟังกันทุกคืน คนที่มานั่งเป็นช่างทอ ภารโรง แม่ค้าปลา ทุกคนพูดถึงเสียงหึ่งเหมือนพูดถึงญาติที่อยู่ไกล พวกเขากำลังเรี่ยไรเงินสร้างจานรับดาวใบใหญ่ที่สุดในเมือง ไม่ได้เอาไว้กลั่น เอาไว้ฟังให้ชัดขึ้น ชามเรี่ยไรตั้งอยู่กลางห้อง เหรียญทองแดงขึ้นมาถึงครึ่งชามแล้ว

    เนลลา ลูกมือที่{name}รับไว้ตั้งแต่นางอายุสิบสี่ ตอนนี้สิบหก นั่งข้าง{name}ในแถวหลัง นางกำลังนับเหรียญในชามด้วยสายตา และนับได้เร็วกว่า{name}
  choices:
    - id: hold_the_purse
      label: อาสาเป็นคนถือชามเรี่ยไร แล้วหายไปพร้อมชาม
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          สามเดือนที่{name}นั่งแถวหน้า ฟังเรื่องเสียงหึ่งจนเล่าตามได้ทุกคำ จนวงยกชามเรี่ยไรให้ถือ คืนที่ชามเต็ม {name}เดินออกประตูหลังไปพร้อมชาม ทิ้งเสื้อคลุมไว้บนเก้าอี้ให้ดูเหมือนแค่ออกไปข้างนอกครู่เดียว

          สิบสี่เหรียญ เหรียญทองแดงทั้งหมด หลายเหรียญยังติดกลิ่นปลา เนลลาช่วยนับ นับเสร็จนางแยกเหรียญเหรียญหนึ่งไว้ต่างหาก บอกว่าเหรียญนี้เป็นของยายที่นั่งข้างประตู แล้วไม่ยอมหยิบส่วนของตัวเอง
        effects: { stats: { DEX: 1 }, gold: 14, alignment: { moral: -1 }, world: { star: -1 }, reputation: { star_listeners: -1 }, flags: [robbed_the_listeners] }
      failure:
        text: |
          คืนที่ชามเต็ม ภารโรงคนหนึ่งในวงนั่งอยู่ที่บันไดหลังบ้าน เขาไม่ได้เฝ้า เขาแค่ชอบนั่งฟังตรงนั้นเพราะข้างในคนเยอะ {name}เดินมาเจอเขาพร้อมชามในมือ เขาลุกขึ้น ขอบคุณที่ช่วยถือชามออกมาให้ แล้วรับไปถือเอง

          ตั้งแต่นั้นคนในวงยิ้มให้{name}ทุกคืน เชิญให้นั่งแถวหน้า ถามว่าได้ยินชัดขึ้นบ้างไหม ทั้งวงรู้จักหน้า{name}ดีกว่าใครในเมือง
        effects: { reputation: { star_listeners: 1 }, flags: [listeners_know_you] }
    - id: stall_the_dish
      label: ปลอมเป็นนายหน้าทองแดงจากฮอร์ดุน รับมัดจำค่าจาน
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}ใส่เสื้อหนังแบบนายหน้าคนแคระ เอาแผ่นทองแดงตัวอย่างไปวางให้วงดู บอกว่าทองแดงสำหรับจานใบใหญ่ต้องหลอมจากเหมืองในเทือกเขาฮอร์ดุนเท่านั้น ต้องสั่งล่วงหน้าและวางมัดจำครึ่งหนึ่ง วงจ่ายแปดเหรียญ

          ทองแดงไม่เคยมา {name}ส่งจดหมายเลื่อนวันไปทุกเดือนด้วยลายมือแบบคนแคระที่ฝึกมาสามคืน จานใบใหญ่ไม่ได้สร้างอยู่สองปี วงยังนั่งฟังกันทุกคืนในห้องโถงนั้น ฟังจากจานใบเล็กใบเดิม
        effects: { stats: { INT: 1 }, gold: 8, world: { star: -1 }, flags: [stalled_the_great_dish] }
      failure:
        text: |
          ในวงมีช่างหลอมคนหนึ่งเคยทำงานในเทือกเขาฮอร์ดุน เขาหยิบแผ่นทองแดงตัวอย่างของ{name}ขึ้นดม แล้วบอกว่านี่ทองแดงหลอมซ้ำจากหม้อเก่าของโรงกลั่น ไม่ใช่ของเหมือง วงไม่โกรธ คนในวงนี้ไม่มีใครโกรธใครเป็น พวกเขาขอแค่ค่าจ้างคนส่งจดหมายสามเหรียญคืน

          {name}คืนให้ ตั้งแต่นั้นคนในวงจำหน้า{name}ได้ทุกคน และทักทุกครั้งที่เจอกันในตลาด
        effects: { gold: -3, flags: [listeners_know_you] }
    - id: pull_nella_out
      label: พาเนลลาออกจากงานนี้ บอกนางว่าวงนี้ไม่ใช่เหยื่อ
      text: |
        {name}พาเนลลาออกมาก่อนวงจะเริ่มฟัง เดินเลียบคลองไปจนถึงท่าเรือ แล้วบอกนางว่าคนที่จ่ายเงินเพื่อฟังเสียงที่ตัวเองได้ยินอยู่แล้ว ไม่ใช่คนที่คนอย่างเราควรไปหา นางถามว่าแล้วคนแบบไหนที่ควร {name}ตอบไม่ได้

        ปีต่อมาเนลลาไปเป็นลูกมือร้านพิมพ์หลังท่าเรือ ร้านที่พิมพ์กระดาษหุ้นตราหัวสิงห์ให้{name}มาหลายปี นางพิมพ์ประกาศรับคนงาน พิมพ์ใบเสร็จ และไม่พิมพ์หุ้นให้ใครอีก
      effects: { alignment: { law: 1 }, flags: [kept_nella_out] }
    - id: widow_in_the_circle
      label: ใส่เหรียญสิบสองเหรียญลงชาม ต่อหน้าคนรับใช้แก่ของท่านหญิงอิสเวล
      requires: { flag: conned_the_widow, min_gold: 12 }
      text: |
        {name}จำเขาได้ตั้งแต่คืนแรก คนรับใช้แก่ที่เคยเปิดประตูบ้านปลายถนนสายขุนนางเก่าให้ ตอนนี้แก่ลงอีกหลายหนาว นั่งแถวหน้า หลับตาฟัง เขาเล่าให้วงฟังว่านายหญิงของเขาตายไปเมื่อสามหนาวก่อน ไม่มีอะไรเหลือให้เขา นอกจากกล่องไม้ใต้เตียงที่ว่างเปล่า

        คืนนั้น{name}เดินไปที่ชามเรี่ยไรกลางห้อง หยิบเหรียญออกจากกระเป๋าวางลงทีละเหรียญจนครบสิบสองเหรียญ เท่ากับเหรียญเงินตราเก่าที่นางเคยนับให้ด้วยมือทั้งสองข้าง คนรับใช้แก่ลืมตาขึ้นตอนเหรียญที่สิบสองกระทบชาม แล้วหลับตาลงอีกครั้ง
      effects: { gold: -12, alignment: { moral: 1 }, reputation: { star_listeners: 1 }, flags: [repaid_the_widow] }

- id: adult.mid_switch_warrior
  stage: adult
  weight: 15
  when:
    age: [26, 31]
    class: warrior
  text: |
    จดหมายมาถึงในฤดูฝนปีหนึ่ง จากเพื่อนที่ฝึกดาบไม้ลานเดียวกันเมื่อสิบกว่าปีก่อน เขียนด้วยถ่านบนกระดาษห่อของ ตัวหนังสือโย้ไปทางขวาเหมือนสมัยเด็ก

    เพื่อนคนนั้นเล่าว่าทุกที่ขาดคน ราชนาวีรับทหารที่เคยผ่านงานจริงเข้าประจำการโดยไม่ต้องสอบใหม่ ป้อมผู้เฝ้าผนึกในแดนเถ้ามีเตียงว่างมากกว่าเตียงที่มีคนนอน บริษัทเหมืองขึ้นค่าจ้างยามขบวนถ่านอีกเท่าครึ่ง เพราะไม่มีใครอยากไปปลายรางที่ลึกขึ้นทุกปี ท้ายจดหมายเขียนว่า ถ้า{name}ยังทำงานเดิมและยังไม่เบื่อ ก็ไม่ต้องตอบ

    {name}อ่านจบรอบหนึ่ง แล้วอ่านซ้ำอีกรอบ ช้ากว่าเดิม
  choices:
    - id: stay
      label: พับจดหมายเก็บ ทำงานเดิมต่อ
      text: |
        {name}พับจดหมายเป็นสี่ส่วน สอดไว้ใต้ฝาหีบ ไม่ตอบ งานเดิมยังรออยู่ในวันรุ่งขึ้น คนเดิม ปัญหาเดิม

        ปลายเดือนนายจ้างขึ้นเงินให้สองเหรียญโดยไม่มีใครขอ บอกว่าคนที่อยู่มานานขนาดนี้หาไม่ได้แล้วในตลาด
      effects: { gold: 2, alignment: { law: 1 } }
    - id: to_navy
      label: ไปรายงานตัวกับราชนาวีที่เวนทราส
      requires: { min_stat: { STR: 14 }, not_flags: [job_navy, race_tiefling] }
      text: |
        นายสิบที่โต๊ะรับสมัครริมท่าน้ำเวนทราสดูมือของ{name}ก่อนดูหน้า เห็นรอยด้านของคนที่จับอาวุธจริงมาหลายปี แล้วเขียนชื่อลงช่องทหารประจำการโดยไม่ต้องแบกกระสอบทราย

        ทหารในเรือลำแรกของ{name}อ่อนกว่า{name}เกือบสิบปีทุกคน พวกเขาเรียก{name}ว่าพี่ตั้งแต่วันแรก เรียกจนนายสิบต้องสั่งห้าม
      effects: { flags: [job_navy], clear_flags: [job_wardens, job_mercenary], location_tag: ventras, reputation: { crown: 1 } }
    - id: to_navy_hidden
      label: ไปรายงานตัวกับราชนาวีที่เวนทราส
      requires: { flag: horns_sawn, min_stat: { STR: 14 }, not_flags: [job_navy] }
      text: |
        หมวกทหารเรือทรงสูงปิดตอเขาได้มิด {name}เลือกหมวกทุกใบในชีวิตด้วยเรื่องนี้ก่อนเรื่องอื่น นายสิบที่โต๊ะรับสมัครดูมือก่อนดูหน้า ไม่มีใครเสียเวลาตรวจหัวของคนที่ผ่านงานจริงมาแล้ว

        {name}ได้เตียงชั้นล่างชิดผนังในห้องนอนรวม คืนแรกหมวกวางอยู่ข้างหมอน มือข้างหนึ่งจับขอบหมวกไว้จนหลับ
      effects: { flags: [job_navy], clear_flags: [job_wardens, job_mercenary], location_tag: ventras, reputation: { crown: 1 } }
    - id: to_wardens
      label: ไปแดนเถ้า รับเตียงว่างในป้อมสามของผู้เฝ้าผนึก
      # คนที่สาบานหรือลงชื่อกับองค์กรของชุด อ ไว้แล้วรับเตียงของภาคีอีกไม่ได้
      requires: { not_flags: [job_wardens], not_orgs: [wick, cold_iron, reclaimers, star_listeners, ash_cult] }
      text: |
        หัวหน้าป้อมสามให้{name}เลือกเตียงเหมือนที่ให้ทุกคน เตียงไหนก็ได้ เจ้าของเดิมไม่กลับมาเอาแล้ว บนผนังห้องกินข้าวมีหัวหอกไหม้ดำแขวนเรียงอยู่หลายสิบอัน ใต้แต่ละอันเขียนชื่อไว้ด้วยถ่าน บางชื่อจางจนอ่านไม่ออกแล้ว แต่คนในป้อมยังเรียกได้ครบ

        กะดึกคืนแรก{name}ยืนบนแนวหินจนสาง เถ้าใต้เท้าอุ่นเหมือนพื้นครัวตอนเพิ่งดับเตา
      effects: { flags: [job_wardens], clear_flags: [job_navy, job_mercenary], location_tag: ashland, reputation: { wardens: 1 }, stats: { CON: 1 } }
    - id: to_mercenary
      label: ไปเป็นยามขบวนถ่านของบริษัทเหมือง
      requires: { not_flags: [job_mercenary] }
      text: |
        หัวหน้าขบวนของบริษัทเหมืองนั่งรอในโรงเตี๊ยม วางเหรียญทองแดงเรียงไว้บนโต๊ะเจ็ดเหรียญ ลงชื่อเสร็จก็กวาดใส่กระเป๋าได้เลย

        ขบวนแรกที่{name}คุมวิ่งลึกเข้าไปในแดนเถ้าไกลกว่าที่เคยได้ยินคนเล่า ปลายรางมีป้ายบอกระยะทางถึงตอเสาปักไว้ ตัวเลขบนป้ายมีรอยขีดแก้ใหม่สามครั้ง น้อยลงทุกครั้ง
      effects: { flags: [job_mercenary], clear_flags: [job_navy, job_wardens], location_tag: ashland, gold: 7 }

- id: adult.mid_switch_rogue
  stage: adult
  weight: 15
  when:
    age: [26, 31]
    class: rogue
  text: |
    ชื่อจริงของ{name}ดังขึ้นใต้ตะเกียงปากซอยคืนหนึ่ง ด้วยเสียงของคนที่{name}ไม่เคยได้ยินมาก่อน ในเมืองที่{name}ใช้ชื่ออื่นมาหลายปี ชื่อจริงฟังแปลกหูเหมือนชื่อของคนที่ตายไปแล้ว

    คนเรียกเป็นหญิงวัยกลางคน เสื้อคลุมสีหม่น นางบอกว่าไม่ได้มาเอาเรื่อง มาบอกข่าว ในเวนทราสมีงานว่างอยู่สามที่ และทุกที่รู้จักฝีมือของ{name} หนูท่าขาดคนคุมทางลับออกจากเมือง ห้องใต้ดินวิหารเบเลคขาดคนเฝ้าที่พูดจาเป็น ส่วนย่านขุนนางเก่ามีบ้านว่างหลังหนึ่งรอคนที่รู้วิธีทำให้คนรวยเชื่อ

    นางวางกระดาษพับสามแผ่นไว้บนขอบหน้าต่าง แล้วเดินออกจากแสงตะเกียงไปก่อน{name}จะถามว่านางเป็นใคร
  choices:
    - id: stay
      label: เผากระดาษทั้งสามแผ่น ทำงานเดิมต่อ แล้วย้ายบ้าน
      text: |
        กระดาษสามแผ่นไหม้หมดในเตาก่อนน้ำในกาจะเดือด {name}ไม่ได้เปิดอ่านแผ่นไหนเลย

        เช้าวันรุ่งขึ้น{name}ย้ายบ้านเช่าไปอยู่อีกฝั่งคลอง ทางไปทำงานไกลขึ้นสามซอย และ{name}เดินไม่ซ้ำทางเลยสักวัน
      effects: { stats: { DEX: 1 } }
    - id: to_smuggler
      label: รับงานคุมทางของหนูท่า
      requires: { not_flags: [job_smuggler] }
      text: |
        กระดาษแผ่นแรกเขียนแค่ชื่อร้านขายเชือกริมคลองเจ็ดกับเวลาตีสอง ห้องใต้ร้านมีกระดานดำแผ่นหนึ่ง ชื่อคนนำทางเขียนเรียงลงมา ชื่อที่ขีดฆ่ามีมากกว่าชื่อที่เหลือ

        หนูท่าที่รออยู่ในห้องเขียนชื่อใหม่ต่อท้ายกระดานด้วยปูนขาวก้อนเล็ก แล้วยื่นเงินค่ารับงานให้สามเหรียญ บอกว่าที่นี่จ่ายล่วงหน้าเสมอ เพราะบางคนไม่ได้กลับมาเก็บ
      effects: { flags: [job_smuggler], clear_flags: [job_bank_spy, job_swindler], location_tag: ventras, reputation: { dock_rats: 1 }, gold: 3 }
    - id: to_bank_spy
      label: รับงานเฝ้าคนให้ห้องใต้ดินวิหารเบเลค
      requires: { min_stat: { CHA: 13 }, not_flags: [job_bank_spy] }
      text: |
        ห้องใต้ดินของวิหารเบเลคเย็นเท่ากันทุกฤดู หัวหน้าเสมียนยื่นแผ่นทองเหลืองตราตาชั่งให้{name}ด้วยปลายนิ้วสองนิ้ว แล้วบอกกฎข้อเดียว เห็นอะไรให้เขียน ไม่เห็นก็ให้เขียนว่าไม่เห็น เบเลคไม่ชอบช่องว่าง

        ซองงานซองแรกมาถึงในวันเดียวกัน ข้างในเป็นชื่อพ่อค้าข้าวคนหนึ่ง ที่อยู่ของเขา และชื่อลูกสามคนของเขา
      effects: { flags: [job_bank_spy], clear_flags: [job_smuggler, job_swindler], location_tag: ventras, reputation: { belek_bank: 1 }, alignment: { law: 1 } }
    - id: to_swindler
      label: ไปรับบ้านว่างในย่านขุนนางเก่า
      requires: { not_flags: [job_swindler] }
      text: |
        บ้านว่างหลังนั้นมีโต๊ะเก้าอี้ครบทุกห้อง ฝุ่นหนาเท่ากันทุกชิ้น ในตู้มีเสื้อผ้าสามชุด ขนาดพอดีตัว{name}ทุกชุด ใครสักคนรู้ขนาดตัวของ{name}มานานแล้ว

        ภายในเดือนแรก{name}มีชื่อใหม่หนึ่งชื่อ ประวัติครอบครัวหนึ่งชุด และเพื่อนบ้านสองคนที่เชื่อทั้งสองอย่าง
      effects: { flags: [job_swindler], clear_flags: [job_smuggler, job_bank_spy], location_tag: ventras, alignment: { law: -1 } }
