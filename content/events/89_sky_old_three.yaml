# ชุด 5 ยุคดาวเร่ง แพ็ก ก: สามด้านเดิมในบ้านธรรมดา (12 เรื่อง)
# ผู้มองลงมา curse_watcher: 1 ผ้าเพดาน (ทุกวัย คนมีตรามีทางของตัวเอง) · 2 มองจนมีอะไรมองกลับ ดันรอยดาว (ทุกวัย) · 3 งานกะดึก (วัยปลาย) · 4 ทางออก
# เสียงหึ่ง curse_hum: 1 เสียงที่เริ่มเป็นคำ (ทุกวัย) · 2 คนเติมตะเกียงน้ำค้าง ดันรอยดาว (วัยทำงาน เวนทราสกับคาร์ดิน) · 3 หูฟังเครื่อง (ทุกวัย) · 4 ทางออก
# ผิวแก้ว curse_glass: 1 บ้านปิดม่าน (ทุกวัย) · 2 ของที่ตกลงมากลางซอย ดันรอยดาว (วัยทำงาน) · 3 นั่งเฝ้าในที่มืด (วัยปลาย) · 4 ทางออก
# คนที่มีแต่ในข้อความ: ไอลา ช่างตอกผ้าเพดาน · ดอร์ส หัวหน้าคนเติมตะเกียงน้ำค้าง · ทอร์กา ตระกูลทั่งหนาว ช่างคนแคระที่หล่อจุกหูตะกั่ว
#   ยายอิลซาบ้านเบเรน คนแก้วหลังม่านสุดซอย กับลูกสาวของนาง
# ข้อความไม่อธิบายว่าอะไรมองลงมา อะไรหึ่ง หรือแก้วมาจากไหน คนมีตราไม่ได้ยินเสียงหึ่ง ลายไม้ไม่มองกลับ และคนแก้วไม่มีเรื่องของเขาจะเล่า

# ================= ผู้มองลงมา =================

# ---------- 1 ในบ้าน: ผ้าเพดาน ----------
- id: adult.sky_eye_cloth_ceiling
  stage: adult
  weight: 24
  scene: home
  when:
    age: [16, 130]
    year: [346, 362]
  text: |
    ไอลาเดินซอยนี้มาตั้งแต่ต้นฤดู หอบผ้าดิบม้วนใหญ่กับถุงตะปูทองแดง รับตอกผ้าปิดเพดานห้องนอน คิดค่าแรงตามแผ่นไม้ บ้านไหนเรียกก็ไป ไม่ถามว่าทำไม คนในซอยเรียกนางว่าช่างผ้าเพดาน เหมือนเป็นช่างอีกแบบที่มีมานานแล้ว

    วันนี้นางตอกอยู่ที่บ้านติดกัน เด็กสองคนของบ้านนั้นไม่ยอมนอนห้องตัวเองมาสามคืน ตาไม้บนแผ่นเพดานเหนือเตียงเป็นวงรี มีจุดดำตรงกลาง และวงนั้นเลื่อนตามคนที่เดินผ่านใต้มัน เด็กว่าอย่างนั้น พ่อของเด็กว่าเด็กพูดเพ้อ แล้วก็ไปตามไอลามาเอง นางบอกว่าทาปูนขาวไม่ได้ ทาไปฝนหน้าลายก็ขึ้นมาใหม่ ผ้าดิบดีกว่า

    ขาออก ไอลายืนที่ประตูห้องนอนของ{name} แหงนดูเพดานครู่หนึ่ง แล้วบอกว่ามีสองวงเหนือหมอนพอดี ถ้าจะทำ นางคิดราคาบ้านติดกัน
  choices:
    - id: let_her_nail_it
      label: ให้นางตอกผ้าปิดเพดาน
      text: |
        ไอลาตอกเสร็จก่อนค่ำ ผ้าตึงจนตีนิ้วแล้วดังเหมือนกลอง นางเก็บตะปูที่หล่นทุกตัว บอกว่าตะปูทองแดงแพง คืนนั้น{name}หลับเร็วกว่าที่เคย

        สัปดาห์ต่อมา{name}ตื่นกลางดึก นอนหงายดูผ้าดิบสีขาวในความมืด ตรงเหนือหมอนผ้าดูบางกว่าตรงอื่นนิดหนึ่ง เหมือนผ้าที่โดนแดดส่องผ่านเป็นวงเล็กๆ ข้างนอกยังมืดสนิท {name}พลิกตัวหันหน้าเข้าผนัง แล้วนอนต่อ
      effects: { gold: -1, flags: [had_the_ceiling_clothed] }
    - id: turn_the_board
      label: งัดแผ่นเพดานแผ่นนั้นลงมา พลิกด้านหลังขึ้นแทนเอง
      habit: craft_hands
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ตะปูเก่าคลายออกทีละตัว แผ่นไม้ลงมาทั้งแผ่นไม่แตก ด้านหลังเป็นไม้เรียบ ลายตรง ไม่มีตาสักวง {name}ตอกกลับขึ้นไปด้วยตะปูตัวเดิม ไอลายืนดูอยู่ที่ประตู บอกว่าทำเองก็ได้เหมือนกัน แต่ส่วนมากคนไม่กล้าแตะ

          ปลายเดือน{name}นอนหงายดูเพดาน ลายไม้ด้านหลังที่เคยตรงเริ่มโค้งเข้าหากันตรงกลางแผ่น ยังไม่เป็นวง ยังเป็นแค่ลายโค้ง
        effects: { stats: { DEX: 1 }, flags: [turned_the_ceiling_board] }
      failure:
        text: |
          แผ่นไม้ผุกว่าที่คิด ชะแลงงัดได้ครึ่งเดียวแผ่นก็แตกตามยาว เสี้ยนชิ้นยาวเข้าโคนนิ้ว ฝุ่นกับขี้หนูร่วงลงเต็มหมอน หลังคาตรงนั้นเห็นฟ้าเป็นช่องยาว

          ไอลาช่วยดึงเสี้ยนออก แล้วตอกผ้าดิบปิดช่องให้ทั้งห้องในราคาเดิม คืนนั้นลมลอดผ้าเข้ามาทั้งคืน ผ้าป่องขึ้นลงเหนือหมอนเหมือนคนหายใจ
        effects: { hp: -1, flags: [turned_the_ceiling_board] }
    - id: carry_her_tacks
      label: รับจ้างถือถุงตะปูให้นางเดินซอยอื่นต่อ
      text: |
        {name}เดินตามไอลาไปอีกสามซอย ถือถุงตะปูกับปลายผ้า ส่งตะปูให้ทีละตัว ทุกบ้านที่เข้าไปมีวงแบบเดียวกันอยู่เหนือที่นอน บางบ้านมีวงเดียว บางบ้านมีทั้งแผ่น บ้านหนึ่งเจ้าของเอาจานกระเบื้องตอกตะปูติดเพดานปิดวงไว้ทีละวงก่อนจะยอมเรียกช่าง

        ตกค่ำไอลาแบ่งค่าแรงให้สองเหรียญ นางบอกว่าเดือนนี้ผ้าดิบขึ้นราคาแล้ว พวกร้านผ้ารู้เรื่องเร็วกว่าช่าง
      effects: { gold: 2, flags: [carried_tacks_for_the_ceiling_clother] }
    - id: lie_under_the_knot
      label: ไปนอนเตียงเด็กบ้านติดกันคืนหนึ่ง ดูวงบนเพดานด้วยตาตัวเอง
      habit: curious
      requires: { trait: curse_brand }
      text: |
        {name}นอนหงายบนเตียงเด็ก จุดตะเกียงไว้ที่หัวเตียง วงบนเพดานเป็นตาไม้ธรรมดา สีเข้มกว่าเนื้อไม้รอบๆ {name}ลุกเดินไปมาใต้วงจนดึก วงไม่เลื่อนตาม เป็นไม้อยู่อย่างนั้นทั้งคืน

        เช้ามาเด็กสองคนยืนรอที่ประตู ถามว่ามันมอง{name}ไหม {name}บอกว่าไม่ เด็กคนโตปีนขึ้นเตียง แหงนดูวงนั้นแล้วบอกว่ามันมองอยู่ มองอยู่ตลอด แต่ไม่ได้มอง{name} คืนนั้นเด็กสองคนขอมานอนห้อง{name}
      effects: { stats: { CHA: 1 }, flags: [slept_under_the_eye_unseen] }

# ---------- 2 ทางเข้า: มองจนมีอะไรมองกลับ ----------
- id: adult.sky_eye_look_back
  stage: adult
  weight: 22
  time: night
  when:
    age: [16, 130]
    year: [350, 372]
    not_traits: [curse_brand, curse_watcher]
  text: |
    คืนฟ้าใสหลังฝนคนในซอยขึ้นไปนั่งบนหลังคาเรือนยาวกันหลายบ้าน เอาเสื่อขึ้นไปปู เอาถั่วคั่วขึ้นไปกิน นับดาวดวงใหม่ที่ขึ้นมาเพิ่มจากเดือนก่อน เด็กนับเลขตามผู้ใหญ่จนหลับไปทีละคน ลูกมือคนหนึ่งของคนส่งตัวเลขจากหอดูดาวมาค้างที่ซอย เขาว่าหอรับจ้างคนนับเป็นกลุ่มๆ จ่ายเป็นเหรียญทองแดงต่อคืน ใครนับตรงกับคนอื่นก็ได้ค่าจ้าง

    มีกลุ่มดาวใหม่กลุ่มหนึ่งทางตะวันออก ขึ้นชิดกันจนนับไม่ถูก ยิ่งมองนานยิ่งเห็นเพิ่ม ยายบ้านหัวซอยบอกทุกคนว่าอย่ามองกลุ่มนั้นนาน คนที่มองจนดาวกะพริบพร้อมกันหมด นางว่า จะกลับลงไปนอนไม่หลับอีก นางพูดแล้วก็มองต่อ
  choices:
    - id: look_until_it_looks
      label: มองกลุ่มดาวนั้นต่อไป จนกว่าจะเห็นทุกดวง (ของแบบนี้ติดตัวไปนาน)
      habit: curious
      text: |
        {name}นอนหงายบนเสื่อ ตาไม่ละจากกลุ่มนั้น นับไปได้ร้อยกว่าดวงก็เลิกนับ มองอย่างเดียว ดาวดวงเล็กที่สุดตรงกลางกลุ่มค่อยๆ ชัดขึ้น ชัดกว่าดวงอื่น แล้วดาวทั้งกลุ่มกะพริบพร้อมกันครั้งหนึ่ง ช้าๆ เหมือนคนกะพริบตา

        {name}ไม่ได้ลุกหนี ไม่ได้หลับตา จนหลังคาเงียบ คนอื่นลงไปนอนกันหมดแล้ว ลงไปถึงห้องก็ยังรู้ว่ามีอะไรอยู่เหนือเพดาน ข้างบนนั้น ไม่รีบ ไม่ไปไหน ตอนรุ่ง{name}เห็นเม็ดฝุ่นบนขอบหน้าต่างทุกเม็ด เห็นรอยนิ้วของคนที่เคยจับกลอนประตูเมื่อวาน เห็นทุกอย่าง ยกเว้นความง่วง
      effects: { traits: [curse_watcher], marks: { star: 1 }, world: { star: 1 }, flags: [looked_until_it_looked_back] }
    - id: count_for_the_tower
      label: นับดาวให้หอรับจ้างทั้งคืน เอาค่าจ้าง
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}แบ่งฟ้าเป็นช่องด้วยขอบหลังคากับยอดเสา นับทีละช่อง ไม่จ้องช่องไหนนาน นับจบแล้วนับซ้ำ ตัวเลขตรงกับคนนับอีกสองคนเกือบทุกช่อง ลูกมือของหอจดลงสมุด จ่ายเหรียญทองแดงให้ แล้วถามว่าคืนหน้าว่างไหม

          กลุ่มทางตะวันออก{name}ไม่ได้นับ ปล่อยช่องนั้นว่างไว้ในสมุด ลูกมือไม่ว่าอะไร ช่องนั้นว่างในสมุดของทุกคน
        effects: { stats: { INT: 1 }, gold: 1, flags: [counted_stars_for_the_tower] }
      failure:
        text: |
          ตัวเลขของ{name}ไม่ตรงกับใครเลย นับใหม่ก็ไม่ตรง ยิ่งนับยิ่งได้เพิ่ม ลูกมือของหอให้ไปนับช่องตะวันออกช่องเดียวให้จบ {name}จ้องช่องนั้นจนตาแสบ นับได้เท่าไรก็ไม่ครบ แล้วทั้งช่องก็กะพริบพร้อมกันครั้งหนึ่ง

          คืนนั้น{name}ลงไปนอน นอนจนสาง ตาไม่ยอมปิด ข้างบนเพดานมีอะไรรออยู่ คืนต่อมาก็ยังรออยู่
        effects: { traits: [curse_watcher], flags: [counted_stars_for_the_tower] }
    - id: climb_down
      label: ลงจากหลังคา ปิดบานเกล็ด แล้วไปนอน
      text: |
        {name}เก็บเสื่อลงมาคนแรก คนบนหลังคาแซวตามหลังว่าขี้กลัว {name}ปิดบานเกล็ดทุกบาน นอนฟังเสียงคนนับเลขอยู่ข้างบนจนหลับไป

        สัปดาห์ต่อมาลูกมือของหอมาบอกว่ายายหัวซอยนอนไม่หลับมาเจ็ดคืนแล้ว นั่งหน้าบ้านทั้งคืน ตาเปิดกว้าง ทักทุกคนที่เดินผ่านด้วยเรื่องที่คนนั้นซ่อนไว้
      effects: { flags: [climbed_down_from_the_star_count] }

# ---------- 3 ลึกลง: งานกะดึก (วัยปลาย) ----------
- id: elder.sky_eye_night_work
  stage: elder
  weight: 80
  time: night
  when:
    age: [60, 130]
    year: [352, 379]
    trait: curse_watcher
  text: |
    ข่าวว่า{name}ไม่หลับทั้งคืนเดินไปถึงหูคนที่ต้องการคนแบบนี้ นายโกดังท้ายตลาดส่งคนมาถามว่าจะรับเฝ้ายามไหม นั่งเฉยๆ ทั้งคืน เห็นอะไรก็บอก ค่าจ้างดีกว่าคนหนุ่ม เพราะคนหนุ่มหลับ อีกคนที่มาคือหญิงบ้านถัดไป นางจะขายวัวพรุ่งนี้ อยากให้{name}มานั่งข้างๆ ตอนต่อราคา ดูตาคนซื้อ

    คืนก่อน{name}เห็นแมวตัวหนึ่งเดินบนหลังคาฝั่งโน้นของซอย เห็นชัดถึงหนวด เห็นรอยข่วนที่หู ตะเกียงในซอยดับหมดแล้ว แผลถลอกที่ข้อศอกตั้งแต่เดือนก่อนยังไม่ตกสะเก็ด
  choices:
    - id: take_the_watch
      label: รับเฝ้ายามโกดังทุกคืน
      text: |
        {name}นั่งบนม้านั่งหน้าประตูโกดัง ไม่ต้องมีตะเกียง เห็นหนูทุกตัวที่วิ่งเลียบกำแพง เห็นเด็กที่แอบมาขโมยถั่วตั้งแต่ยังไม่โผล่หัวพ้นรั้ว เห็นนายโกดังเองเดินมาย่องดูตอนตีสาม ว่าคนเฝ้ายามหลับไหม

        ปลายเดือนนายโกดังจ่ายครบ บอกว่าเพิ่งมีเดือนนี้เดือนแรกที่ของไม่หายสักชิ้น {name}กลับบ้านตอนสาง ล้มตัวลงนอน ตาไม่ปิด ผ้าที่พันข้อศอกยังเปียก
      effects: { gold: 2, trait_step: { curse_watcher: 1 }, flags: [took_the_warehouse_night_watch] }
    - id: watch_the_buyer
      label: ไปนั่งข้างหญิงบ้านถัดไปตอนนางต่อราคาวัว
      text: |
        คนซื้อวัวพูดเพราะ ยิ้มเก่ง {name}ดูตาเขาตอนพูดถึงขาหลังของวัว ตาเขาหลบไปทางเกวียนของตัวเองครู่หนึ่ง หลบแค่นั้น {name}กระซิบหญิงบ้านถัดไปว่าเขาจะเอาวัวไปขายต่อ ราคาที่เขาเสนอยังต่ำกว่าที่เขาจะได้ครึ่งหนึ่ง

        นางขึ้นราคา เขาจ่ายโดยไม่เถียง นางแบ่งเงินให้{name}เหรียญหนึ่ง แต่ก่อนออกจากซอยคนซื้อหันมาสบตา{name} {name}สบได้ครู่เดียวก็ต้องหลบ ตาของตัวเองไม่ยอมอยู่นิ่งบนหน้าใคร คืนนั้น{name}นั่งดูเพดานจนสาง
      effects: { gold: 1, trait_step: { curse_watcher: 1 }, flags: [watched_the_cattle_buyers_eyes] }
    - id: refuse_and_cover
      label: ไม่รับทั้งสองงาน ผูกผ้าปิดตานอนทุกคืน
      text: |
        {name}ซื้อผ้าดำเนื้อแน่นจากร้านผ้ามาพับสี่ทบ ผูกปิดตาตั้งแต่หัวค่ำ หลับก็ไม่หลับ แต่ไม่ต้องเห็น ใต้ผ้ามืดสนิท มืดจนรู้ว่าข้างบนเพดานยังมีอะไรอยู่ แต่ไม่ต้องสบตา

        หญิงบ้านถัดไปขายวัวได้ราคาต่ำ นางไม่ได้ว่าอะไร เดินผ่านหน้าบ้านก็ยังทัก แต่ไม่มาขออะไรอีก
      effects: { gold: -1, flags: [slept_blindfolded_against_the_watcher] }

# ---------- 4 ทางออก ----------
- id: adult.sky_eye_way_out
  stage: adult
  weight: 150
  once: false
  scene: home
  when:
    age: [16, 130]
    year: [352, 410]
    trait: curse_watcher
    not_flags: [kept_the_watching_eyes]
  text: |
    ไอลาช่างผ้าเพดานรู้จักคนที่หายแล้วสองคน คนหนึ่งไม่เงยหน้ามองฟ้าตอนกลางคืนเลยครบปีเต็ม ทั้งปีใส่หมวกปีกกว้าง ไม่ออกจากบ้านหลังตะวันตก ปิดบานเกล็ดทุกบาน ใครชวนขึ้นหลังคาไม่ไป อีกคนเดินทางไปถึงหอนับดาวในป่าไอเลธ ให้หมอตาของหอเย็บเปลือกตาด้วยด้ายเงินดาวหนึ่งคืน เข็มเย็บแล้วเจ็บ ด้ายแพง ทางไกล

    ไอลาเล่าระหว่างตอกผ้าผืนใหม่ซ้อนผืนเก่าบนเพดานห้อง{name} ผืนเก่าบางลงเป็นวงเหนือหมอนสองวงแล้ว
  choices:
    - id: a_year_without_sky
      label: ไม่เงยมองฟ้าตอนกลางคืนให้ครบปีเต็ม
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ซื้อหมวกปีกกว้าง เลิกงานทุกอย่างที่ต้องอยู่นอกบ้านหลังตะวันตก เงินที่เคยได้จากงานกะดึกหายไปทั้งปี คืนที่มีคนในซอยร้องเรียกให้ขึ้นไปดูดาวตก{name}นั่งหันหลังให้หน้าต่าง กำมือไว้บนเข่าจนเล็บจิกฝ่ามือ ช่วงกลางปีคืนหนึ่งเผลอเดินออกไปหลังบ้าน เห็นเงาของตัวเองบนดินแล้วรู้ทัน ก้มหน้าเดินกลับเข้ามา

          ครบปีคืนนั้น{name}หลับ หลับตั้งแต่หัวค่ำจนสาย ตื่นมาเห็นเพดานผ้าดิบเป็นผ้าธรรมดา บางตรงไหนก็บางเพราะเก่า แผลเล็กแผลน้อยที่ค้างมานานตกสะเก็ดในสามวัน
        effects: { lose_traits: [curse_watcher], marks: { star: -1 }, gold: -2, flags: [went_a_year_without_the_night_sky] }
      failure:
        text: |
          ไปได้เกือบครบปี คืนหนึ่งบ้านหัวซอยไฟไหม้ ทั้งซอยออกมาตักน้ำ {name}ออกไปช่วยส่งถัง ไฟสว่างจนเห็นควัน ควันลอยขึ้นไป ตาก็ตามขึ้นไปเอง ฟ้าเปิดอยู่ข้างบนควัน กลุ่มดาวทางตะวันออกกะพริบพร้อมกันหนึ่งที

          เงินที่ไม่ได้ทำงานกะดึกมาทั้งปีหายไปเปล่า คืนต่อมา{name}นอนหงายดูเพดานจนสางเหมือนเดิม
        effects: { gold: -2, flags: [broke_the_year_without_sky] }
    - id: stitched_with_star_silver
      label: เดินทางไปหอนับดาว ให้หมอตาเย็บเปลือกตาด้วยด้ายเงินดาวหนึ่งคืน
      text: |
        ทางไปถึงหอนับดาวกินเงินเก็บไปเกือบหมด หมอตาของหอเป็นเอลฟ์มือเย็น เขาให้{name}นอนบนแคร่ไม้ในห้องที่ไม่มีหน้าต่าง ทาน้ำมันหอมที่ขอบตา แล้วเย็บ เข็มแต่ละครั้งเจ็บจนน้ำตาไหลลงทั้งสองข้าง ด้ายเงินดาวเย็นเฉียบทุกเส้นที่ลอดผ่านเนื้อ ทั้งคืนข้างบนห้องมีอะไรค้นหาอยู่ ค้นหาแล้วไม่เจอ

        เช้ามาหมอตัดด้ายออกทีละเส้น เก็บด้ายใส่ซองเพราะด้ายแพง {name}ลืมตาขึ้นมาเห็นเพดานไม้ของหอ ลายไม้เป็นลายไม้ ขากลับนอนหลับทุกคืนในโรงเตี๊ยมริมทาง ขอบตามีรอยเข็มจางๆ อยู่สองแถว
      effects: { lose_traits: [curse_watcher], marks: { star: -1 }, gold: -3, hp: -1, flags: [had_the_eyelids_stitched_with_star_silver] }
    - id: second_cloth
      label: จ่ายค่าผ้าผืนใหม่ แล้วรับงานกะดึกต่อไป
      text: |
        ไอลาตอกผ้าผืนใหม่จนตึง {name}จ่ายราคาเดิม คืนนั้นเฝ้ายามได้เงินเท่าค่าผ้า ตอนสางกลับมานอนลืมตาใต้ผ้าที่ซ้อนกัน ผ้าชั้นในบางเป็นวงไปแล้ว ชั้นนอกยังขาวเรียบ อีกพักหนึ่งก็คงต้องเรียกไอลาอีก
      effects: { flags: [kept_the_watching_eyes] }

# ================= เสียงหึ่ง =================

# ---------- 1 ในบ้าน: เสียงที่เริ่มเป็นคำ ----------
- id: adult.sky_hum_words
  stage: adult
  weight: 24
  scene: home
  when:
    age: [16, 130]
    year: [356, 372]
  text: |
    เสียงหึ่งไม่ได้ดังขึ้น ดังเท่าเดิมมาหลายปีแล้ว เสียงต่ำเสียงเดียวใต้เสียงทุกอย่าง ใต้เสียงไก่ ใต้เสียงฝน ใต้เสียงคนคุยกันที่บ่อ คนในซอยเอาฝันของเมื่อคืนมาเทียบกันที่บ่อทุกเช้า ส่วนมากตรงกัน ฝันเรื่องประตูบานหนึ่งที่อยู่ข้างบน เด็กหญิงบ้านถัดไปฮัมเพลงที่ไม่มีใครสอน ฮัมถูกทุกโน้ตทุกเช้า

    ที่เปลี่ยนคือบางคนเริ่มฟังออกเป็นคำ ยายซักผ้าริมบ่อหยุดขยี้ผ้ากลางคันบ่อย ตอบไปในอากาศว่ายังไม่ใช่วันนี้ แล้วขยี้ต่อ คนส่งข่าวจากท่าเรือมาเล่าว่าหุ่นยามที่ท่าเปลี่ยนคำสั่งของตัวเองบ่อยจนนายท่าต้องสั่งปิดเครื่อง ตกเย็นนี้ตาบ้านตรงข้ามเดินมาเคาะหน้าต่าง{name} บอกว่าเมื่อคืนเสียงหึ่งพูดชื่อ{name} แกจำได้ทุกพยางค์ แกถามว่าจะให้แกตอบมันไปว่าอะไร
  choices:
    - id: hum_over_it
      label: บอกแกให้ฮัมเพลงทับไปเหมือนคนกะดึก อย่าตอบอะไรมัน
      text: |
        {name}ฮัมเพลงกล่อมเด็กเพลงหนึ่งให้แกฟัง แกฮัมตาม ร้องผิดคำไปสองสามที แล้วจำได้ คืนนั้นทั้งบ้านตรงข้ามฮัมกันจนดึก เสียงลอดฝามาถึงห้อง{name}

        เช้ามาแกมาบอกว่าเสียงหึ่งยังอยู่ แต่ชื่อไม่ได้ยินแล้ว ได้ยินแต่เพลงของ{name} ตั้งแต่นั้นแกฮัมเพลงนั้นทุกค่ำ ฮัมผิดคำเดิมทุกครั้ง
      effects: { stats: { CHA: 1 }, flags: [taught_the_lane_to_hum_over_it] }
    - id: write_the_words_down
      label: เดินถามทุกบ้านว่าฟังออกเป็นคำว่าอะไร แล้วจดเทียบกัน
      habit: curious
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}จดได้เจ็ดบ้าน ทุกบ้านฟังออกไม่เหมือนกัน ยายซักผ้าได้ยินวันที่ ตาบ้านตรงข้ามได้ยินชื่อ เด็กหญิงบ้านถัดไปได้ยินเพลง เรียงกันแล้วอ่านไม่ออก จน{name}เรียงตามเวลาที่แต่ละคนได้ยิน คำของเจ็ดบ้านต่อกันเป็นประโยคเดียว ถามหาประตูบานหนึ่ง

          {name}ฉีกกระดาษแผ่นนั้นใส่เตาไฟ แล้วไม่ได้เล่าให้ใครฟัง
        effects: { stats: { INT: 1 }, flags: [wrote_down_the_words_in_the_hum] }
      failure:
        text: |
          ทุกบ้านเล่าไม่เหมือนกัน บางบ้านเล่าจนหมดวัน บางบ้านปิดประตูใส่ จดกันไปจนกระดาษหมดสองแผ่น อ่านเทียบกันแล้วไม่ได้อะไร มีแต่คำซ้ำคำเดียวที่ทุกบ้านพูดถึง คือคำว่าเปิด

          ตาบ้านตรงข้ามมาขอดูกระดาษ แกอ่านไม่ออก แต่ขอเก็บไว้ บอกว่าจะเอาไปให้มันฟัง
        effects: { flags: [wrote_down_the_words_in_the_hum] }
    - id: sit_by_the_washerwoman
      label: ไปนั่งข้างยายซักผ้าทั้งบ่าย ฟังว่าแกตอบอะไรบ้าง
      requires: { trait: curse_brand }
      text: |
        {name}ได้ยินเสียงน้ำ เสียงผ้าฟาดหิน เสียงไก่ ใต้เสียงทั้งหมดนั้นไม่มีอะไร ยายซักผ้าขยี้ผ้าไปพูดไป เล่าเรื่องผัวที่ตายไปนาน เล่าจนบ่าย ไม่หยุดตอบอากาศเลยสักครั้ง

        ตอนเก็บผ้า แกบอกว่าวันนี้ข้างที่{name}นั่งเงียบดี หูข้างนี้พักได้ทั้งบ่าย แกถามว่าพรุ่งนี้มานั่งอีกได้ไหม ข้างไหนก็ได้ ขอให้มา
      effects: { stats: { WIS: 1 }, flags: [sat_quiet_beside_the_washerwoman] }

# ---------- 2 ทางเข้า: คนเติมตะเกียงน้ำค้าง (วัยทำงาน) ----------
- id: adult.sky_hum_lamp_filler
  stage: adult
  weight: 22
  time: dusk
  when:
    age: [16, 59]
    year: [348, 374]
    location_tag: [ventras, kardin]
    not_traits: [curse_brand, curse_hum]
  text: |
    ดอร์สหัวหน้าคนเติมตะเกียงน้ำค้างหาคนเพิ่ม งานคือเดินตามถนนตอนพลบ ปีนบันไดขึ้นเติมน้ำค้างใส่ตะเกียงสีฟ้าบนเสาทีละดวง เช็ดกระจก ลงมา เดินต่อ ได้ค่าแรงรายสัปดาห์ แถมห้องนอนบนโกดังน้ำค้างหลังโรงกลั่นให้เช่าครึ่งราคา คนเติมตะเกียงของดอร์สทุกคนอยู่ห้องแถวนั้น

    ใต้ตะเกียงสีฟ้าเสียงหึ่งชัดกว่าที่ไหน ดอร์สบอกว่าอยู่ไปสักพักก็ไม่ได้ยิน เขาเองไม่ได้ยินมานานแล้ว พูดจบเขาฮัมเพลงต่อ ฮัมไม่หยุดเลยตั้งแต่ต้นจนจบ
  choices:
    - id: take_the_room
      label: รับงานกับห้องบนโกดัง อยู่ไปให้นานเท่าที่งานมี (ของแบบนี้ติดตัวไปนาน)
      text: |
        {name}ย้ายของขึ้นห้องบนโกดังสัปดาห์นั้น ห้องอุ่นจากเตากลั่นข้างล่าง ค่าเช่าถูกจนเหลือเงินเก็บทุกเดือน ฤดูผ่านไปฤดูแล้วฤดูเล่า {name}เติมตะเกียงจนปีนบันไดได้ด้วยมือเดียว เช็ดกระจกได้ไม่ต้องมอง

        วันหนึ่ง{name}นั่งกินข้าวกับคนเติมตะเกียงคนอื่น สังเกตว่าเสียงหึ่งไม่ได้มาจากตะเกียงแล้ว ไม่ได้มาจากเตากลั่นข้างล่าง มาจากในหูขวาข้างเดียว อยู่ข้างในนั้นตลอด {name}เริ่มฮัมเพลงโดยไม่รู้ตัว เพลงเดียวกับที่ดอร์สฮัม
      effects: { traits: [curse_hum], marks: { star: 1 }, world: { star: 1 }, gold: 2, flags: [lived_above_the_dew_store] }
    - id: one_season_with_wax
      label: รับงานฤดูเดียว อุดหูด้วยขี้ผึ้งทุกคืน ไม่เอาห้อง
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}เดินมาทำงานจากห้องเช่าเดิมทุกพลบ อุดขี้ผึ้งตั้งแต่ก่อนขึ้นบันไดขั้นแรก เสียงหึ่งลอดเข้ามาได้บ้าง แต่แค่บ้าง หูอื้อไปทั้งฤดู ครบฤดู{name}คืนบันไดให้ดอร์ส เขาจ่ายครบแล้วฮัมเพลงส่ง

          คืนแรกที่ไม่ต้องเติมตะเกียง{name}ดึงขี้ผึ้งออก ฟัง เสียงหึ่งยังอยู่ แต่อยู่ข้างนอก ไกลออกไปทางโรงกลั่น เหมือนที่ทุกคนได้ยิน
        effects: { stats: { CON: 1 }, gold: 1, flags: [filled_lamps_for_one_season] }
      failure:
        text: |
          ขี้ผึ้งละลายเพราะความร้อนจากตะเกียงตั้งแต่สัปดาห์แรก {name}ทำงานต่อโดยไม่อุด คิดว่าฤดูเดียวคงไม่เป็นอะไร งานเลิกดึกจนต้องขอค้างห้องบนโกดังสองสามคืน แล้วเป็นสัปดาห์ละหลายคืน

          ครบฤดู{name}คืนบันได เดินกลับห้องเช่าเดิม ระหว่างทาง ไกลจากตะเกียงดวงสุดท้ายแล้ว เสียงหึ่งยังดังอยู่ ดังอยู่ในหูขวา ตามมาถึงห้อง
        effects: { traits: [curse_hum], flags: [filled_lamps_for_one_season] }
    - id: turn_down_dors
      label: ขอบคุณ แล้วไม่รับงาน
      text: |
        ดอร์สไม่ว่าอะไร ฮัมเพลงเดินไปถามคนต่อไป ไม่ถึงค่ำเขาได้คนเพิ่มสองคน เป็นพี่น้องกันจากต่างถิ่น ย้ายขึ้นห้องบนโกดังคืนนั้นเลย

        หลายเดือนต่อมา{name}เดินผ่านเสาตะเกียงตอนพลบ เห็นพี่น้องคู่นั้นเติมตะเกียงอยู่คนละฝั่งถนน ฮัมเพลงเดียวกันกับดอร์ส ฮัมพร้อมกัน ไม่ได้มองหน้ากันเลย
      effects: { flags: [turned_down_the_lamp_crew] }

# ---------- 3 ลึกลง: หูฟังเครื่อง ----------
- id: adult.sky_hum_machine_ear
  stage: adult
  weight: 80
  when:
    age: [16, 130]
    year: [352, 379]
    trait: curse_hum
  text: |
    เครื่องจักรของโรงสีประจำถิ่นพังมาสองหนในเดือนเดียว ช่างซ่อมคิดค่าแพงขึ้นทุกหน วันนี้{name}เดินผ่านโรงสีแล้วหยุด ใต้เสียงหึ่งในหูมีอีกเสียงหนึ่ง เสียงเฟืองตัวหนึ่งที่ฟันสึก ร้องผิดจังหวะ ร้องเหมือนคนจะร้องไห้ {name}ชี้บอกคนคุมเครื่องว่าเฟืองไหน เย็นนั้นเฟืองตัวนั้นแตก

    เจ้าของโรงสีมาหาถึงบ้าน เสนอค่าจ้างให้มาฟังเครื่องทุกเช้าก่อนเปิดโรง แต่เสียงหึ่งในหูดังขึ้นทุกครั้งที่เข้าใกล้เครื่อง และช่วงนี้ฟังคนพูดยากขึ้น ต้องให้พูดซ้ำ
  choices:
    - id: listen_every_morning
      label: รับงานฟังเครื่องทุกเช้า
      text: |
        {name}ยืนข้างเครื่องทุกเช้าตอนเริ่มหมุน ฟังแค่ครู่เดียวก็บอกได้ว่าวันนี้ตัวไหนจะร้อน ตัวไหนต้องหยอดน้ำมัน ทั้งเดือนเครื่องไม่พังสักหน เจ้าของโรงสีจ่ายตรงเวลา ช่างซ่อมเลิกมาเดินแถวนั้น

        ปลายเดือนคนคุมเครื่องเรียก{name}สามหน {name}ถึงหันมา ใต้เสียงหึ่งมีเสียงเฟืองทุกตัวในโรงสีปนอยู่ด้วย ตามกลับบ้านไปทุกค่ำ
      effects: { gold: 2, trait_step: { curse_hum: 1 }, flags: [listened_to_the_mill_engine] }
    - id: listen_for_the_words
      label: ฟังให้ลึกกว่าเฟือง ฟังว่าเสียงหึ่งบอกอะไรเรื่องเครื่องบ้าง
      habit: curious
      text: |
        {name}เอาหูแนบโครงเครื่อง หลับตาฟัง ใต้เสียงเฟืองมีเสียงหึ่ง ใต้เสียงหึ่งมีคำ คำบอกว่าเพลาตัวกลางจะคดภายในสามวัน {name}บอกเจ้าของโรงสี เขาเปลี่ยนเพลาทันที เพลาเก่าคดอยู่แล้วจริงๆ คดนิดเดียว ตาเปล่าไม่เห็น

        เจ้าของโรงสีให้เงินเพิ่ม แต่ไม่ถามว่า{name}รู้ได้อย่างไร คืนนั้นคำในเสียงหึ่งไม่ได้พูดเรื่องเพลาแล้ว พูดเรื่องอื่น {name}ตั้งใจฟังจนเกือบสาง
      effects: { gold: 1, trait_step: { curse_hum: 1 }, flags: [heard_the_words_beneath_the_gears] }
    - id: keep_away_from_machines
      label: ไม่รับงาน แล้วเดินเลี่ยงโรงสีไปทางอื่น
      text: |
        {name}เดินอ้อมไปอีกซอยทุกวัน ทางไกลขึ้นเท่าตัว เจ้าของโรงสีจ้างช่างซ่อมต่อไป เครื่องพังอีกหนในเดือนต่อมา ค่าสีข้าวของทั้งถิ่นขึ้นราคาตาม {name}ก็ต้องจ่ายเท่าคนอื่น

        เสียงหึ่งในหูไม่ได้เบาลง แต่ก็ไม่ได้ดังขึ้น ฟังคนพูดยังต้องให้พูดซ้ำเหมือนเดิม
      effects: { gold: -1, flags: [kept_away_from_the_mill_engine] }

# ---------- 4 ทางออก ----------
- id: adult.sky_hum_way_out
  stage: adult
  weight: 150
  once: false
  when:
    age: [16, 130]
    year: [352, 410]
    trait: curse_hum
    not_flags: [kept_humming_over_the_hum]
  text: |
    คนกะดึกของโรงกลั่นรู้ทางออกกันทุกคน แต่ไม่ค่อยมีใครทำ ทางแรก ให้ช่างคนแคระหล่อจุกหูตะกั่วให้คู่หนึ่ง หล่อตามรูหูของคนใส่ ใส่นอนทุกคืนไม่ขาด ตะกั่วหนักจนนอนตะแคงไม่ได้ ทางที่สอง ย้ายไปอยู่ให้ไกลจากโรงกลั่นเกินสามวันเดิน แล้วอยู่ตรงนั้นสามปีเต็ม ไม่กลับมาสักครั้ง ทางที่ไม่ใช่ทางออก คือฮัมเพลงทับไปจนตาย คนกะดึกส่วนมากเลือกทางนี้

    ทอร์กา ตระกูลทั่งหนาว ช่างคนแคระที่รับหล่อจุกหูตะกั่ว ตั้งเตาเล็กๆ ไว้ใกล้ตลาด รับงานทีละคู่ คิวยาวถึงเดือนหน้า
  choices:
    - id: lead_plugs
      label: จ้างทอร์กาหล่อจุกหูตะกั่ว แล้วใส่นอนทุกคืน
      requires: { not_flags: [could_not_bear_the_lead_plugs] }
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ทอร์กาปั้นขี้ผึ้งกดลงรูหูของ{name}ทั้งสองข้างเอาแบบ แล้วหล่อตะกั่วตามแบบนั้น จุกเย็นและหนัก คืนแรก{name}ใส่แล้วหูปวดจนน้ำตาไหล คืนที่สองปวดน้อยลง คืนที่สิบไม่ปวดแล้ว ใต้ตะกั่วเงียบสนิทเป็นครั้งแรกในรอบหลายปี เงียบจนได้ยินเลือดตัวเองเต้น

          ครบหน้าฝน{name}ลองไม่ใส่คืนหนึ่ง ฟัง ได้ยินหมาเห่าไกลๆ ได้ยินลมผ่านหลังคา ใต้เสียงทั้งหมดนั้นไม่มีอะไรอีกแล้ว {name}เก็บจุกไว้ในกล่องข้างหมอน ไม่ทิ้ง
        effects: { lose_traits: [curse_hum], marks: { star: -1 }, gold: -3, flags: [slept_in_lead_ear_plugs] }
      failure:
        text: |
          จุกตะกั่วหนักจนหูอักเสบตั้งแต่สัปดาห์แรก {name}ถอดออกกลางดึกทุกคืน เสียงหึ่งรออยู่ทุกครั้งที่ถอด เดือนที่สองหูข้างขวาเริ่มมีน้ำเหลืองไหล ทอร์กาบอกว่ารูหูบางคนไม่รับตะกั่ว หล่อใหม่ก็ไม่ช่วย

          ค่าหล่อจ่ายไปแล้ว คืนนั้น{name}เก็บจุกคู่นั้นใส่กล่อง แล้วนอนฟังเสียงหึ่งจนหลับไปเอง
        effects: { gold: -3, hp: -1, flags: [could_not_bear_the_lead_plugs] }
    - id: three_years_away
      label: ย้ายไปอยู่ไกลจากโรงกลั่นเกินสามวันเดิน แล้วอยู่ให้ครบสามปี
      text: |
        {name}ทิ้งงานเดิม ทิ้งห้องเดิม ไปเช่าห้องอยู่ในถิ่นที่ไม่มีโรงกลั่น ไม่มีตะเกียงสีฟ้าสักดวง ปีแรกเสียงหึ่งตามมาด้วย ดังเท่าเดิม ปีที่สองเบาลงจนต้องตั้งใจฟังถึงจะได้ยิน คนในถิ่นใหม่ถามว่า{name}ฮัมเพลงอะไรทั้งวัน

        ปลายปีที่สาม{name}ตื่นมาเช้าวันหนึ่งแล้วไม่ได้ยินอะไรใต้เสียงไก่ ไม่ได้ยินอะไรใต้เสียงฝน ขากลับถิ่นเก่า พอเห็นตะเกียงสีฟ้าดวงแรกบนเสา{name}หยุดยืนฟังอยู่ครู่หนึ่ง เสียงหึ่งอยู่ข้างนอก ไกลออกไป ไม่ได้เข้ามา
      effects: { lose_traits: [curse_hum], marks: { star: -1 }, gold: -2, flags: [spent_three_years_far_from_the_refineries] }
    - id: hum_over_it_to_the_end
      label: ฮัมเพลงทับไปเหมือนคนกะดึก
      text: |
        {name}ไม่ได้ต่อคิวทอร์กา คืนนั้นฮัมเพลงที่คนกะดึกฮัมกันทั้งโรง ฮัมจนหลับ ตื่นมาก็ฮัมต่อ คนข้างบ้านชินจนฮัมตาม
      effects: { flags: [kept_humming_over_the_hum] }

# ================= ผิวแก้ว =================

# ---------- 1 ในบ้าน: บ้านปิดม่าน ----------
- id: adult.sky_glass_curtained_house
  stage: adult
  weight: 24
  scene: home
  when:
    age: [16, 130]
    year: [354, 372]
  text: |
    บ้านเบเรนสุดซอยปิดม่านทุกบานมาตั้งแต่ต้นปี ยายอิลซาอยู่หลังม่านในห้องกลาง ไม่ออกมาอีก คนในซอยเคยเห็นแค่มือของนางตอนยังออกมานั่งหน้าบ้าน มือข้างที่เคยจับโหลน้ำค้างตอนสาวๆ ใสจนเห็นแสงฟ้าเต้นอยู่ข้างใน ตอนนี้ญาติผลัดกันเอาข้าวใส่ชามปิดฝาไปวางที่ชายม่านทุกเย็น แล้วนั่งฟัง ยายเล่าเรื่องที่ยังไม่เกิด ราคาเกลือเดือนหน้า ใครจะแต่งกับใคร หลังคาบ้านไหนจะรั่วก่อน เล่าถูกบ้าง ผิดบ้าง คนจดไว้ไม่ทันว่าถูกกี่เรื่อง

    ผู้ตรวจผิวแก้วมาที่บ้านนี้ปีละสองหน มาทีไรก็บ่นว่างานมากกว่าหมอทั้งถิ่นรวมกัน เย็นนี้ลูกสาวยายอิลซาต้องไปตลาด นางมาเคาะประตูขอให้{name}ไปนั่งข้างม่านแทนจนกว่านางจะกลับ ห้ามเปิดม่าน ห้ามจับอะไรที่ยื่นออกมา
  choices:
    - id: sit_and_listen
      label: นั่งข้างม่าน ฟังที่ยายเล่า
      text: |
        หลังม่านมีแสงฟ้าจางๆ ขยับช้าๆ เสียงยายเบา แหบ เล่าเรื่องคนในซอยทีละบ้าน แล้วเล่าถึง{name} ว่าสัปดาห์หน้า{name}จะทำกระดุมเสื้อหลุดหายตรงขั้นบันไดหน้าบ้าน เม็ดที่สองจากคอ หาไม่เจอ

        สัปดาห์ต่อมากระดุมเม็ดที่สองหลุดตรงขั้นบันไดจริง กลิ้งหายลงร่องไม้ {name}ไม่ได้ก้มหา ยืนดูร่องไม้อยู่ครู่หนึ่ง แล้วเดินต่อ
      effects: { stats: { WIS: 1 }, flags: [listened_at_the_glass_curtain] }
    - id: fetch_the_inspector
      label: ไปตามผู้ตรวจผิวแก้วมาดูก่อนถึงรอบ
      text: |
        ผู้ตรวจผิวแก้วมาตอนค่ำ ถือตะเกียงฟ้าดวงเล็ก ส่องผ่านม่านจากข้างนอก ไม่เปิด ไม่เข้าไป จดลงสมุดสองบรรทัด แล้วบอกลูกสาวยายอิลซาที่กลับมาทันพอดีว่ายังไม่ถึงเวลา ให้เลี้ยงข้าวต่อไป ค่ามานอกรอบสองเหรียญ

        ลูกสาวยายอิลซาจ่ายแล้วมอง{name}ค้าง ผู้ตรวจเดินออกไปพร้อม{name} บอกว่าบ้านแบบนี้มีทุกถนนในย่านโรงกลั่น ตอนนี้ลามมาถึงซอยแบบนี้แล้ว เขาไม่มีเวลามาดูทุกบ้านนอกรอบ
      effects: { alignment: { law: 1 }, flags: [fetched_the_glass_inspector] }
    - id: lift_the_curtain
      label: ยกชายม่านขึ้นดูนิดเดียว
      habit: curious
      text: |
        ข้างหลังม่านมีคนนั่งบนเก้าอี้ไม้ ผ้าห่มคลุมตัก มือสองข้างวางบนผ้าห่ม ใสทั้งมือ ใสขึ้นไปถึงแขน ถึงคอ ถึงครึ่งหน้า ข้างในมีแสงฟ้าเต้นช้าๆ ตรงที่ควรจะเป็นเส้นเลือด ตายังเป็นตาคน หันมาทาง{name} ยายยิ้มให้ แล้วบอกว่าเห็นแล้วก็ปิดได้ ลมเข้า

        {name}ปล่อยชายม่านลง ลูกสาวยายอิลซากลับมาเห็นม่านยังไหวอยู่ นางไม่ด่า นางขอบคุณที่มานั่งให้ แล้วไม่เคยมาขอให้นั่งอีกเลย
      effects: { alignment: { law: -1 }, flags: [lifted_the_glass_curtain] }
    - id: sit_unseen_by_her
      label: นั่งข้างม่านจนลูกสาวนางกลับมา
      requires: { trait: curse_brand }
      text: |
        ยายเล่าเรื่องบ้านโน้นบ้านนี้ไม่หยุด เล่าว่าใครจะป่วย ใครจะได้ลูก เล่าเรื่องคนในซอยครบทุกบ้าน ไล่มาจนถึงบ้านของ{name} แล้วหยุด ข้ามไปเล่าบ้านถัดไป

        {name}ถามว่าบ้านนั้นล่ะ ยายเงียบไปนาน แล้วบอกว่าบ้านนั้นไม่มีเรื่อง มองไม่เห็นเรื่อง เหมือนมีคนยืนบังอยู่ แล้วเล่าเรื่องบ้านถัดไปต่อ ลูกสาวยายกลับมาตอนค่ำ ถามว่าแม่พูดถึง{name}ว่าอะไรบ้าง
      effects: { stats: { INT: 1 }, flags: [went_untold_by_the_glass_woman] }

# ---------- 2 ทางเข้า: ของที่ตกลงมากลางซอย (วัยทำงาน) ----------
- id: adult.sky_glass_fallen_thing
  stage: adult
  weight: 22
  time: night
  when:
    age: [16, 59]
    year: [350, 376]
    not_traits: [curse_brand, curse_glass]
  text: |
    ของตกลงมาจากฟ้ากลางดึก เสียงเหมือนหม้อดินแตก ตกลงในร่องน้ำหน้าบ้านติดกัน คนทั้งซอยออกมายืนล้อม ไม่มีใครเข้าใกล้ เป็นก้อนใสเท่ากำปั้น ข้างในมีแสงฟ้าเต้น น้ำในร่องรอบก้อนนั้นเป็นไอขึ้นมาบางๆ คนรู้กันว่าห้ามจับด้วยมือเปล่า ผู้ตรวจผิวแก้วเตือนไว้ทุกรอบที่มา

    คนรับซื้อของตกจากฟ้าที่พักอยู่โรงเตี๊ยมหัวถนนมาถึงก่อนผู้ตรวจ เขาให้ราคาดีกว่าค่าแรงหลายเดือน และให้อีกเท่าตัวถ้าก้อนนั้นไม่โดนผ้า ไม่โดนเหล็ก เขาว่าผ้ากับเหล็กทำให้แสงข้างในจาง เขาเองไม่ยอมจับ ถุงมือหนังยังอยู่ในกระเป๋าเขา ยื่นกล่องไม้บุกำมะหยี่มาให้ ใครจะหยิบใส่ก็ได้
  choices:
    - id: bare_hands
      label: หยิบก้อนนั้นใส่กล่องด้วยมือเปล่า รับเงินอีกเท่าตัว (ของแบบนี้ติดตัวไปนาน)
      text: |
        ก้อนนั้นอุ่นกว่าที่คิด ผิวลื่นเหมือนน้ำแข็งแต่ไม่เย็น แสงข้างในเต้นเร็วขึ้นตอนนิ้วของ{name}แตะ {name}วางลงกล่อง คนรับซื้อปิดฝาทันที นับเงินใส่มือที่ยังว่างอีกข้าง คนในซอยถอยห่างจาก{name}กันหนึ่งก้าว

        สามวันต่อมา ตรงกลางฝ่ามือข้างนั้นมีหย่อมใสหย่อมหนึ่ง เท่าเล็บนิ้วก้อย ไม่เจ็บ ส่องกับตะเกียงแล้วเห็นแสงฟ้าเต้นอยู่ข้างใน คืนนั้นไฟดับทั้งซอย{name}ยังเห็นรอยแตกบนฝาผนังห้องชัดทุกเส้น
      effects: { traits: [curse_glass], marks: { star: 1 }, world: { star: 1 }, gold: 3, flags: [took_the_fallen_thing_bare_handed] }
    - id: tongs_and_cloth
      label: พันมือด้วยผ้าหนา ใช้คีมคีบใส่กล่อง รับแค่ราคาแรก
      habit: cool_headed
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}พันผ้าสามชั้นถึงข้อศอก คีบด้วยคีมถ่านของบ้านติดกัน ก้อนนั้นลื่นแต่ไม่หลุด ลงกล่องเรียบร้อย คนรับซื้อจ่ายราคาแรกตามที่พูด บ่นว่าคีมทำให้แสงจางไปนิด

          ผู้ตรวจผิวแก้วมาถึงตอนสาง ขอดูมือ{name}ทั้งสองข้างใต้ตะเกียงฟ้า ดูนานแล้วบอกว่าไม่มีอะไร ให้เผาผ้าพันมือทิ้ง คีมของบ้านติดกันก็ห้ามใช้คีบถ่านอีก
        effects: { stats: { DEX: 1 }, gold: 1, flags: [tonged_the_fallen_thing] }
      failure:
        text: |
          ก้อนนั้นลื่นหลุดจากคีม กลิ้งลงตามแขน ผ้าพันมือรั้งขึ้นจนข้อมือโผล่ออกมานิดหนึ่ง ก้อนนั้นแตะผิวตรงนั้นแค่ครู่เดียว อุ่น ไม่เจ็บ แล้วตกลงกล่อง คนรับซื้อจ่ายราคาแรก ไม่ถามว่าโดนตัวหรือเปล่า

          สามวันต่อมา ตรงข้อมือข้างนั้นมีหย่อมใสหย่อมหนึ่ง เท่าเล็บนิ้วก้อย ส่องกับตะเกียงแล้วเห็นแสงเต้นอยู่ข้างใน
        effects: { traits: [curse_glass], flags: [tonged_the_fallen_thing] }
    - id: leave_it_for_the_inspector
      label: ไม่แตะ ไล่เด็กๆ ออกห่าง แล้วรอผู้ตรวจผิวแก้ว
      text: |
        {name}เอาเชือกมาขึงรอบร่องน้ำ ไล่เด็กที่ยื่นไม้เขี่ยออกไป คนรับซื้อรอจนเบื่อแล้วกลับโรงเตี๊ยม ผู้ตรวจผิวแก้วมาถึงตอนสาง ตักก้อนนั้นใส่ถังตะกั่วด้วยพลั่วด้ามยาว จดชื่อ{name}ไว้ในสมุดช่องคนที่เฝ้าให้

        สัปดาห์ต่อมามีข่าวว่าคนรับซื้อคนนั้นได้ก้อนใหม่จากซอยอื่น คนหยิบให้เป็นเด็กหนุ่มคนหนึ่ง หยิบด้วยมือเปล่า
      effects: { alignment: { law: 1 }, flags: [left_the_fallen_thing_for_the_inspector] }

# ---------- 3 ลึกลง: นั่งเฝ้าในที่มืด (วัยปลาย) ----------
- id: elder.sky_glass_dark_sitter
  stage: elder
  weight: 80
  time: night
  when:
    age: [60, 130]
    year: [354, 379]
    trait: curse_glass
  text: |
    หย่อมใสบนผิวของ{name}กว้างขึ้นทุกหน้าหนาว ซ่อนใต้ผ้าพันได้แต่ไม่มิด ในที่มืด{name}มองเห็นเหมือนยังมีแสงสนธยา คนในซอยรู้เรื่องนี้กันหมด งานเลยมาหาเอง

    บ้านปิดม่านบ้านหนึ่งต้องการคนนั่งเฝ้าคนแก้วของบ้านตอนกลางคืน ในห้องมืด เพราะคนแก้วไม่ชอบแสงตะเกียง ญาติจะได้นอนกันบ้าง ผู้ตรวจผิวแก้วก็ส่งคนมาถามว่าจะไปช่วยเขาดูมือคนในห้องมืดไหม ผิวที่เพิ่งเริ่มใส ตาคนธรรมดามองไม่เห็นในที่สว่าง แต่ตาของ{name}เห็นในที่มืด
  choices:
    - id: sit_with_the_glass_one
      label: รับนั่งเฝ้าคนแก้วในห้องมืดทุกคืน
      text: |
        คนแก้วของบ้านนั้นเป็นชายแก่ เคยเป็นคนกลั่น ตอนกลางคืนเขาพูดไม่หยุด เล่าเรื่องที่ยังไม่เกิด {name}นั่งฟังในความมืด มองเห็นแสงฟ้าเต้นอยู่ในตัวเขา เต้นจังหวะเดียวกับแสงในหย่อมใสบนแขนตัวเอง

        คืนหนึ่งเขาเล่าถึงมือของ{name} ว่าอีกไม่นานจะใสถึงข้อศอก เล่าละเอียดจนรู้ว่าแสงจะเต้นตรงไหน ญาติเขาจ่ายค่าเฝ้าทุกสิ้นเดือน ปลายเดือนหย่อมใสบนแขนของ{name}ยาวขึ้นไปถึงข้อศอก ตรงตามที่เขาเล่า
      effects: { gold: 2, trait_step: { curse_glass: 1 }, flags: [sat_nights_with_a_glass_one] }
    - id: inspect_in_the_dark
      label: ไปช่วยผู้ตรวจผิวแก้วดูมือคนในห้องมืด
      text: |
        ห้องตรวจของผู้ตรวจผิวแก้วปิดหน้าต่างทึบ คนงานโรงกลั่นยื่นมือมาทีละคน {name}มองเห็นจุดใสเล็กกว่าเม็ดทรายใต้ผิวของคนเกือบครึ่ง ผู้ตรวจจดตามที่{name}บอก คนที่โดนจดเดินออกไปเงียบๆ บางคนร้องไห้ที่ประตู

        ผู้ตรวจจ่ายค่าแรงแล้วขอให้มาอีกสัปดาห์หน้า ตอนส่ง{name}ที่ประตูเขาจับมือ{name}ขึ้นส่องกับตะเกียงฟ้า ส่องอยู่นาน แล้วจดชื่อ{name}ลงสมุดอีกบรรทัดหนึ่ง
      effects: { gold: 1, trait_step: { curse_glass: 1 }, flags: [inspected_hands_in_the_dark] }
    - id: stay_in_the_light
      label: ไม่รับงานไหน จุดตะเกียงนอนทุกคืน พันผ้าให้มิด
      text: |
        {name}จุดตะเกียงทิ้งไว้ทั้งคืน น้ำมันหมดเร็วจนต้องซื้อเพิ่มทุกสัปดาห์ พันผ้ารอบแขนสองชั้น ในแสงตะเกียงหย่อมใสดูเป็นแค่ผิวซีด

        หย่อมใสไม่กว้างขึ้นทั้งหน้าหนาวนั้น แต่ก็ไม่หด บ้านปิดม่านบ้านนั้นได้คนเฝ้าคนอื่น เป็นหญิงแก่ที่ผิวใสถึงคอ
      effects: { gold: -1, flags: [stayed_in_the_lamplight] }

# ---------- 4 ทางออก ----------
- id: adult.sky_glass_way_out
  stage: adult
  weight: 150
  once: false
  when:
    age: [16, 130]
    year: [354, 410]
    trait: curse_glass
    not_flags: [kept_the_glass_skin]
  text: |
    ผู้ตรวจผิวแก้วบอก{name}ตอนส่องมือรอบล่าสุด ว่าทางออกมีสองทาง ทางแรก เดินทางไปหอนับดาวในป่าไอเลธ ให้หมอแก้วของหอขูดออก หมอขูดได้ถ้ายังไม่ลึกเกินไป ลึกแค่ไหนต้องให้หมอดูเอง ทางที่สอง เอาของที่ตกจากฟ้าชิ้นที่ทำให้เป็น ฝังคืนลงดินลึกเท่าตัวคนในคืนเดือนดับ สมุดของผู้ตรวจจดไว้ว่าของแต่ละชิ้นไปอยู่กับใคร ชิ้นของ{name}อยู่ในตู้ของคนรับซื้อคนหนึ่ง เขาขายคืนให้ได้ ถ้าราคาถึง

    ผู้ตรวจบอกด้วยว่าคนส่วนมากเลือกทางที่สาม พันผ้าทั้งตัวแล้วไปทำงานในที่มืด เหมืองรับคนผิวแก้วเสมอ
  choices:
    - id: scraped_at_the_tower
      label: เดินทางไปให้หมอแก้วที่หอนับดาวขูดออก
      requires: { not_flags: [too_deep_to_scrape] }
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ค่าเดินทางกับค่าหมอกินเงินเก็บไปเกือบหมด หมอแก้วเป็นเอลฟ์หญิงมือนิ่ง นางส่องผิวของ{name}กับแสงหลายสี แล้วบอกว่ายังทัน ขูดด้วยมีดแก้วบางทีละชั้น ทุกชั้นที่หลุดออกเป็นเกล็ดใส มีแสงเต้นอยู่ครู่หนึ่งแล้วดับ {name}กัดผ้าไว้ทั้งบ่าย ผ้าขาดเป็นรู

          ผิวที่ขูดแล้วแดง เจ็บ เหมือนผิวเด็ก ไม่ใสอีก คืนนั้นในห้องพักของหอ ตะเกียงดับแล้ว{name}มองไม่เห็นมือตัวเอง เป็นครั้งแรกในรอบหลายปีที่ความมืดมืดจริง
        effects: { lose_traits: [curse_glass], marks: { star: -1 }, gold: -3, flags: [had_the_glass_scraped_away] }
      failure:
        text: |
          หมอแก้วส่องผิวของ{name}กับแสงหลายสีอยู่นาน แล้ววางมีดลง นางบอกว่าลึกเกินไปแล้ว ขูดตอนนี้จะเอาเนื้อจริงออกไปด้วย ไม่รอด นางคิดค่าดูครึ่งเดียว แนะนำให้ไปลองทางที่สองแทน

          ค่าเดินทางจ่ายไปแล้ว ขากลับ{name}เดินในป่าตอนพลบ ยังมองเห็นทางชัดเหมือนกลางวัน
        effects: { gold: -3, flags: [too_deep_to_scrape] }
    - id: bury_it_at_dark_moon
      label: ซื้อของชิ้นนั้นคืนจากคนรับซื้อ แล้วฝังลึกเท่าตัวคนในคืนเดือนดับ
      text: |
        คนรับซื้อขายคืนให้ในราคาสามเท่าที่เคยจ่าย เขาห่อกล่องไม้ด้วยผ้าหนาส่งให้ บอกว่าไม่ต้องเปิดดู {name}จ้างคนขุดหลุมที่ท้ายลาน ลึกเท่าตัวคน ให้เสร็จก่อนค่ำแล้วไล่กลับ รอจนคืนเดือนดับ ในความมืดมองเห็นดินทุกก้อนชัด

        พอวางกล่องลงก้นหลุม แสงฟ้าในหย่อมใสบนแขนเต้นแรงขึ้นครั้งหนึ่ง แล้วค่อยๆ หรี่ {name}กลบดินทีละพลั่วจนเต็ม เช้ามาหย่อมใสขุ่นลงเป็นสีน้ำนม อีกเดือนก็ลอกออกเป็นแผ่นบางเหมือนเปลือกหอม ผิวข้างใต้เป็นผิวคน
      effects: { lose_traits: [curse_glass], marks: { star: -1 }, gold: -2, flags: [buried_the_fallen_thing_at_dark_moon] }
    - id: wrap_and_work_dark
      label: พันผ้าให้มิด แล้วหางานทำในที่มืด
      text: |
        {name}ซื้อผ้าพันแผลมาเป็นม้วน พันแขนทั้งสองข้างจนถึงไหล่ ผู้ตรวจผิวแก้วจดชื่อ{name}ไว้ในสมุดเหมือนเดิม แล้วบอกชื่อหัวหน้ากะใต้ดินคนหนึ่งให้ไว้ เผื่อวันหนึ่งต้องใช้
      effects: { flags: [kept_the_glass_skin] }
