# วัยเด็ก ลูกคนงานโรงกลั่น ย่านโรงกลั่นริมแม่น้ำ เวนทราส (origin_refinery)
# แม่เฝ้าหม้อกลั่น พ่อแบกถังที่ท่าเรือ (เด็กรุ่นนี้เกิดก่อนเรือเหาะลำแรกปี 289 ได้ อย่าเขียนถึงเรือเหาะในเรื่องที่ไม่กันปี)

- id: childhood.refinery_hum
  stage: childhood
  weight: 9
  when:
    age: [3, 6]
    flags: [origin_refinery]
  text: |
    ย่านโรงกลั่นริมแม่น้ำมีเด็กมากกว่าแมว กลางวันพ่อแม่เข้าโรง เด็กเล็กอยู่กับยายรับเลี้ยงที่ดูทีละสิบคน นั่งเล่นกันในลานหลังห้องเช่า ใต้ราวตากผ้าที่ไม่เคยแห้งสักผืน เพราะไอจากปล่องลอยลงมาเกาะทั้งวัน

    บ่ายวันหนึ่ง เด็กในลานเงียบลงพร้อมกัน ยายเงยหน้าจากกระจาดผ้าที่ปะอยู่ เด็กเจ็ดแปดคนนั่งอยู่คนละมุม ไม่ได้มองกัน แต่ฮัมเพลงเดียวกัน ทำนองเดียวกัน เสียงต่ำลากยาว ไม่มีคำ ยายอยู่ย่านนี้มาหกสิบปี ไม่เคยได้ยินเพลงนี้

    {name}ไม่รู้ว่าได้ยินทำนองนี้มาตั้งแต่เมื่อไหร่ รู้แต่ว่าดังอยู่ในหัวเหมือนเพลงที่ฟังมาทั้งชีวิต
  choices:
    - id: hum_along
      label: ฮัมตามไปด้วย
      text: |
        {name}ฮัมตาม เสียงเข้ากับเด็กคนอื่นพอดี เหมือนซ้อมกันมา ยายรับเลี้ยงวางเข็มลง ลุกขึ้นตบมือดังๆ สองที เด็กทั้งลานสะดุ้ง แล้วหันกลับไปเล่นกันต่อ

        ไม่มีใครจำได้ว่าเมื่อครู่ทำอะไรอยู่ {name}จำได้
      effects: { stats: { CHA: 1 }, flags: [hummed_the_tune], world: { star: 1 } }
    - id: hum_deeper
      label: ฮัมต่ำลงไปอีก ถึงเสียงที่ได้ยินมาตั้งแต่เกิด
      requires: { flag: heard_the_hum }
      text: |
        {name}ฮัมต่ำลงไปเรื่อยๆ ต่ำกว่าเด็กทุกคน ต่ำจนเสียงสั่นอยู่ในอก แล้วเด็กคนอื่นก็หยุดฮัมทีละคน หันมามอง{name}เหมือนรอให้บอกว่าต้องทำอะไรต่อ

        ยายรับเลี้ยงเดินมาจับไหล่{name}เขย่า มือแกเย็นเฉียบ
      effects: { stats: { INT: 1 }, flags: [hummed_the_tune, hum_deep], world: { star: 1 } }
    - id: sing_other
      label: ร้องเพลงอื่นแข่งให้ดังที่สุด
      text: |
        {name}เอามือปิดหู แต่ทำนองนั้นไม่ได้ดังมาจากข้างนอก ปิดแล้วก็ยังได้ยินเท่าเดิม เลยร้องเพลงไล่นกที่แม่ชอบร้องตอนตากผ้า ร้องแข่งกับทำนองนั้นจนคอแห้ง

        เด็กข้างๆ หยุดฮัมทีละคน บางคนร้องเพลงไล่นกตาม ยายรับเลี้ยงหัวเราะจนเข็มหลุดมือ
      effects: { stats: { WIS: 1 } }
    - id: tell_granny
      label: วิ่งไปกระตุกแขนยายรับเลี้ยง
      text: |
        ยายรับเลี้ยงฟังแล้วลูบหัว บอกว่าไม่ต้องกลัว เด็กย่านนี้ก็ฮัมกันอย่างนี้แหละ ผู้ใหญ่ก็เคยฮัม

        แล้วแกก็ลุกไปปิดหน้าต่างห้องเช่าทุกบานที่หันไปทางโรงกลั่น ลงกลอนทุกบาน
      effects: { stats: { INT: 1 } }

- id: childhood.ventras_shared_dream
  stage: childhood
  weight: 8
  when:
    age: [4, 10]
    location_tag: ventras
    not_flags: [race_tiefling]
  text: |
    เช้าวันนั้นทั้งตรอกตื่นสาย แล้วออกมายืนคุยกันหน้าห้องเช่าโดยไม่มีใครนัด

    คนงานกะดึกสามโรงที่ออกกะมานอนตอนเช้ามืดฝันเรื่องเดียวกัน ทุกคนเล่าตรงกันว่ายืนอยู่บนหลังคาโรงกลั่น ฟ้าข้างบนไม่ใช่ฟ้า เป็นผ้าดำขึงตึง มีจุดแสงพรุนไปทั้งผืน แล้วมีอะไรกดลงมาจากอีกฝั่ง ผ้าตรงนั้นยุบลงเป็นแอ่ง ลงมาใกล้หลังคาทุกที แล้วทุกคนก็สะดุ้งตื่นพร้อมกัน ตอนสาย

    ผู้หญิงห้องข้างๆ เล่าไปก็บิดผ้ากันเปื้อนไป คนอื่นต่อประโยคให้เธอได้ทุกประโยค ไม่มีใครแย้ง

    {name}ยืนฟังอยู่ข้างหลัง{mother} ไม่ได้บอกใครว่าเมื่อคืนตัวเองก็ฝัน และฝันไปไกลกว่านั้น ในฝันของ{name} ผ้าผืนนั้นยุบลงมาจนแตะปากปล่องโรงกลั่น
  choices:
    - id: tell
      label: เล่าว่าฝันต่อไปจนผ้าแตะปล่อง
      text: |
        ทั้งตรอกเงียบ ผู้หญิงห้องข้างๆ ประกบมือเป็นรูปชามไฟของอีเซลไว้ที่อก ชายแก่ห้องท้ายตรอกเดินกลับเข้าห้องแล้วปิดประตูดังปัง

        {mother}ลากลูกเข้าห้อง ปิดประตู แล้วบอกว่าถ้าฝันอะไรอีก ให้เล่าให้แม่ฟังคนเดียว
      effects: { stats: { CHA: 1 }, flags: [shared_dream, dreamed_further] }
    - id: draw
      label: แอบเอาถ่านวาดสิ่งที่เห็นไว้บนผนังห้อง
      text: |
        {name}เอาถ่านจากเตามาวาดบนผนังข้างที่นอน วาดเสร็จแล้วก็ไม่รู้ว่าวาดอะไร เป็นวงกลมซ้อนกันเจ็ดวง วงในสุดถมดำจนถ่านหมดแท่ง

        {mother}เห็นแล้วไปเอาผ้าเปียกมาเช็ด เช็ดจนผนังด่างไปทั้งแถบ แล้วยังเช็ดต่ออีกพักหนึ่ง หลังจากไม่เหลือรอยอะไรแล้ว
      effects: { stats: { INT: 1 }, flags: [shared_dream] }
    - id: forget
      label: บอกตัวเองว่าฝันก็คือฝัน
      text: |
        {name}ไปช่วยแม่หิ้วน้ำ ทั้งวันพยายามนึกถึงเรื่องอื่น นับขั้นบันได นับเรือที่แล่นออกปากแม่น้ำ นับเสียงหวูด

        คืนนั้นหลับไปโดยไม่ฝันอะไร คืนต่อมาก็ไม่ฝัน
      effects: { stats: { WIS: 1 }, flags: [shared_dream] }

- id: childhood.refinery_glass_mother
  stage: childhood
  weight: 8
  when:
    age: [5, 11]
    flags: [origin_refinery]
  text: |
    แผ่นใสบนหลังมือของ{mother}ลามขึ้นไปถึงข้อมือตั้งแต่หน้าหนาวก่อน ปีนี้ขึ้นไปถึงข้อศอก เธอใส่เสื้อแขนยาวทุกฤดู ผูกข้อมือไว้ด้วยเชือก ไปโรงทุกคืนเหมือนเดิม สมาคมไม่ไล่ใครออกเพราะผิวแก้ว ตราบใดที่ยังนับหยดได้

    คืนวันว่าง โรงกลั่นหยุดทั้งย่าน ไฟในห้องเช่าดับเพราะน้ำมันหมด {name}ตื่นขึ้นมากลางดึก เห็นแสงสีฟ้าอ่อนๆ ลอดออกมาจากใต้แขนเสื้อของ{mother}ที่นอนหลับอยู่ข้างๆ แสงนั้นเต้นช้ากว่าลมหายใจ

    เดือนก่อน หมอที่ร้านยาปากตรอกจับชีพจรให้{mother} หมอสวมถุงมือสองชั้น
  choices:
    - id: pretend
      label: ทำเป็นไม่เห็น หลับตาลง
      text: |
        {name}หลับตาลง แต่แสงยังลอดเปลือกตาเข้ามา ฟ้าอ่อนๆ อยู่อย่างนั้นจนเช้า

        ตอนกินข้าว {mother}ถามว่าเมื่อคืนนอนหลับดีไหม {name}บอกว่าดี เธอยิ้ม แล้วดึงแขนเสื้อลงอีกนิด
      effects: { stats: { WIS: 1 }, flags: [mother_glass] }
    - id: touch
      label: เลิกแขนเสื้อขึ้น ขอจับดู
      text: |
        {mother}ตื่นเพราะรู้สึกว่ามีคนแตะ เธอไม่ดึงแขนหนี ปล่อยให้{name}ลูบแผ่นใสนั้น เย็นเหมือนกระจกหน้าต่างหน้าหนาว ข้างใต้แสงฟ้าเต้นสะดุดนิดหนึ่งตรงที่นิ้วแตะ

        "จั๊กจี้" เธอว่า แล้วหัวเราะเบาๆ ในความมืด หัวเราะนานกว่าที่ควร
      effects: { stats: { CHA: 1 }, flags: [mother_glass] }
    - id: ask
      label: กระซิบถามแม่ว่าเจ็บไหม
      text: |
        {mother}ไม่ได้หลับ เธอบอกว่าไม่เจ็บ ไม่เคยเจ็บเลยสักครั้ง แล้วพลิกตัวหันหลังให้ จน{name}นึกว่าแม่หลับไปแล้ว

        "แต่บางคืน" เธอพูดขึ้นมาอีก "แม่ได้ยินอะไรชัดขึ้น"

        เธอไม่บอกว่าได้ยินอะไร {name}ก็ไม่กล้าถามต่อ
      effects: { stats: { INT: 1 }, flags: [mother_glass] }

- id: childhood.refinery_first_shift
  stage: childhood
  weight: 10
  when:
    age: [8, 11]
    flags: [origin_refinery]
  text: |
    ปีนั้น {mother}พา{name}ไปลงชื่อที่โรงกลั่น สมาคมรับเด็กตั้งแต่แปดขวบ จ่ายครึ่งค่าแรงผู้ใหญ่ งานของเด็กคืองานที่ผู้ใหญ่ตัวใหญ่เกินจะทำ มุดเข้าไปขัดคราบในท่อกลั่น ปีนขึ้นไปเช็ดจานรับดาวบนหลังคาตอนรุ่งสาง ล้างขวดเปล่าที่ยังมีน้ำค้างดาวติดก้น

    ผู้จัดการโรงจับมือ{name}พลิกดูทั้งหน้ามือหลังมือ เหมือนพ่อค้าดูฟันม้า แล้วเขียนชื่อลงสมุด

    วันแรก{name}ได้งานล้างขวด อ่างล้างอยู่ติดประตูหลัง มีเด็กผู้หญิงตัวผอมคนหนึ่ง อายุราวสิบสาม ล้างอยู่ก่อนแล้ว เธอชื่อโดเรส ปลายนิ้วทั้งสิบขาวเปื่อยเหมือนแช่น้ำมาทั้งชีวิต

    "ก้นขวดยังเหลือหยดสองหยดทุกใบ" โดเรสกระซิบโดยไม่หันมา "รวมให้ได้ครึ่งขวด ที่ท่าเรือมีคนรับซื้อ ไม่ถามว่ามาจากไหน"
  choices:
    - id: work_hard
      label: ก้มหน้าล้างให้ครบจำนวนที่สั่ง
      text: |
        {name}ล้างขวดทั้งวันจนครบจำนวน มือเปื่อยตั้งแต่บ่าย ตกเย็นได้ค่าแรงครึ่งวันของผู้ใหญ่ วางลงบนมือ{mother} เธอนับสองรอบ แล้วคืนให้หนึ่งเหรียญ บอกว่าเก็บไว้เอง

        โดเรสไม่ได้มองตามตอนเดินออกประตู วันรุ่งขึ้นเธอย้ายไปล้างอยู่อีกอ่างหนึ่ง
      effects: { stats: { CON: 1 }, gold: 1 }
    - id: collect_drops
      label: แอบรวมหยดก้นขวดตามที่โดเรสบอก
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}เทหยดก้นขวดลงขวดยาเล็กๆ ที่โดเรสยื่นให้ ทีละหยด ทีละขวด ทุกครั้งที่หัวหน้ากะเดินผ่านก็ก้มหน้าขัดต่อ ครบเจ็ดวันได้ครึ่งขวด

          โดเรสพาไปที่ใต้สะพานท่าเรือตอนเลิกงาน ชายหน้าเรียบคนหนึ่งรับขวดไป ส่งเหรียญมาสามเหรียญ แล้วถามชื่อ{name} ถามครั้งเดียว ไม่จดลงที่ไหน
        effects: { stats: { DEX: 1 }, gold: 3, reputation: { dock_rats: 1 }, flags: [dock_rats_contact] }
      failure:
        text: |
          วันที่สี่ ขวดยาเล็กๆ หลุดมือตกแตกบนพื้นหิน หัวหน้ากะได้ยินเสียง เขาหักค่าแรงทั้งสัปดาห์ แล้วจับหู{name}ลากไปยืนหน้าประตูให้ทุกคนเห็น โดเรสก้มหน้าล้างขวดต่อ ไม่หันมามองสักครั้ง

          หลายเดือนต่อมา หลังมือขวาของ{name}มีจุดใสเล็กเท่าเม็ดงาขึ้นมาจุดหนึ่ง ตรงที่น้ำค้างดาวกระเซ็นโดนวันนั้น
        effects: { stats: { WIS: 1 }, flags: [glass_spot] }
    - id: ask_roof
      label: ขอขึ้นไปเช็ดจานบนหลังคาแทน
      text: |
        ผู้จัดการหัวเราะ บอกว่าเด็กตัวเบาหาง่าย ตกลงมาก็หาใหม่ได้ แล้วก็ส่งขึ้นไปจริงๆ

        รุ่งสางวันต่อมา {name}ยืนอยู่บนหลังคาโรงกลั่น ผ้าเช็ดในมือ เห็นเวนทราสทั้งเมือง เห็นเสากระโดงเรือเรียงกันแน่นที่ท่า เห็นแม่น้ำเป็นสีเทาไหลออกทะเล ตะเกียงฟ้าทั้งเมืองยังไม่ดับ จานรับดาวนับพันใบหงายอยู่บนหลังคา เหมือนเมืองทั้งเมืองแบมือขออะไรสักอย่างจากฟ้า
      effects: { stats: { DEX: 1 }, flags: [roof_worker, lean_ranger] }
