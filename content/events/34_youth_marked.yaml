# วัยรุ่น 12–13 เด็กมีเขาสามทาง (origin_marked_kept / hidden / foundling)
# ทางประจำถิ่น: เก็บไว้ = พราน (ตาพรานริมป่าที่ไม่มีใครรับลูกมือ), ซ่อนไว้ = นักเวท (สถาบันเวทหลวงรับถ้าซ่อนเขาได้),
# ทิ้งไว้ที่วิหาร = นักบวชอีเซล เหตุการณ์ของแต่ละทางไม่ให้ lean ของทางประจำถิ่นตัวเอง
# ระวังคำว่า "เขา" ที่แปลว่าเขาบนหัว อย่าใช้ "เขา" เป็นสรรพนามในประโยคเดียวกัน

# ---------- เก็บไว้ บ้านโรงสีบน ----------

- id: youth.kept_grandmother_last
  stage: youth
  weight: 10
  when:
    age: [12, 13]
    flags: [origin_marked_kept]
  text: |
    ย่าล้มป่วยตอนปลายหนาว ไอจนนอนราบไม่ได้ ต้องนั่งพิงหมอนสามใบทั้งคืน ป้าสองคนผลัดกันเฝ้า หมอจากตลาดมาครั้งเดียวแล้วไม่มาอีก

    คืนที่เจ็ด ป้าคนเล็กมาเคาะประตูบ้าน{name} บอกว่าย่าให้มาตาม ไม่ได้ให้มาตาม{mother} ให้มาตาม{name} คนเดียว

    ห้องของย่ามีกลิ่นน้ำมันตะเกียงกับขนแกะ ตะกร้าไหมพรมวางอยู่ข้างเตียงเหมือนทุกปี ไม้ถักสองอันยังเสียบค้างอยู่ในหมวกไหมพรมสีน้ำตาลใบหนึ่ง ลายเดียวกับใบที่{name}ได้ตอนเด็ก แต่ใบนี้ใหญ่กว่า ถักไปได้ครึ่งเดียว

    "{name}" ย่าเรียก เป็นครั้งแรกตั้งแต่{name}เกิด ย่าออกเสียงชื่อนั้นช้าๆ เหมือนคนลองเดินบนสะพานที่ไม่แน่ใจว่าไม้จะผุ "หัวเอ็งโตเร็วกว่าที่ข้าคิด"

    ย่าตายก่อนรุ่ง หมวกใบนั้นยังถักไม่เสร็จ
  choices:
    - id: vigil
      label: ขอป้าว่าจะเป็นคนล้างตัวและเฝ้าศพย่าเอง
      text: |
        ป้าคนโตจะค้าน ป้าคนเล็กดึงแขนพี่สาวไว้ {name}ต้มน้ำจากเตาในห้องนั้นเอง ล้างตัวย่าตามที่ยายตำแยในหมู่บ้านทำให้คนตาย ล้างมือก่อน ล้างเท้าทีหลัง แล้ววางไม้ถักสองอันไขว้กันไว้บนอก

        คืนนั้น{name}นั่งเฝ้าจนเทียนหมดสามเล่ม คนในหมู่บ้านทยอยมาดูศพ หลายคนหยุดอยู่ที่ประตู เห็นใครนั่งเฝ้าอยู่แล้วก็กลับ บางคนเดินเข้ามาวางขนมปังไว้ข้างศพ วางแล้วแตะไหล่{name}หนึ่งที ก่อนออกไป
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [lean_cleric, grandmother_vigil] }
    - id: dig_grave
      label: ขุดหลุมให้ย่าเองตอนกลางคืน เมื่อสัปเหร่อไม่ยอมให้แตะพลั่ว
      check: { stat: STR, dc: 12 }
      success:
        text: |
          สัปเหร่อบอกว่าหลุมไหนที่มือเด็กแบบนี้แตะดิน คนในหลุมนั้นจะนอนไม่สงบ ป้าคนโตไม่เถียง {name}จึงยืมพลั่วจากโรงสีมาเอง ขุดตอนที่ทั้งหมู่บ้านหลับ ดินปลายหนาวยังแข็ง ฟันพลั่วลงไปทีละนิ้ว

          พอรุ่งสาง หลุมลึกพอดี ขอบตรง ก้นเรียบ สัปเหร่อมาถึงตอนสาย ยืนดูหลุมอยู่ครู่หนึ่ง แล้วกระโดดลงไปเทียบความลึกกับด้ามพลั่วของตัวเอง ขึ้นมาก็เลิกบ่นเรื่องดิน
        effects: { stats: { STR: 1, CON: 1 }, flags: [lean_warrior, dug_grandmother_grave] }
      failure:
        text: |
          ใต้หน้าดินลงไปคืบเดียวก็เจอชั้นน้ำแข็ง ขุดไปได้ไม่ถึงเข่า ฝ่ามือก็พองแตกทั้งสองข้าง {name}ขุดต่อจนเลือดซึมด้ามพลั่ว

          ตอนเช้าสัปเหร่อมาเห็นหลุมครึ่งๆ กลางๆ กับรอยเลือดบนด้ามพลั่ว แกเลิกพูดเรื่องดิน ลงมือขุดต่อจนเสร็จเอง แต่ไม่ยอมจับพลั่วด้ามนั้นเลย
        effects: { stats: { STR: 1 }, hp: -1, flags: [lean_warrior] }
    - id: speak_at_grave
      label: ลุกขึ้นพูดถึงย่าที่หลุมศพ เมื่อไม่มีใครลุก
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          ไม่มีคำสวดยาว ไม่มีใครเล่าว่าย่าเป็นคนอย่างไร ทุกคนยืนรอให้ดินกลบเสร็จจะได้กลับบ้าน {name}ก้าวออกไปยืนตรงหัวหลุม แล้วเล่าเรื่องหมวก

          เล่าว่าห่อผ้าวางอยู่หน้าประตูตอนเช้า เล่าว่าถักแน่นสองชั้น ยาวลงมาคลุมหู เล่าว่าทั้งหมู่บ้านมีคนถักลายนี้อยู่คนเดียว แล้วยกหมวกใบที่ยังถักไม่เสร็จขึ้นให้ทุกคนดู ผู้หญิงหลายคนที่ยืนอยู่หลังสุดยกมือปิดปาก ป้าคนโตร้องไห้ออกมาเป็นคนแรก
        effects: { stats: { CHA: 1 }, flags: [lean_bard, spoke_for_grandmother] }
      failure:
        text: |
          {name}ก้าวออกไปยืนตรงหัวหลุม เปิดปาก แล้วนึกคำแรกไม่ออก คนที่ยืนอยู่รอบหลุมหันมามองพร้อมกัน ยิ่งมองยิ่งนึกไม่ออก

          สุดท้ายพูดได้ประโยคเดียว ว่าย่าถักหมวกให้ แล้วก็ถอยกลับมายืนข้าง{mother} ประโยคเดียวนั้นมีคนเอาไปเล่าต่อกันในตลาดทั้งเดือน
        effects: { stats: { CHA: 1 }, flags: [lean_bard] }

- id: youth.kept_young_hunter
  stage: youth
  weight: 10
  when:
    age: [12, 13]
    flags: [origin_marked_kept]
  text: |
    นักล่าแม่มดคนเดิมไม่ได้มาแล้ว ปีนี้ศาสนจักรตะเกียงส่งคนใหม่มา อายุไม่น่าเกินยี่สิบ เสื้อคลุมขาวยังใหม่จนพับเป็นรอยเหลี่ยม และไม่ได้มาตามรอบห้าปี เขามาเพราะข่าวว่ามีคนเห็นสาวกลัทธิเถ้าเดินผ่านตลาดเมื่อเดือนก่อน

    เขาไม่นั่งม้านั่งหน้าบ้าน ไม่ถอดถุงมือ เปิดสมุดวิหารหน้าผู้ต้องตรา อ่านชื่อ{name}ออกเสียงดังพอให้บ้านข้างๆ ได้ยิน แล้วบอกว่าจะกลับมาอีกครั้งตอนบ่าย พาเด็กไปรับพรที่วิหารในเมือง

    เสมียนที่เดินตามมาเป็นคนเดิม แก่ลงกว่าเดิมมาก เขาวางสมุดไว้บนขอบบ่อ ตอนนักล่าคนใหม่หันไปพูดกับ{mother}
  choices:
    - id: slip_away
      label: มุดลงรางน้ำโรงสี หายไปก่อนบ่าย
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          รางน้ำโรงสีแคบจนผู้ใหญ่มุดไม่เข้า {name}มุดลงไปตั้งแต่ก่อนเที่ยง ไหลตามน้ำไปถึงคลองใต้หมู่บ้าน แล้วเดินลุยโคลนไปนั่งอยู่บนต้นหลิวริมทุ่งจนพระอาทิตย์ตก

          นักล่าคนใหม่กลับมาตอนบ่าย ค้นบ้าน ค้นโรงสี ค้นกองฟางหลังโรงสีจนฟางกระจาย ไม่เจอ ก่อนกลับเขาเขียนอะไรบางอย่างลงในสมุดเล่มเล็กของตัวเอง ไม่ใช่สมุดวิหาร
        effects: { stats: { DEX: 1 }, reputation: { lamp_church: -1 }, flags: [lean_rogue, hid_from_young_hunter] }
      failure:
        text: |
          รางน้ำตีบลงตรงช่วงใต้กังหัน {name}ติดอยู่ตรงนั้น น้ำไหลผ่านหน้าจนสำลัก คนงานโรงสีได้ยินเสียงไอ เลยหยุดกังหันแล้วดึงขึ้นมา

          บ่ายนั้น{name}ยังเปียกอยู่ตอนนักล่าคนใหม่มาถึง เขาเห็นแล้วหัวเราะ บอกว่าเด็กที่ไม่มีอะไรต้องซ่อน ไม่มุดรางน้ำ แล้วก็พาไปรับพรที่วิหารในเมืองจริงๆ พรนั้นคือการคุกเข่าบนพื้นหินสามชั่วยาม โดยมีตะเกียงแขวนอยู่เหนือหัว
        effects: { stats: { CON: 1 }, flags: [lean_rogue, lamp_blessed_kneel] }
    - id: answer_smooth
      label: รอเขากลับมา แล้วตอบทุกคำถามให้เรียบที่สุด
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          นักล่าคนใหม่ถามเรื่องฝัน เรื่องเสียงทุ้ม เรื่องสาวกลัทธิในตลาด {name}ตอบทุกข้อ ช้าและสุภาพ ไม่เคยฝันถึงเสียงไหน ไม่เคยเห็นคนแปลกหน้า เดือนก่อนไปตลาดสองครั้ง ซื้อเกลือกับเข็มเย็บผ้า แล้วถามกลับว่าพรที่วิหารในเมืองต้องเตรียมอะไรไปบ้าง

          เขาหยุดถาม หันไปดูเสมียน เสมียนแก่ยักไหล่ นักล่าคนใหม่ปิดสมุด บอกว่าเด็กคนนี้ไม่ต้องไปก็ได้ ปีหน้าค่อยว่ากัน
        effects: { stats: { CHA: 1 }, flags: [talked_past_hunter] }
      failure:
        text: |
          {name}ตอบดีทุกข้อจนถึงข้อสุดท้าย เขาถามว่าเคยได้ยินใครเรียกชื่อตอนหลับไหม {name}ตอบว่าไม่เคย เร็วไปนิดหนึ่ง

          เขาจดคำตอบนั้นด้วยปากกาของตัวเอง ลงในสมุดพกปกขาว แล้วยิ้ม บอกว่าเด็กคนนี้ไม่ต้องไปวิหารวันนี้ เขาจะมาหาเองอีก
        effects: { stats: { WIS: 1 }, reputation: { lamp_church: -1 }, flags: [lean_bard, lamp_suspicion] }
    - id: read_register
      label: ทำเป็นตักน้ำข้างบ่อ แอบอ่านสมุดวิหารที่วางอยู่
      check: { stat: INT, dc: 12 }
      success:
        text: |
          หน้าผู้ต้องตราของบ้านโรงสีบนมีชื่อเดียว แต่สมุดเปิดค้างอยู่ที่หน้าถัดไป หน้าของหมู่บ้านอื่นในเขตเดียวกัน {name}อ่านกลับหัวได้สามบรรทัดก่อนเสมียนจะหยิบสมุดคืน บ้านหนองปลาไหล บ้านเงาเสา บ้านท่าเกวียน บ้านละชื่อ ทุกชื่ออายุไม่เกินสิบห้า

          ข้างชื่อของบ้านเงาเสามีคนเขียนตัวเล็กๆ ไว้ด้วยหมึกอีกสี ว่า ย้ายไปวิหารอีเซลตั้งแต่ทารก
        effects: { stats: { INT: 1 }, flags: [lean_wizard, read_lamp_register] }
      failure:
        text: |
          ตัวหนังสือกลับหัวเล็กเกินไป {name}อ่านได้แค่หัวกระดาษ เขต ปี และจำนวน ปีนี้จำนวนเพิ่มจากหน้าก่อนสามคน

          เสมียนแก่เห็นว่า{name}มองอะไรอยู่ เขาไม่ได้ปิดสมุดทันที รอจนนักล่าคนใหม่หันกลับมาถึงจะหยิบขึ้น
        effects: { stats: { WIS: 1 }, flags: [lean_wizard] }

# ---------- ซ่อนไว้ คฤหาสน์ในเวนทราส ----------

- id: youth.hidden_doctor_funeral
  stage: youth
  weight: 10
  when:
    age: [12, 13]
    flags: [origin_marked_hidden]
  text: |
    หมอประจำตระกูลตายตอนต้นปี ล้มลงข้างเตาในห้องตรวจของตัวเอง กระเป๋าหนังใบเล็กยังวางอยู่บนโต๊ะ

    ท่านย่าพาทั้งบ้านไปงานศพที่ห้องสวดของออสซาในเวนทราส ห้องหินใต้ดินที่ผนังทุกด้านสลักชื่อคนตาย นักบวชออสซาเป็นหญิงร่างผอมสวมเสื้อสีเทาเรียบ จะอ่านชื่อทุกชื่อที่ผู้ตายเคยรู้จักตามธรรมเนียม ชื่อละหนึ่งลมหายใจ หมอคนนี้รู้จักคนมาก การอ่านจะยาวจนถึงเที่ยงคืน

    ระหว่างนั้น กระเป๋าหนังใบนั้นวางรวมอยู่กับของใช้ผู้ตายบนโต๊ะข้างประตู ข้างในมีตะไบที่หมอใช้มาตั้งแต่{name}เกิด

    และในบ้าน ไม่มีใครรู้วิธีตะไบนอกจากหมอ
  choices:
    - id: take_file
      label: ปลีกตัวไปหยิบตะไบออกจากกระเป๋าหนัง ก่อนญาติหมอจะมาเก็บของ
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}ขอไปห้องน้ำ เดินอ้อมไปทางโต๊ะของผู้ตาย มือข้างหนึ่งเปิดกระเป๋า อีกข้างหยิบตะไบใส่แขนเสื้อ ใช้เวลาไม่ถึงหนึ่งชื่อที่นักบวชอ่าน

          ในกระเป๋ายังมีสมุดบันทึกของหมอ หน้าสุดท้ายจดไว้เป็นแถว เดือน ปี ความยาว ทุกบรรทัดเป็นของ{name} {name}เอาสมุดเล่มนั้นมาด้วย คืนนั้นเผาทิ้งในเตาห้องนอนทีละหน้า
        effects: { stats: { DEX: 1 }, flags: [took_doctor_file] }
      failure:
        text: |
          มือ{name}ยังไม่ทันพ้นกระเป๋า ลูกชายของหมอก็เดินเข้ามาเก็บของพอดี สายตาเขาลงไปที่ตะไบในมือ{name} แล้วขึ้นมาที่หน้า

          ลูกชายหมอปิดกระเป๋า แล้วยื่นทั้งใบให้ "พ่อบอกไว้ว่าถ้าวันไหนเป็นอะไรไป ให้เอาใบนี้ไปให้บ้านนั้น" เขาว่า "ข้าไม่รู้ว่าบ้านนั้นหมายถึงบ้านไหน จนเมื่อกี้"
        effects: { stats: { WIS: 1 }, flags: [lean_rogue, doctor_son_knows] }
    - id: stay_reading
      label: นั่งฟังนักบวชอ่านชื่อจนครบทุกชื่อ
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          ญาติหมอทยอยกลับไปตั้งแต่สามทุ่ม ท่านย่ากลับตอนสี่ทุ่ม บอกให้สาวใช้รอ{name}ที่รถม้า {name}นั่งอยู่จนห้องหินเหลือแค่นักบวชกับคนฟังคนเดียว

          ชื่อสุดท้ายที่นักบวชอ่านคือชื่อของ{name} เธออ่านแล้วหยุด เงยหน้าขึ้นจากแผ่นรายชื่อ "หมอเขียนชื่อเจ้าไว้เป็นชื่อสุดท้าย" เธอว่า "ไม่มีใครเขียนชื่อสุดท้ายไว้โดยไม่มีเหตุ" แล้วเธอก็บอกว่าห้องหินนี้เปิดทุกคืนเดือนดับ ใครจะมานั่งฟังชื่อก็ได้ ไม่มีใครถาม
        effects: { stats: { WIS: 1 }, flags: [lean_cleric, ossa_last_name] }
      failure:
        text: |
          ราวห้าทุ่ม {name}ฟุบหลับไปบนม้านั่งหิน มาตื่นอีกทีตอนนักบวชออสซาเขย่าไหล่ ห้องว่างแล้ว ตะเกียงดับไปครึ่งหนึ่ง

          เธอไม่ดุ บอกว่าคนตายไม่ถือคนหลับ ถือแต่คนที่ไม่มา แล้วเดินไปส่งถึงรถม้า ถือตะเกียงส่องทางให้
        effects: { stats: { CON: 1 }, flags: [lean_cleric] }
    - id: file_alone
      label: กลับบ้านไปเปิดผ้าคลุมกระจก แล้วตะไบเองเป็นครั้งแรก
      check: { stat: CON, dc: 12 }
      success:
        text: |
          ตอเขางอกพ้นผมขึ้นมาแล้วครึ่งข้อนิ้ว {name}จุดเทียนสองเล่ม ดึงผ้าคลุมกระจกในห้องแต่งตัวของท่านย่าลง แล้วหยิบตะไบอันสำรองที่หมอเคยทิ้งไว้ในลิ้นชัก

          ตะไบเองเจ็บกว่าตอนหมอทำ เพราะต้องดูทั้งมือและหน้าตัวเองไปพร้อมกัน ใช้เวลาสองชั่วยาม เรียบจนคลำไม่เจอ ท่านย่ามายืนอยู่ที่ประตูตั้งแต่เมื่อไหร่ไม่รู้ แกไม่ได้เข้ามาช่วย พอเสร็จแกก็ดึงผ้าคลุมกระจกขึ้นให้
        effects: { stats: { CON: 1, DEX: 1 }, flags: [files_own_horns] }
      failure:
        text: |
          ตะไบลื่นหลุดจากตอเขาไปครูดหนังหัว เลือดไหลลงมาตามขมับ ตาข้างหนึ่งพร่าเพราะเลือด {name}ก็ยังตะไบต่อ จนท่านย่ามาเห็นแล้วคว้าข้อมือไว้

          ท่านย่าล้างแผลให้เอง ทำไม่เป็น มือสั่น ผ้าพันแผลพันเบี้ยว พันจนเสร็จแกก็นั่งลงบนเก้าอี้ตัวเตี้ย ไม่เคยมีใครในบ้านเห็นแกนั่งต่ำกว่าเก้าอี้พนักสูงมาก่อน
        effects: { stats: { CON: 1 }, hp: -1, flags: [lean_warrior] }

- id: youth.hidden_lodge_sale
  stage: youth
  weight: 10
  when:
    age: [12, 13]
    flags: [origin_marked_hidden]
  text: |
    ของชิ้นสุดท้ายที่ตระกูลยังไม่ได้ขายคือกระท่อมล่าสัตว์ในป่าทางเหนือ ห่างเวนทราสสองวันรถม้า ปู่ของปู่สร้างไว้ ไม่มีใครในบ้านไปที่นั่นมาสิบปีแล้ว นอกจากคนเฝ้ากระท่อมที่ตระกูลยังจ่ายค่าจ้างให้ทุกปีด้วยเงินที่ไม่มี

    คนซื้อเป็นเจ้าของโรงกลั่นจากย่านริมแม่น้ำ อยากได้ไว้พาแขกไปล่ากวาง ท่านย่าพา{name}ขึ้นไปกระท่อมสามวันก่อนวันลงชื่อในสัญญา บอกว่าทายาทต้องเห็นของที่ตัวเองไม่ได้รับสักครั้ง

    คนเฝ้ากระท่อมเป็นชายแก่สองคน คนหนึ่งเป็นพรานเก่าของตระกูล อีกคนเคยเป็นอัศวิน ไม่มีที่ดิน ไม่มีม้า เหลือแต่ดาบเล่มเดียวที่แขวนไว้เหนือเตาผิง
  choices:
    - id: dawn_hunt
      label: ตื่นก่อนรุ่งไปตามรอยกวางกับพรานเก่า
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          พรานเก่าสอนให้ดูดินก่อนดูรอย ดูว่าดินยังชื้นไหม ดูว่าใบไม้ที่โดนเหยียบพลิกขึ้นหรือยัง {name}เป็นคนชี้รอยกวางตัวเมียที่เพิ่งผ่านไปไม่นาน ก่อนพรานเก่าจะเห็น

          ทั้งสองคนไม่ได้ยิง แค่ตามไปจนเห็นตัว แล้วนั่งดูมันกินหญ้าอยู่ริมห้วย ขากลับพรานเก่าบอกว่าเด็กในตระกูลนี้คนสุดท้ายที่ตามรอยเป็นคือปู่ของ{name} ตอนปู่อายุเท่านี้
        effects: { stats: { WIS: 1, DEX: 1 }, flags: [lean_ranger, lodge_tracker] }
      failure:
        text: |
          {name}เหยียบกิ่งไม้แห้งดังเปรี๊ยะตั้งแต่ยังไม่พ้นลาน กวางทั้งฝูงหายไปในป่าก่อนพรานเก่าจะได้ชี้ให้ดูสักตัว

          พรานเก่าหัวเราะ บอกว่าวันแรกเขาเองก็เหยียบกิ่งเดียวกันนี้ ต้นเดียวกันนี้ แล้วพาเดินต่อจนเที่ยง สอนให้ฟังเสียงนกก่อนเสียงเท้าตัวเอง
        effects: { stats: { WIS: 1 }, flags: [lean_ranger] }
    - id: old_sword
      label: ขอให้อัศวินเก่าสอนจับดาบที่แขวนเหนือเตาผิง
      check: { stat: STR, dc: 12 }
      success:
        text: |
          ดาบเล่มนั้นยาวเกือบเท่าตัว{name} อัศวินเก่าไม่ให้ฟันอะไร ให้ถือยกค้างไว้ระดับอก นับถึงร้อย แล้วนับใหม่ วันที่สอง{name}นับได้ถึงสามร้อย

          วันที่สาม อัศวินเก่าให้ฟันกิ่งไม้ที่ห้อยอยู่ริมลาน {name}ฟันทีเดียวขาด แกเอาดาบคืนไปแขวนเหนือเตาผิง แล้วบอกท่านย่าว่าถ้าวันไหนตระกูลนี้มีเงินจ้างครู ไม่ต้องไปหาที่ไหน ส่งเด็กคนนี้มาที่นี่
        effects: { stats: { STR: 1, CON: 1 }, flags: [lean_warrior, lodge_sword] }
      failure:
        text: |
          ยกได้ไม่ถึงห้าสิบ ข้อมือก็ตก ปลายดาบจิ้มลงพื้นไม้จนเป็นรอย อัศวินเก่าบอกว่าพื้นไม้นั่นก็ขายไปแล้ว ไม่เป็นไร

          สามวันนั้น{name}ยกดาบทุกเช้า ได้มากขึ้นทีละสิบ วันสุดท้ายได้แปดสิบ อัศวินเก่าบอกว่าถ้าเกิดเป็นลูกชาวนาคงได้สองร้อยแล้ว ลูกขุนนางมือนิ่มเกิน
        effects: { stats: { STR: 1 }, flags: [lean_warrior] }
    - id: charm_buyer
      label: วันลงชื่อในสัญญา นั่งโต๊ะเดียวกับคนซื้อ ชวนคุยจนเขาอยากจ่ายเพิ่ม
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}เล่าเรื่องกวางตัวที่ปู่ของปู่ล่าได้ ชี้ให้ดูเขากวางบนผนัง เล่าว่าแขกคนไหนเคยมานอนห้องไหน เติมชื่อขุนนางที่ไม่เคยมาจริงเข้าไปสองชื่อ

          เจ้าของโรงกลั่นฟังจนลืมกินซุป ก่อนจับปากกา เขาขอเพิ่มเงินเองอีกหนึ่งส่วนห้า แลกกับให้ทายาทมาเล่าเรื่องนี้ให้แขกของเขาฟังสักคืน ท่านย่าไม่ได้มองหน้า{name}ตลอดมื้อ พอขึ้นรถม้า แกบอกว่าชื่อขุนนางสองชื่อนั้น ปีหน้าอย่าใช้ซ้ำ
        effects: { stats: { CHA: 1 }, gold: 6, flags: [lean_bard, charmed_lodge_buyer] }
      failure:
        text: |
          {name}พูดมากไปหนึ่งเรื่อง เล่าว่าในกระท่อมมีห้องหนึ่งที่ไม่มีใครเข้า เจ้าของโรงกลั่นถามว่าห้องไหน แล้วขอดูก่อนลงชื่อ

          ห้องนั้นเป็นแค่ห้องเก็บของที่หลังคารั่ว เขาเลยขอลดราคาเพราะหลังคา ท่านย่ายอมลดให้ ขากลับแกให้{name}ถือถุงเงินค่ากระท่อมไว้บนตักตลอดสองวัน ถุงนั้นเบากว่าที่ตกลงกันไว้
        effects: { stats: { CHA: 1 }, flags: [lean_bard] }

# ---------- ทิ้งไว้ที่วิหารอีเซล ----------

- id: youth.foundling_wolves
  stage: youth
  weight: 10
  when:
    age: [12, 13]
    flags: [origin_marked_foundling]
  text: |
    หน้าหนาวปีนั้นยาวกว่าทุกปี หมาป่าลงจากเนินเหนือมาถึงทุ่งรอบเสาของอีเซล คืนแรกมันกินแกะของบ้านริมทาง คืนที่สามมันมาวนรอบคอกหลังวิหาร คอกที่นางเหม็นนอนอยู่

    นางเหม็นแก่แล้ว นมไม่ค่อยออก แต่เด็กในวิหารรุ่นไหนก็โตมากับนมของมัน แม่ชีโทเรนบอกว่าถ้าหมาป่ากินวัวตัวนี้ วิหารก็ไม่มีเงินซื้อตัวใหม่

    คืนที่สี่ {name}ได้ยินเสียงนางเหม็นร้องตอนตีหนึ่ง ร้องเสียงแบบที่ไม่เคยร้อง
  choices:
    - id: torch_fight
      label: คว้าดุ้นฟืนติดไฟจากเตาครัว วิ่งออกไปที่คอก
      check: { stat: STR, dc: 13 }
      success:
        text: |
          หมาป่ามีสองตัว ตัวหนึ่งมุดลอดรั้วเข้าไปแล้ว {name}ฟาดดุ้นฟืนลงไปกลางหลังมัน ประกายไฟแตกกระจายบนขน มันร้องเสียงแหลมแล้วกระโจนข้ามรั้วหนีไป อีกตัววิ่งตาม

          นางเหม็นมีแผลที่ขาหลังแผลเดียว แม่ชีโทเรนออกมาถึงตอนทุกอย่างจบแล้ว ถือไม้กวาดมาด้ามหนึ่ง แกมองไม้กวาดในมือตัวเอง มองดุ้นฟืนในมือ{name} แล้วหัวเราะออกมาจนต้องเกาะรั้ว
        effects: { stats: { STR: 1 }, alignment: { moral: 1 }, flags: [lean_warrior, drove_off_wolves] }
      failure:
        text: |
          ดุ้นฟืนดับตั้งแต่ก้าวที่สามเพราะหิมะ {name}ไปถึงคอกพร้อมไม้ดำๆ ท่อนหนึ่ง หมาป่าตัวหนึ่งหันมา แล้วกระโจนใส่

          เขี้ยวทะลุแขนเสื้อหนาสามชั้นลงไปถึงเนื้อ {name}เอาไม้ท่อนนั้นฟาดหัวมันจนมันปล่อย คนในวิหารตื่นกันหมดเพราะเสียงร้อง ทั้งของวัวและของคน หมาป่าหนีไป นางเหม็นรอด แผลที่แขน{name}เป็นรอยฟันอยู่ไปจนตาย
        effects: { stats: { STR: 1, CON: 1 }, hp: -2, flags: [lean_warrior] }
    - id: track_den
      label: รอเช้า แล้วตามรอยมันกลับไปหาว่าลงมาจากทางไหน
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          รอยเท้าบนหิมะชัดอยู่แค่ถึงริมทุ่ง หลังจากนั้นหมาป่าเดินบนรอยเกวียน {name}ดูแต่รอยที่ขอบล้อเกวียนแตก เดินตามไปครึ่งเช้าก็เจอโพรงใต้รากไม้ล้มบนเนินเหนือ ลูกหมาป่าสี่ตัวนอนกองกันอยู่ข้างใน ผอมจนเห็นซี่โครง

          {name}ไม่ได้บอกใครว่าโพรงอยู่ที่ไหน กลับไปบอกแม่ชีโทเรนแค่ว่ามันลงมาเพราะหิว แล้วเอาเศษกระดูกจากครัวไปวางไว้ที่ปากเนินทุกคืนจนหิมะละลาย หมาป่าไม่ลงมาที่คอกอีก
        effects: { stats: { WIS: 1, DEX: 1 }, flags: [lean_ranger, wolf_den_secret] }
      failure:
        text: |
          ครึ่งทางรอยหายไปในลำห้วยที่น้ำยังไม่แข็ง {name}เดินวนหาอยู่จนบ่าย ไม่เจอ ขากลับเจอแต่ขนสีเทาติดอยู่กับรั้วบ้านริมทาง

          คืนนั้นหมาป่ามาอีก นางเหม็นรอดเพราะคนเฝ้ายามที่หมู่บ้านส่งมา {name}นั่งอยู่บนหลังคาคอกทั้งคืน ดูว่าหมาป่ามาจากทางไหน พอรุ่งสางก็รู้
        effects: { stats: { WIS: 1 }, flags: [lean_ranger] }
    - id: ring_bell
      label: ปีนหอระฆังขึ้นไปตีระฆังเรียกคนในทุ่ง
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          ประตูหอระฆังลงกลอนตอนกลางคืน {name}ปีนขึ้นทางผนังด้านนอก ยึดร่องหินทีละร่อง ไปถึงช่องระฆังแล้วกระตุกเชือกจนระฆังดังลั่นทุ่ง

          ไฟในบ้านริมทางติดขึ้นทีละหลัง ผู้ชายสามคนถือคราดวิ่งมาที่วิหาร หมาป่าหนีไปก่อนพวกเขาจะมาถึง แม่ชีโทเรนยืนอยู่ใต้หอระฆัง เงยหน้าขึ้นมา ถามว่าปีนขึ้นไปทางไหน {name}ชี้ผนังด้านนอก แกให้ช่างในหมู่บ้านมาสกัดร่องหินพวกนั้นให้เรียบในเดือนต่อมา
        effects: { stats: { DEX: 1 }, flags: [climbed_bell_tower] }
      failure:
        text: |
          {name}ปีนไปได้ครึ่งผนัง ร่องหินร่องหนึ่งเป็นน้ำแข็ง มือลื่น ร่วงลงมาบนกองหิมะข้างหอ

          ไม่มีอะไรหัก แต่ร้องออกมาดังพอให้แม่ชีทุกคนตื่น ทุกคนออกมาถือตะเกียง หมาป่าเห็นแสงไฟเยอะขนาดนั้นก็ถอยออกไปเอง แม่ชีโทเรนบอกว่าเสียงร้องได้ผลดีกว่าระฆัง แต่ห้ามทำอีก
        effects: { stats: { DEX: 1 }, hp: -1, flags: [lean_rogue] }

- id: youth.foundling_pump_tinker
  stage: youth
  weight: 10
  when:
    age: [12, 13]
    flags: [origin_marked_foundling]
  text: |
    เครื่องสูบน้ำในครัววิหารเป็นของบริจาคจากเจ้าของโรงกลั่นคนหนึ่งเมื่อสิบปีก่อน ข้างในมีขดแก้วเล็กๆ ใส่น้ำค้างดาว คอยดันลูกสูบให้น้ำในท่อไหลไม่หยุด น้ำที่ไหลอยู่ไม่แข็ง ต่อให้หนาวแค่ไหน ปีนี้ขดแก้วร้าว ลูกสูบหยุด น้ำในท่อแข็งตั้งแต่ต้นหนาว แม่ครัวต้องหิ้วถังไปตักบ่อหลังวิหารวันละสามสิบเที่ยว

    ช่างที่มาซ่อมเป็นคนแคระผู้หญิง เดินทางรับจ้างตามหมู่บ้าน แบกกล่องเครื่องมือไว้บนหลังจนตัวงอ ผมเปียสองข้างผูกด้วยลวดทองเหลือง เธอเห็นเด็กมีเขาเต็มลานวิหาร ไม่ได้มองซ้ำสักคน

    เธอบอกแม่ชีโทเรนว่าค่าซ่อมสามเหรียญเงิน วิหารมีหนึ่งเหรียญกับอีกนิดหน่อย
  choices:
    - id: help_tinker
      label: ขอช่วยยกเครื่องมือ แล้วถามทุกอย่างที่เธอทำ
      check: { stat: INT, dc: 12 }
      success:
        text: |
          ช่างคนแคระตอบทุกคำถาม ตอบห้วนๆ แต่ไม่เคยไม่ตอบ ทำไมขดต้องเป็นแก้ว ทำไมต้องขดเป็นเกลียว ทำไมน้ำค้างดาวต้องอยู่ในขดที่ปิดสนิท พอ{name}ถามว่าถ้าขดร้าวแล้วน้ำค้างดาวรั่วไปไหน เธอหยุดมือ

          "มันชอบไปที่ตากับมือ" เธอว่า "ข้าถึงไม่ให้แม่ครัวของเจ้าจับขดอันเก่า" แล้วเธอก็ห่อขดร้าวอันนั้นใส่ผ้าหนาสามชั้น ใส่กล่องเหล็ก เอากลับไปด้วย ก่อนกลับเธอทิ้งไขควงเล็กไว้ให้{name}อันหนึ่ง
        effects: { stats: { INT: 1 }, flags: [lean_wizard, tinker_screwdriver] }
      failure:
        text: |
          {name}ถามมากจนเธอหันมาบอกว่าถ้าถามอีกคำ จะคิดค่าสอนเพิ่มหนึ่งเหรียญ {name}เลยเงียบ ยืนดูอย่างเดียวจนเธอเสร็จ

          แต่ดูอย่างเดียวก็จำได้ ขดเกลียวต้องหันปลายขึ้น ข้อต่อต้องพันด้วยหนังแกะก่อนขัน หนังแกะต้องชุบน้ำมันหมู ปลายเดือนนั้นท่อในห้องอาบน้ำของวิหารรั่ว {name}ซ่อมเองได้ด้วยมีดกับหนังแกะ
        effects: { stats: { WIS: 1 }, flags: [lean_wizard] }
    - id: haggle
      label: ไปคุยกับเธอแทนแม่ชีโทเรน ต่อราคาลง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ไม่ได้ขอให้ลด เล่าเรื่องนางเหม็นให้ฟังแทน เล่าว่าเด็กทุกคนในวิหารโตมากับนมของมัน เล่าว่าแม่ครัวหิ้วถังวันละสามสิบเที่ยว เล่าจนถึงตรงที่แม่ครัวเริ่มเดินกะเผลก

          ช่างคนแคระฟังจบ ถามว่าใครสอนให้พูดอย่างนี้ {name}บอกว่าไม่มีใครสอน เธอว่างั้นน่ากลัวกว่า แล้วคิดหนึ่งเหรียญเงิน ขอแลกนมวัวที่เหลือในวันนั้นด้วยหนึ่งถ้วย
        effects: { stats: { CHA: 1 }, flags: [haggled_tinker] }
      failure:
        text: |
          {name}ต่อราคาตามที่เห็นแม่ครัวต่อปลาที่ตลาด ช่างคนแคระฟังแล้วขึ้นราคาเป็นสี่เหรียญ เพราะต้องเสียเวลาฟัง

          แม่ชีโทเรนต้องเอาเชิงเทียนทองเหลืองคู่หนึ่งจากห้องเก็บของมาแลก แกไม่ได้ดุ{name} แต่ให้ไปขัดเชิงเทียนคู่ที่เหลือจนเงาก่อนจะเอาไปวางแทนที่
        effects: { stats: { CHA: 1 }, flags: [lean_bard] }
    - id: pocket_part
      label: ตอนเธอเผลอ หยิบข้อต่อทองเหลืองชิ้นเล็กจากกล่องไปซ่อน
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          ข้อต่อชิ้นนั้นเล็กเท่าข้อนิ้ว ทองเหลืองขัดจนเงา มีร่องเกลียวละเอียดกว่าเส้นผม {name}ซ่อนไว้ในผ้ากระสอบแป้งที่พับเก็บในหีบใต้แท่น กระสอบที่ห่อตัวมาตั้งแต่วันแรก

          ช่างคนแคระนับของในกล่องก่อนกลับ นับทีละชิ้นจนหมดกล่อง แล้วปิดฝา แบกขึ้นหลัง เดินออกไปโดยไม่หันมา ผ่านไปหลายเดือน{name}ถึงคิดได้ว่าคนที่นับของละเอียดขนาดนั้น ไม่มีทางไม่รู้ว่าขาดไปชิ้นหนึ่ง
        effects: { stats: { DEX: 1 }, flags: [lean_rogue, tinker_brass_fitting] }
      failure:
        text: |
          ช่างคนแคระจับข้อมือ{name}ไว้ตั้งแต่มือยังไม่พ้นกล่อง เธอไม่ได้แย่งของคืน ไม่ได้บอกแม่ชี แค่บิดข้อมือ{name}ให้หงายขึ้นจนข้อต่อทองเหลืองกลิ้งลงกลางฝ่ามือ

          "อันนี้ใส่ผิดที่แล้วระเบิด" เธอว่า "ถ้าจะขโมย ขโมยอันที่ไม่ระเบิด" แล้วชี้ให้ดูว่าอันไหน
        effects: { stats: { WIS: 1 }, flags: [lean_rogue] }

- id: youth.foundling_green_book
  stage: youth
  weight: 12
  when:
    age: [12, 13]
    flags: [origin_marked_foundling, star_listener_list]
  text: |
    รถม้าสีดำคันเดิมกลับมาที่วิหาร ล้อยังสะอาดเหมือนเดิม แต่คราวนี้สุภาพบุรุษไม่ได้มาคนเดียว มีชายร่างใหญ่สองคนนั่งอยู่ข้างคนขับ และเขาไม่ได้มาแจกลูกกวาด

    เขาถือจดหมายประทับครั่งสีน้ำเงินมาฉบับหนึ่ง บอกแม่ชีโทเรนว่าโรงเรียนการกุศลได้รับอนุญาตแล้ว เด็กในสมุดปกเขียวที่อายุครบสิบสองให้ไปเริ่มเรียนได้ทันที ไม่ต้องรอใครยินยอม

    แม่ชีโทเรนยืนขวางประตูห้องยาวอยู่คนเดียว อ่านจดหมายช้าๆ ทีละบรรทัด อ่านจบแล้วอ่านซ้ำ {name}รู้ว่าแกกำลังถ่วงเวลา และรู้ว่าชื่อของตัวเองอยู่ในสมุดเล่มนั้น
  choices:
    - id: hide_cellar
      label: มุดลงห้องเก็บมันใต้ครัว ซ่อนจนกว่ารถม้าจะไป
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          ห้องเก็บมันอยู่ใต้แผ่นไม้ข้างเตา ลึกแค่พอนั่งงอเข่า {name}ดึงแผ่นไม้ปิดตามหลัง นั่งนิ่งอยู่ในความมืดกับกลิ่นดิน ได้ยินเสียงรองเท้าเดินผ่านเหนือหัวสองรอบ รอบที่สองหยุดตรงแผ่นไม้ แล้วเดินต่อ

          รถม้าออกไปตอนพลบค่ำ พาเด็กไปสองคน ไม่ใช่{name} แม่ชีโทเรนเปิดแผ่นไม้ให้ตอนดึก แกบอกชื่อเด็กสองคนนั้นให้ฟัง แล้วให้{name}ท่องตามจนจำได้
        effects: { stats: { DEX: 1 }, world: { star: 1 }, flags: [lean_rogue, hid_from_green_book] }
      failure:
        text: |
          แผ่นไม้ปิดไม่สนิทเพราะ{name}รีบ เหลือช่องให้แสงลอดลงมาเส้นหนึ่ง ชายร่างใหญ่คนหนึ่งเดินผ่าน หยุด แล้วก้มลงมอง

          ก่อนที่มือของเขาจะถึงแผ่นไม้ แม่ครัวก็ทำหม้อแกงหกทั้งหม้อตรงหน้าเตา แกงร้อนลวกขาเขาจนต้องกระโดดถอย แล้วแม่ครัวก็ขอโทษเสียงดังไม่หยุด จนสุภาพบุรุษเรียกคนของตัวเองกลับไปที่รถม้า รถม้าออกไปพร้อมเด็กสองคน ไม่ใช่{name}
        effects: { stats: { WIS: 1 }, world: { star: 1 }, flags: [lean_rogue] }
    - id: lie_hum
      label: เดินออกไปบอกสุภาพบุรุษเองว่าตอนนี้ได้ยินเสียงหึ่งทุกคืน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}บอกว่าเสียงเริ่มตั้งแต่หน้าหนาวที่แล้ว ต่ำๆ ดังอยู่ใต้เสียงลม คืนไหนฟ้าเปิดดังกว่าคืนที่ฟ้าปิด แล้วฮัมให้ฟังเสียงหนึ่ง ต่ำลากยาว เลียนเสียงที่เด็กในเมืองฮัมกันตามที่คนเล่า

          สุภาพบุรุษฟังจบก็ยิ้มบางลง เขาเปิดสมุดปกเขียว ขีดเส้นทับชื่อ{name}ด้วยปากกา แล้วหันไปเรียกชื่อถัดไป ตอนเขาเดินผ่าน{name}เขาหยุด ก้มลงมาพูดเบาๆ ว่าเสียงที่ได้ยินใหม่ๆ มักจะหายไปเองในปีสองปี ถ้าวันไหนมันหายไป ให้เขียนจดหมายบอกเขา
        effects: { stats: { CHA: 1 }, world: { star: 1 }, flags: [lean_bard, crossed_from_green_book] }
      failure:
        text: |
          {name}ฮัมเสียงสูงไปนิดเดียว สุภาพบุรุษฟังแล้วหัวเราะ บอกว่าเสียงนั้นไม่เคยมีใครได้ยินเป็นเสียงสูง

          เขาให้ชายร่างใหญ่จับแขน{name}ไว้ แต่แม่ชีโทเรนก้าวเข้ามาตรงกลาง บอกว่าเด็กคนนี้ป่วยเป็นไข้ปอดมาตั้งแต่หนาวที่แล้ว ไปถึงโรงเรียนอาจไม่รอด แกโกหกหน้าตาย ไม่กะพริบตา สุภาพบุรุษจดอะไรบางอย่างข้างชื่อ{name} แล้วปล่อยแขน บอกว่าปีหน้าจะมาใหม่
        effects: { stats: { WIS: 1 }, world: { star: 1 }, flags: [lean_bard, green_book_next_year] }
    - id: run_wardens
      label: วิ่งข้ามทุ่งไปตามจ่าของผู้เฝ้าผนึกที่พักอยู่โรงเตี๊ยมตลาด
      check: { stat: CON, dc: 12 }
      success:
        text: |
          ทุกหน้าหนาวจะมีจ่าของภาคีผู้เฝ้าผนึกมาพักที่โรงเตี๊ยมตลาดหนึ่งเดือน มาหาเด็กมีเขาที่ไม่มีที่ไป {name}วิ่งข้ามทุ่งไปถึงโรงเตี๊ยมโดยไม่หยุดสักครั้ง ปอดแสบจนพูดไม่เป็นประโยค

          จ่าคนนั้นเป็นทีฟลิ่งร่างหนา เขาบนหัวข้างหนึ่งหุ้มปลอกเหล็ก แกฟังไม่ทันจบก็คว้าเสื้อคลุมกับปืนยาว ขี่ม้ากลับมาที่วิหารพร้อมทหารสองนาย สุภาพบุรุษเห็นปืนยาวแล้วพับจดหมายเก็บ บอกว่าวันนี้คงผิดวัน รถม้าออกไปเปล่า ไม่ได้พาเด็กไปสักคน
        effects: { stats: { CON: 1, STR: 1 }, reputation: { wardens: 1 }, world: { star: -1 }, flags: [called_the_wardens] }
      failure:
        text: |
          ครึ่งทุ่ง{name}หายใจไม่ทัน ต้องหยุดอาเจียนข้างคันนา ไปถึงโรงเตี๊ยมช้าไปเกือบชั่วยาม จ่าของผู้เฝ้าผนึกขี่ม้ากลับมาที่วิหารทันที

          รถม้าออกไปก่อนแล้ว พาเด็กไปสองคน จ่าคนนั้นยืนดูรอยล้อบนหิมะ แล้วหันมาถามชื่อเด็กสองคนนั้น ถามชื่อ{name}ด้วย จดไว้ในสมุดปกหนังสีน้ำตาลที่ขอบไหม้
        effects: { stats: { CON: 1 }, reputation: { wardens: 1 }, world: { star: 1 }, flags: [lean_warrior] }
