# ชุด 5 ยุคดาวเร่ง: หมุดของโลก ปี 344 ถึง 379
# หมุดเจ็ดปี (must: true) ใครอายุ 16 ขึ้นไปในปีนั้นต้องเจอ ระบบหยิบให้ทันทีที่เข้าเงื่อนไข ป้าย mark ขึ้นบนเส้นชีวิตและบนแถบยุคของแท็บโลก
# คนที่เกิดปี 270 ถึง 300 อายุ 44 ถึง 109 ในช่วงนี้ และทายาทของชุด 7 จะเข้ามาเจอตอนอายุน้อย ข้อความจึงห้ามเดาวัย ถิ่น และอาชีพ
# ห้ามเอ่ยชื่อคนในผังความสัมพันธ์ คนในบ้านเข้ามาทางบทที่ optional เท่านั้น ทุกชีวิตต้องเข้าเงื่อนไขของหมุดปีนั้นหนึ่งเรื่องพอดี
#   344 ปีป้ายเปล่า หอดูดาวหลวงเลิกประกาศจำนวนดาว
#   349 ปีหลังคาเปิด ผู้ฟังดาวเปิดเรือนไม่มีหลังคา (ทางที่ฝากคำถามได้รอยดาว)
#   355 ปีเขาพันคู่ แยกฉบับ: แผ่นดินอาร์เวล (คนเสื้อขาวมาถึงซอย) กับถิ่นอื่น (คนที่หนีมาถึงถิ่น)
#   361 ปีป้อมสาม แยกฉบับ: แดนเถ้า (แนวหินขาดหน้าบ้าน) กับถิ่นอื่น (ทางที่รับถ่านเฝ้าประตูได้ตราร้อน)
#   367 ปีเรือไม่กลับ กองเรือชุดสองรับคนไม่ถามอายุ
#   373 ปีสองเมือง ห้ามเอ่ยชื่อเจ้านายของปีกไหน ใช้ตราขาวกับตราเทา
#   379 คืนฟ้าเก่า ทุกทางจบที่พื้นสั่นมาจากทางตะวันออก เรื่องหลังเช้าวันนั้นเป็นของชุด 9
# คนมีตราร้อนไม่ได้ยินเสียงหึ่ง ไม่ได้คำตอบจากกล่อง และสิ่งที่มาจากดาวมองไม่เห็น ห้ามเขียนว่าเพราะอะไร

# ---------- 344 ปีป้ายเปล่า ----------
- id: adult.world_blank_board
  stage: adult
  weight: 500
  must: true
  mark: ปีป้ายเปล่า
  when:
    age: [16, 130]
    year: [344, 345]
  text: |
    คนของหอดูดาวหลวงมาถึงถิ่นช้ากว่าทุกปีสี่วัน ค้อนกับถุงตะปูห้อยเอวมาเหมือนเดิม กระดาษที่เขาตอกลงตรงที่เดิมไม่มีตัวเลขหมึกแดง มีบรรทัดเดียวด้วยหมึกดำ ตัวหนังสือเท่ากับประกาศเรื่องภาษี ปีนี้นับไม่ทัน

    มีคนถามว่านับไม่ทันแปลว่าอะไร เขาตอบโดยไม่เงยหน้าจากถุงตะปู คนนับกวาดฟ้าฝั่งตะวันออกเสร็จ หันกลับมาฝั่งตะวันตกก็ไม่ตรงกับที่จดไว้ตอนหัวค่ำแล้ว ประโยคนี้เขาพูดมาแล้วทุกถิ่นตลอดทาง พูดจบก็ขึ้นเกวียน

    ก่อนค่ำโรงเตี๊ยมตั้งกระดานรับพนันว่าตัวเลขของปีนี้คือเท่าไร ทั้งที่ยังไม่มีใครคิดออกว่าจะเอาอะไรมาตัดสิน นักบวชยืนอยู่หน้าประกาศ บอกคนที่มามุงว่าจำนวนดาวเป็นธุระของเทพ คนไม่ต้องแบกแทน และมีมือใครไม่รู้เอาใบปลิวลายมือยาวเอียงของหอนับดาวมาแปะไว้ข้างกัน บนนั้นมีสองจำนวน ดาวเก่าหกพันสองร้อยสี่สิบแปดดวง กับส่วนที่เกิน ส่วนที่เกินไม่มีตัวเลข
  choices:
    - id: believe_the_board
      label: เชื่อตามประกาศ แล้วเลิกแหงนหน้า
      text: |
        นักบวชเทศน์จบด้วยการให้ทุกคนกลับบ้านไปนับของที่เป็นของตัวเอง ไก่ในเล้า ฟืนใต้ชายคา หนี้ที่ยังค้าง {name}กลับไปนับได้ครบทุกอย่างก่อนตะเกียงหมดน้ำมัน แล้วเข้านอนโดยไม่ได้ออกไปยืนนอกชายคาเหมือนคนบ้านอื่น

        รุ่งเช้าใต้บรรทัดหมึกดำมีตัวเลขเขียนด้วยถ่านอยู่สามจำนวน คนละลายมือ ไม่มีจำนวนไหนตรงกัน นักบวชเอาผ้าเปียกมาเช็ดออกเองกับมือ เห็น{name}เดินผ่านก็ชูผ้าดำๆ ให้ดูแล้วหัวเราะ
      effects: { world: { gods: 1 }, alignment: { law: 1 }, flags: [took_the_board_at_its_word] }
    - id: count_from_the_roof
      label: ปีนขึ้นหลังคาไปนับเอง
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ไม่ได้นับทั้งฟ้า เลือกช่องเดียว ระหว่างปล่องไฟกับสันหลังคาบ้านตรงข้าม ผูกปมเชือกทีละสิบดวง รอบแรกได้สี่สิบเอ็ดปม พักกินขนมปังครึ่งก้อน แล้วนับช่องเดิมซ้ำ ได้สี่สิบสามปม

          เชือกสองเส้นวางเทียบกันอยู่บนโต๊ะครัวจนเช้า คนที่แวะมาเห็นแล้วไม่มีใครถามว่านับผิดหรือเปล่า ทุกคนถามว่าพักกินขนมปังนานแค่ไหน
        effects: { stats: { WIS: 1 }, world: { star: 1 }, flags: [counted_from_the_roof] }
      failure:
        text: |
          นับถึงสองร้อยกว่า{name}ก็ไม่แน่ใจว่าดวงที่อยู่เหนือปล่องไฟนับไปแล้วหรือยัง เริ่มใหม่สามหน หนที่สามตื่นขึ้นมาเพราะน้ำค้างลงหน้า กระเบื้องลื่นจนต้องไถลลงมาทั้งก้น

          คอแข็งไปสี่วัน หันซ้ายไม่ได้ เพื่อนบ้านที่ขึ้นหลังคาคืนเดียวกันเดินคอแข็งมาทักที่รั้ว ถามว่าได้เท่าไร แล้วก็ไม่รอฟังคำตอบ
        effects: { hp: -1, flags: [counted_from_the_roof] }
    - id: chalk_the_elf_number
      label: เขียนตัวเลขของเอลฟ์ลงในที่ว่างบนประกาศ
      text: |
        {name}เขียนหกพันสองร้อยสี่สิบแปดด้วยชอล์ก ตัวโตเท่าที่ตัวเลขหมึกแดงเคยโต ตรงที่ว่างเหนือบรรทัดหมึกดำ คนที่เดินผ่านหยุดอ่าน มีคนว่าเลขเก่าก็ยังดีกว่าไม่มีเลข อีกคนว่าเลขที่ไม่ขยับมาตั้งแต่ปู่ของปู่จะเรียกว่านับได้อย่างไร สองคนนั้นเถียงกันจนตลาดวาย

        คนเฝ้าศาลาเอาแขนเสื้อถูออกในวันรุ่งขึ้น ตกบ่ายตัวเลขกลับมาอีก ไม่ใช่ลายมือ{name} คราวนี้เขียนด้วยสีทาเรือ
      effects: { stats: { INT: 1 }, reputation: { star_hall: 1 }, flags: [chalked_the_elf_number] }
    - id: count_for_the_street
      label: รับนับแทนคนทั้งซอย
      requires: { trait: curse_brand }
      text: |
        เพื่อนบ้านสามคนมาเคาะประตูพร้อมเหล้าหนึ่งไห ขอให้{name}ขึ้นไปนับแทน พวกเขาเองนับได้ไม่ถึงร้อยก็ต้องก้มหน้า บอกว่าเหมือนมีอะไรนับกลับ ไม่มีใครพูดว่าทำไมจึงมาขอบ้านนี้ คนหนึ่งเหลือบดู{name}แล้วรีบดูไหเหล้า

        {name}นอนหงายบนหลังคาจนฟ้าสาง นับได้เก้าร้อยกว่าในเสี้ยวเดียวของฟ้า ไม่มีอะไรเกิดขึ้นเลยนอกจากหลังเปียก พอลงมาบอกตัวเลข ทั้งสามคนจดลงฝาไหคนละที เหล้าไหนั้นยกให้{name}ทั้งไห กับเหรียญอีกสองเหรียญที่ไม่ได้ตกลงกันไว้
      effects: { stats: { WIS: 1 }, gold: 2, flags: [counted_for_the_street] }

# ---------- 349 ปีหลังคาเปิด ----------
- id: adult.world_open_roof
  stage: adult
  weight: 500
  must: true
  mark: ปีหลังคาเปิด
  when:
    age: [16, 130]
    year: [349, 350]
  text: |
    ข่าวมาถึงถิ่นก่อนคนที่ไปเห็นมากับตา ผู้ฟังดาวซื้อโรงประมูลน้ำค้างหลังเก่าของเมืองหลวง รื้อหลังคาออกในเจ็ดวัน ตั้งม้านั่งเป็นวงซ้อนกันเจ็ดวง ประตูไม่เคยปิด หน้าประตูมีกล่องไม้ ใครก็เขียนคำถามหย่อนลงไปได้ คืนวันอัสเทลมีคนยืนอ่านคำตอบออกเสียง

    คนแรกของถิ่นที่ไปเห็นกลับมาพร้อมกระดาษเปล่าหนึ่งปึกกับดินสอผูกเชือก เขาเล่าว่าแหวนของแม่ค้าคนหนึ่งหายไปตั้งแต่ก่อนแต่งงาน กล่องบอกว่าอยู่ในรางน้ำฝนหลังบ้าน แล้วก็อยู่ตรงนั้นจริง ใครอยากถามอะไรให้เขียนมา เที่ยวหน้าเขาจะหย่อนให้ คิดค่าเดินคำถามละหนึ่งเหรียญ

    วันแรกไม่มีใครเขียน วันที่สองแถวยาวถึงบ่อน้ำ คนในแถวไม่คุยกัน ทุกคนเอามือบังกระดาษของตัวเอง
  choices:
    - id: ask_the_box
      label: เขียนคำถามที่ค้างใจฝากไป (ของแบบนี้ติดตัวไปนาน)
      requires: { not_traits: [curse_brand], min_gold: 1 }
      text: |
        คำตอบกลับมาในวันอัสเทลถัดไป กระดาษหนา หมึกน้ำเงิน ลายมือเอนซ้ายทุกตัว ยาวบรรทัดครึ่ง {name}อ่านจบแล้วลองทำตาม ถูกทุกคำ ใช้ได้จริง และไม่มีคำไหนเกินกว่าที่ถาม

        คืนนั้น{name}ตื่นกลางดึกเพราะคันหลังใบหู ส่องกระจกกับตะเกียงแล้วเห็นจุดใสใต้ผิวที่เมื่อวานยังไม่มี เล็กเท่าเมล็ดงา กดแล้วไม่เจ็บ เช้าขึ้นมาคิดเงินทอนที่ตลาดได้ก่อนแม่ค้าจะนับเสร็จ
      effects: { gold: -1, marks: { star: 1 }, world: { star: 1 }, flags: [asked_the_open_roof] }
    - id: ask_the_temple
      label: เอาเหรียญนั้นไปหยอดตู้วิหาร แล้วถามเทพแทน
      requires: { min_gold: 1 }
      text: |
        นักบวชเห็น{name}หยอดเหรียญแล้วยืนอยู่หน้าแท่นไม่ไปไหน จึงเดินมาถามว่าขออะไร {name}บอกว่าไม่ได้ขอ ถาม นักบวชหัวเราะดังจนคนกวาดลานหันมาดู บอกว่าที่นี่ตอบช้า ตอบไม่ครบ และไม่เคยตอบเป็นลายมือ แต่ก็ไม่เคยคิดค่าเดิน

        คำถามของ{name}ยังไม่ได้คำตอบจนสิ้นปี แถวหน้าบ่อน้ำยาวขึ้นทุกสัปดาห์ ตู้ของวิหารเบาลงทุกสัปดาห์เหมือนกัน นักบวชเริ่มทักชื่อ{name}ก่อนใครเวลาเดินผ่านตลาด
      effects: { gold: -1, world: { gods: 1 }, flags: [asked_the_temple_instead] }
    - id: forbid_the_house
      label: ห้ามคนในบ้านเขียนอะไรลงกระดาษของเขา
      requires: { any_flags: [has_partner, has_child] }
      text: |
        {name}พูดเรื่องนี้ตอนกินข้าวเย็น ครั้งเดียว เสียงเท่ากับตอนบอกให้ปิดเล้าไก่ ของที่ถามแล้วได้คำตอบทุกครั้งไม่มีวันให้เปล่า ไม่มีใครในบ้านเถียง และไม่มีใครรับปาก

        อีกหลายสัปดาห์ต่อมา{name}เจอดินสอผูกเชือกแท่งหนึ่งซุกอยู่ใต้ถังข้าวสาร ยังไม่ได้เหลา {name}เอาไปใช้จดบัญชีฟืนจนหมดแท่ง ไม่มีใครในบ้านถามหา
      effects: { alignment: { law: 1 }, flags: [kept_the_house_from_the_box] }
    - id: watch_the_queue
      label: ไม่ฝาก แต่ยืนดูว่าใครเข้าแถวบ้าง
      text: |
        คนสีข้าวมาเป็นคนแรก ใครๆ ก็รู้ว่าเรื่องเขตที่นา หญิงม่ายท้ายซอยมาสองรอบ รอบแรกถอยออกจากแถวตอนใกล้ถึง รอบสองเขียนยาวจนดินสอทู่ คนเฝ้าศาลาเดินผ่านไปผ่านมาสี่เที่ยว เที่ยวที่ห้าก็ยื่นกระดาษที่พับมาจากบ้าน

        {name}ยืนพิงเสาอยู่จนแถวหมด คนรับฝากนับกระดาษได้หกสิบสองแผ่น มัดด้วยเชือกป่าน แล้วหันมาถามว่าแน่ใจหรือว่าไม่มีอะไรอยากรู้ {name}บอกว่าได้รู้ไปหกสิบสองเรื่องแล้ว
      effects: { stats: { WIS: 1 }, flags: [watched_the_question_queue] }
    - id: ask_while_branded
      label: ฝากคำถามของตัวเองไปด้วย
      requires: { trait: curse_brand, min_gold: 1 }
      text: |
        วันอัสเทลถัดไป คนรับฝากแจกคำตอบทีละคนจนหมดปึก เหลือ{name}ยืนอยู่คนเดียว เขาควานย่ามอยู่ครู่หนึ่ง แล้วดึงกระดาษของ{name}เองออกมา ยังพับอยู่แบบที่{name}พับ ไม่มีรอยหมึกน้ำเงินสักจุด เขาบอกว่าหย่อนลงกล่องกับมือ เช้าวันรุ่งขึ้นกระดาษแผ่นนี้วางอยู่บนฝากล่อง แผ่นเดียว

        เขาคืนเหรียญให้ บอกว่าเดินคำถามมาสามเที่ยวยังไม่เคยต้องคืนเงินใคร คนที่ได้คำตอบไปแล้วยืนอ่านของตัวเองอยู่รอบลาน หลายคนเงยหน้าขึ้นมาดู{name} แล้วก้มลงอ่านต่อ
      effects: { flags: [got_no_answer_from_the_box] }

# ---------- 355 ปีเขาพันคู่ ----------
- id: adult.world_thousand_horns
  stage: adult
  weight: 500
  must: true
  mark: ปีเขาพันคู่
  when:
    age: [16, 130]
    year: [355, 356]
    location_tag: [arvel_village, ventras, kardin]
  text: |
    หมายหมึกแดงของผู้ถือตะเกียงใหญ่มาถึงทุกบ้านที่มีเด็กเกิดปีนี้ บ้านที่ไม่มีเด็กก็ได้อ่าน เพราะคนเสื้อคลุมขาวตอกสำเนาไว้ที่บ่อน้ำ ปีนี้ทะเบียนวิหารจดเด็กมีเขาได้เกินพันคน เด็กเกิดใหม่ทุกคนต้องให้คนของวิหารตรวจ

    พวกเขามาถึงซอยของ{name}ตอนบ่าย สามคน คนหนึ่งถือสมุดทะเบียนเกิด คนหนึ่งถือแท่งเหล็กห่อผ้า คนที่สามเข็นรถมีประทุน เข้าทีละบ้าน แนบเหล็กเย็นกับหน้าผากเด็กแล้วนับในใจ เด็กที่นิ่งได้ขีดถูกในสมุด เด็กที่ไม่นิ่งได้ขึ้นรถ

    บ้านติดกันมีเด็กอ่อนที่ไม่มีใครในซอยเคยเห็นตอนไม่ใส่หมวกผ้า ก่อนคนเสื้อขาวจะมาถึงสองบ้าน แม่ของเด็กมายืนที่ประตูหลังของ{name} อุ้มตะกร้าแป้งที่มีผ้าคลุม หล่อนยังไม่ทันเอ่ยปาก ตะกร้าก็ขยับ
  choices:
    - id: hide_the_basket
      label: รับตะกร้ามาซ่อนไว้ในบ้าน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}วางตะกร้าไว้ในลังฟืน เอาฟืนแห้งพาดปิดสองท่อน แล้วไปยืนรอที่ประตูหน้าก่อนคนเสื้อขาวจะเคาะ คนถือสมุดถามว่าบ้านนี้มีเด็กไหม {name}ตอบว่ามีแต่หนี้ เขาขีดอะไรลงสมุดโดยไม่ยิ้ม คนถือเหล็กมองเลยไหล่{name}เข้ามาในบ้านจนถึงเตา แล้วเดินไปบ้านถัดไป

          เด็กหลับตลอดจนรถเข็นเลี้ยวพ้นซอย แม่ของเด็กมารับคืนตอนมืด ไม่ได้พูดขอบคุณ วางไข่ไว้ให้บนธรณีประตูหกฟอง แล้วก็วางทุกสัปดาห์ไปจนหมดปีนั้น
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [hid_a_horn_year_child] }
      failure:
        text: |
          คนถือสมุดถามว่าบ้านนี้มีเด็กไหม {name}ตอบว่าไม่มี เร็วไปครึ่งจังหวะ คนถือเหล็กเดินเข้ามาเปิดถังแป้ง เปิดหีบผ้า เปิดเตาที่ยังอุ่น ยืนอยู่หน้าลังฟืนจน{name}นับลมหายใจตัวเองได้เก้าครั้ง แล้วมีเสียงเด็กร้องดังมาจากบ้านท้ายซอย ทั้งสามคนหันไปทางนั้น

          ก่อนออกจากบ้าน คนถือสมุดเขียนชื่อ{name}ลงหน้าหลังสุดด้วยหมึกแดง เด็กในลังฟืนตื่นตอนประตูปิด และร้องไม่หยุดไปจนแม่มารับ
        effects: { hunted: { lamp_church: 1 }, alignment: { moral: 1 }, flags: [hid_a_horn_year_child] }
    - id: walk_to_the_bread_hatch
      label: พาแม่ลูกออกทางหลังบ้านไปช่องขนมปังของวิหารอีเซล
      text: |
        วิหารอีเซลมีช่องไม้บานเล็กข้างประตูครัว ไว้ส่งขนมปังให้คนที่ไม่อยากให้ใครเห็นหน้า {name}พาแม่ลูกเดินอ้อมหลังเล้าหมูสามบ้านไปถึงตอนที่ช่องเปิดอยู่แล้ว มีมือยื่นออกมารับตะกร้า มือเดียว แขนเสื้อเปื้อนแป้ง ไม่ถามชื่อ ไม่ถามว่าเด็กใส่หมวกทำไม

        เย็นนั้นคนเสื้อขาวไปยืนหน้าวิหารอีเซล ขอดูทะเบียน นักบวชหญิงออกมายืนขวางประตูทั้งที่มือยังเปื้อนแป้ง บอกว่าทะเบียนของที่นี่จดแต่จำนวนขนมปัง คนทั้งถิ่นยืนดูสองวิหารเถียงกันกลางถนนจนตะเกียงติด
      effects: { stats: { WIS: 1 }, reputation: { lamp_church: -1 }, flags: [carried_a_baby_to_the_bread_hatch] }
    - id: point_next_door
      label: บอกคนเสื้อขาวว่าบ้านติดกันมีเด็ก
      text: |
        {name}ปิดประตูหลัง แล้วเดินออกประตูหน้าไปยืนรอ คนถือสมุดฟังจบก็พลิกหาหน้าของบ้านนั้น คนถือเหล็กเดินตรงไปโดยไม่ต้องให้ใครชี้ เด็กร้องตั้งแต่ผ้าคลุมตะกร้าเปิด เหล็กแตะหน้าผากได้ไม่ถึงสามลมหายใจ คนถือเหล็กก็ส่ายหน้าให้คนเข็นรถ

        รถมีประทุนออกจากซอยก่อนค่ำ หน้าต่างบ้านติดกันปิดอยู่อย่างนั้นทั้งหน้าหนาว คนถือสมุดวางเหรียญไว้บนรั้วบ้าน{name}สองเหรียญ เรียกว่าค่าชี้ เหรียญวางอยู่ตรงนั้นข้ามคืน เช้าขึ้นมา{name}จึงเก็บ
      effects: { gold: 2, world: { gods: 1 }, alignment: { moral: -1 }, reputation: { lamp_church: 1 }, flags: [pointed_out_a_horn_year_child] }
    - id: shut_the_back_door
      label: ปิดประตูหลัง ไม่รับรู้
      text: |
        {name}ส่ายหน้าครั้งเดียวแล้วลงกลอน เสียงฝีเท้าของแม่เด็กวิ่งไปทางเล้าหมู จากนั้นได้ยินทุกอย่างผ่านผนัง ประตูบ้านติดกันเปิด เสียงพลิกหน้าสมุด เสียงคนนับเบาๆ แล้วเสียงล้อรถเข็น จะหนักขึ้นหรือเท่าเดิม ฟังจากในบ้านแยกไม่ออก

        อีกหลายวัน{name}ไม่ได้เห็นใครจากบ้านนั้น ตะกร้าแป้งใบเดิมคว่ำตากแดดอยู่บนรั้ว ผ้าคลุมตะกร้าไม่ได้ตากด้วย
      effects: { flags: [shut_the_door_in_the_horn_year] }
    - id: teach_the_file
      label: สอนแม่เด็กตะไบตอเขาแบบที่บ้านตัวเองเคยทำ
      requires: { flag: race_tiefling }
      text: |
        {name}พาแม่ลูกเข้าครัว หยิบตะไบเล็บม้ากับน้ำมันหมูออกมา ทำให้ดูกับตอเขาของตัวเองก่อน ตะไบตามแนวผม อย่าทวน ทาน้ำมันทุกเย็น เลือดออกให้หยุดสามวัน เด็กร้องตอนแรก พอชินเสียงตะไบก็หลับคามือ

        คนเสื้อขาวมาถึงตอนที่เศษผงยังอยู่บนโต๊ะ {name}เอาแขนเสื้อปาดลงพื้นแล้วไปเปิดประตูเอง เหล็กเย็นแตะหน้าผากเด็กที่ยังหลับไม่ตื่น คนถือเหล็กนับในใจนานกว่าบ้านอื่น แล้วขีดถูก ตอนเดินออก เขาดู{name}ตั้งแต่หัวจรดมือ ดูอยู่จนพ้นประตู
      effects: { stats: { DEX: 1 }, alignment: { moral: 1 }, flags: [taught_them_to_file_the_buds] }

- id: adult.world_thousand_horns_far
  stage: adult
  weight: 500
  must: true
  mark: ปีเขาพันคู่
  when:
    age: [16, 130]
    year: [355, 356]
    location_tag: [hordun, ileth, ashland]
  text: |
    ข่าวจากอาร์เวลมาถึงพร้อมคนที่หนีมันมา ปีนี้ทะเบียนวิหารของที่นั่นจดเด็กมีเขาได้เกินพันคน ผู้ถือตะเกียงใหญ่ส่งคนเสื้อคลุมขาวออกตรวจเด็กเกิดใหม่ทีละถนน เด็กที่ไม่ผ่านขึ้นรถมีประทุน

    คนที่มาถึงถิ่นของ{name}มากับเกวียนเกลือ นั่งเบียดกันอยู่ระหว่างกระสอบ ผู้หญิงสี่คน ผู้ชายสองคน เด็กอ่อนห้าคน ทุกคนใส่หมวกผ้าผูกใต้คาง คนขับเกวียนบอกว่ารับจ้างมาส่งแค่นี้ เที่ยวหน้ายังมีอีก แล้วเริ่มขนกระสอบลงโดยไม่รอว่าใครจะรับคนพวกนี้ไว้

    ตกเย็นมีชายสองคนขี่ม้าตามมาถึง เสื้อคลุมพับเก็บอยู่ในย่าม เห็นแต่ชายผ้าสีขาว ทั้งสองคนสุภาพ ถามหาเกวียนเกลือ และบอกว่ามีเงินให้คนที่ช่วยชี้ทาง
  choices:
    - id: shelter_them
      label: เปิดบ้านให้พักจนกว่าจะหาที่ไปได้
      text: |
        บ้านของ{name}ได้ผู้หญิงหนึ่งคนกับเด็กหนึ่งคน นอนข้างเตาอยู่สิบเอ็ดคืน ผู้หญิงคนนั้นตื่นก่อนไก่ทุกเช้า กวาดบ้าน ผ่าฟืน ซักผ้าโดยไม่มีใครขอ เด็กถอดหมวกครั้งแรกในคืนที่สาม ตอเขาเล็กเท่าเมล็ดถั่ว ยังนิ่มอยู่

        วันที่สิบสองมีเกวียนอีกคันมารับ ก่อนขึ้นเกวียนผู้หญิงคนนั้นถอดหมวกผ้าของลูกวางไว้บนโต๊ะ บอกว่าไปถึงที่โน่นคงไม่ต้องใช้แล้ว ข้าวสารในถังพร่องไปกว่าที่คนสองคนจะกินหมด {name}ไม่ได้ตวงดูว่าเท่าไร
      effects: { gold: -2, stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [sheltered_horn_year_families] }
    - id: send_them_on
      label: ให้ขนมปังกับน้ำ แล้วบอกทางไปต่อ
      text: |
        {name}เอาขนมปังสองก้อนกับน้ำหนึ่งถุงหนังไปวางบนท้ายเกวียนที่ว่างแล้ว บอกทางที่คนเดินเท้าใช้ ทางที่ม้าไปลำบาก ผู้ชายคนหนึ่งทวนชื่อทางแยกตามสามรอบจนจำได้ ผู้หญิงที่อุ้มเด็กคนเล็กสุดหักขนมปังครึ่งก้อนคืนให้ บอกว่าเท่านี้ก็เกินแล้ว

        พวกเขาออกเดินก่อนฟ้ามืด เด็กห้าคนเงียบผิดเด็ก รุ่งเช้ามีหมวกผ้าใบหนึ่งตกอยู่ข้างทางตรงที่พ้นเขตถิ่น {name}เก็บมาแขวนไว้บนรั้ว เผื่อมีคนย้อนมาหา ไม่มีใครย้อนมา
      effects: { flags: [sent_the_families_on] }
    - id: sell_them_passage
      label: คิดค่าที่พักกับค่านำทาง ตามราคาของคนที่ไม่มีทางเลือก
      text: |
        {name}บอกราคา คนพวกนั้นไม่ต่อ ผู้ชายคนหนึ่งแกะตะเข็บชายเสื้อเอาเหรียญออกมานับ ผู้หญิงถอดต่างหูข้างเดียวที่เหลือวางเพิ่ม {name}ให้นอนในยุ้งสามคืน แล้วเดินนำไปส่งถึงทางแยกที่บอกไว้ ครบตามที่ตกลงกันทุกอย่าง

        ตอนแยกกัน ผู้หญิงคนที่ถอดต่างหูถามชื่อ{name} ถามว่าสะกดอย่างไร แล้วทวนซ้ำหนึ่งครั้งให้แน่ใจว่าจำถูก
      effects: { gold: 4, alignment: { moral: -1 }, flags: [sold_passage_to_the_families] }
    - id: tell_the_riders
      label: รับเงินของชายสองคนนั้น แล้วชี้ว่าเกวียนเกลือจอดที่ไหน
      text: |
        เหรียญหนักกว่าที่{name}คิด ชายสองคนขอบคุณ แล้วสวมเสื้อคลุมก่อนเดินเข้าไป คนในถิ่นออกมายืนดูกันสองข้างทาง ไม่มีใครขวาง ไม่มีใครช่วย เด็กสามในห้าคนขึ้นหลังม้าไปในตะกร้าสานที่สองคนนั้นเตรียมมา อีกสองคนโดนเหล็กแตะแล้วได้อยู่กับแม่

        คนขับเกวียนเกลือไม่กลับมาถิ่นนี้อีก เกลือขึ้นราคาไปจนหน้าฝน และคนขายเกลือเจ้าใหม่ไม่เคยทอนเงินให้{name}ครบสักครั้ง
      effects: { gold: 3, world: { gods: 1 }, alignment: { moral: -1 }, flags: [told_the_white_cloaks_the_road] }
    - id: show_the_horned_road
      label: บอกชื่อบ้านคนมีเขาตามรายทางที่รับเด็กได้
      requires: { flag: race_tiefling }
      text: |
        {name}ไม่ได้ให้ที่พัก ให้ชื่อคนสามคนตามรายทาง กับคำที่ต้องพูดเมื่อไปถึงประตูบ้านพวกนั้น ผู้หญิงที่อุ้มเด็กคนเล็กสุดจ้องตอเขาของ{name}ตลอดเวลาที่ฟัง แล้วถามว่าโตขึ้นจะเจ็บไหม {name}ตอบว่าเจ็บตอนคนอื่นเห็นมากกว่า

        ก่อนไป หล่อนถอดหมวกผ้าของลูกออกต่อหน้าคนนอกบ้านเป็นครั้งแรก ยื่นให้{name}ดู แบบคนเอาของที่ซื้อมาไปให้คนรู้ราคาตี
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [showed_the_families_the_horned_road] }

# ---------- 361 ปีป้อมสาม ----------
- id: adult.world_third_fort
  stage: adult
  weight: 500
  must: true
  mark: ปีป้อมสาม
  when:
    age: [16, 130]
    year: [361, 362]
    not_location_tag: ashland
  text: |
    ข่าวมาถึงก่อนคนอพยพสองวัน คืนหนึ่งต้นหน้าหนาว แนวหินผนึกขาดระหว่างป้อมสองกับป้อมสี่ ป้อมสามแตกก่อนรุ่ง หมาเถ้าออกมาเป็นฝูง ทหารเถ้าเดินเป็นแถวตามทางถ่านมาทางตะวันตก ควันเดินตามหลัง คนเล่าข่าวเล่าได้เท่านี้แล้วขอน้ำกิน มือที่รับกระบวยสั่นจนน้ำหกครึ่งหนึ่ง

    แล้วคนอพยพก็มาถึง เดินมาเป็นสาย ลากเลื่อน เข็นรถ อุ้มไก่ ส่วนมากมีเขา คนในถิ่นของ{name}ออกมายืนดูจากหลังรั้ว

    ที่มาถึงพร้อมกันคือคนผูกด้ายแดงที่ข้อมือ พวกนี้ไม่ซ่อนตัวอีกแล้ว ตั้งหม้อซุปข้างทาง ตักให้ทุกคนที่ยื่นชาม และแจกถ่านก้อนเท่ากำปั้นเด็ก ถ่านที่ไม่เคยมอด บอกว่าวางไว้บนธรณีประตูแล้วฝูงของข้างในจะเดินผ่านบ้านนั้นไป คืนที่สามมีคนในถิ่นบอกว่าได้ยินเสียงหอน อีกคนบอกว่าเป็นลม ทั้งสองคนลงกลอนประตูเร็วเท่ากัน
  choices:
    - id: join_the_watch
      label: ลงชื่อเข้าเวรยามของถิ่น
      text: |
        เวรยามของถิ่นไม่มีอาวุธพอสำหรับทุกคน {name}ได้ตะเกียงหนึ่งดวง ฆ้องหนึ่งใบ กับที่นั่งบนถังคว่ำตรงปากทาง หน้าที่คือตีฆ้องเมื่อเห็นอะไรที่เดินไม่เหมือนคน คืนแรกตีไปสองครั้ง ครั้งหนึ่งเป็นวัวหลุด อีกครั้งเป็นคนเมา

        คืนที่เก้ามีอะไรบางอย่างยืนอยู่ตรงที่แสงตะเกียงไปไม่ถึง สูงเท่าลูกวัว ไม่ขยับ {name}ตีฆ้องจนแขนล้า คนทั้งถิ่นออกมาพร้อมคบไฟ ตรงนั้นเหลือแต่รอยเท้าที่ขอบไหม้เป็นวง เวรยามคืนถัดไปมีคนมาลงชื่อเพิ่มอีกสิบเจ็ดคน
      effects: { stats: { CON: 1 }, world: { gods: 1 }, flags: [stood_watch_in_the_fort_year] }
    - id: take_in_a_family
      label: เปิดประตูรับคนอพยพหนึ่งครอบครัว
      text: |
        ครอบครัวที่{name}รับไว้มีสี่คนกับแพะหนึ่งตัว พ่อเป็นคนขุดถ่าน นิ้วดำถึงโคน แม่ไม่ยอมนั่งเก้าอี้จนกว่า{name}จะนั่งก่อน ลูกสองคนมีเขา คนเล็กฟันน้ำนมยังหลอ กินข้าวเสร็จแล้วเอาชามไปล้างเองโดยไม่มีใครบอก คืนแรกทั้งสี่คนนอนเรียงกันบนพื้นทั้งที่มีฟูกให้ รองเท้าไม่ถอด

        ครอบครัวนี้อยู่จนหิมะละลาย ก่อนไป คนเป็นพ่อซ่อมบานประตูที่ฝืดมาตั้งแต่ก่อนพวกเขามาถึง ซ่อมรั้ว ซ่อมถังน้ำ แล้วยังเดินหาว่ามีอะไรให้ซ่อมอีก แพะตัวนั้นทิ้งไว้ให้ ไม่ยอมเอาคืน
      effects: { gold: -2, stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [took_in_ash_refugees] }
    - id: take_the_door_coal
      label: รับถ่านเฝ้าประตูจากคนด้ายแดง (ของแบบนี้ติดตัวไปนาน)
      requires: { not_traits: [curse_star_marks] }
      text: |
        หญิงผูกด้ายแดงวางถ่านลงในมือ{name}เอง ก้อนเท่ากำปั้นเด็ก อุ่นแบบหินที่ตากแดดมาทั้งวัน หล่อนบอกแค่ว่าต้องวางด้วยมือตัวเอง แล้วอย่าย้าย ไม่ได้ขออะไรตอบแทน ไม่ได้ถามชื่อ ตอนเดินกลับไปที่หม้อซุป หล่อนพูดประโยคเดียวกับที่พูดกับคนอพยพทุกคน เจ้าของบ้านกำลังกลับมา คนที่เปิดประตูรับไม่ต้องกลัวหมาของเขา

        หน้าหนาวนั้นฝูงผ่านถิ่นสองคืน เช้าขึ้นมารอยเท้าขอบไหม้เดินอ้อมธรณีประตูบ้าน{name}เป็นครึ่งวงกลม ห่างเท่ากันทุกรอย บ้านติดกันเสียแพะไปทั้งคอก ฝ่ามือข้างที่วางถ่านอุ่นอยู่อย่างนั้นจนสิ้นฤดู จุ่มน้ำในบ่อก็ไม่หาย
      effects: { marks: { brand: 1 }, world: { demon: 2 }, flags: [set_a_door_coal] }
    - id: bar_the_door
      label: ลงกลอน ไม่รับคน ไม่รับถ่าน
      text: |
        {name}ตอกไม้ขวางประตูหลังเพิ่มอีกชั้น ย้ายถังน้ำเข้าในบ้าน และเลิกออกไปไหนหลังตะวันตก คนอพยพเคาะประตูสามครั้งในสัปดาห์แรก ไม่มีครั้งไหนเคาะซ้ำ คนด้ายแดงไม่เคยเคาะเลย เดินผ่านแล้วดูที่ธรณีประตูทีหนึ่งเท่านั้น

        คืนที่ฝูงผ่าน มีอะไรมาดมที่ร่องใต้ประตูนานจนไม้ขวางอุ่น แล้วก็ไป เช้าขึ้นมาไม้ธรณีมีรอยไหม้เป็นทางยาวเท่าฝ่ามือ {name}ขัดออกไม่หมด
      effects: { flags: [barred_the_door_in_the_fort_year] }
    - id: stand_before_the_pack
      label: ออกไปยืนที่ปากทางเองในคืนที่ฝูงมา
      requires: { trait: curse_brand }
      text: |
        คนอพยพเล่ากันมาตลอดทางว่าฝูงเดินอ้อมคนบางคน {name}ถือตะเกียงออกไปยืนตรงปากทางคนเดียว เวรยามทั้งถิ่นยืนอยู่ข้างหลังห่างออกไปยี่สิบก้าว ไม่มีใครเข้ามาใกล้กว่านั้น

        ฝูงมาตอนใกล้รุ่ง ตัวหน้าหยุดก่อนถึงแสงตะเกียง ตัวอื่นหยุดตาม ยืนกันอยู่อย่างนั้นจนตราของ{name}ร้อนจนต้องกัดฟัน แล้วทั้งฝูงก็เลี้ยวออกไปทางทุ่ง เช้านั้นมีคนเอาขนมปังมาวางไว้หน้าบ้าน{name}เก้าก้อน ไม่มีใครเคาะประตูบอกว่าเป็นของใคร
      effects: { stats: { CHA: 1 }, flags: [stood_before_the_pack] }

- id: adult.world_third_fort_ashland
  stage: adult
  weight: 500
  must: true
  mark: ปีป้อมสาม
  when:
    age: [16, 130]
    year: [361, 362]
    location_tag: ashland
  text: |
    คืนนั้นคนแดนเถ้าตื่นพร้อมกันทั้งถิ่นโดยไม่มีใครปลุก พื้นสั่นครั้งเดียว สั้น เหมือนมีคนปิดประตูบานใหญ่อยู่ใต้ดิน แล้วแตรของป้อมก็ดังขึ้น เสียงที่ทุกคนรู้ว่ามี แต่ไม่เคยมีใครได้ยิน แนวหินขาดระหว่างป้อมสองกับป้อมสี่ ป้อมสามแตกก่อนรุ่ง

    ตอนสาย ทหารเถ้าเดินเป็นแถวผ่านทางถ่านหน้าถิ่นของ{name}ไปทางตะวันตก ไม่เหลียวดูบ้านไหน หมาเถ้าวิ่งเลาะสองข้างแถว ตัวหนึ่งหยุดดมรั้ว แล้ววิ่งตามฝูงไป ควันเดินมาเป็นอย่างสุดท้าย ช้า ต่ำ เลียพื้น

    วงบ่อน้ำประชุมกันทั้งที่ควันยังไม่จาง ครึ่งหนึ่งจะขนของขึ้นเลื่อนไปตามแนวรางให้ถึงคาร์ดิน อีกครึ่งจะอยู่ คนผูกด้ายแดงสามคนมานั่งที่ขอบวงตั้งแต่เมื่อไรไม่มีใครเห็น วางถ่านก้อนเท่ากำปั้นเด็กเรียงไว้บนผ้า บอกว่าใครอยู่ก็เอาไปวางที่ธรณีประตู เจ้าของบ้านกำลังกลับมา คนที่เปิดประตูรับไม่ต้องกลัวหมาของเขา
  choices:
    - id: hold_the_well
      label: อยู่เฝ้าบ่อกับคนที่ไม่ไป
      check: { stat: CON, dc: 13 }
      success:
        text: |
          คนที่อยู่มีสิบเก้าบ้าน แบ่งเวรกันเฝ้าบ่อคืนละสี่คน อาวุธคือจอบ ขวานผ่าฟืน กับตะเกียงที่แขวนไว้สี่มุมบ่อ {name}ได้เวรหัวค่ำ ได้เห็นฝูงผ่านมาหกคืนตลอดหน้าหนาว ทุกคืนหยุดดูที่ขอบแสง แล้วไปต่อ

          คนของป้อมสี่ขี่ม้ามาดูตอนหิมะละลาย นับบ้านที่ยังมีควันขึ้นจากปล่อง จดชื่อคนเฝ้าบ่อลงสมุด แล้วทิ้งหน้าไม้ไว้ให้สองคัน ลูกดอกสิบสองดอก บอกว่าของป้อมมีเท่านี้ที่แบ่งได้
        effects: { stats: { CON: 1 }, world: { gods: 1 }, reputation: { wardens: 1 }, flags: [held_the_well_in_the_fort_year] }
      failure:
        text: |
          เวรของ{name}ตกคืนที่ฝูงไม่ได้ผ่านไปเฉยๆ ตัวหนึ่งเดินเข้ามาถึงขอบบ่อ {name}ฟาดด้วยด้ามจอบได้ทีเดียว ด้ามไหม้คามือ ตัวนั้นถอย แต่อีกตัวมาถึงข้างหลังแล้ว คนเฝ้าเวรอีกสามคนช่วยกันลากออกมาได้ทัน

          แผลที่น่องขอบไหม้เป็นวง หายช้ากว่าแผลมีดสามเท่า ตลอดหน้าหนาวที่เหลือ{name}เฝ้าเวรจากเก้าอี้ ถือฆ้องแทนจอบ
        effects: { hp: -1, reputation: { wardens: 1 }, flags: [held_the_well_in_the_fort_year] }
    - id: carry_for_the_forts
      label: ไปกับรถเข็นน้ำและเสบียงขึ้นป้อมสี่
      text: |
        ทางขึ้นป้อมสี่ใช้เวลาครึ่งวัน {name}ไปกับรถเข็นสามคัน ถังน้ำ ขนมปังแข็ง ผ้าพันแผลที่ฉีกจากผ้าปูที่นอนของทั้งถิ่น ผู้เฝ้าผนึกที่ประตูป้อมไม่ได้นอนมาสามคืน รับของโดยไม่ถามว่าใครส่ง แล้วถามกลับคำถามเดียว ข้างล่างยังมีคนอยู่กี่บ้าน

        {name}ขึ้นลงทางนั้นทุกสัปดาห์จนสิ้นหน้าหนาว เที่ยวสุดท้ายมีคนบนกำแพงตะโกนเรียกชื่อ{name}ลงมาก่อนรถเข็นจะถึงประตู ทั้งป้อมรู้จักชื่อนี้แล้ว รวมทั้งคนที่ยังไม่เคยเห็นหน้า
      effects: { world: { gods: 1 }, reputation: { wardens: 2 }, flags: [carried_for_the_forts] }
    - id: leave_along_the_rail
      label: ขนของขึ้นเลื่อน ไปตามแนวรางให้ถึงคาร์ดิน (ย้ายออกจากแดนเถ้า)
      text: |
        {name}เอาไปได้เท่าที่เลื่อนหนึ่งคันรับไหว ที่เหลือปิดประตูทิ้งไว้ ไม่ได้ลงกลอน คนที่อยู่จะได้เข้าไปเอาของที่ใช้ได้ สายคนเดินตามแนวรางยาวจนมองไม่เห็นหัวแถว ทุกคืนมีคนนับว่าเมื่อเช้าออกเดินกี่คน ทุกเช้าไม่มีใครถามผล

        ที่ชุมทางคาร์ดิน เสมียนตั้งโต๊ะรับคนอพยพวันละขบวน ถามชื่อ ถามถิ่น ถามว่ามีเขาไหม แล้วชี้ให้ไปเข้าแถวตามคำตอบข้อสุดท้าย คืนแรก{name}นอนในโรงเก็บถ่านที่ว่างเพราะถ่านแพงจนไม่มีใครซื้อมาเก็บ หลังคาไม่รั่ว พื้นยังอุ่น
      effects: { location_tag: kardin, flags: [left_the_ashland_in_the_fort_year, moved_to_kardin] }
    - id: take_the_door_coal
      label: รับถ่านเฝ้าประตูจากคนด้ายแดง แล้วอยู่ต่อ (ของแบบนี้ติดตัวไปนาน)
      requires: { not_traits: [curse_star_marks] }
      text: |
        {name}หยิบเองจากผ้า ไม่มีใครยื่นให้ คนด้ายแดงที่นั่งใกล้สุดบอกเพียงว่าต้องวางด้วยมือตัวเอง แล้วอย่าย้าย ถ่านอุ่นแบบหินตากแดด วางลงบนธรณีประตูแล้วไม่กลิ้ง

        แถวทหารเถ้าผ่านหน้าบ้านอีกสี่หนในหน้าหนาวนั้น หนหนึ่งมีตัวที่เดินท้ายแถวหยุดตรงประตูบ้าน{name} หันมาทั้งตัว ยืนอยู่ชั่วต้มน้ำเดือด แล้วเดินตามแถวไป บ้านที่ไม่มีถ่านในซอยเดียวกันเหลือแต่ผนังสามด้าน ฝ่ามือข้างที่วางถ่านอุ่นอยู่อย่างนั้นจนสิ้นฤดู จุ่มน้ำในบ่อก็ไม่หาย
      effects: { marks: { brand: 1 }, world: { demon: 2 }, flags: [set_a_door_coal] }

# ---------- 367 ปีเรือไม่กลับ ----------
- id: adult.world_lost_fleet
  stage: adult
  weight: 500
  must: true
  mark: ปีเรือไม่กลับ
  cast:
    kid: { kin: [child], min_age: 17, max_age: 45, optional: true }
  when:
    age: [16, 130]
    year: [367, 368]
  text: |
    กองเรือสำรวจออกจากหอท่าเวนทราสในวันฟ้าเปิดวันแรกของฤดูใบไม้ผลิ เรือเหาะห้าลำ ลำหน้าชื่อตะเกียงเช้า ขึ้นไปดูให้เห็นกับตาว่าเส้นดาวที่พาดฟ้าทางตะวันออกเฉียงเหนือคืออะไร คนทั้งแผ่นดินเรียกเส้นนั้นว่ารอยมาหลายปีแล้ว คืนที่เก้า คนข้างล่างที่ยังไม่นอนเห็นจุดห้าจุดเข้าไปในรอยทีละจุด

    ไม่มีลำไหนกลับลงมา วันที่สิบ รอยเห็นได้ตอนเที่ยง เป็นเส้นซีดบนฟ้าสีคราม คนในถิ่นของ{name}เลิกแหงนหน้าเวลาเดิน หมวกปีกกว้างขายหมดทั้งตลาด

    หลังจากนั้นฝนเค็มตกลงมาพร้อมของ แผ่นไม้ เชือก รองเท้าบูตข้างเดียว ไม่มีศพ ปลายปีคนรับสมัครของราชนาวีมาถึงทุกที่ที่รางไปถึง ตอกประกาศรับคนขึ้นกองเรือชุดสอง เบี้ยสามเท่า ไม่ถามอายุ ไม่ถามถิ่น
  choices:
    - id: sign_on
      label: ลงชื่อขึ้นกองเรือชุดสองเอง (ของแบบนี้ติดตัวไปนาน)
      requires: { not_traits: [curse_brand] }
      text: |
        คนรับสมัครไม่ถามอายุจริงตามประกาศ ถามแค่ว่าผูกเงื่อนเป็นไหม กับกลัวที่สูงไหม เรือสี่ลำขึ้นไปพร้อมกัน {name}อยู่ลำที่สาม ได้งานถือสมุดจดว่าใครเห็นอะไรตอนไหน จดได้หน้าครึ่ง มีแสง มีเสียงเหมือนคนเคาะท้องเรือจากข้างนอก มีรสเค็มในอากาศ แล้วนายเรือสั่งกลับ ทุกคนบนเรือยืนยันตรงกันว่าอยู่ข้างบนคืนเดียว

        ข้างล่างผ่านไปสี่สิบวัน เรือกลับลงมาสามลำ ท้องเรือเปียกน้ำเค็ม เบี้ยจ่ายครบสามเท่า {name}กลับถึงบ้านพร้อมเหรียญเต็มถุงกับจุดใสใต้ผิวที่ตอนขึ้นเรือยังไม่มี เรียงกันเป็นแถวตามแนวที่มือจับราวเรือ
      effects: { gold: 6, marks: { star: 1 }, world: { star: 1 }, flags: [flew_with_the_second_fleet] }
    - id: sign_on_branded
      label: ลงชื่อขึ้นกองเรือชุดสอง ในแถวของคนมีตรา
      requires: { trait: curse_brand }
      text: |
        คนรับสมัครตั้งโต๊ะรับคนมีตราแยกไว้อีกแถว เบี้ยเท่ากัน งานไม่เท่า คนแถวนี้ได้ยืนหัวเรือ {name}อยู่ลำที่สาม ยืนอยู่ตรงนั้นตลอดเวลาที่คนอื่นหมอบ เห็นแสง ได้ยินเสียงเหมือนคนเคาะท้องเรือจากข้างนอก ได้รสเค็มในอากาศ ไม่มีอะไรหันมาทาง{name}เลยสักอย่าง แล้วนายเรือสั่งกลับ

        ข้างล่างผ่านไปสี่สิบวัน คนบนเรือบอกว่าคืนเดียว เรือกลับลงมาสามลำ ตอนรับเบี้ย เสมียนถามทุกคนว่าเห็นอะไร พอถึง{name}เขาถามอีกคำถามหนึ่ง มีอะไรเห็น{name}บ้างไหม แล้วจดคำตอบลงสมุดอีกเล่ม
      effects: { gold: 6, stats: { CON: 1 }, flags: [flew_with_the_second_fleet, stood_the_bow_unseen] }
    - id: let_the_child_sign
      label: "ยอมให้{kid}ลงชื่อ แล้วขอคนรับสมัครให้จัดลงลำที่นายเรือเก่าที่สุด (เสี่ยงเสียลูก)"
      requires: { cast: [kid] }
      check: { stat: CHA, dc: 11 }
      success:
        text: |
          คนรับสมัครฟัง{name}จนจบ ดูถุงยาเส้นที่วางมาบนโต๊ะ แล้วย้ายชื่อ{kid}ไปลำที่สาม ลำของนายเรือที่ขึ้นลงมาแล้วสามสิบฤดู วันที่{kid}ออกจากบ้าน {name}ยืนส่งที่ประตูจนลับทาง

          รายชื่อคนที่กลับมาตอกตามหลังเรือมาถึงถิ่นช้ากว่าตัวคน {kid}เดินเข้าบ้านมาก่อนประกาศ ถือถุงเบี้ย ผมไม่ยาวขึ้นสักนิ้ว พูดถึงวันที่ออกจากบ้านว่าเมื่อวานซืน และยืนงงอยู่หน้าต้นถั่วที่รั้ว เพราะมันขึ้นถึงหลังคาแล้ว
        effects: { gold: 4, people: [{ id: "@kid", closeness: 1 }], flags: [sent_a_child_to_the_second_fleet] }
      failure:
        text: |
          คนรับสมัครฟัง{name}จนจบ บอกว่าลำนั้นเต็มแล้ว ทุกบ้านขอลำนั้น ชื่อ{kid}อยู่ลำที่สี่ตามลำดับที่ลงชื่อ วันที่{kid}ออกจากบ้าน {name}ยืนส่งที่ประตูจนลับทาง

          สี่สิบวันต่อมาเรือลงมาสามลำ รายชื่อที่ตอกตามมาถึงถิ่นมีสามแถว {name}อ่านสามรอบ ราชนาวีจ่ายเบี้ยของลำที่สี่ให้ครบทุกบ้านภายในสัปดาห์ สามเท่าตามประกาศ กับกระดาษหนึ่งแผ่นที่ใช้คำว่ายังไม่กลับ ไม่ได้ใช้คำอื่น
        effects: { gold: 4, people: [{ id: "@kid", dies: true }], flags: [sent_a_child_to_the_second_fleet, lost_a_child_to_the_sky] }
    - id: keep_the_house_down
      label: เติมน้ำมันตะเกียงที่วิหารให้คนบนเรือ แล้วไม่ให้ใครในบ้านลงชื่อ
      text: |
        วิหารตั้งตะเกียงไว้ห้าดวงตั้งแต่วันที่สิบ ดวงละลำ {name}เติมน้ำมันให้ดวงที่ไม่มีใครเติม แล้วกลับบ้านไปดึงประกาศรับคนที่มีมือดีเอามาเสียบไว้ที่รั้ว ใช้กระดาษนั้นจุดเตา

        ชุดสองขึ้นไปโดยไม่มีชื่อจากบ้านนี้ ตะเกียงห้าดวงในวิหารยังติดอยู่จนสิ้นปี แล้วมีคนเอามาตั้งเพิ่มอีกหนึ่งดวง ไม่มีใครถามว่าของลำไหน
      effects: { world: { gods: 1 }, flags: [kept_the_house_on_the_ground] }
    - id: sell_what_fell
      label: เก็บของที่ตกลงมากับฝนไปขาย
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          {name}สวมถุงมือหนังสองชั้นตามที่คนเก็บของเก่าบอกต่อกันมา เก็บได้เชือกหนึ่งขด แผ่นไม้ไอเลธสองแผ่น กับห่วงทองเหลืองที่ยังเงาอยู่ พ่อค้าที่รับซื้อไม่ถามว่ามาจากไหน ชั่งแล้วจ่ายตามน้ำหนัก บวกให้อีกหน่อยสำหรับของที่ยังเค็ม

          ตลาดของที่ตกจากฟ้าอยู่ได้สองฤดู แล้วราคาก็ตก เพราะของตกลงมามากกว่าคนที่อยากได้
        effects: { gold: 4, flags: [sold_what_fell_with_the_rain] }
      failure:
        text: |
          ของชิ้นใหญ่ที่สุดที่{name}เก็บได้คือระฆังทองเหลืองใบเท่าฝ่ามือ มีชื่อเรือสลักอยู่ที่ขอบ พ่อค้ารับซื้อพลิกดูแล้ววางคืน บอกว่าของมีชื่อไม่มีใครกล้ารับ ในแถวข้างหลัง{name}มีหญิงคนหนึ่งยืนอยู่ หล่อนอ่านชื่อที่ขอบระฆังออกเสียง แล้วยื่นมือออกมา

          {name}ขายได้แต่เชือก ระฆังใบนั้นไปกับหญิงคนนั้น ไม่มีใครเอ่ยเรื่องราคา
        effects: { gold: 1, flags: [sold_what_fell_with_the_rain] }

# ---------- 373 ปีสองเมือง ----------
- id: adult.world_two_cities
  stage: adult
  weight: 500
  must: true
  mark: ปีสองเมือง
  when:
    age: [16, 130]
    year: [373, 374]
  text: |
    คืนหนึ่งของปีนี้ ปีกเทาขนหีบของห้องคลังขึ้นขบวนรถไฟไปคาร์ดิน เช้าวันต่อมามีประกาศว่าภาษีของอาณาจักรส่งที่ถนนสมุดบัญชี ปีกขาวยังอยู่บนเนินวิหารของเวนทราส และประกาศว่าไม่มีอะไรย้ายไปไหนทั้งนั้น คนเรียกคืนนั้นว่าคืนขบวนคลัง และเรียกสองฝ่ายตามของที่ใช้เดินเมือง เมืองน้ำค้างกับเมืองถ่าน

    สองเมืองไม่ได้รบกัน ทหารของทั้งคู่ต้องเก็บไว้กันของที่ออกมาจากแนวหิน ที่ส่งออกมาแทนคือคนเดินสมุด ไม่ใช่ข้าหลวง เป็นคนรับจ้างที่ได้ค่าหัวตามจำนวนชื่อ คนของตราขาวมาถึงถิ่นของ{name}ก่อน สามวันต่อมาคนของตราเทาก็มา ทั้งสองคนกางโต๊ะห่างกันสิบก้าว พูดเรื่องเดียวกันแทบทุกคำ ใครลงชื่อกับเมืองไหน คำร้อง ภาษี และของที่ขาย ไปที่เมืองนั้น

    คนในถิ่นยืนอยู่ตรงกลางระหว่างสองโต๊ะ ไม่มีใครอยากเป็นคนแรกที่เดินไปทางใดทางหนึ่ง
  choices:
    - id: sign_white
      label: ลงชื่อในสมุดตราขาว
      text: |
        คนเดินสมุดของตราขาวให้{name}ลงชื่อด้วยหมึกดำ แล้วให้แตะตะเกียงดวงเล็กที่ตั้งอยู่บนโต๊ะเป็นพยาน เขาว่าศาล เรือ และวิหารยังอยู่ที่เดิม เมืองที่มีสามอย่างนี้คือเมืองหลวง เมืองที่มีแต่หีบเงินเป็นได้แค่ร้านรับจำนำ

        พอ{name}เดินกลับ คนของตราเทาที่โต๊ะอีกฝั่งจดอะไรลงสมุดของตัวเองหนึ่งบรรทัด ทั้งที่{name}ไม่ได้เดินผ่านไปทางนั้นเลย
      effects: { world: { gods: 1 }, reputation: { lamp_church: 1, belek_bank: -1 }, flags: [pledged_to_the_white_seal] }
    - id: sign_grey
      label: ลงชื่อในสมุดตราเทา
      text: |
        คนเดินสมุดของตราเทาไม่ได้พูดเรื่องเมืองหลวง เขาเลื่อนเหรียญมาให้สองเหรียญก่อน{name}จะจับปากกา บอกว่าเป็นค่าเสียเวลา เมืองที่จ่ายเบี้ยทหารได้คือเมืองที่กันหมาเถ้าได้ ที่เหลือเป็นเรื่องของคนชอบเถียง ในสมุดมีช่องให้เขียนด้วยว่าติดหนี้ธนาคารอยู่เท่าไร ช่องนั้นเขากรอกให้เองโดยไม่ต้องถาม

        ตอน{name}เดินกลับ คนของตราขาวเก็บตะเกียงดวงเล็กบนโต๊ะลงกล่อง พอ{name}พ้นไปแล้วจึงเอาออกมาตั้งใหม่
      effects: { gold: 2, reputation: { belek_bank: 1, lamp_church: -1 }, flags: [pledged_to_the_grey_seal] }
    - id: sign_neither
      label: ไม่ลงชื่อกับใคร แล้วหาทางให้ทั้งสองสมุดลืมบ้านนี้
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}รอจนคนเดินสมุดทั้งสองคนไปกินข้าวเที่ยงที่โรงเตี๊ยมเดียวกัน คนละโต๊ะ แล้วเดินไปบอกเด็กเฝ้าโต๊ะของแต่ละฝั่งว่าบ้านนี้ลงชื่อกับอีกฝั่งไปแล้ว เด็กทั้งสองคนขีดบ้านของ{name}ออกจากรายการที่ต้องตาม ไม่มีใครเอาสมุดมาเทียบกัน เพราะสองโต๊ะนี้ไม่พูดกัน

          ปีนั้นไม่มีใครมาเก็บอะไรจากบ้าน{name}สักรอบ บ้านอื่นโดนสองรอบ
        effects: { stats: { WIS: 1 }, gold: 2, flags: [signed_neither_book] }
      failure:
        text: |
          {name}บอกโต๊ะตราขาวว่าลงกับตราเทาแล้ว บอกโต๊ะตราเทาว่าลงกับตราขาวแล้ว เย็นนั้นคนเดินสมุดสองคนกินข้าวที่โรงเตี๊ยมเดียวกัน คนละโต๊ะ แต่เด็กยกสำรับเป็นคนเดียวกัน และเป็นเด็กช่างเล่า

          รุ่งเช้าชื่อของ{name}อยู่ในสมุดทั้งสองเล่ม ลายมือคนเดินสมุดเอง ปีนั้นมีคนมาเก็บจากบ้านนี้สองรอบ รอบละสี
        effects: { gold: -3, flags: [signed_neither_book] }
    - id: sign_both
      label: ลงชื่อทั้งสองสมุด แล้วขายของให้ทั้งสองเมือง
      text: |
        {name}ลงชื่อโต๊ะแรกตอนเช้า โต๊ะที่สองตอนบ่าย ลายมือเดียวกัน หมึกคนละสี คนเดินสมุดทั้งสองคนเห็น และทั้งสองคนไม่ทัก ค่าหัวคิดตามจำนวนชื่อ ไม่ได้คิดตามว่าชื่อนั้นซ้ำกับสมุดของใคร

        ตั้งแต่นั้นของที่{name}มีขายขึ้นเกวียนสองคัน คันหนึ่งไปทางน้ำค้าง คันหนึ่งไปทางถ่าน ราคาดีทั้งสองทาง เพราะแต่ละเมืองยอมจ่ายแพงกว่าเพื่อไม่ให้อีกเมืองได้ คนในถิ่นเรียก{name}ว่าคนสองตรา บางคนเรียกต่อหน้า
      effects: { gold: 4, alignment: { law: -1 }, flags: [sold_to_both_cities] }

# ---------- 379 คืนฟ้าเก่า ----------
- id: adult.world_old_sky_night
  stage: adult
  weight: 500
  must: true
  mark: คืนฟ้าเก่า
  cast:
    mate: { id: partner, optional: true }
    kid: { kin: [child], min_age: 8, optional: true, pick: eldest }
    pal: { bond: [friend], optional: true }
  when:
    age: [16, 130]
    year: [379, 380]
  text: |
    คืนหนึ่งปลายฤดูใบไม้ร่วง ดาวดวงใหม่ทุกดวงดับในชั่วอึดใจเดียว รอยที่พาดฟ้าหายไปด้วย คนที่ยืนอยู่นอกชายคาตอนนั้นเล่าตรงกันว่าไม่มีเสียง ไม่มีแสงวาบ เหมือนมีคนเป่าเทียนหมื่นเล่มด้วยลมเดียว

    ที่เหลืออยู่ข้างบนคือฟ้าแบบที่เพลงเก่าร้องถึง มืด และมีดาวน้อยจนนับได้ เสียงหึ่งเงียบไป คนที่อยู่กับเสียงนั้นมาทั้งชีวิตเอานิ้วแคะหูกันทั้งถิ่น ตะเกียงฟ้ายังติดด้วยน้ำค้างที่เหลือในถัง แสงเหลืองลงทีละน้อย

    ไม่มีใครฉลอง คนที่อายุมากพอจำคืนที่ดาวหรี่ได้ และจำได้ว่าหลังคืนนั้นไม่มีอะไรดีขึ้น ประตูทุกบานในถิ่นของ{name}เปิดอยู่ คนเดินไปหากัน ถือเก้าอี้ไปเอง
  choices:
    - id: sit_with_partner
      label: "นั่งกับ{mate}ที่ธรณีประตูจนสว่าง"
      requires: { cast: [mate] }
      text: |
        {mate}เอาผ้าห่มผืนเดียวออกมาคลุมสองคน ไม่ได้คุยเรื่องฟ้า คุยเรื่องรั้วที่ต้องซ่อม เรื่องใครลืมปิดเล้า เรื่องที่เถียงกันค้างไว้ตั้งแต่ปีไหนจำไม่ได้แล้วว่าใครเป็นฝ่ายถูก เถียงต่อจนจบ {mate}ยอมแพ้ แล้วบอกว่าที่จริงไม่ได้ยอม แค่ง่วง

        ตอนฟ้าเริ่มสาง ถ้วยสองใบบนธรณีประตูสั่นกระทบกันเอง เสียงใสเหมือนมีคนเคาะเรียก แล้วพื้นก็สั่นมาจากทางตะวันออก
      effects: { people: [{ id: "@mate", closeness: 1 }], flags: [last_night_with_partner] }
    - id: sit_with_child
      label: "ไปยืนดูฟ้ากับ{kid}"
      requires: { cast: [kid] }
      text: |
        {kid}ยังไม่นอน ยืนอยู่กลางลานอยู่ก่อนแล้ว {name}ชี้ให้ดูดาวที่เหลือ บอกชื่อได้สี่ดวง ชื่อที่ได้ยินมาจากคนรุ่นก่อนอีกที ไม่แน่ใจว่าถูกดวงหรือเปล่า {kid}ถามว่าตอน{name}เป็นเด็ก ฟ้าเป็นแบบนี้หรือ {name}ตอบว่าไม่ใช่ ไม่มีคนเป็นคนไหนเคยเห็นแบบนี้ ต่างคนต่างเพิ่งเห็นเท่ากัน

        ใกล้รุ่ง{kid}เอนหัวมาพิงไหล่{name}แบบที่ไม่ได้ทำมาตั้งแต่ตัวเท่าเอว ใบไม้แห้งบนลานขยับทั้งที่ไม่มีลม แล้วพื้นก็สั่นมาจากทางตะวันออก
      effects: { people: [{ id: "@kid", closeness: 1 }], flags: [last_night_with_child] }
    - id: sit_with_friend
      label: "ถือเก้าอี้ไปนั่งกับ{pal}"
      requires: { cast: [pal] }
      text: |
        {pal}ตั้งเหล้าไว้รอแล้วสองถ้วย บอกว่ารู้ว่าต้องมา สองคนนั่งไล่ชื่อคนที่รู้จักร่วมกันว่าใครยังอยู่ ใครไม่อยู่ ใครติดเงินใครแล้วไม่ได้ใช้ ไล่ไปถึงชื่อที่จำหน้าไม่ได้แล้วทั้งคู่ {pal}ว่าฟ้าแบบนี้ดูแล้วเหมือนบ้านที่ขนของออกหมดแล้ว กว้างกว่าที่คิด

        เหล้าหมดไหตอนไก่ขัน {pal}คว่ำถ้วยลงบนโต๊ะ ถ้วยเดินเองไปจนตกขอบ แล้วพื้นก็สั่นมาจากทางตะวันออก
      effects: { people: [{ id: "@pal", closeness: 1 }], flags: [last_night_with_friend] }
    - id: count_alone
      label: ขึ้นไปนับดาวคนเดียว
      text: |
        {name}เลือกช่องเดียวของฟ้า ระหว่างปล่องไฟกับสันหลังคาบ้านตรงข้าม นับได้สิบเก้าดวง นับซ้ำได้สิบเก้าดวง นับรอบที่สามช้าๆ ทีละดวง ได้สิบเก้าดวง ไม่มีดวงไหนขยับ ไม่มีดวงไหนเพิ่ม

        {name}นั่งอยู่กับตัวเลขที่ไม่เปลี่ยนจนขอบฟ้าทางตะวันออกเริ่มซีด กระเบื้องหลังคาแผ่นหนึ่งเลื่อนหลุดลงไปแตกข้างล่างโดยไม่มีใครแตะ แล้วพื้นก็สั่นมาจากทางนั้น
      effects: { stats: { WIS: 1 }, flags: [counted_the_old_sky_alone] }
    - id: sit_in_the_temple
      label: ไปนั่งในวิหารกับคนทั้งถิ่น
      text: |
        วิหารไม่เคยมีคนมากเท่านี้ในคืนที่ไม่ใช่วันฉลอง นักบวชไม่เทศน์ เดินเติมน้ำมันตะเกียงทีละดวง แล้วนั่งลงกับคนอื่นบนพื้น มีคนเริ่มร้องเพลงเก่าเรื่องฟ้าที่นับได้ ร้องผิดเนื้อ คนแก่ที่สุดในวิหารร้องแก้ให้ทีละท่อนจนจบเพลง

        ใกล้รุ่งเด็กหลับกันหมดแล้ว เปลวตะเกียงทุกดวงเอนไปทางเดียวกันทั้งที่ประตูปิด แล้วพื้นก็สั่นมาจากทางตะวันออก
      effects: { world: { gods: 1 }, flags: [last_night_at_the_temple] }
    - id: sleep_at_last
      label: ปล่อยให้ตัวเองหลับ
      requires: { marks: { star: [1, 3] } }
      text: |
        รอยใต้ผิวของ{name}มืดสนิทตั้งแต่ดาวดับ ไม่คัน ไม่อุ่น ไม่มีอะไรกระซิบที่ขอบหู {name}ล้มตัวลงนอนทั้งที่ยังใส่รองเท้า และหลับแบบที่ไม่ได้หลับมาตั้งแต่ก่อนมีรอย ไม่ฝัน ไม่ตื่นกลางดึกมาเขียนอะไร

        คนที่มาปลุกบอกว่าเขย่าอยู่นาน {name}ลืมตามาตอนที่ถ้วยน้ำข้างเตียงกำลังกระเพื่อมเป็นวง แล้วพื้นก็สั่นมาจากทางตะวันออก
      effects: { hp: 2, flags: [slept_through_the_old_sky_night] }
    - id: face_east
      label: นั่งหันหน้าไปทางตะวันออก ฟังว่าตราจะบอกอะไร
      requires: { trait: curse_brand }
      text: |
        คนอื่นแหงนดูฟ้า {name}ดูขอบฟ้า ตราร้อนขึ้นตั้งแต่ดาวดับ ร้อนแบบสม่ำเสมอ ไม่ใช่แบบที่เป็นเวลามีของข้างในอยู่ใกล้ คืนนี้ไม่มีอะไรอยู่ใกล้ มีแต่ทางตะวันออกทั้งทาง

        ไม่มีเสียงเรียก ไม่มีคำ {name}นั่งอยู่จนรู้ว่าไม่ต้องมีใครบอก ตอนฟ้าสางฝุ่นบนขื่อร่วงลงมาเป็นสาย แล้วพื้นก็สั่นมาจากทางนั้น
      effects: { world: { demon: 1 }, flags: [faced_east_on_the_last_night] }
