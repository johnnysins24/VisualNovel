# ชุด 3b–3c วัยผู้ใหญ่ อายุ 25 ถึง 40: เหตุการณ์ประจำสาย สายละ 4 เรื่อง
# 3b (25–32) คู่แข่งขึ้นหรือลงตามผลช่วง 3a กับใจกลางของสายในวัยนั้น
# 3c (33–40) ปิดเรื่องคู่แข่ง กับใจกลางของสายในวัยที่ร่างกายเริ่มไม่เหมือนเดิม
# เรื่องคู่แข่งเกิดได้กับทุกคนในสาย ประวัติเก่าแยกด้วย requires.flag
# flag ที่ตั้งให้ชุดถัดไป: <คู่แข่ง>_rose / _fell / _ally / _enemy ในช่วง 3b และ _saved / _died / _reconciled ในช่วง 3c

# ---------- นักรบ ----------
- id: adult.mid_warrior_kedra_first_blood
  stage: adult
  scene: tavern
  weight: 30
  when:
    age: [25, 32]
    class: warrior
  text: |
    เคดรามีกองรับจ้างเป็นของตัวเองแล้ว สิบเจ็ดคน ธงผ้าสีเทามีรอยดาบสามรอยพาดกลางผืน ปีนี้นางพากองเดินไปทุกเมืองบนเส้นทางขบวนเกวียน เมืองไหนมีคนที่ขึ้นชื่อเรื่องดาบ นางจะท้าคนนั้นสู้ถึงเลือดแรกด้วยดาบจริงต่อหน้าคนทั้งโรงเตี๊ยม ชนะครั้งหนึ่ง คนเมืองนั้นจะจ้างกองของนางไปอีกสิบปี

    คืนนี้นางเดินเข้ามาในโรงเตี๊ยมที่{name}นั่งกินข้าวเย็นอยู่ ผมยังตัดสั้นเหมือนทหาร รอยไฟไหม้ที่แขนขวาซีดลงจนเกือบกลืนไปกับผิว นางวางดาบลงบนโต๊ะของ{name}ข้างชามแกง แล้วบอกเจ้าของโรงเตี๊ยมให้ย้ายโต๊ะตัวอื่นไปชิดผนัง

    คนในกองของนางเข้ามายืนเรียงตามผนังทีละคน ไม่มีใครนั่ง
  choices:
    - id: fight_to_first_blood
      label: ลุกขึ้นสู้ถึงเลือดแรก ด้วยดาบจริง
      check: { stat: STR, dc: 14, foe: human }
      success:
        text: |
          ดาบจริงหนักกว่าดาบไม้ แต่นางยังฟันเร็วเท่าเดิม {name}รับได้ทุกครั้ง นับไม่ทัน จนนางถอยครึ่งก้าวเพื่อเปลี่ยนมือ ปลายดาบของ{name}เข้าไปในช่องนั้นพอดี เฉียดหลังมือนาง เลือดหยดแรกลงบนพื้นไม้ใกล้ขาโต๊ะ

          เคดราเช็ดหลังมือกับขากางเกง แล้วเก็บดาบเข้าฝัก เช้าวันต่อมาขบวนของนางออกจากเมืองโดยไม่ได้ปักธง พ่อค้าที่แอบวางเดิมพันข้าง{name}เมื่อคืนเอาเงินมาแบ่งให้สามเหรียญ
        effects: { stats: { STR: 1 }, gold: 3, flags: [kedra_fell] }
      failure:
        text: |
          นางไม่รอให้{name}ตั้งท่าเสร็จ ดาบของนางลงมาเฉียงจากซ้ายโดยที่ไม่มีอะไรบอกมาก่อน {name}รู้ตัวเมื่อเลือดอุ่นไหลลงมาเข้าตา ปลายดาบของนางเปิดคิ้วขวาไว้รอยหนึ่ง ยาวเท่านิ้วก้อย

          นางเช็ดดาบกับผ้าปูโต๊ะ บอกว่ารอยนั้นจะเป็นแผลเป็น ทุกครั้งที่{name}ก้มดูเงาตัวเองในถังน้ำจะได้นึกถึงกองของนาง เดือนต่อมาคนทั้งเมืองเรียกกองนั้นว่ากองเคดรา พ่อค้าที่จะจ้างคุมขบวนต้องต่อคิว
        effects: { hp: -2, stats: { CON: 1 }, flags: [kedra_rose, kedra_cut_brow] }
    - id: watch_her_shoulder
      label: สู้ด้วยดาบจริง จับตาเท้าซ้ายของนางแบบที่เคยชนะในลานโรงเตี๊ยม
      requires: { flag: beat_kedra }
      check: { stat: DEX, dc: 13, foe: human }
      success:
        text: |
          เท้าซ้ายของนางไม่บอกอะไรแล้ว นางแก้มันได้จริงอย่างที่ว่าไว้ แต่หลายปีที่ฝึกแก้เท้าทำให้ไหล่ขวาของนางยกขึ้นนิดหนึ่งทุกครั้งก่อนฟัน {name}เห็นไหล่นั้นตอนดาบลงมาครั้งที่สาม ครั้งที่สี่{name}ฟันสวนเข้าไปก่อน ปลายดาบแตะต้นแขนนาง เลือดซึมออกมาตามรอยผ้า

          เคดราหัวเราะเป็นครั้งแรกตั้งแต่เดินเข้ามาในโรงเตี๊ยม นางบอกว่าคราวนี้ไหล่ นางจะไปแก้อีก แล้วจะกลับมาใหม่ คืนนั้นคนในกองของนางพับธงผ้าเทาเก็บใส่ถุง เจ้าของโรงเตี๊ยมวางเหรียญสองเหรียญข้างชามแกงของ{name} บอกว่าเป็นค่าโต๊ะที่ไม่ต้องซ่อม
        effects: { stats: { DEX: 1 }, gold: 2, flags: [kedra_fell] }
      failure:
        text: |
          {name}จ้องเท้าซ้ายของนางจนลืมดูดาบ นางรู้ นางยกเท้าซ้ายหลอกขึ้นมาครั้งหนึ่ง แล้วฟันมาจากอีกทาง ปลายดาบลากผ่านต้นแขนของ{name}เป็นรอยตื้นยาวเท่าฝ่ามือ

          นางบอกว่านางแก้เท้าซ้ายมาตั้งแต่วันนั้น วันละพันครั้ง ขอบใจที่ยังจำได้ คืนนั้นนางเลี้ยงเหล้าทั้งโรงเตี๊ยมด้วยเงินของกอง ทุกจอกที่ยกขึ้นมีคนเอ่ยชื่อนาง
        effects: { hp: -2, flags: [kedra_rose] }
    - id: ask_to_join
      label: บอกนางว่าไม่สู้ แต่ขอเข้ากองของนางสักฤดู
      requires: { flag: lost_to_kedra }
      text: |
        เคดราเลิกคิ้ว แล้วนั่งลงบนม้านั่งตรงข้าม เทเหล้าให้{name}จอกหนึ่ง ถามว่าคนที่แพ้นางในลานโรงเตี๊ยมเมื่อหลายปีก่อน ตอนนี้ลุกขึ้นได้เร็วเท่าเดิมไหม {name}บอกว่าเร็วกว่าเดิม นางดื่มจอกของตัวเองจนหมด แล้วบอกว่าออกเดินทางตอนแดดขึ้น

        ฤดูนั้น{name}ขี่ม้าอยู่หางขบวนของกองเคดรา โจรตีขบวนสองครั้ง ทั้งสองครั้งตีหางขบวน ปลายฤดูนางจ่ายเงินก้อนสุดท้ายสี่เหรียญ ไม่ขาดสักเศษ แล้วบอกว่าปีหน้าถ้าอยากมาอีกให้มาเอง ไม่ต้องรอให้นางมาวางดาบบนโต๊ะ
      effects: { stats: { STR: 1 }, gold: 4, flags: [kedra_rose, rode_with_kedra] }
    - id: share_the_company
      label: ถามนางว่าขบวนยาวขนาดนั้นมีใครคุมหางขบวนแล้วหรือยัง
      requires: { flag: kedra_partner }
      text: |
        เคดรานิ่งไปครู่หนึ่ง แล้วหยิบดาบกลับไปจากโต๊ะ นางยังจำเรื่องนับเกวียนได้ ขบวนสิบสองเล่มต้องใช้คนสองคน กองสิบเจ็ดคนของนางก็ต้องใช้คนสองคนเหมือนกัน และคนที่นางให้คุมหางขบวนมาสามปีเพิ่งหนีไปพร้อมม้าสองตัว

        คืนนั้นทั้งสองนั่งวาดเส้นทางขบวนเกวียนลงบนโต๊ะด้วยปลายมีดจนเทียนหมดสองเล่ม ปีนั้นกองเคดรารับงานได้มากกว่าปีไหน {name}ได้ส่วนแบ่งสองเหรียญจากงานแรก และได้ชื่ออยู่ข้างชื่อนางบนสัญญาทุกฉบับต่อจากนั้น
      effects: { stats: { INT: 1 }, gold: 2, flags: [kedra_ally, kedra_rose] }
    - id: apologize_for_dust
      label: ขอโทษนางเรื่องฝุ่นที่เตะใส่หน้าเมื่อหลายปีก่อน
      requires: { flag: kedra_grudge }
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เคดรายืนนิ่งอยู่อย่างนั้นจนเจ้าของโรงเตี๊ยมเริ่มย้ายโต๊ะกลับที่เดิม แล้วนางก็หยิบดาบขึ้นจากโต๊ะเก็บเข้าฝัก นางบอกว่าตั้งแต่วันนั้นนางสอนคนในกองทุกคนให้หลับตาฝึกฟัน ฝึกจนฝุ่นเข้าตาก็ยังฟันตรงที่เสียงเท้าอยู่ ฝุ่นของ{name}ทำให้กองของนางดีขึ้น นางพูดประโยคนี้โดยไม่มองหน้า{name}

          คืนนั้นนางไม่ได้สู้กับใคร นางนั่งดื่มกับ{name}จนโรงเตี๊ยมปิด แล้วสั่งคนในกองให้หลับตาเดินกลับที่พักทุกคน
        effects: { alignment: { moral: 1 }, flags: [kedra_ally] }
      failure:
        text: |
          เคดราฟังแล้วบอกว่าคำขอโทษที่มาช้าหลายปีและมาตอนที่ดาบจริงวางอยู่บนโต๊ะ ฟังเหมือนคนกลัวดาบมากกว่าคนเสียใจ นางกวาดดาบลงจากโต๊ะ เดินออกจากโรงเตี๊ยมไปโดยไม่สู้

          ตั้งแต่ฤดูนั้น ทุกเมืองที่กองเคดราไปถึง นางจะเล่าเรื่องคนที่เตะฝุ่นใส่หน้านาง และไม่กล้าสู้ด้วยดาบจริง นางเล่าเก่ง คนชอบฟัง
        effects: { flags: [kedra_enemy, kedra_rose] }
    - id: decline
      label: ไม่สู้ ดาบจริงไม่ได้มีไว้ให้คนในโรงเตี๊ยมดู
      text: |
        {name}เลื่อนดาบของนางกลับไปทางนาง แล้วกินแกงต่อ เคดรายืนรออยู่ข้างโต๊ะ คนในโรงเตี๊ยมเริ่มหัวเราะทีละโต๊ะ ไม่ได้หัวเราะนาง หัวเราะเพราะไม่มีใครเคยเห็นคนกินข้าวต่อตอนที่เคดรามาถึง

        นางเก็บดาบแล้วบอกเจ้าของโรงเตี๊ยมให้จำไว้ว่า{name}ไม่สู้ เดือนต่อมาเพลงในโรงเตี๊ยมแถบนั้นมีท่อนใหม่เรื่องคนที่กินแกงต่อ ส่วนกองเคดราก็ได้งานคุมขบวนครบทุกเมืองบนเส้นทางเหมือนเดิม
      effects: { alignment: { moral: 1 }, flags: [kedra_rose, refused_kedra] }

- id: adult.mid_warrior_laundry_girl
  stage: adult
  weight: 30
  when:
    age: [25, 32]
    class: warrior
  text: |
    ลูกสาวหญิงซักผ้าที่ท่าน้ำมาเฝ้ารอ{name}ที่ประตูหลังทุกเช้ามาครึ่งเดือนแล้ว ชื่อมิลา อายุสิบสี่ ถือดาบไม้ที่ทำจากด้ามคราดหักทาสีดำ ปลายด้ามยังมีรูตะปูของซี่คราดเหลืออยู่สองรู นางบอกว่าอีกสองปีภาคีผู้เฝ้าผนึกจะเปิดรับคนอายุสิบหก นางจะไป นางขอให้{name}สอน

    แม่ของนางยืนดูอยู่ห่างๆ มือแดงจากน้ำด่าง ไม่ห้ามลูก แต่ก็ไม่ยิ้ม มิลาตั้งท่าให้ดูหนึ่งท่า ท่าที่จำมาจากการแอบดูทหารฝึกหน้าป้อม เท้าวางผิด ไหล่ยกสูงเกิน สายตาจ้องดาบของตัวเองแทนที่จะจ้องคน
  choices:
    - id: teach_the_stance
      label: สอนท่ายืนก่อน ทุกเช้าก่อนแดดขึ้น ไม่ให้จับดาบสักเดือน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          เดือนแรกมิลาไม่ได้แตะดาบเลย {name}ให้นางยืนย่อเข่าบนลานหินหลังบ้าน ยืนจนขาสั่น ล้ม แล้วยืนใหม่ {name}ยืนข้างๆ ทุกเช้า ไม่เคยตื่นสายสักวัน เดือนที่สองนางเริ่มฟันหุ่นฟาง เดือนที่สามนางทำ{name}ล้มได้ครั้งหนึ่ง เพราะ{name}เผลอมองไปทางอื่น

          มิลาไม่หัวเราะ นางยื่นมือมาดึง{name}ขึ้นจากพื้นแบบที่{name}สอนให้ทำกับคู่ซ้อมทุกคน แม่ของนางที่ยืนดูอยู่ห่างๆ เดินกลับไปที่ท่าน้ำก่อนใครจะหันไปเห็นหน้า
        effects: { stats: { STR: 1 }, flags: [trained_a_youth, trained_mila] }
      failure:
        text: |
          เช้าที่สิบสอง{name}ลุกจากเตียงไม่ไหว งานเมื่อคืนลากยาวจนเกือบสาง มิลายืนรออยู่ที่ประตูหลังจนแดดขึ้น วันต่อมานางมาอีก วันที่สามนางไม่มา

          ปลายเดือน{name}เดินผ่านท่าน้ำ เห็นนางฝึกฟันอยู่กับทหารแขนเหล็กคนหนึ่งที่รับสอนเด็กแลกกับเหล้า เท้าของนางยังวางผิดที่เดิม ทหารคนนั้นไม่ได้แก้ให้
        effects: { stats: { CON: 1 }, flags: [mila_other_teacher] }
    - id: teach_her_to_run
      label: สอนให้นางวิ่งหนีเป็นก่อน แล้วค่อยสอนฟัน
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          มิลาโกรธจนหน้าแดง นางมาเพื่อเรียนฟัน {name}พานางวิ่งขึ้นเนินหลังท่าน้ำทุกเช้า ให้นางบอกทางออกของตลาดทุกทางก่อนกินข้าว ให้นางนับคนในโรงเตี๊ยมก่อนนั่ง และบอกว่าประตูไหนใกล้ที่สุด

          ปลายปี นางวิ่งขึ้นเนินได้โดยไม่หยุด และบอกทางออกจากทุกที่ในเมืองได้ก่อน{name}จะถามจบ ดาบไม้ด้ามคราดพิงอยู่ข้างประตูหลังทั้งปี ฝุ่นจับหนาจนเห็นรอยนิ้ว วันที่นางหยิบมันขึ้นมาอีกครั้ง เท้าของนางวางเข้าที่เองโดยไม่มีใครบอก
        effects: { stats: { DEX: 1 }, flags: [trained_a_youth, trained_mila, taught_mila_to_run] }
      failure:
        text: |
          มิลาวิ่งตามได้สามเช้า เช้าที่สี่นางบอกว่าถ้าจะเรียนวิ่ง นางไปวิ่งตามเกวียนส่งน้ำค้างดาวก็ได้ ไม่ต้องตื่นมาวิ่งตาม{name}

          นางไปหาครูคนอื่น {name}ได้ยินจากแม่ของนางว่าเป็นทหารแขนเหล็กที่ท่าน้ำ สอนแต่ฟัน ไม่สอนอย่างอื่น
        effects: { flags: [mila_other_teacher] }
    - id: tell_first_kill
      label: เล่าเรื่องโจรคนแรกที่ฆ่าบนทางเขาให้นางฟังก่อน
      requires: { flag: first_man_killed }
      text: |
        {name}เล่าตั้งแต่ขวานตัดไม้ แขนเหล็กสนิมขึ้นตามข้อ ป้ายไม้ห้อยคอ ไปจนถึงลมหายใจสุดท้ายที่ออกมาเป็นเสียงเหมือนคนถอนใจ มิลานั่งฟัง ดาบไม้ด้ามคราดวางอยู่บนตักตลอด นางถามว่าตอนนั้นกลัวไหม {name}บอกว่าไม่ทันกลัว มากลัวทีหลัง กลัวทุกคืนอยู่ปีหนึ่ง

        นางกลับบ้านไปวันนั้น สามวันต่อมานางมายืนที่ประตูหลังอีก ดาบไม้ยังอยู่ในมือ นางบอกว่ายังจะไป แต่อยากให้{name}สอนส่วนที่กลัวทีหลังด้วย
      effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [trained_a_youth, trained_mila] }
    - id: send_her_home
      label: ให้แม่ของนางสามเหรียญ บอกให้ส่งมิลาไปฝึกงานช่างแทน
      requires: { min_gold: 3 }
      text: |
        แม่ของมิลารับเงินด้วยมือที่แดงจากน้ำด่าง ไม่ขอบคุณ ไม่ปฏิเสธ มิลาไม่ร้องไห้ นางหักดาบไม้ด้ามคราดกับเข่าตัวเองทีเดียว วางสองท่อนไว้หน้าประตูหลังของ{name} แล้วเดินกลับไปที่ท่าน้ำ

        สองปีต่อมา{name}เห็นนางยืนอยู่ในแถวคนที่รอขึ้นเกวียนรับคนของภาคีผู้เฝ้าผนึก ตัวสูงขึ้นจนเกือบเท่าคนข้างหน้า มือแดงเหมือนแม่ นางไม่ได้หันมาทาง{name}
      effects: { gold: -3, alignment: { law: 1 }, flags: [turned_away_youth] }

- id: adult.mid_warrior_kedra_cart
  stage: adult
  weight: 30
  when:
    age: [33, 40]
    class: warrior
  text: |
    เกวียนถ่านมารของโรงหลอมพลิกคว่ำบนสะพานหินกลางเมืองตอนเช้ามืด ล้อหลังหลุด เพลาเหล็กหักครึ่ง ถ่านก้อนดำที่มีแสงแดงอยู่ข้างในกลิ้งออกมากองเต็มสะพาน คนขับวิ่งหนีไปแล้ว ม้าลากสองตัวยังดิ้นอยู่ในสายรัด ทุกครั้งที่ม้าดิ้น ตัวเกวียนก็ทรุดลงอีกนิ้วหนึ่ง

    ข้างใต้ตัวเกวียนมีคนติดอยู่หนึ่งคน {name}จำเสียงได้ก่อนเห็นหน้า ทั้งเส้นทางขบวนเกวียนมีคนด่าม้าด้วยคำแบบนี้อยู่คนเดียว เคดรา หัวหน้ากองรับจ้างธงเทารอยดาบสามรอย ผมสั้นของนางแซมเทาไปครึ่งหัวแล้ว ขาทั้งสองข้างอยู่ใต้กระดานพื้นเกวียน

    นางบอกให้{name}อย่ามุดเข้ามา ถ่านมารที่แตกส่งควันร้อน คนที่สูดเข้าไปมากจะโมโหจนลืมว่ากำลังทำอะไรอยู่
  choices:
    - id: crawl_under
      label: มุดลงไปใต้เกวียนที่กำลังทรุด เอาหลังดันให้นางคลานออก ถ้าเกวียนลงมาก็ตาย
      check: { stat: STR, dc: 8 }
      success:
        text: |
          {name}คลานผ่านก้อนถ่านที่ยังอุ่น ควันร้อนเข้าจมูกจนตาพร่า มือเริ่มอยากต่อยใครสักคน ใครก็ได้ {name}กัดฟันจนความอยากนั้นซาลง วางหลังกับกระดานพื้นเกวียน แล้วดันขึ้น เกวียนยกขึ้นได้แค่สองนิ้ว พอให้เคดราดึงขาออกมาทีละข้าง

          {name}คลานถอยออกมาหลังนาง เกวียนทรุดลงตรงที่{name}เคยนอนอยู่เมื่อครู่ ขาซ้ายของนางหักสองท่อน สามเดือนต่อมาคนในกองเอาดาบของนางมาให้ ใบดาบมีรอยบิ่นสามรอยตรงกับรอยบนธง นางเลิกคุมขบวนแล้ว ฝากมาบอกแค่ว่าดาบเล่มนี้ไม่เคยได้แขวนผนังมาสามสิบปี อย่าให้มาเริ่มที่บ้าน{name}
        effects: { hp: -2, stats: { STR: 1 }, items: [kedra_sword], flags: [kedra_saved, kedra_retired] }
      failure:
        text: |
          {name}ดันกระดานพื้นเกวียนขึ้นได้สองนิ้ว เคดราดึงขาออกมาได้ข้างหนึ่ง แล้วม้าตัวหนึ่งก็ดิ้นอีกครั้ง เพลาเหล็กที่หักครึ่งหลุดออกจากที่ เกวียนทั้งคันลงมาพร้อมกัน

          เคดราคลานออกมาได้ คนในเมืองยกเกวียนขึ้นได้ตอนสาย นางนั่งพิงราวสะพานอยู่ตรงนั้นจนคนเอาร่างของ{name}ขึ้นมาวางข้างนาง นางขอผ้าจากคนข้างๆ มาคลุมหน้า{name}เอง ด้วยมือข้างที่มีรอยไฟไหม้
        effects: { die: true, flags: [died_under_kedra_cart, kedra_saved] }
    - id: cut_and_chain
      label: ตัดสายรัดม้าก่อน แล้วหาโซ่กับวัวมาลากเกวียนขึ้นทางเดียว
      check: { stat: INT, dc: 13 }
      success:
        text: |
          เกวียนทรุดเพราะม้าดิ้น ไม่ใช่เพราะน้ำหนัก {name}ตัดสายรัดเส้นแรกให้ม้าที่ดิ้นแรงกว่าออกไปก่อน แล้วค่อยตัดเส้นที่สอง เกวียนหยุดทรุด คนขายถ่านที่หัวสะพานมีวัวลากสองตัว {name}ผูกโซ่กับเพลาด้านที่ยังไม่หัก ให้วัวดึงตามแนวราวสะพาน ไม่ใช่ดึงขึ้น

          เกวียนเลื่อนออกช้าๆ ทีละคืบ เคดราคลานออกมาเอง ขาซ้ายหัก นางด่าวัวสองตัวที่เพิ่งลากชีวิตนางออกมา แล้วด่า{name}ต่อว่าคิดช้า กว่าจะคิดออกก็เกือบสาย ปีต่อมาได้ข่าวว่านางเลิกคุมขบวน ไปเปิดลานสอนดาบที่เมืองท่า
        effects: { stats: { INT: 1 }, flags: [kedra_saved, kedra_retired] }
      failure:
        text: |
          สายรัดเส้นสุดท้ายขาดเร็วเกินไป ม้าตัวหนึ่งกระชากเกวียนไปข้างหน้าหนึ่งศอกก่อนวิ่งหนี เกวียนทรุดลงทั้งคัน เสียงด่าม้าข้างใต้หยุด

          ตอนวัวมาถึงพร้อมโซ่ ไม่มีอะไรต้องรีบแล้ว คนในกองของนางมาถึงตอนแดดขึ้น ยืนเรียงกันบนสะพานเหมือนตอนยืนเรียงตามผนังโรงเตี๊ยม ธงผ้าเทาพับอยู่ในมือคนหัวแถว
        effects: { flags: [kedra_died] }
    - id: call_her_crew
      label: ตะโกนเรียกคนในกองของนางที่นอนค้างโรงเตี๊ยมหัวสะพาน
      requires: { flag: kedra_ally }
      text: |
        {name}รู้ว่ากองของนางนอนค้างที่โรงเตี๊ยมหัวสะพาน เพราะนางบอกเมื่อวานตอนดื่มด้วยกัน สิบห้าคนวิ่งออกมาในเสื้อนอน ถามกันแค่ว่าจับตรงไหน แต่ละคนจับขอบเกวียนคนละช่วง ยกขึ้นพร้อมกันตามเสียงนับของ{name}

        เคดราคลานออกมาเอง ขาซ้ายหัก ระหว่างรอหมอ นางปลดดาบออกจากเอวยื่นให้{name} บอกว่าขาแบบนี้คุมกองต่อไม่ได้แล้ว กองต้องมีคนคุม ดาบต้องมีคนถือ คนสิบห้าคนในเสื้อนอนยืนฟังอยู่รอบเกวียน ไม่มีใครค้าน
      effects: { stats: { STR: 1 }, items: [kedra_sword], flags: [kedra_saved, kedra_retired, took_kedras_company] }
    - id: stand_and_watch
      label: ยืนดูอยู่ที่ราวสะพาน ให้คนอื่นช่วยนาง
      requires: { flag: kedra_enemy }
      text: |
        เคดราเห็น{name}ที่ราวสะพาน นางหยุดด่าม้า แล้วบอกให้{name}ยืนดูให้จบ อย่าไปไหน คนในเมืองยกเกวียนขึ้นได้ตอนแดดขึ้น ขาของนางหักสองท่อน ขาข้างนั้นไม่กลับมาตรงอีกเลย

        ตลอดชีวิตที่เหลือของนาง ทุกครั้งที่มีคนในเมืองเอ่ยชื่อ{name} นางจะเล่าเรื่องราวสะพานตอนเช้ามืดวันนั้น นางเล่าเก่งเหมือนเดิม และทุกครั้งที่เล่า นางไม่ได้แต่งเพิ่มสักคำ
      effects: { alignment: { moral: -1 }, flags: [kedra_enemy_for_life, kedra_retired] }

- id: adult.mid_warrior_pistol_boy
  stage: adult
  scene: tavern
  weight: 30
  when:
    age: [33, 40]
    class: warrior
  text: |
    เด็กหนุ่มคนนั้นอายุไม่ถึงยี่สิบ สวมเสื้อคลุมยาวผ้าดี ที่เอวมีปืนเวทกระบอกเงิน ด้ามมีหลอดน้ำค้างดาวสีฟ้าเท่านิ้วก้อยเสียบอยู่ เขาเข้ามาในโรงเตี๊ยมพร้อมเพื่อนสามคน เดินตรงมาที่โต๊ะของ{name} บอกว่าได้ยินชื่อมาตั้งแต่เด็ก อีกสิบปีจะไม่มีใครถือดาบแล้ว เขาอยากสู้กับคนถือดาบที่ดีที่สุดในเมืองก่อนจะไม่เหลือให้สู้

    เขาไม่ได้จะยิง เขาจะสู้ด้วยดาบ ปืนวางไว้บนโต๊ะให้ทุกคนเห็นเฉยๆ ดาบของเขาใหม่จนยังมีกลิ่นน้ำมันเคลือบ

    เข่าขวาของ{name}ปวดมาตั้งแต่ฝนตกเมื่อวาน ปวดแบบนี้ทุกครั้งที่ฝนตกมาสามปีแล้ว เด็กหนุ่มคนนี้ยังไม่รู้
  choices:
    - id: fight_him
      label: ลุกขึ้นสู้ เข่าจะปวดก็ให้มันปวดไป
      check: { stat: STR, dc: 14, foe: human }
      success:
        text: |
          เขาเร็ว เร็วกว่าที่{name}เคยเร็วตอนอายุเท่าเขา แต่ฟันเหมือนคนที่ฝึกกับครูบนสนามหญ้า ทุกท่าสวยและทุกท่ามาตามลำดับในตำรา {name}ไม่ต้องรีบ {name}ยืนอยู่กับที่ ให้เขาฟันจนหายใจทางปาก แล้วปัดดาบของเขาหลุดมือในครั้งที่เขาเริ่มท่าแรกซ้ำเป็นรอบที่สาม

          เด็กหนุ่มยืนมองมือตัวเอง เพื่อนสามคนของเขาเงียบ เขาเก็บปืนเวทจากโต๊ะใส่เอว แล้วถามว่า{name}รับสอนคนไหม {name}บอกว่ารับ แต่ต้องตื่นก่อนแดดขึ้น เขาบอกว่าไม่เคยตื่นก่อนแดดขึ้นมาทั้งชีวิต
        effects: { stats: { STR: 1 }, flags: [beat_the_pistol_boy] }
      failure:
        text: |
          เข่าขวาทรุดลงตอนก้าวที่สาม ไม่มีใครแตะ เข่าทรุดไปเอง ดาบของเขามาหยุดที่ข้างคอ{name}ก่อนที่{name}จะยกดาบกลับขึ้นมาทัน เขาไม่ได้ยิ้ม

          เขาบอกว่าคิดว่าจะสนุกกว่านี้ แล้วเก็บปืนเวทใส่เอว เพื่อนสามคนของเขาหัวเราะกันไปจนถึงประตู {name}นั่งลงบนม้านั่งเดิม เอามือกดเข่าไว้ แกงในชามเย็นแล้ว
        effects: { hp: -2, stats: { CON: 1 }, flags: [warrior_bad_knee] }
    - id: take_it_outside
      label: บอกให้ไปสู้กันข้างนอก บนลานหินลาดหลังโรงเตี๊ยม
      check: { stat: INT, dc: 13, foe: human }
      success:
        text: |
          ลานหินหลังโรงเตี๊ยมยังเปียกจากฝนเมื่อวาน มีตะไคร่ขึ้นตามร่องหิน {name}รู้ว่าก้อนไหนลื่น เพราะเดินผ่านมันมาสิบปี เด็กหนุ่มใส่รองเท้าหนังพื้นเรียบแบบคนในเมือง {name}ยืนข้างบนลาน ปล่อยให้เขาเป็นฝ่ายเดินขึ้นมา

          เขาลื่นสามครั้ง ครั้งที่สี่เขาวางดาบลงเอง บอกว่านี่ไม่ใช่การสู้ที่ยุติธรรม {name}บอกว่าการสู้ที่ยุติธรรมมีแต่ในสนามหญ้า เขานั่งถอดรองเท้าเทน้ำออกอยู่ตรงนั้นจนเพื่อนสามคนกลับไปก่อน
        effects: { stats: { INT: 1 }, flags: [beat_the_pistol_boy] }
      failure:
        text: |
          เด็กหนุ่มเห็นลานหินแล้วถอดรองเท้าทิ้งไว้ที่ประตูหลัง เท้าเปล่าจับหินได้ดีกว่ารองเท้าทุกแบบ คนที่ลื่นเป็นคนแรกคือ{name} เข่าขวาลงกระแทกหินเต็มแรง

          เขาไม่ได้ฟันซ้ำ เขาช่วยพยุง{name}กลับเข้าโรงเตี๊ยม แล้วบอกเจ้าของร้านให้คิดค่าเหล้าคืนนี้ที่เขา รวมจอกของ{name}ด้วย
        effects: { hp: -2, flags: [warrior_bad_knee] }
    - id: mila_stands_up
      label: มองไปที่โต๊ะข้างๆ ที่มิลานั่งอยู่
      requires: { flag: trained_mila }
      text: |
        มิลากลับมาเยี่ยมเมืองตอนปลายฤดู นั่งอยู่โต๊ะข้างๆ กับแม่ของนาง นางลุกขึ้นก่อนที่{name}จะทันขยับ ถอดเสื้อคลุมวางบนเก้าอี้ แล้วบอกเด็กหนุ่มว่าถ้าอยากสู้กับครู ให้สู้กับลูกศิษย์ก่อน

        นางยืนแบบที่{name}สอนบนลานหินหลังบ้านเมื่อหลายปีก่อน เท้าวางเข้าที่ ไหล่ไม่ยก สายตาอยู่ที่คน ไม่ใช่ที่ดาบ เด็กหนุ่มฟันได้สามครั้งก็นั่งอยู่บนพื้น นางคืนดาบให้เขา แล้วบอกว่าครูของนางยังไม่ได้ลุกจากเก้าอี้เลย แม่ของนางนั่งอยู่ที่โต๊ะเดิม มือยังแดงจากน้ำด่าง ยิ้มเป็นครั้งแรกที่{name}เคยเห็น
      effects: { reputation: { wardens: 1 }, flags: [mila_came_back] }
    - id: buy_him_a_drink
      label: สั่งเหล้าให้เขาหนึ่งจอก เล่าเรื่องปืนเวทที่ลั่นในมือคน
      requires: { min_gold: 1 }
      text: |
        {name}จ่ายค่าเหล้าหนึ่งเหรียญ วางจอกตรงหน้าเขา แล้วเล่าเรื่องทหารคนหนึ่งที่{name}เคยเห็นตาย ปืนเวทของเขาร้อนจนหลอดน้ำค้างในด้ามแตก แสงฟ้าวิ่งเข้าไปในนิ้วทั้งห้า นิ้วของเขาติดอยู่กับด้ามปืนจนหมอต้องตัดออกทั้งมือ แล้วไข้ก็ขึ้นในคืนต่อมา

        เด็กหนุ่มฟังจนเหล้าหมดจอก ไม่ได้แตะปืนบนโต๊ะอีก ตอนลุกกลับเขาหยิบมันใส่เอวช้าๆ ถือมันด้วยสองนิ้วเหมือนถือของร้อน แล้วคว่ำจอกเปล่าไว้บนโต๊ะ
      effects: { gold: -1, stats: { INT: 1 }, flags: [warned_the_pistol_boy] }

# ---------- นักย่อง ----------
- id: adult.mid_rogue_finnick_ledger
  stage: adult
  scene: home
  weight: 30
  when:
    age: [25, 32]
    class: rogue
  text: |
    กลอนประตูห้องยังลงอยู่ตอนที่{name}กลับมาถึงตอนดึก หน้าต่างปิดสนิท ข้างในมีคนนั่งรออยู่บนเก้าอี้ตัวเดียวในห้อง เท้าวางบนโต๊ะ ผู้ชายผมแดงที่ขมับเริ่มมีสีเทา หนูท่าทั้งเมืองรู้จักเขาในชื่อฟินนิค เขาบอกว่ากลอนตัวนี้ราคาเกินของ แล้วบอกว่ามีงาน

    หัวหน้าเสมียนวิหารเบเลคเก็บสมุดบัญชีลูกหนี้ย่านท่าเรือไว้ในลิ้นชักโต๊ะทำงาน ลิ้นชักมีกลอนสามชั้น หัวหน้าหนูท่าอยากรู้ว่าคนในย่านใครติดเบเลคอยู่เท่าไร จะได้รู้ว่าใครซื้อได้ในราคาเท่าไร ให้ค่าจ้างยี่สิบเหรียญ งานคือเอาสมุดออกมาให้คนคัดลอกทั้งคืน แล้วเอากลับไปวางที่เดิมก่อนเสมียนคนแรกมาถึง

    ฟินนิคต้องการคนหนึ่งคนเป็นมือ อีกคนเป็นไหล่ แบ่งกันคนละสิบ
  choices:
    - id: be_the_hand
      label: เป็นมือ เข้าไปเปิดลิ้นชักเอาสมุดออกมาเอง
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          กลอนชั้นที่สามเป็นแบบที่{name}ไม่เคยเห็น เหล็กสองซี่ต้องหมุนสวนทางกันพร้อมกัน {name}ใช้เวลาเท่าเทียนไหม้ไปครึ่งนิ้ว ฟินนิคคัดลอกอยู่ในห้องใต้หลังคาตรงข้ามจนตีสี่ {name}เอาสมุดกลับไปวางในลิ้นชัก หันสันไปทางเดิม แล้วล็อกกลอนครบสามชั้น ก่อนเสมียนคนแรกจะไขประตูหน้า

          หัวหน้าหนูท่าจ่ายครบ แล้วถามชื่อ{name} ไม่ได้ถามชื่อฟินนิค ฟินนิคได้ยิน เขายิ้มกว้างที่สุดเท่าที่{name}เคยเห็น แล้วออกจากห้องไปก่อนโดยไม่รอนับเงิน เดือนต่อมางานที่เคยไปถึงมือฟินนิคเริ่มมาถึงมือ{name}ก่อน
        effects: { stats: { DEX: 1 }, gold: 10, reputation: { dock_rats: 1 }, flags: [lifted_belek_ledger, finnick_fell] }
      failure:
        text: |
          กลอนชั้นที่สามดังกริ๊กหนึ่งครั้ง ดังพอให้ยามที่หลับอยู่บนเก้าอี้ปลายทางเดินขยับตัว {name}ค้างมืออยู่กับกลอน ได้ยินเสียงเท้ายามเริ่มเดินมาทางห้อง ฟินนิคเปิดหน้าต่างจากข้างนอก ล้วงมือเข้ามาหมุนเหล็กซี่ที่สองให้ แล้วดึงสมุดกับ{name}ออกไปทางหลังคาพร้อมกัน ข้อศอกของ{name}ครูดกับกรอบหน้าต่างจนเลือดซึม

          ตอนเช้าหัวหน้าหนูท่าจ่ายสิบเหรียญให้ฟินนิค จ่ายให้{name}สามเหรียญ บอกว่ามือที่ดังกริ๊กไม่คุ้มสิบ ฟินนิคนับเหรียญของตัวเองถึงเก้า แล้ววางเหรียญที่สิบลงบนโต๊ะของ{name} บอกว่านั่นค่าข้อศอก
        effects: { hp: -1, gold: 4, flags: [lifted_belek_ledger, finnick_rose] }
    - id: be_the_shoulder
      label: เป็นไหล่ นับรอบยามเฝ้าหัวบันไดให้ฟินนิคเข้าไป
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ยามเดินรอบละร้อยนับ เลี้ยวมุมทางเดินที่นับหกสิบ และหยุดผิวปากที่นับแปดสิบทุกรอบ {name}นับตามจนรู้ว่ารอบไหนเขาจะหยุดนานกว่าเดิม แล้วส่งเสียงนกเค้าแมวให้ฟินนิคทุกครั้งที่ยามเลี้ยวมุม ฟินนิคเข้าออกสองรอบ ยามไม่หันมาสักครั้ง

          หัวหน้าหนูท่าจ่ายคนละสิบ ฟินนิคบอกว่าไหล่ที่ดีหายากกว่ามือที่ดี แต่ไม่มีใครเคยจำชื่อไหล่ได้ คนทั้งท่าเรือเล่าเรื่องสมุดของเบเลคกันไปทั้งเดือน ทุกเรื่องที่เล่ามีชื่อฟินนิค
        effects: { stats: { INT: 1 }, gold: 10, flags: [lifted_belek_ledger, finnick_rose] }
      failure:
        text: |
          ยามมีสองคน {name}นับรอบได้แค่คนเดียว คนที่สองขึ้นบันไดมาจากชั้นล่างตอนที่{name}กำลังส่งเสียงนกเค้าแมวให้คนแรก {name}ต้องวิ่งหนีลงทางท่อน้ำ ฟินนิคยังอยู่ในห้องหัวหน้าเสมียน

          สามวันต่อมาได้ข่าวว่าฟินนิคอยู่ในห้องขังใต้ศาล ข้อหาบุกรุกวิหาร ไม่ใช่ข้อหาขโมย เพราะสมุดยังอยู่ในลิ้นชักครบทุกหน้า เขาออกมาตอนปลายฤดู ผอมลงจนเสื้อหลวม และไม่ได้มาเคาะประตูห้อง{name}อีกเลย
        effects: { hp: -1, flags: [finnick_fell, left_finnick_inside] }
    - id: make_him_the_shoulder
      label: รับงาน ถ้าคราวนี้เขายอมเป็นไหล่ เพราะครั้งก่อน{name}เป็นคนชนะ
      requires: { flag: beat_finnick }
      text: |
        ฟินนิคหัวเราะจนต้องเอาเท้าลงจากโต๊ะ แล้วบอกว่ายอม เขาเป็นไหล่ที่ดีกว่าที่{name}คาดไว้ไกล รู้ทั้งรอบยามคนแรกและรอบยามคนที่สอง ส่งเสียงนกเค้าแมวได้เหมือนจนนกเค้าแมวจริงบนหลังคาตอบกลับมา {name}เปิดกลอนสามชั้นเสร็จก่อนที่เขาจะส่งเสียงครั้งที่สอง

        หัวหน้าหนูท่าจ่ายคนละสิบ ระหว่างเดินกลับ ฟินนิคบอกว่าตั้งแต่วันนั้น เขารอให้มีคนชนะเขาอีกสักครั้ง รอจนเลิกรอ เขาแวะซื้อขนมทอดสองชิ้นที่ปากตลาด ยื่นให้{name}หนึ่งชิ้นโดยไม่ถามว่ากินไหม
      effects: { stats: { DEX: 1 }, gold: 10, flags: [lifted_belek_ledger, finnick_ally] }
    - id: learn_his_grip
      label: ขอให้เขาสอนวิธีเปิดกลอนสามชั้นก่อน แล้วค่อยตอบว่ารับไหม
      requires: { flag: lost_to_finnick }
      text: |
        ฟินนิคถอดกลอนประตูห้อง{name}ออกมาวางบนโต๊ะแทนกลอนลิ้นชัก สอนทั้งคืน ทีละซี่ ทีละเสียง ตีสามเขาเอามือปิดตา{name}ไว้ ให้เปิดกลอนด้วยหูอย่างเดียว ตีสี่{name}เปิดได้โดยไม่ต้องลืมตา

        งานสมุดของเบเลคเลื่อนไปเดือนหน้า แล้วหนูท่าคนอื่นทำไปก่อน ฟินนิคไม่เสียดาย เขาบอกว่าตอนที่ชนะ{name}ที่ตลาดนัดวันนั้น เขาเสียดายอยู่อย่างเดียว คือไม่มีใครสอนเขาแบบนี้ตอนอายุเท่า{name} เช้าวันนั้นกลอนประตูห้อง{name}ใส่กลับเข้าที่ด้านกลับหัว
      effects: { stats: { DEX: 1 }, flags: [finnick_ally] }
    - id: refuse_job
      label: ไม่รับ บอกให้เขาออกไปทางเดียวกับที่เข้ามา
      text: |
        ฟินนิคลุกจากเก้าอี้ ไม่โกรธ ไม่ถามซ้ำ เขาเปิดหน้าต่างปีนออกไปบนหลังคา แล้วปิดหน้าต่างกลับจากข้างนอก กลอนหน้าต่างตกลงเองเหมือนไม่เคยมีใครแตะ

        เดือนต่อมา{name}ได้ข่าวว่าหัวหน้าหนูท่าได้สมุดของเบเลคไปคัดลอกจนครบ ฟินนิคทำงานนั้นคนเดียว ได้ยี่สิบเหรียญเต็ม เช้าวันหนึ่งมีกลอนเหล็กสามชั้นตัวใหม่วางอยู่หน้าประตูห้อง{name} ห่อกระดาษ ไม่มีชื่อคนให้
      effects: { alignment: { law: 1 }, flags: [finnick_rose, refused_finnick_job] }

- id: adult.mid_rogue_blue_alleys
  stage: adult
  weight: 30
  when:
    age: [25, 32]
    class: rogue
  text: |
    สมาคมโรงกลั่นเอาตะเกียงฟ้าเข้ามาตั้งในตรอกหลังท่าเรือ ต้นละสิบก้าว เสาเหล็กสูงเท่าคนสองคนยืนต่อกัน แก้วครอบสีฟ้าส่องทั้งคืนไม่มีวันดับ ตรอกที่{name}เดินมาหลายปีโดยไม่มีใครเห็น ตอนนี้สว่างจนนับเหรียญที่ตกบนพื้นได้ทุกเหรียญ

    หนูท่าเฒ่าที่นั่งหน้าร้านเหล้าบอกว่าต่อไปงานกลางคืนต้องย้ายไปทำตอนกลางวัน เด็กๆ ในตรอกชอบแสงนั้น นั่งเล่นหมากเม็ดใต้เสาจนดึก คนจุดตะเกียงของสมาคมเดินตรวจทุกคืน ถือไม้ยาวปลายตะขอ เติมน้ำค้างดาวต้นละครั้งทุกเจ็ดวัน
  choices:
    - id: learn_the_rounds
      label: ตามคนจุดตะเกียงไปเจ็ดคืน จำว่าต้นไหนเติมวันไหน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ตะเกียงไม่ได้สว่างเท่ากันทุกคืน ต้นที่เติมน้ำค้างมานานจะหรี่ลงก่อนรุ่งสางนิดหนึ่ง ต้นที่เพิ่งเติมจะสว่างจนแสบตาในชั่วโมงแรก คืนก่อนวันเติมของมุมตรอกที่สาม สองต้นตรงนั้นหรี่ลงพร้อมกันอยู่ช่วงหนึ่ง นานพอให้คนเดินผ่านไปได้สามสิบก้าว

          {name}จำไว้ในหัว ไม่ได้จดลงที่ไหน เจ็ดคืนต่อมาตรอกหลังท่าเรือมีทางมืดอยู่ทางหนึ่ง สัปดาห์ละคืน และมีคนรู้อยู่คนเดียว
        effects: { stats: { INT: 1 }, flags: [knows_lamp_gaps] }
      failure:
        text: |
          คืนที่ห้าคนจุดตะเกียงหยุดเดินกลางตรอก หันหลังกลับมา ยกไม้ปลายตะขอขึ้นส่องแสงฟ้าใส่หน้า{name} ถามว่าตามมาห้าคืนแล้วจะเอาอะไร {name}ตอบว่าหลงทาง เขาหัวเราะ

          สัปดาห์ต่อมายามหน้าท่าเรือทักชื่อ{name}ได้ตั้งแต่ไกล {name}ไม่เคยบอกชื่อกับใครในตรอกนั้นสักคน
        effects: { flags: [lamp_guard_knows_face] }
    - id: break_a_lamp
      label: ปีนเสาขึ้นไปทุบแก้วครอบต้นที่อยู่หน้าทางเข้าตรอก
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          แก้วครอบแตกเสียงเบาเหมือนน้ำแข็งบางบนปากตุ่ม น้ำค้างดาวหยดลงพื้นเป็นจุดสีฟ้าเรือง แล้วค่อยๆ ดับไปทีละจุด ตรอกกลับมามืดเหมือนเดิมทั้งคืน {name}ลงจากเสาโดยไม่มีน้ำค้างติดตัวสักหยด

          เช้าวันต่อมาเด็กในตรอกมายืนล้อมเสาเปล่า ถามกันว่าใครทำ สามวันต่อมาสมาคมตั้งแก้วครอบใหม่ หนากว่าเดิมเท่าตัว มียามเพิ่มมาหนึ่งคน ยืนใต้เสาต้นนั้นทั้งคืน
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [broke_star_lamp] }
      failure:
        text: |
          เสาเหล็กลื่นเพราะน้ำค้างกลางคืน {name}ทุบแก้วแตกได้ตอนที่มือข้างหนึ่งยังจับเสาไม่แน่น น้ำค้างดาวกระเซ็นลงมาใส่หลังมือซ้าย เย็นจนแสบเหมือนจับน้ำแข็ง {name}ร่วงลงมากระแทกพื้นตรอก

          สามวันต่อมาหลังมือซ้ายมีรอยไหม้รูปหยดน้ำ ตกกลางคืนรอยนั้นเรืองแสงฟ้าจางๆ อยู่ใต้ผิว {name}ต้องพันผ้าไว้ทุกครั้งที่ออกไปทำงาน
        effects: { hp: -2, alignment: { law: -1 }, flags: [broke_star_lamp, star_dew_burn] }
    - id: become_lamplighter
      label: ไปสมัครเป็นคนจุดตะเกียงของสมาคมเสียเอง
      text: |
        สมาคมโรงกลั่นจ้างคนจุดตะเกียงที่รู้จักตรอก เพราะคนที่ไม่รู้จักมักหลงตั้งแต่คืนแรก หัวหน้าคนจุดตะเกียงถาม{name}สองคำถาม ตรอกที่สามไปออกที่ไหน และใครในตรอกนั้นมีหมาดุ {name}ตอบได้ทั้งสองข้อ ได้ไม้ยาวปลายตะขอมาหนึ่งอัน กับเงินล่วงหน้าสามเหรียญ

        ตั้งแต่เดือนนั้น{name}รู้ว่าตะเกียงต้นไหนจะหรี่คืนไหน เพราะ{name}เป็นคนเติมเอง และรู้ว่าต้นไหนจะเติมช้าไปหนึ่งคืนโดยไม่มีใครตรวจเจอ
      effects: { gold: 3, alignment: { law: 1 }, reputation: { distillers: 1 }, flags: [lamp_lighter_job] }

- id: adult.mid_rogue_finnick_glass_hands
  stage: adult
  weight: 30
  when:
    age: [33, 40]
    class: rogue
  text: |
    ฟินนิคนั่งอยู่บนขั้นบันไดน้ำพุกลางตลาดตอนเช้า ผมแดงเหลืออยู่แค่ขอบหู หลังมือทั้งสองข้างเป็นแผ่นใสเหมือนแก้วที่ลามขึ้นไปถึงข้อมือ ข้างใต้มีแสงฟ้าเต้นเบาๆ ตามจังหวะชีพจร สิบปีที่ผ่านมาเขาขนน้ำค้างดาวเถื่อนขึ้นลงเรือเหาะ ขวดละหลายเหรียญ มือที่จับขวดทุกวันก็เป็นอย่างนี้

    เขาเห็น{name}ก่อนที่{name}จะเห็นเขา เขาเรียก{name}ให้มานั่ง แล้วบอกว่ามีพนันครั้งสุดท้าย พนันที่เขาท้าคนเก่งทุกรุ่นในเมืองมาตั้งแต่หนุ่ม กุญแจเหล็กของคนเฝ้าประตูเมือง คนเฝ้าคนใหม่ กุญแจดอกใหม่ ใครเอามาได้ก่อนเที่ยงชนะ

    เขาบอกว่ามือแบบนี้งัดกลอนไม่ได้แล้ว ปลายนิ้วไม่รู้สึกอะไร เขาแค่อยากเห็นใครสักคนทำ
  choices:
    - id: take_the_bet
      label: รับพนัน ไปเอากุญแจดอกใหม่มาให้เขาดู
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          คนเฝ้าประตูคนใหม่ไม่ได้ห้อยกุญแจไว้กับเชือกเหมือนคนเก่า เขาร้อยมันไว้กับโซ่เส้นเล็กที่คาดเข็มขัด {name}ยืนรอคิวผ่านประตูอยู่ข้างหลังเขา จนเกวียนผักคันหนึ่งติดล้อที่ธรณีประตู แล้วปลดห่วงโซ่ออกตอนที่เขาก้มลงดันล้อเกวียน

          {name}กลับมาถึงน้ำพุก่อนเที่ยง วางกุญแจลงบนฝ่ามือแก้วของฟินนิค เขาพลิกกุญแจไปมาบนฝ่ามือที่ไม่รู้สึกอะไร แล้วล้วงห่อผ้าหนังออกมาจากอกเสื้อ ข้างในเป็นเหล็กงัดสิบสองชิ้น ด้ามสึกเป็นรอยนิ้วของคนคนเดียว เขาบอกว่าคนชนะได้ของ แล้วบอกให้เอากุญแจไปคืนคนเฝ้าด้วย คนเฝ้าคนนี้มีลูกสามคน
        effects: { stats: { DEX: 1 }, items: [finnick_picks], flags: [finnick_last_bet] }
      failure:
        text: |
          โซ่เส้นเล็กที่คาดเข็มขัดของคนเฝ้าประตูดึงกลับตอนที่{name}ปลดห่วงได้ครึ่งหนึ่ง เขาหันมา {name}ต้องทำเป็นถามทางไปตลาดปลา แล้วเดินออกไปทางนั้นจริงๆ จนพ้นสายตา

          {name}กลับมาที่น้ำพุมือเปล่า ฟินนิคหัวเราะจนไอ ไอจนต้องก้มหน้าลงกับเข่า เขาบอกว่าดีแล้ว ถ้า{name}เอามาได้ เขาก็จะไม่มีอะไรเหลือให้รออีก
        effects: { stats: { DEX: 1 }, flags: [finnick_last_bet] }
    - id: sit_with_him
      label: นั่งลงข้างเขา ไม่พนัน
      text: |
        ฟินนิคเล่างานของเขาทีละงาน ตั้งแต่ถุงเงินพ่อค้าพรมที่ตลาดนัด จนถึงขวดน้ำค้างขวดสุดท้ายที่ขนลงจากเรือเหาะเมื่อฤดูหนาว ตอนสาย เขาเงยหน้ามองฟ้าแล้วบอกว่าอีกครู่หนึ่งฝนจะตก ฟ้าตอนนั้นใสไม่มีเมฆสักก้อน ยังไม่ทันเที่ยง ฝนก็เทลงมาจนน้ำพุล้นขอบ

        เขาบอกว่าตั้งแต่มือเป็นแบบนี้ เขารู้เรื่องที่ยังไม่เกิดบางเรื่อง เรื่องเล็กๆ ฝน หมาจรตัวไหนจะข้ามถนน คนขายปลาจะขายหมดก่อนเที่ยงไหม เดือนหน้าเขาจะย้ายไปอยู่ย่านโรงกลั่น ที่ที่คนแบบเขาไปอยู่รวมกัน เขาไม่ได้บอกว่าคนแบบเขาคือคนแบบไหน
      effects: { alignment: { moral: 1 }, flags: [finnick_went_to_glass_ward] }
    - id: pay_the_lesson
      label: วางสองเหรียญบนขั้นบันได เป็นค่าเรียนที่ค้างไว้ตั้งแต่ตลาดนัดวันนั้น
      requires: { flag: lost_to_finnick, min_gold: 2 }
      text: |
        ฟินนิคมองเหรียญสองเหรียญบนขั้นบันได แล้วบอกว่าเขาไม่เคยเก็บค่าเรียนจากใคร {name}บอกว่าก็เพราะไม่เคยเก็บ หนูท่าที่เขาสอนมาทั้งชีวิตเลยไม่มีใครเคยจ่าย

        เขาเก็บเหรียญใส่อกเสื้อด้วยนิ้วแก้วที่ไม่รู้สึกอะไร ทำหล่นครั้งหนึ่ง {name}ก้มเก็บให้ ครั้งที่สองเขาเก็บได้เอง
      effects: { gold: -2, alignment: { moral: 1 }, flags: [paid_finnick] }
    - id: take_his_crew
      label: ขอรับเด็กๆ ใต้มือเขามาดูแลต่อ
      requires: { flag: finnick_rose }
      text: |
        ฟินนิคมีเด็กใต้มือสิบคน คนโตอายุสิบเจ็ด คนเล็กเก้าขวบ หัวหน้าหนูท่าคนใหม่อยากได้พวกนั้นไปขนของบนเรือเหาะ ฟินนิคไม่อยากให้ไป เขาอยากให้คนที่รู้ว่ากลอนสามชั้นเปิดยังไงเป็นคนสอนพวกนั้นต่อ

        {name}รับ ค่ำวันนั้นเด็กสิบคนมานั่งเรียงกันบนพื้นห้องของ{name} คนเล็กที่สุดถามว่าจะได้กินข้าวไหม ฟินนิคฝากเงินไว้สามเหรียญ พอค่าข้าวไม่กี่วัน หลังจากนั้นเป็นเรื่องของ{name}
      effects: { gold: 3, reputation: { dock_rats: 2 }, flags: [took_finnicks_crew] }
    - id: pay_his_room
      label: จ่ายค่าห้องที่ย่านโรงกลั่นให้เขาหกเหรียญ พอหนึ่งปี
      requires: { flag: finnick_fell, min_gold: 6 }
      text: |
        ฟินนิคหัวเราะ บอกว่าสมัยมือยังดี หกเหรียญเป็นเงินคืนเดียวของเขา แล้วเขาก็รับ ไม่ได้นับ

        ห้องที่ย่านโรงกลั่นอยู่ชั้นสอง หน้าต่างหันไปทางปล่องโรงงาน ฟินนิคยืนดูควันที่หน้าต่างนั้นทุกเย็น {name}ไปหาเขาสองครั้งในปีนั้น ครั้งที่สองแผ่นใสขึ้นมาถึงข้อศอกแล้ว เขาบอกว่าพรุ่งนี้ตอนบ่าย{name}จะทำเหรียญหล่นหนึ่งเหรียญที่ทางเดินหน้าบ้าน แล้วมันก็หล่นจริง
      effects: { gold: -6, alignment: { moral: 1 }, flags: [paid_finnicks_room] }

- id: adult.mid_rogue_take_the_fall
  stage: adult
  scene: tavern
  weight: 30
  when:
    age: [33, 40]
    class: rogue
  text: |
    หัวหน้าหนูท่าคนใหม่อายุไม่ถึงยี่สิบห้า หัวหน้าคนเก่าตายในห้องขังเมื่อฤดูหนาว เมื่อคืนยามจับเด็กของหนูท่าได้สามคนพร้อมขวดน้ำค้างดาวเถื่อนสิบสองขวด ศาลจะตัดสินคนละห้าปี ถ้าไม่มีใครมารับว่าเป็นคนสั่งงาน

    หัวหน้าหนุ่มเข้ามาในห้องหลังโรงเตี๊ยม มองหาคนที่อายุมากที่สุดในห้อง คนที่อายุมากที่สุดในห้องคือ{name} เขาบอกว่าคนสั่งงานรับโทษแค่ปีเดียว ศาลใจอ่อนกับคนแก่ที่ยอมรับเอง ระหว่างนั้นหนูท่าจะส่งข้าวให้ทุกวัน ไม่ขาดสักมื้อ

    เด็กสามคนนั้น คนหนึ่งเป็นเด็กที่{name}เคยสอนให้ล้วงกระเป๋าเมื่อห้าปีก่อน
  choices:
    - id: take_it
      label: รับว่าเป็นคนสั่งงาน ติดคุกหนึ่งปีแทนเด็กสามคน
      text: |
        ห้องขังใต้ศาลหนาวทั้งปี ฤดูร้อนก็หนาว หนูท่าส่งข้าวมาครบทุกวันอย่างที่พูดไว้ ข้าวเย็นทุกมื้อ บางมื้อมีปลาเค็มชิ้นหนึ่งวางข้างบน เงินสองเหรียญที่ติดตัวเข้าไปหมดไปกับค่าผ้าห่มที่ยามขายให้ในราคาสามเท่า

        วันที่{name}ออกมา เด็กสามคนยืนรออยู่หน้าศาล คนหนึ่งตัวสูงขึ้นจนจำไม่ได้ เขาถือขนมทอดห่อใบตองมาหนึ่งห่อ ยื่นให้ด้วยสองมือ แล้วยืนรอให้{name}กินคำแรก
      effects: { hp: -2, gold: -2, stats: { CON: 1 }, reputation: { dock_rats: 2 }, flags: [took_the_rats_fall] }
    - id: refuse_the_fall
      label: บอกว่าคนสั่งงานควรเป็นคนรับ ไม่ใช่คนแก่ที่สุดในห้อง
      text: |
        หัวหน้าหนุ่มหน้าแดงขึ้นจนถึงหู ห้องหลังโรงเตี๊ยมเงียบ ทุกคนรู้ว่าใครสั่งงานคืนนั้น คนในห้องก้มมองโต๊ะ ไม่มองทั้ง{name}และเขา สุดท้ายไม่มีใครลุกขึ้นรับ

        เด็กสามคนได้คนละห้าปี ตั้งแต่เดือนนั้นหนูท่าเลิกส่งงานมาที่{name} ทุกครั้งที่{name}เดินผ่านท่าเรือ คนที่เคยทักก็หันไปขนของต่อ
      effects: { alignment: { law: 1 }, reputation: { dock_rats: -2 }, flags: [refused_rats_fall] }
    - id: give_the_court_his_name
      label: ไปบอกศาลว่าใครเป็นคนสั่งงานจริง พร้อมหลักฐาน
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}รู้ว่าขวดสิบสองขวดนั้นขึ้นมาจากเรือลำไหน เพราะเคยขนของลงเรือลำเดียวกัน สมุดลงของของท่าเรือมีชื่อคนรับของคืนนั้น ลายมือเดียวกับป้ายที่หัวหน้าหนุ่มติดหน้าห้องหลังโรงเตี๊ยม {name}คัดสองหน้านั้นไปให้ศาล

          หัวหน้าหนุ่มได้สามปี เด็กสามคนได้คนละหกเดือน หนูท่ารู้ว่าใครพูด ห้องของ{name}มีรอยไฟไหม้ที่ประตูในเดือนต่อมา ไม่ลามเข้าข้างใน เป็นแค่รอยให้เห็น
        effects: { stats: { INT: 1 }, alignment: { law: 1 }, reputation: { dock_rats: -3, crown: 1 }, flags: [informed_on_rats_boss] }
      failure:
        text: |
          สมุดลงของของท่าเรือหายไปสองหน้า หน้าที่{name}ต้องการพอดี ศาลไม่ฟังคนที่ไม่มีหลักฐาน และไม่ชอบคนที่มาจากท่าเรือ เด็กสามคนได้คนละห้าปี

          หนูท่ารู้ว่าใครไปศาล คืนหนึ่งในเดือนนั้นมีคนสามคนรอ{name}อยู่ในตรอกหลังตลาด ไม่มีใครพูดสักคำตลอดเวลาที่ทำ
        effects: { hp: -3, reputation: { dock_rats: -3 }, flags: [informed_on_rats_boss] }
    - id: old_debt_paid
      label: บอกเขาว่าหนี้ปีแรกของ{name}จ่ายเป็นเงินไปแล้วตั้งแต่ยัง{หนุ่ม|สาว} หนูท่าไม่มีอะไรจะขออีก
      requires: { flag: bought_out_rats_debt }
      text: |
        หัวหน้าหนุ่มเคยได้ยินเรื่องนี้จากหัวหน้าคนเก่า เรื่องคนแรกที่วางเหรียญบนโต๊ะจ่ายหนี้ปีแรก ทุกคนในห้องเคยได้ยิน เขายืนนิ่ง แล้วหันไปมองคนอื่นในห้องทีละคน ทุกคนมองพื้น

        เช้าวันต่อมาเขาเดินเข้าศาลเอง รับว่าเป็นคนสั่งงาน ได้ปีเดียวอย่างที่เขาบอกไว้ เด็กสามคนออกมาตอนเที่ยง คนหนึ่งเดินมาหา{name}ที่ท่าเรือ ถามว่าหนี้ปีแรกของเขาจ่ายเป็นเงินได้ไหม
      effects: { alignment: { law: 1 }, reputation: { dock_rats: 1 }, flags: [rats_debt_honored] }

# ---------- นักเวท ----------
- id: adult.mid_wizard_severin_cracked_lamp
  stage: adult
  scene: workshop
  weight: 30
  when:
    age: [25, 32]
    class: wizard
  text: |
    ตะเกียงไส้เกลียวของเซเวรินขายดีที่สุดในเมืองมาสามปี ลูกชายเจ้าของโรงงานแก้วคนนั้นทำตะเกียงที่กินน้ำค้างดาวครึ่งเดียวของตะเกียงทั่วไปได้สำเร็จ แก้วครอบบางจนเห็นไส้ข้างในหมุนเป็นเกลียวสีฟ้า บ้านคนมีเงินทุกหลังมีสักต้น

    เดือนที่แล้วตะเกียงต้นหนึ่งในบ้านพ่อค้าไหมแตกกลางดึก เศษแก้วกับน้ำค้างดาวเย็นจัดกระเด็นใส่เปลข้างโต๊ะ เด็กแฝดสองคนตาบอดไปคนละข้าง สมาคมโรงกลั่นตั้งคณะไต่สวน และต้องการช่างเวทหนึ่งคนที่ไม่เคยรับเงินจากโรงงานแก้วบ้านเซเวริน มาอ่านเศษแก้วแล้วบอกว่ามันแตกเพราะแบบ หรือเพราะคนใช้ สมาคมเลือก{name}

    เศษแก้วห่อผ้าขาววางอยู่บนโต๊ะยาวในโรงช่างของสมาคม เซเวรินนั่งอยู่ปลายโต๊ะ แต่งตัวดีกว่าคณะไต่สวนทุกคน มือวางนิ่งบนตัก
  choices:
    - id: read_the_shards
      label: อ่านเศษแก้วตามที่มันเป็น ไม่ดูหน้าใครในห้อง
      check: { stat: INT, dc: 14 }
      success:
        text: |
          รอยร้าวบนเศษแก้วทุกชิ้นวิ่งออกจากจุดเดียวกัน ตรงที่แก้วบางที่สุด ด้านที่ชิดไส้เกลียว แก้วร้าวเพราะร้อนเกินกว่าที่ความหนาเท่านั้นจะรับไหว ใครจุดก็ร้าว จุดถึงครึ่งคืนเมื่อไรก็ร้าว {name}เขียนรายงานสองหน้า วาดรอยร้าวลงไปทุกเส้น

          สมาคมสั่งเก็บตะเกียงไส้เกลียวคืนทุกต้นในเมือง โรงงานแก้วบ้านเซเวรินจ่ายค่าเสียหายให้บ้านพ่อค้าไหม ตอนเดินออกจากโรงช่าง เซเวรินไม่ได้มองหน้า{name} เขามองห่อผ้าขาวบนโต๊ะจนคนของสมาคมยกออกไป
        effects: { stats: { INT: 1 }, reputation: { distillers: 1 }, flags: [severin_fell, read_severins_shards] }
      failure:
        text: |
          รอยร้าวบนเศษแก้ววิ่งไปหลายทางจน{name}จับไม่ได้ว่าเริ่มที่ไหน {name}บอกคณะไต่สวนว่าบอกไม่ได้ ต้องจุดทดสอบใหม่ คณะไต่สวนไม่อยากเสียน้ำค้างดาวทั้งคืนกับตะเกียงที่แตกไปแล้ว

          สมาคมตัดสินว่าบ้านพ่อค้าไหมเติมน้ำค้างเกินขีด ปีต่อมาตะเกียงไส้เกลียวรุ่นใหม่มีป้ายทองเหลืองเล็กๆ ติดไว้ที่ฐาน ห้ามจุดเกินครึ่งคืน ขายได้มากกว่ารุ่นแรกเกือบเท่าตัว
        effects: { flags: [severin_rose] }
    - id: blame_the_user
      label: รับหกเหรียญจากคนของบ้านเซเวริน เขียนว่าคนใช้จุดผิดวิธี
      text: |
        คนของโรงงานแก้วมาหาที่ห้องเช่าคืนก่อนวันไต่สวน วางเหรียญหกเหรียญเรียงบนโต๊ะ ไม่ได้ขออะไร บอกแค่ว่าบ้านพ่อค้าไหมเติมน้ำค้างดาวเองทุกเจ็ดวัน ไม่เคยจ้างช่าง {name}เขียนรายงานตามนั้น

        พ่อค้าไหมไม่มีหลักฐานว่าเติมตามขีด ตะเกียงไส้เกลียวยังขายดีต่อไป ทุกครั้งที่{name}เดินผ่านบ้านคนมีเงินตอนกลางคืน จะเห็นเกลียวสีฟ้าหมุนอยู่หลังหน้าต่าง
      effects: { gold: 6, alignment: { moral: -2 }, flags: [severin_rose, covered_for_severin] }
    - id: confess_the_spiral
      label: บอกคณะไต่สวนว่าตะเกียงของ{name}เองก็ใช้เกลียวที่ลอกมาจากเขา และไม่เคยแตก
      requires: { flag: stole_from_severin }
      text: |
        {name}เอาตะเกียงของตัวเองมาวางข้างห่อเศษแก้ว ไส้หมุนเป็นเกลียวแบบเดียวกัน เกลียวที่จำมาจากโต๊ะของเซเวรินในวันสาธิตเมื่อหลายปีก่อน ตะเกียงต้นนี้จุดมาทุกคืนไม่เคยแตก เพราะแก้วครอบหนาเท่าข้อนิ้ว เกลียวไม่ใช่ตัวการ แก้วบางต่างหาก

        คณะไต่สวนจดทุกคำ รวมทั้งคำว่าลอกมา สมาคมสั่งให้เปลี่ยนแก้วครอบทุกต้น ไม่ได้สั่งเก็บตะเกียง และใส่ชื่อ{name}ไว้ในบัญชีช่างที่ไม่รับแบบอีกสองปี ตอนจบการไต่สวน เซเวรินมองหน้า{name}เป็นครั้งแรกในวันนั้น แล้วยกมือขึ้นแตะขอบหมวก
      effects: { alignment: { moral: 1 }, reputation: { distillers: -1 }, flags: [severin_ally, confessed_spiral] }
    - id: show_the_thick_glass
      label: วางแก้วครอบหนาสองนิ้วที่เขาส่งมาให้หลังวันสาธิตบนโต๊ะไต่สวน
      requires: { flag: warned_severin }
      text: |
        ทั้งห้องรู้ว่าแก้วแบบนี้มาจากโรงงานไหน ตราของบ้านเซเวรินประทับอยู่ที่ขอบ {name}บอกคณะไต่สวนว่าเขารู้มาตั้งแต่วันนั้นว่าแก้วต้องหนา เขาส่งแก้วนี้มาให้{name}เองโดยไม่มีจดหมาย แต่ตะเกียงที่ขายได้ต้องสวย

        สมาคมตัดสินว่าแตกเพราะแบบ คืนนั้นเซเวรินมาเคาะประตูโรงช่างของ{name} บอกว่าพ่อของเขาเป็นคนสั่งให้แก้วบาง เพราะแก้วบางขายได้ราคากว่า ปีต่อมาตะเกียงไส้เกลียวรุ่นใหม่ของเขาแก้วหนาขึ้นเท่านิ้วหนึ่ง สวยน้อยลง ขายได้น้อยลง ไม่มีต้นไหนแตกอีก
      effects: { stats: { INT: 1 }, flags: [severin_ally, severin_rose] }

- id: adult.mid_wizard_blind_notebooks
  stage: adult
  scene: home
  weight: 30
  when:
    age: [25, 32]
    class: wizard
  text: |
    คนของหนูท่าเอาห่อผ้ามาวางบนโต๊ะในห้องของ{name}ตอนค่ำ ข้างในเป็นสมุดปกหนังสามเล่ม ขอบกระดาษดำเพราะมือคนเปิด เขาบอกว่าเป็นของนักดาราศาสตร์หลวงคนที่เมื่อฤดูหนาวก่อนเอาเข็มเย็บผ้าแทงตาตัวเองทั้งสองข้างในห้องส่องดาว หอดูดาวหลวงเก็บข้าวของของเขาไปหมด เหลือสามเล่มนี้ที่หลานชายของเขาเอาออกมาขาย ราคาแปดเหรียญ

    {name}เปิดหน้าแรก ข้างในมีแต่ตัวเลข ตารางต่อตาราง ตำแหน่งดาว วันที่ ความสว่าง ลายมือเรียบร้อยตั้งแต่ต้นเล่มแรก กลางเล่มที่สองลายมือเริ่มเอียง เล่มที่สามตัวเลขใหญ่ขึ้นจนหน้าหนึ่งใส่ได้แค่สองแถว ตารางท้ายเล่มที่สามมีวันที่ของปีที่ยังมาไม่ถึง
  choices:
    - id: buy_and_read
      label: จ่ายแปดเหรียญ เก็บไว้อ่านเองทั้งสามเล่ม
      requires: { min_gold: 8 }
      text: |
        {name}อ่านสามเล่มจบในสิบคืน ดาวทางทิศเหนือเพิ่มขึ้นทุกปี เพิ่มเท่ากันทุกปีจนตัวเลขเรียงเป็นขั้นบันได ในตารางของปีที่ยังมาไม่ถึง ตัวเลขยังขึ้นต่อ ขึ้นไปจนถึงปีหนึ่งแล้วมีวงกลมหมึกหนาล้อมไว้ ไม่มีคำอธิบาย

        คืนที่สิบ{name}ออกไปยืนนอกหน้าต่าง นับดาวทางทิศเหนือ เทียบกับตารางของปีนี้ ไม่ตรง นับใหม่ ก็ยังไม่ตรง ตัวเลขที่{name}นับได้ตรงกับตารางของปีหน้า
      effects: { gold: -8, stats: { INT: 1 }, world: { star: 1 }, items: [blind_astronomer_notes], flags: [read_blind_notes] }
    - id: buy_and_burn
      label: จ่ายแปดเหรียญ แล้วเผาทั้งสามเล่มในเตา
      requires: { min_gold: 8 }
      text: |
        {name}ไม่เปิดดูอีก วางสมุดเล่มแรกลงในเตา ปกหนังไหม้ช้า ขอบกระดาษดำม้วนเข้าหากัน ตัวเลขบนหน้าที่เปิดค้างยังอ่านได้จนนาทีสุดท้าย เล่มที่สองกับเล่มที่สามตามลงไป

        คนของหนูท่ายืนดูอยู่ที่ประตูจนเล่มสุดท้ายเหลือแต่ขี้เถ้า แล้วบอกว่าหลานชายของคนตาบอดคนนั้นก็อยากให้เผา แต่ไม่กล้าทำเอง {name}นั่งดูเตาจนไฟมอด ขี้เถ้ากระดาษบางแผ่นยังมีรอยตัวเลขสีขาวอยู่บนนั้น
      effects: { gold: -8, world: { star: -1 }, flags: [burned_blind_notes] }
    - id: read_the_last_page
      label: ไม่ซื้อ ขออ่านแค่หน้าสุดท้ายก่อนเขาห่อกลับไป
      check: { stat: INT, dc: 14 }
      success:
        text: |
          หน้าสุดท้ายของเล่มที่สามไม่มีตาราง มีประโยคเดียว ตัวหนังสือใหญ่จนเกือบเต็มหน้า ลายมือที่เอียงลงขวาจนบรรทัดตกขอบกระดาษ ข้านับมันมาสิบปี มันเพิ่งเริ่มนับข้า

          {name}ปิดสมุด ส่งคืนให้คนของหนูท่า เขาห่อผ้ากลับแล้วออกไป คืนนั้น{name}ปิดหน้าต่างก่อนจุดตะเกียง เป็นครั้งแรกตั้งแต่เช่าห้องนี้มา
        effects: { stats: { INT: 1 }, flags: [read_blind_last_page] }
      failure:
        text: |
          ลายมือหน้าสุดท้ายเอียงจนตัวหนังสือซ้อนกัน {name}อ่านออกแค่คำแรกกับคำสุดท้าย คำแรกคือข้า คำสุดท้ายคือข้า คนของหนูท่าดึงสมุดกลับไปก่อนที่{name}จะไล่สายตาไปถึงบรรทัดกลาง

          เขาบอกว่าคนไม่จ่ายเงินไม่ได้อ่านทั้งหน้า แล้วห่อผ้ากลับ {name}นั่งนึกถึงคำที่อยู่ระหว่างข้ากับข้าจนดึก
        effects: { flags: [saw_blind_notes] }
    - id: send_to_institute
      label: บอกให้เขาเอาไปขายสถาบันเวทหลวง แล้วรับค่าชี้ทางสองเหรียญ
      text: |
        สถาบันเวทหลวงจ่ายสิบเหรียญ ไม่ต่อราคา ไม่ถามว่าได้มาจากไหน คนของหนูท่าแบ่งให้{name}สองเหรียญตามที่ตกลง แล้วบ่นว่าเดินไปครึ่งเมืองเพื่อได้เงินเท่ากับขายที่ห้องนี้

        สามเดือนต่อมามีนักวิชาการของสถาบันมาเคาะประตูห้อง{name} ถามว่าก่อนสมุดจะไปถึงสถาบัน{name}ได้เปิดอ่านหน้าไหนบ้าง เขาถามคำถามเดิมสามครั้ง ด้วยคำที่ต่างกันทุกครั้ง
      effects: { gold: 2, reputation: { royal_institute: 1, dock_rats: -1 }, flags: [sold_blind_notes] }

- id: adult.mid_wizard_severin_last_lamp
  stage: adult
  scene: workshop
  weight: 30
  when:
    age: [33, 40]
    class: wizard
  text: |
    เซเวรินส่งคนรับใช้มาตาม{name}ไปที่โรงช่างหลังโรงงานแก้วของบ้านเขา ช่างเวททุกคนในเมืองรู้จักชื่อเขามาตั้งแต่หนุ่ม เขาอายุไล่เลี่ยกับ{name} แต่ดูแก่กว่าสิบปี ตาทั้งสองข้างขุ่นเป็นสีน้ำนม ยี่สิบปีที่จ้องเปลวน้ำค้างดาวในระยะคืบเดียว ตอนนี้เขามองเห็นแค่แสงกับเงา คนรับใช้บอกว่าเดือนที่แล้วเขาตกบันไดโรงช่างสองครั้ง

    บนโต๊ะมีตะเกียงที่ยังทำไม่เสร็จต้นหนึ่ง ถ้าเสร็จ ตะเกียงต้นนี้จะกินน้ำค้างดาวแค่หนึ่งในสี่ของตะเกียงทั่วไป คนจนทั้งเมืองจะจุดตะเกียงได้ทั้งคืนโดยไม่ต้องเลือกระหว่างแสงกับข้าว เขาต้องการตาของใครสักคนที่รู้งานพอจะทำต่อจากมือเขา

    เขาบอกว่าในเมืองนี้มีคนแบบนั้นอยู่คนเดียว และเขาไม่เคยอยากให้คนคนนั้นเข้ามาในโรงช่างนี้
  choices:
    - id: finish_it
      label: นั่งลงทำต่อจากที่เขาค้างไว้ ให้เขาบอกทีละขั้น
      check: { stat: INT, dc: 14 }
      success:
        text: |
          สิบเจ็ดคืน เซเวรินนั่งข้างโต๊ะ บอกทีละขั้นด้วยเสียงเรียบ {name}ทำตามบ้าง ไม่ทำตามบ้าง ทั้งสองเถียงกันทุกคืนจนคนรับใช้ต้องมาเคาะประตูบอกว่าดึกแล้ว คืนที่สิบเจ็ดไฟติด นิ่ง ไม่สั่น ขวดน้ำค้างที่เติมไว้ตอนหัวค่ำลดลงแค่หนึ่งในสี่ตอนรุ่งสาง

          เซเวรินยื่นมือออกมาอังเหนือเปลว แล้วถามว่ามันสีอะไร {name}บอกว่าฟ้าเหมือนตะเกียงทุกต้น แต่นิ่งกว่า เขาบอกว่าดี เขาอยากให้มันเหมือนตะเกียงทุกต้น สมาคมโรงกลั่นจดแบบนี้ไว้ในชื่อของทั้งสองคน ชื่อเซเวรินขึ้นก่อน เพราะเขาเป็นคนสั่งให้เขียนแบบนั้น
        effects: { stats: { INT: 1 }, reputation: { distillers: 1 }, flags: [severin_reconciled, finished_quarter_lamp] }
      failure:
        text: |
          คืนที่สิบ แก้วครอบแตกในมือ{name}ตอนที่ไฟเพิ่งติด เศษแก้วบาดฝ่ามือเป็นรอยยาว เซเวรินได้ยินเสียง เขาบอกให้กลับบ้านไปก่อน แล้วค่อยมาใหม่ ไม่ได้บอกว่าเมื่อไร

          สามสัปดาห์ต่อมาเขาตกบันไดโรงช่างอีกครั้ง ครั้งนี้ไม่ลุกขึ้น คนรับใช้เอาตะเกียงที่ยังไม่เสร็จมาส่งให้{name} พร้อมกระดาษแผ่นหนึ่ง ลายมือเอียงจนเกือบอ่านไม่ออก มีอยู่บรรทัดเดียว ไฟที่สั่นแบบนี้แปลว่าลมเข้าทางฐาน
        effects: { hp: -1, flags: [severin_died, has_severins_lamp] }
    - id: refuse_the_lamp
      label: ไม่ทำ งานที่เขาค้างไว้ให้เขาทำเอง
      text: |
        เซเวรินหัวเราะ เป็นเสียงหัวเราะที่{name}ไม่เคยได้ยินจากเขามาก่อน เขาบอกว่าคิดไว้แล้วว่าจะได้คำตอบนี้ และดีใจที่ไม่ได้เดาผิด

        คืนนั้นเขาเผาแบบทั้งหมดในเตาหลอมแก้วของโรงงาน เช้าวันต่อมาคนรับใช้มาบอก{name}ว่าเขาจุดตะเกียงไส้เกลียวต้นแรกที่เคยทำเมื่อยังหนุ่มทิ้งไว้ทั้งคืน นั่งดูแสงที่เขามองไม่ค่อยเห็นจนเช้า
      effects: { alignment: { law: 1 }, flags: [severin_burned_design] }
    - id: confess_the_old_spiral
      label: บอกเขาว่าเกลียวในตะเกียงของ{name}ทุกต้นมาจากโต๊ะของเขาในวันสาธิต
      requires: { flag: stole_from_severin }
      text: |
        เซเวรินบอกว่าเขารู้มาตั้งแต่วันนั้น เขาเห็นเกลียวของตัวเองหมุนอยู่ในแก้วครอบของ{name}ตอนที่คณะกรรมการประกาศผล และรู้ตั้งแต่ตอนนั้นว่าวันหนึ่งจะต้องมีคนทำมันให้ดีกว่าที่เขาทำ เขาแค่ไม่อยากให้เป็น{name}

        {name}ทำต่อสิบสองคืน ไม่มีคืนไหนเถียงกัน เพราะเกลียวในตะเกียงต้นนี้เป็นของทั้งสองคนมาตั้งแต่ต้น คืนที่สิบสองไฟติดนิ่ง เซเวรินอังมือเหนือเปลว แล้วบอกว่าคราวนี้ไม่ต้องลอก เขาให้
      effects: { stats: { INT: 1 }, flags: [severin_reconciled, finished_quarter_lamp] }
    - id: ask_his_years
      label: ถามเขาว่าตั้งแต่เรื่องเศษแก้ววันนั้น เขาทำอะไรมาบ้าง
      requires: { flag: severin_fell }
      text: |
        ตั้งแต่สมาคมสั่งเก็บตะเกียงไส้เกลียว โรงงานแก้วของบ้านเขาก็ขายออกไปทีละโรง พ่อของเขาตาย พี่ชายย้ายไปเปิดโรงแก้วที่เมืองอื่น เขาเหลือโรงช่างหลังนี้หลังเดียว สิบปีที่ผ่านมาเขาทำตะเกียงต้นนี้ต้นเดียว แก้วครอบหนาเท่าข้อนิ้วตั้งแต่ต้นแรกที่ลองทำ

        เขาบอกว่าวันนั้น{name}อ่านเศษแก้วไม่ผิดสักชิ้น เขารู้ เขาอ่านเองทีหลังอีกสามรอบ แล้ววางมือของ{name}ลงบนไส้ตะเกียงที่ยังไม่เสร็จ ไม่ได้ถามว่าจะทำไหม
      effects: { alignment: { moral: 1 }, flags: [severin_reconciled] }

- id: adult.mid_wizard_thinning_blood
  stage: adult
  scene: home
  weight: 30
  when:
    age: [33, 40]
    class: wizard
  text: |
    เลือดกำเดาเคยไหลเฉพาะตอนที่{name}ใช้เวทเกินตัว ปีนี้มันไหลตอนจุดเทียนด้วยคาถาเล็กที่สุดที่{name}รู้ ไหลตอนกินข้าว ไหลตอนนอนหลับ ตื่นมาปลอกหมอนเป็นสีน้ำตาล ต้องซักทุกวันจนผ้าบาง

    หมอที่ย่านตลาดใช้แว่นส่องเข้าไปในตาของ{name}ทีละข้าง แล้วบอกว่าเส้นเลือดหลังตาบางลงเหมือนผ้าที่ซักมายี่สิบปี เวทที่ผ่านตัวคนต้องผ่านเส้นพวกนี้ทุกครั้ง คนที่ร่ายเวทมาทั้งชีวิตจะมาถึงวันนี้ทุกคน เร็วหรือช้าเท่านั้น หมอไม่บอกว่าหลังจากวันนี้แล้วจะเป็นอย่างไร
  choices:
    - id: keep_casting
      label: ใช้เวทต่อเหมือนเดิม ร่างกายรับไม่ไหวเมื่อไรค่อยว่ากัน
      check: { stat: CON, dc: 14 }
      success:
        text: |
          ทั้งปี{name}ใช้เวทเท่าเดิม ยกของเท่าเดิม จุดไฟในฝนเท่าเดิม เลือดกำเดายังไหลบ้าง แต่ไม่ไหลบ่อยขึ้น ปลอกหมอนสีน้ำตาลลดลงเหลือสัปดาห์ละผืน

          ปลายปีหมอส่องตาอีกครั้ง บอกว่าเส้นเลือดหลังตายังบางเท่าเดิม ไม่บางลง หมอดูแปลกใจ {name}ไม่บอกหมอว่ากินตับไก่ต้มทุกเย็นตามที่ยายในถิ่นเกิดเคยบอกว่าแก้เลือดจาง
        effects: { stats: { CON: 1 }, flags: [kept_casting] }
      failure:
        text: |
          เดือนที่สาม ตาซ้ายเริ่มเห็นจุดดำลอยอยู่ข้างหนึ่งเหมือนแมลงบินผ่าน เดือนที่ห้า จุดนั้นไม่ลอยไปไหนอีก เดือนที่หก จุดดำกินตาซ้ายไปครึ่งหนึ่ง

          {name}ยังใช้เวทได้ ยกของได้ จุดไฟได้ แต่ต้องหันหน้าไปให้ตาขวามองทุกครั้ง หมอบอกว่าส่วนที่ดำแล้วไม่กลับมา ส่วนที่ยังเห็นจะอยู่ได้นานเท่าที่{name}ไม่ฝืนมัน
        effects: { hp: -2, flags: [wizard_left_eye_dim, kept_casting] }
    - id: build_instead
      label: เลิกร่ายด้วยตัวเอง หันไปทำเครื่องที่ใช้หลอดน้ำค้างดาวแทนเส้นเลือดหลังตา
      check: { stat: INT, dc: 12 }
      success:
        text: |
          {name}ฝังหลอดน้ำค้างดาวเล็กๆ ลงในด้ามจับไม้ ให้เวทผ่านหลอดแทนผ่านเส้นเลือดหลังตา เครื่องแรกยกหีบได้แค่ใบเดียว เครื่องที่สามยกคานได้ งานช้าลงครึ่งหนึ่ง ต้องเติมน้ำค้างทุกเช้า แต่ไม่มีเลือดอีก

          ห้องของ{name}มีเฟืองกับขวดแก้ววางจนไม่มีที่นั่ง ปลอกหมอนกลับมาเป็นสีขาว
        effects: { stats: { INT: 1 }, flags: [wizard_turned_maker] }
      failure:
        text: |
          เครื่องแรกที่{name}ทำกินน้ำค้างดาวหมดขวดในครึ่งคืน ไม่ยกอะไรขึ้นสักอย่าง เครื่องที่สองร้อนจนด้ามไม้ไหม้มือ {name}ทิ้งมันไว้ในหีบใต้เตียงกับเครื่องแรก

          เดือนต่อมา{name}กลับไปร่ายเหมือนเดิม ปลอกหมอนกลับไปเป็นสีน้ำตาล
        effects: { hp: -1, flags: [kept_casting] }
    - id: take_an_apprentice
      label: หาเด็กสักคนมาสอน ให้ใช้หลังตาของคนหนุ่มแทน
      text: |
        ลูกสาวช่างตีเหล็กข้างบ้านอายุสิบสาม มือเร็ว จำคาถาได้ตั้งแต่ได้ยินครั้งแรก {name}สอนทุกอย่างที่รู้ ตั้งแต่คาถาจุดเทียนไปจนถึงคาถายกคาน และสอนเรื่องเลือดกำเดาด้วยตั้งแต่วันแรก เพราะไม่มีใครเคยสอนเรื่องนี้ให้{name}

        ปลายปี เด็กหญิงยกหีบไม้ได้ทั้งใบด้วยคาถาเดียว เลือดกำเดาไหลลงมาถึงริมฝีปาก นางเช็ดมันด้วยแขนเสื้อ แล้วถามว่าครั้งต่อไปมันจะไหลเมื่อไร
      effects: { alignment: { moral: 1 }, flags: [took_wizard_apprentice] }
    - id: tell_the_stair
      label: เล่าให้หมอฟังเรื่องบันไดในฝันที่ฝันมาตั้งแต่ยกคานไฟไหม้
      requires: { flag: dreamed_endless_stair, not_flags: [race_tiefling] }
      text: |
        หมอวางแว่นส่องลง หยิบสมุดบันทึกคนไข้ออกมาจากลิ้นชัก เปิดให้ดูสามหน้า คนไข้สามคนในย่านเดียวกันฝันเรื่องบันไดที่เดินไม่สุด ทั้งสามคนเป็นคนงานโรงกลั่น ไม่มีใครเคยร่ายเวทแม้แต่คาถาเดียว

        หมอเขียนชื่อ{name}ลงหน้าที่สี่ ใต้ชื่อคนงานโรงกลั่นคนที่สาม แล้วถามว่าในฝัน{name}เดินขึ้นหรือเดินลง {name}ตอบว่าลง หมอเขียนคำนั้นลงไป แล้วปิดสมุดโดยไม่ให้ดูว่าสามบรรทัดข้างบนเขียนว่าอะไร
      effects: { world: { star: 1 }, flags: [doctor_listed_stair_dream] }

# ---------- นักบวช ----------
- id: adult.mid_cleric_lowen_glass_ward
  stage: adult
  scene: temple
  weight: 30
  when:
    age: [25, 32]
    class: cleric
  text: |
    วิหารใหญ่ส่ง{name}ลงไปเขียนรายงานเรื่องวิหาร{god}หลังเล็กหลังหนึ่งในย่านโรงกลั่น นักบวชที่ดูแลวิหารหลังนั้นชื่อโลเวน ปฏิญาณตนปีเดียวกับ{name} คนในวิหารใหญ่พูดถึงนางสองแบบ แบบหนึ่งว่านางพูดเก่งที่สุดในรุ่น อีกแบบว่านางพูดเก่งด้วยปากของคนอื่น

    สามปีมานี้โลเวนเลิกเก็บค่าตะเกียงจากคนที่มาสวด นางปูเสื่อจนเต็มพื้นวิหาร ให้คนผิวแก้วมานอน คนที่แผ่นใสลามขึ้นมาจนถึงคอ หมอไม่รับ บ้านไม่รับ ข้างใต้ผิวของพวกเขามีแสงฟ้าเต้นอยู่ทั้งคืน วิหารใหญ่ไม่ได้เงินค่าตะเกียงจากวิหารหลังนี้มาสามปี และอยากรู้ว่าเพราะอะไร

    โลเวนยืนรอ{name}ที่ประตู ผมยาวเกล้าสูงเหมือนสมัยปฏิญาณตน แขนเสื้อพับขึ้นถึงศอก
  choices:
    - id: write_it_true
      label: เขียนตามที่เห็น ทุกบรรทัด
      text: |
        {name}เขียนว่าวิหารหลังนี้ไม่เก็บค่าตะเกียง ไม่สวดตามเวลา และมีเสื่อสามสิบเอ็ดผืนบนพื้นโถง คนผิวแก้วนอนอยู่ยี่สิบสี่คน รายงานยาวสามหน้า ไม่มีบรรทัดไหนผิด

        วิหารใหญ่อ่านแล้วเรียกโลเวนขึ้นไปชี้แจง แล้วส่งนักบวชคนใหม่ลงมาดูแลวิหารหลังนั้นแทน นักบวชคนใหม่ม้วนเสื่อเก็บในวันแรก วิหารใหญ่ส่งค่าเดินทางมาให้{name}สองเหรียญ พร้อมจดหมายชมว่าเขียนชัดเจน
      effects: { gold: 2, alignment: { law: 1 }, flags: [lowen_fell, reported_lowen] }
    - id: write_for_her
      label: หาบรรทัดในคัมภีร์ที่รองรับสิ่งที่นางทำ ก่อนเขียนรายงาน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          บทที่เจ็ดของคัมภีร์{god}มีบรรทัดหนึ่งที่ไม่มีใครยกมาพูดในวิหารใหญ่มาสามชั่วคน วิหารเป็นของคนที่นอนอยู่ในวิหาร ไม่ใช่ของคนที่ส่งเงินมาสร้าง {name}เขียนบรรทัดนั้นไว้บนหัวกระดาษ แล้วเขียนรายงานที่เหลือให้ทุกบรรทัดชี้กลับขึ้นไปหามัน

          นักบวชอาวุโสอ่านแล้วไม่กล้าเรียกโลเวนขึ้นไป เพราะการเรียกนางขึ้นไปคือการบอกว่าบทที่เจ็ดผิด สองเดือนต่อมาวิหารใหญ่ส่งเงินมาซื้อเสื่อเพิ่มสิบผืน ไม่มีจดหมายแนบมาด้วย
        effects: { stats: { INT: 1 }, flags: [lowen_rose] }
      failure:
        text: |
          {name}จำบทที่เจ็ดผิดไปหนึ่งบรรทัด บรรทัดที่ยกมาพูดเรื่องการให้ทาน ไม่ใช่เรื่องการให้ที่นอน นักบวชอาวุโสส่งรายงานกลับมาพร้อมเส้นหมึกแดงใต้บรรทัดนั้น

          โลเวนต้องขึ้นไปชี้แจงเอง นางกลับลงมาพร้อมคำสั่งให้เก็บค่าตะเกียงเหมือนวิหารอื่น คืนนั้นนางนั่งนับเสื่อทีละผืน ยังไม่ได้ม้วนเก็บสักผืน
        effects: { flags: [lowen_fell] }
    - id: sit_the_night
      label: ยังไม่เขียนอะไร นั่งเฝ้าคนผิวแก้วกับนางหนึ่งคืนก่อน
      text: |
        คนผิวแก้วพูดตอนหลับ พูดถึงเรื่องที่ยังไม่เกิด พรุ่งนี้ฝนจะตกตอนบ่าย หม้อข้าวในบ้านริมคลองจะไหม้ ชายแก่คนหนึ่งบอกชื่อคนที่จะมาเคาะประตูก่อนรุ่งสาง ก่อนรุ่งสางมีคนมาเคาะจริง ลูกสาวของชายแก่คนนั้น นางเดินมาจากอีกเมืองสามวัน

        โลเวนนั่งข้าง{name}ทั้งคืน ตอนตีสี่นางบอกว่าคำตอบในวันรายงานตัวปีนั้นนางลอกมาจากหนังสือทุกคำ เพราะนางไม่มีคำตอบของตัวเอง ตอนนี้นางมีแล้ว แต่ไม่มีใครมาถาม ตอนเช้า{name}เขียนรายงานสั้นที่สุดเท่าที่เคยเขียนมา
      effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [lowen_ally, sat_glass_vigil] }
    - id: tell_her_about_that_day
      label: บอกนางว่าวันรายงานตัววันนั้น{name}เป็นคนชี้ว่านางลอกหนังสือ
      requires: { flag: exposed_lowen }
      text: |
        โลเวนบอกว่านางรู้ นางรู้ตั้งแต่ก่อนนักบวชอาวุโสจะวางปากกา หลังวันนั้นวิหารใหญ่ไม่ส่งนางกลับไปที่เดิม นางย้ายไปทุกที่ที่ไม่มีนักบวชคนไหนอยากไป จนมาถึงที่นี่

        นางบอกว่าถ้าไม่ใช่เพราะ{name} นางจะยังยืนพูดประโยคสวยๆ ของคนอื่นอยู่ในวิหารใหญ่ และไม่มีวันได้รู้ว่าคนผิวแก้วตัวเย็นแค่ไหนตอนจับมือ นางพา{name}เข้าไปในโถง ให้นั่งบนเสื่อผืนที่ใกล้ประตูที่สุด
      effects: { alignment: { moral: 1 }, flags: [lowen_ally, lowen_forgave] }

- id: adult.mid_cleric_god_goes_quiet
  stage: adult
  scene: home
  weight: 30
  when:
    age: [25, 32]
    class: cleric
  text: |
    ทุกเช้าตั้งแต่ปฏิญาณตน {name}สวดถึง{god}ก่อนกินข้าว และทุกเช้าจะมีอะไรสักอย่างตอบกลับมา ไม่ใช่เสียง เป็นความอุ่นที่กลางอก เหมือนมือของใครวางลงมาแล้วยกออก บางเช้าอุ่นมาก บางเช้าอุ่นนิดเดียว ไม่เคยไม่มีเลย

    สามเดือนมานี้ไม่มี {name}สวดเหมือนเดิม คำเดิม เวลาเดิม คุกเข่าบนพื้นกระดานแผ่นเดิมที่สึกเป็นรอยเข่า กลางอกว่าง คาถาปิดแผลที่เคยปิดแผลได้ในลมหายใจเดียว ตอนนี้ปิดได้แค่ครึ่งแผล นักบวชคนอื่นไม่มีใครบ่นเรื่องนี้ หรืออาจบ่นกันอยู่ในห้องของตัวเอง
  choices:
    - id: pray_through
      label: สวดต่อทุกเช้าไม่ข้ามสักวัน จนกว่าจะมีอะไรตอบกลับมา
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}นับวันด้วยรอยมีดบนขอบหน้าต่าง วันที่เก้าสิบสาม ตอนที่คำสวดเหลืออีกสองคำ กลางอกอุ่นขึ้นมานิดหนึ่ง เท่าปลายนิ้วแตะ แล้วหายไป วันที่เก้าสิบสี่ไม่มี วันที่เก้าสิบห้ามีอีก

          ไม่เท่าเดิม แต่มี {name}เลิกนับวันตอนที่รอยมีดบนขอบหน้าต่างครบสองแถว คาถาปิดแผลกลับมาปิดได้เกือบทั้งแผล
        effects: { stats: { CON: 1 }, flags: [prayed_through_silence] }
      failure:
        text: |
          ครึ่งปีผ่านไป เข่าทั้งสองข้างเป็นแผลด้านจากพื้นกระดาน กลางอกยังว่าง {name}ยังสวดต่อทุกเช้า ไม่ได้สวดเพราะเชื่อว่าจะมีคำตอบแล้ว สวดเพราะไม่รู้ว่าจะเอาเช้าไปทำอะไรแทน

          คนที่มาให้รักษาแผลเริ่มไปหานักบวชคนอื่น คนที่ยังมาให้{name}รักษา คือคนที่ไม่มีเงินไปหาคนอื่น
        effects: { hp: -1, flags: [god_stayed_quiet] }
    - id: walk_to_pillar
      label: ออกค่าเดินทางสามเหรียญ ไปวางมือบนเสาฟ้าของ{god}
      requires: { min_gold: 3 }
      text: |
        เสาฟ้าของ{god}ขึ้นจากลานหน้าวิหารใหญ่ หินสีกระดูกเรียบไม่มีรอยต่อ ยอดหายเข้าไปในเมฆ คนแสวงบุญมาวางมือบนเสาจนหินตรงระดับไหล่สึกเป็นแอ่งรูปฝ่ามือนับร้อย {name}ต่อแถวครึ่งวัน แล้ววางมือลงในแอ่งที่ว่าง

        หินเย็นอย่างที่ทุกคนเล่า เย็นกว่าลมเช้าที่พัดผ่านลาน ใต้ฝ่ามือมีอะไรเต้นช้าๆ ครั้งหนึ่ง แล้วไม่มีอีก {name}เดินกลับสามวัน เช้าวันที่สี่ กลางอกอุ่นขึ้นมานิดหนึ่งตอนสวด {name}ไม่รู้ว่าความอุ่นนั้นมาจาก{god} หรือมาจากการเดินทางทั้งหมดนั้น
      effects: { gold: -3, stats: { STR: 1 }, flags: [touched_gods_pillar] }
    - id: pray_without_name
      label: สวดโดยไม่เอ่ยชื่อ{god} ดูว่าจะมีใครตอบ
      requires: { not_flags: [race_tiefling] }
      text: |
        คืนนั้น{name}คุกเข่าบนพื้นกระดานแผ่นเดิม สวดถึงใครก็ได้ที่ฟังอยู่ คำตอบมาถึงก่อนสวดจบ ไม่อุ่น เย็น เย็นเหมือนน้ำค้างตอนรุ่งสาง และไม่ได้มาจากกลางอก ความเย็นนั้นลงมาจากข้างบน ผ่านหลังคา ผ่านกระหม่อม

        คืนนั้น{name}ฝันถึงบันไดหินที่ขึ้นไปบนฟ้า ตอนเช้าคาถาปิดแผลปิดได้ทั้งแผลเป็นครั้งแรกในรอบสามเดือน แผลที่ปิดแล้วมีประกายฟ้าจางๆ อยู่ใต้ผิว คนไข้ไม่ทันเห็น {name}เห็น
      effects: { alignment: { law: -1 }, world: { star: 1 }, flags: [answered_from_above] }
    - id: pray_without_name_marked
      label: สวดโดยไม่เอ่ยชื่อ{god} ดูว่าจะมีใครตอบ
      requires: { trait: demon_mark }
      text: |
        คืนนั้น{name}คุกเข่าบนพื้นกระดานแผ่นเดิม สวดถึงใครก็ได้ที่ฟังอยู่ ไม่มีอะไรลงมาจากข้างบน ข้างบนเงียบเหมือนเดิม แต่ใต้พื้นกระดานมีเสียง ทุ้มต่ำ ลึกลงไปไกลกว่าใต้ถุนบ้าน ไกลกว่าใต้ดิน เสียงนั้นยังไม่เป็นคำ ฟังเหมือนคนกระแอมก่อนจะพูด

        {name}ลุกขึ้นก่อนเสียงนั้นจะพูดออกมา โคนเขาทั้งสองข้างร้อนผ่าวไปจนเช้า วันนั้นคาถาปิดแผลยังปิดได้แค่ครึ่งแผลเหมือนเดิม
      effects: { world: { demon: 1 }, flags: [deep_voice_offered] }
    - id: count_the_years
      label: นับเรื่องที่ทำมาหลายปีนี้ ทีละเรื่อง ว่าเรื่องไหน{god}จะไม่ทำ
      requires: { flag: cleric_drift }
      text: |
        {name}เขียนลงกระดาษ เรื่องละบรรทัด ตั้งแต่ปีแรกที่ออกจากวิหาร กระดาษหมดหนึ่งแผ่น ต้องขึ้นแผ่นที่สอง บางเรื่องจำได้ชัดจนได้กลิ่นห้องที่มันเกิด บางเรื่องจำได้แค่ว่าวันนั้นฝนตก

        {name}อ่านทวนสองรอบ แล้วพับกระดาษเก็บไว้ใต้พื้นกระดานแผ่นที่คุกเข่าทุกเช้า ไม่เผา เช้าวันต่อมากลางอกยังว่าง แต่{name}รู้แล้วว่าว่างตั้งแต่บรรทัดไหน
      effects: { stats: { INT: 1 }, flags: [knows_own_drift] }

- id: adult.mid_cleric_lowen_trial
  stage: adult
  scene: temple
  weight: 30
  when:
    age: [33, 40]
    class: cleric
  text: |
    นักบวชอาวุโสสิบสองคนนั่งเรียงกันหลังโต๊ะยาวในโถงวิหารใหญ่ โลเวนยืนอยู่หน้าโต๊ะ นักบวชรุ่นเดียวกับ{name}ที่ทั้งวิหารรู้จักชื่อ ผมของนางขาวทั้งหัวแล้ว หลังมือซ้ายมีแผ่นใสขนาดเท่าเหรียญ ขึ้นมาในปีที่สิบที่นางอยู่ย่านโรงกลั่น

    ข้อหาของนางมีสามข้อ ไม่เก็บค่าตะเกียง ให้ที่นอนแก่คนที่หมอไม่รับ และสวดส่งคนตายโดยไม่ถามว่าคนนั้นนับถือใคร ถ้าผิดทั้งสามข้อ ศาลวิหารจะปลดตรา{god}ออกจากคอนาง

    ศาลเรียก{name}เป็นพยานคนที่สอง พยานคนแรกคือหมอของย่านโรงกลั่น เขาพูดไปแล้วว่านางไม่เคยเก็บเงินใครแม้แต่เหรียญเดียว นักบวชอาวุโสคนกลางถามว่า{name}รู้จักนางมานานแค่ไหน แล้วรอ
  choices:
    - id: speak_for_her
      label: พูดแทนนาง ด้วยตัวเลข ไม่ใช่ด้วยคัมภีร์
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}ไม่ยกคัมภีร์สักบรรทัด {name}นับให้ศาลฟังว่าก่อนวิหารหลังนั้นปูเสื่อ คนผิวแก้วในย่านโรงกลั่นตายข้างถนนปีละเท่าไร หลังจากนั้นเหลือเท่าไร คนที่มาตายบนเสื่อของนางตายพร้อมคนจับมือ และวิหารใหญ่ได้ชื่อนั้นไปทุกครั้งที่มีคนเล่า

          ศาลให้นางคงตราไว้ แต่ย้ายออกจากย่านโรงกลั่น ตอนเดินออกจากโถง โลเวนเดินผ่าน{name} แล้วแตะแขน{name}ด้วยมือข้างที่มีแผ่นใส แผ่นนั้นเย็นเหมือนแก้วจริงๆ
        effects: { stats: { INT: 1 }, flags: [lowen_kept_symbol, lowen_reconciled] }
      failure:
        text: |
          {name}พูดได้ครึ่งเรื่อง นักบวชอาวุโสคนกลางก็ยกมือขึ้น บอกว่าศาลไม่ได้ถามว่านางทำดีไหม ศาลถามว่านางทำผิดกฎไหม ศาลตัดสินปลดตรา

          โลเวนถอดตรา{god}ออกจากคอ วางบนโต๊ะยาวตรงหน้านักบวชอาวุโสคนกลาง แล้วเดินกลับไปย่านโรงกลั่นด้วยเท้า ปีต่อมา{name}ได้ข่าวว่าวิหารเล็กหลังนั้นยังปูเสื่อทุกคืน ไม่มีนักบวช มีแต่ผู้หญิงผมขาวคนหนึ่งที่จุดตะเกียงเอง
        effects: { flags: [lowen_stripped, lowen_reconciled] }
    - id: judge_by_book
      label: ตอบตามคัมภีร์ บอกศาลว่าทั้งสามข้อผิดกฎของวิหารจริง
      text: |
        {name}ตอบทีละข้อ ทุกข้อจริง ศาลปลดตราของนางก่อนเที่ยง โลเวนไม่ได้มองมาทาง{name} นางวางตราไว้บนโต๊ะแล้วเดินออกจากโถงไปเอง

        ลานหน้าวิหารใหญ่มีคนผิวแก้วยืนรออยู่สิบกว่าคน มาจากย่านโรงกลั่นตั้งแต่ก่อนรุ่งสาง ตอนนางเดินลงบันไดไปหาพวกเขา แสงฟ้าใต้ผิวของทุกคนเต้นพร้อมกัน
      effects: { alignment: { law: 1 }, flags: [lowen_stripped, testified_against_lowen] }
    - id: share_her_sentence
      label: บอกศาลว่าถ้าปลดตรานาง ก็ให้ปลดตราของ{name}ไปด้วย
      requires: { flag: lowen_ally }
      text: |
        นักบวชอาวุโสสิบสองคนเอนหัวเข้าหากัน ปรึกษากันนานจนตะเกียงในโถงต้องเติมน้ำค้าง ไม่มีใครในสิบสองคนอยากเป็นคนปลดตรานักบวชสองคนในวันเดียว และไม่มีใครอยากให้เรื่องนี้ไปถึงหูคนนอกวิหาร

        ศาลให้นางคงตรา และส่ง{name}ลงไปช่วยนางที่ย่านโรงกลั่นปีละหนึ่งเดือน ในคำตัดสินเขียนว่าเป็นโทษ โลเวนหัวเราะออกมากลางโถง หัวเราะจนนักบวชอาวุโสคนกลางต้องเคาะโต๊ะ
      effects: { alignment: { moral: 1 }, flags: [lowen_kept_symbol, lowen_reconciled, shared_lowens_sentence] }
    - id: rewrite_the_report
      label: บอกศาลว่ารายงานเมื่อหลายปีก่อนเป็นของ{name} และวันนี้{name}มีส่วนที่ไม่ได้เขียน
      requires: { flag: reported_lowen }
      text: |
        นักบวชอาวุโสคนกลางยกรายงานฉบับเก่าขึ้นมาจากกองเอกสาร สามหน้า ลายมือของ{name} {name}บอกว่าทุกบรรทัดในนั้นจริง แต่ไม่ครบ แล้วเล่าส่วนที่ไม่ได้เขียน เสื่อสามสิบเอ็ดผืน คนที่นอนอยู่บนนั้นยี่สิบสี่คน และไม่มีใครในยี่สิบสี่คนนั้นมีที่อื่นให้ไป

        ศาลยังปลดตรา แต่ให้นางอยู่วิหารหลังเล็กได้ในฐานะคนเฝ้า ไม่ใช่นักบวช ตอนออกจากโถง โลเวนบอก{name}ว่ารายงานฉบับแรกก็ไม่ผิด นางอ่านมันมาหลายรอบแล้ว ฉบับนี้แค่ยาวกว่า
      effects: { alignment: { moral: 1 }, flags: [lowen_stripped, lowen_reconciled] }

- id: adult.mid_cleric_lamp_tower
  stage: adult
  weight: 30
  when:
    age: [33, 40]
    class: cleric
  text: |
    สมาคมโรงกลั่นสร้างหอตะเกียงกลางเมือง สูงเท่าหอระฆังของวิหารใหญ่ ยอดหอมีจานรับดาวกว้างสิบศอก ข้างใต้จานแขวนตะเกียงฟ้าต้นใหญ่ที่สุดที่ใครในเมืองเคยเห็น พรุ่งนี้จะจุดเป็นครั้งแรก สมาคมขอให้นักบวชทุกวิหารในเมืองมาอวยพรคนละหนึ่งคำ วิหาร{god}ส่ง{name}มา

    หอยังไม่ทันจุด แมลงหึ่งก็มาแล้ว ผีเสื้อกลางคืนปีกใสเกาะจานรับดาวเป็นชั้นหนาเหมือนราขึ้นขนมปัง คนในย่านรอบหอบอกว่าสามคืนมานี้คนครึ่งย่านฝันเรื่องเดียวกัน บันไดหินที่ขึ้นไปบนฟ้า ขั้นบนสุดมีคนยืนรอ ไม่มีใครเห็นหน้า
  choices:
    - id: bless_it
      label: อวยพรตามที่สมาคมขอ
      text: |
        {name}ยืนเรียงกับนักบวชวิหารอื่นที่โคนหอ พูดคำอวยพรของวิหาร{god}หนึ่งคำ ผู้แทนสมาคมจ่ายค่าอวยพรสามเหรียญใส่ห่อผ้าสีฟ้า ยิ้มขอบคุณทุกคนเท่ากัน

        คืนนั้นหอจุด แสงฟ้าส่องไปถึงกำแพงเมืองทั้งสี่ทิศ ฝูงแมลงหึ่งบินขึ้นจากจานรับดาวพร้อมกัน วนรอบยอดหอเป็นวงช้าๆ ทั้งคืน คนในเมืองออกมายืนดูบนถนนจนเช้า ไม่มีใครกลับไปนอน
      effects: { gold: 3, reputation: { distillers: 1 }, world: { star: 1 }, flags: [blessed_lamp_tower] }
    - id: refuse_the_tower
      label: ไม่อวยพร บอกสมาคมให้รอจนแมลงไปหมดก่อน
      text: |
        ผู้แทนสมาคมจดชื่อ{name}ลงกระดาษ ขอบคุณเท่ากับที่ขอบคุณคนอื่น แล้วหันไปหานักบวชคนต่อไป หอจุดตามเวลาเดิม คำอวยพรของวิหาร{god}ไม่ได้อยู่ในนั้น นักบวชวิหารอื่นพูดยาวขึ้นนิดหนึ่งแทน

        เดือนต่อมาสมาคมเลิกบริจาคน้ำค้างดาวให้วิหาร{god}ในย่านนั้น ตะเกียงในโถงวิหารต้องดับตั้งแต่สามทุ่ม
      effects: { alignment: { law: -1 }, reputation: { distillers: -1 }, flags: [refused_lamp_tower] }
    - id: smoke_the_moths
      label: ขึ้นบันไดหอไปจุดกำยานรมควันไล่แมลงก่อนพิธี
      check: { stat: DEX, dc: 13, foe: star }
      success:
        text: |
          บันไดในหอมีสามร้อยกว่าขั้น วนรอบแกนเหล็ก {name}แบกกระถางกำยานขึ้นไปถึงขั้นบนสุดตอนตะวันตก ควันขาวลอยขึ้นไปใต้จานรับดาว ฝูงแมลงลอยออกจากจานทีละชั้นเหมือนผ้าคลุมที่มีคนค่อยๆ ดึงออก แล้วบินไปทางตะวันออก

          คืนนั้นหอจุดตามเวลา คนในย่านรอบหอนอนหลับยาวจนสาย ตื่นมาไม่มีใครจำได้ว่าฝันอะไร ผู้แทนสมาคมบ่นว่าจานรับดาวมีกลิ่นกำยานติดไปทั้งเดือน
        effects: { stats: { DEX: 1 }, world: { star: -1 }, flags: [smoked_tower_moths] }
      failure:
        text: |
          ควันกำยานลอยขึ้นไปถึงจานรับดาว ฝูงแมลงไม่บินหนี มันลงมาเกาะแขน เกาะคอ เกาะหน้า{name} ปีกใสเย็นเหมือนน้ำ กระพือพร้อมกันจนลมวูบผ่านหู {name}ปัดมือ ลื่นบันไดลงไปสามขั้น กระถางกำยานกลิ้งลงไปถึงชั้นล่าง

          หอจุดตามเวลา {name}นั่งพันข้อเท้าอยู่ที่โคนหอ ฟังคนในย่านเล่าความฝันเมื่อคืนให้กันฟังไปทั้งคืน ทุกคนเล่าเหมือนกัน
        effects: { hp: -2, flags: [failed_tower_moths] }
    - id: tell_the_dream
      label: บอกผู้แทนสมาคมว่าเมื่อคืน{name}ก็ฝันถึงบันไดนั้น
      requires: { not_flags: [race_tiefling] }
      text: |
        {name}ฝันเหมือนกัน บันไดหิน ขั้นบนสุด คนที่ยืนรอ ในฝันของ{name}คนนั้นเรียกชื่อ{name}ด้วยเสียงที่ไม่ได้มาจากปาก ผู้แทนสมาคมฟังแล้วยิ้ม ยิ้มคนละแบบกับที่ยิ้มให้นักบวชคนอื่น

        เขาบอกว่าเขาก็ฝัน ฝันทุกคืนมาสามปีแล้ว ตั้งแต่ก่อนหอนี้จะขึ้นโครง เขาไม่กลัว เขารอ แล้วยื่นกระดาษพับแผ่นเล็กให้{name} บนนั้นเขียนชื่อร้านหนังสือร้านหนึ่งในย่านขุนนาง กับวันในสัปดาห์ วันอัสเทล วันว่าง
      effects: { world: { star: 1 }, reputation: { star_listeners: 1 }, flags: [shared_tower_dream] }
    - id: ask_why_no_dream
      label: ถามยายขายขนมหน้าหอว่าทำไม{name}ไม่ฝันเหมือนคนอื่น
      requires: { trait: demon_mark }
      text: |
        ยายขายขนมเงยหน้าจากกระทะ เห็นตาของ{name}สะท้อนไฟจากเตาในแสงพลบค่ำ แกหัวเราะ บอกว่าคนมีเขาฝันถึงข้างล่างมาตั้งแต่สมัยปู่ย่าตายาย จะมาฝันถึงข้างบนได้ยังไง แกพูดเหมือนบอกว่าฝนตกแล้วถนนเปียก แล้วหันไปทอดขนมต่อ

        ผู้แทนสมาคมที่ยืนอยู่ห่างไปสองก้าวได้ยินทุกคำ เขาหันมามองหน้า{name} แล้วเขียนอะไรสั้นๆ ลงในกระดาษแผ่นเดียวกับที่จดชื่อนักบวช
      effects: { flags: [star_listener_noticed_you] }

# ---------- พราน ----------
- id: adult.mid_ranger_hasken_bear
  stage: adult
  weight: 30
  when:
    age: [25, 32]
    class: ranger
  text: |
    กระดานค่าหัวหน้าโรงเตี๊ยมติดกระดาษใหม่ หมีดำตัวผู้ หูขวาแหว่ง ลงมาจากเขาตั้งแต่ปลายฤดูฝน ฆ่าวัวไปเจ็ดตัวกับคนเลี้ยงวัวหนึ่งคน ค่าหัวสิบสองเหรียญ {name}ตามรอยมันขึ้นเขาไปจนถึงลานหินกลางเขาในวันที่สาม

    ฮัสเกนนั่งอยู่บนลานหินนั้นแล้ว หนวดเป็นสีเกลือ ธนูยาววางบนตัก พรานทุกคนในแถบนี้รู้จักชื่อเขา และรู้ว่าเขาไม่เคยกลับลงเขามือเปล่า เขาบอกว่าหมีตัวนี้อยู่ในถ้ำเหนือลานขึ้นไปห้าสิบก้าว หนังมันหนา หัวธนูต้องเข้าตาหรือเข้าคอเท่านั้น และไม่มีใครยิงเข้าตาหมีที่วิ่งเข้าใส่ได้ด้วยตัวคนเดียว
  choices:
    - id: you_shoot
      label: ให้เขาเดินไปล่อหน้าถ้ำ {name}ยิงจากหลังหิน
      check: { stat: DEX, dc: 14, foe: nature }
      success:
        text: |
          ฮัสเกนเดินขึ้นไปยืนหน้าปากถ้ำ เคาะธนูกับหินสามครั้ง หมีออกมาเร็วกว่าที่ตัวขนาดนั้นควรเร็ว วิ่งตรงเข้าหาเขา ลูกแรกของ{name}เข้าคอ ลูกที่สองเข้าตาซ้าย หมีล้มลงห่างจากปลายเท้าของเขาสามก้าว

          ฮัสเกนไม่ได้ถอยสักก้าวตลอดเวลานั้น เขาตัดหูขวาแหว่งของมันลงไปให้ร้านค่าหัว แบ่งเงินคนละหก แล้วบอกว่าคราวหน้าให้{name}เป็นคนเดินไปยืนหน้าถ้ำบ้าง
        effects: { stats: { DEX: 1 }, gold: 6, flags: [hasken_ally] }
      failure:
        text: |
          ลูกแรกของ{name}เข้าไหล่ หนังหนาจนหัวธนูจมไปแค่ครึ่ง หมีไม่หยุด ฮัสเกนหลบไม่ทัน อุ้งเท้าหน้าของมันลงที่ขาซ้ายของเขา ลูกที่สามของ{name}เข้าคอพอดี หมีล้มลงทับเขาครึ่งตัว

          ฮัสเกนรอด ขาซ้ายของเขาเดินกะเผลกไปตลอดชีวิต เขาแบ่งค่าหัวคนละหกเหมือนที่ตกลงกันไว้ ไม่บ่นสักคำ ตั้งแต่ฤดูนั้นพรานในแถบนี้ไม่เรียกเขาไปล่าตัวใหญ่ด้วยอีก
        effects: { gold: 6, flags: [hasken_fell, hasken_lamed] }
    - id: go_up_alone
      label: ไม่รอเขา ขึ้นไปซุ่มหน้าถ้ำคนเดียวทั้งคืน
      check: { stat: CON, dc: 14, foe: nature }
      success:
        text: |
          {name}นั่งนิ่งอยู่หลังหินหน้าปากถ้ำตั้งแต่บ่ายจนดึก ลมหนาวลงจากยอดเขาจนนิ้วแข็ง {name}เอามือซุกรักแร้ทีละข้างให้นิ้วยังงอได้ หมีออกมาตอนตีสี่ ช้า ง่วง ไม่ได้กลิ่นใครใต้ลม ลูกธนูเข้าตาจากระยะห้าก้าว

          {name}ลากหูขวาแหว่งลงเขาไปถึงร้านค่าหัวก่อนเที่ยง ได้สิบสองเหรียญเต็ม ฮัสเกนนั่งอยู่ในโรงเตี๊ยม ยกจอกให้หนึ่งครั้ง คืนนั้นคนในโรงเตี๊ยมเลิกเรียกเขาว่าพรานที่ดีที่สุดในถิ่น เขาได้ยิน
        effects: { stats: { CON: 1 }, gold: 12, flags: [hasken_fell] }
      failure:
        text: |
          ตีสามความหนาวทำให้{name}เผลอหลับไปครู่เดียว ตื่นมาพร้อมเสียงหายใจของหมีห่างไปไม่ถึงสามก้าว อุ้งเท้าของมันกวาดผ่านไหล่ {name}กลิ้งลงจากลานหินไปกระแทกโขดข้างล่าง

          ลูกธนูสองดอกจากข้างล่างตามมาก่อนหมีจะลงมาถึง ฮัสเกนยิงจากในความมืดโดยเห็นแค่เงา หมีตาย ค่าหัวเป็นของเขาทั้งก้อน เขาพาดแขนของ{name}ไว้บนไหล่ตัวเองพาลงเขา ตลอดทางเขาเล่าว่าเคยหลับหน้าถ้ำแบบนี้ครั้งหนึ่งตอนอายุยี่สิบ
        effects: { hp: -3, flags: [hasken_rose] }
    - id: let_him_choose
      label: ถามเขาว่าคราวนี้อยากเป็นคนยิงหรือคนล่อ
      requires: { flag: beat_hasken }
      text: |
        ฮัสเกนเลือกล่อ เขาบอกว่าตั้งแต่หมูป่าตัวนั้นเขาไม่ยิงอะไรที่วิ่งเข้าหาตัวเองแล้ว ตาไม่เหมือนเดิม มือก็ไม่เหมือนเดิม เขาไม่เคยบอกเรื่องนี้กับใครในโรงเตี๊ยม

        หมีล้มลงตรงหน้าเขา ลูกธนูของ{name}สองดอกอยู่ที่คอกับตา เขาแบ่งค่าหัวคนละหก แล้วบอกคนในโรงเตี๊ยมว่า{name}เป็นคนยิง ไม่ได้บอกว่าใครยืนหน้าถ้ำ
      effects: { stats: { DEX: 1 }, gold: 6, flags: [hasken_ally] }
    - id: follow_him
      label: ขอตามเขาไปดูว่าเขาทำยังไง ไม่ขอค่าหัว
      requires: { flag: lost_to_hasken }
      text: |
        ฮัสเกนไม่ได้เข้าถ้ำ เขาเดินอ้อมเขาไปอีกด้าน หาทางน้ำที่หมีลงมากินทุกเช้า แล้วนั่งรอใต้ลมสองวันสองคืน {name}นั่งข้างเขา ทั้งสองพูดกันไม่เกินวันละสามคำ หมีลงมาตอนเช้ามืดวันที่สาม ลูกธนูของเขาดอกเดียวเข้าตา

        เขาได้สิบสองเหรียญ แบ่งให้{name}สองเหรียญเป็นค่านั่งเงียบ ตลอดทางลงเขาเขาสอนวิธีอ่านรอยเท้าหลังฝน ทีละรอย พูดยาวกว่าสามวันที่ผ่านมารวมกัน
      effects: { stats: { DEX: 1 }, gold: 2, flags: [hasken_rose] }

- id: adult.mid_ranger_land_forgets
  stage: adult
  weight: 30
  when:
    age: [25, 32]
    class: ranger
  text: |
    ค่ายของบริษัทจากเมืองหลวงมาตั้งที่ตีนเขาตั้งแต่ปีก่อน ปีนี้ทางเดินที่{name}เดินมาตั้งแต่เริ่มเป็นพรานหายไปครึ่งหนึ่ง ทางหนึ่งกลายเป็นทางเกวียนกว้างสิบศอก อีกทางจมอยู่ใต้กองดินจากหลุมที่ขุดใหม่ ลำธารที่เคยใสจนเห็นก้อนกรวดกลายเป็นสีน้ำตาลอ่อน ปลาไม่ขึ้นมากินแมลงตอนเย็นแล้ว

    สัตว์ไม่ลงมาที่น้ำซับเดิม นกที่เคยร้องบอก{name}ว่ามีคนเดินมาก็ไม่อยู่ที่เดิม {name}เดินในถิ่นของตัวเองแล้วหลงทางเป็นครั้งแรกในชีวิต หลงอยู่ครึ่งวัน กว่าจะเจอหินก้อนที่จำได้ ก้อนที่เคยนั่งกินข้าวเที่ยงทุกครั้งที่ขึ้นเขา
  choices:
    - id: walk_it_again
      label: เดินถิ่นของตัวเองใหม่ทั้งหมด ทีละทาง เหมือนตอนเด็ก
      check: { stat: CON, dc: 13 }
      success:
        text: |
          สามเดือน{name}ออกจากบ้านก่อนแดดขึ้นทุกวัน เดินทีละทาง จำทีละที่ ทางเกวียนใหม่มีรอยสัตว์ข้ามตอนกลางคืน หลังกองดินมีน้ำซับใหม่ผุดขึ้นมาตรงที่น้ำเดิมไหลไปไม่ได้ สัตว์ย้ายไปกินน้ำที่นั่นตั้งแต่เดือนแรก นกย้ายไปเกาะชายคาโรงเก็บของของค่าย

          ปลายฤดู นกที่ชายคาโรงเก็บของร้องทุกครั้งที่มีคนเดินขึ้นเขา ร้องไม่เหมือนฝูงเดิม แต่{name}ฟังออกแล้วว่าเสียงไหนแปลว่าคน
        effects: { stats: { CON: 1 }, flags: [relearned_home_ground] }
      failure:
        text: |
          ทุกครั้งที่{name}จำทางใหม่ได้ ค่ายก็ขยายออกไปอีก ทางที่จำได้เมื่อเดือนก่อนกลายเป็นหลุมในเดือนนี้ น้ำซับที่เพิ่งเจอแห้งไปเพราะกองดินกองใหม่ {name}เดินจนรองเท้าขาดสองคู่

          ปลายปี{name}เลิกเดินขึ้นเขาด้านตะวันออก ไปเฉพาะทางที่ยังจำได้ ทางพวกนั้นเหลืออยู่สามทาง
        effects: { hp: -1, flags: [home_ground_silent] }
    - id: guide_the_company
      label: รับจ้างบริษัทเป็นคนนำทาง ฤดูละห้าเหรียญ
      text: |
        บริษัทอยากรู้ว่าทางไหนน้ำไม่ท่วมหน้าฝน ดินตรงไหนแน่นพอให้เกวียนบรรทุกหนักวิ่งผ่าน หลุมไหนขุดลงไปแล้วจะเจอน้ำก่อนเจอของที่ต้องการ {name}รู้ทุกข้อ ได้ห้าเหรียญตอนปลายฤดู

        ปีต่อมาทุกทางที่{name}ชี้ให้ มีทางเกวียนวิ่งทับ ส่วนทางที่{name}ไม่ได้ชี้ ยังเงียบอยู่ {name}เดินเฉพาะทางพวกนั้น
      effects: { gold: 5, stats: { INT: 1 }, alignment: { moral: -1 }, flags: [guided_the_company] }
    - id: move_the_stakes
      label: ถอนหลักเขตของค่ายตอนกลางคืน เอาไปปักผิดที่
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          หลักเขตของค่ายเป็นไม้ทาสีแดง ปักห่างกันห้าสิบก้าว {name}ถอนสี่สิบหลักในสองคืน ปักใหม่ให้เส้นเขตอ้อมไปทางหินดาน ตรงที่ขุดลงไปไม่ถึงศอกก็เจอหินแข็ง

          ค่ายขุดผิดที่ไปสามหลุมกว่าจะรู้ตัว เสียเวลาไปทั้งฤดู ฤดูนั้นลำธารใสขึ้นจนเห็นก้อนกรวดอีกครั้ง ปลาขึ้นมากินแมลงตอนเย็นได้สามสิบกว่าวัน
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [moved_company_stakes] }
      failure:
        text: |
          คนเฝ้าค่ายเลี้ยงหมาไว้สองตัว {name}ถอนหลักที่สามได้ หมาตัวแรกก็เห่า คนเฝ้าค่ายเห็นหน้าในแสงตะเกียงชัดพอจะบอกยามเมืองได้

          ยามเมืองปรับสี่เหรียญ ข้อหาทำลายของบริษัท หลักเขตทั้งสามหลักกลับไปปักที่เดิมตั้งแต่เช้า ทาสีแดงใหม่
        effects: { gold: -4, alignment: { law: -1 }, flags: [fined_for_stakes] }

- id: adult.mid_ranger_hasken_ravine
  stage: adult
  weight: 30
  when:
    age: [33, 40]
    class: ranger
  text: |
    หมาสีน้ำตาลหูพับตัวหนึ่งมาเห่าอยู่หน้าบ้านของ{name}ตั้งแต่ก่อนรุ่งสาง ปลอกคอหนังมีรอยมีดสลักชื่อเจ้าของ ฮัสเกน พรานเฒ่าที่ทุกคนในแถบนี้รู้จัก มันวิ่งไปสิบก้าว หันกลับมาเห่า แล้ววิ่งต่อ

    มันพา{name}ขึ้นเขาไปถึงหุบหินที่น้ำแข็งเกาะตามผนัง ฮัสเกนนอนอยู่ก้นหุบ ลึกเท่าบ้านสามหลังซ้อนกัน ขาขวาบิดไปทางที่ขาไม่ควรบิด ธนูยาวของเขาอยู่ใต้ตัว เขาตะโกนขึ้นมาว่ายังไม่ตาย แต่ถ้าคืนนี้ยังอยู่ข้างล่าง ก็คงตาย

    ตะวันเพิ่งพ้นสันเขา อีกไม่กี่ชั่วโมงน้ำแข็งบนผนังจะละลายเป็นน้ำ แล้วกลับเป็นน้ำแข็งอีกครั้งตอนค่ำ
  choices:
    - id: climb_down
      label: ปีนลงผนังหุบที่มีน้ำแข็งเกาะ แบกเขาขึ้นมาเอง พลาดก็ตกลงไปตายทั้งคู่
      check: { stat: DEX, dc: 8 }
      success:
        text: |
          {name}ปีนลงทีละมือ น้ำแข็งแตกใต้ปลายนิ้วสองครั้ง ทั้งสองครั้งเท้ายังหาที่วางเจอ ถึงก้นหุบตอนแดดเริ่มส่องลงมา {name}มัดเขาไว้กับหลังด้วยสายธนูกับเชือกผูกรองเท้า แล้วปีนกลับขึ้นไปทางเดิม หมาสีน้ำตาลวิ่งไปมาอยู่บนขอบหุบ เห่าทุกครั้งที่มือของ{name}หลุด

          หมอต่อขาให้ ฮัสเกนเดินได้ แต่ขึ้นเขาไม่ได้อีก เดือนต่อมาหลานของเขาเอาธนูยาวมาให้{name} ไม้คันธนูดำเพราะมือคนคนเดียวจับมาสี่สิบปี หลานบอกว่าปู่ฝากมาบอกว่าคันธนูยังยิงได้อีกสี่สิบปี ขอให้มือคนยิงอยู่ได้นานเท่ามัน
        effects: { hp: -2, stats: { DEX: 1 }, items: [hasken_longbow], flags: [hasken_saved, hasken_retired] }
      failure:
        text: |
          ครึ่งทางลง น้ำแข็งแผ่นที่{name}เหยียบอยู่หลุดออกมาจากผนังทั้งแผ่น ไม่มีอะไรให้จับ {name}ร่วงลงไปถึงก้นหุบก่อนจะทันร้อง

          ฮัสเกนยังมีชีวิตตอนคนจากหมู่บ้านมาถึงในตอนบ่าย หมาสีน้ำตาลวิ่งลงไปตามคนมาเอง คนในหมู่บ้านดึงเขาขึ้นมาด้วยเชือกก่อน แล้วค่อยลงไปเอาร่างของ{name} ฮัสเกนขอให้วางร่างนั้นไว้ข้างเขาบนเกวียนตลอดทางลงเขา
        effects: { die: true, flags: [died_in_haskens_ravine, hasken_saved] }
    - id: run_for_rope
      label: วิ่งลงเขาไปเอาเชือกกับคนจากหมู่บ้าน ให้ทันก่อนค่ำ
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}วิ่งลงเขาไม่หยุดพัก ขาสั่นตั้งแต่ครึ่งทาง ปอดแสบเหมือนสูดควัน ถึงหมู่บ้านตอนเที่ยง กลับขึ้นมาพร้อมคนหกคนกับเชือกยาวสามม้วนก่อนตะวันตก น้ำแข็งบนผนังยังไม่ทันกลับมาเกาะ

          คนหกคนดึงฮัสเกนขึ้นมาทีละศอก เขาด่าทุกคนตั้งแต่ตัวโผล่พ้นขอบหุบ ขาขวาหายดี แต่เดินไม่เหมือนเดิม เขาเลิกขึ้นเขา ไปนั่งหน้าโรงเตี๊ยมทุกเช้า ชี้บอกพรานหนุ่มว่าเมฆแบบไหนแปลว่าอะไร
        effects: { stats: { CON: 1 }, flags: [hasken_saved, hasken_retired] }
      failure:
        text: |
          ตะวันตกก่อนที่{name}กับคนจากหมู่บ้านจะกลับขึ้นมาถึง น้ำแข็งเกาะผนังหุบอีกครั้ง {name}ตะโกนลงไปในความมืด ไม่มีเสียงตอบ

          เช้าวันต่อมาคนในหมู่บ้านดึงร่างของเขาขึ้นมา ธนูยาวยังอยู่ใต้ตัว หมาสีน้ำตาลไม่ยอมไปกับหลานของเขา มันเดินตาม{name}กลับบ้าน นอนหน้าประตูทุกคืนจากวันนั้น
        effects: { flags: [hasken_died, has_haskens_dog] }
    - id: two_note_whistle
      label: ผิวปากสองเสียงแบบที่เขาเคยใช้เรียก ให้เขาบอกทางลงที่ไม่มีน้ำแข็ง
      requires: { flag: hasken_ally }
      text: |
        เสียงผิวปากตอบกลับขึ้นมาสองเสียง ช้ากว่าเดิม แต่ยังเป็นเสียงเดิม ฮัสเกนตะโกนบอกทาง ด้านทิศเหนือของหุบมีร่องหินที่แดดไม่ส่องถึง น้ำแข็งไม่เกาะเพราะลมพัดผ่านทั้งวัน เขารู้เพราะเคยปีนลงไปเอาลูกแพะเมื่อสามสิบปีก่อน

        {name}ลงทางนั้น พาเขาขึ้นมาก่อนเที่ยง เขาเดินได้อีกหลายปี แต่ไม่ขึ้นเขาอีก ปลายเดือนเขาเอาธนูยาวมาวางไว้หน้าประตูบ้าน{name}เอง เดินกะเผลกกลับไปโดยไม่เคาะประตู
      effects: { stats: { INT: 1 }, items: [hasken_longbow], flags: [hasken_saved, hasken_retired] }

- id: adult.mid_ranger_last_wolf
  stage: adult
  weight: 30
  when:
    age: [33, 40]
    class: ranger
  text: |
    หมาป่าในถิ่นนี้เหลือตัวเดียว ตัวผู้สีเทาแก่ ฟันหน้าหักไปซี่หนึ่ง ฝูงของมันตายไปทีละตัวตั้งแต่ค่ายของบริษัทมาตั้ง บางตัวตายเพราะยาเบื่อของคนเลี้ยงแกะ บางตัวหายไปเฉยๆ ตัวที่เหลือลงมากินแกะในคอกปลายหมู่บ้านสามคืนติด คนเลี้ยงแกะติดค่าหัวห้าเหรียญ

    {name}ตามมันไปถึงโพรงหินบนเนิน ข้างในไม่มีลูก ไม่มีคู่ มีแค่กระดูกแกะสามชิ้นที่มันลากมา มันนอนหันหน้าออกทางปากโพรง ไม่หนี ไม่ขู่ ตาสีเหลืองขุ่นของมันจับอยู่ที่{name} เหมือนรู้ว่าใครมา และรอมาพักหนึ่งแล้ว
  choices:
    - id: shoot_it
      label: ยิงมัน เอาค่าหัวห้าเหรียญ
      text: |
        ลูกธนูดอกเดียว หัวของมันวางลงบนขาหน้าเหมือนหมาที่ง่วง {name}เอาหูของมันลงไปให้คนเลี้ยงแกะ ได้ห้าเหรียญ คนเลี้ยงแกะเลี้ยงเหล้า{name}หนึ่งจอก

        คืนนั้นทั้งถิ่นเงียบ ไม่มีเสียงหอนจากเขาอีก เป็นคืนแรกในชีวิตของ{name}ที่ไม่มีเสียงนั้น {name}นอนฟังความเงียบจนเกือบเช้า
      effects: { gold: 5, flags: [shot_the_last_wolf] }
    - id: drive_it_away
      label: ไล่มันขึ้นเขาไปทางเหนือ ไกลจากค่ายและคอกแกะ
      check: { stat: CON, dc: 13, foe: nature }
      success:
        text: |
          สามวันสามคืน{name}เดินตามหลังมันห่างไปยี่สิบก้าว ไม่ให้มันหยุด ไม่ให้มันเลี้ยวกลับ มันเดินช้า หยุดหอบทุกครึ่งชั่วโมง {name}ก็หยุดหอบเหมือนกัน เช้าวันที่สี่ถึงสันเขาที่ไม่มีค่าย ไม่มีคอก ไม่มีทางเกวียน

          มันหันกลับมามอง{name}ครั้งเดียวที่สันเขา แล้วลงไปอีกด้าน ไม่ได้ค่าหัว คนเลี้ยงแกะบ่นอยู่เดือนหนึ่ง แล้วก็เลิกบ่น เพราะแกะไม่หายอีก
        effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [drove_the_last_wolf] }
      failure:
        text: |
          คืนที่สองมันวกกลับลงมาทางที่{name}ไม่ได้เฝ้า กลับไปที่คอกปลายหมู่บ้าน คนเลี้ยงแกะรออยู่แล้วกับหน้าไม้ของพ่อเขา

          เขาได้ค่าหัวที่ตัวเองติดไว้ ใช้มันซื้อแกะตัวใหม่หนึ่งตัว {name}เดินกลับลงเขามาทันเห็นเขาลากมันออกจากคอก ฟันหน้าที่หักซี่หนึ่งเห็นชัดตอนปากมันอ้าค้าง
        effects: { hp: -1, flags: [last_wolf_shot_by_shepherd] }
    - id: pay_for_the_sheep
      label: จ่ายค่าแกะให้คนเลี้ยงแกะสี่เหรียญ ขอให้ปลดค่าหัว
      requires: { min_gold: 4 }
      text: |
        คนเลี้ยงแกะรับเงินสี่เหรียญ ปลดกระดาษค่าหัวลงจากเสาหน้าโรงเตี๊ยม บอกว่าปีหน้ามันก็ลงมาอีก {name}บอกว่าปีหน้าค่อยว่ากัน

        หมาป่าตัวนั้นไม่ได้ลงมาอีก มันตายในโพรงหินตอนปลายฤดูหนาว ด้วยความแก่ {name}ขึ้นไปเจอมันนอนอยู่ในท่าเดิม หันหน้าออกทางปากโพรง {name}เอาหินปิดปากโพรงทีละก้อนจนถึงตอนค่ำ
      effects: { gold: -4, alignment: { moral: 1 }, flags: [paid_for_the_last_wolf] }

# ---------- กวีเร่ ----------
- id: adult.mid_bard_liran_voice
  stage: adult
  scene: tavern
  weight: 30
  when:
    age: [25, 32]
    class: bard
  text: |
    ลีรานร้องเพลงในโรงเตี๊ยมใหญ่ที่สุดของเมืองมาสองปีแล้ว เจ้าของโรงเตี๊ยมเขียนชื่อนางด้วยดินสอพองบนกระดานหน้าร้าน ตัวโตเท่าแขน สำหรับคืนพรุ่งนี้ ขุนนางสองบ้านจองโต๊ะหน้าเวที ค่าร้องคืนเดียวสิบเหรียญ เท่าที่กวีเร่ส่วนใหญ่หาได้ทั้งสัปดาห์

    บ่ายวันนี้นางมาเคาะประตูห้องของ{name} พูดออกมาไม่มีเสียง มีแต่ลมหายใจ หวัดลงคอมาตั้งแต่เมื่อคืน นางเขียนลงบนกระดานชนวนของเด็กที่ยืมมาจากข้างบ้าน แล้วยื่นให้{name}ดู

    ในเมืองนี้มีคนเดียวที่ร้องเพลงของนางได้ทุกเพลงโดยไม่ต้องซ้อม
  choices:
    - id: sing_behind_curtain
      label: ร้องจากหลังม่าน ให้นางยืนขยับปากอยู่บนเวที
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ยืนอยู่หลังม่านผ้ากำมะหยี่ทั้งคืน มองไม่เห็นเวที มองเห็นแค่รองเท้าของนางใต้ชายม่าน ปลายเท้าของนางเคาะจังหวะให้ทุกเพลง ปากของนางตรงกับเสียงของ{name}ทุกคำ ขุนนางโยนเหรียญขึ้นเวทีสามรอบ

          หลังร้านปิด นางแบ่งเงินให้ห้าเหรียญ เขียนบนกระดานชนวนว่าขอบใจ แล้วลบออก แล้วเขียนใหม่ ทั้งเมืองพูดถึงคืนนั้นไปทั้งเดือน คนที่รู้ว่าเกิดอะไรขึ้นหลังม่านมีแค่เจ้าของโรงเตี๊ยม เขาเห็นรองเท้าสองคู่อยู่ใต้ม่านผืนเดียวกัน
        effects: { stats: { CHA: 1 }, gold: 5, flags: [liran_rose, sang_behind_liran] }
      failure:
        text: |
          เพลงที่สาม {name}ขึ้นท่อนก่อนปากของนางไปครึ่งคำ คนโต๊ะหน้าเวทีเห็นก่อน หัวเราะก่อน แล้วโต๊ะถัดไปก็หัวเราะตาม ขุนนางคนหนึ่งลุกขึ้นเดินไปเปิดม่าน

          ทั้งสองคนยืนอยู่บนเวทีด้วยกันต่อหน้าคนทั้งโรงเตี๊ยม คนหนึ่งไม่มีเสียง อีกคนไม่มีชื่อ เจ้าของโรงเตี๊ยมลบชื่อนางออกจากกระดานหน้าร้านตั้งแต่คืนนั้น
        effects: { flags: [liran_fell] }
    - id: sing_as_self
      label: ขึ้นร้องแทนนางด้วยชื่อของ{name}เอง
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          เจ้าของโรงเตี๊ยมลบชื่อนางออกจากกระดาน เขียนชื่อ{name}ลงไปแทน ตัวโตเท่าเดิม {name}ร้องเพลงของนางทุกเพลง ด้วยท่อนจบที่{name}แต่งเอง ขุนนางสองบ้านไม่ลุกกลับก่อนเพลงสุดท้าย เจ้าของโรงเตี๊ยมจ่ายสิบเหรียญเต็ม

          เดือนต่อมาชื่อบนกระดานหน้าร้านเป็นชื่อ{name}ทุกวันเบเลค ลีรานหายเสียงไปสามสัปดาห์ วันที่นางกลับมาร้องได้ เวทีไม่มีคืนว่างให้นางแล้ว นางยืนอ่านกระดานหน้าร้านอยู่ครู่หนึ่ง แล้วเดินผ่านไป
        effects: { stats: { CON: 1 }, gold: 10, flags: [liran_fell, took_lirans_night] }
      failure:
        text: |
          คนในโรงเตี๊ยมมาเพื่อฟังลีราน {name}ร้องเพลงแรกจบ ครึ่งห้องยังรอให้นางออกมา เพลงที่สองครึ่งห้องนั้นลุกกลับ ขุนนางบ้านหนึ่งส่งคนมาถามเจ้าของโรงเตี๊ยมว่าลีรานอยู่ไหน

          เจ้าของโรงเตี๊ยมจ่ายให้{name}สองเหรียญ ตามค่าร้องคนที่ไม่มีชื่อบนกระดาน สัปดาห์ต่อมาคนในเมืองพูดถึงคืนที่ลีรานหายไป ยิ่งพูด ยิ่งอยากฟังนาง
        effects: { gold: 2, flags: [liran_rose, took_lirans_night] }
    - id: fix_her_voice
      label: ต้มน้ำผึ้งกับขิงให้นาง แล้วสอนให้ร้องจากท้องแทนลำคอ
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ตำรับนั้นเป็นของหมอตำแยในถิ่นเกิดของ{name} น้ำผึ้งสองช้อน ขิงทุบหนึ่งแง่ง เกลือหยิบมือ จิบทุกครั้งที่ระฆังบอกชั่วโมง ระหว่างนั้น{name}สอนนางร้องโดยไม่ใช้ลำคอ ให้เสียงขึ้นมาจากใต้ซี่โครงแทน

          คืนนั้นนางร้องได้ เสียงต่ำกว่าเดิมสามขั้น หยาบกว่าเดิม คนในโรงเตี๊ยมบอกกันว่าดีกว่าเดิม นางร้องด้วยเสียงแบบนั้นไปตลอดชีวิต และไม่เคยบอกใครว่าได้มาจากไหน
        effects: { stats: { INT: 1 }, flags: [liran_rose, fixed_lirans_voice] }
      failure:
        text: |
          ขิงแรงเกินไป นางไอจนมีเลือดติดผ้า หมอที่ปากตลาดบอกว่าห้ามใช้เสียงสิบวัน เจ้าของโรงเตี๊ยมเขียนชื่อนักร้องคนอื่นลงบนกระดานตั้งแต่บ่ายวันนั้น

          นางไม่โทษ{name} นางเขียนบนกระดานชนวนว่าคนที่ต้มขิงให้คู่แข่งมีไม่กี่คนในโลก แล้วขีดเส้นใต้คำว่าคู่แข่งสองเส้น
        effects: { flags: [liran_fell] }
    - id: share_the_stage
      label: ขึ้นเวทีด้วยกัน {name}ร้อง นางเล่นพิณ
      requires: { flag: liran_duet }
      text: |
        ลีรานเล่นพิณได้ดีกว่าที่นางร้อง แต่นางไม่เคยเล่นต่อหน้าใคร คนทั้งเมืองจึงไม่รู้ คืนนั้น{name}ยืนหน้าเวที นางนั่งเก้าอี้ข้างหลัง นิ้วของนางไล่สายพิณใต้เสียงของ{name}เหมือนน้ำไหลใต้สะพาน

        ขุนนางสองบ้านไม่ได้ฟังเพลงที่ตั้งใจมาฟัง แต่ไม่มีใครลุกกลับ เจ้าของโรงเตี๊ยมจ่ายสิบเหรียญ นางแบ่งคนละห้า แล้วเขียนบนกระดานชนวนว่าคราวหน้านางจะร้อง ให้{name}เล่นพิณบ้าง
      effects: { gold: 5, flags: [liran_ally] }

- id: adult.mid_bard_bought_hero
  stage: adult
  scene: noble_hall
  weight: 30
  when:
    age: [25, 32]
    year: [302, 340]
    class: bard
  text: |
    เจ้าของโรงกลั่นที่ใหญ่ที่สุดในย่านตะวันออกเชิญ{name}มาที่บ้าน ห้องรับแขกแขวนตะเกียงฟ้าสิบสองต้น เขาอยากได้เพลงหนึ่งเพลง เรื่องคืนหลุมในสงครามถ่าน คืนที่พื้นเถ้าใต้กระโจมพยาบาลยุบลง แล้วคนแคระปีนขึ้นมาจากข้างใต้ ในเพลงนั้นเขาต้องเป็นคนที่ยืนอยู่ปากหลุมเป็นคนแรก ค่าแต่งสิบสองเหรียญ

    เขาดึงคอเสื้อลงให้ดูแผลเป็นข้างคอ รอยไหม้ยาวเท่านิ้วกลาง บอกว่าได้มาจากตะเกียงน้ำมันที่ทหารโยนลงหลุมคืนนั้น

    คนรับใช้ที่ยกน้ำชามาวาง แขนขวาเป็นแขนเหล็ก ข้างคอของเขามีแผลไหม้ยาวเท่านิ้วกลาง ที่เดียวกัน รูปเดียวกัน ตอนวางถ้วยลงตรงหน้า{name} เขาพูดเบาจนเจ้านายไม่ได้ยิน ว่าท่อไอน้ำร้อนในโรงกลั่นกะดึกทำแบบนี้กับทุกคนที่ยืนผิดที่
  choices:
    - id: write_his_song
      label: แต่งเพลงตามที่เขาสั่ง รับสิบสองเหรียญ
      text: |
        {name}แต่งเพลงนั้นจบในสามคืน ท่อนแรกเป็นเถ้าสีเทา ท่อนสองเป็นพื้นที่ยุบ ท่อนสามเป็นผู้ชายคนหนึ่งยืนอยู่ปากหลุมกับตะเกียงในมือ ทำนองดี ร้องตามง่าย เจ้าของโรงกลั่นจ่ายสิบสองเหรียญ แล้วให้คนรับใช้เดินไปส่งที่ประตู

        เดือนต่อมาเพลงนั้นร้องกันในโรงเตี๊ยมทุกแห่งในย่านตะวันออก คนรับใช้แขนเหล็กยืนอยู่หลังเจ้านายทุกครั้งที่มีคนร้องให้เจ้านายฟัง ยืนนิ่ง มือเหล็กประสานไว้ข้างหน้า
      effects: { gold: 12, alignment: { moral: -1 }, flags: [sang_bought_hero] }
    - id: ask_the_servant
      label: ตามคนรับใช้ไปถามที่ครัว ว่าคืนนั้นใครยืนอยู่ปากหลุมจริง
      check: { stat: INT, dc: 13 }
      success:
        text: |
          คนรับใช้ไม่ตอบในครัว เขาบอกให้ไปหาที่โรงเตี๊ยมหลังท่าเรือ คืนวันอัสเทล ที่นั่นเขาเล่าให้ฟังว่าคืนนั้นเขาอยู่ในกระโจมพยาบาล ขาหักนอนอยู่บนเปล คนที่ยืนอยู่ปากหลุมเป็นทหารเกณฑ์สามคน เขาจำชื่อได้สองคน อีกคนเขาจำได้แค่ว่าร้องเพลงเพี้ยน

          ส่วนเจ้านายของเขา คืนนั้นอยู่ในโรงกลั่นของพ่อ ห่างสนามรบเจ็ดวันเดินทาง {name}แต่งเพลงเรื่องทหารสามคน ใส่ชื่อสองชื่อ อีกคนให้ร้องเพี้ยนในท่อนของเขา ไม่มีใครจ่ายเงินให้เพลงนี้ แต่ปลายปีคนแก่ในโรงเตี๊ยมหลังท่าเรือร้องมันได้ทุกคำ
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, reputation: { distillers: -1 }, flags: [sang_true_hole] }
      failure:
        text: |
          คนรับใช้ส่ายหน้า บอกว่าเขาไม่ได้เอ่ยสักคำในห้องรับแขก {name}ได้ยินผิดไป เขาทำงานบ้านนี้มาสิบปี มีลูกสองคน แขนเหล็กข้างนี้นายเป็นคนซื้อให้

          {name}เดินออกจากบ้านหลังนั้นโดยไม่ได้แต่งเพลงให้ใคร เจ้าของโรงกลั่นจ้างกวีเร่คนอื่นในสัปดาห์ต่อมา เพลงนั้นออกมาไม่ดีนัก แต่ร้องกันได้ทั้งย่าน
        effects: { alignment: { moral: 1 }, flags: [asked_the_servant] }
    - id: write_two_ways
      label: แต่งเพลงที่เขาฟังแล้วเป็นวีรบุรุษ แต่คนงานโรงกลั่นฟังแล้วหัวเราะ
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          ทุกท่อนในเพลงพูดถึงผู้ชายที่ยืนอยู่ปากหลุม แต่หลุมในเพลงไม่เคยบอกว่าอยู่ที่ไหน ไฟในเพลงไม่เคยบอกว่าเป็นตะเกียงหรือเป็นท่อไอน้ำ และท่อนสุดท้ายผู้ชายคนนั้นยืนนิ่งจนรุ่งสาง เพราะกะดึกยังไม่เลิก

          เจ้าของโรงกลั่นฟังจบแล้วตบมือ จ่ายสิบสองเหรียญ คนงานโรงกลั่นร้องเพลงนั้นตอนเปลี่ยนกะทุกเช้า ร้องท่อนสุดท้ายดังเป็นพิเศษ แล้วหัวเราะกันจนหัวหน้ากะต้องตะโกนให้เงียบ
        effects: { stats: { CHA: 1 }, gold: 12, flags: [sang_double_song] }
      failure:
        text: |
          เจ้าของโรงกลั่นฟังได้ถึงท่อนที่สาม แล้วหยุดถ้วยชาไว้กลางทาง เขาไม่ได้โง่ เขาแค่ไม่ได้ไปสงคราม เขาเรียกคนรับใช้มาเปิดประตูให้{name} ไม่ได้ขึ้นเสียงสักคำ

          สัปดาห์ต่อมาโรงเตี๊ยมสองแห่งในย่านตะวันออกไม่รับ{name}ขึ้นร้อง เจ้าของทั้งสองแห่งซื้อน้ำค้างดาวจากโรงกลั่นเดียวกัน
        effects: { reputation: { distillers: -1 }, flags: [sang_double_song_failed] }
    - id: was_there
      label: บอกเขาว่า{name}อยู่บนเนินเถ้าหน้าปากเหมืองในสงครามครั้งนั้น
      requires: { flag: went_to_coal_war }
      text: |
        เจ้าของโรงกลั่นนิ่งไปจนชาในถ้วยเย็น แล้วถามว่ากองไหน {name}บอกชื่อกอง เขาถามว่าค่ายตั้งอยู่ทางไหนของปากเหมือง {name}บอก เขาวางถ้วยลง แล้วเพิ่มค่าแต่งเป็นยี่สิบเหรียญ เป็นค่าเพลง กับค่าลืมว่าเคยมาที่บ้านนี้

        {name}วางถ้วยชาลงข้างถ้วยของเขา แล้วลุกขึ้น ตอนเดินผ่านคนรับใช้แขนเหล็กที่ประตู เขาก้มหัวให้ ต่ำกว่าที่ก้มให้เจ้านาย
      effects: { alignment: { moral: 1 }, flags: [refused_hero_song] }

- id: adult.mid_bard_liran_last_song
  stage: adult
  scene: tavern
  weight: 30
  when:
    age: [33, 40]
    class: bard
  text: |
    เจ้าของโรงเตี๊ยมส่งเด็กมาตาม{name}ตอนค่ำ ลีรานนอนอยู่ในห้องชั้นบนของโรงเตี๊ยมที่นางร้องเพลงครั้งแรกเมื่อเกือบยี่สิบปีก่อน หมอบอกว่าเหลืออีกไม่กี่คืน ไข้ลงปอด ทุกครั้งที่นางหายใจ มีเสียงเหมือนลมผ่านท่อแตก

    ทั้งวันนางพูดถึงเพลงเดียว เพลงที่ทั้งเมืองร้องตามได้มาเกือบยี่สิบปี ท่อนแรกเป็นของ{name} แต่งตอนอายุสิบหก ท่อนจบเป็นของนาง คนในเมืองร้องโดยไม่รู้ว่าใครแต่งท่อนไหน นางอยากฟังมันอีกครั้ง จากปากคนที่แต่งท่อนแรก

    ห้องนั้นเล็กจนต้องนั่งบนขอบเตียง ข้างล่างมีคนร้องเพลงอื่นอยู่ เสียงลอดพื้นไม้ขึ้นมา
  choices:
    - id: sing_her_ending
      label: ร้องเพลงนั้นด้วยท่อนจบของนาง แบบที่ทั้งเมืองร้อง
      text: |
        {name}ร้องเบาๆ ให้พอดีกับห้อง ท่อนแรกของ{name} ท่อนจบของนาง ลีรานหลับตาฟัง ริมฝีปากขยับตามท่อนจบทุกคำโดยไม่มีเสียงออกมา

        พอเพลงจบ คนข้างล่างที่ร้องเพลงอื่นอยู่หยุดร้อง แล้วเริ่มร้องเพลงนี้แทน ทีละเสียง จนทั้งโรงเตี๊ยมร้อง ลีรานลืมตาขึ้นมองเพดาน ตอนรุ่งสางนางหยุดหายใจ เสียงลมผ่านท่อแตกหายไปก่อนที่{name}จะรู้ตัว
      effects: { alignment: { moral: 1 }, flags: [liran_died, sang_lirans_ending] }
    - id: sing_own_ending
      label: ร้องด้วยท่อนจบเดิมที่{name}แต่งไว้ตอนอายุสิบหก
      text: |
        ท่อนจบนี้ไม่มีใครร้องมาเกือบยี่สิบปี {name}ร้องจนจบ ท่อนจบของเด็กอายุสิบหก ยาวไปหนึ่งบรรทัด สัมผัสไม่ลงสองที่ ลีรานฟังแล้วบอกด้วยเสียงที่เหลืออยู่ว่าของ{name}ดีกว่า

        นางตายตอนสาย เพลงนั้นยังร้องกันทั่วเมืองด้วยท่อนจบของนาง ท่อนของเด็กอายุสิบหกเหลืออยู่ในหัวของ{name}คนเดียว
      effects: { stats: { INT: 1 }, flags: [liran_died, sang_own_ending] }
    - id: sing_both
      label: ร้องท่อนจบทั้งสองต่อกัน ของนางก่อน ของ{name}ตามหลัง
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          สองท่อนจบไม่ได้แต่งมาให้ต่อกัน {name}ต้องเปลี่ยนทำนองตรงรอยต่อสามเสียง เปลี่ยนสดๆ ระหว่างร้อง ท่อนของนางจบที่ประตูบ้าน ท่อนของ{name}เริ่มที่ประตูบ้านพอดี เหมือนคนสองคนเดินมาเจอกันตรงนั้น

          ลีรานหัวเราะเป็นเสียงลม นางฮัมตามท่อนสุดท้ายได้สองคำ แล้วหลับไป ตอนเช้านางไม่ตื่น {name}ร้องเพลงนั้นแบบสองท่อนจบไปจนตลอดชีวิต คนที่ได้ยินครั้งแรกมักถามว่าทำไมมันจบสองครั้ง
        effects: { stats: { CHA: 1 }, flags: [liran_died, liran_reconciled, joined_the_endings] }
      failure:
        text: |
          รอยต่อระหว่างสองท่อนไม่ยอมลง {name}ร้องผิดเสียงตรงนั้นครั้งหนึ่ง หยุด แล้วเริ่มใหม่ ครั้งที่สองก็ผิดที่เดิม ลีรานยกมือขึ้นแตะแขน{name} แล้วร้องรอยต่อนั้นเองด้วยเสียงกระซิบ สามเสียง ลงพอดี

          {name}ร้องจนจบด้วยสามเสียงของนาง นางตายตอนใกล้รุ่ง ตั้งแต่นั้น{name}ร้องรอยต่อนั้นได้ไม่ผิดอีกเลย และร้องมันเบาลงทุกครั้งเหมือนคนกระซิบ
        effects: { flags: [liran_died, liran_reconciled] }
    - id: sing_the_duet
      label: ร้องคู่กับนาง แบบคืนแรกที่ร้องด้วยกัน
      requires: { flag: liran_duet, not_flags: [took_lirans_night] }
      text: |
        ลีรานไม่มีเสียงพอจะร้องคู่ แต่นางยังจำได้ว่าเสียงที่สองต้องเข้าตรงไหน ทุกครั้งที่ถึงตรงนั้น นางเคาะนิ้วบนผ้าห่มหนึ่งครั้ง {name}ร้องเสียงแรก ปล่อยที่ของเสียงที่สองไว้ว่างตรงที่นิ้วของนางเคาะ

        คนข้างล่างได้ยินเพลงที่มีช่องว่างอยู่กลางท่อน ไม่มีใครร้องตาม นางตายในคืนนั้น นิ้วยังวางอยู่บนผ้าห่มตรงที่เคาะครั้งสุดท้าย
      effects: { flags: [liran_died, liran_reconciled] }
    - id: go_up_anyway
      label: ขึ้นไปหานาง แม้นางยังไม่ลืมคืนที่{name}ร้องแทนชื่อนาง
      requires: { flag: took_lirans_night }
      text: |
        ลีรานเห็น{name}ที่ประตู แล้วหันหน้าเข้าผนัง นางไม่ได้ไล่ ไม่ได้พูด {name}นั่งลงบนขอบเตียง ร้องเพลงนั้นจนจบ ท่อนจบของนาง ทุกคำ นางไม่หันกลับมา

        {name}ลงบันไดมาตอนดึก เจ้าของโรงเตี๊ยมบอกว่านางเพิ่งตาย หน้ายังหันเข้าผนังเหมือนเดิม และในมือนางกำกระดานชนวนแผ่นเล็กที่ไม่มีอะไรเขียนอยู่
      effects: { flags: [liran_died, liran_never_forgave] }

- id: adult.mid_bard_song_without_name
  stage: adult
  weight: 30
  when:
    age: [33, 40]
    class: bard
  text: |
    เด็กกลุ่มหนึ่งเล่นกระโดดเชือกอยู่ข้างบ่อน้ำกลางหมู่บ้านที่{name}ผ่านมาครั้งแรกในชีวิต ร้องเพลงไปด้วยตามจังหวะเชือก เพลงของ{name} เพลงที่แต่งเมื่อสิบกว่าปีก่อน ทำนองเดิม แต่คำเปลี่ยนไปเกือบครึ่ง ท่อนที่เคยพูดถึงแม่น้ำ กลายเป็นพูดถึงบ่อน้ำ ท่อนที่เคยพูดถึงความรัก กลายเป็นพูดถึงแมวของใครคนหนึ่งในหมู่บ้าน

    เด็กร้องผิดจังหวะตรงที่{name}ก็เคยร้องผิด ตรงที่หายใจไม่ทัน เด็กคนที่ถือปลายเชือกบอกเพื่อนว่าเพลงนี้ยายของเขาร้องมาตั้งแต่เป็นสาว
  choices:
    - id: tell_them
      label: บอกเด็กๆ ว่าใครแต่งเพลงนี้
      text: |
        เด็กหยุดกระโดดเชือก มองหน้า{name}ทีละคน คนที่ถือปลายเชือกบอกว่าเป็นไปไม่ได้ ยายของเขาร้องเพลงนี้มาตั้งแต่ก่อนพ่อเขาเกิด {name}ร้องท่อนแรกด้วยคำเดิมให้ฟัง เด็กคนหนึ่งบอกว่าคำเดิมไม่สนุกเท่า

        พวกเขากลับไปกระโดดเชือกต่อ ร้องด้วยคำของพวกเขาเอง ท่อนแมวดังกว่าเดิม {name}ยืนดูจนแม่ของเด็กคนหนึ่งออกมาเรียกกลับบ้าน
      effects: { flags: [told_kids_the_song] }
    - id: sing_along
      label: ร้องตามด้วยคำใหม่ของเด็กๆ
      text: |
        {name}จำคำใหม่ได้ตั้งแต่รอบที่สอง รอบที่สามร้องตาม เด็กๆ หันมามองคนแปลกหน้าที่ร้องเพลงของหมู่บ้านได้ แล้วยื่นปลายเชือกให้ถือข้างหนึ่ง

        ท่อนแมวมีอยู่สามบรรทัด {name}ร้องผิดบรรทัดที่สอง เด็กแก้ให้ คืนนั้นในโรงเตี๊ยมหมู่บ้านถัดไป {name}ร้องเพลงนั้นด้วยคำของเด็ก มีคนถามว่าแมวตัวนั้นชื่ออะไร {name}ไม่รู้ ต้องแต่งชื่อให้มันเอง
      effects: { stats: { CHA: 1 }, flags: [sang_the_village_words] }
    - id: walk_on
      label: เดินผ่านไปเงียบๆ ให้เพลงเป็นของหมู่บ้านนี้
      text: |
        {name}เติมน้ำในกระบอกที่บ่อ แล้วเดินออกจากหมู่บ้านไปทางเดิม เสียงเพลงตามหลังมาจนถึงปลายถนน แล้วลมก็พาไปทางอื่น

        คืนนั้น{name}นั่งเขียนคำเดิมของเพลงลงบนกระดาษ ทีละท่อน จำได้ทุกคำ แล้วพับเก็บไว้ในซองพิณ ไม่ได้ร้องมันอีกเลย
      effects: { stats: { INT: 1 }, flags: [let_the_song_go] }
    - id: hear_the_bought_song
      label: ถามเด็กว่าร้องเพลงคืนหลุมเป็นไหม
      requires: { flag: sang_bought_hero }
      text: |
        เด็กร้องได้ทุกคน ร้องได้ทุกคำ ท่อนสามที่ผู้ชายคนหนึ่งยืนอยู่ปากหลุมกับตะเกียงในมือ เด็กคนที่ถือปลายเชือกบอกว่าผู้ชายในเพลงเป็นเจ้าของโรงกลั่นในเมือง ครูที่โรงเรียนเล่าให้ฟัง เขาเป็นวีรบุรุษของสงครามถ่าน

        เด็กคนหนึ่งบอกว่าปู่ของเขาก็ไปสงครามนั้น แต่ไม่มีเพลง {name}ถามชื่อปู่ เด็กบอกชื่อ {name}ไม่รู้จักชื่อนั้น และไม่เคยถามใครว่าคืนนั้นใครยืนอยู่ปากหลุมจริง
      effects: { alignment: { moral: -1 }, flags: [heard_bought_song_as_truth] }
    - id: hear_the_true_song
      label: ถามเด็กว่าร้องเพลงทหารสามคนเป็นไหม
      requires: { flag: sang_true_hole }
      text: |
        เด็กร้องได้ ท่อนของคนที่ร้องเพลงเพี้ยนร้องเพี้ยนครบทุกคำ เพี้ยนตรงเดียวกับที่{name}แต่งให้เพี้ยน เด็กๆ ร้องท่อนนั้นแล้วหัวเราะทุกรอบ

        เด็กคนที่ถือปลายเชือกบอกว่าคนที่ร้องเพี้ยนในเพลงคือปู่ของเขา ปู่ยังอยู่ ยังร้องเพี้ยนเหมือนเดิม ทุกคืนวันอัสเทลปู่จะร้องท่อนนั้นเองในโรงเตี๊ยม แล้วบอกทุกคนว่าคนแต่งไม่เคยได้ยินเขาร้องสักครั้ง
      effects: { alignment: { moral: 1 }, flags: [met_the_off_key_soldier] }
    - id: hear_the_double_song
      label: ถามเด็กว่าร้องเพลงกะดึกเป็นไหม
      requires: { flag: sang_double_song }
      text: |
        เด็กร้องได้ ร้องท่อนสุดท้ายดังเป็นพิเศษเหมือนคนงานโรงกลั่น ผู้ชายในเพลงยืนนิ่งจนรุ่งสางเพราะกะดึกยังไม่เลิก เด็กไม่รู้ว่าทำไมท่อนนั้นตลก แต่หัวเราะตามพ่อทุกครั้ง

        เด็กคนที่ถือปลายเชือกบอกว่าเจ้าของโรงกลั่นคนนั้นสั่งห้ามร้องเพลงนี้ในโรงกลั่นเมื่อปีก่อน หลังจากนั้นทั้งเมืองร้องมันดังขึ้น
      effects: { stats: { CHA: 1 }, flags: [heard_the_double_song] }

# ---------- คนธรรมดา ----------
# คู่แข่งของสายนี้คือราวิส คนงานรุ่นเดียวกันที่นายตั้งเป็นหัวหน้าคนงาน
- id: adult.mid_commoner_ravis_list
  stage: adult
  scene: tavern
  weight: 30
  when:
    age: [25, 32]
    flags: [path_commoner]
  text: |
    ราวิสเริ่มงานปีเดียวกับ{name} กินข้าวเที่ยงบนม้านั่งตัวเดียวกันมาหลายปี เป็นคนที่หัวเราะเรื่องตลกของคนอื่นดังที่สุด และไม่เคยเล่าเรื่องของตัวเองสักเรื่อง เดือนนี้นายตั้งเขาเป็นหัวหน้าคนงาน ให้กระดุมทองเหลืองติดอกเสื้อหนึ่งเม็ด กับกระดานไม้แผ่นหนึ่งที่แขวนหน้าที่ทำงาน บนกระดานมีชื่อคนงานทุกคน

    งานปีนี้น้อยลง นายสั่งให้ราวิสเลือกห้าชื่อออกจากกระดานก่อนวันเบเลคหน้า

    คืนวันเบเลคนี้ ราวิสมานั่งข้าง{name}ในโรงเตี๊ยม สั่งเหล้าให้หนึ่งจอก บอกว่าชื่อ{name}อยู่ในห้าชื่อนั้น เขาลบให้ได้ ถ้า{name}บอกชื่อคนที่ควรออกแทนสักชื่อ กระดุมทองเหลืองบนอกเขาสะท้อนแสงตะเกียงทุกครั้งที่เขายกจอก
  choices:
    - id: give_a_name
      label: บอกชื่อคนงานใหม่คนหนึ่งให้เขาลบแทน
      text: |
        {name}บอกชื่อคนงานใหม่ที่เพิ่งมาได้สามเดือน คนที่ยังไม่มีใครจำหน้าได้ ราวิสบอกว่าเข้าใจ แล้วดื่มจอกของตัวเองจนหมด

        วันเบเลคถัดมา ชื่อของ{name}ยังอยู่บนกระดาน ชื่อคนงานใหม่หายไป คนงานใหม่ไม่รู้ว่าใครเป็นคนบอก เขาเดินผ่าน{name}ตอนเก็บของออกจากที่ทำงาน แล้วยกมือลาเหมือนลาเพื่อน
      effects: { alignment: { moral: -1 }, flags: [gave_ravis_a_name, ravis_rose] }
    - id: tell_everyone
      label: บอกคนงานทุกคนเรื่องห้าชื่อ ชวนกันไปหานายพร้อมกันตอนเช้า
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          เช้าวันต่อมาคนงานสามสิบกว่าคนยืนอยู่หน้าบ้านนายก่อนแดดขึ้น ไม่มีใครตะโกน ไม่มีใครถือไม้ แค่ยืน นายออกมาที่ระเบียง นับคน แล้วกลับเข้าบ้าน

          บ่ายวันนั้นนายลดค่าแรงทุกคนลงวันละเศษเหรียญ แทนการเอาชื่อห้าชื่อออก กระดานหน้าที่ทำงานยังมีชื่อครบ กระดุมทองเหลืองหายไปจากอกเสื้อของราวิสในเดือนต่อมา นายบอกว่าหัวหน้าคนงานที่ทำงานไม่จบก็ไม่ต้องมีกระดุม
        effects: { alignment: { moral: 1 }, flags: [ravis_fell, stood_against_the_list] }
      failure:
        text: |
          เช้าวันต่อมาคนงานยืนอยู่หน้าบ้านนายเจ็ดคน อีกยี่สิบกว่าคนบอกว่าจะมา แต่ไม่มา นายออกมาที่ระเบียง จดชื่อเจ็ดคนนั้น

          ชื่อของ{name}เป็นชื่อแรกที่หายจากกระดาน ราวิสเป็นคนลบเอง กว่าจะได้งานใหม่ใช้เวลาสามสัปดาห์ เงินเก็บหายไปสามเหรียญ
        effects: { gold: -3, alignment: { moral: 1 }, flags: [laid_off_by_ravis] }
    - id: go_to_the_boss
      label: ไปหานายเอง นับให้ดูว่างานที่ห้าคนทำอยู่จะตกไปที่ใคร
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}นับให้นายฟังทีละงาน ใครยกอะไร ใครนับอะไร ใครรู้ว่าของชิ้นไหนเก็บไว้ตรงไหน ห้าคนที่จะออกรู้เรื่องที่คนอื่นไม่รู้รวมกันสิบสองเรื่อง นายฟังครบทุกเรื่องแล้วก็ไม่ได้ยกเลิกรายชื่อ นายเอาชื่อ{name}ออกจากห้าชื่อ ใส่ชื่ออื่นแทน แล้วหยิบกระดุมทองเหลืองเม็ดที่สองออกมาจากลิ้นชัก

          ห้าคนยังออกในวันเบเลคถัดมา ราวิสยืนข้าง{name}หน้ากระดาน กระดุมสองเม็ดบนอกเสื้อสองตัว นายเพิ่มค่าแรงให้{name}สองเหรียญ ราวิสมองเม็ดของ{name}แล้วมองเม็ดของตัวเอง เหมือนกำลังเทียบว่าเม็ดไหนเงากว่า
        effects: { stats: { INT: 1 }, gold: 2, flags: [became_foreman] }
      failure:
        text: |
          นายฟังได้ครึ่งเดียว แล้วถามว่า{name}เป็นหัวหน้าคนงานหรือ {name}บอกว่าไม่ใช่ นายบอกว่างั้นก็กลับไปทำงาน แล้วให้คนไปบอกราวิสว่าชื่อ{name}ห้ามลบ ให้ลบคนอื่นทั้งห้า

          {name}ยังมีงาน ห้าคนออก ทุกคนในที่ทำงานรู้ว่า{name}ไปบ้านนายเช้าวันนั้น ไม่มีใครรู้ว่า{name}ไปพูดอะไร ม้านั่งตัวที่{name}นั่งกินข้าวเที่ยงเหลือคนนั่งอยู่คนเดียวไปทั้งเดือน
        effects: { flags: [boss_watches_you, kept_off_the_list] }
    - id: habels_hat
      label: วางหมวกใบที่เคยใช้เรี่ยไรค่าฝังศพฮาเบลลงบนโต๊ะ
      requires: { flag: organized_collection }
      text: |
        ราวิสจำหมวกใบนั้นได้ เขาเคยใส่เหรียญลงไปสองเหรียญ เป็นเงินค่าแรงสองวันในตอนนั้น เขาวางจอกเหล้าลง มองหมวกจน{name}ดื่มหมดจอก แล้วทั้งสองก็ไม่พูดถึงห้าชื่ออีก

        วันเบเลคถัดมา กระดานหน้าที่ทำงานยังมีชื่อครบ ราวิสไปบอกนายว่าเลือกไม่ได้ นายเอากระดุมทองเหลืองคืน แล้วลดค่าแรงทุกคนแทน ราวิสกลับมานั่งม้านั่งตัวเดิมตอนเที่ยง หัวเราะเรื่องตลกของคนอื่นดังเท่าเดิม
      effects: { alignment: { moral: 1 }, flags: [ravis_fell, ravis_softened] }

- id: adult.mid_commoner_iron_porter
  stage: adult
  weight: 30
  when:
    age: [25, 32]
    flags: [path_commoner]
    not_flags: [job_bough_crafter, job_farmer, job_merchant, job_clerk]
  text: |
    นายซื้อหุ่นยามมาสองตัว ตัวสูงเท่าประตู แบกของได้เท่าคนห้าคน ไม่กินข้าว ไม่ป่วย ไม่ขอขึ้นค่าแรง กินน้ำค้างดาวขวดเดียวทุกเจ็ดวัน หลอดคำสั่งสีฟ้าในอกบอกให้มันยกของจากกองหนึ่งไปวางอีกกอง มันทำอย่างนั้นได้ตั้งแต่ก่อนแดดขึ้นจนหลังแดดตก

    ปลายเดือนนี้คนงานสิบคนจะออก นายบอกว่าคนที่เหลือต้องมีคนหนึ่งคนดูแลหุ่น เติมน้ำค้าง ทาน้ำมันข้อต่อ เปลี่ยนหลอดคำสั่งเมื่อมันเริ่มทำอะไรแปลกๆ ค่าแรงเท่าเดิม

    หุ่นทั้งสองตัวยืนอยู่กลางลานขนของ แผ่นอกยังมีตราโรงงานผู้ทำประทับอยู่ ยังไม่มีรอยขีดข่วนสักรอย
  choices:
    - id: tend_them
      label: รับดูแลหุ่นทั้งสองตัวเอง
      check: { stat: INT, dc: 12, foe: machine }
      success:
        text: |
          ช่างจากโรงงานสอน{name}ครึ่งวัน แล้วขึ้นรถม้ากลับไป {name}เรียนที่เหลือเองจากการฟังเสียงข้อต่อ หุ่นที่ข้อต่อแห้งจะมีเสียงเหมือนประตูบ้านเก่า หุ่นที่หลอดคำสั่งเริ่มเพี้ยนจะหยุดค้างครึ่งจังหวะก่อนวางของลง

          {name}มีงานต่อ คนงานสิบคนออกตามที่นายบอก สองคนในนั้นเคยนั่งม้านั่งตัวเดียวกับ{name}ตอนเที่ยง ทุกเช้า{name}ทาน้ำมันข้อต่อให้หุ่นที่ยกของแทนพวกเขา
        effects: { stats: { INT: 1 }, flags: [tends_iron_porter] }
      failure:
        text: |
          สัปดาห์แรก{name}ใส่หลอดคำสั่งกลับเข้าไปผิดด้าน หุ่นตัวหนึ่งยกของจากกองหนึ่งไปวางกลางทางเดิน แล้วยกกลับ แล้ววางกลางทางเดินอีก จนตะวันตกดิน

          นายหักค่าแรง{name}สองเหรียญเป็นค่าของที่แตก แต่ยังให้ดูแลต่อ เพราะไม่มีใครอื่นยอมแตะมัน
        effects: { gold: -2, flags: [tends_iron_porter] }
    - id: pull_the_tube
      label: แอบงัดแผ่นอกตอนกลางคืน ดึงหลอดคำสั่งออก ให้นายคิดว่าหุ่นเสีย
      check: { stat: DEX, dc: 13, foe: machine }
      success:
        text: |
          แผ่นอกของหุ่นใหม่ยังแน่น {name}ใช้ชะแลงงัดตรงรอยต่อใต้รักแร้ ค่อยๆ ดึงหลอดคำสั่งสีฟ้าออกมาครึ่งนิ้ว พอให้มันหลุดจากเขี้ยวล็อก แต่ยังดูเหมือนอยู่ที่เดิม ทำกับทั้งสองตัว

          เช้าวันต่อมาหุ่นทั้งสองยืนนิ่งกลางลาน ไม่ยกอะไรสักอย่าง ช่างจากโรงงานมาดูสามวัน ไม่เจอว่าเสียตรงไหน นายส่งหุ่นคืนโรงงาน คนงานสิบคนมีงานต่อไปอีกหนึ่งฤดู ฤดูต่อมาโรงงานส่งหุ่นรุ่นใหม่มา แผ่นอกขันด้วยสลักเกลียวแปดตัว
        effects: { stats: { DEX: 1 }, alignment: { law: -1, moral: 1 }, flags: [sabotaged_iron_porter] }
      failure:
        text: |
          หุ่นที่หลอดคำสั่งเริ่มหลุดยังมีแรงเหลือในแขน มันเหวี่ยงแขนเหล็กออกมาครั้งเดียวตามคำสั่งครึ่งๆ กลางๆ ที่ยังค้างอยู่ {name}กระเด็นไปกระแทกกองลัง ยามกลางคืนมาถึงพร้อมตะเกียง

          นายไล่{name}ออกตั้งแต่เช้า ไม่จ่ายค่าแรงที่ค้างอยู่สี่เหรียญ และบอกนายคนอื่นในย่านว่าใครเป็นคนงัดหุ่น
        effects: { hp: -2, gold: -4, alignment: { law: -1 }, flags: [fired_for_porter] }
    - id: walk_out_with_ten
      label: ลาออกไปพร้อมคนงานสิบคน
      text: |
        {name}เก็บของใส่ห่อผ้าพร้อมคนสิบคนในวันเบเลคสุดท้ายของเดือน นายมองตามแต่ไม่ห้าม หุ่นทั้งสองตัวยกของจากกองหนึ่งไปวางอีกกองอยู่ข้างหลัง ไม่ได้หันมามอง

        สามสัปดาห์กว่าจะได้งานใหม่ เงินเก็บหายไปสองเหรียญ งานใหม่ค่าแรงน้อยกว่าเดิม แต่คนสิบเอ็ดคนยังกินข้าวเที่ยงด้วยกันในวันอัสเทลที่ร้านเดิมไปอีกหลายปี
      effects: { gold: -2, alignment: { moral: 1 }, flags: [walked_out_with_ten] }
    - id: knows_golems
      label: บอกนายว่า{name}เคยเจอหุ่นยามคลั่งในโกดังริมทางเกวียนมาแล้ว รู้ว่าหุ่นแบบนี้พังตรงไหน
      requires: { flag: took_a_bounty }
      text: |
        นายเคยเห็นกระดานค่าหัวหน้าโรงเตี๊ยม เคยได้ยินเรื่องโกดังเก่าริมทางเกวียน เขาให้{name}ดูแลหุ่นทั้งสองตัว ปลายเดือนแรกจ่ายเพิ่มให้สามเหรียญ ถูกกว่าค่าช่างจากโรงงานที่คิดครั้งละห้า

        {name}รู้ว่าเฟืองหัวเข่าของหุ่นสึกก่อนอย่างอื่น รู้ว่าหลอดคำสั่งเพี้ยนเมื่อไหร่จากครึ่งจังหวะที่มันหยุด ทุกเย็น{name}ทาน้ำมันหัวเข่าให้มันทีละข้าง เหมือนทาให้คนแก่
      effects: { gold: 3, stats: { STR: 1 }, flags: [tends_iron_porter] }

- id: adult.mid_commoner_ravis_leg
  stage: adult
  scene: home
  weight: 30
  when:
    age: [33, 40]
    flags: [path_commoner]
    not_flags: [job_bough_crafter, job_farmer, job_merchant, job_clerk]
  text: |
    เชือกรอกยกของขาดตอนบ่าย ลังเหล็กตกลงมาจากความสูงสองชั้น ทับขาซ้ายของราวิส คนงานรุ่นเดียวกับ{name} คนที่เคยติดกระดุมทองเหลืองบนอกเสื้อ หมอตัดขาข้างนั้นออกใต้เข่าตอนค่ำ

    สองวันต่อมานายส่งคนมาบอกว่าค่าแรงเดือนนี้จะจ่ายครึ่งเดียว เพราะราวิสทำงานได้แค่ครึ่งเดือน เชือกรอกเส้นนั้นใช้มาแปดปี คนงานบอกนายให้เปลี่ยนมาสามครั้ง ราวิสเป็นคนบอกครั้งสุดท้าย

    ราวิสนอนอยู่ในห้องเช่าชั้นล่างใกล้ที่ทำงาน ผ้าพันขาเปลี่ยนเป็นสีน้ำตาล ในห้องมีแค่เขากับแมวของเจ้าของบ้าน
  choices:
    - id: pass_the_hat
      label: ถือหมวกเดินไปขอทุกคนในที่ทำงาน ให้พอค่าหมอกับขาไม้
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          คนงานรุ่นใหม่ไม่รู้จักราวิส แต่รู้จักเชือกรอกเส้นนั้น ทุกคนเคยยืนใต้มัน หมวกหนักขึ้นตั้งแต่โต๊ะแรก คนขายข้าวหน้าที่ทำงานใส่ลงไปหนึ่งเหรียญ บอกว่าราวิสค้างค่าข้าวแกอยู่สองเหรียญ ไม่ต้องคืน

          เงินในหมวกพอค่าหมอ พอขาไม้ที่ทำจากไม้แข็งทั้งท่อน กับค่าเช่าห้องอีกสามเดือน ราวิสนับเหรียญในหมวกสองรอบ แล้วบอกว่าเขาไม่เคยใส่เงินลงหมวกของใครเกินสองเหรียญ
        effects: { alignment: { moral: 1 }, flags: [helped_ravis] }
      failure:
        text: |
          คนงานใส่หมวกคนละเศษเหรียญ ส่วนใหญ่บอกว่าเดือนนี้นายเพิ่งหักค่าแรงทุกคนเป็นค่าเชือกเส้นใหม่ เงินในหมวกพอค่าหมอ ไม่พอค่าขาไม้

          {name}ใส่เงินของตัวเองเพิ่มลงไปสองเหรียญ ขาไม้ที่ได้มาเป็นไม้อ่อน สั้นไปนิ้วหนึ่ง ราวิสเดินโยกไปทางซ้ายทุกก้าว เขาบอกว่าดีกว่าเดินด้วยไม้ค้ำ
        effects: { gold: -2, alignment: { moral: 1 }, flags: [helped_ravis] }
    - id: face_the_boss_for_ravis
      label: ไปบ้านนาย นับให้ดูว่าเชือกเส้นนั้นมีคนเตือนกี่ครั้ง
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}ไม่ได้ไปขอ {name}ไปนับ สามครั้งที่มีคนบอกให้เปลี่ยนเชือก วันไหน ใครบอก นายตอบว่าอะไร แล้วนับต่อว่าถ้าคนงานทั้งย่านรู้ว่านายจ่ายคนขาขาดครึ่งเดือน ใครจะยอมยืนใต้เชือกรอกของนายในเดือนหน้า

          นายจ่ายเต็มเดือน บวกค่าขาไม้ ส่งคนเอาไปให้ราวิสตั้งแต่เย็นวันนั้น ราวิสถามคนส่งเงินว่าใครไปบ้านนาย คนส่งเงินบอกชื่อ ราวิสนอนมองเพดานไปจนเช้า
        effects: { stats: { INT: 1 }, alignment: { moral: 1 }, flags: [helped_ravis, boss_paid_ravis] }
      failure:
        text: |
          นายฟังได้สามประโยค แล้วบอกว่าเชือกขาดเพราะราวิสยกของเกินน้ำหนัก ไม่ใช่เพราะเชือกเก่า คนที่ไม่เชื่อก็ไปทำงานที่อื่นได้

          ค่าแรงสัปดาห์นั้นของ{name}หายไปหนึ่งเหรียญ นายบอกว่าเป็นค่าวันที่{name}มาเดินเล่นที่บ้านเขา ราวิสได้ครึ่งเดือนตามเดิม
        effects: { gold: -1, flags: [boss_watches_you] }
    - id: leave_ravis
      label: ไม่ใช่เรื่องของตัวเอง ทำงานต่อไป
      text: |
        {name}เดินผ่านห้องเช่าชั้นล่างทุกเช้าระหว่างทางไปทำงาน ประตูห้องปิดอยู่สองสัปดาห์ สัปดาห์ที่สามประตูเปิด ราวิสนั่งอยู่บนเก้าอี้หน้าห้อง ขาไม้ที่เขาต่อเองจากขาโต๊ะวางพาดอยู่บนเข่าข้างที่เหลือ

        เขามอง{name}เดินผ่าน ไม่ทัก {name}ไม่ทัก ปลายเดือนห้องนั้นมีคนเช่าใหม่ เจ้าของบ้านก็ไม่รู้ว่าราวิสไปไหน
      effects: { flags: [ravis_left_alone] }
    - id: keep_him_on
      label: ใช้ตำแหน่งหัวหน้าคนงาน เขียนชื่อราวิสไว้บนกระดานต่อ ให้เขานั่งนับของ
      requires: { flag: became_foreman }
      text: |
        กระดานหน้าที่ทำงานเป็นงานของหัวหน้าคนงาน นายไม่เคยอ่านมันเองสักครั้ง {name}เขียนชื่อราวิสไว้ที่เดิม เปลี่ยนงานข้างชื่อจากยกของเป็นนับของ แล้ววางเก้าอี้ตัวหนึ่งไว้ข้างประตูโกดัง

        ราวิสกลับมาทำงานเดือนต่อมา นั่งนับลังที่เข้าออกทุกลัง นับไม่ผิดสักลัง ครึ่งปีต่อมานายเพิ่งรู้ว่ามีคนขาเดียวนั่งอยู่ข้างประตูโกดัง นายถามว่าใครอนุญาต ราวิสชี้กระดุมทองเหลืองบนอกเสื้อของ{name}
      effects: { alignment: { law: -1, moral: 1 }, flags: [ravis_reconciled, kept_ravis_on] }
    - id: pay_the_name
      label: เอาสามเหรียญไปให้ราวิส แล้วถามถึงคนงานใหม่ที่{name}เคยบอกชื่อให้ลบ
      requires: { flag: gave_ravis_a_name, min_gold: 3 }
      text: |
        ราวิสรับเงินสามเหรียญ แล้วบอกว่าคนงานใหม่คนนั้นที่{name}บอกชื่อเมื่อหลายปีก่อน ตอนนี้เป็นช่างไม้อยู่ปลายตลาด ขาไม้ที่หมอสั่งให้ราวิส สั่งจากร้านของเขา

        เมื่อวานช่างไม้คนนั้นมาทาบไม้กับขาให้ถึงห้อง ไม่ได้คิดเงินค่ามา ไม่รู้ว่าราวิสเป็นใคร ราวิสบอกว่าเขาก็ไม่ได้บอก เขาวางเหรียญสามเหรียญของ{name}ไว้บนหัวเข่าข้างที่เหลือ ไม่ได้เก็บใส่กระเป๋า
      effects: { gold: -3, alignment: { moral: 1 }, flags: [ravis_reconciled] }

- id: adult.mid_commoner_same_mistake
  stage: adult
  weight: 30
  when:
    age: [33, 40]
    flags: [path_commoner]
  text: |
    เด็กหนุ่มอายุสิบเจ็ดเพิ่งมาทำงานได้สองเดือน เล่าเรื่องตลกเรื่องเดิมทุกเช้าจนคนในที่ทำงานท่องได้ เขาทำงานเร็วกว่าทุกคน เร็วเพราะข้ามขั้นตอนที่คนอื่นทำ เขาผูกเชือกครึ่งปม ไม่รอให้ลังนิ่งก่อนเดินเข้าไปใต้มัน ไม่เคยมองขึ้นข้างบนก่อนยก

    {name}ทำงานนี้มาสิบกว่าปี รู้ว่าเชือกครึ่งปมจะไม่ขาดในเดือนแรก หรือเดือนที่สอง เชือกจะขาดในวันที่ทุกคนลืมไปแล้วว่าผูกไว้ครึ่งปม

    เช้านี้เขาเดินเข้าไปใต้ลังที่ยังแกว่งอยู่ ยิ้มให้{name} แล้วเล่าเรื่องตลกเรื่องเดิมอีกรอบ
  choices:
    - id: teach_slow
      label: ทำงานข้างเขาทั้งเดือน ทำทุกขั้นตอนให้ดูช้าๆ
      check: { stat: CON, dc: 12 }
      success:
        text: |
          {name}ไม่ได้สอนด้วยปาก {name}ผูกปมเต็มทุกปมข้างๆ เขา รอให้ลังนิ่งทุกครั้งก่อนเดินเข้าไป มองขึ้นข้างบนทุกครั้งก่อนยก ช้าจนเขาบ่น บ่นจนคนอื่นหัวเราะ ปลายเดือนหลังของ{name}ปวดจนต้องนอนคว่ำ

          เดือนที่สองเขาเริ่มผูกปมเต็มเองโดยไม่มีใครบอก วันหนึ่งเขามองขึ้นข้างบนก่อนยก แล้วเห็นตะขอที่หลุดครึ่งหนึ่ง เขาไม่ได้เล่าเรื่องตลกในเช้าวันต่อมา เขาเล่าเรื่องตะขอแทน
        effects: { stats: { CON: 1 }, flags: [taught_the_new_boy] }
      failure:
        text: |
          สัปดาห์แรก{name}ทำงานช้าข้างเขาทุกขั้นตอน สัปดาห์ที่สองหลังของ{name}เคล็ดตอนยกลังที่หนักเกินไป ต้องนอนอยู่บ้านสิบวัน

          พอกลับมา เขาย้ายไปทำงานกับคนอื่นแล้ว คนที่ทำงานเร็ว เขายังผูกเชือกครึ่งปม ยังเล่าเรื่องตลกเรื่องเดิม ยังไม่เคยมองขึ้นข้างบน
        effects: { hp: -2, flags: [new_boy_learned_alone] }
    - id: tell_the_boss
      label: ไปบอกนายให้ย้ายเขาไปทำงานที่ไม่ต้องยืนใต้ของหนัก
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ไม่ได้บอกนายว่าเด็กคนนั้นประมาท {name}บอกว่าเด็กคนนั้นนับเร็ว ตาไว จำของได้ทุกลัง เหมาะกับงานนับของหน้าประตูมากกว่างานยก นายย้ายเขาในสัปดาห์นั้น

          เด็กหนุ่มไม่พอใจ เขาบอกทุกคนว่านายย้ายเขาไปทำงานของคนแก่ แต่ปลายปีเขานับของได้ไม่ผิดสักลัง และเชือกรอกในที่ทำงานขาดหนึ่งเส้นในฤดูหนาว ตรงที่เขาเคยยืน
        effects: { stats: { INT: 1 }, flags: [moved_the_new_boy] }
      failure:
        text: |
          นายบอกว่าเด็กทำงานเร็วก็ดีแล้ว จะย้ายไปทำไม แล้วถามว่า{name}ทำงานช้าลงเพราะแก่หรือเปล่า

          {name}กลับไปทำงานตามเดิม เด็กหนุ่มยังยืนใต้ลังที่แกว่งอยู่ทุกวัน ทุกครั้งที่ได้ยินเสียงเชือกเสียดรอก{name}จะหยุดมือ แล้วมองขึ้นข้างบนแทนเขา
        effects: { flags: [boss_ignored_the_warning] }
    - id: ask_his_father
      label: ถามเขาว่าเรื่องตลกเรื่องนั้นได้มาจากไหน
      requires: { flag: helped_habel_widow }
      text: |
        เด็กหนุ่มบอกว่าเป็นเรื่องของพ่อ พ่อของเขาชื่อฮาเบล ตายในงานตอนเขาอายุสี่ขวบ เขาจำหน้าพ่อไม่ได้ แต่แม่เล่าเรื่องตลกเรื่องนั้นให้ฟังทุกเช้าตั้งแต่เขาจำความได้ แม่บอกว่าพ่อเล่ามันทุกเช้า จนคนในที่ทำงานท่องได้

        {name}บอกเขาว่าพ่อของเขาผูกเชือกครึ่งปม ไม่เคยมองขึ้นข้างบน และตายเพราะงานที่ทุกคนทำทุกวันพลาดไปครั้งเดียว เด็กหนุ่มฟังแล้วนั่งลงบนลังตรงนั้น ตั้งแต่วันต่อมาเขาผูกปมเต็มทุกปม และยังเล่าเรื่องตลกเรื่องเดิมทุกเช้า
      effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [met_habels_son] }
    - id: let_him_learn
      label: ปล่อยให้เขาเรียนเอง เหมือนที่ทุกคนเคยเรียน
      text: |
        {name}ไม่ได้บอกอะไร ทุกคนในที่ทำงานเคยผูกเชือกครึ่งปมตอนอายุสิบเจ็ด ทุกคนเคยเดินเข้าไปใต้ของที่ยังแกว่ง

        เดือนที่สี่ลังไม้ลังหนึ่งหลุดจากปมครึ่งปมของเขา ตกลงมาเฉียดไหล่ไปหนึ่งคืบ เขายืนนิ่งอยู่ตรงนั้นจนมีคนมาจับแขนพาออก วันต่อมาเขาผูกปมเต็มเอง เรื่องตลกเรื่องนั้นหายไปจากที่ทำงานสามวัน แล้วก็กลับมา
      effects: { stats: { STR: 1 }, flags: [let_new_boy_learn] }
