# ชุด 5 ยุคดาวเร่ง แพ็ก ก: ทะเลข้างบน คนเรียกฟ้าว่า "น้ำบน" (8 เรื่อง) สิ่งติดตัว curse_sea (คลื่นเรียก มีสามขั้น)
# 1 สัญญาณแรกบนทางลมระหว่างเสาสองต้นของไอเลธ (ทุกวัย คนมีตรามีทางของตัวเอง) · 2 เกลือขอบหลังคา (ทุกวัย ไม่ผูกถิ่น ตั้งแต่ 367)
# 3 ฝาเดียวจากกระติกของคนประมง (ทุกวัย เวนทราส ก่อน 367) ดันรอยดาว · 4 ตุ่มที่ฝาหลุด (ทุกวัย ไม่ผูกถิ่น ตั้งแต่ 367)
# 5 ก้นบ่อกลางซอย ข้อตกลงที่สอง ดันรอยดาว (วัยทำงาน) · 6 เงื่อนคนเรือ (วัยปลาย) · 7 เชือกเสาเตียง (เกิดซ้ำได้) · 8 ทางออก
# คนที่มีแต่ในข้อความ: ทอร์ลัน คนตัดไม้ค่ายชายป่า · เอลวาริน เอลฟ์เสื้อคลุมเทาจากหอนับดาว · ลุงซาเวล คนประมงหมู่บ้านนอกเมือง
#   ตาบรุค คนล้างบ่อที่ตายไปแล้ว กับเวสนา เมียม่ายของแก · เมิร์ล เด็กหนุ่มบ้านถัดไปที่รับจ้างผูกเงื่อน
# เรื่อง 5 ถึง 8 ไม่ผูกถิ่น จึงเขียนถึงฝนธรรมดา คลื่นมาทุกครั้งที่ฝนตก ไม่ต้องเป็นฝนเค็ม

# ---------- 1 สัญญาณแรก: ทางลม ----------
- id: adult.sky_sea_wind_path
  stage: adult
  weight: 28
  scene: road
  when:
    age: [16, 130]
    year: [352, 360]
    location_tag: ileth
  text: |
    ทางเดินเท้าระหว่างเสาของอุลเวนกับเสาของทาลิสเป็นทางที่ลมไม่เคยหยุด คนเดินทางนี้ต้องผูกหมวกไว้ใต้คาง ศาลาพักทางกลางทางมีรางไม้รองน้ำฝนไว้ให้คนกับล่อได้กิน บ่ายนั้นฝนห่าสั้นๆ ลงมาพอให้รางเต็ม พอฝนหยุด ใบไม้ริมทางขึ้นคราบขาวทุกใบ ขอบรางไม้ขาวเป็นเส้นเท่านิ้วก้อย

    ทอร์ลัน คนตัดไม้จากค่ายชายป่า เอาหลังมือป้ายใบไม้แล้วเลีย หัวเราะลั่นศาลา บอกว่าฟ้าเหงื่อออก ยายจากหมู่บ้านชายป่าที่หลบฝนอยู่ด้วยกันดึงผ้าโพกหัวมาปิดปากหลานจนเด็กดิ้น ส่วนคนสามคนที่เดินสวนมาจากอีกฝั่ง ยืนแหงนหน้าอยู่กลางทางตลอดตอนฝนตก ไม่หลบ ไม่มีใครเรียก ฝนหยุดแล้วถึงเดินเข้ามาในศาลา ผมเปียกติดหน้า ทอร์ลันถามว่ายืนทำอะไรกัน ทั้งสามตอบคำเดียวกัน ว่าฟังเสียงคลื่น ไม่มีใครในสามคนนั้นเคยลงไปถึงทะเล

    เอลฟ์เสื้อคลุมสีเทาคนหนึ่งเดินลงมาจากหอนับดาว ชื่อเอลวาริน ถือตะกร้าขวดแก้วปากแคบมาเต็มแขน เขาขอให้คนในศาลาช่วยกันรองน้ำที่ยังหยดจากชายคา ทางตะวันตกเมฆตั้งเค้ามาอีกก้อน ล่อของทอร์ลันยื่นหน้าเข้าหารางน้ำแล้ว
  choices:
    - id: scrub_the_trough
      label: ดึงจุกรางทิ้งน้ำ แล้วขัดรางให้หมดคราบก่อนล่อจะได้กิน
      text: |
        {name}ดันหัวล่อออกจากรางด้วยไหล่ ดึงจุกไม้ที่ปลายราง น้ำไหลลงดินเป็นทางขาว ทรายในมือขัดคราบออกได้ทีละนิด แต่ไม่ออกหมด ไม้ดูดเกลือเข้าเนื้อไปแล้ว ยายชายป่าลุกมาช่วยด้วยผ้าโพกหัวผืนเดิม หลานนางได้หายใจเต็มปากเสียที

        ทอร์ลันบ่นว่าล่อเขาหิวน้ำ แต่ก็ไม่ห้าม ก่อนออกเดินเขาเลียหลังมืออีกครั้ง แล้วถุยลงดิน บอกว่าคราวนี้ขม
      effects: { alignment: { moral: 1 }, flags: [scrubbed_the_salt_trough] }
    - id: bottle_with_the_elf
      label: ช่วยเอลวารินรองน้ำใส่ขวด แล้วจดว่าใบไม้ใบไหนขึ้นคราบก่อน
      habit: curious
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}รองน้ำได้เจ็ดขวด ปิดจุกขี้ผึ้ง เขียนเวลาไว้ข้างขวดทุกขวด แล้วเดินไล่ดูใบไม้ริมทาง ใบที่หันหน้าขึ้นฟ้าขึ้นคราบหนากว่าใบที่หันลง ใบไม้ตายแล้วไม่ขึ้นคราบเลยสักใบ {name}จดลงกระดาษแผ่นเดียวกับที่เอลวารินจด ลายมือสองคนเรียงกันลงมาถึงท้ายแผ่น

          เอลวารินอ่านแล้วพับกระดาษเก็บเข้าอกเสื้อ เขาบอกว่าที่หอมีคนนับดาวกันทั้งคืน ยังไม่มีใครนับใบไม้ ตอนแยกกันเขาให้ขวดเปล่าไว้ใบหนึ่ง บอกว่าถ้าฝนแบบนี้ไปตกที่อื่น ช่วยรองไว้ให้ด้วย
        effects: { stats: { INT: 1 }, flags: [bottled_salt_rain_for_the_counting_tower] }
      failure:
        text: |
          ขวดแก้วลื่นมือ คราบเกลือที่เกาะคอขวดทำให้จับไม่อยู่ ขวดที่สามตกแตกบนพื้นศาลา น้ำกระจายเป็นวงขาว เอลวารินเก็บเศษแก้วทีละชิ้นใส่ผ้า แล้วบอกราคาขวดอย่างสุภาพจนต้องจ่าย

          ตกค่ำพื้นศาลาตรงที่น้ำหกยังขาวอยู่ ล่อของทอร์ลันก้มลงเลียพื้นตรงนั้นจนเจ้าของต้องฉุดเชือก
        effects: { gold: -1, flags: [bottled_salt_rain_for_the_counting_tower] }
    - id: scrape_and_sell
      label: ขูดคราบเกลือจากรางกับใบไม้ ห่อไปขายคนครัวของค่ายตัดไม้
      text: |
        เกลือได้ครึ่งห่อผ้า สีขาวอมฟ้านิดๆ เม็ดละเอียดกว่าเกลือทะเลที่ขายตามตลาด คนครัวของค่ายชิมแล้วจ่ายสองเหรียญไม่ต่อสักคำ เขาว่าหวานปลายลิ้น ใส่แกงแล้วไม่ต้องใส่อย่างอื่น

        สัปดาห์ต่อมาทอร์ลันเดินผ่านศาลาอีกรอบ เล่าว่าคนในค่ายสองคนนั่งแช่ลำธารแข่งกันกลั้นหายใจทุกเย็น ไม่มีใครยอมแพ้ คนครัวต้องลงไปดึงผมขึ้นมากินข้าว ทอร์ลันถามว่าเกลือยังเหลืออีกไหม
      effects: { gold: 2, flags: [sold_trough_salt_to_the_camp_cook] }
    - id: stand_in_the_second_rain
      label: ออกไปยืนกลางฝนห่าที่สอง ตรงที่สามคนนั้นเคยยืน
      requires: { trait: curse_brand }
      text: |
        ฝนห่าที่สองหนักกว่าห่าแรก {name}ยืนแหงนหน้าตรงกลางทาง ฝนตบหน้าจนลืมตาไม่ขึ้น ได้ยินเสียงฝนบนใบไม้ เสียงลมลอดเสาสองต้น เสียงล่อกระทืบเท้าในศาลา นอกจากนั้นไม่มีอะไร น้ำที่ไหลเข้าปากเค็มเหมือนน้ำตาคนอื่น

        พอเดินกลับเข้าศาลา สามคนนั้นนั่งรออยู่ คนหนึ่งยื่นผ้าให้เช็ดหน้า อีกคนถามว่าคลื่นลูกสุดท้ายสูงแค่ไหน {name}บอกว่าไม่มีคลื่น มีแต่ฝน คนถามดึงผ้าคืนไปจากมือ{name}เบาๆ แล้วหันไปคุยกันเองสามคน
      effects: { stats: { WIS: 1 }, flags: [stood_in_salt_rain_hearing_only_rain] }

# ---------- 2 เกลือขอบหลังคา ----------
- id: adult.sky_sea_roof_salt
  stage: adult
  weight: 24
  scene: home
  when:
    age: [16, 130]
    year: [367, 378]
  text: |
    เด็กสามคนบ้านท้ายซอยต่อตัวกันขึ้นไปเลียขอบหลังคาเพิงฟืน แม่ของคนบนสุดเห็นจากหน้าต่าง ทิ้งแป้งที่นวดค้างไว้แล้ววิ่งออกมาดึงลูกลงทั้งขา ตีก้นทีหนึ่งแล้วกอดไว้แน่น ขอบหลังคาทุกหลังในซอยขาวเป็นเส้นหลังฝนเมื่อคืน เกล็ดเกลือหนาเท่าเล็บ ตั้งแต่ปีที่เรือเหาะห้าลำขึ้นไปแล้วไม่ลงมา ฝนแบบนี้ก็ตกไกลจากทะเลเข้ามาเรื่อยๆ ปีละหลายหน

    ซอยนี้ตั้งธรรมเนียมขึ้นเองโดยไม่มีใครประกาศ ฝาตุ่มน้ำฝนต้องมีหินทับ คืนฝนตก บ้านไหนมีคนเคยดื่มน้ำฝนต้องผูกข้อเท้าคนนั้นไว้กับเสาเตียง เกลือที่ขูดจากหลังคาห้ามเทลงท่อหลังตะวันตกดิน คนแก่ในซอยว่าเป็นข้อของแม่น้ำ แม่น้ำไม่ชอบรับของเสียตอนกลางคืน ของแบบนี้ยิ่งไม่ชอบ

    สายวันนั้นพ่อค้าเร่ขายเกลือฟ้าเข้ามาถึงซอย ขวดเล็กปิดจุกไม้เรียงในกล่องหนัง ป้ายเขียนว่าเกลือฟ้า แก้ได้ทุกโรค ขวดละครึ่งเหรียญ บ้านที่มีคนแก่ไอเรื้อรังซื้อไปแล้วสองบ้าน เขาเดินมาหยุดหน้าเรือนที่{name}อยู่ ชี้ขอบหลังคาที่ขาวเป็นเส้น ขอขูดเอง แบ่งเงินให้ครึ่งหนึ่ง
  choices:
    - id: let_him_scrape
      label: ให้เขาขูด รับเงินครึ่งหนึ่ง
      text: |
        พ่อค้าเร่ปีนบันไดขึ้นไปขูดด้วยช้อนเขาสัตว์ ผ้าปิดจมูกแน่นทุกครั้งที่ก้ม เกลือลงถุงผ้าทีละช้อน ได้สิบสองขวด เขานับเงินใส่มือ{name}ตรงตามที่ตกลง ไม่ขาดสักเศษ

        เดือนต่อมายายบ้านหัวซอยที่ซื้อไปยังไอเท่าเดิม แต่ยังซื้ออยู่ทุกครั้งที่พ่อค้าเร่ผ่านมา นางบอก{name}ว่าเกลือนี้กินแล้วคอโล่ง โล่งจนกลั้นหายใจได้นาน นางลองนับให้ฟังที่หน้าบ้าน นับไปเรื่อยจนหลานต้องเขย่าแขน
      effects: { gold: 2, flags: [sold_roof_salt_to_the_peddler] }
    - id: bury_by_the_old_rule
      label: ขูดเกลือเอง ห่อผ้า เอาไปฝังโคนต้นไม้ก่อนตะวันตกดิน
      text: |
        {name}ขูดเกลือจากขอบหลังคาด้วยสันมีดลงผ้าเก่า มัดปากสามรอบ แล้วเดินไปขุดหลุมโคนต้นไม้ท้ายซอย ลึกพอให้หมาคุ้ยไม่ถึง พ่อค้าเร่ยืนดูจนกลบดินเสร็จ แล้วเดินไปหาหลังคาบ้านอื่น

        เย็นนั้นมีอีกสองบ้านถือห่อผ้าออกมาตาม ยายที่สอนข้อของแม่น้ำถือเสียมเล่มเล็กมาขุดหลุมให้เอง เดือนต่อมาโคนต้นไม้ท้ายซอยมีหลุมกลบใหม่เรียงกันเป็นแถว ไม่มีใครปลูกอะไรตรงนั้นอีก
      effects: { world: { land: 1 }, flags: [buried_roof_salt_by_the_river_rule] }
    - id: warn_the_buyers
      label: ไม่ให้ขูด แล้วเดินไปเคาะบ้านที่ซื้อเกลือไปทีละบ้าน
      habit: soft_heart
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}เล่าเรื่องคนในซอยอื่นที่ดื่มน้ำฝนแล้วต้องผูกขาทุกคืน เล่าช้าๆ ไม่ขู่ บ้านแรกเอาขวดมาคืน จุกยังไม่ได้เปิด บ้านที่สองเปิดไปแล้วครึ่งขวด เมียเจ้าของบ้านเทที่เหลือลงหลุมโคนรั้วกับมือ{name}

          พ่อค้าเร่คืนเงินให้สองบ้านนั้นโดยไม่เถียง เก็บกล่องหนังเดินออกจากซอยไปเงียบๆ เขาไม่ได้โกรธ เขาแค่รู้ว่าซอยถัดไปยังไม่มีใครเคาะประตู
        effects: { stats: { CHA: 1 }, flags: [warned_the_lane_off_sky_salt], city: { merit: 1, here: true } }
      failure:
        text: |
          บ้านแรกฟังจนจบแล้วถามว่า{name}จะเอาเกลือไปขายเองหรือเปล่า บ้านที่สองไม่เปิดประตู ลูกสาวบ้านนั้นตะโกนผ่านบานไม้ว่าแม่นางนอนหลับทั้งคืนเป็นครั้งแรกในหน้าหนาวนี้ ไม่ต้องมาเคาะ

          ตกเย็นพ่อค้าเร่ขูดหลังคาบ้านติดกันแทน ขอบหลังคาเรือนที่{name}อยู่ขาวเป็นเส้นอยู่หลังเดียวในซอย
        effects: { flags: [warned_the_lane_off_sky_salt] }

# ---------- 3 ของที่ยื่นให้: ฝาเดียว ----------
- id: adult.sky_sea_capful
  stage: adult
  weight: 24
  scene: market
  when:
    age: [16, 130]
    year: [354, 366]
    location_tag: ventras
    not_traits: [curse_brand, curse_sea]
  text: |
    ลุงซาเวลหาบปลามาขายที่ท่าปลาปากแม่น้ำทุกเช้า มาตั้งแต่ท่าปลายังเป็นท่าไม้ หมู่บ้านประมงของแกอยู่นอกเมืองไปทางตะวันออกครึ่งวันเดิน ตรงที่ฝนเค็มตกบ่อยกว่าในเมือง ขายปลาหมดแล้วแกนั่งซ่อมแหอยู่บนเรือคว่ำลำเดิมจนเที่ยง มือของแกแตกเป็นร่องเหมือนดินท้องนาหน้าแล้ง ไล่จากข้อนิ้วขึ้นไปถึงข้อศอก แกเอาไขปลาทาทุกครู่

    ลูกสาวแกที่มาช่วยขายเล่าให้คนท่าปลาฟังว่าคืนฝนตกต้องผูกข้อเท้าพ่อไว้กับเสาเตียง ผูกแล้วยังต้องนอนขวางประตู คนท่าปลาหัวเราะกัน ลุงซาเวลหัวเราะด้วย บอกว่าไม่เคยหลับสบายเท่าคืนที่ได้ยินคลื่นจากหลังคา

    วันนี้{name}นั่งพักอยู่ข้างเรือคว่ำ ลุงซาเวลหยิบกระติกหนังออกจากใต้แห บอกว่าเป็นน้ำบนกรองผ้าสามชั้นแล้ว คนดื่มน้ำบนไม่จมน้ำ แกจุ่มหน้าลงถังน้ำทะเลข้างตัวให้ดูจนนกนางนวลเลิกสนใจ แล้วยกหน้าขึ้นหายใจช้าๆ เหมือนคนชิมอาหาร แกเปิดจุก รินใส่ฝากระติกจนเต็มฝา ยื่นมาให้
  choices:
    - id: drink_the_capful
      label: รับฝากระติกมาดื่ม (ของแบบนี้ติดตัวไปนาน)
      text: |
        น้ำในฝาเค็มแบบน้ำตา ไม่ใช่แบบทะเล ปลายลิ้นหวานนิดหนึ่งตอนกลืนลงไปแล้ว ลุงซาเวลรับฝาคืน เช็ดกับเสื้อ ปิดจุกแล้วกลับไปซ่อมแหต่อ

        คืนนั้นฝนตกที่ไหนสักแห่งในเมือง ไม่ใช่ฝนเค็ม แค่ฝน {name}ได้ยินคลื่นจากหลังคา คลื่นลูกยาวที่ซัดเข้ามาแล้วถอยกลับ ไม่ได้มาจากทางแม่น้ำ มาจากข้างบน {name}ลุกไปตักน้ำใส่กะละมัง ก้มหน้าลงไป อยู่ในนั้นจนเสียงคลื่นนิ่งเรียบ ข้างในอก ไม่มีอะไรร้องขออากาศเลย นับเท่าไรก็ไม่ร้อง ตอนยกหน้าขึ้นมา ลมหายใจแรกหยาบเหมือนเคี้ยวทราย
      effects: { traits: [curse_sea], marks: { star: 1 }, world: { star: 1 }, flags: [drank_the_fishermans_capful] }
    - id: decline_the_capful
      label: ขอบคุณ แล้วปฏิเสธ
      text: |
        ลุงซาเวลไม่ถือ แกยกฝาขึ้นดื่มเอง แล้วรินฝาใหม่เก็บไว้ บอกว่าลูกสาวก็ไม่เอาเหมือนกัน คนหนุ่มคนสาวกลัวน้ำกันหมด

        เช้าหลังคืนที่ฝนตก{name}เดินผ่านท่าปลา คนหาบปลามาวันนั้นเป็นลูกสาวแก ฝ่ามือนางมีรอยเชือกครูดแดงทั้งสองข้าง นางชั่งปลาให้คนซื้อทีละคน ยิ้มทุกคน ไม่มีใครถามถึงลุง
      effects: { flags: [declined_the_fishermans_capful] }
    - id: look_at_his_hands
      label: ขอดูมือของลุงให้ชัดก่อน
      habit: cool_headed
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ลุงซาเวลยื่นมือมาให้ดูอย่างภูมิใจ ในร่องแตกทุกร่องมีเกลือเกาะเป็นเส้นขาว ไขปลาที่ทาไว้ลอยอยู่บนเกลือ ไม่ซึมลงไป ข้อเท้าแกที่โผล่พ้นขากางเกงมีรอยเชือกเป็นวง วงเก่าซ้อนวงใหม่จนผิวตรงนั้นด้านเป็นหนัง และเวลาแกพูด แกหายใจน้อยกว่าคนอื่นครึ่งหนึ่ง

          {name}ขอซื้อปลาแทน ลุงซาเวลเลือกตัวที่ดีที่สุดในกระบุงให้ คิดราคาเต็ม แกบอกว่าคนตาดีแบบนี้ มาซื้อปลาบ่อยๆ
        effects: { stats: { WIS: 1 }, flags: [read_the_fishermans_hands] }
      failure:
        text: |
          มือคนประมงแก่ก็แตกอย่างนี้ทุกคน {name}ดูไม่ออกว่าต่างจากมือคนท่าปลาคนอื่นตรงไหน ลุงซาเวลรอจนเบื่อ ยกฝาขึ้นดื่มเอง

          {name}ซื้อปลาแกไปหนึ่งตัวเพราะเกรงใจ ตกเย็นต้มปลาตัวนั้นโดยยังไม่ได้ใส่เกลือสักเม็ด น้ำแกงเค็มจนต้องเติมน้ำสองรอบ
        effects: { gold: -1, flags: [read_the_fishermans_hands] }

# ---------- 4 อุบัติเหตุ: ตุ่มที่ฝาหลุด ----------
- id: adult.sky_sea_open_jar
  stage: adult
  weight: 20
  scene: home
  when:
    age: [16, 130]
    year: [367, 378]
    not_traits: [curse_brand, curse_sea]
  text: |
    {name}ตื่นก่อนไก่ คอแห้งจนกลืนน้ำลายไม่ลง เมื่อคืนกินปลาเค็มกับข้าวมากไป ตุ่มน้ำฝนหลังบ้านฝาหลุดลงไปนอนหงายอยู่บนดิน หินที่ทับฝากลิ้งไปค้างที่ร่องน้ำ ฝนลงหนักตอนดึก น้ำในตุ่มเต็มจนปริ่ม ใสจนเห็นก้นตุ่ม กระบวยไม้ลอยอยู่ข้างบน ขอบปากตุ่มขาวเป็นวงบางๆ หรือเป็นคราบตะไคร่แห้งเก่าก็ได้ แสงยังไม่พอให้ดูออก

    หลังฝาไม้ของบ้านติดกันมีเสียงคนแก้เชือก เสียงเชือกครูดเสาเตียงช้าๆ แล้วเสียงคนไอ
  choices:
    - id: drink_from_the_jar
      label: ตักกินเลย น้ำในตุ่มดูใสดี
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          น้ำแตะริมฝีปากแค่นั้น เค็มก็ขึ้นมาถึงจมูก {name}ถ่มทิ้งลงดิน บ้วนปากด้วยน้ำลายตัวเองอีกสองรอบ แล้วเอากระบวยคว่ำไว้บนปากตุ่ม

          พอแสงพอ ขอบตุ่มขาวเป็นวงเกลือจริงๆ ไม่ใช่ตะไคร่ {name}เทน้ำทั้งตุ่มลงร่อง ขัดตุ่มด้วยขี้เถ้า แล้วหาหินก้อนที่ใหญ่กว่าเดิมมาทับฝา
        effects: { stats: { WIS: 1 }, flags: [spat_out_the_jar_water] }
      failure:
        text: |
          สามอึกแรกลงคอไปก่อนลิ้นจะทันบอกอะไร รสหวานมาก่อน เค็มตามมาทีหลัง {name}ยืนถือกระบวยอยู่ข้างตุ่มจนไก่ขัน ไม่ได้ตักต่อ แต่ก็ไม่ได้เททิ้ง

          คืนต่อมาฝนตกเบาๆ {name}นอนฟังเสียงที่ไม่ใช่ฝนบนหลังคา เสียงยาว ซัดเข้ามาแล้วถอยกลับ ตอนเช้าลองก้มหน้าลงกะละมังล้างหน้า นับไปถึงร้อยแล้วอกยังไม่ร้องขออะไร {name}ยกหน้าขึ้นเพราะเบื่อนับ ไม่ใช่เพราะต้องหายใจ แล้วไม่ได้บอกใคร
        effects: { traits: [curse_sea], flags: [drank_from_the_open_jar] }
    - id: pour_the_jar_out
      label: เทน้ำทิ้งทั้งตุ่ม แล้วซื้อน้ำบ่อจากคนหาบน้ำ
      text: |
        น้ำในตุ่มไหลลงร่องหลังบ้าน ทิ้งคราบขาวเป็นทางยาวไปจนถึงท่อ คนหาบน้ำมาถึงตอนสาย ขึ้นราคาจากเมื่อวานหนึ่งเท่า บอกว่าหลังคืนฝนทุกบ้านเททิ้งหมด ต้องหาบกันทั้งวัน

        {name}จ่ายแล้วดื่มน้ำบ่อจนหายคอแห้ง น้ำบ่อมีกลิ่นดินนิดๆ จืดสนิท
      effects: { gold: -1, flags: [poured_out_the_open_jar] }
    - id: ask_next_door
      label: ไปเคาะถามบ้านติดกันก่อน ว่าฝนเมื่อคืนเค็มไหม
      habit: cool_headed
      text: |
        หญิงบ้านติดกันเปิดประตูมือยังถือเชือกป่าน ผัวนางนั่งอยู่บนเตียงข้างใน ข้อเท้าแดงเป็นวง ผมเปียกจนน้ำหยดลงหมอน ประตูบ้านนางลงกลอนอยู่ทั้งคืน นางตอบคำเดียวว่าเค็ม แล้วรินน้ำจากตุ่มในครัวที่ปิดฝาผนึกขี้ผึ้งให้{name}หนึ่งถ้วย

        ตอนส่งถ้วยคืน นางขอให้{name}ช่วยจับแขนผัวไว้ระหว่างนางผูกเชือกเส้นใหม่ เขาไม่ดิ้น เขาถาม{name}เบาๆ ว่าเมื่อคืนได้ยินคลื่นไหม
      effects: { flags: [asked_next_door_about_the_rain] }

# ---------- 5 ลึกลง: ก้นบ่อกลางซอย (วัยทำงาน) ----------
- id: adult.sky_sea_well_bottom
  stage: adult
  weight: 80
  when:
    age: [16, 59]
    year: [356, 378]
    trait: curse_sea
    not_traits: [curse_brand]
  text: |
    บ่อกลางซอยต้องลงล้างก้นปีละหน ตาบรุคเป็นคนลงให้ซอยนี้มาทั้งชีวิต ปีนี้แกตายไปตั้งแต่ต้นหน้าแล้ง ถังที่หย่อนลงไปตักขึ้นมามีแต่ตะกอน น้ำในบ่อลึกสองช่วงคน ข้างล่างมีของที่ตกลงไปค้างกันหลายปี ถังของซอยใบที่หาย กุญแจ รองเท้าเด็กข้างเดียว และแหวนแต่งงานของเวสนา เมียม่ายตาบรุค ที่หลุดนิ้วตอนนางชะโงกดูผัวลงบ่อครั้งสุดท้าย

    คนในซอยรู้กันว่า{name}ก้มหน้าลงกะละมังล้างหน้าตอนเช้าได้นานผิดคน เด็กๆ เคยมายืนนับเล่นจนแม่ต้องเรียกกลับบ้าน หัวหน้าซอยเลยมาหาถึงหน้าประตู ถือเชือกขดใหญ่มาด้วย บอกว่าค่าลงบ่อเท่าที่เคยให้ตาบรุค ถ้าล้างเสร็จก่อนคนหาบน้ำมาตอนบ่าย ซอยจะจ่ายเพิ่มอีกเท่าตัว
  choices:
    - id: dive_on_the_rope
      label: ผูกเชือกที่เอว ลงทีละรอบ ขึ้นมาหายใจตามที่คนบนปากบ่อดึง
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ข้างล่างมืดสนิท ตาไม่ได้ช่วยอะไร {name}คลำก้นบ่อทีละคืบ กวาดตะกอนเข้าถังที่หย่อนลงมา ปากบ่อข้างบนเป็นวงฟ้าเท่าฝ่ามือ ทุกครั้งที่เชือกกระตุก {name}ต้องฝืนใจขึ้นไป อกยังไม่ร้องขออะไรเลยสักนิด หายใจที่ปากบ่อแต่ละครั้งหยาบคอจนต้องรีบลงไปใหม่

          รอบที่เก้าได้ถังของซอยขึ้นมา รอบที่สิบเอ็ดได้แหวน เวสนารับแหวนไปถือไว้ในกำมือ ไม่ใส่ หัวหน้าซอยจ่ายค่าลงบ่อครบ คืนนั้นฝนตก เสียงคลื่นบนหลังคาดังกว่าทุกคืนที่ผ่านมา และขาของ{name}หนักเหมือนยังเดินอยู่ก้นบ่อ
        effects: { stats: { CON: 1 }, gold: 1, trait_step: { curse_sea: 1 }, flags: [cleaned_the_lane_well_on_a_rope] }
      failure:
        text: |
          รอบที่หก{name}ไม่ขึ้นตามเชือก ข้างล่างสบายเกินไป คนบนปากบ่อดึงแรงจนเชือกครูดเอวถลอกเป็นแนว หัวไหล่ฟาดผนังหินตอนโดนลากผ่านปากบ่อ หัวหน้าซอยไม่ยอมให้ลงอีก จ้างคนจากซอยอื่นมาลงต่อ แล้วจ่ายให้{name}ครึ่งเดียว

          แผลที่เอวแสบไปทั้งสัปดาห์ คืนที่ฝนตก{name}นอนฟังคลื่นอยู่บนหลังคา มือคลำหาเชือกที่เอวทุกครั้งที่คลื่นถอยกลับ
        effects: { hp: -1, trait_step: { curse_sea: 1 }, flags: [cleaned_the_lane_well_on_a_rope] }
    - id: untie_and_stay_down
      label: แก้เชือกออก อยู่ข้างล่างรวดเดียวจนก้นบ่อสะอาด (ของแบบนี้ติดตัวไปนาน)
      habit: stubborn
      text: |
        {name}แก้เชือกที่เอวทิ้งไว้ข้างบ่อ แล้วลงไปทั้งตัว คนบนปากบ่อนับตามกัน นับดังๆ จนเลยร้อย แล้วเลิกนับ แล้วเริ่มเรียกชื่อ{name}ลงมา เสียงเรียกลงมาถึงก้นบ่อช้า เบา และไกลออกไปทุกครั้ง {name}ไม่ขึ้น คลำก้นบ่อทีละคืบ คัดของเป็นกอง ถัง กุญแจ รองเท้า แหวน ตะกอนลงถังทุกถังที่หย่อนลงมา วงฟ้าเท่าฝ่ามือข้างบนสว่างขึ้นทีละน้อย ได้ยินคลื่นจากตรงนั้น คลื่นที่ไม่มีฝน

        {name}ปีนขึ้นมาตอนเที่ยง ลมหายใจแรกเจ็บเหมือนกลืนเศษหอย คนในซอยถอยออกไปจากปากบ่อหนึ่งก้าวพร้อมกัน หัวหน้าซอยจ่ายเงินเพิ่มอีกเท่าตัวตามที่พูดไว้ ไม่นับซ้ำ เวสนาเดินมาจับมือ{name} มือนางอุ่นจนแปลก คืนนั้นฝนตก{name}ตื่นขึ้นมายืนอยู่ที่ปากบ่อ มือกำเชือกถังไว้แน่น
      effects: { gold: 3, trait_step: { curse_sea: 1 }, marks: { star: 1 }, world: { star: 1 }, flags: [stayed_down_the_lane_well] }
    - id: hold_the_rope_up_top
      label: ไม่ลง ถือคบกับเชือกอยู่ปากบ่อ ให้ซอยจ้างคนอื่นลง
      text: |
        ซอยจ้างคนล้างบ่อจากซอยอื่นมา เขาเก็บค่าลงจากทุกบ้านคนละสองเหรียญ ลงทีละอึดใจ ขึ้นมาปากเขียวตัวสั่น {name}ถือเชือกให้เขาทั้งวัน นับลมหายใจของเขาไปเรื่อยๆ อกของ{name}เองเจ็บตามทุกครั้งที่เขาขึ้นมาเร็วเกินไป

        เขาได้แหวนขึ้นมาตอนเกือบค่ำ เวสนาให้เงินเขาเพิ่มเหรียญหนึ่ง ทั้งวันนั้น{name}ไม่ได้แตะน้ำบ่อสักหยด ตกดึกฝนตก{name}นั่งกอดเข่าอยู่บนเตียง ฟังคลื่นจนสว่าง
      effects: { gold: -2, flags: [held_the_rope_and_stayed_dry] }

# ---------- 6 ลึกอีกชั้น: เงื่อนคนเรือ (วัยปลาย) ----------
- id: elder.sky_sea_old_knot
  stage: elder
  weight: 80
  scene: home
  time: night
  when:
    age: [60, 130]
    year: [356, 379]
    trait: curse_sea
  text: |
    เมิร์ล เด็กหนุ่มบ้านถัดไป มาผูกข้อเท้า{name}กับเสาเตียงทุกคืนที่ฝนตก ค่าจ้างคืนละขนมปังหนึ่งก้อน เขาผูกเงื่อนคนเรือที่พ่อเขาสอน ยิ่งดึงยิ่งแน่น แล้วดึงทดสอบสองที ก่อนกลับเขาลูบหัว{name}เหมือนลูบหัวหมาแก่ของบ้านตัวเอง

    นิ้วแก่ๆ ของ{name}หัดแกะเงื่อนนั้นในความมืดมาหลายคืนแล้ว แกะช้า แกะทีละห่วง ฝนครั้งก่อน เมิร์ลมาแก้เชือกตอนเช้าแล้วเจอเงื่อนหลุดไปสองห่วง เขาดึงเชือกดูแล้วเงยหน้ามอง{name}ครู่หนึ่ง คืนนี้ฝนลงอีก เงื่อนของเมิร์ลแน่นอยู่ที่ข้อเท้า คลื่นบนหลังคาซัดเข้ามาแล้วถอยกลับ ซัดเข้ามาแล้วถอยกลับ
  choices:
    - id: untie_and_go_out
      label: แกะเงื่อน ออกไปยืนกลางฝนสักพักแล้วค่อยกลับมา
      text: |
        ฝนกลางลานอุ่นกว่าที่คิด {name}แหงนหน้า อ้าปาก ลมหายใจช้าลงเองจนเกือบไม่ต้องหายใจ คลื่นซัดอยู่บนฟ้าเหนือหลังคาบ้านถัดไป ใกล้พอให้เอื้อมถึงถ้ายืดแขนอีกนิด ขาสองข้างหนักลงทุกที ยืนแล้วไม่อยากยก

        ก่อนสาง{name}กลับมาผูกเชือกเอง ผูกหลวมๆ ให้ดูเหมือนเดิม เช้านั้นเมิร์ลมาแก้เชือก จับผ้าปูที่นอนที่ยังชื้น แล้วคืนฝนต่อมาเขาผูกเพิ่มอีกรอบ ไม่ขอขนมปังเพิ่ม
      effects: { trait_step: { curse_sea: 1 }, flags: [untied_the_boat_knot_in_the_rain] }
    - id: basin_at_the_foot
      label: ไม่ออกไป ให้เมิร์ลวางกะละมังรองฝนไว้ปลายเตียง ก้มหน้าลงไปพอให้คลื่นเงียบ
      text: |
        เมิร์ลถือกะละมังไปรองชายคา ได้น้ำครึ่งกะละมังก็ยกมาวางปลายเตียงตามสั่ง แล้วนั่งรอที่ประตู {name}โน้มตัวลงไปเท่าที่เชือกยอม หน้าจุ่มลงน้ำฝน คลื่นบนหลังคาค่อยๆ เบาลงจนเหลือเสียงหยดเดียว

        เมิร์ลนับอยู่ที่ประตู นับเสียงดังขึ้นเรื่อยๆ แล้วลุกมาจับไหล่{name}ดึงขึ้น หน้าของเขาซีดกว่าคนอยู่ในน้ำ ตั้งแต่คืนนั้นเขารับค่าจ้างเป็นขนมปังสองก้อน ขาของ{name}ก็หนักกว่าเดิมทุกครั้งที่ลุกจากเตียง
      effects: { trait_step: { curse_sea: 1 }, flags: [kept_a_rain_basin_at_the_bed] }
    - id: double_knot_and_wax
      label: ให้เมิร์ลผูกสองเงื่อน แล้วเอาขี้ผึ้งอุดหูนอน
      text: |
        ขี้ผึ้งอุดหูได้แค่เสียงฝน คลื่นยังมา มาจากข้างในหัว {name}นอนนับเพดานทั้งคืน ข้อเท้าดึงเชือกทุกครั้งที่เผลอหลับ เงื่อนคนเรือรัดแน่นขึ้นทุกที

        เช้ามาเมิร์ลต้องเอามีดตัดเชือก ข้อเท้าบวมเป็นวงม่วง เดินลงบันไดไม่ไหวไปสามวัน แต่ผ้าปูที่นอนแห้ง และขาไม่หนักไปกว่าเมื่อวาน
      effects: { hp: -1, flags: [slept_double_knotted_with_wax_ears] }

# ---------- 7 อยู่กับมัน: เชือกเสาเตียง ----------
- id: adult.sky_sea_bedpost_rope
  stage: adult
  weight: 60
  once: false
  scene: home
  time: night
  cast:
    pal: { bond: [friend], optional: true }
  when:
    age: [16, 130]
    year: [354, 410]
    trait: curse_sea
  text: |
    เชือกป่านที่ผูกข้อเท้าเส้นนี้หนูแทะไปสองรอย ผ้าพันข้อเท้ากันเชือกบาดซักจนบางเห็นแสงลอด ฟ้าครึ้มตั้งแต่บ่าย ฝาตุ่มทับหินแล้ว หน้าต่างลงกลอนแล้ว เหลือแต่เชือก
  choices:
    - id: tie_it_twice
      label: ผูกสองรอบแล้วนอน
      text: |
        {name}ผูกเงื่อนแรกที่ข้อเท้า เงื่อนที่สองที่เสาเตียง ดึงทดสอบแล้วล้มตัวลงนอน ฝนมาตอนดึก คลื่นมาพร้อมกัน เท้าขยับเองสองสามที เชือกตึงแล้วหย่อน แล้วหลับยาวจนสว่าง
      effects: { hp: 1, flags: [tied_the_bedpost_rope_twice] }
    - id: sit_up_with_the_lamp
      label: ไม่ผูก นั่งฟังข้างหน้าต่างทั้งคืนพร้อมตะเกียงดวงหนึ่ง
      text: |
        ฝนลงตอนดึก {name}นั่งฟังคลื่นอยู่หลังบานหน้าต่างที่ลงกลอน มือกำกลอนไว้ คลื่นลูกหนึ่งยาวกว่าลูกอื่น ตอนคลื่นลูกนั้นถอยกลับ{name}ลุกขึ้นยืนไปแล้วครึ่งตัว เช้ามาเปลือกตาหนัก หัวตื้อไปทั้งวัน
      effects: { hp: -1, flags: [sat_up_listening_to_the_waves] }
    - id: buy_new_rope
      label: ไปซื้อเชือกเส้นใหม่กับผ้าพันข้อเท้าผืนใหม่ก่อนฝนลง
      text: |
        คนขายเชือกรู้ทันทีว่าซื้อไปทำอะไร เขาเลือกเส้นที่นุ่มให้ ตัดยาวพอเลี้ยวรอบเสาเตียงสองรอบ แถมผ้าพันให้ผืนหนึ่ง บอกว่าเดือนนี้ขายเชือกเส้นยาวเท่านี้ได้มากกว่าเชือกบ่อ
      effects: { gold: -1, flags: [bought_a_softer_bedpost_rope] }
    - id: pal_stays_over
      label: ให้{pal}มาค้างคืน ผูกเชือกให้
      requires: { cast: [pal] }
      text: |
        {pal}ปูเสื่อนอนขวางประตู ผูกเชือกให้แน่นกว่าที่{name}ผูกเอง แล้วคุยเรื่องอื่นไปเรื่อยจนฝนลง พอคลื่นมา{pal}ก็พูดดังขึ้น เล่าเรื่องเดิมซ้ำจนเสียงคลื่นต้องรอคิว ตอนเช้าสองคนกินข้าวด้วยกัน ข้อเท้าไม่มีรอยแดง
      effects: { people: [{ id: "@pal", closeness: 1 }], flags: [a_friend_tied_the_bedpost_rope] }

# ---------- 8 ทางออก: เรียกกลับ ----------
- id: adult.sky_sea_called_home
  stage: adult
  weight: 150
  once: false
  scene: home
  cast:
    mate: { id: partner, optional: true }
    kid: { kin: [child], min_age: 17, optional: true }
  when:
    age: [16, 130]
    year: [356, 410]
    trait: curse_sea
    not_flags: [kept_hearing_the_waves]
  text: |
    คนขายเชือกเจ้าประจำรู้ว่าใครหายก่อนหมอรู้ เพราะคนที่หายแล้วเลิกซื้อเชือกเส้นยาว ทุกครั้งที่ตัดเชือกเส้นใหม่ให้{name} เขาเล่าเรื่องเดียวกันให้ฟังก่อนรับเงิน ลูกค้าที่เลิกซื้อเชือกไปได้มีสองพวก พวกแรกไม่แตะน้ำฝนเลยสามฤดูฝน ไม่ดื่ม ไม่ล้าง ไม่ยืนตาก ไม่จับผ้าที่ตากฝน ทั้งบ้านซื้อน้ำบ่อกินทั้งสามฤดู พวกที่สองมีคนที่รักตามออกไปในคืนที่เดินออกไปยืนกลางฝน เรียกชื่อจนตื่น ครบสามคืน ห้ามจับ ห้ามดึง ใครดึงกลับมา คืนนั้นไม่นับ

    เขาว่าคืนที่สามยากที่สุด คืนที่สามคลื่นเรียกชื่อแข่งด้วย ใช้เสียงที่คุ้นหูกว่า เล่าจบแล้วเขาม้วนเชือกเส้นใหม่ใส่มือ{name} บอกว่าเผื่อไว้ก่อน
  choices:
    - id: mate_calls
      label: ให้{mate}ตามออกไปเรียกชื่อในคืนที่เดินออกไป ให้ครบสามคืน
      requires: { cast: [mate] }
      text: |
        คืนแรก{mate}เรียกเบาเกินไป กลัวเพื่อนบ้านได้ยิน คืนที่สองเรียกดังจนหมาทั้งซอยเห่า {name}ตื่นขึ้นกลางฝน เห็น{mate}ยืนกำมือไว้ข้างตัว ไม่ได้แตะ คืนที่สาม คลื่นเรียกชื่อ{name}ด้วยเสียงแม่ ยาวกว่า นุ่มกว่า {mate}ไม่เลิก เรียกด้วยชื่อเล่นที่ไม่มีใครใช้มานานแล้ว ชื่อที่{mate}ใช้เรียกตอนเพิ่งรู้จักกัน

        {name}ตื่นขึ้นมากลางลาน ฝนยังตก แต่บนหลังคามีแต่เสียงฝน {mate}ไข้ขึ้นไปทั้งสัปดาห์ ค่าหมอกับค่ายาออกจากเงินเก็บของบ้าน ฝนครั้งต่อมา{name}นอนหลับโดยไม่มีเชือก ตอนเช้าลองก้มหน้าลงกะละมัง นับไม่ถึงสามสิบก็ต้องเงยหน้าขึ้นมาหอบ
      effects: { lose_traits: [curse_sea], marks: { star: -1 }, gold: -1, people: [{ id: "@mate", closeness: 1 }], flags: [called_home_by_a_spouse] }
    - id: kid_calls
      label: ส่งข่าวให้{kid}กลับมาค้างที่บ้าน ตามออกไปเรียกชื่อให้ครบสามคืน
      requires: { cast: [kid] }
      text: |
        {kid}ทิ้งงานมานอนบ้านทั้งเดือน รอฝน ฝนมาสามครั้ง ครั้งแรก{kid}เผลอเอื้อมมือไปดึงแขน คืนนั้นไม่นับ ครั้งที่สองกับครั้งที่สาม{kid}ยืนกอดอกไว้แน่น กันมือตัวเองไม่ให้ดึง เรียกเสียงแหบ คืนสุดท้ายคลื่นเรียกแข่งด้วยเสียงของ{kid}เองตอนยังเล็ก {kid}เรียกต่อด้วยเสียงตอนนี้ เสียงที่โตแล้ว

        {name}ตื่นมาเห็นหน้า{kid}เปียกโชกอยู่ตรงหน้า ค่าแรงที่{kid}ขาดไปทั้งเดือน{name}จ่ายคืนให้ครบ ฝนครั้งต่อมาบนหลังคามีแต่เสียงฝน
      effects: { lose_traits: [curse_sea], marks: { star: -1 }, gold: -2, people: [{ id: "@kid", closeness: 1 }], flags: [called_home_by_a_grown_child] }
    - id: three_dry_seasons
      label: ไม่แตะน้ำฝนเลยสามฤดูฝน ซื้อน้ำบ่อกินแทนทั้งหมด
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ฤดูแรกง่ายกว่าที่คิด ฤดูที่สองบ่าวสาวบ้านตรงข้ามจัดงานกลางลานแล้วฝนลง {name}วิ่งหลบเข้าชายคาคนเดียวทั้งงาน ฤดูที่สามมือหยิบผ้าที่ตากค้างฝนไว้ครึ่งทางแล้วต้องปล่อย ค่าน้ำบ่อกินเงินเก็บไปเรื่อยๆ จนก้นถุง

          ฝนแรกของฤดูที่สี่ {name}เปิดหน้าต่างฟัง บนหลังคามีแต่เสียงฝน ทั้งคืน ลองก้มหน้าลงกะละมังตอนเช้า ไม่ถึงครึ่งร้อยก็ต้องเงยขึ้นมาหอบ ตกสาย{name}เดินผ่านร้านเชือกไปโดยไม่แวะ คนขายเชือกยกมือโบกให้จากหลังกองเชือก
        effects: { lose_traits: [curse_sea], marks: { star: -1 }, gold: -3, flags: [kept_dry_three_rainy_seasons] }
      failure:
        text: |
          ฤดูที่สองบ่ายวันหนึ่งร้อนจนพื้นลานร้าว ฝนลงมาห่าเดียว {name}ยืนอยู่กลางลานก่อนจะทันคิด แหงนหน้า อ้าปาก น้ำฝนเต็มปาก ลมหายใจช้าลงเองจนเกือบไม่ต้องหายใจ

          ค่าน้ำบ่อที่จ่ายมาหายไปกับฝนห่าเดียว คืนนั้นเชือกเสาเตียงกลับมาผูกที่ข้อเท้าเหมือนเดิม
        effects: { gold: -3, flags: [broke_the_three_dry_seasons] }
    - id: keep_the_waves
      label: รับเชือกเส้นใหม่ แล้วกลับไปผูกต่อ
      text: |
        {name}เดินกลับบ้านช้าๆ ฟ้าครึ้มมาทางตะวันตก คืนนั้นผูกเชือกสองรอบ นอนหงาย รอฟังเสียงที่จะมากับฝน รู้ดีว่ารอฟังอยู่
      effects: { flags: [kept_hearing_the_waves] }
