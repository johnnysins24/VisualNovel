# วัยรุ่น 12–13 ลูกตระกูลคนแคระในทุนดาร์ (origin_dwarf_clan)
# ทางประจำถิ่นคือนักบวชออสซา เปิดเสมอในพิธีสาบานต่อทั่ง เหตุการณ์ในไฟล์นี้จึงไม่ให้ lean_cleric
# ยกเว้นตัวเลือกที่ต้องมี promised_elder_debt ซึ่งตอบตามคำสุดท้ายของทวด

- id: youth.dwarf_old_anvil
  stage: youth
  scene: smithy
  weight: 10
  when:
    age: [12, 13]
    year: [301, 313]
    flags: [origin_dwarf_clan, clan_debt_hammer]
  text: |
    ทวดเคยบอกว่าตระกูลทั่งเก่ามาถามทุกร้อยปี แต่หลังสงครามถ่าน ไม่มีตระกูลไหนในทุนดาร์รอครบร้อยปีอีกแล้ว หนี้ก้อนใหม่บนกำแพงสภาใหญ่เกินกว่าใครจะจ่ายไหว ทุกตระกูลจึงไล่ทวงหนี้เก่าที่ตัวเองเคยให้ยืม เผื่อจะได้อะไรคืนมาบ้าง

    คนของทั่งเก่ามาถึงตอนเช้า เป็นหญิงคนแคระผมเทา คอแขวนจี้รูปทั่งเหล็กขนาดเท่าหัวแม่มือ ถือแผ่นหินบางๆ มาแผ่นหนึ่ง บนนั้นสลักบรรทัดเดียวกับที่อยู่บนกำแพงห้องโถงของบ้านนี้ทุกตัวอักษร

    คราวนี้คนที่ตอบไม่ใช่ทวด {father}ยืนขึ้นตอบเธอตามธรรมเนียม "ค้อนยังอยู่ข้างล่าง" แล้วก็หยุด ครึ่งหลังของประโยคที่ทวดเคยพูด เขานึกไม่ขึ้น เธอรอจนเห็นว่าเขาจะไม่พูดต่อ แล้วหันมาทาง{name}

    "ข้าไม่ได้มาฟังคำตอบเดิม" เธอว่า "ข้ามาดูหน้าคนที่จะตอบครั้งหน้า"
  choices:
    - id: vow
      label: บอกเธอว่าสักวันจะลงไปเอาค้อนคืนมาเอง
      text: |
        {father}หันขวับมา แต่ไม่ทันห้าม หญิงคนนั้นวางแผ่นหินลงบนโต๊ะ หยิบสิ่วเล็กออกจากกระเป๋าเสื้อ

        "คนแคระพูดแล้วต้องสลัก" เธอว่า แล้วเดินไปที่กำแพงห้องโถง สลักบรรทัดใหม่ไว้ใต้บรรทัดหนี้ ตัวเล็กกว่ากันครึ่งหนึ่ง เป็นชื่อ{name} กับคำว่า จะไปเอาคืน

        เย็นนั้น{father}นั่งอยู่หน้ากำแพงจนดึก ไม่ได้ลบ คนแคระไม่ลบคำสาบานใคร ต่อให้เป็นคำของลูกตัวเองที่พูดตอนอายุเท่านี้
      effects: { stats: { STR: 1 }, reputation: { dwarf_council: 1 }, flags: [lean_warrior, vowed_old_hammer] }
    - id: ask_behind
      label: ถามเธอว่าบันทึกของทั่งเก่าเขียนไว้ไหมว่าค้อนเอาไปใช้ทำอะไร
      check: { stat: INT, dc: 12 }
      success:
        text: |
          เธอเลิกคิ้ว แล้วพลิกแผ่นหินให้ดูด้านหลัง ด้านนั้นไม่มีบนกำแพงบ้าน{name} เป็นอักษรคนแคระแบบเก่าสองบรรทัด ตัวเหลี่ยมกว่าที่ครูสอน

          {name}อ่านออกเกือบหมด "ยืมไปตอกลิ่ม คืนเมื่อลิ่มสุดท้ายลงที่" ใต้สองบรรทัดนั้นมีอักษรอีกสามตัว ไม่เหมือนอักษรไหนที่{name}เคยเห็น

          "อักษรสามตัวนั้นมีอยู่อีกที่เดียวในทุนดาร์" เธอว่า "บนกำแพงที่ก่อปิดตายตอนสงครามจอมมาร เจ้าเป็นคนแรกในบ้านนี้ที่ถาม ทวดของเจ้าตอบมาสองครั้ง ไม่เคยถามสักครั้ง"
        effects: { stats: { INT: 1 }, flags: [lean_wizard, read_old_anvil_tablet] }
      failure:
        text: |
          เธอส่ายหน้า บอกว่าบันทึกของตระกูลเป็นของตระกูล ไม่ใช่ของลูกหนี้ แล้วเก็บแผ่นหินใส่ห่อผ้า

          แต่ตอนเธอห่อ {name}เห็นด้านหลังแผ่นหินแวบหนึ่ง มีอักษรสามตัวที่ไม่ใช่อักษรคนแคระ ไม่เหมือนอักษรไหนที่{name}เคยเห็น
        effects: { stats: { WIS: 1 }, flags: [lean_wizard] }
    - id: lie_dead_end
      label: บอกเธอว่าไม่มีใครในบ้านนี้รู้แล้วว่าค้อนอยู่ชั้นไหน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}พูดหน้าตาย ว่าทวดไม่เคยบอกใครว่าค้อนอยู่ชั้นไหน ว่าแผนที่เหมืองเก่าไฟไหม้ไปตั้งแต่สงคราม ว่าต่อให้ลงไปก็หาไม่เจอ

          หญิงคนนั้นฟังจนจบ แล้วหัวเราะเบาๆ เหมือนเพิ่งได้ยินเรื่องตลกที่ไม่ค่อยตลก "ดี" เธอว่า "งั้นครั้งหน้าข้าจะไม่ต้องมา" แล้วเธอก็กลับไปจริงๆ

          {father}ไม่ได้ตีลูก แต่สามวันหลังจากนั้นเขาไม่ยอมกินข้าวโต๊ะเดียวกับ{name}
        effects: { stats: { CHA: 1 }, reputation: { dwarf_council: -1 }, flags: [lean_rogue, lied_to_old_anvil] }
      failure:
        text: |
          {name}ยังพูดไม่ทันจบประโยค {father}ก็ลุกขึ้นยืน ขอโทษหญิงคนนั้นแทนลูก ขอโทษสามครั้งตามธรรมเนียมของคนที่พูดเท็จเรื่องหนี้

          หญิงคนนั้นรับคำขอโทษ แล้วมอง{name}ด้วยสายตาแบบที่คนแคระใช้มองหินก้อนที่ยังไม่รู้ว่าจะแตกตรงไหน "ไม่เป็นไร" เธอว่า "ครั้งหน้าข้าจะมาถามเจ้าเอง"
        effects: { stats: { WIS: 1 } }
    - id: recite_elder
      label: ทวนคำสุดท้ายของทวดให้เธอฟังทุกคำ
      requires: { flag: promised_elder_debt }
      text: |
        "ตระกูลนี้ยังไม่ลืม"

        {name}พูดต่อจากที่{father}ค้างไว้ ช้าเท่าที่ทวดพูด หยุดหายใจตรงที่ทวดหยุด {father}ไม่รู้มาก่อนว่าลูกจำได้ทุกคำ หญิงคนนั้นแตะแผ่นหิน แล้วแตะหน้าผากตัวเอง

        "ข้าได้ยินประโยคนี้จากปากทวดของเจ้าตอนข้ายังเด็ก" เธอว่า "ไม่คิดว่าจะได้ยินครบอีก" เธอกลับไปโดยไม่ทวงอะไร
      effects: { stats: { WIS: 1 }, reputation: { dwarf_council: 1 }, flags: [lean_cleric, answered_old_anvil] }

- id: youth.dwarf_snow_pass
  stage: youth
  weight: 10
  when:
    age: [12, 13]
    flags: [origin_dwarf_clan]
  text: |
    พายุหิมะลงมาตอนบ่ายวันตลาด เร็วกว่าที่ใครคาด หิมะทับรางรถไฟไต่เขาจนรถขบวนสุดท้ายลงไม่ได้ พ่อค้าผ้าจากอาร์เวลที่ขึ้นมาขายของทุกต้นเดือนไม่อยากรอ เขาพาลูกชายเดินลงทางเกวียน บอกว่าลงก่อนมืดทัน

    ลูกชายของเขาอายุพอๆ กับ{name} ขึ้นมากับพ่อทุกเดือน ชอบมานั่งห้อยขาบนขอบถนนวน ถามคนแคระทุกคนที่เดินผ่านว่าทำไมชอบขุดลึก ตอนนี้ตัวสูงกว่า{name}เกือบหัวหนึ่ง

    พลบค่ำ ม้าของพ่อค้าเดินกลับขึ้นมาตัวเดียว อานยังอยู่บนหลัง ผู้ใหญ่ที่สถานีรถไฟบอกว่าต้องรอหิมะหยุดก่อนถึงจะลงไปหาได้ {name}รู้ว่าทางเกวียนช่วงโค้งที่สามเป็นหน้าผา และรู้ว่าตอนหิมะลง มองไม่ออกว่าขอบอยู่ตรงไหน
  choices:
    - id: goat_path
      label: ลงไปหาเองทางแพะที่ลุงเคยพาเดิน
      check: { stat: WIS, dc: 12 }
      success:
        text: |
          ทางแพะเลาะผนังเขา แคบจนต้องเอาหลังแนบหิน แต่หิมะเกาะไม่ติด {name}เดินไปตามรอยที่ลุงเคยชี้ หินก้อนที่มีตะไคร่ หินก้อนที่ลมพัดจนเรียบ แล้วก็เจอสองพ่อลูกนั่งกอดกันอยู่ใต้ชะง่อนหินเหนือโค้งที่สาม ห่างขอบผาไม่ถึงสามก้าว

          {name}พาทั้งสองคนขึ้นทางเดิม ขึ้นถึงสถานีก่อนรุ่ง พ่อค้าทิ้งผ้าไว้ให้ทั้งพับ ลูกชายของเขาเลิกถามเรื่องขุดลึก เดือนต่อๆ มาที่ขึ้นมากับพ่อ เขาแค่มานั่งห้อยขาข้าง{name}บนขอบถนนวน
        effects: { stats: { WIS: 1, DEX: 1 }, alignment: { moral: 1 }, flags: [lean_ranger, saved_cloth_merchant] }
      failure:
        text: |
          ครึ่งทาง{name}เหยียบหินก้อนที่หิมะปิดไว้ หินพลิก ขาข้างหนึ่งห้อยลงไปในความมืด มือคว้ารากไม้ไว้ได้ทัน ต้องนั่งรอจนตัวหายสั่นถึงคลานกลับขึ้นมาได้

          คนจากสถานีลงไปเจอสองพ่อลูกตอนเช้า ทั้งสองคนยังรอด ลูกชายพ่อค้านิ้วเท้าดำไปสองนิ้ว ลุงมาถึงทีหลัง เห็นรอยถลอกบนขา{name}แล้วถามว่าเหยียบหินก้อนไหน พอรู้ก็บอกว่าก้อนนั้นไม่เคยมั่นคงตั้งแต่ลุงยังเด็ก แล้วพาลงไปเดินใหม่อีกรอบตอนหิมะละลาย
        effects: { stats: { WIS: 1 }, hp: -1, flags: [lean_ranger] }
    - id: ride_tram
      label: ปลดเบรกรถรางขนแร่ ไถลลงรางไปตามคนที่สถานีล่าง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ตู้แร่เปล่าวิ่งลงรางเร็วขึ้นทุกช่วงราง ล้อเหล็กกรีดรางจนประกายไฟแตกเป็นสาย ลมหิมะตีหน้าจนลืมตาไม่ขึ้น {name}เหยียบเบรกทีละนิดตามเสียงล้อ ไม่ได้ดูราง ไปถึงสถานีล่างตอนคนเฝ้ายามกำลังดับตะเกียง

          คนงานสถานีล่างขึ้นไปเจอสองพ่อลูกตอนเที่ยงคืน ส่วน{name}โดนนายสถานีหักค่าตู้แร่ที่ล้อสึก ลงสมุดเป็นหนี้ตระกูล {father}จ่ายหนี้ก้อนนั้นเองทั้งก้อน แล้วถามว่าเบรกตอนเลี้ยวโค้งใหญ่ใช้กี่ส่วนของแรงเท้า
        effects: { stats: { DEX: 1 }, flags: [lean_rogue, rode_ore_tram] }
      failure:
        text: |
          ตู้แร่ตกรางตรงโค้งใหญ่ ไถลไปกับหิมะจนชนกองหินหยุด {name}กระเด็นลงไปในกองหิมะ ไหล่ช้ำ ฟันบิ่นไปซี่หนึ่ง ต้องเดินลงที่เหลือเอง

          ไปถึงสถานีล่างตอนเช้า พวกจากข้างบนลงมาเจอสองพ่อลูกก่อนแล้ว ทั้งสองคนรอด นายสถานีจดตู้แร่ที่พังลงเป็นหนี้ตระกูล บรรทัดเล็กๆ บนกำแพงห้องโถงจึงเพิ่มขึ้นอีกบรรทัด
        effects: { stats: { CON: 1 }, hp: -2 }
    - id: hut_stories
      label: ลงไปหาจนเจอ แล้วพาเข้ากระท่อมเก็บแร่ ไม่ยอมให้ใครหลับ
      text: |
        {name}เจอสองพ่อลูกตรงหัวโค้งที่สอง ยังไม่ถึงหน้าผา แต่พ่อค้าเริ่มพูดว่าง่วง คนที่พูดว่าง่วงกลางหิมะคือคนที่ใกล้ตาย ทุกคนในทุนดาร์รู้ {name}ลากทั้งสองคนเข้ากระท่อมเก็บแร่ร้างข้างทาง ไม่มีฟืน ไม่มีไฟ

        ทั้งคืน{name}เล่าเรื่องไม่หยุด ชื่อบรรพบุรุษบนกำแพงทีละชื่อ เรื่องค้อนที่ยังไม่ได้คืน เรื่องผีที่หาชื่อตัวเองไม่เจอ แล้วก็เล่าเรื่องที่คนแคระไม่เล่าต่อหน้าคนนอก ลูกชายพ่อค้าฟังจนตาค้าง ถามซ้ำทุกตอน ไม่มีใครหลับจนฟ้าสาง

        เช้านั้นคนจากสถานีมาถึง พ่อค้าเล่าให้ทุกคนฟังว่าเด็กคนแคระเล่านิทานเก่งที่สุดที่เคยได้ยิน เขาไม่ได้เล่าว่านิทานเรื่องไหน
      effects: { stats: { CHA: 1, CON: 1 }, flags: [lean_bard, told_outsider] }
