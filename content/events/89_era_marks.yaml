# ชุด 5 ยุคดาวเร่ง: มาตรสองอันเมื่อลึก ฉากถูกเรียก และฉากตายของคนที่เดินตามเสียงไป
# ฉากถูกเรียก (adult.star_called, adult.brand_called) เป็น must กับ once: false: ระบบตั้ง flag star_called / brand_called เมื่อมาตรโดนดันเกินขั้นสาม
#   ทุกทางออกล้าง flag นั้นหรือจบชีวิต (die: taken) ทางที่ไม่ไปลดมาตรลงหนึ่งขั้นและเสียของในตัวไปถาวร มาตรที่ลึกกลับขึ้นไปใหม่ทำให้ถูกเรียกได้อีก
# ฉากตายของ taken เล่าความตายไปแล้วเสมอ (told: true) ฉากจึงย้อนไปชั่วอึดใจสุดท้าย ฉบับฟ้ากับฉบับตะวันออกอ่าน flag ของทางที่เลือก death.taken คือฉากสำรองที่ออกได้เสมอ
# เรื่องของรอยดาวขั้นสูงไม่ผูกปี รอยดาวมีมาก่อนยุคดาวเร่ง (เงินดาว วงฟังดาว) ข้อความจึงไม่เอ่ยของที่มีเฉพาะยุค
# ตราของทีฟลิ่งไม่เย็นต่ำกว่าที่เกิดมา ข้อความของทางที่ตราเย็นลงจึงพูดแค่ว่าเย็นลงหนึ่งขั้น ไม่พูดว่าหาย

# ---------- รอยดาวขั้นสูง ----------
- id: adult.star_mark_unasked_answer
  stage: adult
  weight: 20
  scene: home
  when:
    age: [16, 130]
    marks: { star: [1, 2] }
  text: |
    มีกระดาษพับสอดอยู่ใต้ประตูตอนเช้า หนา หมึกน้ำเงิน ไม่มีชื่อคนส่ง ด้านนอกเขียนไว้บรรทัดเดียว ลายมือเอนซ้าย คำตอบของคำถามที่{name}ยังไม่ได้ถาม

    {name}ยังไม่ได้ถามอะไรใครจริงๆ แต่พอเห็นบรรทัดนั้นก็รู้ทันทีว่าคำถามคืออะไร เป็นเรื่องที่คิดอยู่คนเดียวมาหลายเดือน ไม่เคยพูดให้ใครฟัง

    รอยที่หลังใบหูอุ่นขึ้นตอนมือแตะกระดาษ
  choices:
    - id: open_it
      label: เปิดอ่าน (ของแบบนี้ติดตัวไปนาน)
      text: |
        ข้างในยาวสี่บรรทัด ถูกทุกคำ ใช้ได้จริง {name}ทำตามเสร็จก่อนเที่ยง เรื่องที่คิดวนอยู่หลายเดือนจบลงในเช้าเดียว จบแบบที่ไม่ต้องกลับไปคิดอีก

        ตกค่ำ{name}ถอดเสื้อแล้วเห็นว่ารอยมีมากกว่าเมื่อเช้า จุดใหม่เรียงกันเป็นแถวสั้นๆ สี่แถว ยาวเท่ากับสี่บรรทัดบนกระดาษ
      effects: { marks: { star: 1 }, world: { star: 1 }, flags: [read_the_unasked_answer] }
    - id: burn_it_folded
      label: เอาไปเผาที่วิหารทั้งที่ยังพับอยู่
      text: |
        กระดาษติดไฟยาก เปลวที่ขึ้นเป็นสีน้ำเงิน นักบวชที่กำลังเติมน้ำมันตะเกียงอยู่ใกล้ๆ หันมาดูสี แล้วหันกลับไปเติมต่อ ไม่ถามว่าเผาอะไร ก่อนกลับ{name}หยอดเหรียญลงตู้หนึ่งเหรียญ ค่าที่ใช้ไฟ

        เรื่องที่คิดอยู่คนเดียวยังอยู่กับ{name}ต่อไปอีกหลายเดือน และจบลงเองช้าๆ แบบที่เรื่องของคนทั่วไปจบ
      effects: { world: { gods: 1 }, flags: [burned_the_unasked_answer] }
    - id: jar_it
      label: เก็บใส่ไหปิดฝา ไม่เปิด
      text: |
        {name}ใส่กระดาษลงไหเกลือเปล่า ปิดฝา เอาขี้ผึ้งหยอดรอบขอบ แล้ววางไว้บนชั้นสูงสุดของครัว หลังไหน้ำมันหมู ทุกครั้งที่เรื่องนั้นวนกลับมาในหัว ตาจะเหลือบขึ้นไปบนชั้นเอง

        ผ่านไปหลายสัปดาห์ {name}คิดเรื่องนั้นออกด้วยตัวเอง ได้คำตอบที่ไม่ดีนัก แต่เป็นของตัวเอง ไหใบนั้นยังไม่ได้เปิด ขี้ผึ้งที่ขอบฝายังไม่ร้าว
      effects: { stats: { WIS: 1 }, flags: [kept_the_unasked_answer] }

- id: adult.star_mark_sleeve
  stage: adult
  weight: 26
  scene: market
  when:
    age: [16, 130]
    marks: { star: [2, 3] }
  text: |
    รอยของ{name}ลามพ้นข้อศอกมาแล้ว เสื้อแขนยาวยังปิดได้ ถ้าไม่ยกมือสูง ถ้าไม่มีใครจับแขน

    วันหนึ่งที่โต๊ะคิดเงินของตลาด {name}เอื้อมไปหยิบของ แขนเสื้อเลื่อน ชายที่ยืนอยู่อีกฝั่งโต๊ะเห็น เขาไม่ได้ถอย เลื่อนสมุดบัญชีทั้งเล่มมาตรงหน้า{name} ชี้หน้าที่มีตัวเลขสามแถว แล้วถามว่าแถวไหนผิด

    {name}ตอบได้ก่อนจะอ่านจบ เขาปิดสมุด บอกว่าคนแบบนี้เขาจ้างเป็นรายสัปดาห์ และถ้าวันไหนไม่อยากมีรอยแล้ว ช่างเงินดาวของหอนับดาวลงมารับงานแถวนี้ปีละหน ดึงออกได้ทีละจุด เจ็บ กับแพง
  choices:
    - id: read_his_ledgers
      label: รับงานอ่านบัญชีรายสัปดาห์
      text: |
        งานคือนั่งในห้องหลังร้านสัปดาห์ละเช้า เปิดสมุดที่เขาส่งให้ แล้วบอกว่าหน้าไหนมีคนโกง {name}ไม่ต้องบวกเลข มองทั้งหน้าแล้วตัวเลขที่ผิดจะเด่นขึ้นมาเองเหมือนคราบบนผ้าขาว เขาจ่ายตรงเวลา และไม่เคยให้ใครเข้ามาในห้องตอน{name}ถลกแขนเสื้อ

        คนที่โดนจับได้จากสมุดพวกนั้นมีเจ็ดคนในปีแรก {name}ไม่เคยเห็นหน้าสักคน เห็นแต่ลายมือ และจำลายมือได้ทุกคน
      effects: { gold: 4, flags: [read_ledgers_by_the_mark] }
    - id: have_them_drawn
      label: ไปหาช่างเงินดาว ให้ดึงออก (ทั้งเจ็บและแพง)
      requires: { min_gold: 4 }
      text: |
        ช่างเป็นเอลฟ์ มือนิ่ง ใช้แหนบเงินดาวปลายเรียวกับจานกระเบื้องขาว ดึงทีละจุดจากปลายรอยย้อนขึ้นไป จุดที่หลุดออกมาเล็กเท่าเม็ดเกลือ ตกลงจานแล้วมีเสียงกังวาน {name}กัดผ้าจนกรามค้าง ช่างนับให้ฟังทุกจุด ไม่ได้นับเพื่อปลอบ นับเพื่อคิดเงิน

        รอยถอยขึ้นไปหนึ่งขั้น ผิวตรงที่ดึงเป็นรูเล็กๆ เรียงกันอยู่หลายวันกว่าจะปิด ตอนกลับบ้าน{name}คิดเงินค่าเกวียนช้ากว่าขามา และรู้ตัวว่าช้า
      effects: { gold: -4, hp: -1, marks: { star: -1 }, flags: [had_star_marks_drawn] }
    - id: say_it_was_a_guess
      label: ดึงแขนเสื้อลง แล้วบอกว่าเดาเอา
      check: { stat: CHA, dc: 12 }
      success:
        text: |
          {name}หัวเราะ บอกว่าสามแถวเดาถูกหนึ่งไม่ใช่เรื่องยาก แล้วชี้แถวที่ผิดให้ดูอีกทีว่าผิดเพราะหมึกสีไม่เหมือนกัน ชายคนนั้นก้มดูหมึก หมึกสีไม่เหมือนกันจริง เขาเก็บสมุด บ่นเรื่องเสมียนของตัวเอง แล้วลืมเรื่องแขน

          คืนนั้น{name}เย็บกระดุมเพิ่มที่ปลายแขนเสื้อทุกตัวอีกข้างละเม็ด
        effects: { stats: { CHA: 1 }, flags: [hid_the_star_marks] }
      failure:
        text: |
          {name}บอกว่าเดา ชายคนนั้นยิ้ม เลื่อนสมุดอีกเล่มมาให้ เปิดหน้าที่มีตัวเลขสิบสองแถว {name}ไม่ได้ตอบ แต่ตาไปหยุดที่แถวที่เจ็ดก่อนจะห้ามทัน เขาเห็น

          เขาไม่ได้เอาเรื่องไปบอกใคร แค่แวะมาทุกสัปดาห์พร้อมสมุดหนึ่งเล่มกับคำว่าช่วยดูหน่อย และไม่เคยพูดถึงค่าจ้างอีก
        effects: { gold: -1, flags: [hid_the_star_marks] }

- id: adult.star_mark_night_hand
  stage: adult
  weight: 30
  scene: home
  when:
    age: [16, 130]
    marks: { star: [3, 3] }
  text: |
    เช้าวันหนึ่ง{name}ตื่นมาเจอนิ้วเปื้อนหมึก บนโต๊ะข้างเตียงมีกระดาษสามแผ่นที่เมื่อคืนยังเปล่า ตอนนี้เต็มทั้งสองหน้า ลายมือเป็นของ{name}เอง แต่เอนไปทางซ้ายทุกตัว

    เป็นคำตอบ ไม่มีคำถามกำกับ แผ่นแรกเป็นตัวเลขกับชื่อถนน แผ่นที่สองเป็นวิธีทำอะไรบางอย่างสิบสองขั้น แผ่นที่สามมีประโยคเดียวเขียนซ้ำจนเต็มหน้า {name}ยังไม่ได้อ่านประโยคนั้นจนจบ

    คืนต่อมามีอีกสองแผ่น รอยที่แขนสว่างพอให้เขียนได้โดยไม่ต้องจุดตะเกียง
  choices:
    - id: read_every_page
      label: อ่านทุกแผ่น (อีกขั้นเดียวคือฟ้าเรียกตัว)
      text: |
        ตัวเลขกับชื่อถนนคือที่อยู่ของคนที่{name}ไม่รู้จัก พร้อมจำนวนเงินที่เขาซ่อนไว้ใต้พื้นเรือน วิธีสิบสองขั้นคือวิธีเปิดกลอนชนิดหนึ่งโดยไม่ทิ้งรอย ทุกอย่างถูก ทุกอย่างใช้ได้ และไม่มีอย่างไหนที่{name}เคยอยากรู้

        ประโยคที่เขียนซ้ำจนเต็มแผ่นที่สามคือชื่อของ{name}เอง เขียนแบบที่คนใช้เรียกให้มาหา
      effects: { marks: { star: 1 }, world: { star: 1 }, stats: { INT: 1 }, flags: [read_the_night_pages] }
    - id: burn_them_unread
      label: เผาทุกเช้าโดยไม่อ่าน
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ตั้งกระทะเหล็กไว้ข้างเตียง ตื่นมาก็คว่ำกระดาษลงกระทะทั้งที่ตายังไม่เปิดเต็ม จุดไฟ แล้วค่อยลุกไปล้างหน้า ทำอย่างนี้ทุกเช้าจนกลายเป็นงานบ้านอย่างหนึ่ง อยู่ระหว่างพับผ้าห่มกับตักน้ำ

          กระดาษในบ้านหมดเร็วกว่าฟืน มือที่เขียนเริ่มเขียนบนผ้าปูที่นอนแทน {name}ซักผ้าปูที่นอนทุกวันโดยไม่กางดู
        effects: { stats: { WIS: 1 }, flags: [burned_the_night_pages] }
      failure:
        text: |
          เช้าวันที่สี่ ไฟติดช้า บรรทัดบนสุดของแผ่นบนสุดหงายอยู่นานพอให้ตาอ่านไปเองก่อนที่{name}จะหลับตาทัน เป็นวันที่กับชื่อคนที่{name}รู้จัก

          {name}เผาที่เหลือจนหมด แล้วนอนไม่หลับไปเจ็ดคืน ไม่ได้เล่าให้เจ้าของชื่อฟัง และทุกครั้งที่เจอหน้ากันก็ต้องนับวัน
        effects: { hp: -1, flags: [burned_the_night_pages] }
    - id: sell_the_pages
      label: ขายให้คนของผู้ฟังดาว
      text: |
        คนที่มารับเป็นหญิงพูดเบา ใส่กระดาษลงซองหนังโดยไม่อ่านต่อหน้า{name}สักแผ่น จ่ายตามจำนวนแผ่น ไม่ต่อราคา แล้วบอกว่าจะมาทุกวันอัสเทล ถ้าคืนไหนเขียนได้มากเป็นพิเศษ ให้แขวนผ้าขาวไว้ที่หน้าต่าง

        {name}ไม่เคยรู้ว่ากระดาษพวกนั้นไปตอบคำถามของใคร รู้แต่ว่าเดือนหนึ่งมีคนแปลกหน้าสามคนเดินผ่านหน้าบ้านแล้วค้อมหัวให้ แบบที่คนค้อมให้บ่อน้ำ
      effects: { gold: 5, world: { star: 1 }, reputation: { star_listeners: 1 }, flags: [sold_the_night_pages] }
    - id: tie_the_hand
      label: มัดมือข้างที่เขียนไว้กับขอบเตียงก่อนนอน
      text: |
        สามคืนแรกได้ผล เช้าขึ้นมากระดาษยังเปล่า ข้อมือมีรอยเชือกแดงเป็นวง {name}นอนหลับยาวที่สุดในรอบหลายเดือน

        คืนที่สี่ มืออีกข้างเริ่มเขียน ลายมือแย่กว่ามาก โย้ สั่น ตัวโตเท่าลายมือเด็กหัดเขียน แต่เอนซ้ายเหมือนกันทุกตัว
      effects: { flags: [tied_the_writing_hand] }

- id: adult.star_mark_roofed_year
  stage: adult
  weight: 12
  once: false
  scene: home
  when:
    age: [16, 130]
    marks: { star: [1, 3] }
  text: |
    คนที่มีรอยบอกต่อกันมาว่าทางลงมีอยู่ทางหนึ่งที่ไม่ต้องจ่ายใคร ทิ้งเงินดาวทุกชิ้นที่มี แล้วนอนใต้หลังคาทุกคืนให้ครบปี ห้ามออกไปยืนใต้ฟ้าหลังตะวันตกแม้แต่คืนเดียว พลาดคืนไหนให้นับใหม่

    ฟังดูง่ายจนกว่าจะลองทำ งานศพจัดกลางคืน งานแต่งเลิกดึก เล้าไก่อยู่นอกบ้าน และมีคืนที่ฟ้าโปร่งจนรอยใต้ผิวคันเหมือนมีคนสะกิด
  choices:
    - id: keep_the_year
      label: ลองนับหนึ่งปีใต้หลังคา
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ขีดกรอบประตูด้านในคืนละขีด ย้ายเล้าไก่มาไว้ใต้ชายคา ไปงานศพแค่ช่วงบ่าย ออกจากงานแต่งก่อนเจ้าบ่าวจะเมา คืนฟ้าโปร่งก็เอาผ้าห่มคลุมหัวแล้วท่องราคาของในตลาดจนหลับ

          ขีดสุดท้ายลงที่กรอบประตูในเช้าที่อากาศเหมือนเช้าแรก รอยถอยขึ้นไปหนึ่งขั้น ตรงที่เคยมีเหลือแต่ผิวซีดกว่าที่อื่นนิดหนึ่ง แบบรอยแหวนที่เพิ่งถอด
        effects: { marks: { star: -1 }, flags: [kept_a_roofed_year] }
      failure:
        text: |
          คืนหนึ่งกลางหน้าร้อน {name}รู้สึกตัวตอนยืนอยู่กลางลานแล้ว เท้าเปล่า หน้าแหงน จำไม่ได้ว่าเปิดประตูตอนไหน กลอนยังอยู่ในมือ

          ขีดที่กรอบประตูมีอยู่ร้อยกว่าขีด {name}เอามีดขูดออกทั้งหมดในเช้าวันนั้น แล้วยังไม่ได้เริ่มขีดใหม่
        effects: { hp: -1, flags: [broke_a_roofed_year] }
    - id: pay_for_the_bolt
      label: จ้างเด็กข้างบ้านลงกลอนจากข้างนอกทุกค่ำ
      requires: { min_gold: 3 }
      text: |
        เด็กมาทุกค่ำก่อนตะวันตก ลงกลอนนอก เคาะประตูสองทีให้รู้ว่าลงแล้ว รุ่งเช้ามาเปิด เคาะสองทีอีก ค่าจ้างคิดเป็นรายเดือน เด็กไม่เคยขาดสักคืน คืนที่ป่วยก็ส่งน้องมา

        มีสามคืนในปีนั้นที่{name}ตื่นมายืนดันประตูอยู่ ดันจนไหล่ช้ำ กลอนไม่ขยับ ครบปีรอยถอยขึ้นไปหนึ่งขั้น เด็กมาเปิดประตูเช้าวันสุดท้ายแล้วถามว่าปีหน้าจ้างต่อไหม
      effects: { gold: -3, marks: { star: -1 }, flags: [kept_a_roofed_year] }
    - id: keep_the_marks
      label: ไม่ลอง รอยให้มามากกว่าที่เอาไป
      text: |
        {name}ฟังจนจบ แล้วไปงานแต่งคืนนั้นจนเลิก เดินกลับบ้านใต้ฟ้าเปิด คิดเงินค่าของขวัญ ค่าเหล้า ค่าเกวียนของคนทั้งงานในหัวได้ก่อนถึงประตู

        รอยคันขึ้นมานิดหนึ่งตอนก้าวเข้าชายคา เหมือนมีคนส่งถึงบ้านแล้วโบกมือ
      effects: { flags: [kept_the_star_marks] }

# ---------- ฟ้าเรียกตัว ----------
- id: adult.star_called
  stage: adult
  weight: 400
  must: true
  once: false
  scene: home
  cast:
    near: { kin: [spouse, child, sibling_older, sibling_younger], min_age: 14, optional: true }
  when:
    age: [16, 150]
    flags: [star_called]
  text: |
    {name}ตื่นกลางดึกเพราะมีคนเรียกชื่อ เรียกครั้งเดียว ชัด ไม่ดัง เสียงที่เรียกเป็นเสียงของ{name}เอง และมาจากข้างบน

    รอยใต้ผิวสว่างกว่าทุกคืน พอให้เห็นขื่อ เห็นผนัง เห็นมือตัวเองที่กำลังเลิกผ้าห่มออกโดยไม่ได้สั่ง เท้าแตะพื้นแล้ว พื้นเย็น ประตูอยู่ห่างออกไปหกก้าว

    เสียงนั้นไม่ได้เรียกซ้ำ ไม่จำเป็นต้องเรียก {name}รู้ว่าข้างนอกฟ้าเปิด และรู้ว่าถ้าเดินออกไป จะไม่มีอะไรต้องถามอีกเลย
  choices:
    - id: walk_out
      label: เดินออกไปตามเสียง (ชีวิตนี้จบที่นี่)
      text: |
        {name}หยิบรองเท้าที่ข้างเตียงไปวางไว้ที่ธรณีประตู วางคู่กัน หัวรองเท้าหันเข้าบ้าน แล้วเดินเท้าเปล่าออกไปกลางลาน น้ำค้างลงแรงกว่าทุกคืน ไม่มีเสียงหมาเห่า ไม่มีใครตื่น

        เช้าขึ้นมาคนที่มาตามหาเจอรองเท้าก่อน แล้วเจอวงน้ำค้างบนพื้นลาน กลมเท่าที่คนคนหนึ่งยืนได้ ในวงมีแผ่นแก้วบางรูปคนตั้งอยู่ ยังอุ่น คนที่เอามือแตะบอกว่าอุ่นเท่าตัวคนพอดี พอสายแผ่นแก้วก็ขุ่น แล้วแตกเป็นผงตอนมีคนพยายามยก
      effects: { die: taken, world: { star: 2 }, flags: [answered_the_sky] }
    - id: tie_to_the_bed
      label: มัดข้อมือตัวเองกับเสาเตียง แล้วทนจนสว่าง (เสียของในตัวไปถาวร)
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ใช้เชือกผูกม่าน มัดสามรอบ ผูกเงื่อนที่มือเดียวแก้ไม่ได้ แล้วนั่งหันหลังให้ประตู รอยใต้ผิวร้อนขึ้นจนผ้าปูที่นอนอุ่น แขนข้างที่มัดดึงไปทางประตูเองทั้งคืน เชือกกินเนื้อ {name}ท่องชื่อของในครัวทีละอย่างจนฟ้าสาง

          พอไก่ขัน แสงใต้ผิวหรี่ลง รอยที่ปลายแขนจางหายไปหนึ่งคืบ ผิวตรงนั้นบางจนเห็นเส้นเลือด และไม่กลับมาหนาอีก
        effects: { marks: { star: -1 }, max_hp: -1, clear_flags: [star_called], flags: [refused_the_sky] }
      failure:
        text: |
          เงื่อนหลุดตอนดึกจัด {name}ไปถึงประตูแล้ว มือจับกลอนแล้ว และล้มลงตรงนั้นเพราะขาข้างหนึ่งยังพันเชือกอยู่ หน้าผากฟาดธรณีประตู นอนอยู่อย่างนั้นจนสว่าง ครึ่งตัวอยู่ในบ้าน

          แสงใต้ผิวหรี่ลงตอนไก่ขัน รอยถอยไปหนึ่งคืบ ผิวตรงที่รอยเคยอยู่บางจนเห็นเส้นเลือด แผลที่หน้าผากหายช้า และตั้งแต่นั้น{name}ขึ้นบันไดแล้วต้องหยุดพักกลางทาง
        effects: { marks: { star: -1 }, max_hp: -2, hp: -1, clear_flags: [star_called], flags: [refused_the_sky] }
    - id: give_it_back
      label: ตอบเสียงนั้นว่าเอาของที่ให้มาคืนไป (เสียปัญญาที่ได้มา)
      text: |
        {name}พูดออกไปดังๆ ในห้องมืด ของที่ให้มา เอาคืนไป ไม่มีอะไรตอบ แต่รอยใต้ผิวเย็นวาบจากท้ายทอยลงมาถึงข้อศอก เหมือนมีคนรูดผ้าเปียกผ่าน แล้วก็ไม่มีอะไรอีก

        เช้าขึ้นมา{name}บวกเลขค่าแป้งผิดสองครั้ง ต้องนับนิ้ว ตารางที่เคยมองแวบเดียวแล้วเข้าใจกลับเป็นแค่ตาราง รอยถอยไปหนึ่งขั้น ส่วนที่เหลืออยู่ยังอุ่นเหมือนเดิม
      effects: { marks: { star: -1 }, stats: { INT: -2 }, clear_flags: [star_called], flags: [refused_the_sky, gave_back_the_answers] }
    - id: be_held
      label: "ปลุก{near} ให้จับตัวไว้จนสว่าง"
      requires: { cast: [near] }
      text: |
        {near}ตื่นตั้งแต่{name}ยังพูดไม่จบประโยค ไม่ถามว่าทำไม เอาแขนสองข้างล็อกรอบอกของ{name}จากข้างหลัง แล้วนั่งพิงผนังอยู่อย่างนั้น {name}ดิ้นสองหนตอนดึกจัด หนที่สองแรงจนไหล่ของ{near}กระแทกผนังดัง {near}ไม่ปล่อย เรียกชื่อ{name}ซ้ำๆ ด้วยเสียงธรรมดา เสียงที่ใช้เรียกกินข้าว

        พอสว่าง รอยใต้ผิวหรี่ลงและถอยไปหนึ่งคืบ {near}ยกแขนไม่ขึ้นไปสามวัน ส่วน{name}ตื่นมาพร้อมผิวตรงที่รอยเคยอยู่บางจนเห็นเส้นเลือด
      effects: { marks: { star: -1 }, max_hp: -1, people: [{ id: "@near", closeness: 1 }], clear_flags: [star_called], flags: [refused_the_sky, held_through_the_call] }

# ---------- เสียงทุ้มเรียกชื่อ ----------
- id: adult.brand_called
  stage: adult
  weight: 400
  must: true
  once: false
  scene: home
  when:
    age: [16, 150]
    flags: [brand_called]
  text: |
    ใกล้รุ่ง {name}ได้ยินชื่อตัวเองจากทางตะวันออก เสียงทุ้ม ต่ำกว่าเสียงคน ไม่ได้ดังมาจากไกล ดังมาจากข้างในตรา

    เสียงนั้นไม่ขู่และไม่ขอ บอกเพียงว่าถึงเวลาตามข้อตกลง แล้วก็เงียบ แบบเจ้าหนี้ที่รู้ว่าลูกหนี้อ่านสัญญาออก

    ตราร้อนจนผ้าห่มตรงที่ทับอยู่มีกลิ่นไหม้ {name}ลุกขึ้นนั่ง เท้าทั้งสองข้างหันไปทางตะวันออกอยู่ก่อนแล้ว
  choices:
    - id: walk_east
      label: ลุกขึ้นเดินไปทางตะวันออก (ชีวิตนี้จบที่นี่)
      text: |
        {name}ไม่ได้เก็บของ ปิดประตูบ้านให้สนิท แล้วเดินไปทางที่ตะวันกำลังจะขึ้น คนที่เดินสวนมาเห็นตราที่สว่างผ่านเนื้อผ้าแล้วหลีกทางให้โดยไม่ต้องขอ

        ผู้เฝ้าผนึกที่แนวหินเห็นคนแบบนี้ปีละหลายคน และเลิกห้ามมานานแล้ว คนบนกำแพงเล่าทีหลังว่า{name}ไม่ได้ลังเลตอนถึงแนวหิน ก้าวข้ามไปเหมือนคนกลับบ้าน หมาเถ้าสองตัวที่นอนอยู่ฝั่งโน้นลุกขึ้นยืน แล้วเดินขนาบไปจนลับควัน
      effects: { die: taken, world: { demon: 2 }, flags: [walked_east_at_the_call] }
    - id: lamp_flame
      label: ไปเคาะประตูวิหารเวรัส ให้ลนตราด้วยไฟตะเกียง (เสียของในตัวไปถาวร)
      text: |
        นักบวชเปิดประตูทั้งที่ยังไม่สว่าง เห็นตราแล้วไม่ถามสักคำ จุดตะเกียงดวงที่ใช้เฉพาะงานนี้ ไส้สั้น เปลวขาว ให้{name}กัดสายหนัง แล้วลนตราจนเสียงทุ้มข้างในเงียบ นานเท่าสวดจบหนึ่งบท กลิ่นติดวิหารไปสามวัน

        ตราเย็นลงหนึ่งขั้น เนื้อรอบตราแข็งเป็นแผ่น ขยับแล้วตึง นักบวชพันผ้าให้ บอกว่าถ้าเสียงนั้นกลับมาอีก ให้มาก่อนที่เท้าจะหันไปเอง
      effects: { marks: { brand: -1 }, max_hp: -2, world: { gods: 1 }, clear_flags: [brand_called], flags: [refused_the_low_voice, burned_the_brand_by_lamp] }
    - id: pay_it_back
      label: ขนของที่ได้จากข้อตกลงไปคืน ไกลไปทางตะวันออกเท่าที่กล้าเดิน
      requires: { min_gold: 6 }
      text: |
        ของบางอย่างคืนไม่ได้แล้ว ใช้ไปแล้ว กินไปแล้ว {name}จึงตีราคาเองเป็นเงิน ตีแพงไว้ก่อน เดินไปจนถึงหินแบนก้อนหนึ่งที่หันหน้าไปทางตะวันออก วางเหรียญเรียงเป็นแถว พูดออกเสียงว่าคืนอะไรบ้าง ทีละอย่าง แล้วเดินกลับโดยไม่เหลียว

        เช้าวันต่อมามีคนเลี้ยงแพะผ่านไปทางนั้น เล่าว่าบนหินไม่มีอะไร แต่หินอุ่นทั้งที่ยังไม่โดนแดด ตราของ{name}เย็นลงหนึ่งขั้น และเสียงทุ้มไม่ได้เรียกอีก
      effects: { gold: -6, marks: { brand: -1 }, clear_flags: [brand_called], flags: [refused_the_low_voice, returned_the_bargain] }
    - id: cold_water
      label: จุ่มตราลงในน้ำเย็นจัดจนสว่าง (เสียของในตัวไปถาวร)
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ตักน้ำจากบ่อใส่ถัง จุ่มตราลงไป น้ำเดือดเป็นฟองในสิบลมหายใจ เทออก ตักใหม่ จุ่มอีก ทำอย่างนี้สามสิบกว่าถังจนฟ้าสาง เสียงทุ้มพูดประโยคเดิมอีกครั้งเดียวตอนถังที่ยี่สิบ แล้วไม่พูดอีก

          ตราเย็นลงหนึ่งขั้น มือข้างที่ตักน้ำพองทั้งฝ่า หายแล้วหนังยังด้าน กำของเล็กๆ ไม่ถนัดเหมือนก่อน
        effects: { marks: { brand: -1 }, max_hp: -1, clear_flags: [brand_called], flags: [refused_the_low_voice] }
      failure:
        text: |
          ถังที่สิบสอง{name}หน้ามืด ล้มคว่ำลงข้างบ่อ ตราจมอยู่ในโคลนเย็นจนสว่างเพราะไม่มีแรงลุก คนที่มาตักน้ำตอนเช้าเจอเข้าก็ช่วยกันหามกลับบ้าน โคลนรอบตัวแห้งแตกเป็นระแหงทั้งที่เมื่อคืนฝนตก

          ตราเย็นลงหนึ่งขั้น ไข้ขึ้นอยู่เก้าวัน หายแล้วแรงไม่กลับมาเท่าเดิม ถังน้ำที่เคยหิ้วสองใบต้องหิ้วทีละใบ
        effects: { marks: { brand: -1 }, max_hp: -2, stats: { STR: -1 }, clear_flags: [brand_called], flags: [refused_the_low_voice] }

# ---------- ฉากตายของคนที่เดินตามเสียงไป ----------
- id: death.taken_sky
  stage: death
  mark: ฟ้าเรียกตัว
  weight: 100
  when:
    dying: [taken]
    told: true
    flags: [answered_the_sky]
  text: |
    ก้าวสุดท้ายก่อนถึงกลางลาน {name}ยังหันกลับได้ รู้ว่ายังหันกลับได้ และรู้ด้วยว่าจะไม่หัน

    น้ำค้างเกาะหลังเท้า เย็นอย่างที่เคยเย็นมาทั้งชีวิต ข้างบนไม่มีอะไรให้เห็นนอกจากฟ้า เสียงที่เรียกเงียบไปแล้ว แบบคนที่เชิญแขกเข้าบ้านแล้วถอยให้ทาง
  choices:
    - id: look_at_the_shoes
      label: หันไปดูรองเท้าที่วางไว้
      text: |
        รองเท้าสองข้างอยู่ตรงธรณีประตู วางคู่กัน หัวหันเข้าบ้าน {name}ไม่ได้ตั้งใจวางแบบนั้น มือวางเอง แบบที่วางทุกคืนก่อนเข้านอน

        คนที่มาเจอตอนเช้าจะรู้จากรองเท้าคู่นี้ว่าไม่มีใครลาก ไม่มีใครผลัก คนคนนี้ถอดรองเท้าเรียบร้อยแล้วเดินออกไปเอง {name}อยากให้รู้แค่นั้น
      effects:
        epitaph: วางรองเท้าไว้คู่กัน แล้วเดินออกไปเอง
    - id: ask_the_last_question
      label: ถามคำถามสุดท้าย
      text: |
        มีคำถามหนึ่งที่{name}ไม่เคยเขียนลงกระดาษแผ่นไหน ไม่เคยถามใคร {name}ถามออกไปตอนนี้ ไม่ได้ออกเสียง

        คำตอบมาถึงก่อนคำถามจะจบ ยาวกว่าบรรทัดครึ่งมาก และไม่มีคำไหนเกินกว่าที่ถาม {name}พูดออกมาคำเดียว อ้อ คนบ้านติดกันที่นอนไม่หลับได้ยินคำนั้นผ่านหน้าต่าง เล่าให้ใครฟังก็ไม่มีใครเชื่อว่าคนเราจะพูดแค่นั้น
      effects:
        epitaph: ได้คำตอบของคำถามที่ไม่เคยถามใคร
    - id: remember_the_bare_arm
      label: นึกถึงตอนที่ยังไม่มีรอย
      text: |
        ผิวที่ต้นแขนเคยเป็นแค่ผิว หน้าหนาวแตก หน้าร้อนลอก มีแผลเป็นจากเรื่องที่จำได้ว่าเรื่องอะไร {name}นึกถึงแขนข้างนั้น แขนที่ไม่รู้อะไรเลย บวกเลขผิด หลงทางในตลาด

        แล้วแสงใต้ผิวก็สว่างขึ้นจนมองไม่เห็นแขน
      effects:
        epitaph: เคยบวกเลขผิด เคยหลงทาง แล้วคืนหนึ่งก็ไม่หลงอีก

- id: death.taken_east
  stage: death
  mark: เสียงทุ้มเรียกชื่อ
  weight: 100
  when:
    dying: [taken]
    told: true
    flags: [walked_east_at_the_call]
  text: |
    ก้าวสุดท้ายก่อนถึงแนวหิน {name}ยังหันกลับได้ ไม่มีอะไรจับขาไว้ เสียงทุ้มไม่ได้พูดอีกเลยตั้งแต่เรียกครั้งนั้น

    ตราไม่ร้อนแล้ว อุ่นพอดีตัว แบบมือที่มีคนกุมไว้ ลมจากฝั่งโน้นมีกลิ่นถ่านกับกลิ่นขนมปังไหม้ กลิ่นครัวของใครสักคน
  choices:
    - id: count_what_was_given
      label: นับดูว่าได้อะไรมาบ้างจากข้อตกลง
      text: |
        {name}นับได้ทุกอย่าง ไม่มีอย่างไหนที่อีกฝ่ายให้ขาด ไม่มีอย่างไหนมาช้า ของทุกชิ้นใช้ได้จริงตามที่บอก คนที่{name}รู้จักมาทั้งชีวิตไม่มีใครรักษาคำพูดได้เท่านี้สักคน รวมทั้งตัว{name}เอง

        เหลือบรรทัดเดียวที่ยังไม่ได้ทำตาม {name}ก้าวข้ามไปทำ
      effects:
        epitaph: ได้ครบทุกอย่างตามข้อตกลง แล้วก็จ่ายครบเหมือนกัน
    - id: look_back_down_the_road
      label: หันไปดูทางที่เดินมา
      text: |
        ทางทอดกลับไปจนสุดตา ว่าง ไม่มีใครวิ่งตามมา ไม่มีใครยืนเรียก ควันจากปล่องของถิ่นที่จากมาขึ้นตรงเหมือนทุกเช้า มีคนติดเตาแล้ว

        {name}ยืนดูจนแน่ใจว่าควันนั้นขึ้นจากปล่องไหน แล้วหันกลับมาทางเดิม
      effects:
        epitaph: เดินไปทางตะวันออก ไม่มีใครตาม
    - id: ask_what_is_inside
      label: ถามเสียงนั้นว่าข้างในเป็นอย่างไร
      text: |
        {name}ถามออกไปดังๆ ผู้เฝ้าผนึกบนกำแพงได้ยิน และจำคำถามนั้นไปเล่าต่อ เสียงทุ้มตอบ ครั้งเดียว ไม่มีใครบนกำแพงได้ยินคำตอบ

        เห็นแต่ว่า{name}ฟังจบแล้วหัวเราะ แบบคนที่โดนโกงตาชั่งมาทั้งชีวิตแล้วเพิ่งได้ของเต็มน้ำหนัก
      effects:
        epitaph: ถามว่าข้างในเป็นอย่างไร แล้วเข้าไปดูเอง

- id: death.taken
  stage: death
  mark: ถูกเรียกไป
  weight: 1
  when:
    dying: [taken]
    told: true
  text: |
    ชั่วอึดใจก่อนก้าวสุดท้าย {name}ยังเป็นของตัวเองอยู่ทั้งตัว ขายังเป็นขา ชื่อยังเป็นชื่อ ไม่มีอะไรลาก ไม่มีอะไรดัน

    สิ่งที่เรียกไม่ได้เรียกซ้ำ รออยู่เฉยๆ แบบคนที่รู้ว่าอีกฝ่ายตัดสินใจไปแล้ว
  choices:
    - id: think_of_the_house
      label: นึกถึงบ้านที่เพิ่งเดินออกมา
      text: |
        เตายังอุ่น ผ้าห่มยังยับเป็นรูปคนนอน ถ้วยใบที่ใช้เมื่อเย็นยังไม่ได้ล้าง {name}นึกถึงถ้วยใบนั้นนานกว่าอย่างอื่น ใครสักคนจะต้องมาล้าง

        ประตูบ้านปิดสนิทดีแล้ว เรื่องนั้น{name}แน่ใจ
      effects:
        epitaph: ปิดประตูบ้านเรียบร้อยก่อนไป
    - id: think_of_nothing
      label: ไม่นึกถึงอะไร
      text: |
        ไม่มีหน้าใครขึ้นมา ไม่มีเรื่องค้าง ไม่มีคำที่ลืมพูด หัวโล่งแบบเช้าวันที่ตื่นก่อนไก่และยังไม่มีอะไรต้องทำ

        {name}ก้าวต่อไป
      effects:
        epitaph: ไปโดยไม่เหลียวหลัง
