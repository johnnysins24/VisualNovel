# ชุด 3 วัยกลางคน อายุ 41 ถึง 64: งานสายนักเวทและนักบวช งานละ 3 ขั้น
# ขั้นกลาง (41–48) คนที่ทุกคนไปตามเมื่อเรื่องพัง ปัญหาที่คนเก่าเท่านั้นอ่านออก และครั้งแรกที่ร่างกายหรือยุคสมัยบอกว่าไม่
# ขั้นสูง (49–56) รับผิดชอบงานและความผิดของคนอื่น ทางไหนก็มีราคา
# วันวางมือ (57–64) ทุกตัวเลือกตั้ง retired หรือ still_working อย่างใดอย่างหนึ่ง กับ flag เฉพาะของทางนั้น
# ข้อความหลักไม่ถือว่าเรื่องช่วง 19–40 เกิดแล้ว เรื่องย้อนอยู่ในตัวเลือกที่ต้องมี flag
# นักบวชประจำป้อมที่ออกจากป้อม clear_flags job_fort_priest และตั้ง left_the_fort กับ retired
# สายนี้ไม่มีจุดตาย

# ---------- ช่างกลเวท ----------
- id: adult.career_artificer_crane_arm
  stage: adult
  scene: golem_shop
  weight: 45
  when:
    age: [41, 48]
    flags: [job_artificer]
  text: |
    เด็กส่งของจากท่าเรือวิ่งมาถึงร้านตอนเช้ามืด หอบจนพูดไม่เป็นคำ โมแรน กรรมกรท่าเรือที่แขนขวาเป็นเหล็กตั้งแต่ไหล่ลงมา แขนของเขาค้างกำโซ่ปั้นจั่นไว้แน่นตั้งแต่ตีสี่ ปลายโซ่มีลังเครื่องกลั่นห้อยอยู่หนักเท่าวัวสองตัว ใต้ลังเป็นเรือขนของที่ยังมีคนขนถ่านอยู่เต็มลำ โมแรนห้อยตัวอยู่กับโซ่ ปล่อยไม่ได้ ช่างของบริษัทท่าเรือปีนขึ้นไปดูมาแล้วสองคน ลงมาบอกว่าไม่เคยเห็นแขนรุ่นนี้

    {name}รู้จักแขนรุ่นนี้ ร้านนี้ทำมาตั้งแต่สมัยที่ยังตะไบเฟืองด้วยมือ แขนรุ่นนั้นออกแบบให้กินหลอดน้ำค้างแบบเก่า หลอดเก่าเรืองหม่น ปีนี้โรงกลั่นส่งหลอดแบบใหม่มาแทนทุกร้าน สว่างกว่า แรงกว่า ราคาถูกกว่าครึ่ง แขนเก่าที่ได้หลอดใหม่จึงกำแรงกว่าที่สปริงข้างในรับไหว

    อากาศตอนเช้ามืดเย็นจัด นิ้วของ{name}แข็งจนต้องแช่น้ำอุ่นก่อนจะจับลวดเส้นเล็กได้ ปีนี้เป็นปีแรกที่ต้องแช่ น้ำในอ่างยังไม่ทันอุ่น
  choices:
    - id: climb_the_crane
      label: ปีนบันไดปั้นจั่นขึ้นไปคลายสปริงด้วยมือตัวเอง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          บันไดปั้นจั่นเปียกน้ำค้าง {name}ปีนช้า กัดไขควงไว้ในปาก พอถึงไหล่ของโมแรนก็หาฝาข้อศอกเจอโดยไม่ต้องมอง ฝานั้นปิดด้วยสลักทองเหลืองตัวเดียว ลายตะไบบนหัวสลักยังเป็นลายมือของร้าน {name}คลายสปริงกำทีละรอบ นับรอบออกเสียงให้โมแรนรู้ว่าเหลืออีกเท่าไร

          รอบที่เก้า นิ้วเหล็กคลายออกจากโซ่ทีละนิ้ว คนบนเรือข้างล่างยกลังลงได้ก่อนที่แขนจะปล่อยหมด โมแรนนั่งพิงเสาปั้นจั่นอยู่ครึ่งเช้า แล้วถามว่าวันนี้ร้านคิดเท่าไร
        effects: { stats: { DEX: 1 }, gold: 3, flags: [freed_morans_arm] }
      failure:
        text: |
          นิ้วของ{name}ยังแข็งตอนจับไขควงที่หัวสลัก ไขควงลื่นหลุดมือหล่นลงเรือ {name}ต้องใช้ปลายเล็บคลายสปริงแทน ได้ห้ารอบ เล็บนิ้วชี้ฉีกถึงโคน สปริงที่คลายไม่สุดดีดกลับ แขนของโมแรนกระตุกเปิดออกทั้งมือในทีเดียว

          ลังเครื่องกลั่นร่วงลงน้ำข้างกราบเรือ ห่างคนที่ยืนใกล้ที่สุดสองศอก ไม่มีใครเจ็บนอกจากเล็บของ{name} บริษัทท่าเรือส่งใบเรียกเก็บค่าเครื่องกลั่นมาที่ร้านในสัปดาห์นั้น {name}ไม่จ่าย ใบนั้นยังเสียบอยู่ที่ตะปูหลังประตู
        effects: { hp: -2, flags: [dropped_the_dock_crate] }
    - id: count_from_below
      label: ยืนโคนปั้นจั่น ฟังเสียงหลอดในแขน แล้วบอกจังหวะให้โมแรนปล่อยเอง
      check: { stat: INT, dc: 13 }
      success:
        text: |
          หลอดใหม่ในแขนเต้นเร็วกว่าจังหวะเฟือง เสียงหึ่งของมันลอยลงมาถึงโคนปั้นจั่น {name}นับจนได้จังหวะว่าทุกเก้าครั้งหลอดจะเต้นช้าลงหนึ่งครั้ง ตอนนั้นแหละที่สปริงกำหลวมที่สุด {name}ตะโกนนับขึ้นไปให้โมแรนฟัง แล้วบอกให้เขาเกร็งไหล่ทั้งไหล่ในจังหวะที่เก้า

          ครั้งแรกไม่ได้ ครั้งที่สองนิ้วเหล็กเผยอออกครึ่งนิ้ว ครั้งที่สามโมแรนหลุดจากโซ่ ห้อยแขนซ้ายอยู่กับคานจนคนท่าเรือดึงขึ้นไป บ่ายวันนั้นเขาเอาแขนมาให้{name}เปลี่ยนกลับเป็นหลอดเก่า คนท่าเรืออีกเจ็ดคนที่ใส่แขนรุ่นเดียวกันเดินตามมาต่อแถว
        effects: { stats: { INT: 1 }, gold: 5, flags: [counted_morans_tube] }
      failure:
        text: |
          ลมทะเลพัดเสียงหลอดหายไปครึ่งหนึ่ง {name}นับผิดหนึ่งจังหวะ โมแรนเกร็งไหล่ตอนสปริงตึงที่สุด แขนเหล็กกระชากไหล่ของเขาหลุดเบ้า เสียงร้องของเขาดังไปทั้งท่า คนท่าเรือต้องเลื่อยโซ่ขาดทั้งเส้น ลังลงน้ำไปพร้อมโซ่

          {name}ใส่ไหล่ให้เขาเองที่โคนปั้นจั่น ไม่คิดเงิน แล้วจ่ายค่าโซ่ให้บริษัทท่าเรืออีกสี่เหรียญ โมแรนกลับมาทำงานได้หลังสิบวัน ใช้แขนซ้ายลากลังไปก่อน
        effects: { gold: -4, flags: [dropped_the_dock_crate] }
    - id: cut_him_free
      label: บอกคนท่าเรือให้ตัดสายรัดไหล่ ปล่อยโมแรนลงน้ำ ทิ้งแขนไว้กับโซ่
      habit: cool_headed
      text: |
        สายรัดแขนเหล็กเป็นหนังวัวสามชั้น คนท่าเรือตัดขาดในสามมีด โมแรนร่วงลงน้ำข้างกราบเรือ ว่ายเข้าฝั่งด้วยแขนข้างเดียว แขนเหล็กห้อยกำโซ่อยู่อย่างนั้นจนเที่ยง หลอดในแขนหมดแสงเอง นิ้วเหล็กจึงคลายออก

          แขนตกลงมากระแทกดาดฟ้าเรือ บิดเสียรูปทั้งท่อน {name}ทำแขนใหม่ให้โมแรนตลอดหนาวนั้น คิดแค่ค่าทองเหลือง ใช้หลอดเก่าที่ยังเหลือในลิ้นชัก
      effects: { gold: -4, alignment: { moral: 1 }, flags: [built_moran_a_new_arm] }
    - id: send_tiven_up
      label: ส่งทิเวนขึ้นไป ตัวเองยืนบอกทางอยู่ข้างล่าง
      requires: { flag: taught_tiven }
      text: |
        ทิเวนมือนิ่งกว่า{name}ตอนอายุเท่ากัน เขาปีนขึ้นไปพร้อมไขควงสองอันเสียบเข็มขัด {name}ยืนโคนปั้นจั่น ตะโกนบอกชื่อเฟืองทีละตัวเหมือนวันที่สอนเขาครั้งแรก ทิเวนไม่ได้ฟัง เขาเจอสปริงกำก่อน{name}จะบอกถึง

          ลังลงถึงเรือโดยไม่มีอะไรแตก ทิเวนลงมาบอกว่าหลอดใหม่แรงเกินแขนรุ่นเก่า ต้องลดเกลียวสปริงลงสองรอบทุกแขนในเมือง {name}รู้เรื่องนี้ตั้งแต่เช้า แต่ปล่อยให้เขาพูดเอง เดือนนั้นร้านรับงานลดเกลียวแขนเก่าสามสิบกว่าแขน ทิเวนลงชื่อในใบงานทุกใบ
      effects: { reputation: { dwarf_council: 1 }, flags: [tiven_freed_the_arm] }

- id: adult.career_artificer_bad_batch
  stage: adult
  scene: golem_shop
  weight: 45
  when:
    age: [49, 56]
    flags: [job_artificer]
  text: |
    ปีก่อนร้านของ{name}ได้งานใหญ่ที่สุดตั้งแต่เปิดร้าน แขนกลสี่สิบแขนสำหรับคนงานโรงสีที่เสียแขนในเครื่องบด เจ้าของโรงสีสามโรงลงขันกันจ่าย {name}ทำแบบ ทำข้อต่อ ส่วนสปริงข้อมือทั้งสี่สิบชุดให้ฟาเรล ช่างหนุ่มที่ร้านจ้างมาสองปี มือเร็ว ทำงานสะอาด {name}ลงตราร้านในใบรับรองทุกใบ

    ฤดูนี้แขนสามแขนในชุดนั้นกำเองโดยไม่มีใครสั่ง แขนหนึ่งบีบมือลูกสาวเจ้าของแขนจนกระดูกนิ้วแตก อีกแขนกำเพลาเครื่องบดค้างไว้จนเพลาลากคนเข้าไปครึ่งตัว {name}แกะดูแล้ว สปริงข้อมือชุดนั้นชุบผิดน้ำ เหล็กเปราะ ฟาเรลชุบด้วยน้ำบ่อหลังร้านแทนน้ำมัน เพราะน้ำมันหมดกลางคืนและเขาไม่อยากปลุกใคร

    สมาคมช่างจะส่งคนมาตรวจในสิบวัน เจ้าของโรงสีทั้งสามส่งคนมาบอกว่าไม่อยากให้เรื่องถึงสมาคม ฟาเรลนั่งอยู่หลังร้านตั้งแต่เช้า ไม่แตะเครื่องมือสักชิ้น
  choices:
    - id: recall_all
      label: เรียกแขนคืนทั้งสี่สิบแขน เปลี่ยนสปริงใหม่ทุกชุดด้วยเงินร้าน
      text: |
        {name}เดินโรงสีทีละโรงเอง เคาะประตูบ้านคนใส่แขนทีละบ้าน ขอแขนคืนสามวัน บางคนไม่ยอมถอด บอกว่าสามวันไม่มีแขนคือสามวันไม่มีค่าแรง {name}จ่ายค่าแรงสามวันให้ด้วย ร้านทำงานกลางคืนอยู่ครึ่งเดือน ฟาเรลชุบสปริงใหม่ทั้งสี่สิบชุดเอง ด้วยน้ำมันที่{name}ยืนจับถังให้

        คนตรวจของสมาคมมาถึงตอนแขนกลับไปอยู่กับเจ้าของครบแล้ว เขาจดว่าร้านแก้งานเสียก่อนได้รับคำร้อง เงินเก็บของร้านหายไปแปดเหรียญ ใบรับรองชุดใหม่มีตราร้านกับลายมือฟาเรลอยู่ข้างกัน
      effects: { gold: -8, stats: { CON: 1 }, alignment: { moral: 1 }, flags: [recalled_the_arm_batch] }
    - id: let_farel_carry_it
      label: บอกสมาคมตามจริงว่าใครชุบสปริง แล้วให้ฟาเรลรับผิดคนเดียว
      habit: cold_blood
      text: |
        คนตรวจของสมาคมจดชื่อฟาเรลลงสมุดดำของสมาคมช่าง ร้านไหนในเวนทราสก็ไม่จ้างคนที่มีชื่อในสมุดเล่มนั้นอีก สมาคมปรับร้านของ{name}สองเหรียญฐานรับรองงานโดยไม่ตรวจ แล้วได้งานแขนชุดใหม่ของโรงสีต่อ

        ฟาเรลเก็บเครื่องมือของตัวเองใส่ผ้าห่อในเย็นนั้น ทิ้งตะไบอันที่ดีที่สุดไว้บนโต๊ะงาน ไม่รู้ว่าลืมหรือตั้งใจ ปลายปี{name}ได้ข่าวว่าเขาไปซ่อมเกวียนอยู่ที่ปลายรางฝั่งแดนเถ้า
      effects: { gold: -2, alignment: { law: 1, moral: -1 }, flags: [let_farel_carry_it] }
    - id: swap_by_night
      label: ไปเปลี่ยนสปริงตามบ้านตอนกลางคืน ก่อนคนตรวจจะมาถึง
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          สิบคืนติดกัน {name}กับฟาเรลถือกล่องเครื่องมือไปเคาะประตูบ้านคนงานโรงสีหลังเลิกกะ เปลี่ยนสปริงข้อมือขณะเจ้าของแขนกินข้าวเย็น แขนละเท่าเวลาซดน้ำแกงหมดชาม ไม่ต้องถอดแขนออกจากไหล่ ฟาเรลถือตะเกียง {name}ทำ เพราะนิ้วของฟาเรลสั่นทุกครั้งที่เข้าบ้านคนที่แขนเคยกำ

          คนตรวจของสมาคมมาถึงวันที่สิบเอ็ด สุ่มดูแขนห้าแขน สปริงใหม่ทั้งห้า ไม่มีอะไรให้จด เจ้าของโรงสีจ่ายค่าเปลี่ยนสปริงให้ครึ่งหนึ่ง ไม่ถามว่ากลางคืนทำไมร้านไม่ปิด
        effects: { stats: { DEX: 1 }, flags: [swapped_springs_by_night] }
      failure:
        text: |
          คืนที่เจ็ด แขนที่{name}กำลังเปลี่ยนสปริงกำขึ้นมาเองระหว่างที่ฝาข้อมือเปิด นิ้วเหล็กหนีบมือซ้ายของ{name}ไว้กับขอบโต๊ะกินข้าวจนข้อนิ้วก้อยหัก เจ้าของแขนร้องจนเพื่อนบ้านออกมาดู

          ข่าวไปถึงสมาคมก่อนคนตรวจจะมา สมาคมปรับร้านห้าเหรียญฐานแก้งานโดยไม่แจ้ง นิ้วก้อยข้างนั้นงอไม่ลงอีก
        effects: { hp: -2, gold: -5, flags: [guild_fined_the_springs] }
    - id: darrug_lathes
      label: ข้ามถนนไปขอให้ดาร์รุกกลึงสปริงชุดใหม่ด้วยเครื่องของเขา
      requires: { flag: partnered_darrug }
      text: |
        ดาร์รุกฟังเรื่องน้ำบ่อจนจบ แล้วเรียกฟาเรลข้ามถนนไปยืนข้างเครื่องกลึง สอนวิธีชุบด้วยน้ำมันแบบตระกูลทั่งคู่ ตั้งแต่ต้มน้ำมันจนจุ่มเหล็ก สองวันสองคืน สปริงสี่สิบชุดออกจากเครื่องกลึง เท่ากันทุกชุดไม่ผิดกันสักเส้นผม

        ค่ากลึงดาร์รุกไม่เอาเป็นเงิน เขาขอให้ร้านของ{name}ส่งงานข้อนิ้วข้อเท้าให้ร้านฝั่งโน้นทำครึ่งหนึ่งไปจนสิ้นปี ฟาเรลข้ามถนนไปทำงานฝั่งโน้นทุกเช้าจนครบปี กลับมาพร้อมผิวมือที่มีรอยน้ำมันไหม้แบบคนแคระ
      effects: { reputation: { dwarf_council: 1 }, flags: [darrug_made_the_springs] }

- id: adult.career_artificer_shop_key
  stage: adult
  scene: golem_shop
  weight: 45
  mark: วางกุญแจร้าน
  when:
    age: [57, 64]
    flags: [job_artificer]
  text: |
    หน้าหนาวนี้{name}ร้อยลวดผ่านรูเฟืองไม่ลงสามครั้งในเช้าเดียว ไขควงอันเล็กที่สุดในร้านหลุดจากนิ้ว กลิ้งลงไปใต้โต๊ะงาน ต้องให้เด็กส่งของคลานเข้าไปหยิบ ตาเห็นรูเฟืองชัด แต่นิ้วไปไม่ถึงตรงที่ตาเห็น

    กุญแจร้านแขวนอยู่ที่ตะขอข้างประตู ดอกเดียวกับที่ช่างคนก่อนวางไว้บนโต๊ะงานของ{name}ในเช้าวันหนึ่งเมื่อนานมาแล้ว ทองเหลืองที่ด้ามสึกเป็นรอยนิ้วโป้ง ร้านคนแคระฝั่งตรงข้ามส่งคนมาถามเป็นครั้งที่สามแล้วว่า{name}จะขายร้านหรือยัง

    ลูกค้าเก่าคนหนึ่งยืนรออยู่หน้าโต๊ะ ถือแขนกลที่{name}ทำให้เขาเมื่อหลายหนาวก่อน ข้อนิ้วสึกจนเป็นมัน เขาไม่อยากได้แขนใหม่ เขาอยากให้แขนนี้ใช้ได้อีกสักหนาว
  choices:
    - id: key_to_tiven
      label: ปลดกุญแจลงจากตะขอ ส่งให้ทิเวน
      requires: { flag: taught_tiven }
      text: |
        ทิเวนรับกุญแจไปแล้ววางคืนบนโต๊ะงานของ{name} บอกว่าโต๊ะนี้ยังเป็นของ{name} ให้มานั่งด่าคนที่ทำงานพลาดได้ทุกวัน เขาซ่อมแขนของลูกค้าเก่าคนนั้นเสร็จก่อนเที่ยง ใช้เฟืองที่ตะไบมือ ไม่ใช่เฟืองกลึง

        {name}ย้ายเก้าอี้ไปตั้งข้างเตา ทุกเช้าฟังเสียงตะไบของทิเวนจากตรงนั้น บอกได้ว่าเฟืองตัวไหนตะไบเกินไปครึ่งเส้นผม ทิเวนแก้ทุกตัวที่{name}ทัก ไม่เคยเถียง
      effects: { reputation: { dwarf_council: 1 }, flags: [retired, gave_the_shop_to_tiven] }
    - id: sell_to_the_anvil_clan
      label: ข้ามถนนไปขายร้านให้ร้านคนแคระฝั่งตรงข้าม
      text: |
        คนแคระตระกูลทั่งคู่นับเงินแปดเหรียญวางบนโต๊ะงานของ{name}ทีละเหรียญ แล้วขนเครื่องกลึงเครื่องที่สามเข้ามาตั้งในร้านในวันเดียวกัน ตะไบมือทั้งหมดของ{name}ใส่หีบไม้วางไว้หลังร้าน พวกเขาบอกว่าจะเก็บไว้ ไม่มีใครบอกว่าจะเก็บไว้ทำอะไร

        {name}เช่าห้องชั้นบนของร้านเดิม ทุกเช้าได้ยินเสียงเครื่องกลึงหมุนตั้งแต่ไก่ขัน เสียงเหมือนแมลงวันติดขวด ลูกค้าเก่าคนนั้นได้แขนกลึงใหม่ทั้งแขน ราคาครึ่งเดียว เขามาอวดที่บันได แล้วถามว่าเอาแขนเก่าไปไว้ไหนดี
      effects: { gold: 8, flags: [retired, sold_the_shop_to_the_anvil_clan] }
    - id: keep_the_old_arms
      label: ไม่ขาย ไม่ส่ง รับแต่งานซ่อมแขนเก่าวันละงานเดียว
      text: |
        {name}ตะไบเฟืองตอนสายเท่านั้น หลังแดดส่องถึงโต๊ะงานจนนิ้วอุ่น งานวันละชิ้น ชิ้นเดียว แขนของลูกค้าเก่าคนนั้นใช้เวลาสี่วัน ข้อนิ้วทุกข้อได้เฟืองใหม่ ฟันไม่เท่ากันทุกซี่ เพราะนิ้วของเขางอไม่เท่ากันทุกข้อ

        ข่าวไปเร็วกว่าที่คิด ทุกต้นสัปดาห์มีคนแก่มาต่อแถวหน้าร้าน ถือแขนเก่าที่ร้านอื่นบอกให้ทิ้ง ร้านคนแคระฝั่งตรงข้ามเลิกส่งคนมาถาม แล้วเริ่มส่งแขนเก่าที่พวกเขาซ่อมไม่ได้ข้ามถนนมาให้แทน
      effects: { stats: { WIS: 1 }, mark: ช่างซ่อมแขนเก่า, flags: [still_working, kept_the_old_arms_running] }
    - id: close_the_shop
      label: ซ่อมแขนชิ้นนี้เป็นชิ้นสุดท้าย แล้วปิดร้าน
      text: |
        {name}ซ่อมแขนของลูกค้าเก่าคนนั้นจนเสร็จ ใช้เวลาหกวัน นานกว่าที่เคยใช้สามเท่า แล้วแขวนป้ายปิดร้านที่ประตู ขายเครื่องมือให้ช่างหนุ่มที่มาซื้อทีละชิ้น เก็บไว้แค่ตะไบอันแรก กับเฟืองข้อนิ้วตัวหนึ่งที่ทำไม่เสร็จเมื่อหลายปีก่อน

        หนาวนั้น{name}นอนตื่นสายเป็นครั้งแรกตั้งแต่เป็นลูกมือ มือหายปวดในเดือนที่สอง ทุกเช้ายังลุกขึ้นไปจับลูกบิดประตูร้าน แล้วนึกขึ้นได้ว่าไม่ต้องไข
      effects: { hp: 2, gold: 3, flags: [retired, closed_the_shop] }

# ---------- นักวิจัยสถาบัน ----------
- id: adult.career_researcher_counting_machine
  stage: adult
  scene: institute
  weight: 45
  when:
    age: [41, 48]
    flags: [job_researcher]
  text: |
    สถาบันซื้อเครื่องนับเลขมาจากฮอร์ดุน ตู้ทองเหลืองสูงเท่าคน มือหมุนอยู่ด้านข้าง ข้างในมีเฟืองตัวเลขสามร้อยกว่าตัว หมุนครึ่งวันได้ตารางที่นักวิจัยสามคนต้องนั่งคิดกันหนึ่งเดือน อาจารย์ใหญ่สั่งว่าตารางทุกแผ่นที่ออกจากตึกตะวันตกต้องผ่านเครื่องนี้ก่อน

    {name}อ่านตารางแผ่นแรกจากเครื่องผ่านแว่นขยาย ตัวเลขพิมพ์เล็กเท่าเมล็ดงา ตาข้างขวาอ่านไม่ออกถ้าไม่มีแว่นมาตั้งแต่ต้นปี เครื่องปัดเศษทุกตัวเลขเหลือสองหลักหลังจุด ตัวเลขเล็กๆ ที่ทำให้เส้นของดาวโค้งขึ้นทุกปีอยู่ในหลักที่สาม ตารางจากเครื่องจึงออกมาเกือบเป็นเส้นตรง ไม่มีใครในตึกสงสัย เพราะเครื่องไม่เคยบวกเลขผิดสักครั้ง

    รายงานประจำปีถึงราชสำนักต้องส่งในสิบวัน ใบปะหน้าเว้นช่องลายมือรับรองไว้ช่องเดียว ช่องของ{name}
  choices:
    - id: sign_the_machine
      label: ลงชื่อรับรองตารางของเครื่อง
      text: |
        {name}ลงชื่อด้วยหมึกดำ ตัวหนังสือเล็กกว่าที่เคยเขียน รายงานไปถึงราชสำนักตรงเวลา ขุนนางในสภาชมว่าตารางของสถาบันปีนี้สะอาดที่สุดเท่าที่เคยส่งมา ราชสำนักจ่ายรางวัลห้าเหรียญ

        คืนนั้น{name}เปิดตารางที่คิดเองด้วยมือเมื่อปีก่อนวางเทียบกับตารางของเครื่อง ไล่ดูหลักที่สามด้วยแว่นขยายจนเทียนหมดเล่ม แล้วเก็บแผ่นที่คิดด้วยมือใส่ลิ้นชักล่างสุด
      effects: { gold: 5, reputation: { crown: 1 }, alignment: { law: 1 }, flags: [signed_the_machine_tables] }
    - id: redo_by_hand
      label: นั่งคิดตารางทั้งชุดเองด้วยมือ แข่งกับเวลาสิบวัน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          สิบคืน {name}นอนคืนละสามชั่วยาม ที่เหลือนั่งคิดเลขใต้ตะเกียงสองดวง ตาข้างขวาปิดผ้าไว้ให้ตาซ้ายทำงานแทน ลูกศิษย์ผลัดกันมาฝนหมึกให้ วันที่สิบตารางเสร็จ หลักที่สามครบทุกช่อง เส้นโค้งขึ้นที่ปลายเหมือนทุกปี

          {name}ส่งตารางสองชุดคู่กัน ชุดของเครื่องกับชุดของมือ อาจารย์ใหญ่ส่งไปทั้งสองชุด เพราะไม่กล้าเลือก เดือนต่อมามีคำสั่งลงมาจากราชสำนักว่าปีหน้าให้ส่งชุดเดียว และให้เป็นชุดที่มีหลักที่สาม
        effects: { stats: { CON: 1 }, reputation: { royal_institute: 1 }, flags: [outcounted_the_machine] }
      failure:
        text: |
          คืนที่เจ็ด ตาข้างซ้ายเริ่มเห็นตัวเลขซ้อนกันเป็นสองตัว {name}คิดต่ออีกสองคืนจนตัวเลขซ้อนเป็นสาม แล้วต้องหยุด ตารางเสร็จไม่ถึงครึ่ง

          รายงานไปถึงราชสำนักพร้อมตารางของเครื่อง ไม่มีลายมือรับรองของ{name} หมอที่สถาบันเรียกมาบอกให้พักตาหนึ่งเดือน ห้ามอ่าน ห้ามเขียน เดือนนั้น{name}นั่งฟังลูกศิษย์อ่านตัวเลขให้ฟัง แล้วคิดเลขในหัว
        effects: { hp: -2, flags: [eyes_gave_out_on_the_sums] }
    - id: add_a_wheel
      label: เปิดตู้เครื่องนับเลข ต่อเฟืองหลักที่สามเพิ่มเอง
      check: { stat: INT, dc: 14 }
      success:
        text: |
          ฝาหลังตู้ไขด้วยกุญแจคนแคระสี่ดอก {name}ยืมช่างกลจากโรงงานข้างสถาบันมาไขให้ ข้างในเฟืองหลักที่สองต่อกับคานปัดเศษตัวเดียว {name}ถอดคานนั้นออก ต่อเฟืองตัวเลขเพิ่มอีกแถว ใช้เฟืองที่ช่างกลตะไบให้ตามแบบที่{name}วาดบนกระดาษห่อขนมปัง สามคืน

          เครื่องหมุนช้าลงหนึ่งในสาม ตารางออกมามีหลักที่สามครบทุกช่อง เส้นโค้งกลับมาที่ปลาย อาจารย์ใหญ่บ่นเรื่องความช้าอยู่ทั้งเดือน แต่ไม่สั่งให้ถอดเฟืองแถวนั้นออก
        effects: { stats: { INT: 1 }, flags: [added_a_third_wheel] }
      failure:
        text: |
          เฟืองแถวใหม่กินฟันกับแถวเก่าผิดไปครึ่งซี่ เครื่องหมุนได้สามรอบแล้วติด ตัวเลขในหน้าต่างค้างอยู่ที่ศูนย์ทุกช่อง {name}ต้องจ่ายค่าช่างคนแคระที่สถาบันเรียกมาซ่อมจากเงินตัวเองสี่เหรียญ

          ช่างคนแคระถอดเฟืองของ{name}ออก วางเรียงบนโต๊ะ บอกว่าแบบนี้คิดถูก แต่ตะไบผิด แล้วใส่คานปัดเศษกลับเข้าที่เดิม
        effects: { gold: -4, flags: [jammed_the_counting_machine] }
    - id: jar_against_the_machine
      label: ยกโหลแก้วที่จดเวลาแสงมาวางบนหลังตู้เครื่องนับเลข
      requires: { flag: jar_clock }
      text: |
        โหลแก้วใบนั้นยังจดเวลาให้{name}ทุกคืนฟ้าเปิด แสงในโหลไหลขึ้นเร็วกว่าเมื่อคืนก่อนเท่าเทียนหยดหนึ่งหยดเสมอ ไม่เคยช้ากว่านั้น {name}ยกโหลมาวางบนหลังตู้ทองเหลือง แล้วขอให้อาจารย์ใหญ่มานั่งดูด้วยกันหนึ่งคืน

        ตีหนึ่งกับอีกนิด แสงในโหลเริ่มไหลขึ้นเพดาน {name}หมุนเครื่องหาเวลาเดียวกันจากตารางของเครื่อง เครื่องบอกว่าแสงควรไหลตอนตีหนึ่งครึ่ง อาจารย์ใหญ่นั่งอยู่จนแสงในโหลไหลหมด ไม่ได้ลุกไปไหน เช้ามาเขาสั่งให้ตารางของตึกตะวันตกมีลายมือคนรับรองหลักที่สามทุกแผ่น
      effects: { world: { star: 1 }, flags: [jar_against_the_machine] }

- id: adult.career_researcher_lowan
  stage: adult
  scene: institute
  weight: 45
  when:
    age: [49, 56]
    flags: [job_researcher]
  text: |
    ลอวัน ลูกศิษย์ปีสามของ{name} คิดตารางแรงดันหม้อกลั่นให้โรงกลั่นริมแม่น้ำ ทั้งตารางถูกทุกช่อง ยกเว้นช่องเดียว เลขศูนย์หลังจุดหายไปหนึ่งตัว ตารางผ่านโต๊ะของ{name}ในค่ำวันหนึ่งที่ตาล้าจนต้องปิดตาข้างหนึ่งอ่าน {name}ลงชื่อรับรอง

    หม้อกลั่นใบที่ใช้ตารางนั้นร้าวในกะดึก น้ำค้างดิบพ่นออกมาเป็นไอฟ้าใส่คนงานสามคนที่ยืนใกล้ที่สุด สามสัปดาห์ต่อมาผิวที่ข้อมือของทั้งสามคนเริ่มใส

    สมาคมโรงกลั่นแจ้งมาว่าจะไม่ฟ้องสถาบัน ถ้าสถาบันส่งชื่อคนผิดไปให้หนึ่งชื่อ อาจารย์ใหญ่เขียนชื่อสองชื่อลงบนกระดาษแผ่นเดียว ลอวัน กับ{name} แล้ววางปากกาไว้ข้างกระดาษ ให้{name}ขีดเอง ลอวันยืนอยู่หลังประตูห้อง ประตูเปิดแง้มไว้เท่าฝ่ามือ
  choices:
    - id: cross_out_your_own
      label: ขีดชื่อตัวเองออก ส่งชื่อลอวันไป
      habit: cold_blood
      text: |
        {name}ขีดเส้นเดียว ตรง ไม่สั่น อาจารย์ใหญ่พับกระดาษใส่ซองทันที ลอวันออกจากสถาบันก่อนสิ้นเดือน สมาคมโรงกลั่นจดชื่อเขาไว้ ไม่มีโรงกลั่นไหนในเวนทราสรับเขาเข้าทำงาน

        สมุดคิดเลขของลอวันยังวางอยู่บนโต๊ะในห้องเรียน หน้าสุดท้ายเป็นตารางแรงดันที่เขาคิดใหม่ทั้งตารางหลังคืนนั้น ไม่มีช่องไหนผิด {name}เก็บสมุดเล่มนั้นไว้ในลิ้นชักโต๊ะตัวเอง
      effects: { alignment: { law: 1, moral: -1 }, reputation: { royal_institute: 1 }, flags: [gave_up_lowans_name] }
    - id: cross_out_lowan
      label: ขีดชื่อลอวันออก ส่งชื่อตัวเองไป แล้วจ่ายค่ายาคนงานสามคน
      text: |
        สมาคมโรงกลั่นรับชื่อของ{name}ไป สถาบันตัดเงินเดือน{name}ลงครึ่งหนึ่งไปสองปี และย้ายห้องทำงานของ{name}ไปอยู่ห้องที่หน้าต่างเปิดไม่ได้ {name}จ่ายค่ายาให้คนงานสามคนห้าเหรียญ เป็นยาที่ทำให้แก้วโตช้าลง ไม่ใช่ยาที่ทำให้หาย

        ลอวันมาทำงานในห้องใหม่ของ{name}ทุกวันโดยไม่มีใครสั่ง ทุกตารางที่เขาคิดหลังจากนั้น เขาเขียนเลขศูนย์หลังจุดตัวโตกว่าตัวอื่นครึ่งเท่า จนเป็นนิสัยไปทั้งชีวิต
      effects: { gold: -5, alignment: { moral: 1 }, reputation: { royal_institute: -1 }, people: [{ id: lowan, name: ลอวัน, gender: m, bond: friend, closeness: 2, age: 22 }], flags: [signed_for_lowans_zero] }
    - id: trace_the_zero
      label: ตามหาว่าเลขศูนย์ตัวนั้นหายไปที่มือไหนกันแน่
      check: { stat: INT, dc: 14 }
      success:
        text: |
          {name}ขอสมุดร่างของลอวันมาเทียบกับตารางที่ส่งไปโรงกลั่น ในสมุดร่าง เลขศูนย์ตัวนั้นอยู่ครบ หายไปตอนคัดลงแผ่นที่จะส่ง คนคัดเป็นเสมียนคัดลายมือของสถาบัน ชายแก่ที่คัดตารางให้ทุกตึกมาสามสิบปี ตาของเขาแย่กว่าตาของ{name}

          สมาคมโรงกลั่นรับชื่อเสมียนคนนั้นไป สถาบันให้เขาออกพร้อมเบี้ยหวัดครึ่งเดียว ลอวันได้อยู่ต่อ เขาไปส่งเสมียนแก่ขึ้นเกวียนกลับบ้านในวันสุดท้าย แบกหีบให้ แล้วกลับมาคัดตารางของตัวเองด้วยมือตัวเองทุกแผ่นตั้งแต่วันนั้น
        effects: { stats: { INT: 1 }, flags: [found_the_copyists_zero] }
      failure:
        text: |
          สมุดร่างของลอวันเปียกน้ำชาไปครึ่งเล่มตั้งแต่ต้นฤดู หน้าที่มีตารางนั้นอ่านไม่ออก ไม่มีอะไรยืนยันได้ว่าศูนย์ตัวนั้นหายที่มือใคร สิบวันผ่านไปกับการตามหาสิ่งที่ไม่มีแล้ว

          อาจารย์ใหญ่ส่งชื่อลอวันไปเองโดยไม่รอ{name} ค่าคนส่งเอกสารไปมาระหว่างสถาบันกับโรงกลั่นสิบวันนั้น สถาบันหักจากเงินเดือนของ{name}สี่เหรียญ
        effects: { gold: -4, flags: [couldnt_find_the_zero] }
    - id: celen_checks_every_table
      label: ไปเคาะห้องข้างๆ ห้องที่ประตูไม่เคยปิด
      requires: { flag: presented_celens_table }
      text: |
        เซเลน คอร์ดิส ผมขาวทั้งหัวแล้ว ประตูห้องยังเปิด นางฟังเรื่องเลขศูนย์จนจบ แล้วขอตารางทุกแผ่นที่ลอวันเคยคิดมาตลอดสามปี สองคืนต่อมานางเดินเข้าห้องประชุมพร้อม{name} วางตารางเจ็ดสิบแผ่นบนโต๊ะอาจารย์ใหญ่ ผิดช่องเดียวในเจ็ดสิบแผ่น และช่องนั้นมีลายมือรับรองสองคน

          นางบอกที่ประชุมว่าถ้าต้องส่งชื่อ ให้ส่งชื่อตึกตะวันตกทั้งตึก ที่ประชุมไม่ส่งชื่อใคร สถาบันจ่ายค่ายาคนงานสามคนจากเงินทุนของตึกตะวันตก ปีนั้นตึกตะวันตกไม่ได้ซื้อกระดาษใหม่ ทุกคนเขียนบนหลังกระดาษเก่า
      effects: { alignment: { moral: 1 }, reputation: { star_hall: 1 }, flags: [celen_stood_for_lowan] }

- id: adult.career_researcher_tables
  stage: adult
  scene: institute
  weight: 45
  mark: ส่งต่อตาราง
  when:
    age: [57, 64]
    flags: [job_researcher]
  text: |
    ตารางที่{name}จดมาทั้งชีวิตการงานเต็มหีบไม้สี่ใบ อยู่ใต้โต๊ะ ใต้เตียงในห้องพัก และบนชั้นที่ไม้แอ่นลงตรงกลาง ตาข้างขวาอ่านแถวล่างไม่ได้แล้วแม้มีแว่นขยาย ตาซ้ายยังพอ ถ้าแดดดี

    สถาบันมีระเบียบว่านักวิจัยที่เลิกสอนต้องคืนห้อง ห้องของ{name}จะเป็นของลูกศิษย์ที่ได้ตำแหน่งใหม่ภายในฤดูนี้ หีบสี่ใบต้องไปอยู่ที่ไหนสักแห่ง ห้องเก็บเอกสารใต้ดินของสถาบันยินดีรับ ห้องนั้นน้ำซึมทุกหน้าฝน

    ลูกศิษย์คนใหม่มายืนวัดผนังห้องตั้งแต่เช้า ขอโทษ{name}ทุกครั้งที่เท้าเตะหีบ
  choices:
    - id: give_to_the_cellar
      label: ห่อตารางด้วยผ้าชุบขี้ผึ้งทีละปึก แล้วส่งลงห้องใต้ดิน
      text: |
        {name}ห่อตารางเองทีละปึก ผ้าชุบขี้ผึ้งสองชั้น มัดเชือกปอ เขียนปีกำกับไว้หัวมัด ใช้เวลาครึ่งเดือน ห้องใต้ดินรับไปวางบนชั้นไม้ยกสูงจากพื้นหนึ่งศอก ตามที่{name}ขอ

        {name}ย้ายไปเช่าห้องใกล้สถาบัน ทุกต้นหน้าฝนยังเดินมาขอกุญแจห้องใต้ดิน ลงไปจับมัดตารางทีละมัดว่าชื้นหรือไม่ คนเฝ้าห้องใต้ดินเลิกถามว่ามาทำอะไรตั้งแต่ปีที่สอง
      effects: { flags: [retired, gave_the_tables_to_the_cellar] }
    - id: to_ileth
      label: เปิดจดหมายของหอนับดาวไอเลธที่ยังเก็บไว้ แล้วตอบรับ
      requires: { flag: sent_true_curve }
      text: |
        หอนับดาวไอเลธขอสำเนาตารางของ{name}มาตั้งแต่ปีที่{name}ส่งเส้นโค้งตามจริง จดหมายฉบับล่าสุดไม่ได้ขอสำเนา ขอให้{name}เอาฉบับจริงมาเอง จะมีห้องให้ มีโต๊ะที่หน้าต่างหันไปทางทิศที่ดาวขึ้นใหม่บ่อยที่สุด

        หีบสี่ใบขึ้นเกวียนสินค้าไปทางตะวันตกพร้อม{name} ยี่สิบสองวันถึงไอเลธ นักนับดาวเอลฟ์ที่ออกมารับเปิดหีบใบแรกตรงลานหน้าหอ ไล่นิ้วไปตามตัวเลขแถวแรกของปีแรก แล้วบอกว่าปีนั้นของหอนับดาวนับขาดไปสองดวง
      effects: { reputation: { star_hall: 1 }, location_tag: ileth, flags: [retired, took_the_tables_to_ileth] }
    - id: keep_teaching
      label: ขอโต๊ะมุมห้องสมุดตัวเดียว สอนคิดเลขด้วยมือสัปดาห์ละคืน
      text: |
        ห้องสมุดของสถาบันให้โต๊ะมุมที่ใกล้หน้าต่างที่สุด {name}สอนคืนวันว่าง ไม่มีเครื่องนับเลข ไม่มีแว่นขยาย มีแต่กระดานชนวนกับดินสอหิน ลูกศิษย์ต้องคิดหลักที่สามด้วยมือทุกช่อง ใครปัดเศษ {name}ให้ลบแล้วคิดใหม่

        คืนแรกมีลูกศิษย์สามคน ปลายปีมีสิบสี่ คนที่สิบสี่เป็นอาจารย์ใหญ่ฝ่ายกลั่นคนใหม่ นั่งแถวหลังสุด คิดช้ากว่าทุกคน
      effects: { stats: { WIS: 1 }, mark: สอนคิดเลขด้วยมือ, flags: [still_working, kept_teaching_the_curve] }
    - id: print_them
      label: จ้างร้านพิมพ์พิมพ์ตารางทั้งชุด แจกทุกที่ที่ยอมรับ
      text: |
        ร้านพิมพ์หลังท่าเรือคิดหกเหรียญสำหรับสองร้อยชุด ใช้เวลาสามเดือน เพราะตัวพิมพ์ตัวเลขไม่พอ ต้องหล่อเพิ่ม {name}ตรวจแผ่นพิมพ์ทุกแผ่นด้วยตาซ้าย แก้ผิดไปสิบเอ็ดช่อง

        สองร้อยชุดไปอยู่ในห้องสมุดวิหาร โรงกลั่นเล็ก ห้องเช่าของกลุ่มผู้ฟังดาว และบ้านครูในหมู่บ้านที่มีจานรับดาว ชุดหนึ่งไปอยู่ในร้านขายเครื่องมือช่างในย่านคลอง ใช้รองขาโต๊ะที่โยก {name}เห็นเองตอนไปซื้อตะปู แล้วไม่ได้ทวงคืน
      effects: { gold: -6, alignment: { moral: 1 }, flags: [retired, printed_the_star_tables] }

# ---------- หมอเถื่อน ----------
- id: adult.career_hedge_blue_children
  stage: adult
  scene: healer
  weight: 45
  when:
    age: [41, 48]
    flags: [job_hedge_doctor]
  text: |
    ตั้งแต่ต้นเดือน เด็กในย่านคลองอาเจียนออกมาเป็นสีฟ้า ไม่ใช่ฟ้าสด ฟ้าขุ่นเหมือนน้ำล้างหม้อกลั่น ห้องเหนือร้านปลาเค็มมีเด็กนอนเต็มสามเตียง อีกสี่คนนอนบนเสื่อ แม่ของเด็กนั่งเรียงกันอยู่บนบันได

    สมาคมโรงกลั่นติดประกาศไว้ทุกหัวซอย ว่าเป็นไข้แก้วชนิดติดต่อ ห้ามคนย่านคลองข้ามสะพานไปฝั่งตลาดจนกว่าโรคจะหมด หมอของสมาคมเดินมาถึงเชิงบันได ไม่ขึ้นมา ตะโกนบอกให้{name}ส่งชื่อเด็กทุกคนไปที่สมาคมภายในสามวัน

    {name}รักษาคนผิวแก้วมานานพอจะรู้ว่าไข้แก้วไม่ได้เป็นแบบนี้ ผิวเด็กไม่ใส ปากเขียว อาเจียนฟ้า ไม่มีใครติดจากใคร มีแต่เด็กที่ลงเล่นน้ำในคลองช่วงใต้ท่อของโรงกลั่นหัวน้ำ คนแถวนั้นได้ยินเสียงถังกลิ้งลงน้ำทุกคืนตอนตีสอง มือของ{name}เดือนนี้สั่นจนป้อนยาเด็กเองไม่ได้ ต้องให้แม่เด็กถือช้อน แล้ว{name}จับข้อมือแม่ไว้
  choices:
    - id: keep_them_off_the_canal
      label: เดินเคาะทุกบ้านในย่าน ห้ามเด็กลงคลอง ให้ต้มน้ำทุกหยด
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}เดินทุกซอยในย่านคลองสามวัน หยุดทุกประตู พูดกับแม่ ไม่ใช่กับพ่อ เพราะแม่เป็นคนตักน้ำ บอกว่าไข้นี้ไม่ได้มาจากเด็กข้างบ้าน มาจากน้ำ ให้ต้มทุกหยด แม้แต่น้ำล้างหน้า ยายคนหนึ่งในซอยท้ายเอาไม้ไผ่ไปขวางทางลงคลองทุกท่า ผูกเชือกไว้แน่น

          สิบวันต่อมาไม่มีเด็กคนใหม่ขึ้นบันได เด็กบนเสื่อลุกเดินได้ทีละคน สมาคมถอดประกาศออกเอง แล้วออกประกาศใหม่ว่าไข้แก้วชนิดติดต่อหายไปเพราะสมาคมสั่งปิดสะพานทันเวลา
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [kept_kids_off_the_canal] }
      failure:
        text: |
          แม่ส่วนใหญ่ฟัง แต่เด็กไม่ฟัง น้ำในคลองเย็นตอนบ่าย และย่านคลองไม่มีที่อื่นให้เล่น บ่ายวันที่สอง{name}ลุยลงคลองไปลากเด็กชายสองคนขึ้นมาเอง น้ำถึงอก กลิ่นเหมือนหม้อกลั่นที่ไม่ได้ล้าง

          คืนนั้น{name}อาเจียนเป็นสีฟ้าเอง นอนเตียงเดียวกับคนไข้สามวัน เด็กชายสองคนนั้นผลัดกันป้อนน้ำต้มให้
        effects: { hp: -2, flags: [drank_the_blue_canal] }
    - id: watch_the_outfall
      label: ถือตะเกียงไปนั่งรอใต้ท่อของโรงกลั่นตอนตีสอง
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}นั่งในเรือจ้างลำเล็กใต้สะพานไม้ ตะเกียงคลุมผ้าไว้ ตีสองประตูเหล็กหลังโรงกลั่นเปิด คนงานสามคนกลิ้งถังลงน้ำทีละถัง ถังไม้ฝาตอกตะปู ลอยไปตามน้ำสองสามช่วงตัวแล้วฝาก็หลุด น้ำในคลองเรืองฟ้าเป็นวงกว้างเท่าลานวัว แล้วค่อยจางลงตามน้ำไปทางย่านคลอง

          {name}ให้คนเรือพายไปเก็บฝาถังที่ลอยมาติดเสาสะพาน ฝานั้นตีตราโรงกลั่นด้วยเหล็กร้อน เช้ามาฝาถังวางอยู่บนโต๊ะผู้ตรวจของศาลาว่าการ คนงานกลิ้งถังลงคลองต่ออีกสามคืน แล้วหยุด
        effects: { stats: { WIS: 1 }, alignment: { law: 1 }, flags: [saw_the_night_barrels] }
      failure:
        text: |
          ยามโรงกลั่นเห็นแสงตะเกียงที่ลอดผ้าคลุมออกมาเพียงนิดเดียว เขาสองคนลงมาที่ท่าน้ำพร้อมไม้พลอง {name}ไม่ทันลงเรือ ไม้พลองฟาดไหล่ซ้ายจน{name}ล้มลงบนบันไดท่าน้ำ

          ยามคนหนึ่งจำได้ว่า{name}เป็นหมอห้องเหนือร้านปลาเค็ม เขาบอกเพื่อนให้หยุด แล้วพยุง{name}ขึ้นจากบันได บอกให้กลับบ้าน คืนนั้นไม่มีเสียงถังกลิ้งลงน้ำ คืนต่อมามีอีก
        effects: { hp: -2, flags: [beaten_at_the_outfall] }
    - id: send_the_names
      label: ส่งชื่อเด็กทุกคนให้สมาคม ให้สมาคมจัดการตามประกาศ
      habit: cool_headed
      text: |
        {name}เขียนชื่อเด็กสิบเอ็ดคนกับซอยที่อยู่ ส่งไปตามที่สมาคมสั่ง สมาคมส่งเกวียนมีหลังคามารับเด็กไปบ้านพักคนไข้ของสมาคมนอกเมือง ที่นั่นมีเตียงสะอาด มีข้าวสามมื้อ และไม่มีน้ำจากคลอง

        เด็กทุกคนหายภายในสองสัปดาห์ สมาคมเขียนในรายงานว่าบ้านพักคนไข้ของสมาคมหยุดไข้แก้วชนิดติดต่อได้ ส่งเงินรางวัลให้หมอที่ส่งชื่อมาครบห้าเหรียญ เด็กที่ลงเล่นน้ำคลองหลังจากนั้นเริ่มอาเจียนสีฟ้าอีกตอนปลายเดือน
      effects: { gold: 5, alignment: { law: 1, moral: -1 }, reputation: { distillers: 1 }, flags: [sent_the_blue_names] }
    - id: mekhtam_lights_the_outfall
      label: ให้เมฆต่ำพาแม่ของเด็กทุกคนถือตะเกียงไปยืนใต้ท่อตอนตีสอง
      requires: { flag: guild_doctor_enemy }
      text: |
        เมฆต่ำไม่ต้องพูดมาก นางเดินไปตามบันไดทุกขั้นที่มีแม่นั่งรอ บอกเวลา บอกที่ ตีสอง ใต้สะพานไม้หลังโรงกลั่น แม่สิบเอ็ดคนไปยืนเรียงกันบนตลิ่ง ตะเกียงคนละดวง ยืนนิ่ง ไม่ส่งเสียง

        ประตูเหล็กหลังโรงกลั่นเปิดออกครึ่งบาน คนงานที่กลิ้งถังมาถึงหน้าประตูหยุดอยู่ตรงนั้น เห็นตะเกียงสิบเอ็ดดวงอยู่อีกฝั่งน้ำ ประตูปิดลง คืนต่อมาแม่ยี่สิบคนไปยืน คืนที่สามไม่มีใครต้องไป
      effects: { alignment: { moral: 1 }, reputation: { distillers: -1 }, flags: [mekhtam_lit_the_outfall] }

- id: adult.career_hedge_perin
  stage: adult
  scene: healer
  weight: 45
  when:
    age: [49, 56]
    flags: [job_hedge_doctor]
  text: |
    เพริน ลูกสาวคนล้างหม้อในโรงกลั่น อายุสิบสี่ จุดใสบนแขนซ้ายของนางโตจากเท่าเล็บเป็นเท่าฝ่ามือในสองฤดู นางขึ้นบันไดมาคนเดียว ขอให้ฝานออก นางได้ยินมาว่าผิวแก้วฝานออกได้ ถ้ามีดลงลึกพอดี

    ลึกพอดีคือเท่าความหนาของแก้ว ลึกกว่านั้นโดนเส้นเลือด ตื้นกว่านั้นแก้วกลับขึ้นมาใหม่ มือของ{name}ปีนี้สั่นแม้ตอนเช้าก่อนกินอะไร ลูกมือคนใหม่ของห้องนี้มือนิ่งที่สุดที่{name}เคยสอน แต่ยังไม่เคยจับมีดฝานแก้วสักครั้ง

    แม่ของเพรินตามขึ้นมายืนอยู่ที่หัวบันได บอกว่าถ้าจะฝาน ให้หมอฝานเอง นางไม่อยากให้ลูกเป็นที่ฝึกมือของใคร มีดเผาไฟวางอยู่บนผ้าขาว ร้อนได้ที่แล้ว
  choices:
    - id: cut_it_yourself
      label: ฝานเอง กดข้อมือตัวเองไว้กับขอบโต๊ะให้นิ่ง
      check: { stat: DEX, dc: 14 }
      success:
        text: |
          {name}วางสันมือขวาลงบนขอบโต๊ะ ให้โต๊ะรับน้ำหนักแทนข้อมือ มีดเคลื่อนช้ากว่าที่เคยครึ่งหนึ่ง แต่ไม่สั่น ผิวแก้วหลุดออกมาเป็นแผ่นบางเหมือนน้ำแข็งบนผิวบ่อตอนเช้าหน้าหนาว ใต้นั้นเป็นเนื้อแดง เลือดออกปกติ

          เพรินไม่ร้องตลอดเวลาที่มีดอยู่บนแขน ร้องตอนเห็นแผ่นแก้วที่{name}วางลงบนผ้าขาว เพราะมันใสจนเห็นลายผ้าข้างใต้ สิบวันต่อมานางขึ้นบันไดมาให้ดูแผล {name}กดดูทุกนิ้วรอบแผล ไม่เจอจุดใส
        effects: { stats: { DEX: 1 }, alignment: { moral: 1 }, flags: [cut_perins_glass] }
      failure:
        text: |
          มือนิ่งได้ครึ่งแผ่น ครึ่งหลังมีดลงลึกไปครึ่งเส้นผม เลือดพุ่งขึ้นมาเป็นสาย ลูกมือกดแผลไว้ด้วยมือทั้งสองข้างจน{name}เย็บเส้นเลือดเสร็จ ใช้เวลานานกว่าที่ใครในห้องจะกล้าหายใจ

          เพรินรอด แผ่นแก้วออกมาครบ แต่นิ้วนางกับนิ้วก้อยข้างซ้ายงอไม่สุดอีก {name}จ่ายค่ายาบำรุงเลือดให้ทั้งเดือน สามเหรียญ แม่ของนางรับยาไปทุกครั้งโดยไม่ขอบคุณ
        effects: { gold: -3, flags: [perins_fingers_wont_bend] }
    - id: guide_the_young_hand
      label: ส่งมีดให้ลูกมือ แล้วจับข้อมือเขาไว้ทั้งแผ่น
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}บอกแม่ของเพรินว่ามือที่ถือมีดจะเป็นมือของลูกมือ แต่ความลึกจะเป็นของ{name} แล้วยืนชิดหลังลูกมือ จับข้อมือเขาไว้ด้วยนิ้วสามนิ้ว ไม่กด ไม่ดึง บอกเป็นคำสั้นๆ ทุกครั้งที่มีดต้องหยุด หยุด ไป หยุด

          แผ่นแก้วออกมาครบในครั้งเดียว ลูกมือวางมีดลงแล้วนั่งลงกับพื้นทันที แม่ของเพรินลงบันไดไปซื้อปลาเค็มมาให้เขาหนึ่งตัว ไม่ได้ซื้อให้{name}
        effects: { stats: { WIS: 1 }, flags: [guided_the_young_knife] }
      failure:
        text: |
          ลูกมือฝานได้ตื้นเกินไปตลอดทั้งแผ่น เพราะนิ้วของ{name}ที่จับข้อมือเขาไว้สั่นทุกครั้งที่มีดขยับ เขาจึงหยุดทุกครั้งที่รู้สึกว่านิ้วนั้นสั่น แผลหายเร็ว ไม่มีอะไรผิดปกติให้เห็นอยู่สองเดือน

          เดือนที่สาม จุดใสขึ้นมาใหม่ตรงกลางแผลเป็น เท่าเมล็ดถั่ว {name}คืนค่ารักษาให้แม่ของเพรินสองเหรียญ
        effects: { gold: -2, flags: [perins_glass_came_back] }
    - id: wrap_and_wait
      label: ไม่ฝาน พันแผลให้ แล้วบอกให้รอดูอีกฤดู
      text: |
        {name}พันแขนนางด้วยผ้าต้ม บอกตามจริงว่ามือของหมอวันนี้ไม่นิ่งพอ และมือของลูกมือยังไม่เคยลอง แก้วเท่าฝ่ามือยังไม่ถึงกระดูก รออีกฤดูไม่เสียอะไรมาก แม่ของเพรินพาลูกลงบันไดไปโดยไม่ตอบ

        ปลายฤดู{name}ได้ข่าวว่าเพรินไปให้หมอสมาคมฝาน หมอสมาคมฝานได้สะอาด คิดเงินแปดเหรียญ แม่ของนางขายกี่ทอผ้าไปจ่าย
      effects: { alignment: { law: 1 }, flags: [sent_perin_to_the_guild] }
    - id: mekhtam_takes_the_knife
      label: ส่งมีดให้เมฆต่ำ
      requires: { flag: hid_glass_patients }
      text: |
        เมฆต่ำเปิดประตูให้คนผิวแก้วตอนเที่ยงคืนมาหลายปี เห็น{name}ฝานแก้วมาทุกแผ่น นับครั้งได้มากกว่า{name}เอง นางรับมีดไปโดยไม่ถาม แม่ของเพรินเห็นเขาบนหัวนาง แล้วถอยไปหนึ่งก้าว เพรินจับมือแม่ไว้

        เมฆต่ำฝานครั้งเดียวจบ ความลึกเท่าที่{name}เคยสอนไว้ไม่ผิดสักเส้นผม เย็นนั้นแม่ของเพรินกลับมาที่ห้องอีกครั้ง ถือผ้าคลุมหัวผืนใหม่มาให้เมฆต่ำ ทอเองด้วยด้ายสีเดียวกับผ้าคลุมผืนเก่าที่เมฆต่ำใส่อยู่
      effects: { alignment: { moral: 1 }, flags: [mekhtam_took_the_knife] }

- id: adult.career_hedge_stairs
  stage: adult
  scene: healer
  weight: 45
  mark: ลงบันได
  when:
    age: [57, 64]
    flags: [job_hedge_doctor]
  text: |
    บันไดขึ้นห้องเหนือร้านปลาเค็มมีสิบเก้าขั้น หนาวนี้{name}ขึ้นได้วันละรอบ ลงได้วันละรอบ คนไข้ที่มาก่อนสายต้องนั่งรอจนกว่า{name}จะขึ้นไปถึง คนขายปลาเค็มข้างล่าง ลูกชายของคนเก่า ตั้งม้านั่งยาวไว้ที่เชิงบันไดให้คนรอ ม้านั่งตัวนั้นไม่เคยว่างก่อนเที่ยง

    เขาบอก{name}ด้วยเสียงเกรงใจว่าห้องข้างบนจะขึ้นค่าเช่าในหนาวหน้า ย่านคลองมีคนจากฝั่งตลาดมาเช่าห้องมากขึ้น จ่ายได้มากกว่า

    เช้านี้{name}นั่งพักอยู่บนขั้นที่สิบ นับคนบนม้านั่งได้เก้าคน คนสุดท้ายเป็นเด็กผู้หญิงที่ถือแขนตัวเองไว้ด้วยมืออีกข้าง ข้อมือมีจุดใสเท่าเมล็ดงา
  choices:
    - id: room_to_mekhtam
      label: ส่งกุญแจห้องให้เมฆต่ำ แล้วลงบันไดเป็นรอบสุดท้าย
      requires: { flag: guild_doctor_enemy }
      text: |
        เมฆต่ำรับกุญแจไป แล้วถามว่าค่าเช่าใหม่เท่าไร {name}บอก นางขยับนิ้วสามนิ้วแบบคนนับเงินในหัว แล้วบอกว่าพอ เพราะคนไข้ผิวแก้วจ่ายเป็นปลาเค็มได้ แต่คนจากฝั่งตลาดต้องจ่ายเป็นเงิน

        {name}เช่าห้องชั้นล่างหลังร้านปลาเค็ม ไม่มีบันได ทุกเช้านั่งฟังเสียงเท้าขึ้นลงบันไดเหนือหัวนับคนไข้ บางวันเมฆต่ำลงมาถามเรื่องคนไข้ที่ไม่เคยเห็นแบบนี้มาก่อน บางวันไม่ลงมา
      effects: { flags: [retired, gave_the_room_to_mekhtam] }
    - id: table_at_the_stair_foot
      label: ยกโต๊ะลงมาตั้งที่เชิงบันได ข้างม้านั่ง
      text: |
        คนขายปลาเค็มยกโต๊ะลงมาให้ ตั้งชิดผนังร้าน ใต้ชายคาที่แขวนปลาเค็มไว้สามแถว {name}รักษาคนไข้ตรงนั้นตั้งแต่สายถึงบ่าย คนไข้ที่ต้องนอนให้ขึ้นไปนอนห้องข้างบน ลูกมือเป็นคนขึ้นลง

        กลิ่นปลาเค็มติดผ้าพันแผลทุกผืน คนไข้บ่นในเดือนแรก เดือนที่สามคนไข้ใหม่ถามหาหมอที่อยู่ใต้ปลาเค็ม ค่าเช่าห้องข้างบนลดลงครึ่งหนึ่ง เพราะคนขายปลาเค็มขายปลาได้มากขึ้นจากคนที่มานั่งรอ
      effects: { stats: { WIS: 1 }, mark: หมอใต้ชายคาปลาเค็ม, flags: [still_working, healed_at_the_stair_foot] }
    - id: go_to_a_village
      label: ขึ้นเกวียนไปหมู่บ้านที่ยังไม่มีหมอ
      text: |
        หมู่บ้านริมทุ่งที่{name}ไปถึงไม่มีหมอมาสิบปี มีแต่หญิงทำคลอดหนึ่งคนกับคนตัดผมที่ถอนฟันเป็น {name}เช่าบ้านไม้หลังเตี้ย บันไดขึ้นเรือนมีสามขั้น

        คนในหมู่บ้านไม่มีใครผิวแก้ว ไม่มีใครอาเจียนสีฟ้า มีแต่คนตกต้นไม้ วัวเหยียบ ไข้หน้าฝน มือของ{name}ยังสั่นเท่าเดิม แต่หนาวแรกในหมู่บ้านนั้นไม่ต้องฝานอะไรที่ต้องลึกพอดีเลยสักครั้ง
      effects: { hp: 2, location_tag: arvel_village, flags: [retired, went_to_a_village_without_a_doctor] }
    - id: write_the_glass_book
      label: ปิดห้อง นั่งเขียนทุกอย่างที่รู้เรื่องผิวแก้วลงสมุด
      text: |
        {name}เขียนด้วยมือซ้ายเพราะมือขวาสั่นกว่า ตัวหนังสือออกมาเหมือนเด็กหัดเขียน เขียนทุกคนที่จำได้ ฝานลึกเท่าไร หายหรือไม่หาย ใครกลับมา ใครไม่กลับมา ใครอยู่ใกล้เตาถ่านแล้วแก้วโตช้าลง ใครไม่ จนหมดสมุดสามเล่ม

        เล่มแรกส่งไปห้องสมุดวิหารอีเซล เล่มที่สองส่งไปสถาบันเวทหลวง เล่มที่สามวางไว้บนม้านั่งที่เชิงบันได ให้ใครที่อ่านออกหยิบไป ปลายเดือนสมุดเล่มนั้นหายไป มีปลาเค็มตัวหนึ่งวางไว้แทน
      effects: { stats: { INT: 1 }, flags: [retired, wrote_the_glass_book] }

# ---------- นักบวชในเมือง ----------
- id: adult.career_citypriest_register
  stage: adult
  scene: temple
  weight: 45
  when:
    age: [41, 48]
    flags: [job_city_priest]
  text: |
    นักบวชเสื้อขาวขลิบทองของศาสนจักรตะเกียงสองคนมาถึงวิหารตอนสาย วางสมุดปกหนังสีขาวเล่มหนึ่งไว้บนแท่นของ{god} ทะเบียนเด็กมีเขา ทุกวิหารในเวนทราสได้เล่มเดียวกันในสัปดาห์นี้ เด็กมีเขาที่เกิดในเขตของวิหารไหน วิหารนั้นต้องจดชื่อเด็ก ชื่อพ่อแม่ ย่านที่อยู่ ส่งศาสนจักรทุกสิ้นเดือน วิหารที่ไม่ส่ง ศาสนจักรจะถอนสิทธิ์อวยพรงานแต่ง

    ระหว่างที่พวกเขาอธิบาย หญิงสาวคนหนึ่งอุ้มลูกเข้ามาหน้าแท่น มาขอพรตั้งชื่อตามธรรมเนียม เด็กอายุไม่ถึงเดือน ผ้าห่อหัวหลวมไปข้างหนึ่ง ตุ่มเล็กสองตุ่มใต้ผ้าเห็นชัดพอสำหรับคนที่รู้ว่าต้องดูตรงไหน นักบวชเสื้อขาวทั้งสองคนรู้

    {name}คุกเข่าลงหน้าแท่นเพื่ออวยพรตามที่ทำมาทุกเช้า แล้วลุกขึ้นเองไม่ได้ ต้องให้ลูกมือวิหารเข้ามาพยุงศอก หน้าหนาวนี้เป็นครั้งแรกที่ต้องมีคนพยุง นักบวชเสื้อขาวคนหนึ่งเปิดสมุดหน้าแรก วางปากกาจุ่มหมึกไว้ข้างสมุด
  choices:
    - id: write_it_true
      label: ถามชื่อและย่านของหญิงคนนั้น แล้วจดลงสมุดตามจริง
      text: |
        หญิงคนนั้นตอบทุกคำถามด้วยเสียงเบาลงทุกคำ {name}จดด้วยลายมือที่อ่านง่ายที่สุด แล้วอวยพรตั้งชื่อเด็กตามธรรมเนียมจนจบ นักบวชเสื้อขาวยืนฟังจนจบเหมือนกัน แล้วปิดสมุดถือกลับไปด้วย บอกว่าสิ้นเดือนจะมารับใหม่

        สิ้นเดือนนั้นหน้าแรกของสมุดยังมีชื่อเดียว เดือนต่อมาก็ยังมีชื่อเดียว แม่ที่มีลูกเป็นเด็กมีเขาในเขตนี้เลิกพาลูกมาขอพรตั้งชื่อที่วิหารของ{name}
      effects: { alignment: { law: 1, moral: -1 }, reputation: { lamp_church: 1 }, flags: [filled_the_horned_register] }
    - id: write_a_burned_district
      label: จดชื่อตามจริง แต่จดย่านเป็นย่านที่ไฟไหม้หมดไปเมื่อหลายปีก่อน
      check: { stat: INT, dc: 13 }
      success:
        text: |
          ย่านโรงย้อมเก่าริมคลองสี่ไฟไหม้หมดทั้งย่านในหน้าแล้งปีหนึ่ง ศาลาว่าการยังไม่ลบชื่อย่านออกจากแผนที่ เพราะยังเก็บภาษีที่ดินเปล่าที่นั่นอยู่ {name}จดว่าเด็กคนนี้อยู่ย่านนั้น บ้านเลขที่ที่ไม่มีแล้ว นักบวชเสื้อขาวอ่านแล้วบอกว่าเรียบร้อย

          ปลายปีทะเบียนของวิหาร{name}มีเด็กมีเขาสิบเอ็ดคน ทุกคนอยู่ย่านโรงย้อมเก่า ย่านที่ไม่มีบ้านสักหลัง คนของศาสนจักรเคยไปเดินดูครั้งหนึ่ง เจอแต่ตอเสาไหม้กับหญ้าขึ้นสูงถึงเข่า
        effects: { stats: { INT: 1 }, alignment: { law: -1, moral: 1 }, flags: [wrote_a_burned_district] }
      failure:
        text: |
          นักบวชเสื้อขาวคนหนุ่มโตมาในย่านคลองสี่ เขาอ่านชื่อย่านแล้วเงยหน้าขึ้น บอกว่าย่านนั้นไฟไหม้ตั้งแต่เขายังเด็ก แม่ของเขาหนีออกมาพร้อมเขาในอ้อมแขน

          ศาสนจักรปรับวิหารสามเหรียญฐานจดทะเบียนเท็จ แล้วส่งคนมานั่งเฝ้าหน้าแท่นทุกเช้าที่มีพิธีตั้งชื่อ หญิงคนนั้นไม่ได้กลับมาที่วิหารอีก
        effects: { gold: -3, reputation: { lamp_church: -1 }, flags: [lamp_fined_the_temple] }
    - id: refuse_the_book
      label: ปิดสมุด ยื่นคืนให้นักบวชเสื้อขาว แล้วอวยพรเด็กต่อหน้าพวกเขา
      text: |
        {name}ปิดสมุดด้วยมือข้างเดียว ยื่นคืน แล้วหันไปอวยพรตั้งชื่อเด็กจนจบ ไม่เร่ง ไม่ลดบทไหน นักบวชเสื้อขาวยืนฟังจนจบ แล้วจดอะไรบางอย่างลงกระดาษแผ่นเล็กก่อนออกไป

        เดือนต่อมาวิหารของ{name}อวยพรงานแต่งไม่ได้ คู่บ่าวสาวในเขตต้องข้ามสะพานไปวิหารฝั่งตลาด คู่หนึ่งไม่ยอมข้าม มายืนจับมือกันที่ประตูหลังวิหารตอนสาง ขอให้{name}สวดให้ฟังเฉยๆ ไม่ต้องอวยพรก็ได้
      effects: { alignment: { moral: 1 }, reputation: { lamp_church: -1 }, flags: [refused_the_horned_register] }
    - id: the_basket_has_no_district
      label: บอกหญิงคนนั้นให้วางลูกในตะกร้าหวายข้างประตูหลังหนึ่งคืน
      requires: { flag: kept_the_basket }
      text: |
        ตะกร้าหวายยังอยู่ที่เดิม {name}บอกหญิงคนนั้นเบาๆ ตอนส่งออกประตู ว่าคืนนี้ให้วางลูกไว้ในตะกร้า เช้ามาให้มารับเหมือนคนมาขอเลี้ยงเด็กกำพร้า นางไม่เข้าใจ จนเห็นว่า{name}จดอะไรลงในสมุดขาวในเช้าวันรุ่งขึ้น

        ทะเบียนเขียนว่าพบเด็กมีเขาในตะกร้าหวายข้างประตูหลัง ไม่ทราบพ่อแม่ ไม่ทราบย่าน หญิงจากย่านคลองมาขอรับไปเลี้ยงในวันเดียวกัน ชื่อของนางอยู่ในช่องผู้รับเลี้ยง ไม่ใช่ช่องแม่ ตลอดปีนั้นตะกร้าหวายมีเด็กนอนแทบทุกเดือน และมีคนมาขอรับไปเลี้ยงตอนเช้าทุกครั้ง
      effects: { alignment: { moral: 1, law: -1 }, flags: [basket_babies_have_no_district] }

- id: adult.career_citypriest_sanctuary
  stage: adult
  scene: temple
  weight: 45
  when:
    age: [49, 56]
    flags: [job_city_priest]
  text: |
    ตีสาม หญิงมีเขาคนหนึ่งวิ่งเข้าประตูหลังวิหาร แขนซ้ายเป็นแผลถลอกยาว เท้าเปล่า นางเป็นช่างย้อมผ้าจากย่านคลอง นักบวชหนุ่มที่เฝ้าวิหารกะดึกเปิดประตูรับ แล้วลงกลอนทั้งสองบานก่อนจะไปปลุก{name} เขาเป็นนักบวชที่{name}รับเข้ามาเองเมื่อสามปีก่อน ทำทุกอย่างตามที่{name}สอน

    ตอนสาง นักล่าแม่มดของศาสนจักรตะเกียงสี่คนมายืนที่บันไดหน้าวิหาร ถือหมายที่ศาลหลวงประทับตรา กล่าวหาว่านางเข้าพิธีของลัทธิเถ้า ธรรมเนียมเก่าที่ทุกวิหารของเทพทั้งหกถือกันมา วิหารให้ที่พักสามคืนแก่ใครก็ตามที่ขอ แต่หมายของศาลหลวงมาทีหลังธรรมเนียม และศาลหลวงไม่เคยถามวิหารไหนก่อนออกหมาย

    นักบวชหนุ่มยืนหลังพิงประตูด้านใน มือสั่น หญิงคนนั้นนั่งอยู่ใต้แท่นของ{god} ไม่ร้อง ไม่ขอ
  choices:
    - id: open_the_door
      label: เปิดประตูหน้า รับหมาย
      text: |
        {name}ถอดกลอนเอง อ่านหมายจนจบบนบันได แล้วถอยให้ทาง นักล่าแม่มดเดินเข้าไปถึงใต้แท่นโดยไม่ถอดรองเท้า หญิงคนนั้นลุกขึ้นเดินออกไปเอง ไม่ต้องให้ใครจับ

        สัปดาห์ต่อมานักบวชหนุ่มขอย้ายไปวิหารนอกเมือง {name}ลงชื่อในใบย้าย เขาไม่ได้เถียง ศาสนจักรตะเกียงส่งจดหมายขอบคุณมาหนึ่งฉบับ ลงตราสีทองตรงมุม
      effects: { alignment: { law: 1, moral: -1 }, reputation: { lamp_church: 1 }, flags: [opened_the_door_to_the_writ] }
    - id: read_the_old_vow
      label: ยืนบนบันไดหน้าวิหาร อ่านคำปฏิญาณเรื่องที่พักสามคืนให้คนทั้งถนนฟัง
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}อ่านคำปฏิญาณด้วยเสียงที่ใช้สวดในวันใหญ่ ให้ได้ยินถึงหัวถนน คนขายขนมปังหยุดตั้งแผง คนงานโรงสีที่เดินไปเข้ากะหยุดเดิน ประโยคสุดท้ายของคำปฏิญาณบอกว่าใครที่ละเมิดที่พักสามคืน ต้องละเมิดผ่านตัวนักบวชที่ยืนประตู {name}ยืนประตูอยู่

          นักล่าแม่มดสี่คนดูคนที่ยืนเต็มถนน แล้วถอยลงบันได บอกว่าจะกลับมาในคืนที่สี่ คืนที่สามหญิงคนนั้นออกจากวิหารไปทางประตูหลัง ไม่มีใครเห็นว่าไปทางไหน คืนที่สี่นักล่าแม่มดกลับมาตามที่บอก วิหารว่าง
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, reputation: { lamp_church: -1 }, flags: [held_the_temple_three_nights] }
      failure:
        text: |
          {name}อ่านได้ครึ่งคำปฏิญาณ นักล่าแม่มดคนหน้าสุดเดินขึ้นบันไดมาโดยไม่รอ ไหล่ของเขาชน{name}ล้มลงกระแทกขั้นหิน ศอกซ้ายแตก คนที่ยืนดูบนถนนมีไม่ถึงห้าคน ไม่มีใครขยับ

          หญิงคนนั้นออกไปพร้อมนักล่าแม่มดก่อนแดดจะส่องถึงแท่น นักบวชหนุ่มพันศอกให้{name} มือของเขาไม่สั่นแล้ว
        effects: { hp: -2, flags: [lost_the_sanctuary_woman] }
    - id: out_by_the_back
      label: พานางออกทางประตูหลัง ไปวิหารอีเซลนอกเมือง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ให้นางสวมเสื้อนักบวชตัวสำรองทับ คลุมหัว แล้วเดินนำออกประตูหลังไปพร้อมกับถังน้ำมันตะเกียง เหมือนนักบวชสองคนออกไปซื้อน้ำมันตอนเช้า เดินช้า เพราะ{name}เดินเร็วไม่ได้แล้ว ความช้าทำให้ดูเหมือนจริง

          ครึ่งวันถึงวิหารอีเซลนอกเมือง แม่ชีที่ประตูไม่ถามอะไร นักล่าแม่มดค้นวิหารของ{name}จนเที่ยง เจอแต่นักบวชหนุ่มกวาดลานอยู่ เขากวาดไปจนจบทั้งลานต่อหน้าพวกเขา
        effects: { stats: { DEX: 1 }, alignment: { moral: 1, law: -1 }, flags: [led_her_out_the_back] }
      failure:
        text: |
          นักล่าแม่มดคนหนึ่งยืนรออยู่ที่ปากซอยหลังวิหาร เขาจำเสื้อนักบวชได้ แต่จำได้ด้วยว่าใต้ผ้าคลุมหัวนั้นนูนสองจุด เขาจับแขนนางไว้ ผลัก{name}ออกไปชนกำแพงจนข้อมือพลิก

          ศาสนจักรตะเกียงส่งเรื่องถึงสภาวิหารว่านักบวชของวิหารนี้ช่วยคนในหมายหนี สภาวิหารเรียก{name}ไปฟังคำตำหนิ หญิงคนนั้นไม่ได้กลับมาย่านคลองอีก
        effects: { hp: -2, reputation: { lamp_church: -1 }, flags: [lamp_waited_at_the_back] }
    - id: fah_rong_takes_her
      label: ส่งนักบวชหนุ่มไปตามฟ้าร้องที่มุมหลังวิหาร
      requires: { flag: found_the_crossroads_boy }
      text: |
        ฟ้าร้องยังมานั่งที่มุมหลังวิหารทุกคืนวันว่าง ตอนนี้มีเพื่อนมาด้วยเจ็ดคน คนงานโรงกลั่นทั้งหมด คนมีเขาสามคน เขามาถึงก่อนนักบวชหนุ่มจะเดินกลับถึงวิหาร ฟังเรื่องจากปาก{name}สองประโยค แล้วถอดเสื้อคนงานของตัวเองให้หญิงคนนั้นใส่

          นางออกจากวิหารไปกับคนงานโรงกลั่นแปดคน เดินเป็นกลุ่มไปทางโรงกลั่นเหมือนคนเข้ากะเช้า นักล่าแม่มดสี่คนที่ยืนบันไดหน้ามองเห็นทั้งกลุ่ม ไม่มีใครในกลุ่มนั้นหันมาทางพวกเขา ตกเย็นฟ้าร้องกลับมาจุดเทียนที่มุมเดิม เล่มเดียว
      effects: { alignment: { moral: 1 }, reputation: { lamp_church: -1 }, flags: [fah_rong_took_her_out] }

- id: adult.career_citypriest_dawn
  stage: adult
  scene: temple
  weight: 45
  mark: รอคนขอพรตอนสาง
  when:
    age: [57, 64]
    flags: [job_city_priest]
  text: |
    ทุกเช้าก่อนสาง{name}นั่งบนม้านั่งหินข้างประตูวิหาร รอคนที่แวะมาขอพรก่อนเข้างาน ช่างทอ คนเข็นถังน้ำ แม่ที่ลูกไม่สบาย คนในวิหารเล่ากันมาว่านักบวชใหญ่คนก่อนสิ้นใจบนม้านั่งตัวนี้ ระหว่างรอแบบนี้

    หนาวนี้{name}ต้องใช้มือทั้งสองข้างดันม้านั่งตอนลุก นักบวชหนุ่มคนหนึ่งมายืนห่างออกไปสามก้าวทุกเช้า ไม่ได้ช่วย แค่ยืน เผื่อต้องช่วย

    สภาของวิหารขอให้{name}ตัดสินก่อนหน้าฝน ว่าเสื้อคลุมขนแกะของเวรสาง ตัวที่{name}ใส่มาหลายหนาว จะไปอยู่กับใคร หรือยังอยู่กับ{name}ต่อ เสื้อตัวนั้นหนักขึ้นทุกปี ขนแกะที่คอเสื้อสึกเป็นรอยตามคางของ{name}
  choices:
    - id: pass_the_temple
      label: ถอดเสื้อคลุมเวรสาง ส่งให้นักบวชหนุ่มที่ยืนห่างสามก้าว
      text: |
        นักบวชหนุ่มสวมเสื้อแล้วแขนยาวเกินไปหนึ่งข้อนิ้ว {name}พับปลายแขนให้เอง เย็บด้วยด้ายสีเดียวกัน เช้าแรกที่เขานั่งม้านั่งหินคนเดียว {name}ยืนดูอยู่หลังประตู ไม่ออกไป

        {name}ย้ายไปอยู่ห้องเล็กหลังวิหาร ห้องที่เคยเก็บเทียน ทุกเช้าก่อนสางยังตื่น เดินไปนั่งม้านั่งหินข้างประตู คราวนี้นั่งข้างคนใส่เสื้อคลุมตัวนั้น คนมาขอพรไม่รู้ว่าต้องหันไปหาใคร จึงขอพรจากทั้งสองคน
      effects: { flags: [retired, passed_the_dawn_bench] }
    - id: keep_the_dawn_bench
      label: บอกสภาว่าเสื้อตัวนั้นยังไม่ต้องไปไหน
      text: |
        สภาไม่เถียง สภาไม่เคยเถียงนักบวชที่อยู่วิหารนี้มานานกว่าสมาชิกสภาทุกคน {name}นั่งม้านั่งหินทุกเช้าต่อไป นักบวชหนุ่มยังมายืนห่างสามก้าวทุกเช้า วันที่ฝนตก เขาถือผ้าคลุมมากางให้

        หนาวนั้นคนมาขอพรตอนสางมากขึ้น ช่างทอคนหนึ่งบอกเพื่อนว่าถ้าอยากได้พรจากคนที่{god}ฟังมานานที่สุด ต้องรีบมาก่อนหน้าฝน คนอื่นได้ยินแล้วรีบมาตามกัน
      effects: { stats: { WIS: 1 }, mark: นั่งม้านั่งหินจนถึงวันสุดท้าย, flags: [still_working, kept_the_dawn_bench] }
    - id: rock_babies_at_isel
      label: ส่งเสื้อคลุมต่อ แล้วเดินไปขอเป็นคนกล่อมเด็กที่วิหารอีเซลนอกเมือง
      text: |
        แม่ชีที่ประตูวิหารอีเซลไม่ถามว่าทำไมนักบวชแก่จากในเมืองถึงอยากมานอนห้องติดห้องเด็กอ่อน นางให้ห้องนั้นเลย ผนังบางพอให้ได้ยินเด็กร้อง

        งานของ{name}คือกล่อมเด็กที่ไม่ยอมหลับตอนตีสอง {name}ร้องเพลงสวดตอนสางของ{god}ให้ฟัง เป็นเพลงเดียวที่รู้ทั้งเพลง เด็กมีเขาครึ่งห้องหลับไปก่อนจบท่อนแรก ครึ่งห้องที่เหลือหลับก่อนจบท่อนสอง แม่ชีขอให้สอนเพลงนั้นให้นาง
      effects: { alignment: { moral: 1 }, flags: [retired, rocked_babies_at_isel] }
    - id: sleep_by_the_basket
      label: ย้ายเสื่อไปนอนห้องข้างประตูหลัง ใกล้ตะกร้าหวาย
      requires: { flag: kept_the_basket }
      text: |
        ห้องข้างประตูหลังเคยเป็นที่เก็บไม้กวาด {name}ให้ลูกมือขนไม้กวาดออก ปูเสื่อ วางตะเกียงไว้ที่ขอบหน้าต่างที่มองเห็นตะกร้าหวาย ตะกร้าใบเดิมเปลี่ยนหวายไปแล้วสามรอบ แต่วางอยู่ที่เดิม

        คนที่เอาเด็กมาวางตอนกลางคืนเห็นแสงตะเกียงที่หน้าต่าง บางคนวางแล้วไป บางคนเคาะหน้าต่าง {name}เปิดหน้าต่างทุกครั้ง หนาวนั้นมีแม่สองคนนั่งคุยกับ{name}จนสาง แล้วอุ้มลูกกลับบ้านไปเอง
      effects: { alignment: { moral: 1 }, mark: นอนข้างตะกร้าหวาย, flags: [still_working, slept_by_the_basket] }

# ---------- นักบวชเดินสาย ----------
- id: adult.career_roadhealer_old_village
  stage: adult
  scene: road
  weight: 45
  when:
    age: [41, 48]
    flags: [job_road_healer]
  text: |
    ปีนี้{name}ขึ้นรถไฟเป็นครั้งแรก เนินสุดท้ายก่อนถึงหมู่บ้านที่สามเข่าไม่ยอมเดินแล้ว รางเหล็กวิ่งผ่านเนินนั้นพอดี ค่าตั๋วสองเหรียญทองแดง ตู้ไม้แข็ง เสียงล้อดังจนต้องตะโกนคุย รางเหล็กพาคนหนุ่มสาวของหมู่บ้านตามเส้นทางออกไปทำงานที่เมืองปลายรางเกือบหมดแล้ว เหลือคนแก่ หมา กับบ้านที่ประตูไม่ได้ปิด

    หมู่บ้านที่สามมีคนแก่ไข้ขึ้นห้าคน ท้องบวม ตัวร้อนตอนกลางคืน ผิวมีจุดแดงเล็กๆ ที่แขน ลูกมือที่วิหารเพิ่งส่งมาเดินด้วยเปิดตำราของวิหารแล้วบอกว่าเป็นไข้จุด ตำราสั่งให้ปิดบ้าน ตอกแผ่นไม้ ห้ามคนเข้าออกจนกว่าไข้จะหยุดเอง เขาไปยืมค้อนจากบ้านข้างๆ มาแล้ว

    {name}เปิดยุ้งข้าวของบ้านหลังแรกดู ข้าวปีก่อนเต็มยุ้ง ไม่มีใครเอาออกตากแดดตั้งแต่ลูกหลานไปหมด เมล็ดข้าวมีขนสีเขียวอมดำเกาะเป็นหย่อม คนแก่ที่เคยกินข้าวยุ้งนี้มาทั้งชีวิตไม่เคยเห็นข้าวขึ้นราแบบนี้ เพราะไม่เคยมีปีไหนที่ไม่มีใครตาก
  choices:
    - id: burn_the_old_rice
      label: บอกคนแก่ทั้งหมู่บ้านให้เผาข้าวในยุ้ง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          ไม่มีใครยอมเผาข้าวง่ายๆ ข้าวในยุ้งคือข้าวทั้งปี {name}นั่งคุยกับยายเจ้าของยุ้งแรกจนตะวันตก ไม่ได้พูดเรื่องโรค พูดเรื่องข้าว ตากกี่แดด กลับกี่ครั้ง ข้าวปีไหนหอมที่สุด จนยายเป็นคนพูดเองว่าข้าวปีนี้ไม่หอม

          ยายจุดไฟยุ้งแรกเอง บ้านอื่นตาม {name}ขึ้นรถไฟกลับเมืองไปขอข้าวสารจากวิหารสามกระสอบ ไข้ของคนแก่ห้าคนลงภายในสิบวัน ลูกมือคืนค้อนให้บ้านข้างๆ แล้วถามว่าในตำราตรงไหนเขียนเรื่องข้าวราไว้ {name}บอกว่าไม่มี ให้เขาเขียนเพิ่มเอง
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [burned_the_mouldy_rice] }
      failure:
        text: |
          ยายเจ้าของยุ้งแรกบอกว่ากินข้าวยุ้งนี้มาตั้งแต่ยังไม่มีฟัน ไม่เคยตาย คนแก่บ้านอื่นฟังยาย ไม่ฟังนักบวชที่มาปีละสี่ครั้ง

          {name}ขึ้นรถไฟไปเมืองปลายราง ซื้อข้าวสารใหม่สี่กระสอบด้วยเงินตัวเองสี่เหรียญ ขนกลับมาแลกกับข้าวในยุ้งทีละบ้าน ข้าวเก่าเอาไปเทลงห้วย คนแก่ยอมแลก เพราะข้าวใหม่ขาวกว่า ไม่ใช่เพราะเชื่อ ไข้ลงในเดือนนั้น
        effects: { gold: -4, flags: [traded_the_mouldy_rice] }
    - id: nurse_them
      label: อยู่ในหมู่บ้านต่อ ต้มข้าวใหม่ป้อนคนแก่ทีละบ้าน จนไข้ลง
      check: { stat: CON, dc: 13 }
      success:
        text: |
          สิบสองวัน {name}เดินจากบ้านนี้ไปบ้านนั้นตั้งแต่สาง ต้มข้าวใหม่ที่ซื้อจากรถขายของที่จอดตรงทางรถไฟทุกสามวัน เช็ดตัว ป้อนน้ำข้าว ลูกมือยกข้าวในยุ้งออกมาตากกลางลานคนเดียว เพราะไม่มีใครในหมู่บ้านยกไหวอีก

          วันที่สิบสอง คนแก่คนสุดท้ายลุกขึ้นนั่งเองได้ ถามว่าลูกชายตัวเองส่งข่าวมาบ้างไหม ลูกมือตอบแทน{name}ว่ายังไม่มี แล้วเขียนจดหมายถึงลูกชายคนนั้นให้ในคืนเดียวกัน
        effects: { stats: { CON: 1 }, alignment: { moral: 1 }, flags: [nursed_the_old_village] }
      failure:
        text: |
          วันที่หก เข่าทั้งสองข้างของ{name}บวมจนงอไม่ได้ ต้องนอนบนแคร่หน้าบ้านหลังแรก บอกงานให้ลูกมือทำทีละอย่างจากตรงนั้น ลูกมือทำได้ครึ่งหนึ่งของที่บอก เพราะมีมือคู่เดียว

          คนแก่ห้าคนรอดสี่ คนที่ห้าเป็นตายายเจ้าของยุ้งแรก {name}สวดส่งตาจากบนแคร่ ไม่ได้ลุกขึ้นยืน
        effects: { hp: -2, flags: [lost_one_to_the_old_rice] }
    - id: write_to_their_children
      label: เดินถามชื่อลูกหลานทุกบ้าน แล้วเขียนจดหมายส่งไปเมืองปลายราง
      text: |
        {name}จดชื่อลูกหลานสิบเก้าคนกับชื่อโรงงานที่คนแก่จำได้ บางคนจำได้แค่ว่าลูกไปทำงานที่มีปล่องไฟสูง {name}เขียนจดหมายสิบเก้าฉบับในคืนเดียว ฉบับละสามบรรทัด บอกว่าข้าวในยุ้งขึ้นรา พ่อแม่ไข้ขึ้น ให้กลับมาตากข้าว

        ลูกชายสองคนกับลูกสาวหนึ่งคนลงรถไฟมาในสัปดาห์ต่อมา ยกข้าวออกตากทั้งหมู่บ้านในวันเดียว ไข้ลงในสิบวัน ลูกสาวคนนั้นไม่กลับไปเมืองปลายรางอีก ฉบับที่เหลือไม่มีใครตอบ
      effects: { alignment: { law: 1 }, flags: [wrote_to_the_rail_children] }
    - id: take_the_hammer
      label: ดึงค้อนออกจากมือลูกมือ
      requires: { flag: broke_the_boards }
      text: |
        {name}เคยงัดแผ่นไม้ออกจากบ้านคนไข้มาแล้วครั้งหนึ่ง ตั้งแต่ยังหนุ่มสาว รู้ว่าแผ่นไม้ตอกง่ายกว่างัดออกสิบเท่า {name}ดึงค้อนออกจากมือลูกมือ แล้วเดินเอาไปคืนบ้านข้างๆ เอง

        คืนนั้นลูกมือนั่งฟัง{name}เล่าเรื่องหมู่บ้านที่เจ็ด เด็กที่เคาะแผ่นไม้จากข้างใน คนที่รอดออกมาจากบ้านที่ตอกแล้ว เช้ามาเขาลอกหน้าตำราที่สั่งให้ตอกแผ่นไม้ลงสมุดของตัวเอง แล้วเขียนเรื่องหมู่บ้านที่เจ็ดต่อท้าย ยาวกว่าหน้าเดิมสามเท่า
      effects: { alignment: { moral: 1 }, flags: [took_the_hammer_away] }

- id: adult.career_roadhealer_havin
  stage: adult
  scene: road
  weight: 45
  when:
    age: [49, 56]
    flags: [job_road_healer]
  text: |
    ปีนี้วิหารให้{name}เดินสายเป็นพี่เลี้ยงของฮาวิน ลูกมือที่เพิ่งได้เส้นทางของตัวเอง ฮาวินจำบ่อน้ำได้ครบทุกบ่อ จำชื่อหมาที่กัดได้ทุกตัว เดินเร็วกว่า{name}เท่าตัว จึงมักเดินนำไปถึงหมู่บ้านถัดไปก่อนครึ่งวัน

    ที่หมู่บ้านที่เก้า เด็กชายห้าขวบไอ ตัวร้อน ฮาวินดูแล้วบอกว่าเป็นไข้หวัดหน้าฝน ทิ้งยาต้มไว้หนึ่งห่อ แล้วเดินต่อไปหมู่บ้านที่สิบให้ทันก่อนมืด เพราะหมู่บ้านที่สิบนัดไว้ และจ่ายเป็นไข่ {name}ตามมาถึงหมู่บ้านที่เก้าตอนสาง เด็กคนนั้นตายตอนตีสาม

    แม่ของเด็กไม่ร้องเสียงดัง นางยืนขวางประตูรั้วหมู่บ้าน บอกว่าตั้งแต่นี้ไปไม่มีนักบวชเดินสายคนไหนต้องเข้าหมู่บ้านนี้อีก ผู้ใหญ่บ้านยืนข้างนาง ฮาวินเดินย้อนกลับมาถึงตอนสาย นั่งลงนอกรั้ว ยังไม่ได้กินอะไรตั้งแต่เมื่อวาน วิหารใหญ่จะขอรายงานเรื่องนี้ภายในฤดู
  choices:
    - id: say_it_was_your_order
      label: บอกแม่ของเด็กกับวิหารว่า{name}เป็นคนสั่งให้ฮาวินเดินต่อ
      text: |
        {name}พูดกับแม่ของเด็กตรงประตูรั้ว พูดประโยคเดียว แล้วเขียนรายงานถึงวิหารใหญ่ประโยคเดียวกัน นางไม่ตอบ ปิดประตูรั้ว ฮาวินลุกขึ้นจะพูด {name}จับแขนเขาไว้

        วิหารใหญ่ตัดชื่อ{name}ออกจากรายชื่อพี่เลี้ยง ฮาวินได้เดินเส้นทางต่อ ทุกรอบที่ผ่านหมู่บ้านที่เก้า เขาหยุดวางห่อยาไว้หน้าประตูรั้วที่ปิดอยู่ แล้วเดินต่อไปช้าๆ ไม่เคยรีบอีก
      effects: { alignment: { moral: 1, law: -1 }, flags: [took_havins_choice] }
    - id: report_it_true
      label: เขียนรายงานตามจริงว่าใครเดินต่อ และทำไม
      text: |
        {name}เขียนครึ่งหน้า ไข้หวัดหน้าฝน ยาต้มหนึ่งห่อ หมู่บ้านที่สิบนัดไว้ ไม่ตัด ไม่เติม ส่งไปวิหารใหญ่ด้วยลายมือที่ตั้งใจให้อ่านง่าย

        วิหารใหญ่เรียกฮาวินกลับไปประจำวิหารในเมือง ไม่ได้เดินสายอีก เส้นทางของเขากลับมาเป็นของ{name}อีกสองปี ทุกครั้งที่ผ่านหมู่บ้านที่เก้า ประตูรั้วยังปิด {name}นั่งพักนอกรั้วครู่หนึ่งก่อนเดินต่อ ทุกครั้ง
      effects: { alignment: { law: 1 }, flags: [reported_havin] }
    - id: walk_him_in
      label: พาฮาวินเดินเข้าไปยืนต่อหน้าแม่ของเด็ก
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}ไม่ได้ขอให้นางเปิดรั้ว ขอแค่ให้นางฟังฮาวินพูดจนจบ ฮาวินพูดตะกุกตะกัก เล่าทุกอย่างตั้งแต่ได้ยินเสียงไอครั้งแรก ไม่แก้ตัวสักประโยค แม่ของเด็กฟังจนจบ แล้วเปิดรั้ว ให้เขาเข้าไปช่วยขุดหลุม

          ฮาวินขุดคนเดียวจนเสร็จ {name}สวดส่งเด็กข้างหลุม ตอนออกจากหมู่บ้านแม่ของเด็กบอกว่าปีหน้าให้มา แต่ให้คนนั้นมาคนเดียว ไม่ต้องมีพี่เลี้ยง
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, people: [{ id: havin, name: ฮาวิน, gender: m, bond: friend, closeness: 2, age: 23 }], flags: [walked_havin_back_in] }
      failure:
        text: |
          ฮาวินเดินเข้าไปถึงประตูรั้วได้สามก้าว ก้อนดินก้อนแรกมาจากหลังบ้านหลังหนึ่ง ก้อนที่สองโดนขมับ{name}ที่ยืนบังฮาวินไว้ ผู้ใหญ่บ้านไม่ห้าม

          {name}กับฮาวินเดินออกจากหมู่บ้านที่เก้าด้วยกัน ฮาวินพยุง{name}ไปทั้งทางจนถึงหมู่บ้านที่สิบ ขมับเย็บสามเข็ม ฮาวินเป็นคนเย็บ
        effects: { hp: -2, flags: [stoned_at_village_nine] }
    - id: winter_in_village_seven
      label: ส่งฮาวินไปอยู่หมู่บ้านที่เจ็ดหนึ่งหนาว
      requires: { flag: village_seven_staff }
      text: |
        คนหมู่บ้านที่เจ็ดรู้ว่าบ้านที่ตอกแผ่นไม้ปิดตายแล้วเปิดออกมามีหน้าตาอย่างไร รู้ว่าคนที่ทำผิดต่อหมู่บ้านแล้วอยู่ต่อได้ต้องทำอะไร {name}เขียนจดหมายถึงผู้ใหญ่บ้านหนึ่งฉบับ ให้ฮาวินถือไปเอง

        ฮาวินอยู่หมู่บ้านที่เจ็ดทั้งหนาว ตักน้ำ ผ่าฟืน ป้อนน้ำข้าวคนไข้ทุกบ้าน ไม่ได้เป็นนักบวช เป็นคนงาน ต้นฝนเขากลับมาเดินสาย ถือไม้เท้าไม้เนื้อแข็งอันใหม่ หัวไม้แกะเป็นรูปรั้วหมู่บ้าน ประตูเปิดอยู่ครึ่งบาน
      effects: { alignment: { moral: 1 }, flags: [havin_wintered_in_village_seven] }

- id: adult.career_roadhealer_last_round
  stage: adult
  scene: road
  weight: 45
  mark: เดินสายรอบสุดท้าย
  when:
    age: [57, 64]
    flags: [job_road_healer]
  text: |
    วิหารใหญ่ส่งจดหมายมาสั้นๆ รอบนี้เป็นรอบสุดท้ายของ{name} เส้นทางจะส่งต่อให้ลูกมือรุ่นใหม่ จดหมายไม่ได้บอกว่าหลังจากนั้นให้{name}ไปทำอะไร เขียนแค่ว่าวิหารในเมืองมีห้องให้เสมอ

    รอบสุดท้ายใช้เวลานานกว่าทุกรอบเกือบเท่าตัว ทุกหมู่บ้านรู้ข่าวก่อน{name}จะไปถึง บางหมู่บ้านทำข้าวต้มไว้รอ บางหมู่บ้านเอาเด็กที่{name}เคยทำคลอดมายืนเรียงให้ดูว่าโตแค่ไหนแล้ว หมู่บ้านหนึ่งให้ไข่มาสิบสองฟอง {name}กินไม่หมด ต้องแจกต่อไปตามทาง

    หมู่บ้านสุดท้ายอยู่ริมรางเหล็ก รถไฟขาเข้าเมืองจอดตอนบ่าย {name}นั่งรอบนม้านั่งไม้ข้างราง ไม้เท้าพาดเข่า
  choices:
    - id: stay_in_village_seven
      label: ไม่ขึ้นรถไฟ เดินย้อนกลับไปหมู่บ้านที่เจ็ด
      requires: { flag: village_seven_staff }
      text: |
        เด็กที่เคยเคาะแผ่นไม้จากในบ้านหลังนั้น ตอนนี้มีลูกสามคนแล้ว เขาไม่ถามว่า{name}กลับมาทำไม ให้คนในหมู่บ้านช่วยกันซ่อมบ้านหลังที่เคยตอกแผ่นไม้ปิด หลังที่ไม่มีใครอยู่มาหลายปี ซ่อมเสร็จในสามวัน

        {name}อยู่บ้านหลังนั้น ห้องเดียวกับที่เด็กคนนั้นเคยนั่งเคาะ รอยตะปูยังอยู่ที่วงกบประตูครบทุกรู ไม่มีใครอุด คนไข้ในหมู่บ้านเดินมาหาเองถึงบ้าน ไม่ต้องให้นักบวชเดินไปหาอีก
      effects: { location_tag: arvel_village, flags: [retired, settled_in_village_seven] }
    - id: keep_walking
      label: เขียนจดหมายตอบวิหารว่ายังเดินไหว แล้วเดินรอบต่อไป
      text: |
        วิหารใหญ่ไม่ตอบ ไม่ตอบแปลว่าไม่ห้าม {name}เดินรอบต่อไปช้ากว่าเดิม หมู่บ้านละสองคืนแทนคืนเดียว ลูกมือรุ่นใหม่เดินด้วยครึ่งทาง แล้วแยกไปเดินอีกครึ่งเส้นเอง สองคนพบกันที่หมู่บ้านกลางทางทุกต้นเดือน

        เข่าทั้งสองข้างบวมทุกเย็น ทุกหมู่บ้านมีคนเอาน้ำอุ่นมาให้แช่ก่อนจะบอกว่าใครป่วย
      effects: { hp: -1, stats: { CON: 1 }, flags: [still_working, kept_walking_the_route] }
    - id: back_to_the_temple
      label: ขึ้นรถไฟเข้าเมือง ไปห้องที่วิหารเตรียมไว้
      text: |
        ห้องในวิหารอยู่ชั้นล่าง หน้าต่างหันไปทางลานซักผ้า มีเตียงไม้กับหีบไม้หนึ่งใบ {name}เอาไม้เท้าพิงไว้ข้างประตู ทุกเช้ายังตื่นก่อนไก่ขัน แต่งตัวเสร็จแล้วถึงนึกได้ว่าไม่มีหมู่บ้านให้ไป

        เดือนที่สอง ลูกมือรุ่นใหม่ส่งจดหมายจากเส้นทางมาถามว่าบ่อน้ำหมู่บ้านที่หกยังกินได้ไหม {name}ตอบยาวสามหน้า ตั้งแต่นั้นมีจดหมายจากเส้นทางมาทุกเดือน {name}ตอบทุกฉบับในวันเดียวกับที่ได้รับ
      effects: { hp: 2, flags: [retired, returned_to_the_city_temple] }
    - id: ride_the_rail
      label: ขึ้นรถไฟ แต่ไม่ลงที่เมือง นั่งไปรักษาคนตามสถานีแทนเดิน
      text: |
        รางเหล็กวิ่งผ่านหมู่บ้านเก่าบนเส้นทางของ{name}ครึ่งหนึ่ง และผ่านเมืองปลายรางที่คนหนุ่มสาวจากหมู่บ้านไปอยู่ {name}ขึ้นตู้ไม้แข็งชั้นถูกที่สุด ลงทุกสถานีที่มีคนรอ ขึ้นขบวนถัดไปเมื่อรักษาเสร็จ

        นายสถานีสายนั้นเลิกเก็บค่าตั๋วนักบวชคนนี้ในเดือนที่สอง คนขับรถไฟจะเปิดหวูดสองครั้งก่อนจอดสถานีที่มีคนป่วยรอ ให้{name}เตรียมย่ามไว้ก่อน
      effects: { stats: { WIS: 1 }, mark: หมอบนรางเหล็ก, flags: [still_working, healed_along_the_rail] }

# ---------- นักบวชประจำป้อม ----------
- id: adult.career_fortpriest_coal_wound
  stage: adult
  scene: fort
  weight: 45
  when:
    age: [41, 48]
    flags: [job_fort_priest]
  text: |
    หนาวนี้{name}เริ่มไอทุกเช้า ไม่มาก ผ้าเช็ดปากมีจุดสีเทาสองสามจุด หมอของภาคีฟังอกแล้วพูดประโยคเดียวกับที่พูดกับผู้เฝ้าทุกคนที่อยู่ป้อมมานาน ปอดของคนที่หายใจเถ้าทุกวันจะแข็งทีละน้อย ไม่มีใครรู้ว่าเร็วแค่ไหน

    บ่ายวันเดียวกัน ผู้เฝ้ากะดึกหามซิดาลงมาจากแนวหิน ผู้เฝ้าอายุยี่สิบ หมาเถ้าฝังเขี้ยวเข้าต้นขาซ้ายของนางก่อนนางจะแทงมันแตก แผลไม่มีเลือด ขอบแผลดำเหมือนไม้ไหม้ กลิ่นถ่านลอยขึ้นมาทุกครั้งที่นางหายใจออก เนื้อรอบแผลอุ่นเท่าเตา และอุ่นกว้างขึ้นหนึ่งนิ้วทุกชั่วยาม

    หมอของภาคีวางเลื่อยไว้บนผ้าข้างเตียง จะตัดเหนือเข่า ก่อนความอุ่นจะขึ้นไปถึงสะโพก ซิดาจับข้อมือ{name}ไว้แน่น ขอให้สวดก่อน ขอให้ลองอย่างอื่นก่อน
  choices:
    - id: pray_over_it
      label: วางมือสองข้างบนแผล สวดขอให้{god}ดึงความร้อนออก
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}สวดบทรักษาบทยาวที่สุดที่รู้ มือวางบนเนื้ออุ่นรอบแผล ความร้อนไหลขึ้นมาตามฝ่ามือ ผ่านข้อมือ ขึ้นถึงศอก แล้วหยุดอยู่ตรงนั้น ไม่ขึ้นต่อ {name}ไอออกมาเป็นเถ้าหนึ่งครั้งกลางบทสวด แล้วสวดต่อจนจบ

          ขอบแผลดำของซิดาซีดลงเป็นสีแดงคล้ำก่อนสาง กลิ่นถ่านหาย หมอของภาคีเก็บเลื่อยเข้ากล่อง ซิดาเดินได้อีกครั้งในเดือนที่สอง ขาซ้ายลากนิดหน่อยเวลาขึ้นบันได ฝ่ามือของ{name}พองไปทั้งสองข้างอยู่หลายวัน
        effects: { hp: -1, stats: { WIS: 1 }, world: { gods: 1 }, flags: [prayed_the_coal_out] }
      failure:
        text: |
          ความร้อนไหลขึ้นมาตามฝ่ามือของ{name}จริง แต่ไหลกลับลงไปทุกครั้งที่{name}ไอ บทสวดขาดเป็นช่วงๆ ตามลมหายใจ ความอุ่นรอบแผลกว้างขึ้นอีกสองนิ้วระหว่างนั้น

          หมอของภาคีหยิบเลื่อยขึ้นตอนเที่ยงคืน {name}จับไหล่ซิดาไว้จนเสร็จ ฝ่ามือทั้งสองข้างพองจนจับอะไรไม่ได้ไปครึ่งเดือน ซิดารอด ขาซ้ายเหลือถึงเหนือเข่าหนึ่งฝ่ามือ
        effects: { hp: -2, flags: [coal_burned_your_hands] }
    - id: cut_the_warm_flesh
      label: เผามีด ตัดแต่เนื้อที่อุ่นออก แบบที่นักบวชป้อมรุ่นก่อนทำ
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          สมุดของนักบวชป้อมรุ่นก่อนที่เก็บไว้ในห้องสวดเขียนไว้ว่าความร้อนของหมาเถ้าอยู่ในเนื้อ ไม่ได้อยู่ในเลือด ตัดเนื้อที่อุ่นออกให้หมด ขาก็ยังอยู่ {name}ไล่ปลายนิ้วหาขอบความอุ่นทีละนิ้ว แล้วตัดตามขอบนั้น ลึกกว่าที่หมอของภาคีกล้าตัด ตื้นกว่าที่เลื่อยจะตัด

          ซิดาเสียเนื้อต้นขาไปเท่าฝ่ามือสองข้าง เหลือแผลเป็นบุ๋มลึก เดินได้ในเดือนที่สาม หมอของภาคีขอยืมสมุดเล่มนั้นไปคัดก่อนหนาวหมด
        effects: { stats: { DEX: 1 }, reputation: { wardens: 1 }, flags: [cut_the_coal_from_sida] }
      failure:
        text: |
          เนื้อที่อุ่นลึกกว่าที่ปลายนิ้วของ{name}บอก มีดลงไปถึงชั้นที่ร้อนจนด้ามมีดร้อนตามขึ้นมาในมือ {name}ปล่อยมีด มือขวาไหม้เป็นแนวตามด้าม

          หมอของภาคีหยิบเลื่อยขึ้นก่อนเที่ยงคืน ซิดารอด ขาซ้ายเหลือถึงเหนือเข่า {name}พันมือขวาไว้ทั้งเดือน สวดด้วยมือซ้ายข้างเดียว
        effects: { hp: -2, flags: [held_sida_for_the_saw] }
    - id: hold_her_for_the_saw
      label: จับไหล่ซิดาไว้ ให้หมอตัดตามที่หมอบอก
      text: |
        {name}นั่งหัวเตียง เอาไหล่ของซิดาพิงอกตัวเอง สวดบทสั้นที่ใช้ตอนคนเจ็บกลัว ซ้ำไปจนหมอวางเลื่อยลง ซิดากัดผ้าพันคอของ{name}จนขาดเป็นสองท่อน

        ซิดารอด ไข้ลงในสามวัน ต้นหนาวนางขึ้นไปนั่งหอเวรกับไม้ค้ำสองอัน ไม่ได้ถือหอกแล้ว นางถือสมุดเวร จดว่าจุดแดงขึ้นกี่จุด ตรงไหน ลายมือของนางสวยกว่าเสมียนป้อม
      effects: { alignment: { law: 1 }, reputation: { wardens: 1 }, flags: [held_sida_for_the_saw] }
    - id: draw_the_heat_again
      label: วางมือแบบที่เคยวางบนแผลของรอสเวน
      requires: { flag: healed_rosven }
      text: |
        กลิ่นถ่านแบบนี้{name}ได้กลิ่นมาครั้งหนึ่ง จากแผลของรอสเวนในห้องพยาบาลป้อมสามเมื่อนานมาแล้ว มือจำได้ก่อนหัว จำได้ว่าความร้อนไม่ได้หายไปไหน แต่ไหลขึ้นแขนคนสวด และต้องยอมให้มันไหลจนสุด ห้ามดึงมือออกกลางทาง

        {name}ไม่ดึงมือออก ความร้อนขึ้นถึงไหล่ ฝ่ามือพองทั้งสองข้าง แผลของซิดาซีดลงก่อนเที่ยงคืน หมอของภาคีเก็บเลื่อยโดยไม่ต้องมีใครบอก ซิดาถามว่าแผลแบบนี้มีคนรอดมาก่อนไหม {name}บอกชื่อรอสเวนให้นางฟัง
      effects: { hp: -1, world: { gods: 1 }, flags: [drew_the_heat_again] }

- id: adult.career_fortpriest_tin_boxes
  stage: adult
  scene: fort
  weight: 45
  when:
    age: [49, 56]
    flags: [job_fort_priest]
  text: |
    ผู้เฝ้าที่ตายบนแนวหินเผาในเตาหลอมของป้อม เถ้าใส่กล่องดีบุกใบเท่าฝ่ามือ ส่งกลับบ้านทางขบวนถ่าน บรานิค นักบวชหนุ่มที่ภาคีส่งมาเป็นผู้ช่วย{name}เมื่อสองหนาวก่อน เป็นคนเขียนชื่อบนฝากล่อง เขาเขียนสวย และไม่เคยเขียนผิด

    เดือนก่อน ผู้เฝ้าสองคนตายในคืนเดียวกัน บรานิคเขียนชื่อสลับฝา แม่ของคนหนึ่งเปิดกล่องที่บ้าน เจอแหวนเหล็กวงเล็กปนอยู่ในเถ้า ลูกชายนางไม่เคยใส่แหวน ผู้เฝ้าอีกคนใส่แหวนของพ่อติดนิ้วมาตั้งแต่วันแรกที่ขึ้นป้อม นางนั่งขบวนถ่านเที่ยวเปล่าขึ้นมาถึงป้อมสามพร้อมกล่องในอ้อมแขน

    กล่องอีกใบไปถึงอีกครอบครัวหนึ่งที่อยู่ห่างออกไปสามวันทางเกวียน ฝังไปแล้ว บรานิคยืนอยู่ข้างหลัง{name} ถือสมุดรายชื่อคนตายไว้กับอก แม่คนนั้นถามว่าลูกชายนางอยู่ที่ไหน
  choices:
    - id: tell_both_mothers
      label: บอกนางตามจริง แล้วเขียนจดหมายถึงอีกครอบครัวในคืนเดียวกัน
      text: |
        {name}บอกนางทุกอย่าง ตั้งแต่คืนที่สองคนตาย จนถึงมือที่เขียนฝากล่อง ไม่ได้บอกชื่อบรานิค นางฟังจนจบ แล้วขอให้{name}เขียนจดหมายถึงอีกครอบครัวต่อหน้านาง นางจะถือไปเอง

        สามวันต่อมานางนั่งเกวียนไปถึงบ้านอีกครอบครัวหนึ่ง สองแม่ขุดหลุมเดิมขึ้นมาด้วยกัน แลกกล่องกัน แล้วฝังใหม่ทั้งสองหลุม ข่าวมาถึงป้อมสามด้วยจดหมายที่สองแม่ลงชื่อร่วมกัน บรานิคเขียนฝากล่องทุกใบหลังจากนั้นช้าลงครึ่งหนึ่ง อ่านออกเสียงทุกชื่อก่อนวางปากกา
      effects: { alignment: { law: 1, moral: 1 }, flags: [told_both_mothers_of_the_boxes] }
    - id: say_the_ring_was_a_gift
      label: บอกนางว่าแหวนวงนั้นเพื่อนของลูกชายให้ไว้ก่อนตาย
      habit: cold_blood
      text: |
        {name}บอกว่าสองคนนั้นตายข้างกัน เป็นเพื่อนกัน แหวนวงนั้นคนหนึ่งให้อีกคนไว้ก่อนสิ้นใจ ฟังดูเป็นเรื่องที่ผู้เฝ้าทำกัน และนางอยากให้มันจริง นางกอดกล่องกลับลงเขาไปพร้อมเรื่องนั้น

        บรานิคไม่ได้เถียงต่อหน้านาง คืนนั้นเขามายืนหน้าห้องของ{name} ถามว่าในบทสวดส่งวิญญาณมีบทไหนสำหรับคนที่ถูกฝังผิดหลุม {name}บอกว่าไม่มี เขาเขียนขึ้นเองหนึ่งบท ไม่ได้ให้ใครดู
      effects: { alignment: { moral: -1 }, flags: [kept_the_boxes_as_they_were] }
    - id: ride_to_swap
      label: ขึ้นเกวียนไปกับนางสามวัน ไปแลกกล่องกับอีกครอบครัวเอง
      check: { stat: CON, dc: 14 }
      success:
        text: |
          สามวันบนเกวียนเปิดหลังคา ฝุ่นเถ้าตลอดทาง {name}ไอทุกชั่วยาม แม่คนนั้นเอาผ้าพันคอของนางมาพันจมูกให้{name} พันแบบที่พันให้ลูกชายตอนเด็ก ถึงบ้านอีกครอบครัวตอนบ่ายวันที่สาม {name}เล่าทุกอย่างให้คนในบ้านฟังจนจบก่อนจะขอให้ขุด

          สองหลุมได้กล่องที่ถูกต้องก่อนตะวันตก {name}สวดส่งวิญญาณใหม่ทั้งสองหลุม ขากลับนั่งเกวียนคนเดียว ไอน้อยกว่าขาไป บรานิคยืนรอที่ประตูป้อม ถือสมุดรายชื่อไว้เหมือนวันที่{name}ออกไป
        effects: { stats: { CON: 1 }, alignment: { moral: 1 }, reputation: { wardens: 1 }, flags: [swapped_the_tin_boxes] }
      failure:
        text: |
          วันที่สองบนเกวียน{name}ไอจนหายใจไม่ทัน แม่คนนั้นต้องให้คนขับเกวียนจอดกลางทาง พา{name}ลงนอนใต้ร่มเกวียนจนพ้นเที่ยง ไปต่อไม่ได้ นางไปต่อคนเดียวพร้อมจดหมายที่{name}เขียนบนเข่าตอนนั้น

          {name}นั่งเกวียนเที่ยวกลับขึ้นป้อมพร้อมไข้ บรานิคเฝ้าเตียงสามคืน เดือนต่อมามีจดหมายจากแม่สองคนนั้นมาถึง ลายมือคนละคน บอกว่าแลกกล่องกันแล้ว
        effects: { hp: -2, flags: [lungs_failed_on_the_cart] }
    - id: the_letters_tell_them_apart
      label: เปิดสำเนาจดหมายที่เขียนถึงบ้านของทั้งสองคน
      requires: { flag: wrote_for_every_dead }
      text: |
        ทุกคนที่ตายบนแนวหินของป้อมสามได้จดหมายหนึ่งฉบับถึงบ้าน ลายมือของ{name} {name}เก็บสำเนาไว้ทุกฉบับ จดหมายถึงบ้านของผู้เฝ้าอีกคนเขียนไว้ว่าคืนสุดท้ายเขาถอดแหวนของพ่อมาเช็ดเถ้าออกก่อนขึ้นกะ แล้วใส่กลับ ไม่ยอมฝากใคร

        {name}อ่านบรรทัดนั้นให้แม่คนนั้นฟัง นางร้องไห้เป็นครั้งแรกตั้งแต่ขึ้นมาถึงป้อม ไม่ใช่เพราะลูกชายตัวเอง แต่เพราะแม่อีกคนที่ไม่รู้ว่าแหวนของสามีอยู่ผิดที่ นางขอสำเนาจดหมายฉบับนั้นไปด้วย สามวันต่อมาสองครอบครัวแลกกล่องกัน แหวนกลับไปอยู่ในกล่องที่ถูก
      effects: { alignment: { moral: 1 }, reputation: { wardens: 1 }, flags: [the_letters_swapped_the_boxes] }

- id: adult.career_fortpriest_last_winter
  stage: adult
  scene: fort
  weight: 45
  mark: นักบวชป้อมวางมือ
  when:
    age: [57, 64]
    flags: [job_fort_priest]
  text: |
    ทุกเช้า{name}ไอเป็นเถ้าจนต้องนั่งพักบนขอบเตียงก่อนลุก บันไดหอเวรยี่สิบสองขั้นใช้เวลาเท่าสวดบทส่งวิญญาณจบหนึ่งบท หมอของภาคีไม่ฟังอกของ{name}แล้ว บอกว่าฟังไปก็ได้ยินเหมือนเดิม

    ภาคีส่งนักบวชหนุ่มคนใหม่มาประจำป้อมสาม เขามาถึงพร้อมย่ามหนังสือสวดเต็มบ่า ถามว่าให้เขานอนที่ไหน ป้อมสามมีเตียงนักบวชเตียงเดียว

    {name}จำชื่อทุกคนที่สวดส่งในป้อมนี้ได้ จำได้ว่าใครชอบนอนหันหน้าไปทางไหน คืนนี้ไม่มีใครตาย เป็นคืนแรกในรอบเดือน
  choices:
    - id: down_to_the_fields
      label: ยกเตียงให้นักบวชหนุ่ม แล้วลงเขาไปหมู่บ้านริมทุ่งอีเซล
      text: |
        หมู่บ้านริมทุ่งอีเซลส่งลูกชายขึ้นป้อมสามมาหลายรุ่น หลายบ้านเคยได้จดหมายหรือกล่องดีบุกจากมือ{name} ผู้ใหญ่บ้านให้{name}อยู่บ้านไม้หลังเล็กข้างลานนวดข้าว อากาศที่นั่นไม่มีเถ้า

        ไอของ{name}เบาลงในหน้าฝนแรก ไม่หาย ทุกต้นหนาวมีแม่หนึ่งคนสองคนเดินมาเคาะประตูบ้าน ถามว่าป้อมสามเป็นอย่างไร ลูกชายนอนเตียงไหน {name}ตอบได้ทุกครั้ง
      effects: { hp: 2, clear_flags: [job_fort_priest], location_tag: arvel_village, flags: [retired, left_the_fort, went_down_to_the_isel_fields] }
    - id: hut_below_the_fort
      label: ลงไปอยู่กระท่อมใต้แนวป้อม ห่างพอไม่ต้องขึ้นบันได ใกล้พอได้ยินระฆัง
      text: |
        กระท่อมดินหลังนั้นเคยเป็นที่พักคนเลี้ยงแพะ หลังคาต่ำจน{name}ต้องก้มทุกครั้งที่เข้า นักบวชหนุ่มลงมาหาทุกเย็นวันพัก ถามเรื่องบทสวด เรื่องแม่ที่ขึ้นมารับศพก่อนข่าวไปถึง เรื่องผู้เฝ้าที่ไม่ยอมให้สวดส่ง

        ทุกครั้งที่ระฆังป้อมสามตีชุดยาว {name}จุดเทียนหนึ่งเล่มที่หน้าต่าง แล้วสวดบทส่งวิญญาณจบหนึ่งบท ก่อนนักบวชหนุ่มบนป้อมจะสวดจบ
      effects: { clear_flags: [job_fort_priest], location_tag: ashland, flags: [retired, left_the_fort, kept_a_hut_below_the_fort] }
    - id: stay_to_the_end
      label: ปูเสื่อนอนห้องสวดให้นักบวชหนุ่มได้เตียง แล้วอยู่ต่อ
      text: |
        ห้องสวดเย็นกว่าห้องนอน {name}ปูเสื่อสองชั้นข้างแท่นของ{god} สอนนักบวชหนุ่มทุกอย่างที่ไม่มีในหนังสือ จดหมายถึงบ้านต้องเขียนอย่างไร กล่องดีบุกต้องอ่านชื่อออกเสียงก่อนปิดฝา แม่ที่ขึ้นมารับศพต้องให้นั่งก่อนพูด

        หนาวนั้นมีผู้เฝ้าตายสี่คน นักบวชหนุ่มสวดส่งสามคน คนที่สี่เป็นผู้เฝ้าแก่ที่ขอให้{name}สวดให้ {name}สวดนั่ง ไม่ยืน เพราะยืนไม่ไหว ไม่มีใครในห้องสังเกตว่าคนสวดนั่งหรือยืน
      effects: { stats: { WIS: 1 }, mark: นักบวชป้อมสามจนวันสุดท้าย, flags: [still_working, stayed_as_fort_priest] }
    - id: last_shift_with_the_lantern
      label: ถือตะเกียงของการ์เวนขึ้นยืนกะดึกคืนสุดท้าย แล้วลงจากป้อมพร้อมตะเกียง
      requires: { flag: stood_garvens_shift }
      text: |
        ตะเกียงเหล็กดำบุบสามรอยยังจุดติดในครั้งเดียว ด้ามหนังสึกจนเห็นเหล็กข้างใต้สองจุด {name}ยืนบนแนวหินทั้งคืน ไม่ได้ยืนนิ่ง นั่งพักบนก้อนหินสามครั้ง แต่ตะเกียงไม่เคยต่ำกว่าระดับไหล่ จุดแดงหลังแนวหินขึ้นมาสองจุด แล้วจมหายไปเองก่อนเที่ยงคืน

        ตอนสาง{name}ลงบันไดหอเวรทีละขั้น นักบวชหนุ่มรออยู่ที่ขั้นล่างสุด {name}ไม่ได้ส่งตะเกียงให้เขา เขาไม่ได้ขอ บ่ายวันนั้น{name}ขึ้นขบวนถ่านเที่ยวเปล่าลงเขา ตะเกียงวางบนตัก ยังอุ่น
      effects: { clear_flags: [job_fort_priest], flags: [retired, left_the_fort, last_shift_with_garvens_lantern] }
