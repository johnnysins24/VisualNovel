# ชุด อ ชีวิตที่โดนตามล่า ไฟล์ ก (11 เรื่อง): ศาสนจักรตะเกียง 5 · ผู้ฟังดาว 4 · ลัทธิเถ้า 2
# ศาสนจักรตะเกียง: oil_cart_at_night (เห็นหน่วยไส้ตะเกียงทำงาน ลืม ตาม เดินหน้า หรือวิ่ง lamp_church +1)
#   · five_year_questions (ทีฟลิ่งในหน้าผู้ต้องตรา อายุ 25 ขึ้นไป ไม่ทับ adult.lamp_five_year ที่ 19 ถึง 24 · กัน origin_marked_hidden กับ horns_sawn ที่ไม่มีชื่อในหน้านั้น)
#   · name_on_the_list (ตามล่า ข้อความไม่บอกเหตุ เหตุอยู่หลัง requires) · witch_hunter_at_the_ford (ปะทะ เกิดซ้ำ เจรจา lamp_church −1)
#   · lamp_way_down (ทางลง −1 หรือ −2)
# ผู้ฟังดาว: chalk_star_offer (คนมีตราในเวนทราส) · white_gloves_at_tea (ตามล่า) · listener_at_the_bathhouse (ปะทะ ไม่ถึงตาย เกิดซ้ำ
#   ข้อความพลาดทุกข้อเป็นเรื่องกาย ไม่ใช้ประโยคเสียงหึ่งของศัตรู เพราะคนมีตราไม่ได้ยินฟ้า) · listeners_way_down (ทางลง)
# ลัทธิเถ้า: two_coals (ตามล่า ถ่านสองก้อนคือหนี ตามธรรมเนียมในไฟล์ ash_cult) · ash_cultist_at_the_door (ปะทะ เกิดซ้ำ ชนะหรือเจรจา ash_cult −1)
# คนที่มีแต่ในข้อความ: โฮเบล เสมียนทะเบียนวิหารที่รับเงิน · แม่ชีคลาเวีย แม่ชีอีเซลที่ซ่อนคนไว้ในโรงซักผ้า · หญิงช่างทองแดงหัวถนนที่หูดับข้างหนึ่ง
#   ออสริค ไซเวล ทอร์เบน ของหน่วยไส้ตะเกียงโผล่ใน oil_cart_at_night ตามไฟล์ wick_a
# ทางถอดคำสาปตะเกียงดับ (curse_lamp_out) ที่ไฟล์ wick_b ให้: lamp_way_down ตัวเลือกจุดตะเกียงให้คนหลงทางร้อยคืน

# ---------- ศาสนจักรตะเกียง ----------
- id: adult.hunted_oil_cart_at_night
  stage: adult
  scene: road
  weight: 5
  time: night
  when:
    age: [20, 64]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    not_flags: [left_the_wick, broke_the_wick_vow]
  text: |
    ตรอกหลังโรงย้อมผ้าเป็นทางลัดที่{name}ใช้กลับบ้านมาหลายปี น้ำย้อมสีครามไหลเป็นร่องกลางตรอกทุกคืน มีแต่กลิ่นน้ำย้อมกับเสียงหนูวิ่งบนหลังคา คืนนี้มีเกวียนเล่มหนึ่งจอดขวางกลางทาง ล่อที่เทียมเกวียนพันกีบด้วยผ้ากระสอบทั้งสี่ข้าง ถังน้ำมันบนเกวียนมีรอยชอล์กเป็นรูปประตูปิด หน้าต่างชั้นสองของบ้านหลังหนึ่งมีแสงแดงคล้ำลอดร่องบานเกล็ดออกมา กลิ่นน้ำตาลไหม้ลอยลงมาถึงตรอก หวานจนคอแห้ง

    ประตูบ้านหลังนั้นเปิด สองคนหามหีบสีเทาหม่นออกมาใบหนึ่ง หีบเล็กแค่พอวางบนตัก แต่สองคนนั้นก้าวช้าแบบคนหามโลงศพ คนที่สามเป็นหญิงชราพันแถบผ้ารอบข้อมือหลายสิบรอบ นางเห็น{name}ก่อนใคร ไม่ร้อง ไม่เรียกใคร เดินมาแตะข้อศอก{name}เบาๆ แบบที่แม่ค้าแตะคนยืนขวางประตูตลาด แล้วพาไปหยุดที่ท้ายเกวียน

    ชายที่ยืนท้ายเกวียนหันหูขวาเข้าหา{name} หูซ้ายไม่หันมาเลย เขาพูดเสียงเรียบเท่ากันทุกคำ คนนอกที่เห็นงานคืนนี้มีสองทาง ทางแรก สูดควันจากถ้วยดินเผาในมือหญิงชราหนึ่งลมหายใจ แล้วกลับบ้านไปนอน ตื่นมาจะเหลือแต่ไข้ ทางที่สอง ยกถังขึ้นเกวียนด้วยกัน แล้วไม่ต้องกลับไปอีก เขาถามว่าที่บ้านมีใครรออยู่ไหม ปากตรอกทั้งสองข้างมีคนยืนอยู่ข้างละคน มือเปล่าทั้งคู่
  choices:
    - id: breathe_the_oil
      label: สูดควันจากถ้วยดินเผา แล้วกลับบ้านไปนอน
      text: |
        ควันในถ้วยอุ่นและหวาน หญิงชรายกถ้วยขึ้นถึงจมูก{name}ด้วยมือที่ไม่สั่นสักนิด {name}สูดเข้าไปหนึ่งลมหายใจ ได้ยินนางพูดคำเดียวว่าดี แล้วก็ไม่ได้ยินอะไรอีก

        {name}ตื่นบนเตียงตัวเองตอนสาย รองเท้ายังสวมอยู่ ตัวร้อน ลิ้นมีรสน้ำตาลไหม้ ขากางเกงข้างหนึ่งมีคราบน้ำย้อมสีครามแห้งกรังขึ้นมาถึงเข่า ตั้งแต่วันนั้น{name}กลับบ้านอ้อมทางตลาดทุกคืน บอกใครไม่ได้ว่าทำไม
      effects: { flags: [forgot_the_night_of_the_oil_cart] }
    - id: follow_the_cart
      label: บอกว่าไม่มีใครรอ แล้วช่วยยกถังขึ้นเกวียน
      requires: { not_flags: [has_partner, has_child, has_ward], not_wears: [cold_iron], not_traits: [curse_brand] }
      text: |
        ถังหนักกว่าที่คิด น้ำมันข้างในไม่กระฉอกสักนิด {name}ยกขึ้นเกวียนคู่กับชายร่างหนาคนหนึ่ง เขานับถังทุกใบที่ขึ้นไป แล้วจดลงสมุดเล่มเล็กที่ห้อยเชือกไว้ข้างเอว ลายมือเรียบเหมือนไม้บรรทัด ชายที่หันหูขวามาบอกว่าตัวเองชื่อออสริค หญิงชราชื่อไซเวล ส่วนชื่อคนจดสมุด{name}ได้รู้ตอนเกวียนพ้นหลังคาบ้านหลังสุดท้าย ทอร์เบน

        คำสาบานพูดกันบนเกวียนที่แล่นไปโดยไม่มีเสียงกีบ ต่อหน้าตะเกียงสังกะสีดวงหนึ่งที่ยังไม่เคยจุด ออสริคบอกว่าพูดครั้งเดียวพอ ไม่มีใครขอให้พูดซ้ำ ตะเกียงดวงนั้นเขาให้{name}ถือไว้ตลอดทาง ไส้ยังขาว เบาจน{name}ต้องก้มดูเป็นระยะว่ายังอยู่ในมือ
      effects:
        org: { id: wick, join: true }
        traits: [oath_wick]
        mark: เข้าหน่วยไส้ตะเกียง
        flags: [followed_the_oil_cart]
    - id: walk_in_front
      label: บอกว่าไม่มีใครรอ แล้วถามว่าคนมีตราเดินตรงไหนของชุด
      requires: { trait: curse_brand, not_flags: [has_partner, has_child, has_ward], not_wears: [cold_iron] }
      text: |
        ชายที่หันหูขวาไม่ต้องดูตรา เขาบอกว่ารู้ตั้งแต่หญิงชราแตะศอก ข้างหน้าล่อมีคนเดินอยู่แล้วคนหนึ่ง ผ้าพันขอเหล็กไว้ทั้งด้าม เดินนำเกวียนสิบก้าว ไม่ถือไฟ คนมีตราเดินตรงนั้น ตรงที่แสงไม่คุ้ม เพราะสิ่งที่ลงมาตอนกลางคืนมองไม่เห็นคนแบบนี้

        ชายร่างหนาที่นับถังจดลงสมุดเล่มเล็กข้างเอว ไม่ใช่ชื่อของ{name} เป็นตัวเลข สั้นกว่าชื่อ ลายมือเรียบเหมือนไม้บรรทัด คำสาบานสามข้อพูดกันต่อหน้าตะเกียงสังกะสีที่ยังไม่เคยจุด แล้ว{name}ก็ออกไปยืนข้างคนถือขอ สิบก้าวหน้าล่อ ในความมืดที่ไม่มีใครถือไฟให้
      effects:
        org: { id: wick, join: true }
        traits: [oath_wick]
        mark: เข้าหน่วยไส้ตะเกียง
        flags: [walked_in_front_from_the_oil_cart]
    - id: run_past_the_alley_mouth
      label: วิ่งฝ่าคนที่ยืนปากตรอก
      text: |
        คนที่ปากตรอกไม่ยกมือขวาง เขาเบี่ยงตัวให้พอดีช่อง ไม่มีใครวิ่งตาม {name}วิ่งพ้นหัวมุมที่สามแล้วล้มลงหอบอยู่หลังกองถังน้ำย้อม นั่งตรงนั้นจนฟ้าเทา

        เช้านั้นมีนักล่าแม่มดคนหนึ่งนั่งกินถั่วคั่วอยู่บนขั้นบันไดตรงข้ามบ้าน{name} เปลือกถั่วตกข้างรองเท้าเป็นกองเล็ก ตกเย็นกองนั้นโตเท่าหมวก คนกินยังนั่งท่าเดิม
      effects: { stats: { DEX: 1 }, hunted: { lamp_church: 1 }, flags: [ran_from_the_oil_cart] }

- id: adult.hunted_five_year_questions
  stage: adult
  scene: temple
  weight: 14
  when:
    age: [25, 64]
    flags: [race_tiefling]
    trait: curse_brand
    location_tag: [arvel_village, ventras, kardin]
    not_flags: [origin_marked_hidden, horns_sawn]
    not_orgs: [wick]
  text: |
    ใบเรียกตอกอยู่บนประตูบ้าน{name}ตั้งแต่ก่อนสาง ตะปูตัวเดียว ระดับสายตา กระดาษหนาสีขาวนวล ลายมือเสมียนวิหาร หน้าผู้ต้องตรา ครบรอบห้าปี วันนัด แล้วก็ชื่อ{name} สะกดครบทุกตัว เพื่อนบ้านที่เดินไปตักน้ำอ่านจบแล้วเดินต่อ ไม่มีใครหยุด รอบที่แล้วก็มีใบแบบนี้ รอบก่อนหน้านั้นก็มี

    ห้องตรวจหลังวิหาร{name}รู้จักดีกว่าห้องไหนในวิหาร ไม่มีหน้าต่าง มีโต๊ะตัวเดียวกับตะเกียงดวงเดียวที่แขวนต่ำจนแสงตกกลางโต๊ะพอดี คนถามเปลี่ยนไปทุกรอบ คำถามไม่เคยเปลี่ยน ฝันถึงใคร ได้ยินเสียงอะไรตอนกลางคืน ไปที่ไหนมาบ้าง เสมียนแก่คนเดิมนั่งเหลาปากกาอยู่ข้างหลังทุกรอบ สมุดเกิดของวิหารเปิดค้างไว้ที่หน้าท้ายเล่ม

    ข้อสามยาวที่สุดเสมอ ห้าปีนานพอให้ใครก็ตามไปยืนในที่ที่ไม่อยากให้ใครจดไว้สักแห่ง
  choices:
    - id: answer_plainly
      label: ไปตามนัด ตอบตามจริงทุกข้อ
      requires: { not_orgs: [ash_cult] }
      text: |
        รอบนี้คนถามเป็นนักล่าแม่มดหนุ่ม เสื้อคลุมขาวปักรูปตะเกียงที่อกยังมีรอยพับจากหีบ {name}ตอบไปตามที่มี ฝันถึงฟันหลุดซี่หนึ่ง ฝันถึงตลาดที่เดินหาทางออกไม่เจอ ตอนกลางคืนได้ยินหมาเห่ากับเสียงเกวียนผ่าน ไม่ได้ยินอะไรที่คนอื่นว่าได้ยิน ที่ไปมาก็ไล่ให้ฟังทีละแห่ง ตลาด บ่อน้ำ ที่ทำงาน งานศพเพื่อนบ้านสองงาน

        เขาฟังจนจบโดยไม่เงยหน้า เสมียนแก่จดไม่ถึงสามบรรทัด แล้วโรยทรายซับหมึก ก่อนสมุดปิด{name}เห็นชื่อตัวเองบนหน้าท้ายเล่ม ข้างชื่อมีวงกลมเล็กๆ เรียงเป็นแถว วงสุดท้ายหมึกยังเยิ้ม
      effects: { stats: { WIS: 1 }, flags: [answered_the_marked_page_plainly] }
    - id: leave_a_place_out
      label: ไปตามนัด แต่ตัดที่หนึ่งออกจากคำตอบข้อสาม
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          รอบนี้คนถามเป็นนักล่าแม่มดหนุ่ม เสื้อคลุมขาวยังมีรอยพับจากหีบ {name}ไล่ที่ที่ไปมาทีละแห่งด้วยน้ำเสียงเดียวกันหมด ตลาด บ่อน้ำ ที่ทำงาน บ้านคนป่วยที่ไปเยี่ยม ที่ที่ตัดออกไม่ทิ้งช่องไว้ในจังหวะพูดเลยสักนิด เสมียนแก่จดตามจนครบ แล้วโรยทรายซับหมึก

          นักล่าแม่มดถามว่ามีอะไรจะเพิ่มไหม {name}บอกว่าไม่มี เขาปิดสมุด ข้างนอกห้องยังมีคนรอตรวจอีกสิบสองคน นั่งเรียงบนม้านั่งยาว ทุกคนก้มมองรองเท้าตัวเอง
        effects: { stats: { CHA: 1 }, flags: [left_a_place_out_of_the_marked_page] }
      failure:
        text: |
          นักล่าแม่มดหนุ่มไม่ได้ฟังคำตอบ เขามองรองเท้า{name} ขอบพื้นรองเท้ามีดินสีแดงติดเป็นแนว ดินแบบที่ตลาดไม่มี บ่อน้ำไม่มี ไม่มีในที่ไหนสักแห่งที่{name}เพิ่งไล่มา เขาถามคำถามที่สี่ คำถามที่ไม่มีในกระดาษ ดินนี้มาจากไหน

          เสมียนแก่จดคำถามที่สี่ลงสมุด เว้นบรรทัดใต้คำถามไว้ว่าง แล้วขีดเส้นใต้บรรทัดว่างนั้นสองเส้น ก่อนสิ้นสัปดาห์ มีคนแปลกหน้ามากินข้าวที่ร้านหัวถนนบ้าน{name}ทุกมื้อ นั่งโต๊ะที่หันหน้าออกถนน
        effects: { hunted: { lamp_church: 2 }, flags: [caught_lying_to_the_marked_page] }
    - id: do_not_go
      label: ไม่ไป ปล่อยใบเรียกตากแดดอยู่บนประตู
      text: |
        ใบเรียกตากแดดตากฝนอยู่บนประตูจนหมึกซีด ลมพลิกมุมกระดาษขึ้นลงทุกบ่าย วันนัดผ่านไปโดยไม่มีใครมาเคาะประตู วันต่อมาก็ไม่มี

        ครบสิบวัน มีใบใหม่ตอกทับใบเก่า ตะปูสองตัว หมึกแดง ข้อความยาวกว่าเดิมหนึ่งบรรทัด เพื่อนบ้านที่เดินไปตักน้ำหยุดอ่านนานกว่ารอบก่อน แล้วข้ามไปเดินอีกฝั่งถนน
      effects: { alignment: { law: -1 }, hunted: { lamp_church: 1 }, flags: [let_the_summons_fade_on_the_door] }
    - id: ask_for_the_old_hunter
      label: ถามหานักล่าแม่มดคนที่เคยเล่าฝันของตัวเองให้ฟัง
      requires: { flag: hunter_told_his_dream }
      text: |
        นักล่าแม่มดหนุ่มเงยหน้าจากกระดาษเป็นครั้งแรก บอกว่าคนนั้นขอย้ายไปเฝ้าคลังน้ำมันที่ชายแดน ไม่ออกตรวจอีกแล้ว เขาไม่รู้ว่าทำไม เสมียนแก่หยุดเหลาปากกา พลิกสมุดย้อนไปหน้าหนึ่ง ชี้ให้ดูสามบรรทัดสั้นๆ ใต้ชื่อ{name} ลายมือของคนนั้น

        {name}ตอบสามคำถามแบบเดียวกับรอบที่แล้ว นักล่าแม่มดหนุ่มดูบรรทัดของคนก่อนหน้าอยู่ครู่หนึ่ง แล้วจดลงไปสามบรรทัด ไม่ยาวกว่านั้นสักคำ
      effects: { stats: { WIS: 1 }, flags: [asked_after_the_hunter_who_dreamed] }

- id: adult.hunted_name_on_the_list
  stage: adult
  scene: home
  weight: 15
  hunt: lamp_church
  when:
    age: [20, 64]
    not_orgs: [wick]
  text: |
    เสียงเคาะประตูมาตอนฟ้ายังไม่สาง ไม่ใช่สันมือ เป็นไม้ปลายหุ้มเหล็ก สามครั้ง หนักเท่ากัน ห่างเท่ากัน คนที่เคาะแบบนี้ไม่เคยต้องเคาะรอบที่สอง

    หน้าประตูมีนักล่าแม่มดสองคน เสื้อคลุมขาวเปียกน้ำค้างถึงไหล่ คนหนึ่งถือโซ่ขดไว้ในมือแบบคนจูงวัวถือเชือก ข้างหลังมีเสมียนแก่ถือม้วนรายชื่อ คลี่ออกมาแค่พอให้เห็นสี่บรรทัดแรก ชื่อ{name}อยู่บรรทัดที่สี่ หลังชื่อมีเครื่องหมายเล็กๆ ตัวหนึ่ง ทุกชื่อในม้วนมีเครื่องหมายคนละแบบ เสมียนอ่านออก คนนอกอ่านไม่ออก

    นักล่าแม่มดคนที่มือว่างบอกว่าจะเข้าไปดูในบ้าน หรือ{name}จะเดินไปตอบคำถามที่วิหารเองก็ได้ เลือกเอา พูดจบแล้วเขาก็ยืนรอ ไม่เร่ง น้ำค้างหยดจากชายเสื้อคลุมลงบนธรณีประตูทีละหยด
  choices:
    - id: let_them_search
      label: เปิดประตูให้เข้ามาค้น
      text: |
        สองคนนั้นค้นช้าและเรียบร้อย หยิบของขึ้นมาดูทีละชิ้นแล้ววางคืนตรงรอยฝุ่นเดิม ผ้าห่มเขย่าทีละผืนแล้วพับให้ เสมียนแก่ยืนอยู่ที่ประตู จดของบางชิ้นลงหลังม้วนรายชื่อ ไม่ใช่ทุกชิ้น {name}เดาไม่ออกว่าเขาเลือกจดอะไร

        ตอนออกไป คนถือโซ่เอาชอล์กวาดรูปตะเกียงเล็กๆ ไว้ที่ด้านในวงกบประตู ต่ำกว่าระดับตา ตรงที่คนในบ้านต้องเห็นทุกครั้งที่ก้าวออกไป {name}เอาผ้าเปียกเช็ดไปสามผืน รูปตะเกียงจางลงแต่ไม่หาย
      effects: { flags: [let_the_witch_hunters_search] }
    - id: go_to_the_temple
      label: เดินไปวิหารกับพวกเขา ตอบคำถามจนกว่าจะพอ
      requires: { not_orgs: [ash_cult, star_listeners] }
      text: |
        ห้องหลังวิหารมีม้านั่งไม้ยาวตัวเดียว คำถามมาทีละข้อ ห่างกันนานพอให้{name}ได้ยินเสียงสวดเช้าจบ เสียงสวดเที่ยงขึ้น แล้วเสียงสวดเย็นขึ้น คำถามบางข้อถามซ้ำสามรอบด้วยคำต่างกัน ไม่มีน้ำให้ดื่ม ไม่มีใครบอกว่าชื่อ{name}ไปอยู่ในม้วนนั้นได้อย่างไร

        พลบค่ำ เสมียนแก่ขีดเส้นบางๆ ทับเครื่องหมายหลังชื่อ{name} ไม่ได้ขีดทับชื่อ นักล่าแม่มดเปิดประตูให้ออกไป {name}เดินกลับบ้านในความมืดด้วยขาที่นั่งจนชาทั้งสองข้าง
      effects: { stats: { CON: 1 }, hunted: { lamp_church: -1 }, flags: [answered_at_the_temple_till_dusk] }
    - id: out_the_back
      label: ปิดประตูหน้า แล้วออกทางหลังบ้าน
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ปิดประตูหน้าเบาๆ แบบคนจะเข้าไปหยิบเสื้อคลุม แล้วออกทางหลังบ้าน ข้ามรั้วไม้ ลอดใต้ราวตากผ้าของบ้านถัดไป ผ้าปูเปียกตบหน้าไปสองผืน ข้างหลังมีเสียงไม้หุ้มเหล็กเคาะประตูอีกสามครั้ง หนักเท่าเดิม ห่างเท่าเดิม

          {name}กลับบ้านหลังมืดค่ำ ประตูหน้ายังปิดอย่างที่ปิดไว้ บนดินหน้าธรณีประตูมีหลุมเล็กสามหลุมจากปลายไม้ เรียงห่างกันเท่าเสียงเคาะ
        effects: { stats: { DEX: 1 }, flags: [went_out_the_back_door] }
      failure:
        text: |
          {name}ขึ้นรั้วได้ครึ่งตัว โซ่ก็พันข้อเท้าแล้วกระชาก ตกลงมาหลังกระแทกดินแข็งจนหายใจไม่ออก นักล่าแม่มดคนที่ถือโซ่ยืนรออยู่หลังบ้านแล้ว ไม่รู้ว่าอ้อมมาตั้งแต่ตอนไหน

          เขาคลายโซ่ให้เอง บอกว่าไม่ต้องตอบอะไรแล้ว คนที่วิ่งตอบไปแล้ว ที่หน้าบ้าน เสมียนแก่คลี่ม้วนรายชื่อออกอีกบรรทัด เขียนเครื่องหมายตัวที่สองต่อท้ายตัวแรก
        effects: { hp: -2, hunted: { lamp_church: 1 }, flags: [chain_caught_my_ankle_at_the_fence] }
    - id: show_the_brand
      label: ยื่นตราให้ดูกันตรงหน้าประตู ไม่ต้องให้ใครเข้าบ้าน
      requires: { trait: curse_brand, not_orgs: [ash_cult] }
      text: |
        คนถือโซ่ล้วงแท่งเหล็กเย็นออกจากซองที่เอว ยาวเท่าฝ่ามือ ดำด้าน กดลงบนตราของ{name}ตรงหน้าประตูนั้นเอง ต่อหน้าเพื่อนบ้านที่เปิดหน้าต่างออกมาดู เย็นจนกระดูกปวด แล้วชาไปทั้งแถบ ตราไม่ร้อนตอบ ไม่ขึ้นสี ไม่มีควัน

        เขายกเหล็กออก ดูผิวตรงนั้นอยู่ครู่หนึ่ง แล้วหันไปบอกเสมียนคำเดียวว่านิ่ง เสมียนขีดอะไรบางอย่างหลังชื่อ{name} รอยเหล็กเย็นเป็นวงขาวซีดอยู่บนผิวจนเที่ยง
      effects: { hp: -1, hunted: { lamp_church: -1 }, flags: [let_them_press_cold_iron_on_the_brand] }
    - id: loose_plank
      label: มุดออกทางแผ่นไม้พื้นใต้เตียงที่ไม่ได้ตอกตะปู
      requires: { org: { id: ash_cult, secret: false } }
      text: |
        ตั้งแต่วันที่ทั้งถนนรู้ว่า{name}เป็นคนของกอง แผ่นไม้พื้นใต้เตียงแผ่นหนึ่งไม่ได้ตอกตะปูอีก ข้างใต้เป็นช่องดินพอให้คนคลานไปถึงท่อน้ำทิ้งหลังบ้าน {name}คลานออกไปตอนเสมียนแก่ยังม้วนรายชื่อเก็บไม่เสร็จ

        ในท่อน้ำทิ้งมีกลิ่นน้ำล้างจานของทั้งซอย {name}นั่งรออยู่ในนั้นจนเที่ยง ฟังฝีเท้าเดินผ่านปากท่อไปมาหลายรอบ รอบหลังๆ เดินเร็วขึ้น แล้วก็หายไป
      effects: { stats: { DEX: 1 }, flags: [left_by_the_loose_plank] }
    - id: point_to_the_oil_cart
      label: ชี้ให้เขาดูเกวียนน้ำมันที่จอดปลายถนนมาสามคืนแล้ว
      requires: { org: { id: star_listeners, secret: false } }
      text: |
        นักล่าแม่มดหันไปมองเกวียนที่ปลายถนน ล่อพันกีบด้วยผ้ากระสอบ ถังบนเกวียนมีรอยชอล์ก เขามองค้างไว้จนเสมียนแก่ม้วนรายชื่อเก็บเสร็จ แล้วบอกว่าบ้านที่เกวียนนั้นจอดหน้าไม่ใช่งานของเขา

        ทั้งสามคนเดินจากไปทางตรงข้ามกับเกวียน คืนนั้น{name}นอนไม่หลับ ฟังเสียงล่อเคี้ยวหญ้าอยู่ปลายถนนจนสาง
      effects: { hunted: { lamp_church: -1 }, flags: [the_witch_hunters_left_me_to_the_cart] }

- id: adult.hunted_witch_hunter_at_the_ford
  stage: adult
  scene: road
  weight: 12
  time: dusk
  once: false
  hunt: lamp_church
  when:
    age: [20, 64]
    not_orgs: [wick]
  text: |
    ทางข้ามน้ำตื้นแค่หน้าแข้ง หินกลมเรียงเป็นแนวให้คนเหยียบข้าม ตะไคร่ลื่นทุกก้อน {name}ข้ามมาได้ครึ่งทางตอนเห็นคนยืนรออยู่ฝั่งโน้น เสื้อคลุมขาวชายเปียกน้ำ โซ่ขดห้อยจากมือข้างหนึ่งเกือบแตะผิวน้ำ อีกมือถือกระดาษแผ่นเดียว ฝั่งที่{name}เดินมาไม่มีใคร มีแต่น้ำที่ไหลแรงพอจะพาคนล้มไปได้ไกล

    เขาอ่านชื่อ{name}ออกมาจากกระดาษ ไม่ได้ตะโกน เสียงข้ามน้ำมาชัดทุกพยางค์ แล้วบอกว่าจะถอยกลับไปฝั่งเดิมก็ได้ เขาข้ามตามไปเองได้
  encounter:
    foe: witch_hunter
    name: นักล่าแม่มดที่ทางข้ามน้ำ
    morale: 2
    beats:
      - text: เขาก้าวลงน้ำ เหวี่ยงโซ่ต่ำเลียดผิวน้ำ ปลายโซ่ตีน้ำแตกเป็นฟองห่างเท้า{name}ไม่ถึงสองช่วงแขน
        answer: quick
        moves:
          - id: ford_step_over
            label: กระโดดข้ามหินไปสองก้อน ให้โซ่ตีน้ำเปล่า
            kind: quick
          - id: ford_throw_stones
            label: ก้มหยิบหินกลมใต้น้ำ ขว้างใส่เขาก่อนเขาจะเข้ามาถึง
            kind: attack
            tags: [ranged]
            success: หินก้อนแรกโดนไหล่ ก้อนที่สองโดนมือที่ถือโซ่ เขาหยุดอยู่กลางน้ำ ก้มมองโซ่ที่หลุดมือไปครึ่งขด จมอยู่ระหว่างหินสองก้อน
          - id: ford_brace
            label: ปักเท้าลงระหว่างหินสองก้อน ยกแขนขึ้นกันหน้า
            kind: guard
          - id: ford_name_the_book
            label: ตะโกนถามเขาว่าชื่อในกระดาษคัดมาจากสมุดเล่มไหน
            kind: talk
          - id: ford_run_for_the_far_bank
            label: หันหลังวิ่งกลับฝั่งที่มา
            kind: flee
      - text: โซ่เกี่ยวหินก้อนหนึ่งไว้ เขาดึงกลับช้าๆ แล้วเดินเข้ามาอีกสามก้าว น้ำถึงเข่าเขาแล้ว เขาบอกว่าตอนนี้ยังไม่สายที่จะคุยกันโดยไม่ต้องใช้โซ่
        answer: talk
        moves:
          - id: ford_promise
            label: สัญญาว่าก่อนสางจะไปพ้นเขตวิหารของเขา ไม่กลับมาอีก
            kind: talk
            parley: true
          - id: ford_read_his_face
            label: จ้องหน้าเขา หาว่าเขาพูดจริงแค่ไหน
            kind: read
            stat: WIS
            failure: หน้าของเขานิ่งแบบน้ำในโอ่ง ไม่มีอะไรให้อ่าน {name}มองนานเกินไป ปลายโซ่ฟาดเข้าสีข้างตอนที่ตายังจับอยู่ที่หน้าเขา
          - id: ford_splash
            label: วักน้ำสาดเข้าตาเขา แล้วขว้างหินตามไปอีกก้อน
            kind: attack
            tags: [ranged]
          - id: ford_hold_ground
            label: ยืนนิ่งบนหินก้อนใหญ่ที่สุด ไม่ถอยสักก้าว
            kind: guard
          - id: ford_dive_downstream
            label: กระโจนลงน้ำ ปล่อยให้กระแสพาไปทางท้ายน้ำ
            kind: flee
      - text: เขาไม่พูดอีก เก็บโซ่ขดสั้นเหลือแค่ช่วงแขน แล้วก้าวขึ้นมาบนหินก้อนเดียวกับ{name} น้ำไหลแรงจนหินใต้เท้าสั่น
        answer: attack
        moves:
          - id: ford_catch_the_wrist
            label: คว้าข้อมือข้างที่ถือโซ่ แล้วบิดลงน้ำ
            kind: attack
          - id: ford_shield_with_pack
            label: ยกย่ามขึ้นรับโซ่
            kind: guard
          - id: ford_sling_mud
            label: ถอยไปหินก้อนหลัง โกยโคลนก้นน้ำปาใส่หน้าเขา
            kind: attack
            tags: [ranged]
          - id: ford_run_for_the_reeds
            label: กระโดดลงน้ำ ลุยเข้าดงกก
            kind: flee
    win:
      text: |
        นักล่าแม่มดล้มลงนั่งในน้ำถึงอก เสื้อคลุมขาวพองลอยรอบตัว เขาไม่ลุกตาม นั่งอยู่อย่างนั้น มองโซ่ที่จมอยู่ระหว่างหิน แล้วหัวเราะออกมาสั้นๆ แบบคนที่เพิ่งนึกได้ว่าลืมของไว้ที่บ้าน

        {name}ขึ้นฝั่งได้ หันกลับไปดู เขายังนั่งอยู่กลางน้ำ กระดาษแผ่นนั้นลอยไปตามกระแส หมึกละลายเป็นสีฟ้าจางๆ
      effects: { flags: [left_the_witch_hunter_sitting_in_the_ford] }
    parley:
      text: |
        เขาหยุดอยู่กลางน้ำ ฟังจนจบ แล้วพับกระดาษใส่อกเสื้อ บอกว่างานของเขามีแค่เขตวิหารเดียว คนที่ออกไปเองไม่ต้องลากด้วยโซ่ ตอนสางเขาจะยืนดูอยู่ที่ทางข้ามน้ำนี้

        ก่อนสาง{name}ออกเดินพร้อมย่ามใบเดียว ผ่านทางข้ามน้ำนั้นอีกรอบ เขายืนอยู่บนฝั่งจริง ชายเสื้อคลุมขาวมีคราบตะไคร่เป็นแถบ เขาไม่ขยับ ไม่ทัก มองตาม{name}ไปจนพ้นแนวต้นหลิว
      effects: { hunted: { lamp_church: -1 }, flags: [left_the_parish_at_the_fords_word] }
    flee:
      text: |
        {name}ไม่หยุดจนพ้นโค้งน้ำ เสื้อผ้าเปียกหนักติดตัว รองเท้าหายไปข้างหนึ่ง ข้างหลังไม่มีเสียงน้ำแตกตามมา นักล่าแม่มดไม่วิ่ง พวกเขาไม่เคยต้องวิ่ง

        คืนนั้น{name}นอนในโรงเก็บฟางของใครก็ไม่รู้ ตัวสั่นจนสาง รองเท้าข้างที่เหลือวางอยู่ข้างหมอนฟาง ไม่รู้จะเก็บไว้ทำไม
      effects: { flags: [fled_the_witch_hunter_at_the_ford] }
    stalemate:
      text: |
        ฟ้ามืดลงจนเห็นแต่เสื้อคลุมขาวของเขา เขาถอยกลับขึ้นฝั่งเอง ขดโซ่เก็บ บอกว่าทางข้ามน้ำมีให้ข้ามทุกวัน แล้วเดินหายเข้าไปในแนวต้นหลิว

        {name}ยืนอยู่บนหินก้อนกลางน้ำจนมืดสนิท น้ำเย็นจนขาชาถึงสะโพก ไม่กล้าขึ้นฝั่งไหนก่อน
      effects: { flags: [stood_off_the_witch_hunter_at_the_ford] }
    lose:
      text: |
        โซ่พันข้อเท้าทั้งสองข้าง {name}ล้มคว่ำลงในน้ำ สำลักจนเห็นแต่สีน้ำตาล รู้ตัวอีกทีก็นอนอยู่บนกรวดริมฝั่ง น้ำไหลออกจากจมูก นักล่าแม่มดนั่งยองอยู่ข้างๆ รอให้{name}หายใจได้เอง

        เขาจดอะไรบางอย่างลงกระดาษแผ่นนั้น บอกว่าคนที่ต้องลากขึ้นจากน้ำวันนี้ไม่ต้องลากไปไหนต่อ แล้วเดินข้ามน้ำกลับไปทางเดิม รอยโซ่ที่ข้อเท้าทั้งสองข้างเป็นวงสีม่วงอยู่ครึ่งเดือน
      effects: { flags: [pulled_from_the_ford_by_the_witch_hunter] }
    death:
      text: |
        น้ำตรงทางข้ามตื้นแค่หน้าแข้ง แต่คนที่ล้มลงไปทั้งตัวพร้อมโซ่พันขาลุกไม่ขึ้น

        นักล่าแม่มดดึงโซ่กลับเมื่อทุกอย่างนิ่งแล้ว ม้วนเก็บทีละขด แล้วขีดเส้นทับชื่อหนึ่งในกระดาษแผ่นนั้น

- id: adult.hunted_lamp_way_down
  stage: adult
  scene: market
  weight: 20
  when:
    age: [20, 64]
    min_hunted: { lamp_church: 1 }
    not_orgs: [wick]
  text: |
    คนที่ศาสนจักรตะเกียงตามอยู่รู้ตัวจากเรื่องเล็กก่อนเรื่องใหญ่ คนขายน้ำมันที่ถามชื่อซ้ำสองหน นักล่าแม่มดที่นั่งกินข้าวโต๊ะเดิมสามวันติด เด็กรับใช้วิหารที่เดินตามไปจนถึงหัวมุมแล้วเลี้ยวกลับ {name}นับเรื่องเล็กแบบนี้ได้เจ็ดเรื่องในเดือนเดียว

    หญิงแก่ที่ขายไส้ตะเกียงอยู่หน้าวิหารมาตั้งแต่ก่อนใครในตลาดจะจำความได้ พูดกับ{name}ระหว่างนับไส้ใส่ห่อ นางไม่ได้มองหน้า นางบอกว่าคนที่ศาสนจักรตามมีทางลงสามทาง ทางแรกคือโฮเบล เสมียนทะเบียนของวิหาร เขาเขียนคำว่าย้ายถิ่นไม่ทราบที่ไปลงข้างชื่อใครก็ได้ ราคาสี่เหรียญ ทางที่สองคือแม่ชีคลาเวียของวิหารอีเซล นางมีโรงซักผ้าหลังวิหาร คนที่เข้าไปซักผ้าตลอดหน้าหนาวไม่มีใครนับ ทางที่สามไม่ต้องใช้ใคร หายไปเองหนึ่งฤดู ห่อไส้ตะเกียงของ{name}ผูกเชือกเสร็จพอดีกับที่นางพูดจบ
  choices:
    - id: pay_hobel
      label: เอาสี่เหรียญไปหาโฮเบลที่ห้องทะเบียน
      requires: { min_gold: 4 }
      text: |
        โฮเบลเป็นชายผอมที่นิ้วกลางมือขวามีตุ่มด้านจากการจับปากกา เขาไม่ถามชื่อ{name} ให้ชี้เอาเองในสมุด รับเหรียญไปนับใต้โต๊ะ แล้วเขียนข้างบรรทัดนั้นด้วยหมึกสีเดียวกับบรรทัดอื่นทุกบรรทัด ย้ายถิ่น ไม่ทราบที่ไป ลายมือเรียบร้อยจนไม่มีใครคิดจะสงสัย

        เดือนต่อมานักล่าแม่มดที่นั่งโต๊ะเดิมย้ายไปนั่งโต๊ะอื่น คนขายน้ำมันถามชื่อ{name}ครั้งเดียว แล้วจำได้
      effects: { gold: -4, hunted: { lamp_church: -1 }, flags: [paid_hobel_the_register_man] }
    - id: winter_in_the_laundry
      label: ไปหาแม่ชีคลาเวียที่โรงซักผ้าหลังวิหารอีเซล
      check: { stat: CON, dc: 13 }
      success:
        text: |
          แม่ชีคลาเวียแขนใหญ่กว่าแขนคนตีเหล็ก นางไม่ถามว่าทำไมศาสนจักรตาม นางถามว่าบิดผ้าเป็นไหม แล้วให้{name}บิดผ้าปูเตียงของวิหารตั้งแต่ตีห้าจนมืดทุกวันตลอดหน้าหนาว มือแตกจนเลือดซึมแล้วด้านจนไม่แตกอีก ไม่มีใครนับคนในโรงซักผ้า เพราะไอน้ำหนาจนนับไม่ได้

          ปลายหนาว{name}ออกมาจากโรงซักผ้าพร้อมมือคู่ใหม่ ใบประกาศที่ประตูตลาดเปลี่ยนไปสามรอบแล้ว รอบล่าสุดไม่มีรูปพรรณที่ใกล้เคียง{name}เลย
        effects: { stats: { CON: 1 }, hunted: { lamp_church: -2 }, flags: [wintered_in_clavias_laundry] }
      failure:
        text: |
          ไอน้ำร้อนในโรงซักผ้าทำให้ปอดของ{name}ไม่ยอมหาย ไอทั้งคืนจนคนซักผ้าคนอื่นนอนไม่หลับ แม่ชีคลาเวียต้มน้ำขิงให้ทุกคืน แต่กลางหน้าหนาวนางต้องให้{name}ย้ายออกไปนอนห้องเก็บฟืน เพราะเสียงไอดังถึงกำแพงวิหาร

          {name}อยู่จนจบหน้าหนาวได้ ไอจนซี่โครงระบม ใบประกาศที่ประตูตลาดเปลี่ยนไปหนึ่งรอบ
        effects: { hp: -2, hunted: { lamp_church: -1 }, flags: [coughed_through_clavias_winter] }
    - id: a_season_gone_quiet
      label: หายไปเองหนึ่งฤดู ไม่ไปใกล้วิหารไหน ไม่ใช้ชื่อตัวเอง
      check: { stat: WIS, dc: 14 }
      success:
        text: |
          {name}ใช้ชื่อแม่ค้าที่ตายไปแล้วคนหนึ่ง รับงานกลางคืนที่ไม่มีใครถามชื่อ ล้างถังในโรงฟอกหนัง ขนถ่านลงเรือ ทั้งฤดูไม่เข้าวิหารสักครั้ง ไม่จุดตะเกียงริมหน้าต่าง ไม่ทักคนรู้จัก

          ปลายฤดู{name}เดินผ่านนักล่าแม่มดคนเดิมกลางตลาด ห่างกันแค่ช่วงแขน เขาหลบทางให้ เหมือนหลบคนแปลกหน้าที่แบกของหนัก
        effects: { stats: { WIS: 1 }, hunted: { lamp_church: -1 }, flags: [went_quiet_for_a_season] }
      failure:
        text: |
          สัปดาห์ที่สาม มีคนในโรงฟอกหนังเรียก{name}ด้วยชื่อจริงจากอีกฝั่งลาน ชื่อนั้นดังกว่าเสียงน้ำในบ่อฟอก {name}ไม่หันไป แต่คนอื่นหันกันทั้งลาน

          คืนนั้น{name}ทิ้งงานที่ยังไม่ได้ค่าจ้างไว้ครึ่งเดือน ย้ายไปนอนใต้สะพาน เริ่มนับฤดูใหม่ตั้งแต่ต้น
        effects: { gold: -2, flags: [named_in_the_tannery_yard] }
    - id: light_lamps_for_the_lost
      label: แขวนตะเกียงที่ทางแยกให้คนหลงทางทุกคืน ร้อยคืน ไม่บอกชื่อใครสักคืน
      requires: { trait: curse_lamp_out }
      text: |
        ตะเกียงในมือ{name}ดับเองทุกคืนมาตั้งแต่วันที่ผิดคำ หญิงแก่ขายไส้ตะเกียงไม่ถามว่าทำไม นางขายไส้ให้ร้อยเส้น คิดเงินแค่ห้าสิบเส้น บอกว่าทางแยกที่ใกล้ที่สุดมีคนหลงทุกคืน คนหลงไม่เคยถามชื่อคนถือไฟ ถามแต่ทาง

        {name}แขวนตะเกียงที่ทางแยกทุกคืน คืนแรกดับก่อนเที่ยงคืน คืนที่สามสิบดับก่อนสาง คืนที่หกสิบกว่าไม่ดับเลย คนหลงทางที่เดินเข้ามาหาแสงถามชื่อ{name}สิบเอ็ดครั้งในร้อยคืน {name}ตอบทางให้ทุกครั้ง ไม่ตอบชื่อสักครั้ง คืนที่ร้อย ตะเกียงไหม้อยู่จนน้ำมันหมด
      effects: { gold: -1, lose_traits: [curse_lamp_out], hunted: { lamp_church: -1 }, flags: [lit_a_hundred_nights_for_the_lost] }

# ---------- ผู้ฟังดาว ----------
- id: adult.hunted_chalk_star_offer
  stage: adult
  scene: home
  weight: 14
  when:
    age: [20, 64]
    trait: curse_brand
    location_tag: ventras
    not_orgs: [star_listeners]
  text: |
    ดาวเจ็ดแฉกปูนขาวที่กรอบประตูบ้าน{name}สูงแค่ระดับเข่า ตัวเท่าฝ่ามือเด็ก เช้านี้{name}เดินนับทั้งถนนได้เก้าดวง ทุกดวงอยู่ที่ประตูบ้านที่มีคนมีตราอยู่ บ้านช่างซ่อมรองเท้า บ้านสองพี่น้องขายถ่าน บ้านยายที่เลี้ยงนกพิราบไว้บนหลังคา ประตูบ้านอื่นในถนนไม่มีสักดวง

    บ่ายนั้นมีชายคนหนึ่งมายืนรอหน้าประตู ถุงมือหนังสีขาว ผมหวีเรียบ ถุงผ้าใบเล็กในมือมีเสียงเหรียญ เขาไม่ขอเข้าบ้าน เขาบอกว่ามีห้องว่างริมท่าเรือฝั่งใต้ หลังคาดี ค่าเช่าต่ำกว่าที่นี่ เงินในถุงพอค่าขนของกับค่าเช่าครึ่งปี ถนนนี้คงไม่สบายสำหรับ{name}อีกนาน เขาพูดเรื่องนี้ด้วยน้ำเสียงของคนแจ้งว่าข้างบ้านจะก่อเตาเผาอิฐ
  choices:
    - id: take_the_purse
      label: รับถุงเงิน แล้วย้ายไปห้องริมท่าเรือ
      text: |
        ห้องริมท่าเรือฝั่งใต้หลังคาดีจริงตามที่เขาว่า หน้าต่างหันออกน้ำ กลิ่นปลาเค็มกับน้ำมันดินลอยขึ้นมาทั้งวัน ค่าขนของจ่ายไปไม่ถึงครึ่งถุง ที่เหลือ{name}ซ่อนไว้ใต้แผ่นไม้พื้น

        เดือนต่อมา{name}เดินกลับไปดูถนนเดิม ดาวปูนขาวหายไปจากทุกประตู ประตูทั้งเก้าบานมีคนอื่นอยู่ ยกเว้นบานของยายเลี้ยงนกพิราบ บานนั้นปิดลงกลอนจากข้างนอก บนหลังคาไม่มีนกสักตัว
      effects: { gold: 6, flags: [took_the_purse_and_moved] }
    - id: stay_behind_the_star
      label: ไม่รับ ปิดประตูต่อหน้าเขา
      text: |
        เขาไม่โกรธ เก็บถุงเงินเข้าเสื้อ บอกว่าห้องริมท่าเรือยังว่างอีกสักพัก แล้วเดินไปเคาะประตูบ้านถัดไปที่มีดาว

        ตั้งแต่สัปดาห์นั้น ทุกเช้า{name}เปิดประตูออกมาเจอดาวดวงใหม่ ดวงที่เช็ดไปเมื่อวานทิ้งรอยจางไว้ข้างใต้ ดวงใหม่เขียนทับรอยเก่าพอดีทุกแฉก ไม่เหลื่อมสักเส้น
      effects: { stats: { CON: 1 }, hunted: { star_listeners: 1 }, flags: [stayed_behind_the_chalk_star] }
    - id: wash_the_street
      label: หิ้วถังน้ำออกไปล้างดาวทุกดวงในถนน
      text: |
        {name}ล้างดาวเก้าดวงด้วยถังน้ำใบเดียวกับแปรงขัดพื้น ช่างซ่อมรองเท้าออกมายืนดู แล้วกลับเข้าไปเอาถังของตัวเองมาช่วยล้างอีกสามบ้าน ยายเลี้ยงนกพิราบให้ขนมปังครึ่งก้อน ไม่มีใครถามว่าล้างไปทำไม

        เช้าวันรุ่งขึ้น ดาวกลับมาครบเก้าดวง กับดวงที่สิบ อยู่ที่ประตูบ้านคนขายถั่วคั่วที่ไม่มีเขา ไม่มีตรา เขายืนมองดาวดวงนั้นจนถั่วในกระทะไหม้ แล้วหันมามอง{name}
      effects: { alignment: { moral: 1 }, hunted: { star_listeners: 2 }, flags: [washed_every_star_in_the_street] }
    - id: name_in_the_book
      label: ถามเขาว่าชื่อของตัวเองอยู่ในสมุดของใคร
      requires: { any_flags: [saw_chalk_star, listeners_noted_name, listeners_chalked_door] }
      text: |
        ชายในถุงมือขาวไม่ปฏิเสธว่ามีสมุด เขาเปิดให้ดูเอง สมุดปกผ้าสีน้ำเงิน ลายมือเอียงซ้ายทุกหน้า ชื่อ{name}อยู่หน้าที่สามสิบ ใต้ชื่อมีวันที่สองวัน วันแรกเก่าจนหมึกซีด {name}นับย้อนแล้วจำได้ว่าเป็นวันไหน วันที่สองคือวันนี้

        ข้างวันที่สองยังว่าง เขารอให้{name}ตัดสินใจเรื่องถุงเงินก่อน {name}ไม่ตัดสินใจ เขาจึงปิดสมุดเบาๆ แบบคนปิดหนังสือสวดที่ยังสวดไม่จบบท
      effects: { stats: { WIS: 1 }, hunted: { star_listeners: 1 }, flags: [saw_my_name_in_the_blue_book] }

- id: adult.hunted_white_gloves_at_tea
  stage: adult
  scene: tavern
  weight: 15
  hunt: star_listeners
  when:
    age: [20, 64]
    not_orgs: [star_listeners]
  text: |
    บัตรเชิญมาทางเด็กส่งของ กระดาษหนา หมึกสีน้ำเงิน เชิญ{name}ไปดื่มชาที่ร้านริมสะพานบ่ายวันพรุ่งนี้ ลงท้ายด้วยดาวเจ็ดแฉกเล็กเท่าเมล็ดงา ไม่มีชื่อคนเชิญ

    หญิงคนหนึ่งนั่งรออยู่โต๊ะริมหน้าต่าง ถุงมือหนังสีขาวถอดพับไว้ข้างถ้วย นางรินชาให้{name}ก่อนรินให้ตัวเอง แล้วเลื่อนกระดาษแผ่นหนึ่งข้ามโต๊ะมา หมึกสีน้ำเงิน ลายมือเอียงซ้าย {name}ตื่นตอนไหน ออกจากบ้านทางประตูไหน กินข้าวเที่ยงร้านไหน วันฝนตกกลับบ้านทางไหน ตรงทุกบรรทัด

    นางขอเรื่องเดียว คืนเดือนดับที่จะถึง ให้{name}ไปนอนที่อื่นหนึ่งคืน ที่ไหนก็ได้ ค่าห้องนางจ่ายเอง นางไม่บอกว่าทำไม เสียงของนางเบาพอๆ กับเสียงช้อนที่วางลงบนจานรอง
  choices:
    - id: sleep_elsewhere
      label: รับคำ คืนเดือนดับไปนอนที่อื่น
      text: |
        คืนเดือนดับ{name}นอนห้องเช่าเหนือร้านขายเชือก ค่าห้องจ่ายไว้แล้วก่อน{name}ไปถึง เจ้าของร้านไม่ถามชื่อ คืนนั้นไม่มีอะไรเกิดขึ้น {name}หลับยาวจนสาย

        กลับถึงบ้านตอนเที่ยง หลังคาบ้าน{name}เปียกเป็นวงกลมใหญ่วงเดียว กว้างพอให้คนนั่งล้อมได้สิบกว่าคน แดดเที่ยงส่องลงตรงๆ น้ำค้างวงนั้นก็ไม่แห้ง
      effects: { hunted: { star_listeners: -1 }, flags: [slept_elsewhere_for_the_circle] }
    - id: leave_the_tea
      label: ไม่แตะถ้วยชา ลุกออกจากร้าน
      text: |
        ชาในถ้วยของ{name}เย็นอยู่บนโต๊ะ หญิงในถุงมือขาวไม่รั้ง นางพับกระดาษแผ่นนั้นเก็บ แล้วรินชาถ้วยที่สองให้ตัวเอง

        ตั้งแต่วันนั้น{name}เปลี่ยนเวลาตื่น เปลี่ยนทางไปตลาด กินข้าวเที่ยงคนละร้านทุกวันจนถึงคืนเดือนดับ คืนนั้น{name}นอนบ้านตัวเอง ตาค้างจนเกือบสาง บนหลังคามีฝีเท้าเบาๆ หลายคู่เดินวนอยู่เหนือหัว
      effects: { stats: { CON: 1 }, flags: [left_the_tea_untouched] }
    - id: ask_who_wrote_it
      label: ถามนางว่าใครเป็นคนจดบรรทัดพวกนี้
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          นางไม่ตอบ {name}ไม่ต้องรอให้นางตอบ ลายมือเอียงซ้ายในกระดาษเขียนเลขเจ็ดแบบมีขีดคาดกลาง ทั้งถนนมีคนเขียนเลขเจ็ดแบบนั้นคนเดียว คนขายขนมปังหัวมุมที่ทอนเงินให้{name}ทุกเช้า เขาเขียนราคาบนกระดานหน้าร้านด้วยเลขเจ็ดแบบนั้นมาหลายปี

          {name}ซื้อขนมปังร้านนั้นต่อทุกเช้า ทอนเงินกันเหมือนเดิม แต่ตั้งแต่วันนั้นคนขายขนมปังไม่เคยเงยหน้าสบตา{name}อีกเลย
        effects: { stats: { WIS: 1 }, flags: [knew_the_hand_on_the_blue_paper] }
      failure:
        text: |
          นางยิ้ม ตอบว่าไม่มีใครบอก ถนนบอกเอง แล้วเลื่อนกระดาษแผ่นที่สองข้ามโต๊ะมา แผ่นนี้เป็นรายชื่อคนที่{name}คุยด้วยในเดือนนี้ ครบทุกคน เรียงตามวัน

          {name}เดินกลับบ้านทางเดิม เจอคนในรายชื่อนั้นแทบทุกคนตลอดทาง ทักใครไม่ลงสักคน
        effects: { hunted: { star_listeners: 1 }, flags: [shown_the_second_blue_paper] }
    - id: ask_what_they_cannot_hear
      label: ถามนางตรงๆ ว่าวงของนางได้ยินอะไรจากบ้านคนมีตรา
      requires: { trait: curse_brand }
      text: |
        หญิงในถุงมือขาววางถ้วยลง บอกว่าไม่ได้ยินอะไรเลย นั่นแหละเรื่อง บ้านที่มีคนแบบ{name}นอนอยู่เป็นรูเงียบบนหลังคาเมือง ฟังข้ามไปก็เหมือนฟังเพลงที่มีคนเอามืออุดปากคนร้องคนหนึ่งในวง

        นางพูดด้วยเสียงเรียบ ไม่ได้ว่าร้าย พูดแบบที่บอกว่าหลังคาบ้าน{name}รั่ว แล้วนางก็รินชาให้{name}อีกถ้วย ถ้วยที่สองหวานกว่าถ้วยแรก นางเติมน้ำผึ้งให้โดยไม่ต้องถาม
      effects: { stats: { CHA: 1 }, flags: [asked_why_the_circle_cannot_hear_me] }

- id: adult.hunted_listener_at_the_bathhouse
  stage: adult
  weight: 12
  time: night
  once: false
  hunt: star_listeners
  when:
    age: [20, 64]
    not_orgs: [star_listeners]
  text: |
    โรงอาบน้ำสาธารณะปิดตอนสองทุ่ม {name}เป็นคนสุดท้ายในบ่อน้ำร้อน คนเฝ้าโรงเดินดับตะเกียงไปทีละดวงจากปลายห้อง ไอน้ำลอยต่ำจนมองไม่เห็นผนังอีกฝั่ง

    ชายคนหนึ่งนั่งอยู่บนม้านั่งหินตรงทางออก แต่งตัวครบ ไม่ได้มาอาบน้ำ ถุงมือหนังสีขาวไม่เปียกสักหยด บนตักมีกล่องไม้เปิดฝา หลอดแก้วน้ำค้างดาวเรืองแสงสีฟ้าเรียงอยู่ในช่อง เขาถามอย่างสุภาพว่าคืนเดือนดับที่จะถึง{name}จะนอนที่ไหน ผ้าเช็ดตัวของ{name}พาดอยู่บนม้านั่งข้างตัวเขา
  encounter:
    foe: star_listener
    name: ผู้ฟังดาวที่โรงอาบน้ำ
    morale: 2
    beats:
      - text: เขาหยิบหลอดแก้วขึ้นมาหลอดหนึ่ง ชูขึ้นส่องไอน้ำ แสงสีฟ้าทำให้ไอน้ำทั้งห้องเป็นสีเดียวกับน้ำแข็ง
        answer: quick
        moves:
          - id: bath_kick_water
            label: วักน้ำร้อนในบ่อสาดใส่กล่องบนตักเขาเต็มแขน
            kind: quick
            success: น้ำร้อนสาดโดนกล่องไม้เต็มๆ หลอดแก้วสองหลอดร้าวเป็นเส้นเพราะร้อนเย็นชนกัน เขาสะบัดถุงมือที่เปียกโชก รอยยิ้มหายไปครู่หนึ่ง
            failure: เขาเอี้ยวตัวหลบ น้ำร้อนตกลงบนพื้นหินเปล่า หลอดในมือเขาลอยมาแตกที่ขอบบ่อ ไอเย็นแผ่ลงน้ำ น้ำรอบขา{name}เย็นเฉียบจนกล้ามน่องเกร็งเป็นก้อน
          - id: bath_bang_the_bucket
            label: เอาขันทองเหลืองทุบขอบถังน้ำให้เสียงก้องทั้งโรง
            kind: attack
            tags: [noise]
            success: เสียงทองเหลืองก้องไปทั้งโรงอาบน้ำ สะท้อนผนังหินกลับมาสามรอบ ชายในถุงมือขาวยกมือปิดหูทั้งสองข้าง หลอดแก้วเกือบหลุดจากนิ้ว
            failure: ขันลื่นสบู่หลุดมือ ตกลงในบ่อเงียบๆ เขาโยนหลอดแก้วมาแตกที่ขั้นบันไดบ่อ ไอเย็นเกาะข้อเท้า{name}เป็นเกล็ดขาว
          - id: bath_stay_low
            label: จมตัวลงในน้ำร้อนจนถึงคาง ไม่ขึ้นจากบ่อ
            kind: guard
            failure: น้ำร้อนกันไอเย็นได้ไม่นาน หลอดแก้วที่เขาวางไว้บนขอบบ่อแตกเอง ผิวน้ำรอบตัว{name}เย็นลงทีละน้อยจนฟันกระทบกัน
          - id: bath_towel_and_go
            label: คว้าผ้าเช็ดตัวจากข้างตัวเขา แล้ววิ่งไปทางประตูหลัง
            kind: flee
            failure: มือคว้าผ้าเช็ดตัวได้ แต่เท้าเปียกลื่นบนพื้นหิน {name}ล้มเข่ากระแทกขอบทางเดิน เขาไม่ลุกตาม แค่วางหลอดแก้วลงบนพื้นให้กลิ้งมาหยุดที่เข่า{name} แล้วแตก
      - text: เขาปิดฝากล่อง วางมือทั้งสองข้างบนฝา แล้วถามคำถามเดิมอีกรอบ ช้ากว่าเดิม คืนเดือนดับจะนอนที่ไหน
        answer: talk
        moves:
          - id: bath_lie_about_the_night
            label: บอกว่าคืนนั้นจะไปนอนบ้านคนรู้จักนอกเมือง
            kind: talk
            failure: เขาหยิบสมุดเล่มเล็กออกจากอกเสื้อ อ่านชื่อคนรู้จักของ{name}ให้ฟังทีละชื่อ ไม่มีใครอยู่นอกเมืองสักคน ระหว่างที่อ่าน เขาวางหลอดแก้วไว้ที่ขอบบ่อ หลอดแตก น้ำในบ่อเย็นลงจนปาก{name}ซีด
          - id: bath_shout_for_the_keeper
            label: ตะโกนเรียกคนเฝ้าโรงให้มาจุดตะเกียง
            kind: talk
            tags: [noise]
            success: เสียงตะโกนก้องผนังหิน คนเฝ้าโรงตะโกนตอบมาจากห้องหน้า ฝีเท้าเดินเข้ามา ชายในถุงมือขาวหันไปทางเสียงแล้วหลับตาแน่น ขมับเต้นตุบให้เห็น
            failure: เสียงหายไปในไอน้ำ คนเฝ้าโรงไม่ตอบ คงกลับบ้านไปแล้ว ชายในถุงมือขาวรอให้เสียงสุดท้ายจางหมด แล้วเปิดกล่องใหม่ หลอดหนึ่งตกแตกข้างมือ{name} นิ้วชาไปถึงข้อ
          - id: bath_answer_truthfully
            label: บอกเขาตรงๆ ว่าจะนอนที่ไหน แล้วถามว่าเขาจะเอาอะไรจากคืนนั้น
            kind: talk
            parley: true
            failure: เขาจดคำตอบลงสมุด แต่ไม่ตอบคำถามข้อหลัง ปากกาเขียนต่อไปเรื่อยๆ หลอดแก้วที่วางข้างสมุดกลิ้งตกพื้นแตก ไอเย็นขึ้นมาถึงเข่า
          - id: bath_read_his_hands
            label: ดูมือในถุงมือขาว หาว่ามือเขาสั่นตอนไหน
            kind: read
            stat: WIS
            failure: ถุงมือขาวนิ่งทุกนิ้ว เป็นมือที่ฝึกมาไม่ให้บอกอะไรใคร {name}จ้องจนตาแสบไอน้ำ ไม่ทันเห็นหลอดแก้วที่เขาปาลงน้ำตรงหน้า น้ำเย็นเฉียบขึ้นมาถึงอก
          - id: bath_climb_out_the_vent
            label: ปีนช่องระบายไอน้ำเหนือบ่อออกไปทางหลังคา
            kind: flee
            failure: ขอบช่องระบายลื่นตะไคร่ {name}ปีนได้ครึ่งตัวแล้วไถลลงมาฟาดขอบบ่อ ศอกถลอกเป็นทางยาวเท่าฝ่ามือ
      - text: เขาลุกขึ้นช้าๆ เปิดกล่องทั้งกล่อง ยกขึ้นเหนือบ่อ หลอดแก้วทุกหลอดเรืองแสงสว่างขึ้นพร้อมกัน ผิวน้ำรอบตัว{name}เริ่มจับเป็นเกล็ดบาง
        answer: attack
        moves:
          - id: bath_dump_the_bucket
            label: ยกถังน้ำร้อนข้างบ่อ เทใส่กล่องในมือเขา
            kind: attack
            success: น้ำร้อนทั้งถังราดลงกล่อง หลอดแก้วแตกพร้อมกันเป็นเสียงกรอบแกรบ ไอขาวพุ่งขึ้นจนมองไม่เห็นตัวเขา พอไอจาง เขายืนถือกล่องเปล่า ถุงมือข้างหนึ่งหลุดไปแล้ว
            failure: ถังหนักกว่าแรงที่เหลือ น้ำร้อนหกลงเท้าตัวเองครึ่งถัง อีกครึ่งราดพื้นหิน กล่องในมือเขาไม่เปียกสักหยด เขาเทหลอดลงบ่อสามหลอด น้ำเย็นจัดจนกระดูกปวด
          - id: bath_bang_the_pipes
            label: เอาขันทุบท่อทองแดงที่ส่งน้ำร้อนเข้าบ่อ
            kind: attack
            tags: [noise]
            success: ท่อทองแดงส่งเสียงก้องไปทั้งตึกแบบระฆังร้าว ชายในถุงมือขาวทำกล่องเอียง หลอดแก้วไหลลงพื้นแตกกระจาย เขาก้มลงเก็บด้วยมือที่สั่น
            failure: ท่อร้อนจัด {name}ปล่อยมือทันทีที่แตะ ฝ่ามือพองแดงเป็นแนว ขันกลิ้งลงบ่อ
          - id: bath_wrap_and_wait
            label: พันผ้าเช็ดตัวรอบตัว ยืนชิดผนังที่ร้อนที่สุด
            kind: guard
            failure: ผนังร้อนกันได้แค่หลัง ไอเย็นมาทางหน้า ผ้าเช็ดตัวเปียกแข็งเป็นแผ่นติดตัว ปลายนิ้วของ{name}ขาวซีดจนงอไม่ลง
          - id: bath_out_the_back
            label: ดำน้ำลอดใต้ราวกั้นไปขึ้นอีกฝั่ง แล้วออกทางประตูหลัง
            kind: flee
            failure: ราวกั้นใต้น้ำต่ำกว่าที่คิด {name}เอาหัวโขกเหล็กจนตาพร่า โผล่ขึ้นมาที่เดิม หน้าผากปูดเท่าไข่นก
    win:
      text: |
        ชายในถุงมือขาวปิดฝากล่องเปล่า เก็บถุงมือที่หลุดขึ้นมาจากพื้นเปียก บิดน้ำออก แล้วสวมกลับไปเปียกๆ อย่างนั้น เขาบอกว่าคืนนี้ฟังอะไรไม่ได้แล้ว หูยังอื้ออยู่ แล้วเดินออกทางประตูหน้า

        คนเฝ้าโรงมาเจอ{name}นั่งอยู่ขอบบ่อตอนจะปิดประตูใหญ่ เขาบ่นเรื่องเศษแก้วในบ่อกับน้ำที่เย็นผิดเวลา พรุ่งนี้ต้องต้มใหม่ทั้งบ่อ
      effects: { hunted: { star_listeners: -1 }, flags: [drove_the_listener_from_the_bathhouse] }
    parley:
      text: |
        เขาจดที่ที่{name}บอกลงสมุด แล้วตอบคำถามข้อหลังด้วยประโยคเดียว คืนเดือนดับวงต้องการหลังคาที่ไม่มีใครนอนอยู่ข้างใต้ แค่นั้น เขาขอให้{name}ไปนอนที่อื่นหนึ่งคืน แล้ววางเหรียญเงินไว้บนม้านั่งหนึ่งเหรียญเป็นค่าห้อง

        คืนเดือนดับ{name}ไปนอนที่อื่นตามที่ว่า เช้าวันต่อมากลับถึงบ้าน บนขั้นบันไดหน้าประตูมีหลอดแก้วเปล่าหลอดหนึ่งวางอยู่ตรงกลางขั้นพอดี แบบของที่มีคนลืมไว้
      effects: { gold: 1, hunted: { star_listeners: -1 }, flags: [told_the_listener_where_i_would_sleep] }
    flee:
      text: |
        {name}ออกมาถึงถนนตัวเปียกโชก ผ้าเช็ดตัวผืนเดียวพันตัวไว้ เสื้อผ้า รองเท้า กับย่ามอยู่ในโรงอาบน้ำทั้งหมด ไอน้ำลอยออกจากตัวเป็นควันบางๆ ในลมกลางคืน

        เช้าวันรุ่งขึ้นคนเฝ้าโรงเอาเสื้อผ้ามาคืนถึงบ้าน พับเรียบร้อย บอกว่าสุภาพบุรุษคนหนึ่งฝากมา รองเท้าสองข้างเช็ดสะอาดกว่าที่{name}เคยเช็ดเอง
      effects: { flags: [ran_from_the_bathhouse_in_a_towel] }
    lose:
      text: |
        {name}ขึ้นจากบ่อไม่ไหว ขาเย็นจนสั่งไม่ได้ ชายในถุงมือขาวช่วยดึงขึ้นมานั่งบนม้านั่ง ห่มผ้าเช็ดตัวให้ แล้วถามคำถามเดิมอีกรอบ {name}ได้ยินเสียงตัวเองตอบ แต่ไม่รู้ว่าตอบไปว่าอะไร

        ตอนคนเฝ้าโรงมาปลุก ในมือ{name}มีบัตรหมึกสีน้ำเงินใบหนึ่ง เขียนชื่อที่ที่{name}จะนอนคืนเดือนดับด้วยลายมือเอียงซ้าย ข้างใต้มีคำว่าขอบคุณ
      effects: { flags: [told_the_listener_without_knowing] }
    stalemate:
      text: |
        ระฆังเที่ยงคืนของวิหารดังมาถึงโรงอาบน้ำ ชายในถุงมือขาวปิดฝากล่องทันทีที่ได้ยินเสียงแรก บอกว่าคืนนี้หมดเวลาแล้ว คืนเดือนดับยังมาไม่ถึง ไม่ต้องรีบ

        เขาเดินออกไปทางประตูหน้า ทิ้งรอยเท้าไว้บนพื้นหินเปียกเป็นแถว รอยเท้าแห้งทุกรอย
      effects: { flags: [sat_out_the_listener_at_the_bathhouse] }

- id: adult.hunted_listeners_way_down
  stage: adult
  scene: workshop
  weight: 20
  when:
    age: [20, 64]
    min_hunted: { star_listeners: 1 }
    not_orgs: [star_listeners]
  text: |
    เรื่องแรกคือรองเท้าหน้าประตู มีคนจัดให้เป็นคู่ หัวหันออกถนน เรื่องที่สองคือไส้ตะเกียงในบ้าน มีคนตัดให้เรียบกว่าที่{name}เคยตัดเอง เรื่องที่สามคือจดหมาย ทุกฉบับมาถึงไม่ช้าสักวัน แต่มาพร้อมรอยพับที่ไม่ตรงกับรอยเดิม ไม่มีอะไรหาย ไม่มีอะไรพัง

    หญิงช่างทองแดงร้านหัวถนนเป็นคนบอก นางพูดเสียงดังเพราะหูข้างหนึ่งดับไปกับเสียงค้อน คนพวกถุงมือขาวไม่ยอมเดินผ่านหน้าร้านนาง เสียงค้อนตีทองแดงทั้งวันทำให้พวกนั้นปวดหัว คนที่โดนพวกนั้นตามมีทางออกสามทาง ห้องเหนือร้านนางว่างอยู่ ค่าเช่าคือช่วยตีกาน้ำ ทางที่สอง ย้ายไปอยู่ย่านที่ประตูครึ่งถนนมีดาวชอล์ก วงของพวกนั้นไม่นั่งฟังที่นั่น ทางที่สาม พวกนั้นจดทุกอย่าง จดหนี้ด้วย เอาห้าเหรียญไปวางที่ร้านแว่นตาหลังตลาด บอกว่าค่าหมึก ชื่อจะโดนขีดออกหนึ่งบรรทัด

    นางตีค้อนลงทองแดงทุกครั้งที่เว้นวรรค
  choices:
    - id: room_above_the_coppersmith
      label: ขึ้นไปอยู่ห้องเหนือร้านทองแดง ตีกาน้ำแทนค่าเช่า
      check: { stat: CON, dc: 13 }
      success:
        text: |
          ห้องเหนือร้านทองแดงร้อนแบบอยู่ในเตา เสียงค้อนขึ้นมาตามพื้นไม้ตั้งแต่ก่อนสางจนมืด {name}ตีกาน้ำจนแขนขวาใหญ่กว่าแขนซ้าย นิ้วชาไปทั้งเดือนแรก แล้วก็หายชา

          ปลายฤดู ไม่มีใครจัดรองเท้าให้อีก ไส้ตะเกียงยาวไม่เท่ากันตามที่{name}ตัดเอง จดหมายฉบับล่าสุดมาถึงพร้อมรอยพับเดียว รอยพับของคนส่ง
        effects: { stats: { CON: 1 }, hunted: { star_listeners: -2 }, flags: [beat_copper_above_the_shop] }
      failure:
        text: |
          เสียงค้อนไม่หยุดแม้ตอนหลับ ลงไปถึงฟัน ลงไปถึงฝัน {name}ปวดหัวจนอาเจียนกลางดึกสองครั้ง หญิงช่างทองแดงต้มน้ำขิงให้ บอกว่าคนหูดีอยู่ที่นี่ไม่ค่อยรอด

          {name}อยู่ได้ไม่ครบฤดู แต่ก็นานพอให้รองเท้าหน้าประตูกลับไปเกะกะอย่างที่{name}ถอดทิ้งไว้
        effects: { hp: -1, hunted: { star_listeners: -1 }, flags: [could_not_sleep_through_the_hammers] }
    - id: live_among_the_chalk_stars
      label: ย้ายไปเช่าห้องในย่านที่ประตูครึ่งถนนมีดาวชอล์ก
      text: |
        ย่านนั้นอยู่ท้ายเมือง ถนนแคบ ประตูบ้านทุกบานที่สองมีดาวปูนขาวระดับเข่า บางดวงล้างแล้ว บางดวงไม่มีใครล้าง คนที่นั่นทักกันด้วยชื่อ ไม่มีใครถามว่า{name}ย้ายมาทำไม เด็กมีเขาห้องข้างๆ เอาขนมปังมาแลกเกลือตั้งแต่วันแรก

        ทั้งฤดูไม่มีคนสวมถุงมือขาวเดินผ่านถนนนั้น มีแต่วันอัสเทลวันเดียว มีคนมาเขียนดาวดวงใหม่ทับดวงเก่า ก้มหน้าทำเร็วๆ แล้วรีบเดินออกไป มือข้างหนึ่งกดหูไว้ตลอดทาง
      effects: { hunted: { star_listeners: -1 }, flags: [moved_among_the_chalk_stars] }
    - id: pay_for_the_ink
      label: เอาห้าเหรียญไปวางที่ร้านแว่นตา บอกว่าเป็นค่าหมึก
      requires: { min_gold: 5 }
      text: |
        ร้านแว่นตาหลังตลาดแขวนเลนส์ไว้เต็มหน้าต่าง คนในร้านไม่ถามว่าค่าหมึกอะไร เขานับเหรียญห้าเหรียญด้วยแหนบทองเหลือง ไม่แตะด้วยนิ้ว แล้วหยิบสมุดปกผ้าสีน้ำเงินออกจากลิ้นชัก เปิดหาจนเจอชื่อ{name} ลากเส้นทับสองเส้นด้วยหมึกสีเดียวกับที่เขียน

        ก่อน{name}ออกจากร้าน เขายื่นแว่นอ่านหนังสือให้ลองอันหนึ่ง บอกว่าไม่คิดเงิน {name}ไม่ลอง ตอนผลักประตูออก เลนส์ทั้งหน้าต่างส่องหน้า{name}กลับมาเป็นร้อยหน้า แต่ละหน้าเล็กเท่าเล็บมือ
      effects: { gold: -5, hunted: { star_listeners: -2 }, flags: [paid_the_ink_at_the_opticians] }

# ---------- ลัทธิเถ้า ----------
- id: adult.hunted_two_coals
  stage: adult
  scene: home
  weight: 15
  hunt: ash_cult
  when:
    age: [20, 64]
    not_orgs: [ash_cult, wardens]
  text: |
    ถ่านสองก้อนวางอยู่บนธรณีประตูบ้าน{name}ตอนเช้า ห่างกันหนึ่งฝ่ามือพอดี ก้อนหนึ่งอุ่น วางมือเหนือก้อนนั้นยังได้ไอร้อนขึ้นมาถึงฝ่ามือ อีกก้อนเย็นสนิท เปียกน้ำค้าง ไม่มีใครเห็นว่าใครเอามาวาง

    ก่อนเที่ยงคนทั้งถนนรู้ หญิงข้างบ้านที่เคยมายืมเกลือเดินอ้อมไปอีกฝั่งถนน เด็กๆ เลิกเตะลูกหนังหน้าบ้าน{name} ชายแก่ที่นั่งซ่อมแหอยู่หัวถนนบอก{name}โดยไม่เงยหน้าจากแห ถ่านสองก้อนแปลว่าหนี เขาไม่ถามว่า{name}ไปทำอะไรให้กองไหน เขาถามแค่ว่าจะไปทางไหน เผื่อมีใครมาถาม จะได้ชี้ไปอีกทาง
  choices:
    - id: run_as_told
      label: หนีตามที่ถ่านบอก ก่อนมืด
      text: |
        {name}เก็บของได้หนึ่งย่าม ที่เหลือทิ้งไว้ตามที่วาง ชามข้าวเช้ายังไม่ได้ล้าง ก่อนพลบ{name}ออกจากถนนนั้นทางท่อระบายน้ำหลังตลาด ไปขอนอนโรงม้าของคนที่ไม่เคยรู้จักกัน

        ครึ่งเดือนต่อมามีคนเล่าให้ฟังว่าบ้านหลังนั้นไม่มีอะไรไหม้ ของทุกชิ้นอยู่ครบ แต่ที่ธรณีประตูมีรอยดำเป็นวงสองวง ห่างกันหนึ่งฝ่ามือ เจ้าของคนต่อมาขัดเท่าไรก็ไม่ออก
      effects: { gold: -2, hunted: { ash_cult: -1 }, flags: [ran_when_the_two_coals_came] }
    - id: keep_watch_with_water
      label: ไม่หนี ตั้งโอ่งน้ำไว้หลังประตู นั่งเฝ้าทั้งคืน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}นั่งหลังประตูบนเก้าอี้ไม้ โอ่งน้ำเต็มอยู่ข้างตัว ขันลอยอยู่ในโอ่ง ตีสามมีแสงแดงลอดใต้ประตูเข้ามา กลิ่นกำมะถันตามมาเป็นเส้น {name}เปิดประตูแล้วสาดน้ำทั้งขันลงบนชามไฟที่วางอยู่บนธรณีประตู ไฟดับเสียงฉ่า

          ชายที่ถือชามยืนงงอยู่ตรงนั้น ตาปรือแบบคนเพิ่งตื่น เขามองชามเปียกในมือ มองหน้า{name} แล้วถามว่าที่นี่ถนนอะไร {name}บอกชื่อถนนให้ เขาเดินจากไปช้าๆ ทางที่มา กอดชามไฟที่ดับแล้วไว้แนบอก
        effects: { stats: { CON: 1 }, flags: [doused_the_bowl_on_my_step] }
      failure:
        text: |
          {name}หลับไปตอนไหนไม่รู้ ศีรษะพิงโอ่ง ตื่นมาเพราะควัน ธรณีประตูลุกเป็นเปลวเตี้ยๆ ไปตามแนวไม้ เปลวสีเหลืองปนเขียว {name}วักน้ำสาดจนหมดโอ่ง ไฟถึงยอมดับ หลังมือข้างหนึ่งพองไปทั้งแถบ

          เช้านั้นธรณีประตูดำเป็นแนวยาว ตรงกลางแนวดำมีถ่านสองก้อนวางอยู่ใหม่ ห่างกันหนึ่งฝ่ามือ ก้อนหนึ่งอุ่น อีกก้อนเย็น
        effects: { hp: -2, flags: [the_door_burned_at_the_sill] }
    - id: take_the_coals_to_the_temple
      label: ห่อถ่านทั้งสองก้อนด้วยผ้า เอาไปให้ศาสนจักรตะเกียงดู
      requires: { not_orgs: [star_listeners] }
      text: |
        นักบวชที่วิหารเปิดผ้าดูถ่านแล้วห่อกลับให้อย่างเดิม เขาจดชื่อถนนกับชื่อ{name} บอกว่าคืนนี้จะส่งคนไปเดินผ่านหน้าบ้านสองรอบ ถ่านให้ทิ้งไว้ที่วิหาร ศาสนจักรเก็บถ่านแบบนี้ไว้ในลิ้นชักเฉพาะ

        คืนนั้นนักล่าแม่มดเดินผ่านหน้าบ้านจริงสองรอบ รอบแรกตอนสองทุ่ม รอบที่สองตอนเที่ยงคืน ระหว่างสองรอบนั้น{name}นั่งฟังฝีเท้าทุกคู่ที่ผ่านหน้าบ้าน นับได้สิบเจ็ดคู่ ไม่มีคู่ไหนหยุด
      effects: { reputation: { lamp_church: 1 }, flags: [took_the_two_coals_to_the_temple] }
    - id: give_the_coals_back
      label: เอาถ่านไปวางคืนที่ธรณีประตูบ้านที่เคยนั่งล้อมชามด้วยกัน
      requires: { flag: left_the_ash_cult }
      text: |
        {name}รู้ว่าบ้านไหน เพราะเคยนั่งล้อมชามอยู่ในบ้านนั้นมาหลายคืน ก่อนสาง{name}วางถ่านสองก้อนคืนบนธรณีประตูบ้านหลังนั้น ห่างกันหนึ่งฝ่ามือ ตอนนั้นทั้งสองก้อนเย็นเท่ากันแล้ว

        วันรุ่งขึ้นบ้านหลังนั้นว่าง ประตูแง้มอยู่ กลางพื้นครัวมีชามเหล็กใบหนึ่งคว่ำไว้ ข้างใต้ไม่มีถ่าน ไม่มีเถ้า ตั้งแต่วันนั้นไม่มีอะไรมาวางที่ธรณีประตูบ้าน{name}อีก
      effects: { stats: { WIS: 1 }, hunted: { ash_cult: -1 }, flags: [gave_the_two_coals_back] }

- id: adult.hunted_ash_cultist_at_the_door
  stage: adult
  scene: home
  weight: 12
  time: night
  once: false
  hunt: ash_cult
  when:
    age: [20, 64]
    not_orgs: [ash_cult, wardens]
  text: |
    สิ่งที่ปลุก{name}กลางดึกไม่ใช่เสียง เป็นกลิ่นกำมะถัน ในความมืดมีแสงแดงคล้ำลอดใต้ประตูเข้ามาเป็นแถบ แถบแสงนั้นไม่ไหวแบบแสงตะเกียง นิ่งแบบถ่านที่คุมาทั้งคืน

    ชายคนหนึ่งยืนอยู่บนธรณีประตู มือข้างหนึ่งถือชามไฟเหล็ก อีกข้างพันด้ายแดงสามรอบที่ข้อมือ เสื้อคลุมขลิบแดงเปื้อนเถ้า เขาไม่ได้พังประตู ประตูเปิดอยู่แล้ว {name}จำไม่ได้ว่าลงกลอนหรือเปล่า เขาพูดเสียงต่ำ ประโยคเดียว เจ้าของบ้านจำคนที่หันหลังได้ทุกคน
  encounter:
    foe: ash_cultist
    name: คนของกองที่ธรณีประตู
    morale: 2
    beats:
      - text: เขาเอียงชามไฟ ถ่านคุก้อนหนึ่งไหลมาอยู่ที่ขอบชาม พร้อมจะสาด
        answer: quick
        moves:
          - id: door_sidestep
            label: เบี่ยงตัวหลบไปชิดกรอบประตู ให้ถ่านสาดลงพื้นเปล่า
            kind: quick
          - id: door_water_jar
            label: คว้าโอ่งน้ำดื่มข้างประตู สาดใส่ชามไฟทั้งโอ่ง
            kind: item
            stat: DEX
            tags: [water]
            success: น้ำทั้งโอ่งราดลงชาม เสียงฉ่าดังลั่น ไอน้ำขาวพุ่งขึ้นเต็มกรอบประตู ไฟในชามวูบลงเหลือแต่ถ่านก้อนกลางที่ยังแดง ชายคนนั้นถอยหนึ่งก้าว ตาปรือลงครู่หนึ่งแบบคนเพิ่งตื่นจากหลับลึก
          - id: door_slam
            label: กระแทกบานประตูปิดใส่เขาเต็มแรง
            kind: attack
          - id: door_blanket
            label: ดึงผ้าห่มขึ้นคลุมตัว ยืนกันระหว่างเขากับห้องใน
            kind: guard
          - id: door_out_the_window
            label: ปีนหน้าต่างหลังบ้านออกไป
            kind: flee
      - text: เขาก้าวข้ามธรณีประตูเข้ามาหนึ่งก้าว ฝ่ามือข้างที่ว่างแบออก กลางฝ่ามือมีรอยไหม้รูปวงกลม แดงขึ้นทีละน้อยแบบเหล็กที่เพิ่งออกจากเตา แล้วยื่นมือนั้นเข้ามาหาไหล่{name}ช้าๆ
        answer: guard
        moves:
          - id: door_send_word_back
            label: บอกเขาว่าคนที่หันหลังไปแล้วไม่มีอะไรเหลือให้เจ้าของบ้านเอาไป
            kind: talk
            parley: true
          - id: door_stand_your_ground
            label: ยืนนิ่งไม่ถอย เอาผ้าพันแขนแล้วยกขึ้นรับ
            kind: guard
          - id: door_wet_rag
            label: คว้าผ้าเช็ดจานเปียกฟาดใส่ฝ่ามือนั้น
            kind: attack
            tags: [water]
            success: ผ้าเปียกฟาดลงกลางฝ่ามือเสียงดังเปาะ ควันขาวพุ่งขึ้นจากรอยไหม้ เขาสะบัดมือกลับไปกำไว้แนบอก ปากขมุบขมิบนับอะไรบางอย่าง
          - id: door_back_door
            label: วิ่งออกประตูหลังบ้าน
            kind: flee
      - text: เขาไม่พูดอีก ยกชามไฟขึ้นเหนือหัว เป่าเถ้าในฝ่ามือออกมาเป็นม่านเทา หลังม่านนั้นถ่านในชามแดงขึ้นเรื่อยๆ จนผนังบ้านเป็นสีเดียวกับไฟ
        answer: attack
        moves:
          - id: door_rain_barrel
            label: ผลักถังรองน้ำฝนข้างประตูให้ล้มใส่เขา
            kind: attack
            tags: [water]
            success: ถังไม้ล้มโครม น้ำฝนค้างถังทะลักใส่เขาทั้งตัว ชามไฟหลุดมือกลิ้งไปตามพื้น ถ่านดับทีละก้อนในแอ่งน้ำ
          - id: door_duck_under
            label: ก้มลอดใต้ชามเข้าไปชนเขาที่เอว
            kind: quick
          - id: door_brace_with_stool
            label: ยกเก้าอี้ไม้ขึ้นกันหน้า
            kind: guard
          - id: door_run_into_the_street
            label: วิ่งผ่านเขาออกไปกลางถนน ตะโกนเรียกเพื่อนบ้าน
            kind: flee
    win:
      text: |
        ไฟในชามดับสนิท เถ้าเปียกเป็นโคลนดำเปื้อนพื้น ชายคนนั้นยืนงงอยู่บนธรณีประตู มองชามเปียกในมือ แล้วมองไปรอบบ้านของ{name}ทีละมุม ถามว่านี่บ้านใคร {name}ไม่ตอบ เขาวางชามลงบนพื้นเบาๆ แล้วเดินจากไปโดยไม่เอาชามไปด้วย

        ชามเหล็กใบนั้น{name}เอาไปโยนลงคลองตอนสาง ด้ายแดงที่ติดอยู่ขอบชามลอยไปตามน้ำได้ไกลกว่าชาม
      effects: { hunted: { ash_cult: -1 }, flags: [doused_the_bowl_at_my_door] }
    parley:
      text: |
        เขาฟังจนจบ ชามไฟในมือนิ่ง ถ่านค่อยๆ หรี่เป็นสีส้มหม่น เขาบอกว่าจะเอาคำนี้ไปบอกเจ้าของบ้าน ไม่รับปากว่าเจ้าของบ้านจะเชื่อ แล้วถอยออกจากธรณีประตูไปทีละก้าว ไม่หันหลังให้{name}จนพ้นรั้ว

        ตอนสาง บนธรณีประตูมีรอยเถ้าเส้นเดียวขีดขวางไว้ แบบที่คนขีดฆ่าบรรทัดหนึ่งในบัญชี
      effects: { hunted: { ash_cult: -1 }, flags: [sent_word_back_to_the_owner_of_the_house] }
    flee:
      text: |
        {name}วิ่งพ้นสามถนนถึงหยุดหายใจ เท้าเปล่าเปื้อนเถ้า มองย้อนกลับไปไม่เห็นแสงไฟ ไม่เห็นควัน ไม่มีใครวิ่งตาม

        กลับไปตอนสาง บ้านยังอยู่ครบ ไม่มีอะไรไหม้ ของทุกชิ้นอยู่ที่เดิม มีแต่ผ้าห่มบนเตียงที่ใครสักคนพับไว้ให้ กลางผ้าห่มมีรอยไหม้รูปฝ่ามือหนึ่งรอย
      effects: { flags: [fled_the_bowl_at_my_door] }
    stalemate:
      text: |
        ไก่ตัวแรกขัน ชายคนนั้นหยุดทันที เอียงหูไปทางเสียงไก่ครู่หนึ่ง แล้วคลุมชามไฟด้วยชายเสื้อ ถอยออกจากธรณีประตู แล้วเดินหายไปในหมอกเช้า

        {name}ยืนอยู่กลางบ้านจนฟ้าสว่าง ผนังด้านที่หันหาประตูมีเขม่าเป็นรอยโค้งยาวเท่าวงแขน ตรงที่ไฟในชามส่องถึง
      effects: { flags: [held_the_door_until_cockcrow] }
    lose:
      text: |
        เถ้าเข้าตาจนมองไม่เห็น มือร้อนกดลงบนไหล่จนเข่าทรุด {name}นอนอยู่บนพื้นบ้านตัวเองจนสว่าง ไม่รู้ว่าเขาไปตอนไหน

        แผลที่ไหล่พองเป็นรูปฝ่ามือ ห้านิ้วครบ ใครเห็นก็รู้ว่าเป็นรอยอะไร เพื่อนบ้านที่เห็นเลิกทักไปทีละคน
      effects: { flags: [the_owner_of_the_house_left_a_hand_on_me] }
    death:
      text: |
        ถ่านในชามสาดออกมาทั้งชาม ผ้าห่มติดไฟก่อน แล้วผนัง แล้วหลังคา คนทั้งถนนออกมายืนดูพร้อมถังน้ำในมือ ไม่มีใครเดินเข้าไปใกล้กว่าธรณีประตู

        ตอนสาง บนธรณีประตูที่ไหม้ดำมีถ่านสองก้อนวางอยู่ ห่างกันหนึ่งฝ่ามือ
