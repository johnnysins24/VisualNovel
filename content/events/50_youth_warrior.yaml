# วัยหนุ่มสาว 15–17 ทางนักรบ (class: warrior)
# สองเรื่องแรกใช้ได้ทุกทางนักรบ เขียนไม่ระบุถิ่น คำว่า "หัวหน้า" ใช้แทนครูฝึกของทุกทาง
# อีกสามเรื่องผูกกับทางจากพิธี: path_wardens (ป้อมสาม) path_coal_guard (ยามคุมเกวียนถ่าน) path_navy (ราชนาวี)
# ทางเฝ้าบันไดของเอลฟ์กับค้อนตระกูลคนแคระได้แค่สองเรื่องแรก
# ตายได้จุดเดียวในไฟล์นี้: youth.warrior_ash_hounds ตัวเลือก chase_alone ทางที่พลาด

- id: youth.warrior_fever_comrade
  stage: youth
  weight: 30
  when:
    age: [15, 16]
    class: warrior
    not_flags: [path_ladder_guard]
  text: |
    คนที่เข้าเวรคู่กับ{name}มาตั้งแต่วันแรก ทุกคนเรียกว่าเจ้าตัวโต ไหล่กว้างกว่า{name}ครึ่งช่วงแขน หัวเราะเสียงดังจนหัวหน้าต้องหันมาดุ และเป็นคนเดียวที่แบ่งของกินให้โดยไม่ต้องขอ

    ต้นหนาว เจ้าตัวโตเริ่มไอ ไอแห้งๆ ตอนเช้า บ่ายก็หาย ไม่มีใครคิดว่าเป็นเรื่องใหญ่ วันที่สามเขายกของที่เคยยกได้มือเดียวไม่ขึ้น วันที่ห้าเขาไม่ตื่นมาเข้าเวร

    หมอมาดูตอนเย็น วางหูแนบอกฟังเสียงหายใจ แล้วบอกหัวหน้าเบาๆ ว่าไม่ต้องจัดเวรให้คนนี้แล้ว คืนนั้น{name}นั่งอยู่ข้างที่นอนของเจ้าตัวโตจนเสียงหายใจหยุด ก่อนสว่างมีคนมาบอกว่าศพต้องส่งกลับบ้าน บ้านเขาอยู่ไกลออกไปสองวันเดิน
  choices:
    - id: carry_home
      label: อาสาลากศพกลับไปส่งถึงบ้านเขาเอง
      check: { stat: CON, dc: 12 }
      success:
        text: |
          เกวียนมือของคลังเก็บของล้อหนึ่งคด ลากไปได้ทีละไม่กี่ร้อยก้าวก็ต้องหยุดงัดล้อ ฝนตกตลอดวันที่สอง {name}เอาผ้าคลุมของตัวเองห่มศพทับผ้าของคลังอีกชั้น แล้วเดินต่อทั้งที่เสื้อเปียกจนติดหลัง

          บ้านเจ้าตัวโตเป็นบ้านหลังเล็ก มีเด็กห้าคนยืนเรียงกันที่ประตู แม่ของเขาไม่ร้องไห้ต่อหน้า{name} แกต้มน้ำ หยิบขนมปังก้อนเดียวที่มีอยู่มาแบ่งให้ แล้วถามว่าลูกชายแกกินอิ่มไหมตอนอยู่ที่นั่น

          {name}บอกว่าอิ่มทุกมื้อ แกพยักหน้า แล้วรินน้ำร้อนเพิ่มให้อีกถ้วย
        effects: { stats: { CON: 1, STR: 1 }, alignment: { moral: 1 }, flags: [carried_comrade_home] }
      failure:
        text: |
          ขาหมดแรงที่ท่าข้ามในวันที่สอง คนพายเรือข้ามฟากต้องช่วยยกเกวียนขึ้นฝั่ง แล้วบอกให้นั่งพักก่อน {name}นั่งลงพิงล้อเกวียน ตั้งใจจะพักแค่ครู่เดียว ลืมตาอีกทีก็ค่ำแล้ว

          พี่ชายของเจ้าตัวโตเดินมาเจอที่ท่าข้าม เขาได้ข่าวจากคนส่งของที่ผ่านไปก่อน เขาลากเกวียนต่อเองที่เหลือครึ่งทาง ไม่ให้{name}ช่วย แต่ให้เดินตามไปจนถึงบ้าน
        effects: { stats: { STR: 1 }, hp: -1, alignment: { moral: 1 }, flags: [carried_comrade_home] }
    - id: double_watch
      label: เข้าเวรแทนเขาในคืนนั้น ให้คนอื่นจัดการเรื่องศพ
      text: |
        {name}ยืนเวรของตัวเองจนหมดกะ แล้วยืนต่อในที่ของเจ้าตัวโต ไม่มีใครมาเปลี่ยน เพราะในตารางเวร ชื่อของเขายังไม่มีใครขีดออก

        ตอนสางหัวหน้าเดินผ่าน หยุดดูอยู่ครู่หนึ่ง แล้วเดินต่อ บ่ายวันนั้นตารางเวรใหม่ติดอยู่หน้าประตู ชื่อ{name}ย้ายไปอยู่ในกะที่หัวหน้าเข้าเอง
      effects: { stats: { CON: 1 }, alignment: { law: 1 }, flags: [trusted_on_watch] }
    - id: keep_token
      label: ขอเก็บของติดตัวของเขาไว้ชิ้นหนึ่ง ก่อนศพจะไป
      text: |
        ของติดตัวของเจ้าตัวโตมีแค่ถุงผ้าใบเดียว ข้างในมีหวีไม้ซี่หัก เชือกขดหนึ่ง กับไม้แกะรูปหมาตัวเท่านิ้วโป้งที่ยังแกะไม่เสร็จ ขาหลังยังเป็นเนื้อไม้ทื่อๆ ติดกันอยู่

        {name}ขอเก็บหมาไม้ตัวนั้นไว้ ไม่มีใครว่าอะไร หลายเดือนต่อมา มีดพับของ{name}ก็ยังวางอยู่ข้างมัน {name}หยิบขึ้นมาหลายครั้ง แต่ยังไม่กล้าแกะขาหลังให้
      effects: { stats: { WIS: 1 }, flags: [kept_comrade_token] }

- id: youth.warrior_real_weapon
  stage: youth
  weight: 30
  when:
    age: [16, 17]
    class: warrior
    not_flags: [path_wardens, path_coal_guard]
  text: |
    เช้าวันหนึ่งหัวหน้าเรียกคนที่ยังถือของซ้อมอยู่ออกมายืนหน้าลาน {name}เป็นหนึ่งในนั้น ของจริงวางอยู่บนโต๊ะข้างหลังหัวหน้า ห่อผ้าไว้ทุกชิ้น เห็นแต่รูปทรง

    หัวหน้าบอกว่าใครยืนอยู่ได้ครบสามยก ได้ของจริงกลับไป คู่ของแต่ละคนคือคนที่เพิ่งได้ของจริงไปก่อนหน้า

    คู่ของ{name}ตัวใหญ่กว่า หนักกว่า และยิ้มอยู่ตลอดเวลาที่หัวหน้าพูด
  choices:
    - id: meet_head_on
      label: เข้าปะทะตรงๆ เอาแรงสู้แรง
      check: { stat: STR, dc: 13 }
      success:
        text: |
          ยกแรก{name}โดนดันถอยไปจนส้นเท้าชนขอบลาน ยกที่สองยืนอยู่ที่เดิมได้ ไหล่ชนไหล่ เสียงหายใจของสองคนดังกว่าเสียงคนดู ยกที่สาม คู่ของ{name}เลิกยิ้ม

          หัวหน้าแกะผ้าห่อชิ้นหนึ่งออก ยื่นให้ด้วยมือเดียว ของจริงหนักกว่าของซ้อมเกือบเท่าตัว เหล็กตรงด้ามเย็นจนนิ้วชา
        effects: { stats: { STR: 1 }, flags: [earned_weapon] }
      failure:
        text: |
          ยกที่สอง ข้อศอกของคู่ลงที่ซี่โครงข้างซ้าย {name}ได้ยินเสียงอะไรบางอย่างในตัวเองดังกึก แล้วพื้นลานก็ลอยขึ้นมาแนบแก้ม

          หัวหน้าไม่ได้แกะผ้าห่อชิ้นไหนให้ บอกแค่ว่าซี่โครงร้าว ไม่หัก ปีหน้าค่อยว่ากันใหม่ คู่ของ{name}เป็นคนพยุงไปส่งที่ห้องหมอ ระหว่างทางเขาบอกว่าตอนเขายืนตรงนั้น เขาก็ร้าวซี่เดียวกัน
        effects: { stats: { STR: 1 }, hp: -2 }
    - id: wear_down
      label: ถอยวนรอบลาน ให้เขาไล่จนหมดแรง
      check: { stat: DEX, dc: 12 }
      success:
        text: |
          คนตัวใหญ่ไล่เก่ง แต่ไล่นานไม่เก่ง {name}ถอยตามขอบลานเป็นวง หลบทุกครั้งที่เขาพุ่ง ไม่ตอบโต้สักครั้ง คนดูโห่ตั้งแต่ยกแรก พอถึงกลางยกที่สาม คู่ของ{name}ยืนเท้าสะเอวหอบ เลิกไล่

          หัวหน้าบอกว่าสามยกนับว่ายืนอยู่ได้ ไม่ได้นับว่าต้องตีใคร แล้วยื่นของจริงให้ คนที่โห่ดังที่สุดก็หยุดโห่
        effects: { stats: { DEX: 1 }, flags: [earned_weapon] }
      failure:
        text: |
          ลานแคบเกินกว่าจะถอยได้ทั้งสามยก ถอยไปได้สองรอบ{name}ก็ติดมุม คู่ของ{name}ไม่ต้องรีบอีกแล้ว เขาเดินเข้ามาช้าๆ แล้วจับ{name}ทุ่มลงกับพื้นเหมือนตบผ้าเปียก

          หัวหน้าเคาะโต๊ะ จบยก บอกว่าวิ่งเป็นแล้ว ปีหน้ามาใหม่พร้อมกับรู้ว่าจะวิ่งไปทางไหน
        effects: { stats: { DEX: 1 }, hp: -1 }
    - id: take_it
      label: ยืนรับทุกหมัด ไม่ล้ม ไม่ตีกลับ
      check: { stat: CON, dc: 12 }
      success:
        text: |
          {name}ยกแขนสองข้างบังหน้า ยืนให้เขาตีจนแขนทั้งสองข้างเขียวช้ำ ปากแตกตั้งแต่ยกแรก แต่เท้าไม่ขยับออกจากที่ คู่ของ{name}ตีจนหมดยกที่สามแล้วถอยไปเอง สะบัดมือ

          หัวหน้าให้ผ่าน ตอนยื่นของจริงให้ แกบอกว่าข้างนอกไม่มีใครนับยกให้ วันไหนเจอคนที่ไม่หยุดตีเอง ให้รู้จักตีกลับ
        effects: { stats: { STR: 1 }, hp: -1, flags: [earned_weapon] }
      failure:
        text: |
          หมัดหนึ่งในยกที่สองลอดแขนเข้ามาโดนขมับ {name}ยังยืนอยู่ แต่โลกเอียงไปข้างหนึ่ง พอหมัดต่อมาตามมา ขาก็พับลงเอง

          {name}ตื่นขึ้นบนม้านั่งข้างลาน หัวหน้ากำลังแกะผ้าห่อให้คนต่อไป หูข้างหนึ่งยังอื้ออยู่จนถึงเย็น
        effects: { stats: { CON: 1 }, hp: -2 }

- id: youth.warrior_ash_hounds
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    flags: [path_wardens]
    location_tag: ashland
  text: |
    ผู้เฝ้าผนึกที่ยังไม่ครบสามปียังไม่ได้ขึ้นกำแพงป้อม ได้เดินเวรตามทางขนถ่าน ทางที่รถเข็นถ่านจากหลุมวิ่งไปถึงลานรถไฟ คืนละสิบสองคน ถือตะเกียงยืนห่างกันคนละห้าสิบก้าว

    คืนที่ไม่มีลม {name}เห็นแสงแดงจุดหนึ่งนอกแนวตะเกียง สว่างแล้วหรี่ สว่างแล้วหรี่ ช้ากว่าเปลวไฟ ช้าเท่าจังหวะหายใจ จ่าที่ยืนถัดไปก็เห็น แกวางตะเกียงลงกับพื้นเบาๆ แล้วกระซิบส่งต่อมาตามแนว ว่าหมาเถ้า ตัวเดียว อย่าออกนอกแนว

    แสงแดงใกล้เข้ามาทีละน้อย ไม่มีเสียงเห่า ไม่มีเสียงเท้า มีแต่เสียงเถ้ายุบทีละก้าว จนมันมาหยุดอยู่ตรงหน้า{name} ห่างไม่ถึงสิบก้าว หนังดำย่นเหมือนกระดาษไหม้ ถ่านในอกสว่างวาบขึ้นครั้งหนึ่ง แล้วมันก็ยืนนิ่งอยู่ตรงนั้น
  choices:
    - id: strike_chest
      label: แทงหอกเข้าที่ถ่านในอกมัน
      check: { stat: STR, dc: 13, foe: demon }
      success:
        text: |
          ปลายหอกจมลงไปในอกมันเหมือนจมลงในขี้เถ้าร้อน ถ่านแตกออกเป็นประกายสามสี่เม็ด แล้วตัวมันก็ยุบลงทั้งตัว เหลือแต่หนังดำกองหนึ่งบนพื้น ควันขึ้นอยู่ครู่เดียวก็หมด

          จ่าเดินมาดู เอาปลายหอกของแกเขี่ยกองหนังไปมา แล้วถามว่ามันยืนอยู่ตรงนั้นนานแค่ไหนก่อน{name}แทง {name}ตอบไม่ได้ จ่าพยักหน้าเหมือนได้คำตอบแล้ว เดินกลับไปที่ตะเกียงของแก
        effects: { stats: { STR: 1 }, reputation: { wardens: 1 }, flags: [killed_ash_hound] }
      failure:
        text: |
          หอกพลาดถ่านไปครึ่งฝ่ามือ แทงโดนแต่หนัง มันหันหัวมางับแขน{name}ทั้งที่หอกยังปักอยู่ในตัว ฟันมันไม่คม แต่ร้อนเหมือนคีมที่เพิ่งออกจากเตา

          ตะเกียงอีกสามดวงวิ่งเข้ามาล้อม จ่าเป็นคนแทงซ้ำ แผลที่แขน{name}พองเป็นรอยฟันครบทุกซี่ หมอที่ป้อมบอกว่าจะเป็นรอยไปจนตาย ผู้เฝ้าผนึกครึ่งป้อมมีรอยแบบนี้
        effects: { stats: { STR: 1 }, hp: -3, reputation: { wardens: 1 }, flags: [ash_hound_scar] }
    - id: hold_line
      label: ยืนอยู่ในแนว ยกตะเกียงขึ้นสูง ให้คนอื่นเห็น
      text: |
        {name}ยกตะเกียงขึ้นเหนือหัว แขนสั่นจนเปลวไฟสั่นตาม ตะเกียงดวงที่สองยกขึ้น ดวงที่สาม แล้วทั้งแนวก็ยกตามกันไปจนสุดทาง สิบสองดวงค่อยๆ โค้งเข้ามาเป็นครึ่งวง

        หมาเถ้ามองแสงไฟทีละดวง แล้วถอยกลับเข้าไปในความมืดอย่างไม่รีบร้อน ทางขนถ่านเงียบไปจนเช้า ตอนเปลี่ยนเวร จ่าบอกว่าคนที่ทำแบบนี้ในคืนแบบนี้ ยังมีหัวครบทุกคน
      effects: { stats: { CON: 1 }, alignment: { law: 1 }, reputation: { wardens: 1 }, flags: [held_ash_line] }
    - id: chase_alone
      label: วิ่งตามมันออกไปนอกแนวตะเกียงคนเดียว
      check: { stat: DEX, dc: 14, foe: demon }
      success:
        text: |
          มันวิ่งไม่เร็ว วิ่งเหมือนรู้ว่ามีคนตาม แสงแดงพา{name}ข้ามเนินเถ้าไปสองเนิน แล้วหยุดหันกลับมาในแอ่งที่ไม่มีแสงตะเกียงส่องถึง {name}ไม่หยุด พุ่งเข้าไปทั้งตัว ปลายหอกเจอถ่านในอกพอดีตอนที่มันอ้าปาก

          กว่าจะเดินตามรอยเท้าตัวเองกลับมาถึงแนวตะเกียงก็ฟ้าสาง จ่ายืนรออยู่ แกตบหน้า{name}หนึ่งที แรงจนหูอื้อ แล้วยื่นกระบอกน้ำให้ บอกว่าปีหน้าถ้ายังอยู่ ค่อยมาเล่าให้ฟังว่าข้างนอกนั่นเป็นยังไง
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [killed_ash_hound, broke_the_line] }
      failure:
        text: |
          เถ้านอกแนวตะเกียงลึกลงไปถึงเข่าในก้าวที่สาม ถึงต้นขาในก้าวที่ห้า แสงแดงข้างหน้าหยุดรอ แล้วก็มีแสงแดงจุดที่สองสว่างขึ้นข้างหลัง

          คนในแนวเห็นตะเกียงของ{name}ดับลงตรงเนินที่สอง แล้วเห็นแสงแดงสว่างวาบขึ้นสองครั้ง ตอนเช้าจ่าพาคนออกไปหา เจอแค่หอกปักเอียงอยู่ในเถ้า หอกเล่มนั้นกลับไปวางบนชั้นหน้าประตูป้อม รอคนมาใหม่
        effects: { die: true }

- id: youth.warrior_coal_road
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    flags: [path_coal_guard]
  text: |
    ขบวนเกวียนถ่านออกจากลานรถไฟตอนบ่าย ไปถึงโรงหลอมของบริษัทตอนสาง ทางผ่านป่าละเมาะสองช่วง ช่วงที่สองยาวที่สุดและมืดที่สุด ลูกมือยามได้เดินท้ายขบวน ถือตะเกียงกับนกหวีด

    คืนนี้เกวียนคันที่เจ็ดล้อจมหลุม ขบวนหยุดรอ หัวหน้ายามขี่ม้าไปดูข้างหน้า {name}ยืนอยู่ท้ายสุดคนเดียว แล้วได้ยินเสียงกระสอบครูดกับไม้จากเกวียนคันสุดท้าย พอยกตะเกียงขึ้น ก็เห็นคนคนหนึ่งกำลังหยิบก้อนถ่านใส่กระสอบของตัวเอง

    คนคนนั้นหันมา เป็นลูกชายคนโตของหัวหน้ายาม ลูกมือรุ่นพี่ที่สอน{name}ผูกปากกระสอบในวันแรก เขาไม่หนี ยกนิ้วชี้แตะปากหนึ่งที
  choices:
    - id: blow_whistle
      label: เป่านกหวีด อย่างที่หัวหน้ายามสั่งไว้
      text: |
        เสียงนกหวีดดังไปทั้งป่าละเมาะ ม้าของหัวหน้ายามกลับมาถึงในเวลาไม่ถึงสิบอึดใจ แกยกตะเกียงส่องหน้าลูกชาย ส่องกระสอบ แล้วลงจากม้า ยื่นมือออกไปขอหอกของลูกชายคืน โดยไม่พูดสักคำ

        ขบวนเดินต่อจนถึงโรงหลอม ลูกชายหัวหน้ายามเดินกลับไปทางเดิมคนเดียว เช้าวันต่อมาที่ลานรถไฟ หัวหน้ายามยื่นหอกเล่มนั้นให้{name} ด้ามยังมีรอยมือของคนก่อน
      effects: { stats: { WIS: 1 }, alignment: { law: 1 }, flags: [blew_on_captains_son, earned_weapon] }
    - id: look_away
      label: หันตะเกียงไปทางอื่น แล้วเดินกลับไปยืนที่เดิม
      text: |
        {name}หันตะเกียงไปส่องพุ่มไม้ฝั่งตรงข้าม นับในใจไปถึงสามสิบ พอหันกลับมา เกวียนคันสุดท้ายก็เงียบแล้ว

        ตอนสางที่โรงหลอม ตาชั่งของบริษัทขาดไปครึ่งกระสอบ เสมียนเขียนลงสมุดว่าตกหล่นระหว่างทาง วันจ่ายค่าแรง ลูกชายหัวหน้ายามเดินมาวางเหรียญทองแดงสองเหรียญไว้บนม้านั่งข้าง{name} {name}ไม่ได้ขอ แต่ก็ไม่ได้คืน
      effects: { gold: 2, alignment: { law: -1 }, flags: [covered_captains_son] }
    - id: grab_sack
      label: เข้าไปแย่งกระสอบคืนมาเอง ไม่เป่านกหวีด
      check: { stat: STR, dc: 12 }
      success:
        text: |
          {name}คว้าปากกระสอบไว้ ดึงกันอยู่สองสามที ลูกชายหัวหน้ายามก็ปล่อยมือ เขามองหน้า{name}อยู่นาน แล้วเทถ่านคืนลงเกวียนเองทีละก้อน

          ไม่มีใครรู้เรื่องคืนนั้นนอกจากสองคน ตั้งแต่วันนั้นเขาไม่พูดกับ{name}อีกเลย แต่ก็ไม่เคยแตะเกวียนคันไหนอีกเหมือนกัน
        effects: { stats: { STR: 1 }, alignment: { moral: 1 }, flags: [stopped_captains_son] }
      failure:
        text: |
          เขาตัวใหญ่กว่าและทำงานนี้มานานกว่า พอ{name}คว้ากระสอบ ศอกของเขาก็ลงที่ปาก{name}ทันที ตอนที่{name}ลุกขึ้นได้ กระสอบใบนั้นหายเข้าไปในพุ่มไม้พร้อมกับเขาแล้ว

          ตอนหัวหน้ายามกลับมา เขาถามว่าปากไปโดนอะไรมา {name}บอกว่าสะดุดล้อเกวียน
        effects: { stats: { STR: 1 }, hp: -2 }

- id: youth.warrior_navy_strike
  stage: youth
  weight: 30
  when:
    age: [15, 17]
    flags: [path_navy]
  text: |
    ราชนาวีไม่ได้มีแต่งานบนเรือ เดือนนี้ลูกเรือฝึกทั้งเรือนพักได้คำสั่งให้ถือกระบองไปยืนเรียงแถวหน้าประตูโรงกลั่น สมาคมโรงกลั่นตัดค่าแรงลงอีกหนึ่งส่วนสิบ คนงานกะดึกไม่ยอมเข้ากะ นั่งกันอยู่หน้าประตูมาสามวันแล้ว

    ครูฝึกขาเหล็กเดินตรวจแถว เคาะไม้เท้ากับขาตัวเองทุกห้าก้าว แกบอกว่าไม่ต้องตีใคร ยืนให้เห็นก็พอ ใครเดินเข้ามาเกินเส้นปูนที่ขีดไว้บนพื้น ค่อยว่ากัน

    คนที่นั่งอยู่หน้าเส้นปูนเป็นคนย่านเดียวกับที่{name}โตมา บางคนเคยแบ่งขนมปังให้ตอนเด็ก บางคนเคยตีก้น{name}ตอนแอบเข้าไปเล่นในโรง ป้าคนหนึ่งเห็นหน้า{name}ใต้หมวกทหาร ลุกขึ้นยืน แล้วเดินตรงมาที่เส้นปูน
  choices:
    - id: hold_line
      label: ยืนอยู่ในแถว ไม่ขยับ
      text: |
        ป้าหยุดที่เส้นปูนพอดี ปลายเท้าแตะเส้นแต่ไม่เกิน แกจ้องหน้า{name}อยู่นาน แล้วถ่มน้ำลายลงบนรองเท้า{name}หนึ่งที เดินกลับไปนั่งที่เดิม

        คืนนั้นไม่มีใครข้ามเส้น ครูฝึกจดชื่อลูกเรือฝึกที่ยืนนิ่งได้ทั้งคืนลงสมุด ชื่อ{name}อยู่บรรทัดที่สาม รองเท้าคู่นั้น{name}ขัดเองทุกเช้าไปอีกนาน ทั้งที่ขัดออกตั้งแต่เช้าวันแรกแล้ว
      effects: { stats: { CON: 1 }, alignment: { law: 1 }, reputation: { crown: 1 }, flags: [held_strike_line] }
    - id: step_forward
      label: ก้าวออกจากแถวไปคุยกับป้าตรงเส้นปูน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ถอดหมวกก่อนพูด ป้าจำได้ทันที แกเรียกชื่อเล่นที่ไม่มีใครเรียกมาตั้งแต่{name}เข้าเรือนพัก แล้วด่ายาวไม่หยุดหายใจ {name}ยืนฟังจนแกด่าจบ แล้วบอกว่าคนที่ยืนถือกระบองอยู่ข้างหลัง ครึ่งหนึ่งมาจากย่านแบบนี้ทั้งนั้น ไม่มีใครอยากตีใคร แต่ถ้ามีคนข้ามเส้น จะไม่มีใครหยุดได้

          ป้ากลับไปนั่ง แล้วคนที่ยืนอยู่ข้างหลังแกก็นั่งตาม คืนนั้นไม่มีใครข้ามเส้น ครูฝึกสั่งให้{name}ขัดดาดฟ้าคนเดียวสามวันเพราะออกจากแถวโดยไม่ได้รับคำสั่ง ตอนสั่ง แกไม่ได้มองหน้า
        effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [talked_at_strike_line] }
      failure:
        text: |
          ป้าไม่ฟัง แกตะโกนให้คนข้างหลังดูหน้าลูกหลานย่านเดียวกันที่ถือกระบองมาตีคนที่เลี้ยงมัน คนข้างหลังลุกขึ้นทั้งแถว แล้วก็มีคนหนึ่งในนั้นปาขวดข้ามเส้นมา

          ที่เหลือเกิดขึ้นเร็วจนจำไม่ได้ว่าอะไรก่อนอะไรหลัง {name}โดนก้อนอิฐจากฝั่งหนึ่ง กับกระบองจากฝั่งที่ยืนอยู่ด้วยกัน ตอนเช้า ประตูโรงกลั่นเปิด คนงานกะดึกเข้ากะเหมือนไม่มีอะไรเกิดขึ้น ค่าแรงก็ยังโดนตัดเท่าเดิม
        effects: { stats: { CON: 1 }, hp: -2, alignment: { moral: 1 } }
    - id: drop_baton
      label: วางกระบองลงกับพื้น แล้วเดินออกจากแถว
      text: |
        กระบองกลิ้งไปหยุดตรงเส้นปูน ไม่มีใครในแถวขยับ ครูฝึกไม่ได้ตะโกน แกเดินมาเก็บกระบองขึ้นเอง แล้วสั่งให้คนสองคนพา{name}กลับเรือนพัก

        {name}นอนห้องขังใต้บันไดอยู่สามคืน คืนที่สามครูฝึกลงมานั่งบนขั้นบันได เคาะไม้เท้ากับขาเหล็กเบาๆ แล้วบอกว่าขาข้างแรกของแกเสียไปเพราะไม่ทำตามคำสั่ง ข้างที่สองเสียเพราะทำตาม พูดจบแกก็ปลดกุญแจห้องขัง บอกว่าพรุ่งนี้เวรขัดดาดฟ้าเป็นของ{name}ไปทั้งเดือน
      effects: { stats: { WIS: 1 }, alignment: { law: -1, moral: 1 }, reputation: { crown: -1 }, flags: [dropped_baton] }
