# วัยเด็ก ลูกเอลฟ์ บ้านกิ่งลม ป่าไอเลธ (origin_elf_bough)
# เอลฟ์พูด ข้า–เจ้า ทุกวัย เด็กเรียกผู้ใหญ่ว่า ท่าน โอรีวัลคือเด็กคนก่อนของหมู่บ้าน อายุราวเก้าสิบเจ็ด อยู่ฝ่ายเผาค่าย

- id: childhood.elf_astel_day
  stage: childhood
  weight: 8
  when:
    age: [3, 7]
    flags: [origin_elf_bough]
  text: |
    คนแลกเกลือจากบ้านตีนไม้ไม่เคยขึ้นมาในวันอัสเทล เขาเล่าว่าในเมืองมนุษย์ วันนั้นทุกบ้านปิดหน้าต่าง ไม่ทำงาน ไม่ร้องเพลง เหมือนบ้านเพิ่งมีคนตาย

    ในบ้านกิ่งลม วันอัสเทลก็ไม่มีใครทำงานเหมือนกัน แต่ไม่มีใครอยู่บ้าน ตกค่ำทุกคนปีนขึ้นไปนั่งบนกิ่งที่สูงพอจะเห็นฟ้า ไม่จุดโคม ไม่ร้องเพลง นั่งมองดาวจนดึก ผู้เฒ่าที่แก่ที่สุดในหมู่บ้านเล่าว่าสมัยก่อนทำอย่างนี้เพื่อขอบคุณ เดี๋ยวนี้ทำเพื่อเป็นเพื่อน

    ปีนี้{name}ได้ขึ้นไปนั่งด้วยเป็นครั้งแรก {mother}ห่มผ้าให้สองชั้น แล้วบอกกฎสามข้อ ห้ามพูด ห้ามชี้ ห้ามนับ แค่นั่ง
  choices:
    - id: sit_still
      label: นั่งนิ่งจนหลับไปบนตักแม่
      text: |
        {name}นั่งนิ่งได้นานกว่าที่ทุกคนคิด นานจนเท้าชา แล้วก็หลับไปบนตักแม่ ตื่นมาอีกทีตอนฟ้าเริ่มเทา เอลฟ์ทั้งหมู่บ้านยังนั่งอยู่ที่เดิม ไม่มีใครขยับ

        {mother}บอกว่าหลับก็ได้ ท่านไม่ถือ
      effects: { stats: { CON: 1 } }
    - id: whisper
      label: กระซิบเล่าเรื่องวันนี้ให้ฟ้าฟังเบาๆ
      text: |
        {name}กระซิบเล่าให้ฟ้าฟังว่าวันนี้กินอะไร จับด้วงได้กี่ตัว ด้วงตัวไหนบินหนีไป เล่าจนหมดเรื่องแล้วก็รอ

        ไม่มีอะไรตอบ {mother}ได้ยินทุกคำ เธอไม่ห้าม แค่กอดลูกแน่นขึ้นจนถึงเช้า
      effects: { stats: { CHA: 1 }, flags: [whispered_to_astel] }
    - id: count_secretly
      label: แอบนับดาวในใจ
      text: |
        {name}นับในใจได้สามร้อยกว่าดวง ผู้เฒ่าที่นั่งอยู่บนกิ่งถัดไปหันมามอง เหมือนได้ยินเสียงนับในหัวของ{name} แกส่ายหน้าช้าๆ หนึ่งครั้ง

        {name}หยุดนับ แต่จำได้ว่าค้างไว้ที่ดวงไหน
      effects: { stats: { INT: 1 } }

- id: childhood.elf_human_friend
  stage: childhood
  weight: 8
  when:
    age: [3, 8]
    flags: [origin_elf_bough]
  text: |
    บ้านตีนไม้เป็นหมู่บ้านมนุษย์ที่ชายป่า อยู่กับเอลฟ์มาหลายร้อยปี ผู้ใหญ่บ้านนั้นต่อราคากับเอลฟ์เป็นภาษาเอลฟ์ แล้วนินทาเอลฟ์เป็นภาษามนุษย์ ทุกเดือนพวกเขาขึ้นมาแลกเกลือกับน้ำผึ้งที่บ้านกิ่งลม

    ปีนี้มีเด็กผู้ชายคนหนึ่งติดพ่อมาด้วย ชื่อโนริค อายุพอๆ กับ{name} ผอมกว่า ฟันหน้าหลุดสองซี่ แม่ของเขามาจากเมือง เขาจึงเป็นเด็กคนเดียวในบ้านตีนไม้ที่พูดภาษาเอลฟ์ไม่ได้สักคำ เขายืนแหงนคอมองบ้านบนกิ่งจนหมวกหล่น

    "ข้างบนนั้นมีส้วมไหม" เป็นคำถามแรกที่เขาถาม{name}
  choices:
    - id: show_house
      label: พาโนริคปีนขึ้นไปดูบ้านบนกิ่ง
      text: |
        โนริคปีนไม่เก่ง แต่ไม่ยอมหยุด มือถลอกตั้งแต่กิ่งที่สาม ขึ้นไปถึงบ้านก็ได้เห็นว่าส้วมเป็นอย่างไร แล้วหัวเราะจนต้องนั่งลงกับพื้น

        ตั้งแต่นั้น ทุกเดือนที่คนบ้านตีนไม้ขึ้นมา โนริคจะมาด้วย ผู้เฒ่าเห็นสองคนวิ่งไล่กันบนกิ่ง แล้วหันไปมองทางอื่น
      effects: { stats: { DEX: 1 }, flags: [elf_human_friend] }
    - id: teach_word
      label: สอนคำภาษาเอลฟ์ให้หนึ่งคำ
      text: |
        {name}สอนคำว่า ลม ในภาษาเอลฟ์ โนริคออกเสียงผิดสามรอบ รอบที่สี่ถูก แล้วสอนคำหยาบภาษามนุษย์กลับมาให้สามคำ

        คืนนั้น{name}เผลอพูดคำที่สองตอนกินข้าว {father}สำลักน้ำ ตั้งแต่นั้นทุกเดือนที่คนบ้านตีนไม้ขึ้นมา โนริคจะมาด้วย
      effects: { stats: { CHA: 1 }, flags: [elf_human_friend] }
    - id: climb_away
      label: ไม่ตอบ ปีนหนีขึ้นกิ่ง
      text: |
        {name}ปีนขึ้นกิ่งไปโดยไม่ตอบ โนริคตะโกนตามว่าเอลฟ์หยิ่ง แล้วตะโกนอีกว่าไม่ได้อยากรู้หรอก

        ปีต่อมาเขาไม่ได้ติดพ่อมาอีก ได้ยินคนบ้านตีนไม้เล่าว่าไปทำงานที่ค่ายตัดไม้แล้ว
      effects: { stats: { WIS: 1 } }

- id: childhood.elf_eldest_memory
  stage: childhood
  weight: 8
  when:
    age: [6, 11]
    flags: [origin_elf_bough]
  text: |
    ผู้เฒ่าอายุเท่าไหร่ ไม่มีใครในบ้านกิ่งลมรู้แน่ แกเกิดก่อนสงครามจอมมาร และยังจำกลิ่นควันของสงครามนั้นได้ เด็กเอลฟ์ทุกคนรู้ว่ามีเรื่องหนึ่งห้ามถามแก และเด็กเอลฟ์ทุกคนก็เคยถาม

    คืนนั้นฝนตก {name}นั่งช่วยแกคัดเมล็ดสนอยู่ข้างเตา แกเล่าเรื่องเก่าไปเรื่อยๆ เรื่องสมัยที่เทพยังตอบคำอธิษฐาน เรื่องคืนที่ดาวทั้งฟ้ายังมีหกพันสองร้อยสี่สิบแปดดวง แล้วแกก็เงียบไป มือหยุดคัดเมล็ด

    {name}ถามออกไปในความเงียบนั้น

    "ท่านเคยเห็นหน้าเขาไหม"

    ผู้เฒ่าไม่ต้องถามว่าเขาคือใคร
  choices:
    - id: wait
      label: รอเงียบๆ ไม่เร่ง
      text: |
        แกคัดเมล็ดต่อจนหมดกระจาด แล้วถึงตอบ

        "เห็น ครั้งเดียว ใกล้เท่าเจ้ากับข้าตอนนี้" แกว่า "เขาสุภาพ สุภาพกว่าใครที่ข้าเคยเจอ ทั้งก่อนหน้านั้นและหลังจากนั้น"

        แล้วแกก็ลุกไปนอน ทิ้งเมล็ดสนอีกกระจาดไว้ให้{name}คัดคนเดียว
      effects: { stats: { WIS: 1 }, flags: [eldest_told_polite] }
    - id: press
      label: ถามต่อว่าเขาหน้าตาเป็นอย่างไร
      text: |
        แกวางเมล็ดสนที่ถืออยู่กลับลงกระจาด ทีละเมล็ด

        "ตอนนั้นทุกคนที่อยากรู้ว่าเขาหน้าตาเป็นอย่างไร ได้เห็นหน้าเขาทุกคน" แกว่า

        แล้วแกก็ลุกไปดับเตา ฝนยังตกอยู่ แต่เรื่องเล่าของคืนนั้นจบแค่นั้น
      effects: { stats: { INT: 1 } }
    - id: take_back
      label: ขอโทษ แล้วชวนคุยเรื่องอื่น
      text: |
        แกยิ้ม เป็นครั้งแรกของคืนนั้น "ไม่ต้องขอโทษ เด็กทุกคนถาม" แกว่า "พ่อของเจ้าก็ถาม ถามตอนอายุเท่าเจ้า ไม่ขาดไม่เกิน"

        แล้วแกก็เล่าเรื่องกวางเผือกของอุลเวนให้ฟังแทน เล่าจนฝนหยุด
      effects: { stats: { CHA: 1 } }
    - id: ask_whisper
      label: ถามว่าวันที่ข้าเกิด ท่านกระซิบอะไรข้างหู
      requires: { flag: eldest_whispered }
      text: |
        ผู้เฒ่าหัวเราะออกมาจนเมล็ดสนหกจากกระจาด

        "ชื่อเต็มของข้า" แกว่า "ทุกชื่อตั้งแต่ชื่อแรก เอลฟ์บอกชื่อเต็มกับคนที่ไว้ใจที่สุดเท่านั้น ข้าไม่รู้จะไว้ใจใครได้มากกว่าคนที่เพิ่งเกิดเมื่อครู่"

        "แล้วชื่ออะไร"

        "เจ้าได้ยินแล้วนี่" แกว่า แล้วก็คัดเมล็ดสนต่อ
      effects: { stats: { WIS: 1 }, flags: [eldest_name_given] }

- id: childhood.elf_star_count
  stage: childhood
  weight: 9
  when:
    age: [7, 11]
    flags: [origin_elf_bough]
  text: |
    หอนับดาวตั้งอยู่บนยอดต้นไม้ที่สูงที่สุดในป่าไอเลธ ปีนขึ้นไปใช้เวลาครึ่งคืน ยอดไม้โยกตามลมจนคนที่ไม่เคยขึ้นต้องกอดราวไว้ทั้งสองแขน

    ทุกปีในคืนที่ฟ้าเปิดนานที่สุด เอลฟ์จากทุกหมู่บ้านขึ้นมานับดาวพร้อมกัน แต่ละคนได้ฟ้าคนละช่อง ดูผ่านกรอบไม้ไผ่ที่ขึงด้ายเป็นตาราง ใครนับช่องไหนต้องนับช่องนั้นไปทั้งชีวิต

    ปีนี้{name}ได้ขึ้นมาเป็นครั้งแรก ได้ช่องเล็กที่สุดทางขอบฟ้าตะวันตก คนที่เคยนับช่องนี้ตายไปเมื่อปีกลาย

    ผู้คุมหอตาบอดข้างหนึ่ง ระหว่างรอฟ้ามืดสนิท เขาเล่าว่าสมัยเจ็ดเสา ดาวทั้งฟ้ามีหกพันสองร้อยสี่สิบแปดดวง นับกี่ปีก็ได้เท่านั้น ไม่เคยขาด ไม่เคยเกิน ปีนี้เกินมาหลายร้อยดวงแล้ว ในสมุดของช่องที่{name}ได้ คนนับคนแรกเขียนไว้ว่ามีสิบสี่ดวง
  choices:
    - id: count_careful
      label: นับให้ครบทีละดวง แล้วนับซ้ำ
      check: { stat: INT, dc: 12 }
      success:
        text: |
          สิบเก้า {name}นับซ้ำสามรอบ ได้สิบเก้าเท่ากันทุกรอบ ผู้คุมหอจดลงสมุดใต้ตัวเลขของปีก่อน ไม่บอกว่ามากขึ้นหรือเท่าเดิม แต่{name}เห็นตัวเลขปีก่อนแล้ว

          สิบแปด
        effects: { stats: { INT: 1 }, flags: [knows_old_count] }
      failure:
        text: |
          รอบแรกได้สิบเก้า รอบสองได้ยี่สิบ รอบสามได้สิบเก้าอีก ผู้คุมหอฟังแล้วหัวเราะในคอ บอกว่าใครนับครั้งแรกก็เป็นอย่างนี้ทุกคน

          แต่ก่อนลงจากหอ เขาให้{name}ชี้ดวงที่นับได้ไม่ตรง แล้วจดตำแหน่งไว้ในสมุดอีกเล่มหนึ่ง เล่มที่ปกดำ
        effects: { stats: { WIS: 1 }, flags: [knows_old_count] }
    - id: watch_new
      label: จ้องดวงที่ไม่มีในสมุดของคนนับคนแรก
      text: |
        {name}จ้องดวงหนึ่งที่สว่างกว่าดวงอื่นในช่อง ดวงที่ไม่มีในสมุดเล่มแรก จ้องจนดวงอื่นจางหายไปรอบๆ เหลือแต่ดวงนั้น

        มือของผู้คุมหอปิดตา{name}ไว้ตั้งแต่เมื่อไหร่ไม่รู้ "นับ แล้วละสายตา" เขาว่า "หอนี้มีกฎแค่ข้อเดียว"
      effects: { stats: { WIS: 1 }, flags: [knows_old_count, star_looked_back] }
    - id: ask_why
      label: ถามว่านับไปทำไม ในเมื่อดาวเพิ่มทุกปี
      text: |
        ผู้คุมหอหัวเราะ "อัสเทลเคยนับ ตอนนี้ไม่มีใครนับแทนท่าน ถ้าเราไม่นับ ก็ไม่มีใครรู้ว่ามันเพิ่ม"

        "แล้วรู้แล้วทำอะไรได้"

        "เขียนจดหมายไปเวนทราส" เขาว่า "ทุกปี"

        เขาไม่บอกว่าเวนทราสตอบว่าอะไร
      effects: { stats: { CHA: 1 }, flags: [knows_old_count] }

- id: childhood.elf_logging_camp
  stage: childhood
  weight: 9
  when:
    age: [8, 11]
    flags: [origin_elf_bough]
  text: |
    ค่ายตัดไม้ของมนุษย์อยู่ห่างจากบ้านกิ่งลมไปครึ่งวันเดิน ปีนี้ขยับเข้ามาใกล้กว่าปีก่อนอีกหนึ่งเนิน ถ้าลมพัดถูกทาง เสียงเลื่อยลอดป่ามาถึงหมู่บ้าน

    โอรีวัลพา{name}ไปดูตอนพลบค่ำ ไม่ได้บอกใคร สองคนนั่งอยู่บนกิ่งสูงเหนือค่าย มองลงไปเห็นตอไม้ไอเลธเรียงเป็นแถว ตอแต่ละตอกว้างกว่าบ้านของคนตัดไม้ทั้งหลัง กลางค่ายก่อไฟกองใหญ่ คนนั่งกินข้าวอยู่รอบๆ มีเด็กสองสามคนวิ่งไล่กันในหมู่ตอไม้

    โอรีวัลวางน้ำเต้าใบหนึ่งลงบนกิ่งข้างตัว กลิ่นน้ำมันสนลอยออกมา

    "ท่อนนั้นอายุสองพันปี" เขาชี้ท่อนซุงที่ใหญ่ที่สุดในลาน "พรุ่งนี้จะออกจากป่าไปเป็นท้องเรือเหาะ"

    "ข้าจะรอให้พวกมันหลับ" เขาว่า "เจ้าจะรออยู่ด้วยก็ได้ จะกลับไปก่อนก็ได้"
  choices:
    - id: help
      label: อยู่ช่วยถือน้ำเต้า
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          ไฟลุกท่วมกองซุงตอนตีสอง {name}มองจากบนกิ่ง เห็นคนตัดไม้วิ่งเท้าเปล่าออกจากเต็นท์ มีคนอุ้มเด็กออกมา มีคนตะโกนเรียกชื่อกันวุ่น ท่อนสองพันปีไหม้อยู่จนฟ้าสาง

          สองคนกลับถึงหมู่บ้านก่อนพระอาทิตย์ขึ้น ผมของ{name}มีกลิ่นควันเหมือนเสื้อของโอรีวัล ผู้ใหญ่หลายคนเบือนหน้าตอนเดินผ่าน
        effects: { stats: { DEX: 1 }, alignment: { law: -1 }, flags: [burned_logging_camp, orival_bond] }
      failure:
        text: |
          {name}ลื่นตอนไต่ลงกิ่งต่ำ น้ำเต้าหลุดมือตกแตกบนตอไม้ เสียงดังจนหมาในค่ายเห่าขึ้นพร้อมกัน โอรีวัลคว้าตัว{name}หนีขึ้นต้นไม้ ทั้งค่ายจุดคบไฟเฝ้าจนเช้า

          ขากลับโอรีวัลไม่พูดสักคำ ใกล้ถึงหมู่บ้าน เขาเอามือขยี้หัว{name}หนึ่งที
        effects: { stats: { WIS: 1 }, alignment: { law: -1 }, flags: [orival_bond] }
    - id: point_children
      label: ชี้ให้โอรีวัลดูเด็กในค่าย
      text: |
        โอรีวัลมองตามนิ้ว เด็กคนหนึ่งปีนขึ้นไปนั่งบนท่อนสองพันปี ห้อยขาแกว่งไปมา

        เขาเก็บน้ำเต้าใส่ย่าม "คืนนี้ลมแรงเกินไป" เขาว่า ทั้งที่ลมไม่ได้แรง
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [orival_spared_camp] }
    - id: tell_eldest
      label: ปีนกลับไปบอกผู้เฒ่า
      text: |
        ผู้เฒ่าฟังจบก็ลุกขึ้น ส่งผู้ใหญ่สามคนออกไปกลางความมืดทันที เช้าวันต่อมาโอรีวัลกลับมาพร้อมผู้ใหญ่สามคนนั้น มือเปล่า เขาเดินผ่าน{name}ไปโดยไม่มอง

        ผ่านไปสามวันค่ายตัดไม้ก็ไหม้อยู่ดี ไม่มีใครรู้ว่าใครทำ
      effects: { stats: { INT: 1 }, alignment: { law: 1 }, flags: [told_on_orival] }

- id: childhood.elf_first_hunt
  stage: childhood
  weight: 8
  when:
    age: [9, 11]
    flags: [origin_elf_bough]
  text: |
    {father}พา{name}ออกล่าครั้งแรกตอนต้นหนาว ลงจากกิ่งตั้งแต่ก่อนรุ่ง เดินตามรอยกีบบนดินชื้นไปจนถึงลำธาร ตลอดทาง{father}สอนให้ฟังเสียงป่า เสียงไหนคือลม เสียงไหนคือสัตว์ที่ทำเป็นลม

    กวางตัวผู้ยืนกินน้ำอยู่อีกฝั่งลำธาร เขาของมันแตกเป็นสองกิ่ง เหมือนสัญลักษณ์ของอุลเวนที่แกะไว้บนประตูทุกบ้าน มันเงยหน้าขึ้น หูตั้ง แต่ไม่วิ่ง

    {father}ยื่นธนูให้ ตามธรรมเนียมของบ้านกิ่งลม ใครยิงต้องเป็นคนแบกกลับเอง ต่อให้ต้องแบกทั้งวัน และต้องบอกชื่อของตัวเองให้สัตว์ได้ยินก่อนยิง
  choices:
    - id: shoot
      label: บอกชื่อตัวเอง แล้วปล่อยลูกศร
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          "{name}" เสียงสั่นนิดหนึ่ง กวางมองตรงมา แล้วลูกศรก็ปักเข้าที่โคนคอ มันก้าวไปได้สามก้าวแล้วทรุดลงริมน้ำ

          {name}แบกกลับเองทั้งวัน ล้มสี่ครั้ง {father}เดินตามหลังไม่ช่วยสักครั้ง พอถึงโคนต้นไม้บ้าน เขาร้องไห้ ทั้งที่{name}ไม่ร้อง
        effects: { stats: { DEX: 1, STR: 1 }, flags: [first_kill] }
      failure:
        text: |
          "{name}" ลูกศรปักเข้าโคนต้นไม้ห่างหัวกวางไปหนึ่งคืบ มันกระโดดหายเข้าพุ่มไม้ไปโดยไม่มีเสียง

          {father}หัวเราะ บอกว่าดีแล้ว ตอนพ่อยิงครั้งแรกก็พลาด แล้วเดินไปถอนลูกศรออกจากต้นไม้ ขอโทษต้นไม้ด้วย
        effects: { stats: { WIS: 1 } }
    - id: let_go
      label: ลดธนูลง ปล่อยให้มันไป
      text: |
        {name}ลดธนูลง กวางยืนมองอยู่อีกครู่หนึ่ง แล้วค่อยๆ เดินหายเข้าป่า ไม่รีบ

        {father}รับธนูคืนแล้วเดินนำกลับบ้าน ตอนขึ้นบันไดเชือก เขาบอกว่าตัวนั้นแก่แล้ว ปล่อยไปก็ดี ระยะขนาดนั้น ไม่มีใครมองออกหรอกว่าแก่หรือหนุ่ม
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 } }
    - id: ask_father
      label: ส่งธนูคืน ขอให้พ่อยิงให้ดู
      text: |
        {father}รับธนูคืน บอกชื่อตัวเองเบาๆ แล้วยิง กวางล้มลงริมน้ำโดยไม่ทันก้าว

        ขากลับเขาแบกเอง ให้{name}ถือธนูเดินนำหน้า บอกว่าปีหน้าค่อยเอาใหม่ ไม่มีใครในหมู่บ้านถามว่าใครยิง
      effects: { stats: { CHA: 1 } }

- id: childhood.elf_court_envoy
  stage: childhood
  weight: 8
  when:
    age: [6, 11]
    flags: [origin_elf_bough]
  text: |
    ทูตจากราชสำนักอาร์เวลมาถึงบ้านกิ่งลมตอนบ่าย สวมรองเท้าหนังขัดมันกับเสื้อคลุมปักดิ้นทอง มีทหารสองนายกับเสมียนหนึ่งคน ทั้งสี่คนยืนแหงนคอมองบันไดเชือก ผลัดกันเชิญให้อีกคนปีนก่อน

    ผู้เฒ่ารับแขกในบ้านบนกิ่งที่สูงที่สุด ทุกปีทูตมาขอไม้เพิ่มจากที่ตกลงกันไว้ ทุกปีผู้เฒ่าให้น้อยกว่าที่ขอ แต่ให้ และทุกปีหลังทูตกลับ ค่ายตัดไม้ก็ไหม้ไปหนึ่งค่าย

    ปีนี้{name}ได้หน้าที่รินชา ทูตพูดภาษาเอลฟ์ไม่ได้ เสมียนแปลให้ผิดบ้างถูกบ้าง ผู้เฒ่าฟังภาษามนุษย์ออกทุกคำ แต่ไม่เคยบอกใคร
  choices:
    - id: pour_quiet
      label: รินชาเงียบๆ ฟังทุกคำ
      text: |
        {name}รินชาโดยไม่ทำน้ำหกสักหยด ฟังทูตพูดเรื่องตัวเลข เรื่องอู่เรือเหาะ เรื่องค่ายตัดไม้ที่ไหม้เมื่อปีก่อน ฟังผู้เฒ่าตอบช้าๆ ทีละประโยค

        ทูตกลับไปแล้ว ผู้เฒ่าถามว่าได้ยินอะไรบ้าง {name}เล่าได้เกือบทุกคำ แกบอกว่าเสมียนแปลคำว่า ไม่ ผิดไปสามครั้ง
      effects: { stats: { INT: 1 } }
    - id: spill_tea
      label: แกล้งทำชาหกใส่รองเท้าทูต
      text: |
        ชาร้อนหกลงบนรองเท้าหนังขัดมัน ทูตสะดุ้งจนเก้าอี้ไม้โยก เสมียนลุกขึ้นมาเช็ดให้ ผู้เฒ่าขอโทษเป็นภาษาเอลฟ์ยาวเหยียด เสมียนแปลว่า ขอโทษ

        ปีนั้นราชสำนักได้ไม้น้อยกว่าทุกปี ไม่มีใครรู้ว่าเกี่ยวกับชาหรือเปล่า แต่โอรีวัลได้ยินเรื่องนี้ก็หัวเราะจนตกกิ่ง
      effects: { stats: { DEX: 1 }, flags: [orival_bond] }
    - id: ask_envoy
      label: ถามทูตเป็นภาษามนุษย์ว่าเรือเหาะลำหนึ่งใช้ไม้กี่ต้น
      text: |
        ทูตหันมามอง แปลกใจที่เด็กเอลฟ์พูดภาษาเขาได้ เขาตอบตามจริงอย่างคนที่ไม่เคยคิดว่าคำตอบนี้จะมีความหมายอะไร

        "สามต้น ลำใหญ่ห้าต้น"

        ผู้เฒ่าวางถ้วยชาลง ทั้งห้องเงียบ
      effects: { stats: { CHA: 1 } }
