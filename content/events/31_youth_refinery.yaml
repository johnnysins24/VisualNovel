# วัยรุ่น 12–13 ลูกคนงานโรงกลั่น ย่านริมแม่น้ำ เวนทราส (origin_refinery)
# ทางประจำถิ่นคือนักย่อง (หนูท่า) เปิดเสมอในพิธี เหตุการณ์ในไฟล์นี้จึงไม่ให้ lean_rogue
# ศาลทาลิสใต้สะพานเป็นที่ที่คนงานไปร้องเพลงหลังเลิกกะ นักบวชของย่านนี้จึงรับใช้ทาลิส

- id: youth.refinery_pot_nine
  stage: youth
  weight: 10
  when:
    age: [12, 12]
    flags: [origin_refinery]
  text: |
    ปีนี้{name}ได้ขึ้นจากอ่างล้างขวดมาเฝ้าหม้อ ค่าแรงยังได้ครึ่งเดียวเท่าเดิม แต่งานเท่าผู้ใหญ่ ผู้จัดการให้นั่งหม้อเบอร์สิบ ข้างหม้อเบอร์เก้าของ{mother}

    แผ่นใสบนแขนของ{mother}ลามขึ้นไปถึงไหล่แล้ว นิ้วมือซ้ายงอได้ไม่สุด คืนนั้นหม้อเบอร์เก้าหยดเร็วขึ้นตั้งแต่ตีหนึ่ง เร็วจนเสียงหยดติดกันเป็นสาย {mother}เอื้อมไปหมุนวาล์วน้ำเย็น แต่มือซ้ายจับไม่อยู่ ต้องเปลี่ยนมาใช้มือขวา ช้าไปสองอึดใจ ฝาหม้อก็เริ่มสั่น

    หัวหน้ากะเดินมาถึงพอดี ผลัก{mother}ออกจากเก้าอี้แล้วหมุนวาล์วเอง แล้วตะโกนให้ทั้งโรงได้ยินว่าคืนนี้หม้อเบอร์เก้าหักค่าแรงครึ่งหนึ่ง ช่างเวทประจำโรงเดินตามหลังมา เป็นผู้หญิงแก่ใส่แว่นช่างสองชั้น เธอไม่สนใจใคร ก้มลงฟังเสียงหม้อเหมือนหมอฟังอกคนไข้
  choices:
    - id: ask_tech
      label: ถามช่างว่าหม้อรู้ได้อย่างไรว่าต้องหยดเร็วหรือช้า
      check: { stat: INT, dc: 12 }
      success:
        text: |
          ช่างเงยหน้าขึ้นมองผ่านแว่นทั้งสองชั้น แล้วชี้ให้ดูขดแก้วในหม้อทีละขด ขดล่างรับแสงจากจานบนหลังคา ขดกลางทำให้เย็น ขดบนคือที่หยดเกิด แสงเข้ามามาก ขดล่างร้อน หยดก็เร็ว

          "แล้วคืนนี้ทำไมแสงมาก"

          เธอหัวเราะในคอ แล้วยื่นแว่นช่างอันสำรองให้{name}ใส่ส่องขดแก้วดูเอง พอเลิกกะ เธอบอกผู้จัดการว่าหม้อเบอร์สิบไม่ต้องหาคนใหม่ เด็กคนนี้ส่องหม้อเป็น
        effects: { stats: { INT: 1 }, flags: [lean_wizard, knows_the_coils] }
      failure:
        text: |
          ช่างไม่หันมา บอกแค่ว่าหม้อไม่ได้รู้อะไร คนต่างหากที่ต้องรู้ แล้วก้มหน้าทำงานต่อ

          แต่ตอนเธอเก็บกล่องเครื่องมือ{name}เห็นว่าเธอทิ้งแว่นช่างอันเก่าไว้บนเก้าอี้หม้อเบอร์สิบ เลนส์ข้างหนึ่งร้าว อีกข้างยังดี
        effects: { stats: { WIS: 1 }, flags: [lean_wizard] }
    - id: shove_back
      label: ผลักหัวหน้ากะออกห่างจากแม่
      check: { stat: STR, dc: 13 }
      success:
        text: |
          หัวหน้ากะเซถอยไปชนชั้นวางขวด ขวดเปล่าทั้งแถวกระทบกันดังกริ๊ก แต่ไม่มีใบไหนตก เขาหันขวับมา มือกำ

          แล้วเขาก็เห็นว่าผู้หญิงที่เฝ้าหม้ออยู่ทั้งแถวลุกขึ้นยืนกันหมด ทุกคนยืนอยู่ข้างหม้อของตัวเอง มือยังวางอยู่บนวาล์ว หัวหน้ากะเดินกลับไปที่โต๊ะ ขีดชื่อ{name}ลงสมุดหักค่าแรงหนึ่งสัปดาห์ แต่ไม่ได้ขีดชื่อหม้อเบอร์เก้า
        effects: { stats: { STR: 1 }, gold: -2, flags: [lean_warrior] }
      failure:
        text: |
          หัวหน้ากะไม่ขยับสักนิ้ว เขาจับข้อมือ{name}บิดไปข้างหลัง ดันหน้าแนบหม้อเบอร์สิบที่ร้อนจนผิวแก้มพอง แล้วลากไปโยนออกประตูหลังกลางสายฝน

          {mother}ขอโทษเขาแทน ขอโทษจนเขาพอใจ ค่าแรงทั้งสัปดาห์ของ{name}หายไป แต่แผลที่แก้มหายช้ากว่านั้น
        effects: { stats: { CON: 1 }, gold: -2, hp: -1, flags: [lean_warrior] }
    - id: take_mother
      label: พาแม่ออกจากโรงหลังเลิกกะ ไปศาลทาลิสใต้สะพาน
      text: |
        ศาลทาลิสเป็นแค่ผนังสะพานที่มีคนแกะรูปขนนกกับโซ่ขาดไว้ มีตะเกียงน้ำมันดวงเดียว มีม้านั่งไม้สามตัว ตอนเช้ามืดคนงานกะดึกมานั่งกันเต็ม ร้องเพลงที่ไม่มีใครในโรงกลั่นยอมให้ร้อง เพลงเรือที่ออกจากท่าแล้วไม่กลับ เพลงคนที่เดินออกจากเมืองแล้วไม่หันหลัง

        คนเฝ้าศาลเป็นชายแก่ขาเป๋ เขาดูแขนของ{mother}แวบเดียว แล้วยื่นชามน้ำร้อนให้ แล้วให้{name}นั่งตรงม้านั่งตัวหน้า บอกว่าใครพาคนอื่นมาได้ คนนั้นนั่งข้างหน้า

        {mother}ไม่ได้ร้อง แต่ตบเข่าตามจังหวะจนเพลงจบ
      effects: { stats: { WIS: 1 }, alignment: { law: -1 }, flags: [lean_cleric, talis_bridge] }

- id: youth.refinery_moths
  stage: youth
  weight: 10
  when:
    age: [12, 13]
    flags: [origin_refinery]
  text: |
    แมลงหึ่งมาตอนต้นฤดูร้อน ปีนี้มาเร็วกว่าทุกปี และมากกว่าทุกปี

    ตกค่ำ ฝูงผีเสื้อกลางคืนปีกใสลอยขึ้นมาจากแม่น้ำเป็นม่าน วนรอบจานรับดาวบนหลังคาโรงกลั่นทุกใบ ปีกบางจนเห็นแสงฟ้าของจานลอดผ่าน บินกันเป็นพันตัวแต่ไม่มีเสียงปีก มีแต่เสียงหึ่งต่ำเสียงเดียว ฟังนานๆ แล้วไม่แน่ใจว่าดังอยู่ข้างนอกหรือข้างในหัว

    สมาคมโรงกลั่นติดประกาศไว้ที่ปากตรอก แมลงหึ่งหนึ่งโหลแลกหนึ่งเหรียญทองแดง เด็กทั้งย่านแบกสวิงขึ้นหลังคา ส่วนผู้ใหญ่ในห้องเช่าเริ่มหาวตั้งแต่หัวค่ำ หาวพร้อมกันทั้งตรอก
  choices:
    - id: net_roof
      label: แบกสวิงขึ้นหลังคาไปกับเด็กคนอื่น
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ไต่ไปตามสันหลังคาโรงกลั่นจนถึงจานใบที่ใหญ่ที่สุด ฝูงหนาที่สุดอยู่ตรงนั้น ตวัดสวิงทีเดียวได้เกือบโหล ตวัดอีกทีก็เต็มโหล ปีกใสติดตาข่ายสั่นอยู่อย่างนั้น ไม่ดิ้นเหมือนแมลงทั่วไป

          ใกล้รุ่ง{name}ได้มาเจ็ดโหล มากที่สุดในหมู่เด็กบนหลังคา เด็กโตคนหนึ่งขอให้สอนวิธีเดินบนสันหลังคาโดยไม่ต้องมองเท้า {name}ก็ไม่รู้จะสอนอย่างไร เพราะไม่เคยมอง
        effects: { stats: { DEX: 1 }, gold: 7, flags: [lean_ranger] }
      failure:
        text: |
          กระเบื้องแผ่นหนึ่งหลุดใต้เท้า {name}ไถลลงไปตามลาดหลังคา คว้ารางน้ำไว้ได้ แต่รางน้ำก็หลุดตาม ตกลงไปบนหลังคาโกดังชั้นล่าง กลิ้งไปอีกสองตลบถึงหยุด

          แขนซ้ายเคล็ดจนยกไม่ขึ้นไปครึ่งเดือน สวิงหายไปกับรางน้ำ แต่ในอกเสื้อยังมีแมลงหึ่งติดมาสามตัว ปีกใสค่อยๆ หยุดสั่นทีละตัว
        effects: { stats: { WIS: 1 }, hp: -2, flags: [lean_ranger] }
    - id: sing_alley
      label: เรียกเด็กเล็กในตรอกมาร้องเพลงแข่งกับเสียงหึ่ง
      text: |
        {name}เรียกเด็กเล็กที่ยังไม่ได้ขึ้นหลังคามานั่งล้อมกองไฟในลานหลังห้องเช่า ใต้ราวตากผ้าเดิมที่เคยนั่งตอนเด็ก แล้วร้องเพลงไล่นก ร้องจนเด็กร้องตาม ร้องแล้วร้องอีก ใครเริ่มหาวก็ให้ร้องดังขึ้น

        ผู้ใหญ่ในตรอกหลับกันทั้งตรอก ตื่นสายกันทั้งตรอก และฝันเรื่องเดียวกันเหมือนทุกปี แต่เด็กสิบสองคนในลานไม่มีใครฝัน ตอนเช้ายายรับเลี้ยงที่ตอนนี้ตาฝ้าแล้วมานั่งฟังอยู่ที่ขั้นบันได แกบอกว่าตั้งแต่อยู่ย่านนี้มาเจ็ดสิบปี เพิ่งได้ยินเด็กร้องเพลงกลางดึกโดยไม่มีใครสั่ง
      effects: { stats: { CHA: 1 }, flags: [lean_bard] }
    - id: lure_lamp
      label: จุดตะเกียงน้ำมันไว้ปลายตรอก ล่อฝูงออกจากจาน
      check: { stat: INT, dc: 12 }
      success:
        text: |
          {name}สังเกตมาตั้งแต่ปีก่อนว่าแมลงหึ่งไม่สนแสงไฟธรรมดา มันสนแต่แสงฟ้า เลยขอน้ำค้างดาวก้นขวดจากอ่างล้าง หยดลงไส้ตะเกียงน้ำมันสองหยด แล้วแขวนไว้ที่ปลายตรอกริมน้ำ

          ไฟในตะเกียงเปลี่ยนเป็นสีฟ้าซีด ฝูงหนึ่งแยกออกจากจานบนหลังคาลงมาวนรอบตะเกียง วนจนน้ำมันหมด แล้วลอยกลับไปทางแม่น้ำ คืนนั้นห้องเช่าครึ่งตรอกที่อยู่ใกล้ตะเกียงไม่มีใครฝัน ช่างเวทแก่ประจำโรงได้ยินเรื่องนี้ ก็เดินมาดูตะเกียงที่ปลายตรอกด้วยตัวเอง
        effects: { stats: { INT: 1 }, flags: [lean_wizard, dew_lamp_trick] }
      failure:
        text: |
          ตะเกียงติดไฟสีฟ้าอยู่ครู่เดียว แล้วไส้ก็ไหม้หมดในพริบตา ควันสีน้ำเงินลอยขึ้นไปเป็นสาย แมลงหึ่งไม่ลงมาสักตัว

          ตอนเช้าเจ้าของห้องเช่ามาด่า เพราะควันนั้นเกาะผนังเป็นคราบฟ้าที่เช็ดไม่ออก คราบนั้นเรืองแสงจางๆ ทุกคืนอยู่อีกเดือน
        effects: { stats: { WIS: 1 }, flags: [lean_wizard] }

- id: youth.refinery_mother_glass
  stage: youth
  weight: 12
  when:
    age: [13, 13]
    flags: [origin_refinery, mother_glass]
  text: |
    หน้าหนาวปีนั้น แผ่นใสลามขึ้นมาถึงคอของ{mother} ขึ้นไปถึงใต้คางข้างซ้าย คนเดินผ่านในตรอกเห็นแสงฟ้าเต้นอยู่ใต้ผิวตรงนั้น เธอเลิกไปโรงกลั่น เพราะนับหยดไม่ได้แล้ว ไม่ใช่เพราะมือ แต่เพราะเธอรู้ก่อนว่าหยดต่อไปจะหยดเมื่อไร และคนที่รู้ก่อนจะนั่งรอไม่เป็น

    เธอเริ่มพูดเรื่องที่ยังไม่เกิด พูดเรียบๆ เหมือนเล่าว่าเมื่อวานกินอะไร พรุ่งนี้บ่ายฝนจะตก หลังคาห้องท้ายตรอกจะรั่วตรงมุมเตียง แมวของยายรับเลี้ยงจะคลอดลูกสี่ตัว ตัวสุดท้ายไม่รอด แล้วทุกอย่างก็เกิดขึ้นตามนั้น

    คืนหนึ่งเธอนั่งอยู่ริมหน้าต่าง หันมามอง{name}แล้วพูดขึ้นมาว่า "วันที่สมาคมเปิดสมุด เอ็งจะได้ยินเขาเรียกชื่อเอ็งสองหน"
  choices:
    - id: write_down
      label: หยิบถ่านมาจดทุกคำที่แม่พูด แล้วคอยดูว่าเกิดจริงไหม
      check: { stat: INT, dc: 12 }
      success:
        text: |
          {name}จดลงบนเศษกระดาษห่อขนมปัง ใส่วันที่ไว้ทุกบรรทัด ผ่านไปเดือนเดียวได้สามสิบเอ็ดบรรทัด เกิดจริงยี่สิบเก้า อีกสองบรรทัดยังไม่ถึงวัน

          {name}เริ่มเห็นว่าแม่ไม่เคยพูดถึงอะไรที่ไกลเกินสองปี และไม่เคยพูดถึงตัวเธอเองเลยสักครั้ง ตั้งแต่คืนนั้น {name}ก็ไม่จดเรื่องที่แม่พูดถึงตัว{name}เองลงไปในกระดาษอีก
        effects: { stats: { INT: 1 }, flags: [mother_sayings] }
      failure:
        text: |
          {name}จดได้ไม่กี่วันก็เริ่มจดไม่ทัน เธอพูดเร็วขึ้นทุกคืน พูดถึงคนที่{name}ไม่รู้จัก ถนนที่ไม่เคยเดิน เรือเหาะที่ยังไม่ได้ต่อ

          กระดาษห่อขนมปังกองสูงขึ้นทุกคืนจนต้องเอาไปซุกไว้ใต้ฟูก คืนไหนที่หลับไม่ลง {name}ได้ยินเสียงกระดาษกรอบแกรบอยู่ข้างใต้ หน้าต่างปิดทุกบาน ลมไม่มีสักนิด
        effects: { stats: { WIS: 1 }, flags: [lean_wizard] }
    - id: hold_hand
      label: นั่งลงข้างแม่ จับมือข้างที่เป็นแก้วไว้
      text: |
        มือข้างนั้นเย็นเหมือนกระจกหน้าต่างตอนเช้า แสงฟ้าข้างใต้เต้นช้าลงตรงที่{name}จับ เหมือนตอนเด็กที่เคยแตะครั้งแรก

        "ไม่เจ็บ" {mother}บอกเหมือนทุกครั้ง แล้วเธอก็หยุดพูดเรื่องที่ยังไม่เกิดไปทั้งคืน เล่าเรื่องสมัยเธอยังเด็กแทน เรื่องท่าเรือก่อนมีหอเรือเหาะ เรื่องพ่อของเธอที่จับปลาไหลด้วยมือเปล่า เล่าจนเธอหลับไปก่อน

        ตั้งแต่นั้นทุกคืน{name}นั่งจับมือแม่ไว้ คืนไหนจับ คืนนั้นเธอพูดถึงแต่เรื่องที่ผ่านไปแล้ว
      effects: { stats: { WIS: 1 }, alignment: { moral: 1 }, flags: [lean_cleric] }
    - id: double_shift
      label: เข้ากะแทนแม่ ทำงานคืนละสองกะ
      text: |
        ผู้จัดการเขียนชื่อ{name}ลงสมุดสองช่องโดยไม่เงยหน้า แล้วบอกว่าถ้าหลับคาหม้อเมื่อไหร่ หักทั้งสองกะ

        ข้อมือ{name}หนาขึ้นตั้งแต่เดือนแรก เดือนที่สองแบกถังน้ำเย็นสองถังขึ้นบันไดโรงได้โดยไม่ต้องพัก กลับถึงห้องตอนเช้า {mother}นั่งรออยู่ริมหน้าต่างทุกวัน บอกก่อนจะเปิดประตูว่าวันนี้ได้ค่าแรงเท่าไร ไม่เคยผิดสักเหรียญ
      effects: { stats: { STR: 1, CON: 1 }, gold: 4, flags: [lean_warrior] }
