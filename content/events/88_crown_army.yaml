# ชุด อ สายงานของอาณาจักร: กองทัพ (crown_army) 15 เรื่อง ทางเข้า 2 งานขั้นต้น 4 งานขั้นสูง 3 หีบใต้โต๊ะแผนที่ 1 เลื่อนขั้น 3 สงครามถ่าน 1 แปดฤดูหนาว 1
# คนของกอง (มีแต่ในข้อความ ไม่อยู่ในผังคน): ราเวค นายร้อยที่นับแถวทุกค่ำด้วยการแตะไหล่ ได้ย้ายไปกองอื่นในฉากขึ้นเป็นนายร้อย เรื่องที่เขายังคุมกองจึงกัน max_rank: 2
#   โรเดน นายสิบครูฝึก เสียงแหบจนต้องเคาะโล่แทน · โคลเวน นายบัญชีของกอง รู้ว่าชื่อไหนในบัญชีเบี้ยเป็นคนเป็น · การ์ริค แม่ทัพที่แก่ที่สุด ไม่นั่งหันหลังให้ประตู
# ไม่บอกเลขกอง ไม่บอกว่าค่ายอยู่เมืองไหน เรื่องที่ไม่ผูกปีไม่บอกว่าสงครามถ่านจบหรือยัง (การ์ริคพูดถึงสงครามได้เฉพาะในเรื่องที่กัน year: [318, 410])
# ทหารผี (ชื่อคนตายในบัญชีเบี้ย) อยู่ในงานซ้ำขั้นสูง ช่องลงชื่อท้ายบัญชีเป็นของคนที่ใหญ่ที่สุดในค่ายคืนนั้น จึงอ่านได้ทั้งนายร้อยและแม่ทัพ
# งานขั้นสูงที่ตัดสินหน้างาน (เมืองลุก ทางสายไกล) กัน max_rank: 3 · แปดฤดูหนาวกัน max_rank: 3 เพราะแม่ทัพไม่ได้รอใบปลดหรือข้ามกำแพงค่าย
# ขยับค่าอาณาจักร: เมืองลุกกับทางสายไกล ±1 (นายร้อย) · หีบแผนสี่ย่าน ±2 (แม่ทัพ) ทางที่ปัดไม่ขยับค่า
# ผลงานเพิ่มนอกงาน: ยืนรับหิน 1 · ขบวนถ่าน (ชนะ) 1 · ปีนเกวียนเจรจา 1 · ทิ้งสิบคนไว้กับหมู่บ้าน 1 · ลงชื่ออีกแปดฤดูหนาว 1 (ทุกรอบสัญญา) · ยืนแถวในสงครามถ่าน 1 รวม 6 (ทางเข้า ข เริ่มที่ผลงาน 2)

# ---------- ทางเข้า ----------
- id: adult.army_market_drum
  stage: adult
  scene: market
  weight: 6
  when:
    age: [20, 40]
    location_tag: [arvel_village, ventras, kardin]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    max_hunted: { crown: 0 }
    not_flags: [job_wardens, job_fort_priest, discharged_from_the_army, deserted_the_army]
  text: |
    กลองรับคนของกองทัพมาถึงตลาดพร้อมเกวียนเสบียงเปล่าคันหนึ่ง เด็กหนุ่มคนตีกลองยืนบนท้ายเกวียน ตีจังหวะเดียวซ้ำไปซ้ำมาจนแม่ค้าปลาเค็มแผงข้างๆ เอาสำลีอุดหู ข้างเกวียนมีโต๊ะพับตัวหนึ่ง สมุดรับคน ขวดหมึก กับไม้พลองยาวหนึ่งท่อน

    นายสิบที่นั่งโต๊ะชื่อโรเดน เสียงแหบจนพูดได้แค่กระซิบ เขาเลยไม่พูด เขาถือไม้เรียวเคาะโล่ที่พิงขาโต๊ะแทนเสียง เคาะหนึ่งทีคือเข้ามา เคาะสองทีคือไปให้พ้น ใครจะลงชื่อต้องยืนถือไม้พลองเหยียดแขนตรงไปข้างหน้าจนกลองหยุด ไม้พลองไม่ใช่หอก แต่หนักเท่าหอก

    ประกาศตอกไว้ข้างเกวียนเขียนสั้นๆ ลงชื่อแปดฤดูหนาว ได้รองเท้าหนึ่งคู่ เสื้อสองตัว ข้าววันละสองมื้อ เบี้ยทุกเดือน ครบแปดฤดูหนาวได้ใบปลดกับเบี้ยก้อน ไม่ครบไม่ได้อะไร ชายคนก่อน{name}ปลายไม้พลองตกแตะดินตอนกลองตีไปได้ไม่ถึงครึ่ง โรเดนเคาะโล่สองที
  choices:
    - id: hold_the_staff_out
      label: รับไม้พลองมาเหยียดแขนถือไว้จนกลองหยุด
      requires: { not_traits: [curse_brand] }
      check: { stat: STR, dc: 13 }
      success:
        text: |
          เด็กตีกลองเห็นว่ามีคนถือได้นาน เลยตีนานกว่าปกติ แขนของ{name}สั่นตั้งแต่กลางทาง ปลายไม้พลองแกว่งเป็นวงเล็กๆ แต่ไม่ตก พอกลองหยุด แม่ค้าปลาเค็มดึงสำลีออกจากหูข้างหนึ่งแล้วปรบมือ

          โรเดนเคาะโล่หนึ่งที แล้วเขียนชื่อลงสมุด รองเท้าที่ได้ใหญ่กว่าเท้าหนึ่งเบอร์ เขากระซิบว่าเดินไปสักเดือนเท้าจะบวมจนพอดีเอง
        effects:
          mark: เข้าเป็นพลทหาร
          org: { id: crown_army, join: true }
          stats: { STR: 1 }
          flags: [held_the_drum_staff]
      failure:
        text: |
          ปลายไม้พลองตกลงแตะดินตอนกลองตีได้สองในสาม ไหล่ขวาของ{name}ร้อนเหมือนมีใครเอาเหล็กเผามาวาง โรเดนเคาะโล่สองที ไม่ได้เงยหน้า

          ขากลับ{name}ยกแขนข้างนั้นขึ้นหวีผมไม่ได้ไปสามวัน เสียงกลองยังดังมาจากตลาดจนตะวันตกดิน
        effects: { hp: -1, flags: [dropped_the_drum_staff] }
    - id: sign_without_the_staff
      label: บอกโรเดนว่าแขนจะแข็งเองในแปดฤดูหนาว แล้วขอลงชื่อเลย
      requires: { not_traits: [curse_brand] }
      text: |
        โรเดนดูฝ่ามือของ{name}ทั้งสองข้าง พลิกหลังมือ แล้วเคาะโล่หนึ่งที เขากระซิบว่าไม้พลองไม่ได้มีไว้คัดคนแขนแข็ง มีไว้ดูว่าใครจะวางมันลงก่อนกลองหยุด คนที่ขอลงชื่อโดยไม่ยกเลยก็บอกเรื่องเดียวกันได้

        ชื่อของ{name}ลงสมุดเป็นชื่อที่สามของวัน ถัดจากเด็กหนุ่มลูกคนขายปลาเค็ม
      effects:
        mark: เข้าเป็นพลทหาร
        org: { id: crown_army, join: true }
        alignment: { law: 1 }
        flags: [signed_without_the_staff]
    - id: buy_fish_and_go
      label: ซื้อปลาเค็มแผงข้างๆ แล้วเดินออกจากเสียงกลอง
      text: |
        แม่ค้าปลาเค็มห่อปลาให้สองตัว ด้วยกระดาษที่ฉีกมาจากประกาศรับคนแผ่นเก่า บอกว่ากลองมาทุกปีนับเตา ปีไหนคนในตลาดอดมาก ปีนั้นกลองตีไม่ถึงเที่ยงก็ได้คนครบ

        ตอนเดินออกจากตลาด เสียงกลองยังตามมาข้างหลัง {name}เดินช้าลงไปหน่อยหนึ่งโดยไม่ตั้งใจ ให้เท้าตรงกับจังหวะ
      effects: { flags: [walked_away_from_the_drum] }

- id: adult.army_short_count
  stage: adult
  scene: fort
  weight: 14
  time: dusk
  when:
    age: [20, 40]
    location_tag: [arvel_village, ventras, kardin]
    any_flags: [war_veteran, job_mercenary, job_scout, job_bounty_hunter]
    not_orgs: [wick, cold_iron, reclaimers, ash_cult, star_listeners, crown_office, crown_army, crown_court, wardens]
    max_hunted: { crown: 0 }
    not_flags: [job_wardens, job_fort_priest, discharged_from_the_army, deserted_the_army]
  text: |
    ค่ายของกองทัพตั้งนอกเมืองเสมอ ห่างพอให้กลองตอนเช้าปลุกคนในเมืองได้ แต่ไกลพอที่ทหารจะเดินเข้าร้านเหล้าไม่ได้ทุกคืน {name}เดินผ่านทางหน้าค่ายตอนค่ำ พอดีกับเวลาที่ทหารแถวหนึ่งยืนเรียงหน้ากระโจม

    นายร้อยคนหนึ่งเดินจากหัวแถวไปท้ายแถว แตะไหล่ทีละคนด้วยฝ่ามือ ไม่ขานชื่อ ไม่นับออกเสียง ปากขยับเงียบๆ ท้ายแถวขาดไปหนึ่งคน {name}หยุดยืนตรงที่ว่างนั้นพอดี ห่างแถวสองก้าว ตัวตั้งตรงเองแบบคนที่เคยถืออาวุธยืนรอเวลามาแล้ว

    ฝ่ามือของนายร้อยวางลงบนไหล่{name} หนักและอุ่น แล้วยกขึ้น เขาหยุด หันมาดูหน้า บอกว่าแถวครบแล้ว ถามว่าอยากให้มันครบจริงไหม เขาชื่อราเวค
  choices:
    - id: stay_in_the_count
      label: ก้าวเข้าไปยืนชิดไหล่คนสุดท้าย
      requires: { not_traits: [curse_brand] }
      text: |
        ใบลงชื่อแปดฤดูหนาวเขียนกันบนหน้ากลองใต้ตะเกียง ราเวคบอกว่ากองไม่นับปีที่อยู่นอกแถว ใครมาก็เริ่มที่พลทหาร แต่คนที่ยืนตรงได้โดยไม่ต้องสั่ง เขาจำได้

        ตีหนึ่ง ทหารคนที่ขาดเดินโซเซกลับเข้าค่าย เจอที่ของตัวเองมีคนนอนแล้ว เลยไปนอนท้ายกระโจมถัดไป เช้ามาเขาถาม{name}ว่าเตียงนุ่มไหม แล้วยื่นถุงยาเส้นให้หนึ่งถุงเป็นค่าเช่า
      effects:
        mark: เข้าเป็นพลทหาร
        org: { id: crown_army, join: true, merit: 2 }
        flags: [stood_in_raveks_count]
    - id: keep_the_iron_cap_on
      label: รับหมวกเหล็กของกองมาสวม แล้วไม่ถอดอีกเลย
      requires: { flag: horns_sawn }
      text: |
        หมวกเหล็กของกองเป็นทรงชามคว่ำ ครอบลึกถึงใบหู สายรัดคาง กฎค่ายให้สวมตั้งแต่กลองเช้าจนนับแถวค่ำ {name}สวมต่อไปจนถึงตอนนอน คนในกระโจมล้อว่าคนใหม่กลัวฟ้าผ่า ล้อได้สามคืนก็เลิก เพราะไม่มีใครได้ยินคำตอบ

        ทุกค่ำ ฝ่ามือของราเวคแตะไหล่{name}เหมือนแตะไหล่คนอื่น ไม่เคยเลยขึ้นไปถึงหมวก
      effects:
        mark: เข้าเป็นพลทหาร
        org: { id: crown_army, join: true, merit: 2 }
        flags: [serves_the_crown_with_hidden_horns]
    - id: point_to_the_tavern
      label: ถอยออกจากแถว บอกราเวคว่าเห็นทหารคนหนึ่งหลับอยู่หลังร้านเหล้า
      text: |
        ราเวคส่งทหารสองคนไปหิ้วตัวกลับมา แล้วยืนรอที่ท้ายแถวจนพวกนั้นกลับมา แถวยืนรอไปด้วยจนน้ำค้างลงหมวก เขาแตะไหล่คนที่หิ้วกลับมาเป็นคนสุดท้าย แตะแรงกว่าคนอื่น

        ก่อน{name}จะเดินจากไป ราเวคบอกว่าถ้าเปลี่ยนใจ ให้มาตอนค่ำ ตอนเช้าเขาไม่ว่าง
      effects: { reputation: { crown: 1 }, flags: [pointed_ravek_to_his_missing_man] }

# ---------- งานขั้นต้น (พลทหาร นายสิบ) ----------
- id: adult.army_duty_coal_train
  stage: adult
  scene: road
  weight: 20
  duty: crown_army
  when:
    age: [20, 64]
    org: { id: crown_army, max_rank: 2 }
  text: |
    ขบวนถ่านยาวสิบสองตู้ ทหารหกคนนั่งบนกองถ่านของตู้ท้าย หอกพาดตัก ถ่านมารใต้ก้นอุ่นตลอดทาง อุ่นจนเผลอหลับได้ถ้าไม่ระวัง ขาไปเป็นทางขึ้น ขบวนคลานช้ากว่าคนเดิน

    ตรงทางโค้งที่รางผ่าเนินดิน ขบวนกระตุกแล้วหยุด หัวรถส่งเสียงเหล็กครูดยาว คนขับตะโกนมาว่าหมุดรางหายไปสามตัว รอยชะแลงบนหมอนไม้ยังใหม่ ขี้เลื่อยยังไม่ทันแห้ง

    บนสันเนินทั้งสองฝั่ง คนสิบกว่าคนลุกขึ้นจากพงหญ้า ผ้าพันหน้า มือถือชะแลงกับกระบอง ผู้หญิงคนหนึ่งลากกระสอบเปล่ามาสามใบ พวกเขาไม่ได้มาเอาตัวทหาร พวกเขามาเอาถ่าน
  encounter:
    foe: bandit
    name: คนถอดหมุดราง
    morale: 2
    beats:
      - text: พวกเขาไถลลงเนินมาพร้อมกัน ตรงมาที่ตู้ท้าย ทหารอีกห้าคนลุกขึ้นบนกองถ่าน บางคนยังงัวเงีย
        moves:
          - id: coal_shoulder_line
            label: กระโดดลงไปยืนไหล่ชิดไหล่ข้างตู้ ตั้งปลายหอกรอ
            kind: guard
          - id: coal_spear_first
            label: แทงคนแรกที่มาถึงล้อ
            kind: attack
            tags: [pierce]
          - id: coal_shout_hot
            label: ตะโกนว่าถ่านในตู้ร้อนพอจะลอกหนังมือ
            kind: talk
          - id: coal_watch_sacks
            label: ดูให้ออกว่าใครในพวกนั้นเป็นคนสั่ง
            kind: read
            stat: WIS
            success: คนถือชะแลงอันยาวที่สุดไม่ได้วิ่งนำ เขาเดินช้าอยู่ข้างหลัง ตามองหัวรถ ไม่ได้มองทหาร ผู้หญิงที่ลากกระสอบเป็นคนเดียวที่หันมาดูเขาก่อนจะขยับ ถ้าเขาถอย ที่เหลือถอยตาม
          - id: coal_run_engine
            label: วิ่งเลียบขบวนไปตามคนขับที่หัวรถ
            kind: flee
      - text: ชายถือชะแลงยาวปีนขึ้นไปยืนคร่อมข้อต่อระหว่างตู้ที่สิบเอ็ดกับสิบสอง งัดสลักข้อต่อ ถ้าสลักหลุด ตู้ท้ายจะไหลถอยลงเนินไปเอง
        answer: quick
        moves:
          - id: coal_knock_coupling
            label: กระทุ้งด้ามหอกใส่เข่าเขาให้ตกจากข้อต่อ
            kind: quick
            tags: [blunt]
          - id: coal_stand_on_pin
            label: ลงไปยืนเหยียบสลักข้อต่อไว้
            kind: guard
          - id: coal_toss_a_sack
            label: โยนถ่านลงไปให้หนึ่งกระสอบ แลกกับให้เขาลงจากข้อต่อ
            kind: talk
            parley: true
          - id: coal_drag_him
            label: คว้าชายเสื้อเขากระชากขึ้นมาบนกองถ่าน
            kind: attack
          - id: coal_jump_clear
            label: กระโดดลงจากตู้ไปให้พ้นก่อนมันไหล
            kind: flee
      - text: พวกที่เหลือเริ่มตักถ่านจากตู้ที่สิบลงกระสอบด้วยมือเปล่า มือพองแดงตั้งแต่กำแรก ผู้หญิงลากกระสอบใบที่เต็มแล้วถอยขึ้นเนิน
        moves:
          - id: coal_chase_sack
            label: วิ่งขึ้นเนินไปตัดหน้าผู้หญิงลากกระสอบ
            kind: quick
          - id: coal_hold_wagon
            label: ยืนขวางหน้าตู้ที่สิบ ปลายหอกลง
            kind: guard
          - id: coal_tell_them_go
            label: บอกให้เอากระสอบที่เต็มแล้วไป ถ้าไปตอนนี้
            kind: talk
          - id: coal_shaft_swing
            label: กวาดด้ามหอกเป็นวงรอบตัว
            kind: attack
            tags: [blunt]
          - id: coal_back_to_engine
            label: ถอยกลับไปรวมกับคนขับที่หัวรถ
            kind: flee
    win:
      text: |
        คนถอดหมุดรางวิ่งขึ้นเนินไปทั้งสองฝั่ง ทิ้งชะแลงไว้สองอันกับกระสอบเปล่าหนึ่งใบ ทหารเอาชะแลงของพวกเขานั่นเองตอกหมุดรางกลับเข้าที่ ขบวนออกได้ก่อนค่ำ

        ปลายทาง นายบัญชีของลานถ่านชั่งตู้ท้ายแล้วจดว่าครบ บนสันเนินที่ขบวนผ่านไป มีควันไฟหุงข้าวขึ้นจากหมู่บ้านข้างล่างแค่สามปล่อง
      effects: { org: { id: crown_army, merit: 1 }, flags: [drove_off_the_spike_pullers] }
    parley:
      text: |
        กระสอบถ่านตกลงข้างราง ชายถือชะแลงลงจากข้อต่อ แบกกระสอบขึ้นบ่าเอง แล้วทั้งกลุ่มก็ถอยกลับขึ้นเนินไปทีละคน ไม่มีใครหันมาอีก

        ปลายทาง นายบัญชีของลานถ่านชั่งตู้ท้ายขาดไปหนึ่งกระสอบ เขาจดในช่องหมายเหตุว่าหกระหว่างทาง แล้วเรียกเก็บค่าถ่านที่หกจากเบี้ยของทหารทั้งหกคนเท่ากัน
      effects: { gold: -1, flags: [paid_the_spike_pullers_a_sack] }
    stalemate:
      text: |
        ตะวันลับเนินก่อนจะมีใครยอมใคร คนถอดหมุดรางถอยกลับขึ้นไปพร้อมกระสอบเต็มสองใบ ทหารตอกหมุดกลับเข้าที่ด้วยหินกับด้ามหอกจนเกือบเที่ยงคืน

        ขบวนถึงปลายทางช้าไปครึ่งวัน คนขับบ่นไม่หยุดว่าลานถ่านจะหักค่าเที่ยวเขา
      effects: { flags: [held_the_coal_train_till_dark] }
    flee:
      text: |
        คนขับกับ{name}หลบอยู่หลังหัวรถจนเสียงข้างหลังเงียบ ตู้ที่สิบกับสิบเอ็ดโล่งไปครึ่งตู้ ถ่านหกเป็นทางขึ้นเนิน

        คนในขบวนไม่มีใครพูดถึงตอนกินข้าวเย็น นายบัญชีของลานถ่านจดชื่อทหารทั้งหกคนไว้ท้ายใบรับ
      effects: { flags: [ran_from_the_spike_pullers] }
    lose:
      text: |
        {name}ฟื้นขึ้นมาบนกองถ่านของตู้ท้าย ท้ายทอยปูดเท่าไข่ไก่ ขบวนวิ่งต่อแล้ว คนขับเป็นคนลากขึ้นมา คนถอดหมุดรางไปกับกระสอบเต็มทั้งสามใบ

        ปลายทาง นายบัญชีชั่งตู้ท้ายแล้วส่ายหัว ทหารคนหนึ่งในตู้บอกว่าอย่างน้อยไม่มีใครตาย นายบัญชีบอกว่าถ่านก็ไม่ได้ตาย
      effects: { flags: [lost_coal_to_the_spike_pullers] }

- id: adult.army_duty_stone_market
  stage: adult
  scene: market
  weight: 20
  duty: crown_army
  when:
    age: [20, 64]
    org: { id: crown_army, max_rank: 2 }
  text: |
    ตลาดเริ่มขว้างหินตั้งแต่สาย ตอนที่คนของศาลาขึ้นไปตอกประกาศราคาเกลือใหม่บนเสาหน้าโรงชั่ง ก้อนแรกโดนประกาศ ก้อนที่สองโดนคนตอก พอกองมาถึง ประกาศขาดเหลือครึ่งแผ่น คนตอกนั่งกุมหัวอยู่ใต้ชายคาโรงชั่ง

    กองตั้งแถวหน้าโรงชั่ง หอกตั้งตรง ปลายหอกชี้ฟ้า ไม่ได้ชี้คน คำสั่งที่ส่งต่อกันลงมาตามแถวมีคำเดียว ยืน หินลอยมาเป็นระยะ ส่วนมากตกก่อนถึงแถว บางก้อนถึง ก้อนหนึ่งกระทบหมวกเหล็กของคนข้าง{name}ดังเป๊ง เขาเซแล้วกลับมายืนที่เดิม

    คนขว้างแม่นที่สุดเป็นเด็กชายตัวเล็กบนหลังคาร้านขายผ้า เขาเลือกหินจากกองในชายเสื้อ เล็งนาน แล้วขว้างทีละก้อน
  choices:
    - id: stand_under_the_stones
      label: ยืนอยู่ในแถวตามคำสั่ง ไม่ยกโล่บังหน้า
      text: |
        ก้อนหนึ่งของเด็กบนหลังคามาถึง{name}ตอนเกือบเที่ยง โดนโหนกแก้มข้างซ้าย {name}ไม่ได้ขยับ เลือดไหลลงคางหยดใส่สายรัดอก แถวทั้งแถวเห็น ตลาดทั้งตลาดเห็น

        บ่ายนั้นหินลอยมาน้อยลง ไม่ใช่เพราะใครสั่ง ตอนเย็นแม่ค้าคนหนึ่งเอาผ้าชุบน้ำมายื่นให้ข้ามหัวแถว ไม่ได้มองหน้า รอยบนโหนกแก้มเขียวอยู่ครึ่งเดือน
      effects: { hp: -1, org: { id: crown_army, merit: 1 }, flags: [stood_under_the_stones] }
    - id: pull_the_boy_down
      label: ออกจากแถว ปีนขึ้นหลังคาร้านผ้าไปเอาตัวเด็กลงมา
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          {name}ขึ้นทางกองลังหลังร้าน จับข้อเท้าเด็กได้ก่อนเขาจะทันกระโดดข้ามไปหลังคาถัดไป หินในชายเสื้อร่วงกราวลงรางน้ำ เด็กตัวเบากว่าที่คิด ดิ้นแรงกว่าที่คิด

          ข้างล่าง แม่ของเด็กแหวกคนมาถึงก่อนคนของศาลา {name}ส่งเด็กให้แม่ ไม่ได้ส่งให้ศาลา ก่อนเดินกลับเข้าแถว นางตบหลังลูกชายแรงกว่าที่ทหารคนไหนจะกล้าตี
        effects: { stats: { DEX: 1 }, flags: [took_the_stone_boy_down] }
      failure:
        text: |
          กระเบื้องแผ่นหนึ่งแตกใต้เท้า {name}ไถลลงตามหลังคา ตกลงบนกองผ้าข้างร้าน ข้อมือพลิก เด็กกระโดดข้ามไปหลังคาถัดไปแล้วหายไปในตลาด

          ทั้งตลาดหัวเราะดังกว่าตอนขว้างหิน นายร้อยหักเบี้ยค่ากระเบื้องให้เจ้าของร้านผ้า
        effects: { hp: -2, gold: -1, flags: [fell_off_the_cloth_roof] }
    - id: pick_up_the_stones
      label: วางหอกพิงแถว เดินไปเก็บหินที่ตกหน้าแถวมากองไว้ข้างโรงชั่ง
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}ก้มเก็บหินทีละก้อน กองไว้ข้างกำแพงโรงชั่งเป็นระเบียบ ก้อนใหญ่ไว้ล่าง ก้อนเล็กไว้บน คนในตลาดเริ่มหยุดขว้างเพื่อดู บางคนหัวเราะ พอกองสูงถึงเข่า เด็กบนหลังคาร้านผ้าก็ขว้างก้อนสุดท้ายลงมาให้ตกที่กอง

          ตกเย็นกองหินนั้นยังตั้งอยู่ข้างโรงชั่ง วันตลาดครั้งต่อมามีคนเอาหินมาวางเพิ่มทีละก้อน
        effects: { stats: { CHA: 1 }, flags: [stacked_the_market_stones] }
      failure:
        text: |
          พอ{name}ก้มลง ก้อนหนึ่งก็มาโดนกลางหลังพอดี อีกก้อนโดนมือ คนในตลาดเห็นทหารก้มอยู่กลางลานก็ยิ่งขว้าง นายร้อยตะโกนเรียกกลับเข้าแถว

          หินที่เก็บได้ไม่ถึงสิบก้อนกองอยู่ข้างโรงชั่ง เด็กบนหลังคาร้านผ้าหยิบไปขว้างใหม่ได้สองก้อน
        effects: { hp: -1, flags: [stacked_the_market_stones] }
    - id: step_back_from_the_stones
      label: ขอเปลี่ยนไปยืนแถวหลัง
      refuse: true
      text: |
        คนที่ขึ้นมายืนแทนที่ของ{name}ในแถวหน้าเป็นพลทหารที่หมวกเหล็กหลวมเกินหัว ก่อนเที่ยง หินก้อนหนึ่งลอดขอบหมวกมาโดนหางตา เขาต้องปิดตาข้างนั้นไว้ด้วยผ้าอยู่หลายวัน

        ในกระโจมคืนนั้น เขานั่งเงียบอยู่ปลายเตียง ผ้าปิดตายังชื้น
      effects: { flags: [stepped_back_from_the_stones] }

- id: adult.army_duty_camp_ditch
  stage: adult
  scene: fort
  weight: 20
  once: false
  time: dusk
  duty: crown_army
  when:
    age: [20, 64]
    org: { id: crown_army, max_rank: 2 }
  text: |
    กองย้ายค่ายเมื่อไร คืนแรกต้องมีคู ไม่มีข้อยกเว้น ไม่ว่าค่ายจะตั้งแค่สามคืนหรือสามฤดู คูลึกเท่าด้ามพลั่ว กว้างเท่าคนนอนขวาง ดินที่ขุดขึ้นมากองเป็นคันด้านใน คนละหนึ่งช่วงหอก ขุดเสร็จถึงได้กินข้าว

    โรเดนเดินตามคูพร้อมไม้เรียว จิ้มก้นคูทุกช่วงหอก ถ้าไม้จมไม่ถึงรอยบากที่เขาสลักไว้ เขาเคาะโล่ของเจ้าของช่วงนั้นหนึ่งที แล้วเดินต่อ ไม่ต้องพูดสักคำ ทุกคนรู้ว่าต้องขุดต่อ

    ช่วงของ{name}เจอรากไม้ใหญ่ตั้งแต่พลั่วแรก ช่วงถัดไปเป็นของพลทหารคนหนึ่งที่มือพองแตกตั้งแต่ค่ายก่อน เขาขุดได้ครึ่งเดียวของคนอื่น ผ้าพันมือมีจุดแดงขึ้นเป็นดวง
  choices:
    - id: chop_through_the_root
      label: เอาสันพลั่วฟันรากจนขาด ขุดให้ถึงรอยบาก
      text: |
        รากขาดตอนฟ้ามืดสนิท ข้างในเป็นสีส้มสดและมีกลิ่นเหมือนขิง {name}ขุดต่อจนไม้เรียวของโรเดนจมถึงรอยบาก เขาไม่เคาะโล่ เดินผ่านไปเฉยๆ ในค่ายนี้นั่นนับเป็นคำชม

        ข้าวที่เหลือในหม้อเย็นแล้ว มีแต่ก้นหม้อ{name}กินได้หมด
      effects: { alignment: { law: 1 }, flags: [chopped_the_ditch_root] }
    - id: dig_his_half_too
      label: ขุดช่วงของตัวเองเสร็จแล้วลงไปขุดช่วงของเขาต่อ
      check: { stat: CON, dc: 13 }
      success:
        text: |
          {name}ลงไปยืนในช่วงของเขาโดยไม่ถาม เขาขยับไปให้โดยไม่ถามเหมือนกัน สองคนขุดจนช่วงนั้นถึงรอยบากก่อนโรเดนเดินมาถึง โรเดนจิ้มไม้ลงไป ดูผ้าพันมือของพลทหารคนนั้น แล้วดูมือของ{name}

          คืนนั้นในกระโจม พลทหารคนนั้นแบ่งปลาแห้งให้ครึ่งตัว เขามีแค่ตัวเดียว
        effects: { alignment: { moral: 1 }, flags: [dug_the_next_mans_ditch] }
      failure:
        text: |
          ช่วงของตัวเองเสร็จ ช่วงของเขาขุดไปได้ครึ่ง มือของ{name}ก็พองแตกตามไปอีกคน โรเดนเคาะโล่ของทั้งสองคนหนึ่งที เคาะเท่ากัน

          สองคนนั่งขุดต่อด้วยมือที่พันผ้าจนเลยเที่ยงคืน ข้าวหมดหม้อไปนานแล้ว
        effects: { hp: -1, flags: [dug_the_next_mans_ditch] }
    - id: pay_a_camp_boy
      label: จ้างเด็กเลี้ยงล่อของค่ายหนึ่งเหรียญให้ขุดช่วงของตัวเอง
      refuse: true
      text: |
        เด็กเลี้ยงล่อขุดเร็ว ขุดตื้น ไม้เรียวของโรเดนจมได้ครึ่งเดียวของรอยบาก เขาเคาะโล่ของ{name}สองที แล้วเคาะโล่ของทุกคนในหมู่เดียวกันอีกคนละสองที

        ทั้งหมู่ลงไปขุดช่วงนั้นใหม่ด้วยกันใต้คบไฟ ไม่มีใครด่า{name}ออกเสียง แต่คืนนั้นไม่มีใครแบ่งยาเส้นให้
      effects: { gold: -1, flags: [paid_a_boy_for_the_ditch] }

- id: adult.army_duty_road_stones
  stage: adult
  scene: road
  weight: 20
  once: false
  duty: crown_army
  when:
    age: [20, 64]
    org: { id: crown_army, max_rank: 2 }
  text: |
    เดินตรวจทางหลวงคือเดินจากหลักหินหนึ่งไปอีกหลักหนึ่ง หลักละครึ่งวัน สองคนต่อหนึ่งช่วง ไปเช้ากลับค่ำ หลักหินทุกหลักมีรอยมีดของทหารรุ่นก่อนขีดไว้เต็ม บางรอยเป็นชื่อ บางรอยเป็นจำนวนวันที่เหลือก่อนครบแปดฤดูหนาว

    ระหว่างหลักที่สามกับหลักที่สี่ มีโรงน้ำชาริมทางของหญิงแก่คนหนึ่ง นางรินชาให้ทหารไม่คิดเงิน แลกกับข่าวว่าทางข้างหน้ามีใครเดินผ่านบ้าง ชาของนางขมจนลิ้นชา คนเดินตรวจทุกคนดื่มหมดถ้วย

    วันนี้คนที่เดินคู่กับ{name}เป็นทหารที่ใกล้ครบแปดฤดูหนาว เขาเดินช้า แล้วเริ่มพูดถึงทางลัดผ่านไร่ข้าวโพด ตัดหลักที่สี่ทิ้งไปได้ทั้งหลัก
  choices:
    - id: walk_to_the_fourth_stone
      label: เดินทางหลวงไปจนถึงหลักที่สี่
      text: |
        เลยหลักที่สามไปไม่ไกล เกวียนผักคันหนึ่งล้อหลุดจอดเอียงอยู่ข้างทาง คนขับเป็นเด็กหญิงกับยาย {name}กับคู่เดินช่วยกันยกเพลาให้ยายสวมล้อ ยายให้แตงกวาคนละสองลูก คู่เดินบ่นตลอดทางกลับว่าถ้าไปทางไร่ข้าวโพดป่านนี้ได้นอนแล้ว

        ตอนค่ำ{name}ขีดรอยมีดของตัวเองลงบนหลักที่สี่ รอยเดียว สั้นๆ ข้างรอยของคนอื่น
      effects: { gold: 1, alignment: { law: 1 }, flags: [walked_to_the_fourth_stone] }
    - id: take_the_corn_shortcut
      label: ตามคู่เดินลัดไร่ข้าวโพด เดินตามร่องให้ระวัง
      check: { stat: DEX, dc: 13 }
      success:
        text: |
          สองคนเดินตามร่องระหว่างแถวข้าวโพดไม่เหยียบต้นไหนเลย ออกมาถึงทางหลวงอีกฝั่งก่อนเที่ยง แวะโรงน้ำชาได้สองรอบ หญิงแก่ถามว่าทางข้างหน้ามีใครผ่าน คู่เดินตอบว่าไม่มีใคร เขาตอบเร็วเกินไป

          หญิงแก่รินชาให้ครบถ้วยเหมือนทุกวัน แต่ไม่ได้นั่งคุยด้วย
        effects: { flags: [took_the_corn_shortcut] }
      failure:
        text: |
          คู่เดินเหยียบต้นข้าวโพดหักไปสามต้นเป็นทาง เจ้าของไร่ยืนรออยู่ที่ปลายร่องพร้อมเคียว เขาไม่ได้ยกเคียว เขายื่นมือออกมา

          {name}จ่ายค่าข้าวโพดสองเหรียญ คู่เดินจ่ายครึ่งเหรียญ บอกว่าเงินเหลือแค่นั้นจริงๆ จนครบแปดฤดูหนาว
        effects: { gold: -2, flags: [took_the_corn_shortcut] }
    - id: nap_under_the_bridge
      label: นอนใต้สะพานข้างหลักที่สามจนบ่ายคล้อย แล้วเดินกลับ
      refuse: true
      text: |
        ใต้สะพานเย็นและมีเสียงน้ำ หลับง่าย สองคนตื่นมาตอนบ่ายคล้อยแล้วเดินกลับค่าย รายงานว่าทางหลวงปกติดี

        วันรุ่งขึ้นหญิงแก่ที่โรงน้ำชาเล่าให้คนเดินตรวจคู่ใหม่ฟัง ว่าเมื่อวานบ่ายมีคนขับเกวียนผักโดนตีหัวเอาเงินไปที่ข้างหลักที่สี่ นางรินชาให้ครบถ้วยโดยไม่เงยหน้า
      effects: { flags: [slept_under_the_patrol_bridge] }

# ---------- งานขั้นสูง (นายร้อย แม่ทัพ) ----------
- id: adult.army_duty_hall_riot
  stage: adult
  scene: market
  weight: 20
  duty: crown_army
  when:
    age: [25, 64]
    org: { id: crown_army, min_rank: 3, max_rank: 3 }
  text: |
    คนในเมืองปิดประตูศาลาอำเภอด้วยเกวียนสามคัน คว่ำเอาล้อชี้ฟ้า นายอำเภอกับเสมียนสองคนติดอยู่ข้างใน ส่งจดหมายลอดหน้าต่างหลังมาถึงค่าย ขอให้กองมาเปิดประตู ลายมือสั่น เขียนคำว่าด่วนไว้สามครั้ง

    {name}พาคนหนึ่งร้อยเข้าเมืองตอนบ่าย คำสั่งจากข้างบนยังไม่มา คำสั่งจากข้างบนไม่เคยมาทันเรื่องแบบนี้ ลานหน้าศาลามีคนสองสามร้อย ผู้หญิงมากกว่าผู้ชาย หลายคนถือตะกร้าเปล่า บนเกวียนคันกลาง ชายคนหนึ่งยืนตะโกนว่ายุ้งหลวงปิดมาสามสิบวันแล้ว

    คนถือกลองของกองยืนรออยู่ข้าง{name} ไม้กลองยกค้าง จังหวะแรกของกลองคือตั้งแถว จังหวะที่สองคือเดินหน้า
  choices:
    - id: drum_the_line_forward
      label: ให้กลองตีสองจังหวะ
      text: |
        แถวเดินหน้าไหล่ชิดไหล่ ด้ามหอกขวางระดับอก ไม่ใช้ปลาย คนหน้าศาลาถอยไปทีละก้าวตามกลอง ทหารลากเกวียนสามคันออกจากประตูได้ก่อนตะวันตก ตะกร้าเปล่าหลายใบแบนอยู่ใต้รองเท้าทหาร

        ประตูศาลาเปิด นายอำเภอออกมายืนบนระเบียง ขอบคุณกองเสียงดังให้ทั้งลานได้ยิน ตอนนั้นในลานเหลือแต่ทหาร
      effects: { world: { peace: 1, throne: -1 }, alignment: { law: 1 }, flags: [cleared_the_hall_by_the_drum] }
    - id: climb_the_middle_cart
      label: ปีนขึ้นเกวียนคันกลาง ไปยืนข้างชายที่ตะโกน
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}บอกคนในลานว่าจะเข้าไปในศาลาเอง ออกมาพร้อมตรายุ้งหลวง ถ้าออกมาไม่ได้ ให้คนในลานเผาเกวียนได้ ชายที่ตะโกนลงจากเกวียนก่อน แล้วคนก็เปิดทางให้

          ยุ้งหลวงเปิดตอนค่ำ มีทหารของกองยืนตักข้าวให้บ้านละตวง ข้าวในยุ้งพร่องลงไปครึ่งยุ้งในสามวัน นายอำเภอเขียนจดหมายไปคลัง โทษว่าเป็นคำสั่งของกอง เขาไม่ได้โกหก
        effects: { stats: { CHA: 1 }, world: { peace: 1, treasury: -1 }, org: { id: crown_army, merit: 1 }, flags: [talked_the_hall_riot_down] }
      failure:
        text: |
          เสียงของ{name}ไปไม่ถึงครึ่งลาน หินก้อนหนึ่งลอยมาจากข้างหลังคนฟัง โดนคิ้วแตก เลือดเข้าตา คนข้างล่างเริ่มดันเกวียน {name}ลงจากเกวียนแล้วโบกมือให้คนถือกลอง

          กลองตีสองจังหวะ แถวเดินหน้า ประตูศาลาเปิดก่อนค่ำ ตะกร้าเปล่าแบนอยู่ทั่วลานเหมือนกัน
        effects: { hp: -2, world: { peace: 1, throne: -1 }, flags: [talked_the_hall_riot_down] }
    - id: take_him_out_the_back
      label: ส่งสิบคนอ้อมไปหลังศาลา พานายอำเภอออกทางหน้าต่าง ทิ้งศาลาเปล่าไว้ให้ลาน
      text: |
        นายอำเภอปีนออกทางหน้าต่างหลังพร้อมกล่องตรา ขาเสื้อขาดเพราะติดกลอน สิบคนพาเขาไปค่ายทางทุ่ง คนในลานไม่รู้ว่าศาลาว่างจนพังประตูเข้าไปตอนพลบค่ำ ข้างในมีโต๊ะ สมุด กับขวดหมึก

        ยุ้งหลวงปิดต่อไปอีกเดือน เพราะตราอยู่ในค่าย หีบภาษีปีนั้นออกจากอำเภอครบ ศาลาไม่มีบานหน้าต่างไปทั้งหน้าฝน
      effects: { world: { treasury: 1, peace: -1 }, flags: [took_the_district_head_out_the_back] }
    - id: wait_at_the_town_edge
      label: ตั้งกองไว้ที่ปากทางเข้าเมือง ส่งคนไปขอคำสั่งจากข้างบน
      refuse: true
      text: |
        คำสั่งมาถึงตอนเช้าวันที่สาม ให้นายร้อยใช้ดุลยพินิจ ถึงตอนนั้นลานหน้าศาลาว่างแล้ว คนในเมืองเหนื่อยก่อนทหาร บานเกล็ดหน้าต่างศาลาไหม้ไปสองบาน นายอำเภอปีนออกมาเองตอนดึก

        เขาไม่ได้เขียนจดหมายขอบคุณกอง
      effects: { flags: [waited_out_the_hall_riot] }

- id: adult.army_duty_far_road
  stage: adult
  scene: road
  weight: 20
  duty: crown_army
  when:
    age: [25, 64]
    org: { id: crown_army, min_rank: 3, max_rank: 3 }
  text: |
    กองของ{name}ยืนทางสายไกลมาตั้งแต่ปลายฝน ทางเส้นนี้ผ่านหมู่บ้านชายป่าเจ็ดหมู่บ้าน ก่อนกองมาถึง สามในเจ็ดหมู่บ้านจ่ายค่าผ่านทางให้คนตั้งด่านที่ไม่ใช่ทหาร หลังกองมาถึง ด่านพวกนั้นหายไปในเดือนเดียว

    เบี้ยของกองค้างมาสองเดือน เสบียงที่ส่งมาทางเกวียนมาไม่ครบ ข้าวสารลดเหลือมื้อละครึ่งกระบอก จดหมายจากโต๊ะแผนที่ไม่ได้สั่งให้ถอน และไม่ได้สั่งให้อยู่ จดหมายบอกว่าเสบียงรอบหน้าจะส่งไปที่ค่ายในเมือง

    ผู้ใหญ่บ้านของหมู่บ้านที่ใกล้ที่สุดมาหาที่กระโจม หอบไก่มาสองตัว มัดขาไว้ด้วยกัน เขาวางไก่ลงบนโต๊ะ แล้วถามว่ากองจะอยู่ถึงหน้าหนาวไหม
  choices:
    - id: hold_the_far_road
      label: บอกเขาว่ากองจะอยู่
      text: |
        หมู่บ้านส่งไก่มาอีกทุกสัปดาห์ แล้วก็ข้าวโพด แล้วก็ฟืน {name}เขียนจดหมายถึงโต๊ะแผนที่ทุกเดือน ขอเสบียงเพิ่มสามเกวียน ได้มาเกวียนครึ่ง ส่วนที่ขาด คลังต้องจ่ายค่าเกวียนเช่าของคนในเมืองในราคาที่คนในเมืองตั้ง

        ด่านที่ไม่ใช่ทหารไม่กลับมาทั้งหน้าหนาว ตอนกองถอนออกไปในฤดูถัดมา เด็กในหมู่บ้านเดินตามขบวนไปถึงหลักหินหลักสุดท้าย
      effects: { world: { peace: 1, treasury: -1 }, flags: [held_the_far_road] }
    - id: march_back_to_town
      label: คืนไก่ให้ผู้ใหญ่บ้าน แล้วสั่งถอนกองกลับค่ายในเมือง
      text: |
        กองเดินกลับเข้าเมืองในสี่วัน ได้กินข้าวเต็มกระบอกเป็นมื้อแรกในคืนที่ห้า เบี้ยที่ค้างจ่ายมาครบในเดือนนั้น โต๊ะแผนที่ไม่ต้องเช่าเกวียนเพิ่มสักคัน

        ปลายหน้าหนาวมีข่าวมาว่าด่านกลับมาตั้งที่ทางสายไกลแล้วสองด่าน ด่านหนึ่งตั้งตรงที่กองเคยปักกระโจม ใช้หลุมเสากระโจมเดิมปักเสาด่าน
      effects: { world: { treasury: 1, peace: -1 }, flags: [pulled_back_from_the_far_road] }
    - id: leave_ten_and_a_drum
      label: ทิ้งนายสิบหนึ่งคนกับพลทหารสิบคนไว้กับหมู่บ้าน จ่ายเบี้ยพวกเขาเองจนพ้นหน้าหนาว
      requires: { min_gold: 3 }
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}เลือกนายสิบที่ขี้บ่นที่สุดแต่ไม่เคยหนีเวร ทิ้งกลองไว้ใบหนึ่ง สิบคนสอนคนหนุ่มของเจ็ดหมู่บ้านให้ยืนเรียงไหล่ ถือไม้ไผ่แทนหอก ถอยครึ่งก้าวตามกลอง ทั้งหน้าหนาวไม่มีด่านกลับมา

          เบี้ยของสิบคนออกจากถุงของ{name}ทุกเดือน ส่งไปกับคนส่งข่าวพร้อมจดหมายสั้นๆ ฉบับสุดท้ายนายสิบเขียนตอบว่าคนหนุ่มในหมู่บ้านตีกลองดีกว่าเด็กตีกลองของกองแล้ว
        effects: { gold: -3, world: { peace: 1 }, org: { id: crown_army, merit: 1 }, flags: [left_ten_men_on_the_far_road] }
      failure:
        text: |
          เดือนที่สอง ข่าวมาว่าสิบคนนั้นเหลือหก อีกสี่คนเดินเข้าป่าไปกับเบี้ยเดือนนั้นที่{name}ส่งไป พร้อมไก่ของหมู่บ้านอีกหกตัว นายสิบที่ทิ้งไว้เขียนจดหมายขอโทษมายาวหนึ่งหน้า

          ชื่อของสี่คนนั้นขึ้นเสาประกาศของทุกค่าย คนเขียนรายงานส่งข้างบนคือ{name}เอง
        effects: { gold: -3, flags: [left_ten_men_on_the_far_road] }
    - id: wait_for_the_map_table
      label: เขียนถามโต๊ะแผนที่ แล้วรอคำตอบอยู่ที่เดิม
      refuse: true
      text: |
        คำตอบมาถึงหลังหิมะแรก ให้นายร้อยตัดสินตามสภาพหน้างาน ระหว่างนั้นข้าวลดเหลือมื้อละหนึ่งในสามกระบอก พลทหารสามคนหายไปจากกระโจมในคืนเดียวกัน

        ผู้ใหญ่บ้านไม่ได้มาที่กระโจมอีก ไก่สองตัวที่เขาวางไว้บนโต๊ะในวันนั้น กองกินไปตั้งแต่สัปดาห์แรก
      effects: { flags: [waited_on_the_map_table] }

- id: adult.army_duty_ghost_pay
  stage: adult
  scene: fort
  weight: 20
  once: false
  time: dusk
  duty: crown_army
  when:
    age: [25, 64]
    org: { id: crown_army, min_rank: 3 }
  text: |
    สิ้นเดือน ก่อนกลองเลิก โคลเวน นายบัญชีของกอง เอาบัญชีเบี้ยมาวางบนโต๊ะพับ เปิดค้างไว้หน้าสุดท้าย ช่องลงชื่อท้ายบัญชีต้องเป็นชื่อของคนที่ใหญ่ที่สุดในค่ายคืนนั้น คืนนี้คือ{name}

    ชื่อในบัญชียาวกว่าแถวที่ยืนอยู่หน้ากระโจม ทั้งค่ายรู้ แต่ไม่มีใครพูดดังกว่ากระซิบ ชื่อที่เกินคือคนที่ตายไปแล้ว บางคนตายในแดนเถ้า บางคนตายตอนข้ามแม่น้ำ บางคนตายก่อน{name}จะได้ลงชื่อเป็นพลทหารด้วยซ้ำ ทุกเดือนพวกเขายังได้เบี้ย

    โคลเวนรู้ว่าชื่อไหนเป็นคนเป็น เขาทำจุดเล็กๆ ด้วยดินสอไว้หน้าชื่อคนตาย จุดเดียวคือเบี้ยไปถึงแม่ม่าย สองจุดคือเอาไปซื้อรองเท้าให้คนเป็น ชื่อที่ไม่มีจุดเลยเขาไม่เคยอธิบาย ข้างแท่นหมึกมีถุงผ้าเล็กๆ วางอยู่ใบหนึ่ง ทุกสิ้นเดือนวางอยู่ตรงนั้น
  choices:
    - id: sign_as_it_stands
      label: ลงชื่อท้ายบัญชี ปล่อยถุงผ้าไว้ข้างแท่นหมึก
      text: |
        {name}ลงชื่อ โคลเวนเป่าหมึกให้แห้ง ปิดบัญชี แล้วยกโต๊ะพับกลับไปกระโจมของเขา ถุงผ้าวางอยู่ข้างแท่นหมึกจนกลองเลิก เช้ามาไม่อยู่แล้ว

        ไม่มีใครในค่ายรู้ว่าถุงนั้นไปที่ไหน พลทหารคนหนึ่งในแถวหน้าได้รองเท้าคู่ใหม่ในเดือนนั้น ส้นยังไม่สึก
      effects: { alignment: { law: 1 }, flags: [signed_the_ghost_pay_book] }
    - id: pocket_the_pouch
      label: ลงชื่อท้ายบัญชี แล้วหยิบถุงผ้าใส่อกเสื้อ
      text: |
        ถุงผ้าหนักกว่าที่ดู เหรียญข้างในไม่ใช่เหรียญใหม่ บางเหรียญมีรอยฟันกัด โคลเวนไม่มองถุง ไม่มองมือ เขาเป่าหมึกจนแห้งแล้วปิดบัญชีเหมือนทุกเดือน

        คืนนั้นตอนนับแถวค่ำ ฝ่ามือของ{name}แตะไหล่ทีละไหล่ไปจนสุดแถว แถวยาวเท่าเดิม ไม่สั้นลง ไม่ยาวขึ้น
      effects: { gold: 4, alignment: { moral: -1 }, flags: [pocketed_the_ghost_pay] }
    - id: strike_an_undotted_name
      label: หาชื่อที่ไม่มีจุดชื่อหนึ่ง แล้วขีดฆ่าก่อนลงชื่อ
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          {name}ไล่นิ้วจนเจอชื่อหนึ่งที่ไม่มีจุด และไม่มีไหล่ไหนในแถวหน้ากระโจมเป็นของชื่อนั้น ขีดฆ่าเส้นเดียว แล้วลงชื่อท้ายบัญชี โคลเวนดูเส้นนั้น แล้วไม่พูดถึงมันอีก

          สิ้นเดือนถัดมา ถุงผ้าข้างแท่นหมึกเบาลงหนึ่งคนพอดี
        effects: { alignment: { law: 1 }, flags: [struck_a_ghost_name] }
      failure:
        text: |
          ชื่อที่{name}ขีดฆ่ามีจุดเดียว จุดดินสอจางจนแทบมองไม่เห็นใต้แสงตะเกียง โคลเวนเห็นตอนบัญชีส่งออกไปแล้ว

          สองเดือนต่อมา หญิงคนหนึ่งจูงเด็กสองคนเดินมาถึงประตูค่าย ถามหาเบี้ยของผัวที่ไม่ได้มาสองเดือน นางไม่รู้ว่าผัวตายไปนานแล้ว หรือรู้ แต่ไม่เคยมีใครบอกให้เลิกรอ
        effects: { alignment: { moral: -1 }, flags: [struck_a_widows_name] }
    - id: let_kolven_sign
      label: ยื่นปากกาให้โคลเวนลงชื่อแทน
      refuse: true
      text: |
        โคลเวนลงชื่อ{name}ให้ ลายมือของเขาเหมือนลายมือของ{name}มากกว่าที่{name}เขียนเอง เขาเคยลงแทนนายร้อยมาแล้วหลายคน

        ถุงผ้าข้างแท่นหมึกหายไปพร้อมโต๊ะพับ คืนนั้นไม่มีใครรู้ว่ามือของใครหยิบ
      effects: { flags: [let_the_paymaster_sign] }

# ---------- หีบใต้โต๊ะแผนที่ (แม่ทัพ ยุคสองตรา) ----------
- id: adult.army_duty_four_quarters
  stage: adult
  scene: council_hall
  weight: 20
  time: night
  duty: crown_army
  when:
    age: [25, 64]
    year: [318, 410]
    not_flags: [throne_white, throne_grey]
    org: { id: crown_army, min_rank: 4 }
  text: |
    ห้องโต๊ะแผนที่มีประตูบานเดียว การ์ริคนั่งหันหน้าเข้าหาประตูบานนั้นทุกครั้ง เขาเป็นแม่ทัพที่แก่ที่สุดในห้าคน รบในแดนเถ้ามาตลอดสงครามถ่าน ไม่เคยนั่งหันหลังให้ประตูบานไหน ใครมาถึงก่อนแล้วนั่งเก้าอี้ตัวนั้นก็ต้องลุกให้ ใต้โต๊ะมีหีบเหล็กใบหนึ่ง ไม่มีใครวางเท้าบนหีบ ในหีบคือแผนสี่ย่าน

    ชายที่ยืนปลายโต๊ะคาดปลอกแขนสีขาว ถือกระดาษหนึ่งแผ่น มุมล่างข้างหนึ่งมีตราขาวรูปตะเกียงแขวน มุมอีกข้างว่าง เขาบอกว่าเจ้าชายฮาลเวรินขอให้โต๊ะแผนที่เปิดหีบ ส่งแผนสี่ย่านไปปีกขาวคืนนี้ เพื่อความปลอดภัยของเวนทราส เขาพูดคำว่าความปลอดภัยสองครั้ง

    หีบใบนั้นมีรูกุญแจห้ารู แม่ทัพคนละดอก ไขไม่ครบห้าดอกฝาไม่ยก กุญแจสี่ดอกวางเรียงอยู่บนแผนที่แล้ว ดอกสุดท้ายที่วางลงเป็นของการ์ริค เขาวางแรงจนหมุดทองเหลืองข้างๆ ล้มไปหมุดหนึ่ง ดอกที่ห้าห้อยอยู่ที่เข็มขัดของ{name}
  choices:
    - id: open_the_chest
      label: ปลดกุญแจวางลงบนแผนที่เป็นดอกที่ห้า
      text: |
        กุญแจห้าดอกหมุนพร้อมกัน ฝาหีบยกขึ้น แผนสี่ย่านเป็นกระดาษพับแปดทบ ลายมือของสำนักการรบแห่งสถาบันเวทหลวง ชายปลอกแขนขาวรับไปใส่กระบอกหนัง เดินออกประตูโดยไม่หันหลัง การ์ริคมองตามจนประตูปิด

        สัปดาห์ต่อมา กองที่คาดปลอกแขนขาวไปยืนที่ปากทางเข้าทั้งสี่ย่านของเวนทราส เสมียนปีกเทาต้องยื่นใบผ่านทางทุกครั้งที่ข้ามย่าน คนในเมืองเริ่มเรียกเจ้าชายด้วยคำที่เคยใช้เรียกกษัตริย์ เรียกเบาๆ ไม่ให้ทหารได้ยิน
      effects: { world: { throne: 2, peace: -2 }, flags: [opened_the_four_quarters_chest] }
    - id: burn_the_plan
      label: ไขหีบด้วยกุญแจทั้งห้าดอก แล้วเอาแผนสี่ย่านใส่เตาของห้องต่อหน้าทุกคน
      text: |
        กระดาษพับแปดทบติดไฟช้า ไหม้จากขอบเข้ามาทีละทบ ชายปลอกแขนขาวก้าวเข้ามาครึ่งก้าวแล้วหยุด แม่ทัพสองคนลุกขึ้นยืน การ์ริคไม่ลุก เขาเอนหลัง เอามือประสานบนท้อง และยังหันหน้าเข้าหาประตู

        ข่าวว่าแผนสี่ย่านไม่มีแล้วไปถึงทั้งสองปีกก่อนเช้า ไม่มีปีกไหนเชื่อ ปีกขาวว่าโต๊ะแผนที่ส่งแผนไปให้ปีกเทา ปีกเทาว่าปีกขาวได้ไปแล้ว ในเมืองไม่มีทหารคาดปลอกแขนสีไหนมายืนปากทาง กระดาษตราเดียวบนโต๊ะกลางทางเสมียนสูงขึ้นอีกหนึ่งกอง
      effects: { world: { peace: 2, throne: -2 }, flags: [burned_the_four_quarters_plan] }
    - id: send_it_for_the_second_seal
      label: เก็บกุญแจไว้ที่เข็มขัด บอกให้เอากระดาษไปรอตราที่สองก่อน
      refuse: true
      text: |
        ชายปลอกแขนขาวพับกระดาษเก็บ เขาไม่เถียง เขาบอกว่าจะกลับมาใหม่ แล้วเดินออกไป กระดาษแผ่นนั้นไปอยู่บนโต๊ะกลางทางเสมียน กองเดียวกับกระดาษตราเดียวแผ่นอื่น

        แม่ทัพทั้งสี่เก็บกุญแจของตัวเองคืน การ์ริคเก็บเป็นคนแรก เขาเอาส้นรองเท้าเขี่ยหีบใต้โต๊ะให้ชิดเข้าไปอีกนิด แล้วถามว่าใครหิวบ้าง
      effects: { flags: [sent_the_plan_request_back] }

# ---------- เลื่อนขั้น ----------
- id: adult.army_rise_corporal
  stage: adult
  scene: fort
  weight: 60
  must: true
  once: true
  mark: ขึ้นเป็นนายสิบ
  when:
    age: [19, 80]
    org: { id: crown_army, min_rank: 1, max_rank: 1, ready: true }
  text: |
    ไม้เรียวของโรเดนเป็นหวายยาวเท่าแขน ปลายแตกเป็นฝอยเพราะเคาะโล่มาหลายรุ่น เช้านี้เขาถืออันใหม่มาที่ลานฝึก อันเก่าเขายื่นให้{name} หันด้ามมาทางมือ ปลายชี้ดิน

    พลทหารสิบคนยืนแถวรออยู่ในลาน ตั้งแต่เช้านี้เป็นแถวของ{name} บางคนมาทีหลัง{name}ไม่กี่เดือน บางคนอยู่มาก่อน บางคนเคยแบ่งข้าวกันกินในคืนที่เสบียงไม่ถึง โรเดนกระซิบว่านายสิบต้องสอนตั้งแถว ไหล่ชิดไหล่ ถอยครึ่งก้าวตามกลอง แล้วแทงซ้ำ ให้ทำได้ทั้งตอนมีกลองและตอนไม่มี

    แล้วเขาก็ถอยไปยืนข้างลาน กอดอก รอดู
  choices:
    - id: rap_the_old_stick
      label: เคาะโล่สามทีแบบโรเดน แล้วปล่อยให้แถวเดาเอาเอง
      text: |
        แถวเดาผิดสองครั้ง ครั้งแรกถอยเต็มก้าว ครั้งที่สองแทงก่อนถอย ครั้งที่สามถอยครึ่งก้าวพร้อมกันทั้งสิบคน เสียงรองเท้าดังเป็นเสียงเดียว โรเดนคลายแขนที่กอดอกออก

        ไม้เรียวอันเก่าอยู่กับ{name}ตั้งแต่นั้น ฝอยที่ปลายยาวขึ้นทุกฤดู
      effects: { org: { id: crown_army, promote: true }, flags: [drilled_with_the_old_stick] }
    - id: shout_the_drill
      label: ตะโกนสั่งด้วยเสียงของตัวเองให้ดังสุดลาน
      check: { stat: CON, dc: 13 }
      success:
        text: |
          เสียงของ{name}ไปถึงกระโจมครัว คนครัวโผล่หน้าออกมาดู แถวถอยครึ่งก้าวได้ในรอบที่สี่ แทงซ้ำได้ในรอบที่เจ็ด ตะวันตรงหัว เสียงยังไม่แตก

          โรเดนเคาะโล่หนึ่งทีจากข้างลาน ทั้งแถวหันไปมอง เขาชี้ไปที่{name} แล้วชี้ที่คอตัวเอง แล้วส่ายหัว
        effects: { org: { id: crown_army, promote: true }, stats: { CON: 1 }, flags: [shouted_the_first_drill] }
      failure:
        text: |
          เสียงแตกก่อนเที่ยง ตกบ่ายเหลือแค่ลม {name}ต้องสั่งแถวด้วยการเคาะโล่อยู่สามวัน ด้วยไม้เรียวอันเก่าของโรเดน

          พลทหารในแถวเรียก{name}ว่าโรเดนน้อยอยู่หลายเดือน เรียกต่อหน้าโรเดนด้วย โรเดนไม่ห้าม
        effects: { org: { id: crown_army, promote: true }, flags: [shouted_the_first_drill] }
    - id: drill_from_inside
      label: เข้าไปยืนในแถวเอง ถอยครึ่งก้าวให้ดูก่อนสั่ง
      text: |
        {name}ยืนกลางแถว ไหล่ชนไหล่ทั้งสองข้าง ไหล่ข้างซ้ายเป็นของคนที่เคยแบ่งข้าวให้ สั่งเองแล้วทำเอง ถอยครึ่งก้าว แทงซ้ำ สิบเอ็ดคนขยับเป็นคนเดียวได้ตั้งแต่ก่อนเที่ยง

        คืนนั้นขาสองข้างของ{name}ล้าจนต้องเอาขึ้นพาดลังนอน คนในแถวไม่มีใครบ่นว่าล้า
      effects: { org: { id: crown_army, promote: true }, stats: { STR: 1 }, flags: [drilled_from_inside_the_line] }
    - id: ask_roden_about_his_voice
      label: ถามโรเดนว่าเสียงหายไปตอนไหน
      text: |
        โรเดนกระซิบตอบสั้นๆ คืนหนึ่งเขาต้องตะโกนคำว่ายืนอยู่คำเดียวตั้งแต่หัวค่ำจนสาง ให้แถวที่ไม่เห็นหน้าเขาได้ยิน แถวยืนจนสาง เสียงของเขาไม่กลับมาอีก

        เขาไม่ได้บอกว่าคืนนั้นอยู่ที่ไหน หรือแถวนั้นเหลือกี่คน แล้วเขาก็เคาะโล่หนึ่งที บอกให้{name}ไปสอนแถวได้แล้ว
      effects: { org: { id: crown_army, promote: true }, flags: [asked_roden_about_his_voice] }

- id: adult.army_rise_lieutenant
  stage: adult
  scene: fort
  weight: 60
  must: true
  once: true
  time: dusk
  mark: ขึ้นเป็นนายร้อย
  when:
    age: [19, 80]
    org: { id: crown_army, min_rank: 2, max_rank: 2, ready: true }
  text: |
    ใบตั้งนายร้อยมาพร้อมใบย้ายอีกใบ ราเวคได้ไปกองอื่น กองที่ไกลกว่า เบี้ยดีกว่า และไม่มีใครในค่ายนี้เคยได้ยินชื่อ เขาอ่านทั้งสองใบเองตอนกลองเช้า เสียงเรียบเหมือนอ่านเวรยาม

    ค่ำสุดท้ายของเขา ร้อยคนยืนเรียงหน้ากระโจม ราเวคไม่นับ เขาเดินมาหา{name}ที่หัวแถว จับข้อมือ{name}ไปวางฝ่ามือลงบนไหล่คนแรก แล้วปล่อย ที่เหลือ{name}ต้องเดินเอง ทีละไหล่ไปจนสุดแถว

    บางไหล่ร้อนเพราะไข้ บางไหล่สั่น บางไหล่ห่อลงตอนฝ่ามือแตะ ราเวคเดินตามหลังสามก้าว ไม่แตะใครเลย
  choices:
    - id: count_by_hand
      label: เดินแตะไหล่จนสุดแถว นับในใจแบบที่เขานับ
      text: |
        ร้อยคนพอดี {name}หันกลับมาบอกยอด ราเวคบอกว่าเขารู้ แล้วบอกว่าคืนไหนยอดไม่ครบ ให้รู้ก่อนว่าไหล่ไหนหายไป ก่อนจะรู้ว่าขาดกี่คน

        เช้ามาเขาออกจากค่ายก่อนกลองเช้าจะตี ย่ามใบเดียว หอกด้ามเดียว บนโต๊ะพับในกระโจมนายร้อยมีขวดหมึกที่เขาเติมไว้เต็มขวด
      effects: { org: { id: crown_army, promote: true }, flags: [counted_the_hundred_by_hand] }
    - id: count_and_ask_names
      label: แตะไหล่แล้วถามชื่อทีละคน
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ร้อยชื่อ {name}จำได้เก้าสิบกว่าชื่อตั้งแต่คืนแรก ไหล่ที่ร้อนเพราะไข้เป็นของพลทหารคนหนึ่งที่บอกชื่อเสียงแหบ {name}ส่งเขาไปกระโจมหมอก่อนจะเดินต่อ ราเวคหยุดเดินตามไปครึ่งก้าว แล้วเดินต่อ

          เช้ามาเขาออกจากค่ายก่อนกลองเช้า คนในแถวที่ตื่นทันยืนส่งที่ประตูค่ายสิบกว่าคน
        effects: { org: { id: crown_army, promote: true }, stats: { WIS: 1 }, flags: [learned_the_hundred_names] }
      failure:
        text: |
          ถามชื่อได้ห้าสิบกว่าคนฟ้าก็มืด ที่เหลือต้องนับใต้คบไฟ ชื่อตีกันในหัวจนเรียกคนที่สามสิบด้วยชื่อของคนที่สิบ แถวหัวเราะครึ่งแถว

          ราเวคไม่หัวเราะ เขาบอกว่าคืนแรกของเขาก็ถามชื่อ และก็มืดก่อนจบเหมือนกัน
        effects: { org: { id: crown_army, promote: true }, flags: [learned_the_hundred_names] }
    - id: ask_about_the_pay_book
      label: ถามราเวคว่าบัญชีเบี้ยที่ต้องลงชื่อต่อจากเขามีอะไรต้องรู้
      text: |
        ราเวคหยุดเดิน มองไปทางกระโจมของโคลเวน แล้วบอกว่าให้ถามโคลเวน เขาบอกว่าบัญชีของกองนี้ไม่ใช่ของเขามาตั้งแต่ก่อนเขามา และจะไม่ใช่ของ{name}หลังจาก{name}ไปแล้วเหมือนกัน

        เขาไม่ได้พูดเรื่องนี้อีกจนออกจากค่าย คืนนั้น{name}เห็นแสงตะเกียงในกระโจมของโคลเวนจนดึก
      effects: { org: { id: crown_army, promote: true }, flags: [asked_ravek_about_the_pay_book] }

- id: adult.army_rise_general
  stage: adult
  scene: council_hall
  weight: 60
  must: true
  once: true
  mark: ขึ้นเป็นแม่ทัพ
  when:
    age: [19, 80]
    org: { id: crown_army, min_rank: 3, max_rank: 3, ready: true }
  text: |
    โต๊ะแผนที่ยาวเท่าเกวียนสองคัน แผนที่อาร์เวลแผ่นเดียวปูเต็มโต๊ะ มุมทั้งสี่กดไว้ด้วยหัวหอกหักสี่อัน หมุดหัวทองเหลืองปักอยู่ตรงที่กองทั้งหลายยืนอยู่ บางหมุดปักมานานจนสนิมกินกระดาษเป็นวง กองของ{name}เคยเป็นหมุดหนึ่งในนั้น

    เก้าอี้ตัวที่ห้าว่างมาตั้งแต่ต้นฤดู เจ้าของเดิมขอกลับไปเลี้ยงม้าที่บ้าน การ์ริคนั่งหัวโต๊ะ หันหน้าเข้าหาประตู ผมเหลือแค่ข้างหู ใต้โต๊ะตรงปลายเท้าของเขามีหีบเหล็กใบหนึ่ง เขาวางเท้าข้างหีบ ไม่วางบน

    เขาชี้ให้{name}เลือกเก้าอี้ ทุกตัวที่เหลือหันหลังให้ประตูบ้าง หันข้างบ้าง ตัวที่หันหน้าเข้าหาประตูมีตัวเดียว คือตัวที่เขานั่ง
  choices:
    - id: sit_back_to_the_door
      label: นั่งตัวที่หันหลังให้ประตูตรงๆ
      text: |
        {name}นั่งลง ได้ยินเสียงบานพับประตูข้างหลังทุกครั้งที่เสมียนเข้าออก การ์ริคบอกว่าไม่ต้องหันไปดู เขาดูให้ ตั้งแต่นั้นมาในห้องนี้ ทุกครั้งที่บานพับดัง ตาของการ์ริคไปถึงประตูก่อนคนที่เดินเข้ามา

        ครึ่งปีต่อมา{name}เลิกได้ยินเสียงบานพับ
      effects: { org: { id: crown_army, promote: true }, flags: [sat_with_back_to_the_door] }
    - id: move_a_pin
      label: ขยับหมุดหนึ่งบนแผนที่ตั้งแต่วันแรก
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ถอนหมุดของกองที่ยืนช่องเขาว่างๆ มาสองฤดู ปักลงที่ทางแยกที่ขบวนถ่านโดนถอดหมุดรางบ่อยที่สุด แม่ทัพอีกสามคนเถียงกันอยู่ครู่เดียว การ์ริคบอกว่าหมุดนั้นควรย้ายมาตั้งแต่สองฤดูก่อน แต่ไม่มีใครในห้องเคยยืนตรงทางแยกนั้น

          รอยสนิมวงเดิมยังอยู่บนแผนที่ตรงช่องเขา ดำกว่ารอยอื่น
        effects: { org: { id: crown_army, promote: true }, stats: { INT: 1 }, flags: [moved_the_first_pin] }
      failure:
        text: |
          หมุดที่{name}ถอนเป็นของกองที่ยุบไปแล้ว ไม่มีใครเอาหมุดออก การ์ริคหัวเราะจนไอ แล้วบอกว่าบนโต๊ะนี้มีหมุดของกองที่ไม่มีอยู่จริงอีกสามหมุด ให้หาเองว่าหมุดไหน

          {name}ใช้เวลาครึ่งฤดูหาเจออีกสองหมุด หมุดที่สามยังหาไม่เจอ
        effects: { org: { id: crown_army, promote: true }, flags: [moved_the_first_pin] }
    - id: ask_about_the_chest
      label: ถามการ์ริคว่าทำไมไม่มีใครวางเท้าบนหีบ
      text: |
        การ์ริคเอาส้นรองเท้าเคาะข้างหีบเบาๆ สองที เขาบอกว่าในนั้นมีกระดาษที่สถาบันเขียนให้ บอกวิธีเดินกองเข้าเวนทราสทีละย่าน ไม่มีใครรู้ว่าเขียนไว้กันใคร เพราะคนเขียนก็ไม่ได้บอก ใครวางเท้าบนหีบ เท่ากับบอกว่าตัวเองยืนอยู่บนนั้นได้

        แล้วเขาก็ชี้ไปที่เก้าอี้ว่าง บอกว่านั่งได้แล้ว ขาของเขาเมื่อยแทน
      effects: { org: { id: crown_army, promote: true }, flags: [asked_garrick_about_the_chest] }

# ---------- สงครามถ่าน (ทหารประจำการ) ----------
# ทหารเกณฑ์มีเรื่องของตัวเองใน 78_adult_war (กัน not_orgs ไว้แล้ว) กองทหารหลวงเป็นทหารบก ได้ยืนแถวหน้าปากเหมือง ข้างล่างค่ายของราชนาวี
# ไม่มีทางตาย คนในแถวมีโล่ของคนข้างๆ · คนถือกระดาษของสำนักสงครามหลังแถวคือเรื่องเดียวกับที่โดเรคเล่า (88_org_cold_iron_a)
# เรื่องนี้เรื่องเดียวที่บอกว่าสงครามยังไม่จบ จึงผูกปีไว้ · โรเดนกับโคลเวนอยู่ได้ทุกยศ ราเวคไม่อยู่ในเรื่อง
- id: adult.army_coal_war
  stage: adult
  scene: fort
  must: true
  time: night
  mark: ยืนแถวในสงครามถ่าน
  when:
    age: [19, 64]
    year: [296, 301]
    org: crown_army
    not_flags: [war_veteran, went_to_coal_war, origin_dwarf_clan]
  text: |
    คำสั่งมาถึงค่ายพร้อมเกวียนเสบียงเปล่า กองเดินเท้าไปทางตะวันออกสิบเก้าวัน วันสุดท้ายถนนหมดลงตรงหลักหินหลักหนึ่ง เลยไปมีแต่เถ้าสีเทาลึกถึงเข่ากับหญ้าสีเงิน ก่อนเที่ยงรองเท้าทุกคู่ในกองเป็นสีเดียวกัน

    ทหารเกณฑ์ของราชนาวีได้กางกระโจมบนเนิน กองทหารหลวงได้ที่ยืนข้างล่าง หน้าปากเหมืองถ่านมารเก่า โรเดนเดินเคาะโล่ทีละใบให้ขยับเข้าหากันอีกคืบ ไหล่ชิดไหล่ ขอบโล่ทับขอบโล่ ข้างหลังแถวมีคนของสำนักสงครามยืนอยู่คนเดียว เขาขี่ม้ามาถึงเมื่อค่ำ ไม่ได้บอกชื่อกับใคร ในมือถือกระดาษม้วนหนึ่ง

    ใกล้สาง เถ้าหน้าแถวยุบลงเป็นหลุมสามหลุมพร้อมกัน แสงแดงของตะเกียงถ่านมารขึ้นมาก่อน ขวานด้ามสั้นตามขึ้นมา คนถือกระดาษข้างหลังเริ่มคลี่ม้วน
  choices:
    - id: hold_the_shield
      label: ยืนที่เดิม โล่ชิดโล่ รับขวานชุดแรก
      check: { stat: CON, dc: 12 }
      success:
        text: |
          ขวานเล่มแรกลงบนขอบโล่ แรงสะเทือนวิ่งขึ้นถึงไหล่ เล่มที่สองลงที่เดิม {name}ไม่ถอย คนทางซ้ายไม่ถอย คนทางขวาไม่ถอย โรเดนเคาะโล่ของตัวเองเป็นจังหวะอยู่ข้างหลัง ทั้งแถวดันไปข้างหน้าทีละครึ่งก้าวตามเสียงเคาะ จนคนแคระคนสุดท้ายถอยกลับลงหลุม

          พอสว่าง ขอบโล่ของ{name}มีรอยบิ่นเจ็ดรอย โรเดนเดินมานับ แล้วเอาถ่านเขียนเลขเจ็ดไว้หลังโล่ บอกด้วยเสียงกระซิบว่าห้ามลบ
        effects: { stats: { CON: 1 }, reputation: { crown: 1 }, org: { id: crown_army, merit: 1 }, flags: [war_veteran, held_the_ash_line] }
      failure:
        text: |
          ขวานเล่มที่สามงัดขอบโล่ขึ้น เล่มที่สี่ลอดเข้ามาใต้โล่ถึงสีข้าง {name}ทรุดลงเข่าหนึ่งข้าง โล่ของคนทางซ้ายเลื่อนมาปิดช่องให้ก่อนเล่มที่ห้าจะตาม มีมือลากคอเสื้อ{name}ถอยไปหลังแถวโดยไม่มีใครสั่ง

          แผลที่สีข้างเย็บสิบเอ็ดเข็มในกระโจมพยาบาลบนเนิน คนเย็บเป็นหญิงจากกองพยาบาลของราชนาวี นางบอกว่าทหารหลวงเลือดออกเหมือนทหารเกณฑ์ทุกอย่าง
        effects: { hp: -3, flags: [war_veteran, cut_under_the_shield] }
    - id: go_to_the_hole
      label: ออกจากแถวไปที่ปากหลุมใกล้สุด แทงหอกลงไปก่อนจะขึ้นมาครบ
      check: { stat: STR, dc: 13, foe: human }
      success:
        text: |
          {name}ไปถึงปากหลุมตอนคนแคระคนที่สี่กำลังเหวี่ยงขาขึ้นขอบ หอกยาวลงไปถึงก่อนขวานจะเงื้อ คนนั้นร่วงทับคนข้างล่างลงไปทั้งสาย ตะเกียงแดงดวงหนึ่งแตกอยู่ก้นหลุม {name}ยืนคุมปากหลุมอยู่คนเดียวจนแถวดันมาถึง

          โรเดนไม่ชม เขาชี้ช่องว่างในแถวตรงที่{name}เคยยืน แล้วชี้รอยขวานบนโล่ของคนสองคนข้างช่องนั้น เย็นวันนั้นชื่อของ{name}ขึ้นไปถึงกระโจมนายกองสองเรื่อง เรื่องหลุม กับเรื่องออกจากแถว
        effects: { stats: { STR: 1 }, alignment: { law: -1 }, reputation: { crown: 1 }, flags: [war_veteran, closed_a_hole_alone] }
      failure:
        text: |
          เถ้ารอบปากหลุมร่วนกว่าที่เห็น ขาข้างหนึ่งของ{name}จมลงถึงต้นขา ขวานด้ามสั้นจากข้างล่างฟันเข้าที่หน้าแข้ง แล้วมีมือคว้าข้อเท้าจะดึงลงไป โรเดนมาถึงพร้อมคนอีกสองคน ดึง{name}ขึ้นมาได้ รองเท้าข้างนั้นไปกับคนแคระ

          {name}เดินกะเผลกไปทั้งหน้าหนาว ทุกเย็นโรเดนให้ไปยืนตรงช่องของตัวเองในแถวครึ่งชั่วยาม เท้าข้างหนึ่งเปล่า ไม่ได้บอกว่าทำไม
        effects: { hp: -4, alignment: { law: -1 }, flags: [war_veteran, lost_a_boot_to_the_hole] }
    - id: shout_at_the_paper
      label: หันไปตะโกนบอกคนถือกระดาษว่าลมเปลี่ยนทิศแล้ว
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          เถ้าที่ลอยจากปากหลุมเคยปลิวไปทางเหมือง ตอนนี้ปลิวกลับมาเกาะหน้าโล่ {name}ตะโกนข้ามไหล่ไปคำเดียว คนถือกระดาษเงยหน้าขึ้นจากบรรทัดที่สอง เลียปลายนิ้ว ชูขึ้น แล้วม้วนกระดาษเก็บโดยไม่อ่านต่อ

          แถวรับขวานด้วยโล่กับหอกจนสาง ไม่มีใครล้มโดยไม่มีแผล ตอนเก็บแถว คนของสำนักสงครามเดินผ่าน{name} ไม่ได้ขอบคุณ เขาถามว่ากองไหน แล้วจดลงขอบกระดาษม้วนนั้น
        effects: { stats: { WIS: 1 }, reputation: { royal_institute: 1 }, flags: [war_veteran, stopped_the_paper] }
      failure:
        text: |
          เสียงของ{name}จมอยู่ใต้เสียงขวานลงโล่ คนถือกระดาษอ่านจบบรรทัดที่สามตอนเถ้าปลิวย้อนกลับมาเกาะหน้าโล่ คนแคระที่ปากหลุมแรกล้มลงสี่คน แล้วคนหัวแถวของกองก็ล้มตาม ทีละคน ไล่มาจนถึงคนที่ยืนถัดจาก{name}ไปสองโล่ ไม่มีเลือด ไม่มีเสียง ล้มเหมือนคนหลับ

          เช้านั้นกองขุดหลุมในเถ้าสิบสี่หลุม โคลเวนขีดเส้นปิดท้ายชื่อสิบสี่ชื่อในบัญชี คนของสำนักสงครามขึ้นม้าออกไปก่อนหลุมแรกจะกลบเสร็จ
        effects: { flags: [war_veteran, saw_the_paper_take_the_line] }

# ---------- แปดฤดูหนาว ----------
- id: adult.army_eighth_winter
  stage: adult
  scene: fort
  must: true
  once: false
  time: night
  when:
    age: [19, 75]
    org: { id: crown_army, max_rank: 3, min_years: 8 }
  text: |
    ฤดูหนาวที่แปดของสัญญาครบในเช้าที่น้ำในถังล้างหน้าเป็นแผ่นน้ำแข็งบางๆ โคลเวนเปิดบัญชีให้ดู ท้ายชื่อของ{name}มีขีดแปดขีด ขีดสุดท้ายหมึกยังใหม่ ใบปลดต้องมาจากข้างบน มาพร้อมเบี้ยก้อน ปกติมาถึงในเดือนเดียว

    เดือนนี้ข่าวอื่นมาถึงก่อน กองได้คำสั่งให้ไปยืนทางสายไกลจนพ้นหน้าหนาว ใบปลดทุกใบของกองให้รอไปก่อน ทหารที่ครบแปดฤดูหนาวพร้อม{name}มีอีกสี่คน คนหนึ่งเก็บย่ามไว้ใต้เตียงตั้งแต่ได้ยินข่าว

    รั้วไม้ของค่ายด้านหลังกระโจมเสบียงสูงแค่อก คืนเดือนมืดไม่มีเวรยามตรงนั้น
  choices:
    - id: wait_for_the_paper
      label: ไปยืนทางสายไกลกับกอง รอใบปลดจนพ้นหน้าหนาว
      text: |
        หน้าหนาวนั้นยาวกว่าหน้าหนาวไหน ใบปลดมาถึงเมื่อหิมะละลายจนเห็นหลักหิน ห่อผ้าน้ำมัน ตราครบ มาพร้อมถุงเบี้ยก้อนหนึ่งใบ โคลเวนนับเหรียญให้ดูต่อหน้า แล้วขีดเส้นปิดท้ายชื่อของ{name}ในบัญชี

        {name}เดินออกจากค่ายตอนกลองเช้า ตอนเดินลงเนิน เสียงกลองยังตามมา เท้าตรงกับจังหวะไปจนถึงทางแยก
      effects: { org: { id: crown_army, leave: true }, mark: ได้ใบปลดจากกองทัพ, gold: 6, flags: [discharged_from_the_army] }
    - id: sign_eight_more
      label: บอกโคลเวนให้ขีดใหม่ตั้งแต่หนึ่ง
      text: |
        โคลเวนไม่ถามว่าแน่ใจไหม เขาลากเส้นใต้ขีดทั้งแปด แล้วขีดหนึ่งขีดใหม่ข้างเส้นนั้น {name}ลงชื่อกำกับบนหน้ากลองใต้ตะเกียง

        หน้าหนาวนั้นที่ทางสายไกล ทหารครบแปดฤดูหนาวสี่คนที่รอใบปลดยืนเวรได้ตรงเวลาทุกคืน เพราะ{name}ยืนเวรกะตีสองด้วยทุกคืน
      effects: { org: { id: crown_army, merit: 1, term: true }, flags: [signed_eight_more_winters] }
    - id: over_the_back_fence
      label: ข้ามรั้วหลังกระโจมเสบียงในคืนเดือนมืด ก่อนกองจะออก
      text: |
        รั้วสูงแค่อกจริง ข้ามง่ายกว่าที่ควรจะเป็น ข้างนอกเป็นทุ่งหญ้าแห้ง {name}เดินไม่หยุดจนสาง ได้ยินกลองเช้าของค่ายดังมาจากข้างหลัง ไกลขึ้นทุกจังหวะ

        ชื่อของ{name}ขึ้นเสาประกาศของทุกค่ายภายในเดือนนั้น ใต้ชื่อเขียนว่าหนีทัพ ตัวหนังสือใหญ่กว่าชื่อ
      effects: { org: { id: crown_army, leave: true }, mark: หนีทัพ, hunted: { crown: 2 }, alignment: { law: -1 }, flags: [deserted_the_army] }
