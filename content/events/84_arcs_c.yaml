# ชุด 4 เส้นเรื่องยาว ไฟล์ ค: climb (ชื่อเดิม) · faith (ชามไฟที่ไม่ได้จุด) · house (ขื่อบ้าน) · pillars (เชือกเจ็ดปม)
# ตอนที่ 1 มี when.age และน้ำหนักตามข้อกำหนด ตอนที่ 2 กับ 3 ไม่มี when.age น้ำหนัก 30 ข้อความไม่รู้ว่าห่างจากตอนก่อนกี่ปี ใช้คำว่า หลายปี
# ตอนที่ 3 คือที่พัก ไม่ใช่ตอนจบ ทุกตัวเลือกตั้ง flag ที่พักหนึ่งอันตามชื่อที่กำหนด (ชุด 6 อ่าน)
# บ้านขุนนางใหม่: บ้านคาเลริส (นายหญิง อาลมิส คาเลริส) ถือตราโรงชั่งประจำย่าน ใช้ทั้งสามตอนของ climb
# คนใหม่: เวลีน หญิงที่รอยบนขื่อของนางถูกพ่อขูดทิ้ง (มีแต่ในข้อความ) · เคสริน คนแสวงบุญห้าปม (มีแต่ในข้อความ)
#         ทูร์ดา ตระกูลลิ่มคู่ (pillar_friend) คนแคระหญิงที่เดินทางไปเสาด้วยกัน

# ===================== climb ไต่ชนชั้น =====================

- id: adult.arc_climb_1_the_weigh_house_seal
  stage: adult
  scene: noble_hall
  weight: 8
  arc: { id: climb, step: 1 }
  when:
    age: [30, 52]
    not_flags: [institute_student]
  text: |
    โรงชั่งประจำย่านเปลี่ยนคนถือตราสามคนในปีเดียว คนแรกตาย คนที่สองยักยอก คนที่สามขอลาออกเพราะเมียไม่อยากเป็นเมียของคนที่ทั้งตลาดเกลียด ตราโรงชั่งเป็นแท่งทองเหลืองหัวกลม แกะรูปตาชั่งคล้องโซ่ ตีลงบนใบชั่งทุกใบที่ออกจากโรง เกวียนถ่าน กระสอบข้าว ฟ่อนขนแกะ ใบชั่งไม่มีตรานี้ ของออกจากเมืองไม่ได้

    ตำแหน่งนี้เป็นของบ้านคาเลริส บ้านขุนนางเล็กๆ ที่มีที่ดินสองแปลงกับตราประทับหนึ่งอัน นางอาลมิส คาเลริส นายหญิงของบ้าน ให้คนมาตาม{name}ไปที่ห้องรับแขก ห้องเย็น ผนังแขวนภาพวาดคนในบ้านนี้ที่ตายไปแล้วเต็มผนัง นางรินชาให้เอง

    นางบอกว่าสามเดือนที่ผ่านมา นางให้คนไปยืนดู{name}ทำงาน คนของนางบอกว่า{name}นับไม่เคยผิด และไม่เคยรับเหรียญใต้โต๊ะ บ้านต้องการคนที่ตลาดเชื่อ ค่าตอบแทนเดือนละสองเหรียญ มีห้องเล็กหลังโรงชั่งให้พัก ข้อเดียวที่ต้องทำ ตราโรงชั่งต้องประทับคู่กับลายมือชื่อที่มีนามสกุล ชาวบ้านไม่มีนามสกุล ใช้ชื่อตัวกับชื่อพ่อหรือแม่ ตั้งแต่วันที่รับตรา {name}จะลงชื่อว่า{name} คาเลริส และเลิกลงชื่อว่าเป็นลูกของใคร

    นางวางกระดาษลงบนโต๊ะ ปากกาวางขวางอยู่ข้างบน
  choices:
    - id: sign
      label: หยิบปากกา ลงชื่อด้วยนามสกุลของบ้าน
      text: |
        มือของ{name}เขียนชื่อตัวได้คล่องเหมือนทุกวัน พอถึงคำว่าคาเลริส ปลายปากกาช้าลงเอง ตัวอักษรเกร็งเหมือนลายมือเด็กหัดเขียน นางอาลมิสรอจนหมึกแห้ง แล้วยื่นตราทองเหลืองให้ด้วยสองมือ หนักกว่าที่คิด

        เช้าวันแรกที่โรงชั่ง คนขับเกวียนถ่านคนหนึ่งที่รู้จักกันมาหลายปีเรียก{name}ด้วยชื่อตัวกับชื่อพ่อหรือแม่ตามเคย แล้วเห็นลายมือชื่อบนใบชั่ง เขาอ่านทวนเบาๆ แล้วขอบคุณ{name}ด้วยคำที่ไม่เคยใช้กับ{name}มาก่อน
      effects: { gold: 2, alignment: { law: 1 }, flags: [took_the_seat] }
    - id: on_own_terms
      label: ขอเงื่อนไขก่อนลงชื่อ กระดาษที่ไม่มีตรา ขอลงชื่อแบบเดิม
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          นางอาลมิสฟังจนจบ ถามว่ากระดาษแบบไหนที่ไม่มีตรา {name}บอกว่าจดหมายถึงคนในบ้าน สมุดเกิดที่วิหาร ใบรับฝากของที่ตลาด กระดาษที่ไม่เกี่ยวกับโรงชั่ง นางคิดอยู่ครู่หนึ่ง แล้วเขียนเงื่อนไขนั้นลงท้ายกระดาษด้วยลายมือของนางเอง

          {name}ลงชื่อสองครั้งในแผ่นเดียว ครั้งแรกบนบรรทัดของตรา ด้วยนามสกุลของบ้าน ครั้งที่สองใต้เงื่อนไขท้ายแผ่น ด้วยชื่อตัวกับชื่อพ่อหรือแม่ นางอาลมิสดูสองลายมือนั้นแล้วบอกว่าบ้านไม่เคยมีใครขอแบบนี้
        effects: { gold: 2, stats: { CHA: 1 }, flags: [took_the_seat_on_own_terms] }
      failure:
        text: |
          นางอาลมิสวางถ้วยชาลง บอกว่าบ้านคาเลริสไม่มีคนครึ่งๆ คนถือตราเป็นคนของบ้านทั้งตัว หรือไม่เป็นเลย นางพูดเรียบๆ ไม่ขึ้นเสียง แล้วรอ

          {name}หยิบปากกา ลงชื่อด้วยนามสกุลของบ้านบรรทัดเดียว นางรับกระดาษไปพับเก็บ ไม่ได้พูดถึงเรื่องเงื่อนไขอีกเลย ทั้งวันนั้นและวันต่อๆ มา
        effects: { gold: 2, flags: [took_the_seat] }
    - id: keep_the_name
      label: วางปากกากลับที่เดิม ขอบคุณนาง แล้วกลับไปทำงานเดิม
      text: |
        นางอาลมิสไม่ถามว่าทำไม นางพับกระดาษกลับเข้าแฟ้ม รินชาเติมให้อีกครึ่งถ้วย แล้วคุยเรื่องฝนปีนี้จนชาหมด ไม่มีเรื่องอื่นอีก

        เดือนต่อมาโรงชั่งได้คนถือตราคนใหม่ เป็นหลานของคนขายผ้าที่หัวตลาด ลงชื่อด้วยนามสกุลคาเลริสตั้งแต่วันแรก {name}ยังลงชื่อตามด้วยชื่อพ่อหรือแม่บนทุกกระดาษที่ต้องลงชื่อไปจนตลอดชีวิต เป็นชื่อที่ใช้มาแต่แรก และจะเป็นชื่อเดียวที่สลักลงบนหินตอนตาย
      effects: { arc: { id: climb, close: true }, flags: [kept_the_old_name] }
    - id: read_the_paper
      label: ขออ่านกระดาษทั้งแผ่นก่อน บรรทัดต่อบรรทัด
      requires: { flag: job_clerk }
      text: |
        บรรทัดที่สิบสองเขียนว่าบ้านถอดคนถือตราได้ทุกเมื่อโดยไม่ต้องให้เหตุผล และคนถือตราที่บ้านถอดต้องคืนห้องหลังโรงชั่งภายในวันเดียว {name}ชี้บรรทัดนั้น ขอให้เติมคำว่าสามเดือนแทนคำว่าวันเดียว และขอให้เติมเหตุผลลงไปสามข้อ

        นางอาลมิสวางถ้วยชาลง บอกว่าคนที่อ่านบรรทัดที่สิบสองคือคนที่บ้านอยากได้ แล้วเติมให้ตามที่ขอ {name}ลงชื่อด้วยนามสกุลของบ้าน ใต้บรรทัดที่แก้แล้ว
      effects: { gold: 2, stats: { INT: 1 }, flags: [took_the_seat_on_own_terms, mended_the_twelfth_line] }

- id: adult.arc_climb_2_the_long_table
  stage: adult
  scene: tavern
  weight: 30
  arc: { id: climb, step: 2 }
  cast:
    pal: { bond: [friend], optional: true }
  text: |
    หลายปีที่{name}ถือตราโรงชั่ง ลายมือคาเลริสเปลี่ยนจากตัวเกร็งๆ เป็นตัวที่เขียนได้โดยไม่ต้องคิด คนในตลาดเลิกเรียกชื่อพ่อหรือแม่ต่อท้ายชื่อ{name}ไปนานแล้ว มีแต่คนที่โต๊ะยาวท้ายโรงเตี๊ยมริมท่าเกวียน ที่ยังเรียกแบบเดิมทุกเย็นวันตลาด

    เย็นนี้คนรับใช้ของบ้านคาเลริสเข้ามายืนอยู่ข้างประตูโรงเตี๊ยม ไม่นั่ง ไม่สั่งอะไร รอจน{name}ดื่มหมดถ้วย แล้วเดินมาบอกเบาๆ ว่านายหญิงฝากมาสามเรื่อง บ้านได้ยินว่าคนถือตราของบ้านยังนั่งโต๊ะเดียวกับคนขับเกวียนที่ต้องผ่านโรงชั่ง ยังทักทายคนที่บ้านเคยไล่ออกจากที่ดิน และยังไปจุดเทียนที่ศาลทาลิสข้างประตูเมือง ศาลของคนเดินทางกับคนหนีนาย นายหญิงไม่ได้สั่ง นายหญิงเชื่อว่าคนถือตราของบ้านจะรู้เองว่าควรนั่งตรงไหน

    ก่อนออกไป คนรับใช้บอกอีกเรื่อง ค่าตอบแทนปีหน้าจะขึ้นอีกหนึ่งเหรียญ คนขับเกวียนที่โต๊ะยาวได้ยินทุกคำ
  choices:
    - id: drop_it
      label: เลิกมานั่งโต๊ะยาว เลิกไปศาลทาลิส ตั้งแต่เย็นนี้
      text: |
        {name}จ่ายค่าเหล้าให้ทั้งโต๊ะเป็นครั้งสุดท้าย ไม่มีใครถามว่าทำไม คนขับเกวียนที่นั่งข้างกันมาหลายปีเลื่อนถ้วยของตัวเองไปชนถ้วยเปล่าของ{name}หนึ่งที แล้วหันไปคุยเรื่องอื่น

        เดือนต่อมาที่โรงชั่ง คนขับเกวียนคนเดียวกันยื่นใบชั่งให้{name}ประทับ เรียก{name}ว่าท่านคาเลริส เสียงเรียบ หน้าเรียบ ที่ศาลทาลิสข้างประตูเมือง เทียนเล่มที่{name}เคยจุดทุกเดือนไม่มีใครจุดแทน ฐานเทียนตรงนั้นมีขี้ผึ้งเก่าเกาะอยู่เป็นวง
      effects: { gold: 2, flags: [dropped_the_old_street] }
    - id: keep_it
      label: นั่งต่อ ดื่มต่อ แล้วเดือนหน้าก็ไปจุดเทียนที่ศาลเดิม
      text: |
        คนรับใช้ออกไปแล้ว โต๊ะยาวเงียบไปพักหนึ่ง แล้วคนขับเกวียนคนหนึ่งก็เคาะโต๊ะสั่งเหล้าเพิ่มให้{name}อีกถ้วย ไม่มีใครพูดถึงเรื่องนั้น ทั้งคืนนั้นและคืนต่อๆ มา

        ปีต่อมาค่าตอบแทนไม่ขึ้น นางอาลมิสไม่เขียนมาอธิบาย ห้องหลังโรงชั่งที่{name}พักมีคนมาซ่อมหลังคาช้ากว่าที่ขอไปสองฤดู เทียนที่ศาลทาลิสยังมีคนจุดทุกเดือน บางเดือนมีเทียนเล่มที่สองที่ไม่รู้ว่าใครจุดตั้งอยู่ข้างกัน
      effects: { gold: -1, stats: { CHA: 1 }, flags: [kept_the_old_street] }
    - id: bring_the_pal
      label: ชวน{pal}มานั่งกินข้าวกลางวันที่ม้านั่งหน้าโรงชั่ง ตรงที่คนของบ้านเดินผ่านทุกวัน
      requires: { cast: [pal] }
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {pal}มาตามนัดพร้อมห่อข้าวสองห่อ นั่งลงบนม้านั่งหน้าโรงชั่งกลางแดดเที่ยง คุยเสียงดังเหมือนนั่งอยู่ที่โต๊ะยาว คนรับใช้ของบ้านคาเลริสเดินผ่านสองรอบ รอบที่สองหยุดยืนดู แล้วเดินต่อ

          {name}ทำอย่างนั้นทุกวันตลาดจนกลายเป็นธรรมเนียม คนขับเกวียนบางคนเริ่มเอาห่อข้าวมานั่งด้วย บ้านคาเลริสไม่เคยเขียนมาเรื่องนี้อีก ค่าตอบแทนก็ไม่เคยขึ้นอีก
        effects: { stats: { CHA: 1 }, flags: [kept_the_old_street, ate_with_the_pal_at_the_seal] }
      failure:
        text: |
          {pal}ฟังคำชวนแล้วหัวเราะ ไม่ใช่หัวเราะขำ บอกว่าม้านั่งหน้าโรงชั่งเป็นที่ของคนที่ถือตรา ไม่ใช่ที่ของคนขับเกวียนกับคนขนกระสอบ แล้วบอกว่าวันหลังถ้าจะชวนกินข้าวก็ชวนที่โต๊ะยาว

          {name}ไม่ได้ไปที่โต๊ะยาวอีก {pal}ไม่ได้มาที่ม้านั่ง ทั้งสองคนยังทักกันเวลาเจอในตลาด ทักแบบที่คนรู้จักกันมาหลายปีทักกัน
        effects: { flags: [dropped_the_old_street, pal_turned_down_the_bench] }
    - id: hold_to_the_terms
      label: เขียนตอบนายหญิง ยกเงื่อนไขท้ายกระดาษวันรับตราขึ้นมา
      requires: { flag: took_the_seat_on_own_terms, not_flags: [mended_the_twelfth_line] }
      text: |
        {name}เขียนสั้นๆ ว่าวันรับตรา บ้านตกลงไว้ว่ากระดาษที่ไม่มีตราเป็นของ{name} โต๊ะยาวกับศาลทาลิสไม่มีตรา {name}ลงชื่อท้ายจดหมายด้วยชื่อตัวกับชื่อพ่อหรือแม่ ตามเงื่อนไขนั้น

        นางอาลมิสตอบกลับมาบรรทัดเดียว บ้านจำได้ ค่าตอบแทนปีหน้าขึ้นตามที่บอก ไม่ขาดไม่เกิน ในจดหมายฉบับต่อๆ มา นางเขียนถึง{name}ด้วยชื่อตัวเฉยๆ ไม่มีนามสกุล ไม่มีชื่อพ่อหรือแม่
      effects: { gold: 1, stats: { INT: 1 }, flags: [kept_the_old_street, held_the_house_to_the_terms] }

- id: adult.arc_climb_3_the_next_name
  stage: adult
  scene: noble_hall
  weight: 30
  arc: { id: climb, step: 3 }
  text: |
    นางอาลมิสเดินด้วยไม้เท้าแล้ว ห้องรับแขกยังเย็นเหมือนเดิม ภาพวาดบนผนังเพิ่มขึ้นหนึ่งภาพ ลูกชายคนเดียวของนางที่ไปอยู่เมืองหลวงไม่กลับมาอีก นางรินชาเองเหมือนครั้งแรก

    นางบอกว่าบ้านคาเลริสต้องการคนถือตราต่อจาก{name} คนที่บ้านไม่ต้องสอนใหม่ บ้านจะยกตำแหน่งให้คนรุ่นถัดไปของบ้าน{name} จะเป็นลูก หลาน ลูกศิษย์ เด็กที่{name}เลี้ยงไว้ หรือเด็กที่{name}ยังไม่รู้จักก็ได้ ใครก็ได้ที่{name}ชี้ คนคนนั้นจะเกิดมาเป็นคาเลริสในสมุดเกิด เริ่มจากที่{name}ยืนอยู่วันนี้ ไม่ต้องเริ่มจากที่{name}เคยเริ่ม

    ข้อเดียว ชื่อเดิมของ{name}ในสมุดเกิดที่วิหาร บรรทัดที่เขียนว่าเป็นลูกของใคร ต้องขีดออก แล้วเขียนคาเลริสแทน ตลอดไป ไม่มีเงื่อนไขท้ายกระดาษ ไม่มีกระดาษที่ไม่มีตรา

    นางวางสมุดเกิดฉบับคัดจากวิหารไว้บนโต๊ะ เปิดค้างไว้ที่หน้าของ{name}
  choices:
    - id: sign_it_away
      label: ขีดชื่อเดิมด้วยมือตัวเอง แล้วเขียนคาเลริสลงไป
      text: |
        เส้นที่ขีดตรงกว่าที่คิด {name}เขียนคาเลริสในช่องว่างข้างบน ลายมือชินจนไม่ต้องดู นางอาลมิสรับสมุดไป ปิดเบาๆ บอกว่าเดือนหน้านักบวชจะคัดลงสมุดเล่มจริงของวิหาร

        คืนนั้น{name}ลองพูดชื่อเดิมออกเสียงในห้องหลังโรงชั่งคนเดียว ชื่อตัวกับชื่อพ่อหรือแม่ ยังพูดได้คล่อง ยังเป็นเสียงเดิม แต่ไม่มีกระดาษแผ่นไหนในโลกที่เขียนแบบนั้นแล้ว บนหินตอนตายก็จะไม่มี
      effects: { alignment: { law: 1 }, flags: [carries_the_house_name] }
    - id: keep_both
      label: ขอถือตราต่อด้วยชื่อที่ลงอยู่ทุกวัน แต่ไม่ขีดชื่อในสมุดเกิด
      check: { stat: CHA, dc: 14 }
      success:
        text: |
          {name}บอกนางว่าคนที่ตลาดเชื่อคือคนที่ตลาดรู้ว่ามาจากไหน ถ้าขีดออก ตลาดก็ไม่รู้ นางอาลมิสฟังแล้วบอกว่าเป็นข้อโต้แย้งที่ดี ดีพอให้{name}ถือตราต่อจนวางมือเอง แต่ไม่ดีพอให้บ้านยกตำแหน่งให้ใครที่{name}ชี้

          {name}ถือตราต่อ ลงชื่อคาเลริสบนใบชั่งทุกใบเหมือนเดิม ในสมุดเกิดยังเป็นลูกของคนเดิม คนรุ่นถัดไปจะเริ่มจากที่ไหน{name}ไม่ได้ตัดสินแทนเขาอีกแล้ว
        effects: { stats: { CHA: 1 }, flags: [kept_own_name_on_the_seat] }
      failure:
        text: |
          นางอาลมิสไม่เถียง นางปิดสมุดเกิด บอกว่าบ้านเข้าใจ และบ้านจะหาคนรุ่นถัดไปจากที่อื่น ค่าตอบแทนของ{name}ปีหน้าลดลงหนึ่งเหรียญ ไม่มีจดหมายอธิบาย

          {name}ยังถือตราอยู่ ยังลงนามสกุลของบ้านบนใบชั่งทุกใบ แต่เด็กหนุ่มคนหนึ่งเริ่มมานั่งข้างโต๊ะชั่งทุกวัน จดทุกอย่างที่{name}ทำ เป็นหลานห่างๆ ของบ้านคาเลริส เกิดมาเป็นคาเลริสตั้งแต่แรก
        effects: { gold: -2, flags: [kept_own_name_on_the_seat, a_kaleris_boy_at_the_table] }
    - id: step_down
      label: วางตราทองเหลืองลงบนสมุดเกิด แล้วขอลงจากตำแหน่ง
      text: |
        ตรากดลงบนหน้าสมุดพอดีกับชื่อของ{name} นางอาลมิสดูตราอยู่ครู่หนึ่ง แล้วบอกว่าบ้านขอบใจที่ถือมาหลายปีโดยไม่มีใบชั่งใบไหนผิด นางให้เวลาสามเดือนก่อนต้องคืนห้อง

        {name}ย้ายออกจากห้องหลังโรงชั่งก่อนสามเดือน ลงชื่อบนกระดาษคืนห้องเป็นครั้งสุดท้ายด้วยนามสกุลของบ้าน แล้วครั้งถัดไปที่ต้องลงชื่อ ใบรับซื้อถ่านธรรมดาใบหนึ่ง มือของ{name}เขียนคาเลริสไปครึ่งคำแล้วต้องขีดทิ้ง
      effects: { gold: -2, alignment: { moral: 1 }, flags: [stepped_down_from_the_seat] }
    - id: nothing_to_go_back_to
      label: นึกถึงโต๊ะยาวที่ไม่ได้ไปนั่งมาหลายปี แล้วจับปากกา
      requires: { flag: dropped_the_old_street }
      text: |
        โต๊ะยาวท้ายโรงเตี๊ยมยังอยู่ คนขับเกวียนรุ่นใหม่นั่งแทนรุ่นเก่า ไม่มีใครรู้จัก{name}ในชื่อเดิม ศาลทาลิสข้างประตูเมืองเปลี่ยนคนเฝ้าไปสองคนแล้ว {name}รู้ว่าถ้าวันนี้ไม่ขีด ชื่อเดิมก็เหลือแค่ในสมุดเล่มเดียว ไม่เหลือในปากใคร

        {name}ขีดชื่อเดิม เขียนคาเลริสลงไป ไม่ช้า ไม่เร็ว นางอาลมิสพูดว่าบ้านดีใจ {name}พูดว่าขอบคุณ ทั้งสองประโยคจริงพอๆ กัน
      effects: { flags: [carries_the_house_name, nothing_left_to_go_back_to] }
    - id: ask_the_long_table
      label: ขอเวลาเจ็ดวัน แล้วไปถามคนที่โต๊ะยาว
      requires: { flag: kept_the_old_street }
      text: |
        คนขับเกวียนที่โต๊ะยาวฟังจนจบ คนแก่ที่สุดในโต๊ะบอกว่าลูกเขาเกิดมาเป็นลูกคนขับเกวียน และจะเป็นไปจนตาย ถ้ามีใครมายื่นนามสกุลให้ เขาจะรับให้ลูกไม่ต้องคิด แล้วจะเลิกมานั่งโต๊ะนี้ด้วย เพราะนั่งไม่ได้แล้ว คนอื่นในโต๊ะไม่เถียงเขา และไม่เห็นด้วย

        {name}กลับไปบอกนางอาลมิสว่าจะถือตราต่อด้วยชื่อที่ลงอยู่ทุกวัน แต่สมุดเกิดไม่ขีด นางรับคำตอบนั้นโดยไม่ต่อรอง คืนนั้น{name}กลับไปนั่งที่โต๊ะยาว คนแก่คนนั้นสั่งเหล้าให้ถ้วยหนึ่ง ไม่พูดเรื่องนี้อีก
      effects: { stats: { WIS: 1 }, flags: [kept_own_name_on_the_seat, asked_the_long_table] }
    - id: buy_the_seat
      label: เสนอซื้อตำแหน่งขาดด้วยเงินแปดเหรียญ ไม่ต้องมีชื่อบ้านคนไหน
      requires: { flag: job_merchant, min_gold: 8 }
      text: |
        นางอาลมิสหัวเราะออกมาครั้งเดียว แล้วบอกว่าบ้านเก่าๆ ขายที่ดินมาเยอะแล้ว ยังไม่เคยมีใครมาขอซื้อตราจากโต๊ะนี้ นางคิดนานจนชาเย็น แล้วตกลง ตราโรงชั่งเป็นของ{name} ตลอดชีวิตของ{name} แต่ตราจะลงนามสกุลใดก็ได้ที่สภาย่านรับรอง

        สภาย่านรับรองชื่อตัวของ{name}กับชื่อพ่อหรือแม่โดยไม่มีใครค้าน ใบชั่งใบแรกหลังจากนั้นมีลายมือชื่อเดิมของ{name}อยู่ใต้ตรา คนขับเกวียนที่ยืนรอประทับอ่านแล้วอ่านอีก หลังโรงชั่ง{name}เก็บเงินที่เหลือไว้ใต้แผ่นกระดานแผ่นที่สาม เผื่อวันหนึ่งบ้านคาเลริสจะมาขอซื้อคืน
      effects: { gold: -8, stats: { INT: 1 }, flags: [kept_own_name_on_the_seat, bought_the_seat] }

# ===================== faith ศรัทธาที่แตก =====================

- id: adult.arc_faith_1_the_afternoon_fever
  stage: adult
  scene: temple
  weight: 8
  arc: { id: faith, step: 1 }
  when:
    age: [30, 54]
  text: |
    ไข้ของ{name}เริ่มตั้งแต่ปลายหน้าหนาว ไม่สูงพอจะต้องนอน ไม่ต่ำพอจะลืม ทุกบ่ายตัวร้อนขึ้นมาจนมือสั่น ตกค่ำก็ลด เช้าก็หาย บ่ายก็มาใหม่ หมอสองคนให้ยาสองขนาน ไม่มีขนานไหนช่วย

    เรื่องไข้ คนส่วนใหญ่ไหว้อีเซล {name}ก็ไหว้ ทุกวันอีเซลไปวิหาร จ่ายค่าน้ำมันหนึ่งเหรียญทองแดง จุดชามไฟเล็กของตัวเองบนแท่นยาวข้างชามของคนอื่นอีกหลายร้อยใบ แล้วคุกเข่าขอข้อเดียว ทุกคืนที่บ้านก็จุดชามไฟบนหิ้ง ทำอย่างนี้มาจนหน้าร้อนผ่านไปครึ่งหนึ่ง

    ไข้ยังมาทุกบ่าย ไม่เคยมีความอุ่นที่กลางอกอย่างที่แม่ชีบอกว่าบางคนได้ ไม่มีฝัน ไม่มีอะไรเลย วันนี้แม่ชีที่เดินเติมน้ำมันตามแท่นยาวหยุดตรงชามของ{name} บอกว่านางตอบในเวลาของนางเอง แล้วเดินไปเติมชามถัดไป
  choices:
    - id: keep_it_lit
      label: จุดชามต่อทุกคืน ไปวิหารทุกวันอีเซลเหมือนเดิม
      text: |
        {name}จ่ายค่าน้ำมันทุกวันอีเซลจนสิ้นปี ชามบนหิ้งที่บ้านไม่เคยดับสักคืน คืนที่น้ำมันหมด{name}ลุกไปเติมกลางดึก

        ไข้ไม่ได้หาย และไม่ได้หนักขึ้น มันกลายเป็นของประจำตัว คนในบ้านเรียกกันว่าไข้บ่าย บ่ายไหนมันมา{name}ก็นั่งพักใต้ชายคาครึ่งชั่วโมง แล้วลุกไปทำงานต่อ ชามไฟบนหิ้งยังจุดอยู่ทุกคืน จุดเพราะจุดมาตลอด จะหยุดตอนนี้ก็เหมือนยอมรับอะไรบางอย่าง
      effects: { gold: -2, hp: -1, stats: { CON: 1 }, flags: [kept_the_bowl_lit] }
    - id: let_it_go_dark
      label: เลิกเติมน้ำมัน วางชามไว้บนหิ้งเดิมโดยไม่จุด
      text: |
        คืนแรกที่ไม่จุด ห้องมืดกว่าที่คิด ชามไฟใบนั้นอยู่ที่เดิม ขอบชามยังมีคราบเขม่าจากทุกคืนที่ผ่านมา {name}ไม่ได้ยกลง ไม่ได้ล้าง วางไว้อย่างนั้น

        แขกที่เข้าบ้านมองชามก่อนมองเจ้าของบ้าน ทุกคน คนขายฟืนที่มาส่งของทุกเดือนเห็นแล้วไม่ทักเรื่องอื่นอีกเลยทั้งเย็น ไข้บ่ายยังมาเหมือนเดิม ไม่หนักขึ้นเพราะชามดับ ไม่เบาลงเพราะชามเคยจุด
      effects: { hp: -1, stats: { WIS: 1 }, flags: [let_the_bowl_go_dark] }
    - id: carry_it_to_ossa
      label: ยกชามไฟไปที่ประตูวิหารออสซา ขอเทพผู้เฝ้าประตูให้ประตูยังไม่เปิด
      text: |
        คนไม่ค่อยไหว้ออสซาเรื่องไข้ ออสซาดูแลความตายกับประตู ไม่ได้ดูแลการรักษา นักบวชที่ประตูวิหารดูชามไฟอีเซลในมือ{name}แล้วไม่ถาม รับไปวางไว้ข้างประตูหินปิดตาย ตรงที่วางของคนที่มาขอให้ประตูยังไม่เปิด

        ไข้บ่ายยังมาทุกบ่าย ไม่มีอะไรตอบเหมือนเดิม แต่ทุกครั้งที่{name}เดินผ่านวิหารออสซา ชามใบนั้นยังวางอยู่ที่เดิม มีคนเติมน้ำมันให้ ไม่รู้ว่าใคร ที่บ้านบนหิ้งตรงที่ชามเคยอยู่ มีรอยวงกลมสะอาดกว่าฝุ่นรอบๆ
      effects: { gold: -1, hp: -1, flags: [carried_the_bowl_to_another_god, carried_it_to_ossa] }
    - id: cleric_stops_asking
      label: สวดถึงเทพที่รับใช้ ขอเรื่องของตัวเองเป็นครั้งแรก
      requires: { class: cleric }
      text: |
        ทั้งชีวิตที่รับใช้{god} {name}ขอให้คนอื่นมานับครั้งไม่ถ้วน ไม่เคยขอเรื่องของตัวเอง คืนนี้ขอ สวดจนเทียนบนแท่นหมดไปสองเล่ม ความอุ่นที่เคยวางลงกลางอกทุกเช้าไม่มาในคืนนั้น เช้าต่อมาก็ไม่มา

        เช้าวันที่สามมันกลับมา อุ่นเท่าเดิม เบาเท่าเดิม ตอนที่{name}สวดให้คนไข้คนอื่น ไม่ใช่ตอนที่สวดให้ตัวเอง {name}รับใช้ต่อ ทำงานทุกอย่างเหมือนเดิม และเลิกขอเรื่องของตัวเองตั้งแต่วันนั้น ไข้บ่ายยังมาทุกบ่าย
      effects: { hp: -1, stats: { WIS: 1 }, flags: [kept_the_bowl_lit, cleric_stopped_asking_for_self] }
    - id: no_gods_business
      label: ตัดสินว่าไข้เป็นเรื่องของหมอ ไม่ใช่เรื่องของเทพองค์ไหน แล้วไปหาหมอตลาดล่าง
      text: |
        หมอตลาดล่างไม่ถามว่าไหว้ใครมาบ้าง ถามแค่ว่าไข้ขึ้นกี่โมง กินอะไรตอนเช้า แล้วต้มเปลือกไม้ขมให้หม้อหนึ่ง คิดสามเหรียญ บอกให้กินจนหมดหม้อแม้ไข้จะหายก่อน

        ไข้หายตอนหม้อเหลือครึ่ง {name}กินจนหมดตามที่หมอสั่ง ชามไฟบนหิ้ง{name}ยังจุดบ้างในวันเทศกาล จุดให้เพื่อนบ้านเห็น เหมือนแขวนธงหน้าบ้าน ส่วนเรื่องที่สำคัญจริงในชีวิตหลังจากนั้น {name}ไม่เคยเอาไปคุกเข่าขอที่แท่นไหนอีก
      effects: { gold: -3, arc: { id: faith, close: true }, flags: [asked_no_god_again] }

- id: adult.arc_faith_2_the_empty_day
  stage: adult
  scene: home
  weight: 30
  arc: { id: faith, step: 2 }
  text: |
    หลายปีผ่านไป ถนนที่{name}อยู่รู้ว่าชามไฟบ้านไหนมืด เด็กๆ นับกันเล่นตอนเดินกลับจากตลาดตอนพลบ หน้าต่างไหนมีแสงส้มของชาม หน้าต่างไหนไม่มี บ้านไหนเปลี่ยนจากองค์หนึ่งไปอีกองค์ คนทั้งถนนก็รู้ก่อนเจ้าบ้านจะบอก

    คนเก็บค่าน้ำมันของวิหารมาปีละครั้ง ยืนกลางถนน เปิดสมุดเล่มยาว ขานชื่อบ้านทีละหลังให้เจ้าบ้านออกมาจ่าย ปีนี้มาตรงกับวันก่อนวันว่าง เขาขานชื่อบ้าน{name} แล้วอ่านบรรทัดของบ้านนี้ดังพอให้ทั้งถนนได้ยิน จ่ายปีไหน ค้างปีไหน จุดให้องค์ไหน

    วันว่างคือวันของอัสเทล วันที่เจ็ดของสัปดาห์ ไม่มีใครทำงาน ไม่มีใครฉลอง ร้านปิด วิหารปิด ผู้ใหญ่บอกว่าเด็กที่เกิดวันนี้ดวงไม่ดี เที่ยงวันว่างปีนี้ ในบ้านที่ไม่มีเสียงอะไร {name}นั่งอยู่หน้าหิ้ง แล้วมีบางอย่างตอบคำขอเมื่อหลายปีก่อน ไม่ได้มาจากทางที่ควรมา ไม่อุ่น ไม่เย็น ชัดเหมือนมีคนพูดอยู่หลังหู
  choices:
    - id: pay_and_shut
      label: จ่ายค่าน้ำมันให้คนเก็บเงินตามสมุด แล้วปิดหน้าต่างทุกบานในวันว่าง
      text: |
        {name}จ่ายสองเหรียญ ครบตามบรรทัดที่เขาอ่าน คนเก็บเงินขีดบรรทัดของบ้านนี้ด้วยหมึกสีเดียวกับบ้านอื่นๆ แล้วขานชื่อบ้านถัดไป

        เที่ยงวันว่าง {name}ลุกจากหน้าหิ้งไปปิดหน้าต่างทีละบาน ลงกลอนประตู แล้วนั่งหันหลังให้หิ้ง นับลมหายใจจนเสียงหลังหูจางไปเอง ตกบ่ายแดดลอดช่องบานเกล็ดเข้ามาเป็นเส้นบนพื้น{name}นั่งดูเส้นแดดเลื่อนจนพ้นวัน
      effects: { gold: -2, alignment: { law: 1 }, flags: [paid_the_bowl_due] }
    - id: refuse_the_collector
      label: บอกคนเก็บเงินกลางถนนว่าชามของบ้านนี้จะเป็นอย่างที่เป็นอยู่
      check: { stat: CHA, dc: 13 }
      success:
        text: |
          {name}พูดไม่ดัง แต่ชัดพอให้บ้านติดกันได้ยิน ว่าบ้านนี้จะจุดหรือไม่จุดให้ใคร เป็นเรื่องของบ้านนี้ คนเก็บเงินเงยหน้าจากสมุด ดู{name}ครู่หนึ่ง แล้วเขียนบรรทัดของบ้านนี้ว่า ไม่ประสงค์ แทนคำว่าค้าง

          บ้านติดกันสองหลังเงียบไปพักหนึ่ง หน้าต่างบ้านฝั่งตรงข้ามที่มืดมาหลายปีเปิดออกครึ่งบาน หญิงเจ้าของบ้านยืนฟังอยู่ข้างใน ปีต่อมาคำว่าไม่ประสงค์มีในสมุดเล่มนั้นสามบรรทัด
        effects: { stats: { CHA: 1 }, flags: [refused_the_bowl_due] }
      failure:
        text: |
          ประโยคของ{name}ออกมาแข็งเกินไป คนเก็บเงินไม่เถียง เขาเขียนบรรทัดของบ้านนี้ว่าค้าง แล้วขีดเส้นใต้สองเส้น ทั้งถนนเห็นเขาขีด

          เดือนต่อมาเด็กๆ ในถนนเลิกเล่นนับชามหน้าบ้าน{name} เดินผ่านเร็วขึ้นตอนพลบ แม่ของเด็กคนหนึ่งดึงมือลูกออกห่างจากรั้วบ้านนี้ ไม่ได้ตั้งใจให้ใครเห็น
        effects: { flags: [refused_the_bowl_due, the_lane_underlined_the_house] }
    - id: listen
      label: นั่งนิ่งหน้าหิ้ง ฟังเสียงหลังหูจนจบ
      requires: { not_traits: [curse_brand] }
      text: |
        {name}ฟังจนจบ เสียงนั้นไม่ได้ยาว ไม่ได้ซ้ำ ไม่ได้ขออะไรตอบแทน เมื่อจบแล้วบ้านก็กลับเป็นบ้านที่ไม่มีเสียงอะไรตามเดิม ข้างนอกมีไก่ตัวหนึ่งคุ้ยดินอยู่ใต้หน้าต่าง

        สิ่งที่ได้ยิน{name}ไม่เล่าให้ใครฟัง ทั้งวันนั้นและหลังจากนั้น เย็นวันว่าง{name}เห็นว่าขอบชามไฟบนหิ้งมีน้ำค้างเกาะเป็นวงบางๆ กลางหน้าร้อน แตะแล้วเย็นจนนิ้วชา แวบเดียวที่ปลายนิ้ว{name}เห็นแสงสีฟ้าอ่อน แบบแสงของตะเกียงฟ้า แล้วน้ำค้างก็แห้งไป
      effects: { stats: { WIS: 1 }, world: { star: 1 }, flags: [answered_on_the_empty_day] }
    - id: walk_it_off
      label: ลุกออกจากบ้าน เดินในถนนที่ร้างทั้งเมืองจนวันว่างหมด
      text: |
        วันว่างทั้งเมืองปิด {name}เดินถนนที่ไม่มีคน ผ่านร้านที่ปิดบาน ผ่านวิหารที่ลงกลอน ผ่านตลาดที่มีแต่โต๊ะเปล่ากับนกพิราบ เสียงหลังหูตามมาได้ครึ่งทาง แล้วหายไปตรงไหนสักแห่งระหว่างสะพานกับท่าเกวียน

        {name}เดินจนรองเท้าสึกด้านหนึ่ง กลับถึงบ้านตอนตะวันตกดิน คนเก็บค่าน้ำมันยืนอยู่หัวถนนเหมือนเมื่อวาน กำลังเก็บสมุดเข้าย่าม เขาเห็น{name}แล้วไม่ขานชื่อ
      effects: { stats: { CON: 1 }, flags: [walked_off_the_empty_day] }

- id: adult.arc_faith_3_the_naming
  stage: adult
  scene: temple
  weight: 30
  arc: { id: faith, step: 3 }
  text: |
    บ้านท้ายถนนได้ลูกคนแรก ธรรมเนียมของถนนนี้ ตอนนักบวชเรียกชื่อเด็กเป็นครั้งแรกในวิหาร ต้องมีคนจากถนนเดียวกันยืนถือชามไฟเหนือหัวเด็กหนึ่งคน คนที่อยู่ถนนนี้มานานที่สุดในบรรดาคนที่ยังยืนไหว ปีนี้คนนั้นคือ{name}

    แม่ของเด็กมาขอเองที่หน้าบ้าน อุ้มลูกมาด้วย บอกว่าบ้านนางไม่ได้สนใจว่าชามของ{name}จุดหรือไม่จุดมากี่ปี นางขอคนที่ถนนรู้จัก ไม่ได้ขอคนที่วิหารรู้จัก แต่วิหารยังเป็นของเทพองค์เดิม ชามไฟยังเป็นชามของนาง และนักบวชจะยื่นชามใส่มือ{name}ต่อหน้าทุกคน

    พิธีมีขึ้นวันอีเซลหน้า เด็กหลับอยู่บนบ่าแม่ ปากขยับเหมือนกำลังดูดนมในฝัน
  choices:
    - id: hold_the_bowl
      label: รับคำ แล้วยืนถือชามไฟเหนือหัวเด็กในวิหาร
      text: |
        ชามหนักกว่าชามที่บ้าน น้ำมันเต็มจนต้องถือนิ่ง {name}ยืนอยู่อย่างนั้นตลอดเวลาที่นักบวชสวด จนนักบวชเรียกชื่อเด็กออกเสียงครั้งแรก เด็กตื่นขึ้นมาร้องไห้พอดี ทั้งวิหารหัวเราะ

        คืนนั้นหิ้งที่บ้านมีชามไฟจุดอยู่หนึ่งใบ {name}เติมน้ำมันเอง แล้วนั่งดูเปลวไฟจนน้ำมันพร่อง ไม่ได้ขออะไร ไม่ได้รออะไรตอบ ปีต่อๆ มาหิ้งนั้นไม่มืดอีกสักคืน
      effects: { stats: { WIS: 1 }, flags: [stays_with_the_temple] }
    - id: another_gods_bowl
      label: บอกแม่ของเด็กว่าชามของบ้านนี้ไปอยู่กับอีกองค์แล้ว ถ้าจะให้ถือ ขอถือชามใบนั้น
      requires: { flag: carried_the_bowl_to_another_god }
      text: |
        แม่ของเด็กยืนคิดอยู่นาน แล้วบอกว่าได้ นักบวชที่วิหารไม่ยอม ชามของวิหารเป็นของวิหาร สุดท้ายตกลงกันว่า{name}จะยืนถือชามของตัวเองอยู่ท้ายวิหาร ไม่ได้ยืนเหนือหัวเด็ก

        เช้าวันพิธี{name}แวะไปยกชามของตัวเองจากข้างประตูหินของวิหารออสซา นักบวชที่ประตูไม่ถามอะไร เหมือนวันที่รับไว้ คนทั้งถนนเห็น{name}ยืนอยู่ท้ายวิหาร ถือชามไฟที่ไม่ได้จุดให้เจ้าของวิหาร เปลวไฟเล็กกว่าชามบนแท่น แต่ไม่ดับ หลังพิธี{name}ยกชามกลับไปวางข้างประตูหินตรงรอยเดิม คนที่ถนนเลิกนับว่าบ้านนี้จุดให้ใคร เพราะนับไปก็ได้คำตอบเดิม
      effects: { stats: { CHA: 1 }, flags: [changed_gods] }
    - id: decline
      label: ปฏิเสธ แล้วนั่งอยู่ท้ายวิหารในวันพิธีเหมือนคนธรรมดา
      text: |
        {name}บอกแม่ของเด็กว่าคนถือชามควรเป็นคนที่เชื่อว่าชามมีความหมาย นางไม่เถียง ไปขอคนขายน้ำมันหัวถนนแทน คนขายน้ำมันถือชามได้นิ่งกว่าที่ทุกคนคิด

        วันพิธี{name}นั่งอยู่แถวหลังสุด ได้ยินชื่อเด็กพร้อมคนอื่น ร้องเพลงท่อนที่ทุกคนร้องเพราะจำทำนองได้ ตอนออกจากวิหาร{name}หยุดให้ทานคนนั่งขอที่บันได ให้เพราะเขาหิว ไม่ได้ให้เพื่อให้ใครเห็น คืนนั้นที่บ้าน{name}ไม่ได้จุดอะไรบนหิ้ง แล้วก็นอนหลับได้เหมือนทุกคืน
      effects: { alignment: { moral: 1 }, flags: [believes_nothing] }
    - id: keep_the_empty_day
      label: ปฏิเสธ แล้วบอกตัวเองว่าคำตอบที่ได้ยินมาจากวันว่าง ไม่ได้มาจากวิหารนี้
      requires: { flag: answered_on_the_empty_day }
      text: |
        {name}ไม่บอกแม่ของเด็กว่าทำไม บอกแค่ว่าไม่ใช่คนที่ควรถือชามของวิหารนี้ นางไปขอคนอื่น

        วันว่างถัดมา{name}นั่งอยู่หน้าหิ้งตั้งแต่เช้า ไม่ได้จุดอะไร ไม่ได้สวดอะไร นั่งรอ เสียงนั้นไม่มาอีกในวันนั้น หรือวันว่างถัดไป แต่{name}ยังนั่งทุกวันว่าง เหมือนคนเฝ้าประตูบ้านที่ไม่รู้ว่าแขกจะมาเมื่อไร เพื่อนบ้านเห็น{name}นั่งหลังหน้าต่างทุกวันที่เจ็ด ไม่มีใครถามว่าไหว้ใคร ไม่มีคำตอบที่พูดออกมาได้
      effects: { world: { star: 1 }, flags: [changed_gods, sits_through_the_empty_day] }
    - id: name_the_child_yourself
      label: บอกนักบวชว่าวันนั้นจะเป็นคนเรียกชื่อเด็กเอง และจะถือชามเอง
      requires: { any_flags: [job_city_priest, job_fort_priest] }
      text: |
        นักบวชประจำวิหารเป็นรุ่นน้องของ{name}หลายปี ยอมให้โดยไม่ต้องขอซ้ำ วันพิธี{name}ยืนถือชามด้วยมือข้างหนึ่ง วางมืออีกข้างบนหัวเด็ก แล้วเรียกชื่อเด็กเป็นครั้งแรก ด้วยเสียงที่ใช้เรียกชื่อเด็กมาแล้วนับร้อยคน

        คำขอเมื่อหลายปีก่อนไม่เคยมีใครตอบ ชื่อเด็กคนนี้ได้คำตอบทันทีจากทั้งถนน ทุกคนพูดตามพร้อมกัน {name}ไม่ได้ลืมเรื่องแรก แต่เลือกจะยืนอยู่ตรงที่มีคนพูดตาม
      effects: { stats: { CHA: 1 }, flags: [stays_with_the_temple, named_the_street_child] }

# ===================== house บ้าน =====================

- id: adult.arc_house_1_the_eighth_notch
  stage: adult
  scene: home
  weight: 30
  arc: { id: house, step: 1 }
  when:
    age: [30, 56]
    any_flags: [owns_home, belek_home_loan, bought_the_carpenters_house, kept_the_village_house, owns_a_house_in_ventras, owns_a_house_in_kardin, owns_a_house_in_tundar, owns_a_house_in_market_town, owns_a_house_in_foothill_market, owns_a_house_in_star_hall]
  text: |
    บ้านทุกหลังในถิ่นนี้มีขื่อกลางหนึ่งตัว ขวางใต้หลังคาจากผนังถึงผนัง เจ้าของบ้านบากขื่อหนึ่งรอยต่อคนหนึ่งคนที่นับเป็นคนของบ้าน คนซื้อบ้านต่อไม่ขูดรอยของคนเก่า บ้านเก่าจึงมีรอยของคนที่ไม่มีใครในบ้านรู้จักแล้ว

    {name}รอมานานกว่าจะบากรอยของตัวเอง เย็นนี้ยกเก้าอี้มาต่อกันสองตัว ปีนขึ้นไปพร้อมมีดพก ขื่อมีรอยเก่าอยู่เจ็ดรอย บางรอยลึก บางรอยตื้นเหมือนคนบากมือสั่น รอยที่ห้าเรียบไปทั้งรอย ใครสักคนเอามีดขูดจนเนื้อไม้ตรงนั้นขาวกว่าที่อื่น {name}บากรอยที่แปดถัดจากรอยสุดท้าย เป่าขี้เลื่อยออก แล้วลงจากเก้าอี้

    สามวันต่อมา ตอน{name}กลับจากงาน หญิงคนหนึ่งยืนอยู่ฝั่งตรงข้ามบ้าน ถือไม้เท้าไผ่ ดูหลังคาอยู่ ไม่ได้เข้ามาเคาะประตู พอ{name}เดินมาถึง นางบอกว่าชื่อเวลีน รอยที่ห้าบนขื่อเป็นของนาง พ่อของนางขูดทิ้งในปีที่นางแต่งงานกับคนที่พ่อไม่ยอมรับ แล้วขายบ้านไปก่อนตาย นางมีพินัยกรรมฉบับเก่าที่พ่อเขียนไว้ก่อนปีนั้น ยกบ้านให้นาง สภาย่านยังไม่เคยเห็นฉบับนั้น นางไม่ได้มาขอบ้านคืน นางมาบอกให้รู้ก่อนจะยื่นสภา
  choices:
    - id: fight_for_it
      label: เอาใบซื้อขายบ้านไปยื่นสภาย่านก่อนนาง
      check: { stat: INT, dc: 13 }
      success:
        text: |
          {name}ไปถึงห้องโถงสภาตั้งแต่เช้า ยื่นใบซื้อขาย ใบรับเงิน และใบโอนที่ลงชื่อพยานครบ เสมียนเปิดสมุดบ้านของย่าน ชี้ให้ดูบรรทัดที่พ่อของเวลีนลงชื่อขาย ลงหลังวันที่ในพินัยกรรมของนางหลายปี สภาตัดสินว่าใบที่ลงทีหลังมีผล

          เวลีนฟังคำตัดสินจบแล้วกระทุ้งไม้เท้ากับพื้นหนึ่งที แล้วเดินออกไปโดยไม่หันมา คืนนั้น{name}ปีนขึ้นไปดูขื่ออีกครั้ง รอยที่แปดยังใหม่ เนื้อไม้ยังขาว ข้างๆ คือรอยที่ห้าที่ขาวกว่า
        effects: { stats: { INT: 1 }, flags: [fought_for_the_house] }
      failure:
        text: |
          สภาอ่านทั้งสองฉบับ แล้วตัดสินแบบที่ไม่มีใครพอใจ บ้านยังเป็นของ{name} แต่{name}ต้องจ่ายเงินให้เวลีนสี่เหรียญ ค่าที่พ่อของนางขายของที่ยกให้ลูกไปแล้ว

          {name}จ่ายต่อหน้าเสมียน เวลีนรับเงินไปนับ แล้วบอกว่านางไม่ได้อยากได้เงิน นางอยากให้สภาจดว่าพ่อของนางผิด ตอนนี้สภาจดแล้ว นางเดินออกไป {name}ยืนอยู่หน้าโต๊ะเสมียนกับใบรับเงินที่ยังเปียกหมึก
        effects: { gold: -4, flags: [fought_for_the_house, paid_veline_off] }
    - id: share_it
      label: ชวนนางเข้าบ้าน ให้บากรอยของนางใหม่ข้างรอยเดิม แล้วเขียนชื่อนางลงสมุดบ้านเป็นคนที่สอง
      text: |
        เวลีนปีนเก้าอี้ไม่ไหว {name}ต้องอุ้มเก้าอี้ตัวบนลงมาให้นางยืนบนตัวเดียว แล้วจับเอวนางไว้ นางบากรอยใหม่ข้างรอยที่ขาว มือไม่สั่นเลย บากลึกกว่ารอยไหนบนขื่อ

        ที่สภาย่านเสมียนเขียนชื่อเวลีนลงในสมุดบ้านใต้ชื่อ{name} ในช่องที่ไม่เคยมีใครใช้ ช่องผู้มีส่วน นางไม่ได้ย้ายเข้ามาอยู่ นางมากินข้าวเย็นปีละครั้ง วันเดียวกับที่พ่อของนางขูดรอยทิ้ง นั่งหันหน้าไปทางขื่อทุกครั้ง
      effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [shared_the_house_claim] }
    - id: only_a_roof
      label: บอกนางว่าให้ยื่นสภาตามสบาย บ้านเป็นแค่หลังคา จะเป็นของใครก็ได้
      text: |
        เวลีนดู{name}เหมือนคนที่เตรียมคำพูดมาทั้งคืนแล้วไม่ได้ใช้ นางบอกว่าจะยื่น {name}บอกว่าเชิญ แล้วเข้าบ้านไปหุงข้าว

        นางไม่ได้ยื่น หรือยื่นแล้วสภาไม่เรียก {name}ไม่เคยรู้ และไม่เคยไปถาม บ้านยังเป็นของ{name} หลังคายังกันฝนได้ดี {name}ไม่ได้ปีนขึ้นไปดูขื่ออีก ไม่ได้บากรอยให้ใครอีก รอยที่แปดค่อยๆ คล้ำลงจนสีเดียวกับรอยอื่น วันหนึ่ง{name}มองขึ้นไปแล้วชี้ไม่ได้ว่ารอยไหนเป็นของตัวเอง
      effects: { arc: { id: house, close: true }, flags: [house_is_only_a_roof] }
    - id: send_her_to_the_bank
      label: บอกนางว่าบ้านหลังนี้ยังเป็นของวิหารเบเลคจนกว่าหนี้จะหมด ให้ไปยื่นที่ธนาคาร
      requires: { flag: belek_home_loan }
      text: |
        เวลีนไปที่ธนาคารจริง เสมียนของเบเลคอ่านพินัยกรรมของนางแล้วยิ้ม บอกว่าธนาคารยินดีพิจารณา ถ้านางรับหนี้ที่ค้างอยู่ของบ้านหลังนี้ไปด้วย นางถามว่าเท่าไร เสมียนบอก นางพับพินัยกรรมเก็บแล้วเดินกลับ

        ปลายเดือนธนาคารส่งใบแจ้งมาให้{name} ค่าเปิดแฟ้มข้อพิพาทหนึ่งเหรียญ เพิ่มเข้าไปในหนี้ {name}จ่าย บ้านยังเป็นของ{name} หรือของธนาคาร แล้วแต่จะนับแบบไหน คืนนั้น{name}ปีนขึ้นไปลูบรอยที่ห้า ไม้ตรงนั้นเรียบเหมือนไม่เคยมีใครอยู่
      effects: { gold: -1, alignment: { law: 1 }, flags: [fought_for_the_house, hid_behind_the_bank] }

- id: adult.arc_house_2_the_cracked_beam
  stage: adult
  scene: home
  weight: 30
  arc: { id: house, step: 2 }
  cast:
    mate: { id: partner, optional: true }
    kid: { kin: [child], min_age: 12, pick: eldest, optional: true }
  text: |
    หน้าฝนปีนี้ยาวกว่าทุกปีที่คนในย่านจำได้ ฝนตกติดกันเก้าวัน คืนที่สิบมีเสียงดังกลางดึก เสียงไม้ใหญ่ฉีก ไม่ใช่หัก {name}จุดตะเกียงขึ้นไปดู ขื่อกลางมีรอยแยกยาวตามแนวเสี้ยนจากรอยที่สามถึงรอยที่เจ็ด กว้างพอสอดเล็บเข้าไปได้ ทุกรอยบากบนขื่อยังอยู่ครบ บางรอยอยู่บนเนื้อไม้ที่แยกออกเป็นสองซีก

    ช่างไม้มาดูตอนเช้า เคาะขื่อสามที ฟังเสียง แล้วบอกว่าต้องเปลี่ยนก่อนฝนหน้า ไม่อย่างนั้นหลังคาลงมาทั้งแผง ขื่อไม้แข็งตัวใหม่ทั้งตัว ค่าไม้ ค่าแรง ค่ายกหลังคา รวมแล้วเท่ากับเงินที่{name}เก็บได้ทั้งปี เขาบอกด้วยว่าธรรมเนียมเปลี่ยนขื่อ ต้องบากรอยเก่าลงขื่อใหม่ทุกรอยให้ตรงที่เดิม และใครที่ลงแรงยกขื่อใหม่ขึ้นที่ ได้บากรอยของตัวเองหนึ่งรอย
  choices:
    - id: alone
      label: จ้างช่างแค่ยกหลังคา งานที่เหลือทำเองคนเดียว
      text: |
        {name}ไสขื่อใหม่เองครึ่งเดือน มือพองแตกแล้วพองใหม่ ตอนยกขึ้นที่ ช่างสองคนช่วยดันหลังคาขึ้น{name}ดันขื่อเข้าร่องคนเดียว ไหล่ข้างหนึ่งปวดอยู่ทั้งหน้าหนาว

        คืนสุดท้าย{name}นั่งบนคานลอกรอยเก่าทีละรอยจากขื่อแตกลงขื่อใหม่ ใช้ด้ายทาบระยะ ใช้มีดเล่มเดิมบาก รอยของคนที่ไม่รู้จัก รอยที่ขูดทิ้ง รอยของตัวเอง ทุกรอยอยู่ตรงที่เดิม ขื่อใหม่ไม่มีรอยไหนที่เป็นรอยใหม่ ขื่อเก่า{name}ผ่าเป็นฟืน แต่ท่อนที่มีรอยที่แปดเก็บไว้ใต้เตียง
      effects: { gold: -5, hp: -1, stats: { STR: 1 }, flags: [mended_the_house_alone] }
    - id: the_street
      label: บอกคนในถนน ใครว่างมายกขื่อด้วยกัน ได้บากรอยคนละหนึ่ง
      text: |
        วันยกขื่อมีคนมาเจ็ดคน คนขายผักหัวถนน ลูกชายสองคนของช่างตีเหล็ก หญิงม่ายบ้านติดกัน คนเฝ้าโกดังที่{name}ไม่เคยคุยด้วยเกินสองประโยค ทุกคนดันขื่อขึ้นพร้อมกันตามเสียงนับ ขื่อเข้าร่องในครั้งเดียว

        เย็นนั้น{name}เลี้ยงข้าวทั้งเจ็ดคน หมดไปสามเหรียญ แล้วทุกคนก็ปีนเก้าอี้ขึ้นไปบากรอยของตัวเองทีละคน ขื่อใหม่มีรอยเพิ่มเจ็ดรอยของคนที่ไม่ได้อยู่บ้านนี้ ทุกวันนี้เวลาคนขายผักเดินผ่านหน้าบ้าน เขายังเงยหน้าดูหลังคา
      effects: { gold: -3, stats: { CHA: 1 }, flags: [mended_the_house_with_hands, the_street_cut_the_beam] }
    - id: with_the_mate
      label: ยกขื่อกับ{mate}สองคน แล้วบากรอยของ{mate}ใหม่ด้วยกัน
      requires: { cast: [mate] }
      text: |
        {mate}ถือปลายขื่ออีกข้าง ทั้งสองคนนับพร้อมกันสามครั้งกว่าขื่อจะเข้าร่อง ครั้งที่สองพลาด ขื่อไถลลงมาครึ่งศอกจนนิ้วของ{mate}เกือบติด ทั้งคู่ยืนหอบอยู่ใต้หลังคาที่ค้ำไม้ไว้ชั่วคราว แล้วหัวเราะ

        รอยของ{mate}มีอยู่บนขื่อเก่าแล้ว ตอนลอกลงขื่อใหม่ {mate}ขอบากเองด้วยมือตัวเอง บากลึกกว่ารอยเดิม แล้วบากอีกรอยเล็กๆ ข้างรอยของ{name} ไม่บอกว่ารอยนั้นของใคร
      effects: { gold: -4, flags: [mended_the_house_with_hands, mended_with_the_mate] }
    - id: with_the_kid
      label: ให้{kid}ช่วยยกขื่อ แล้วให้{kid:เขา|เธอ}บากรอยของตัวเองบนขื่อใหม่
      requires: { cast: [kid], not_flags: [child_lives_away] }
      text: |
        {kid}แข็งแรงกว่าที่{name}คิด ดันขื่อจากอีกฝั่งโดยไม่ต้องบอกว่าดันตอนไหน พอขื่อเข้าร่อง {kid}ยืนดูมือตัวเองที่มีเสี้ยนตำอยู่สามเสี้ยน ไม่ร้อง ไม่บ่น

        รอยของ{kid}มีอยู่บนขื่อเก่าแล้ว รอยที่{name}บากให้ตอน{kid}ยังเด็กกว่านี้ ปีนี้{kid}ขอบากรอยของตัวเองบนขื่อใหม่ด้วยมือตัวเอง {name}ยื่นมีดพกให้ รอยนั้นเบี้ยว ลึกไม่เท่ากันทั้งรอย และเป็นรอยเดียวบนขื่อที่{name}จำได้ว่าใครบาก บากวันไหน
      effects: { gold: -4, flags: [mended_the_house_with_hands, mended_with_the_kid] }
    - id: veline_sends_help
      label: ส่งข่าวไปบอกเวลีนว่าขื่อที่มีรอยของนางแตกแล้ว
      requires: { flag: shared_the_house_claim }
      text: |
        เวลีนมาไม่ไหวแล้ว แต่ส่งหลานชายสามคนมาแทน ตัวใหญ่ทุกคน ไม่ค่อยพูด ยกขื่อขึ้นที่ได้ในบ่ายเดียว ไม่ยอมรับค่าแรง กินข้าวที่{name}หุงจนหมดหม้อ

        ตอนลอกรอยลงขื่อใหม่ หลานคนโตบากรอยของเวลีนแทนยายของเขา ข้างรอยขาวที่ลอกมาด้วย แล้วบากรอยของตัวเองสามรอยตามธรรมเนียม ขื่อใหม่มีรอยของคนในสายเลือดเวลีนสี่รอย มากกว่ารอยของคนในบ้าน{name}
      effects: { gold: -3, alignment: { moral: 1 }, flags: [mended_the_house_with_hands, veline_kin_lifted_the_beam] }

- id: adult.arc_house_3_whose_after
  stage: adult
  scene: home
  weight: 30
  arc: { id: house, step: 3 }
  cast:
    kid: { kin: [child], pick: eldest, optional: true }
  text: |
    สภาย่านตอกประกาศไว้ที่ประตูทุกบ้านในถนนตั้งแต่เช้า กระดาษแผ่นเดียวกันทุกบาน ตั้งแต่ปีนี้ บ้านทุกหลังต้องแจ้งชื่อคนที่จะได้บ้านต่อจากเจ้าของ เขียนลงสมุดบ้านของย่านภายในสิ้นเดือน บ้านที่ไม่แจ้ง เมื่อเจ้าของไม่อยู่แล้ว สภาจะขายทอดตลาด เงินเข้าคลังของย่าน เหตุมาจากบ้านหัวถนนที่คนเก้าคนอ้างเป็นเจ้าของพร้อมกันเมื่อปีก่อน จนต้องปิดบ้านไว้ทั้งปีให้หนูอยู่

    {name}ดึงประกาศออกจากประตู เข้าบ้าน นั่งลงใต้ขื่อ บนขื่อมีรอยของคนที่ไม่รู้จัก รอยของคนที่ลงแรง รอยของคนในบ้าน และรอยของ{name}เอง ไม่มีรอยไหนบอกว่าบ้านควรเป็นของใคร

    เสมียนของสภานั่งโต๊ะรับชื่ออยู่ที่ห้องโถงทุกบ่ายจนสิ้นเดือน
  choices:
    - id: to_the_kid
      label: เขียนชื่อ{kid}
      requires: { cast: [kid], not_flags: [child_lives_away] }
      text: |
        เสมียนถามว่าลูกคนไหน {name}บอกชื่อ{kid} เสมียนเขียนลงช่องโดยไม่ถามต่อ บ้านจำนวนมากในย่านเขียนแบบนี้ ไม่มีอะไรต้องถาม

        เย็นนั้น{name}เล่าให้{kid}ฟัง {kid}ไม่ได้ขอบคุณ ถามว่าถ้าวันหนึ่งไม่อยากอยู่บ้านหลังนี้ขายได้ไหม {name}บอกว่าได้ แต่ขอให้ลอกรอยบนขื่อไว้ก่อนขาย ลอกลงกระดาษก็ได้ {kid}ปีนขึ้นไปนับรอยบนขื่อคืนนั้น นับได้ไม่ตรงกับที่{name}นับ
      effects: { flags: [house_promised_to_kin, house_to_the_kid] }
    - id: to_the_blood
      label: เขียนชื่อคนในสายเลือดที่ใกล้ที่สุดที่นึกออก แม้จะไม่ได้เจอกันมาหลายปี
      text: |
        ชื่อที่{name}ให้เสมียนเขียนเป็นชื่อที่ต้องนึกอยู่นานกว่าจะสะกดถูก หลานหรือญาติที่อยู่ถิ่นอื่น เจอกันครั้งสุดท้ายในงานศพ หรืองานแต่ง หรือไม่เคยเจอเลยนอกจากในจดหมาย เสมียนเขียนช้าๆ ตามที่{name}สะกดให้ทีละตัว

        {name}เขียนจดหมายไปบอกคนคนนั้นเดือนเดียวกัน จดหมายตอบกลับมาหลังหน้าหนาว ลายมือที่ไม่เคยเห็น ขอบคุณ ถามว่าบ้านอยู่ตรงไหนของถนน มีกี่ห้อง {name}วาดผังบ้านส่งกลับไปให้ วาดขื่อกลางกับรอยบนขื่อลงไปด้วยทุกรอย
      effects: { stats: { WIS: 1 }, flags: [house_promised_to_kin] }
    - id: to_someone_outside
      label: เขียนชื่อคนที่ไม่ใช่ญาติ แต่มีรอยอยู่บนขื่อ
      requires: { flag: the_street_cut_the_beam }
      text: |
        เสมียนถามว่าเป็นอะไรกัน {name}บอกว่าเป็นคนที่ลงแรงกับบ้านหลังนี้ เสมียนเงยหน้าครู่หนึ่ง แล้วเขียนลงไป ช่องความเกี่ยวพันเขาเว้นว่างไว้ เพราะไม่มีคำในสมุดที่ใช้ได้

        ข่าวไปถึงตัวคนคนนั้นก่อน{name}จะบอกเอง เขามาหาที่บ้านตอนเย็น ยืนอยู่ใต้ขื่อนานจนลืมนั่ง ถามว่าทำไม {name}ชี้รอยของเขาบนขื่อ คืนนั้นเขาอยู่กินข้าวด้วย ล้างจานเองโดยไม่มีใครบอก
      effects: { stats: { CHA: 1 }, alignment: { moral: 1 }, flags: [house_promised_outside] }
    - id: leave_it_blank
      label: ไม่ไปแจ้ง ปล่อยให้สภาตัดสินเองเมื่อถึงวันนั้น
      text: |
        สิ้นเดือนเสมียนเดินถนนดูบ้านที่ยังไม่แจ้ง ตอกหมุดทองแดงตัวเล็กไว้ที่วงกบประตูบ้านละหนึ่งตัว บ้าน{name}ได้หมุดตัวหนึ่ง บ้านติดกันได้อีกตัว

        {name}ไม่ได้ถอดออก หมุดนั้นขึ้นสนิมเขียวในหน้าฝนแรก เด็กๆ ในถนนเรียกบ้านที่มีหมุดว่าบ้านของสภา {name}ได้ยินแล้วไม่แก้ บ้านเป็นของ{name}จนถึงวันนั้น หลังจากวันนั้นไม่ใช่เรื่องที่{name}จะได้เห็น
      effects: { flags: [house_unpromised] }
    - id: to_veline_line
      label: เขียนชื่อหลานคนโตของเวลีน คนที่บากรอยแทนยาย
      requires: { flag: veline_kin_lifted_the_beam }
      text: |
        เสมียนเปิดสมุดบ้านหน้าเดิม เห็นชื่อเวลีนในช่องผู้มีส่วนอยู่แล้ว เขาเขียนชื่อหลานชายของนางลงช่องผู้รับ แล้วบอกว่าบ้านหลังนี้กลับไปหาคนที่พ่อเคยขูดชื่อทิ้ง ใช้เวลาแค่สองชั่วคน

        หลานคนนั้นมาขอบคุณพร้อมไก่หนึ่งตัว บอกว่ายายของเขาร้องไห้ตอนรู้ข่าว ร้องครั้งเดียว แล้วสั่งให้เขาไปหาหินลับมีดมาให้ เพราะรอยบนขื่อต้องบากให้ลึกกว่านี้
      effects: { alignment: { moral: 1 }, flags: [house_promised_outside, house_back_to_the_scraped_line] }

# ===================== pillars เจ็ดเสา =====================

- id: adult.arc_pillars_1_five_knots
  stage: adult
  scene: road
  weight: 30
  arc: { id: pillars, step: 1 }
  when:
    age: [36, 58]
    any_flags: [touched_a_pillar, touched_gods_pillar, touched_the_sky_pillar, path_ulwen_pillar]
  text: |
    หญิงคนแสวงบุญคนหนึ่งเดินมาถึงย่านของ{name}ตอนเย็น นั่งลงที่ขอบบ่อน้ำ แล้วลุกไม่ขึ้นอีก ไข้ขึ้นจนปากแห้งแตก รองเท้าขาดทั้งสองข้าง คนในย่านช่วยกันพยุงไปนอนห้องเก็บของหลังโรงเตี๊ยม ข้อมือซ้ายของนางมีเชือกป่านเส้นหนึ่ง ผูกปมไว้ห้าปม ปมแรกดำจนเกือบเป็นเนื้อเดียวกับเชือก ปมสุดท้ายยังขาว

    คนแสวงบุญที่ตั้งใจแตะเสาฟ้าให้ครบผูกเชือกไว้ที่ข้อมือ แตะได้หนึ่งต้นผูกหนึ่งปม คนในย่านเคยได้ยิน ยังไม่เคยมีใครเห็นคนที่มีห้าปม

    นางชื่อเคสริน ตกดึกไข้ลดพอให้พูดได้ นางถามคนที่นั่งเฝ้าว่าในย่านนี้มีใครเคยแตะเสาฟ้ามาบ้าง สักต้นก็ได้ คนเฝ้าไปตาม{name}มา เคสรินขอดูฝ่ามือของ{name} แล้วล้วงเชือกเปล่าเส้นหนึ่งออกจากย่าม นางบอกว่าเชือกเส้นแรกของใครก็ตาม ต้องให้คนที่มีปมอยู่แล้วเป็นคนผูก นางพกเชือกเปล่าไว้หลายเส้น เผื่อเจอคนแบบ{name} นางไปต่อไม่ได้แล้ว ปมที่หกของนางจะไม่มีวันได้ผูก หลานชายของนางกำลังขี่ม้ามารับกลับบ้าน
  choices:
    - id: let_her_tie
      label: ยื่นข้อมือให้นางผูก
      text: |
        มือของเคสรินร้อนจัด แต่ผูกปมได้แน่นกว่ามือคนไม่ป่วย นางผูกปมแรกตรงกลางเชือก บอกว่าปมนี้คือต้นที่{name}แตะมาแล้ว ปมที่เหลือคือต้นที่ต้องเดินไปเอง ไม่มีใครผูกให้ได้อีก

        เชือกป่านใหม่ระคายผิว คืนแรก{name}นอนไม่หลับเพราะมัน คืนที่สองก็ยังรู้ว่ามันอยู่ตรงนั้น คืนที่สามหลานชายของเคสรินมาถึง พานางขึ้นเกวียนกลับทางเดิม นางโบกมือข้างที่มีห้าปมให้{name}จนเกวียนพ้นหัวถนน
      effects: { stats: { WIS: 1 }, flags: [tied_the_first_knot] }
    - id: tie_and_tend
      label: ให้นางผูก แล้วนั่งเฝ้าไข้นางทุกคืนจนหลานชายมาถึง
      text: |
        {name}นั่งเฝ้าสามคืน เปลี่ยนผ้าเย็นบนหน้าผาก ป้อนน้ำข้าวทีละช้อน จ่ายค่าห้องหลังโรงเตี๊ยมแทนนางไปสองเหรียญ คืนที่สองไข้ลดจนนางเล่าเรื่องเสาทั้งห้าต้นให้ฟัง ต้นไหนเย็นกว่าต้นไหน ต้นไหนคนต่อแถวยาวที่สุด ต้นไหนมีคนขายเทียนปลอม นางไม่ได้บอกว่าต้นไหนชื่ออะไร บอกแค่ทางไป

        คืนที่สามนางผูกปมให้ ผูกช้า ตั้งใจ บอกว่าคนที่นั่งเฝ้าคนแปลกหน้าสามคืนคงเดินได้ไกล หลานชายมาถึงตอนรุ่งสาง ขอบคุณ{name}ด้วยไก่ย่างหนึ่งตัวกับคำบอกทางไปต้นที่สองที่นางพูดไว้ระหว่างไข้
      effects: { gold: -2, alignment: { moral: 1 }, flags: [tied_the_first_knot, tended_the_pilgrim] }
    - id: leave_it_untied
      label: ขอบคุณนาง แต่ไม่รับเชือก ต้นเดียวที่แตะมาพอแล้วสำหรับชีวิตนี้
      text: |
        เคสรินไม่เสียใจ นางบอกว่าคนส่วนใหญ่ตอบแบบนี้ และคนส่วนใหญ่ถูก นางเก็บเชือกเปล่ากลับเข้าย่าม แล้วขอให้{name}เล่าเรื่องต้นที่{name}แตะ เล่าว่าหินเย็นแค่ไหน แถวยาวแค่ไหน {name}เล่าจนนางหลับ

        หลานชายของนางมารับในวันที่สาม หลายปีต่อมา{name}ยังจำความเย็นของเสาต้นนั้นที่ฝ่ามือได้ชัด จำได้คนเดียว ไม่ต้องมีปมไหนช่วยจำ
      effects: { arc: { id: pillars, close: true }, flags: [left_the_cord_untied] }
    - id: treat_her
      label: ดูไข้ให้นางอย่างหมอ ก่อนจะยื่นข้อมือ
      requires: { any_flags: [job_hedge_doctor, job_road_healer] }
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ไข้ของนางเป็นไข้คนเดินทาง น้ำไม่สะอาดกับเท้าที่เปิดแผลมาหลายเดือน {name}ล้างแผลที่เท้าทั้งสองข้าง ต้มยาให้สามหม้อ วันที่สามนางลุกเดินได้ ถามหาทางไปต้นที่หกก่อนถามหาหลานชาย

          นางผูกปมแรกให้{name}ก่อนออกเดินทาง ไม่รอหลาน บอกให้หลานตามไปทันที่ไหนก็ที่นั่น {name}ไม่รู้ว่านางไปถึงต้นที่หกไหม รู้แต่ว่านางเดินออกจากย่านไปด้วยรองเท้าคู่ใหม่ที่{name}ให้ และเท้าที่ไม่มีแผลแล้ว
        effects: { stats: { WIS: 1 }, flags: [tied_the_first_knot, healed_the_pilgrim] }
      failure:
        text: |
          ยาที่{name}ต้มให้ลดไข้ได้ครึ่งเดียว นางยังเดินไม่ได้ และ{name}เองติดไข้ไปอีกครึ่งเดือน ไข้หนักกว่าของนาง นอนซมอยู่บ้านขณะที่หลานชายของนางมารับนางกลับ

          ก่อนขึ้นเกวียน นางให้หลานแวะมาที่บ้าน{name} นางผูกปมให้ทั้งที่{name}นอนอยู่บนเสื่อ มือร้อนทั้งคู่ ผูกเสร็จนางบอกว่าคนไข้ผูกให้หมอ ไม่ค่อยมีใครได้แบบนี้
        effects: { hp: -2, flags: [tied_the_first_knot, caught_the_pilgrim_fever] }

- id: adult.arc_pillars_2_the_second_foot
  stage: adult
  scene: road
  weight: 30
  arc: { id: pillars, step: 2 }
  text: |
    หลายปีที่เชือกปมเดียวอยู่ที่ข้อมือ{name} ป่านซีดจนเกือบขาว ปมแรกคล้ำขึ้นเพราะเหงื่อ ปีนี้{name}ออกเดินไปหาต้นที่สอง ทิ้งงานที่บ้านไว้ครึ่งเดือน หลังคาที่ควรซ่อมก่อนฝนยังไม่ได้ซ่อม คนที่จ้างไว้ต้องไปหาคนอื่น

    ที่โรงเตี๊ยมกลางทาง{name}เจอคนแคระหญิงคนหนึ่ง ชื่อทูร์ดา ตระกูลลิ่มคู่ ไหล่กว้าง ผมถักเป็นเปียเดียวพาดหลัง เชือกที่ข้อมือมีสามปม นางจะไปต้นเดียวกับ{name} และไม่ชอบเดินคนเดียวตอนคืนเดือนมืด

    ช่วงสุดท้ายก่อนถึงโคนเสามีประตูไม้ขวางทาง คนเก็บค่าผ่านทางสองคนนั่งหลังโต๊ะ เก็บคนละเหรียญทองแดงเป็นค่าบำรุงทาง ไม่มีตราของวิหาร สองข้างทางต่อจากนั้นมีแต่แผงขายเทียน เทียนเสกแล้ว เทียนจากโคนเสา เทียนที่ไม่ดับในลม เด็กคนหนึ่งเดินตามคนแสวงบุญ ขายเชือกที่ผูกปมไว้แล้วสองปมสามปม ถูกกว่าค่าเดินทางไปต้นเดียว
  choices:
    - id: walk_it
      label: จ่ายค่าผ่านทาง เดินไปจนถึงหิน แล้วผูกปมที่สองเอง
      text: |
        แถวรอแตะเสายาวจนต้องรอถึงบ่าย {name}ยืนต่อแถวกับคนแก่ แม่อุ้มลูก คนพิการบนแคร่หาม พอถึงตา{name}วางฝ่ามือลงบนหินสีกระดูก เย็นเหมือนต้นแรก แต่เย็นคนละแบบ ต้นแรกเย็นเหมือนน้ำ ต้นนี้เย็นเหมือนลม

        {name}ผูกปมที่สองเองตรงนั้น ห่างจากปมแรกหนึ่งข้อนิ้ว ผูกไม่สวยเท่าปมที่เคสรินผูก แต่แน่น ขากลับเดินผ่านแผงเทียนทั้งแถวโดยไม่ซื้อสักเล่ม ถึงบ้านหลังคารั่วไปแล้วสองจุด
      effects: { gold: -3, stats: { CON: 1 }, flags: [two_knots] }
    - id: walk_with_turda
      label: เดินกับทูร์ดาไปจนถึงโคนเสา แล้วให้นางผูกปมที่สองให้
      text: |
        ทูร์ดาเดินช้าแต่ไม่หยุด ตอนเดินผ่านแผงเทียน นางบอกว่าคนแคระไม่ซื้อเทียนที่โคนเสา เพราะเสาไม่ต้องการแสงของใคร พอถึงคนเก็บค่าผ่านทาง นางจ่ายของ{name}ด้วยไม่ให้ทวงคืน

        ทั้งสองคนแตะหินพร้อมกัน ทูร์ดาผูกปมที่สองให้{name} ผูกแบบคนแคระ ปมเล็ก แน่น หมุนไปทางเดียวกับปมแรก นางบอกว่าถ้าวันหนึ่ง{name}จะไปต้นของออสซา ให้ส่งข่าวไปที่ฮอร์ดุน ถามหาตระกูลลิ่มคู่ คนนอกแตะต้นนั้นได้ก็ต่อเมื่อมีคนแคระเดินนำ นางจะเดินนำให้
      effects: { gold: -2, people: [{ id: pillar_friend, name: ทูร์ดา, gender: f, race: dwarf, bond: friend, closeness: 1, age: 50 }], flags: [two_knots, walked_with_turda] }
    - id: the_goat_path
      label: พาทูร์ดาอ้อมประตูไม้ไปทางทางแพะที่คนนำทางรู้จัก
      requires: { flag: job_guide }
      check: { stat: WIS, dc: 13 }
      success:
        text: |
          ทางแพะไต่ข้างเขาชันกว่าทางหลัก แต่ไม่มีโต๊ะเก็บเงิน ไม่มีแผงเทียน {name}อ่านรอยกีบกับมูลแพะได้ตลอดทาง พาทูร์ดาลงไปโผล่หลังแผงเทียนแผงสุดท้าย ห่างจากแถวรอแตะไม่ถึงร้อยก้าว

          ทูร์ดาบอกว่าทางแบบนี้คนแคระเรียกว่าทางของคนที่รู้ว่ากำลังทำอะไร {name}ผูกปมที่สองเองที่โคนเสา แล้วจ่ายค่าข้าวเย็นให้ทูร์ดาแทนค่าผ่านทางที่ไม่ได้จ่าย
        effects: { gold: -1, stats: { WIS: 1 }, flags: [two_knots, took_the_goat_path] }
      failure:
        text: |
          ทางแพะแตกเป็นสองสายตรงลานหินที่{name}ไม่เคยเห็น เลือกสายผิด ไปจบที่หน้าผา ต้องเดินย้อนครึ่งวัน ข้อเท้าพลิกตอนลง ทูร์ดาไม่บ่น เดินเงียบไปจนค่ำ

          สุดท้ายทั้งสองคนต้องกลับไปจ่ายค่าผ่านทางที่ประตูไม้เหมือนคนอื่น ช้ากว่าคนอื่นหนึ่งวัน {name}ผูกปมที่สองกะเผลกๆ ข้างหิน
        effects: { gold: -2, hp: -1, flags: [two_knots, lost_on_the_goat_path] }
    - id: turn_back
      label: หยุดที่ประตูไม้ แล้วเดินกลับบ้าน
      text: |
        {name}ยืนอยู่หน้าโต๊ะเก็บเงินครู่หนึ่ง ข้างหลังมีคนต่อแถวรอจ่าย ข้างหน้าเป็นแผงเทียนเรียงไปจนสุดสายตา และเด็กที่ขายเชือกผูกปมสำเร็จรูปยื่นเชือกมาให้ดูสามเส้น {name}ถอยออกจากแถว ทูร์ดาดูอยู่แต่ไม่ห้าม

        ขากลับ{name}เดินเร็วกว่าขามา ถึงบ้านก่อนฝนแรกสองวัน ทันซ่อมหลังคา ปมเดียวที่ข้อมือยังอยู่ ยังไม่ได้แก้ออก เชือกเส้นนั้นยังมีที่ว่างสำหรับปมอีกหกปมเท่าเดิม
      effects: { stats: { WIS: 1 }, flags: [turned_back_on_the_pillar_road] }

- id: adult.arc_pillars_3_the_seventh
  stage: adult
  scene: road
  weight: 30
  arc: { id: pillars, step: 3 }
  cast:
    walker: { id: pillar_friend, optional: true }
  text: |
    หลายปีต่อมา ที่ศาลาพักคนแสวงบุญริมทางแห่งหนึ่ง {name}นั่งข้างชายแก่คนหนึ่งที่มีหกปมที่ข้อมือ ปมที่หกยังขาวสะอาด เขาเพิ่งผูกเมื่อสามวันก่อน กำลังเดินกลับบ้าน

    เขาไม่ได้ภูมิใจ เขาเล่าเหมือนคนเล่าราคาข้าว ต้นที่เจ็ดคือตอเสาในแดนเถ้า อยู่หลังแนวหินของภาคีผู้เฝ้าผนึก ภาคีไม่ให้ใครข้ามแนวหินไม่ว่าจากฝั่งไหน ไม่เคยมีใครในความทรงจำของคนที่ยังมีชีวิตผูกปมที่เจ็ดได้ เขารู้ตั้งแต่ก่อนผูกปมแรก แต่เดินมาจนหกปมเพราะคิดว่าอาจมีทาง ไม่มี

    แล้วเขาก็บอกเรื่องที่คนที่ยังไม่ถึงต้นของออสซาต้องรู้ ที่ฮอร์ดุน คนนอกแตะเสาของออสซาได้เฉพาะด้านที่ไม่มีช่องศพ และต้องมีคนแคระหนึ่งคนเดินนำ คนแคระที่ไม่รู้จักกันไม่เดินนำให้ใคร

    เขาลุกไปก่อน เชือกหกปมแกว่งอยู่ที่ข้อมือ {name}นั่งดูปมของตัวเองที่ยังไม่ครึ่ง
  choices:
    - id: walk_on
      label: เดินต่อไปต้นถัดไปตั้งแต่พรุ่งนี้ ส่วนต้นที่เจ็ดค่อยว่ากันเมื่อไปถึงแนวหิน
      text: |
        {name}เดินอีกเก้าวันถึงโคนเสาต้นถัดไป แตะหิน ผูกปมอีกหนึ่งปม แล้ววางแผนต้นต่อไปตั้งแต่คืนนั้นที่ศาลาพักใต้เสา ใช้เศษถ่านขีดทางลงผ้าเช็ดหน้า ต้นไหนก่อน ต้นไหนหลัง ต้นที่เจ็ด{name}ขีดไว้ท้ายสุด ปลายเส้นทางเป็นวงกลมที่ไม่มีทางเข้า

        ชายหกปมพูดถูกทุกคำ {name}รู้ และยังขีดวงกลมนั้นไว้ ขีดหนาที่สุดในผ้าทั้งผืน
      effects: { gold: -3, stats: { CON: 1 }, flags: [walks_on_for_seven] }
    - id: stop_here
      label: นั่งนับปมที่มีอยู่ แล้วตัดสินว่าพอแค่นี้
      text: |
        {name}นับปมที่ข้อมือสองรอบ ปมของเคสริน หรือปมที่ใครผูกให้ ปมที่ผูกเอง แต่ละปมมีเรื่องของมัน มีแถวคนรอ มีความเย็นของหินคนละแบบ ไม่มีปมไหนขาด

        {name}ไม่ได้แก้เชือกออก ไม่ได้ผูกปมเพิ่ม เดินกลับบ้านทางเดิม ปีต่อๆ มามีคนแสวงบุญแวะมาถามทางไปเสาสองสามคน {name}บอกทางเท่าที่รู้ ไม่ได้บอกว่าตัวเองหยุดที่ปมไหน ไม่มีใครถาม
      effects: { stats: { WIS: 1 }, flags: [stops_at_the_knots_i_have] }
    - id: send_for_turda
      label: ส่งข่าวไปฮอร์ดุน ถามหาทูร์ดา ตระกูลลิ่มคู่
      requires: { cast: [walker] }
      text: |
        จดหมายตอบกลับมาในเดือนเดียว ลายมือแข็งเหมือนตอกด้วยสิ่ว {walker}เขียนว่าให้มาถึงตีนเขาก่อนหิมะ นางจะรออยู่ที่ประตูหินของตระกูล

        นางรอจริง เดินนำ{name}ขึ้นไปถึงเสาของออสซาไม่หยุดพัก พาอ้อมไปด้านที่ไม่มีช่องศพ ยืนอยู่ข้างหน้าตลอดเวลาที่{name}วางมือบนหิน หินต้นนี้เย็นเหมือนหลุมลึก {walker}ผูกปมให้อีกครั้ง แล้วบอกว่าต้นที่เจ็ดนางเดินนำให้ไม่ได้ ไม่มีใครเดินนำให้ได้ แต่ถ้า{name}ยังจะไป นางจะเดินไปด้วยจนถึงแนวหิน
      effects: { gold: -2, people: [{ id: pillar_friend, closeness: 1 }], flags: [walks_on_for_seven, touched_ossa_with_turda] }
    - id: walk_ahead_yourself
      label: บอกชายหกปมว่าคนแคระคนนี้จะเดินนำให้ ถ้าเขาจะกลับไปต้นของออสซาอีกครั้ง
      requires: { flag: race_dwarf }
      text: |
        ชายหกปมหยุดเดิน หันกลับมาถามว่าพูดจริงหรือ เขาแตะต้นของออสซามาแล้วครั้งหนึ่ง แต่ต้องจ้างคนแคระที่ไม่ยอมบอกชื่อเดินนำ แพงกว่าค่าเดินทางทั้งปี {name}บอกว่าคราวนี้ไม่เสียเงิน

        สองคนเดินไปฮอร์ดุนด้วยกันอีกยี่สิบวัน {name}เดินนำเขาขึ้นไปถึงหิน อ้อมไปด้านที่ไม่มีช่องศพ ยืนข้างหน้าเขาอย่างที่คนแคระยืน เขาวางมือลงบนหินที่เคยแตะมาแล้ว ร้องไห้โดยไม่มีเสียง {name}ผูกปมของตัวเองเพิ่มหนึ่งปมที่นั่น แล้วตัดสินว่าจะเดินต่อ
      effects: { gold: -2, alignment: { moral: 1 }, flags: [walks_on_for_seven, walked_ahead_for_a_stranger] }
    - id: knows_the_line
      label: บอกชายหกปมว่าเคยยืนอยู่ที่แนวหินนั้น
      requires: { any_flags: [job_wardens, path_wardens] }
      text: |
        ชายหกปมนั่งลงใหม่ ถามว่าตอเสาหน้าตาเป็นอย่างไร {name}บอกเท่าที่บอกได้ เห็นจากแนวหินในวันที่ไม่มีเถ้าบัง สูงกว่าบ้าน ดำกว่าถ่าน ไม่มีใครเดินเข้าไปใกล้กว่าแนวหิน และไม่ควรมีใครเข้าไป {name}ไม่ได้บอกเหตุผลข้อหลัง เขาไม่ได้ถาม

        {name}ไม่ได้ผูกปมเพิ่มหลังวันนั้น คนที่รู้ว่าข้างหลังแนวหินมีอะไรรออยู่ ไม่ได้อยากเห็นปมที่เจ็ดบนข้อมือใคร รวมทั้งข้อมือของตัวเอง
      effects: { stats: { WIS: 1 }, flags: [stops_at_the_knots_i_have, knows_what_is_behind_the_line] }
