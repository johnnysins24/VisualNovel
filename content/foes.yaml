  hurt:
    - "ถ่านในอกของ{foe}หรี่ลงวูบหนึ่ง มันถอยไปสองก้าวโดยไม่ส่งเสียง"
    - "{foe}เซ หนังที่ย่นเหมือนกระดาษไหม้ร่อนออกเป็นแผ่น"
    - "{foe}เดินวนออกห่าง จังหวะหายใจของมันสะดุด แสงในอกกะพริบตาม"
