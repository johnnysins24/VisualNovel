# ศัตรูในการปะทะ 37 ชนิด (ที่มาและหน้าตาอยู่ในคัมภีร์โลก หัวข้อสัตว์ประหลาดรุ่นแรกและรุ่นสอง ภาพอยู่ใน public/foes/)
# ฉากปะทะอ้างศัตรูด้วย id แล้วเขียนแค่เนื้อเรื่องกับวิธีรับมือ ตัวเลขทั้งหมดของศัตรูอยู่ในไฟล์นี้ที่เดียว
#   threat  ระดับภัย 1 ถึง 5 = ความยากของการทอย (10 12 14 16 18) และพลังชีวิตที่เสียเมื่อพลาดหนึ่งจังหวะ
#   morale  แรงใจ 2 ถึง 4 ขีด สำเร็จหนึ่งจังหวะลดหนึ่งขีด หมดเมื่อไรศัตรูล้ม หนี หรือยอม
#   weak    จุดอ่อน: ป้ายของวิธี (fire light water smoke noise bait name pierce blunt edge ranged) หรือชนิดของวิธี (attack quick guard read talk item)
#           วิธีที่ตรงจุดอ่อนได้ +3 เมื่อตัวละครรู้จุดอ่อนแล้ว (เคยชนะ เคยอ่านทางออก หรือเป็นพราน)
#   strong  จุดแข็ง: วิธีที่ชนจุดแข็งโดน −3 เสมอ
#   speaks  พูดรู้เรื่อง เจรจาได้ · lethal: false = พลังชีวิตหมดแล้วล้ม ไม่ตาย
#   lore    สิ่งที่คนในโลกเล่าต่อกันเรื่องจุดอ่อน หนึ่งประโยค แสดงบนการ์ดเมื่อตัวละครรู้จุดอ่อน
#   strike  ประโยคตอนศัตรูทำร้ายตัวละคร · hurt ประโยคตอนศัตรูเสียแรงใจ ใช้เมื่อวิธีในฉากไม่ได้เขียนข้อความเอง
#           ใช้ {foe} เป็นชื่อศัตรูของฉากนั้น (ฉากตั้งชื่อเองได้ เช่น ฝูงหมาเถ้า) และ {name} เป็นชื่อตัวละคร
#   wounds  แผลติดตัวที่ได้เมื่อแพ้หรือเสียพลังชีวิตเกินครึ่งในการปะทะครั้งเดียว ได้อันแรกที่ยังไม่มี
#   magic   ภูต ผี หรือผู้ใช้เวท: ของเหล็กเย็นได้เปรียบ +2
#   loot    ของที่ทิ้งไว้เมื่อชนะ ไล่ตามลำดับ ชิ้นแรกที่ทอยติดคือชิ้นที่ได้ (item หรือ gold, chance 0 ถึง 1, text ประโยคตอนเจอ)

# ---------- ฝ่ายจอมมาร ----------
- id: ash_hound
