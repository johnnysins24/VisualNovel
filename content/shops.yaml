- id: ileth_root_stall
  name: แผงใต้ต้นไม้ของเอลฟ์ชายป่า
  location: ileth
  requires: { not_wears: [black_iron] }
  closed: "เอลฟ์ที่เฝ้าแผงมองเหล็กดำบนตัว{name} แล้วดึงผ้ามาคลุมของทั้งแผงโดยไม่พูดสักคำ"
  greet:
    - ไม้ทุกชิ้นบนแผงนี้ล้มเอง เราไม่ได้โค่น
    - จับได้ แต่อย่าต่อราคา ต้นไม้ไม่เคยต่อราคากับใคร
    - ของชิ้นนั้นรอคนซื้อมาสี่สิบปีแล้ว รออีกสักปีก็ไม่เป็นไร
  staples: [moss_poultice, salt_meat, smoke_pot]
  stock:
    [deer_gut_bow, leafing_staff, bark_fibre_cloak, boar_spear, polished_root_ring, bark_dye_hood, seven_ply_bark_shield, tower_keeper_knife, star_count_pendant, star_thread_robe, hemp_rope,
    single_deer_boots, trunk_climber_breeches, herb_picker_gloves, carved_antler_charm, star_counter_goggles, two_pillar_scarf, elder_bark_coat, old_star_ledger, firefly_root_lamp, fire_hardened_thorn, hollow_wood_clapper, young_elf_longsword, first_tree_longbow, sling_stones]

- id: ashland_fort_three_market
  name: ตลาดหลังป้อมสาม
  location: ashland
  greet:
    - ซื้อแล้วอย่าบอกใครว่าซื้อที่ไหน ฉันก็จะไม่บอกใครว่าขายให้ใคร
    - ของจากใต้เถ้า ขุดขึ้นมาเมื่อวาน ยังอุ่นอยู่เลย จับดูสิ
    - นักบวชตะเกียงมาตรวจทุกวันพระ วันนี้ไม่ใช่วันพระ
