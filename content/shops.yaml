# ร้านค้าของแต่ละถิ่น (ชุด 2ข) ร้านอยู่ที่ location_tag ของถิ่นนั้น ตัวละครเข้าร้านได้ตั้งแต่อายุ 12
# staples = ของที่มีขายทุกปี · stock = ของหมุนเวียน ปีหนึ่งวางแผง 5 ชิ้น (GEAR.shelf) สุ่มใหม่ทุกปี
# greet = คำทักของคนขาย หนึ่งประโยคต่อปี · requires กับ closed = ร้านที่ไม่ขายให้ทุกคน

- id: arvel_churchyard_market
  name: ตลาดนัดลานโบสถ์
  location: arvel_village
  greet:
    - วางตะกร้าก่อนสิ ของฉันไม่หนีไปไหนหรอก
    - ปีนี้ข้าวสาลีได้ราคา คนเลยกล้าควักกระเป๋ากันหน่อย
    - ดูได้ จับได้ แต่ลองใส่แล้วต้องซื้อนะ
  staples: [boiled_bandage, pine_torch, hemp_rope, salt_meat]
  stock:
    [reaper_cap, brass_button_shirt, woodcutter_axe, shepherd_staff, tallow_lantern, cracked_cow_bell, knit_wool_scarf, butcher_knife, field_boots, hay_gloves, feast_crackers, ward_salt,
    plough_trousers, wooden_sole_shoes, militia_longsword, nail_club, cowherd_bow, soup_lid_shield, isel_bowl_charm, twice_offered_ring, sheepskin_coat, village_prayer_book, onion_pot_helm, fence_maul, sister_fire_lantern, honey_bread, sling_stones, apple_liquor, jaw_trap]

- id: ventras_dock_market
  name: ตลาดท่าเรือเวนทราส
  location: ventras
  greet:
    - ของลงเรือเมื่อเช้านี้เอง ยังมีกลิ่นน้ำเค็มติดอยู่เลย
    - ราคานี้คือราคาก่อนเรือเหาะลำหน้าเข้า หลังจากนั้นฉันไม่รับปาก
    - ทองเหลืองแท้ทุกชิ้น ไม่เชื่อเอาฟันกัดดูได้ แต่กัดแล้วต้องซื้อ
  staples: [boiled_bandage, lamp_oil_flask, flash_powder, whetstone]
  stock:
    [dock_goggles, navigator_pistol, brass_spanner, clerk_long_coat, harbor_short_sword, shipping_seal_ring, oilcloth_cloak, dew_watch_lantern, marine_musket, institute_third_primer, calming_snuff, feast_crackers, temple_salve,
    distillery_coat, rigger_gloves, navy_stripe_trousers, bark_sole_shoes, customs_baton, cadet_longsword, dew_tube_pistol, whisper_mirror_shard, paid_debt_ring, harbour_hand_bell, mooring_crossbow, runner_cap, dish_head_staff, dock_darts, lamp_blessed_water, roast_coffee, signal_flare]

- id: hordun_iron_yard
  name: ลานเหล็กตีนเขาฮอร์ดุน
  location: hordun
  greet:
    - เหล็กของเราไม่ต้องพูดแทน ยกดูเอาเอง
    - ราคานี้รวมค่าลับคมตลอดชีพ ชีพของเจ้านะ ไม่ใช่ของข้า
    - อยากได้ของถูกก็ลงเขาไปซื้อทองเหลือง
  staples: [boiled_bandage, whetstone, pine_torch, bone_broth]
  stock:
    [double_ring_mail, twice_forged_plate, seventh_level_helm, four_pound_hammer, clan_war_axe, three_joint_gauntlets, rivet_rim_shield, gate_mace, tunnel_crossbow, water_skin, hemp_rope,
