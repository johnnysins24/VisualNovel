# ประโยคสั้นที่ระบบเติมท้ายบันทึกของปี (ชุด 1 รากของชีวิตยาว)
# ระบบสุ่มหนึ่งประโยคจากกุญแจที่ตรงที่สุด ใช้ {name} ได้ทุกกุญแจ กุญแจ news_death ใช้ {who} เป็นชื่อคนที่จากไป
# ลำดับการหา: decline_<ค่า> แล้ว decline · news_death_<ตำแหน่งในครอบครัว> แล้ว news_death_<ชนิดความสัมพันธ์> แล้ว news_death
# ห้ามสรุปความรู้สึก เล่าแค่สิ่งที่เห็นได้ หนึ่งหรือสองประโยค

decline:
  - ร่างกายของ{name}ช้าลงอีกนิด ไม่มีใครเห็นนอกจากเจ้าตัว
  - ปีนี้{name}นั่งพักบ่อยกว่าปีก่อน แล้วบอกทุกคนว่าแค่นั่งดูฟ้า
  - ปีนี้{name}เดินไปตลาดนานกว่าปีก่อนเกือบเท่าตัว ทั้งที่ไม่ได้แวะที่ไหน
  - เสื้อตัวเดิมของ{name}หลวมขึ้นที่ไหล่
  - คนที่เดินมาด้วยกันเริ่มผ่อนฝีเท้ารอ{name} โดยไม่มีใครพูดเรื่องนี้

decline_STR:
  - ถังน้ำใบเดิมหนักขึ้นกว่าปีก่อน ทั้งที่ไม่มีใครเปลี่ยนถัง
  - ฝาไหที่{name}เคยบิดเปิดเอง ปีนี้ต้องยื่นให้คนอื่นบิด
  - กระสอบที่เคยแบกทีละสองใบ ปีนี้{name}แบกทีละใบ
  - ปีนี้{name}ผ่าฟืนได้ครึ่งกองก็ต้องวางขวาน ปีก่อนยังผ่าได้ทั้งกอง
  - ประตูบานเดิมฝืดขึ้น {name}ต้องใช้ไหล่ดันแทนมือ
  - ปีนี้{name}ยกหม้อใบใหญ่ลงจากเตาด้วยสองมือ และต้องหยุดหายใจก่อนยก
  - ตะกร้าที่{name}เคยหิ้วมือเดียวกลับจากตลาด ปีนี้ต้องวางพักสองครั้งกว่าจะถึงบ้าน
  - ผ้าห่มผืนหนาที่{name}เคยสะบัดตากเอง ปีนี้ต้องมีคนจับอีกชาย
  - ปีนี้{name}ลุกจากเก้าอี้เตี้ยด้วยการยันโต๊ะ ปีก่อนยังลุกได้เฉยๆ

decline_DEX:
  - ปีนี้{name}สนเข็มไม่เข้าในครั้งแรก ครั้งที่สองก็ยังไม่เข้า
  - บันไดมีจำนวนขั้นเท่าเดิม แต่{name}เริ่มจับราวทุกครั้งที่ลง
  - ถ้วยหลุดมือ{name}แตกไปสองใบในปีเดียว
  - "{name}ก้มผูกเชือกรองเท้านานขึ้นกว่าปีก่อน และผูกได้แน่นน้อยลง"
  - กระดุมเม็ดบนสุดของ{name}ไม่ได้ติดมาทั้งหน้าหนาว นิ้วหารังดุมไม่เจอ
  - ปีนี้{name}หั่นผักช้าลง และชิ้นไม่เท่ากันเหมือนเคย
  - กุญแจบ้านดอกเดิม ปีนี้{name}ไขสามครั้งจึงเข้ารู
  - "{name}สะดุดธรณีประตูบ้านตัวเอง ธรณีที่ข้ามมาทั้งชีวิต"
  - ปีนี้{name}เทน้ำชาหกนอกถ้วยบ่อยจนต้องวางผ้าไว้ข้างกา

winter_fail:
  - หน้าหนาวปีนี้ไอของ{name}อยู่จนถึงวันที่น้ำแข็งละลาย แล้วก็ยังไม่ยอมไป
  - "{name}นอนซมไปครึ่งหน้าหนาว ลุกขึ้นมาได้ แต่เดินได้ไม่ไกลเท่าเดิมอีก"
  - หนาวปีนี้เอาแรงของ{name}ไปส่วนหนึ่ง ถึงใบไม้ผลิแล้วก็ไม่ได้เอามาคืน
  - ไข้หน้าหนาวหายไปแล้ว แต่ปีนี้{name}ต้องหยุดพักกลางบันไดเป็นปีแรก
  - หน้าหนาวนี้{name}ผอมลงจนต้องเจาะรูเข็มขัดเพิ่มอีกรู
  - หิมะละลายแล้ว แต่{name}ยังห่มผ้าสองผืนไปจนถึงกลางฤดูใบไม้ผลิ
  - ไข้หน้าหนาวปีนี้ทิ้งเสียงหวีดไว้ในอกของ{name} ได้ยินทุกครั้งที่ขึ้นเนิน
  - หน้าหนาวนี้{name}หลับไปสามวันติด ตื่นมาแล้วเสียงเบาลงกว่าเดิม
  - ผ่านหน้าหนาวมาแล้ว{name}กินได้แค่ครึ่งชาม และไม่ได้กลับไปกินเต็มชามอีก

news_death:
  - ปีนี้มีข่าวว่า{who}จากไปแล้ว
  - ข่าวของ{who}มาถึงช้าไปหลายเดือน {who}ไม่อยู่แล้วตั้งแต่ต้นปี

news_death_father:
  - "{who}จากไปตอนหลับ ในบ้านหลังเดิม แก่กว่าใครในถิ่น"

news_death_mother:
  - "{who}จากไปตอนหลับ ผ้าที่ซักไว้เมื่อวานยังตากอยู่บนราว"

news_death_spouse:
  - "{who}จากไปก่อน ที่นอนฝั่งนั้นยังยุบเป็นรอยเดิม"
  - "{who}จากไปในหน้าหนาว เช้าวันต่อมา{name}ยังตั้งชามบนโต๊ะสองใบ"

news_death_child:
  - "{who}จากไปก่อน{name} ชามของ{who}ยังอยู่บนชั้นที่เดิม ไม่มีใครย้าย"

news_death_sibling_older:
  - "{who}จากไปปีนี้ {name}เป็นคนสุดท้ายที่จำบ้านหลังนั้นตอนยังมีเด็กวิ่งได้"

news_death_sibling_younger:
  - "{who}จากไปปีนี้ ทั้งที่เกิดทีหลัง{name}"

news_death_kin:
  - "{who}จากไปปีนี้ บ้านของตระกูลเงียบลงอีกหลัง"

news_death_love:
  - ข่าวว่า{who}จากไปแล้ว {name}ไม่ได้บอกใครว่าเคยรู้จักกันแค่ไหน

news_death_friend:
  - "{who}จากไปตอนปลายปี คนที่มาบอกข่าวไม่รู้ว่าสองคนนี้เคยสนิทกันแค่ไหน"
  - ปีนี้{who}ไม่ได้มาหาเหมือนทุกปี มีแต่คนส่งข่าวมาแทน

news_death_rival:
  - ข่าวว่า{who}ตายแล้ว {name}ฟังจนจบ แล้วถามว่าฝังไว้ที่ไหน
  - "{who}จากไปปีนี้ เรื่องที่สองคนเถียงกันยังไม่จบ เหลือคนเถียงอยู่ฝ่ายเดียว"

news_death_mentor:
  - "{who}จากไปในหน้าหนาว ของที่{who}สอนไว้ยังอยู่ในมือของ{name}ทุกวัน"

# ---------- ราคาของวัสดุ (ชุด 2ข): ของที่สวมข้ามปี ----------
gear_star_first:
  - "เช้าวันหนึ่ง{name}เห็นจุดสว่างสามจุดบนผิวตรงที่เงินดาวแนบอยู่ ถูสบู่แล้วก็ยังอยู่"
  - "ปีนี้ผิวของ{name}ตรงที่เงินดาวแนบอยู่มีจุดเล็กๆ ที่เรืองแสงตอนดับตะเกียง"
  - "ช่างตัดเสื้อวัดตัว{name}แล้วชะงักที่ข้อมือ บนนั้นมีจุดสีเงินเรียงกันเหมือนกลุ่มดาว"

gear_star_deeper:
  - "รอยดาวบนตัว{name}ลามจากข้อมือขึ้นมาถึงศอก เสื้อแขนสั้นตัวเก่าใส่ออกนอกบ้านไม่ได้อีก"
  - "ปีนี้รอยดาวของ{name}เพิ่มขึ้นอีกหลายจุด เรียงเป็นรูปที่{name}เคยเห็นบนฟ้าคืนดาวหรี่"
  - "คืนเดือนดับ{name}อ่านหนังสือได้โดยไม่ต้องจุดตะเกียง แสงจากรอยบนแขนตัวเองสว่างพอ"

gear_coal_church:
  - "นักบวชตะเกียงที่เดินสวนกับ{name}หยุดมองของที่{name}พกอยู่นานกว่าปีก่อน แล้วจดอะไรบางอย่างลงสมุด"
  - "มีคนมากระซิบว่าชื่อของ{name}อยู่ในบัญชีของวิหารตะเกียง หน้าเดียวกับคนที่พกหินถ่านมาร"
  - "ปีนี้วิหารตะเกียงไม่รับเทียนที่{name}เอาไปถวาย คนเฝ้าประตูบอกแค่ว่ามือที่ถือมาไม่สะอาด"


# ---- องค์กร (ชุด 3) ----
# hunt_cold: ปีที่ภัยตามล่าจากฝ่ายหนึ่งลดลงหนึ่งขั้นเอง ไม่บอกว่าฝ่ายไหน เล่าแค่สิ่งที่หายไป
hunt_cold:
  - ปีนี้ไม่มีใครมาถามหา{name}ที่โรงเตี๊ยมอีก
  - คนแปลกหน้าที่เคยยืนอยู่ปากทางทุกเย็น ปีนี้ไม่มาแล้ว
  - ปีนี้{name}นั่งหันหลังให้ประตูได้เป็นครั้งแรกในรอบหลายปี
  - รอยชอล์กที่มีคนขีดไว้ข้างประตูของ{name}ซีดจนอ่านไม่ออก และไม่มีใครมาขีดซ้ำ
  - จดหมายไม่ลงชื่อที่เคยมาทุกฤดู ปีนี้ไม่มาสักฉบับ
  - หมาของเพื่อนบ้านเลิกเห่าตอนดึก คนที่เคยทำให้หมาเห่าคงไปยืนเฝ้าประตูบ้านอื่นแล้ว

# bounty: โรงรับเขี้ยวจ่ายค่าหลักฐานการล่าให้สมาชิกที่ชนะสิ่งที่ไม่ใช่คน {foe} คือชื่อศัตรูในฉากนั้น จำนวนเหรียญขึ้นเป็นป้ายเอง
bounty:
  - "{name}วางสิ่งที่เหลือจาก{foe}ลงบนโต๊ะชั่งของโรงรับเขี้ยว เสมียนจดลงสมุดก่อน แล้วจึงนับเหรียญ"
  - เสมียนโรงรับเขี้ยวพลิกดูหลักฐานของ{foe}สองรอบ แล้วเลื่อนเหรียญข้ามโต๊ะมาโดยไม่ถามว่าได้มาอย่างไร
  - โรงรับเขี้ยวจ่ายค่า{foe}ตามราคาบนกระดาน ไม่ต่อ ไม่แถม เสมียนขีดลงใต้ชื่อของ{name}ในสมุดอีกหนึ่งขีด
  - คนชั่งของโรงรับเขี้ยวรับห่อผ้าที่มีหลักฐานของ{foe}ไปหลังร้าน แล้วกลับมาพร้อมเหรียญกับผ้าเปล่า
  - ที่โต๊ะชั่งของโรงรับเขี้ยว หลักฐานของ{foe}ได้ราคาเท่าที่กระดานเขียนไว้ เสมียนนับเหรียญดังพอให้คนทั้งแถวได้ยิน
