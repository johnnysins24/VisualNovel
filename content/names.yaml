# กลุ่มชื่อสำหรับตัวละครและพ่อแม่ ตามหลักตั้งชื่อในคัมภีร์โลก (content/lore/world-bible.md หัวข้อ "หลักตั้งชื่อ")
# race: คือ id กลุ่ม ฉากเกิดเลือกกลุ่มด้วย name_pool ถ้าไม่เลือกจะใช้กลุ่มตามเผ่า
# ชื่อของตัวละครในฉากตั้งต้น (เวสลิน ทอเบล คอเดีย มาริส ฮัลเดรก เคเซธ) ไม่อยู่ในกลุ่ม เก็บไว้ให้ชีวิตของเวสลินคนเดียว

# มนุษย์ชาวบ้าน: ไม่มีนามสกุล เรียกกันว่าลูกของใคร
- race: human
  male: &human_m [เดรัน, ฮาริค, ทาดิค, ฮอสเตน, เบรนิค, ฟาเรน, ยอเรน, บาร์นิค, ลอเดน, กอสเตน, มาร์เคล, วาเดน]
  female: &human_f [โซเลน, แมเรน, นอริส, เคเลีย, ลอเรส, มิเรล, อิเดน, โรวีน, ทามิน, เฮลิน, ดอร์คา, เวเนีย]

# มนุษย์ในเมือง: ชื่อชุดเดียวกับชาวบ้าน แต่มีนามสกุล
- race: human_city
  male: *human_m
  female: *human_f
  surname: [โดรมัน, คาสเทน, เบรม, ลินดอส, ทาร์นิส, เรนนิค, ฮาเดน, มอร์ลิส]

# ขุนนางเก่าของอาร์เวล
- race: human_noble
  male: [ออเรวิน, ฮาโลเรน, เอดมารัน, ฟิเลเดน, ลีโอรัส, มาร์เซวาล]
  female: [เอลีนาส, อิสเมเรีย, มิราเดล, เซรานิส, ลีเวียนา, ไลเซนดรา]
  surname: [วาลเดรน, เอสคาริส, ไซรันเดล, เมรันดิส, ไฮมอร์ด, คาสโตรัน]

# เอลฟ์: ชื่อแรกในชีวิต ชื่อเต็มคือทุกชื่อที่ใช้มาต่อกัน
- race: elf
  male: [ไลเธน, ซูลวิน, ธาเวน, ลีธาร์, วาเรล, นอร์วิน, ฮิลราน, โอเลวิน, เธลวิน, ราเวียน]
  female: [เอเรีย, นีเลีย, อิธาเรล, ลิวเรีย, ธีลา, เมรีธ, วีเรล, เอลเวีย, อูเรีย, ไซเลีย]

# คนแคระ: ชื่อตัวตามด้วยชื่อตระกูลแปลเป็นไทย
- race: dwarf
  male: [ดูร์กัน, บาร์ดุก, กอร์ดัก, บรุนดอก, ฮาร์กุด, บอร์กัน, ราดุก, ทูร์เบก, ดอร์เมก, เบรอดุก]
  female: [ทอร์มา, บรูนา, กาเดีย, เบอร์กา, รุนดา, กุนเดรา, มัลกา, ดรุนกา, ฮาร์ดา, บาดรา]
  surname: [ตระกูลเตาแปด, ตระกูลโซ่เจ็ด, ตระกูลประตูเหล็ก, ตระกูลขวานหัก, ตระกูลเฟืองสาม, ตระกูลปล่องแดง, ตระกูลหินเก้าชั้น]

# ทีฟลิ่งแดนเถ้า: พ่อแม่ตั้งชื่อด้วยเสียงที่ได้ยินในฝัน (พ่อแม่เองใช้กลุ่ม human)
- race: tiefling_dream
  male: [ซาร์วิน, ธาซูร์, ราเซค, ซูเรธ, คาร์โมธ, เวซาร์, อิซรัก, โธรัซ]
  female: [เซริธ, ซาร์เวีย, อีธรา, เวซริน, ธีเซรา, วาซีธ, เคธรา, ซีรัธ]

# เด็กที่วิหารอีเซลเก็บมาเลี้ยง: ได้ชื่อจากฟ้าเช้าวันที่พบตัว ไม่มีพ่อแม่ที่รู้จัก
- race: temple_foundling
  male: [ระฆังสาม, ลมเหนือ, ฟ้าลั่น, หมอกบาง, ระฆังหนึ่ง, เดือนดับ, ฝนแล้ง, ลมหนาว]
  female: [ฝนเช้า, ฟ้าสาง, แดดอ่อน, หมอกเช้า, ระฆังเย็น, ใบไม้ร่วง, ฟ้าครึ้ม, ฝนปลายปี]
