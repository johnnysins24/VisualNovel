# ของใช้แล้วหมด (ชุด 2ข): ไม่มีช่องสวม พกได้ชนิดละ 3 ชิ้น ซื้อได้ที่ร้านหรือได้จากศัตรู
# ป้าย (tags) คือสิ่งที่มันทำกับศัตรูในการปะทะ: ตรงจุดอ่อนได้แต้มจุดอ่อนเต็มและทำให้รู้จุดอ่อน ชนจุดแข็งไม่ได้อะไร นอกนั้นได้ +1
# use.heal ใช้นอกการปะทะได้ · use.boost ให้แต้มกับวิธีรับมือชนิดที่ระบุ · ไอคอนมาจากชุดภาพฟรี (art/adopted.yaml)

- id: boiled_bandage
  name: ผ้าพันแผลต้มน้ำเกลือ
  tags: [medicine]
  price: 1
  lore: ผ้าปูที่นอนเก่าฉีกเป็นริ้ว ต้มในหม้อเดียวกับที่ใช้ต้มผ้าอ้อม หมอตำแยของอีเซลสอนทำแบบนี้มาสามชั่วคน
  use:
    heal: 2
    text: "{name}พันผ้าทับแผลสองรอบแล้วกัดปลายผ้าผูกปม"

- id: temple_salve
  name: ขี้ผึ้งชามไฟของวิหารอีเซล
  tags: [medicine]
  price: 3
  lore: แม่ชีกวนขี้ผึ้งกับน้ำมันจากชามไฟหน้าแท่น ตลับหนึ่งใช้ได้ครั้งเดียวเพราะต้องทาหนา
  use:
    heal: 4
    text: "{name}ควักขี้ผึ้งทั้งตลับโปะลงบนแผล ความร้อนของมันไล่ความชาออกไป"

- id: moss_poultice
  name: ยาพอกตะไคร่เปลือกไอเลธ
  tags: [medicine]
  price: 2
  lore: เอลฟ์ขูดตะไคร่จากด้านเหนือของต้นไม้เท่านั้น ด้านใต้เก็บไว้ให้ต้นไม้ใช้เอง
  use:
    heal: 3
    text: "{name}บีบน้ำออกจากก้อนตะไคร่แล้วกดลงบนแผล เลือดหยุดก่อนนับถึงสิบ"

- id: pine_torch
  name: คบไฟชุบยางสน
  tags: [fire, light]
  price: 1
  lore: ไม้สนพันผ้ากระสอบชุบยาง จุดติดแม้ฝนปรอย และไหม้ได้นานพอเดินข้ามทุ่งหนึ่งแปลง
  use:
    text: "{name}จุดคบแล้วเหวี่ยงเป็นวงตรงหน้า"

- id: lamp_oil_flask
  name: ขวดน้ำมันตะเกียงอุดจุกผ้า
  tags: [fire]
  price: 2
  lore: คนท่าเรือเวนทราสพกติดตัวไว้เติมตะเกียง ยามท่าเรือรู้ดีว่ามันใช้ทำอย่างอื่นได้ด้วย จึงค้นตัวทุกคนที่ขึ้นเรือเหาะ
  use:
    text: "{name}จุดจุกผ้าแล้วขว้างขวดออกไป แก้วแตกพร้อมกับไฟลุก"

- id: water_skin
  name: ถุงหนังแพะใส่น้ำ
  tags: [water]
  price: 1
  lore: คนขุดถ่านในแดนเถ้าไม่ลงเหมืองถ้าไม่มีถุงน้ำห้อยเอว ครึ่งหนึ่งไว้ดื่ม อีกครึ่งไว้สาด
  use:
    text: "{name}ดึงจุกแล้วสาดน้ำทั้งถุงออกไปข้างหน้า"

- id: smoke_pot
  name: หม้อดินอัดใบไม้ชื้น
  tags: [smoke]
  price: 2
  lore: คนเลี้ยงผึ้งใช้ไล่ผึ้งออกจากรัง คนขนของเถื่อนใช้ไล่ยามออกจากทาง
  use:
    boost: { kinds: [flee], amount: 2 }
    text: "{name}จุดไส้หม้อแล้วกลิ้งไปข้างหน้า ควันขาวข้นพุ่งออกจากรูทั้งหกรู"

- id: feast_crackers
  name: ประทัดห่อกระดาษแดงวันไหว้เสา
  tags: [noise]
  price: 1
  lore: เด็กทั้งอาร์เวลจุดกันในวันไหว้เสาฟ้า ผู้ใหญ่ซื้อเก็บไว้ด้วยเหตุผลที่ไม่บอกเด็ก
  use:
    text: "{name}จุดชนวนแล้วโยน เสียงแตกรัวดังติดกันสิบกว่านัด"

- id: salt_meat
  name: เนื้อเค็มแขวนเชือก
  tags: [bait]
  price: 1
  lore: เนื้อสันคอหมักเกลือตากลมสามวัน เหนียวจนคนเคี้ยวไม่ไหว สัตว์ไม่ถือเรื่องนั้น
  use:
    text: "{name}เหวี่ยงก้อนเนื้อไปทางหนึ่ง แล้วตัวเองขยับไปอีกทาง"

- id: flash_powder
  name: ผงวาบของคนส่งสัญญาณหอท่า
  tags: [light]
  price: 2
  lore: คนส่งสัญญาณบนหอท่าจุดผงนี้บนถาดสังกะสีให้เรือเหาะที่หลงหมอกเห็นทาง ใครยืนใกล้ถาดตาพร่าไปพักใหญ่
  use:
    text: "{name}สาดผงใส่เปลวไฟ แสงขาวสว่างวาบจนเงาทุกเงาหายไปชั่วอึดใจ"

- id: whetstone
  name: หินลับมีดจากท้องน้ำ
  price: 1
  lore: หินเนื้อละเอียดสีเทาจากแม่น้ำใต้เวนทราส คนตีเหล็กบอกว่าหินที่ดีต้องลื่นมือเหมือนสบู่
  use:
    boost: { kinds: [attack], amount: 1 }
    text: "{name}รูดคมกับหินสามทีก่อนก้าวเข้าไป"

- id: hemp_rope
  name: เชือกปอฟั่นสามเกลียวยาวสามวา
  tags: [rope]
  price: 1
  lore: คนมุงหลังคาผูกเอวด้วยเชือกแบบนี้ ถ้าขาดก็ขาดทีละเกลียว มีเวลาให้ร้องเรียกคนข้างล่าง
  use:
    boost: { kinds: [flee], amount: 1 }
    text: "{name}เหวี่ยงเชือกคล้องสิ่งที่อยู่สูงกว่าหัวแล้วโหนตัวออกไป"

- id: death_roll
  name: บัญชีชื่อคนตายของสัปเหร่อป้อมสาม
  tags: [name]
  price: 2
  lore: สัปเหร่อจดชื่อทุกคนที่ฝังรอบป้อม คัดลอกขายแผ่นละสองเหรียญให้คนที่ต้องเดินผ่านสุสานตอนกลางคืน
  use:
    text: "{name}คลี่กระดาษแล้วอ่านชื่อออกมาทีละชื่อ เสียงดังพอให้สิ่งที่อยู่ตรงหน้าได้ยิน"

- id: calming_snuff
  name: ยานัตถุ์แก้ใจสั่นของคนเดินสาร
  price: 2
  lore: คนเดินสารของราชสำนักสูดก่อนเข้าเฝ้า กลิ่นการบูรแรงจนคนที่ยืนใกล้พลอยใจเย็นไปด้วย
  use:
    boost: { kinds: [talk], amount: 2 }
    text: "{name}สูดยานัตถุ์เข้าไปเฮือกหนึ่ง เสียงที่พูดออกมาหลังจากนั้นนิ่งกว่าเดิม"

- id: ward_salt
  name: เกลือหยาบโรยธรณี
  price: 1
  lore: แม่บ้านโรยเกลือหน้าประตูทุกคืนเดือนดับ ไม่มีใครพิสูจน์ได้ว่ามันกันอะไร และไม่มีบ้านไหนกล้าเลิกโรย
  use:
    boost: { kinds: [guard], amount: 2 }
    text: "{name}โรยเกลือเป็นเส้นโค้งรอบเท้าแล้วยืนอยู่ข้างใน"

# ---------- ของใช้แล้วหมดชุดสอง ----------
- id: dock_darts
  name: ลูกดอกเหล็กหางขนไก่จากวงเหล้าท่าเรือ
  tags: [pierce, ranged]
  price: 1
  lore: คนเรือปาเล่นกันในร้านเหล้าหลังเลิกกะ เดิมพันด้วยค่าแรงทั้งวัน ลูกที่คมที่สุดเป็นของคนที่แพ้บ่อยที่สุด
  use:
    text: "{name}ปาลูกดอกออกไปสามลูกติดกัน"

- id: sling_stones
  name: กรวดแม่น้ำหนึ่งถุงกับสายหนังเหวี่ยง
  tags: [blunt, ranged]
  price: 1
  lore: เด็กเลี้ยงแกะคัดกรวดกลมเท่าไข่นกพิราบจากท้องน้ำ ถุงหนึ่งมียี่สิบก้อน หมาป่าที่เคยโดนสักก้อนจำเสียงสายหนังได้
  use:
    text: "{name}เหวี่ยงสายหนังสองรอบแล้วปล่อยกรวดออกไป"

- id: iron_caltrops
  name: ขวากเหล็กสี่แฉกของยามเหมือง
  tags: [pierce]
  price: 2
  lore: โยนลงพื้นแบบไหนก็มีแฉกหนึ่งชี้ขึ้นเสมอ ยามเหมืองโปรยไว้หน้าคลังถ่านตอนกลางคืน แล้วต้องเก็บเองทุกเช้า
  use:
    boost: { kinds: [flee], amount: 1 }
    text: "{name}โปรยขวากเหล็กลงบนพื้นระหว่างตัวเองกับสิ่งที่ตามมา"

- id: jaw_trap
  name: กับดักเหล็กปากหยักของคนเลี้ยงแกะ
  price: 3
  lore: คนเลี้ยงแกะวางไว้รอบคอกในเดือนที่หมาป่าลงจากเขา สปริงแข็งจนต้องใช้เข่ากดตอนง้าง คนที่ง้างพลาดเหลือนิ้วไม่ครบ
  use:
    boost: { kinds: [guard, quick], amount: 2 }
    text: "{name}ง้างกับดักวางลงตรงหน้า แล้วถอยหลังไปหนึ่งก้าว"

- id: silver_grass_tea
  name: ชาหญ้าเงินต้มข้น
  price: 1
  lore: หญ้าเงินของแดนเถ้ากินได้แต่ขม ผู้เฝ้าผนึกต้มดื่มก่อนเข้าเวรดึก รสขมค้างคอไปถึงเช้า และตาก็ค้างไปถึงเช้าเหมือนกัน
  use:
    boost: { kinds: [read], amount: 2 }
    text: "{name}กระดกชาหญ้าเงินรวดเดียว ความขมทำให้ทุกอย่างตรงหน้าชัดขึ้น"

- id: dwarf_fire_spirit
  name: เหล้าไฟคนแคระขวดแบน
  price: 2
  lore: กลั่นจากมันหัวที่ปลูกในอุโมงค์ร้าง คนแคระดื่มก่อนลงเหมืองหนึ่งอึก ขึ้นจากเหมืองอีกหนึ่งอึก มนุษย์ที่ดื่มเท่ากันมักไม่ได้ลงเหมือง
  use:
    heal: 1
    boost: { kinds: [attack, guard], amount: 1 }
    text: "{name}กระดกเหล้าไฟหนึ่งอึก ความร้อนไหลจากคอลงไปถึงกำปั้น"

- id: honey_bread
  name: ขนมปังน้ำผึ้งจากแผงหน้าโบสถ์
  tags: [bait]
  price: 1
  lore: อบทุกเช้าวันตลาด น้ำผึ้งมาจากรังที่วิหารอีเซลเลี้ยงไว้หลังโบสถ์ หมีในป่าข้างหมู่บ้านรู้จักกลิ่นนี้ดีพอกับเด็ก
  use:
    heal: 1
    text: "{name}หักขนมปังครึ่งหนึ่งโยนออกไป อีกครึ่งยัดใส่ปากตัวเอง"

- id: lamp_blessed_water
  name: น้ำอวยพรจากวิหารตะเกียงในขวดแก้วฟ้า
  tags: [water, light]
  price: 3
  lore: นักบวชเวรัสตักน้ำจากอ่างใต้ตะเกียงแขวนดวงใหญ่ของวิหาร แล้วขายขวดละสามเหรียญ รายได้ส่วนนี้ไม่อยู่ในบัญชีที่ส่งให้ราชสำนัก
  use:
    text: "{name}ดึงจุกแล้วสาดน้ำเป็นแนวโค้ง หยดน้ำสว่างวาบทีละหยดก่อนตกถึงพื้น"

- id: roast_coffee
  name: กาแฟคั่วบดหยาบห่อกระดาษ
  price: 2
  lore: ร้านกาแฟหลังสถาบันเวทขายให้นักเรียนที่ต้องอ่านหนังสือข้ามคืน วงอ่านหนังสือบางวงสั่งทีละสิบห่อ และไม่เคยบอกว่าอ่านอะไร
  use:
    boost: { kinds: [quick, read], amount: 1 }
    text: "{name}เทผงกาแฟใส่ปากแล้วเคี้ยว รสขมไล่ความมึนออกจากหัว"

- id: ossa_name_candle
  name: เทียนเรียกชื่อของสัปเหร่อออสซา
  tags: [name, light]
  price: 2
  lore: สัปเหร่อขูดชื่อคนตายลงบนเทียนก่อนจุดหน้าช่องศพ เทียนที่ยังไม่ได้ขูดชื่อขายให้คนเดินทาง เผื่อต้องตั้งชื่อให้สิ่งที่ลืมชื่อตัวเองไปแล้ว
  use:
    text: "{name}จุดเทียนแล้วเอ่ยชื่อหนึ่งออกมาดังๆ เปลวไฟนิ่งสนิทเหมือนกำลังฟัง"

- id: bone_broth
  name: น้ำต้มกระดูกแพะภูเขาในหม้อดิน
  tags: [medicine]
  price: 2
  lore: เคี่ยวข้างเตาหลอมสามวันจนกระดูกเปื่อย ปิดหน้าหม้อด้วยไขแข็งกันบูด แม่ครัวโรงเหมืองตักให้คนที่ขึ้นจากชั้นลึกก่อนคนอื่น
  use:
    heal: 3
    text: "{name}เจาะไขที่ปิดหน้าหม้อแล้วซดน้ำต้มกระดูกจนหมด ความอุ่นแผ่ไปถึงปลายนิ้ว"

- id: apple_liquor
  name: เหล้าแอปเปิลหมักถังไม้ของบ้านโรงสีล่าง
  price: 2
  lore: บ้านโรงสีล่างหมักปีละสิบสองถัง ขวดที่วางขายในตลาดมาจากถังที่สิบสอง อีกสิบเอ็ดถังหายไประหว่างงานเกี่ยวข้าว
  use:
    boost: { kinds: [talk], amount: 2 }
    text: "{name}ยื่นขวดเหล้าแอปเปิลออกไปก่อนจะเอ่ยคำแรก"

- id: signal_flare
  name: พลุสัญญาณขอทางของเรือเหาะ
  tags: [light, noise, fire]
  price: 3
  lore: เรือเหาะที่ถุงน้ำค้างรั่วยิงพลุแดงขอลงจอดก่อนลำอื่น ยามท่านับพลุทุกลูกที่เบิกออกจากคลัง ลูกที่ขายอยู่ตามแผงจึงไม่มีใครถามที่มา
  use:
    text: "{name}กระตุกเชือกชนวน ลูกไฟสีแดงพุ่งออกไปพร้อมเสียงหวีดแหลม"

- id: coal_ember
  name: ถ่านมารก้อนเท่ากำปั้นห่อผ้าเปียก
  tags: [fire]
  price: 2
  lore: คนขุดถ่านแอบเก็บก้อนที่ร่วงจากรถเข็น ห่อผ้าชุบน้ำไว้กันกระเป๋าไหม้ แกะผ้าออกเมื่อไร ก้อนถ่านก็แดงขึ้นเมื่อนั้น
  use:
    text: "{name}แกะผ้าออกแล้วขว้างก้อนถ่านที่กำลังแดงออกไป"
