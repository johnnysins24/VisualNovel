# ของร้านและของช่าง (ชุด 2ข): ซื้อได้ที่ร้านของแต่ละถิ่น (content/shops.yaml) บางชิ้นได้จากศัตรู (content/foes.yaml loot)
# ของหนึ่งชิ้น = แบบ (pattern ใน art/gear.yaml กำหนดช่องสวมและไอคอน) x วัสดุ x ระดับ ชื่อและเรื่องเขียนด้วยมือทุกชิ้น
# งบของระดับ: ของบ้าน 0 ถึง 1 · ของช่าง 1 ถึง 2 · ของชั้นครู 2 ถึง 3 · ของอาบเวท 3 ถึง 4 (ดู GEAR ใน src/engine/balance.ts)
# ป้ายของอาวุธ (edge pierce blunt ranged noise) กับของมือรอง (light fire noise) ใช้เทียบกับจุดอ่อนของศัตรูในการปะทะ

