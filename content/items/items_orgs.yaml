- id: fang_brass_tag
  name: ป้ายทองเหลืองตอกเลขของโรงรับเขี้ยว
  slot: accessory
  pattern: amulet
  material: brass
  rarity: uncommon
  stats: { WIS: 1 }
  lore: ป้ายกลมขนาดเหรียญที่ออร์ริสตอกเลขเองทีละตัวด้วยค้อนหัวเล็ก เลขที่ได้เคยเป็นของนักล่าที่ตายไปแล้ว ด้านหลังยังมีรอยขีดนับของเจ้าของเก่าที่ขัดไม่ออก คนในเหมืองเห็นป้ายนี้แขวนเข็มขัดแล้วจะหลีกทางให้ครึ่งก้าว

- id: fang_black_iron_tag
  name: ป้ายเหล็กดำไม่มีเลขของโรงรับเขี้ยว
  slot: accessory
  pattern: amulet
  material: black_iron
  rarity: uncommon
  stats: { DEX: 1 }
  lore: ป้ายเหล็กดำผิวด้าน ไม่มีเลข ไม่มีชื่อ มีแค่รอยตะไบเป็นเส้นขวางเส้นเดียวตรงขอบ คนที่ถือป้ายนี้เข้าห้องหลังโรงได้โดยไม่ต้องเคาะ
  passive:
    description: พลังชีวิตสูงสุด +2
    effect: { kind: max_hp, amount: 2 }

