  rarity: rare
  tags: [light]
  stats: { WIS: 1, CON: 1 }
  lore: เหล็กรมดำจนไม่สะท้อนแสงอะไร ไส้ชุบผงที่ทั้งอาณาจักรห้ามพก จุดแล้วได้แสงแดงคล้ำที่ทำให้ทุกอย่างในห้องดูเก่าลง ทั้งอาณาจักรมีสี่สิบเก้าดวง แต่ละดวงมีหน้ากระดาษของตัวเองในสมุดปกเหล็กที่ล่ามโซ่ไว้กับโต๊ะ ชื่อคนถือเรียงลงมาทีละบรรทัด ลายมือไม่ซ้ำกันสักบรรทัด

- id: ashcult_coal_tin
