# ของจากองค์กร (ชุด 3 ไฟล์ 88_org_*) ได้จาก effects.items ในฉากขึ้นยศ ซื้อขายไม่ได้ ไอคอนมาจากแบบกับวัสดุ

- id: wardens_fort_key
  name: กุญแจเหล็กดำด้ามเว้าของอูเลส
  slot: accessory
  pattern: amulet
  material: black_iron
  rarity: uncommon
  stats: { CON: 1 }
  lore: กุญแจป้อมสามที่คนเลี้ยงล่อทีฟลิ่งห้อยคอไว้ใต้เสื้อจนวันตาย ร้อยเชือกหนังที่ต่อด้วยเงื่อนตายเจ็ดเงื่อน ด้ามสึกเป็นรอยเว้าตรงกลาง เว้าแบบที่ไม่ได้เกิดจากการไขประตู
