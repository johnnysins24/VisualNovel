# ของจากวิทยานิพนธ์ปีห้าของสถาบันเวทหลวง (ชุด ม) สำนักละหนึ่งชิ้น ได้จาก effects.items ในเรื่องปีห้าของสำนักนั้น
# (66_institute_schools_a.yaml กับ 66_institute_schools_b.yaml) ซื้อขายไม่ได้ ของอาบเวท งบ 3 ทุกชิ้น ช่องไม่ซ้ำกัน
# เรื่องฝีมือของแต่ละสำนัก (adult.school_<สำนัก>_craft) มีตัวเลือกหนึ่งข้อที่ต้องมีชิ้นของสำนักนั้น

- id: still_keeper_gauntlet
  name: ปลอกมือทองเหลืองของคนเฝ้าหม้อ
  slot: hands
  pattern: gauntlets
  material: brass
  rarity: enchanted
  stats: { CON: 1, INT: 1 }
  lore: ปลอกมือข้างซ้ายข้างเดียว ข้อนิ้วเป็นเกล็ดทองเหลืองบางเท่าเล็บซ้อนกันสิบสี่แผ่น ซับในหนังแกะดูดความเย็นจากโหลไปเก็บไว้ในตัวเอง สมุดวิทยานิพนธ์ของสำนักกลั่นจดชื่อคนทำไว้ข้างเลขของชิ้นนี้ ด้วยหมึกขวดเดียวกับลายเซ็นของอาจารย์ที่รับงาน
  caveat: ถอดออกทีไรนิ้วทั้งห้าชาไปถึงข้อศอกครึ่งวัน และใครจับมือข้างนั้นก็ชักมือหนีทุกคน
  passive:
    description: พลังชีวิตสูงสุด +2
    effect: { kind: max_hp, amount: 2 }

- id: arm_fitter_spanner
  name: ประแจเหล็กดำเจ็ดปากของคนต่อแขน
  slot: offhand
  pattern: wrench
  material: black_iron
  rarity: enchanted
  tags: [tool]
  stats: { DEX: 1, INT: 1 }
  lore: ด้ามเดียวมีปากเจ็ดขนาด หมุนเลือกปากได้ด้วยนิ้วโป้ง คลายข้อต่อแขนกลได้ทั้งงานของคนแคระและงานของสถาบันโดยไม่ทิ้งรอยบนหัวหมุด ทะเบียนของสถาบันเขียนชื่อคนออกแบบไว้ใต้ภาพลอกของประแจหนึ่งบรรทัด ตัวเล็กกว่าชื่อสำนัก
  caveat: ช่างคนแคระที่เห็นปากประแจนี้รู้ทันทีว่าแบบมาจากหินของตระกูลไหน และไม่ยอมให้คนถือแตะแขนของตัวเองอีก
  passive:
    description: ทอยว่องไวได้ +1 ในทุกเหตุการณ์
    effect: { kind: check_bonus, stat: DEX, amount: 1 }

- id: dead_script_glasses
  name: แว่นทองเหลืองสองชั้นสำหรับอ่านอักษรตาย
  slot: head
  pattern: goggles
  material: brass
  rarity: enchanted
  stats: { INT: 1 }
  lore: เลนส์ชั้นนอกใสธรรมดา ชั้นในฝนจากแก้วรมควันจนมองเห็นหมึกแรกที่มีคนขูดออกจากหนังสัตว์ ชัดกว่าหมึกที่เขียนทับลงไปทีหลัง ห้องตำราของสถาบันเก็บแบบฝนเลนส์ไว้ในแฟ้มที่หน้าปกเขียนชื่อคนฝนด้วยลายมือของเจ้าตัว
  caveat: ใส่อ่านเกินหนึ่งเล่มเทียนแล้วตามองเห็นทุกอย่างซ้อนกันสองชั้นไปจนเช้า รวมทั้งหน้าคน
  passive:
    description: ทอยพลาดได้ทอยใหม่หนึ่งครั้งต่อเหตุการณ์
    effect: { kind: reroll_failed_check }

- id: sky_count_staff
  name: ไม้เท้าไม้ไอเลธหัวกรอบนับฟ้า
  slot: weapon
  pattern: staff
  material: ileth_wood
  rarity: enchanted
  tags: [blunt]
  stats: { WIS: 2 }
  lore: ด้ามไม้ไอเลธเบาจนถือส่องฟ้าได้ทั้งคืน หัวเป็นกรอบสี่เหลี่ยมขึงลวดเส้นเท่าเส้นผมแบ่งฟ้าเป็นสี่สิบเก้าช่อง ดาวที่ตกบนเส้นลวดมีที่นับของตัวเอง ไม่หล่นหายไปจากช่องไหน สมุดของสำนักดาราศาสตร์จดชื่อคนขึงลวดไว้หน้าเดียวกับจำนวนช่อง
  caveat: คืนฟ้าเปิดลวดเส้นที่เจ็ดสั่นเองโดยไม่มีลม และคนถือนอนไม่หลับจนกว่าจะนับช่องนั้นจบ
  passive:
    description: ทอยปัญญาได้ +1 ในทุกเหตุการณ์
    effect: { kind: check_bonus, stat: INT, amount: 1 }

- id: bedside_dew_lamp
  name: ตะเกียงน้ำค้างดาวห้อยคอโครงทองเหลือง
  slot: accessory
  pattern: amulet
  material: brass
  rarity: enchanted
  tags: [light]
  stats: { CHA: 1 }
  lore: ตะเกียงเท่าลูกพลับห้อยสายไว้กลางอก มือทั้งสองข้างจึงว่างจับคนไข้ แสงของตะเกียงทำให้จุดแก้วที่ยังเล็กกว่าเล็บเรืองขึ้นมาก่อนเจ้าของผิวจะรู้ตัว ทะเบียนของสำนักรักษาลงชื่อคนทำไว้ใต้คำว่าห้ามขาย สองคำนั้นอาจารย์ที่ปรึกษาเขียนกำกับไว้เอง
  caveat: แสงกินน้ำค้างดาวหมดหลอดทุกสามคืน และคนที่เห็นจุดแก้วของตัวเองเรืองใต้แสงนี้ไม่เคยขอบคุณคนถือ
  passive:
    description: พลังชีวิตสูงสุด +2
    effect: { kind: max_hp, amount: 2 }
  also:
    description: แต้มกันหนาว +1 ตอนเช็คฤดูหนาว
    effect: { kind: winter, amount: 1 }

- id: field_signal_cloak
  name: ผ้าคลุมสัญญาณถ่วงชายด้วยตุ้มเหล็กดำ
  slot: cloak
  pattern: cloak
  material: black_iron
  rarity: enchanted
  stats: { STR: 1, CHA: 1 }
  lore: ด้านนอกสีหม่นเหมือนผ้าคลุมเดินทางทุกผืน ซับในเป็นผ้าแดงสลับขาว ชายผ้าถ่วงตุ้มเหล็กดำสิบสองลูก สะบัดทีเดียวผ้าก็กางเป็นธงเต็มผืนให้คนอีกฝั่งลานเห็น ทะเบียนของสำนักสงครามจดชื่อคนเย็บไว้ในช่องผู้คิดแบบ ไม่ใช่ช่องผู้ใช้
  caveat: กางทีหนึ่งทุกคนในระยะสายตารู้ว่าคนถือยืนอยู่ตรงไหน คนอีกฝ่ายก็รู้ด้วย
  passive:
    description: กันการเสียพลังชีวิตได้หนึ่งครั้งต่อการปะทะ
    effect: { kind: shield }
