# ทะเบียนสิ่งติดตัว 60 อย่าง (ชุดแรก): ผล ราคา เงื่อนไข และทางแก้ของแต่ละอย่าง
# รหัสและชื่อต้องตรงกับ art/traits.yaml (ไอคอน public/icons/trait_<id>.png) ที่มาอยู่ในคัมภีร์โลกหัวข้อ "สิ่งติดตัวชุดแรก"
# กติกาของโลก: พรทุกอย่างมีเงื่อนไข (costs หรือ breaks) คำสาปทุกอย่างมีของแถม (gives) ทางแก้อย่างน้อยสองทาง (cures)
# และทางอยู่กับมัน (live_with) ตัวตรวจเนื้อหาบังคับทั้งหมดนี้
#
# effects คือผลที่ระบบคิดให้เอง (ดู TraitEffectSchema ใน src/engine/schema.ts)
#   check_bonus  บวกลบแต้มทอย เจาะจง stats, foes (demon star machine nature human) หรือ locations ได้
#   max_hp       พลังชีวิตสูงสุด      regen   พลังชีวิตที่ฟื้นต่อปี      winter  แต้มเช็คฤดูหนาว
#   ageless      ไม่แก่               cheat_death  รอดตายหนึ่งครั้งแล้วของชิ้นนี้หมด
# บรรทัดใน gives กับ costs ที่ระบบไม่ได้คิดให้ คือสิ่งที่เหตุการณ์ต้องเคารพเอง (เปิดหรือปิดตัวเลือกด้วย requires.trait, not_traits)
# big: true = พรหรือคำสาปใหญ่ ชีวิตหนึ่งถือได้ไม่เกิน 2 เหตุการณ์ที่ให้ต้องมี big_room: true
# habit: true = ลักษณะที่ก่อตัวเมื่อเลือกทางที่ติดป้าย habit: <id> ครบ 3 ครั้ง และเลือกไม่น้อยกว่าครึ่งของครั้งที่ทางนั้นมีให้เลือก ชีวิตหนึ่งมีได้ไม่เกิน 3
# blocks: [<id นิสัย>] = คนที่ถือสิ่งนี้เลือกทางที่ติดป้ายนิสัยนั้นไม่ได้อีก (หน้าจอโชว์เป็นตัวเลือกล็อกพร้อมชื่อสิ่งติดตัว) ต้องเขียนราคานี้ใน costs

