# ---------- คำสาป 15 อย่าง ----------

- id: curse_closed_door
  name: ประตูปิด
  kind: curse
  big: true
  source: ออสซา
  how: โกงความตายสองครั้ง ออสซาจึงปิดประตูใส่ คนนอกเรียกมันว่าคำสาปแห่งความอมตะ
  gives:
    - ไม่แก่ ร่างกายไม่โรย และไม่ต้องผ่านฤดูหนาว
  costs:
    - แผลไม่หายเอง
    - คนรอบตัวแก่และจากไปก่อนเสมอ
  cures:
    - ไปยืนหน้าวิหารออสซาในวันที่คนที่รักที่สุดตาย แล้วขอตามเข้าไป
    - ส่งคนตายอย่างถูกต้องครบร้อยคน ออสซาจะเปิดประตูให้อีกครั้ง
  live_with: อยู่ต่อไปเป็นพยานของบ้าน ดูแลหลุมของทุกคนที่ไปก่อน
  effects:
    - { kind: ageless }
    - { kind: regen, amount: -3 }

- id: curse_bone_cold
  name: หนาวเข้ากระดูก
  kind: curse
  source: เบเลค
  how: ผิดสัญญาที่ลงชื่อต่อหน้าเบเลค
  gives:
    - ไม่มีใครโกหกต่อหน้าได้เต็มปาก +1 เมื่อเผชิญคน
  costs:
    - ผ่านฤดูหนาวยากขึ้น −2
    - แผลหายช้าลงปีละ 1
  cures:
