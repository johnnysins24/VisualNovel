name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run validate
      - run: npm run content
      - run: npm run typecheck
      - run: npm test
      # --with-deps ลงฟอนต์สำรองผ่าน apt ด้วย ถ้าคลังแพ็กเกจของ Ubuntu ต่อไม่ได้ ขั้นนี้เคยค้างราว 20 นาทีแล้วล้ม ทั้งที่เทสต์ยังไม่ได้รัน
      # จึงให้เวลา 3 นาที เกินนั้นหรือล้ม ให้ลงเฉพาะเบราว์เซอร์แล้วไปต่อ (ไลบรารีที่ Chromium ใช้มีใน runner อยู่แล้ว เกมโหลดฟอนต์จากเว็บ)
      - run: timeout 180 npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: layout-shots, path: shots }
